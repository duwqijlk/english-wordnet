simpleMeaning: likely to get worse or spread more widely
scope: This describes a condition that is worsening or spreading, not something busy or energetic, not
  someone taking part in an activity, not something in operation, and not the grammar or volcano senses.
examples:
- The infection is still active and spreading to new tissue.
- Doctors are monitoring the active disease in the region.
