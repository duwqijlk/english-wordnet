simpleMeaning: any of several bush plants; some lose their leaves in the cold part of the year, and some
  keep their leaves all year
scope: One of a group of bush plants, some losing their leaves each year and some keeping them all year;
  not a tall tree and not a soft-stem plant.
examples:
- A hydrangea grows by the front steps of the house.
- She planted two hydrangeas in the wet ground by the fence.
