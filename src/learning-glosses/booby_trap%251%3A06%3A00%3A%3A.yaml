simpleMeaning: A foot or a wheel pressing down sets off this hidden bomb, buried in the ground.
scope: An explosive mine hidden underground that goes off when stepped on or driven over; also called
  a land mine and a ground-emplaced mine.
examples:
- They marked the booby trap before anyone walked near it.
- A booby trap went off when the truck rolled over it.
