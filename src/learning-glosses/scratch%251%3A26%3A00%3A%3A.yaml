simpleMeaning: A raw patch of skin where the surface has been rubbed or torn away.
scope: A skin injury — another name for a scrape, abrasion or excoriation — not a groove cut into a surface
  or a general mark of damage.
examples:
- She cleaned the scratch on her knee.
- The cat left a long scratch on his arm.
