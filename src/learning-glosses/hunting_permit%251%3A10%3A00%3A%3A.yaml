simpleMeaning: For a set time, this paper lets a person shoot one kind of wild animal
scope: A paper that lets a person shoot one kind of wild animal for a set time, also called game license,
  hunting licence and hunting license; not a paper for owning a gun and not a paper for fishing.
examples:
- The hunting permit was good for the whole month.
- Without a hunting permit, he could not shoot the animal.
