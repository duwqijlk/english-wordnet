simpleMeaning: the germ that causes a serious illness with spots on the skin in people; it can be used
  as a weapon
scope: The germ that causes the illness with spots on the skin in people, also called variola virus; not
  the illness itself, and not a germ that causes a cold.
examples:
- Scientists study the smallpox virus in high-security labs.
- The smallpox virus can be used as a bioweapon, so it is kept under strict control.
