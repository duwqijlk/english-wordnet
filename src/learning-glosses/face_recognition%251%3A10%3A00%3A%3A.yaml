simpleMeaning: a way of telling who a person is by scanning them and matching the scan with stored pictures
  of known people
scope: This is telling who someone is from a scan; automatic face recognition and facial recognition are
  other names for this sense; not telling who someone is from a fingerprint and not from a spoken name.
examples:
- They used face recognition to spot known terrorists.
- Face recognition matched her scan with a stored picture.
