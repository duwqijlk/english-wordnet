simpleMeaning: In botany, a thick lump of plant tissue on its own, most of all a stiff small bump on the
  lip of an orchid
scope: A thick lump of plant tissue, most of all on an orchid; not the thick hard skin on a foot, and
  not the bone tissue that forms as a broken bone heals.
examples:
- The callus on the orchid lip was stiff to the touch.
- The orchid's callus is a small thick bump on its lip.
