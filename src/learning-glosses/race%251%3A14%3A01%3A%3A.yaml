senseId: 'race%1:14:01::'
synsetId: 08127614-n
simpleMeaning: In biology, a subgroup of a species, typically formed when a population is separated geographically
  from the rest.
scope: This is a biological subdivision of a species, not a contest of speed, not any competition, not
  a group of people believed to share a genetic stock, not the backward airflow from an aircraft propeller,
  not a water canal, and not the verbs meaning to move hurriedly, compete, work fast, or cause something
  to move fast.
examples:
- Biologists once classified the island population as a separate race of the mainland species.
- Geographic isolation can allow a local race to develop distinct traits.
