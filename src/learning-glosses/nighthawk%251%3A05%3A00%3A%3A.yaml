simpleMeaning: A bird of North America that is out and about mostly after dark, catching bugs in the air
scope: This bird of North America, out mostly after dark, is also called a bullbat or a mosquito hawk,
  not a day bird and not an owl.
examples:
- A nighthawk swooped over the field, catching moths in the dusk.
- We heard the nighthawk's call as the light failed.
