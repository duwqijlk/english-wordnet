simpleMeaning: the lining of the stomach of a ruminant (an animal that brings food back up to chew it
  again), especially a cow, used as food
scope: 'This is the food sense: stomach lining eaten as food, especially from a cow; not the living stomach
  itself and not any other part of the animal.'
examples:
- She cooked tripe in a hot, spicy soup.
- The shop sells fresh tripe for stew.
