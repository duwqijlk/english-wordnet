simpleMeaning: total and without any limit; used in everyday speech to make a word stronger, often to
  show something is bad
scope: 'This sense is also called perfect, complete, staring, and pure: it means total, not the verb senses
  of saying words or making sounds.'
examples:
- What he said was utter nonsense.
- She felt like an utter fool after the mistake.
