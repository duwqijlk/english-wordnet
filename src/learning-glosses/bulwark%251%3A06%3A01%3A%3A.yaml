simpleMeaning: a raised bank of earth built around a place to protect it from attack
scope: Also called wall and rampart, this is a raised bank of earth around a place to protect it from
  attack. It is not the stone wall that reaches into the sea to save a beach, and not the act of protecting
  something.
examples:
- Soldiers stood behind the bulwark and watched for the enemy.
- The town built a high earth bulwark around its walls to stop attacks.
