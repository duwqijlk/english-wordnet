senseId: 'casuistry%1:09:01::'
synsetId: 06169960-n
simpleMeaning: Arguing that looks clever but is false or too fine, and is meant to mislead.
scope: Arguing that looks clever but is false or too fine, and is meant to mislead; not honest arguing
  that settles a moral question, and not plain arguing about facts.
examples:
- His casuistry fooled no one.
- The casuistry in her speech hid the weak point.
