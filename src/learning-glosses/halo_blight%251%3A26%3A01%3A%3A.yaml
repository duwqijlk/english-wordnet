simpleMeaning: The leaves of oats and other grasses are harmed by this plant disease
scope: A plant disease that harms the leaves of oats and other grasses, not a disease of the roots and
  not a disease of fruit trees.
examples:
- Halo blight spread through the oat field that summer.
- The farmer lost part of his crop to halo blight.
