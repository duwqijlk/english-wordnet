senseId: 'contextual%3:01:00::'
synsetId: 03013698-a
simpleMeaning: to do with the things around something, or decided by the things around it
scope: This sense links something to the things around it, or says the things around it decide it; it
  is not a sense about a thing standing on its own with a fixed meaning.
examples:
- The meaning of the word is contextual and changes with the words around it.
- She used contextual clues in the story to work out what the old word meant.
