senseId: 'preserver%1:18:02::'
synsetId: 10486618-n
simpleMeaning: a cook who treats fruit or meat in a way that keeps it good to eat for a long time
scope: This is a person who cooks and keeps food for later use, not a worker who repairs old buildings
  or old furniture, and not a belt or jacket that keeps a person from sinking in water.
examples:
- As a preserver, she salted the meat so it would keep through the winter.
- The preserver stored the fruit in clean jars for the winter.
