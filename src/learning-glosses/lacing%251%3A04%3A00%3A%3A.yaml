simpleMeaning: The act of punishing someone by hitting them again and again
scope: The act of punishing someone by hitting them again and again, also called beating, licking, thrashing
  or whacking; not the cord pulled through holes to close a shoe.
examples:
- The boy feared a lacing if he came home late.
- In those days a lacing was a common punishment at school.
