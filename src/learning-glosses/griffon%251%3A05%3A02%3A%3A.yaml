simpleMeaning: A breed of medium-sized dog with a long head, a soft downy undercoat and a rough, wiry
  outer coat; it began in Holland but was mostly developed in France.
scope: The medium-sized dog with a long head and wiry coat, developed in France; not the tiny Belgian
  toy dog, the vulture, or the mythical eagle-lion.
examples:
- She brushed the burrs out of her griffon's wiry coat.
- Our neighbour breeds griffons with long heads and rough, wiry coats.
