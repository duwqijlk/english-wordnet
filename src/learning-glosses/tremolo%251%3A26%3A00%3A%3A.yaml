simpleMeaning: One note played over and over fast, or two notes gone back and forth between fast, makes
  this shaking sound in music.
scope: In music, this shaking sound is the effect of one note played over and over fast or of two notes
  taken in turn.
examples:
- The tremolo made the note shake.
- The passage was played with a tremolo.
