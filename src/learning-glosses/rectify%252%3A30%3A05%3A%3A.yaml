simpleMeaning: to make a thing pure and free from other matter mixed in it, by taking that other matter
  away
scope: 'Also called refine: making a thing pure, not making a person leave a wrong way of living and not
  fixing a mistake.'
examples:
- They rectify the alcohol to remove other matter mixed in it.
- The plant rectifies the oil so that only the pure part remains.
