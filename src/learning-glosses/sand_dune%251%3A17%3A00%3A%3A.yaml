simpleMeaning: a long low mound of small dry grains made by the wind, found in deserts or near lakes and
  oceans
scope: This is a long low mound of wind-made grains, also called a dune; not a hill of rock and not a
  beach.
examples:
- We climbed the sand dune to look out over the desert.
- Wind had piled the sand dune high beside the lake.
