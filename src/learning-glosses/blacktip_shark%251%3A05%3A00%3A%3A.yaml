simpleMeaning: Its fins look dark at the ends, as if dipped in ink, on this shark of shallow water found
  in seas all over the world.
scope: Also called sandbar shark, this shark lives in shallow water in seas all over the world, not in
  deep water far from shore.
examples:
- Blacktip sharks live in shallow water in many seas.
- The blacktip shark had fins that looked dark at the ends.
