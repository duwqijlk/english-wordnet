simpleMeaning: the act of keeping a person, group, or thing apart from others
scope: The act of keeping people or things apart from others. It is not the sense in the study of how
  children come to be like their parents, where paired parts split apart.
examples:
- Segregation of the jury kept its members away from the public.
- The segregation of waste into different bins keeps harmful material apart.
