simpleMeaning: A member of a Buddhist people living by the Mekong River in Thailand and the land east
  of it, speaking their own tongue; they are kin to the Thais.
scope: A member of a Buddhist people of the Mekong River in Laos and Thailand, also called Laotian; its
  near kin are the Thais, and the Lao tongue of the same name is a different sense.
examples:
- The Lao live by the Mekong River.
- A Lao man told us about his village.
