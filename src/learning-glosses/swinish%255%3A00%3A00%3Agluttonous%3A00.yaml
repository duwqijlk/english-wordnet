simpleMeaning: roughly and rudely greedy, acting like a pig
scope: This is being greedy and rude, like a pig; piggy, piggish, hoggish and porcine are other names
  for this sense, not just hunger and not the noun swinishness.
examples:
- He ate in a swinish way, grabbing at every dish before others could take any.
- Her swinish greed at the table left the other guests with little to eat.
