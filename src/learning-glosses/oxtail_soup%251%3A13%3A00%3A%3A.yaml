simpleMeaning: A hot liquid food made from the tail of a farm animal kept to pull heavy loads, with the
  skin taken off
scope: A liquid food made from the tail of a farm animal kept to pull heavy loads, not a liquid food made
  from some other meat.
examples:
- We had oxtail soup for lunch.
- The oxtail soup was rich and full of meat.
