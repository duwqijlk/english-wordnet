simpleMeaning: Run on the idea that the state or the people own the land, tools, and machines used to
  make things.
scope: Said of a thing run on shared ownership by the state or the people, not of a person who holds the
  socialistic belief.
examples:
- The farm became collectivized after the land was taken over by the state.
- Collectivized workshops shared their tools and their produce.
