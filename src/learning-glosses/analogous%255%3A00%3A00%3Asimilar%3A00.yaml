senseId: analogous%5:00:00:similar:00
synsetId: 02079377-s
simpleMeaning: 'Not fully like another thing: like it or equal to it in some ways, and different from
  it in others'
scope: 'Also called correspondent: alike in some ways but different in others; not the sense about parts
  of living things that share a job but not a starting form.'
examples:
- Brains and computers are often seen as analogous, because both take in and work with facts.
- Salmon eggs are sold as analogous to caviar, though they are not the same thing.
