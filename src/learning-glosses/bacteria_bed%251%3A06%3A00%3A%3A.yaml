simpleMeaning: A layer of sand or stones, over which dirty water is spread so air and tiny living things
  can work on it
scope: This layer of sand or stones is used to treat dirty water by air and tiny living things.
examples:
- The bacteria bed was spread with dirty water.
- Air and tiny living things work on the dirty water in the bacteria bed.
