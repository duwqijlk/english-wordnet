simpleMeaning: In law, a basic idea that lies behind the way the law is set out and built up
scope: In law, a basic idea that lies behind the way the law is set out, also called judicial principle
  or legal principle; not a single rule of law and not a court ruling.
examples:
- The judicial doctrine shaped how the court read the statute.
- Judicial doctrine guides judges when the law is unclear.
