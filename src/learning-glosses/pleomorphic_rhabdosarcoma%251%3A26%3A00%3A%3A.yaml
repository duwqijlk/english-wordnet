simpleMeaning: A kind of muscle cancer that strikes the arms and legs of older people
scope: A kind of muscle cancer in the arms and legs of older people, also called pleomorphic rhabdomyosarcoma;
  not a cancer of young people and not a cancer of other body parts.
examples:
- The doctor found a pleomorphic rhabdosarcoma in the old man's arm.
- Pleomorphic rhabdosarcoma most often strikes the limb muscles of older adults.
