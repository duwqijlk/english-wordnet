simpleMeaning: Breaking hydrogen peroxide down into oxygen and water, this enzyme, a cell chemical that
  speeds up changes set off by oxygen, is found in most plant and animal cells
scope: This enzyme is found in most plant and animal cells, where it breaks hydrogen peroxide down into
  oxygen and water, unlike other cell chemicals that do not touch it.
examples:
- Catalase breaks hydrogen peroxide down into oxygen and water.
- Most plant and animal cells hold catalase.
