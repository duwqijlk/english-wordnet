senseId: 'nanosecond%1:28:00::'
synsetId: 15260812-n
simpleMeaning: one of a billion equal parts of a second; also one of a thousand equal parts of a microsecond
  (one millionth of a second)
scope: A unit for measuring very short time; it is much shorter than a microsecond or a millisecond, which
  are larger parts of a second.
examples:
- The computer can finish this step in a few nanoseconds.
- Light moves about thirty centimetres in one nanosecond.
