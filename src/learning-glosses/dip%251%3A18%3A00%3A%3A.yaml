simpleMeaning: a person who steals from the pockets or purses of other people in public places
scope: This is a person who steals in public places; it is not a candle, not a sudden fall in an amount,
  and not a sauce for food.
examples:
- The police caught a dip working in the busy market.
- A dip took money from a man's pocket on the crowded bus.
