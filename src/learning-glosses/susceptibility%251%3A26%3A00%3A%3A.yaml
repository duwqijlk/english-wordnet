simpleMeaning: the state of being easily changed or harmed by things around you
scope: This is how easily a person or thing can be changed or harmed. It is not the change or harm itself,
  and not being strong against harm.
examples:
- His susceptibility to colds means he is often ill in winter.
- Plants differ in their susceptibility to dry weather, and some die quickly without rain.
