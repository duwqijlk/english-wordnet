simpleMeaning: a thick soft covering worn by the player who guards the goal in hockey
scope: A thick soft covering worn by a hockey goalkeeper, not a shin guard for the legs and not a helmet
  for the head.
examples:
- The goalie put on his body pad before the game.
- The body pad cushioned the blow from the puck.
