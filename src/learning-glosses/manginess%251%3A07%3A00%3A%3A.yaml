simpleMeaning: A lack of smart looks that comes from wearing worn-out or dirty clothes
scope: Also called shabbiness; a lack of smart looks from worn-out or dirty clothes, not dirt itself and
  not old age.
examples:
- His manginess came from years in the same torn coat.
- The tramp's manginess showed in his dirty clothes.
