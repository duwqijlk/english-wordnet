simpleMeaning: one of many copies of the same written message, sent by post to everyone on a list
scope: One of many copies of the same written message sent to everyone on a list, not a note written by
  hand for one person and not a card sent to a single reader.
examples:
- The bank sent a form letter to all its customers about the new charges.
- We got the same form letter as every other family on the street.
