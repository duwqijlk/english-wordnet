simpleMeaning: any of several tree-like herbs of the genus Musa from tropical and subtropical regions,
  with a crown of large undivided leaves and usually hanging bunches of long fruit.
scope: The plant sense, the tree-like herb that bears the fruit, not the fruit itself; banana is another
  name for it.
examples:
- A banana tree stood at the corner of the yard, its broad leaves rattling in the wind.
- The farmer cut down the old banana tree after it had fruited.
