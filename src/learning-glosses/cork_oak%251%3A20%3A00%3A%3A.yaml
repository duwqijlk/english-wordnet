simpleMeaning: a medium-sized evergreen oak from southern Europe and northern Africa with thick bark that
  is cut away regularly to make cork
scope: The tree that the cork industry harvests bark from; not the cork material itself or a bottle stopper.
examples:
- The cork oak is stripped of its bark every few years.
- Cork oak woods cover large areas of southern Portugal.
