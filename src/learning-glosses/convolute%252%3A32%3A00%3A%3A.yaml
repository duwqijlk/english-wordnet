senseId: 'convolute%2:32:00::'
synsetId: 00934760-v
simpleMeaning: to argue in a clever but untrue way, changing what words mean or keeping them unclear,
  to trick or fool others
scope: 'Also called twist, sophisticate and pervert: this is twisting words in an argument to fool someone,
  not bending or rolling a real thing.'
examples:
- Do not convolute my words just to win the argument.
- He tried to convolute the plain facts until no one knew what they meant.
