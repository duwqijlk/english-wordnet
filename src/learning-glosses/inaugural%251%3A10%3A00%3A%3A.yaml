simpleMeaning: a speech given at a ceremony for a person starting a new job in power, especially by a
  United States president
scope: This is a speech, especially by a United States president, at a ceremony for a person starting
  in power, not the describing word for things linked to such a ceremony.
examples:
- The president's inaugural was watched by millions on television.
- In his inaugural, the new president spoke about hope and work for all.
