simpleMeaning: a short time when you do what you feel like doing, without holding back
scope: 'Also called a fling: a short time of doing what you feel like, not the verb sense of taking part
  in an activity without holding back, as when shopping.'
examples:
- Their drinking spree lasted all weekend.
- After saving for months, he had a spending spree in the city.
