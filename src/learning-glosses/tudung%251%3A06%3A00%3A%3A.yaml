simpleMeaning: a scarf worn round the head by Muslim women in Malaysia, which hides the hair but not the
  face
scope: A scarf worn round the head by Muslim women in Malaysia that hides the hair but leaves the face
  clear; not a veil that covers the face and not a hat.
examples:
- She put on her tudung before she left the house.
- Her tudung hid her hair but left her face clear.
