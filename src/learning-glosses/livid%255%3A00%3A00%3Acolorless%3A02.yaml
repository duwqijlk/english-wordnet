simpleMeaning: with the colour drained from the face by illness or strong feeling
scope: A face drained of colour by illness or strong feeling; white and ashen are other names for this
  sense, not a bruise and not a light that looks deathly pale.
examples:
- Her face turned livid with shock.
- His livid lips trembled as he tried to speak.
