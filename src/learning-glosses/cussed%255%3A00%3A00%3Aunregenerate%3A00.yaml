simpleMeaning: keeping on doing wrong and refusing to change
scope: 'Also called obstinate, unrepentant, and obdurate: it describes a person who keeps doing wrong
  and will not change. It is not just refusing to give up on a good or harmless task.'
examples:
- The cussed thief kept stealing from his neighbours and never said he was sorry.
- Even after many warnings, the cussed man went on lying to everyone.
