simpleMeaning: Prickly leaves grow on this bushy plant of the salt marshes and sea beaches of the Old
  World, burned to make a rough soda ash.
scope: Also called barilla, kali, kelpwort and saltwort, this is a bushy plant of salt marshes, not the
  fleshy glasswort of the seashore.
examples:
- Glasswort grew thick on the salt marsh near the sea.
- They burned glasswort to make soda ash.
