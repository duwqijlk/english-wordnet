scope: A soft rub for the skin, made with extract of a tree seed, to ease pain in muscles and joints;
  horse balsam and horse chestnut balm are other names for this sense, not a pill and not a bandage.
examples:
- She spread horse chestnut cream over her sore calves.
- He rubbed horse chestnut cream into his aching knees after a long walk.
