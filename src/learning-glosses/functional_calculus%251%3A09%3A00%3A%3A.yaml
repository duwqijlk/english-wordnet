simpleMeaning: A set of signs and rules in logic that stands for things, what is said of them, how many
  are meant, and how claims link to each other
scope: This is a set of signs and rules in logic for things and what is said of them; predicate calculus
  is another name for this sense, not the study of change in maths and not plain speech.
examples:
- Functional calculus lets us write 'all dogs bark' with signs.
- She studied functional calculus to learn how logic treats things and claims.
