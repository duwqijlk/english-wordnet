simpleMeaning: A microphone and a power box are built into this small thing you carry, so a crowd far
  off can hear what you say
scope: Another name for a bullhorn and a loud-hailer, this is the hand-held device you speak into to reach
  a crowd, not a speaker fixed to a wall.
examples:
- She used a loud hailer to call the children in from the field.
- The lifeguard raised his loud hailer and told everyone to leave the water.
