simpleMeaning: to start to exist or to have a starting point, whether in time, in place, or in a range
  of values.
scope: This is not about a person setting an activity going; it describes a thing or event that has its
  own starting point.
examples:
- The concert begins at eight, so we should arrive early.
- The hiking trail begins just past the old bridge.
