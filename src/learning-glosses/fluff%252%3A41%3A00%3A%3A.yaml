simpleMeaning: to do something so badly that it is spoiled or ruined
scope: 'Also called blow, fumble, and spoil: to do something so badly that it is spoiled, not the noun
  for a blunder and not the act of making hair stand up.'
examples:
- I fluffed the dinner and we had to eat out.
- The pianist fluffed the difficult passage in the second movement.
