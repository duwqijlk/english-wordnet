scope: The name given to the rulers of the Holy Roman Empire and to the rulers of Austria and Germany
  until 1918, among other names given to rulers, such as emperor and king.
examples:
- The Kaiser ruled Germany until 1918.
- Wilhelm was the last Kaiser of Germany.
