simpleMeaning: Grown to be looked at, this plant has leaves marked in white, pink, or red, in many different
  patterns.
scope: A plant grown to be looked at for its leaves patterned in white, pink, or red, not a plant grown
  for its flowers.
examples:
- The caladium had leaves splashed with pink and white.
- She planted caladium for its patterned leaves.
