senseId: 'stultify%2:30:00::'
synsetId: 00226258-v
simpleMeaning: To leave a thing weak and powerless, good for nothing and of no worth.
scope: 'Also called cripple: to take away the strength or power of a thing so it is of no use, not to
  show that a person is of unsound mind.'
examples:
- This measure stultified our efforts to finish the work.
- Their behaviour stultified the boss's hard work.
