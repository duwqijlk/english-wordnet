simpleMeaning: A seed from a tropical American tree; ground after roasting, the seeds give chocolate.
scope: A seed from a tropical American tree that gives chocolate when ground after roasting, also called
  a cocoa bean; not a coffee seed and not a nut.
examples:
- Farmers dry the cacao bean in the sun.
- The cacao bean gives chocolate when ground after roasting.
