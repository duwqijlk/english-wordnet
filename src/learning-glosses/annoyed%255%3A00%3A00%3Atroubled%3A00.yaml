senseId: annoyed%5:00:00:troubled:00
synsetId: 02464897-s
simpleMeaning: Worn down again and again over time, most of all by small things that keep bothering you
scope: This is being worn down by small troubles over time, not a quick flash of anger at one thing.
examples:
- She felt annoyed by the dripping tap that kept her awake each night.
- He grew annoyed at the constant small delays on his way to work.
