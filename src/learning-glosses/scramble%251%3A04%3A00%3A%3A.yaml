senseId: 'scramble%1:04:00::'
synsetId: 00557179-n
simpleMeaning: a fast, hurried rush about in a way that looks silly and not serious
scope: This is a fast, hurried rush about that looks silly and not serious; not a messy struggle with
  no order, and not climbing in a clumsy way.
examples:
- When the doors opened, there was a scramble across the hall, with everyone rushing and looking silly.
- In the scramble to leave the bus, Tom ran fast and nearly fell, with no care for how he looked.
