simpleMeaning: A follower of the teachings of Socinus, a Christian who denies that Christ is God, denies
  the Trinity, and denies original sin; his ideas shaped Unitarian thought.
scope: A follower of Socinus, not a Catholic and not a modern Unitarian.
examples:
- The Socinian denied the divinity of Christ.
- A Socinian preacher taught in the town.
