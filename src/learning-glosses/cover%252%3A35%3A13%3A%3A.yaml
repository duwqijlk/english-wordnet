simpleMeaning: put something over a thing the way a burial cloth is laid over a body.
scope: This is not a lid fitted to a container or a protective material; it is something spread over a
  thing like a burial cloth.
examples:
- Mist covered the lake so completely that we could not see the far shore.
- A dark cloud covered the moon and the garden went black.
