senseId: 'rhetorical_device%1:10:00::'
synsetId: 07112859-n
simpleMeaning: a way of using words to make writing or speech stand out, often with little care for what
  the words mean word for word
scope: A way of using words for effect in writing or speech, not plain talk that means just what it says
  and not a grammar rule.
examples:
- Metaphor is a rhetorical device that compares one thing to another.
- The speech was full of rhetorical devices that moved the crowd.
