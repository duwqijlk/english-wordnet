simpleMeaning: A shot in golf that bends to the left when hit by a right-handed player.
scope: A curving golf stroke; not a game that ends with equal scores and not the football play of the
  same name.
examples:
- His tee shot turned into a gentle draw that rolled onto the fairway.
- She uses a draw to follow the curve of that dogleg.
