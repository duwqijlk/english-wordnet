simpleMeaning: The thin stem that holds up the flat blade of a plant
scope: The thin stem that holds a leaf's blade; petiole is another name for this sense, not the blade
  itself and not the main stem of the plant.
examples:
- The leafstalk bends where it joins the blade.
- A long leafstalk held the big blade up to the light.
