simpleMeaning: In genetics, a going back to the normal form of a living thing, usually after a second
  change in its genes.
scope: In genetics, a return to the normal form of a living thing, not the legal sense of an estate passing
  back to its first owner.
examples:
- The scientists noted a reversion to the normal form in the second group of flies.
- A reversion in the bacteria restored the usual form of the cells.
