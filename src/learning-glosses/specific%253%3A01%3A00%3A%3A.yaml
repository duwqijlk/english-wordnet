simpleMeaning: belonging to one exact kind of animal or plant in science.
scope: This is a scientific word for one exact kind of living thing, not a general word for a particular
  detail and not a special quality.
examples:
- The specific name of the plant is written in Latin.
- Biologists give every kind of beetle its own specific name.
