simpleMeaning: A wiry evergreen shrub with hanging clusters of white or pink flowers, growing in wet sour
  ground from the Arctic and Canada to the northeast of the United States.
scope: 'Also called bog rosemary and moorwort: a wiry evergreen shrub of wet sour ground, not a garden
  rose and not a dry-land shrub.'
examples:
- Andromeda glaucophylla flowered white beside the cold northern bog.
- We found Andromeda glaucophylla in the wet ground near the lake.
