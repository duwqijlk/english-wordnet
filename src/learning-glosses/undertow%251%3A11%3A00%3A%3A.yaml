simpleMeaning: a flow of water under the surface that moves out to sea after waves have hit the shore
scope: This sense is the real flow of water at the sea, not the sense about a hidden feeling that goes
  against the main feeling.
examples:
- The strong undertow pulled sand out to sea after each wave broke.
- Swimmers were warned that the undertow could carry them away from the shore.
