simpleMeaning: in a way that is fair, honest, and worthy of respect
scope: In a fair and honest way; close to the other sense of honorably that means in an honorable manner,
  and not done in a dishonest or shameful way.
examples:
- He was honorably discharged after many years of service.
- She acted honorably and told the truth even when it cost her money.
