simpleMeaning: a seed part in a plant turned all the way round, so it points back down along its stalk
scope: A seed part in a plant turned right round on its stalk; not a seed part that points up or out,
  and not the word used to describe such a turn.
examples:
- The anatropous ovule hung down from its stalk.
- Each anatropous ovule in the flower points back toward its own stalk.
