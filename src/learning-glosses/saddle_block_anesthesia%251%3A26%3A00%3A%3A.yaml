senseId: 'saddle_block_anesthesia%1:26:00::'
synsetId: 14053168-n
simpleMeaning: Into the cord down the back goes a shot that deadens feeling, so a patient feels nothing
  where the body would touch the seat of a horse.
scope: This sense is also called saddle block anaesthesia.
examples:
- The saddle block anesthesia made the patient numb.
- The patient felt no pain once the saddle block anesthesia took hold.
