simpleMeaning: A pan that gives baked food its shape, made in many shapes and sizes.
scope: Pans or forms used to shape baked goods, also called a baking form, baking mold, baking mould,
  cake mould and cake tin; not a baking sheet and not a mixing bowl.
examples:
- She greased the cake mold before pouring the batter.
- The cake mold gives the loaf its round shape.
