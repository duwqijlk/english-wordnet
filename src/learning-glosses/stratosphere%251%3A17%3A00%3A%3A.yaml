simpleMeaning: the layer of air around the earth that sits above the lower layer (the troposphere) and
  below the higher layer (the mesosphere)
scope: This is the layer of air between the troposphere below and the mesosphere above; it is not the
  lower air where weather happens and not the layers higher up.
examples:
- Planes that fly very high can reach the lower part of the stratosphere.
- Ozone in the stratosphere helps block harmful light from the sun.
