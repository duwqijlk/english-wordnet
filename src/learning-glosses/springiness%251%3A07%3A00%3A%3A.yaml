senseId: 'springiness%1:07:00::'
synsetId: 05028317-n
simpleMeaning: The power that lets a thing pulled out of shape spring back to the length it had.
scope: Also called give and spring, the power of a thing to stretch and then go back to the length it
  had.
examples:
- The springiness of the new mattress made it bounce back at once.
- They tested the springiness of the rubber band by pulling it long.
