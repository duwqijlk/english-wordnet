simpleMeaning: A thick strong grass from the Old World, grown far and wide for hay and for animals to
  graze.
scope: This is a thick strong grass from the Old World, grown far and wide for hay and for animals to
  graze; cockspur and orchard grass are other names for it, not a thin weak grass and not a grass grown
  only for lawns.
examples:
- The field of cocksfoot gave good hay that year.
- Cocksfoot grows thick and strong in old pastures.
