simpleMeaning: any of several creatures, such as insects, grubs, or soft-bodied animals, that cut tunnels
  into wood
scope: Any of several creatures that cut tunnels into wood, not a creature that eats leaves and not a
  worm that lives in soil.
examples:
- The borer had cut tunnels through the old fence post.
- A borer in the oak tree left tiny holes in the bark.
