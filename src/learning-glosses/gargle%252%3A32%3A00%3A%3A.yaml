senseId: 'gargle%2:32:00::'
synsetId: 01061817-v
simpleMeaning: to say something with a bubbling sound in the throat
scope: To speak with a bubbling sound in the throat, not to wash the mouth and throat with a liquid, and
  not the liquid or the sound used on its own.
examples:
- He gargled his words through a mouthful of water, so no one could understand him.
- She gargled a short reply with water still in her throat.
