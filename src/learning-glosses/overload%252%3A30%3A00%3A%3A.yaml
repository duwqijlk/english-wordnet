simpleMeaning: To put too much into a thing until it stops working as it should
scope: To fill a thing too full until it fails; clog is another name for this sense, not the noun sense
  of too great a load of power and not simply to load a thing.
examples:
- Do not overload the circuit, or the lights will go out.
- He overloaded his mind with too many details and forgot the main point.
