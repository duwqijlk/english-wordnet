simpleMeaning: the habit of often refusing to do what you are told and of acting without order or control
scope: 'Also called willfulness: the habit of often refusing to obey, not a single act of disobedience
  and not mere high spirits.'
examples:
- The teacher grew tired of the child's fractiousness.
- His fractiousness made every lesson hard to run.
