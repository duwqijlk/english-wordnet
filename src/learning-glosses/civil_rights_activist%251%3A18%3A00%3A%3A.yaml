simpleMeaning: a person who leads the push to win fair chances for people in small groups with less power
scope: This is a person who leads the push for fair chances for people in groups with less power; civil
  rights leader and civil rights worker are other names for this sense, not a person who only backs the
  push.
examples:
- The civil rights activist led the march for fair voting.
- She became a civil rights activist after years of work in her town.
