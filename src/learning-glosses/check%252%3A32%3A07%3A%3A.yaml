simpleMeaning: To write out an order telling a bank to pay money from an account.
scope: 'This is the verb for writing out a bank check, not the noun for the slip of paper and not the
  everyday sense of inspecting. It is also not the sense of marking cloth or paper into squares and not
  the sense of training a child or animal. Dated: modern English normally uses the noun and says ''write
  a check'', and the few surviving examples are old-fashioned or legal in tone.'
examples:
- He checked the rent to his landlord at the end of every quarter.
- The firm checked the sum to the builder and filed the stub.
