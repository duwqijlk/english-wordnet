simpleMeaning: A regular sum paid each month to a person who has stopped working for good.
scope: This is a regular sum paid each month to a person who has stopped work, not money put by while
  still working; it is also called retirement benefit, retirement check, and retirement fund.
examples:
- She lives on her retirement pension.
- His retirement pension is paid on the first of the month.
