simpleMeaning: the bony skull section in an animal with a backbone that borders the mouth and anchors
  the teeth
scope: This is the skull structure that frames the mouth, not the near-identical sense for the bones that
  open it, nor a gripping part of a tool.
examples:
- The X-ray showed the jaw still holding the broken teeth in place.
- A fish's jaw forms a bony frame around its mouth.
