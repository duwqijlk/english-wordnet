simpleMeaning: a loose piece of cloth along the edge of a piece of clothing, used in clothing from the
  Middle Ages
scope: This is a loose flap on old clothing, also called dag; it is not a slit that shows another colour
  underneath and not the act of cutting teeth into something.
examples:
- The man's coat had a jag hanging along its edge, as in old pictures.
- In medieval dress, a jag was cut along the hem of the sleeve.
