simpleMeaning: a room, a seat, or a place that you have arranged ahead of time to use, such as on a plane
  or in a hotel
scope: This is the room, seat, or place itself that you have arranged ahead of time, not a quiet doubt
  and not the written note that shows the booking.
examples:
- We have a reservation for two nights at the hotel.
- Her reservation is for the evening flight to London.
