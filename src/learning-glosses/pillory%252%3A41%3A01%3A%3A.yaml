simpleMeaning: To hold a person up so that others laugh at them and scorn them in public.
scope: To put a person before the public to be laughed at and scorned, also called a gibbet; not the wooden
  frame, not harsh blame in words, and not the punishment itself.
examples:
- The pamphlet pilloried the mayor before the whole town.
- He feared the papers would pillory him.
