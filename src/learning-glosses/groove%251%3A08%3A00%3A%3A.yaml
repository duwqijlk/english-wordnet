simpleMeaning: In the body, any long narrow hollow or cut on a part
scope: In the body, a long narrow hollow or cut on a part, not a dull daily round, not a cut in a tool
  or surface, and not the act of cutting one.
examples:
- The surgeon found a groove on the surface of the bone.
- A groove runs along the top of the skull.
