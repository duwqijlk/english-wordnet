simpleMeaning: the large main tube that carries blood from the lower left part of the heart to the smaller
  tubes that carry blood to all parts of the body
scope: This is the body's large main blood tube leaving the heart; it is not a vein, which carries blood
  back to the heart, and not one of the smaller tubes branching from it.
examples:
- Blood leaves the heart through the aorta.
- The surgeon checked the aorta for any swelling.
