simpleMeaning: Any of a few small fresh-water fish that catch bugs by squirting water at them and knocking
  them into the water; they live in Indonesia and Australia.
scope: Any of a few small fresh-water fish, also called archerfish, that catch bugs by squirting water
  at them and knocking them into the water, from Indonesia and Australia.
examples:
- Toxotes jaculatrix squirts water at insects to knock them down.
- We watched Toxotes jaculatrix knock a fly into the water.
