simpleMeaning: being unable to move because the muscles are stopped from working for a short time
scope: 'Another name for this state is akinesis: a body unable to move for a short time, not a body frozen
  in place for good and not a state of being asleep.'
examples:
- After the injury, her akinesia left her unable to lift her arm.
- The doctor said the akinesia would pass once the drug wore off.
