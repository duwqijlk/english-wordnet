simpleMeaning: A small finback of the seas near the shore, in the Atlantic and in the Pacific.
scope: This is a small finback of the seas near the shore in the Atlantic and the Pacific; lesser rorqual
  and minke whale are other names for this sense, not a great whale of the deep sea and not a finback
  of other seas.
examples:
- The piked whale swam close to the shore.
- Piked whales live in the Atlantic and the Pacific.
