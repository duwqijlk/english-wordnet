simpleMeaning: A knob you turn to change how high or low the strings of an instrument sound
scope: A knob turned to change the pitch of strings, not a wooden pin and not the oar holder.
examples:
- She turned the peg to tune the violin string.
- A loose peg made the guitar go out of tune.
