simpleMeaning: a thick mass of fine threads that joins into a root-like cord, found in many fungi
scope: Not a true root, and not a single thread; a thick cord of threads made by fungi.
examples:
- A rhizomorph spread through the damp wood.
- The fungus sent out a rhizomorph to find food.
