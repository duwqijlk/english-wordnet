simpleMeaning: any of several kinds of soil made of very fine grains, which turns into thick, sticky mud,
  much like wax, when it is full of water
scope: Also called gumbo soil. This is a kind of earth that turns into sticky mud when wet, not the soup
  or stew made thick with okra, and not the green pods used in that dish.
examples:
- After the rain, the gumbo in the field was too sticky to walk on.
- The road crossed flat land covered with gumbo that stuck to our boots.
