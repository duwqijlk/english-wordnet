schema: oewn-learning-gloss-v2
senseId: 'gum%2:35:00::'
synsetId: 01366722-v
simpleMeaning: to cover, fill, fix in place, or spread over a surface with a sticky substance, or with
  something like it
scope: To put a sticky substance on or over something to cover, fill or hold it, not to chew without teeth
  and not the sticky substance itself.
examples:
- He gummed the label to the box.
- If you gum the tape, it holds more strongly.
