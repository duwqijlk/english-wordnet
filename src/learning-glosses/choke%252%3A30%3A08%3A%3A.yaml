simpleMeaning: to be held back and unable to grow or develop as you should
scope: This is being stopped from growing or making new things, not stopping another person or thing from
  growing and not stopping breathing.
examples:
- He choked at home, living with his parents in a tiny village, with no chance to grow or develop.
- She choked in a job that held her back and let her develop none of her skills.
