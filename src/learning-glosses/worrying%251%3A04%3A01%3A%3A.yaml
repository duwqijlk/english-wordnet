simpleMeaning: Pulling or pushing at a thing again and again to move it.
scope: Moving a thing with repeated pulls and pushes, not the feeling of being troubled by bad news.
examples:
- Vigorous worrying finally loosened the saw.
- The worrying of the nail went on until it came free.
