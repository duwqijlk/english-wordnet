simpleMeaning: Powder left when hard body parts burn, rich in calcium phosphate, used to feed plants and
  to make fine china.
scope: Powder from burned hard body parts, used to feed plants and to make fine china.
examples:
- Bone ash was spread on the fields to feed the soil.
- They mixed bone ash into the clay for fine china.
