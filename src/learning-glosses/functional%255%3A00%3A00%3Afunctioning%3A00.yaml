simpleMeaning: Able to run and do its work, said of a machine or a like thing.
scope: 'Also called running and working: able to run and do its work, said of a machine or a like thing,
  not a thing made for one special use, and not a body part working as it should.'
examples:
- The old radio is still functional after all these years.
- They checked that the brakes were functional before the trip.
