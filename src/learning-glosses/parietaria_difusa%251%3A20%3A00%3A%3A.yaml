senseId: 'parietaria_difusa%1:20:00::'
synsetId: 12415155-n
simpleMeaning: A plant with soft stems that grows in cracks, with long thin leaves and small pink flowers
  that have no petals.
scope: Also called pellitory, pellitory-of-the-wall, and wall pellitory; a plant of cracks and gaps, set
  apart from garden herbs by its thin leaves and flowers with no petals.
examples:
- Parietaria difusa was growing out of a crack in the old stone wall.
- We found Parietaria difusa with its small pink flowers between the paving stones.
