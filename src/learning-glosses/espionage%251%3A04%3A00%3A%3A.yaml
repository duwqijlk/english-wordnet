simpleMeaning: the use of spies in a planned way to get secret facts about a country's fighting forces
  or its government and politics
scope: The planned use of spies to get secret facts about a country's fighting forces or its government
  and politics; not open study of public facts and not fighting in a war.
examples:
- He was sent to prison for espionage against his own country.
- She worked in espionage and passed secret plans to another country.
