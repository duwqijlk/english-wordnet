simpleMeaning: A drawn record of the electric activity of the back of the eye when light is flashed into
  it.
scope: A drawn record of eye activity after a flash of light, not a picture of the eye and not a hearing
  test.
examples:
- The electroretinogram showed how the retina answered the flash of light.
- Doctors use an electroretinogram to test the back of the eye.
