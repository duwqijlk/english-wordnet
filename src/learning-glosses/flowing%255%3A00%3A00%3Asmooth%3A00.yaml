simpleMeaning: made or set out so that liquid or gas can pass with the least push against it
scope: 'Also called sleek: made so liquid or gas passes easily, not the moving of liquid or gas itself.'
examples:
- The boat's flowing sides let it move through the water with little push against it.
- The plane was given a flowing shape so air could pass it easily.
