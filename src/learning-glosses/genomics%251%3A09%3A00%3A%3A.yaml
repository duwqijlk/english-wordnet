simpleMeaning: a part of the study of genes, which decide how a living thing grows and looks, that studies
  living things through all their DNA, in its full order
scope: This is a part of the study of genes that looks at the whole set of DNA in a living thing; it is
  not the study of one small part of it alone.
examples:
- She studies genomics at the university.
- New tools in genomics help scientists read all the DNA of a plant.
