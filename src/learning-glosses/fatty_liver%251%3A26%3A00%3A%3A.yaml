senseId: 'fatty_liver%1:26:00::'
synsetId: 14140154-n
simpleMeaning: a liver that turns yellow as some fats, called triglycerides, build up in it; it can come
  from drinking that harms the liver, from being pregnant, or from some poisons
scope: A liver turned yellow by fats building up in it, not a healthy liver and not a liver swollen by
  infection.
examples:
- The scan showed a fatty liver after years of heavy drinking.
- Her fatty liver was found during a routine check.
