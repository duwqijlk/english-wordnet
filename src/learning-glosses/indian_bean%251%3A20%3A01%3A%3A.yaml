simpleMeaning: A twining vine of the Old World tropics with three-part leaves and purple pea-like flowers,
  dark-red pods of edible seeds, for show and food in South Asia, in Dolichos sometimes.
scope: Not the Catalpa tree of the same name, nor other climbing food plants; also called bonavist, hyacinth
  bean, Dolichos lablab, Egyptian bean, and Lablab purpureus.
examples:
- The Indian bean climbs over the fence in our garden.
- We cook Indian bean pods as a vegetable.
