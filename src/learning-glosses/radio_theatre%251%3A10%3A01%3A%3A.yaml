simpleMeaning: People listen to a story told only in voices and sounds, sent out on the airwaves or put
  on tape or CD, with nothing to see.
scope: This play is also called audio drama, radio drama, and radio theater.
examples:
- We heard a radio theatre play and followed every word.
- They tuned in to a radio theatre play.
