simpleMeaning: a sudden and strong breaking down or falling of something
scope: 'Also called fiasco: a sudden, strong breaking down, not flooding caused by ice breaking up in
  a river in spring or summer.'
examples:
- The old building came down in a sudden debacle of stone and dust.
- The roof gave way in a debacle, and the whole hall fell in seconds.
