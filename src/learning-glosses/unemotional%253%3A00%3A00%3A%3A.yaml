simpleMeaning: not easily made to feel things, having no feelings, or showing no feelings
scope: This describes a person or a voice that shows no feelings, not a person who shows feelings strongly,
  and not just a person who is quiet.
examples:
- He stayed unemotional when he heard the bad news.
- She gave an unemotional answer and did not smile or cry.
