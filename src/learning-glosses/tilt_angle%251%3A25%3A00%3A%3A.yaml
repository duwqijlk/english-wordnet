simpleMeaning: how far a rocket leans away from straight up as it bends along its path
scope: The lean of a rocket from straight up as it bends along its path, not a fixed lean set before launch
  and not the tilt of a plane in flight.
examples:
- The tilt angle grew as the rocket bent away from the vertical.
- Engineers watched the tilt angle change during the rocket's climb.
