simpleMeaning: To see or show how two things are related, whether as ideas or as cause and result.
scope: About perceiving or explaining a relation between facts, events or ideas, not physically joining
  objects or catching a scheduled service.
examples:
- She connected the headache to the new medication.
- The detective connected the two robberies through the same getaway car.
