simpleMeaning: In logic and mathematics, a link from a thing back to itself
scope: 'Also called reflexiveness: in logic and mathematics, a link a thing has to itself, not the grammar
  sense of a word like ''himself'' pointing back, and not a link between two different things.'
examples:
- Equality shows reflexivity, since every number is equal to itself.
- The reflexivity of 'is the same size as' means each thing is the same size as itself.
