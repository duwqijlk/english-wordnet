simpleMeaning: An insect, one of many kinds, that comes out mostly at night; the kinds that live in houses
  are pests.
scope: A night insect, also called a cockroach, and not a fish or the end of a cigarette.
examples:
- A roach ran across the kitchen floor at night.
- Roaches hide in warm dark places in the house.
