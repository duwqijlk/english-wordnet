simpleMeaning: making people feel strong interest, strong wish to know more, or strong feelings
scope: This means making people take strong interest or feel much; it is not the sense about the body's
  power to feel things.
examples:
- The sensational news made everyone want to know more.
- It was a sensational story that left readers shocked and sad.
