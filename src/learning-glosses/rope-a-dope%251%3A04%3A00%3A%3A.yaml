simpleMeaning: a boxing trick in which a fighter acts trapped against the ropes while the other fighter
  tires himself out throwing punches
scope: A boxing trick of acting trapped to tire the other fighter out, not a real knock-out and not a
  way of dodging punches.
examples:
- He used rope-a-dope to tire out his opponent.
- The boxer leaned on the ropes in rope-a-dope and waited.
