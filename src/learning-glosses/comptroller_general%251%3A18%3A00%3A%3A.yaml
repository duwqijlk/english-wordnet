simpleMeaning: a federal official in the United States who checks government spending and settles claims
  against the government
scope: A top United States federal official who watches over government spending and settles claims; not
  a state official and not a tax collector.
examples:
- The comptroller general issued a report on wasteful spending.
- Congress asked the comptroller general to review the agency's books.
