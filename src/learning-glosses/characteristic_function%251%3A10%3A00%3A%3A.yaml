senseId: 'characteristic_function%1:10:00::'
synsetId: 07013853-n
simpleMeaning: In electronics, a drawing that shows how one feature of a device changes as other measures
  change
scope: In electronics, a drawing that shows how one feature of a device changes; characteristic curve
  is another name for this sense, not a drawing of the device itself and not a list of numbers.
examples:
- The characteristic function shows how the device acts as the heat rises.
- On the characteristic function you can see the change at a glance.
