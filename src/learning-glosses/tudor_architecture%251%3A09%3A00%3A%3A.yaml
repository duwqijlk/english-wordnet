simpleMeaning: A way of building in the English-Gothic style, liked in England from the late 1400s to
  the early 1600s and known for houses with wood frames showing on the outside
scope: A way of building in the English-Gothic style from the late 1400s to the early 1600s, known for
  houses with wood frames showing on the outside; not other Gothic building styles without such wood-framed
  houses.
examples:
- Tudor architecture can be seen in the old college halls of Oxford.
- The black-and-white front is a mark of Tudor architecture.
