simpleMeaning: the way a person acts with care and kindness toward other people, and feels for them when
  they hurt
scope: Being kind and caring toward others, not all the people on earth, and not just being a person.
examples:
- Her humanity showed in the way she cared for strangers in need.
- The humanity of the doctor gave hope to patients who had none.
