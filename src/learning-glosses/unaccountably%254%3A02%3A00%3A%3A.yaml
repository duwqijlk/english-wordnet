senseId: 'unaccountably%4:02:00::'
synsetId: 00484790-r
simpleMeaning: in a way that no one can explain or give a reason for
scope: Done or happening with no reason that anyone can give; not about a person being made to answer
  for what they did.
examples:
- The lights went out unaccountably in the middle of dinner.
- In the book, a rich man unaccountably becomes the hero's friend.
