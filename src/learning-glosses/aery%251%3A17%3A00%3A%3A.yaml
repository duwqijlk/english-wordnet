simpleMeaning: A hawk or an eagle builds this nest high up, as do other birds that hunt other animals.
scope: Also called eyrie, aerie, and eyry, this nest sits high up and belongs to a bird that hunts other
  animals, such as a hawk or an eagle.
examples:
- High on the cliff, the aery held young eagles.
- The hawk returned to its aery at dusk.
