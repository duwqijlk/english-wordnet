simpleMeaning: Any plant of the group Chloris, found in short turf, above all on unused ground or poor
  soil
scope: This is a plant of the group Chloris in short turf; not the creeping lawn grasses that root freely
  and spoil lawns.
examples:
- Finger grass covered the dry field.
- The farmer cut the finger grass back.
