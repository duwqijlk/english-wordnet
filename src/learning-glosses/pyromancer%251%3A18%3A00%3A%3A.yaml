simpleMeaning: a person who tells what will happen in the future by using fire
scope: This is a person who uses fire to try to tell the future, not a person who starts fires and not
  a person who studies fire for science.
examples:
- The old pyromancer looked at the flames and spoke about the future.
- People went to the pyromancer to hear what the fire would show.
