simpleMeaning: Fur lined the inside of this coat of the 1500s, and braid ran along its edges.
scope: This coat of the 1500s is also called a chamarre or a chimer.
examples:
- The traveller wore a simarre lined with fur and trimmed with braid.
- Braid edged the simarre, and fur lined the inside of the coat.
