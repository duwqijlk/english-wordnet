simpleMeaning: A small slim African monkey with long back legs and a long tail, and long hair round its
  face
scope: This is a small slim African monkey with long back legs and tail and long hair round its face;
  guenon monkey is another name for this sense, not a large African monkey and not a monkey with a short
  tail.
examples:
- A guenon leapt from branch to branch in the forest.
- The guenon watched us with its long hair framing its face.
