simpleMeaning: a small strong horse that can live well out in the open flat land in the west, from horses
  brought there by people from Spain
scope: This is the small strong horse that lives out in the open in the west, not a horse kept by people
  for work or riding.
examples:
- A mustang ran across the open flat land with its young.
- The mustangs live out in the west and are not kept by people.
