simpleMeaning: the curved line where two arched ceilings meet and cross
scope: A curved edge where two arched ceilings meet, not the part of the body near the top of the leg
  and not a wall built out into the sea.
examples:
- The groin of the old church roof runs in a smooth curve.
- Two groins meet above the center of the hall.
