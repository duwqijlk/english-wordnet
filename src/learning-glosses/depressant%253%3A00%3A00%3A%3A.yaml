simpleMeaning: Describes a chemical that can slow down the work of the body or the mind
scope: This word describes a chemical that slows the body or mind down, not one that wakes a person up
  or speeds the body up.
examples:
- The doctor warned that the depressant drug could make her feel sleepy.
- A depressant effect slowed his breathing after the operation.
