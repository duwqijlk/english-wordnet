simpleMeaning: Carrying a meaning that lies beyond the senses and beyond what plain thought can grasp.
scope: A meaning beyond the reach of the senses and of ordinary thought only; not something merely kept
  private or not made public, not conduct with hidden aims, not something left unacknowledged, not a message
  passed on covertly, not something unexpressed, not something designed to escape detection, not something
  hidden from view, not information given in confidence, not covert indulgence, not an official document
  classification, and not the noun senses (a hidden fact, information known to a select group, or an unexplained
  mystery).
examples:
- The secret learning of the ancients was passed down only through symbols.
- Behind the plain ritual lay a secret doctrine that few could follow.
