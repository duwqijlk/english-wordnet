simpleMeaning: having a mind open to views and ways of life that are not your own
scope: 'Also called liberal or broad: having a mind open to views and ways of life that are not your own,
  not merely putting up with noise and not agreeing with everything.'
examples:
- He was tolerant of his opponent's opinions, even when he disagreed.
- A tolerant teacher lets pupils hold views of their own.
