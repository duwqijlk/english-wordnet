simpleMeaning: a mild mood illness in which a person's mood swings up and down a little, and the swings
  last for a long time
scope: 'Also called cyclic disorder and cyclothymic disorder: a mild mood illness that lasts a long time,
  not a short spell of low mood and not a severe mood illness.'
examples:
- His cyclothymia meant his mood rose and fell a little for years.
- The doctor said the cyclothymia would likely stay mild for a long time.
