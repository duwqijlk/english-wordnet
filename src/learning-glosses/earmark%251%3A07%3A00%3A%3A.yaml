simpleMeaning: A feature or quality of a person or thing that makes that person or thing different from
  others
scope: 'Also called trademark and hallmark: a clear quality that makes a person or thing different, not
  a mark on the ear of a farm animal.'
examples:
- Clear kindness is the earmark of a good teacher.
- A strong beat is an earmark of her music.
