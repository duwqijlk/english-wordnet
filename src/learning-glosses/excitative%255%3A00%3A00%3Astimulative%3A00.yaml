simpleMeaning: Said of a drug, for example, able to wake the body or mind up and stir it to action
scope: 'Also called excitant and excitatory: said of a drug that wakes the body or mind, not a drug that
  calms it.'
examples:
- The doctor warned that the excitative drug could keep her awake all night.
- The excitative medicine made his pulse race and his mind feel sharp.
