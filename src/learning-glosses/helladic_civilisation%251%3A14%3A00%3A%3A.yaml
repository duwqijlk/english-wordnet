simpleMeaning: The Bronze Age way of life on the Greek mainland, at its height from 2500 to 1100 BC.
scope: Also called Helladic civilization and Helladic culture; the Bronze Age way of life on the Greek
  mainland, not the culture of the Greek islands and not later Greek life.
examples:
- Helladic civilisation left fine pottery in the tombs of Mycenae.
- The Helladic civilisation flourished long before classical Greece.
