simpleMeaning: The lines of force that ring a lasting magnet or a moving bit of matter with an electric
  charge
scope: The lines of force that ring a lasting magnet or a moving bit of matter with an electric charge,
  not the magnet itself and not the moving bit; flux and magnetic flux are other names for this sense.
examples:
- Iron filings show the shape of the magnetic field around the bar.
- The magnetic field around the wire grew stronger when the current flowed.
