simpleMeaning: The one-of-a-kind marks a gun leaves on each bullet it fires and on the case it throws
  out tell which gun fired it.
scope: 'Also called ballistic identification and bullet fingerprinting: finding which gun fired a shot
  from the marks it leaves on the bullet and the case.'
examples:
- Ballistic fingerprinting matched the marks on the bullet to one gun.
- Ballistic fingerprinting was used to find which gun fired the shot.
