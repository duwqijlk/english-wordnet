simpleMeaning: Filling the mind with fear, dread, or terror.
scope: 'Also called terrible, awful, dread, dreadful, frightening, fearful, dreaded, fearsome, and horrific:
  it fills the mind with fear, dread, or terror, not a situation that is nearly hopeless and full of danger.'
examples:
- Dire warnings of the storm spread through the town.
- The dire news left the whole village afraid.
