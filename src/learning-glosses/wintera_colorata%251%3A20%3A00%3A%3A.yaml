simpleMeaning: A shrub or small tree that keeps its leaves all year, with leaves boldly marked in red
  and yellow and small black fruit.
scope: Also called pepper shrub or Pseudowintera colorata; an evergreen shrub with red-and-yellow marked
  leaves and small black fruit, not a deciduous shrub.
examples:
- Wintera colorata grows in the forest.
- The Wintera colorata has red and yellow leaves.
