simpleMeaning: The act of causing something to come apart or stop being whole.
scope: 'This is the transitive act: someone breaks something. It is not the crack or fracture that results,
  and not the intransitive event of a thing breaking. It is also not the pause sense, as in taking a break;
  the noun is uncommon outside formal or literary writing, where ''breakage'' is often used instead.'
examples:
- The break of the seal was witnessed by two officers.
- The break of the lock was deliberate.
