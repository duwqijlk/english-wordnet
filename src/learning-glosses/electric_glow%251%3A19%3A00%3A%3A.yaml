simpleMeaning: a burst of power in the air that turns the air around it into air that can carry a charge
scope: A burst of power that charges the air around it, also called corona, corona discharge and corposant;
  not a flash of lightning and not the light of a lamp.
examples:
- An electric glow shone around the wire that night.
- The electric glow lit the air near the mast.
