simpleMeaning: a very thin thread of material that comes from nature or is made by people
scope: 'Also called strand and fibril: a very thin thread from nature or made by people, not the thin
  wire inside a light bulb that gets hot.'
examples:
- Each filament in the plant stem is very thin and hard to see.
- The cloth is made of fine filaments woven together.
