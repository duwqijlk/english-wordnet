simpleMeaning: ready to put up with things because you have no part in the matter
scope: Putting up with things because you have no part in the matter, not a lack of interest in it.
examples:
- The judge's disinterest made her a fair choice for the case.
- Her disinterest let her hear both sides out without taking a side.
