scope: In Judaism, this is an old commentary on part of the Hebrew holy writings, read by Jewish ways
  of reading and joined to the holy text, not a work that stands apart from the text it explains.
examples:
- The Midrash explains the story in the Hebrew scriptures.
- Scholars read the Midrash alongside the biblical text.
