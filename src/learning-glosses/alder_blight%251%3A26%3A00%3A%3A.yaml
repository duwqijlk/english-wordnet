simpleMeaning: A disease that harms a tree, caused by a tiny woolly sap-sucking insect.
scope: A tree disease caused by a sap-sucking bug, not a rot of the roots and not a spot on the leaves.
examples:
- The alder blight struck the old tree by the stream.
- Farmers feared the alder blight would spread to the next grove.
