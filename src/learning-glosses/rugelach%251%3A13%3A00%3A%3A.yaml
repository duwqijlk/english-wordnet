simpleMeaning: A pastry whose dough includes cream cheese, with different fillings, such as raisins, walnuts
  and cinnamon, or chocolate, walnuts and apricot jam.
scope: Another name for ruggelach and rugulah, the same cream-cheese pastry; not a strudel or a Danish
  pastry.
examples:
- She filled the rugelach with raisins, walnuts and cinnamon.
- The rugelach at that bakery is made with cream cheese dough and apricot preserves.
