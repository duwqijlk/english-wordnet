simpleMeaning: made clear to the mind, to the senses, and to your power to judge, so it is easy to see
  or understand
scope: 'Also called apparent: clear and easy to see or understand, not simple with nothing added and not
  saying you are unhappy.'
examples:
- It was plain that he did not want to come.
- The marks were in plain view on the wall.
