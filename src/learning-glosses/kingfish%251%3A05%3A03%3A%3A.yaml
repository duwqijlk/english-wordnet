simpleMeaning: a small silver sea fish that people eat, found in the sea near California
scope: This is the live fish found near California; not the flesh of Atlantic fish sold for food, and
  not the other live kinds of fish found in Atlantic waters.
examples:
- They caught a small kingfish in the sea near California.
- A silver kingfish swam past the boat.
