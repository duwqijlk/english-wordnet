simpleMeaning: Yellow blooms that smell nice mark this thorny bush or small tree of warm America, and
  they are used to make scents.
scope: Cassie, flame tree, huisache, mimosa bush, scented wattle, and sweet acacia are other names for
  this thorny bush or small tree, known by its yellow blooms used to make scents.
examples:
- The sweet wattle by the road had yellow blooms.
- Workers picked sweet wattle blooms to make scents.
