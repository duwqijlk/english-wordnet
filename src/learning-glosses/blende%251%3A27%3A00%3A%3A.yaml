simpleMeaning: Rock that holds metal and gives most of the zinc used, made up mostly of a zinc compound
  made with sulfur in crystal form
scope: Rock that is the main source of zinc, not any other rock that holds metal.
examples:
- The miners dug blende from the deep shaft.
- Blende was the chief source of zinc for the smelter.
