simpleMeaning: As one circle rolls around another, a point on the rolling circle draws this line
scope: A line drawn by a point on a rolling circle, not a straight line and not the circle itself.
examples:
- The epicycloid traced by the rolling wheel formed a series of arches.
- He drew an epicycloid by rolling a coin around a larger circle.
