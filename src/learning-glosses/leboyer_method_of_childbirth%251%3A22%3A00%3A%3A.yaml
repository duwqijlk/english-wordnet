simpleMeaning: 'A way to give birth that tries to spare the newborn shock: a quiet dim room, no pulling
  of the head, and closeness between mother and child urged at once.'
scope: Also called the Leboyer method; a gentle way of giving birth, not a drug for pain and not a surgical
  birth.
examples:
- The Leboyer method of childbirth keeps the lights low and the room quiet.
- With the Leboyer method of childbirth, the baby is placed on its mother right away.
