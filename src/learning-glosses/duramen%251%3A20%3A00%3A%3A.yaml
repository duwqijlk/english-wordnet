synsetId: 13118511-n
simpleMeaning: the old, no-longer-living inner wood at the centre of a tree or woody plant, usually darker
  and heavier for its size than the wood around it
scope: The old, no-longer-living inner wood at the centre of a tree, also called heartwood; not the outer
  wood and not the bark.
examples:
- The duramen of the oak was dark and dense.
- The duramen at the centre of the trunk was darker than the wood around it.
