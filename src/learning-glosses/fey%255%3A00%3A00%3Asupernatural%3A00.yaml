simpleMeaning: strange and seeming to come from another world, like an elf (a small magic person in old
  stories)
scope: 'Also called elfin: strange and magic-like, as if from another world. It is not just strange in
  a bad way.'
examples:
- She had a fey smile, strange and as if she knew secrets from another world.
- The music had a fey quality, light and magic and not quite of this world.
