simpleMeaning: a bush or small tree from the warm parts of America, with very large leaves deeply cut
  into parts that spread from one point, and large long yellow fruit
scope: Also called pawpaw, melon tree, papaia and papaya tree. This is the plant itself, not the large
  yellow fruit it grows, which is the other papaya sense.
examples:
- A papaya grows fast in a warm garden and gives large yellow fruit.
- The papaya's leaves are huge and deeply cut.
