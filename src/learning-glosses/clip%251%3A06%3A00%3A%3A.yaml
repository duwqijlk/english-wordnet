simpleMeaning: a metal holder for cartridges (bullets in their cases) that can be put into an automatic
  gun
scope: 'Also called a magazine: a metal holder for cartridges in a gun, not a piece of jewelry that fastens
  onto clothes, not a sharp blow, and not the act of cutting something short.'
examples:
- He pushed a fresh clip into the gun.
- The clip holds ten cartridges and fits into the automatic gun.
