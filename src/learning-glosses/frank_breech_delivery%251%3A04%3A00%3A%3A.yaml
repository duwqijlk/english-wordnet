simpleMeaning: The way an unborn baby lies when its bottom is at the opening of its mother's birth canal.
scope: An unborn baby lying with its bottom at the birth opening; frank breech is another name for this
  sense, not a baby lying head down and not a baby lying sideways.
examples:
- The doctor planned a frank breech delivery with care.
- A frank breech delivery needs a skilled team in the room.
