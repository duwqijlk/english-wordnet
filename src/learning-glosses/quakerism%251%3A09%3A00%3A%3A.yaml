simpleMeaning: The beliefs of the Society of Friends, marked by a stand against war and by turning away
  from set rites, a fixed creed and ordained ministers.
scope: The belief system of the Society of Friends, not one member or one meeting place, covering its
  stand against war and its rejection of set rites, a fixed creed and ordained ministers.
examples:
- Quakerism teaches its followers to refuse war.
- She was drawn to Quakerism by its simple worship.
