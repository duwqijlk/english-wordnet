simpleMeaning: of or about the pelvis, the wide set of bones at the lower end of the back, where the legs
  join the body
scope: This word is about the pelvis, the wide set of bones at the lower end of the back. It is not about
  the chest, the arms, or other parts of the body.
examples:
- She went to the doctor for a pelvic exam.
- He had pain in his back after a pelvic injury.
