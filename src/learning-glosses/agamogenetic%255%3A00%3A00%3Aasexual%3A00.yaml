simpleMeaning: In reproduction, not needing a male cell and a female cell to join
scope: In reproduction, not needing a male cell and a female cell to join; agamic, agamous, apomictic
  and parthenogenetic are other names for this, not the usual kind of reproduction in which two cells
  join.
examples:
- Agamogenetic plants make seeds without joining cells.
- The agamogenetic fern needs no male and female cells.
