simpleMeaning: A person who makes a strong feeling, such as fear, less strong and brings calm.
scope: Also called a comforter or an allayer, a person who lessens a strong feeling and brings calm.
examples:
- Her kind words made her a reliever of anxiety for the children.
- The nurse acted as a reliever of fears before the operation.
