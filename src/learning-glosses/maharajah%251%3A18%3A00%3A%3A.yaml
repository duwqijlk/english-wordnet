simpleMeaning: A great raja, a Hindu prince or king in India who ranks above a raja
scope: A great raja, a Hindu prince or king in India who ranks above a raja, not a raja of lower rank
  and not a king outside India; maharaja is another name for this sense.
examples:
- The maharajah welcomed the guests to his palace.
- The maharajah ruled a large state in India.
