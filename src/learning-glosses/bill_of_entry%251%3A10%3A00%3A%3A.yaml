synsetId: 06498887-n
simpleMeaning: a list of goods that have come into a customs house, to be sent out of the country or brought
  in
scope: A list of goods at a customs house, not a list of prices and not a receipt for goods bought.
examples:
- The clerk filed a bill of entry for the crates of tea.
- Every shipment needs a bill of entry before it can leave the port.
