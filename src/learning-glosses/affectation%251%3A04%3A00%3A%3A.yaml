simpleMeaning: A false show or act done on purpose, in a way that is too strong
scope: 'Also called pose and mannerism: this is a false show done on purpose and in too strong a way,
  not a person''s natural way of acting and not a true feeling.'
examples:
- His grand accent was just an affectation to impress us.
- She spoke simply, with no affectation at all.
