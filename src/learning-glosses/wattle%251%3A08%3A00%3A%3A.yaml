simpleMeaning: a thick, soft, wrinkled fold of skin, often bright in color, that hangs from the neck or
  throat of some birds, such as chickens and turkeys, or of lizards
scope: 'Also called lappet: the fold of skin on a bird or lizard. It is not the fence made of sticks and
  branches, and not the Australian tree with the same name.'
examples:
- The turkey's red wattle hung below its beak.
- A chicken has a bright wattle under its throat.
