simpleMeaning: A band of flesh that straightens the lower arm and shifts one lower-arm bone aside as the
  palm turns down.
scope: This is the band of flesh that straightens the lower arm, also called musculus anconeus.
examples:
- The anconeous muscle straightened her forearm.
- Her anconeous muscle moved the bone aside as her palm turned down.
