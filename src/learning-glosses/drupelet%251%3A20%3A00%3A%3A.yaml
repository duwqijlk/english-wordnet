simpleMeaning: one small part of a fruit made of many such parts, each like a drupe, a fruit with one
  hard stone inside
scope: One small part of a fruit made of many such parts, each like a drupe; not a whole fruit and not
  a stone on its own.
examples:
- Each drupelet of the blackberry is a tiny fruit in itself.
- She pulled a drupelet from the ripe blackberry.
