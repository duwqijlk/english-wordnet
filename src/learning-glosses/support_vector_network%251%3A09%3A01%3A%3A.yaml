simpleMeaning: Flat walls drawn through a space of many measures split things into groups; the same tool
  can also work out numbers or do other jobs.
scope: This is a tool that sorts things into groups by drawing flat walls through number space; support
  vector machine is another name for this sense.
examples:
- The support vector network sorted the samples into two groups.
- They used a support vector network to work out the numbers.
