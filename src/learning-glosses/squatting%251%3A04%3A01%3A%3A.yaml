simpleMeaning: Exercise in which you bend your knees and lower your body again and again, making your
  leg muscles strong.
scope: Exercise of bending the knees again and again, also called a squat, not just holding a low crouching
  pose.
examples:
- Squatting every day has made her legs stronger.
- He does squatting as part of his morning exercise.
