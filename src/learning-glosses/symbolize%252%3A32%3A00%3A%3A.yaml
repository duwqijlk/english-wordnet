simpleMeaning: to stand for something else by means of a picture, shape, or thing; to be a sign of it
scope: To stand for an idea by means of a picture, shape, or thing, not to put the idea in plain words.
examples:
- The white dove symbolizes peace.
- What does the red rose symbolize in this poem?
