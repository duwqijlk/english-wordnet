simpleMeaning: Traditional Chinese food served as many small dishes, one after another, with steamed or
  fried filled dough among them
scope: Small Chinese dishes served one after another, not one big main course.
examples:
- We ordered dim sum and shared the small plates.
- The dim sum came in small bamboo baskets, dish after dish.
