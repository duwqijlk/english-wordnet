simpleMeaning: When the parts of a thing are not in fair share with each other, so one part is too big
  and another too small
scope: Parts of a thing not in fair share with each other, not a difference in size alone and not a fault
  in one part.
examples:
- The imbalance in trade worried the two nations.
- An imbalance of power left one side with no say.
