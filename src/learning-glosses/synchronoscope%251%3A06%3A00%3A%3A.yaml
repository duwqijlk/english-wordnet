simpleMeaning: A dial that shows if two timed motions keep step, especially a dial for a pilot to match
  a multi-engine plane's airscrews.
scope: This sense is also called synchroniser, synchronizer, and synchroscope.
examples:
- A synchronoscope showed the motions in step.
- Synchronoscopes help pilots.
