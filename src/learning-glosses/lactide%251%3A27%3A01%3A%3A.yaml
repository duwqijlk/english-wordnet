simpleMeaning: Any of a group of ring-shaped chemical stuffs, the dry form of an acid, made by heating
  small ring-shaped bits.
scope: Heating small ring-shaped bits makes one of this group of ring-shaped chemical stuffs, the dry
  form of an acid.
examples:
- A lactide may be made by heating lactic acid.
- A lactide formed when the lactic acid was heated.
