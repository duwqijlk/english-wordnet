scope: 'Also called infernal, hellish, unholy, demonic, satanic, fiendish and diabolic: very evil and
  cruel, not just clever and wicked in a devil-like way.'
examples:
- The diabolical king ordered cruel punishments for anyone who spoke against him.
- The diabolical torture in the prison shocked everyone who heard about it.
