simpleMeaning: The trade name of a drug that lowers high blood pressure, made of a set mix of atenolol
  and a drug that makes the body pass more water.
scope: This is the trade name of a blood-pressure drug made of a set mix of atenolol and a water drug,
  not a blood-pressure drug made of one drug alone.
examples:
- Tenoretic lowers blood pressure.
- The doctor gave her Tenoretic for her blood pressure.
