simpleMeaning: a small charm, often a piece of jewelry worn around the neck, that people believe keeps
  evil or sickness away by magic
scope: A small charm worn for magic protection, with amulet as another name for this sense, and not an
  ordinary piece of jewelry.
examples:
- She wore a talisman around her neck for protection.
- The old talisman was said to keep sickness away.
