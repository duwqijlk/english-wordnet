simpleMeaning: A large greyish-brown fungus that can be eaten, a mass of flat tops lying over each other
  that look a little like a hen at the foot of trees
scope: Also called hen-of-the-woods, hen of the woods and Grifola frondosa, this is a large edible greyish-brown
  fungus at the foot of trees, not a small field mushroom and not a poisonous toadstool.
examples:
- The Polyporus frondosus grew at the foot of the oak.
- They picked Polyporus frondosus for supper.
