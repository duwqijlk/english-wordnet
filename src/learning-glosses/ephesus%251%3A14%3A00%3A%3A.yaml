simpleMeaning: The third church meeting of all Christians in 431, which said Mary was the mother of God
  and judged the teaching of Pelagius to be wrong.
scope: This is the third council of the whole church, also called the Council of Ephesus, not the city
  of the same name or any other council of the church.
examples:
- The Council of Ephesus met in 431.
- At Ephesus, the bishops declared Mary the mother of God.
