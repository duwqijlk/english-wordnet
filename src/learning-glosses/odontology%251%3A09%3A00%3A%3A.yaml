simpleMeaning: The branch of medicine that deals with the build, growth and ills of the teeth.
scope: The branch of medicine that deals with the teeth, also called dentistry and dental medicine; not
  the branch of medicine that deals with the gums alone and not the making of false teeth.
examples:
- She studied odontology to learn about the teeth.
- Odontology covers the build and growth of the teeth.
