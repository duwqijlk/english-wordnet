simpleMeaning: To go up to the highest point it can reach, and to be at its strongest and busiest
scope: To go up to the highest point it can reach, not the top of a hill and not the highest point of
  a roof.
examples:
- Sales peaked in December, when demand was at its highest.
- Her interest peaked during the final week of the course.
