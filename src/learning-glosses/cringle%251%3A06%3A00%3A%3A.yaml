simpleMeaning: A small metal ring set in a hole to line it, so cords or lines can be tied to it.
scope: This is a metal ring lining a small hole, not a hook or a knot; also called loop, eyelet, grommet,
  and grummet.
examples:
- He passed the rope through the cringle.
- Each cringle held the sail fast.
