simpleMeaning: Often bright with colour, the soft, shell-less body of one of many kinds of creatures from
  the group Nudibranchia lives in salt water.
scope: Nudibranch is another name for this soft, shell-less creature that lives in salt water and is often
  bright with colour.
examples:
- A sea slug shows a soft, shell-less body that is often bright with colour.
- The sea slug in salt water has no shell on its bright body.
