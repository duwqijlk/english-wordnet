simpleMeaning: Surgeons break the nerve paths that join the front of the brain to the rest of it, and
  the person's thoughts and ways often come out clearly changed.
scope: 'Also called lobotomy, frontal lobotomy, leukotomy, prefrontal leucotomy, prefrontal leukotomy,
  and prefrontal lobotomy: an operation that cuts nerve paths to and from the front of the brain.'
examples:
- The surgeon carried out a leucotomy to cut the nerve paths to the front of the brain.
- After the leucotomy, his thinking and behaviour had changed in clear ways.
