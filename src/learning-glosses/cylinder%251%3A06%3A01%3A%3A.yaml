simpleMeaning: A round box for holding oxygen or air squeezed tight under pressure.
scope: A round box for oxygen or air under pressure, not the solid shape with two flat ends, not a chamber
  for a piston, and not the round surface itself.
examples:
- The diver carried a cylinder of oxygen on his back.
- A cylinder of compressed air powered the drill.
