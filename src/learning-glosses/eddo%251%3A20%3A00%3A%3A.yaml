simpleMeaning: A thick starchy root of the taro plant that grows under the ground and that people eat.
scope: 'Also called taro, cocoyam, and dasheen: a thick starchy root of the taro plant, not the leaves
  and not an ordinary potato.'
examples:
- We boiled the eddo and served it with fish.
- Eddo grows underground on the taro plant.
