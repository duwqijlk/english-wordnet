simpleMeaning: The act of thinking something through and coming to a choice or a firm view about it.
scope: The act of thinking a thing through to a choice, not the power to size things up well and not a
  court's ruling.
examples:
- His judgment was that the plan would fail.
- She formed her judgment after hearing both sides.
