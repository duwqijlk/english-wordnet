simpleMeaning: People whose political views sit in the middle, holding neither strongly left-wing nor
  strongly right-wing opinions.
scope: This means the people themselves who hold middle-of-the-road political opinions, not a cluster
  of nerve cells, not the American football role that opens a play, not the key part of an idea, and not
  the football player who fills that role. It is also not the adjective describing a view that is neither
  left-wing nor right-wing, an area near the middle of a region, the exact middle point of a line, a place
  where an activity is concentrated, the filling inside a chocolate, the thing attention is fixed on,
  a building for an activity, the basketball or hockey role, the middle of a military formation, a basketball
  or hockey player, the outfield ground ahead of the catcher, a shopping complex, the adjective meaning
  equally far from both ends, or any verb sense about moving to the middle, focusing attention, or having
  something as the main subject.
examples:
- The party's centre blocked the radical wing's plan at the conference.
- Neither the left nor the right won; the centre decided the vote.
