simpleMeaning: An animal of Africa, Arabia or Asia, with a tail that cannot grip and nose holes set close
  together
scope: Also called catarrhine; an animal of Africa, Arabia or Asia with a tail that cannot grip, not a
  monkey of the Americas with a tail that can grip.
examples:
- The Old World monkey sat in the tree, its tail hanging down.
- Old World monkeys have nose holes set close together.
