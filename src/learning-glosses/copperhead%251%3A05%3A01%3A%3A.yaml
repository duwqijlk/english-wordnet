simpleMeaning: a common reddish brown poisonous snake (a pit viper, a snake that can sense heat) that
  lives in high land in the eastern United States
scope: A poisonous snake of the eastern United States, not the reddish-brown poisonous snake of Australia
  that has the same name.
examples:
- A copperhead lay still among dry leaves in the hills of Virginia.
- The copperhead is a common snake in the woods of the eastern United States.
