simpleMeaning: 'Two or more English words that work as one action word: a main word plus small words after
  it.'
scope: This English action word has small words after it, and the whole group acts as one unit, not as
  a single action word on its own.
examples:
- ‘Turn out’ is a phrasal verb in the question ‘How many turned out to vote?’
- In the sentence ‘They gave up’, ‘gave up’ is a phrasal verb.
