simpleMeaning: Uneven red marks on the tongue, with a sharp sting from hot or spicy food, mark this mild
  sore state of the tongue.
scope: This mild sore state of the tongue stays on the surface, and it is not a deep one.
examples:
- The glossodynia exfoliativa left red patches on her tongue after hot soup.
- Spicy food stung his tongue because of the glossodynia exfoliativa.
