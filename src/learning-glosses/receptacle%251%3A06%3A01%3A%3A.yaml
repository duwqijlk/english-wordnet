simpleMeaning: An electrical or electronic part that is joined to a source of power and is made to take
  a plug
scope: A power part that takes a plug, not the wide end of a flower stem and not a box or bag for holding
  things.
examples:
- Plug the lamp into the receptacle on the wall.
- The receptacle on the wall has two places for plugs.
