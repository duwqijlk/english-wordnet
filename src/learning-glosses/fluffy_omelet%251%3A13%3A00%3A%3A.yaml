simpleMeaning: A light egg dish made by beating the egg whites on their own and then adding them.
scope: A light egg dish made by beating the egg whites on their own and then adding them; not a flat egg
  dish and not a dish made without beating the whites on their own.
examples:
- The fluffy omelet rose high in the pan.
- She made a fluffy omelet by beating the whites first.
