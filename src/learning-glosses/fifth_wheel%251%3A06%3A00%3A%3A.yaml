simpleMeaning: On a horse-drawn cart, a flat ring under the front lets the front rod turn, so the cart
  can be steered.
scope: Under the front of a horse-drawn cart, a flat ring lets the front rod turn and so steers the cart.
examples:
- The fifth wheel on the old wagon creaked as it turned.
- He greased the fifth wheel before hitching the horses.
