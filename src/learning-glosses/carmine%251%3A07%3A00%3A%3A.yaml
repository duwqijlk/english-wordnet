simpleMeaning: a color that is not always the same, but on the whole is a strong bright red
scope: 'Also called cardinal: this is the name of a strong bright red color itself, not the word used
  to describe a thing of that color and not the act of coloring it.'
examples:
- She chose carmine for the dress.
- The paint on the door is a deep carmine.
