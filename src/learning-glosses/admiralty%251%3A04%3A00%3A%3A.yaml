simpleMeaning: the job and place in rank held by the highest officer in a navy
scope: This is the position held by an admiral, not the navy he leads and not the ships under him.
examples:
- He rose to the admiralty after forty years in the navy.
- The admiralty was the highest post he could reach as a naval officer.
