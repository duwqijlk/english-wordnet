simpleMeaning: Easily angered, as if one's stomach were upset by food that will not digest.
scope: Easily angered as if one's stomach were upset, also called bilious; not a person actually suffering
  from bad digestion.
examples:
- He was dyspeptic all morning after the bad news.
- She sounded dyspeptic when the meeting ran late.
