simpleMeaning: marked by or involving the red liquid that runs through the body.
scope: This describes something marked by red body fluid, not the action of staining it or the informal
  British intensifier.
examples:
- He came home with a bloody nose after the match.
- The kitchen floor was bloody after the accident.
