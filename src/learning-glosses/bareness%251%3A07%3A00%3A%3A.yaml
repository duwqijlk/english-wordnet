simpleMeaning: A room or place with almost nothing in it, bare of things to look at or use.
scope: 'Also called starkness: a room or place with almost nothing in it, not the cold, empty feeling
  of a bare landscape.'
examples:
- I was struck by the bareness of my father's room.
- The bareness of the flat surprised her; there was not even a chair.
