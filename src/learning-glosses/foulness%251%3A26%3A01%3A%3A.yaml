simpleMeaning: the quality of being very evil and doing what is wrong in a way that shocks and upsets
  people
scope: This is about very evil, wrong acts, not a strong bad smell and not a state of dirt and waste.
examples:
- He saw the foulness of the crime and turned away.
- The story shows the foulness in the king's cruel acts.
