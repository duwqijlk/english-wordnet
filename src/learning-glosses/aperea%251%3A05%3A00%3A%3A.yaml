simpleMeaning: A South American cavy that may be the wild forebear of the pet guinea pig.
scope: A South American cavy that may be the wild forebear of the pet guinea pig, not the pet guinea pig
  itself and not another South American rodent.
examples:
- The aperea lives wild in the grasslands of South America.
- Some think the aperea is the forebear of the guinea pig.
