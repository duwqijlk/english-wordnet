simpleMeaning: A tiny, harmless eight-legged animal with claws, shaped like a scorpion with no tail
scope: 'Also called false scorpion: a tiny, harmless eight-legged animal with claws and no tail, not a
  true scorpion and not a spider.'
examples:
- We found a pseudoscorpion under the bark, no bigger than a grain of rice.
- The pseudoscorpion waved its claws but could not hurt us.
