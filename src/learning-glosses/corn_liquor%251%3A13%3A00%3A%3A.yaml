simpleMeaning: Strong drink made against the law from maize mash by heating it and cooling the steam.
scope: This is strong drink made against the law from maize mash by heating it and cooling the steam;
  moonshine and bootleg are other names for this sense, not strong drink made and sold by the law and
  not beer.
examples:
- He hid a jar of corn liquor in the barn.
- Corn liquor was made against the law from maize mash.
