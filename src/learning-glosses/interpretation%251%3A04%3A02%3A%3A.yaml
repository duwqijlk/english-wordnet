simpleMeaning: the way a person plays, sings, or acts a work, showing what they make of it
scope: How a performer shows a work of art, not an explanation of what something means.
examples:
- Her interpretation of Milton's verse was extraordinarily moving.
- His interpretation of the song brought tears to the crowd.
