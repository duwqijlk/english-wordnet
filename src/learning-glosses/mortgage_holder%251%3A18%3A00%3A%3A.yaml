simpleMeaning: the person or bank that lends money on land or buildings and holds the loan agreement on
  them
scope: The lender, also called mortgagee; not the borrower who takes the loan and not a person who sells
  houses.
examples:
- The bank became our mortgage holder when it accepted our mortgage on our new home.
- Ask the mortgage holder before you sell the house.
