simpleMeaning: an animal that stays alive in spite of hard times
scope: This sense is only about an animal that stays alive through hard times, not a person who lives
  through danger or trouble.
examples:
- Only the strongest animals were survivors of the cold winters.
- The small fish was a survivor in a river with little food.
