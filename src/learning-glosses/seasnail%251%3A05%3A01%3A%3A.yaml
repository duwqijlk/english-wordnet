simpleMeaning: With lower fins joined into a cup that holds it fast, this small tadpole-shaped fish of
  cold water is a close kin of the lumpfish.
scope: Also called sea snail and snailfish, this small cold-water fish holds fast with a cup of joined
  lower fins, and it is not the creeping whelk-like kind that shares its name.
examples:
- A seasnail held fast with its sucker.
- Seasnails swim in cold water.
