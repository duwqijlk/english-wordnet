simpleMeaning: a way of thinking that uses good reasons and reaches a judgment that makes sense
scope: This is a way of thinking that uses good reasons and the judgment reached from it, not the study
  of how reasons work and not the system a computer uses to work.
examples:
- There was clear logic in her decision to save money each month.
- His logic was sound, so we followed his plan.
