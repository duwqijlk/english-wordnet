simpleMeaning: A plant from central and southeastern United States and the West Indies, with large showy
  bunches of clear blue flowers and spreading roots, sometimes put with another group of plants.
scope: This plant is also called mist-flower and mistflower; it has large showy bunches of clear blue
  flowers and spreading roots, and it is sometimes put with another group of plants.
examples:
- Gardeners grow ageratum for its clear blue flowers.
- Ageratum grows from roots that spread underground.
