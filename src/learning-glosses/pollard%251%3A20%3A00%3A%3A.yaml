simpleMeaning: A tree with its limbs cut back so that it grows a thicker mass of leaves.
scope: A tree with limbs cut back to make it grow more thickly with leaves; not a usually horned animal
  that has shed its horns or had them taken off, and not the act of turning a tree into one.
examples:
- The pollard by the lane had been cut back hard, and new shoots crowded its top.
- Every winter the gardener trims the pollard to keep its crown thick and low.
