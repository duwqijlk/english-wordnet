simpleMeaning: A store that keeps copies of much-used disk parts in quick memory, RAM, so they can be
  read without going to the slower disk.
scope: A cache holding copies of much-used disk sectors in RAM, so they read without going to the slower
  disk.
examples:
- The disk cache held the much-used parts.
- A disk cache speeds the reading.
