senseId: 'acorn_barnacle%1:05:00::'
synsetId: 02001395-n
simpleMeaning: A shellfish that fastens itself to rocks, found most of all where the sea covers the shore
  at high tide and leaves it bare at low tide.
scope: Not a mussel and not a shellfish that swims free.
examples:
- The acorn barnacle clung to the rock at low tide.
- Acorn barnacles crowd the rocks where the tide goes out.
