simpleMeaning: Muscle threads in a bunch are wrapped round by a cover of stuff that joins them together.
scope: The cover round a bunch of muscle threads is not the threads themselves.
examples:
- The bundles of muscle fibres in the meat are covered by perimysium.
- Each bundle of muscle fibres has its own perimysium round it.
