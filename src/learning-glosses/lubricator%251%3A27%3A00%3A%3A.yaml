simpleMeaning: Put between parts that move, this slick stuff lets them slide past each other with little
  drag.
scope: Also called lubricant, lube, and lubricating substance, this slick stuff is put between moving
  parts to cut the drag between them.
examples:
- He added a lubricator to the gears to stop them grinding.
- The lubricator made the old lock turn without sticking.
