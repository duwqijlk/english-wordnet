simpleMeaning: In physics, a wave that holds its shape through a nonlinear medium — a packet of energy
  or particle-like pulse traveling alone, adding to no other wave, never fading.
scope: Another name for a soliton, also called a solitary wave; unlike an ordinary wave, it keeps its
  shape instead of spreading.
examples:
- A soliton wave keeps its shape as it crosses the channel.
- The engineers modeled a soliton wave moving through the fiber.
