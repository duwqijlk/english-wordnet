simpleMeaning: One of several man-made carbon mixes, it is a medicine that holds back the growth of germs
  that need the food stuff PABA to live.
scope: 'Also called sulfa, sulfa drug, and sulpha: a medicine that holds back the growth of germs that
  need PABA to live.'
examples:
- The sulfonamide held back the growth of the germs.
- Doctors used a sulfonamide to stop the germs that need PABA.
