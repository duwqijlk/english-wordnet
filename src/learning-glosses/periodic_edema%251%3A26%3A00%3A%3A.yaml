simpleMeaning: 'It returns, mostly in young women: large sharp-edged swollen patches under the skin that
  start suddenly and fade in a day, often after an allergy to food or drugs.'
scope: Also called angioedema, atrophedema, and giant hives; the swelling sits under the skin and comes
  and goes, not a lasting lump.
examples:
- Her periodic edema came up suddenly and was gone within a day.
- The doctor said the periodic edema often follows food or drugs that set off an allergy.
