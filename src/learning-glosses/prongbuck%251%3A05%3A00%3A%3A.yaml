simpleMeaning: The small forked growths on its head mark a fast deer-like animal of the flat western grasslands
  of North America, one that chews its food twice.
scope: Also called pronghorn and pronghorn antelope, this is the fast deer-like animal of the western
  plains, not a true antelope.
examples:
- A prongbuck raced across the plain.
- The prongbuck stopped to chew its food twice.
