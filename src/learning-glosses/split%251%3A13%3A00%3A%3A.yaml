simpleMeaning: a sweet dish of cut fruit and ice cream, with whipped cream, cherries, and nuts on top
scope: This is the sweet food sense, not the bowling pins left standing, not more shares in a company,
  and not the act of tearing something.
examples:
- She ordered a banana split with extra cherries on top.
- We shared a fruit split covered with whipped cream and nuts.
