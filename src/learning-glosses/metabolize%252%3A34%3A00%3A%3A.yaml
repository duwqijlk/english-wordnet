simpleMeaning: to make something by the chemical changes that happen in a living body to keep it alive
  and growing
scope: Making something inside a living body by its chemical changes; not eating, and not simply breaking
  food down in the body.
examples:
- The liver metabolizes glucose and makes a stored form of it for the body to use later.
- These bacteria metabolize simple chemicals and produce substances that plants need to grow.
