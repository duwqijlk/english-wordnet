simpleMeaning: The steady middle part of a land mass, usually from very early times in the earth's past
scope: This is the steady middle part of a land mass, usually from very early times in the earth's past;
  not a mountain range at the edge of a land mass, and not a young part still moving.
examples:
- The craton forms the ancient heart of the continent.
- Geologists study the craton to learn about the earth's early past.
