simpleMeaning: Most often in the plural, one of a set of songs and replies voicing the complaint of Jesus
  Christ to his people, most often sung on Good Friday
scope: This is one of a set of songs and replies voicing the complaint of Jesus Christ to his people,
  most often in the plural and most often sung on Good Friday, with singers and choir taking turns in
  the singing.
examples:
- The Improperium was sung on Good Friday.
- The choir sang the Improperium antiphonally.
