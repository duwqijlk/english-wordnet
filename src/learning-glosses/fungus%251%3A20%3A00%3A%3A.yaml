simpleMeaning: a living thing with no chlorophyll that feeds on organic matter, ranging from single-celled
  forms to networks that produce spores.
scope: This is the whole kingdom of organisms that includes mushrooms, moulds and yeasts, not a plant,
  and not one particular kind such as a toadstool.
examples:
- This fungus feeds on dead leaves and other organic matter.
- Some fungi are single cells too small to see without a microscope.
