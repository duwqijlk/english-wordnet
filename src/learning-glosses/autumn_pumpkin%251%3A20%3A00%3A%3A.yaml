simpleMeaning: A rough, trailing plant grown for its big, soft, round orange fruit with hard skin and
  many seeds; the same species also includes summer squashes and a few late-season squashes.
scope: The plant that bears the fruit, not the orange fruit itself or a summer squash.
examples:
- The autumn pumpkin sends out long rough vines across the garden.
- They planted autumn pumpkin along the fence last spring.
