simpleMeaning: the study of number work in its use on real things, living things, and the life of people
  in groups
scope: 'Also called applied math: number work put to work on the real world, not number work for its own
  sake and not the natural sciences themselves.'
examples:
- He studied applied mathematics to model how diseases spread.
- Applied mathematics helps engineers work out the strength of a bridge.
