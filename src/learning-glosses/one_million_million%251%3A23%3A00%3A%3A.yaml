simpleMeaning: The count written as a 1 with twelve zeros after it; in Britain, the American use is often
  seen.
scope: The count written as a 1 with twelve zeros after it, also called billion and 1000000000000; not
  a count with nine zeros and not a count with fifteen zeros.
examples:
- One million million is written as a 1 with twelve zeros.
- In Britain, one million million is now often called a billion.
