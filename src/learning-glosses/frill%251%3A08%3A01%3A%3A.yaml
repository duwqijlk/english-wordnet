simpleMeaning: In paleontology, a plate of bone that curves up behind the head of many horned dinosaurs
scope: In paleontology, a bone plate on a dinosaur, not the feathers or hair around the neck of a bird
  or other animal, and not a strip of folded cloth used as trimming.
examples:
- The dinosaur's wide frill rose up behind its skull.
- A fossil frill curved up behind the dinosaur's head.
