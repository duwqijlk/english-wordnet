simpleMeaning: a piece of clothing for a woman, made in one piece, with a top joined to a skirt
scope: This is not a skirt on its own, not a two-piece outfit, and not the act of putting clothes on.
examples:
- She wore a long blue dress to the wedding.
- The dress has a lace top and a full skirt.
