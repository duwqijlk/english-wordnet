simpleMeaning: A wind tool whose sound comes from tubes in groups, fed with air by a pump that pushes
  air, and played from a large set of keys with many parts.
scope: It is also called organ.
examples:
- We heard the pipe organ.
- She played the pipe organ from its large set of keys.
