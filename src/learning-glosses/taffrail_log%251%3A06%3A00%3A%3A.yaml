simpleMeaning: A ship's speed is read off this cigar-shaped tool, whose fins turn round as the ship moves.
scope: Also called patent log and screw log, this tool tells a ship's speed from the turning of its fins.
examples:
- The taffrail log showed how fast the ship was moving.
- Readings from the taffrail log told how fast the ship moved.
