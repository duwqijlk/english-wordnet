simpleMeaning: so hard to believe that no one can take it as true
scope: 'Also called tall and marvelous: a story or claim too unlikely to be believed, not something wonderful
  or amazing.'
examples:
- His marvellous tale of treasure and pirates was hard to believe.
- She told a marvellous story that no one could quite believe.
