senseId: 'automation%1:26:00::'
synsetId: 14598049-n
simpleMeaning: the state of a machine or system when it works by itself, without a person running or controlling
  it
scope: This sense is the state of machines running on their own; it is not the act of setting up such
  control, and not the machines and tools used for it.
examples:
- Automation in the factory means the machines now run on their own all day.
- Thanks to automation, the doors open and close without anyone touching them.
