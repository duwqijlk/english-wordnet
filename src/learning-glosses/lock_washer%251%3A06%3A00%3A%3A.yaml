simpleMeaning: A nut is kept from coming loose by this ring
scope: 'Also called lock ring and lockring: a ring that keeps a nut from coming loose, not a ring worn
  on a finger and not a flat washer with no such job.'
examples:
- Put a lock washer under the nut so it will not come loose.
- The lock washer stopped the nut from working loose.
