simpleMeaning: In the rocky high lands of Asia and the west of North America lives a small, short-eared
  mammal that digs burrows.
scope: Also called coney, mouse hare, pika and rock rabbit, this small short-eared burrowing mammal lives
  in the rocky high lands of Asia and the west of North America, not the rabbit-like animal of the same
  name and not the small hoofed animal of Africa and Asia.
examples:
- The cony dug its burrow among the rocks.
- We saw a cony on the high ground in Asia.
