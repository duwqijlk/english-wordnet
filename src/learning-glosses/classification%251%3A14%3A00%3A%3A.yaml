simpleMeaning: people or things that have been put into groups of the same kind, seen as one set
scope: 'Also called categorization: this is the set of people or things after they have been sorted, not
  the act of sorting them and not a government rule that keeps papers secret.'
examples:
- In this classification, whales sit in the group with other animals that feed milk to their young.
- 'The classification has three groups: small, middle-sized, and large.'
