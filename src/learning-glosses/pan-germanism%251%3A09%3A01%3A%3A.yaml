simpleMeaning: A movement that worked to bring all the people who speak that tongue, or a tongue of that
  family, together under one rule.
scope: A movement to bring all the people who speak that tongue together under one rule, not a party that
  runs a land and not a movement for another tongue.
examples:
- He wrote a book about Pan-Germanism and its hopes.
- Pan-Germanism sought the union of all who spoke that tongue.
