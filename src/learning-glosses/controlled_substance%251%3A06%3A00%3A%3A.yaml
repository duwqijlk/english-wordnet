simpleMeaning: a drug or chemical that the law says people may not have or use without leave
scope: A drug or chemical the law keeps a tight hold on, not any drug and not a drug the law allows anyone
  to have.
examples:
- Morphine is a controlled substance and needs a doctor's note.
- The police found a controlled substance in the car.
