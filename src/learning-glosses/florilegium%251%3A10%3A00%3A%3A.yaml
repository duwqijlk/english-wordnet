simpleMeaning: A book holding a set of short pieces of writing, poems, and ballads, and other such things.
scope: A book holding a set of short pieces of writing, poems, and ballads, also called a garland or a
  miscellany; not a book with one long story and not a book of poems only.
examples:
- The florilegium brought together short poems from many writers.
- She found the old ballad in a florilegium of folk verse.
