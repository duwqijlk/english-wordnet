simpleMeaning: The group of millions of stars that holds our sun, seen as a pale band of light across
  the night sky
scope: Also called the Milky Way and the Milky Way Galaxy; the group of stars that holds our sun, not
  a single star and not a group of stars far from our sun.
examples:
- The Milky Way System is the group of stars that holds our sun.
- The Milky Way System looks like a pale band of light at night.
