simpleMeaning: to make something dirty by rubbing a dirty substance across it
scope: This is making something dirty by rubbing a dirty substance on it, not saying false bad things
  to hurt a person's good name and not covering a surface with a substance spread over it.
examples:
- The boy smeared mud all over his clean shirt.
- She smeared dirty oil across the white cloth, leaving a dark mark.
