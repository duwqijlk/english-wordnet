simpleMeaning: A heavy war machine of the old days that threw great stones and other things at walls when
  a town was shut in
scope: A great war engine for throwing stones at walls in a siege, not the small toy and not the device
  that throws planes from a ship.
examples:
- The catapult hurled stones over the castle wall.
- Soldiers worked the catapult through the long siege.
