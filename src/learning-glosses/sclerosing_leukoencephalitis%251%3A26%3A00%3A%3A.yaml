senseId: 'sclerosing_leukoencephalitis%1:26:00::'
synsetId: 14367594-n
simpleMeaning: A rare, long-lasting, slowly worsening brain inflammation from the measles virus, mostly
  in children and young adults, after a first measles infection before age two, usually fatal within three
  years.
scope: Also known as inclusion body encephalitis; it is not ordinary measles or a sudden brain infection.
examples:
- Sclerosing leukoencephalitis follows a first measles infection before age two.
- Death from sclerosing leukoencephalitis usually comes within three years.
