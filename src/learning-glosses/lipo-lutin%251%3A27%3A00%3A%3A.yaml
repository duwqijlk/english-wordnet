simpleMeaning: A body chemical of the steroid kind, made in the ovary; it gets the womb ready for a baby
  and keeps it ready
scope: Also called progesterone; this is the body chemical from the ovary that readies the womb for a
  baby, not other body chemicals.
examples:
- Lipo-Lutin prepares the uterus for pregnancy.
- The ovary makes Lipo-Lutin.
