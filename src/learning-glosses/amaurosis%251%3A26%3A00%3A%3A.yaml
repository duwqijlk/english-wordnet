simpleMeaning: Some or all sight is gone, though the eye shows no sickness, because of sickness in the
  nerve that carries sight, the back of the eye, or the brain.
scope: This word names sight lost through sickness of the nerve, the back of the eye, or the brain, while
  the eye itself shows no sickness.
examples:
- Sight faded with amaurosis though the eye itself looked sound.
- The amaurosis came from sickness of the nerve that carries sight.
