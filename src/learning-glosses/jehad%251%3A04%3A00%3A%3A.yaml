simpleMeaning: For a Muslim, a hard, holy effort toward a goal of right living, faith or public life.
scope: A holy effort by a Muslim toward a moral, spiritual or political goal; jihad is another name for
  it, not a war fought for land or wealth.
examples:
- The writer described jehad as a striving for a better life.
- In his talk, jehad meant a holy effort to live rightly.
