simpleMeaning: a black dress worn by a woman after her husband has died, as a sign of her grief for him
scope: Black clothing worn by a woman after her husband has died; not wild plants that grow in a garden
  where they are not wanted.
examples:
- She wore her weeds for a year after her husband died.
- In the old photo, the young widow is dressed in weeds.
