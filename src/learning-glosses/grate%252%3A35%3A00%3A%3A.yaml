simpleMeaning: to make a harsh, rough sound by rubbing two things together
scope: 'Also called grind: making a harsh sound by rubbing things together; not cutting food into small
  pieces, and not the metal bars that cover an opening.'
examples:
- He grated his teeth in anger.
- The two stones grated against each other as the wall fell.
