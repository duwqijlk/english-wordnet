simpleMeaning: a sauce, a relish or a spice that you put on food to make its taste better or eating it
  more pleasant
scope: A thing put on food to make its taste better or eating it more pleasant, such as mustard or ketchup;
  not the main food itself and not a drink.
examples:
- Mustard is a common condiment for hot dogs.
- She put a spicy condiment on her rice to give it more taste.
