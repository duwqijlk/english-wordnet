simpleMeaning: In computing, a command that stops the work now running and hands control to the main program
  that runs the machine
scope: This is a computing command that stops the work now running and hands control to the main program,
  also called a system call, not a normal step in a program and not a call for help from a person.
examples:
- A supervisor call instruction stopped the program and handed control to the main program.
- When the code hit a supervisor call instruction, the main program took over.
