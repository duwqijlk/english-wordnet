synsetId: 91001651-v
simpleMeaning: To make a computer chip, or any electronic part, run faster than the maker says it should
scope: Making a computer chip, or any electronic part, run faster than the maker says it should, not running
  it at its set speed and not turning it off.
examples:
- He overclocked his old computer to make games run faster.
- Do not overclock the chip unless you know what you are doing.
