simpleMeaning: the quality in a material that lets it go back to its first shape or place after it is
  changed in shape, if it is not changed too far
scope: This is the quality in a material that lets it go back to its shape after being bent or pressed,
  not one single act of springing back.
examples:
- Rubber has great resilience, so a rubber band goes back to its shape after you stretch it.
- The resilience of the foam lets the seat go back to its shape after someone sits on it.
