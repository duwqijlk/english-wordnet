simpleMeaning: Nerve tissue, stringy tissue, and the tissue that joins parts of the body make up this
  harmful growth.
scope: It is also called malignant neuroma, a harmful growth made of nerve tissue, stringy tissue, and
  the tissue that joins parts of the body.
examples:
- They found a neurosarcoma in the nerve tissue.
- The doctors found the neurosarcoma growing among the tissues that join parts of the body.
