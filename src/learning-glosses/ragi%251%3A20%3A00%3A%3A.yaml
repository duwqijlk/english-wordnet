simpleMeaning: a grain grass of the East Indies whose seed is ground into a somewhat bitter flour that
  many people live on
scope: Also called coracan, corakan, finger millet, kurakkan, and ragee; an East Indian grain grass, not
  wheat and not rice.
examples:
- Ragi porridge is a morning meal in many homes.
- They sow ragi before the rains come.
