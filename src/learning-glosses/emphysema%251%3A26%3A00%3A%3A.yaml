simpleMeaning: A wrong state of the lungs in which breathing works less well, linked with smoking, long-lasting
  bronchitis, or old age.
scope: Also called pulmonary emphysema; a wrong state of the lungs in which breathing works less well,
  not a short illness of the chest.
examples:
- Emphysema made it hard for him to climb stairs.
- Years of smoking had left her with emphysema.
