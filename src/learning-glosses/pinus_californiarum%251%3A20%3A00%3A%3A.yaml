simpleMeaning: A very small tree like the Rocky Mountain kind, but with one needle in each small bundle,
  and like the Parry kind in where it grows
scope: This is a very small tree like the Rocky Mountain kind with one needle in each small bundle; California
  single-leaf pinyon is another name for this sense, and it is not the Rocky Mountain kind itself.
examples:
- Pinus californiarum is a very small tree.
- Each small bundle on Pinus californiarum holds one needle.
