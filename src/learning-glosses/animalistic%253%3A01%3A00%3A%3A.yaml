simpleMeaning: about the idea that people are only living creatures with body needs, and have no soul
  or higher mind
scope: This sense is about that idea of people as living creatures ruled by body needs. It is not about
  acting in a wild or cruel way.
examples:
- His animalistic view left no place for the soul.
- The book puts forward an animalistic idea of human life.
