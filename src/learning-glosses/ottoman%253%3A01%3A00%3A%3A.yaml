simpleMeaning: Of or to do with the empire, its people, or its way of life.
scope: To do with the empire and its people and ways, not to do with modern Turkey alone and not a member
  of the ruling house.
examples:
- Ottoman art shows the tastes of the old empire.
- The Ottoman court kept its own ways for hundreds of years.
