simpleMeaning: a tool for winding line, with a round part that turns and a handle, fixed to a fishing
  rod
scope: This is the turning tool on a fishing rod for winding line, not a dance, not a roll of film, and
  not a holder for thread or tape.
examples:
- He turned the reel to pull the fish in.
- She fixed a new reel to her fishing rod before she went to the lake.
