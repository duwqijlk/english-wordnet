simpleMeaning: Streaked dark reddish or chocolate-coloured, the showy wood comes from one of several hot-land
  trees or bushes.
scope: This is a hot-land tree or bush that gives showy streaked wood.
examples:
- The millettia gave showy wood streaked dark reddish.
- The millettia's wood is showy, streaked dark reddish.
