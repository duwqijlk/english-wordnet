simpleMeaning: In football, the player who holds the ball and tries to carry it forward for their team
scope: In football, the player carrying the ball forward on an attack, not a baseball player on base,
  an athlete, a smuggler, or a messenger.
examples:
- The runner broke through the line for ten yards.
- The runner was tackled just short of the goal.
