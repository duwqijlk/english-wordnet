simpleMeaning: thinking that leads to an answer or a view when you do not have all the facts
scope: This is the thinking itself, done with only part of the facts; not the guess or idea that the thinking
  makes, and not the verb for holding such a view.
examples:
- The report was built on conjecture, not on full proof.
- She reached her view by conjecture, since half the records were missing.
