simpleMeaning: the act of hiding who or what something is by changing how it looks
scope: 'Also called camouflage: the act of changing a look to hide who or what it is, not the clothes
  worn to do this and not a false outer look.'
examples:
- He is a master of disguise and can change his look in a minute.
- The spy used disguise to hide who he was from the guards.
