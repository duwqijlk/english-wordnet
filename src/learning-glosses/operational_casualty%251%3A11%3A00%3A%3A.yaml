simpleMeaning: Arms and gear lost while soldiers are at work in the field
scope: This is arms and gear lost while soldiers are at work in the field; operational damage is another
  name for this sense, and not a soldier hurt or killed or gear lost in training.
examples:
- The army counted the lost trucks as operational casualties after the march.
- One operational casualty was a radio set left behind in the field.
