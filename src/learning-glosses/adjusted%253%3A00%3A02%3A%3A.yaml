simpleMeaning: able to live in a normal way in daily life and to stay calm and steady in feelings
scope: This describes a person who can live in daily life in a normal way and stays calm; it is not a
  thing changed to fit a need and not clothes changed to fit better.
examples:
- After the move, the children are well adjusted and happy at school.
- She is a calm, well adjusted adult who deals well with each day.
