simpleMeaning: widely regarded as valid or worthy of recognition.
scope: This is about a view or practice that most people approve, not about someone receiving an offer
  or a gift.
examples:
- It is now accepted that regular exercise improves health.
- Her theory is widely accepted among scientists.
