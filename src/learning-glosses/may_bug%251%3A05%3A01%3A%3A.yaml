simpleMeaning: Any one of several big European kinds that eat plants, harming them both as grubs and as
  grown insects.
scope: 'Also called a cockchafer, a May beetle, or Melolontha melolontha: any one of several big European
  kinds that eat plants as grubs and as grown insects, not the North American kind that eats leaves in
  late spring.'
examples:
- May bugs were all over the garden.
- The May bug eats plants as a grub and as a grown insect.
