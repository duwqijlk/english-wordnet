simpleMeaning: The sudden death, that no one looked for, of a baby that seemed well, while it sleeps.
scope: 'Also called cot death, crib death, infant death and sudden infant death syndrome: the sudden death
  of a baby that seemed well, while it sleeps, not the death of a baby that was sick.'
examples:
- The baby died of SIDS in her sleep.
- Doctors still study SIDS to learn why it happens.
