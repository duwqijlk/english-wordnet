simpleMeaning: What belongs to the days of knights in the Middle Ages, and to the code of honour they
  kept
scope: Also called medieval, knightly or chivalric, this is about the age of knights and their code of
  honour, not about something old-fashioned or shut to new ideas.
examples:
- The castle's mediaeval hall was dressed for a feast of knights.
- She loved the mediaeval tales of brave knights and their code of honour.
