simpleMeaning: To rip something apart with force, or to come apart that way.
scope: This means ripping or splitting something by force, not simply moving an object toward you or dragging
  it in a direction.
examples:
- She pulled the chicken into strips with her fingers.
- The old shirt pulled apart at the seams when he bent over.
