simpleMeaning: Applause from the crowd in the seats is what this person performs for
scope: A person who performs mainly to win cheers from the watching crowd, not a performer who plays for
  the work itself and not a fan in the seats.
examples:
- The grandstander waved to the crowd after every play.
- He was a grandstander who loved the cheers more than the game.
