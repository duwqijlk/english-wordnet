simpleMeaning: Some linguists hold that sentences that ask questions form a mood of their own.
scope: 'Also called the interrogative mood: the idea held by some linguists that sentences that ask questions
  form a mood of their own, not a sentence that asks for a reply, not a word about verbs in that mood,
  and not anything to do with an interrogation.'
examples:
- In the grammar book, the interrogative was treated as a mood of its own.
- Some linguists count the interrogative among the moods of a verb.
