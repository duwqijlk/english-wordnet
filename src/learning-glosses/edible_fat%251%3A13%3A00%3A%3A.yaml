simpleMeaning: Most of the soft flesh in animals, and in seeds and other plant parts, is made of this
  oily or greasy stuff, a fat that can be eaten.
scope: The name covers the oily or greasy stuff making up most of the soft flesh in animals and in seeds
  and other plant parts.
examples:
- We cooked with the edible fat.
- The edible fat came from the animal.
