simpleMeaning: a blue-white shiny metallic element that breaks easily at normal heat but can be shaped
  when hot, used in many alloys and to coat iron, found as sulphide in blende
scope: Also called Zn, atomic number 30; a blue-white metal used in alloys, not iron and not tin.
examples:
- Zinc coats the iron to stop rust.
- The alloy contained zinc and copper.
