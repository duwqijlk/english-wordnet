simpleMeaning: having to do with a tool that uses a stream of tiny charged parts to make very small things
  look big
scope: Having to do with a tool that uses a stream of tiny charged parts to make very small things look
  big, not with a tool that uses light to make things look big and not with work done by eye alone.
examples:
- The electron microscopic study showed the fine lines on the cell wall.
- She used electron microscopic images to check the shape of the virus.
