simpleMeaning: Sea animals that no one wants, taken in nets set for a different kind.
scope: Sea animals no one wants, taken in nets set for another kind, also called by-catch; not the fish
  the nets were set for and not animals taken on purpose.
examples:
- The bycatch included dolphins and small sharks.
- Thousands of dolphins die as bycatch each year.
