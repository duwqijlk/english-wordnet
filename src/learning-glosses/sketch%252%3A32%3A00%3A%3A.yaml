simpleMeaning: to say or write the main points of something in a short and rough way, with no small details
scope: 'Also called outline: to say the main points in a short, rough way, not to draw a picture and not
  a drawing itself.'
examples:
- He sketched his ideas for the new book in a short talk.
- Please sketch the story so we know the main points before we read it.
