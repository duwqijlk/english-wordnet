simpleMeaning: Big, four-sided scales cover the belly of this lizard from warm parts of the Americas,
  which also has a long tail.
scope: Also called teiid lizard, this warm-American lizard is known by its long tail and big belly scales.
examples:
- The teiid darted off with its long tail behind it.
- The teiid's belly showed big, four-sided scales.
