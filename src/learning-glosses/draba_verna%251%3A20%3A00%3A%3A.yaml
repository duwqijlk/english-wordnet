simpleMeaning: A one-year weed of Europe and North America with a ring of leaves at the base and tiny
  flowers followed by long seed cases.
scope: 'Also called shad-flower, shadflower or whitlow grass: a one-year weed of Europe and North America
  with a ring of leaves at the base, not a tall shrub and not a plant with large flowers.'
examples:
- Draba verna grew by the path, its tiny flowers followed by long seed cases.
- The ring of leaves at the base marks Draba verna.
