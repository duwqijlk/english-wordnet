simpleMeaning: a strong illness that comes on fast, gives a fever, is caused by a virus, and spreads easily
  from person to person
scope: 'Also called grippe and flu: a strong illness with fever that spreads fast between people, not
  a common cold and not a stomach illness.'
examples:
- Influenza kept her in bed with a fever for a week.
- Many workers were out sick with influenza that winter.
