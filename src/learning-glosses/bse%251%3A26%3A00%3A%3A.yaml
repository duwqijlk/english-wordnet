simpleMeaning: A deadly sickness of cattle that harms the brain and spinal cord, making the animal stagger
  and grow restless.
scope: Also called bovine spongiform encephalitis and mad cow disease, this is a fatal sickness of cattle
  that harms the brain and spinal cord, set apart from other sicknesses of cattle and from sicknesses
  that harm other farm animals.
examples:
- BSE spread through the herd that year.
- The vet tested the cow for BSE.
