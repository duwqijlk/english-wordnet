simpleMeaning: Said of a thing that can harm the parts used for hearing and for keeping steady, or the
  cord that carries sound to the brain
scope: Said of a thing that can harm hearing or balance, not a thing that harms the eye and not a thing
  that is safe to take.
examples:
- Some drugs are ototoxic.
- The doctor warned that the medicine could be ototoxic.
