simpleMeaning: a store of facts on a computer where the links between items of fact are set out in clear
  form so they can be found and used
scope: A store of facts on a computer with clear links between items, not a store of facts with no links
  and not a set of facts on paper.
examples:
- She put the names in a relational database so she could find each one fast.
- The relational database keeps links between the facts it holds.
