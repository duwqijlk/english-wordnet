simpleMeaning: A plant of eastern and central North America, with creamy white flowers touched with brown
  or purple; poisonous above all to grazing animals.
scope: A plant of eastern and central North America with creamy white flowers, also called white camas;
  its flowers touched with brown or purple and its harm to grazing animals set it apart from harmless
  plants of the same lands.
examples:
- Zigadenus glaucus bears creamy white flowers.
- Cattle must not eat Zigadenus glaucus, which is poisonous.
