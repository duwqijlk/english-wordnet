simpleMeaning: Of or relating to tiny bits of rock and metal that move through space.
scope: Of or relating to tiny bits of rock and metal that move through space, also called micrometeoritic;
  not the tiny bit of rock itself, and not a rock that burns up in the sky.
examples:
- Micrometeoric dust settles on the roof of the space station.
- Scientists study micrometeoric particles to learn about the early solar system.
