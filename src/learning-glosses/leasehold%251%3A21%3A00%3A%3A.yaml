simpleMeaning: land or other property that a person holds under a lease, a written deal to use it for
  a set time in return for pay
scope: Land or property held under a lease; not the lease itself, the written deal, and not land a person
  owns with no time limit.
examples:
- They bought the leasehold for the flat, with eighty years left to run.
- He sold his leasehold to a new buyer last year.
