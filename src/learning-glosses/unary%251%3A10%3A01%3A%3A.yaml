senseId: 'unary%1:10:01::'
synsetId: 92442082-n
simpleMeaning: a way of writing numbers in which one mark stands for 1 and is written again and again,
  as many times as the number itself, one writing per number
scope: Not the tens system or the twos system; also called unary numeral system.
examples:
- In unary, the number five is written as five marks in a row.
- She counted in unary, making one stroke for each sheep.
