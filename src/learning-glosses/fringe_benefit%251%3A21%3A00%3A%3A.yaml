simpleMeaning: An extra thing that comes with some kinds of jobs, especially one the worker is seen to
  have a right to
scope: 'Also called a perk or a perquisite: an extra thing that comes with some kinds of jobs, not a gift
  from a friend.'
examples:
- A company car is a fringe benefit of her job.
- Free meals are one of the fringe benefits here.
