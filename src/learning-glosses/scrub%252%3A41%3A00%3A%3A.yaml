simpleMeaning: to put off a planned thing for good, or to call it off
scope: To put off a planned thing for good, or to call it off; also called scratch, and cancel is another
  name for this sense; not the act of cleaning and not thick low plants.
examples:
- We had to scrub our vacation plans.
- They scrubbed the dinner party when the host fell ill.
