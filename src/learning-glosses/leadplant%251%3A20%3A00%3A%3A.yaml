simpleMeaning: Once believed to mark lead ore, a shrub that grows in sandy woods and along stream banks
  in the western US, bearing grey-downy pinnate bloom and clusters of dull-colored flowers.
scope: This is the whole shrub of sandy western US woods and stream banks, not the metal lead; lead plant,
  written as two words, is the same plant.
examples:
- Leadplant covers the sandy banks along the stream.
- The leadplant's dull-colored flowers bloom in loose clusters.
