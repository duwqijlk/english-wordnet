simpleMeaning: Used to make the drink absinthe, this bitter herb smells sweet and strong and comes from
  the mild lands of Europe and Asia and the north of Africa.
scope: Also called absinthe, lad's love and old man, this is the sweet-smelling bitter herb used to make
  the drink absinthe.
examples:
- The common wormwood smells sweet but tastes bitter.
- A common wormwood plant is used to make absinthe.
