simpleMeaning: with a rough, uneven side, used of paper made by hand or of paper made to look like it
scope: This describes paper with a rough, uneven side, also called deckled or featheredged; not paper
  with a smooth cut side and not paper with a torn side.
examples:
- The deckle-edged pages felt rough at the sides.
- She picked deckle-edged paper for the invitations.
