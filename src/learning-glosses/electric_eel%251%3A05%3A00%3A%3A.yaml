simpleMeaning: A long thin fish from the fresh waters of South America that can give shocks from parts
  in its body.
scope: A long thin fish from the fresh waters of South America that can give shocks, not a true eel and
  not a sea fish.
examples:
- The electric eel gave a strong shock.
- Electric eels live in South American rivers.
