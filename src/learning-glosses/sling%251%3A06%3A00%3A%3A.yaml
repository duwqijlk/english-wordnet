simpleMeaning: a wide three-sided piece of cloth that hangs from around the neck and holds up a hurt lower
  arm
scope: Cloth that hangs from the neck to hold up a hurt arm; not the Y-shaped toy for throwing stones
  and not the strap weapon.
examples:
- After breaking his arm, he wore a sling for six weeks.
- The nurse put her hurt arm in a sling.
