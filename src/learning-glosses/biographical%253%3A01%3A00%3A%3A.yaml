simpleMeaning: to do with a book or account that tells the story of a person's life
scope: To do with the true life story of a real person; not about made-up people and not about a place
  or event with no person at its centre.
examples:
- The book gives biographical details about the singer's early life.
- She is writing a biographical film about the famous painter.
