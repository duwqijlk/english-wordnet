simpleMeaning: A bush that bears kumquats with round fruit.
scope: Also called marumi kumquat, this is a bush that grows kumquats with round fruit, not the fruit
  itself and not a bush grown for its flowers.
examples:
- The marumi in the garden was covered in small round fruit.
- We planted a marumi beside the wall for its round kumquats.
