simpleMeaning: able to stay alive and not be harmed when conditions around it are hard, or when its body
  is under stress
scope: This is about a living thing staying well in hard conditions, not about taking a wide, open view
  of other people and not about staying calm and kind when someone tries to make you angry.
examples:
- This plant is tolerant of salt water and dry soil.
- These fish are tolerant as long as the water does not change too much.
