simpleMeaning: a stalk in a flower that lifts the pistil, the part that makes seeds, up above the rest
  of the flower
scope: A stalk in a flower that lifts the seed-making part up above the rest of the flower, not the wide
  base that holds that part and not the stem of the whole flower.
examples:
- The gynophore raises the pistil above the flower's centre.
- In this plant, the gynophore holds the seed-making part high.
