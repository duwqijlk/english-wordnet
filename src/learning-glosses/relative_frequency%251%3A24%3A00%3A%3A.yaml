senseId: 'relative_frequency%1:24:00::'
synsetId: 13843782-n
simpleMeaning: the share of all the counts in one group, shown as a number got by dividing the count in
  that group by the count of all the groups
scope: 'Also called frequency: the share of all the counts that fall in one group, not the count itself
  and not a count of all the groups put together.'
examples:
- The relative frequency of heads was 52 out of 100 tosses.
- We worked out the relative frequency for each age group in the class.
