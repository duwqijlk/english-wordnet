simpleMeaning: a form of matter, unlike a solid or liquid, that is very light and thin, changes size easily
  with heat or pressure, and spreads out evenly to fill any container.
scope: This is the general state of matter, not the fuel used in car engines and not one particular air-like
  substance.
examples:
- Water can be a solid, a liquid or a gas.
- At high temperatures, the metal turns into a gas.
