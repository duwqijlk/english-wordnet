schema: oewn-learning-gloss-v2
senseId: 'copulative%1:10:00::'
synsetId: 06484495-n
simpleMeaning: In grammar, a verb such as ‘be’ or ‘become’ that joins the subject of a sentence to the
  words that tell more about it.
scope: In grammar, this is a verb such as ‘be’ or ‘become’ that joins the subject to the words that tell
  more about it; copula and linking verb are other names for this sense, not a verb that shows an action
  and not a word that joins two sentences.
examples:
- ‘Is’ is a copulative in ‘She is happy’.
- ‘Become’ works as a copulative in ‘He became a teacher’.
