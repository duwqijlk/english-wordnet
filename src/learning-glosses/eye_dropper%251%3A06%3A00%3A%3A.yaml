simpleMeaning: With a squeeze bulb at one end, a small tube sucks up liquid and lets it out bit by bit.
scope: Also called a dropper, this small tube lets liquid out bit by bit, not all at once.
examples:
- She used an eye dropper to put the medicine in her eyes.
- He filled the eye dropper and let the liquid out bit by bit.
