simpleMeaning: a reaction inside atoms in which their centres join to form heavier centres, giving out
  energy at the same time
scope: A reaction inside atoms in which their centres join to form heavier centres, giving out energy
  at the same time; not joining bones in the spine, not joining the two eyes' views, and not joining sounds
  or words.
examples:
- The sun gets its power from nuclear fusion.
- Fusion in the star's core joins light centres into heavier ones.
