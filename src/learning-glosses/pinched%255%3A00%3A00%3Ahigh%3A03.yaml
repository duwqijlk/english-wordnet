simpleMeaning: sounding as if the nose is squeezed shut, so the voice comes through the nose
scope: This is about a voice that sounds as if the nose is squeezed shut, so the sound comes through the
  nose. Not about something pressed tight so it feels bad.
examples:
- He spoke in a pinched voice because his nose was blocked.
- Her pinched, high voice made her hard to understand on the phone.
