simpleMeaning: A 1950s style of Black harmony singing, grown in New York City from gospel music, often
  unaccompanied, with tight four-part harmonies; named for nonsense syllables in the backing vocals.
scope: This is the 1950s vocal-group style itself, not the gospel singing it grew out of and not a single
  song's nonsense refrain.
examples:
- The group sang doo-wop on street corners in the 1950s.
- Her grandfather still plays the doo-wop records he grew up with.
