simpleMeaning: the bright color of ripe lemons or sunflower petals, or a substance that gives this color.
scope: This is the color itself or a coloring matter, not something that has faded with age, and not the
  process of changing color.
examples:
- The walls were painted a pale yellow.
- Yellow is her favorite color.
