simpleMeaning: A library scheme that sorts factual publications into subject groups, gives each a three-digit
  number and further digits after a point, then shelves them in number order.
scope: The scheme itself, not a particular library's shelves or catalog; it covers factual publications
  only, and is one of several ways of arranging a collection rather than a rule for fiction.
examples:
- The librarian showed us how the decimal system of classification puts a book on the shelf by its number.
- Under the decimal system of classification, every subject has its own three-digit place.
