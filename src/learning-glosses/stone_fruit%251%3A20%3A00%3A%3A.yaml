simpleMeaning: A fruit with soft flesh around one hard seed that does not split open when ripe, such as
  a peach, plum, cherry, elderberry, olive, almond or jujube.
scope: This is the fruit type with soft flesh and a single hard stone inside; drupe is another name for
  it, and it is not a berry or a fruit that bursts open to release seeds.
examples:
- Peaches and plums are stone fruits that ripen in late summer.
- She sliced the stone fruit and added it to the tart.
