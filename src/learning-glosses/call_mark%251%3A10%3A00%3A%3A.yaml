simpleMeaning: a set of letters and numbers written on a book that shows where it goes on a shelf
scope: 'Also called a call number and a pressmark: a set of letters and numbers on a book that shows its
  shelf place, not a phone number and not a mark made by a pen.'
examples:
- The librarian read the call mark on the spine to find the book's shelf.
- Each book in the library has its own call mark printed inside the front cover.
