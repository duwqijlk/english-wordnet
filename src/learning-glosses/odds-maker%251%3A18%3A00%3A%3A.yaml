simpleMeaning: A person who sets the betting prices from worked-out chances of how a race or game will
  end, above all a horse race.
scope: A person who sets betting prices from worked-out chances, also called handicapper; not a person
  who takes bets and not a person who only watches the race.
examples:
- The odds-maker set the favourite at two to one.
- An odds-maker works out the chances before a horse race.
