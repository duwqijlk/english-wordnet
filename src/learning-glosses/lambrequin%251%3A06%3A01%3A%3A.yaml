simpleMeaning: A cloth a knight wears over his metal head cover
scope: A scarf worn over a knight's helmet, not a short hanging cloth at a shelf edge or a window top.
examples:
- His lambrequin covered the bright metal of his helmet.
- The lambrequin bore the knight's colours over his helmet.
