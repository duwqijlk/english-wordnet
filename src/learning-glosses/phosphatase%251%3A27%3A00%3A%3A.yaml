simpleMeaning: Any of a set of body chemicals that speed up the breaking down in water of phosphates from
  living things.
scope: Any of a set of body chemicals that speed up the breaking down in water of phosphates from living
  things; not a vitamin and not a poison.
examples:
- Phosphatase levels in the blood were high.
- The lab measured phosphatase in the sample.
