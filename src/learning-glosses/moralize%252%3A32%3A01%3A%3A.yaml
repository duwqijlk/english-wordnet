simpleMeaning: to work out and explain what something means about what is right and wrong
scope: This is about explaining what something means about right and wrong, not about talking at length
  in a judging way about right and wrong, and not about making a person behave better.
examples:
- The teacher asked us to moralize the story and explain what it says about right and wrong.
- He tried to moralize the tale, finding a lesson about kindness in it.
