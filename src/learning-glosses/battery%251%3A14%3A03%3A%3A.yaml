simpleMeaning: 'In baseball, the two players who work as one: the player who throws the ball and the player
  who catches it'
scope: In baseball, the thrower and catcher working as one, not a thing that makes power, and not a group
  of guns.
examples:
- The battery worked well together all season.
- The battery of the home team kept the other side from scoring.
