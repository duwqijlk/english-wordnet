simpleMeaning: to send friendly words to someone, for example to say hello or to wish them well
scope: To send friendly words or good wishes to someone; not to say hello to someone when you meet them.
examples:
- She greeted her cousin by sending a card for the new year.
- He sent a message to greet his friends at the start of the holiday.
