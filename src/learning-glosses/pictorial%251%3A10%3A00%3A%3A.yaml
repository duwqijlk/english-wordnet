simpleMeaning: a magazine or newspaper that is printed regularly and has many pictures in it
scope: This is the name of a magazine or newspaper with many pictures; it is not the word used to describe
  a story told in pictures.
examples:
- She bought a pictorial about old trains at the station shop.
- The pictorial had a full page of pictures of the small town.
