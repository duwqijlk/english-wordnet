simpleMeaning: In anatomy, a wall of muscle that divides the belly area from the chest area and helps
  with breathing
scope: 'Also called midriff: the muscle wall inside the body that helps with breathing, not the birth-control
  cup, not the sound part in a speaker or microphone, and not the camera part that controls light.'
examples:
- Her diaphragm moved as she took a deep breath.
- Singers learn to breathe using the diaphragm.
