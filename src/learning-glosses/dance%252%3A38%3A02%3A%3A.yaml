simpleMeaning: It means to jump or move with light hops, or to move up and down or from side to side.
scope: This is the light jumping or swaying sense, not the main sense of moving the body in time to music.
examples:
- The leaves danced in the wind.
- The puppy danced around her feet, hoping for a treat.
