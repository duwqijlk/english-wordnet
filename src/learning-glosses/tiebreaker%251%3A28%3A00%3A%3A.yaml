simpleMeaning: extra play after the normal time of a game, when scores are equal, used to pick a winner,
  as in tennis and soccer
scope: This is the extra play used to pick a winner when scores are equal, not the normal time of the
  game and not the final score itself.
examples:
- The match went to a tiebreaker after both players won six games each.
- They played a tiebreaker to decide the game after the score stayed equal.
