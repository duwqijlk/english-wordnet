simpleMeaning: One of a pair of small metal contacts in the engine part that sends current to the spark
  plugs; a turning arm touches them and current flows to the plugs.
scope: This sense is not a sharp tip, not a dot or punctuation mark, and not a unit of scoring; it is
  a small metal contact inside a car's ignition part.
examples:
- The mechanic replaced the points and set the gap.
- Dirty points in the distributor can stop the engine.
