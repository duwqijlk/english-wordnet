simpleMeaning: joining two corners of a flat shape that do not sit next to each other, or two corners
  of a solid shape that are not on the same side
scope: A line joining corners that do not sit side by side, not the numbers in a square table and not
  a cut across cloth.
examples:
- She drew a diagonal line across the page.
- The diagonal joins the top corner to the bottom corner of the room.
