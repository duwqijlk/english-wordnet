simpleMeaning: Something that can be guessed from a small sign
scope: Something that can be guessed from a small sign; not something known for sure and not something
  with no sign at all.
examples:
- It is presumable that he left early, since his coat is gone.
- Her presumable reason for leaving was the heavy rain.
