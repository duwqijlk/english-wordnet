simpleMeaning: People grow this canna above all so they can eat its rootstock and get starch from it.
scope: Also called arrowroot and indian shot, this names the canna grown for the starch got from its rootstock.
examples:
- Farmers grow achira for the starch in its roots.
- They dug up achira and took the starch from its rootstock.
