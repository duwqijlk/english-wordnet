simpleMeaning: A homeless boy who has been left alone and roams the streets; the word is sometimes used
  in an unkind way.
scope: This is a homeless boy left alone who roams the streets, also called a throwaway; not a runaway
  from a home, and not a boy who sells things in the street.
examples:
- The gamin slept in doorways and begged for bread.
- In the old story, a gamin roamed the streets of Paris.
