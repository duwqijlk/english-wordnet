simpleMeaning: a strong post on a dock or on a ship, used to tie ropes that hold a boat in place
scope: 'Also called bitt: a strong post on a dock or ship for tying ropes that hold a boat, not a fence
  post or a lamp post.'
examples:
- The sailor tied the thick rope to a bollard on the dock.
- A bollard on the ship held the mooring line fast.
