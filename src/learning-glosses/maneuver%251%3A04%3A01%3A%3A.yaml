simpleMeaning: a move made to get away from or avoid a person you are fighting against
scope: This is a move to avoid an opponent; it is not a planned skilled movement in general, and not the
  verb for moving soldiers or ships in war.
examples:
- The boxer's last maneuver took him out of his opponent's reach.
- With one quick maneuver, she got away from the player chasing her.
