simpleMeaning: money paid by insurance when a person has a problem with the body or mind that limits what
  they can do
scope: Money paid by insurance when a person has a problem with the body or mind that limits what they
  can do, not wages for work done and not money paid when a person dies.
examples:
- She lives on a disability benefit after her accident.
- The disability benefit covers part of his lost pay.
