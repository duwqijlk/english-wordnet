simpleMeaning: a short note in a book, a piece of music, or on a photo, giving it to someone or something
scope: This is a short note giving a book, a piece of music, or a photo to someone or something; dedication
  is another name for this sense; not letters carved in stone, and not the work of carving them.
examples:
- 'The inscription in the book read: ''To my mother, with love.'''
- He wrote an inscription on the photograph before giving it away.
