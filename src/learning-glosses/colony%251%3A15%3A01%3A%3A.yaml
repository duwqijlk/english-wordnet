simpleMeaning: a place or area of land that a far country rules over
scope: This is land ruled by a far country; it is not the group of people who settle there, and not a
  group of living things grown from one cell.
examples:
- India was once a British colony, ruled from London.
- The colony sent its goods to the country that ruled it.
