simpleMeaning: A yellow metal of the rare earth group that can join with three other atoms; it turns up
  in monazite rock, bastnasite rock, with cerium, lanthanum, praseodymium
scope: A metal, also called atomic number 60 and neodymium; not iron and not a rock.
examples:
- Nd is a yellow metal of the rare earth group.
- Nd turns up in monazite rock.
