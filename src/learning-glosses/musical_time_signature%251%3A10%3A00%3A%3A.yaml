simpleMeaning: A mark in written music that shows how many beats fill a bar and which written sign gets
  one beat.
scope: A mark in written music that shows the beats in a bar; not a mark that shows the key, and not a
  mark that shows how fast to play.
examples:
- The musical time signature at the start showed three beats to a bar.
- She read the musical time signature before she began to play.
