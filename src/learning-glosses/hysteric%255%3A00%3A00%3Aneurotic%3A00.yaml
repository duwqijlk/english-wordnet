simpleMeaning: showing or caused by a kind of illness of the mind called hysteria
scope: Also called hysterical, this describes something showing or caused by an illness of the mind; it
  is not the name for a person who has that illness.
examples:
- He had hysteric attacks and could not control his body.
- The doctor noted her hysteric loss of feeling in one hand.
