simpleMeaning: A block that soaks up ink and gives it out in an even coat to a rubber stamp
scope: A block of ink for stamping, not the soft part under a foot or finger, not a leaf floating on water,
  and not a place for launching rockets.
examples:
- She pressed the stamp on the pad before marking the paper.
- The pad was dry, so the stamp left no mark.
