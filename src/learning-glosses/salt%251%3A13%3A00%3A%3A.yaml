simpleMeaning: A white solid made of small hard grains, especially sodium chloride (a common chemical),
  used to add taste to food and to keep food from going bad
scope: This is the white salt you put on food and use to keep food from going bad. It is not the wider
  chemical sense, where a salt is made when a metal takes the place of hydrogen in an acid.
examples:
- She put a little salt on her eggs.
- They packed the fish in salt to keep it fresh.
