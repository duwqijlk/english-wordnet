senseId: 'registrar%1:18:03::'
synsetId: 10536730-n
simpleMeaning: a person whose job is to keep a list of who owns the parts of a company and the loan papers
  it has sold to people
scope: This person keeps a company's lists of who owns its parts and loan papers, not school lists and
  not lists of births or marriages.
examples:
- The registrar kept a list of everyone who owned the company's stocks.
- When Ana bought bonds from the company, the registrar wrote her name in its list.
