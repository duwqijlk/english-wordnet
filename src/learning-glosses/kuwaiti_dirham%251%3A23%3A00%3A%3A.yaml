simpleMeaning: A unit of money worth one tenth of the dinar of Kuwait, equal to 100 fils.
scope: A unit of money worth a tenth of the dinar of Kuwait, equal to 100 fils; also called dirham; the
  tenth part of a dinar, not the dinar itself.
examples:
- He paid ten Kuwaiti dirham for the book.
- A Kuwaiti dirham is worth a tenth of a dinar.
