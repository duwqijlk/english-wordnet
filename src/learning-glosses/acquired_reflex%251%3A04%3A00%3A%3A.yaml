simpleMeaning: a learned act of the body that happens only when a set signal comes first
scope: This is a learned act of the body that happens only when a set signal comes first, also called
  conditional reaction, conditional reflex, conditional response, conditioned reaction, conditioned reflex,
  and conditioned response; it is not a natural act of the body that needs no signal.
examples:
- After weeks of practice, the bell set off an acquired reflex in the dog.
- The acquired reflex made her hand move as soon as the light came on.
