simpleMeaning: a small metal plate fixed to the toe or heel of a shoe, used when dancing so the shoe makes
  a clicking sound
scope: A small metal plate on a dance shoe, not the act of dancing with such plates, not a part for letting
  water out, and not a tool for cutting grooves in a hole.
examples:
- The tap on the heel of her dance shoe came loose during the show.
- He fixed a new tap to the toe of each shoe before the dance.
