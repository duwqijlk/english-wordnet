simpleMeaning: a number made from the prices of shares of a group of firms that stand for the whole market
scope: This is a number that shows how a group of shares is doing, also called stock market index, not
  the price of one share and not a list of all shares.
examples:
- The stock index rose by fifty points today.
- Traders watch the stock index to see how the market is doing.
