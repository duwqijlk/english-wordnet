simpleMeaning: A decorative flowering kind in the plant group Malcolmia.
scope: This sense is the Malcolmia plant grown for ornament, not the Old World garden plant with bright
  blooms, the graft rootstock, the thick perennial stem, the broth, shop merchandise, company shares,
  a share certificate, a stored supply, a gun or tool handle, lumber, a white cravat, farm animals or
  a breed of them, a family line, reputation, the adjective senses (overused, routine, standard), or any
  verb sense (keep on hand, equip, supply with fish or livestock, amass, furnish, sprout).
examples:
- Virginia stock self-seeds freely along the garden path.
- She sowed Virginia stock for its pale violet flowers.
