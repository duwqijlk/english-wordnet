simpleMeaning: A military operation that reinforces a force, often by bringing in fresh troops or equipment,
  or helps it carry out its mission.
scope: This is a military operation that strengthens or assists a force, not moral encouragement, financial
  help, a physical prop, evidence, or approval of a policy.
examples:
- The battalion called for artillery support before advancing.
- Air support brought fresh supplies and helped the troops complete their mission.
