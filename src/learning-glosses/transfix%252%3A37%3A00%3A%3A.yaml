simpleMeaning: to leave a person or animal quite unable to move, after a hard stare or a sudden rush of
  fear or awe
scope: 'Also called grip and fascinate: to leave a person or animal unable to move with a hard stare or
  sudden fear or awe, not to pierce with a sharp point.'
examples:
- The snake charmer transfixed the cobra with his steady stare.
- She stood transfixed as the headlights swept towards her.
