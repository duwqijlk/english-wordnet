simpleMeaning: Unable to move some part of the body, having lost that power.
scope: Also called paralyzed, a person unable to move some part of the body, not the noun use for such
  a person, and not a thing to do with that loss.
examples:
- After the fall, their arm was paralytic and would not lift.
- The patient was paralytic on one side after the stroke.
