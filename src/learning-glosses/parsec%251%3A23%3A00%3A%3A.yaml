simpleMeaning: A measure of length in space, the distance from Earth at which a star shows a shift of
  one second of arc, equal to 3.262 light years.
scope: A measure of length in space, not a light year and not a measure of time.
examples:
- The star lies two parsecs from Earth.
- Astronomers gave the distance in parsecs.
