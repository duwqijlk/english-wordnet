simpleMeaning: 'People can eat this fungus, though few like it: a whitish, often round cap, white surface
  full of tiny holes, and a white stalk in the middle, found under conifers.'
scope: A fungus found under conifers, with a whitish cap and a white surface full of tiny holes, that
  can be eaten but is not liked much.
examples:
- We found a sheep polypore under the conifers.
- The sheep polypore was edible but not popular.
