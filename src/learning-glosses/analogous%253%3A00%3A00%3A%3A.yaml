simpleMeaning: having the same job or use, but not coming from the same starting form in the long change
  of living things over time
scope: This sense is about parts of living things that do the same job but did not come from the same
  starting form; it is not the wider sense of being alike in some ways.
examples:
- The wings of a bee and those of a bird are analogous, as both are used to fly but they formed in different
  ways.
- The wings of a butterfly and the wings of a bat are analogous, because both are used for flying but
  they came from different starting forms.
