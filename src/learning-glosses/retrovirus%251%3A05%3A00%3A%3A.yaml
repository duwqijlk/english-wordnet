senseId: 'retrovirus%1:05:00::'
synsetId: 01338923-n
simpleMeaning: A virus whose instructions are RNA; it brings an enzyme that copies them into DNA, which
  then becomes part of the infected cell's own DNA.
scope: This is the whole class of viruses that copy their RNA into DNA, not one particular virus such
  as HIV.
examples:
- HIV is a retrovirus that copies its RNA into the DNA of the cells it infects.
- The team found a retrovirus in the sample and studied how it inserted its genes into the host genome.
