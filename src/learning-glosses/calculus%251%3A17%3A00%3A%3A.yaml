simpleMeaning: A hard lump made when mineral salts build up together; it is found in hollow organs or
  tubes inside the body
scope: Also called concretion; this is a hard lump inside the body, not the branch of maths and not the
  hard layer on teeth.
examples:
- A calculus in his kidney caused great pain.
- The doctor found a small calculus in the bladder.
