simpleMeaning: a substance spread on a surface to protect it or make it look better, especially a color
  mixture in a liquid, that dries into a hard layer
scope: Also called paint. This is a liquid coating for a surface, not the dry powder used to make it,
  and not a natural coloring substance in a plant or animal body.
examples:
- The artist spread the red pigment over the canvas, and it dried to a hard finish.
- A thick pigment was used as a coating on the metal gate.
