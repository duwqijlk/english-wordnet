simpleMeaning: A small dark sea animal of the Atlantic coast of the United States, in which the biggest
  male leads the group.
scope: A small dark sea animal of the Atlantic coast; blackfish, common blackfish and pilot whale are
  other names for this sense, not the large whale with a hollow in its head.
examples:
- The black whale swam with its group near the shore.
- A black whale led the school into the bay.
