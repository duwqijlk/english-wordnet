senseId: 'northwest_by_north%1:24:00::'
synsetId: 13857236-n
simpleMeaning: A compass point that lies one step toward the Arctic from the point halfway between west
  and the Arctic.
scope: This is the compass point one step north of northwest; not northwest by west, which lies one step
  to the west of northwest, and not northwest itself.
examples:
- The ship steered northwest by north after leaving the harbour.
- On the old compass, northwest by north lies between northwest and north-northwest.
