simpleMeaning: Felines are drawn to this germander of the warm lands round the sea, which has small hairy
  leaves and reddish purple flowers
scope: Also called marum, this germander of the warm lands round the sea draws felines to it, unlike the
  common thyme grown for cooking.
examples:
- Cat thyme drew the cats to its small hairy leaves.
- The cat thyme had reddish purple flowers.
