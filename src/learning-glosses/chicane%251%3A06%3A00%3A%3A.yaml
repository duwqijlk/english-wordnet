senseId: 'chicane%1:06:00::'
synsetId: 03019863-n
simpleMeaning: a barrier that can be moved, set on a race track, at times before a dangerous sharp bend,
  to slow cars so they pass one by one
scope: A barrier that can be moved on a race track, not a fixed wall and not a bend in the track itself.
examples:
- The chicane at the end of the straight slowed the cars right down.
- Drivers had to brake hard for the chicane before the sharp corner.
