simpleMeaning: 'The second half of the menstrual cycle, after an egg is released: a temporary gland produces
  progesterone, preparing the womb lining for a fertilized egg; without one, bleeding begins.'
scope: This is the second half of the cycle, after ovulation; it is not the first half, when an egg matures,
  and secretory phase is another name for this same span.
examples:
- Progesterone levels rise during the luteal phase.
- The luteal phase usually lasts around two weeks.
