simpleMeaning: A feeling of bliss with a tingling like static electricity on the skin, usually starting
  on the head and spreading down the neck and upper back, bringing on calm.
scope: This is the relaxing tingling that soft sounds or close attention can bring on, often shortened
  to ASMR; it is not a nerve disorder or a shiver from cold.
examples:
- Videos of soft whispering give many people an autonomous sensory meridian response.
- She felt an autonomous sensory meridian response spread from her scalp down her neck.
