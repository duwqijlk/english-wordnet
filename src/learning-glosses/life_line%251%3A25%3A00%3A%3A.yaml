simpleMeaning: People who read hands say this fold in the hand shows how long a person will live
scope: 'Also called lifeline and line of life: a fold in the hand that hand readers say shows how long
  you will live, not a rope thrown to save someone in the water.'
examples:
- The life line on her palm ran deep and long.
- He asked the fortune teller to read his life line.
