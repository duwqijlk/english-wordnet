simpleMeaning: Any of many kinds of tiny living things made of one cell or of no cells at all, that usually
  do not make food from light.
scope: A tiny living thing made of one cell or of no cells at all; not the adjective that means of or
  relating to such living things.
examples:
- The protozoan moved slowly across the drop of water.
- Amoebas are protozoans that live in damp soil.
