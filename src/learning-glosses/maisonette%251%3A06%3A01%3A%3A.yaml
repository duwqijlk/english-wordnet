simpleMeaning: With its own door to the outside, this flat of its own sits inside a bigger house, usually
  on two floors
scope: Also called a maisonnette, this is a flat of its own inside a bigger house, not a single room and
  not a whole house on its own.
examples:
- They rented a maisonette with its own front door.
- Her maisonette runs over two floors of the old house.
