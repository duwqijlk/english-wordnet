simpleMeaning: To have a tingling feeling on the skin, as though tiny insects were moving over it.
scope: A tingling feeling that insects are on the skin, not actual slow movement or a place being full
  of things.
examples:
- My skin crawled when I heard the scratching behind the wall.
- His scalp crawled at the thought of the spiders.
