simpleMeaning: a tall bushy plant of Europe that lives for years, grown for its feather-like leaves and
  thin spikes of blue flowers, sometimes used as a medicine
scope: 'Also called goat rue: a tall bushy European plant with thin spikes of blue flowers, not the North
  American plant of the same name that gives rotenone.'
examples:
- The goat's rue stood tall by the fence, its blue flowers open in the sun.
- She grew goat's rue in the herb bed for its blue flower spikes.
