simpleMeaning: Fruit that puckers the mouth, yellow or orange and good to eat when fully ripe, grows on
  a medium tree of dry woods in the south and east of America.
scope: A medium tree of dry woods in the south and east of the United States, with yellow or orange fruit
  that can be eaten when fully ripe.
examples:
- Possumwood grew in the dry woods.
- We waited until the possumwood fruit was fully ripe before eating it.
