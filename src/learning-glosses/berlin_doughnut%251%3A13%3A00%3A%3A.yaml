simpleMeaning: A round food made from dough that has risen, with jelly or jam in the middle
scope: Also called a bismark or a jelly doughnut, this is a raised round food with jelly or jam inside,
  not a plain ring and not a cake.
examples:
- She bought a Berlin doughnut with strawberry jam.
- The Berlin doughnut was filled with jelly.
