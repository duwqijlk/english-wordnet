simpleMeaning: What is left goes to the one named before when the owner dies; while alive, the owner runs
  the money put on deposit, held as keeper for another person.
scope: Also called savings account trust, trust account, and trustee account; a bank account its owner
  runs for someone else, who gets what is left after the owner dies.
examples:
- He set up a savings bank trust for his daughter.
- The savings bank trust will pay the rest to the one named after he dies.
