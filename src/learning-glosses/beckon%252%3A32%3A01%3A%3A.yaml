simpleMeaning: To call a person to come to you with a wave, a nod, or some other move made to send a sign
scope: To call a person to you with a wave, a nod, or another move made as a sign, not by calling out
  in a loud voice.
examples:
- The teacher beckoned the boy to come to the front of the class.
- She beckoned to me from the door and I walked over.
