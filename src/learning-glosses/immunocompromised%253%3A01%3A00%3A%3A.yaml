senseId: 'immunocompromised%3:01:00::'
synsetId: 02756875-a
simpleMeaning: Not able to build up a normal defence against sickness, usually because of poor food, a
  weak immune system, or drugs that hold the immune system back.
scope: For a person whose defence against sickness cannot build up normally.
examples:
- After the treatment she was immunocompromised for months.
- He was immunocompromised and had to avoid crowds.
