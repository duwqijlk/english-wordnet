simpleMeaning: one of two very tall California trees with cones that grow to 300 feet tall, sometimes
  put in the Taxodiaceae family (a group of such trees)
scope: 'Also called sequoia: this is the living tree itself, not the wood that comes from such a tree.'
examples:
- A redwood in California can grow to 300 feet tall.
- We walked under a huge redwood with a very thick trunk.
