simpleMeaning: Got from the plant sansevieria and used for such things as ropes, this strong fibre is
  much like the fibre of the tall plant grown for rope.
scope: A strong fibre from the plant sansevieria, used for such things as ropes, not the same plant grown
  as a houseplant for its leaves.
examples:
- Bowstring hemp makes strong cordage.
- They twisted bowstring hemp into ropes.
