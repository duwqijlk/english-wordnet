simpleMeaning: a small mistake made without meaning to, often in speaking or writing, in a minor mishap,
  or in a memory lapse
scope: A small unintended error in speech, writing, memory or everyday mishaps, also called a slip-up,
  miscue or parapraxis; not the act of sliding or losing your footing, and not an undergarment.
examples:
- It was just a slip of the tongue, so nobody minded.
- A slip in his notes led him to quote the wrong date.
