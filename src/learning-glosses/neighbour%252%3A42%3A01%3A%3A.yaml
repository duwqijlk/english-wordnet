simpleMeaning: to live or be in a place next to another person or place
scope: 'Also called neighbor: to live or be next to someone or something, not a person who lives next
  to you.'
examples:
- Our house neighbours a small park on the east side.
- Their farm neighbours ours, with only a low fence between them.
