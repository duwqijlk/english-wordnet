simpleMeaning: Loss of mind seen in the last stages of long, hard drinking, with loss of recall for new
  things while old recall stays whole
scope: This is a loss of mind in the last stages of long, hard drinking, with new recall lost and old
  recall whole; alcohol amnestic disorder, alcoholic dementia, polyneuritic psychosis, Korsakoff's psychosis,
  Korsakov's psychosis and Korsakov's syndrome are other names for this sense.
examples:
- Korsakoff's syndrome involves loss of memory for recent events.
- Long-term memory stays intact in Korsakoff's syndrome.
