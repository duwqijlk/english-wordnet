simpleMeaning: Large white or off-white flowers, faintly marked with purple, bloom on this leafy-stemmed
  violet of eastern North America.
scope: 'Also called pale violet and striped violet: a leafy-stemmed violet of eastern North America, not
  a garden violet grown for show.'
examples:
- The cream violet bloomed in the woods.
- Cream violets have large white flowers marked with purple.
