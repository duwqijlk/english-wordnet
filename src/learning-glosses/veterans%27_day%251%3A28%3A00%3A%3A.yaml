simpleMeaning: In the United States, people do not work on this date by law; it used to have another name,
  but people have called it by this name since nineteen fifty-four.
scope: Also called Veterans Day, this is a date off work by law in the United States, once called Armistice
  Day and kept on November 11, not any other public holiday.
examples:
- We do not work on Veterans' Day.
- Veterans' Day was once called Armistice Day.
