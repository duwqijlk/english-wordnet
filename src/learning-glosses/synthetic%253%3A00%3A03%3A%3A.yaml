simpleMeaning: to do with putting separate parts together to make one whole thing, rather than taking
  a thing apart to study it
scope: About joining parts into a whole, not about a man-made chemical, not about word parts joined in
  one word, and not about a claim judged by facts.
examples:
- Her synthetic approach pulled ideas from biology, chemistry, and geology.
- Limnology is a synthetic science that joins parts from many fields.
