simpleMeaning: A unit for counting information or entropy, how much is unknown, that counts by tens, each
  step meaning ten times as much.
scope: Not a bit or a nat; also called ban, dit and hartley.
examples:
- The Hart counts information in tens, not in twos.
- One Hart is the same as one ban.
