simpleMeaning: the liquid that meat or vegetables have been cooked in
scope: This is the cooking liquid from meat or vegetables, not a strong alcoholic drink and not a liquid
  from factory work.
examples:
- She saved the liquor from the boiled potatoes to make soup.
- Pour the liquor in which the meat was cooked over the vegetables.
