senseId: dispiriting%5:00:00:discouraging:00
synsetId: 00870923-s
simpleMeaning: harming people's will to keep going and their trust that they can do things on their own
scope: This sense is also called demoralizing, disheartening, and demoralising. It is about losing the
  will to keep going, not about being rude or being made unable to think clearly.
examples:
- The dispiriting news made the workers feel they could not keep going.
- It was dispiriting to try again and again with no help and no success.
