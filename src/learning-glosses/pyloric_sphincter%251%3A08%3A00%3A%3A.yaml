simpleMeaning: A ring of muscle at the end of the stomach that keeps food in the stomach until it lets
  it pass into the first part of the gut
scope: A ring of muscle at the stomach's end, also called the pyloric valve and musculus sphincter pylori,
  not the muscle ring at the top of the stomach where food comes in.
examples:
- The pyloric sphincter relaxed to let the food pass from the stomach into the gut.
- When the pyloric sphincter stays shut, food cannot leave the stomach.
