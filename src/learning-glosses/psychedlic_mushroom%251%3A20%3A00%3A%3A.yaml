simpleMeaning: A fungus eaten as a drug, with psilocybin in it, that makes you see things that are not
  there
scope: 'Psilocybin mushroom, shroom and magic mushroom are other names for this sense: a fungus eaten
  as a drug because of the psilocybin in it, not the stuff alone got from a fungus.'
examples:
- She took a psychedlic mushroom and saw colours that were not really there.
- A psychedlic mushroom is eaten as a drug because of what it makes you see.
