simpleMeaning: A person with pale skin and English forebears who belongs to one of the churches that came
  out of the Reformation.
scope: Also called WASP; a pale-skinned person of English descent who belongs to a Protestant church,
  not a Catholic and not a person of non-English descent.
examples:
- The white Anglo-Saxon Protestant community ran the town's oldest club.
- He was described as a white Anglo-Saxon Protestant.
