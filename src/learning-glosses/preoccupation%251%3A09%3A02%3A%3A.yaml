simpleMeaning: an idea that fills the mind and keeps a person thinking about it
scope: This is the idea that fills a person's mind, not the feeling of having your mind fully on one thing.
examples:
- His main preoccupation was the safety of his children.
- Money worries became her chief preoccupation.
