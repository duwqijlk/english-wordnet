simpleMeaning: A small light-giving part (it glows when power is put across its ends) that needs no back
  light or light-spreading sheet.
scope: Also called organic light-emitting diode; it is the small light-giving part that needs no back
  light or light-spreading sheet, unlike a screen lit from behind.
examples:
- The new phone uses an OLED screen.
- OLED displays glow without any backlight.
