simpleMeaning: usually to rap music, a lone performer makes fast, skillful jumps and spins, letting different
  parts of the body touch the floor in turn
scope: 'Also called break dancing: a solo style of moving to music with fast jumps and spins, not a group
  performance and not a slow, formal style.'
examples:
- He learned to break dance on the street, spinning on his back to rap music.
- The crowd cheered as she did a break dance with fast spins on the floor.
