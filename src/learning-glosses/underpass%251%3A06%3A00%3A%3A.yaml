simpleMeaning: a path or tunnel under the ground that lets people on foot cross under a road or a railway
  line
scope: 'Also called subway: a tunnel under a road or railway for people walking, not a bridge over the
  road and not a tunnel for cars.'
examples:
- Children use the underpass to cross the busy road safely.
- The underpass under the railway was wet after the rain.
