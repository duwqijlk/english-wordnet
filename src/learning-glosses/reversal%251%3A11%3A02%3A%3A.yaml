simpleMeaning: a bad event that gets in the way and slows or stops what you want to do, and leaves you
  feeling frustrated
scope: 'Also called a blow, a reverse, a setback, or a black eye: a bad event that blocks progress, not
  a higher court''s change of a lower court''s decision, not turning order or place around, and not a
  change of an earlier decision.'
examples:
- The team suffered a reversal when their best player was hurt.
- Losing their main funder was a reversal that left the small charity struggling to continue.
