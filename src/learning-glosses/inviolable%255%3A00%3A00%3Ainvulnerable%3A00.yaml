simpleMeaning: safe from attack, and no one can change it or damage it
scope: Safe from attack and from being changed, also called strong, secure, impregnable and unassailable;
  not the sense about a rule that must not be broken or a right that must not be taken away.
examples:
- The old fort stayed inviolable, safe from every attack.
- They kept the line inviolable so no one could change the message.
