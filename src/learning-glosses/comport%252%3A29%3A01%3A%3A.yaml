senseId: 'comport%2:29:01::'
synsetId: 00010428-v
simpleMeaning: to act and carry yourself in a certain way, so that other people can see how you behave
scope: To act in a certain way, also called act, do, carry, bear, behave, conduct, deport, and acquit;
  this is about how you carry yourself, not about finishing a job.
examples:
- She comported herself with calm and care at the meeting.
- He did not comport himself well in front of the guests.
