simpleMeaning: A middle-sized sea animal of the northern Pacific, dark ash-coloured and almost black.
scope: 'Also called a devilfish or a gray whale: a middle-sized dark sea animal of the northern Pacific,
  not a great blue whale and not a small warm-sea whale.'
examples:
- The grey whale swims along the Pacific coast each year.
- We watched grey whales feeding in the cold northern sea.
