simpleMeaning: Darker and lighter shades or colours, or marks set inside marked-off parts, show the usual
  amount of something in each part of a picture of a place
scope: This picture of a place shows the usual amount of something in each marked-off part by darker and
  lighter shades or by marks set inside the parts.
examples:
- The choropleth map used darker shades for the parts with higher amounts.
- On the choropleth map, each part had a shade for its usual amount.
