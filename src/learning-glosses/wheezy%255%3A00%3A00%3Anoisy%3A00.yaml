simpleMeaning: having a sound like a reed instrument (one played by blowing through a thin piece of wood
  that shakes to make sound)
scope: 'Also called reedy: this describes a sound like a reed instrument; it is not about breathing that
  makes a whistling sound.'
examples:
- The wheezy clarinet had a thin, high tone.
- The old organ made a wheezy sound, like a reed instrument.
