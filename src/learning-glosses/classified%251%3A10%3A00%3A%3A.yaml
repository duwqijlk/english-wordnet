simpleMeaning: a short advertisement in a newspaper or magazine, usually in small print, set with other
  ads of the same kind
scope: This is a small advertisement in a paper or magazine, not secret government papers and not things
  put into groups.
examples:
- She found a cheap car in the classifieds of the local paper.
- The classified ads in the back of the magazine list flats to rent.
