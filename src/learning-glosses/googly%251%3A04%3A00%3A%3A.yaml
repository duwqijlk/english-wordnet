synsetId: 00478108-n
simpleMeaning: In cricket, a ball bowled in a way that looks as if it will turn one way, but it turns
  the other way
scope: A cricket ball that turns a way no one expects from how it was bowled; not the word for wide, staring
  eyes.
examples:
- The bowler fooled him completely with a googly.
- She learned to bowl a googly that turned sharply the other way.
