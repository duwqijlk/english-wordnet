simpleMeaning: Baked under a crust of pastry, this dish holds beef and organ meat fried with onions in
  wine and stock.
scope: 'What sets it apart is the pastry lid: the meat is cooked first in wine and stock, then baked under
  the crust.'
examples:
- At the table, the steak and kidney pie was cut open to show beef and onions in wine and stock.
- The steak and kidney pie came with its pastry crust holding in the beef and organ meat.
