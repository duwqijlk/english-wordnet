simpleMeaning: the outer layer of skin that covers the outside of the body of animals with backbones
scope: The outer layer of skin that covers the outside of the body of animals with backbones, not the
  hard case of a crab or turtle and not a nail.
examples:
- The cuticle is the outer layer of skin on the body.
- The cuticle is the outer skin that covers the body of animals with backbones.
