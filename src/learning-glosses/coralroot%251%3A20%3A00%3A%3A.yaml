simpleMeaning: a European plant with a knotted white part under the ground from which it grows
scope: A European plant with a knotted white part under the ground, also called coral-root bittercress
  and coralwort; not a sea coral, and not a plant grown for food.
examples:
- Coralroot grows in the damp woods of Europe.
- The gardener dug up the coralroot and saw its knotted white rootstock.
