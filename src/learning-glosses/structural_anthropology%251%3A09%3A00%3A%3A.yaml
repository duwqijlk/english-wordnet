senseId: 'structural_anthropology%1:09:00::'
synsetId: 06178050-n
simpleMeaning: 'a theory of human ways of life: unseen patterns in a group bring about the things that
  can be seen in how people act together'
scope: This is a theory of human ways of life about unseen patterns, also called structuralism; not a
  study of bones or tools and not a list of customs.
examples:
- Structural anthropology looks for unseen patterns behind what people do.
- In structural anthropology, the things we see in a group come from unseen patterns.
