simpleMeaning: 'One of the links between matching DNA strands (or double-stranded RNA), where hydrogen
  bonds join two building blocks: adenine joins thymine, guanine joins cytosine, and uracil replaces thymine
  in RNA.'
scope: This is the linked unit joining the two strands, not a single chemical base or nucleotide on its
  own, and not a whole gene.
examples:
- Each base pair in the double helix is held together by hydrogen bonds.
- One changed base pair was enough to alter the protein.
