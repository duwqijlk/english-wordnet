synsetId: 01807900-v
simpleMeaning: to keep influence over other people or over yourself in a skillful way, usually so that
  you gain an advantage.
scope: This is not a switch or lever, not a policy that limits prices, and not the simple act of managing
  something; it is the skillful keeping of influence over people or yourself for your own benefit.
examples:
- She controlled the meeting so smoothly that everyone left thinking her plan was their own idea.
- By controlling the flow of information, the manager kept the advantage in every negotiation.
