simpleMeaning: In South Africa, stemless plants grow in tight clumps, their grey-green leaves very thick
  and juicy and feeling like lumps of stone.
scope: 'Also called living rock and stone mimicry plant: stemless plants of South Africa with stone-like
  leaves, not true stones.'
examples:
- The living granite in the pot looked like a grey-green stone.
- Living granite grows in tight clumps in South Africa.
