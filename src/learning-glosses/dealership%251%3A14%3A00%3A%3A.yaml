simpleMeaning: a business that has a company's permission to sell or give out that company's goods or
  services in one set area
scope: 'Also called franchise: a business with a company''s permission to sell its goods or services in
  one area, not just any shop that sells those goods without such permission.'
examples:
- He bought his new car at a local dealership.
- The dealership sells and repairs trucks for the whole county.
