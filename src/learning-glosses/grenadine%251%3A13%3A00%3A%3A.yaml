simpleMeaning: This sweet, thin liquid, made from the juice of pomegranates, is put into mixed drinks
scope: A thin syrup for mixed drinks, not a fruit juice on its own and not a strong drink.
examples:
- She added a splash of grenadine to the lemonade.
- The bartender poured grenadine into the glass to sweeten the drink.
