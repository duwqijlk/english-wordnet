simpleMeaning: Any of various water-soluble compounds formed by hydrolysis when proteins are digested
  into amino acids.
scope: These compounds form during protein digestion; they are not the original protein.
examples:
- During digestion, peptone forms before protein breaks down into amino acids.
- The peptone dissolved easily in water.
