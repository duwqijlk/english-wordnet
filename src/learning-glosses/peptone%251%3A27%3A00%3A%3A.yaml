simpleMeaning: When protein is broken down by water in digestion, one of many kinds of stuff forms, which
  dissolves in water and ends as the small building parts of the body.
scope: One of many kinds of stuff that forms in the digestion of protein, not the protein it comes from.
examples:
- During digestion, peptone forms before protein breaks down into amino acids.
- The peptone dissolved easily in water.
