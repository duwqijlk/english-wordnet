simpleMeaning: A unit of magnetomotive force, the force that drives a magnet, equal to zero point seven
  nine five eight ampere-turns.
scope: A unit of magnetomotive force, also called gilbert or Gi, not a unit of information like the Gb
  of bits.
examples:
- Engineers measure magnetomotive force in Gb.
- The winding gave a force of three Gb.
