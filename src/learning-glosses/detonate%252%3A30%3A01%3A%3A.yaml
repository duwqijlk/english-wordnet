synsetId: 00307079-v
simpleMeaning: To burst and let out power at once, as in a violent chemical or physical change.
scope: To burst and release power at once; explode is another name for this sense, and it is not to set
  something on fire nor to make a loud noise alone.
examples:
- The bomb detonated at noon.
- The firework detonated with a loud bang.
