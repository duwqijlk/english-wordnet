synsetId: 13391842-n
simpleMeaning: In money or jewels, and other things of the same kind, riches are saved bit by bit and
  kept
scope: Also called treasure, this is wealth built up and kept in money or jewels, not money spent day
  by day and not a single valuable thing.
examples:
- The pirates hid their hoarded wealth on a small island in the West Indies.
- He dug up the hoarded wealth his grandfather had buried under the floor.
