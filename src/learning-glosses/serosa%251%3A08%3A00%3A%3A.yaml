simpleMeaning: Two layers with a gap between them, filled with a thin watery liquid, make up this thin
  cover that lines the closed hollows of the body.
scope: Serous membrane is another name for this thin cover that lines the closed hollows of the body,
  made of two layers with a gap between them.
examples:
- The serosa lined the closed hollows of the body.
- A gap filled with a thin watery liquid lay between the layers of the serosa.
