simpleMeaning: An orchid with thin, nearly leafless reddish-brown stems and loose sprays of reddish-brown
  flowers; from open brushy woods of southeastern Arizona and the south-central United States.
scope: Not a common garden orchid or a lady's slipper; also called Hexalectris warnockii.
examples:
- Texas purple spike grows in the brushy woods.
- We spotted Texas purple spike among the oaks.
