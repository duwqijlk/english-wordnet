simpleMeaning: to move forward through something, pushing it aside in the way a farm tool cuts into and
  goes through soil
scope: 'Also called plow: this is moving forward through something, not the farm tool itself, which is
  the noun sense of the same word.'
examples:
- The ship ploughed through the waves.
- The truck ploughed through the deep snow.
