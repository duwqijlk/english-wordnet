simpleMeaning: So small it cannot be seen without a lens.
scope: So small it cannot be seen without a lens; also called microscopic; not to be seen through a lens,
  or using a lens, nor of the study of tiny things through a lens, or used in it.
examples:
- Their marks were microscopical and faint.
- The change was microscopical in scale.
