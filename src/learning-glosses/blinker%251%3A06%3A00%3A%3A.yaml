simpleMeaning: a light that goes on and off again and again, used as a sign or to send messages
scope: 'Also called flasher: a light that goes on and off to send a sign or message, not the leather piece
  that stops a horse from seeing to the side and not just the turning light on a car.'
examples:
- A blinker on the tower warned boats in the dark.
- He used a blinker to send a short message to the ship.
