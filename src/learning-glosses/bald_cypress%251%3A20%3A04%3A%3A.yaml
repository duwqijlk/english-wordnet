simpleMeaning: A cone-bearing tree that loses its leaves each year, of the group Taxodium, from North
  America
scope: A cone-bearing tree from North America that loses its leaves, not the wood of that tree and not
  a tree that keeps its leaves all year.
examples:
- A bald cypress stood by the edge of the swamp.
- The bald cypress loses its leaves each autumn.
