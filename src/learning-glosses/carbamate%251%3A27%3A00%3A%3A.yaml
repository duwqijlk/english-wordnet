simpleMeaning: a chemical got from a certain acid, in the form of a salt or an ester
scope: A salt or ester of one acid, not the acid itself and not a different salt.
examples:
- The chemist made a carbamate from the acid in the lab.
- The sample held a carbamate in salt form.
