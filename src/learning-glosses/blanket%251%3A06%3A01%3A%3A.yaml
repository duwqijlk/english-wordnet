simpleMeaning: A lead layer wrapped around the highly reactive centre of a nuclear reactor.
scope: This is the lead shielding inside a reactor, not a warm bed covering and not any general thing
  that covers something.
examples:
- Workers inspected the lead blanket around the reactor core.
- A thick blanket of lead encases the reactor's highly reactive core.
