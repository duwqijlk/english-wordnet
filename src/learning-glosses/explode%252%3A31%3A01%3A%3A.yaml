simpleMeaning: to prove that an idea or claim is not based on true facts, so it is no longer worth using
scope: This sense is about proving an idea or claim false by argument. It is not a bomb or other thing
  bursting, and not making something burst to ruin it.
examples:
- New tests exploded the claim that the drink gave people more power.
- He exploded the old idea by showing that its facts were wrong.
