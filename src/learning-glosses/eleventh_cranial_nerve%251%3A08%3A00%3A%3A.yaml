senseId: 'eleventh_cranial_nerve%1:08:00::'
synsetId: 05488053-n
simpleMeaning: A cord in the head that starts from two sets of roots, one from the brain and one from
  the spine, which join to form it
scope: This cord in the head starts from two root sets that join together; accessory nerve, nervus accessorius
  and spinal accessory are other names for it, not a cord from one root set only and not a cord in the
  arm.
examples:
- The eleventh cranial nerve starts from two sets of roots.
- The eleventh cranial nerve joins its two root sets into one cord.
