simpleMeaning: Food stored inside an egg cell to feed the young animal growing in it, above all the yellow
  part of a bird or reptile egg
scope: The food stored in an egg to feed the growing young, not just the yellow round part of an egg that
  sits in the white.
examples:
- The yolk feeds the chick while it grows inside the egg.
- Without the yolk, the young bird in the egg would have no food.
