simpleMeaning: In linguistics, a pitch of the voice, or a change in it, that separates words in some languages.
scope: In linguistics, a meaning-changing voice pitch, not the quality of a person's voice or a musical
  interval.
examples:
- Mandarin has four tones, and each one changes a word's meaning.
- In Thai, the tone you use can change the word entirely.
