simpleMeaning: to make a bad mistake, or to do something that breaks the rules of good manners
scope: To make a bad mistake or break good manners, also called sin, not to walk along in a clumsy way
  and not a small slip.
examples:
- I blundered during the job interview and gave the wrong date.
- She blundered by asking about his wife, who had just left him.
