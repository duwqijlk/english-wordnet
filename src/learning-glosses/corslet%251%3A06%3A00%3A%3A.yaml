simpleMeaning: a piece of hard cover worn on the body to guard the chest and back, most often made of
  a front plate and a back plate
scope: A piece of hard cover worn to guard the chest and back, also called corselet; not a full suit of
  armor and not a helmet.
examples:
- The knight fastened his corslet before the battle.
- Her corslet had a dent in the front plate from an old fight.
