simpleMeaning: A fault in the way the cord of nerves down the back grows as it forms
scope: A fault in how the cord of nerves down the back grows as it forms, not a hurt to the back and not
  a fault in the brain.
examples:
- The doctor found myelatelia in the baby's spinal cord.
- The scan showed myelatelia, a fault in the way the spinal cord had grown.
