simpleMeaning: A small bush from China with smooth dark red fruit without grooves, grown above all for
  its red, pink or white flowers.
scope: Also called dwarf flowering almond; a bush grown for its flowers, not a big tree grown for sweet
  fruit and not a wild plum with egg-shaped fruit.
examples:
- Prunus glandulosa filled the yard with pink flowers in spring.
- The gardener cut back the Prunus glandulosa after its white flowers faded.
