simpleMeaning: A white acid that forms clear, hard bits, made from pyrimidine, a ring-shaped chemical,
  and used to make drugs that bring sleep.
scope: A white acid made from pyrimidine and used to make sleep drugs, also called barbituric acid, not
  a common kitchen acid and not a drug itself.
examples:
- Malonylurea is a starting point for sleep drugs.
- The chemist weighed out malonylurea for the mixture.
