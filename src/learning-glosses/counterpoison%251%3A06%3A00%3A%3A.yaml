simpleMeaning: a cure that stops or holds back the harm done by a poison
scope: A cure that stops or holds back the harm done by a poison, also called antidote; not the poison
  itself and not a cure for a sickness.
examples:
- The doctor gave her a counterpoison after she swallowed the rat poison.
- They rushed to find a counterpoison before the poison could do more harm.
