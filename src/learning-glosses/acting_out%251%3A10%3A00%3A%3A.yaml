simpleMeaning: A sudden burst of bad behaviour by a troubled child or a nervous grown person, hard to
  control and often annoying.
scope: Not letting out feelings held back in therapy and not a planned show of anger.
examples:
- His acting out in class made it hard for the teacher to go on.
- Her acting out worried her parents.
