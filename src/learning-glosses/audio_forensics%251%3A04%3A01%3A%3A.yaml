simpleMeaning: In this field of work, people get sound recordings, study them, and judge them, so they
  may be used as proof in a court or other formal place
scope: This is the work of judging sound recordings for use as proof in a court or other formal place,
  not the making of the recordings themselves.
examples:
- Audio forensics helped the court judge the sound recording.
- Emergency calls can be studied with audio forensics to find out who the caller is.
