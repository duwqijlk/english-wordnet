schema: oewn-learning-gloss-v2
senseId: 'politicize%2:30:00::'
synsetId: 00535302-v
simpleMeaning: to make something be treated as a matter of parties, voting and who should run the country
scope: Also called politicise. This is about making a subject a matter of parties and who should run the
  country; it is not just talking about an election or a law.
examples:
- They tried to politicize the school meeting by turning it into a fight between parties.
- The group politicized the discussion about the new road.
