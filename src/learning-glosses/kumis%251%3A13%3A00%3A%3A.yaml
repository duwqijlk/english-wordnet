simpleMeaning: A drink with alcohol in it, made from mare's milk left to sour, first made by the nomad
  peoples of central Asia
scope: This is a drink with alcohol in it made from soured mare's milk, also called koumiss, not a drink
  from cow's milk and not beer.
examples:
- Kumis was served to guests in a wooden bowl.
- She tasted kumis for the first time on the steppe.
