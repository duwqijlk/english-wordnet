simpleMeaning: to take in a liquid or a gas, either by holding it on its surface or by taking it right
  inside
scope: This verb is about taking in a liquid or a gas. It is not the small sour fruit with a rough feel
  that has the same name.
examples:
- The powder can sorb water from the air.
- This material sorbs gas very quickly.
