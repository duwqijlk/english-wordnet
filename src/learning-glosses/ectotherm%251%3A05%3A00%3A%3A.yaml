simpleMeaning: an animal whose heat changes with the heat of the air or water around it; any animal but
  birds and those that give milk
scope: An animal whose heat follows its surroundings, also called poikilotherm; not a bird and not an
  animal that gives milk to its young.
examples:
- A lizard is an ectotherm, so it basks in the sun to warm up.
- The ectotherm slows down when the water turns cold.
