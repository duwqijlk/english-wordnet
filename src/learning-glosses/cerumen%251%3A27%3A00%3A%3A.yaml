simpleMeaning: The soft yellow wax made by small glands in the tube that leads into the ear.
scope: Soft yellow wax made in the ear tube, not wax for candles and not dirt in the ear; earwax is another
  name for this sense.
examples:
- The doctor cleared the cerumen from the patient's ear.
- Cerumen protects the ear tube from dust and germs.
