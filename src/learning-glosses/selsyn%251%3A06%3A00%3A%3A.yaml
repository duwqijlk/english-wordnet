simpleMeaning: a pair of machines, one that makes power and one that uses it, wired so the second takes
  the same place as the first, the two moving in step
scope: Also called a synchro; a linked pair of machines that move in step, not a single motor on its own.
examples:
- The selsyn kept the two dials in step.
- A selsyn links the generator to the motor.
