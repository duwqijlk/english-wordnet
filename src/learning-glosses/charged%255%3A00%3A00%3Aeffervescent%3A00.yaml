simpleMeaning: Filled with a gas that makes it fizzy and full of bubbles
scope: A thing filled with a gas that makes it fizzy and full of bubbles, not a subject that stirs up
  strong feelings and not a thing with electric power.
examples:
- She ordered a charged lemonade that fizzed when she opened the bottle.
- He prefers charged water to still water with his meal.
