senseId: 'force%1:04:00::'
synsetId: 00130563-n
simpleMeaning: in baseball, an out that removes a runner who must advance, made by holding the ball and
  touching the base that runner is heading for before that runner arrives.
scope: This is a baseball out at a base, not physical strength, energy, or influence, not a group of people
  or a military unit, not an act of aggression, not a person with authority, and not legal validity.
examples:
- The runner was out on a force at third.
- The second baseman took the throw and got the force at second.
