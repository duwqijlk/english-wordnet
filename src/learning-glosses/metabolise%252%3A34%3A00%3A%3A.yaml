simpleMeaning: To make a substance inside the body by the chemical changes of life
scope: To make a substance in the body by its life processes, also called metabolize; not to take food
  in and not to pass waste out.
examples:
- The liver can metabolise the drug within a few hours.
- Some animals metabolise fats very slowly.
