simpleMeaning: Any of the many ideas or systems of thought that try to explain all that happens in the
  world as the work of some force or power within it.
scope: Any of the many ideas or systems of thought that try to explain all that happens in the world as
  the work of some force or power within it; not the liveliness of an energetic person.
examples:
- The philosopher's dynamism traced everything in the world to one inner force.
- She studied dynamism, the idea that a single force within things explains all that happens.
