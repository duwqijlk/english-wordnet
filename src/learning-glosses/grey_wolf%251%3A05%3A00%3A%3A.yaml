simpleMeaning: In the forests of the far north of North America lives a wolf with a mottled coat the colour
  of ash.
scope: Also called a gray wolf or a timber wolf, this is the wolf with a mottled coat the colour of ash
  that lives in the forests of the far north of North America.
examples:
- The grey wolf moved through the pines.
- The grey wolf lives in the forests of northern North America.
