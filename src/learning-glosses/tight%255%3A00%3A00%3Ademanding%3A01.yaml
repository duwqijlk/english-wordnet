simpleMeaning: Requiring people to follow rules and procedures very carefully and strictly.
scope: This describes rules, checks or discipline enforced strictly, not something fixed firmly in place
  or pulled straight.
examples:
- Security was tight around the courthouse during the trial.
- The hospital enforces tight procedures for handling dangerous samples.
