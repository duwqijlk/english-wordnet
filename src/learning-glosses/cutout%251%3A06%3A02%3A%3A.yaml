simpleMeaning: a switch that stops the flow of power in an electric circuit when too much power goes through
  it
scope: A switch that stops power when an electric circuit takes too much; not a shape cut out of paper
  or cloth, and not a part that has been cut away.
examples:
- The cutout shut off the power when the motor drew too much current.
- If the wire gets too hot, the cutout breaks the circuit at once.
