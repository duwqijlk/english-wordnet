simpleMeaning: The spit-making gland beside the ear takes its threads from a knot of nerve cells that
  work on their own.
scope: This knot of nerve cells is also called otoganglion, and it sends threads to the spit-making gland
  beside the ear.
examples:
- The otic ganglion sends threads to the parotid gland.
- Threads from the otic ganglion reach the spit-making gland beside the ear.
