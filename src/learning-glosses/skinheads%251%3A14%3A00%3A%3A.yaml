simpleMeaning: English working-class youth subculture of the late 1960s, a reaction against hippies, with
  cropped hair, work-shirts, short jeans and heavy red footwear; members attacked Asians and fought at
  football matches.
scope: Another name for the bootboy subculture; it names the group as a whole, not a shaved hairstyle
  or one member.
examples:
- The skinheads of that era cropped their hair and wore heavy red boots to football matches.
- Many skinheads in late-1960s England came from working-class families and rejected hippie styles.
