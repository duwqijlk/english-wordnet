simpleMeaning: In physics, of waves with no steady, set link between the timing of their ups and downs
scope: In physics, of waves out of step with each other; not waves that keep a steady pattern and not
  confused speech.
examples:
- The incoherent light from the lamp had waves that did not stay in step with each other.
- The two incoherent waves showed no fixed pattern together.
