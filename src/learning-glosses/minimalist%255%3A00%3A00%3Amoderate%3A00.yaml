simpleMeaning: supporting only very small changes, as in government or politics
scope: About supporting only very small changes in government or politics; not about art with very few
  simple parts, and not a person who holds these views.
examples:
- He took a minimalist approach to tax reform and changed only one small rule.
- The party's minimalist plan left most government programmes as they were.
