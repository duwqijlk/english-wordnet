simpleMeaning: To tap a golf ball lightly with a special club designed for this shot.
scope: This is the physical stroke that sends the ball rolling, not the noun naming such a stroke, not
  the golf-playing sense of putting during a round, and not a long drive.
examples:
- She putted the ball to within a foot of the hole.
- He putted the ball gently across the green toward the hole.
