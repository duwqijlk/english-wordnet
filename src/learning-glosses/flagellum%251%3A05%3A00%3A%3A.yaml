simpleMeaning: Some cells, such as sperm cells and some germs and one-celled living things, move with
  this thin whip-like tail.
scope: It is the thin whip-like tail that lets a cell move.
examples:
- The flagellum beat back and forth to move the cell.
- A sperm cell swims with its flagellum.
