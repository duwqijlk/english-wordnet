simpleMeaning: Ill, or seeming ill, because of trouble with the liver or trouble in the stomach
scope: 'Also called bilious and liverish: ill from the liver or stomach, not a uniform worn by a servant
  or driver and not the care of horses for pay.'
examples:
- He felt livery and sick after eating too much rich food.
- The old man had a pale, livery look and held his stomach.
