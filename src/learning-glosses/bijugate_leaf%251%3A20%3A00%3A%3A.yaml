simpleMeaning: a feather-like green part of a plant, with four small parts set in two pairs along a middle
  stem
scope: 'Also called a bijugous leaf: a feather-like green part of a plant with four small parts in two
  pairs along a middle stem, not one with a single pair and not a plain part with no side parts.'
examples:
- The bijugate leaf had two pairs of small leaflets along its stem.
- A bijugate leaf is easy to spot because it carries exactly two pairs of leaflets.
