simpleMeaning: a plant from the Old World that stands straight up, grown most of all for big flat seeds
  people can eat, and also grown as food for farm animals
scope: 'Also called broad-bean plant, broad bean and field bean: a plant from the Old World that stands
  straight up and is grown for its big flat seeds that can be eaten, not a plant grown only for its flowers
  and not a kind of pea.'
examples:
- The broad-bean plants stood tall in the garden.
- They grow broad-bean for its large flat seeds.
