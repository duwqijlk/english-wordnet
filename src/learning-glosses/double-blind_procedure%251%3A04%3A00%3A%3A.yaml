simpleMeaning: nobody in this test knows the key facts about it, neither the people taking part nor the
  people running it
scope: 'Also called double-blind experiment and double-blind study: a test in which neither the people
  taking part nor the people running it know the key facts, not a test in which only one side is kept
  in the dark.'
examples:
- The double-blind procedure meant the nurses did not know which patients got the real medicine.
- They ran a double-blind procedure so that no one could guess who had the new drug.
