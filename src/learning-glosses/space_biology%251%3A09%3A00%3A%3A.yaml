simpleMeaning: the study of how life is changed beyond the earth, and of the search for life on other
  worlds
scope: The study of how life is changed beyond the earth and the search for life on other worlds, also
  called astrobiology and exobiology; not the study of life on earth and not the study of the stars themselves.
examples:
- She chose space biology because she wants to study life on Mars.
- Space biology asks how long a plant can live beyond the earth.
