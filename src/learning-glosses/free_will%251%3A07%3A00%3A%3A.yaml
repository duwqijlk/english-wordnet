senseId: 'free_will%1:07:00::'
synsetId: 05206024-n
simpleMeaning: the power to choose what to do by yourself, with no outside force making the choice for
  you
scope: The power to make your own choices, also called discretion; not chance and not orders from someone
  else.
examples:
- She acted of her own free will, with no one telling her what to do.
- The court asked whether he had signed the paper of his own free will.
