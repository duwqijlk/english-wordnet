simpleMeaning: A smooth sausage, usually smoked, made by packing beef or pork cut very fine into shape,
  often set in a bread roll.
scope: Also called dog, frank, weenie, frankfurter, wiener, hotdog, and hot dog, this smooth sausage of
  beef or pork cut very fine is usually smoked and often set in a bread roll.
examples:
- He ate a wienerwurst in a bread roll.
- They served wienerwurst in bread rolls.
