simpleMeaning: a bridge that can be lifted up to block the way across, or to let boats and ships pass
  under it
scope: A bridge that lifts up, not a bridge that stays fixed in place.
examples:
- The drawbridge rose to let the tall ship sail through.
- When the drawbridge was up, no one could cross the river.
