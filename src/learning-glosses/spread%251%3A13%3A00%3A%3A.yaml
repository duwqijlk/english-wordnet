simpleMeaning: A food mixture that you put on bread or crackers, or use when preparing other dishes.
scope: This is the food you put on bread, not a whole meal that has been laid out and not a cover for
  a bed.
examples:
- She bought a jar of mushroom spread at the market.
- The children put chocolate spread on their toast.
