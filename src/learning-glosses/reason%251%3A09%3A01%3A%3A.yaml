simpleMeaning: a fact that logically supports a statement taken as a starting point or a judgement reached
  from it
scope: This sense is a justifying fact within an argument, not the mental power to think logically.
examples:
- The fingerprint on the glass was the strongest reason for believing he had been there.
- Give me one good reason why the meeting should be moved.
