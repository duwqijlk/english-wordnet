simpleMeaning: Dense hanging bunches of grey-green, wavy, hairlike threads clinging to tree trunks and
  branches by thin wiry roots, from the southeastern United States through the West Indies to South America.
scope: The tree-hanging strands described here, not a moss growing flat on the ground or on rocks.
examples:
- Black moss hung in long grey strands from the oak branches.
- The trees along the river were draped with black moss.
