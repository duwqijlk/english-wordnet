simpleMeaning: growing or learning much earlier than is usual for the age, especially in the power to
  think and learn
scope: This sense is about a child who grows or learns far ahead of others of the same age, especially
  in thinking; it is not just being young, and not just being born early.
examples:
- The precocious girl was reading adult books at age six.
- His precocious skill at maths surprised all his teachers.
