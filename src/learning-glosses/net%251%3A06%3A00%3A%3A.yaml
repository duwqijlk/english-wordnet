simpleMeaning: A material with holes between threads of string, rope or wire that are woven in a regular
  pattern.
scope: The woven material itself, used for many purposes, not the band that divides a tennis or badminton
  court and not the goal in soccer or hockey.
examples:
- The curtains were made of a fine net that let the light through.
- The bride's veil was made of soft white net.
