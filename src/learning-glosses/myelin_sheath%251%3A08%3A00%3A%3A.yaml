simpleMeaning: The long thin threads of nerve cells are wrapped in a fatty coat that keeps their signals
  moving fast.
scope: It is also called medullary sheath, and it is the fatty coat round the threads that carry nerve
  signals, not the threads themselves.
examples:
- The myelin sheath wraps round the thread that carries signals from the nerve cell.
- A myelin sheath keeps the signals moving fast along the thread.
