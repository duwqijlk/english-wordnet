simpleMeaning: large sea fish with a long jaw, caught for sport; a close relation of sailfish and spearfish,
  it can warm its brain and eyes and is not fully cold-blooded
scope: A large sea fish with a long jaw, caught for sport; it is a close relation of sailfish and spearfish,
  but it is not a sailfish or a spearfish itself.
examples:
- He caught a huge marlin after a three-hour fight.
- The marlin jumped out of the water and shook its head.
