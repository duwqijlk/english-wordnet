simpleMeaning: In chemistry, the joining power of atoms or small groups of atoms is counted by the number
  of hydrogen atoms they can join with, or the like.
scope: Valence is another name for this joining power in chemistry, not the power of living stuff to unite
  in biology.
examples:
- In chemistry, the valency of an atom tells how many hydrogen atoms it can join with.
- The valency of the atom was worked out from the hydrogen atoms it could join with.
