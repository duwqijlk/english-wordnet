simpleMeaning: a flood caused when river ice breaks up in a rough, sudden way in spring or summer
scope: This is a flood from river ice breaking up in spring or summer, not a sudden and violent collapse.
examples:
- The spring debacle flooded farms along the river when the ice broke up.
- After the winter ice split apart, a debacle sent water over the banks.
