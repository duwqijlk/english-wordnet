synsetId: 09989399-n
simpleMeaning: a person who seeks to undo the changes made by an earlier revolution
scope: A person who seeks to undo the changes made by an earlier revolution, also called counterrevolutionary
  and counterrevolutionist, not a person who made the first revolution and not a person who defends it.
examples:
- The counter-revolutionist plotted to restore the old king.
- After the war, counter-revolutionists tried to undo the new laws.
