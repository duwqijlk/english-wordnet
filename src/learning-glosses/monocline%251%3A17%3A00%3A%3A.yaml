simpleMeaning: All the layers of rock lean one way, and one way only
scope: Rock layers that all lean one way, not layers that tilt in different ways and not a flat bed of
  rock.
examples:
- The monocline runs for miles across the desert, its rock layers all leaning east.
- Geologists mapped the monocline where the strata dip in a single direction.
