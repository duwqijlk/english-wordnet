simpleMeaning: the round sky that we see, on which the sun, moon, and stars seem to sit
scope: The round sky we see, on which the sun, moon, and stars seem to sit, also called heavens; not a
  solid round figure and not a round made thing.
examples:
- The stars moved across the sphere of the night sky.
- He watched the moon rise in the sphere above.
