simpleMeaning: a soldier with special training whose work is digging long deep ditches in the ground or
  digging under strong walls to make them fall
scope: This is a soldier trained for digging work in war, not a soldier who only fights and not a worker
  digging for a building.
examples:
- The sapper dug under the strong wall all night.
- Sappers dug long deep ditches in the ground to protect the soldiers.
