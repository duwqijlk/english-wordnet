simpleMeaning: Egg whites beaten until stiff give this dish its airy lightness; yolks go in too, with
  additions such as cheese, fish or fruit.
scope: A light egg dish, not a flat omelette and not a firm baked custard.
examples:
- She ordered a cheese souffle and a green salad.
- The souffle rose well above the rim of the dish.
