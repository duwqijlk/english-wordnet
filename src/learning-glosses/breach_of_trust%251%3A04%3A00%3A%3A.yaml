senseId: 'breach_of_trust%1:04:00::'
synsetId: 00070738-n
simpleMeaning: A failure by a person who looks after another's money or property to do a duty that fairness
  requires of them, whether by cheating or by carelessness.
scope: A trustee's failure to carry out a duty fairness requires, by cheating or carelessness; not a breach
  of warranty and not a broken promise in general.
examples:
- The trustee's breach of trust left the family without its savings.
- He was sued for breach of trust after using the fund for himself.
