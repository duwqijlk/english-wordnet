simpleMeaning: to expand a musical theme, working out its melody, rhythm and harmony
scope: This sense is about shaping a musical theme, not about a plant or situation growing, not about
  something becoming visible, and not about moving game pieces.
examples:
- The composer develops the melody slowly before bringing back the main theme.
- In the second movement, the strings develop the opening idea with unusual harmonies.
