simpleMeaning: to use official power to stop something from having legal force
scope: To say officially that a thing has no legal force, not to show that an idea is wrong and not to
  make a thing unfit for use.
examples:
- The court invalidated the contract after finding a serious error in it.
- The judge invalidated the election result because many votes were counted wrongly.
