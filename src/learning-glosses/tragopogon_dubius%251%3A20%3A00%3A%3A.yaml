simpleMeaning: A long-lived plant of Europe, now wild throughout the United States, with hollow stems,
  each with one pale yellow flower, and a few long leaves that narrow to a point.
scope: A long-lived plant of Europe, now wild throughout the United States, with hollow stems and one
  pale yellow flower on each stem, also called yellow salsify.
examples:
- Tragopogon dubius grows wild along the road with pale yellow flowers.
- Each hollow stem of Tragopogon dubius bears one pale yellow flower.
