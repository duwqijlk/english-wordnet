simpleMeaning: Sound reaches the thin cover that shakes with it by going along one of these two outer-ear
  ways, starting at the ear flap.
scope: This is the passage from the ear flap to the drum, also called auditory meatus, acoustic meatus,
  ear canal, and external auditory canal, not the inner ear itself.
examples:
- Sound travels along the auditory canal to the drum.
- Wax in the auditory canal dulled the hearing.
