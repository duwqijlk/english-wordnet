simpleMeaning: Holding far more fat than is wont.
scope: This sense is also called greasy and oily, for holding far more fat than is wont, where greasy
  is having a lot more grease or oil in it than is usual, unlike the sense for being nastily smooth and
  fawning in manner or speech.
examples:
- The skin was oleaginous, holding far more fat.
- The hair was oleaginous, far more fat than is wont.
