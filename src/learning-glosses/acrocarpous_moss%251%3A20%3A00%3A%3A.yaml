simpleMeaning: This green plant's main stem ends in the tiny egg-holder, and the spore case grows from
  there.
scope: Also called acrocarp, this names the green plant whose main stem ends in the tiny egg-holder, with
  the spore case growing from there.
examples:
- The acrocarpous moss bore its spore case at the tip of the main stem.
- We found acrocarpous moss with the spore case at the top of its main stem.
