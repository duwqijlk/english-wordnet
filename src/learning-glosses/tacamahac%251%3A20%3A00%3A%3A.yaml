simpleMeaning: a tree of the north-east of North America with wide leaves shaped like hearts
scope: This is a tree of the north-east of North America with wide heart-shaped leaves; hackmatack and
  balsam poplar are other names for this sense. Not a tree with narrow leaves and not a tree of the warm
  south.
examples:
- A tacamahac shaded the path by the river.
- The tacamahac dropped its wide leaves in the fall.
