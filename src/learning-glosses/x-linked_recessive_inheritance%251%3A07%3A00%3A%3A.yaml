senseId: 'x-linked_recessive_inheritance%1:07:00::'
synsetId: 04930673-n
simpleMeaning: 'A way traits pass down in families: a gene on one kind of chromosome shows its marks in
  sons, while daughters carry it without showing it.'
scope: A pattern of passing traits down in families, where sons show the trait and daughters carry it
  unseen; its nearest kin are other patterns of passing traits down, such as the dominant pattern.
examples:
- X-linked recessive inheritance explains why the boys in the family showed the trait and the girls did
  not.
- The doctor said X-linked recessive inheritance meant the daughters were carriers.
