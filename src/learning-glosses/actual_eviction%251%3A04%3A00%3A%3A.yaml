simpleMeaning: the tenant no longer has to pay rent once forced out of the rented place in person
scope: Forcing a tenant out of the rented place in person, not a case where the tenant leaves by choice,
  ends the tenant's duty to pay rent.
examples:
- The actual eviction left the tenant with no rent left to pay.
- After the actual eviction, she moved out and stopped paying rent.
