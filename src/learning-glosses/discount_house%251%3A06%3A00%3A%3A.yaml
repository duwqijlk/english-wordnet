simpleMeaning: a shop that sells things for less than the usual price
scope: A shop that sells things for less than the usual price, also called a discount store or a discounter,
  and not a shop that sells things at the full price.
examples:
- She bought the coat at a discount house for half its usual price.
- The new discount house on Main Street sells shoes for less than other shops.
