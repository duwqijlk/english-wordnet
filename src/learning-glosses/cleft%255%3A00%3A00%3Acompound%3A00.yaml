simpleMeaning: a leaf whose edge is cut in by one or more notches that stop just short of the vein down
  its middle
scope: Of a leaf, with notches reaching nearly to its middle vein, not a split in a chin or palate and
  not a long narrow gap.
examples:
- The cleft leaf had deep notches along its edge.
- This cleft leaf is cut almost to the midrib.
