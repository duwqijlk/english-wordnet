simpleMeaning: A tiny hole in the skin of a leaf or stem that lets gases and water vapour pass through.
scope: A tiny hole in the skin of a leaf or stem, not any tiny hole that lets liquid through.
examples:
- Water vapour escapes through the pores of the leaf.
- Gases pass in and out through the tiny pores on the leaf.
