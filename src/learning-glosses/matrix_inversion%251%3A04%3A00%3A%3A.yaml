simpleMeaning: working out the set of numbers in rows and columns that, times the given set, gives a set
  with ones down the middle and zeros elsewhere
scope: Working out a set of numbers that undoes a given set when multiplied; not adding two sets of numbers
  and not finding one number from a set.
examples:
- Matrix inversion lets us solve the set of equations.
- The computer did the matrix inversion in a second.
