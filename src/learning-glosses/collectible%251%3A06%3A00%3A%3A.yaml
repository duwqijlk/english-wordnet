simpleMeaning: things that people think are worth keeping and gathering together, not always worth much
  money or very old
scope: The things themselves that people gather and keep because they want them; they do not have to be
  old or worth much money.
examples:
- This old coin is a collectible that many people want.
- Stamps are a common collectible, even cheap new ones.
