simpleMeaning: having an edge cut into uneven points and gaps, as if it had been bitten away
scope: Having an edge cut into uneven points, as if bitten away; jagged and toothed are other names for
  this sense, not notched like a saw with teeth pointing to one end.
examples:
- The notched edge of the leaf looked as if it had been bitten.
- The notched rim of the old cup had uneven gaps, as if small bites had been taken out of it.
