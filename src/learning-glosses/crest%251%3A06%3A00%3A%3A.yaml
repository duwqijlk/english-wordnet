simpleMeaning: In heraldry, in the middle ages, a sign or design put on a helmet to make it look fine
scope: This is the helmet sign used in heraldry in the middle ages, not the growth of feathers or skin
  on the head of a bird or other animal.
examples:
- The knight's helmet bore a red crest shaped like a lion.
- A crest of white feathers stood on top of his helmet.
