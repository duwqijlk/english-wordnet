senseId: 'shortness%1:07:00::'
synsetId: 04922639-n
simpleMeaning: a rude way of speaking or acting that is quick and shows little care for other people
scope: This way of speaking, also called abruptness, curtness, brusqueness and gruffness, is about being
  rude, not about height, length in space, or length in time.
examples:
- Her shortness with the waiter made everyone at the table feel bad.
- He spoke with a shortness that sounded rude and cold.
