simpleMeaning: Said of body parts that have far too little oxygen in them
scope: This is said of body parts with far too little oxygen in them, not of ones with only a little less
  oxygen than usual.
examples:
- They called the tissue anoxic because it held far too little oxygen.
- Lack of oxygen left the organ anoxic.
