simpleMeaning: A tall, shapely evergreen of western North America, with long blue-green needles in threes
  and long cones on spreading, somewhat drooping branches; sometimes classed as a kind of ponderosa tree.
scope: A tall western evergreen, also called black pine, Jeffrey's pine and Jeffrey pine; not a fir and
  not a spruce.
examples:
- Pinus jeffreyi towered over the campsite.
- The cones of Pinus jeffreyi littered the trail.
