simpleMeaning: on a bird or other animal, the feathers or hair that grow round its neck
scope: A ring of feathers or hair round an animal's neck, not the sandpiper called a ruff and not the
  card-game move.
examples:
- The lion's ruff stood out thick around its neck.
- The male bird raised its ruff during the mating display.
