simpleMeaning: to put strings of flowers on something as a way to make it beautiful
scope: To hang strings of flowers on something to make it beautiful, not the string of flowers itself
  and not a cloth curtain hung in curves.
examples:
- Workers festooned the bridge with strings of flowers for the festival.
- She festooned the doorway with fresh flowers.
