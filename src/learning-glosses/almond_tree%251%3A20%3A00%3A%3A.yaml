simpleMeaning: Any of several small bushy woody plants with pink or white flowers, most often bearing
  nuts.
scope: Any of several small bushy woody plants with pink or white flowers, most often bearing nuts; not
  a walnut kind and not a plain flowering bush.
examples:
- The almond tree bloomed pink in spring.
- Nuts fell from the almond tree in autumn.
