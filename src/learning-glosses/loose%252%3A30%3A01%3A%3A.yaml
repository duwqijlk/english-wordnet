simpleMeaning: To grow slack and stop being taut or firm.
scope: This is the thing itself going slack, not the act of making it slack or setting it free; the same
  sense is also called loosen or relax.
examples:
- The rope loosed as the weight came off.
- The bandage loosed once the swelling went down.
