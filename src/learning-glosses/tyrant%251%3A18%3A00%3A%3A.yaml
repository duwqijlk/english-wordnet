simpleMeaning: a ruler who holds power by cruelty and treats the people under their rule with harsh force
scope: A cruel ruler who holds power by force, not a ruler of ancient Greece who took power without a
  legal right to it.
examples:
- The tyrant ruled the land with fear for twenty years.
- The people rose up against the tyrant at last.
