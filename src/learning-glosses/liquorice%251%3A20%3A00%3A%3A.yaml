simpleMeaning: A deep-rooted plant native to the Mediterranean region with coarse texture, blue flowers
  and leaflets along each leaf stem, farmed widely in Europe for its long, thick, sweet roots.
scope: The plant itself, also called licorice, not the sweet black candy made from its root.
examples:
- Liquorice has blue flowers and long sweet roots.
- Farmers grow liquorice in Europe for its roots.
