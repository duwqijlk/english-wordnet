simpleMeaning: cloth made from linen, cotton, silk, or wool, with a pattern woven into it that shows on
  both sides
scope: This is the cloth itself, with a pattern woven in that shows on both sides, not a table cloth made
  from this cloth.
examples:
- The curtains were made of heavy silk damask with a flower pattern.
- The chairs were covered in damask woven with roses.
