simpleMeaning: the set way data is laid out, following fixed rules, usually so a computer can work with
  it
scope: The set way information is laid out, not the act of putting printed words into a set shape and
  not the act of getting a disk ready.
examples:
- The format of the report made the figures easy to read.
- Save the file in a format your computer can open.
