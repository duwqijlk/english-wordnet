simpleMeaning: A measure of length for gaps inside the solar system, the same as the average gap between
  Earth and the Sun, about 93 million miles or 150 million kilometres
scope: Also called AU; a measure of length for gaps inside the solar system, one of the long measures
  of length, set by the average gap between Earth and the Sun.
examples:
- One astronomical unit is the average distance from Earth to the Sun.
- Astronomical units are used to measure gaps between planets.
