simpleMeaning: a thin stem-like part by which some climbing plants hold on to a thing for help to stand
  up
scope: A thin stem-like part by which some climbing plants hold on to a thing for help to stand up, not
  a stem itself and not a root.
examples:
- The tendril curled round the fence for support.
- A tendril of the vine reached out and caught the wire.
