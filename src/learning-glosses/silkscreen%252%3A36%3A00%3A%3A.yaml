simpleMeaning: To print by a mesh stencil.
scope: This sense is to print by a mesh stencil, unlike the sense for a print made by a stencil, the picture
  laid on a very fine mesh screen, and ink pressed through the bare parts of the screen onto the printing
  face.
examples:
- They silkscreen shirts, printing by a mesh stencil.
- They silkscreen posters.
