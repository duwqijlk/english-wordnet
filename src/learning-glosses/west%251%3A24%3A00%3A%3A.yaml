simpleMeaning: the mark on a compass that is exactly 270 degrees, one of the four main points.
scope: It is not the general direction of sunset and not the western region of a country; it is the fixed
  270-degree mark on a compass.
examples:
- The pilot checked that west was exactly 270 degrees on the dial.
- The four main points on the compass are north, east, south and west.
