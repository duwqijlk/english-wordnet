simpleMeaning: the group of people who go to one church and are led by its pastor, the person who leads
  the church
scope: This is the people of one church led by a pastor, not a group of sheep or birds and not people
  coming together in a crowd.
examples:
- The pastor knows every family in his flock.
- She joined the flock at the small village church.
