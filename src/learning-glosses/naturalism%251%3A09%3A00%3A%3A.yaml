simpleMeaning: With no need for gods or spirits, the world can be known through science alone, says the
  teaching in philosophy.
scope: In philosophy, this teaching holds that the world can be known through science alone, with no need
  for gods or spirits, and it is not the art movement of the same name in 19th century France.
examples:
- This naturalism holds that science alone can explain the world.
- Under naturalism, the world needs no gods or spirits to be known.
