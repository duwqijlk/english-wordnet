simpleMeaning: a hollowed-out instrument played by hitting it, made from the metal top of an oil barrel,
  with flat spots that give different notes when struck; from the Caribbean
scope: A metal instrument from the Caribbean played by hitting it, not an ordinary drum and not a xylophone.
examples:
- She played a tune on the steel drum at the street fair.
- The steel drum band came from Trinidad.
