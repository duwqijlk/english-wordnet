simpleMeaning: A court ruling that says one person or firm must pay money to another
scope: A court ruling that says one person or firm must pay money to another, also called a judgment in
  personam, personal judgement or personal judgment; not a ruling about a thing and not a ruling that
  orders no payment.
examples:
- The court gave a judgement in personam against the firm.
- The judgement in personam ordered him to pay the money he owed.
