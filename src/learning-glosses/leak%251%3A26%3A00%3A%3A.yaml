senseId: 'leak%1:26:00::'
synsetId: 14308083-n
simpleMeaning: Fruit and vegetables turning soft and wet as they rot, because of fungi (very small living
  things that grow on wet or dead matter)
scope: Rot in fruit and vegetables, not a hole that lets water out and not the giving out of secret news.
examples:
- Leak spread through the stored apples and made them soft.
- Leak turned the melons soft and watery in the warm store room.
