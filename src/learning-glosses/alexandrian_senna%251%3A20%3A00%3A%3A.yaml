simpleMeaning: An upright shrub with bunches of tawny yellow flowers; its dried leaves are used as a medicine
  that loosens the bowels, sometimes put in the genus Cassia.
scope: An upright shrub with bunches of tawny yellow flowers, also called tinnevelly senna, true senna,
  Alexandria senna, Cassia acutifolia, Cassia augustifolia, Indian senna and Senna alexandrina; its nearest
  kin are other shrubs with yellow flowers used as medicine.
examples:
- Alexandrian senna grew in the dry garden with tawny yellow flowers.
- The dried leaves of Alexandrian senna are used as a medicine that loosens the bowels.
