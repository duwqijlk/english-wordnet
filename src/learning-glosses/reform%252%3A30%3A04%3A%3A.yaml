simpleMeaning: to turn a person away from a wrong or evil way of life and toward a right one
scope: To get a person to give up a wrong or evil way of life or conduct and take up a right one; also
  called reclaim, not a campaign and not making a thing better.
examples:
- The church reformed him.
- Reform your conduct before it is too late.
