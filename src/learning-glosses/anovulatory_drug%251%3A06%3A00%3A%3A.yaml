senseId: 'anovulatory_drug%1:06:00::'
synsetId: 03943171-n
simpleMeaning: Estrogen and progestin in this pill keep a woman's body from freeing an egg, so no baby
  can start.
scope: Also called anovulant, birth control pill, contraceptive pill, oral contraceptive, oral contraceptive
  pill, and pill, this is a pill that stops an egg from being freed, not a pill taken after conception.
examples:
- An anovulatory drug stops ovulation so she does not become pregnant.
- The anovulatory drug keeps her from becoming pregnant.
