simpleMeaning: showing very strong feelings or beliefs, ready to act in a violent way, and full of strong
  feeling
scope: 'Also called violent and tearing: for very strong feelings or beliefs and a readiness to act in
  a violent way, not for stormy weather and not for fighting with very strong energy.'
examples:
- She had a fierce loyalty to her family and spoke strongly in their defence.
- He spoke with fierce anger and looked ready to hit the man.
