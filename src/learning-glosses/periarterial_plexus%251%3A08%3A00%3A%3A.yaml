simpleMeaning: A web of nerves that works on its own and runs beside a blood vessel
scope: Also called plexus periarterialis, this is a web of nerves beside a blood vessel, not a single
  nerve and not a web of nerves away from any blood vessel.
examples:
- The periarterial plexus runs along the renal artery.
- Damage to the periarterial plexus can upset blood flow.
