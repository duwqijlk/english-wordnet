simpleMeaning: A rule or set of rules about how people should act, rooted in human nature, which human
  society depends on or must obey.
scope: Rules for how people should act that come from human nature itself, also called law, not a rule
  made by a government and not a rule of science.
examples:
- Natural law says people should not harm each other.
- Some thinkers base their ideas on natural law.
