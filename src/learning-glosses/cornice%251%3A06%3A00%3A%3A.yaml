senseId: 'cornice%1:06:00::'
synsetId: 03115692-n
simpleMeaning: the highest part that sticks out from the wide band (the entablature) across the top of
  a row of stone posts in a building
scope: This is the part that sticks out at the top of a building, not the frame that hides the top of
  a window curtain and not the act of putting such a part on something.
examples:
- The stone cornice ran along the top of the old temple.
- Workers fixed the broken cornice above the tall stone posts.
