senseId: 'filigree%2:36:00::'
synsetId: 01761715-v
simpleMeaning: to make fine, detailed decoration from thin twisted wire, as with a valuable metal such
  as gold or silver
scope: This is the act of making such wire work, not the delicate, detailed decoration itself, which is
  the noun sense of this word.
examples:
- The goldsmith filigreed the ring with thin twisted wire.
- She filigreed a silver brooch by hand.
