simpleMeaning: Slime made by the germs themselves holds them in groups, in wet earth or in rotting plants
  or animal waste.
scope: These germs, also called gliding bacteria, slime bacteria, myxobacter, or myxobacterium, are found
  in wet earth and in rotting plants or animal waste.
examples:
- Slime on wet earth is where myxobacteria gather.
- Rotting plants and animal waste are home to myxobacteria.
