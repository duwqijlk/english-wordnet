simpleMeaning: A discomfort that gets in your way.
scope: A discomfort that gets in your way, not a hard thing that causes real worry, and not the act of
  troubling someone.
examples:
- The damp bed was an inconvenience through the night.
- A sore foot is an inconvenience on a long walk.
