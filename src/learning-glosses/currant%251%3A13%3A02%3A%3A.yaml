simpleMeaning: a small raisin with no seeds that is dried, grown near the Mediterranean Sea and in California,
  and used in cooking
scope: This is the small dried fruit used in cooking, not the fresh red or black berry and not the bush
  that berries grow on.
examples:
- Add a cup of currants to the cake mix.
- She bought dried currants to bake into the bread.
