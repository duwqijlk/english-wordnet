simpleMeaning: Still pictures of a moving thing, flashed past the eyes one after another, give the look
  of the thing moving.
scope: It is also called apparent motion, movement, and motion, and it names the look of a thing moving
  when still pictures of it flash past the eyes.
examples:
- The cinema relies on apparent movement, though nothing on the screen really moves.
- The succession of flashing lights gave an apparent movement that made the sign seem to dance.
