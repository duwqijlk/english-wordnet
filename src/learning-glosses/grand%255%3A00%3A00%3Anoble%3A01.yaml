simpleMeaning: Having high moral or intellectual worth, or raised above the ordinary in character or style.
scope: High moral or intellectual worth, or a raised and lofty character or style, only; not a person's
  dignified, imposing look or manner, not behavior ambitious in scale, not the manner of a lord, not showy
  wealth or superior quality, not something extraordinarily good, not great physical size, not the most
  magnificent in decoration, not the number one thousand, and not the piano.
examples:
- 'The foundation was set up for a grand purpose: to wipe out the disease within a generation.'
- He spoke of freedom in grand terms that stirred the crowd.
