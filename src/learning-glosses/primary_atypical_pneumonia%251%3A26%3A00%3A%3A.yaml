simpleMeaning: A sudden illness of the chest brings a high fever and a cough, above all in children and
  young adults, and tiny germs called mycoplasma bring it on
scope: Also called atypical pneumonia and mycoplasmal pneumonia; a sudden chest illness that hits children
  and young adults above all.
examples:
- The doctor said the primary atypical pneumonia came from tiny germs.
- Primary atypical pneumonia kept her brother coughing and feverish.
