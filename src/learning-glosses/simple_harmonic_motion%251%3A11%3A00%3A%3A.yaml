simpleMeaning: a back-and-forth move that repeats at set times, with a pull back to the middle that grows
  as the move from the middle grows
scope: A back-and-forth move that repeats at set times, with a pull back to the middle; not a one-way
  move and not a move that speeds up without end.
examples:
- The swing showed simple harmonic motion as it moved back and forth.
- In simple harmonic motion, the weight moves back and forth at set times.
