simpleMeaning: a tall plant that lives for years, from the eastern and southern United States, with bright
  orange blooms
scope: A tall plant that lives for years, from the eastern and southern United States, with bright orange
  blooms; butterfly weed, chiggerflower, orange milkweed and pleurisy root are other names for this sense,
  not a chigger insect and not any other orange flower.
examples:
- The chigger flower stood tall at the edge of the field.
- Bright chigger flowers lined the road in summer.
