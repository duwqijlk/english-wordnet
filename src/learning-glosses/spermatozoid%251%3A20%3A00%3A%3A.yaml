senseId: 'spermatozoid%1:20:00::'
synsetId: 13116302-n
simpleMeaning: a male sex cell of a plant, such as an alga, a fern or a gymnosperm, a plant with bare
  seeds, that can move by itself
scope: A male sex cell of a plant that can move by itself, also called antherozoid; not a sperm cell of
  an animal, and not a plant egg cell.
examples:
- The spermatozoid swam through the water to reach the egg.
- A fern sends out a spermatozoid that moves by itself.
