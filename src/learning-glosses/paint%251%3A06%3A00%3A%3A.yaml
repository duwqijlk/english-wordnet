simpleMeaning: A substance spread over a surface to protect or decorate it, especially a pigment mixture
  in liquid, which dries to a hard layer.
scope: This is the coating substance itself, not the pink or red cheek makeup, not the basketball court
  area, and not the act of applying it.
examples:
- We bought a can of white paint for the kitchen walls.
- The paint on the old door was peeling in the sun.
