simpleMeaning: a whiskey made from a kind of grain, or that grain and malt (grain put in water and then
  dried), by heating a drink and cooling its steam
scope: This is the drink only, a whiskey; not the grain plant itself or its seeds, which share the same
  name.
examples:
- He ordered a glass of rye at the bar.
- She drank her rye with a little ice.
