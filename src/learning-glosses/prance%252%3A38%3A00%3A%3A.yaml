simpleMeaning: to walk with high, proud steps, often to show off to others
scope: 'Also called cock, ruffle, and swagger: to walk with high proud steps to impress others, not to
  walk in a plain way and not the proud walk itself as a noun.'
examples:
- He pranced around the yard like a rooster in a hen house.
- The horse pranced into the ring with its head held high.
