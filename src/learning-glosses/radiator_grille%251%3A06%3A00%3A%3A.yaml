simpleMeaning: a set of thin bars at the front of a car that lets cool air in to the part that cools the
  engine
scope: A set of bars at a car's front, also called a grille; not the part that cools the engine itself
  and not a cover over the lights.
examples:
- The stone hit the radiator grille and bent one of its bars.
- He washed the dirt off the radiator grille.
