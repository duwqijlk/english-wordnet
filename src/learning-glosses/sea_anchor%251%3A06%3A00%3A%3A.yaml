senseId: 'sea_anchor%1:06:00::'
synsetId: 04165518-n
simpleMeaning: a cloth-covered frame that floats behind a boat and holds it back, keeping it from drifting
  or turning its bow away from the wind
scope: Also called a drogue; a drag that holds a boat's bow into the wind, not a heavy metal anchor that
  grips the sea floor.
examples:
- The crew put out a sea anchor in the storm.
- A sea anchor kept the boat's bow into the wind.
