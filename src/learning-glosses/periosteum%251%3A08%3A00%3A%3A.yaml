senseId: 'periosteum%1:08:00::'
synsetId: 05334921-n
simpleMeaning: A tough fibrous membrane covering the outside of bones, except at their ends, that anchors
  tendons and muscles and carries the nerves and blood vessels that feed the bone.
scope: This is the living sheath along the shaft of a bone that muscles and tendons grip; it is not the
  hard bone underneath or the smooth cartilage at a joint.
examples:
- The surgeon peeled the periosteum back before fitting the metal plate.
- Because the periosteum is rich in nerves, a bone bruise can be surprisingly painful.
