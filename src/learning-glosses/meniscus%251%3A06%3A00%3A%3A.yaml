simpleMeaning: In physics, the curved top of a still liquid in an upright tube.
scope: In physics, the curved top of a still liquid in an upright tube; not the disk of cartilage that
  cushions the ends of bones where they meet in a joint, and not the lens that is hollow on one side and
  rounded on the other.
examples:
- The meniscus of the water rose in a curve at the sides of the tube.
- Read the level at the bottom of the meniscus in the measuring tube.
