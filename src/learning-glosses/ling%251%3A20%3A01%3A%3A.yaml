simpleMeaning: A low plant that stays green all year, common in the Old World (Europe, Asia and Africa),
  with many forms, and grown widely in the north of the world
scope: This plant sense is also called broom. It is not one of the fish with the same name, and not the
  water plant whose fruit has sharp points.
examples:
- Ling grows in low green clumps on the open hills.
- They planted ling in the garden because it stays green all year.
