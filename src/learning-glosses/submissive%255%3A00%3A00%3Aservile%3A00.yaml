simpleMeaning: obeying others fully and without pride, like a slave or a servant
scope: 'Also called subservient and slavish: obeying others fully and without pride, like a slave or servant;
  not just the milder sense of being willing to follow the orders or wishes of others.'
examples:
- He was so submissive that he bowed to his master and obeyed every order without a word.
- She gave a submissive bow and did whatever the party bosses told her to do.
