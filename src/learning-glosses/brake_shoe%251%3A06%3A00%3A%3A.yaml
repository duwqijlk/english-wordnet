simpleMeaning: when fluid power presses the brake linings against the drum, this brake part holds the
  wheel back and slows its turn
scope: 'Also called shoe and skid: a brake part that holds the wheel back, not the pedal and not the drum
  itself.'
examples:
- The mechanic fitted a new brake shoe to the rear wheel.
- The brake shoe presses against the drum to slow the car.
