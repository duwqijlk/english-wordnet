simpleMeaning: 'The first mechanical rope brake: a small flat piece of metal with a slot that lets a loop
  of rope pass through to a locking carabiner and back out'
scope: The first mechanical rope brake, an early device now less used than newer designs that give smoother
  control over the rope, and it works by passing a loop of rope through a slot to a locking carabiner
  and back out.
examples:
- The Sticht plate was the first mechanical rope brake.
- A Sticht plate lets a loop of rope pass through to a locking carabiner.
