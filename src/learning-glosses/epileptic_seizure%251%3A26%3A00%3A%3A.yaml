simpleMeaning: a time when the body shakes hard and the person cannot think or know what is going on
scope: A fit in which the body shakes hard and the person loses awareness, not a faint and not a fit caused
  by fever alone.
examples:
- He had an epileptic seizure in the classroom and fell to the floor.
- After the epileptic seizure she could not remember what had happened.
