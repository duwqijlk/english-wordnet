simpleMeaning: an Indian fig tree that grows very large and lives very long, without roots that drop from
  the branches as the banyan has, sacred to Buddhists
scope: Also called pipal, pipul, bo tree, peepul, and sacred fig; a great Indian fig tree held holy by
  Buddhists, not the banyan and not a common shade tree.
examples:
- The old pipal tree by the river is said to be hundreds of years old.
- A pipal tree grows beside the village shrine.
