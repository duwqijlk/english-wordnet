simpleMeaning: A container, longer than it is wide and most times with a lock, for carrying important
  papers or other things of worth.
scope: This container, also called a dispatch case, is longer than it is wide, most times with a lock,
  and is for carrying important papers or other things of worth.
examples:
- The messenger carried the orders in a dispatch box.
- She locked the papers in a dispatch box.
