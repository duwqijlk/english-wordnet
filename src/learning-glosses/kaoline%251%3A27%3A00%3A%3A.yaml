simpleMeaning: a fine clay, usually white, that forms as minerals rich in aluminium, like feldspar, wear
  away in weather; potters use it, and it soaks up wetness and fills out paper
scope: 'Also called china clay, china stone, kaolin, porcelain clay, or terra alba: a fine white clay
  for pottery and paper, not the brown clay of a garden, and not chalk.'
examples:
- The factory buys kaoline to whiten its paper.
- Kaoline gives the glaze on these plates its smooth white coat.
