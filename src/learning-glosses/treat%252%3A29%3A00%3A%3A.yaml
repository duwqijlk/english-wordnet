simpleMeaning: to give medical care to a sick or injured person or animal.
scope: This is not putting an object through a process such as cleaning or preserving, and not a pleasant
  surprise; it means giving medical care to a person or animal who is ill or hurt.
examples:
- The doctor treated her for a chest infection.
- The vet treated the dog's injured paw.
