simpleMeaning: a flying machine with a spinning blade on the outside, turned by a jet engine
scope: 'Also called turboprop and propjet: a flying machine driven by a jet engine through outside blades,
  not a machine with a jet alone and not one with a piston engine.'
examples:
- The turbo-propeller plane took off from the short runway.
- A turbo-propeller plane is slower than a pure jet but uses less fuel.
