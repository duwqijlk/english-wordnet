simpleMeaning: A person in deep sleep without dreams gives off this usual brain signal in a sleep test,
  strong and only 1 to 4 beats each second
scope: Also called delta rhythm, this is the usual brain signal in a sleep test of a person in deep sleep
  without dreams, strong and only 1 to 4 beats each second.
examples:
- Delta waves appeared on the sleep test during deep sleep.
- Her delta wave pattern was slow and strong.
