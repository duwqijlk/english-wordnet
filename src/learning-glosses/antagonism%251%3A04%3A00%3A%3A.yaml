simpleMeaning: In biochemistry, the stopping or weakening of what one chemical substance does in the body
  by another chemical substance that is built in a like way
scope: In biochemistry, this is one substance stopping or weakening another; it is not a feeling of dislike
  and hate, and not a link between opposing ideas or forces.
examples:
- The antagonism between the two drugs meant one stopped the other from working.
- Doctors studied the antagonism of the new chemical, which weakened the first drug's action in the body.
