simpleMeaning: a pale animal from India with no dark colour in its skin, rare and at times held as holy
  in the east of Asia
scope: A pale animal of India, rare and at times held as holy in the east of Asia, not a costly gift and
  not a plain elephant.
examples:
- The white elephant was kept in the temple grounds.
- People came from far away to see the white elephant.
