simpleMeaning: Using, supplying, producing, carrying, or driven by the power that runs through wires or
  comes from batteries.
scope: This describes equipment or systems that run on that current; it is not a mood of tense excitement,
  and it is not the noun for a battery-driven car.
examples:
- The flat has electric heating.
- She bought an electric kettle for the office.
