simpleMeaning: Roasting meat stays moist because this person spoons melted fat or gravy over it as it
  cooks.
scope: This sense names the cook who keeps roasting meat moist with melted fat or gravy, not the sewer
  who fastens cloth with loose stitches and not the tube with a rubber bulb that takes up fat.
examples:
- The baster spooned melted fat over the roast while it cooked.
- A good baster keeps the meat moist with gravy.
