simpleMeaning: The state of being alone, cut off from other people and living by oneself
scope: The state of living alone and apart from others, not loneliness, which is a sad feeling, and not
  a short time spent by oneself.
examples:
- After years of solitariness in the hills, he found town life noisy.
- Her solitariness suited her; she liked long walks alone.
