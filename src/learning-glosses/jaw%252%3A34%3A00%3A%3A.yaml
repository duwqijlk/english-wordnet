simpleMeaning: break down food with the teeth by biting and grinding it
scope: This means grinding food between the teeth; chew, masticate and manducate are other names for it,
  not a single bite or the act of swallowing.
examples:
- He jawed his bubble gum throughout the film.
- The old horse jawed the hay slowly.
