simpleMeaning: in a way that shows you want to hurt or upset someone
scope: This sense means in a way that wants to hurt or upset someone; it is not the stronger sense done
  in a cruel way to do real harm.
examples:
- She spoke spitefully to her sister after the argument.
- He spitefully hid his brother's keys so he would be late.
