simpleMeaning: Soaking the fruit of the mountain ash tree gives a strong drink, once natural caramel,
  drink got from wine, and drink got from fruit are added in.
scope: It is also called rowan berry vodka and rowanberry vodka, and it is a strong drink from a soak
  of mountain ash fruit, not a plain vodka.
examples:
- This rowan vodka goes well with game.
- A sip of rowan vodka is strong.
