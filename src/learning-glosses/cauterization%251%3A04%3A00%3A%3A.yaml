senseId: 'cauterization%1:04:00::'
synsetId: 00669355-n
simpleMeaning: The act of making blood clot and killing tissue with a hot iron, a burning chemical, or
  by freezing.
scope: The act of sealing blood and killing tissue with heat, chemicals or cold; cauterisation and cautery
  are other names for this sense.
examples:
- Cauterization stopped the bleeding after the operation.
- The doctor chose cauterization to close the small cut.
