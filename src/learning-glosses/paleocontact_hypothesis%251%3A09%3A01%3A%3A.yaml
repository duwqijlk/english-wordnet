simpleMeaning: an idea, not backed by real science, that smart beings from other worlds came to Earth
  long ago and met people in very old times
scope: 'Also called the ancient astronaut hypothesis: an idea, not backed by real science, that beings
  from other worlds met people long ago, not a proven fact about space travel.'
examples:
- The paleocontact hypothesis claims that aliens visited Earth in ancient times.
- He wrote a book about the paleocontact hypothesis and its strange stories.
