simpleMeaning: a large fish of the open sea, long in body and with no scales, sharp teeth, and a tall
  sail-like fin rising from its back
scope: 'Also called lancet fish and wolffish: a big sea fish with no scales and a tall fin on its back,
  not a shark and not a fish with scales.'
examples:
- The lancetfish flashed its tall fin as it swam past.
- A lancetfish caught in the net had sharp teeth and no scales.
