simpleMeaning: Plant food made from rocks and chemicals, with only tiny amounts of the extra things plants
  need to grow
scope: 'Also called mineral fertilizer: plant food from rocks and chemicals, not plant food from dung
  or dead plants, and not a spray that kills weeds.'
examples:
- The gardener spread mineral fertiliser over the vegetable beds.
- This mineral fertiliser feeds the roses without adding dung.
