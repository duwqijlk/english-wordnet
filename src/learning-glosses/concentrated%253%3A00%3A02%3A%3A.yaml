simpleMeaning: of a liquid mix (a solution), holding as much of a substance as it can hold at a given
  temperature, so no more can dissolve into it
scope: This sense means a liquid mix holds the most it can hold at a given temperature and can take no
  more. It is not just a strong mix that has been made with less water.
examples:
- The concentrated salt water held as much salt as it could at that heat, and no more would mix in.
- In the lab, their concentrated solution could not take in any more powder at that temperature.
