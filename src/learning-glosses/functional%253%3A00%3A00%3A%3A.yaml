simpleMeaning: Made to do a set job, and able to do it.
scope: This is being made to do a set job, not the sense of a machine that works, nor the sense of how
  a thing works rather than the body, nor the sense of being based on use rather than shape, nor the sense
  of being fitted to a use.
examples:
- Every word in the piece is functional.
- The functional chair folds flat for storage.
