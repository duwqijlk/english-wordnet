simpleMeaning: sand, mud or small stones building up in one place over time
scope: This is sand, mud or small stones building up in one place, with deposit as another name for this
  sense, and not the carrying away of such material.
examples:
- After the storm, the alluviation raised the riverbed by several inches.
- The farmers watched the alluviation fill the old channel with sand.
