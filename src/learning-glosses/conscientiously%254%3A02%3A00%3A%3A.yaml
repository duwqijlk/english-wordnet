simpleMeaning: in a way that shows very great care to do what is right and to do the work well
scope: This is about doing something with very great care to do it right and well, not just doing it often
  or at the same time each day.
examples:
- She checked every page conscientiously before she sent the report.
- He conscientiously did each small job, even when no one was watching.
