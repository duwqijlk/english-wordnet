simpleMeaning: a small flat plastic disk that stores computer data and programs with the help of magnets,
  kept in a stiff cover with a thin cut running out from its middle
scope: A small disk for storing computer data in a stiff cover, not a hard disk inside a computer and
  not a soft hat.
examples:
- She saved her school work on a floppy and carried it home in her bag.
- He found a box of old floppy disks in the attic.
