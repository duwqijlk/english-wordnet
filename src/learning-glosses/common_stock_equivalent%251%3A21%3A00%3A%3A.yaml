simpleMeaning: Shares, bonds, or papers giving a right to buy shares, that can be changed into ordinary
  shares
scope: Shares, bonds, or papers giving a right to buy shares, that can be changed into ordinary shares;
  not ordinary shares themselves and not a fixed loan that cannot change.
examples:
- The common stock equivalent can be turned into ordinary shares.
- Her common stock equivalents changed into ordinary shares at the end of the year.
