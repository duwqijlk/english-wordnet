simpleMeaning: a performer whose name is given the most prominent place in a show's publicity and credits
scope: This is not a ball of burning gas in the night sky or a shape on a flag; it is a performer given
  top billing.
examples:
- She became a star after her first role on Broadway.
- The film's star refused to answer questions about the ending.
