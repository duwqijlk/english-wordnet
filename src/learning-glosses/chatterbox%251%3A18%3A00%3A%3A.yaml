simpleMeaning: A person who talks too much, in a silly way that gets on people's nerves.
scope: A silly person who talks too much and annoys others, also called a magpie, a chatterer, or a babbler;
  not the orchid that grows by streams.
examples:
- Stop being such a chatterbox and let someone else speak.
- The chatterbox in the next seat talked all the way to London.
