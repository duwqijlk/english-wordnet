simpleMeaning: Said of a creature whose body is cut up into a row of like parts, one after another, as
  in worms and lobsters.
scope: Also called metameric and segmental; having the body divided into successive metameres or segments,
  as in earthworms or lobsters, not merely marked with lines.
examples:
- The segmented body of the earthworm moved in waves.
- Lobsters are segmented animals, their bodies built in sections.
