simpleMeaning: The process that makes a substance able to pull iron and steel, for a short time or for
  good
scope: Also called magnetic induction and magnetisation, this is the way a thing gains the power to pull
  iron and steel, not the power itself and not the thing after it has gained the power.
examples:
- The magnetization of the needle took only a few seconds.
- After magnetization, the bar could pick up nails.
