simpleMeaning: a gift for doing something well that you were born with, because it runs in your family
  and was never learned by practice
scope: 'Also called born and natural: a gift you were born with because it runs in your family, not a
  skill you picked up in the womb and not a talent you learned by practice.'
examples:
- She is an innate musician who never took a lesson.
- He has an innate talent for languages that runs in his family.
