simpleMeaning: to do with a person whose job is office work such as writing letters, answering the phone
  and keeping records, or to do with that person's work
scope: This word describes a secretary or a secretary's work in an office, not the office itself and not
  a manager's work.
examples:
- She does secretarial work in a small office.
- He took a secretarial course to learn typing and filing.
