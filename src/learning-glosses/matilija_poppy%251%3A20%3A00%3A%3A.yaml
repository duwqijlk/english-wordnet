simpleMeaning: a tall, much-branched low woody plant from California and Mexico, often grown for its silvery-blue
  leaves and big sweet-smelling white flowers
scope: A low woody plant grown for its big white flowers, not a tall tree and not a poppy grown for seed.
examples:
- The matilija poppy in the garden has big white flowers.
- They planted a matilija poppy for its silvery-blue leaves.
