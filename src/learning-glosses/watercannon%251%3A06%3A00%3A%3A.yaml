simpleMeaning: Crowds, above all crowds of rioters, are pushed back by liquid shot hard from a hose on
  a truck.
scope: Also called water cannon, it is a hose on a truck that shoots liquid hard to push crowds back,
  above all crowds of rioters.
examples:
- The watercannon pushed the rioters back.
- A watercannon on the truck shot liquid hard at the rioters.
