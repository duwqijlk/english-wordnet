simpleMeaning: A small printed plate that goes into a spare opening in a computer, letting it take on
  jobs it could not do before
scope: This plate is also called a card, a board, an add-in, a circuit board, and a plug-in, and it lets
  a computer take on new jobs.
examples:
- He slid the circuit card into the spare slot and the computer started up.
- The new circuit card lets the computer handle sound and pictures.
