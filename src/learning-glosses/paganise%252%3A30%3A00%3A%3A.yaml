simpleMeaning: to give a thing the ways of worship of many gods
scope: To give a thing the ways of worship of many gods, also called paganize; not to make it Christian
  and not to make it godless.
examples:
- He paganised the old festival with new rites.
- The writer claimed Rome had paganised the early faith.
