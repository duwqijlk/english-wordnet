simpleMeaning: A thin cut of meat, above all veal, that is usually fried or cooked under high heat.
scope: A thin cut of meat, above all veal, also called scallop, cutlet, and scollop; not a thick steak
  and not a cut of fish.
examples:
- She fried a thin escallop of veal for supper.
- The butcher sliced the veal into a thin escallop for frying.
