simpleMeaning: The belief that all that people know came first from God speaking to them, and has been
  handed down ever since through what people pass on.
scope: The doctrine that all knowledge was originally derived by divine revelation and transmitted by
  traditions, not strict keeping to old methods or teachings in general.
examples:
- Traditionalism held that truth came by revelation, not by reason alone.
- He defended traditionalism against the new philosophy.
