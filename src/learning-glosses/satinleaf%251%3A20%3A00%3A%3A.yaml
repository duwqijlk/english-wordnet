simpleMeaning: A tree of warm America, cut for its dark, hard, heavy wood, with small dark-purple fruit
  like plums.
scope: A warm-American tree cut for dark hard wood, also called satin leaf, caimitillo, and damson plum;
  not a plum tree grown for fruit and not a satinwood tree.
examples:
- Satinleaf wood is dark and heavy.
- The satinleaf grows in the warm forests of America.
