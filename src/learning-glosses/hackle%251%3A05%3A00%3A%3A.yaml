simpleMeaning: a long, thin feather on the neck of a bird such as a turkey or a pheasant
scope: A long, thin neck feather on birds like turkeys; not a wing feather and not a tail feather.
examples:
- Each hackle on the pheasant's neck is long and bright.
- The farmer found a loose hackle under the turkey roost.
