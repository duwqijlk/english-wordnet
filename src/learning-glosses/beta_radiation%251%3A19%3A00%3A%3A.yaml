simpleMeaning: Tiny bits shot out by an atom as matter breaks down on its own.
scope: Tiny bits given off as they break away from an atom, also called beta ray and electron radiation;
  not light from a lamp and not heat from a fire.
examples:
- Beta radiation comes from atoms as they break down.
- The counter clicked as beta radiation reached it.
