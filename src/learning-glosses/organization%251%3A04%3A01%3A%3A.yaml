simpleMeaning: The work, or its outcome, of handing out or placing people or things in a careful, planned
  way.
scope: The arranging of people or things themselves only; not a group of people who work together, a classifying
  structure, an administrative body, the act of arranging how a business or its activities are run, the
  quality of being neat and orderly, or the act of founding something.
examples:
- His organization of the work force was very efficient.
- The organization of the relief supplies took most of the morning.
