simpleMeaning: A heavy solemn quality that is slow, hard work, and without ease or flow
scope: A heavy solemn quality that is slow, hard work, and without ease or flow; heaviness is another
  name for this sense, not lightness or ease and not a quick lively style.
examples:
- The book sank into ponderousness in its middle chapters.
- His lectures had a ponderousness that put the class to sleep.
