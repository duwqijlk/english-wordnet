simpleMeaning: A plant stuff of long chains, next to sugars the main part of wood, that sticks to plant
  fibres and makes the walls of plant cells hard and strong.
scope: The woody stuff that stiffens plant cell walls, not the sugars in wood.
examples:
- Lignin gives wood its stiffness and strength.
- Lignin binds the fibres in wood and makes the cell walls strong.
