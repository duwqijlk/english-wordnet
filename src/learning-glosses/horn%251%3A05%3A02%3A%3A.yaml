simpleMeaning: any hard part that sticks out from the head of a living thing and looks like a pointed
  animal head growth
scope: A hard part on any living thing that looks like a horn; not the true bony horn on a hoofed animal,
  and not the hard stuff such a horn is made of.
examples:
- The beetle has a small horn sticking out from its head.
- Two short horns grow on the insect's head.
