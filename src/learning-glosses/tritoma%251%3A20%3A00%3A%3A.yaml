simpleMeaning: This plant of the group Kniphofia is known by its tall stems, each carrying red or yellow
  flowers that hang down above long leaves like grass.
scope: Also called flame-flower, flame flower, flameflower, and kniphofia, it is a plant of the group
  Kniphofia with tall stems of drooping red or yellow flowers.
examples:
- The tritoma in the bed sends up tall stems of red flowers.
- The bed held tritoma in flower, its tall stems topped with yellow blooms hanging down.
