simpleMeaning: Someone who takes the money when people buy things or pay for a service, such as in a shop
  or a restaurant.
scope: This is the person who takes your money when you pay in a shop or restaurant, not a worker in a
  bank.
examples:
- The cashier scanned each item and told him the total.
- She thanked the cashier and took her shopping bags.
