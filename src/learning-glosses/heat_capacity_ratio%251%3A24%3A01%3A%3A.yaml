synsetId: 92439903-n
simpleMeaning: The ratio of heat capacity at constant pressure (C_P) to heat capacity at constant volume
  (C_V).
scope: This number, also called the adiabatic index, is got by dividing what a thing takes in as warmth
  at a set push by what it takes in at a set size.
examples:
- She wrote down the heat capacity ratio for the gas.
- We worked out the heat capacity ratio from the two values.
