simpleMeaning: A rock in space found in 1977, the only one whose path lies mostly between the paths of
  Saturn and Uranus.
scope: This is a rock in space found in 1977, the only one whose path lies mostly between the paths of
  Saturn and Uranus; it is not the wise centaur of Greek myth and not a planet.
examples:
- Chiron was found in 1977, moving between Saturn and Uranus.
- Astronomers track Chiron as it moves along its path between Saturn and Uranus.
