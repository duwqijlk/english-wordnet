simpleMeaning: a frame with hooks where coats and hats can hang for a short time
scope: A frame with hooks for coats and hats, also called coat rack and hatrack. It is not a shelf or
  a box for keeping clothes for a long time.
examples:
- He hung his wet coat on the coatrack by the door.
- Please put your hats on the coatrack in the hall.
