senseId: 'sympathetic%3:00:00::'
synsetId: 02383482-a
simpleMeaning: showing, feeling, or coming from care and understanding for another person's feelings or
  trouble, and ready to support a person or idea
scope: Showing or feeling care for another person, or ready to support them; not about shaking movements
  set off by a nearby thing, and not about a character in a story or play.
examples:
- She gave me a sympathetic smile when I told her my dog had died.
- He was sympathetic to our plan and offered his support.
