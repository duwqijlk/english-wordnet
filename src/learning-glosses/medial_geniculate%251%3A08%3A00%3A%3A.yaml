simpleMeaning: A nerve knot that works as the last of a run of sorting points on the hearing road from
  the cochlea to the temple lobe of the brain's outer layer.
scope: This sense is also called corpus geniculatum mediale and medial geniculate body, for a nerve knot
  that works as the last of a run of sorting points on the hearing road from the cochlea to the temple
  lobe of the brain's outer layer.
examples:
- The medial geniculate sorts hearing signals.
- Medial geniculates pass sound to the brain.
