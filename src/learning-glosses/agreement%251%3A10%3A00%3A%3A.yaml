simpleMeaning: The act of saying yes to something or expressing consent.
scope: The spoken act of consenting; not the arrangement people reach, not the statement of mutual promises,
  and not the grammar rule about matching forms.
examples:
- The chairman asked for a word of agreement from each member.
- A quiet 'yes' was his only sign of agreement.
