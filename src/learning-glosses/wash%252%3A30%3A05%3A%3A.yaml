simpleMeaning: to use water or another liquid, with soap or a cleaner, to take something away
scope: Removing dirt or a stain with liquid and soap, not cleaning an object all over, not taking particles
  from ore, and not applying a thin coat of paint.
examples:
- He washed the mud off his boots.
- The nurse washed the blood from the cut.
