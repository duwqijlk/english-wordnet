senseId: tributary%5:00:00:secondary:01
synsetId: 01861243-s
simpleMeaning: 'describing a stream: flowing into a larger stream'
scope: This word describes a stream that flows into a larger one; it is not the name of the stream itself
  and it does not mean paying money or goods to a ruler.
examples:
- A tributary stream feeds into the main river near the bridge.
- They followed a small tributary creek up into the hills.
