synsetId: 04335324-n
simpleMeaning: a small clock that a person can start and stop to measure exactly how long something takes,
  such as a race
scope: This is a clock for timing how long an event takes, not a clock that tells you the time of day.
examples:
- She started her stopwatch as the runners left the line.
- He checked the stopwatch to see how fast the race was.
