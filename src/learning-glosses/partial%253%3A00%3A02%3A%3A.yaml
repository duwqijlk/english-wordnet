simpleMeaning: being only some of a whole thing or amount, not all of it
scope: This word says something is only some of a whole, not all of it. It is not the noun for a high
  tone in sound, and not the maths noun.
examples:
- She received only a partial payment for the work.
- The plan was a partial success, but two parts still failed.
