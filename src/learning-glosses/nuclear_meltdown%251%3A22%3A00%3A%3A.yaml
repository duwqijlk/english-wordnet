simpleMeaning: When the middle of a power station that runs on atoms grows far too hot, it turns to liquid
  and rays escape.
scope: Also called a meltdown, it is what happens when the middle of a power station that runs on atoms
  grows far too hot and turns to liquid, letting rays escape.
examples:
- The nuclear meltdown began when the middle of the reactor grew too hot.
- After the nuclear meltdown, rays escaped from the power station.
