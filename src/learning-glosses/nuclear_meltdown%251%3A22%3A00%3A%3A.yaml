simpleMeaning: Severe overheating of a nuclear reactor core, causing the core to melt and radiation to
  escape.
scope: Also called a meltdown; the reactor core becomes severely overheated, melts, and lets radiation
  escape.
examples:
- The nuclear meltdown began when the middle of the reactor grew too hot.
- After the nuclear meltdown, rays escaped from the power station.
