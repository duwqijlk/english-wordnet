simpleMeaning: a machine that makes a loud sound, often a long, high sound, used as a signal or warning
scope: This is the machine that makes the warning sound, not the sound itself and not a long water animal
  with no back legs.
examples:
- The police car turned on its siren as it raced past us.
- The siren on the fire station roof makes a loud sound to warn people nearby.
