senseId: 'microsporophyll%1:20:00::'
synsetId: 11708538-n
simpleMeaning: A leaf-like part in plants that do not flower, which holds only the small cases that make
  tiny spores
scope: In plants that do not flower, a leaf-like part that holds only the cases that make tiny spores,
  not a part that holds the cases that make large spores, and not a plain leaf.
examples:
- On the cone, each microsporophyll carries the small sacs that make pollen.
- Botanists look at the microsporophyll to see how the tiny spores are made.
