simpleMeaning: a thin, crisp piece of tortilla (thin flat bread), with cheese and hot chili pepper on
  top, cooked under strong heat from above
scope: This is one chip with cheese and chili pepper cooked on top of it, not a plain tortilla chip and
  not a bowl of cheese sauce for dipping.
examples:
- He ate a nacho straight from the hot tray.
- Each nacho was covered with melted cheese and a slice of chili pepper.
