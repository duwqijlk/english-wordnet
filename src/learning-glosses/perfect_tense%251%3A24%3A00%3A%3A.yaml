simpleMeaning: a verb form that talks about an action as already finished
scope: 'Also called perfect, perfective and perfective tense: a verb form for an action already finished,
  not a form for an action still going on and not a form for a future action.'
examples:
- Have eaten is in the perfect tense.
- She used the perfect tense to say the work was done.
