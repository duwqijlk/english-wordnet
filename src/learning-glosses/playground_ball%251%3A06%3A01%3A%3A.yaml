simpleMeaning: In games like four square, and games where you kick it or throw it to hit others, this
  big round thing made of rubber is the one used
scope: A big rubber ball for playground games, not a small hard ball for a sport like tennis or golf.
examples:
- The playground ball bounced high over the fence.
- We used the playground ball for a game of kickball.
