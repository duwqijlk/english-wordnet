simpleMeaning: The branch of the study of the body that looks at how one living thing's build changes
  from the start of life to full growth
scope: This is the branch of the study of the body that looks at how one living thing's build changes
  from the start of life to full growth, not the study of an adult body as it is and not the study of
  how the body works.
examples:
- Her course in developmental anatomy traced the growth of the embryo.
- Developmental anatomy shows how the heart forms before birth.
