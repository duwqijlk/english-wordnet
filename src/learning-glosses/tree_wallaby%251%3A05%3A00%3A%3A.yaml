simpleMeaning: Small jumping animals of New Guinea and northern Australia that live up in leafy plants,
  with back and front legs about the same length
scope: Small jumping animals of New Guinea and northern Australia that live up in leafy plants, also called
  tree kangaroo; not ground wallabies and not monkeys that swing through branches.
examples:
- The tree wallaby moved slowly through the high branches.
- Tree wallabies feed on leaves in the forests of New Guinea.
