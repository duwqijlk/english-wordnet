simpleMeaning: A sudden painful tightening of a muscle, above all in the neck or back
scope: A sudden painful tightening of a muscle, above all in the neck or back, also called wrick in Britain;
  not a lasting injury or a broken bone.
examples:
- He got a rick in his neck from sleeping in a bad position.
- A rick in her back kept her from bending down.
