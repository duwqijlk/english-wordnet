senseId: 'balancer%1:05:00::'
synsetId: 02154864-n
simpleMeaning: One of the two small, undeveloped back wings of a two-winged insect, used to keep it steady
  in flight.
scope: Also called a halter or a haltere, a small back wing of a two-winged insect, not an acrobat who
  balances in difficult positions.
examples:
- The fly steadied itself with its balancers in the wind.
- Each balancer helps the insect keep its balance as it flies.
