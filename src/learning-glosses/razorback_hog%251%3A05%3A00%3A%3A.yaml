simpleMeaning: a pig of mixed farm stock gone wild, thin-bodied with long legs and a ridged back, living
  mostly wild in the south-east United States
scope: Also called razorback and razorbacked hog; a wild pig of the south-east United States, not a whale
  and not a farm pig.
examples:
- The razorback hog trotted through the pine woods.
- Hunters tracked a razorback hog near the river.
