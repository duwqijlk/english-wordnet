simpleMeaning: A person in your family from long ago, usually further back than a grandparent, from whom
  you come
scope: 'Also called root: a person in the family from long ago, not a parent or grandparent close to you.'
examples:
- Her ancestors came to this land two hundred years ago.
- The old book lists the ancestors of the king.
