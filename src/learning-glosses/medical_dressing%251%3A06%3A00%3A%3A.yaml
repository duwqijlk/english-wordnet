simpleMeaning: A wound or sore is covered by this cloth laid over it
scope: Also called a dressing, this is a cloth laid over a wound or sore to cover it, not a bandage tied
  tight round a limb and not a cream put on the skin.
examples:
- The nurse changed the medical dressing on his cut arm.
- She put a fresh medical dressing over the sore on her foot.
