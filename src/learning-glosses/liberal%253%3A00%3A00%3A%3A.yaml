simpleMeaning: Open to change and new ideas, and not tied to strict authority, accepted beliefs, or old
  customs.
scope: This describes an outlook that accepts social change, not the economic belief in free markets and
  not merely a personal willingness to accept other people's views.
examples:
- She holds liberal views on marriage and family life.
- The country has become more liberal about dress and behavior.
