simpleMeaning: a low woody plant of southern Australia that lives for many years, with soft stems and
  leaf undersides covered in soft fuzz, and bunches of red to pink flowers
scope: A woody plant of southern Australia with soft stems and red to pink flowers, not a garden pea and
  not a sweet pea.
examples:
- The hairy darling pea grows wild in the dry hills of southern Australia.
- In spring the hairy darling pea is covered in red to pink flowers.
