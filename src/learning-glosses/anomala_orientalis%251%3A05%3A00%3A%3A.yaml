simpleMeaning: A beetle brought into the United States from the East, whose young feed on the roots of
  sugar cane and other grasses.
scope: 'Also called Asiatic beetle and Oriental beetle: a beetle from the East now found in the United
  States, whose young feed on grass roots.'
examples:
- The larvae of Anomala orientalis feed on the roots of the sugarcane in the field.
- Anomala orientalis came into the United States from the Orient long ago.
