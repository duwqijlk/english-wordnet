simpleMeaning: to move by twisting and bending the body, especially when you are struggling
scope: 'This sense is also called twist, worm, wrestle, squirm and writhe: moving the body by twisting
  and bending, especially when struggling, not turning something round and not fighting a person.'
examples:
- The child wriggled in his seat and could not sit still.
- She wriggled to free herself from the tight hold.
