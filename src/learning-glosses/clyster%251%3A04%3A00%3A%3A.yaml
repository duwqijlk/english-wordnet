simpleMeaning: Sometimes used to help find what is wrong, this liquid goes into the body through the anus
  and makes the bowels empty.
scope: Also called an enema, this liquid goes into the body through the anus to make the bowels empty,
  and is sometimes used to help find what is wrong.
examples:
- The doctor gave him a clyster to make his bowels empty.
- A clyster was used to help find what was wrong.
