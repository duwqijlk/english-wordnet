simpleMeaning: A plant of the genus Stapelia whose thick, toothed, leafless stems look like a cactus and
  whose large, foul-smelling flowers often form a star.
scope: Another name for stapelia and carrion flower; a cactus-like plant with foul-smelling blooms, not
  a true cactus.
examples:
- The starfish flower earns its name from blooms shaped like a star.
- A starfish flower's thick, leafless stems make it look like a small cactus.
