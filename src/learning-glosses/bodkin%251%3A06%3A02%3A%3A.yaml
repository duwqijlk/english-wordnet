simpleMeaning: A long hairpin of former times, usually with a head made to look nice.
scope: A long hairpin of former times, usually with a head made to look nice; not a small sharp tool for
  punching holes in leather or cloth, a blunt needle for threading ribbon through loops, or a dagger with
  a thin blade.
examples:
- The bodkin held her hair in a neat coil.
- Their bodkin had a head shaped like a small flower.
