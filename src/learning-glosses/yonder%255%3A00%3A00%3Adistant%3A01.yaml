simpleMeaning: far away, but still close enough to be seen; 'yon' is the old local word for it
scope: Far off yet still in sight, not the adverb use for a place over there.
examples:
- The yonder hills were blue in the morning light.
- We could see the yonder valley from the top of the hill.
