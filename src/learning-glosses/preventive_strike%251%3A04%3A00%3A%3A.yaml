simpleMeaning: To stop harm from an enemy that is thought to be coming, a hit is made
scope: 'Another name for a preventive attack: a hit made to stop harm from an enemy that is thought to
  be coming; not a hit made in a fight that is already going on.'
examples:
- The country carried out a preventive strike.
- A preventive strike stopped the planned assault.
