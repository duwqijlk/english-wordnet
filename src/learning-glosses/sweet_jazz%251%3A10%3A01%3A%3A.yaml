simpleMeaning: In music, a warm sound and a clear tune mark this kind of jazz, played with a steady beat
  and a middling speed and with no made-up parts.
scope: This is the jazz known for its warm sound and clear tune, played at a middling speed with a steady
  beat.
examples:
- They danced to sweet jazz with a steady beat.
- Her sweet jazz sounded warm and clear.
