simpleMeaning: Loss of feeling in a small part of the body, as when a numbing drug is put in for taking
  out a tooth
scope: 'Also called local anaesthesia: loss of feeling in a small part of the body, not loss of feeling
  in the whole body and not loss of feeling from a knock on the head.'
examples:
- Local anesthesia kept her mouth numb during the filling.
- The dentist used local anesthesia for the tooth extraction.
