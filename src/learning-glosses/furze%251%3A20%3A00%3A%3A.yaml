simpleMeaning: Gold-yellow flowers give off a sweet smell on this common bush of the west of Europe, green
  all year, with many sharp points and thick growth.
scope: Also called whin or gorse, this common bush of the west of Europe stays green all year, with many
  sharp points and thick growth and gold-yellow flowers that give off a sweet smell.
examples:
- The furze on the hill was thick with sharp points and gold-yellow flowers.
- Furze grows all through the west of Europe.
