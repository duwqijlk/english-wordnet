simpleMeaning: The verb in a sentence names an act; the living thing that sets that act going has this
  part.
scope: 'Also called agent: in a sentence, the part played by the living thing that starts what the verb
  says, not the thing acted on.'
examples:
- In 'The dog chased the cat', the dog has the agentive role.
- The agentive role in the sentence goes to the one who starts the action.
