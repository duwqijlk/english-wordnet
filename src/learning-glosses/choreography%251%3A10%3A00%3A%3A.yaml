simpleMeaning: a way of writing down dance steps with signs, in the same way that music is written down
  with notes
scope: This is the general way of writing dance down with signs, in the same way that music is written
  down with notes; not a dance show with artistic dancing, and not a single set of such signs used by
  a person who plans a dance.
examples:
- She learned to read the choreography before she danced the piece.
- The choreography on the page used signs for each step.
