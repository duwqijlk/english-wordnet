simpleMeaning: a unit used to state the thickness of sheets or wire, equal to one thousandth of an inch
scope: The thousandth-of-an-inch length unit for material thickness, not the metric thousandth-of-a-liter
  volume unit or the artillery angle unit.
examples:
- The coating is half a mil thick.
- Engineers specify wire thickness in mils.
