simpleMeaning: the parts inside the body that do its work, taken all together, especially the parts in
  the belly
scope: 'Also called insides, entrails and innards: the parts inside the body taken all together, not one
  single part on its own.'
examples:
- The doctor checked the viscera for signs of injury.
- Viscera include the stomach, the heart and the lungs.
