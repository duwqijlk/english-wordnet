simpleMeaning: to make a strong feeling less strong, or to make a person calm
scope: 'Also called still, relieve and ease: making a feeling such as fear or anger less strong, or making
  a person calm, not taking a thing away.'
examples:
- The doctor's kind words allayed her fears.
- He tried to allay their anger by telling them the full story.
