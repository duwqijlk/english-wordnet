simpleMeaning: 'A whole pause lasts twice as long as this mark for a pause in music: it lasts two beats
  in common time'
scope: In music, a mark for a pause of two beats, not a whole pause of four beats and not a pause of one
  beat.
examples:
- The singer held the half rest for two beats before coming in.
- There is a half rest at the start of the second bar.
