simpleMeaning: What someone wishes or hopes for is said with this verb form, as in Greek or Sanskrit,
  and in English with helping verbs like may or might.
scope: 'It is also called optative mood: a verb form, as in Greek or Sanskrit, for saying what someone
  wishes or hopes for.'
examples:
- The optative in the Greek sentence showed the speaker's wish.
- In English we say the optative with may or might.
