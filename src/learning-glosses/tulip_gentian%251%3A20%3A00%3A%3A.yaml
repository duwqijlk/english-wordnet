simpleMeaning: A striking wildflower of wet grassland, with big upright bell-shaped blue blossoms, native
  from eastern Colorado and Nebraska down to New Mexico and Texas.
scope: The tall meadow wildflower also called bluebell or prairie gentian, not a garden tulip.
examples:
- A tulip gentian grew in the wet grass near the fence.
- Tulip gentians bloomed across the moist meadow in August.
