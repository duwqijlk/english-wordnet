simpleMeaning: a settled way of feeling in which nothing stirs you up and nothing holds your interest
scope: 'Also called indifference: a flat, uncaring way of feeling, not the loss of feeling in part of
  the body.'
examples:
- His numbness toward the news worried his friends.
- Years of dull routine had left her in a state of numbness.
