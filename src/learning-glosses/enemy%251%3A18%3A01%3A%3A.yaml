simpleMeaning: A person who is hostile to another person as an individual.
scope: This is one individual who opposes or dislikes another person, not a soldier in an opposing army
  or a hostile group.
examples:
- The two men had been enemies since their school days.
- She never forgave him and remained his enemy for life.
