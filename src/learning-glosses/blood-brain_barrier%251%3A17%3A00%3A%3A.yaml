simpleMeaning: The body has a guard that stops what moves in the red liquid from reaching the soft matter
  of the head and the cord down the back.
scope: The body has its own guard between the red liquid and the soft matter of the head, keeping what
  moves in the liquid from reaching the head and the cord down the back.
examples:
- The brain was protected from the large molecules of the virus by the blood-brain barrier.
- The virus could not pass the blood-brain barrier to reach the brain.
