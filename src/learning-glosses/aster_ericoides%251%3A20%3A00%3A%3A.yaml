simpleMeaning: A common long-lived plant of North America with many branches, leaves like heath, and small
  star-like white flowers.
scope: Also called a heath aster; a much-branched plant with small white flowers, not a tall plant with
  large yellow flowers.
examples:
- Aster ericoides covered the field with small white star-like flowers.
- The much-branched Aster ericoides has leaves like heath.
