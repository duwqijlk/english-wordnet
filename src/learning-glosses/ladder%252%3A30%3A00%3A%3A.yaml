synsetId: 00335613-v
simpleMeaning: to come undone in a row of stitches, as if the cloth has caught on something
scope: Also called run. This is cloth coming undone after it catches on something, not steps for climbing
  and not the line of loose stitches left behind.
examples:
- Her tights laddered when they caught on the rough chair.
- The thin stocking laddered from a small hole at the heel.
