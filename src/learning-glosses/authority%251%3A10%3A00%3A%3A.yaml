simpleMeaning: A book or other written work that people accept as a reliable source on a subject.
scope: This is a written work that people rely on, not a person who is an expert and not the power to
  give orders.
examples:
- Her history of the city is the standard authority on the period.
- The manual became the authority on engine repair.
