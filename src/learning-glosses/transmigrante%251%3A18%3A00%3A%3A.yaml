simpleMeaning: A Latin American who buys second-hand goods in the United States and carries them back
  to Latin America to sell
scope: A person who buys used goods abroad and sells them at home, not a trader who buys and sells in
  one place and not a migrant worker who moves for work.
examples:
- The transmigrante loaded his van with used fridges bought in Texas.
- Many transmigrantes make a living by reselling goods bought in the United States.
