simpleMeaning: a small moth from India that eats the leaves of coffee plants and of a bush whose leaves
  are dried for a hot drink, among other plants
scope: 'Another name for a tortrix: a small moth from India that eats the leaves of tea and coffee plants,
  not a moth that eats cloth and not a moth that eats grain.'
examples:
- The tea tortrix damaged the leaves on the tea bushes.
- Farmers spray the tea tortrix to save their tea plants.
