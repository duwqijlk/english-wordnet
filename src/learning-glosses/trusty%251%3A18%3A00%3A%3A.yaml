simpleMeaning: a person in prison who is seen as honest and sure to do what is asked of them, and is given
  special rights that others do not get
scope: A person in prison who is given special rights, not the describing word for a person or thing that
  can be believed in.
examples:
- The trusty was allowed to work in the prison office.
- As a trusty, he could move around the prison more freely than the others.
