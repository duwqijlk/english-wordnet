simpleMeaning: One of the largest stretches of the earth's history, each usually split into two or more
  smaller stages.
scope: This is one of the largest units of geological time, not a period of human history or a style of
  art.
examples:
- Dinosaurs lived during the Mesozoic era.
- Scientists divide the history of the earth into several eras.
