simpleMeaning: keeping a dead body from rotting by putting sweet-smelling oils, drugs, and other chemicals
  on it
scope: Keeping a dead body from rotting with oils, drugs, and other chemicals, not burying it at once
  and not freezing it.
examples:
- The embalmment of the body took several hours.
- Embalmment kept the body fresh for the funeral.
