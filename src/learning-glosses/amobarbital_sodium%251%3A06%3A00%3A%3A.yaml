simpleMeaning: Used to calm the body and bring sleep, this salt form of a sleep drug from the barbiturate
  group is made with a soft light metal.
scope: This salt form of a sleep drug from the barbiturate group is also called blue, blue angel, and
  blue devil, and it is not the drug on its own.
examples:
- Before sleep, amobarbital sodium was taken to calm the body.
- A small dose of amobarbital sodium brought sleep.
