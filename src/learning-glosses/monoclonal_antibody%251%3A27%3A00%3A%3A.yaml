simpleMeaning: This kind of germ-fighting bit comes from one line of cells in a lab, with every bit the
  same as the rest.
scope: It is also called monoclonal, one of a class of germ-fighting bits made in a lab from a single
  line of cells.
examples:
- The monoclonal antibody came from a single line of cells grown in the lab.
- Every monoclonal antibody in the batch matched the others.
