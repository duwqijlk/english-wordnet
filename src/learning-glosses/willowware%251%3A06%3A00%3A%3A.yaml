simpleMeaning: Dishes of china with a blue Chinese picture on a white ground, showing a tree with long
  thin hanging branches and often a river
scope: This is dishes of china with a blue Chinese picture on a white ground, showing a tree with long
  thin hanging branches and often a river; willow-pattern is another name for this sense, not plain china
  and not china with a different picture on it.
examples:
- The willowware on the shelf showed a blue tree beside a river.
- She served tea in willowware cups with the blue Chinese picture.
