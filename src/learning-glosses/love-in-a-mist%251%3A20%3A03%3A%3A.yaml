simpleMeaning: Flowers of white or pale blue, and leaves cut into fine strips, mark this plant from Europe,
  grown in gardens
scope: This is the European garden plant with finely cut leaves and white or pale blue flowers, not the
  chickweed of the same name and not a passion flower.
examples:
- She planted love-in-a-mist along the garden path.
- The love-in-a-mist opened pale blue flowers in May.
