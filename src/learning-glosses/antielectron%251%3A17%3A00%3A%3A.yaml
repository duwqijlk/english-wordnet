simpleMeaning: Two tiny bits of matter wipe each other out when this one, which carries a plus charge,
  meets one with a minus charge.
scope: This tiny bit of matter is also called positron, and it carries a plus charge and wipes out a tiny
  bit with a minus charge when the two meet.
examples:
- The antielectron carries a plus charge, the opposite of the tiny bit with a minus charge.
- When an antielectron meets a tiny bit with a minus charge, the two wipe each other out.
