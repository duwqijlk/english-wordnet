simpleMeaning: Strong dark brew and hot milk in equal parts, with cinnamon and nutmeg on top and usually
  whipped cream, make this hot drink
scope: Also called cappuccino and coffee cappuccino, this is a hot drink made from two things in equal
  parts, not from brew alone.
examples:
- She ordered a cappuccino coffee.
- Her cappuccino coffee had whipped cream on top.
