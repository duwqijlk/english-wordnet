simpleMeaning: a plant with long thin pointed fronds, the flat green parts of a fern, that make new roots
  at their tips
scope: 'Also called walking fern: a plant with long thin pointed fronds that root at their tips, not a
  leaf-shaped insect and not a tree.'
examples:
- The walking leaf had rooted at the tip of a long frond.
- A walking leaf grew beside the path, its fronds arching to the ground.
