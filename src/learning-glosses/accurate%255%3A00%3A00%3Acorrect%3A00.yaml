senseId: accurate%5:00:00:correct:00
synsetId: 00634639-s
simpleMeaning: for ideas, pictures, or other ways of showing or saying something, matching fact or truth
  in full and strictly correct
scope: This sense is for ideas, pictures and other ways of showing or saying something that match fact
  or truth in full; exact and precise are other names for this sense, and it is not the wider sense where
  a thing or piece of work is right or almost right by a set rule.
examples:
- She gave an accurate picture of what really happened.
- His words were an accurate copy of the facts.
