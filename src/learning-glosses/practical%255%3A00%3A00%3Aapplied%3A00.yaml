simpleMeaning: that you can use for a real need, or that is in fact used that way
scope: About a thing or subject that has a real use; it is not about a person led by experience rather
  than ideas, and not the wide sense about doing things.
examples:
- She studies practical mathematics for her work as a builder.
- The book shows practical ways to use these sums in shops and homes.
