simpleMeaning: A bad-smelling fungus whose fruiting body first looks like a small puffball, then splits
  open to form a stalk with arms that narrow, bend over and meet at one point.
scope: Also called stinky squid; a bad-smelling fungus whose fruiting body starts like a small puffball
  and then opens into a stalk with arms meeting at one point.
examples:
- Pseudocolus fusiformis pushed up through the leaf litter, smelling strongly.
- The Pseudocolus fusiformis split open, its arms arching to a point.
