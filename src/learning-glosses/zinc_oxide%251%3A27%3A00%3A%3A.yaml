simpleMeaning: A white powder made by joining a metal with oxygen, used to colour things, in skin care,
  glass, inks, and in ointments made from it.
scope: Also called flowers of zinc, philosopher's wool, and philosophers' wool, this white powder colours
  things and goes into skin care, glass, inks, and ointments.
examples:
- The painter mixed zinc oxide into the white paint.
- She rubbed zinc oxide cream onto her skin.
