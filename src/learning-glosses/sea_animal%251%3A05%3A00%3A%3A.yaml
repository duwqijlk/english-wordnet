simpleMeaning: The ocean holds many kinds of living things, such as fish, soft-bodied creatures, and many
  mammals.
scope: A marine animal, a marine creature, and a sea creature are other names for one of these kinds of
  living things in the ocean.
examples:
- A sea animal moved through the ocean.
- Many sea animals live in the ocean.
