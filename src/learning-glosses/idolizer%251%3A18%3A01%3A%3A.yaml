simpleMeaning: this person thinks so highly of someone they love that every fault goes unseen
scope: A person who thinks so highly of someone they love that every fault goes unseen, also called an
  idoliser; not a calm admirer and not a critic.
examples:
- An idolizer of the team captain, he defended every mistake she made.
- The idolizer wrote long letters praising the actor as if he were flawless.
