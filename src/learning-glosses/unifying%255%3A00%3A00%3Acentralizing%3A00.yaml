simpleMeaning: tending to bring people or things together into one whole
scope: This describes something that brings people or parts together as one; it is not about splitting
  them apart or keeping them apart.
examples:
- The new leader was a unifying force in the country.
- The song had a unifying effect on the whole crowd.
