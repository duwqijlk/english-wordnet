simpleMeaning: A few kinds of Fortunella bush or tree yield small edible orange fruits that are thick-skinned,
  sweet outside and sour within.
scope: The Fortunella tree or shrub that bears small orange fruit, also called cumquat or kumquat tree;
  not the fruit itself.
examples:
- The kumquat in the back garden produced a heavy crop.
- The kumquat is a small citrus tree that can grow in a pot.
