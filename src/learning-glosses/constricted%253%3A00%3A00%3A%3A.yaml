simpleMeaning: pulled in tight or squeezed, in the body or in how a person thinks
scope: Something pulled in tight or squeezed, in the body or in how a person thinks; not merely narrow,
  and not closed off.
examples:
- The constricted blood vessel slowed the flow of blood.
- He had a constricted view of life and feared all change.
