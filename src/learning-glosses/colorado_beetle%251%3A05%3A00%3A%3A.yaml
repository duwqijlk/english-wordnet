simpleMeaning: A black-and-yellow bug that eats leaves as a grown bug and as a grub; first of the east
  Rocky Mountains, now found all over the world.
scope: Also called potato beetle, potato bug, Colorado potato beetle and Leptinotarsa decemlineata, this
  is a black-and-yellow bug of potato leaves, not the ladybird that eats greenfly.
examples:
- The Colorado beetle eats potato leaves.
- Colorado beetles spread worldwide from the Rockies.
