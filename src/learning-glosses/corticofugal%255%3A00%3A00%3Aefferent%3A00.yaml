simpleMeaning: of a nerve thread that carries signals out from the outer layer of the brain
scope: Of a nerve thread that carries signals out from the outer layer of the brain; corticifugal and
  corticoefferent are other names for this sense, not a thread that carries signals into the brain, and
  not a thread in the spine.
examples:
- The corticofugal fibres carry signals out from the outer layer of the brain.
- A corticofugal nerve thread runs outward from the cortex.
