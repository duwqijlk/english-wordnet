simpleMeaning: weather wears down minerals rich in aluminium, like feldspar, into a fine clay that is
  usually white, used to make pots, soak up liquids, and fill things such as paper
scope: 'Also called china clay, china stone, kaolin, kaoline, and terra alba: the soft raw clay used for
  pots, not the hard fired ware called porcelain.'
examples:
- The potter mixed porcelain clay with water.
- Porcelain clay keeps the paper smooth and white.
