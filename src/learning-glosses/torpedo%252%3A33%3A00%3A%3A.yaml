simpleMeaning: to attack or hit something with a long weapon that moves under water by itself and blows
  up when it hits
scope: This is the action of attacking with torpedoes, not the underwater weapon itself and not the bomb
  used in an oil or gas well.
examples:
- The submarine torpedoed the enemy ship at night.
- Their boat torpedoed the ship and sank it.
