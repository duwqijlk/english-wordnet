simpleMeaning: talk or writing that makes no sense and cannot be understood at all
scope: 'Also called incoherency and unintelligibility: talk or writing with no clear sense that cannot
  be understood, not a clear idea that is hard to agree with.'
examples:
- After the long illness, his speech fell into incoherence.
- The letter was full of incoherence and no one could follow it.
