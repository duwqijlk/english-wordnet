simpleMeaning: This drug can clear the gut of the small worms living inside it
scope: Also called vermifuge, anthelminthic, and helminthic, this is the drug itself, not the power to
  expel worms.
examples:
- The vet gave the dog an anthelmintic for the worms in its gut.
- The dog took an anthelmintic to clear the worms from its gut.
