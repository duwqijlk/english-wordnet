simpleMeaning: A nerve cell that carries signals inward to the brain or the cord down the back
scope: 'Also called an afferent neuron: a nerve cell that carries signals inward to the brain or the cord
  down the back, not a nerve cell that carries orders outward to muscles and not a nerve cell that only
  joins other nerve cells.'
examples:
- A sensory neuron carries the touch signal to the brain.
- When you burn a finger, a sensory neuron sends the message inward.
