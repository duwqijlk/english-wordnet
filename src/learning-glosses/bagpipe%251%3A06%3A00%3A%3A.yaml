simpleMeaning: A musical instrument made of pipes; the player blows air into a bag and squeezes it out
  through the drone (a pipe that makes a low sound)
scope: An instrument played by blowing air into a bag and squeezing it out through pipes; not a flute
  or a trumpet, which have no bag.
examples:
- A man played the bagpipes at the wedding.
- The sound of the bagpipe filled the whole street.
