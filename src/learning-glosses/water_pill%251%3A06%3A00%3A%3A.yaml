simpleMeaning: Any stuff that tends to make the body pass more urine, so it gets rid of extra liquid.
scope: Any stuff that tends to make the body pass more urine; diuretic and diuretic drug are other names
  for this sense, not a pill for sleep and not a pill for pain.
examples:
- The doctor gave her a water pill to make her body pass more urine.
- A water pill helps the body get rid of extra liquid.
