simpleMeaning: make someone feel that they must do something for you, or that they owe you something
scope: This is about creating a duty or a debt of gratitude, not about owning an object or a right.
examples:
- She held him to his promise to visit every summer.
- The old man was held by a debt of gratitude he could never repay.
