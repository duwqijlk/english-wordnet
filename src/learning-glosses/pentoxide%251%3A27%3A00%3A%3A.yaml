simpleMeaning: Something made with oxygen that holds five bits of oxygen in each tiny piece of it.
scope: A substance made with oxygen that holds five bits of oxygen in each tiny piece, not a substance
  with four bits of oxygen and not a substance with no oxygen at all.
examples:
- The new pentoxide has five bits of oxygen in each tiny piece.
- A pentoxide holds five oxygen bits in each tiny piece.
