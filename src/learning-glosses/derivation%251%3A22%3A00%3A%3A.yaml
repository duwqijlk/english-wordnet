simpleMeaning: In the study of how language works, the way new words are made from old words or word parts
  by adding bits to their front or end.
scope: In the study of language, the making of new words by adding bits to old ones, not the origin of
  a word and not a line of reasoning.
examples:
- Derivation turns 'sing' into 'singer' by adding '-er'.
- '''Undo'' from ''do'' is a clear case of derivation.'
