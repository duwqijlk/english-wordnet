simpleMeaning: A part of a hospital with special tools to look after newborn babies born too soon or very
  sick.
scope: Also called neonatal intensive care unit; a part of a hospital for newborn babies who are very
  sick or born too soon, not an ordinary baby room.
examples:
- The baby spent her first week in the NICU.
- Nurses in the NICU watch the smallest babies day and night.
