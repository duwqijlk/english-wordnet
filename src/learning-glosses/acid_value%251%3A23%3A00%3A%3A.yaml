simpleMeaning: In chemistry, found by the milligrams of potassium hydroxide needed to cancel it out, it
  is a measure of how much loose sour chemical a fat holds
scope: In chemistry, it is found by the milligrams of potassium hydroxide needed to cancel out the loose
  sour chemical in a fat, not a measure of how much fat there is.
examples:
- As the fat aged, the acid value rose.
- The lab checked the acid value of the old oil.
