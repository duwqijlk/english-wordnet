simpleMeaning: To put words on something by writing, cutting, or printing, so they stay there for a long
  time
scope: To put words on something by writing, cutting, or printing, so they stay there for a long time;
  not to sign your name, not to address a book to someone, and not to sign up as a member.
examples:
- The names of the dead were inscribed on the stone wall.
- He inscribed the date on the back of the medal so it would not be forgotten.
