simpleMeaning: a paper wrap that goes round the outside of a book, usually with words on it that praise
  the book and tell people what is in it
scope: 'Also called a book jacket, a dust jacket, and a dust wrapper: a paper wrap round a book, not a
  plastic sheet put over a machine.'
examples:
- The dust cover of the novel had a bright picture of a ship on it.
- She read the words on the dust cover to find out what the book was about.
