simpleMeaning: In geology, a split in the earth's outer layer where one side has moved relative to the
  other.
scope: A geological break — break is another name for this sense — not a change, a work period, or a gear
  change.
examples:
- Geologists mapped a shift in the crust beneath the valley.
- The road bends where a shift in the rock brings older layers to the surface.
