simpleMeaning: a small tree of high ground in the eastern United States, in the Appalachians, with needles
  in pairs, dark brown flaking bark, and cones with sharp-tipped scales
scope: 'Also called prickly pine and table-mountain pine: a small pine of high ground in the eastern United
  States, not a hickory tree and not a lowland pine.'
examples:
- The hickory pine grows on the high slopes of the Appalachians.
- We saw a hickory pine with dark brown bark peeling off in flakes.
