simpleMeaning: the part of a lock that a key moves into place or pulls back
scope: This is the moving part of a lock, worked by a key. It is not a screw and nut, not the bar in a
  gun, and not lightning.
examples:
- Turn the key and the bolt slides into place.
- The bolt would not move, so the door stayed locked.
