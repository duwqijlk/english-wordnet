simpleMeaning: a Chinese herb with leaves made of leaflets that spread out from one point, small greenish
  flowers, and forked roots that smell sweet and are thought to heal sickness
scope: 'Also called ginseng: a Chinese herb whose forked roots are thought to heal, not a common garden
  herb and not a medicine made in a factory.'
examples:
- The farmer dug up nin-sin roots to dry for medicine.
- Nin-sin grows in cool woods, with small greenish flowers in summer.
