simpleMeaning: either of two lumps of lymphatic tissue, soft tissue that helps the body fight sickness,
  one on each side of the back of the mouth and throat
scope: Either of two lumps of soft tissue, one on each side of the back of the mouth and throat, also
  called a tonsil, a faucial tonsil and a palatine tonsil; not a lump in the neck, and not a growth in
  the nose.
examples:
- The doctor looked at the tonsilla on each side of her throat.
- His tonsilla was sore, so swallowing hurt.
