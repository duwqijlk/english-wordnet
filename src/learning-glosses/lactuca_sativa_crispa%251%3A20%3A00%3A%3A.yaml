simpleMeaning: A leaf lettuce known by leaves that are curled or cut in, making a loose round bunch that
  never forms a tight head.
scope: A leaf lettuce with curled or cut-in leaves in a loose bunch, also called leaf lettuce; its near
  kin are other lettuces, such as head lettuce, which forms a tight head.
examples:
- Lactuca sativa crispa has curled leaves in a loose rosette.
- We grow Lactuca sativa crispa for its leaves.
