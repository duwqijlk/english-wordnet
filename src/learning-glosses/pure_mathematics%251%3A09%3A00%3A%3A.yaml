simpleMeaning: The study of numbers and shapes looks into its first rules just to know them, not to put
  them to use right away.
scope: This is the study of numbers and shapes for its own sake, not the kind that solves a job at hand.
examples:
- The book on pure mathematics sets out the first rules of numbers and shapes for their own sake.
- In pure mathematics, the first rules of numbers and shapes are studied without asking what they can
  be used for.
