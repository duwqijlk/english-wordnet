simpleMeaning: a quick change in how bright something is, a short spark or flash of light
scope: A quick change in brightness, a short flash; sparkling and twinkle are other names for this sense.
  Not the twinkling of stars in the sky and not a flash made inside a glowing material in physics.
examples:
- The scintillation of the candle flame caught her eye.
- We watched the scintillation of the lights on the water.
