simpleMeaning: a fairly tall oak of the south-east of the United States that loses its leaves in winter,
  often grown to give shade, and does well in wet soil
scope: 'Also called a water oak: a tall oak of the south-east that loses its leaves, not a live oak that
  keeps them.'
examples:
- A possum oak shades the front yard.
- Possum oaks grow well in the wet ground by the creek.
