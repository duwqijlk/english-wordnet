simpleMeaning: In the United States, a measure for things that are not wet, holding half a quart, or 33.6
  cubic inches.
scope: 'Also called pint: a measure for things that are not wet, not the liquid measure of the same name
  and not a cup.'
examples:
- The recipe called for a dry pint of blueberries.
- She bought a dry pint of strawberries at the market.
