simpleMeaning: any very bad illness of the mind in which a person cannot tell what is real or sees what
  is real in a very wrong way
scope: This is a very bad illness of the mind where a person cannot tell what is real, not mild worry
  or sadness and not a body illness.
examples:
- His psychosis made him hear voices that were not there.
- She stayed in hospital while doctors treated her psychosis.
