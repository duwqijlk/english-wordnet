simpleMeaning: a fit of an illness or similar condition that comes on suddenly and cannot be controlled.
scope: This is a fit of illness, not a physical assault or the start of chemical damage.
examples:
- He had a severe asthma attack in the middle of the night.
- She felt an anxiety attack coming on before the interview.
