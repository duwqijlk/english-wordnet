simpleMeaning: Now and then a tinge of yellow shows in this bright colour of blood, whose shade shifts
  while it stays strong
scope: A bright red that can change, also called scarlet and vermilion; not a red that never changes and
  not a plain orange.
examples:
- The paint was an orange red that looked brighter in the sun.
- She chose an orange red for the cover of the book.
