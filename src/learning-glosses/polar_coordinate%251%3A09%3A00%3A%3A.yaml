simpleMeaning: Either of two numbers that fix a spot on a flat face, by its distance from a set post and
  its angle from a set line through the post
scope: Either of two numbers that fix a spot on a flat face, by its distance from a set post and its angle
  from a set line through the post; not a pair of numbers on a grid and not a single number.
examples:
- The polar coordinate told us where the ship lay.
- Use a polar coordinate to mark the spot on the chart.
