simpleMeaning: Working out broad rules from facts looked at in close detail.
scope: 'Also called induction: working out broad rules from facts looked at in close detail, not the forming
  of broad ideas from what cases have in common, not the carrying over of a learned response to a similar
  stimulus, and not an idea or conclusion with general application.'
examples:
- Her generalization moved from three small facts to a broad rule.
- The generalization from detailed facts to broad rules needs care.
