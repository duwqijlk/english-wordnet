simpleMeaning: A day twelve days after Christmas, kept to mark the visit of the three wise men to the
  baby Jesus.
scope: A feast day twelve days after Christmas marking the visit of the three wise men, also called Epiphany,
  Epiphany of Our Lord, Three Kings' Day and Twelfth day, among other Christian feast days.
examples:
- January 6 falls twelve days after Christmas.
- On January 6 the church marks the visit of the three wise men.
