simpleMeaning: To show a vein, a dye that shows up clearly on the picture is put into it, and a picture
  is then made with X rays.
scope: Also called a venogram, it shows a vein on an X-ray picture after a dye has been put into it.
examples:
- A phlebogram showed the vein after the dye was put into it.
- They made a phlebogram with X rays.
