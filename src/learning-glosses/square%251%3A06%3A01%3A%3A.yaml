simpleMeaning: Any made object shaped like a flat figure with four equal sides and four corners of ninety
  degrees.
scope: This is a physical object with that four-sided shape, such as a tile or a space on a board, not
  the abstract figure in geometry and not the builder's tool.
examples:
- Each square on the checkerboard was painted a different color.
- The quilt is sewn from small squares of bright cloth.
