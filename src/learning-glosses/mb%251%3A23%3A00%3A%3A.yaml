simpleMeaning: One thousand twenty-four kibibytes make up this measure of how much data, or one million
  forty-eight thousand five hundred seventy-six bytes.
scope: Also called megabyte, mebibyte, M and MiB, this is a measure of data equal to one thousand twenty-four
  kibibytes, not the smaller measure equal to one thousand kilobytes.
examples:
- The file takes up one MB of space.
- One MB holds one thousand twenty-four kibibytes.
