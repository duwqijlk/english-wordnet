simpleMeaning: This makes a person seem guilty or to blame
scope: This is evidence or words that point to guilt; criminative, criminatory and incriminating are other
  names for this sense. Not proof that clears a person and not a mere guess.
examples:
- The incriminatory testimony placed him at the scene that night.
- She found the incriminatory letter hidden in the drawer.
