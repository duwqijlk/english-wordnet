simpleMeaning: From animal parts such as bones and skin comes this sticky protein, with no colour, that
  dissolves in water.
scope: Also called gelatin, this protein from animal parts such as bones and skin has no colour and dissolves
  in water.
examples:
- She dissolved gelatine in warm water.
- She stirred gelatine into the water until it dissolved.
