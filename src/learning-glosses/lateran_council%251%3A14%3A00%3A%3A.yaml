simpleMeaning: Any of five meetings of the whole Western Catholic Church held in the palace they are named
  for
scope: One of the five meetings of the whole Western Catholic Church held in the palace they are named
  for, not other church councils held elsewhere and not the palace itself.
examples:
- The Fourth Lateran Council met in 1215.
- Five Lateran Councils were held in the Lateran Palace.
