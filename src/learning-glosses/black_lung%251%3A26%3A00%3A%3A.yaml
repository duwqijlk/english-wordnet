simpleMeaning: a sickness of the breathing organs that comes from breathing in dust from coal
scope: 'Also called anthracosis, black lung disease, and coal miner''s lung: a sickness of the breathing
  organs from coal dust, not a sickness from smoking or from breathing in other dust.'
examples:
- After years in the mine, he was found to have black lung.
- Doctors warned the miners that black lung comes from breathing coal dust day after day.
