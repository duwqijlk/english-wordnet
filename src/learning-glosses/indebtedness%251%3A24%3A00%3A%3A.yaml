senseId: 'indebtedness%1:24:00::'
synsetId: 13804245-n
simpleMeaning: The state of owing someone thanks or help because they did you a service or a kindness.
scope: The state of owing thanks or help for a service or kindness, also called obligation; not a debt
  of money.
examples:
- He felt a deep indebtedness to the doctor who saved his life.
- Her indebtedness to her teacher lasted long after she left school.
