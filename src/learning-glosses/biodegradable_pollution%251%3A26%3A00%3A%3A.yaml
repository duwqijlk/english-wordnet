simpleMeaning: Made harmless by the work of nature, this dirty stuff does no lasting harm.
scope: This dirty stuff is made harmless by the work of nature, so it does no lasting harm, not dirty
  stuff that stays harmful for good.
examples:
- Leaves in the stream are biodegradable pollution, made harmless by nature.
- The biodegradable pollution in the stream broke down and left the water clean.
