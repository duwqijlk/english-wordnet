simpleMeaning: a trained worker paid to tell whether a young farm bird just out of the egg is male or
  female
scope: A trained worker paid to tell whether a young farm bird just out of the egg is male or female;
  chicken sexer is another name for this sense, not a farmer who raises birds and not a vet who treats
  them.
examples:
- The chick sexer sorted the hatchlings by sex.
- A chick sexer can tell males from females at a glance.
