simpleMeaning: in a way that shows you are puzzled and do not fully understand something
scope: 'Also called quizzically: this means in a puzzled way, not in a curious way that only wants to
  know more.'
examples:
- She raised her eyebrows questioningly when she heard the strange answer.
- He smiled questioningly, not sure what the joke meant.
