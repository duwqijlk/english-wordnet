simpleMeaning: a white powder that does not dissolve in water and stops X-rays, used to add colour to
  paint
scope: 'Also called barium sulfate and blanc fixe: a white powder used to colour paint, not the white
  mineral that is the main source of barium.'
examples:
- The artist added barium sulphate to the paint for a bright white.
- Barium sulphate gives the paint a clean white colour.
