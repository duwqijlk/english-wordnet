senseId: 'meiosis%1:10:00::'
synsetId: 07118958-n
simpleMeaning: saying less than you mean, for effect, above all by denying the opposite of what you mean
scope: Saying less than you mean, for effect; litotes is another name for this sense, not the splitting
  of cells in making eggs and sperm, and not saying more than you mean.
examples:
- Saying 'I was not a little upset' when you mean 'I was very upset' is meiosis.
- The speaker used meiosis, saying less than she meant, to make her point hit harder.
