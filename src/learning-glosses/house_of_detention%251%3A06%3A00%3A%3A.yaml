schema: oewn-learning-gloss-v2
senseId: 'house_of_detention%1:06:00::'
synsetId: 03186333-n
simpleMeaning: A place where young people who have broken the law can be kept for a short time, usually
  watched over by a court for young people
scope: This is a place where young offenders are kept for a short time, usually under a court for young
  people; detention camp, detention home and detention house are other names for this sense, not a prison
  for adults and not a school.
examples:
- The boy was sent to a house of detention until his court date.
- The house of detention held young offenders for a short time.
