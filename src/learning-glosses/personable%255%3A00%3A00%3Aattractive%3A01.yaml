simpleMeaning: of people, nice to look at and nice in the way they act and speak
scope: 'This sense joins both parts for people: nice to look at and nice in how they act, not good looks
  alone or a kind way alone.'
examples:
- With his warm smile and easy way of talking, he is a very personable man.
- She is personable, neat in how she looks and friendly with everyone she meets.
