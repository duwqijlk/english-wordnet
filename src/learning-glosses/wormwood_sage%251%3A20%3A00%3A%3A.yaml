simpleMeaning: Tawny blooms crown a plant of the dry northern parts of the world that lives year after
  year, its leaves soft and silky with a strong smell.
scope: This is a plant of the dry northern parts of the world, also called prairie sagewort, known by
  its soft silky leaves, its strong smell, and its tawny blooms.
examples:
- The wormwood sage showed its tawny blooms.
- The wormwood sage grows with soft silky leaves and a strong smell.
