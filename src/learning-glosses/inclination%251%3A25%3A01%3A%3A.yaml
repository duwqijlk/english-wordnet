simpleMeaning: In geometry, the angle between the x-axis and a line, measured against the clock from the
  right half of the x-axis
scope: In geometry, an angle from the x-axis to a line, not a liking for something and not the tilt of
  a surface.
examples:
- The inclination of the line was thirty degrees.
- Find the inclination of the line on the graph.
