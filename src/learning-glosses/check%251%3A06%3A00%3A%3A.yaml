simpleMeaning: a pattern on cloth, made of squares or of lines that cross one another, like the board
  used in the game of draughts
scope: Not the cloth itself, and not a single mark placed beside an item.
examples:
- He wore a jacket in a bold red and black check.
- The curtains had a small blue check running through them.
