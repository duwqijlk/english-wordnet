simpleMeaning: a small night mammal like a mouse, with wings of thin skin on its front legs, that finds
  its way by listening to sounds that bounce back
scope: A small night animal with thin skin wings, not the wooden stick used to hit a ball in games.
examples:
- A bat flew out of the cave at dusk and hunted insects in the dark.
- We watched bats hang upside down in the old barn during the day.
