simpleMeaning: To treat sickness, people use plants or the juices taken from them, most of all plants
  that are not part of what they eat
scope: 'Also called botanical medicine and herbal therapy: healing with plants, not with drugs made in
  a factory and not with food plants eaten as part of a meal.'
examples:
- She chose phytotherapy to treat her sore knee with plants.
- The clinic offers phytotherapy alongside its other treatments.
