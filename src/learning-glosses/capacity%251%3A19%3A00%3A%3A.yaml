simpleMeaning: The storing of electric charge in a system.
scope: This is electric charge building up and being held, not how much a container holds or how many
  bytes a disk stores.
examples:
- The capacitor's capacity determines how much charge it can hold at a given voltage.
- Engineers measured the capacity of the circuit after adding the insulator.
