simpleMeaning: How the weather changes the way the body works, such as making sore joints hurt more
scope: How the weather changes the way the body works, not the weather itself and not a sickness caused
  by the weather.
examples:
- Her meteortropism means her knees ache before it rains.
- Doctors study meteortropism to learn why joint pain grows worse in damp weather.
