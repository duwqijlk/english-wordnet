simpleMeaning: taking a ship or plane by force away from the people who have the legal right to control
  it, on the open sea or in a similar setting
scope: Taking a ship or plane by force, also called buccaneering; not copying films or music without paying,
  and not theft on land in the usual way.
examples:
- The navy fought piracy on the high seas.
- Air piracy forced the plane to land in another country.
