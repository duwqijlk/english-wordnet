simpleMeaning: A drug taken by mouth, sold under this trade name, that lowers the level of cholesterol
  in the blood, used when changes in diet have not worked well enough
scope: This is a drug taken by mouth that lowers blood cholesterol, used when diet changes have not worked;
  lovastatin is another name for this sense.
examples:
- The doctor gave her Mevacor to lower her cholesterol.
- Mevacor is taken by mouth when diet changes have not worked.
