simpleMeaning: to send something by using a special machine that sends copies of papers from one place
  to another
scope: This is the act of sending a paper copy with such a machine. It is not the machine itself, and
  not making a copy in the same room.
examples:
- Can you facsimile the signed report to our office today?
- He facsimiled the form to the bank this morning.
