simpleMeaning: The flesh of the blood-pumping organ in the chest, made to keep squeezing in a steady beat.
scope: The flesh of the blood-pumping organ, made to keep squeezing in a steady beat, also called cardiac
  muscle; not the flesh of the arm and not the flesh of the leg.
examples:
- The heart muscle squeezes blood out with every beat.
- Damage to the heart muscle can weaken the whole organ.
