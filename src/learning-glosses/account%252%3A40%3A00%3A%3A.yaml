simpleMeaning: To keep a record of something, such as money paid and received or amounts that change.
scope: This is the old bookkeeping verb for keeping a record of sums, what comes in and goes out. It is
  rare in modern English, which usually says 'keep account of' or 'keep records'; it is not 'account for',
  which means to explain or justify something, and it is not the noun for a statement of transactions
  and its balance.
examples:
- The clerk accounted every sale in the ledger by hand.
- The steward accounted the stores at the end of each month.
