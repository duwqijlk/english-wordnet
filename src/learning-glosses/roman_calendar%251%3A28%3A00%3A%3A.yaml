simpleMeaning: The moon-based year plan used in old Rome, later replaced by the Julian year plan in 46
  BC.
scope: The moon-based year plan of ancient Rome, later replaced by the Julian calendar, not the modern
  Gregorian calendar or a church calendar.
examples:
- The Roman calendar followed the phases of the moon.
- The Roman calendar gave way to the Julian calendar in 46 BC.
