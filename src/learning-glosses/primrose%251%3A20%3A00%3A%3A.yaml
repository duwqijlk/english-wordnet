simpleMeaning: any of many short-stemmed plants in the Primula group, with leaves in a bunch at the base
  and bright flowers in flat-topped or round groups
scope: This plant, also called primula, has short stems and bright flowers in round groups; it is not
  any plant with bright flowers.
examples:
- The primrose opened its yellow flowers in early spring.
- Primroses grew in a bunch at the edge of the garden.
