simpleMeaning: for a mine or oil well, drilled in a place not yet known to give anything of value, in
  the hope of finding some
scope: For a mine or oil well dug as a test in a place not yet known to be useful; not the cat animal
  and not a business plan outside fair rules.
examples:
- They drilled a wildcat well in the desert, hoping to find oil.
- A wildcat mine was opened far from the known gold fields.
