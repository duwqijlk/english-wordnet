simpleMeaning: a horse that is light brown or gold in color, with hair on its neck and a tail that are
  pale cream or white
scope: A horse with a light gold body and pale cream or white neck hair and tail. Not just a color, and
  not a horse of a different color.
examples:
- She rode a palomino with a white tail across the field.
- The palomino stood out among the dark brown horses.
