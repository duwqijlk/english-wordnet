simpleMeaning: One on each side of the lower jaw, this spit gland sends its spit into the mouth under
  the tongue and makes most of the spit made at night.
scope: 'Also called mandibular gland, submandibular gland, submandibular salivary gland, and submaxillary
  salivary gland: a spit gland in the lower jaw, on both sides of the mouth.'
examples:
- The submaxillary gland swelled and made it hard to swallow.
- Most of the saliva made at night comes from the submaxillary glands.
