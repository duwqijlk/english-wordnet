simpleMeaning: A small tight knot of tiny blood tubes in the part of the kidney that makes urine, which
  cleans the blood while urine forms
scope: A small knot of tiny blood tubes in the kidney that cleans blood, not a blood tube in the arm and
  not the tube that carries urine out.
examples:
- The glomerulus filters blood in the kidney.
- Damage to the glomerulus can stop the kidney from cleaning the blood.
