simpleMeaning: A state of the body in which a woman shows the signs of carrying a child but is not carrying
  one.
scope: A state of the body in which a woman shows the signs of carrying a child but is not carrying one,
  not a real pregnancy and not a stomach upset.
examples:
- The doctor said it was a false pregnancy, not a real one.
- A false pregnancy can bring all the usual signs.
