simpleMeaning: a wild and exciting thing that someone does, which may or may not break the law
scope: 'Also called an adventure: a wild and exciting thing someone does, not a safe, everyday act.'
examples:
- Their midnight escapade ended with a swim in the lake.
- He told us about his escapade of driving across the country with no money.
