simpleMeaning: the act or fact of putting one thing between or among others
scope: The act or fact of putting one thing between or among others, not a policy toward other countries
  and not care given to help someone who is ill.
examples:
- The intervention of a wall divided the garden.
- His intervention between the two men stopped the fight.
