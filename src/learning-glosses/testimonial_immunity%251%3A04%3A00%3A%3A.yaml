simpleMeaning: 'Forced words, and what they lead to, cannot be used against the witness, who need no longer
  fear them: an exemption replaces the right not to speak against oneself.'
scope: 'Also called use immunity: an exemption that takes the place of the right not to speak against
  oneself, so forced words cannot be used against the witness.'
examples:
- The court gave her testimonial immunity so she would speak.
- With testimonial immunity, his words could not be used against him.
