simpleMeaning: air around you that is hard to see through because a cloud of some thing hangs in it
scope: Air that is hard to see through because of a cloud in it, also called fog, fogginess and murkiness;
  not darkness alone when the air is clear.
examples:
- We drove slowly through the murk, barely able to see the road ahead.
- A thick murk hung over the river in the early morning.
