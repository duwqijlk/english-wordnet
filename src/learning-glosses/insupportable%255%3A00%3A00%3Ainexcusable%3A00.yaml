simpleMeaning: That no reason can back up or make sense of.
scope: That no reason can back up, also called indefensible, unwarranted, and unjustifiable; not a claim
  that merely lacks proof.
examples:
- Her insupportable excuse fooled no one in the room.
- The insupportable charges were thrown out by the judge.
