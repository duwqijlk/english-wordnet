simpleMeaning: a frame with sides all around it that you can move from place to place, where babies can
  be left to play
scope: 'Also called a pen: a frame you can move, where babies play, not a pen for writing and not a small
  field for farm animals.'
examples:
- She put the baby in the playpen while she made tea.
- The playpen was full of soft toys for the twins.
