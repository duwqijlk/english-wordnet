simpleMeaning: a strong bright red color that can change a little and sometimes has a touch of orange
  in it
scope: 'Also called scarlet: this is the name of the color itself, not the word for a thing that has this
  color, and not the act of giving something this color.'
examples:
- He chose vermilion for the cover of his book.
- Vermilion is a brighter red than the color of bricks.
