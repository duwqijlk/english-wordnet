simpleMeaning: The use of strong magnets that make the tiny charged bits in atoms give off signs, to make
  pictures showing how many of those bits are in each spot.
scope: 'Also called magnetic resonance imaging: it makes pictures from the signs that the tiny charged
  bits in atoms give off under strong magnets, and the pictures show how many of those bits are in each
  spot.'
examples:
- The doctor ordered an MRI of her knee.
- An MRI showed the tear in the muscle.
