simpleMeaning: A plant with leaves in threes, from Ireland, with yellowish flowers, often held to be the
  true first shamrock
scope: A plant with leaves in threes, from Ireland, with yellowish flowers, often held to be the true
  first shamrock, also called shamrock and lesser yellow trefoil; not the other sense of this plant, a
  low herb of Europe.
examples:
- Hop clover grows wild in the Irish fields.
- The hop clover's yellowish flowers mark it out from other low plants.
