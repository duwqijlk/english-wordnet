simpleMeaning: In music, the written marks that show one set of beats that is played again and again as
  the same pattern
scope: Also called bar. This is one set of beats in music, shown in writing, not a tool with marks for
  size and not a pot that holds a set amount.
examples:
- The song has four beats in each measure.
- She counted the measures before her part came in.
