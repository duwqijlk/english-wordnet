simpleMeaning: Any of a group of Indic languages spoken in Kashmir, in east Afghanistan and in north Pakistan.
scope: Not another Indic group such as Hindi; also called Dardic and Dardic language.
examples:
- Dard languages are spoken in Kashmir.
- Dard tongues are heard in Kashmir and nearby lands.
