simpleMeaning: showing a false pride, and thinking you are much more important than you really are
scope: 'Also called swollen, vain, conceited and egotistic: thinking you matter far more than you do.
  It is not earned pride in good work, and not the sense about caring only for yourself.'
examples:
- His egotistical talk about his own success bored everyone at dinner.
- She gave an egotistical speech and never thanked her team.
