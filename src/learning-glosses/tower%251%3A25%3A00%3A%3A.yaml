simpleMeaning: any tall narrow mass or shape that looks like a column or pillar
scope: This is the resemblance sense, a tall narrow mass such as smoke or powder, also called a column
  or pillar, not a built structure and not the verb meaning to stand high.
examples:
- A tower of dust rose above the horizon as the herd moved on.
- The narrow tube held a tower of fine white powder.
