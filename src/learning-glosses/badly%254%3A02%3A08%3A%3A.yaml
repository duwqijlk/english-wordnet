senseId: 'badly%4:02:08::'
synsetId: 00012748-r
simpleMeaning: with more pain, anger, or sorrow than usual, in a way that shows strong feelings
scope: This sense is about how strongly a person feels pain, anger or sorrow. It is not doing something
  in a poor way, not needing something very much, and not something working against a person.
examples:
- She took her father's death badly.
- They took their defeat badly and could not hide their feelings.
