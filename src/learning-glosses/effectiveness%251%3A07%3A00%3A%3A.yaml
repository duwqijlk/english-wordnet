simpleMeaning: the power to get something done, and the power to bring about an effect
scope: The power to get something done, or the power to bring about an effect; not the strong effect of
  a drug or drink on the body.
examples:
- The effectiveness of the new law was soon clear.
- They questioned the effectiveness of the plan.
