simpleMeaning: So puzzled by many things that do not agree with each other that you cannot think clearly
scope: Feeling lost and unable to think clearly when things do not agree, also called lost, confused and
  bewildered; not just surprised and not just unsure.
examples:
- She was baffled by the strange instructions.
- The baffled student could not follow the lesson.
