simpleMeaning: to make someone feel a little angry and trouble them, especially by small things
scope: 'Also called bother, rag and irritate: to make someone feel a little angry by small things, not
  to hurt someone in a big way.'
examples:
- The loud clock annoyed him all through the night.
- Mosquitoes kept annoying her while she tried to sleep.
