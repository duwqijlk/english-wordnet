simpleMeaning: A yellowwood tree of eastern North America, found widely there, with brittle wood and leaves
  and bark that smell sweet, giving the oil taken from it.
scope: Also called a sassafras tree; the tree itself, not the dried root bark taken from it.
examples:
- A sassafras grew at the edge of the wood.
- They cut sassafras for its sweet-smelling bark.
