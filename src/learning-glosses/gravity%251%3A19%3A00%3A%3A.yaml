simpleMeaning: In physics, the pull between all things that have mass, especially the pull of the earth
  on things near it
scope: In physics, the pull between masses, especially the earth's pull; not heaviness in a general sense
  and not a solemn manner.
examples:
- The more remote the body, the less the gravity.
- Gravity keeps the moon circling the earth.
