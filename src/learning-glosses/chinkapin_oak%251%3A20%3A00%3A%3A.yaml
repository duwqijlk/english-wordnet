simpleMeaning: a mid-sized tree that loses its leaves, from the eastern United States, that gives strong
  wood that lasts
scope: A mid-sized tree that loses its leaves, from the eastern United States, that gives strong wood
  that lasts; chinquapin oak is another name for this sense, not any other oak and not a pine.
examples:
- The chinkapin oak gave strong wood for the barn.
- A chinkapin oak grew at the edge of the wood.
