schema: oewn-learning-gloss-v2
senseId: 'histoincompatibility%1:26:00::'
synsetId: 13998739-n
simpleMeaning: The body of one person will not accept a piece of flesh moved to it from another person
scope: A mismatch between two people's body parts that stops a move of flesh from one to the other, not
  a bad reaction to a drug and not the body turning on itself.
examples:
- Histoincompatibility meant the skin moved from her brother would not take.
- The doctors tested for histoincompatibility before the transplant.
