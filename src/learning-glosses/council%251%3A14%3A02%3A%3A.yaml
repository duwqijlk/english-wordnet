simpleMeaning: in Christianity, a gathering of theologians, bishops, and other delegates from different
  churches or church districts, called to settle matters of church order or belief
scope: This is the church gathering that settles doctrine, not an administrative body such as a student
  or city one, and not a general meeting called to consult.
examples:
- The council met in the fourth century to settle the wording of the creed.
- Bishops from across the region attended the council.
