simpleMeaning: Bark that makes the skin feel tight comes from a skin wash made from one of several bushes
  or trees of the group Hamamelis.
scope: Also called witch hazel, wych hazel, and wych hazel plant, this is the bush or tree itself, not
  the skin wash made from its bark.
examples:
- The bark of a witch hazel plant goes into a skin wash.
- Some witch hazel plants are bushes, and others are trees.
