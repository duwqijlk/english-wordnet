simpleMeaning: in a way that says or shows the opposite of what is really meant or expected
scope: Said or done in a way that turns out the opposite of what is meant or expected, not in a plain,
  straight way.
examples:
- She began to mimic him ironically.
- Ironically, the fire station burned down last night.
