simpleMeaning: a lizard of Africa and Madagascar that can change the colour of its skin and has a tongue
  that shoots out
scope: A lizard of Africa and Madagascar that can change colour and shoot out its tongue; chameleon is
  another name for this sense, not any other lizard and not a toy.
examples:
- The chamaeleon changed colour as it moved along the branch.
- A chamaeleon sat still, its tongue ready to shoot out.
