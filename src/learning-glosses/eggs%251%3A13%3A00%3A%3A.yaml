simpleMeaning: oval bodies laid by female birds, especially hens, that people eat as food
scope: Another name for egg as food — the oval bodies people cook and eat — not the biological body a
  chick develops in, and not the reproductive cells of other animals.
examples:
- We had bacon and eggs for breakfast.
- The recipe calls for three eggs.
