simpleMeaning: A stiff white band round the neck with no opening at the front, a mark of the clergy
scope: Also called clerical collar and dog collar, this stiff white band round the neck has no opening
  at the front and marks the wearer as clergy, unlike an ordinary shirt collar.
examples:
- The priest wore a Roman collar.
- A Roman collar has no opening at the front.
