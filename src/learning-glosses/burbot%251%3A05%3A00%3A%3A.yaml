simpleMeaning: In the fresh waters of the north of Europe, Asia and North America lives a long cod with
  small feelers around its mouth.
scope: Also called a ling, a cusk, or an eelpout, this is the long cod of fresh water in the north of
  Europe, Asia and North America.
examples:
- The angler pulled a burbot from the cold northern lake.
- A burbot swam past in the river.
