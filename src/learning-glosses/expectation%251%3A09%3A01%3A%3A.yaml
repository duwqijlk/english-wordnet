simpleMeaning: In maths, the number you get when you add up the values of a thing that can change by chance
  and split the total by how many values there are
scope: In maths, a number worked out from values of a thing that can change by chance; not the feeling
  of looking forward to something you believe will happen.
examples:
- The expectation is found by adding all the values and dividing by how many there are.
- For this game, the expectation is two, because the values add up to ten and there are five of them.
