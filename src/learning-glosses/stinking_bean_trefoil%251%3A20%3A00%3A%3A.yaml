simpleMeaning: Yellow flowers come first on this shrub, then seed pods that curve back; its three-part
  leaves smell bad when crushed.
scope: Also called bean trefoil, it is a shrub with three-part leaves, yellow flowers, and seed pods that
  curve back.
examples:
- The stinking bean trefoil gave off a bad smell when she crushed a leaf.
- Yellow flowers stood out on the stinking bean trefoil.
