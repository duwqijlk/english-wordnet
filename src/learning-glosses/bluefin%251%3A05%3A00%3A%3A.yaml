simpleMeaning: The biggest of the tunas, reaching 1500 pounds, that lives for the most part in mild seas,
  feeds in cold polar waters and breeds in warm tropical ones.
scope: This is the biggest of the tunas, also called bluefin tuna and horse mackerel, not a small tuna
  of warm seas alone and not one that breeds in cold waters.
examples:
- The bluefin can grow to 1500 pounds.
- Bluefin feed in polar waters but breed in the tropics.
