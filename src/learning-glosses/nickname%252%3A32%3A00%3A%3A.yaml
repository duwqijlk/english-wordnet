simpleMeaning: to give a person or thing a name that people use in place of their real name
scope: To give a person or thing a name that people use in place of their real name; the name itself is
  the noun sense, not this verb sense.
examples:
- They nicknamed the tall boy 'Tiny' on his first day.
- The team nicknamed their coach 'Bear' because he was so big.
