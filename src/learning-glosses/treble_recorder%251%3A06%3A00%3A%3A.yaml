simpleMeaning: A small wind pipe played by blowing into a mouthpiece, with four holes for the fingers
  and two for the thumbs
scope: A small wind pipe with four finger holes and two thumb holes, also called flageolet and shepherd's
  pipe; not a flute played from the side and not a whistle with one hole.
examples:
- She played a tune on the treble recorder for the class.
- The treble recorder has a sweet high sound.
