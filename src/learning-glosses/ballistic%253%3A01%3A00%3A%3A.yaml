simpleMeaning: about things that keep moving by their own speed, with no new push, while gravity (the
  pull that brings things down to earth) acts on them
scope: This describes how a thing moves after it is sent through the air; it is not the thing itself and
  not the act of sending it.
examples:
- The team studied the ballistic path of the shell after it left the gun.
- A ballistic test showed how far the object would fly.
