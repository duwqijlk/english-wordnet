simpleMeaning: From Greenland to Alaska, this ground-hugging plant lives for years and carries red berries
  plus rings of leaves at the ends of its shoots.
scope: 'Another name for crackerberry, dwarf cornel and pudding berry: the low creeping plant itself,
  not its red berries or a bunch of picked fruit.'
examples:
- Bunchberry spread across the forest floor in a thick mat.
- Bunchberry bears a cluster of red berries in late summer.
