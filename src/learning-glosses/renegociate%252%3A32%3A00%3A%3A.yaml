senseId: 'renegociate%2:32:00::'
synsetId: 00764088-v
simpleMeaning: To change the terms of a deal so as to cut back or win back too much gain made by the other
  side.
scope: 'Also called renegotiate: to change the terms of a deal so as to cut back or win back too much
  gain made by the other side, not to end the deal and not to start a new one.'
examples:
- We renegociated the mortgage when the rates came down.
- The council renegociated the old deal to cut back the extra gain.
