simpleMeaning: To bear blossoms, as a plant does when it comes into bloom.
scope: This is the verb for producing blooms, not the noun for a plant grown for its blooms or for the
  bloom itself.
examples:
- The apple tree flowers every spring.
- Some bamboos flower only once in many decades.
