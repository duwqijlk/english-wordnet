simpleMeaning: Of motor vehicles, with a coat of tar or other rust-proof stuff put on the underside.
scope: 'Also called undercoated: a motor vehicle with a rust-proof coat on its underside, not a vehicle
  with a new coat of paint and not one left bare underneath.'
examples:
- The undersealed car resisted rust through the wet winter.
- Our undersealed van had tar spread under its floor.
