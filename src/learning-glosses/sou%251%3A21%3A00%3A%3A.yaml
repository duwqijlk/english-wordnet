simpleMeaning: an old French coin worth very little; often used to mean any very small amount of money
scope: An old French coin of small value, often used for any small amount of money; not a coin in use
  today and not a large sum of money.
examples:
- He did not have a sou to pay for bread.
- She spent her last sou on a cup of coffee.
