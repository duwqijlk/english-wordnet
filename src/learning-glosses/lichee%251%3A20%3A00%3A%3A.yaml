simpleMeaning: At times put in the group Nephelium, this Chinese tree is grown above all in the Philippines
  and India for its fruit, which can be eaten.
scope: Also called litchi or litchi tree, this Chinese tree is grown for its fruit; the name does not
  mean the fruit itself.
examples:
- People eat the fruit of the lichee.
- The lichee is grown in the Philippines for its fruit.
