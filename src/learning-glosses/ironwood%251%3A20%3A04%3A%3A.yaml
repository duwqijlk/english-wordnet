simpleMeaning: very hard and strong wood that comes from one of several kinds of tree
scope: The wood itself, not a tree it comes from, such as a tree in eastern North America or a small tree
  in northern Iran.
examples:
- The table was made of ironwood and was very heavy.
- He used ironwood for the handle because it does not break easily.
