simpleMeaning: A new faith started by L. Ron Hubbard in 1955, built on the belief that a person's spirit
  can free itself from past pain through self-knowledge and spiritual growth
scope: Also called the Church of Scientology; a new faith founded in 1955, not one of the older world
  faiths.
examples:
- She joined Scientology after reading about L. Ron Hubbard.
- Scientology teaches that the spirit can clear itself of past pain.
