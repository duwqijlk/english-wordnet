simpleMeaning: To do with the part of the study of animals that looks at tiny one-celled living things
scope: To do with the study of tiny one-celled living things, not the study of animals in general.
examples:
- Her protozoological work looks at tiny one-celled creatures in pond water.
- The protozoological paper described a new kind of tiny living thing.
