simpleMeaning: a small mouse-like animal of one of several kinds that live in the mountains of Europe,
  Asia, and America
scope: 'Also called a red-backed mouse: a small animal of the mountains of Europe, Asia, and America,
  not a house mouse and not a rat.'
examples:
- The redback vole made its nest under a rock on the hillside.
- A redback vole came out at dusk to feed on seeds.
