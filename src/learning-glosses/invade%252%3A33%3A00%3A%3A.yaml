simpleMeaning: to march into another people's land in a fighting way, with an army, to take it by force
  and hold it
scope: 'Also called occupy: this is an army taking another land by force, not entering or harming in a
  wider way, and not going into a place without a right to be there.'
examples:
- The army invaded the country and took its capital.
- Enemy soldiers invaded the island and stayed to hold it.
