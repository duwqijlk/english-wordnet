simpleMeaning: Eaten as food, and in Scotland put in whiskey for its taste, are the small round lumps
  under the ground borne by this plant from Europe.
scope: Also called earth-nut pea, heath pea, and tuberous vetch, it bears small round lumps under the
  ground, eaten as food and in Scotland put in whiskey for its taste.
examples:
- We dug up earthnut pea tubers for food.
- They cooked the earthnut pea tubers for the meal.
