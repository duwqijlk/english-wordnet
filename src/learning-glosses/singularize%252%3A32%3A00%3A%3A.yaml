simpleMeaning: To treat or mark something as standing alone, one of a kind
scope: To treat or mark something as standing alone, one of a kind, also called singularise; not just
  seeing a thing, and not splitting a group apart.
examples:
- The teacher singularized the pupil as the only one who had finished.
- He singularized the event as unique in the town's history.
