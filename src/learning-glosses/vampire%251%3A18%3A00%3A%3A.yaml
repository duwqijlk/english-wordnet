simpleMeaning: in old stories, a dead body that gets up at night to drink the blood of living people
scope: In old stories, a dead body that rises at night to drink blood, not a living person and not a bat.
examples:
- In the old tale, a vampire rose at night to drink the blood of the living.
- Children told stories of a vampire who lived in the ruined castle.
