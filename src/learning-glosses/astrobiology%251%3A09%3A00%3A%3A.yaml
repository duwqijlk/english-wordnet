simpleMeaning: The part of the study of life that looks at how space affects living things and at the
  search for life beyond Earth
scope: The part of the study of life that looks at how space affects living things, also called exobiology;
  not the study of the stars and not the study of life on Earth alone.
examples:
- Astrobiology asks how space affects living things.
- She studied astrobiology to learn about the search for life beyond Earth.
