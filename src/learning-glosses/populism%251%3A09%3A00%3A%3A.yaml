simpleMeaning: a set of political ideas that support the rights and power of ordinary people in their
  fight against a small group with special power
scope: A set of political ideas for ordinary people in their fight against a small group with special
  power. Not a single leader, a party name, or a vote by itself.
examples:
- Populism grew as workers said rich leaders did not care about them.
- He used populism to win support from ordinary farmers.
