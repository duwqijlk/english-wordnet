simpleMeaning: a colored glass-like material, clear or not, melted onto metal, glass, or things made of
  clay to make them look good or keep them safe
scope: A colored glass-like coating melted onto metal, glass, or things made of clay, not any smooth shiny
  coating and not the hard white stuff on teeth.
examples:
- The enamel on the old kettle had chipped away.
- She chose a blue enamel for the metal box.
