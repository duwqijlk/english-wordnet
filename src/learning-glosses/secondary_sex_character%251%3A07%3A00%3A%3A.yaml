simpleMeaning: Not needed to make children, marks of the body such as voice pitch, body hair, and muscle
  build are fixed at birth and mark a person male or female.
scope: Also called secondary sex characteristic and secondary sexual characteristic, these marks of the
  body are fixed at birth and mark a person male or female, not the parts of the body that make children.
examples:
- They spoke of voice pitch as a secondary sex character.
- Body hair counts as a secondary sex character.
