simpleMeaning: raised in thought to be perfect, or to be of the best quality
scope: Shown or thought of as perfect, not just very good in real life and not simply liked or praised
  by someone.
examples:
- The film gives an idealized picture of country life, with no dirt or hard work.
- She holds an idealized view of her childhood home.
