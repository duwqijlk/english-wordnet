simpleMeaning: In meteorology, air that spins in towards a place of low pressure, turning against the
  clock north of the equator and with the clock south of it
scope: A great spinning mass of air in weather, not a violent windstorm in general.
examples:
- The cyclone spun in over the coast.
- A cyclone formed above the warm sea.
