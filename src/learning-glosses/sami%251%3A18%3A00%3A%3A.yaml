simpleMeaning: A member of a native wandering people of northern Scandinavia who herd reindeer.
scope: Also called Same, Lapp, Lapplander, Saame, or Saami, this is a member of a native wandering people
  of northern Scandinavia who herd reindeer, not the tongue the people speak.
examples:
- The Sami herd reindeer in northern Scandinavia.
- A Sami family moves with its reindeer across the far north.
