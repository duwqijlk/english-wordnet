simpleMeaning: 'In ice hockey, the way play starts: the judge drops the flat rubber disc between two players
  on opposite sides.'
scope: In ice hockey, the start of play when the judge drops the disc between two players, not a kick-off
  and not a coin toss.
examples:
- The face-off began the second period.
- Both centres lined up for the face-off.
