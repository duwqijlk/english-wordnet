simpleMeaning: The part of a plant that holds its seeds inside, not the seeds themselves
scope: This plant part is also called a pod. It is not the fish, not its flesh as food, and not the sense
  that means paid for when you get something.
examples:
- Each cod held several small seeds.
- She opened the cod and took out the seeds inside.
