simpleMeaning: packed with too many small details, so that it looks crowded.
scope: This is not about being occupied with work or prying into others' affairs; it describes a surface,
  pattern or design that carries too much detail.
examples:
- The wallpaper had a busy floral pattern that made the room feel small.
- Her dress was too busy for such a plain occasion.
