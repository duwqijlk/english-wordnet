simpleMeaning: For arthritis, for swelling in muscles and bones, and for middling pain, it is a drug,
  sold as Naprosyn, that is not a steroid and eases swelling.
scope: Sold as Naprosyn, it eases swelling and treats arthritis, swelling in muscles and bones, and middling
  pain.
examples:
- The swelling in the knee eased with naproxen.
- Arthritis and middling pain are treated with naproxen.
