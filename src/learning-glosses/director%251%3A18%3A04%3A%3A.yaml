simpleMeaning: the person in charge of making a film, who guides the actors and decides how the finished
  movie should look and feel
scope: This is the film-making role, not a member of a company's board or the head of an institution.
examples:
- The director asked the actors to run the scene one more time.
- She won an award for her work as the director of the documentary.
