simpleMeaning: In this stage of hardening of the arteries, fatty lumps build up inside the walls of the
  heart's blood tubes, and the tubes grow narrow.
scope: Also called atherosclerosis, it is a heart illness in which the blood tubes narrow, not a sudden
  heart attack.
examples:
- Coronary artery disease runs in his family, so he watches his diet.
- She was told she had coronary artery disease after a check on her heart.
