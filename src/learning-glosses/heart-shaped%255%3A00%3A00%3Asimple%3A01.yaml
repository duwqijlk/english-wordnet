simpleMeaning: Of a leaf, wide at the top with two round parts and a point at the foot
scope: This is a leaf wide at the top with two round parts and a point at the foot, not a leaf that is
  round and not a leaf that is long and narrow.
examples:
- The heart-shaped leaves of the vine covered the wall.
- She pressed a heart-shaped leaf into her book.
