simpleMeaning: Cancers of the sex organs or mouth, and harmless growths in the sex organs, come from any
  of a set of tiny germs.
scope: Any of a set of tiny germs tied to cancers of the sex organs or the mouth, or to harmless growths
  in the sex organs, is what this names.
examples:
- The report named a human papilloma virus as the cause of the growth in the mouth.
- A human papilloma virus can lead to a harmless growth in the sex organs.
