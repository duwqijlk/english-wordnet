simpleMeaning: good sense in keeping away from harm or danger
scope: Also called care, and another name for it is precaution. This is the good sense a person uses to
  stay away from harm, not a lasting watchful quality in their character.
examples:
- He used caution when opening the old wooden door.
- She carried the hot pan with great caution.
