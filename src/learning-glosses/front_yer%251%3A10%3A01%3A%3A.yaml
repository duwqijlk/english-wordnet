simpleMeaning: the Cyrillic letter ь, which in Old Church Slavonic stood for a short front vowel also
  called reduced, and in modern tongues marks a soft consonant
scope: 'Also called soft sign: the Cyrillic letter ь, not a vowel letter and not a mark of stress.'
examples:
- In the old text, a front yer marked the vowel as short.
- The front yer tells the reader that the consonant before it is soft.
