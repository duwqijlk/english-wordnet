simpleMeaning: a high strip of land that keeps two river systems that are next to each other apart
scope: High land between two river systems, also called a divide. It is not an important event that changes
  history, and not the whole area that a river takes water from.
examples:
- The watershed between the two rivers runs along the top of these hills.
- Rain that falls on one side of the watershed flows into a different river.
