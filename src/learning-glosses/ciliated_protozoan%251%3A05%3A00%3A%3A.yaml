simpleMeaning: a one-celled living thing whose cell has small bits sticking out of its surface
scope: A one-celled living thing with small bits sticking out of its cell, also called a ciliate or a
  ciliophoran; not a thing with a hairy edge.
examples:
- The ciliated protozoan swam by beating its tiny hairs.
- Each ciliated protozoan in the drop of water had hairlike bits on its cell.
