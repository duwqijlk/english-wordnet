simpleMeaning: a card game with forty-eight cards, two of each suit (a set marked the same way) for high
  cards; play is like whist, an older card game
scope: A card game with forty-eight cards, not whist itself and not another card game played with a full
  normal pack.
examples:
- They played pinochle every Friday night with a special forty-eight-card pack.
- He taught his grandchildren how to play pinochle.
