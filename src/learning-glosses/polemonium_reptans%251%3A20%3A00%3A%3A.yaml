simpleMeaning: It grows straight up or spreads out, lives for many years, and comes from the east of the
  United States.
scope: Also called Greek valerian; a plant that grows straight up or spreads out and lives for many years,
  not a plant that lives for one year only and not one from the west of the United States.
examples:
- Polemonium reptans grows straight up in the garden by the fence.
- We found Polemonium reptans spreading out across the east field.
