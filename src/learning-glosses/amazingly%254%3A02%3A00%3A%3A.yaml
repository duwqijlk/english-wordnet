simpleMeaning: when something happens in a way nobody expected, leaving everyone filled with wonder
scope: In a surprising way, also called surprisingly; it is about how something happens, not about a thing
  itself.
examples:
- Amazingly, he finished medical school in three years.
- Amazingly, the old car started on the first try.
