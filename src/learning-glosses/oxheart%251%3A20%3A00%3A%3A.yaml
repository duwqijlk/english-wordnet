simpleMeaning: One of a few kinds of grown sweet cherry with sweet, juicy, heart-shaped fruit.
scope: One of a few kinds of grown sweet cherry; heart cherry and oxheart cherry are other names for this
  sense, not a sour cherry and not a wild cherry.
examples:
- The oxheart cherries in the garden were sweet and juicy.
- She picked an oxheart from the tree.
