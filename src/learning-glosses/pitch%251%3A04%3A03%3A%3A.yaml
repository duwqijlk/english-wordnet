simpleMeaning: in baseball or softball, a throw by the throwing player toward the person with the bat,
  which starts play by giving that person a chance to hit the ball
scope: This is the throw itself in baseball or softball, not how high or low a sound is, and not the dark,
  thick, sticky stuff.
examples:
- The first pitch was low and outside.
- He hit the pitch over the fence.
