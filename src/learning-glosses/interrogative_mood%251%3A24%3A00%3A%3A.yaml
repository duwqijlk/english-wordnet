simpleMeaning: the idea, held by some students of language, that sentences that ask a question make up
  a set of verb forms
scope: The idea, held by some students of language, that sentences that ask a question make up a set of
  verb forms, also called the interrogative; not the statement form of a verb and not the command form.
examples:
- Some grammars treat questions as an interrogative mood.
- The interrogative mood is shown by word order in English.
