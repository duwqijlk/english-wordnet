simpleMeaning: A ring shaped like a cone that grips round pieces of work held in a turning machine
scope: A ring that grips round work in a turning machine; collet chuck is another name for this sense,
  not a plain ring or a tool for cutting.
examples:
- The collet held the rod fast while the lathe turned.
- He changed the collet to grip a thicker piece of wood.
