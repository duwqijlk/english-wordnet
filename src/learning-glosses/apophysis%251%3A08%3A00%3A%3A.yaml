simpleMeaning: In anatomy, a natural bump or part that sticks out from an organ or body part, like the
  knob on a backbone bone.
scope: In anatomy, a natural bump that sticks out from an organ or body part, not a growth caused by disease
  and not the swelling sense found in plants.
examples:
- The apophysis on the bone could be felt under the skin.
- Doctors looked at the apophysis of the vertebra.
