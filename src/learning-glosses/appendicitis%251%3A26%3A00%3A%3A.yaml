simpleMeaning: a health problem in which the appendix (a small worm-like tube in the lower belly) becomes
  swollen, red, and painful
scope: A health problem in the small tube in the lower belly, not a general stomach pain and not pain
  from food or gas.
examples:
- She went to hospital with appendicitis and doctors removed her appendix.
- Appendicitis caused sharp pain in the lower right side of his belly.
