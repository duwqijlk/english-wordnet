senseId: 'defective_pleading%1:10:00::'
synsetId: 06574606-n
simpleMeaning: A court paper that does not meet the least rules for correct form, true facts, or enough
  detail
scope: A court paper that falls short of the least rules for form and detail, not a sound court paper
  and not a ruling by a judge.
examples:
- The lawyer filed a defective pleading that the judge rejected.
- A defective pleading must be fixed before the case can go on.
