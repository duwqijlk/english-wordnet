simpleMeaning: One of the high tones heard with a low main tone, its pitch a whole-number multiple of
  the main tone's pitch.
scope: Also called a partial, one of the high tones heard with a low main tone, its pitch a whole-number
  multiple of the main tone's pitch; not a hidden meaning carried by words, usually in the plural.
examples:
- The overtone rang faintly above the low note of the bell.
- Each overtone of the string sounds at a pitch that is a whole-number multiple of the lowest tone.
