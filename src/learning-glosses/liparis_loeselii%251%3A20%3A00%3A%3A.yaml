simpleMeaning: A small land orchid of eastern North America and Europe, with two leaves near the base
  and dull yellow-green flowers in clusters.
scope: 'Also called fen orchid and fen orchis: a small land orchid with two low leaves and dull yellow-green
  flowers, not a tree orchid and not an orchid with bright flowers.'
examples:
- Liparis loeselii grew in the wet meadow, its two leaves near the ground.
- We found Liparis loeselii with dull yellow-green flowers.
