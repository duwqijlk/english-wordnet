simpleMeaning: When the body has lost too much water and salts, a person feels giddy, sick to the stomach
  and weak in this sick state.
scope: A sick state in which a person feels giddy, sick to the stomach and weak after the body has lost
  too much water and salts is also called heat prostration.
examples:
- He felt giddy and weak with heat exhaustion.
- She lay down with heat exhaustion.
