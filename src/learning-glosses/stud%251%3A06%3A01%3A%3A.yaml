simpleMeaning: a round raised knob used as a decoration, as on a belt, a shield, or a vault
scope: Also called a rivet, this is a round raised knob used as a decoration, not a game of poker and
  not the verb meaning to scatter like dots.
examples:
- The belt was set with silver studs.
- Studs decorated the shield's rim.
