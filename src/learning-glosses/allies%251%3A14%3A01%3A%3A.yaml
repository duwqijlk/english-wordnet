simpleMeaning: In the First World War, the group of Britain, France, and Russia, with all the other nations
  that joined them against the Central Powers.
scope: The nations that fought the Central Powers in the First World War, not the nations of the Second
  World War and not the Central Powers themselves.
examples:
- The Allies in the First World War included Britain and France.
- The Allies opposed the Central Powers.
