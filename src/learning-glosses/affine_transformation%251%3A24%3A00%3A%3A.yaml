simpleMeaning: In mathematics, several single changes — a shift, a turn, or a flip over a line — joined
  into one change.
scope: In mathematics, a change built from single changes put together, not one shift alone and not one
  turn alone.
examples:
- An affine transformation can shift a figure, turn it, or flip it over a line.
- The affine transformation joined a shift and a turn into one change.
