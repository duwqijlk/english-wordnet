simpleMeaning: In Persian use, the new year holiday in Iran, Azerbaijan, Afghanistan, Pakistan, parts
  of India and among the Kurds, kept at the first day of spring.
scope: This is the Persian new year holiday kept at the first day of spring; also called Nowrooz and Nowruz.
examples:
- Noruz is the new year holiday in Iran.
- Families keep Noruz at the first day of spring.
