simpleMeaning: a hollow part into which something fits, such as a pipe, a probe (a thin tool used to check
  inside something), or the end of a bone
scope: A hollow part made for something to fit into, such as a pipe or the end of a bone; not the hollow
  in a bone that another part fits into.
examples:
- He pushed the pipe firmly into the socket.
- The probe is put into a socket before it is used.
