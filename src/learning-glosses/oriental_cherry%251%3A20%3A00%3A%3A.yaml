simpleMeaning: A showy tree grown in many kinds for its white flowers, whose fruit people cannot eat.
scope: This is a showy tree grown in many kinds for its white flowers, and its fruit cannot be eaten,
  so it is not a tree grown for fruit to eat.
examples:
- White flowers cover the oriental cherry.
- People cannot eat the fruit of the oriental cherry.
