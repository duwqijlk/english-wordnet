simpleMeaning: Too much salt in the blood, which may point to a disease in which the body passes too much
  water
scope: This is too much salt in the blood, which may point to a disease in which the body passes too much
  water, not too little salt and not the common disease in which blood sugar is high.
examples:
- Hypernatremia showed too much salt in his blood.
- The test found hypernatremia after the long illness.
