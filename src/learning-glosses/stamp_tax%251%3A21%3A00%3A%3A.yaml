simpleMeaning: The state takes money for it when a mark must be bought and fixed to papers, most often
  on documents or printed matter.
scope: Stamp duty is another name for this money taken by the state when a mark must be bought and fixed
  to papers, most often on documents or printed matter.
examples:
- They paid the stamp tax on the papers.
- The stamp tax was paid on the printed matter.
