simpleMeaning: a legal plan that gives money to a person to live on, but keeps it safe from that person's
  wasteful spending
scope: A legal plan that gives money to a person to live on while keeping it safe from that person's wasteful
  spending; not a gift of money and not a will.
examples:
- Her father set up a spendthrift trust so she would have money for life.
- The spendthrift trust kept his inheritance safe from his own spending.
