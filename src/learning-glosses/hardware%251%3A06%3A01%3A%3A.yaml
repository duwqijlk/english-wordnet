simpleMeaning: In computers, the hard parts of a machine — the moving parts and the magnetic and electric
  bits — that make up the whole system
scope: In computers, the hard parts of a machine, not the programs and not tools made of metal.
examples:
- The new hardware arrived in three large boxes.
- This hardware runs the whole system.
