simpleMeaning: A card game where you play cards marked 7 first, then other cards in order in the same
  suit, and the first to use all their cards wins
scope: 'Also called parliament: this is a card game with cards marked 7, not a meeting of the people who
  make a country''s laws.'
examples:
- We played sevens after dinner, and I won by using all my cards first.
- In sevens, you put down the cards marked 7 first, then the next cards in order.
