synsetId: 00192829-n
simpleMeaning: the act of passing a liquid or gas through a special material, so that some parts stay
  in the material and the liquid or gas is changed
scope: This is the act of passing a liquid or gas through a special material to change it. It is not the
  sense that names the process by which a liquid or gas passes through such a material.
examples:
- Filtration removed the sand from the water.
- The plant uses filtration to clean the air before it leaves the building.
