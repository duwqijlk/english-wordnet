simpleMeaning: Any of several crested birds of Europe, Asia and Africa, with a thin bill that bends down
scope: Any of several crested birds of Europe, Asia and Africa, with a thin bill that bends down, also
  called a hoopoe; not a bird with a straight bill, and not a bird of the Americas.
examples:
- A hoopoo landed on the wall, its crest raised.
- The hoopoo's thin bill curved down as it probed the soil.
