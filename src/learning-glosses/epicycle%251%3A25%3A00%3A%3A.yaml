simpleMeaning: A ring that rolls round another ring, on the inside or the outside, and makes a wavy looped
  line
scope: This is a ring that rolls round another ring, on the inside or the outside, and makes a wavy looped
  line, not a ring that stays still and not a ring that slides without rolling.
examples:
- The epicycle rolled round the larger ring.
- As the epicycle rolled, it drew a wavy looped line.
