senseId: 'golgi_body%1:08:00::'
synsetId: 05442133-n
simpleMeaning: Animal cells have a net-like structure in the cytoplasm, the soft stuff that fills them,
  and it is found most in cells that make fluids.
scope: Also called Golgi apparatus, Golgi complex, and dictyosome; a net-like part inside an animal cell,
  not the whole cell and not the part that carries the cell's instructions.
examples:
- The Golgi body sits inside the animal cell like a small net.
- Cells that make fluids have a clear Golgi body.
