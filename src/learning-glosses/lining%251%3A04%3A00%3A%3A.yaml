simpleMeaning: the act of fixing an inner layer inside a garment, a curtain, or other such thing
scope: The act of putting an inner layer into clothes or curtains, not the layer itself that guards an
  inside surface.
examples:
- The lining of the winter coat was sewn in by hand.
- She spent the afternoon lining the curtains with thick cloth.
