simpleMeaning: Rock that holds metal is broken into small bits here, and the useful parts are sorted from
  the waste, by one of many ways of doing it.
scope: Also called mineral dressing, mineral extraction, mineral processing, ore dressing, or ore processing,
  this work sorts the useful parts of rock that holds metal from the waste.
examples:
- The mine used beneficiation to sort the useful parts from the waste.
- The crushed rock went through beneficiation before the waste was thrown away.
