simpleMeaning: said of something that has to do with augite, a dark green or black mineral, or that holds
  some of it
scope: Said of something linked to the mineral augite, not of the mineral itself and not of another dark
  mineral.
examples:
- The augitic rock held dark green crystals of augite.
- Augitic crystals gave the stone its dark look.
