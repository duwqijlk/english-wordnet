simpleMeaning: In computing, a part of a hard disk set aside for one system or program and used as if
  it were a disk of its own
scope: In computing, a part of a hard disk set aside for one system or program; not a wall in a room and
  not a wall of tissue in the body.
examples:
- He made a new partition on the disk for Linux.
- The partition holds only the files for that one program.
