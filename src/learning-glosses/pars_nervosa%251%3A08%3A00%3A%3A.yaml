simpleMeaning: The back lobe of the small gland at the base of the brain, made up mostly of gland tissue.
scope: The back lobe of the small gland at the base of the brain, also called neurohypophysis; not the
  front lobe and not the brain itself.
examples:
- The pars nervosa stores hormones made higher in the brain.
- Damage to the pars nervosa can upset the body's water balance.
