simpleMeaning: In linguistics, the way words and grammar link parts of a text or sentence, hold it together,
  and give it meaning
scope: In linguistics, this is about how words and grammar hold a text together, not the force in physics
  that holds the parts of a solid or liquid together.
examples:
- Cohesion in her essay comes from clear links between sentences.
- Good cohesion helps the reader follow the meaning of the text.
