simpleMeaning: A weak female sex hormone made naturally by the ovaries of mammals, also made artificially
  under the trade name Estronol and used to treat a shortage of estrogen.
scope: Another name for estrone, a weak estrogen made by the ovaries and also manufactured as a drug;
  not estradiol, the body's main, stronger estrogen, nor estriol.
examples:
- Oestrone is a weak hormone made by the ovaries.
- Oestrone is also produced artificially and sold as Estronol.
