simpleMeaning: understanding things quickly and reacting to them with keen awareness
scope: This is about quick understanding and sharp reaction, not about being prepared or willing, and
  not about being available for use.
examples:
- She has a ready wit and always finds the right reply.
- He gave a ready answer, which showed he had understood at once.
