simpleMeaning: a room that can be filled with steam, where people wash in the steam; in Britain it has
  another name
scope: 'Another name for vapour bath, steam bath and steam room: a room full of steam where people wash,
  not a room for a swim and not a shower.'
examples:
- We sat in the vapor bath until the steam had warmed us through.
- The hotel has a vapor bath beside the pool.
