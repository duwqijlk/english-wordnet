simpleMeaning: things from plants that have a strong smell and are used to keep food from going bad
scope: This sense is about plant things used to keep food from going bad, not plant things used to give
  food a strong taste, and not the act of adding them to food.
examples:
- In the past, people put spices on meat to keep it from going bad.
- Some spices were used to keep food safe to eat for a longer time.
