simpleMeaning: so cruel and hard that it shocks people who hear of it
scope: 'Also called monstrous: a cruel act that shocks people, not a threat of harm, not a matter of great
  weight, and not a feeling of grief.'
examples:
- Murder is a grievous crime.
- The court called the attack a grievous offense against the town.
