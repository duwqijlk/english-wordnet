simpleMeaning: Grown widely for its leaves as a salad green, this herb has curled leaves with toothed
  edges or broad flat ones usually kept pale out of the light.
scope: Also called endive, this is a herb grown for its leaves as a salad green, not the young pale head
  grown in the dark.
examples:
- We eat witloof leaves raw in salads.
- The witloof leaves were kept pale out of the light.
