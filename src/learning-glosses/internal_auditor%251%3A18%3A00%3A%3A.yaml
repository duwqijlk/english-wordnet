simpleMeaning: A firm has one of its own people check its books and tell its bosses and board what was
  found
scope: A person employed by a firm to check its books and report to its bosses and board; not an outside
  checker hired for one job and not a bookkeeper who keeps the books.
examples:
- The internal auditor found errors in the company's spending records.
- As internal auditor, she reported straight to the board of directors.
