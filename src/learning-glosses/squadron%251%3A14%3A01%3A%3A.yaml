simpleMeaning: A group of horse soldiers made up of two or more troops, with its command staff and supporting
  units.
scope: A cavalry group of two or more troops; not a naval group sent away from the fleet.
examples:
- The squadron rode out at dawn.
- A squadron of cavalry guarded the road.
