simpleMeaning: the closed space in an aircraft or in a vehicle made for travel in space, where passengers
  are carried
scope: This is the closed space in an aircraft or a vehicle made for travel in space, where passengers
  are carried; not a small wooden house and not the act of keeping someone in a small space.
examples:
- Passengers must stay in the cabin while the plane takes off.
- Smoke filled the cabin, so the crew opened the doors at once.
