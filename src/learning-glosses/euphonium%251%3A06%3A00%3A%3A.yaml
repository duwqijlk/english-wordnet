simpleMeaning: A low horn of brass, blown by the lips, that takes the middle part in the family of tubas.
scope: A low brass horn with the middle voice of the tuba family, not a high trumpet and not a big tuba;
  no other name is listed for this sense.
examples:
- He played the euphonium in the brass band.
- The euphonium gave the low middle line in the march.
