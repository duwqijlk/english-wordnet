simpleMeaning: a line across the palm of the hand; people who read palms say its length shows how long
  you will live
scope: A line on the palm of the hand, said to show how long a person will live; not a rope thrown from
  a ship and not help that keeps people going.
examples:
- The palm reader traced her lifeline with a finger.
- He joked that his short lifeline meant a short life.
