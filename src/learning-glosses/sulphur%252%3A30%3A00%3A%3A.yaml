simpleMeaning: to treat dried fruit or other things with a yellow chemical so that they keep well and
  do not go bad
scope: This is treating food or other things with that yellow chemical so that they keep well. It is not
  the yellow chemical itself.
examples:
- These dried apricots were sulphured before they were packed.
- Workers sulphur the fruit to keep it from going bad.
