simpleMeaning: to put something into parts that follow one after another in a set order
scope: To set something out in steps, not a single step itself, not the shape of the moon, and not a state
  of matter.
examples:
- They will phase the move to the new office over three months.
- The army phased its withdrawal so units left one after another.
