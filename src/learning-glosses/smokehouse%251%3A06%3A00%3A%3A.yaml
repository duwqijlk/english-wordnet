simpleMeaning: a small house where smoke is used to dry meat or fish and keep it from going bad
scope: This is a small building for drying meat or fish with smoke, not a house where people smoke and
  not a large food factory.
examples:
- They hung the fish in the smokehouse for two days.
- The old smokehouse behind the farm still smells of wood smoke.
