simpleMeaning: A chain women once wore round the waist, to hold a purse, keys, and other small things.
scope: A chain worn at the waist to carry small things, not a belt and not a necklace.
examples:
- The housekeeper wore a chatelaine at her waist.
- Her chatelaine held a purse and a bunch of keys.
