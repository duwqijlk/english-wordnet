simpleMeaning: a custard or pudding, most often made from oats, with a plain, mild taste
scope: A plain, mild custard or pudding made most often from oats, not a rich cake and not a sharp, spiced
  pudding.
examples:
- She served flummery with cream after the Sunday roast.
- The old recipe for flummery calls for oatmeal, milk, and sugar.
