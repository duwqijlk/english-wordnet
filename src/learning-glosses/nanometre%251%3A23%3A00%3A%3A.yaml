simpleMeaning: This tiny unit of length is one part in a thousand million of one standard unit
scope: 'Also called a nanometer, a millimicron, a micromillimeter or nm: one thousand-millionth part of
  one standard unit of length, not a big unit and not a unit of weight.'
examples:
- The nanometre is far too small to see with the eye alone.
- A virus is only a few nanometres across.
