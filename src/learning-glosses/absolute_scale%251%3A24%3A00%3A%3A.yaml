simpleMeaning: a way of gauging heat that sets the coldest point possible at 0 degrees; water turns to
  ice at 273.16 degrees and boils at 373.16 degrees
scope: A heat gauge that starts at the coldest point possible, not the Celsius or Fahrenheit gauge.
examples:
- On the absolute scale, water boils at 373.16 degrees.
- Zero on the absolute scale is the coldest point possible.
