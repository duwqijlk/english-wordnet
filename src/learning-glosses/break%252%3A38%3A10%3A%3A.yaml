simpleMeaning: A military formation is split, whether the enemy's or your own, when people leave or run
  away.
scope: This is about a formation splitting as people leave or flee, not a pause from work, not something
  shattering into pieces, not a bone fracture, not a jail escape, not a sudden dash, and not the tennis
  score.
examples:
- When soldiers flee, they can break their own ranks.
- Whole companies break and run at the first volley.
