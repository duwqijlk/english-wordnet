simpleMeaning: light and other rays that can make chemicals change when they strike
scope: Light or other rays that can set off chemical change, also called actinic ray; not ordinary light
  that only lets you see, and not heat from the sun.
examples:
- Actinic radiation from the sun can fade the colours in old photographs.
- The lamp gives off actinic radiation that starts the chemical change in the film.
