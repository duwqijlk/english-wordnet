simpleMeaning: Any of several kinds of plant in the groups called Eucalyptus, Liquidambar or Nyssa, which
  give a sticky plant stuff.
scope: Any of several kinds of plant in the groups called Eucalyptus, Liquidambar or Nyssa, which give
  a sticky plant stuff; gum is another name for it, not the raised line of bone in the jaws and not the
  sticky stuff used to thicken food.
examples:
- A gum tree stood at the edge of the field.
- The gum tree gave a sticky plant stuff.
