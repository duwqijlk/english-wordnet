simpleMeaning: the beliefs and way of running a Protestant group in which each member body governs itself
scope: The beliefs and way of running a Protestant group whose member bodies govern themselves, not the
  single local body called a Congregational Church and not a group ruled by bishops.
examples:
- Congregationalism gives each local church the right to govern itself.
- Under Congregationalism, no bishop tells a congregation what to do.
