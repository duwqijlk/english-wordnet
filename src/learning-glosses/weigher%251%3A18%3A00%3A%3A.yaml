simpleMeaning: A person whose job is to find how heavy things are and write the weight down.
scope: A person whose job is to find how heavy things are and write the weight down, not a person who
  sells the goods and not a person who carries them.
examples:
- The weigher checked each sack and wrote down its load.
- A weigher at the dock kept a list of every crate.
