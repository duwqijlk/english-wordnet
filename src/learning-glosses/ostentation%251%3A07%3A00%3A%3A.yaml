simpleMeaning: A show put on to impress others, full of self-importance and bad taste
scope: A show put on to impress others, full of self-importance and bad taste; not a plain show of a thing
  and not a lack of grace from being puffed up with pride.
examples:
- The ostentation of the wedding shocked the village.
- Her ostentation at the party put everyone off.
