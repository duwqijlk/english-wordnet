simpleMeaning: With tough leaves cut deep into narrow strips, this fern is found in many warm lands south
  of the equator.
scope: People also call it a leather fern or a leatherleaf fern, and it is a fern of warm lands south
  of the equator with tough leaves cut deep into narrow strips.
examples:
- A ten-day fern grew beside the path.
- She pressed a ten-day fern between sheets of paper.
