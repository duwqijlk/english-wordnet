simpleMeaning: a path made of flat wood boards and used for a short time, for example over mud where people
  are building
scope: A path of wood boards over mud on a building place, not the way between seats or shelves, and not
  the short bridge used to get on or off a ship.
examples:
- Workers walked over the mud on a gangway made of boards.
- They laid a gangway across the wet ground so no one had to step in the mud.
