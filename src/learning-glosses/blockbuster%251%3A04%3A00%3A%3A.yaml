simpleMeaning: Something that is liked by very many people and sells very well, especially a movie, a
  play, a recording, or a book
scope: This is a very big success, also called a megahit; it is not a large bomb that can knock down a
  whole city block.
examples:
- The new film was a blockbuster and sold tickets all over the world.
- Her last book became a blockbuster in its first month.
