simpleMeaning: A fine round-topped plant that loses its leaves, with dark green leaves made of many small
  leaflets and many clusters of sweet-smelling creamy-white flowers, from China and Japan.
scope: Also called Chinese scholar tree, Japanese pagoda tree, Sophora japonica, and Sophora sinensis;
  a fine round-topped leaf-losing plant of China and Japan with sweet-smelling creamy-white flowers.
examples:
- The Chinese scholartree blooms in summer.
- A Chinese scholartree grows in the park.
