senseId: 'exchange%1:04:05::'
synsetId: 00168099-n
simpleMeaning: In chess, the gain or loss of a rook when it is traded for a knight or bishop.
scope: This is the chess trade of a rook for a knight or bishop, not the capture of equal-value pieces
  by both players, and not a general swap of one thing for another.
examples:
- Black lost the exchange when his rook was captured by a bishop.
- White won the exchange after trading a knight for a rook.
