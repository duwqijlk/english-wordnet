simpleMeaning: In eastern North America stands a tall straight tree with flat limbs, whose small leaves
  come out late in spring and turn bright in early fall.
scope: Also called pepperidge and sour gum, this tall straight tree of eastern North America is not the
  small mallee with rough dark bark.
examples:
- Black gum grew in eastern North America.
- We watched black gum leaves turn bright.
