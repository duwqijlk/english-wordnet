simpleMeaning: given out in parts that are carefully worked out in size or amount
scope: This word describes a thing that has been given out in careful, set amounts; it is not about giving
  freely with no measure.
examples:
- The medicine was dispensed in small, carefully measured doses.
- Food was dispensed to each family in equal portions.
