simpleMeaning: A sculpin (a kind of fish) that lives in fresh water, with a large flat head covered in
  hard bony plates and sharp points like horns
scope: This is a fresh-water fish with a large flat head and horn-like sharp points, not a catfish and
  not a person who will not change his mind.
examples:
- He caught a bullhead in the stream near the rocks.
- The bullhead's wide flat head has sharp points near its sides.
