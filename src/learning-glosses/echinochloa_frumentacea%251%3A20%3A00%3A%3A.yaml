simpleMeaning: A coarse one-year grass grown in Japan and south-eastern Asia for its seeds to eat and
  for feed; a key food for wild animals in the United States.
scope: 'Also called billion-dollar grass, sanwa millet, Japanese barnyard millet or Japanese millet: a
  coarse one-year grass grown in Japan and south-eastern Asia for its seeds, not a tall tree and not a
  plant grown for timber.'
examples:
- Echinochloa frumentacea grew in the field, and its seeds are eaten.
- In the United States Echinochloa frumentacea is a key food for wild animals.
