schema: oewn-learning-gloss-v2
senseId: 'dream%1:09:03::'
synsetId: 05640577-n
simpleMeaning: A wild, hopeless wish that can never come true, like a fantasy stirred by smoking opium.
scope: A wildly hopeful wish with no chance of coming true only; not the images and feelings that come
  during sleep, not imaginative thoughts indulged while awake, not a treasured wish one seriously means
  to pursue, not a detached state of mind cut off from reality, not a wonderful person or thing, and not
  either verb use (daydreaming or experiencing something during sleep).
examples:
- His plan to make the desert bloom was a dream born of opium, not of any knowledge of the land.
- Nobody takes his scheme seriously; it is the dream of a man who has smoked too much.
