simpleMeaning: One of the twelve federal law panels in the United States, each of which hears cases from
  a group of states that share one name.
scope: One of twelve federal panels that hear cases from a group of states, above the trial courts and
  below the highest court in the land, not a trial court and not a state court.
examples:
- The circuit court of appeals heard the case after the trial court.
- She took her case to the circuit court of appeals.
