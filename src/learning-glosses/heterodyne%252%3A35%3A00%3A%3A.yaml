simpleMeaning: to mix a radio wave with a wave made close by at a different rate, making a new wave whose
  rate is the sum or the difference of the two
scope: To mix a radio wave with a wave made close by to make a new wave, not to send or receive a signal
  on its own.
examples:
- The engineer will heterodyne the two radio waves to get a lower rate.
- They heterodyned the incoming wave with one made in the set.
