senseId: 'besmirch%2:32:00::'
synsetId: 00848188-v
simpleMeaning: to say someone did something bad when it is not true, or because you want to hurt them,
  and to harm their good name
scope: 'Also called smear, sully, slander, defame, denigrate, and asperse: this is about harming a person''s
  good name with false words, not about making something dirty or stained.'
examples:
- He tried to besmirch her name with lies about money.
- The newspaper besmirched the mayor by printing a false story about him.
