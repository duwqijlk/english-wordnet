simpleMeaning: A tree ranging from Southeast Asia to Australia, grown chiefly for its sweet edible fruit
  that is like litchi nuts; sometimes assigned to the groups Euphorbia or Nephelium.
scope: The same tree under another name, shared with longan and lungen, not the fruit on its own.
examples:
- The longanberry in her yard is covered in sweet fruit.
- Growers plant longanberry for the sweet fruit it bears.
