simpleMeaning: A retail site built as a neatly landscaped group of shops for leading retailers, usually
  with restaurants and convenient parking, and a modern form of the traditional marketplace.
scope: Another name for shopping centre, shopping mall, mall, plaza, center and centre in this retail
  sense — a landscaped complex of shops, not a single store or an open-air market.
examples:
- We spent the afternoon at the new shopping center, browsing the big-name stores and stopping for lunch.
- The shopping center has plenty of parking, so it is easy to reach by car.
