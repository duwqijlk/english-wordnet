simpleMeaning: a way of sending information widely over long distances by electronic signals
scope: This is the way or system used to send programmes to many people, not a single programme and not
  sending seeds over land.
examples:
- Broadcasting by radio brought news to homes all over the country.
- She works in broadcasting and helps make television programmes.
