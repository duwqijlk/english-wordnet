simpleMeaning: White flowers and hairy, toxic leaves belong to this Eurasian herb, now wild in America;
  its black berries may be harmful or may be safe to eat.
scope: The Eurasian herb with white flowers and berries that may be poisonous or edible, not the unrelated
  black bead shrub, despite the shared colour word.
examples:
- Black nightshade grows as a weed in gardens and disturbed ground.
- Ripe black nightshade berries are eaten in some places, though the leaves stay toxic.
