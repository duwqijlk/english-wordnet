simpleMeaning: Meet someone at a time and place you both agreed on first.
scope: To meet at a set time and place; not to bump into someone by chance, and not the meeting place
  itself.
examples:
- They rendezvoused at the old bridge at noon.
- The two groups will rendezvous in the square.
