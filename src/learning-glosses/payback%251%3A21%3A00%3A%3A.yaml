senseId: 'payback%1:21:00::'
synsetId: 13317483-n
simpleMeaning: money you get back or gain from money you put into something, especially an amount equal
  to the money you first put in
scope: This is money you get back from money you put in; not harm done to someone because that person
  did harm to you first.
examples:
- The payback from the new shop covered what they had put in.
- They hope for a payback equal to their first costs within two years.
