simpleMeaning: To fill a place with inhabitants.
scope: Literary and usually passive, of a place being filled or crowded with inhabitants; it is not the
  noun for persons, nor the sense of supplying a place with inhabitants.
examples:
- By dawn the square was peopled with traders and beggars.
- In his imagination the empty house was peopled with old friends.
