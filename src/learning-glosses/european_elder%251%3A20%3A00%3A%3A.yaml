scope: A common shrub with black fruit, or a small tree, of Europe and Asia, whose fruit is used for wines
  and jellies; elderberry, black elder, bourtree, common elder and Sambucus nigra are other names for
  it, not a shrub of America alone and not a shrub with red fruit.
examples:
- The European elder by the fence bears black fruit.
- We made wine from the fruit of the European elder.
