senseId: unique%5:00:00:incomparable:00
synsetId: 00507765-s
simpleMeaning: so unlike anything else that nothing can match or equal it.
scope: This is not the sense of being limited to a place or group; it says the thing is radically different
  from all others and has no equal.
examples:
- Her singing voice is unique.
- Each snowflake is unique.
