simpleMeaning: In golf, a shot where the ball curves to the left, for a player who hits with the right
  hand
scope: In golf, this shot is also called draw; it is not a curved tool for holding things and not a basketball
  shot made over the head.
examples:
- His first hook in the golf game curved left into the trees.
- She tried to fix her hook, which always sent the ball left when she played golf.
