simpleMeaning: talks to help two sides settle a fight or a difference, led by a fair person who is not
  on either side
scope: Talks led by a fair helper to settle a difference, not talks with no helper and not a court's final
  decision.
examples:
- The workers and the company agreed to try mediation to end the pay fight.
- After weeks of mediation, the two neighbours settled their land dispute.
