simpleMeaning: a thick mass of hair or thread-like parts that are stuck and twisted together
scope: A thick mass of hair stuck together, not the cloth with a long rough surface, not cut tobacco,
  and not a slang word for sex.
examples:
- The dog's woolly shag hung down over its eyes.
- His long shag needed a good brush to smooth it out.
