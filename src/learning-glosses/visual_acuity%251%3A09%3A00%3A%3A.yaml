simpleMeaning: The power to pick out fine detail, usually tested with a Snellen chart; that is how sharp
  one's sight is.
scope: Also called acuity and sharp-sightedness, it is the power to pick out fine detail, usually tested
  with a Snellen chart.
examples:
- Her visual acuity was tested with a Snellen chart.
- Good visual acuity lets you read fine print without strain.
