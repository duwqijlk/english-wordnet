simpleMeaning: In hot lands in Africa, Asia, and Australia lives this big meat-eating lizard, which old
  tales say gives a sign when a crocodile is close by.
scope: Also called monitor and varan; a big meat-eating lizard of hot lands in Africa, Asia, and Australia,
  said in old tales to tell of a crocodile near.
examples:
- The monitor lizard basked in the sun before slipping into the grass.
- In the old tale, a monitor lizard warned the village of a crocodile.
