simpleMeaning: A climbing plant of the Old World with lobed leaves that stay green all year and black
  fruits like berries.
scope: Also called ivy, common ivy and English ivy; a climbing plant of the Old World with lobed leaves,
  not other vines and not other evergreen climbers.
examples:
- Hedera helix climbs the old stone wall.
- The Hedera helix in the garden has black berries.
