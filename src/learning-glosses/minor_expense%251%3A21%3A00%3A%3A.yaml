simpleMeaning: A small cost, often in the plural, that was not put in a budget and not named there.
scope: 'Also called incidental and incidental expense: a small cost, often in the plural, that was not
  put in a budget and not named there, not a large planned cost and not a tax.'
examples:
- Minor expenses for pens and paper added up fast.
- He claimed the minor expense of a taxi ride.
