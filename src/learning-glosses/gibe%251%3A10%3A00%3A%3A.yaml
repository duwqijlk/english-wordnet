simpleMeaning: a sharp, angry remark aimed at a person and meant to have a strong effect on them
scope: This is an unkind remark aimed at a person, also called shot, dig, slam, shaft, barb, and jibe.
  It is not the verb sense where two things match or fit well together.
examples:
- He could not bear another gibe about his slow work.
- Her parting gibe hurt him more than he showed.
