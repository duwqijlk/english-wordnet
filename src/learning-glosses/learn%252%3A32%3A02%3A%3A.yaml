simpleMeaning: find out or establish something for certain, usually by asking questions or making some
  effort
scope: This is not gaining a skill through practice; it is discovering a fact with confidence, often by
  checking.
examples:
- We soon learned that the train had been cancelled.
- She learned from the manager that the job was already filled.
