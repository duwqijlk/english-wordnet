simpleMeaning: deliberately not go to a class, meeting, or similar event.
scope: This is not leaving an event early or arriving late; it means choosing not to go at all.
examples:
- He cut chemistry twice last week, and the teacher noticed.
- She cut her morning lecture to finish an essay.
