simpleMeaning: A heart illness in which the heart grows too weak to pump blood, its muscle changed or
  its valves scarred by repeated bouts of the fever.
scope: A heart illness brought on by repeated bouts of the fever, with the heart muscle changed or the
  valves scarred so the heart pumps blood weakly.
examples:
- Repeated bouts of rheumatic fever left her with rheumatic heart disease.
- His rheumatic heart disease made his heart too weak to pump blood well.
