simpleMeaning: A group of thin threads held together, most of all the thin threads that carry signals
  in the body
scope: 'Also called a fascicle, a fiber bundle and a fibre bundle: a group of thin threads held together,
  not a single thread and not a bunch of sticks.'
examples:
- The doctor pointed to a fasciculus of nerve fibers in the diagram.
- A fasciculus carries signals between parts of the brain.
