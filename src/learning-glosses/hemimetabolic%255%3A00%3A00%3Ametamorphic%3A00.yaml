simpleMeaning: Of an insect with young that live in water, growing by a change that is not full, in which
  the young does not look like the grown insect
scope: Of an insect with young that live in water, growing by a change that is not full, also called hemimetabolous,
  hemimetamorphic, and hemimetamorphous, and not an insect that grows by a full change with a resting
  stage.
examples:
- The hemimetabolic insect has young that live in water.
- Hemimetabolic young do not look like the grown insects.
