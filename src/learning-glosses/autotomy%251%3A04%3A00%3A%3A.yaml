simpleMeaning: a living thing dropping off one of its own body parts, such as a lizard's tail or a lobster's
  claw, especially when hurt or under attack
scope: A living thing dropping off a body part on its own, not losing one in an accident and not shedding
  its skin.
examples:
- When the lizard was caught by the tail, autotomy let it drop the tail and run away.
- Autotomy helps some sea animals escape, as a lobster can cast off a claw when attacked.
