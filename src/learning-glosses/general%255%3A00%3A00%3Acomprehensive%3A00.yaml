simpleMeaning: reaching across the whole world or able to be used everywhere.
scope: This is not about a broad but imprecise description; it means reaching or applying across the whole
  world.
examples:
- The new safety standard has general application in every country that signed the treaty.
- The theory won general acceptance among researchers worldwide.
