simpleMeaning: a tan and brown king snake with no venom and an arrow-shaped spot on the back of its head;
  those in the southeast have red stripes like coral snakes
scope: 'Also called checkered adder, milk adder, and milk snake: a tan and brown king snake with no venom,
  not a coral snake and not a rattlesnake.'
examples:
- A house snake lay under the porch, tan and brown with an arrow-shaped spot on its head.
- The house snake in the southeast had red stripes like a coral snake.
