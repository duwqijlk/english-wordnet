simpleMeaning: a hollow space in the body that opens into another hollow space, such as in the ear or
  the vagina
scope: A hollow space in the body leading into another hollow space, not a hall at the front of a building
  and not a room.
examples:
- The vestibule of the ear leads to the inner ear.
- The doctor looked at the vestibule of the ear.
