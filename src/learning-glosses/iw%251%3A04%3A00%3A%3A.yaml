simpleMeaning: The use of information or computer tools in a time of crisis or conflict to reach or advance
  set aims against a set enemy or enemies.
scope: The use of information or computer tools in a time of crisis or conflict to reach or advance set
  aims against a set enemy, also called information warfare; not ordinary news reporting or fighting with
  weapons alone.
examples:
- IW can shape what people believe during a war.
- The army used IW to weaken the enemy's plans.
