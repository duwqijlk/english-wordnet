simpleMeaning: Moving the bones and muscles of a person is how this healer treats them
scope: A healer whose work is moving a person's bones and muscles, also called osteopath; not a doctor
  who gives medicine and not a healer who works only on the back.
examples:
- The osteopathist pressed on her back to ease the ache.
- He trained as an osteopathist and now treats patients by hand.
