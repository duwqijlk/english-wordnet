simpleMeaning: of a surface, having raised lines that make it feel rough when you touch it
scope: This is about how a surface feels, with raised lines on it; it is not about strips added to something
  to make it stronger.
examples:
- She wore a ribbed sweater with lines running down it.
- The ribbed glass felt rough under his fingers.
