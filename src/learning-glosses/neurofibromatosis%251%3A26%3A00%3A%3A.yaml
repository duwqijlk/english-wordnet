simpleMeaning: Spots on the skin, many lumps on the nerves, and often problems in how the body grows mark
  a disease passed down from one parent.
scope: A disease passed down in families, marked by many lumps on the nerves and spots on the skin, not
  by one lump alone.
examples:
- Neurofibromatosis brings many lumps on the nerves and spots on the skin.
- People with neurofibromatosis often show problems in how the body grows.
