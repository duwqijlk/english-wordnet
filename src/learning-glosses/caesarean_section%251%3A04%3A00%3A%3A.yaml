simpleMeaning: An operation in which the baby comes out through a cut in the belly and womb, a way of
  birth once thought to be how Julius Caesar was born.
scope: Also called cesarean, caesarian, cesarian, abdominal delivery, caesarean, caesarean delivery, caesarian
  delivery, caesarian section, cesarean delivery, cesarean section, and cesarian section, this is a birth
  by a cut through the belly and womb, not a birth through the birth canal.
examples:
- He was born by caesarean section.
- The surgeon performed a caesarean section yesterday.
