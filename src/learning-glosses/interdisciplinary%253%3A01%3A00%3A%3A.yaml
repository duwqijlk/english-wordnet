simpleMeaning: Taking in, or marked by the work of, two or more fields of study.
scope: Drawing on two or more fields of study, not work within one field alone.
examples:
- The course was interdisciplinary, drawing on history and science.
- The research was interdisciplinary, joining biology and chemistry.
