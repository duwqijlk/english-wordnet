simpleMeaning: A big, well-working kind of water wheel that turns a machine making electric power.
scope: A big, well-working kind of water wheel that turns a machine making electric power, not a steam
  turbine and not an ordinary water wheel.
examples:
- The dam's hydroelectric turbine hums day and night.
- A new hydroelectric turbine will double the dam's output.
