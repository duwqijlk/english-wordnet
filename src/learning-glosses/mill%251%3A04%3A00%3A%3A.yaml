simpleMeaning: the act of crushing or rubbing a thing until it becomes a fine powder or dust
scope: 'Also called grind: the act of crushing a thing into powder. It is not the machine that does this
  work.'
examples:
- A slow mill of the dried beans made a soft powder.
- After the mill, the stone was covered in white dust.
