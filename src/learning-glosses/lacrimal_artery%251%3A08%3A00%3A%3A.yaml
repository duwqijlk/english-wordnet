simpleMeaning: An artery that starts from the eye artery and feeds the tear gland, the straight eye muscles,
  the upper eyelid, and the forehead.
scope: Also called arteria lacrimalis, an artery that starts from the eye artery and feeds the tear gland,
  the straight eye muscles, the upper eyelid, and the forehead.
examples:
- The lacrimal artery feeds the tear gland.
- Lacrimal arteries supply the eyelid.
