simpleMeaning: What works comes first in how a country is run, not what is right or a set of beliefs
scope: This is politics built on what works, also called realpolitik, not politics built on what is right
  or on a set of beliefs.
examples:
- His practical politics put jobs before ideas.
- Practical politics guided her choices in the council.
