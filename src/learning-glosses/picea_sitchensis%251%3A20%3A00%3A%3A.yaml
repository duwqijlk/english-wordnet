simpleMeaning: A big spruce that grows only on the north-west coast of the United States and Canada, with
  sharp stiff needles and thin bark, whose wood is strong for its weight
scope: Also called Sitka spruce, it is a big spruce that grows only on the north-west coast of the United
  States and Canada, with sharp stiff needles and thin bark and wood that is strong for its weight, while
  other large spruces of the north-west coast and other spruces with sharp stiff needles are different
  kinds.
examples:
- The Picea sitchensis grew only along the north-west coast.
- Picea sitchensis has thin bark and wood that is strong for its weight.
