simpleMeaning: A tall flowering plant from tropical and southern Africa with long blade-shaped leaves
  and one-sided spikes of bright funnel-shaped blooms, grown widely.
scope: The same tall African garden flower that is also called gladiolus; distinct from the other plant
  sharing this name, which has three petals and three drooping sepals.
examples:
- A single sword lily stood in the vase, its flowers opening from the bottom of the spike upward.
- Gardeners plant sword lilies in spring for colour in late summer.
