simpleMeaning: a small raised place on the skin that is red and painful and holds pus, like a blister
  filled with pus
scope: A small place on the skin filled with pus, not a blister with clear liquid and not a large deep
  sore.
examples:
- The infection left a pustule on his arm.
- Small pustules formed around the wound.
