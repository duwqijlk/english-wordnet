simpleMeaning: the way words are used through pictures and turns of speech, and not in their plain, direct
  sense
scope: How much words are used through pictures and turns of speech rather than in a plain, direct sense,
  not the plain meaning of the words and not a single figure of speech on its own.
examples:
- The figurativeness of the poem made its meaning hard to pin down.
- Critics praised the figurativeness of her speeches.
