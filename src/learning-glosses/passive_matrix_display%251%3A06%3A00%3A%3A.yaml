simpleMeaning: A liquid-crystal screen used in some portable computers, where each dot lights only if
  both the horizontal and vertical wires crossing at it carry current.
scope: A liquid-crystal screen switched by crossed wires, not the faster active-matrix kind.
examples:
- Early subnotebooks used a passive matrix display to save power.
- A passive matrix display reacts more slowly than an active matrix one.
