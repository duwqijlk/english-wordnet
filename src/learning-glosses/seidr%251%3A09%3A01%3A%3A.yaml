simpleMeaning: a Norse word from long ago for a kind of magic used in the north in the late Iron Age
scope: This is an old Norse word for a kind of magic in the late Iron Age; seithr, seid, seidh, seidhr
  and seith are other names for this sense, not modern stage magic and not a Norse god.
examples:
- In the old north, seidr was a kind of magic.
- The story says she learned seidr from her mother.
