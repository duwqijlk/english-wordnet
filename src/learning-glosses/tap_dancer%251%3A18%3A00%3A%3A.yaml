simpleMeaning: a person who makes beats with small metal plates on the toes and heels of the shoes
scope: This is a person who makes beats with metal plates on the shoes; tapper is another name for this
  sense. Not a ballet dancer and not a singer.
examples:
- The tap dancer clicked out a fast beat with her metal shoes.
- A tap dancer at the show made beats with the toes and heels of her shoes.
