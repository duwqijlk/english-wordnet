scope: A tropical growth, one of several close kinds, that bears fruits; capsicum and pepper are other
  names for this sense, not a herb grown for its leaves and not a fruit tree.
examples:
- The capsicum pepper plant bears peppers.
- Grow the capsicum pepper plant in warm, sunny soil.
