senseId: 'becket_bend%1:06:00::'
synsetId: 04196135-n
simpleMeaning: A knot used to tie a rope for a short time to the middle of another rope or to a loop
scope: A knot for tying a rope for a short time to the middle of another rope or to a loop, not a lasting
  knot and not a knot at a rope end.
examples:
- He joined the two ropes with a becket bend that held for the afternoon.
- Use a becket bend when you need to tie a rope to the middle of another.
