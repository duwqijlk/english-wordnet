simpleMeaning: in a sad, bad-tempered way, without wanting to talk to other people
scope: Done sadly and in a bad mood, with little wish to talk, not cheerfully and not in a friendly way.
examples:
- He sat morosely at the table and hardly said a word.
- She stared morosely out of the window at the rain.
