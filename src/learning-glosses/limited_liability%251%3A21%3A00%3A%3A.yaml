senseId: 'limited_liability%1:21:00::'
synsetId: 13418191-n
simpleMeaning: The amount a firm's owners can be made to pay, which is no more than the money they have
  put into the firm.
scope: What a firm's owners may have to pay, capped at the money they put in, not a debt the owners must
  pay in full and not a promise to pay the firm's debts.
examples:
- Limited liability means she could lose only the money she put in.
- The firm was set up with limited liability to guard the owners.
