simpleMeaning: to work as the person who talks live about a sports game, telling people what is happening
  as it happens
scope: This is doing the job of talking live during a sports game. It is not the nearby sense of making
  a spoken or written talk that explains something.
examples:
- She commentates on football matches for a radio station.
- He will commentate on the tennis final this evening.
