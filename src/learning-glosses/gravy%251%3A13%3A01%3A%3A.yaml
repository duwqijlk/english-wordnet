simpleMeaning: A sauce made from the juices and fat that drip from cooking meat, with stock, flour, or
  other things stirred in.
scope: A sauce made from the juices and fat that drip from cooking meat, with stock, flour, or other things
  stirred in, not the plain juices themselves, and not a sudden stroke of good luck.
examples:
- She poured gravy over the roast potatoes.
- The cook thickened the gravy with a little flour.
