simpleMeaning: With flat sides all the same regular shape and equal sides, and corners that all match,
  this is one of only five such shapes.
scope: Also called regular convex polyhedron, regular convex solid, and regular polyhedron, it is one
  of only five shapes whose sides and corners all match, not just any shape with flat sides.
examples:
- In class we built an ideal solid out of card.
- The teacher held up an ideal solid and asked us to count its faces.
