simpleMeaning: To put vegetables in boiling water for a very short time, then take them out.
scope: Not cooking vegetables until they are soft and ready to eat, and not simply washing them in cold
  water.
examples:
- Blanch the beans for a minute before you freeze them.
- She blanched the peas and then dropped them into cold water.
