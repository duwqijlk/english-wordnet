simpleMeaning: in a wrong way, because you think something is true when it is not
scope: 'Also called erroneously: done in a wrong way because of a wrong belief, not done on purpose.'
examples:
- He mistakenly believed the shop was open.
- She mistakenly sent the letter to the wrong address.
