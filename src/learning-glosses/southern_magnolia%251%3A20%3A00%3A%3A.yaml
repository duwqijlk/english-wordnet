scope: A tree that keeps its green leaves all year and has huge white sweet-smelling flowers, also called
  bull bay, evergreen magnolia and large-flowering magnolia; not a tree that loses its leaves in winter
  and not a tree with small plain flowers.
examples:
- The southern magnolia by the gate keeps its shiny leaves all winter.
- A southern magnolia filled the garden with the sweet smell of its huge white flowers.
