simpleMeaning: As steam breathed in, this mix of alcohol and a strong-smelling stuff eases sickness of
  the airways, and it can also be put straight on the skin.
scope: This mix of alcohol and a strong-smelling stuff is breathed in as steam to ease sickness of the
  airways, not a drink.
examples:
- She breathed in the camphor spirit as steam to ease her cough.
- He put camphor spirit straight on his skin.
