senseId: 'curtailment%1:04:00::'
synsetId: 01150463-n
simpleMeaning: the act of keeping a book or other writing from being printed or passed around, or of taking
  it back once it is out
scope: 'Also called suppression: it is keeping a book or writing from print and from passing around, not
  cutting spending and not shortening a text.'
examples:
- The curtailment of the newspaper kept the story from its readers.
- After the curtailment, the book was pulled from the shops.
