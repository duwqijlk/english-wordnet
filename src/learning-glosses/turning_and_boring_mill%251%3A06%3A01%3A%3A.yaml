simpleMeaning: A kind of lathe with a straight-up rod that spins, a flat round plate that lies level,
  for shaping and hollowing big pieces of work.
scope: This is a kind of lathe with a straight-up rod and a flat round plate, not a hand drill and not
  a saw.
examples:
- The turning and boring mill shaped the big steel plate.
- Workers set the part on the turning and boring mill.
