simpleMeaning: an expression people use, usually in the plural, when two dice are thrown and each one
  shows six dots
scope: Words for a throw of two sixes with dice, usually in the plural; not a closed wagon on a train
  for carrying goods and not any other throw of the dice.
examples:
- He rolled boxcars and won the game.
- '''Boxcars!'' she shouted when both dice came up six.'
