simpleMeaning: Cheap paper made from wood pulp (soft wood that has been broken down) and used for printing
  news sheets
scope: This is the cheap paper itself, not the printed news sheets you buy to read, not one printed copy,
  and not the company that prints them.
examples:
- They used bales of newspaper every day at the printing shop.
- A large roll of newspaper was loaded onto the printing press.
