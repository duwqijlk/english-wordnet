simpleMeaning: Too little oxygen in the body caused by slow blood flow to the outer parts, as after the
  heart fails to pump well.
scope: Too little oxygen caused by slow blood flow to the outer parts of the body; stagnant hypoxia is
  another name for this sense, not too little oxygen from thin air and not too little from a blocked lung.
examples:
- Ischemic hypoxia left her fingers cold and pale.
- The ischemic hypoxia followed his heart's failure to pump well.
