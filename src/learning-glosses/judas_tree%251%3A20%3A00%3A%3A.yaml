simpleMeaning: A small eastern Mediterranean plant with many purplish-red flowers growing straight from
  stems on old wood before the leaves, widely grown in mild places; its wood is prized for veneers.
scope: 'Also called love tree, Cercis siliquastrum, and Circis siliquastrum: a small Mediterranean plant
  with purplish-red flowers that open before its leaves, widely grown in mild regions, its wood prized
  for veneers.'
examples:
- The Judas tree was covered in purplish-red flowers before its leaves opened.
- We planted a Judas tree in the mild corner of the garden.
