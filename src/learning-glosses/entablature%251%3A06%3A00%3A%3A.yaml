simpleMeaning: In building, the part of an old-style temple above the tall posts, between the top of a
  post and the roof
scope: In building, this is the part of an old-style temple above the tall posts, between the top of a
  post and the roof, not the posts themselves and not the roof itself.
examples:
- The entablature runs above the tall posts of the temple.
- Carved figures filled the entablature between the post tops and the roof.
