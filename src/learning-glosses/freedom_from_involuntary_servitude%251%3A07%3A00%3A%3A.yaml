simpleMeaning: 'a civil right set down in the 13th change to the US Constitution: no one may be made to
  work for another person against their will'
scope: A civil right against being made to work for another person, not the right against harsh acts by
  the state and not the right to be left alone by the police.
examples:
- The freedom from involuntary servitude ended forced labour in the United States.
- The 13th amendment protects the freedom from involuntary servitude.
