simpleMeaning: a living thing that is kin to another, because they share a line of birth or are in the
  same group of living things
scope: A living thing that is kin to another by shared birth or group, not a person in the same family
  and not a word that means judged by what it is set against.
examples:
- The wolf is a close relative of the dog.
- This plant is a relative of the rose.
