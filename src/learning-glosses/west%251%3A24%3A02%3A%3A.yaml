simpleMeaning: the direction you face when the sun goes down, or the way toward that side.
scope: It is not the exact compass mark at 270 degrees and not the western part of a country; it is the
  general direction of sunset.
examples:
- The sun sets in the west.
- He looked to the west and saw dark clouds.
