simpleMeaning: Mostly photosynthetic single-celled organisms without a nucleus, carrying a blue pigment
  besides chlorophyll; they live alone or in colonies in many habitats and are important as plankton.
scope: These are the blue-pigmented, nucleus-free organisms also called blue-green algae; they are not
  green algae, which have a nucleus and no blue pigment.
examples:
- Cyanobacteria were among the first organisms to release oxygen into the atmosphere.
- Warm, nutrient-rich water can let cyanobacteria multiply into harmful blooms.
