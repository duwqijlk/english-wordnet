simpleMeaning: A sudden sickness, spread by a virus, that makes the nerve cells of the brain stem and
  the cord down the back sore and swollen.
scope: Polio, acute anterior poliomyelitis and infantile paralysis are other names for this sudden virus
  sickness that makes the nerve cells of the brain stem and the cord down the back sore and swollen.
examples:
- The child caught poliomyelitis.
- The doctor treated the child for poliomyelitis.
