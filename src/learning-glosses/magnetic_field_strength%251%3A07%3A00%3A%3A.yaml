simpleMeaning: What this counts is the pull from a magnet that passes straight across the way it moves,
  through one small flat bit of space
scope: Also called magnetic flux density, magnetic induction and magnetic intensity, this is how much
  pull from a magnet passes through a small flat bit of space, not the pull itself and not the act of
  making a thing pull.
examples:
- The magnetic field strength near the magnet was high.
- They measured the magnetic field strength across the coil.
