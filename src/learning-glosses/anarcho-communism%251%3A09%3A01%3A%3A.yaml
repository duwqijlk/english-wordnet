simpleMeaning: A political theory that seeks to abolish the state, capitalism, wages and private property,
  respects personal belongings, and favours common ownership of production, direct democracy, voluntary
  associations and workers' councils.
scope: 'Another name for anarchist communism: the anarchist theory that wants the state and capitalism
  abolished and production held in common; not anarcho-syndicalism, and not democratic socialism.'
examples:
- Anarcho-communism rejects both the state and wage labour in favour of shared production.
- By the 1890s, anarcho-communism had become the dominant strain in much of the movement.
