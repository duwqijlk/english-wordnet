senseId: 'rebirth%1:04:00::'
synsetId: 00095608-n
simpleMeaning: a strong new understanding about faith and the spirit that makes a person start to live
  a new life
scope: This sense, also called conversion, is a new start in this life after a deep change in faith, not
  being born again in a new body after death.
examples:
- After years of doubt, she described her new faith as a rebirth.
- His rebirth as a kind man followed a deep change in his beliefs.
