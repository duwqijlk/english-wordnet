simpleMeaning: In law, questions put to a witness by the side that first called them, after the other
  side has questioned them
scope: 'Also called a reexamination: in law, questions from the side that first called a witness, asked
  after the other side has questioned them, not the first questioning and not the other side''s questioning.'
examples:
- During the redirect examination, the lawyer asked the witness to explain her first answer.
- The redirect examination gave the witness a chance to clear up the last point.
