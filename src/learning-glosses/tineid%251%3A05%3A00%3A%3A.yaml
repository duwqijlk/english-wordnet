simpleMeaning: small pale yellow moths whose young eat wool or fur
scope: Also called tineid moth, this is a small pale yellow moth whose young eat wool or fur; not the
  dull-colored moth with mouth parts made for chewing, and not a moth that eats only plants.
examples:
- A tineid flew out of the old wool coat.
- Tineids damaged the wool blanket in the attic.
