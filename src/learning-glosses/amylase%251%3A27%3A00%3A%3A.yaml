simpleMeaning: Starch turns into sugar with the help of one of a group of proteins found in spit, in juice
  from the pancreas, and in parts of plants.
scope: This protein is one of a group found in spit, in juice from the pancreas, and in parts of plants,
  and it helps turn starch into sugar.
examples:
- Spit holds amylase, which starts to turn starch into sugar.
- Juice from the pancreas holds amylase, which helps turn starch into sugar.
