simpleMeaning: The basic form of a word that tells what something is like or how it is done, used alone
  with nothing added to say more, less, or the most.
scope: Positive is another name for this basic form, which says what something is like or how it is done
  without comparing it with anything else.
examples:
- In 'a tall tree', the word 'tall' is in the positive degree.
- The word 'hot' is in the positive degree in 'the soup is hot'.
