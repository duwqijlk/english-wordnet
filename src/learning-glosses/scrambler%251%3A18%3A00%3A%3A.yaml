simpleMeaning: A swift mover, one who scrambles.
scope: This sense is a swift mover, one who scrambles, unlike the sense for a light motorbike, with tough
  tyres and springs, made to ride cross-country or over rough ground, and unlike the sense for wire gear
  that makes speech unclear while sent, and makes it plain again on receipt.
examples:
- The scrambler is a swift mover.
- Scramblers scramble fast.
