simpleMeaning: Often used to back a promise to pay, like a home loan or a signed note, this written paper
  by law hands things to one who looks after them.
scope: This written paper is also called a deed of trust.
examples:
- The trust deed handed the house to the bank until the loan was paid.
- They signed a trust deed to back the promise to pay.
