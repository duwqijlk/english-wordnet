synsetId: 13592244-n
simpleMeaning: In photography, film worked on too little, so the picture lacks the sharp contrast of light
  and dark it should have.
scope: In photography, film worked on too little, not film left too long in the chemicals and not a picture
  that came out too dark for another reason.
examples:
- Underdevelopment left the photo pale, with little contrast between light and dark.
- The underdevelopment of the film made the faces hard to see.
