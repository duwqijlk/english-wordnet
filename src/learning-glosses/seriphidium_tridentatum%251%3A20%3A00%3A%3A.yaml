simpleMeaning: A sweet-smelling bush of the dry lands of western North America, with grey-white leaves.
scope: This sweet-smelling bush grows in the dry lands of western North America and has grey-white leaves;
  big sagebrush, blue sage and Artemisia tridentata are other names for this sense.
examples:
- Seriphidium tridentatum covers the dry hills of western North America.
- The grey-white leaves of Seriphidium tridentatum smell sweet when crushed.
