simpleMeaning: Hydrogen atoms in a chain of carbon and hydrogen give way to atoms of a halogen in this
  carbon-based compound.
scope: 'Also called haloalkane: a carbon-based compound in which halogen atoms take the place of hydrogen
  atoms, not a compound with no halogen in it.'
examples:
- The alkyl halide formed when chlorine took the place of hydrogen.
- Chemists sort the alkyl halide by the halogen it holds.
