simpleMeaning: A pretty African bush or climbing plant with red flowers.
scope: A pretty African bush or climbing plant with red flowers; hiccough nut is another name for this
  sense, and this is not a tree or a plant with flowers of another colour.
examples:
- A hiccup nut climbed the wall, covered in red flowers.
- The garden grew a hiccup nut for its bright red blooms.
