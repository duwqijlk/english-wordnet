senseId: 'uptick%1:04:00::'
synsetId: 01112878-n
simpleMeaning: on the stock market, a buy or sale at a price higher than the price of the one just before
  it
scope: This is one single buy or sale on the stock market at a higher price than the last one, not a general
  rise in prices over time and not a sale at a lower price.
examples:
- The shares closed on an uptick, with the last sale higher than the one before it.
- Traders saw an uptick when the stock sold for more than in the sale just before.
