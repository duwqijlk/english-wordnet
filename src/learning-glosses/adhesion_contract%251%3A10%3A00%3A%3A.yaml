simpleMeaning: a printed form deal that ties one side down hard and leaves the other free, so the two
  sides do not bargain as equals
scope: It is also called a contract of adhesion, and it is a printed form deal that ties one side down
  hard while the other side stays free.
examples:
- They gave her an adhesion contract to sign.
- Under the adhesion contract, one side had no room to bargain.
