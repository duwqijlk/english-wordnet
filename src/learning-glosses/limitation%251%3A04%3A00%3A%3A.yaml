simpleMeaning: The act of setting a bound on a thing, as by a rule.
scope: This is the act of setting a bound, also called a restriction, not a rule that sets the bound or
  the state of being bound.
examples:
- The limitation of parking to two hours kept the street clear.
- Their limitation of water use during the dry season saved the town.
