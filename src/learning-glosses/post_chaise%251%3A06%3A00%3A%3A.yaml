simpleMeaning: a closed four-wheeled carriage pulled by horses, used in the past to carry people and mail
scope: This is a closed horse carriage from the past that carried people and mail, not an open carriage
  and not a modern car or bus.
examples:
- They rode to town in a post chaise with the windows shut against the rain.
- The post chaise carried both passengers and bags of mail along the old road.
