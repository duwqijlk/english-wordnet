simpleMeaning: A set-up used in industry to cool hot water, by letting some of it turn to steam, before
  the water is used again to carry heat away.
scope: This is a set-up in industry that cools hot water before it is used again, not the fluid that carries
  heat away and not a tall building.
examples:
- The cooling tower loomed over the power plant.
- Hot water runs through the cooling tower before it is used again.
