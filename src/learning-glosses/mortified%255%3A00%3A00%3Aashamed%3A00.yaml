scope: This is feeling uneasy and ashamed because your pride has been hurt, and embarrassed and humiliated
  are other names for it, not just feeling shy and not being afraid.
examples:
- She felt mortified when everyone laughed at her mistake.
- He was mortified by the comparison with his sister.
