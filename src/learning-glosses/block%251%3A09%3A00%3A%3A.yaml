simpleMeaning: The state of being unable to recall or come up with something you would normally manage
  easily, often because of emotional tension.
scope: A failure to recall or work out something one can normally do, often from emotional tension; not
  the verb meaning to be unable to remember, not a unit of data, not an obstruction in a pipe, not a ban
  on using assets, and not interference with signals.
examples:
- She had a block and could not recall the word she wanted.
- During the interview I had a block and could not remember my own address.
