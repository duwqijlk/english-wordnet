simpleMeaning: a tree with a slim top that grows in the east of North America
scope: 'Also called big-toothed aspen, bigtooth aspen, large tooth aspen and large-toothed aspen: a tree
  with a slim top in the east of North America, not a wide-spreading poplar and not a western aspen.'
examples:
- We planted a bigtoothed aspen beside the house, and its slim top rose above the roof.
- Bigtoothed aspens line the road through the eastern woods.
