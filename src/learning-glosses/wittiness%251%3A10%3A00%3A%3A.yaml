simpleMeaning: A thing said or written that is clever, well put, or odd in a way that makes people laugh
scope: 'Also called humor, wit, humour and witticism: a clever or odd thing said or written that makes
  people laugh, not a joke that tricks someone and not a funny act.'
examples:
- Her wittiness kept the whole room laughing.
- His wittiness shows in every line he writes.
