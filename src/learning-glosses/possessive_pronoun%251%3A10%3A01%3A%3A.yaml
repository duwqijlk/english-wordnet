simpleMeaning: a word like mine, yours, hers, or theirs that shows that something belongs to someone or
  something
scope: This is a word that shows that a thing belongs to someone or something, not a word that names a
  person or a thing itself.
examples:
- In 'The book is mine,' mine is a possessive pronoun.
- She used the possessive pronoun theirs to show the coats belonged to them.
