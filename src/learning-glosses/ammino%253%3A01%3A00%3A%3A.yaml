simpleMeaning: of or like an ammine, a compound of ammonia and a metal salt, not made from living things,
  joined in a set pattern
scope: Of or like an ammine, not an amine and not a salt on its own.
examples:
- The ammino salt formed when ammonia joined the metal salt.
- Ammino compounds hold ammonia and a metal salt together.
