simpleMeaning: small jumping sea creatures, like tiny shrimps, that hop high and are common on ocean beaches
scope: This is a small jumping sea creature common on ocean beaches, also called a beach flea, a sand
  hopper or a sandhopper; not a real flea and not a shrimp.
examples:
- Sand fleas hopped all over the wet beach.
- The children felt sand fleas jumping on their feet.
