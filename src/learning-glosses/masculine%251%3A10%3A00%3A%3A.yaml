simpleMeaning: words used for males and for things treated as male, in grammar — most of the time, but
  not always
scope: A grammar term for a word-form that is mostly, but not only, about males; not the music or poetry
  sense of ending on a strong beat, and not the adjective sense of being like a man.
examples:
- In French, the word for 'sun' is masculine.
- The teacher said the noun takes a masculine form.
