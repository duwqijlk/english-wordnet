simpleMeaning: the wood of any of several trees of the group called Castanea
scope: The wood of any of several trees of the group called Castanea; not the tree itself, not its nut,
  not the hard spot on a horse's leg, and not the brown colour.
examples:
- The table was made of chestnut, dark and hard.
- Chestnut from the old trees lined the barn walls.
