simpleMeaning: an electric switch that you press to make something work
scope: 'Also called push: an electric switch you press, not the piece sewn on clothes, not a badge, and
  not the area you click on a screen.'
examples:
- She pressed the button to start the lift.
- He pressed the button beside the bed to call for help.
