simpleMeaning: present but not yet seen, and able to become real or active in time
scope: This is about a power or quality that is there but not yet seen or used; not about something that
  is gone, and not about something that was never there.
examples:
- He has a latent talent for music that no one has seen yet.
- A latent illness can stay hidden for years before it shows.
