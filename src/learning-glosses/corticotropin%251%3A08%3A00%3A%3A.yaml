simpleMeaning: The front part of the small gland at the base of the brain makes it, and it stirs the outer
  layer of the small glands above the kidneys.
scope: This chemical, made by the front part of the small gland at the base of the brain, stirs the outer
  layer of the small glands above the kidneys and is also called corticotrophin, adrenocorticotrophin,
  adrenocorticotropin, adrenocorticotrophic hormone or adrenocorticotropic hormone.
examples:
- The glands above the kidneys began to work when corticotropin reached them.
- Corticotropin was found in his blood.
