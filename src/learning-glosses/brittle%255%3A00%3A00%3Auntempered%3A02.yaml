simpleMeaning: Of metal or glass that was never softened by slow heating and cooling, so it cracks or
  breaks with ease.
scope: Metal or glass left unsoftened and easy to crack, not a thing that merely bends little, not the
  sweet, and not a cold heart.
examples:
- The brittle glass shattered at a touch.
- Untempered steel is brittle and snaps under strain.
