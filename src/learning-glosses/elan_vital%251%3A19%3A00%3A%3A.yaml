simpleMeaning: In biology, Henri Bergson once said a supposed power drives how living things change and
  grow, a power that is not one of matter and not one of chemicals.
scope: Vitality, life force, and vital force are other names for this supposed power in biology that Henri
  Bergson once said drives how living things change and grow.
examples:
- Bergson wrote of an elan vital that pushed living things to change.
- He claimed an elan vital drove living things to grow into new forms.
