simpleMeaning: A long-lasting skin illness, found above all in women aged 20 to 40, that brings out red
  sore patches on the cheeks and on the bridge of the nose
scope: A long-lasting skin illness with red patches on the face, not a short-lived rash.
examples:
- Discoid lupus erythematosus left red marks across her cheeks.
- The doctor said discoid lupus erythematosus mostly affects young women.
