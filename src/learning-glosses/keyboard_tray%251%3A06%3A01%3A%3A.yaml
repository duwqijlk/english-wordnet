simpleMeaning: Part of a computer desk, this board slides out so the set of letter buttons you type on
  can rest on it
scope: 'Another name for a keyboard shelf: a sliding board under a computer desk that holds the typing
  buttons, not a drawer for papers and not a shelf for books.'
examples:
- The keyboard tray slides out from under the desk when he needs to type.
- She keeps the keyboard tray pulled out while she works at the computer.
