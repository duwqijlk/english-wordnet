simpleMeaning: of or about the study of how liquids and soft things flow and change shape
scope: This word links a thing to the study of how liquids and soft things flow and change shape. It is
  not a word for a liquid itself, and not about the study of living things.
examples:
- They did rheological tests to see how the thick paint flows.
- The rheological behaviour of the mud changed when it got wet.
