simpleMeaning: Befitting a person of high standing, said of how someone looks or acts.
scope: 'Also called grand, imposing, and distinguished: befitting a person of high standing, said of how
  someone looks or acts, not the sense of one who gives orders and expects to be obeyed, and not the sense
  of a magistrate.'
examples:
- The judge spoke in a magisterial voice.
- She reigned in magisterial beauty.
