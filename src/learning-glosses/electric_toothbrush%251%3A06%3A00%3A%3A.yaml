simpleMeaning: its head shakes fast, moved by a small motor in the handle of a brush for the mouth
scope: A mouth brush whose head shakes fast on a motor, not a plain brush moved by hand and not a brush
  for hair.
examples:
- Her electric toothbrush buzzed as she brushed.
- The head of his electric toothbrush shook fast as he brushed.
