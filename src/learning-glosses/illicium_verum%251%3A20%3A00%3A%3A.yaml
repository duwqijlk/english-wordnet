simpleMeaning: A small tree of China and Vietnam with star-shaped fruit that smells of anise, used in
  cooking and as a medicine to ease wind in the gut
scope: A small tree with star-shaped anise-scented fruit; star anise and Chinese anise are other names
  for this sense, not a spice tree grown only for timber or a fruit tree grown for fresh eating.
examples:
- Illicium verum fruit flavours the soup with a sweet anise taste.
- The cook ground Illicium verum into the spice mix.
