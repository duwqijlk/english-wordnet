senseId: 'technicality%1:26:00::'
synsetId: 14604142-n
simpleMeaning: the state of using the special words or special ways of a subject or trade
scope: This is about how much a thing uses special words or ways from a subject or trade; it is not one
  small point in a law or a set of rules.
examples:
- The court system suffered from too much technicality and stiff form.
- The technicality of the language in the report made it hard for new workers to follow.
