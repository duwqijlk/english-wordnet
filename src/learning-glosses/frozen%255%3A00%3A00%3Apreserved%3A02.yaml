simpleMeaning: 'used of food: kept fresh by being made very cold, fast enough to keep its taste and the
  good things in it for health'
scope: Used only for food kept in this cold way, not for water turned to ice, not for prices that cannot
  change, and not for an unfriendly look or greeting.
examples:
- We bought frozen peas and kept them for next week.
- The frozen vegetables still tasted fresh after three months.
