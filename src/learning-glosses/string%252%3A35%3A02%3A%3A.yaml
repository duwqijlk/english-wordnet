simpleMeaning: to put things onto a thin cord, or to join things as if they were on a thin cord
scope: 'Also called thread: to put things onto a thin cord, or to join things as if they were on a thin
  cord, not to spread things out in a line and not to add one thing after another.'
examples:
- She will string the beads onto a thin cord.
- He learned to string pearls for a necklace.
