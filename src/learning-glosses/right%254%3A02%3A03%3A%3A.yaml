simpleMeaning: Toward or on the side of the body opposite the left, and also used in a figurative way.
scope: This is not the sense meaning correctly or suitably, and not the informal intensifier; it gives
  direction toward one side, literally or figuratively.
examples:
- Turn right at the traffic lights.
- The party has moved right since the election.
