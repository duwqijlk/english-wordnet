simpleMeaning: the lowest back part of the brain, joined to the spinal cord, and an old name for the medulla
  oblongata (the same part)
scope: The lowest back part of the brain, joined to the spinal cord (the main cord of nerves in the back),
  not an electric light and not a plant part under the ground.
examples:
- The doctor said the injury was near the bulb, at the back of the brain.
- Damage to the bulb, the lowest back part of the brain, can affect breathing.
