simpleMeaning: a room that can be filled with steam, where people wash, a name used in Britain
scope: 'Also called a steam bath, a steam room and a vapor bath: a room of steam for washing, not a bath
  of hot water and not a shower.'
examples:
- He sat in the vapour bath for ten minutes after his run.
- The hotel has a vapour bath next to the pool.
