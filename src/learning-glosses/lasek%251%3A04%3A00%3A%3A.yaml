simpleMeaning: An eye operation that bends light better by reshaping the clear front of the eye, lifting
  a thin hinged flap in its top skin
scope: Also called laser-assisted subepithelial keratomileusis or E-LASIK; this is the eye operation that
  lifts a flap in the top skin of the eye, not other eye operations that reshape the eye.
examples:
- She had LASEK to see without glasses.
- LASEK reshapes the front of the eye.
