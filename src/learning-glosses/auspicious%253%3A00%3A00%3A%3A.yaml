senseId: 'auspicious%3:00:00::'
synsetId: 00177411-a
simpleMeaning: showing that things are likely to go well and that good luck is likely to come
scope: This sense is about a sign or a start that shows things will go well, not about luck that a person
  already has.
examples:
- It was an auspicious start to the new school year.
- They chose an auspicious day to open the shop.
