simpleMeaning: the fatty stuff inside bones, made of a web of tissue that fills the hollow parts
scope: The soft stuff inside bones, not the squash plant and not the best part of an idea.
examples:
- The cook scooped the marrow from the bone.
- Bone marrow makes new blood cells.
