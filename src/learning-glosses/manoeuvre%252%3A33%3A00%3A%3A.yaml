simpleMeaning: to move soldiers or ships in war in a planned way to get a better place for attack or for
  keeping safe
scope: To move soldiers or ships in war, also called operate and maneuver. Not a skilled physical move,
  and not an action to get away from an opponent.
examples:
- The army manoeuvred its ships into place before the attack.
- Troops manoeuvred to hold a strong place and keep safe.
