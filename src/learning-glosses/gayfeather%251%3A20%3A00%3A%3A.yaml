simpleMeaning: Small round flat flower heads grow in branching bunches on this North American plant, one
  of several kinds in the group Liatris.
scope: Also called gay-feather, blazing star, button snakeroot, or snakeroot, this North American plant
  of the group Liatris bears small round flat flower heads in branching bunches.
examples:
- The gayfeather bore branching bunches of small flower heads.
- She picked a gayfeather with round flat flower heads.
