simpleMeaning: the ring muscle at the end of the stomach that closes the way into the first part of the
  gut
scope: 'Also called the pyloric sphincter or the pyloric valve: the ring muscle at the end of the stomach
  that closes the way into the first part of the gut; not a muscle of the throat and not the stomach itself.'
examples:
- The musculus sphincter pylori closed after the meal.
- Food passes the musculus sphincter pylori into the gut.
