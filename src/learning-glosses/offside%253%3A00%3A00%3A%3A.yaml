simpleMeaning: In sport, in a place that the rules do not allow, past a set line or area, or ahead of
  the ball or puck
scope: 'Also called offsides: in sport, in a place the rules do not allow; it is not the noun sense for
  the mistake itself, and not the word that tells how a player moves.'
examples:
- The offside player was standing ahead of the ball when the pass came.
- She took an offside position, past the last line the rules allow.
