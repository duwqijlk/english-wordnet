simpleMeaning: a cord of the body that tends to make the part it serves work less hard or grow less firm
scope: A cord of the body that tends to quiet the part it serves, also called a depressor, and not a cord
  that wakes a part up or one that carries feeling.
examples:
- The depressor nerve slows the heart when the body is at rest.
- A depressor nerve in the arm tends to ease the pull of the muscle.
