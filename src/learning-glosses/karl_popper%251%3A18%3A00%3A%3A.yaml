simpleMeaning: A British thinker, born in Austria, who said ideas in science can never be shown true,
  only tested by trying to show them false (1902-1994)
scope: Also called Popper or Sir Karl Raimund Popper; this is the thinker who said ideas are tested by
  trying to show them false, not other British thinkers.
examples:
- Karl Popper wrote about how science works.
- Students still read Karl Popper today.
