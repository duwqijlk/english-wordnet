senseId: 'irregularity%1:07:00::'
synsetId: 04777450-n
simpleMeaning: the quality of not having a fixed pattern or rate, and of not happening at set times
scope: The quality of not being fixed in rate or time. Not behavior that breaks rules, not an uneven shape,
  and not a problem with the bowels.
examples:
- The irregularity of the bus service made it hard to plan.
- She noticed an irregularity in the heartbeats, which did not come at set times.
