simpleMeaning: A thin cooked rice dish from China, eaten in the morning.
scope: A thin cooked rice dish from China eaten in the morning; congee is another name for it, not a thick
  rice dish and not a dish eaten at night.
examples:
- She ate a bowl of jook for breakfast.
- The jook was still warm when we sat down.
