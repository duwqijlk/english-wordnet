simpleMeaning: Medium-to-large, shedding its leaves each year, this oak of central and eastern North America
  has egg-shaped acorns sunk in wide fringed cups and produces hard wood of close grain.
scope: 'Another spelling of mossy-cup oak and another name for bur oak: the same central and eastern North
  American oak with fringed acorn cups; not a moss-covered tree or another oak.'
examples:
- Mossycup oak wood is tough and close-grained.
- We found a mossycup oak with acorns in wide fringed cups.
