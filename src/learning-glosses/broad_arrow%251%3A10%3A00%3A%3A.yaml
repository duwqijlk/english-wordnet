simpleMeaning: a mark in the shape of a dart's point, put on the clothes of prisoners
scope: This is a mark in the shape of a dart's point, put on the clothes of prisoners, not a maker's mark
  and not a brand burned on cattle.
examples:
- The broad arrow on his coat showed he was a convict.
- Prison clothes once bore a broad arrow.
