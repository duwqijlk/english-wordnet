simpleMeaning: the sweet and hot fruits of plants in the Capsicum group (one group of plants that are
  close in kind)
scope: The fruits themselves, eaten as food; not the hot spice used to give food taste, and not the plant
  that bears them.
examples:
- She cut a red pepper into thin strips for the salad.
- Some peppers are sweet, while others are hot enough to make your mouth burn.
