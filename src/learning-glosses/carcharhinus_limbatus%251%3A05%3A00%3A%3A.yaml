simpleMeaning: A shallow-water shark found widely, with fins that look as if dipped in ink.
scope: Also called blacktip shark and sandbar shark, this shallow-water shark found widely is known by
  fins that look as if dipped in ink, distinct from the fairly slender blue-grey dusky shark, sharks of
  deep water, and sharks found only in one small area.
examples:
- The Carcharhinus limbatus swam in shallow water near the reef.
- Its fins looked dipped in ink, a mark of the Carcharhinus limbatus.
