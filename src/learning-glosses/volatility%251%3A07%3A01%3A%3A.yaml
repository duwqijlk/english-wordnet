simpleMeaning: the quality of being unable to make a firm decision and changing in ways no one can predict
scope: 'Also called unpredictability: a person''s way of changing and not deciding firmly, not a material
  changing easily into a gas.'
examples:
- Her volatility made it hard to know what she would agree to.
- His volatility at work meant he changed his mind every hour.
