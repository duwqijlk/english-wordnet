simpleMeaning: a grass of the Mediterranean that lives one year, or through one winter, and has soft,
  hairy leaves
scope: 'Also called cheatgrass, downy bromegrass, downy cheat, downy chess and drooping brome: a Mediterranean
  grass that lives one year, or through one winter, with soft, hairy leaves, not a grass that lives many
  years and not a grass with smooth leaves.'
examples:
- Downy brome grew along the edge of the field.
- The downy brome in the field had soft, hairy leaves.
