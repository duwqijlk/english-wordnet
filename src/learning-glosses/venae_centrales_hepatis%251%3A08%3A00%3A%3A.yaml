simpleMeaning: Blood from the small blood spaces of the liver flows into the last small branches of the
  liver veins, which lie in the small parts of the liver.
scope: These last small branches of the liver veins are also called the central veins of liver.
examples:
- The venae centrales hepatis receive blood from the liver sinusoids.
- Blood from the liver sinusoids flows into the venae centrales hepatis.
