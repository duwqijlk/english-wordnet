simpleMeaning: said in a strong, open way, with great joy and energy, and not held back
scope: 'Also called gushing and burbling: said with strong, open joy and energy. It is not quiet, calm
  or held back in feeling.'
examples:
- She gave an effusive welcome, smiling and talking with great joy.
- His effusive thanks went on and on after the help.
