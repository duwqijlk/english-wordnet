simpleMeaning: Blooms with cut edges, rose-coloured, grow on this low herb of southern California, with
  thin wiry branching stems.
scope: 'It is also called fringed pink and ground pink: a low herb of southern California with rose-coloured
  blooms with cut edges, not the phlox of the same name.'
examples:
- Moss pink grows low.
- Moss pink blooms have cut edges.
