simpleMeaning: to move a liquid or other thing around with a short, flat tool held in the hand
scope: To stir a liquid with a flat tool, not to move a boat forward with that tool and not the tool itself.
examples:
- He paddled the paint slowly to mix in the color.
- She paddled the thick batter in slow circles.
