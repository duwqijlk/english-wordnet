simpleMeaning: a loose, crumbly earthy deposit made chiefly of the minerals calcite or dolomite, used
  to fertilize soil short of lime
scope: A lime-rich crumbly earth, not solid limestone or pure clay.
examples:
- The farmer spread marl across the field to give the soil the lime it lacked.
- Under the grass lay a loose, crumbling layer of marl.
