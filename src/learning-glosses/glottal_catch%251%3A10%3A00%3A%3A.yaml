senseId: 'glottal_catch%1:10:00::'
synsetId: 07132303-n
simpleMeaning: At the voice box, air held back is let go with a sharp burst, making a speech sound that
  starts a vowel.
scope: Also called a glottal plosive or a glottal stop, this is the name for the sound a speaker makes
  by holding back air at the voice box and letting it go just as a vowel starts.
examples:
- The glottal catch came at the start of the vowel.
- She made a glottal catch before the vowel sound.
