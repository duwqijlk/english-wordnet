simpleMeaning: To make someone cross by small things that keep getting in the way
scope: 'Also called annoy, bother, chafe, devil, get at, get to, gravel, irritate, nettle, rag, rile and
  vex: to make a person cross by small troubles, not to make them cross by one big wrong and not to please
  them.'
examples:
- His loud chewing really narks me.
- It narks her when he leaves the door open.
