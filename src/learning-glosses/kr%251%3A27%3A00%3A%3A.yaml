simpleMeaning: A gas with no colour, one of six gases that do not join with other things; it is found
  in tiny amounts in the air.
scope: A gas with no colour, one of six gases that do not join with other things, also called atomic number
  36 and krypton; its near kin are the other five inert gases, such as neon and argon.
examples:
- Kr is one of the six inert gases.
- A trace of Kr is found in the air.
