synsetId: 00852055-n
simpleMeaning: In genetics, two sorts of animal or plant are mixed together, and the young that result
  are a mix of both
scope: In genetics, mixing different kinds of animal or plant so their young are a mix of both, also called
  cross, crossbreeding, crossing, hybridisation, hybridizing and interbreeding; not crossing within one
  kind and not the young themselves.
examples:
- Hybridization helped the farmer grow corn that could stand the cold.
- Through hybridization, the two kinds of dog produced pups with traits from both.
