senseId: 'force_per_unit_area%1:19:00::'
synsetId: 11515441-n
simpleMeaning: The push put on one small part of a surface, measured in pascals, the SI measure, or in
  dynes, the cgs measure.
scope: A push on a bit of surface, measured in pascals or dynes; pressure is another name for this sense,
  not a push on a whole thing and not a weight.
examples:
- The force per unit area on the wall grew as the gas was squeezed.
- Engineers work out the force per unit area before they build the tank.
