simpleMeaning: One of a number of big insects of North America, most often brown, that eat leaves and
  are seen in late spring, and whose young feed on roots of grasses.
scope: One of a number of big insects of North America, most often brown, that eat leaves and are seen
  in late spring, whose young feed on roots of grasses; also called June beetle, May beetle and May bug,
  not a small beetle of summer or one whose young eat leaves.
examples:
- June bugs flew around the porch light.
- A June bug landed on the window screen.
