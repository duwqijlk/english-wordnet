simpleMeaning: Feeding in the polar seas and breeding in the tropics, this tuna of mild seas grows to
  1500 pounds, the biggest of its kind.
scope: Also called bluefin and bluefin tuna, it is a tuna of mild seas, not the large food fish of the
  Atlantic waters of Europe that shares its name.
examples:
- The horse mackerel weighed 1500 pounds.
- Horse mackerel feed in polar seas but breed in the tropics.
