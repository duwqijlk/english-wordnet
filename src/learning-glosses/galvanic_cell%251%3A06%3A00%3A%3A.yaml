simpleMeaning: 'It cannot be filled with power again: a power unit that makes a push of electricity from
  a change in chemicals that cannot be undone.'
scope: A primary cell or a voltaic cell is another name for this power unit, which makes electricity from
  a change in chemicals that cannot be undone.
examples:
- The galvanic cell gave power until its chemicals ran out.
- The torch stopped working when its galvanic cell ran out.
