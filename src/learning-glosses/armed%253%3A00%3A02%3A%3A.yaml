simpleMeaning: Having sharp points, said of a plant or an animal, with stiff hairs or thorns
scope: Sharp points on a plant or animal, not a person carrying weapons.
examples:
- The armed thistle scratched her leg as she walked past.
- An armed cactus is hard to hold.
