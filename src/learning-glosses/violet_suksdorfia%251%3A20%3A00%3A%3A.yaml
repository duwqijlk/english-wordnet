simpleMeaning: a slender, delicate plant with rounded, deeply lobed leaves and funnel-shaped flowers in
  deep pink to violet, from British Columbia to northern Oregon and as far as Idaho and Montana.
scope: This is the slender pink-flowered plant of the Pacific Northwest, not a common garden violet.
examples:
- A patch of violet suksdorfia covered the damp slope.
- We found violet suksdorfia growing beside a mountain trail.
