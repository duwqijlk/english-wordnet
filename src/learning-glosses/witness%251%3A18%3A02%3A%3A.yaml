simpleMeaning: In law, a person who puts their own signature (their name written by hand) on a document
  to say the document or the written name on it is true
scope: In law, this person signs a paper to show it is real; it is not the act of seeing something happen,
  and not just a person who saw an event.
examples:
- The witness signed her name under his on the form to show it was real.
- Two people signed as witnesses when she put her name on the paper.
