simpleMeaning: a forceful way of speaking or writing that holds attention and convinces.
scope: 'This is the force and bite of a style, not the idea being argued: it is not ''the point'' in the
  sense of the main meaning of something, and not a single fact or item. The use is literary and somewhat
  old-fashioned, and survives mainly in criticism of prose and speech. It is also not the sharp tapering
  of a shape.'
examples:
- 'The speech had point: nobody in the hall looked away.'
- His writing lacks point; it is fluent, but nothing in it stays with you.
