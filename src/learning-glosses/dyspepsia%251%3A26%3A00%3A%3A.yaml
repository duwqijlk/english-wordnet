simpleMeaning: a problem with how food is digested, marked by discomfort, burning in the chest, or feeling
  sick
scope: A problem with how food is digested, also called indigestion, stomach upset, and upset stomach;
  not a stomach ulcer and not food poisoning.
examples:
- He suffered from dyspepsia after rich meals.
- Dyspepsia left her with a burning feeling in her chest.
