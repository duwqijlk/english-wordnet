simpleMeaning: 'In statistics, a number showing how closely two changing things move together: -1 means
  a perfect opposite move, 0 means no link, and +1 means a perfect same-way move'
scope: Also called coefficient of correlation and correlation coefficient; this is the number that shows
  the link, not the wider link itself between two changing things.
examples:
- The correlation between study time and test scores was close to +1.
- Researchers found a weak correlation between rainfall and crop growth.
