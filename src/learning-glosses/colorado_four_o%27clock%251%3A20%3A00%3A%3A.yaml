simpleMeaning: A wildflower with bright deep-pink tube-shaped flowers that open in the evening; it grows
  in sand and dry land from southern California to the southern Rockies and into Mexico.
scope: Also called a desert four o'clock, maravilla, or Mirabilis multiflora; a wildflower of sandy dry
  lands with deep-pink evening flowers, kin to other evening-opening wildflowers.
examples:
- Colorado four o'clock opens its deep pink flowers as the evening comes.
- We found Colorado four o'clock growing in the sandy desert near the road.
