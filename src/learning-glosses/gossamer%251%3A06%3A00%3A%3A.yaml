simpleMeaning: a very thin, light cloth (gauze) that has a very fine surface
scope: A very thin, light cloth with a very fine surface, not the thin threads from a spider's web and
  not the word for something light and delicate.
examples:
- Her veil was made of pale gossamer.
- She sewed a layer of gossamer over the dress.
