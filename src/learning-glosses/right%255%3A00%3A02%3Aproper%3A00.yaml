simpleMeaning: Following the accepted standards for how something should be done or used.
scope: This is not the sense of being best suited to a purpose, and not the direction or hand senses;
  it means following accepted standards or procedure.
examples:
- The right way to address a judge is 'Your Honor'.
- Use the right form when you apply for a passport.
