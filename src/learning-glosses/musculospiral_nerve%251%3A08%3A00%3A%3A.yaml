synsetId: 05512458-n
simpleMeaning: 'Biggest branch of the shoulder''s nerve network: it runs down the upper-arm bone to a
  bony point at the outer elbow, then splits to back-of-hand skin and underlying straightening muscles.'
scope: Another name for the radial nerve (nervus radialis); the big nerve of the arm, not the median or
  ulnar nerve.
examples:
- The musculospiral nerve passes down the arm beside the upper-arm bone.
- The musculospiral nerve splits into branches near the outer elbow.
