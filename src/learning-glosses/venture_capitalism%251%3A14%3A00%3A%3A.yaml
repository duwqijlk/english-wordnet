simpleMeaning: a way of running money in which people put money into new businesses, most of all new high-technology
  ones, where the money they may gain is large
scope: Money put into new businesses, most of all new high-technology ones, where the money to be gained
  is large, not money put into old safe businesses and not money given as a gift.
examples:
- Venture capitalism helped the small firm build its first computer.
- Through venture capitalism, the new company got the money to grow.
