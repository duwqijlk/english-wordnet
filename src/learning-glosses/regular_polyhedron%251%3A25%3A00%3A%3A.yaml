synsetId: 13939032-n
simpleMeaning: All its corners are alike, and each flat side is a many-sided shape that matches the others;
  it is one of only five such shapes.
scope: It is also called ideal solid, regular convex polyhedron, and regular convex solid, and it is one
  of only five such shapes.
examples:
- A cube is a regular polyhedron with six square faces.
- They drew a regular polyhedron with four faces the same size.
