senseId: 'hypoglycemic_agent%1:27:00::'
synsetId: 14938452-n
simpleMeaning: Any of several medicines that lower the amount of sugar in the blood and are used to treat
  diabetes.
scope: Any of several medicines that lower blood sugar and treat diabetes; hypoglycaemic agent is another
  name for it, not a medicine that raises blood sugar.
examples:
- The doctor gave him a hypoglycemic agent to bring his blood sugar down.
- A hypoglycemic agent helps the body use sugar better.
