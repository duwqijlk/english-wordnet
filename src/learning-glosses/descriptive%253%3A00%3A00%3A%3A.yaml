simpleMeaning: In the study of language, about a way of looking at a language that shows its forms, its
  patterns, and how people use it
scope: This is about a way of studying language that shows how it works and is used. It is not the wider
  sense that just means giving facts or a picture in words.
examples:
- Descriptive grammar shows how people really speak, not how books say they should speak.
- He learned a descriptive way of looking at language forms and use.
