simpleMeaning: One of the two large parts of flesh and muscle at the back of a person's body that form
  the bottom.
scope: One of the two fleshy parts of the human bottom, also called a cheek, and not the whole hip.
examples:
- He fell hard on his buttock.
- The nurse gave the injection in the buttock.
