senseId: 'dent%1:25:00::'
synsetId: 13927849-n
simpleMeaning: a hollow place in a surface, made by scratching or cutting into it
scope: Also called scratch, prick and slit, this is a hollow place scratched or cut into a surface; it
  is not a lessening or other result.
examples:
- A sharp stone left a dent in the metal door.
- The knife made a small dent in the wood as he cut it.
