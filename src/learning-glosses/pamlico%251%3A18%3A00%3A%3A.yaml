simpleMeaning: A member of the Algonquian people who once lived in the river valley it is named for, in
  North Carolina.
scope: This is a member of the Algonquian people who once lived in the river valley it is named for, in
  North Carolina; it is a person, not the language of these people.
examples:
- The Pamlico lived in the river valley in North Carolina.
- He was a Pamlico of the Algonquian people.
