simpleMeaning: not flat, but marked by long, narrow, shallow lines in the surface, like wrinkles
scope: 'Also called furrowed: a face or field with long shallow lines in it, not strong and tough and
  not hard to bear.'
examples:
- The rugged fields showed long lines where the plow had passed.
- His rugged face lit up when he smiled.
