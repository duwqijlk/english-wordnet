simpleMeaning: An orchid of northeastern and alpine parts of eastern North America, closely related to
  the purple fringed orchids but with rosy-purple or violet flowers and finely toothed leaf edges.
scope: This is the fringeless member of the purple fringed orchid group, not the purple fringed orchid
  itself; purple fringeless orchis is another name for the same plant.
examples:
- Purple fringeless orchid blooms in late summer in the mountains of eastern North America.
- From its finely toothed leaves we knew it was purple fringeless orchid and not its fringed cousin.
