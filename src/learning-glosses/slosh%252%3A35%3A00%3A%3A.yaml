simpleMeaning: to spill or throw a liquid about in large amounts, in a careless way
scope: To spill or splash a liquid about in large amounts and carelessly, not to pour it out neatly and
  not to drink it down.
examples:
- He sloshed paint all over the walls.
- Water sloshed out of the bucket as she carried it.
