simpleMeaning: to wait out of sight in a secret place, hidden until the right moment
scope: 'Also called lurk: to hide and wait in secret, not to dodge work you ought to do.'
examples:
- The thief skulked behind the wall, waiting for the house to go dark.
- He skulked in the shadows until the guard had passed.
