simpleMeaning: one of two related body chemicals that control how the body makes a kind of stuff, and
  that aspirin stops from working
scope: One of two related body chemicals that aspirin blocks, not a painkiller itself and not the single
  kind that makes pain, swelling and fever.
examples:
- Aspirin works in part because it blocks cyclooxygenase in the body.
- Cyclooxygenase helps control how much of certain body chemicals are made.
