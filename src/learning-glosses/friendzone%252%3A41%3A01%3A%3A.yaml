senseId: 'friendzone%2:41:01::'
synsetId: 90012511-v
simpleMeaning: To treat a person as a close companion, although they have romantic feelings for you
scope: To keep a person in the role of a close companion although they have romantic feelings for you;
  not to start a love affair with them.
examples:
- He friendzoned her after she told him how she felt.
- She did not want to friendzone him, but she saw him only as a pal.
