simpleMeaning: Having a large supply of good qualities or materials, especially natural resources.
scope: This is not the sense about having a lot of money; it describes soil, land, or other things with
  plenty of good qualities or materials.
examples:
- The valley has soil rich in minerals.
- The region is rich in forests and fresh water.
