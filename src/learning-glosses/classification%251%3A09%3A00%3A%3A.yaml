simpleMeaning: the basic way the mind sorts things into groups or kinds
scope: This is the mind's basic act of putting things into groups, also called sorting and categorization;
  it is not a group itself, not the act of handing things out into groups, and not a government limit
  on who can see papers or use weapons.
examples:
- Classification is a basic part of how children learn new words.
- Good classification helps us remember animals by putting them into groups.
