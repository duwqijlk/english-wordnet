simpleMeaning: a change or difference from what is usual or from a set rule or level
scope: 'Also called a difference, a departure, or a divergence: a change from what is usual or set. It
  is not a compass error, and not bad behaviour that goes against what is accepted.'
examples:
- A small deviation from the plan caused no harm.
- The deviation from the mean was only two points.
