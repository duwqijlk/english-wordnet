simpleMeaning: The eye muscle whose tightening turns the eyeball up and toward the nose
scope: The eye muscle that turns the eyeball up and toward the nose, also called the superior rectus or
  the superior rectus muscle; not the muscle that turns the eye down and not the muscle that turns it
  outward.
examples:
- The rectus superior lifts the eye when we look up.
- Damage to the rectus superior makes it hard to look upward.
