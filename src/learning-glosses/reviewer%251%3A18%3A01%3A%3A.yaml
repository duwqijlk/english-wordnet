senseId: 'reviewer%1:18:01::'
synsetId: 10546502-n
simpleMeaning: a person who reads written works before they are printed and says if they are good enough
  to be printed
scope: 'Also called reader and referee: a person who checks a written work before printing, not a person
  who writes an opinion about a book after it is printed.'
examples:
- The reviewer read the first book and said it was not ready to print.
- A reviewer for the company must check each new story with care.
