simpleMeaning: Hearing strange sounds that are not really there, with no words in them.
scope: Auditory hallucination is another name for this sense, not hearing spoken words that are not there
  and not a real sound.
examples:
- His acousma made him hear bells that no one else heard.
- Her acousma made her hear a low hum with no words in it at night.
