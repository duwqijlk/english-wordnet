simpleMeaning: To mend a thing and change parts of it so it is in good order again
scope: 'Also called modernize and overhaul: to mend and change a thing so it is in good order again, not
  to build a new thing and not to leave it as it is.'
examples:
- We will modernise the old kitchen this year.
- The council plans to modernise the library.
