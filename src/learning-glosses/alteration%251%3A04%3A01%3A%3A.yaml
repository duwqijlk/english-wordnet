simpleMeaning: the act of changing something, for example the size of a piece of clothing
scope: The act of changing something, for example the size of a garment; also called adjustment, and not
  the act of revising a text, and not a change that simply happens.
examples:
- The alteration to the dress made it fit her better.
- He asked the tailor for an alteration to the jacket sleeves.
