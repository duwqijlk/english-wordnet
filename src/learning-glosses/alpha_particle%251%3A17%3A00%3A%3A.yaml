simpleMeaning: a tiny bit with a positive charge, the heart of a helium atom, given off by natural or
  radioactive kinds of atoms
scope: A charged bit from the heart of a helium atom; not an electron, and not a whole atom.
examples:
- An alpha particle shot out from the decaying sample.
- Alpha particles carry a positive charge.
