simpleMeaning: To put the lightest gas into the bits of a chemical that can take in more of it, or to
  join, treat or lay open a thing with that gas.
scope: This is the adding of the lightest gas to a thing.
examples:
- The oil was hydrogenated with the lightest gas.
- They hydrogenate fats to add the lightest gas to them.
