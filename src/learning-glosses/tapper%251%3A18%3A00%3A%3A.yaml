senseId: 'tapper%1:18:00::'
synsetId: 10710814-n
simpleMeaning: A person who listens in on phone or telegraph wires in secret.
scope: A person who listens in on phone or telegraph wires in secret, not a tavern keeper who taps kegs
  or casks, not a dancer who sounds out rhythms with metal taps on the toes and heels of the shoes, not
  a worker who uses a tap to cut screw threads, and not a person who strikes a surface lightly and usually
  repeatedly.
examples:
- The tapper had been listening to their calls for weeks.
- Police found the tapper's wires hidden in the wall.
