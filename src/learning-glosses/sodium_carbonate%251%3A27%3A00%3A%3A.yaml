simpleMeaning: A salt made from a soft white metal and an acid with carbon in it, used in making soap
  powders, glass and paper
scope: A salt made from a soft white metal and an acid with carbon in it, used in making soap powders,
  glass and paper; also called soda, sal soda, soda ash and washing soda; not table salt for food, and
  not soap itself.
examples:
- Sodium carbonate is used in making glass.
- The soap works buys sodium carbonate in bulk.
