simpleMeaning: In physiology, being able to notice and answer things that act on the body from outside,
  and being able to feel
scope: In physiology, the power to notice outside things and to feel, with sensitivity as another name
  for this sense; not a refined feeling for pleasure or pain.
examples:
- Sensitivity to pain is one kind of sensibility.
- Loss of sensibility in the hand followed the injury.
