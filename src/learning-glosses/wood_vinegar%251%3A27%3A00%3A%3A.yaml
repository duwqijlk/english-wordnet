simpleMeaning: Holding acetic acid, methanol, acetone, oils from the trees, and tars, a red-brown liquid
  is made by heating trees until they give off steam
scope: This sense is also called pyroligneous acid, and it is a red-brown liquid holding acetic acid,
  methanol, acetone, oils from the trees, and tars.
examples:
- Wood vinegar came from heating trees until they gave off steam.
- The wood vinegar held acetic acid, methanol, and acetone.
