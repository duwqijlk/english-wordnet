scope: A money firm that sells its own shares to people and uses the money to buy shares and bonds put
  out by other firms, also called a fund, an investment firm or an investment trust; not a bank that lends
  money and not a firm that makes goods.
examples:
- She put her savings in an investment company.
- The investment company buys shares in many firms.
