simpleMeaning: a bird that runs on the ground, with pale yellow-white feathers, living in desert and half-desert
  land in Europe, Asia and Africa
scope: A bird of desert and half-desert land in the Old World, not a bird of wet land and not a bird that
  hunts on the wing.
examples:
- A cream-colored courser ran across the dry sand.
- We saw a cream-colored courser standing in the desert at dawn.
