simpleMeaning: a feeling of loving care and a wish to keep someone or something safe
scope: This sense is a feeling of loving care for someone or something, with a wish to keep them safe.
  It is not the quality of giving safety or keeping a person or thing safe.
examples:
- Her protectiveness toward her young brother was clear to everyone.
- He felt a strong protectiveness for the small dog he had found.
