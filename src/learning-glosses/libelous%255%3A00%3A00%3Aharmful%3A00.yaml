simpleMeaning: 'used of what people say: harmful and often untrue, likely to damage a person''s good name'
scope: This is said of statements that are harmful and often untrue, not of true statements or harmful
  acts; denigrating, slanderous, calumniatory, calumnious, defamatory, denigrative, denigratory and libellous
  are other names for this sense.
examples:
- The paper printed a libelous claim about the mayor.
- Her libelous words harmed his good name.
