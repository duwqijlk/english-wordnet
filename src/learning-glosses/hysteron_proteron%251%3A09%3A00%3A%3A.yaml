senseId: 'hysteron_proteron%1:09:00::'
synsetId: 05902918-n
simpleMeaning: In reasoning, the mistake of taking as already true a claim that still has to be proved.
scope: In reasoning, the mistake of taking an unproved claim as already true, not a mistake in the facts
  themselves and not a claim that is simply false.
examples:
- His proof was a hysteron proteron, taking the answer as already true.
- The hysteron proteron in her argument hid the missing step.
