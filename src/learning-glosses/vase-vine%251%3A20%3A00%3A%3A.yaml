simpleMeaning: large red-purple bell-shaped flowers with tough outer leaves curved back grow on a low
  climbing shrub of the south-east United States
scope: 'Also called leather flower and vase vine: a climbing shrub of the south-east United States with
  big red-purple bell flowers, not a tall tree and not a vine with blue flowers.'
examples:
- The vase-vine climbs the fence with its big red-purple bells.
- In spring the vase-vine shows bell-shaped flowers with tough outer leaves.
