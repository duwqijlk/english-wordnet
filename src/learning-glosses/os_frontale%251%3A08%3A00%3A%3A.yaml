simpleMeaning: The large bone of the skull that makes the front part of the head and holds the upper rim
  of the eye holes
scope: 'Also called a forehead or a frontal bone: the big bone at the front of the skull, not a short
  even bone and not a cheek bone.'
examples:
- The os frontale forms the front of the skull above the eyes.
- A blow to the os frontale can break the bone over the eyes.
