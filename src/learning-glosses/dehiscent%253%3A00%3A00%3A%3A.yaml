simpleMeaning: To let the seeds out, they open on their own when ripe — said of things such as fruit and
  the parts of a flower that make pollen
scope: This word is said of fruit and flower parts that open on their own when ripe, to let the seeds
  out.
examples:
- The dehiscent pods split open as soon as they were ripe.
- Dehiscent seed cases open on their own when the seeds are ready.
