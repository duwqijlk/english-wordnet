simpleMeaning: Small white blooms come first, then hard red or orange-red berries, on this prickly shrub
  of the group Pyracantha, one of several kinds.
scope: Firethorn and pyracanth are other names for this prickly shrub of the group Pyracantha.
examples:
- The fire thorn was covered in small white blooms.
- The fire thorn carried hard red berries after its white blooms.
