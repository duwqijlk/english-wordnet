simpleMeaning: To lend and borrow, the main countries that deal in money and make goods keep money in
  those lands.
scope: Money of the main countries that deal in money and make goods, kept in those countries to lend
  and borrow; not money kept in a single country.
examples:
- The bank holds Eurocurrency in London for lending to other banks.
- The firm borrowed Eurocurrency to pay for goods made in another country.
