simpleMeaning: Formerly, a loud cry, or repeated loud cries, of pain, very strong anger, or deep sadness
scope: This old sense is a loud cry in pain, very strong anger, or deep sadness, not a statement that
  you are unhappy, not an illness, and not a paper in a law case.
examples:
- The wounded man's complaints could be heard down the hall, each one a cry of pain.
- From the next room came a loud complaint of sorrow and pain.
