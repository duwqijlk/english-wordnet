simpleMeaning: the occupation of running a government and dealing with public affairs
scope: This is the career of governing and public affairs, not the academic study of government, not a
  person's opinions on public questions, not the activities of running a state, and not intrigue used
  to gain power.
examples:
- He entered politics after a career in law.
- She left politics to run a charity.
