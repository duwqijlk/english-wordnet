simpleMeaning: A grass that lives for years, from Australia and South Africa, brought to North America
  as food for farm animals.
scope: Also called hardinggrass, toowomba canary grass, Harding grass, and Phalaris aquatica; a grass
  from Australia and South Africa, set apart from grasses that grew in North America on their own by having
  been brought there.
examples:
- Phalaris tuberosa stood tall along the fence.
- Cattle graze on Phalaris tuberosa in the summer.
