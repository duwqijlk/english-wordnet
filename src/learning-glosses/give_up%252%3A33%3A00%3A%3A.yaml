simpleMeaning: A person stops trying after a loss, with no hope left, and admits they have lost
scope: To stop trying after a loss, with no hope left, also called chuck up the sponge, drop by the wayside,
  drop out, fall by the wayside and quit, not to die and not to hand something over.
examples:
- The challenger gave up in the second round.
- The team gave up after the third goal.
