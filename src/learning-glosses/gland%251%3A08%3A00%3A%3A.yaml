simpleMeaning: any of the parts inside the body that make things the body needs and send them out through
  small tubes or straight into the blood
scope: This is a body part that makes things the body needs and sends them out. It is not a muscle that
  moves the body, and not a bone that holds the body up.
examples:
- The thyroid gland makes a substance that helps control how fast the body works.
- Sweat glands send sweat out through the skin.
