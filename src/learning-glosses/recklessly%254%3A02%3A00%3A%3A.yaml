simpleMeaning: in a way that takes no care about danger or about what bad things may happen
scope: 'This says how an action is done: without care about danger. It is not about being quick on its
  own, and not about doing something on purpose to hurt someone.'
examples:
- He drove recklessly through the wet streets.
- She recklessly spent all her money in one day.
