simpleMeaning: said of a sudden drop in writing or speech from grand words to words that seem silly
scope: 'Also called anticlimactic: said of a sudden drop from grand to silly in writing or speech, not
  a steady build-up to a high point, and not a joke told on purpose.'
examples:
- The speech ended on an anticlimactical note when the grand promise gave way to a silly joke.
- Her anticlimactical last line turned the fine poem into a laugh.
