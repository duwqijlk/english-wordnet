simpleMeaning: to say you have lost and stop trying, after a loss or when hope is gone
scope: 'Also called quit, chuck up the sponge, drop by the wayside, fall by the wayside and give up: to
  stop trying after a loss, not to leave school or a race.'
examples:
- After losing three games in a row, he dropped out of the contest.
- The challenger dropped out in the second round and said she had lost.
