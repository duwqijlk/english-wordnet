simpleMeaning: connected with, coming from, or typical of a different place or region of the world
scope: This is another name for foreign, describing what belongs to or comes from a different part of
  the world, not the sense meaning odd or unexpected.
examples:
- Sailors brought back strange fruits from distant lands.
- He was drawn to the strange music of that far-off country.
