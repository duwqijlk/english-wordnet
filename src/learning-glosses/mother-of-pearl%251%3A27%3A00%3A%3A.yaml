simpleMeaning: The shiny inside layer of the shell of a soft sea animal, showing changing colours
scope: 'Also called nacre: the shiny inside layer of the shell of a soft sea animal, not the outside of
  the shell and not a pearl itself.'
examples:
- The box was lined with mother-of-pearl.
- Mother-of-pearl shone on the inside of the shell.
