simpleMeaning: rock or gravel that holds sodium nitrate, a natural salt, found in the ground in Chile
  and Peru
scope: This sense is the salt-holding rock from Chile and Peru, not the hard layer under the soil in dry
  places that shares the same name.
examples:
- Workers dug caliche from the dry ground in Chile.
- The caliche was taken away to get the salt from it.
