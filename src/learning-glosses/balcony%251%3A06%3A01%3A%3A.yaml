simpleMeaning: A floor with a low wall or rail round its edge, sticking out from the wall of a building.
scope: A flat floor sticking out from a building wall, not the high seats at the back of a hall for watching
  a show.
examples:
- She stood on the balcony to look at the street below.
- The balcony has a rail round its edge so no one falls off.
