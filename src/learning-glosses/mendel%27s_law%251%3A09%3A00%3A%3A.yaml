simpleMeaning: In genetics, one of two rules of inheritance that Gregor Mendel worked out from tests with
  plants, later narrowed and changed by further study of genes
scope: One of two rules about how traits pass from parents to young; the pair came from Mendel's plant
  tests and was later narrowed by further work on genes.
examples:
- Mendel's law explains why the peas came out tall or short.
- Our teacher used Mendel's law to show how traits pass on.
