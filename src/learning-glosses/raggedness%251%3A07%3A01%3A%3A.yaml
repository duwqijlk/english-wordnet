simpleMeaning: How a surface or an edge feels when it is not smooth but not the same all along and not
  even
scope: 'Also called roughness: how a surface or an edge feels when it is not smooth but not the same all
  along and not even, not a smooth feel and not a rip in cloth.'
examples:
- The raggedness of the torn paper made it hard to write on.
- You could feel the raggedness of the cliff edge under your hand.
