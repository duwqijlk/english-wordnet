simpleMeaning: praise or advertising that is very open and showy, or that is made to get strong interest
  in something
scope: Also called plug and ballyhoo, this is praise or advertising that is very open and showy, or that
  is made to get strong interest in something; not the verb sense of telling many people about something
  in too strong a way and often giving a wrong idea.
examples:
- There was a lot of hype around the new film before it opened.
- Do not believe all the hype about this phone; test it yourself.
