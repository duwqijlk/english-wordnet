simpleMeaning: Going without clothes, hard self-denial, and quiet thought mark the teaching of this sect
  of Hindu thinkers.
scope: This teaching belongs to a sect of Hindu thinkers who went without clothes and gave themselves
  to self-denial.
examples:
- Gymnosophy taught its followers to live without clothes and in quiet thought.
- The gymnosophy sect gave itself to self-denial and meditation.
