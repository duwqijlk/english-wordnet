simpleMeaning: To hold up, steady, or lift something using a solid piece.
scope: Holding up, steadying, or lifting something with a solid piece; not shaping something into pieces,
  not shaping an object over a form, and not stamping a book cover.
examples:
- They blocked the wheels of the truck so it would not roll.
- The mechanic blocked the car on wooden stands before working underneath.
