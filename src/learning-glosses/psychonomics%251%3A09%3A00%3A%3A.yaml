simpleMeaning: The part of the study of the mind that learns about the mind by tests and trials
scope: 'Experimental psychology is another name for this sense: the part of the study of the mind that
  uses tests and trials, not the study of the mind by talking alone.'
examples:
- Psychonomics uses tests to learn how people remember lists of words.
- In psychonomics, researchers run trials to see how the mind works.
