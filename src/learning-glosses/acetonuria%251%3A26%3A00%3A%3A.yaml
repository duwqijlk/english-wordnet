simpleMeaning: the urine holds too much of the chemicals called ketone bodies, as happens in diabetes
  or when a person starves
scope: Also called ketoaciduria or ketonuria, it is the state in which the urine holds too much of the
  chemicals called ketone bodies, as happens in diabetes or when a person starves.
examples:
- Acetonuria showed up in his urine test during the fast.
- The doctor found acetonuria in the patient with diabetes.
