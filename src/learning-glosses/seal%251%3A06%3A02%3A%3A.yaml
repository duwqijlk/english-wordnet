simpleMeaning: a thing that closes something tight and fully, so nothing can get in or out
scope: A thing that closes something tight and fully, not the sea animal or its fur and not a stamp or
  sign put on a paper.
examples:
- A seal around the door keeps the cold air out.
- Check the seal on the jar to see that it is closed tight.
