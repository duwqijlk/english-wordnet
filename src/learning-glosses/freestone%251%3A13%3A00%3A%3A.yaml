simpleMeaning: A fruit, above all a peach, whose soft inside comes away easily from the stone at its centre
scope: A fruit whose flesh parts easily from the stone, not a clingstone, whose flesh sticks to the stone,
  and not a fruit eaten only when dried.
examples:
- This freestone peach comes away from the stone cleanly.
- Freestones are easy to eat because the flesh leaves the stone.
