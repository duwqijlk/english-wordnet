synsetId: 13821457-n
simpleMeaning: the link between a word like 'myself' and the word it stands for
scope: The link between a word like 'myself' and the word it stands for; also called reflexivity; not
  the link between a word and a thing it names, and not the logic sense where a thing relates to itself.
examples:
- In 'I hurt myself', the reflexiveness joins 'myself' to 'I'.
- The reflexiveness in 'She blamed herself' links 'herself' to 'she'.
