simpleMeaning: With no electric charge and almost no weight, this is a tiny bit of matter that cannot
  be split into smaller bits
scope: A smallest bit of matter with no electric charge, not a neutron and not an electron.
examples:
- A neutrino can pass through the whole earth without hitting anything.
- The detector caught a neutrino from the sun.
