simpleMeaning: in music, using sounds from outside music, most often in music played by hitting things
  or in electronic music that sounds like machines
scope: This is, in music, using sounds from outside music, most often in music played by hitting things
  or in electronic music that sounds like machines, not ordinary melody and not sound effects in a play.
examples:
- The bruitism of the Futurists used the sounds of the street.
- Bruitism brought machine noises into the concert hall.
