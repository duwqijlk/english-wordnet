simpleMeaning: A solid silvery-grey element past uranium, giving off rays, whose atoms split when hit
  by neutrons; little in uranium rock, but usually nuclear-reactor-made; 13 kinds, the 239 kind most important.
scope: Also called Pu and atomic number 94; an element that gives off rays and is usually made in reactors,
  not uranium, the element it is made from, and not radium, another element that gives off rays.
examples:
- Scientists study plutonium in the laboratory.
- A tiny amount of plutonium can give off a great deal of energy.
