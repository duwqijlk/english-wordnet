simpleMeaning: This officer of the armed forces helps the soldiers of a friendly country plan and decide
  what to do
scope: 'Also called a military adviser: this is an officer who helps the soldiers of a friendly country
  make plans, not a commander who gives orders and not a soldier who fights.'
examples:
- The military advisor met the allied officers to talk through the plan.
- She served as a military advisor to troops from a friendly nation.
