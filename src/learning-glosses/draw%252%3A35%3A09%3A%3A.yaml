simpleMeaning: Pull the string of a bow back, bending the bow.
scope: 'The archery sense: bending a bow''s string back to prepare a shot, not pulling an object along,
  and not pulling a cover over something.'
examples:
- She drew the bowstring back to her cheek and held her breath.
- He drew the bow until the string touched his nose, then released.
