simpleMeaning: a thin spread of material laid over a surface
scope: A thin spread of material over a surface; coat is another name for this sense, not a heavy cloth
  for making coats, and not the look of a surface.
examples:
- A second coating of paint covered the marks.
- The pan had a non-stick coating.
