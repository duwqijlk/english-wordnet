simpleMeaning: a Swedish measure of distance equal to ten kilometres.
scope: The Swedish ten-kilometre unit, not the ordinary statute mile, the nautical mile, or the shorter
  ancient Roman mile.
examples:
- The lake lay a Swedish mile beyond the village.
- The old chronicle gave distances in Swedish miles.
