simpleMeaning: Most often shorts and a blouse, this is what women or children wear for sport
scope: An outfit for sport worn by women or children, not a dress for everyday wear and not a man's sports
  kit.
examples:
- She wore a playsuit to the tennis courts.
- The little girl's playsuit had shorts and a blouse.
