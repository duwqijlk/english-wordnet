synsetId: 04080781-n
simpleMeaning: A sculpture of shapes cut into a surface so that they stand out from the background around
  them.
scope: This is the carved-artwork sense, also called sculptural relief, relievo, rilievo, or embossment.
  It is not help given to people in need, not the act of easing pain, and not the calm feeling after distress.
examples:
- The temple wall is decorated with relief carvings of dancing figures.
- You can still make out the relief on the old bronze door.
