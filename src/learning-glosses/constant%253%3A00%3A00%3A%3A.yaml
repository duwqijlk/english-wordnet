simpleMeaning: not changing in purpose, love, or in staying true to a person or idea
scope: About a person who stays true in love or purpose; not a fixed number in maths, and not something
  that goes on without a break.
examples:
- He was a constant lover who stayed true for years.
- She stayed constant in her aim to help her family.
