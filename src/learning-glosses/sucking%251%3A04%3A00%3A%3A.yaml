simpleMeaning: the act of pulling air or liquid into the mouth, or of drawing on something held in the
  mouth
scope: This sense is the action done with the mouth, not drinking in general and not breathing in air
  in the usual way.
examples:
- The baby's sucking slowed as she fell asleep.
- He made a loud sucking sound as he drank through the straw.
