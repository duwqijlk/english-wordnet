simpleMeaning: In arithmetic, the fact that one whole number will not go into another whole number with
  nothing left over
scope: In arithmetic, this is the fact that one whole number will not go into another with nothing left
  over; not a number that cannot be split at all and not a number that is prime.
examples:
- The indivisibility of 7 by 2 shows why it leaves a remainder of 1.
- Because of its indivisibility by 3, the number 10 always leaves a remainder of 1.
