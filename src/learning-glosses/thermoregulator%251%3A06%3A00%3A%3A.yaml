simpleMeaning: a tool that keeps the heat at a set level by itself, starting or stopping the flow of heat
scope: A tool that sets the heat level by itself; thermostat is another name for this sense. Not a thermometer,
  which only shows the heat level.
examples:
- The thermoregulator kept the room at a steady warmth all night.
- When the water got too hot, the thermoregulator shut off the heat.
