simpleMeaning: In psychoanalysis, a child's thoughts about sex are said to be put into other things to
  do, in the fourth part from about age five or six until puberty
scope: 'Another name for latency period and latency stage: in psychoanalysis, the fourth part of a child''s
  growth, when a child''s thoughts about sex are said to go into other things, not the parts before it
  or the years after puberty.'
examples:
- In the latency phase, sexual feelings are said to be turned toward other activities.
- The latency phase is the fourth part of a child's growth.
