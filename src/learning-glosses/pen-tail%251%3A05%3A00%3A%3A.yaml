simpleMeaning: A brown tree shrew of Malaysia, with a bare length behind it that has long stiff hairs
  on both sides of its far third.
scope: 'Also called a pen-tailed tree shrew and a pentail: a brown tree shrew of Malaysia with a bare
  length behind it fringed with long stiff hairs, not a shrew with a furry tail.'
examples:
- The pen-tail lives in the trees of Malaysia.
- You can tell a pen-tail by the long stiff hairs on both sides of the far third of its bare tail.
