simpleMeaning: a part on the outside of a bird or other animal, made of feathers or hair round its neck
scope: 'Also called ruff: the feathers or hair round an animal''s neck, not a hard plate behind a dinosaur''s
  head and not a strip of cloth with folds used to trim clothes.'
examples:
- The bird's bright frill stood out round its neck.
- A small monkey with a white frill sat in the tree.
