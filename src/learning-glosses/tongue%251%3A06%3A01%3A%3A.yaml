simpleMeaning: a metal piece that hangs inside a bell and strikes its side to ring it
scope: The striking piece inside a bell; not the organ in the mouth or the flap on a shoe.
examples:
- The bell's tongue had come loose and no longer struck the rim.
- He looked inside the bell and saw the heavy metal tongue hanging still.
