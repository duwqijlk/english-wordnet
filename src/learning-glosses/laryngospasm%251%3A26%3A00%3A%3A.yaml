senseId: 'laryngospasm%1:26:00::'
synsetId: 14124439-n
simpleMeaning: A closing of the voice box that blocks air from reaching the lungs
scope: When the voice box shuts, air cannot get to the lungs; this is not a closing of the throat when
  swallowing, and not a blockage from something stuck in the throat.
examples:
- A laryngospasm left him gasping for air.
- During the laryngospasm, no air could get to her lungs.
