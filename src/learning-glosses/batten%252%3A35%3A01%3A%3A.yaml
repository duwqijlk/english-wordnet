simpleMeaning: to give or add thin, flat strips of wood or metal to something
scope: To add thin strips to something, not to use strips to hold something tightly shut, and not the
  soft material used as filling.
examples:
- Workers battened the wall, adding long strips of wood across it.
- The boat was battened with new strips along its sides.
