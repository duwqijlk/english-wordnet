senseId: 'anode%1:06:01::'
synsetId: 02717446-n
simpleMeaning: The end part of a cell (a small device that makes electric power) or of a storage battery;
  it has a negative charge and supplies electric current
scope: This is the negative end part of a cell or storage battery, the part that supplies electric current;
  it is not the positive part of an electric device.
examples:
- The anode in this battery has a negative charge.
- He joined the wire to the anode of the cell.
