simpleMeaning: a force that can pull or push, like the force of a magnet, and that is made by an electric
  current
scope: This is the force itself, made by an electric current; not the branch of science that studies electricity
  and magnetism and how they act together.
examples:
- Scientists use electromagnetism to make electric motors turn.
- Electromagnetism can pull small pieces of iron toward a wire that carries a current.
