simpleMeaning: a thick tropical bush that spreads wide or climbs part of the way, with round brown-red
  fruit covered in small bumps; it grows in Africa
scope: A tropical bush with round bumpy fruit, not a fruit tree and not a climbing vine.
examples:
- The negro peach grew thick and wide along the edge of the field.
- We picked the round brown-red fruit from the negro peach bush.
