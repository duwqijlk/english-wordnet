senseId: sycophantic%5:00:00:insincere:00
synsetId: 02188861-s
simpleMeaning: trying to win liking and help from people with power by praising them too much in a way
  that is not honest
scope: 'Also called fawning, obsequious, and bootlicking: praising people with power in a false way to
  win their help. It is not just being too ready to obey and serve others.'
examples:
- His sycophantic praise of the boss made his workmates dislike him.
- She gave the director a sycophantic smile and agreed with everything he said.
