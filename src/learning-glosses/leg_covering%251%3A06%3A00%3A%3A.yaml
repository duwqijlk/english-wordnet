simpleMeaning: A piece of clothing that covers the lower limb, usually from the knee down to the ankle
scope: A garment for the lower limb; legging and leging are other names for this sense, not a sock for
  the foot alone and not a pair of trousers.
examples:
- She wore a thick leg covering against the cold.
- His leg covering reached from knee to ankle.
