simpleMeaning: a tight stretchy leg cover worn to ease the press on leg veins, as when the veins swell
scope: This is a tight stretchy leg cover also called a support stocking, not a plain sock and not a bandage
  wound round a leg.
examples:
- She wore a support hose to ease the ache in her legs.
- The doctor told him to wear a support hose because his leg veins were swollen.
