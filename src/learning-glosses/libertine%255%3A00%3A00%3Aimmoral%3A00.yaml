senseId: libertine%5:00:00:immoral:00
synsetId: 01553629-s
simpleMeaning: Held by no rule, neither custom nor morals.
scope: This sense is also called fast, dissipated, degraded, riotous, degenerate, debauched, profligate,
  and dissolute, for being held by no rule, neither custom nor morals, where fast is not held back by
  accepted social customs or by ideas of right and wrong, unlike the sense for a person of loose life,
  usually a man with no moral hold.
examples:
- The life was libertine, held by no rule.
- The ways were libertine, neither custom nor morals.
