simpleMeaning: Colourful flaps of skin and lumps like warts mark the head and neck of this large black
  and white bird of South America and Central America.
scope: This large black and white bird of the Americas stands out by the colourful flaps of skin on its
  head and neck.
examples:
- The king vulture is a large black and white bird of Central America.
- A king vulture has colourful flaps of skin on its head and neck.
