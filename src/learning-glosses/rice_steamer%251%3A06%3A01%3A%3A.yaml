simpleMeaning: a kitchen machine that works by itself to boil the small grain people eat as a main food
  or cook it in hot wet air
scope: Not a pot on the stove, and not a machine that fries food; also called rice cooker.
examples:
- She set the rice steamer to cook the grain.
- The rice steamer hissed as the meal cooked.
