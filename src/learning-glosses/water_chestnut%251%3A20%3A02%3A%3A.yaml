simpleMeaning: Prickly four-pointed fruits like nuts, good to eat, grow on a plant of the Trapa group.
scope: Also called caltrop and water chestnut plant, it is the Trapa plant with prickly four-pointed fruits
  like nuts, not the Chinese sedge with bulb-shaped tubers that can be eaten.
examples:
- The water chestnut bore prickly fruits like nuts, good to eat.
- Water chestnuts of the Trapa group grow prickly four-pointed fruits.
