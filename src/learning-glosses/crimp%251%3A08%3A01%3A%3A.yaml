simpleMeaning: a small bunch of hair made wavy or curly by a person, not by nature
scope: This is a small bunch of hair made wavy or curly. It is not a person who tricks men into service
  as sailors or soldiers, and not a shape made by folding.
examples:
- She wore one small crimp at the front of her hair.
- The hairdresser made a crimp that stayed wavy all day.
