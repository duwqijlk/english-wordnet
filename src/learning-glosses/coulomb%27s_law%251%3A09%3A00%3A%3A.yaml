simpleMeaning: 'Basic electric charge rule: pull or push between charged bits is in direct ratio to their
  charge product and in inverse ratio to the gap; it holds for magnet poles.'
scope: A basic rule about the pull or push between charged bits and magnet ends, not a rule about flowing
  current and not a rule about gravity.
examples:
- Coulomb's Law says the pull grows with the charges.
- We used Coulomb's Law to work out the push between the two charged balls.
