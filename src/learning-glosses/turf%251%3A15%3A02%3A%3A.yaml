simpleMeaning: An area that a gang of young people claims as its own ground.
scope: An area that a gang of young people claims as its own ground; not a layer of grass, and not the
  act of covering ground with grass.
examples:
- The gang guarded its turf from rivals.
- He would not set foot on their turf.
