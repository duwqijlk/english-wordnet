simpleMeaning: said of some seeds that have a fleshy coat, most often bright in colour
scope: 'Also called arillate: said of some seeds with a fleshy coat, most often bright in colour, not
  a seed with a hard shell and not a seed with no coat at all.'
examples:
- The ariled seed had a bright red coat.
- Gardeners pick out the ariled seeds by their bright, fleshy coats.
