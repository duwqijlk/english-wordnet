simpleMeaning: A thorny branching leaf-shedding shrub of the southwestern United States, with clusters
  of tiny yellow-white flowers that open before the leaves, followed by showy black fruits like berries.
scope: Also called desert olive and tanglebush; a thorny shrub of the dry southwest, not an olive tree.
examples:
- Forestiera neomexicana bloomed before its leaves opened.
- We planted Forestiera neomexicana along the fence.
