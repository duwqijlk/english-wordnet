synsetId: 03811720-n
simpleMeaning: A drug that undoes the work of sleep drugs, sold under its trade name, above all the harm
  of too much morphine.
scope: A drug that undoes the work of strong pain drugs, also called nalorphine; its near kin are the
  other drugs that undo the work of strong pain drugs.
examples:
- Nalline counteracts the effects of morphine.
- Doctors gave Nalline after the overdose.
