simpleMeaning: one of several kinds of large snake with no poison, which kills animals it catches by wrapping
  its body around them and pressing hard
scope: This is a large snake that kills by pressing hard with its body, not a snake that kills with poison.
examples:
- A large constrictor wrapped itself around its prey and pressed hard.
- The zoo keeps a constrictor in a warm glass case.
