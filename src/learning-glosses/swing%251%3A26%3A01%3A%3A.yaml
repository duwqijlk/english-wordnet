simpleMeaning: the steady, energetic pace or rhythm that marks an activity.
scope: The energetic momentum of an activity, not a playground seat, a jazz style, or a golf stroke.
examples:
- It took a while to get into the swing of things at the new job.
- The party was in full swing by nine o'clock.
