simpleMeaning: A herb of the Pacific islands, grown through the tropics for its root that can be eaten,
  and in cooler lands as a garden plant for its large, shiny leaves
scope: Taro, dalo, dasheen and taro plant are other names for this Pacific herb, grown for its edible
  root in the tropics and kept in cooler lands for its large glossy leaves, which sets it apart from other
  tropical root plants and other large-leaved garden plants.
examples:
- Colocasia esculenta grows in wet ground in the tropics.
- We grow Colocasia esculenta for its large leaves.
