senseId: 'racetrack_tout%1:18:00::'
synsetId: 10522347-n
simpleMeaning: a person who gives tips on which horses to bet on, to change the odds or to get a share
  of the money won
scope: A person who gives betting tips at the track, not a bookmaker who takes the bets and not a trainer
  who works with the horses.
examples:
- The racetrack tout told us to bet on the grey horse in the third race.
- He paid the racetrack tout for tips before every race.
