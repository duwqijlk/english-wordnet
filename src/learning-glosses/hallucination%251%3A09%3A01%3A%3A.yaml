senseId: 'hallucination%1:09:01::'
synsetId: 05821023-n
simpleMeaning: a thing that a person sees, hears, or feels that is not really there, during a time when
  their mind makes such things appear to them
scope: A thing seen or heard while the mind makes unreal things appear, not the false seeing itself, which
  is a common sign of a bad mental illness.
examples:
- He refused to believe that the angel he saw was a hallucination.
- The hallucination of a bright light vanished when she closed her eyes.
