simpleMeaning: like a woman in ways that are not seen as right for a man
scope: 'Also called sissy, effeminate, and epicene: this describes a man with woman-like ways that are
  seen as not fitting for a man. It is not the verb sense of taking away a man''s strength or making him
  unable to father children.'
examples:
- People called the prince emasculate because of his soft voice and fine clothes.
- He was hurt when others said his gentle ways made him emasculate.
