simpleMeaning: A disease caused by a virus that spreads very easily and comes on suddenly, with clear
  red spots and then a rash; it happens mainly in children
scope: Also called morbilli and rubeola; this is the illness itself, not just a rash from another illness.
examples:
- The child stayed home because measles had spread through her class.
- Measles gave him red spots and a rash all over his body.
