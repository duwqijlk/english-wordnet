simpleMeaning: a music instrument made of a round, curved-in brass plate, that makes a loud crashing sound
  when hit with a drumstick or when two are hit together
scope: A round brass plate played by hitting it, not a drum and not a bell.
examples:
- The drummer hit the cymbal hard at the end of the song.
- Two cymbals crashed together in the band.
