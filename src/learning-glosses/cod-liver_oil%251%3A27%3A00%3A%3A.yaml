simpleMeaning: From the soft organs inside a sea fish and fish like it comes a liquid that people swallow
  for vitamins A and D.
scope: Also called cod liver oil, this liquid comes from the soft organs of a sea fish.
examples:
- She took a spoonful of cod-liver oil.
- They swallowed cod-liver oil to get vitamins A and D.
