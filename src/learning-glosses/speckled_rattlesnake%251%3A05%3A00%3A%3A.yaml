simpleMeaning: Its marks change from one snake to the next, most often matching the ground around it,
  in south-west Arizona and Baja California.
scope: A snake of south-west Arizona and Baja California whose marks change from one snake to the next,
  most often matching the ground around it, not one of a fixed pattern.
examples:
- The speckled rattlesnake was hard to see against the ground.
- A speckled rattlesnake moved slowly away.
