senseId: 'dandle%2:38:00::'
synsetId: 01869712-v
simpleMeaning: Holding a baby in your arms or on your knees and lifting the baby up and down
scope: To move a baby up and down in your arms or on your knees, not to carry a baby from one place to
  another and not to rock a baby from side to side.
examples:
- She dandled the baby on her knee to make him smile.
- He dandled his daughter in his arms while she laughed.
