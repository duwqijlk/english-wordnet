simpleMeaning: A large white mushroom that gets brown stains with age, with white gills and a spicy, fragrant
  smell; it is gathered and sold for cooking in the Pacific Northwest.
scope: This is the large white mushroom gathered in the Pacific Northwest, not a common white button mushroom
  or a different matsutake.
examples:
- White matsutake is prized for its spicy, fragrant smell.
- The white matsutake is gathered in the Pacific Northwest for Asian cooking.
