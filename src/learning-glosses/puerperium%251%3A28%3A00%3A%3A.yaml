simpleMeaning: the womb shrinks back and the other changes of pregnancy in the body settle back to how
  they were in the time after a baby is born
scope: The puerperium is the time after childbirth, when the womb shrinks and the body settles back after
  pregnancy.
examples:
- The doctor cared for her during the puerperium.
- The changes of pregnancy settled during the puerperium.
