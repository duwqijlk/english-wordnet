simpleMeaning: A made-up air-like stuff whose tiny bits are so small they take up no room and neither
  pull nor push each other at all.
scope: A made-up air-like stuff whose tiny bits take up no room and neither pull nor push each other at
  all; perfect gas is another name for it, not a real air-like stuff in a bottle and not air itself.
examples:
- In class we used an ideal gas to work out how pressure changes with heat.
- An ideal gas has bits that never pull on each other.
