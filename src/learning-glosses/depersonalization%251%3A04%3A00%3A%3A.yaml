simpleMeaning: showing a person as a physical thing with no traits of their own and no quality that makes
  them distinct
scope: This is showing a person as a physical thing with no traits of their own, also called depersonalisation,
  not a mental illness in which a person feels cut off from their own self and not a loss of one's own
  sense of who one is.
examples:
- In the essay, the depersonalization of workers as mere tools showed how the factory saw them.
- The novel uses depersonalization when it turns the clerk into a number on a list.
