simpleMeaning: In the woods of the far north of North America lives a wolf with a coat streaked in dark
  and light.
scope: Grey wolf and timber wolf are other names for this wolf of the far northern woods.
examples:
- A gray wolf moved through the woods of the far north.
- The gray wolf's coat is streaked in dark and light.
