simpleMeaning: a tall tree that keeps its green leaves all year, from the Pacific side of North America,
  cut in large amounts for its wood
scope: 'Also called western hemlock: a tall tree that keeps its leaves all year, not a pine and not a
  fir.'
examples:
- A west coast hemlock stood taller than the other trees on the slope.
- Loggers cut the west coast hemlock for its strong, pale wood.
