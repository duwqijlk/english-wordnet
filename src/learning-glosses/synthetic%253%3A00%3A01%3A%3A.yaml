senseId: 'synthetic%3:00:01::'
synsetId: 00111940-a
simpleMeaning: In logic, of a claim whose truth can only be known by looking at the world and checking
  the facts
scope: In logic, a claim that is true or false only because of what we see and find, not a claim true
  by the meaning of its words.
examples:
- '''All men are arrogant'' is a synthetic proposition.'
- The claim that it rained last night is synthetic, because you can only know it by checking.
