simpleMeaning: A fast-onset leukemia where young lymphoblast-like cells multiply in marrow, nodes, and
  spleen, and in blood, seen most often in children.
scope: This sense is also called acute lymphoblastic leukemia, for a fast-onset leukemia where young lymphoblast-like
  cells multiply in marrow, nodes, and spleen, and in blood, seen most often in children.
examples:
- Acute lymphocytic leukemia strikes children.
- Acute lymphocytic leukemia fills the blood.
