simpleMeaning: earth that takes shape in a land with almost no rain
scope: This is earth that takes shape in a land with almost no rain; desert soil is another name for it,
  not earth that forms in a wet land and not rich earth made for crops.
examples:
- Desertic soil covers much of the dry land here.
- Nothing much grows in desertic soil without water.
