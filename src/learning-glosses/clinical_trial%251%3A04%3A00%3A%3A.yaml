simpleMeaning: A new medicine or a new tool put inside the body is tried on people under strict control,
  with the FDA in America directing it before doctors use it widely.
scope: Also called clinical test, this is a trial of a new medicine or a new tool put inside the body,
  run under strict control with the FDA in America directing it.
examples:
- The clinical trial tested the new drug on volunteers.
- She joined a clinical trial for a new device.
