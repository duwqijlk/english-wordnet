simpleMeaning: a baby born with more fingers or toes than usual
scope: A baby born with extra fingers or toes, also called polydactyly; not a missing finger or toe and
  not an injury after birth.
examples:
- The baby's hyperdactyly meant she had six fingers on one hand.
- Doctors can treat hyperdactyly by removing the extra finger.
