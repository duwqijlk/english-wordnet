simpleMeaning: The build-up of fatty lumps on the walls of the blood vessels that carry blood from the
  heart, as happens in the disease atherosclerosis
scope: This is the forming of fatty lumps on artery walls, as happens in the disease atherosclerosis,
  not the disease itself and not a narrowing of the veins.
examples:
- Atherogenesis begins when fatty lumps start to form on artery walls.
- Doctors study atherogenesis to learn how artery walls become blocked.
