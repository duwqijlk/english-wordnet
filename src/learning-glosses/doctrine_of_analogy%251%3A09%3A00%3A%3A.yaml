simpleMeaning: In religion, any likeness drawn between God and people always falls short, since what sets
  God apart from what God made is always greater than any likeness
scope: This religious teaching is also called analogy, and it holds that no likeness between God and people
  can ever be great enough.
examples:
- The doctrine of analogy says that God is beyond all likeness.
- The doctrine of analogy holds that no likeness of God can ever be enough.
