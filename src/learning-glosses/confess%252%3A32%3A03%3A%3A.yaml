simpleMeaning: to tell God about the wrong things you have done before a priest, as people do in the Catholic
  faith
scope: To tell God about the wrong things you have done before a priest, as people do in the Catholic
  faith, not saying that you did a bad act when pressed to speak.
examples:
- He went to confess to the priest on Saturday.
- She confessed to the priest after mass.
