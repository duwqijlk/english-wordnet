simpleMeaning: Its front flaps have angled notches on their outer edges, and it is a nymphalid butterfly,
  one of a large family of butterflies.
scope: This nymphalid butterfly is the one with angled notches on the outer edges of its front flaps.
examples:
- The anglewing flew past with angled notches on its front flaps.
- An anglewing showed the angled notches on its front flaps.
