simpleMeaning: a search made with a thin, bendy tool used by doctors, to look inside an injury or a hollow
  in the body
scope: A search made with a thin, bendy doctor's tool to look inside an injury or hollow in the body,
  not the tool itself and not a search for facts about wrongdoing.
examples:
- The probe of the wound showed where the cut had gone.
- After the probe, the doctor knew the injury was not deep.
