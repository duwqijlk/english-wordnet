simpleMeaning: With pink or white flowers, a small fleshy herb often found along North American shores
  and in marshes of half-salt water
scope: Black saltwort and sea trifoly are other names for this small fleshy shore herb with pink or white
  flowers.
examples:
- Sea milkwort grew near the shore with pink flowers.
- We found sea milkwort with white flowers in the marsh.
