simpleMeaning: In a card game, to name the trump suit (whose cards beat cards of other suits) or no-trump
  (no trump suit is picked), with the last bid of a hand
scope: In a card game, this is naming the trump suit or no-trump at the end of bidding; it is not announcing
  news in public and not saying you are for or against something.
examples:
- She declared hearts as the trump suit with her final bid.
- He declared no-trump in the last bid of the hand.
