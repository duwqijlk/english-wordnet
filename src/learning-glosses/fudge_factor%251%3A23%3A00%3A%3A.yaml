senseId: 'fudge_factor%1:23:00::'
synsetId: 13778097-n
simpleMeaning: a number put in or taken out when working out a science measure, so the answer comes closer
  to the true one
scope: 'Also called a correction: a number put in or taken out to make a science measure more exact, not
  a guess and not a mistake in the measure.'
examples:
- The fudge factor made the readings match the true value.
- They added a fudge factor to the result.
