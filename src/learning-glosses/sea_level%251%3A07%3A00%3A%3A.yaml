simpleMeaning: The height of the ocean's top, above all the point halfway between high and low tide, used
  as a base for land height or water depth
scope: The height of the ocean's top, above all the point halfway between high and low tide, used as a
  base for land height or water depth; not the high-tide mark and not a height measured from a mountain's
  foot.
examples:
- The town sits ten metres above sea level.
- Sea level is the base from which land heights are worked out.
