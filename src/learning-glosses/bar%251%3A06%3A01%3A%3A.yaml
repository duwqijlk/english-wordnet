simpleMeaning: A portable .30 rifle that fires on its own by gas push, fed rounds from a box; used by
  United States troops in both World Wars and the Korean War.
scope: A rifle, also called a Browning automatic rifle; not a rod of metal, and not a place that sells
  drinks.
examples:
- The BAR was used in World War I.
- He carried a BAR.
