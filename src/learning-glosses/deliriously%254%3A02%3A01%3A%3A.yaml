simpleMeaning: in a wild, excited, or confused way, when the mind is not working clearly
scope: In a wild, confused way when the mind is not clear, or in a state of wild joy; the close rival
  sense means only as if in such a state.
examples:
- Her answer made him deliriously happy.
- Weak with fever, he talked deliriously through the night.
