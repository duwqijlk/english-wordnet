simpleMeaning: It stands tall and lives for years in the eastern United States, smells strongly, and bears
  loose bunches of pale yellow flowers above leaves with toothed, sharp tips.
scope: 'Also called horse balm, horseweed, stone-root, stone root, and stoneroot: a tall, strong-smelling
  plant of the eastern United States, not the Pilea plant of the same name.'
examples:
- The richweed smells strongly when its pale yellow flowers open.
- She pointed out the richweed by its leaves with toothed, sharp tips.
