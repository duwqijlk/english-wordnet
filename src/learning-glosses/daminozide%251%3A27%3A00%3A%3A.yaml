simpleMeaning: A chemical sprayed on fruit trees to hold back their growth so the whole crop can be picked
  at one time.
scope: This is a chemical sprayed on fruit trees to hold back growth, not a feed that makes trees grow
  or a spray that kills bugs.
examples:
- The farmer sprayed daminozide on the apple trees so the fruit would ripen together.
- Daminozide lets the whole crop be picked at one time.
