senseId: 'pretentiousness%1:07:00::'
synsetId: 04796210-n
simpleMeaning: acting or talking in a way that makes a person seem much more important or worthy than
  they are
scope: Also called pretension and largeness, this is acting or talking in a way that makes a person seem
  more important than they are, not a lack of grace that comes from being puffed up with pride.
examples:
- His pretentiousness showed when he talked as if he were far more important than everyone else in the
  room.
- Her pretentiousness showed in a speech full of grand claims about how important and worthy she was.
