simpleMeaning: In American football, the role of the player who stands on the line where each play starts
  and begins the play by passing the ball backward
scope: This is a player's position on a football team, not the middle point of a field or of anything
  else.
examples:
- He played center for three years before switching to guard.
- The coach moved our strongest lineman to center this season.
