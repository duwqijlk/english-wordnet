simpleMeaning: A person who has bad luck and is hurt by something bad that happens to them
scope: This is a person hurt by bad luck or a bad turn of events, not a person who causes harm or one
  who has only lost a game.
examples:
- The victim of the storm lost her home.
- He was a victim of the fire and had to stay with friends.
