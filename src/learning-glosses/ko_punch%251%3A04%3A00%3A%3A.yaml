simpleMeaning: A hard hit that leaves the other boxer unable to go on fighting.
scope: A hard hit that ends a boxing match by leaving the other boxer unable to go on; also called haymaker,
  knockout punch, and Sunday punch.
examples:
- His KO punch ended the fight in the third round.
- One KO punch left his opponent unable to go on.
