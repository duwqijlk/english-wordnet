simpleMeaning: The food pipe is swollen and sore, often because what is in the stomach has flowed back
  up into it
scope: A swelling and soreness of the food pipe, also called esophagitis, and not the flow of stomach
  contents back up the pipe itself or a sore throat.
examples:
- Oesophagitis made it hurt to swallow.
- The doctor treated his oesophagitis with medicine.
