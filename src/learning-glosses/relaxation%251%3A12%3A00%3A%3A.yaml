simpleMeaning: a feeling of calm that makes you feel fresh again, with no stress and no worry
scope: 'Also called easiness: a calm, fresh feeling, not the physics sense of a system going back to balance
  and not the slow lengthening of a resting muscle.'
examples:
- She felt a deep sense of relaxation as she lay by the lake.
- Soft music in the evening brought him real relaxation after a hard day.
