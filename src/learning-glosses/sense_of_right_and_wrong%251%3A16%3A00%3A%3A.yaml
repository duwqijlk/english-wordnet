simpleMeaning: A push from within, drawn by reason from rules of good and fair that govern what a person
  thinks and does.
scope: Also called conscience, scruples, and moral sense, this push from within is drawn by reason from
  rules of good and fair that govern what a person thinks and does.
examples:
- Her sense of right and wrong spoke up.
- His sense of right and wrong held him back.
