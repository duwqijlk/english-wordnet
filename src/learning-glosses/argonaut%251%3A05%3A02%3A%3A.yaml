simpleMeaning: Thin, paper-like shells that wind round in a spiral are carried by the females of this
  soft sea animal of warm seas
scope: Also called nautilus and paper nautilus, it is a soft sea animal of warm seas, and only the females
  carry the thin paper-like spiral shells.
examples:
- The female argonaut carries a thin paper-like shell that winds round in a spiral.
- An argonaut is a soft sea animal of warm seas.
