simpleMeaning: The birth of a baby by an opening made through the belly wall and womb, named from the
  old tale that Julius was born that way.
scope: The birth of a baby by a cut through the belly wall, also called cesarean, caesarian, abdominal
  delivery, caesarean, caesarean delivery, caesarean section, caesarian delivery, caesarian section, cesarean
  delivery, cesarean section, cesarian and cesarian section; set apart from a natural birth and from other
  operations on the belly.
examples:
- The doctor did a C-section when the baby could not be born in the usual way.
- She had a C-section for her second child.
