simpleMeaning: The top soil that has to be cleared away to reach coal beds and mineral stores below.
scope: The top soil cleared away to reach coal and minerals below, not the coal or minerals themselves.
examples:
- The miners stripped the overburden from the hillside.
- Overburden from the pit was piled beside the road.
