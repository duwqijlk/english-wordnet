simpleMeaning: a kind of adelgid, a tiny sap-sucking bug, that harms the Norway spruce and other spruces
  of North America, above all the white spruce and the black spruce
scope: A small bug that harms spruce trees, not a beetle that bores into pine trunks and not a moth that
  eats spruce needles.
examples:
- The spruce gall aphid left swollen galls on the Norway spruce.
- Spruce gall aphids had harmed the young white spruce.
