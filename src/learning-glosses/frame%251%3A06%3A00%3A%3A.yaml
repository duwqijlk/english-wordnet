simpleMeaning: the border round a picture or a mirror that holds it in place and keeps it safe
scope: This is the border round a picture or a mirror; it is not a part of a computer screen, not one
  still picture in a film, and not one part of a bowling game.
examples:
- The picture's wooden frame is painted gold.
- She put the mirror in a new silver frame.
