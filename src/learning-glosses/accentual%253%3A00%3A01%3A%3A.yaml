simpleMeaning: In verse, counting strong beats to make the pattern of a line, not the number of sounds
  or how long they last
scope: A way of making verse by counting strong beats, not by counting sounds or by long and short sounds,
  and not verse with no set beat.
examples:
- The poem's accentual rhythm comes from its four strong beats in each line.
- In accentual poetry, each line has the same number of strong beats.
