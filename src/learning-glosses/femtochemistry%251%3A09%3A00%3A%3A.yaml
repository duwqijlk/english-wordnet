simpleMeaning: the part of chemistry that looks at the most basic and often very fast chemical changes
  as they happen; the tests often use very short bursts of laser light
scope: In chemistry, the study of the most basic and often very fast chemical changes as they happen,
  not the study of slow changes and not the making of new substances.
examples:
- She works in femtochemistry, using laser light to watch reactions.
- Femtochemistry lets scientists see changes that last only a tiny part of a second.
