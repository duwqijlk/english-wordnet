scope: This is a common yellow-flowered plant of Europe and North Africa, now at home in the United States
  and often grown; yellow flag, yellow iris and yellow water flag are other names for this sense, and
  it is the common yellow-flowered kind of its family, not a garden-only plant and not a plant of Asia.
examples:
- Iris pseudacorus lines the pond with yellow flowers.
- Iris pseudacorus now grows wild in the United States as well as in Europe.
