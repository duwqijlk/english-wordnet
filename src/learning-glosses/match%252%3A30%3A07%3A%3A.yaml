simpleMeaning: To make two or more things equal, alike, or suited to each other.
scope: This means bringing things into agreement or equality; it is not noticing that two things are already
  alike, nor a small stick that makes fire.
examples:
- The designer matched the curtains to the color of the sofa.
- The company matches every dollar its employees give to charity.
