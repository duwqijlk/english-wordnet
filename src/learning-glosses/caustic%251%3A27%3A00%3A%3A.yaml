simpleMeaning: a chemical that can burn or destroy the living material of a body
scope: This sense is the chemical itself, not the describing word for such a chemical, not harsh or unkind
  words, and not a pattern of light from a curved surface.
examples:
- The bottle was marked as a caustic and kept away from children.
- Workers wore gloves because the caustic could burn their skin.
