simpleMeaning: the act of bringing a male and a female together so that they can produce young
scope: 'Also called union, pairing, coupling and conjugation: bringing a male and a female together to
  produce young. It is not just any joining of two things.'
examples:
- The mating of these birds takes place in spring.
- Mating between the two dogs led to a litter of puppies.
