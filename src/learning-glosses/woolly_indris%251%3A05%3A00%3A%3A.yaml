simpleMeaning: A night animal of the lemur kind, with thick grey-brown fur and a long tail
scope: A night animal with thick grey-brown fur and a long tail, not a day animal with a short tail and
  not a monkey.
examples:
- Woolly indris call to each other at night.
- A woolly indris slept in the high branches all day.
