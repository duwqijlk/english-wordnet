simpleMeaning: Taking its food from the water, this big harmless bird of prey lives all over the world
  and builds a large nest it often uses for years.
scope: Osprey, fish eagle and sea eagle are other names for this big harmless bird of prey that lives
  all over the world.
examples:
- The fish hawk swooped down to the water.
- The fish hawk used the same nest for years.
