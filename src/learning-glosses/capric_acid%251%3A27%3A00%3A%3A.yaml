simpleMeaning: With a bad smell like that of goats, this greasy stuff is found in animal oils and fats.
scope: 'Also called decanoic acid: a greasy stuff from animal oils and fats with a bad smell like goats,
  not a sweet-smelling stuff and not one from plants.'
examples:
- Capric acid gave the oil a bad smell like that of goats.
- The fats held capric acid with its goat-like smell.
