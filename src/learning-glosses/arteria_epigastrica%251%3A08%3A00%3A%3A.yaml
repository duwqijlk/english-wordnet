scope: 'Also called epigastric artery: one of three arteries that bring blood to the front walls of the
  belly, not the main artery of the belly and not a vein.'
examples:
- The arteria epigastrica feeds the front wall of the belly.
- The arteria epigastrica brings blood to the front wall of the belly.
