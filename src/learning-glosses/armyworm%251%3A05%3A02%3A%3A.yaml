simpleMeaning: Noctuid moth larvae that travel in huge numbers, destroying especially grass and grain.
scope: These moth young are also called army worm, and are not the young of the small fungus fly that
  march when their food is gone.
examples:
- Armyworms moved in huge crowds through the grass.
- The armyworms ate the grass and the grain.
