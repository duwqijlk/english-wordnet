senseId: 'angiotensin-converting_enzyme_inhibitor%1:06:00::'
synsetId: 02676491-n
simpleMeaning: A blood-pressure medicine that stops the body from making a hormone which tightens arteries,
  so they relax and more salt and water leave the body; it also treats heart failure.
scope: A blood-pressure drug that works by cutting off a vessel-narrowing hormone, not a diuretic that
  flushes out fluid directly.
examples:
- Her doctor switched her to an angiotensin-converting enzyme inhibitor after the first drug caused a
  cough.
- Angiotensin-converting enzyme inhibitors are often prescribed after a heart attack.
