simpleMeaning: So careful and thorough that every small detail is examined.
scope: This means careful and detailed, another name for 'minute' in that sense, not the physical sense
  of little width nor the sense of limited scope.
examples:
- A narrow scrutiny of the records revealed the missing payment.
- The auditors made a narrow examination of every receipt.
