simpleMeaning: A small, quail-like ground bird from southern Eurasia and northern Africa that has no hind
  toe; classed with wading birds, it still lives on grassy plains.
scope: Another name for the small, quail-like ground bird also called bustard quail and button quail;
  not a true quail, and not a bustard, which is a much larger bird.
examples:
- A button-quail slipped into the tall grass at the edge of the field.
- The button-quail is classed with wading birds, yet it rarely goes near water.
