simpleMeaning: Said of things to do with periodontics, the care of the gums and the bones that hold the
  teeth
scope: Also called periodontic, this is said of things to do with the care of the gums and the bones that
  hold the teeth, not of things to do with the teeth alone and not of things to do with the mouth as a
  whole.
examples:
- Periodontal disease had weakened the gums.
- She saw a periodontal specialist about her sore gums.
