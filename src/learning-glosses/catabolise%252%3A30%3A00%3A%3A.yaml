senseId: 'catabolise%2:30:00::'
synsetId: 00239606-v
simpleMeaning: to break a substance down into simpler parts in a living thing
scope: To break a substance down into simpler parts in a living thing; catabolize is another name for
  this sense; not to build a substance up, and not to burn it away.
examples:
- The body will catabolise muscle when it runs out of food.
- During fasting, the liver catabolises stored fat for energy.
