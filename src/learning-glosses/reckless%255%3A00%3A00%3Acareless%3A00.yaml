simpleMeaning: showing no care or concern about what you do or what may come of it
scope: About not caring what happens; not the bolder sense of knowing the danger and going against it
  anyway.
examples:
- His reckless spending left him with no money left for rent.
- She took a reckless approach to the work and never checked anything she did.
