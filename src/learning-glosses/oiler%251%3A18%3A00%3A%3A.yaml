simpleMeaning: A person who puts oil on engines or machines so they keep working well
scope: A person who puts oil on engines or machines; not a person who makes or sells fuel, and not a person
  who fixes broken machines.
examples:
- The oiler moved along the row of machines with his can of oil.
- An oiler keeps the factory engines running smoothly.
