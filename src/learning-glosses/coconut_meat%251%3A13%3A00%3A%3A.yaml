simpleMeaning: Often cut into shreds for use in such dishes as cakes and curries, this white flesh inside
  the hard round nut of the palm tree is good to eat
scope: Also called coconut, this is the white flesh inside the hard round nut of the palm tree, often
  cut into shreds for cakes and curries.
examples:
- She grated coconut meat into the curry.
- The cake was topped with shreds of coconut meat.
