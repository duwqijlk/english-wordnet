simpleMeaning: done with the skill of a person who knows the job very well
scope: Done with the skill of a person who knows the job well; not done in a clumsy or careless way, and
  not done by luck.
examples:
- He repaired the television expertly in under an hour.
- She expertly guided the boat through the narrow channel.
