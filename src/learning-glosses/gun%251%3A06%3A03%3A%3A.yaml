simpleMeaning: A pump worked by hand that looks like a pistol, used to push thick grease into machine
  parts.
scope: This is a hand tool that pumps grease into machinery, not a weapon that fires a missile from a
  tube, not large transportable armament, not a person judged by shooting skill, not a hired killer, not
  a vehicle's accelerator pedal, not a ceremonial firing of a firearm as a signal or salute, and not the
  verb meaning to shoot.
examples:
- He loaded the gun with grease and pumped it into the wheel bearing.
- The garage's grease gun was empty, so the mechanic refilled it from a drum.
