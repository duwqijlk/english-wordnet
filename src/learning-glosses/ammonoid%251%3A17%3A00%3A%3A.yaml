simpleMeaning: Coiled round in a spiral and split inside into small rooms, this shell kept as stone is
  left by a long-dead soft-bodied animal.
scope: This shell kept as stone is also called ammonite, and it comes from a long-dead animal, not a living
  one.
examples:
- The ammonoid on the shelf was a stone shell wound into a spiral.
- Brushing the dust from the ammonoid showed the small rooms inside.
