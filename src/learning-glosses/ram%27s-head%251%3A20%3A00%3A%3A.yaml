simpleMeaning: Its brownish-green bloom has a red-and-white lip that looks like the face of a male sheep,
  and it is an orchid of northern North America.
scope: It is also called a ram's-head lady's slipper, and its brownish-green bloom has a red-and-white
  lip that looks like the face of a male sheep.
examples:
- The ram's-head showed a brownish-green bloom with a red-and-white lip.
- In northern North America, the ram's-head blooms with a lip like the face of a male sheep.
