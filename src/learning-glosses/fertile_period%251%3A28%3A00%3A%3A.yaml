simpleMeaning: the days in a woman's monthly cycle, 7 days before to 7 days after the egg is set free,
  when a new life is most likely to start
scope: 'Also called a fertile phase: the days in a woman''s monthly cycle when a new life is most likely
  to start, not the whole cycle and not the days when a new life cannot start.'
examples:
- Her fertile period comes in the middle of her cycle.
- Doctors say the fertile period lasts from 7 days before to 7 days after ovulation.
