simpleMeaning: able to be shaped or made into new forms, especially of earth or clay or other soft material
scope: For a soft material that can itself be shaped, especially earth or clay; not a payment card, and
  not a person or thing that shapes other things.
examples:
- Plastic clay is easy for children to shape with their hands.
- The plastic earth by the river could be pressed into a small bowl.
