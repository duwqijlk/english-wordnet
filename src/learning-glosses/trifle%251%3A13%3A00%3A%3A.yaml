simpleMeaning: a cold sweet dish of layers of soft cake with fruit or jelly, sometimes topped with nuts,
  cream, or chocolate
scope: A cold sweet dish of layers of soft cake with fruit or jelly, not time wasted doing nothing.
examples:
- She served a trifle of cake, fruit, and cream after dinner.
- A trifle with nuts and chocolate stood on the table.
