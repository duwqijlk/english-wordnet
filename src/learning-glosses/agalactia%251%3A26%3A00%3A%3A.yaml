simpleMeaning: a state in which a mother's breasts make no milk once her baby has been born
scope: Also called agalactosis, this is a state in which a mother's breasts make no milk once her baby
  has been born, not a short supply of milk that grows over time and not a problem with the baby feeding.
examples:
- The doctor said her agalactia meant her breasts made no milk after the birth.
- Agalactia left the new mother unable to feed her baby from her own breasts.
