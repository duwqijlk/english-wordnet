simpleMeaning: A very old kind of green plant that stays green all year, looks like moss, and carries
  tiny dust-like bits that grow into new plants in club-shaped cases.
scope: A very old moss-like green plant, also called club-moss or club moss; not a true moss and not a
  fern.
examples:
- The lycopod grew in a damp, shaded corner of the woods.
- Lycopods spread by tiny dust-like bits from their club-shaped cases.
