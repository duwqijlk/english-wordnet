simpleMeaning: Often, on a line where each worker does one job, many copies of the same thing are made
scope: Making many of the same thing at once, not making one thing by hand and not making things to order.
examples:
- The car plant switched to mass production to turn out thousands of cars each week.
- Mass production keeps the price of each shirt low.
