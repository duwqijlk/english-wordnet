simpleMeaning: From Maine to Ohio and Georgia, in the east of the United States, grows a plant that is
  a close kin of the southern kind.
scope: This plant of the eastern United States is a close kin of the southern kind, not the kind with
  blue-black berries and wood once used for arrows.
examples:
- In the east of the United States, arrow wood grows from Maine to Ohio and Georgia.
- The arrow wood is a close kin of the southern kind.
