simpleMeaning: Spots break out on the skin and the head and joints ache when small flying insects pass
  this sickness on in hot lands
scope: It is also called dengue, breakbone fever and dandy fever, and it is a sickness of hot lands spread
  by insects.
examples:
- Dengue fever left him with aching joints.
- He caught dengue fever and broke out in a rash.
