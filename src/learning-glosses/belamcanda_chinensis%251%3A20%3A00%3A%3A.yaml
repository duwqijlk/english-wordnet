simpleMeaning: A garden plant whose seed case opens when ripe to show a mass of seeds like a blackberry.
scope: This is a garden plant whose seed case opens when ripe to show a mass of seeds like a blackberry;
  blackberry-lily and leopard lily are other names for it, and the blackberry likeness is in the seeds,
  not in the flowers.
examples:
- Belamcanda chinensis shows a mass of seeds like a blackberry when ripe.
- The Belamcanda chinensis in the garden opened its seed case.
