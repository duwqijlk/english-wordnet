simpleMeaning: A climbing plant common in eastern and central United States, with leaves in threes and
  greenish flowers followed by white berries; its oil irritates the skin and causes a rash
scope: Also called markweed, poison ivy, poison oak and Toxicodendron radicans; a climbing plant that
  gives a rash, close to other poison plants such as poison sumac.
examples:
- Rhus radicans gave him a rash.
- We avoided the Rhus radicans by the path.
