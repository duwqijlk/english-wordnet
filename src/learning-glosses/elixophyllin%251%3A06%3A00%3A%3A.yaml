simpleMeaning: A clear crystal-like drug from tea leaves or made by chemists, used in medicine to open
  the airways.
scope: A drug from tea leaves that opens the airways, also called theophylline, Slo-Bid and Theobid; not
  a tea to drink.
examples:
- Elixophyllin opened his airways when he could not breathe.
- The doctor gave her Elixophyllin for her cough.
