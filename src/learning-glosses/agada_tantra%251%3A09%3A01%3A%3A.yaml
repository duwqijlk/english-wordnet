simpleMeaning: 'In Ayurveda, the branch of medicine that studies poisons: it deals with food poisoning
  and bites from snakes, dogs and insects. It is one of the tradition''s eight branches.'
scope: The toxicology branch of Ayurveda, not the whole of Ayurvedic medicine or its other seven branches.
examples:
- Students of agada tantra learn how to treat snakebite and poisoning.
- In classical texts, agada tantra is listed among the eight branches of Ayurveda.
