simpleMeaning: A word that says a thing is bigger in size, amount, reach or strength, used with stuff
  that cannot be counted
scope: 'Also called more: a word that says a thing is bigger, not a word that says a thing is the biggest
  and not a word used with things that can be counted.'
examples:
- We need more than a gallon of paint for the wall.
- More rain fell than we had hoped for.
