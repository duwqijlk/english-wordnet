simpleMeaning: to refuse to do what you are told or what the rules say, and act in your own way instead
scope: To refuse to do what you are told or what the rules say, not to obey and not to agree with a plan.
examples:
- He disobeyed his supervisor and was fired.
- The child disobeyed her mother and stayed out late.
