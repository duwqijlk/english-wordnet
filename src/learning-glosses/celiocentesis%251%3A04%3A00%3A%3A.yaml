simpleMeaning: the act of taking out liquid from the belly by putting a thin hollow needle through the
  skin
scope: Taking liquid out of the belly with a needle, not cutting the belly open and not looking inside
  it with a camera.
examples:
- The doctor ordered celiocentesis to test the fluid in the patient's belly.
- Celiocentesis helped drain the extra fluid from her abdomen.
