senseId: 'floating-point_notation%1:10:00::'
synsetId: 06826558-n
simpleMeaning: a base system for writing numbers where a raised number shows where the dot goes; 0.0012
  is written as 0.12 with -2, and -2 is the raised number
scope: A way of writing numbers with a raised number showing where the dot goes; floating-point representation
  system is another name for this sense. Not ordinary decimal writing, and not a way of writing whole
  numbers only.
examples:
- In floating-point notation, 0.0012 is written as 0.12 with -2.
- The computer stores the number in floating-point notation to save space.
