simpleMeaning: a mid-sized tree that keeps its leaves all year, from the southwest of the United States
  and northwest Mexico, with long narrow leathery leaves often edged with spines
scope: 'Also called canyon live oak, canyon oak, and iron oak: an oak that keeps its leaves all year,
  not a pine and not an oak that loses its leaves in winter.'
examples:
- The maul oak keeps its leaves all year.
- We rested under a maul oak with long leathery leaves.
