simpleMeaning: A tall plant that grows straight up, lives for many years, and has large groups of flowers,
  most often blue, in the southeast of the United States
scope: A plant of the southeast United States with large blue flower heads, not the cornflower plant itself
  and not the colour cornflower blue.
examples:
- The cornflower aster grew tall in the garden in Florida.
- We saw a cornflower aster with large blue flower heads near the road.
