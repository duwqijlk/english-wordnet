simpleMeaning: the use of ways that rest on watching and testing, in any craft or field of study
scope: Using ways that rest on watching and testing; not the doctrine that all knowledge comes from sense
  and not medical practice that ignores science.
examples:
- His empiricism shaped the way he taught science.
- Empiricism in art means judging by what you see and test.
