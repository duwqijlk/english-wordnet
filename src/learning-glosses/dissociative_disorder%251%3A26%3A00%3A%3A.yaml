simpleMeaning: A break so deep that the mind's parts, usually joined in knowing the world and oneself,
  fall apart
scope: A deep break in which the mind's joined parts fall apart, not a bad mood and not a loss of memory
  alone.
examples:
- Dissociative disorder left her unable to join what she felt and knew.
- The doctor said dissociative disorder had broken the joined work of his mind.
