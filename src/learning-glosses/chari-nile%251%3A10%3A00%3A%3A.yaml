simpleMeaning: A group of tongues in the Nilo-Saharan family, spoken in parts of Sudan, Zaire, Uganda
  and Tanzania.
scope: A group of tongues in the Nilo-Saharan family, not a single tongue and not a family of tongues
  from West Africa.
examples:
- Chari-Nile tongues are spoken in parts of Sudan and Uganda.
- The Chari-Nile group holds many tongues of central Africa.
