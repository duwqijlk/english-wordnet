simpleMeaning: In maths, the pattern of how many successes there are in a set number of separate tries,
  when each try has the same chance of success.
scope: 'A maths pattern for chance: it gives how many successes to expect in a fixed set of separate tries,
  each with the same chance of success; also called binomial distribution.'
examples:
- The Bernoulli distribution tells us how many wins to expect in ten tries.
- We used the Bernoulli distribution to work out the chance of five heads in a row.
