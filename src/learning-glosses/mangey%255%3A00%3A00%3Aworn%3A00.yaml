simpleMeaning: The soft raised surface of cloth or fur has many bare patches where it has worn thin
scope: Also called mangy, this is cloth or fur worn thin in many bare patches, not cloth that is dirty
  and not cloth that is torn.
examples:
- The mangey carpet showed bare patches by the door.
- His mangey coat had lost its soft nap in places.
