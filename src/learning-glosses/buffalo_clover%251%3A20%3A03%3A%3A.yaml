simpleMeaning: a low one-year plant of Texas and the south-west United States, with soft leaves and blue
  flowers, and a chief cause of farm animals being poisoned there
scope: This low plant of the south-west United States is a chief cause of farm animals being poisoned;
  bluebonnet is another name for this sense.
examples:
- Buffalo clover grows low along the road in Texas.
- The vet said buffalo clover had poisoned the farmer's cows.
