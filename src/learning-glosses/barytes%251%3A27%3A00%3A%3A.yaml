simpleMeaning: a white or colourless hard matter found in the ground, the main place from which the metal
  barium comes
scope: 'Also called barite, barium sulphate and heavy spar: a hard matter found in the ground, not the
  white powder used to give paint its colour.'
examples:
- Barytes is mined as the main source of barium.
- The white barytes stood out against the dark rock.
