simpleMeaning: Solemnly and in set form, to state that something is true.
scope: To state solemnly and in set form that something is true, also called swear or swan, assert, verify,
  or affirm; not the use for admitting something openly and bluntly.
examples:
- Before the court, he avowed that he had told the truth.
- She avowed her loyalty to the king in a solemn oath.
