simpleMeaning: Able to bring about a change in the genes of a living thing, most often said of things
  that act inside cells.
scope: Able to bring about a gene change, not the gene change itself and not a treatment for a disease.
examples:
- The mutafacient chemical changed the genes of the cells in the dish.
- Researchers tested whether the mutafacient agent could alter the cells.
