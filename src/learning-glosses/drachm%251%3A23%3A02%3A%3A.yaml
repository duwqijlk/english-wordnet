simpleMeaning: Sixty minims, tiny measures of liquid, make up this British imperial measure of how much
  a liquid or dry thing fills, or 3.5516 cubic centimetres.
scope: It is also called fluid drachm, fluid dram and fluidram, a British imperial measure of how much
  a liquid or dry thing fills, and not a measure of weight or the apothecary drachm of an eighth of an
  ounce.
examples:
- The recipe called for a drachm of the liquid.
- He measured out one drachm of the medicine.
