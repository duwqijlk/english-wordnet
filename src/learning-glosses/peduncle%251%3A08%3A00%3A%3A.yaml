simpleMeaning: Parts of the brain are joined by this bundle of nerve cells, each with a fatty coat
scope: 'Also called a cerebral peduncle: a bundle of nerve cells joining parts of the brain, not a stalk
  that holds a flower and not the thin part that joins a polyp to the body.'
examples:
- The peduncle links the midbrain to the rest of the brain.
- Damage to a peduncle can cut off signals between parts of the brain.
