simpleMeaning: To make people or things follow rules, principles, or accepted practice, or to impose rules
  on them.
scope: This is about setting or enforcing rules, not asking for goods, ranking items, or making a space
  tidy.
examples:
- The monks ordered their days by a strict rule of prayer and work.
- New laws ordered how much water each farm could take.
