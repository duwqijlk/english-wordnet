simpleMeaning: a big bird that feeds mostly on dead animals, flying by day with a bare head and weak claws;
  one of several kinds of hunting bird
scope: A big bird that lives mostly on dead animals, not a hawk or an eagle that hunts live prey.
examples:
- Vultures circled above the plain, waiting for the dead animal below.
- The vulture landed beside the carcass and tore at it with its beak.
