simpleMeaning: to take out the parts that should not be there, make what is left stronger, and separate
  it by boiling and cooling the steam
scope: This sense is about cleaning a thing in this way, also called distill and sublimate; it is not
  about making a person free from wrong acts, and not about a person becoming free from them.
examples:
- They purify the liquid by boiling it and cooling the steam.
- Workers purify the alcohol by taking out unwanted parts and boiling it.
