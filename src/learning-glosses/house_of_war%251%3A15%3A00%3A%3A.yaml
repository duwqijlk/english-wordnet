simpleMeaning: These are lands where Muslims are few in number and people treat them badly.
scope: Also called Dar al-harb, these are lands where Muslims are few in number and people treat them
  badly, not lands where Muslims rule.
examples:
- In the House of War, Muslims are in the minority.
- He wrote about the House of War and the lands where Muslims are few.
