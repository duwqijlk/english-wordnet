simpleMeaning: the quality of shining with bright light that bounces back from a surface
scope: 'Also called glitter and sparkle: the bright shine made when light bounces back from a surface,
  not the act of a thing shining for a short time.'
examples:
- The glisten of the wet stones caught her eye.
- There was a soft glisten on the lake at sunset.
