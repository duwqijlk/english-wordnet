simpleMeaning: Much of the hard stuff found in sand and rock is in this sandstone, which is made of big
  hard grains
scope: A hard, coarse-grained sandstone, also called grit and gritstone, not a soft crumbly stone and
  not loose sand.
examples:
- The mill was built of gritrock, cut in rough blocks.
- Gritrock steps had worn smooth under a hundred years of feet.
