senseId: 'angle_of_inclination%1:25:00::'
synsetId: 13912295-n
simpleMeaning: In geometry, the turn from the flat line that runs left and right to a given line, counted
  against the clock from the right half of the flat line.
scope: 'Also called inclination: the turn from the flat left-right line to a given line, not the turn
  a crystal needs before it looks darkest.'
examples:
- The angle of inclination is measured from the flat line that runs left and right.
- She worked out the angle of inclination of the sloping line.
