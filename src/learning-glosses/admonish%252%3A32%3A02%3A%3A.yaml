senseId: 'admonish%2:32:02::'
synsetId: 00872241-v
simpleMeaning: To advise someone about how they should behave.
scope: To advise someone about their behaviour; warn and discourage are other names for this sense, and
  it is not to punish nor to praise.
examples:
- She admonished him to be quiet.
- The teacher admonished the class not to go too far.
