simpleMeaning: To act toward others as if one is better than them.
scope: Speaking down to others as if better than them, not lowering oneself by a shameful act and not
  doing something below one's dignity.
examples:
- The teacher condescended to the pupils.
- She condescended to her staff in every meeting, treating them as if they were children.
