simpleMeaning: A plant seed part that is partly turned over and bent back at a right angle on its stalk.
scope: A plant seed part that is partly turned over and bent back at a right angle on its stalk, not a
  seed part that stands straight and not a seed part turned fully over.
examples:
- The amphitropous ovule bends back on its stalk.
- Each amphitropous ovule is partly turned over.
