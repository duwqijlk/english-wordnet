simpleMeaning: A box of lead and acid in a motor vehicle that stores power, starts the car and runs its
  lights, most often with six cells giving 12 volts.
scope: Also called a car battery, this is the power box in a motor vehicle that starts the car and runs
  its lights, not the small cell that powers a torch.
examples:
- The automobile battery went flat, so the car would not start.
- A new automobile battery gave the old truck its power back.
