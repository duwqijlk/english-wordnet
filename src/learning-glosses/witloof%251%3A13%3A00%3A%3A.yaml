simpleMeaning: A young plant with wide leaves, a kind of endive kept out of the light so it grows a thin
  pale head
scope: A young endive plant kept from light, not the grown plant with leaves eaten as a salad green.
examples:
- The farmer keeps his witloof in the dark so the heads stay pale.
- Witloof forms a thin pale head when it gets no light.
