senseId: 'stonewall%2:30:00::'
synsetId: 00461087-v
simpleMeaning: To drag things out on purpose, or refuse to help, so nothing gets done.
scope: To hold things up on purpose or refuse to work with others; not a wall of stone and not a firm
  defence.
examples:
- The minister stonewalled every question about the missing money.
- They stonewalled the inquiry for months.
