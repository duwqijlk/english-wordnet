simpleMeaning: A person who runs a formal event, giving the opening talk and bringing on the other speakers
scope: A person who runs a formal event, giving the opening talk and bringing on the other speakers; host,
  emcee and master of ceremonies are other names for this sense, and it is not a speaker who only gives
  one talk.
examples:
- The MC welcomed us and brought on the first speaker.
- She was the MC at the formal dinner.
