senseId: 'ignominiousness%1:07:00::'
synsetId: 04815533-n
simpleMeaning: The state of being unworthy in a way that deserves public shame and loss of honour.
scope: Being unworthy in a way that brings public shame, also called disgracefulness or shamefulness;
  not a private fault and not a single shameful act.
examples:
- His ignominiousness after the scandal kept him out of public life.
- The ignominiousness of the fraud was talked about all over town.
