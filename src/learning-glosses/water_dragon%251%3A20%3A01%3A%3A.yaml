simpleMeaning: In the swamps of Europe and North America grows a plant whose bright yellow blooms look
  like buttercups.
scope: Also called cowslip, kingcup, marsh marigold, and meadow bright, this is a swamp plant of Europe
  and North America with bright yellow blooms like buttercups, not the North American kind with small
  white flowers.
examples:
- The water dragon was in bloom along the swamp edge.
- We found water dragon growing in the wet ground by the marsh.
