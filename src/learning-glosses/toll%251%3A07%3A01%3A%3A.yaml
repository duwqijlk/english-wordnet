simpleMeaning: What a thing costs you in loss, pain, or hard work, not in money
scope: What a thing costs in loss, pain, or hard work, also called cost and price, not a fee for a road
  or bridge.
examples:
- The cost in human life was a heavy toll.
- The toll of years of hard work showed on his face.
