simpleMeaning: a word or a few words given to an actor to help them go on, often the start of the next
  line
scope: 'Also called a prompt: a cue that helps an actor go on, not words meant to persuade a person to
  act.'
examples:
- The audience could hear his prompting from the wings.
- She gave him a prompting when he forgot his line.
