simpleMeaning: Golf balls are among the things made with this stuff, which turns hard when it dries.
scope: Also called balata, this stuff turns hard when it dries and goes into things such as golf balls.
examples:
- The gutta balata in the old golf ball had gone hard.
- They used gutta balata to make golf balls.
