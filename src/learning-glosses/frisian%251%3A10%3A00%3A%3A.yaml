simpleMeaning: A West Germanic language spoken in Friesland in the north-west of the Netherlands, a near
  kin of English.
scope: 'Also called the Frisian language: a West Germanic language of Friesland in the north-western Netherlands,
  near kin of English, not the people of Friesland and not the adjective for things of Friesland.'
examples:
- Frisian is spoken in Friesland.
- Frisian is a near relative of English.
