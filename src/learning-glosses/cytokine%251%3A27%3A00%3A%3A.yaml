simpleMeaning: Any of a range of tiny protein bits sent out by cells of the body's defence system to keep
  that system in order.
scope: This is a tiny protein bit sent out by defence cells to keep the defence system in order, not a
  hormone from a gland or a cell that fights germs.
examples:
- The body sends out a cytokine when it needs to guide its defence cells.
- Doctors measured the cytokine in her blood during the illness.
