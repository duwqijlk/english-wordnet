simpleMeaning: the house and the land around it where a family lives
scope: This sense is a family's house and the land around it; it is not only the farmhouse building with
  its farm land, and it is not the act of settling on government land.
examples:
- The family sold their homestead after fifty years.
- His homestead included the house, the yard, and a small field.
