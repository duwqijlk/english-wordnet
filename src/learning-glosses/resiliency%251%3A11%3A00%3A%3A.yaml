simpleMeaning: One time when a thing jumps back to where it was after being bent or pushed.
scope: One act of springing back, also called resilience, and not the lasting power of a material to spring
  back.
examples:
- The resiliency of the ball sent it high into the air.
- Each resiliency of the spring took it back to its first shape.
