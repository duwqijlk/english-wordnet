simpleMeaning: to work out an answer with numbers, by adding, taking away, multiplying, dividing, or other
  math work
scope: 'Also called figure, reckon, and compute: to work out an answer with numbers, not to plan something
  and not to guess what will happen.'
examples:
- The students calculate the total by adding all the numbers together.
- He calculated the cost of the trip by adding up the train fares.
