simpleMeaning: a bright line of light seen in the night sky when a small rock from space burns up as it
  falls through the air
scope: A bright line of light in the night sky from a small space rock burning up, not the rock itself
  and not a star.
examples:
- We saw a bright meteor shoot across the night sky.
- A meteor flashed above the hills and was gone in a second.
