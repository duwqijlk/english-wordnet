simpleMeaning: linked by pointing to the same real thing or idea
scope: Linked by pointing to the same real thing or idea; not words that merely sound alike, and not words
  that point to different things.
examples:
- The two phrases are coreferent because they point to the same person.
- '''The morning star'' and ''the evening star'' are coreferent names for Venus.'
