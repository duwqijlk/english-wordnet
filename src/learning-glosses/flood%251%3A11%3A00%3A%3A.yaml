simpleMeaning: In the sea, the time when water comes in, between low tide and the next high tide
scope: This is sea water coming in between tides. It is not water rising over dry land, and not the act
  of filling something until it spills over.
examples:
- The fishermen set out on the flood as the tide came in.
- They timed their return with the flood, when the sea water was rising toward high tide.
