simpleMeaning: A widely grown Eurasian plant that completes its life in one season, whose flat seeds are
  cooked like peas or ground into meal, and whose leafy stalks feed livestock.
scope: This is the growing plant, not the round flat seed sold as food; lentil is another name for the
  same crop.
examples:
- Each lentil plant bears small flat seeds in short pods.
- Farmers harvest the lentil plant for its seeds and feed the leafy stalks to livestock.
