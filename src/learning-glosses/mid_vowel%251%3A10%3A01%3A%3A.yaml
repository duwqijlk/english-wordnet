senseId: 'mid_vowel%1:10:01::'
synsetId: 92463294-n
simpleMeaning: Halfway between high and low sounds, any sound in language study made with some part of
  the tongue held a bit high toward the roof of the mouth.
scope: This is a speech sound made with the tongue halfway up, not a high sound and not a low sound.
examples:
- In the word the mid vowel sits halfway between the high and the low sounds.
- The teacher asked the class to say the mid vowel with the tongue held a bit high.
