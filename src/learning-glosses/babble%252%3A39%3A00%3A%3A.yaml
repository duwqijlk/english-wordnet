simpleMeaning: Said of water, to flow in a rough, uneven way, with a noise like small bubbles bursting.
scope: 'Also called bubble, ripple, or gurgle: water flowing in a rough, uneven way with a noise like
  small bubbles bursting, not talking and not giving away a secret.'
examples:
- Babbling brooks ran through the meadow.
- The stream babbled over the stones all day.
