simpleMeaning: Leafy plants, or their leaves and stems, that people eat as vegetables.
scope: This means vegetables such as spinach or cabbage; it is not the color, a grassy lawn, or a political
  party member.
examples:
- Serve the roasted meat with steamed greens and new potatoes.
- She grows winter greens in the raised beds behind the kitchen.
