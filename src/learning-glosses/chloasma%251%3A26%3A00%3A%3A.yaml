simpleMeaning: a brown mark on a woman's face that comes with being pregnant or taking birth-control pills
scope: A brown mark on a woman's face linked to pregnancy or birth-control pills, also called melasma
  and mask of pregnancy; not a sunburn and not a birthmark.
examples:
- Chloasma darkened her cheeks during the pregnancy.
- The chloasma faded after she stopped taking the pills.
