simpleMeaning: A strict eater of plant food only, who takes no animal or dairy food and may also refuse
  things made from animals, such as leather
scope: A strict plant-food eater who takes no animal or dairy food, not a person who merely avoids meat.
examples:
- She has been a vegan for ten years.
- The vegan asked for a meal with no dairy in it.
