simpleMeaning: a low flat plant with round heads of deep pink to white flowers, growing in dunes along
  the coast from British Columbia to Baja California
scope: Also called beach sand verbena; a low plant of coastal dunes, not a tall garden verbena and not
  a desert plant.
examples:
- Pink sand verbena covered the dunes with deep pink flowers.
- We found pink sand verbena growing in the sand near the shore.
