simpleMeaning: Sea animals that build hard, chalky frames, which pile up in great masses to make reefs
  and islands.
scope: Sea animals that build hard chalky frames forming reefs and islands, also called madrepore or stony
  coral, not soft sea fans and not single shellfish.
examples:
- Madriporian coral formed the reef off the coast.
- The madriporian coral grew in warm, shallow water.
