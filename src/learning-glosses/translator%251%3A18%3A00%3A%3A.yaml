senseId: 'translator%1:18:00::'
synsetId: 10232171-n
simpleMeaning: a person who stands between people who speak different languages and puts what each says
  into the other's language
scope: A person who helps people who speak different languages talk to each other in person, not a computer
  program that turns one language into another and not a person who turns written words from one language
  into another.
examples:
- The translator helped the two leaders talk to each other.
- We hired a translator so the visitors could follow the meeting.
