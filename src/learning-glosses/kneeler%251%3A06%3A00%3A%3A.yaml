simpleMeaning: a board for a person to rest their knees on, sometimes with soft padding on top
scope: This is a thing to rest the knees on, not a person who is down on their knees, which is the other
  sense of this word.
examples:
- He knelt on a wooden kneeler in church.
- She put a cushioned kneeler under her knees while she cleaned the floor.
