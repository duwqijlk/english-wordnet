simpleMeaning: a clear panel set into something you cannot see through, such as an envelope, so that part
  of what is behind it shows.
scope: This is a clear panel set into opaque material, not an opening built into a building or a vehicle.
examples:
- The envelope has a small window that shows the address.
- The company uses envelopes with a clear window for the return address.
