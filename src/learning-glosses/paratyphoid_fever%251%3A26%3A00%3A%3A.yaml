simpleMeaning: any of a group of gut illnesses that spread by infection and look like typhoid
scope: A gut illness like typhoid, not typhoid itself; paratyphoid is another name for this sense.
examples:
- The child caught paratyphoid fever from dirty water.
- The doctor said the paratyphoid fever looked like typhoid fever.
