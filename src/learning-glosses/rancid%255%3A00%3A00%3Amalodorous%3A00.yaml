simpleMeaning: with a bad smell from going stale or starting to turn
scope: Smelling bad from staleness, not a smell from fresh food and not the rank taste of old oils and
  fats; sour is another name for this sense.
examples:
- The rancid butter smelled so bad that she threw it away.
- Old nuts can go rancid in a warm cupboard.
