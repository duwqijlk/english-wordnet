simpleMeaning: A ring of small leaf-like parts that look like the cup under a flower, as in a carnation
  or hibiscus.
scope: 'Also called a calycle, a calyculus and a false calyx: a ring of small leaf-like parts that look
  like the cup under a flower, not the cup itself and not the flower''s petals.'
examples:
- The carnation shows an epicalyx under its flower.
- An epicalyx looks like a second cup under the flower.
