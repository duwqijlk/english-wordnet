simpleMeaning: A tall yearly grain plant with kernels on large ears, widely grown in many kinds in America;
  the main grain of Mexico and Central and South America since before Columbus.
scope: Also called corn, maize and Zea mays; a tall cereal grass, not wheat and not rice.
examples:
- Indian corn grew tall in the field by the river.
- The farmers ground Indian corn into meal.
