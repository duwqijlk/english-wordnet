simpleMeaning: A tropical American annual herb with a swollen pod in which the ripe seeds rattle.
scope: Also called American rattlebox; a one-year herb of warm America, the one whose seeds rattle in
  the pod.
examples:
- The Crotalaria sagitallis pods rattled as we walked past.
