simpleMeaning: a drink got by heating a mix of crushed grain and water and cooling the steam, with maize
  making up at least 80 percent of the mix
scope: A drink made from a grain mix that is at least 80 percent maize, also called corn and corn whiskey,
  not a drink made from barley and not a drink made from rye.
examples:
- She sipped the corn whisky, distilled from a mash of mostly maize, after dinner.
- The bottle of corn whisky was made from a mash of mostly maize.
