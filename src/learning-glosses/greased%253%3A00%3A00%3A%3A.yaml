simpleMeaning: covered with oil or a thick slippery fat, put on so that parts rub less and move more easily
scope: 'Also called lubricated: covered with oil so parts rub less and move easily; not a surface that
  is clean and dry, with nothing on it.'
examples:
- The greased wheel turned quietly and easily.
- She put the cake mix into a greased pan.
