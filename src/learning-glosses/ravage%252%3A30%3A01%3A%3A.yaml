simpleMeaning: to wreck a place or thing so fully that little is left standing
scope: 'Also called waste, devastate and desolate: to wreck something so fully that little is left, not
  a raid in war and not a small bit of harm.'
examples:
- The storm ravaged the coast and left the town in ruins.
- Fire ravaged the forest for a week.
