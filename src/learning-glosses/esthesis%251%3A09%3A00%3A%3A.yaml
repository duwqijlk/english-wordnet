simpleMeaning: a bare knowing that something has touched or stirred the senses, with no thought added
  to it
scope: 'Also called aesthesis and sensation: a bare knowing that the senses have been stirred, not a clear
  thought about what was felt and not a strong feeling.'
examples:
- The esthesis of warmth on her skin came before she knew what it was.
- An esthesis of touch told him something was there, though he could not say what.
