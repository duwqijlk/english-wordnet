simpleMeaning: To play the part of someone or something else, or behave as if something untrue is real.
scope: Play-acting a role or a false situation, not putting on an affected manner and not lying to deceive;
  make and make believe are other names for this sense.
examples:
- The children pretended to be astronauts landing on the moon.
- In the school play, she pretended to be a queen.
