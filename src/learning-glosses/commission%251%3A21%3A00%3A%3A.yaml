simpleMeaning: money paid to a person for a service, worked out as a share of the amount of money involved
  rather than as a regular salary.
scope: This is not the act of giving authority, and it is not the group appointed to a task; it is only
  the payment.
examples:
- The salesperson earns a commission on every car sold.
- He gets a small commission for each deal he arranges.
