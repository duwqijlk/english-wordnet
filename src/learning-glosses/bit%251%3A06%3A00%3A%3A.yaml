simpleMeaning: The cutting end of a drill, usually pointed, with a spiral ridge, that fits in a brace,
  a tool holder or a drill press and can be changed.
scope: This is not the end of a key, a unit for measuring information, or the metal piece in a horse's
  mouth; it is the cutting end of a drill.
examples:
- He fitted a new bit to the drill before drilling into the steel plate.
- The drill bits in the box are sized for wood, metal and masonry.
