simpleMeaning: the act of changing something or fixing a mistake in it
scope: This is the act of changing or fixing something, not a written statement added to a bill, a constitution,
  or another plan to change it.
examples:
- The amendment of the old law took months of careful work.
- Her amendment of the letter made it clear and correct.
