simpleMeaning: a person who wants countries to settle things by talking with each other, rather than by
  fighting a war
scope: A person who wants talks between countries rather than war, not the bird itself and not its meat
  cooked as food.
examples:
- As a dove, she urged talks instead of sending more troops.
- The doves in the government opposed the attack.
