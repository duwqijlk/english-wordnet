simpleMeaning: Courts must follow set rules, with proper safeguards, before they may take the life, freedom,
  or goods of a person
scope: Due process is another name for this rule that guards the life, freedom, and goods of a person.
examples:
- Due process of law kept the farmer's land safe until the court had heard him.
- She asked for due process of law before the town took her shop.
