simpleMeaning: An ankle-high shoe tied with laces through two or three pairs of holes, often made of suede.
scope: Also called a chukka boot, an ankle-high laced shoe; not one of the six parts of a polo match.
examples:
- He wore chukkas with his jeans.
- The chukka laced up neatly round his ankle.
