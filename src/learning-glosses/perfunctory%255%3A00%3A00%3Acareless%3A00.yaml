simpleMeaning: done quickly and without care for small points, and not done fully
scope: 'Also called passing, casual, superficial, and cursory: done in a hurry without care, not done
  slowly and fully with care.'
examples:
- He gave the report a perfunctory check and missed the main mistake.
- Her perfunctory visit lasted only a few minutes.
