simpleMeaning: a short piece of railway track where wagons and trains can be kept, or where trains on
  the same line can pass each other
scope: A short side track for waiting or passing, also called a turnout, not the main line and not a station
  platform.
examples:
- The train pulled onto the siding to let the fast train pass.
- Old wagons stood on the siding for months.
