simpleMeaning: a religious gathering, often one that shares the faith, held in a big tent or out in the
  open for some days
scope: A church gathering held out of doors for days, not a church service in a building and not a summer
  camp for children.
examples:
- They sang and prayed at the camp meeting all weekend.
- The camp meeting was held in a large tent by the river.
