simpleMeaning: A tiny tube in the kidney of an animal with a backbone, one of the parts that take waste
  out
scope: A tiny tube in the kidney that takes waste out, not the whole kidney and not a tube that carries
  blood.
examples:
- Each nephron helps the kidney take waste out of the body.
- Damage to the nephrons can stop the kidney from working well.
