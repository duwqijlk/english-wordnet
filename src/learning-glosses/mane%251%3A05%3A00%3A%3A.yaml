simpleMeaning: long, thick, rough hair that grows along the top of an animal's neck
scope: This is the long hair on an animal's neck, not the short hair on the rest of its body and not a
  person's hair.
examples:
- The horse's mane blew in the wind.
- A lion has a thick mane around its neck.
