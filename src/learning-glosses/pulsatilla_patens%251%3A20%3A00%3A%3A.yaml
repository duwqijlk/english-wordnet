synsetId: 11758221-n
simpleMeaning: A short hairy plant that lives for years, with blue-violet or lilac flowers in early spring,
  from North America and Siberia.
scope: Also called blue tulip, lion's beard, prairie anemone, wild crocus, American pasqueflower, American
  pulsatilla, Anemone ludoviciana and Eastern pasque flower; a short hairy plant with blue-violet or lilac
  flowers in early spring, not a tall smooth plant with summer flowers and not a plant of warm lands.
examples:
- Pulsatilla patens opened its lilac flowers while snow still lay on the ground.
- We found Pulsatilla patens on the cold prairie in early spring.
