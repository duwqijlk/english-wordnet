simpleMeaning: In sailing, a line that holds a thing in one place, especially a boat
scope: This is the line itself that holds a boat in place, not the place where a boat is tied and not
  the act of tying it.
examples:
- A strong mooring held the boat safe through the storm.
- The sailor checked each mooring before he left the boat.
