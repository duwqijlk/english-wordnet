senseId: 'realisation%1:10:00::'
synsetId: 07052802-n
simpleMeaning: a piece of music that someone other than the person who wrote it has finished or made richer
scope: 'Also called realization: the finished piece of music itself, not a sale to get money and not the
  act of making something seem real.'
examples:
- The orchestra played a modern realisation of the old unfinished work.
- Her realisation of the composer's last piece is a full, rich work that orchestras now play often.
