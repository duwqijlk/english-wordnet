simpleMeaning: Giving out a high sound, like the cry of a mouse or a rusty hinge.
scope: 'Also called squealing and squeaky: giving out a high sound, like the cry of a mouse or a rusty
  hinge, not a low rumble or a deep groan.'
examples:
- The squeaking hinge kept her awake.
- A squeaking mouse ran across the floor.
