simpleMeaning: One time when a thing grows less wide.
scope: One time when a thing grows less wide, not the act of making a thing narrower and not a state of
  affairs that shuts in freedom.
examples:
- A narrowing of the road slowed the traffic to one lane.
- The narrowing of the river made the boats turn back.
