simpleMeaning: Once put on the body, a cloth wrap soaked in a substance such as plaster of Paris sets
  hard soon after and then will not move.
scope: A cloth wrap that sets hard once put on, not a soft cloth wrap.
examples:
- The nurse put an immovable bandage on his broken arm.
- Her leg was held still by an immovable bandage that had set hard.
