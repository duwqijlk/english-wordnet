simpleMeaning: a sudden and complete taking over of a government that itself came to power by a sudden
  taking over
scope: A sudden and complete taking over of a government that itself came to power by a sudden taking
  over; not the first taking over itself, and not a slow change of government.
examples:
- The countercoup overthrew the generals within a week.
- A countercoup brought back the old government after the coup.
