simpleMeaning: In pool or billiards, the white ball is struck with this long tool, narrow at one end
scope: Cue, pool cue and pool stick are other names for this long tool, narrow at one end, used to hit
  the white ball in pool or billiards.
examples:
- She picked up the cue stick to hit the white ball in pool.
- A cue stick helps a player strike the white ball in billiards.
