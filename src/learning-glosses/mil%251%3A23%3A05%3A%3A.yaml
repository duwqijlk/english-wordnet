simpleMeaning: a measure of distance used in Sweden that equals ten kilometres
scope: The Swedish ten-kilometre distance unit, also called a Swedish mile, not the thousandth-of-an-inch
  length unit or the metric volume unit.
examples:
- The nearest town is one mil from the farm.
- Swedish maps often show distances in mil.
