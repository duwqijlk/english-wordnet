simpleMeaning: Each list wins seats in line with the share of all votes it gets, when voters choose between
  party lists.
scope: Also called list system and scrutin de liste system, this names the vote in which each party list
  wins seats in line with its share of all votes.
examples:
- They voted by scrutin de liste.
- Under scrutin de liste, the lists shared out the seats.
