scope: Something that makes a person keep wanting it and find it hard to stop, or behavior that shows
  this strong need; not just something a person likes a lot.
examples:
- The drug is highly addictive, and many people find it hard to stop using it.
- His addictive behavior left him wanting the drug all the time.
