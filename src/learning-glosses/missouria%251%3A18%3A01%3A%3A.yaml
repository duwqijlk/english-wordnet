simpleMeaning: A person of the Siouan people who once lived in the valley of the river that bears their
  name, in the state of the same name.
scope: 'Also called Missouri: a person of the Siouan people who once lived in the river valley of the
  state that bears their name, not the language spoken by these people.'
examples:
- The Missouria moved west as settlers came into the valley.
- A Missouria woman told the story of her people's old home by the river.
