simpleMeaning: to stay the same in amount through changes in matter or in living things over long ages
scope: To stay the same in amount through changes in matter or in living things over long ages; not to
  keep something safe from harm and not fruit cooked with sugar.
examples:
- Energy is conserved in this process, never made or lost.
- In the reaction, mass is conserved even as new stuff forms.
