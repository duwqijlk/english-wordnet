simpleMeaning: the use of tricks to make someone believe what is not true, usually to get money from them
scope: Also called trickery, shenanigan, wile, and chicanery. This is using tricks to fool a person, usually
  for money, not the skill a person shows in fooling others.
examples:
- By guile, the seller tricked the old man into handing over his money.
- She used guile to make the buyer pay a high price for a fake watch.
