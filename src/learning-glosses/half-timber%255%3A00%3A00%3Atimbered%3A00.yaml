simpleMeaning: Built with bare wood frames showing, the gaps between them filled with brick or stone,
  in the Tudor style.
scope: This describes a building with bare wood frames showing and gaps filled with brick or stone, not
  a plain brick building; also called half-timbered.
examples:
- They lived in a half-timber cottage.
- The half-timber house stood at the end of the lane.
