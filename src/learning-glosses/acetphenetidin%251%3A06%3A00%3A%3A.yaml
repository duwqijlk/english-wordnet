simpleMeaning: a white solid made of tiny crystals, taken to stop pain and to cool a fever
scope: Another name for this sense is acetophenetidin, also called phenacetin; it is a white crystal drug
  that stops pain and cools fever, not a sleeping pill and not morphine.
examples:
- She took acetphenetidin to bring her temperature down.
- Acetphenetidin eased the ache in his head.
