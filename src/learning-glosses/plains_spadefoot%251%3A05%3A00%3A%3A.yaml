simpleMeaning: East of the Rocky Mountains, where rain is low, this toad lives on flat open land, in hills
  and on river bottoms.
scope: The spadefoot toad of the plains, hills and river bottoms east of the Rocky Mountains, where rain
  is low, is what this word names.
examples:
- We saw a plains spadefoot in the hills east of the Rocky Mountains.
- A plains spadefoot sat on the river bottom.
