simpleMeaning: In the warm parts of South and Central America lives a small anteater with no teeth, a
  tail that can grip, and four claws on each front leg.
scope: 'Another name for the lesser anteater, also called tamandu: a small toothless anteater of the warm
  parts of South and Central America.'
examples:
- The tamandua hung from a branch by its tail.
- A tamandua has four claws on each front leg and no teeth.
