simpleMeaning: A flow of ocean water near the equator that moves west across the Pacific, just above the
  equator.
scope: This is a flow of ocean water near the equator that moves west across the Pacific just above the
  equator, not the flow below the equator and not other Pacific flows.
examples:
- The North Equatorial Current flows west across the Pacific.
- Ships use the North Equatorial Current on westward crossings.
