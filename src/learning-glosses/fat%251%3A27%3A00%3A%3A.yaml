simpleMeaning: a soft, greasy substance found in the bodies of people and animals and in some foods.
scope: This is the substance itself, not the body tissue that stores it, and not the adjective meaning
  overweight.
examples:
- The meat had a thick layer of fat.
- Fat gives food a rich taste and provides a lot of energy.
