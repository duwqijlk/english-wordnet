scope: A white-flowered West Indian plant, whose root yields its namesake starch — arrowroot starch —;
  also called obedience plant; not a canna grown, especially, for its edible rootstock, from which the
  starch it is named for — arrowroot starch — is got, nor a feeding starch got from the root of the arrowroot
  plant.
examples:
- Their arrowroot grew in the yard.
- The arrowroot was dug at dawn.
