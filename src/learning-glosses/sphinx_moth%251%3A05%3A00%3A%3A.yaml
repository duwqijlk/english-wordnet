simpleMeaning: Any of several kinds of insect with long narrow front wings that can fly fast and stay
  still in the air over flowers while they feed
scope: Any of several kinds of insect with long narrow front wings that can fly fast and stay still in
  the air over flowers while they feed; hawk moth, hawkmoth, hummingbird moth and sphingid are other names
  for this sense, not a butterfly and not an insect that cannot stay still in the air.
examples:
- The sphinx moth hovered over the flowers, its long narrow wings beating fast.
- A sphinx moth can fly fast and stay still in the air while it feeds.
