simpleMeaning: when you give in to what another person wants and let their wish stand
scope: The act of giving in, not a contract for running a business and not the point that is given up.
examples:
- After a long talk, she made a concession and agreed to the shorter deadline.
- The two sides reached a deal only after a concession on pay from the company.
