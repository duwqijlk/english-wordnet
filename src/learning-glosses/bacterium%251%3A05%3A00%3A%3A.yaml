simpleMeaning: A single-celled or noncellular organism, round, spiral or rod-shaped, without chlorophyll,
  that splits to reproduce; it can cause disease, matters in chemistry, hard to classify, often classed
  as a plant.
scope: 'The singular: one such organism, not the group as a whole.'
examples:
- A single bacterium can multiply into millions within hours.
- The illness is caused by a bacterium found in unpasteurised milk.
