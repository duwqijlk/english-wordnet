simpleMeaning: A tree of eastern North America with long needles in pairs and bark of a warm brown colour.
scope: A tree of eastern North America with long needles in pairs and warm brown bark, not the white pine
  or the yellow pine.
examples:
- The red pine stood at the edge of the wood.
- Red pine needles lay thick on the ground.
