simpleMeaning: the study of what groups of people are like, as part of sociology
scope: Also called demography, it is the study of what groups of people are like, not the study of plants
  and animals in nature.
examples:
- She took a course in human ecology to learn about city populations.
- Human ecology looks at how crowds of people settle in one place.
