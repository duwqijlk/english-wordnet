simpleMeaning: In virology, a tiny infectious agent that can multiply only inside living host cells; many
  cause disease; it is genetic material (DNA or RNA) in a thin protein coat.
scope: This is the biological infectious agent, not a computer program or a harmful influence; it is the
  whole category, not one particular kind.
examples:
- The virus spread through the crowded room, infecting nearly everyone within a week.
- A virus cannot reproduce on its own; it must enter a living cell first.
