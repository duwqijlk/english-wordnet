simpleMeaning: A coloured stick for writing and drawing, made of a mixed stuff that marks paper.
scope: A stick for writing and drawing; crayon is another name for this sense, not a pencil and not a
  paint brush.
examples:
- She drew a red sun with a wax crayon.
- The child broke his wax crayon while drawing.
