simpleMeaning: to bring facts or past things back into your mind; to be able to remember them
scope: To remember facts or past things; not a maker asking for a bad product to be returned, not a horn
  call telling soldiers to come back, and not bringing your thoughts back when they have wandered off.
examples:
- I cannot recall her name, but I know her face.
- He recalled the day they first met.
