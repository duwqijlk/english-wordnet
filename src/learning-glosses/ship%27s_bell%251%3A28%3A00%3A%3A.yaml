simpleMeaning: In nautical timekeeping, one of eight half-hour watch divisions, marked by strokes on the
  vessel's bell; eight strokes mark four, eight or twelve o'clock, by day or night.
scope: Another name for the same nautical half-hour time unit as bell; not the physical bell mounted on
  a ship.
examples:
- At three ship's bells the lookout reported a light on the horizon.
- The watch would not end until eight ship's bells had struck.
