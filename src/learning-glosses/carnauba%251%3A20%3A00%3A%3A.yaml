simpleMeaning: a Brazilian palm with leaves spread like a fan, whose root can be eaten and whose leaves
  give a useful fiber and a yellow wax that breaks easily
scope: 'Also called carnauba palm and wax palm: a palm tree, not the wax itself.'
examples:
- Carnauba grows in Brazil, and its leaves give wax.
- Farmers grow carnauba for its leaf fiber and wax.
