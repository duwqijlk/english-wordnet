simpleMeaning: the act of cancelling something out, so that it no longer has any force or effect
scope: The act of cancelling something out, so it no longer has any force or effect; not the act of stopping
  a car's gear change, and not a device that corrects an automatic one.
examples:
- The court ordered an override of the unfair rule.
- Parliament voted for an override of the president's veto.
