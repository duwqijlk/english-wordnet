simpleMeaning: Fine white clay used for making tobacco pipes and pottery and for making leather white
scope: Fine white clay used for making tobacco pipes and pottery and for making leather white, also called
  pipeclay; not clay formed by the weathering of minerals.
examples:
- The potter whitened the leather with terra alba.
- Terra alba was used to make the white tobacco pipes.
