simpleMeaning: a sale to get money, such as selling shares (small parts of a company) or all that a person
  who cannot pay debts owns, or the money got
scope: 'Also called realization: a sale made to get money, or the money got from it. Not making something
  real, not finishing a piece of music left with only a few notes, and not a finished piece of music made
  in that way.'
examples:
- The realisation of the shares brought in enough money to pay the loan.
- The bank forced a realisation of the bankrupt man's estate.
