simpleMeaning: To do with the system of nerves, or with nerve tissue
scope: 'Another name for neuroanatomical: to do with the nerves and their tissue, not to do with the brain
  alone and not to do with the mind.'
examples:
- A neuroanatomic map showed which parts of the brain send signals where.
- A neuroanatomic study looks at the nerves and how they are built.
