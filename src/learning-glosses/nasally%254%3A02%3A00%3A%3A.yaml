simpleMeaning: through the nose, or in a way that sounds as if the sound comes through the nose
scope: Done through the nose, or said in a voice that sounds as if it comes through the nose; not done
  through the mouth.
examples:
- He breathed nasally because his mouth was closed.
- She spoke nasally because her cold had blocked her nose.
