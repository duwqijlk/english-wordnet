senseId: 'dieresis%1:10:00::'
synsetId: 06836790-n
simpleMeaning: A vowel sounded on its own, not joined to the vowel beside it, is marked by two dots put
  over it.
scope: Also called diaeresis; it is a mark over a vowel, not a mark that joins two vowels into one sound.
examples:
- The dieresis over the second vowel shows the two vowels are sounded apart.
- She put a dieresis over the vowel so it would not join with the one beside it.
