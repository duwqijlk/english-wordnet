simpleMeaning: A formal plan put to a meeting of a group, to be debated and voted on.
scope: This is a proposal put to a formal meeting for debate and vote (in some assemblies also called
  a question), not a request for information, not hand signals, and not the illusion of movement.
examples:
- He put a motion before the committee to increase the budget.
- The motion was carried by a show of hands.
