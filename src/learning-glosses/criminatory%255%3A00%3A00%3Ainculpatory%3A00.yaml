simpleMeaning: pointing to a person as the one who did wrong
scope: This points to a person as the one who did wrong; criminative, incriminating and incriminatory
  are other names for this sense, not proof of guilt and not a word for being innocent.
examples:
- The criminatory report pointed to her as the one who took the money.
- His criminatory statement made people think he was to blame.
