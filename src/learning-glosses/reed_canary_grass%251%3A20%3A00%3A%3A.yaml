simpleMeaning: With wide leaves, this long-lived grass grows in wet meadows and ditches in Europe and
  North America.
scope: Also called gardener's garters, lady's laces, and ribbon grass, this is a long-lived grass of wet
  meadows and ditches with wide leaves.
examples:
- Reed canary grass lined the ditch with wide leaves.
- The reed canary grass grew in the wet meadow.
