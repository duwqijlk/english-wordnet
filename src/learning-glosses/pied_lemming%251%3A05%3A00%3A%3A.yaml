simpleMeaning: A gnawing animal of North America with a white coat in winter and some claws grown very
  big.
scope: This is a gnawing animal of North America with a white winter coat and some claws grown very big;
  not a lemming of Europe or Asia, and not a mouse.
examples:
- The pied lemming turned white in winter.
- Pied lemmings dig with their big claws.
