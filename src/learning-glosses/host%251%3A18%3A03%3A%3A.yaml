simpleMeaning: In medicine, the person whose body receives tissue or an organ donated by another
scope: In medicine, the person whose body receives donated tissue or an organ, not a party giver or an
  animal that supports a parasite.
examples:
- The host developed a mild reaction after receiving the donor kidney.
- Doctors monitored the host for signs that the transplanted tissue was being rejected.
