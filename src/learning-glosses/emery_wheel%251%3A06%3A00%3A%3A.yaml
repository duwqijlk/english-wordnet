simpleMeaning: a round tool of rough stuff, used to wear down hard things
scope: 'Also called grinding wheel: a round tool of rough stuff, used to wear down hard things, not a
  smooth wheel that only turns and not a hand file.'
examples:
- He held the blade against the emery wheel until the edge was sharp.
- Sparks flew from the emery wheel as it wore down the metal.
