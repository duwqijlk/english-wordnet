simpleMeaning: a meter that measures gaps in power between two points and takes no power from what it
  measures
scope: A meter for gaps in power that takes no power itself, not a meter for flow of power and not a battery
  tester.
examples:
- The electrometer showed a difference in voltage.
- He read the charge with an electrometer.
