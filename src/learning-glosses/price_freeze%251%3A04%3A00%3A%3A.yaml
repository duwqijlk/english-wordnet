simpleMeaning: A stop to changes in what things cost, held at one set level
scope: A stop to changes in what things cost, held at one level; not a fall in what things cost and not
  a cold spell.
examples:
- The government put a price freeze on basic foods.
- A price freeze kept bread at the same cost all year.
