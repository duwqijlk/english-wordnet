simpleMeaning: that makes people start to act or act in a stronger way, as by pushing them or urging them
  on
scope: This describes something that pushes people into action; it is not the sense that means able to
  make people feel excited and interested.
examples:
- Her rousing words pushed the tired workers to keep fighting for change.
- The leader gave a rousing call that moved people to act at once.
