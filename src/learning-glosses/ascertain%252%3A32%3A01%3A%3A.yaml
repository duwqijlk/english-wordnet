simpleMeaning: to work out or prove something after using numbers, looking into it closely, doing tests,
  asking many people, or studying it
scope: 'Also called find and determine: to work out a fact by numbers, tests or study; not the sense of
  finding out by asking a question or making a simple check.'
examples:
- The scientists ascertained the age of the rock after years of study.
- He ascertained the total by adding up all the numbers again.
