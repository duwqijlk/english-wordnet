simpleMeaning: a small, fast antelope (a wild animal like a small deer) of Africa and Asia, that moves
  in a smooth, beautiful way and has bright, shining eyes
scope: This is the small, fast wild animal of Africa and Asia. It is not a deer and not a tame farm animal.
examples:
- A gazelle ran across the dry grassland faster than the car beside it.
- We saw a gazelle drinking at the river, its bright eyes watching us.
