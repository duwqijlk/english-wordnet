simpleMeaning: A flat stem that looks and works like a leaf.
scope: A flat stem that looks and works like a leaf; cladode, cladophyll and phylloclade are other names
  for this sense, not a true leaf and not an ordinary stem.
examples:
- The phylloclad of the plant did the work of a leaf.
- Each phylloclad was green and flat.
