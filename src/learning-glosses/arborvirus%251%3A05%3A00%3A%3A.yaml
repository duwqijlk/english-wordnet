senseId: 'arborvirus%1:05:00::'
synsetId: 01331827-n
simpleMeaning: A varied group of RNA viruses classed by their particles, found in arthropods, bats and
  rodents; blood-feeding arthropods mostly spread them between animals, causing fevers, hepatitis, bleeding
  and brain swelling.
scope: The broad virus group transmitted mainly by blood-feeding arthropods such as mosquitoes and ticks;
  arbovirus is the same group under another spelling, and it is not one virus species or the illness the
  viruses cause.
examples:
- The lab identified an arborvirus in the mosquito sample.
- Arborviruses are studied mainly by scientists who work on insect-borne disease.
