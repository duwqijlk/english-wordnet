simpleMeaning: A secret plan in 1605 in England to blow up James the First and both Houses of Parliament,
  to pay back the ill use of Catholics, led by Guy Fawkes
scope: A secret plan of 1605 to blow up the king and Parliament, not a battle, a war or a rising of the
  people.
examples:
- The Gunpowder Plot aimed to blow up Parliament in 1605.
- Guy Fawkes led the Gunpowder Plot.
