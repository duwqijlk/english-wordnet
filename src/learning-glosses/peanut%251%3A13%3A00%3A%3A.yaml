simpleMeaning: a pod (a long thin case that holds seeds) from a vine, usually holding 2 nuts or seeds;
  in British English called groundnut or monkey nut
scope: This names the pod with its nuts or seeds, also called groundnut or monkey nut in British use;
  it is not the sense that names this plant part as it grows under the ground.
examples:
- She cracked open a peanut and ate the two nuts inside.
- The peanut shell broke open to show two small nuts.
