simpleMeaning: Neat set forms and straight-line shapes, made to suit making things in large numbers, mark
  this way of shaping things liked by many in the 1920s and 1930s.
scope: This way of shaping things, also called deco, was liked by many in the 1920s and 1930s.
examples:
- The building showed art deco in its straight-line shapes.
- She liked the art deco of the 1920s.
