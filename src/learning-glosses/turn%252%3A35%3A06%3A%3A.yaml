simpleMeaning: give a piece of wood, metal, or other material its shape by pressing it against a tool
  or shaping it by hand while it spins
scope: Not simply rotating an object in your hands, and not bending a piece out of shape.
examples:
- The craftsman turned a pair of oak legs for the table.
- The machinist turned the steel shaft down to size.
