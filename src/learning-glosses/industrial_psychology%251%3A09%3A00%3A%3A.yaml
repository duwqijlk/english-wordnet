simpleMeaning: In schools, in factories, and in selling, real-life problems are worked out with one of
  several sides of the study of how people think and act.
scope: Also called applied psychology, it is one of several sides of the study of how people think and
  act, used to work out real-life problems in schools, in factories, and in selling.
examples:
- He took a course in industrial psychology.
- She works in industrial psychology, helping schools with their problems.
