senseId: 'kronecker_delta%1:24:00::'
synsetId: 13806975-n
simpleMeaning: A rule in maths that takes two numbers, i and j, and gives 1 when they are the same and
  0 when they are not.
scope: A maths rule that gives 1 for two equal numbers and 0 for two different ones; a rule for two numbers,
  not a single number.
examples:
- The Kronecker delta is 1 when i and j are the same.
- Use the Kronecker delta to pick out equal numbers.
