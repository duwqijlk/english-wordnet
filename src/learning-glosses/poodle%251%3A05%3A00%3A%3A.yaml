simpleMeaning: a clever dog with a thick curly coat of one colour, often cut short; an old kind of dog
  sometimes taught to work in the field or to do tricks
scope: A clever dog with a thick curly coat of one colour, often cut short; not a dog with a thin straight
  coat, and not a new breed.
examples:
- Their poodle won first prize at the dog show.
- The poodle's curly coat was clipped short for the summer.
