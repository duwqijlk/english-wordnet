senseId: 'free_zone%1:15:00::'
synsetId: 08657161-n
simpleMeaning: An area next to a harbour where goods meant to be sent on elsewhere can be taken in and
  kept without paying duty
scope: A harbour area for goods in transit; free port is another name for this sense, not an ordinary
  harbour where duty is paid on arrival and not a warehouse for local sale.
examples:
- The cargo sat in the free zone until the next ship arrived.
- Goods in the free zone are stored without paying duty.
