simpleMeaning: a person who leads a formal event, gives the first speech, and tells the crowd who will
  speak next
scope: 'Also called host and master of ceremonies: this person leads a formal event and brings on the
  speakers, not a guest or a main speaker.'
examples:
- The emcee gave the first speech and then brought on the main speaker.
- As emcee, she told the crowd who would speak next at the formal dinner.
