simpleMeaning: How much radiation, in the form of electromagnetic waves, reaches or leaves a single point
  on a surface.
scope: An amount of radiation in the form of electromagnetic waves at a surface point, not the visible
  light from a hot object or a steady flame-free light.
examples:
- The sensor measured the glow at each point on the surface.
- Scientists compared the glow arriving at each point on the plate.
