simpleMeaning: A small creature from the rivers and lakes of South America and the West Indies, often
  kept in tanks of water
scope: 'Also called a guppy: a small creature from rivers and lakes in South America and the West Indies,
  often kept in tanks of water, not a large sea creature.'
examples:
- The rainbow fish in our tank came from South America.
- She keeps a rainbow fish in a tank of water by the window.
