simpleMeaning: an illness involving many genes, in which the blood holds too much sugar, and in some forms
  a person passes much water and stays thirsty
scope: An illness with too much sugar in the blood, not a short sickness and not simple thirst.
examples:
- Her diabetes means she must watch the sugar in her food.
- Diabetes can make a person pass water often and feel thirsty all day.
