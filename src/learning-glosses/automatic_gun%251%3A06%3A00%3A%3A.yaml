simpleMeaning: a weapon that puts in a new bullet by itself and keeps firing while the trigger is held
  down
scope: 'Also called an automatic firearm and an automatic weapon: a weapon that reloads itself and keeps
  firing, not a weapon that fires only one shot each time the trigger is pulled.'
examples:
- The automatic gun kept firing while the soldier held the trigger down.
- An automatic gun puts in a new bullet by itself after each shot.
