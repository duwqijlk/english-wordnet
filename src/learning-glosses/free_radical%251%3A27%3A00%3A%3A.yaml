simpleMeaning: An atom or atom group with at least one unpaired electron; in the body, usually an oxygen
  molecule that lost one and steals one from a nearby molecule to settle.
scope: 'This is the chemistry sense: an atom or atom group with an unpaired electron, not a general word
  for something extreme or unconventional. The body detail describes the usual biological case, an oxygen
  molecule that has lost an electron, not a separate sense.'
examples:
- In the body, free radicals are high-energy particles that ricochet wildly and damage cells.
- The label says the serum protects skin from damage by free radicals.
