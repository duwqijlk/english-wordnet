simpleMeaning: a cleaning tool made of an oily cloth tied by a cord to a weight, drawn through the inside
  of a rifle or handgun barrel to clean it
scope: A weighted cord with an oily cloth for cleaning a gun barrel, not a brush and not a cleaning rod.
examples:
- He used a pull-through to clean the rifle after the shoot.
- The pull-through dragged the oily cloth through the barrel of the handgun.
