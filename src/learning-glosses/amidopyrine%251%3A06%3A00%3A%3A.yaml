simpleMeaning: a white crystal-like drug that eases pain and brings down fever
scope: A white crystal-like drug that eases pain and lowers fever; aminopyrine is another name for this
  sense, not a drug that only eases pain and not a drug that only lowers fever.
examples:
- The doctor gave her amidopyrine for the pain and fever.
- Amidopyrine was once used to bring down a high fever.
