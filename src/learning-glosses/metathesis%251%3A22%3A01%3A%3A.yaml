senseId: 'metathesis%1:22:01::'
synsetId: 13536723-n
simpleMeaning: Inside a word or a sentence, sounds or parts of words swap places, in language
scope: Sounds or word parts swapping places in speech, not a chemical reaction that swaps parts of two
  compounds, and not a simple slip of the tongue.
examples:
- In 'aks' for 'ask', metathesis has swapped the sounds.
- The child's metathesis turned 'spaghetti' into 'pasketti'.
