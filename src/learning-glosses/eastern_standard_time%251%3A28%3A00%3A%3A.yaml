simpleMeaning: The clock setting of the fifth zone west of Greenwich, set by the 75th line of longitude,
  used in the east of the United States.
scope: Also called EST and Eastern Time; the clock setting of the fifth zone west of Greenwich, used in
  the east of the United States.
examples:
- Eastern Standard Time is five hours behind Greenwich.
- We set the meeting for noon Eastern Standard Time.
