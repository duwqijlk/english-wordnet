simpleMeaning: Of or about a book that sums up the beliefs of Christianity.
scope: Of or about a book that sums up the beliefs of Christianity; not a book that sums up the beliefs
  of another faith, and not a book of prayers.
examples:
- The catechismal book sets out the beliefs in short answers.
- Catechismal teaching follows the set questions.
