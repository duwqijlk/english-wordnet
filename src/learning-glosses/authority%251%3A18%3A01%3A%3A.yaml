simpleMeaning: the people in charge who have the official power to give orders and make decisions.
scope: This is not the right or permission to act and not an expert on a subject; it means the people
  who hold official control.
examples:
- The local authorities closed the beach after the storm.
- School authorities met to discuss the new rules.
