simpleMeaning: A tall Brazilian feather palm with a crown of very large leathery deeply divided leaves
  at the top, rising from long strong stems used for building.
scope: Also called jupati, jupati palm, and jupaty; not a coconut palm and not a small house plant.
examples:
- The Raffia taedigera rose tall above the Brazilian riverbank.
- Builders used the strong stems of Raffia taedigera.
