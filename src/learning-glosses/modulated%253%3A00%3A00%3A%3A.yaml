simpleMeaning: changed in how high or low a sound is, in its tone, or in how loud it is
scope: About a sound changed in how high or low it is, in tone, or in how loud it is; not the sense where
  loudness must change together with tone or with how high or low the sound is.
examples:
- Her modulated voice rose and fell as she read the story.
- The singer used a modulated tone that grew softer at the end.
