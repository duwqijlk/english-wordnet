simpleMeaning: The long outer bend of the stomach gets its blood from several small blood tubes that run
  off the one feeding the spleen.
scope: The short gastric artery — also called vasa brevis — is the name for these several small blood
  tubes, which run off the one feeding the spleen to the long outer bend of the stomach.
examples:
- The arteria gastrica breves go to the long outer bend of the stomach.
- Several arteria gastrica breves run off the blood tube that feeds the spleen.
