simpleMeaning: Side shoots that each end in a flower, and flowers along one main stalk, make a thick bunch
  like those of lilac or horse chestnut.
scope: A thick bunch of flowers, also called thyrsus, with flowers along the main stalk and side shoots
  ending in flowers.
examples:
- The thyrse of the lilac held its flowers in a thick bunch.
- A thyrse bears flowers along its main stalk.
