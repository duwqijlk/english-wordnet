simpleMeaning: A phone link that sends calls over wires and cables on the ground
scope: A phone link that runs over wires on the ground, also called a landline, not a mobile phone link
  and not a link sent by satellite.
examples:
- Our house still has a land line in the kitchen.
- She called on her land line because her mobile had no signal.
