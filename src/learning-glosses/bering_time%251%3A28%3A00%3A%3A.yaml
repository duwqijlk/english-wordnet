simpleMeaning: The clock setting in the 11th zone west of Greenwich, set at the 165th line west; used
  in the Midway Islands.
scope: The Midway Islands keep this clock setting, fixed at the 165th line west of Greenwich in the 11th
  zone west; also called Bering Standard Time.
examples:
- Bering Time is used in the Midway Islands.
- They set the clock to Bering Time.
