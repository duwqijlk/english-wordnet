simpleMeaning: A warm wet pad or soft mass put on the skin as a medicine to heal the body.
scope: A warm wet pad or soft mass put on the skin as a medicine to heal the body; not a dry cloth and
  not a medicine taken by mouth.
examples:
- The nurse put a fomentation on his swollen knee.
- A fomentation of warm herbs eased the pain.
