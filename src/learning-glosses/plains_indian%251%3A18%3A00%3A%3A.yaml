simpleMeaning: A member of one of the native peoples of North America who roamed the great grasslands,
  moving with the herds of buffalo.
scope: A member of one of the native peoples who roamed the great grasslands after the wild oxen, also
  called Buffalo Indian, not a native person of the forests and not a settler of the grasslands.
examples:
- A Plains Indian family moved with the buffalo herds.
- The Plains Indian tribes lived by hunting on the grasslands.
