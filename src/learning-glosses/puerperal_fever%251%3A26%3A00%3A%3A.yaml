simpleMeaning: A woman can catch this serious blood infection while giving birth or having an abortion,
  usually when the birth place is not clean; once common, it is now rare.
scope: Also called childbed fever, this is a serious blood infection caught at childbirth or abortion,
  once common but now rare.
examples:
- She caught puerperal fever while giving birth.
- Puerperal fever was once common, but it is now rare.
