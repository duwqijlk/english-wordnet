simpleMeaning: a set of musical notes that go one after another and make a tune you can tell apart
scope: 'Also called an air, a line, or a tune: a set of notes that makes a tune, not a group of living
  things and not hard work on the body.'
examples:
- She hummed a strain from Beethoven all morning.
- The strain of the old song stayed in my head for days.
