simpleMeaning: In Irish folklore, a woman spirit who cries loudly to warn that a death is coming soon
scope: This spirit from Irish stories is also called a banshie; it is not a real living woman and not
  a spirit that brings no warning.
examples:
- In the old story, a banshee cried outside the house before the man died.
- People in the village said they heard a banshee on the night she died.
