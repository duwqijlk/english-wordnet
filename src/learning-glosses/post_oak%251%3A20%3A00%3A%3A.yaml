simpleMeaning: A small tree of the eastern and central United States, leafless in winter, with dark green
  lyrelike lobed leaves and hard damp-proof wood used above all for fence uprights.
scope: A box white oak, a brash oak, and an iron oak are other names for this small tree, which is leafless
  in winter rather than a tall forest tree.
examples:
- Fence uprights were cut from the post oak.
- A post oak loses its leaves every winter.
