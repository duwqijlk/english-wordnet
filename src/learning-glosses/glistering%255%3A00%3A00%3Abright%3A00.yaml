senseId: glistering%5:00:00:bright:00
synsetId: 00280484-s
simpleMeaning: Sparkling in quick, bright flashes.
scope: This sense is also called glittering, glinting, sparkly, glittery, scintillating, and aglitter,
  for sparkling in quick, bright flashes, where glittering is shining with short, bright flashes that
  come and go.
examples:
- The water was glistering, sparkling in quick flashes.
- The dew was glistering, sparkling in bright flashes.
