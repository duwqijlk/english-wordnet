simpleMeaning: Guards that fight germs are made, above all, when any stuff, like a poison or an enzyme,
  stirs the body's guards against sickness into action.
scope: This is any stuff, like a poison or an enzyme, that stirs the body's guards against sickness into
  action, above all making guards that fight germs.
examples:
- When an antigen was found, guards that fight germs were made.
- When an antigen enters the body, guards that fight germs are made.
