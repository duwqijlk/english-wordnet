simpleMeaning: A world body set up by a deal between many countries to help goods move, by cutting taxes
  on goods and limits on goods brought in.
scope: Also called GATT; a world body set up by a deal between many lands to help goods move by cutting
  taxes and limits for goods brought in.
examples:
- The General Agreement on Tariffs and Trade cut taxes on goods between many lands.
- Under the General Agreement on Tariffs and Trade, limits on goods brought in were cut.
