simpleMeaning: hanging down to your ankles, a loose coat or frock you wear over your clothes
scope: A loose coat worn over clothes down to the ankles, not a verb for stitching a pattern into cloth.
examples:
- The painter wore a smock to keep paint off her clothes.
- His smock hung loose down to his ankles.
