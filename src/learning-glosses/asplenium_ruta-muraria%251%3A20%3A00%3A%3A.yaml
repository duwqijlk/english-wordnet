simpleMeaning: A small fine spleenwort that grows on steep slopes, such as walls or cliffs, in Europe
  and Asia and North America.
scope: Also called wall rue and wall rue spleenwort; a small spleenwort of walls and cliffs, not a large
  fern of shady woods.
examples:
- Asplenium ruta-muraria grew in a crack of the old stone wall.
- We found Asplenium ruta-muraria on the steep cliff face.
