simpleMeaning: how a person treats other people and acts when they are with them
scope: 'Also called behavior, behaviour, and demeanor: this is the way a person acts toward others. It
  is not the verb for acting in a certain way, and not carrying heat or sound through something.'
examples:
- His conduct toward his coworkers was rude and unfair.
- The teacher praised her good conduct toward her classmates.
