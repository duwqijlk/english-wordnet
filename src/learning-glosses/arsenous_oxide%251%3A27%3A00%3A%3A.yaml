simpleMeaning: A white powder poison of arsenic with three oxides, for glass-making, and for killing rats
  and weed plants.
scope: This sense is also called arsenic, arsenic trioxide, arsenous anhydride, ratsbane, and white arsenic.
examples:
- Arsenous oxide killed rats.
- An arsenous oxide made glass.
