simpleMeaning: Said when air goes in and out of the lungs as it should, sometimes as part of a word made
  of two words
scope: 'Also called breathing and eupneic: of air going in and out of the lungs as it should, not of air
  held in and not of hard or fast breathing.'
examples:
- The eupnoeic child slept with steady breath.
- After the walk, she stayed eupnoeic, taking air in and out with ease.
