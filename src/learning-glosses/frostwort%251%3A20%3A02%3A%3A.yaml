simpleMeaning: Named for the ice that forms on it at the first cold, this long-lived plant of eastern
  America bears single yellow flowers early and later ones with no petals.
scope: Also called frost-weed or frostweed, this long-lived plant of eastern America bears single yellow
  flowers early and later ones with no petals, not the tall plant with clusters of white flowers.
examples:
- The frostwort in the woods bore single yellow flowers.
- At the first frost, ice formed on the frostwort.
