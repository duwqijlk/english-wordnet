senseId: 'allomorph%1:10:00::'
synsetId: 06317596-n
simpleMeaning: one of the different spoken forms of a morpheme, a small part of a word
scope: A different way of saying a small word part; not the word part itself, and not a different word
  with a different sense.
examples:
- The final sounds of 'bets' and 'beds' are allomorphs of the English plural morpheme.
- The plural ending has two allomorphs in the words 'cats' and 'dogs'.
