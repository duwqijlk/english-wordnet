synsetId: 00206740-n
simpleMeaning: the act of giving up or losing something as a price paid for a mistake, a fault, or a failure
  to do what was asked, or other such failures
scope: The act of giving up or losing something as a price paid for a mistake, a fault, or a failure to
  do what was asked, also called a sacrifice; not the penalty itself and not a free gift.
examples:
- Missing the match meant a forfeit of the team's points.
- His late arrival cost him the forfeit of his deposit.
