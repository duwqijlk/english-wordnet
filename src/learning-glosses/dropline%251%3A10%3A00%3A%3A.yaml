senseId: 'dropline%1:10:00::'
synsetId: 06356936-n
simpleMeaning: a title whose rows after the first are set in from the left, while the first row starts
  at the left edge
scope: 'Also called drop line: a newspaper title whose first row is at the left edge and later rows sit
  further in, not a title with all rows starting at the same place.'
examples:
- The dropline ran across the top of the front page.
- She set the dropline so the first row began at the left edge.
