simpleMeaning: The trade name for a small slip of paper, sticky on one side, that holds on a surface and
  comes off leaving that surface unharmed.
scope: This is the trade name for a small, sticky slip of paper, not a plain slip of paper.
examples:
- I wrote the note on a Post-It and stuck it on the door.
- She left a Post-It on the fridge.
