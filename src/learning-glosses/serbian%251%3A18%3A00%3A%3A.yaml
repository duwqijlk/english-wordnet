simpleMeaning: A person of a Slavic people who came to live in the country of that name and the lands
  near it in the 6th and 7th centuries.
scope: 'Also called Serb: a person of a Slavic people who came to live in Serbia and the lands near it
  in the 6th and 7th centuries, not a word that means ''of Serbia'' and not a person of another Slavic
  people.'
examples:
- A Serbian is a person of a Slavic people who settled in Serbia.
- The Serbians came to live in Serbia in the 6th and 7th centuries.
