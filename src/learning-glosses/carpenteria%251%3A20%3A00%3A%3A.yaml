simpleMeaning: a green shrub of California that stays green all year, with bright pairs of leaves and
  a few sweet-smelling white flowers at the ends of its stems
scope: A California evergreen shrub, not a tree and not a flowering vine; its sweet-smelling white flowers
  grow in small groups at the ends of the stems.
examples:
- The carpenteria in the garden keeps its leaves all winter.
- A carpenteria shrub had a few white flowers at the ends of its stems.
