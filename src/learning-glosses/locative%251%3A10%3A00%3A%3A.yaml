senseId: 'locative%1:10:00::'
synsetId: 06343912-n
simpleMeaning: In grammar, the part played by a group of words with a noun at its head when it names the
  place of the state or action the verb talks about.
scope: In grammar, this is the part a noun phrase plays when it names a place, not the doer of the action
  and not the time of the action; locative role is another name for this sense.
examples:
- In 'she slept in the house', the locative is 'in the house'.
- The locative shows where the action takes place.
