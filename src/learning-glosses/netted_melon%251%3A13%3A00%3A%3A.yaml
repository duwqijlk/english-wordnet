simpleMeaning: Marks like a fine mesh cover the skin of this fruit of a vine, and deep green flesh lies
  inside.
scope: The net melon and the nutmeg melon are also names for the fruit of a vine, not the vine itself.
examples:
- We sliced a netted melon and ate its deep green flesh.
- The netted melon had a skin marked like a fine mesh.
