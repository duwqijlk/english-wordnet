simpleMeaning: a common flower of the east of the United States with hanging yellow or reddish flowers
  marked with brown spots
scope: 'Also called meadow lily and wild yellow lily: a common flower with hanging spotted flowers, not
  a garden lily and not a daylily.'
examples:
- The wild meadow lily nodded its yellow flowers in the breeze.
- We found a wild meadow lily with reddish flowers spotted with brown.
