simpleMeaning: Vegetables and beef cooked slowly in water make this French dish of old standing
scope: A French dish of old standing, made by cooking vegetables and beef slowly in water; not a quick
  soup and not a dish of meat alone.
examples:
- We ate pot-au-feu with bread on a cold evening.
- Her pot-au-feu had beef, carrots and potatoes in it.
