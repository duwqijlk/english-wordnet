simpleMeaning: Inside a bigger house, a flat of its own, usually on two floors, has its own door to the
  outside
scope: Also called a maisonette, this is a flat of its own inside a bigger house, not one room in a shared
  house and not a whole house on its own.
examples:
- The maisonnette has its own door to the street.
- They live in a maisonnette on the top two floors.
