synsetId: 04994869-n
simpleMeaning: In music, the particular character of a complex sound that lets you tell it apart from
  other complex sounds, such as a voice, a noise, or a note.
scope: In music, the sound character that makes a voice or noise recognizable (quality is another name
  for this sense), not the pitch that distinguishes words in tonal languages, the general quality of a
  person's voice, or a shade of color.
examples:
- Her soprano had a rich, warm tone that filled the hall.
- Violins and flutes can play the same note with a very different tone.
