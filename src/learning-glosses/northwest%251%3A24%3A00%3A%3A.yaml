simpleMeaning: the mark on a compass at 315 degrees, halfway round from north toward west
scope: The compass point itself at 315 degrees, not the direction of travel and not a place in the northwest.
examples:
- The compass needle pointed northwest.
- They sailed northwest across the bay.
