simpleMeaning: the long tube inside the belly where food goes after it leaves the stomach, before it leaves
  the body
scope: The tube after the stomach and before the back passage, also called gut and bowel — not the stomach
  itself and not the food pipe.
examples:
- The doctor said the pain was in his intestine, not his stomach.
- Food moves slowly through the intestine as the body takes in what it needs.
