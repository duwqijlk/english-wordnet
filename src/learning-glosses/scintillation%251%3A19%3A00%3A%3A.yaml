simpleMeaning: In physics, a glowing stuff gives off a flash of light when it takes in a bit of light
  or a tiny charged bit.
scope: This is a flash of light in a phosphor, not the twinkling of stars in the sky.
examples:
- A scintillation appeared when the phosphor took in a bit of light.
- The scintillation came from a tiny charged bit.
