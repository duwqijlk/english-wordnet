simpleMeaning: A long bar, most often the handle of a tool or the main part of a weapon like a spear or
  an arrow.
scope: A long bar used as a handle or as part of a weapon, not the turning rod in a machine and not a
  deep hole dug down into the ground.
examples:
- The shaft of the hammer was made of smooth wood.
- He gripped the shaft of the spear and threw it.
