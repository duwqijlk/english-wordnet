simpleMeaning: A small, fast-growing Chinese orange tree that loses its leaves each year, with spines,
  fragrant flowers and showy but inedible fruit; used for hedges and as a rootstock for grafting.
scope: A spiny Chinese tree grown for hedges and grafting stock rather than for its fruit. Its fruit is
  decorative and inedible, so it is not the sweet orange.
examples:
- The farmer planted wild orange along the boundary as a thorny hedge.
- The gardener grafted lemon onto a wild orange rootstock.
