simpleMeaning: a woman who has a job in buying and selling, or in making things in factories
scope: This is a woman who works in buying and selling or in making things, not a man who does the same
  kind of job.
examples:
- She is a successful businesswoman who runs a clothing company.
- The businesswoman spoke to the workers at the factory.
