simpleMeaning: The liquid held inside the thin outer layer of a cell, often with salts and other things
  dissolved in it.
scope: The liquid inside a cell, not the liquid outside cells and not blood.
examples:
- The intracellular fluid fills the inside of the cell.
- Doctors checked the amount of intracellular fluid in the sample.
