simpleMeaning: a place in the water where a ship or boat can stop and stay in one place
scope: A place where ships stay in the water, not the money paid to stay there and not the act of stopping
  there.
examples:
- The ships waited in the anchorage until the storm ended.
- This quiet anchorage is a safe place for boats in bad weather.
