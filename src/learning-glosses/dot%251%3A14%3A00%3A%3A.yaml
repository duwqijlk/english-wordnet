simpleMeaning: The United States federal department that sets up and runs national transport plans, made
  in 1966.
scope: The federal department for transport, not the department for natural resources; also called Transportation
  and the Department of Transportation.
examples:
- The DoT set the new rules for road safety.
- DoT funds help build highways.
