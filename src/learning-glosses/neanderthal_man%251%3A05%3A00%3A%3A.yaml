simpleMeaning: A strong early person, now gone, who lived in Europe and western Asia in the middle part
  of the Old Stone Age
scope: Also called Homo sapiens neanderthalensis, Neandertal, Neandertal man and Neanderthal; a strong
  early person, now gone, who lived in Europe and western Asia in the middle part of the Old Stone Age,
  unlike modern humans and unlike earlier ape-like humans.
examples:
- The Neanderthal man lived in Europe in the middle part of the Old Stone Age.
- A Neanderthal man hunted with stone tools.
