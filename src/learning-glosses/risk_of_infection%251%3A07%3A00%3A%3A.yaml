simpleMeaning: how likely a person is to catch an illness after being near the germ that causes it
scope: 'Also called risk: how likely a person is to catch an illness after being near the germ, not the
  illness itself and not the germ alone.'
examples:
- Her risk of infection rose after she spent time with a sick child.
- The doctor told him his risk of infection was low.
