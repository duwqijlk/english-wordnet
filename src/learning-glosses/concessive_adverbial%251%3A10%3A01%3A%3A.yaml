simpleMeaning: A word group that adds an idea which points the other way from the main part of the sentence
scope: A word group that adds an idea which points the other way from the main part of the sentence; not
  a word group that adds time or place and not the main part of the sentence itself.
examples:
- A concessive adverbial adds an idea that points the other way.
- The concessive adverbial 'although it was late' points the other way from the main part of the sentence.
