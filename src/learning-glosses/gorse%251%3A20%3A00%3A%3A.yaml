simpleMeaning: a bush that stays green all year, with many sharp points and thick growth, and sweet-smelling
  gold-yellow flowers; common all through the west of Europe
scope: 'Also called whin and furze: this bush itself, not just any bush with yellow flowers or sharp points.'
examples:
- Bright yellow gorse covered the hill above the sea.
- She picked her way past the sharp gorse bushes on the path.
