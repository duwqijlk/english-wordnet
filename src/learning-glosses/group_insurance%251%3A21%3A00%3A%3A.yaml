senseId: 'group_insurance%1:21:00::'
synsetId: 13367447-n
simpleMeaning: Cover bought by a set of people, such as the workers of a firm, usually at a lower price
  for each member
scope: This is cover bought by a set of people for its members, not cover bought by one person alone and
  not a savings plan.
examples:
- Her group insurance comes through her job at the factory.
- Group insurance usually costs each member less than a plan bought alone.
