simpleMeaning: In economics, a measure that sets how much is made and how good it is against the work
  time used to make it
scope: In economics, a measure that compares what is made with the work time used, not the general power
  to make things.
examples:
- Higher productivity in the factory meant more goods from the same hours of work.
- The report showed productivity rose when workers spent less time on each unit.
