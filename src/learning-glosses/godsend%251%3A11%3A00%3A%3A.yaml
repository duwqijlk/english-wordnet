simpleMeaning: something good that happens suddenly and brings luck, such as a sudden chance to make money
scope: This is a sudden piece of good luck, also called boom, gravy, windfall, and bonanza. It is not
  a planned gain or a steady rise in work or sales.
examples:
- The rain was a godsend for the dry farms.
- The new job came as a godsend after months without work.
