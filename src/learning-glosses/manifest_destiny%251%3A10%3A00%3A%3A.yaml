simpleMeaning: A plan to take over other lands, said to be bound to happen because God gave the right
  to do it
scope: This is a claim that taking over other lands must happen by God's will, not a law of nature and
  not a plain wish to grow.
examples:
- Leaders used manifest destiny to defend the push west.
- The book traces manifest destiny from the 1840s to the war.
