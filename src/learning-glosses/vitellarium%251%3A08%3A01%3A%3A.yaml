simpleMeaning: In many flatworms and rotifers, this changed part of the ovary makes yolk-filled cells
  that feed the true eggs.
scope: A changed part of the ovary in many flatworms and rotifers that makes food cells for the true eggs;
  not the ovary itself.
examples:
- The vitellarium of the flatworm makes cells full of yolk.
- In rotifers, the vitellarium feeds the true eggs.
