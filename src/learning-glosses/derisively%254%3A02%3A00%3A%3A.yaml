schema: oewn-learning-gloss-v2
senseId: 'derisively%4:02:00::'
synsetId: 00302540-r
simpleMeaning: in a way that shows no respect and makes fun of someone or something
scope: Also called mockingly, this means in a way that shows no respect and makes fun of someone or something.
  It is not a warm or friendly way of laughing with someone.
examples:
- He laughed derisively at the idea and turned away.
- She spoke derisively about his plan, making fun of every part of it.
