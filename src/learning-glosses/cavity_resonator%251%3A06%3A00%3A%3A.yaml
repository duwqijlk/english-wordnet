simpleMeaning: Waves moving through empty space, or sound waves, swing back and forth inside this hollow
  room, sized to let them do so.
scope: Also called resonating chamber and resonator, this is a hollow room sized for waves to swing back
  and forth inside it, not a solid block.
examples:
- The cavity resonator is sized so waves swing back and forth inside it.
- Sound waves swing back and forth inside the cavity resonator.
