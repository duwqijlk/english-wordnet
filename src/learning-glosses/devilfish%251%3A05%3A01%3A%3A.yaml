simpleMeaning: a sea animal that lives on the bottom of the sea, with a soft egg-shaped body and eight
  long arms
scope: 'Also called octopus: a sea animal with eight arms, not the large ray and not the grey-black whale
  that share this name.'
examples:
- A devilfish spread its eight arms over the sea floor.
- The diver watched a devilfish rest on the sand at the bottom.
