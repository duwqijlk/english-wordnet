simpleMeaning: able to be measured for how deep it is
scope: 'Also called fathomable and plumbable: able to be measured for depth, not too deep to measure and
  not shallow water itself.'
examples:
- The soundable water near the shore let the crew take a depth reading.
- Only the soundable part of the bay could be charted by hand.
