simpleMeaning: a tool for catching fish, with a long handle and a point whose barbs face backward
scope: A barbed fishing tool on a long handle, also called a gig, fishgig, fizgig or lance, not the long
  pointed rod used as a weapon or tool, and not the acts of stabbing or rising upright.
examples:
- He waded into the shallows with a barbed spear, hunting flounder.
- A long spear with a barbed head hung beside the fishing nets.
