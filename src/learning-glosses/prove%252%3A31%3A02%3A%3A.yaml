senseId: 'prove%2:31:02::'
synsetId: 00667548-v
simpleMeaning: To show by formal, step-by-step reasoning, as in mathematics, that a statement must be
  true.
scope: To establish a statement by formal mathematical reasoning, not to show something is true with evidence
  or to test something's quality.
examples:
- She proved the theorem using only two earlier results.
- Students were asked to prove that the sum of two even numbers is always even.
