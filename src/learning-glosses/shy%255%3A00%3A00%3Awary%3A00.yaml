simpleMeaning: careful and slow to trust people or things, and likely to stay away from them
scope: Being careful and slow to trust and keeping away, not being shy in a general nervous way.
examples:
- She is shy of strangers and keeps her distance.
- The cat was shy of the new dog and hid under the bed.
