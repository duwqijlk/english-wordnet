simpleMeaning: being too close to others, in a way like family members having sex with each other
scope: This sense means people or groups are too close to each other, not real sex between close family
  members.
examples:
- The two firms had an incestuous relationship and shared the same leaders.
- Critics called the small art world incestuous because the same people judged each other's work.
