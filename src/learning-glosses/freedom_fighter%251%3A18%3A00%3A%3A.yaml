simpleMeaning: a person who takes up arms against the people in power, most of all to make life better
scope: 'Also called an insurgent, an insurrectionist or a rebel: a person who fights with weapons against
  those in power, not a soldier in a country''s own army and not a criminal acting for gain.'
examples:
- The freedom fighter joined the uprising to free his town.
- Many freedom fighters hoped the new government would make life better.
