simpleMeaning: a wide, general feeling of being upset and in pain
scope: A broad feeling of being upset and in pain, not the worry of a troubled mind, not the pain of hard
  bodily strain, and not money trouble.
examples:
- The distressed patient could not say what was wrong.
- She felt distressed for days, with no clear reason.
