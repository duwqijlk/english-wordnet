simpleMeaning: something made to fool people, or a planned trick done on purpose to get something good
  for the person behind it
scope: 'Also called fraud, humbug, fraudulence, and dupery: a trick made to fool people so someone gains,
  not an honest mistake and not a joke told just for fun.'
examples:
- The story about a sea monster was a hoax.
- He sent the hoax email to trick people into sending money.
