senseId: 'vaporise%2:30:04::'
synsetId: 00576797-v
simpleMeaning: to change into a gas
scope: The thing itself changes into a gas. It is not the sense where a person or heat makes something
  change, and not the sense where a liquid dries away and leaves a stronger part behind.
examples:
- The water in the wet cloth slowly vaporised in the hot sun.
- This liquid vaporises fast when it meets warm air.
