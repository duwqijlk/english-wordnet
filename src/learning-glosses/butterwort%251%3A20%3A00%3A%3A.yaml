simpleMeaning: An insect-eating marsh plant with a ring of leaves at its base, coated in sticky fluid
  that catches tiny insects, and showy purple, yellow or white flowers.
scope: An insect-catching plant of wet bogs with sticky leaves; not a sundew, which has tentacles, nor
  a pitcher plant, which traps insects in a hollow tube.
examples:
- Butterwort catches small flies on the sticky surface of its leaves.
- In June the butterwort opens pale purple flowers above its flat ring of leaves.
