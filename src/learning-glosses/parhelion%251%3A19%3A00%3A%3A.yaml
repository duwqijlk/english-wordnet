simpleMeaning: A bright patch beside the sun, made when light bends through ice bits in the sky.
scope: A bright patch beside the sun from bent light, also called mock sun; not a rainbow and not the
  sun itself.
examples:
- A parhelion shone beside the sun on the cold morning.
- Two parhelia hung in the winter sky.
