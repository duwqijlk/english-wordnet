simpleMeaning: Of or about the Hasidim, a group of Jews, or about what its members believe and do.
scope: Also called Chasidic, Chassidic and Hasidic; this word describes things linked to the Hasidim,
  not other Jewish groups and not the beliefs themselves.
examples:
- The Hassidic school keeps old customs alive.
- She wore a Hassidic dress for the wedding.
