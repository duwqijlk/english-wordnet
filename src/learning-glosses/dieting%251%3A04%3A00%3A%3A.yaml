simpleMeaning: the act of eating less food in general, or eating less of certain foods
scope: Another name for this is diet; it is about eating less food, not about the food a person usually
  eats each day.
examples:
- Dieting helped him lose weight over the summer.
- She tried dieting by eating smaller meals and no sweet foods.
