scope: An upright plant with thick food-storing roots and bunches of red to yellow flowers, also called
  jewels-of-opar, from southwestern North America to Central America.
examples:
- Talinum paniculatum stands upright with bunches of red and yellow flowers.
- We grow Talinum paniculatum for its flowers at the ends of its stems.
