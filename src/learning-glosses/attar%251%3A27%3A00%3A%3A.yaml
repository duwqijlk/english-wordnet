simpleMeaning: a strong-smelling oil or scent taken from flowers
scope: 'Also called atar, athar or ottar: a strong-smelling oil or scent taken from flowers, not a scent
  made from wood and not a flower itself.'
examples:
- She put a drop of attar of roses on her wrist.
- The attar filled the room with the smell of flowers.
