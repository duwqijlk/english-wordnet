simpleMeaning: an artery that starts from the jaw artery and feeds the parts below the eye socket, from
  the lower eyelid to the upper lip
scope: 'Another name for the infraorbital artery: the artery below the eye socket, from the lower eyelid
  to the upper lip, not the arteries of the eye itself.'
examples:
- The arteria infraorbitalis supplies the lower eyelid and the upper lip.
- A cut near the arteria infraorbitalis can make the cheek go numb.
