simpleMeaning: a worker who fixes things in place with small nails or quick welds
scope: This is a worker who fixes things in place with small nails or quick welds, not a person who sews
  clothes with long loose stitches.
examples:
- The tacker pinned the thin metal sheets together before the welder finished the job.
- A tacker fastened the loose panels with small nails.
