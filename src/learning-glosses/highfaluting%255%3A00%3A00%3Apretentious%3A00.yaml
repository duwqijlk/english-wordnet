simpleMeaning: putting on grand, fine manners to seem important, with pride and scorn for others
scope: This is proud, put-on fine behaviour; hifalutin, grandiose, highfalutin, hoity-toity and la-di-da
  are other names for this sense, not plain pride and not real good manners.
examples:
- His highfaluting manner annoyed the whole room.
- She spoke in a highfaluting way that made simple things sound grand.
