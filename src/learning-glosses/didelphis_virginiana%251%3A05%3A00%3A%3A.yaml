simpleMeaning: An eastern United States opossum eating plants and animals, playing dead in danger, prized
  as food in places, held to be the same species as the South American crab-eating opossum.
scope: Also called common opossum and Didelphis marsupialis; an opossum of the eastern United States that
  plays dead when in danger.
examples:
- Didelphis virginiana plays dead when in danger.
- Didelphis virginiana is prized as food in some places.
