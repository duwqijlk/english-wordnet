simpleMeaning: In mining, a measure of amount, equal to 6 cubic feet, used for amounts of ore
scope: In mining, a measure of amount equal to 6 cubic feet for ore, not the 6-foot measure of water depth
  and not the act of measuring depth.
examples:
- The miners measured the ore in fathoms before it was taken up.
- One fathom of ore was taken out of the mine that day.
