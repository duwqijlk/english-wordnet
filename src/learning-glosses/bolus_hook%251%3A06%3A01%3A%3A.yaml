simpleMeaning: In a Jacquard loom, the part that raises or lowers the frame carrying the lengthwise threads,
  so the crosswise thread passes above or below them and makes the pattern.
scope: A working part inside a Jacquard loom that moves the frame of lengthwise threads; it is not the
  shuttle that carries the crosswise thread, and not a hook used in surgery.
examples:
- The weaver adjusted the bolus hook so the loom would weave a different pattern.
- A worn bolus hook can make the loom drop stitches.
