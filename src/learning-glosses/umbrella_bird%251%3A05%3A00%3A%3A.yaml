simpleMeaning: A large tuft of feathers hangs over the head of this black creature of the warm parts of
  America, which also bears a long flap of feathers.
scope: This black creature of the warm parts of America is known by the large tuft of feathers over its
  head and the long flap of feathers.
examples:
- The umbrella bird's large crest hung over its head.
- An umbrella bird stood with its long flap of feathers showing.
