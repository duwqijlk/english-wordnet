simpleMeaning: In the north of Italy, about five hundred years after Christ was born, the eastern Goths
  made a kingdom, and this person was one of them.
scope: One of the eastern Goths who made a kingdom in the north of Italy, not one of the western Goths
  and not a person of Italy itself.
examples:
- The Ostrogoth was one of the eastern Goths.
- An Ostrogoth lived in the kingdom in the north of Italy.
