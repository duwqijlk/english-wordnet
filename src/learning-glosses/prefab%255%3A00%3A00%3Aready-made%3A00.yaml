simpleMeaning: made in set sizes so it can be sent to another place and put together there
scope: Describes a thing made in set sizes and put together at another place; not the noun use that names
  a building made in this way.
examples:
- They bought a prefab house that was made in parts and put together on their land.
- The school added a prefab room built from parts made in a factory.
