simpleMeaning: a paper or card that shows you have the right to ride on a bus or train, or to go in to
  see a film or show
scope: This is a paper or card that gives you the right to travel or to go in somewhere; it is not an
  official paper for breaking a rule, and not a party's list of people for an election.
examples:
- She showed her ticket before she got on the train.
- We bought two tickets to see the film.
