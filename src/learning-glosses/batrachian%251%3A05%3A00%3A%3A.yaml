simpleMeaning: animals that leap on long back legs, with thick bodies and no tails, living in water and
  on land; any of the frogs and toads
scope: 'Also called frog, toad, anuran, salientian, and toad frog: the group name for tailless leaping
  amphibians, not a single kind of frog and not a salamander.'
examples:
- Frogs are batrachians, built for leaping on long back legs.
- The batrachian sat half in the pond, half on the bank.
