simpleMeaning: a song for several voices in which each singer starts the same tune a little later, so
  the parts overlap
scope: Not a rotating machine part and not one stage of a game; it is a piece of music for overlapping
  voices.
examples:
- The choir sang a round, each section entering two beats after the one before.
- At camp we learned a round in which the second group comes in on the second line.
