simpleMeaning: a funny copy of the way a person speaks or acts, made to make fun of them
scope: 'Also called mockery and parody: a funny copy of a person in speech or action. Not a plane going
  up into the air, and not a written piece that copies someone''s style.'
examples:
- His takeoff of the mayor made the whole room laugh.
- She did a funny takeoff of her teacher's way of speaking.
