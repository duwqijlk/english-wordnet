simpleMeaning: The power to tell sweet, sour, bitter, and salty flavours apart in the mouth
scope: 'Also called taste, gustation, or gustatory modality: the power to tell sweet, sour, bitter, and
  salty flavours apart in the mouth, not the sense of smell and not the feeling of heat or cold in the
  mouth.'
examples:
- His cold took away his sense of taste.
- A good sense of taste lets a cook judge salt.
