simpleMeaning: In card games, the act of throwing out a useless card, or not playing a card of the suit
  led
scope: In card games, throwing out a useless card or failing to follow suit, not throwing away things
  in general and not the thing thrown away.
examples:
- His discard of the low heart cost him the trick.
- A careless discard can give the game away.
