simpleMeaning: a heavy whip that can bend, made by twisting thin pieces of leather from the skin of a
  cow together
scope: This is the whip itself, not the leather made from a cow's skin and not the act of hitting someone
  with such a whip.
examples:
- He cracked the cowhide over the horses to make them move.
- The cowhide hung on the wall next to the other whips.
