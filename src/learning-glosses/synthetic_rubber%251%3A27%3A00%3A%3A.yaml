simpleMeaning: any of several kinds of man-made stretchy material that bends and springs back like the
  natural stretchy stuff got from trees
scope: This is a man-made stretchy material like natural rubber; rubber is another name for this sense.
  Not the natural stuff from trees and not hard plastic.
examples:
- The tyres are made of synthetic rubber.
- Synthetic rubber seals the jar so air cannot get in.
