simpleMeaning: A salt that mixes fatty matter and fatty acids into water, made from the acid of the juice
  the liver makes and a base.
scope: This is a salt made from bile acid and a base, not bile acid itself, and it mixes fatty matter
  and fatty acids into water.
examples:
- Bile salts mix fatty matter and fatty acids into water.
- After a fatty meal, bile salts mix the fatty matter into water.
