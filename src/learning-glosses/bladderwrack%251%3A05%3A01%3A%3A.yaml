simpleMeaning: a common sea plant from shore rocks, used to make kelp and to feed the soil
scope: 'Another name for bladder fucus, black rockweed, and tang: a sea plant used to make kelp and feed
  soil, not a plant that grows on land.'
examples:
- Bladderwrack covered the rocks when the tide went out.
- They dried bladderwrack to make kelp.
