simpleMeaning: To add small marks to Hebrew words to show how they are pronounced.
scope: This is not marking a psalm for music, sharpening an end, or indicating something with a finger;
  it is adding pronunciation marks to Hebrew writing.
examples:
- The scribes pointed the Hebrew text with small marks above and below the letters.
- The editor pointed the Hebrew words so learners would know how to say them.
