senseId: 'totem%1:06:00::'
synsetId: 04465644-n
simpleMeaning: a thing such as an animal or a plant used as a sign for a family or a clan (a group of
  joined families), especially among American Indians
scope: This is the sign itself, a thing such as an animal or a plant that stands for a group; it is not
  the family or clan itself that is known by such a sign.
examples:
- The eagle is the totem of their clan.
- They carved their totem, a bear, at the top of a tall wooden pole.
