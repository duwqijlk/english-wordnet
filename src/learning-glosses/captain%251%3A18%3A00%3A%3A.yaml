simpleMeaning: A worker in a dining room who directs the waiters and decides where guests are seated.
scope: This is the head waiter in a dining room who seats guests and supervises the waiting staff; it
  is not a military or naval officer, not a police chief, and not the leader of a sports team.
examples:
- The captain showed us to a table by the window.
- Ask the captain to move our party to a quieter corner.
