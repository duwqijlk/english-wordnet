simpleMeaning: 'said of a machine, for example: doing its work, or able to do its work'
scope: Also called running, working and functional. It is said of a machine that works or can work, not
  about surgery, not a detective, and not a secret worker for a government.
examples:
- After the repair, the lift was operative again and could carry people up.
- Keep at least one phone operative so we can call for help.
