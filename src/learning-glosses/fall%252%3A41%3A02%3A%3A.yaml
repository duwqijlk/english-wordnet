simpleMeaning: to be defeated, to fail, or to have everything ruined
scope: This is about losing a struggle or being destroyed; it is not a physical drop, a drop in amount,
  or a moral lapse.
examples:
- The empire fell after decades of weak rulers and endless wars.
- Their team fell to the champions in the last minute of the final.
