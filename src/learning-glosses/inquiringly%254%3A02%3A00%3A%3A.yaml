simpleMeaning: in a way that shows you want to know more or to ask a question
scope: This says how a person looks or speaks when they want to ask, not the act of asking a question
  itself.
examples:
- She looked at him inquiringly, waiting for an answer.
- He raised his eyebrows inquiringly at the strange noise.
