simpleMeaning: Wood that smells of cloves grows on this hardy plant of the south-east of the United States,
  which bears red-brown flowers with a pleasant smell.
scope: Also called strawberry shrub and sweet shrub, it is the hardy plant of the south-east of the United
  States with clove-scented wood and red-brown flowers, not the plant with crimson pods and seeds.
examples:
- The strawberry bush was in flower, and its wood smelled of cloves.
- Red-brown flowers opened on the strawberry bush.
