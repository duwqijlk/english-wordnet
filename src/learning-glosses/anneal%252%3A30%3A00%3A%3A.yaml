simpleMeaning: to bring something to the right firmness, feel, or hardness by heating it slowly and then
  letting it cool slowly
scope: This is heating and cooling a material to change how firm it is, also called temper and normalize.
  It is not heating food or warming a room.
examples:
- Workers anneal the glass by heating it and letting it cool slowly.
- The steel was annealed to make it the right hardness for the tool.
