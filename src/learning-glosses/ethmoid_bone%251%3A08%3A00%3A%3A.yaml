simpleMeaning: Between the eye sockets lies a small bone full of air spaces that helps form the nose cavity,
  one of the eight bones of the skull.
scope: Also called ethmoid, this is a small bone full of air spaces in the skull, one of eight, that helps
  form the eye sockets and the nose cavity.
examples:
- The ethmoid bone forms part of the eye socket.
- The scan showed the ethmoid bone clearly.
