simpleMeaning: to spread over something as a broad layer, like cloth laid across it
scope: Something spreading across an area as a broad covering layer, as snow or fog does, not the act
  of putting a covering over something and not the warm bed covering.
examples:
- Fresh snow blanketed the garden overnight.
- Fog blanketed the valley at dawn.
