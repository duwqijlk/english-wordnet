simpleMeaning: different from another thing, or different from the usual way
scope: This means different from another thing or from what is usual; it is not about lines or paths slowly
  moving apart from each other.
examples:
- The two brothers held divergent opinions about the plan.
- Her divergent way of solving the problem surprised the whole class.
