scope: A big fish of the mackerel kind that matters for trade, found in the Atlantic coastal waters of
  North America; unlike the long-nosed cavalla of the east Atlantic coast south to Brazil and the edible
  regalis of the mild coastal waters of the United States, this is the commercially important Atlantic
  mackerel.
