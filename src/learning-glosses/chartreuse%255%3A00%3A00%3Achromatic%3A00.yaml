simpleMeaning: having a yellowish green color, like the color of a sweet strong drink
scope: This describes a yellow-green color, not the sweet drink itself and not a plain yellow or plain
  green.
examples:
- She wore a chartreuse dress that was yellow and green.
- The chartreuse walls were a bright yellow-green.
