synsetId: 00268061-n
simpleMeaning: the act of fixing a hole in clothes by sewing threads across it, some going one way and
  some the other way
scope: Fixing a hole in clothes by sewing threads across it; not making new clothes by sewing, and not
  covering a hole with a separate piece of cloth.
examples:
- She spent the evening darning her husband's socks.
- Darning a hole in a sweater takes time and care.
