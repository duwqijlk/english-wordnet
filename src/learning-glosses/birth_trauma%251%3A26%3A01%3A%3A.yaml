simpleMeaning: People with a sick mind are said to show, in signs, harm done to a baby's feelings by what
  happens as it is born.
scope: This harm to a baby's feelings comes from what happens as it is born, not from later events in
  life.
examples:
- The birth trauma was said to show later in the child's signs.
- The birth trauma showed in the patient's signs.
