simpleMeaning: paid by the hour rather than with a fixed yearly pay
scope: This describes people paid by the hour rather than with a fixed yearly pay; wage-earning is another
  name for this sense, not people paid a set yearly salary and not people with no job.
examples:
- Most working-class jobs in the town paid by the hour.
- She came from a working-class family and knew what an hourly wage meant.
