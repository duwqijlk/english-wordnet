simpleMeaning: An infection caught by breathing in or swallowing tiny germs, shown by fever and small
  sores, usually in the lungs but in bad cases in other parts of the body.
scope: Also called tuberculosis and TB; an infection of the lungs that can spread to other parts of the
  body in bad cases, not a cold or flu.
examples:
- T.B. spreads when a sick person coughs and others breathe in the germs.
- He was treated for T.B. after a fever and a sore spot showed in his lung.
