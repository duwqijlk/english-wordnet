simpleMeaning: To cut out or hold back parts of what people write, say, or show because of politics, faith,
  or morals
scope: To cut out or hold back parts of what people write, say, or show because of politics, faith, or
  morals; not to forbid a whole work, and not the person who does the cutting.
examples:
- The army censored the soldier's letters home.
- The school censored the play, cutting the scenes it did not like.
