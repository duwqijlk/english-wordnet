simpleMeaning: an open-topped container for paper and other rubbish that people throw away
scope: This is the open container for unwanted paper and rubbish; not a bag, and not a box for keeping
  things.
examples:
- He threw the used paper into the wastebasket by his desk.
- The wastebasket was full of old letters and other rubbish.
