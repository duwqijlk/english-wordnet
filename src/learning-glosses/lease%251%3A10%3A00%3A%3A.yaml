simpleMeaning: an agreement that lets someone use a house, land, or other property for a set time in return
  for a set payment
scope: An agreement for the use of property for a set time and payment, not the property itself and not
  the act of renting it out.
examples:
- They signed a three-year lease on the shop.
- The lease ends at the end of June.
