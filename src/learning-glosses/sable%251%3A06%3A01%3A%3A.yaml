simpleMeaning: a brush for an artist, made from the hair of a small forest animal
scope: An artist's brush made from the hair of a small forest animal; not the animal itself and not a
  scarf made from its fur.
examples:
- The painter picked up a sable to add fine lines to the portrait.
- She cleaned her sable brush after finishing the watercolor.
