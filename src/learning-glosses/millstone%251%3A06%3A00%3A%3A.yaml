simpleMeaning: one of a pair of heavy, flat, round stones that turn against each other to crush grain
scope: One of two heavy stones used to crush grain, not something that holds a person back or makes life
  hard.
examples:
- The old mill used two millstones to crush the grain.
- A millstone is heavy and flat, and it turns against another stone.
