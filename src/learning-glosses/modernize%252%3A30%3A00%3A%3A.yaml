senseId: 'modernize%2:30:00::'
synsetId: 00262962-v
simpleMeaning: to repair something, make it like new again, change it, or make small changes to it
scope: 'Also called overhaul: to repair a thing or system, make it like new again, change it, or make
  small changes to it; not just giving something a new name or a new look.'
examples:
- They modernized the health care system by changing its rules and the way care is paid for.
- He modernized his old car engine by repairing worn parts and adjusting the settings.
