simpleMeaning: a unit for measuring the strength of a magnetic field, one millionth of a gauss
scope: A unit of magnetic strength, one millionth of a gauss; not a gauss itself and not a unit of length.
examples:
- The field measured only a few microgauss.
- A microgauss is one millionth of a gauss.
