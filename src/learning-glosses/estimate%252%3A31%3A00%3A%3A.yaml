simpleMeaning: to say about how much or how long something is, when you are not sure
scope: 'Also called guess, judge, gauge and approximate: to say about how much or how long something is
  when you are not sure, not a paper that says a thing''s worth and not a rough number itself.'
examples:
- I estimate this chicken weighs about three pounds.
- Can you estimate how long the trip will take?
