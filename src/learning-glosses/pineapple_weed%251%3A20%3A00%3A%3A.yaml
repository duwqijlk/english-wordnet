simpleMeaning: a one-year strong-smelling plant of the Pacific coast of the United States and north-east
  Asia, with sharp-tipped leaves and yellow flowers with no outer petals
scope: Also called rayless chamomile; a strong-smelling coastal weed, not the pineapple fruit and not
  true chamomile.
examples:
- Pineapple weed grows along the path near the beach.
- She crushed a pineapple weed leaf and smelled its sweet scent.
