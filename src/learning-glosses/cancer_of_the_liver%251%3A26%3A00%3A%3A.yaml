simpleMeaning: This is usually a cancer spread from another organ to the liver; it can cause poor appetite,
  weakness, bloating, yellowing of the skin and discomfort in the upper belly.
scope: Another name for liver cancer, a malignant liver growth that has usually spread from elsewhere;
  not hepatitis or cirrhosis, which are not cancers.
examples:
- Cancer of the liver often starts as a tumour in another organ.
- He was treated for cancer of the liver last year.
