simpleMeaning: A tough fast-growing plant of Japan, grown for its wide dark-green leaves, split into many
  small leaflets and good to look at.
scope: This tough fast-growing plant of Japan is grown for its wide dark-green leaves; it is not a bamboo
  plant and not a tree fern.
examples:
- She grew bamboo fern for its wide dark-green leaves.
- Bamboo fern is a tough plant that grows fast.
