simpleMeaning: A thing an animal takes in and turns into energy and new body tissue
scope: A thing an animal takes in for energy and growth, also called food, not the plant sense that takes
  in things to build new plant matter.
examples:
- This food is rich in the nutrient your body needs for energy.
- Milk has the nutrient a growing child needs for energy.
