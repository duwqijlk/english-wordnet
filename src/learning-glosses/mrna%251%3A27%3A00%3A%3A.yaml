simpleMeaning: the pattern for making proteins; the kind of RNA that carries the instructions from DNA
  in the nucleus to the places where proteins are made
scope: The RNA that carries instructions for making proteins; informational RNA, messenger RNA and template
  RNA are other names for this sense; not DNA itself and not another kind of RNA.
examples:
- The mRNA carries the code for a protein from the nucleus.
- Scientists read mRNA to see which proteins a cell is making.
