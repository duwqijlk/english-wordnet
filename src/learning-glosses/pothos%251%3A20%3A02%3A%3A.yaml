simpleMeaning: A climbing plant that keeps its leaves all year, grown widely for its leaves of more than
  one colour
scope: This is a climbing plant that keeps its leaves all year, grown for its leaves of more than one
  colour; golden pothos and ivy arum are other names for it, not a plant grown for its flowers.
examples:
- The pothos climbs up the wall of the kitchen.
- Her pothos has leaves of green and white.
