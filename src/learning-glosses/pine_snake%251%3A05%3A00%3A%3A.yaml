simpleMeaning: Woods of the tree it is named for, in the east and southeast of the United States, hold
  one of several kinds of bull creatures, now in danger.
scope: Of the bull creatures in the east and southeast of the United States, this one keeps mostly to
  woods of the tree it is named for, and it is now in danger.
examples:
- A pine snake lay in the woods.
- The pine snake moved through the woods.
