simpleMeaning: the hard material that rocks are made of, formed from minerals in the earth's crust
scope: This is the substance itself, not a single piece of it and not a shaped block used in building.
examples:
- The quarry supplies stone for roads and buildings.
- The floor was made of polished stone.
