simpleMeaning: A form of the Greek tongue that was in wide use in the time of the Roman Empire.
scope: The form of Greek used widely under the Roman Empire; the common tongue of that time, not the formal
  written style that borrowed from it.
examples:
- Koine was the common tongue of the Roman Empire.
- The New Testament was written in Koine.
