schema: oewn-learning-gloss-v2
senseId: 'blink%2:29:01::'
synsetId: 00008435-v
simpleMeaning: to hold back tears by closing and opening the eyes quickly
scope: This is holding tears back by closing and opening the eyes, not simply shutting them for a moment,
  not the eyelid reflex and not the light sense; blink away and wink are other names for this sense.
examples:
- She blinked away tears as she read the letter.
- He blinked hard to stop the tears from falling.
