simpleMeaning: The quality of a person's manner when it is polite and pleasing but plain, or when it tries
  to get others to like the person
scope: 'Also called blandness, suaveness, and suavity: this is about a person''s polite, pleasing manner,
  not a surface with no roughness to touch.'
examples:
- His smoothness helped him charm the guests at dinner.
- People did not trust the smoothness of her manner.
