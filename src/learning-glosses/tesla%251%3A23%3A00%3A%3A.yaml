simpleMeaning: A unit that measures how strong a magnetic field is, equal to one weber, a unit of magnetic
  flow, for each square metre
scope: A unit that measures how strong a magnetic field is, equal to one weber for each square metre;
  not a unit of electric current and not a unit of weight.
examples:
- The magnet's field was two tesla strong.
- Scientists measure the field in tesla.
