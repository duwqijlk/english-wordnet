simpleMeaning: Into the big blood tube that carries blood to the liver flows blood from the upper sides
  of the stomach, through this tube.
scope: Also called pyloric vein and right gastric vein, it serves the upper stomach, sending its blood
  on toward the liver.
examples:
- The vena gastrica-dextra carries blood away from the upper sides of the stomach.
- Blood from the stomach reaches the liver by way of the vena gastrica-dextra.
