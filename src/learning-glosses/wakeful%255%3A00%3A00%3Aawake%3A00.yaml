simpleMeaning: not asleep, with a clear mind, and ready to notice and take in what is happening
scope: 'Also called waking: fully awake and ready to take things in, not just watching carefully for danger.'
examples:
- She spent wakeful hours at her desk, fully alert and working through the night.
- The patient was wakeful and aware, talking clearly with the nurse.
