simpleMeaning: set on going against what others say, and on saying the opposite of what is expected
scope: A fixed wish to oppose and contradict others, not a refusal to follow rules or be guided.
examples:
- He took perverse pleasure in ruining her plans.
- Her perverse answer contradicted everything she had said before.
