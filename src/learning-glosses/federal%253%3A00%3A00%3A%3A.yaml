simpleMeaning: of a way of ruling in which power is shared between one central rule and several local
  rules
scope: Of a way of ruling in which power is shared between one central rule and several local rules, not
  simply of the central rule itself.
examples:
- The United States has a federal system of government.
- Federal governments often grew out of loose groups of states.
