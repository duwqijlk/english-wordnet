simpleMeaning: the act of following a person or animal to find them, by using the tracks or marks they
  left behind
scope: 'Also called tracking: this is following a person or animal by the marks they left, not just walking
  behind someone.'
examples:
- The trailing of the deer took the hunters through the woods.
- Trailing was hard in the rain because the footprints washed away.
