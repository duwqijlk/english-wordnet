simpleMeaning: A metal that gives off rays, heavier than uranium, found in tiny amounts in uranium rock
  and left over when plutonium is made
scope: This is a metal that gives off rays; atomic number 93 and neptunium are other names for it, not
  uranium or plutonium, the metals it is found with and made from.
examples:
- The lab detected Np in the uranium ore sample.
- Np is a by-product of making plutonium.
