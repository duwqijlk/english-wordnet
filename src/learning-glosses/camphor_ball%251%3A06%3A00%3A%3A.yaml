simpleMeaning: a small round lump made from a strong-smelling white substance, used to keep moths away
  from clothes put away in storage
scope: A small round lump made from a strong-smelling white substance, used to keep moths away from clothes
  put away in storage; mothball is another name for this sense, not a sweet-smelling block for a room.
examples:
- She put a camphor ball in the drawer with the woollen coats.
- The camphor ball kept moths out of the stored blankets.
