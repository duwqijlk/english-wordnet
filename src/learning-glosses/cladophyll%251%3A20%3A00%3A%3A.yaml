simpleMeaning: A flat stem that looks and works like a leaf.
scope: A flat stem that looks and works like a leaf, also called cladode, phylloclad and phylloclade;
  not a true leaf and not a round stem.
examples:
- The cladophyll of the plant does the work of a leaf.
- This plant has a broad green cladophyll instead of leaves.
