simpleMeaning: A cord stretched low over the ground that sets off a trap, a camera, or a weapon when someone
  walks into it
scope: A cord stretched low over the ground that sets off a trap, camera, or weapon; not a rope fence
  and not the military sense of a small force that brings in stronger troops.
examples:
- He stumbled over a trip wire and set off the alarm.
- The soldiers laid a trip wire across the path at night.
