simpleMeaning: A cutting tool with a short handle and a curved blade, for cutting grass or crops by hand
scope: A hand tool with a curved blade for cutting grass or crops, also called a sickle or a reap hook;
  not a scythe with a long handle and not a knife.
examples:
- She used a reaping hook to cut the wheat.
- The reaping hook was sharp and ready.
