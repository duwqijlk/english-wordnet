simpleMeaning: the act of making a thing empty by letting the liquid in it run out
scope: This is the act itself, also called drain, not the pipes or ditches that carry water away and not
  the liquid that runs out.
examples:
- The drainage of the tank was slow, but at last all the water ran out.
- They watched the drainage of the pool until no water was left in it.
