simpleMeaning: A common European weed that lives one year, with white flowers and finely cut leaves, now
  wild and sometimes grown in eastern North America; sometimes put in the genus Matricaria.
scope: A common European weed with white flowers and finely cut leaves, also called corn mayweed, scentless
  camomile, scentless false camomile, scentless hayweed, scentless mayweed and Matricaria inodorum.
examples:
- Tripleurospermum inodorum grows as a weed with white flowers in the field.
- Tripleurospermum inodorum is sometimes grown in eastern North America.
