simpleMeaning: An antelope with white marks like a harness and twisted horns.
scope: Also called bushbuck and guib, this is an antelope with white marks like a harness and twisted
  horns, not an antelope with no white marks or straight horns.
examples:
- Tragelaphus scriptus has white marks like a harness on its sides.
- We saw a Tragelaphus scriptus with twisted horns in the bush.
