simpleMeaning: In childbirth care, a woman who has given birth to a baby able to live in each of five
  times she was with child
scope: A woman who has given birth to a baby able to live in each of five times she was with child, not
  four.
examples:
- The nurse noted that the quintipara had given birth five times.
- As a quintipara, she had five children, each born able to live.
