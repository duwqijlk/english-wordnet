simpleMeaning: the best possible under a limit, whether the limit is said clearly or only understood
scope: Another name for this sense is optimal. It means the best possible under a limit, not just good
  or enough.
examples:
- They chose the optimum amount of the drug for the treatment.
- The optimum return on his money came from a safe plan.
