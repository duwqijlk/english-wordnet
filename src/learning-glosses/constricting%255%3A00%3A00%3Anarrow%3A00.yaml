simpleMeaning: used of the conditions around a person, likely to make it harder for them to act freely
scope: 'Also called narrowing: used of conditions around a person that make their freedom less, not about
  a tube or a body part getting smaller in size.'
examples:
- She left the constricting rules of the small town behind her.
- He found his strict home life constricting and wanted more freedom.
