simpleMeaning: After a dye that shows up on an X-ray is put into them, the small glands and tubes that
  carry fluid through the body are pictured.
scope: It is a picture of the glands and tubes that carry fluid through the body, made with a dye that
  shows up on an X-ray.
examples:
- The lymphangiogram pictured the glands and tubes after the dye was put in.
- The dye in the lymphangiogram showed up on the X-ray.
