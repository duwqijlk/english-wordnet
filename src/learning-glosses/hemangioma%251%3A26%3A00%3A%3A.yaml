simpleMeaning: A harmless growth made of a mass of blood tubes; some growths of this kind show on the
  skin as birthmarks.
scope: A harmless growth made of blood tubes, some showing as birthmarks; haemangioma is another name
  for this sense, and this is not a harmful growth or a plain birthmark with no growth under it.
examples:
- The baby's hemangioma showed as a red birthmark on her cheek.
- The doctor said the hemangioma was harmless and would shrink over time.
