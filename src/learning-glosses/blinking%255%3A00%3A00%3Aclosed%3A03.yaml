simpleMeaning: closing the eyes quickly, again and again, for a short time each time
scope: 'Also called winking: describes someone whose eyes close quickly again and again for a short time
  each time; not the noun sense, the act itself of the eyes closing and opening.'
examples:
- She came out of the dark cinema blinking in the strong light.
- The tired baby sat in his chair, blinking again and again.
