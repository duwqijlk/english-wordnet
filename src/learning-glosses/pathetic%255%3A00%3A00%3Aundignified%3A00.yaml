senseId: pathetic%5:00:00:undignified:00
synsetId: 00756368-s
simpleMeaning: making people feel sorry for someone, but also feel that they are not worthy of respect
scope: 'Also called silly and ridiculous: this sense makes people feel pity with scorn; it is not the
  softer sense where a person only deserves pity, and not the sense with mixed contempt and pity.'
examples:
- He made a pathetic attempt to lie, and no one believed him or felt any respect for him.
- Her pathetic excuse was so weak that everyone felt sorry for her but could not respect it.
