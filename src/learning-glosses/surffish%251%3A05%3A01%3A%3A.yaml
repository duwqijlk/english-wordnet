simpleMeaning: Small to middle-sized creatures that live in shallow water off the Pacific coast of North
  America.
scope: Small to middle-sized creatures that live in shallow water off the Pacific coast of North America;
  also called surf fish and surfperch; not deep-water creatures and not creatures of the Atlantic coast.
examples:
- Surffish swim in the shallow water off the Pacific coast.
- Anglers catch surffish from the beach in California.
