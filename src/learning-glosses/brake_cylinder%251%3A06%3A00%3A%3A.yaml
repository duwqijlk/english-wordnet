simpleMeaning: A hollow round part that holds fluid for slowing a vehicle, which a sliding rod squeezes
scope: A hollow round part that holds fluid for slowing a vehicle, which a sliding rod squeezes, also
  called a hydraulic brake cylinder and a master cylinder; not a tube that carries fuel and not the pedal
  itself.
examples:
- The brake cylinder was leaking fluid.
- A new brake cylinder stopped the pedal from sinking.
