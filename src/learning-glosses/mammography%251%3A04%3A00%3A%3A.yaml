simpleMeaning: a medical test that uses X rays to find growths in the breast
scope: This is the test itself, not the picture made by the test and not a treatment for breast illness.
examples:
- The doctor sent her for mammography to check the lump in her breast.
- Mammography can find small breast growths before they can be felt.
