simpleMeaning: In grammar, the link between two parts of a sentence that are built in the same way
scope: In grammar, the link between two sentence parts built in the same way, not the bringing together
  of different parts into one smooth operation, and not the skill of moving the body well.
examples:
- In 'tea and coffee', the coordination joins two nouns of the same form.
- She studied coordination in sentences like 'he ran and jumped'.
