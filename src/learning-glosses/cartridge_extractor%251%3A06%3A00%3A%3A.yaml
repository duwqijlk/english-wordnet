simpleMeaning: The part that throws it clear gets a spent shell from this part in a gun, which pulls it
  out of the firing chamber
scope: Also called extractor and cartridge remover, this part in a gun pulls a spent shell out of the
  chamber, unlike the part that throws it clear and unlike the firing pin.
examples:
- The cartridge extractor pulled the empty shell from the chamber.
- A worn cartridge extractor can fail to pass the shell to the ejector.
