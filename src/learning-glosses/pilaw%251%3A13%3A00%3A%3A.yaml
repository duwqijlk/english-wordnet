simpleMeaning: Meat or shellfish usually goes into this rice, cooked in well seasoned broth with onions
  or celery and sometimes tomatoes.
scope: 'Also called pilaf, pilaff, and pilau: rice cooked in well seasoned broth, usually with poultry,
  game, or shellfish, and sometimes with tomatoes.'
examples:
- Pilaw is rice cooked in well seasoned broth with onions.
- We had pilaw with game and tomatoes.
