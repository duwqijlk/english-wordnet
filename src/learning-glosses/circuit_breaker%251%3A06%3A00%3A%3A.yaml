simpleMeaning: A device that cuts off the power, like a switch, when too much power runs through it
scope: A device that cuts off the power, like a switch, when too much power runs through it; breaker is
  another name for this sense, not a fuse that melts to cut power and not a plain switch worked by hand.
examples:
- The circuit breaker cut the power when the line was overloaded.
- Reset the circuit breaker after the lights go out.
