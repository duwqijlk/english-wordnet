simpleMeaning: In mathematics, a smaller set that is not empty and is part of a larger set called a group
  (a set with a rule for joining its parts)
scope: In mathematics, this is a smaller set that is not empty and is inside a group; it is not just any
  small group of people inside a larger group.
examples:
- In mathematics class, we learned that this small set is a subgroup of the larger group.
- A subgroup must have at least one member, so the empty set does not count.
