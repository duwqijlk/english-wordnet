simpleMeaning: Blood moves in a set of tubes and other parts through a baby still growing inside its mother
scope: 'Also called foetal circulation: the way blood moves through a baby before it is born, not the
  way blood moves in an adult and not the heart itself.'
examples:
- Fetal circulation brings blood to the growing baby's organs.
- Doctors study fetal circulation to check the health of an unborn baby.
