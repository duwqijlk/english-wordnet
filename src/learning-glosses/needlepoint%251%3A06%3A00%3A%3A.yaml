simpleMeaning: sewing with thread that covers the whole of a piece of cloth, in a way that makes it look
  like a woven wall hanging
scope: 'Also called needlepoint embroidery: sewing with thread that covers the whole of a piece of cloth.
  Not the lace made with a needle on a paper pattern.'
examples:
- She filled the frame with needlepoint in bright colours.
- The chair seat was covered in needlepoint she made herself.
