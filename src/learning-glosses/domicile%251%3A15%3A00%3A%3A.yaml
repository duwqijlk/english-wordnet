simpleMeaning: In law, a person's lasting home or main base, to which they mean to return whenever away;
  each person must have one, and only one, at a time.
scope: Also called legal residence, in law a person's lasting home or main base, to which they mean to
  return whenever away.
examples:
- His domicile was in France, though he worked abroad.
- For tax, she had to name one domicile and only one.
