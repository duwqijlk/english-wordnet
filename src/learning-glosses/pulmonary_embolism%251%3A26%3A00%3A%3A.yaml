simpleMeaning: The artery in the lung is blocked by a lump of blood or a bit of stuff from outside the
  body
scope: A block in the artery in the lung, not a block in a leg or the brain.
examples:
- A pulmonary embolism stopped the blood flow to part of her lung.
- Doctors found a pulmonary embolism after he complained of sudden chest pain.
