simpleMeaning: A fern with long shiny silver growths that wrap round the young spores as they grow.
scope: 'Also called silvery spleenwort and Athyrium thelypteroides: a fern whose long shiny silver growths
  wrap round the young spores, set apart from other ferns by those silver growths.'
examples:
- Deparia acrostichoides shows silver growths along its fronds in spring.
- The Deparia acrostichoides in the damp wood had spores wrapped in silver.
