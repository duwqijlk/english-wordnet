simpleMeaning: A herb of the Pacific islands, grown in hot lands for its root, which can be eaten, and
  in cooler lands as a show plant for its large shiny leaves.
scope: Also called dalo, dasheen, or a taro plant, this is the herb itself, grown for its root and its
  leaves, not the root alone that is eaten.
examples:
- Taro grew in the wet fields behind the village.
- She planted taro for its large glossy leaves.
