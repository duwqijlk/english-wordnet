simpleMeaning: a company that deals with money and sells a promise to pay costs when loss or harm happens
scope: A company that sells this promise to pay, not the person who buys it and not the promise itself.
examples:
- The insurer paid for the repairs after the fire.
- She asked her insurer to pay the cost of the accident.
