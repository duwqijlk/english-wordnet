simpleMeaning: Stripes run along the bodies of harmless animals of North and Central America, one of many
  kinds with no venom that bear live young.
scope: Also called garter snake, it names one of many harmless striped kinds of North and Central America
  with no venom that bear live young, not the harmless European snake with a bright yellow collar.
examples:
- A grass snake slipped through the grass.
- Grass snakes bear live young instead of laying eggs.
