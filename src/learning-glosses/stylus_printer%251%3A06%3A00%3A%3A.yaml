simpleMeaning: a machine that prints by striking, in which each mark is made of dots formed by thin wires
scope: This is a machine that prints by striking, making marks from dots, also called wire matrix printer
  and wire printer; not a machine that prints with ink drops and not a machine that prints whole marks
  at once.
examples:
- The stylus printer made a loud noise as it struck the paper.
- Old offices used a stylus printer for invoices.
