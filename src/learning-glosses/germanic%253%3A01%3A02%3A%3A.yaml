simpleMeaning: Said of the old Teutons, a people of long ago, or of the tongues they spoke.
scope: Also called Teutonic; said of an old people and their tongues, not of the whole family of languages
  and not of the tongue of present-day Germans.
examples:
- Germanic mythology tells stories from the old Teutons.
- Scholars study Germanic tongues to learn how the old Teutons spoke.
