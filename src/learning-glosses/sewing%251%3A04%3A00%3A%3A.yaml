simpleMeaning: the act of joining things together or fixing one thing to another by making stitches (small
  loops of thread pulled through cloth with a needle)
scope: This is the act of joining things with a needle and thread, not the piece of work that you are
  making with a needle and thread.
examples:
- Sewing is a good way to join the two pieces of cloth.
- She spent the morning sewing the torn sleeve back on.
