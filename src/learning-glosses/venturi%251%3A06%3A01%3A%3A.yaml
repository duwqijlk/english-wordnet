simpleMeaning: a tube that narrows, used to control how fast a liquid or gas flows, as in the air inlet
  of a carburetor
scope: A tube that narrows to control flow, not a plain open pipe and not a valve that opens and shuts.
examples:
- The venturi in the carburetor helps to mix the fuel with air.
- A venturi narrows in the middle so the air speeds up as it passes through.
