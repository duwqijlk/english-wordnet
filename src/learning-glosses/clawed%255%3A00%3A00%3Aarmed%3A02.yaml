simpleMeaning: of animals that hunt other animals, having sharp curved nails on the feet for catching
  and holding
scope: Of an animal that hunts other animals and has sharp curved nails on its feet, not the wider sense
  of having or looking like such a nail.
examples:
- The clawed lion caught the deer with ease.
- A clawed eagle flew down and caught a fish.
