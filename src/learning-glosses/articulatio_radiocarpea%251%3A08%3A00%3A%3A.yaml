simpleMeaning: 'Here the hand meets the lower arm: the far end of the lower-arm bone sits on the nearest
  row of small wrist bones.'
scope: Also called wrist, carpus, radiocarpal joint and wrist joint, this is where the lower arm meets
  the hand.
examples:
- The hand turned at the articulatio radiocarpea.
- The articulatio radiocarpea moved as the hand turned.
