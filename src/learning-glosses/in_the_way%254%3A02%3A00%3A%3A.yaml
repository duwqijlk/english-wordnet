simpleMeaning: standing where it blocks what a person is trying to do
scope: This is a thing or person that gets in the path of what someone wants to do, not a clear path;
  in someone's way is another name for this.
examples:
- The chair was in the way, so I moved it.
- Don't stand in the way of the door.
