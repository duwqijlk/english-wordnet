simpleMeaning: in a strong, hard way when speaking or writing against someone, holding back no bad words
scope: 'Also called unsparingly: speaking or writing against someone in a strong, hard way, not in a kind
  or gentle way.'
examples:
- She criticized him scathingly in her review of his book.
- He spoke scathingly about the new plan at the meeting.
