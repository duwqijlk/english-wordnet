simpleMeaning: to remove substances from something by using a liquid that passes slowly through it
scope: To remove substances from something by using a liquid that passes slowly through it, not to empty
  a place of all its things and not to steal goods.
examples:
- Water passing through the ground strips minerals from the soil.
- They used a flowing liquid to strip the unwanted salts from the sand.
