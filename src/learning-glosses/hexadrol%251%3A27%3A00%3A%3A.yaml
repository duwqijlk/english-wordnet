senseId: 'hexadrol%1:27:00::'
synsetId: 14777987-n
simpleMeaning: A drug (a corticosteroid, a drug that calms the body's defence system) used to treat allergies
  or inflammation
scope: A drug for allergies or inflammation; dexamethasone, Decadron, Dexamethasone Intensol, Dexone and
  Oradexon are other names for this sense, not a painkiller and not a drug for infections.
examples:
- The doctor gave her Hexadrol for the bad allergic rash.
- Hexadrol brought the swelling down within a day.
