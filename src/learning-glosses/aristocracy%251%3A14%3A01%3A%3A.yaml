simpleMeaning: a group of people with special rights and high place in society, whose titles pass from
  parents to children
scope: 'Also called nobility: the group of people with special rights whose titles pass from parents to
  children, not one ruler alone and not just rich people.'
examples:
- The aristocracy owned most of the land and passed their titles to their children.
- Only people born into the aristocracy could sit in that part of the court.
