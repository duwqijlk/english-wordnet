senseId: 'cloakroom_ticket%1:10:01::'
synsetId: 92460322-n
simpleMeaning: A person leaves a coat or other thing to be kept and gets a slip of paper, shown later
  to get the thing back.
scope: A slip of paper given when a coat or other thing is left to be kept, to be shown again when the
  thing is picked up.
examples:
- She put her cloakroom ticket in her pocket after leaving her coat.
- He showed his cloakroom ticket to get his umbrella back.
