simpleMeaning: A big, harmless North American animal with no legs, dark and shiny, that moves on its belly
scope: 'Also called a black rat snake, a blacksnake or a pilot blacksnake: a big harmless dark shiny animal
  with no legs from North America, not a small one and not one that can hurt you.'
examples:
- A mountain blacksnake crossed the path in front of us.
- The mountain blacksnake in the garden does not bite.
