simpleMeaning: a state in which a person can hardly put thoughts into spoken or written words
scope: 'Also called expressive aphasia, motor aphasia and nonfluent aphasia: a loss of the power to speak
  or write, not a loss of the power to understand and not a slowness of thought.'
examples:
- After the stroke, his ataxic aphasia left him unable to write a short note.
- Her ataxic aphasia meant she could not find the words to say what she meant.
