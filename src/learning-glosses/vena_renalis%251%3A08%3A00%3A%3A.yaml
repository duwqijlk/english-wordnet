simpleMeaning: These blood tubes run beside the tubes that feed the kidneys and open into the body's largest
  blood tube at the second bone of the lower back.
scope: 'Also called the renal vein: blood tubes that run beside the tubes feeding the kidneys, not the
  tubes that feed the kidneys themselves.'
examples:
- The vena renalis opens into the vena cava beside the second bone of the lower back.
- Each vena renalis runs beside a blood tube that feeds a kidney.
