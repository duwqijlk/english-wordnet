simpleMeaning: It links the tubes between ribs to the tube along the chest side or the tube to the upper
  belly, one of a few blood tubes that do this.
scope: It is one of the tubes that link the rib tubes to the chest-side tube, not a rib tube itself.
examples:
- The costoaxillary vein links the rib veins to the chest veins.
- A costoaxillary vein was traced on the scan.
