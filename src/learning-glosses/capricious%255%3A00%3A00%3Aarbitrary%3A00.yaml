simpleMeaning: decided or done because of chance, a sudden feeling, or a sudden wish, not because of need
  or reason
scope: 'Also called impulsive, and another name for it is whimsical: this describes choices made on a
  sudden wish, not planned choices made for a good reason.'
examples:
- A capricious ruler changed the law whenever he felt like it.
- Her capricious refusal surprised everyone, as she had no reason for saying no.
