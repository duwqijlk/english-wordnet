simpleMeaning: any of several sweet-smelling sticky substances from plants, a mix of oil and thick tree
  substance, used in medicines and perfumes
scope: This is the sweet-smelling plant substance itself, not the skin cream made from it and not the
  plant that gives it.
examples:
- Balsam from the tree is used to make perfumes.
- Workers collect balsam to use in medicines and perfumes.
