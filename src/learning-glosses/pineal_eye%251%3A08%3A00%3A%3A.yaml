simpleMeaning: a light-sensing part on the upper side of a deep part of the brain in some reptiles
scope: 'Also called third eye: a light-sensing part on the upper side of a deep part of the brain in some
  reptiles, not a true eye and not a part of the skin.'
examples:
- The pineal eye of the lizard can sense light.
- Some reptiles have a pineal eye on top of the head.
