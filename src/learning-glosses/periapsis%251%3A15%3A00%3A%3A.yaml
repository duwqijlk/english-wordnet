simpleMeaning: In astronomy, the point of a path round a body at which a thing comes nearest to that body
scope: Also called point of periapsis, this is the nearest point on an orbit, not the farthest point and
  not a point on the orbit at random.
examples:
- The probe reached periapsis at dawn.
- At periapsis the comet moves fastest.
