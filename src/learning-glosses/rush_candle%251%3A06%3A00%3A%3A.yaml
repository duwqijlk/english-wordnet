simpleMeaning: a light made from animal fat with a plant stem as the part that burns
scope: 'Also called a rushlight: a light made from animal fat with a plant stem as the part that burns,
  not a wax light and not an oil lamp.'
examples:
- She lit a rush candle to read by in the evening.
- The rush candle burned low, its fat nearly used up.
