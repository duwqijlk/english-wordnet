simpleMeaning: the act of turning something round and round, or twisting it again and again
scope: 'Also called twist: the act of turning something round and round, not the describing word for a
  road or path with many turns and bends.'
examples:
- The winding of the rope around the post took a few minutes.
- She finished the winding of the old clock by turning its key.
