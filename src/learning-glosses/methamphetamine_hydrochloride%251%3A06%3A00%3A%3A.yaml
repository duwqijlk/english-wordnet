simpleMeaning: Sold as Methedrine, this salt from the amphetamine family comes in clear crystals; it gives
  the nerves a push and holds hunger off
scope: 'Also called glass, ice, trash, chalk, meth, crank, shabu, methamphetamine, chicken feed, and deoxyephedrine:
  a drug in clear crystal form that wakes up the nerves, not a drug that calms them.'
examples:
- He was caught with methamphetamine hydrochloride in his pocket.
- Methamphetamine hydrochloride takes away hunger and wakes up the nerves.
