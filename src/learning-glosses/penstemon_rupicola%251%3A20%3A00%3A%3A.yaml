simpleMeaning: One of the West's finest wildflowers, with bright pink or rose flowers in sprays above
  thick mats of stems and leaves, growing on ledges and cliffs from Washington to California.
scope: A wildflower of ledges and cliffs in the West, from Washington to California; also called cliff
  penstemon and rock penstemon.
examples:
- Penstemon rupicola crowns the cliff ledge with pink flowers.
