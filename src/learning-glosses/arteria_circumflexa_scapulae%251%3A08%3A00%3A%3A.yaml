simpleMeaning: An artery that brings blood to the muscles of the shoulder and the shoulder-blade area.
scope: 'Also called circumflex scapular artery: an artery that brings blood to the muscles of the shoulder
  and the shoulder-blade area, not the main artery of the arm and not a vein.'
examples:
- The arteria circumflexa scapulae feeds the muscles near the shoulder blade.
- Blood reaches the shoulder-blade area through the arteria circumflexa scapulae.
