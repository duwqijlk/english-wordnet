simpleMeaning: A crossbar joined to the straps of a working horse and to the cart or tool the horse pulls.
scope: A crossbar between a working horse and what it pulls; swingletree and whiffletree are other names
  for this sense, not the horse's collar and not the cart itself.
examples:
- The whippletree joined the horse to the cart.
- He mended the whippletree before hitching the horse.
