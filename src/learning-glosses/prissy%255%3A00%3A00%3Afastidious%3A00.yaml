simpleMeaning: too careful about small details and about keeping clean, and easily made to feel sick by
  dirty or unpleasant things
scope: 'Also called nice, dainty, and squeamish: too fussy and easily made to feel sick by dirty things,
  not simply careful, clean, or kind.'
examples:
- He is so prissy about his food that he will not eat camp cooking.
- My prissy cousin would only touch the handle with her elbow.
