simpleMeaning: To show a feeling or tell a story, a person moves in this new kind of movement
scope: A form of modern movement in which a person's moves show a feeling or tell a story, also called
  interpretative dancing, interpretive dance or interpretive dancing; not a set folk dance and not a ballet.
examples:
- The interpretative dance told a sad story through slow movements.
- She performed an interpretative dance about the sea.
