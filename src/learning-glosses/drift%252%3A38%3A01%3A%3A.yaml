simpleMeaning: To go from place to place with no fixed plan or destination, often because you need food
  or a job.
scope: This is moving from place to place with no fixed goal, often seeking food or work, and range, roll
  and cast are other names for it; it is not living without hurry and not driving animals to pasture.
examples:
- After the factory closed, he drifted from town to town looking for work.
- The cattle drifted across the plain, searching for grass.
