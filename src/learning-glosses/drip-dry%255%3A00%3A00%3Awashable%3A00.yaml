simpleMeaning: made so cloth washes with ease and loses its water on its own, with little or no pressing
  with a hot iron
scope: Cloth made so it washes and dries with ease and needs little or no ironing, not ordinary cloth
  that needs full ironing after washing.
examples:
- This drip-dry shirt needs no ironing after a wash.
- She hung the drip-dry blouse up to dry overnight.
