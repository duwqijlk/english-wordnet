simpleMeaning: sharp-tasting red fruit, like the red fruit of America but of a smaller size
scope: Sharp-tasting red fruit, like the red fruit of America but smaller; lingonberry, lowbush cranberry
  and mountain cranberry are other names for this sense, and it is not the low green plant that bears
  the fruit.
examples:
- She picked cowberries for jam in the autumn.
- The cowberries were too tart to eat raw.
