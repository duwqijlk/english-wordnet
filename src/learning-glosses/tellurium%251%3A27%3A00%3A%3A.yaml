simpleMeaning: A brittle silver-white element between metal and non-metal, like selenium and sulfur, used
  in alloys and as a semiconductor; found mainly as tellurides in copper, nickel, silver, and gold ores.
scope: A brittle element between metal and non-metal, also called Te and atomic number 52; not selenium
  and not sulfur, its close kin.
examples:
- Tellurium is used in some alloys and semiconductors.
- Miners find tellurium in ores of copper and gold.
