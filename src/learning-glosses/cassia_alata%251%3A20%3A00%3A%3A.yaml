simpleMeaning: A tropical bush, above all of the Americas, with yellow flowers and big leaves whose juice
  cures ringworm and poisonous bites, sometimes classed in the genus of its own name.
scope: Also called ringworm bush, ringworm cassia, ringworm shrub, and Senna alata; a tropical bush of
  the Americas with yellow flowers and big leaves whose juice cures ringworm and poisonous bites.
examples:
- Cassia alata grows by the road in the tropics.
- They used Cassia alata juice on the ringworm.
