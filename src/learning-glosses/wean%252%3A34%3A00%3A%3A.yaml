simpleMeaning: to get a baby or young animal used to food other than its mother's milk, a little at a
  time
scope: Getting a baby or young animal off its mother's milk, a little at a time, not feeding it milk and
  not stopping the milk all at once.
examples:
- She weaned her baby when he was three months old.
- The farmer weaned the calves in the spring.
