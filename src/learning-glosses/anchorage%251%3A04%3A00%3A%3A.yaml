simpleMeaning: the act of dropping a heavy weight from a ship to the bottom of the water so the ship stays
  in one place
scope: This is the act of stopping a ship in this way; it is not the place where ships stop, and not the
  money paid for stopping there.
examples:
- The captain ordered the anchorage before the storm reached the bay.
- Anchorage was quick because the water was calm and not deep.
