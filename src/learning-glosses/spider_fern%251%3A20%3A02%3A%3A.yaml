simpleMeaning: a leafy plant that grows in North Africa and on the Azores and the Canary Islands
scope: A leafy plant of North Africa and the Azores and Canary Islands, also called ribbon fern; not a
  spider, and not a web made by one.
examples:
- A spider fern grew in a pot on the windowsill.
- The garden had a spider fern from the Canary Islands.
