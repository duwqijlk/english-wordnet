scope: A grass often grown for its long white-ribbed leaves and large plumes like those of pampas grass;
  wool grass and Ravenna grass are other names for it, not pampas grass itself, whose plumes it only resembles.
examples:
- Erianthus ravennae stands tall in the garden with long white-ribbed leaves.
- We cut the large plumes of Erianthus ravennae for a vase.
