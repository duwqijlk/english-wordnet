simpleMeaning: In baseball, a fast throw of the ball that bends a little away from the side it was thrown
  from
scope: This is a kind of throw in baseball, not a person who slips on a surface and not a turtle that
  lives in fresh water.
examples:
- The pitcher threw a slider that moved away from the batter at the last moment.
- His slider is hard to hit because it bends late.
