synsetId: 05812144-n
simpleMeaning: A rough figure reached by thinking things through and then taking a chance.
scope: A rough number worked out when you do not know it, by thinking hard and then taking a chance, also
  called guestimate, not a careful count and not a number picked with no thought at all.
examples:
- I made a quick guesstimate of the cost.
- Her guesstimate turned out to be close to the real number.
