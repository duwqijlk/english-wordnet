simpleMeaning: A drug that eases swelling and pain without using a steroid, sold under this trade name,
  used for mild pain, above all for the cramps of monthly bleeding.
scope: A drug that eases swelling and pain without using a steroid, sold under this trade name, also called
  mefenamic acid, not a drug for strong pain.
examples:
- The doctor gave her Ponstel for her monthly cramps.
- Ponstel eased the mild pain in her back.
