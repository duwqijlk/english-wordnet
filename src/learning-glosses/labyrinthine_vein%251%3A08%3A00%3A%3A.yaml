simpleMeaning: Blood tubes that carry blood away from the inner ear
scope: 'Also called internal auditory vein: blood tubes that drain the inner ear, not the blood tubes
  that feed the ear and not the tubes that carry tears.'
examples:
- The labyrinthine vein drains blood from the inner ear.
- Damage to the labyrinthine vein can affect blood flow in the ear.
