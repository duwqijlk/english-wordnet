simpleMeaning: an area of land with a lot of oil under the ground, especially one where oil is being taken
  out from wells
scope: This is a whole area with much oil under the ground, especially one with working wells, not just
  a single well.
examples:
- Workers built roads across the oilfield.
- The new oilfield has many wells that bring up oil each day.
