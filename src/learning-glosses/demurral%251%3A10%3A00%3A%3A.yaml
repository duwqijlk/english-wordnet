simpleMeaning: In law, the other side's written case is met in court with a formal protest
scope: This is a formal protest in court against the other side's written case, also called demur and
  demurrer; not a mere disagreement and not a plea of guilty.
examples:
- The lawyer filed a demurral to the other side's claim.
- His demurral argued that the other side's papers were flawed.
