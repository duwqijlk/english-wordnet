simpleMeaning: Believing in a god and showing deep respect and devotion toward that god.
scope: This sense is not about holy matters or the church in general, and not about monks under vows,
  but about a person's belief in and respect for a god.
examples:
- She is a deeply religious person who prays every morning.
- His religious faith helped him through the difficult year.
