simpleMeaning: looked on with great respect and warm liking
scope: This means people respect and like someone or something a lot; it is not just being well known,
  and it is not love in a family or between lovers.
examples:
- She is an admired writer whose books many people respect.
- The admired teacher was praised by former students for many years.
