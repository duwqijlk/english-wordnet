simpleMeaning: An operation, usually with local numbing, widening the cervix, scraping the womb lining
  with a tool, to sample tissue, stop bleeding, remove growths, clear leftover placenta, or end a pregnancy.
scope: Also called dilatation and curettage and dilation and curettage; an operation on the womb lining,
  not a birth and not a general operation.
examples:
- The doctor did a D and C to stop the bleeding.
- A D and C can take a tissue sample from the womb.
