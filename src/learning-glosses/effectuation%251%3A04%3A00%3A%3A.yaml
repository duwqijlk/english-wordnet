simpleMeaning: the act of making something happen by putting in place a workable way to do it
scope: 'Also called implementation: the act of making something happen by putting a workable way to do
  it in place, not the thing to be done and not the result it brings.'
examples:
- The effectuation of the new safety rules took months of hard work.
- Her careful effectuation of the plan turned a good idea into real change.
