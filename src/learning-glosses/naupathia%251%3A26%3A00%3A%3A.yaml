simpleMeaning: While you travel on water, the movement makes you feel sick
scope: This is the sick feeling that comes from the movement of a boat on water, with seasickness and
  mal de mer as other names for this sense, not sickness from a car or a plane and not a stomach bug.
examples:
- She took a pill for her naupathia before the boat left the harbour.
- His naupathia set in as soon as the ship began to roll.
