simpleMeaning: A dry mouth, sleepiness and stomach and gut troubles are among the many side effects of
  this drug for low mood, sold as Adapin and Sinequan.
scope: It is also called doxepin, a drug for low mood with many side effects, sold as Adapin and Sinequan.
examples:
- Doxepin hydrochloride made his mouth dry.
- She stopped doxepin hydrochloride because it made her sleepy.
