simpleMeaning: hairy stems in dust-like down, white flowers and leaves mark a bushy plant of the Canary
  Islands that lives for years; sometimes put in the group Chrysanthemum
scope: Also called dusty miller and silver-lace; a white-flowered Canary Islands plant, not a lace cloth
  and not a garden daisy.
examples:
- The silver lace in the rock garden has white flowers.
- Dust-like down covers the stems of the silver lace.
