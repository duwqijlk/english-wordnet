simpleMeaning: To press folds and lines into a smooth surface, making a pressed, folded, or wrinkled mark;
  the old word ‘crisp’ for this is no longer used
scope: 'Also called wrinkle, crisp, crease, and crinkle: pressing folds into a smooth surface, not the
  grating noise of a dry engine.'
examples:
- He scrunched the paper and tossed it aside.
- She scrunched the dress as she sat down.
