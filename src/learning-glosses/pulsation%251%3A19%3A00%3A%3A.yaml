senseId: 'pulsation%1:19:00::'
synsetId: 11549746-n
simpleMeaning: Something that comes back again and again, with some amount rising and falling in turn.
scope: A thing that comes and goes in a regular rise and fall, not a sharp, short-lived wave, or a run
  of them, in the normal state of an electric current, nor the arteries swelling and shrinking in time
  with each beat of the heart.
examples:
- The pulsation of the light grew stronger, then weaker, then stronger again.
- They watched the pulsation in the readings rise and fall.
