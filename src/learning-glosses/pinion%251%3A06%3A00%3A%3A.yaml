simpleMeaning: a wheel with a small number of teeth around its edge, made to fit with a larger wheel or
  a bar with teeth
scope: A small wheel with teeth in a machine; not the large feather on a bird's wing or tail.
examples:
- The pinion turns the larger wheel inside the clock.
- A worn pinion made the machine noisy and slow.
