simpleMeaning: A long-lived sedge found in many lands, with small nut-like tubers that can be eaten.
scope: 'Also called nut grass, nut sedge, nutgrass and nutsedge: a long-lived sedge found in many lands,
  with small nut-like tubers that can be eaten, distinct from sedges with tubers people cannot eat.'
examples:
- Cyperus rotundus grows in many lands, its small tubers fit to eat.
- Gardeners pull up Cyperus rotundus wherever it spreads.
