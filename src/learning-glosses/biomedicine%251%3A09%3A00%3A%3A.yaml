simpleMeaning: The part of medical science that studies how living things withstand hard conditions, such
  as travel in space.
scope: The part of medical science that studies how living things withstand hard conditions, such as travel
  in space, not the part that puts what is known about living things and how their bodies work to use
  in treating patients.
examples:
- She studied biomedicine to learn how the body copes with space travel.
- Biomedicine helps doctors keep astronauts healthy in orbit.
