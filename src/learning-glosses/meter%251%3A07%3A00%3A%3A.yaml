simpleMeaning: a regular beat in music that comes from cutting it into parts of the same length in time
scope: This sense is also called time, and another name for it is metre; it is the beat in music, not
  a tool for measuring and not a unit of length.
examples:
- The meter of the song made it easy to dance to.
- She counted the meter in her head as the band played.
