simpleMeaning: Most often made of several sweet drinks poured with care so they stay in their own layers,
  this small drink is taken after dinner
scope: A small sweet drink taken after dinner, most often several sweet drinks in separate layers, not
  a drink taken with a meal and not a single mixed drink.
examples:
- After dinner, he ordered a pousse-cafe, its coloured layers still unmixed.
- She poured the pousse-cafe with care so the sweet drinks stayed in separate layers.
