simpleMeaning: any of several kinds of large sea snail that people eat, of the kind called Haliotis, with
  an ear-shaped shell that is shiny like a pearl inside
scope: Any of several kinds of large sea snail that people eat, with an ear-shaped shell that is shiny
  like a pearl inside; not a clam, and not a land snail.
examples:
- The divers gathered abalone from the rocks at low tide.
- Abalone soup was the best dish on the menu.
