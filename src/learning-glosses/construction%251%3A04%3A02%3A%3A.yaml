simpleMeaning: In geometry, the act of drawing an extra line, circle or other figure that meets set conditions
  to help solve a problem or prove a theorem.
scope: This is the geometric drawing step, not the general act of building something, not a group of words
  that forms a unit of a sentence, not the mental creation of a whole from combined ideas, not a built
  object or structure, not an interpretation of a text or action, and not the building industry or the
  work of repairing and putting up structures.
examples:
- The proof began with a construction that drew a line through a given point parallel to another line.
- Her solution used a construction of two circles to show where the triangle's centre must lie.
