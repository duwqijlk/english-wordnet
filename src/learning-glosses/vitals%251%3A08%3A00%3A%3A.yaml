simpleMeaning: an organ in the body that a person needs in order to live
scope: An organ the body needs in order to live, such as the heart or the lungs; not a part of the body
  a person can live without.
examples:
- The heart is one of the vitals, because the body cannot live without it.
- Doctors checked that none of his vitals had been hurt in the crash.
