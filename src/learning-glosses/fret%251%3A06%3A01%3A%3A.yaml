simpleMeaning: A decorative pattern of repeated up-and-down and side-to-side lines, often raised from
  the surface
scope: A decorative pattern of straight lines crossing each other; not the metal bar on a stringed instrument.
examples:
- There was a simple fret at the top of the walls.
- The fret of lines ran round the edge of the vase.
