simpleMeaning: A cancer of the tissues that make blood, in which white blood cells grow in great numbers
  without control, one of the four main kinds of cancer.
scope: A cancer of the blood-making tissues, also called leukemia, cancer of the blood, or leucaemia.
examples:
- Leukaemia is a cancer of the blood-making tissues.
- She was treated in hospital for leukaemia.
