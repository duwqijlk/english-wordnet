simpleMeaning: a sweet fruit from China, with soft flesh like jelly inside a thin shell that breaks easily,
  round a single seed, and often dried
scope: 'Also called lychee, leechee, lichee, lichi, litchee, and litchi nut: a sweet Chinese fruit with
  a thin shell and soft flesh round one seed, not a real nut, not a fruit with many seeds, and not the
  tree it grows on.'
examples:
- He bought a bag of litchis for dessert.
- The litchi shell cracked open to show the sweet flesh inside.
