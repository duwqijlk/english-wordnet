senseId: 'refuse%2:40:01::'
synsetId: 02217607-v
simpleMeaning: to keep something back from someone who wants it
scope: Withholding something from someone who asks for it, not turning a person away at a door and not
  rejecting an idea as untrue; deny is another name for this sense.
examples:
- She refused him the money he asked for.
- They refused the children any sweets before dinner.
