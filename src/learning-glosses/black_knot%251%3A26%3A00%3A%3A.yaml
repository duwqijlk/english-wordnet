simpleMeaning: A disease of plum and cherry trees that shows as dark lumps on the branches.
scope: A disease of plum and cherry trees that shows as dark lumps on the branches; not a disease of apple
  trees and not a harmless bump on the bark.
examples:
- Black knot swelled the branches of the old plum tree.
- Prune out black knot before it spreads.
