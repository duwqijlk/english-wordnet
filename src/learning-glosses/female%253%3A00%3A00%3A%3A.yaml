simpleMeaning: in plants and animals, of the sex that makes eggs which can be fertilized and grow into
  young
scope: The biological sex that produces eggs, not the sense meaning typical of women or the sense meaning
  consisting of women and girls.
examples:
- The female flowers are small and green.
- A female frog lays hundreds of eggs at once.
