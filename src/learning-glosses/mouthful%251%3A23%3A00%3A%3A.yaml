simpleMeaning: as much as fits in the mouth at one time
scope: As much food or drink as fits in the mouth at one time; not a bite taken with the teeth and not
  a full meal.
examples:
- He took a mouthful of soup and smiled.
- She chewed a large mouthful of bread slowly.
