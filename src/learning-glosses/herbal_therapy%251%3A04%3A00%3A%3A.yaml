simpleMeaning: Illness is treated with plants or parts taken from plants, most often plants that are not
  part of what people eat each day
scope: Treating illness with plants or parts taken from plants, also called botanical medicine and phytotherapy,
  most often with plants that are not part of what people eat each day, not treatment with drugs made
  in a lab and not a change of diet.
examples:
- She tried herbal therapy for her headaches, using teas made from leaves and roots.
- The clinic offers herbal therapy with roots and bark that patients would not eat as food.
