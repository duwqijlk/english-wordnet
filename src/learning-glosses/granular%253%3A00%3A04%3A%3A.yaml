simpleMeaning: made up of small bits, like a chondrite, a rock from space that is made up of small round
  bits
scope: This is about the small bits a thing is made up of, like the bits in that rock from space; it is
  not the sense about being made of or covered with bits that feel like ground grain.
examples:
- Under a microscope, the stone had a granular structure like a space rock.
- The scientist called the meteorite granular because of the small round bits inside it.
