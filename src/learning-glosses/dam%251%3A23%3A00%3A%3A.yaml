simpleMeaning: a unit of length in the metric system (the measuring system that uses meters), equal to
  ten meters
scope: This is a measure of length; it is not the strong wall built to hold back water.
examples:
- The rope measures 2 dam, which is twenty meters long.
- The field is 5 dam across, which is fifty meters.
