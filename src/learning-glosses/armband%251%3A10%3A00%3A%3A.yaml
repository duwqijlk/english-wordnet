simpleMeaning: a band round the arm that tells others who you are, or that you are grieving for the dead
scope: A band on the arm that marks who you are or that you are in mourning, not a bracelet worn for show
  and not a sleeve.
examples:
- The usher wore an armband so people knew he was staff.
- She wore a black armband after her father's death.
