simpleMeaning: the last part of the blood vessel that runs through the face
scope: The last part of the blood vessel in the face, also called the angular artery, not the main vessel
  itself and not a vein in the face.
examples:
- The arteria angularis is the last part of the facial blood vessel.
- The surgeon tied off the arteria angularis.
