simpleMeaning: a thing that is twisted and tight and swollen, such as a tight lump in a muscle or a clenched
  fist
scope: A twisted, tight, swollen thing, not a tied rope and not a hard piece of wood.
examples:
- His muscles stood out in knots after the climb.
- Her stomach was in knots before the exam.
