simpleMeaning: Each of these units stands for the blast of a million loads of TNT, and atom-bomb blasts
  are counted in them.
scope: The blast of an atom bomb is counted in these units, not the weight of the bomb.
examples:
- The blast was counted as two megatons.
- They spoke of the blast in megatons.
