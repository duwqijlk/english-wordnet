simpleMeaning: in architecture, a square pillar whose top is carved into a person, head-and-shoulders
  figure, or animal, first used in ancient Rome to mark a boundary
scope: This is the carved pillar, not a word or expression used for a particular thing, not a limited
  stretch of time, and not one of the quantities in a polynomial.
examples:
- A marble term, its bearded face worn smooth, still marks the old estate boundary.
- The architect placed a term at each corner of the terrace, copying a Roman design.
