simpleMeaning: a way of studying a piece of writing by looking close at small parts to show how it is
  built and what it means
scope: A close look at small parts of a work to show how it is built and what it means, not a short summary
  and not a judgment of whether it is good.
examples:
- The class used explication de texte to study the poem line by line.
- Her explication de texte showed how the short story's parts fit together.
