simpleMeaning: A perennial Eurasian plant with pale pink blooms and curved pods, now wild in chalky grassland
  across Britain and North America; grown in Britain for fodder and honey.
scope: Despite its name, this is the fodder and honey plant with pink flowers and curved pods, not the
  common white or red clover.
examples:
- Holy clover was once grown widely on chalky farms.
- The bees worked the holy clover along the field edge.
