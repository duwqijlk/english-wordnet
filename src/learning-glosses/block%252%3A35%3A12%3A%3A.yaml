simpleMeaning: To stop something from passing along a path, for example by putting an object in it.
scope: Stopping movement along a path or way; not making a place unfit for use, not stamping a book cover,
  and not forming something into solid pieces.
examples:
- Fallen rocks blocked the path for two days.
- He blocked the doorway with a heavy chair.
