simpleMeaning: having the skill and ideas in yourself to deal well with hard problems, in smart and new
  ways
scope: This describes a person who can deal well with hard problems in new ways, not a person who only
  has many things to use.
examples:
- The resourceful cook made a good meal from the few foods she had.
- A resourceful leader found a way to cross the river when the bridge broke.
