simpleMeaning: Something left out of a written passage after an editor has cut it down.
scope: Something left out of a written passage after an editor has cut it down, also called a cut or an
  excision; not the loss of letters from a chromosome in genetics, not sounds or words left out of speech,
  and not the act of deleting something written or printed.
examples:
- The deletion upset the young author, who liked the passage as it was.
- Both sides agreed on the deletion of the clause.
