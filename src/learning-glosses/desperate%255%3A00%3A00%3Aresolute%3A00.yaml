simpleMeaning: Utterly determined and unwilling to give up.
scope: 'Another name for do-or-die: utterly determined and refusing to give up, not extreme courage in
  a last-resort action and not urgent need.'
examples:
- The defenders were desperate and refused to give up the bridge.
- The revolutionaries were a desperate band, ready to die for their cause.
