simpleMeaning: In logic, to reach a firm answer by reasoning from what is known.
scope: This is reaching a conclusion by reasoning in logic; not a guess, and not working something out
  from clues in everyday life.
examples:
- From these two facts, we can deduce that the third must also be true.
- In class, they deduced the answer step by step from the rules.
