simpleMeaning: In a court of law, to state formally the punishment that someone is to receive.
scope: This is the verb for a judge declaring a punishment in court, not the judgment itself, not the
  time a prisoner serves, and not a string of words that forms a grammatical unit.
examples:
- The judge sentenced him to five years in prison.
- She was sentenced to two hundred hours of community service.
