simpleMeaning: Cause a sudden and usually harmful effect on someone or something.
scope: This is not a planned attack, a musical note or unwanted sexual attention; it is a sudden harmful
  effect, as from illness or a recession.
examples:
- The disease hit the village hard that winter.
- Just as sales were recovering, the recession hit.
