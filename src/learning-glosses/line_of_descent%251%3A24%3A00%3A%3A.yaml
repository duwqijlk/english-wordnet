senseId: 'line_of_descent%1:24:00::'
synsetId: 13835254-n
simpleMeaning: 'Parents, grandparents, and the family members before them: the blood tie that joins a
  person to them'
scope: 'Also called descent, filiation and lineage: the blood tie between a person and the people they
  come from, not a family tree drawn on paper and not a list of children.'
examples:
- Her line of descent runs back to the first settlers.
- He traced his line of descent through his mother's family.
