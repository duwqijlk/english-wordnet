simpleMeaning: a first remark in a talk, said to put the speaker ahead of the other side
scope: A first remark meant to win an edge in a talk, not a trick played later and not a plan laid out
  in full.
examples:
- His opening ploy was to praise the other side before asking for more.
- Her first ploy was a kind word about the host, meant to win him over.
