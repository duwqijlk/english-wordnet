simpleMeaning: A hired worker who tends cattle and does other work on horseback.
scope: This is a hired worker on horseback who tends cattle, not a farm owner or a herder on foot; also
  called cowherd, cowhand, cowpuncher, and puncher.
examples:
- The cowpoke saddled his horse at sunrise.
- A cowpoke drove the cattle to the river.
