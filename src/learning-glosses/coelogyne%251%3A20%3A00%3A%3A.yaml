simpleMeaning: A genus of orchids (a plant group) bearing fragrant lacy snow-white clusters, single salmon-pink
  blooms, chains of golden-brown and chocolate-brown blooms, spice-scented white flower spikes and emerald
  blooms marked blue-black.
scope: This is the whole genus and its range of flower forms, not one particular species and not a single
  orchid plant.
examples:
- Our coelogyne flowered in long chains of brown and gold.
- A coelogyne with snow-white clusters hung above the greenhouse path.
