synsetId: 08086178-n
simpleMeaning: Goods are put into boxes or wrappings by this firm so they can be sold, sent away or kept
scope: 'Another name for this sense is packaging company: goods are put into boxes or wrappings for sale,
  sending or keeping, not goods made by a firm that sells them and not goods that are only moved.'
examples:
- The packaging concern packed the machine parts in wood and paper for the ship.
- A packaging concern takes goods in bulk and puts them into boxes ready for the shops.
