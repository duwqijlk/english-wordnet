simpleMeaning: a long horizontal pole that athletes grip and swing on while doing gymnastics
scope: 'The gymnastics apparatus sense: a pole athletes grip during routines, not a fastener, goal crossbar,
  drink counter, heating element, railing, solid block of soap or wax, submerged river or shore ridge,
  pressure unit, or act of blocking.'
examples:
- She pulled herself up onto the bar and held the pose.
- The coach lowered the bar before the young gymnast tried the routine.
