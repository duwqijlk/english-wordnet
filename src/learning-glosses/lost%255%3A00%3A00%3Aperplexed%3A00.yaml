simpleMeaning: confused by many situations or statements that conflict with each other, and left unable
  to think clearly
scope: This is about a confused mind, not about being unable to find your way or about something missing.
examples:
- After three contradictory briefings, she felt completely lost.
- He looked lost among the conflicting advice from his doctors.
