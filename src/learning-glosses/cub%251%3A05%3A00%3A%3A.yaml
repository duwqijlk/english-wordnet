simpleMeaning: the young of some meat-eating animals that feed their babies with milk, such as the bear,
  wolf, or lion
scope: A baby bear, wolf, or lion, or an animal like them, not a grown animal of those kinds.
examples:
- The bear cub stayed close to its mother.
- A lion cub was born at the zoo.
