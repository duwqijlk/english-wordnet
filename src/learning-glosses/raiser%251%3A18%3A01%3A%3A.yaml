simpleMeaning: In the card game bridge, a partner who makes a higher bid than the bid made by their partner
scope: In bridge, this is the partner who bids higher; it is not a person who grows animals and not a
  person who collects money for a cause.
examples:
- As the raiser, she raised her partner's bid to three hearts.
- The raiser made a higher bid after his partner opened the bidding.
