simpleMeaning: to make something by rubbing one thing hard against a surface and taking small bits away
scope: This is making something by rubbing hard against a surface, not the rough sound of rubbing, not
  a hurt place on the skin, and not a deep bow.
examples:
- They scraped a letter into the stone.
- He scraped a hole in the wood with a knife.
