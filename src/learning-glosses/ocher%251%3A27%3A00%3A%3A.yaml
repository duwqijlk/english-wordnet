simpleMeaning: any of several kinds of earth with silica, alumina, and ferric oxide in them, used to give
  colour to paint and other things
scope: 'Also called ochre: a kind of earth used to give colour, not the yellow-orange colour itself that
  this earth can give.'
examples:
- The artist mixed ocher with oil to paint the dry hills.
- They dug ocher from the ground to use as a natural colour.
