senseId: 'beat%2:36:05::'
synsetId: 01730756-v
simpleMeaning: To set up a regular pulse with a series of repeated blows.
scope: This is making a musical pulse by repeated hits, not the plain act of hitting something repeatedly,
  not giving someone a beating as punishment or attack, not moving in a rhythmic way, not merely making
  a rhythmic sound, not shaping metal by hammering, not signalling with fingers or drumsticks, not striking
  one's own body in emotion, not stirring food vigorously, not making something by pounding or trampling,
  not striking water or bushes to rouse animals, not defeating an opponent, not glaring or striking with
  great intensity, and not sailing against the wind.
examples:
- The drummer beat a steady rhythm on the snare drum.
- She beat a lively rhythm on the bongos to accompany the dancers.
