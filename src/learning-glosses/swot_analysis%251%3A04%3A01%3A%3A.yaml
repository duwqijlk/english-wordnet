simpleMeaning: A set way of planning that looks at the strong points, weak points, chances and dangers
  in a plan or a business task.
scope: 'Also called SWOT matrix: a set way of planning that weighs strong and weak points with chances
  and dangers, not the plan itself and not a way of carrying out the work.'
examples:
- We did a SWOT analysis before we started the new shop.
- A SWOT analysis helped the team see its weak points.
