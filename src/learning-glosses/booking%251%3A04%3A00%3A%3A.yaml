simpleMeaning: the act of keeping a place or a seat on a journey for someone, or of getting a person or
  group to do work for you
scope: 'Also called a reservation: keeping a place or a seat on a journey, or getting a person or group
  to do work for you. It is not a job for performers that lasts for a short time only.'
examples:
- She made a booking for a table for four at seven.
- The hotel lost our booking, so we had to find another room.
