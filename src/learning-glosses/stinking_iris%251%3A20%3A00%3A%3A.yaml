simpleMeaning: Its leaves smell bad, but this iris from the south and west of Europe and North Africa
  bears purple blooms.
scope: Gladdon, gladdon iris, roast beef plant, and stinking gladwyn are other names for this bad-smelling
  iris with purple blooms from the south and west of Europe and North Africa.
examples:
- The stinking iris bears purple blooms above leaves that smell bad.
- In the south of Europe, stinking iris grows with purple blooms and leaves that smell bad.
