simpleMeaning: a pretty flat shape made of a line that winds round a middle point, getting farther from
  it as it goes
scope: A pretty flat shape winding round a middle point and getting farther from it, not a line on a tube
  and not a thing wound into loops.
examples:
- The spiral on the vase winds out from its middle.
- She drew a spiral on the tile, wider with each turn.
