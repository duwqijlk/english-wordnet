simpleMeaning: a nut you can eat, from one of the trees of the group called Castanea
scope: A nut you can eat, from a tree of the group called Castanea; not the tree itself, not the hard
  spot on a horse's leg, and not the wood or the brown colour.
examples:
- She roasted a chestnut over the fire.
- Chestnuts fell from the tree in autumn.
