senseId: 'lambast%2:32:00::'
synsetId: 00826456-v
simpleMeaning: To scold hard, in anger.
scope: This sense is also called jaw, rag, lecture, scold, chide, rebuke, berate, reprimand, trounce,
  remonstrate, and lambaste, for scolding hard, in anger, where jaw is speaking to someone in a harsh,
  angry way to show strong disapproval, rag is telling a person off in a hard and angry way for what they
  did, lecture is telling a person off in a hard, angry way for what they did, scold is telling someone
  off in a hard and angry way, chide is speaking to a person in a hard and angry way, showing strong disapproval
  of what they did, rebuke is blaming a person to their face in angry words when they did wrong, berate
  is blaming a person in an angry voice for what they did, with words that are hard and sharp, and reprimand
  is blaming a person hard and angrily for something they did wrong.
examples:
- They lambasted him, scolding hard.
- Lambasting scolds hard, in anger.
