simpleMeaning: in the muscle coat of the food pipe, stomach, and gut, a web of bare nerve threads and
  nerve cell bodies after the nerve knots, acting on its own
scope: Also called the myenteric plexus; a nerve net in the gut wall, not the nerves of the brain or spinal
  cord.
examples:
- The plexus myentericus helps move food along the gut.
- Damage to the plexus myentericus can slow the stomach.
