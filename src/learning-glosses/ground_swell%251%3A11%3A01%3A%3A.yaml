simpleMeaning: A clear change in what many people think or feel about politics, coming with no leader
  and no open show of it.
scope: A clear change in what many people think or feel about politics, with no leader and no open show
  of it, not a change led by one strong leader and not a sudden crowd protest.
examples:
- There was a ground swell of feeling against the war.
- A ground swell of support carried the new party into office.
