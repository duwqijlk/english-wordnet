simpleMeaning: A loud low warning sound that ships stuck in fog can hear.
scope: A loud low warning sound that ships stuck in fog can hear, also called a foghorn; not a warning
  light and not a signal for ships in clear weather.
examples:
- The fogsignal sounded as the ship crept through the fog.
- Ships stuck in fog listen for the fogsignal.
