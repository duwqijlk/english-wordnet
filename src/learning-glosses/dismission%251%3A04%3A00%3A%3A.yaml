simpleMeaning: a person whose job has ended and who is free to leave
scope: A person whose job has ended and who is free to leave; discharge, dismissal, firing, liberation,
  release, sack and sacking are other names for this, not a holiday and not a move to a new job.
examples:
- His dismission came after the factory closed, and he was free to leave.
- The letter gave the date of her dismission from the firm.
