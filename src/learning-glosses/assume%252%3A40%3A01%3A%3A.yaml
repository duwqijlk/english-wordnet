simpleMeaning: To agree to pay costs or debts that originally belonged to someone else.
scope: 'Another name for bear, accept or take over in this sense: agreeing to pay another person''s costs
  or debts, not seizing power, taking a post, or supposing something true.'
examples:
- When her father died, she assumed his outstanding debts.
- The buyer assumed the mortgage along with the house.
