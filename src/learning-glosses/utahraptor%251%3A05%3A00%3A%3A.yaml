scope: 'Also called superslasher: a swift flesh-eating dinosaur with a long upright claw on each back
  foot, not a slow plant-eater and not a small dinosaur of a later age.'
examples:
- The utahraptor hunted with the long claw on each back foot.
- A utahraptor skeleton shows the upright claw on each back foot.
