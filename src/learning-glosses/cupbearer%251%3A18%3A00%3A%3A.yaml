simpleMeaning: a worker, usually an officer, in the home of a man of high rank, whose job is to fill cups
  with wine and serve them
scope: This sense is the person in a man of high rank's home whose job is to serve wine, not a cup itself
  and not a person who only drinks wine.
examples:
- The king's cupbearer filled the cup and handed it to him.
- The cupbearer stood ready to serve more wine at the feast.
