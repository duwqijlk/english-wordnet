simpleMeaning: The simplest ring-shaped chemical, a clear liquid of hydrogen and carbon, catches fire
  fast and can cause cancer.
scope: Also called benzene and benzine, this clear liquid is the simplest of its ring-shaped kind and
  catches fire fast.
examples:
- The benzol in the jar was a clear liquid.
- Benzol catches fire fast, so it was stored away from heat.
