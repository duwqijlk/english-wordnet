simpleMeaning: High blood pressure and a weak heart that cannot pump well are treated with this drug,
  sold as Apresoline, which opens up blood tubes, often with a water pill.
scope: Apresoline is the trade name for this drug, which opens up blood tubes to treat high blood pressure
  and a weak heart.
examples:
- Hydralazine lowered the high blood pressure.
- The weak heart pumped better after hydralazine.
