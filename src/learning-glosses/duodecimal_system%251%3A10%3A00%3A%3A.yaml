simpleMeaning: a counting method in which the place of a digit gives its value, based on twelve, using
  digits for twelve values
scope: A counting method based on twelve, also called the duodecimal number system; not the ten-based
  way of counting and not a way of writing numbers in words.
examples:
- The duodecimal system counts in twelves.
- She explained the duodecimal system to the class.
