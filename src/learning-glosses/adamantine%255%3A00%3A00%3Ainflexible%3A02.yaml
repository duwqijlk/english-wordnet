senseId: adamantine%5:00:00:inflexible:02
synsetId: 01028427-s
simpleMeaning: Not to be moved by pleas, by talk meant to persuade, by what people ask, or by good sense.
scope: Also called adamant, inexorable, or intransigent; not to be moved by pleas or reason, not made
  of or hard like adamant.
examples:
- He was adamantine in his refusal to change his mind.
- She stayed adamantine, and no plea could move her.
