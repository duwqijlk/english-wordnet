simpleMeaning: having eyes that are partly closed, as when you look at strong light
scope: Eyes that are partly closed, not a look sent to one side with doubt or envy.
examples:
- His squinty eyes showed that he had been looking into the sun.
- She gave a squinty look in the strong light by the window.
