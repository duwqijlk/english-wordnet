simpleMeaning: A place kept for someone to sit, for example in a theater, on a plane, or on a train.
scope: Not 'a chair or other piece of furniture,' not 'the part of a chair you sit on,' not 'the buttocks
  or the cloth covering them,' not 'a center of authority or the place where something is based,' not
  'a right to be a member of a body,' not 'a part of a machine,' and not the verb senses such as 'to show
  someone to a chair.'
examples:
- Our seats for the concert were in the third row.
- He booked a seat by the window on the morning train.
