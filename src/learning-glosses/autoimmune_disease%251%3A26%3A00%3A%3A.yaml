simpleMeaning: one of a large group of illnesses in which the body's defence system goes wrong and attacks
  the body's own tissue
scope: Also called autoimmune disorder; an illness in which the body's defence system attacks its own
  tissue, not an illness caught from germs and not an allergy.
examples:
- In an autoimmune disease, the body's defence system attacks its own tissue.
- Doctors treat autoimmune disease by calming the body's defence system.
