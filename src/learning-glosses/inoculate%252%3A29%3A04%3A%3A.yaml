simpleMeaning: to put a virus or the germ that causes a sickness into a body so that the body is protected
  against that sickness
scope: This is putting a virus or germ into a body to protect it against a sickness, not putting a bud
  into a plant to help it grow.
examples:
- The doctor inoculated each child with a weak form of the germ to protect them from the sickness.
- Farmers inoculate their animals so the animals do not get the sickness.
