simpleMeaning: To do with bromine, or holding bromine, chiefly bromine in its five-bond form.
scope: To do with bromine, chiefly in its five-bond form; not to do with bromine in a lower form and not
  hydrobromic acid.
examples:
- Bromic acid holds bromine in its five-bond form.
- They tested the sample for bromic salts in the lab.
