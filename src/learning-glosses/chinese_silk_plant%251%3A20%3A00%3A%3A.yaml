simpleMeaning: A tall herb living many years, of tropical Asia, with dark green leaves, grown for the
  fibre from its woody stems, which is like flax.
scope: Also called ramee, ramie, Boehmeria nivea, and China grass; a tall herb of tropical Asia grown
  for the fibre from its woody stems, like flax.
examples:
- The Chinese silk plant grows in the field.
- They make cloth from Chinese silk plant fibre.
