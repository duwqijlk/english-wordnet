simpleMeaning: The dead bodies of animals are hung from this strong pointed piece of metal
scope: A strong pointed piece of metal for hanging the dead bodies of animals, not a hook for clothes
  and not a tool for lifting.
examples:
- The butcher hung the carcass from a meat hook.
- Meat hooks lined the cold room wall.
