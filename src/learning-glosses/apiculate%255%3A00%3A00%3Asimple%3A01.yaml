simpleMeaning: a leaf shape with a short, sharp tip at the end
scope: A leaf shape that ends in a short sharp point, not one that ends in a long point and not a rounded
  leaf tip.
examples:
- The apiculate leaves of the plant end in tiny sharp points.
- Botanists call a leaf apiculate when its tip is short and sharp.
