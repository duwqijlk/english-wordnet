simpleMeaning: to make someone pay a sum of money as a punishment, the sum set as the court sees fit
scope: This is making someone pay a sum of money as a punishment, with the sum set as the court sees fit,
  and not a fixed fine set by law or a prison sentence.
examples:
- The court amerced him for breaking the rules.
- The judge amerced the merchant a large sum for the offence.
