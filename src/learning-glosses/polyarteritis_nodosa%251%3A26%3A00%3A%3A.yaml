simpleMeaning: A sickness that slowly gets worse, making small lumps grow along the arteries in the body's
  joining tissue; a lump may shut an artery and starve that part of blood
scope: 'Also called periarteritis nodosa: a slow disease of the joining tissue that makes lumps along
  the arteries, not a sudden burst artery and not a skin rash.'
examples:
- Polyarteritis nodosa can block the small arteries that feed the kidneys.
- The doctors found polyarteritis nodosa when lumps showed along the arteries.
