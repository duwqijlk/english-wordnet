simpleMeaning: a small part of a chemical stuff, made of carbon and nitrogen joined together, with one
  free link to join to something else
scope: 'Also called cyanide radical, cyano group and cyano radical: this is one small part inside a chemical
  stuff, not the whole chemical stuff itself.'
examples:
- The cyanide group -CN links to other parts of the molecule.
- Chemists spot the cyanide group in the structure of the chemical.
