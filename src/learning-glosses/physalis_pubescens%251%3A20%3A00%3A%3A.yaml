simpleMeaning: A showy American plant that lives for one year, with round soft yellow berries shut inside
  a thin bag like a bladder.
scope: Also called downy ground cherry and strawberry tomato; a showy one-year American plant, set apart
  from other ground cherries by its yellow berries shut inside a thin bag.
examples:
- Physalis pubescens grew by the fence with its yellow berries.
- The berries of Physalis pubescens hung in their thin husks.
