simpleMeaning: Berries good to eat follow small orange or yellow flowers on a small tree or prickly bush
  common across central Argentina
scope: Also called chanal, this small tree or prickly bush of central Argentina bears small orange or
  yellow flowers and then berries people can eat.
examples:
- We saw a chanar in central Argentina with small yellow flowers.
- The chanar flowers had given way to berries we could eat.
