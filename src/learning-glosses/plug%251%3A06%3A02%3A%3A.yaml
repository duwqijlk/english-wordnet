simpleMeaning: a part in an engine that fits into the top of the engine and makes an electric spark to
  set the fuel gas alight
scope: The engine part that makes a spark; not the part you push into a wall socket to get power, and
  not a thing used to fill a hole.
examples:
- A bad spark plug made the car hard to start.
- He took out each spark plug and cleaned it.
