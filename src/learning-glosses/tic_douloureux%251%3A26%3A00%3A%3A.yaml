simpleMeaning: very bad pain that comes in short sudden bursts along the nerve in the face
scope: This is sudden, very bad pain that comes in short bursts along the nerve in the face; trigeminal
  neuralgia is another name for this sense. Not a headache and not a steady toothache.
examples:
- Her tic douloureux struck in sudden bursts of pain across her cheek.
- The doctor said the tic douloureux came from the nerve in his face.
