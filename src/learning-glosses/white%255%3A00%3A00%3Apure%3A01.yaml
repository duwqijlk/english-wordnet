simpleMeaning: 'Morally spotless and unsullied: without any stain of wrongdoing or moral blemish.'
scope: This is a literary, rather dated use for moral purity, found mostly in older writing and in fixed
  images such as a knight in shining white armour or the phrase 'whiter than white'. It is not the ordinary
  colour sense of white, and it is not the sense meaning blank or not written on.
examples:
- In the old romance, the knight in shining white armour was a man without sin.
- The hymn speaks of a soul made whiter than white.
