simpleMeaning: A state with extra energy in a tiny piece of matter that stays whole, when it takes in
  far more light and other unseen rays than usual
scope: This is the state of a tiny piece of matter with extra energy, not a large shaking made by a small
  shaking, not the quality of a voice, and not a loud deep sound.
examples:
- Scientists saw a resonance when the particle took in much more light at one energy.
- The resonance showed as a sharp peak on the chart when the particle had extra energy.
