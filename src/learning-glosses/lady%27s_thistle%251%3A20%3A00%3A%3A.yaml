simpleMeaning: a tall Old World thistle living for two years, with big white-marked leaves that clasp
  the stem and purple flower heads, now growing wild in California and South America
scope: 'Also called blessed thistle, holy thistle, and milk thistle: a tall thistle with white-marked
  leaves and purple flower heads, not a garden flower and not a thistle grown for food.'
examples:
- The lady's thistle in the field had purple flower heads.
- Lady's thistle now grows wild across parts of California.
