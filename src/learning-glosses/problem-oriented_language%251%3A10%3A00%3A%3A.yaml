simpleMeaning: A way of putting things in the words the person using it already knows
scope: A way of putting things in the words the person using it already knows; application-oriented language
  is another name for this sense, not a language that uses only short codes and symbols.
examples:
- The new problem-oriented language lets doctors write rules in medical words.
- She learned the problem-oriented language quickly because its words matched her own.
