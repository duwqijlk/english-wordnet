simpleMeaning: Changed in how well it fits or how it looks, especially when said of clothes
scope: This sense is about clothes, especially, whose fit or style has been changed; it is not a thing
  changed to fit a need in general, and not a person who stays calm in daily life.
examples:
- She wore an adjusted dress that now fitted her well.
- The adjusted coat hung better after its sleeves were made shorter.
