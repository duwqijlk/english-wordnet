simpleMeaning: A showy plant that loses its leaves yearly, a cross of two kinds from southeastern Asia
  and Hawaii, with bunches of flowers that shade from cream through orange to red.
scope: A showy plant with flower bunches that shade from cream to red, also called a rainbow shower.
examples:
- The Cassia javonica outside the school was covered in orange flowers.
- We planted a Cassia javonica for its long bunches of cream and red flowers.
