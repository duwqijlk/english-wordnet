simpleMeaning: the long, narrow ground that a small river flows in, or used to flow in
scope: This is the ground that a small river flows in, or used to flow in, not the water in the river
  itself.
examples:
- The streambed was dry in summer, with no water left in it.
- Small stones covered the streambed under the clear water.
