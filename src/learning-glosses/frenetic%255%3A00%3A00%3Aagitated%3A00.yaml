simpleMeaning: very upset and unable to stay calm, full of fear or another very strong feeling
scope: Also called frantic, frenzied, and phrenetic. This means very upset and unable to stay calm because
  of fear or another strong feeling, not just busy or excited.
examples:
- Frenetic screams followed the accident as people ran in fear.
- She was frenetic with worry while she waited for news of her son.
