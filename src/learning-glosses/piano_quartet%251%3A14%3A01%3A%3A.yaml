simpleMeaning: Four people play music together, one at a keyboard, one with a violin, one with a viola,
  and one with a cello
scope: Four people who play music together, not three and not five, and not a group that plays without
  a keyboard.
examples:
- The piano quartet played four short pieces at the concert.
- She joined a piano quartet as its cello player.
