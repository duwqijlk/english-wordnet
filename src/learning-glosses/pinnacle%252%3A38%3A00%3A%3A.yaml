simpleMeaning: to lift or put something up high, as if on the top point of a tower
scope: To lift or place something high, as if on a tower top; not the thin pointed part on top of a tower,
  and not putting a top part on something.
examples:
- The builders pinnacled the statue on the highest roof of the hall.
- Lifted on strong shoulders, the singer felt pinnacled high above the crowd.
