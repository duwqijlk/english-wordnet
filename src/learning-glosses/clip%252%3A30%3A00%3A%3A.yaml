simpleMeaning: to end something early, or to make it shorter than it was meant to be
scope: To end or shorten something early, not to cut something off with a tool and not to run at a fairly
  fast pace.
examples:
- The teacher clipped the lesson short because time was running out.
- They clipped his speech to five minutes so everyone could speak.
