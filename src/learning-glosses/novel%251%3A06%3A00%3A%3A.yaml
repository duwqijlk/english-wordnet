simpleMeaning: a long made-up story made as a printed book with its pages held together
scope: This sense names the printed book itself that you can hold. The other novel sense names the long
  made-up story as a work of writing, apart from any one book.
examples:
- She put the novel back on the shelf next to the other printed books.
- He bought a thick novel at the shop and carried it home in his bag.
