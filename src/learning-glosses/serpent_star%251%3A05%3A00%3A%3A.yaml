simpleMeaning: An animal with breakable whip-like arms spreading out from a small round centre
scope: 'Also called a brittle-star or a brittle star: an animal with breakable whip-like arms spreading
  out from a small round centre, not a sea urchin.'
examples:
- The serpent star waved its thin arms.
- A serpent star clung to the rock under the sea.
