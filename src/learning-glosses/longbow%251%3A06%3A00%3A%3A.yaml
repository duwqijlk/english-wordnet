simpleMeaning: Used in England in the Middle Ages, this strong wooden bow, usually five to six feet long,
  was pulled back by hand.
scope: A strong wooden bow pulled by hand, usually 5 to 6 feet long and used in England in the Middle
  Ages; not a short bow and not a modern bow for sport.
examples:
- The archer drew his longbow and aimed at the target.
- English soldiers carried longbows into battle.
