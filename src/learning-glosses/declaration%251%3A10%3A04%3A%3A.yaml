simpleMeaning: The winning bid in the card game of bridge, fixing the number of tricks the bidder has
  to win
scope: In bridge, this is the top bid that fixes how many tricks the bidder must win, also called contract,
  not a strong plain statement, not a list of goods for tax or duty, and not a statement given in law.
examples:
- The declaration set the contract at four hearts.
- Her declaration won the bidding.
