senseId: 'collectivist_anarchism%1:09:01::'
synsetId: 92438778-n
simpleMeaning: a belief in great change that calls for doing away with both the state and private ownership
  of the things used to make goods
scope: A belief in doing away with the state and private ownership of the means of making goods; anarcho-collectivism
  is another name for this sense; not a belief in keeping the state, and not a belief in one person owning
  all.
examples:
- Collectivist anarchism calls for workers to own the farms and factories together.
- Under collectivist anarchism, no one person would own the land.
