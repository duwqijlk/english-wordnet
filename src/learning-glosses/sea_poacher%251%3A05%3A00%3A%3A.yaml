simpleMeaning: With its body covered in hard bony plates, a small thin fish, no more than 8 inches long,
  living mostly in the deep waters of the north Pacific
scope: Poacher and sea poker are other names for this small thin fish with its body covered in bony plates.
examples:
- The sea poacher swam in the deep north Pacific water.
- We saw a sea poacher with bony plates in the deep water.
