simpleMeaning: Through a hormone upset or hormone treatment, someone takes on male traits.
scope: Also called masculinize, masculinise, and virilise, this is a change in which someone takes on
  male traits through a hormone upset or hormone treatment.
examples:
- The medicine virilized her, giving her male traits.
- A hormone upset can virilize a young woman.
