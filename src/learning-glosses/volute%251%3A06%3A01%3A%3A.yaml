simpleMeaning: A flat ornament like a curl that turns round and round a centre, each turn farther out
  than the last.
scope: 'Also called a spiral: a flat ornament like a curl that turns round and round a centre, each turn
  farther out than the last, not a solid form built by winding one thing in a long run of loops.'
examples:
- The volute on the column curled round and round its centre.
- They carved a volute into the top of the pillar.
