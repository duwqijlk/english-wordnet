senseId: 'accent%2:32:00::'
synsetId: 00985365-v
simpleMeaning: to say a word or part of a word with more force, or to say it with a way of speaking that
  marks you out
scope: 'Also called stress: to give more force to a word when you say it, not the written mark over a
  letter and not the way a person speaks.'
examples:
- In Farsi, you accent the last syllable of each word.
- She accented the first word to make her point clear.
