simpleMeaning: A small sheet of film holding pictures of many pages, read through a viewer that makes
  them bigger.
scope: A sheet of microfilm on which many pages have been photographed, read with a viewer that makes
  them bigger.
examples:
- The library kept old newspapers on microfiche in the back room.
- She read the microfiche through a viewer that made the pages big enough to see.
