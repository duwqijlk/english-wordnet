simpleMeaning: a lung illness in which the walls of the smallest air tubes swell up suddenly and are sore
scope: This is a lung illness in which the walls of the smallest air tubes swell up suddenly and are sore;
  bronchial pneumonia is another name for it, not a common cold and not bronchitis.
examples:
- Bronchopneumonia kept him in hospital for a week.
- The doctor treated the child for bronchopneumonia.
