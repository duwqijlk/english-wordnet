simpleMeaning: a drug that stops a person feeling things in the body for a short time
scope: 'Also called anaesthetic, anesthetic and anesthetic agent: a drug that takes feeling away for a
  short time, not a drug that kills germs and not a painkiller taken by mouth.'
examples:
- The nurse gave the patient an anaesthetic agent before the operation.
- The anaesthetic agent made his arm numb for an hour.
