simpleMeaning: the group of players in an orchestra who play instruments such as violins, violas, cellos
  and double basses
scope: This is the group of players in an orchestra who play violins, violas, cellos and double basses;
  not thin cords used for tying things.
examples:
- The strings played a soft tune while the rest of the orchestra stayed quiet.
- In the last part, the strings were louder than all the other players.
