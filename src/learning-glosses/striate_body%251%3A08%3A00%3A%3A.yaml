simpleMeaning: a striped lump of white and grey brain matter in front of the thalamus, a deep relay, in
  each half of the brain, made of the caudate and lenticular nuclei
scope: 'Also called corpus striatum and striatum: a striped lump of brain matter, not the thalamus itself
  and not the outer covering of the brain.'
examples:
- The striate body helps control movement.
- Signals pass through the striate body on their way through the brain.
