simpleMeaning: an animal of the ocean with a round body and long lines of tiny hairs
scope: An ocean animal with a round body and long lines of tiny hairs; not a jellyfish and not a fruit.
examples:
- The sea gooseberry drifted past, its rows of hairs shimmering in the light.
- A sea gooseberry moved slowly through the bay, its tiny hairs beating.
