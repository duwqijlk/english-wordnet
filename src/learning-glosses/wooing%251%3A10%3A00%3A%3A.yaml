senseId: 'wooing%1:10:00::'
synsetId: 07203345-n
simpleMeaning: A man's act of trying to win a woman's love, usually in the hope that she will marry him
scope: A man's effort to win a woman's love, also called suit, courting, and courtship; it is the time
  of trying to win love, not the marriage itself.
examples:
- His wooing of her lasted a year before she agreed to marry him.
- The story tells of a young man's wooing, full of letters and long walks.
