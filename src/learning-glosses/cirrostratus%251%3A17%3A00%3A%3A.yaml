simpleMeaning: a thin, even sheet of hazy cloud high up in the sky
scope: A thin, even sheet of hazy cloud high in the sky; cirrostratus cloud is another name for this sense,
  not a wispy high cloud and not a low grey layer.
examples:
- A sheet of cirrostratus covered the whole sky.
- Cirrostratus often comes before rain.
