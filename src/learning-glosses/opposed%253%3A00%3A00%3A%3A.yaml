simpleMeaning: against a person, thing or idea, or having a person or group against you
scope: This means being against something, or having others against you; not the verb for working against
  something, and not the word for the far side of a place.
examples:
- Many voters are opposed to the new tax.
- The two opposed teams met in the final.
