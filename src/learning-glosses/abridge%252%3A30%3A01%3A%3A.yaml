simpleMeaning: to make something less in amount or force, or to cut it short
scope: To make less or cut short in general; not the sense of making something smaller while keeping its
  main, most needed parts.
examples:
- The new law may abridge our freedom to speak freely.
- The king tried to abridge the power of the court.
