simpleMeaning: to do with the humanities (the study of history, languages, literature and art)
scope: About the study of history, languages, literature and art; also called humane and humanist. It
  is not the sense about a way of thinking that puts human worth and reason first, and not the sense about
  caring for people's welfare.
examples:
- She chose humanistic studies and spent her years on history and languages.
- The college is known for its humanistic teaching, with much reading of old books and poetry.
