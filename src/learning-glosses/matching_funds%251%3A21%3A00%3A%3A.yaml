simpleMeaning: Money that will be given in the same amount as money that is on hand from other sources.
scope: Money given to match money from other places, not a gift with no match and not money given first.
examples:
- The charity promised matching funds for every dollar raised.
- Matching funds from the state doubled the school's budget.
