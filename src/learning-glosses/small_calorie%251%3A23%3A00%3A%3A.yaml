simpleMeaning: A unit of heat, the amount needed to warm one gram of water by one degree centigrade at
  normal air pressure
scope: A unit of heat, the amount needed to warm one gram of water by one degree centigrade at normal
  air pressure, also called calorie or gram calorie; not the larger food unit and not a measure of weight.
examples:
- One small calorie warms a gram of water by a single degree.
- The small calorie is the tiny heat unit used in physics.
