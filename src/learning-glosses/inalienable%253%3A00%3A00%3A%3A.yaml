synsetId: 00094663-a
simpleMeaning: not able to be given up or passed to another person
scope: 'Also called unalienable: said of a right or thing that cannot be given up or passed to another
  person, not a thing that can be sold or handed over.'
examples:
- Freedom of thought is an inalienable right.
- They held that life and liberty are inalienable and cannot be signed away.
