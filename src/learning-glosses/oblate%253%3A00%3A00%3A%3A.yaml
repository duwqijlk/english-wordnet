simpleMeaning: wider round the middle than from top to bottom, and flat at the top and bottom
scope: A shape wider round the middle than from top to bottom, and flat at the top and bottom; pumpkin-shaped
  is another name for this sense, not a shape longer from top to bottom and not a round ball.
examples:
- The oblate planet is wider round its middle than from pole to pole.
- Astronomers call the oblate shape of the star a sign of fast spin.
