simpleMeaning: having no colour, only dark parts and light parts
scope: A thing with no colour but dark and light parts, not a picture in shades of grey and not a matter
  split into two clear sides.
examples:
- The black-and-white cow had dark patches on its light coat.
- She wore a black-and-white dress with dark and light stripes.
