simpleMeaning: the sudden backward push that a gun makes when someone fires it
scope: This is not the act of hitting something with your foot, and not a feeling of pleasure or excitement.
examples:
- The rifle's kick knocked him off balance.
- He was not prepared for the kick of the shotgun.
