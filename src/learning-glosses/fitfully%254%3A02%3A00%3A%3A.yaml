simpleMeaning: in a way that starts and stops again and again, not in a steady way
scope: This describes something that starts and stops again and again. It is not steady or regular, and
  not done all the time without breaks.
examples:
- He slept fitfully and woke up many times in the night.
- The rain fell fitfully through the day, stopping and starting.
