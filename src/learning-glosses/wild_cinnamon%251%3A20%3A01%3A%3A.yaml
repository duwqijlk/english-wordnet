simpleMeaning: This large shrub or small tree stays green all year, with white sweet-smelling bark, tough
  leaves, and small purple to red flowers in bunches at the stem ends.
scope: Also called white cinnamon tree, this is a large shrub or small tree, green all year, whose bark
  smells sweet and whose small purple to red flowers grow in bunches at the stem ends.
examples:
- The wild cinnamon bore small purple flowers.
- Wild cinnamon keeps its leaves all year.
