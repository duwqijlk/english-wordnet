simpleMeaning: To come to an end in time, space, or amount, whether literally or in a figurative sense.
scope: This is about reaching an end, not pausing to wait for instructions or blocking a passage.
examples:
- The road stops at the river.
- His loyalty stopped at the first sign of danger.
