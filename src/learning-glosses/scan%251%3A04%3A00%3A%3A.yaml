simpleMeaning: the act of looking carefully over an area chosen in advance, checking it part by part
scope: The act of looking carefully over an area, not the verb senses of getting data from a machine,
  moving a light beam over something, or fitting a pattern of beats in lines of words.
examples:
- He made a slow scan of the beach with his binoculars.
- She made a careful scan of the whole field, part by part, looking for the lost key.
