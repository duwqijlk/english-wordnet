simpleMeaning: a plant taller than a related plant, Abronia elliptica, with flowers that open at night
scope: This is a plant taller than the plant Abronia elliptica, with flowers that open at night, not the
  plant with white trumpet-shaped flowers that grows in dry sandy land and not a plant whose flowers open
  in the day.
examples:
- The sweet sand verbena stands taller than the plants around it.
- The sweet sand verbena opened its flowers after dark.
