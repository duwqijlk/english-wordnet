simpleMeaning: the act of turning the tip of the tongue back against the roof of the mouth while making
  a sound
scope: 'Also called retroflexion: a tongue movement used when making a speech sound, not the sound itself
  and not a sound made with the lips.'
examples:
- In retroflection, the speaker turns the tip of the tongue back against the roof of the mouth.
- The teacher showed the class how retroflection shapes a sound.
