simpleMeaning: a person's things going back to the state when the person dies with no one who has the
  legal right to take them
scope: Property going back to the state when a person dies with no legal heir, not a gift to the state
  and not property passed to family.
examples:
- With no heirs, the farm passed by escheat to the state.
- The old house fell to escheat when its owner died childless.
