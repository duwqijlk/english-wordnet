simpleMeaning: Blood moves down from the upper rooms to the lower rooms through one of these two flaps,
  which shut so it cannot flow back.
scope: This is one of the two flaps between the heart's upper and lower rooms.
examples:
- The atrioventricular valve opened and blood moved down into the lower room.
- When the atrioventricular valve shut, no blood flowed back.
