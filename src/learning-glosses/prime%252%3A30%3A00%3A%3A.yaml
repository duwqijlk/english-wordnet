simpleMeaning: to put a small firing charge into a gun, mine, or explosive so that it is ready to go off.
scope: This is not to fill a pump with liquid and not to coat a surface; it means making a weapon or explosive
  ready by adding its firing charge.
examples:
- The soldier primed the grenade before throwing it.
- The crew primed the explosive charge and cleared the area.
