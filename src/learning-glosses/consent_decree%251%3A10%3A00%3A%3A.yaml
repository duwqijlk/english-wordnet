simpleMeaning: In law, a deal between two sides that a court accepts, such as a firm agreeing to stop
  doubtful acts without saying it was at fault.
scope: In law, a deal between two sides that a court accepts, not a court order forced on unwilling sides
  and not a private deal with no court.
examples:
- The firm signed a consent decree to stop the practice.
- Under the consent decree, the company changed its ads.
