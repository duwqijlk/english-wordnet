simpleMeaning: A hard grey metal that breaks easily and joins with many atoms; like iron but with no pull
  on a magnet; used for steel; found in many kinds of stone.
scope: A hard grey metal that breaks easily, also called manganese and Mn; set apart from iron, which
  it looks like, and from other metals used for steel.
examples:
- Atomic number 25 looks like iron but has no pull on a magnet.
- Steel makers use atomic number 25 to make their steel.
