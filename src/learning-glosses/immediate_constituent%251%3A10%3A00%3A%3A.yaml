simpleMeaning: In grammar, a part of a sentence found at the first step of breaking it down, such as the
  subject or the predicate.
scope: A part found at the first step of breaking down a sentence, not a single word and not the whole
  sentence.
examples:
- In the sentence 'The dog barked', 'the dog' is an immediate constituent.
- The teacher asked us to name the immediate constituents of the sentence.
