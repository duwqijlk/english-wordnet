simpleMeaning: the fruit of a plant like a pea or bean, which holds several seeds and opens to let them
  out
scope: This is the case of a plant like a pea or bean. It holds several seeds and opens to let them out.
  Not the general case that holds the seeds of any plant, and not a fuel container that can be taken off
  an airplane.
examples:
- She opened a pea pod and took out the small green seeds.
- The bean pods opened in the sun and dropped their seeds.
