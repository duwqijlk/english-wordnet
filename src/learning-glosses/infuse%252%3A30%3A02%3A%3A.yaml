senseId: 'infuse%2:30:02::'
synsetId: 00328464-v
simpleMeaning: to stay in a liquid while its taste or good parts slowly move into the liquid
scope: This sense is the thing itself staying in a liquid while its taste moves into the liquid, not a
  person letting a thing stay in a liquid to get its taste out, not putting a drug into the body through
  a vein, and not teaching an idea by saying it again and again.
examples:
- The tea leaves are infusing in the hot water.
- Leave the herbs infusing in the water for five minutes.
