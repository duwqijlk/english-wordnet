simpleMeaning: to do something rude in company, to do something wrong, or to make a big mistake
scope: 'Another name for blunder: making a bad mistake or a rude mistake in company; not sin as breaking
  God''s law or a moral rule.'
examples:
- She sinned at the dinner party by calling her host by the wrong name.
- He sinned during the job interview by answering his phone in the middle of a question.
