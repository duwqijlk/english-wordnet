simpleMeaning: In sports, a hard, straight hit that sends the ball back, made with the side of the hand
  that leads the stroke
scope: A hard return hit in tennis, badminton or squash, not a soft return and not a hit made with the
  back of the hand.
examples:
- Her forehand drive flew straight past her opponent.
- He won the point with a forehand drive down the line.
