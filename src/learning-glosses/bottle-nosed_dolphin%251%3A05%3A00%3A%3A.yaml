simpleMeaning: With a round forehead and a well-formed beak, this dolphin is one of several kinds found
  chiefly in the north Atlantic and the Mediterranean.
scope: Also called a bottlenose dolphin and a bottlenose, this dolphin of the north Atlantic and the Mediterranean
  is one of several kinds with a round forehead and a well-formed beak.
examples:
- The bottle-nosed dolphin swam beside the boat in the north Atlantic.
- We saw a bottle-nosed dolphin lift its round forehead above the waves.
