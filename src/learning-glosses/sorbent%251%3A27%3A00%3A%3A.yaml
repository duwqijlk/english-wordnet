simpleMeaning: Something that takes in another material, by soaking it up or by holding it on its face
scope: A substance that takes in another substance, by soaking it up or by holding it on its face; also
  called sorbent material; not a substance that pushes things away, and not a substance that breaks things
  down.
examples:
- Charcoal is a sorbent that traps smells.
- The sorbent soaked up the spilled oil.
