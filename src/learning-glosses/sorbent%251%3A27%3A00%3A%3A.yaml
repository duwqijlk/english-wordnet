simpleMeaning: Something that takes in another material, by soaking it up or by holding it on its face
scope: A stuff that takes in another stuff, by soaking it up or by holding it on its face; also called
  sorbent material; not a stuff that pushes things away, and not a stuff that breaks things down.
examples:
- Charcoal is a sorbent that traps smells.
- The sorbent soaked up the spilled oil.
