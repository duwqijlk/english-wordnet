simpleMeaning: a pink or red powder for the cheeks, put on as makeup
scope: Also called paint; this is the powder put on the cheeks, not the face turning red on its own.
examples:
- She brushed a little blush onto her cheeks before the party.
- This blush is a soft pink powder that goes on the cheeks.
