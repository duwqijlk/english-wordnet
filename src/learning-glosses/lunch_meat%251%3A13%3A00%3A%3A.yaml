simpleMeaning: Cold slices of food made from any of several kinds of sausage or pressed loaf.
scope: Cold slices of food made from any of several kinds of sausage or pressed loaf; luncheon meat is
  another name for this sense, not food served hot from the oven.
examples:
- She made sandwiches with lunch meat and cheese.
- The shop sold lunch meat by the slice.
