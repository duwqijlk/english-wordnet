simpleMeaning: In one small flat bit of space, cut straight across the way the pull moves, there is an
  amount of pull from a magnet
scope: Also called magnetic field strength, magnetic induction and magnetic intensity, this is the amount
  of pull from a magnet in one small flat bit of space, not the pull on its own and not the act of making
  a thing pull.
examples:
- The magnetic flux density was the same at every point in the gap.
- Engineers worked out the magnetic flux density from the coil's pull.
