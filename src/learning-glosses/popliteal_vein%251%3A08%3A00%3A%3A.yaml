scope: A blood tube that starts at the knee and runs up, then goes on as the large blood tube in the leg;
  vena poplitea is another name for this sense, not a blood tube in the arm and not the large blood tube
  itself.
examples:
- The popliteal vein runs behind the knee.
- A clot in the popliteal vein can block the leg.
