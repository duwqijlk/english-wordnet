simpleMeaning: Having a use, often with other values left out
scope: This describes something that has a use, often with other values left out; not the noun sense,
  a person who believes that the value of a thing depends on its use.
examples:
- They chose plain utilitarian kitchenware that would last for years.
- The room had a cold, utilitarian feel, with bare walls and simple chairs.
