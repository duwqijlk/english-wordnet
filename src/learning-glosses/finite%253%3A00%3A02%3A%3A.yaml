senseId: 'finite%3:00:02::'
synsetId: 01012028-a
simpleMeaning: Of verbs, a form that shows a set time, like past or present, and usually changes to match
  the number and person of who does it
scope: About verb forms that show time and usually match who does the action, not about a thing that has
  a set limit in size, space, or time.
examples:
- In 'she walks', the verb 'walks' is finite because it shows present time and matches 'she'.
- A finite verb form changes when the person changes, as in 'I am' and 'she is'.
