simpleMeaning: With no waist to it, a loose dress that hangs straight down from the shoulders.
scope: Also called a shift or a sack, a loose dress with no waist that hangs straight from the shoulders,
  not a woman's sleeveless undergarment.
examples:
- She wore a chemise that hung straight from her shoulders.
- The chemise had no waist and fell loose.
