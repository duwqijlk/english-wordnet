simpleMeaning: the act of making something good, or better, in what is right and wrong
scope: The act of making something good, or better, in what is right and wrong, also called moralization;
  not a long speech about what is right and not a list of rules for conduct.
examples:
- For years she worked toward the moralisation of English literature.
- The moralisation of the young was the school's main aim.
