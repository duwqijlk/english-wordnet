simpleMeaning: paid a set amount of money at set times for a job
scope: 'Paid a set amount at set times for a job. The other sense of this word is wider: it covers being
  paid, or being able to get pay, of any kind.'
examples:
- The salaried staff get their pay at the end of each month.
- She left hourly work for a salaried job at a bank.
