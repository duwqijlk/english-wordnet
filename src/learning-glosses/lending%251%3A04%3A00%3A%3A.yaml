simpleMeaning: you hand money or a thing over for someone to use for a while, and the same thing, or something
  worth the same, must come back to you
scope: Giving money or a thing for a time on the understanding it will be returned, not giving it away
  for good.
examples:
- The bank's lending helped the small shop buy new stock.
- Her lending of the painting to the gallery lasted six months.
