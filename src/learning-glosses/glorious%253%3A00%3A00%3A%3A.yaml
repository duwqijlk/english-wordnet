simpleMeaning: having great honour and fame, deserving great honour and fame, or giving great honour and
  fame to others
scope: This sense covers having honour and fame, deserving it, or giving it to others; it is not just
  a word for good or pleasant.
examples:
- She had a long and glorious career as a doctor.
- Their glorious win brought honour to the whole town.
