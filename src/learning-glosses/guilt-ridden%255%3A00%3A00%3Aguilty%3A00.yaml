simpleMeaning: Feeling bad about a wrong thing one has done, or showing that feeling
scope: This is feeling bad about a wrong thing one has done, not feeling sad about a loss and not feeling
  afraid of being caught.
examples:
- He was so guilt-ridden he could not face his father.
- She looked guilt-ridden after she told the lie.
