simpleMeaning: a student others look down on and laugh at for trying to seem clever or for studying all
  the time in a dull way
scope: 'Also called grind: a student laughed at for showing off or always studying; not a clever expert
  in one technical field.'
examples:
- The other kids called him a nerd because he always had his nose in a book.
- She was tired of being treated like a nerd for getting top marks.
