simpleMeaning: one of several ways substances leave the body
scope: 'Also called discharge: one of the ways things leave the body, not the general act of sending something
  out and not small parts leaving atoms.'
examples:
- The emission of pus from the wound slowed as it healed.
- Urination is an emission by which liquid waste leaves the body.
