simpleMeaning: Prized for its woolly white flower spikes, any of various American plants of the genus
  Froelichia grows on sandy and rocky ground in warmer regions.
scope: A group of Froelichia species grown for woolly white flower spikes; not the other cottonweed, an
  American everlasting with pearly-white bracts.
examples:
- Cottonweed spread across the sandy slope in a haze of white.
- Gardeners plant cottonweed for its woolly flower spikes.
