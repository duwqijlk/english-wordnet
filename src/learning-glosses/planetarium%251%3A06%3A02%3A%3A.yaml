simpleMeaning: A tool that uses light to throw pictures of stars, planets, and other sky sights onto the
  inside of a half-round dome.
scope: A tool that throws pictures of stars and planets onto the inside of a half-round dome, not the
  building that holds such a tool and not a model of the sun's family of planets.
examples:
- The planetarium showed the stars moving across the dome.
- Children watched the planetarium show about the planets.
