simpleMeaning: Programs used in art, building work, work on machines and structures, and making things,
  to help draw with care and exact size
scope: Programs that help draw with care and exact size, not a hand drawing and not a finished building
  or machine.
examples:
- She learned computer-aided design to draw house plans.
- The firm uses computer-aided design for its new machines.
