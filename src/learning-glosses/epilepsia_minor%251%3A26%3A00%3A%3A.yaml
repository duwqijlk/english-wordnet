senseId: 'epilepsia_minor%1:26:00::'
synsetId: 14107041-n
simpleMeaning: A fit with small jerks or shakes in one part of the body, in which a person blanks out
  for a moment and the fit soon ends
scope: It is also called petit mal, a brief fit with a moment's blanking out, unlike the long whole-body
  fits of grand mal.
examples:
- The girl was frightened by her first epilepsia minor.
- His epilepsia minor was over in a moment.
