simpleMeaning: in the way the mind works, or in what a person thinks and feels
scope: With regard to the mind and what a person thinks and feels; not with regard to the body, and not
  in the way things look.
examples:
- The war hurt them psychologically as well as in body.
- The event was very damaging to the child psychologically.
