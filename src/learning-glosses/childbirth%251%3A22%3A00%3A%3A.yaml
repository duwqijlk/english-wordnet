simpleMeaning: the process in which a person has a baby and gives birth to a child
scope: Childbearing is another name for this sense; this is the process of a baby being born, not the
  months before the birth or the care of the baby after it.
examples:
- Her childbirth was quick and went without problems.
- The hospital room was ready for the childbirth.
