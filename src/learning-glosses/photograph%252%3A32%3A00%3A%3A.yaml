simpleMeaning: to take a picture of something and keep it on film
scope: This is taking a picture and keeping it on film, not how a person comes out in a picture, and not
  the finished picture itself.
examples:
- She photographed the scene of the accident for the report.
- He photographed the old building before it was pulled down.
