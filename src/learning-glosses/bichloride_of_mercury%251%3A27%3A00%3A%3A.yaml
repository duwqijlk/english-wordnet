simpleMeaning: Used to kill pests, to clean wounds, and to keep wood from rot, this white poison in crystals
  formed from vapour, made from quicksilver, melts in water.
scope: Also called corrosive sublimate, mercuric chloride and mercury chloride, this white poison melts
  in water and is used to kill pests, to clean wounds, and to keep wood from rot.
examples:
- Bichloride of mercury is a white poison that melts in water.
- Bichloride of mercury is used to keep wood from rot.
