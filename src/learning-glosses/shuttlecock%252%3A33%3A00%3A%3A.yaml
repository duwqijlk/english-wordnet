simpleMeaning: To send or toss back and forth, like a shuttle.
scope: This sense is to send or toss back and forth, like a shuttle, unlike the sense for badminton gear,
  a cork ball, or a gum ball, crowned with feathers.
examples:
- They shuttlecock the ball, sending it back and forth.
- They shuttlecock notes, tossing them to and fro.
