senseId: 'mortise_joint%1:06:00::'
synsetId: 03793056-n
simpleMeaning: A hole cut in one piece takes the sticking-out end of another piece, and so the two stay
  together
scope: 'Also called a mortise-and-tenon joint: two pieces joined when a hole in one takes the end of the
  other, not pieces joined with nails or glue and not a joint in the ankle.'
examples:
- He cut a mortise joint to join the two boards.
- The mortise joint held the chair leg firm.
