simpleMeaning: A long piece of wood laid flat to join upright posts together.
scope: A long flat piece of wood that joins upright posts, not the brace that runs along a plane or boat
  to make it stronger, and not a worker who strings things.
examples:
- The builder nailed a stringer across the tops of the posts.
- They cut the stringer to length before fixing it in place.
