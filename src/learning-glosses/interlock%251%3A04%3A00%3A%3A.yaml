simpleMeaning: the act of joining tightly together, so that parts fit into each other and hold
scope: 'Also called interlocking and meshing: the act of parts joining tightly together, not the verb
  sense where things join with each other.'
examples:
- The interlock of the stones keeps the wall strong without any glue.
- A tight interlock between the two parts stopped them from moving apart.
