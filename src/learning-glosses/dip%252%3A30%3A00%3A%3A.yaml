senseId: 'dip%2:30:00::'
synsetId: 00287243-v
simpleMeaning: to change the colour of an object by putting it fully into a liquid
scope: This verb means colouring a thing by putting it into liquid; it is not the dip verb that only wets
  or covers a thing, and not a candle or a fall in an amount.
examples:
- She dipped the white cloth in dye, and it came out blue.
- He dips the paper in tea to give it an old colour.
