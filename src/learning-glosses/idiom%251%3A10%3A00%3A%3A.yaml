simpleMeaning: the words and the way of using words that are typical of one group of people
scope: The words and word use of one group of people, also called an accent or a dialect. It is not a
  fixed saying whose meaning is different from its words.
examples:
- The idiom of the island fishermen includes many old words for winds and tides.
- New workers soon learn the idiom used in the factory office.
