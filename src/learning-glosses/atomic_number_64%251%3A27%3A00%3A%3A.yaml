simpleMeaning: A metal that bends easily and is silver-white, strongly drawn to magnets, and able to join
  with three other atoms; of the rare earth group.
scope: Also called gadolinium and Gd; a silver-white metal of the rare earth group that bends easily and
  is strongly drawn to magnets.
examples:
- Atomic number 64 is a silver-white metal strongly drawn to magnets.
- The bar of atomic number 64 came from the rare earth group.
