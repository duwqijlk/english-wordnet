simpleMeaning: A member of a Siouan people, one part of the Teton Sioux, who lived in western South Dakota,
  from the Black Hills to the Platte River
scope: A member of a Siouan people of the Teton Sioux, not a member of another Sioux group and not a chief
  of the Teton Sioux.
examples:
- The Miniconju lived in the west of South Dakota.
- A Miniconju person belonged to the Teton Sioux.
