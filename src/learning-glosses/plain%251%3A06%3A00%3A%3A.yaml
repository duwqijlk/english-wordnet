simpleMeaning: In knitting, a basic stitch (a loop of thread made with a needle), made by putting the
  needle through the front of that loop from the left side
scope: In knitting, one basic stitch; this is not the word for clear and easy to understand, not the word
  for having no decoration, and not the word for complaining.
examples:
- She made each plain by pushing the needle through the front of the stitch from the left.
- For this row, do one plain and one purl, and repeat to the end.
