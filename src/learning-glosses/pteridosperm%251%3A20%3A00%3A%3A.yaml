simpleMeaning: An extinct plant that made seeds and looked like a fern, from the plant group called Cycadofilicales.
scope: An extinct seed plant like a fern, also called a seed fern; not a living fern and not a tree that
  bears cones.
examples:
- The pteridosperm grew long before the first flowers appeared.
- Fossils show that the pteridosperm bore seeds on fern-like leaves.
