simpleMeaning: A yellow-flowered plant of Europe that grows on old walls and waste ground, now also found
  in North America as a weed brought in from elsewhere.
scope: A yellow-flowered wall plant, also called wall rocket and Diplotaxis tenuifolia; not a garden flower
  grown for show and not a crop plant.
examples:
- Diplotaxis muralis grew out of cracks in the old wall.
- We pulled up Diplotaxis muralis from the waste ground.
