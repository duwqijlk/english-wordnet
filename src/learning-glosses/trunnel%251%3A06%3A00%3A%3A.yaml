simpleMeaning: Ship timbers are held fast by this wooden peg, which grows fat and grips them when wet.
scope: Also called treenail and trenail; a wooden peg that swells in water to hold ship timbers fast.
examples:
- They fastened the ship timbers with trunnels.
- Water made the trunnel swell and hold the timbers fast.
