simpleMeaning: in a way that shocks people and makes them feel great fear
scope: This says how an action is done, in a way that shocks people and makes them feel great fear. It
  is not about a thing that is scary on its own, and not about feeling fear yourself.
examples:
- He laughed horrifyingly, and everyone in the room went quiet.
- She screamed horrifyingly when she saw the fire.
