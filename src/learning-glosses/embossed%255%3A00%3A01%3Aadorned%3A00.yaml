simpleMeaning: decorated with a pattern that stands up from the surface, made by pressing or by sewing
scope: 'Also called raised, and another name for it is brocaded: decorated with a pattern that stands
  up from the surface; not a flat, plain surface and not a pattern printed in ink.'
examples:
- The book cover has an embossed pattern of leaves.
- She wore a dress with embossed flowers sewn in gold thread.
