simpleMeaning: In politics, ideas that support a government with strict power held at the top, unlike
  rule by the people or rule that lets people be free
scope: This is a set of political ideas, not a single government or party, and not rule by the people.
examples:
- Fascism grew in Italy in the years before the Second World War.
- He wrote a book about the rise of fascism in Europe.
