simpleMeaning: A group of churches holding the teachings of the Dutch thinker Jacobus Arminius, who opposed
  the teaching of strict predestination held by the Calvinists.
scope: 'Also called General Baptist: a group of churches, not all Baptists, and not the Calvinist churches.'
examples:
- The Arminian Baptist churches met in the small town hall.
- She joined an Arminian Baptist church last year.
