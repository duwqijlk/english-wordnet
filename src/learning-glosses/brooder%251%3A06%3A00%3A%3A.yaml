simpleMeaning: baby birds or babies born too soon stay warm in this box, which holds one steady warmth
  by means of a heat control
scope: 'Also called incubator: a box that keeps one steady warmth for baby birds or babies born too soon,
  not a plain box for storing things.'
examples:
- The farmer put the chicks in a brooder to keep them warm.
- The brooder kept a steady warmth for the babies born too soon.
