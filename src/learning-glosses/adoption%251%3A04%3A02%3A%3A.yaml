simpleMeaning: a court action that makes someone the legal parent of a child not born to them, with all
  the rights of a natural child, such as the right to inherit
scope: This is about the legal act of taking a child as one's own, not about accepting an idea or a way
  of doing things.
examples:
- After the adoption, the child had the same rights as any natural child.
- The adoption took months to pass through the court.
