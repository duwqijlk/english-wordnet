senseId: 'secularisation%1:04:01::'
synsetId: 01157952-n
simpleMeaning: the act of changing something, such as art, schooling, society or morals, so it is no longer
  ruled or shaped by religion
scope: The act of changing something so it is no longer ruled or shaped by religion; secularization is
  another name for this sense; not the loss of faith by one person and not a ban on religion.
examples:
- The secularisation of schools took years to complete.
- Secularisation changed the way the town ran its hospitals.
