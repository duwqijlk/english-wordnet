senseId: putative%5:00:00:acknowledged:00
synsetId: 00028584-s
simpleMeaning: Often said to be true, or taken as true, on weak grounds, though it has not been proved.
scope: For a father, an author, or another person or thing said to be so on weak grounds.
examples:
- The author of the book is putative, not proved.
- The man named as her father was putative, and no proof was given.
