simpleMeaning: a past custom in China of touching the ground with the forehead to show respect or to give
  in to another person
scope: 'Also called kotow: the past Chinese act of touching the ground with the forehead, not the verb
  senses of bowing low to serve another person or of trying to win help by praising someone too much.'
examples:
- Visitors once had to perform a kowtow before the emperor.
- The old book describes a kowtow as a deep sign of respect.
