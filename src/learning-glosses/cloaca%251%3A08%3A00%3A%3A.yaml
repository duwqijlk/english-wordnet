simpleMeaning: In zoology, the chamber at the gut's end where the intestines, sex and urinary passages
  open, in birds, reptiles, amphibians, most fish and monotremes but not other mammals.
scope: This is the animal body opening shared by the waste and reproductive tracts; it is not the sewer
  pipe that carries away wastewater.
examples:
- Birds pass both urine and droppings out through a single opening, the cloaca.
- The frog's cloaca serves its digestive, urinary and reproductive systems at once.
