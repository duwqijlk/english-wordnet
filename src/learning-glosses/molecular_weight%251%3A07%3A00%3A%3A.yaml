simpleMeaning: The masses of the atoms that make up a molecule, each weighed against the others, add up
  to one whole in chemistry.
scope: Also called relative molecular mass, it is the sum, in chemistry, of the relative masses of the
  atoms that make up a molecule.
examples:
- Add up the relative masses of the atoms to get the molecular weight.
- The molecular weight comes from adding up the relative masses of the atoms.
