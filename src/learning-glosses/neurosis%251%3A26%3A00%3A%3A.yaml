senseId: 'neurosis%1:26:00::'
synsetId: 14416566-n
simpleMeaning: a problem with the mind or with how a person thinks, feels and acts, that no known problem
  in the brain, nerves or body can explain
scope: This sense, also called neuroticism and psychoneurosis, is a problem of the mind that no known
  problem in the brain or body explains; it is not harm to the brain or body itself.
examples:
- He went to a doctor for help with his neurosis.
- Her neurosis changed how she acted and felt with other people.
