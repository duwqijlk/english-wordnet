simpleMeaning: Viruses that carry RNA hold this stuff, which helps build DNA using the RNA as the first
  form it is copied from.
scope: It is a stuff that helps build DNA using RNA as the first form it is copied from, found most often
  in viruses that carry RNA, not a stuff that copies DNA from DNA.
examples:
- The virus used reverse transcriptase to build DNA from its RNA.
- With reverse transcriptase, the RNA was copied into DNA.
