simpleMeaning: A weedy nightshade with silvery leaves and violet, blue, or white flowers, whose roundish
  berry is much used to curdle milk, from the central United States to South America
scope: Also called the prairie berry, purple nightshade, silver-leaved nettle, silver-leaved nightshade,
  silverleaf nightshade, trompillo, and white horse nettle; a weedy nightshade whose roundish berry curdles
  milk.
examples:
- Solanum elaeagnifolium grew by the roadside with silvery leaves.
- Farmers used the berries of Solanum elaeagnifolium to curdle milk.
