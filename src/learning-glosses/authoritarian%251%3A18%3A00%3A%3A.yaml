simpleMeaning: a person who acts in a cruel, harsh way when using power over others
scope: 'Also called dictator: a person who uses power in a cruel, harsh way. Not the sense that means
  expecting people to obey without questions, and not the sense about a ruler with full power.'
examples:
- My grandfather was an authoritarian who never let anyone question his rules.
- The manager was such an authoritarian that the staff were afraid to speak.
