simpleMeaning: In physics, the rule that the total amount of what can do work in a system cut off from
  all else stays the same, even when things change inside it.
scope: In physics, the rule that the total amount of what can do work in a system cut off from all else
  stays the same, even when things change inside it; conservation of energy and first law of thermodynamics
  are other names for this sense, not a rule about heat alone, and not a rule about a system open to the
  outside.
examples:
- The law of conservation of energy says the total stays the same, even when heat turns into motion.
- In a shut-off box, the law of conservation of energy says the total stays the same as things warm up
  and slow down.
