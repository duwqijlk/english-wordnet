simpleMeaning: A small insect that mostly feeds on bark, on the high parts and roots of apple and other
  trees.
scope: 'Also called woolly apple aphid or Eriosoma lanigerum: a small insect that mostly feeds on bark,
  on the high parts and roots of apple and other trees, set apart from other bark feeders by its life
  on apple trees.'
examples:
- American blight attacked the bark of the old apple tree.
- The orchard suffered from American blight on its roots.
