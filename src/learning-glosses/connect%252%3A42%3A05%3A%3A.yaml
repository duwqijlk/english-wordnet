simpleMeaning: Of a train, bus or plane, to be timed to arrive before another leaves so passengers can
  continue their journey.
scope: Said of transport schedules that let a journey continue, not of fastening parts together or of
  linking ideas.
examples:
- The last bus leaves at six, so it does not connect with the evening train.
- Our flight connects with a shuttle to the island.
