simpleMeaning: Kept safe by the First Amendment to the US Constitution, this is the right to meet in peace
  and to ask the government to put right what is wrong.
scope: This right lets people meet in peace and ask the government to put wrongs right, not to worship
  as they like, which is freedom of religion.
examples:
- The people used their freedom of assembly to meet in peace and ask the government for change.
- She joined others under freedom of assembly to ask for the wrong to be put right.
