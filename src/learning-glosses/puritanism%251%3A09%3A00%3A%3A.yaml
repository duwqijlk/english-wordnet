simpleMeaning: The beliefs and ways of the Puritans, most of them Calvinists who wanted to free the Church
  of England from its Catholic ways.
scope: The beliefs and ways of the Puritans, not the beliefs of the Catholics and not the rules of the
  Church of England itself.
examples:
- Puritanism shaped life in early New England.
- His Puritanism showed in his plain dress and stern rules.
