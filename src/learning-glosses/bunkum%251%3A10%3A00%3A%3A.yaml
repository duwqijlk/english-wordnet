senseId: 'bunkum%1:10:00::'
synsetId: 06624034-n
simpleMeaning: Conduct no one should tolerate, especially statements so plainly false they are laughable.
scope: Also called bunk, rot, hogwash, and guff, this is behaviour people refuse to accept, especially
  statements so plainly false they are laughable.
examples:
- His speech was pure bunkum from start to finish.
- She called his excuses bunkum and walked away.
