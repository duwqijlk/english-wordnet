simpleMeaning: a form of poker in which each player gets some cards face down and the rest face up, and
  bets are made after each card is dealt
scope: A form of poker with some cards face down and the rest face up, not a round knob on a belt and
  not the act of scattering dots.
examples:
- They played a game of stud poker all evening.
- In stud, each player gets some cards face down and the rest face up.
