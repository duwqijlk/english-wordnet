simpleMeaning: From where play starts, this player on the attacking side takes the ball and carries it
  forward, one of the two kinds that stand behind the line.
scope: In football, this player on the attacking side carries the ball forward from where play starts.
examples:
- The running back took the ball and ran with it.
- The running back carried the ball up the field.
