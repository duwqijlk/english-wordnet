simpleMeaning: In biology, very small thread-like parts seen when a cell divides, spreading out from two
  ends and meeting in the middle
scope: In biology, these are the thread-like parts inside a dividing cell, not a stick used for spinning
  yarn, not a turning shaft in a machine, and not a shaped piece of wood.
examples:
- In a dividing cell, the spindle helps move the chromosomes to each side.
- Under the microscope, tiny fibres formed a spindle across the middle of the cell.
