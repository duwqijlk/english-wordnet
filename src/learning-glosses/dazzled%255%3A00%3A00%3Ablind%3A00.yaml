simpleMeaning: not able to see clearly for a short time because of a very bright light, or as if a very
  bright light had done it
scope: Not able to see clearly for a short time because of bright light, not blind for good and not confused
  by a strong feeling.
examples:
- She shut her dazzled eyes against the sun.
- He stood dazzled for a moment after the camera flash.
