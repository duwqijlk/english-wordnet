simpleMeaning: to add a shade such as red, blue, or green to something so that it is not plain.
scope: This is not the visual quality itself, and it is not about a face turning red; it is the act of
  putting a shade onto something.
examples:
- She colored the drawing with bright crayons.
- The children colored the eggs for the holiday.
