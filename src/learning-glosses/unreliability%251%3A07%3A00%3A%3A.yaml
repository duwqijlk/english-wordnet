simpleMeaning: the quality of a person or thing that people cannot trust to do what is needed or to work
  well
scope: A lasting quality of a person or thing that cannot be trusted, not one single failure to work or
  to arrive.
examples:
- His unreliability made his friends stop asking him for help.
- The car's unreliability left us stuck on the road twice.
