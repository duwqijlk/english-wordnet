simpleMeaning: the amount of increase in the strength of a signal, voltage, or current, measured as the
  ratio of what comes out to what goes in.
scope: This is not profit or an increase in wealth or advantage; it is the measured increase in the strength
  of an electrical signal.
examples:
- The amplifier has a gain of ten, so the output signal is ten times stronger.
- Engineers measure gain as the ratio of output power to input power.
