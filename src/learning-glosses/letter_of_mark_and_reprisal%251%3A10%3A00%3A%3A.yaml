simpleMeaning: The right to take another country's ships and goods is what this paper gives one person
scope: 'Also called a letter of marque and letters of marque: a paper that lets one person take the ships
  and goods of another country, not a paper for a whole navy and not a paper that sets a ship free.'
examples:
- The king gave him a letter of mark and reprisal to seize enemy ships.
- With a letter of mark and reprisal, a private citizen could take another nation's vessels.
