simpleMeaning: The fruit of the vine that shares its name, one of several sweet melons, kin to the cucumber.
scope: The fruit of the vine, not the vine itself, a vine whose fruit has a netted rind, edible flesh,
  and a musky smell.
examples:
- She cut the muskmelon into slices for lunch.
- The muskmelon was sweet and full of juice.
