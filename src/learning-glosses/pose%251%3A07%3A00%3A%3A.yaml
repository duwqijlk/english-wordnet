simpleMeaning: Ways of acting that are not natural, meant to make other people think well of you
scope: These are ways of acting that are not natural, meant to win praise, not a body held still for a
  photo and not a claim to be someone else.
examples:
- His pose did not fool anyone; the stiff manners were plain to see.
- She dropped the pose and spoke to us in a plain, warm way.
