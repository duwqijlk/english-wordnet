simpleMeaning: a big mackerel that can be eaten, from the mild Atlantic waters off the United States coast
scope: A big mackerel that can be eaten, from the mild Atlantic waters off the United States coast; kingfish
  and pintado are other names for this sense, not the long-nosed mackerel of the east Atlantic coast and
  not any small fish.
examples:
- Cero is a big mackerel caught off the United States coast.
- Fishermen sell cero as a food fish.
