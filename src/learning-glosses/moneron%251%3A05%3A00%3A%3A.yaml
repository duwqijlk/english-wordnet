simpleMeaning: Small beings that breed, as a rule, by splitting or budding with no sex, taking in food
  by soaking it up, or from sunlight, or from chemical means.
scope: This sense is also called moneran, for small beings that breed, as a rule, by splitting or budding
  with no sex, taking in food by soaking it up, or from sunlight, or from chemical means.
examples:
- Monerons breed without sex.
- Monerons take in food by soaking it up.
