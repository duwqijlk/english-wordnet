simpleMeaning: In chemistry and physics, a thing that will not mix with another thing
scope: In chemistry and physics, a substance that cannot mix with another, also called non-miscible; not
  a liquid that mixes well and not a solid that melts into a liquid.
examples:
- Oil and water are immiscible, so they stay in two layers.
- The two immiscible liquids would not blend no matter how long they were stirred.
