simpleMeaning: the process of knowing a person or thing again because you remember them from before
scope: Knowing someone or something again from memory, not the state of being widely known and accepted,
  and not the formal acceptance of a new government or country.
examples:
- After twenty years apart, recognition came at once when she saw her old friend's face.
- He looked at the photo for a moment before recognition dawned and he named the place.
