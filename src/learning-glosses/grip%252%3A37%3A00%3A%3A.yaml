simpleMeaning: to make a person or animal stay still and not move, by a long fixed look or by making them
  feel very strong fear, or wonder and respect
scope: 'Another name for fascinate: to hold a person or animal still with a fixed look, fear or wonder.
  Not the hair pin or the bag, and not holding something tight in the hand.'
examples:
- The snake's steady stare gripped the small animal, and it did not move.
- Fear gripped her, and she stood still, unable to take a step.
