simpleMeaning: a hard, thickened patch of skin, especially over the top or sides of a toe, caused by badly
  fitting shoes pressing on it
scope: This is the hard skin patch on a toe, not the yellow grain plant or the verb for salting meat.
examples:
- He had a painful corn on his little toe.
- Her new boots gave her a corn on the side of her toe.
