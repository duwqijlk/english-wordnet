simpleMeaning: The four proteins H2A, H2B, H3, and H4 are simple proteins that fasten themselves to nucleosomes,
  the bead-like bodies that DNA winds round
scope: Simple proteins that fasten themselves to nucleosomes, namely H2A, H2B, H3, and H4; not the linker
  protein that sits outside the nucleosome.
examples:
- A core histone helps pack DNA into the nucleosome.
- H2A is a core histone that binds to a nucleosome.
