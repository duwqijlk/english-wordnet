simpleMeaning: A skin-like frame holding the yolk of eggs in birds, reptiles, pouch beasts, and some fishes,
  sending food to the growing young.
scope: This sense is a skin-like frame holding the yolk of eggs in birds, reptiles, pouch beasts, and
  some fishes, sending food to the growing young, unlike the sense for a skin-like frame that works as
  the blood-moving set-up in mammal young until the heart starts to work.
examples:
- A yolk sac held the yolk.
- Yolk sacs send food to the young.
