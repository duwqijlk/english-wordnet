senseId: 'quercus_laurifolia%1:20:00::'
synsetId: 12294285-n
simpleMeaning: A big oak of the south-east United States that keeps most of its leaves through the year,
  and grows best in wet soil.
scope: Also called laurel oak and pin oak; a big oak of the south-east United States that keeps most of
  its leaves, not a small oak of dry hills and not an oak that loses all its leaves in winter.
examples:
- Quercus laurifolia grows best where the soil stays wet.
- The Quercus laurifolia in the swamp keeps most of its leaves all year.
