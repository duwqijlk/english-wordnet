simpleMeaning: of money owed, on which extra money is paid for its use
scope: Said of money owed, on which extra money is paid for its use; not money owed with no extra charge,
  and not the extra money itself.
examples:
- She put her savings in an interest-bearing account.
- The loan was interest-bearing, so the cost grew each month.
