simpleMeaning: A plant of Siberia and eastern Asia with bad-smelling pale green flowers.
scope: A plant of Siberia and eastern Asia with bad-smelling pale green flowers, also called a fetid bugbane;
  not a plant with sweet-smelling flowers and not a plant of western Europe.
examples:
- The foetid bugbane grew in the damp woods of Siberia.
- Foetid bugbane is known for its bad-smelling flowers.
