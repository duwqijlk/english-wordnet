simpleMeaning: Small folds left on a smooth flat thing, or a fold pressed into it, is what this word means;
  crisp, the old word for this, is no longer used.
scope: Wrinkle, crisp, crease, crinkle, scrunch and scrunch up are other names for this, the making of
  small folds on a smooth flat thing, or of a fold pressed into it.
examples:
- The dress was ruckled.
- He ruckled the paper.
