simpleMeaning: a small pointed part that used to make sound by moving along the cut line in a music record
scope: A small pointed part that used to make sound from a music record, not a thin pointer that shows
  a number and not a sharp tool for sewing.
examples:
- The needle dropped onto the record and the music began.
- He changed the needle on his old record player.
