simpleMeaning: Easy to bend yet tough, this stuff has the feel and look of animal skin
scope: 'Also called leathery, leathered and coriaceous: tough but easy to bend and made to have the look
  and feel of animal skin, not soft cloth and not stiff wood.'
examples:
- The bag was made of a leatherlike cloth that felt tough yet soft in the hand.
- She chose leatherlike seats for the car because they bend without tearing.
