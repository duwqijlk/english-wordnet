simpleMeaning: to fall to the bottom and stay there as small solid bits
scope: The small solid bits themselves fall and stay at the bottom. It is not laying such bits down as
  a layer, and not the name for the bits themselves.
examples:
- Fine sand sedimented at the bottom of the glass of water.
- Over weeks, the mud sedimented and the water grew clear.
