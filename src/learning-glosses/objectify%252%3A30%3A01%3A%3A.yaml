simpleMeaning: to give an idea a real, outer form, or to make something real outside the mind
scope: To give a thought or feeling a real outer form, not to treat a person as a thing with no feelings.
examples:
- In her poem, she objectifies her fear as a dark room with no door.
- The statue objectifies the city's hope for peace in the shape of a woman holding light.
