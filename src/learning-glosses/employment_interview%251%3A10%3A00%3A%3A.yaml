simpleMeaning: a talk with a person who wants a job, to find out if he or she fits the work
scope: 'Also called job interview: a talk with a person who wants a job, to find out if he or she fits
  the work, not a talk to train a worker and not a chat with no job in view.'
examples:
- Her employment interview lasted an hour and covered all her past jobs.
- He felt calm during the employment interview because he knew the work well.
