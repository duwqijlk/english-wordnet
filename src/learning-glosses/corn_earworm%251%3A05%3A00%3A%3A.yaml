simpleMeaning: above all on maize, cotton and tomato crops, the young of a night-flying moth does great
  harm
scope: This is the young of a night-flying moth that badly harms crops; cotton bollworm, tobacco budworm,
  tomato fruitworm and vetchworm are other names for this sense, not the adult moth.
examples:
- The corn earworm is the young of a moth that harms maize crops.
- Corn earworms badly harm cotton and tomato crops.
