senseId: 'confine%2:41:00::'
synsetId: 02500687-v
simpleMeaning: to take away a person's freedom and keep them in a place they cannot leave
scope: This sense is about taking a person's freedom and holding them in a place they cannot leave, not
  just setting a limit on an activity or keeping a thing inside an area.
examples:
- The police confined the man in a small cell overnight.
- She was confined in the camp and could not leave.
