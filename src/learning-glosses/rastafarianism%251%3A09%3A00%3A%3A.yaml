simpleMeaning: A religious group built on the belief that Ras Tafari, Haile Selassie, is the Messiah and
  that Africa, above all Ethiopia, is the Promised Land.
scope: A faith built on Haile Selassie as the Messiah and Africa, above all Ethiopia, as the Promised
  Land, with its hope set on one man and one homeland.
examples:
- Rastafarianism holds that Haile Selassie is the Messiah.
- Followers of Rastafarianism look to Ethiopia as the Promised Land.
