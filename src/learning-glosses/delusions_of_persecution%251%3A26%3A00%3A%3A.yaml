simpleMeaning: A false belief, common in fear-madness, that others mean to get you, thwart and shame you,
  or hurt you, with a tangled plot often dreamed up.
scope: A false belief, common in paranoia, that others are out to get you; a tangled conspiracy is often
  imagined.
examples:
- Delusions of persecution dream up tangled plots.
- The delusion of persecution says others mean to get you.
