simpleMeaning: the bending part in the front leg of a milk-feeding animal or in a bird's wing, in the
  same place as the bend in a person's arm
scope: The bending part on an animal or bird; not the bend in a person's arm, not the part of a sleeve,
  and not a bent pipe.
examples:
- The vet checked the dog's elbow for any hurt.
- You can see the bird's elbow bend when it opens its wing.
