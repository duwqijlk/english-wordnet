simpleMeaning: A kind of speech with a special case form, or where the thing acted on shares its form
  with the doer of an act with no thing acted on.
scope: A kind of speech that marks the doer and the thing acted on in this set way, also called ergative-absolutive
  language; not a kind of speech that marks all doers the same and not a word list.
examples:
- An ergative language marks the doer of a two-part act in its own way.
- In an ergative language, the thing acted on shares its form with the doer of a one-part act.
