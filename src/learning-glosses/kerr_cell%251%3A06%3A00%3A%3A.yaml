simpleMeaning: A transparent box with two rods between light-sifting sheets; light passes only when the
  sheets line up, and it works as a high-speed shutter or to shape a laser beam.
scope: An optical device that lets light through only when its sheets line up, used as a high-speed shutter
  or to shape a laser beam.
examples:
- The Kerr cell opened and shut the laser beam in a flash.
- A Kerr cell works as a high-speed shutter.
