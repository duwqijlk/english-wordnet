senseId: 'pry%2:36:00::'
synsetId: 01634445-v
simpleMeaning: to ask questions that you have no right to ask and that no one has asked you to ask
scope: This means asking questions you have no right to ask and were not asked to ask; it is not the heavy
  iron tool, and it is not using a tool to force something open.
examples:
- I do not want to pry, but did he tell you why he left?
- The reporters pry into the singer's family life with endless questions.
