simpleMeaning: a person who is much more important than others and is very well known and respected
scope: 'Also called giant, titan, behemoth and heavyweight: a very important, well-known person, not a
  very large statue and not a very big animal.'
examples:
- She is a colossus of science, known all over the world.
- The old leader was a colossus in his country for fifty years.
