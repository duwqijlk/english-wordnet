simpleMeaning: Off-beat tunes in duple beat for dancing the rumba.
scope: Off-beat tunes in duple beat for dancing the rumba; also called rumba; not a dance of the folk,
  in two-time, born in Cuba with Spanish and African parts, marked by tricky footwork and fierce movement,
  nor a hall dance built on the Cuban folk dance, nor to dance the rhumba.
examples:
- Their rhumba played at dawn.
- The rhumba was heard at noon.
