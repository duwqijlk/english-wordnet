simpleMeaning: Put after a date to show it falls in the years up to the year Jesus was said to be born
scope: Also called BC and B.C., this word goes after a date that falls before the birth of Jesus, not
  after a date in the years that came after.
examples:
- The temple was built in 200 before Christ.
- She wrote the date as 500 before Christ.
