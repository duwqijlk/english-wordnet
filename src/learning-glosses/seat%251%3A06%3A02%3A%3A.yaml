simpleMeaning: The fabric part of a garment that covers a person's bottom.
scope: This is the cloth of a garment over the bottom, not a chair or bench made for sitting and not the
  body part itself.
examples:
- The seat of his trousers had worn thin from months of cycling.
- She brushed the sand off the seat of her jeans.
