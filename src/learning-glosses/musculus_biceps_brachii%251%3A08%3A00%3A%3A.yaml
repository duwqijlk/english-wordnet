simpleMeaning: Bending the lower arm and turning the palm up is the work of this band of flesh in the
  upper arm
scope: 'Also called the biceps brachii or the biceps humeri: the band of flesh in the upper arm that bends
  the lower arm and turns the palm up, not the band of flesh at the back of the upper arm and not one
  in the leg.'
examples:
- The musculus biceps brachii bends the elbow when he lifts the weight.
- She felt the musculus biceps brachii tighten as she turned her palm up.
