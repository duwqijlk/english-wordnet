simpleMeaning: This word is used for the parts of the body used for sex and for passing water, and for
  what those parts do
scope: Used of the sex organs and the organs that pass water and their work, not of the stomach and bowels
  and not of the heart and lungs.
examples:
- The doctor treats genitourinary infections.
- A genitourinary problem can make passing water hurt.
