simpleMeaning: Feeling ill or looking ill because the organ that cleans the blood is not working well,
  or because the stomach is upset.
scope: This means feeling or looking ill from a sick liver or an upset stomach; livery and bilious are
  other names for this sense, and it is not simply being tired.
examples:
- He felt liverish after the rich meal.
- She looked liverish and said her stomach was upset.
