senseId: 'vacantly%4:02:00::'
synsetId: 00493903-r
simpleMeaning: in a way that shows no thought or interest
scope: This describes looking or acting with no thought or interest showing. It is not about a room or
  place being empty, and it is not about a job being free.
examples:
- She stared vacantly into the room, thinking of nothing.
- He nodded vacantly, not really listening to the question.
