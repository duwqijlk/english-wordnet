simpleMeaning: A closed loop in which the flow splits into two or more ways and then joins up again to
  make the loop whole.
scope: A closed loop where the flow splits and joins up again, not a single-path loop and not an open
  loop.
examples:
- In a parallel circuit, the bulbs stay lit if one fails.
- The parallel circuit split the current into two paths.
