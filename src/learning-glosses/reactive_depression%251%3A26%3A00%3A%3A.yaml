simpleMeaning: A low mood that does not fit the facts and is brought on by things that happen in a person's
  life; it is not the same as ordinary grief
scope: A low mood brought on by things in a person's life, also called exogenous depression; not ordinary
  grief and not a low mood with no cause in life.
examples:
- Her reactive depression began after she lost her job.
- The doctor treated his reactive depression with talk and rest.
