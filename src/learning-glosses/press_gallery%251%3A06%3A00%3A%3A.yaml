simpleMeaning: A place set aside for reporters, sometimes on a balcony, most often in a hall where laws
  are made
scope: A place kept for reporters, sometimes on a balcony and most often in a hall where laws are made;
  not the main floor where the lawmakers sit and not a room for the public.
examples:
- The reporters watched the debate from the press gallery.
- Seats in the press gallery were kept for the newspaper writers.
