simpleMeaning: In medicine, a plan for treatment that follows a set order, often including what a person
  should eat
scope: In medicine, a plan for treatment that follows a set order, often including what a person should
  eat. Not a government or the people in power.
examples:
- The doctor put him on a strict regime of rest and plain food.
- Her regime includes daily walks and a low-salt diet.
