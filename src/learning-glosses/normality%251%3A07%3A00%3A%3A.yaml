senseId: 'normality%1:07:00::'
synsetId: 04802662-n
simpleMeaning: the quality of being easy to expect because a thing is usual, regular or common
scope: 'Also called normalcy: this sense is about being usual and easy to expect, not about a body or
  system working as it should, and not about how strong a liquid mix is.'
examples:
- The normality of rain in April surprised no one in the village.
- There is a comforting normality in his daily walk to the same shop.
