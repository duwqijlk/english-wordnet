simpleMeaning: something you offer or give up in talks so that the other side will agree to what you want
scope: A thing you give up or offer in talks to win what you want, not a plan to force someone and not
  money you pay.
examples:
- The extra land was the bargaining chip that finally closed the deal.
- She used the offer of help as a bargaining chip in the talks.
