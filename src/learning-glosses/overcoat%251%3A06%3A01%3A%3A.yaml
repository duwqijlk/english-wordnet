simpleMeaning: an extra layer, such as paint or varnish, put on top to guard what lies under it
scope: An extra protective layer put on top, not the heavy coat a person wears.
examples:
- He gave the door a fresh overcoat of varnish.
- The overcoat of paint kept the wood dry.
