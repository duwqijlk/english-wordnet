simpleMeaning: a secret way of printing and sharing books and writings that the people in power have banned
  or that speak against them
scope: 'Also called underground press: a secret way of sharing banned writings, not a legal newspaper
  and not one single banned book.'
examples:
- Under the old government, samizdat was passed from reader to reader in secret.
- She printed samizdat at night and gave copies to trusted friends.
