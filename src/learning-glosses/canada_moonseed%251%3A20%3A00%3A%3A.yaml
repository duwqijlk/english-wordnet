simpleMeaning: A woody climbing plant of the east of North America, with large oval leaves, small white
  flowers, and purple to blue-black fruits.
scope: Also called common moonseed, yellow parilla and Menispermum canadense; a woody vine with large
  oval leaves and dark fruit, among the climbing plants of eastern North America.
examples:
- The Canada moonseed climbed over the fence by the wood.
- We found a Canada moonseed with small white flowers and dark purple fruits.
