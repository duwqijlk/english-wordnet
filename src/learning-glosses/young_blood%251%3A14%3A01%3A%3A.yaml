simpleMeaning: A member or members of a group born later than the others who bring fresh life to it, as
  in a firm or club
scope: A member or members of a group born later than the others who bring fresh life to it, as in a firm
  or club; not new blood in the body, and not the older members of the group.
examples:
- The club needs young blood to bring in fresh ideas.
- Young blood in the firm pushed for change.
