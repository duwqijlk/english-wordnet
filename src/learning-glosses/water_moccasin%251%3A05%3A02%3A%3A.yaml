simpleMeaning: any of many North American snakes that live in fresh ponds, streams, lakes and marshes
scope: Any of many North American snakes that live in fresh ponds, streams, lakes and marshes, not a snake
  that lives on dry land and not a sea snake.
examples:
- We saw a water moccasin glide through the pond near the dock.
- The water moccasin slipped off the bank and swam across the creek.
