simpleMeaning: the way of cooking food in a liquid that is so hot it is bubbling hard
scope: This is cooking food in bubbling hot liquid; it is not just being very hot, and it is not being
  very angry.
examples:
- Boiling is a quick way to cook eggs in their shells.
- She used boiling to cook the potatoes until they were soft.
