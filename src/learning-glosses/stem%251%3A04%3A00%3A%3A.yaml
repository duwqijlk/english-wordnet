simpleMeaning: a turn in skiing where the back of one ski is pushed out to the side and the other ski
  is brought in line with it
scope: A turn on skis, not the long thin part that holds up a plant and not the tube of a pipe.
examples:
- He made a stem to slow down and turn on the steep snow.
- Learning the stem helped her turn safely on her skis.
