simpleMeaning: the quality of being pleasant because the conditions are good and easy to like
scope: The pleasant quality of a place or set of conditions, not a useful thing given in a building to
  make it nicer to use.
examples:
- She loved the amenity of the quiet, sunny room.
- The amenity of the garden made it a calm place to sit.
