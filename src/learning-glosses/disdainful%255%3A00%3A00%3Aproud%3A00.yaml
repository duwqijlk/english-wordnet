simpleMeaning: acting as if you stand above other people and looking down on those you think are not good
  enough
scope: Acting as if you stand above others and looking down on them; haughty, imperious, and lordly are
  other names for this, not merely showing contempt in words.
examples:
- She gave him a disdainful look.
- He was disdainful of his colleagues' work.
