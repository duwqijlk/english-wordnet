simpleMeaning: a message sent by a ship or plane, known in all countries, asking for help
scope: A message from a ship or plane asking for help, also called a distress call, and not a routine
  message or a warning of bad weather.
examples:
- The pilot sent a distress signal when the radio began to fail.
- Rescue teams answered the distress signal within the hour.
