senseId: 'squelch%1:06:00::'
synsetId: 04300396-n
simpleMeaning: in a receiving set, an electric circuit that shuts off the sound when the signal grows
  too weak to hear over the background hiss
scope: An electric circuit in a receiving set, not a wet squelching sound and not the act of silencing
  someone.
examples:
- The squelch cut in when the signal faded and the hiss took over.
- He turned up the squelch so the radio stayed quiet between calls.
