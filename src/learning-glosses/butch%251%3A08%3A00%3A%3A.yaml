simpleMeaning: a haircut in which the hair is cut very short and close to the head, usually for men or
  boys
scope: A very short haircut, usually for men or boys; not a word for a person and not a word for a male-like
  look or way of acting.
examples:
- He asked the barber to give him a butch for the summer.
- The young boy's butch was cut so short that his ears stood out.
