simpleMeaning: the act of killing a baby on purpose, against the law
scope: The act itself, not the person who murders a baby and not the killing of an older child or an adult.
examples:
- The old king was accused of infanticide after his baby son was found dead.
- In the story, infanticide was a crime punished by death.
