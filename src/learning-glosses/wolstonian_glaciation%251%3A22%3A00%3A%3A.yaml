simpleMeaning: The second-to-last great freeze of the Ice Age in Britain, and the earth and stones left
  by it
scope: The second-to-last great freeze of the Ice Age in Britain, and the earth and stones left by it,
  not the last freeze and not a freeze of another age.
examples:
- The Wolstonian glaciation was the second-to-last great freeze in Britain.
- Stones left by the Wolstonian glaciation still lie in the fields.
