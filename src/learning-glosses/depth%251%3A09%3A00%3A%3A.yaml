simpleMeaning: the skill of getting right inside an idea and seeing far into it
scope: This is a skill of the mind, not the size of a thing in space and not how strong a thought or feeling
  is.
examples:
- She has the depth to take a hard idea apart and see right into it.
- His depth showed when he worked through the idea until he saw all that was in it.
