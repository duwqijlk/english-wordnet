simpleMeaning: a book given to a person who has a checking account (a bank account that lets you pay money
  by writing an order on paper)
scope: This is a book of paper forms for paying from a bank account, not the account itself and not a
  book for writing down daily spending.
examples:
- She took a page from her checkbook to pay the bill.
- He left his checkbook at home and could not pay by check.
