simpleMeaning: Bright blue flowers with yellow centers open on a climbing plant of warm Asia, whose leaves
  are made of small leaflets set along a middle stalk
scope: 'Also called blue pea: a vine of tropical Asia, not the large-flowered wild vine of the United
  States with pale blue flowers and not the one with purple and white flowers.'
examples:
- The butterfly pea climbed the fence and opened its bright blue flowers.
- She planted butterfly pea along the wall for its blue flowers with yellow centers.
