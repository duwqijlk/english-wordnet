simpleMeaning: This snake is found far and wide between the great river in the middle of the country and
  the high mountains in the west
scope: Also called prairie rattlesnake, this snake is found far and wide between the great river in the
  middle of the country and the high mountains in the west, not in the lands beyond them.
examples:
- A prairie rattler crossed the path ahead of us, and we gave it room.
- The prairie rattler lives far and wide across the middle of the country.
