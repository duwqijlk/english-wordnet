simpleMeaning: sticky tape that you put on the skin to cover and protect a cut or wound
scope: This is the sticky tape you put on a cut. It is not the wet mix for walls and ceilings, and not
  a soft heated mass put on the skin to treat pain or swelling.
examples:
- She put a plaster on the small cut on her finger.
- He covered the wound with a plaster to keep it clean.
