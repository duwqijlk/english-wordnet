simpleMeaning: In physics, the fixed number, the same everywhere, that links force to mass and distance
  in Newton's law about the pull between things with mass.
scope: 'Also called constant of gravitation and gravitational constant: in physics, the fixed number linking
  force, mass and distance, not the speed of light and not the pull of one planet alone.'
examples:
- The universal gravitational constant links force to mass and distance in Newton's law.
- Physicists use the universal gravitational constant to work out the pull between two stars.
