simpleMeaning: one of 8 equal parts that make up a whole thing
scope: A share when a whole thing is cut into 8 equal parts; not the place numbered 8 in a list or line
  of things.
examples:
- He ate an eighth of the cake.
- One eighth of the land belongs to her sister.
