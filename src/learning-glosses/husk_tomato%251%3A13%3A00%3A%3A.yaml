simpleMeaning: Wrapped in a thin dry cover that puffs out, this small fruit you can eat is yellow to purple
  and shaped like a small round fruit from the garden.
scope: Also called a tomatillo, this is a small yellow-to-purple fruit in a puffed-out dry cover, not
  the garden fruit it looks like.
examples:
- The husk tomato was yellow inside its dry cover.
- They opened a husk tomato and ate the small fruit inside.
