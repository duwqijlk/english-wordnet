simpleMeaning: A grass of Asia brought into the open grazing lands of the United States for feed for farm
  animals.
scope: Also called intermediate wheatgrass and Agropyron intermedium; a grass of Asia brought into the
  open grazing lands of the United States for feed for farm animals, not a grass native to those lands.
examples:
- Ranchers sow Elymus hispidus for feed on the open lands.
- Elymus hispidus came from Asia to the United States.
