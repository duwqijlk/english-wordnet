simpleMeaning: how quickly red blood cells fall to the bottom of a tube of blood in a set test; a high
  result usually means the body is swollen or sore inside
scope: This is a blood test that shows how quickly red blood cells fall; erythrocyte sedimentation rate
  and sed rate are other names for this sense. Not a count of red blood cells and not a test for one illness.
examples:
- The nurse sent the blood for a sedimentation rate test.
- A high sedimentation rate can point to swelling somewhere in the body.
