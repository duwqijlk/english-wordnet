simpleMeaning: 'two fixed points in physics: light in empty space always moves at the same speed, and
  physics laws stay the same in every steady system'
scope: Also called special relativity and the special theory of relativity, this is a theory in physics
  resting on two fixed points about light speed and physics laws.
examples:
- The special relativity theory says light in empty space always moves at the same speed.
- She read the special relativity theory to learn the two fixed points behind it.
