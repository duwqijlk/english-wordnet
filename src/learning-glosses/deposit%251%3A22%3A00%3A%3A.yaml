simpleMeaning: the natural process by which something is laid down in a place
scope: The natural process of laying something down, not the money put in a bank and not the matter itself
  that is left after this process.
examples:
- Deposit by the river is still going on, with new sand laid down each spring.
- Here deposit happens when the wind drops the dust it carries.
