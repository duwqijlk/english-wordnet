simpleMeaning: a piece of clear glass that sits in a window, one of the parts that make up the whole window
scope: 'Also called a window: one piece of glass in a window, not the thin flat fish of the same name.'
examples:
- The ball shattered the windowpane and the glass fell everywhere.
- She cleaned each windowpane until it shone.
