simpleMeaning: A former United States political group, set up in 1834 against the Democratic group, that
  backed a loose reading of the Constitution and high taxes on goods from abroad
scope: A former United States political group set up in 1834 against the Democratic group, backing a loose
  reading of the Constitution and high taxes on goods from abroad; not the Democratic group itself.
examples:
- The Whig Party opposed the Democratic Party in the 1830s.
- He voted for the Whig Party in 1840.
