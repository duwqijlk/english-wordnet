simpleMeaning: A showy music backing, often made up on the spot, set above a plain tune.
scope: A showy music backing, often made up on the spot, set above a plain tune; also called discant;
  not to sing by changing voice, to sing by yodelling, nor to sing in descant.
examples:
- Their descant soared at dawn.
- The descant was sung at noon.
