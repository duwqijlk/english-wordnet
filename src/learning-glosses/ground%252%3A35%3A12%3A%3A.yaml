senseId: 'ground%2:35:12::'
synsetId: 01409338-v
simpleMeaning: To fling the ball down on purpose so play stops and the thrower avoids being tackled behind
  the line of scrimmage.
scope: This is not the general sense of causing someone or something to fall to the ground, not something
  hitting or reaching the ground on its own, not placing or putting something on the ground, not confining
  someone or something to the ground, not fixing something firmly in place, not teaching someone the basics
  of a subject, not covering a surface with primer, not connecting a device to an electrical ground, not
  using something as a basis, not a baseball hit along the field, and not the noun senses of land or soil,
  a reason for belief, a prepared painting surface, a first coat of paint, an electrical link, or the
  background of a picture.
examples:
- To avoid a sack, the quarterback grounded the ball.
- The coach was furious when his quarterback grounded the ball on third down.
