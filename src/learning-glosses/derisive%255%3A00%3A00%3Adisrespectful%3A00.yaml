simpleMeaning: speaking to someone in a cruel way, and laughing at them to show you think little of them
scope: 'Also called mocking, taunting, jeering and gibelike: speaking cruelly and laughing at someone
  to show you think little of them, not just disagreeing with them or telling a kind joke.'
examples:
- His derisive laughter made her feel small in front of the whole class.
- She gave a derisive shout when he said he could win the race.
