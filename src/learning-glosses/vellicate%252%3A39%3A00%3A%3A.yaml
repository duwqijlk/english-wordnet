simpleMeaning: Unease, laughter, or sudden jerky movements follow when a light touch stirs the nerves
  just under the skin of a part of the body.
scope: Also called tickle and titillate, it names the light touch that stirs the nerves just under the
  skin of a part of the body.
examples:
- A light touch on the ribs can vellicate a person into laughter.
- The light touch on the arm vellicated the child into giggles.
