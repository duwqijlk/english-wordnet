simpleMeaning: having to do with, looking like, or working as a bract, a small leaf-like part at the foot
  of a flower
scope: Of or like a bract, a small leaf-like part at the foot of a flower, not a true leaf and not a petal.
examples:
- The bracteal leaves sit just below the flower head.
- Botanists noted the bracteal scales around the bloom.
