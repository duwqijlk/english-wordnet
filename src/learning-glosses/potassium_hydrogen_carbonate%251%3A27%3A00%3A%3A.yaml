simpleMeaning: A salt made of small crystals, used in baking powder and as a medicine that calms an upset
  stomach
scope: This is a salt used in baking powder and to calm an upset stomach; potassium acid carbonate and
  potassium bicarbonate are other names for it, not baking soda.
examples:
- The cook added potassium hydrogen carbonate to the baking powder.
- Potassium hydrogen carbonate can calm an upset stomach.
