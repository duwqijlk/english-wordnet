senseId: redundant%5:00:02:prolix:00
synsetId: 00552046-s
simpleMeaning: using more words than needed because the same idea is said again in different words
scope: This is about words that say the same idea again in a different way, not about a person or thing
  that is extra and not needed.
examples:
- '''A true fact'' is redundant because a fact is already true.'
- He cut the redundant phrase 'a beginner who has just started' from his writing.
