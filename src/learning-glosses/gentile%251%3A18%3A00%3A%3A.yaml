simpleMeaning: a Christian, who is not a Jew
scope: Also called goy. This is a Christian set against a Jew, not a person outside your own religion
  in the wider Mormon and Hindu use, and not the word for things of non-Jewish peoples.
examples:
- As a gentile, he went to church on Sunday, unlike his Jewish neighbours.
- She is a gentile and a Christian, not a Jew.
