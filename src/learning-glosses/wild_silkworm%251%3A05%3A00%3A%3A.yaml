simpleMeaning: The case it sleeps in is built from a lot of strong thread by the young of a saturniid
  moth, a kind of big moth.
scope: Also called silkworm and giant silkworm, this is the young of a saturniid moth that spins strong
  thread to build the case it sleeps in.
examples:
- The wild silkworm spun strong thread around itself.
- The wild silkworm kept spinning thread to finish its case.
