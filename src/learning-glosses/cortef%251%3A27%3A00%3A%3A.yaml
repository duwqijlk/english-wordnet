simpleMeaning: A body chemical from the outer layer of the adrenal gland, active in how the body handles
  carbohydrate (sugars and starches) and protein.
scope: Also called cortisol, hydrocortisone and Hydrocortone; this is the adrenal-gland chemical that
  acts on sugars and proteins, the one sold under the trade names Hydrocortone and Cortef.
examples:
- Cortef helps the body handle sugars and proteins.
- The doctor prescribed Cortef for the adrenal problem.
