simpleMeaning: Of the group Nyctimene, these fruit-eating bats are the ones whose nostrils stretch out
  into tubes that point away from each other.
scope: Also called harpy, harpy bat, and tube-nosed fruit bat; a fruit-eating bat of the group Nyctimene,
  known by its tube-shaped nostrils.
examples:
- We saw a tube-nosed bat with nostrils like tubes.
- Tube-nosed bats feed on fruit.
