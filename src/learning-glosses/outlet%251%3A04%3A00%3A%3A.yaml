simpleMeaning: something you do that lets your feelings or your urge to make things come out, instead
  of staying locked inside
scope: 'Also called release and vent: something you do to let feelings or creative urges out, not a socket
  in a wall for plugs.'
examples:
- Painting gave her an outlet for her feelings.
- He had no other outlet for his anger.
