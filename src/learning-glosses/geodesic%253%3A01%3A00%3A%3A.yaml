simpleMeaning: Of earth-measuring, or set by it.
scope: This sense is of earth-measuring, or set by it, unlike the sense for, in maths, the shortest line
  between two points on a set surface, as a straight line on a plane, or an arc of a great circle on a
  sphere.
examples:
- The survey was geodesic, of earth-measuring.
- The work was geodesic, set by earth-measuring.
