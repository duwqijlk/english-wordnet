simpleMeaning: One or more computers that work together, with the programs that go with them, all sharing
  the same place to keep data
scope: 'Also called ADPS, automatic data processing system, computer system, and computing system: one
  or more computers and their programs sharing the same place to keep data, not a single computer on its
  own.'
examples:
- The office bought a new ADP system to keep all its records in one place.
- Their ADP system shares one store of data across all the computers.
