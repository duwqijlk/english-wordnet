simpleMeaning: a state that lasts for a short time, in which you cannot sleep or do not want to sleep
scope: 'Also called sleeplessness: a short time when you cannot or will not sleep, not the normal state
  of being awake in the day.'
examples:
- His wakefulness lasted all night, and he got up tired at dawn.
- After the loud noise, a short wakefulness kept her from going back to sleep at once.
