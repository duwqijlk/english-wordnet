simpleMeaning: The power of a mind that makes new things to turn out thoughts and works.
scope: The power of a mind that makes new things to turn out thoughts and works, also called fruitfulness;
  not the state of being able to have children.
examples:
- The fecundity of her imagination showed in story after story.
- His fecundity as a writer was plain in the shelf of books.
