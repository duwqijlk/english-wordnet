simpleMeaning: A commissioned officer in the United States Navy or United States Coast Guard, ranked just
  above an ensign and just below the next higher rank
scope: An officer of the United States Navy or Coast Guard, between the ensign below and the lieutenant
  above; not a lieutenant and not a lieutenant commander.
examples:
- The lieutenant junior grade reported to the captain.
- He was made a lieutenant junior grade after training.
