simpleMeaning: To send what is in your stomach back up and out through your mouth.
scope: This is throwing up, also called sick, cat, cast, vomit, puke, chuck, purge, retch, or spew, not
  the cry of a goose.
examples:
- After the long boat ride, he honked over the side.
- She honked into the sink after eating too much.
