senseId: 'delta%1:17:00::'
synsetId: 09287709-n
simpleMeaning: a low area of land with three sides, made of soil left by a river where it splits before
  it flows into a larger body of water
scope: Land where a river splits and leaves soil before a larger body of water, not an object shaped like
  a triangle with three equal sides.
examples:
- The Nile delta is rich land for farming.
- Boats passed through the wide delta before reaching the sea.
