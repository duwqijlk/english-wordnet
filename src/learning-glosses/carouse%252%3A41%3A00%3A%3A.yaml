simpleMeaning: to take part in loud, wild fun while drinking a lot of alcohol
scope: This is loud, wild fun with a lot of drinking, also called riot and another name for it is roister;
  it is not quiet drinking alone.
examples:
- They caroused all night with loud music and a lot of beer.
- The young men were carousing in the street after the match.
