simpleMeaning: A metal made from iron, with 10 to 14 parts in a hundred of another metal, that stands
  up very well to wear and shock
scope: This is a metal made from iron, with 10 to 14 parts in a hundred of another metal, that stands
  up very well to wear and shock; manganese steel is another name for it, not ordinary iron and not a
  soft metal that wears out fast.
examples:
- Austenitic manganese steel stands up well to wear and shock.
- The crusher was made from austenitic manganese steel because it resists hard knocks.
