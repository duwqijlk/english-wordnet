simpleMeaning: a close look at two things side by side, to weigh them against each other with care
scope: A careful side-by-side comparison, not a clash of ideas or opinions.
examples:
- The confrontation of the two plans showed which one cost less.
- A close confrontation of the drafts made the differences clear.
