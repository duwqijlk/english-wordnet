simpleMeaning: a basketball throw from the line that no one may block, given because the other side broke
  a rule
scope: This is a free throw in basketball from the line, given when the other side breaks a rule; charity
  shot, charity throw, charity toss, free throw and penalty free throw are other names for it, not an
  ordinary throw during play.
examples:
- He made both foul shots to win the game.
- She sank a foul shot with seconds left.
