simpleMeaning: The everyday way of speaking of people born in Newcastle-upon-Tyne, not the standard form
  of English.
scope: This is the everyday way of speaking of people born in Newcastle-upon-Tyne, not the standard form
  of English and not the way of speaking heard in London.
examples:
- He spoke broad Geordie at home.
- Geordie words sound strange to outsiders.
