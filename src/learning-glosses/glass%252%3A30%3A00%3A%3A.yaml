simpleMeaning: to turn smooth, hard and shiny with a clear, see-through surface
scope: This is a surface changing by itself; it is not the act of putting something into a container,
  and it is not fitting panes into a building.
examples:
- Her eyes glassed over and she stopped listening to the lecture.
- By morning the puddles had glassed over with ice.
