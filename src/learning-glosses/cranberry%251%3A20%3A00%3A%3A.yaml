simpleMeaning: any of many bushes in the group Vaccinium, a set of closely related plants, that bear small
  sour red berries
scope: This is the bush that bears the fruit, not the small sour red berry itself that is used for sauce
  or juice.
examples:
- The cranberry is a low bush that grows in wet ground.
- These cranberry bushes bear fruit in the fall.
