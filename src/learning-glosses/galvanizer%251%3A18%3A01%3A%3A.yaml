simpleMeaning: a person with skill in the trade of putting zinc over iron or steel
scope: Another name for this worker is galvaniser; the work is coating metal with zinc, not making steel
  and not selling metal goods.
examples:
- The galvanizer lowered the iron gate into the zinc bath.
- The galvanizer wore thick gloves while he coated the steel pipes.
