simpleMeaning: A catching sickness caused by a germ, this is a gentler kind of the spots sickness, lasting
  a short while, that can harm a baby in the womb early on.
scope: Also called rubella or epidemic roseola, this catching sickness is a gentler kind of the spots
  sickness that can harm a baby in the womb.
examples:
- The child caught three-day measles and felt ill for a short while.
- A mother with three-day measles feared for her baby in the womb.
