senseId: 'grammatical%3:00:00::'
synsetId: 01149515-a
simpleMeaning: following the rules of a language and the way of using it that people accept when it is
  the language they grew up with
scope: This describes speech or writing that follows the rules of the language; it is not the sense that
  means about the rules themselves as a subject.
examples:
- She spoke in grammatical sentences, and everyone understood her.
- He checked that every sentence in his letter was grammatical.
