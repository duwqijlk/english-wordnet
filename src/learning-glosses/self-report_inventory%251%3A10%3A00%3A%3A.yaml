simpleMeaning: From a list of traits, the person says which ones fit them and which acts and choices they
  would make in imagined cases, answering questions about their own character.
scope: Also called self-report personality inventory, this is a set of questions a person answers about
  their own character.
examples:
- She filled in a self-report inventory about her own character.
- The self-report inventory asked which traits fit him best.
