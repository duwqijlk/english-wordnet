simpleMeaning: a strong cut made by moving a sharp tool across something in one sweep
scope: 'Also called slash: a strong cut made by a sharp tool, not a long deep line in the ground made
  by water or digging.'
examples:
- With one sweep of the knife, he made a gash in the thick rope.
- She cut a gash across the cardboard with a sharp blade.
