simpleMeaning: curled or wound into rings or a winding curve, especially rings one inside another or a
  curve that keeps turning round a center
scope: Curled round in rings or curves, not straight and not stretched out in a line.
examples:
- A coiled snake sat ready to strike.
- The rope lay coiled on the floor of the boat.
