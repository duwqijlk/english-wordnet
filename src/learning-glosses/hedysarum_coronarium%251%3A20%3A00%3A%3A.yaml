scope: A plant grown for animal feed and honey; sulla and French honeysuckle are other names for this
  sense, not a clover grown for hay or a garden flower grown only for show.
examples:
- The farmer planted Hedysarum coronarium along the field edge for his bees.
- Bees worked the pink Hedysarum coronarium flowers all morning.
