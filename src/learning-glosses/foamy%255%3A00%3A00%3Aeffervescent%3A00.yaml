simpleMeaning: giving off or full of bubbles, as from gas in a liquid or from a liquid turning fizzy as
  it ferments
scope: Giving off or full of bubbles, as from gas in a liquid or from a liquid turning fizzy as it ferments,
  also called bubbling and foaming, not the soapy sweat of a sick or tired animal.
examples:
- The foamy beer rose over the rim of the glass.
- She poured the foamy champagne into tall glasses.
