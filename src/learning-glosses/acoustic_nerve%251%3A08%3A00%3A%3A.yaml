simpleMeaning: the tiny hairs of the balance organ and the hearing part of the inner ear are served by
  this sense cord, made of many strands
scope: The auditory nerve, the eighth cranial nerve, the vestibulocochlear nerve, and the nervus vestibulocochlearis
  are other names for this sense cord, the one that lets the ear report sound and balance.
examples:
- The acoustic nerve carries sounds from the inner ear.
- The acoustic nerve carries the sense of balance from the inner ear.
