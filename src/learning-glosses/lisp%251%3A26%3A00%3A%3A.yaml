simpleMeaning: a problem with speaking in which a person says the s sound like the th in think, and the
  z sound like the th in this
scope: A fault in how sounds are said, not a problem with choosing words and not a problem with the voice
  itself.
examples:
- He has a lisp, so 'sun' sounds like 'thun' when he says it.
- Her lisp makes her z sound come out like the th in 'this'.
