simpleMeaning: A group that helps in war by giving knowledge about places, to keep the United States safe.
scope: This word is for the support group behind the fighting forces, not for the fighting forces themselves.
examples:
- The National Geospatial-Intelligence Agency gave the troops maps of the area.
- Reports from the National Geospatial-Intelligence Agency helped plan the mission.
