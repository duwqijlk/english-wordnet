simpleMeaning: to decide in advance by the will or order of God
scope: 'Also called foreordain: to decide in advance by the will of God, not just to decide a plan in
  advance for any other reason.'
examples:
- Many believers thought their lives were predestined by God.
- She believed God had predestined her to help others.
