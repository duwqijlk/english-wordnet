simpleMeaning: A slow fall in amount, as in the power held in a battery or in a flow of electric current.
scope: A slow fall in amount, as in power held in a battery, also called a decline, not the rotting of
  once-living things and not the weak state left behind.
examples:
- The decay of the battery's charge left the torch dim.
- Engineers measured the decay of the current in the wire.
