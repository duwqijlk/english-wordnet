simpleMeaning: to lose its clear shape and little by little mix in with what is around it
scope: To lose a clear shape and mix in slowly, not to turn from a solid into a liquid and not to become
  hard to see and go from sight.
examples:
- The actors melted into the background and looked like part of the scene.
- At the edges, the dark colours melted into each other.
