simpleMeaning: A substance made of only carbon and hydrogen joined together, and nothing else
scope: This is a chemical made only of carbon and hydrogen; it is not a chemical that also has oxygen
  or other things in it.
examples:
- Methane is a simple hydrocarbon made of carbon and hydrogen.
- Oil is a mix of many kinds of hydrocarbon, each with only carbon and hydrogen in it.
