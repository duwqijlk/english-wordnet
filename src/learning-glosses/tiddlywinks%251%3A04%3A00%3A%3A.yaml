simpleMeaning: A game in which players press small plastic discs sharply on one side with a bigger disc,
  so the discs flip into a cup
scope: A game in which players press small plastic discs sharply on one side with a bigger disc, so the
  discs flip into a cup, not a board game with dice and not a card game.
examples:
- The children played tiddlywinks after lunch.
- She won at tiddlywinks by flipping the last disk into the cup.
