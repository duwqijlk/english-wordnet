simpleMeaning: Usually in thin orange or yellow flakes, but sometimes bleached white, this is lac made
  pure by heating and straining it.
scope: Lac made pure by heating and straining, not the thin varnish made from it and not the act of covering
  a thing with it.
examples:
- He bought shellac in thin orange flakes.
- The shellac was bleached white for the pale wood.
