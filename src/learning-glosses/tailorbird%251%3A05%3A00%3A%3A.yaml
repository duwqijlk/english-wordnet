simpleMeaning: A warbler from warm parts of Asia that builds a hidden nest by sewing leaves together.
scope: This is a tropical Asian warbler that sews leaves together to make and hide its nest, not a weaver
  and not a sparrow.
examples:
- The tailorbird sewed leaves into a pouch for its nest.
- A tailorbird hid its nest among the leaves.
