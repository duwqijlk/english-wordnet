simpleMeaning: 'Because of hormone troubles or removal of the testes, a man grows female traits, such
  as losing face hair or growing breasts: the process of becoming more female.'
scope: Feminization is another name for this process, which takes place in a man, not in a woman.
examples:
- His feminisation came from hormone troubles.
- The feminisation showed in the loss of his facial hair.
