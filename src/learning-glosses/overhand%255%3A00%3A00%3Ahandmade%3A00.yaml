simpleMeaning: sewn together with close upright stitches that go over the edges and pull the two edges
  together
scope: This means sewn with close stitches that go over the edge, also called oversewn; it is not a throw
  or a hit made with the hand held high.
examples:
- She joined the cloth with neat overhand stitches.
- The seam was made in an overhand way, with each close stitch going over the edge.
