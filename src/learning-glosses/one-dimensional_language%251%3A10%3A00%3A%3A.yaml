simpleMeaning: A way of giving orders to a computer, where each order is written as a line of letters
  and signs
scope: A way of giving orders to a computer in lines of letters and signs, not a way of drawing orders
  as pictures and not a way of speaking to a person.
examples:
- Most one-dimensional languages write each order as a single line of text.
- In a one-dimensional language, the order runs left to right in one line.
