simpleMeaning: Thin cuts of beef fried quickly with green capsicum, the fruit of a garden plant, and onions.
scope: Thin cuts of beef fried quickly with green capsicum and onions, not a steak covered in crushed
  peppercorns and not plain fried beef with no vegetables.
examples:
- We ordered pepper steak with rice for supper.
- The pepper steak came with green capsicum and onions.
