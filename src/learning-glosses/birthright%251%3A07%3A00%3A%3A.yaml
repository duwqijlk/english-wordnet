simpleMeaning: a right or special advantage that you have from the time you were born
scope: This is a right or special advantage you have because you were born; it is not property or money
  that passes to you by birth, especially to the oldest child.
examples:
- Free schooling is the birthright of every child in the country.
- He saw the vote as the birthright of every adult citizen.
