senseId: 'contact_print%1:06:00::'
synsetId: 03098998-n
simpleMeaning: a picture made by putting a piece of film right against a surface that reacts to light
  and letting light shine through it
scope: This is a picture made by direct touch between film and a light-reacting surface, not a picture
  made bigger in a darkroom and not a copy made by a printer.
examples:
- She made a contact print by pressing the negative against the paper.
- The contact print showed all twelve frames at the same size as the film.
