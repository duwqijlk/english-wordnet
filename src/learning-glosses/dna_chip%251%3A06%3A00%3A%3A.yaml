simpleMeaning: A small plate holding probes of the material in cells that carries the body's instructions,
  which form half of its double twist and can spot it in samples being tested.
scope: 'Also called gene chip: a small plate that holds DNA probes which form half of the DNA double helix,
  not a plate that holds whole genes.'
examples:
- The DNA chip held DNA probes that form half of the DNA double helix.
- A DNA chip can spot DNA in samples being tested.
