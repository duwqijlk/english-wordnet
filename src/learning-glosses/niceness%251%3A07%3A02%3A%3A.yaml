simpleMeaning: a polite way of behaving that follows the rules people in a place accept for how to act
scope: 'Also called politeness: a polite way of acting that fits what people around you expect; not just
  being kind or friendly in any way you like.'
examples:
- Her niceness showed in the way she greeted every guest and thanked them warmly.
- There was a quiet niceness in how he spoke to older people, always waiting for his turn to speak.
