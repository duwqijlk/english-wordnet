simpleMeaning: a private sitting room next to a room where laws are made, for the people who make laws
scope: A private sitting room next to the main law-making room, for the people who work there; not a room
  where coats and bags are left, and not the main room itself.
examples:
- The senators talked in the cloakroom before the vote.
- Two senators stepped into the cloakroom to rest away from the main room.
