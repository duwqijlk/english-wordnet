simpleMeaning: a box or open frame that moves up and down by machine in a tall straight shaft in a building
  to take people between floors
scope: 'Also called a lift: a box that moves people up and down in a building, not the flat part on the
  back wing of a plane that makes it go up or down.'
examples:
- We took the elevator to the tenth floor.
- The elevator stopped between floors and the doors stayed shut.
