simpleMeaning: A light silver-white metal, pulled thin, that joins two atoms; pure, it burns with a white
  flame, and is found in nature only in magnesite, dolomite, carnallite, spinel and olivine
scope: This metal is also called magnesium and atomic number 12; it is not calcium and not another light
  metal.
examples:
- Mg burns with a bright white flame.
- The alloy contained Mg and aluminium.
