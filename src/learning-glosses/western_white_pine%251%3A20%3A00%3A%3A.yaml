simpleMeaning: in the west of North America grows this tall pine with thick blue-green needles; its bark,
  once full grown, is grey-brown and split into four-sided plates
scope: Also called mountain pine or silver pine; a tall pine of the west of North America with thick blue-green
  needles, not an eastern white pine.
examples:
- The western white pine towered over the slope, its needles thick and blue-green.
- A western white pine's bark had split into grey-brown plates.
