simpleMeaning: One part of an animal's body that does a particular job or is fed by a certain blood vessel
  or nerve.
scope: It is not a large area of land or a part of a country; it is a part of a living body.
examples:
- This region of the brain controls speech.
- The nerves in that region of the leg were damaged.
