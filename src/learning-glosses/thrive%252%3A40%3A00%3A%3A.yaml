simpleMeaning: to make steady progress, and to be at the highest point in your working life or to reach
  the highest point of importance in history
scope: 'Another name for this sense is flourish: this means making steady progress, or being at the highest
  point in your working life or in history, not just staying alive or growing.'
examples:
- The new student is thriving and making steady progress at school.
- In those years the city thrived and reached its highest point of importance.
