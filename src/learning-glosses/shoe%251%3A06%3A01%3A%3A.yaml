simpleMeaning: A flat piece bent into a U and fixed with nails under a horse's hoof.
scope: This is another name for the horseshoe, the plate nailed under a horse's hoof, not footwear worn
  on a person's foot and not the brake part that slows a wheel.
examples:
- The farrier fitted a new shoe on the mare's front hoof.
- A loose shoe made the horse favor its left leg.
