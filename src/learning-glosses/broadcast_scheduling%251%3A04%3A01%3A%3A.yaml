simpleMeaning: Shows sent out on television, radio, the Internet and the like are put in order for a day,
  a week, a month, a quarter or a season.
scope: Also called broadcast programming, this is the putting of shows sent out on television, radio and
  the Internet in order for a day, a week, a month, a quarter or a season; other kinds of planning for
  what goes on the air are its nearest rivals.
examples:
- Broadcast scheduling puts the shows in order for the coming week.
- Broadcast scheduling is the work of putting shows in order for each day and week.
