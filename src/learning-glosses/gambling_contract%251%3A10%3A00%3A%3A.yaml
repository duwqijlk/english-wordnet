simpleMeaning: A deal in which one side must do what it promised only if a bet comes out a certain way;
  the law in most places will not make it stand.
scope: This is a deal that holds only if a bet comes out a certain way, and the law in most places will
  not make it stand; not a plain deal, and not a bet on its own.
examples:
- The gambling contract could not be made to stand in court.
- He signed a gambling contract tied to the race result.
