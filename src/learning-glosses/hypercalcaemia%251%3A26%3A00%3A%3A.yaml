senseId: 'hypercalcaemia%1:26:00::'
synsetId: 14292125-n
simpleMeaning: Abnormally high calcium in the blood, usually from too much bone breakdown in hyperparathyroidism
  or Paget's disease.
scope: Blood carrying more calcium than it should is this condition, also called hypercalcemia, not blood
  carrying too little.
examples:
- The blood held too much calcium, a sign of hypercalcaemia.
- Hypercalcaemia most often comes from bone breaking down too fast.
