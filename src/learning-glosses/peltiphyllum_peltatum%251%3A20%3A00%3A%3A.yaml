simpleMeaning: A long-lived herb with underground stems, large striking shield-shaped leaves and white
  to bright pink flowers in round heads on bare stems, along stream banks in California's Sierra Nevada.
scope: A streamside herb with shield-shaped leaves, also called umbrella plant, Darmera peltata and Indian
  rhubarb.
examples:
- Peltiphyllum peltatum grew thick along the stream bank.
- The pink flower heads of Peltiphyllum peltatum rose on bare stems.
