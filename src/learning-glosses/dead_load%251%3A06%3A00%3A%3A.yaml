simpleMeaning: the weight of a bridge or other built thing pressing down on itself all the time
scope: The steady weight of a bridge or building pressing down on itself, not the weight of people, cars,
  or goods carried on it, and not a sudden wind or earthquake force.
examples:
- The dead load of the old bridge included its steel beams and concrete deck.
- Engineers must count the dead load before they add the weight of traffic.
