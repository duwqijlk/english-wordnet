simpleMeaning: A fishtail palm from India through the Malay Peninsula whose sap gives a brown sugar called
  jaggery, while the soft inner trunk yields sago.
scope: This fishtail palm is also called kitul, kitul tree and jaggery palm; it is not the sago palm or
  the sugar palm.
examples:
- The sap of the kittul yields a brown sugar.
- Sago comes from the pith of the kittul.
