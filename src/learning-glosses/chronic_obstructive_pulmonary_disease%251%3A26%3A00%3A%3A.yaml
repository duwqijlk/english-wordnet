simpleMeaning: Broken air sacs and long-lasting swollen airways that block the air make up a lung sickness
  that cannot be undone; usually the sick person smoked a lot of cigarettes
scope: This lung sickness is made of broken air sacs and long-lasting swollen airways that block the air
  and cannot be undone; not emphysema on its own and not bronchitis on its own.
examples:
- Chronic obstructive pulmonary disease made it hard for him to breathe.
- She has chronic obstructive pulmonary disease after years of heavy smoking.
