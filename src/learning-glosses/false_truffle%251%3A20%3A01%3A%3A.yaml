simpleMeaning: Bodies with tough skins grow under the ground and look like the round fungi people eat;
  they are one of several kinds of fungi in the group Scleroderma.
scope: Puffball, earthball, and hard-skinned puffball are other names for this fungus, which only looks
  like the round fungi people eat.
examples:
- The false truffle grew under the soil, out of sight.
- She dug up a false truffle and mistook it for the real thing.
