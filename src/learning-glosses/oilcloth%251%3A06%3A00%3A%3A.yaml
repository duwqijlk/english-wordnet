simpleMeaning: Cloth with a coat on one side of oil that dries, or of resin, a man-made substance
scope: Cloth with oil that dries, or a man-made covering like it, on one side; not plain cloth with nothing
  on it and not a sheet made only of plastic.
examples:
- She covered the table with oilcloth.
- The old oilcloth on the floor had a bright flower pattern.
