simpleMeaning: A flower head like a thistle head (a wild plant with sharp leaves), and people eat its
  thick soft leaves and its soft middle
scope: This is the flower head eaten as food, not the whole plant that it grows on.
examples:
- She cooked an artichoke and ate the soft leaves.
- He put artichoke hearts in the salad.
