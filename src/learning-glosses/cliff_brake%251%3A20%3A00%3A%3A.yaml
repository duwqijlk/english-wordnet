simpleMeaning: Any one of several small ferns that grow on rocks, found in hot lands and in lands with
  mild winters.
scope: Any one of several small ferns that grow on rocks in hot lands and in lands with mild winters,
  also called cliff-brake; not a fern that grows in soil and not a moss.
examples:
- The cliff brake clung to the damp rock face.
- They found a cliff brake growing from a crack in the stone.
