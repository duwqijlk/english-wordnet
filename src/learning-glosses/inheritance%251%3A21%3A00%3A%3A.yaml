simpleMeaning: 'What is passed on when a person dies: a title, land, or goods that go by law to the heir.'
scope: A title, land, or goods that pass by law to the heir when the owner dies, also called heritage,
  not a gift of mind passed down, and not traits passed on by birth.
examples:
- The house was part of his inheritance from his father.
- She lost the inheritance to her cousin in the will.
