simpleMeaning: the gain a firm gives up by putting its money into one plan, the same gain it could have
  made from another plan with the same risk
scope: The gain a firm gives up by choosing one use for its money, also called capital cost, and not the
  price paid for a loan or the firm's total spending.
examples:
- The cost of capital helped the board see what the new factory would really give up.
- She worked out the cost of capital before the firm chose between the two plans.
