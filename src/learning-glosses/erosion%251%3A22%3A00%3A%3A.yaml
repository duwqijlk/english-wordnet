simpleMeaning: In geology, the physical action of wearing or grinding something down, as by small pieces
  washing over it; also used in a wider, not literal way about other things
scope: 'Also called wearing, eroding, eating away and wearing away: the physical wearing down of rock
  or land, not wearing down by chemicals.'
examples:
- Erosion by the river slowly wore away the banks.
- Wave erosion ground down the rocks along the coast.
