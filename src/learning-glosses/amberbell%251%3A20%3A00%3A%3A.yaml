simpleMeaning: Marked brown or purple, with spots inside, one yellow flower at a time opens on this dogtooth
  of the east of North America.
scope: Also called trout lily and yellow adder's tongue, this eastern North American dogtooth bears single
  yellow flowers marked brown or purple.
examples:
- The amberbell opened its yellow flower.
- Brown marks showed on the amberbell's flower.
