simpleMeaning: A liquid made of copper sulfate, potassium tartrate and sodium hydroxide, used to test
  urine for sugar; it turns reddish when sugar is there.
scope: A chemical test liquid for finding sugar in urine, made from copper sulfate, potassium tartrate
  and sodium hydroxide, and known by the reddish colour it turns when sugar is present.
examples:
- The nurse used Fehling's solution to test the urine for sugar.
- Fehling's solution turned red, showing sugar was present.
