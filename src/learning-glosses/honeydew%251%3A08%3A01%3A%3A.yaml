simpleMeaning: A sticky liquid full of sugar, given off by plant lice and some scale bugs as they feed
  on plant sap.
scope: A sweet, sticky liquid left by plant lice as they feed; not the melon of the same name, a large
  smooth greenish-white melon with pale green flesh.
examples:
- Honeydew from the aphids made the leaves sticky.
- Bees gather honeydew and turn it into a dark, strong honey.
