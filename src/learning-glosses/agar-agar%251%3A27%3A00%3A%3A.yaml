simpleMeaning: a jelly-like stuff got from sea plants, used above all to grow germs on and to set foods
scope: A jelly-like stuff got from sea plants, used to grow germs on and to set foods; agar is another
  name for this, not animal gelatin and not seaweed itself.
examples:
- She set the jelly with agar-agar.
- The lab grew the germs on agar-agar.
