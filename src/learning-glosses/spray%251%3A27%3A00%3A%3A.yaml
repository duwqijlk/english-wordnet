simpleMeaning: small drops of water in the air, thrown up from waves or from falling water
scope: Small drops of water in the air thrown up from waves or falling water, not a bunch of flowers on
  one stem and not a bottle that turns liquid into a fine mist.
examples:
- Spray from the sea wet our coats.
- We felt the spray of the waterfall on our faces.
