simpleMeaning: The power needed to pull bits apart from a molecule, atom, or nucleus; it matches the loss
  of mass
scope: 'Also called binding energy: the power needed to pull bits apart from a molecule, atom, or nucleus,
  not the power of a moving thing and not heat.'
examples:
- The separation energy of the atom is high.
- Physicists measure the separation energy needed to pull bits apart.
