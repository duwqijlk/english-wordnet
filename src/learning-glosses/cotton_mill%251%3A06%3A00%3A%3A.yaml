simpleMeaning: a factory where cloth is made from the soft fiber that grows on a plant
scope: A factory that makes cloth from the soft plant fiber, not a factory that makes cloth from wool
  or flax and not a shop that sells cloth.
examples:
- The cotton mill in town makes cloth from raw cotton.
- Hundreds of workers in the cotton mill run the machines that spin and weave the cloth.
