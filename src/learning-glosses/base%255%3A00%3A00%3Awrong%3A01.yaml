simpleMeaning: Not following standards of right and wrong; unethical.
scope: This judges conduct, motives, or practices as morally bad, not the adjective sense meaning forming
  a foundation, not the adjectives meaning of low birth, of inferior metal, lacking honor, illegitimate,
  or fake, not the noun senses for a support or foundation or a structure's lowest support, the bottom
  or lowest part of a thing, the flat underside on which an object sits, the lower side of a geometric
  figure, a lower limit, the basic assumptions something is developed from, the most important or necessary
  part of something, the attachment end of an organ, a military installation or the place a mission starts
  from, a baseball runner's station, a word's root form, a DNA or RNA unit, a chemical alkali, the middle
  element of a transistor, the number a counting system is built on, a country's stock of facilities and
  equipment, or the main ingredient of a mixture, and not the verb uses meaning to found something on,
  to set up a center of operations, or to smoke cocaine.
examples:
- He was driven by base motives and cared nothing for the people he cheated.
- The court called the fraud a base betrayal of the families who trusted him.
