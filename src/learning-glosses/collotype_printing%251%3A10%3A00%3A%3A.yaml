simpleMeaning: By light and machine, a glass plate coated with a jelly-like layer that holds the image
  to be copied prints pictures in one colour or more
scope: Also called collotype and photogelatin process, this printing process uses a glass plate coated
  with a jelly-like layer to copy pictures in one colour or more.
examples:
- They used collotype printing to copy the picture.
- The printer chose collotype printing for the picture.
