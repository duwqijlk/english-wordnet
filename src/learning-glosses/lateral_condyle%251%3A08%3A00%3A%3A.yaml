simpleMeaning: a round knob at the lower end of the thigh bone, on its outer side
scope: A round knob at the end of the thigh bone, on the outer side, not the inner side and not the small
  bump near it.
examples:
- The doctor pointed to the lateral condyle on the outer side of the knee.
- A break near the lateral condyle can make the knee hard to bend.
