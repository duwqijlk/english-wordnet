simpleMeaning: The sticky juice of this American mint once kept the body from shaking, above all in earlier
  times.
scope: Also called mad-dog weed, blue pimpernel, and blue skullcap, this is a mint from America whose
  juice once kept shaking bodies still.
examples:
- They gave mad-dog skullcap to someone whose body would not stop shaking.
- They gathered mad-dog skullcap for its sticky juice.
