senseId: 'break%1:11:04::'
synsetId: 07312251-n
simpleMeaning: a sudden shift in how the voice sounds or in its pitch range, as when a boy's voice deepens
  or when feelings take over
scope: This is a change in how a voice sounds, not a pause in an activity and not a split between people.
examples:
- The break in his voice betrayed how nervous he was.
- The choir director noticed a break in the soprano's voice on the high note.
