simpleMeaning: a small citrus tree or shrub bearing flattened round fruit with very sweet fragrant flesh
  and thin, loose yellow-orange peel that comes off easily; native to southeastern Asia.
scope: Another name for mandarin and mandarin orange tree; this is the tree that produces the fruit, not
  the reddish-orange citrus fruit itself.
examples:
- The mandarin orange in our garden bloomed early this year.
- A young mandarin orange can reach two metres in height.
