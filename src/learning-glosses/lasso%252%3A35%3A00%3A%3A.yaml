simpleMeaning: to catch something by throwing a rope with a loop at one end around it
scope: This is catching something with a rope loop. It is not the rope itself, which has the same name,
  and not catching with your hands.
examples:
- The cowboy lassoed the runaway cow.
- She learned to lasso horses on the farm.
