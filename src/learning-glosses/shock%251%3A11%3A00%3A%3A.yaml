simpleMeaning: The ground lurching once as the earth's crust shakes.
scope: This is the earthquake tremor, not an electric jolt, a vehicle's damper, or a sudden fright.
examples:
- The first shock of the earthquake came shortly after noon.
- A second shock woke everyone in the village before dawn.
