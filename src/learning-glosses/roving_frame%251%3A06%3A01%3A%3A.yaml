simpleMeaning: a cloth-making machine that turns a thin rope of loose fibres into a strand ready to be
  spun into thread
scope: 'Also called a fly frame, a simplex machine and a speed frame: a machine that gets loose fibres
  ready for spinning into thread, not a loom that weaves cloth and not a spinning wheel that makes thread
  from the strand.'
examples:
- The roving frame drew the sliver out into a fine strand.
- In the mill, the roving frame prepared the fibres before they were spun.
