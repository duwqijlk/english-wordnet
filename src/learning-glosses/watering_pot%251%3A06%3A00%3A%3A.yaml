simpleMeaning: a vessel with a handle and a spout that ends in a head with small holes, used to give plants
  a fine spray of liquid
scope: 'Also called a watering can: a vessel for wetting plants, not a hose and not a cart with a tank
  for roads.'
examples:
- She keeps a watering pot by the back door for the herbs.
- He filled the watering pot and gave the roses a fine spray.
