simpleMeaning: Two hard, bony parts that hang down from the main part of a bone at the base of the skull
scope: Two bony parts that hang down from a bone at the base of the skull, not the jaw muscle that starts
  there and not the whole bone itself.
examples:
- The pterygoid process can be seen on each side of the skull base.
- The jaw muscle starts on the pterygoid process.
