simpleMeaning: To turn the telescope of a land-measuring tool over on its side bar so that it points the
  other way.
scope: Turning the telescope of a land-measuring tool to point the other way, not moving people or goods
  and not the tool itself.
examples:
- He transited the telescope to take a reading in the other direction.
- The surveyor transited the instrument and looked back along the line.
