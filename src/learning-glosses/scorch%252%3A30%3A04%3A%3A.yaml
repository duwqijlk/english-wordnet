simpleMeaning: to become burned a little on the outside in very strong heat or in dry conditions
scope: This is a thing itself getting burned a little in strong heat; it is not burning another thing
  a little, and not a plant disease that turns plant parts brown.
examples:
- The grass scorched in the hot summer sun.
- The tree by the road scorched under the strong heat.
