simpleMeaning: A belief that calls for sweeping away both rule by a state and private hold over the things
  used to make goods.
scope: Under this belief, also called collectivist anarchism, both rule by a state and private hold over
  the things used to make goods would be swept away.
examples:
- They talked about anarcho-collectivism as a call to end the state and private hold over the things used
  to make goods.
- In the debate, anarcho-collectivism was set against the rule of the state.
