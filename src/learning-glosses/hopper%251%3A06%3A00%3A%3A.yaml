simpleMeaning: a container shaped like a wide top narrowing down, from which what is inside falls down
  into a container below
scope: This is a container that lets things fall through into one below, not the jumping insect that eats
  plants.
examples:
- He filled the hopper with grain, and it fell into the machine below.
- The hopper emptied its stones into a bin underneath.
