simpleMeaning: Any one of a group of animals that holds monkeys, apes, and human-like beings
scope: Any one of a group of animals that holds monkeys, apes, and human-like beings, not a monkey alone
  and not a four-legged animal outside the group.
examples:
- An anthropoid swung through the trees.
- Anthropoids include monkeys, apes, and humans.
