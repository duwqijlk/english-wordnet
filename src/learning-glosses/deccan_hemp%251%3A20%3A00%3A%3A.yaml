simpleMeaning: A useful plant grown for its fibres, from the East Indies and now grown widely.
scope: A useful plant grown for its fibres, from the East Indies and now grown widely; bimli, bimli hemp,
  kanaf and kenaf are other names for it, not cotton and not jute.
examples:
- Deccan hemp is grown for its fibres.
- Farmers grow deccan hemp in many lands.
