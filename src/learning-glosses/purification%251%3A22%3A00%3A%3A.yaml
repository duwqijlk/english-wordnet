simpleMeaning: the process of taking out the unwanted substances from something, such as oil, metals,
  or sugar
scope: 'Also called refinement and refining: cleaning a substance such as oil or sugar by taking things
  out of it; not the cleansing of sin and not a religious ceremony.'
examples:
- The purification of the oil takes several days.
- The purification of the sugar takes out unwanted substances before it is sold.
