simpleMeaning: Lying face down, an acrobat bends the body and the knees so far that the toes touch the
  head.
scope: It is a feat done lying face down, bending the body and knees until the toes touch the head, not
  one done standing up.
examples:
- The acrobat's back circle ended with her toes touching her head.
- She practised the back circle until her toes reached her head.
