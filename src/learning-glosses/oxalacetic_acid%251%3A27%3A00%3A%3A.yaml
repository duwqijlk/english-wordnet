simpleMeaning: Maleic acid takes up oxygen to make this acid, which is at work in the body as fats and
  carbohydrates are broken down.
scope: This acid is also called oxaloacetic acid, and it is made when maleic acid takes up oxygen.
examples:
- The oxalacetic acid forms when maleic acid takes up oxygen.
- The body uses oxalacetic acid when it breaks down carbohydrates.
