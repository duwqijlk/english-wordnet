simpleMeaning: used to describe a person or thing that has a high position or is important
scope: This describes a person or thing with a high position or that is important. It is not the sense
  about very good quality, and not the fighter who can beat rivals.
examples:
- A superior officer gave the order to the soldiers.
- The king was a superior ruler with great power over the land.
