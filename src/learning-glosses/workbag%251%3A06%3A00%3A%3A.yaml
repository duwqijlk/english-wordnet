simpleMeaning: a bag or box for keeping tools and things you need for work, especially for sewing
scope: 'Also called workbasket: this is a bag or box for tools and work things, especially for sewing,
  not a bag for carrying work to an office.'
examples:
- She kept her needles and thread in her workbag.
- He took scissors and cloth from the workbag.
