simpleMeaning: A drug used to treat poor blood flow in the legs, thought to make red blood cells bend
  so they can pass through blood tubes to the legs and feet.
scope: A drug for poor blood flow in the legs, also called pentoxifylline, thought to help red blood cells
  bend so they reach the legs and feet.
examples:
- The doctor gave her Trental for the pain in her legs.
- Trental is taken to help blood reach the legs and feet.
