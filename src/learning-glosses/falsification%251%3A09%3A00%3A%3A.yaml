schema: oewn-learning-gloss-v2
senseId: 'falsification%1:09:00::'
synsetId: 05834793-n
simpleMeaning: Things or facts that help to show that something is not true
scope: Things or facts that help to show that something is not true; this is the evidence itself, not
  the act of changing a thing or a paper to make others believe what is not true.
examples:
- The new test results were a clear falsification of his claim.
- The letters she had kept were a falsification of the story he had told.
