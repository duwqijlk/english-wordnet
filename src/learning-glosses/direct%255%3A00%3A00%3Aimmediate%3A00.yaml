simpleMeaning: happening or existing with no other person, go-between, or condition in between.
scope: This is not about a straight route, and it is not about saying things plainly; it is about nothing
  coming between two things.
examples:
- The two leaders held direct talks in Geneva.
- The money came as a direct result of the new law.
