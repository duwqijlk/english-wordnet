senseId: 'thill%1:06:00::'
synsetId: 04430822-n
simpleMeaning: one of the two long poles that reach out from a cart or carriage on either side of the
  animal that pulls it
scope: One of the two poles that join a cart to the animal that pulls it, not the wheels and not the seat
  of the cart.
examples:
- The horse was hitched between the thills of the cart.
- One thill of the wagon had cracked and needed mending.
