simpleMeaning: The rider of this two-wheeled ride can go on a small built-in motor or by pushing the pedals
scope: This two-wheeled ride, also called electronic bike, has a small motor built in and can run on the
  motor or on the rider's pedalling.
examples:
- She rode her electronic bicycle to work without pedalling hard.
- The electronic bicycle lets him climb hills on the motor alone.
