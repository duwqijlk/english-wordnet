simpleMeaning: a long loose top worn by many people from India and nearby lands, usually with salwar (loose
  trousers) or churidars (tight trousers)
scope: This is the long top worn by people from India and nearby lands, usually with loose or tight trousers;
  it is not a dress worn as one piece by itself.
examples:
- She wore a blue kameez with white salwar trousers.
- His kameez reached below his knees.
