simpleMeaning: a metal pot used to cook food in hot water or to heat water, usually with a lid on top
scope: A metal pot for cooking, not the large drum used in music, not a hollow in the ground left by ice,
  and not the amount a pot can hold.
examples:
- She put the kettle on the stove to boil the potatoes.
- He lifted the lid off the kettle and looked at the stew.
