simpleMeaning: What the back of the eye sees is carried to the brain by this cord from the eye
scope: What the back of the eye sees is carried to the brain by this cord from the eye, also called nervus
  opticus and optic tract; not a cord that moves the eye and not a cord that feels the face.
examples:
- The optic nerve carries signals from the retina to the brain.
- Damage to the optic nerve can take away sight.
