simpleMeaning: An event that happens suddenly and gives energy or excitement, usually with a big effect
scope: A sudden event that gives energy or excitement, usually with a strong effect. Not the action of
  cooking food in a microwave, and not the action of attacking with guns or bombs.
examples:
- The news gave the team a real zap, and everyone worked with new energy.
- One more zap of radiation was enough to start the machine.
