simpleMeaning: the power to look at what is going on, see it clearly, and come to wise choices about it
scope: 'Also called sound judgment, judgment, judgement, and perspicacity: the power to judge things well,
  not a single choice and not a guess.'
examples:
- Her sound judgement helped her pick the right plan when the facts were unclear.
- Good sound judgement means weighing what is in front of you before you act.
