simpleMeaning: coming from or showing very strong hate toward others
scope: This describes an act or a fight that comes from or shows great hate, not a person who feels wronged,
  not deep sadness in tears, and not cold that hurts.
examples:
- The two men were bitter enemies for many years.
- They fought a bitter struggle for control of the town.
