simpleMeaning: to use an electric shock to make muscles move or tighten
scope: 'Also called galvanise: to use an electric shock on muscles to make them move, not to stir people
  into action and not to cover metal with a protective layer.'
examples:
- The doctor galvanized the patient's leg muscles with a mild electric shock.
- In the test, they galvanized the frog's muscles and the leg moved.
