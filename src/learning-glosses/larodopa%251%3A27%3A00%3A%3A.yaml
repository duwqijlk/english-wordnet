simpleMeaning: A drug made from the left-turning form of dopa, sold as Bendopa and Brocadopa, used to
  treat Parkinson's disease
scope: A drug for Parkinson's disease, also called levodopa, Bendopa, Brocadopa and L-dopa; one form of
  dopa, not dopa in general.
examples:
- The doctor gave him Larodopa to ease the shaking of Parkinson's disease.
- Larodopa helped her move more freely.
