simpleMeaning: the act of setting something going or getting it under way.
scope: This sense is not the physical line where a race begins, and not a moment when something begins
  by itself; it names the deed of setting something in motion.
examples:
- The start of the project required months of planning.
- They held a ceremony to mark the start of construction.
