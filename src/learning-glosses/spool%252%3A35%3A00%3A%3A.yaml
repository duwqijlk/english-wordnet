simpleMeaning: to wind thread, tape, film or other thin material onto a reel or round holder
scope: This is the act of winding thread or tape onto a holder, not the round holder itself and not sending
  data to storage for a printer.
examples:
- She spooled the thread by hand before she started to sew.
- He spooled the film onto the reel.
