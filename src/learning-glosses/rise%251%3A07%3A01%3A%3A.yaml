simpleMeaning: The amount by which a slope or surface goes upward.
scope: This is how much a surface tilts upward, not the sloping ground itself and not a religious event
  or an uprising.
examples:
- The rise of the ground here is so slight that you hardly notice it.
- Engineers measured the rise of the road surface before resurfacing it.
