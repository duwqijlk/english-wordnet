simpleMeaning: any of the round, thread-like strands that normally grow out of a mammal's skin.
scope: This is not woven cloth made from an animal's coat, and not the thread-like growths found on plants
  or insects.
examples:
- She tied her hair back before starting work.
- He found a single grey hair on the pillow.
