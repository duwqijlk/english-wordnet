simpleMeaning: Its thin-shelled fruit tastes too sharp to eat, and its leaves have seven or nine small
  parts, on this tree of the east of the United States.
scope: This tree of the east of the United States bears fruit too sharp to eat, and bitter hickory, bitter
  pignut, bitternut and swamp hickory are other names for it.
examples:
- We counted nine small parts on a leaf of the bitternut hickory.
- The bitternut hickory dropped its thin-shelled fruit.
