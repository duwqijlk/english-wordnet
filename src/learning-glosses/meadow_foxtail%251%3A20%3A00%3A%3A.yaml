simpleMeaning: Widely grown for grazing and hay, this tall, long-lived grass from the northern Old World
  has silky flower spikes and has now naturalized across North America.
scope: A tall pasture grass with soft, silky flower spikes; not the weedy foxtails with bristly seed heads,
  and not timothy, another grass grown for hay.
examples:
- Meadow foxtail is grown for hay and for grazing in northern regions.
- Meadow foxtail's silky flower spikes are its most distinctive feature.
