simpleMeaning: a strong push to believe or do something that makes no sense and cannot be fought off
scope: 'Also called mania and passion: a strong push to believe or do something that makes no sense and
  cannot be fought off, not a passing wish and not a reasoned choice.'
examples:
- His cacoethes for collecting old coins drove him to spend all his money.
- Her cacoethes made her believe the rumour even when the facts said otherwise.
