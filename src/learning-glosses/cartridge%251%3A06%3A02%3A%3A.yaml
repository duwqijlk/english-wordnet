simpleMeaning: the part on the arm of a record player that holds the needle, can be taken off, and turns
  the needle's movement into electric signals
scope: 'Also called pickup: the part of a record player that holds the needle, not a case that holds a
  bullet and powder for a gun and not a chamber that holds film in a camera.'
examples:
- He replaced the cartridge on the record player when the sound became weak.
- The cartridge holds the needle and can be taken off the arm.
