simpleMeaning: curved beaks and stiff tail feathers help these birds, one of many kinds in South and Central
  America, climb tree trunks and feed there as the hammering birds do
scope: Also called tree creeper, wood-creeper, and woodhewer, a bird that climbs trees to feed, not a
  woodpecker and not a nuthatch.
examples:
- The woodcreeper braced its stiff tail feathers against the trunk as it climbed.
- A woodcreeper's curved bill probes the bark for insects.
