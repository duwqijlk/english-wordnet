simpleMeaning: The dot (.) put at the end of a plain statement or after a shortened word
scope: This is the dot at the end of a statement or after a shortened word, not a comma or a question
  mark; point, stop, period and full stop are other names for this sense.
examples:
- She put a full point at the end of the sentence.
- In England they call a period a full point after an abbreviation.
