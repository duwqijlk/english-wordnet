simpleMeaning: an open wound on a horse's back, caused by a seat that fits badly
scope: 'Also called a gall: an open wound on a horse''s back from a seat that fits badly, not a sore on
  the rider and not a cut from a fence.'
examples:
- The vet treated the saddle sore on the mare's back.
- An ill-fitting saddle left a saddle sore on the horse.
