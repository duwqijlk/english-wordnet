senseId: every_last%5:00:00:all:00
synsetId: 02277816-s
simpleMeaning: Used before a noun to stress that all of them are meant, with none left out.
scope: An intensive way to say all, with none left out; not a word for only a few, and not a word for
  the final one in a row.
examples:
- Every last one of you must sign the form.
- She checked every last page of the book.
