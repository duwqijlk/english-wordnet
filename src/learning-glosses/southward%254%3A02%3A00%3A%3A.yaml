simpleMeaning: in the direction of the south
scope: Also called southerly and southwards, this says a thing moves toward the south; it is not the compass
  point for south and not the word that describes a thing moving that way.
examples:
- The ship sailed southward along the coast.
- They walked southward toward the warmer part of the country.
