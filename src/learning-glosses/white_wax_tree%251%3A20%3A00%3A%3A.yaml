simpleMeaning: An upright evergreen shrub or small tree from China, Korea and Japan, with pointed leaves
  and long, upright clusters of flowers; it looks like Japanese privet.
scope: This is the East Asian evergreen with pointed leaves, not the Japanese privet it resembles or the
  wax tree tapped for wax.
examples:
- White wax tree has pointed leaves and upright clusters of flowers.
- The white wax tree looks much like Japanese privet.
