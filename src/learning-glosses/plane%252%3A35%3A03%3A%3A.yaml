simpleMeaning: to make a surface flat and smooth by shaving off thin pieces with a carpenter's tool
scope: This is smoothing a surface until it is level, not cutting a piece off, and not the aircraft.
examples:
- He planed the edge of the door so that it would close properly.
- The workers planed the boards until they were perfectly smooth.
