simpleMeaning: All the land that feeds one river and its smaller streams, so that all the water that runs
  off it leaves at the same place.
scope: This stretch of land is also called basin, watershed, catchment basin, drainage area, drainage
  basin and river basin.
examples:
- Flood control plans cover the whole Missouri catchment area.
- The catchment area drains into the river at one place.
