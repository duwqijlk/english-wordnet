simpleMeaning: to take a person away to a secret place against their will, usually to get money for letting
  them go
scope: To take a person away to a secret place against their will, usually to get money for letting them
  go, not a fast grab of a thing and not a lift of weights.
examples:
- The gang snatched the rich man's son for ransom.
- They snatched her from the street and hid her for days.
