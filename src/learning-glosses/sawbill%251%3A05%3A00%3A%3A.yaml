simpleMeaning: Its long thin hooked beak, with edges like teeth, belongs to a big diving duck with a crest,
  which eats fish.
scope: Also called merganser, fish duck, and sheldrake, this is a big diving duck that eats fish.
examples:
- A sawbill dived under the water for a fish.
- A sawbill caught a fish in its hooked beak.
