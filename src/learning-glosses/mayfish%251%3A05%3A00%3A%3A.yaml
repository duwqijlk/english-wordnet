simpleMeaning: a black-barred water animal of bays and shore marshes on the Atlantic and Gulf coasts of
  the United States
scope: A black-barred water animal of bays and shore marshes; may fish and striped killifish are other
  names for this sense, not a fish of fresh water and not a fish of the open sea.
examples:
- Mayfish swim in the bays along the Gulf Coast.
- We saw a mayfish in the coastal marsh.
