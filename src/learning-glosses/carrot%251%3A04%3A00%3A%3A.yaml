simpleMeaning: a good thing promised to someone to make them do what you want
scope: This is a promised good thing used to get someone to act, not the orange root that people eat and
  not the plant it grows on.
examples:
- The promise of a bonus was the carrot that made the team work harder.
- They used the carrot of a shorter working week to win support for the plan.
