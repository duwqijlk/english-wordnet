simpleMeaning: a funny play that makes fun of people and things in a wild, over-the-top way, with events
  that could never really happen
scope: A funny play full of wild jokes and events that could never really happen, not a dish of stuffed
  meat and not the act of filling food with stuffing.
examples:
- The farce had the whole hall laughing as one mix-up followed another.
- She wrote a farce in which a lost letter turns a quiet house upside down.
