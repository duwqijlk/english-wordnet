simpleMeaning: In Greek mythology, a thin, special liquid said to flow in the veins of the gods
scope: This is the liquid in the veins of gods in Greek stories; it is not blood in a human body.
examples:
- In the old Greek story, golden ichor flowed from the wounded god.
- The poem says ichor, not blood, runs in the veins of the gods.
