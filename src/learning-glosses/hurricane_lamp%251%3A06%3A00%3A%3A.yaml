simpleMeaning: A glass tube round the flame and a pierced metal lid keep high winds from blowing out this
  oil light, which may also be a candlestick with the same tube.
scope: Hurricane lantern, storm lamp, storm lantern and tornado lantern are other names for this light,
  which keeps its flame safe from high winds.
examples:
- The hurricane lamp stayed lit through the storm.
- She hung a hurricane lamp by the door.
