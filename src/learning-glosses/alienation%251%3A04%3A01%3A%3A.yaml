simpleMeaning: In law, when one person freely and fully gives land or buildings, and the right to own
  and hold them, to another person
scope: In law, this is about giving land or buildings to another person; it is not making people unfriendly,
  not a separation that comes from hostility, and not the feeling of being cut off from others.
examples:
- The paper allowed the alienation of the land to a new owner.
- In law, alienation let him pass his house and land to his son.
