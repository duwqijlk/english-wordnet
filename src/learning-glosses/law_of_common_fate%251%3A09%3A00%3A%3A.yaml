synsetId: 06259815-n
simpleMeaning: 'a Gestalt rule about how the mind groups what it sees: things that move or work in the
  same way are seen as one thing'
scope: A Gestalt rule about how the mind groups what it sees, also called common fate, not the rule about
  things near each other and not the rule about lines keeping their direction.
examples:
- The law of common fate says things that move together look like one group.
- Under the law of common fate, the dots moving together seem to form a single shape.
