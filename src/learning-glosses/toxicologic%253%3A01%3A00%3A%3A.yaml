simpleMeaning: of or about the study of poisons and how they harm the body
scope: About the study of poisons and their harm; toxicological is another name for this sense, not about
  cures and not about the poison itself.
examples:
- The toxicologic report showed how much poison was in the blood.
- She took a toxicologic course on poisons.
