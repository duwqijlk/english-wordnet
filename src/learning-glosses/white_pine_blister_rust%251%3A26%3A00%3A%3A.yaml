simpleMeaning: A group of pine diseases caused by Cronartium rust fungi that invade and destroy bark and
  sapwood, erupting as blisters on the surface.
scope: This is the blister-forming Cronartium disease of pines, not the fungus that causes it; 'white-pine
  rust' is another name for the same disease.
examples:
- White pine blister rust reached the plantation three years after planting.
- The blisters of white pine blister rust split the bark open.
