synsetId: 13679309-n
simpleMeaning: a unit in the metric system for measuring very small lengths, equal to one part in a thousand
  million million of a meter
scope: 'Also called a femtometre and a fermi: a unit of length in the metric system, not a unit of weight
  and not a unit of time.'
examples:
- Scientists measure the width of an atom's core in femtometers.
- The femtometer is far smaller than a millimeter.
