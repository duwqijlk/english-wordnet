simpleMeaning: an insect with no wings, with mouth parts made for biting, that mostly lives on birds and
  feeds on them
scope: 'Also called a bird louse and a biting louse: the biting kind that lives mostly on birds. Not the
  blood-sucking kind that lives on warm-blooded animals, and not a nasty person.'
examples:
- A louse on the chicken's feathers bit at its skin.
- That kind of louse lives mostly on birds.
