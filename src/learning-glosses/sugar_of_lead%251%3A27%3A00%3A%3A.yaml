simpleMeaning: Used to dye cotton and to make enamels and varnishes, this white solid, Pb[CH3CO]2, is
  poisonous.
scope: Also called lead acetate, it is a poisonous white solid, not a sweet food, used to dye cotton and
  to make enamels and varnishes.
examples:
- The workshop kept sugar of lead for dyeing cotton.
- Sugar of lead was one of the solids used to make enamels.
