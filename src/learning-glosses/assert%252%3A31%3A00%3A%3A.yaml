simpleMeaning: To put forward a claim as true, in a firm and sure way
scope: 'Also called insist: putting forward a claim as true, in a firm and sure way, not a solemn formal
  statement of truth and not standing up for one''s own views and rights.'
examples:
- The report asserts that the plan will work.
- He asserted, quite firmly, that the town needed a new road.
