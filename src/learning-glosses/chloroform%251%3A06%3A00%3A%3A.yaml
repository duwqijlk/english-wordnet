simpleMeaning: a liquid haloform (a chemical with carbon, hydrogen and three chlorine atoms) that turns
  into gas easily; it was once used to stop pain and make people sleep
scope: 'Also called trichloromethane: this is the liquid itself, not the act of using it to make someone
  sleep.'
examples:
- In the past, doctors used chloroform to put patients to sleep before an operation.
- The old bottle of chloroform in the lab goes into the air very fast, so it is kept closed.
