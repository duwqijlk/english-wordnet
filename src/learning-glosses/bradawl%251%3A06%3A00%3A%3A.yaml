simpleMeaning: a sharp pointed tool for making small holes to take small nails or small screws
scope: 'Also called pricker: a sharp pointed tool for making small holes for small nails or small screws,
  not a drill and not a hammer.'
examples:
- He used a bradawl to start a hole for the screw.
- The bradawl made a neat hole in the wood.
