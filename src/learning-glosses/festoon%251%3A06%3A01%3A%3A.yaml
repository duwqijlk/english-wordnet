simpleMeaning: a decoration that shows a string of flowers hanging between two points, used on clay objects
  or on buildings
scope: This is a picture or shape of hanging flowers used on clay objects or buildings, not real flower
  chains hung as a decoration and not a cloth curtain hung in curves.
examples:
- A festoon was painted around the top of the clay pot.
- The old building had a stone festoon of flowers above the door.
