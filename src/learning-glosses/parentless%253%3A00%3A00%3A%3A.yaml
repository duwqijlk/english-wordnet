simpleMeaning: having no mother or father, or not cared for by people who take the place of a mother or
  father
scope: This describes a child with no mother or father, or with no adult caring for them in that place,
  not a child whose mother and father are away for a short time.
examples:
- The parentless boy lived with his aunt after both his mother and father died.
- Parentless children were cared for by women in the village.
