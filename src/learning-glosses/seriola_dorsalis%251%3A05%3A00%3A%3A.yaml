simpleMeaning: A fish caught for sport in the waters of southern California and Mexico, with a yellow
  fin on its tail.
scope: Yellowtail is another name for this sense, a fish caught for sport in the seas off southern California
  and Mexico; not a tuna or a marlin, other large fish caught for sport there, and not a small fish caught
  only for food.
examples:
- The Seriola dorsalis caught off California was a fine game fish.
- The Seriola dorsalis we saw had a bright yellow fin on its tail.
