simpleMeaning: A bush of California that loses its leaves each year, with foul-smelling leaves of usually
  three leaflets and fruit that can be eaten.
scope: Also called skunkbush, squaw-bush and squawbush; a bush of California with foul-smelling leaves
  of usually three leaflets, not a sweet-smelling bush and not a tree.
examples:
- The Rhus trilobata grows in California.
- Rhus trilobata has leaves of three leaflets.
