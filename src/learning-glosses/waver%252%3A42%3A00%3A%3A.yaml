senseId: 'waver%2:42:00::'
synsetId: 02646524-v
simpleMeaning: to wait before you act because you are not sure or you do not want to act
scope: 'Also called hesitate: to wait before acting because you are not sure or do not want to; not giving
  off sounds that rise and fall, and not moving in a rising and falling way.'
examples:
- He wavered for a moment before signing the paper.
- She wavered when they asked if she would take the job.
