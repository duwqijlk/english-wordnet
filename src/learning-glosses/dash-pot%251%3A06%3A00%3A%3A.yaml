simpleMeaning: Its shaking part is fixed to a sliding plug that moves in a box full of liquid, so the
  machine part slows shaking.
scope: This is a machine part that slows shaking, not one that makes shaking stronger and not a box with
  no liquid in it.
examples:
- The dash-pot slowed the shaking of the machine.
- The dash-pot's moving part slid in the liquid-filled box.
