senseId: 'direct%3:00:04::'
synsetId: 01419359-a
simpleMeaning: Belonging to a family line with no gaps, handed down from parent to child.
scope: This is a person or family trait coming down through an unbroken line of ancestry, from parent
  to child; it is not a straight, short path in space, not something with no go-between or middle step,
  not plain or frank in manner, not movement eastward across the sky, not a proportional relation to another
  quantity, not a one-way electrical flow, not something that follows at once as a result, not a word-for-word
  quotation, not total and unmitigated, not the adverb meaning without swerving, and not any verb use
  (commanding, aiming at a goal, aiming a weapon, camera or blow, guiding actors, conducting music, governing
  or managing, taking or sending someone somewhere, steering a course, telling someone the way, designing
  for an audience, addressing an envelope, or planning a complex undertaking).
examples:
- She is a direct descendant of the last emperor.
- The title went to the direct heir, not to a distant cousin.
