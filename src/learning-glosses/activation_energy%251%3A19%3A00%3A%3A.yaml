simpleMeaning: the amount of power that tiny bits of matter must take in before a change, such as giving
  off light or a chemical change, can take place
scope: The power that tiny bits of matter must take in before a change can take place, also called energy
  of activation; not the power given off by a change, and not the power a thing has at rest.
examples:
- The activation energy was too high for the change to start on its own.
- A catalyst lowers the activation energy needed for the reaction to begin.
