simpleMeaning: In medicine, the field that deals with mind troubles caused by ills of the nervous system.
scope: In medicine, the field for mind troubles caused by ills of the nervous system, not the study of
  the mind in health and not the branch of psychology that studies how the brain shapes thought.
examples:
- She chose neuropsychiatry to study mind troubles tied to brain ills.
- Neuropsychiatry treats patients whose mind troubles come from the nervous system.
