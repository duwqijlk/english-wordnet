simpleMeaning: to give a person the right not to be taken to court or charged for a crime
scope: Also called immunise. This is the court and law sense, about not being charged for a crime, not
  the medical sense of giving a person a shot to stop disease.
examples:
- The court immunized the witness so she could speak freely without fear of being charged.
- The judge immunized him so that he could not be taken to court for the crime he told them about.
