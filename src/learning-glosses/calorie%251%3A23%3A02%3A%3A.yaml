simpleMeaning: a unit of heat that warms one kilogram of water by one degree at normal air pressure; people
  who study food use it to show how much energy food gives
scope: This is the large food calorie, a measure of heat; not the small calorie that warms one gram of
  water.
examples:
- One calorie of heat warms a kilogram of water by one degree.
- The label says this snack gives you 200 calories of energy.
