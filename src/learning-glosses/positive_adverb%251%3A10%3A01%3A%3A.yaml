simpleMeaning: the basic form that shows a plain quality on its own, with no more, less, or change in
  size or amount
scope: Also called positive-degree adverb, this is the plain form of an adverb that shows a simple quality,
  not the form that makes a comparison with more or less.
examples:
- In 'She drove fast', the word 'fast' is a positive adverb.
- '''Hard'' in ''She worked hard'' is a positive adverb.'
