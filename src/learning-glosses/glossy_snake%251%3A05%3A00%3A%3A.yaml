simpleMeaning: A night animal from the west of the United States that digs in the ground and has bright
  tan scales
scope: A night snake with bright tan scales that digs in the ground in the west of the United States,
  not a day snake and not a lizard.
examples:
- The glossy snake hunts at night in the desert.
- A glossy snake slipped into its burrow at dawn.
