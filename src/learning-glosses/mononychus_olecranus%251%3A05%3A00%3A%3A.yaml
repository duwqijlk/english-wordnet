simpleMeaning: A turkey-sized long-legged 75-million-year-old fossil from the Gobi Desert, with fused
  wrist bones, keeled breastbone and a tail; short limbs end in one claw, and bird or dinosaur is disputed.
scope: A very old fossil from the Gobi Desert, bird-like in some ways and dinosaur-like in others; its
  class is still disputed.
examples:
- Mononychus olecranus was found in the Gobi Desert.
- Mononychus olecranus had a single claw on each short forelimb.
