simpleMeaning: Blood tubes from the sides of the head in front of the ear join to make this back branch
  of the blood tube of the face.
scope: Also called posterior facial vein and vena retromandibularis, it is the back branch of the blood
  tube of the face, made from blood tubes from the sides of the head in front of the ear.
examples:
- The retromandibular vein carried blood away from the side of the head.
- Blood from the side of the head flows through the retromandibular vein.
