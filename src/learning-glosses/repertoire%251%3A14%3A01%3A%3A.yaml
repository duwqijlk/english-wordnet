senseId: 'repertoire%1:14:01::'
synsetId: 08353554-n
simpleMeaning: Plays, songs, operas and ballets that a performer or group has ready, can perform, and
  does perform for short times on a regular plan
scope: Also called repertory. This is the set of stage or music works a performer or group keeps ready
  to perform, not the full range of skills or tools used in a job.
examples:
- The theatre's repertoire includes three plays that it performs in turn this season.
- Her repertoire has ten songs, and she sings a few of them each week.
