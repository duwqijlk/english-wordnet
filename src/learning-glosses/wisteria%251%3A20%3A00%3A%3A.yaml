simpleMeaning: any climbing plant with flowers, of one group of such plants
scope: This is a climbing plant with flowers that grows over walls and fences, not a tree, and not a small
  flower that grows on its own stem.
examples:
- Wisteria climbed over the wall, with long groups of purple flowers hanging down.
- She planted wisteria by the fence and trained it to grow up the posts.
