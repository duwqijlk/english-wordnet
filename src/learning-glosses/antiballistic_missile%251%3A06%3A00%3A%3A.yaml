simpleMeaning: While long-range flying weapons are still on their way in, this weapon is sent up to knock
  them down.
scope: Also called anti-ballistic missile, this flying weapon is sent up to knock down long-range flying
  weapons while they are still on their way in.
examples:
- The antiballistic missile knocked down the long-range weapon while it was still on its way in.
- The talks placed limits on how many antiballistic missiles each side could keep.
