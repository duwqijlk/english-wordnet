simpleMeaning: A small fresh-water creature with a clear body and many limbs, which swims on its back.
scope: A small fresh-water creature with a clear body and many limbs, which swims on its back, not a sea
  shrimp and not a water flea.
examples:
- The fairy shrimp swam on its back in the pool.
- Fairy shrimp have clear bodies and many limbs.
