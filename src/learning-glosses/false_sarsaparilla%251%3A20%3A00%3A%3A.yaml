simpleMeaning: From central and eastern North America, a common plant that lives for years, its sweet-smelling
  roots used in place of the root it is named for.
scope: Also called wild sarsaparilla or wild sarsparilla, this common plant that lives for years has sweet-smelling
  roots used in place of the root it is named for, and grows in central and eastern North America.
examples:
- The false sarsaparilla by the trail had sweet-smelling roots.
- We found false sarsaparilla growing in central and eastern North America.
