senseId: 'bedpan%1:06:00::'
synsetId: 02824337-n
simpleMeaning: A flat dish that a person who cannot leave bed uses to pass solid or liquid waste from
  the body
scope: This is the flat dish used in bed for body waste, not a pan for cooking and not a fixed toilet
  in a bathroom.
examples:
- The nurse brought a bedpan to the patient who could not get up.
- He asked for a bedpan because he had to stay in bed.
