simpleMeaning: about a shared life lived shut away from the world, by people who have made holy promises
  as part of their religion
scope: 'Also called monastic: about a shared life shut away from the world for holy reasons, not just
  any quiet life or a life lived alone.'
examples:
- The nuns lived a cloistered life and rarely left the building.
- Their cloistered life was spent in prayer and work inside the walls.
