simpleMeaning: the extra amount needed to make sure something is safe
scope: This is the extra amount needed to make sure something is safe; margin of error and margin of safety
  are other names for this sense, not the safe thing itself and not a risk.
examples:
- Engineers built a wide safety margin into the bridge.
- Keep a safety margin when you plan the budget.
