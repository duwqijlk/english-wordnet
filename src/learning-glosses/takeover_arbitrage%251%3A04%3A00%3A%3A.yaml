simpleMeaning: 'A person may lose a great deal if the deal fails: shares in a firm for sale are bought
  while shares in the firm that may buy it are sold.'
scope: Also called risk arbitrage, this is a risky deal in shares in which a person may lose a great deal
  if the deal fails.
examples:
- A great deal was lost on takeover arbitrage when the deal fell through.
- In takeover arbitrage, shares in the firm that may buy the other firm are sold.
