senseId: 'physical_goods%1:06:01::'
synsetId: 92412263-n
simpleMeaning: A thing you can touch that you buy or get to meet a need or a want.
scope: A thing you can touch, bought or got to meet a need or a want; not a service and not a thing you
  cannot touch, such as a right or an idea.
examples:
- Clothes and food are physical goods you can hold in your hands.
- She bought physical goods at the shop and took them home.
