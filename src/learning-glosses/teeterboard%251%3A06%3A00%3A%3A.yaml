simpleMeaning: a thing for play that rests on a middle point, so children at the two ends go up and down
  in turn
scope: 'Also called teeter, seesaw, dandle board, teeter-totter, teetertotter, and tilting board: a board
  that children ride up and down, not a swing and not a slide.'
examples:
- The children played on the teeterboard behind the school.
- One child sat at each end of the teeterboard.
