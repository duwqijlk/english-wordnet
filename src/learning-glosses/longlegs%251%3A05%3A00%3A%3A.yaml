simpleMeaning: A wading bird with very long legs and three toes, black and white, found at ponds and marshes
  inland or at partly salty lagoons.
scope: Also called a stilt, long-legs, a stilt plover, or a stiltbird, this is a wading bird with very
  long legs and three toes, black and white.
examples:
- A longlegs stood in the shallow pond, picking at the mud.
- Longlegs waded through the marsh on their thin legs.
