simpleMeaning: A round fruit from South Africa, with brown skin like leather and soft flesh inside, tasting
  both sweet and sour.
scope: A round South African fruit with brown leathery skin and soft flesh, not the Eurasian tree grown
  for its fruit, not the southern African tree, and not the crabapple-like fruit used for preserves.
examples:
- The medlar was soft and sweet-sour when ripe.
- She cut the medlar open and ate the soft flesh.
