simpleMeaning: A plane is put down at once when something has gone wrong and it cannot come down in the
  normal way, and it is often damaged
scope: This is a plane put down at once when something has gone wrong and it cannot come down in the normal
  way, and it is often damaged; not a planned coming down at an airport, and not a plane that falls with
  no one in charge of it.
examples:
- The pilot made a crash landing in the field.
- The crash landing damaged the plane's wing.
