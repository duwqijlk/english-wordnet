simpleMeaning: A United Nations body set up to help growing nations, by loans backed by member states.
scope: A United Nations body that lends to growing nations, also called IBRD and World Bank; not a body
  that gives gifts and not a body of one nation alone.
examples:
- The International Bank for Reconstruction and Development lent money for the dam.
- The International Bank for Reconstruction and Development lends money to growing nations.
