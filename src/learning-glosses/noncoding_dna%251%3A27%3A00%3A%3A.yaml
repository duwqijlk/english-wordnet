simpleMeaning: A run of gene material in a cell with a true core that is not turned into a protein
scope: Also called intron; the part of a gene that is not turned into a protein, while the rest of the
  gene is.
examples:
- Scientists found noncoding DNA in the gene that is never turned into a protein.
- The noncoding DNA in this gene is not turned into a protein.
