simpleMeaning: a vehicle with two wheels, pulled by horses, used in war and in races in Egypt, Greece
  and Rome long ago
scope: This is the two-wheel vehicle used for war and races long ago, not the light four-wheel carriage
  used for ceremonies, and not the act of riding in one.
examples:
- The soldier drove his chariot into battle with two fast horses.
- In the race, one chariot turned too fast and lost a wheel.
