schema: oewn-learning-gloss-v2
senseId: 'scruple%2:42:00::'
synsetId: 02647382-v
simpleMeaning: to pause or hold back from doing something because you think it may be wrong
scope: To hold back because you think an act may be wrong, not the noun for a unit of weight and not a
  moral rule itself.
examples:
- He scrupled to cheat on the test, so he left the hard question blank.
- They scrupled to steal the money, though no one would have seen them.
