simpleMeaning: How far the numbers in a set sit from their average, on average
scope: Also called mean deviation from the mean, this is the average size of the gaps between numbers
  and their average, not the average itself and not the spread found by squaring the gaps.
examples:
- The mean deviation of the test scores was small.
- We found the mean deviation by averaging how far each score sat from the average.
