simpleMeaning: one of the meaningful word groups that form a statement in logic, as opposed to connecting
  words
scope: Not a word or phrase in everyday speech, and not a period of time or a condition in an agreement.
examples:
- In the statement 'every swan is white', 'every swan' is the subject term.
- The logician split the sentence into two terms joined by 'and'.
