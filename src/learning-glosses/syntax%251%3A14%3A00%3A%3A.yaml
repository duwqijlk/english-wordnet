simpleMeaning: a neat order in which things are arranged in a regular way
scope: This sense is a planned, neat order for things in general, not the order of words in sentences
  and not the study of rules for making sentences.
examples:
- The syntax of his filing system puts every paper in its own neat place.
- There is a clear syntax to the dance, with each move set out in order.
