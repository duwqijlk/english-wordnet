simpleMeaning: the act of measuring the thickness of a liquid
scope: The act of measuring the thickness of a liquid, and viscometry is another name for this sense;
  not the thickness itself and not weighing a liquid.
examples:
- Viscosimetry measured how thick the syrup was.
- The factory relies on viscosimetry to check its oils.
