simpleMeaning: A big, shapely deciduous tree with a rounded crown, widespread in eastern North America;
  its leaves bear spiny triangular lobes, and its coarse wood is less durable than white oak.
scope: This is the tall eastern North American oak with sharply lobed leaves and weaker wood than white
  oak, not the white oak itself, and not the smaller scrub oaks of dry ridges.
examples:
- The northern red oak in our yard turns deep red late every October.
- Northern red oak wood is coarse but strong enough for flooring and furniture.
