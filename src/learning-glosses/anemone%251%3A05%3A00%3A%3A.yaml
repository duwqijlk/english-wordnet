scope: 'Also called sea anemone: a sea animal that looks like a flower; not the plant with the same name
  that grows in woods and is grown for its flowers.'
examples:
- A sea anemone waved its soft arms in the water.
- The anemone sat on a rock under the sea and caught small fish.
