simpleMeaning: That stands in for the true thing.
scope: This sense is that which stands in for the true thing, unlike the sense for a mix of copper and
  zinc, used in cheap jewels to ape gold.
examples:
- The gold was pinchbeck, standing in for the true thing.
- The jewel was pinchbeck, an imitation.
