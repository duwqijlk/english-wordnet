simpleMeaning: a person, especially one thought of as a single individual.
scope: This is not the spiritual part of a person that is believed to survive death; it means a whole
  person, often in statements about no one being present.
examples:
- Not a soul was stirring in the village that night.
- The poor soul had walked for miles in the rain.
