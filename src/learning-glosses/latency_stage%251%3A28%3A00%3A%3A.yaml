simpleMeaning: In psychoanalysis, from about age five or six until puberty, the fourth part of growth,
  when a child's thoughts about sex are said to go into other things to do
scope: 'Also called latency period and latency phase: in psychoanalysis, a time in a child''s growth from
  about age five or six until puberty, not an earlier part of growth and not the time after puberty.'
examples:
- The latency stage lasts from about age six until puberty.
- During the latency stage, a child's sexual interests are said to go into other things to do.
