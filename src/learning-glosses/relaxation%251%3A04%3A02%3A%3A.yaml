senseId: 'relaxation%1:04:02::'
synsetId: 00875476-n
simpleMeaning: a way to solve equations together by guessing an answer, then using closer guesses to make
  all errors smaller, step by step, until each is below a fixed amount
scope: In mathematics, also called relaxation method; this is a way to solve equations, not a feeling
  of rest and not the slow change of a muscle or of a system in science.
examples:
- The students used relaxation to solve the set of equations, checking the errors at each step.
- With relaxation, she made the errors smaller step by step until they were below the set size.
