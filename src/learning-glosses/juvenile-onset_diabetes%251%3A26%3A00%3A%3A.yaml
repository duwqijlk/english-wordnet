simpleMeaning: A severe kind of diabetes first appearing early in life, with heavy urination, great thirst,
  hunger, weight loss and bouts of blood acid build-up; diet and insulin injections manage it.
scope: Another name for the severe diabetes that begins early in life and needs insulin, also called juvenile
  diabetes; not adult-onset type 2 diabetes or diabetes insipidus.
examples:
- He was diagnosed with juvenile-onset diabetes at the age of eight.
- Juvenile-onset diabetes requires daily insulin injections.
