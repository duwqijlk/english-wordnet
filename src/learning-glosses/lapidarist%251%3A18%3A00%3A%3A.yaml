simpleMeaning: A person who knows a lot about precious stones and the skill of cutting and carving them.
scope: A person who knows a lot about precious stones and the skill of cutting and carving them; lapidary
  is another name for this sense, not a person who sells jewels, and not a person who digs stones from
  the ground.
examples:
- The lapidarist cut the diamond with great care.
- A skilled lapidarist can shape a rough stone into a gem.
