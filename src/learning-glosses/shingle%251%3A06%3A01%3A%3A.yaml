simpleMeaning: a small board with a name on it, put up outside an office, such as a lawyer's or a doctor's
scope: A small sign outside an office, not the thin boards put on a roof and not the act of putting them
  there.
examples:
- The dentist's shingle hung by the door of her new office.
- He put up his shingle after passing the bar exam.
