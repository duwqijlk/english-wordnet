simpleMeaning: A garden plant of Europe and Asia that lives for years, with bright red flowers in thick
  bunches at the ends of its stems.
scope: This is a garden plant of Europe and Asia that lives for years, with bright red flowers in thick
  bunches at the ends of its stems; Maltese cross and scarlet lychnis are other names for this sense,
  and it is not a plant with flowers spread along the stem.
examples:
- Lychnis chalcedonica stood in the garden bed, its scarlet flowers bright at the top of each stem.
- We planted Lychnis chalcedonica for its thick bunches of red flowers.
