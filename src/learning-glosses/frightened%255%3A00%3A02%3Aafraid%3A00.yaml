simpleMeaning: Gripped by extreme fear or a sense of desperation.
scope: This is the extreme, panicky end of fear, with terrified, panicked, panicky, panic-stricken and
  panic-struck as other names for it, not the milder sense of simply having been made afraid.
examples:
- The frightened child screamed and hid behind her mother when the dog lunged at her.
- He felt frightened and desperate as the water rose around the car.
