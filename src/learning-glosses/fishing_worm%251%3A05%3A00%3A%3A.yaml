simpleMeaning: A land worm that burrows into soil, letting air in, often surfaces when the ground is cool
  or wet, and is used as bait by anglers.
scope: Also called earthworm, crawler, wiggler, nightcrawler, nightwalker, angleworm, dew worm, fishworm,
  and red worm, this is a land worm used as bait, not a sea worm and not a worm that lives in wood.
examples:
- He dug up a fishing worm for his hook.
- Fishing worms surfaced after the rain cooled the soil.
