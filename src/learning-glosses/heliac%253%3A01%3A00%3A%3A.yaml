senseId: 'heliac%3:01:00::'
synsetId: 02749943-a
simpleMeaning: Above all, about a star seen again after it was hidden by the sun's light, or seen for
  the last time before it is hidden; also near the sun.
scope: About a star rising or setting near the sun; heliacal is another name for this sense, and this
  is not a word for the sun itself or for a star seen at night.
examples:
- The heliac rising of the Dog Star marked the start of the year.
- Astronomers watched for the heliac setting of the star before it vanished behind the sun.
