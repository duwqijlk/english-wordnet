simpleMeaning: a feeling of being annoyed and in a bad mood in a small, childish way
scope: Another name for this feeling is irritability. This is a short feeling of being annoyed in a childish
  way, not anger that lasts a long time and not a rude action by itself.
examples:
- Her petulance showed when she folded her arms and refused to speak.
- He spoke with petulance after losing the small game.
