simpleMeaning: In physics, the pull between all things that have mass in the universe, with the pull of
  the earth on things near its surface standing out most
scope: In physics, this pull between masses is also called gravity, gravitation and gravitational attraction,
  and is not a push and not a magnetic pull.
examples:
- The gravitational force of the earth holds us on the ground.
- The gravitational force between the sun and the planets keeps them in orbit.
