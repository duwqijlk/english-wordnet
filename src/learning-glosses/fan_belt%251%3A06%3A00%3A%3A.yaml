simpleMeaning: a loop of tough material turned by the engine shaft, turning the blades that pull air through
  the cooling unit
scope: This is a loop that turns a cooling fan in a car engine; not the fan itself and not the engine
  shaft.
examples:
- The fan belt snapped and the engine began to overheat.
- He replaced the worn fan belt before the long drive.
