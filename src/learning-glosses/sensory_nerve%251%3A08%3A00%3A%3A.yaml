senseId: 'sensory_nerve%1:08:00::'
synsetId: 05482786-n
simpleMeaning: a cord in the body that passes signals from the parts of the body that feel things toward
  the brain and the main cord down the back
scope: A cord in the body that passes signals from the parts of the body that feel things toward the brain
  and the main cord down the back; afferent and afferent nerve are other names for this sense. Not a cord
  that carries orders out to the muscles, and not a single thin strand inside it.
examples:
- The sensory nerve carried the feeling from his skin to his brain.
- Damage to a sensory nerve can stop a person feeling touch in one hand.
