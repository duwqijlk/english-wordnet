simpleMeaning: Said in a flat, even rise and fall of the voice, like chanting.
scope: Said in a flat, even rise and fall of the voice, like chanting; not a tune, and not the act of
  chanting itself.
examples:
- She read the poem in a singsong voice.
- The children answered in a singsong manner.
