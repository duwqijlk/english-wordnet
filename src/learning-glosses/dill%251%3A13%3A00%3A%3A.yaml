simpleMeaning: the thin, thread-like leaves of this plant, which have a strong smell and taste and are
  used to add taste to food
scope: This sense is also called dill weed. It is only the thin leaves used to add taste to food, not
  the whole plant.
examples:
- She added fresh dill to the soup.
- Chopped dill gave the fish a fresh taste.
