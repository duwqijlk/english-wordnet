simpleMeaning: The bolt inside a lock can move only when a key has lined up these tube-shaped pieces,
  each made of two parts held by springs.
scope: Also called a pin, these tube-shaped pieces inside a lock must be lined up by a key before the
  bolt can move.
examples:
- The pin tumblers lined up as the key turned.
- When the pin tumbler is out of line, the bolt will not move.
