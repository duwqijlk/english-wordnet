senseId: 'circumscribe%2:30:00::'
synsetId: 00236085-v
simpleMeaning: to keep something inside set limits and not let it go further
scope: 'This sense is also called limit: it keeps something inside set limits; it does not stop it in
  full or end it.'
examples:
- Rules circumscribe what the police can do.
- Her work is circumscribed by strict laws.
