simpleMeaning: Something got from pepper, above all black pepper, that makes black and white pepper hot.
scope: A substance got from pepper, above all black pepper, that makes black and white pepper hot; piperin
  is another name for this sense, not the hot substance in chillies and not a spice on its own.
examples:
- Piperine is what gives black pepper its bite.
- White pepper owes its heat to piperine.
