simpleMeaning: Most of all it cannot be touched; it cannot be taken in by any of the senses
scope: 'Also called impalpable: that cannot be known through the senses, especially touch. Not the business
  sense about things of value with no physical form.'
examples:
- A thought is intangible; no one can touch, see or hear it.
- Their hope was intangible, with nothing solid to hold on to.
