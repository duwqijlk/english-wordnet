simpleMeaning: A tall graceful oak of California drops its leaves each year; its leaves feel like leather
  and its acorns are long, thin, and pointed.
scope: Also called a valley white oak and a roble, this tall graceful oak of California drops its leaves
  each year, with leaves that feel like leather and acorns that are long, thin, and pointed.
examples:
- The valley oak had lost its leaves for the year.
- Long pointed acorns hung from the valley oak.
