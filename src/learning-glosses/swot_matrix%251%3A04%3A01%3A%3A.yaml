simpleMeaning: A set way of planning that looks at the strong points, weak points, chances and dangers
  in a plan or a business task.
scope: 'Also called SWOT analysis: a set way of planning that weighs strong and weak points with chances
  and dangers, not the plan itself and not a way of carrying out the work.'
examples:
- The team drew up a SWOT matrix for the new plan.
- A SWOT matrix lists strong points, weak points, chances and dangers.
