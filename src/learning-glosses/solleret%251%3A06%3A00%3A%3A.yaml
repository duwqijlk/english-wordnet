simpleMeaning: A plate of armour that guards the foot, made of linked rings with a hard toe and heel
scope: A plate of armour that guards the foot, made of linked rings with a hard toe and heel; also called
  sabaton; not a shoe for walking, and not a plate that guards the leg.
examples:
- The knight's solleret protected his foot in battle.
- Each solleret was made of linked rings.
