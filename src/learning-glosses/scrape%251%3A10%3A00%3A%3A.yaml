simpleMeaning: a low bow with one foot pulled back, done to show too much of the feeling that you are
  less important than the other person
scope: This is the bow itself, not the act of bending and bowing, not a harsh sound, and not a place where
  skin is torn off.
examples:
- He made a deep scrape, pulling one foot back as he bowed.
- With a low scrape, the servant backed out of the room.
