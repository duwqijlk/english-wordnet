senseId: 'striation%1:25:00::'
synsetId: 13931362-n
simpleMeaning: Any of a set of tiny grooves running side by side, such as the marks a glacier leaves scratched
  on rock, or the lines and raised bands in muscle.
scope: A tiny groove running beside others, also called stria, not a stripe of a different colour.
examples:
- Striations marked the rock where the glacier had passed.
- The muscle showed fine striations under the glass.
