senseId: 'incompatible%3:00:02::'
synsetId: 00511131-a
simpleMeaning: not able to be used with or joined to other devices or parts unless it is changed first
scope: About devices or parts that do not work together unless changed; not about things that cannot mix
  into one, and not about drugs or muscles that stop each other from working.
examples:
- The new plug is incompatible with the old socket, so it will not fit without a change.
- His computer and the printer are incompatible, so they cannot work together.
