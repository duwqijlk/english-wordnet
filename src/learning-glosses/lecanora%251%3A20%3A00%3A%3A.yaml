simpleMeaning: Some kinds colour cloth and some are eaten as food; all are a lichen, a growth made of
  fungus and tiny green plants living together
scope: A lichen whose kinds are used to colour cloth or as food, not a moss and not a mushroom.
examples:
- Lecanora grows in pale patches on the old stone wall.
- In some places people gather lecanora to dye wool.
