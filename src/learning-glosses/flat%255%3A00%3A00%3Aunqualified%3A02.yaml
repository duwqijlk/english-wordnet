simpleMeaning: Stated absolutely, with no conditions or doubt added.
scope: This describes a statement or refusal that is complete and unconditional; it is not about a surface's
  shape, and it is not the musical sign.
examples:
- He issued a flat denial of the accusations.
- Her flat refusal surprised everyone.
