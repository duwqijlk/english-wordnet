simpleMeaning: At risk of dying out, this plant with big coiled spikes of blooms lives for a single year
  in the west of the United States
scope: A plant with coiled blooms that lives one year in the west of the United States, not a different
  kind of fiddleneck and not a plant that lives many years.
examples:
- The large-flowered fiddleneck grows in the west of the United States.
- We saw the large-flowered fiddleneck in bloom, its coiled spikes easy to spot.
