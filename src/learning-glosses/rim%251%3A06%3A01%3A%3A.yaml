simpleMeaning: a part that sticks out from an object, used to make it stronger or to join it to another
  object
scope: A part that sticks out to make something stronger or to help join it to something else; not the
  outer part of a wheel and not the hoop in basketball.
examples:
- The machine part has a rim that sticks out so it can be fixed to the frame.
- A rim on the bottom of the cup lets it lock onto the stand.
