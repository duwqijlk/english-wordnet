simpleMeaning: a musical instrument made of a row of whistles blown by steam and played from a keyboard
scope: A musical instrument made of a row of whistles blown by steam and played from a keyboard; steam
  organ is another name for this sense, not an organ with pipes blown by air.
examples:
- The calliope played a loud tune at the fair.
- You could hear the calliope from across the town.
