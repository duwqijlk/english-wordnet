simpleMeaning: To make parts of a building, above all in a factory, so they can be moved with ease and
  put together fast where the building will stand
scope: This is to make parts of a building, above all in a factory, so they can be moved with ease and
  put together fast where the building will stand; prefabricate is another name for it, not to build the
  whole thing on the spot.
examples:
- The workers preassemble the walls in the factory.
- They preassemble the house so it can be put up fast.
