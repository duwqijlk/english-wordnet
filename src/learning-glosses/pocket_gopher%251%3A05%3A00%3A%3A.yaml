scope: A burrowing rodent of the family Geomyidae with big cheek pouches on the outside, from Central
  America and southwestern North America; gopher and pouched rat are other names for it.
examples:
- We saw a pocket gopher digging its burrow.
- The pocket gopher has large pouches on the outside of its cheeks.
