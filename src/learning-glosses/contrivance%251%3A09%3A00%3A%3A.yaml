simpleMeaning: a plan with many parts, made to trick people or to get out of something
scope: This is a trick plan, also called dodge and stratagem; it is not a tool made for a job, not a skill
  for thinking up new things, and not a made-up arrangement of parts.
examples:
- Her excuse was a clever contrivance to avoid paying the fine.
- The false letter was a contrivance made to trick the police.
