simpleMeaning: A hard blow in boxing that leaves the other boxer unable to go on.
scope: This is a hard blow in boxing that leaves the other boxer unable to go on; haymaker, knockout punch
  and KO punch are other names for it, not a light blow and not a blow in another sport.
examples:
- His Sunday punch ended the fight in the third round.
- She took a Sunday punch and could not go on boxing.
