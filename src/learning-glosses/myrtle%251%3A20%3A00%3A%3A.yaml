simpleMeaning: any bush or tree in the Myrtus group that keeps its green leaves all through the year
scope: This is a bush or tree in the Myrtus group that keeps its leaves all year, not the low ground-cover
  plant also called myrtle with usually blue-violet flowers.
examples:
- The myrtle in her garden stays green in winter.
- They planted a myrtle near the house for its green leaves.
