simpleMeaning: Any of a few plants of the Calochortus kind, with flowers shaped like eggs.
scope: Any of a few plants of the Calochortus kind, with flowers shaped like eggs, also called globe lily,
  not a true lily and not a tulip.
examples:
- The fairy lantern opened its egg-shaped flowers in spring.
- Fairy lanterns in the garden had flowers shaped like eggs.
