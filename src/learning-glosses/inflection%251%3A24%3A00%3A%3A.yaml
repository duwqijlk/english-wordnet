senseId: 'inflection%1:24:00::'
synsetId: 13825994-n
simpleMeaning: a change to the end or shape of a word, most often by adding a bit to the end, that shows
  its job in a sentence
scope: A change in a word's form that shows its job in a sentence, not a change in the loudness or pitch
  of the voice.
examples:
- The inflection of 'walk' to 'walked' shows past time.
- In Latin, a noun's inflection changes with its case.
