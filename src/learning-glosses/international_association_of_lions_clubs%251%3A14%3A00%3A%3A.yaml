simpleMeaning: A group that works for good citizenship, good rule, and town, nation and world welfare.
scope: A group that works for good citizenship and good rule, also called Lions Club; not a group that
  works for one town only and not a business.
examples:
- The International Association of Lions clubs works for the welfare of the town and the nation.
- Members of the International Association of Lions clubs meet each month.
