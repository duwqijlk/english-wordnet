simpleMeaning: To spread a cover of ice, snow, or a great sheet of ice over something
scope: To spread a cover of ice, snow, or a great sheet of ice over something, not to turn to ice by itself
  and not to dust lightly with frost.
examples:
- The entire area was glaciated by the end of the cold age.
- Snow glaciated the mountain tops each winter.
