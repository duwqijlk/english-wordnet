simpleMeaning: In the study of how people sense things, the gap between two things that a person picks
  up as often as not in a test set up with care
scope: Also called just-noticeable difference, it is the gap a person picks up as often as they miss it,
  in a test set up with care.
examples:
- The jnd between the two tones was a gap the listeners spotted half the time.
- The jnd showed up when the gap was picked up as often as it was missed.
