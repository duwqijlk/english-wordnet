synsetId: 13657614-n
simpleMeaning: This unit counts how much charge a thing can hold, and it is one thousandth of the larger
  unit
scope: A small unit for counting how much charge a thing can hold, one thousandth of the larger unit;
  not the larger unit itself and not the microfarad, a much smaller unit.
examples:
- The capacitor was rated at 100 millifarads.
- He chose a millifarad capacitor for the circuit.
