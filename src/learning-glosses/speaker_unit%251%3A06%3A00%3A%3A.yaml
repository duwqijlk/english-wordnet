simpleMeaning: People far away can hear the sound this one piece of equipment gives out from electric
  signals taken in.
scope: It is also called speaker, loudspeaker, loudspeaker system and speaker system, one piece of equipment
  whose sound from electric signals reaches people far away.
examples:
- One speaker unit had stopped working.
- They fitted a new speaker unit in place of the old one.
