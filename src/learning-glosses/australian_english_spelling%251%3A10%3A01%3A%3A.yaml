simpleMeaning: The way words are spelled in Australia, using forms like analyse, centre and usable.
scope: This is the way words are spelled in Australia, marked by forms like analyse, centre and usable;
  Australian English orthography and Australian spelling are other names for it, and it is about spelling
  on the page, not about how words are spoken.
examples:
- Australian English spelling uses centre instead of center.
- He writes in Australian English spelling at work.
