simpleMeaning: People say this hairy plant of Europe and Asia kills the small jumping bugs that bite or
  drives them off; it lives for years and has yellow flowers like daisies.
scope: Also called fleabane mullet, this is a hairy plant of Europe and Asia with yellow flowers, not
  the North American plant of the same name.
examples:
- Fleabane grew along the old wall.
- She picked fleabane for its yellow flowers.
