simpleMeaning: A bushy-tailed cat of Europe that looks like the house cat and is held to be the forebear
  of the house cat
scope: The wild European cat that looks like the house cat and is held to be the house cat's forebear;
  catamountain and Felis silvestris are other names for it, not a tame cat.
examples:
- The European wildcat hunts at night in the forest.
- A European wildcat looks much like a house cat.
