simpleMeaning: a three-dimensional thing with a firm structure that usually keeps its shape and size.
scope: This is not the physical state of a material, and not a substance such as ice or iron; it names
  an object that has length, width and depth and a rigid structure.
examples:
- A cube is a solid with six square faces.
- The design software lets you build a solid from simple shapes.
