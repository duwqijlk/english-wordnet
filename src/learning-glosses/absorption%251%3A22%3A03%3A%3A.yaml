simpleMeaning: the process by which one group of people, with its own way of life, becomes part of another
  group and lives in peace with it
scope: This is about one group of people becoming part of another and living in peace with it; not the
  taking in of energy, of a liquid, or of food by the body.
examples:
- The absorption of the new group into the town went on for many years, until both groups lived as one.
- Their absorption into the wider community was slow, but it brought peace between the groups.
