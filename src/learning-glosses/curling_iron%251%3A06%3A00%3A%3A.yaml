simpleMeaning: A tube-shaped metal tool for the home that heats a lock of hair wound round it.
scope: A heated metal tool for shaping hair, not a hair dryer and not a pair of tongs.
examples:
- She used a curling iron to shape her hair.
- The curling iron was hot enough to set the curls.
