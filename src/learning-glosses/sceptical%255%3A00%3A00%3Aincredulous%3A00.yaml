simpleMeaning: refusing to believe, or asking if something is true, about the main beliefs of a group,
  especially a religion
scope: 'Also called skeptical, disbelieving, and unbelieving: this is about questioning the main beliefs
  of a group, especially a religion, not about doubting one small fact or claim.'
examples:
- He was sceptical about the church's teaching on miracles.
- Many young people grew sceptical and began to question the old religious beliefs.
