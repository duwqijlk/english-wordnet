simpleMeaning: a tree from Asia that loses its leaves in the cold months, one of a small group of such
  trees
scope: A tree from Asia that loses its leaves in winter, not a tree that keeps its leaves all year and
  not a shrub.
examples:
- An ailanthus grows at the back of the garden.
- The ailanthus by the wall has lost all its leaves.
