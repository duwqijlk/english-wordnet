simpleMeaning: showing care and understanding for others, and ready to give and to help
scope: Also called kindly, sympathetic, benevolent, and openhearted. This is a kind, giving way a person
  shows to others, not the sense about groups that give help, money, or care to people in need.
examples:
- He was charitable about his rival's mistakes and spoke of him with understanding.
- She was charitable in her judgment and gave him another chance.
