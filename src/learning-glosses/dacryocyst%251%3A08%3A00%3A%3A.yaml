simpleMeaning: Two pouches, one at the inner end of each eye, where the tear tubes widen and fill with
  tears from the tear glands
scope: One of two pouches at the inner end of each eye that fill with tears; also called lacrimal sac
  and tear sac, not the tear gland that makes the tears.
examples:
- The dacryocyst was swollen and sore.
- Tears gather in the dacryocyst before they drain away.
