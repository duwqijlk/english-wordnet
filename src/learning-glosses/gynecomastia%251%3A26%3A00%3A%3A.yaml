simpleMeaning: Too much growth of the breasts in men, most often from unbalanced body chemicals or from
  care with some drugs, such as drugs for high blood pressure
scope: This is too much growth of the breasts in men, most often from unbalanced body chemicals or drug
  care, not breast growth in women and not a growth caused by a tumour.
examples:
- Gynecomastia can follow treatment with certain drugs.
- The doctor explained that gynecomastia often comes from a hormone imbalance.
