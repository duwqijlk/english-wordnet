simpleMeaning: a short loss of working power in the outer layer of the brain, shown only by quick jumps
  in brain signals three times each second
scope: A short loss of working power in the outer layer of the brain; not a long loss of mind and not
  a fit that can be seen.
examples:
- A subclinical absence shows only as spikes on the brain trace.
- Doctors found the subclinical absence in the three-per-second spikes.
