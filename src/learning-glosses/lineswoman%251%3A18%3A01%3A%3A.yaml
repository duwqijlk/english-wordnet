simpleMeaning: The wires that carry power or phone calls are put up or mended by this woman
scope: 'Another name for a linewoman: a woman who puts up or mends power or phone wires, not a sports
  official who helps a referee.'
examples:
- The lineswoman fixed the phone line after the storm.
- A lineswoman climbed the pole to put the power wire back.
