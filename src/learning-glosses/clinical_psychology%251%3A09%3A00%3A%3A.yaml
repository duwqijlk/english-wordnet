simpleMeaning: the part of the study of the mind that deals with treating odd or ill ways of thinking
  and acting
scope: The part of the study of the mind that treats odd or ill ways of thinking and acting, not the study
  of how healthy minds learn and not the study of the brain alone.
examples:
- She studied clinical psychology so she could help people with fears.
- Clinical psychology covers the care of people whose thoughts trouble them.
