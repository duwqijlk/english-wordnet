simpleMeaning: wet in the way a thing is after it has been cleaned with water; sometimes joined to another
  word to make a longer word
scope: 'Wet, not clean: this sense tells how wet a thing is after water, sometimes in a joined word, not
  that water has made it clean.'
examples:
- His washed shirt was still wet and hanging up to dry.
- The rain-washed streets were wet and shining after the storm.
