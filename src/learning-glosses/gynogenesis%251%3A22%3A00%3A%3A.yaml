simpleMeaning: In this birth by the mother alone, the young carry only her chromosomes, the threads that
  pass on traits, since the father's seed never joins the egg's core.
scope: This way of making young carries only the mother's chromosomes, and the father's seed never joins
  the egg.
examples:
- In gynogenesis the embryo carries only maternal chromosomes.
- Gynogenesis leaves the young with no traits from the father.
