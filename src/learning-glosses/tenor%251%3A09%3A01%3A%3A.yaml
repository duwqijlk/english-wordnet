simpleMeaning: the main, settled and usual way a person's life goes on
scope: This is the usual way a person's life goes on; it is not a man who sings with a high voice, and
  not a musical instrument with a sound between alto and bass.
examples:
- Nothing changed the quiet tenor of his life in the village.
- The even tenor of her days continued for many years.
