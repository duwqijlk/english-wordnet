simpleMeaning: to praise someone or something highly and show great respect for them
scope: This is praising and showing respect, not the sense of raising someone to a perfect, holy state
  linked to Christ.
examples:
- The songs glorify the heroes of the past.
- In his speech, he glorified the doctors who had saved many lives, praising and thanking them in front
  of everyone.
