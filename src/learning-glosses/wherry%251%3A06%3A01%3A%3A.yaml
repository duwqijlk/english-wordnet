simpleMeaning: A light boat moved by oars, used for racing or for carrying goods and people on rivers,
  lakes, and in harbours.
scope: A light boat moved by oars, used for racing or for carrying goods and people on inland waters,
  not a sailing barge used especially in East Anglia.
examples:
- The wherry glided across the lake with four oarsmen.
- Wherries carried goods along the river to the town.
