simpleMeaning: In old Greek and Roman stories, what the gods ate and drank; a person who ate it would
  live for ever
scope: In old stories, the food and drink of the gods, not the sweet juice flowers make for bees and not
  fruit juice.
examples:
- The nectar of the gods was said to make any mortal who tasted it live for ever.
- In the old tales, nectar was served at the feasts of the gods.
