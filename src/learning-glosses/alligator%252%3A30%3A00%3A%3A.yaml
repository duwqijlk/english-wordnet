simpleMeaning: In paint and varnish, to crack and take on the look of rough, scaly hide, as from being
  left out in the weather or put on badly
scope: In paint, to crack into a pattern like the skin of an alligator, not the animal itself and not
  a crack in wood.
examples:
- The old paint began to alligator in the hot sun.
- The varnish alligatored after years in the weather.
