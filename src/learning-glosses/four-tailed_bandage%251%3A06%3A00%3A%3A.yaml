simpleMeaning: A strip of cloth split in two at both ends, laid under the chin to hold the jaw still,
  its ends tied over the head.
scope: Of a cloth strip split in two at both ends, put under the chin to keep the jaw from moving, with
  its ends tied over the top of the head.
examples:
- The nurse tied the four-tailed bandage over the top of his head.
- The four-tailed bandage held his jaw still.
