simpleMeaning: One wall in a room gets this pretty printed covering, its picture made to order or picked
  from a set list.
scope: Photo mural, photo wallpaper, and wall mural are other names for this printed covering made for
  a single wall, its picture made to order or chosen from a set list.
examples:
- They put mural wallpaper with a forest scene on the wall behind the bed.
- The mural wallpaper in the hall was printed to order, not picked from a set list.
