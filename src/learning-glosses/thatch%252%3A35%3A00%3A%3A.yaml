simpleMeaning: to put dried straw or reeds on a roof as a cover
scope: To put a straw or reed cover on a roof, not the thick hair that looks like such a cover.
examples:
- They will thatch the roofs of the cottages this summer.
- The workers thatched the barn roof with straw.
