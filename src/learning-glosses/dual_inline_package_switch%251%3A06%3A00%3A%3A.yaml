simpleMeaning: In computer science, one of a set of small on-off controls fixed inside computer parts,
  used instead of jumpers to set the machine up for a user
scope: In computer science, one of a set of small on-off controls inside computer parts, not a jumper
  wire and not a key on the keyboard.
examples:
- He flipped a dual inline package switch to change the setting.
- The dual inline package switch controls how the board starts up.
