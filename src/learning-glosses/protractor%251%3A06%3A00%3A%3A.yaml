simpleMeaning: a tool used for drawing and measuring angles (the space between two lines that meet at
  a point)
scope: This is a tool for drawing and measuring angles, not a tool for drawing circles and not a straight
  tool for measuring length.
examples:
- Use a protractor to measure the angle.
- She drew the angle with a protractor.
