simpleMeaning: A track up the side of a mountain, pulled by a moving wire, with rising and falling cars
  that balance each other.
scope: A track up a mountain side pulled by a moving wire, also called a funicular or funicular railway;
  not a road for cars and not a lift in a building.
examples:
- They rode the cable railway up the mountain.
- The cable railway pulls its cars with a moving wire.
