simpleMeaning: Said of a nerve fibre or signal that begins outside the brain and passes in toward its
  outer layer.
scope: A nerve fibre or signal that begins outside the brain and passes in toward its outer layer is also
  called corticoafferent.
examples:
- Corticipetal fibres carry signals from outside into the brain.
- A corticipetal signal began outside the brain and moved inward.
