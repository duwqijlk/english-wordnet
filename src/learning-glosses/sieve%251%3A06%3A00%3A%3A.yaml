simpleMeaning: a tool with many small holes, used to take lumps out of powder or to sort small pieces
  by size
scope: 'Also called screen: this is the tool for sorting powder or small pieces, not the act of passing
  things through such a tool.'
examples:
- She put the flour through a sieve to remove the lumps.
- He used a sieve to sort the small stones by size.
