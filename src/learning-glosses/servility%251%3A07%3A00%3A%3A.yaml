simpleMeaning: Giving in to others in a low, shrinking way, with no pride or will of one's own.
scope: A low, cringing way of giving in to others, also called subservience and obsequiousness.
examples:
- His servility before the boss made his workmates lose respect for him.
- She answered with servility, agreeing to everything the manager said.
