simpleMeaning: a written paper that sets out what happened in a client's case and what the law says about
  it
scope: This is the written paper for a client's case. It sets out what happened and what the law says
  about the case; it is not a short piece that gives only the main points of something.
examples:
- The lawyer wrote a brief for the court case.
- Her brief gave the facts and the points of law for her client's case.
