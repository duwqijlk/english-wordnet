simpleMeaning: One chemical bit weighed in small weight units gives the same number as the weight of a
  single bit of it.
scope: Also called a gram-atomic weight, this names the set amount of one chemical bit whose weight in
  small weight units matches the weight of a single bit of it.
examples:
- One gram atom of oxygen was enough for the test.
- The chemist weighed out one gram atom of the element.
