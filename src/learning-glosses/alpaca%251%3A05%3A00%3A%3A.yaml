simpleMeaning: This tame animal, kin to the wild guanaco, is kept for the long soft shiny fleece on its
  back.
scope: It is the tame animal kept for its long soft shiny fleece, not the cloth made from that fleece.
examples:
- The farmer keeps alpacas for their long soft fleece.
- An alpaca stood in the field beside the other tame llamas.
