simpleMeaning: the way of going too far past what is proper, likely, or true
scope: 'Also called extravagance: going too far past what is proper, likely, or true, not spending too
  much money and not a wild party.'
examples:
- The extravagancy of her claims made no one believe her.
- His extravagancy in speech shocked the quiet room.
