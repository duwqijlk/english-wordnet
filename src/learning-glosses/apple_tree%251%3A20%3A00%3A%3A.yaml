simpleMeaning: In the group called Malus, plants bear firm round fruits good to eat.
scope: This name covers any plant of the group called Malus, and above all the kinds that bear firm round
  fruits good to eat.
examples:
- The old apple tree bore firm round fruit each year.
- They planted an apple tree beside the house.
