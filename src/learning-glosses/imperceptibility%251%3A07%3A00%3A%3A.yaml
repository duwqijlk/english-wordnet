simpleMeaning: The quality of being impossible for the mind or the senses to notice
scope: Being impossible for the mind or the senses to notice, not being hidden on purpose and not being
  absent.
examples:
- The imperceptibility of the sound made it hard to hear.
- The star's imperceptibility to the naked eye surprised them.
