simpleMeaning: A small whale with a fin on its back, found in the coastal waters of the Atlantic and Pacific
scope: Minke whale and piked whale are other names for this small whale of coastal waters; it is not the
  larger fin whale and not other whales of the open sea.
examples:
- The lesser rorqual feeds in coastal waters.
- We watched a lesser rorqual surface near the shore.
