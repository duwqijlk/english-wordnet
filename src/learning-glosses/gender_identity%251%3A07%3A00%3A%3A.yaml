senseId: 'gender_identity%1:07:00::'
synsetId: 04625716-n
simpleMeaning: How a person feels about being male or female inside themselves; this knowing of oneself
  usually starts as a baby and grows stronger in youth.
scope: This is how a person feels about being male or female, not how others see them or a label given
  at birth.
examples:
- Her gender identity as a woman was clear to her from a young age.
- His gender identity did not match the sex written on his birth record.
