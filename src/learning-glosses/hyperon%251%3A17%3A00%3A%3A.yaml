simpleMeaning: A heavy tiny bit of matter that is not one of the bits in an atom's core, falls apart soon,
  and weighs more than a neutron.
scope: A heavy tiny bit of matter that is not one of the bits in an atom's core, not a proton or a neutron,
  and not a stable bit of matter.
examples:
- The hyperon broke apart a moment after it was made.
- Physicists found a hyperon heavier than a neutron.
