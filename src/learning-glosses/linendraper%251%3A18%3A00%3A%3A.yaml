simpleMeaning: Cloth by the yard is what this shopkeeper sells
scope: A shopkeeper who sells cloth by the yard, not a tailor and not a maker of clothes.
examples:
- The linendraper cut two yards of linen for the curtains.
- She bought her sheets from the linendraper in town.
