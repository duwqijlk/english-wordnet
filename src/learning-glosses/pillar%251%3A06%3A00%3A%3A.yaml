simpleMeaning: In architecture, a tall upright post shaped like a tube that holds up the thing above it
scope: 'Also called column: a post that holds up part of a building, not a free-standing monument and
  not a tall shape like a tower of smoke.'
examples:
- The pillars held up the roof of the old hall.
- Two stone pillars stand at each side of the door.
