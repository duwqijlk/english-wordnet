simpleMeaning: Usually meaning to steal or to hurt someone, to get into a place or an online account that
  belongs to another person without leave.
scope: 'Also called break: to get into a place or an online account that belongs to another person without
  leave, not a visit made with leave and not a break in work.'
examples:
- Someone tried to break in while I was on vacation.
- Who tried to break in to my account last night?
