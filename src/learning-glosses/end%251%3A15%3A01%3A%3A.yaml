senseId: 'end%1:15:01::'
synsetId: 08583423-n
simpleMeaning: The outer limit or furthest point of something, where it stops.
scope: This is not the aim of a plan and not the flat end face of a solid object; it is the limit or furthest
  point where something such as a road or room stops.
examples:
- They walked to the end of the street.
- There is a small shop at the far end of the platform.
