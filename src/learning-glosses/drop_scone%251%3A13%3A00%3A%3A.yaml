simpleMeaning: A small round cake made by letting a spoonful of soft mixture fall on a hot flat pan.
scope: A small round cake made by letting a spoonful of soft mixture fall on a hot flat pan; griddlecake
  is another name for this sense, not a baked cake and not a pancake.
examples:
- She made drop scones for tea.
- The drop scone was still warm from the griddle.
