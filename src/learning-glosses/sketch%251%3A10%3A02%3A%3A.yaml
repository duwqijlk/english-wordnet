simpleMeaning: a funny drawing in a newspaper or magazine that makes fun of people or events
scope: 'Also called a cartoon: a funny drawing in a newspaper or magazine, not a first rough drawing and
  not the act of drawing or of telling the main points.'
examples:
- The newspaper printed a funny sketch of the mayor.
- I liked the sketch in the magazine that made fun of the king.
