simpleMeaning: A demon of the sea, one of a Celtic group, is at times tied to the power of nature that
  works against people.
scope: Also called Fomor; one of a group of Celtic sea demons, not the whole group and not a demon of
  another people.
examples:
- In the old tale, a Fomorian came out of the sea.
- The Fomorian in the story was one of the Celtic sea demons.
