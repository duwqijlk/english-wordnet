simpleMeaning: Things that are like the things of Eritrea, or that have to do with that land or its people,
  are what this word is about.
scope: Said of things to do with Eritrea or its people, not of a person who comes from there.
examples:
- The Eritrean civil war changed the lives of many people.
- She wore an Eritrean dress to the party.
