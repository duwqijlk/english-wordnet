simpleMeaning: a thing put in place to hide something or keep it safe from view
scope: Something that hides or shelters a thing, with cover, screen and covert as other names for this
  sense, and not the act of hiding or a secret plan.
examples:
- A screen of trees gave the house concealment from the road.
- The brush provided concealment for the deer.
