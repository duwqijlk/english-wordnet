simpleMeaning: A thick-branched tree of Africa and southwest Asia, propped by low branches; it bears clusters
  of edible but poor fruit on bare twigs and is the sycamore of the Bible.
scope: This is the tree that yields those small figs, the one the Bible calls the sycamore; it is not
  the plane tree with flaking bark, and not the maple with five-lobed leaves.
examples:
- Mulberry fig trees grow along the riverbanks of East Africa.
- The mulberry fig produces small edible fruit that people do not value highly.
