simpleMeaning: a person who hands over goods or money to another person to keep and look after in trust
scope: A person who hands over goods or money for another person to keep in trust, not the person who
  takes the goods to keep them and not a person who sells goods.
examples:
- The bailor gave the jewels to the shop to keep while she was away.
- As bailor, he handed the money to his friend in trust.
