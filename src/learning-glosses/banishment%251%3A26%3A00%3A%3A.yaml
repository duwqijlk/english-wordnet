simpleMeaning: the state of being forced to live away from a place, or shut out from society because most
  people agree to shut you out
scope: 'Also called ostracism: this is the state of being sent away or shut out, not the act itself of
  sending someone away or shutting them out.'
examples:
- After the scandal, he lived in banishment far from the city and his old friends.
- Her banishment from the group left her with no one to talk to.
