simpleMeaning: Risk or danger does not stop a person with this quality from taking on the things that
  carry them
scope: The quality of being ready to take on things that carry risk or danger, also called boldness, daring
  and hardiness, not fearlessness and not recklessness.
examples:
- The climb called for great hardihood.
- It took hardihood to start the business in hard times.
