simpleMeaning: Blades that spin round overhead lift this wingless flying machine into the air and keep
  it there.
scope: Also called helicopter, chopper, and eggbeater, it gets its lift from blades that spin round overhead,
  not from fixed wings.
examples:
- The whirlybird landed without a runway.
- A whirlybird hovered in the air, its blades spinning fast.
