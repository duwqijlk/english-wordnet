simpleMeaning: A child's game, or an exercise for heart and lungs, in which the player leaps over a swinging
  cord.
scope: A child's game or an exercise for heart and lungs, leaping over a swinging cord, not a game played
  with a ball and not running on the spot.
examples:
- The children played jump rope in the yard.
- She does jump rope every morning for exercise.
