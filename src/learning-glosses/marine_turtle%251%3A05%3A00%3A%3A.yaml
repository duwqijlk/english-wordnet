simpleMeaning: In warm seas all over the world swim big shelled animals whose legs have become flat arms
  for swimming, one of several such kinds.
scope: Also called sea turtle, this is one of several kinds of big shelled animal in warm seas, not one
  that lives on dry land.
examples:
- A marine turtle came up for air beside the boat.
- Marine turtles swim through warm seas.
