simpleMeaning: A tropical American plant whose large, fleshy, edible fruit has a tuft of stiff leaves
  at the top; widely grown in the tropics.
scope: The plant that bears the fruit, not the fruit as food; pineapple plant is another name for this
  same plant.
examples:
- A pineapple in the field bore a large fruit with a tuft of stiff leaves.
- The pineapple is widely cultivated in the tropics.
