simpleMeaning: To lose all your strength, or to take all of someone's strength, after too much use or
  heavy strain
scope: To leave someone with no strength left after too much use or heavy strain, also called wear, tire,
  weary, and fatigue, not the green stone and not the colour.
examples:
- The long climb jaded the whole party.
- Hours of hard work had jaded the horses.
