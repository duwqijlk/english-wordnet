simpleMeaning: a sweet thing worked in the mouth, most often made with chicle, a sticky stuff from a tree,
  and sugar
scope: 'Also called gum: a sweet thing worked in the mouth, not a sweet for eating and not the sticky
  stuff from a tree on its own.'
examples:
- She took a piece of chewing gum from her bag and popped it in her mouth.
- He offered me a stick of chewing gum after lunch.
