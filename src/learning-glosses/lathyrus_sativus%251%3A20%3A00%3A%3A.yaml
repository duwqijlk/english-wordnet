simpleMeaning: A yearly plant from Europe, grown to feed farm animals, whose seeds are eaten as food in
  India and fed to animals in other places.
scope: It is a food and feed plant, not a garden flower or a wild pea; also called grass pea, khesari,
  and Indian pea.
examples:
- The farmer grew Lathyrus sativus for feed.
- Lathyrus sativus seeds are eaten as food in India.
