simpleMeaning: In computing, a program that tries to work out what a word or phrase means from the words
  around it, for handling human speech and writing.
scope: This program in computing tries to work out what a word or phrase means from the words around it.
examples:
- The disambiguator chose the right sense of 'bank' from the words around it.
- A disambiguator helps a computer tell which meaning of a word is meant.
