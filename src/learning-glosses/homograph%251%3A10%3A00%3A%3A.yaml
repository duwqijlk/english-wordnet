simpleMeaning: Two words spelled exactly the same but with different meanings, like fair, which can mean
  just or a show
scope: Two words with the same spelling but different meanings; not two words that sound the same but
  are spelled differently, and not two spellings of one word.
examples:
- The words 'fair' and 'fair' are homographs, one meaning just and the other a show.
- A homograph can trick a reader who knows only one of its meanings.
