simpleMeaning: A person's face, called 'kisser' or 'mug' in everyday talk, and 'phiz' in Britain.
scope: A person's face, also called a mug or a countenance, and also called visage, kisser, physiognomy,
  or phiz, with 'smiler' as one more everyday word for it and 'phiz' as the British word; not a person
  who smiles.
examples:
- He wiped the sweat from his smiler after the run.
- She had a smudge of paint on her smiler.
