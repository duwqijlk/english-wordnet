simpleMeaning: The small shift in how far a far-off body in the sky seems to move, worked out from two
  points on the earth's path around the sun.
scope: A measure of a body's place in the sky from two points on the earth's path round the sun; annual
  parallax is another name for this sense, and this is not the shift seen from two points on the earth
  itself.
examples:
- The heliocentric parallax of the star gave its distance from the sun.
- Astronomers used heliocentric parallax to work out how far away the planet is.
