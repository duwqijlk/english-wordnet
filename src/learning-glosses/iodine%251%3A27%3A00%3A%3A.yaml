simpleMeaning: a non-metal element of the halogen group, used above all in medicine, photography and dyes,
  and found only joined to other things, in small amounts in sea water or rocks
scope: A chemical element used in medicine and dyes; I, atomic number 53 and iodin are other names for
  this sense; not the brown liquid used on wounds.
examples:
- The scientist found a small amount of iodine in the sea water.
- Iodine is added to table salt in many countries.
