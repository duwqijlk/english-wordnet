simpleMeaning: From the right lower room of the heart, one blood tube takes blood low in oxygen and splits
  into a tube for each lung.
scope: It is also called truncus pulmonalis, and it is the blood tube that carries blood low in oxygen
  from the heart to the lungs, not a vein.
examples:
- The pulmonary trunk divides into the right and left pulmonary arteries.
- Blood low in oxygen leaves the heart through the pulmonary trunk.
