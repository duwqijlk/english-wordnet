simpleMeaning: From the drum of the ear to the inner ear, sound shakes travel through these small bones
  of the middle ear
scope: These are small bones of the middle ear that carry sound shakes onward, not the drum of the ear
  itself and not the inner ear itself.
examples:
- The auditory ossicle carries sound shakes from the eardrum to the inner ear.
- An auditory ossicle is one of the small bones of the middle ear.
