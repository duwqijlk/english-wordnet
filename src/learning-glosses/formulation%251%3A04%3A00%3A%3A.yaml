simpleMeaning: Thinking up an idea or an explanation and shaping it in your mind
scope: 'This sense is also called conceptualization and conceptualisation: the act of thinking up and
  shaping an idea in the mind. It is not a material made by following a set list of what goes into it
  and how much of each thing to use.'
examples:
- The formulation of the plan took weeks of careful thought.
- Her careful formulation of the idea helped the team see the problem clearly.
