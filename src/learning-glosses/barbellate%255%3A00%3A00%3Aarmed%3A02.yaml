simpleMeaning: Bearing sharp bits that guard it, such as spines, thorns, quills or stiff hairs, with other
  such bits as well.
scope: This word is also called prickly, bristled, barbed, thorny, bristly, spiny, burred, briary, briery,
  burry, setaceous and setose.
examples:
- The barbellate leaves pricked her fingers.
- Barbellate stems make the plant hard to hold.
