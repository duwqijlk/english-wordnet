simpleMeaning: with nothing added to make it look nicer; simple and with no extra parts for show
scope: Also called bare and spare. This means simple with nothing added, not clear and easy to understand
  and not saying you are unhappy.
examples:
- She wore a plain black dress with no pattern.
- They chose plain white walls for the small room.
