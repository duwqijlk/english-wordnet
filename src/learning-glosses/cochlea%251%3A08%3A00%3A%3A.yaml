simpleMeaning: the snail-shaped tube in the inner ear whose hearing organ turns sound vibrations into
  nerve signals.
scope: This is the hearing organ inside the inner ear, not the outer ear, the eardrum, or a snail shell.
examples:
- The cochlea turns sound waves into nerve signals.
- Loud noise can damage the hair cells inside the cochlea.
