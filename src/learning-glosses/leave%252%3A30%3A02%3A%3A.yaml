simpleMeaning: to let something stay as it is, to avoid disturbing it, or to not take it.
scope: This is not about going away from a place, and not about forgetting something by accident; it is
  about letting something stay as it is, not disturbing it, or not taking it.
examples:
- Leave the keys on the table; I will pick them up later.
- They left the old shed untouched at the end of the garden.
