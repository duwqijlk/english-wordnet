simpleMeaning: It can turn in every direction because a ball on the end of one bone sits in a round hollow
  in the next bone.
scope: Also called a ball-and-socket joint, cotyloid joint, enarthrodial joint, enarthrosis, and articulatio
  spheroidea, it is the kind that can turn in every direction.
examples:
- The shoulder is a spheroid joint that lets the arm swing in all directions.
- The hip works as a spheroid joint when the leg turns.
