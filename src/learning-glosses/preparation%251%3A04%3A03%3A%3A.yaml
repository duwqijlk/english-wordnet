simpleMeaning: the act of making something such as food ready by heating it
scope: Making food ready by heating it, not the state of being ready, not a thing made to a set plan,
  and not school work done at home.
examples:
- The preparation of the soup took an hour over a low heat.
- The preparation of the rice by heating it in water took twenty minutes.
