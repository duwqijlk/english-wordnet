simpleMeaning: knowing who you are, and where and when you are, and how you stand with the people around
  you
scope: A person's sense of who and where they are and how they relate to others, not a set of beliefs,
  and not a compass direction.
examples:
- After the fall, she lost her orientation and did not know where she was.
- The doctor asked him questions to test his orientation to time and place.
