simpleMeaning: Swelling and soreness in a bone after germs get in, after a bad injury, or after it slowly
  wears away
scope: Swelling and soreness in a bone after germs get in, after a bad injury, or after it slowly wears
  away, not a broken bone and not joint pain.
examples:
- Osteitis left his shin bone swollen and sore.
- The doctor said the osteitis came after the cut got germs in it.
