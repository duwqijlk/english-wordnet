simpleMeaning: In botany, one or more green parts grow out of a small bump on a plant stem
scope: Also called a node, this is a small bump on a plant stem where green parts grow out, not a joint
  between stem parts and not a bump on a root.
examples:
- The leaf node on the stem showed where a new leaf would grow.
- She cut the stem just above a leaf node.
