simpleMeaning: Sore skin is soothed most often with this sticky stuff from trees
scope: A sticky stuff from trees that soothes sore skin, also called asa dulcis, benjamin, benzoin and
  gum benzoin, not a glue and not a skin cream.
examples:
- The healer rubbed gum benjamin on the rash.
- Gum benjamin was kept in the shop for sore skin.
