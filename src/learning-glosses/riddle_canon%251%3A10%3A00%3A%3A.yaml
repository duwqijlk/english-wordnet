simpleMeaning: a piece of music in which the start of each new part is shown only by secret signs and
  marks, a form liked in the 1400s and 1500s
scope: Also called an enigma canon, an enigmatic canon, and an enigmatical canon; not a plain canon with
  clear parts and not a puzzle in words.
examples:
- The riddle canon hid each new part behind secret signs.
- Singers in the 1500s loved a riddle canon.
