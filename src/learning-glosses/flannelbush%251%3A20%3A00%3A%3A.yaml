simpleMeaning: From California and the north of Mexico come handsome shrubs that keep their leaves all
  year, several kinds with soft-haired leaves in rounded parts and showy yellow flowers.
scope: Also called flannel bush, this is a shrub with yellow flowers from California and northern Mexico,
  not a tree and not a flower grown for cloth.
examples:
- A flannelbush stood at the edge of the garden.
- The flannelbush by the path had yellow flowers.
