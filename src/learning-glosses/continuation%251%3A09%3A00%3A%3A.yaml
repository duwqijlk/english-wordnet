schema: oewn-learning-gloss-v2
senseId: 'continuation%1:09:00::'
synsetId: 06260338-n
simpleMeaning: In Gestalt (the study of how the mind sees shapes as whole things), a rule that people
  by nature see a line as going on the way it started
scope: 'Also called good continuation and law of continuation: a rule about seeing lines, not the act
  of going on with something, not making it last longer, and not an added part of a book or play.'
examples:
- The teacher used continuation to show why we see the broken line as one line.
- In the drawing, continuation makes the line look whole, even where it is hidden.
