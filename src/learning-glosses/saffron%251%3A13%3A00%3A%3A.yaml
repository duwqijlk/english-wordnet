simpleMeaning: The dried, sharp-smelling threads from the flower of a crocus from the Old World.
scope: The dried, sharp-smelling threads from the flower of a crocus from the Old World; not the crocus
  plant itself, and not the yellow-orange colour.
examples:
- She added a pinch of saffron to the rice.
- Good saffron is dear because so many flowers are needed for a little of it.
