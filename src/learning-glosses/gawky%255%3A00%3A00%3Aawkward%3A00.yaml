simpleMeaning: not smooth or easy in the way a person moves or holds their body
scope: Also called clumsy, ungainly, clunky and unwieldy. This is about moving or holding the body in
  a way that is not smooth, not about being rude or slow to learn.
examples:
- The tall, gawky boy tripped over his own feet.
- She felt gawky as she walked across the stage in new shoes.
