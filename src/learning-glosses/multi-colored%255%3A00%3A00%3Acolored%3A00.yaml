simpleMeaning: Having parts or patches in different shades, and usually in bright shades.
scope: Having parts in different bright shades; painted, multicolor, multicolored, motley, piebald, pied,
  calico, multicolour, multicoloured, multi-color, multi-colour, multi-coloured, particolored and particoloured
  are other names for this, not plain and not one shade only.
examples:
- He bought a multi-colored kite with bright patches.
- The multi-colored scarf had patches in many shades.
