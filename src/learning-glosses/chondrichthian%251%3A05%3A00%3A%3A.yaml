simpleMeaning: fish whose inner frame may be hardened with a chalk-like stuff but is not made of hard
  bone
scope: Fish with a frame that may be hardened but is not made of hard bone, also called cartilaginous
  fish, not fish with frames of hard bone.
examples:
- Sharks are chondrichthian fish.
- The chondrichthian group has frames that are not made of hard bone.
