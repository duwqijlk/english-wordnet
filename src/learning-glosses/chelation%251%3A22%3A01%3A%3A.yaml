simpleMeaning: the way a ring forms when one or more hydrogen bonds, links in which a hydrogen atom joins
  two things, are made
scope: A way a ring forms, not the medical way of clearing a harmful metal from the blood.
examples:
- Chelation forms a ring when the hydrogen bonds join the parts.
- During chelation, the ring takes shape as the bonds form.
