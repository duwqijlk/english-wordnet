simpleMeaning: to change so that a substance is alkaline, the opposite of acid
scope: Also called alkalinize; to turn alkaline, not to make something else alkaline.
examples:
- The soil will alkalinise if lime is added.
- Rain can make the lake water alkalinise over time.
