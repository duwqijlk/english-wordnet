simpleMeaning: 'A measure of heat: the heat needed to warm one pound of water by one degree Fahrenheit
  at normal air pressure, equal to about 252 calories.'
scope: This is a measure of heat based on warming water; British thermal unit and B.Th.U. are other names
  for it, not the calorie or the joule, which are other measures of heat.
examples:
- One BTU warms a pound of water by a single degree.
- The heater gives out thousands of BTUs each hour.
