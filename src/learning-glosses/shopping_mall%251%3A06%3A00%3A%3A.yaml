simpleMeaning: A retail site built as a neatly landscaped group of shops for leading retailers, usually
  with restaurants and convenient parking, and a modern form of the traditional marketplace.
scope: Another name for shopping center, shopping centre, mall, plaza, center and centre in this retail
  sense — a landscaped complex of shops, not a single store or an open-air market.
examples:
- The shopping mall was busy on Saturday, with families moving between the stores and the restaurants.
- A new shopping mall opened outside the city, with hundreds of shops and easy parking.
