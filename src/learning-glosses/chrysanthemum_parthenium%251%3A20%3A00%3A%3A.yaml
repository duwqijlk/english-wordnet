simpleMeaning: A bushy sweet-smelling European herb that lives many years, with groups of button-like
  flower heads with white rays; long prized for healing, sometimes grouped with its kin.
scope: Also called feverfew and Tanacetum parthenium; a bushy sweet-smelling herb with white-rayed flower
  heads, not a tall shrub and not a flower grown only for show.
examples:
- Chrysanthemum parthenium grows in the herb garden.
- The white flower heads of Chrysanthemum parthenium were once used for healing.
