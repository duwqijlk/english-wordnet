simpleMeaning: written words that say where a place is, written on a letter or package that is to be sent
  to that place
scope: 'Also called address: the written words on a letter or package that say where it must go; not the
  place itself that a person is travelling to.'
examples:
- The destination on the letter was hard to read, so it could not be delivered.
- Write the destination clearly on the front of the package before you send it.
