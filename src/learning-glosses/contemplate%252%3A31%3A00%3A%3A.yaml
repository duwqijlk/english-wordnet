simpleMeaning: to think with full attention for a long time, as people do for spiritual reasons
scope: Also called study. This is long, deep thinking for spiritual reasons, not thinking about a possible
  future action and not looking at something in a thoughtful way.
examples:
- She went to a quiet room to contemplate, seeking peace in prayer.
- The monks contemplate in silence as part of their daily prayer.
