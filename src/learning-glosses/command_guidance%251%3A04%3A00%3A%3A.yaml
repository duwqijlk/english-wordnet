simpleMeaning: A way of steering a missile in flight by orders sent from the ground or from another missile
scope: A way of steering a missile in flight by orders sent from the ground or from another missile; not
  orders given before the launch and not steering by the missile itself.
examples:
- The missile used command guidance from the ground station.
- With command guidance, the second missile took its orders from the first.
