simpleMeaning: In grammar, a word, phrase or clause that forms part of a larger piece of language.
scope: 'Also called a constituent: in grammar, a word, phrase or clause that forms part of a larger piece
  of language, not a whole sentence and not a single letter.'
examples:
- The phrase 'in the garden' is a grammatical constituent of the sentence.
- Each grammatical constituent of the sentence has its own job.
