simpleMeaning: The state of having been made more even or steady
scope: The state of having been made more even or steady, also called regularization; not the act of making
  a thing regular and not a thing left uneven.
examples:
- Regularisation of the timetable made the buses run on time.
- The regularisation of spelling took many years.
