simpleMeaning: A light, strong, grey, shiny metal that does not rust, used in strong light mixtures of
  metals such as those for plane parts; its main sources are rutile and ilmenite.
scope: Also called Ti and titanium; a light, strong, grey, shiny metal that does not rust, distinct from
  heavy metals that rust easily and from light metals that bend easily.
examples:
- Atomic number 22 is the metal used in strong light plane parts.
- The alloy held atomic number 22 from rutile.
