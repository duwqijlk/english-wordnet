simpleMeaning: Sheets, table cloths, pillow cases and the like come out flat and dry from a machine with
  a big heated drum that presses them.
scope: Flatwork ironer is another name for this machine, which presses sheets, table cloths and pillow
  cases flat with a big heated drum and dries them.
examples:
- The hotel used a roller ironer for the sheets and pillow cases.
- The roller ironer dried the table cloths.
