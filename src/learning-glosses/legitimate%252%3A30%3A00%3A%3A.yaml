senseId: 'legitimate%2:30:00::'
synsetId: 00576436-v
simpleMeaning: To make a child born outside marriage count as lawful, or to say in public that a person
  counts as lawful.
scope: The act of making a child born outside marriage count as lawful, or of saying a person counts as
  lawful, not the adjective for a lawful marriage or child, a practice that meets accepted standards,
  a government backed by law, or showing a thing to be fair and right.
examples:
- They legitimized their natural child after the wedding.
- The court legitimized the boy as his father's heir.
