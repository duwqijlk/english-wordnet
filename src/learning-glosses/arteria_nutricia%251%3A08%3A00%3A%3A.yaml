simpleMeaning: A blood tube that feeds the hollow middle of a long bone
scope: Also called a nutrient artery; not the blood tube that feeds the belly muscles and not the one
  that feeds the ovaries.
examples:
- The arteria nutricia runs into the long bone to feed its hollow middle.
- A break in the arteria nutricia can cut off blood to the bone.
