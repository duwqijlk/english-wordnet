simpleMeaning: the force of something pushing on a surface, measured in scientific units such as pascals
  or dynes
scope: This is not a feeling of stress and not the act of pushing something with your hand; it is a scientific
  measure of force on an area.
examples:
- The pressure inside the tyre is too low.
- Deep under the sea, the pressure is very high.
