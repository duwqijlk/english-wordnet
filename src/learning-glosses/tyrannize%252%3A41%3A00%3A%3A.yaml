simpleMeaning: To hold power over a whole country as its single, unchecked ruler.
scope: Also called tyrannise, this is holding power over a whole country as its single ruler, not ruling
  over one person in a cruel and overbearing way.
examples:
- The king began to tyrannize the country after the war.
- He tyrannized the small nation for twenty years.
