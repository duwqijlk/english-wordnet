simpleMeaning: To go to a shop or firm to buy from it, deal with it, or come back to it again and again
  as a customer.
scope: 'Also called shop, and another name for it is frequent, and also sponsor, and also patronize: to
  go to a shop or firm to buy from it, deal with it, or come back to it again and again as a customer.'
examples:
- We patronise the baker on the corner.
- He patronised the same tailor for years.
