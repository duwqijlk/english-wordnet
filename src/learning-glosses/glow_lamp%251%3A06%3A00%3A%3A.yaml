simpleMeaning: a tube filled with gas that lights up when power runs through it, with a hot part inside
  that starts the flow, used in machines that flash light
scope: A gas tube that lights up when power runs through it, not an ordinary light bulb and not a tube
  that gives off heat only.
examples:
- The glow lamp in the old machine lit up when the power ran through it.
- A glow lamp was used in the stroboscope to make quick flashes of light.
