simpleMeaning: Through a thin skin that lets some things through, a liquid is made to evaporate
scope: Making a liquid evaporate as it passes through a thin skin that lets some things through, not letting
  it dry out in the open air.
examples:
- The machine pervaporates the liquid through a thin skin that lets only some parts pass.
- They pervaporate the mix so the liquid turns to gas on the far side of the skin.
