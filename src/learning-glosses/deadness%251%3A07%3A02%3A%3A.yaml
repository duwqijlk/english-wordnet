simpleMeaning: The quality of not answering or reacting, in people shown by a failure to respond quickly
  or with feeling to people or things.
scope: Of a voice, a reply, or a person's manner that shows no feeling or quick response.
examples:
- There was a deadness in her voice that worried him.
- The deadness of his reply showed he had stopped caring.
