simpleMeaning: to turn or lift cut grass, you use a tool with a long handle and prongs
scope: A tool with a long handle and prongs used to turn or lift cut grass; not a short tool for eating
  with and not a rake.
examples:
- He picked up the hayfork to turn the cut grass in the sun.
- She used a hayfork to lift the hay onto the wagon.
