simpleMeaning: A soft, sweet dish served after a meal, made thick, usually with flour, and then baked,
  boiled, or steamed
scope: A soft, sweet dish baked, boiled, or steamed, not the plain savoury dish and not the British name
  for the dessert course.
examples:
- We had chocolate pudding for dessert.
- The pudding was baked in the oven until it was soft and sweet.
