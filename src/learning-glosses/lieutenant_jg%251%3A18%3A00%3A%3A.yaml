simpleMeaning: An officer with a formal rank in the United States Navy or United States Coast Guard, ranked
  above an ensign and one step below the next higher rank.
scope: It is a junior naval officer's rank, not an ensign's rank and not the next higher rank; also called
  lieutenant junior grade.
examples:
- He was a lieutenant JG in the Navy.
- The lieutenant JG outranked the ensign.
