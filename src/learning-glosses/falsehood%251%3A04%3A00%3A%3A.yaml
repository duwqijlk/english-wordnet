simpleMeaning: the act of making a thing false by changing papers, measures, or other things in a dishonest
  way, or by making a false copy of it
scope: The act of making a thing false by changing papers, measures, or other things in a dishonest way,
  or by making a false copy; not a false statement itself and not a simple mistake.
examples:
- The clerk was charged with falsehood for altering the records.
- Falsehood in the accounts cost the firm dearly.
