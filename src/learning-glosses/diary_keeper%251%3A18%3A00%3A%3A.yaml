simpleMeaning: a person who writes down what happens each day in a book
scope: A person who writes down what happens each day in a book, also called journalist; not a person
  who writes news for a paper, and not a person who keeps a ship's log.
examples:
- The diary keeper wrote in her book every night.
- As a diary keeper, he noted each day's events.
