simpleMeaning: the wood of one of two very tall California trees with cones that grow to 300 feet tall,
  sometimes put in the Taxodiaceae family (a group of such trees)
scope: 'Also called sequoia: this is the wood from such a tree, not the living tree itself.'
examples:
- The table is made of redwood from California.
- They used redwood to build the outdoor seats because it lasts a long time.
