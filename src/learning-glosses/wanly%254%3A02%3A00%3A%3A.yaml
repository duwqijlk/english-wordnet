simpleMeaning: in a weak way, with little colour in the face and little energy
scope: In a weak way, with little colour and little energy; not in a strong, bright way and not in a way
  full of energy.
examples:
- She smiled wanly after her long illness.
- He waved wanly from his bed, too tired to sit up.
