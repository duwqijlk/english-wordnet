simpleMeaning: Freedom for a person from being kept, bound, or pressed down by others
scope: Personal freedom from being held or forced, not freedom from rule by one person's will, and not
  leave given to a sailor.
examples:
- After years in prison, he longed for liberty.
- Liberty let her travel where she wished.
