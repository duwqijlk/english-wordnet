simpleMeaning: A way of hurting a person by pulling and stretching their body
scope: A way of hurting someone by stretching them, not the tool that does it and not a cut of meat.
examples:
- Prisoners were put on the rack and stretched until they confessed.
- The rack was a feared form of torture in old times.
