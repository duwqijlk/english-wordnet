simpleMeaning: A line that, once crossed, leaves no way back and most often binds a person to a firm choice
scope: A line that, once crossed, leaves no way back and most often binds a person to a firm choice, also
  called point of no return, not a real river and not a choice that can be undone.
examples:
- By signing the paper, he crossed the Rubicon.
- Once she left her job, there was no going back; she had crossed the Rubicon.
