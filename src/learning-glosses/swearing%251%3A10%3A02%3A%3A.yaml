simpleMeaning: The use of rude or dirty words, usually when taken by surprise or in anger.
scope: Also called a curse, an oath, and cuss, this is rude words said in surprise or anger, not a promise
  to tell the truth in court.
examples:
- His swearing shocked the children in the room.
- There was much swearing when the car broke down.
