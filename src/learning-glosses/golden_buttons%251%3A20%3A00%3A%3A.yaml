simpleMeaning: a common plant of Eurasia that lives for years and smells sweet, with round yellow flower
  heads like small knobs and bitter feather-like leaves, at times used as a medicine
scope: 'Also called tansy and scented fern: a common sweet-smelling Eurasian plant with round yellow flower
  heads and bitter leaves, not a garden flower grown for show.'
examples:
- The golden buttons grew in a thick patch behind the barn.
- She picked golden buttons for the herb drawer, though the leaves tasted bitter.
