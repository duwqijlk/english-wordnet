simpleMeaning: the act of laying something down as a starting point, or a basic assumption accepted without
  proof and used as a basis for reasoning
scope: This is a starting assumption laid down for reasoning, not a job, a side's opinion in a dispute,
  social rank, or the circumstances someone is in.
examples:
- Euclid's geometry begins with the position that all right angles are equal.
- The whole theory starts from the position that every event has a cause.
