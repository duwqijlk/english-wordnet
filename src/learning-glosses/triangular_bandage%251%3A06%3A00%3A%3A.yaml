simpleMeaning: To hold up a hurt lower arm, a wide three-sided piece of cloth is hung from around the
  neck as a bandage.
scope: Sling and scarf bandage are other names for this bandage, a wide three-sided piece of cloth hung
  from around the neck to hold up a hurt lower arm.
examples:
- She wore a triangular bandage to hold her hurt forearm still.
- The triangular bandage hung from around his neck, holding up his hurt arm.
