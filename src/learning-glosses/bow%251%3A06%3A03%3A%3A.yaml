simpleMeaning: A fastening made of two loops and loose ends, used for tying shoelaces.
scope: This is the tied loop used on shoes, not the decorative ribbon trimming and not the bend of the
  body.
examples:
- He tied his shoes with a neat bow.
- The bow came undone and she tripped on her lace.
