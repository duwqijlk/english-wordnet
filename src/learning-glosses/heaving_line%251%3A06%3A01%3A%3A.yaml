simpleMeaning: So a thicker rope can be pulled over, a light rope with a weight tied to one end is tossed
  from one boat to another or to land.
scope: A light rope with a weight tied to one end is tossed between boats or to land so a thicker rope
  can be pulled over, and it is not the thick rope itself.
examples:
- He threw the heaving line across to the other ship.
- They used the heaving line to pull the thick rope over.
