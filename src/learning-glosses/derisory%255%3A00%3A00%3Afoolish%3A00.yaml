senseId: derisory%5:00:00:foolish:00
synsetId: 02581199-s
simpleMeaning: Too far from sense to escape scornful laughter.
scope: This sense is also called ridiculous, absurd, ludicrous, idiotic, preposterous, laughable, nonsensical,
  and cockeyed, for being too far from sense to escape scornful laughter, where the ridiculous is silly
  and wrong-headed, laughed at in scorn, the absurd is silly and short of good sense, laughed at, the
  ludicrous is far from reason, making folk laugh at it in scorn, and the idiotic is a thing laughed at
  in scorn for having no sense in it at all.
examples:
- The offer was derisory, far from sense.
- The price was derisory, drawing scornful laughter.
