simpleMeaning: either of two related body chemicals that control the making of prostaglandins, chemicals
  that bring on pain and swelling, and are stopped by aspirin
scope: 'Also called cyclooxygenase: either of two related body chemicals that control the making of prostaglandins,
  chemicals that bring on pain and swelling, and are stopped by aspirin, not the prostaglandins themselves
  and not a drug.'
examples:
- Cox enzymes control the making of prostaglandins.
- Aspirin blocks Cox.
