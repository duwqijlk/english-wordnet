simpleMeaning: the hollow tube that runners in a relay race hand to each other as each one finishes their
  part
scope: A hollow tube passed between runners in a relay race, not the thin rod a conductor uses and not
  a policeman's club.
examples:
- The runner took the baton and sprinted down the track.
- She passed the baton to her teammate without dropping it.
