simpleMeaning: 'Since long ago, messages have been sent with things seen: smoke, fires on high ground,
  or light bounced off a bright face.'
scope: It is a way of sending a message with things seen, such as smoke, fires on high ground, or light
  bounced off a bright face.
examples:
- The optical telegraph sent the message with smoke signals.
- The optical telegraph passed the news with light bounced off a bright face.
