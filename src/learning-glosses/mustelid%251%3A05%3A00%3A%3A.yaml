simpleMeaning: Meat-eating mammals with fur and feet whose toes are split apart.
scope: Meat-eating mammals with fur and feet whose toes are split apart; musteline and musteline mammal
  are other names for them, not plant-eating mammals and not animals with hoofs.
examples:
- The mustelid slipped into the burrow at dusk.
- Otters and weasels are mustelids.
