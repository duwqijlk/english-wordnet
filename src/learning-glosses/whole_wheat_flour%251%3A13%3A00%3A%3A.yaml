simpleMeaning: The grain ground up with nothing taken out, the hard outer coat left in; in Britain it
  goes by another name.
scope: Also called graham, graham flour, and whole meal flour, this is the grain ground up with nothing
  taken out and the hard outer coat left in; in Britain it is called whole meal flour, unlike white flour,
  from which the coat is taken out.
examples:
- She used whole wheat flour for the bread.
- Whole wheat flour keeps the bran in the loaf.
