simpleMeaning: a bit of cutlery with a small round cup and a handle, used to stir food or to lift it and
  serve it
scope: A bit of cutlery with a small round cup and a handle for stirring, lifting, and serving food, not
  a golf club and not a measure of how much it holds.
examples:
- She stirred her tea with a spoon.
- He ate the soup with a spoon.
