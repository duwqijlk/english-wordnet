simpleMeaning: A shrub with peeling bark and paired, usually toothed leaves, and loose clusters of white
  or pink flowers at the ends of its branches.
scope: A flowering shrub with peeling bark and clustered pink or white blooms, not a tree or a vine.
examples:
- Deutzia bears loose clusters of white flowers in early summer.
- The deutzia's peeling bark is striking in winter.
