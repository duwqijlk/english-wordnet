simpleMeaning: A complex neural structure, sea-horse-shaped, of grey matter on the floor of each lateral
  ventricle; part of the limbic system, closely involved in motivation and emotion, central to forming
  memories.
scope: This is the brain structure itself, not the spaces called ventricles that it lies on and not the
  limbic system as a whole. It is an anatomy term, and 'sea horse' in the source is only a comparison
  of shape.
examples:
- The scan showed a small lesion in his right hippocampus.
- Damage to the hippocampus can leave someone unable to form new memories.
