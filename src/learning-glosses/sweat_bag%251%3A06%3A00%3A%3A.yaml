simpleMeaning: a sack with tiny holes, often made of heavy cloth, that holds water and cools it as the
  water dries away
scope: This is a sack with tiny holes, often of heavy cloth, that holds water and cools it as the water
  dries away, not a solid bottle and not a sack for dry goods.
examples:
- He hung the sweat bag from a branch to keep the water cool.
- The sweat bag slowly cooled the drinking water in the heat.
