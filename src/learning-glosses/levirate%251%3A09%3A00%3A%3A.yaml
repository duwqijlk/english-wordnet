simpleMeaning: So that a dead brother's line goes on, a rule from the Bible says a man must wed the widow
  of his brother who died with no children.
scope: The Bible rule that keeps a dead brother's line going is the levirate.
examples:
- Under the levirate, he wed his brother's widow.
- His brother died with no children, so the levirate said he must wed the widow.
