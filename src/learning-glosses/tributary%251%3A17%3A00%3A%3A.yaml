simpleMeaning: a smaller river or stream that flows into the main river or stream
scope: 'Also called affluent and feeder: this is the smaller stream itself, not the main river it joins,
  not the describing word for such a stream, and not paying money or goods to a ruler.'
examples:
- This small tributary joins the river just north of the town.
- After heavy rain, every tributary was full and flowing fast.
