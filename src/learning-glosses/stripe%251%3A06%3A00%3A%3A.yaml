simpleMeaning: A long, narrow band of a different colour or stuff, put on a thing to make it look nice
scope: Also called band, this is a strip put on a thing to make it look nice, not a bit of braid on a
  sleeve that shows rank or length of service and not a narrow mark of a different colour or feel.
examples:
- A red stripe runs along the side of the dress.
- The stripe on the cushion adds a bright touch.
