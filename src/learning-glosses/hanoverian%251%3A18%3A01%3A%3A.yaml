simpleMeaning: One who belongs to the family of Hanover, or speaks for it.
scope: This word is for a member or supporter of the family of Hanover, not for one of the British rulers
  from that family and not for things of that family.
examples:
- The Hanoverian stood by the family in the dispute.
- Several Hanoverians backed the family of Hanover.
