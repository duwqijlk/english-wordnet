senseId: 'modulate%2:32:00::'
synsetId: 00984325-v
simpleMeaning: to let your voice go up and down in high and low sounds as you speak
scope: 'Also called tone and inflect: the rise and fall of your voice when you speak, not a change in
  how loud something is and not a change to radio waves.'
examples:
- A good teacher modulates her voice so the class does not get bored.
- He modulated the pitch of his speech to sound more friendly.
