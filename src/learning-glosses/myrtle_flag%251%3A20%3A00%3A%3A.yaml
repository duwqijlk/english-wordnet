simpleMeaning: A marsh plant that lives for many years, with sword-like leaves and roots that smell sweet.
scope: A marsh plant with sword-like leaves and sweet-smelling roots; calamus and flagroot are other names
  for this, and it is not a garden flower or a water lily.
examples:
- Myrtle flag grows in the marsh.
- The myrtle flag has sword-like leaves.
