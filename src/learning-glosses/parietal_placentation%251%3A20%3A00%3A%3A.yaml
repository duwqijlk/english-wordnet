simpleMeaning: Inside a joined seed case, slight growths from the wall make broken walls, and the parts
  that grow into seeds form on the wall or on those growths.
scope: 'The parts that grow into seeds are set out inside a joined seed case in this way: on its wall
  or on slight growths from the wall.'
examples:
- The flower showed parietal placentation, with the parts that grow into seeds on the wall of the seed
  case.
- In parietal placentation the parts that grow into seeds form on slight growths from the wall.
