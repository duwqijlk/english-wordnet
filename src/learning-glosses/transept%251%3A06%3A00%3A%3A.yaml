simpleMeaning: the part of a cross-shaped church that goes across the main long part and meets it at a
  right angle
scope: This is the side part that crosses the main long part of a cross-shaped church, not the main long
  part itself and not the whole church.
examples:
- We sat in the transept, to the side of the main part of the church.
- The transept crosses the church at a right angle near the front.
