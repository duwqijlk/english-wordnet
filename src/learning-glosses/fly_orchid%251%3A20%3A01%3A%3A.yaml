simpleMeaning: A plant of Europe whose blooms look like small winged insects.
scope: A plant of Europe whose blooms look like small winged insects; not a low creeping plant with hairy
  blooms on thin stems and not a plant whose blooms look like bees.
examples:
- The fly orchid grows wild in the meadows of Europe.
- Its blooms look so like flies that the fly orchid fools the eye.
