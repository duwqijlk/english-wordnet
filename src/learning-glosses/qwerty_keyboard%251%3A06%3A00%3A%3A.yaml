simpleMeaning: The standard set of keys on a typewriter, where Q, W, E, R, T and Y are the first six from
  the left on the top row of letter keys.
scope: The standard set of keys on a typewriter, named for its first six letter keys, Q, W, E, R, T and
  Y, on the top row.
examples:
- She typed on a QWERTY keyboard every day at work.
- The QWERTY keyboard on his laptop had worn letter keys.
