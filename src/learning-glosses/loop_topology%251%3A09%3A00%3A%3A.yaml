simpleMeaning: In a network, a ring of parts joined one after another so the last part joins back to the
  first.
scope: In a network, a ring of parts joined one after another with the last joined back to the first;
  loop is another name for this sense, not a line of parts with two free ends.
examples:
- The office network used a loop topology, so each computer linked to the next in a ring.
- With a loop topology, the last machine links back to the first.
