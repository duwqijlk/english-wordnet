senseId: 'bellyband%1:06:00::'
synsetId: 02830204-n
simpleMeaning: A strap round the belly of a horse or ox that pulls a cart, holding the shafts of the cart
  in place.
scope: A strap round the belly of a horse or ox that pulls a cart, not a cloth band worn round the waist,
  as on a baby till the navel has healed.
examples:
- The bellyband slipped, and the shafts of the wagon sagged.
- He tightened the bellyband before the horse set off with the cart.
