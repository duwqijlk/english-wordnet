simpleMeaning: In astronomy, a way of telling the hour from the steady movement of an imagined sun moving
  at a set speed round the middle of the sky
scope: In astronomy, time from the steady movement of an imagined sun; mean time is another name for this
  sense, not clock time set by law, and not time from the real sun's uneven movement.
examples:
- Mean solar time is based on an imagined sun that moves at a steady speed.
- Before standard time, towns kept mean solar time from the sun's steady motion.
