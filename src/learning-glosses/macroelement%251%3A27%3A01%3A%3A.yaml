simpleMeaning: A mineral the body needs in fairly large amounts for its normal work.
scope: This is a mineral the body needs in fairly large amounts for its normal work; major mineral is
  another name for this sense, and it is not a mineral the body needs only in tiny amounts.
examples:
- Calcium is a macroelement the body needs in large amounts.
- The book lists the macroelement minerals in order of how much of each the body holds.
