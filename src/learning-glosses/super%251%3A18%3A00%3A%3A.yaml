simpleMeaning: a person who looks after an apartment building for its owner and collects the rent.
scope: This is not the adjective meaning 'very good' or 'excellent'; here it is a person with a job in
  a building.
examples:
- The super fixed the broken tap in our kitchen.
- Ask the super when the heating will come back on.
