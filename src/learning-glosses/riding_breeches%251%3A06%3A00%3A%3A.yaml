simpleMeaning: These trousers, always spoken of in the plural, widen toward the bottom and end at the
  calves, and are worn with boots for going on horseback.
scope: Also called jodhpurs and jodhpur breeches, these trousers are worn with boots for going on horseback.
examples:
- The riding breeches ended at the calves.
- The riding breeches flared out above the boots.
