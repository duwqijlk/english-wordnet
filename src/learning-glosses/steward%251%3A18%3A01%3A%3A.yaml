simpleMeaning: a member of a union (a workers' group) chosen by fellow workers to speak for them in talks
  with the bosses
scope: A worker chosen to speak for other workers in a union; not the officer on a ship who looks after
  food and meals.
examples:
- The steward spoke for the factory workers in talks with the bosses.
- Workers chose a new steward to speak for them.
