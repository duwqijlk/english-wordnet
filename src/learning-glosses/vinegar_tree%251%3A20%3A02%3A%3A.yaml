simpleMeaning: A shrubby leaf-shedding tree from east North America, bearing leaves of leaflets turning
  vivid red in the fall and heads of green-yellow flowers, then sour-tasting crimson berries.
scope: This sense is also called staghorn sumac and velvet sumac, for a shrubby tree that sheds its leaves,
  from eastern North America, with compound leaves turning vivid red in fall and thick clusters of greenish
  yellow flowers, then crimson berries that taste sour.
