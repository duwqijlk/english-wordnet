simpleMeaning: To coat pots and tiles with a shiny skin, to wear things smooth, to keep heat in, and to
  line hot ovens, people use this white stuff in crystal form.
scope: Zirconia and zirconium oxide are other names for this white stuff in crystal form, used to line
  hot ovens, to keep heat in, to wear things smooth, and to coat pots and tiles.
examples:
- The kiln lining held zirconium dioxide to stand the heat.
- Workers mixed zirconium dioxide into the glaze for the tiles.
