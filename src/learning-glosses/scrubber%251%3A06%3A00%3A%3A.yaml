simpleMeaning: A cleaner that takes filth out of a gas.
scope: This sense is a cleaner that takes filth out of a gas, unlike the sense for a brush with short
  stiff hairs for hard cleaning, and unlike the sense for a hand who uses a scrub brush to clean a face,
  usually a floor or deck.
examples:
- The scrubber is a cleaner that takes filth out of gas.
- Scrubbers clean gas.
