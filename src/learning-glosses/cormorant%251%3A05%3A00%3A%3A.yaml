simpleMeaning: a large, very hungry, dark sea bird with a long neck and a stretchy pouch for holding fish,
  used in Asia to help people catch fish
scope: This is the bird itself, not the fish it catches and not other dark sea birds without a pouch for
  holding fish.
examples:
- A cormorant dived into the sea and came up with a fish in its pouch.
- In Asia, a trained cormorant can catch fish for its owner.
