simpleMeaning: The forward speed over the backward speed stays the same for that change, in chemistry,
  once things settle in a change that can run either way
scope: It is also called the law of chemical equilibrium, the rule that fixes the balance of forward and
  backward speeds in a change.
examples:
- The equilibrium law tells us the speeds in a change that has settled.
- Under the equilibrium law, the forward speed over the backward speed stays fixed.
