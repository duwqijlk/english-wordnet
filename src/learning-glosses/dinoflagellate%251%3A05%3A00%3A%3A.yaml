simpleMeaning: A tiny creature mostly living in the sea, with two whip-like tails, one of the main kinds
  of life floating in the sea
scope: A tiny sea creature with two whip-like tails that floats as part of plankton, not a fish and not
  a sea plant.
examples:
- The dinoflagellate swam with its two whip-like tails.
- Dinoflagellates form much of the plankton in warm seas.
