senseId: 'plain_stitch%1:06:00::'
synsetId: 03630435-n
simpleMeaning: 'In knitting, the easy way to make a loop of yarn: push the needle in at the front of the
  loop from the left side.'
scope: The easy knitting loop made by pushing the needle through the front of the loop from the left side;
  plain, knit and knit stitch are other names for this sense, not a purl loop and not a garter loop.
examples:
- She worked the row in plain stitch.
- Plain stitch makes a smooth, flat fabric.
