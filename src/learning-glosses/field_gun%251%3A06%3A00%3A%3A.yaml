simpleMeaning: Big weapons that can be moved, used by an army away from home, above all to help soldiers
  at the front directly, and not weapons that shoot at planes.
scope: Big weapons that can be moved, also called field artillery, used by an army away from home, above
  all to help soldiers at the front directly; not weapons that shoot at planes and not weapons fixed in
  one place.
examples:
- The field gun was hauled into place before dawn.
- Field guns gave direct help to the soldiers at the front.
