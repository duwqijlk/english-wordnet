simpleMeaning: A drink with alcohol in it, made from the soured milk of mares, first made by the wandering
  peoples of central Asia
scope: This is a drink with alcohol in it made from soured mare's milk, also called kumis, not cow's milk
  and not a drink made from grain.
examples:
- The travellers drank koumiss offered by their hosts.
- Koumiss is still made from mare's milk in parts of central Asia.
