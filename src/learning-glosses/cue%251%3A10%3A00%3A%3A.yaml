simpleMeaning: the last words another actor says just before a person must act or speak, which help that
  person remember what to do
scope: An actor's line just before another actor must act or speak; not the act of helping someone remember
  words and not the long stick used in pool.
examples:
- When he heard his cue, he walked onto the stage.
- She waited for her cue before she began to speak.
