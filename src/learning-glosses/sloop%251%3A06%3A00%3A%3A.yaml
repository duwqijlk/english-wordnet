simpleMeaning: a boat with sails and one mast (a tall pole that holds sails), set about one third of the
  way back from the front
scope: A sailing boat with only one mast, set about one third of the way back from the front; not a sailing
  boat with two or more masts.
examples:
- They sailed around the bay in a small sloop.
- The sloop had one mast set about a third of the way back from its front.
