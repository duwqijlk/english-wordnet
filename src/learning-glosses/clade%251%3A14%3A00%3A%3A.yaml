simpleMeaning: a set of kinds of living things that share traits passed down from one shared forebear
scope: This is a set of kinds of living things joined by traits from one shared forebear; not a set grouped
  by looks alone and not one kind on its own.
examples:
- Birds and crocodiles sit in one clade that goes back to a shared forebear.
- The clade takes in all the kinds that came down from that one forebear.
