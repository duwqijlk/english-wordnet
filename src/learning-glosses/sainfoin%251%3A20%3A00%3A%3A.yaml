simpleMeaning: A Eurasian perennial herb with pinkish flowers and curved pods, naturalized in chalky grasslands
  of Britain and North America and valued in Britain as feed and a honey plant.
scope: The Eurasian fodder plant with pink flowers and curved pods, not alfalfa and not a true clover.
examples:
- Sainfoin thrives on thin chalky soil.
- The farmer cut sainfoin for winter feed.
