simpleMeaning: A theory that the state should own all the making and selling of goods, but that groups
  of workers should run them.
scope: A theory that the state should own all the making and selling of goods, but that groups of workers
  should run them, not state-run industry with state managers and not free-market capitalism.
examples:
- Guild socialism holds that the state should own industry while groups of workers run it.
- Under guild socialism, groups of workers would manage the work the state owns.
