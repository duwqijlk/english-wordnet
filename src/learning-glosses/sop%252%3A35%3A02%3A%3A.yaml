simpleMeaning: to be or become fully wet, with liquid going all through something
scope: To be or become fully wet through, not pouring liquid onto something, and not a thing given to
  calm or please someone.
examples:
- By the end of the storm, his coat was sopping wet.
- The tent floor sopped through after hours of heavy rain.
