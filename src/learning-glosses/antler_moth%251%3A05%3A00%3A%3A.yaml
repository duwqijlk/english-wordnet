simpleMeaning: Of Europe, an insect with white marks shaped like branched horns on its front wings, whose
  young harm pastures and grasslands.
scope: An insect of Europe whose white marks only look like branched horns, not a deer and not a butterfly.
examples:
- The antler moth has white marks shaped like branched horns on its front wings.
- The young of the antler moth harm pastures and grasslands.
