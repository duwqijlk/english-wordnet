simpleMeaning: A unit for how well a wire can let an electric flow go through, one over an ohm.
scope: A unit that tells how well a wire can let an electric flow go through, also called mho, reciprocal
  ohm, and siemens; not the yellow stuff, and not the letter.
examples:
- The wire has a conductance of two siemens.
- One siemens is one over one ohm.
