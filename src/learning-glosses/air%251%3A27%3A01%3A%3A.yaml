simpleMeaning: One of the four substances that the ancient Greek thinker Empedocles once believed made
  up the universe, and that early medicine linked to the bodily fluid called blood.
scope: This is not a melody, nor the everyday mixture of gases we breathe; it is a substance in an ancient
  theory of matter.
examples:
- In ancient Greek medicine, air was one of the four elements, together with earth, fire and water.
- A person with too much blood, the fluid linked to air, was said to be cheerful.
