simpleMeaning: A local infection that appears where a person is inoculated with cowpox virus to protect
  against smallpox. It normally lasts three weeks and leaves a pitted scar.
scope: This is the reaction a person gets at the inoculation site; vaccinia and variola vaccina are other
  names for it, and it is not the mild skin disease of cattle.
examples:
- A small pitted scar remained where the vaccina had been.
- Doctors of the era watched the vaccina run its course over three weeks.
