synsetId: 00054050-r
simpleMeaning: In a way that looks at what works and what can be done, and not at ideas alone
scope: A way of doing things that looks at what works, not the word for almost but not fully.
examples:
- He thought practically about the move and chose the cheapest plan that worked.
- They planned the trip practically, with a list of what they could carry and pay for.
