simpleMeaning: wave-like squeezes of the muscles of the food pipe and gut that push food along
scope: 'Also called vermiculation: wave-like squeezes of the muscles of the food pipe and gut that push
  food along, not the chewing of food and not the beating of the heart.'
examples:
- Peristalsis moved the food down her throat.
- The doctor listened for peristalsis in the patient's belly.
