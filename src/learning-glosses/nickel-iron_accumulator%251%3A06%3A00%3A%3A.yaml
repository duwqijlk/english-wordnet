simpleMeaning: a battery that stores power with a nickel oxide positive end and an iron negative end in
  a potassium hydroxide liquid; each cell gives about 1.2 volts
scope: 'Also called a nickel-iron battery: a storage battery built this way, not a lead-acid battery and
  not a small dry cell for a torch.'
examples:
- The old nickel-iron accumulator in the shed still holds a charge.
- Each nickel-iron accumulator cell gives about 1.2 volts, so several are joined to power the lamp.
