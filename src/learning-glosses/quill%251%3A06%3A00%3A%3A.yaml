simpleMeaning: A bird's feather that people use as a pen to write with
scope: A pen made from a bird's feather, not the hollow middle part of a feather, not a stiff spine on
  an animal, and not a large wing feather itself.
examples:
- He wrote the letter with a quill.
- She dipped her quill in ink and began to write.
