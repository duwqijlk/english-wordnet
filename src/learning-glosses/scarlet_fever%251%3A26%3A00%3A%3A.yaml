synsetId: 14147552-n
simpleMeaning: a sudden, sharp illness that can pass from one person to another, usually in children,
  marked by a high temperature and a red rash
scope: This is a sharp illness that can pass from one person to another, marked by a high temperature
  and a red rash; scarlatina is another name for this sense, not a common cold and not a simple skin rash.
examples:
- The doctor said the child's scarlet fever had brought a high temperature and a red rash.
- She stayed home with scarlet fever until the rash had gone.
