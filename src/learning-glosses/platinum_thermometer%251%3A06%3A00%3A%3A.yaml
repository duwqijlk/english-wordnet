simpleMeaning: A device that measures heat by changes in how hard it is for power to flow through a coiled
  wire of a pale grey-white metal
scope: A device that measures heat by changes in how hard power flows through a coiled wire; resistance
  thermometer is another name for this sense, and this is not a mercury device.
examples:
- The platinum thermometer showed the heat by the change in the wire.
- He read the platinum thermometer to check the temperature.
