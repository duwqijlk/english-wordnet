senseId: 'fertilisation%1:11:00::'
synsetId: 07451586-n
simpleMeaning: New life begins when male and female sex cells join, as sperm and egg in an animal or pollen
  and egg cell in a plant
scope: New life begins when male and female sex cells join; fertilization, fecundation and impregnation
  are other names for this sense, not the growth of the young after it begins.
examples:
- Fertilisation happens when the egg meets the sperm.
- In the flower, fertilisation follows pollination.
