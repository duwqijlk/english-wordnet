simpleMeaning: a long cloth wound round the head as a traditional head covering worn by Muslims
scope: A long cloth wound round the head, not a hat or a cap and not a scarf worn round the neck.
examples:
- He wore a white turban to the mosque.
- The turban was wound round his head in neat folds.
