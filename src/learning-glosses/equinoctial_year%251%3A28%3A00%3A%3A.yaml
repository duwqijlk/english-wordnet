simpleMeaning: the time it takes the earth to go once round the sun, counted from one spring equinox to
  the next
scope: 'Also called astronomical year: the time the earth takes to go once round the sun, from one spring
  equinox to the next, not a calendar year and not the time of one season.'
examples:
- An equinoctial year ends at the next spring equinox.
- The equinoctial year is slightly longer than the calendar year.
