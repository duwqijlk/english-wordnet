simpleMeaning: a tree of medium size that grows in the east of North America, of the kind called hop hornbeam
scope: 'Also called ironwood tree: a medium-sized tree in the east of North America, not the small tree
  from northern Iran and not the very hard wood from such trees.'
examples:
- We saw an ironwood growing in the woods of eastern North America.
- The ironwood is a medium-sized tree, not very tall and not small.
