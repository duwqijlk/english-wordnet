simpleMeaning: A tree of warm America that keeps its leaves all year, with soft fruit holding a soapy
  stuff once used as soap by the first peoples of America
scope: Also called chinaberry and false dogwood, this is a tree of warm America whose soft fruit was once
  used as soap.
examples:
- The jaboncillo grows in warm parts of America.
- Native peoples used jaboncillo fruit as soap.
