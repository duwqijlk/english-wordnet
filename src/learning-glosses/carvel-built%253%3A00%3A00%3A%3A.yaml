simpleMeaning: In ships, made with flat side boards that meet edge to edge, not boards that lie over each
  other.
scope: A ship made with flat side boards that meet edge to edge; not a ship made with boards that lie
  over each other, and not a ship made of steel.
examples:
- The carvel-built boat had a smooth hull.
- A carvel-built ship is made with planks that meet edge to edge.
