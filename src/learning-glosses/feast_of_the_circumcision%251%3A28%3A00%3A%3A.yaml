simpleMeaning: A day kept by Roman Catholic and Anglican churches, marking a rite performed on Jesus in
  which a baby boy's foreskin is cut away; kept on January 1st.
scope: A feast day of the Roman Catholic and Anglican churches celebrating the circumcision of Jesus,
  also called Circumcision and January 1; it is kept on January 1st.
examples:
- The Feast of the Circumcision falls on January 1st.
- Churches mark the Feast of the Circumcision with a service on New Year's Day.
