simpleMeaning: A glass tube with no air inside, in which a hot part sends out electrons through a high-voltage
  part, aimed or bent before striking a screen that glows.
scope: A glass tube that aims electrons at a glowing screen, also called a cathode-ray tube.
examples:
- The old television used a CRT to make its picture.
- A CRT glows when electrons strike its screen.
