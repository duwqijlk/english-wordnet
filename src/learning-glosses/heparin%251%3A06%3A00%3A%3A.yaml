simpleMeaning: A complex sugar made in white blood cells, especially the lungs and liver, that blocks
  a clotting protein; it is used as a blood-thinning drug in thrombosis and heart surgery.
scope: This is the natural blood-thinning substance given as a drug to treat thrombosis and during heart
  surgery; it is not warfarin, and not a medicine that dissolves a clot that has already formed.
examples:
- The nurse gave him heparin to stop the blood clot from growing.
- Heparin is used during heart surgery to keep the blood from clotting.
