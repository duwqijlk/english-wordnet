senseId: 'syphon%1:06:00::'
synsetId: 04231230-n
simpleMeaning: A tube that runs from liquid in a container down to a lower place outside it, so that its
  own weight pushes the liquid through.
scope: Also called a siphon, this is a tube that moves liquid by its own weight, not a tube-like part
  of a water animal, especially a mollusk, that takes water in or lets it out, nor the verb for drawing
  liquid off, moving it along, or emptying it by means of one.
examples:
- He used a syphon to move the petrol from one tank to another.
- The syphon drew the water out of the barrel.
