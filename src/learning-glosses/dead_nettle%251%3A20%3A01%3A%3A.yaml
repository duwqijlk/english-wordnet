simpleMeaning: Any of a range of plants of the Lamium kind with bunches of small flowers, often purple,
  that have two lips.
scope: This is a Lamium plant with bunches of small two-lipped flowers, not the coarse bristly plant with
  white flowers or the foul-smelling plant with a green creeping stem.
examples:
- Dead nettle grows along the hedge with small purple flowers.
- The dead nettle in the garden has two-lipped flowers.
