senseId: 'descriptive_clause%1:10:00::'
synsetId: 06326447-n
simpleMeaning: A part of a sentence that adds to a noun group but does not cut down what that group means
scope: A part of a sentence that adds to a noun group without cutting down its meaning; also called nonrestrictive
  clause, not a clause that picks out one thing from many.
examples:
- The descriptive clause, which was long, added detail to the noun.
- In the sentence 'My brother, who lives in York, called', the descriptive clause is 'who lives in York'.
