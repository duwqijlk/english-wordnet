simpleMeaning: A drug that lifts low mood by blocking a body chemical that breaks down the chemicals that
  carry mood
scope: A drug that lifts low mood by blocking a body chemical, not a drug that lifts mood in another way
  and not a drug for worry.
examples:
- The doctor gave him iproclozide for his low mood.
- Iproclozide can take weeks to lift a person's mood.
