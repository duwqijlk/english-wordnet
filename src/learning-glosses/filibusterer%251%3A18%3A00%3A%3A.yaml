simpleMeaning: A law-maker who talks at great length to hold up or block a law that they are against
scope: A law-maker who talks at great length to hold up or block a law that they are against, also called
  a filibuster; not a law-maker who speaks briefly and not one who backs the law.
examples:
- The filibusterer talked through the night.
- A filibusterer held up the bill for hours.
