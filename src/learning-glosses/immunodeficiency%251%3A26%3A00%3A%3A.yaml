simpleMeaning: A state in which the defence of the body against germs falls short, so infections take
  hold more easily.
scope: A state where the defence against germs falls short.
examples:
- His immunodeficiency meant even a small cold could make him very ill.
- Doctors found an immunodeficiency behind her repeated infections.
