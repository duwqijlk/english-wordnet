simpleMeaning: Its hard wood smells sweet and is loved for fine furniture, and its deep-coloured inner
  wood dyes cloth; it comes from a tree of India and the East Indies
scope: 'Also called red sanders, red sanderswood, and red saunders: a tree of India and the East Indies
  whose hard wood is loved for fine furniture and whose inner wood dyes cloth, not the wood of the tree
  itself.'
examples:
- The cabinet was made of red sandalwood, and the room smelled sweet.
- Dyers prized red sandalwood for the deep colour of its inner wood.
