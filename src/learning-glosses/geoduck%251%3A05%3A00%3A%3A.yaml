simpleMeaning: A large edible clam of North America's Pacific coast, burrowing deep in sandy mud, weighing
  up to six pounds, and unable to pull its long tube-like siphons into its shell.
scope: The giant edible clam of Pacific mudflats, known for a long siphon it cannot retract, not smaller
  clams such as littlenecks.
examples:
- At low tide, diggers search the mudflats for geoducks.
- The restaurant served geoduck sliced thin as sashimi.
