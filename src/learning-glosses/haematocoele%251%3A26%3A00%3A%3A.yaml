senseId: 'haematocoele%1:26:00::'
synsetId: 14340648-n
simpleMeaning: A swelling in a hollow of the body, most often in the thin cover round the testicle, comes
  from blood that has gathered there.
scope: Also called a haematocele, a hematocele and a hematocoele, this swelling in a hollow of the body
  comes from blood gathered there.
examples:
- The haematocoele formed a lump in the thin cover round the testicle.
- The haematocoele was a lump that could be felt.
