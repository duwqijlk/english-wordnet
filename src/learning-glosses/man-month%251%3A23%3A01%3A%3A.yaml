senseId: 'man-month%1:23:01::'
synsetId: 92411486-n
simpleMeaning: One person's work for about four weeks, or the same amount of work done in a different
  way, used to measure how much work a job takes
scope: A measure of work in person-time, not a measure of clock time and not a count of workers.
examples:
- The job took six man-months to finish.
- Three man-months of work went into the report.
