simpleMeaning: Old tales tell of a big meat-eating lizard of the hot lands of Africa, Asia, and Australia,
  one of several kinds, that warns of a crocodile near.
scope: Also called a monitor and a monitor lizard, this big meat-eating lizard of the hot lands of Africa,
  Asia, and Australia is one of several kinds, said in old tales to warn of crocodiles.
examples:
- The varan is a large lizard of the hot lands of Africa.
- Old tales say the varan warns of a crocodile near.
