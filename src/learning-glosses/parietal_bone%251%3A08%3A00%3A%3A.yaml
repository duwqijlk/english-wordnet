simpleMeaning: One of two skull bones makes the top and sides of the bony case that holds the brain, between
  the bones at the front and back of the head.
scope: This bone sits between the bone at the front of the head and the bone at the back of it, and with
  its fellow it makes the top and sides of the skull.
examples:
- The parietal bone sits between the front and back bones of the head.
- Two parietal bones sit on either side of the head, between the front and back bones.
