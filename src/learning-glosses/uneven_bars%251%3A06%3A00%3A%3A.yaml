simpleMeaning: two long poles that run side by side at different heights, used by women in gymnastics
scope: This is a pair of long poles at different heights for women's gymnastics, also called uneven parallel
  bars, and not the parallel bars used by men or a single high bar.
examples:
- She swung between the uneven bars in her routine.
- The uneven bars in the gym are set at two different heights.
