simpleMeaning: a way of letting things be, because the person is not part of what is happening and does
  not take part
scope: 'Another name for disinterest: letting things be because a person is not involved, not choosing
  a side in a war or a fight.'
examples:
- His neutrality came from not being involved in the plan at all.
- She kept her neutrality and let both groups do as they wished.
