simpleMeaning: The member of a government who looks after the money of the state
scope: The government member in charge of the money of the state; finance minister is another name for
  this sense, and not a minister in charge of another part of government.
examples:
- The minister of finance announced a new budget today.
- She met the minister of finance to discuss taxes.
