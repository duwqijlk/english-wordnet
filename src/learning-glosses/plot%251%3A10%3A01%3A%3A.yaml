simpleMeaning: a drawing with lines or marks that shows how something moves or changes over time
scope: A drawing that shows movement or change, not the act of making such a drawing and not the act of
  planning the events in a story or play.
examples:
- The plot shows the ship moving across the sea day by day.
- On the plot, you can see the plane going up and then coming down.
