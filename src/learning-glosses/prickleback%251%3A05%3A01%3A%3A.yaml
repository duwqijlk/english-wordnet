simpleMeaning: Small, two-to-four-inch, feisty, mostly scaleless, spiny-backed fishes of northern fresh
  and shore waters with involved courtship, much studied.
scope: Also called stickleback, this sense is small, feisty, mostly scaleless, spiny-backed fishes of
  northern fresh and shore waters with involved courtship, much studied, unlike the sense for small, long
  fishes of shallow northern seas whose long back fin is all spines.
examples:
- Pricklebacks court in northern fresh waters.
- Prickleback fishes are much studied.
