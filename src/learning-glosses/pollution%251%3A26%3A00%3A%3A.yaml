simpleMeaning: the bad state of the land, air, or water when harmful stuff from what people do has got
  into it
scope: The bad state of the land, air, or water when harmful stuff from what people do has got into it,
  not the act of making it dirty and not just the state of being dirty.
examples:
- Pollution in the city made the air hard to breathe.
- The pollution of the lake killed the fish.
