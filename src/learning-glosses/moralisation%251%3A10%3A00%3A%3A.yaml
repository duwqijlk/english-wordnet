simpleMeaning: Giving in to the habit of making moral pronouncements, and setting out a set of moral rules,
  often only on the surface
scope: 'Moralizing and moralization are other names for this sense: giving in to moral pronouncements
  and setting out a moral code, not a serious study of right and wrong.'
examples:
- His constant moralisation drove his friends away.
- The moralisation in her speech bored the crowd.
