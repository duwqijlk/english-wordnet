simpleMeaning: A thin fern of northern North America with shiny chestnut-brown stalks and fronds split
  twice, with spore clusters along the edges that are usually separate.
scope: 'Also called the flower-cup fern, northern woodsia, and Woodsia alpina: a thin northern fern with
  twice-split fronds, not a tall woodland fern and not a southern kind.'
examples:
- The Alpine woodsia grew in a crack of the cold northern rock.
- We found Alpine woodsia with shiny brown stalks beside the trail.
