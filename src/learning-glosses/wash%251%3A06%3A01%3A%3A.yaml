simpleMeaning: a watercolour picture built from several single-colour transparent layers laid one over
  another
scope: This is a finished watercolour made of layered single-colour coats, not one thin coat of paint
  by itself, not the verb of applying such a coat, and not a load of clothes for cleaning.
examples:
- The finished picture is a wash of soft greys, each layer laid over the last.
- The gallery hung a large blue wash beside the artist's line drawings.
