simpleMeaning: a person one lives with and shares a long-term close physical relationship with, who may
  not be one's husband or wife
scope: A person one lives with in a long-term close physical relationship, who may not be one's husband
  or wife, and not a spouse or a flatmate.
examples:
- She moved in with her domestic partner last year.
- They have been domestic partners for ten years.
