simpleMeaning: the way printing plates or rollers are made by using light to form the picture on them
scope: The way printing plates or rollers are made by using light to form the picture on them; photoplate
  making is another name for this sense, not the way photographs themselves are turned into plates.
examples:
- Photomechanics made printing plates by using light to form the picture.
- The shop used photomechanics to make new printing rollers by shining light on the surface.
