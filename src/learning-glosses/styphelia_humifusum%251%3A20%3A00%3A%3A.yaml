scope: A small low shrub with scarlet flowers and juicy fruit like cranberries, also called cranberry
  heath, ground-berry, groundberry, native cranberry and Astroloma humifusum.
examples:
- Styphelia humifusum spreads low over the ground with scarlet flowers.
- The fruit of Styphelia humifusum looks like small cranberries.
