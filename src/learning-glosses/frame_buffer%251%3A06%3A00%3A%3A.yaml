simpleMeaning: In computer science, a store that holds what is in a picture, point by point.
scope: In computer science, a store holding a picture point by point; not a store holding words and not
  the picture itself.
examples:
- The frame buffer held the new image while the screen drew it.
- Data moved into the frame buffer one point at a time.
