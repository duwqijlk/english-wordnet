simpleMeaning: Turning a longer piece of writing into a short form that keeps its main points and says
  them briefly and to the point.
scope: Summarization is another name for this act of turning a longer piece of writing into a short form
  that keeps its main points.
examples:
- The summarisation of the long report kept only the main points.
- Good summarisation says a lot in very few words.
