simpleMeaning: A play from the Middle Ages, based on stories from the Bible and acted in churches on holy
  days, usually in Latin and often sung in a steady chant.
scope: This is a play of the Middle Ages acted in church on holy days, not a modern play about the Bible
  and not a mystery play acted outside in the street.
examples:
- The liturgical drama was performed in the church on Easter morning.
- Students studied a liturgical drama from the Middle Ages.
