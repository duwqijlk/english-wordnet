simpleMeaning: a cleaner that strips grease away, harsh on the skin; often found in wash things like shampoos
  and toothpaste, though it can make skin sore and must not be swallowed
scope: 'Also called sodium lauryl sulphate: a harsh cleaning stuff, not a gentle soap and not a food safe
  to swallow.'
examples:
- Sodium lauryl sulfate helps the shampoo take grease out of hair.
- The label warns that sodium lauryl sulfate should not be swallowed.
