simpleMeaning: The bottom part at the back of a shoe or boot. This part touches the ground and lifts the
  back of the foot.
scope: This is the bottom part at the back of a shoe or boot, not the part of a golf club near its head
  and not an end piece of a loaf of bread.
examples:
- The heel of her shoe broke when she stepped on a stone.
- His boots have a thick heel at the back.
