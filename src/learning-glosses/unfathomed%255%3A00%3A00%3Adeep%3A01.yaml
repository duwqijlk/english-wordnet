simpleMeaning: so deep that no one has been able to reach or measure the bottom
scope: 'Also called profound, unplumbed and unsounded: too deep to measure, not shallow water and not
  a depth that has been sounded.'
examples:
- The cave dropped into unfathomed dark water.
- They stared down into the unfathomed depths of the sea.
