simpleMeaning: In the armed forces, the beating of a drum to signal that the flag is lowered at sunset
scope: A drum signal in the armed forces at sunset; not the loud support of a cause.
examples:
- The drumbeat sounded as the flag came down.
- At sunset the drumbeat marked the end of the day.
