simpleMeaning: A milky or grey stone, clear enough to see light through, made of quartz, a hard glassy
  stone.
scope: A milky or grey stone, clear enough to see light through, also called chalcedony; not an opaque
  stone and not glass.
examples:
- The ring held a piece of calcedony.
- Calcedony lets light pass through it.
