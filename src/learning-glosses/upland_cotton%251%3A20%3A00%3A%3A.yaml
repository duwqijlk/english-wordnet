simpleMeaning: A plant that grows wild in warm parts of America, now grown in the United States, that
  gives short fibres.
scope: A plant from warm parts of America that gives short fibres, not a tall tree and not a plant grown
  for its fruit.
examples:
- Upland cotton grows in fields across the southern United States.
- The upland cotton plant gives short fibres.
