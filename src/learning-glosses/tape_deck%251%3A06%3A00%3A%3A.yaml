simpleMeaning: Without its own amplifiers or speakers, this piece of electronic gear makes or plays magnetic
  strips as part of a sound system.
scope: This is the sound-system part that makes or plays magnetic strips, not a full set with its own
  amplifiers or speakers.
examples:
- He put a tape deck beside the record player.
- The tape deck played the old recording.
