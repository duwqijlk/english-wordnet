simpleMeaning: having bright points or flashes of light that shine for a short time each
scope: 'Also called glittering, glinting, sparkly, scintillating, aglitter, and glistering: having short
  flashes of bright light, not just plain bright all the time.'
examples:
- She wore a glittery dress whose sequins flashed in the light as she moved.
- The glittery stones on the bag gave off short flashes of light in the sun.
