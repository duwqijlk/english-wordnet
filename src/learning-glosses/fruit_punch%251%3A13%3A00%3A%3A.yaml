simpleMeaning: a drink made from juices mixed with water or soda water, with or without alcohol
scope: This is a drink of juices mixed with water or soda water, with or without alcohol; not a soft drink
  made from one juice or a cup of tea.
examples:
- She poured a glass of fruit punch at the party.
- The fruit punch was sweet and cold.
