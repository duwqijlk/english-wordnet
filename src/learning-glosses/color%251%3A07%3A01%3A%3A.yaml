simpleMeaning: How an object or light source looks to the eye, judged by its hue, how light or dark it
  is, and how pure or strong that hue seems.
scope: A thing's visible appearance as judged by hue, lightness and saturation only; not the physical
  light attribute behind it, not vividness or interest, not a musical sound's quality, not a deliberately
  misleading outward show or form, not a pigment or dye, not the physics property that quarks carry, not
  the adjective meaning able to produce hues, and not any verb use (adding hue, tinting, decorating, affecting
  feeling, biasing, excusing deceptively, or turning a different shade).
examples:
- The walls were painted a deep blue, a color that made the small room feel cold.
- Sunlight through the leaves gave the path a shifting green color.
