simpleMeaning: A medium-sized shrubby tree of South Africa with thick leathery leaves that stay green
  all year, white or pink flowers, and round purplish-black fruits, usually with two seeds.
scope: Not a baobab or an acacia, other trees of South Africa; also called a poison arrow plant, winter
  sweet, and Acocanthera spectabilis.
examples:
- Acocanthera oblongifolia grew beside the road in Natal.
- The Acocanthera oblongifolia had white flowers in spring.
