simpleMeaning: An old-time way of settling guilt or lack of it, by putting the charged through hard or
  sore tests thought god-held, where escape usually meant lack of guilt.
scope: This sense is also called ordeal, an old way of judging guilt, by putting a person through hard
  or sore tests that people thought a god held, where getting out alive usually meant lack of guilt.
examples:
- A trial by ordeal settled guilt.
- Trials by ordeal put the charged through tests.
