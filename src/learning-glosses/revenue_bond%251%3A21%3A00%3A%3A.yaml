senseId: 'revenue_bond%1:21:00::'
synsetId: 13360557-n
simpleMeaning: money borrowed by a public body set up to pay for public works, paid back from the money
  the public works bring in
scope: A loan taken out by a public body to pay for public works, paid back from what the works earn,
  not a general loan by a town and not money given as a gift.
examples:
- The city sold revenue bonds to pay for the new water plant.
- The revenue bond will be paid off from the tolls collected on the bridge.
