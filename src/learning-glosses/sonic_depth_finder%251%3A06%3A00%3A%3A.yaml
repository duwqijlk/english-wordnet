simpleMeaning: How deep water is, or how deep a thing under the water is, is worked out by this tool with
  sound too high for people to hear.
scope: People also call it a fathometer, and it is a tool that works out how deep water is by sound.
examples:
- The sonic depth finder found the bottom of the lake.
- They used the sonic depth finder to find a thing under the water.
