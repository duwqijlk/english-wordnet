simpleMeaning: a smell left behind by a person or animal as they pass, by which they can be followed
scope: This is the smell left behind that lets someone follow a person or animal, not a pleasant smell
  in itself and not the act of smelling something.
examples:
- The dog followed the fox's scent through the woods.
- His scent was still on the coat he had left behind.
