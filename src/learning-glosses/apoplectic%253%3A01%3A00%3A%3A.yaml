simpleMeaning: To do with or typical of apoplexy (a sudden illness caused by bleeding inside the brain)
scope: To do with a sudden illness caused by bleeding inside the brain; not the everyday use for being
  very angry, and not a sudden illness in another part of the body.
examples:
- She was taken to hospital after an apoplectic seizure.
- The apoplectic attack left him unable to speak clearly.
