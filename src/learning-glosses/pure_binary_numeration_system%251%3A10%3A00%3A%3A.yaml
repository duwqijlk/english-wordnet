schema: oewn-learning-gloss-v2
senseId: 'pure_binary_numeration_system%1:10:00::'
synsetId: 06822878-n
simpleMeaning: A way of writing numbers in which each place stands for twice the one before it, using
  only the marks 0 and 1
scope: A way of writing numbers with only 0 and 1, where each place is worth twice the one before it,
  not a way of writing numbers with ten marks; binary number system, binary numeration system and binary
  system are other names for this sense.
examples:
- The pure binary numeration system uses only 0 and 1.
- In a pure binary numeration system, 10 means two.
