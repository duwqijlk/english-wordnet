simpleMeaning: A form of insulin made from changed DNA that matches human insulin, used to treat people
  with diabetes who are allergic to insulin made from beef or pork.
scope: Also called recombinant human insulin; man-made insulin matching the human kind, not insulin from
  animals.
examples:
- Humulin controls her blood sugar.
- The doctor switched him to Humulin.
