simpleMeaning: a sore, swollen state of the thin inner skin of a blood vessel that carries blood away
  from the heart
scope: A sore, swollen state of the inner skin of a blood vessel, not a sore, swollen state of the outer
  skin and not a blockage of the blood vessel.
examples:
- Endarteritis made the inner lining of the artery swell and ache.
- The doctor found endarteritis in the artery of his leg.
