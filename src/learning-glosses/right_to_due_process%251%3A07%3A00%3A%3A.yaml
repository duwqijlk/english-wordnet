senseId: 'right_to_due_process%1:07:00::'
synsetId: 05191888-n
simpleMeaning: a claim a person holds, promised by the Fifth Change in the US set of basic laws, stated
  again by the Fourteenth Change
scope: Not a claim about free speech, and not a claim about a fair trial alone; a claim about lawful steps
  before the state acts.
examples:
- His right to due process was upheld by the court.
- The right to due process guards people from unfair arrest.
