simpleMeaning: A rabbi of AD 250-500 who explained and applied Mishnaic law in Palestinian and Mesopotamian
  academies; the Talmud records their debates, stressing Torah study, personal conduct and keeping the
  commandments.
scope: This is the Talmudic-era rabbi who debated and applied the Mishnah, not the earlier Tannaim who
  compiled it and not a later commentator.
examples:
- Each amora in the Talmud weighs the older teaching against a new case.
- Students memorized sayings attributed to this amora and his colleagues.
