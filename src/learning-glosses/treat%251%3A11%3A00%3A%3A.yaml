simpleMeaning: an event or experience that gives someone particular pleasure.
scope: This is a pleasurable event or experience, not the verb meaning to apply a process to something
  or to give medical care.
examples:
- The weekend away was a real treat.
- A cup of tea in the garden is a small treat.
