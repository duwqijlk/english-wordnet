simpleMeaning: A low gap in a line of high land, where one can cross from one side to the other.
scope: Also called pass, and notch is another name for this sense; a low gap in a line of high land, not
  a valley floor and not a peak.
examples:
- We got through the mountain pass before it started to snow.
- The mountain pass was the only way across the range.
