simpleMeaning: Yellow blooms along a stalk and swollen seed cases mark any of several plants of the group
  Physaria.
scope: This is one of several plants of the group Physaria, with yellow blooms along a stalk and swollen
  seed cases; it is not the hairy kind of North America or the wild lobelia kind with small blue blooms.
examples:
- We picked out the bladderpod by its yellow blooms and swollen seed cases.
- Its swollen seed cases told us this was a bladderpod.
