senseId: 'return_on_investment%1:28:00::'
synsetId: 15306547-n
simpleMeaning: The percentage gained on the whole capital of a firm, found by taking earnings counted
  ahead of interest, tax, and dividend payments and dividing them by that capital.
scope: In corporate finance, this sense is also called return on invested capital, for the percentage
  gained on the whole capital of a firm.
examples:
- Return on investment rose this year.
- The return on investment beat last year's mark.
