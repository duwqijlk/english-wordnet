simpleMeaning: of or to do with the nerve centres below the outer layer of the brain
scope: Of or to do with nerve centres below the outer layer of the brain; not of the outer layer itself
  and not of the nerves in the body.
examples:
- Subcortical centres sit below the outer layer of the brain.
- The subcortical areas pass signals up to the outer layer.
