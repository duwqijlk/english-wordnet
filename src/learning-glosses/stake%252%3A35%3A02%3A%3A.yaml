simpleMeaning: To kill a person or animal by pushing a spear or a long, sharp pole right through their
  body
scope: To kill by pushing a sharp pole through a body, not to tie a person to a post for burning, and
  not to mark a place with a post.
examples:
- The hunter staked the beast through the heart.
- In the old tale, the vampire was staked through the heart.
