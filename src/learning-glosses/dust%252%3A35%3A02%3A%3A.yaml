simpleMeaning: to make the outlines of a shape less clear by rubbing powder over the surface
scope: This is rubbing powder over a drawing to blur its lines, not wiping powder off a surface, scattering
  it, or the powdery material itself.
examples:
- The artist dusted the charcoal drawing to soften its lines.
- She dusted the sketch with chalk so the outlines faded.
