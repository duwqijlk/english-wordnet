simpleMeaning: 'It makes the leg muscles stronger: exercise in which you fold your legs and drop down
  low again and again.'
scope: This exercise of dropping down low again and again is also called a squat or squatting, and it
  makes the leg muscles stronger.
examples:
- She did knee bends, dropping low each time.
- Knee bends made his leg muscles stronger.
