simpleMeaning: In the ground this white stuff in crystal form turns up as the mineral gibbsite.
scope: The names aluminum hydroxide, hydrated aluminium oxide, and hydrated aluminum oxide mean the same
  white crystal stuff.
examples:
- Workers dug the white stuff from the ground and found it was aluminium hydroxide.
- The white crystals in the sample were aluminium hydroxide, the mineral gibbsite.
