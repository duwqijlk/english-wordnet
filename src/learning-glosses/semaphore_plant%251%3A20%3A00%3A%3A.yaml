simpleMeaning: an upright shrub of warm Asia whose small side leaflets turn on their stalks and jerk up
  and down in the sun
scope: Also called a telegraph plant; an upright tropical shrub whose leaflets jerk in the sun, not a
  plant that signals with flags.
examples:
- The semaphore plant's leaflets jerked up and down in the sun.
- A semaphore plant grows upright in warm Asia.
