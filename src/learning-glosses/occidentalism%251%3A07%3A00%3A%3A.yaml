simpleMeaning: The peoples of the West have their own ways, habits and manners, and this is what is typical
  of them
scope: This is about the ways of the West itself, not the study of the East and not the spread of Western
  ways to other places.
examples:
- Her book studies the occidentalism of early American art.
- The film shows the occidentalism of life in a small western town.
