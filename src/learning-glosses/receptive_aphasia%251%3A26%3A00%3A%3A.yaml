senseId: 'receptive_aphasia%1:26:00::'
synsetId: 14122654-n
simpleMeaning: The person talks smoothly, but the words mean nothing, and words heard or read are very
  hard to follow.
scope: Also called fluent aphasia, impressive aphasia, or sensory aphasia, it is the kind in which words
  heard or read are very hard to follow, though the person still talks smoothly.
examples:
- With receptive aphasia, the talk flows smoothly but what others say is hard to follow.
- The words on the page were hard to follow for someone with receptive aphasia.
