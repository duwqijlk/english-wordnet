simpleMeaning: To speak in a way that stays unclear on purpose, so as to mislead or hold back facts
scope: To speak unclearly on purpose, so as to mislead or hold back facts, also called equivocate, prevaricate
  and palter, not to lie outright and not to speak plainly.
examples:
- Stop beating around the bush and tell me what happened.
- He beat around the bush for an hour rather than give a straight answer.
