simpleMeaning: A group of one or more judges who meet to deal with the law business before them
scope: A group of one or more judges who meet to deal with court business, also called court or tribunal;
  not the whole system of law courts.
examples:
- The judicature met to hear the case.
- A judicature of three judges sat on the appeal.
