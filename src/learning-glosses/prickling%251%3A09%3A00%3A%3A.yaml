simpleMeaning: a feeling in the body, as if many tiny stings were touching the skin
scope: 'Another name for a tingle or tingling: a feeling in the body like many tiny stings, not a real
  sting and not pain from a cut.'
examples:
- A prickling spread across her arms in the cold.
- He felt a prickling in his feet after sitting too long.
