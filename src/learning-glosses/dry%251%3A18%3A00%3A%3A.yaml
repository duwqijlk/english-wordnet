simpleMeaning: a person who campaigns to stop the drinking of alcohol.
scope: This is not the adjective for something without moisture, and not a person who merely avoids alcohol;
  it names a campaigner against alcoholic drink.
examples:
- In the 1920s, drys campaigned hard for a ban on alcohol.
- The drys argued that drink was destroying family life.
