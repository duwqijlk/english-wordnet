simpleMeaning: The wet drops the glands make fill the wide ends of the tubes at the nose side of the eyes,
  two in all.
scope: One of the two wide ends of the tubes that bring the wet drops to the nose side of the eyes; dacryocyst
  and lacrimal sac are other names for it, not the gland that makes the drops.
examples:
- The tear sac filled with drops from the eye.
- The doctor pressed the tear sac at the nose side of the eye.
