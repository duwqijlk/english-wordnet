schema: oewn-learning-gloss-v2
senseId: 'quorum%1:14:00::'
synsetId: 08374919-n
simpleMeaning: a meeting that has the smallest number of members of a group needed for the group to do
  its work
scope: This sense is about having enough members present for a group to act; it is not any meeting, and
  not all the members of the group.
examples:
- The meeting could not start because there was no quorum.
- With ten members present, the club finally had a quorum to vote.
