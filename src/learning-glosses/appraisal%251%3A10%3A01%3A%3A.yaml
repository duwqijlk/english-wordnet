simpleMeaning: a paper that says how much something is worth, such as for insurance or for tax
scope: 'Also called estimate and estimation: a paper that says how much something is worth, not the act
  of judging worth, quality, or other features.'
examples:
- She kept the written appraisal with her insurance papers.
- The appraisal said the ring was worth two thousand dollars.
