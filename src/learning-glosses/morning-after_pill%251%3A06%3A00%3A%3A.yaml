synsetId: 03791376-n
simpleMeaning: 'Emergency contraception: a strong dose of a female hormone, swallowed one to three days
  after sex, stops a fertilised egg settling in the womb; often used after rape or incest.'
scope: Emergency contraception taken after sex, not a daily birth-control pill and not the abortion pill.
examples:
- The clinic offered her a morning-after pill after the attack.
- He picked up a morning-after pill from the pharmacy.
