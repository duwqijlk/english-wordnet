simpleMeaning: A plate of metal fixed or hinged to a medieval helmet, with slits to see through, that
  guards the face
scope: A metal plate on a medieval helmet that guards the face, not a sunshade on a car and not a hat
  brim.
examples:
- The knight lowered his visor before the fight.
- Through the visor's narrow slits, he could see the road ahead.
