simpleMeaning: Blood that gathers in the space between the lungs and the wall of the chest.
scope: This is blood gathered in the chest space around the lungs, not blood inside the lung itself; also
  called hemothorax.
examples:
- The accident caused a haemothorax that had to be drained.
- A haemothorax can make breathing hard.
