simpleMeaning: A thin double covering that wraps round the small ball of blood vessels in a kidney unit.
scope: Also called a capsula glomeruli or a glomerular capsule; a thin double covering round a knot of
  blood vessels in the kidney, not the knot itself.
examples:
- Bowman's capsule wraps round the small ball of blood vessels in the kidney.
- The doctor pointed to Bowman's capsule around the tiny knot of blood vessels.
