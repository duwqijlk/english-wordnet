simpleMeaning: With no tool to help, you can still see it with your eyes alone, most of all in rocks and
  parts of the body
scope: Also called gross, this is a thing you can see with your eyes alone, with no tool to help, not
  a thing you need a microscope to see.
examples:
- The megascopic crystals in the rock were easy to see without a lens.
- Megascopic cracks showed on the surface of the bone.
