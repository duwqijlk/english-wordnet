simpleMeaning: A loose stitch put in for a short time to hold pieces of cloth together.
scope: Also called a baste, tacking, or a basting stitch, a loose stitch to hold cloth for a time; not
  the moistening of a roast as it cooks.
examples:
- She took out the basting once the seam was sewn for good.
- A line of basting held the two layers of cloth in place.
