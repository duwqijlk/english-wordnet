simpleMeaning: With leaves of many small leaflets, green flowers in loose clusters, and red berries after
  them, this common harmless bush grows in the east of North America.
scope: Also called black sumac, mountain sumac, and shining sumac, this eastern North American bush is
  harmless, with green flowers and red berries.
examples:
- Dwarf sumac grows along the roadside in the east.
- The red berries of the dwarf sumac follow its green flowers.
