simpleMeaning: a small part like a needle, used most of all as the feeding part of a tardigrade, a tiny
  water animal
scope: A small needle-like part, most of all the feeding part of a tardigrade, not a stinger and not a
  beak.
examples:
- The tardigrade pushed out its stylet to feed.
- Under the microscope, the stylet looked like a tiny needle.
