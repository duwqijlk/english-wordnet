simpleMeaning: to break open suddenly with a short, loud bang
scope: This is something bursting apart on its own with a bang; it is not making a burst happen to something
  else, and it is not merely producing a noise.
examples:
- The balloon popped with a loud bang when it touched the barbed wire.
- The popcorn started to pop as soon as the oil got hot.
