simpleMeaning: a loose dress, a piece of nightwear, for women to wear in bed
scope: A loose dress, a piece of nightwear, for women to wear in bed; gown and nightgown are other names
  for this sense, and it is not a day dress or a bathrobe.
examples:
- She put on her nightdress before bed.
- Her nightdress hung behind the door.
