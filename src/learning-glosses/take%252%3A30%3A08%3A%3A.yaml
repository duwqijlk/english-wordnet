simpleMeaning: To find out a value by measuring it, calculating it, or reading it from a dial or gauge.
scope: This is not about removing or carrying something away, not about eating or drinking, and not about
  falling ill; it means finding out a value by measuring, calculating, or reading an instrument.
examples:
- The nurse took my temperature.
- The engineer took a reading from the dial.
