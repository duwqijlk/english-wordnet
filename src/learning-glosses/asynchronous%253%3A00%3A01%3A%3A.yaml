simpleMeaning: In digital communication, a way of sending data where the devices do not share one clock;
  the timing comes from special marks in the data itself
scope: The digital communication sense, where sending devices do not share a clock; not the general sense
  of things not happening at the same time.
examples:
- Asynchronous communication lets the two computers exchange data without sharing a clock.
- The asynchronous link takes its timing from special marks in the data itself.
