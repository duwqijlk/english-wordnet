simpleMeaning: to do with or holding a part made of two nitrogen atoms joined together twice
scope: It says a thing is to do with a part of two nitrogen atoms, not with the azido group of three nitrogen
  atoms and not with a thing that holds no such part.
examples:
- The azo dye gets its colour from the two nitrogen atoms joined in its core.
- This azo compound holds a part of two nitrogen atoms joined together twice.
