senseId: 'reserve_ratio%1:24:01::'
synsetId: 92411756-n
simpleMeaning: the share of a bank's total deposits kept on hand, so the bank can pay out cash when many
  people take money from accounts that pay on demand at once
scope: Not the money a bank lends out, and not the interest it pays; also called cash reserve ratio and
  required reserve ratio.
examples:
- The central bank raised the reserve ratio to slow lending.
- A high reserve ratio leaves banks with less money to lend.
