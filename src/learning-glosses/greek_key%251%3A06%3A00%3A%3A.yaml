simpleMeaning: A pattern for show made of lines that go up and down and side to side, over and over, often
  cut so they stand out from the ground.
scope: Also called fret, key pattern, or Greek fret; a pattern for show made of lines that go up and down
  and side to side, over and over, often cut so they stand out from the ground.
examples:
- A Greek key ran along the top of the wall.
- The Greek key on the vase was made of lines that go up and down and side to side.
