simpleMeaning: Money paid to the state when a person hands land, goods, or other things to someone else
  while still alive
scope: Money owed to the state for giving things away during one's life, not a charge on things left in
  a will and not a tax on what one buys.
examples:
- Her parents paid gift tax when they gave her the house while they were still alive.
- A gift tax may apply when you give a large sum of money to your son before you die.
