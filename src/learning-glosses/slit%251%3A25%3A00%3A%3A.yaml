simpleMeaning: a low place cut or dug into the outside part of something
scope: A low place cut into a surface, also called scratch, prick, and dent. It is not a long thin opening
  that goes through something.
examples:
- He ran his finger over the slit scratched into the metal.
- A small slit was cut into the top of the stone.
