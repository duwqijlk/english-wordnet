simpleMeaning: A light microscope with one curved lens that makes things look bigger, held in the fingers
scope: A light microscope with one curved lens that makes things look bigger, not a two-lens microscope
  and not a telescope; magnifying glass is another name for this sense.
examples:
- She used a hand glass to read the tiny print.
- The hand glass made the stamp look much bigger.
