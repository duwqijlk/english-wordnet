simpleMeaning: Usually to get a thing clean, by working a cleaning bar over every part of it
scope: To rub a cleaning bar over a thing, not the bar itself and not just washing with water.
examples:
- She soaped her hands before dinner.
- He soaped the dog all over in the bath.
