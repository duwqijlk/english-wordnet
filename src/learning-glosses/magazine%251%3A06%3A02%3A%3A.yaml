simpleMeaning: one printed copy of a soft-cover publication that comes out regularly, as a thing you can
  hold.
scope: This is not the publication as a whole and not the company that produces it; it is a single printed
  copy you can hold.
examples:
- She bought a magazine at the station and read it on the train.
- He stacked old magazines beside the bed.
