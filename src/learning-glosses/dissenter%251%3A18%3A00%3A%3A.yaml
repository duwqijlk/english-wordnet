senseId: 'dissenter%1:18:00::'
synsetId: 10037746-n
simpleMeaning: a person who does not agree with an official plan or set of rules that is already in place
scope: A person who does not agree with an official plan or rules already in place, not a person who only
  says a fact is not true and not a person who disagrees about a new idea.
examples:
- A few dissenters in the group would not accept the long-standing policy and said so in public.
- He was known as a dissenter because he opposed the government's long-standing policy.
