senseId: 'keep_relay%1:06:01::'
synsetId: 92463799-n
simpleMeaning: Even with no power running to the part that moves it, this switch stays in one of its two
  spots and never moves
scope: 'Also called a bistable relay, an impulse relay, or a latching relay: a switch that holds its spot
  with no power, not a switch that needs power to hold its spot.'
examples:
- The keep relay held its spot after the power was cut.
- They fitted a keep relay so the lights would stay on without power.
