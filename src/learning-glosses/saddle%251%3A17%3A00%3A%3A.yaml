simpleMeaning: a low way over land or a long high part of land between two peaks, that slopes gently and
  dips in the middle
scope: This is land between two peaks, not a piece of meat and not the seat put on a horse for riding.
examples:
- We crossed the saddle between the two snowy peaks.
- From the saddle, we could see down both sides of the mountain.
