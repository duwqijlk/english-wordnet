simpleMeaning: what you see of a thing that comes from the light it gives off, lets through, or throws
  back
scope: 'Also called color: what you see of a thing from the light it gives off, lets through, or throws
  back, not how a thing looks to a person in shade and light and not a false show put on to mislead.'
examples:
- A white colour is made of many kinds of light mixed together.
- The colour of the leaf comes from the light it throws back.
