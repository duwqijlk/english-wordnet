simpleMeaning: A hard, easily broken grey metal that can join other atoms in many ways, like iron but
  not drawn to a magnet, used in steel and found in many minerals
scope: Mn and atomic number 25 are other names for this sense; not iron and not any grey metal.
examples:
- Manganese is added to steel to make it hard.
- The miners dug manganese from the hills.
