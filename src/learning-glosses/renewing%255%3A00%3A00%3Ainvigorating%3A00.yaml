simpleMeaning: Tending to bring new strength and energy to a person or thing, and to give it new life
scope: 'Also called restorative, reviving, and revitalizing: giving new life and strength, not making
  an old thing new again and not starting a time period again.'
examples:
- She enjoyed the renewing warmth of the sun after the cold night.
- A long rest had a renewing effect on his tired body.
