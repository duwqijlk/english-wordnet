simpleMeaning: having no link in logic and no link of cause and effect
scope: About facts or ideas that have no link in logic or cause; not about people who are not in the same
  family.
examples:
- His lateness was unrelated to the traffic jam that morning.
- The rise in prices is unrelated to the new law.
