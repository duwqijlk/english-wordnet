simpleMeaning: A form of fun that tells a story with sound and a run of still images that seem to move.
scope: Also called movie, film, picture, flick, pic, motion-picture show, motion picture, moving-picture
  show and picture show; a story told with sound and still images that seem to move, not a live play and
  not a single still photograph.
examples:
- They went to a moving picture every Saturday night.
- The moving picture was shot on location.
