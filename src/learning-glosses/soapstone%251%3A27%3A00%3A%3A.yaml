simpleMeaning: a soft, heavy, solid kind of talc (a very soft stone) that feels smooth like soap, used
  to make fireplaces, table tops, and things made to look nice
scope: 'Also called soap-rock, soaprock, and steatite: a soft stone used to make things, not a bar of
  soap for washing and not a hard building stone.'
examples:
- The fireplace was made of grey soapstone.
- He carved a small bird from a piece of soapstone.
