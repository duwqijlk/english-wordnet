simpleMeaning: the act of throwing a liquid so that it lands on a surface
scope: 'Also called splash and also called spatter: the act of throwing liquid onto a surface, not rain
  falling and not a mark left by liquid.'
examples:
- The splashing of paint on the wall left blue marks everywhere.
- We heard the splashing of water as the children threw it onto the hot stones.
