simpleMeaning: a formal event at which a place or thing is given over to a special use or purpose
scope: A formal event at which a place or thing is given over to a special use; not the act of giving
  your time and care to a course of action and not a short note written for someone in a book.
examples:
- The dedication of the new school took place on Monday.
- Hundreds of people came to the dedication of the new library.
