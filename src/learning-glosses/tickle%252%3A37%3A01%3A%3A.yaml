simpleMeaning: to feel a sudden, very strong feeling in the body or mind
scope: 'Another name for this sense is thrill, also called vibrate: to feel a sudden strong feeling, not
  the feeling on the skin from a light touch and not the act of touching lightly.'
examples:
- He was tickled with excitement as the fast car sped past.
- She was tickled with joy at the sudden good news.
