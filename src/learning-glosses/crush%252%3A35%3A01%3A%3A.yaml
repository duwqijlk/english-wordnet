simpleMeaning: to hurt a part of the body by pressing it hard or by hitting it
scope: A verb for hurting a part of the body by pressing it hard; it is not the noun for the act itself,
  and not leather with a pattern on its surface.
examples:
- She crushed her toe when the heavy box fell on her foot.
- He crushed his finger in the door.
