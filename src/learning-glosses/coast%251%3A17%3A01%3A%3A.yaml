simpleMeaning: A coast is a slope that sleds can slide down.
scope: This is a rare, regional and mainly older noun for a slope that sleds can slide down, not the act
  of sliding down it, which is a different noun sense (as in 'a coast down the snowy slope'), and not
  the verb 'to coast', meaning to slide or move effortlessly. In modern English the noun coast almost
  always means the land beside the sea. It survives mostly in older writing and local speech.
examples:
- After the first snowfall, the children made a coast on the hill behind the school.
- We found a good coast by the river and slid down it all afternoon.
