simpleMeaning: the first milk-like fluid a mother gives after birth, in the first day or two
scope: 'Also called colostrum: the first milk-like fluid after birth, not the milk that comes later.'
examples:
- Foremilk appears in the first day or two after birth.
- The new mother gave foremilk to her baby in the first day.
