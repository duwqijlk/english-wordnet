schema: oewn-learning-gloss-v2
senseId: 'prompt%2:32:01::'
synsetId: 00879379-v
simpleMeaning: to help a person who is acting or speaking by giving them the next words when they have
  forgotten them or not learned them well
scope: To help a performer who has forgotten their lines, not the cue itself; remind is another name for
  this sense.
examples:
- The teacher prompted the boy when he forgot his line.
- She prompted the actor twice during the play.
