simpleMeaning: A person with this can hold tunes and other runs of notes from music in the mind
scope: The power to hold tunes and runs of notes in the mind, not the power to hold words or pictures
  in the mind, and not skill at playing music.
examples:
- Her musical memory let her play back the tune after hearing it once.
- His musical memory held the whole song in his head for days.
