simpleMeaning: a radio signal whose length is between 100 and 1000 metres, and whose speed of vibration
  is between 300 and 3000 kilohertz
scope: A radio signal with a length between 100 and 1000 metres; not a long wave, and not a short wave.
examples:
- The station broadcasts on medium wave so it can be heard across the country.
- Medium wave signals travel well at night.
