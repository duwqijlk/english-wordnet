simpleMeaning: how rough a thing is, so that it leaves small cuts or scrapes
scope: This is how rough a thing is when it scrapes a surface; also called harshness, not softness and
  not a cut made by a blade.
examples:
- The abrasiveness of the coarse sandpaper tore at his skin.
- Her hands were sore from the abrasiveness of the rough cloth.
