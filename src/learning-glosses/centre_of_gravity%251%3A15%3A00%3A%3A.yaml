simpleMeaning: the point inside a thing where the pull down to the ground acts, and where the pull is
  steady it is the same point as where its weight sits
scope: 'Also called center of gravity: the point inside a thing where the pull down to the ground acts,
  not the point where a floating thing''s weight seems to sit.'
examples:
- The centre of gravity of the box sat low, so it did not tip over.
- Raising the load moved the centre of gravity higher up.
