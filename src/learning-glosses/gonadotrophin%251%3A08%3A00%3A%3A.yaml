simpleMeaning: a body chemical made by the front of the gland under the brain and by the afterbirth, which
  wakes the sex glands and rules the making of young
scope: 'Also called gonadotrophic hormone, gonadotropic hormone, and gonadotropin: a body chemical that
  wakes the sex glands and rules the making of young, not a sex gland itself and not a medicine.'
examples:
- Gonadotrophin is made by the pituitary gland and the placenta.
- A lack of gonadotrophin can stop the sex glands from working.
