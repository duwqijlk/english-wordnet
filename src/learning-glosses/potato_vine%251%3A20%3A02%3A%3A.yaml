simpleMeaning: White blooms touched with blue open on this much-branched climbing plant from Brazil, whose
  leaves fall in the cold months.
scope: This much-branched climbing plant from Brazil is not the Costa Rican plant of the same name with
  hooklike spines.
examples:
- The potato vine lost its leaves when the cold months came.
- White blooms touched with blue covered the potato vine.
