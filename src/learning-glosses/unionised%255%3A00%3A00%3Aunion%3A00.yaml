simpleMeaning: Belonging to a workers' group that acts together for its members, or made into such a group
scope: Belonging to a workers' group that acts together for its members, or made into such a group, unionized
  being another name for this sense; not a person who has left such a group.
examples:
- The unionised workers went on strike.
- She works in a unionised shop.
