simpleMeaning: Turning round on one foot, the basketball is thrown at the basket with one hand
scope: A basketball throw made with one hand while turning round on one foot, not a throw with both hands
  and not a free throw from a still position.
examples:
- She scored with a pivot shot, turning on one foot.
- His pivot shot went in after he turned round on one foot.
