simpleMeaning: Many kinds of green plant grow well in land full of water, and this is one of them
scope: Also called meadow grass, this is any of many kinds of green plant that does well in wet land,
  not one single kind and not a plant of dry land.
examples:
- Meadowgrass grows thick along the wet edge of the field.
- The meadowgrass in the marsh stays green all summer.
