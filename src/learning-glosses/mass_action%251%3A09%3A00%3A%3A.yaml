simpleMeaning: 'The outer layer of the brain works as one joined system: in neurology, large parts of
  nerve tissue take part in all hard tasks'
scope: 'Another name for the mass-action principle: a rule about the brain''s outer layer working as one
  system, not about one small part of it.'
examples:
- Mass action means the cortex acts as one joined system when we think.
- The teacher showed how mass action brings large parts of nerve tissue into every hard task.
