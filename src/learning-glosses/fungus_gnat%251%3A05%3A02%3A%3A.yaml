simpleMeaning: Tiny dark flies that live in groups and harm mushrooms and young plants
scope: These are tiny dark flies that live in groups and harm mushrooms and young plants; sciara and sciarid
  are other names for this sense, not the mosquito-like fly whose young feed on fungi.
examples:
- Fungus gnats swarmed over the seed trays.
- The fungus gnat harms mushrooms in the damp shed.
