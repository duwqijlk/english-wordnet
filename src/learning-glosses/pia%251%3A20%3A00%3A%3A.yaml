simpleMeaning: A herb living more than two years, from the East Indies through Polynesia to Australia,
  grown for its large edible root, which yields a starch known as Otaheite arrowroot.
scope: A tropical plant grown for a starchy edible root, not the arrowroot starch itself or another root
  crop.
examples:
- Farmers grow pia for its large edible root.
- The root of the pia yields Otaheite arrowroot starch.
