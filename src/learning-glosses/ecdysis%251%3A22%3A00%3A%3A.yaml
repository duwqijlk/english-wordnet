senseId: 'ecdysis%1:22:00::'
synsetId: 13538045-n
simpleMeaning: the shedding, at set times, of the hard outer skin of a jointed-leg animal or the outer
  skin of a reptile
scope: A shedding of outer skin at set times, also called molt, molting, moult and moulting; not hair
  loss and not the shedding of leaves.
examples:
- The crab's ecdysis left its old shell behind.
- During ecdysis, the snake sheds its outer skin.
