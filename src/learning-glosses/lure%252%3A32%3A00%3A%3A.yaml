simpleMeaning: to get a person to do a thing by promising them things or by talking them into it, often
  with promises that are not true or are too big
scope: Getting a person to do a thing with promises or talk, also called tempt, not the drawing power
  of a thing and not the thing used to trap fish or animals.
examples:
- He tried to lure her into the shop with promises of free gifts.
- The ad lured many people to buy things they did not need.
