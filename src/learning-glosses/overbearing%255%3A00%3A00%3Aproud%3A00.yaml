simpleMeaning: acting as if you are better than other people and showing no respect for those you think
  are not good enough
scope: Also called haughty, imperious, disdainful, lordly, swaggering, prideful, supercilious and sniffy.
  This is about acting above other people, not about expecting people to obey you without question.
examples:
- With an overbearing air, she looked down on the young workers as if they were beneath her.
- He was so overbearing that he treated the shop staff as if they did not matter.
