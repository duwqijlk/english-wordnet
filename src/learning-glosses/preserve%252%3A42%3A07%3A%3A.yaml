simpleMeaning: to keep something left alone for personal or private use for hunting, shooting, or fishing
scope: To keep something left alone for personal or private use for hunting, shooting, or fishing, not
  to keep a thing safe from harm, rot or loss and not fruit cooked with sugar.
examples:
- The family preserves this lake for fishing.
- They preserve the woods for hunting and shooting.
