simpleMeaning: the last parts of the lines of a poem sound the same
scope: Lines of a poem whose last parts sound the same, not lines that sound the same in the middle and
  not lines whose last parts sound different.
examples:
- The end-rhymed verses closed each line with the same sound.
- Her end-rhymed poem paired the last words of every line.
