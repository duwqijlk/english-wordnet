simpleMeaning: a look turned to one side, as if with doubt, distrust, or envy, said most of all of looks
scope: A look turned to one side, as if with doubt, distrust, or envy, not eyes shut part way against
  bright light and not eyes that point in different ways.
examples:
- He gave her a squint glance full of doubt.
- Her squint look showed she did not trust his tale.
