simpleMeaning: 'a health problem a baby is born with: the body is misshapen or the face or mind does not
  grow right, because the mother drank alcohol while carrying the baby'
scope: A health problem a baby is born with, caused by the mother drinking alcohol; fetal alcohol syndrome
  is another name for this sense; not a problem that starts after birth and not another birth problem.
examples:
- The child has FAS because her mother drank during pregnancy.
- Doctors warn that drinking in pregnancy can cause FAS.
