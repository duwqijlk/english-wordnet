simpleMeaning: A British person with a high title, lower than an earl and higher than a baron
scope: This is a British noble title, below an earl and above a baron; it is not the higher title of earl
  and not the lower title of baron.
examples:
- The viscount owned a large house in the country.
- A viscount ranks below an earl in Britain.
