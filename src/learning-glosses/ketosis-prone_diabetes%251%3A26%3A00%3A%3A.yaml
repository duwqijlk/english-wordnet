simpleMeaning: A severe form of diabetes beginning early in life, with episodes of blood acid build-up
  plus heavy urination, great thirst, hunger and weight loss; diet and insulin shots control it.
scope: Another name for the same early-onset, insulin-treated diabetes also called ketoacidosis-prone
  diabetes; not adult-onset type 2 diabetes or diabetes insipidus.
examples:
- Ketosis-prone diabetes can flare up when insulin doses are missed.
- The clinic runs a support group for adults with ketosis-prone diabetes.
