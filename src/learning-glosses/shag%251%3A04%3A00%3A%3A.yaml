simpleMeaning: a lively dance step in which you hop first on one foot and then on the other
scope: A dance step done by hopping from foot to foot; not cloth with a long rough surface, not a thick
  mat of hair, and not coarse cut tobacco.
examples:
- His shag had him hopping lightly from one foot to the other.
- The dancers added a shag, hopping on each foot in turn.
