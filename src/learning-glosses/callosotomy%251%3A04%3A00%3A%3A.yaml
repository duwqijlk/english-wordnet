simpleMeaning: In bad fits that no drug can stop, the thick band of nerve fibres between the two halves
  of the brain is cut through, cutting off messages between the halves.
scope: 'Also called callosectomy: brain surgery to stop fits that drugs cannot control, not drug treatment
  and not surgery on one half of the brain alone.'
examples:
- A callosotomy was planned once every drug had failed to stop the fits.
- The callosotomy cut the band of fibres that joined the two halves of his brain.
