senseId: 'time_zone%1:15:00::'
synsetId: 08709014-n
simpleMeaning: one of the 24 parts of the world, split loosely by lines of longitude, where all places
  set their clocks the same way
scope: One of the 24 parts of the world that share a standard clock setting. Not a line of longitude itself,
  and not a local time set by the sun.
examples:
- New York and London are in different time zones.
- When you fly across a time zone, you have to change your watch.
