simpleMeaning: In chemistry, the weight of an element (a basic substance) with the same power to join
  as a set weight of another substance; the set weight for oxygen is 8
scope: This is the chemistry weight described here, not a person or thing that is equal to another in
  worth or power.
examples:
- They measured the equivalent for each element in the test.
- For oxygen, the equivalent is set at 8.
