simpleMeaning: With leaves made of many small leaflets, green flowers in loose bunches, and red berries
  that follow, this common harmless shrub grows in the east of North America.
scope: It is also called black sumac, dwarf sumac, or shining sumac, and it is a common harmless shrub
  of the east of North America with green flowers followed by red berries.
examples:
- The mountain sumac bears green flowers followed by red berries.
- The mountain sumac grows as a common shrub in eastern North America.
