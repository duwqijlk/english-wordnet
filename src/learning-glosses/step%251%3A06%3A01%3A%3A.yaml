simpleMeaning: a solid block fixed to a ship's beams, where the bottom end of a mast or a rope-winding
  winch sits
scope: This is a ship part, not the stair you put your foot on or a stage in a process.
examples:
- The crew lowered the mast into its step on the deck.
- Water had rotted the wooden step that held the base of the mast.
