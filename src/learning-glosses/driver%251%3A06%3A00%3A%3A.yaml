simpleMeaning: The big-headed club called a wood that a golfer swings for long shots from the tee, its
  face standing almost upright to send the ball far.
scope: This is the club itself, not the golfer who swings it, not the person steering a car, and not the
  software that lets a computer talk to a device.
examples:
- She pulled the driver from her bag and teed up the ball.
- His driver sent the ball well past the bunker.
