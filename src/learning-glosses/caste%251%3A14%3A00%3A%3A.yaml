simpleMeaning: In some social insects (such as ants), one animal or a group of animals that look different
  from the others and do set jobs in the group they live in
scope: This is about insects such as ants, where one kind does set jobs in the group; not a class of people
  in society and not a Hindu class.
examples:
- In this ant colony, the soldier caste has larger heads than the workers.
- Each caste in the colony does a different job.
