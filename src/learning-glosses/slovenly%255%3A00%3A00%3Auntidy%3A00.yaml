senseId: slovenly%5:00:00:untidy:00
synsetId: 02434522-s
simpleMeaning: not taking care to look neat, especially in clothes and in how you look, and dirty and
  untidy as a habit
scope: 'Also called frowsy and frowzy: this is about a person who is dirty and untidy as a habit, not
  about a room or place that is just messy for one day.'
examples:
- He came to work looking slovenly, in a dirty shirt and with messy hair.
- Her slovenly dress and dirty shoes surprised everyone at the formal dinner.
