senseId: 'repudiation%1:10:00::'
synsetId: 07222070-n
simpleMeaning: The casting off, or owning not, or calling void.
scope: The casting off, or owning not, or calling void; also called renunciation; not the baring of falseness
  or sham, nor a refusal to own or pay a debt or keep a bond, especially by state hands.
examples:
- Their repudiation came at dawn.
- The repudiation was plain at noon.
