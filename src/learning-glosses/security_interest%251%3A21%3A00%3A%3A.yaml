simpleMeaning: a legal claim on something that makes sure money owed is paid
scope: A legal claim on something that makes sure money owed is paid, not the thing itself and not a promise
  to pay.
examples:
- The bank held a security interest in the house until the loan was paid.
- A security interest lets the lender take the car if payments stop.
