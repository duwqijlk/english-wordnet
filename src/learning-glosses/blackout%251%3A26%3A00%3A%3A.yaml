simpleMeaning: darkness caused by putting out all the lights, as when a city goes dark so enemy planes
  cannot see it
scope: Darkness from putting out the lights, as in wartime, not a loss of memory and not a stop to radio
  or television.
examples:
- The blackout left the whole street in darkness.
- During the blackout, no light showed from any window.
