simpleMeaning: A sports contest on the pattern of the great world games, but for people with a mind or
  body that does not work in the usual way
scope: This is a contest of many sports for people with a mind or body that does not work in the usual
  way, copied from the great world games, and it is not those games themselves.
examples:
- She won a medal at the Special Olympics.
- The Special Olympics give disabled athletes a chance to compete.
