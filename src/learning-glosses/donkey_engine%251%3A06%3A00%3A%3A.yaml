simpleMeaning: In ships, a small machine used on board to work a windlass, a wheel that winds in ropes
scope: A small machine on board a ship that works the wheel that winds in ropes, also called an auxiliary
  engine, and not the ship's main power plant and not a rail-yard machine for moving cars.
examples:
- The crew started the donkey engine to raise the anchor.
- The donkey engine wound in the rope while the ship lay at anchor.
