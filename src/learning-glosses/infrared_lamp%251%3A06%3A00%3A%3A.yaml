simpleMeaning: Rays the eye cannot see come from a strong glowing lamp that makes this electric heater.
scope: Also called a heat lamp, this electric heater is made from a strong glowing lamp that gives off
  rays the eye cannot see, not a lamp that gives ordinary light.
examples:
- The bathroom was warmed by an infrared lamp.
- They switched on an infrared lamp to warm the bathroom.
