simpleMeaning: made to lose patience or feel angry
scope: 'Also called annoyed, irritated, stung, pissed, steamed, riled, roiled, miffed and peeved: made
  to lose patience or feel angry, not calm, and not about a plant sting on the skin.'
examples:
- She felt nettled by his constant teasing.
- He was nettled when they left him out of the game.
