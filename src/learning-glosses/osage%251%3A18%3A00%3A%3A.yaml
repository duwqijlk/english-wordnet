simpleMeaning: A member of the Siouan people who once lived in the Missouri river low land; oil was found
  on their land early in the 1900s.
scope: A member of the Siouan people who once lived in the Missouri river low land, on whose land oil
  was found early in the 1900s, not a speaker of the Osage tongue and not a member of another Siouan people.
examples:
- The Osage once lived in the valleys of Missouri.
- Oil was found on Osage land early in the twentieth century.
