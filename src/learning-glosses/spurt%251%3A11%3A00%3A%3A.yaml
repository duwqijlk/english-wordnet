simpleMeaning: A sudden short burst of liquid that shoots out.
scope: A sudden short burst of liquid, also called a jet and a squirt, not the act of wetting a thing
  with liquid and not a stream that keeps flowing.
examples:
- A spurt of water shot from the broken pipe.
- The cut gave a spurt of blood before he pressed it shut.
