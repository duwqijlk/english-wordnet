simpleMeaning: To pull cloth or skin together into small folds
scope: 'Also called crumple, pucker, and rumple: to pull cloth or skin together into small folds, not
  to join loops of thread and not one single stitch.'
examples:
- She knit her brow in thought.
- The old man knit his brows as he read the letter.
