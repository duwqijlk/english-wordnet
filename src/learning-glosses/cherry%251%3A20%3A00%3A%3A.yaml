simpleMeaning: any of many trees and low bushy plants that give a small soft round fruit with one hard
  stone, and many also give valuable hard wood
scope: This is the tree or bush that gives the fruit, not the red color of the fruit and not the wood
  from the tree.
examples:
- The cherry in our garden gives sweet dark fruit each summer.
- We planted a cherry near the fence for shade and fruit.
