simpleMeaning: A group follows this custom when its people marry only inside their own clan or tribe.
scope: This is also called endogamous, and it is used of marrying only inside one's own clan or tribe,
  not outside it.
examples:
- Their endogamic custom keeps marriages inside the clan.
- An endogamic tribe does not marry outside its own group.
