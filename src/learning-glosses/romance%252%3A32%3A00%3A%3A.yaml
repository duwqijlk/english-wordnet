simpleMeaning: to tell lies about love, or make a story sound much bigger than it really is
scope: This is telling made-up love stories or making a story sound too big, not a love novel, not a feeling
  of mystery and excitement, and not trying to start a love affair without meaning it.
examples:
- He romanced his trip to a far-off land, making it sound wild and grand.
- The writer romanced his travels, adding love and danger that never happened.
