simpleMeaning: Tiny living things are kept from growing or doing their work, so sickness cannot start
scope: 'Also called bactericidal and disinfectant: it keeps tiny living things from growing so sickness
  cannot start, not a drug that kills sickness inside the body and not a wash that only cleans dirt away.'
examples:
- The nurse used a germicidal wash on the cut.
- Germicidal soap keeps tiny living things from growing on the skin.
