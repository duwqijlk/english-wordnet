simpleMeaning: a list where the last thing put in is the first thing taken out (last in, first out)
scope: A list that works last in, first out; not a computer part that holds data in the same way, and
  not a tall chimney for smoke.
examples:
- The program uses a stack, so the last number added is the first one taken off.
- She added the new job to the stack, and the computer did that job first.
