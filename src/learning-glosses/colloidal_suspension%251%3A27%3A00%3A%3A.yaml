simpleMeaning: a mix in which small bits of solid hang spread out in a liquid that goes on all through
  the mix
scope: A mix of small bits of solid spread through a liquid; sol and colloidal solution are other names
  for this sense; not a plain liquid, and not a mix that settles at once.
examples:
- The colloidal suspension held the powder spread through the water.
- Shake the colloidal suspension before you use it.
