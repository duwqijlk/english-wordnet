senseId: solid%5:00:00:unbroken:02
synsetId: 00292047-s
simpleMeaning: Continuous in space, with nothing missing or broken in between.
scope: Describes a line, surface or mass that runs on with no gap, not a material that is the same all
  the way through and not something strongly built.
examples:
- A solid line of cars stretched back to the junction.
- The rain came down in a solid sheet.
