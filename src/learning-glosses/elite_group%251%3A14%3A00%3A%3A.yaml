simpleMeaning: a set of people with a higher place than most, in what they know, in society, or in wealth
scope: 'Also called elite: a set of people with a higher place than most, in what they know, in society,
  or in wealth, not a large crowd and not a team that works together.'
examples:
- The elite group met each year at the old university.
- She was invited to join the elite group of top scientists in the country.
