simpleMeaning: pride that pushes others down, shown by treating people you think are below you as less
  than you
scope: Pride that shows in treating others as below you, not quiet self-respect and not simple confidence.
examples:
- His arrogance showed when he spoke down to the new staff.
- The arrogance in her manner made the whole room uneasy.
