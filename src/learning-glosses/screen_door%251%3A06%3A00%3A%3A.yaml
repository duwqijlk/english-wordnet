simpleMeaning: To let air in and keep insects out of a building when the door stands open, this is a door
  made of a frame holding a metal or plastic net.
scope: This is the door with a metal or plastic net that lets air in and keeps insects out of a building.
examples:
- He opened the screen door to let air in.
- She closed the screen door behind her.
