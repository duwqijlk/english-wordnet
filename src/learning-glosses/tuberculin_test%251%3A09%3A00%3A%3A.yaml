simpleMeaning: A check that shows past or present infection with the germ that causes tuberculosis, by
  a strong reaction of the body's surface to a substance made from the germ.
scope: This is a check that shows if a person has had, or now has, the germ that causes tuberculosis,
  also called a tuberculin skin test; not a blood check and not a chest X-ray.
examples:
- The tuberculin test showed she had been exposed to the germ.
- He had a tuberculin test before starting the new job.
