simpleMeaning: any of a small set of short English terms, often made of very few written signs, that most
  people see as rude and shocking
scope: Any of a small set of short English terms seen as rude, not a long swear word and not a rude gesture.
examples:
- He muttered a four-letter word under his breath.
- The teacher told them not to use four-letter words in class.
