simpleMeaning: The turning of waste land into land fit to live on or to farm.
scope: Also called renewal or rehabilitation; the turning of waste land into land fit to live on or to
  farm, not the rescuing of a person from error.
examples:
- The reclamation of the marsh gave the town new fields.
- Reclamation turned the old waste ground into homes and gardens.
