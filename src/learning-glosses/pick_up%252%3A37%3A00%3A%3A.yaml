simpleMeaning: Fill a person with hope and glad feelings
scope: 'Also called uplift, elate, intoxicate or lift up: to make a person feel glad and full of hope,
  not to lift a thing off the ground and not to fetch a person.'
examples:
- The good news picked up her spirits after a hard week.
- His letter picked us up when we felt low.
