senseId: 'rectus_medialis%1:08:00::'
synsetId: 05324400-n
simpleMeaning: In the eye, a small band of flesh that pulls the eye in toward the nose
scope: 'Also called medial rectus or medial rectus muscle: the eye band that pulls the eye only in toward
  the nose, not the one that pulls it out and not the one that pulls it down and in.'
examples:
- The rectus medialis pulls the eye in when we look at our own nose.
- A strong rectus medialis helps the eyes turn in to read a book.
