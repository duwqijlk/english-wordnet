simpleMeaning: Flat flippers have taken the place of legs on one of many kinds of big turtles, found all
  over warm waters.
scope: Marine turtle is another name for one of many kinds of big turtles whose legs have become flat
  flippers and which live in warm waters.
examples:
- A sea turtle moves on flat flippers in warm waters.
- The sea turtle has legs that have become flat flippers.
