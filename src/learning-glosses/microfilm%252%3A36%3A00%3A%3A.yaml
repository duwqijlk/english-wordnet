simpleMeaning: to copy writing, pictures or other records onto film in a very small size
scope: The action of copying records onto very small film; not the film itself that holds the small copies,
  and not filming a movie.
examples:
- The library microfilmed its old newspapers so the copies would last for many years.
- They microfilm every birth record before they store the paper copies.
