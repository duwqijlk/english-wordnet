simpleMeaning: a mix of food with salt, herbs, and spices, put inside meat or vegetables to fill them
scope: This is the food put inside meat or vegetables, not a sauce poured over salad and not a cloth over
  a wound.
examples:
- She made dressing with bread and sage to fill the turkey.
- The dressing inside the peppers was hot and tasty.
