synsetId: 13675079-n
simpleMeaning: how long or wide one of the small parts at the end of the hand is, used as a way to measure
  length
scope: 'Also called a digit, a finger, and a fingerbreadth: how long or wide one of the small parts at
  the end of the hand is, used as a way to measure length, not a measure of weight and not a measure of
  time.'
examples:
- The gap was no more than a finger's breadth wide.
- He moved the board by a finger's breadth to line it up.
