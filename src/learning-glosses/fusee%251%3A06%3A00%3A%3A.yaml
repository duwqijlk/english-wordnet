simpleMeaning: a device that starts the burn in the stuff that drives a shell or rocket forward
scope: 'Also called a fuse, a fuze, a fuzee, a primer or priming: a part that starts a propellant burning,
  not a warning flare and not a clock part.'
examples:
- The gunner checked the fusee before loading the shell.
- A faulty fusee can keep the charge from firing at all.
