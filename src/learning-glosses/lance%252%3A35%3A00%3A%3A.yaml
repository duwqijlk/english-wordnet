simpleMeaning: to open something by pushing a small sharp knife used by doctors into it
scope: To open something with a small knife used by doctors; not to pierce someone with a long pointed
  weapon in a fight, and not the knife itself.
examples:
- The doctor lanced the swollen spot on his arm.
- She had to lance the boil so it could heal.
