simpleMeaning: A tree of western North America with large five-part foliage that turns orange in autumn.
scope: A tree of western North America with large five-part foliage that turns orange in autumn; not an
  oak and not a small bush.
examples:
- The big-leaf maple turned orange in the autumn.
- A big-leaf maple shaded the garden in summer.
