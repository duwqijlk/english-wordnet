simpleMeaning: Most of all among Christian churches, this move joins faiths as one
scope: This move joins faiths as one, most of all among Christian churches; ecumenism is another name
  for this sense, not a move to keep faiths apart.
examples:
- He wrote a book about oecumenism and the unity of churches.
- Oecumenism grew as churches began to work together.
