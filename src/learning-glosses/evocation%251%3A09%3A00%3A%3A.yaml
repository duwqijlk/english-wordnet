senseId: 'evocation%1:09:00::'
synsetId: 05777830-n
simpleMeaning: the act of making something again in a new way, by picturing it in the mind
scope: Making something again in the mind, not calling up powers that people only believe in with magic
  words, and not something that brings out a kind of behaviour.
examples:
- Her evocation of the old town made readers feel they were there.
- The poem is an evocation of childhood summers by the sea.
