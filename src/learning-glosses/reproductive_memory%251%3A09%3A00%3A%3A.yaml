simpleMeaning: Recall that is thought to work by keeping the first thing that came in through the senses
  and bringing it back again during recall.
scope: It is also called reproduction, and it is a way of calling back the past by keeping the first thing
  that came in through the senses.
examples:
- With reproductive memory, they can repeat the tune just as they first heard it.
- Their reproductive memory brought back the words of the poem exactly.
