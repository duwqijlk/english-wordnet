senseId: 'magnetic_declination%1:25:00::'
synsetId: 13916003-n
simpleMeaning: The angle at one place between the north shown by a compass and true north
scope: The angle at one place between compass north and true north, also called magnetic variation; not
  the compass itself and not any angle on a map.
examples:
- The magnetic declination here is ten degrees west.
- Sailors must allow for magnetic declination when they steer by compass.
