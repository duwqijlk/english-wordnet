senseId: 'plagiarism%1:04:00::'
synsetId: 00751748-n
simpleMeaning: the act of taking another person's words or ideas and saying they are your own
scope: This is taking words or ideas and saying they are yours; it is not quoting someone with their name
  given, and it is not writing the same idea by chance.
examples:
- The student was punished for plagiarism in his essay.
- The book was taken off sale because of plagiarism.
