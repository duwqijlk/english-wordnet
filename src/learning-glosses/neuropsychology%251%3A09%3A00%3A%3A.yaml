simpleMeaning: In psychology, the field that studies how the body shapes the workings of the mind.
scope: In psychology, the field that studies how the body shapes the workings of the mind, also called
  physiological psychology and psychophysiology; not the branch of medicine for mind troubles and not
  the study of the mind alone.
examples:
- Neuropsychology asks how the brain shapes the way we think.
- He took a course in neuropsychology to learn how the body shapes thought.
