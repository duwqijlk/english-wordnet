senseId: 'positivity%1:07:00::'
synsetId: 05174332-n
simpleMeaning: a quality of being sure, taking something as true, saying it is true, and pushing your
  view strongly as if it cannot be wrong
scope: 'Also called positiveness and positivism: this is being sure and firm about what is true, not the
  hopeful quality that points to a good result and not the electric pole side of something.'
examples:
- Her positivity left no room for doubt; she stated her view as if it were plain fact.
- His positivity could feel pushy, because he took his own idea as true at once and pressed it on everyone.
