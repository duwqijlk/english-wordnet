simpleMeaning: The date set for voting, in the United States a date between the 2nd and the 8th of November.
scope: The date set for voting, in the United States a date between the 2nd and the 8th of November, not
  a holiday and not the date votes are counted.
examples:
- Election day falls in November.
- Voters went to the polls on election day.
