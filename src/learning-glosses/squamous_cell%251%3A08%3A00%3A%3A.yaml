simpleMeaning: a flat piece of living matter, like a plate, that forms a single layer of the thin skin
  that lines the inside and outside of the body
scope: A flat plate-like piece of living matter in a single layer of lining skin, not a round cell and
  not a thick layer of many cells.
examples:
- A squamous cell is flat like a plate.
- Squamous cells form a single layer of tissue.
