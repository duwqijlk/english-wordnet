simpleMeaning: In each lung, one of two webs of nerves works on its own
scope: Also called a pulmonary plexus, this is one of two webs of nerves in a lung, not a web of nerves
  elsewhere in the body and not a blood vessel in the lung.
examples:
- The plexus pulmonalis is a web of nerves in the lung.
- Doctors traced the problem to the plexus pulmonalis in her left lung.
