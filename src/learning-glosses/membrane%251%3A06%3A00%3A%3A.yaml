simpleMeaning: a thin sheet of stuff that bends easily and can be folded
scope: A thin sheet of stuff that bends easily, not the thin tissue that lines or joins parts of animals
  or plants.
examples:
- A membrane of plastic covered the jar to keep the jam fresh.
- The tent's roof was a tough membrane that bent without tearing.
