senseId: 'irridenta%1:15:00::'
synsetId: 08606696-n
simpleMeaning: This land belongs with one country in its people and its past, but it is ruled by another
  country
scope: A land tied by its people and past to one country but ruled by another, also called irredenta;
  not a land that simply borders another country and not a colony settled by newcomers.
examples:
- The irridenta on the border had long been claimed by its neighbour.
- People in the irridenta still spoke the language of their old homeland.
