simpleMeaning: A bushy, sweet-smelling European herb that lives for years, with groups of button-like
  flower heads with white rays; long valued as a medicine; sometimes put in the genus Chrysanthemum.
scope: Not chamomile or tansy, other daisy-like herbs; also called feverfew and Chrysanthemum parthenium.
examples:
- Tanacetum parthenium grows in the herb garden.
- She dried Tanacetum parthenium for a headache remedy.
