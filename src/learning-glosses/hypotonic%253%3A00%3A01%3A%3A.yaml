simpleMeaning: living tissue that has less firmness and tightness than it should have
scope: Living tissue that lacks its normal firmness, not tissue that is too firm and not tissue that has
  been damaged.
examples:
- The hypotonic muscle felt soft and slack under the doctor's hand.
- After the illness, the baby's limbs were hypotonic and moved with little resistance.
