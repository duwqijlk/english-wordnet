simpleMeaning: to put a person off doing something by scaring them with threats and a bossy, overbearing
  manner
scope: 'Also called bully: to scare someone off with threats and a domineering manner, not the Australian
  labourer of the same name and not the proud walk.'
examples:
- The older boys swaggered the younger ones into silence.
- He tried to swagger her out of asking questions.
