simpleMeaning: A loss in a game that settles who wins, most of all in the card game called cribbage
scope: A loss in a game that settles who wins, not a person's unsteady walk and not the sudden up-and-down
  move of a ship.
examples:
- He took a lurch in the card game and lost by a wide margin.
- A lurch in cribbage left her with no points at all.
