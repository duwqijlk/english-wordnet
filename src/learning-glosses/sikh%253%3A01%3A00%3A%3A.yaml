simpleMeaning: Of or relating to the members of that faith, or to their faith and ways.
scope: This word describes things that belong to the people of the Sikh faith and their way of life, while
  the noun sense of the same word names one member of that faith.
examples:
- Sikh customs shape daily life for the members of that faith.
- The Sikh temple serves the members of that faith.
