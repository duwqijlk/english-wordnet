simpleMeaning: a black-tipped plug that blocks a tiny hole in the skin
scope: This is a dark plug that blocks a hole in the skin; blackhead is another name for this sense, and
  it is not a spot caused by germs.
examples:
- She squeezed the comedo on her nose.
- A comedo formed on his chin where the pore was blocked.
