simpleMeaning: As a punishment in cases of spiteful or wilful wrongdoing, a sum is paid over and above
  the true loss in law.
scope: Also called exemplary damages or punitive damages, it is a sum paid over and above the true loss,
  as a punishment in cases of spiteful or wilful wrongdoing.
examples:
- The court ordered smart money in the case.
- Smart money was paid on top of the damages.
