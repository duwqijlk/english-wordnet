simpleMeaning: a whole number that goes into two or more other whole numbers with nothing left over
scope: This is a whole number that goes into two or more other whole numbers with nothing left over; common
  divisor and common factor are other names for this sense, and it is not the beat of a ballad.
examples:
- Three is a common measure of six and nine.
- Four is not a common measure of six and ten, since it leaves two left over.
