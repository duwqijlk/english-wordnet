simpleMeaning: Orders to pull reach the straight muscle on the outer side of the eye along this small
  cord.
scope: Also called abducens, abducens nerve, abducent nerve, nervus abducens, and sixth cranial nerve,
  this cord is the path by which orders reach the straight muscle on the outer side of the eye.
examples:
- The abducent supplies the muscle that pulls the eye to the side.
- Orders reach the eye muscle along the abducent.
