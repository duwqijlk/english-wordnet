simpleMeaning: likely to shake because it is weak or badly made
scope: 'Also called shaky or wobbly: a thing that is likely to shake because it is weak or badly made,
  not a weak body and not a bone disease.'
examples:
- The rickety table shook every time we touched it.
- We climbed the rickety ladder with care, afraid it might give way.
