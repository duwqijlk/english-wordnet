simpleMeaning: An orchid with spikes of many sweet white blooms on upright leafy stems, from wet or boggy
  ground through most of the West and north North America.
scope: This sense is also called bog rein orchid, an orchid with spikes of many sweet white blooms on
  upright leafy stems, from wet or boggy ground through most of the West and north North America.
examples:
- Bog candles bloom white on wet ground.
- The bog candles grow on upright leafy stems.
