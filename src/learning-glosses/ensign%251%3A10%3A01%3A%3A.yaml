simpleMeaning: A flag flown to show what country a ship or group belongs to.
scope: An emblem flown as a sign of nationality, not the junior naval officer and not the ship's own set
  of colours.
examples:
- The ensign flew from the stern of the ship.
- Each regiment carried its own ensign into battle.
