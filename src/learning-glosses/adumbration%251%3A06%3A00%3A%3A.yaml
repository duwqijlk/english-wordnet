simpleMeaning: a rough picture of something that is not full or clear
scope: A rough, unclear picture of something, not a full account and not the act of giving early hints
  about something to come.
examples:
- Her adumbration of the plan gave us only the rough shape of it.
- The adumbration in the report left out most of the details.
