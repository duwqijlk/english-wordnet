simpleMeaning: a unit of weight equal to one sixteenth of a pound, or 16 small weight units called drams,
  or 28.349 grams
scope: The everyday weight of one sixteenth of a pound, not the old medicine weight and not the big wild
  cat.
examples:
- The letter weighed two ounces.
- Add four ounces of flour to the bowl.
