simpleMeaning: A bean or pea that grows upright or climbs, one of the family of beans and peas (Leguminosae)
scope: A bean or pea that grows upright or climbs; legume is another name for this sense, not the bean
  or pea seed itself and not a climbing plant of another kind.
examples:
- The leguminous plant climbed the fence in the garden.
- Beans grow on a leguminous plant with spreading roots.
