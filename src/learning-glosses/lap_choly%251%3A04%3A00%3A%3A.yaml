simpleMeaning: taking out the gall bladder (the small bag that stores bile) through tiny holes in the
  belly, so a thin viewing tube and tools can be put in
scope: 'Also called laparoscopic cholecystectomy: taking out the gall bladder through tiny holes in the
  belly, not open surgery and not taking out another organ.'
examples:
- The doctor did a lap choly to take out her gall bladder.
- After the lap choly, she went home the next day.
