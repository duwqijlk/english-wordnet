simpleMeaning: a pretty band of loose threads that trims the two short ends of a carpet from the East
scope: This is a pretty band of loose threads that trims the two short ends of a carpet from the East,
  also called selvage; not the side edge of cloth and not a plain hem.
examples:
- The selvedge on the old carpet was worn and thin.
- He liked the selvedge at the ends of the rug.
