simpleMeaning: secret work by a country's spies, planned so the country behind it can deny it and still
  be believed
scope: Secret work by spies, planned so the country behind it can deny it and still be believed, not open
  war and not a spy's work done in the open.
examples:
- The covert operation was planned so the government could deny any part in it.
- The agents carried out the covert operation without leaving proof of who had sent them.
