simpleMeaning: A cruel boss who makes workers do far too much work.
scope: Slave driver is another name for this sense, a boss marked by cruelty and by forcing too much work,
  unlike a fair boss who asks for a fair amount or a firm boss who is strict but not cruel.
examples:
- He was a Simon Legree, a cruel boss who made his workers do far too much.
- The workers feared their Simon Legree, who demanded far too much work.
