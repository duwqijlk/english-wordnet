simpleMeaning: A money unit worth a small part, usually one hundredth, of the main money unit.
scope: This is a money unit worth a small part, usually one hundredth, of the main money unit; fractional
  monetary unit is another name for it, not the main money unit itself.
examples:
- A cent is a subunit of the dollar.
- The subunit is worth one hundredth of the main money unit.
