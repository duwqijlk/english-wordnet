simpleMeaning: A fee for using the gates in a canal or waterway that let a boat through.
scope: This is a charge for passing a boat through a canal lock, not a toll for using a road and not a
  charge for tying up a boat.
examples:
- The lockage for the canal was two pounds a boat.
- Boats paid lockage at each lock on the waterway.
