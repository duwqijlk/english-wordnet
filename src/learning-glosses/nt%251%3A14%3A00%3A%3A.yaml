simpleMeaning: A group that looks after old built things and spots of past worth or wild charm; begun
  in 1895 and kept up by gifts and dues from its backers.
scope: Also called National Trust; a group that guards old built things, not a government office and not
  a charity for the poor.
examples:
- The NT owns the old hall.
- She joined the NT to help save old houses.
