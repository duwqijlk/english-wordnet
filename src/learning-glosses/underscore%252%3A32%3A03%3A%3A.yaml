simpleMeaning: to draw a line or lines under written words to show that they matter
scope: Also called underline, this means drawing a line under words, not the line itself as a noun and
  not only saying that a point matters.
examples:
- Please underscore the title of the book in your list.
- She underscored her name at the top of the page.
