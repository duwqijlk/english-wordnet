simpleMeaning: One word or short group of words can mean two or more different things, and which thing
  it means depends on the setting
scope: 'Also called polysemy: one word or phrase with two or more meanings, not a sentence that is unclear
  and not a word with one meaning.'
examples:
- The word 'bank' shows lexical ambiguity, since it can mean a river side or a place for money.
- Lexical ambiguity can make a joke work in two ways.
