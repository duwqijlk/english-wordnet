simpleMeaning: A chemical change that can run both ways, one way adding oxygen and the other way taking
  it away.
scope: A chemical change that can run both ways; oxidoreduction is another name for this sense, not a
  change that runs one way only and not a change with no reverse.
examples:
- In the test tube, the oxidation-reduction ran one way and then back again.
- Oxidation-reduction lets the cell gain and lose oxygen in turn.
