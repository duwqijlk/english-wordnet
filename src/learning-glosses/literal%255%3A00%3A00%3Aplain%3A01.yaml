senseId: literal%5:00:00:plain:01
synsetId: 01798183-s
simpleMeaning: not adding extra words or making something sound bigger than it is, used to stress a point
scope: Words used with nothing added and nothing made bigger, to stress a point; not the sense that means
  true to the real nature of something, and not a mistake in printed text.
examples:
- When I say I ran for hours, that is the literal truth, not just a way of speaking.
- He took her words in their literal sense, with nothing added.
