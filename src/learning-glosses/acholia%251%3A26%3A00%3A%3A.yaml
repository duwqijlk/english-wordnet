simpleMeaning: A state in which the body makes little bile, or none, and the bile it makes cannot reach
  the gut where food is broken down.
scope: Also called cholestasis, this names the state in which the body makes little bile, or none, or
  its bile cannot reach the gut.
examples:
- The tests showed acholia, with almost no bile reaching the gut.
- With acholia, little bile reached the gut to help break down food.
