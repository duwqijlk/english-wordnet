simpleMeaning: A hard stuff from the ground, red, yellow or brown, is made when iron joins with oxygen,
  the gas in air, and is often found in rust
scope: A red, yellow or brown hard stuff from the ground, also called goethite, not a soft stone and not
  rust itself.
examples:
- The gothite in the rock gave it a brown tint.
- Rust in the old pipe held gothite.
