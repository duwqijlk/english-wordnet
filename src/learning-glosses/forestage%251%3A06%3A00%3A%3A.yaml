simpleMeaning: The part of a new-style stage that lies between the curtain and the musicians, in front
  of the curtain.
scope: The front part of a stage, between the curtain and the musicians; apron and proscenium are other
  names for this sense, not the back of the stage and not the seats.
examples:
- The actor stepped onto the forestage to speak to the crowd.
- Chairs for the musicians stood just past the forestage.
