simpleMeaning: a thick part that grows under the ground and can be eaten, from one of several kinds of
  plant
scope: This is the part you eat from the plant, not the plant itself and not the sweet potato with deep
  orange flesh.
examples:
- She cooked yam with rice for lunch.
- I bought fresh yams at the market to eat.
