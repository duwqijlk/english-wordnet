simpleMeaning: In astronomy, a supposed huge swarm of comets circling the sun far beyond Pluto, where
  a push from another star can knock one off course toward the sun
scope: In astronomy, a supposed huge swarm of comets far beyond Pluto — a cloud of many comets, not one
  comet — where a push from another star can knock one toward the sun.
examples:
- The Oort cloud holds comets far beyond Pluto.
- A comet from the Oort cloud fell toward the sun.
