simpleMeaning: White flowers in bunches hang from the bending, tangled branches of this fast-growing bush
  of the south-east United States, which stays green all year
scope: This bush is also called dog hobble and switch-ivy.
examples:
- The dog laurel stayed green all year.
- Bunches of white flowers hung from the dog laurel.
