simpleMeaning: to turn cold and formal in manner all at once
scope: To turn cold and formal in manner all at once, not to make something turn to ice and not to stop
  money from being used.
examples:
- When she saw her ex-husband, she seemed to freeze, turning cold and formal.
- He would freeze at the sight of his old boss and speak in a stiff, formal way.
