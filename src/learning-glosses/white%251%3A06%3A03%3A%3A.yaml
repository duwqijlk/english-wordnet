simpleMeaning: trousers made of flannel, gabardine, or tweed, or of white cloth, usually used in the plural.
scope: This is not the color itself and not any light-colored garment; it is a plural noun for a kind
  of trousers.
examples:
- He folded his cricket whites neatly into the bag.
- She bought a new pair of whites for the tennis season.
