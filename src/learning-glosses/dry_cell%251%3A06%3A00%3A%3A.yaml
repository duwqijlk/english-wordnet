simpleMeaning: 'A small Leclanche cell with no free liquid: the electrolyte is a paste, the zinc case
  serving as container and negative pole; used in flashlights, portable radios and the like.'
scope: A sealed battery cell whose electrolyte is a paste rather than a liquid, common in flashlights
  and portable radios. It is not a wet cell, which holds its electrolyte as a liquid. The term belongs
  to electrical engineering.
examples:
- He swapped the dead dry cell in his flashlight for a new one.
- The toy ran on a single dry cell the size of a thumb.
