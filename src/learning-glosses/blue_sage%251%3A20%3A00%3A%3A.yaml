simpleMeaning: With grey-white leaves and a strong smell, this bush grows in the dry lands of the west
  of North America.
scope: This bush is also called big sagebrush, and it is not the blue sage with violet-blue flowers that
  is grown in gardens.
examples:
- The blue sage grew in the dry lands of the west.
- The blue sage filled the air with its strong smell.
