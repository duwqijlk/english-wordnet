simpleMeaning: strange things happen in the world, so some believe, when spells call on hidden powers
  or evil spirits
scope: Also called sorcery, necromancy, or black magic, this is a belief about what spells can do, not
  a spell itself.
examples:
- He believed in the black art and its hidden powers.
- People feared the black art and the spells it was said to work.
