senseId: 'voltage%1:19:02::'
synsetId: 11543971-n
simpleMeaning: the rate at which energy is taken from a source that makes electricity flow in a circuit,
  shown in volts
scope: Also called electromotive force, and another name for this sense is emf. This is a rate at which
  energy is taken, not the difference in charge between two points.
examples:
- The voltage from this power supply is too high for the small motor.
- He checked the voltage before connecting the wires to the circuit.
