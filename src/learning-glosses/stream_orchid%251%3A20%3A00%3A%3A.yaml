simpleMeaning: An orchid that grows by streams or ponds of west North America, with leafy stems and one
  green-brown and pinkish bloom in the nook of each top leaf.
scope: This sense is also called chatterbox and giant helleborine.
examples:
- A stream orchid grew by the pond.
- Stream orchids bloom by streams.
