simpleMeaning: The nose's moist lining carries on into the paired hollows in the facial bones, which share
  that same unbroken surface.
scope: One of three interchangeable names for these paired facial cavities, alongside nasal sinus and
  paranasal sinus; it is not the blood channels inside the skull that are also called sinuses, nor the
  nasal cavity itself.
examples:
- The sinus paranasales drain into the nasal cavity through narrow openings.
- Inflammation of the sinus paranasales often follows an ordinary cold.
