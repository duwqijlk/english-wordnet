simpleMeaning: A feeling in the body as if many small sharp points were pricking the skin.
scope: Also called tingle or prickling, this is a feeling in the body as if many small sharp points were
  pricking the skin, not a touch that stirs up laughter.
examples:
- A tingling in her fingers told her the feeling was coming back.
- The tingling spread slowly up his arm.
