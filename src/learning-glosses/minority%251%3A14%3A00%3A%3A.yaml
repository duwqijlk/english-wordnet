simpleMeaning: a smaller group of people who are different in race or politics from the larger group they
  belong to
scope: A smaller group set apart by race or politics from the larger group; not the smaller number in
  a vote and not a group of children.
examples:
- The minority in the town spoke a different language.
- Laws protect the rights of a minority.
