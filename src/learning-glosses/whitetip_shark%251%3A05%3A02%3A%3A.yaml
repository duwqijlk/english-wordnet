simpleMeaning: Of the Pacific and Indian Oceans and the Red Sea is this smooth small fish, with pale tips
  on the fins of its back and tail.
scope: Also called reef whitetip shark, this smooth small fish of the Pacific and Indian Oceans and the
  Red Sea has pale tips on the fins of its back and tail, unlike the other whitetip shark, a large deep-water
  shark found all over the world.
examples:
- The whitetip shark swam past with pale tips on its fins.
- A whitetip shark showed pale tips on its fins in the Red Sea.
