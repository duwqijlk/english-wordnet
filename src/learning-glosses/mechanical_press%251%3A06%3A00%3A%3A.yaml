simpleMeaning: Any machine that squeezes with force to shape or cut stuff, draw liquid out, or pack solids
  tight
scope: Any machine that squeezes with force to shape or cut stuff, draw liquid out, or pack solids tight,
  also called press; not a hand tool and not a machine that only lifts.
examples:
- The mechanical press shaped the metal sheets.
- A mechanical press squeezed the juice from the fruit.
