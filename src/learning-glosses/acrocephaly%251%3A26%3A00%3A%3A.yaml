simpleMeaning: From birth, the skull is wrongly shaped, with its top rising to a point like a cone.
scope: Also called oxycephaly, this names the skull that is wrongly shaped from birth, its top rising
  to a point like a cone.
examples:
- The baby was born with acrocephaly, and the top of the skull came to a point.
- Doctors watched the acrocephaly as the skull grew into a cone shape.
