simpleMeaning: A small North American evergreen fern whose stalks and the lower sides of its fronds are
  thickly woolly.
scope: Also called hairy lip fern and wooly lip fern, this small North American evergreen fern is the
  woolly one, with thickly woolly stalks and lower frond sides, among other small ferns and other lip
  ferns.
examples:
- Cheilanthes lanosa is a small North American evergreen fern.
- The stalks of Cheilanthes lanosa are thickly woolly.
