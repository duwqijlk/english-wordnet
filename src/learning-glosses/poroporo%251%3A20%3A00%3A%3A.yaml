simpleMeaning: At times grown for its loose bunches of purple flowers and yellow egg-shaped fruit to eat,
  this plant of Australia lives for one year.
scope: 'Also called kangaroo apple: a plant of Australia grown for its purple flowers and yellow fruit.'
examples:
- Poroporo grew purple flowers in loose bunches.
- We picked the yellow poroporo fruit and ate it.
