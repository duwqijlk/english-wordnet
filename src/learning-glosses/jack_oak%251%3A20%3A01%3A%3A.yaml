simpleMeaning: Leaves cut into sharply pointed parts mark this small to medium tree of east central North
  America that loses its leaves in winter.
scope: Also called northern pin oak, it is the small to medium tree of east central North America that
  loses its leaves in winter, with leaves cut into sharply pointed parts, and not the scrubby kind with
  dark bark that forms dense thickets.
examples:
- In winter, the jack oak stands bare.
- Jack oaks grow through east central North America.
