simpleMeaning: a quick shutting and opening of the eyes that happens on its own, without thinking
scope: 'Also called blink, wink and winking: the quick shutting and opening of the eyes on their own.
  This is the act itself, not a word that describes eyes that shut and open again and again.'
examples:
- Blinking happens all day and helps keep the eyes wet.
- His blinking became faster when dust got in his eye.
