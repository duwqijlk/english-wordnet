simpleMeaning: They still swim the way sharks do, though their bodies are wide and flat and their side
  fins are like wings.
scope: These are sharks with wide flat bodies and side fins like wings, also called monkfish and angelfish.
examples:
- The angel shark lay flat with its wide fins spread out.
- An angel shark swam past, moving the way sharks do.
