simpleMeaning: Money paid to the state at set times on pay with no money taken off at the source, worked
  out from what the payer thinks they will owe.
scope: Money paid to the state on pay with nothing taken off at the source, not a bill for one year and
  not a fine; no other name is listed for this sense.
examples:
- He pays estimated tax four times a year on his freelance pay.
- Her estimated tax is based on what she thinks she will owe.
