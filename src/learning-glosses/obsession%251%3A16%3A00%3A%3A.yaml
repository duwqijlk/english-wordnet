simpleMeaning: A push in the mind, with no good reason, to do small or repeated acts, even when a person
  does not want to
scope: A push in the mind, with no good reason, to do small or repeated acts even when a person does not
  want to, not a lasting unhealthy interest in one thing or person.
examples:
- Her obsession with washing her hands made her late every day.
- His obsession led him to check the locks again and again.
