simpleMeaning: Bright marks cover the body of this big tropical insect, which has a long part like a snout
  on its head and was once thought to give off light.
scope: Lantern-fly is another name for this big tropical insect, brightly marked, with a long snout-like
  part, once thought to give off light.
examples:
- The lantern fly sat still on the leaf.
- A lantern fly crawled across the bark.
