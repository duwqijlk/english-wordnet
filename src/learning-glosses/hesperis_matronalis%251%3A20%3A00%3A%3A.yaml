simpleMeaning: A herb grown for a long time, with flowers that smell stronger in the evening, now growing
  wild across Europe to Siberia and into North America
scope: A long-grown herb with evening-scented flowers; damask violet, sweet rocket and Dame's violet are
  other names for this sense, not a night-scented garden stock or a wild mustard plant.
examples:
- Hesperis matronalis filled the evening garden with a sweet scent.
- We planted Hesperis matronalis by the path so its scent would greet us at dusk.
