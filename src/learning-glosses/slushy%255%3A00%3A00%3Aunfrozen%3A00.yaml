simpleMeaning: made of snow that is melting, or like such snow, soft and wet
scope: This describes snow that is melting and wet, not snow that is hard and frozen, and not clean, dry
  snow.
examples:
- The path was covered in slushy snow that soaked our shoes.
- After the warm morning, the ground turned slushy under our feet.
