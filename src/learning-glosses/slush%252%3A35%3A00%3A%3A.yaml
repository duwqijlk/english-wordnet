simpleMeaning: To spill or splash a lot of liquid about in a clumsy way.
scope: To spill or splash a lot of liquid about in a clumsy way, with slosh as another name for this sense,
  and not partly melted snow, which is the noun sense.
examples:
- She slushed paint all over the walls.
- He slushed the water over the floor as he carried the bucket.
