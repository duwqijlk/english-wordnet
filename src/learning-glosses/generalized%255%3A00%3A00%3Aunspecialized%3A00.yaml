simpleMeaning: not changed in body or form to fit one special job or one special place to live
scope: Also called generalised. In biology this means a living thing has not changed for one special job
  or place, not that an idea or rule covers many cases.
examples:
- The hedgehog is a generalized mammal that has not changed to fit one special job.
- These generalized insects can live in many places because their bodies are not made for just one kind
  of food.
