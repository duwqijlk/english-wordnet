simpleMeaning: a top cost set by the government and kept in place, in war or when costs rise fast, to
  stop costs from going too high
scope: This is a top cost set and kept in place by the government, not a cost set by a shop on its own.
examples:
- The government put a price control on bread so the cost could not go too high.
- During the war, price controls kept the top cost of fuel in place.
