simpleMeaning: a long-lived herb with underground stems, umbrella-like leaves and white to bright pink
  flowers in round heads on bare stems, growing along stream banks in California's Sierra Nevada.
scope: This is the California stream-bank herb with umbrella-like leaves, not the African sedge grown
  in ponds or the late-blooming Virginia plant.
examples:
- The umbrella plant spreads quickly along shaded creek banks.
- I found a large umbrella plant beside the creek.
