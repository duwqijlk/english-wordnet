simpleMeaning: How far a thing reaches, or how much of it there is
scope: How far a thing reaches or how much of it there is, not a new part added to a building, not extra
  time agreed for a payment, and not a plan made to reach more people.
examples:
- The extension of the road runs for two miles.
- We measured the extension of the crack in the wall.
