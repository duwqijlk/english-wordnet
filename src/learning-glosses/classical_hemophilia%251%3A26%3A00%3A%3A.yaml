simpleMeaning: a bleeding illness present from birth, in which the blood will not clot because the body
  lacks a substance called factor VIII, found almost only in men
scope: A bleeding illness present from birth in which the blood will not clot for lack of factor VIII,
  found almost only in men; classical haemophilia is another name for this sense, not the kind caused
  by lack of factor IX and not any other bleeding illness.
examples:
- Classical hemophilia is passed down in families.
- Men with classical hemophilia must take care not to bleed.
