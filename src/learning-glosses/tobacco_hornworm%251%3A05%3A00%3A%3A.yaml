simpleMeaning: White stripes mark a big green young moth that feeds on the plant it takes its name from
  and plants like it, much like the one that feeds on tomatoes.
scope: Also called tomato worm, this young moth is the big green white-striped kind that feeds on the
  plant it takes its name from and plants like it.
examples:
- The tobacco hornworm fed on the leaves of the tobacco plant.
- We saw a big green tobacco hornworm on the tobacco plant.
