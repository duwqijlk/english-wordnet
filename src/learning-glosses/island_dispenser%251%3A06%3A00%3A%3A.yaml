simpleMeaning: The pump drivers use at a filling station to get fuel that comes up from tanks under the
  ground.
scope: A pump at a filling station that pulls petrol up from buried tanks; gas pump, gasoline pump and
  petrol pump are other names for this sense, not a pump at a home tank and not the tank itself.
examples:
- He filled the car at the island dispenser.
- The island dispenser drew petrol from the tanks below.
