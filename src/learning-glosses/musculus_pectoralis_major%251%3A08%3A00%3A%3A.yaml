senseId: 'musculus_pectoralis_major%1:08:00::'
synsetId: 05559572-n
simpleMeaning: Across the chest, this band of flesh joined to bone pulls the arm in toward the body and
  turns it
scope: 'Also called the greater pectoral muscle or the pectoralis major: this band of flesh across the
  chest pulls the arm in and turns it, not the band of flesh at the back of the shoulder and not one in
  the arm itself.'
examples:
- The musculus pectoralis major pulls the arm across the chest when he throws the ball.
- She strained the musculus pectoralis major lifting the heavy box.
