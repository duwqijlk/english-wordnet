simpleMeaning: A plant-eating or meat-eating great lizard of long ago, with a three-pointed hip bone like
  that of a crocodile.
scope: A meat- or plant-eating great lizard of long ago with a three-pointed hip bone, also called saurischian;
  not a bird-hipped dinosaur and not a crocodile.
examples:
- Some saurischian dinosaurs ate plants, and others ate meat.
- The saurischian dinosaur had a hip bone like a crocodile's.
