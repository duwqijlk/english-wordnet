simpleMeaning: using words that hide your true feelings, in particular, while your acts follow what you
  really feel, to trick others on purpose
scope: 'Also called deceitful, duplicitous, ambidextrous, double-dealing and double-faced: a word for
  a person whose words hide what they really feel, not the noun sense of the cheating itself and not a
  person who simply says the wrong thing by mistake.'
examples:
- His double-tongued promises fooled no one in the end.
- She gave a double-tongued answer that sounded kind but meant the opposite.
