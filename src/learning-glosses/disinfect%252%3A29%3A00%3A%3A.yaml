simpleMeaning: to clean something so as to kill very small living things, including those that can cause
  illness
scope: Cleaning that kills very small living things, including those that can cause illness, not just
  washing dirt away and not treating a person who is already ill.
examples:
- She disinfected the wound with a strong liquid.
- You should disinfect the kitchen surfaces every day.
