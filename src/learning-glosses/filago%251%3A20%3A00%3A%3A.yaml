simpleMeaning: Any plant with tight round bunches of small soft-haired flower heads
scope: Any plant with tight round bunches of small soft-haired flower heads; cotton rose and cudweed are
  other names for this sense, not a plant with single large blooms and not a plant with smooth heads.
examples:
- Filago grew in the dry field.
- The filago had small woolly flower heads.
