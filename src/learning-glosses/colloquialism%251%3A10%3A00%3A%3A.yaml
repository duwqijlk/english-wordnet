simpleMeaning: In writing or speech, a word or phrase that copies the way people talk when they are not
  being formal
scope: This is a word or phrase from everyday talk that copies the way people talk when they are not being
  formal, not a word picked for formal use.
examples:
- He used the colloquialism 'gonna' in his letter.
- Her story was full of colloquialisms from everyday talk.
