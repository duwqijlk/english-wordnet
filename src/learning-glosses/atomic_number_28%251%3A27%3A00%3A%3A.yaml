simpleMeaning: Nickel, a hard metal that bends and stretches, silver in colour, that does not rust easily;
  used in mixtures with other metals, found in pentlandite, smaltite, garnierite, and millerite.
scope: 'Also called Ni and nickel: a silver metal, not iron, and not a compound.'
examples:
- Nickel, atomic number 28, does not rust easily.
- Atomic number 28 is found in pentlandite and other ores.
