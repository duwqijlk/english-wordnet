simpleMeaning: having to do with the group of mammals whose young grow inside the mother before birth
scope: Of the group of mammals whose young grow inside the mother before birth, not the animals themselves
  and not the egg-laying or pouched mammals.
examples:
- Whales are eutherian mammals, with young that grow inside the mother.
- The eutherian group holds most of the mammals alive today.
