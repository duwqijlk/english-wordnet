scope: The shared noun sense for quick, careless movement, another name for rush in this same sense, not
  hurry's eager-speed or urgent-condition senses.
examples:
- His hurry through the crowded station made him bump into several people.
- In her hurry, she dropped the tray and spilled the drinks.
