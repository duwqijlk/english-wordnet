simpleMeaning: an organized group that resists or fights off an enemy or an assault
scope: An organized body of people that resists attack; not military action or resources (defense%1:04:00::),
  not protection from harm in general (defense%1:04:03::), not the sports team that stops scoring (defense%1:14:01::),
  not a justification or a spoken answer to criticism (defense%1:10:00::, defense%1:10:01::), not the
  defendant's side in court or a plea (defense%1:14:00::, defense%1:04:02::), not a barrier or other built
  structure (defense%1:06:00::), not the single act of protecting someone or something (defense%1:04:01::),
  and not an unconscious mental process that eases anxiety about instinctive desires (defense%1:22:00::).
examples:
- The village defense was a band of farmers who guarded the roads at night.
- The defense grew into a permanent force with its own officers.
