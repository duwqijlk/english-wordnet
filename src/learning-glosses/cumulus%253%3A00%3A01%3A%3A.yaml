simpleMeaning: about or connected with clouds that are thick and piled up high
scope: This describes something connected with this kind of thick, high cloud; it is not the cloud itself,
  and not a thin, flat kind of cloud.
examples:
- Cumulus clouds with flat bottoms filled the summer sky.
- Cumulus formations grew tall over the fields in the afternoon sun.
