simpleMeaning: to feel very great pain or very great suffering in the mind
scope: 'Also called agonize: to feel very great pain or suffering, not to make another person feel that
  pain.'
examples:
- He agonised in pain after the accident while he waited for help to come.
- She agonised with grief for days after her father died.
