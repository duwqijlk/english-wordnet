simpleMeaning: the quality of being happy and bright in a way that makes sad or dark feelings go away
scope: 'Also called cheer: a happy, bright quality that lifts the mood, not good weather for being outdoors.'
examples:
- Her sunshine lifted the mood in the quiet room.
- He brought sunshine to the team with his jokes and kind words.
