simpleMeaning: 'Down the middle of the body runs a set of bones: the skull, the spine, the breastbone
  and the ribs.'
scope: The skull, the spine, the breastbone and the ribs belong to this set of bones.
examples:
- The axial skeleton includes the skull and the ribs.
- The spine and the breastbone are part of the axial skeleton.
