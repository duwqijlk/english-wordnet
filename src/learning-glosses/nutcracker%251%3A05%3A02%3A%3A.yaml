simpleMeaning: any of several kinds of small singing birds with a short tail, strong feet and a sharp
  beak, that eat small nuts and insects
scope: 'Also called nuthatch: a small singing bird with strong feet and a sharp beak, not the tool for
  cracking nuts and not the speckled bird that also eats nuts.'
examples:
- The nutcracker held on to the bark with its strong feet and used its sharp beak to pull out an insect.
- We watched a nutcracker use its sharp beak to pick an insect from the bark.
