simpleMeaning: a channel that carries fast-moving water, with the flow held back or let through by a gate
scope: A channel that carries fast-moving water, with the flow held back or let through by a gate, also
  called sluice and penstock; not an open ditch and not a pipe for still water.
examples:
- Water rushed down the sluiceway after the gate was opened.
- The mill's sluiceway carried water to the wheel.
