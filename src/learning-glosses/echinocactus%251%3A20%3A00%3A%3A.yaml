simpleMeaning: One of several kinds of cactus, with deep ribs and many sharp spines, from the southwestern
  United States to Brazil.
scope: People also call it barrel cactus; the name marks a cactus with deep ribs and many sharp spines,
  found from the southwestern United States to Brazil.
examples:
- The echinocactus is strongly ribbed and very spiny.
- Echinocactus grows from the southwestern United States to Brazil.
