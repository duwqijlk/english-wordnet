simpleMeaning: used by a speaker to stress, in an honest and open way, that what they say is truly so
scope: 'Also called honestly and frankly: a speaker uses it to stress that what they say is truly so;
  it does not name a person or a thing.'
examples:
- Candidly, I don't think the plan will work.
- Candidly, she has never liked the idea.
