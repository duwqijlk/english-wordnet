simpleMeaning: A person who helps other people to gather crops when the crops are ready
scope: A person who helps gather crops, not the farm machine that gathers a food crop from the fields.
examples:
- Extra harvesters were hired to help bring in the wheat before the rain.
- One harvester worked with his brother to gather the ripe corn by hand.
