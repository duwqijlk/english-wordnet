simpleMeaning: a small early sea worm with no rings on the outside of its body, much like the young of
  a bristle worm
scope: A small early sea worm with no rings on its body, not a worm with clear rings like an earthworm.
examples:
- The archiannelid moved through the sand without any rings on its body.
- Archiannelids look like the young of bristle worms.
