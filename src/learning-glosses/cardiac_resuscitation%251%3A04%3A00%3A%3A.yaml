simpleMeaning: Emergency chest compressions and artificial breathing for someone who has collapsed with
  no pulse and stopped breathing, given first to restart the heart, restore blood flow and prevent brain
  damage.
scope: This is another name for cardiopulmonary resuscitation and the kiss of life; it is not mouth-to-mouth
  breathing on its own.
examples:
- Paramedics began cardiac resuscitation within minutes of the collapse.
- The hospital trains all staff in cardiac resuscitation.
