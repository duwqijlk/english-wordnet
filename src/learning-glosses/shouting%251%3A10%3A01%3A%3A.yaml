simpleMeaning: A loud wordless cry, the kind someone makes from pain or excitement.
scope: A wordless cry of raw pain or excitement ('yelling' is another name), not the cheering that urges
  a team on.
examples:
- Sudden shouting from the kitchen told us he had dropped the hot pan.
- The children's shouting of excitement echoed through the house on Christmas morning.
