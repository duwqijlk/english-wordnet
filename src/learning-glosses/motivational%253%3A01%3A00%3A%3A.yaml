simpleMeaning: about the reason why a person wants to do something, or about what makes them want to do
  it
scope: Describes a thing linked to why a person wants to act; it is not the want itself, and not a prize
  or pay given for doing work.
examples:
- She studied the motivational reasons behind his choice to leave his job.
- Pay is only one motivational factor for many workers.
