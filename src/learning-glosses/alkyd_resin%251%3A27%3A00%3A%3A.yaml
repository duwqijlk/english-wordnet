simpleMeaning: A man-made sticky stuff that people use in paints and glues when they want the join to
  hold for good.
scope: Also called alkyd, the name covers the man-made stuff itself, in paint and in glue alike.
examples:
- The alkyd resin held the two boards fast.
- Alkyd resin paint covered the door with a lasting coat.
