simpleMeaning: A basil from tropical Asia, living one season or many, with aromatic leaves and spikes
  of small white flowers; a leading culinary herb in salads, casseroles, sauces and some liqueurs.
scope: The living plant grown as a kitchen herb, another name for sweet basil; not the harvested leaves
  sold as seasoning.
examples:
- Common basil grows well in a pot on a sunny windowsill.
- She tore common basil into the salad just before serving.
