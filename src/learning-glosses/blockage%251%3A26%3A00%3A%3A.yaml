schema: oewn-learning-gloss-v2
senseId: 'blockage%1:26:00::'
synsetId: 14531553-n
simpleMeaning: the state when a way through is filled or closed by something in the way
scope: This state, also called obstruction, is when a passage is filled or closed, not just one thing
  stuck in a pipe and not the act of closing it.
examples:
- The blockage of the road by fallen trees lasted for two days.
- A serious blockage kept air from moving through the passage.
