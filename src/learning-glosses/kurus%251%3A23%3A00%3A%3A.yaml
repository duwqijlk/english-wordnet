simpleMeaning: A unit of money in Turkey; one hundred of them make one lira
scope: Also called a piastre and a piaster, it is a unit of money in Turkey, worth one hundredth of a
  lira, not the lira itself and not a coin of another country.
examples:
- One hundred kurus make one lira.
- The kurus is a unit of money used in Turkey.
