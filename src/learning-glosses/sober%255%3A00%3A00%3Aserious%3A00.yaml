simpleMeaning: serious in a way that earns respect, not cheerful in manner or character, and firm about
  keeping promises
scope: 'Also called grave, and another name for this sense is solemn: serious and not cheerful, and firm
  about promises; not about being free from drink, and not dull in color.'
examples:
- He was a sober, serious man who always kept his promises.
- In her sober manner, she made a promise and kept it.
