simpleMeaning: A hairy plant with yellow flowers, from eastern Asia and North America.
scope: Also called yellow avens; a hairy yellow-flowered plant of eastern Asia and North America, set
  beside other yellow avens of Europe and the white-flowered geums.
examples:
- Geum macrophyllum grew beside the stream, its yellow flowers bright in June.
- The hairy leaves of Geum macrophyllum marked it out from other plants.
