simpleMeaning: In steel or iron that cools very slowly, the hard stuff called cementite may form round
  balls and not flat layers
scope: In steel or iron that cools very slowly, the hard stuff called cementite may form round balls and
  not flat layers; granular pearlite is another name for this sense, not cementite in flat layers and
  not hardened steel.
examples:
- Globular pearlite forms when steel cools slowly.
- The sample showed globular pearlite under the microscope.
