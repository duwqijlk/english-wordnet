simpleMeaning: A word with meaning of its own that narrows or shades the meaning of a noun or verb.
scope: A word that shades the meaning of a noun or verb, not a contestant who has qualified for the next
  round.
examples:
- In 'very hot', 'very' is a qualifier.
- Adjectives often act as qualifiers.
