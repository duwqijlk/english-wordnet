simpleMeaning: One side of the backbone, between the hip bone and the ribs, in people and in four-footed
  animals.
scope: One side of the backbone between the hip bone and the ribs, in people and four-footed animals;
  loin is another name for this sense, not the front of the body.
examples:
- Pain in the lumbus made it hard for him to bend.
- The vet pressed the horse's lumbus to check for soreness.
