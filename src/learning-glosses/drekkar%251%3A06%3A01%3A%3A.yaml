simpleMeaning: Men who went out to rob and attack sailed this long Viking ship, said in old written records
  to be graceful and richly adorned.
scope: This long Viking ship, graceful and richly adorned in old written records, carried men who went
  out to rob and attack.
examples:
- The drekkar's prow carried carvings of dragons and snakes.
- The drekkar set out with men who went raiding and plundering.
