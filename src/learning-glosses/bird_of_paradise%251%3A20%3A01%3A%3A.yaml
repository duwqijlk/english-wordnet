simpleMeaning: A show plant of warm South Africa and South America, with stalks of orange and purplish-blue
  blooms like a bird.
scope: A show plant of warm South Africa and South America, with stalks of orange and purplish-blue blooms
  like a bird, unlike the sense for any of many brightly colored feathered birds of the New Guinea area,
  and unlike the sense for a tropical flowering shrub having bright orange or red flowers, sometimes placed
  in genus Poinciana.
examples:
- Birds of paradise bloom orange in the garden.
- The bird of paradise bears orange blooms.
