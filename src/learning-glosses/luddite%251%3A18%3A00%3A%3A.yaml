simpleMeaning: One of the English workmen of the 1800s who smashed machines that saved labour, fearing
  they would take away jobs
scope: This is one of the machine-breaking workmen of the 1800s, not a worker who merely dislikes new
  machines and not a striker.
examples:
- The Luddite smashed the new loom.
- Luddites feared the machines would take their jobs.
