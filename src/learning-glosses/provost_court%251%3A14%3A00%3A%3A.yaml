simpleMeaning: In a place taken over in war, soldiers judge people said to have done small wrongs
scope: Soldiers judge people said to have done small wrongs in a place taken over in war; not a court
  for serious crimes and not a court in a free land.
examples:
- The provost court heard the case of the man accused of stealing food.
- In the occupied town, a provost court tried people for small wrongs.
