simpleMeaning: Usually from fear before sex or before a doctor looks inside, the muscles round the birth
  passage draw tight and shut it.
scope: This is a state in which the birth passage shuts because its muscles draw tight from fear.
examples:
- She had vaginismus, and the muscles closed before the doctor could look inside.
- Her vaginismus came on from fear before the examination.
