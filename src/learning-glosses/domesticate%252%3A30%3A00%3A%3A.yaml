senseId: 'domesticate%2:30:00::'
synsetId: 00302911-v
simpleMeaning: to take the wildness out of an animal and make it calm and easy to handle
scope: Also called tame and reclaim. This sense is about making a wild animal calm and easy to handle,
  not about making plants or animals fit for farming and daily use by people.
examples:
- People learned to domesticate wild horses thousands of years ago.
- It took years to domesticate the wild dogs that lived near the village.
