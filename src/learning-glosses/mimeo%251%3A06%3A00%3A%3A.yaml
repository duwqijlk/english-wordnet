simpleMeaning: Copies come off this turning machine, which presses ink through a cut sheet and is sold
  under the trade mark Roneo.
scope: Also called mimeograph and mimeograph machine, it turns round and presses ink through a cut sheet
  to make copies.
examples:
- The mimeo pressed ink through a cut sheet.
- Our mimeo makes copies one after another.
