simpleMeaning: of a person or their behaviour, too unreasonable or badly behaved to be accepted
scope: This describes a person's conduct as unacceptable, not something that cannot happen or be done.
examples:
- He becomes impossible when he is tired.
- The children were impossible at the restaurant, shouting and refusing to sit.
