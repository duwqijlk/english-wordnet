simpleMeaning: In the Church of England, a priest put in charge of a parish
scope: In the Church of England, a priest put in charge of a parish, not the Roman Catholic priest who
  acts for a higher priest and not the Episcopal priest in charge of a chapel.
examples:
- The vicar of the parish visited the sick.
- Our vicar leads the Sunday service.
