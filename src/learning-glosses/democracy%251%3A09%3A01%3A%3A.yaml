senseId: 'democracy%1:09:01::'
synsetId: 05973312-n
simpleMeaning: the rule that the larger part of a group can make choices that all members of the group
  must follow
scope: The rule that a majority can bind the whole group, not the wider view that people should rule themselves
  or choose their rulers.
examples:
- Under democracy, the majority vote decided the club's new rules.
- Democracy in the committee meant the larger side's choice bound everyone.
