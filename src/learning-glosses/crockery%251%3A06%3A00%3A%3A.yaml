simpleMeaning: plates, bowls, cups, and other dishes as a group, used for eating and serving food
scope: 'Also called dishware: plates and dishes as a group for eating and serving, not one single dish
  and not forks and knives for eating.'
examples:
- She washed all the crockery after dinner and put it back on the shelf.
- The shop sells crockery, including plates, bowls, and cups for the table.
