simpleMeaning: a plant with no stem, in tufts of thin blade-like leaves, with an upright cluster of tiny
  creamy white flowers; from the south-west United States and Mexico
scope: The stemless plant with tufts of blade-like leaves and an upright cluster of tiny creamy white
  flowers of the south-west United States and Mexico, not the yucca kinds of the west central or southern
  United States.
examples:
- Bear grass grows in tufts on the dry hills of the south-west.
- The bear grass sent up an upright cluster of tiny white flowers.
