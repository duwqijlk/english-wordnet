simpleMeaning: a tropical South American tree with a wide-spreading crown of twice-divided leaves and
  coiled fruits shaped like ears, grown for its timber, shade and ornament
scope: The timber and shade tree; not the Alocasia houseplant, also called elephant's ear, that is grown
  for its large leaves.
examples:
- The elephant's ear in the square throws a wide circle of shade in summer.
- Local carpenters cut elephant's ear for its valuable timber.
