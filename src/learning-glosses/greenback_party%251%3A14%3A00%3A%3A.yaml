simpleMeaning: A political group of the past in the United States, set up in 1874, that fought any cut
  in the paper money in use.
scope: A political group of the past in the United States, set up in 1874, that fought any cut in the
  paper money in use, set beside the Democrats and the Republicans of the same years.
examples:
- The Greenback Party was set up in 1874 to fight cuts in paper money.
- Members of the Greenback Party opposed any cut in the money in use.
