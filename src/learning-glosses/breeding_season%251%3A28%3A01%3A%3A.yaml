simpleMeaning: The time of year that suits animals best for having young, usually when conditions are
  good and food and water are plentiful.
scope: The time of year best for animals to have young; mating season is another name for this sense,
  not the time when the young are born and not the time animals move to new grounds.
examples:
- Birds return to the same lake each breeding season.
- The breeding season starts when food becomes plentiful.
