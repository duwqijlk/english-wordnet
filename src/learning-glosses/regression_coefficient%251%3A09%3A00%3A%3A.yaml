senseId: 'regression_coefficient%1:09:00::'
synsetId: 06038096-n
simpleMeaning: 'In statistics, the constant a in y = ax + b: the slope of the line, showing how much one
  variable changes when the other rises by one unit.'
scope: This is the slope number in a straight-line statistical model; it is not the correlation coefficient,
  which measures how closely two variables move together, and not the intercept b, where the line crosses
  the axis.
examples:
- The regression coefficient was 0.62, meaning each extra hour of study raised the score by 0.62 points.
- Researchers reported the regression coefficient together with a confidence interval.
