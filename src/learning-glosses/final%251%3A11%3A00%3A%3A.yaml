simpleMeaning: the last match in a competition, played by the two players or teams that won every earlier
  round.
scope: It is not an examination and not the last part of a story; it is the deciding match of a competition.
examples:
- Our team reached the final but lost on penalties.
- Tickets for the final sold out within an hour.
