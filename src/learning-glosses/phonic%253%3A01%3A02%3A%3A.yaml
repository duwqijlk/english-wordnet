senseId: 'phonic%3:01:02::'
synsetId: 03111095-a
simpleMeaning: about the way of teaching reading in which each letter or group of letters is linked to
  the sound it makes
scope: This is only about that one way of teaching reading by letter sounds, not about sound in general
  and not about other ways of teaching reading.
examples:
- The children used a phonic book that linked each letter to its sound.
- Her phonic lessons helped the class read new words by their sounds.
