simpleMeaning: A wedding between a royal or noble-born one and a lower-ranked one, lawful, the lower rank
  stands and young take no titles or goods from the higher one.
scope: In marriages, this sense is also called left-handed, for a wedding between a royal or noble-born
  one and a lower-ranked one, lawful, the lower rank stands and young take no titles or goods from the
  higher one.
examples:
- The marriage was morganatic, keeping ranks apart.
- Their marriage was morganatic, so the children took no titles.
