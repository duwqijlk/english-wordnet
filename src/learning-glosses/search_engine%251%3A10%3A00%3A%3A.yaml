simpleMeaning: a computer program that finds and brings back papers, files or data from a store of facts
  or from a computer network, especially from the internet
scope: A computer program that finds papers, files or data on a network; not a web browser and not a person
  who looks things up.
examples:
- I typed the words into the search engine and got a list of pages.
- The search engine found the file in seconds.
