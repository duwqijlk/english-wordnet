simpleMeaning: a sound heard again after bouncing back off a surface
scope: 'Another name for reverberation, replication and sound reflection: a sound repeated after its waves
  bounce back, not a reflected broadcast beam or a mere imitation.'
examples:
- We heard the echo of our voices across the valley.
- The cave returned a faint echo of every step.
