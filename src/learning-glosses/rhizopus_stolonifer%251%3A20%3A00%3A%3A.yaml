simpleMeaning: A fungus that makes soft watery rot in fruits and vegetables and rings of dry rot round
  the roots of sweet potatoes.
scope: A fungus that rots fruit and vegetables and makes rings of dry rot on sweet potato roots; also
  called leak fungus and ring rot fungus.
examples:
- Rhizopus stolonifer rotted the strawberries in the box.
- Sweet potatoes with rings of dry rot may carry Rhizopus stolonifer.
