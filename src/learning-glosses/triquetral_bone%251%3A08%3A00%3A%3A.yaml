simpleMeaning: Where the hand meets the arm, this bone joins the pisiform, the hamate, and the lunate.
scope: Also called triquetral, cuneiform bone, os triquetrum, and pyramidal bone, it is the wrist bone
  that joins the pisiform, the hamate, and the lunate.
examples:
- The triquetral bone in the wrist was bruised in the fall.
- The scan showed the triquetral bone joining the pisiform and the hamate.
