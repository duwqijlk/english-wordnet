simpleMeaning: a loose coat worn over other clothes, most often made of rich, costly cloth
scope: A loose outer coat, most often of rich cloth, not the tunic worn over a knight's armour.
examples:
- She threw a surcoat over her dress before going out.
- His surcoat was trimmed with fur.
