simpleMeaning: Reddish-violet skins cover this flat, mild onion, which is added to hamburgers and salads
  to make them look good.
scope: Also called red onion, this is a flat, mild onion with reddish-violet skins, served as a garnish
  on hamburgers and salads.
examples:
- A purple onion lay sliced thin on the hamburger.
- A purple onion in the salad had reddish-violet skins.
