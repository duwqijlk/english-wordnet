simpleMeaning: the whole side of a ship, from its front to its back
scope: The side of a ship itself, not the guns fired from that side and not a printed sheet used as an
  advertisement.
examples:
- The broadside of the ship faced the dock.
- Barnacles covered the broadside below the water line.
