simpleMeaning: A swelling of a woman's inner sex organs, mainly the egg tubes, from germs, chiefly gonorrhea
  or chlamydia, with belly pain, fever, and bad-smelling vaginal discharge.
scope: A swelling of a woman's inner sex organs from germs, also called pelvic inflammatory disease; not
  a swelling of the womb alone and not a single germ.
examples:
- PID can cause belly pain.
- The doctor treated her PID with drugs.
