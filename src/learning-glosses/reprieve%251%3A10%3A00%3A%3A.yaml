simpleMeaning: a written order that puts something off, usually the killing of a person sentenced to death
scope: A written order that puts something off, usually the killing of a person sentenced to death; not
  the act of putting off a punishment in general, not a short rest from harm, and not the verb sense of
  putting off a punishment.
examples:
- The governor signed a reprieve for the prisoner.
- A last-minute reprieve saved him from the gallows.
