simpleMeaning: A plant from Europe and Asia, used as a medicine, with white flowers and soft, feathery
  leaves that smell like apples; some lists put it in the group (genus) Anthemis
scope: 'Also called camomile: this is the living plant itself, not a drink or a medicine made from its
  flowers.'
examples:
- Chamomile grows wild in the fields near her home.
- The garden has chamomile with small white flowers.
