simpleMeaning: This loose cover-all or smock goes on over everyday clothes to keep them clean while doing
  dirty work.
scope: This is a loose cover-all worn over everyday clothes for dirty work, also called overall and boilersuit,
  not a tight-fitting garment and not one worn under other clothes.
examples:
- He pulled on a boilers suit before starting the dirty work.
- The boilers suit kept her everyday clothes clean.
