simpleMeaning: In computer science, a memory chip that can only be read in normal use, which can be wiped
  clean with light you cannot see and filled again with new data
scope: In computer science this is a memory chip for reading only, which can be wiped clean with light
  you cannot see and filled again with new data; erasable programmable read-only memory is another name
  for this sense, and its nearest rival is a chip that can be written to in normal use.
examples:
- The EPROM was erased with ultraviolet light.
- They programmed the EPROM again with new data.
