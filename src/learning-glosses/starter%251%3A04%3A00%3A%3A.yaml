simpleMeaning: A mix of yeast or bacteria that starts the souring or fermenting that makes butter, cheese,
  or dough
scope: A living mix that starts souring or fermenting, not the first course of a meal, not the tool, and
  not the motor that starts an engine.
examples:
- She keeps a starter in a jar on the kitchen shelf.
- Add a spoonful of starter to the dough and leave it overnight.
