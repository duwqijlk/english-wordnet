simpleMeaning: steps taken ahead of time to stop stealing, spying, or damage done on purpose, and other
  such acts
scope: This is steps taken ahead of time to stop stealing, spying, or damage; security is another name
  for this sense. Not the feeling of being safe and not a single lock or alarm on its own.
examples:
- The museum put new security measures in place after the theft.
- Security measures at the airport now include checks on every bag.
