simpleMeaning: having little patience left and feeling angry
scope: 'Also called annoyed, irritated, stung, pissed, steamed, riled, roiled, miffed, and nettled: having
  little patience and feeling angry, not just sad or tired.'
examples:
- He was peeved about being left out of the game.
- She felt peeved when her brother took her book.
