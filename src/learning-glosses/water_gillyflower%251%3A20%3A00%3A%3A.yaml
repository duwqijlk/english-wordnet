simpleMeaning: Soft swollen bloom stalks full of tiny holes under the surface, topped with white blooms,
  mark this featherfoil, a plant with fine feathery leaves, of the eastern United States.
scope: This featherfoil grows in the eastern United States, and its soft swollen bloom stalks under the
  surface and white blooms tell it from other featherfoils.
examples:
- The water gillyflower in the pond was in bloom.
- We found water gillyflower with its stalks under the surface.
