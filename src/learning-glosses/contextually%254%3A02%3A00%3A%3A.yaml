simpleMeaning: in a way that depends on the words around it and on the situation it is in
scope: In a way that depends on the words around a thing and the situation it is in, not in a way that
  has the same meaning on its own in every situation.
examples:
- The word must be understood contextually, not on its own.
- Contextually, 'fine' is a happy answer here, because of the good news that came just before it.
