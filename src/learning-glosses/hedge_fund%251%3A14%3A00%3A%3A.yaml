simpleMeaning: A money company with changeable plans, for a few backers usually with a million dollars
  or more, may sell borrowed shares and borrow much, risky ways barred to savings plans.
scope: A money company with plans it can change, for a few big backers, also called hedgefund; not a common
  savings plan and not a bank.
examples:
- The hedge fund used risky ways to make money for a few big backers.
- Big backers usually put in a million dollars or more to join a hedge fund.
