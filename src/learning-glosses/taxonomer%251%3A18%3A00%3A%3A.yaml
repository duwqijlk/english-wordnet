simpleMeaning: a scientist who studies living things and sorts them into groups by how they are built,
  where they come from, and how they act
scope: 'Also called a taxonomist and a systematist: a scientist who sorts living things into groups, not
  a scientist who studies only one kind of animal and not a person who sorts books or papers.'
examples:
- The taxonomer spent years sorting the new frogs into groups.
- As a taxonomer, she groups plants by how they are built.
