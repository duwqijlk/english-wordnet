simpleMeaning: In physics, the pull between two bits of matter grows in step with their masses multiplied
  together and falls off with the square of the gap between them.
scope: Theory of gravitation and theory of gravity are other names for this physics idea about the pull
  between bits of matter.
examples:
- The gravitational theory says the moon stays in orbit because the earth pulls on it.
- Under the gravitational theory, two apples pull at each other.
