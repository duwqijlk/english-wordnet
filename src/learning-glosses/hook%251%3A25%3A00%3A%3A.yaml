simpleMeaning: a sharp curve or bend, or a shape that has that curve
scope: This is a shape or a sharp bend in something, not a curved tool for holding things and not a shot
  in golf or basketball.
examples:
- The river makes a sharp hook as it turns around the hill.
- The letter J has a small hook at the bottom.
