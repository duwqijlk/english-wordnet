simpleMeaning: to think step by step from facts you know, and to work out in this way that something is
  true
scope: 'Also called derive, deduce and infer: working out what is true by thinking from known facts, not
  taking money away from a payment.'
examples:
- From these clues, she deducted that the door had been left open.
- He deducted the answer by thinking through each fact in turn.
