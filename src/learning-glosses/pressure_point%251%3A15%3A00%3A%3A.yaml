simpleMeaning: Any of a few spots on the body where the beat of the blood can be felt and where pressing
  on a blood tube below stops blood loss farther down
scope: This is any of a few spots on the body where the beat of the blood can be felt and where pressing
  on a blood tube below stops blood loss farther down, not a sore spot and not a place where a needle
  goes in.
examples:
- The nurse pressed a pressure point to stop the bleeding.
- A pressure point lets you feel the beat of the blood.
