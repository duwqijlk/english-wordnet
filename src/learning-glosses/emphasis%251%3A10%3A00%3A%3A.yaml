simpleMeaning: how much a part of a word or a musical note stands out, most of all in how hard or high
  it sounds
scope: 'Also called stress and accent: how much a part of a word or a musical note stands out, not how
  strongly something is said and not stress given by placing a word in a special place.'
examples:
- He put the emphasis on the wrong syllable.
- In the song, the emphasis falls on the first note of each line.
