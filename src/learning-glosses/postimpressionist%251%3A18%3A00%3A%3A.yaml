simpleMeaning: This artist belonged to that school, after breaking with the older way of painting.
scope: Also called Post-impressionist; this artist belonged to that school after breaking with the older
  way of painting, not one who kept the older way and not a painter of everyday scenes.
examples:
- The Postimpressionist broke with the older painters.
- After years with the older school, she painted as a Postimpressionist.
