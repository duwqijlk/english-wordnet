simpleMeaning: In basketball, a shot thrown over the head with the hand that is farther from the basket
scope: This is a shot in basketball, not a shot in golf that curves left and not a curved tool for holding
  things.
examples:
- He jumped and made a hook shot over his head, using the hand farther from the basket.
- Her hook, thrown over her head with her far hand, went into the basket.
