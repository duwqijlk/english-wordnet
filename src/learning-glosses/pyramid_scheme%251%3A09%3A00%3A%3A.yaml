senseId: 'pyramid_scheme%1:09:00::'
synsetId: 05916594-n
simpleMeaning: A dishonest money-making plan where new members pay their recruiters, expecting money from
  people they enroll; once recruitment slows it fails and most lose what they paid.
scope: A fraudulent recruitment-based money plan, not a lawful company hierarchy or a genuine sales business.
examples:
- She lost her savings after being drawn into a pyramid scheme that promised huge returns.
- Regulators warned that the investment club was a pyramid scheme, with older members paid by newer ones.
