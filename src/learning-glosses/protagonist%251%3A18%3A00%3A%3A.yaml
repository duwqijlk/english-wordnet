simpleMeaning: a person who gives help and support to a politician, a team, or others like them
scope: 'Also called friend, champion, admirer, supporter, and booster: a person who backs a politician
  or a team, not the main person in a story or play.'
examples:
- As a loyal protagonist of the mayor, he spoke for him at every meeting.
- The team's protagonists paid for new shirts for all the players.
