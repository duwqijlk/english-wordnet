simpleMeaning: Any of a group of carbohydrates whose tiny parts are long chains of single sugar units
scope: Any of a group of carbohydrates whose tiny parts are long chains of single sugar units; polyose
  is another name for this sense, not a single sugar unit and not a fat or a protein.
examples:
- Cellulose is a polysaccharide in plant walls.
- The polysaccharide broke down into single sugar units.
