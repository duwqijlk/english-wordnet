simpleMeaning: having to do with how big a thing is and how it is measured, in length, width, and height
scope: About the size of a thing as measured, not about the depth or richness of a person or character.
examples:
- The dimensional limits of the box decide what can fit inside it.
- Engineers checked the dimensional drawings before they built the part.
