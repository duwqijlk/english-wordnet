simpleMeaning: A hard blow that leaves the other boxer unable to go on fighting.
scope: A hard blow that leaves the other boxer unable to go on fighting; haymaker is another name for
  this sense, not a light tap and not a blow below the belt.
examples:
- The knockout punch ended the fight in the third round.
- He won with a single knockout punch.
