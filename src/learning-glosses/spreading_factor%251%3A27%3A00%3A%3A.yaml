simpleMeaning: An enzyme, sold as Hyazyme, that breaks down hyaluronic acid and makes it less thick, so
  connective tissue lets fluids pass through more easily and absorbs them better.
scope: Another name for hyaluronidase, the enzyme sold as Hyazyme; it is not a growth factor that makes
  cells divide, nor a clotting factor in blood.
examples:
- The lab added spreading factor to the tissue sample and watched the fluid spread faster.
- Spreading factor breaks down hyaluronic acid, so connective tissue becomes more permeable.
