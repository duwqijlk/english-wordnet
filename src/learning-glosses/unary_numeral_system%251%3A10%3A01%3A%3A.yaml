senseId: 'unary_numeral_system%1:10:01::'
synsetId: 92442082-n
simpleMeaning: a way of writing a number by repeating one chosen mark, the mark for 1, as many times as
  the number, with just one writing for each number
scope: Not the tens system or the twos system; also called unary.
examples:
- A unary numeral system writes seven as seven strokes.
- The teacher showed how a unary numeral system works with tally marks.
