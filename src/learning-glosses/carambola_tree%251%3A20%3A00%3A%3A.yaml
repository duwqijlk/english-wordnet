simpleMeaning: A woody plant from the East Indies that bears fruit with deep ridges, yellow-brown in colour.
scope: A woody plant from the East Indies that bears fruit with deep ridges, yellow-brown in colour; carambola
  is another name for this sense, not the fruit itself and not a citrus tree.
examples:
- The carambola tree grows in the warm garden.
- A carambola tree bears fruit with deep ridges.
