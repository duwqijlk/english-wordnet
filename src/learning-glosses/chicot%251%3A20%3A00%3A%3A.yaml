simpleMeaning: Large leaves split twice over, green-white flowers, and large brown woody pods with seeds
  that stand in for coffee mark this handsome tree of central and east North America.
scope: Also called bonduc, it is a tree with large twice-split leaves and large brown woody pods, whose
  seeds stand in for coffee.
examples:
- The chicot had brown woody pods.
- Chicot seeds can stand in for coffee.
