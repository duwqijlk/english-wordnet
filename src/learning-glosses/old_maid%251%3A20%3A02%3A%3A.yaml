simpleMeaning: Gardeners grow this plant for the heads of bright blooms it bears, in many colours, one
  of many kinds in the group called Zinnia.
scope: Also called old maid flower and zinnia, this plant is grown by gardeners for heads of bright blooms,
  not the woody herb with large pinkish to red flowers that shares its name.
examples:
- The old maid bore heads of bright blooms in many colours.
- Many kinds of old maid grow for their bright blooms.
