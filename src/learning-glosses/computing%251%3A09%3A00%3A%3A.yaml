simpleMeaning: the part of engineering that studies, with the help of computers, processes and structures
  that can be worked out by a computer
scope: The part of engineering that studies what can be worked out with computers; not the act of working
  out an answer.
examples:
- She studied computing at university.
- Computing covers what computers can and cannot do.
