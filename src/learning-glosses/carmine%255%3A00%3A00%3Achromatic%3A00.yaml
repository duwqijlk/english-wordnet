simpleMeaning: of a color at one end of the range of colors, next to orange, like the color of blood,
  cherries, tomatoes or rubies
scope: Also called red, scarlet, crimson, ruby, cherry, reddish, ruddy, cerise, blood-red, cherry-red
  and ruby-red. It is the color word for a red like blood or cherries, not the noun name for that color
  or the verb to color something that color.
examples:
- She wore a carmine dress to the party.
- The carmine curtains were a bright, deep red.
