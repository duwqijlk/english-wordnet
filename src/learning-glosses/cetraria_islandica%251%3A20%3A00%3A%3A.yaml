simpleMeaning: A lichen with a branched flat partly upright body, growing in mountain and Arctic lands;
  used as medicine or food for people and farm animals, and a source of glycerol.
scope: 'Also called Iceland lichen and Iceland moss: a lichen, not a moss, and not a plant.'
examples:
- Cetraria islandica grew on the mountain rocks.
- People once ate Cetraria islandica as food.
