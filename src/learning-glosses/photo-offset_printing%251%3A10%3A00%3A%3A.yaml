simpleMeaning: Plates made with light pass ink to paper by way of a middle surface in this way of making
  copies
scope: A way of making copies, also called photo-offset, not the plates themselves and not printing done
  straight from a plate onto paper.
examples:
- The book was made by photo-offset printing.
- Photo-offset printing uses plates made with light.
