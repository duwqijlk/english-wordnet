simpleMeaning: Rubbing or acid makes the face of this clear hard stuff rough, so it spreads light softly
scope: This clear hard stuff spreads light softly because its face is rough, not a smooth piece that lets
  light through clear and not a mirror.
examples:
- The ground glass softened the light from the lamp.
- She held the ground glass up to the window to see how it spread the light.
