simpleMeaning: making people feel strong dislike or anger toward someone or something
scope: This means causing strong dislike or anger in others, not just showing dislike yourself, and not
  drugs or muscles working against each other.
examples:
- His rude tone was antagonistic and made the crowd angry.
- The speech had an antagonistic effect, turning listeners against the plan.
