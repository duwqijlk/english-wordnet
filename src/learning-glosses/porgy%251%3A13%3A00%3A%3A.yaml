simpleMeaning: Lean meat from a fish of the warm seas off the south-east coast of the United States
scope: The lean meat of a fish found off the south-east coast of the United States, not the fish itself
  and not the meat of a fish from cold waters.
examples:
- We ate porgy for dinner, served with rice.
- The fishmonger sold fresh porgy that morning.
