simpleMeaning: It gives a sense that what a person takes in is wider and sharper, from drugs that make
  them see and hear things that are not there
scope: It gives a wider, stronger sense of things, from drugs that cause false sights and sounds; not
  a mild change in mood like mind-altering, and not strong false sights like mind-bending.
examples:
- The mind-expanding drug made her feel at one with the world.
- He said the mind-expanding tea opened his senses to new colours.
