simpleMeaning: An electric part that fits into the top of a fuel-burning engine and lights the fuel gas
  with a small flash of power
scope: An electric part that fits into the top of a fuel-burning engine and lights the fuel gas; plug
  and sparking plug are other names for it, not a battery and not a fuel pipe.
examples:
- The spark plug in the engine lights the fuel gas with a small flash.
- A worn spark plug can stop the engine from starting.
