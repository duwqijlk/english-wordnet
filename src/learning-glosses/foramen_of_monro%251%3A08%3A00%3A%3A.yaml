simpleMeaning: A small opening on each side that joins the third hollow space deep in the brain to the
  side hollow spaces in the brain's large halves.
scope: 'Also called the interventricular foramen and Monro''s foramen: a small opening on each side joining
  two hollow spaces in the brain, not a larger opening in the brain.'
examples:
- The foramen of Monro joins two hollow spaces in the brain.
- The foramen of Monro is a small opening on both sides of the brain.
