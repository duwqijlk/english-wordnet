simpleMeaning: In computing, a list on a hard or floppy disk tells where each piece of stored information
  sits, and also where the parts that cannot be used are.
scope: In computing, this list on a hard or floppy disk keeps track of where each piece of stored information
  sits, and of the parts that cannot be used.
examples:
- The file allocation table told the computer where the photo was stored.
- A damaged file allocation table can make files hard to find.
