simpleMeaning: A one-year European plant with spikes of greenish flowers and leaves white and hairy underneath,
  common as a weed in North America.
scope: Also called oak-leaved goosefoot and oakleaf goosefoot, this one-year European plant is known by
  its spikes of greenish flowers and its white, hairy leaf undersides, and is common as a weed in North
  America, among other goosefoots and other weedy plants.
examples:
- Chenopodium glaucum is a one-year European plant.
- Chenopodium glaucum is common as a weed in North America.
