simpleMeaning: to be a sign or proof that something is true, through facts or through the way someone
  acts.
scope: It is not speaking as a witness in court; it means being a sign or proof of something.
examples:
- His calm manner evidenced a confidence he did not really feel.
- The results evidence a clear link between the two groups.
