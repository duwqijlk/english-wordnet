simpleMeaning: With tough bendy branches, soft bark that bends, and small yellow flowers, this bush of
  the east of North America loses its leaves in the cold months.
scope: Also called moose-wood, moosewood, ropebark and wicopy, this bush of the east of North America
  has tough bendy branches, not the southern kind with white blooms and orange and red leaves.
examples:
- In the cold months the leatherwood stood bare of leaves.
- The leatherwood bore small yellow flowers.
