simpleMeaning: Having a stem or stems, or having a stem of a kind that is named; often used with another
  word before it
scope: This describes a thing that has a stem, such as a glass or a flower; it is not the plant part itself.
examples:
- She bought a bunch of long-stemmed roses.
- The stemmed glasses stood in a row on the table.
