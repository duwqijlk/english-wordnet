simpleMeaning: a Japan ruler with full power, from a ruling family, who led the army; such rule ended
  in 1867-68, in a revolution, a sudden change of ruler
scope: The army ruler who held real power in Japan in past times, not the emperor and not a present-day
  leader of Japan.
examples:
- The shogun ruled Japan from his castle.
- A new shogun took power after his father died.
