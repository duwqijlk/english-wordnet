senseId: 'toxic_shock_syndrome%1:26:00::'
synsetId: 14493728-n
simpleMeaning: a severe condition caused by a sudden staphylococcus infection, with fever, loose stools,
  nausea, reddened skin and dangerously low blood pressure, mostly in women using highly absorbent tampons
  while menstruating
scope: The illness also called toxic shock; not a separate disease, and not the general meaning of shock
  after an injury or blood loss.
examples:
- Toxic shock syndrome is rare but dangerous, so change tampons often.
- He was diagnosed with toxic shock syndrome after a staph infection.
