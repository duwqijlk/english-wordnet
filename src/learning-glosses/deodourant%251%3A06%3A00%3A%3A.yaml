simpleMeaning: a body product put on the skin to hide bad smells
scope: This is a body product put on the skin to hide bad smells, also called deodorant, and not a perfume,
  which is meant to add a pleasant smell, and not a soap, which cleans the skin.
examples:
- He put deodourant on before going out.
- This deodourant hides the smell of sweat all day.
