simpleMeaning: A thin flow of air-like matter and charged bits that streams from the sun and makes the
  solar wind.
scope: A thin flow of air-like matter and charged bits that streams from the sun and makes the solar wind;
  not the air around the earth and not the stuff between the stars.
examples:
- Interplanetary gas streams from the sun.
- The probe flew through interplanetary gas on its way out.
