simpleMeaning: to yield to pulling and end up longer
scope: This is the intransitive sense of something getting longer under a pull, not the transitive act
  of pulling something longer and not spreading it out to full length.
examples:
- The fabric stretches when you pull it.
- These jeans stretch a little after a few hours.
