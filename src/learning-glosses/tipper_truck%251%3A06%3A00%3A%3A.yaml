simpleMeaning: Its load runs off by its own weight when air lifts the front of the flat bed, so no one
  has to touch the load to empty the lorry.
scope: Also called a tipper, a dump truck, a dumper, a tip truck and a tipper lorry, this lorry's load
  runs off by its own weight when air lifts the front of its bed.
examples:
- The tipper truck tipped its bed and the sand poured out.
- Tipper trucks queued at the building site all morning.
