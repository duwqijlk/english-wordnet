simpleMeaning: A machine with a platform or cage that moves up and down mechanically inside a vertical
  shaft, carrying people between floors of a building.
scope: The elevator in a building, not the powered carrier that takes skiers up a slope nor the insert
  that adds height inside a shoe.
examples:
- Take the lift to the fifth floor; the stairs are roped off.
- The lift was out of order, so we walked up all ten flights.
