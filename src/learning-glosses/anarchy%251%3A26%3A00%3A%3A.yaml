simpleMeaning: a state where there is no law or order, usually because the government has failed
scope: 'Also called lawlessness: a whole place with no working law or order, not just one person breaking
  a rule or one noisy crowd.'
examples:
- After the government fell, the country sank into anarchy.
- With no police and no courts, the town was close to anarchy.
