simpleMeaning: a large wild cat that lives in the forests of most of Asia, with light brown hair and black
  lines on it, and now in danger of dying out
scope: The large wild cat of Asia with black lines on light brown hair, not another big cat without those
  lines and not a fierce person.
examples:
- A tiger moved quietly through the forest in Asia.
- The tiger's black lines help it hide among the trees.
