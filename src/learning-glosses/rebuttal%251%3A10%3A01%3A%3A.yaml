senseId: 'rebuttal%1:10:01::'
synsetId: 06574984-n
simpleMeaning: In law, a written answer the person who is sued gives to the court after the person who
  started the case has replied again
scope: In law, a court paper from the person being sued. Not a spoken answer in a general argument.
examples:
- The lawyer filed a rebuttal in court to answer the plaintiff's last paper.
- The court read the rebuttal that the defendant sent in reply.
