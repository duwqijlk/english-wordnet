simpleMeaning: A North American woodland plant with a white spring flower and a lobed leaf; its bitter
  root and red sap cause vomiting; the root was a stimulant and chest remedy.
scope: A white-flowered woodland plant with red sap and a medicinal root, not any other low spring flower.
examples:
- Bloodroot opens its single white flower before the trees leaf out.
- Bloodroot sap leaves a red stain on the skin.
