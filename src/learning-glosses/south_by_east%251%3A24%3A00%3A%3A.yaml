simpleMeaning: the point on a compass one step to the right of the straight-down point
scope: One step to the right of the straight-down point on a compass; not one step to the left and not
  halfway between the lower and right sides.
examples:
- The ship steered south by east after the storm.
- South by east is one point from due south.
