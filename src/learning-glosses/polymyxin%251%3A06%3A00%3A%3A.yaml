simpleMeaning: one of a group of drugs that kill germs and can harm the body, made from a certain germ
  that lives in soil
scope: This is one of several germ-killing drugs from a certain soil germ that can harm the body, not
  one single drug on its own.
examples:
- The doctor used polymyxin to kill the germs in the wound.
- Polymyxin comes from a soil germ, so doctors use it with care because it can harm the body.
