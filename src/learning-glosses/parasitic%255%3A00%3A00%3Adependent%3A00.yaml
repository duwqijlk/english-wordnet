simpleMeaning: of a plant or a person, living off another living thing and taking food or other things
  it needs from that thing
scope: 'Also called bloodsucking and parasitical: a plant or person that lives off another living thing.
  Not the sense that means about or caused by parasites, the small living things that live on or in a
  body.'
examples:
- Parasitic vines took food from the tree and hurt it.
- He lived a parasitic life, taking money from his family and giving nothing back.
