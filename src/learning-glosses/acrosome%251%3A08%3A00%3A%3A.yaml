simpleMeaning: enzymes, chemicals that speed up work in the body, are made by a small part at the front
  of a sperm cell to help it get into the egg
scope: This is the part of a sperm cell that makes enzymes, chemicals that speed up work in the body,
  and so lets the cell get into the egg.
examples:
- The acrosome did its work, and the sperm cell got into the egg.
- The acrosome makes the enzymes a sperm cell needs to get into an egg.
