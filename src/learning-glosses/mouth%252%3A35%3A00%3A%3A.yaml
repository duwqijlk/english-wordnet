simpleMeaning: to touch something with the lips or tongue.
scope: This is not forming words silently, and not biting or eating; it means pressing the lips or tongue
  against something.
examples:
- The puppy mouthed the soft toy without chewing it.
- Babies often mouth objects to learn how they feel.
