simpleMeaning: To place or arrange a number of things or people inside something.
scope: This is the sense of putting a number of things or people into a space, not the adjective for meeting
  standards, not the adjective for being ready or inclined, not the adjective for being healthy, not the
  noun for a show of bad temper, not the noun for a sudden attack that cannot be controlled, not the noun
  for the way a garment sits on the body, not the noun for a short burst of activity, not the verb sense
  for details agreeing or matching, not the verb sense for being acceptable to someone, not the verb sense
  for being the right size or shape, not the verb sense for making something the right size, not the verb
  sense for following a particular shape or size, not the verb sense for supplying something for a purpose,
  not the verb sense for meeting a need or condition, and not the verb sense for bringing things into
  harmony.
examples:
- We managed to fit six chairs into the small room.
- The staff fit five more guests into the crowded hall.
