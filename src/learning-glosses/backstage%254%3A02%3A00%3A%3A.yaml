simpleMeaning: on the far side of the stage from the audience, in the part of the theatre behind it
scope: Behind the stage in a theatre, not out on the stage itself and not in the seats where the audience
  sits.
examples:
- Costumes were changed backstage.
- The actors waited backstage for their cue.
