simpleMeaning: a sweet food like jam, made from the soft inside part and the outer skin of citrus fruits,
  such as oranges and lemons
scope: This is a sweet food like jam, made from the soft inside part and the outer skin of citrus fruits
  such as oranges and lemons. It is not a jam made from other fruits with no skin in it.
examples:
- She spread orange marmalade thickly on her toast.
- This marmalade is made from lemons, with bits of skin in it.
