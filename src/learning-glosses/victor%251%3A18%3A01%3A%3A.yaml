simpleMeaning: a person who fights and can beat the people they fight against
scope: Also called master and superior. This is a fighter who beats others in a fight, not just a person
  who wins a game, a race, or an argument.
examples:
- The victor stood over his beaten rival after the fight.
- She was named the victor after defeating every fighter in the contest.
