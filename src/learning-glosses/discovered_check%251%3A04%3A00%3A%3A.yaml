simpleMeaning: an attack on the other side's king that comes when a piece moves away and lets a queen,
  rook, or bishop strike
scope: An attack on the other side's king made by moving a piece out of the way, and not an attack made
  by the piece that moves and not a move that ends the game.
examples:
- He won the queen with a discovered check after moving his knight away.
- Her discovered check came when she moved the pawn and the rook's line opened.
