simpleMeaning: a thing in the sky whose nature no one knows, seen as if moving through the air, most of
  all ones thought to come from another world
scope: A thing in the sky that no one can name, not a plane and not a star.
examples:
- Some people say they saw a flying saucer over the town.
- The flying saucer in the film came from another planet.
