simpleMeaning: to speak in support of a person or idea and give reasons why you support them
scope: This means to speak for a person or idea, not to fight off an attack and not to be a lawyer in
  court.
examples:
- She defended her friend when others said he had lied.
- He defended the new plan in front of the whole group.
