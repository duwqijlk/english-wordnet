simpleMeaning: a woman's piece of clothing that leaves the shoulders bare and is held up without bands
  over the shoulders
scope: A woman's garment that leaves the shoulders bare, not the word for anything in general that has
  no straps.
examples:
- She chose a strapless for the dance, and her shoulders were bare.
- The strapless stayed up with nothing over her shoulders.
