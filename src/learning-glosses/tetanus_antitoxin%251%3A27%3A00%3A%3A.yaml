simpleMeaning: A substance that guards against lockjaw for a short time after a possible contact with
  the germ that causes it
scope: This is a short-term shield against lockjaw given after a possible contact with the germ; not a
  vaccine for lasting protection and not a drug that kills germs.
examples:
- The doctor gave him tetanus antitoxin after the rusty nail cut his foot.
- Tetanus antitoxin gives short-term protection after a possible contact with the germ.
