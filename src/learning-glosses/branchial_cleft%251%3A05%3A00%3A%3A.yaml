simpleMeaning: Through which water passes, one of a row of narrow openings in the throats of fishes and
  of frogs and their kin that live in water
scope: Also called gill cleft and gill slit, this opening sits in a row in the throats of fishes and of
  frogs and their kin that live in water, and water passes through it.
examples:
- Water passed through the branchial clefts of the fish.
- The branchial clefts let water pass through the throat of the fish.
