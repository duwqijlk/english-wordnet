simpleMeaning: A group that takes part in the running of a country, in Australia, Canada, and other nations,
  and in Great Britain in the past.
scope: A group that takes part in the running of a country in Australia, Canada, and other nations, and
  in Great Britain in the past, not a group of some other country.
examples:
- She joined the Liberal Party in Australia.
- The Liberal Party won seats in Canada.
