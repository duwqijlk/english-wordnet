simpleMeaning: a design or figure of shapes or colours that come again and again, as in the design of
  buildings or in making things look good
scope: This is a pattern of shapes or colours for a building or for making things look good, not a reason
  for doing something and not a repeated part in music.
examples:
- The tiles show a flower motive that comes again and again across the wall.
- She chose a simple motive of blue shapes for the cloth.
