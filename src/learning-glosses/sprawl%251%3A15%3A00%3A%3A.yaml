simpleMeaning: a wide area of towns and city parts that have joined together, with no gaps between them
scope: A joined-up area of towns and city parts; not the act of sitting or lying with your arms and legs
  spread out wide.
examples:
- Urban sprawl keeps growing as new houses are built beyond the city.
- From the plane we could see the sprawl of small towns stretching along the coast.
