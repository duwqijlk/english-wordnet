simpleMeaning: A shrub that keeps its leaves all year, with tough leaves that feel like leather.
scope: Also called bog bilberry, bog whortleberry and moor berry, this is a shrub that keeps its leaves
  all year, not a shrub that loses its leaves in winter and not a tree.
examples:
- The Vaccinium uliginosum alpinum kept its leaves through the cold winter.
- We brushed past a Vaccinium uliginosum alpinum with tough leaves on the hill.
