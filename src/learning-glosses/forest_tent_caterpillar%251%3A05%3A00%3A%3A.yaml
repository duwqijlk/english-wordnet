simpleMeaning: the young of a North American moth that lives in groups and spins a flat carpet-like web;
  it badly strips leaves off trees that lose them in winter
scope: The young of a North American moth, not the adult moth and not the web itself.
examples:
- Forest tent caterpillars stripped the leaves off the oak trees.
- We saw forest tent caterpillars spinning their flat webs on the branches.
