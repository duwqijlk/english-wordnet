simpleMeaning: cooking food until it turns brown and crisp, over a fire or on a grill
scope: 'Also called browning: cooking food until it is brown and crisp over a fire or on a grill, not
  cooking food in water or in hot oil.'
examples:
- Toasting the bread over the fire made it brown and crisp.
- She stood by the grill, toasting slices of bread for lunch.
