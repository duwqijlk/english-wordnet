simpleMeaning: Far too much of a substance the body makes shows up in the water the body passes, as in
  diabetes or long hunger.
scope: Ketonuria and acetonuria are other names for this, when far too much of a substance made by the
  body shows up in the water it passes.
examples:
- Ketoaciduria can come with diabetes.
- Ketoaciduria followed a long fast.
