simpleMeaning: Varnish and paper are made with a sticky stuff from trees of Australia that melts in alcohol.
scope: Also called acaroid resin, accaroid resin, accroides, accroides resin, and gum accroides, this
  is a sticky stuff from trees of Australia that melts in alcohol and goes into varnish and paper.
examples:
- The varnish maker stirred accroides gum into the mix.
- In the workshop, accroides gum went into the varnish.
