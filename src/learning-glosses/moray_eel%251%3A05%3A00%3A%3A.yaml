simpleMeaning: In warm sea water near the shore, a kind of bright, hungry eel that mostly leaves people
  alone, but bigger ones can be dangerous if they are stirred up.
scope: Also called moray, this is a bright, hungry eel that lives in warm water near the shore.
examples:
- The moray eel hid in the rocks and only showed its head.
- A big moray eel can be dangerous if you stir it up.
