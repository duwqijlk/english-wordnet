simpleMeaning: Room for change that is allowed, so a thing can move a little within set limits.
scope: Room for change that is allowed within set limits; also called an allowance or a tolerance, not
  the money a broker holds and not the gain left after costs.
examples:
- Leave a margin for error in your figures.
- The plan allows a wide margin for delays.
