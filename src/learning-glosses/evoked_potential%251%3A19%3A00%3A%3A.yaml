senseId: 'evoked_potential%1:19:00::'
synsetId: 11514476-n
simpleMeaning: The electrical response of the brain and spinal cord to something outside the body.
scope: The burst of power in the brain and nerves that something from outside brings about, not a thought
  a person chooses and not a change that starts inside the body.
examples:
- The doctor measured the evoked potential after the flash of light.
- An evoked potential showed how the brain answered the sound.
