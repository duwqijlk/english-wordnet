simpleMeaning: unable to make sounds for speech because of injury or illness, and able only to whisper
scope: This is about a person who cannot speak, except to whisper, because of injury or illness; not a
  speech sound made without the vocal cords vibrating, and not a sound made without voice.
examples:
- After the throat operation, she was voiceless for weeks and could only whisper.
- Being voiceless after the injury, he could only whisper a few words.
