simpleMeaning: Words that harm a good name and are often untrue, and make others think badly of them
scope: These are harmful, often untrue words; also called denigrating, slanderous, calumniatory, calumnious,
  denigrative, denigratory, libellous and libelous, not praise and not a true report.
examples:
- The newspaper printed a defamatory claim about the mayor.
- Her defamatory remarks cost her the job.
