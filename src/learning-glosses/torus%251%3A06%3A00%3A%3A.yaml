simpleMeaning: The bottom round moulding at the base of a pillar.
scope: This sense is also called a tore, for the bottom round moulding at the base of a pillar, where
  a tore is, most often, the lowest shaped band at a column's foot, unlike the sense for a ring-shaped
  face, made by turning a circle round an axis that never meets the circle.
examples:
- The torus ran round the foot of the column.
- A torus moulding marks the base of the pillar.
