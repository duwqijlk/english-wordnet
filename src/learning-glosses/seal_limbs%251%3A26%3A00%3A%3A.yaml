senseId: 'seal_limbs%1:26:00::'
synsetId: 14490151-n
simpleMeaning: a rare condition from taking thalidomide in pregnancy, where the top of an arm or leg is
  missing, so the hand or foot joins the body like a stump
scope: A rare birth condition in which the upper part of an arm or leg is missing so the hand or foot
  joins the body like a stump; phocomelia is another name for this sense. Not a limb lost by injury later
  in life.
examples:
- The doctor said the baby had seal limbs, with hands joined to the body like stumps.
- Seal limbs can follow when thalidomide is taken during pregnancy.
