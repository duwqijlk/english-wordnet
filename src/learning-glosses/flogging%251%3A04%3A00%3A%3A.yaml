simpleMeaning: hitting a person again and again with a whip, a strap or a rope, as a punishment
scope: 'Also called whipping, lashing, tanning and flagellation: hitting with a whip, strap or rope to
  punish, not a single hit and not a fight in general.'
examples:
- The prisoner was given a flogging for trying to escape.
- Flogging was once used as a punishment in the navy.
