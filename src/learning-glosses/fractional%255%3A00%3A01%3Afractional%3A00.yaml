simpleMeaning: Making up a part of the main unit of money, smaller than the whole.
scope: Said of coins or money worth only a part of the main unit, not of a part of any whole in general.
examples:
- The dime and the nickel are fractional coins.
- Fractional currency covers amounts less than a dollar.
