simpleMeaning: Sized just right, a hollow space lets waves of sound or light grow strong as they swing
  back and forth
scope: Also called cavity resonator and resonating chamber, it is a hollow space sized so waves grow strong
  inside it, not an open space and not a loudspeaker.
examples:
- Light waves grow strong inside the resonator.
- A resonator is sized to let waves swing back and forth.
