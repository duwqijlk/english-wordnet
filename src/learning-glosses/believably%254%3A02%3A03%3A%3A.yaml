simpleMeaning: In a manner that fits the facts one has, so that it seems true.
scope: In a manner that fits the facts one has, so that it seems true, not in a way that only sounds true.
examples:
- She spoke believably about what she had seen, and the facts backed her up.
- He believably explained how the money had gone missing.
