simpleMeaning: With just one other thing held still, this is a measure of how two things move together
  after that thing's effect is taken out
scope: A measure of how two things move together with one other thing held still, not a link between things
  with nothing held still and not a guess about what causes what.
examples:
- The first-order correlation showed how study time and marks move together once sleep was held still.
- She worked out the first-order correlation after taking out the effect of age.
