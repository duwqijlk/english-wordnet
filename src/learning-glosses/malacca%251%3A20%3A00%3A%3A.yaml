simpleMeaning: The stem of a climbing palm, used to make walking sticks and the handles of umbrellas.
scope: The stem of a climbing palm used for walking sticks and umbrella handles; not bamboo and not the
  wood of a tree.
examples:
- His walking stick was made of malacca.
- The malacca cane had a curved handle.
