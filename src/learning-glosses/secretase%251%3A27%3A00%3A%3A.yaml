senseId: 'secretase%1:27:00::'
synsetId: 15046127-n
simpleMeaning: A class of enzymes thought to cut pieces from a longer protein, freeing fragments of amyloid,
  a sticky protein that builds plaques in brain tissue, a hallmark of Alzheimer's.
scope: The group of protein-cutting enzymes that release the amyloid fragments forming brain plaques;
  a family of such enzymes, not one particular member.
examples:
- Scientists studied the secretase that releases amyloid fragments.
- A drug that blocks secretase might slow the disease.
