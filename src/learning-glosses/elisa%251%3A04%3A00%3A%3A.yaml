simpleMeaning: a lab test that uses a chemical change caused by enzymes to find certain substances in
  a sample, such as enzymes, viruses, antibodies or bacteria
scope: A lab test that uses a chemical change caused by enzymes to find certain substances in a sample,
  also called enzyme-linked-immunosorbent serologic assay; not a treatment and not a test that looks at
  cells under a microscope.
examples:
- The lab ran an ELISA to check for the virus.
- An ELISA can show whether antibodies are present in the blood.
