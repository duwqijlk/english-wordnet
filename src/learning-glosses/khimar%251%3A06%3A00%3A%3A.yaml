simpleMeaning: A headscarf worn by Muslim women who keep their faith strictly, hanging down to just above
  the waist.
scope: This is a headscarf worn by Muslim women who keep their faith strictly, hanging down to just above
  the waist, not a short headscarf and not a veil that covers the face.
examples:
- She wore a khimar that hung down to just above her waist.
- The khimar covered her hair and shoulders.
