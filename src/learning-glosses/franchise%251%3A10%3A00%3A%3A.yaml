senseId: 'franchise%1:10:00::'
synsetId: 06538802-n
simpleMeaning: permission from a company to sell its goods or services in a set place
scope: This is the permission itself, not the business that works under it and not a government right
  such as the right to vote.
examples:
- The company gave him a franchise to sell its cars in the north.
- With the franchise, she could sell the company's food in her own town.
