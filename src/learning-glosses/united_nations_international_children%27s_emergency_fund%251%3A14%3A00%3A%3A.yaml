simpleMeaning: A part of the United Nations that helps children and mothers in developing countries learn
  and stay well.
scope: Another name for the United Nations Children's Fund; this word is for the part that helps children
  and mothers, not for the whole group itself.
examples:
- The United Nations International Children's Emergency Fund sent food to the village.
- Children got help from the United Nations International Children's Emergency Fund.
