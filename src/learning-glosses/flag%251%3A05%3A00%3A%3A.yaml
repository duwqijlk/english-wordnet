simpleMeaning: a tail that stands out because of its clear marks or its clear shape
scope: A tail that stands out by its marks or shape, not a piece of cloth used to send a message and not
  a pole on a golf green.
examples:
- The deer's flag stood out white against the dark trees.
- The hunter watched the flag of the deer as it ran.
