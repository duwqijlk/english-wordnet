simpleMeaning: Any of various drugs that stop alpha-adrenergic receptors working, used in treating a harmless
  enlarged prostate, loosening the muscles of the bladder and prostate.
scope: This sense is also called alpha-adrenergic blocker, alpha-blocker, and alpha blocker, for any of
  various drugs that stop alpha-adrenergic receptors working, used in treating a harmless enlarged prostate,
  loosening the muscles of the bladder and prostate.
examples:
- Alpha-adrenergic blocking agents ease the prostate.
- Alpha-adrenergic blocking agent relaxes the bladder.
