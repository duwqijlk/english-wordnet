simpleMeaning: A one-year plant of tropical Africa with scarlet flower heads shaped like tassels; at times
  put in the genus Cacalia
scope: A scarlet-flowered annual, not a garden rose and not a tall shrub; also called tassel flower, Cacalia
  javanica, Cacalia lutea, Emilia flammea and Emilia javanica.
examples:
- Emilia coccinea showed scarlet tassels in the garden.
- The Emilia coccinea had scarlet flower heads shaped like tassels.
