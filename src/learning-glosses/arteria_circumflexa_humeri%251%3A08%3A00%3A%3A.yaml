simpleMeaning: An artery that brings blood to the shoulder joint and the muscles of the shoulder.
scope: 'Also called circumflex humeral artery: an artery that brings blood to the shoulder joint and the
  muscles of the shoulder, not the main artery of the arm and not a vein.'
examples:
- The arteria circumflexa humeri feeds the shoulder muscles.
- Blood reaches the shoulder joint through the arteria circumflexa humeri.
