simpleMeaning: A big meat-eating two-legged dinosaur with huge teeth edged like knives, maybe a feeder
  on dead beasts, not a hunter, of the late Cretaceous time in North America.
scope: This sense is also called tyrannosaurus.
examples:
- A tyrannosaur may have fed on dead beasts in North America.
- Tyrannosaurs had huge teeth.
