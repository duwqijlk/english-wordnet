simpleMeaning: A clear lens put inside the eye takes the place of the lens taken out, all or part of it,
  in this eye operation.
scope: This is an operation that takes out the lens and puts a clear one in its place, not an operation
  on the eye that leaves the lens in place.
examples:
- Cataract surgery took out the lens and put a clear lens in its place.
- She waited for cataract surgery to take out the lens in her eye.
