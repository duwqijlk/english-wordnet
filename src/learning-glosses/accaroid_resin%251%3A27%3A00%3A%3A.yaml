simpleMeaning: Alcohol melts this sticky tree stuff from Australia, which makers use for varnish and for
  making paper.
scope: Also called acaroid resin, accroides, accroides gum, accroides resin, and gum accroides, this sticky
  tree stuff from Australia melts in alcohol and is used for varnish and paper.
examples:
- Varnish makers melt accaroid resin in alcohol.
- Paper makers use accaroid resin from Australian trees.
