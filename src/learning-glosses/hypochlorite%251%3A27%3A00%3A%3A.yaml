senseId: 'hypochlorite%1:27:00::'
synsetId: 14638423-n
simpleMeaning: A salt or an ester, a compound formed when an acid joins with an alcohol, made from an
  acid that holds chlorine and oxygen
scope: A salt or an ester made from a chlorine-and-oxygen chemical, not that chemical itself and not a
  salt of any other chemical.
examples:
- Sodium hypochlorite is the chemical that makes household bleach work.
- The cleaner holds a hypochlorite that kills germs on the work surface.
