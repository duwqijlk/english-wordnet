simpleMeaning: a set of standard units, such as metric or imperial, used to state how heavy something
  is
scope: This is the whole set of units, not one single unit, not the heaviness of an object, and not a
  metal block used on a balance.
examples:
- The label shows both weight systems side by side.
- Britain changed its weight system from imperial to metric over many years.
