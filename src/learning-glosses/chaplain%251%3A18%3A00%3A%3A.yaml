simpleMeaning: a member of the clergy who looks after the spiritual needs of the people in an institution
scope: A priest or minister serving an institution, not a parish priest serving a local church, and not
  a pastor who leads worship for a congregation.
examples:
- The hospital chaplain visited the sick every morning.
- She asked the army chaplain for help.
