simpleMeaning: a medical tool that uses a heat-sensing camera to show warm and cool spots on the skin
scope: A medical tool that maps heat on the skin, not the method that uses it to study the body, and not
  an ordinary thermometer.
examples:
- The doctor used a thermograph to find the warm spot on her knee.
- A thermograph showed where the skin was warmer after the injury.
