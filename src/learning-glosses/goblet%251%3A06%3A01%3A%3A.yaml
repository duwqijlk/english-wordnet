simpleMeaning: a drinking cup shaped like a bowl, especially the cup used in the Christian service where
  people drink wine to remember Christ
scope: This is a bowl-shaped drinking cup, especially the one used in a Christian church service, not
  a plain mug or a bottle.
examples:
- He drank wine from a gold goblet.
- The priest lifted the goblet during the church service.
