simpleMeaning: Bones that hold the front limbs of a backboned animal to its body
scope: The bones that hold the front limbs of a backboned animal to its body, not the bones of the leg
  and not the backbone itself.
examples:
- The pectoral girdle joins the wings to the bird's body.
- In fish, the pectoral girdle holds the front fins.
