senseId: 'fatalistic%3:01:00::'
synsetId: 03076921-a
simpleMeaning: about or showing the belief that all things happen as they must and cannot be changed by
  people
scope: Also called fatalist. It is about the belief that what happens cannot be changed; it is not about
  death or about a thing that kills.
examples:
- His fatalistic view was that nothing he did would change the result.
- She had a fatalistic attitude and just waited for whatever would happen.
