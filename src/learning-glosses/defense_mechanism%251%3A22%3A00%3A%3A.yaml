simpleMeaning: In psychiatry, a mind process outside a person's awareness that works to lessen the worry
  linked to natural urges
scope: In psychiatry, a mind process outside a person's awareness that lessens worry from natural urges;
  also called defense, defence, defence mechanism, defence reaction and defense reaction, not a plan made
  on purpose and not a cure.
examples:
- Her defense mechanism let her avoid the painful thought.
- His defense mechanism kept the worry out of sight.
