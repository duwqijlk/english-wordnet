simpleMeaning: to praise someone too much and talk sweetly to them in the hope of winning their good will
scope: To praise someone too much and talk sweetly to them in the hope of winning their good will; also
  called court favor, curry favor and curry favour, not honest praise for real merit and not simply being
  kind.
examples:
- He tried to court favour with the boss by praising every decision she made.
- She courted favour by bringing gifts and flattering the manager at every chance.
