simpleMeaning: sticky pads at the tips of its toes, which this frog usually has, let it live among the
  branches of south-east Asia, Australia, and America
scope: Also called tree-frog and tree toad; a frog that lives in trees, not the Old World kind known by
  suckers on its toes.
examples:
- A tree frog clung to the window with the sticky pads on its toes.
- We heard tree frogs calling from the branches above the path.
