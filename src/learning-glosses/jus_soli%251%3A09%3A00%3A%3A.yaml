simpleMeaning: The rule that where a baby is born decides what country it belongs to at birth
scope: The rule that birthplace decides nationality at birth, not the rule based on the parents' nationality.
examples:
- Under jus soli, a child born here is a citizen at birth.
- Jus soli means her birthplace, not her parents' home, fixed her nationality.
