senseId: 'surprise%1:04:00::'
synsetId: 00554692-n
simpleMeaning: The act of doing something unexpected that catches someone off guard.
scope: This names the act itself — catching a person unawares — not the sudden event that causes it and
  not the astonishment the person feels. It is less common than those two uses and appears mostly in formal
  or abstract writing. In everyday speech, 'surprise' usually means the event or the feeling.
examples:
- The raid depended on the surprise of the guards at the gate.
- The surprise of the birthday girl took weeks of quiet preparation.
