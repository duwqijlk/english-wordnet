simpleMeaning: water that falls to the ground from the sky, as rain, snow, hail, sleet or mist
scope: Also called downfall, this is water that falls to the ground from the sky. It is not sudden hurry,
  not a fall from a high place, and not a solid that forms in a liquid.
examples:
