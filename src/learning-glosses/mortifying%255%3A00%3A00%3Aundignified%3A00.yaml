simpleMeaning: making you see your own faults and weak points
scope: 'Also called humiliating, humbling, and demeaning: this makes you notice your own faults, not just
  any thing that makes you feel shame or anger.'
examples:
- Missing such an easy shot was mortifying, because it showed me how careless I had become.
- The mortifying comments made her see the weak parts of her work.
