simpleMeaning: A tall tree of Europe to the Caucasus, with leaves shiny dark green above and pale and
  soft below.
scope: Also called European ash and Fraxinus excelsior, this is a tall tree of Europe, not the American
  ash of the eastern woods.
examples:
- The common European ash lines the old road.
- Leaves of the common European ash shine dark green above.
