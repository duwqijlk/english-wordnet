simpleMeaning: A drug that eases pain and swelling by blocking a body chemical called Cox-2, without harming
  the gut; it was taken off the market by its makers in 2004.
scope: A pain drug that blocks Cox-2 and leaves the gut unharmed, taken off the market in 2004; also called
  rofecoxib.
examples:
- Vioxx eased her joint pain without upsetting her stomach.
- Doctors stopped prescribing Vioxx after 2004.
