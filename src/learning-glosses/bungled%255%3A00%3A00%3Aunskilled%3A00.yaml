simpleMeaning: spoiled because it was done by someone who lacked skill or was not careful
scope: Also called botched. It means spoiled by poor, careless work, not just a little untidy or wrong
  in a small way.
examples:
- They made a bungled attempt to fix the roof, and it still leaks.
- His bungled job left the door hanging crooked.
