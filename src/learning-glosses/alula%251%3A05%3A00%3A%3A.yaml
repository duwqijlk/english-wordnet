simpleMeaning: A tuft of small stiff feathers sits on the first finger of a bird's wing, like a thumb.
scope: Also called bastard wing and spurious wing, the tuft of small stiff feathers on the first finger
  of a bird's wing goes by this name.
examples:
- The alula stood out on the bird's wing as a tuft of small stiff feathers.
- On the first finger of the wing, the alula showed as a tuft of small stiff feathers.
