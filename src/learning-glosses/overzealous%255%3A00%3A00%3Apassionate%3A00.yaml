senseId: overzealous%5:00:00:passionate:00
synsetId: 01731073-s
simpleMeaning: so keen on a cause or idea that you give it very strong loyal support, and your support
  goes too far
scope: Also called rabid, fanatic and fanatical, this describes a person with too much feeling for a cause,
  not a person who is just keen or loyal.
examples:
- The overzealous supporter shouted at anyone who questioned the leader.
- He became overzealous in his support for the plan and would not listen to other views.
