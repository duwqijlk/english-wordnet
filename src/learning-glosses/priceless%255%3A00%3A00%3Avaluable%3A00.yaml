simpleMeaning: no price can be put on it, so great is its worth in money, thought, or spirit
scope: So valuable in money, mind, or spirit that no price fits it; not merely costly and not only dear
  to one person.
examples:
- The old painting is priceless and will never be sold.
- Her priceless advice saved the whole project.
