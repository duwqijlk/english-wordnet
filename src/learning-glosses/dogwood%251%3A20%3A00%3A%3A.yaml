simpleMeaning: a tree or bush of the Cornus group, often with bright leaf-like parts (bracts, the coloured
  leaves around a flower) that look like flowers
scope: 'Also called cornel and dogwood tree: the living tree or bush itself, not the hard wood that comes
  from this tree.'
examples:
- A dogwood stood by the gate, covered in white flower-like leaves in spring.
- The dogwood in our yard opens large pink flower-like parts each spring.
