simpleMeaning: A protein joined to something made of iron and porphyrin, which hold iron.
scope: A protein joined to a stuff made of iron and porphyrin, a stuff that holds iron; hemoprotein is
  another name for it, not a stuff that breaks red blood cells apart and not a tiny living thing tied
  to the malaria germ.
examples:
- Haemoglobin is a haemoprotein joined to iron.
- The haemoprotein held iron in its make-up.
