simpleMeaning: the quality of being good at making things or getting work done, or of having the power
  to do so
scope: The general power to make things or get work done, not the economics measure that compares what
  is made with work time.
examples:
- Good sleep improved her productivity at work.
- The new tools raised the team's productivity a lot.
