simpleMeaning: A person who works with ideas, turning messages in code into plain words
scope: This is a thinker who turns coded messages into plain text, also called a decoder; not a reader
  of old, hard-to-read writing, and not a machine that cracks codes.
examples:
- The decipherer worked late to turn the enemy's coded message into plain text.
- As a decipherer, she turned coded messages into plain words for the team.
