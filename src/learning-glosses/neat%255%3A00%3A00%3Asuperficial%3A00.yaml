senseId: neat%5:00:00:superficial:00
synsetId: 01880529-s
simpleMeaning: seeming good or clever at first, but too simple and not dealing with how hard the thing
  really is
scope: This means seeming clever but too simple for a hard subject; it is not tidy and clean, and not
  done in a skillful, exact way.
examples:
- It was a neat plan, but it failed because the problem was much harder than it looked.
- His neat answer sounded clever, but it left out all the hard parts.
