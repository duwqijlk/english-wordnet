simpleMeaning: of an animal that has a backbone, the part of its body that runs from the chest to the
  hips
scope: 'Also called stomach or belly: the middle part of the body of an animal with a backbone, from the
  chest down to the hips, not the chest itself and not the hollow inside that holds the organs.'
examples:
- The doctor pressed gently on the patient's abdomen.
- A blow to the abdomen left him winded.
