simpleMeaning: The hollow way through one back bone after another that the cord of the back runs through
scope: The hollow way through one back bone after another that the cord of the back runs through; canalis
  vertebralis and vertebral canal are other names for this sense, not a blood tube and not a hole in one
  bone only.
examples:
- The spinal canal runs through one back bone after another.
- The cord of the back runs through the spinal canal.
