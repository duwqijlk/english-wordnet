simpleMeaning: having an even, set shape
scope: This sense is about having an even shape made in a set pattern. It is not the sense about doing
  something at set times, and not the sense about a steady way that does not change.
examples:
- The garden has regularly shaped flower beds.
- These regularly shaped stones fit together well.
