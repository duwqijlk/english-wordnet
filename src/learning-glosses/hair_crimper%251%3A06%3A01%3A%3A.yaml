simpleMeaning: An electric tool that bends the strands on a person's head into waves, often in a zigzag
  way.
scope: An electric tool that bends the strands on a person's head into waves, often in a zigzag way; crimping
  iron is another name for it, not a foam used to style the strands on a person's head and not an uncomfortable
  shirt made of coarse animal hair.
examples:
- She used a hair crimper to make her hair wavy.
- The hair crimper bent her hair into zigzag waves.
