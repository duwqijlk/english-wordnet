simpleMeaning: a person who goes from place to place and sells things, for example on the streets or at
  outdoor fairs
scope: 'Also called pedlar or hawker: a person who travels and sells goods, not a shop owner who sells
  from one fixed place.'
examples:
- The peddler sold toys from a cart on the street.
- A peddler went from town to town selling pots and pans.
