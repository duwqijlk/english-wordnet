simpleMeaning: one of a group of animals that feed their young with milk, with slim bodies, round heads
  and separate toes, many of which can pull their claws back
scope: Also called cat and felid. This is the animal group, covering big wild cats as well as house cats,
  not the word for how a cat looks or moves.
examples:
- A lion is a large feline that lives in Africa.
- The zoo keeps several felines, including tigers and small wild cats.
