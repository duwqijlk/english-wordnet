simpleMeaning: 'Gambling card game: chips go on an ace, king, queen and jack of separate suits, players
  lay ever-higher cards of a suit, and matching a layout card takes its chips.'
scope: This is the card game played with chips on four face cards; stops is another name for the same
  game, and it is not the informal word for money.
examples:
- They played boodle for small change after dinner.
- In boodle, a lucky match can take a whole pile of chips.
