simpleMeaning: A set of moves made to build and show strength, quickness and balance, most often done
  with or on a piece of gear for the sport.
scope: A set of moves made to build and show strength, quickness and balance, most often done with or
  on a piece of gear for the sport; not a cloth foot covering and not a sleeveless tunic worn as part
  of a school uniform.
examples:
- Her gymnastic exercise on the beam showed great balance.
- The gymnastic exercise built strength and quickness.
