simpleMeaning: 'the look a thing gets from light: the light it gives off, lets through, or throws back
  reaches your eyes and makes it look that way'
scope: 'Also called color and colour: the way a thing looks to your eyes because of its light, not a dye
  put on hair and not the act of filling in a picture.'
examples:
- The coloring of the sunset changed from gold to deep red.
- Her dress had a soft coloring that suited her.
