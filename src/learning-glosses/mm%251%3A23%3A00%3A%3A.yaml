simpleMeaning: a unit for measuring length in the metric system (the system based on the meter), equal
  to one thousandth of a meter
scope: 'Also called millimeter and millimetre: a very small unit of length, not a centimeter or a meter
  on its own.'
examples:
- The screw is only 5 mm long.
- She cut the paper to a width of 20 mm.
