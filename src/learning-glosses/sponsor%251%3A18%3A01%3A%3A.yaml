senseId: 'sponsor%1:18:01::'
synsetId: 10485764-n
simpleMeaning: a person who speaks for another person and puts them forward, for an award, a degree, or
  to meet other people
scope: This is a person who puts someone forward for an award or a degree; it is not a person or business
  that pays for an event, and not the act of buying from a shop.
examples:
- She acted as his sponsor when he was put forward for the award.
- His sponsor spoke for him at the degree ceremony.
