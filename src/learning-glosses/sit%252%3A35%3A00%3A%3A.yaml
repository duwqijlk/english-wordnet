simpleMeaning: to be in a position where the upper body is mostly upright and the weight rests on the
  bottom.
scope: This is not the sense of an object being placed in a spot, and not the sense of caring for a child;
  it describes a person's body position.
examples:
- She sat by the window and watched the rain.
- Please sit here while I make some tea.
