simpleMeaning: the gain a business gives up by putting its money in one plan instead of another plan with
  the same risk
scope: 'Also called cost of capital: the gain a business gives up by putting its money in one plan instead
  of another, not the money spent to buy a thing and not the gain a business really makes.'
examples:
- The firm weighed the capital cost before building the new plant.
- The capital cost of the project was the gain lost from the plan they did not take.
