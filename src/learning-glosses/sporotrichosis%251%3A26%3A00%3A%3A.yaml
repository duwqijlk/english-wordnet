simpleMeaning: a long-lasting infection of the skin and the lymph nodes, the small glands that fight illness,
  caused by a fungus
scope: A long-lasting skin infection caused by a fungus, not a short illness and not a wound from a cut.
examples:
- He was treated for sporotrichosis after a thorn scratched his hand.
- Sporotrichosis can spread through the skin and the lymph nodes.
