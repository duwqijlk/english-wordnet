simpleMeaning: A blood unit with a special marker that spots foreign marks on virus-hit units and wakes
  B units and killer T units; the AIDS virus kills them.
scope: Not other T cells, nor other white blood units; also called helper cell, CD4 T cell, and helper
  T cell.
examples:
- CD4 cells fight infection.
- The AIDS virus kills CD4 cells.
