simpleMeaning: Its short wings each carry a sharp point for fighting, and this bird of New Zealand cannot
  fly; it is given to stealing.
scope: Also called weka and wood hen, it is the flightless New Zealand rail that steals and fights with
  the spurs on its short wings.
examples:
- A maori hen ran across the path.
- The maori hen stole food from the camp.
