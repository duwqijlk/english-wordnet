simpleMeaning: one of the two soft edges of flesh around the mouth that help form speech
scope: The human mouth part used in speech; not a shell's rim, a flower's petal part, or a rude answer.
examples:
- She bit her lower lip while she thought.
- He pressed his lips together and said nothing.
