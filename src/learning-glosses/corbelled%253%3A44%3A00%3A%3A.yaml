simpleMeaning: having a block of stone or wood that sticks out of a wall to hold up something above it
scope: This is about a wall with a block sticking out to hold up what is above; not about a wall with
  a shelf, and not about a plain bracket.
examples:
- The corbelled arch supported the roof.
- They admired the corbelled wall of the old hall.
