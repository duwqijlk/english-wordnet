simpleMeaning: right for the feelings of certain people or for a certain event
scope: 'Also called decent: right for the feelings of people or for an event; it is not the act of changing
  something to make it right, and not just exactly right in a general way.'
examples:
- It was fitting to hold a quiet service for the old teacher.
- A short speech was a fitting way to end the day.
