simpleMeaning: the thin strands from the stem of a plant, made into thread and then woven to make linen
  cloth
scope: This is the material taken from the plant, not the living plant itself that people grow in fields.
examples:
- Flax is spun into thread for making cloth.
- The weaver used flax to make a strong linen shirt.
