simpleMeaning: A tool that measures the push of a fluid in a stream, not the extra push from the fluid's
  movement
scope: A tool that measures the push of a fluid in a stream, not the extra push from its movement; not
  a tool that measures how fast the fluid moves and not a pipe that carries the fluid.
examples:
- The engineer fitted a static tube to the pipe to measure the pressure.
- A static tube showed the push of the water in the stream.
