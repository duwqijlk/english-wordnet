simpleMeaning: a mark made by a writer or editor to show where something should be put into a text
scope: A mark that shows where to add something to a text, not a mark that takes something out and not
  a letter or a word itself.
examples:
- She put a caret under the line to show where the missing word went.
- The editor added a caret where the new sentence should go.
