simpleMeaning: The act of giving gifts freely, with a very kind and open spirit
scope: Also called magnanimity, largesse, munificence and openhandedness, this is the giving of gifts
  with a free and generous spirit, not a single gift and not mere wealth.
examples:
- The queen's largess kept the village fed through the winter.
- He was known for his largess to every charity in town.
