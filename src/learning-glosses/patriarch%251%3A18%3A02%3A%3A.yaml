simpleMeaning: one of the first men named in the Bible who are seen as fathers of all people
scope: One of the early fathers in the Bible; not the title for a head of an Eastern Orthodox church.
examples:
- In the Bible story, Abraham is a patriarch, a father of many people.
- The patriarch Noah is named early in the Bible.
