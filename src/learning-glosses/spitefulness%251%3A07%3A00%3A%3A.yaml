simpleMeaning: The ill will in being spiteful or nasty, or in wishing harm to someone.
scope: Also called spite, nastiness, cattiness, and bitchiness; the ill will in being spiteful or nasty,
  or in wishing harm to someone, not a single spiteful act itself.
examples:
- Her spitefulness showed in every remark she made about him.
- The spitefulness of the letter shocked even his friends.
