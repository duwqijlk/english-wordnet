simpleMeaning: Shiny black seeds lie in this sugary pulpy fruit of warm lands, with a thick scaly skin.
scope: Also called annon, annona, and sugar apple, this is the fruit itself, not the tree that bears it.
examples:
- She ate a sweetsop.
- We cut open a sweetsop to reach its shiny black seeds.
