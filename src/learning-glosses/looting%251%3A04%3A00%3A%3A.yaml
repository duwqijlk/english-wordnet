simpleMeaning: The act of stealing things during a riot (a time of violent trouble by a crowd in public)
  or during a war
scope: 'Also called robbery: this is stealing goods during street fighting or war, not taking something
  in a calm, normal time.'
examples:
- During the riot, looting spread through the shopping streets.
- Soldiers were punished for looting homes in the town during the war.
