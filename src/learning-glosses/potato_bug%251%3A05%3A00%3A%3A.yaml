simpleMeaning: At every stage of its life, this black-and-yellow insect eats the leaves of the plant it
  lives on; first from the eastern Rocky Mountains, found worldwide.
scope: Also called potato beetle, this black-and-yellow insect eats the leaves of the plant it lives on
  at every stage of its life, first from the eastern Rocky Mountains and now found worldwide.
examples:
- Potato bugs ate the leaves.
- We found potato bugs on the plants.
