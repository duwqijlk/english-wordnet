simpleMeaning: Of a person, coarse and ungentlemanly, with no elegance or social polish.
scope: This is a lasting coarseness of manner, not one moment of bad manners.
examples:
- His bounderish behavior at the dinner table embarrassed everyone.
- She dismissed him as a bounderish show-off with no manners.
