simpleMeaning: a steady pattern of beats that comes from splitting a piece into parts of the same length
scope: 'Also called time and meter: a steady pattern of beats in parts of the same length, not the strong
  sound on one syllable in a line of poetry and not the unit for measuring length.'
examples:
- The dancers kept to the metre of the music, three beats in each part.
- This song has a slow metre, with each part lasting the same time.
