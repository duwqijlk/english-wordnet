simpleMeaning: People use the inner skin of a tree, strongly sweet-smelling, to flavour food and as a
  drink to make a person feel better.
scope: Also called canella bark and white cinnamon, this names the strongly sweet-smelling inner skin
  of a tree, not its outer bark.
examples:
- She added canella to the dish to flavour it.
- He drank canella as a tonic.
