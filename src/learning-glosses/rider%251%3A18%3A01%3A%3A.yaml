simpleMeaning: a person who travels in a boat, bus, car, plane, train, or other vehicle, but is not the
  one who controls it
scope: Also called a passenger. This is a person in a car, bus, train, plane, or boat who does not control
  it, not a person on a horse or bicycle and not an extra part added to a law.
examples:
- As a rider on the bus, he sat and read while someone else drove.
- The train rider bought a ticket and waited for her stop.
