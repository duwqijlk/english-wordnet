simpleMeaning: One of the four sharp cone-shaped teeth, two in each jaw, set between the front teeth and
  the back teeth
scope: One of the four sharp cone-shaped teeth set between the front teeth and the back teeth; canine,
  canine tooth, cuspid, eye tooth and eyetooth are other names for it, not a front tooth and not a back
  tooth.
examples:
- His dogtooth ached after he bit the hard crust.
- The dogtooth sits between the front teeth and the back teeth.
