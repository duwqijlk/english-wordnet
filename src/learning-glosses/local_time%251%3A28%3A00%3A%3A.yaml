simpleMeaning: the official time used in one place on the Earth, fixed to suit where the place lies, and
  set by law or custom
scope: The official time used in one place on the Earth, fixed to suit where the place lies, and set by
  law or custom; not the time used everywhere alike and not the time shown by the sun alone.
examples:
- Local time in Sydney is ten hours ahead of London.
- Check the local time before you ring.
