simpleMeaning: a state of no change or movement, because opposite forces hold each other still
scope: No change because opposing forces balance each other, not a stop in the flow of a liquid in the
  body.
examples:
- After years of stasis, the talks began again.
- The market was in stasis, with buyers and sellers waiting.
