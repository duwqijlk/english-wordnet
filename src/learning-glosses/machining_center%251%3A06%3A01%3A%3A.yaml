simpleMeaning: a milling machine that changes its own tools, holds them in magazines or round trays, is
  run by computer control, and has cooling and a housing around it
scope: A milling machine that changes its own tools, not a hand drill and not a simple lathe.
examples:
- The machining center changed tools on its own between cuts.
- Our shop bought a new machining center with computer control.
