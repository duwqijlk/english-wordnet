simpleMeaning: A tube leaves the deep tube to the private parts in women and brings blood to the round
  base of the opening between the legs
scope: This blood tube is also called arteria bulbi vestibuli, and it is the one in women, not the one
  in men.
examples:
- Blood flows to the bulb through the artery of the vestibule bulb.
- The artery of the vestibule bulb leaves the deep tube to the private parts in women.
