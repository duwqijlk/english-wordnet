simpleMeaning: a part of the Earth marked out by the plants and animals that live there
scope: A part of the Earth marked out by the plants and animals that live there, not a country with set
  borders and not a place marked out by its weather.
examples:
- The desert forms one biogeographical region of the continent.
- Each biogeographical region has its own plants and animals.
