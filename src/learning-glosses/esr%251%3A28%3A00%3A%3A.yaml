simpleMeaning: The speed at which red blood cells sink in a tube of blood under set test conditions; a
  high speed usually points to swelling in the body.
scope: Also called the erythrocyte sedimentation rate, sed rate, and sedimentation rate, this is the speed
  at which red blood cells sink in a tube of blood, not the microwave test of the same name.
examples:
- The doctor ordered an ESR to check for swelling.
- Her ESR was high, which pointed to swelling in the body.
