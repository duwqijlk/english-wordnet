simpleMeaning: part of a piece of clothing that covers the arm, with a wide hole for the arm and a tight
  band at the wrist
scope: A part of a piece of clothing that covers the arm, wide at the top and tight at the wrist, not
  a plain straight arm cover and not a part with no band at the wrist.
examples:
- The dolman sleeve of her dress was wide at the shoulder and tight at the wrist.
- He liked the dolman sleeves on the coat because they gave his arms room to move.
