simpleMeaning: An operation that makes a lasting opening through the belly wall into the gut.
scope: 'Also called an enterotomy: an operation that makes a lasting opening through the belly wall into
  the gut, not a cut that is closed again and not an opening into the stomach.'
examples:
- The surgeon did an enterostomy to make an opening into her gut.
- After the enterostomy, food could leave through the opening in her belly.
