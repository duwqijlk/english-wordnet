simpleMeaning: A word used with a person's name that shows noble rank, such as 'Duke' or 'Countess'.
scope: This sense is not a general word of status or job, such as 'Mr.' or 'General'; it marks noble rank
  only.
examples:
- He inherited the title of Earl when his father died.
- Guests addressed him by his title, 'Lord Ashby', all evening.
