simpleMeaning: People haul on ropes tied to a beam and a pouch to work this throwing machine, hurling
  shot through the air.
scope: Also called mangonel and bricole, this is a throwing machine worked by people hauling on ropes
  tied to a beam and a pouch.
examples:
- The crew hauled the ropes of the traction trebuchet to loose a stone.
- A traction trebuchet needs many hands pulling together to fire.
