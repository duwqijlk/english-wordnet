simpleMeaning: In British slang, a scientist or skilled worker who does research for the armed forces
scope: In British slang, a scientist or skilled worker doing research for the armed forces; not a soldier
  and not a scientist doing work for a university.
examples:
- The boffin worked on radar for the air force.
- Two boffins from the army lab worked on a new radar set for the air force.
