simpleMeaning: 'A mathematical rule that undoes another: if one turns x into y, the other turns y back
  into x.'
scope: The mathematical rule that reverses another rule's effect, so applying both returns the starting
  value; it is not the reciprocal of a number, and not a function's derivative.
examples:
- If you apply the inverse function to 9, you get back 3.
- The class found the inverse function of f(x) = 2x + 1.
