simpleMeaning: Most of these climbing plants grow in the warm tropics of America, and some bear fruit
  that people can eat.
scope: Also called passionflower, this is one of many kinds of climbing plant in the warm tropics of America
  rather than the fruit that some kinds bear.
examples:
- The passionflower vine bore fruit that we could eat.
- Most passionflower vines grow in warm parts of America.
