simpleMeaning: A plant that lives for years and climbs by winding, with heart-shaped leaves and flowers
  in cone-like spikes; brewers use its dried flowers to give beer its typical bitter taste.
scope: This is the climbing plant grown for brewing, not the jump on one leg that is also called a hop.
  'Hops' is another name for the same plant.
examples:
- A hop can grow several metres in a single season.
- The hop needs deep, well-drained soil and full sun.
