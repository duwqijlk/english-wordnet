simpleMeaning: A virus carried by the common house mouse brings on this sickness of the coverings of the
  brain and spine
scope: A sickness of the brain and spine coverings from a mouse-carried virus, not a sickness from bacteria
  and not a cold.
examples:
- He caught lymphocytic choriomeningitis from mice in the barn.
- Lymphocytic choriomeningitis left her with a bad headache for days.
