simpleMeaning: a small piece of something, especially a small piece cut off from a larger thing
scope: 'Also called snipping: a small piece, especially one cut off, not the whole thing it came from.'
examples:
- She cut a snippet of cloth from the old dress.
- He kept a snippet of paper with the address written on it.
