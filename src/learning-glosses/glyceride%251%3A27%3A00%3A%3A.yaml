simpleMeaning: An ester (a substance made by joining parts) of glycerol and fatty acids, found in nature
  as fats and fatty oils
scope: This fat substance, also called acylglycerol, is found in natural fats and oils; it is not pure
  glycerol on its own and not a free fatty acid.
examples:
- Fresh fats contain glycerides made from fatty acids.
- The lab tested the oil to find out which glycerides it contained.
