simpleMeaning: a small slip made without meaning to, often seen in speech, writing, small accidents, or
  forgetting things
scope: A small slip made without meaning to, often in speech or writing, also called slip, parapraxis
  and slip-up; not a bad shot in billiards and not a big blunder.
examples:
- Her miscue in the speech made the crowd laugh.
- A miscue in his writing changed the meaning.
