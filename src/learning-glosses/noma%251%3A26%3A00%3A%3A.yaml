simpleMeaning: a serious illness where sores form fast and break down the thin wet skin inside the mouth
  or on the sex parts; often seen in children with too little food
scope: This sense is a bad illness with sores in the mouth or on the sex parts, often in children with
  too little food; it is not a small common mouth sore.
examples:
- The doctor said the bad sores in the child's mouth were noma.
- Noma can hurt the mouth very badly if it is not treated soon.
