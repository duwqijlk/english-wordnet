simpleMeaning: The United States government body that looks after trade at home and abroad, runs the count
  of the people, and runs the office for new inventions; set up in 1913.
scope: 'Also called DoC, Commerce, and the Commerce Department: the United States government body for
  trade, the count of the people, and new inventions, not the body for laws and not the body for health.'
examples:
- The Department of Commerce released new trade figures today.
- She works for the Department of Commerce in Washington.
