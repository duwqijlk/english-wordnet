simpleMeaning: This person knows a lot about plants and animals and studies living things
scope: A person who studies living things and knows a lot about plants and animals, also called a naturalist,
  not a person who studies rocks and not a doctor.
examples:
- The natural scientist spent years watching birds in the forest.
- As a natural scientist, she knew every plant in the valley.
