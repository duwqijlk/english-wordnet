simpleMeaning: An illness that comes from dairy taken from cows that have the trembles, an illness that
  makes them shake
scope: This is an illness in people from the dairy of cows with the trembles, not the sickness of the
  cows themselves.
examples:
- She fell ill with milk sickness after drinking fresh milk.
- Milk sickness struck the family in the summer.
