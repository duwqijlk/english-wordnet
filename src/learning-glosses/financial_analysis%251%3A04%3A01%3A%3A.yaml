simpleMeaning: A check of how well a firm uses money it owns and owes, how well its work pays, and the
  worth and safety of its debts against what it owns.
scope: This is a check of how well a firm uses its money, how well its work pays, and how safe its debts
  are against what it owns.
examples:
- After reviewing the company's financial analysis, the banker refused the loan.
- The financial analysis showed the firm used its money well.
