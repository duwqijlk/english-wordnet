simpleMeaning: a deep ditch in the ground cut by running water, especially after long, heavy rain
scope: A deep ditch cut by running water, especially after long, heavy rain; not a stream of water itself
  and not a wide valley.
examples:
- After the storm, a deep gully ran down the side of the hill.
- The heavy rain cut a gully across the dirt road.
