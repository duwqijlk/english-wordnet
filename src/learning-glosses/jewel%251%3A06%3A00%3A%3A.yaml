simpleMeaning: A small hard stone people prize, costly or less costly, set in a ring or other thing worn
  to look good
scope: This is a small hard stone people prize, set in a ring or other thing worn to look good, not the
  act of putting such stones on something and not a person who stands out and is much loved and valued.
examples:
- The ring held a large jewel that caught the light.
- She kept her grandmother's jewel in a small box.
