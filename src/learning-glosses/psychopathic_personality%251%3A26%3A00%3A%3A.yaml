senseId: 'psychopathic_personality%1:26:00::'
synsetId: 14411544-n
simpleMeaning: A deep-seated lack of conscience and warmth, leaving someone able to hurt others violently
  and feel no remorse.
scope: An older name for the same condition, now largely replaced by antisocial personality disorder;
  not a separate diagnosis and not a word for any violent act.
examples:
- The report described the prisoner as having a psychopathic personality.
- Older psychiatric texts often used the term psychopathic personality for this condition.
