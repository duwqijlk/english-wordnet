simpleMeaning: Wine or cider left in the air turns into this sour liquid, most often, and it gives food
  a sharp taste or keeps food fresh.
scope: This is a sour liquid made from wine or cider, also called vinegar, not a thin mix of the acid
  in water used to dissolve a drug.
examples:
- The acetum gave the food a sharp taste.
- Acetum kept the food from going bad.
