simpleMeaning: a place on the skin where the top part is torn or rubbed off
scope: 'Also called scratch: this is a hurt place on the skin, not the rough sound of rubbing, and not
  a deep bow.'
examples:
- He got a scrape on his knee when he fell.
- The scrape on her arm hurt but did not bleed much.
