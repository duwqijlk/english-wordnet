simpleMeaning: An animal of the sex that makes sperm cells, which can join with and fertilize a female's
  egg cell.
scope: This is not the word for a human being of that sex; it is the general term for animals.
examples:
- The male of the species has bright blue feathers.
- In many birds, the male builds the nest.
