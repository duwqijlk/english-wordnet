simpleMeaning: A plant part with a fine toothed edge, toothed in tiny bits all round the edge
scope: A leaf with a finely toothed edge, not a smooth-edged leaf and not a leaf with deep cuts.
examples:
- The denticulate leaf had tiny teeth along its edge.
- She drew a denticulate leaf with its finely toothed margin.
