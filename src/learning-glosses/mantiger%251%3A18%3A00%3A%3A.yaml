simpleMeaning: a monster from old tales with a man's head that has horns, a lion's body and a scorpion's
  tail
scope: A monster from old tales; manticore, mantichora and manticora are other names for this sense, not
  a real animal and not a monster with only one animal's parts.
examples:
- The mantiger guarded the gate in the old story.
- A mantiger appeared in the tale, with horns and a lion's body.
