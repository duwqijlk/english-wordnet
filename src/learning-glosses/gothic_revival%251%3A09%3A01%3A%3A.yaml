simpleMeaning: A way of building that took its ideas from the building of the Middle Ages and competed
  with the Neoclassical style in the United States and Great Britain.
scope: Also called Gothic revival architecture, neo-Gothic or neo-Gothic architecture; a way of building
  that took its ideas from the building of the Middle Ages and stood against the new old-style revivals
  in the United States and Great Britain.
examples:
- The Gothic revival shaped many churches in England.
- Gothic revival buildings rose across the United States and Great Britain.
