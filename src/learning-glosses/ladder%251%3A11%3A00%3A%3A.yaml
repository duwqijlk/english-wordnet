simpleMeaning: a row of stitches that have come undone
scope: 'Also called a run: a row of stitches that have come undone. It is not the steps for climbing up
  or down, and not the act of coming undone itself.'
examples:
- She got a ladder in her stocking at work today.
- There was a long ladder in her tights where the stitches had come undone.
