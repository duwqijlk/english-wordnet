simpleMeaning: A saxifrage with loose bunches of white flowers on hairy stems that rise from a ring of
  leaves at the base, on damp slopes of western North America
scope: Also called western saxifrage; a saxifrage of damp western slopes with white flowers on hairy stems,
  not the cushion saxifrage with reddish-lavender flowers.
examples:
- Saxifraga occidentalis bloomed white on the damp slope.
- We found Saxifraga occidentalis where the hillside stays moist.
