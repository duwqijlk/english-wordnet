simpleMeaning: A place where harmful waste has been dumped and the Environmental Protection Agency has
  marked for clean-up.
scope: This is a place where harmful waste has been dumped and the Environmental Protection Agency has
  marked it for clean-up; toxic site and toxic waste area are other names for it, not an ordinary rubbish
  dump.
examples:
- The Superfund site near the river is to be cleaned up.
- Workers began clearing the Superfund site last year.
