simpleMeaning: the path that a run of events or ideas mainly takes, pictured as flowing water
scope: 'Another name for current and flow in this sense: the main direction of events or ideas, not a
  crowd or other thing moving like a river and not moving liquid.'
examples:
- A strong stream of new ideas runs through the book.
- She traced the stream of events that led to the war.
