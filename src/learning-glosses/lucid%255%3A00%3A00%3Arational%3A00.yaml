simpleMeaning: able to think clearly and to say what you think in a clear way that stays the same from
  start to end
scope: 'Also called logical, and another name for this sense is coherent: able to think and say things
  clearly. It is not about a clear dream or about clear light.'
examples:
- After the accident, she was lucid and answered every question clearly.
- He gave a lucid account of what had happened at the meeting.
