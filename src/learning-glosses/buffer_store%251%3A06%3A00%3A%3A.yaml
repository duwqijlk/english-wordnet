simpleMeaning: In computer science, a place in memory that keeps data briefly until a machine can take
  it, letting parts of the computer that move data at different speeds work together
scope: In computer science, this is a part of memory that keeps data briefly while it waits to go to a
  machine; buffer and buffer storage are other names for it, not the computer's main memory and not a
  hard disk.
examples:
- The buffer store held the file until the printer was free.
- Data waited in the buffer store before moving on.
