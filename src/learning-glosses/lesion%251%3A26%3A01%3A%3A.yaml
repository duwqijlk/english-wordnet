simpleMeaning: a place in one part of the body where something has changed and is not normal in how it
  is made
scope: A changed, not normal place in one part of the body, not a healthy body part and not pain with
  no change in the body.
examples:
- The doctor looked closely at the lesion on her skin.
- Tests showed a small lesion in one part of his brain.
