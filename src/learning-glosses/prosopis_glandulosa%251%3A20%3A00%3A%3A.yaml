simpleMeaning: A thorny deep-rooted shrub that lives through drought in the southwest of the US and Mexico,
  with sweet pods that feed livestock; it tends to form wide, thick bushes.
scope: A thorny shrub of dry lands, also called honey mesquite and Western honey mesquite; not a thornless
  garden bush and not a tree grown for wood.
examples:
- Prosopis glandulosa grows thickly along the dry riverbed.
- Farmers cut Prosopis glandulosa back so it does not take over the field.
