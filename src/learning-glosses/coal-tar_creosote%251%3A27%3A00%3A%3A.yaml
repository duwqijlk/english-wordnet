simpleMeaning: Heating hard black fuel leaves a thick black stuff; distilling it gives a dark oily liquid
  used to keep wood from rotting.
scope: Also called creosote, this dark oily liquid comes from heating hard black fuel and is used to keep
  wood from rotting.
examples:
- He brushed coal-tar creosote onto the fence posts.
- He bought coal-tar creosote to keep the fence posts from rotting.
