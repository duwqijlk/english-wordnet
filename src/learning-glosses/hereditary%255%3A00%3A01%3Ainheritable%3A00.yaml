simpleMeaning: found in members of a family, usually passed from parents to their children
scope: 'Also called familial: found in a family and usually passed from parents to children, not passed
  on by law when a person dies, as land or a title can be.'
examples:
- She has a hereditary illness that her mother had too.
- Red hair is hereditary in their family, seen in child after child.
