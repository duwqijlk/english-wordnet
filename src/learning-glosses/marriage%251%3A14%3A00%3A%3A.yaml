senseId: 'marriage%1:14:00::'
synsetId: 08005815-n
simpleMeaning: A married couple, or the two people who are joined to each other in marriage.
scope: Here 'marriage' names the married pair themselves, as in 'the marriage produced two children'.
  It is not the wedding ceremony or act of marrying, and not the close-union sense. This use is uncommon
  today, and in most short sentences the word is read as the relationship, so only context makes the couple
  clear.
examples:
- The marriage produced two sons and a daughter.
- The marriage had five children, all born in the same village.
