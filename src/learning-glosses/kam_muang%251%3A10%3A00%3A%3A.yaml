simpleMeaning: One branch of the Tai languages, spoken in Chiang Mai, Chiang Rai, Lamphun, Lampang, Mae
  Hong Son, Sukhothai, Nan, Phayao, Phrae, Uttaradit and Tak provinces and one more.
scope: Also called Tai Yuan; one branch of the Tai languages of northern Thailand, not the other Tai branches.
examples:
- Kam Muang is spoken in northern Thailand.
- Kam Muang speakers live in Chiang Mai.
