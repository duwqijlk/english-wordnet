simpleMeaning: (used joined to another word) having your thoughts turned toward the thing named by that
  word
scope: Used joined to another word to say your thoughts are turned toward that thing; not being willing
  to do something, and not looking after someone.
examples:
- She is career-minded and plans each step of her work.
- The town needs more civic-minded people who care about public places.
