simpleMeaning: One of several small trees that shed their leaves yearly, prized for dark wood and arching
  branches thick with pink nectar-rich flowers; roots, bark, leaves and seeds are poisonous.
scope: The small tree prized for dark timber and pink flower clusters, with poisonous roots, bark, leaves
  and seeds; not a shrub, and not safe to eat.
examples:
- Farmers plant gliricidia along field edges for shade and firewood.
- The bark and leaves of gliricidia are poisonous, so cattle are kept away from it.
