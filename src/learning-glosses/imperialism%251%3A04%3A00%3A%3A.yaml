simpleMeaning: any case of a power using force or strong pressure to spread its control over others
scope: Any act of spreading control by force or strong pressure, not the set of political ideas that supports
  a country ruling other lands.
examples:
- The invasion of the small country was an act of imperialism.
- Critics called the takeover of trade and government in the region imperialism.
