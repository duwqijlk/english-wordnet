simpleMeaning: belonging to or coming from the world beyond a particular place or group.
scope: This is not help or pressure coming from outsiders; it is about the wider world beyond a place
  or group.
examples:
- The small village was cut off from the outside world for a week.
- Besides her job, she has many outside interests.
