senseId: 'transpose%2:30:05::'
synsetId: 00556317-v
simpleMeaning: to move something from one place or time to another place or time
scope: This sense is moving something to a new place or time, also called transfer and transplant. It
  is not the maths name for a table of numbers, and not moving a number across an equals sign in maths.
examples:
- The director transposed the old story to a modern city.
- They transposed the play from ancient Rome to present-day London.
