simpleMeaning: a meeting at a school where most often a new speaker talks about a new topic each time
scope: This is a study meeting at a school or college, not a single talk and not a party.
examples:
- The colloquium met on Friday to hear a visiting scholar speak about old maps.
- She gave a talk at the colloquium on the history of the stars.
