simpleMeaning: a priest who belongs to the group of priests of a cathedral, the main church of an area
scope: This is a person, a priest in the group of priests of a cathedral; not a piece of music, not a
  set of rules, and not a list of holy books.
examples:
- The canon led the morning service at the cathedral.
- They met the canon who helps run the cathedral.
