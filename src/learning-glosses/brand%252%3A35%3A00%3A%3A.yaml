simpleMeaning: to put a name or symbol on goods to show who made or sells them.
scope: This is about putting a maker's name or symbol on goods, not about burning marks into animals or
  publicly condemning someone.
examples:
- The company brands its products with a small logo.
- Local farmers now brand their honey to compete with larger sellers.
