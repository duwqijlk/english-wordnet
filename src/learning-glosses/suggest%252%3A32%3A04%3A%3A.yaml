simpleMeaning: to put an idea into someone's mind in an indirect way rather than stating it.
scope: This is hinting at something indirectly, not putting forward a plan or idea for others to consider.
examples:
- Are you suggesting that the report is false?
- She suggested, without saying so outright, that he had taken the money.
