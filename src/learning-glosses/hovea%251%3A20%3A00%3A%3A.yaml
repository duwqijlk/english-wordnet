simpleMeaning: any of a group of pretty Australian bushes that keep their leaves all year, grown for their
  shiny dark green leaves and flowers in deep blue and strong violet
scope: 'Also called purple pea: a pretty Australian bush grown for its leaves and flowers, not a rose
  bush and not a wattle.'
examples:
- Hovea grew by the fence, its shiny dark green leaves bright all year.
- The hovea opened deep blue flowers in spring.
