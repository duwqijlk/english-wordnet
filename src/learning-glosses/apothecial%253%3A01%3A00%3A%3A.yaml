simpleMeaning: having to do with the apothecium, the cup that bears spores, of some lichens and fungi
scope: About the spore cup of some lichens and fungi, not about the whole plant and not about a different
  part of a fungus.
examples:
- Under the lens, the apothecial disc of the lichen stood out clearly.
- The fungus was named for its large apothecial cups.
