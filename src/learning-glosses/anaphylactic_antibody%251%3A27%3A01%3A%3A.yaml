simpleMeaning: A kind of antibody that sticks to certain kinds of cells, besides and apart from its sticking
  to the antigen that brought it on, through the Fc part's traits.
scope: Also called cytophilic antibody and cytotropic antibody, a kind of antibody that sticks to certain
  kinds of cells, besides and apart from its sticking to the antigen that brought it on, through the Fc
  part's traits.
examples:
- Anaphylactic antibodies stick to certain cells.
- Anaphylactic antibody sticks to the antigen.
