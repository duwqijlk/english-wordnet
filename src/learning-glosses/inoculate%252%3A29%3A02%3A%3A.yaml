simpleMeaning: to put a bud, a small new growth on a plant, into a plant so that a new plant can grow
scope: 'The plant sense: putting a bud into a plant so a new one can grow, not giving a person or animal
  protection against an illness.'
examples:
- The gardener inoculated the rose stem with a bud from another plant.
- He learned how to inoculate fruit trees by putting in buds from a better tree.
