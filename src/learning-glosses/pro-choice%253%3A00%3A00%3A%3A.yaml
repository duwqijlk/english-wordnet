simpleMeaning: Saying a woman should be free to decide about her own body, most often about ending a pregnancy
scope: Said of the view that a woman should be free to decide about her own body, most often about ending
  a pregnancy, not the view that ending a pregnancy is killing and should be against the law.
examples:
- She holds pro-choice views on the issue.
- The pro-choice group marched in the city centre.
