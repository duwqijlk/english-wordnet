simpleMeaning: In mathematics, a row of numbers in which each number is multiplied by the same fixed number
  to get the next one.
scope: This is a row of numbers in which each number is multiplied by the same fixed number to get the
  next one, not a row that grows by adding the same number and not a row with no set pattern.
examples:
- 1, 4, 16, 64 is the start of a geometric progression.
- In a geometric progression, each number is multiplied by the same number to get the next one.
