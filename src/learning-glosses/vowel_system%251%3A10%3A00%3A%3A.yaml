senseId: 'vowel_system%1:10:00::'
synsetId: 07128611-n
simpleMeaning: the set of open sounds, such as a, e, i, o and u, that one language uses
scope: The set of open sounds a language uses; not the set of its consonants, and not the sounds of all
  languages.
examples:
- English has a large vowel system with many sounds.
- The vowel system of French differs from that of Spanish.
