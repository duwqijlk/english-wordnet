simpleMeaning: The rate at which power is drawn from a source that makes a flow of power in a wire loop,
  stated in volts
scope: This is the rate at which power is drawn from a source that makes a flow of power in a wire loop,
  stated in volts; voltage and electromotive force are other names for it, not the flow itself and not
  the power used.
examples:
- The emf of the cell was stated in volts.
- They measured the emf across the wire loop.
