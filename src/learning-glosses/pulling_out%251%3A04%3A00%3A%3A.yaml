simpleMeaning: A way to stop pregnancy in which sex starts but the man takes his penis away before the
  seed leaves his body.
scope: A way to stop pregnancy by taking the penis away before seed leaves the body, also called withdrawal,
  onanism, coitus interruptus and withdrawal method; not a device and not a drug that stops pregnancy.
examples:
- They used pulling out as their way to stop pregnancy.
- Pulling out needs care, since seed may leave the body early.
