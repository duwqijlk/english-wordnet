simpleMeaning: Held between thumb and first finger, its two flat side parts let you turn this small threaded
  piece by hand.
scope: Also called butterfly nut, thumbnut, wing-nut, and wing nut, it is one of the fasteners made to
  be turned by a thumb and first finger.
examples:
- He turned the wing screw by hand until it sat tight.
- The wing screw came loose when she gripped its side pieces.
