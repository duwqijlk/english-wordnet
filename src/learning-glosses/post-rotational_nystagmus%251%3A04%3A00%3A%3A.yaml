simpleMeaning: Brought on by the body stopping its fast spin all at once, the eyes keep making big slow
  sweeps the other way round from the spin.
scope: This is the eye movement brought on by a sudden stop after fast spinning, not the spinning itself.
examples:
- Post-rotational nystagmus set in when the spinning stopped all at once.
- His eyes swept slowly the other way in post-rotational nystagmus after the fast spin.
