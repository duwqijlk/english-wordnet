simpleMeaning: A pale pink wild orchid of north-eastern America with a swollen pouch-like lip.
scope: Also called common lady's-slipper, showy lady's-slipper, showy lady slipper and Cypripedium album;
  among wild orchids of north-eastern America, this is the pale pink one with a swollen pouch-like lip,
  beside other orchids with plain lips and other pink wild flowers.
examples:
- Cypripedium reginae grows wild in north-eastern America.
- The Cypripedium reginae has a pale pink pouch-like lip.
