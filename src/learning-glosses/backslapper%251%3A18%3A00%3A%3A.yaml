simpleMeaning: a person who shows warm and friendly feelings in a way that is too strong or too eager
scope: A person who greets others with warm feelings that are too strong or too eager, not a person who
  is simply warm and quiet in manner.
examples:
- He is a backslapper who greets everyone with a hug and loud praise.
- The backslapper shook every hand in the room and called out to old friends.
