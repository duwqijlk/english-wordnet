simpleMeaning: A title Leo X gave to Henry VIII and later took back; Parliament gave it back, and English
  kings and queens have used it ever since
scope: This is a title first given to Henry VIII by Leo X, taken back, and then given back by Parliament;
  it stands apart from other royal titles by its history with Henry VIII and the English crown.
examples:
- Henry VIII was given the title Defender of the Faith by Leo X.
- English kings still use the title Defender of the Faith.
