simpleMeaning: to spin something round very fast so that the liquids in it move away from the solid parts
scope: This is the act of spinning something very fast to part liquids from solids, not the machine that
  does this spinning.
examples:
- The workers centrifuge the mixture to separate the water from the solid parts.
- She centrifuged the blood sample so the liquid moved away from the solid parts.
