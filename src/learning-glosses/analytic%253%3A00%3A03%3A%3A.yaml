simpleMeaning: using, or good at using, a way of thinking that splits a whole thing or idea into its most
  basic parts, or finds its most basic ideas behind it
scope: Also called analytical. This sense is about breaking a whole into its parts, not the grammar sense
  about using separate words, and not the maths sense about algebra and calculus.
examples:
- She has an analytic mind and breaks each problem into small parts.
- His analytic way of thinking helped him understand the report step by step.
