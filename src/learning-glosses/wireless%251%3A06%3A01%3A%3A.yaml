simpleMeaning: an electronic box that takes in signals sent through the air, sorts out the sound part
  and makes it loud enough to hear
scope: 'Also called radio: a receiver that turns broadcast signals into sound, not the whole system of
  sending signals through the air.'
examples:
- The old wireless crackled to life as she turned the dial.
- He switched on the wireless to hear the evening news.
