simpleMeaning: A heavy rodent of the high ground on the Pacific coast of North America digs holes and
  comes out at night; it is the earliest kind of rodent still living.
scope: 'Also called mountain beaver: a heavy-set rodent of the high ground of North America''s Pacific
  coast, not a true beaver.'
examples:
- The sewellel dug its burrow in the high ground.
- A sewellel came out only at night.
