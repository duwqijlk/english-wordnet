simpleMeaning: how unlike two things are, shown by their having nothing alike
scope: How unlike two things are, shown by their having nothing alike, also called unlikeness, and not
  a small difference between things that are mostly the same.
examples:
- The dissimilitude between the two plans was plain to everyone.
- Their dissimilitude in style made the two books hard to compare.
