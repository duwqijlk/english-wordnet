senseId: 'renal_artery%1:08:00::'
synsetId: 05361929-n
simpleMeaning: Blood reaches the kidneys, the small glands above them, and the tubes that take urine away
  through a blood tube from the main blood tube in the belly.
scope: This is a blood tube that carries blood to the kidneys, also called arteria renalis, not a blood
  tube that carries blood away from the kidneys.
examples:
- The renal artery carries blood from the belly's main blood tube to the kidney.
- A block in the renal artery can starve the kidney of blood.
