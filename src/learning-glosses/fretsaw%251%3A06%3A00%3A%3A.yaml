simpleMeaning: A power saw with a thin blade and fine teeth, used for cutting shapes with curved edges
scope: A thin-bladed power saw for curved cuts; jigsaw is another name for this sense, not a saw for straight
  cuts and not a saw worked by hand.
examples:
- He used a fretsaw to cut the curved edge.
- A fretsaw makes neat curves in thin wood.
