senseId: 'plosion%1:10:00::'
synsetId: 07131151-n
simpleMeaning: A burst of air at the end of a speech sound, let out with force after the air has been
  stopped, held back and built up
scope: Also called an explosion, this is the burst of air at the end of a stop sound in speech, not a
  loud bang and not the sound itself.
examples:
- The plosion at the end of the word 'top' lets out a burst of air.
- You can hear the plosion when the speaker lets the air go at the end of a stop sound.
