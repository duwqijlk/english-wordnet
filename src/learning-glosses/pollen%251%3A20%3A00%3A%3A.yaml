simpleMeaning: fine dust from flowers that holds the male cells for making seeds, carried on the small
  part of a flower that makes the dust
scope: Fine dust from flowers that holds the male cells for making seeds, carried on the small part of
  a flower that makes the dust; not the seed itself, and not the flower's scent.
examples:
- Pollen from the lilies dusted her sleeves yellow.
- Bees carry pollen from flower to flower.
