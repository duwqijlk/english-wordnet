simpleMeaning: A check that measures how much of a ray-giving chemical leaves the body in urine
scope: A check that measures ray-giving iodine leaving the body in urine; not the check that measures
  how much the thyroid takes in.
examples:
- The radioactive iodine excretion test showed how much iodine left in her urine.
- Doctors ordered a radioactive iodine excretion test after the dose.
