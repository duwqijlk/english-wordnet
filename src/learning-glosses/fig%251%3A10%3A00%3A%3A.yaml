simpleMeaning: a drawing that goes with words in a book, showing what the words mean
scope: A picture or drawing placed with written words to make clear what they say, also called a figure,
  not the fruit and not the tree.
examples:
- Look at the fig on page ten to see the parts.
- The fig shows how the machine works.
