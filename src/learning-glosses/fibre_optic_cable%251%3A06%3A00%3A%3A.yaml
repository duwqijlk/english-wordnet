simpleMeaning: A cord made of thin glass threads that can carry large amounts of information at the speed
  of light.
scope: A cord made of thin glass threads that can carry large amounts of information at the speed of light,
  also called fiber optic cable; not a copper wire and not a wireless link.
examples:
- The fibre optic cable carries the internet into our house.
- Workers laid a fibre optic cable under the street.
