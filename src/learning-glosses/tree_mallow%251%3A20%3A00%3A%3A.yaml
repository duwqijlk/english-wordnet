simpleMeaning: showy red-purple flowers grow on a tall, long-lived shrub with furry leaves shaped like
  a spread hand in the south-west of the United States
scope: Also called velvet-leaf and velvetleaf; a tall shrub of the south-west United States, not a low-growing
  mallow.
examples:
- The tree mallow by the wall was covered in bright red-purple flowers.
- We planted a tree mallow in the dry corner of the garden.
