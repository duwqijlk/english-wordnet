simpleMeaning: A wall, often put up for a short time, made of boards or cloth, that guides air through
  a mine.
scope: A board or cloth wall that guides air through a mine, not a mine shaft and not a door.
examples:
- The miners put up a brattice to send fresh air to the far end of the tunnel.
- A torn brattice let the air escape the wrong way.
