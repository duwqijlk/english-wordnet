simpleMeaning: In animals with backbones, the jaw bone is joined to the skull
scope: Also called maxillary, this is the jaw bone in animals with backbones that is joined to the skull,
  not the lower jaw that moves and not a tooth.
examples:
- The maxilla was broken in the fall.
- A fracture of the maxilla can make eating hard.
