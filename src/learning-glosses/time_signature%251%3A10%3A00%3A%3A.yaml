senseId: 'time_signature%1:10:00::'
synsetId: 06877574-n
simpleMeaning: In music, a mark that shows how many beats are in a bar and which kind of note gets one
  beat
scope: A mark in music that shows the beats in a bar; musical time signature is another name for this
  sense. Not a key signature, and not the speed of the music.
examples:
- The time signature at the start tells the players there are three beats in each bar.
- She changed the time signature from four beats to three.
