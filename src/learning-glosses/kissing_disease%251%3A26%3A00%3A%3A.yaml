simpleMeaning: An acute illness with fever and swollen lymph nodes, plus an excess of certain white blood
  cells; it is not very contagious, and some believe kissing can spread it.
scope: Another name for this illness is infectious mononucleosis, often shortened to mono; the nickname
  does not mean it spreads only through kissing, since it is not highly contagious.
examples:
- His friends teased him that kissing disease was why he missed the exams.
- Kissing disease is not actually passed on by every kiss, doctors point out.
