simpleMeaning: The tongue of the Normans in the Middle Ages, a form of the earliest tongue of France.
scope: Also called Norman-French and Norman French; the medieval Norman form of Old French, the tongue
  of the Normans in the Middle Ages.
examples:
- Old North French was spoken by the Normans in the Middle Ages.
- The Normans brought Old North French to England in 1066.
