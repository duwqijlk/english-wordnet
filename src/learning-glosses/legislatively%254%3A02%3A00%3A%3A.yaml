simpleMeaning: by a law made and passed by a group that makes laws
scope: By a law made and passed by a group that makes laws; not by a court ruling, and not by a single
  person's order.
examples:
- The tax was changed legislatively, not by the courts.
- The rule was set legislatively in the last session.
