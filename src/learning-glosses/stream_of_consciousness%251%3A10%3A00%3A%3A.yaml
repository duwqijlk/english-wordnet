simpleMeaning: a style in writing that shows a person's thoughts and feelings as they grow, through one
  long speech to oneself
scope: A way of writing that shows thoughts as they come, not a plain story told in order and not a short
  speech in a play.
examples:
- Her stream of consciousness novel follows one woman's thoughts through a single day.
- The stream of consciousness passage jumps from a memory to a smell to a fear.
