simpleMeaning: the part of the science of war that deals with small, careful moves made to reach aims
  set by a larger plan
scope: The part of war science about small moves made to reach aims set by a larger plan, not the larger
  plan itself.
examples:
- The general's tactics won the battle even though his army was smaller.
- Good tactics let a small force hold its ground against a larger one.
