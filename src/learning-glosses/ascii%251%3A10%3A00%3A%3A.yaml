simpleMeaning: In computer science, a code that lets machines of different makers share facts, where 7
  ones and zeros stand for each mark, and most small machines use it.
scope: In computer science, a code for sharing facts between machines, also called American Standard Code
  for Information Interchange, where 7 ones and zeros stand for each mark.
examples:
- ASCII lets old machines read the same files.
- The file was saved in ASCII.
