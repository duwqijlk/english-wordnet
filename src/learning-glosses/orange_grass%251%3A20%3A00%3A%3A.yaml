simpleMeaning: A North American weed that lives for one year, with thin tough stems, very small scale-like
  leaves and small yellow flowers
scope: 'Also called nitweed, pine-weed or pineweed: a small weed with tiny leaves and yellow flowers,
  not a grass of lawns and not a garden flower.'
examples:
- The orange grass grew in thin stems along the edge of the field.
- She bent down to look at the tiny yellow flowers of the orange grass.
