simpleMeaning: a little low place or bend in a flat smooth top, where the top is not even
scope: 'Also called a line, a wrinkle, a furrow, a crease, or a seam: a little low place or bend in a
  flat smooth top, not the act of making such folds.'
examples:
- There was a crinkle in the paper where it had been folded.
- She smoothed the crinkle out of the tablecloth.
