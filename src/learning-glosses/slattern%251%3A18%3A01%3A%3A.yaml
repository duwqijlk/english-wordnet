simpleMeaning: someone who walks the streets to find people who will pay for sex
scope: 'Also called a hooker, a hustler, a streetwalker or a floozy: someone who walks the streets to
  find people who will pay for sex, not a dirty or untidy woman.'
examples:
- In the old novel, a slattern walked the street at night looking for customers.
- The police told the slattern to move away from the corner where she waited for customers.
