simpleMeaning: In baseball, a slow throw that comes when the batter looks for a fast one
scope: In baseball, a slow throw that comes when the batter looks for a fast one; change-of-pace, change-of-pace
  ball and change-up are other names for this sense, not a fastball and not a wild throw.
examples:
- The off-speed pitch fooled the batter, who swung too soon.
- He threw an off-speed pitch when the batter waited for a fastball.
