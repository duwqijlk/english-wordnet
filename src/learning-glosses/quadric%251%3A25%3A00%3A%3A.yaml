simpleMeaning: A curve or a surface whose place on a graph is fixed by a set of numbers, with the highest
  power two
scope: 'Also called quadric surface: a curve or a surface whose numbers follow a rule with the highest
  power two, not a shape ruled by a higher power.'
examples:
- The quadric drawn on the board was a curve that bent back on itself.
- Our maths teacher showed us a quadric whose graph rose steeply on both sides.
