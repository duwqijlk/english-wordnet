simpleMeaning: A chemical compound made from a body substance that turns into ATP, the form that stores
  power for the body's work.
scope: A body chemical that turns into the power-storing form, not that power-storing form itself and
  not the plain building block it comes from.
examples:
- Adenosine diphosphate is changed into ATP when the cell needs stored power.
- Muscles use adenosine diphosphate as a step toward making ATP.
