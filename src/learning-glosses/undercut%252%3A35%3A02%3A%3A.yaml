simpleMeaning: to cut away material from the underside of a thing, so that a part above it is left hanging
  over it and standing out
scope: This sense cuts away the underside so a top part hangs over and stands out, not just cutting away
  the under part, and not hitting a ball so it spins back.
examples:
- The sculptor undercut the stone ledge so its edge stood out in shadow.
- He undercut the wood beneath the rim, leaving a lip that hung over the hollow below.
