simpleMeaning: to put out buds or branches, or to begin to grow from a seed
scope: 'Also called shoot, sprout, and spud: this is the start of new growth, a seed beginning to grow
  or a plant putting out buds or branches, not a plant simply getting bigger.'
examples:
- The seeds will germinate in warm, wet soil.
- Potatoes left in the dark may germinate and put out small shoots.
