simpleMeaning: A group of churches that follow the teaching of the Dutch thinker Jacobus Arminius, who
  stood against the strict Calvinist teaching that God fixed in advance who is saved.
scope: A group of Baptist churches following Arminius, also called Arminian Baptist; not Calvinist Baptists
  and not a single church.
examples:
- The General Baptist church in town follows Arminius.
- He was raised a General Baptist.
