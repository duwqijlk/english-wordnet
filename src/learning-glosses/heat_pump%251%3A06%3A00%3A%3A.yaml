simpleMeaning: A machine that takes warmth from a liquid warmer than what is around it and can move warmth
  from a store outside to warm a building
scope: This is a machine that takes warmth from a liquid and can move warmth from outside to warm a building,
  and not a machine that only cools a room.
examples:
- The heat pump warms the house in winter.
- We had a heat pump put in to heat the building.
