simpleMeaning: A bush or a small tree, often kept in the house, with leaves like those of the thing that
  lives on tree branches
scope: 'Also called a mistletoe rubber plant: a bush or small tree kept in the house for its leaves, not
  the kind that bears fruit to eat and not the thing that lives on tree branches.'
examples:
- The mistletoe fig in the hall has shiny leaves.
- She watered her mistletoe fig every week.
