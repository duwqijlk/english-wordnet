simpleMeaning: to bring up doubts in the mind about whether an action is right or good
scope: About bringing up doubt in the mind about whether an action is right, not about holding back from
  an action because of that doubt, and not the noun senses for the doubt itself or a rule about right
  and wrong.
examples:
- She scrupled about taking the money, and kept asking herself if it was right.
- He lied to his friend and did not even scruple about it.
