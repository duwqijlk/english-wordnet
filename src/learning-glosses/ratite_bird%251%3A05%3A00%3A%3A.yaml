senseId: 'ratite_bird%1:05:00::'
synsetId: 01520206-n
simpleMeaning: A flightless bird with a flat breastbone that lacks a keel, the ridge where wing muscles
  attach; ostriches, emus, rheas and kiwis are examples.
scope: This covers the flat-breastbone group; penguins are also flightless but have a keel, and this is
  not one single species such as the ostrich.
examples:
- The ostrich is the largest ratite bird, standing taller than any other living bird.
- Ratite birds such as emus and kiwis have a flat breastbone instead of a keel.
