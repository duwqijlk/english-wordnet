simpleMeaning: In engineering, this is the skill of trying to keep high water from coming often, by holding
  back rivers with dams and other such things.
scope: In engineering, this names the skill of trying to hold back rivers with dams, not the dams themselves.
examples:
- The town's flood control plan used dams along the river.
- They asked the engineers about flood control for the valley.
