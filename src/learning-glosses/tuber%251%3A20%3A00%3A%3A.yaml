simpleMeaning: a thick, soft underground stem or root of a plant that stores food and can make new plants
scope: This is the thick underground stem or root of a plant, the part that holds food and can grow new
  plants. It is not a thin root and not a leaf above ground.
examples:
- The potato is a tuber that grows under the ground.
- She dug up a tuber and planted it to grow a new plant.
