simpleMeaning: an older woman, as drawn in cartoons, with a big chest and a strong, lively way of acting
scope: This is the kind of older woman drawn in cartoons, with a big chest and a strong, lively manner,
  not a woman who leads a family or a group.
examples:
- In the cartoon, the matriarch was an older woman with a big chest who shouted orders at everyone.
- The artist drew the matriarch with a big chest and a strong, lively manner.
