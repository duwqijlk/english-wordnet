simpleMeaning: coming directly next in a chain of cause and effect, either before or after
scope: It means directly next in a chain of causes and effects, not very close in space or time and not
  done without delay.
examples:
- The immediate cause of the fire was a faulty wire.
- Rising prices were the immediate result of the shortage.
