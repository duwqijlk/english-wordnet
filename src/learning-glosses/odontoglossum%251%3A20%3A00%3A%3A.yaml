simpleMeaning: Showy flowers, usually large and in many colours, grow in loose bunches on any of many
  different kinds of orchid.
scope: Any of many kinds of orchid with showy flowers in many colours.
examples:
- Her odontoglossum shows big pink and yellow blooms.
- He grows odontoglossums for their large showy flowers.
