simpleMeaning: showing unjust harshness, with power used at will and without good reason
scope: Unfair, harsh rule or treatment, not a heavy feeling in the air or the heart.
examples:
- They lived under an oppressive government that jailed its critics.
- The oppressive laws left people with no say in how they were ruled.
