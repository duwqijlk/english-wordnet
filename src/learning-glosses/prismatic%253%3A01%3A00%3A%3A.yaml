simpleMeaning: to do with, like, or being a prism (a solid shape with flat sides)
scope: This sense is about the shape or form linked to a prism, not about showing bright colours made
  when light passes through a prism.
examples:
- The mineral has a prismatic form.
- She held up a small prismatic block of glass.
