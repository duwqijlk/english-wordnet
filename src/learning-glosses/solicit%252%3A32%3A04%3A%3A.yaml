simpleMeaning: to push or talk someone into breaking the law or not obeying a person in charge
scope: Pushing someone to break the law or disobey, not asking strongly and again and again for money
  or help, and not making a request for something wanted.
examples:
- He was charged with soliciting his workmates to destroy the papers.
- She solicited two men to attack the shop owner.
