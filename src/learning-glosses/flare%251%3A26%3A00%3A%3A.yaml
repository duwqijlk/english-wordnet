simpleMeaning: skin that turns red and the red part gets wider from the spot where it is sore or hurt
scope: Skin that turns red and spreads out from a sore spot, not a sudden return of bad signs of a sickness
  and not a burst of flame.
examples:
- A flare of red spread out from the bite on her arm.
- The flare around the cut grew wider by night.
