simpleMeaning: to make something move up and down or from side to side, again and again
scope: Making a thing move like a wave; not the sense where a thing moves up and down on its own, with
  nothing making it move.
examples:
- The breeze fluctuated the surface of the lake all afternoon.
- Strong winds fluctuated the needle on the gauge.
