simpleMeaning: Over each eye, a hard, horn-like point marks this snake of northern Africa and southwestern
  Asia, whose bite can kill.
scope: Cerastes, horned asp, and horned viper are other names for this snake of northern Africa and southwestern
  Asia, whose bite can kill, not the harmless North American snake of the same name.
examples:
- The sand viper moved across the sand.
- The sand viper raised its head and showed the point above each eye.
