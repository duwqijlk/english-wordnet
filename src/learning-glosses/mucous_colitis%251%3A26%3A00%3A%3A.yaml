simpleMeaning: pain in the belly and loose bowels that keeps coming back, often changing to hard stools,
  and often tied to worry or upset feelings
scope: 'Also called irritable bowel syndrome or a spastic colon: pain in the belly and loose bowels that
  keeps coming back, often changing to hard stools and often tied to worry; not a short stomach upset
  and not a bowel infection.'
examples:
- Mucous colitis gave her belly pain that kept coming back.
- His mucous colitis flared up when he was under stress.
