simpleMeaning: Cut from a young sheep and made ready as meat, this piece takes in the bone in the middle
  of the chest and the flesh joined to it.
scope: Also called poitrine d'agneau, this cut of young sheep meat takes in the chest bone and the flesh
  joined to it, made ready as meat.
examples:
- The breast of lamb included the bone in the middle of the chest and the flesh joined to it.
- The breast of lamb came from a young sheep.
