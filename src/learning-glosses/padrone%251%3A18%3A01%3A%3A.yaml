simpleMeaning: a boss in the United States who takes unfair advantage of workers who have come from Italy
scope: A boss in the United States who takes unfair advantage of workers who have come from Italy; not
  a fair boss and not a boss of workers born in the United States.
examples:
- The padrone paid the Italian workers far too little.
- Many newcomers fell under the power of a padrone.
