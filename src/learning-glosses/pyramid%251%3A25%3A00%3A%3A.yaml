simpleMeaning: a solid shape with a flat base that has straight sides, and other sides each shaped like
  a triangle that meet at one point at the top
scope: The solid shape with a flat base and triangle sides meeting at the top. Not buying more shares
  on the stock market, and not putting things up in a pile.
examples:
- The toy was shaped like a small pyramid with a square base.
- In class we made a pyramid from card, with four triangle sides.
