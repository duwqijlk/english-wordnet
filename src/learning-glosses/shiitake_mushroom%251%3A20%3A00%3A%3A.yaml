simpleMeaning: 'The stem cannot be eaten, though the cap of this east Asian fungus can: golden, or dark
  brown to blackish.'
scope: Golden oak mushroom and shiitake are other names for this east Asian fungus whose cap can be eaten
  but whose stem cannot.
examples:
- The cook put shiitake mushroom caps in the pan and left the stems out.
- The shiitake mushroom caps went into the soup, but the stems stayed out.
