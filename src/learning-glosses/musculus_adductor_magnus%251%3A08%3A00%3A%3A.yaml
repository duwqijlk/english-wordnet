simpleMeaning: Pulling the thigh in toward the body and moving it back is the work of this band of flesh
  in the upper leg
scope: 'Also called the great adductor muscle: the band of flesh in the upper leg that pulls the thigh
  in and moves it back, not the one at the front of the thigh and not the one that bends the knee.'
examples:
- The musculus adductor magnus pulls the thigh in when the rider grips the horse.
- Damage to the musculus adductor magnus made it hard for him to bring his leg back.
