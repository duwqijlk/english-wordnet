simpleMeaning: To cut a long narrow hollow into a thing, in the shape of a furrow
scope: To cut a long narrow hollow in the shape of a furrow, not the hollow itself and not the act of
  fitting a thing with such a hollow; also called furrow.
examples:
- He grooved the wood with a chisel.
- They grooved the soil before planting.
