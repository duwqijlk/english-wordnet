simpleMeaning: done because someone or something made it necessary, not by free choice.
scope: This describes something imposed by pressure or necessity, not something done willingly and not
  a smile that looks unnatural.
examples:
- The workers faced a forced relocation to another city.
- Under forced labor, prisoners had no say in their tasks.
