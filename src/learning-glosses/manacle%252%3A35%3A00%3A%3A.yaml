simpleMeaning: To hold someone still with metal rings round the wrists, or as if with such rings.
scope: To hold someone still with metal rings round the wrists, or as if with such rings, with cuff and
  handcuff as other names for this sense, and not the metal rings themselves.
examples:
- The police manacled the suspect at the scene.
- They manacled his wrists before leading him away.
