simpleMeaning: to put things one on top of another so they start wide at the bottom and get smaller towards
  the top
scope: This is about putting or building things in a wide-to-narrow stack, not the hard shape itself and
  not buying and selling shares.
examples:
- She pyramided the boxes with the largest ones at the bottom.
- The workers pyramided the stones so the pile grew narrower at the top.
