simpleMeaning: a horizontal beam set across two parts of a structure to keep them from spreading apart
scope: The horizontal structural beam sense, not the railway cross brace under the rails or the necktie.
examples:
- The carpenter fitted a tie beam across the rafters to stop them spreading.
- Steel ties kept the two walls from bowing apart.
