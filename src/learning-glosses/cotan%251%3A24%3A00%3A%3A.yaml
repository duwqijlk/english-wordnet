simpleMeaning: In maths, the number got by dividing the side next to an angle in a right-angled triangle
  by the side across from it.
scope: In maths, this is the number got by dividing the side next to an angle in a right-angled triangle
  by the side across from it; cotangent is another name for this sense, not the number got by dividing
  the longest side and not the angle itself.
examples:
- The cotan of the angle is one half.
- We worked out the cotan from the two sides.
