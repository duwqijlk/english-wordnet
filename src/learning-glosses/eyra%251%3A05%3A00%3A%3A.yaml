simpleMeaning: A wild cat of warm parts of the Americas, with a long body and a long tail.
scope: A long-bodied, long-tailed wild cat of warm America, also called the jaguarondi, the jaguarundi
  or the jaguarundi cat; not an ocelot and not a house cat.
examples:
- An eyra slipped through the tall grass at dusk.
- The eyra is a wild cat with a long body and tail.
