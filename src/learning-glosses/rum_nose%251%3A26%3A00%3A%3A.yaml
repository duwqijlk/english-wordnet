simpleMeaning: the nose often grows big and red in people who drink far too much alcohol, its pores widening
  and its blood vessels showing through the skin
scope: Also called a rum-blossom, a brandy nose, a copper nose, a hammer nose, hypertrophic rosacea, a
  potato nose, rhinophyma, and a toper's nose; a swollen red nose, not a nose broken in a fall.
examples:
- Years of heavy drinking had left him with a rum nose.
- His rum nose was red and swollen.
