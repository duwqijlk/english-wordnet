simpleMeaning: A Chinese puzzle of a square cut into seven pieces that must be put together to make set
  shapes
scope: A Chinese puzzle of seven pieces from one square, put together to make set shapes; not a jigsaw
  with many pieces and not a word puzzle.
examples:
- We spent the evening working on a tangram puzzle.
- She arranged the tangram pieces into the shape of a cat.
