simpleMeaning: a book that lists, in order from A to Z, the names of people who pay for a telephone service
  and their telephone numbers
scope: Also called a phone book, a telephone book, and a telephone directory, this is the book of names
  and numbers in A to Z order, not a personal list of contacts.
examples:
- I looked up her number in the phonebook.
- The phonebook lists homes in the town in order from A to Z.
