synsetId: 02623391-v
simpleMeaning: To live at an easy pace, doing as you like and caring little about duty.
scope: This is how someone lives over time, carefree and without much sense of duty, and freewheel is
  another name for it; it is not moving from place to place and not driving livestock.
examples:
- He drifted through his twenties, taking odd jobs and never making plans.
- They drifted along for months, ignoring deadlines and doing as they pleased.
