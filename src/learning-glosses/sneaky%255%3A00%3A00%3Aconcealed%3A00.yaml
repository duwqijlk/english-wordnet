simpleMeaning: acting in a hushed, careful way so that no one sees what you are doing, and working hard
  to stay hidden
scope: 'Also called sneak and furtive: acting quietly and carefully so as not to be seen, not acting openly
  or carelessly.'
examples:
- He took a sneaky look at his watch during the meeting.
- The sneaky footsteps in the hall made her turn around.
