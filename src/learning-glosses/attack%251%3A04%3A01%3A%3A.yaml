simpleMeaning: The firm, confident way a player begins a note or a musical phrase.
scope: This sense is not violence done to someone, nor a sudden bout of illness.
examples:
- The trumpeter's attack was crisp, every note starting exactly together with the beat.
- The cellist's attack in the opening bars was bold and perfectly controlled.
