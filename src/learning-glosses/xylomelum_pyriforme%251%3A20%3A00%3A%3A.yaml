simpleMeaning: A tree that bears pear-shaped fruit with a thick hard outer skin.
scope: A tree with pear-shaped fruit in a thick woody skin, also called native pear and woody pear; the
  thick woody skin of its fruit sets it apart from other fruit trees.
examples:
- The Xylomelum pyriforme bore pear-shaped fruit this year.
- We cut open a fruit of the Xylomelum pyriforme to see its thick skin.
