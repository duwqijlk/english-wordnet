simpleMeaning: a person who chases people who have run away from the law, to get the money offered for
  catching them
scope: A person who chases people who have run away from the law to get the money offered, not a police
  officer and not a person who kills wild animals for a reward.
examples:
- The bounty hunter tracked the escaped prisoner across the state.
- A bounty hunter caught the man the court was looking for.
