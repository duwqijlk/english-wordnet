simpleMeaning: A South American shrub with pale pink flowers and egg-shaped reddish-brown fruit that can
  be eaten and looks somewhat like a tomato.
scope: Another name for the tree tomato, the South American shrub grown for its egg-shaped reddish-brown
  fruit; not the common garden tomato, and not the pepino.
examples:
- The tamarillo in our garden is covered in pale pink flowers.
- Tamarillos are grown for their egg-shaped reddish-brown fruit.
