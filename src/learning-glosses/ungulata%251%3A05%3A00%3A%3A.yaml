simpleMeaning: In former groupings, a large group of all hoofed mammals, now split into the odd-toed kind
  and the even-toed kind.
scope: A former large group of hoofed mammals, not meat-eaters and not rodents; it is now split into odd-toed
  and even-toed kinds.
examples:
- Ungulata once held all the hoofed mammals.
- Horses and cows were both in Ungulata under the old books.
