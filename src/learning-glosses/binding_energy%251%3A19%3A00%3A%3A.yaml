simpleMeaning: The same as the loss of mass, this is the work needed to pull tiny parts out of a molecule,
  an atom, or its core.
scope: Also called separation energy, this is the work needed to pull tiny parts out of a molecule, an
  atom, or its core, and it is the same as the loss of mass.
examples:
- Pulling the tiny parts out of the atom takes binding energy.
- The binding energy of a molecule is the same as its loss of mass.
