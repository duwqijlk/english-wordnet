simpleMeaning: whole tones mark most steps of this set of notes, but the steps from the 3rd to the 4th
  and from the 7th to the 8th are smaller
scope: Also called major diatonic scale, this set of notes moves mostly by whole tones, with smaller steps
  only from the 3rd to the 4th and from the 7th to the 8th.
examples:
- The band opened with a run up the major scale.
- He wrote the tune in the major scale.
