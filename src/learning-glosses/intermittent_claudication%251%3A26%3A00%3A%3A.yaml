senseId: 'intermittent_claudication%1:26:00::'
synsetId: 14573787-n
simpleMeaning: Too little blood reaching the leg muscles brings pain that makes a person limp, and the
  pain eases when they rest
scope: A limp from pain in the leg muscles when too little blood reaches them, eased by rest; not a limp
  from an injury and not a steady pain that rest does not ease.
examples:
- His intermittent claudication forced him to stop and rest every few hundred yards.
- She learned to live with intermittent claudication by walking slowly and resting often.
