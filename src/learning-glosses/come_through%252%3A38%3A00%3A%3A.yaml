simpleMeaning: To get to a place or a goal after getting past hard problems
scope: To get to a place or a goal after getting past hard problems; get through is another name for this
  sense, not merely to arrive and not to give up.
examples:
- After months of talks, they came through with a deal.
- She came through the hard year and kept her job.
