simpleMeaning: moving in a bumpy, uneven way, as if over a surface that is not smooth
scope: 'Also called rough: moving in a bumpy way over a surface that is not smooth; not for amounts that
  are close but not exact, and not for treating someone in a hard, violent way.'
examples:
- The cart rolled roughly over the stones.
- We rode roughly along the dirt road, bouncing at every hole.
