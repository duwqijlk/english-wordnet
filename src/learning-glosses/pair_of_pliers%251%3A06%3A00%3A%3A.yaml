simpleMeaning: A hand tool for gripping, with two arms joined by a hinge and jaws that usually have teeth
scope: A hand tool for gripping, with two hinged arms and jaws that usually have teeth; pliers and plyers
  are other names for it, not pincers for holding and not scissors.
examples:
- She used a pair of pliers to pull out the nail.
- The pair of pliers had red rubber handles.
