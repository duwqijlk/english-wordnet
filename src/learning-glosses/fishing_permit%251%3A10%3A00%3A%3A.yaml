simpleMeaning: The person who holds this paper may catch fish for a set length of time
scope: 'Also called a fishing licence and a fishing license: a paper that lets its holder catch fish for
  a set time, not a paper that lets someone hunt and not a paper that lets someone drive.'
examples:
- You need a fishing permit to fish in the lake.
- His fishing permit ran out last week.
