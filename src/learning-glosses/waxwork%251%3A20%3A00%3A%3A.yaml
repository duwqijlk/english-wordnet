simpleMeaning: a bush from North America that climbs by winding around other things, with yellow cases
  that hold bright red seeds
scope: This plant is also called bittersweet, climbing bittersweet, false bittersweet, shrubby bittersweet
  and staff vine; it is a climbing bush, not a figure made of wax.
examples:
- The waxwork climbed over the fence, its yellow cases opening to show bright red seeds.
- Waxwork grows wild in woods in North America.
