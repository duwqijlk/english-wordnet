simpleMeaning: A covering that shields the front of the head in games such as baseball, football or hockey.
scope: A covering that shields the front of the head in baseball, football or hockey, not a helmet and
  not a mouth shield.
examples:
- The catcher wore a face mask behind the plate.
- A face mask guards the head in hockey.
