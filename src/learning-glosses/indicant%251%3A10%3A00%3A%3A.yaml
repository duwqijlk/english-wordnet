senseId: 'indicant%1:10:00::'
synsetId: 06652323-n
simpleMeaning: a figure or a comparison, a value on a measuring scale, made from a set of facts that were
  seen, which can show changes over time
scope: A figure on a measuring scale, made from facts that were seen, which shows change over time; index,
  indicator and index number are other names for this sense, not a single count and not a price on its
  own.
examples:
- The indicant moved up as prices rose.
- She checked the indicant each month.
