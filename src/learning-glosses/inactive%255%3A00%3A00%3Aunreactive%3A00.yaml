simpleMeaning: In chemistry, not taking part in a chemical reaction (a change where things join or break
  apart to make new things) and not reacting at all
scope: In chemistry, this is a thing that does not react with other things. Not a quiet volcano, and not
  a thing lying unused.
examples:
- The inactive gas does not react with the other chemicals in the tube.
- They chose an inactive powder that does not react when it is put with the liquid.
