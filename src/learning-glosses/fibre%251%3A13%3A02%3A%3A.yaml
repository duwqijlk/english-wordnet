simpleMeaning: rough plant food that the body cannot break down, with little in it that the body needs;
  its bulk helps food move through the gut
scope: 'Also called fiber, and also called roughage: this is plant food that helps food move through the
  body. It is not a person''s character and not thread-like material for making yarn.'
examples:
- Beans have a lot of fibre, which helps food move through your body.
- Eating fibre from plants helps keep your gut working well.
