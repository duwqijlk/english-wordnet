simpleMeaning: any one of the building blocks found in the clear yellowish liquid part of blood
scope: Any one of the building blocks in the liquid part of blood, not the red cells that carry air, and
  not the white cells that fight sickness.
examples:
- The lab measured the plasma protein in her blood.
- A low plasma protein level can show poor food intake.
