simpleMeaning: New land slowly made as the sea pulls back or as mud and sand settle.
scope: New land slowly made as the sea pulls back or as mud and sand settle; not the mud and stones a
  fast stream drops and not a flood plain.
examples:
- Alluvion added new ground along the shore.
- The alluvion grew year by year.
