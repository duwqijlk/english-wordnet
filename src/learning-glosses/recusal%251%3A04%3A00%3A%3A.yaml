simpleMeaning: In law, when either side objects, or the judges step aside themselves, a judge or jury
  is taken off a case because of bias or a clash of interests.
scope: In law, a judge or jury taken off a case for bias or a clash of interests is also called recusation.
examples:
- The lawyer asked for the recusal of the judge, saying he had a clash of interests.
- A recusal can follow when either side objects to the judge.
