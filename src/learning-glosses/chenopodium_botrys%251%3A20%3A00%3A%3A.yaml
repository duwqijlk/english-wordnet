simpleMeaning: A Eurasian aromatic goosefoot with oak-like leaves and many yellow-green flowers, now growing
  wild in North America.
scope: Also called feather geranium, Atriplex mexicana, Jerusalem oak and Mexican tea, this Eurasian aromatic
  goosefoot is known by its oak-like leaves and many yellow-green flowers and by now growing wild in North
  America, among other goosefoots and other aromatic plants.
