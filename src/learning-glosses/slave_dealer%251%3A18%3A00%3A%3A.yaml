simpleMeaning: A person whose work is buying and selling people held as property
scope: A person whose work is buying and selling people held as property, also called a slaver or a slave
  trader; not a person who keeps such people to work for them, and not a person who buys and sells goods.
examples:
- The slave dealer grew rich from the trade in human lives.
- A slave dealer bought the captives at the market.
