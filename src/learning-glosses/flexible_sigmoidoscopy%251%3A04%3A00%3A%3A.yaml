simpleMeaning: A look inside the lower third of the large bowel with a bendy tube, done to search for
  small growths.
scope: A look inside the lower third of the large bowel with a bendy tube, done to search for small growths;
  not a look at the whole bowel, and not a look with a stiff tube.
examples:
- The doctor ordered a flexible sigmoidoscopy to check the lower bowel.
- A flexible sigmoidoscopy can find small growths early.
