simpleMeaning: Yellow wood with straight lines in it comes from this big Australian tree, and it goes
  brown when left in the air.
scope: Also called brown pine and Podocarpus elatus, this is a big Australian tree with yellow wood that
  goes brown in the air, not a small bush and not a tree grown for fruit.
examples:
- The Rockingham podocarp in the park has yellow wood that goes brown in the air.
- They cut a Rockingham podocarp for its yellow wood.
