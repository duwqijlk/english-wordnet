simpleMeaning: A gear with angled teeth allows two shafts to turn at different speeds; on a car's rear
  axle it lets the wheels turn at different rates around curves.
scope: This is the toothed wheel on a car's rear axle that lets the two wheels turn at different speeds;
  differential is another name for the same part, and it is not a mathematical derivative or the adjective
  meaning 'showing a difference'.
examples:
- The mechanic replaced the differential gear after the rear axle began to whine.
- Without a differential gear, the outer wheel would drag around every turn.
