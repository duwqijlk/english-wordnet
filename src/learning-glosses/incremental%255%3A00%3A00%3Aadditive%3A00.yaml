senseId: incremental%5:00:00:additive:00
synsetId: 00049486-s
simpleMeaning: growing slowly, step by step, by the same amounts or by set steps added again and again
scope: This sense is about slow growth in set steps, not about a sudden big rise and not about staying
  the same size or amount.
examples:
- The workers got small incremental pay rises each year.
- She made incremental changes, adding a little to the plan step by step each month.
