simpleMeaning: A unit of push that tells how hard power goes in a wire, one amp through one ohm, with
  one watt of power lost.
scope: The unit that tells how hard power pushes through a wire; also called volt, and not the metal,
  and not the letter.
examples:
- The battery gives twelve volts.
- One volt is a small push.
