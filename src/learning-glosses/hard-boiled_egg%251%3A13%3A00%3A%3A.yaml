simpleMeaning: A white and yellow-centred food warmed gently in hot water until both parts turn firm
scope: A white and yellow-centred food warmed gently in hot water until both parts turn firm, not a soft-boiled
  egg and not a fried egg; hard-cooked egg is another name for this sense.
examples:
- She peeled a hard-boiled egg for the salad.
- A hard-boiled egg has a firm white and yolk.
