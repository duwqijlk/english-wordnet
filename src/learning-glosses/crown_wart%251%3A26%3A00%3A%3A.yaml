simpleMeaning: a disease of the plant alfalfa, caused by a fungus, that makes white lumps grow at the
  foot of its stem
scope: A disease of alfalfa that makes white lumps grow at the foot of the stem; not a blaze in trees
  and not a kind of glass.
examples:
- Crown wart left white lumps at the foot of the alfalfa stems.
- The farmer found crown wart on his alfalfa crop.
