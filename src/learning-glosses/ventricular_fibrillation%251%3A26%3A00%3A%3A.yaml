senseId: 'ventricular_fibrillation%1:26:00::'
synsetId: 14386544-n
simpleMeaning: The heart may stop when its muscle shakes fast and unevenly, breaking up its steady beat.
scope: A fast, uneven shaking of the heart muscle that breaks up its steady beat and may stop the heart,
  not a heart that has already stopped.
examples:
- The heart monitor showed ventricular fibrillation, a fast uneven shaking of the heart muscle.
- Ventricular fibrillation breaks up the heart's steady beat.
