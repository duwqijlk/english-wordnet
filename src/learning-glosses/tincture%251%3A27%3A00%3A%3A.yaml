senseId: 'tincture%1:27:00::'
synsetId: 15010563-n
simpleMeaning: A material used to give color to something else
scope: This is a thing used to give color; it is not the medicine made from a plant part in alcohol, and
  not the verb for putting a small amount of color on something.
examples:
- She put a tincture on the cloth to give it a deep red color.
- The artist used a tincture made from plants to color the wool.
