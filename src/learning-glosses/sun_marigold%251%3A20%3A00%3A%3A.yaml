simpleMeaning: A mass of most often yellow flowers like daisies, with mounds of strong-smelling leaves,
  is why people grow this South African plant, one of many kinds.
scope: Cape marigold and star of the veldt are other names for this South African plant, grown for its
  mass of most often yellow flowers like daisies.
examples:
- The sun marigold bears a mass of yellow flowers like daisies.
- People grow the sun marigold for its flowers and its strong-smelling leaves.
