simpleMeaning: to colour cloth after knotting it, so the colour falls in uneven shapes
scope: This is colouring cloth that has been knotted first, to make uneven shapes; not plain dyeing and
  not printing a set design.
examples:
- The children tie-dyed their T-shirts in bright swirls.
- We will tie-dye this old sheet for the party.
