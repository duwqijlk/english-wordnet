senseId: vagabond%5:00:02:unsettled:01
synsetId: 02136116-s
simpleMeaning: moving from place to place with no aim and no ties to a place or a group of people
scope: 'Also called rootless: this describes a person or life with no aim and no ties to any place or
  group of people. It is not the verb for travelling in search of food or work, and not the sense about
  always changing home or job.'
examples:
- He led a vagabond life, with no home town to call his own.
- The vagabond travellers belonged to no town and stayed nowhere for long.
