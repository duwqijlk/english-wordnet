simpleMeaning: A flowering garden plant native to the Old World, prized for its vivid blooms.
scope: This sense is the Old World garden plant grown for its bright flowers, not the Malcolmia plant,
  the graft rootstock, the thick perennial stem, the broth, shop merchandise, company shares, a share
  certificate, a stored supply, a gun or tool handle, lumber, a white cravat, farm animals or a breed
  of them, a family line, reputation, the adjective senses (overused, routine, standard), or any verb
  sense (keep on hand, equip, supply with fish or livestock, amass, furnish, sprout).
examples:
- The stocks along the wall opened their white blooms in June.
- She grew stocks from seed for their scent and bright color.
