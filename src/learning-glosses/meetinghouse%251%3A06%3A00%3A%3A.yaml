simpleMeaning: A building where people gather to worship, used above all by Nonconformists such as Quakers
scope: A building for religious worship, used above all by Nonconformists such as Quakers; conventicle
  is another name for this, not a church with a priest in charge and not a hall for public gatherings.
examples:
- The Quakers built a meetinghouse on the hill.
- They gathered at the meetinghouse every Sunday.
