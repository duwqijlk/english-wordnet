simpleMeaning: Rooms and stores for people and goods, sheds for planes, and a tower that guides them,
  on a landing ground for planes.
scope: Also called an airport, an aerodrome, or an airdrome, it is the ground where planes land and take
  off, with a tower, sheds for planes, and rooms and stores for people and goods.
examples:
- The drome's tower guided the plane in through the fog.
- Trucks unloaded cargo at the drome while passengers waited inside.
