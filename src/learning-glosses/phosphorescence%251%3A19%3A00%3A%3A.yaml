senseId: 'phosphorescence%1:19:00::'
synsetId: 11511426-n
simpleMeaning: light that a thing gives off when rays hit it, and that keeps shining after the rays stop
scope: Light that keeps shining after the rays that caused it have stopped, not light that stops at once
  when the rays stop and not light from a lamp or a fire.
examples:
- The phosphorescence of the clock hands kept them shining in the dark after the light was turned off.
- Tiny sea animals left a phosphorescence that kept the water shining for a while.
