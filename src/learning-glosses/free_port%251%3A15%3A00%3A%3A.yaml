simpleMeaning: A place next to a harbour where goods meant to be sent on elsewhere can be taken in and
  kept without paying duty
scope: A harbour area for goods in transit; free zone is another name for this sense, not an ordinary
  harbour where duty is paid on arrival and not a warehouse for local sale.
examples:
- Ships unload at the free port before the cargo moves on.
- The free port lets traders store tea without paying duty.
