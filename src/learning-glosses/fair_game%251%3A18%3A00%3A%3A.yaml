simpleMeaning: A person picked out by a hostile person or force to be attacked, most of all to be mocked
  or used for gain.
scope: A person picked out by a hostile person or force to be attacked, most of all to be mocked or used
  for gain, also called a target, prey or quarry; not a fair contest and not a hunted animal.
examples:
- After the scandal, he was fair game for every newspaper.
- Everyone was fair game for the muggers that night.
