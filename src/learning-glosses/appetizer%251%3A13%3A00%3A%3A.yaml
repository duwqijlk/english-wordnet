simpleMeaning: food or drink that makes a person want to eat more, usually served before a meal or as
  the first part of a meal
scope: 'Also called starter: food or drink served first, not the main part of a meal and not a sweet dish
  at the end.'
examples:
- We had a small bowl of soup as an appetizer before the fish.
- The waiter brought little plates of cheese as appetizers.
