simpleMeaning: about or to do with the outer sex parts of the body
scope: 'Also called genital: about the outer sex parts of the body; not about sex itself in general, and
  not a name for a disease on its own.'
examples:
- Venereal warts grow on the outer sex parts of the body.
- The book names the venereal parts and says what each part does.
