simpleMeaning: In law, a hurt person has the right to money for losses that can easily be shown to have
  happened.
scope: Also called actual damages and general damages, this money in law goes to a hurt person for losses
  that can easily be shown to have happened, and the hurt person has the right to receive it.
examples:
- The court ordered compensatory damages for the money she had lost.
- He received compensatory damages after the accident ruined his shop.
