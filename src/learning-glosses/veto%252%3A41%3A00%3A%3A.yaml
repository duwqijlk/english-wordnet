simpleMeaning: To say no to something by voting, or by refusing to give your support or agreement
scope: 'Also called negative and blackball: to vote against or refuse to support a plan, not the noun
  sense that means the power to do this.'
examples:
- The president vetoed the new law.
- The group vetoed the plan to build a new road.
