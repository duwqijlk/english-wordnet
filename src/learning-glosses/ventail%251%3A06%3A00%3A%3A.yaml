simpleMeaning: a hood of small linked rings of metal hung from a light helmet to guard the head and neck
  in the Middle Ages
scope: 'Also called aventail and camail: a hood of linked metal rings hung from a helmet to guard the
  head and neck, not a full suit of armour and not a cloth hood.'
examples:
- The knight lowered his ventail to guard his neck before the fight.
- Her ventail of linked rings hung from her helmet as she rode.
