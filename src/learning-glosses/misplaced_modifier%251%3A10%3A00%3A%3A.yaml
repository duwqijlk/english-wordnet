schema: oewn-learning-gloss-v2
senseId: 'misplaced_modifier%1:10:00::'
synsetId: 06334815-n
simpleMeaning: 'A word or phrase that seems to modify the wrong word in a sentence because of where it
  stands: ''when young'' in ''when young, circuses appeal to all of us''.'
scope: Also called dangling modifier, it is a word or phrase in a sentence that seems to modify a word
  it was not meant for.
examples:
- In 'when young, circuses appeal to all of us', 'when young' is a misplaced modifier.
- '''Running fast, the bus left him behind'' has a misplaced modifier.'
