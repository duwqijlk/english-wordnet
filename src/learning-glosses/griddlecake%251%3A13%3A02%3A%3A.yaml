simpleMeaning: A small round bread made by letting a spoonful of soft mixture fall on a hot flat pan.
scope: 'Also called a drop scone: a small bread made by dropping batter on a hot pan, not a flat round
  of thin batter cooked on both sides and not a loaf baked in an oven.'
examples:
- He dropped spoonfuls of batter to make griddlecakes.
- This griddlecake rose thick on the hot pan.
