simpleMeaning: A way of building that took its ideas from the building of the Middle Ages and stood against
  the new classical-style revivals in the United States and Great Britain
scope: 'Also called Gothic revival, Gothic revival architecture, and neo-Gothic: a way of building that
  took its ideas from the building of the Middle Ages and stood against the new classical style, not the
  building of the Middle Ages itself.'
examples:
- The neo-Gothic architecture of the church drew on medieval forms.
- Neo-Gothic architecture spread through the United States and Great Britain.
