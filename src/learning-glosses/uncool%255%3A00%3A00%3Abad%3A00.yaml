simpleMeaning: used in spoken slang to say that someone or something is dull and not in fashion
scope: A word from spoken slang for a person or thing that is out of fashion and dull; it is not about
  low temperature and not about staying calm.
examples:
- He thought his dad's old jacket was totally uncool.
- At her school, wearing socks with sandals was seen as uncool.
