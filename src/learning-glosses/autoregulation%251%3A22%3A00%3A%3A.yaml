simpleMeaning: In living things, a cell or a whole body keeps its inner state steady for the most part,
  by ways of its own.
scope: This is how a cell or a body keeps its inner state steady for the most part, on its own.
examples:
- The organism kept its inner state steady by autoregulation.
- Without autoregulation, the cell could not hold its inner state steady.
