simpleMeaning: In Chinese philosophy, life energy is believed to flow through all things; traditional
  Chinese medicine holds that balancing its positive and negative forms in the body is essential for health.
scope: The Chinese idea of a life force, also called chi or qi, not a person's spirit or soul and not
  ordinary physical energy.
examples:
- She practices tai chi to strengthen the flow of ki in her body.
- The healer spoke of restoring balance to his ki.
