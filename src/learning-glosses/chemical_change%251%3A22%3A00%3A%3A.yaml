simpleMeaning: In chemistry, any happening set by the tiny parts and the way they are put together in
  the things that take part
scope: In chemistry, a happening set by the tiny parts of the things that take part; chemical action and
  chemical process are other names for this sense, not a change in heat alone and not a thing made by
  joining parts.
examples:
- A chemical change turned the milk sour.
- Rust is a chemical change in iron.
