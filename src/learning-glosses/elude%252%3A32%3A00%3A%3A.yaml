simpleMeaning: to slip past a duty, a question, or a problem instead of facing it, so you never have to
  do it, answer it, or deal with it
scope: Also called duck, skirt, hedge, dodge, evade, and parry; to get out of facing a duty, a question,
  or a problem, not to escape from a place or a person.
examples:
- He eluded the question by changing the subject.
- She eluded her duties and left the work to others.
