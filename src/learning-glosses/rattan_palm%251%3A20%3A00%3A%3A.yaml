simpleMeaning: Its stems grow to a great length, and this climbing palm of Sri Lanka and southern India
  gives the stems used for malacca canes.
scope: Also called rattan, it is a climbing palm of Sri Lanka and southern India, known for the great
  length of its stems, which are used for malacca canes.
examples:
- The rattan palm grows in Sri Lanka.
- Long stems from the rattan palm make malacca canes.
