simpleMeaning: the feeling of losing hope or confidence when you face a person who is more famous, richer,
  higher in position, or greater in another way
scope: This is a feeling of losing hope before a greater person, not the act of scaring a weaker person
  into doing something and not a feeling of fear or shyness.
examples:
- Meeting the famous professor filled her with intimidation, and she lost confidence in her own work.
- He felt intimidation in the presence of the wealthy director and doubted his own worth.
