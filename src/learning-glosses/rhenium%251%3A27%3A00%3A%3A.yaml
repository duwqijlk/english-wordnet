simpleMeaning: A rare heavy metal that joins with many other atoms, much like manganese, used in some
  alloys; it comes as a side product when molybdenum is made pure.
scope: A rare heavy metal like manganese, used in alloys and got as a side product of molybdenum refining;
  also called Re and atomic number 75.
examples:
- Rhenium is used in some high-temperature alloys.
- A little rhenium strengthens the metal in jet engines.
