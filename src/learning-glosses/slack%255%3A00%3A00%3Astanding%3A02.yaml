simpleMeaning: moving with little speed, for example when the sea is turning between coming in and going
  out
scope: This describes water moving very slowly when the tide turns. It is not about work done in a careless
  way, and not about a rope hanging loose.
examples:
- At slack tide, the water in the harbour barely moved.
- They waited for slack water before they crossed in the small boat.
