simpleMeaning: Only one other piece of the wrist does this small wrist piece join to
scope: 'Another name for pisiform and os pisiforme: a small wrist bone that joins to just one other wrist
  bone, not one that joins to several.'
examples:
- The pisiform bone joins to only one other wrist bone.
- He broke his pisiform bone in the fall.
