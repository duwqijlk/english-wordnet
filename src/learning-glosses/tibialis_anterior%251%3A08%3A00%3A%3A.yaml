simpleMeaning: a band of flesh in the lower leg that runs from the shin bone to the big toe bone and the
  small wedge bones of the foot
scope: 'Also called tibialis anticus: a band of flesh in the lower leg that runs from the shin bone to
  the foot; not a muscle at the back of the leg and not a bone.'
examples:
- The tibialis anterior lifts the foot when you walk.
- Pain in the tibialis anterior made it hard for her to raise her toes.
