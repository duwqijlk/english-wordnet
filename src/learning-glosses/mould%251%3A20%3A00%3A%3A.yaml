simpleMeaning: a fungus, a tiny living thing that forms a thin coat on wet or rotting things of many kinds
scope: A fungus that forms a thin coat on wet or rotting things; mold is another name for this sense,
  and it is not a container for shaping things or rich soil, which are other senses of mould.
examples:
- Mould grew on the bread left in the damp cupboard.
- The old books were spotted with mould.
