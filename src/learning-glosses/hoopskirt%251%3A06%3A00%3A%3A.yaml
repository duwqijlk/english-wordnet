simpleMeaning: a skirt that is made stiff by rings in it
scope: This sense, also called crinoline, is a skirt held out by rings; it is not a plain soft skirt that
  falls straight down.
examples:
- She wore a hoopskirt that made her dress stand out wide.
- The hoopskirt was hard to fit through the narrow door.
