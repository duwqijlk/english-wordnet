simpleMeaning: to do with Freud's ideas and way of treating troubled minds
scope: To do with Freud's ideas and way of treating troubled minds; also called psychoanalytic; not a
  way of treating the body, and not a way of testing how clever a person is.
examples:
- The psychoanalytical method looks for hidden causes of worry.
- He wrote about psychoanalytical theory in his book.
