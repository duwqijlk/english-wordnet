simpleMeaning: the act of measuring something with meters or similar instruments
scope: Not a public recital and not the silent reading of a book; it is taking a measurement from an instrument.
examples:
- The engineer took a reading from the pressure gauge every hour.
- The thermometer reading showed that the tank had cooled to minus ten.
