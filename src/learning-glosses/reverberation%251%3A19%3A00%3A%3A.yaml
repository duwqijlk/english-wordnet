simpleMeaning: An effect that comes from an action or event through other steps in between, not straight
  from the action or event itself
scope: 'Also called repercussion: a later or not direct result of an action, not the sound that comes
  back again after it hits a wall.'
examples:
- The reverberations of the market fall were felt for years.
- His angry words had reverberations in the office for weeks.
