simpleMeaning: It did not grow in nature, and it has no life in it
scope: Not grown in nature and not marked by the workings of life, not a stiff, put-on formal manner.
examples:
- An artificial flower is not grown in nature; it is made by people.
- This artificial stone was made in a factory, not formed by nature.
