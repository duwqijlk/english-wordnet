simpleMeaning: to a very great and surprising degree; far more than people expect
scope: About how much or how far something goes, to a surprising degree; not in a way that upsets people's
  feelings, which is the other sense in this batch.
examples:
- Teachers in that town are shockingly underpaid.
- The road was shockingly narrow for such big trucks.
