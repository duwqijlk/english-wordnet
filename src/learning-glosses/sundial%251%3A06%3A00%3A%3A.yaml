simpleMeaning: a tool that shows the hours of the day by the shadow of a raised part (the gnomon) falling
  on a flat face with marks for each hour
scope: This tells the time from the sun's shadow in the day, not a clock or watch that can work at night.
examples:
- The sundial in the garden showed it was noon.
- We read the time from the sundial when the sun was out.
