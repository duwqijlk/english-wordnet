simpleMeaning: a small ball of camphor or naphthalene (strong-smelling white substances) used to keep
  moths away from clothes that are put away
scope: Also called a camphor ball, this is the small ball itself put with clothes that are put away, not
  the act of putting things away for a long time.
examples:
- She put mothballs in the box with her winter coats.
- The drawer smelled strong from the mothballs inside.
