simpleMeaning: Leaves of seven to nine leaflets grow on this smooth-barked North American hickory, whose
  hard-shelled nuts can be eaten.
scope: Also called big-bud hickory, black hickory, mockernut hickory, and white-heart hickory; a smooth-barked
  North American hickory with a hard-shelled nut that can be eaten.
examples:
- The mockernut dropped its hard-shelled nuts on the path.
- We cracked a mockernut and ate the meat inside.
