simpleMeaning: to change how something is written so it follows an agreed set of rules.
scope: This is about following writing rules; it is not about designing clothes or hair, and not about
  giving something a name.
examples:
- The editor styled the article to match the journal's rules.
- All the reports were styled in the same way.
