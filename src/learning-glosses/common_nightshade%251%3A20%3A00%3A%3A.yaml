simpleMeaning: A white-flowered herb from Eurasia that now grows wild in America; its hairy leaves are
  toxic, while its black berries may be safe to eat or may be harmful.
scope: Another name for poison-berry and poisonberry, also called black nightshade; the whole white-flowered
  plant, not its berries alone.
examples:
- Common nightshade has white flowers and black berries that are not always safe to eat.
- The gardener pulled up common nightshade, careful not to touch its hairy leaves.
