simpleMeaning: In maths, the act of taking out an unknown value by putting equations (maths statements
  that say two things are equal) together
scope: In maths, this is taking out an unknown value by joining equations together, not the way of thinking
  where you look at each possible answer and set aside those that cannot be right.
examples:
- We used elimination to take out one unknown by joining the two equations.
- Elimination let the class take out the unknown value by putting the equations together.
