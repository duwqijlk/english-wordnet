simpleMeaning: An act that takes the place of a thing, or brings about its match
scope: An act that stands in place of a thing or brings about its match, not a made picture of a thing
  and not a body of lawmakers.
examples:
- The dance was a representation of the changing seasons.
- The ceremony served as a representation of their promise.
