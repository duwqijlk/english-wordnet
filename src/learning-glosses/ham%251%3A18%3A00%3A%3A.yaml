simpleMeaning: an actor who is not good at acting and does much more than the part needs
scope: An actor who acts badly and too strongly; not meat from a pig, and not a person with a licence
  who uses radio as a hobby.
examples:
- The ham ruined the sad scene by shouting and waving his arms.
- Everyone laughed at the ham, who made every small part feel big and false.
