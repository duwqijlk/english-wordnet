simpleMeaning: Frying in deep fat comes last for meat or fish that has been cooked, cut up fine, and dipped
  in egg and crumbs.
scope: This name is used for the whole dish of cooked meat or fish, coated in egg and crumbs and fried
  in deep fat.
examples:
- We had rissoles for lunch.
- She fried the rissoles in deep fat.
