scope: A blood tube carrying blood away from a net of tubes in the floor and inner wall of the eye hole,
  not a tube bringing blood to the eye and not the upper eye tube.
examples:
- The inferior ophthalmic vein drains the eye socket.
- Blood leaves the eye through the inferior ophthalmic vein.
