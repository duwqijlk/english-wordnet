simpleMeaning: Dried and ground to powder, the orange-brown sticky sap this low, wide plant of Indonesia
  gives is used to colour things.
scope: This is a low, wide plant of Indonesia, not the orange-brown sap itself or a tall forest tree.
examples:
- The gamboge tree grows low and wide in the gardens of Indonesia.
- Workers cut the gamboge tree to collect its orange-brown sap.
