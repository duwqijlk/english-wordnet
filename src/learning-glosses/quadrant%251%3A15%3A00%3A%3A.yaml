simpleMeaning: the quarter of a circle cut off by two straight lines that meet at right angles
scope: One quarter of a circle, cut off by two lines meeting at right angles, not a measuring tool and
  not one of the four areas of a graph.
examples:
- The diagram shaded one quadrant of the circle.
- Each quadrant of the pie was the same size.
