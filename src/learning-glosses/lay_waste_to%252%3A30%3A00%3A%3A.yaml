simpleMeaning: A place or thing lies in ruins after great harm has been done to it
scope: 'Also called waste, devastate, ravage, desolate and scourge: destroying a place or thing so fully
  that little is left, not merely damaging it and not making it dirty.'
examples:
- The invaders lay waste to the whole valley.
- The storm lay waste to the crops in a single night.
