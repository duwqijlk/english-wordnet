simpleMeaning: In law, an order from a court that tells a person or group to stop doing a thing, or not
  to start doing it
scope: 'Also called injunction, enjoinment and cease and desist order: in law, a court order that stops
  a person from doing a thing, not a court order that makes a person do a thing and not a fine paid as
  a punishment.'
examples:
- The court issued an enjoining that stopped the builders from working at night.
- They asked for an enjoining to keep the factory from dumping waste in the river.
