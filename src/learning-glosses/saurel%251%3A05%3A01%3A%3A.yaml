simpleMeaning: a large, long, flat food fish that lives in the Atlantic waters near Europe
scope: This is a large, long, flat food fish from the Atlantic waters of Europe, also called a horse mackerel;
  not a small flat fish from warm seas and not a fresh-water fish.
examples:
- The fishermen caught saurel off the coast of Spain.
- We grilled the saurel for dinner.
