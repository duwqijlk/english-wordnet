simpleMeaning: Moving stuff, such as a protein or drug, through the thin cover round a cell, from less
  of it to more of it, using power to do it.
scope: A cell does this when it spends power to move stuff, such as a protein or drug, through its thin
  cover from less of it to more of it.
examples:
- In the cell, active transport moved the drug through the thin cover round it.
- The cell used active transport to move the protein against the flow.
