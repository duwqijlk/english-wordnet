simpleMeaning: in a way that shows you are in charge and expect people to obey you
scope: 'Also called magisterially: in a way that shows a person in charge expects others to obey, not
  just in a loud or clear way.'
examples:
- The judge spoke authoritatively and everyone in the room listened.
- She told the team authoritatively what to do next.
