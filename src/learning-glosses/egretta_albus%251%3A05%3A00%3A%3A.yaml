simpleMeaning: A common egret found in America, a kind of the Old World white egret.
scope: A common egret of America, a kind of the Old World white egret, also called the great white heron
  and the American egret; not a small pond heron and not a grey heron.
examples:
- Egretta albus waded in the shallow water of the marsh.
- We saw an Egretta albus by the lake in America.
