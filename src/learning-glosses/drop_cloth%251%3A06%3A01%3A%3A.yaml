simpleMeaning: while a room is being painted, a large sheet covers the floor and the furniture
scope: A big sheet laid out to keep paint off the floor and furniture, not a stage curtain.
examples:
- We laid a drop cloth over the sofa before we started to paint the walls.
- The painter spread a drop cloth across the floor to catch the drips.
