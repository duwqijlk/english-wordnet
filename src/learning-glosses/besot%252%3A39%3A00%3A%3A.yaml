senseId: 'besot%2:39:00::'
synsetId: 02120101-v
simpleMeaning: to make a person slow and muddled in the mind by drink or by strong love
scope: 'Also called stupefy: to make a person slow and muddled by drink or strong love, not to tire a
  person out and not to puzzle a person with a hard question.'
examples:
- Too much drink can besot a man so he can hardly think.
- She was so besotted with the singer that she forgot her work.
