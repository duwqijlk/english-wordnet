simpleMeaning: Two arms of the same length hang from this cell part, since its centromere, the point where
  the arms join, sits in the middle
scope: A cell part with two arms of the same length, the join in the middle; not one with arms of different
  lengths.
examples:
- The metacentric chromosome has arms of equal length.
- Under the microscope, the metacentric chromosome showed its centromere in the middle.
