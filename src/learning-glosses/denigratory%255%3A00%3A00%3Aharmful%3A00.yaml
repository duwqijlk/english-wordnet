simpleMeaning: Words about a person that harm their name and are often untrue, tending to make others
  think badly of them
scope: These are harmful, often untrue words about a person; also called denigrating, slanderous, calumniatory,
  calumnious, defamatory, denigrative, libellous and libelous, not praise and not a true report.
examples:
- Her denigratory remarks about him were untrue.
- The denigratory speech hurt his good name.
