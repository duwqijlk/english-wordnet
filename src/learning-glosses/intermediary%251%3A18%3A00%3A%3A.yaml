simpleMeaning: a person who talks to two sides and helps them agree, passing messages between them
scope: 'Also called mediator: a person who helps two sides talk and agree. Not one of the sides, and not
  a judge who decides for them.'
examples:
- The union used an intermediary to talk to the company.
- As an intermediary, she carried offers between the two families.
