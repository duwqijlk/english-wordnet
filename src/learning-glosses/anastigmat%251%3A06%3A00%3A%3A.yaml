simpleMeaning: A set of lenses made to be free of the fault that blurs and stretches things, so it can
  form nearly sharp pictures.
scope: A set of lenses made to be free of the fault that blurs and stretches things, so it can form nearly
  sharp pictures, not a single plain lens and not a lens with the blurring fault.
examples:
- The camera used an anastigmat for sharp pictures.
- An anastigmat forms nearly sharp pictures without blur.
