simpleMeaning: a person's face, called 'kisser', 'smiler', or 'mug' in everyday talk, and 'phiz' in Britain
scope: 'Also called countenance, mug, kisser, physiognomy, smiler and phiz: a person''s face, not the
  look or feeling a face shows.'
examples:
- He washed his dirty visage in cold water.
- The old man's visage was thin and lined with age.
