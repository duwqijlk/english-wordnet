senseId: 'hookah%1:06:00::'
synsetId: 03538194-n
simpleMeaning: a pipe from the East for smoking tobacco, with a long tube that can bend, joined to a pot
  of water that cools the smoke as it passes through it
scope: Also called shisha, calean, chicha, hubble-bubble, hubbly-bubbly, kalian, narghile, nargileh, sheesha,
  and water pipe; it is this water-cooled tobacco pipe, not a short pipe held in the hand.
examples:
- He smoked tobacco through a hookah with his friends.
- The hookah stood on the floor, its long tube joined to a pot of water.
