simpleMeaning: A part that holds back electric current, with three ends for wires; the middle end can
  be moved to change the voltage (the electric push) in radios and TV sets
scope: This is the small electric part for a radio or TV set, not the deep round thing used for cooking
  and not the toilet.
examples:
- Turn the pot on the radio to make the sound louder.
- He fixed the TV by changing a small pot inside it.
