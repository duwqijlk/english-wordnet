simpleMeaning: A sickness of the body's blood-cleaning organ, above all in sheep and cattle, brought on
  by small flat worms living there and the waste they leave
scope: 'Also called black disease and distomatosis: a sickness of the blood-cleaning organ, above all
  in sheep and cattle, not a sickness of the lungs and not a sickness from bad food.'
examples:
- Liver rot killed several sheep that winter.
- The vet treated the herd for liver rot.
