simpleMeaning: From simpler stuff, living things build up more complex stuff, such as living tissue, and
  store energy away at the same time.
scope: Also called anabolism, this is the building up of more complex stuff from simpler stuff in living
  things, with energy stored away, not the breaking down of stuff for energy.
examples:
- Constructive metabolism builds living tissue from simpler stuff.
- Constructive metabolism turned simple stuff into living tissue.
