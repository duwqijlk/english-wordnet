senseId: 'shame%1:12:00::'
synsetId: 07521808-n
simpleMeaning: a bad, painful feeling you get when you know you have done wrong or are not good enough
scope: The painful feeling itself when you know you have done wrong, not making a person feel it, and
  not making a person act by making them feel it.
examples:
- He felt deep shame after lying to his mother.
- She hid her face in shame when she knew she had let the class down.
