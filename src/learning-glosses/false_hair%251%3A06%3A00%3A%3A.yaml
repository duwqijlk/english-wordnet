simpleMeaning: A covering or bunch of human or made-up strands worn to hide one's own locks or to dress
  them up.
scope: A covering or bunch of human or made-up strands worn to hide one's own locks or to dress them up,
  also called a hairpiece; not a hat and not a headscarf.
examples:
- She wore false hair for the stage part.
- The false hair gave him a full head of curls.
