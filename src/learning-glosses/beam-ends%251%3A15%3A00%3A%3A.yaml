simpleMeaning: In sailing, at the far sides of a ship, where the crosswise timbers under the deck come
  to a stop
scope: In sailing, the place at the far sides of a ship, not the middle of the deck and not the bow or
  stern.
examples:
- The storm heeled her over on her beam-ends, with the deck almost upright.
- A ship on her beam-ends lies far over on one side.
