simpleMeaning: This tube brings petrol from the tank to the engine that uses it to run
scope: A pipe carrying petrol to the engine; gas line and petrol line are other names for this sense,
  not an oil pipe and not a water pipe.
examples:
- Dirt clogged the fuel line and the car would not start.
- The fuel line runs from the tank to the engine.
