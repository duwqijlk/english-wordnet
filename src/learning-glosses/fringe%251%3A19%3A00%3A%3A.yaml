simpleMeaning: one of the light or dark bands made when light waves come together and spread out
scope: A light or dark band made when light waves come together and spread out; not a border of hanging
  threads on cloth, and not the act of adding such a border.
examples:
- The scientist photographed a dark fringe next to the bright band of light.
- Each fringe showed where the light waves had mixed and spread out.
