simpleMeaning: When a person tries to move on purpose, the muscles do not work together, so the movements
  are unsteady and the walk is a stagger.
scope: Also called ataxia, ataxy, and motor ataxia; it is a failure of muscles to work together, not a
  weakness of the muscles themselves.
examples:
- Dyssynergia made his walk unsteady.
- The doctor noted dyssynergia when she could not move her arm smoothly.
