senseId: 'shunt%2:38:01::'
synsetId: 02069813-v
simpleMeaning: to fit a device with a second wire path, or to send part of an electric current through
  such a path
scope: This verb sense is about fitting or using a second wire path for electric current, not the wire
  device itself, not a tube in the body and not a passage for blood or other body fluid.
examples:
- The worker shunted part of the current through a second wire to keep the machine safe.
- They shunted the meter by fitting a wire path beside it.
