simpleMeaning: A common columbine of Europe with short-spurred flowers in white, blue, purple or red,
  now growing wild in the United States
scope: This is a common columbine of Europe with short-spurred flowers in many colours, not a columbine
  with long-spurred flowers; granny's bonnets is another name for this sense.
examples:
- Aquilegia vulgaris grows in cottage gardens across Europe.
- The Aquilegia vulgaris in our garden has deep purple flowers.
