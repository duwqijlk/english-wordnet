simpleMeaning: the work a thing holds from how much stuff it has when still to the one who looks at it,
  that amount times the speed of light times itself
scope: In physics, the work a thing holds just from how much stuff it has when it is still, not the work
  it holds by moving and not the amount of stuff itself.
examples:
- The rest energy of one tiny bit of matter is huge, even though the bit is still.
- A book on the table has rest energy just from how much stuff it has.
