simpleMeaning: Its long pointed side teeth curl back in great arcs, and this wild pig of Indonesia is
  known by them.
scope: Babirusa and babirussa are other names for this wild pig of Indonesia, known by its great curving
  teeth.
examples:
- A babiroussa moved past us with its great teeth curving back.
- The babiroussa showed its long curved teeth.
