simpleMeaning: A person who makes a living by buying and selling people held as property
scope: A person who makes a living by buying and selling people held as property, also called a slaver
  or a slave dealer; not a person who keeps such people to work for them, and not a person who buys and
  sells goods.
examples:
- The slave trader sailed from port to port seeking captives.
- A slave trader sold the men at auction.
