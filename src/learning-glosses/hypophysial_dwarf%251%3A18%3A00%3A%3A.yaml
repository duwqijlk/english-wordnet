senseId: 'hypophysial_dwarf%1:18:00::'
synsetId: 10456225-n
simpleMeaning: Too little of the chemicals that make the body grow leaves this dwarf short, while genes
  passed down in the family play no part, unlike the achondroplastic dwarf.
scope: This dwarf is also called a pituitary dwarf, and the short height comes from too little growth
  chemical, not from genes passed down in the family, unlike the achondroplastic dwarf.
examples:
- The hypophysial dwarf grew up short because the body made too little growth chemical.
- Unlike the achondroplastic dwarf, the hypophysial dwarf is short because of too little growth chemical,
  not because of genes.
