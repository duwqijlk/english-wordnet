simpleMeaning: Parks and open fields that ring a town or city make up this band of land
scope: Land with parks and open fields around a town or city, also called greenway, not a park in the
  middle of a town and not farmland far from any town.
examples:
- The city kept a wide greenbelt of fields and woods around its edge.
- Houses may not be built on the greenbelt that rings the town.
