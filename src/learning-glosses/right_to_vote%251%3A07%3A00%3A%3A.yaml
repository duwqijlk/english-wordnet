simpleMeaning: By law, a person may cast a ballot, a promise the 15th change in the US Constitution gives
  and the 19th gives women.
scope: Also called vote and suffrage, this lawful promise comes from the 15th change in the US Constitution,
  and from the 19th for women.
examples:
- American women got the right to vote in 1920.
- Women won the right to vote with the 19th change.
