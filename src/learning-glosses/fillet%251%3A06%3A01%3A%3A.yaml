simpleMeaning: a narrow strip of metal that is joined by heat and used to hold steel parts together
scope: 'Also called stopping: a narrow metal strip for holding steel parts together, not a headband, not
  a piece of meat or fish, and not a bundle of nerves.'
examples:
- A steel fillet held the two beams together.
- The worker welded a fillet along the joint between the steel plates.
