simpleMeaning: The slow change of land where people can live into dry, barren land, usually caused by
  changes in the climate or by harmful use of the land
scope: This is the slow change of land where people can live into dry, barren land, not a desert that
  was always there and not damage from one single event.
examples:
- Desertification turned the green fields into dry, barren land.
- Overgrazing sped up desertification across the region.
