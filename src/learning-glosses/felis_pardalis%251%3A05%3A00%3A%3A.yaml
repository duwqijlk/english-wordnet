simpleMeaning: A wild cat that hunts at night in Central America and South America, with a yellow-brown
  coat marked with dark spots.
scope: 'Also called the ocelot, the panther cat, and Leopardus pardalis: a night-hunting wild cat of Central
  and South America with a dark-spotted coat, not the European wildcat and not the tiger cat.'
examples:
- The Felis pardalis has a yellow-brown coat with dark spots.
- A Felis pardalis hunts at night in Central America.
