senseId: isocyclic%5:00:00:cyclic:02
synsetId: 00680438-s
simpleMeaning: A thing has atoms that link up in a closed ring, and every atom in that ring is of one
  kind, most often carbon
scope: Said of a thing whose atoms link up in a closed ring of one kind, also called homocyclic; not a
  ring that mixes different kinds of atoms and not an open chain of atoms.
examples:
- Benzene is an isocyclic compound with a ring of carbon atoms.
- The chemist drew the isocyclic ring on the board.
