simpleMeaning: A neck gland grown too big, which can come from too little or too much of the stuff it
  makes, or from too little iodine in food.
scope: Also called goitre, struma, or thyromegaly, a neck gland grown too big, which can come from too
  little or too much of the stuff it makes, or from too little iodine in food.
examples:
- The doctor felt her neck and found a goiter.
- A lack of iodine in food can lead to a goiter.
