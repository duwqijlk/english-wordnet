simpleMeaning: singing a scale with the set sounds do, re, mi and so on, to mark each note in the scale
  of C major
scope: Singing a scale with do, re, mi and so on to mark each note in the scale of C major, also called
  solfege and solmization; not ordinary singing and not playing an instrument.
examples:
- The choir began with solfeggio to warm up their voices.
- He used solfeggio to learn the notes of the scale.
