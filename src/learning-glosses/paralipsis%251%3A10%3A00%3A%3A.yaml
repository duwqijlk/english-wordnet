simpleMeaning: Saying very little on purpose, so that much that matters is left out yet still hinted at.
scope: Saying little on purpose to hint at much left out, also called paraleipsis and paralepsis; not
  irony and not plain understatement.
examples:
- Her paralipsis left the crowd to guess the worst.
- He used paralipsis, naming one fault and letting the rest hang in the air.
