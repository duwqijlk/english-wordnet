simpleMeaning: a group set up by law to control fishing and the movement of boats and ships in a port
  or river
scope: This is an official group that controls fishing and boat travel in a port or river, not the act
  of protecting trees, soil, and rivers.
examples:
- The conservancy set new rules for fishing in the port.
- Boats on the river must follow the orders of the conservancy.
