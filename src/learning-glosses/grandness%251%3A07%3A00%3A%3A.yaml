simpleMeaning: The quality of a thing that looks splendid and fine, and fills those who see it with wonder.
scope: 'Also called splendor, grandeur, magnificence, or splendour: the quality of a thing that looks
  splendid and fine, not unusual largeness in size, extent, or number.'
examples:
- The grandness of the old hall took their breath away.
- Advertisers praise the grandness of the new hotel in every picture.
