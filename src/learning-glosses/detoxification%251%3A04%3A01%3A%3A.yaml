schema: oewn-learning-gloss-v2
senseId: 'detoxification%1:04:01::'
synsetId: 00700573-n
simpleMeaning: A treatment for a person hooked on drugs or alcohol that takes away the effects of those
  substances on the body
scope: This is a treatment that takes away the effects of drugs or alcohol on the body of a person hooked
  on them, not a treatment for poisoning and not a cure for the wish to use drugs.
examples:
- He went into hospital for detoxification after years of drinking.
- Detoxification took away the worst effects of the drug.
