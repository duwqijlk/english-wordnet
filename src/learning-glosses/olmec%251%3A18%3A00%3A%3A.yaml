simpleMeaning: A person of an early people of Middle America who lived around Veracruz and whose way of
  life was at its height from 1300 to 400 BC
scope: This is a person of the early people who lived around Veracruz and were at their height from 1300
  to 400 BC; a person of a later people of the same land is a different sense.
examples:
- The Olmec left great stone heads in the land around Veracruz.
- An Olmec trader would have lived long before the year 400 BC.
