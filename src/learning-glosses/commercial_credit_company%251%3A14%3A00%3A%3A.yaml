simpleMeaning: a money-lending firm that lends to makers and sellers of goods in large lots
scope: A money-lending firm that lends to makers and wholesalers; commercial finance company is another
  name for this sense, not a firm that lends to ordinary people.
examples:
- The commercial credit company lent the factory money for new machines.
- A commercial credit company helped the wholesaler buy stock.
