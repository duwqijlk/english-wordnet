schema: oewn-learning-gloss-v2
senseId: wizardly%5:00:00:supernatural:00
synsetId: 01580464-s
simpleMeaning: Having, using, or like, or fit for, powers past nature.
scope: This sense is also called magic, wizard, magical, charming, witching, and sorcerous, for having,
  using, or like, or fit for, powers past nature, where magic is having, using, typical of, or suited
  to powers that lie beyond the natural world, wizard is having, using, typical of, or right for powers
  that are not from the natural world, magical is having or using powers that go past what nature can
  do, or like such powers, or made for such powers, and charming is having or using powers beyond the
  natural world, or like or suited to such powers.
examples:
- The craft was wizardly, having powers past nature.
- The art was wizardly, fit for powers past nature.
