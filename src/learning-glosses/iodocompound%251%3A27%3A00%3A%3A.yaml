simpleMeaning: Something made of atoms joined together, holding a group of iodine atoms that share electrons
  with other atoms
scope: A joined-atom stuff holding iodine, not the act of adding iodine and not a simple iodine salt.
examples:
- The lab stored the iodocompound in a dark bottle.
- This iodocompound breaks down quickly in light.
