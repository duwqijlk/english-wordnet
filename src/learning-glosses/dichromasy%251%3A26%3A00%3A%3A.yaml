simpleMeaning: A lack in colour vision in which a person can match any hue by mixing only two wavelengths
  of light, not the three most people need
scope: Also called dichromacy, dichromatism, dichromatopsia and dichromia; it is a lack in colour sight,
  not the full colour sight of most people, who need three kinds of light to match a shade.
examples:
- With dichromasy, he matched the red shade using just two kinds of light.
- Her dichromasy lets her match any shade with two kinds of light, not three.
