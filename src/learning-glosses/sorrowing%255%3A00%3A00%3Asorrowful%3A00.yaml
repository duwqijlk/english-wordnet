simpleMeaning: feeling very sad because you have lost someone or something, or because you do not have
  something you need
scope: Feeling sad because of a loss or because you lack something you need; it is not sadness with no
  loss behind it.
examples:
- The sorrowing mother stood by her son's grave.
- He was a sorrowing man for a long time after his wife died.
