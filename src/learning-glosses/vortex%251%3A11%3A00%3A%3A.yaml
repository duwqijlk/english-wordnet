simpleMeaning: a strong flow of water that moves round in a circle, usually made when tides pull in different
  ways
scope: 'Also called whirlpool and maelstrom: a strong flow of water moving in a circle, not air moving
  in a circle and not a straight flow of water.'
examples:
- The boat was pulled into the vortex and turned round and round.
- A vortex formed where the two tides met.
