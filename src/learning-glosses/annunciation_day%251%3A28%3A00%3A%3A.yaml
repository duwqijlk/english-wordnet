simpleMeaning: A feast commemorating Gabriel's announcement of the Incarnation to the Virgin Mary; a quarter
  day in England, Wales and Ireland.
scope: A feast marking the angel Gabriel's announcement of the Incarnation to the Virgin Mary, also called
  Annunciation, Lady Day and March 25; its nearest kin are other feasts of the church year, such as Christmas
  and Easter.
examples:
- Annunciation Day falls on March 25 and marks the angel Gabriel's message to Mary.
- The parish kept Annunciation Day as a quarter day in England, Wales and Ireland.
