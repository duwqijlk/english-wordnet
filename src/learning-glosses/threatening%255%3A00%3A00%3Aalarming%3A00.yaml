simpleMeaning: Pointing to bad or sad things that are still to come, and making people feel afraid
scope: A look, tone or cloud that warns of bad things to come, not the act of threatening a person.
examples:
- His threatening tone made everyone fall silent.
- Threatening clouds gathered over the hills.
