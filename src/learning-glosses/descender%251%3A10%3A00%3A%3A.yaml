senseId: 'descender%1:10:00::'
synsetId: 06813729-n
simpleMeaning: In printing, the part of a small letter that goes below the line of the other small letters
scope: In printing, the low part of a small letter that drops below the line; not the whole letter and
  not a capital letter.
examples:
- The descender of the letter g dips below the line.
- In this font, the descender of y is long and curved.
