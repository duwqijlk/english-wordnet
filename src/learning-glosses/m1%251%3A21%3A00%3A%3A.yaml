simpleMeaning: A way of counting the money in use, made up of cash in use and money in bank accounts that
  can be drawn on at once.
scope: This is a way of counting the money in use, made up of cash in use and money in bank accounts that
  can be drawn on at once; it is not M3, which counts a wider store of money.
examples:
- M1 rose last month as more cash came into use.
- The bank's report gave M1 as cash in use plus money in accounts that can be drawn on at once.
