simpleMeaning: backing change for the better, often through laws and acts of government
scope: Backing reform, often through government action, not a verb tense and not a broad love of progress
  for its own sake.
examples:
- She holds progressive views on health care and schools.
- The progressive party pushed for new laws to help workers.
