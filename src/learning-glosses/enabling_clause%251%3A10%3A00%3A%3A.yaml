simpleMeaning: This part of a law lets the right officials put the law into use and make people keep it
scope: 'Also called enabling act: this part of a law lets the right officials put the law into use and
  make people keep it, not the law itself and not a rule that takes power away.'
examples:
- The enabling clause gave the minister power to enforce the new law.
- Under the enabling clause, local officials could put the rules into use.
