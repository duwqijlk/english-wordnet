simpleMeaning: keeping people with a catching disease apart from others by rule, so the disease does not
  spread
scope: Keeping sick people apart by rule to stop a disease spreading, not a free choice to stay away.
examples:
- The sick sailors were put in quarantine for two weeks.
- The hospital kept the quarantine in place until the fever passed.
