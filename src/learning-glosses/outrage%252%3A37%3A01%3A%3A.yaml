simpleMeaning: to make a person feel strong disgust and a wish to turn away
scope: Also called shock, offend and appall. This is making someone feel strong disgust, not just making
  them angry or upset a little.
examples:
- The sickening scene outraged everyone who saw it.
- She was outraged by the cruel and dirty treatment of the animals.
