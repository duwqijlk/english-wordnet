simpleMeaning: By a court or others who hand out punishment, gentle treatment of offenders that lets them
  off lightly.
scope: Also called mercy and mercifulness, gentle treatment shown to offenders by those who hand out punishment.
examples:
- The judge showed clemency and cut the sentence short.
- He asked the court for clemency after the trial.
