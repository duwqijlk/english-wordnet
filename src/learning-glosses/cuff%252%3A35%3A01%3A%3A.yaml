simpleMeaning: to hold someone so they cannot move, by locking metal rings around their wrists, or as
  if in that way
scope: 'Also called handcuff: to lock metal rings around someone''s wrists to stop them moving. Not the
  metal rings themselves, and not the folded end of a sleeve or trouser leg.'
examples:
- The police cuffed the man and led him away.
- They cuffed her hands behind her back.
