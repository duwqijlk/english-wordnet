simpleMeaning: From Europe, this low spreading plant now grows on its own in Great Britain and eastern
  North America, with bent flowers that people think look like unborn babies.
scope: This low spreading plant has bent flowers thought to look like unborn babies.
examples:
- Birthwort spread low along the ground, its bent flowers like unborn babies.
- Birthwort now grows on its own in Great Britain and eastern North America.
