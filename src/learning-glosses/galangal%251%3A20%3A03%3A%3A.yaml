simpleMeaning: Small groups of reddish flowers grow on this grass like plant of Europe, which has rough
  edged leaves and roots that smell sweet
scope: Also called galingale, a grass like plant of Europe with reddish flowers, not the southeastern
  Asian plant with sweet smelling roots.
examples:
- Galangal grew in the garden with rough edged leaves and reddish flowers.
- She pulled up galangal and found its roots smelled sweet.
