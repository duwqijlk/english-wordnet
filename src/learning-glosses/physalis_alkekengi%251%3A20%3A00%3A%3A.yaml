simpleMeaning: A plant of the Old World that lives for years, grown for show for its blown-up, paper-thin,
  orange-red cup around the fruit.
scope: Also called bladder cherry, winter cherry, and Chinese lantern plant; a plant of the Old World
  grown for show, set apart from other garden plants by its blown-up paper-thin orange-red cup.
examples:
- Physalis alkekengi lit up the border with its orange-red cups.
- She dried Physalis alkekengi for the winter vase.
