simpleMeaning: eating food in very large amounts, or wanting to eat very much
scope: 'Also called ravenous, wolfish, ravening and rapacious: eating or wanting a lot of food, not wanting
  too much money or power.'
examples:
- The voracious sharks ate fish after fish without stopping.
- After the long walk, the voracious children asked for second and third plates of food.
