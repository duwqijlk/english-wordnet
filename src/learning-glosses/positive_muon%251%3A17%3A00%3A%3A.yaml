simpleMeaning: A tiny bit of matter that is the exact opposite of its matching bit, and breaks down into
  a positron and two bits with almost no weight
scope: A tiny bit of matter that is the exact opposite of its matching bit, and breaks down into a positron
  and two bits with almost no weight; antimuon is another name for this sense, not the matching bit itself
  and not a bit that stays whole.
examples:
- A positive muon lived only a tiny share of a second.
- The positive muon broke down in the detector.
