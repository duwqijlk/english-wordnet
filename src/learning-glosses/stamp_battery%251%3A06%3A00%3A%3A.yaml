simpleMeaning: a row of heavy blocks that pound together in one large bowl to crush rock that holds metal
scope: 'Also called a battery: a set of pounding blocks used to crush rock, not a store of electric power
  and not a single block.'
examples:
- The stamp battery pounded the rock all day to get out the gold.
- Workers fed ore into the stamp battery to crush it.
