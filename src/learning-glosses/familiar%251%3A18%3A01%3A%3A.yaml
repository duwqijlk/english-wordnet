simpleMeaning: Someone supported by a pope, bishop or other high official in return for serving in that
  person's household.
scope: A servant in a high official's household, such as a pope's or bishop's, not a witch's animal helper
  or the adjective meaning ordinary.
examples:
- The bishop's familiar handled letters and meals for him.
- As a familiar, he lived under the cardinal's roof and was fed and clothed.
