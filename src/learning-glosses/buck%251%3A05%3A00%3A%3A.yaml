simpleMeaning: a fully grown male mammal (an animal that feeds its young with milk), especially a deer
  or antelope
scope: This is a fully grown male animal, especially a deer, not the wooden horse used in gymnastics and
  not the act of jumping up with stiff legs.
examples:
- A large buck stood at the edge of the field with two smaller deer.
- The buck ran fast when it heard the dogs.
