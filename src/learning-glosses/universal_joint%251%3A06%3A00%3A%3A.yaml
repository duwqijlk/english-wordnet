simpleMeaning: A link that joins two turning rods and lets them move freely in all directions.
scope: 'Also called universal: a link joining two turning rods so they can move in all directions, not
  a fixed join and not a hinge that moves in one flat plane.'
examples:
- A universal joint lets the drive shaft move up and down over bumps.
- The universal joint in the car joins two turning rods and lets them move in all directions.
