simpleMeaning: one of the two parts of soft flesh on a woman's chest that make milk
scope: This is one of the two milk-making parts on a woman's chest, not the front of a person's chest
  as a whole, not an animal's chest, and not meat from a bird.
examples:
- The baby fed at his mother's breast.
- She felt a small lump in her left breast and saw a doctor.
