simpleMeaning: In anatomy, any part of the body that is hollow inside and long and round, like a pipe
scope: In anatomy, a hollow part of the body that is long and round like a pipe, not a pipe for carrying
  liquids and not an electronic part.
examples:
- The fallopian tube carries the egg from the ovary to the womb.
- A tube in the body can carry air or fluid from one part to another.
