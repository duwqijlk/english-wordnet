simpleMeaning: Any of a group of natural fat-like chemicals from plants or animals; they are waxy and
  do not dissolve in water
scope: Any of a group of natural waxy stuffs from plants or animals, also called a sterol; not a fat for
  cooking and not a medicine made in a lab.
examples:
- A steroid alcohol is a waxy stuff from plants or animals.
- The lab found a steroid alcohol in the sample.
