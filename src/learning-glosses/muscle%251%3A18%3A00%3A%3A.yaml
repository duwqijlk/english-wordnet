simpleMeaning: a paid thug who uses threats or violence, either to frighten people or to guard someone
scope: This is the hired thug or bodyguard, not physical strength, body tissue, or power used to threaten
  people.
examples:
- The club owner hired muscle to keep troublemakers away from the door.
- Two of the dealer's muscle stood by the entrance all night.
