simpleMeaning: A hairstyle made by weaving strands of hair together.
scope: This is a hairstyle, not a bend or kink in a line or the act of winding something; braid and plait
  are other names.
examples:
- She wore her hair in a thick twist down her back.
- A neat twist kept her hair out of her eyes.
