simpleMeaning: a fern or moss leaf that holds the small cases in which spores are made
scope: 'Also called sporophyl: a leaf on a fern or moss that makes spores, not an ordinary leaf and not
  a root of the plant.'
examples:
- The sporophyll of the fern was covered in tiny brown dots.
- Each sporophyll carries the cases where the spores grow.
