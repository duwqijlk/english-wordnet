simpleMeaning: A tree of the south-east of China, unlike the tree of the Old World in having pale fruit.
scope: A tree of the south-east of China with pale fruit; not the Old World tree and not a pine.
examples:
- The white-berry yew grows in the south-east of China.
- Its pale fruit sets the white-berry yew apart from the Old World tree.
