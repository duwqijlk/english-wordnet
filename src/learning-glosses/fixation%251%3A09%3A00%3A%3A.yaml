simpleMeaning: A thought about one thing or person that will not leave the mind and does harm
scope: A harmful thought that will not leave the mind; obsession is another name for this sense, not a
  healthy interest and not the fixing of a sample in a laboratory.
examples:
- His fixation on winning took over his whole life.
- Her fixation with the old house made her visit it every day.
