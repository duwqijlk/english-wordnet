simpleMeaning: The short bit of the food pipe that runs down from the sheet of muscle under the chest
  to the stomach.
scope: The short bit of the food pipe that runs down from the sheet of muscle under the chest to the stomach,
  not the whole food pipe and not the stomach itself.
examples:
- Food passes through the epicardia on its way to the stomach.
- The epicardia joins the food pipe to the stomach.
