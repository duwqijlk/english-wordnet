simpleMeaning: A plant from Mexico, used above all to make pulque, a drink that gives the clear Mexican
  liquor called mescal.
scope: A Mexican plant used above all to make pulque, the source of mescal; not a cactus and not a plant
  grown only for food.
examples:
- Maguey grew in rows across the dry Mexican field.
- Workers cut the maguey to make pulque.
