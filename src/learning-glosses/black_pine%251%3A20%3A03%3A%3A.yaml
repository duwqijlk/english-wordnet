simpleMeaning: A tall, symmetrical evergreen tree of western North America with long blue-green needles
  in threes and long cones on drooping branches, sometimes treated as a kind of ponderosa tree.
scope: The western North American tree, not the Australian or New Zealand kinds or the Japanese and European
  ones.
examples:
- A black pine shaded the porch of the ranch house.
- The black pines on the ridge had long blue-green needles.
