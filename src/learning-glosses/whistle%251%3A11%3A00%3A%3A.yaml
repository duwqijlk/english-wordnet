simpleMeaning: This sound comes when steam pushes out through a small opening, or when something moves
  very fast
scope: This is the sound itself, made by fast movement or by steam through a small opening; it is not
  the device you blow and not the act of giving a signal.
examples:
- The whistle of steam rose from the kettle as the water boiled.
- An arrow flew past his head with a faint whistle.
