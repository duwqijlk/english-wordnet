simpleMeaning: a shallow open box used by gardeners for sowing, taking plant cuttings, and growing young
  plants
scope: A shallow open box for starting plants; not a flower pot and not a plant bed in the ground.
examples:
- We filled the seed tray with soil before sowing.
- The gardener moved the young plants from the seed tray to larger pots.
