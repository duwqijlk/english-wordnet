simpleMeaning: A plant from the United States and Canada whose flower heads are ringed by a soft edge
  of thin thread-like rays, very thin and white or pink, and strikingly pretty.
scope: A strikingly pretty plant with a soft edge of thin thread-like rays round its flower heads, also
  called Philadelphia fleabane; it grows in the United States and Canada.
examples:
- Erigeron philadelphicus opened its white rays along the path this spring.
- The Erigeron philadelphicus by the fence is the prettiest plant in the garden.
