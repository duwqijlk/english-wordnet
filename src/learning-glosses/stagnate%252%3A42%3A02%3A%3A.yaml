simpleMeaning: to make something stop flowing, growing, or moving forward
scope: This is making something else stop flowing or growing; it is not a thing stopping on its own, and
  not a thing moving or growing well.
examples:
- Thick plants can stagnate the water in a slow stream.
- High costs can stagnate a small town and stop new shops from opening.
