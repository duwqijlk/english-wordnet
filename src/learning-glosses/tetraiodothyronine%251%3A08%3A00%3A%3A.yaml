senseId: 'tetraiodothyronine%1:08:00::'
synsetId: 05420990-n
simpleMeaning: Cells burn fuel faster or slower as this body chemical from the thyroid glands tells them
  to.
scope: Also called thyroxin and thyroxine, it is the thyroid chemical that sets how fast cells burn fuel.
examples:
- When her tetraiodothyronine was low, the cells in her body burned fuel too slowly.
- The doctor raised her tetraiodothyronine dose to speed up how fast her cells burn fuel.
