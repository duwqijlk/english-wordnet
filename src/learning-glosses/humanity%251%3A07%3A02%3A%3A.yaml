simpleMeaning: the fact that someone is a person, and the things that make people what they are
scope: Being a person, not all the people on earth, and not being kind and caring toward others.
examples:
- Her humanity showed in her need to eat, sleep, and be with other people.
- Even the strongest leader shows his humanity when he needs rest and falls ill.
