senseId: 'specialization%1:04:00::'
synsetId: 00584498-n
simpleMeaning: The work a person does for a living, after choosing one field and sticking to it.
scope: Also called specialty and speciality, this is the one field of work a person has made their career,
  not the change in a body part that fits it for one job, and not the act of making a thing fit for a
  special purpose.
examples:
- Her specialization is children's medicine.
- He chose teaching as his specialization after college.
