senseId: 'legerdemain%1:04:00::'
synsetId: 00100771-n
simpleMeaning: A trick that fools the eye, which people who do not know how it is done take for real magic
scope: A trick that fools the eye; magic, trick, illusion, deception, thaumaturgy, conjuration, conjuring
  trick and magic trick are other names for this sense, not a real act of magic and not a simple joke.
examples:
- His legerdemain made the coin vanish from his open hand.
- The crowd gasped at the magician's legerdemain.
