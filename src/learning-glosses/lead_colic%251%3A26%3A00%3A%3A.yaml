simpleMeaning: A belly pain that comes with long-term poisoning by a heavy metal, together with stubborn
  constipation
scope: A sign of long-term poisoning by a heavy metal, with stubborn constipation; painter's colic is
  another name for this sense, not a brief stomach upset.
examples:
- The doctor said the lead colic came from years of working with the metal.
- Lead colic kept him in pain and constipated for days.
