simpleMeaning: A tall tropical Asian plant, living one year or woody at the base, with velvety leaves,
  yellow flowers and strong fiber; now wild in southeastern Europe and the US.
scope: The velvet-leaved Asian fiber plant, also called velvet-leaf; not a method of printing cloth and
  not butter or a butter mould.
examples:
- Butter-print now covers fields across the eastern United States.
- Farmers once grew butter-print for the strong fiber in its stems.
