simpleMeaning: a hard green mineral made of sodium aluminum silicate in slanted crystal form, a source
  of jade, found mostly in Burma
scope: A hard green mineral that is a source of jade and comes mostly from Burma, not jade itself and
  not other green stones.
examples:
- The carver cut the jadeite into a small green pendant.
- Most jadeite comes from Burma, where miners dig it from the rock.
