simpleMeaning: A condition in which health is weakened or the body does not work as it should.
scope: This is not a wound or injury from an accident; it is a condition in which the body or mind works
  abnormally.
examples:
- Heart disease is common in older people.
- The village was hit by a rare disease that year.
