simpleMeaning: A product given more display or advertising than the rest of the goods on sale.
scope: This is a product given extra display or advertising, not a prominent piece in a newspaper or magazine
  and not a notable quality of something.
examples:
- This week's feature is a half-price coffee machine.
- The store put its feature by the entrance so every customer would see it.
