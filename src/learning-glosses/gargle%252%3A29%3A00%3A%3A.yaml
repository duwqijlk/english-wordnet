simpleMeaning: to wash the inside of the mouth and the throat with a liquid made for cleaning the mouth
scope: 'Also called rinse: this is washing the mouth and throat, not the liquid itself, not the sound
  made while doing it, and not speaking with such sounds.'
examples:
- Gargle with this liquid three times a day.
- She gargled after brushing her teeth to clean her mouth and throat.
