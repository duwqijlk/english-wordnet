simpleMeaning: to change an amine, a chemical with nitrogen in it, into a chemical with two nitrogen atoms
  joined to each other
scope: To change one chemical into a different kind of chemical, not to mix two chemicals and not to break
  a chemical apart.
examples:
- The chemist diazotized the amine to make the dye.
- To diazotize the amine, she cooled the mix and added the acid.
