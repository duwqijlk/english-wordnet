simpleMeaning: Like a person who has lately grown rich or risen in rank but has not learned the manners
  that go with the new place
scope: Like a person lately rich or risen in rank who has not learned the manners of the new place, with
  upstart, parvenu and parvenue as other names for this sense; not old wealth, and not a person born to
  rank.
examples:
- His nouveau-riche manners shocked the old families.
- She disliked the nouveau-riche show of wealth at the party.
