simpleMeaning: a supposed tiny bit of matter, very heavy, that barely acts on ordinary matter except by
  pull, thought to be part of the dark matter of the universe
scope: A supposed heavy particle that barely touches ordinary matter; weakly interacting massive particle
  is another name for this sense; not an ordinary particle and not dark matter itself.
examples:
- Physicists hope a WIMP detector will one day catch such a particle.
- If WIMPs exist, they could make up much of the dark matter.
