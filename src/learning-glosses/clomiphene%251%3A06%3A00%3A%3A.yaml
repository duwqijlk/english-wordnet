senseId: 'clomiphene%1:06:00::'
synsetId: 03052079-n
simpleMeaning: A drug that helps people have children, sold as Clomid, which starts an egg's release from
  the ovary and has been linked with twins or more at one birth.
scope: A drug that helps people have children by starting an egg's release from the ovary, also called
  clomiphene citrate; not a drug that stops eggs from being released and not a vitamin.
examples:
- The doctor gave her clomiphene to help her conceive.
- Clomiphene has been linked with twins and triplets.
