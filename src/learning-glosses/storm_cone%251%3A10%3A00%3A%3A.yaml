simpleMeaning: a pointed shape of heavy cloth raised up to warn people of strong winds
scope: A warning sign raised for high winds, not a storm signal that tells of a coming storm, and not
  a flag that marks a place.
examples:
- The harbour master raised the storm cone when the wind began to rise.
- A storm cone on the pier warned sailors that high winds were on the way.
