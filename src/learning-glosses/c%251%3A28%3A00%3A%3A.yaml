simpleMeaning: The speed of light in a void, always the same everywhere, fixed by agreement at 299,792,458
  metres a moment.
scope: This is the set speed of light in empty space, also called light speed and the speed of light,
  not the element, not the vitamin, and not a letter.
examples:
- Light moves at c in empty space.
- Nothing moves faster than c.
