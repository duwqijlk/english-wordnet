simpleMeaning: Breeding that uses one trait with two forms of a gene, as Mendel did with garden peas
scope: Breeding that uses one trait with two forms of a gene, as in Mendel's pea work, not breeding that
  uses two traits at once.
examples:
- A monohybrid cross looks at one trait with two forms.
- Mendel's monohybrid cross with garden peas showed how traits pass on.
