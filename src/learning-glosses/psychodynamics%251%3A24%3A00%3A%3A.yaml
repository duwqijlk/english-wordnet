simpleMeaning: who a person is and what moves them to act is shaped by how known and hidden feelings and
  drives in them work together
scope: It is the give-and-take of known and hidden feelings in a person, not a field of study about feelings
  in groups.
examples:
- His psychodynamics showed in how hidden fears shaped his choices.
- The therapist explored the psychodynamics that shaped her choices.
