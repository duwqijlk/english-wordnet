simpleMeaning: In archaeology, shells and animal bones in a heap of old household waste show where people
  lived long ago
scope: 'Also called midden and kitchen midden: a heap of old household waste that marks a prehistoric
  home site, not a modern rubbish dump and not a burial mound.'
examples:
- Archaeologists found an eitchen midden full of shells.
- The eitchen midden showed what the first settlers ate.
