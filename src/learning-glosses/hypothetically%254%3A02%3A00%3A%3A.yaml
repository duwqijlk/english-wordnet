schema: oewn-learning-gloss-v2
senseId: 'hypothetically%4:02:00::'
synsetId: 00171282-r
simpleMeaning: in a way that uses an idea that is not yet proved to be true, as a way to think about what
  could happen
scope: This is about thinking with an idea that is not yet proved, not about a known fact or about something
  that really happened.
examples:
- Hypothetically, if we had more money, we could buy a bigger house.
- Speaking hypothetically, a city with no cars would be much quieter.
