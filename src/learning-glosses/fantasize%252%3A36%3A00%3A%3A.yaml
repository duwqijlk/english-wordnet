simpleMeaning: to spend time thinking with pleasure about things you imagine that are not real
scope: 'Also called fantasy: to spend time thinking with pleasure about things that are not real; not
  a daydream about a plan you mean to carry out.'
examples:
- He is fantasizing when he says he plans to start his own company.
- She likes to fantasize about living by the sea.
