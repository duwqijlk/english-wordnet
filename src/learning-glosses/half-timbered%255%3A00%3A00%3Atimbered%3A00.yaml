simpleMeaning: Made with bare wood frames left showing, the spaces between them filled with brick or stone,
  as in Tudor buildings.
scope: This describes a building with bare wood frames showing and gaps filled with brick or stone, not
  a plain brick building; also called half-timber.
examples:
- They lived in a half-timbered cottage.
- The half-timbered house stood at the end of the lane.
