simpleMeaning: a long, sharp tooth made for fighting or digging in the ground, seen especially in elephants,
  walruses and hogs
scope: A pointed tooth, not the hard white stuff that tooth is made of, and not the act of stabbing with
  it.
examples:
- The elephant raised its tusks and charged across the plain.
- The walrus uses its tusks to haul itself onto the ice.
