simpleMeaning: a story told with sound and pictures shown one after another that look as if they move,
  made for people to enjoy
scope: Also called a movie, a film, or a picture. This is a story you watch, not a quick move of the hand
  that takes something away or makes something move.
examples:
- We watched a funny flick at home last night.
- That flick tells the story of a young sailor and his boat.
