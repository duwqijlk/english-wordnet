simpleMeaning: the act of taking out parts of printed works, letters that people send, or shows on a stage
scope: Taking out parts of printed works, letters or shows on a stage, also called censorship; not the
  army or spy work of stopping information that could help an enemy.
examples:
- The censoring of the play removed a whole scene.
- Strict censoring cut several pages from the letters before they were printed.
