senseId: 'unsaturated%3:00:00::'
synsetId: 00760953-a
simpleMeaning: Atoms in a chemical stuff, above all one made of carbon, share more than one link with
  each other.
scope: This word is said of a chemical stuff whose atoms share more than one link, not one whose atoms
  are joined by single links only.
examples:
- This compound is unsaturated because its atoms share more than one link.
- The chemist called the fat unsaturated after finding more than one link between its atoms.
