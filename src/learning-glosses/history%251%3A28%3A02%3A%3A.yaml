simpleMeaning: the unbroken chain of events that happen one after another, from the past through the present
  and on into the future
scope: This means the whole unbroken flow of events, not the study of past events or a written account
  of them.
examples:
- We are all carried along by history, from one age into the next.
- In the long sweep of history, that war was only a brief moment.
