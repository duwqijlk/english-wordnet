simpleMeaning: The outer layer of a fruit or vegetable, such as an apple's or a potato's.
scope: The outer layer of a fruit or vegetable only; not the protective covering of a person's or animal's
  body, not a thin outer surface in general, and not a container made from animal hide.
examples:
- She peeled the skin from the apple before slicing it.
- The potato skin was scrubbed clean and left on before baking.
