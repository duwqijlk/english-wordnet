simpleMeaning: A written note added to a book or other text that explains, criticizes, or illustrates
  part of it.
scope: This is not a spoken or written remark giving an opinion; it is material written into or alongside
  a text to explain or illustrate it.
examples:
- The editor's comments in the margin pointed out several errors.
- Footnotes often contain comments on the main text.
