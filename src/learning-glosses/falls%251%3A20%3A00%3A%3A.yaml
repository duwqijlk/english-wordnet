simpleMeaning: parts of a flower, called petals or sepals, that bend down, especially the outer parts
  of an iris
scope: The parts of a flower that bend down; not a place where a river drops over rocks, and not the act
  of dropping down.
examples:
- The falls of the iris bent down over its stem.
- She drew the flower and marked its wide falls in purple.
