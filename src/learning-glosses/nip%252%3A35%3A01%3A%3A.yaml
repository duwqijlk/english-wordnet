simpleMeaning: to take a small part off by a quick pinch or a small cut
scope: To take a small part off by a quick pinch or a small cut, with clip and snip as other names for
  this sense, and not a hard squeeze or a bite.
examples:
- She nipped off the dead flowers.
- He nipped the top off the plant with his fingers.
