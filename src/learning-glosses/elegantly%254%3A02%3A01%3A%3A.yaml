simpleMeaning: in a way that is beautiful and smooth, with grace and ease
scope: Done in a beautiful, smooth way, with grace; the stress here is on grace in how a thing is done,
  not on good taste alone and not on a plain or rough way of doing it.
examples:
- She danced elegantly across the stage.
- He writes elegantly, with clear words and smooth sentences.
