simpleMeaning: A sea animal with no backbone, with tube feet and a body in five equal parts around a centre
scope: A sea animal with no backbone and a body in five equal parts, not a fish and not a shellfish.
examples:
- The starfish is an echinoderm, with tube feet and a five-part body.
- An echinoderm has no backbone and lives in the sea.
