simpleMeaning: a woman who uses her sexual charm to draw men in and use them for her own gain
scope: A woman who uses her sexual charm to use men, also called a tease. It is not the fun acting itself,
  and not the verb for acting in that way.
examples:
- People called her a flirt because she led men on and then took their money.
- In the story, the flirt smiles at each rich man and uses him for gifts.
