simpleMeaning: Said of things of Japan, its people, their way of life, or their tongue, or things like
  them.
scope: Also called Japanese; said of Japan, its people, their way of life and their tongue, not of any
  other land.
examples:
- The Nipponese Emperor ruled in the last century.
- Nipponese cars are sold all over the world.
