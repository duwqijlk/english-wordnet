simpleMeaning: forming the central part of something, or like such a part
scope: This sense describes something that forms the central part of a whole or resembles such a part;
  it is not the nucleus of an atom or of a cell.
examples:
- The nuclear part of the organization makes all the key decisions.
- The nuclear group at the center of the movement set the agenda.
