simpleMeaning: birds from Australia and south-east Asia that make a sweet, clear call that sounds like
  music
scope: 'Also called thickhead: a bird from Australia or south-east Asia with a sweet, clear call; not
  the large-headed duck of the far north.'
examples:
- The whistler's sweet, clear call rang out from the trees in Australia.
- We heard a whistler singing in the forest in south-east Asia.
