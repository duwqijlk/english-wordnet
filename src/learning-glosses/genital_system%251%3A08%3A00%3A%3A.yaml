simpleMeaning: The parts of the body that make and mature sex cells, join them, and grow them into young
scope: These are the body parts that make and mature sex cells, join them and grow them into young; reproductive
  system is another name for this sense, not the parts that digest food and not the parts that carry blood.
examples:
- The genital system matures at puberty.
- Disease can damage the genital system and stop it working.
