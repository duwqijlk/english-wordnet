simpleMeaning: Rock formed from hot melted stone that came out of a volcano and hardened on or near the
  ground, such as rhyolite, andesite, or basalt
scope: Rock that hardened on or near the ground after coming out of a volcano, not the adjective that
  means relating to volcanoes in general.
examples:
- Volcanic rock covers much of the island.
- Basalt is a dark volcanic stone formed from cooled lava.
