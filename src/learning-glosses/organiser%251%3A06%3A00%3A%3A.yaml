simpleMeaning: 'a light electronic device held in the hand, for ordinary users, like a computer but only
  for set tasks: a diary, stored personal facts, phone calls or an alarm clock'
scope: 'Also called organizer, personal digital assistant, personal organiser and personal organizer:
  this is the small electronic device, not a person who brings order to a business or group.'
examples:
- He kept his meetings and phone numbers in his organiser.
- Her organiser woke her at seven and reminded her of the day's work.
