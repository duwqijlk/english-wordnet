simpleMeaning: In maths, a number found by dividing the side across from an angle by the side next to
  it in a triangle with a right angle
scope: In maths, a number made from two sides of a triangle with a right angle, not the brown colour skin
  gets from the sun and not making leather from animal skin.
examples:
- In maths class, we worked out the tan of the angle.
- If the opposite side is 3 and the next side is 4, the tan is 3 divided by 4.
