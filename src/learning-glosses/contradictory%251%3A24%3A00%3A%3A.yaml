simpleMeaning: In logic, two claims of which both cannot be true at once, and both cannot be false at
  once
scope: In logic, this is a pair of claims that cannot both be true and cannot both be false at once, not
  a single claim that goes against another.
examples:
- 'The two statements are contradictory: both cannot be true at once.'
- '''He is here'' and ''He is not here'' are contradictory claims.'
