simpleMeaning: In pharmacology, the getting out of drug stuffs that dissolve in water, by boiling.
scope: In pharmacology, getting drug stuffs out by boiling water; not a tea and not a tincture.
examples:
- The decoction was made by boiling the bark in water.
- She prepared a decoction of the root.
