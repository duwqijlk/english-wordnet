synsetId: 10378274-n
simpleMeaning: A person who fights a new thing put up near their own home but does not mind it going up
  somewhere else; short for 'not in my backyard'
scope: This is a person who fights a thing only when it is put up near their own home, not a person who
  fights new building anywhere.
examples:
- The NIMBY fought the new road near her house.
- He was called a NIMBY for blocking the flats next door.
