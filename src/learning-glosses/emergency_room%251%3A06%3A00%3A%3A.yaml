simpleMeaning: A place in a hospital or clinic with staff and tools ready to give quick care to people
  who need help at once
scope: This is a place in a hospital or clinic with staff and tools ready to give quick care to people
  who need help at once, not a ward for long stays and not a doctor's waiting place.
examples:
- They rushed her to the emergency room.
- The emergency room treats people who need help at once.
