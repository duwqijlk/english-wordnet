simpleMeaning: Take all the values a chance thing can have, add them, and work out the mean by dividing
  by how many values there are
scope: 'Also called arithmetic mean, expectation, and expected value: the mean of a thing that can change
  by chance, not a middle value and not the most common value.'
examples:
- The first moment of the dice scores is three and a half.
- To find the first moment, add all the values and divide by how many there are.
