simpleMeaning: sitting on eggs to keep them warm with the body so they can hatch
scope: 'Also called brooding: a bird sitting on its eggs so they hatch. It is not keeping something at
  a set temperature, and not the time before the first signs of an illness appear.'
examples:
- During incubation, the hen sat on her eggs day and night.
- Incubation ends when the eggs hatch and the young birds come out.
