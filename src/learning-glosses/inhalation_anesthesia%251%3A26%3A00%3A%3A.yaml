simpleMeaning: A deep sleep for surgery, brought on by breathing in a drug that takes away feeling.
scope: A deep sleep for surgery brought on by breathing in a drug, not sleep brought on by a needle and
  not numbing of one small part.
examples:
- The patient was put under inhalation anesthesia.
- Inhalation anesthesia kept her asleep through the operation.
