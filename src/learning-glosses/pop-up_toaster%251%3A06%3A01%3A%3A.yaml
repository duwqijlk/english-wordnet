simpleMeaning: Bread goes in standing through the slots of this machine, and when the heat has done its
  work the slices jump back out of the slots.
scope: This is a machine that takes bread standing through its slots and sends the slices back out when
  the heat has done its work, also called an automatic toaster, not a machine that toasts bread lying
  flat.
examples:
- My pop-up toaster is terrible; it always throws my toast on the ground.
- She put some slices in the pop-up toaster and waited for them to jump back out.
