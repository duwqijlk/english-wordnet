simpleMeaning: joined or held very closely together, with parts that fit into each other
scope: 'Also called interwoven and interlacing: joined closely together with parts fitting into each other,
  not the act of joining parts together.'
examples:
- The interlocking pieces of the puzzle fit together well.
- They built the wall with interlocking blocks that held firmly.
