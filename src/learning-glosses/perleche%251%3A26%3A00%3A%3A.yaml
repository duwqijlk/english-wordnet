simpleMeaning: Too little riboflavin, a vitamin the body needs, can leave the lips flaking, with small
  cracks at the corners of the mouth.
scope: It is also called cheilosis, the lip trouble that comes from too little of the vitamin riboflavin.
examples:
- Perleche left small cracks at the corners of her mouth.
- The doctor said the perleche came from too little riboflavin.
