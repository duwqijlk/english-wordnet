simpleMeaning: a food part that breaks down in water into only amino acids, the small bits that build
  the body
scope: A food part that breaks down into only amino acids, not a food part that breaks down into other
  things as well.
examples:
- Egg white has simple protein that breaks down into amino acids.
- The simple protein in the milk gave only amino acids when it broke down.
