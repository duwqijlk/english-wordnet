simpleMeaning: A small blood tube running into a blood tube taking blood from heart muscle, on back wall
  inside upper room getting blood from lungs
scope: A small blood tube running into a blood tube taking blood from heart muscle, on back wall inside
  upper room getting blood from lungs; not a blood tube that carries blood away from the heart, and not
  a tube on the front wall.
examples:
- The oblique vein of the left atrium joins the coronary sinus.
- Blood flows through the oblique vein of the left atrium into the tube that takes blood from the heart
  muscle.
