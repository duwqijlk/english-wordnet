senseId: 'syncopation%1:10:01::'
synsetId: 07147437-n
simpleMeaning: In speech sounds, the dropping of sounds from inside a word, as in fo'c'sle for forecastle.
scope: This sense is, in speech sounds, the dropping of sounds from inside a word, unlike the sense for
  a music beat pattern stressing a beat that is usually weak, and unlike the sense for music, especially
  dance music, with a syncopated rhythm.
examples:
- Syncopation drops sounds from inside a word, as in fo'c'sle.
- The syncopation in fo'c'sle shortens forecastle.
