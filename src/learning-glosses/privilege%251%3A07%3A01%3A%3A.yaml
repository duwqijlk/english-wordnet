simpleMeaning: In law, the right to refuse to tell others about information you learned in a private relationship
  where trust was expected
scope: In law, this is the right to keep private information secret, not a special right held by only
  one person or group and not the act of giving a right.
examples:
- The lawyer claimed privilege and refused to share what his client had told him in private.
- She used privilege to keep her private talks with her doctor out of court.
