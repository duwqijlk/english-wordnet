simpleMeaning: In golf, a problem that comes up when the other player's ball is in the way on the line
  from your ball to the hole
scope: 'Also called stymie: in golf, this is when the other player''s ball blocks your line to the hole,
  not a general block on a plan.'
examples:
- With his ball behind hers, he faced a stymy and could not aim straight at the hole.
- The stymy forced her to play her ball in a curve around the other ball.
