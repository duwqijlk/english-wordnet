simpleMeaning: to be enough for what someone wants or needs, or to meet a condition or restriction
scope: Another name for meet and fit when a want, need, condition or restriction is satisfied; not making
  a container or space full, and not eating until full.
examples:
- Her experience fills every requirement for the post.
- The new design fills the need for safer equipment.
