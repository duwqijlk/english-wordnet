simpleMeaning: To give it away, give it up, or pass it on to someone else is not possible for this thing
scope: This is the state of a thing that cannot be given away or passed on to another, not something that
  can be sold or traded.
examples:
- The inalienability of the territory was written into the constitution.
- They defended the inalienability of their rights.
