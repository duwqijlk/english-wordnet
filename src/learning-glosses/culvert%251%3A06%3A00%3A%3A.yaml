simpleMeaning: a drain that goes across and is fully closed in, under a road or railway
scope: This is a closed drain that goes across under a road or railway, not an open ditch at the side
  of a road and not a bridge over water.
examples:
- Water flows through the culvert under the road.
- Workers put in a new culvert under the railway.
