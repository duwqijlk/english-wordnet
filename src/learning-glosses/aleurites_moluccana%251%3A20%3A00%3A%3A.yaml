simpleMeaning: A big tree from southeastern Asia; its nuts give oil used in varnishes, and nut kernels
  tied together are used nearby as candles.
scope: A big tree from southeastern Asia whose nuts give oil for varnishes, also called candlenut and
  varnish tree; its nearest kin are other big trees whose nuts give oil.
examples:
- We tied the nut kernels of Aleurites moluccana together to make candles.
- The nuts of Aleurites moluccana give oil used in varnishes.
