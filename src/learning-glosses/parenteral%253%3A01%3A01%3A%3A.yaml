simpleMeaning: given by a way other than through the gut, such as by a shot into a muscle or into a vein
scope: Given by a shot or another way that skips the gut, not taken by mouth or swallowed.
examples:
- The nurse gave the parenteral drug by a shot into the arm.
- Parenteral feeding skips the gut and goes straight into a vein.
