senseId: 'adversative_conjunction%1:24:00::'
synsetId: 13822479-n
simpleMeaning: The link between words or groups of words that sets one meaning against the other.
scope: The link that sets one meaning against the other, not a link that joins two like things and not
  the joining word itself.
examples:
- In 'poor but happy', the adversative conjunction sets the two words against each other.
- An adversative conjunction marks a clash of meanings.
