simpleMeaning: Not every animal lists put it apart from the big kind; it looks like a raccoon, and its
  coat is brown touched with rose.
scope: Also called panda, bear cat, cat bear, and lesser panda, this meat-eater looks a little like a
  raccoon and is not always put with the big kind.
examples:
- We saw a red panda at the zoo.
- The book lists the red panda apart from the big kind.
