simpleMeaning: Any of the pale or ashy mosses of the group it is named for, whose rotted remains make
  peat.
scope: Any of the pale or ashy mosses of the group it is named for — the group Sphagnum —, whose rotted
  remains make peat; also called bog moss, peat moss, or sphagnum moss.
examples:
- Their sphagnum grew in the bog.
- The sphagnum was cut at dawn.
