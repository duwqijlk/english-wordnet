simpleMeaning: A Czech kind of surrealism, a way of making art that shows dream-like pictures, started
  in 1928 by Jindrich Styrsky and Toyen, whose full name was Marie Cerminova.
scope: A Czech form of surrealism started in 1928, not surrealism in general.
examples:
- Styrsky helped to start artificialism in 1928.
- Toyen was one of the two artists who founded artificialism.
