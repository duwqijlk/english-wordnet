simpleMeaning: A worker at the door takes the car, puts it away, and brings it back when asked, at a club,
  a place to eat, an airport, or somewhere like that.
scope: A club, a place to eat, or an airport may offer this service, in which a worker takes a car at
  the door and brings it back when asked.
examples:
- We used valet parking at the restaurant and the attendant brought our car round.
- The hotel offers valet parking, so you can leave the car at the entrance.
