simpleMeaning: the blood that comes out each month from the womb of a woman who is not pregnant, starting
  when her body becomes adult and ending in her later years
scope: This monthly flow of blood, also called flow, period, menses, catamenia, and menstruum, is a body
  process; it is not blood from a cut or other bleeding.
examples:
- Menstruation usually happens about once a month for women who are not pregnant.
- Her menstruation stopped during pregnancy and started again after the baby was born.
