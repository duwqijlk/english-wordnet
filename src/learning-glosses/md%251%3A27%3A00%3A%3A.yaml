simpleMeaning: A radioactive element beyond uranium, made by hitting einsteinium with alpha particles;
  the sign now used for it replaced the old sign Mv.
scope: Also called atomic number 101, mendelevium, and Mv; a radioactive element beyond uranium, not a
  stable metal and not a gas.
examples:
- Md is the current symbol for mendelevium.
- Scientists made Md by bombarding einsteinium with alpha particles.
