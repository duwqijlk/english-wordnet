simpleMeaning: The details written on a letter or parcel that tell the postal service where to send it.
scope: This is the set of written delivery details on mail or a package, not the place where a person
  or organization can be found, the sign on a building, a formal speech, a way of speaking to someone,
  tact, a golfer's stance or aim, computer storage code, or any verb use such as speaking, greeting, giving
  a speech, directing a question, applying oneself to a task, locating data by a code, or treating a subject
  artistically.
examples:
- The address on the parcel was smudged, so the courier could not read it.
- Please write the full address clearly on the envelope.
