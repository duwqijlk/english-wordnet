senseId: 'coriolis_effect%1:19:00::'
synsetId: 11433377-n
simpleMeaning: The bending of moving bodies in a turning frame, at right angles to path and axis; on Earth
  it bends them right in the north and left in the south.
scope: In physics, the turning of moving bodies in a turning frame, not the Coriolis force itself and
  not the spin of the Earth.
examples:
- The Coriolis effect bends the winds to the right in the north.
- Sailors allow for the Coriolis effect when they cross the ocean.
