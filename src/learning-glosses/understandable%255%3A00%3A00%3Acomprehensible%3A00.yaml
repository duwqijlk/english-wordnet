simpleMeaning: can be grasped and made sense of by whoever comes across it
scope: Something a person can take in and make sense of, not something too hard to follow and not something
  meant only for experts.
examples:
- The teacher's notes were so plain that everything in them was understandable.
- He spoke slowly, in simple words, so that his meaning was understandable to us all.
