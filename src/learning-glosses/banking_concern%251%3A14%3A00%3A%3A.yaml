simpleMeaning: A money firm that takes in savings and lends the money out to others
scope: A money firm that takes in savings and lends the money out, not a firm that only keeps money safe
  and not a shop that sells things; bank, banking company and depository financial institution are other
  names for it.
examples:
- The banking concern lent money to small firms.
- She worked for a banking concern in the city.
