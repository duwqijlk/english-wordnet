simpleMeaning: full of great sadness, or made very sad by trouble or loss
scope: 'Also called woeful: full of great sadness, not just tired or ill and not angry.'
examples:
- After he lost his job, he looked woebegone for weeks.
- The woebegone dog sat by the door and waited for its owner.
