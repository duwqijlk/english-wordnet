simpleMeaning: A piece of television equipment that uses a lens to focus a picture onto a light-sensitive
  surface, which a beam of electrons then reads line by line.
scope: This is not a device for taking still photographs; it is the part of a television system that turns
  a live scene into an electronic signal.
examples:
- The studio's television camera sent a live picture of the anchor to the control room.
- The crew aimed the television camera at the stage, and the feed went out live.
