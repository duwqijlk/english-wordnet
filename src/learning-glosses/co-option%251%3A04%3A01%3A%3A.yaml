simpleMeaning: putting a person into a post at once, with or without that person's agreement
scope: 'Also called co-optation: putting a person into a post at once, not a slow choice after talks and
  not a vote.'
examples:
- The co-option of two new members filled the empty seats.
- His co-option to the committee happened before he knew he had been picked.
