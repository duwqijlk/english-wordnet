simpleMeaning: A clear oily liquid that is the single building block of polystyrene
scope: A clear oily liquid that is the single building block of polystyrene; phenylethylene is another
  name for this sense, not the solid plastic made from it and not other oily liquids.
examples:
- Cinnamene is the monomer for polystyrene.
- The factory stores cinnamene in sealed drums.
