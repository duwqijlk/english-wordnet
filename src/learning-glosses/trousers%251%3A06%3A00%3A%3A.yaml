simpleMeaning: A piece of clothing, usually used in the plural, that covers each leg on its own from the
  waist down to the knee or ankle
scope: 'Also called pant: a garment for the legs, usually used in the plural, not a skirt and not shorts
  that stop above the knee.'
examples:
- He had a sharp crease in his trousers.
- She bought a new pair of trousers for work.
