senseId: 'stock_epithet%1:10:01::'
synsetId: 92464069-n
simpleMeaning: A set word or phrase a writer uses again and again to describe a thing or, more often,
  a person
scope: A set word or phrase a writer uses again and again to describe a thing or, more often, a person;
  not a new name made up once and not a title of a book.
examples:
- The poet used the same stock epithet for his hero.
- A stock epithet is a set phrase a writer uses again and again.
