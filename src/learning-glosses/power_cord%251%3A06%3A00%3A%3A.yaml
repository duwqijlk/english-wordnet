simpleMeaning: This length of wire carries the electric flow that makes a machine work
scope: A length of wire that carries the electric flow to a machine, not a rope for tying things and not
  a wire inside the machine itself.
examples:
- The power cord of the lamp was too short to reach the wall.
- She unplugged the power cord before moving the machine.
