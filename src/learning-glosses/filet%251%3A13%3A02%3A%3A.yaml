simpleMeaning: a long slice of fish, or one side of a fish with the bones taken out
scope: Also called fillet, this is a piece of fish with the bones taken out; it is not a piece of beef
  and not the act of cutting fish.
examples:
- She cooked a filet of salmon for dinner.
- The filet lay on ice, clean and without bones.
