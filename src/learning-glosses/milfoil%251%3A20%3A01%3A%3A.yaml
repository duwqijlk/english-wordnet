simpleMeaning: A common strong-smelling Eurasian herb that forms mats, with narrow toothed leaves and
  small usually white flower heads; now widespread across North America.
scope: The dry-land meadow and roadside herb also called yarrow, not the water milfoil that grows in ponds.
examples:
- Milfoil grew in thick patches along the hedgerow.
- The old pasture was full of milfoil and other tough weeds.
