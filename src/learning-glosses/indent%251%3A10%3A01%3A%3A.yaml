senseId: 'indent%1:10:01::'
synsetId: 06401396-n
simpleMeaning: the empty space between the left edge of a page and the start of a line that is set in
  from that edge
scope: 'Also called indentation, indenture and indention: the empty space at the start of a line set in
  from the edge, not an order for goods to sell across borders and not a deal that binds a worker to a
  master.'
examples:
- Leave a clear indent at the start of each new part of the text.
- The indent on this page is wider than the one on the last page.
