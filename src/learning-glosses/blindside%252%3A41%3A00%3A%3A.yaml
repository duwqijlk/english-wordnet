simpleMeaning: to surprise a person when they do not expect it, especially in a way that harms them
scope: To surprise a person when they do not expect it, especially with harm; not to hit a person from
  the side they cannot see.
examples:
- The sudden price rise blindsided many small shops.
- Losing his job blindsided him and left him in debt.
