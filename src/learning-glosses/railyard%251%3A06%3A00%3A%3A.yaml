simpleMeaning: A large open space with many tracks and side lines for keeping and fixing train cars and
  engines
scope: A place where train cars and engines are kept and fixed, also called a yard or a railway yard;
  not a single track and not a station platform.
examples:
- The railyard held dozens of cars overnight.
- A railyard worker waved the engine through the gates.
