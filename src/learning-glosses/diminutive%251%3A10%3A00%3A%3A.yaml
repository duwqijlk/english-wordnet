schema: oewn-learning-gloss-v2
senseId: 'diminutive%1:10:00::'
synsetId: 06301026-n
simpleMeaning: a word made by adding a short ending (a suffix, such as '-let' or '-kin') that shows something
  is small
scope: A word form whose ending shows smallness; not the adjective use of the word, which just means very
  small.
examples:
- '''Booklet'' is a diminutive of ''book''.'
- The word 'piglet' is a diminutive that means a small pig.
