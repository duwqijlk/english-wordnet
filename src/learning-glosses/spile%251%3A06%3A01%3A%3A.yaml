simpleMeaning: a long, strong post of wood, steel, or concrete (a hard building mix) that is driven into
  the ground to hold up a building or other structure
scope: Also called pile, piling, and stilt, this is a post driven into the ground to hold up a building,
  not a plug for a barrel hole.
examples:
- Workers drove each spile deep into the wet ground before building began.
- The small bridge rests on wooden spiles under the water.
