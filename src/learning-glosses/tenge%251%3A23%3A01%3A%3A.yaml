simpleMeaning: A unit of money in Turkmenistan; 100 of them equal one manat.
scope: A unit of money in Turkmenistan, of which 100 equal one manat, the larger unit of money there,
  unlike the money used in other countries.
examples:
- He paid ten tenge for the bread in Turkmenistan.
- One hundred tenge equal one manat in Turkmenistan.
