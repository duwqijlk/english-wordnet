simpleMeaning: In linguistics, the relation between a verb's subject and the action it names, whether
  the subject acts or is acted upon.
scope: This is the grammatical relation of a verb's subject to its action, not the sound made by the vocal
  folds, not the quality or pitch of someone's speech, not a sound resembling a vocal utterance, not expression
  in words, not a means of expressing something, not a medium suggestive of speech, not a singer, not
  a spokesperson or advocate, not the ability to speak, not a melodic line in polyphonic music, not the
  phonetic voiced/voiceless distinction, and not the verb senses meaning to express or to utter with the
  vocal cords.
examples:
- The editor rewrote the sentence in the active voice.
- Passive voice is common in scientific reports.
