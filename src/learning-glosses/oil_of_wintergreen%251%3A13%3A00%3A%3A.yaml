simpleMeaning: A liquid or taste got from a low plant that creeps along the ground, or from the teaberry
  plant.
scope: A liquid or taste got from a low creeping plant or from the teaberry plant; not the plant itself
  and not a liquid used to cook with.
examples:
- Oil of wintergreen gave the sweet its taste.
- He rubbed oil of wintergreen on his sore leg.
