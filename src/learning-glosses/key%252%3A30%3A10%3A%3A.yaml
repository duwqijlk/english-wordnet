simpleMeaning: To tune something so that the notes it makes are at the right musical pitch.
scope: This is setting the musical pitch of something, not scratching a car's paint with a metal key,
  not supplying something with a key, not identifying a plant or animal by its features, not harmonizing
  with or matching something else, and not the noun senses such as a lock opener, a keyboard lever, or
  a musical scale.
examples:
- A technician keyed the organ to concert pitch before the recital.
- She keyed the old piano carefully until every note matched the tuning fork.
