simpleMeaning: A supposed tiny bit of living stuff that was thought to control what a child takes from
  its parents
scope: A supposed tiny bit of living stuff thought to control what a child takes from its parents; not
  a gene as we know it now and not a cell.
examples:
- The old theory of the pangen tried to explain heredity.
- Darwin wrote of pangens as the carriers of traits.
