simpleMeaning: Often kept in the house, this flowering plant bears thin branching sprays of small yellow
  and brown blooms and belongs to the orchid group called Oncidium.
scope: A flowering plant of the Oncidium group, also called butterfly orchid, dancing lady orchid, and
  oncidium, not the other orchid also called butterfly plant with pink-and-white flowers.
examples:
- My butterfly plant has thin sprays of small yellow flowers.
- She keeps a butterfly plant on the window sill.
