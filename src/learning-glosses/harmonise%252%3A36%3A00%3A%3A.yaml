simpleMeaning: To sing or play in tune.
scope: This sense is also called harmonize, for singing or playing in tune, unlike the sense for bringing
  into tune, concord, or accord while making music or singing, unlike the sense for setting things in
  tune, or tying them in tune, and unlike the sense for writing a harmony for.
examples:
- They harmonise, singing in tune.
- They harmonise, playing in tune.
