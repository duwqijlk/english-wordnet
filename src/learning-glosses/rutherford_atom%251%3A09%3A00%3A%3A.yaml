simpleMeaning: 'The first modern picture of matter''s smallest part: all plus charge and most weight sit
  in a tight centre, and electrons matching its number fill the rest, cancelling the charge'
scope: The first modern picture of how the smallest part of matter is built, not the later picture with
  electrons circling in fixed rings.
examples:
- In the Rutherford atom, most of the weight sits in the tiny centre.
- The Rutherford atom was the first modern picture of how matter is built.
