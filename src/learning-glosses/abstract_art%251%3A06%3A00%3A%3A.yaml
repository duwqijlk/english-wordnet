simpleMeaning: Picture-making where the shapes, lines and colours inside a work matter, not any likeness
  of things seen.
scope: This kind of picture-making, also called abstractionism, puts shapes, lines and colours first,
  not likeness.
examples:
- The walls are hung with abstract art.
- In abstract art, shapes matter more than likenesses.
