simpleMeaning: acting as if you are better than other people and looking down on those you think are not
  good enough
scope: Also called haughty, imperious, disdainful, lordly, swaggering, prideful, overbearing and sniffy.
  This sense is looking down on people you think are not good enough, not just feeling glad about something
  you did well.
examples:
- She gave him a supercilious look and turned away from the young workers.
- His supercilious tone made the new students feel small and unwelcome.
