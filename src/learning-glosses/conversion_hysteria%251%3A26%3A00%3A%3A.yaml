simpleMeaning: Bodily trouble with no clear cause — a limb that will not move, or feeling lost from part
  of the body — when the cause is inner conflict in the mind.
scope: This is the bodily trouble that comes from inner conflict in the mind, also called conversion disorder
  or conversion reaction, and not a sickness of the body itself.
examples:
- Her conversion hysteria left one arm without feeling.
- His conversion hysteria showed itself as a leg that would not move.
