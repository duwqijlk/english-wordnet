senseId: 'intimidation%1:04:01::'
synsetId: 01224966-n
simpleMeaning: the act of making a weaker person feel afraid so that they will do what you want
scope: This is the act of making a weaker person afraid to control what they do; it is not the feeling
  of being afraid, and not the low feeling you get near someone famous or rich.
examples:
- The boss used intimidation to make the workers stay late.
- Intimidation by the older boys made the younger ones hand over their money.
