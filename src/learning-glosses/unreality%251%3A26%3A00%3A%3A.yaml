simpleMeaning: the state of having no solid form or being only in the mind; not there in fact
scope: This is the state of being only in the mind and not there in fact, not the quality of something
  that is not real.
examples:
- There was a feeling of unreality about the empty town after the storm.
- In his dream, the unreality of the place made him feel lost.
