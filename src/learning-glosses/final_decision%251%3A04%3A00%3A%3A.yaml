simpleMeaning: A court ruling that settles the case before the court; after it is given, by the court
  or after an appeal, all that is left is to carry it out
scope: A court ruling that settles the case before the court; after it is given, by the court or after
  an appeal, all that is left is to carry it out, also called a final judgment; not a ruling that leaves
  part of the case open and not an order made before the trial.
examples:
- The final decision settled the case.
- After the final decision, the court enforced the ruling.
