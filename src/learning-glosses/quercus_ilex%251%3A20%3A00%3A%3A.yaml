senseId: 'quercus_ilex%1:20:00::'
synsetId: 12292949-n
simpleMeaning: An oak of south Europe that keeps its leaves all year, with leaves a little like those
  of holly, that gives hard wood.
scope: Also called evergreen oak, holly-leaved oak, holm oak and holm tree; an oak of south Europe that
  keeps its leaves all year, not an oak that loses its leaves in winter and not an oak of North America.
examples:
- Quercus ilex keeps its leaves through the winter.
- The Quercus ilex by the house gives hard wood for tools.
