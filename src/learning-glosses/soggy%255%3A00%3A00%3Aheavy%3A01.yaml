simpleMeaning: having the feel of dough because it did not rise enough or was not cooked the right way
scope: Bread or cake with the feel of dough from too little rising or bad cooking, not merely wet food.
examples:
- The cake fell, and it was a soggy mess.
- Her soggy loaf had not risen, so it sat heavy like dough.
