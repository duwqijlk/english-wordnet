simpleMeaning: A toad found in very many kinds of land, from south Alaska to Baja California, west of
  the Rocky Mountains.
scope: Also called a western toad; a toad of very many kinds of land from south Alaska to Baja California,
  west of the Rocky Mountains, not a toad of the east.
examples:
- Bufo boreas hid under a rock in the dry hills.
- We found Bufo boreas near the pond at dusk.
