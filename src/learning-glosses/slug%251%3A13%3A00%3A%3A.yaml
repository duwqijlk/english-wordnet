simpleMeaning: A mouthful of strong drink, usually liquor, poured out or gulped down.
scope: This is a mouthful of strong drink, not a unit of mass, nor the soft animal, nor a hard blow, nor
  the boxing blow.
examples:
- He took a slug of hard liquor.
- She poured herself a slug of whisky.
