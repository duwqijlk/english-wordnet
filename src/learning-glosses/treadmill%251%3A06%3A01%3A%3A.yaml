simpleMeaning: a machine for exercise with a belt that moves in a circle, so a person can walk or jog
  without moving from one place
scope: A machine for exercise with a moving belt, not an old mill turned by people or animals walking,
  and not a boring job with hard work that keeps you in one place.
examples:
- She walks on a treadmill at the gym every morning.
- He jogged for twenty minutes on the treadmill without going anywhere.
