senseId: 'rappel%1:04:00::'
synsetId: 00327635-n
simpleMeaning: In climbing, a way down a sheer rock face or wall on a doubled rope fixed above and wound
  round the body.
scope: Also called abseil, this is the descent itself in climbing, not the verb for going down by means
  of it.
examples:
- The rappel down the cliff took only a few minutes.
- She made a rappel from the top of the wall to the ledge below.
