simpleMeaning: a free-swimming sea animal with no stalk and ten soft arms like feathers, found on muddy
  sea floors
scope: A free-swimming sea animal with ten soft arms like feathers; feather star is another name for this
  sense; not a fixed sea plant, and not a starfish with five arms.
examples:
- The comatulid drifted over the muddy sea floor.
- A comatulid waved its ten feathery arms in the water.
