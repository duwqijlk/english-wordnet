simpleMeaning: Beyond the old city line of New Orleans lies a part of the city known by the name of one
  of its quarters
scope: A part of New Orleans outside the old city line, not a part inside it and not a town on its own.
examples:
- They lived in Faubourg Marigny, just outside the old city line.
- The old faubourg grew up beyond the first walls of New Orleans.
