simpleMeaning: The vein of the outer sex parts on each side takes blood from small veins near the surface
  on the upper side of the clitoris.
scope: The veins on the upper side of the clitoris near the surface feed blood into the vein of the outer
  sex parts on each side, and they are not the deep veins below the surface.
examples:
- The venae dorsales clitoridis superficiales feed blood into the vein of the outer sex parts on each
  side.
- Blood from the venae dorsales clitoridis superficiales flows into the vein on each side.
