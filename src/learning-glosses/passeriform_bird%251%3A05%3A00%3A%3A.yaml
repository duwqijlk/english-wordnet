simpleMeaning: Four toes set to grip a branch let these small birds sit on branches, mostly near the ground;
  most sing, and their young hatch helpless.
scope: Also called passerine, this is a small bird that sits on branches, mostly near the ground, with
  four toes made for gripping.
examples:
- Most passeriform birds sing from low branches.
- The passeriform bird gripped the twig with its four toes.
