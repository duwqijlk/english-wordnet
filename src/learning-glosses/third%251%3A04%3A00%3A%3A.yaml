simpleMeaning: the job of the baseball player who guards the base on the far side of the infield, three
  bases around from home plate.
scope: It is not the adverb for coming after the first two, and it is not a share of something divided
  into three.
examples:
- He plays third for the school baseball team.
- Third is a hard position for a beginner to learn.
