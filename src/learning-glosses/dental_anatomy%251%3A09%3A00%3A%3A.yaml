simpleMeaning: The part of the study of body shapes that deals with the shape of teeth
scope: The study of the shape of teeth, not the study of tooth disease and not the work of fixing teeth.
examples:
- Dental anatomy taught her the shape of each tooth.
- He studied dental anatomy before learning to fill teeth.
