simpleMeaning: A nuclear change in which a huge nucleus splits into smaller nuclei, letting out energy
  at the same time.
scope: A nuclear change in which a huge nucleus splits into smaller nuclei, letting out energy at the
  same time; not the breeding of some one-celled living things by splitting the cell into two more or
  less even parts.
examples:
- Their fission split at dawn.
- The fission was seen at noon.
