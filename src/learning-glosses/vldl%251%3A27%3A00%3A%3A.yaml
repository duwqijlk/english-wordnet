simpleMeaning: Large fat-carrying particles rich in triglycerides, a kind of fat, that move through the
  blood giving up fat to fat and muscle tissue until what is left changes into LDL.
scope: Also called very low density lipoprotein; large fat-carrying particles in the blood that give up
  fat to fat and muscle tissue, not the LDL they change into and not the HDL of the blood.
examples:
- VLDL carries fat through the blood to fat and muscle tissue.
- Too much VLDL in the blood can harm the heart.
