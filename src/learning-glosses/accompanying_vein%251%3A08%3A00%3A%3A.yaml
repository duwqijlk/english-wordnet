senseId: 'accompanying_vein%1:08:00::'
synsetId: 05364708-n
simpleMeaning: Beside another part of the body, this blood tube may run with a vessel that takes blood
  from the heart, whose beats help push the blood back to the heart.
scope: This is a blood tube that runs with another part of the body, also called vena comitans, not a
  blood tube that carries blood to the heart on its own.
examples:
- The accompanying vein runs beside the artery, and the artery's beats help the blood move back.
- An accompanying vein may lie close to an artery so the pulses help the blood return.
