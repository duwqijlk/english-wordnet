senseId: 'dilatory_plea%1:10:00::'
synsetId: 06573452-n
simpleMeaning: A plea, usually in a defendant's answer, that puts off the case without settling it, and
  may question the court's power, the defendant's ability to be sued, or more
scope: A court plea that delays a case without settling it, not a plea that admits or denies the claim.
examples:
- The lawyer entered a dilatory plea to put off the hearing.
- A dilatory plea can question whether the court has power over the case.
