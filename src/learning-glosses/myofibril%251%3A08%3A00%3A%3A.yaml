simpleMeaning: One of many threads that can pull tight and make up a striped muscle thread.
scope: One of many threads that pull tight in a striped muscle thread; myofibrilla is another name for
  this, and it is not the whole muscle or a nerve thread.
examples:
- Each myofibril can pull tight.
- Myofibrils make up the striped muscle thread.
