simpleMeaning: Its fat roots below the ground can be eaten, and this long-lived plant from the middle
  of North America is covered in thick hairs.
scope: Also called breadroot and pomme de prairie, this is a hairy plant of the middle of North America
  with roots that can be eaten.
examples:
- The pomme blanche had fat roots below the ground.
- A pomme blanche is covered in thick hairs.
