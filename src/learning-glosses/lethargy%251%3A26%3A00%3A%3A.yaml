senseId: 'lethargy%1:26:00::'
synsetId: 14038461-n
simpleMeaning: a state like a deep sleep in which a person cannot wake up and does not move, as is seen
  in sleeping sickness
scope: Also called lassitude. This is a deep sleep-like state, not just the weaker feeling of tiredness
  and low energy in the other sense of this word.
examples:
- His illness brought a lethargy so deep he hardly woke all day.
- The sleeping sickness caused lethargy, and she slept without moving for hours.
