simpleMeaning: A bent line with the same shape on both sides of its middle, showing how numbers spread
  out in the most common pattern
scope: A bent line with the same shape on both sides of its middle, also called a bell-shaped curve; not
  a straight line and not the numbers themselves.
examples:
- The normal curve peaks in the middle and falls away on both sides.
- Test scores often follow a normal curve.
