simpleMeaning: Grown from the middle layer of the early embryo, this thin sheet of flat cells lines the
  inside of some hollow parts of the body.
scope: Some hollow parts of the body are lined inside by this thin sheet of flat cells.
examples:
- Under the microscope, she could see the endothelium lining the cavity.
- He pointed to the endothelium on the slide.
