simpleMeaning: A sparsely prickly East Indian plant, an annual herb or a long-lived low shrub, widely
  grown for fleshy flower cups, used in tarts and jelly, and for stem fibre.
scope: This is the hibiscus grown for its fleshy flower cups; red sorrel, roselle and sorrel are other
  names for the same plant. It is not the weedy sorrel picked as a table green, nor the wood-sorrel of
  the genus Oxalis.
examples:
- In the Caribbean, rozelle is cooked down into a spiced drink.
- He bought a jar of rozelle jam at the market.
