simpleMeaning: a wind instrument blown by the person who rode a horse that pulled a mail carriage in the
  1700s and 1800s
scope: This is a wind instrument blown by the person who rode a horse that pulled a mail carriage in the
  1700s and 1800s, not a modern brass instrument and not a car signal.
examples:
- The driver sounded the post horn as the carriage came into the village.
- A post horn from the 1800s hung on the wall of the old inn.
