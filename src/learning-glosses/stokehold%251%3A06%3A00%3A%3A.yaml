simpleMeaning: In sailing, a room on a ship where the furnaces are fed with fuel
scope: In sailing, a room on a ship where the furnaces are fed with fuel, also called a fireroom and a
  stokehole; not the room where the ship's engines sit and not a coal store.
examples:
- The men worked in the stokehold feeding the furnaces.
- A stokehold is the room where a ship's furnaces are fed.
