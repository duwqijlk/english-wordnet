simpleMeaning: a bird kept by people, of the chicken kind, thought to come from a wild red bird of the
  jungle
scope: Also called poultry and domestic fowl; this is the live bird kept by people, not its meat eaten
  as food.
examples:
- The farmer keeps fowl for their eggs.
- A fowl ran across the yard when the gate opened.
