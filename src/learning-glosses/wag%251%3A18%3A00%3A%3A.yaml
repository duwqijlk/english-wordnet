simpleMeaning: a person who is funny and quick in mind and makes jokes
scope: This is a funny person who makes jokes; card and wit are other names for this sense. Not the act
  of moving something from side to side.
examples:
- Everyone likes Tom because he is such a wag at parties.
- The old wag kept the table laughing with his jokes.
