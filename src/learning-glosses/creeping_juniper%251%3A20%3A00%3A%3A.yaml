simpleMeaning: A low bush that lies flat on the ground, from Canada and the northern United States, turning
  a dark purple-brown in winter
scope: This is a low bush that lies flat on the ground, from Canada and the northern United States, turning
  a dark purple-brown in winter; not a tall juniper that grows upright, and not a pine tree.
examples:
- Creeping juniper covered the rocky slope.
- In winter the creeping juniper turned a dark purple-brown.
