simpleMeaning: the thin outer skin that covers the long thread that carries signals away from a nerve
  cell
scope: The thin skin round the nerve thread, not the thread itself and not the skin round the whole nerve
  cell.
examples:
- The axolemma forms a thin cover over the whole length of the nerve thread.
- A tear in the axolemma lets salts leak in and out of the nerve thread.
