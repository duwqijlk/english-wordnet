simpleMeaning: Of, or like, the lands or peoples past the Alps from Italy, or north of the Alps.
scope: This means of, or like, the lands or peoples past the Alps from Italy, also called transalpine;
  not the noun sense of a Roman Catholic who backs the pope's power.
examples:
- The ultramontane lands lay north of the Alps.
- Ultramontane peoples traded across the mountains.
