simpleMeaning: One branch of the large family of tongues that covers Europe and Asia, made up of the tongues
  of India and the tongues of Iran
scope: This is one branch of the large family of tongues of Europe and Asia; Indo-Iranian is another name
  for this sense, and it covers the tongues of India and Iran, not the whole family and not one group
  on its own.
examples:
- Indo-Iranian language covers both the tongues of India and the tongues of Iran.
- Hindi and Persian are both part of Indo-Iranian language.
