simpleMeaning: A flower plant of South America and Trinidad with big yellow flowers marked with reddish-brown,
  that some put in the Oncidium group.
scope: Also called Oncidium papilio; a flower plant of South America and Trinidad with big yellow and
  reddish-brown blooms, not its smaller-flowered kin of South and Central America and not a flower plant
  of cold lands.
examples:
- Psychopsis papilio filled the glasshouse with big yellow blooms.
- The Psychopsis papilio by the window has flowers marked with reddish-brown.
