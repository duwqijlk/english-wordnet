simpleMeaning: Where the water is full of salt, this very old kind of tiny living thing can live and grow
scope: A very old kind of tiny living thing that needs a salt-rich place to live, also called halophile,
  not a salt-loving plant and not an ordinary germ.
examples:
- The halophil lived in water far saltier than the sea.
- Scientists found a halophil in the salt lake.
