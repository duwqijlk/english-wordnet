senseId: 'hemolytic_anemia%1:26:00::'
synsetId: 14188722-n
simpleMeaning: Red blood cells are broken up and destroyed, so the body ends up with too few of them
scope: A low count of red blood cells after they have been broken up and destroyed, also called haemolytic
  anaemia, not a low count from too little iron and not a low count from blood loss.
examples:
- Her hemolytic anemia left her tired and pale.
- The test showed hemolytic anemia after the red cells broke down.
