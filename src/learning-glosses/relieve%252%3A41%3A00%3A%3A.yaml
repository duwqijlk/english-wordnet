simpleMeaning: to keep someone or something safe from harm, from being destroyed, or from being ruined
scope: 'Also called save: this is about keeping a person or thing safe from harm, from being destroyed
  or from being ruined, not about making pain less and not about a rule that someone does not have to
  follow.'
examples:
- Rain after a long dry time relieved the farmers by saving their crops from ruin.
- The loan relieved the company and stopped it from being destroyed by debt.
