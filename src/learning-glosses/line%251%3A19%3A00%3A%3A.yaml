simpleMeaning: one particular frequency, or a very narrow range of frequencies, of radiation in a spectrum.
scope: This is not a visible mark or a boundary in a game; it is a narrow band of radiation.
examples:
- The astronomer measured a bright line in the star's spectrum.
- Each element leaves its own set of lines in the spectrum.
