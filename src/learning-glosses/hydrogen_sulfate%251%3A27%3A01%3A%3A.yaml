simpleMeaning: Written HSO4-, this is a salt or an ester made from the acid of sulfur.
scope: Also called bisulfate, this is a salt or an ester made from the acid of sulfur, not the acid itself.
examples:
- The chemist wrote hydrogen sulfate on the label as HSO4-.
- Hydrogen sulfate is one of the salts that sulphuric acid can form.
