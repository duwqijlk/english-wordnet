simpleMeaning: in everyday talk, the round of holiday resorts in the Catskill Mountains of New York that
  Jewish guests once went to most of all
scope: 'Also called borscht belt, borsht belt, and borsht circuit: a holiday area in the Catskill Mountains
  once favoured by Jewish guests, not a race track.'
examples:
- Many comedians learned their trade playing the borscht circuit.
- The borscht circuit drew Jewish families to the Catskills each summer.
