simpleMeaning: Joining a white blood cell to a tumour cell makes one cell that can be grown to give a
  single kind of antibody.
scope: Grown to give a single kind of antibody, this one cell comes from joining a white blood cell and
  a tumour cell.
examples:
- The antibody came from a hybridoma, not from a single white blood cell.
- The hybridoma went on making the same antibody.
