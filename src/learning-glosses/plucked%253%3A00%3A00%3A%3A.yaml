simpleMeaning: of an instrument with strings, played by pulling the strings with the fingers or with a
  small flat tool
scope: For an instrument with strings played by pulling them, not for a bird or skin with the feathers
  taken off.
examples:
- The guitar is a plucked instrument, and its strings are sounded with the fingers.
- He played the mandolin, a plucked instrument, with a small flat tool.
