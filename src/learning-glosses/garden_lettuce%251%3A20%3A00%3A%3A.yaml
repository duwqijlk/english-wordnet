simpleMeaning: a plant grown by people that lives for one year or for many years, with thick leaves full
  of juice eaten in salads, and grown in many places
scope: Also called common lettuce, this is a plant with thick leaves eaten in salads, not a wild lettuce
  and not a leafy green grown only for cooking.
examples:
- We grow garden lettuce in the back bed for summer salads.
- She picked a head of garden lettuce for the salad bowl.
