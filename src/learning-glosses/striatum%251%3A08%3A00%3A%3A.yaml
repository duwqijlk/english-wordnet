simpleMeaning: in each side of the brain, just before the thalamus, a deep relay, lies a striped mass
  of white and grey matter made from the caudate and lenticular nuclei
scope: 'Another name for striate body and corpus striatum: a striped mass of brain matter, not the thalamus
  itself and not the outer covering of the brain.'
examples:
- The striatum helps control movement.
- Damage to the striatum can change how a person moves.
