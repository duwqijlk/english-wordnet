simpleMeaning: Only when it rots or falls apart does this shut case on some fungi let its spores out,
  above all the families Aspergillaceae and Erysiphaceae.
scope: Also called cleistothecium, this is a shut case on some fungi that lets its spores out only when
  it rots or falls apart, not an open case that sheds spores into the air.
examples:
- The cleistocarp stays shut until it rots and lets its spores out.
- A cleistocarp holds its spores until it falls apart.
