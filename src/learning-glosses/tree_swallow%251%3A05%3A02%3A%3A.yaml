simpleMeaning: a bird from North America, blue-green and white, that makes its nest in holes in trees
scope: This is a blue-green and white North American bird that nests in holes in trees, also called a
  white-bellied swallow, and not a barn swallow or a bird that nests on the ground.
examples:
- A tree swallow flew back to the hole in the old oak.
- We saw a tree swallow feeding its young in a tree cavity.
