simpleMeaning: One card from a deck, marked with small symbols that give it a value in the game.
scope: A whole card in a deck, judged by the symbols printed on it; not the small printed mark on a card
  or die, and not a dirty mark on a surface.
examples:
- She played the eight-spot and took the trick.
- The five-spot was the only card left in his hand.
