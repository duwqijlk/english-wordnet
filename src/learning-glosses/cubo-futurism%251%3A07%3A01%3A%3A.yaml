simpleMeaning: The main way of painting and making statues followed by the Russian Futurists.
scope: The main style of the Russian Futurists, not other modern art styles and not Russian folk art.
examples:
- Cubo-futurism shaped much of Russian art in the early 1900s.
- The exhibition showed several works of cubo-futurism.
