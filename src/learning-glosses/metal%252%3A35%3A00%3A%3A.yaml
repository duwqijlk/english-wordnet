simpleMeaning: to cover a surface with a layer of hard, shiny material that conducts heat and electricity.
scope: This is not making an object from this material; it is putting a covering of it on something.
examples:
- The craftsman metalled the surface of the mirror frame.
- The fittings were metalled with a thin layer of brass.
