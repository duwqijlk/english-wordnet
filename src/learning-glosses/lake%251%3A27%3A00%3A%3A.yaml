simpleMeaning: any of many bright, see-through coloring substances made from carbon-based material.
scope: This is a bright coloring substance used in paints and inks, not a body of water and not the purple-red
  insect-based kind.
examples:
- The artist mixed a blue lake with oil to get a glowing color.
- These lakes give the ink its bright, clear tone.
