simpleMeaning: A single person holds all the power in such a state, held back by no law, no written rules,
  no voice raised against them, and nothing of the kind.
scope: Also called tyranny, authoritarianism, dictatorship, totalitarianism, despotism, absolutism, monocracy,
  and shogunate, this is a state where a single person holds all the power.
examples:
- The people lived under a one-man rule.
- A one-man rule ran the country.
