simpleMeaning: Brought into the United States above all to hold back soil, this grass from South Africa
  lives for many years, with stems in thick bunches that bend easily.
scope: This name covers a grass from South Africa that was brought into the United States above all to
  hold back soil.
examples:
- The weeping love grass grows in thick bunches.
- Weeping love grass was brought in to hold back the soil.
