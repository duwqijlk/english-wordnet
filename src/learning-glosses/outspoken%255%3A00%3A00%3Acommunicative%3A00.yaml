simpleMeaning: ready to say what you think freely, and to keep saying it with force
scope: 'Also called vocal: this sense is about saying what you think freely and with force, not just about
  speaking in a plain, direct way.'
examples:
- She is outspoken in her fight against unfair laws.
- The outspoken workers kept telling the boss what they thought was wrong.
