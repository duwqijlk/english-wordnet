simpleMeaning: a painter who is good at making special effects with different shades in a picture
scope: A painter who is very good at using shades in a picture, not a person who paints houses and not
  a person who puts colour on hair.
examples:
- The colorist was known for the bright reds and deep blues in her paintings.
- As a colorist, he could make a grey sea look full of light.
