simpleMeaning: Foods are heated just enough to kill harmful germs, without changing much how the food
  is made up.
scope: It is also called pasteurization, and it heats foods just enough to kill harmful germs without
  changing much how the food is made up.
examples:
- Pasteurisation killed the harmful germs in the food.
- The pasteurisation left the food much as it was.
