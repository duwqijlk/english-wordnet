simpleMeaning: To do with treating troubles of the mind by talking, or the work of doing so.
scope: For treatment of the mind by talking, and for the sessions in which it is done.
examples:
- The sessions were psychotherapeutic, helping her talk through her fears.
- His approach was psychotherapeutic, built on listening and talk.
