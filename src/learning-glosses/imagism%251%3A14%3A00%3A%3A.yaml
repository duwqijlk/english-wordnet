simpleMeaning: Early in the 1900s, a movement of American and English poets turned against old-style feeling
  and wrote plain speech in free verse with clear, solid pictures.
scope: A way of writing poems in plain speech with clear pictures.
examples:
- His poems show imagism in their short, clear lines.
- She studied imagism and the poets who wrote in free verse.
