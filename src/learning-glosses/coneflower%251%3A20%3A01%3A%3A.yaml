simpleMeaning: with showy flowers on long stalks, their drooping outer parts ringed round a pointed middle,
  these long-lived plants of the eastern United States have thick rough leaves
scope: A plant of the eastern United States with showy flowers around a pointed middle, not the yellow
  daisy plant of the same name grown in gardens.
examples:
