scope: A group of languages, not one single language, spread across Ethiopia, Somalia, north-western Kenya
  and nearby lands.
examples:
- Cushitic languages are spoken in Ethiopia, Somalia and Kenya.
- The Cushitic group covers several languages of north-eastern Africa.
