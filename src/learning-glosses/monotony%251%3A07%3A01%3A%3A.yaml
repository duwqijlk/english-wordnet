senseId: 'monotony%1:07:01::'
synsetId: 04746775-n
simpleMeaning: the way a voice or sound stays at the same level or note, with no change in how high or
  low it is
scope: This is about a voice or sound staying at the same level, not the dull sameness of a job or a day
  with no change.
examples:
- She read the whole list in complete monotony, never raising or lowering her voice.
- The monotony of the single note went on for a full minute with no change.
