simpleMeaning: The eleventh month of the civil year, and the fifth month of the church year in the Jewish
  list of months, in July and August.
scope: This is a month of the Jewish year, also called Ab, not a month of the Roman year or a feast day.
examples:
- Av falls in July and August.
- The fast of Av comes in the heat of summer.
