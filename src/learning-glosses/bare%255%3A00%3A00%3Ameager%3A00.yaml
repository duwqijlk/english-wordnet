simpleMeaning: Small in amount or degree, as in a modest livelihood or a poor harvest.
scope: This describes how little there is of something, not a surface with no cover and not a style without
  decoration.
examples:
- He earned a bare living from a few acres of stony ground.
- The shelter had only a bare supply of blankets for the winter.
