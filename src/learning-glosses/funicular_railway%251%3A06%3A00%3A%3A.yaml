simpleMeaning: A line of cars pulled by a moving rope up the side of a mountain, with cars going up and
  down in turn to balance each other.
scope: This is a line of cars pulled by a moving rope up a mountainside, also called a funicular or a
  cable railway; not a road up the mountain, and not a lift that hangs from a rope.
examples:
- We rode the funicular railway to the top of the mountain.
- The funicular railway carries cars up and down the steep side.
