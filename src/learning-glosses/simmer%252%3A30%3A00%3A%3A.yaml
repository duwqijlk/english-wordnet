simpleMeaning: to cook a liquid gently, just below the point where it bubbles fast
scope: To cook a liquid gently at low heat, not to boil it fast and not to let it cool.
examples:
- Simmer the sauce for ten minutes before you serve it.
- The simmering water barely moved in the pot.
