simpleMeaning: A Gnostic faith from the 2nd and 3rd centuries, holding John the Baptist to be the Messiah
  and mixing Jewish and Christian parts into a belief in two opposed powers.
scope: A faith centred on John the Baptist, also called Mandaeanism; not Judaism and not early Christianity.
examples:
- Mandeanism honours John the Baptist as the Messiah.
- Followers of Mandeanism keep ancient baptism rites.
