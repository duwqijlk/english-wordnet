simpleMeaning: A strong smell marks this yellow-brown sticky stuff from the tree it is named for, used
  above all in syrups for coughs.
scope: Also called balsam of tolu and tolu, this is the yellow-brown sticky stuff with a strong smell
  from a tree, used above all in syrups for coughs.
examples:
- The tolu balsam in the syrup gave it a strong smell.
- The cough syrup was made with tolu balsam.
