simpleMeaning: Smaller blood tubes from the upper sides of the stomach run into this blood tube, which
  empties into the portal blood tube.
scope: Also called the right gastric vein and vena gastrica-dextra, this blood tube is the one that takes
  in smaller tubes from the top of the stomach and empties into the portal blood tube, and it is not the
  portal blood tube itself.
examples:
- Small veins from the upper sides of the stomach join the pyloric vein.
- Blood from the top of the stomach flows through the pyloric vein.
