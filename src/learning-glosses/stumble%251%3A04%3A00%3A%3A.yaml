simpleMeaning: a way of walking that is not steady and not even
scope: 'Also called stagger and lurch: a way of walking that is not steady or even; not a mistake that
  makes a person feel ashamed, and not the act of walking in this way.'
examples:
- After the injury, his walk was a stumble, with slow, uneven steps.
- She crossed the room in a stumble, never once walking steadily.
