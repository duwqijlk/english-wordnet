simpleMeaning: The bend where the lower arm meets the upper arm, and the same bend in the front leg of
  a four-legged animal.
scope: 'Also called elbow, articulatio cubiti, cubital joint, cubitus, and human elbow: the bend where
  the lower arm meets the upper arm, not the wrist and not the shoulder.'
examples:
- He hurt his elbow joint playing tennis.
- The elbow joint bends the arm.
