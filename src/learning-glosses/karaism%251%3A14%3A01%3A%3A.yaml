simpleMeaning: A Jewish religious movement that turned away from spoken tradition as a source of God's
  law and held the Hebrew Bible alone as the true source of faith and practice.
scope: A Jewish movement that holds the Hebrew Bible alone as God's law, not Rabbinic Judaism, which also
  rests on spoken tradition, and not a Christian movement.
examples:
- Karaism spread in the Middle Ages among Jews who rejected oral tradition.
- A follower of Karaism reads only the Hebrew Bible for law.
