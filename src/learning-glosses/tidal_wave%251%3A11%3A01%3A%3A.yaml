simpleMeaning: An odd rise of water along the shore, often harmful, brought on by a storm or by wind together
  with a high tide
scope: This is an odd rise of water along the shore, often harmful, brought on by a storm or by wind together
  with a high tide; not a tide-driven swell and not an ordinary swell.
examples:
- The tidal wave rose along the shore after the storm.
- Wind and high tide together brought a tidal wave to the seashore.
