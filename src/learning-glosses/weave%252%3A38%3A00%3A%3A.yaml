simpleMeaning: To move, or to make a thing move, in a winding path that bends, turns, or goes round in
  a ring
scope: Moving in a winding, turning path, also called wind, wander and thread, not making cloth and not
  the pattern the threads make.
examples:
- The river weaves through the hills.
- The path weaves through the vineyards.
