simpleMeaning: Hit or scraped with steel, this mix of metals gives off sparks; it is what the small stones
  in lighters are made of.
scope: Lighter flints are made of this mix of metals, which gives off sparks when hit or scraped with
  steel.
examples:
- The pyrophoric alloy in the lighter gave off sparks when it was struck.
- A pyrophoric alloy is used to make the flints in lighters.
