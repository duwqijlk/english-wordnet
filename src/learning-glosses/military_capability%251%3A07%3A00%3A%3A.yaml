simpleMeaning: The gear a fighting force has, along with the soldiers it has, shows what it can do in
  a war
scope: 'Also called military posture, military strength, posture and strength: how much a fighting force
  can do in a war, judged by its soldiers and gear, not one battle and not the bravery of a single soldier.'
examples:
- The country's military capability grew as it bought new ships and trained more soldiers.
- Analysts judged the army's military capability by its troops and its gear.
