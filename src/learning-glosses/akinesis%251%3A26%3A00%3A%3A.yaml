simpleMeaning: a body that cannot move at all for a while because its muscles are held still by a short-lived
  loss of power
scope: 'Another name for this state is akinesia: a body unable to move for a while, not a body frozen
  in place for good and not a state of being asleep.'
examples:
- The akinesis in his legs lasted only a few minutes after the treatment.
- Her akinesis faded slowly as the feeling came back to her hands.
