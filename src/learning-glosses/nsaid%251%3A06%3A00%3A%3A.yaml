simpleMeaning: A drug that takes down swelling and holds none of the strong drugs called steroids.
scope: Also called nonsteroidal anti-inflammatory and nonsteroidal anti-inflammatory drug; a drug that
  takes down swelling without steroids, not a drug that holds steroids.
examples:
- She took an NSAID to bring down the swelling in her knee.
- The doctor said an NSAID would help the pain without steroids.
