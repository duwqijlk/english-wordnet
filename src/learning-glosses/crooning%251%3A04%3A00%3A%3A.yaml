simpleMeaning: the act of singing songs that many people like in a way that shows feelings
scope: This is the act of singing songs that many people like in a way that shows feelings. It is not
  singing with no feeling, and it is not speaking or reading the words.
examples:
- His crooning of old love songs made the room quiet.
- We could hear crooning from the next room all evening.
