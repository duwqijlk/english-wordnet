simpleMeaning: The rank of an ambassador is held by the most senior envoy one country sends to another
scope: A country's top envoy to another country, with the rank of an ambassador, not a consul and not
  a junior envoy.
examples:
- The high commissioner met the prime minister to talk about trade.
- She was named high commissioner to Canada last year.
