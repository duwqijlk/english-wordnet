simpleMeaning: A small striped squirrel of eastern America that lives partly on land, with pouches in
  its cheeks
scope: This is a small striped squirrel of eastern America with pouches in its cheeks; eastern chipmunk,
  ground squirrel and striped squirrel are other names for this sense, not the wider group of burrowing
  animals and not a tree squirrel.
examples:
- A hackee stuffed its cheek pouches with seeds.
- The hackee darted into the bushes with its pouches full.
