simpleMeaning: At the back it runs on belts that move round and round, and at the front it has round wheels
scope: Also called half-tracked, this tells of a vehicle with moving belts at the back and wheels at the
  front, not a vehicle with belts all round and not one with wheels all round.
examples:
- The army used half-track trucks to move men over rough ground.
- A half-track vehicle rolled slowly across the wet field.
