simpleMeaning: a strong flow of water on the surface that moves away from the shore
scope: This flow moves out, away from the shore; it is not the rough water made when two flows of water
  meet.
examples:
- A riptide pulled the swimmer away from the beach.
- The lifeguard warned us about a strong riptide near the rocks.
