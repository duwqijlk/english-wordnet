simpleMeaning: an act by a landlord that makes a tenant leave, such as by making the place unfit to live
  in, without force or a legal process
scope: Also called constructive eviction. This is a landlord making a tenant leave by making a place unfit
  to live in, not removal from land through a legal process.
examples:
- Her eviction came not from officers at the door but from months with no heat or water.
- The tenants said the broken roof and the lack of running water amounted to an eviction, even though
  no one had forced them out.
