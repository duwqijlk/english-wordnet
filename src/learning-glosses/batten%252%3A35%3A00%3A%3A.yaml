simpleMeaning: to hold something tightly in place with thin, flat strips of wood or metal
scope: To make something safe and tight with thin strips, not to add those strips to something, and not
  the soft material used as filling.
examples:
- Batten down the hatches before the storm reaches the ship.
- They battened the covers over the boxes to keep them safe in the wind.
