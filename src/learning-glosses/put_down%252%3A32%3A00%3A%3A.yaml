simpleMeaning: To get words or music into writing
scope: Also called get down, this is writing out words or music, not setting a thing on a surface and
  not speaking of someone with scorn.
examples:
- She put down the tune in her notebook before she forgot it.
- The composer put down every note of the new song in writing.
