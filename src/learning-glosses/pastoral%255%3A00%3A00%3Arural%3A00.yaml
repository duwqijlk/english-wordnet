simpleMeaning: describing country life as simple and perfect, in the simple way of the country
scope: Also called bucolic. This word describes country life or a country scene as simple and perfect;
  it is not a piece of music, not a written work, and not about a church leader.
examples:
- They lived a pastoral life in a small village, far from the city.
- The painting shows a calm pastoral scene with sheep and green hills.
