simpleMeaning: Petal edges cut into fine strips set apart the sweet-smelling violet blooms of this North
  American orchid, which grow in bunches.
scope: Also called purple-fringed orchid, it differs from the kind with larger, paler blooms.
examples:
- The purple-fringed orchis had bunches of sweet-smelling violet blooms.
- Sweet-smelling violet blooms grew in bunches on the purple-fringed orchis.
