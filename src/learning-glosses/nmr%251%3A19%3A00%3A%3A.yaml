simpleMeaning: The response of protons, tiny parts of atoms, to radiation in a magnetic field.
scope: This is the response of protons to radiation in a magnetic field, also called nuclear magnetic
  resonance and proton magnetic resonance; not other kinds of resonance and not the machines that use
  it.
examples:
- The chemist used NMR to look at the sample.
- NMR shows how protons answer to radiation in a magnetic field.
