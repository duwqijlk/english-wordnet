simpleMeaning: A Central American flower plant with blooms with long thin parts and big green bumps
scope: A Central American flower plant with blooms with long thin parts and big green bumps, not the South
  American kind with pale yellow to pale green blooms and not a flower plant with smooth petals.
examples:
- The spider orchid from Central America has blooms with long thin parts and green bumps.
- A spider orchid with green warts grows in the warm house.
