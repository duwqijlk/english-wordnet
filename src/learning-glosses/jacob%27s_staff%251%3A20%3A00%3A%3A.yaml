simpleMeaning: A desert shrub of the southwestern United States and Mexico, with thin bare thorny branches
  that grow leaves and bunches of red flowers after the rains.
scope: A desert shrub with red flowers, also called coachwhip, ocotillo, vine cactus, and Fouquieria splendens;
  not a true cactus and not a walking stick.
examples:
- Jacob's staff burst into red flower after the rain.
- A Jacob's staff stood bare and thorny by the trail.
