senseId: providential%5:00:00:fortunate:00
synsetId: 01052675-s
simpleMeaning: So lucky or so well timed that it seems sent by God.
scope: Also called miraculous, this is a thing so lucky or so well timed that it seems sent by God, not
  a thing that shows God's care for the world and not a thing that comes from that care.
examples:
- The rain was providential, saving the crops just in time.
- Her providential recovery surprised the doctors, coming as if sent by God.
