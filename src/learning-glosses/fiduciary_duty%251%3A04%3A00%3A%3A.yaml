simpleMeaning: a legal requirement that a person trusted to look after another person's interests act
  for that person's good
scope: A legal requirement on a person trusted to look after another person's interests; not a kind act
  and not a business deal.
examples:
- The trustee's fiduciary duty required him to act for the children.
- She took her fiduciary duty to her clients seriously.
