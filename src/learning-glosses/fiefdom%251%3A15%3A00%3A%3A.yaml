simpleMeaning: the land ruled by a lord in the old system in which land was held from a king or a higher
  lord in return for service
scope: This is the land ruled by one lord in the old system in which land was held from a king or a higher
  lord in return for service; it is not a whole country ruled by a king.
examples:
- The lord added two villages to his fiefdom.
- Her fiefdom lay along the river and included three farms.
