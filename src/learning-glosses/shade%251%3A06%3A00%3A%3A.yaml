simpleMeaning: a cover that keeps the sun's straight light off a person or thing
scope: A thing used as a cover against the sun, not the darkness itself and not a cover for a lamp.
examples:
- They used a large umbrella as a shade from the sun.
- She pulled the shade over the baby's seat to block the sun.
