simpleMeaning: A piece of writing or talk that joins one subject to the next one
scope: A piece that joins one subject to the next, not a change from one state to another, and not an
  event that brings about a big change.
examples:
- The transition between the two parts of the talk was smooth.
- She used a short transition to move from one topic to the next.
