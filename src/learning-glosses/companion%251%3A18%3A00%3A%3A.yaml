senseId: 'companion%1:18:00::'
synsetId: 09965384-n
simpleMeaning: a person who is a friend to someone and spends much time with them
scope: This names a friend who spends much time with a person; it is not the act of being with someone,
  and it is not a work partner you see only at work.
examples:
- She was my close companion on our long walks together.
- He and his companion ate lunch together every day.
