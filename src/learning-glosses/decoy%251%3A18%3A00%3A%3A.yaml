simpleMeaning: a person who tricks someone and leads them into danger, usually as part of a plan
scope: 'Also called steerer: a person who tricks someone into danger, not a thing used to draw animals
  into a trap and not the act of drawing someone in.'
examples:
- He acted as a decoy, leading the police officer into an empty street where the gang waited.
- The spy used a young decoy to lead the soldier away from his post and into danger.
