simpleMeaning: a person with an official job who stands at the entrance to a courtroom or to a room where
  laws are made
scope: This sense is also called usher. It is about a court or a room where laws are made, not the old
  church job with the same name.
examples:
- The doorkeeper stood at the entrance of the courtroom.
- The doorkeeper let the lawyers into the room where laws are made.
