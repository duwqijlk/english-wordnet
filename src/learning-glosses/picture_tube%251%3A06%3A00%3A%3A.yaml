simpleMeaning: Inside this part of a television set, a stream of tiny charged bits turns the signal it
  gets into an image on a glowing screen.
scope: Also called kinescope and television tube, this part of a television set is where a stream of tiny
  charged bits turns the signal into an image on a glowing screen.
examples:
- The picture tube in the television set stopped working.
- They took the picture tube out of the television set.
