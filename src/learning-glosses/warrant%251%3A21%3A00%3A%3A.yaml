simpleMeaning: a paper from a firm, usually with a loan paper or another share paper, that lets the holder
  buy a set amount of common shares at a set price
scope: A paper from a firm, usually with a loan paper or another share paper, that lets the holder buy
  a set amount of common shares at a set price, not a paper from a court and not formal approval.
examples:
- The firm sold warrants that let buyers take shares at a set price.
- He held warrants for a thousand common shares.
