simpleMeaning: a dreamed-of cure for every ill, once sought by alchemists, men who tried to turn base
  metals into gold
scope: A dreamed-of cure for everything, also called panacea, cure-all and nostrum; not a real medicine
  and not a charm.
examples:
- The alchemists sought a catholicon for every disease.
- No catholicon can cure all ills at once.
