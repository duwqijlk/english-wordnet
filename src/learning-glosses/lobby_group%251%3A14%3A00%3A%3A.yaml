simpleMeaning: A set of people with a shared interest who try to get lawmakers or officials to act in
  their favour, usually by talking to them again and again.
scope: This is a set of people with a shared interest who try to get lawmakers or officials to act in
  their favour; lobby, advocacy group, pressure group, special-interest group, special interest, special
  interest group and third house are other names for this sense, and it is not a political party.
examples:
- The lobby group met the minister to argue for lower taxes.
- A lobby group for farmers pushed the new law through parliament.
