simpleMeaning: To become covered all over, as if by a liquid, a colour, or a gleam of light.
scope: To become covered all over as if by a liquid, a colour or a gleam of light, not to pour something
  over a thing or spread a thing over something else.
examples:
- Her face suffused with a warm colour.
- The room suffused with soft light at dawn.
