simpleMeaning: A person who likes to mend machines and try things out with their parts, for the fun of
  it.
scope: Also called a tinker; someone who enjoys mending machines and trying things out, not an unskilled
  person who tries to fix things.
examples:
- The tinkerer spent the afternoon taking apart an old radio.
- As a tinkerer, he loved finding new uses for spare parts.
