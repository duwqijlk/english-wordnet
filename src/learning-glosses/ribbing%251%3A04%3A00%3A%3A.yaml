simpleMeaning: the act of bothering a person in fun or in a mean way, most of all by making fun of them,
  and keeping at it again and again
scope: 'Also called tease, teasing, and tantalization: making fun of a person again and again, not a single
  joke told once and then stopped.'
examples:
- His ribbing was gentle but persistent, and she laughed along.
- She did not mind the ribbing from her friends about her old car.
