simpleMeaning: to take electrons from a bit of matter so its positive charge goes up, or to raise the
  share of the electron-drawing part in a mix
scope: To change a mix or a bit of matter by shifting electrons, also called oxygenise; not to burn something
  and not to mix in oxygen gas.
examples:
- They oxygenize the solution to lift its charge to a higher level.
- In class we learned how to oxygenize an ion by stripping electrons from it.
