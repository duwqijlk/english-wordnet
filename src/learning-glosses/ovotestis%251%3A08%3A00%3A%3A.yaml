simpleMeaning: A sex organ of a creature with both male and female parts, holding both male and female
  tissue.
scope: A sex organ holding both male and female tissue; not a male-only organ and not a female-only organ.
examples:
- The snail's ovotestis makes both eggs and sperm.
- An ovotestis holds tissue of both sexes.
