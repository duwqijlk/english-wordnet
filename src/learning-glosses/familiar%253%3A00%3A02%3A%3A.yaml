simpleMeaning: So common in normal everyday life that nothing about it seems strange or unusual.
scope: Common and ordinary rather than strange or unusual, not the sense of being well known or easily
  recognized, and not a witch's helper or a high official's servant.
examples:
- She slipped back into the familiar routine of the office.
- 'It was a familiar scene: children playing in the street.'
