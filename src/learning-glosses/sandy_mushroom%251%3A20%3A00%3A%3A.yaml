simpleMeaning: Under cottonwood trees, above all in sand, big groups of a gilled fungus that people can
  eat push up out of the ground.
scope: Its name points to the sand under cottonwood trees where it most often fruits, in big groups rather
  than one by one.
examples:
- Under the cottonwood trees, sandy mushrooms fruit in big groups.
- The sandy mushroom is one of the gilled fungi people can eat.
