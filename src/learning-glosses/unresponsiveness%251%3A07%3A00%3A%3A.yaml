simpleMeaning: the quality of a person who does not react to people or things, slow to answer and slow
  to show feeling
scope: 'Also called deadness: a person who does not react to people or events, not a body that cannot
  feel touch and not a person who will not talk.'
examples:
- Her unresponsiveness after the accident worried her family, as she barely reacted to anything they said.
- The doctor noted his unresponsiveness when he did not answer questions or show any feeling.
