simpleMeaning: Paper leaves this machine with a full row of written marks on it with each pass, straight
  from a computer
scope: 'Another name for a line printer: a machine that puts a full row of marks from a computer onto
  paper, not a machine that prints one mark at a time and not a screen that shows words.'
examples:
- The line-at-a-time printer finished the whole report in minutes.
- Our office still uses a line-at-a-time printer for long lists.
