simpleMeaning: The act of changing a thing so it is held in higher honour and praise.
scope: Of an old hall or a figure in a story, changed so it is held in higher honour.
examples:
- The transfiguration of the old hall made it a place of great honour.
- Her transfiguration in the story turned her into a figure of glory.
