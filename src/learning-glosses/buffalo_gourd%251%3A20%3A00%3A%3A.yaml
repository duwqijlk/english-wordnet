simpleMeaning: Small hard green fruit with spots that cannot be eaten grow on this vine of dry parts of
  central and southwestern United States and Mexico, living for many years
scope: Also called calabazilla, prairie gourd, prairie gourd vine and wild pumpkin, this vine of dry parts
  of central and southwestern United States and Mexico bears small hard green fruit with spots that cannot
  be eaten.
examples:
- The buffalo gourd spread across the dry ground.
- Buffalo gourds bore small hard fruit that no one could eat.
