simpleMeaning: a flat stone used to make tools with a cutting edge, or knives, sharp
scope: This is the flat stone itself, used to make knives and cutting tools sharp; not the act of making
  them sharp and not a knife itself.
examples:
- He rubbed the knife on a whetstone until it was sharp.
- The farmer kept a whetstone by the barn for his tools.
