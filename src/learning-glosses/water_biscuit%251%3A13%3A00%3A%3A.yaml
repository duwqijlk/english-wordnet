simpleMeaning: a thin flat cracker made of flour mixed with liquid, usually baked without fat and often
  served with cheese
scope: A thin flour cracker, usually made with no fat and often eaten with cheese; not a sweet cake and
  not a soft bread roll.
examples:
- She spread cheese on a water biscuit.
- The water biscuit was thin and crisp beside the cheese.
