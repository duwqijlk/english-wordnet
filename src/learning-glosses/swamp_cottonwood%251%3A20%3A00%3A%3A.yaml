simpleMeaning: A North American poplar with big round leaves that have wavy edges, and brown bark and
  wood.
scope: A North American poplar with big round leaves that have wavy edges, and brown bark and wood; also
  called black cottonwood, downy poplar and swamp poplar; not a poplar with small narrow leaves and not
  a tree of dry land.
examples:
- A swamp cottonwood stood by the river with its big round leaves.
- Swamp cottonwoods grow in the wet lowlands.
