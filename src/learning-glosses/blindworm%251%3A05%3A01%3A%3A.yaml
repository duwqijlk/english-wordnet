simpleMeaning: Widely thought to be unable to see, this small European lizard digs underground without
  legs and has tiny eyes
scope: This small European lizard is also called slowworm, and it is widely thought to be unable to see,
  though it is a lizard and not the tropical wormlike amphibian of the same name.
examples:
- The blindworm has tiny eyes and digs underground.
- Many people think the blindworm cannot see, but it is a lizard with tiny eyes.
