simpleMeaning: People use this tool to turn Allen screws.
scope: 'Also called hex key, zeta key, zeta wrench, Allen key, Allen wrench, Inbus wrench, Unbrako key,
  and Unbrako wrench: a tool for turning Allen screws, not a key that opens a lock.'
examples:
- I lost the Inbus key for my bike, so I could not turn the Allen screws.
- He keeps an Inbus key in his toolbox for the Allen screws on the shelf.
