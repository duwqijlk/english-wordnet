simpleMeaning: In maths, a statement with an equals sign in which a fixed number is raised to a power
  that can change.
scope: In maths, a statement with an equals sign in which a fixed number is raised to a power that can
  change; not a statement where the unknown is the number being raised and not a sum worked out by adding.
examples:
- Solve the exponential equation for x.
- An exponential equation has the unknown in the power.
