simpleMeaning: a philosopher who holds that general things like numbers and goodness are real and exist
  whether or not anyone thinks of them
scope: A philosopher who holds that general things like numbers and goodness are real and exist whether
  or not anyone thinks of them; not a painter of plain life and not a plain practical person.
examples:
- As a realist, he argued that numbers exist whether or not we think of them.
- The realist in the debate said goodness is real, not just a word.
