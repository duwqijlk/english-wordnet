simpleMeaning: A neuron that carries signals out from the brain or the cord in the spine
scope: 'Efferent neuron, motoneuron and motor neuron are other names for this sense: a neuron that carries
  signals out from the brain or spine, not a neuron that carries signals in.'
examples:
- A motor nerve fiber carries signals from the brain to the muscles.
- Damage to a motor nerve fiber can weaken the arm.
