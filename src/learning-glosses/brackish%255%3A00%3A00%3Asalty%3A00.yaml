simpleMeaning: a little salty, especially when sea water mixes with fresh water
scope: 'Also called briny: a little salty, most often from sea water mixed with fresh water, not bad-tasting
  and unpleasant, and not fully salty like the sea.'
examples:
- The river water turned brackish near the sea.
- Fish in the brackish lagoon live in water that is a little salty.
