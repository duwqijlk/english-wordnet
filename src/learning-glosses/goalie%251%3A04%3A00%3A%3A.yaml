simpleMeaning: the job on an ice hockey, soccer, or lacrosse team of standing in front of the goal and
  trying to keep the other side from scoring
scope: The defensive job on a team, the place for the person who stands in front of the goal; not the
  person who fills it, and not the goal itself.
examples:
- She plays goalie for her school team.
- The goalie spot was still open at the start of the season.
