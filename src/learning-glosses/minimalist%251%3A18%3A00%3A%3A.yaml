simpleMeaning: a person who makes or supports art that uses only a few very simple parts and leaves out
  all extra detail
scope: This is a person linked to art that uses very few simple parts, not a person who wants only small
  changes in government or politics.
examples:
- As a minimalist, he painted with only black lines on white paper.
- The minimalist made a work of art from a single red square.
