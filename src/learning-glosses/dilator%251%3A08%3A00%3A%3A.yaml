simpleMeaning: a muscle or a nerve that makes a part of the body grow wider
scope: A muscle or nerve that makes a part of the body grow wider, and not a tool used in surgery to open
  a part of the body.
examples:
- The dilator in the eye lets more light in by widening the pupil.
- A dilator nerve helps the airway grow wider when we breathe hard.
