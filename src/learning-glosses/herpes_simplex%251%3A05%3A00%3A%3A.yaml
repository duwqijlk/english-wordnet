simpleMeaning: The skin and the nerves are the parts of the body that this virus works on
scope: 'Another name for herpes simplex virus: a virus that works on the skin and the nerves, not the
  virus that causes an illness of the private parts and not the virus that causes shingles.'
examples:
- The doctor said the herpes simplex had caused the sores on his lip.
- Herpes simplex left sores on her skin that took weeks to heal.
