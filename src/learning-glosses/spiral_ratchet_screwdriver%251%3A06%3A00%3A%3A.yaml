synsetId: 04287125-n
simpleMeaning: A screwdriver with a ratchet and a spiral handle, whose blade turns in only one direction
  when downward pressure is applied to the handle.
scope: Also called a ratchet screwdriver, it is a hand tool for driving a fastener by pressing down, not
  by twisting the grip.
examples:
- Press down on the spiral ratchet screwdriver and the tip spins round.
- The spiral ratchet screwdriver drove the screw in as the grip was pressed down.
