simpleMeaning: Not thought through and set out in good order in the mind, and not taken in and made part
  of what one knows.
scope: For facts or ideas gathered at random, never set out in good order.
examples:
- The facts were undigested, a mass gathered at random.
- His ideas stayed undigested, never set out in good order.
