senseId: 'great_burdock%1:20:00::'
synsetId: 11945318-n
simpleMeaning: A burdock with heart-shaped leaves, growing in open woodland, hedgerows and rough grassland
  from Europe (except the far north) to Asia Minor; occasionally grown for medicine and cooking.
scope: A burdock with heart-shaped leaves, not the smaller weedy burdocks; greater burdock is another
  name for it.
examples:
- Great burdock grows along the hedgerows on the edge of the village.
- Her grandmother made a medicinal tea from great burdock root.
