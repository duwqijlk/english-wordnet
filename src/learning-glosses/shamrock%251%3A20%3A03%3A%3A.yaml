scope: A Eurasian plant with heart-shaped, three-leafed leaves and white, purple-veined flowers; also
  called common wood sorrel or cuckoo bread; not a creeping European clover with white to pink flowers
  and bright green leaves, settled in the United States and widely grown for feed, nor a clover from Ireland
  with yellowish flowers, often held to be the true or first shamrock.
examples:
