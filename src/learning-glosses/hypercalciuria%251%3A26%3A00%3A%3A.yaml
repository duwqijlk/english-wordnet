simpleMeaning: Bone breaks down too fast when the glands that set calcium levels work too hard or bones
  grow thin and weak, leaving too much calcium in the urine, usually.
scope: It names the state where too much calcium shows up in the urine, also called hypercalcinuria.
examples:
- Hypercalciuria was found in his urine test.
- Her hypercalciuria came from bone breaking down too fast.
