simpleMeaning: done in a smooth way, with no awkward moves, and done exactly right with skill
scope: Also called clean. This is about doing something smoothly and exactly, not about looking good on
  the surface while lacking depth.
examples:
- The boxer landed a neat punch on his opponent's cheek.
- She made a neat throw that went straight to her teammate.
