scope: The return, as an unborn creature grows, of traits that showed in the long history of its kind;
  not new traits and not a rebirth of the creature itself.
examples:
- Palingenesis shows old traits coming back in the embryo.
- The textbook gave palingenesis as an example of history repeating in growth.
