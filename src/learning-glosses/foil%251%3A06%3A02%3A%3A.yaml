simpleMeaning: A picture on clear film, made from a photograph that shows things as they are or from a
  drawing, shown by shining light through it
scope: A picture on clear film shown by a projector, not a fencing sword, not a water device, and not
  a person who sets off another's good points.
examples:
- The teacher showed the class a foil on the projector.
- She held up a foil with the diagram on it.
