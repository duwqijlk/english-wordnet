simpleMeaning: In biology, contents released by an organ or tissue splitting open — a ripe fruit or other
  body shedding seeds or spores, or a surgical wound bursting apart.
scope: The general breaking-open process of an organ or tissue, whether a ripe fruit, a spore case or
  a closed surgical wound; not a cut made on purpose and not slow decay.
examples:
- The pod's dehiscence scattered seeds across the soil.
- Dehiscence of the wound followed the operation, and the surgeon had to close it again.
