simpleMeaning: a spiny shrub of the Caspian salt plains and Siberia, with soft silvery young leaves and
  mildly fragrant pink-purple flowers
scope: This is the spiny Caspian shrub with silvery young foliage, not the saltbush or saltcedar shrubs
  of similar dry plains.
examples:
- The salt tree has spiny branches and silvery young leaves.
- The salt tree's pink-purple blooms are mildly fragrant.
