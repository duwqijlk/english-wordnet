simpleMeaning: used of a defeat that no one thought would happen, for a team that most people thought
  would win
scope: Used of a surprising sports result where the team thought likely to win loses, not feeling ill
  in the body and not feeling worried.
examples:
- It was an upset win for the small team over the champions.
- The upset defeat of the top team shocked the fans.
