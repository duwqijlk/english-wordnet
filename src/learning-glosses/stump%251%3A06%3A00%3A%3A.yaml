simpleMeaning: In cricket, one of three wooden posts standing straight up that together form the wicket,
  the target in the game
scope: In cricket, this is one of the three wooden posts, not the act of taking tree stumps out of the
  ground.
examples:
- The ball hit the middle stump and the player was out.
- He guarded his stumps through the last part of the game.
