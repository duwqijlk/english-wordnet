simpleMeaning: In canon law, a bar that makes a marriage not count, such as already being married to someone
  else
scope: In canon law, a bar that makes a marriage not count, not a bar that merely makes a wedding against
  the rules and not a reason to end a good marriage.
examples:
- A prior marriage was a diriment impediment to their wedding.
- The priest found a diriment impediment that made the marriage not count.
