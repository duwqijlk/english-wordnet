simpleMeaning: In its salt form, this stuff takes away feeling in one small part of the body, or in the
  lower half of it
scope: Also called piperocaine hydrochloride, this stuff takes away feeling in one small part of the body
  or in the lower half, not a drug that puts the whole body to sleep and not a painkiller swallowed as
  a pill.
examples:
- Piperocaine took away feeling in one small part of her arm.
- After piperocaine, he felt nothing in the lower half of his body.
