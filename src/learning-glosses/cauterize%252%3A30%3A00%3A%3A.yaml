simpleMeaning: to burn or freeze tissue (the skin and flesh of the body) with a hot iron, electric current,
  or a chemical that burns
scope: 'Also called burn and cauterise: treating body tissue with heat, cold, or a chemical, not making
  a person''s feelings dull and hard.'
examples:
- The surgeon cauterized the wart with a hot iron.
- They cauterized the tissue with an electric current.
