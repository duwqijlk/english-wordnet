senseId: 'thus%4:02:00::'
synsetId: 00043413-r
simpleMeaning: Used to introduce a result that follows from what was just said.
scope: This is not the noun for the tree resin; it is the linking adverb placed before a conclusion.
examples:
- The form was never signed, and thus the request was refused.
- Prices rose sharply; thus many families had to cut back.
