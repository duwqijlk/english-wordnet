simpleMeaning: a book or other work printed again just as it was, with no changes, and put on sale again
scope: 'Also called reissue and reprinting: a whole book or other work printed again with no changes,
  not one piece of writing printed on its own.'
examples:
- The shop sells a reprint of the old novel, with the same cover and pages.
- She bought a cheap reprint of the famous book.
