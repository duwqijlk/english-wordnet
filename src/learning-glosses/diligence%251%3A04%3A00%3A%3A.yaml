simpleMeaning: careful, steady hard work put into a job or task
scope: This is the careful hard work put into something, not the lasting will to keep doing a task without
  giving up.
examples:
- She finished the report through diligence, checking every number twice as she worked.
- His diligence in the garden meant every row was dug and planted with care.
