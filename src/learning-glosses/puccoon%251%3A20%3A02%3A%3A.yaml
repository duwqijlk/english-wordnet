simpleMeaning: A plant that lives for many years in eastern North America, with hairy leaves that give
  a red or yellow dye.
scope: A long-lived plant of eastern North America with hairy leaves, not a tree and not a plant grown
  for food.
examples:
- The puccoon grows wild in the woods of eastern North America.
- People once used puccoon leaves to make red and yellow dye.
