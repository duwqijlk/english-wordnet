simpleMeaning: All the law courts that give justice and form the judging arm of the state.
scope: All the law courts that give justice and form the judging arm of the state; judiciary, judicature
  and judicial system are other names for it, not the law-making arm and not the arm that carries laws
  out.
examples:
- The judicatory handed down its ruling on the case.
- Reform of the judicatory took many years.
