simpleMeaning: of or about the liquid that alchemists thought could dissolve anything
scope: Of or about the liquid alchemists thought could dissolve anything, not about any real liquid and
  not about alchemy in general.
examples:
- The old book spoke of an alkahestic power that could melt any metal.
- He claimed the alkahestic liquid would dissolve gold.
