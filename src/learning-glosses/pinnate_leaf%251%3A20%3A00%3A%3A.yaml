senseId: 'pinnate_leaf%1:20:00::'
synsetId: 13178035-n
simpleMeaning: A part of a plant that looks like a feather, with little parts set on each side of one
  middle stem.
scope: This is a part of a plant that looks like a feather, with little parts on each side of one middle
  stem; not a plain part with no side parts, and not a feather of a bird.
examples:
- The pinnate leaf looked like a small feather.
- The pinnate leaf has little parts on each side of a middle stem.
