simpleMeaning: The young look much like the grown insect they will become, and no still stage comes between
  the two.
scope: Another name for heterometabolic, it marks young insects that look like the grown ones and grow
  up with no resting stage.
examples:
- The heterometabolous young looked much like the adult.
- Heterometabolous insects change shape slowly, with no pupal stage.
