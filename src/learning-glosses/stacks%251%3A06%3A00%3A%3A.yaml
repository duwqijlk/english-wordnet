simpleMeaning: the part of a library where rows of shelves hold most of its books
scope: The part of a library where rows of shelves hold most of its books, not a single shelf and not
  a pile of books on a desk.
examples:
- He spent the afternoon in the stacks, looking for an old book.
- Most of the library's books are kept in the stacks.
