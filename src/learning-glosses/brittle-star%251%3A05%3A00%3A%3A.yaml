simpleMeaning: a sea animal like a flat five-armed sea creature, with thin whip-like arms that break easily
  and spread out from a small round middle
scope: This is a sea animal like a starfish, with thin whip-like arms that break easily and spread from
  a small round middle; brittle star and serpent star are other names for it, not a true starfish and
  not a sea urchin.
examples:
- The brittle-star curled its thin arms around the rock.
- A brittle-star moved slowly across the sand.
