simpleMeaning: a small bushy tree of Madagascar, grown in warm lands as a hedge and for its deep red sour
  fruits like small plums
scope: Also called batoko palm, governor's plum, and governor plum; a small tree of Madagascar, not a
  plum tree and not a tall forest tree.
examples:
- Ramontchi fruits hang red and sour on the hedge.
- They plant ramontchi round the garden in the tropics.
