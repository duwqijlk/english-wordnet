simpleMeaning: 'These loose clothes, usually in the plural, are what you wear at night to sleep or rest:
  a top shaped like a jacket, worn with trousers.'
scope: These are loose nightclothes with a jacket top and trousers, usually in the plural; pajama, pyjama
  and jammies are other names for them.
examples:
- She put on her pj's before bed.
- His pj's have a jacket top and loose trousers.
