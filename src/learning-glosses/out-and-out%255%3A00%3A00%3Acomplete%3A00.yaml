simpleMeaning: In everyday talk the word can just add force, and the thing it marks is full and whole,
  with no limits and no added conditions
scope: A word that means full and whole, with no limits, also called absolute, rank, sheer and downright;
  not a word that means only in part and not a word that softens what it marks.
examples:
- It was an out-and-out lie.
- The plan was an out-and-out success.
