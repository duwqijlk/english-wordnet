simpleMeaning: In psychiatry, a process outside a person's awareness that tries to make the worry from
  natural urges less
scope: 'Also called defense: in psychiatry, an unseen process that lessens worry from natural urges, not
  a defendant''s plea in court and not the defending side in a trial.'
examples:
- His defence kept the painful thought out of his mind.
- In psychiatry, a defence can hide a wish a person cannot face.
