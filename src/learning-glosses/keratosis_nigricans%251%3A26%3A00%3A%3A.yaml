simpleMeaning: A skin disease with dark wartlike patches in the folds of the body, which can be harmless
  or dangerous.
scope: This is a skin disease with dark wartlike patches in the folds of the body, which can be harmless
  or dangerous; acanthosis nigricans is another name for it, not the rare condition passed down in families
  that causes dark crusted patches.
examples:
- Keratosis nigricans causes dark wartlike patches in the folds of the body.
- Her keratosis nigricans was harmless, but the doctor still checked it.
