simpleMeaning: The quality of being worthy of something good, such as help when it is needed
scope: This is the quality of being worthy of something good; merit and meritoriousness are other names
  for it, not the good thing itself and not a person's luck.
examples:
- The committee weighed the deservingness of each family.
- Her deservingness of the award was clear to all.
