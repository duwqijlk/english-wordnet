simpleMeaning: The word sung for the seventh note of a scale, the note just below the home note, in the
  do-re-mi way of naming notes
scope: A sung word for a note, also called te and si; not do and not sol.
examples:
- Sing do, re, mi, fa, sol, la, ti.
- We sing ti for the seventh note in the scale.
