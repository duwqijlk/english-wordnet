simpleMeaning: A chain of carbon atoms with many double links, the first double link three atoms from
  the start of the chain, forms this fat-like substance.
scope: It is also called omega-3, a fat-like substance whose chain of carbon atoms has many double links.
examples:
- Omega-3 fatty acid differs from omega-6 fatty acid in where its first double link sits.
- In omega-3 fatty acid, the first double link sits three atoms from the start of the chain.
