simpleMeaning: A tool or a small copy that shows suns and the worlds that move round them.
scope: A tool or a small copy that shows suns and the worlds that move round them, not the tool that throws
  pictures of the stars onto a dome, and not the building that holds such a tool.
examples:
- The planetarium in the classroom showed the planets in order.
- He built a planetarium with balls on wires.
