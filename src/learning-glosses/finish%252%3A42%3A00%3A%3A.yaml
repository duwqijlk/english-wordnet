simpleMeaning: to reach its end, whether in time, in space, or in amount, either in a literal way or in
  a figurative one.
scope: This is not the act of completing a task, and it is not the look of a surface; it describes something
  coming to its end.
examples:
- The road finishes at the edge of the forest.
- The meeting finished at noon.
