simpleMeaning: the state of being seen and given credit for who you are or what you have done
scope: 'Also called recognition: the state of being seen and given credit for who you are or what you
  have done, not a short note naming a source and not a statement that says you accept something.'
examples:
- The partners were delighted with the acknowledgment of their work.
- She got little acknowledgment for years of quiet work.
