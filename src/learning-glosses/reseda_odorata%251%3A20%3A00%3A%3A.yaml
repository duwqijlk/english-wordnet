simpleMeaning: A woody Mediterranean plant that lives one year, widely grown for its dense spike-like
  tip clusters of greenish or yellowish white flowers with an intense spicy scent.
scope: Also called mignonette and sweet reseda; a woody Mediterranean plant grown for its spicy-scented
  flowers, not a rose and not a herb for cooking.
examples:
- Reseda odorata fills the garden with a spicy scent in summer.
- They grow Reseda odorata for its dense clusters of pale flowers.
