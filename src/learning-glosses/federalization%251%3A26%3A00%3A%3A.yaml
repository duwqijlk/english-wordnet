simpleMeaning: the state of a thing being under the rule of the government of the whole country
scope: The state of a thing being under the rule of the government of the whole country; federalisation
  is another name for this sense; not the act of putting it under such rule, and not rule by a local government.
examples:
- The federalization of postal service changed who ran the mail.
- After federalization, the railways answered to the central government.
