simpleMeaning: A bush that loses its leaves in winter, grown widely for its white, pink or red flowers.
scope: A bush grown for its white, pink or red flowers; not a tree and not a plant grown for fruit.
examples:
- The weigela in our garden has pink flowers in spring.
- She planted a weigela beside the fence for its red flowers.
