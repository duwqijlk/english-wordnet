simpleMeaning: to swallow a drink in a hurry, because you want it all now, or to swallow it all in one
  go
scope: 'Also called gulp and swig: to drink fast, or all in one go. It is not to eat, and not to drink
  slowly in small sips.'
examples:
- The thirsty men quaffed their beer in one go.
- She quaffed a full glass of water after the race.
