simpleMeaning: to fall and be unable to go on because of great tiredness, illness, or a sudden attack
scope: 'Also called collapse: to fall and be unable to go on from great tiredness, illness, or a sudden
  attack, not to take a thing apart and not to study a thing in parts.'
examples:
- She broke down after days without sleep.
- He broke down with a sudden fever.
