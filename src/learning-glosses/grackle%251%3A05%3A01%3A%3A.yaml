simpleMeaning: A long-tailed blackbird of America, its black feathers shining with changing colours in
  the light.
scope: Also called a crow blackbird, a long-tailed blackbird of America with black feathers that shine
  with changing colours; not the glossy black starling of Asia often taught to copy speech.
examples:
- The grackle perched on the fence, its black feathers shining.
- Grackles flocked round the feeder in the yard.
