simpleMeaning: Sheets joined in a fold so a number machine can print on them without stopping
scope: Sheets joined in a fold so a number machine can print on them without stopping; not loose sheets
  and not paper for writing by hand.
examples:
- The printer feeds on computer paper without stopping.
- The computer paper came out of the printer in one long folded strip.
