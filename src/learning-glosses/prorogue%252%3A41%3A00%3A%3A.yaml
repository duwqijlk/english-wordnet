simpleMeaning: To stop a meeting of the group that makes laws for a time, by the king's or queen's special
  power, without ending the group itself
scope: To stop a law-making group from meeting for a time by the king's or queen's special power; not
  to end the group, and not to break up a meeting for good.
examples:
- The queen decided to prorogue Parliament until the autumn.
- He asked the king to prorogue the assembly rather than dissolve it.
