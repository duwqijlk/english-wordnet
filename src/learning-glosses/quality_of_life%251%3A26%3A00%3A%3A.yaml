simpleMeaning: how happy or unhappy you are with the art, learning, and ideas around you in the place
  where you stay, not with how much money or comfort you have
scope: How pleased you are with the art and ideas around you, not how rich or comfortable you are and
  not your health.
examples:
- The new art museum is expected to improve the quality of life.
- She said her quality of life rose when the town opened a library and a concert hall.
