synsetId: 06827513-n
simpleMeaning: Each sign that joins numbers comes after the numbers it joins, in a way of writing sums
  with no round brackets.
scope: Also called suffix notation, this way of writing sums puts the joining sign after the numbers,
  not before them.
examples:
- In postfix notation, the plus sign comes after the two numbers.
- They wrote the sum in postfix notation, with the sign at the end.
