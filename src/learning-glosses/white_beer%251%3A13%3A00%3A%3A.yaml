simpleMeaning: A general name for drinks made from wheat by top brewing, most often very pale, cloudy
  and full of bubbles.
scope: A general name for pale, cloudy drinks made from wheat; wheat beer is another name for this sense,
  not a dark stout and not a clear lager.
examples:
- White beer is pale and cloudy, full of bubbles.
- He ordered a white beer made from wheat to go with his lunch.
