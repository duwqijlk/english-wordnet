simpleMeaning: A rod that joins the part that moves up and down inside an engine to the rod that drives
  the engine's turning shaft.
scope: A rod that joins the moving part inside an engine to the rod that drives the engine's turning shaft,
  not a pin that holds a door hinge and not a bolt that holds two plates.
examples:
- The mechanic fitted a new gudgeon pin in the engine.
- A worn gudgeon pin made the engine rattle.
