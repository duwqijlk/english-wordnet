scope: A salt-like thing made from two parts, CaH2, used to take oxygen away from other stuff and to give
  off hydrogen, also called hydrolith, and not table salt or a gas on its own.
examples:
- Calcium hydride gives off hydrogen in the lab.
- The lab stored calcium hydride in sealed cans.
