simpleMeaning: A small plant of the western United States, in the Rocky Mountains, with blue flowers that
  have fringed edges, found above all near hot springs in Yellowstone National Park.
scope: Also called Gentianopsis thermalis; a small blue-flowered plant of the Rocky Mountains in the west
  of the United States, found above all near hot springs in Yellowstone National Park.
examples:
- Gentiana thermalis grows near the hot springs in Yellowstone National Park.
- We found Gentiana thermalis with blue fringed flowers in the Rocky Mountains.
