senseId: 'vat_dye%1:27:00::'
synsetId: 15026454-n
simpleMeaning: A dye that will not dissolve in water; it is reduced to a soluble alkaline form, applied,
  then oxidized back to an insoluble dye in the cloth; used on cotton.
scope: This is the textile dye reduced to a soluble alkaline form for application and fixed by oxidation
  in the cloth; vat color is another name for the same thing. It is not a direct dye, which needs no such
  chemical change. The term belongs to dyeing and textile work.
examples:
- Indigo is a vat dye, which is why denim fades the way it does.
- The factory switched from reactive dyes to a vat dye for its cotton shirts.
