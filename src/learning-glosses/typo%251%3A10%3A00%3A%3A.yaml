simpleMeaning: a mistake in something printed, caused by a machine failing in some way
scope: 'Also called literal, and another name for it is misprint: a mistake in printed words caused by
  a machine, not a mistake in meaning.'
examples:
- One typo in the newspaper came from a part that failed in the printing machine.
- The typo on page three was caused by a mechanical failure.
