simpleMeaning: a drink with alcohol, made by mixing rum with juice from a lime or a lemon
scope: This is the rum drink mixed with lime or lemon juice itself, not plain rum on its own and not a
  mixed drink made with another kind of alcohol.
examples:
- He ordered a cold daiquiri with fresh lime juice.
- She learned to make a daiquiri with rum and lemon juice.
