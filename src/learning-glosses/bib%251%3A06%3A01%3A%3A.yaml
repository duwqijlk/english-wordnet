simpleMeaning: the top part of an apron, which covers the chest
scope: This is the top part of an apron that covers the chest, not the small cloth tied under a child's
  chin at meals.
examples:
- Her apron had a wide bib that kept her shirt clean.
- The cook's bib was covered with flour.
