simpleMeaning: A large round-topped deciduous tree with spreading branches, narrow curved leaves with
  deep wavy lobes, and wood like northern red oak; from New Jersey to Illinois and southward.
scope: A large deciduous oak, also called southern red oak, swamp red oak, and turkey oak; not the northern
  red oak and not other oaks of the same woods.
examples:
- Quercus falcata shades the yard with its wide branches.
- The wood of Quercus falcata is much like northern red oak.
