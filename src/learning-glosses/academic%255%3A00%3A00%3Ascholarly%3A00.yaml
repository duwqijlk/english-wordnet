simpleMeaning: Focused on learning in a narrow way, or showing learning, especially its small, unimportant
  parts
scope: This sense is about a narrow focus on learning, especially its small parts; it is not about an
  idea that stays only in thought, and not just about schools or universities.
examples:
- His academic interest in tiny spelling differences bored everyone at dinner.
- She gave an academic show of learning, naming every minor rule but missing the main point.
