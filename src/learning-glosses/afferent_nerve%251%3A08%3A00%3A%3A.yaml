simpleMeaning: a cord that carries signals from the sense organs in toward the brain and spine
scope: A nerve that carries signals from the sense organs in toward the brain and spine; afferent is another
  name for this sense, not a cord that carries orders out to the body.
examples:
- The afferent nerve carried the touch signal to her brain.
- Damage to an afferent nerve can block feeling from the skin.
