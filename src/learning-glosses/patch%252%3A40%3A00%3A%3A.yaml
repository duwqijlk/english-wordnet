simpleMeaning: to put a piece or pieces on a thing to cover part of it; also used for things that only
  look as if they have pieces on them
scope: Covering parts of a thing with pieces of something else, not fixing a torn hole with one piece
  of cloth and not the piece of cloth itself.
examples:
- The field was patched with snow after the storm.
- The hills were patched with small farms and woods.
