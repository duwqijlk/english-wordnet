simpleMeaning: A warning of danger that sounds or shows by itself, most often as a sound.
scope: Also called an alarm or an alert; a warning of danger that goes off by itself, usually as a sound.
examples:
- The alarum woke the house at first light.
- At the alarum, the guards ran to the gate.
