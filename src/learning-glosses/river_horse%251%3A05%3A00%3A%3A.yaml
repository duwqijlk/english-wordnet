simpleMeaning: a huge thick-skinned animal that eats plants and lives in or near the waters of hot Africa
scope: A huge thick-skinned plant-eating animal of African waters; hippo and hippopotamus are other names
  for it, not a horse and not a meat-eating water animal.
examples:
- A river horse wallowed in the muddy water.
- River horses spend much of the day in the water.
