simpleMeaning: a funny, clever person who makes jokes that make people laugh
scope: Also called a card, and another name for this sense is a wag; it is the funny person, not the joke
  or clever words that make people laugh.
examples:
- He is the family wit, always ready with a funny line.
- As a wit, she kept the whole table laughing with her jokes.
