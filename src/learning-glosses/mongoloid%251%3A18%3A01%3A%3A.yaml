senseId: 'mongoloid%1:18:01::'
synsetId: 10348407-n
simpleMeaning: A person counted as a member of one of the old broad groups into which people were once
  divided.
scope: A person in one of the old groupings of humankind; not the adjective sense about such a grouping,
  and not a person from Mongolia.
examples:
- The old books classed him as a Mongoloid.
- The old book described her as a Mongoloid.
