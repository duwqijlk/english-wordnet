senseId: 'cross%1:05:00::'
synsetId: 01329963-n
simpleMeaning: in genetics, a living thing produced from parents or breeding stock that are not genetically
  alike, especially one bred from different varieties, breeds or species of plant or animal.
scope: This is the hybrid living thing itself, not the act of mixing species or varieties to produce hybrids,
  not a wooden structure with an upright post and a crosspiece, not a line marking where two lines meet,
  not a burden or trial that causes great suffering, not a crosswise direction, not an annoyed mood, and
  not a verb meaning to travel across, meet, thwart, fold, span, mark a line, or breed.
examples:
- A mule is a cross between a horse and a donkey.
- This apple variety is a cross between two older kinds bred for hardiness.
