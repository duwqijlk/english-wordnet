simpleMeaning: A perennial plant of Europe and America with intensely bitter three-part leaves and clusters
  of white or purplish flowers; it often roots at the water's edge and spreads over water.
scope: 'Another name for bogbean and buckbean: a water-side plant with three-part leaves, not a clover.'
examples:
- Bog myrtle roots at the water's edge and spreads across the water's surface.
- The leaves of bog myrtle are intensely bitter.
