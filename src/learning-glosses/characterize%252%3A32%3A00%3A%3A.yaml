simpleMeaning: to describe or show the special qualities and ways of a person or thing
scope: This verb, also called qualify and characterise, means to describe the special qualities of a person
  or thing; it does not mean to be a typical quality of something.
examples:
- You can characterize his behavior as selfish.
- This poem can be characterized as a sad song for a dead lover.
