simpleMeaning: having a skill or ability that comes from qualities passed down from parents rather than
  from training
scope: This is about inborn ability in a person, not about raw goods that are unprocessed and not about
  actions done from instinct.
examples:
- She is a natural linguist who picks up new languages in months.
- He has a natural gift for spotting a false note in an argument.
