simpleMeaning: Only its white gills set it apart from the edible Agaricus, though this very poisonous,
  often white fungus grows on a clear foot like a small bowl.
scope: This fungus is also called death angel, death cap, and destroying angel, and it is not the safe
  Agaricus it looks like.
examples:
- The death cup is a very poisonous white fungus.
- A death cup can be told from the edible Agaricus only by its white gills.
