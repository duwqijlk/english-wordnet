simpleMeaning: The person who has charge of a paper or book and has the last say on the words of a text,
  above all for a paper or a journal.
scope: 'Also called editor: the person who has charge of what a paper or book puts out, not a writer and
  not a proofreader.'
examples:
- The editor in chief approved the front page.
- She became editor in chief of the magazine.
