simpleMeaning: Shots sent to stop or wreck guns that shoot at a target they cannot see
scope: This is shots sent to stop or wreck guns that shoot at a target they cannot see; not shots fired
  back at guns that can be seen, and not shots that give cover to moving troops.
examples:
- The counterbattery fire silenced the enemy guns on the hill.
- Our counterbattery fire began as soon as their shells landed.
