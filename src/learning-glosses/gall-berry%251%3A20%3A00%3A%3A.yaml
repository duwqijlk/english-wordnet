simpleMeaning: A green tree-like plant from east North America that keeps its leaves all year, with long
  firm leaves and small black fruit
scope: This is a green plant from east North America that keeps its leaves all year, with long firm leaves
  and small black fruit; evergreen winterberry, gallberry and inkberry are other names for this sense,
  not a plant that loses its leaves and not a red-fruited bush.
examples:
- The gall-berry keeps its leaves all year.
- Small black fruit grows on the gall-berry in the woods.
