simpleMeaning: 'A chemistry check that shows carbohydrates, such as sugars and starches, in a liquid:
  if they are there, a violet ring forms when alpha-naphthol reacts with sulfuric acid.'
scope: This is a chemistry check, not a drug test or a medical test; also called alpha-naphthol test,
  Molisch reaction and Molisch test.
examples:
- Molisch's test shows sugars in the liquid.
- A violet ring in Molisch's test means sugars are there.
