simpleMeaning: A closed-off part of the belly space that lies behind the stomach
scope: Bursa omentalis and omental bursa are other names for this closed-off part of the belly space behind
  the stomach, not the larger main belly space.
examples:
- The lesser peritoneal cavity lies behind the stomach.
- Fluid can collect in the lesser peritoneal cavity after surgery.
