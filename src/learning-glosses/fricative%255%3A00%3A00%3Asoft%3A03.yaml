senseId: fricative%5:00:00:soft:03
synsetId: 01160686-s
simpleMeaning: As with f, s, z, or th in both thin and then, this word is of speech sounds made by forcing
  air through a narrow gap.
scope: Also called strident, sibilant, continuant and spirant, this word marks a kind of speech sound,
  not the noun that names such a sound.
examples:
- The fricative sound at the start of thin is made by forcing air through a narrow gap.
- The fricative z is made with air forced through a narrow gap.
