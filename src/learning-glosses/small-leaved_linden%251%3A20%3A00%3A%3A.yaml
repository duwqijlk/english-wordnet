simpleMeaning: a big tree from Europe that spreads out wide, with tiny dark green growth on its branches,
  often planted because it looks good
scope: A big wide-spreading European tree with tiny dark green growth on its branches, also called small-leaved
  lime; not a citrus tree, and not a tree with big leaves.
examples:
- A small-leaved linden shaded the front yard.
- The small-leaved linden was planted for its good looks.
