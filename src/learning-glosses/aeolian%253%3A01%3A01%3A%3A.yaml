simpleMeaning: Said of Aeolis, a land of the old Greek world, or of the old Greek people who lived there
scope: Said of Aeolis or its old Greek people, not the people themselves, not the old Greek group of Boeotia
  and Thessaly, and not the things of Aeolus, the god of the winds.
examples:
- The Aeolian coast was home to many old Greek towns.
- Aeolian art shows the style of that old Greek land.
