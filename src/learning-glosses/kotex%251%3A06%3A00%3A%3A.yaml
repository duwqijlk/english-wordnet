simpleMeaning: A throwaway pad worn to soak up the blood of a woman's monthly period.
scope: A throwaway pad that soaks up monthly blood, also called sanitary napkin and sanitary towel; its
  near kin are other products worn for the same use, such as tampons.
examples:
- She bought a box of Kotex pads.
- A Kotex pad soaks up menstrual flow.
