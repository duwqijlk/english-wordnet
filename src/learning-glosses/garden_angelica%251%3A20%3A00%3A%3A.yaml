simpleMeaning: Its stems are coated in sugar and eaten, and its roots are used as medicine, on this herb
  grown by people that lives two years.
scope: Also called archangel, this herb is grown for its stems, eaten candied, and for its roots, used
  as medicine.
examples:
- She candied the garden angelica stems and ate them.
- Garden angelica roots were used as medicine.
