simpleMeaning: a sweet-smelling liquid put on a man's face once he has cut off his beard
scope: Also called after-shave lotion, this is a sweet-smelling liquid put on a man's face once he has
  cut off his beard, not shaving cream used while he cuts it and not a face cream for softening skin.
examples:
- He splashed on some after-shave when he had finished cutting off his beard.
- The after-shave left his face smelling sweet and cool.
