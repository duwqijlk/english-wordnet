simpleMeaning: The hollow organ of muscle in a woman's lower belly where a baby grows before birth
scope: The organ where a baby grows before birth, not the belly itself and not the birth canal.
examples:
- The baby grew in her womb for nine months.
- Doctors checked the womb for signs of trouble.
