simpleMeaning: to lift a thing away from where it sits, with a cup-shaped tool, or as if with one
scope: To lift a thing with a cup-shaped tool; also called scoop and scoop up; not to hollow a thing out,
  and not to pick a thing up with the hands.
examples:
- She scooped the sugar out of the container.
- He scooped out the rice from the pot and put it on his plate.
