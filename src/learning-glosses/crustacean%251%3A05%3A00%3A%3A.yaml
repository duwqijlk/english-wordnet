simpleMeaning: any animal with jointed legs that lives mainly in water, usually has a body made of parts
  and a hard outer covering of chitin (a tough natural material)
scope: This is the animal itself, like a crab or a shrimp, not the word used to say that something belongs
  to that group of animals.
examples:
- A crab is a crustacean that lives in the sea.
- Shrimp and lobsters are crustaceans.
