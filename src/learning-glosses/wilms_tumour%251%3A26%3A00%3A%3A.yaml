simpleMeaning: A cancerous growth in the kidney of a young child, marked by high blood pressure, blood
  in the urine and a lump that can be felt.
scope: 'Also called adenomyosarcoma, embryoma of the kidney, nephroblastoma and Wilms'' tumor: a kidney
  growth of young children, known by high blood pressure, blood in the urine and a lump that can be felt.'
examples:
- Wilms tumour was found in the child's kidney.
- The child with Wilms tumour had high blood pressure and blood in the urine.
