senseId: 'extension%1:04:02::'
synsetId: 00368594-n
simpleMeaning: The act of making a thing cover a wider range and reach more people who need it
scope: Making a thing reach more people and cover a wider range, not a new part added to a building, not
  extra time agreed for a payment, and not a belief spreading into new places.
examples:
- The extension of the meal plan to all pupils in need began this term.
- They asked for an extension of the health programme to the villages nearby.
