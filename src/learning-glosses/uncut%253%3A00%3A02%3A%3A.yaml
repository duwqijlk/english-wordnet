simpleMeaning: of pages in a book, still joined to the page next to them at the outer edge
scope: This is about pages in a book that are still joined at the outer edge, not about a thing that has
  not been shaped by cutting and not about grass that has not been cut down.
examples:
- The old book's pages were still uncut, so he could not open some of them.
- She found a copy with uncut pages and cut the edges apart with care.
