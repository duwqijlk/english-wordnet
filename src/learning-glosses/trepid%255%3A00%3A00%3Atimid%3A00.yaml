simpleMeaning: Shy by birth, or showing shyness.
scope: This sense is also called fearful and timorous, for being shy by birth, or showing shyness, where
  fearful is shy and easily afraid by nature, or showing that you are shy and easily afraid.
examples:
- He was trepid, shy by birth.
- She was trepid, showing shyness.
