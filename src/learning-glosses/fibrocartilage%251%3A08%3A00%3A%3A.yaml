simpleMeaning: Thin threads, like those in the plain stuff that holds parts of the body together, make
  up most of this tough, bendy body stuff.
scope: This names the tough, bendy body stuff made mostly of thin threads like those in the plain stuff
  that holds parts of the body together.
examples:
- Fibrocartilage cushions the joint between the bones.
- Fibrocartilage holds the bones together at the joint.
