simpleMeaning: a haircut where the sides of the head are shaved and only a band of hair stays down the
  middle of the top of the head
scope: This is a haircut with shaved sides and a band of hair in the middle. It is not the name of a Native
  American people or their language.
examples:
- He cut his hair into a mohawk, shaving both sides short.
- She wore a bright pink mohawk down the middle of her head.
