simpleMeaning: A mix of wet plant-fibre pulp that can be shaped while wet and painted once it dries.
scope: A mouldable stuff, also called papier-mache; not clay and not plaster, which are not made from
  plant-fibre pulp.
examples:
- She made a mask from paper-mache.
- The paper-mache bowl hardened as it dried.
