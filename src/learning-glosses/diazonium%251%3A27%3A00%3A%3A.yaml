simpleMeaning: A positive group of nitrogen with a single charge, joined to a benzene-like ring, found
  in salts used to make coloured dyes.
scope: A nitrogen-based ion in dye-making salts, not the dyes themselves.
examples:
- Diazonium salts are used to make azo dyes.
- The chemist prepared a diazonium compound for the reaction.
