simpleMeaning: the low member of the viol family, a group of old stringed instruments with about the same
  range of notes as the cello
scope: 'Also called bass viol and gamba: the low member of the viol family, not the cello and not the
  higher viols.'
examples:
- She played the viola da gamba in the early music group.
- The viola da gamba sounded deep notes below the violins.
