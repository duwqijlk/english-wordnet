simpleMeaning: the action of pushing or squeezing something, or the force used when doing this
scope: This names the action or force itself, not a machine, cupboard or other object used for such work.
examples:
- A light press on the brake pedal is enough to slow the car.
- The dough needs a firm press with the palm of your hand.
