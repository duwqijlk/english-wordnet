simpleMeaning: to make a sound soft, most of all by wrapping round the thing that makes it
scope: 'Also called dull and muffle: to make a sound soft, not to make a thing or a picture hard to see.'
examples:
- She damped the drum with a cloth to make it soft.
- He damped the bell by wrapping it in a thick cloth.
