simpleMeaning: In Islam, small wrongs done by Muslims; they are not named in the Koran, so judges may
  punish the wrongdoer in any fitting way.
scope: Small wrongs under Islamic law whose punishment the judge chooses, unlike wrongs whose punishment
  is fixed in the Koran.
examples:
- Tazir crimes are set by legislation in some Islamic nations.
- The judge gave a light sentence for the Tazir crime.
