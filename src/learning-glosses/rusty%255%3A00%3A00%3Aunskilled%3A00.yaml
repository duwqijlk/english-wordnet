simpleMeaning: less good at a skill than before, because the skill has not been used or practised
scope: This sense is about a skill that has got worse because the person has not used it; it is not about
  metal covered in rust, and not about something old and stiff that makes a rough sound.
examples:
- After ten years away from the piano, her playing is rusty.
- My French is rusty now because I never speak it.
