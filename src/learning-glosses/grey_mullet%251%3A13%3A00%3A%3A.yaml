simpleMeaning: The lean meat of a sea or fresh-water fish, much prized as food
scope: This is the lean meat of the fish eaten as food; mullet and gray mullet are other names for this
  sense, not the whole live fish and not the meat of other fish.
examples:
- Grey mullet is served grilled with lemon in the restaurant.
- The chef praised grey mullet for its lean, firm flesh.
