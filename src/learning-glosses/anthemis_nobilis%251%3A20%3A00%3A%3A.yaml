simpleMeaning: A Eurasian plant with apple-smelling leaves, white-rayed flowers and feathery leaves, used
  as a medicine; in some naming systems it goes in the genus that shares its name.
scope: Also called chamomile, camomile, and Chamaemelum nobilis; a Eurasian plant with apple-smelling
  leaves and white-rayed flowers used as a medicine.
examples:
- Anthemis nobilis grows in the garden with its apple-scented leaves.
- We picked Anthemis nobilis for a soothing tea.
