simpleMeaning: A rattling noise, often made when things move fast
scope: A rattling noise from fast movement, not a soft sound like leaves in the wind and not a single
  sharp knock.
examples:
- The clatter of iron wheels on cobblestones woke the whole street.
- The shutters clattered against the house all night.
