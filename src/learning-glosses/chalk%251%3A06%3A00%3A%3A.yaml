simpleMeaning: a piece of calcite (a soft white stone) or similar material, usually shaped like a stick,
  used for writing or drawing on blackboards or other flat surfaces
scope: A stick used for writing or drawing on a blackboard; not a drug with the same name, and not the
  act of writing or drawing with it.
examples:
- She picked up a piece of chalk and drew a circle.
- He broke the chalk in half before writing on the blackboard.
