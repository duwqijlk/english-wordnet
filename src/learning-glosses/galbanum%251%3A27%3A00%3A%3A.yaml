simpleMeaning: A bitter sticky gum with a strong smell, like the gum called asafetida
scope: This is a bitter sticky gum with a strong smell, like the gum called asafetida; gum albanum is
  another name for this sense, not sweet gum and not plain glue.
examples:
- Galbanum has a bitter taste and a strong smell.
- The maker used galbanum in the mix.
