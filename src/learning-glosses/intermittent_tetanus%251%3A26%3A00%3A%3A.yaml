simpleMeaning: A nerve condition causing twitching, painful muscle tightening and, in bad cases, seizures;
  it is tied to low calcium, little vitamin D, or alkalosis, an acid imbalance in the body.
scope: Another name for the same calcium-linked nerve condition, not the infectious disease tetanus that
  doctors vaccinate against.
examples:
- Intermittent tetanus can cause seizures when calcium levels fall dangerously low.
- The textbook still lists intermittent tetanus as an older name for tetany.
