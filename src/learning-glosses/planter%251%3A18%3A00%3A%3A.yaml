simpleMeaning: a person who owns or runs a large farm where crops are grown
scope: The person who owns or runs a large farm, not a worker who puts seeds in the ground and not a pot
  for plants in a house.
examples:
- The planter owned a large sugar farm and hired many workers.
- As the planter, she made all the choices about the farm.
