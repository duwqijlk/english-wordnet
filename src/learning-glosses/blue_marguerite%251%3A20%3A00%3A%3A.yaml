simpleMeaning: From South Africa or Australia comes this low bush with hairs, its flowers showing sky-coloured
  rays spread round a centre.
scope: Also called a blue daisy, this hairy low bush of South Africa or Australia is not a tall tree,
  and its flowers have sky-coloured rays spread round a centre.
examples:
- She pointed out a blue marguerite among the low bushes.
- We found blue marguerites growing in Australia.
