simpleMeaning: a person who cannot change to live well with the people and life around them
scope: A person who does not live well with the life around them, not a thing or piece of clothing that
  is the wrong size or shape.
examples:
- At the large, loud school, the quiet boy felt like a misfit.
- She was a misfit in the office and never felt part of the team.
