simpleMeaning: of clothes, fastened by folding one side of the front well over the other, most often with
  two rows of buttons
scope: Of clothes, fastened by folding one side of the front well over the other, most often with two
  rows of buttons; not fastened with one row of buttons and not left open.
examples:
- He wore a double-breasted jacket.
- The double-breasted suit had two rows of buttons.
