simpleMeaning: to use something to make as much money as possible, usually by letting its quality become
  worse
scope: 'To use a thing to make as much money as possible, usually letting its quality become worse. Not
  the plainer sense of commercialize in another batch: to make something ready to sell.'
examples:
- Critics say the owners have commercialized the old festival, and it is now full of cheap goods for sale.
- The quiet beach was commercialized by hotel owners, and it lost its charm.
