simpleMeaning: how a red-brown layer forms on iron when air and water meet it at low heat
scope: How a red-brown layer forms on iron when air and water meet it at low heat; rust is another name
  for this sense, not the layer itself alone and not the fast burning of iron in a hot fire.
examples:
- Rusting had eaten holes in the old gate.
- Rusting spreads fast on iron left out in the rain.
