simpleMeaning: The mind slowly grows worse in a condition where groups of muscles jerk again and again
  and the cause runs in families.
scope: It is a condition in which repeated muscle jerks, a mind that slowly grows worse, and a cause that
  runs in families all go together.
examples:
- Myoclonus epilepsy makes groups of muscles jerk again and again.
- In myoclonus epilepsy, the mind slowly grows worse over time.
