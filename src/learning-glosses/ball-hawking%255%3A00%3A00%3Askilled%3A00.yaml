simpleMeaning: said of a player who is good at taking the round object from the other side and stopping
  a hit
scope: A word for a player good at taking the other side's ball away and stopping a hit, not a player
  who is good at throwing and not a player who hits far.
examples:
- The ball-hawking center fielder caught the fly ball.
- Our ball-hawking guard stole the pass twice in a row.
