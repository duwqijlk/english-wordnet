simpleMeaning: any of a number of low blackberry plants that spread along the ground, most of all in North
  America
scope: Any of a number of low blackberry plants that spread along the ground, most of all in North America,
  also called dewberry; not an upright blackberry plant and not a bush of other lands.
examples:
- The dewberry bush spread along the fence, its stems low to the ground.
- We picked fruit from a dewberry bush at the edge of the field.
