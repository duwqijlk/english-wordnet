simpleMeaning: Nearest the thing being looked at sits a clear piece, or a set of them, in every telescope
  or microscope.
scope: Also called objective, object lens, and objective lens, this is the clear piece in a telescope
  or microscope that sits nearest the thing being looked at.
examples:
- Light passes through the object glass first.
- The object glass faces the thing being looked at.
