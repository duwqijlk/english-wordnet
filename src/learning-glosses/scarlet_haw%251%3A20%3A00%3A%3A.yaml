simpleMeaning: White flowers in flat-topped bunches, then bright orange-red fruit, mark this common bush
  or small tree from the east of the United States, which has few thorns.
scope: This is a common bush or small tree of the east of the United States, not a tall forest tree, with
  white flowers and bright orange-red fruit.
examples:
- The scarlet haw bore bright orange-red fruit.
- White flowers grew on the scarlet haw.
