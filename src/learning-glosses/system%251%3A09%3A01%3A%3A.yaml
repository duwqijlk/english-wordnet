simpleMeaning: a planned method or course of action used to reach a goal.
scope: This sense is not a way of sorting or grouping things, not mere tidiness, and not the body's organs;
  it is a method aimed at getting a result.
examples:
- The school uses a system of rewards to encourage reading.
- His system for saving money is to put aside a dollar each day.
