simpleMeaning: Shown in a picture made with lines, by drawing or by design.
scope: This is being shown in a drawing made with lines; pictured and depicted are other names for this
  sense, not shown in words or acted on a stage.
examples:
- The king was portrayed in full armour in the great hall.
- She was portrayed with a book in her hand, as a learned woman.
