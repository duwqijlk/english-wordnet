simpleMeaning: the way a person feels, either as a habit or for a short time
scope: 'Also called mood, temper or humour: the way a person feels at a time, not a funny message, not
  the way of finding things funny, and not an old body fluid.'
examples:
- He was in a bad humor and did not want to talk.
- Her good humor stayed with her all morning.
