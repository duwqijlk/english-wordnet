schema: oewn-learning-gloss-v2
senseId: 'clean%2:35:04::'
synsetId: 01611610-v
simpleMeaning: Take out everything inside a place or take away all of someone's things, so that nothing
  remains.
scope: This is emptying a place or taking away everything a person owns so nothing is left, not the adjective
  senses meaning free of dirt, filth or impurities, having tidy habits, free of restrictions or limitations,
  free of anything that dulls sound or color, not spreading pollution or radioactive contamination, free
  of sepsis or infection, free of objectionable content, morally or ritually pure, free of drugs, free
  of concealed weapons, showing no marks of discredit, having few corrections, not written or printed
  on, sportsmanlike, free of difficulties, thorough and complete, or deftly executed; not the noun for
  a weightlifting move; not the adverbs meaning completely or according to the rules; and not the other
  verb senses of washing away dirt, removing unwanted substances, removing unwanted parts such as feathers,
  pits, shells or husks, tidying a house, washing the body, being washable, removing items while cleaning,
  or stripping someone of money by gambling or robbery.
examples:
- We cleaned out the garage before the move and left nothing behind.
- The staff cleaned the shelves of every old book before the sale.
editorialStatus: reviewed-model-not-student-validated
