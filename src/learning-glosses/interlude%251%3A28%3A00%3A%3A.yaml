simpleMeaning: a period or event that comes between two other periods or events
scope: A period or event between others, not the verb sense of giving a short performance and not a brief
  show put between parts of a longer show.
examples:
- After a short interlude, the rain stopped and the game began again.
- The long meeting had a quiet interlude when everyone stopped to eat.
