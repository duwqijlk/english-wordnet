simpleMeaning: a person who stays loyal to the side they support, especially when people rise up against
  those in power
scope: Also called loyalist. This is a person loyal to their side, especially in a revolt, not the word
  for someone strong in body and used to hard work.
examples:
- The party stalwarts stayed loyal when the revolt began.
- He was a stalwart who never left his side, even in times of revolt.
