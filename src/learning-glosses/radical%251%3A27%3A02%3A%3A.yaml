senseId: 'radical%1:27:02::'
synsetId: 14898347-n
simpleMeaning: An atom or group of atoms with at least one unpaired electron; in the body, usually oxygen
  molecules that lost an electron and stabilize by stealing a nearby molecule's electron.
scope: The chemistry sense, not a political extremist or a word root; 'free radical' is another name for
  it.
examples:
- Free radicals in the body can damage cells.
- The radical stole an electron from a nearby molecule.
