simpleMeaning: so food can be given that way, a surgeon makes an opening that joins the middle part of
  the small gut to the front wall of the belly
scope: A surgeon makes this opening so food can be given through the front wall of the belly into the
  middle part of the small gut.
examples:
- Food was given through the jejunostomy into the middle part of the small gut.
- Food reached the middle part of the small gut through the jejunostomy.
