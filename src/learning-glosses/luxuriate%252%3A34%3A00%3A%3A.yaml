simpleMeaning: to start spending and living in a way that costs too much, and to give yourself costly
  pleasures freely
scope: 'Also called wanton: this is about giving yourself costly pleasures and spending too much, not
  about growing strongly and spreading a lot.'
examples:
- After he won the money, he luxuriated in long holidays and costly food.
- She luxuriates in a hot bath with fine oils after work.
