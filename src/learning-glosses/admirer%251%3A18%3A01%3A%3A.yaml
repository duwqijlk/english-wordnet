simpleMeaning: a person on the side of a politician, a team, or others of that kind, ready to give them
  help and backing
scope: 'Also called friend, champion, and supporter: someone who stands behind a politician or a team
  and helps them, not someone who merely likes or respects a person.'
examples:
- All the admirers of the team filled the hall.
- She is a keen admirer of the local football team.
