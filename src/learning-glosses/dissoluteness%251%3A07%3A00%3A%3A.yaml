simpleMeaning: a life with no self-control over pleasures felt through the body
scope: A lack of self-control over bodily pleasures, also called incontinence, and not a lack of self-control
  over money or work.
examples:
- His dissoluteness shocked the town, with nights spent in drink and feasting.
- The old tale warned against dissoluteness and its cost.
