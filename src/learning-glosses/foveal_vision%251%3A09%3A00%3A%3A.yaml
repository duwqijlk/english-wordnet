simpleMeaning: Seeing with the small spot at the back of the eye where sight is sharpest
scope: This is sight through the sharp centre spot of the eye, not sight from the edges of what you see
  and not sight in dim light.
examples:
- Her foveal vision let her read the small print.
- Foveal vision is sharpest in the middle of what you look at.
