senseId: 'fauve%1:18:00::'
synsetId: 10102192-n
simpleMeaning: This painter was one of a French group, and all of them painted in the same way.
scope: A painter in a French group who painted in the same way as the others; fauvist is another name
  for this sense, not a painter of any other group.
examples:
- Matisse was the best-known Fauve of the group.
- The young Fauve showed his work in Paris.
