simpleMeaning: On things that catch fire fast, like fuel, this weapon works best, because it is made to
  start fires
scope: A weapon made to start fires, most of all against things that burn well, with firebomb and incendiary
  as other names for this sense, not a weapon made to blow things apart and not a fire that starts on
  its own.
examples:
- The incendiary bomb set the fuel store alight.
- An incendiary bomb dropped on the warehouse started a fierce fire.
