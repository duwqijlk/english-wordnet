simpleMeaning: a time that lasts three months, especially one of the three three-month parts of the time
  when a woman is carrying a baby
scope: This sense is a time of three months, especially a part of the time a woman carries a baby, not
  one month and not the whole nine months.
examples:
- In the last trimester, the baby grew fast.
- The course is split into trimesters of three months each.
