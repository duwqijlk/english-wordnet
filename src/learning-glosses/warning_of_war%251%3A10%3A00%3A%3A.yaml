simpleMeaning: a message to a country's leaders that an enemy plans to start a fight between nations or
  is getting ready for one and so makes such a fight more likely
scope: A message to a country's leaders that an enemy plans a fight between nations or is getting ready
  for one, not a public alarm and not a call to start the fight.
examples:
- The warning of war reached the leaders before the enemy moved.
- A warning of war told the government that the enemy was getting ready to fight.
