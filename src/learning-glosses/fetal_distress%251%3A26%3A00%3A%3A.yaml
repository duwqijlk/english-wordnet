simpleMeaning: A bad state of an unborn child, most often found while the mother is still carrying it,
  and shown by a heart beat that is not normal
scope: A bad state of an unborn child, most often found during pregnancy and shown by a heart beat that
  is not normal, also called foetal distress; not a sickness of the mother and not a normal change in
  the heart beat.
examples:
- Fetal distress was seen in the heart trace.
- The doctor acted at once when fetal distress appeared.
