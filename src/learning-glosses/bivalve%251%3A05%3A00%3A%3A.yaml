simpleMeaning: This soft-bodied mollusk, a sea animal, has flat gills and lives shut inside two shells
  joined by a hinge, in sea or fresh water.
scope: Also called lamellibranch and pelecypod, this is a soft-bodied animal shut inside two shells joined
  by a hinge, set apart from animals with one shell and from animals with no shell.
examples:
- The bivalve shut its two shells.
- Bivalves live in sea and fresh water.
