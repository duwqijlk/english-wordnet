simpleMeaning: An act of questioning a statement and asking the person who made it to explain it.
scope: This is not an invitation to compete or a test of skill; it is a demand that someone explain or
  defend a statement.
examples:
- His challenge to the official story forced the company to release the documents.
- 'She met the accusation with a direct challenge: prove it.'
