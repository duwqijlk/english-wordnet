simpleMeaning: A kind of insect from Brazil, made in the 1950s by crossing a fierce African kind with
  a sweet-food kind; it keeps most African traits and spreads north to Texas.
scope: Also called killer bee, Africanized bee, Apis mellifera adansonii, and Apis mellifera scutellata;
  a fierce kind of bee from Brazil, not a calm garden honeybee and not a wild wasp.
examples:
- Africanized honey bees spread north into Texas in recent years.
- An Africanized honey bee stung the farmer when he came too close.
