simpleMeaning: the art or gift of telling what will happen in the future by powers that are not part of
  the natural world, or pretending to have that gift
scope: 'Also called foretelling: the art or gift itself. It is not the words a person speaks when telling
  the future, and not a lucky guess that turns out right.'
examples:
- She claimed her gift of divination came from the spirits.
- In old times, people used divination to learn what the gods wanted.
