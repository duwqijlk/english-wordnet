simpleMeaning: far too great, past what is fair or makes sense
scope: 'Also called steep, outrageous, unconscionable, extortionate, and usurious: far too great in price
  or amount, not just a little high or costly.'
examples:
- The hotel charged an exorbitant price for a small room.
- He paid an exorbitant rent for his flat each month.
