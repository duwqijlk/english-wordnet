simpleMeaning: feeling as if you or things around you are turning round and round, or making someone feel
  that way, and likely to fall
scope: 'Also called dizzy, giddy and woozy: feeling that things are turning round and that you may fall,
  or making someone feel that way; not just high or steep on its own.'
examples:
- Looking down from the tower gave him a vertiginous feeling.
- The vertiginous climb up the cliff face made his head turn.
