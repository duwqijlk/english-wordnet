simpleMeaning: Used gases from the cylinders of an engine pass through this part on their way to the pipe
  that lets them out
scope: This is a part of an engine that carries used gases away, not the pipe that lets them out and not
  the cylinders they come from.
examples:
- Gases from the cylinders flow through the exhaust manifold.
- The exhaust manifold joins the cylinders to the pipe that lets the gases out.
