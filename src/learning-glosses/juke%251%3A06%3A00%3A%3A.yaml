simpleMeaning: A small roadside place in the south-east of the United States where you can eat, drink,
  and dance to music from a record machine.
scope: A small roadside eating and dancing place in the south-east of the United States, not a bar or
  a dance hall elsewhere.
examples:
- They stopped at a juke on the highway for supper and dancing.
- On Saturday nights the juke was full of dancers.
