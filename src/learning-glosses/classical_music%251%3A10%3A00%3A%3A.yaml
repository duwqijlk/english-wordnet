simpleMeaning: an old kind of art made with sounds, in set forms, that pleases people with a trained ear
  for it and draws the interest of judges
scope: This is an old kind of art made with sounds, in set forms; classical is another name for this sense,
  not a song with words and not a new kind of sound art.
examples:
- She loves classical music and plays it on the piano.
- The concert opened with classical music from the last century.
