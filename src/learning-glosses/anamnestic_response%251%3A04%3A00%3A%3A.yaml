simpleMeaning: Fast, fresh guards against a bit of germ are made when the body meets that same bit a second
  time or later.
scope: Also called anamnestic reaction, this is the fast making of fresh guards against a bit of germ
  on a second or later meeting with that same bit.
examples:
- The guards came back in an anamnestic response after the second meeting with the germ.
- A second meeting with the same germ set off an anamnestic response.
