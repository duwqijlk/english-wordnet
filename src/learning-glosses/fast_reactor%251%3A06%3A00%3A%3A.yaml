simpleMeaning: a machine that makes power from atoms splitting, where the splitting is set off by high-speed
  bits of atoms and almost no material is used to slow them down
scope: A machine that makes power from splitting atoms, not one that uses slow bits of atoms and not a
  machine that burns fuel.
examples:
- The fast reactor needs almost no material to slow the neutrons down.
- Engineers built a fast reactor that makes power from atoms splitting.
