simpleMeaning: In the New Testament, the day at the end of time, after Armageddon, when God fixes the
  fate of each person by the good and bad of their earthly life.
scope: In the New Testament, the last day when God judges each life, also called doomsday, crack of doom,
  day of reckoning, and end of the world; not the end of one life and not a war on earth.
examples:
- The preacher spoke of the eschaton, when God will judge all people.
- For them, the eschaton comes after Armageddon at the end of time.
