simpleMeaning: the making of a new life by the joining of male and female seed cells, of sperm and egg
  cells in animals or of pollen and seed parts in plants
scope: The joining of male and female seed cells to make a new life; fertilization, fecundation and fertilisation
  are other names for this sense, not birth itself and not the growth of the young after joining.
examples:
- Impregnation takes place when the male and female cells join.
- In plants, impregnation follows when pollen reaches the seed part.
