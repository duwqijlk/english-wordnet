simpleMeaning: wildly funny in a loud, unrestrained way, leaving people helpless with laughter
scope: Comedy or fun that is wildly funny and leaves people laughing helplessly, also called hilarious
  or uproarious; not something so intense that a person wants to cry out, and not something striking and
  startling like a cry.
examples:
- The play was a screaming farce from the first scene to the last.
- Her screaming comedy routine left the whole audience gasping for breath.
