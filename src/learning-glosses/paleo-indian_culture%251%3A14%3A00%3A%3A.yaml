simpleMeaning: the way of life of the first people who lived in North and South America long ago
scope: 'Also called Paleo-American culture and Paleo-Amerind culture: the way of life of the very first
  people in the Americas, not a later culture of the same lands.'
examples:
- The Paleo-Indian culture left stone tools across North America.
- Archaeologists study the Paleo-Indian culture to learn how the first Americans lived.
