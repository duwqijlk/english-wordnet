senseId: 'robber_fly%1:05:00::'
synsetId: 02198771-n
simpleMeaning: a fast hunting fly with a strong body like a bee, whose hard mouth tube sucks the juices
  of other insects caught in the air
scope: Also called a bee killer; a hunting fly that catches insects in the air, not a house fly and not
  a bee.
examples:
- A robber fly caught a bee in the air above the field.
- The robber fly held the insect with its hard mouth tube.
