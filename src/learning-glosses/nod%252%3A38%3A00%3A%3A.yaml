simpleMeaning: to sway gently backward and forward, as a sleepy head does.
scope: The swaying of flowers, branches or heads, not the gesture of lowering and raising the head to
  agree, and not drifting off to sleep.
examples:
- The tall flowers nodded in the breeze.
- The branches nodded gently as the wind passed.
