simpleMeaning: to send or carry something by plane as mail
scope: This is the verb for sending or carrying mail by plane; it is not the noun sense for the letters
  and packages themselves that are carried by plane.
examples:
- We airmailed the letter to Europe so it would arrive quickly.
- Please airmail the small package to her office in Canada.
