simpleMeaning: 'a Gestalt rule about how the mind groups what it sees: things close to each other in place
  or time are seen as one group, when nothing else is different'
scope: A rule about how the mind groups what it sees, not a measure of how near two things are.
examples:
- The proximity of the two houses made them look like one home.
- In the test, objects shown in close proximity were seen as one group.
