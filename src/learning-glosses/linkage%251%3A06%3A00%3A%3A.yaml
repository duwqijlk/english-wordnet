simpleMeaning: A set of rods, springs, and turning posts joined together so that power or movement passes
  from one part to another.
scope: A mechanical set of joined rods, springs, and pivots that passes on power or movement, not the
  genetics sense of traits passed down together because their genes are linked.
examples:
- The linkage between the pedals and the brakes had come loose.
- A broken linkage stopped the machine from working.
