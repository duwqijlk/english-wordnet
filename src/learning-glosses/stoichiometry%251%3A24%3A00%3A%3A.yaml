simpleMeaning: In chemistry, the amounts of stuffs that take part in a reaction or make a compound stand
  in a link, typically a share of whole numbers.
scope: In chemistry, this is the link between the amounts of stuffs that take part in a reaction or make
  a compound, typically a share of whole numbers, not a list of the stuffs themselves.
examples:
- The stoichiometry of the reaction was a share of whole numbers.
- Stoichiometry links the amounts of stuffs that form a compound.
