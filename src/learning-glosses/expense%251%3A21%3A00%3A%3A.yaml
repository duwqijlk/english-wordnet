simpleMeaning: money paid for goods and work done for you, that may now be taken off the amount tax is
  worked out on, not money spent on lasting things like buildings
scope: This is money paid for goods and services that may lower tax now, not money spent on lasting property
  and not just any cost.
examples:
- Travel for work counts as a business expense that can be taken off the amount tax is worked out on.
- The company listed office supplies as an expense on its tax form.
