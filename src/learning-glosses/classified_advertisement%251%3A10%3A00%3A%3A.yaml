simpleMeaning: a short notice in a paper or magazine, most often in tiny print, set with other notices
  of the same kind
scope: A short notice in a paper or magazine, most often in tiny print, set with other notices of the
  same kind; classified and classified ad are other names for this sense, not a large display notice and
  not a notice on its own.
examples:
- She put a classified advertisement in the paper to sell her old bike.
- The classified advertisements for used cars fill several pages of the magazine.
