simpleMeaning: a carving on a flat surface in which the shapes stand out by at least half their depth
scope: A carving in which shapes stand out by at least half their depth; alto rilievo and high relief
  are other names for this sense, not a carving that stands out only a little and not a free-standing
  statue.
examples:
- The alto relievo on the church wall showed figures that seemed to step out of the stone.
- She ran her hand over the alto relievo to feel how far the shapes stood out.
