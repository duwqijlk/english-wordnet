simpleMeaning: To show which way it is heading, a ship has a fixed mark on its compass
scope: Also called lubber's mark, lubber's point and lubber line, this is a fixed mark on a ship's compass,
  not a rope on the ship and not a line on a map.
examples:
- The lubber's line pointed north as we sailed.
- Check the lubber's line to see our heading.
