simpleMeaning: White berries follow pale green flowers on a common vine of the east and middle United
  States, with leaves in threes; its stinging oil brings out a rash on touch.
scope: 'Also called markweed and poison ivy: a climbing plant whose oil brings out a rash on the skin.'
examples:
- We stayed clear of the poison oak with its leaves in threes.
- Touching poison oak left a red rash on his arms.
