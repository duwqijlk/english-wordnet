simpleMeaning: a back tooth with a wide flat top for grinding food, set behind the smaller teeth that
  come before it
scope: A back tooth with a wide flat top; molar is another name for this sense, not a machine that crushes
  things, and not a long sandwich.
examples:
- The dentist found a crack in one of her grinders.
- Your grinders sit at the back of your mouth.
