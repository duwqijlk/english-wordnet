simpleMeaning: any of a group of plants with leaves made of small leaflets and big bright flowers like
  peas
scope: One of a group of plants with leaves of small leaflets and big pea-like flowers; not a pea plant
  grown for food and not a common garden shrub.
examples:
- Sesbania grows well in wet soil near the pond.
- The sesbania in the garden has big bright flowers like peas.
