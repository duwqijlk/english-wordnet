simpleMeaning: An airplane that flies on the push of one or more engines that send out a fast stream of
  hot air
scope: An airplane driven by one or more engines that send out a fast stream of hot air, also called jet
  or jet plane; not a plane with propellers and not a glider.
examples:
- The jet-propelled plane climbed fast after takeoff.
- We boarded the jet-propelled plane at dawn.
