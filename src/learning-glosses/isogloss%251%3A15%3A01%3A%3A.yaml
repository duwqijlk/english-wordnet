senseId: 'isogloss%1:15:01::'
synsetId: 92408453-n
simpleMeaning: A line on a map marking where a way of speaking ends, such as how a vowel is said, what
  a word means, or how words are put together.
scope: A line on a map marking where a way of speaking ends; heterogloss is another name for this sense,
  not a line marking a country border and not a line of equal rainfall.
examples:
- The isogloss ran between the two towns with different vowel sounds.
- A major isogloss marks where the northern way of speaking begins.
