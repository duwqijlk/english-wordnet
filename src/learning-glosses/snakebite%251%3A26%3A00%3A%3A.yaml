senseId: 'snakebite%1:26:00::'
synsetId: 14311149-n
simpleMeaning: A wound made when a snake bites; the snake usually has poison in its bite
scope: This is the wound itself when a snake bites a person or animal. It is not the snake itself, and
  not a drink that shares the name.
examples:
- He went to hospital at once after a snakebite on his foot.
- The snakebite left two small marks on her leg and made it swell.
