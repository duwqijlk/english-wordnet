simpleMeaning: a virus spread by insects, from one group of viruses, that can cause several kinds of brain
  disease in horses
scope: A virus that can cause brain disease in horses, not a virus that makes people sick and not a germ
  carried in water.
examples:
- The alphavirus spread to horses after the rains brought more mosquitoes.
- Vets watched for signs of alphavirus in the horses.
