simpleMeaning: a person who works on board a trading ship and has learned special skills for the job
scope: This is a trained person who works on board a trading ship, also called able seaman; not a sailor
  in the navy and not a worker on a ship with no special training.
examples:
- The able-bodied seaman helped load the cargo before the ship sailed.
- An able-bodied seaman must know how to handle ropes and sails.
