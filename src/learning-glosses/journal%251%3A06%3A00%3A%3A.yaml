simpleMeaning: The section of an axle that turns inside a bearing, the support that lets a wheel spin.
scope: The part of an axle that runs inside a bearing, not a diary, a magazine, or an account book.
examples:
- The mechanic measured the journal on the axle for wear.
- A worn journal can make the wheel wobble and damage the bearing.
