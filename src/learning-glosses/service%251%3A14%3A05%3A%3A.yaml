simpleMeaning: a company or body that does work for the public, such as supplying water, power, or transport,
  and must follow government rules.
scope: This is not an act of helping someone or a way of being useful to them; it is an organization that
  supplies something the public needs and answers to government rules.
examples:
- The postal service is required by law to deliver mail to every address in the country.
- State regulators fined the gas service for failing to repair leaks quickly.
