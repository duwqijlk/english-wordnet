simpleMeaning: the front side of a coin, which usually shows a person's face; the word is usually used
  in the plural
scope: This is not the body part above the neck and not a leader; it is the face side of a coin.
examples:
- He tossed the coin and it came up heads.
- They decided who would pay by choosing heads or tails.
