simpleMeaning: A Chadic way of speaking used in Chad, with seven vowels and with vowels that can be short
  or long.
scope: 'Also called Dangaleat, Dangaleat language and Dangla: a Chadic tongue of Chad, set apart from
  other Chadic tongues by its seven vowels and its long and short vowels.'
examples:
- She grew up speaking the Dangla language at home in Chad.
- The Dangla language uses seven vowels.
