simpleMeaning: cover a piece of food with a beaten mixture of yolk and white
scope: This is the cooking action of coating food, not the verb meaning to throw eggs at someone or the
  noun for the food itself.
examples:
- She egged each cutlet before pressing it into breadcrumbs.
- The cook egged the fish fillets, then fried them until golden.
