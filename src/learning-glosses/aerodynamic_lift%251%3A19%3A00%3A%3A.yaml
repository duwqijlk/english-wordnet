simpleMeaning: The part of the push of moving air on a wing shape that works against the pull of the earth.
scope: The part of the push of moving air on a wing shape that works against the pull of the earth, also
  called lift; not the push that holds the wing back and not the pull of the earth itself.
examples:
- Aerodynamic lift holds the plane up in the air.
- More speed gives the wing more aerodynamic lift.
