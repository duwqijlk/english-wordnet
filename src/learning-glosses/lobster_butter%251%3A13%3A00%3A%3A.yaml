simpleMeaning: A spread made from churned cream mixed with cut-up flesh of a big clawed sea animal, or
  given the taste of that animal's shells.
scope: It is a spread that takes its taste from a clawed sea animal, from its flesh or from its shells.
examples:
- Lobster butter is made with chopped lobster.
- The lobster butter tastes of lobster shells.
