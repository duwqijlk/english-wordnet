simpleMeaning: A small part in which most of the current runs through a narrow path whose power to slow
  the current can be changed by a crosswise electric force.
scope: A small part in which most of the current runs through a narrow path whose power to slow the current
  can be changed by a crosswise electric force, not a simple on-off switch and not a glass tube that does
  the same work.
examples:
- The field-effect transistor controls the current in the radio.
- A field-effect transistor uses very little power.
