simpleMeaning: A small water plant with bunches of awl-shaped leaves in a low ring at the base and tiny
  white flowers; it grows all round the far north.
scope: 'Also called awlwort: a small water plant with awl-shaped leaves in a low ring and tiny white flowers,
  found all round the far north, not a land plant with broad leaves and not a water plant with large showy
  flowers.'
examples:
- Subularia aquatica grows in shallow water at the lake edge.
- The Subularia aquatica leaves stood in a low ring under the water.
