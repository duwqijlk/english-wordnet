simpleMeaning: In a radio, this part joins its own wave to the wave coming in, so new waves come out at
  higher and lower pitches
scope: Also called a heterodyne oscillator, it is the part of a radio that joins its own wave to the incoming
  one.
examples:
- The local oscillator mixed its wave with the wave coming in.
- The local oscillator gave the radio new waves at higher and lower pitches.
