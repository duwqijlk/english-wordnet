senseId: 'differential%3:01:01::'
synsetId: 02920481-a
simpleMeaning: In maths, having in it one or more derivatives, where each one shows how fast one thing
  changes when another thing changes
scope: In maths, this describes a thing that has in it one or more measures of how fast one thing changes
  when another thing changes; it is not the noun for the result of working out a change, and not the wider
  sense of just relating to a difference between things.
examples:
- We solved a differential equation in class today.
- The book gives a differential equation for the falling ball.
