simpleMeaning: a test that shows how ready a person is to start a course of study
scope: 'Also called entrance examination: a test that shows how ready a person is to start a course of
  study, not a test at the end of a course and not a job test.'
examples:
- She passed her entrance exam and got a place on the course.
- The entrance exam tests how ready you are for the first year of study.
