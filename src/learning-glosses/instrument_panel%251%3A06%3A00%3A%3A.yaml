simpleMeaning: Switches, dials, and meters sit on one flat board that blocks power, so they can run other
  machines that use power.
scope: Also called board, panel, control board, and control panel, this is a flat board holding switches,
  dials, and meters that run other machines that use power.
examples:
- The pilot checked the instrument panel before takeoff.
- All the dials on the instrument panel went dark.
