simpleMeaning: to add flavour to food with a mix of spices, in the way food is made in Indian cooking
scope: To flavour food with spices in the Indian way, not the spicy dish itself and not another way of
  cooking.
examples:
- She curried the chicken with a mix of spices before she cooked it.
- He curries the vegetables with spices every Friday.
