simpleMeaning: Said of a grand, formal occasion or manner, full of ceremony and stately show.
scope: 'Also called pompous: full of grand ceremony and stately show, not the sense of being rigidly bound
  by rules.'
examples:
- The greeting was ceremonious, with bows and long speeches.
- The king's arrival was ceremonious, with drums and banners.
