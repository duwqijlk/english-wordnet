simpleMeaning: Woodland plant whose tiny white flowers hang in loose bunches on leafy stems, found in
  damp forests from Alaska to central California and east to Montana.
scope: This is the woodland plant with tiny white flowers in loose clusters, not the true mitrewort that
  the 'false' in its name sets it against. It is a botanical name, and 'false miterwort' is another spelling
  of the same plant.
examples:
- A patch of false mitrewort flowered under the cedars.
- We found false mitrewort among the ferns in the wet ravine.
