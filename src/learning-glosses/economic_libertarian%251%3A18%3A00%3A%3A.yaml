simpleMeaning: a person who wants each person to keep as many rights as they can, and wants the state
  to do as little as it can
scope: A person who wants people to keep as many rights as they can and the state to do as little as it
  can, not someone who wants the state to run more of life.
examples:
- The economic libertarian said the state should stay out of trade.
- As an economic libertarian, she wanted people free to start any business they liked.
