simpleMeaning: A careful look at how facts are used, kept and passed on, checked against papers and people,
  to make the stored facts better.
scope: A careful look at how facts are used, kept and passed on, not a check of money and not a look at
  one file alone.
examples:
- The firm ran an information audit last year.
- An information audit showed where the records went wrong.
