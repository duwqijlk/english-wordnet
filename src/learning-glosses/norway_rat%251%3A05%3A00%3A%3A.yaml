simpleMeaning: A small animal that lives around houses, found in many places, and a serious pest all over
  the world.
scope: Also called brown rat and Rattus norvegicus; a small animal that lives around houses and is a pest,
  not a pet animal and not a mouse.
examples:
- The Norway rat chewed through the sacks of grain in the storehouse.
- A Norway rat had made a nest behind the kitchen stove.
