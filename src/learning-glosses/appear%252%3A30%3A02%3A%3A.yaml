simpleMeaning: To begin to exist, or to start being present in a place or situation.
scope: This is about something starting to exist or turning up, not about becoming visible to the eye,
  being published, seeming true, performing on stage, or attending court.
examples:
- The first cities appeared around ten thousand years ago.
- A new problem appeared as soon as the old one was solved.
