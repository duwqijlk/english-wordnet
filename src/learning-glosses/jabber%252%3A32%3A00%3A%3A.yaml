simpleMeaning: to talk noisily or with strong feeling, or as if making a grand speech
scope: 'Also called rant, rave, or spout: talking noisily or with strong feeling, or as if making a grand
  speech, not chatting calmly and not speaking clearly and slowly.'
examples:
- The children jabbered all the way home about the fair.
- He jabbered on until no one was listening any more.
