simpleMeaning: the chance that one named thing will happen
scope: The chance that a named thing will happen, not how often it has happened and not how sure a person
  feels about it.
examples:
- The likelihood of rain tomorrow is high, so take an umbrella.
- They talked about the likelihood of the plan working.
