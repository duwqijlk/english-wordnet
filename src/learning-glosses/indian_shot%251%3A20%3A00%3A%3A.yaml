simpleMeaning: a canna plant grown above all for its root that can be eaten, from which arrowroot starch
  is got
scope: A canna grown above all for its eating root, from which arrowroot starch is got; arrowroot and
  achira are other names for this sense, not the starch itself and not a canna grown for its flowers.
examples:
- Indian shot grew by the pond, tall and green.
- They dug up the indian shot for its starchy root.
