simpleMeaning: A milder form of measles lasting three or four days, it spreads from others and comes from
  a virus that can harm an unborn child in the first three months.
scope: It is also called rubella and three-day measles, and it lasts three or four days as a milder form
  of measles.
examples:
- The child had epidemic roseola for four days.
- Epidemic roseola can harm an unborn child in the first three months.
