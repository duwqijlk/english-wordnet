simpleMeaning: Cool ponds and fish tanks gain oxygen from this water plant, which grows in still or slow-moving
  fresh or part-salty water
scope: A water plant of still or slow fresh or part-salty water that adds oxygen to cool ponds and tanks,
  not a land plant and not a plant of fast rivers.
examples:
- Horned pondweed grows in the still water of the old pond.
- They planted horned pondweed to put oxygen into the cool pond.
