simpleMeaning: Blood cells, red cells, white cells and platelets, float in this clear watery fluid of
  blood and lymph, which holds no cells of its own.
scope: Also called plasma and blood plasma, this clear watery fluid of blood and lymph holds the blood
  cells but has no cells in it.
examples:
- The plasm held no cells of its own.
- Red cells float in the plasm.
