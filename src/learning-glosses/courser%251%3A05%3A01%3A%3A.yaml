simpleMeaning: in old times, a strong, fast horse that carried a soldier into battle
scope: A strong, fast war horse of old times; charger is another name for this sense, and it is not a
  dog trained for hunting, a huntsman, or the swift bird of the same name.
examples:
- The knight rode his courser into the field.
- A courser carried the soldier swiftly into battle.
