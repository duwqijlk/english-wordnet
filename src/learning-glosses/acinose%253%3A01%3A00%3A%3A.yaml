simpleMeaning: having to do with a small sac in a gland that has many parts
scope: This has to do with a small sac in a gland made of many parts, also called acinar, acinic and acinous;
  it is not a whole gland, and not a small part of a fruit.
examples:
- The acinose cells form the small sacs of the gland.
- The acinose walls of the sacs are thin and soft.
