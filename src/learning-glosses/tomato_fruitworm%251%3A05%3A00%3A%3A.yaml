simpleMeaning: The young of a moth that flies at night, it does great harm above all to corn, cotton,
  and crops of red fruit.
scope: People also call it corn earworm, cotton bollworm, tobacco budworm, or vetchworm, the young of
  a moth that flies at night and does great harm to corn, cotton, and tomato crops.
examples:
- Tomato fruitworms did great harm to the cotton crop.
- The tomato fruitworm eats corn, cotton, and tomatoes.
