senseId: 'bony%3:00:00::'
synsetId: 00296523-a
simpleMeaning: having bones, especially many bones or bones that stand out and are easy to see
scope: This says something has many bones, or its bones stand out. It is not the sense that says a thing
  is made of bone itself.
examples:
- The fish was bony, so we ate it with care.
- Her bony hands showed every bone under the skin.
