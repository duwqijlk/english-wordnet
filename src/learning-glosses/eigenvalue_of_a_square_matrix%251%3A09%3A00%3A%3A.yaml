simpleMeaning: In maths, the number leaving a grid worth nought when the number times the ones-and-noughts
  grid is taken from a grid with as many rows as columns.
scope: Eigenvalue, eigenvalue of a matrix, and characteristic root of a square matrix are other names
  for this number in maths, tied to a grid of numbers with as many rows as columns.
examples:
- The eigenvalue of a square matrix was 5 in the worked example.
- She checked the eigenvalue of a square matrix before going on to the next question.
