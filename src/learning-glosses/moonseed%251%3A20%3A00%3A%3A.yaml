simpleMeaning: A plant in the Menispermaceae family with red or black fruit and seeds shaped like a crescent
  or a ring.
scope: This is a plant with red or black fruit and crescent- or ring-shaped seeds, not the eye trouble
  in horses called moon blindness.
examples:
- Moonseed grows along the fence at the back of the garden.
- The moonseed in the garden bore black fruit this year.
