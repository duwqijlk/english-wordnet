simpleMeaning: A small tree of the dry open land of southern Africa, with upright bent branches that bring
  a branched candle holder to mind.
scope: A small tree of the dry open land of southern Africa with upright bent branches, also called cactus
  euphorbia; not a cactus and not a tall forest tree.
examples:
- The naboom stood alone on the dry plain.
- Naboom branches rise like the arms of a candle holder.
