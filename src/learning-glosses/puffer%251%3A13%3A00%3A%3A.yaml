simpleMeaning: a special food made from a fish, very dangerous to eat because a strong poison that harms
  nerves is in its egg-making parts and its liver
scope: Also called blowfish, pufferfish, and sea squab, this fish is eaten as a special food; it is not
  just the name of the living fish in the sea.
examples:
- The chef served puffer only after long training in how to make it safe.
- Eating puffer can be deadly if the poison is not cut away.
