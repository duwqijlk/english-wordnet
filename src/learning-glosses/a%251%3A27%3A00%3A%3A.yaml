simpleMeaning: One of some vitamins that dissolve in fat and are needed for normal sight, which keep eyes
  from going blind, swollen, or dry
scope: One of the fat-soluble vitamins needed for normal sight; antiophthalmic factor, axerophthol and
  vitamin A are other names for this sense, and it is not the unit of length, the DNA unit, the letter,
  or the unit of electric current also called A.
examples:
- A lack of A can lead to night blindness.
- Eat foods rich in A to keep your eyes healthy.
