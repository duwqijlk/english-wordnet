simpleMeaning: To love without question and without seeing faults, too much, and to honour as one would
  a god
scope: To love too much, without question or fault-finding, with worship as another name for this sense;
  not to hold in respect and awe as holy.
examples:
- Many teenagers revered the Beatles.
- She revered the singer as if he were a god.
