simpleMeaning: a tiny bone in the ear, shaped like a small loop, that passes sound on from one small bone
  to the inner ear
scope: A tiny ear bone that carries sound, not the metal loop a rider puts a foot in.
examples:
- The stirrup is the smallest bone in the human body.
- Sound reached the inner ear through the stirrup.
