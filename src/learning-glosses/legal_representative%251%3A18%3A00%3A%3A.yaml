senseId: 'legal_representative%1:18:00::'
synsetId: 10272993-n
simpleMeaning: A person who acts for another with standing in law, as by power of attorney or as the executor
  of a will
scope: A person who acts for another with standing in law, as by power of attorney or as the executor
  of a will, not a lawyer hired only to argue a case and not a helper with no legal standing.
examples:
- Her legal representative signed the papers for her.
- The legal representative of the estate sold the house.
