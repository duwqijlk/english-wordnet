simpleMeaning: Picking out one thing from the wider group or kind it belongs to.
scope: Also called individualization; picking out one thing from the wider group or kind it belongs to,
  not the quality of being individual itself.
examples:
- Individuation lets us see each plant apart from its kind.
- The study of individuation looks at how one thing stands apart from its group.
