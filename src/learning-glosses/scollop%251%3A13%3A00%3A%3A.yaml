simpleMeaning: the muscle of a shellfish with a fan-shaped shell that people eat, served cooked under
  heat or in hot water, in salads, or in cream sauces
scope: 'Also called scallop and escallop: the eating muscle of a shellfish with a fan-shaped shell, not
  the shell itself and not a thin slice of meat.'
examples:
- We ate scollop poached in butter sauce.
- The scollop salad came with fan-shaped shells on the plate.
