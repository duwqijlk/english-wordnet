simpleMeaning: A meeting of people chosen by vote or picked to act for the groups they come from
scope: This sense is a meeting where chosen people meet to talk and decide. It is not a law-making body
  itself and not a small talk between friends.
examples:
- Delegates from many states came to the congress to vote on new rules.
- The congress met for three days to choose a new leader.
