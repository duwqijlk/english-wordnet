simpleMeaning: A split-off Christian faith in north Africa, 4th to 7th century, which held that only people
  who lived a blameless life could belong to the church or give the sacraments
scope: This is a split-off Christian faith in north Africa from the 4th to the 7th century; it stands
  apart from other early Christian groups by its rule that only the blameless could belong to the church
  or give the sacraments.
examples:
- Donatism spread in north Africa in the 4th century.
- Donatism held that only the blameless belonged in the church.
