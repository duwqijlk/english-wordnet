simpleMeaning: A smooth shrub of American swamps, with leaves of many leaflets and greenish flowers followed
  by greenish-white berries; it gives an oil that hurts the skin.
scope: A smooth shrub of American swamps with leaves of many leaflets, also called poison ash, poison
  dogwood, poison sumac and Rhus vernix, whose oil hurts the skin.
examples:
- Toxicodendron vernix grows in the swamp with greenish flowers and berries.
- Do not touch Toxicodendron vernix, as its oil hurts the skin.
