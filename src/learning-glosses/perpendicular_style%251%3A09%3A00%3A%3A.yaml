simpleMeaning: a Gothic style in England in the 1300s and 1400s, with lines that run up and down, a wide
  low Tudor arch, and stonework overhead spreading like a fan
scope: 'Also called perpendicular: a Gothic building style of England in the 1300s and 1400s, not the
  earlier Gothic styles and not a modern building style.'
examples:
- The perpendicular style is easy to spot by its tall straight lines.
- The church was rebuilt in the perpendicular style in the 1400s.
