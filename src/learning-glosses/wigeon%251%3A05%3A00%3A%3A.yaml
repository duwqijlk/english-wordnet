simpleMeaning: A fresh-water duck from Europe and Asia and northern Africa, of the same kind as mallards
  and teals
scope: A fresh-water duck from Europe and Asia and northern Africa; widgeon is another name for this sense,
  and it is not a sea duck or a goose.
examples:
- The wigeon landed on the marsh.
- Wigeon gather on the estuary in autumn.
