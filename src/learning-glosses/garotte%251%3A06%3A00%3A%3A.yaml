simpleMeaning: A person is put to death with this device, which squeezes the neck so they cannot breathe
scope: 'Also called garrote, garrotte, or iron collar: this device puts a person to death by squeezing
  the neck so they cannot breathe, not a rope for hanging and not a weapon used in a fight.'
examples:
- The prisoner was put to death with a garotte.
- The old law book showed a garotte used in Spain.
