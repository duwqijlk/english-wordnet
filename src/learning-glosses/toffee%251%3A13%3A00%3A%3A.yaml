simpleMeaning: sugar heated until it turns brown, then left to cool and go hard in thin flat pieces
scope: 'Also called brittle: a hard sweet made from heated sugar in thin flat pieces, not a soft sweet
  and not a cake.'
examples:
- She broke the toffee into small pieces.
- He made toffee by heating sugar and letting it cool in a thin sheet.
