simpleMeaning: a person who gives you a test to see if you have the skills or knowledge you need for something
scope: 'Also called examiner: a person who gives a test, not the person who takes the test and not a tool
  or machine used to check how a thing works.'
examples:
- The tester asked me questions and watched me drive for my driving test.
- Our tester told us to start the exam and wrote down the time.
