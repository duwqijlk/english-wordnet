simpleMeaning: In psychophysics, the idea that the strength of what stirs a feeling, raised to a fixed
  number, sets how strong the feeling is
scope: In the study of how we sense things, this rule links the strength of a feeling to the strength
  of what stirs it.
examples:
- The power law says a small rise in a sound can feel like a much bigger rise.
- Under the power law, doubling the light does not double how bright it looks.
