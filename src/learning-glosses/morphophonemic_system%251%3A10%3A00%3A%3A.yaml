simpleMeaning: The set of sound rules of one language that change with the form of words
scope: The set of sound rules of one language that change with the form of words, not the sounds alone
  and not the grammar.
examples:
- The morphophonemic system of English explains why 'cats' and 'dogs' end differently.
- Students of the language study its morphophonemic system.
