simpleMeaning: the part of a flower that holds the small parts that can grow into seeds
scope: The part in a flower that holds what can become seeds; not the body part in animals and people
  that makes eggs.
examples:
- The ovary sits at the bottom of the flower and later grows into fruit.
- If you cut the flower open, you can see the ovary in the middle.
