simpleMeaning: a plant from Europe and Asia that lives for one year, grown in North America, with bright
  groups of blue, purple, pink, or white flowers
scope: This is a flowering plant, also called cornflower and bachelor's button. It is not the blue fly
  that makes a loud buzzing sound.
examples:
- Bluebottles opened in the garden, showing blue and pink flowers.
- She planted bluebottle seeds that spring, and the plants flowered the same year.
