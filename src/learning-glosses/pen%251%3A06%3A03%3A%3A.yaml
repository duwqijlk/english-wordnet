simpleMeaning: a frame with sides all around it, which you can move from place to place, and in which
  a baby may be left to play
scope: This is the movable frame where a baby can play. It is not the tool for writing with ink, not a
  fenced place for farm animals, and not a prison.
examples:
- The baby played safely in her pen while her mother cooked.
- He put the baby in a pen with some soft toys to play with.
