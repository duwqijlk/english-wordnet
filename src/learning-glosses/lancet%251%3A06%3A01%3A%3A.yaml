simpleMeaning: a tall, narrow, sharply pointed arch in the Gothic style (the way of building used for
  old stone churches)
scope: 'Also called lancet arch: a tall pointed arch in a building, not the small sharp knife a doctor
  uses to cut skin.'
examples:
- The church window was shaped like a lancet, tall and pointed at the top.
- Each lancet over the door rose to a sharp point.
