simpleMeaning: a machine that clears the air out of a space to leave almost none of it
scope: A machine that clears the air out of a space to leave almost none of it, also called a condensation
  pump, and not a pump that moves water or air through a house.
examples:
- The lab fitted a diffusion pump to clear the air from the chamber.
- A diffusion pump ran all night to keep the vacuum high.
