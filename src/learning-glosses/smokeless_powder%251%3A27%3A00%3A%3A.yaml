simpleMeaning: A bursting charge, sold as Ballistite, that burns with little haze, made with pyrocellulose,
  a treated plant fibre, and used to drive a shot out
scope: A bursting charge sold as Ballistite that burns with little haze, made with pyrocellulose and used
  to drive a shot out; not a black powder that leaves thick smoke and not a liquid fuel.
examples:
- Smokeless powder drove the bullet from the rifle barrel.
- The gun used smokeless powder, so little haze hung in the air.
