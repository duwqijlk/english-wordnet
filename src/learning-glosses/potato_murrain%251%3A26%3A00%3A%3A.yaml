simpleMeaning: A sickness that spoils the crop of a starchy root vegetable
scope: This is a sickness that spoils the crop of a starchy root vegetable; potato blight, potato disease,
  potato mildew and potato mold are other names for this sense, not a sickness of grain, and not the yellow
  dwarf sickness of the same crop.
examples:
- Potato murrain swept the fields that year.
- Old books tell of potato murrain in hard winters.
