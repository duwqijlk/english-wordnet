simpleMeaning: A person who never got what they had hoped for
scope: A person whose hopes were never met, not a person who failed at one small task and not a person
  with no hopes at all.
examples:
- He died a manque artist, never known beyond his village.
- The manque writer kept his poems in a drawer.
