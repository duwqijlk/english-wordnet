synsetId: 92439180-n
simpleMeaning: a paper given when goods move by two or more kinds of travel
scope: A paper for goods that move by two or more kinds of travel, with multimodal bill of lading as another
  name for this sense, and not a paper for goods that move by one kind of travel only.
examples:
- The combined transport bill of lading covered the trip by road and sea.
- She filed the combined transport bill of lading before the goods left the port.
