simpleMeaning: Between the brain's thin cover and its outer layer lies a net of tiny blood tubes.
scope: This net of tiny blood tubes in the brain is also called tomentum cerebri.
examples:
- Blood runs through the tomentum on its way through the brain.
- Blood moves through the tomentum on the surface of the brain.
