simpleMeaning: In law, acting with wild carelessness and putting another person in danger of hurt or death,
  or failing to act with the same result.
scope: Also called criminal negligence; in law, careless action that puts others at risk, not an accident
  and not a deliberate attack.
examples:
- His culpable negligence put the workers in danger.
- The court found her guilty of culpable negligence.
