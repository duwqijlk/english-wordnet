simpleMeaning: In the Roman Catholic Church, the person in charge of the College of Cardinals, a group
  of high-ranking church leaders.
scope: This is the church sense, the head of the College of Cardinals, not a dean in charge of a university
  school or a church building.
examples:
- The dean of the College of Cardinals led the meeting.
- After the pope died, the dean called the cardinals together.
