simpleMeaning: The outer cover of an air-filled wheel is forced onto its steel rim with this hand tool,
  shaped like a bar.
scope: Also called a tire tool, it is the bar-shaped hand tool for forcing a wheel's outer cover onto
  its steel rim.
examples:
- They used a tire iron to force the cover onto the wheel.
- With a tire iron, the cover went onto the wheel.
