simpleMeaning: A stand with hooks for hanging outer clothes and hats for a short while.
scope: This is a stand with hooks for hanging outer clothes and hats for a short while; coatrack and hatrack
  are other names for it, not a wardrobe and not a single hook on a wall.
examples:
- We hung our coats on the coat rack by the door.
- The coat rack by the door held hats as well as coats.
