simpleMeaning: All people know, or one special field, is set out in pieces on many subjects, often in
  A-to-Z order, in a book of facts often in several books.
scope: Also called encyclopedia, encyclopaedia, and cyclopedia, this is a book of facts covering all human
  knowledge or one special field.
examples:
- She looked up the word in the cyclopaedia.
- The cyclopaedia sat in three thick books on the shelf.
