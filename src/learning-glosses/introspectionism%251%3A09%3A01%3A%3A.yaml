simpleMeaning: the view that the study of the mind must rest above all on looking at one's own thoughts
  and feelings
scope: The view that the study of the mind must rest above all on looking at one's own thoughts and feelings;
  not the study of outward acts and not the study of the brain.
examples:
- Introspectionism held that looking inward was the main way to ground psychology.
- By the 1930s introspectionism had fallen out of favour.
