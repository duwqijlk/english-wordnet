simpleMeaning: A strainer made of a thin skin of collodion, cellulose acetate, or other stuff, sold in
  many set hole sizes, the smallest of which can hold back all known viruses.
scope: 'In the laboratory: a thin-skin strainer whose smallest holes hold back viruses.'
examples:
- Membrane filters trap tiny viruses.
- The membrane filter holds back viruses.
