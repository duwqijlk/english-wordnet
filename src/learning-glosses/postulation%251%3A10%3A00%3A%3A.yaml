simpleMeaning: In logic, a clear claim that needs no proof and can be used as a first step in an argument
scope: Also called predication, in logic this is a clear claim that needs no proof, not a fact shown by
  proof and not a guess.
examples:
- He began his proof with the postulation that a straight line can be drawn between two points.
- The postulation was so clear that no one asked him to prove it before he used it in his argument.
