simpleMeaning: A spur of the cheekbone joins a spur of the bone at the side of the skull to form this
  thin curved bone of the cheek.
scope: Also called arcus zygomaticus and zygomatic arch, this thin curved bone of the cheek bridges to
  the bone at the side of the skull.
examples:
- He felt the zygoma along his cheek.
- He broke his zygoma.
