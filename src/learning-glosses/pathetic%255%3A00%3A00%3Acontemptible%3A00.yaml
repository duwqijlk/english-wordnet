schema: oewn-learning-gloss-v2
senseId: pathetic%5:00:00:contemptible:00
synsetId: 00908403-s
simpleMeaning: making people feel sorry for someone or something and also think it is bad and worth very
  little
scope: 'Also called pitiful: this sense mixes pity with a low view of a person or thing. Not the sense
  that brings only pity, and not the sense that brings pity with scorn.'
examples:
- Their pathetic try at fixing the car made it worse, and I felt sorry for them.
- It was a pathetic show, so poor that people felt both pity and no respect for it.
