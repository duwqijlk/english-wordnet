simpleMeaning: a muscle that is wrongly tightened up and stays tight, most often for good
scope: A muscle that stays tight when it should not; not a short cramp and not a muscle that moves as
  it should.
examples:
- The contracture in his hand kept his fingers bent.
- After the burn, a contracture left her arm hard to straighten.
