simpleMeaning: A cage bird kept by many people, from the islands it is named for and the Azores, most
  often yellow, known for its song
scope: A cage bird from the Canary Islands and Azores, most often yellow, liked for its song; not a wild
  bird of the woods and not a bird kept for its looks alone.
examples:
- The common canary sang in its cage each morning.
- Her common canary was yellow and sang sweetly.
