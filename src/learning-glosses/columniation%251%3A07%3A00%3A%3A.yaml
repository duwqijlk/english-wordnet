simpleMeaning: In building, the way tall posts are placed in a building, most of all posts that stand
  free
scope: The way tall posts are placed in a building, most of all free-standing posts; not the posts themselves
  and not the plan of the rooms.
examples:
- The columniation of the hall pleased the architect.
- He studied the columniation of the old temple.
