simpleMeaning: A smooth spokesperson who can turn any criticism into an advantage for the employer.
scope: 'Also called a flack, a flak, and a flak catcher: a smooth talker who speaks for an employer and
  turns bad words into something good for them, not a reporter and not a lawyer.'
examples:
- The flack catcher answered every hard question with a smile.
- When the scandal broke, the flack catcher went to work for the mayor.
