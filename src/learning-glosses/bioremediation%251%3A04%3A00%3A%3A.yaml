simpleMeaning: Tiny living things, such as germs, break down the harmful stuff in waste or pollutants,
  and so clean it up.
scope: It is the cleaning of waste or pollutants by tiny living things that break down the harmful stuff.
examples:
- The waste was cleaned up by bioremediation.
- The waste was broken down by bioremediation.
