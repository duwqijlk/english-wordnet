simpleMeaning: A charge made to a person who borrows money, especially for a mortgage loan, to pay for
  starting the loan
scope: A charge for starting a loan, not a death plan and not a yearly cost for cover.
examples:
- The bank added an origination fee to the home loan.
- Her origination fee covered the cost of setting up the loan.
