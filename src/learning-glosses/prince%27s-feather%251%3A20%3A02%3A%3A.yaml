simpleMeaning: A tall, showy annual from tropical America, with hairy stems, deep purple-flushed leaves
  and long spikes of usually red flowers; people often eat its seeds as a cereal.
scope: Another name for the tall grain plant also called purple amaranth; not the other prince's-feather,
  an Asian annual with drooping crimson spikes that has naturalized in North America.
examples:
- The prince's-feather by the wall carried long spikes of red flowers above purple-washed leaves.
- He sowed prince's-feather for its seed, which is often eaten as a cereal.
