simpleMeaning: On this common North American anemone, a kind of flowering plant, the fruit grows in long
  round bunches shaped like the small cups worn on a finger when sewing.
scope: Among the anemones of North America, this one is told by its fruit, which grows in long round bunches
  like the small cups worn on a finger when sewing.
examples:
- We saw thimbleweed with its long round fruit bunches.
- A patch of thimbleweed grew nearby.
