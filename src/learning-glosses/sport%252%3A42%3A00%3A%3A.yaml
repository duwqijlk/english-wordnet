simpleMeaning: to wear or show off something in a proud, attention-seeking way.
scope: This is not to take part in a game or to play around, and not to be a paid athlete; it means to
  wear or display something proudly so that others notice it.
examples:
- He was sporting a bright new watch.
- She sported a huge hat at the wedding.
