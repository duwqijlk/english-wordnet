simpleMeaning: the way money of one country is changed into money of another country, so people can buy
  and sell things across borders
scope: A way of changing one country's money into another's, not the money itself and not a single trade
  between two people.
examples:
- The bank handles foreign exchange for travellers.
- Foreign exchange lets firms pay sellers in other countries.
