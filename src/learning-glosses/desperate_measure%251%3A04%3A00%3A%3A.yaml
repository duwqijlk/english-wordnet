senseId: 'desperate_measure%1:04:00::'
synsetId: 00179974-n
simpleMeaning: a risky act done as a last way to reach an end when nothing else works
scope: It is an act done because there is no better way left, not an ordinary step taken in good time,
  and not a wild act done with no end in mind.
examples:
- They took desperate measures to keep the ship afloat.
- Borrowing from friends was a desperate measure, but it worked.
