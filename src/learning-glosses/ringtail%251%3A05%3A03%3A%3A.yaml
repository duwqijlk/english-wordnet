simpleMeaning: Known for the black and white bands on its long bushy rear part, this mammal of Mexico
  and the southwestern United States eats all kinds of food, like a raccoon.
scope: Also called bassarisk, cacomistle, cacomixle, civet cat, coon cat, miner's cat, raccoon fox, and
  ring-tailed cat, this is a mammal of Mexico and the southwest, not the monkey of Central and South America.
examples:
- We saw a ringtail moving among the rocks.
- A ringtail came into the yard looking for food.
