simpleMeaning: in a way that shines strongly or gives off much light
scope: This is the adverb for how something shines, not the adjective for a shiny surface, a strong light,
  or a cheerful mood.
examples:
- The stars shone bright in the clear winter sky.
- The windows glowed bright against the dark street.
