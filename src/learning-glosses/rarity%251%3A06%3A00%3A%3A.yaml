simpleMeaning: a strange thing that is not common, and that may be good enough for people to collect
scope: 'Also called curiosity, oddity, curio, peculiarity and oddment: this is a thing that is not common,
  not the quality of being not common.'
examples:
- The hand-made toy is a rarity that many people want to collect.
- She kept the old stamp because it was a rarity.
