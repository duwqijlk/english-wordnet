simpleMeaning: an animal born with no natural colour in its body
scope: An animal born with no colour in its body; not a person with the same condition, and not the word
  for having that condition.
examples:
- The albino rabbit had white fur and pink eyes.
- We saw an albino deer standing in the snow.
