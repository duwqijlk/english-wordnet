simpleMeaning: one of four or five pairs of arteries from the main artery of the belly, feeding the lower
  back bones, the back muscles, and the wall of the belly
scope: 'Another name for the lumbar artery: one of four or five pairs feeding the lower back bones and
  muscles, not the arteries of the chest.'
examples:
- The arteria lumbalis feeds the muscles of the lower back.
- Each arteria lumbalis comes off the main artery of the belly.
