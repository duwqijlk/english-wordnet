simpleMeaning: A short, strong burst of wind that comes up all at once, often with rain or snow falling
  too
scope: A sudden burst of strong wind, often with rain or snow, not a loud cry and not the act of blowing
  in such a wind.
examples:
- A squall tore across the lake and soaked the sailors.
- The squall hit without warning and sent the tents flying.
