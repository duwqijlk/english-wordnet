simpleMeaning: This man-made thread is made mostly from a kind of plastic; it dries fast and springs back
  into shape after being stretched or squeezed.
scope: Unlike a thread that comes from a plant or an animal, this man-made thread dries fast and springs
  back into shape.
examples:
- This jacket is made of polyester fiber, and it dries fast.
- Polyester fiber springs back into shape after it is pulled.
