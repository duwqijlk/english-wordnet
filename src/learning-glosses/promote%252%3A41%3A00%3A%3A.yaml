simpleMeaning: to give someone a higher job or rank than the one they have now
scope: This is about moving a worker up to a higher job; it is not about a chess pawn or a checker piece
  being changed for a better piece in a game.
examples:
- She was promoted to manager after five years at the shop.
- The company promoted him to a higher job in the main office.
