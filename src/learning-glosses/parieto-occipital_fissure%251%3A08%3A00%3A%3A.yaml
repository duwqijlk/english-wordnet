simpleMeaning: Between the upper side part and the back part of the brain, a groove runs near the back
  end of each half.
scope: 'Also called parieto-occipital sulcus: a groove in the brain between the upper side part and the
  back part.'
examples:
- The parieto-occipital fissure marks the edge of the back part of the brain.
- A scan showed the parieto-occipital fissure near the back of each half of the brain.
