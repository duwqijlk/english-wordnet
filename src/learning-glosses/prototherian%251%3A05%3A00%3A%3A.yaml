simpleMeaning: early kinds of furred animals that lay eggs, found only in Australia, Tasmania and New
  Guinea
scope: Early kinds of furred animals that lay eggs, found only in Australia, Tasmania and New Guinea;
  not furred animals that bear live young, and not egg-laying birds.
examples:
- The platypus is a prototherian, a mammal that lays eggs.
- Prototherians live only in Australia, Tasmania and New Guinea.
