  ground, then drops them until the rope stops the fall with a jerk'
scope: 'Also called strapado: a form of torture, not a punishment by whipping and not a hanging.'
examples:
- The strappado left the prisoner's shoulders wrenched.
- They threatened him with the strappado if he would not talk.
