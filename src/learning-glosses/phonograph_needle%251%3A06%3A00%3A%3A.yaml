simpleMeaning: Following the cut line in a music record, this small pointed part used to make the sound
scope: 'Also called a needle: a small pointed part that made sound from a record, not a sewing needle
  and not the arm that holds it.'
examples:
- The phonograph needle was worn, so the music sounded faint.
- He changed the phonograph needle before playing the old record.
