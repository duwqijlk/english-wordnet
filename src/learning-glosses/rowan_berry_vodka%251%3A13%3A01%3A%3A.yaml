simpleMeaning: A strong drink comes from soaking the fruit of the mountain ash tree, with natural caramel,
  drink got from wine, and drink got from fruit added.
scope: It is also called rowan vodka and rowanberry vodka, and it is a strong drink made from a soak of
  mountain ash fruit, not a plain vodka.
examples:
- This rowan berry vodka goes well with game.
- A glass of rowan berry vodka is a strong drink.
