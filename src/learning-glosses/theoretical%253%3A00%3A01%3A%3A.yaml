simpleMeaning: about ideas and the reasons things may be so, not about how to use them in real life
scope: About ideas rather than what works in real life, not what is based on things seen and done.
examples:
- Theoretical physics deals with ideas rather than with things you can touch.
- His answer was theoretical and did not tell us what to do.
