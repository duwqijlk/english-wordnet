simpleMeaning: This slow plant creeps along bare ground to cover it, with leaves that stay green through
  part of the winter on stiff thin stems.
scope: This is also called bishop's hat, the slow, creeping plant grown to cover bare ground.
examples:
- The barrenwort spread slowly across the bare ground.
- The barrenwort kept some green leaves through the winter.
