simpleMeaning: In the Roman Catholic Church, someone who puts forward or speaks for a person put forward
  to be named blessed or a saint
scope: In the Roman Catholic Church, someone who puts forward or speaks for a person put forward to be
  named blessed or a saint; not a priest who hears confession and not the person put forward.
examples:
- The postulator gathered proof of the nun's holy life.
- A postulator speaks for the candidate before the Church.
