simpleMeaning: How ready something is after it has been got ready for use or for action, most of all for
  military action
scope: 'Also called preparation: this is the state of being ready for use or action, especially for soldiers,
  not the work done to get something ready.'
examples:
- The army's preparedness was tested in a large exercise.
- Good preparedness helped the town act fast when the flood came.
