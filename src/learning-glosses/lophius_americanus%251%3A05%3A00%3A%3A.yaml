simpleMeaning: Fishes with wide mouths and a thin worm-like thread that draws in prey.
scope: Fishes with wide mouths that lure prey with a thread, also called anglerfish, angler, monkfish,
  allmouth, angler fish, goosefish and lotte; not a shark and not a cod.
examples:
- Lophius americanus waits on the sea floor with its mouth open.
- The thread of Lophius americanus draws small fish close to its mouth.
