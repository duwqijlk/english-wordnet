simpleMeaning: The grease that lines the belly and kidneys of a pig, used to make lard
scope: The fat around a pig's belly and kidneys; leaf lard is another name for this sense, not the lard
  made from it and not fat from another part of the pig.
examples:
- The butcher trimmed the leaf fat from around the pig's kidneys.
- Leaf fat makes the finest lard for pastry.
