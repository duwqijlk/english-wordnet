simpleMeaning: a bitter chemical (an alkaloid, a natural chemical in plants) taken from the bark of the
  chinchona tree and used to treat malaria
scope: This is the bitter drug taken from chinchona bark and used for malaria; it is not the tree itself
  and not the illness.
examples:
- The doctor gave him quinine for his malaria.
- Quinine tastes very bitter, but it can help treat malaria.
