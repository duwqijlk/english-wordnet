senseId: 'clotting_time%1:28:00::'
synsetId: 15322163-n
simpleMeaning: The length of wait for a small amount of blood to turn thick and firm; doctors use it to
  find some sicknesses in how blood thickens.
scope: This is how long blood takes to turn thick and firm, a test doctors use to find some sicknesses
  in how blood thickens; not the thickening itself and not a test of how fast blood moves.
examples:
- The nurse wrote down the clotting time for the blood sample.
- A long clotting time can point to a sickness that keeps blood thin.
