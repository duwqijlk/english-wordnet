simpleMeaning: A tree that keeps its leaves through the year, from the Caucasus and Asia Minor, grown
  for show, with small branches that hang down.
scope: Also called oriental spruce; a tree of the Caucasus and Asia Minor grown for show, set apart from
  other evergreens by its small hanging branches.
examples:
- Picea orientalis shaded the garden all winter.
- The Picea orientalis had small branches that hung down.
