simpleMeaning: In nautical use, the distance a sailing boat covers on one tack, sailing with the wind
  on one side.
scope: This is a sailing distance run before changing course, not a general stage of a journey, and not
  the part of a pair of trousers.
examples:
- We covered the last leg to the harbour on a single tack.
- The yacht ran the whole leg with the wind on her port side.
