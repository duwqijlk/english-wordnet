senseId: 'lappet%1:08:00::'
synsetId: 05479079-n
simpleMeaning: A fleshy, wrinkled fold of skin, often brightly colored, that hangs from the neck or throat
  of some birds, such as chickens and turkeys, or of lizards.
scope: A fleshy fold on a bird or lizard; wattle is another name for this sense, not the flap of cloth
  on a garment or the lappet moth.
examples:
- The turkey's lappet hung from its throat, wrinkled and brightly colored.
- A lizard's lappet is a fold of skin on the neck or throat.
