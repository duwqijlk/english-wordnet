simpleMeaning: A gas that gives off rays, made when radium breaks down; the heaviest of the still gases,
  found in the ground, above all over granite, and a risk to health.
scope: This is the heavy gas made when radium breaks down, also called radon and atomic number 86, not
  a safe gas or a man-made one.
examples:
- Rn seeps from the ground over granite rock.
- Tests found Rn in the cellar, a risk to health.
