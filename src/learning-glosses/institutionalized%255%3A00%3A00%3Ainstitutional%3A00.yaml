senseId: institutionalized%5:00:00:institutional:00
synsetId: 01234242-s
simpleMeaning: having the form of a set organization, or made part of a system with a set order that is
  usually firmly in place
scope: 'Also called institutionalised: this describes a practice or system made part of a set order, not
  a person sent by an official decision to live in a hospital or care home.'
examples:
- Bribery had become institutionalized, a fixed part of how the office worked.
- Over many years, the custom became institutionalized in the school system.
