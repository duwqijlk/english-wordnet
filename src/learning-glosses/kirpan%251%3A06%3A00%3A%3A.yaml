simpleMeaning: A ceremonial curved dagger four inches long that Sikh men and women must wear at all times.
scope: This is a ceremonial curved dagger four inches long that Sikh men and women must wear at all times,
  not an ordinary dagger and not a sword.
examples:
- He wore his kirpan at all times, as his faith requires.
- The kirpan is a small ceremonial dagger worn by Sikhs.
