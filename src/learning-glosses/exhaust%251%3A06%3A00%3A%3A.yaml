simpleMeaning: the parts of an engine that burned gases or steam go through and out of
scope: This is the set of parts in an engine that burned gases or steam pass through; it is not the gases
  or steam themselves.
examples:
- The car's exhaust was broken, so the engine made a loud noise.
- Steam came out through the exhaust of the old train engine.
