simpleMeaning: the hard covering at the end of an animal's leg, divided into two parts at its tip, as
  on cattle or swine
scope: The hard covering at an animal's leg end, divided in two at its tip, as on cattle or swine; cloven
  foot is another name for this, not a single undivided covering and not a soft paw.
examples:
- The cow's cloven hoof sank into the soft ground.
- A cloven hoof has two parts at the tip.
