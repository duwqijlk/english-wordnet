simpleMeaning: A building or office where telephone lines are joined so that calls can get through.
scope: This is the place where telephone lines are connected, not a hall where goods are bought and sold,
  and not the act of swapping one thing for another.
examples:
- The old telephone exchange on the corner is now a block of flats.
- Engineers rewired the exchange so that calls could be routed to the new district.
