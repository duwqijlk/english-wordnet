simpleMeaning: a fire set on purpose to slow a coming forest fire or grass fire by burning an area clear
  in its way
scope: This is the fire itself, set to stop a wild fire, not the loud noise from an engine, not the act
  of setting such a fire, and not a plan that goes wrong.
examples:
- Firefighters set a backfire to slow the forest fire before it reached the town.
- The backfire burned a wide strip, so the main fire had nothing left to burn.
