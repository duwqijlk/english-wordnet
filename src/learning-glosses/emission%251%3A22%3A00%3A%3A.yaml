simpleMeaning: the sending out of electrons (very small parts that move around inside atoms) from the
  atoms they belong to
scope: Small parts leaving atoms; not the general act of sending something out, and not a way substances
  leave the body.
examples:
- Heat caused the emission of electrons from the metal.
- The emission of electrons grew stronger as the wire got hotter.
