senseId: 'piano_reduction%1:10:01::'
synsetId: 92445275-n
simpleMeaning: Written music for the keys that keeps only the main parts of a piece first made for other
  instruments, set out on two lines.
scope: It is also called piano transcription, and it is not the full written music for many instruments,
  but the main parts set out for the keys.
examples:
- The piano reduction lets one player play the main parts of the piece.
- She practised the main parts from the piano reduction.
