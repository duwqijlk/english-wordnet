simpleMeaning: In music, playing a string instrument with the bow bouncing lightly off the strings
scope: Playing a string instrument so the bow bounces lightly off the strings, also called spiccato; not
  a smooth stroke that stays on the strings, and not plucking the strings.
examples:
- He used spiccato bowing for the lively dance tune.
- Spiccato bowing makes each note short because the bow leaves the strings.
