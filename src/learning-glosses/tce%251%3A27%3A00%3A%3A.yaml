simpleMeaning: A heavy colourless liquid that is very poisonous, used to clean parts in electric machines
  and to dry-clean clothes and kill bugs; it causes cancer and harms liver and lungs.
scope: A heavy colourless liquid that is very poisonous, also called trichloroethane and trichloroethylene,
  used to clean parts in electric machines and to dry-clean clothes.
examples:
- TCE is used to clean parts in electric machines in the factory.
- Workers must be careful with TCE because it is very poisonous.
