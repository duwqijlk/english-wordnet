simpleMeaning: praise you have earned for an achievement, used in the phrase ‘to your …’
scope: This is praise for an achievement, not an academic course unit or a lender's trust in repayment.
examples:
- Winning the scholarship was greatly to her credit.
- It is to his credit that he admitted the mistake at once.
