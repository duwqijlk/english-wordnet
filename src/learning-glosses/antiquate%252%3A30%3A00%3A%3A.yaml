simpleMeaning: to make something look as if it was made long ago
scope: 'Another name for this sense is antique, used as a verb: making a thing look as if made long ago,
  not making a thing truly old.'
examples:
- He antiquated the new wooden box so it would look as if it came from an old house.
- They antiquate the paper by making it yellow and rough at the edges.
