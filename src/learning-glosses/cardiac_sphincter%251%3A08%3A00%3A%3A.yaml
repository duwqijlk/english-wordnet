simpleMeaning: Where the food pipe joins the stomach, a ring of muscle works as a valve at the lower end
  of the pipe.
scope: The ring of muscle where the food pipe joins the stomach, not the ring where the stomach joins
  the gut.
examples:
- Food passes through the cardiac sphincter into the stomach.
- The cardiac sphincter sits where the food pipe meets the stomach.
