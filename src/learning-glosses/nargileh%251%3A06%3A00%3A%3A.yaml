simpleMeaning: A long bendy tube joins a pot of water, which cools the smoke, to a tobacco pipe from the
  East.
scope: People call this Eastern tobacco pipe narghile, hookah, shisha, calean, chicha, hubble-bubble,
  hubbly-bubbly, kalian, sheesha or water pipe, and its smoke is cooled by passing through water in a
  pot.
examples:
- She drew on the nargileh and the smoke came through the water.
- The nargileh's smoke passed through water before it reached her.
