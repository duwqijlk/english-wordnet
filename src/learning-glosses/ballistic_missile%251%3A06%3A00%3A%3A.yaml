simpleMeaning: A flying weapon that is steered at the start of its flight but drops on its own as it nears
  what it is aimed at
scope: A flying weapon steered only at the start of its flight, not one steered all the way to its mark
  and not a bomb dropped from a plane.
examples:
- The ballistic missile was launched at dawn.
- A ballistic missile fell freely onto the target area.
