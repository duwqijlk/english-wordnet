simpleMeaning: the words and talk around a word or part of a text that help a reader work out what it
  means
scope: The words and talk around a word or part of a text that help a reader work out what it means, not
  the words themselves and not the place where the words were said; context and linguistic context are
  other names for this sense.
examples:
- The context of use shows that 'bank' here means the side of a river.
- Without its context of use, the phrase could mean two different things.
