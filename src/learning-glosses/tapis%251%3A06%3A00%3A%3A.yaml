simpleMeaning: A heavy woven cloth with a set pattern, made to hang as curtains and cover seats.
scope: This sense is also called a tapestry, for a heavy woven cloth with a set pattern, made to hang
  as curtains and cover seats, where a tapestry is a heavy cloth with a woven-in design, for curtains
  and chair and seat covers.
examples:
- The tapis hung on the wall, heavy with its woven design.
- Tapestries and tapis cover the chairs in the hall.
