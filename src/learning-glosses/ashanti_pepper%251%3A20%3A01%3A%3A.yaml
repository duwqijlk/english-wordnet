simpleMeaning: The dried fruit of the Piper guineense plant yields this spice, very similar to cubeb pepper,
  though much less bitter and with a fresher, more herbaceous flavour.
scope: This is the spice obtained from the dried fruit of Piper guineense, not the plant or its fresh
  fruit. Its nearest counterpart is cubeb pepper, a separate spice that it closely resembles but is much
  less bitter than.
examples:
- Even in West Africa, Ashanti pepper is an expensive spice and is used sparingly.
- He sprinkled a little Ashanti pepper over the roasted vegetables.
