simpleMeaning: Leaves and bark that smell strong mark this shrub of the eastern United States, which drops
  its leaves each year and bears yellow flowers and then scarlet or yellow berries.
scope: Also called spicebush, it is the eastern shrub whose leaves and bark smell strong and whose yellow
  flowers give way to scarlet or yellow berries.
examples:
- The spice bush was easy to know by the strong smell of its leaves and bark.
- Yellow flowers on the spice bush gave way to scarlet berries.
