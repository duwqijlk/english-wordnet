simpleMeaning: Grains eaten as food, left as they grew or, more often, with the outer skin rubbed off
scope: Grains eaten as food, most often polished, not the grass plant they grow on and not the act of
  pushing food through a sieve.
examples:
- We had rice with the fish for supper.
- She cooked a pot of rice for the family.
