simpleMeaning: tree sap dug from the ground that is part way to turning into stone
scope: Tree sap dug from the ground that is part way to turning into stone; copaline and fossil copal
  are other names for this sense, not fresh sap and not stone all the way through.
examples:
- Copalite from the old mine was hard and brown.
- She held a piece of copalite dug from the clay.
