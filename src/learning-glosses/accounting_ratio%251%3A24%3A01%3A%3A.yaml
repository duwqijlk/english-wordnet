simpleMeaning: A number that shows how two chosen money figures from a firm's money reports compare with
  each other.
scope: Financial ratio is another name for this sense, not a single money figure and not a firm's total
  profit.
examples:
- The accounting ratio showed debt twice the firm's cash.
- She worked out the accounting ratio from the yearly reports.
