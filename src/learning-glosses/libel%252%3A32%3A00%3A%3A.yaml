simpleMeaning: to print untrue words about a person that hurt their good name
scope: This is the verb for printing false words that hurt a person, not the noun for the printed words
  themselves and not a court paper about such harm.
examples:
- The newspaper libeled him by printing lies about his work.
- She said the magazine had libeled her in its front-page story.
