simpleMeaning: a wooden frame on a post with holes for the wrists and neck, used to punish people; a person
  locked in it was shown to public scorn
scope: The wooden punishment frame itself, in which a person's wrists and neck were locked in public;
  not the verb senses of pillory, to attack with harsh words or to make fun of someone in public.
examples:
- The thief was locked in the pillory in the town square.
- Old paintings show a man standing in a pillory while the crowd laughed at him.
