simpleMeaning: an opening part at the start of a law or a constitution (a country's basic set of laws),
  usually telling why it was made
scope: The opening written part of a law or a constitution, not the act of giving an opening introduction
  to a formal paper.
examples:
- The preamble to the constitution says why the law was made.
- He read the preamble before he read the main text of the law.
