simpleMeaning: A small round ball, smooth and shiny, that forms inside the shell of a clam or oyster and
  is prized as a jewel
scope: The jewel that grows inside a shell, not the pale white colour and not the act of gathering pearls.
examples:
- The necklace was made of real pearls.
- She found a pearl inside the oyster shell.
