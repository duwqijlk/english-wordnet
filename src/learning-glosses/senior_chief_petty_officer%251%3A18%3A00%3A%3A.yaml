simpleMeaning: a high-ranking sailor in the Navy or Coast Guard whose rank is like that of a master sergeant
  in the Army
scope: This is a high rank for a sailor in the Navy or Coast Guard, like a master sergeant in the Army;
  not a commissioned officer and not a lower rank.
examples:
- The senior chief petty officer inspected the crew before the ship left port.
- She was promoted to senior chief petty officer after twenty years of service.
