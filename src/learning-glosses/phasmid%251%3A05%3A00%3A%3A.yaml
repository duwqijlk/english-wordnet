simpleMeaning: Like walking sticks and leaf insects, these big insects eat plants, with long strong legs
  and bodies shaped like a tube or flat, mostly from warm lands.
scope: Also called phasmid insects, these big plant-eaters include walking sticks and leaf insects.
examples:
- The phasmid looked just like a walking stick.
- A phasmid eats plants and walks on long strong legs.
