simpleMeaning: Ships that run into it are blown up by this bomb in the sea
scope: Also called floating mine, this is a bomb in the sea that blows up ships that run into it, not
  a bomb buried on land and not a ship's own weapon.
examples:
- The ship was badly damaged after it struck a marine mine.
- Navy divers cleared the marine mines from the harbour.
