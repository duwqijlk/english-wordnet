simpleMeaning: Only weakly drawn to a magnet, this brownish mineral, FeS, is made of iron and sulfur.
scope: Magnetic pyrites and pyrrhotine are other names for this brownish mineral, whose pull on iron is
  weak.
examples:
- A magnet pulled the pyrrhotite only weakly.
- The pyrrhotite showed only a weak pull when held near a magnet.
