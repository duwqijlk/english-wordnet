simpleMeaning: any tree or bush whose thin bark peels off in strips, one of the Betula group
scope: Also called a birch, this is any tree or bush of the Betula group with bark that peels off.
examples:
- A birch tree stood by the gate, its bark peeling in strips.
- They planted a birch tree in the front yard.
