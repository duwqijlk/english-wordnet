simpleMeaning: an instruction that works in opposite ways each time you use it, turning a thing on the
  first time and off the next time
scope: This sense is an instruction that turns a thing on and then off, not a small switch you move by
  hand and not the act of fastening a thing.
examples:
- 'The program uses a toggle for the sound: one click turns it on and the next click turns it off.'
- Pressing this key sends a toggle that turns the light on the first time and off the next time.
