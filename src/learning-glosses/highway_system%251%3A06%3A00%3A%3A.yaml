simpleMeaning: Cars and lorries get about on the roads of a place, taken together as one network
scope: It is all the roads in a place that cars and lorries use, taken together, not one single road and
  not the railway network.
examples:
- The highway system links every town in the state.
- They drove across the country on the highway system.
