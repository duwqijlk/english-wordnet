schema: oewn-learning-gloss-v2
senseId: obliged%5:00:00:obligated:00
synsetId: 01621043-s
simpleMeaning: having to do something because it is the right thing to do
scope: This sense is about having to do something because it is right; not having to do it because a law
  or a rule says you must.
examples:
- She felt obliged to help her neighbour after all his kindness.
- He felt obliged to tell the truth, even though it was hard.
