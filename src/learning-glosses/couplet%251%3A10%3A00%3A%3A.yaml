simpleMeaning: a part of a poem made of two lines, one after the other, that usually end with words that
  sound the same
scope: This is a two-line part of a poem, not one line alone and not a longer part with three or more
  lines.
examples:
- The poem ends with a couplet about love.
- He wrote a couplet and read the two lines aloud.
