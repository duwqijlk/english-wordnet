simpleMeaning: To use one thing as a stand-in for another that appears to be its equal.
scope: This is using one thing as a substitute for another that seems equal, not replacing one item with
  another of the same category, and not two people handing each other roughly equal things.
examples:
- You can exchange regular milk for fat-free milk in this recipe.
- Someone had exchanged the real diamond for a copy that looked identical.
