simpleMeaning: a soft mineral made of small grains, with a smooth feel like soap; it is a mineral substance,
  magnesium silicate, with water in it, used in many products
scope: 'Also called talc: this is the soft mineral itself, not the powder made from it that people put
  on their skin.'
examples:
- The factory buys talcum to make face powder.
- Talcum feels soft and smooth between your fingers.
