simpleMeaning: a skilled worker who makes wooden barrels or tubs or fixes them when they are broken
scope: 'Also called barrel maker: a person whose work is making or fixing wooden barrels or tubs, not
  a person who makes things from metal.'
examples:
- The cooper made a strong wooden barrel for the farmer.
- We took the broken tub to a cooper to fix it.
