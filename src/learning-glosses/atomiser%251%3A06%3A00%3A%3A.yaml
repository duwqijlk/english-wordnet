simpleMeaning: a device that turns a liquid such as perfume into a fine mist of tiny drops
scope: 'Also called atomizer, nebuliser, nebulizer, spray or sprayer: a device that turns liquid into
  a fine mist, not a pump that pours liquid and not a jar that holds it.'
examples:
- She sprayed perfume from her atomiser.
- He filled the atomiser with water for the plants.
