simpleMeaning: Ease in letdown or woe.
scope: This sense is also called solace, for ease in letdown or woe, where solace is the comfort that
  eases your pain a little when disappointment or deep unhappiness leaves you low, unlike the sense for
  the ease you feel when comforted in times of letdown.
examples:
- Solacement is ease in letdown.
- Solacement eases woe.
