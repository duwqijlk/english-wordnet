simpleMeaning: A small bush with tiny leaves green all year and pink or purple flowers, found on high
  ground and mountain tops in Asia, Europe, and the United States.
scope: This is the small high-ground bush with tiny green leaves and pink or purple flowers, not other
  heaths that grow low down or have white flowers.
examples:
- Mountain heath grows on the high ground above the trees.
- The mountain heath on the summit had pink flowers.
