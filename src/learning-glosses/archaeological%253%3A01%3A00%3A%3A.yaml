simpleMeaning: relating to the study of past people and times through the old things they left behind
scope: 'Also called archeological: this sense is about the study of the past through old things left behind,
  not about present-day life or new buildings.'
examples:
- The team found tools at an archaeological site in the desert.
- She read an archaeological report about the old village.
