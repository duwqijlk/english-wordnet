schema: oewn-learning-gloss-v2
senseId: 'sophistication%1:04:00::'
synsetId: 00754815-n
simpleMeaning: making a false idea seem true by using clever but wrong reasons, and in that way leading
  people to believe what is false
scope: This is making a false idea seem true with clever but wrong reasons. Not the quality of knowing
  the world well, and not one single false argument on its own.
examples:
- Through sophistication, he made a weak and false case sound true.
- The book warns against sophistication that leads people to trust what is false.
