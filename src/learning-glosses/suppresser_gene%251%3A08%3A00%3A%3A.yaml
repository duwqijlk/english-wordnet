simpleMeaning: A gene that holds back what another gene would show in the body, especially a changed (mutant)
  gene.
scope: Suppresser, suppressor, and suppressor gene are other names for a gene that holds back what another
  gene would show.
examples:
- The suppresser gene stopped the other gene from showing its trait.
- A suppresser gene can hide what a mutant gene would show.
