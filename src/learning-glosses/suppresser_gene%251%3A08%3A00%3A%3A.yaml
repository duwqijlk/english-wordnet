simpleMeaning: What one bit of living stuff would show in the body is held back by another bit, above
  all when the first bit has changed from its usual form.
scope: Suppresser, suppressor, and suppressor gene are other names for this bit of living stuff that holds
  back what another bit would show in the body.
examples:
- The suppresser gene stopped the other gene from showing its trait.
- A suppresser gene can hide what a mutant gene would show.
