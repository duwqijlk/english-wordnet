simpleMeaning: Air held back at the voice box bursts out in a sharp pop to make this speech sound, heard
  in some languages such as Hausa.
scope: Ejective is another name for this speech sound in some languages, such as Hausa, made by letting
  out air held back at the voice box.
examples:
- The ejective consonant in Hausa is made with a sharp pop of air.
- He found the ejective consonant hard to say at first.
