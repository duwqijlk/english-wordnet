simpleMeaning: For washing clothes, this watery mix has stuff in it that takes the colour out of things
scope: A watery mix that takes the colour out of things, used for washing clothes, not a powder for the
  wash and not a soap on its own.
examples:
- She added liquid bleach to the wash to whiten the sheets.
- Do not mix liquid bleach with other cleaners.
