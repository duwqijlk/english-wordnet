simpleMeaning: A digestive hormone that prompts the pancreas and bile ducts to release water and bicarbonate,
  which neutralizes acid, when the stomach sends too much acid into the small intestine.
scope: A hormone of the digestive system that signals the pancreas and bile ducts, not a digestive enzyme
  or a juice.
examples:
- Secretin is released when too much acid enters the small intestine from the stomach.
- Doctors measured secretin levels to see how the pancreas responded.
