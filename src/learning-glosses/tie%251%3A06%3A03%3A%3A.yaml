simpleMeaning: One of the beams laid across a railway track to hold and support the rails.
scope: This is the beam beneath railway rails, not the horizontal beam that keeps two structural parts
  from spreading and not a general fastener for joining things.
examples:
- Workers replaced the wooden ties along the track.
- The train rattled over every tie on the bridge.
