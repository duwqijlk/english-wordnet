simpleMeaning: a formal written note that says what a person has done well and gives praise for it
scope: This is a formal written note that praises a person's good work; congratulatory letter is another
  name for this sense, not a casual note and not a note that asks for something.
examples:
- She got a congratulations letter from the school for her top marks.
- The mayor sent him a congratulations letter after the award.
