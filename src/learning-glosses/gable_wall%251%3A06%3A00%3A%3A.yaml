simpleMeaning: The upright three-sided part at one end of a house, between the two sloping sides of the
  roof.
scope: This is the upright three-sided wall at one side of a house, also called a gable or a gable end;
  not the roof itself, and not a chimney.
examples:
- The gable wall of the old house faced the road.
- They put a small round window in the gable wall.
