simpleMeaning: A plant of Europe, it spreads fast on stems that creep under the ground, and it now grows
  in North America as a weed.
scope: Also called couch grass, dog grass, quack grass, quackgrass, quick grass, and witch grass, this
  is a fast-spreading plant of Europe, not the North American kind with slender brushy flower heads.
examples:
- Witchgrass spreads fast by stems that creep under the ground.
- Witchgrass grows in North America as a weed.
