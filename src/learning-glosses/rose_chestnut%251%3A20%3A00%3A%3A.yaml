simpleMeaning: An attractive evergreen tree from the East Indies, often planted as an ornamental for its
  fragrant white flowers, which yield perfume; its very heavy timber is used for railway ties.
scope: Another name for ironwood and ironwood tree, an East Indian tree planted for ornament whose very
  heavy timber is used for ties; not the sweet chestnut or the horse chestnut.
examples:
- The rose chestnut was planted along the drive for its fragrant white flowers.
- Workers cut the rose chestnut and used its heavy timber for railway ties.
