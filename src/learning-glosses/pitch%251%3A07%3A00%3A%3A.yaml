simpleMeaning: whether a sound is high or low, which changes with how many times a second the thing making
  it shakes back and forth
scope: This is about how high or low a sound is, not a throw in baseball and not the dark, thick, sticky
  stuff.
examples:
- The song ends on a high pitch.
- Her voice rose in pitch when she was excited.
