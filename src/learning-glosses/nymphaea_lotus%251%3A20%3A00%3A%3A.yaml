simpleMeaning: A white water flower of Egypt to the south-east of Africa, held holy by the Egyptians
scope: 'Also called lotus, white lily, white lotus, and Egyptian water lily: a white water flower of Egypt
  to the south-east of Africa, held holy by the Egyptians, not the pale yellow water flower of North America
  or the common water flower of still ponds.'
examples:
- The Nymphaea lotus bloomed white on the Nile.
- Egyptians held the Nymphaea lotus holy.
