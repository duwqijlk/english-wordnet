simpleMeaning: A piece of clothing for the upper body, usually worn by women, that reaches from the shoulders
  to the waist or hips.
scope: This is not the highest part of something, not a lid or cover and not a spinning toy; it is a garment
  for the upper body.
examples:
- She wore a silk top with dark trousers.
- The shop sells tops in every color and size.
