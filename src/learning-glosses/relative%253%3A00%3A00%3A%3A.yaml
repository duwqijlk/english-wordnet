simpleMeaning: judged by setting one thing against another, not full or whole in itself
scope: Judged by setting one thing against another, not full or whole in itself, not a person in the same
  family and not a word for things that fit each other in size or amount.
examples:
- His wealth is only relative when set against a king's.
- The two men were relative strangers to each other.
