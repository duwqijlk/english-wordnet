simpleMeaning: in a showy way that looks good on the outside but has little real worth
scope: In a showy, falsely fine way, not in a plain honest way and not in a truly fine way.
examples:
- The boat is meretriciously decorated with gold paint.
- She meretriciously dressed the shop window to catch the eye.
