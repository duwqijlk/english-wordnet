simpleMeaning: A printing way that uses a plate cut with a design, smeared with ink and wiped clean, so
  the ink left in the hollows makes the print.
scope: This sense is also called intaglio and intaglio printing, for a printing way that uses a plate
  cut with a design, smeared with ink and wiped clean, so the ink left in the hollows makes the print.
examples:
- Gravure uses an etched plate.
- The book was printed by gravure.
