simpleMeaning: a small round case filled with dye, a colour that mixes with water, shot at other players
  in a game
scope: The small round ball filled with dye that is shot in the game; not the game itself, where players
  on teams shoot at each other.
examples:
- A paintball hit his jacket and left a bright red mark.
- She put a paintball in the gun before the game started.
