simpleMeaning: A kind of film made to please viewers of many ages, with nothing in it that is wrong for
  young viewers
scope: 'Also called a family film: a kind of film for viewers of many ages, not a film made only for children
  and not a cartoon.'
examples:
- The new family movie was made so both the children and their grandparents would enjoy it.
- She picked a family movie that her six-year-old and her teenage son could both watch.
