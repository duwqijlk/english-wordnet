simpleMeaning: a person in charge of running a firm
scope: A person in charge of running a firm, not a person chosen by a court to share out the estate of
  someone who has died, and not a person who owns the firm.
examples:
- The administrator set the work hours for the staff.
- She became administrator of the small hotel.
