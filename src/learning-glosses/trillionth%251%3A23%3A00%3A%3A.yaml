simpleMeaning: One part of a thing cut into a trillion equal parts.
scope: One part of a trillion equal parts, not the counting word for the place numbered one trillion.
examples:
- A trillionth of the sum would still be a large amount.
- Only a trillionth of the powder was left in the jar.
