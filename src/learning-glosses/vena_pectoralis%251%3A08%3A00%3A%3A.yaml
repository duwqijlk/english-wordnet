simpleMeaning: Into the blood tube under the collarbone flows blood from the chest muscles, through these
  tubes.
scope: Also called pectoral vein, these tubes serve the chest muscles, sending their blood to the tube
  under the collarbone.
examples:
- Blood leaves the chest muscles through the vena pectoralis.
- Blood from the chest flows out through the vena pectoralis into the blood tube under the collarbone.
