simpleMeaning: any cold-blooded animal with a backbone, of the group that takes in tortoises, turtles,
  snakes, lizards, alligators, crocodiles, and animals of that kind now gone
scope: Any cold-blooded animal with a backbone, of the group that takes in tortoises, turtles, snakes,
  lizards, alligators, and crocodiles; reptilian is another name for this sense, not a warm-blooded animal,
  and not a fish.
examples:
- A lizard is a reptile, but a frog is not.
- The reptile basked on the warm rock all afternoon.
