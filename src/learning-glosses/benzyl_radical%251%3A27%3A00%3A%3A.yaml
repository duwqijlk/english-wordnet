simpleMeaning: a group of atoms got from toluene, a clear liquid, that joins on to one other thing through
  one link
scope: 'Also called benzyl and benzyl group: a small group of atoms from toluene, not a whole molecule
  and not a group from a different liquid.'
examples:
- The benzyl radical joined with the acid to form a new salt.
- In the reaction the benzyl radical moved to a new place.
