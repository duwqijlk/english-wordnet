simpleMeaning: The line where the bone at the top of the head meets the bone at the side near the ear
scope: A join between two bones of the skull, not a break in a bone and not a joint that moves.
examples:
- The parietomastoid suture runs along the side of the skull.
- The doctor could see the parietomastoid suture on the X-ray.
