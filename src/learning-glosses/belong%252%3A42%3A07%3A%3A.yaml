simpleMeaning: To be one of the people in a group, organization, or place — as a member, a supporter,
  or someone who lives there.
scope: Membership or residence in a group, organization, or place, not correct classification in a type,
  ownership, or suitability.
examples:
- She belongs to a local running club.
- He belongs to the union at the factory.
