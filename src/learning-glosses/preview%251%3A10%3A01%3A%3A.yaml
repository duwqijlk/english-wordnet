simpleMeaning: a short advertisement made of short scenes from a film that will be shown soon
scope: 'Also called trailer: this is a short advertisement for a film that will be shown soon, not an
  early showing of the whole film for a chosen group.'
examples:
- We watched a preview for the new film before the main film started.
- The preview showed the best scenes from the coming film.
