simpleMeaning: Scarlet or orange betel nuts, each a single seed in a fibrous husk, mark this palm of Southeast
  Asia.
scope: The palm tree that bears betel nuts, not the nuts themselves or the betel leaf chewed with them.
examples:
- The betel palm grows a tall, slender trunk topped with feathery fronds.
- Farmers climb betel palm trees to gather the nuts.
