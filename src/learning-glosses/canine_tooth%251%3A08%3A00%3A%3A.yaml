simpleMeaning: one of four pointed, cone-shaped parts used for biting, two in each jaw, between the flat
  front ones that cut food and the broad back ones that grind it
scope: One of four pointed, cone-shaped parts used for biting, two in each jaw, between the flat front
  ones that cut food and the broad back ones that grind it; canine, cuspid, dogtooth, eye tooth and eyetooth
  are other names for this sense, not a front cutter and not a back grinder.
examples:
- The dog bared a canine tooth in a snarl.
- Her canine tooth ached after the fall.
