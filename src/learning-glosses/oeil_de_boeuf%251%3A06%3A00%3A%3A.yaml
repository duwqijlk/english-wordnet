simpleMeaning: a round or oval window, of the kind used in French buildings of the 1600s and 1700s
scope: A round or oval window of the kind used in French buildings of the 1600s and 1700s; not a square
  window and not a round window of a later time.
examples:
- The oeil de boeuf above the door lets in light.
- An oeil de boeuf window gives the old house a French look.
