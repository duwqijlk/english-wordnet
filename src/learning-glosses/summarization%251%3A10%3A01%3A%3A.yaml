simpleMeaning: What is left when a longer piece of writing is cut down to its main points, said briefly
  and to the point.
scope: Summarisation is another name for what is left when a longer piece of writing is cut down to its
  main points, said briefly and to the point.
examples:
- His summarization of the speech took only a few lines.
- A good summarization leaves out the small details.
