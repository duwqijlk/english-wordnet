simpleMeaning: The act of preparing a summary, stating the main points briefly and succinctly.
scope: Summarisation is another name for this act; it covers both preparing a summary and an instance
  of one.
examples:
- His summarization of the speech took only a few lines.
- A good summarization leaves out the small details.
