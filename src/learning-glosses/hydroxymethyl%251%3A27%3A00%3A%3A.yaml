simpleMeaning: A methyl part in which hydroxide has taken the place of the hydrogen atoms.
scope: A methyl part in which hydroxide has taken the place of the hydrogen atoms, not a plain methyl
  part and not a hydroxyl group.
examples:
- The hydroxymethyl group hangs off the side chain.
- Chemists mark the hydroxymethyl part with -CH2OH.
