simpleMeaning: the point inside a thing where the pull that draws things down seems to act, and where
  its weight seems to act when that pull is even
scope: 'Also called centre of gravity: the point inside a thing where the pull that draws things down
  seems to act, not the middle of the thing and not the center of buoyancy of a ship.'
examples:
- The center of gravity of the box is low, so it does not tip over.
- Raising the load moved the center of gravity of the crane.
