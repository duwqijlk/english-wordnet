simpleMeaning: a power tool for smoothing wood, in which a loop of sandpaper runs at high speed on an
  electric motor
scope: A power tool for smoothing wood, also called a smoother, a sander, and an electric sander; not
  a hand tool for rubbing wood and not a saw for cutting wood.
examples:
- He smoothed the tabletop with a drum sander.
- The drum sander left the floorboards flat and even.
