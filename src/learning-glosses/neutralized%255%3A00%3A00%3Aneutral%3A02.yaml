simpleMeaning: Made even and without a mark of its own, so it takes no side and stands out in no way.
scope: Also called neutralised; made neutral in some way and left with no mark of its own.
examples:
- The neutralized acid no longer burned the skin.
- The neutralized tone of the report showed no favour to either side.
