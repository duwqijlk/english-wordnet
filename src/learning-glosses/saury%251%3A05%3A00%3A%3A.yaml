simpleMeaning: a thin fish with a long beak that lives in the mild waters of the Atlantic
scope: This is a thin fish with a long beak from the mild waters of the Atlantic, also called a billfish;
  not a flat food fish like the saurel and not a fish with a short nose.
examples:
- The saury swam close to the surface of the sea.
- We saw a saury with its long beak in the net.
