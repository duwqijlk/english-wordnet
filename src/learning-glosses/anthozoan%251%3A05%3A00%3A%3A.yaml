simpleMeaning: polyps of the sea, alone or in groups, that never move from one spot and never pass through
  a free-swimming jellyfish stage
scope: 'Also called actinozoan: a sea animal fixed to one spot, not a jellyfish and not a fish.'
examples:
- The anthozoan stayed fixed to the rock all its life.
- Corals are anthozoans, with polyps that never swim free.
