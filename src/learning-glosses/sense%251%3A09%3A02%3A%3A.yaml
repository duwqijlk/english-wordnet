simpleMeaning: One of the powers of the body, such as sight or hearing, by which you take in the world
  around you.
scope: It is a bodily power such as sight or hearing, not the meaning of a word.
examples:
- Dogs have a very keen sense of smell.
- The illness affected his sense of touch.
