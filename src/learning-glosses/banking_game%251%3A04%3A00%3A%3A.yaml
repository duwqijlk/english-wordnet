simpleMeaning: Any play for money in which players bet against the house or the dealer
scope: A play for money in which players bet against the house or the dealer, not a play where players
  bet against each other and not a play with no money at stake.
examples:
- Baccarat is a banking game played against the house.
- In a banking game the dealer takes the bets.
