senseId: 'break%2:30:10::'
synsetId: 00335806-v
simpleMeaning: damage something so badly that it is no longer whole, usually with force, and make it come
  apart into pieces or small bits
scope: This is smashing an object so that it is no longer whole, not a surface split that leaves it in
  one piece or taking off a single part.
examples:
- She broke the vase when she knocked it off the table.
- The hammer broke the stone into several pieces.
