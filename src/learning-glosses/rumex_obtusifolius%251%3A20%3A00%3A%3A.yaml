simpleMeaning: A European dock with broad blunt leaves and a bitter rootstock, common as a weed in North
  America.
scope: Also called bitter dock, broad-leaved dock and yellow dock; a dock with broad blunt leaves and
  a bitter rootstock, not a dock with narrow leaves.
examples:
- The Rumex obtusifolius is common as a weed in North America.
- Rumex obtusifolius has broad blunt leaves.
