simpleMeaning: like a ruler who has all the power and lets no one else decide, with complete control over
  a country
scope: 'Also called authoritarian, autocratic, despotic, dictatorial, and tyrannic: about a ruler or rule
  with all the power, not just about cruel or unjust acts.'
examples:
- The tyrannical king made all the laws himself and let no one question him.
- People lived in fear under the tyrannical government, which held all power.
