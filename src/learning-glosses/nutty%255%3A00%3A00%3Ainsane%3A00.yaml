simpleMeaning: In informal or slang talk, a word for a person whose mind does not work in a normal way
scope: 'Also called cracked, nuts, buggy, bats, crackers, daft, dotty, loopy, fruity, balmy, batty, wacky,
  bonkers, haywire, loony, barmy, loco and kooky: loose, joking words for a mind that is not working in
  the usual way, not a taste like nuts in food.'
examples:
- He went a bit nutty after weeks with very little sleep.
- She acted nutty and talked to herself all day.
