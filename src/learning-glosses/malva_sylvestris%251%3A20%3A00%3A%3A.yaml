simpleMeaning: An Old World long-lived plant that grows upright or lies low, with groups of rosy-purple
  flowers where leaves join the stem, brought to the United States.
scope: 'Also called cheese, cheeseflower, high mallow and tall mallow: an Old World plant with rosy-purple
  flowers where leaves join the stem, not a plant with flowers at the stem tips and not a plant of the
  New World.'
examples:
- Malva sylvestris grew by the wall, its rosy-purple flowers in clusters.
- Malva sylvestris was brought to the United States long ago.
