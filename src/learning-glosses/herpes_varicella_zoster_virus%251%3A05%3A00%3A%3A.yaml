simpleMeaning: A tiny germ that causes chickenpox and the painful skin rash called shingles.
scope: A virus that causes chickenpox and shingles; herpes varicella zoster is another name for this sense,
  and this is not a virus that causes only one of the two sicknesses.
examples:
- Herpes varicella zoster virus causes chickenpox in children and shingles in adults.
- The doctor said herpes varicella zoster virus was behind her shingles.
