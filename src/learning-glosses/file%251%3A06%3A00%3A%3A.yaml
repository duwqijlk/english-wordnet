simpleMeaning: A hand tool made of hard metal, set with tiny cutting ridges and rubbed across wood or
  metal to smooth the surface.
scope: This is the cutting tool itself, not the paper-holding folder or cabinet, and not a line of people
  waiting one behind the other.
examples:
- He ran a file along the edge of the door until it closed without sticking.
- A fine file is best for smoothing small metal parts.
