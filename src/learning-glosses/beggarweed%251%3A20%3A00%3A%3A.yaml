simpleMeaning: A West Indian feed plant grown in the southern United States for animal feed and to make
  the soil better
scope: A West Indian feed plant grown in the southern United States for animal feed and to make the soil
  better, not a wild weed and not a food crop for people.
examples:
- Farmers plant beggarweed to feed their animals and enrich the soil.
- Beggarweed grows well in the warm fields of the southern United States.
