simpleMeaning: In genetics, the traits a child gets from its mother and father by birth.
scope: In genetics, the traits a child gets from its mother and father by birth, not a gift of mind passed
  down from those before, and not land or goods left by law.
examples:
- Her inheritance from her parents showed in her dark eyes.
- The child's inheritance from its parents fixed the colour of its eyes.
