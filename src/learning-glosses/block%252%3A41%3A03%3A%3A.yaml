simpleMeaning: In railroading, to run trains under a signalling system that divides the track into sections
  and lets only one train into each section at a time.
scope: This is the railway verb for working a line under a block signalling system, not the senses meaning
  to stop or obstruct something, to shape something into a solid piece, or to stamp a design on a cover.
examples:
- The branch line is blocked, so only one train may enter each section.
- Signallers block the section ahead before they clear a train to proceed.
