simpleMeaning: The thin skin that lines every hollow part of the body that opens to the outside, making
  mucus as it goes.
scope: Mucosa is another name for this mucus-making lining of every body opening to the outside.
examples:
- The mucous membrane inside the nose makes mucus.
- The mucous membrane of the throat lines the passage to the stomach.
