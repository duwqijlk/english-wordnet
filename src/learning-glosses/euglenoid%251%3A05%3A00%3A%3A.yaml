simpleMeaning: A tiny living thing with a whip-like tail, found in sea and fresh water, green or without
  colour
scope: A tiny living thing with a whip-like tail; euglenid and euglenophyte are other names for this sense,
  not a green plant that stays put and not a fish.
examples:
- The euglenoid swam through the pond water with its tail.
- A euglenoid can be green or without colour.
