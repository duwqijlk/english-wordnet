simpleMeaning: Like a close kind that eats tobacco, this big green caterpillar with white stripes eats
  tomato plants and the food plant it is named for.
scope: Also called tomato hornworm, this big green caterpillar eats tomato and potato plants, not the
  tobacco hornworm, which is a different kind.
examples:
- Potato worms ate the tomato plants.
- The gardener found a potato worm on the tomato plant.
