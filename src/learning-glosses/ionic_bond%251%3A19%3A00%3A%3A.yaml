simpleMeaning: a chemical link in which one atom gives up an electron and gains a plus charge, and the
  other atom gains the electron and a minus charge
scope: 'Also called electrostatic bond and electrovalent bond: a chemical link made when atoms give up
  and gain electrons, not a link in which atoms share electrons.'
examples:
- Table salt forms when sodium and chlorine join by an ionic bond.
- An ionic bond holds the two atoms together by their opposite charges.
