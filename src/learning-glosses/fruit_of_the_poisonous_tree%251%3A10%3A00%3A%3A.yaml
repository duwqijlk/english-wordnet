senseId: 'fruit_of_the_poisonous_tree%1:10:00::'
synsetId: 06667020-n
simpleMeaning: In law, a rule that says proof got by breaking the law can not be used, and neither can
  later proof that comes from it
scope: In law, a rule about proof that can not be used in a case, not a rule about plants and not a rule
  about how proof is found.
examples:
- The judge threw out the gun under the fruit of the poisonous tree rule.
- The lawyer said the fruit of the poisonous tree doctrine kept the second search out of court.
