simpleMeaning: how far something goes, or the level that it reaches
scope: This sense is about how far something goes or the level it reaches. It is not the sense about the
  length, area, or space that something covers.
examples:
- We do not yet know the full extent of the damage.
- To a certain extent, she was right about the plan.
