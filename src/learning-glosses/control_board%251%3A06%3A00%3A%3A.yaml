simpleMeaning: Switches, dials, and meters for running other machines that use power, all set on a flat
  sheet that power cannot pass through
scope: A flat sheet with switches, dials, and meters for running other machines that use power, also called
  a control panel, a board, a panel, and an instrument panel; not a board for writing on or a notice board.
examples:
- She watched the lights on the control board as the machines started up.
- The engineer turned a dial on the control board to slow the pump.
