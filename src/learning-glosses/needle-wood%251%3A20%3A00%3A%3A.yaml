simpleMeaning: This big, bushy shrub from the middle and east of Australia has pointed leaves and flowers
  the colour of cream.
scope: This large, bushy shrub is also called needle wood and needlewood, and it is not a tree.
examples:
- The needle-wood had creamy white flowers.
- A needle-wood grows in central and eastern Australia.
