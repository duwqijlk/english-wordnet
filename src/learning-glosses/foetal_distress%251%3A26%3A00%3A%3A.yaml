simpleMeaning: A bad state of an unborn child, most often found while the mother is with child and shown
  by a heart beat that is not as it should be.
scope: This is a bad state of an unborn child shown by a heart beat that is not as it should be, not a
  sickness of the mother, and it is also called fetal distress.
examples:
- The doctor found foetal distress during the check.
- Foetal distress showed in the baby's heartbeat.
