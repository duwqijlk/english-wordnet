simpleMeaning: The longest straight line through the middle of an oval or an egg-shaped solid, passing
  through its two set points.
scope: The longest line through the middle of an oval, passing through its two set points; not the shortest
  line through the middle and not the edge of the oval.
examples:
- The major axis of the ellipse ran from end to end.
- Draw the major axis through both foci of the oval.
