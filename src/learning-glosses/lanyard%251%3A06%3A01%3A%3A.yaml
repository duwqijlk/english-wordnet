simpleMeaning: a cord worn round the neck, used to hold a knife or a whistle
scope: 'Also called laniard: a cord worn round the neck; it is not the rope used on a ship''s rigging,
  and not the cord with a hook used to fire a cannon.'
examples:
- He wore his whistle on a lanyard round his neck.
- The knife hung from a lanyard so that he would not lose it.
