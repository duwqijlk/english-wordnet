simpleMeaning: To do with old things from long ago.
scope: To do with old things from long ago; not a person who is an expert on old things or collects them,
  and not the sense of having to do with people who study or deal in old things.
examples:
- Their interest was antiquarian, fixed on old coins and books.
- The collection was antiquarian, made up of old things.
