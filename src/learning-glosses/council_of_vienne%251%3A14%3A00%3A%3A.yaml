simpleMeaning: A church meeting in 1311–1313 that dealt with charges against the Knights Templar, planned
  a new crusade, and took on reforming the clergy.
scope: Also called Vienne; a church meeting of 1311–1313 about the Templars, a new crusade and clergy
  reform, not the sixth council of 680–681 or the council of 869.
examples:
- The Council of Vienne met in 1311.
- The Council of Vienne dealt with the Knights Templar.
