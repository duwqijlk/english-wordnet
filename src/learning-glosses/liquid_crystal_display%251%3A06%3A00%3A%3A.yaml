simpleMeaning: Used in computers you can carry, watches, and the like, this flat screen that shows figures
  has tiny fluid cells that throw back more or less light under power.
scope: Among flat screens, it is the one in computers you can carry, watches, and the like, whose tiny
  fluid cells throw back more or less light under power.
examples:
- The liquid crystal display showed the time.
- Her watch had a liquid crystal display.
