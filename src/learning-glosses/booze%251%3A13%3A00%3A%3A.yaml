simpleMeaning: A strong drink made by heating a liquid and cooling the steam back to liquid, not by letting
  it ferment.
scope: A strong drink made by heating a liquid and cooling the steam back to liquid, with spirits and
  liquor as other names for this sense, and not beer or wine, which are made by letting a liquid ferment.
examples:
- He keeps a bottle of booze in the cupboard.
- Too much booze had made him unsteady on his feet.
