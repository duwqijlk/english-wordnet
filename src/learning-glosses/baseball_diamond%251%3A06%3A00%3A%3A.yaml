simpleMeaning: the part of the field for the game with a bat and ball that is shut in by three bases and
  home plate
scope: 'Also called diamond and infield: the part of the field shut in by three bases and home plate,
  not the whole field and not the grass outside the bases.'
examples:
- The pitcher stood on the baseball diamond waiting for the batter.
- They raked the dirt of the baseball diamond before the game.
