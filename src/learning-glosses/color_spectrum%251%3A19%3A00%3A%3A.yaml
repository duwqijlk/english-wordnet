simpleMeaning: the spread of light shades that appear when a beam of light is split by a prism, a clear
  glass block that bends light
scope: This is the spread of shades made when light is split by a glass block, not a single shade of light
  and not a set of paints.
examples:
- The color spectrum on the wall showed red, orange, yellow, green, blue, and violet.
- She held a glass prism up to the sun to show the color spectrum to her class.
