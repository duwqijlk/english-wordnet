simpleMeaning: To melt, or to make something melt, from a solid into a liquid, usually with heat.
scope: This is turning a solid into liquid with heat, not moving quickly or operating a machine.
examples:
- The candle wax ran down the side of the holder.
- The butter ran as soon as it hit the hot pan.
