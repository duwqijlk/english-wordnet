simpleMeaning: A liquid with double bonds, with its active part at the end of its chain, found in wood
  spirit and used to make glues, softeners, and drugs.
scope: A liquid with double bonds, with its active part at the end of its chain, found in wood spirit
  and used to make glues, softeners, and drugs; not the drinking kind and not the fuel kind.
examples:
- The lab used allyl alcohol to make a softener.
- Allyl alcohol from wood spirit was used to make a drug.
