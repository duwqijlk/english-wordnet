simpleMeaning: a carving in which the shapes stand out only a little from the flat back, and no shape
  is cut free underneath
scope: 'Also called basso relievo, basso rilievo and low relief: a carving that stands out only a little
  from its flat back, not a carving that stands out far and not a free-standing statue.'
examples:
- The bas relief on the wall showed horses in low profile.
- She traced the figures of the bas relief with her fingers.
