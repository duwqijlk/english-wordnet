simpleMeaning: The clock setting of the seventh zone west of Greenwich, fixed by the 105th line of longitude
  west, used in the high states of the United States.
scope: 'Also called Mountain Standard Time and MST: the clock setting of the seventh zone west of Greenwich,
  fixed by the 105th line of longitude west, used in the high states of the United States.'
examples:
- Mountain Time is seven hours behind Greenwich.
- In Denver they keep Mountain Time in winter.
