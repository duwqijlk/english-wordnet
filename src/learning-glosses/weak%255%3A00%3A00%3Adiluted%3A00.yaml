simpleMeaning: having too much liquid added, so it tastes thin and without flavour
scope: About a drink thinned by too much liquid, not bodily strength, skill, or faint light or sound;
  watery and washy are other names.
examples:
- This tea is weak because the bag has been used twice.
- The coffee was weak, so he asked for a fresh cup.
