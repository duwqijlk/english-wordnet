simpleMeaning: A sail on the mast at the back of a ship, running along the line of the ship
scope: 'Also called a mizzen: a sail on the after mast, not the mast itself and not a square sail set
  across the ship.'
examples:
- They raised the mizen as the wind came up behind them.
- The mizen caught the wind and the old ship moved faster.
