simpleMeaning: with sharp, deep marks that go in from the edge or surface
scope: This describes an edge or surface with sharp, deep marks going in. It is not the verb sense of
  making a cut into something.
examples:
- The leaf has an incised edge with deep, sharp cuts.
- We saw an incised pattern cut deep into the stone.
