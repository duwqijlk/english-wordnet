simpleMeaning: Blue-green prickly-edged leaves mark this handsome low bush of salty dry lands in the southwest
  of the United States and Mexico, often used at Christmas
scope: This low bush of salty dry lands bears blue-green prickly-edged leaves and is often used at Christmas;
  it is not a true holly.
examples:
- Desert holly grows in the dry southwest of the United States.
- She used desert holly to decorate at Christmas.
