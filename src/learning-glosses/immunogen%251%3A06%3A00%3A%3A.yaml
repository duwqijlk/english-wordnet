senseId: 'immunogen%1:06:00::'
synsetId: 03567919-n
simpleMeaning: any substance or living thing that sets off the body's defence when put into the body,
  so the body gains protection against sickness
scope: Any substance or living thing that sets off the body's defence when put into it; immunizing agent
  is another name for this sense, not a drug that kills germs directly and not a vitamin.
examples:
- The vaccine is an immunogen that starts the body's defence.
- An immunogen trains the body to fight the sickness.
