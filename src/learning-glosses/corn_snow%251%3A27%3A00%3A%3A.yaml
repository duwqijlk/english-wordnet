simpleMeaning: Grainy white stuff on the ground made when it melts and freezes again, over and over.
scope: This is grainy white stuff on the ground made when it melts and freezes again, over and over, not
  fresh soft snow and not ice.
examples:
- We skied on corn snow in the spring sun.
- The corn snow crunched under our boots.
