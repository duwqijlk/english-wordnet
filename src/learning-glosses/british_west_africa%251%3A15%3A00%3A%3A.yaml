simpleMeaning: The old lands once ruled from London in that part of the continent, among them Nigeria,
  Cameroon, Gambia, Togo, Sierra Leone and the Gold Coast.
scope: The old lands once ruled from London in western Africa; set apart from other lands once ruled from
  London and from other parts of western Africa.
examples:
- British West Africa once covered Nigeria and the Gold Coast.
- Traders crossed British West Africa by river and road.
