simpleMeaning: a sea plant under water with very long thin leaves, found in large numbers along North
  Atlantic shores
scope: A sea plant with very long thin leaves, also called grass wrack and sea wrack; not a land grass
  and not seaweed that floats on the water.
examples:
- Eelgrass grows in shallow water along the coast.
- The bay was thick with eelgrass in summer.
