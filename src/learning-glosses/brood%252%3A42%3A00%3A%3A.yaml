senseId: 'brood%2:42:00::'
synsetId: 02724891-v
simpleMeaning: to be in a bad, angry mood and show that you are not pleased
scope: 'Also called pout and sulk: showing you are not pleased while in a bad mood, not staying silent
  and sad in thought, and not hanging over a place in a dark, threatening way.'
examples:
- He brooded all evening, frowning and letting everyone see he was annoyed.
- After she was told no, she brooded and pulled a sour face at her brother.
