simpleMeaning: A listening tube set on a mother-to-be's belly to hear the heart beat of the unborn child.
scope: This is a listening tube set on a mother-to-be's belly to hear the unborn child's heart beat, not
  a machine that takes pictures, and it is also called a fetoscope.
examples:
- The nurse used a foetoscope to listen to the baby.
- With the foetoscope she heard the heartbeat.
