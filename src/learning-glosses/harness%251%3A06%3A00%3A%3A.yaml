simpleMeaning: equipment made of leather straps, put on a horse or other animal that pulls heavy loads,
  so it can be joined to a cart and pull it
scope: These are straps for an animal that pulls a cart, not straps that hold a person or thing to the
  body, and not the act of putting straps on.
examples:
- The horse wore a leather harness as it pulled the cart.
- He checked the harness before joining the horse to the cart.
