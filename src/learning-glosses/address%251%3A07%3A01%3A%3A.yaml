simpleMeaning: The position a golfer takes just before swinging at the ball.
scope: This is a golfer's body position before a shot, not the act of aiming the club, a formal speech,
  a way of speaking to someone, a place where someone can be reached, delivery details or a house sign,
  computer storage code, tact, or a verb use such as speaking, greeting, addressing mail, directing a
  question, applying oneself, locating data, or expressing something artistically.
examples:
- She checked her grip and settled into her address before the drive.
- His address looked fine, but the swing sent the ball into the trees.
