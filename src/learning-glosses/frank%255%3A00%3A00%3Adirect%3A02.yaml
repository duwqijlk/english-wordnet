simpleMeaning: speaking or acting in a plain, direct way, without hints and without trying to avoid saying
  what you mean
scope: 'Also called blunt: speaking or acting in a direct way, not the sausage called a frank, not stamping
  mail, and not letting a person or thing pass checks.'
examples:
- She was frank about why she left the job.
- Please be frank and tell me what you really think.
