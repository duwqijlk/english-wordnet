senseId: 'tie_beam%1:06:00::'
synsetId: 04440511-n
simpleMeaning: a level bar across two parts of a building that keeps them from moving apart
scope: This is a level bar that holds two parts of a building together; tie is another name for this sense.
  Not a post that holds weight from above and not a brace set at a slant.
examples:
- He nailed the rafters together with a tie beam.
- The carpenter fixed a tie beam across the roof frame.
