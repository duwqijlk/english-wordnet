simpleMeaning: In sports, an early contest that decides who is allowed to take part in the main event
scope: This is a qualifying sports contest; it is not a court case, and it is not a personal hardship.
examples:
- She came second at the Olympic trials and missed the final.
- The club holds trials each spring to pick new players.
