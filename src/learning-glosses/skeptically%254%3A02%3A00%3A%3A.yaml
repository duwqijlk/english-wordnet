senseId: 'skeptically%4:02:00::'
synsetId: 00448486-r
simpleMeaning: in a way that shows doubt, not taking a claim as true until there is good reason to trust
  it
scope: Looking at a claim with doubt, not taking it as true at once and not trusting it without question.
examples:
- She looked skeptically at the salesman's promise.
- He listened skeptically when they said the job would be easy.
