simpleMeaning: The upright part of a chair that a person leans on, made of two posts joined by flat bars.
scope: The upright part of a chair that a person leans on, made of two posts joined by flat bars, not
  a solid wooden chair back and not a ladder for climbing.
examples:
- The ladder-back of the chair had three flat slats.
- She ran her hand along the ladder-back.
