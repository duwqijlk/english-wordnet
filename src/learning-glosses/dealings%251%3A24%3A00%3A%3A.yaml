simpleMeaning: the ways in which people or groups act toward one another, connect, and talk to each other
scope: The ways in which people or groups act toward one another, connect, and talk to each other; relations
  is another name for this, not business done with one person alone and not a single meeting.
examples:
- Our dealings with the firm have always been fair.
- His dealings with his neighbours were friendly.
