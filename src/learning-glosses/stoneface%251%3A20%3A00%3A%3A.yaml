simpleMeaning: Single yellow or white flowers sit on one of many kinds of plant in the Lithops group,
  from Africa, with thick leaves that look like small rocks.
scope: Other names for this Lithops plant of Africa are flowering stone, lithops, living stone, stone-face,
  stone life face, and stone plant, and it has single yellow or white flowers and thick leaves that look
  like small rocks.
examples:
- He potted a stoneface.
- The stoneface flowered.
