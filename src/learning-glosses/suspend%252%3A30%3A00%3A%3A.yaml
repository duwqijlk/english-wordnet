simpleMeaning: to bring something that is going on, or a habit, to a stop for a time
scope: 'Also called freeze: to stop something that is going on, or a habit, for a time; not to make a
  rule or sentence stop counting for a time and not to hold small bits in a liquid.'
examples:
- The school suspended all sports while the hall was being fixed.
- They suspended the bus service during the storm.
