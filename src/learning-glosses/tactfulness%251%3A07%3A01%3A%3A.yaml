simpleMeaning: the way of dealing with others with care so as not to hurt them
scope: This is careful thought about how to deal with others so as not to hurt them, not a blunt way of
  speaking and not rudeness.
examples:
- The tactfulness of the manager kept the meeting calm.
- She showed tactfulness when she told him the bad news gently.
