simpleMeaning: a person who runs a bar and draws drink from kegs or casks
scope: This is a person who runs a bar and draws drink from kegs; tapper is another name for this sense.
  Not a person who makes beer and not a tap dancer.
examples:
- The tapster drew a mug of ale from the keg behind the bar.
- Our tapster keeps the barrels full and the glasses clean.
