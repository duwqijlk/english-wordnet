senseId: 'estrange%2:37:00::'
synsetId: 01827478-v
simpleMeaning: to make a person feel hate toward, or stop caring about, someone they once loved or were
  friends with
scope: 'Also called alienate and disaffect: this is about turning a person against someone they once loved
  or were friends with, not just about meeting that person less often.'
examples:
- His angry words estranged him from his brother, and they stopped speaking for years.
- Years of lies estranged the daughter from her parents.
