simpleMeaning: Ground under the plants of marshes and swamps that lies over peat, rotted plant matter,
  and lets water drain away only slowly.
scope: Bog soil is the wet ground that lies over peat under marsh and swamp plants.
examples:
- The bog soil stayed wet under the marsh plants.
- They dug into the bog soil and found it wet through.
