simpleMeaning: a person on the railroad who looks after the lights and track switches in a train yard
scope: A person who looks after the lights and track switches in a train yard, man or woman; not the person
  who drives the train, and not a guard.
examples:
- The signal worker changed the lights before the train arrived.
- A signal worker checks the track switches in the yard each morning.
