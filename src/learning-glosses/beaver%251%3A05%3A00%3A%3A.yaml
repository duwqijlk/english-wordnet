simpleMeaning: a large animal that lives in and near water, with webbed back feet and a wide flat tail,
  that builds complex dams and homes under the water
scope: A large water animal with webbed feet and a flat tail that builds dams; not a man's tall hat, and
  not the animal's fur.
examples:
- The beaver built a dam across the stream.
- Beavers use their flat tails to slap the water.
