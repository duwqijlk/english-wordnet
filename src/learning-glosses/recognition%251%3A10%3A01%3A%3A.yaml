simpleMeaning: a clear and formal act of saying that a government is real or that a country is free to
  rule itself
scope: This is saying a government or a country is real and free, not knowing a person again when you
  see them and not being known for good work.
examples:
- The new country's recognition by other nations helped it join world talks.
- Formal recognition of the government came after the vote.
