simpleMeaning: one of two low covered places at the side of a baseball field, where players and team leaders
  sit during a game
scope: One of the two low shelters beside a baseball field, not a boat made from a hollow log.
examples:
- The players sat in the dugout and watched the game.
- The coach stood at the front of the dugout, near the field.
