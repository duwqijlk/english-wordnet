simpleMeaning: The state of having nothing that sets a thing apart from others.
scope: The state of having nothing that sets a thing apart from others; not a thing with one clear mark
  of its own.
examples:
- I cannot recall anything like the featurelessness of the characters she has drawn here.
- The featurelessness of the grey walls made the room dull.
