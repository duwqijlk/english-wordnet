simpleMeaning: Make a person end a relationship or connection with someone else.
scope: Causing a person to break off a relationship with someone else only; not a surface's texture, not
  the point or time at which something stops, not top quality, not the place where a race ends, not the
  race that concludes a contest, not someone's downfall, not an event that ends something, not a wine's
  aftertaste, not the noun naming the act of completing something, not ending something in general, not
  finally doing something, not coming to an end, not giving a surface a coating, and not eating all the
  food on a plate.
examples:
- That finished me with Mary.
- The scandal finished him with his business partners.
