simpleMeaning: a lack of skill because someone works badly and wastes time or effort
scope: A lack of skill that comes from working badly and wasting time or effort; it is not just one bad
  piece of work or one mistake.
examples:
- The factory's inefficiency made every order take twice as long.
- His inefficiency at the desk meant simple forms took him all morning.
