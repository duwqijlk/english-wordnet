simpleMeaning: A shape like the letter X, made of two bars of the same length that meet at a slant.
scope: Also called saltire, this is a shape with two bars of the same length that meet at a slant, not
  the upright shape with one bar across the other.
examples:
- The flag bore a St. Andrew's cross in white on blue.
- He drew a St. Andrew's cross on the paper.
