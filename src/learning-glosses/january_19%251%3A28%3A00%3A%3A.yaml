simpleMeaning: A holiday that marks the birth date of Confederate General Robert E. Lee, kept each year
  on the nineteenth day of the first month, in the southern United States.
scope: A holiday that marks the birth date of Confederate General Robert E Lee, kept each year on the
  nineteenth day of the first month in the southern United States; also called Lee's Birthday, Robert
  E Lee's Birthday and Robert E Lee Day, not a holiday for another general or a day kept across the whole
  country.
examples:
- January 19 is a holiday in parts of the southern United States.
- They marked January 19 with a talk about Robert E. Lee.
