senseId: fine-looking%5:00:00:beautiful:00
synsetId: 00220542-s
simpleMeaning: When the shape and size of the parts are as people think they should be, what you see is
  pleasing
scope: 'Also called better-looking, good-looking, handsome, and on fleek: what you see is pleasing when
  the shape and size of the parts are as people think they should be, not merely neat and tidy, and not
  plain.'
examples:
- She was a fine-looking woman with a warm smile.
- He stood out as a fine-looking man in the crowd.
