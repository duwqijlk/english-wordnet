simpleMeaning: accept and obey the leadership, orders, or guidance of another person
scope: Not simply walking behind someone or copying their example, and not watching or tracking something
  as it develops; it is accepting their authority or advice.
examples:
- The new recruits agreed to follow Captain Reyes without question.
- She was suspended after refusing to follow her manager's instructions.
