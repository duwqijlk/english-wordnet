synsetId: 00367347-n
simpleMeaning: the act of making a thing longer or wider, or of a thing becoming longer or wider
scope: The act of making a thing longer or wider in size, not the exercise of moving the arms and legs
  to make them reach as far as they can.
examples:
- The stretching of the rope made it longer and thinner.
- Careful stretching widened the material without tearing it.
