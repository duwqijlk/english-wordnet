simpleMeaning: Any of several hard-shelled insects whose young bore holes in dead or dying trees, above
  all cone-bearing trees.
scope: A hard-shelled insect whose young bore in dead trees, also called sawyer; not a bark beetle that
  eats bark and not a wood wasp.
examples:
- The sawyer beetle lays its eggs in dead pine trees.
- Sawyer beetles bore into the dead trunk.
