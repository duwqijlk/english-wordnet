simpleMeaning: A form of schizophrenia with severe personality breakdown, unpredictable speech, immature
  mannerisms and strange behaviour; usually appears around puberty; the most commonly diagnosed type in
  psychiatric hospitals.
scope: Also called hebephrenia, hebephrenic schizophrenia or disorganized type schizophrenia; not schizophrenia
  as a whole, and not the catatonic or paranoid forms.
examples:
- His disorganized schizophrenia made his speech hard to follow.
- She was diagnosed with disorganized schizophrenia in her late teens.
