simpleMeaning: An upright bar with a second bar through it, and a ring around the place where the two
  bars meet
scope: This is a monument shape with a ring around the join, not a plain cross and not the Celtic people.
examples:
- A Celtic cross stood at the head of the old grave.
- The stone Celtic cross by the church had a ring around its center.
