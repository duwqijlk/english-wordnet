simpleMeaning: a shrub with three-part leaves and yellow flowers, then seed pods that curve back; its
  leaves smell bad when crushed
scope: 'Also called stinking bean trefoil: the shrub with three-part leaves, yellow flowers, and backward-curving
  seed pods whose leaves smell bad when crushed, not a bean plant grown for food.'
examples:
- Bean trefoil grew along the path, its yellow flowers bright in the sun.
- Crush a bean trefoil leaf and you will smell how bad it is.
