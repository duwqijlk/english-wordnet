senseId: 'disproportionately%4:02:00::'
synsetId: 00319536-r
simpleMeaning: in a way that is too much or too little when compared with something else
scope: This says how much a thing is done or is true when the share is not right; it does not name a thing
  itself.
examples:
- The small town was disproportionately hit by the storm.
- His pay was disproportionately high for the work he did.
