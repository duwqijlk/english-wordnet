simpleMeaning: a plant of Europe with small round lumps under the ground that can be eaten
scope: 'Also called chufa, earth almond, ground almond and yellow nutgrass: a plant of Europe with small
  lumps under the ground that can be eaten, not a tree and not a plant with nuts on its branches.'
examples:
- The gardener planted rush nut for its small round lumps.
- We dug up rush nut and ate the small round lumps.
