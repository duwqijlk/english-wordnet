simpleMeaning: a big, heavy animal of the squirrel family, yellow-brown in colour, that lives on stony
  ground in the west of North America
scope: 'Also called a yellowbelly marmot: a big, heavy animal of the squirrel family that lives on stony
  ground in the west of North America, not a groundhog of flat farm land and not a small prairie dog.'
examples:
- We saw a rockchuck sitting on a boulder above the trail.
- The rockchuck slipped back into its burrow among the stones.
