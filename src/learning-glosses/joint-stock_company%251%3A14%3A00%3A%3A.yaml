simpleMeaning: a business, usually not set up as a legal body, whose members pool money in one fund; shares
  passing on show ownership, and members must by law pay all debts
scope: A business whose members share one fund and must pay all its debts, not a company whose owners
  can only lose what they put in, and not a firm owned by one person.
examples:
- The family put their savings into a joint-stock company that ran the town's mills.
- In a joint-stock company, each member's share can be sold to someone else.
