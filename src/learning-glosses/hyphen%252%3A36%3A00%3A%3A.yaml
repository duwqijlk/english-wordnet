simpleMeaning: to split a word or join word parts with the short mark '-'
scope: Hyphenate is another name for this sense. This is the act of using the '-' mark to split a word
  or join word parts, not the '-' mark itself.
examples:
- Please hyphen the two parts of this word.
- She had to hyphen the long word at the end of the line.
