simpleMeaning: One end of this steel tool is a chisel; the other bends like a goose's neck and ends in
  a claw that pulls nails out.
scope: The name picks out a steel lever that does two jobs at once, cutting with a chisel at one end and
  pulling nails with a claw at the other.
examples:
- He used a ripping bar to pull the old nails from the boards.
- The ripping bar pried the floorboards loose.
