simpleMeaning: A unit of heat, the amount of heat needed to raise 1 g of water by one degree centigrade
  at normal air pressure
scope: A unit of heat, the amount of heat needed to raise 1 g of water by one degree centigrade at normal
  air pressure; also called calorie and small calorie, not a unit of weight and not a unit of length.
examples:
- A gram calorie is the heat needed to warm one gram of water by one degree.
- The book said a gram calorie is a small unit of heat.
