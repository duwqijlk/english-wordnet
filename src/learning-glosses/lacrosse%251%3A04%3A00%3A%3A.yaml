simpleMeaning: a ball game first played by the native peoples of America, where two teams use long netted
  sticks to catch, carry, and throw the ball at the other team's goal
scope: A ball game for two teams using long sticks with nets, not a game played with hands alone and not
  a game played with a bat.
examples:
- He joined the lacrosse team at school.
- She caught the ball in her lacrosse stick and ran toward the goal.
