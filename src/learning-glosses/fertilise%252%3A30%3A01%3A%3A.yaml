simpleMeaning: to make something able to grow well and give much of value
scope: 'Also called fertilize: this is about making something able to grow and give much of value, not
  the act of putting plant food into soil.'
examples:
- Good books fertilised her mind and helped new ideas grow.
- Working with older artists fertilised his work, and fresh ideas soon came.
