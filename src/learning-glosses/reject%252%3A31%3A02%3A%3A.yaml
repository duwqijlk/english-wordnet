simpleMeaning: to take a person or idea out of consideration, or to remove someone from a contest
scope: 'Also called eliminate: to remove a person or idea from consideration or from a contest, not to
  keep someone out of a place or group and not a thing set aside for poor quality.'
examples:
- Police rejected him as a suspect because he had a strong alibi.
- The panel rejected the weakest singers from the contest.
