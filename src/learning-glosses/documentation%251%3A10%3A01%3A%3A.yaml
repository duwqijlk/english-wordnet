simpleMeaning: Lists of a program's code or handbooks that tell how a computer program works and how to
  use it
scope: This is lists of program code or handbooks about how a program works, not proof that a fact is
  true and not the act of proving it with papers.
examples:
- Read the documentation before you install the program.
- The documentation tells you how to use every part of the software.
