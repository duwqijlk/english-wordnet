simpleMeaning: In a way that is plain to the mind, showing sharp and distinct understanding.
scope: It is not about speaking in an easy-to-follow way or about having no doubt, but about the mind
  perceiving something distinctly.
examples:
- He saw at once, without any confusion, what the figures meant.
- She grasped the point of his argument as soon as he spoke.
