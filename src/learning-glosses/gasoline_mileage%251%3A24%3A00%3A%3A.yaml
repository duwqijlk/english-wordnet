simpleMeaning: The number of miles covered for each gallon of fuel burned.
scope: This is the number of miles covered for each gallon of fuel burned; mileage, fuel consumption rate
  and gas mileage are other names for this sense, not the top speed of a vehicle and not the size of its
  tank.
examples:
- Her car has good gasoline mileage on long trips.
- We bought a small car for its gasoline mileage.
