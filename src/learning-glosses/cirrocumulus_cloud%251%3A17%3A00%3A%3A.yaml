simpleMeaning: Like ripples on water, a set of small puffs set in neat rows high above the ground
scope: Also called cirrocumulus, this high spread of small puffs in neat rows is not a low sheet of vapour
  and not a single large puff.
examples:
- The cirrocumulus cloud spread across the sky in neat rows of tiny puffs.
- High above us, the cirrocumulus cloud looked like ripples on still water.
