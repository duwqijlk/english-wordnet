simpleMeaning: This sharp-tasting yellow fruit from the East Indies looks like a berry
scope: A sharp-tasting yellow fruit like a berry, also called lansat, lanseh and lanset; not the tree
  that bears it and not a sweet berry.
examples:
- She ate a lansa and winced at its tart taste.
- The market sold ripe lansa by the kilo.
