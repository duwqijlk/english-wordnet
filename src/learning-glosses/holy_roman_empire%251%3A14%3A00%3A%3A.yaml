simpleMeaning: A political body in Europe that began when the pope crowned Otto I as its first ruler in
  962 and lasted until 1806, when Napoleon ended it
scope: A European political body from 962 to 1806; not the ancient state ruled from Rome and not a modern
  European union of states.
examples:
- The Holy Roman Empire lasted from 962 until 1806.
- Otto I was crowned the first ruler of the Holy Roman Empire.
