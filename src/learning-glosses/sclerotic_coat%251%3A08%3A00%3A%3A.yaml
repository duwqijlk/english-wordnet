simpleMeaning: With the clear front part of the eye, this whitish tough layer, the albuginea, forms the
  outer cover and shield of the eyeball.
scope: Also called the sclera, this is the whitish tough layer that, with the clear front of the eye,
  makes the outer cover of the eyeball, not the clear front part itself.
examples:
- The sclerotic coat protects the eyeball.
- The sclerotic coat joins the clear front part of the eye.
