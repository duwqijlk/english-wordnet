simpleMeaning: A part of the Economic and Social Council of the United Nations that looks after the trade
  in drugs.
scope: This word is for the drugs part of that council, not the part that looks after the rights of people
  and not the part that looks after the standing of women.
examples:
- The Commission on Narcotic Drugs met to talk about the trade in drugs.
- Reports on the trade in drugs go to the Commission on Narcotic Drugs.
