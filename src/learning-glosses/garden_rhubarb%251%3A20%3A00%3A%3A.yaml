simpleMeaning: People often cook this plant's stalks in pies or use them for sauce or preserves; it is
  a cross of the plant Rheum palmatum, grown for a long time.
scope: Also called pie plant, this is a long-grown plant whose stalks are cooked in pies, not wild rhubarb.
examples:
- She grows garden rhubarb behind the house for pies.
- We cooked the garden rhubarb stalks into a sauce for pudding.
