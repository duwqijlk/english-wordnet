simpleMeaning: a long top, usually with no sleeves, made of small linked metal rings, worn long ago to
  keep the body safe in battle
scope: 'Also called hauberk: a long top of linked metal rings worn long ago to keep the body safe in battle,
  not a suit of hard metal plates and not a normal shirt.'
examples:
- The soldier wore a byrnie to keep his body safe in battle.
- In the museum, an old byrnie hung next to a sword.
