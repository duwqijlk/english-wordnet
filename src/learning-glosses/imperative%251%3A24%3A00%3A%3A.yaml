simpleMeaning: In grammar, the mood of a verb that shows the speaker wants the hearer to do something
scope: In grammar, the mood of a verb that shows the speaker wants the hearer to do something; not a verb
  in that mood and not a word for something that must be done.
examples:
- The imperative is the mood used for orders, as in 'Sit down'.
- '''Go home'' uses the imperative mood to tell someone to do something.'
