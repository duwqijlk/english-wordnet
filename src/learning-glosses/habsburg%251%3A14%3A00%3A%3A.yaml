simpleMeaning: A German royal house whose members ruled several states in Europe and wore the crown of
  the Holy Roman Empire from 1440 to 1806.
scope: This is the German royal family also called Hapsburg, not another royal house such as the Bourbons
  or the Windsors.
examples:
- The Habsburgs ruled Austria for centuries.
- A Habsburg king wore the crown of the Holy Roman Empire.
