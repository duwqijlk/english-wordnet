simpleMeaning: A medium to tall fir of western North America with a cone-shaped crown and branches in
  tiers, its leaves smelling of orange when crushed.
scope: Also called amabilis fir, red silver fir, white fir, Christmas tree, and Pacific silver fir; a
  medium to tall fir of western North America with a cone-shaped crown, not the balsam fir and not the
  Douglas fir.
examples:
- Abies amabilis grows tall in the mountains of western North America.
- Crush the leaves of Abies amabilis and they smell of orange.
