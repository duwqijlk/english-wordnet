simpleMeaning: the part of the loin (meat from the lower back of an animal), especially of beef, just
  in front of the rear end
scope: This is a piece of meat, especially beef, cut from the lower back; it is not a live animal's body
  part and not a cut from the front or the leg.
examples:
- He grilled a thick sirloin for dinner.
- The shop sells sirloin cut into small steaks.
