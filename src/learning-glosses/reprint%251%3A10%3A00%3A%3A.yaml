simpleMeaning: a piece of writing printed on its own, after it first came out as part of a bigger work
scope: 'Also called separate: one piece of writing printed on its own, not a whole book printed again
  with no changes and put on sale again.'
examples:
- The teacher gave us a reprint of the article from the science magazine.
- He keeps a reprint of the short paper in his desk.
