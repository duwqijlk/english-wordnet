simpleMeaning: A cord used by the person who carries out a hanging to kill people who have been given
  death as a punishment.
scope: This is a cord used by the person who carries out a hanging to kill people given death as a punishment,
  not a rope for tying things; also called halter, hemp, hangman's rope, and hempen necktie.
examples:
- The hangman's halter hung from the beam.
- They cut down the hangman's halter after the sentence was carried out.
