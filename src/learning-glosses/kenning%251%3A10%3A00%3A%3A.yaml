simpleMeaning: A set name for a thing that pictures it in another way, used above all in old English and
  old Norse poems
scope: This is a set name that pictures a thing in another way, used above all in old English and old
  Norse poems, not the plain name of the thing and not a nickname given to a person.
examples:
- A kenning is a set name that pictures a thing in another way.
- Old English poems are full of kennings.
