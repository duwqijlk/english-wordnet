simpleMeaning: The act of measuring things, putting them in order, or changing their size, by a set of
  marks that show size
scope: Sizing, ordering, or changing the size of things by a set of marks that show size.
examples:
- Scaling the map to fit the page took a few minutes.
- The scaling of the model made every part twice as big.
