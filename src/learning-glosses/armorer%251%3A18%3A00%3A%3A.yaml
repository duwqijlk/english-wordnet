simpleMeaning: a soldier whose job is to look after small guns and machine guns, keeping them in good
  working order
scope: A soldier who looks after small arms and machine guns, not a worker who makes armour or weapons.
examples:
- The armorer checked every rifle before the men went out on patrol.
- Our armorer keeps the machine guns clean and in good working order.
