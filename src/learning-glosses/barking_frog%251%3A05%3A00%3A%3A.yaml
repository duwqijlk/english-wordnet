simpleMeaning: an animal from the south-west of the United States and Mexico, whose call sounds like a
  dog
scope: A frog from the south-west of the United States and Mexico whose call sounds like a dog, not a
  frog that croaks and not a dog.
examples:
- We heard a barking frog calling in the night.
- The barking frog sounds so much like a dog that we looked for one in the yard.
