simpleMeaning: Of a person or a state where the body goes stiff and still, unable to move.
scope: Of a person or a state with the body stiff and still, not the person who has the condition itself.
examples:
- The patient lay cataleptic, unable to move a limb.
- Her cataleptic state left her stiff and still for hours.
