simpleMeaning: A bush that bears oval citrus fruits.
scope: A bush that bears oval citrus fruits; nagami and oval kumquat are other names for this, and it
  is not a lemon bush or an orange tree.
examples:
- The nagami kumquat bore oval fruit.
- The nagami kumquat by the house bore oval fruit.
