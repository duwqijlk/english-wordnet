senseId: 'tactless%3:00:00::'
synsetId: 02393411-a
simpleMeaning: having or showing too little care for what is right and kind when dealing with other people
scope: This sense is about being unkind or not right in how you treat other people, not the sense about
  showing poor judgment and not noticing things.
examples:
- It was tactless to ask her age in front of everyone.
- His tactless remark about her weight hurt her feelings.
