simpleMeaning: Fish, soft-bodied animals, and many mammals are among the many kinds of animals that live
  in the ocean.
scope: A marine animal, a marine creature, and a sea animal are other names for one of these kinds of
  animals in the ocean.
examples:
- A sea creature lived in the ocean.
- Many sea creatures live in the ocean.
