simpleMeaning: One of the two back openings at the rear of the nose space that lead into the upper throat
scope: One of the two back openings at the rear of the nose space that lead into the upper throat; internal
  nostril is another name for this sense, not the opening at the front of the nose and not the throat
  itself.
examples:
- Air passes through the choana into the upper throat.
- Each choana is one of two openings at the back of the nose.
