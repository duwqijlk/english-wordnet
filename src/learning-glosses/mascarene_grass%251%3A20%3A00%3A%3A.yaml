simpleMeaning: Brought to the south of the United States for lawns that stand up to dry spells, this creeping
  Asian grass lives year after year.
scope: Among lawn grasses, this creeping Asian one lives year after year and was brought to the south
  of the United States to stand up to dry spells.
examples:
- The mascarene grass crept across the lawn in the dry months.
- Lawns of mascarene grass stood up to the long dry spell.
