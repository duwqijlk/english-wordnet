simpleMeaning: In medicine, a small spot on or inside the body that is not as it should be
scope: A small patch of unhealthy tissue in the body, not the flat plate put on a wall and not the sticky
  layer on teeth.
examples:
- The doctor found a plaque on the inside of her artery.
- A small plaque on the skin can be a sign of illness.
