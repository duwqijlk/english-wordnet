simpleMeaning: a thin nerve thread that goes to a muscle or to a part that makes body fluid, and makes
  the muscle tighten or the part send out fluid
scope: This is the thin nerve thread itself, not the muscle or the part that makes fluid and does the
  work when a signal comes.
examples:
- The effector carried the signal to the muscle and made it tighten.
- When the effector reaches a gland, it can make the gland send out fluid.
