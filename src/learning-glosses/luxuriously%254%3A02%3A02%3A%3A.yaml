simpleMeaning: in a way where you give yourself much costly comfort and pleasure, more than you need
scope: In a way that is full of costly comfort and pleasure for yourself, not in a plain or simple way
  and not just in a rich-looking way.
examples:
- She lay luxuriously on the soft bed all morning.
- They lived luxuriously in a large house with many servants.
