simpleMeaning: A drug that eases mild pain but not swelling, also used to bring down fever; one brand
  name of acetaminophen tablets, along with Tylenol, Panadol, Phenaphen, Tempra and Anacin III.
scope: Also called acetaminophen, Anacin III, Panadol, Phenaphen, Tempra and Tylenol; a drug that eases
  mild pain but not swelling and brings down fever, not aspirin, which also eases swelling, and not a
  drug for strong pain.
examples:
- She took Datril for her headache.
- Datril is sold in most drugstores.
