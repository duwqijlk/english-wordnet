simpleMeaning: A weight put opposite another one so the two sides match.
scope: A single counterweight, not the weighing device itself or the wheel that regulates a clock.
examples:
- The balance on the left side offset the load on the right.
- He hung a balance from the other end of the beam to even the scales.
