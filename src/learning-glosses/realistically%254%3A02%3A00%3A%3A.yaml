simpleMeaning: in a way that looks very much like the real thing it copies
scope: Done so that it looks like the real thing it copies, as in a painting; not just in a practical,
  sensible way of dealing with life.
examples:
- The figure was realistically painted, down to the lines on its face.
- The model village was realistically built, with tiny doors and windows.
