simpleMeaning: rude names for a hospital for people with mental illness
scope: Also called madhouse and nuthouse, this is a rude name for a hospital for people with mental illness,
  not a hospital for rest and long-term care.
examples:
- In the old book, people rudely called the mental hospital a sanatorium.
- He used the word sanatorium as a rude name for the place, and she told him to stop.
