simpleMeaning: A plant of the genus Sanicula with leaves split into finger-like leaflets, single-sex flowers
  in branched umbrella-shaped clusters and bristly fruit; people say it has healing powers.
scope: Snakeroot is another name for this same plant; the snakeroot name also belongs to unrelated North
  American plants of the genus Liatris.
examples:
- Sanicle carries its flowers in branched, umbrella-shaped clusters.
- People say that sanicle has healing powers.
