simpleMeaning: A plant of Europe and Asia with blue flowers and leaves like verbena, now growing wild
  in the United States.
scope: A plant of Europe and Asia with blue flowers and verbena-like leaves; wild clary and wild sage
  are other names for this sense; not a garden rose and not a lavender plant.
examples:
- Vervain sage grows wild in the United States with blue flowers.
- The vervain sage in the field had leaves like verbena.
