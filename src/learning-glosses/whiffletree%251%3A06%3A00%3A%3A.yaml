senseId: 'whiffletree%1:06:00::'
synsetId: 04584853-n
simpleMeaning: A crossbar joined to the straps of a working horse and to the cart or tool the horse pulls.
scope: A crossbar between a working horse and what it pulls; swingletree and whippletree are other names
  for this sense, not the horse's collar and not the cart itself.
examples:
- The whiffletree joined the horse to the plough.
- He fixed the whiffletree to the traces of the horse.
