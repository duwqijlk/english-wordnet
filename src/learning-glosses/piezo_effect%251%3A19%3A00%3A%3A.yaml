simpleMeaning: Certain crystals, quartz among them, turn a squeeze into an electric charge, and an electric
  field can make the same crystal shrink or stretch a little.
scope: A short name for the piezoelectric effect, the same phenomenon, not a separate effect or the devices
  that use it.
examples:
- The spark in a gas lighter comes from the piezo effect in a small crystal.
- Engineers exploit the piezo effect to build pressure sensors.
