simpleMeaning: The sparks that jump across as a switch that breaks a circuit opens can harm it, so the
  most electric pressure it can stop safely is its set limit.
scope: The top electric pressure a switch that breaks a circuit can stop safely without harm from the
  sparks that jump across as it opens.
examples:
- Check the rated voltage of the breaker before you use it.
- Do not use a breaker above its rated voltage.
