simpleMeaning: having the names of the books, papers, or other works used, written down
scope: This describes a written work, such as a book or report, that has the names of the works it used
  written down; it is not just a work that people talk about or name.
examples:
- The book is a carefully referenced life story, with its sources listed at the end.
- Her referenced report lists every paper she used at the back.
