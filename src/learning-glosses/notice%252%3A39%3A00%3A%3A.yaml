senseId: 'notice%2:39:00::'
synsetId: 02122959-v
simpleMeaning: to become aware of something through the senses or the mind.
scope: This is not the narrower sense of discovering by sight that something exists; it is the more general
  act of becoming aware of something.
examples:
- He noticed a change in her tone of voice.
- She noticed that the room felt colder than before.
