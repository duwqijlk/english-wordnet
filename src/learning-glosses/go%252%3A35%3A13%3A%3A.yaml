simpleMeaning: To search through a place or someone's belongings, often without permission, looking for
  something.
scope: This means searching through things, not passing through a place on the way somewhere and not experiencing
  something.
examples:
- Someone had gone through her drawers while she was at lunch.
- The police went through every box in the attic.
