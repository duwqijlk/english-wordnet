simpleMeaning: a set of false teeth held in place by the real teeth on each side of a gap
scope: A dental fitting of false teeth held by the teeth on either side of a gap, not the joining piece
  on eyeglasses or the wooden part on a violin.
examples:
- She needed a bridge after losing two teeth in the accident.
- The dentist fitted a bridge between the two remaining molars.
