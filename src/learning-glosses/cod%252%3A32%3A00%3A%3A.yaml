simpleMeaning: to keep saying unkind things to a person that find fault with them, again and again
scope: 'Also called ride, rag, tease, rally, bait and taunt: this is teasing a person with unkind fault-finding
  words, not the fish or its flesh and not a plant case for seeds.'
examples:
- The boys codded him every day about his old shoes.
- Stop codding me about the test I failed.
