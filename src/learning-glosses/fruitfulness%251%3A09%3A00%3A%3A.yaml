simpleMeaning: The power of a creative mind to bring forth plenty of new ideas and work.
scope: Also called fecundity; the power of a creative mind to bring forth plenty, not the bearing of fruit
  by a plant.
examples:
- The fruitfulness of her imagination showed in story after story.
- His fruitfulness as a painter filled the gallery with new work.
