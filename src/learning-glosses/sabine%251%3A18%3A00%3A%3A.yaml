simpleMeaning: A member of an old people who spoke Oscan and lived in the middle Apennines north of Rome,
  conquered and taken into the Roman state in 290 BC.
scope: A member of an ancient Oscan-speaking people of the central Apennines, taken into the Roman state
  in 290 BC, not a Roman or a Samnite, and not the adjective Sabine for their ways.
examples:
- The Sabine lived in the hills north of Rome.
- A Sabine farmer traded with the Romans.
