simpleMeaning: Four Hebrew letters, usually written YHWH (Yahweh) or JHVH (Jehovah), that stand for the
  holy name of God, too holy for Jews to say aloud.
scope: The written form of God's Hebrew name in four letters, usually written YHWH or JHVH, which Jews
  regard as too holy to say aloud.
examples:
- The Tetragrammaton is written YHWH in Hebrew.
- Jews regarded the Tetragrammaton as too holy to pronounce.
