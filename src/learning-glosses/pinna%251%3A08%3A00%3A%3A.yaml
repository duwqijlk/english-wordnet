simpleMeaning: The part of the outer ear that can be seen from outside, made of the firm bendy stuff called
  cartilage.
scope: This is the part of the outer ear that can be seen from outside; ear and auricle are other names
  for this sense, not the inner ear and not the ear hole itself.
examples:
- The pinna catches sound and sends it into the ear.
- Her pinna was red from the cold.
