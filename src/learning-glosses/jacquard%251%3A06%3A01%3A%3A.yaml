simpleMeaning: A cloth with a very rich pattern woven into it, made on a loom that weaves the pattern
  in as it works.
scope: A figured fabric for curtains and covers, woven with its rich pattern on a Jacquard loom.
examples:
- The curtains were made of jacquard with a rich pattern of flowers.
- She chose a jacquard for the chair covers.
