simpleMeaning: People pay this worker to take their waste away and get rid of it
scope: A worker paid to pick up and get rid of waste, also called a garbage carter or garbage hauler;
  not the bin that holds the waste and not the kitchen machine that grinds it.
examples:
- The garbage collector lifted the bins onto the truck.
- A garbage collector came to take away the rubbish from our street.
