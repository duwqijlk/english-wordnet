simpleMeaning: In basketball, a move in which one offensive player passes the ball to a team-mate, then
  runs toward the basket for a pass back
scope: In basketball, a move where one player passes and runs to the basket for a pass back; not a free
  throw and not a dribble.
examples:
- They used a give-and-go to beat the defence.
- The give-and-go worked well in the second half.
