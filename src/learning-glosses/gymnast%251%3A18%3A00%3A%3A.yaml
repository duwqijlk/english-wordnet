simpleMeaning: a person who does sport and is very good at jumping, turning, and balancing with the body
scope: A person who is very good at jumping, turning, and balancing as a sport, not a person who teaches
  it and not a runner or a swimmer.
examples:
- The gymnast did a perfect jump and landed on both feet.
- A young gymnast practised balancing on the narrow beam every day.
