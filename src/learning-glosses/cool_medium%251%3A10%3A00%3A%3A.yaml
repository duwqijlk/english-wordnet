simpleMeaning: A channel, such as talk, television and cartoons, that most of the time asks little of
  the people using it yet gives them a lot to take in.
scope: This is a channel that most of the time asks little of the people using it yet gives them a lot
  to take in; cold medium is another name for this sense, not a channel that asks a lot of its audience
  and not a single show or book.
examples:
- The cool medium of television asks little of its viewers.
- Speech is a cool medium that still gives listeners a lot to take in.
