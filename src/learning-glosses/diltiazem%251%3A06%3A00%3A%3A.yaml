senseId: 'diltiazem%1:06:00::'
synsetId: 03203321-n
simpleMeaning: A drug that slows the flow of calcium, sold as Cardizem, used for high blood pressure,
  chest pain, or a failing heart
scope: A drug that slows calcium flow to ease blood pressure, chest pain, or a failing heart, not a drug
  that raises blood pressure and not a painkiller.
examples:
- The doctor gave her diltiazem for her high blood pressure.
- Diltiazem eased his chest pain by slowing the calcium flow.
