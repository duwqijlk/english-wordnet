simpleMeaning: A sudden change of course in a person's life, like the sudden change of the Apostle Paul
  on his way from Jerusalem to the Syrian city to arrest Christians.
scope: A sudden turning point in a person's life, like Paul's sudden change on the way to Damascus; not
  a journey on a road.
examples:
- Losing his job was his road to Damascus.
- Her road to Damascus came when she met the old teacher.
