simpleMeaning: the act of taking out or changing every part of a text that people think is rude or unfit
  to read
scope: 'Also called bowdlerisation: the act of cutting out or changing rude parts of a text, not the act
  of writing a new text and not the act of cutting words to make a text shorter for any other reason.'
examples:
- The bowdlerization of the old novel removed every rude joke.
- Critics attacked the bowdlerization because it changed the author's words.
