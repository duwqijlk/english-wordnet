senseId: 'abetalipoproteinemia%1:26:00::'
synsetId: 14175366-n
simpleMeaning: A rare inherited disorder in which the body handles fats badly, with very low beta-lipoproteins,
  abnormally low cholesterol and abnormally shaped red blood cells called acanthocytes.
scope: This is a rare inherited disease affecting how the body handles fats, not a dietary intolerance
  or a cholesterol problem picked up later in life. Its nearest relative is hypobetalipoproteinemia, a
  milder fall in beta-lipoproteins without the abnormal red cells. It is a medical term.
examples:
- Abetalipoproteinemia is usually diagnosed in infancy when the child's growth falters.
- Children with abetalipoproteinemia need large doses of fat-soluble vitamins.
