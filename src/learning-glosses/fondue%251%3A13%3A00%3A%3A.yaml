simpleMeaning: hot melted cheese or chocolate, as thick as a sauce, into which you dip bread or fruit
  to eat
scope: 'Also called fondu: hot melted cheese or chocolate that you dip bread or fruit into, not cubes
  of meat or seafood cooked in hot oil and then dipped in sauces.'
examples:
- We shared a pot of cheese fondue and dipped bread into it.
- For dessert, the chocolate fondue was warm and sweet.
