simpleMeaning: the person on a bus, train, or other public vehicle who collects the money people pay to
  travel
scope: The person who collects the money people pay to travel on a bus or train, not a device or a material
  that lets electricity or heat pass through it.
examples:
- The conductor checked our tickets and collected the fare for the train ride.
- On the bus, the conductor gave me a ticket after I paid.
