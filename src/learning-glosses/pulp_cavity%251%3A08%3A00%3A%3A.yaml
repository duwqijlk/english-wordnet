simpleMeaning: The hollow middle of a tooth that holds the soft inner part, with the narrow tube down
  the root.
scope: The hollow middle of a tooth, not the hard outer coat and not the root alone.
examples:
- The pulp cavity holds the soft inner part of the tooth.
- A deep hole can reach the pulp cavity and cause pain.
