senseId: 'masquerade%2:39:00::'
synsetId: 02152392-v
simpleMeaning: to take part in a party where people wear masks and special clothes that hide who they
  are
scope: This is taking part in such a party, not the party itself and not the special clothes worn as a
  way to hide who a person is.
examples:
- We masqueraded at the party in masks and old, bright clothes.
- Hundreds of guests masqueraded in the hall, all hiding their faces.
