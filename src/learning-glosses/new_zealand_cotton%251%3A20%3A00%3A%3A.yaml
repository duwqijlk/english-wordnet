simpleMeaning: A thread from the inner bark of ribbon trees of the islands in the south-west Pacific,
  like the thread of a soft white plant.
scope: A thread got from the inner bark of ribbon trees of the islands in the south-west Pacific; its
  near kin are the other plant threads, and this one is set apart by its ribbon-tree source and its likeness
  to the thread of a soft white plant.
examples:
- New Zealand cotton comes from ribbon trees.
- New Zealand cotton resembles cotton fiber.
