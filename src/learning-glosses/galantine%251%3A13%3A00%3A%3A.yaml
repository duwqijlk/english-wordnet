simpleMeaning: A cold dish of chicken or other bird with the bones taken out, filled, cooked, and set
  in clear meat jelly.
scope: This is a cold dish of boned bird meat set in clear meat jelly; not a meat pie, which has a crust,
  and not a terrine, which is cooked in a pot.
examples:
- She served galantine with bread at the cold lunch.
- The galantine was made from a boned chicken set in jelly.
