simpleMeaning: A group in British politics, formed in 1900, that works for workers and once sought to
  bring key firms under public control
scope: A group in British politics, formed in 1900, that works for workers and once sought to bring key
  firms under public control; Labor, Labour and British Labour Party are other names for this sense; not
  a group formed in another country, and not a group that works for owners of firms.
examples:
- The Labour Party was formed in Great Britain in 1900.
- The Labour Party works for the interests of labor.
