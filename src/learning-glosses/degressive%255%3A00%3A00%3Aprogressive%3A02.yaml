synsetId: 01883891-s
simpleMeaning: of taxes, getting smaller in rate bit by bit on sums of money under a set amount
scope: A tax rate that gets smaller bit by bit on sums under a set amount; not a rate that stays the same,
  and not one that grows larger as the sum grows.
examples:
- The degressive rate fell as the sum stayed below the set amount.
- Under the degressive system, a tax on a sum below the set amount had a lower rate.
