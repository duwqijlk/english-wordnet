simpleMeaning: One branch of a group of languages spoken in the north along two rivers and in the south
  in Lam Dong and other provinces of Vietnam.
scope: Also called Tai Dam; one branch of a language group of Vietnam, not the other branches of the same
  group.
examples:
- Black Tai is spoken in the north of Vietnam.
- Many people in Son La speak Black Tai.
