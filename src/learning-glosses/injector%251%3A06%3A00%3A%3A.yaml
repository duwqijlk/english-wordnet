simpleMeaning: A device for forcing a thing, such as water or small bits of matter, into a machine, as
  into a boiler or a particle accelerator.
scope: A device for forcing a thing into a machine, not the jet pump that drives a liquid or gas along
  with a jet of steam or water.
examples:
- The injector sent water into the boiler of the steam engine.
- An injector feeds tiny bits of matter into the particle accelerator.
