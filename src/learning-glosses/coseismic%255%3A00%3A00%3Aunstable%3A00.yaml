senseId: coseismic%5:00:00:unstable:00
synsetId: 02300035-s
simpleMeaning: of a place where waves of shaking from an earthquake all reach it at the same time
scope: This is a place where waves of shaking from an earthquake all reach it at the same time; coseismal
  is another name for this sense, not a place where the shaking gets there at a different time.
examples:
- The two villages are coseismic, so the shaking from the earthquake reached both at the same time.
- A coseismic point is one where the waves of shaking all get there together.
