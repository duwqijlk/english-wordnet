simpleMeaning: Going on with the same act, or doing it again and again
scope: 'Also called perseverance and persistence: going on with the same act or doing it again and again,
  not a single act and not a memory that keeps coming back.'
examples:
- His perseveration continued to the point where it was no longer appropriate.
- The patient's perseveration showed in his repeated questions.
