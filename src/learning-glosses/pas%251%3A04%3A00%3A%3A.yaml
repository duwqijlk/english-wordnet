simpleMeaning: In ballet, a dance step, especially one from classical ballet.
scope: One movement of the feet in ballet, not a whole dance and not a held ballet position.
examples:
- The dancer repeated the pas until every movement was precise.
- The choreographer added a new pas to the second act.
