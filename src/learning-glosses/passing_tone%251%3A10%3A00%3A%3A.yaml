senseId: 'passing_tone%1:10:00::'
synsetId: 06883487-n
simpleMeaning: Put in to join two sounds that are in the chord, the sounds played together at one time,
  this sound is not in it
scope: 'Another name for this is a passing note: a sound put in to join two sounds that are in the chord,
  not a sound that is part of the chord and not a sound played by mistake.'
examples:
- The passing tone linked the two chord tones.
- A passing tone filled the gap between the two notes.
