simpleMeaning: a life preserver made as a sleeveless top that floats or can be filled with air
scope: A life preserver made as a sleeveless top that floats or can be filled with air; life jacket and
  life vest are other names for this sense, not a coat worn for warmth, and not a vest worn under clothes.
examples:
- She put on a cork jacket before getting into the boat.
- The old cork jacket kept him afloat until help came.
