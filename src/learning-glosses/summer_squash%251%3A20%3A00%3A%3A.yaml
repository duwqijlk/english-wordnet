simpleMeaning: Its fruit is eaten young before the skin or seeds turn hard, and this is one of many kinds
  of plant, usually bushy, that bears it.
scope: Also called summer squash vine, this is the plant, not the fruit it bears, usually bushy and bearing
  fruit eaten young.
examples:
- The summer squash bore fruit while it was still young.
- They picked fruit from the summer squash before the skin turned hard.
