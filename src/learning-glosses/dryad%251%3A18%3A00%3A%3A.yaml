simpleMeaning: a female god or spirit who lives in the woods, in old stories
scope: This is a being from old stories who lives in the woods, not a real person and not a plant or animal.
examples:
- In the old story, a dryad lived inside the big oak tree.
- The dryad watched over the trees and kept the woods safe.
