simpleMeaning: how pure and strong a colour is, with no white mixed in, so the colour looks bright and
  clear
scope: 'About colour only: how pure and bright a colour is with no white in it. Not the amount of energy
  sent out, and not a high level or strong degree of something.'
examples:
- The intensity of the pure blue, with no white mixed in, makes the painting look strong.
- She chose a paint with high colour intensity so the red would look bright, not pale.
