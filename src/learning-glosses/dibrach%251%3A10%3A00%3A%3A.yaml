simpleMeaning: a unit of verse made of two syllables with no stress on either one
scope: A unit of verse made of two unstressed syllables, also called pyrrhic, and not a unit with a stressed
  syllable and not a single word.
examples:
- The line opens with a dibrach, two syllables with no stress before the beat.
- A dibrach has no stress on either of its two syllables.
