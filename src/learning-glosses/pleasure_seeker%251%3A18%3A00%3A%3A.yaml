simpleMeaning: A person whose wants push them toward the joys of the body
scope: Also called a pagan or a hedonist, this is a person whose wants push them toward the joys of the
  body, not a person who seeks thrills through danger and not a person who lives only for work.
examples:
- He was known as a pleasure seeker, always chasing the pleasures of the body.
- The pleasure seeker spent all his money on rich food, fine wine and other pleasures of the body.
