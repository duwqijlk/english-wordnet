simpleMeaning: so firmly fixed that it cannot be changed at all
scope: This sense is about a rule or custom that cannot be changed, not the old warship covered in iron
  or steel.
examples:
- The club has an ironclad rule that no member may bring guests.
- Their ironclad custom had not changed for a hundred years.
