simpleMeaning: one of several plants from the United States with long stalks of white or yellow flowers
  shaped like funnels
scope: A plant from the United States with long stalks of white or yellow flowers shaped like funnels,
  not a tree and not a plant with round flat flowers.
examples:
- The chaenactis grew along the dry path with white flowers.
- We saw a chaenactis with yellow flowers on long stalks.
