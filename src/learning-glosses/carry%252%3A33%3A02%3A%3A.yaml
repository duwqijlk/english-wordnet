simpleMeaning: Gain the approval that lets a bill or formal proposal be adopted.
scope: A bill or formal proposal getting enough votes; not a candidate winning an election, and not the
  arithmetic, scent-hunting, weak-teammate, or sailing senses in this set.
examples:
- The motion carried easily after a short debate.
- The housing bill carried by only three votes.
