simpleMeaning: The act of bringing something back into use after a time when it was not used or not active
scope: This is a thing or idea coming back into use after a time when it was not used or not active; it
  is not a dead person coming back to life.
examples:
- The old band's return led to a resurrection of interest in their music.
- There has been a resurrection of hope in the town since the factory reopened.
