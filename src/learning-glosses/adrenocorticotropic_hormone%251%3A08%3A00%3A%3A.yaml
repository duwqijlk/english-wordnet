simpleMeaning: From the front part of the small gland at the base of the brain comes this messenger, which
  wakes the outer layer of the gland above the kidney into work.
scope: This is also called adrenocorticotrophic hormone, adrenocorticotrophin, adrenocorticotropin, corticotrophin,
  and corticotropin, and it acts on the gland above the kidney, not on the kidney itself.
examples:
- Adrenocorticotropic hormone woke the outer layer of the gland above the kidney.
- The test found adrenocorticotropic hormone acting on the gland above the kidney.
