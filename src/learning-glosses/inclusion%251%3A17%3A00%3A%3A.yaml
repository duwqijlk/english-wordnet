simpleMeaning: any tiny body that turns up inside a living thing's cell and points to certain diseases
scope: A tiny body inside another cell, a sign of certain diseases, not the act of including something
  and not the state of being included.
examples:
- An inclusion in the cytoplasm of the cell showed up under the microscope.
- The lab found an inclusion inside one of the patient's cells.
