senseId: 'atropine%1:06:00::'
synsetId: 02757761-n
simpleMeaning: A poisonous chemical from plants of the nightshade family, used to ease muscle spasms and
  widen the eye pupil; large doses treat poisoning by some nerve agents and insecticides.
scope: The chemical as a medicine, not the nightshade plants it is obtained from or the poisons it counteracts.
examples:
- The doctor used atropine to widen her pupil during the eye exam.
- Atropine is given in large doses to treat poisoning from certain insecticides.
