simpleMeaning: One of a group of compounds that act on the nerves and, in large amounts, harm the brain
  and spinal cord by overexciting them, such as glutamate and aspartame
scope: This is one of the compounds that harm the nerves by overexciting them when taken in large amounts.
examples:
- Too much of the excitotoxin harmed the brain and spinal cord.
- Glutamate can act as an excitotoxin in high amounts.
