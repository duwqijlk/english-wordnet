simpleMeaning: about the way of thinking that judges ideas by their real results in practice
scope: 'Also called pragmatical: this sense is about a set of ideas about truth and real results, not
  being guided by what works in practice and not a ruler''s order that becomes law.'
examples:
- Her book gives a pragmatic view of truth, based on results in real life.
- The class read a pragmatic essay on how ideas are judged by their effects.
