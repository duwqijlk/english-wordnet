simpleMeaning: In statistics, one of 99 numbered points that cut a list of scores in order into 100 equal
  parts, each holding a hundredth of all the scores.
scope: Also called a centile, in statistics, one of 99 numbered points that cut a list of scores in order
  into 100 equal parts.
examples:
- Her score fell at the 90th percentile of the class.
- The percentile shows where a score stands among all the rest.
