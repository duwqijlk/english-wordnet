simpleMeaning: to feel happy and well inside, as when you are in good health or when a strong feeling
  moves you
scope: 'Also called glow and shine: to feel happy and well inside; not to smile with joy, and not a bar
  of wood or a line of light.'
examples:
- After the good news about her health, she beamed all day.
- He beamed with happiness when he held his new baby.
