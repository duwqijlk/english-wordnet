simpleMeaning: not healthy in the body, or ill with a disease
scope: 'Also called bad, and another name for this sense is unfit: this is about a body or a part of it
  not being healthy, not about the mind being very ill.'
examples:
- He has an unsound heart and needs rest.
- Her unsound teeth hurt when she eats.
