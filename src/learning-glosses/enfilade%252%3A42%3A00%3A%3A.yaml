simpleMeaning: to fire guns along the length of a line, or to be in a place from which you can fire that
  way
scope: To fire guns along the length of a line, or to be placed so you can, not to fire at it head-on
  and not the firing itself.
examples:
- The guns enfiladed the trench from one end to the other.
- Our troops could enfilade the whole line from the hill.
