simpleMeaning: in the usual way; in the way things are normally done as a set practice
scope: Done in the normal, set way of doing things; not done just once in a while, and not done in a new
  or chance way.
examples:
- The nurse routinely checks each patient's temperature in the morning.
- Buses on this road routinely stop at the small village.
