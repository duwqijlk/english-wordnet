simpleMeaning: a type or kind of thing, grouped because its members share a quality
scope: This is a type or kind of thing, not a mixed collection of things and not a show of short separate
  acts.
examples:
- Sculpture is a variety of art that has existed for thousands of years.
- This variety of music is popular with teenagers.
