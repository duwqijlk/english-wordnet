simpleMeaning: A strong pressure group that speaks up for the right to own and carry guns and fights any
  gun rules made by the government.
scope: This is a strong pressure group that speaks up for the right to own and carry guns and fights any
  gun rules made by the government, also called the National Rifle Association; not other pressure groups
  and not the government itself.
examples:
- The NRA opposes new gun laws.
- The NRA says owning guns is a right.
