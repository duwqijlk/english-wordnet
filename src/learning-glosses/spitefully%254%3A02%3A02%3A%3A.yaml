simpleMeaning: in a cruel way that wants to do real harm to someone
scope: This sense is the stronger, cruel sense, done with a wish to do real harm; it is not just a way
  that wants to hurt or upset someone.
examples:
- He spitefully spread a false story to ruin her good name.
- They spitefully broke his tools so he could not do his work.
