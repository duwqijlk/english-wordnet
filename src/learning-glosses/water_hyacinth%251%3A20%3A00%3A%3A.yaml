simpleMeaning: Blocking rivers and canals, especially in the southern United States, is a plant of warm
  lands that floats with spikes of large blue blooms.
scope: Also called water orchid, it is the floating plant of warm lands with spikes of large blue blooms,
  unlike a plant that stays rooted in the ground.
examples:
- The water hyacinth floated with spikes of large blue blooms.
- Water hyacinths blocked rivers and canals, especially in the southern United States.
