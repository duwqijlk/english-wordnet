simpleMeaning: a part of a thing that sticks out past the edge of what lies under it
scope: The part of a thing that sticks out past the edge of the thing below it, not a ledge or shelf and
  not the act of putting one thing over another.
examples:
- The overhang of the roof kept the rain off the wall.
- He sat under the overhang of the rock to get out of the sun.
