simpleMeaning: Clothes put on to hide who you are at a party where people wear masks
scope: 'Also called a masquerade and a masquerade costume: clothes worn to hide who you are at a masked
  party, not everyday clothes and not a uniform.'
examples:
- She wore a fancy dress as a pirate to the party.
- He rented a fancy dress for the masquerade ball.
