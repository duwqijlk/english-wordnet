simpleMeaning: a tool that measures how much room gases, liquids, or solids take up, straight off or by
  the amount they push aside
scope: A tool that measures how much room gases, liquids or solids take up; not a scale for weight and
  not a ruler for length.
examples:
- The volumeter showed how much room the gas took up.
- She used a volumeter to measure the solid by the amount it pushed aside.
