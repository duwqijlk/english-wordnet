simpleMeaning: A part of a bigger thing that hangs together as one line of its own, like one tune inside
  a piece of music
scope: One line that holds together inside a bigger whole, not a thread, not a shore and not a necklace.
examples:
- He tried to pick up the strands of his former life.
- I could hear several melodic strands simultaneously.
