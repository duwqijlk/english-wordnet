simpleMeaning: The largest hare of the northern plains and western mountains of the United States, brownish-grey
  in summer and pale grey in winter, with a tail nearly always all white.
scope: 'Also called white-tailed jackrabbit and whitetail jackrabbit: the largest hare of the northern
  plains and western mountains, not a rabbit and not a hare of the south.'
examples:
- A Lepus townsendi sat in the grass, its tail showing white.
- In winter the Lepus townsendi turns pale grey.
