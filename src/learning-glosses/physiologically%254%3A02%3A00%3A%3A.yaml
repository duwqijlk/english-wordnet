simpleMeaning: in a way that has to do with how the bodies of living things work
scope: This is about how the body works, not about thoughts or feelings, and not just about the body's
  outside shape.
examples:
- The baby is now physiologically ready to breathe on her own.
- He became physiologically addicted to nicotine, and his body craved it.
