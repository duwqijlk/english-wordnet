simpleMeaning: In physics, the tilt a magnetic needle makes with the flat line where earth and sky meet
scope: In physics, the tilt of a magnetic needle from the flat line where earth and sky meet; dip, inclination,
  magnetic dip and magnetic inclination are other names for this sense, not the tilt of a hill and not
  the turning of a compass needle.
examples:
- The angle of dip is steep near the North Pole.
- He measured the angle of dip with a compass needle.
