simpleMeaning: A bond of chem where one atom drops an electron and turns plus, while the other atom picks
  up an electron, turning minus.
scope: This sense is also called electrostatic bond and ionic bond, a bond of chem where one atom drops
  an electron and turns plus, while the other atom picks up an electron, turning minus.
examples:
- Electrovalent bonds swap electrons.
- The electrovalent bond turns atoms into ions.
