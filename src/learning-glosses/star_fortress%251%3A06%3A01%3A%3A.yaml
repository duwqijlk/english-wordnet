simpleMeaning: Three-sided points stick out and guard one another round a stronghold, five to eight in
  most cases; it was first built in Italy in the middle of the 1400s.
scope: Also called bastion fort, star-shaped fortress, star fort, and trace italienne, it is a stronghold
  with points that guard one another, not a plain wall with no points.
examples:
- Star fortresses were used in the defensive works of Florence.
- They repaired the walls of the star fortress.
