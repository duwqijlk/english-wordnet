simpleMeaning: a mark put on a thing that people buy and sell, to show where it comes from and that it
  is real
scope: Also called authentication; this is a mark on a thing that people buy and sell. Not a special quality
  that makes a person or thing stand out from others.
examples:
- The silver cup bears a hallmark that shows where it was made.
- She checked the hallmark on the gold ring to see that it was real.
