simpleMeaning: In law, a claim in court that puts forward facts so far apart that it is hard to tell which
  ones the person will stand on.
scope: In law, a claim in court that puts forward facts so far apart that it is hard to tell which ones
  the person will stand on, also called pleading in the alternative; not a plain claim and not a claim
  made after the trial.
examples:
- The lawyer filed an alternative pleading with two sets of facts.
- An alternative pleading left the court unsure which facts to weigh.
