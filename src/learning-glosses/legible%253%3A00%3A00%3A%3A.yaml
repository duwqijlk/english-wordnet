simpleMeaning: 'of handwriting, print and the like: clear enough for a person to read'
scope: This is about writing that is clear enough to read; it is not about a book that is good or easy
  to read for pleasure, and not about speech that is easy to hear.
examples:
- Her handwriting is small but quite legible.
- Please write the address in large, legible letters.
