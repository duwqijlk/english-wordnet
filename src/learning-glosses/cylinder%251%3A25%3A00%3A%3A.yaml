simpleMeaning: A round surface made by turning a line that stays the same distance from a fixed line,
  round and round it
scope: A curved surface made by a turning line, not the hollow space in an engine and not a solid round
  block.
examples:
- In maths class we drew a cylinder made by turning a straight line around a fixed line.
- The cylinder in the diagram is just a surface, not a solid shape.
