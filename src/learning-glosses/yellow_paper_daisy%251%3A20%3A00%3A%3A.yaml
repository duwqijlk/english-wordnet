simpleMeaning: often picked by people who love dried blooms, this plant from Australia now grows wild
  in Spain, with blooms from pale gold to deep gold
scope: This plant, also called golden everlasting and strawflower, is often picked for its blooms by people
  who love them dried.
examples:
- The yellow paper daisy now grows wild in Spain, far from Australia.
- She picked a yellow paper daisy to dry, since she loves dried blooms.
