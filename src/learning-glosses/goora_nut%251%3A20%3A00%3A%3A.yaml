simpleMeaning: The source of the stuff that gives cola drinks their flavour, a tree that bears large brown
  seeds holding such things as caffeine.
scope: Also called kola, kola nut and kola nut tree, it names the tree whose seeds give cola drinks their
  flavour.
examples:
- The goora nut tree bore large brown nuts.
- Goora nuts give the extract used in cola drinks.
