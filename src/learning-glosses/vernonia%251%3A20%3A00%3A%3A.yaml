simpleMeaning: any of several plants of warm and tropical lands, above all North America, named for their
  loose heads of purple to pink flowers that soon turn rusty brown
scope: 'Also called ironweed: a plant of warm and tropical lands, above all North America, named for its
  loose purple-to-pink flower heads; not a single kind of plant.'
examples:
- Vernonia grows wild across the warm fields of North America.
- The vernonia by the road had heads of purple flowers turning rusty.
