simpleMeaning: To shape metal or glass by rolling it, stretching it, or pulling it through a die, a hard
  block with a shaped hole.
scope: This is shaping solid metal or glass by force, not thinning a wire through a die and not causing
  a reaction from an audience.
examples:
- The factory draws steel into long thin sheets.
- The craftsman drew the molten glass into a slender rod.
