simpleMeaning: A spreading plant grown in warm regions in place of grass; it lives for years and has hairy
  stems, rounded or kidney-shaped leaves and tiny white or greenish flowers.
scope: A spreading ground-cover plant, not a true grass.
examples:
- Dichondra makes a soft green carpet between the paving stones.
- They planted dichondra instead of grass in the shady yard.
