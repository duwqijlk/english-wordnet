simpleMeaning: A fixed set of names for the notes of a scale — do, re, mi, fa, sol, la, ti — used to sing
  each note by name.
scope: Also called solfa, this is a fixed set of names for the notes of a scale, used to sing each note
  by its name.
examples:
- The choir learned the tonic solfa names before the concert.
- She sang the scale in tonic solfa, do to ti.
