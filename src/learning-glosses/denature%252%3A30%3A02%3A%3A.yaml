scope: To mix material that cannot split into matter for an atomic bomb so the bomb cannot be made to
  work; not making alcohol unfit to drink and not changing a protein.
examples:
- They denature the uranium so it cannot be used in a bomb.
- The treaty requires states to denature their bomb material.
