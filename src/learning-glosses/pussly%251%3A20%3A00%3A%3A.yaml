simpleMeaning: Growers raise a spreading, carpeting weed for mildly sharp leaves, eaten raw or cooked,
  especially in Indian, Greek and Middle Eastern meals; it has bright yellow flowers and grows worldwide.
scope: A variant spelling of the same edible weed called common purslane, not a different plant and not
  a decorative flower.
examples:
- The gardener's note called the weed pussly.
- Pussly appeared in the bare patch of soil after the rain.
