simpleMeaning: to make something stronger, more felt, or more clear
scope: 'Also called deepen, intensify and heighten: to make a feeling or effect stronger, not a walled
  place with buildings and not a substance or word made of parts.'
examples:
- His silence compounded her anger.
- The bad news compounded their money problems.
