simpleMeaning: In art, the part of thinking about beauty and taste, with weight on the rules used to judge
  works of art.
scope: In art, the study of beauty and taste, also called aesthetics; not the making of art and not a
  list of art styles.
examples:
- Her course in esthetics asks what makes a work of art good.
- Esthetics gives us the rules by which we judge beauty in art.
