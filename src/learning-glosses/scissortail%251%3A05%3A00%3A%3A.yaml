simpleMeaning: A gray bird that catches flies, from the southwest United States through Mexico to Central
  America, bearing a long split tail, white chest, and salmon-scarlet marks.
scope: This sense is also called scissor-tailed flycatcher and scissortailed flycatcher, for a gray bird
  that catches flies, from the southwest United States through Mexico to Central America.
examples:
- Scissortails flash long split tails.
- The scissortail sang in Mexico.
