schema: oewn-learning-gloss-v2
senseId: 'puppet_state%1:14:00::'
synsetId: 08195239-n
simpleMeaning: A government set up by a power from another land, which tells it what to do and may make
  life hard for the people
scope: A government set up by a foreign power, not a government that rules itself; puppet government and
  puppet regime are other names for this sense.
examples:
- The puppet state followed orders from abroad.
- Trade stopped when the puppet state was put in place.
