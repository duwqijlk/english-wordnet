senseId: reversible%5:00:00:changeable:00
synsetId: 00347728-s
simpleMeaning: Of a thing that can be in either of two states, or can bring either one about.
scope: Of a thing that can be in either of two states or bring either one about, not a coat that can be
  worn inside out, not a garment that can be used with either side out, not a thing that can simply turn
  back or be turned back, and not a decision or order that can be taken back.
examples:
- The reaction was reversible, and it could run in either direction.
- The battery was reversible, and it could give out power or take it back in when it charged.
