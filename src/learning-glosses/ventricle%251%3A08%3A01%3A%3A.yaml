simpleMeaning: a part inside the heart that gets blood from another part (an atrium) and pushes it into
  tubes (arteries) that carry blood away
scope: A part of the heart for moving blood, also called heart ventricle; not one of the spaces inside
  the brain.
examples:
- The left ventricle pushes blood out to the rest of the body.
- A weak ventricle can make the heart work less well.
