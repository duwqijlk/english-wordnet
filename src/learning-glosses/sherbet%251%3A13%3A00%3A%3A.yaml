simpleMeaning: a frozen sweet food made mainly from fruit juice and sugar, and also with milk, egg white
  or gelatin (a clear substance used to make liquids firm)
scope: Also called sherbert. This is a frozen sweet food made mainly from fruit juice, not ice cream,
  which is made mainly from cream.
examples:
- We had lemon sherbet after dinner.
- She chose orange sherbet because she wanted a light, fruity frozen sweet.
