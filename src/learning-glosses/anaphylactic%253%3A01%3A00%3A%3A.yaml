simpleMeaning: related to anaphylaxis, a very strong and dangerous reaction of the body to something it
  is very sensitive to
scope: This is about the strong, dangerous body reaction called anaphylaxis, not about a mild allergy
  or a slight sensitivity to a food or a drug.
examples:
- He went into anaphylactic shock minutes after eating the nuts.
- The nurse treated her at once for an anaphylactic reaction to the bee sting.
