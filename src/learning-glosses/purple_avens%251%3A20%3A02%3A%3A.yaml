simpleMeaning: a North American plant that lives for years, with hairy leaves at the base made of small
  leaflets, purple flowers, and fruits tipped with soft plumes
scope: 'Also called prairie smoke: a North American plant with hairy leaves at the base, purple flowers
  and plume-tipped fruit, not the other purple avens of the north temperate zone with nodding brown-purple
  flowers.'
examples:
- Purple avens grew in the meadow, its purple flowers bright against the grass.
- The purple avens fruits were tipped with soft plumes that caught the wind.
