simpleMeaning: to pick out one thing or person from two or more possible ones because you want that one.
scope: It is not simply liking one thing best, and it is not the act of voting; it is deciding on one
  option from a set of possibilities.
examples:
- You can choose any three books from the shelf.
- She chose to walk home instead of taking the bus.
