simpleMeaning: The state of being set in layers of rank within a group.
scope: The state of being set in layers of rank within a group; not the placing of seeds in damp sand,
  or sawdust, or peat moss, to keep them or help them sprout, nor the act or course of sorting folk into
  ranks or layers of society, nor the forming or laying down of layers.
examples:
- Their stratification shaped the town.
- The stratification of the firm was plain.
