simpleMeaning: a person who has very strong views that are far from the views of most people
scope: This is a person with very strong views far from most people, not a person who just disagrees or
  holds a strong view on one small point.
examples:
- The extremist refused to listen to anyone with different views.
- An extremist spoke at the meeting and called for total change at once.
