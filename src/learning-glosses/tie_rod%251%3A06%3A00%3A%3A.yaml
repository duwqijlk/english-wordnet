simpleMeaning: one of two bars that join the steering parts to the front wheels
scope: A bar that joins the steering parts to the front wheels, not a bar that joins other parts of the
  car.
examples:
- The mechanic found that a tie rod was bent and had to be changed.
- One tie rod links the steering gear to a front wheel.
