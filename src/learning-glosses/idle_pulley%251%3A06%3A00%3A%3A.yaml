simpleMeaning: A wheel on a rod that pushes on a moving band to steer it or keep it tight.
scope: A wheel on a rod that pushes on a moving band to steer it or keep it tight; idle wheel and idler
  pulley are other names for it, not a wheel that drives a machine and not a wheel that carries a load.
examples:
- The idle pulley keeps the belt pulled tight on the shaft.
- A worn idle pulley made the belt slip.
