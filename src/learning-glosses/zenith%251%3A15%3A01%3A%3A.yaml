synsetId: 08702507-n
simpleMeaning: the point in the sky straight above a person, opposite the point straight below them, on
  an imagined ball where the sun, moon, stars and planets seem to lie
scope: The point in the sky straight above you, not the point straight below you and not the highest point
  in a person's success or power.
examples:
- At noon the sun was close to its zenith.
- They watched the bright star reach the zenith.
