senseId: 'acetylize%2:30:01::'
synsetId: 00525163-v
simpleMeaning: to put an acetyl group, a small part made of carbon, hydrogen and oxygen, into a chemical
  compound
scope: To add a chemical part to a compound, not to take one out or to change the whole compound; acetylate
  and acetylise are other names for this sense.
examples:
- The chemist will acetylize the compound before testing it.
- They acetylized the sample to change how it reacts.
