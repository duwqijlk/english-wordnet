simpleMeaning: To pay a debt that has not been paid, the sheriff sells what a person owns under a court
  order.
scope: Also called forced sale, judicial sale, and sheriff's sale, this is a sale of what a person owns,
  made by the sheriff under a court order to pay a debt that has not been paid.
examples:
- The house was sold at an execution sale to pay the debt.
- The sheriff held an execution sale under the court order.
