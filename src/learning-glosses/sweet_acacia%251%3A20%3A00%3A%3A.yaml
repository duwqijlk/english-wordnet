simpleMeaning: Warm America is home to a thorny bush or small tree, whose yellow flowers smell nice and
  are used to make scents.
scope: Cassie, flame tree, huisache, mimosa bush, scented wattle, and sweet wattle are other names for
  this thorny bush or small tree of warm America, whose yellow flowers smell nice and are used to make
  scents.
examples:
- Yellow flowers covered the sweet acacia in bloom.
- A sweet acacia stood at the edge of the field.
