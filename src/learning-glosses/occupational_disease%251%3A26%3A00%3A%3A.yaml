simpleMeaning: A person sick or hurt by the conditions of the job usually spent a long time with a harmful
  stuff or kept doing the same acts over and over.
scope: 'Also called industrial disease: a sickness or harm that comes from the conditions of a job.'
examples:
- His occupational disease came from years of breathing dust at work.
- An occupational disease can come from doing the same acts over and over.
