simpleMeaning: 'a right set down in the 4th change to the US Constitution: the state may not look through
  a person''s things or take them away'
scope: The right that stops the state looking through your things or taking them, not the right to keep
  and carry weapons and not the right against harsh acts by the state.
examples:
- The freedom from search and seizure is one of the rights in the US Constitution.
- The court said the freedom from search and seizure protects people from police searches.
