simpleMeaning: a pretty thing added, usually at the edge of a piece of clothing, to make it look better
scope: 'Also called trim: a pretty thing on the edge of clothing, not a small cut that makes hair or cloth
  shorter, and not extra food served with a main dish.'
examples:
- The trimming on her hat is made of red ribbon.
- This dress has gold trimming around the neck.
