simpleMeaning: describing a person or thing that people feel sorry for, or should feel sorry for
scope: 'Also called poor, miserable, wretched, pathetic, pitiful, hapless, piteous and misfortunate: in
  a sad, bad state that makes people feel sorry, not the sense where a person also makes people look down
  on them.'
examples:
- The pitiable children had no home and no food.
- He lived in a pitiable state, alone and with very little money.
