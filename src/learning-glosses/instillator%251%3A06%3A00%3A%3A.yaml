simpleMeaning: A tool used in medicine that puts liquid into a hollow place in the body, a drop at a time
scope: A medical tool that puts liquid into a body cavity a drop at a time; not the act of putting the
  liquid in and not a tool for a fast flow.
examples:
- The nurse used the instillator to put the drops into the ear, one at a time.
- He filled the instillator with the medicine before the treatment.
