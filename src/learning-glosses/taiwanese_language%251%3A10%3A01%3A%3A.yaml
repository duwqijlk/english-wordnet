simpleMeaning: Any of the tongues of Chinese spoken in Fukien province.
scope: Also called Min, Amoy, Amoy language, Fukien, Fukien language, Fukkianese, Fukkianese language,
  Hokkianese, Hokkianese language, Min dialect, Min language, and Taiwanese; any form of Chinese spoken
  in Fukien province, not the Chinese of other parts of China.
