simpleMeaning: a post of wood, steel, or concrete (a hard grey building material), driven into the ground
  to hold up a structure
scope: A post driven into the ground to hold up a structure; pile and piling are other names for this
  sense, not a pole for walking on, and not a long-legged bird.
examples:
- The house on stilts stood on tall wooden posts above the flood water.
- Workers drove a stilt deep into the riverbed to hold up the pier.
