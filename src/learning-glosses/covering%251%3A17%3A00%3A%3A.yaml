simpleMeaning: A thing found in nature that lies over or around something else
scope: Also called cover, this is a thing found in nature that lies over or around something else, not
  a made thing that lies over something, and not the act of hiding a thing.
examples:
- A covering of dust lay over the old books.
- The fox ran from its covering of thick grass.
