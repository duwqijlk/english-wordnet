simpleMeaning: A skilled worker who puts in and looks after machines that move air, give off heat, or
  keep things cold
scope: A skilled worker who puts in and looks after machines that move air, give off heat, or keep things
  cold; not a worker who builds the machines and not a cleaner.
examples:
- The steamfitter fixed the pipes that warm the building.
- A steamfitter put in the new heating machines.
