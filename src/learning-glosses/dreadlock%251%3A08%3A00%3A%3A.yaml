simpleMeaning: one of many long thin braids of hair that spread out from the head, made well known by
  Rastafarians
scope: One long thin braid of hair in this style, not loose hair and not one thick braid that covers the
  whole head.
examples:
- He wears his hair in long dreadlocks.
- One dreadlock fell over her shoulder.
