simpleMeaning: In slang, a seller who deals in poor, cheap goods.
scope: In slang, a seller who deals in poor, cheap goods, also called shlockmeister; not an honest trader
  of good goods and not a pawnbroker who lends money on goods.
examples:
- The old schlockmeister sold broken radios as new.
- Buyers soon learned the schlockmeister's goods were shoddy.
