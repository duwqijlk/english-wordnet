simpleMeaning: This small Eurasian bush bears bunched yellow flowers that give a colouring, often growing
  wild in Britain and the United States and at times grown for show.
scope: People also call it whin, dyer's-broom, dyer's greenweed, greenweed, woadwaxen, and woodwaxen;
  the names all mark one small bush of Europe and Asia, known by its bunched yellow flowers and its weed
  growth in Britain and the United States.
examples:
- The dyeweed bears bunched yellow flowers.
- Dyeweed grows as a weed in Britain and the United States.
