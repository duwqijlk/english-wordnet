simpleMeaning: a side branch of the liver blood tube that feeds the lower end of the stomach on its inner
  curve
scope: 'Also called right gastric artery: a branch of the liver blood tube feeding the lower end of the
  stomach, not the main liver blood tube itself.'
examples:
- The arteria gastrica dextra supplies the lower part of the stomach.
- Surgeons tied off the arteria gastrica dextra during the operation.
