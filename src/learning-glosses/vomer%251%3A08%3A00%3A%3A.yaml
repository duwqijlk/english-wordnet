simpleMeaning: Between the nostrils runs a wall whose back and lower parts are made by this thin four-sided
  bone of the skull.
scope: A thin bone of the skull forming the back and lower parts of the wall between the nostrils; not
  the bridge of the nose.
examples:
- The vomer forms the lower back part of the nasal septum.
- A break in the vomer can bend the wall between the nostrils.
