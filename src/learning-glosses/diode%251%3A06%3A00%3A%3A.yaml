simpleMeaning: A small part made of joined layers that lets an electric current pass in one direction
  only.
scope: Also called a crystal rectifier or a junction rectifier; a semiconductor part that lets current
  pass one way only, not the old tube with two electrodes.
examples:
- The diode in the radio let current flow in one direction only.
- He replaced a burnt-out diode on the circuit board.
