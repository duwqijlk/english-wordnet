simpleMeaning: a reason based on clear thought that leads a person to think or do a thing
scope: 'Also called ground and reason: a reason in the mind for a thought or an act, not a formal social
  meeting and not the act of causing a thing.'
examples:
- There was no occasion for such fear.
- He saw no occasion to leave early.
