simpleMeaning: anger that a person feels because something troubles or annoys them
scope: Also called annoyance and chafe, this is the anger a person feels when something troubles them;
  it is not the state of mind of feeling troubled and angry, and not the person or thing that causes the
  trouble.
examples:
- To his vexation, the train was late again.
- She felt great vexation at the constant noise from next door.
