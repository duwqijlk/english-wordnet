senseId: 'punctuation%1:04:00::'
synsetId: 00391006-n
simpleMeaning: In writing, certain marks are used to group words by the rules of language into sentences,
  clauses and phrases, so the meaning is clear
scope: This is the act of using marks in writing to make meaning clear, not the marks themselves and not
  a thing that breaks something up again and again.
examples:
- She put in commas and a full stop as punctuation, and her long sentence became clear at once.
- The teacher taught punctuation by showing how marks put words into groups.
