simpleMeaning: A member of the branch of Islam that sees Ali as the true successor to Mohammed and rejects
  the first three caliphs
scope: Also called Shi'ite, Shi'ite Muslim, Shia Muslim and Shiite Muslim; a member of the branch of Islam
  that sees Ali as the true successor to Mohammed, not a member of the branch that accepts the first three
  caliphs.
examples:
- The Shiite shopkeeper closed his shop for prayer.
- Shiite scholars trace their line back to Ali.
