simpleMeaning: In war at sea, a fighting side may halt ships from lands not in the war and look through
  them
scope: In war at sea, a fighting side may halt ships from lands not in the war and look through them,
  not a right to sink such ships and not a right to halt ships of one's own side.
examples:
- The navy used its right of search to board the merchant ship.
- Under the right of search, warships stopped the freighter and looked through its cargo.
