simpleMeaning: trousers made from a soft light wool cloth, gabardine, tweed, or white cloth, most often
  spoken of in the plural
scope: 'Also called white and tweed: trousers of the named cloths, usually in the plural; not the soft
  cloth itself and not the washcloth.'
examples:
- He wore grey flannels to the office.
- The shop sold flannels in gabardine and tweed.
