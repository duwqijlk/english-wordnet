simpleMeaning: a dishonest act in court, using false papers, false claims, or lies under oath, that tricks
  the court or jury into ruling for the person who did it
scope: A dishonest trick in court that wins a ruling for the person who did it, not other kinds of cheating
  that mislead people outside a court.
examples:
- The lawyer said the forged papers were intrinsic fraud, since they misled the jury.
- His intrinsic fraud won him the ruling, but the court later found the claims were false.
