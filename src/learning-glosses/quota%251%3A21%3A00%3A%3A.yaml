senseId: 'quota%1:21:00::'
synsetId: 13310767-n
simpleMeaning: The part of a whole, worked out by size or number, that is set for each one who takes part
scope: The part of a whole, worked out by size or number, that is set for each one who takes part; not
  an equal share for all, and not a fixed amount with no rule behind it.
examples:
- Each country was given a quota of fish it could catch that year.
- Each team was given a quota of tickets based on its size.
