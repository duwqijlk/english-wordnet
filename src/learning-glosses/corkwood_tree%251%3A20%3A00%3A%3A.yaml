simpleMeaning: a tiny woody plant that loses its leaves in winter, with male and female flowers on separate
  plants and very light wood, from damp places in the south-eastern US
scope: A tiny woody plant that loses its leaves in winter, with male and female flowers on separate plants
  and very light wood, from damp places in the south-eastern US; corkwood is another name for this sense,
  not a plant with heavy wood, and not a plant of dry ground.
examples:
- The corkwood tree grew in the damp hollow behind the house.
- Its wood was so light that a branch of the corkwood tree floated on the pond.
