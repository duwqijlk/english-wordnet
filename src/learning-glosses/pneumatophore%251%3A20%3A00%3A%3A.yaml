simpleMeaning: A plant of wet or swampy ground breathes through a root full of air, under water or out
  in the open.
scope: This root full of air is set apart from other roots by working as the breathing part of a plant
  of wet or swampy ground.
examples:
- The pneumatophore is full of air.
- The marsh plant breathes through its pneumatophores.
