simpleMeaning: a worker paid to do the small everyday jobs in a home
scope: A worker paid to do the small everyday jobs in a home, also called a domestic or a house servant,
  and not a cook hired for one meal or a gardener.
examples:
- The family hired domestic help to clean the house each week.
- Our domestic help does the washing and the cooking.
