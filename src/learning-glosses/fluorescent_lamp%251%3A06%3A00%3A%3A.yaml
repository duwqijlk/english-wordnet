senseId: 'fluorescent_lamp%1:06:00::'
synsetId: 03375233-n
simpleMeaning: A light fitting with a tube whose inner wall is coated in a glowing material; mercury vapor
  inside gives off ultraviolet rays that the coating turns into visible light.
scope: The whole fitting with its coated tube; not the removable tube on its own and not an old-style
  incandescent bulb.
examples:
- A long fluorescent lamp hangs above the kitchen counter.
- He swapped the flickering fluorescent lamp in the hallway for a new one.
