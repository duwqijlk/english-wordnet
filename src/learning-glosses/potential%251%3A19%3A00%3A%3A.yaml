simpleMeaning: the electrical force between two points in a circuit, measured in volts
scope: This is not a person's ability or a chance that something may happen; it is a measure in electricity.
examples:
- The meter showed a potential of twelve volts across the battery.
- A high potential between the wires can be dangerous.
