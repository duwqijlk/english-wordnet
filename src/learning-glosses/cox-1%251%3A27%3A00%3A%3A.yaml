simpleMeaning: A body substance that controls the fatty substances (prostaglandins) that keep the stomach
  lining and kidneys healthy
scope: Also called cyclooxygenase-1, it works inside the body, controlling fatty substances that protect
  the stomach lining and kidneys.
examples:
- Some pain drugs block Cox-1, which can upset the stomach.
- Cox-1 helps keep the stomach lining healthy.
