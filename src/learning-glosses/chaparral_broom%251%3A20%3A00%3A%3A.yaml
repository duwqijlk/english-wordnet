simpleMeaning: The flower heads of this green bush of the southwest United States sit in leafy clusters,
  and the plant spreads wide and keeps its leaves all year.
scope: 'Also called coyote brush, coyote bush and kidney wort: a wide-spreading bush of the southwest
  United States, distinct from other shrubs by its leafy flower heads.'
examples:
- The chaparral broom spread wide and stayed green through the year.
- Chaparral broom grows across the southwest United States.
