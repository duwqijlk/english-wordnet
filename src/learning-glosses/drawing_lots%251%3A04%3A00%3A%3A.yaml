simpleMeaning: Making a choice by chance with small objects such as straws or pebbles that are thrown
  or picked.
scope: Making a choice by chance with small objects such as straws or pebbles; casting lots is another
  name for this sense, not a vote and not a guess.
examples:
- They settled the matter by drawing lots.
- Drawing lots decided who would go first.
