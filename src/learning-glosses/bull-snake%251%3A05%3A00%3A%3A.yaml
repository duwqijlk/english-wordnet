simpleMeaning: Any one of several kinds of big, harmless North American burrowing animal that eats small
  gnawing animals
scope: Any one of several kinds of big, harmless North American burrowing animal; bull snake is another
  name for this sense, not a venomous animal and not a sea animal.
examples:
- The bull-snake slid into its burrow.
- A bull-snake eats rats and mice.
