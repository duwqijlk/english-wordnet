simpleMeaning: A sickness of the heart muscle (the myocardium), most often with no known cause.
scope: A sickness of the heart muscle, most often with no known cause; cardiomyopathy is another name
  for this, and it is not a heart attack or a sickness of the heart valves.
examples:
- Her myocardiopathy had no clear cause.
- Myocardiopathy weakens the heart muscle.
