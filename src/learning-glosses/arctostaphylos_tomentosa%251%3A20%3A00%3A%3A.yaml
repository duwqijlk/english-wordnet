simpleMeaning: An upright shrub of California, with open branches, whose young twigs are covered in soft
  wool-like hairs.
scope: This is an upright shrub of California with open branches, also called downy manzanita and woolly
  manzanita; not a low creeping shrub and not a tree.
examples:
- Arctostaphylos tomentosa grew upright on the hillside.
- The young twigs of Arctostaphylos tomentosa were woolly.
