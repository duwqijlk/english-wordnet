simpleMeaning: The set of laws that lays down the basic rules by which a country is governed
scope: The basic law of a country, not a person's build or health and not the way a thing is put together.
examples:
- The constitution gives every citizen the right to vote.
- Parliament changed the constitution to limit the president's powers.
