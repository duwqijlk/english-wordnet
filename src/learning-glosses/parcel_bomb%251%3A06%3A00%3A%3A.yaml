simpleMeaning: A thin bursting thing hidden in a letter cover or pack, set off when it is opened.
scope: A thin bursting thing hidden in a letter cover or pack, also called letter bomb and package bomb;
  not a hand grenade and not a mine.
examples:
- The parcel bomb went off when the clerk opened it.
- Police found a parcel bomb in the post room.
