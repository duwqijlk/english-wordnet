simpleMeaning: One of the Muslim people of north Africa, of mixed Arab and Berber blood, who took up Islam
  in the 8th century and took Spain in the 8th century.
scope: One of the Muslim people of north Africa, of mixed Arab and Berber blood, not an Arab alone and
  not a Berber alone.
examples:
- The Moor spoke Arabic and Berber.
- Moors ruled much of Spain for hundreds of years.
