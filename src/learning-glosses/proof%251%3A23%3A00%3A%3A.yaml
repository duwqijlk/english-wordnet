simpleMeaning: a strength rating for alcoholic drinks, equal to twice the percentage of alcohol they contain
  by volume.
scope: This is a strength rating for drink, not evidence that something is true and not a trial print.
examples:
- This whiskey is 90 proof, so it contains 45 percent alcohol.
- The bottle of rum is 80 proof, which is fairly strong.
