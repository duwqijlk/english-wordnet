simpleMeaning: to swing a fist or a foot at something, or away from the body
scope: To swing a fist or a foot at something or away from the body, not to hit and hurt someone and not
  a miss in baseball.
examples:
- He struck out at the wasp with his hand.
- She struck out with her foot when she tripped.
