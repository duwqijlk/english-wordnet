simpleMeaning: A handsome small tree or shrub from South America with bright scarlet flowers, valuable
  fine-grained yellowish wood, and a bitter drug taken from its wood and bark.
scope: This sense is the South American shrub or small tree with scarlet flowers and yellow wood; the
  plant called quassia is another name for it, and it is not the West Indian tree that yields Jamaica
  quassia nor the larger tropical American tree with pale yellow flowers.
examples:
- The bitterwood was covered in bright scarlet flowers in spring.
- A bitter drug is made from the bark of the bitterwood.
