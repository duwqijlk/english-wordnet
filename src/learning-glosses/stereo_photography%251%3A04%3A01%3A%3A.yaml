simpleMeaning: Picture-taking that makes flat pictures look deep and solid, by looking at two slightly
  different pictures of one thing at once through a special viewer
scope: Picture-taking that makes flat pictures look deep and solid, also called stereophotography and
  stereoscopic photography; not an ordinary flat photograph and not a moving picture.
examples:
- Stereo photography makes flat pictures look deep.
- They showed stereo photography at the show with a special viewer.
