synsetId: 03572246-n
simpleMeaning: a box that keeps a steady heat by using a thermostat (a part that controls heat), used
  for young chickens or for babies born too early
scope: Also called brooder; this box keeps a steady heat for young chickens or babies born too early,
  and it is not a chicken house and not a baby's bed.
examples:
- The baby born too early slept in an incubator that kept her warm.
- The farmer put the weak chicks in an incubator with a steady heat.
