simpleMeaning: One who gathers a thing in small bits, say news, slowly and with care.
scope: One who gathers a thing in small bits, say news, slowly and with care; not one who picks up grain
  left in the field by the harvesters.
examples:
- Their gleaner gathered the facts.
- The gleaner was seen at dawn.
