simpleMeaning: Pain in the chest, brought on when the muscles between the ribs swell up
scope: 'Another name for costalgia and pleuralgia: a pain in the chest from swollen muscles between the
  ribs, not a broken rib and not a pain in the heart.'
examples:
- His pleurodynia made his chest ache.
- The pleurodynia in her chest came from the swollen muscles between her ribs.
