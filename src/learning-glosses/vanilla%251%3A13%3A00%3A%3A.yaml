simpleMeaning: a thing put into food to give it a taste, made by soaking the beans of the plant in alcohol,
  or made to taste like them
scope: A flavouring made from the beans, not the plant itself and not the flavour of the beans.
examples:
- Add a few drops of vanilla to the cake mix.
- She used vanilla in the ice cream.
