simpleMeaning: A weak person with no taste or force who shows too much soft feeling
scope: A weak person who shows too much soft feeling, not a strong-minded person and not a person who
  is kind in a plain way.
examples:
- He was dismissed as a namby-pamby who wept at every sad story.
- The namby-pamby could not stand up to the bully.
