simpleMeaning: one of the thin, three-sided flaps that open and shut inside the heart to let blood through
  one way
scope: A thin flap inside the heart that opens and shuts, not a small printed sheet handed out.
examples:
- The surgeon repaired a torn leaflet in the heart valve.
- Each leaflet of the valve closes to stop blood flowing back.
