simpleMeaning: a person who moves about quietly and in secret, usually to do something against the law
scope: A person who sneaks about, usually with unlawful intent, and sneak is another name for this sense;
  not a hunter of game and not someone who walks with long stiff steps.
examples:
- The stalker followed her home every night.
- Police warned residents about a stalker in the area.
