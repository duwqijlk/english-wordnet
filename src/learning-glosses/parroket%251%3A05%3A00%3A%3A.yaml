simpleMeaning: This bird, one of many kinds, is small and thin with a long tail
scope: 'Another name for this sense is parakeet, paraquet, paroquet, parrakeet, parroket or parroquet:
  a small thin bird with a long tail, not a large bird and not a bird of prey.'
examples:
- A parroket flew across the garden, its long tail trailing behind it.
- The children watched a parroket eat seeds from the feeder.
