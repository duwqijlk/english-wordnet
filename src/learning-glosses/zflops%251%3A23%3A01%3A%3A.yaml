simpleMeaning: In computer science, a unit that tells how fast a computer system works, equal to one sextillion,
  a 1 followed by 21 zeros, maths work with decimal points each second
scope: 'Also called zettaflop: a unit of computer speed, not a unit of size or storage.'
examples:
- The new machine can reach several ZFLOPS in speed.
- Engineers measured the system in ZFLOPS to show how fast it was.
