simpleMeaning: A person whose paid job is to write reports of what has happened for the daily press or
  for radio and television
scope: A person whose paid job is to write reports of what has happened for the daily press or for radio
  and television; correspondent is another name for this sense, not a writer of books and not an editor.
examples:
- The newswriter sent in three stories a day.
- He started as a newswriter on a small town paper.
