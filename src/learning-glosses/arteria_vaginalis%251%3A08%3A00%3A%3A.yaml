simpleMeaning: A branch of the inner hip artery that carries blood to the birth canal and to the base
  of the bladder and the back passage
scope: A branch of the inner hip artery; not the blood tube that feeds the ovaries and not the one that
  feeds the belly muscles.
examples:
- The arteria vaginalis carries blood to the vagina and the base of the bladder.
- The arteria vaginalis also feeds the lower part of the rectum.
