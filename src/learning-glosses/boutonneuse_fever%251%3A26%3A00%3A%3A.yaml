simpleMeaning: a fever common in India and round the Mediterranean, brought on by a tiny germ that a red-brown
  tick living on dogs and other mammals carries to people
scope: A fever caught from a tick bite, common in India and round the Mediterranean, not a fever caught
  from a mosquito bite and not a cold.
examples:
- He caught boutonneuse fever while travelling in India.
- Travellers in the Mediterranean can catch boutonneuse fever from a tick bite.
