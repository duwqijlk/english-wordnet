simpleMeaning: A songbird of the Americas that moves to far lands and back as the seasons change.
scope: A songbird that moves with the seasons; bobolink, reedbird and ricebird are other names for this
  sense. Not a songbird that stays in one place all year.
examples:
- We heard a Dolichonyx oryzivorus singing in the field.
- The Dolichonyx oryzivorus leaves here in autumn.
