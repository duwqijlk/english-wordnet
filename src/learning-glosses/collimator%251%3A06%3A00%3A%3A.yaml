simpleMeaning: 'An optical device: a tube with a colour-corrected convex lens at one end and a slit at
  the lens''s focus at the other, so light leaves as a parallel beam.'
scope: An optics tube that makes light parallel, not the small sighting telescope that is also called
  a collimator.
examples:
- The technician adjusted the collimator until the light beam ran parallel.
- A collimator uses a lens and a slit to make light travel in parallel rays.
