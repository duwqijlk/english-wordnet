simpleMeaning: a small bag, most often with a zip, that fastens to a belt and is worn round the middle
  of the body
scope: A small bag worn round the middle of the body on a belt, also called belt bag; not a handbag and
  not a pocket.
examples:
- He kept his keys in his waist pack.
- Her waist pack hung from her belt as she walked.
