simpleMeaning: Raspberries or currants and other bush fruit sicken when a disease strikes their long thin
  stems.
scope: A sickness that strikes the stems of bush fruit, not one that eats the fruit itself.
examples:
- Cane blight hit the stems of the raspberry bushes.
- The currant bushes had cane blight on their stems.
