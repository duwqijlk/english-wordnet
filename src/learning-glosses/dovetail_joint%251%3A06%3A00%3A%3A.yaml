simpleMeaning: a way of fixing two pieces of wood, with wedge-shaped pins that fit tight into matching
  slots
scope: 'Also called a dovetail: a wood fastening where wedge-shaped pins lock into matching slots, not
  a plain butt fastening and not a nail or screw.'
examples:
- He cut a dovetail joint to hold the drawer together.
- The dovetail joint in the old chest still holds fast after a hundred years.
