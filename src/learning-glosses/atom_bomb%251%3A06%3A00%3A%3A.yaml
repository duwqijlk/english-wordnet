simpleMeaning: When the cores of heavy stuff like uranium 235 or plutonium 239 split, this weapon frees
  a huge burst of power
scope: A weapon also called atomic bomb, fission bomb, or plutonium bomb, whose huge power comes from
  splitting heavy cores, not from burning or ordinary explosives.
examples:
- An atom bomb frees a huge burst of power when heavy cores split.
- The atom bomb works by splitting uranium 235 or plutonium 239.
