simpleMeaning: A warrior of old Japan ended his own life by cutting open his belly with a sword, as a
  rite.
scope: Also called harakiri, harikari and seppuku, this is the rite by which a warrior of old Japan took
  his own life with a sword.
examples:
- The old tale tells of a lord who chose hara-kiri.
- The warrior in the play performs hara-kiri.
