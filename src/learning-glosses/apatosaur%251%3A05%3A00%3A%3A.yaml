simpleMeaning: A huge plant-eating dinosaur that walked on four legs and was common in North America late
  in the Jurassic time.
scope: A huge four-legged plant-eating dinosaur of late Jurassic North America; brontosaurus, apatosaurus
  and brontosaur are other names for it, and it is not a meat-eating dinosaur and not a small one.
examples:
- The apatosaur grazed on leaves high in the trees.
- Fossils of the apatosaur are found in North America.
