senseId: hardheaded%5:00:00:stubborn:00
synsetId: 02336289-s
simpleMeaning: Holding fast to your own view without good reason, and refusing to give way, even when
  others argue, beg, or attack.
scope: 'Also called mulish: refusing to change your mind without good reason when others argue or plead,
  not the practical, experience-led sense of the word.'
examples:
- He was hardheaded about the plan and would not listen to reason.
- She stayed hardheaded even when they begged her to change her mind.
