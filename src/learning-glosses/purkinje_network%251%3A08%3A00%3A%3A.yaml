simpleMeaning: A web of fine threads in the heart that carry the beat signal from a small knot of tissue
  to the lower chambers and make them squeeze.
scope: Also called Purkinje's system and Purkinje's tissue; a web of fine threads in the heart that carry
  the beat signal to the lower chambers.
examples:
- The Purkinje network carries the beat signal to the lower chambers of the heart.
- Doctors study the Purkinje network to learn how the heart beats.
