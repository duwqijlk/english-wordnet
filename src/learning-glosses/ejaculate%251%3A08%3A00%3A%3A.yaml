simpleMeaning: the thick white fluid from a man's body, holding sperm (the cells that can join with an
  egg to make a baby)
scope: 'Also called come, seed, cum, semen and seminal fluid: this is the fluid itself, not the act of
  it coming out of the body.'
examples:
- The sample of ejaculate was tested in the lab.
- Ejaculate leaves the man's body during sex.
