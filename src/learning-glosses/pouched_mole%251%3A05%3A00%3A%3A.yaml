simpleMeaning: a small Australian animal that digs in the ground, keeps its young in a pouch on its body,
  and is shaped like a small animal that digs tunnels
scope: Also called a marsupial mole, this is a small Australian animal that digs in the ground and keeps
  its young in a pouch, not a mole from other lands and not a mouse.
examples:
- The pouched mole dug a tunnel under the dry sand.
- We saw a pouched mole in the desert in Australia.
