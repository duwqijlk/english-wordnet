simpleMeaning: one of many kinds of bush grown for their bright, pretty flowers, which come in many different
  colors
scope: A bush grown for its bright flowers in many colors. Not a tree and not a single cut flower.
examples:
- The azalea by the door is covered in pink flowers.
- She planted an azalea in the garden for its bright spring flowers.
