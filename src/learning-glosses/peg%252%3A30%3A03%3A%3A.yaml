simpleMeaning: To hold a price or a rate of exchange steady by law or by buying and selling in the market
scope: Holding a price or exchange rate steady by law or market action, not fastening with a wooden pin
  and not the wooden pin itself.
examples:
- The bank pegged the coin to the dollar to keep its worth steady.
- The state pegged the price of bread during the shortage.
