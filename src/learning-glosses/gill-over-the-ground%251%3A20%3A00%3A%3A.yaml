simpleMeaning: a creeping, fragrant mint-family plant from Europe, with round leaves and small purple
  flowers, often grown in hanging baskets, naturalized in North America, sometimes classed in genus Nepeta.
scope: Another name for the same trailing European mint, also called ground ivy; not a different kind
  of plant.
examples:
- Gill-over-the-ground had spread across the damp lawn, its round leaves showing between the grass.
- She picked a stem of gill-over-the-ground and rubbed the small purple flowers between her fingers.
