simpleMeaning: Loss of hearing because the path that carries sound to the brain has failed
scope: This is hearing loss caused by the hearing nerve failing, not by a block in the ear.
examples:
- Nerve deafness left him unable to hear the doorbell.
- The doctor said her nerve deafness came from the damaged path to the brain.
