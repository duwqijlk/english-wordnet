simpleMeaning: A way of finding a thing the body fights by using a microscope that makes things glow,
  not by looking at it straight.
scope: A way of finding a thing the body fights with a glowing microscope, done through a middle step
  and not by looking with the eye alone.
examples:
- Indirect immunofluorescence showed the antigen in the sample.
- The lab used indirect immunofluorescence to find the antigen in the blood.
