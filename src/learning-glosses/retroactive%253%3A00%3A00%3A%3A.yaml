simpleMeaning: Used of a thing that changes how an earlier thing works, even though it comes later.
scope: For a thing that changes how an earlier thing works, even though it comes later.
examples:
- The new rule was retroactive, so it changed last year's results too.
- The pay rise was retroactive to January.
