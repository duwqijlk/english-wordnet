simpleMeaning: The signal that comes out has changed, because it fails to keep a straight-line link to
  the signal that went in.
scope: Amplitude distortion is another name for this change in the signal that comes out, which fails
  to keep a straight-line link to the signal that went in.
examples:
- Nonlinear distortion made the music from the speaker sound wrong.
- We could hear the nonlinear distortion in the song.
