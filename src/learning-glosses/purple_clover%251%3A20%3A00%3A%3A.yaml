simpleMeaning: A clover that lives a few years, grows straight up or spreads low, and bears deep red to
  pink flowers; the clover most often grown to feed farm animals.
scope: A clover that lives a few years and bears deep red to pink flowers; red clover is another name
  for this sense, and it is the clover most often grown to feed farm animals.
examples:
- Purple clover grew in the field.
- They cut purple clover to feed the cows.
