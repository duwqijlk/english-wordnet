simpleMeaning: Through skin that is not broken; of drugs put straight on the skin, as creams or ointments,
  or in slow-release skin patches
scope: Through skin that is not broken, of drugs put on the skin; percutaneous, transcutaneous and transdermic
  are other names for this sense, and not through a cut in the skin or a drug taken by mouth.
examples:
- Transdermal estrogen is put on the skin.
- The transdermal patch released the drug slowly.
