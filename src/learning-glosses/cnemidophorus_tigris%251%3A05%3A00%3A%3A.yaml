simpleMeaning: A quick-moving lizard with a net of dusky dark marks, from the dry lands of Oregon and
  Idaho to Baja California.
scope: Also called western whiptail, this is a quick lizard of dry western lands, not the spotted whiptail
  of the south-west uplands.
examples:
- The Cnemidophorus tigris darts across the dry sand.
- Cnemidophorus tigris bears dark marks like a net.
