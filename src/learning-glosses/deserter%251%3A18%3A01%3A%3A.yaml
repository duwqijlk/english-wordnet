simpleMeaning: a disloyal person who leaves or turns against the cause, faith, party or friend they once
  stood by
scope: A person who betrays the side they once stood by, not a soldier who leaves the army and not a traitor
  who sells secrets.
examples:
- They called him a deserter for leaving the party.
- The deserter was shunned by his old friends.
