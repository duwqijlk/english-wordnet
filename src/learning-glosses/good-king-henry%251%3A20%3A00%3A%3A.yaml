simpleMeaning: A European plant that now grows wild in North America, often picked from the wild to cook
  and eat as a green.
scope: 'Also called allgood or fat hen: a European plant now wild in North America, often picked to cook
  and eat, not a garden vegetable and not a wildflower grown for show.'
examples:
- Good-king-henry grows wild along the old lane.
- They picked good-king-henry from the wild to cook for supper.
