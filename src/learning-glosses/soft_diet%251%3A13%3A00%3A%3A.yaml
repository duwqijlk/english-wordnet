simpleMeaning: food that needs no chewing, suggested for people with gut problems
scope: A way of eating in which the food needs no chewing, also called pap and spoon food; not a diet
  for losing weight, and not a diet for strong teeth.
examples:
- After the illness, she was put on a soft diet.
- His soft diet was mostly soup and mashed potatoes.
