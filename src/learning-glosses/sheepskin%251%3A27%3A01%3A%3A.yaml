simpleMeaning: skin taken from a sheep or a goat and worked on until a person can write words on it
scope: This is animal skin made ready for writing on, not the paper that shows a course of study is finished,
  and not skin with the wool left on for clothes.
examples:
- She wrote the letter on sheepskin.
- The old sheepskin had neat writing all over it.
