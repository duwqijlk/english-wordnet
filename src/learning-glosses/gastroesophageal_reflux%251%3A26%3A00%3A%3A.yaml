simpleMeaning: stomach food and acid coming back up into the food tube
scope: Also called esophageal reflux and oesophageal reflux, it is stomach food and acid coming back up
  into the food tube, not food going down the wrong way and not a sore stomach.
examples:
- Gastroesophageal reflux woke her at night with a burning feeling in her chest.
- He takes medicine for gastroesophageal reflux after large meals.
