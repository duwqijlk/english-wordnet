simpleMeaning: a written paper that lets the person who holds it buy shares at a set price within a set
  time
scope: A written right to buy shares at a fixed price before a set date, not the shares themselves and
  not a loan paper.
examples:
- He used his stock warrant to buy shares at the old price.
- The stock warrant lets its holder buy shares before the end of the year.
