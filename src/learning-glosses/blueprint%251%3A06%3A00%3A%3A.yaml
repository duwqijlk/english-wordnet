simpleMeaning: a copy of plans or technical drawings, and other such things, made as a photographic print
scope: A photographic copy of plans or drawings, not the act of making one and not a plan for the future.
examples:
- He spread the blueprint across the table.
- The builder followed the blueprint for the new house.
