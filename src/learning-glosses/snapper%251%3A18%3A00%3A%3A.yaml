simpleMeaning: In football, the player in the middle of the front line who throws the ball back to the
  quarterback to start a play.
scope: In football, the middle player who starts play by passing the ball back, also called center or
  centre, not any of the fishes of the same word.
examples:
- The snapper passed the ball to the quarterback.
- Our snapper never fumbled a handoff.
