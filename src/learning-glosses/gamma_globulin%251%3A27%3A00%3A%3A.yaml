simpleMeaning: A blood protein that holds the parts that fight germs and give the body its defence
scope: This is a blood protein that holds the parts that fight germs and give the body its defence; human
  gamma globulin is another name for this sense, not red blood cells and not a germ itself.
examples:
- Gamma globulin helps the body fight germs.
- The doctor gave gamma globulin to help her defence.
