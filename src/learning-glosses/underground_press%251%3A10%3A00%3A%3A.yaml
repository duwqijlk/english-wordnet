simpleMeaning: A secret way of printing and sharing writings that go against the rulers or that are banned.
scope: 'Also called samizdat: a secret way of printing and sharing banned writings, not an open newspaper
  and not a bookshop.'
examples:
- The underground press printed the banned poems in secret.
- People read the underground press to learn what the rulers hid.
