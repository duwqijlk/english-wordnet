simpleMeaning: The habit of being unable to make up your mind and stick to a choice.
scope: This is the habit of not being able to decide; not a single moment of doubt about two choices,
  and not weakness of the body.
examples:
- The king's incurable indecision caused turmoil in his court.
- Her indecision about the job lasted for weeks.
