simpleMeaning: to treat something with a strong-smelling solid made from tree wood
scope: To treat something with a strong-smelling solid made from tree wood; not to wash with water, and
  not to cover with paint.
examples:
- She camphorated the woollen clothes to keep the moths away.
- He camphorated the chest before he stored the blankets.
