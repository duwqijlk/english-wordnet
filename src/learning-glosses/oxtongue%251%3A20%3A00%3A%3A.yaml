simpleMeaning: With yellow blooms and prickly leaves shaped like the part in the mouth that tastes food,
  it is a weed all over Europe, now at home in the United States.
scope: 'It is also called bitterweed, bristly oxtongue, and bugloss: the weed all over Europe with yellow
  blooms and prickly leaves shaped like the part in the mouth that tastes food, now at home in the United
  States.'
examples:
- Oxtongue grows in Europe and the United States.
- The oxtongue has yellow blooms.
