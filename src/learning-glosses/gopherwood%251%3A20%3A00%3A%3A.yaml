simpleMeaning: A small, good-looking, round-topped tree that sheds its leaves, with bright white flowers
  in bunches at the ends of its branches, and heavy hardwood that gives a yellow dye.
scope: The tree itself, with white flower clusters and hardwood that gives a yellow dye.
examples:
- Gopherwood grew along the river bank.
- The gopherwood was in flower, its white bunches bright against the leaves.
