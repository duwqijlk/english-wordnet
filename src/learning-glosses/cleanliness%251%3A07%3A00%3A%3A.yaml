simpleMeaning: care and hard work in keeping things free from dirt
scope: Care and hard work to keep things free from dirt, not the habit of keeping your looks neat and
  free from small faults.
examples:
- Her cleanliness showed in the kitchen, where every dish was washed and put away.
- The nurse praised the cleanliness of the ward and the care taken to keep it free from dirt.
