simpleMeaning: A male theatre worker who gets the objects the actors use ready and keeps them in order
scope: A man on a stage crew who looks after the props; not the woman doing the same job, and not the
  head of the crew.
examples:
- The property man set out the chairs before the play began.
- Our property man keeps all the small stage items in one room.
