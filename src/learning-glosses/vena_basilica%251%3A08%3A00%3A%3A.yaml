senseId: 'vena_basilica%1:08:00::'
synsetId: 05366492-n
simpleMeaning: A blood tube that drains the back of the hand and the lower arm and empties into the blood
  tube under the arm.
scope: A blood tube that drains the back of the hand and lower arm; basilic vein is another name for this
  sense; not a blood tube of the leg and not one of the chest.
examples:
- The vena basilica drains blood from the back of the hand.
- The nurse found the vena basilica in the lower arm.
