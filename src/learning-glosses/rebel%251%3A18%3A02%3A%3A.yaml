simpleMeaning: The name 'Johnny', given by Union soldiers to soldiers of the South in the American Civil
  War; 'greyback' came from their grey uniforms.
scope: This is the name Union soldiers gave to men of the South in the American Civil War, also called
  greyback, Johnny, Johnny Reb, and Reb, not a person who fights a ruler and not a rising.
examples:
- The Rebels wore grey coats.
- Johnny Rebel fought for the South.
