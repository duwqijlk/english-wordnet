simpleMeaning: A saying whose meaning you cannot guess from the words that make it up
scope: A group of words with a fixed sense you cannot guess from the words alone, also called an idiom,
  a phrasal idiom, or a phrase; not a plain group of words with a plain sense.
examples:
- She used an idiomatic expression that confused the new students.
- An idiomatic expression like 'kick the bucket' does not mean what its words say.
