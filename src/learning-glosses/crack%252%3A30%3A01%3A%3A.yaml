schema: oewn-learning-gloss-v2
senseId: 'crack%2:30:01::'
synsetId: 00337070-v
simpleMeaning: to split on the surface only, without coming apart into separate pieces
scope: A surface split that leaves an object in one piece, another name for the same sense as break, not
  the transitive act of causing a split, a blemish left by a split, or a sharp sound.
examples:
- The old mirror cracked along one corner but did not fall apart.
- Her lips cracked in the cold, dry wind.
