simpleMeaning: an open space or room at the top of a house, just under the roof, often used for keeping
  things
scope: 'Also called loft: the open space under a house roof, often used for keeping things; not a low
  wall at the top of a building.'
examples:
- We keep old boxes in the attic.
- She went up to the attic to find her winter clothes.
