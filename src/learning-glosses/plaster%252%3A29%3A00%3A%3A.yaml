simpleMeaning: to treat a hurt part of the body by covering it with a substance that helps it heal
scope: This is about covering a hurt part of the body with something that helps it heal, not coating a
  wall and not covering a surface thickly with paper or paint.
examples:
- The nurse plastered the wound with a healing cream.
- She plastered the sore area with a warm healing mix.
