simpleMeaning: A tall straight plant from Europe that lives one year, often grown as a salad plant and
  picked when young and soft
scope: This is a tall straight plant from Europe that lives one year, often grown as a salad plant and
  picked when young and soft; rocket, arugula, rocket salad and roquette are other names for this sense,
  not a tall tree and not a weed.
examples:
- Garden rocket is picked when young and soft for salads.
- She grows garden rocket in the salad bed.
