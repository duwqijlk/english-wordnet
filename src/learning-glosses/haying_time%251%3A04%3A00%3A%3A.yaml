simpleMeaning: The part of the year when grass is cut, dried, and put away to feed farm animals.
scope: The season for cutting and drying grass for animal feed, also called haying; not the harvest of
  grain and not the planting season.
examples:
- Haying time comes in early summer, when the grass is tall.
- During haying time the whole farm works from dawn till dark.
