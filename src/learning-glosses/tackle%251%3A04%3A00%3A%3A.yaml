simpleMeaning: In American football, holding a player from the other team to stop him by bringing him
  to the ground
scope: In American football, this is the act of bringing a player down, not the ropes on a ship, not a
  place on the line, and not the player who plays that place.
examples:
- His tackle brought the ball carrier to the ground.
- A strong tackle threw the runner down just short of the goal.
