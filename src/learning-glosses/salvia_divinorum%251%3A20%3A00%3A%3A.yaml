simpleMeaning: A herb from Oaxaca with a strong effect that makes people see and hear things that are
  not there; its active part is salvinorin.
scope: Also called Mexican mint, this is a herb from Oaxaca with a strong effect that makes people see
  and hear things that are not there, not a mint grown for cooking.
examples:
- Salvia divinorum grows in Oaxaca.
- People use Salvia divinorum for its strong effect on the mind.
