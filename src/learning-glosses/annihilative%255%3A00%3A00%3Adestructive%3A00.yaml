simpleMeaning: able to destroy everything in its path, or already doing so
scope: Something that can wipe out everything around it; annihilating, devastating and withering are other
  names for this sense, not a force that only harms or weakens a little.
examples:
- The annihilative blast left the whole town in ruins.
- The storm's annihilative power tore down every building in its path.
