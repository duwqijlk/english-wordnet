simpleMeaning: food or a thing used to draw fish or other animals into danger, so they can be caught or
  killed
scope: Food or a thing used to draw animals into danger so they can be caught; also called a lure; not
  the act of teasing a person.
examples:
- He put bait on the hook.
- The trap had fresh bait in it.
