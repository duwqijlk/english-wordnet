simpleMeaning: To do with predestination, the belief that what will happen is already fixed
scope: Said of ideas or beliefs about what will happen being already fixed; not the noun sense of a person
  who holds that belief.
examples:
- His predestinarian views left no room for free will.
- The predestinarian doctrine holds that all events are fixed in advance.
