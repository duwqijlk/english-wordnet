simpleMeaning: the way two things or two parts are linked to each other
scope: This shows how two things or parts belong together; it is not a person in your family, not how
  people deal with each other, and not a rule in law.
examples:
- The relation between the two parts of the machine is hard to see.
- She studied the relation of colour to light in his paintings.
