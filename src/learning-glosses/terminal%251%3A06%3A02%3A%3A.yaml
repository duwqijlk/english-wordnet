simpleMeaning: a piece of electronic equipment with keys to type on and a screen, used to work on a computer
scope: A screen and keyboard used to work on a computer, not a station where buses or trains stop and
  not a wire end on a battery.
examples:
- She typed her password into the terminal and opened her files.
- The old terminal had a green screen and a noisy keyboard.
