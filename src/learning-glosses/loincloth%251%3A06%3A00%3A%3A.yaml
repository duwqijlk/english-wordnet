simpleMeaning: a piece of clothing that covers the body around the hips and below the waist
scope: 'Also called breechclout and breechcloth: a small piece of clothing that covers the body around
  the hips. It is not a full set of clothes for the whole body.'
examples:
- He wore only a loincloth in the heat.
- The man's loincloth was made of soft cloth.
