simpleMeaning: a solid thing found in nature, the same all through and not made by living things, with
  a fixed make-up of chemicals
scope: A solid thing from nature, not made by living things, not the adjective sense to do with minerals.
examples:
- Quartz is a common mineral found in many rocks.
- The cave walls glittered with mineral crystals.
