simpleMeaning: A picture printed from a block of linoleum with the design cut so it stands out
scope: A picture printed from cut linoleum, not a drawing made by hand and not a photo.
examples:
- She made a linocut of a fox for the art show.
- The linocut on the wall was printed in two colours.
