simpleMeaning: The years 1920 to 1933, when the sale of drink was banned in the United States by a change
  to the country's highest law
scope: 'Also called prohibition: the years when drink could not be sold in the United States, not a ban
  on drink in another country and not the time after the ban ended.'
examples:
- The prohibition era ended in 1933.
- Many clubs closed during the prohibition era.
