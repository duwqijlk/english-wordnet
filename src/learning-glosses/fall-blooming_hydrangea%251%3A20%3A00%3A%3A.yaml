simpleMeaning: A bush or small tree that loses its leaves and bears cone-shaped bunches of flowers in
  the autumn.
scope: A bush or small tree that loses its leaves and bears cone-shaped bunches of flowers in the autumn,
  not an evergreen bush and not a spring-flowering bush.
examples:
- The fall-blooming hydrangea flowered late in the year.
- They planted a fall-blooming hydrangea by the gate.
