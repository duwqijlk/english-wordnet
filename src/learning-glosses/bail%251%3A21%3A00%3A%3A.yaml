simpleMeaning: In criminal law, a sum paid to stand behind an accused person, lost by the payer if that
  person stays away from trial
scope: 'Also called a bond: money put down as a guarantee that the accused will come to court, not the
  legal system that frees a person before trial.'
examples:
- The judge set bail at $10,000.
- If he skips the trial, his bail will be lost.
