simpleMeaning: covered with a thick, wet, slippery stuff, or looking as if covered with it
scope: Covered with thick, wet, slippery stuff, or looking like that; not just wet, and not covered in
  mud or dry dirt.
examples:
- The slimed stones by the pond were hard to walk on.
- His boots came out slimed after he crossed the wet ditch.
