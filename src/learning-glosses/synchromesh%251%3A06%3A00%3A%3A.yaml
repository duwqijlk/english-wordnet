simpleMeaning: In a car, the set of parts that lets the driver change gear without a jolt, because the
  wheels inside turn at the same speed first.
scope: In a car, this set of parts brings the wheels inside to the same speed before the driver changes
  gear, so the change goes through without a jolt.
examples:
- The driver eased the car into gear, and the synchromesh took the crunch out of the change.
- The synchromesh in the old car still shifted smoothly.
