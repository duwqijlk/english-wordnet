senseId: 'breach_of_duty%1:04:00::'
synsetId: 00070424-n
simpleMeaning: failing to take the care that is owed to others
scope: Failing to take the care owed, not breaking a written deal (breach of contract) and not a careless
  mistake where no duty is owed.
examples:
- The doctor's breach of duty put the patient at risk.
- The court found a breach of duty in the way the funds were handled.
