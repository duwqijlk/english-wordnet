simpleMeaning: The unit for how often a thing happens; one hertz is one repeat in one second, named for
  Heinrich Rudolph Hertz.
scope: This is the unit for how often a thing happens, one repeat in one second; cycle, hertz, cps, cycle
  per second and cycles/second are other names for it; not a unit of length and not a unit of weight.
examples:
- The sound has a pitch of 440 Hz.
- This note rings at 50 Hz.
