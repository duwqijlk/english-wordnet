simpleMeaning: With a dial, you can set the warmth you want in this cover for a bed, which has a heating
  part inside it.
scope: This is a bed cover with a heating part inside that can be set to the warmth you want, not a plain
  cover with no heat in it.
examples:
- She switched on the electric blanket to warm the bed.
- The electric blanket kept the bed at the warmth he wanted.
