simpleMeaning: The seventh Sunday after Easter, marking the coming of the Holy Spirit to the Apostles,
  and a day for paying rent in Scotland.
scope: Also called Pentecost; the seventh Sunday after Easter, marking the coming of the Holy Spirit,
  not Easter itself or Christmas.
examples:
- Whitsunday falls seven weeks after Easter.
- The lease ended on Whitsunday.
