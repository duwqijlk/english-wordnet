simpleMeaning: A tie that runs both ways between things, so each one is shaped by the other
scope: A tie running both ways between things, also called interrelatedness or interrelationship; not
  a one-way tie and not a single thing on its own.
examples:
- The interrelation between supply and demand shapes prices.
- They studied the interrelation of climate and farming.
