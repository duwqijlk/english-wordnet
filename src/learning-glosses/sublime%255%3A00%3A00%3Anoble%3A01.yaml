senseId: sublime%5:00:00:noble:01
synsetId: 01593026-s
simpleMeaning: of very high worth in good character or thought, and raised above the common in nature
  or style
scope: 'Also called grand, elevated, lofty, idealistic, exalted and rarefied: of high worth in character,
  thought or style, not the sense that means worthy of deep respect as if holy.'
examples:
- Her speech had a sublime purpose that lifted everyone's thoughts.
- The poem uses sublime language to talk about a grand idea.
