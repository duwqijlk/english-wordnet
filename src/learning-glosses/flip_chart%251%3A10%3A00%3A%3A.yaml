simpleMeaning: Several sheets of paper joined at the top, so each one can be turned over to show the next
  set of facts in turn.
scope: This is a set of large sheets for showing facts in turn, not a single poster or a book of pages.
examples:
- She wrote the plan on a flip chart.
- He turned over the flip chart to the next page.
