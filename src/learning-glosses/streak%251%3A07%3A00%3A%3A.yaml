simpleMeaning: a thin line of a different colour or feel across a surface
scope: A thin line of a different colour or feel; bar and stripe are other names for this sense, and it
  is not the act of making such marks and not a sudden flash.
examples:
- A white streak ran down the horse's face.
- The streak of red in her hair caught the light.
