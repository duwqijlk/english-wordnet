simpleMeaning: A group of low deciduous shrubs with showy brushlike spikes of white flowers in spring
  and fiery red and orange autumn color, from Alabama to the Allegheny Mountains.
scope: Another name for that same low shrub with white bottlebrush spikes; not witch hazel, a different
  plant with yellow winter flowers.
examples:
- The witch alder by the porch is covered in white bottlebrush spikes each April.
- Witch alders need acidic soil to show their best autumn color.
