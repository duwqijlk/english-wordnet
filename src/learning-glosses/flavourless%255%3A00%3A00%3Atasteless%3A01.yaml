senseId: flavourless%5:00:00:tasteless:01
synsetId: 02408319-s
simpleMeaning: Lacking any tang or taste, flat and dull.
scope: This sense is also called flat, bland, vapid, insipid, and flavorless, for lacking any tang or
  taste, flat and dull, where being flat is having no flavor at all, with nothing sharp or strong in it,
  and being bland is having no taste in it at all, nothing sharp or strong to notice.
examples:
- The soup was flavourless, lacking any tang.
- The stew was flavourless, flat and dull.
