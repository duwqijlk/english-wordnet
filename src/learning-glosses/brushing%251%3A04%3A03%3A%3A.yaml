simpleMeaning: the act of cleaning your teeth by moving a tool with short, stiff hairs over them
scope: Cleaning your teeth; another name for this is brush. It is not cleaning or smoothing your hair
  with a tool.
examples:
- Brushing twice a day keeps your teeth clean and strong.
- The dentist told him that brushing after meals helps stop tooth pain.
