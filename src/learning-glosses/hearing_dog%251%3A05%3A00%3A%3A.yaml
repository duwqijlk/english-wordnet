simpleMeaning: A trained animal that helps deaf people by showing when a certain sound has been made.
scope: A trained animal that helps deaf people by showing when a certain sound has been made, not a dog
  that guides blind people and not a pet.
examples:
- The hearing dog woke its owner when the doorbell rang.
- A hearing dog alerts its owner to sounds like a phone or a fire alarm.
