simpleMeaning: Growing on land in warm America, this fern has tough leaves shaped like long spearheads;
  sometimes counted with the group called Polybotrya.
scope: Also called hart's-tongue, this is a land fern of warm America, not the hart's-tongue fern of Florida
  and the West Indies with pale strap-shaped leaves.
examples:
- The hart's-tongue fern grew on the bank.
- We saw a hart's-tongue fern in the warm valley.
