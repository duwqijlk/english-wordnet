simpleMeaning: A one-year woody vine of Asia with long bunches of purplish flowers and pods thick with
  hairs, grown in the southern United States for green manure and grazing.
scope: 'Also called cowage, velvet bean, Bengal bean, Benghal bean, Florida bean, Mucuna deeringiana,
  Mucuna pruriens utilis, and Stizolobium deeringiana: a one-year woody vine of Asia with purplish flowers
  and hairy pods, not a tree.'
examples:
- Mucuna aterrima grew as green manure in the southern fields.
- Farmers planted Mucuna aterrima for grazing and to feed the soil.
