simpleMeaning: to free a thing from a hold, a join, or a tangle
scope: To set a thing free from what holds it fast, joins it, or tangles it; not taking a thing away,
  and not stopping taking part in a thing.
examples:
- She withdrew her hand from the trap.
- He withdrew the key from the lock.
