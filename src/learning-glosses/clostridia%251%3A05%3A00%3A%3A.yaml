simpleMeaning: A tiny germ shaped like a spindle, most of all one whose middle bulges where it holds a
  hard seed-like part.
scope: This is a tiny germ shaped like a spindle, most of all one whose middle bulges; clostridium is
  another name for this sense, not a germ with no hard seed-like part inside and not a round germ.
examples:
- Under the microscope the clostridia looked like tiny spindles.
- Some clostridia swell in the middle where the hard part forms.
