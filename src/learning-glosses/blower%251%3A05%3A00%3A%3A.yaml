simpleMeaning: a large mammal that lives in water, eats meat, has flat front limbs for swimming and no
  back limbs; whales, dolphins, porpoises and narwhals are kinds of it
scope: Also called cetacean and cetacean mammal. This is the water animal group that holds whales and
  dolphins; it is not a machine or fan that moves air.
examples:
- The whale is a blower, a large sea mammal with no back limbs.
- Dolphins and porpoises are blowers that live in the sea.
