senseId: 'monothelitism%1:09:00::'
synsetId: 06199795-n
simpleMeaning: The church teaching that Christ had only one will although he had two natures, human and
  divine, a teaching judged false by the Third Council of Constantinople.
scope: This teaching says Christ had only one will, although he had two natures, human and divine, and
  the Third Council of Constantinople judged it false, not a teaching that gives him two wills.
examples:
- Monothelitism taught that Christ had only one will.
- The Third Council of Constantinople condemned Monothelitism as false teaching.
