simpleMeaning: A musician who takes a piece of music and reworks it so it fits certain voices or instruments,
  or a different way of playing it.
scope: Also called adapter; of a musician who reworks a piece of music so it fits certain voices or instruments,
  or a different way of playing it.
examples:
- The arranger rewrote the song for brass and strings.
- She worked as an arranger for the orchestra.
