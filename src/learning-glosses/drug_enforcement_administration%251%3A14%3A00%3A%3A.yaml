simpleMeaning: The federal body that makes people obey the laws and rules for narcotics and controlled
  substances; its goal is to stop the gangs that move narcotics
scope: This is the federal body that makes people obey the laws and rules for narcotics and controlled
  substances; Drug Enforcement Agency and DEA are other names for this sense, and it stands apart from
  other federal bodies by its goal of stopping the gangs that move narcotics.
examples:
- The Drug Enforcement Administration seized the narcotics.
- The Drug Enforcement Administration works to stop the gangs that move narcotics.
