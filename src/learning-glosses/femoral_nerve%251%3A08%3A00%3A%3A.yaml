simpleMeaning: A nerve in a pair, coming from the nerves of the lower back, that brings signals to the
  muscles and skin at the front of the thigh.
scope: Also called the anterior crural nerve or nervus femoralis, this names one of the pair of nerves
  from the lower back that brings signals to the muscles and skin at the front of the thigh.
examples:
- A cut to the femoral nerve left his thigh numb.
- Damage to the femoral nerve can weaken the leg.
