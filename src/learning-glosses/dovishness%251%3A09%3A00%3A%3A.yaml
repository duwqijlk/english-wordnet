simpleMeaning: a way of thinking in politics that looks for a middle way to keep the peace
scope: A political way of thinking that looks for a middle way to keep the peace, not a wish to fight
  and not a lack of views.
examples:
- His dovishness showed in his calls for talks instead of war.
- Critics saw her dovishness as weakness, but she called it good sense.
