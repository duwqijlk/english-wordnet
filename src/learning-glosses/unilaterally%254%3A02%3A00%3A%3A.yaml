senseId: 'unilaterally%4:02:00::'
synsetId: 00254597-r
simpleMeaning: by one side or party alone, without agreement from the other side
scope: This is about one side acting alone in a shared matter, not about both or all sides acting together
  after they agree.
examples:
- The company acted unilaterally and changed the pay rules without asking the workers.
- The government ended the trade deal unilaterally, without the other country's agreement.
