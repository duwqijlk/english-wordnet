simpleMeaning: a songbird of Europe found often in stony places, whose male has dark feathers with a white
  band round the neck
scope: Not a plain brown songbird, and not a songbird of woodland; also called ring blackbird and ring
  thrush.
examples:
- A ring ouzel called from the high rocks.
- The ring ouzel male showed a white band round his neck.
