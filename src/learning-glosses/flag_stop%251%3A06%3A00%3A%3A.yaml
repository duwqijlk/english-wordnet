simpleMeaning: A small train station between the main stations, or a station where trains halt only when
  a rider signals.
scope: A small train station between the main stations, or a station where trains halt only when a rider
  signals; not a main station where every train halts, and not a place with no station at all.
examples:
- The train halts at the flag stop only if a rider waves.
- Our village has a small flag stop between the two towns.
