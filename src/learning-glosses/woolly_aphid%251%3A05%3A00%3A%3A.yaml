simpleMeaning: What looks like a mass of fine curly white cotton or soft threads is the waxy stuff this
  bug gives off.
scope: This is a bug that gives off a waxy stuff, also called woolly plant louse, and the stuff looks
  like a mass of fine curly white cotton or soft threads.
examples:
- The woolly aphid left a white cotton-like mass.
- The woolly aphid looks like a mass of fine curly white cotton.
