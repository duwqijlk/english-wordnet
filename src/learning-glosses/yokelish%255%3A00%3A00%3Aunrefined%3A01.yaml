simpleMeaning: Of a person, raw and awkward in manner, with no elegance or social polish.
scope: This is awkward, unsophisticated behavior, not a deliberate act of bad manners.
examples:
- His yokelish manners and muddy boots amused the city guests.
- The yokelish youth gaped at the chandeliers and spoke too loudly.
