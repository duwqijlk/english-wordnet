senseId: 'brave%3:00:00::'
synsetId: 00263658-a
simpleMeaning: Having or showing courage, and able to face danger or fear and get through it without backing
  away.
scope: This is about a person's courage, with courageous as another name for the sense, not the bolder
  sense of being impossible to frighten, and not the verb meaning to face something with courage.
examples:
- The brave firefighter went back into the burning house to save the child.
- She was brave enough to confront the man who had threatened her.
