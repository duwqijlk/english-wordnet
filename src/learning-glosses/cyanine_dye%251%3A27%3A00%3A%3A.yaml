simpleMeaning: Any of a set of dyes with a -CH= link joining two rings with nitrogen, used to make film
  quick to light.
scope: A dye used as a sensitizer in photography, with a -CH= link joining two nitrogen rings.
examples:
- Cyanine dyes make film quick to light.
- The cyanine dye links two rings.
