simpleMeaning: with long, thin cuts made for looks, so the cloth underneath can be seen
scope: This is about clothes with long thin cuts that show cloth underneath, not about color put on with
  wide brush marks, and not about a deep cut in the skin.
examples:
- She wore a slashed dress that showed red cloth underneath.
- His slashed sleeves showed the white cloth below.
