senseId: 'leitmotiv%1:10:00::'
synsetId: 07042284-n
simpleMeaning: a short tune that plays again when a person or event comes back, as in the operas of Wagner
scope: A short tune that plays again when a person or event comes back, also called a leitmotif, not a
  whole song and not a tune that plays only once.
examples:
- The leitmotiv returns each time the hero appears.
- Wagner uses a leitmotiv to mark the sword in the story.
