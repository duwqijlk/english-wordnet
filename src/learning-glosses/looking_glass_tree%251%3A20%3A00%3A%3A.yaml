simpleMeaning: A large green-all-year woody plant of India and Burma, with leaves that shine silver underneath.
scope: A large evergreen tree of India and Burma with silver-backed leaves, not the small coastal tree
  of the Old World tropics.
examples:
- The looking glass tree stood tall behind the house in Rangoon.
- The looking glass tree kept its green leaves all year in the garden in Burma.
