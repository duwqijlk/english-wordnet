simpleMeaning: 'A statistical method for accepting or rejecting a whole batch of goods or documents: a
  small group is checked, and the batch is rejected if it has too many defects.'
scope: A quality-control statistical method for judging a whole lot from a small group of items, not the
  mathematical study of sampling itself.
examples:
- The factory used acceptance sampling to decide whether each shipment met its quality standard.
- Under acceptance sampling, a batch is rejected when the sample contains too many faulty items.
