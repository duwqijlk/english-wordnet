simpleMeaning: One of the flat, hard plates that form the body covering of many animals, such as fish
  and snakes.
scope: A hard plate in the body covering of many animals, such as a fish or a snake, not a flake of dead
  skin, a metal shield plate, or a protective leaf on a plant.
examples:
- The fish's scales glittered as it turned in the sunlight.
- Snakes shed their scales in one piece as they grow.
