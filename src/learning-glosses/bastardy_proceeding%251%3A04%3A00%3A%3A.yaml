simpleMeaning: A child born outside marriage gets support once this court case has named the father.
scope: This court case names the father of a child born outside marriage and provides for the child; paternity
  suit is another name for it.
examples:
- The court heard the bastardy proceeding to settle who the father was.
- Once the bastardy proceeding had named the father, the court ordered support for the child.
