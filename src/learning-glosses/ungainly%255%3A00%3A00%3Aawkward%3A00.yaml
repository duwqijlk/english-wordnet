simpleMeaning: not smooth or pleasing in the way a person or thing moves or holds the body
scope: Also called clumsy, clunky, unwieldy and gawky, this sense is about moving or standing in a way
  that is not smooth or pleasing.
examples:
- The tall boy was ungainly as he tried to dance.
- The ungainly bird took several short steps before it could fly.
