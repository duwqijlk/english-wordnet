simpleMeaning: a moving band that carries things along, as in a factory
scope: This is a moving band that carries things along, also called a conveyer belt, a conveyor, a conveyor
  belt and a transporter; not a truck and not a lift.
examples:
- The conveyer carried the boxes to the packing room.
- Workers stood beside the conveyer and took parts off it.
