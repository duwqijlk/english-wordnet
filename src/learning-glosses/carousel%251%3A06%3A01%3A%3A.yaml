simpleMeaning: a moving belt at an airport that brings bags to the people who have come off a plane so
  they can take them
scope: This belt is also called carrousel, luggage carousel, and luggage carrousel. It is for bags at
  an airport, not the large turning ride with seats for children.
examples:
- We waited at the carousel until our suitcases came round.
- Her bag was the last one left on the carousel.
