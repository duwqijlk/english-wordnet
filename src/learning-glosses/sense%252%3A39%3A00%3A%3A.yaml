simpleMeaning: To feel something through the body, such as touch or pain from the skin or muscles.
scope: It is about feeling through the body, not about understanding or noticing something in the mind.
examples:
- I could sense the heat of the sun on my skin.
- She sensed a sharp pain in her knee.
