simpleMeaning: the supply of money that a casino or dealer holds to cover bets in some gambling games
scope: This is not a row of machines or the raised edge of a road; it is the money set aside to pay winning
  gamblers.
examples:
- The dealer drew on the bank to pay the winner.
- He broke the bank at roulette with a single lucky bet.
