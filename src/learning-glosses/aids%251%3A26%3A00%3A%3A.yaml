simpleMeaning: a grave, often deadly illness that harms the body's defence system, spread through blood,
  above all by sex or dirty needles
scope: Also called acquired immune deficiency syndrome; a disease of the body's defence system, not a
  common cold or flu.
examples:
- He was diagnosed with AIDS in the 1980s.
- AIDS spreads through infected blood.
