synsetId: 14282459-n
simpleMeaning: An illness in which no beat can be felt in either arm or in the big blood tubes of the
  neck.
scope: An illness with no felt beat in the arms or neck, not a weak heart and not a blocked leg blood
  tube.
examples:
- In pulseless disease, doctors can feel no beat in either arm.
- She was found to have pulseless disease after her arms showed no beat.
