simpleMeaning: One of a pair of thin sticks used in East Asia to pick up food and eat it
scope: One of a pair of thin sticks for eating; not a fork or a spoon.
examples:
- She picked up the rice with a chopstick.
- He held the chopstick between his thumb and fingers.
