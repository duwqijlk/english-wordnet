simpleMeaning: a big winged insect from Asia now found in the United States, whose young feed on a tree
  called ailanthus
scope: A big moth from Asia that now lives in the United States, not a small native moth and not a moth
  whose young eat clothes.
examples:
- We saw a cynthia moth resting on the porch light.
- The cynthia moth's young feed on the ailanthus tree in our yard.
