simpleMeaning: to make someone leave another person's land or buildings by law
scope: To make someone leave another person's land or buildings by law; not to sack someone from a job,
  not to push something out of a small space, and not a putout in baseball.
examples:
- The landlord moved to force out the tenants who had not paid.
- The court can force out a tenant after months of unpaid rent.
