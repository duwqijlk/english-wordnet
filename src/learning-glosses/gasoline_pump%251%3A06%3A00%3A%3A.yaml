simpleMeaning: A device at a filling station that pulls fuel from tanks kept under the ground
scope: This is the device at a filling station that draws fuel from tanks under the ground; gas pump,
  island dispenser and petrol pump are other names for this sense, not a tank itself and not the fuel.
examples:
- The gasoline pump stopped working halfway through filling the tank.
- She waited at the gasoline pump while the attendant checked the price.
