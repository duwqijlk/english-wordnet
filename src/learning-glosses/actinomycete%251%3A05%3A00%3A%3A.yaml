simpleMeaning: Any tiny one-celled living thing of the group Actinomycetales, some of which cause sickness
  in people and animals.
scope: Not the soil life called actinomyces and not a virus.
examples:
- An actinomycete can cause sickness in cattle.
- The actinomycete grew in the dish overnight.
