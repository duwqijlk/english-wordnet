simpleMeaning: A European sea-side sedge, now growing wild along the Atlantic coast of the United States,
  whose rootstock has the properties of sarsaparilla.
scope: Also called sand reed and sand sedge, this European sea-side sedge now growing wild along the Atlantic
  coast of the United States, whose rootstock has the properties of sarsaparilla, is distinct from inland
  sedges, other sea-side plants without such a rootstock, and spiny shrubs with yellow flowers.
examples:
- Carex arenaria grows along the Atlantic coast of the United States.
- The rootstock of Carex arenaria has the properties of sarsaparilla.
