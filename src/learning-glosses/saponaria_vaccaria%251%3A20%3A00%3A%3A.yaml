simpleMeaning: A European one-year plant with pale rose-coloured flowers, grown as a flower or self-sown
  as a weed among grain; brought to North America and sometimes classed as a soapwort.
scope: Also called cow cockle, cowherb, Vaccaria hispanica, and Vaccaria pyramidata; not a rose and not
  a weed of wet lands.
examples:
- The Saponaria vaccaria bloomed pale pink among the grain.
- We weeded Saponaria vaccaria from the flower beds.
