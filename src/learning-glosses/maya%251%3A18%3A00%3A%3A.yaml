simpleMeaning: A member of the American Indian people of Yucatan, Belize and Guatemala, whose culture
  peaked between AD 300 and 900 and was known for fine buildings, pots and astronomy.
scope: Not the Maya language or the modern ethnic group; also called Mayan.
examples:
- The Maya built great stone cities in Yucatan.
- Maya potters made fine pots.
