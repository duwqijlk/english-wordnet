simpleMeaning: small pieces rubbed off the surface of something and gathered together, usually used in
  the plural
scope: Small pieces removed from something and gathered, usually in the plural; not a deep bow with the
  foot pulled back, and not a harsh noise.
examples:
- They collected blood scrapings for the test.
- He put the cheese scrapings into a small bowl.
