simpleMeaning: Crops people grow and some fruit trees suffer from this bug, most times bright in colour.
scope: Also called lygaeid bug, it is a bug, most times bright in colour, that eats away at crops people
  grow and some fruit trees.
examples:
- Lygaeids ate through the wheat before it could be cut.
- The orchard keeper picked lygaeids off the young fruit trees.
