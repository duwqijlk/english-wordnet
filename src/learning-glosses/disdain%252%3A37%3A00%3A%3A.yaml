simpleMeaning: to look at someone as below you, with no respect for them
scope: To look down on a person with no respect, not a rude remark that shows it and not the feeling of
  dislike itself.
examples:
- He disdains the people he has to work for.
- The professor disdains students who do not catch on at once.
