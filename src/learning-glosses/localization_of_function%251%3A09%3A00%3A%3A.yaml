simpleMeaning: Each job the body does is kept in its own fairly small place in one part of the body, in
  the study of the body
scope: Also called localization, localisation, localisation of function, localisation principle, and localization
  principle, this says each job of the body is kept in its own fairly small place.
examples:
- Localization of function keeps each job of the body in its own place.
- Localization of function gives each job of the body its own fairly small place.
