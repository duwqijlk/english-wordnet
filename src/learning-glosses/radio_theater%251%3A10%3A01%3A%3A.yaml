simpleMeaning: A story told in voices and sounds alone comes over the air or on audio media such as tape
  or CD.
scope: Unlike a play that is watched, this is a play heard; audio drama, radio drama, and radio theatre
  are other names for it.
examples:
- We listened to a radio theater show.
- The radio theater told its story in sound alone.
