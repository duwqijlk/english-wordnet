simpleMeaning: A building run by the government where people accused of a crime are locked up while they
  wait for their trial, or while they serve their sentence.
scope: Slang for a prison, another name for jail; not a person who shuts things with force.
examples:
- He ended up in the slammer for armed robbery.
- The slammer was overcrowded and short of guards.
