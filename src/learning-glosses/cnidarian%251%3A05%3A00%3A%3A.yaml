simpleMeaning: an animal built in a ring around a centre, with a bag-like body, one opening, and stinging
  feelers, found as a fixed polyp or a free-swimming medusa
scope: 'Also called a coelenterate: a stinging sea animal with a bag-like body, not a fish and not a worm.'
examples:
- A cnidarian stung her hand as she swam.
- Jellyfish are cnidarians that drift in the open sea.
