simpleMeaning: showing little thought and little care for other people's feelings
scope: 'Also called offhand: this describes a person or manner that shows little thought or care for others,
  not the word that tells how an action is done.'
examples:
- His offhanded reply hurt her feelings.
- She gave an offhanded wave and walked away without a word.
