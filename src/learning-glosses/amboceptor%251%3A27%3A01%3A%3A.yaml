simpleMeaning: An immune body formed in the blood during infection or immunization, linking the complement
  to the antigen.
scope: This names a thing made in the blood, one that links the body's own guard force to the germ it
  must fight.
examples:
- Amboceptor joined the guard force to the germ.
- Amboceptor formed in her blood while she was ill.
