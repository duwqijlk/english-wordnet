simpleMeaning: In baseball, a runner's safe advance to the next base while a pitch is delivered, without
  help from a hit, walk, passed ball or wild pitch.
scope: In baseball, the stolen base itself — a runner's safe advance during a pitch — not the act of stealing
  a base, a bargain purchase, or taking something unlawfully.
examples:
- He had two steals in the game.
- Her steal in the seventh inning put the runner in scoring position.
