simpleMeaning: Any of many American oaks with four stamens per floret, acorns that take two years to ripen,
  and leaf veins that usually extend past the edge as points or bristles.
scope: This is the group of American oaks whose leaf veins run out into points or bristles and whose acorns
  take two years to ripen; it is not the white oak group, which lacks such points and ripens its acorns
  in one season.
examples:
- The red oak in the front yard turns deep crimson every October.
- Cabinet-makers value red oak for its open grain and warm colour.
