simpleMeaning: One of several wildflowers of the Americas, it has a lower lip that swells into a pouch,
  and gardeners find it hard or impossible to grow.
scope: Also called lady's-slipper, lady's slipper, lady-slipper, lady slipper, and slipper orchid, this
  wildflower of the Americas is one of several kinds whose lower lip swells into a pouch, and gardeners
  find it hard or impossible to grow.
examples:
- We saw ladies' slippers growing wild along the path.
- A ladies' slipper in the garden died within a week.
