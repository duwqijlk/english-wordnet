simpleMeaning: not able to bend, or hard to bend
scope: This is about a thing that will not bend, not about a person who holds firm and will not change,
  and not about doing something in a way that does not bend easily.
examples:
- The stiff card would not fold into the box.
- The board is too stiff to bend around the corner.
