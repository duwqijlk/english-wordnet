simpleMeaning: all the genes of one living thing, in the order they sit in its cells; the whole of its
  DNA, the plans in its cells for how it grows
scope: The full set of genes of one living thing, in order; not one single gene and not the genes of a
  whole group.
examples:
- The human genome contains approximately three billion chemical base pairs.
- Scientists have mapped the whole genome of the mouse.
