senseId: 'toleration%1:04:00::'
synsetId: 01144645-n
simpleMeaning: the act of officially accepting that people have the right to hold views that differ from
  others, especially in religion
scope: An official act that accepts people's right to hold views that differ from others, especially about
  religion; not a person's own patient, accepting way of dealing with people or situations.
examples:
- The new law brought toleration for all faiths in the land.
- Under this rule, toleration let people worship as they chose.
