simpleMeaning: A Christian holy rite that honours Christ's last meal with his friends by blessing bread
  and wine
scope: Liturgy, Eucharist, Eucharistic liturgy, Holy Eucharist, Holy Sacrament and Lord's Supper are other
  names for this sense, and it is set apart from other Christian rites by its use of bread and wine.
examples:
- The sacrament of the Eucharist is shared at the Sunday service.
- At the sacrament of the Eucharist, bread and wine are blessed.
