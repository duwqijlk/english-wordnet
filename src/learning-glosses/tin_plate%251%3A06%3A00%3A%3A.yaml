simpleMeaning: Used especially for cans, pots, and small boxes, this thin sheet of metal, iron or steel,
  is coated with a bright metal to stop rust.
scope: Also called tinplate, this thin sheet of iron or steel is coated with a bright metal to stop rust
  and used especially for cans, pots, and small boxes.
examples:
- He cut a piece of tin plate to patch the pot.
- Cans of tin plate do not rust.
