simpleMeaning: a published work such as a book or article, or a passage from one, that someone mentions
  or uses for information
scope: This is not the place, person, or thing something comes from, and not the person who starts something;
  it is a written work or passage used for information.
examples:
- The historian lists her sources at the end of each chapter.
- He checked every source before quoting it in his essay.
