simpleMeaning: a part made of two nitrogen atoms joined twice, with a join on each side to parts made
  of hydrogen and carbon
scope: 'Also called azo group: a part of two nitrogen atoms joined twice, not the azido group of three
  nitrogen atoms.'
examples:
- The azo radical links two carbon groups in the dye.
- Chemists use the azo radical to join two parts of a molecule.
