simpleMeaning: someone not part of a case who gives a judge advice about a point of law, usually to shape
  how a case that matters to many people ends
scope: 'Also called amicus curiae: someone who gives a judge advice about the law but takes no part in
  the case, not a lawyer for one side and not a witness.'
examples:
- The charity acted as a friend of the court, offering advice on the new law.
- A friend of the court asked the judge to hear how the ruling would affect patients.
