simpleMeaning: Any of several prickly climbing plants of tropical America, of the group called Smilax,
  with sweet-smelling roots and heart-shaped leaves.
scope: A prickly climbing plant of tropical America with sweet-smelling roots and heart-shaped leaves,
  not the fizzy drink made from its root.
examples:
