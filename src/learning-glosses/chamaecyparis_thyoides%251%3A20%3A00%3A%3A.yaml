scope: This is a slow-growing tree of middle size from the east coast of the United States, also called
  coast white cedar, southern white cedar, white cedar, white cypress or Atlantic white cedar; it is not
  the tall Pacific coast cedar and not the American arborvitae it looks like.
examples:
- The Chamaecyparis thyoides by the pond grows slowly.
- A Chamaecyparis thyoides stands at the edge of the garden, still small after many years.
