simpleMeaning: Sun count from Gregory XIII in 1582, fixing the Julian count by cutting 10 days, century
  years leap only when divisible by 400; in Britain and America from 1752.
scope: Also called New Style calendar; the sun count now in use, not the Julian count it replaced and
  not a moon count.
examples:
- The Gregorian calendar is used in most countries today.
- Britain took up the Gregorian calendar in 1752.
