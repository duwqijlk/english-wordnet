simpleMeaning: A person who is tested or watched as part of a trial or study, to see what happens to them.
scope: A person who is tested or watched as part of a trial or study, to see what happens to them; case
  and subject are other names for this sense, not a small pet animal with no tail.
examples:
- The guinea pigs in the study were watched day and night.
- She agreed to be a guinea pig for the new drug trial.
