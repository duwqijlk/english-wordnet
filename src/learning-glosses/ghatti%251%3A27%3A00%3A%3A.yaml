simpleMeaning: A gum from India that comes from the dhawa tree and stands in for gum arabic
scope: This is a gum from India that comes from the dhawa tree and stands in for gum arabic; ghatti gum
  is another name for this sense, not gum arabic itself and not any other tree gum.
examples:
- Ghatti is used to thicken inks and dyes.
- The maker added ghatti to the mixture in place of gum arabic.
