simpleMeaning: The young of other kinds are taken by this insect to its own nest, where they are brought
  up to work for the colony that took them.
scope: Also called a slave-making ant, this insect takes the young of other kinds to work in its own nest.
examples:
- The slave-maker ants raided the nest and carried off the young.
- A slave-maker colony grows by making the young of other ants work for it.
