simpleMeaning: The royal house that ruled Scotland from 1371 to 1714 and England from 1603 to 1649 and
  again from 1660 to 1714
scope: The royal house that ruled Scotland and England in those years; not one king alone and not a family
  of common folk.
examples:
- The Stuarts ruled Scotland for more than three hundred years.
- Charles I was a Stuart king.
