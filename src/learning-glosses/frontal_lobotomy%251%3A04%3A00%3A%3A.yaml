simpleMeaning: Clear changes in how a person thinks and acts often follow an operation that cuts the nerve
  paths to and from the front part of the brain
scope: Also called lobotomy, leucotomy, leukotomy, prefrontal leucotomy, prefrontal leukotomy and prefrontal
  lobotomy, an operation on the front of the brain, not a drug treatment.
examples:
- The surgeon performed a frontal lobotomy to cut the nerve paths to the front of the brain.
- After a frontal lobotomy, his way of thinking and acting had changed a lot.
