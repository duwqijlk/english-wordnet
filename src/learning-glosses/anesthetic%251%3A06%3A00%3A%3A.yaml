simpleMeaning: A drug that causes a loss of feeling in the body for a short time
scope: 'Also called anaesthetic: this is the drug itself, not the describing word for something that stops
  feeling.'
examples:
- The dentist gave her an anesthetic before pulling the tooth.
- The anesthetic wore off a few hours after the operation.
