simpleMeaning: A state of feeling bad, from a small sense of discontent up to deep grief
scope: This is a state of feeling bad, from mild discontent to deep grief, not a short flash of anger
  or a single bad day.
examples:
- Her unhappiness showed in her face all day.
- The unhappiness of the long winter weighed on them both.
