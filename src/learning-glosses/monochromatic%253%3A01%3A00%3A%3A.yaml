simpleMeaning: To do with seeing in shades of grey only, with no colour vision at all.
scope: To do with seeing in shades of grey only, with no colour vision at all, not the use for light or
  other rays that have only one wavelength.
examples:
- His vision was monochromatic, and the world came to him in shades of grey.
- Her sight was monochromatic after the illness, and colours faded to grey.
