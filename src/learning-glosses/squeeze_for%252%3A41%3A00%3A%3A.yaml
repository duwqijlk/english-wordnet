simpleMeaning: to press a person hard until they hand over money, things they know, or other things they
  hold
scope: To press a person hard until they hand over money or things they know; not simply to ask, and not
  to take by force with a weapon.
examples:
- They tried to squeeze the clerk for the names on the list.
- The gang would squeeze shop owners for money every week.
