simpleMeaning: In computer science, part of a computer's fast memory (RAM), set aside to hold data and
  kept up to date, to make data move better between unlike parts
scope: 'Also called memory cache: a part of a computer''s fast memory, not a hidden place where money,
  food or weapons are kept.'
examples:
- The computer keeps data it uses often in its cache.
- Clearing the cache made the program load its data in a new way.
