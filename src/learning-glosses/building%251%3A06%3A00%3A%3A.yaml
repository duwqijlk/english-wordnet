simpleMeaning: a structure with a roof and walls that stays in one place, such as a house, school or office.
scope: It is not the work or business of constructing; it is the finished structure itself.
examples:
- The building on the corner has been empty for years.
- They walked into a tall building and took the lift to the top floor.
