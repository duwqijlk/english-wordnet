simpleMeaning: having a colour with no hue, at any lightness between white and black
scope: This colour adjective, also called grey, grayish or greyish, is not the noun naming the colour,
  the aged white-haired sense, or the Civil War uniform sense.
examples:
- He wore a gray flannel suit to the interview.
- The walls of the office were gray and plain.
