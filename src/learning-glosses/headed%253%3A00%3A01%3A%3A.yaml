simpleMeaning: Often used in compounds to say what sort of top or front end something has, or that it
  has a part filling that role.
scope: About what kind of top or front part something has, not about a title or caption, a set direction
  of travel, or a vegetable that has formed a firm centre.
examples:
- The three-headed dog guarded the gate.
- The headed bolts held the steel frame together.
