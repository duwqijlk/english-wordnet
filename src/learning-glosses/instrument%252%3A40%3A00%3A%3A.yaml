simpleMeaning: to fit something with tools that measure, record, or control it
scope: This is fitting something with tools to measure, record, or control it, not a device that makes
  music sounds and not a paper that gives a legal right.
examples:
- The engineers instrumented the bridge to record how it moved.
- They instrumented the new plane before its first test flight.
