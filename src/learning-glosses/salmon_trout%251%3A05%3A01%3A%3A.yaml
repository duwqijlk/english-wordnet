simpleMeaning: a fish with spots on its skin from rivers in Europe, now also found in North America
scope: This is a spotted river fish from Europe, also called brown trout; not the big lake fish from Canada
  and not the flesh of the fish eaten as food.
examples:
- A salmon trout rose to the fly in the river.
- The salmon trout was first brought to North America from Europe.
