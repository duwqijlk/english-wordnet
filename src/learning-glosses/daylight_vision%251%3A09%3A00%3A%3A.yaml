simpleMeaning: Normal vision in daylight, with enough light for the cones to be active and for colour
  to be perceived
scope: This is also called photopic vision, and it works in daylight or other sufficient light, not in
  dim light.
examples:
- Daylight vision lets us see colours clearly in bright sunshine.
- In daylight vision, the cone cells in the eye are at work.
