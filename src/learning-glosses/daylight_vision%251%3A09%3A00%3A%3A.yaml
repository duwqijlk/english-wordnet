simpleMeaning: When there is enough brightness for the cone cells in the eye to work, colours can be seen
  and sight is at its normal best in bright sunshine.
scope: This is also called photopic vision, and it works only in bright sunshine, not in dim light.
examples:
- Daylight vision lets us see colours clearly in bright sunshine.
- In daylight vision, the cone cells in the eye are at work.
