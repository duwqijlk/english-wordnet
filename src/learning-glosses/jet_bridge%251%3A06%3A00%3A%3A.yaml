simpleMeaning: A walkway that can be made longer, for passengers to board large planes that carry people
  for money, giving a covered way from the waiting area to the plane.
scope: A walkway that can be made longer, for passengers to board large planes; not a set of steps rolled
  to a plane and not a covered walkway that cannot move.
examples:
- Passengers crossed the jet bridge to reach the plane.
- The jet bridge moved out to meet the plane's door.
