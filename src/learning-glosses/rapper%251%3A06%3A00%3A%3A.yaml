simpleMeaning: a thing fixed to a door by a hinge (a joint that lets it swing), usually made of metal
  and made to look nice
scope: 'Also called knocker and doorknocker: a thing on a door for knocking, usually metal, not a person
  who sings or talks in rhythm to music.'
examples:
- She lifted the brass rapper and knocked twice on the front door.
- The old house had a heavy iron rapper shaped like a lion's head.
