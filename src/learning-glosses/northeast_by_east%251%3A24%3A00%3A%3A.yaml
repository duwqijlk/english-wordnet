simpleMeaning: The compass point one step to the right of the point halfway between the top point and
  the right-hand point
scope: This is the compass point one step clockwise from the halfway point between the top and right-hand
  points; not that halfway point itself and not the next point round.
examples:
- The wind blew from northeast by east.
- They steered northeast by east all morning.
