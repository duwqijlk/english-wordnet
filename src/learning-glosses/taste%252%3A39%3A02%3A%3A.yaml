simpleMeaning: To have a particular flavor, or to carry the flavor of something.
scope: This describes how food or drink comes across on the tongue; it is not the act of trying something
  in order to judge it.
examples:
- This soup tastes of garlic and thyme.
- The cheese tastes strongly of smoke.
