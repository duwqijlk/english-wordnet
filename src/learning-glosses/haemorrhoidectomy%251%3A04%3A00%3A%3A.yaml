simpleMeaning: An operation to tie swollen veins near the opening where solid waste leaves the body and
  cut them away.
scope: An operation to tie swollen veins near the opening where solid waste leaves the body and cut them
  away; hemorrhoidectomy is another name for it, not the swollen vein itself and not a measure of red
  blood cells in the blood.
examples:
- The surgeon did a haemorrhoidectomy to cut the swollen veins away.
- After the haemorrhoidectomy, the pain was gone.
