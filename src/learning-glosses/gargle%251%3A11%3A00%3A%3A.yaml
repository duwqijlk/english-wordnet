senseId: 'gargle%1:11:00::'
synsetId: 07398623-n
simpleMeaning: the sound a person makes when they hold liquid in the back of the mouth and blow air through
  it
scope: This is only the sound made in the mouth and throat. It is not the liquid used to wash the mouth,
  and not the act of washing the mouth with it.
examples:
- A soft gargle came from his throat as the water moved around.
- The gargle lasted a few seconds, then he spat out the water.
