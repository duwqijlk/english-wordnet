simpleMeaning: 'used of a person or a thing made by someone: showing new ideas of their own in thought
  or in what they do'
scope: 'Also called imaginative: this describes a person, or a thing a person made, that shows new thinking
  of its own, not just skill at copying others.'
examples:
- She is an inventive cook who finds new ways to use leftovers.
- They built an inventive tool for picking fruit from high branches.
