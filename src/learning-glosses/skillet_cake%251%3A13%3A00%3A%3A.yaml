simpleMeaning: turned over so the fruit is on top, batter is baked on top of a layer of sweet fruit
scope: It is also called an upside-down cake, batter baked on sweet fruit and turned over so the fruit
  is on top, not a cake with the fruit mixed through it.
examples:
- The skillet cake had the fruit on top.
- She turned the skillet cake over.
