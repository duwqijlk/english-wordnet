simpleMeaning: A building with a bar and rooms open to all, where drink is sold and small meals are often
  served
scope: 'Also called a pub, saloon, gin mill, or public house: a building with a bar and rooms open to
  all where drink is sold, not a shop and not a home.'
examples:
- We stopped at the pothouse for a drink and a small meal.
- The old pothouse by the river had a bar and rooms open to all.
