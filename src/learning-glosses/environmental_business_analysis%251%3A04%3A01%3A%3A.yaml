simpleMeaning: A broad term for the set way of spotting outside forces that bear on a firm, weighing what
  they do, and making a plan to blunt them or use them
scope: This is a broad term for the set way of spotting outside forces that bear on a firm, weighing what
  they do, and making a plan to blunt them or use them; business environment analysis and business environmental
  analysis are other names for it, not a one-off guess and not a plan for one outside force alone.
examples:
- The firm used environmental business analysis to weigh outside forces.
- Environmental business analysis helped them make a plan to blunt the outside forces.
