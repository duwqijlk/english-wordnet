simpleMeaning: A small sea animal with claws, good to eat, from the Pacific coast of North America.
scope: Also called Cancer magister; a small edible sea animal of the Pacific coast, not the meat sold
  as food, which is another sense of the same name.
examples:
- We caught a Dungeness crab off the Pacific coast.
- The Dungeness crab is small but good to eat.
