simpleMeaning: A drug that fights viruses, used to treat AIDS; its bad side effects include harm to the
  liver and a slowing of the bone marrow.
scope: Also called zidovudine, AZT and ZDV, and sold as Retrovir; a drug that fights viruses and is used
  to treat AIDS, not a drug that cures AIDS.
examples:
- The doctor gave her Retrovir as part of her AIDS treatment.
- Retrovir can harm the liver, so patients need blood tests.
