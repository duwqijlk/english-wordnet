simpleMeaning: so gripped by fear that one cannot move, held frozen stiff and dazed with terror
scope: This describes terror that leaves a person unable to move, not a physical loss of feeling in the
  body.
examples:
- She stood numb with fear as the lights went out.
- The children sat numb with fright, too scared to make a sound.
