simpleMeaning: The round end of the lower jaw fits into a deep hollow in the bone at the side of the head,
  at the foot of the cheek arch.
scope: 'Also called glenoid fossa: a deep hollow in the bone at the side of the head that takes in the
  round end of the lower jaw.'
examples:
- The mandibular fossa holds the round end of the lower jaw.
- The jaw moves in the mandibular fossa when we chew.
