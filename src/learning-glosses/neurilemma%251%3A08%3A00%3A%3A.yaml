simpleMeaning: A thin skin-like cover around a nerve thread.
scope: A thin skin-like cover around a nerve thread, not the thread itself and not the fat around it;
  also called neurolemma.
examples:
- The neurilemma is the thin cover around a nerve thread.
- Harm to the neurilemma can slow the signals in the thread.
