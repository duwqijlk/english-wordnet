simpleMeaning: A small bit of protein set free from the amino end of fibrinogen when thrombin acts on
  it, so that fibrin can form as blood clots
scope: A small bit of protein set free from the amino end of fibrinogen when thrombin acts on it, so that
  fibrin can form as blood clots; not fibrin itself and not other bits of protein in blood.
examples:
- Fibrinopeptide is set free as blood clots.
- Thrombin cuts fibrinopeptide from fibrinogen.
