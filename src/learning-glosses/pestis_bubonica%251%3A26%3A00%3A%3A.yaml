simpleMeaning: the most common form of plague in people, with chills, great weakness, wild confused thoughts,
  and swellings in the armpits and groin; it does not pass from person to person
scope: 'Also called bubonic plague and glandular plague: the most common form of plague in people, not
  other forms of plague and not a sickness that passes from person to person.'
examples:
- Pestis bubonica causes swellings in the armpits and groin.
- Pestis bubonica does not pass from person to person.
