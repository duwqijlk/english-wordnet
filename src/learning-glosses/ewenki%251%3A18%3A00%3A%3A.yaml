simpleMeaning: In the north of Mongolia and the east of Siberia live a people, and this person is one
  of them.
scope: This person is one of a people who live in the north of Mongolia and the east of Siberia; Evenki
  is another name for this sense, not the tongue they speak.
examples:
- An Ewenki woman cooked supper for her family.
- Ewenki families live in the north of Mongolia and the east of Siberia.
