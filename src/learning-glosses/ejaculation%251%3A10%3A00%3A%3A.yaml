simpleMeaning: a short, strong word or sound that a person suddenly says to show a strong feeling
scope: Another name for this is interjection. It is a sudden word or cry that shows feeling, not the body
  sense where semen (the liquid from a man's body that can start a baby) leaves a man's body.
examples:
- His ejaculation of 'Never!' showed how angry he was.
- She gave a short ejaculation of surprise and covered her mouth.
