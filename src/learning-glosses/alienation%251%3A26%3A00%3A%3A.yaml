simpleMeaning: the state of being apart from others because people are unfriendly to each other
scope: 'Also called estrangement: being apart because people are unfriendly, not the act of making someone
  unfriendly, not the feeling of being left out, and not the giving of land to another person in law.'
examples:
- His angry words led to alienation between the two old friends.
- Years of alienation grew after the families stopped speaking to each other.
