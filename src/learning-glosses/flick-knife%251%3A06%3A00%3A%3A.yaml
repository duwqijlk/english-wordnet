simpleMeaning: a small tool you keep in a pocket, with a sharp edge that comes out fast when a button
  on it is pressed
scope: 'Also called a flick knife and a switchblade: a small cutting tool that fits in a pocket and opens
  at the press of a button, not a fixed cutting tool and not one made for the kitchen.'
examples:
- He opened the flick-knife with one press of the button.
- A flick-knife is handy because it opens fast.
