simpleMeaning: to hurt a joint by jerking it suddenly and sharply
scope: This is the injury sense, jerking a joint until it hurts, not the strain itself as a noun, not
  pulling something off by force, and not squirming while held.
examples:
- She twisted her ankle on the uneven path.
- He twisted his knee trying to stop suddenly.
