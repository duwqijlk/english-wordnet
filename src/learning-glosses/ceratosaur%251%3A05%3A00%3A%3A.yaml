simpleMeaning: An early, medium-sized theropod, a fast-running two-legged meat-eating dinosaur with grasping,
  sharp-clawed hands and a short horn between the nostrils, found in North America during the Jurassic.
scope: This is the medium-sized Jurassic meat-eater with a short nose horn, not the much larger tyrannosaurs
  or the horned, plant-eating ceratopsians.
examples:
- The ceratosaur had a small horn on its snout and sharp claws on its hands.
- Ceratosaur bones from North America date to the Jurassic period.
