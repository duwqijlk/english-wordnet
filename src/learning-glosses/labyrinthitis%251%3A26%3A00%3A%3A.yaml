simpleMeaning: Soreness and swelling of the inner ear, which can make a person feel dizzy and throw up.
scope: Soreness and swelling of the inner ear, which can make a person feel dizzy and throw up; otitis
  interna is another name for this sense, not an outer ear infection and not ordinary travel sickness.
examples:
- Labyrinthitis left her dizzy for days.
- He was treated for labyrinthitis after the room began to spin.
