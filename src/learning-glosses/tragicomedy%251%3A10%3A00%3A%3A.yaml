simpleMeaning: Sad and funny parts sit side by side in this play, and the sad parts most often come out
  on top.
scope: This is a play with both sad and funny parts, where the sad parts most often win out, not a play
  that is all sad and not one that is all funny.
examples:
- The tragicomedy made the audience laugh in one scene and fall silent in the next.
- The jokes in the tragicomedy could not hold back the sad parts.
