simpleMeaning: a natural process in which living things change over a long time, so that the ones best
  fit for their place live and have young
scope: 'Also called selection: the long change of living things in nature, not just staying alive and
  not a thing left from the past.'
examples:
- The teacher used island birds to explain survival as a long natural change.
- Survival over many years gave the desert plants thick skins that hold water.
