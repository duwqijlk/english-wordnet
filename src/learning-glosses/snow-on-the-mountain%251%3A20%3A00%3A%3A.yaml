scope: A yearly spurge of western United States with showy white-bracted flower clusters and very toxic
  sap, also called ghost weed or snow-in-summer; not a garden flower and not a shrub.
examples:
- Snow-on-the-mountain bloomed white along the dry roadside.
- The snow-on-the-mountain had a sap so harmful that children were kept away.
