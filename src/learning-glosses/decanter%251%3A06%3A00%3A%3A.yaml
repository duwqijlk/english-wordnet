simpleMeaning: A bottle that has a piece to close its top, used for serving wine or water
scope: 'Also called carafe: a bottle for serving wine or water at a meal, not a small glass you drink
  from and not a bottle for keeping wine for a long time.'
examples:
- He poured the wine from the decanter into our glasses.
- She filled the decanter with water and put the stopper back in.
