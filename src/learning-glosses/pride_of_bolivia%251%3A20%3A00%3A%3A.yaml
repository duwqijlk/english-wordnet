simpleMeaning: A South American tree that keeps some of its leaves through the year, with paired leaflets
  and one at the tip and bright gold flowers, grown for show.
scope: Also called tipu, tipu tree, and yellow jacaranda; not the pride of California, a shrubby plant
  with large pink or violet flowers grown for show.
examples:
- The pride of Bolivia outside the library is covered in gold flowers.
- We planted a pride of Bolivia in the park because it keeps some leaves all year.
