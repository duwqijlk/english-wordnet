simpleMeaning: a plant that can make its own food from simple things that contain carbon
scope: 'Also called autophyte, autophytic plant, and autotrophic organism: a plant that makes its own
  food, not a plant that must feed on other living things and not an animal.'
examples:
- Green plants are autotrophs that make their own food from sunlight and air.
- An autotroph does not need to eat other living things to live.
