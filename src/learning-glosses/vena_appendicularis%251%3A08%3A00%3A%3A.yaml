simpleMeaning: Draining into the tube of the lower gut, a blood tube runs beside the tube serving the
  appendix.
scope: Also called appendicular vein, this blood tube drains into the tube of the lower gut after running
  beside the tube that serves the appendix, not that tube itself.
examples:
- The vena appendicularis runs beside the artery serving the appendix.
- Blood from the vena appendicularis drains into the ileocolic vein.
