simpleMeaning: A plant that came from Europe and has spread to the eastern United States and California,
  where it now grows wild
scope: A plant that came from Europe and has spread to the eastern United States and California, where
  it now grows wild, also called curled leaf pondweed; not a plant of the sea and not a garden plant grown
  for its flowers.
examples:
- Curly pondweed now grows wild in the lake near our house.
- The curly pondweed in the stream came from Europe.
