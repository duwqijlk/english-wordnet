simpleMeaning: hard parts like bone in the jaws of animals with a backbone, used for biting and chewing
  or for attack and defense
scope: A hard part in the mouth of a person or animal, used for biting and chewing; not a similar part
  in an animal with no backbone and not a small point on a gear.
examples:
- He broke a tooth when he bit into the hard bread.
- Her front tooth hurt, so she went to see a dentist.
