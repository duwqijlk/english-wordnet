simpleMeaning: the part of medicine that studies and treats illness of the muscles, the cords that join
  muscle to bone, and the joints
scope: Not the study of bones alone, and not the care of wounds; the medicine of muscle, tendon and joint
  illness.
examples:
- She chose rheumatology after years in general medicine.
- Rheumatology covers aches in joints and muscles.
