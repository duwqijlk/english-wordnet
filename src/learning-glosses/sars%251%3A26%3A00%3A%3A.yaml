simpleMeaning: A disease of the breathing system, cause unknown, that seemed to start in mainland China
  in 2003; it brings fever, coughing, breathing trouble or low oxygen, and it can kill.
scope: A disease of the breathing system, also called severe acute respiratory syndrome; not flu and not
  a common cold.
examples:
- SARS spread quickly in 2003.
- Patients with SARS often had fever and a bad cough.
