simpleMeaning: Any of several kinds of moth young that eat and spoil the seed pods of cotton plants
scope: Any of several kinds of moth young that spoil cotton seed pods; not a worm that lives in the soil
  and not a moth that eats leaves.
examples:
- The bollworm ruined much of the cotton crop.
- Farmers spray the fields to kill bollworms before they eat the bolls.
