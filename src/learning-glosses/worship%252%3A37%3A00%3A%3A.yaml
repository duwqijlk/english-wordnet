simpleMeaning: to love a person or thing too much, or without asking questions or seeing faults, and to
  treat them with great love and respect, as for a god
scope: To love a person or thing too much and treat them as a god, not the activity of showing love and
  respect to a god in religion.
examples:
- Teenagers worshipped the famous singer.
- He worships his older brother and copies everything he does.
