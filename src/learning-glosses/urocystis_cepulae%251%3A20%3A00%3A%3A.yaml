simpleMeaning: A soot-like fungus that makes dark blisters on onion scales and leaves, and is worst of
  all for young plants
scope: Also called onion smut; a soot-like fungus of onions, known by the dark blisters on scales and
  leaves and by the harm it does to young plants.
examples:
- Urocystis cepulae left dark blisters on the onion leaves.
- The seedlings died after Urocystis cepulae spread through the bed.
