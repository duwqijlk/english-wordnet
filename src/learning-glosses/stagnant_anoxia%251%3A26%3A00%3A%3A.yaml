simpleMeaning: a lack of air in the body parts, from slow blood flow at the edges of the body, as after
  the heart fails to pump well
scope: A lack of air in the body parts, from slow blood flow at the edges of the body, as after the heart
  fails to pump well; ischemic anoxia is another name for this sense, not a lack of air from thin mountain
  air and not a lack of air in the blood alone.
examples:
- Stagnant anoxia followed the slow blood flow in her legs.
- Stagnant anoxia set in after her heart failed to pump well.
