simpleMeaning: any chemical part of the form with carbon and oxygen joined to a part made of carbon
scope: 'Another name for an acyl group: any chemical part of carbon and oxygen joined to a carbon-based
  part, not one kind alone such as the acetyl group and not a whole acid.'
examples:
- Chemists call this part an acyl because it has carbon and oxygen joined to a carbon-based part.
- An example of an acyl is the acetyl group.
