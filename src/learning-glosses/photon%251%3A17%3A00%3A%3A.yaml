simpleMeaning: In physics, the smallest single bit of light or other such waves of energy (radiation),
  and a basic tiny bit that is its own opposite bit
scope: In physics, the smallest single part of light and other such rays, not a whole wave and not an
  atom.
examples:
- Each photon carries a tiny amount of energy from the sun.
- The machine counts every photon that hits it.
