schema: oewn-learning-gloss-v2
senseId: 'allochthonous%3:00:00::'
synsetId: 00181796-a
simpleMeaning: used of rocks, deposits and other such things found in a place other than the place where
  they and the things they are made of were formed
scope: Used of rocks and deposits found where they did not form, not of rocks that formed where they lie
  and not of things carried by people.
examples:
- The allochthonous rocks had been carried far from where they formed.
- Geologists called the deposit allochthonous because its stones came from another place.
