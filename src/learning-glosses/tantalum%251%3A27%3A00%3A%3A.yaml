simpleMeaning: A hard grey bright metal that air and water wear away almost never; it is found in the
  ores niobite, fergusonite and tantalite.
scope: A hard grey metal that stands up to wear from air and water, close to other grey metals that do
  not rust; also called Ta and atomic number 73.
examples:
- Tantalum is used in parts that must not wear away.
- The makers chose tantalum for the small strong parts.
