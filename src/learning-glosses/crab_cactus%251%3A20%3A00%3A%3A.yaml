simpleMeaning: People often grow this jointed plant from South America in their homes; its flowers are
  usually red, and some place it in the Schlumbergera group.
scope: A jointed plant from South America with usually red flowers, often grown in homes, not a desert
  cactus with spines.
examples:
- The crab cactus on the shelf had red flowers.
- She grows a crab cactus as a houseplant.
