simpleMeaning: a one-year North American plant with thin wiry stems, tiny scale-like leaves and small
  yellow blooms
scope: 'Also called nitweed, orange grass and pine-weed: a one-year North American plant with thin wiry
  stems and small yellow blooms, not a tree and not a garden flower.'
examples:
- Pineweed grew in the dry field behind the house.
- The pineweed had tiny yellow blooms.
