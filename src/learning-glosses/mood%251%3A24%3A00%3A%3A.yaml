senseId: 'mood%1:24:00::'
synsetId: 13823636-n
simpleMeaning: In grammar, the different forms of a verb (a word that shows an action or a state) that
  show how the speaker sees the action or state
scope: In grammar, this sense is about the forms a verb can take. It is not the feeling sense of the same
  word, which is about how a person feels at a time.
examples:
- The teacher showed us how the mood of a verb can show a wish.
- In this grammar book, each verb mood shows if the words state a fact or give an order.
