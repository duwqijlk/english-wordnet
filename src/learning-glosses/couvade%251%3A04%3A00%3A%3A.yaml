simpleMeaning: A custom among some peoples in which the husband of a woman about to give birth is put
  to bed when the child is born
scope: This is a custom in which the husband of a woman about to give birth is put to bed when the child
  is born; not a ceremony for the mother herself, and not a feast held after the birth.
examples:
- In that village, the couvade kept the new father in bed for a day.
- The couvade meant the husband lay in bed while his wife gave birth.
