simpleMeaning: You feel uneasy and awkward about yourself, or ashamed, or you are made to feel that way
scope: You feel uneasy and awkward about yourself, or ashamed, or are made to feel that way, not only
  because of shame or hurt pride.
examples:
- He felt embarrassed by the loud praise in front of the class.
- She was embarrassed when her child cried loudly in the shop.
