simpleMeaning: to feel new and clean again, or to make yourself feel new and clean again
scope: About a person becoming fresh again or making themselves fresh again, not about making a thing
  fresh again or making someone feel fresh.
examples:
- She freshened up after the long run.
- He went to the bathroom to freshen up before dinner.
