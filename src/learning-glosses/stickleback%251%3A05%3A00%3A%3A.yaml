simpleMeaning: Small, two-to-four-inch, keen-fighting fishes, mostly bare of scales, with spiny backs,
  of north fresh and shore waters, with fine courting ways, much studied.
scope: This sense is also called prickleback.
examples:
- A stickleback fought in the shallows.
- Sticklebacks court in fresh water.
