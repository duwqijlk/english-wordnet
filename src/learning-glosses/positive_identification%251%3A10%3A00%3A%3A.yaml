simpleMeaning: proof that you are the person you say you are, and that a system already knows you, so
  the system lets you in
scope: This is proof that a system knows you and lets you in, not just a name or a card by itself.
examples:
- The bank asked for positive identification before it let her use her account.
- A system for positive identification can stop one person from using another person's name.
