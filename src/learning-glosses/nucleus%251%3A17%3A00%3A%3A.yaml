simpleMeaning: the center of an atom, tightly packed and with a positive electric charge
scope: This is the middle part of an atom, not the control part inside a living cell, not the center of
  a comet, and not a mass of nerve cells in the brain.
examples:
- The nucleus of an atom has a positive electric charge.
- Most of the weight of an atom is in its small, dense nucleus.
