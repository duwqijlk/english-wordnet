simpleMeaning: The seeming rise in the force that lifts an aircraft in the air when it flies close to
  the earth.
scope: The seeming rise in lift felt by an aircraft flying close to the earth, not a gust of wind and
  not the lift of a wing in open sky.
examples:
- Pilots feel the ground effect as the plane nears the runway.
- The ground effect gives the aircraft extra lift close to the earth.
