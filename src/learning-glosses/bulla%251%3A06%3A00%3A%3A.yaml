simpleMeaning: A round seal made of lead, fixed to a formal letter from the pope
scope: A round lead seal fixed to a letter from the pope, not a wax seal and not a stamp on a letter.
examples:
- The bulla hung from the pope's letter by a cord.
- A round bulla sealed the old document.
