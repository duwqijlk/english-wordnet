simpleMeaning: Any of several kinds of fungus of the Peronosporaceae group live on plants such as grapes,
  potatoes and melons, and harm them.
scope: It is also called false mildew, and it is any of several kinds of fungus that live on and harm
  plants such as grapes, potatoes and melons.
examples:
- Downy mildew spread over the grape leaves.
- Downy mildew grew on the potatoes.
