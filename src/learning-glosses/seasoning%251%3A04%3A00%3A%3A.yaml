simpleMeaning: the act of adding something to food to give it more taste
scope: The act of adding things like salt or spices to food to give it more taste; not the salt or spice
  itself that gets added.
examples:
- Seasoning the soup before it cooks gives it a better taste.
- Careful seasoning can lift a plain dish.
