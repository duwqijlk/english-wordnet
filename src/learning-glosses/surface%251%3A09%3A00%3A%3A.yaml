simpleMeaning: what something seems like on the outside, rather than what it is truly like underneath
scope: This is the shallow, outward side of something rather than its true character; it is not a physical
  outer boundary, and not information that has become public.
examples:
- On the surface, the offer looked generous, but the terms were harsh.
- The newspaper story only touches the surface of a much deeper problem.
