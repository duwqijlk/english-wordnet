simpleMeaning: Mended, usually in a clumsy way, by covering a hole with a piece of cloth.
scope: This is a thing mended clumsily with a piece of cloth over a hole, not a thing marked with spots
  of a different colour.
examples:
- He wore patched jeans to work.
- Her patched coat had seen better days.
