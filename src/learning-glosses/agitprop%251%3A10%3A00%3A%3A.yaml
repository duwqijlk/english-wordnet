simpleMeaning: Art, books and films can carry this kind of political message, above all a communist one,
  meant to win people over.
scope: This message, carried by art, books and films, aims to win people over to a political cause.
examples:
- The theatre put on a piece of agitprop about factory life.
- Those early films were pure agitprop for the party.
