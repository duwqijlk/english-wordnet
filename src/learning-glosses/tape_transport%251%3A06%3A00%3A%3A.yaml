simpleMeaning: To get the magnetic strip across the heads that read it or write on it, a player or recorder
  has this moving part inside it.
scope: This is the moving part inside a player or recorder that gets the strip across the heads, also
  called transport and tape drive.
examples:
- He cleaned the tape transport before playing the old strip.
- The tape transport jammed halfway through the recording.
