simpleMeaning: A plan by a United States president to give money and armed help to any land under threat
  from rule by one party or by the state.
scope: This is one president's aid plan for lands under threat, and it stands apart from the Marshall
  Plan, which rebuilt war-torn Europe, and from a plan of war.
examples:
- The Truman doctrine promised aid to Greece and Turkey.
- Under the Truman doctrine, the United States sent money and arms to countries under threat.
