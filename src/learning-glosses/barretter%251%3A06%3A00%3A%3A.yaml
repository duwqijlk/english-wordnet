simpleMeaning: A resistor put into a circuit to make up for changes, such as those from temperature changes,
  and keep the flow steady.
scope: This part is also called ballast and a ballast resistor, and it is not the wire itself but a part
  put in to steady the flow.
examples:
- The barretter kept the current steady as the set warmed up.
- A barretter in the circuit made up for the change in heat.
