simpleMeaning: a person whose job is to collect money that people owe, such as rent or taxes
scope: 'Also called collector, and another name for it is accumulator: a person paid to collect rent,
  taxes or other money owed, not a person who picks up or brings things together in general.'
examples:
- The rent gatherer came to the house to collect the month's payment.
- The tax gatherer kept a list of everyone who had not yet paid.
