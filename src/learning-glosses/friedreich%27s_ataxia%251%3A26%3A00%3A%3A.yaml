simpleMeaning: Hardening of the back and side columns of the spinal cord, marked by weak muscles and an
  unsteady walk, found in children.
scope: Also called hereditary spinal ataxia; a childhood illness of the spinal cord, not a muscle illness
  of adults.
examples:
- Friedreich's ataxia made her walk unsteady.
- The doctor said Friedreich's ataxia begins in childhood.
