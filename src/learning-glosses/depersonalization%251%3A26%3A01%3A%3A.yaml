scope: In existentialism, losing one's own sense of self and feeling like a nameless part of a social
  machine that does not care about people, also called depersonalisation; not the mind sickness in which
  one loses touch with one's own real self and not simply feeling shy.
examples:
- Depersonalization left him feeling like a nameless part of a vast machine.
- In the novel, depersonalization strips the clerk of his sense of self.
