simpleMeaning: A small brown tree toad with a loud, sharp call heard near wet land in the east of the
  United States and Canada in early spring.
scope: A small brown toad of the eastern wetlands, also called spring peeper; not a frog of the west and
  not a large toad.
examples:
- The Hyla crucifer called loudly from the wet ground at dusk.
- In early spring we heard a Hyla crucifer near the pond.
