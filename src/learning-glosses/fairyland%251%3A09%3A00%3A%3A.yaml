simpleMeaning: something that is only in the mind and is not real, but is often thought to be real
scope: Something only in the mind that people often take as real, not the magic land where fairies live
  in stories.
examples:
- His plan for easy money was a fairyland that never came true.
- She lived in a fairyland where she thought everyone loved her work.
