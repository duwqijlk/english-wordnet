simpleMeaning: the life force that is believed to keep a living body alive and active
scope: This is the life-giving force inside a living body, not a person's usual attitude or drive and
  not the verb meaning to fill someone with energy.
examples:
- Ancient thinkers described a spirit that gave life and movement to every living body.
- Many cultures believe the spirit leaves the body at death.
