simpleMeaning: Light bends at sharp edges or through narrow gaps, making bands of light and dark
scope: Light bending round edges to make light and dark bands, not light passing straight through a lens.
examples:
- Diffraction made bright and dark bands on the screen.
- We saw diffraction when the light passed through the narrow slit.
