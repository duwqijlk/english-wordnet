simpleMeaning: a flower of the western United States with orange-red to deep red blooms marked with dark
  red spots
scope: A flower of the western United States with orange-red to deep red blooms marked with dark red spots;
  leopard lily is another name for this sense, and it is not a flower with plain yellow blooms or a flower
  of the eastern United States.
examples:
- The panther lily blooms in the western United States.
- We saw a panther lily with spotted orange-red blooms.
