simpleMeaning: to be able to have dirt or marks removed from it.
scope: This is the sense of being washable, where the item itself is the subject, not the sense of being
  free from dirt or having tidy habits, not the sense of having no restrictions or conditions, not the
  sense of sound or colour that is clear and undimmed, not the sense of being free from impurities, not
  the sense of a record with no faults, not the manuscript sense for a text with few changes or corrections,
  not the sense of purity required by religious ritual, not the sense of causing no pollution or radiation,
  not the sense of language or behaviour fit for everyone, not the sense of being free from infection,
  not the sense of being morally pure, not the sense of a surface with nothing written or printed on it,
  not the sense of fair play, not the sense of having no troubles, not the sense of being thorough, not
  the sense of carrying no hidden weapon, not the sense of moving or acting deftly, not the sense of being
  free of drugs, not the noun for a weightlifting move, not the adverb senses meaning 'completely' or
  'by the rules', and not the verbs for washing dirt away, removing feathers or pits, tidying a house,
  washing the body, stripping someone of money, emptying something, taking a spot off while washing, removing
  unwanted matter, or shelling and husking.
examples:
- This pan cleans easily with warm water and a soft cloth.
- This jacket cleans well, even after a muddy walk.
