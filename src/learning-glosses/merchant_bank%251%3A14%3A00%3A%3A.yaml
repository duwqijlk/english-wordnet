simpleMeaning: A firm that handles credit card payments for shops, giving them the money from credit card
  sales minus a small fee
scope: A firm that handles credit card payments for shops, keeping a small fee; acquirer is another name
  for this, not a firm that lends money and not a shop itself.
examples:
- The merchant bank processed the shop's card sales.
- Shops pay a fee to their merchant bank.
