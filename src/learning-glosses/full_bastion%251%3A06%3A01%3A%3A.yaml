simpleMeaning: a part of a fort's wall that sticks out, filled up to the top of the wall, with no hollow
  space in the middle
scope: A solid, filled-out part of a fort's defences, not a hollow one and not the main wall itself.
examples:
- The full bastion stood solid, with no hollow space inside it.
- Gunners fired from the full bastion at the top of the fort's wall.
