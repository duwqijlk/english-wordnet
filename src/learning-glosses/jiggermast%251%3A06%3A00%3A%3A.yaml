simpleMeaning: Any small upright pole on a sailing ship, above all the rear pole of a yawl.
scope: Any small upright pole on a sailing ship, above all the rear pole of a yawl; jigger is another
  name for it, not the tall main pole of a ship.
examples:
- The jiggermast swayed as the yawl turned.
- A small flag flew from the jiggermast.
