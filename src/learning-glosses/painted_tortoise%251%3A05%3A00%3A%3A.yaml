simpleMeaning: In the east of the United States, where it is often found, lives this fresh-water turtle
  with bright yellow and red marks
scope: 'Also called painted terrapin and painted turtle: a fresh-water turtle with bright yellow and red
  marks, common in the east of the United States, not a sea turtle and not a land tortoise.'
examples:
- We found a painted tortoise basking on the bank of the creek.
- The painted tortoise swam slowly through the clear pond water.
