simpleMeaning: a second list of choices that shows while you hold the pointer over a choice on the first
  list
scope: 'Also called a cascading menu or a hierarchical menu: a second list of choices that opens from
  a first list, not the first list itself and not a list that stays open all the time.'
examples:
- He clicked the submenu to find the save command.
- The submenu appeared when she held the pointer over 'File'.
