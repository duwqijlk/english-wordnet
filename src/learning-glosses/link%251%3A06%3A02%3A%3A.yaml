simpleMeaning: a system that sends and receives radio signals in both directions, often by microwave,
  as one part of a larger communications network
scope: A two-way microwave radio system within a larger network, also called a radio link, rather than
  a data circuit between locations or a channel between groups.
examples:
- The field team kept in contact with base through a radio link.
- A microwave link carried the live broadcast across the valley.
