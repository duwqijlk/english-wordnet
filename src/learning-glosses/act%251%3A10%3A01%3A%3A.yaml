simpleMeaning: an official legal document that records what a committee, society, or lawmaking body decided
  after discussion
scope: A written law, not a thing someone does, a part of a play, a short performance in a show, or a
  display of false feeling.
examples:
- The new act requires companies to report their emissions.
- Parliament passed the act after months of debate.
