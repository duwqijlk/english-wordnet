simpleMeaning: a piece of action, most often in sport, shown again on television straight after it happened,
  from a tape recording
scope: A recording of a moment in a game or event shown again on television, not playing a recording back
  on a machine.
examples:
- The replay showed the goal from a better angle.
- They watched a replay of the last minute of the match.
