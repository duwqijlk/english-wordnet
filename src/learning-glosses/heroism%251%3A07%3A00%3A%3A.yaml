simpleMeaning: the qualities of a very brave man or woman, and very great courage when facing danger,
  especially in battle
scope: 'Also called valor, gallantry, valiance, valiancy, valorousness and valour: being very brave when
  danger comes, not just doing a kind or helpful act in safe everyday life.'
examples:
- He showed great heroism in battle and saved two men.
- Her heroism during the fire kept the children safe.
