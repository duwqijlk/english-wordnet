simpleMeaning: A thing, or a change, in which ions, small bits of matter with an electric charge, are
  present or make up what it is
scope: A thing or change that is made of ions or takes the form of ions; not a thing made of whole atoms
  and not a change with no electric charge.
examples:
- The ionic charge of the salt is strong.
- Ionic crystals form when the salt dries out.
