simpleMeaning: Shells thrown high into the air over a short distance come from this short gun, loaded
  from the front.
scope: Also called mortar, and howitzer is another name for it, this short gun is the one loaded from
  the front for firing shells high over a short distance.
examples:
- The trench mortar fired, and its shells rose high into the air.
- Soldiers loaded the trench mortar from the front.
