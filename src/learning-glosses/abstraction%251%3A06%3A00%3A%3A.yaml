senseId: 'abstraction%1:06:00::'
synsetId: 02671631-n
simpleMeaning: a painting that does not show people or things as they look in real life, but uses shapes
  and colors
scope: This is a painting that uses shapes and colors and does not show things as they look, not the act
  of forming a general idea from points shared by many cases.
examples:
- She hung a bright abstraction on the living room wall.
- The gallery bought a new abstraction full of red and blue shapes.
