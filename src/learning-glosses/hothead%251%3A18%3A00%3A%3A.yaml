simpleMeaning: a person who acts quickly without thinking, takes risks without care, and does not think
  about what should be done or what may happen
scope: 'Also called lunatic, daredevil, madcap and swashbuckler: a person who rushes into danger without
  thinking, not just a person who gets angry quickly.'
examples:
- The young hothead drove far too fast down the narrow road.
- Only a hothead would jump into the deep river without checking it first.
