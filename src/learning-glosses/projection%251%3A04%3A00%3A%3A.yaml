simpleMeaning: the act of forcing something out of a place with power
scope: The act of forcing something out with power, not a guess about the future and not the showing of
  a film image on a screen.
examples:
- The projection of steam from the vent filled the room.
- The machine's projection of hot air kept the workshop warm.
