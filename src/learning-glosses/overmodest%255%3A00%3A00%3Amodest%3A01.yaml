simpleMeaning: Shy or modest in a put-on way, above all when joking or trying to stir a reaction.
scope: Shy or modest in a put-on way; coy and demure are other names for this sense, not plain shyness
  and not true modesty.
examples:
- She gave an overmodest smile when they praised her work.
- His overmodest reply hid how proud he really was.
