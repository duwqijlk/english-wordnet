simpleMeaning: a person whose work is to put goods on and take goods off ships in a port
scope: This sense is also called loader. It is a worker who loads and unloads ships in a port, not a sailor
  who travels on a ship.
examples:
- The dockworkers loaded the boxes onto the ship before dawn.
- Every dockworker at the port wore a bright vest.
