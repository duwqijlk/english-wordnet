simpleMeaning: a person whose religious beliefs go against the fixed teaching of the Roman Catholic Church
scope: A person whose religious beliefs go against the fixed teaching of the Roman Catholic Church, also
  called heretic and religious outcast; not a person of another faith in general and not an atheist.
examples:
- The Church called him a misbeliever for his views.
- A misbeliever holds beliefs against Church teaching.
