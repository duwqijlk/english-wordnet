simpleMeaning: a row of houses that look alike and share walls with the houses next to them, or the street
  they face
scope: A row of joined houses, or their street; not a flat outdoor area next to a house and not a flat
  level of land on a slope.
examples:
- She bought a house in a small terrace in the city.
- The whole terrace shares the same red doors and joined walls.
