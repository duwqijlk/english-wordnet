simpleMeaning: the firing at the same time of all the weapons on one side of a war ship
scope: This is the firing of all the weapons on one side of a war ship at once, not a printed advertisement
  and not the side of a ship itself.
examples:
- The warship fired a broadside at the enemy ship.
- One broadside sent shots from every gun on that side of the ship.
