simpleMeaning: The flowers, vegetables, fruits or herbs that someone grows in a garden.
scope: This means the plants that a gardener grows, taken as a group, not the piece of ground where they
  grow. It is a much less common use than the everyday one in which 'garden' means the plot of ground
  itself. A reader will usually take 'garden' to mean the ground unless the sentence clearly refers to
  the crops.
examples:
- They picked the garden clean before the first frost.
- She spent September canning the garden for the winter.
