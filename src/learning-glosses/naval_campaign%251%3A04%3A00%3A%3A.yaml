simpleMeaning: A sea operation carried out mainly by a country's navy to win, widen, or hold control of
  the sea.
scope: A sea operation by a country's navy to win or hold control of the sea, not a land battle and not
  a single sea fight.
examples:
- The naval campaign won control of the sea lanes.
- Admirals planned the naval campaign for the spring.
