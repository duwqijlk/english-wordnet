simpleMeaning: said of events that lead to terrible results and bring ruin.
scope: This is not about a wicked source or a shameful act; it describes events whose results are disastrous.
examples:
- It was a black day for the town when the mine closed.
- That was a black year for farmers, with drought followed by flood.
