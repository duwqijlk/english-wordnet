simpleMeaning: rules or steps given beforehand that tell people what to do, and the act of giving such
  rules from someone with the power to set them
scope: Rules given beforehand, not a doctor's written order for a drug and not the drug itself.
examples:
- I tried to follow her prescription for success.
- 'His prescription for a good life was simple: work hard and rest well.'
