simpleMeaning: In sailing, a short rope with a loop at one end and a knot at the other, used to hold loose
  things fast on a ship
scope: A short rope with a loop at one end and a knot at the other, used to hold loose things fast on
  a ship, not a long mooring rope and not a sail tie.
examples:
- He tied the loose oar down with a becket.
- The sailor fastened the bucket with a becket.
