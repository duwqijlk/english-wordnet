simpleMeaning: A red dye and fine stuff for making cupboards come from the heavy red inner part of a warm-land
  tree whose trunk carries sharp points.
scope: Also called peach-wood, peachwood, and pernambuco wood, this warm-land tree gives a red dye and
  fine stuff for making cupboards from its heavy red inner part.
examples:
- The brazilwood in the yard had sharp points along its trunk.
- They dyed the cloth red with brazilwood.
