simpleMeaning: Any of many water or marsh plants that make spores, with short stems under the ground and
  leaves like writing pens, found nearly everywhere but Polynesia.
scope: Any of many spore-bearing water or marsh plants with leaves like writing pens, found nearly everywhere
  but Polynesia.
examples:
- Quillwort grows in the shallow water at the edge of the lake.
- The quillwort in the marsh has short stems and leaves like pens.
