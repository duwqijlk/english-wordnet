simpleMeaning: A person who plays or takes part in athletic contests.
scope: A person is meant, not the game or activity itself, and not the paid profession that some athletes
  follow; nor is it the 'good sport' who takes teasing or defeat gracefully. In this sense the word is
  dated in modern English, where athlete or sportsman is more usual, but it is common in older writing.
examples:
- In his youth he was a noted sport, playing rugby and rowing for the county.
- The local paper called him a sport who had played cricket for the village all his life.
