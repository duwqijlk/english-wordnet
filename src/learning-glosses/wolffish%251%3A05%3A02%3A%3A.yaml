simpleMeaning: a tall fin like a sail runs along the back of this big long sea fish with no scales and
  sharp teeth
scope: Also called lancet fish and lancetfish, a big long sea fish with a sail-like fin on its back, not
  a flatfish and not a ray.
examples:
- The wolffish showed its sharp teeth as it swam past the rocks.
- A wolffish can grow long, with a fin like a sail along its back.
