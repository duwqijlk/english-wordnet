simpleMeaning: Full of, or given to, self-important talk about right and wrong, put in short sayings.
scope: Of talk or writing that is full of self-important moral sayings, not plain advice.
examples:
- The speech was sententious, full of grand talk about right and wrong.
- The lecturer grew sententious, turning every point into a moral lesson.
