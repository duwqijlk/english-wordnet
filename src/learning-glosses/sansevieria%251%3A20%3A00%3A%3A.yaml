simpleMeaning: A plant kept in the house for its thick leaves, marked with spots and shaped like swords,
  or grown for its fiber.
scope: A house plant with thick spotted leaves, also called bowstring hemp; not a palm kept indoors and
  not aloe, a plant with thick fleshy leaves.
examples:
- A sansevieria stands in the corner of her flat.
- She grows sansevieria for its tall, spotted leaves.
