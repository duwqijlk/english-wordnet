simpleMeaning: the process by which matter from living things, such as waste water, is broken down by
  bacteria (very small living things), by chemicals, or by heat
scope: This sense is matter from living things being broken down, as with waste water, not the body's
  way of turning food into things it can take in.
examples:
- Sewage digestion in the tanks is done by bacteria and heat.
- The plant uses digestion to break down waste water before it is clean.
