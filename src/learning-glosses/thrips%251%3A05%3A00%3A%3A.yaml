simpleMeaning: Too small to see well, this sap-sucking bug, one of many kinds, feeds on plants and does
  them harm, with narrow wings like feathers when it has any.
scope: Also called thrip and thripid, it is one of many kinds of tiny bug that live on plant sap.
examples:
- The thrips on the leaves had sucked the sap from them.
- The thrips did the plant harm by sucking its sap.
