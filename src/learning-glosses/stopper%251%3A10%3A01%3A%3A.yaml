simpleMeaning: A remark that leaves the other person with no kind or fitting thing to say back
scope: A remark that leaves the other person with no kind or fitting thing to say back, not a thing that
  fills a hole and not a show-stopping act.
examples:
- His stopper ended the argument at once.
- She answered with a stopper that left him silent.
