scope: This is a European grass-like plant with rough-edged leaves and reddish flowers; galangal and galingale
  are other names for this sense, and it stands apart from other grass-like plants by its sweet-smelling
  roots.
examples:
- Cyperus longus grows along the banks of European rivers.
- The Cyperus longus in the marsh had reddish flowers.
