simpleMeaning: the main tower inside the walls of a castle or strong fort built long ago
scope: The main tower inside the walls of a castle or strong fort built long ago, also called a keep and
  a dungeon; not a wall round a town and not a prison cell below ground.
examples:
- The donjon stood at the heart of the castle.
- Prisoners were held in the donjon.
