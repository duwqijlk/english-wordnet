simpleMeaning: 'Of a plant in a container: grown too big for it, so that its roots form a tight tangled
  mass'
scope: This word says a plant in a container has grown too big for it; rootbound is another name for it,
  not a plant that is simply old or dry.
examples:
- The potbound plant needs a bigger container.
- This potbound fern has roots that fill the whole pot.
