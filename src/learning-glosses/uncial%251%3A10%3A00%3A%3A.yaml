simpleMeaning: a way of writing with somewhat rounded capital letters, seen above all in Greek and Latin
  hand-written books of the 4th to 8th centuries
scope: Not modern print or joined-up handwriting; a way of writing with large rounded letters in old Greek
  and Latin books.
examples:
- The monk copied the text in uncial.
- Uncial letters look rounded and stately on the old page.
