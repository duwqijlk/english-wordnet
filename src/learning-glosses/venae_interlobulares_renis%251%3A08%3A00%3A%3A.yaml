simpleMeaning: Blood from the curved vein flows through veins of the kidney that run between its small
  parts and into the main kidney veins.
scope: These veins of the kidney run between its small parts and are not the large veins that carry blood
  out of the kidney.
examples:
- The venae interlobulares renis pour blood into the main kidney veins.
- Blood flows from the curved vein into the venae interlobulares renis.
