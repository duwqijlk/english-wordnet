simpleMeaning: a European orchid with sweet-smelling pink, lilac or red flowers packed tight in spikes,
  each flower with a clear spur sticking out at the back
scope: A sweet-smelling European orchid with pink, lilac or red flowers, not the foxtail orchid and not
  a scentless garden orchid.
examples:
- The fragrant orchid filled the meadow with sweet scent from its pink flower spikes.
- We found a fragrant orchid with lilac flowers and clear spurs behind each bloom.
