simpleMeaning: Bunches of white flowers and small bright red berries mark this shrub of the Old World,
  which loses its leaves each year and grows in thick groups.
scope: Also called cranberry tree and guelder rose; it is a shrub of the Old World with white flowers
  and small bright red berries.
examples:
- Crampbark loses its leaves each year.
- The crampbark bears small bright red berries.
