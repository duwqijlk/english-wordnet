simpleMeaning: One person above the log and the other below it in a hole worked this big cutting tool,
  once used to cut logs into flat boards.
scope: Worked by two people, one above the log and one below it in a hole, this big cutting tool cuts
  logs into flat boards, not a tool worked by one person alone.
examples:
- Two men worked the pitsaw, one above the log and one below.
- The pitsaw cut the log into planks.
