simpleMeaning: illness from too little niacin (a B vitamin) or tryptophan, or trouble making niacin; stomach
  upset, red skin, mental or nerve problems; can come from poor diet, alcohol or nutrition problems
scope: This is the old Spanish name for pellagra, the same illness as maidism and mal rosso, not a separate
  disease and not a skin complaint by itself.
examples:
- Spanish doctors once used the name mal de la rosa for pellagra.
- Mal de la rosa was described in Spain long before the vitamin deficiency was understood.
