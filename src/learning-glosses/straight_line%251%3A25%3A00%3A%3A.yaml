simpleMeaning: a mark made by a point moving in one fixed direction, with no bend at all
scope: A mark with no bend at all, made by a point moving in one fixed direction, not a curve and not
  a line made of short parts.
examples:
- The shortest way between two points is a straight line.
- She drew a straight line across the page with her ruler.
