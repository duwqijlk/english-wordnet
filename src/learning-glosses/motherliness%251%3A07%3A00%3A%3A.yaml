simpleMeaning: Warmth, tenderness and love fit for a mother, whether felt inside or shown in how she acts
scope: 'Also called a maternal quality, maternalism or maternity: warmth, tenderness and love fit for
  a mother, not coldness toward a child and not the love of a father.'
examples:
- Her motherliness showed in the way she held the baby.
- The girl's motherliness made her the one the children ran to.
