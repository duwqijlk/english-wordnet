simpleMeaning: A hidden problem or difficulty in something that first appears simple.
scope: This is not an obvious cost or stated rule; it is a problem that only becomes clear when you look
  more closely.
examples:
- The offer sounds great, but the catch is that you have to pay the fees up front.
- There must be a catch; no one gives away a car for free.
