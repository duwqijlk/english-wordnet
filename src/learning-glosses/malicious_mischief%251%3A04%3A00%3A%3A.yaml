senseId: 'malicious_mischief%1:04:00::'
synsetId: 01252403-n
simpleMeaning: The wrecking of what belongs to other people, done on purpose and with no good reason,
  just to do harm
scope: Also called vandalism and hooliganism, this is the wrecking of other people's things on purpose
  and out of spite, not playful trouble and not harm done by chance.
examples:
- He was charged with malicious mischief after smashing the shop windows.
- The malicious mischief left the neighbours' cars scratched and dented.
