simpleMeaning: In law, to hand someone a court order, such as a warrant or summons.
scope: This is the court-service sense, not a course of action, a cognitive operation, a legal writ, an
  unconscious mental operation, a bodily projection, a sustained phenomenon, or the verbs for treating
  a material, shaping it, handling something routinely, computing data, suing or marching in a line.
examples:
- The sheriff processed the tenant with a summons at her flat.
- A deputy processed him with the warrant just after dawn.
