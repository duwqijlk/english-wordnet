simpleMeaning: Where the side bone of the skull joins the bone by the ear, at the tip of its angled part,
  is the point used to measure the skull.
scope: This is a point used to measure the skull, at the tip of one of its side bones, not a bone itself.
examples:
- The entomion marks the tip of the angled part of the side bone.
- The entomion lies where the side bone of the skull joins the bone by the ear.
