simpleMeaning: In music, a direction that a passage should be played rather quietly
scope: A music instruction to play rather quietly, also called piano, not the general adverb for low volume,
  a light touch, or a pleasing manner.
examples:
- The conductor asked the horns to play softly in the opening bars.
- This passage is marked softly, then loud again.
