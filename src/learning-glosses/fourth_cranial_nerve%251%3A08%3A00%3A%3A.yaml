simpleMeaning: One of the two cords on each side of the head that move the upper slanting eye muscles.
scope: A cord on each side of the head moving the upper slanting eye muscles, not a cord moving other
  eye muscles and not a cord carrying feeling from the face.
examples:
- Damage to the fourth cranial nerve can make the eye turn oddly.
- The fourth cranial nerve runs from the brain to the eye muscles.
