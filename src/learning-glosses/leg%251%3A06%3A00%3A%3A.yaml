simpleMeaning: One of the cloth tubes of a pair of trousers, each covering a lower limb.
scope: This is the clothing, not the human limb it covers, and not a stage of a journey or a stretch sailed
  on one tack.
examples:
- He rolled up his trouser legs before wading into the stream.
- There is a rip in the left leg of my jeans.
