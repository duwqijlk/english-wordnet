simpleMeaning: A tree of the genus Tilia that loses its leaves each year, with heart-shaped leaves and
  hanging clusters of yellow, often fragrant flowers; several are valued for their wood.
scope: This is the shade and timber tree also known as linden or basswood, not the citrus tree that bears
  lime fruit or the fruit itself.
examples:
- A row of lime trees lined the road along the river.
- The lime trees were in flower, filling the air with scent.
