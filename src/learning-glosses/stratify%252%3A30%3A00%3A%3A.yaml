senseId: 'stratify%2:30:00::'
synsetId: 00508033-v
simpleMeaning: To form layers of its own, one above the next.
scope: A thing forming layers of its own, not setting things out in layers, and not keeping seeds fresh
  by packing them between layers of earth or sand.
examples:
- The rock stratifies as it cools, forming thin sheets.
- Over time the mud stratifies into clear bands.
