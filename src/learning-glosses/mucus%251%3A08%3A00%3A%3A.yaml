simpleMeaning: A protective fluid released by moist body linings; in the gut it eases food along and shields
  surface cells, and in the nose, throat and lungs it helps block germs.
scope: The everyday name for the protective fluid from moist body linings, the same substance called mucous
  secretion, not saliva or tears.
examples:
- Mucus ran from his nose, so he reached for a tissue.
- The nose makes mucus to trap dust and germs.
