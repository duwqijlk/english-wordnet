simpleMeaning: to form words with the lips without making any sound.
scope: This is not speaking the words aloud, and not touching something with the lips; it is only shaping
  words silently with the lips.
examples:
- She mouthed 'I'm sorry' across the room.
- The singer mouthed the lyrics when the microphone failed.
