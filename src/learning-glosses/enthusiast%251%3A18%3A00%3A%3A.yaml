simpleMeaning: a person who strongly supports a person or an activity and shows great love for it
scope: 'Also called partisan: a person who strongly supports a person or activity, not a person who just
  takes part in it once or watches with no strong feeling.'
examples:
- He is a train enthusiast and collects old tickets.
- As a music enthusiast, she goes to every concert in town.
