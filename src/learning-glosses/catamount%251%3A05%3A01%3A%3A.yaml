simpleMeaning: a large wild animal of the Americas, much like a lion
scope: 'Also called cougar, mountain lion, painter, panther, or puma: a large wild animal of the Americas
  that looks like a lion, not a small pet and not the short-tailed wild animal valued for its fur.'
examples:
- A catamount crossed the trail at dusk, moving like a lion through the trees.
- The farmer said a catamount had taken one of his sheep during the night.
