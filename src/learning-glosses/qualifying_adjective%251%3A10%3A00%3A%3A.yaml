simpleMeaning: A word that says what sort of thing its noun is, as in nervous for a nervous person and
  musical for a musical speaking voice.
scope: Also called a descriptive adjective; it says what sort of thing a noun is.
examples:
- In 'a nervous person', nervous is a qualifying adjective.
- The phrase 'a musical speaking voice' has a qualifying adjective in musical.
