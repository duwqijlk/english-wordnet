senseId: shaky%5:00:00:unsteady:00
synsetId: 02312246-s
simpleMeaning: moving a little and not in a steady way, as with fear or cold, or like the leaves of an
  aspen (a kind of tree) in a light wind
scope: 'Also called trembling and shivering: moving a little in an unsteady way, as with fear or cold;
  not weak and likely to fall, and not unsafe or full of problems.'
examples:
- His hands were shaky with cold.
- She spoke in a shaky voice because she was afraid.
