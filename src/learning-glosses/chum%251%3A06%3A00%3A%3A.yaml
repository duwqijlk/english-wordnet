simpleMeaning: Bait made of pieces of cut-up fish and fish oil, thrown from a boat into the sea so fish
  come near
scope: Fish pieces used as bait, not a close friend and not the large Pacific salmon that shares this
  name.
examples:
- The fishermen threw chum over the side of the boat to draw sharks near.
- He spread chum on the water before casting his net.
