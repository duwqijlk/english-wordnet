simpleMeaning: A plant from Europe and Asia, grown on the great plains of the United States to feed farm
  animals and to hold the soil in place
scope: A plant from Europe and Asia grown on the great plains to feed animals and hold soil, also called
  crested wheat grass and fairway crested wheat grass; not a grain crop and not a garden lawn plant.
examples:
- The crested wheatgrass held the soil on the dry plains.
- Crested wheatgrass was sown for the cattle.
