simpleMeaning: a substance in the blood that helps the blood clot, sold as Hemofil, and people who lack
  it have the blood illness called haemophilia A
scope: 'Also called antihaemophilic globulin, antihemophilic factor and antihemophilic globulin: a blood
  substance that helps blood clot, not a drug that thins the blood and not a drug that breaks up clots.'
examples:
- The lab found no antihaemophilic factor in his blood, so it would not clot as it should.
- Doctors gave him antihaemophilic factor to help his blood clot after the cut.
