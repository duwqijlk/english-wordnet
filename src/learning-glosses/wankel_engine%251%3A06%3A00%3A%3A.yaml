simpleMeaning: A motor with a part that turns round inside it and burns fuel in four steps, with no parts
  that move back and forth
scope: 'Also called an epitrochoidal engine and a Wankel rotary engine: a motor whose inner part turns
  round as it burns fuel in four steps, not a motor with pistons that move up and down.'
examples:
- The Wankel engine in his old sports car still runs smoothly.
- A Wankel engine has no pistons moving back and forth inside it.
