simpleMeaning: the way a thing looks when it shines by giving back light that falls on it
scope: 'Also called sheen, shininess and lustre: the shine a thing gives back, not a thin covering put
  on things made from baked clay.'
examples:
- The luster of the polished wood caught the light.
- Silk has a soft luster that cotton does not have.
