simpleMeaning: To correct something wrong or put it back into proper order.
scope: This is not the adjective meaning correct or suitable, and not a direction; it is the action of
  correcting something.
examples:
- The new leader promised to right the wrongs of the old system.
- He tried to right the mistake before the report was sent.
