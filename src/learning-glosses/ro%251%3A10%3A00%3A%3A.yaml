simpleMeaning: A made-up tongue meant to be used by all lands, one that takes none of the words now in
  use and builds its words on a bare study of thoughts.
scope: Not a tongue of one land, and not one built from words already in use.
examples:
- Ro was made to be used by all lands.
- In Ro, each word comes from a study of thoughts.
