simpleMeaning: A leftover from washing the starch out of the mash, often used to feed animals.
scope: What is left after the starch is washed out of the crushed root, often fed to animals; not the
  starch itself and not food made for people.
examples:
- The farmer dried the potato pulp for winter feed.
- Potato pulp is often mixed into animal feed.
