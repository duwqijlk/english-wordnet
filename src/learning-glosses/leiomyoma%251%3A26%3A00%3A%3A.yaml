simpleMeaning: A harmless lump of smooth muscle that grows most often in the womb or the gut.
scope: This harmless lump of smooth muscle, growing most often in the womb or the gut, is unlike a lump
  that spreads and harms the body.
examples:
- A leiomyoma was found in the womb.
- Leiomyomas can grow in the gut as well as in the womb.
