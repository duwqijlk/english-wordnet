senseId: 'foreordination%1:09:00::'
synsetId: 05974996-n
simpleMeaning: 'God fixed every event for all time, even who is saved at last: in theology, that teaching,
  often tied to Calvin, means what happens was fixed long before'
scope: Also called predestination, predetermination and preordination, this is the idea that all is fixed
  in advance, not the idea that people choose freely.
examples:
- He believed in foreordination and said nothing could change what was to come.
- Her foreordination shaped how she saw every loss and gain.
