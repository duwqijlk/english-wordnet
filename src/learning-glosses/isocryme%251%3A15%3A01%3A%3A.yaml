senseId: 'isocryme%1:15:01::'
synsetId: 92420569-n
simpleMeaning: Places on the earth where the coldest month of the year is just as cold, on average, are
  joined by this line
scope: A line joining places where the coldest month of the year is just as cold, on average; not a line
  for the hottest month and not a line joining places of the same height.
examples:
- The isocryme through the region marks where January is equally cold.
- Farmers use the isocryme to see how cold the coldest month gets.
