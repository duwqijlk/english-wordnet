senseId: 'parasympathetic%1:08:00::'
synsetId: 05513330-n
simpleMeaning: 'Nerve network starting in the brain stem and lower spinal cord that opposes sympathetic
  signals: it increases digestive flow, slows the heart, narrows the pupils and widens blood vessels.'
scope: The rest-and-digest nerve network itself, not the opposing fight-or-flight sympathetic system and
  not the adjective that merely means 'relating to it'.
examples:
- Slow breathing shifts the balance toward the parasympathetic side.
- At rest, parasympathetic signals slow the heart and help digestion.
