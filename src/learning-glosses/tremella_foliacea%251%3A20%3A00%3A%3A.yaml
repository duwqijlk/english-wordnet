simpleMeaning: A jelly fungus with a fruiting body 5-15 cm broad and jelly-like in feel, looking like
  a bunch of leaf lettuce, mostly water and brownish in colour.
scope: A jelly fungus with a broad fruiting body like a bunch of leaf lettuce, mostly water and brownish;
  the wood ear is a different jelly fungus, and so is the snow fungus.
examples:
- Tremella foliacea grew on the damp log like a bunch of lettuce.
- The brownish Tremella foliacea felt like jelly in my hand.
