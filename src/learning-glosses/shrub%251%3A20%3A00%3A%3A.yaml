simpleMeaning: A plant that stays low, with wood in its stems, living for years and usually growing from
  several main stems.
scope: 'Also called bush: a low woody plant that lives for years with several main stems, not a tall tree
  and not a small soft plant.'
examples:
- A shrub grew beside the garden wall.
- She planted shrubs along the fence.
