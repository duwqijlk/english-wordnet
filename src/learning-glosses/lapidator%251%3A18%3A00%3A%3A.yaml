simpleMeaning: A person who attacks someone by throwing stones at them, above all to kill them.
scope: A person who attacks someone by throwing stones at them, above all to kill them; stoner is another
  name for this sense, not a person who throws stones in play, and not a person who beats someone with
  fists.
examples:
- The lapidator threw stones at the prisoner until the guards stopped him.
- In the old story, the lapidator aimed his stones at the prisoner.
