simpleMeaning: a tall New Zealand grass grown for the plume-like heads of its flowers
scope: A tall New Zealand grass grown for its plume-like flower heads; also called toe toe and plumed
  tussock. Not a garden lawn grass and not a part of the foot.
examples:
- Toetoe grew tall along the river bank.
- The farmer cut toetoe for its feathery flower heads.
