simpleMeaning: anything that blocks the way or slows things down and is hard to deal with
scope: Anything that blocks or slows things and is hard to deal with, not a way of walking with a hurt
  leg, not a knot, and not a jump straight up.
examples:
- There was a hitch in the plan, and work had to stop for a day.
- The only hitch was that there were not enough seats for everyone.
