simpleMeaning: Breathing out flames, with a body like a great lizard and sometimes wings, this beast comes
  from the old tales of the Germanic peoples.
scope: Also called a dragon, this is the beast from old Germanic tales that is most often shown breathing
  out flames.
examples:
- The firedrake breathed out flames in the old Germanic tale.
- In the story, the firedrake spread its wings and showed its lizard-like body.
