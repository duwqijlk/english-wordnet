simpleMeaning: The part of vinegar acid with the make-up CH3CO-
scope: The part of vinegar acid with the make-up CH3CO-; acetyl, acetyl group, acetyl radical and ethanoyl
  group are other names for this sense, not the whole vinegar acid and not a part of a different acid.
examples:
- The ethanoyl radical gives vinegar acid its make-up.
- Chemists mark the ethanoyl radical as CH3CO-.
