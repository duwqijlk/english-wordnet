simpleMeaning: showing bright colors that change and shine like the colors of a rainbow
scope: 'Also called iridescent, opalescent, nacreous and opaline: showing bright colors that change, not
  plain white and not one still color.'
examples:
- The pearlescent paint on the car changed color in the sun.
- She wore pearlescent nail polish that shone pink and green.
