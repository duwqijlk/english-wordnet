simpleMeaning: to pour a liquid out slowly, so the solid bits at the bottom stay behind
scope: 'Also called pour: this is pouring a liquid slowly to leave the solid bits behind, not just pouring
  a liquid in any quick way.'
examples:
- He decanted the wine slowly into a clean bottle.
- The waiter decanted the old wine so the bits stayed in the first bottle.
