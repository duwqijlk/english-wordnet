simpleMeaning: A Loloish tongue spoken in south Yunnan Province, in Jingdong and Jinggu counties, in the
  Yuanjiang and Lancang (Mekong) river basins, and in the Ailao mountains.
scope: Not Lahu or Lisu, other Loloish tongues; also called Akha, Hani, and the Hani language.
examples:
- Akha language is spoken in the hills of south Yunnan.
- She learned the Akha language from her grandmother.
