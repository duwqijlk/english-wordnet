simpleMeaning: A speech sound made by raising the back of the tongue toward or against the soft part at
  the back of the roof of the mouth.
scope: This describes where the tongue is placed, not whether the vocal cords vibrate.
examples:
- The hard g in 'go' is made with the back of the tongue.
- The first sound in 'give' uses the back of the tongue while the vocal cords vibrate.
