simpleMeaning: Sugared fruit sits on top of this sweet bake, made by cooking a soft mix on top of the
  fruit and then turning it over.
scope: This sweet bake is also called skillet cake, and it is cooked on top of sugared fruit and turned
  over so the fruit sits on top.
examples:
- She made an upside-down cake and turned it over so the fruit sat on top.
- They cut the upside-down cake so the fruit showed on top.
