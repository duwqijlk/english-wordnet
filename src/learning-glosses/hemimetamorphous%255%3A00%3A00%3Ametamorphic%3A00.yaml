simpleMeaning: Of an insect whose young live in water and grow by a change that is not full, so the young
  does not look like the grown insect
scope: Of an insect whose young live in water and grow by a change that is not full, also called hemimetabolic,
  hemimetabolous, and hemimetamorphic, and not an insect that grows by a full change with a resting stage.
examples:
- The hemimetamorphous insect grows without a resting stage.
- Hemimetamorphous young live in water.
