simpleMeaning: a tiny part in a sea sponge, with a ring of soft living stuff round its whip-like tail,
  that keeps water moving through the sponge
scope: A tiny part in a sea sponge with a ring of soft stuff round its tail; choanocyte is another name
  for this sense; not a part of a land animal, and not a whole sponge.
examples:
- The collar cell beat its tail to draw water in.
- Collar cells keep water moving through the sponge.
