simpleMeaning: Climbing up trunks, propped on stiff tail feathers and its feet, this small bug-eating
  bird of the north half of the world is one of many kinds.
scope: Creeper is another name for this bird, one of many kinds that climb trunks in the north half of
  the world, not the South American bird with a curved bill that feeds like a woodpecker.
examples:
- A tree creeper climbed the trunk, propped on its stiff tail feathers.
- The tree creeper ate bugs as it climbed up the trunk.
