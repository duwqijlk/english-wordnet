simpleMeaning: to cause harm to something by very cold weather and ice
scope: This is harm done by cold and ice, not the white ice itself and not the act of covering something
  with that ice.
examples:
- Cold air frosted the flowers, and by morning they were dead.
- A late cold night frosted the young plants and they turned brown.
