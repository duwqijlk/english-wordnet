simpleMeaning: a rush of air out of the nose that you cannot stop, and that shows something is wrong in
  the body
scope: 'Also called sneeze or sneezing: a rush of air out of the nose that cannot be stopped, not a cough
  and not a sniff.'
examples:
- A loud sternutation made the whole class turn and look.
