simpleMeaning: from or typical of the states in the west of the US, beyond the Mississippi River
scope: This is not about Europe and North America as a whole; it is only about the western states of the
  US.
examples:
- Many western towns grew quickly during the gold rush.
- Cattle ranching spread across the western regions in the 1800s.
