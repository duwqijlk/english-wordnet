simpleMeaning: An infectious disease that lasts a long time, found in tropical and subtropical regions,
  caused by a bacterium; lumps form beneath the skin and body parts waste away.
scope: A long-term bacterial disease of the skin and body tissue; it is not a temporary rash or a common
  skin infection.
examples:
- Leprosy can be cured with a course of antibiotics.
- Health workers screen for leprosy in remote villages.
