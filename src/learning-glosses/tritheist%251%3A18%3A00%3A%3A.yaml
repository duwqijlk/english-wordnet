senseId: 'tritheist%1:18:00::'
synsetId: 10749729-n
simpleMeaning: a person, not an orthodox Christian, who believes the Father, the Son and the Holy Ghost
  are three separate gods
scope: This is a person who holds that the three persons are three gods; not a Christian who holds they
  are one God and not a believer in many gods.
examples:
- The tritheist argued that the Father, Son and Holy Ghost are three separate gods.
- He was called a tritheist because he did not accept the usual Christian view of one God.
