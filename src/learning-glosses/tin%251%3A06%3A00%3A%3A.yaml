simpleMeaning: a metal box sealed tight so air cannot get in, for food, drink, or paint
scope: A sealed metal box for food, drink, or paint, also called a can; not a baking pan and not a box
  for dry foods.
examples:
- He opened a tin of beans for supper.
- The tin of paint was sealed tight.
