simpleMeaning: One of a row of rounded lobes, or the gaps between them, where a border ripples — on foliage,
  fabric, shells, and red blood cells shriveled in salty water.
scope: 'Another name for crenation and crenel in this edge sense: one rounded ripple or the gap beside
  it; not crenel, an opening in a battlement.'
examples:
- The leaf margin showed a neat crenature every few centimeters.
- Crenatures along the shell's lip caught the light.
