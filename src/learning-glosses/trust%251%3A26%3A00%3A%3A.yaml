simpleMeaning: A relationship in which people have confidence in each other and feel safe relying on one
  another.
scope: This is a bond of mutual confidence between people, not a group of companies formed to limit competition.
examples:
- Years of shared work built a deep trust between the two doctors.
- 'Their marriage rests on trust: each knows the other will keep a promise.'
