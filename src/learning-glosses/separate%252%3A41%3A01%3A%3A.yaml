simpleMeaning: split a whole into shares or sections, giving each its own part
scope: This is about sharing a whole out into portions, not about drawing out the different ingredients
  of a mixture, not about making a boundary between things, and not about breaking something into pieces.
examples:
- They separated the cake into eight equal slices.
- The land was separated into three equal portions among the heirs.
