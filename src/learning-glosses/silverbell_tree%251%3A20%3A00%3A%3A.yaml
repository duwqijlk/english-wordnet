simpleMeaning: a tall woody plant of middle size that grows from West Virginia to Florida and Texas
scope: A tall woody plant of middle size found from West Virginia to Florida and Texas, also called a
  silver-bell tree, opossum wood and a snowdrop tree; not a small bush and not a plant of the far north.
examples:
- A silverbell tree stood at the edge of the yard.
- We saw a silverbell tree in bloom in Texas.
