simpleMeaning: Above all for steel rails and such things, it gives a number for how hard a thing is, so
  one thing can be set against another
scope: This tool gives a number for how hard a thing is and is used above all for steel rails and such
  things.
examples:
- He pressed the durometer against the rail to read its hardness.
- The durometer gave a high number for the hard steel bar.
