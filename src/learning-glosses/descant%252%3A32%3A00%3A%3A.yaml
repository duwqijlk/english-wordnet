simpleMeaning: To sing by shifting voice, to sing by yodelling.
scope: To sing by shifting voice, to sing by yodelling; also called warble or yodel; not a fancy musical
  part, often made up on the spot, set above a plain tune, nor to sing in descant.
examples:
- Their choir would descant at dawn.
- The singer did descant at noon.
