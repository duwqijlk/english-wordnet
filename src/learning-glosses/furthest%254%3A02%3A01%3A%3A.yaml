senseId: 'furthest%4:02:01::'
synsetId: 00031310-r
simpleMeaning: to the greatest degree or amount, or to the most advanced stage reached by something
scope: Also called farthest, though this word is used more often than that one for ideas and amounts.
  This is not the sense about the greatest distance in space or time.
examples:
- She went the furthest of all the children in her education.
- His thinking is furthest removed from reality.
