simpleMeaning: very serious and important, and needs careful thought
scope: 'Also called heavy, grave, and grievous: this sense is about a matter that is very serious and
  needs careful thought, not about a feeling that causes worry and not about a thing that is heavy to
  lift.'
examples:
- The leaders discussed weighty matters at the peace talks.
- Choosing a new law is a weighty decision for the country.
