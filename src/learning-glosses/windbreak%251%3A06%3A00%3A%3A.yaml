simpleMeaning: A row of trees, or a fence made of trees, put up to make the wind weaker and to cut down
  the loss of soil
scope: A line of trees put up to cut the wind and help keep soil in place; it is not a fence of wood or
  stone with no trees in it.
examples:
- A windbreak of tall trees protects the farm from strong winds.
- They planted a windbreak along the edge of the field.
