simpleMeaning: To look into a thing with care, going deep into every part of it.
scope: To look into a thing with care and in depth, not to set a thing straight with a weighted line,
  not the metal weight itself, and not standing straight up and down.
examples:
- She plumbed the records for clues about the missing money.
- The writer plumbed his own past for the story.
