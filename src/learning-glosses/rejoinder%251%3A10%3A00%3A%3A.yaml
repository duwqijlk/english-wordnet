simpleMeaning: A fast reply, especially a witty or cutting one.
scope: A fast reply, especially a witty or cutting one; also called return, counter, retort, comeback,
  replication, or riposte; not in law, a plea made by one sued, in answer to the other's claim.
examples:
- Their rejoinder silenced the room.
- The rejoinder came sharp and quick.
