simpleMeaning: The tissue of the glands grows larger, or the glands fall sick, most often the glands that
  fight sickness in the body.
scope: Doctors use this word for a sickness of the glands or a swelling of gland tissue, most often of
  the glands that fight sickness in the body.
examples:
- The doctor said the adenopathy would need more tests.
- Her adenopathy showed up as swollen glands that fight sickness in the body.
