simpleMeaning: plays that stress the senseless or illogical sides of life, usually to show that modern
  life has no point
scope: Plays that stress the senseless sides of life, not plays that tell a clear story with a point and
  not plays meant only to make people laugh.
examples:
- Beckett's plays are classics of the theater of the absurd.
- The theater of the absurd shows life as having no point.
