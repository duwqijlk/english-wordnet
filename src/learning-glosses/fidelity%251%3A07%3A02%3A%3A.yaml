senseId: 'fidelity%1:07:02::'
synsetId: 04811555-n
simpleMeaning: how true the sound or picture made by an electronic system is to the sound or picture put
  into it
scope: This is how true a machine's sound or picture is to what went into it, not loyalty to a person
  or a promise.
examples:
- The new player gives high fidelity, so the music sounds just like the live show.
- Good fidelity means the picture on screen looks like what the camera took.
