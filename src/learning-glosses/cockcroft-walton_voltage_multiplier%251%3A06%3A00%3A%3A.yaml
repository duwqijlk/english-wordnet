simpleMeaning: A high-voltage machine where parts that turn current one way fill store-houses of charge;
  these let go, pushing charged bits through a tube that speeds them up.
scope: Also called Cockcroft-Walton accelerator, Cockcroft and Walton accelerator and Cockcroft and Walton
  voltage multiplier, this is a high-voltage machine that builds up charge and lets it go to push charged
  bits through a tube that speeds them up.
examples:
- The Cockcroft-Walton voltage multiplier builds up high voltage.
- A Cockcroft-Walton voltage multiplier drives particles through a tube.
