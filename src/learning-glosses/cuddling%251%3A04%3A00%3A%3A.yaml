simpleMeaning: loving play, or play before sex, with no touch of the sex parts of the body
scope: 'Another name for kissing, hugging and petting, and also called caressing, fondling, snuggling,
  smooching and necking: loving play between two people. It is not sex itself.'
examples:
- They lay on the sofa cuddling, holding each other close in a loving way.
- The young couple spent the evening cuddling and touching softly, without going any further.
