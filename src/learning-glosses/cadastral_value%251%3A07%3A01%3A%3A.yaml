simpleMeaning: The worth of a plot of land with its buildings on it, used to work out the tax owed on
  it.
scope: The worth of land and buildings used to work out tax, not the price a buyer would pay and not the
  rent charged for it.
examples:
- The cadastral value of the house sets its tax.
- Officials fixed the cadastral value of the land.
