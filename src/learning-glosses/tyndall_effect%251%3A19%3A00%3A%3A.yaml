senseId: 'tyndall_effect%1:19:00::'
synsetId: 11548878-n
simpleMeaning: The way light is thrown about by very small bits in its path, so that a beam of light can
  be seen; the light thrown about is mostly blue.
scope: A beam of light shows because very small bits in its path throw the light about, and the thrown-about
  light is mostly blue, which sets it apart from light that goes straight on with no bits in its way.
examples:
- The Tyndall effect makes a beam of light show in dusty air.
- You can see the Tyndall effect when light passes through smoke.
