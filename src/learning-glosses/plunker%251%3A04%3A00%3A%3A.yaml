simpleMeaning: In baseball, hitting the ball so that it falls fast
scope: 'Also called plunk: in baseball, a hit that makes the ball fall fast, not a long high hit and not
  a hit that rolls along the ground.'
examples:
- His plunker dropped just past the infield.
- The plunker fell fast and the shortstop could not reach it.
