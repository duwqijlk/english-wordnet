simpleMeaning: a group in the army made up of a top leader and the people who work for that leader, used
  in the plural
scope: Used in the plural, this is the group made up of an army leader and the people who work for them,
  not the place where that group works and not a company's main office.
examples:
- The new headquarters consisted of the commander and a small team of officers.
- Headquarters, made up of the commander and his officers, planned the attack.
