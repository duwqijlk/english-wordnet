senseId: 'interposition%1:04:00::'
synsetId: 01070108-n
simpleMeaning: To break in on what is going on, by putting in a word or an act
scope: The act of putting in a word or an act that breaks in on something, also called interjection, interpolation
  or interpellation; not a thing put in place and not a remark made in turn.
examples:
- His interposition stopped the speech for a moment.
- Her interposition during the debate made everyone pause.
