simpleMeaning: A body can only do work while touching a colder body, and on its own, any change makes
  things more jumbled up.
scope: In physics, this rule tells when heat can be turned into work, and it also says things grow more
  jumbled up when left alone.
examples:
- The second law of thermodynamics says a steam engine needs a cold part as well as a hot one.
- Because of the second law of thermodynamics, heat left alone spreads out and never gathers itself back.
