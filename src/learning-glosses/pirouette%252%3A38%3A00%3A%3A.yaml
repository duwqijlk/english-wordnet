simpleMeaning: to turn round fast on one foot, usually as part of a dance
scope: This is the verb for turning round fast on one foot in a dance, not the noun that names that turn
  in ballet.
examples:
- The dancer pirouetted across the stage in the final scene.
- He pirouettes easily, usually as part of a dance with his partner.
