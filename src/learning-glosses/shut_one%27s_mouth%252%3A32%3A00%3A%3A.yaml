simpleMeaning: to say nothing about private things that must stay secret
scope: Another name for this is keep one's mouth shut or keep quiet; it means saying nothing about secret
  facts, not telling someone to stop talking and not just staying silent with nothing to hide.
examples:
- He shut his mouth and said nothing about the deal.
- She knew she had to shut her mouth about the new plan.
