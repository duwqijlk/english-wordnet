simpleMeaning: a horse taught to lift its feet high off the ground when it walks or moves at a speed between
  walking and running
scope: A horse taught to lift its feet high as it moves, not an electric motor that turns in small steps.
examples:
- The white stepper lifted its feet high as it crossed the ring.
- They trained the stepper for the horse show.
