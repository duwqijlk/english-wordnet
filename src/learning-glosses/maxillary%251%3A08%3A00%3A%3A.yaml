simpleMeaning: Joined to the skull, this jaw bone is found in animals with backbones
scope: Also called maxilla, this is the jaw bone in animals with backbones that is joined to the skull,
  not the lower jaw that moves and not a tooth.
examples:
- The maxillary bone forms part of the face.
- Damage to the maxillary can change how a person bites.
