simpleMeaning: the quality of being strange because a thing is very special or not like other things
scope: The strange quality of something that stands out as unusual, not the quality of being single and
  not a tiny point in space in science.
examples:
- The singularity of his voice made everyone turn and listen.
- What struck us was the singularity of the house, unlike any other on the street.
