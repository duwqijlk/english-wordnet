simpleMeaning: In physics, a value that keeps going up and down in a set pattern, moving above and below
  a middle value
scope: 'Also called vibration: a value that goes up and down in a set pattern around a middle value. It
  is not one single full go of that pattern, and not the act of moving between states.'
examples:
- The oscillation of the electric signal followed a steady pattern above and below its middle value.
- The chart shows a clear oscillation in the temperature readings.
