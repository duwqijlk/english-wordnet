simpleMeaning: With no coat of protein round it, this plant virus holds its RNA in a ring; it is the smallest
  of all viruses.
scope: Also called virusoid, this is the smallest kind of virus, a plant virus with no protein coat; not
  a full virus with a coat.
examples:
- The viroid spread through the tomato plants without any coat of protein.
- Scientists found the viroid in the sap of a sick plant.
