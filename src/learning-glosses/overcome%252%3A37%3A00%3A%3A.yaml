simpleMeaning: to take over a person, as strong feelings or things taken in through the senses can do
scope: 'Also called overwhelm, overpower and overtake: to be taken over by strong feelings or by things
  taken in through the senses, not to beat a person.'
examples:
- She was overcome by grief when she heard the news.
- Overcome by the heat and the noise, he had to sit down.
