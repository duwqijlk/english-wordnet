simpleMeaning: a cord or band of tissue that does not stretch, joining a muscle to a bone
scope: A cord joining a muscle to a bone, not the muscle itself and not a band joining two bones together.
examples:
- He tore a tendon in his ankle.
- The tendon joins the calf muscle to the heel bone.
