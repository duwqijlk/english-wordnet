simpleMeaning: to set something aside, such as money, because a duty has to be met
scope: Setting something aside to meet a duty, not making a person feel bound by a promise and not merely
  saving money for later.
examples:
- The council obligated funds to pay for the repairs.
- They obligated a sum each year to meet the debt.
