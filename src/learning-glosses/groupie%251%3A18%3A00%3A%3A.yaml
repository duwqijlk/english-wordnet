simpleMeaning: a young fan who is very keen, especially a young woman who follows rock bands from place
  to place
scope: A young fan who follows rock bands from place to place, not a member of a band and not a fan who
  only listens at home.
examples:
- A groupie followed the band to every town on the tour.
- She was a groupie who waited outside after each rock show to meet the singers.
