simpleMeaning: The tongue of the people of Frisia, used until the 1500s, a Germanic tongue of that land
  in early times.
scope: Also called Old Frisian; the Frisian tongue until the 16th century, the Germanic tongue of ancient
  Frisia, while modern Frisian came after it.
examples:
- Old Frisian language was the Germanic tongue of ancient Frisia.
- Old Frisian language was used until the 16th century.
