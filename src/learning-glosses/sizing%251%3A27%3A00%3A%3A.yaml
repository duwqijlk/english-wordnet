simpleMeaning: any sticky stuff used to fill tiny holes in a surface or to make cloth stiff
scope: Also called size; this is the sticky stuff put on a surface or on cloth, not how big a thing is.
examples:
- Sizing was brushed on the cloth to make it stiff.
- The worker used sizing to fill the tiny holes in the surface.
