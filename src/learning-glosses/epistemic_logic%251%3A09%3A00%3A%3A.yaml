simpleMeaning: a way of working out what can be known, what is not sure, and what is not known at all
scope: A way of working out what can be known and what is not sure or not known, not a list of facts and
  not a way of proving things in maths.
examples:
- Epistemic logic asks what a person can know from the signs before them.
- In epistemic logic, not knowing a thing is treated as a state of its own.
