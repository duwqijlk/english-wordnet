simpleMeaning: In neuroscience, about or to do with synapses, the small joins where one nerve cell passes
  a signal to another cell
scope: About the small joins between nerve cells, where a signal passes from one cell to another; not
  about the nerve cells on their own.
examples:
- The doctor studied synaptic activity in the brain.
- A synaptic link lets one nerve cell pass a signal to the next cell.
