simpleMeaning: doing a test again to check if the claim made from it is true
scope: Doing a test again to check its result; not a sound heard again, not DNA making a copy of itself,
  and not a reply in law or in talk.
examples:
- The replication of the famous experiment gave the same result.
- Scientists trusted the finding more after its replication by another team.
