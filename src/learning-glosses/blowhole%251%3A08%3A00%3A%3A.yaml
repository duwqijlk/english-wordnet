simpleMeaning: the breathing opening far back on the head of a whale or dolphin
scope: The breathing opening on a whale or dolphin, not a hole in the ground and not a hole in ice.
examples:
- The whale came up to the surface and breathed through its blowhole.
- Water sprayed out of the dolphin's blowhole as it came up for air.
