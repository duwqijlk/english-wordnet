simpleMeaning: a steel tool whose point spreads into sharp rays, for making holes in stone or brickwork,
  worked by hitting its end with a hammer and turning it between blows
scope: A steel hand tool for holes in stone, not an electric drill and not a chisel struck without turning.
examples:
- He used a star drill to make a hole in the stone wall.
- The star drill cut slowly as he hit it and turned it between blows.
