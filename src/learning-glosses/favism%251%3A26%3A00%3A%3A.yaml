simpleMeaning: a lack of healthy red blood in people who eat broad beans, because they were born with
  a blood fault and a missing enzyme
scope: A blood condition brought on by eating broad beans, not a food allergy and not a lack of iron.
examples:
- Favism runs in his family, so he avoids broad beans.
- After eating broad beans, the boy's favism left him weak and pale.
