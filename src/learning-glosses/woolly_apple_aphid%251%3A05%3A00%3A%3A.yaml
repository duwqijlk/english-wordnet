simpleMeaning: A small bug that feeds mostly on the bark of the parts above ground and the roots of fruit
  trees and other trees
scope: A small bug that feeds on bark, not a bug that sucks the sap of leaves and not a beetle that bores
  into trunks.
examples:
- Woolly apple aphids covered the bark of the old tree.
- The woolly apple aphid feeds on the roots as well as the bark.
