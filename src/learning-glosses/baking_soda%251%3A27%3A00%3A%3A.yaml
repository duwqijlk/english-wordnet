simpleMeaning: A white substance that melts in water, made of sodium, hydrogen, carbon and oxygen, used
  to make drinks fizz, to raise dough, and to calm a sour stomach.
scope: 'Also called saleratus, bicarbonate of soda, sodium bicarbonate and sodium hydrogen carbonate:
  a white substance that melts in water and is used in drinks and baking.'
examples:
- She put a spoon of baking soda in the cake mix.
- A little baking soda in water calms a sour stomach.
