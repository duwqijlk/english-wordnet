simpleMeaning: an electron, a tiny bit of matter with an electric charge, knocked out of stuff by a kind
  of power that can change atoms
scope: This is an electron knocked out of matter by a kind of power that can change atoms; not a beam
  of light and not an electron still inside an atom.
examples:
- The delta ray was thrown out of the metal by the radiation.
- Delta rays form when strong radiation strikes matter.
