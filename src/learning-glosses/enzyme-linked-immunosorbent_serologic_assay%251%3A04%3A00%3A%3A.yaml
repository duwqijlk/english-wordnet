simpleMeaning: A test that leans on a change wrought by an enzyme, used to spot set stuff, such as enzymes
  or bugs or anti-bodies or germs.
scope: An assay leaning on an enzyme-driven change, used to spot set substances such as enzymes, viruses,
  antibodies, or bacteria.
examples:
- Enzyme-linked-immunosorbent serologic assays spot enzymes.
- The enzyme-linked-immunosorbent serologic assay leans on enzymes.
