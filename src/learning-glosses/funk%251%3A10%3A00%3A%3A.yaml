simpleMeaning: Music made by mixing jazz, blues and soul, with an earthy feel, a heavy low part, and a
  strong first beat in each group of beats
scope: This is a kind of music with a heavy low part, not a bad smell and not a sad or afraid feeling.
examples:
- The band played funk all night, with a heavy bass line on every song.
- He loves funk because the low part makes him want to dance.
