simpleMeaning: A branch of a language family, spoken in Kachin State, from Myitkyina to Bamaw township,
  and in Sagaing Region, Homalin township, along the Irrawaddy, Chindwin and Uru rivers.
scope: A language of the Irrawaddy valley, not Mandarin and not a dialect of Thai.
examples:
- Red Tai is spoken along the Irrawaddy river.
- She greeted us in Red Tai.
