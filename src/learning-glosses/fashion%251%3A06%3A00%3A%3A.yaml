simpleMeaning: Goods for sale, mainly clothes, that are in the current style.
scope: This means the goods themselves, chiefly clothes made in the current style, not the style or trend
  they follow and not a person's usual way of doing things.
examples:
- The shop's windows displayed the new season's fashion.
- She spends far too much of her salary on fashion.
