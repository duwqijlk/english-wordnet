simpleMeaning: A piano whose strings sit flat on a frame shaped like a harp, usually held up by three
  legs.
scope: This is not the adjective meaning impressive or ambitious; it names one kind of piano.
examples:
- She sat down at the grand piano and began to play.
- The hotel lobby has a grand piano near the window.
