simpleMeaning: A mark in a colour that stands out against what is around it, in one line or more.
scope: A mark in a colour that stands out against what is around it, in one line or more, also called
  band or striation; not a strip put on a thing to make it look fine, in a different colour or stuff.
examples:
- The banding on the wasp warned other animals to stay away.
- They admired the banding of black and yellow on the snake.
