senseId: 'assumption%1:10:00::'
synsetId: 06766514-n
simpleMeaning: a statement that is taken to be true and is used as the starting point to reach a conclusion
scope: 'This sense is also called premise: a statement taken as true so you can reach an answer; it is
  not the act of treating something as true without checking.'
examples:
- The assumption that prices will fall is the starting point for his argument.
- Write down each assumption you use before you try to prove the result.
