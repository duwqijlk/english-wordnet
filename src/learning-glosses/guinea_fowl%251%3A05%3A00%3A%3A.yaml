simpleMeaning: A West African bird with dark feathers speckled with white, from Africa but kept for food
  in many parts of the world.
scope: 'Also called a guinea: a West African bird with dark feathers speckled with white, kept for food
  in many parts of the world, not a chicken and not a wild bird never kept for food.'
examples:
- Guinea fowl wandered about the farmyard.
- Farmers raise guinea fowl for their meat and eggs.
