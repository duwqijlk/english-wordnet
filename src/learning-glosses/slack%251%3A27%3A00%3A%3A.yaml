simpleMeaning: dust made of small bits of coal mixed with coal dust and dirt, that falls through holes
  when coal is sorted
scope: Coal dust left from sorting coal, not a loose hanging rope and not soft wet low land.
examples:
- The yard was covered with slack from the coal carts.
- He shoveled the slack into a pile behind the shed.
