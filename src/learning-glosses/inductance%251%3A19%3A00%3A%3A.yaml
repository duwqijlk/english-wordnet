senseId: 'inductance%1:19:00::'
synsetId: 11488572-n
simpleMeaning: An electrical effect in which an electromotive force is made in a closed circuit by a change
  in current flow
scope: Also called induction, this push is made in a closed wire loop when the flow of current changes,
  and it is not the small electric part that brings the push about.
examples:
- The teacher showed how inductance works in a closed wire loop.
- We measured the inductance in the wire loop after the current changed.
