simpleMeaning: a tooth at the front of the mouth in both jaws, used for cutting and for biting again and
  again
scope: A front tooth for cutting, not a back tooth for making food small and not a pointed tooth beside
  it.
examples:
- He bit into the apple with his incisors.
- Her incisors are the sharp front teeth she uses to cut food.
