simpleMeaning: A kind of alpha-beta brass with tin in it, that stands up to sea water; sold under the
  trade name Admiralty Metal.
scope: This is a brass with tin in it that stands up to sea water, also called naval brass, Admiralty
  brass or Admiralty metal; not other kinds of brass made for other uses.
examples:
- The ship's fittings were made of Tobin bronze, which does not rust in sea water.
- Tobin bronze is used for parts that stay in sea water.
