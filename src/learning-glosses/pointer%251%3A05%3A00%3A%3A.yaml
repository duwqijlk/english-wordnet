simpleMeaning: a hunting dog from Spain, strong and thin with smooth hair; its white coat has brown or
  black patches, and it finds game by smell and points at it
scope: This is about a breed of hunting dog, not about the moving mark on a computer screen or a mark
  that shows a direction.
examples:
- The pointer stood still, its nose pointing toward the bushes where the birds hid.
- Their pointer has a white coat with brown patches.
