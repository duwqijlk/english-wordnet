simpleMeaning: Any of several small or medium-sized jumping animals with pouches, often brightly coloured.
scope: Any of several small or medium-sized jumping animals with pouches, often brightly coloured; wallaby
  is another name for this sense, not a large kangaroo and not a koala.
examples:
- The brush kangaroo bounded through the scrub at dawn.
- Brush kangaroos shelter in thickets during the day.
