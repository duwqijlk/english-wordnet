simpleMeaning: Grown a lot in warm lands, this woody herb bears showy yellow flowers and flat pods.
scope: Also called dhal, cajan pea, catjang pea, pigeon-pea plant, pigeon pea and red gram; this is the
  herb itself, not the small seed called dahl.
examples:
- Dahl grows in warm lands and bears flat pods.
- We planted dahl for its showy yellow flowers.
