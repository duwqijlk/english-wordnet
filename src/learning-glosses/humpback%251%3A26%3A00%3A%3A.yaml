simpleMeaning: a curve in the spine (the line of bones down the back) that bends back in a way that is
  not normal
scope: Also called hunchback and kyphosis. This is the curved shape of the back itself, not the large
  whale with this name and not the person who has this curve.
examples:
- His humpback made it hard for him to stand straight.
- The doctor looked closely at the humpback shown in the picture of her back.
