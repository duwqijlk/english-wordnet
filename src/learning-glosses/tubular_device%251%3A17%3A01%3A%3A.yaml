simpleMeaning: A hollow or rectangular climbing tool that stops a climber from falling and lets a climber
  slide down a rope.
scope: This is a climbing tool that stops a fall and lets a climber slide down a rope, not a rope itself
  and not a harness.
examples:
- The tubular device held her when she slipped.
- He used the tubular device to slide down the rope.
