simpleMeaning: Used after a name to mean 'and other people', in the neuter plural form.
scope: The neuter plural form, used for a number of people; not the masculine 'et alii' or the feminine
  'et aliae'.
examples:
- The report thanks Alvarez, Ruiz, et alia for their help.
- The study by Martin, Rossi, et alia covered three hospitals.
