schema: oewn-learning-gloss-v2
senseId: 'subtlety%1:10:00::'
synsetId: 06618544-n
simpleMeaning: a small difference in meaning, in what a person thinks, or in how a person thinks or feels,
  that is hard to notice
scope: This is one small difference in meaning, in what someone thinks, or in how someone feels; it is
  not a big, clear difference that anyone can see.
examples:
- There is a subtlety in the wording that changes what the rule means.
- She was quick to catch every subtlety in his argument.
