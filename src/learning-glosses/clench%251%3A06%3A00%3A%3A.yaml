simpleMeaning: a small loop of rope that slips and is tied fast by turns of thin rope wound round it
scope: A small rope loop that slips and is tied fast, not the act of holding a thing tight in the hand
  and not a knot that cannot slip.
examples:
- He tied a clench in the rope to hold the sail.
- The clench slipped tight around the post.
