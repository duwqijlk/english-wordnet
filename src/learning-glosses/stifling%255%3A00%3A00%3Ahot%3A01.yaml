simpleMeaning: So hot and damp that the air feels heavy and hard to breathe in.
scope: So hot and damp that the air feels heavy and hard to breathe in, not merely warm, and not air that
  is merely still.
examples:
- The stifling heat of the afternoon made work slow.
- We opened every window against the stifling air.
