simpleMeaning: the place where something first began, and where it was helped to grow in its early time
scope: 'Also called cradle and birthplace: the place where a thing first began and was helped to grow,
  not the place where it is now.'
examples:
- This warm valley is the provenance of the plant, where it first grew long ago.
- The town claims to be the provenance of the game, the place where it first began.
