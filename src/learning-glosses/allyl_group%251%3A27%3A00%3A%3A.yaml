simpleMeaning: A set of carbon and hydrogen atoms, C3H5, that acts as one bit, with one free link and
  one double link, got from propylene.
scope: Also called allyl and allyl radical, this is one loose set of atoms got from propylene.
examples:
- The allyl group comes from propylene.
- The allyl group is written as C3H5.
