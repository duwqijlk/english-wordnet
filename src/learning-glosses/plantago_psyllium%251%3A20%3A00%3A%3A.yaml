simpleMeaning: A plantain of lands round the Mediterranean whose seeds swell and turn jelly-like in water
  and are used as a gentle medicine to loosen the bowels
scope: Also called psyllium, fleawort and Spanish psyllium, this is a Mediterranean plantain whose seeds
  swell in water, not a banana plant and not a strong purgative.
examples:
- The Plantago psyllium grew on the dry hillside.
- She took Plantago psyllium seeds as a mild laxative.
