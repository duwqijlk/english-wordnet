simpleMeaning: a protein with sugar joined to it, found for the most part on the outside of helper T cells,
  white blood cells that help fight germs
scope: A protein with sugar on it on the outside of helper T cells, not a protein found inside cells and
  not a protein on other kinds of cell.
examples:
- Cluster of differentiation 4 is found on the surface of helper T cells.
- Doctors count cells with cluster of differentiation 4 to check the immune system.
