simpleMeaning: Large showy heads of clear blue blooms grow on a plant with underground stems in the central
  and southeastern United States and the West Indies, at times grouped with Eupatorium.
scope: Also called mist-flower and ageratum, this is the plant whose large showy heads of clear blue blooms
  rise on underground stems.
examples:
- The mistflower had opened all its clear blue blooms.
- She pointed out the mistflower by its clear blue blooms.
