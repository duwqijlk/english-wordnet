simpleMeaning: having sex with many people, with no care about who they are or whether the tie lasts
scope: Also called promiscuity and sleeping around, it is sex with many people and no care about who they
  are, not sex in one steady tie and not just meeting new people.
examples:
- His promiscuousness meant he had sex with many people he hardly knew.
- In those years, promiscuousness was common among the young men at the camp.
