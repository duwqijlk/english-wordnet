simpleMeaning: to put a hot-tasting spice on food to give it more taste
scope: To put this hot spice on food, not the spice itself, not the plant it grows on, and not the fruit
  of that plant.
examples:
- Please pepper the soup lightly before you serve it.
- She peppered the potatoes to give them more taste.
