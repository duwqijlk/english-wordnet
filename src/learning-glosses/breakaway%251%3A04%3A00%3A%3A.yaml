simpleMeaning: the act of leaving a group, family or place that you were part of
scope: This is the act of leaving a group, family or place that you were part of; it is not the word for
  a group or person that has left a larger group or wants to leave it.
examples:
- There was a breakaway by the unhappy members, who then formed their own group.
- His breakaway from his family and home area changed his whole life.
