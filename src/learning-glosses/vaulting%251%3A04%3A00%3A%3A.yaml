simpleMeaning: A horse's light jump in which the front legs come down only after both back legs have left
  the ground
scope: A horse's light jump; not reaching too high with too much self-belief, and not a building part
  with a curved roof.
examples:
- The horse's vaulting lifted both its back legs off the ground before its front legs came down.
- At the show, the horse's vaulting was light and neat, with its back legs leaving the ground first.
