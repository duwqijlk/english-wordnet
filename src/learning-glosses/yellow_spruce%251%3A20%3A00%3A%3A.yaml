simpleMeaning: Of middling size, this tree of the east of North America is the main one cut for wood there,
  and gives wood for making paper.
scope: Also called eastern spruce and red spruce, it is the main tree cut for wood in the east of North
  America.
examples:
- Of middling size, yellow spruce stands in the east of North America.
- The main tree cut for wood in the east is yellow spruce.
