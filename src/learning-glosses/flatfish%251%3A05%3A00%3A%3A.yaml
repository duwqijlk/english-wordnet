scope: This sense is any of various flat-bodied fishes that swim on one side along the sea floor, both
  eyes above, unlike the sense for sweet, lean, whitish flesh of any of various thin-bodied fish, usually
  served as thin fillets.
examples:
- The flatfish swam on one side.
- Flatfish swim along the sea floor on one side.
