senseId: 'costal_groove%1:08:00::'
synsetId: 05230541-n
simpleMeaning: a long hollow place between two ribs where the thin cords that carry feeling and the tubes
  that carry blood run
scope: A long hollow place between two ribs where feeling cords and blood tubes run, not a break in a
  rib and not the space inside the chest.
examples:
- The costal groove runs along the lower edge of each rib.
- The surgeon kept clear of the costal groove to avoid the nerves and blood vessels there.
