simpleMeaning: A way of sending digital signals at very high speeds, fit for carrying pictures, voice
  and moving images as well as data
scope: A way of sending digital signals at very high speeds; not a slow phone line and not a way of storing
  data.
examples:
- The network uses asynchronous transfer mode to carry video calls.
- Asynchronous transfer mode lets the hospital send scans and voice calls over one link.
