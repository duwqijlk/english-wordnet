simpleMeaning: A tall tree that keeps its leaves all year, from the Pacific coast of North America, often
  grown for its looks.
scope: This tall tree of the Pacific coast keeps its leaves all year and is often grown for its looks,
  also called yellow cedar, yellow cypress, Alaska cedar or Nootka cypress; it is not a cedar of the east
  coast.
examples:
- A Chamaecyparis nootkatensis grows by the front gate, tall and green all year.
- The gardener planted a Chamaecyparis nootkatensis for its fine shape.
