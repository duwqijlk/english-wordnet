synsetId: 11712577-n
simpleMeaning: A ring of small leaf-like parts that looks like the outer cup of a flower, as in a carnation
  or a hibiscus.
scope: 'Also called calycle, epicalyx and false calyx: a leaf-like ring that looks like a flower cup,
  not the cup itself and not a petal.'
examples:
- The calyculus rings the base of the flower like a small cup.
- A calyculus guards the bud before it opens.
