senseId: 'regional_anesthesia%1:26:00::'
synsetId: 14051156-n
simpleMeaning: One part of the body feels nothing after a drug is put on all the nerves that feed it,
  as when a back shot numbs the hips during birth
scope: This is a loss of feeling in one part of the body, also called regional anaesthesia, not a loss
  of feeling all over the body.
examples:
- Regional anesthesia took away all feeling in her lower body during birth.
- Doctors used regional anesthesia so the patient felt nothing in one leg.
