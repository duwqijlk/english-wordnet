simpleMeaning: Fine threads like the growth on a person's head make up this lichen, one of several kinds
  in the group Alectoria.
scope: Also called a horsetail lichen, this is one of several kinds of lichen in the group Alectoria,
  known by fine threads that look like the growth on a person's head.
examples:
- Horsehair lichen grew in long fine threads.
- The horsehair lichen looked like a tangle of fine hair.
