senseId: 'xerophthalmus%1:26:00::'
synsetId: 14561715-n
simpleMeaning: The thin cover and the clear front of the eyes are unusually dry, and too little vitamin
  A in the whole body may be the cause
scope: Conjunctivitis arida, xeroma and xerophthalmia are other names for this eye trouble, in which the
  thin cover and the clear front of the eyes are unusually dry and too little vitamin A in the whole body
  may be the cause.
examples:
- The eyes stay unusually dry with xerophthalmus.
- The clear front of the eyes feels dry with xerophthalmus.
