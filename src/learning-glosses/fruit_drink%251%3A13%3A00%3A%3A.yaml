simpleMeaning: A sweet liquid made from the juice of sweet plant flesh, mixed with water
scope: A sweet liquid of fruit juice mixed with water; ade is another name for this sense, not pure juice
  and not a fizzy soft drink.
examples:
- She poured a fruit drink for the children.
- A fruit drink is mostly juice mixed with water.
