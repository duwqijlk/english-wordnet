simpleMeaning: The fat in the blood carried in small bits called high-density lipoproteins, known as the
  'good' kind, which in high amounts is thought to lower the chance of heart disease.
scope: The fat in the blood carried in small bits called high-density lipoproteins, known as the 'good'
  kind, which in high amounts is thought to lower the chance of heart disease, close to the 'bad' kind
  of fat in the blood carried in low-density lipoproteins.
examples:
- HDL cholesterol is known as the 'good' cholesterol.
- High HDL cholesterol may lower the risk of heart disease.
