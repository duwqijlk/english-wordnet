senseId: 'scintigram%1:10:01::'
synsetId: 92449968-n
simpleMeaning: A picture of the rays given off by a marker substance inside a living thing or a set of
  its parts that work together.
scope: A picture of the rays given off by a marker substance inside the body; not an X-ray picture and
  not an ultrasound scan.
examples:
- The scintigram showed where the marker had gone.
- The doctor read the scintigram to find the sick part.
