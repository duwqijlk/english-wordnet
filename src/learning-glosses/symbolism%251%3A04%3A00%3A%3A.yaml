senseId: 'symbolism%1:04:00::'
synsetId: 00413284-n
simpleMeaning: the practice of giving a thing a meaning beyond what it is, so it stands for an idea
scope: This is the practice of using a thing to stand for an idea; it is not the art movement of the late
  1800s and not a set of signs and their meanings.
examples:
- The writer uses symbolism in the play, letting a closed door stand for a lost chance.
- Her poems are full of symbolism, with the sea standing for freedom.
