simpleMeaning: In wet places in North America, thin curled bunches of small white flowers grow on a soft-stemmed
  lily that lives for many years.
scope: Also called lizard's-tail and water dragon, this is the soft-stemmed lily of wet places, known
  by its thin curled bunches of small white flowers.
examples:
- A swamp lily grew in a wet place.
- The swamp lily's thin curled bunches held small white flowers.
