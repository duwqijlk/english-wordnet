simpleMeaning: In Greek tales, a she-monster breathing fire, with a lion's head, a goat's body and a snake's
  tail, the child of Typhon
scope: Chimera is another name for this sense; not a dream or fancy and not any fire-breathing beast.
examples:
- The Chimaera breathed fire at the hero.
- Bellerophon fought the Chimaera on his winged horse.
