senseId: 'antihaemophilic_globulin%1:27:00::'
synsetId: 15096251-n
simpleMeaning: a blood protein that helps blood clot and is sold as Hemofil; without it, a person has
  the blood illness called haemophilia A
scope: 'Also called antihaemophilic factor, antihemophilic factor and antihemophilic globulin: a blood
  protein that helps blood clot, not a drug that thins the blood and not a drug that breaks up clots.'
examples:
- A lack of antihaemophilic globulin in the blood can lead to haemophilia A.
- The nurse gave the boy antihaemophilic globulin so that his blood would clot.
