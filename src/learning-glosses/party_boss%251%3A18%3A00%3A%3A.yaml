simpleMeaning: A leader of a group in politics who decides who gets jobs and how the members vote
scope: 'Also called boss and political boss: a leader who runs a political group and decides its jobs
  and votes, not an elected head of the group and not a leader of a business.'
examples:
- The party boss decided who would get the city jobs.
- Party bosses have a reputation for fixing votes.
