simpleMeaning: not making people laugh, especially when it was meant to make them laugh
scope: This is about a joke, story, or show that was meant to make people laugh but does not, not about
  a thing that is sad or serious by aim.
examples:
- He told an unfunny joke and no one laughed.
- The unfunny film tried hard to make us laugh, but we stayed silent.
