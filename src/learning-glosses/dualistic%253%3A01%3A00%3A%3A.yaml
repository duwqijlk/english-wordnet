simpleMeaning: having to do with dualism, the view that the world is made of two sorts of thing
scope: To do with the idea of two kinds of thing, not with one kind only and not with many kinds.
examples:
- His dualistic view split the world into mind and matter.
- The dualistic teaching sees good and evil as two warring powers.
