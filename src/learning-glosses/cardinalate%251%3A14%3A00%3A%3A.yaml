simpleMeaning: In the Roman Catholic Church, the whole group of cardinals, who choose the pope and give
  him advice
scope: The whole group of cardinals, not one cardinal alone and not the pope; it chooses and advises the
  pope.
examples:
- The cardinalate met to elect a new pope.
- The cardinalate advises the pope on church matters.
