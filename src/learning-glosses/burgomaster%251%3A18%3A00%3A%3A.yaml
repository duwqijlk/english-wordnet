simpleMeaning: the person who leads a town or city in Germany, Holland, Flanders or Austria
scope: The person who leads a town or city in Germany, Holland, Flanders or Austria, not a mayor elsewhere
  and not a council member without that leading role.
examples:
- The burgomaster opened the new town hall.
- People in the town went to the burgomaster with their complaints.
