senseId: 'rationalise%2:30:00::'
synsetId: 00474253-v
simpleMeaning: To cut out the unneeded or unwanted.
scope: This sense is also called cut, prune, and rationalize, for cutting out the unneeded or unwanted,
  where cut is to remove the things that are unwanted or unnecessary from a group, and prune is to get
  rid of the things that are not wanted or not needed, unlike the sense for framing and running by sound
  or craft rules, to reach wished ends, unlike the sense for thinking by sound sense, or using wit and
  reason, and unlike the sense for standing up for a deed or act with reasons, or clearing it of blame.
examples:
- They rationalise the list, cutting out the unneeded.
- They rationalise stock, cutting out the unwanted.
