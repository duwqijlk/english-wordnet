synsetId: 03298382-n
simpleMeaning: A way to draw the earth flat so four-sided shapes from lines north to south and east to
  west keep their size in relation to their size on the globe.
scope: A way of drawing the earth flat that keeps the true size of shapes, also called equal-area map
  projection; not a drawing that keeps shapes true and not a flat drawing of one small place.
examples:
- The equal-area projection shows each land at its true size.
- On this equal-area projection, the shapes look stretched but their sizes are true.
