simpleMeaning: The town or city that holds the offices that run one small part of a state.
scope: 'Also called county seat and county town: the town or city that holds the offices that run one
  small part of a state, not the biggest town in the part and not a place where laws are made.'
examples:
- Milltown is the county courthouse for the whole area.
- People from all over the area travel to the county courthouse for official papers.
