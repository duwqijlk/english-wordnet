simpleMeaning: Goods are carried on this long craft, which is thin enough to pass through canals
scope: This long craft carries goods through canals, and canal boat and narrow boat are other names for
  this sense, not a wide boat for open water.
examples:
- They loaded the narrowboat with coal at the wharf.
- Our narrowboat took three days to reach the next town by canal.
