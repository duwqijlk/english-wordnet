simpleMeaning: This very old kind of tiny living thing can not live or grow unless the water around it
  holds a lot of salt
scope: This very old kind of tiny living thing needs a lot of salt in the water to live, also called halophil,
  not a sea plant and not a germ that lives in fresh water.
examples:
- The halophile needs salty water to stay alive.
- A halophile was found in the salt pan.
