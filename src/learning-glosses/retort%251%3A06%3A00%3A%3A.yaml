simpleMeaning: a container used in science work, in which things are heated until they break apart or
  turn to gas and then back to liquid
scope: A container used in science work for heating things until they change. It is not a quick or sharp
  reply to something someone said.
examples:
- The chemist heated the liquid in a retort.
- Gas rose from the mixture inside the retort and passed into the cold tube.
