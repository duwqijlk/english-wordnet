simpleMeaning: The part of an animal's head that sticks out in front, holding the jaws and nose
scope: The front part of an animal's head, holding jaws and nose, not a cover fitted over it and not a
  gag in a person's mouth.
examples:
- The horse lowered its muzzle to the water.
- The dog's muzzle was wet with dew.
