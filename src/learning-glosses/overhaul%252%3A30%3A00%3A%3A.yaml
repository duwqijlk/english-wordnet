simpleMeaning: to fix something and make it work better, by mending it, building parts again, or changing
  how it works
scope: To fix a thing or system and make it better; modernize is another name for this sense. Not the
  noun overhaul, which is the name for the act of fixing and making better.
examples:
- They will overhaul the old engine this week.
- The city plans to overhaul its health care system.
