simpleMeaning: In maths, a flat line made by a point going round a middle point and getting farther from
  it each time round
scope: In maths, a flat line going round a middle point and getting farther from it, not a line on a tube
  and not a pretty shape on a thing.
examples:
- The spiral on the page grows wider with each turn round its middle.
- He traced a spiral that moved farther from the middle as it went round.
