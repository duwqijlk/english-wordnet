senseId: 'number%2:32:00::'
synsetId: 00950103-v
simpleMeaning: to work out how many things or how much of something there are.
scope: This sense is not about putting a limit on how many are allowed, and not about giving something
  a label or a place in a series; it is about finding out the total.
examples:
- She counted and numbered the coins in the jar.
- The officer numbered the crowd at about two hundred.
