simpleMeaning: to take part, with others, in rising up against and refusing to obey the people in charge
scope: This is the verb, to do this act; it is not the noun that names the act itself, an open rising
  up against the people in charge.
examples:
- The sailors mutinied against their captain after months at sea.
- The soldiers decided to mutiny rather than obey the cruel order.
