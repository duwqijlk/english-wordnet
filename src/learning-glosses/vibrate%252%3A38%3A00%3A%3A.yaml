simpleMeaning: to shake or beat again and again, or to move back and forth fast, usually in a way no one
  controls
scope: To shake or move back and forth fast, not to be unsure between two choices and not to feel a sudden
  strong feeling.
examples:
- The phone vibrated loudly on the table.
- The whole floor vibrated when the train passed below.
