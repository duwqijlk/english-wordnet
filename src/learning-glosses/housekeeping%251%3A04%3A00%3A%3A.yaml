simpleMeaning: the work of cleaning a home and doing the jobs needed to keep it running well
scope: Another name for this is housework. This is the cleaning and daily jobs in a home, not building
  or fixing a home.
examples:
- She does the housekeeping every morning before work.
- He shares the housekeeping with his sister, cleaning and cooking for the family.
