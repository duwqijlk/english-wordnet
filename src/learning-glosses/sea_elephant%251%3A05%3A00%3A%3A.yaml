simpleMeaning: one of two kinds of very big seal from the north Atlantic, with no outer ears and a nose
  that hangs down like a trunk
scope: A very big north Atlantic seal, also called an elephant seal; not a land animal and not a small
  seal with outer ears.
examples:
- A sea elephant hauled itself onto the beach to rest.
- The male sea elephant raised its trunk-like nose and roared.
