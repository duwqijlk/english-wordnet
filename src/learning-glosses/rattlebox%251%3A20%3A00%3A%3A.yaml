simpleMeaning: Seeds shake and make a noise inside the swollen pods of any of many plants of the group
  Crotalaria, grown to feed farm animals and to feed the soil.
scope: Also called crotalaria, it is any of many plants with swollen pods whose seeds shake inside, grown
  for pasture and to feed the soil.
examples:
- The rattlebox pods clicked when shaken.
- Farmers sow rattlebox to feed the soil.
