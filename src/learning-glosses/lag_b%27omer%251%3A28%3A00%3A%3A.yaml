simpleMeaning: In Judaism, a holy day that falls on the 33rd day after the second day of Passover, the
  18th day of Iyar.
scope: In Judaism, a holy day on the 33rd day after the second day of Passover; its near kin are other
  Jewish holy days, such as Passover and Shavuot.
examples:
- Lag b'Omer falls on the 18th day of Iyar.
- Jews mark Lag b'Omer 33 days after the second day of Passover.
