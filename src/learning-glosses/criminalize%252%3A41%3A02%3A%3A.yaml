schema: oewn-learning-gloss-v2
senseId: 'criminalize%2:41:02::'
synsetId: 02520746-v
simpleMeaning: to treat someone as if they have broken the law
scope: This sense is about treating a person as a law-breaker; it is not a court finding a person guilty,
  and it is not the making of a new law against an act.
examples:
- By searching every bag without reason, the guards criminalized the workers as if they were thieves.
- The system criminalizes people who are ill and need care, instead of helping them.
