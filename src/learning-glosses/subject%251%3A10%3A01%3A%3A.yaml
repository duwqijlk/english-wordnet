  subject%1:10:02 (the first term of a logic proposition), subject%5:00:00:susceptible:00 (possibly accepting
  or permitting), subject%5:00:00:subordinate:02 (under another person''s power), subject%5:00:00:affected:00
  (likely to be affected), and the verbs subject%2:39:03:: (cause to experience or suffer), subject%2:33:00::
