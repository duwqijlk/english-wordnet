simpleMeaning: In grammar, the part of a sentence that names who or what the rest of the sentence is about.
scope: 'Grammar sense: a sentence part, not a topic or a person. Distinct from subject%1:10:00 (the topic
  of a conversation or discussion), subject%1:06:00 (a person or scene chosen by an artist or photographer),
  subject%1:09:00 (a branch of knowledge), subject%1:09:01 (a situation or event being thought about),
  subject%1:18:01 (a person used in research), subject%1:18:00 (a person who owes allegiance to a nation),
  subject%1:10:02 (the first term of a logic proposition), subject%5:00:00:susceptible:00 (possibly accepting
  or permitting), subject%5:00:00:subordinate:02 (under another person''s power), subject%5:00:00:affected:00
  (likely to be affected), and the verbs subject%2:39:03:: (cause to experience or suffer), subject%2:33:00::
  (make accountable), subject%2:41:00:: (force to submit).'
examples:
- In 'The dog barked loudly', the subject is 'the dog'.
- Every sentence needs a subject and a verb.
