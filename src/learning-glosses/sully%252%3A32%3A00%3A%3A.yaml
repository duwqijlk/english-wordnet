simpleMeaning: to say untrue bad things about a person, with the aim of hurting them, and to spoil the
  good way others think of them
scope: 'Also called smear, slander, besmirch, defame, denigrate and asperse: this is saying false bad
  things to hurt a person''s good name, not making a thing dirty.'
examples:
- The newspaper tried to sully the mayor by printing lies about her.
- He sullied his rival's good name with false stories.
