simpleMeaning: A person who buys securities, papers standing for money in a business, in one market and
  sells them at once in another, hoping to gain from the difference in price.
scope: A person who buys and sells in different markets to gain from price differences, also called an
  arb or an arbitrager.
examples:
- The arbitrageur bought shares in London and sold them at once in New York.
- As an arbitrageur, they lived on tiny differences in price.
