simpleMeaning: A Latin phrase, or its short form, that tells the reader to take special note of something
scope: A Latin phrase, or its short form, that tells the reader to take special note of something; not
  a title and not a short note of one's own.
examples:
- He wrote nota bene in the margin beside the key point.
- The note began with nota bene to draw attention to the warning.
