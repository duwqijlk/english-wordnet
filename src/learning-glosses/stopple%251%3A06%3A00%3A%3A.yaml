simpleMeaning: a thing made to fill a hole tightly and keep something from passing through
scope: 'Also called plug and stopper: a thing made to fill a hole tightly, not a tap that controls a liquid
  and not a lid that just covers a top.'
examples:
- She pushed the stopple into the neck of the bottle.
- The stopple kept the wine from leaking out of the jug.
