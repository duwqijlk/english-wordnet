simpleMeaning: A disorder that appears with lung cancer, in which hip and thigh muscles are weak and tire
  easily and the back aches, from antibodies attacking nerve-muscle junctions.
scope: Another name for carcinomatous myopathy, the lung-cancer-linked condition that weakens hip and
  thigh muscles; not myasthenia gravis, a separate disease.
examples:
- Her myasthenic syndrome came from antibodies attacking the nerve-muscle junctions.
- In myasthenic syndrome, the hip and thigh muscles tire quickly and the back aches.
