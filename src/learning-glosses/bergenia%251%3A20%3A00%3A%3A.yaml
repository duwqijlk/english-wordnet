simpleMeaning: A plant of one group that stays green all year, kept as low cover for the ground and for
  its spring flowers.
scope: A low evergreen plant grown for ground cover and spring flowers; not a tree and not a cut-flower
  crop.
examples:
- We planted bergenia along the edge of the path.
- The bergenia kept its leaves through the winter.
