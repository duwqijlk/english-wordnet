simpleMeaning: The ability of something to stretch and then return to its former size.
scope: This is the stretchiness that lets a material recover its shape, not a leap, a coiled metal device,
  the season, a water source, or any verb sense.
examples:
- The old sofa has lost most of its spring.
- These new running shoes still have plenty of spring in them.
