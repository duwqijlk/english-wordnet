simpleMeaning: a very large, frightening sea creature in the Old Testament (the first part of the Bible)
  that stands for evil
scope: This is the sea creature in the Old Testament that stands for evil, not a whale or any other real
  sea animal.
examples:
- The old story tells of a leviathan, a huge sea creature that stands for evil.
- He read about the leviathan in the Old Testament and drew it as a monster of the sea.
