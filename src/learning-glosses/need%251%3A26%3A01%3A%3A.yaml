simpleMeaning: A condition of being extremely poor and lacking the basic things required to live.
scope: This is not a requirement or something you must have, and not a feeling of wanting something; it
  is extreme poverty.
examples:
- The charity provides meals for families living in great need.
- After the war, many people lived in desperate need.
