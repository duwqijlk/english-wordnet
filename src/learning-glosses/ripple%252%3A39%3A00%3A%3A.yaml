simpleMeaning: to move along in a broken stream with a soft bubbling sound
scope: Water moving in a broken stream with a bubbling sound, also called bubble; not a small wave on
  water made by wind, and not the small electric wave.
examples:
- The brook rippled over the stones.
- Water rippled past the bridge in the morning light.
