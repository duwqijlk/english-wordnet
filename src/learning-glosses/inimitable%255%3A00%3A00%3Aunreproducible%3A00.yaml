senseId: inimitable%5:00:00:unreproducible:00
synsetId: 01874420-s
simpleMeaning: too good or special to be copied, with nothing else as good
scope: This sense means so good or special that no copy can match it; it is not just different or rare,
  and not just hard to copy for a short time.
examples:
- Her inimitable voice made every song sound new.
- He cooks in an inimitable way that no one else can copy.
