simpleMeaning: A code for sending words by wire in which letters and numbers are shown by sets of dots
  and dashes, short and long signs.
scope: Also called international Morse code and Morse code; a dot-and-dash code for wires, not a spoken
  code and not a code of flags.
examples:
- He tapped out his name in Morse.
- Morse uses dots and dashes.
