simpleMeaning: The mechanical energy a thing has because of where it is, held in it until it is used.
scope: Also called potential energy; the power a thing holds because of where it is, not the power it
  has because it is moving.
examples:
- The ball at the top of the hill has P.E. because of its height.
- P.E. grows as the weight is lifted higher.
