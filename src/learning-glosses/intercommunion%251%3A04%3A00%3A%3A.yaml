simpleMeaning: Sharing in the holy meal by members of more than one church, such as Catholic and Orthodox.
scope: Sharing in the holy meal by members of more than one church, such as Catholic and Orthodox; not
  a holy meal shared by one church alone and not a shared prayer.
examples:
- Intercommunion let Catholic and Orthodox members share the meal.
- The churches agreed on intercommunion for the feast.
