simpleMeaning: one of the two square marks [ and ], used to mark off words in a text
scope: One of the square marks [ and ] used to mark off words, not the angle marks < and > used in computer
  code.
examples:
- Put the word in a bracket to show it was added later.
- The bracket [ opened the note at the edge of the page.
