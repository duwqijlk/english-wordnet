simpleMeaning: to settle down and stay in one place, as a bird does on its perch
scope: To settle down and stay in one place, as a bird does on its perch; not the shelter with bars itself.
examples:
- The birds roosted in the old barn for the night.
- After years of travel, he roosted at last in a small village.
