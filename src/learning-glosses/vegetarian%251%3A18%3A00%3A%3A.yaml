simpleMeaning: A person who eats fruit, grain, and nuts, and no meat or fish, and often no food that comes
  from animals.
scope: A person who eats fruit, grain, and nuts and no meat or fish, not a person who eats everything.
examples:
- She has been a vegetarian for ten years.
- The vegetarian ordered a salad with no cheese.
