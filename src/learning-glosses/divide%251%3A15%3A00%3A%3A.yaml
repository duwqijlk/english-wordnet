simpleMeaning: a high strip of land that keeps two river systems apart
scope: A high strip of land between two river systems, not a deep split in feeling between groups of people.
examples:
- The divide runs along the top of the hills.
- Rain on one side of the divide flows east, and on the other side it flows west.
