simpleMeaning: A diving duck of the far north with a big head that flies fast.
scope: This is a fast-flying diving duck of the far north with a big head; whistler, goldeneye and Bucephala
  clangula are other names for it, not small slow diving ducks of warm lands.
examples:
- Bucephela clangula flew fast over the northern lake.
- We watched a Bucephela clangula dive in the cold bay.
