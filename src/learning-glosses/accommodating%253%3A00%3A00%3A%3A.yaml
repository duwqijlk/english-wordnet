senseId: 'accommodating%3:00:00::'
synsetId: 00020824-a
simpleMeaning: helpful in making it easy for people to fit in or get used to a new place or way of doing
  things, without trouble
scope: Describes a person who helps others fit in or feel at ease; not about having enough room for people
  to stay or sit.
examples:
- The teacher was very accommodating when the new students joined the class.
- Our host was accommodating and changed the meal time to fit everyone's plans.
