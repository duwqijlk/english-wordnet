simpleMeaning: what people do or use most of the time, in the ordinary way
scope: 'Also called accustomed: what people do or use most of the time; not the sense of following custom,
  and not something rare.'
examples:
- He took his customary morning walk.
- Her customary cup of tea arrived at seven.
