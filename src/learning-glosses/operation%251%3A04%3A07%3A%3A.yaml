simpleMeaning: The work of running or using something, such as a machine or a company.
scope: The act of working a machine or running an enterprise only; not the condition of being in force
  or in use, a large business, a planned group undertaking, a step in a computer's processing, a military
  action, surgery, a work procedure, a manner of functioning, a mental act, or a mathematical calculation.
examples:
- The operation of the printing press requires two trained workers.
- The daily operation of the bakery begins long before the first customer arrives.
