simpleMeaning: a stiff material made by vulcanizing, heating with sulfur, the soft milky stuff got from
  trees, until it sets firm and will not spring back
scope: A stiff material also called ebonite, made by heating with sulfur until it sets firm and will not
  spring back, not the soft stretchy kind and not plastic.
examples:
- The comb was made of hard rubber.
- Hard rubber does not bend the way soft rubber does.
