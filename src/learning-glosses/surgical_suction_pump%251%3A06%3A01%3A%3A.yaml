simpleMeaning: a tool used in and after an operation to draw out fluids, bits of body, or gases
scope: This is a tool used in and after an operation to draw out fluids, bits of body, or gases, also
  called a surgical vacuum pump; not a tool that puts fluid into the body and not a heart-lung machine.
examples:
- The nurse switched on the surgical suction pump to clear fluid from the wound.
- A surgical suction pump was used after the operation to remove blood.
