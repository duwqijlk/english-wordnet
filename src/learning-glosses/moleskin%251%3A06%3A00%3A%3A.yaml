simpleMeaning: a strong cotton cloth that lasts a long time, with a soft surface of short, raised threads
scope: A strong cotton cloth with a soft surface, not the skin of an animal and not a paper notebook cover.
examples:
- He wore thick moleskin trousers for work in the fields.
- The old jacket was made of dark green moleskin.
