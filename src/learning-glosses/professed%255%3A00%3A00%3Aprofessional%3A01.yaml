simpleMeaning: saying that you are trained and able to do a job or know a subject
scope: This describes a person who says they are trained for a job or subject. It is not about a claim
  made to trick people.
examples:
- He is a professed expert in old coins, with years of study behind him.
- A professed teacher of music, she gave lessons at the school.
