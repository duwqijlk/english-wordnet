senseId: 'persistently%4:02:00::'
synsetId: 00273943-r
simpleMeaning: in a way that keeps trying and does not stop, even when things are hard
scope: Doing something in a way that keeps going without stopping, not doing it once and then giving up.
examples:
- She knocked persistently until someone opened the door.
- He persistently asked for help until he got an answer.
