simpleMeaning: a thing made of hard stuff that breaks easily, from minerals that are not metal, baked
  at very high heat
scope: A made thing of baked mineral that is hard and breaks easily, not the adjective for things made
  of such stuff.
examples:
- The ceramic vase broke when it fell.
- She bought a ceramic bowl at the market.
