simpleMeaning: 'A body process: breathing in and breathing out, taking in oxygen from the air and letting
  out carbon dioxide when breathing out'
scope: This process is also called breathing, ventilation and external respiration; it means the whole
  act of breathing in and out, not just taking one breath.
examples:
- His respiration was slow and steady as he slept.
- The doctor checked her respiration after the race.
