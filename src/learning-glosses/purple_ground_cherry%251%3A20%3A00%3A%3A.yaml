simpleMeaning: a plant that lives one year, from the warm lands of South America, with fruit you can eat
  that is dark red-blue
scope: 'Also called cape gooseberry: a one-year plant from warm South America with dark red-blue fruit
  you can eat, not the Mexican kind with yellow to dark red-blue fruit like small tomatoes and not a fruit
  tree.'
examples:
- The purple ground cherry grew in the warm garden and gave us fruit to eat.
- She picked a purple ground cherry and ate the dark fruit.
