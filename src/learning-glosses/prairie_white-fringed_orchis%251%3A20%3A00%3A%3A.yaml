simpleMeaning: In the boggy or wet lands of the north central United States grows a flowering plant with
  loose bunches of very sweet-smelling creamy or pale green flowers.
scope: 'Also called the prairie orchid: a flowering plant of the boggy or wet lands of the north central
  United States, not a plant of dry ground.'
examples:
- A prairie white-fringed orchis stood in the boggy ground, its loose bunches of creamy flowers filling
  the air with scent.
- Botanists look for the prairie white-fringed orchis in the wet lands of the north central United States.
