senseId: 'sitting%3:00:02::'
synsetId: 01242902-a
simpleMeaning: Used of a person whose upper body is upright and whose legs are bent, with the weight of
  the body resting on the buttocks.
scope: This describes a person's body position, not a formal meeting, not a period when a court or parliament
  is in session, and not the act of taking a seat.
examples:
- Please remain sitting until the bell rings.
- She stayed sitting at her desk long after everyone had left.
