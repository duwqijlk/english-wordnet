simpleMeaning: A blood group whose red blood cells lack the Rh factor, an antigen.
scope: Also called Rh-negative blood or Rh negative; blood without the Rh factor on its red cells, not
  a blood test.
examples:
- The nurse recorded that she had an Rh-negative blood type.
- The test showed that his blood type was Rh-negative.
