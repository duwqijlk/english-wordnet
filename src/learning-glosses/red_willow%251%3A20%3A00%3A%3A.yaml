simpleMeaning: Rose-tinted or purple twigs mark this shrub of Europe and Asia, whose bark is full of tannin,
  the bitter stuff used to tan leather.
scope: Also called basket willow, purple osier, purple willow, and red osier, this shrub of Europe and
  Asia has rose-tinted or purple twigs and bark full of tannin.
examples:
- The red willow grew by the river.
- We cut twigs from the red willow.
