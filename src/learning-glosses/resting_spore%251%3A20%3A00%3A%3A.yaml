simpleMeaning: a seed-like bit made by some simple water plants and fungi that stays still and asleep,
  and can start to grow after a long time
scope: Not a seed, and not a live cell that grows at once; a still bit that waits before it grows.
examples:
- A resting spore can wait for months before it grows.
- The resting spore lay still in the cold mud.
