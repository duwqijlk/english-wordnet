simpleMeaning: A drug that is not a steroid and fights swelling, sold under its trade name, used to treat
  joint pain and other sore swollen states.
scope: A drug against swelling that is not a steroid, also called fenoprofen and fenoprofen calcium; its
  near kin are the other drugs used to treat joint pain.
examples:
- Nalfon eased her arthritis.
- The doctor gave him Nalfon for the swelling.
