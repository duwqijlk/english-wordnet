simpleMeaning: A way of finding out what people think, by asking questions of a small group picked at
  random
scope: This is a survey of what people think, not the counting of votes in an election.
examples:
- The latest poll shows most voters support the new law.
- A poll of a thousand people found that half of them were unhappy.
