simpleMeaning: A North American herb with a poisonous root stock and a fruit that people can eat, though
  it has little taste.
scope: This is a North American herb with a poisonous root stock and an edible though tasteless fruit;
  mayapple, wild mandrake and Podophyllum peltatum are other names for it, not the fruit itself of the
  batch-4779 sense.
examples:
- The May apple in the woods has a poisonous root stock.
- May apples bear fruit that people can eat, though it has little taste.
