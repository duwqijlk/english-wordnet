simpleMeaning: 'In Chinese thought, one of two opposite main powers in the world: the dark, negative and
  female one'
scope: The dark, negative and female power in Chinese thought, not its bright, positive and male partner
  yang, and not a name or a sound.
examples:
- In Chinese thought, yin stands for the dark and quiet side of things.
- Yin and yang are two opposite powers that work together.
