simpleMeaning: A sound made by forcing air through a narrow gap, particularly when people use it to signal
  disapproval.
scope: The breathy sound itself, especially when it voices disapproval, not a jeering cry or the act of
  producing it; other names for this sense are hissing, hushing, fizzle and sibilation.
examples:
- The hiss of steam came from the kettle.
- A low hiss ran through the audience when the winner was announced.
