simpleMeaning: In sailing, the front edge of a sail set along the length of a boat, the edge that stands
  next to the mast.
scope: In sailing, the front edge of a sail set along the length of a boat, the edge that stands next
  to the mast; not the sail flapping when the wind blows on both sides alike.
examples:
- The luff of the sail stood close to the mast.
- He watched the luff tighten as the boat turned into the wind.
