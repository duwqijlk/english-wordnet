simpleMeaning: A stiff band worn round the part of the body that holds up the head, to keep it still
scope: This is a stiff band that keeps the head still, not a soft scarf and not a bandage for a cut.
examples:
- After the crash she had to wear a neck brace for six weeks.
- The neck brace kept his head from moving while the injury healed.
