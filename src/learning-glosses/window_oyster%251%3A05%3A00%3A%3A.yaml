simpleMeaning: A large thin flat shell you can see through marks this sea shellfish with two shells, common
  in the coastal waters of the Philippines.
scope: Also called capiz and windowpane oyster, this is a sea shellfish with two shells and a large thin
  flat shell you can see through, common in the coastal waters of the Philippines.
examples:
- Window oysters live in the coastal waters of the Philippines.
- The window oyster has a large thin flat shell.
