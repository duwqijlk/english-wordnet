simpleMeaning: kept whole as one single thing, not split into parts or shares
scope: Whole and kept as one thing. This is not the sense about giving all your attention to one thing
  only.
examples:
- She kept an undivided share in the family house.
- The brothers held the farm as one undivided piece of land.
