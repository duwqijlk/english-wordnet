simpleMeaning: a home where monks live, run by a man in charge of them, or where nuns live, run by a woman
  in charge of them
scope: This is the home itself, for monks or nuns; it is not a church where the public come only to pray,
  and not a school run by a religious group.
examples:
- The monks lived quietly at the priory for many years.
- We visited the old priory on the hill above the village.
