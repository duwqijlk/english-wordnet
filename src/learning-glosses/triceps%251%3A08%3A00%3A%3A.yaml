simpleMeaning: any muscle joined to the bone at three points, but especially the large muscle at the back
  of the upper arm
scope: This is a muscle joined to bone at three points, especially the one at the back of the upper arm,
  not a muscle joined at two points like the one at the front of the upper arm.
examples:
- He hurt his triceps when he lifted the heavy box.
- The triceps is the large muscle at the back of the upper arm.
