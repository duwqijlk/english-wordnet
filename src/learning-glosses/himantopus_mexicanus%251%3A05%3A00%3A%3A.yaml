scope: This is a long-legged bird of the southwestern United States to northern South America with black
  feathers from head to neck, also called black-necked stilt; near kinds are the black-winged stilt and
  the white-headed stilt.
examples:
- A Himantopus mexicanus waded in the shallow pond, its black feathers running down the back of its neck.
