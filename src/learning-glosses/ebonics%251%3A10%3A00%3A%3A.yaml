simpleMeaning: A form of American English, not the standard form, spoken in its own way by African Americans
  in the United States.
scope: A nonstandard form of American English spoken by African Americans, also called AAVE, African American
  English, African American Vernacular English, Black English, Black English Vernacular, Black Vernacular
  and Black Vernacular English; not standard American English and not a language of Africa.
examples:
- Ebonics is spoken by many African Americans in the United States.
- She grew up speaking Ebonics at home.
