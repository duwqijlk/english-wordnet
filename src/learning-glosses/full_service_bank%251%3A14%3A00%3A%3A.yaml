simpleMeaning: a place where people keep money they can take out at any time, borrow money, and get other
  money help
scope: 'Also called a commercial bank: a place that takes money in, lends money, and gives other money
  help to the public, not a place that only keeps money safe and not a place that only lends money.'
examples:
- She opened an account at the full service bank on Main Street.
- The full service bank lent us money for the house.
