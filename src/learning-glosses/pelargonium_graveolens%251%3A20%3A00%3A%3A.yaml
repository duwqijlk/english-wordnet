simpleMeaning: Any of a group of southern African geraniums with sweet-smelling leaves cut into three
  to five parts and pink flowers.
scope: Also called rose geranium and sweet-scented geranium; a sweet-smelling southern African geranium,
  set apart from scentless garden geraniums by its leaves cut into three to five parts.
examples:
- Pelargonium graveolens filled the greenhouse with its sweet scent.
- She rubbed a leaf of Pelargonium graveolens between her fingers.
