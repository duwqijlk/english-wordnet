simpleMeaning: Ink pressed through a cut sheet makes copies on this turning copier, sold under the trade
  mark Roneo.
scope: Also called mimeograph and mimeo, it presses ink through a cut sheet to print many copies.
examples:
- The mimeograph machine printed the copies.
- The mimeograph machine turns round as it prints.
