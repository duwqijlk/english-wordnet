simpleMeaning: A scientist who studies how populations grow and how crowded they are, and their births,
  deaths and marriages
scope: A scientist who studies how populations grow and how crowded they are, also called demographer;
  not a census taker who only counts people and not a doctor.
examples:
- The demographist studied how fast the town's population was growing.
- Demographists track births, deaths and how crowded places are.
