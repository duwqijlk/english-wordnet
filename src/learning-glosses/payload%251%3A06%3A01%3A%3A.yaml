simpleMeaning: The front part of a guided missile, rocket, or torpedo, carrying the charge that explodes,
  or the chemicals or living things that harm people.
scope: Also called a load or a warhead, this is what a guided missile, rocket, or torpedo carries in its
  front end.
examples:
- The missile's payload was a single explosive charge.
- Engineers checked the payload before the launch.
