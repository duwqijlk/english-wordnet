schema: oewn-learning-gloss-v2
senseId: 'placebo_effect%1:19:00::'
synsetId: 11436201-n
simpleMeaning: A change that seems to follow a fake treatment, usually helpful, credited to trust or expectations
  about the drug; pharmacologists first described it, and it now covers non-drug cases.
scope: This is the improvement seen after a dummy treatment, not the dummy treatment itself and not a
  real drug's action.
examples:
- The trial showed a strong placebo effect among the patients.
- Researchers now look for placebo effects in fields far beyond medicine.
