simpleMeaning: in a way that is not natural, done to seem small and pretty or fine and polite
scope: This is being small, pretty, fine or polite in a way that is not natural; twee and prim are other
  names for this sense. Not about cutting food into small pieces.
examples:
- She took small, mincing steps across the room.
- His mincing voice made every word sound too neat and put on.
