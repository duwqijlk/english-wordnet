simpleMeaning: The sound a church bell makes in Roman Catholic churches when it is rung to tell people
  it is time to say a set prayer.
scope: 'Also called angelus: the sound made when a church bell is rung in Roman Catholic churches to tell
  people it is time to say a set prayer, not the prayer itself.'
examples:
- The angelus bell rang to tell people it was time to pray.
- The angelus bell sounded from the church tower.
