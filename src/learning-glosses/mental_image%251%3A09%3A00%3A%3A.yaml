simpleMeaning: a picture-like thing in the mind that stands for something seen or thought of
scope: A picture-like thing in the mind; close to a memory picture, but not tied to something seen before,
  and not a dream.
examples:
- She held a mental image of the house in her mind.
- A mental image of his face stayed with her all day.
