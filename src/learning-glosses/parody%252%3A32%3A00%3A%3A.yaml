simpleMeaning: to make a funny copy of a person or a work, copying its style closely to make people laugh
scope: Making a funny copy of a person or work; not the noun senses, which are the funny copy itself or
  the act of copying as a thing.
examples:
- The students parodied their teachers in the school show.
- He parodied the famous speech, copying the speaker's voice.
