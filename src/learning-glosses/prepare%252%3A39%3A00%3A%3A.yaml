simpleMeaning: In music, to soften a clashing note by placing that same note, as a harmonious one, in
  the chord just before.
scope: This is the music-theory sense of easing a dissonant note, not the general sense of getting something
  ready or the sense of writing out a speech or report.
examples:
- The composer prepared the harsh note by sounding it first as a gentle one in the previous chord.
- In bar 139 the strings prepare the dissonance with a consonant note in the chord before.
