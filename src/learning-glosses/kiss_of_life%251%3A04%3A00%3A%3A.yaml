senseId: 'kiss_of_life%1:04:00::'
synsetId: 00834287-n
simpleMeaning: Emergency chest compressions and artificial breathing for someone who has collapsed with
  no pulse and stopped breathing, given first to restart the heart, restore blood flow and prevent brain
  damage.
scope: This is another name for cardiac resuscitation and cardiopulmonary resuscitation; it is not mouth-to-mouth
  breathing on its own.
examples:
- The lifeguard gave the swimmer the kiss of life at the poolside.
- A passer-by used the kiss of life before the paramedics reached him.
