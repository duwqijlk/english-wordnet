simpleMeaning: one of a pair born together from one egg, with the same genes
scope: One of a pair born together from one egg, with the same genes, also called monozygotic twin and
  monozygous twin; not a pair from two eggs and not just look-alike brothers or sisters.
examples:
- She and her identical twin share the same genes.
- As an identical twin, he looks exactly like his brother.
