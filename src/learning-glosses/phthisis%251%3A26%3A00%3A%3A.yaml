simpleMeaning: A sickness that wastes the body away more and more and harms the lungs
scope: 'Also called consumption and pulmonary tuberculosis: a sickness that wastes the body away and harms
  the lungs, not a short cough and not a chest cold.'
examples:
- Phthisis wasted his body away over many months.
- The doctor said the phthisis had harmed her lungs.
