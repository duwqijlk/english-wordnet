simpleMeaning: A small striped animal of eastern America that lives partly on land, with pouches in its
  cheeks
scope: This is a small striped animal of eastern America with pouches in its cheeks; eastern chipmunk,
  hackee and striped squirrel are other names for this sense, not the wider group of burrowing animals
  and not a tree squirrel.
examples:
- A ground squirrel darted across the path with its cheek pouches full.
- The ground squirrel is a small striped animal of the eastern woods.
