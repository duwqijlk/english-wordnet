simpleMeaning: loving too much in a foolish way, and letting the loved person have their way too much
scope: 'Another name for this sense is fond, also called adoring: loving in a foolish way that goes too
  far. It is not plain, wise love or care.'
examples:
- The doting grandparents gave the child every toy he asked for.
- Her doting husband brought her gifts every day and never said no to her.
