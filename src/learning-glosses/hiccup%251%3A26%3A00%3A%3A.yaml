simpleMeaning: A bout of automatic spasms of the muscle sheet under the lungs, with the throat snapping
  shut to make a sound; the word is usually plural and sometimes signals indigestion.
scope: The bout of automatic spasms that makes the sound, not a minor problem or delay; hiccough is an
  older spelling of this same word.
examples:
- She got the hiccups from laughing so hard.
- A loud hiccup escaped him in the middle of the exam.
