simpleMeaning: A narrow-minded loyalty to one sect, party or church group
scope: A narrow-minded loyalty to one sect, party or church group, also called sectarianism; not loyalty
  to a faith in general and not the habit of splitting into groups.
examples:
- He condemned denominationalism in his sermon.
- Denominationalism kept the two churches from working together.
