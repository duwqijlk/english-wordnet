simpleMeaning: the act of taking air or other gases into the body
scope: 'Also called aspiration, inhalation, inspiration and intake: the act of taking air into the body,
  not the act of breathing out and not a deep sigh.'
examples:
- Breathing in slowly helps calm the nerves.
- She took a deep breath, breathing in the fresh sea air.
