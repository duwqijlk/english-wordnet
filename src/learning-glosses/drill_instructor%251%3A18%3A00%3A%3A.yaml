simpleMeaning: An officer of lower rank who teaches new soldiers to march and to follow orders.
scope: An officer of lower rank who teaches new soldiers to march and to follow orders; drill master is
  another name for this sense, not a general and not a civilian teacher.
examples:
- The drill instructor taught the recruits to march in step.
- Our drill instructor made the new soldiers march for hours.
