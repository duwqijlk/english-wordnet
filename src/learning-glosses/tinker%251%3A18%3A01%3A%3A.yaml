simpleMeaning: In the past, a traveling person, traditionally a Gypsy, who mended pots, kettles, and other
  metal things to earn a living
scope: A traveling mender of pots and kettles in past times; not a person who fixes machines for fun,
  and not the verb sense of doing odd jobs.
examples:
- The tinker came to the village to mend pots and kettles.
- Long ago, a tinker would travel from town to town with his tools.
