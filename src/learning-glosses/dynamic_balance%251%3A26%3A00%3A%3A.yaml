simpleMeaning: In flying-lore, the even state in which spin-out pushes from a turning mass, say a propeller,
  make no push in the shaft, so shaking falls away.
scope: 'In aeronautics: the even state in which spinning forces from a rotating mass, such as a propeller,
  make no push in the shaft, so shaking falls away.'
examples:
- Dynamic balances cut shaking in propellers.
- The dynamic balance steadies the shaft.
