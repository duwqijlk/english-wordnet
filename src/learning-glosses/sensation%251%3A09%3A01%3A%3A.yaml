senseId: 'sensation%1:09:01::'
synsetId: 05659816-n
simpleMeaning: the power in the body that lets you take in what is outside you, such as seeing, hearing,
  or feeling by touch
scope: 'Also called sense: the power of the body to take in the world, not one feeling in the body and
  not the feeling itself.'
examples:
- In the dark he had to depend on his sensations of touch and smell.
- Her sensations of sight and hearing helped her find her way in the dark.
