simpleMeaning: A highly poisonous tall coarse tropical plant that lives one season, with foul-smelling
  leaves, large white or violet trumpet-shaped flowers and prickly fruits.
scope: A poisonous tropical weed, also called common thorn apple, jimson weed, jimsonweed, apple of Peru
  and Datura stramonium, with foul-smelling leaves, trumpet-shaped flowers and prickly fruits.
examples:
- Jamestown weed grew behind the barn.
- Do not touch Jamestown weed, as it is highly poisonous.
