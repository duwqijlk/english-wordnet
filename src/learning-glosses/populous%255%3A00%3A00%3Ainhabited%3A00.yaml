simpleMeaning: having many people living close together in one place
scope: This describes a place with many people living in it. It is not about an empty place, and not about
  how well liked a person or thing is.
examples:
- Tokyo is a populous city with millions of people living in it.
- They moved from a quiet village to a populous town.
