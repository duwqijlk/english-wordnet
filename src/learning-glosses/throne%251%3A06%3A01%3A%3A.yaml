simpleMeaning: A thing joined to a building's water pipes; people use it to pass urine and solid waste
  from the body
scope: 'Also called can, pot, and toilet: a thing joined to water pipes that people use to pass waste
  from the body; it is not the special chair of a king or queen and not their power or position.'
examples:
- The plumber fixed the throne because it would not flush.
- She cleaned the throne in the bathroom before the guests came.
