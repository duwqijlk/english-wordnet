simpleMeaning: A grey-brown songbird of Europe, Asia and Africa, with a light patch at the front of the
  neck and pale underparts
scope: This is a grey-brown songbird with a white throat and pale belly, not a smaller songbird of the
  same family and not any other small brown bird.
examples:
- We heard a greater whitethroat singing in the hedge.
- The greater whitethroat showed its white throat as it flew up.
