simpleMeaning: A home built on posts set in or near a lake, above all in villages of long ago.
scope: This is a home built on posts set in or near a lake, above all in villages of long ago; lake dwelling
  is another name for this sense, not a home on dry land and not a home on a boat.
examples:
- The pile dwelling stood on posts above the lake.
- Pile dwellings were built in prehistoric villages.
