schema: oewn-learning-gloss-v2
senseId: 'corner%1:26:01::'
synsetId: 14432355-n
simpleMeaning: a difficult situation that you cannot get out of gracefully
scope: This is a figurative tight spot with no graceful way out, not a physical angle or recess, and not
  the act of trapping someone.
examples:
- The company backed itself into a corner by promising a deadline it could not meet.
- She felt she had painted herself into a corner and had no good way out.
