simpleMeaning: The strap of a horse's headgear that passes over the animal's nose.
scope: The strap of a horse's headgear that passes over the animal's nose; also called a noseband; not
  the middle part of glasses that rests on the nose, and not a plate of armour that guards the nose.
examples:
- The nosepiece of the bridle crossed over the mare's nose.
- They fitted the nosepiece so it sat flat on the pony's nose.
