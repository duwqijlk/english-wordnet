simpleMeaning: In ships, a spare vessel that heats water to make steam, used while the ship is in port
scope: A spare steam heater for a ship in port, also called an auxiliary boiler, and not the ship's main
  source of steam and not one used at sea.
examples:
- The crew fired up the donkey boiler while the ship lay in port.
- Repairs kept the donkey boiler out of use, so the ship had no spare steam in port.
