simpleMeaning: a medical tool that writes down several things the body does at the same time, such as
  heart beat, blood pressure, breathing, and sweating
scope: This is a medical tool that records several body measures at the same time, such as heart beat
  and breathing.
examples:
- The doctor connected the patient to a polygraph to watch his heart and breathing.
- A polygraph recorded her blood pressure and sweating during the test.
