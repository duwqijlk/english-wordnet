simpleMeaning: a mark that remains where injured tissue has healed, usually on the skin
scope: This sense is also called cicatrix or cicatrice; it is the healed mark on skin, not a general sign
  of damage or the act of leaving one.
examples:
- The cut healed, leaving a scar on his arm.
- She has a small scar above her eyebrow.
