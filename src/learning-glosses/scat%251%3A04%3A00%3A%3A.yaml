simpleMeaning: A way of singing jazz where the singer uses made-up sounds instead of words and tries to
  sound like a musical instrument
scope: 'Also called scat singing: jazz singing with made-up sounds, not the verb that means to run away
  fast.'
examples:
- She sang scat for the last song, using sounds like 'doo' and 'bee' instead of words.
- The singer's scat sounded almost like a trumpet playing with the band.
