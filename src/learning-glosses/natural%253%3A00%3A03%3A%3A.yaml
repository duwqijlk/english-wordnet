simpleMeaning: real and able to be explained by ordinary physical causes, not by magic or spirits.
scope: This is about explaining events without magic; it is not about things being genuine rather than
  fake, and not about the physical world as a subject.
examples:
- The film offers a natural explanation for what looks like a ghost.
- The doctor looked for natural causes before considering anything unusual.
