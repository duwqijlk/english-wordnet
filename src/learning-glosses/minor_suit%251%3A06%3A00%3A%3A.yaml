simpleMeaning: Either diamonds or clubs, this group of cards in bridge is worth fewer points
scope: In bridge, a group of cards worth fewer points, either diamonds or clubs; not a major suit, and
  not a single card.
examples:
- Diamonds are a minor suit in bridge.
- He bid a minor suit, clubs, to show his hand.
