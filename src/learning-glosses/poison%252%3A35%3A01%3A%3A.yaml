simpleMeaning: to kill a person or animal by a harmful material that is in the thing itself
scope: A thing kills by a harmful material that is in it; not a person killing with a harmful material,
  and not putting a harmful material into food or drink.
examples:
- This mushroom can poison anyone who eats it.
- Those bright berries can poison small animals.
