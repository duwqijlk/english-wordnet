simpleMeaning: to get a person to give up a bad way of living and take up a good one
scope: 'Reform and reclaim are other names for this sense: getting a person to give up a bad way of living
  and take up a good one, not growing new body tissue and not making a flow of power in a wire stronger.'
examples:
- The Church helped regenerate many lost souls.
- Good friends can regenerate a man who has gone wrong.
