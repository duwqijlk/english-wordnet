simpleMeaning: a blood channel through holes in the neck bones, weaving a net round the spine's artery,
  that drains into the wide vein from the head and arm
scope: 'Also called vertebral vein: a blood channel through holes in the neck bones, weaving a net round
  the spine''s artery; not a vein of the arm or leg.'
examples:
- The vena vertebralis passes through small holes in the neck bones.
- A scan showed the vena vertebralis winding round the artery in her neck.
