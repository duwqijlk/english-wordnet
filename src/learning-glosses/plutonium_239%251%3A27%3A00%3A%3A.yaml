simpleMeaning: A kind of the metal that splits very easily, used in atom bombs and as fuel in reactors,
  made by hitting uranium 238 with slow electrons
scope: A man-made kind of this metal, not a fuel for home fires and not a metal for everyday use.
examples:
- Plutonium 239 is used as fuel in reactors.
- Plutonium 239 can be made by hitting uranium 238 with slow electrons.
