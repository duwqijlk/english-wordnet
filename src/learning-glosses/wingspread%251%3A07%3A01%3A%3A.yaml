senseId: 'wingspread%1:07:01::'
synsetId: 05138000-n
simpleMeaning: the distance from the far end of one side to the far end of the other side of a bird or
  insect, when both sides are fully open
scope: The width across a bird or insect with its sides fully open, not the length of its body and not
  the width of a plane.
examples:
- The eagle's wingspread was wider than a man's outstretched arms.
- The butterfly's wingspread was about the width of my hand.
