simpleMeaning: the act of staying away from a person or thing on purpose, or of stopping something from
  taking place
scope: This act, also called dodging and avoidance, is done on purpose to stay away, not by chance and
  not a way of meeting or using something.
examples:
- After the fight, her shunning of her brother lasted for months.
- The group's shunning of the man kept him out of all their talks.
