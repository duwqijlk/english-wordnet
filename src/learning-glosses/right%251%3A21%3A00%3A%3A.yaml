simpleMeaning: A claim or interest that law or custom gives someone over something that cannot be touched,
  such as an idea or a benefit.
scope: This is not the hand on one side of the body and not the conservative political side; it is a legal
  or customary claim over something intangible.
examples:
- She sold the film rights to her novel.
- The company owns the rights to the software.
