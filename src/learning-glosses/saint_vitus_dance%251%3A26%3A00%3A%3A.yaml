synsetId: 14119050-n
simpleMeaning: A sickness that makes the body move in jerks, chiefly in children, and is linked with rheumatic
  fever.
scope: Also called St. Vitus dance or Sydenham's chorea, this is a shaking sickness of children linked
  with rheumatic fever, not a dance people choose to do and not a fever itself.
examples:
- The child with Saint Vitus dance could not keep her arms still.
- Saint Vitus dance left the boy jerking his hands without meaning to.
