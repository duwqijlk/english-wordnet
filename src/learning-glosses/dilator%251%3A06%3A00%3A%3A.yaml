simpleMeaning: A tool used in surgery to widen or stretch open a hole or a part of the body.
scope: A surgery tool that widens an opening, also called a dilater; not a knife and not a clamp.
examples:
- The surgeon used a dilator to widen the narrow opening.
- A dilator gently stretches the passage open.
