senseId: 'afibrinogenemia%1:26:00::'
synsetId: 14194105-n
simpleMeaning: a state in which the blood has no fibrinogen, the stuff that makes blood clot, so bleeding
  goes on for a long time
scope: A state in which the blood has no fibrinogen and so keeps bleeding; not a bleeding sickness caused
  by weak blood vessels, and not a blood clot.
examples:
- Afibrinogenemia means even a small cut can bleed for a long time.
- The doctor found afibrinogenemia after the wound would not stop bleeding.
