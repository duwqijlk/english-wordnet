simpleMeaning: One of the Bantu people who live in Botswana, in the land named for them, and the north
  of South Africa and speak the tongues of their own people.
scope: One of the Bantu people of Botswana, Lesotho and the north of South Africa; the word also names
  their tongues, and things of their people, but here it means a person of the people.
examples:
- The Sotho farmer drove his cattle home at dusk.
- Many Sotho live in the north of South Africa.
