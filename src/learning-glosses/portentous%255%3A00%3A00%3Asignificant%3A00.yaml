senseId: portentous%5:00:00:significant:00
synsetId: 02171721-s
simpleMeaning: having great meaning, either because it is very important or because it seems to warn that
  bad things will come
scope: Another name for this sense is prodigious. It describes something of great meaning, because it
  matters greatly or because it warns of bad things to come; it does not mean just very large, and it
  is not a proud, showy manner.
examples:
- A portentous silence fell in the room before the king spoke.
- Dark clouds and a portentous stillness warned of the coming storm.
