simpleMeaning: the act of joining things together, or fixing one thing to another, with small loops of
  thread
scope: The act of joining things together, or fixing one thing to another, with small loops of thread;
  sewing is another name for this sense, not the finished seam, and not the thread itself.
examples:
- The stitching on the quilt was neat and even.
- She took up the stitching and worked on it by the fire.
