simpleMeaning: a room, often below ground, made strong against bombs and stocked with food and things
  to live on, used when bombs fall from planes
scope: A room, often below ground, made strong against bombs and stocked with food; bombproof and bomb
  shelter are other names for this, not an ordinary cellar and not a trench in the open.
examples:
- Families hid in the air-raid shelter during the bombing.
- The air-raid shelter had food and beds for the night.
