simpleMeaning: A plant that produces pale, bottle-shaped fruit with smooth thin skin and tender edible
  flesh.
scope: The plant that bears the squash eaten as a vegetable, not the squash sold in shops and not the
  butternut tree.
examples:
- Butternut squash plants need plenty of sun and well-drained soil.
- The butternut squash plant produced pale, bottle-shaped fruits.
