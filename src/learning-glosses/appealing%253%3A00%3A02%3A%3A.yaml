simpleMeaning: Of people in a story or play, making you feel for them and care what happens to them
scope: Of story or play characters, making you feel for them, also called sympathetic, not pleasing to
  look at.
examples:
- The appealing hero of the play won the crowd's hearts.
- She played an appealing girl who lost her home.
