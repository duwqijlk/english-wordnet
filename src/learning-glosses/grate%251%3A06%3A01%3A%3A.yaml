simpleMeaning: a frame of bars side by side or crossing each other. It blocks a way through but lets air
  pass
scope: 'Also called grating: a frame of bars that blocks a way through but lets air pass. It is not the
  verb sense about rubbing food into small bits, and not the harsh sound made by rubbing things together.'
examples:
- Air came in through the metal grate in the wall.
- He lifted the grate to clean the hole below it.
