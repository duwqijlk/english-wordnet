simpleMeaning: In printing, the part of a tall small letter that sticks up above the other small letters
scope: In printing, the part of a tall small letter that rises above the rest; not the main body of the
  letter and not a capital letter.
examples:
- The ascender of the letter 'd' rises above the other small letters.
- In printing, the ascender is the tall part of a small letter.
