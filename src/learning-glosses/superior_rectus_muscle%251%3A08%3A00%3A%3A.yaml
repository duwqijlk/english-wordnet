simpleMeaning: The part of the eye that pulls the eyeball up and toward the middle when it tightens.
scope: The part of the eye that pulls the eyeball up and toward the middle; also called rectus superior
  and superior rectus; not a part that turns the eye down and not one that moves the eye sideways.
examples:
- The superior rectus muscle lifts the eyeball when you look up.
- Damage to the superior rectus muscle makes it hard to look upward.
