synsetId: 07130622-n
simpleMeaning: A speech sound from stopping air, then letting it burst out.
scope: This sense is also called a stop, for a speech sound from stopping air, then letting it burst out,
  where a stop is a consonant sound made by blocking the flow of air at some point and then suddenly releasing
  it.
examples:
- The plosive stopped air, then let it burst out.
- Plosives are speech sounds from stopping air.
