simpleMeaning: anything that blocks or slows things and is hard to deal with
scope: 'Also called hitch, interference, hindrance, preventive, encumbrance, and incumbrance: a thing
  that blocks the way, not a medicine that stops illness and not a thing that stops a baby from being
  made.'
examples:
- The locked gate was a preventative that slowed all the work.
- A fallen tree acted as a preventative on the narrow road.
