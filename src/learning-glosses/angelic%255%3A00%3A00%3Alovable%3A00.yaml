simpleMeaning: having a sweet, kind, gentle nature, like an angel or a cherub (a young angel)
scope: This sense means having a sweet, lovable nature; it is also called sweet, cherubic, angelical,
  and seraphic. It is not the sense about being purely good like a holy person, and not the sense that
  just means to do with angels.
examples:
- She gave us an angelic smile that made everyone feel calm.
- The child looked angelic as she slept.
