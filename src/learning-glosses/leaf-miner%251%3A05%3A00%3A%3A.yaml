simpleMeaning: One of several kinds, above all those of the group Gracilariidae, small moths or two-winged
  flies have young that dig into green blades and eat the soft stuff inside.
scope: Also called a leaf miner, this is one of several kinds of small moth or two-winged fly whose young
  dig and feed inside green blades.
examples:
- A leaf-miner dug into the leaf and fed there.
- Young leaf-miners fed on the soft stuff inside the leaf.
