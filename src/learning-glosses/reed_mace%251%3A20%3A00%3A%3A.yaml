simpleMeaning: A tall marsh plant of North America, Europe, Asia and North Africa, whose long flat leaves
  make mats and chair seats; cylindrical seed heads burst when ripe, shedding much down.
scope: Another name for the tall marsh plant also called nailrod, reedmace, bulrush and cat's-tail; not
  the spice mace, and not the bur-reed, whose seed heads are prickly balls.
examples:
- Reed mace crowded the muddy bank of the pond.
- The long flat leaves of reed mace are still used for chair seats.
