simpleMeaning: Trousers whose legs end at or above the knee; the word for them is used in the plural
scope: These are trousers whose legs end at or above the knee; trunks is another name for this sense.
  Not long trousers and not underwear.
examples:
- He wore shorts and a T-shirt on the hot day.
- Her blue shorts end just above the knee.
