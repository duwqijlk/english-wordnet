simpleMeaning: A condition in males with small testes, long legs, larger breasts, less sperm made, and
  low learning; a gene fault in which the male has an extra X chromosome.
scope: Not Down syndrome or Turner syndrome, other gene conditions; also called Klinefelter's syndrome
  and Klinefelter syndrome.
examples:
- XXY-syndrome affects boys and men.
- The doctor found XXY-syndrome in the young man.
