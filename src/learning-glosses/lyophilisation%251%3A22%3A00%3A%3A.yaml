simpleMeaning: In a vacuum, frozen food, blood plasma, drugs, or tissue are warmed so the ice turns straight
  to gas, and the stuff dries out and keeps its shape.
scope: Also called freeze-drying and lyophilization; a way to dry food, blood plasma, drugs, or tissue
  and keep their shape.
examples:
- Lyophilisation keeps the medicine dry without breaking its shape.
- The lab used lyophilisation to dry the blood plasma.
