simpleMeaning: A person whose back is bent over because the top of the spine curves the wrong way.
scope: 'Also called a humpback or a hunchback: a person whose back is bent over from a curved upper spine,
  not the adjective for having that bent back.'
examples:
- The old crookback sold herbs in the market.
- A crookback passed slowly down the lane.
