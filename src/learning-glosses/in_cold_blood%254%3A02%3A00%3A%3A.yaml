simpleMeaning: Without pity or care, done on purpose with cruel hardness of heart.
scope: Done on purpose without pity or care, not done from sudden anger and not done by mistake; cold-bloodedly
  is another name for this sense.
examples:
- He planned the murder in cold blood.
- The attack was done in cold blood, with no pity at all.
