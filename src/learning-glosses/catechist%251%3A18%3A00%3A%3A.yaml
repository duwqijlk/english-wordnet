simpleMeaning: One who teaches people learning the faith, to get them ready for baptism, most of all by
  using a book of set questions.
scope: One who teaches people learning the faith, to get them ready for baptism, most of all by using
  a book of set questions; not one who teaches people after baptism, and not one who teaches children
  to read.
examples:
- The catechist taught the class each Sunday.
- Our catechist used the book of set questions.
