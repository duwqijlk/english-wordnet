simpleMeaning: Tall, coarse Old World tropical one-year plant, widely grown in the southern US and West
  Indies for its long sticky green pods, a soup-and-stew base; sometimes placed in genus Hibiscus.
scope: The whole plant; okra, okra plant and gumbo are other names for it, and it is not just the edible
  pods or another Hibiscus species.
examples:
- Lady's-finger is widely grown in the southern United States for its green pods.
- The long green pods of lady's-finger are used in soups and stews.
