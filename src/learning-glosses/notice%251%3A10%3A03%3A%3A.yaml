simpleMeaning: A statement given ahead of time, usually in writing, that someone will pull out of an agreement.
scope: This is the formal statement that an agreement or job will end, not a general announcement about
  an event; it is not a sign put up in public, not a bill asking for payment, not a short review of a
  play or book, and not the verb meaning to greet or acknowledge someone you meet.
examples:
- She gave her landlord a month's notice before moving out.
- The company must give staff three months' notice of redundancy.
