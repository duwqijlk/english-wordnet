simpleMeaning: The place where the far end of the radius, a bone of the lower arm, meets the nearest row
  of small bones at the base of the hand
scope: 'Also called wrist, articulatio radiocarpea, carpus and radiocarpal joint: the place where the
  arm bone meets the small bones of the hand, not the elbow and not a finger joint.'
examples:
- She sprained her wrist joint in the fall.
- The wrist joint lets the hand bend and turn.
