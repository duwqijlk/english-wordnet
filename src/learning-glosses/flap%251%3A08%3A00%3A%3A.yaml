senseId: 'flap%1:08:00::'
synsetId: 05397105-n
simpleMeaning: a piece of body tissue (skin, flesh or other soft material in the body) that can move and
  is still joined to the body in part
scope: A movable piece of body tissue, not a loose covering joined at one edge and not the moving part
  on a plane wing.
examples:
- A small flap of skin hung over the cut.
- The doctor moved the flap back into place over the wound.
