simpleMeaning: a hotel where people who are travelling can pay to stay and sleep for the night
scope: 'Also called inn, and another name for it is hostel: a hotel for people travelling to stay in for
  the night. It is not a small simple country house for a short stay, and not the small house at the gate
  of a large country house.'
examples:
- We stayed at a small lodge near the road for the night.
- The lodge at the edge of town had clean rooms for travellers.
