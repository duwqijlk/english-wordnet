senseId: 'dodder%1:20:00::'
synsetId: 12846257-n
simpleMeaning: a climbing plant of the Cuscuta group, with no leaves, that lives for one year, has white
  or yellow thread-like stems, and takes food from other plants through sucking parts
scope: This is a plant that lives on other plants and takes their food; it is not the verb sense about
  shaking or walking in a weak, unsteady way.
examples:
- Yellow dodder spread over the bush, its thin stems winding round the branches.
- The farmer pulled the dodder off his young plants before it could take their food.
