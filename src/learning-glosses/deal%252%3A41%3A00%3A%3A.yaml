simpleMeaning: manage to do, make or achieve something even though only limited or insufficient resources
  are available
scope: This sense is about getting a result with scant means, not about handing things out in portions
  or about timber.
examples:
- Somehow she dealt with the entire harvest using one broken tractor.
- The volunteers dealt with the flood using sandbags and borrowed pumps.
