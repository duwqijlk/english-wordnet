simpleMeaning: Toward the front, or ahead of the present position.
scope: This is an adverb telling the direction of movement or position, not an adjective describing something
  as moving ahead.
examples:
- She took a step forward to see the stage better.
- The line moved forward slowly as each passenger showed a ticket.
