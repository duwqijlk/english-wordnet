simpleMeaning: A machine that moves liquid into a pipe by the force that throws things out from the middle
  of a spin.
scope: A machine moving liquid into a pipe by spin force, not a machine that lifts water by hand and not
  a tap.
examples:
- The centrifugal pump pushed water from the tank into the pipes.
- A centrifugal pump kept the cooling water moving round the engine.
