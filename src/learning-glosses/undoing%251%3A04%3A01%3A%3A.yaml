simpleMeaning: the loosening of the knots or bands that hold a thing shut
scope: The loosening of what holds a thing shut, not the tying or fastening of it.
examples:
- She spent ten minutes undoing the knots in the rope.
- Undoing the bow tie is easy; tying it is the hard part.
