simpleMeaning: The milk-producing organ of cows, sheep, goats and other cattle-like animals.
scope: The organ that gives milk on a farm animal such as a cow, not any kind of container, and not the
  case for clothes or the small purse for money.
examples:
- The farmer cleaned the cow's bag before milking.
- A swollen bag on a dairy goat can be a sign of infection.
