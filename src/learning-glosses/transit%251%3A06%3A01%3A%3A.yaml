simpleMeaning: the system of vehicles and equipment a place needs to move people or goods
scope: 'Also called transportation: the system of vehicles and equipment a place needs to move people
  or goods, not one bus or train, and not a star moving across the sky.'
examples:
- The city's transit system carries thousands of people each day.
- Good transit links help workers reach the factory.
