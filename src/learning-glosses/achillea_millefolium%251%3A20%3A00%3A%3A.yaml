simpleMeaning: A common strong-smelling Eurasian herb that forms mats, found in wasteland, hedgerow or
  pasture, with narrow toothed leaves and small usually white flower heads; now widespread across North
  America.
scope: Also called yarrow and milfoil; a strong-smelling Eurasian herb that forms mats, not a tall garden
  herb and not a grass.
examples:
- Achillea millefolium grew along the edge of the field.
- We picked Achillea millefolium for its strong smell.
