simpleMeaning: A medium-sized tree of eastern North America, with white or pale gray bark and wood of
  little value; it often grows as a second-growth forest tree
scope: 'Also called gray birch, grey birch, American gray birch, and Betula populifolia: one of several
  North American birches, set apart by its white or pale gray bark and wood of little value.'
examples:
- American grey birch grew along the old logging road.
- The pale bark of the American grey birch stood out in winter.
