simpleMeaning: the band of space between Mars and Jupiter where most of the small rocky bodies are found
scope: The ring of rocky bodies between Mars and Jupiter, not the planets themselves and not a belt worn
  round the waist.
examples:
- Most of the small rocky bodies in the asteroid belt lie between Mars and Jupiter.
- The probe crossed the asteroid belt on its way to the outer planets.
