simpleMeaning: Lecithin, a substance that keeps a mix smooth, is most often added to the liquid from cocoa
  beans, mixed with cocoa fat and a little sugar and vanilla.
scope: Bittersweet chocolate and dark chocolate are other names for this mix of cocoa-bean liquid, cocoa
  fat, a little sugar, and vanilla.
examples:
- The cake was made with semi-sweet chocolate.
- A bar of semi-sweet chocolate went into the bowl.
