simpleMeaning: an angel in the second highest group, whose special gift is knowledge; usually shown as
  a child with wings
scope: An angel of this kind, usually shown as a child with wings, not a real child and not another kind
  of angel.
examples:
- The old painting shows a cherub with small wings above the altar.
- A stone cherub stands on each side of the church door.
