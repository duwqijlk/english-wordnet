simpleMeaning: A kind of chorea, a sickness with sudden jerks of the body, whose jerks come most when
  the sick person stands up
scope: A jerking sickness worst when standing, not a shaking of the hands at rest and not a fit.
examples:
- Her orthochorea made her jerk most when she stood up.
- The doctor saw orthochorea in the patient as soon as he rose.
