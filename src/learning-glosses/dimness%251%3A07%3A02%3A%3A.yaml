simpleMeaning: How faint or washed-out something looks, with little difference between its light and dark
  parts
scope: Faintness or weak contrast in how something looks, not a lack of brightness in a light or sound.
examples:
- The dimness of the old photo made the faces hard to tell apart.
- He turned up the lamp because the dimness of the print hurt his eyes.
