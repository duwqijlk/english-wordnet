simpleMeaning: a gun with a long barrel, held at the shoulder and loaded at the front end, formerly used
  by foot soldiers
scope: A long gun from earlier times, loaded at the front end, not a modern gun loaded at the back.
examples:
- The soldier cleaned his musket before the march.
- Muskets were carried by foot soldiers in that war.
