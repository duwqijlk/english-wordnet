simpleMeaning: a mathematical set of elements in which addition and multiplication can be regrouped or
  swapped without changing the result, multiplication distributes over addition, and 0 and 1 are present.
scope: This is the mathematical structure, not a plot of land, not an area of study, not a sports ground,
  not the space around a magnet, not all the competitors in an event, and not a unit of stored data.
examples:
- The rational numbers form a field under ordinary addition and multiplication.
- Every finite field has a number of elements equal to a power of a prime.
