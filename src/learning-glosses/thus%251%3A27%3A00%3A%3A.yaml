simpleMeaning: A sweet-smelling gum resin from various Arabian or East African trees, once prized in worship
  and used to preserve the dead and to purify the air with its smoke.
scope: This is an old noun for a fragrant tree resin, not the everyday adverb 'thus' meaning 'in this
  way' or 'therefore'. It survives mainly in historical, biblical and botanical writing, where the resin
  is burned as incense.
examples:
- Merchants carried thus, myrrh and spices along the incense road.
- The priest burned a handful of thus at the altar, and the temple smelled sweet.
