senseId: 'runoff%1:11:00::'
synsetId: 07421872-n
simpleMeaning: an event in which extra liquid, such as water, goes past the limit of what a place or container
  can hold
scope: Also called overflow and overspill. This is extra liquid that is more than a place can hold, not
  a second vote to choose a winner after a first vote with no winner.
examples:
- Heavy rain caused runoff from the fields into the river.
- The drain could not hold all the runoff after the storm.
