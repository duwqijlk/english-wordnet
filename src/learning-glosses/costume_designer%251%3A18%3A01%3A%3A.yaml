simpleMeaning: a person who plans the clothes worn on stage or at a fancy-dress party, or gives them to
  the people who wear them
scope: A person who plans or gives out the clothes worn on stage or at a fancy-dress party, not a person
  who sews them and not a person who acts in the play; costumer and costumier are other names for this
  sense.
examples:
- The costume designer chose bright colours for the king's robes.
- She worked as a costume designer for the school play.
