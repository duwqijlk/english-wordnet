simpleMeaning: Yellow-brown and deeply ridged, this tropical fruit is eaten raw as a vegetable or in salad,
  and as a sweet dish when fully ripe.
scope: 'Also called carambola: a deeply ridged yellow-brown tropical fruit eaten raw as a vegetable or
  in salad, and as a sweet dish when fully ripe.'
examples:
- She sliced the star fruit into the salad.
- They served the star fruit as a sweet dish when it was fully ripe.
