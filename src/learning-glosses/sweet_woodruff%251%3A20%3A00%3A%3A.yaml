simpleMeaning: An Old World fragrant perennial, runner-spreading, with leaves, narrow, and white flowers,
  small, to flavour things, and for sachets, grown wide for ground cover, sometimes classed as Asperula.
scope: Also called fragrant bedstraw, waldmeister, and woodruff, this is an Old World fragrant perennial,
  runner-spreading, with leaves, narrow, and white flowers, small, to flavour things, and for sachets,
  grown wide for ground cover, sometimes classed as Asperula, where fragrant bedstraw is a sweet-smelling
  Old World plant lasting years, spreading by runners, with leaves, narrow, and white flowers, small,
  to flavour things, and for sachets, grown wide as a ground cover and sometimes put in the genus Asperula.
examples:
