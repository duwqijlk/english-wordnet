simpleMeaning: Stonelike things grow inside an organ of the body, such as the kidneys.
scope: This making of stonelike things inside an organ is a process, not the hard lump itself.
examples:
- The doctor noted concretion in the kidneys.
- Stonelike objects from concretion were seen in the liver.
