simpleMeaning: A stuff that blows up, made of a salt that holds nitrogen and fine dust of a metal.
scope: People pack this blowing-up mix of a nitrogen salt and metal dust into cans to keep the damp out.
examples:
- The miners packed ammonal into cans to keep the damp out.
- The rock face was broken apart with ammonal.
