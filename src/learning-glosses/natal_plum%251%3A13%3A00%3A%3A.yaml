simpleMeaning: A red fruit that can be eaten, from a South African plant.
scope: A red fruit that can be eaten, from a South African plant; carissa plum is another name for this,
  and it is not the South African shrub of the same name or a true plum.
examples:
- The natal plum was ripe and red.
- She ate a natal plum from the bush.
