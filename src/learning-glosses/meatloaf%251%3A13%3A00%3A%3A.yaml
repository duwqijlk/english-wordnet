simpleMeaning: meat made into very small pieces, formed into the shape of a bread loaf and baked in an
  oven
scope: This is baked meat in the shape of a loaf; it is not plain meat in small pieces before cooking
  and not a loaf of bread.
examples:
- She served hot meatloaf with potatoes for dinner.
- He put the meatloaf in the oven for an hour.
