simpleMeaning: to hit someone with the flat of your hand, usually in a friendly way to praise or to say
  hello
scope: This is a friendly hit with a flat hand, not hitting two things together for a sharp sound and
  not cheering a show by hitting your hands together.
examples:
- He clapped his friend on the back to say well done.
- She clapped the child gently on the shoulder as a greeting.
