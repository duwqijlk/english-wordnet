simpleMeaning: a series of numbers or letters, in the right order, that opens a lock
scope: The code that opens a lock, not a set of planned chess moves, not a group of people joining together,
  and not things put together into a whole.
examples:
- He forgot the combination to the safe and could not open it.
- I wrote down the combination for my bike lock so I would not forget it.
