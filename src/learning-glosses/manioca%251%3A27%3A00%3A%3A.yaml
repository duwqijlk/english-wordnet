simpleMeaning: A main food in the hot lands, this starchy powder comes from soaking and drying the thick
  underground part of the cassava plant, and tapioca comes from it.
scope: People also call it manioc, cassava or cassava starch, and it is the starchy stuff from which tapioca
  is made.
examples:
- Manioca went into the pot for supper.
- Tapioca comes from manioca, soaked and dried from the cassava root.
