simpleMeaning: A shipping paper given when goods pass by more than one kind of transport or by way of
  more than one storehouse
scope: This is a shipping paper given when goods pass by more than one kind of transport or storehouse;
  not a paper for one kind of transport and not a receipt.
examples:
- The goods travelled by ship and rail under one through bill of lading.
- The through bill of lading covered the whole journey through two storehouses.
