simpleMeaning: From the Philippines comes a fruit of warm lands, its white pulp, a little sweet, holding
  a mass of small seeds.
scope: This is a fruit from the Philippines, not the tree that bears it; its white pulp holds a mass of
  small seeds.
examples:
- They cut open a marang and shared the sweet white flesh.
- They ate the marang seeds with the white pulp.
