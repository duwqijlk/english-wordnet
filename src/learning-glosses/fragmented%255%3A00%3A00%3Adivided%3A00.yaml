synsetId: 02490690-s
simpleMeaning: split into parts, so the whole is no longer held together as one
scope: Also called split and disconnected, this describes a group or thing broken into parts that no longer
  work as one, not a single thing that is only damaged.
examples:
- The party became fragmented, with small groups pulling in different ways.
- A fragmented system made it hard for offices to share information.
