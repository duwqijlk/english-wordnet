simpleMeaning: 'Its oil stings skin and raises a rash on touch: this climbing plant of the eastern and
  central United States has leaves in threes and greenish flowers, then white berries.'
scope: A climbing plant common in eastern and central United States, with leaves in threes and white berries;
  its oil raises a rash on touch; markweed and poison oak are other names for it.
examples:
- She brushed against poison ivy and got a rash.
- Poison ivy climbed the fence, its leaves in threes.
