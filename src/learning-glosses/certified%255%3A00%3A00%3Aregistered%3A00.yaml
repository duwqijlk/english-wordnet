simpleMeaning: With the right papers in hand and on the official list as fit to do a named job or use
  a named skill
scope: Holding the right papers and on the official list as fit for a set job or skill, with qualified
  as another name for this sense, and not merely approved by an expert or judged insane.
examples:
- She is a certified teacher with ten years in the classroom.
- Only a certified electrician may sign off the work.
