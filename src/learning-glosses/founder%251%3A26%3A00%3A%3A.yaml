simpleMeaning: a sickness in a horse's foot where the thin layers of soft material that join the hoof
  to the foot become swollen and sore
scope: This is a disease of a horse's foot, not a person who starts a new school, group or business, and
  not the verb that means to fail or fall down.
examples:
- The vet said the horse had founder and could hardly walk.
- Founder left the horse in pain and unable to stand for long.
