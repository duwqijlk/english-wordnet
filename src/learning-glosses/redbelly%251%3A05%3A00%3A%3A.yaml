simpleMeaning: A fresh-water turtle of the streams that flow into Chesapeake Bay, with marks of a deep
  rose colour on the shell below.
scope: 'Also called red-bellied terrapin or red-bellied turtle: a fresh-water turtle of Chesapeake Bay
  streams with deep rose marks on the shell below, not the sea turtle and not the land tortoise.'
examples:
- The redbelly basked on a log in the creek.
- A redbelly slipped into the water.
