simpleMeaning: With a dye that glows or a chemical that does a job, such as horseradish peroxidase, a
  test marks chosen bits in body tissue so they can be seen.
scope: A test that marks chosen bits in tissue to show them.
examples:
- Immunohistochemistry showed the cancer bits in the tissue.
- The lab ran immunohistochemistry on the sample to mark the bits.
