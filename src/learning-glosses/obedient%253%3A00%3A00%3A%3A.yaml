simpleMeaning: Doing as you should and following the orders and directions of people who have the right
  to tell you what to do
scope: This is doing as you should and following orders from people who have the right to tell you what
  to do. Not refusing to do what they say.
examples:
- The obedient dog sat and stayed when its owner told it to.
- Obedient children came inside at once when the teacher called.
