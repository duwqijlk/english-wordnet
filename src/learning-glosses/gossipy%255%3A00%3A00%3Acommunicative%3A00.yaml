simpleMeaning: ready to talk often, in a friendly way that is not formal
scope: Also called chatty. This means happy to talk in a friendly, easy way, not spreading talk about
  other people's private lives.
examples:
- Our gossipy neighbour stops to talk with everyone on the street.
- He is a gossipy man who loves a long, friendly talk over tea.
