simpleMeaning: For hire to travelers, or for mail carriers to use, this animal is kept at an inn or a
  place where animals are changed
scope: 'Another name for post-horse, also called poster: a horse kept at an inn for mail carriers to use
  or for travelers to hire, not a horse kept for riding for fun and not a horse that carries the mail
  itself.'
examples:
- A post horse stood ready outside the inn.
- The mail carrier took a post horse for the next stage of the journey.
