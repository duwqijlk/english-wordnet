senseId: 'evoke%2:37:00::'
synsetId: 01763170-v
simpleMeaning: to make a feeling rise in someone and come out
scope: Also called fire, raise, provoke, arouse, and kindle; to bring out a feeling in someone, not to
  bring out a thing or an event and not to work out a meaning.
examples:
- Her story evoked pity in everyone who heard it.
- The song evoked a smile from the whole room.
