simpleMeaning: a small piece of plastic, cloth, or metal that shows your rank, or that you belong to a
  group
scope: A small sign you wear that shows your rank or the group you belong to, not the act of putting such
  a sign on someone or something.
examples:
- He wore a badge that showed he was a police officer.
- Please show your badge at the door.
