senseId: 'emphasis%1:10:01::'
synsetId: 07117611-n
simpleMeaning: important, special stress given to a word or idea by putting it in a strong place or saying
  it again
scope: Stress given by a strong place or by saying a word again, not strong feeling in how something is
  said and not the stress on one syllable or note.
examples:
- The writer gave emphasis to the last word by putting it at the end of the sentence.
- By repeating the word, she put emphasis on how urgent the warning was.
