simpleMeaning: a common bird of North America and Europe that builds its nest in barns and other such
  places
scope: A common bird of North America and Europe that nests in barns, also called a barn swallow; not
  the American swift that nests in unused chimneys.
examples:
- A chimney swallow built its nest in the old barn.
- Chimney swallows return to the same barn each spring.
