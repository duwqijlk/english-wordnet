simpleMeaning: The main money of most EU states since 1999; in 2002 Germany, France, Belgium, Luxembourg,
  Netherlands, Italy, Spain, Portugal, Ireland, Greece, Austria, Finland took it and dropped their old
  money.
scope: The main money of most states in the EU, not the old money of each state alone.
examples:
- Prices in France are now given in euros.
- She paid ten euros for the book.
