simpleMeaning: to measure the inside width of a gun barrel or a tube
scope: This means measuring the inside width of a gun or tube, not making small changes to a tool so it
  measures well, and not marking a scale on a measuring tool.
examples:
- He calibrated the gun to find out how wide its barrel was inside.
- She calibrated the pipe to measure the width inside it.
