simpleMeaning: the part of medicine that deals with the nerves, the brain and the cord of nerves in the
  back, and the illnesses that affect them
scope: Also called clinical neurology, this is the part of medicine that deals with nerves and the illnesses
  that affect them. Not the other sense of the word, which is about the system of nerves itself and not
  its illnesses.
examples:
- She studied neurology so she could treat illnesses of the brain and nerves.
- The hospital's neurology team checked his nerves after the stroke.
