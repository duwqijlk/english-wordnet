simpleMeaning: Through fixed ideas about rule and society, a thing is changed or read, and the result
  is often seen as one-sided or narrow.
scope: It names the act of laying fixed ideas about rule and society over a thing, so that it is changed
  or read through them.
examples:
- The ideologization of the news made every story serve one side.
- They spoke of the ideologization of art in that period.
