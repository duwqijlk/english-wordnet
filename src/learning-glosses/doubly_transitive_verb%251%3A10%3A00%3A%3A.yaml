senseId: 'doubly_transitive_verb%1:10:00::'
synsetId: 06342470-n
simpleMeaning: 'an action word that needs two things named after it: the thing acted on and the person
  or thing that gets it'
scope: 'Also called a doubly transitive verb form: an action word that needs two things after it, not
  one that needs only the thing acted on and not one that needs nothing after it.'
examples:
- In 'She gave him a book', 'gave' is a doubly transitive verb.
- A doubly transitive verb takes two objects, as in 'They sent her a letter'.
