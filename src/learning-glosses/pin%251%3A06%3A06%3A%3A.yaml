simpleMeaning: a pole put in the hole on a golf green to show where the hole is
scope: 'Also called a flag: a pole that marks the hole on a golf green, not a small thin piece of wood
  or metal used to hold things together and not a wooden thing used in bowling.'
examples:
- The pin stood next to the hole on the green.
- He aimed his putt at the pin.
