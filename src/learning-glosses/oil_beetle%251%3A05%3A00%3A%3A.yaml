simpleMeaning: One of many kinds of hard-backed insect that gives off a greasy stuff from its leg joints
  to drive foes away.
scope: Among insects that give off a greasy stuff, this one does so from its leg joints to drive foes
  away.
examples:
- The oil beetle gave off a greasy stuff from its leg joints.
- An oil beetle drove the foe away with the greasy stuff from its legs.
