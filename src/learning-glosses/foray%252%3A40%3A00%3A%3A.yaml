simpleMeaning: to steal things from a place and take them as goods won by force
scope: Also called strip, rifle, plunder, loot, ransack, pillage, despoil, and reave. This is stealing
  things by force in a raid, not just going into a place.
examples:
- Soldiers forayed into the village and took its food and gold.
- The raiders forayed through the town, stealing goods from empty shops.
