simpleMeaning: Thick hair on the head of this monkey looks like the hood worn by a monk; it lives in Central
  America and South America.
scope: 'Also called capuchin: a monkey from Central and South America, not the raccoon-like animal of
  Mexico and the southwestern United States that has a long tail with black and white rings.'
examples:
- The ringtail moved through the trees of Central America.
- A ringtail sat on the branch, its thick hair falling like a hood.
