simpleMeaning: Someone who is drawn in love and desire to those of the other sex.
scope: Someone drawn in love and desire to those of the other sex; straight and heterosexual are other
  names for this sense, and this is not someone drawn to those of the same sex.
examples:
- He described himself as a heterosexual person.
- The survey asked each heterosexual person about their partner.
