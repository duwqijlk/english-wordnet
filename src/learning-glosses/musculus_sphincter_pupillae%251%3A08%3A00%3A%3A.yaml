simpleMeaning: A ring of flesh that works on its own, round the coloured part of the eye
scope: 'Also called the pupillary sphincter: a ring of flesh round the coloured part of the eye, not the
  flesh that opens the eye wide and not the coloured part itself.'
examples:
- In bright light, the musculus sphincter pupillae tightens round the iris.
- The doctor could see the musculus sphincter pupillae close round the iris.
