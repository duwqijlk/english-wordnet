simpleMeaning: A tall deciduous shrub of eastern North America with edible bluish to blackish berries
  that carry a distinct powdery coating; it is the source of most cultivated blueberries.
scope: This is the tall eastern North American shrub, not the low-bush blueberry or another wild kind,
  and not just the berries it yields. It is a botanical name.
examples:
- High-bush blueberry grows well in the acid soil at the edge of the woods.
- The high-bush blueberry in our garden fruited in its third year.
