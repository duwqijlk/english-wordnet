simpleMeaning: the fact of being in favour of great and sudden change in how things are run
scope: The fact of being in favour of great and sudden change in how things are run, not a small change
  and not a wish to keep things as they are.
examples:
- The revolutionariness of his ideas shocked the old guard.
- Her revolutionariness grew out of years of unfair rule.
