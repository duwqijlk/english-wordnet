simpleMeaning: A very tall plant with stems that branch out and showy yellow flower heads made of many
  doubled petals
scope: This is a very tall branching plant with showy yellow flower heads; double gold and golden glow
  are other names for this sense, not the shrub with round flower heads that turn pink or blue.
examples:
- The hortensia grew taller than the fence by summer.
- We planted hortensia along the back wall.
