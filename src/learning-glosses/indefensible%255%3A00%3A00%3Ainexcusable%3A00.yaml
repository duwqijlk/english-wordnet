senseId: indefensible%5:00:00:inexcusable:00
synsetId: 01726584-s
simpleMeaning: That cannot be shown to be right or made clear by any good reason.
scope: That cannot be shown to be right, also called insupportable, unwarranted, and unjustifiable; not
  a theory that merely cannot be defended.
examples:
- His indefensible cruelty shocked the whole town.
- The minister's indefensible spending left the party with no excuse.
