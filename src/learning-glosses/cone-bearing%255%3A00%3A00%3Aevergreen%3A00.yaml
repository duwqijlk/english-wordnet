simpleMeaning: Describes trees or bushes that carry seed cases and keep green leaves all year.
scope: Also called coniferous; describes trees and bushes with seed cases and leaves that stay green,
  not trees that lose their leaves in winter.
examples:
- The cone-bearing pine keeps its green needles through winter.
- Cone-bearing trees line the road up the hill.
