senseId: faultfinding%5:00:00:judgmental:00
synsetId: 00652250-s
simpleMeaning: Likely to judge things by one's own views of right and wrong, or by personal opinion.
scope: Likely to judge by one's own views of right and wrong; not persistent, petty criticism without
  good reason, and not the habit of finding and pointing out faults.
examples:
- The new manager was faultfinding, picking at every small mistake.
- She was faultfinding about every detail of the plan.
