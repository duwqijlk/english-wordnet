simpleMeaning: Green and purplish-red look the same to a person with this form of colour blindness, because
  green light is hard for the eye to see
scope: Green-blindness is another name for this colour blindness, in which green is hard to see.
examples:
- Deuteranopia makes green and purplish-red look the same to him.
- With deuteranopia, she could not tell the green light from the red one.
