simpleMeaning: A small bird of Australia, usually light green with black and yellow marks in the wild,
  but bred in many colours
scope: This is a small Australian bird; lovebird, budgerigar, budgie, budgereegah and budgerygah are other
  names for it, not a large parrot and not a bird from another land.
examples:
- The grass parakeet sang from its perch in the morning.
- We keep two grass parakeets, one green and one blue.
