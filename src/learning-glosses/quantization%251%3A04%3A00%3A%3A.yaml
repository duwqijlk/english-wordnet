simpleMeaning: In the theory of tiny bits of matter, the act of splitting things into those bits or saying
  them in that theory's words
scope: 'Another name for quantisation: the act of splitting things into tiny bits of matter, or saying
  them in the words of the theory of tiny bits of matter, not the act of counting how much there is.'
examples:
- Quantization of light energy was a key idea in early quantum physics.
- The physicist described the quantization of the field in simple terms.
