senseId: 'ordinate%2:41:00::'
synsetId: 02391154-v
simpleMeaning: To set in holy office.
scope: This sense is also called order, ordain, and consecrate, for setting in holy office, where order
  is to formally place someone in a religious office as a member of the clergy, unlike the sense for bringing
  bits or parts into right or wished-for tune and tie, and unlike the sense for the worth of a point on
  the up-axis.
examples:
- They ordinated him, setting him in holy office.
- Ordinating sets one in holy office.
