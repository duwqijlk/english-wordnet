simpleMeaning: in grammar, the forms of words, such as you, used when speaking to the one you are talking
  to
scope: The forms of words used to speak to the one you are talking to, such as you; not the forms for
  talking about yourself or about someone else.
examples:
- In the second person, 'you are' is the form used to speak to a friend.
- The teacher asked us to write in the second person, speaking straight to the reader.
