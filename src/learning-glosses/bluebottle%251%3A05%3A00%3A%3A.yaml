simpleMeaning: a fly with a bright shiny blue body that makes a loud buzzing sound when it flies
scope: This is the fly with a shiny blue body, not the plant of the same name that has blue, purple, pink
  or white flowers.
examples:
- A bluebottle flew around the kitchen, buzzing loudly against the window.
- The bluebottle landed on the meat and we waved it away.
