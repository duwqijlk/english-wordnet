simpleMeaning: To run or control a machine through a switch that is worked by a small electric current
scope: Running a machine through a current-worked switch, not passing a message along and not a fresh
  team of workers.
examples:
- The thermostat relays the heater on when the room gets cold.
- The pump is relayed by the control unit.
