simpleMeaning: in patches of many colors, most of all bright ones
scope: 'Also called painted, multicolor, multicolored, motley, piebald, pied, calico, multicolour, multicoloured,
  multi-color, multi-colored, multi-colour, multi-coloured, particolored, particoloured and varicolored:
  having patches of different colors, most of all bright ones, not one plain color and not a single bright
  color.'
examples:
- His varicoloured shirt mixed green, orange and purple.
- The varicoloured kite stood out against the grey sky.
