simpleMeaning: the size of a wanted sound put next to the size of unwanted sound, as one number
scope: The size of a wanted sound put next to the size of unwanted sound, as one number, also called signal-to-noise,
  signal-to-noise ratio and signal/noise; not the strength of the wanted sound on its own and not the
  strength of the unwanted sound on its own.
examples:
- The signal/noise ratio of the phone line was poor that night.
- A good signal/noise ratio keeps voices clear.
