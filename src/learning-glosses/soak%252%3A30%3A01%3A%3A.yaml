simpleMeaning: to put liquid all over a thing, or pour liquid onto it
scope: To put liquid all over a thing, or pour liquid onto it, not to fill a thing right through and not
  to make a person drunk.
examples:
- He soaked his face with cold water to wake himself up.
- He soaked the dry ground with water from the hose.
