simpleMeaning: A disk is split into marked parts, so it is ready to hold data
scope: To split a disk into marked parts so it can hold data, also called format or initialize; not to
  save a file and not to wipe a disk clean.
examples:
- Please initialise the new disk before you save anything on it.
- He had to initialise the old disk to use it again.
