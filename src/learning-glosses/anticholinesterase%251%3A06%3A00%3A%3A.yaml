senseId: 'anticholinesterase%1:06:00::'
synsetId: 02720995-n
simpleMeaning: a medicine that joins with cholinesterase, a chemical that breaks down acetylcholine, and
  stops it, so acetylcholine can work longer
scope: A medicine that stops cholinesterase so acetylcholine can work longer, not a drug that blocks acetylcholine,
  and not a plain painkiller.
examples:
- The doctor gave an anticholinesterase to help the muscles work better.
- An anticholinesterase keeps acetylcholine in place by stopping the chemical that breaks it down.
