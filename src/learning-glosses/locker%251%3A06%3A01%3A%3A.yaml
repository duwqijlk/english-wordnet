simpleMeaning: a large strong box for keeping your own things, usually kept at the end of a bed, as in
  rooms where soldiers sleep
scope: This is the large box for your own things kept at the end of a bed, not the small cupboard-like
  space for clothes and things of value and not a part that locks or closes a thing.
examples:
- His locker stood at the foot of his bed in the barracks.
- The soldier kept his clothes in the locker at the end of his bed.
