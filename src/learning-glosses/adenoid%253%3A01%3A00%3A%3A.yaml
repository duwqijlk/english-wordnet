simpleMeaning: To do with, or like, the small glands in the body that help fight disease, or the soft
  body material they are made of
scope: 'This word describes things: it means to do with, or like, those small glands. It is not the name
  of the lump of soft tissue at the back of the throat itself.'
examples:
- The doctor found adenoid tissue growing at the back of the child's throat.
- The scan showed adenoid glands that were larger than normal.
