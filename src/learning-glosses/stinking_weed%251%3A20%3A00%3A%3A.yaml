simpleMeaning: a tropical shrub full of leaves that smells bad, whose seeds have been used to stretch
  coffee; sometimes put in the plant group Cassia
scope: 'Also called coffee senna, mogdad coffee, and styptic weed: a shrub whose seeds were used to stretch
  coffee, not a plant grown for its flowers and not coffee itself.'
examples:
- The stinking weed grew thick along the roadside in the heat.
- Farmers once mixed stinking weed seeds into coffee to make it go further.
