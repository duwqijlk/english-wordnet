simpleMeaning: a white solid made of small hard grains, mainly sodium chloride, used to add taste to food
  and keep it from going bad
scope: This is the white solid used to add taste to food and keep it from going bad; salt is another name
  for this sense, not the bare chemical form of sodium chloride.
examples:
- Add a pinch of common salt to the soup.
- Fish was kept in common salt to stop it going bad.
