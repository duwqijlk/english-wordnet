simpleMeaning: Covered thick with dirt or soot that has sunk in and will not come off.
scope: Covered thick with dirt or soot that has sunk in; dingy and grimy are other names for this sense,
  and it is not just a little dirty, nor muddy.
examples:
- The miner came home with grubby hands.
- Her grubby little fingers left marks on the clean dress.
