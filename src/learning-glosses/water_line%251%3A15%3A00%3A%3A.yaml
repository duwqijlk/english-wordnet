simpleMeaning: A mark that shows how high the liquid reaches up a ship's side when the ship floats upright,
  often painted on the ship's outer side.
scope: A mark showing how high the liquid reaches up a ship's side when the ship floats upright; water
  level and waterline are other names for this sense, not a mark for cargo and not a mark on a dock.
examples:
- The water line is painted on the hull of the ship.
- He checked the water line to see how low the ship sat.
