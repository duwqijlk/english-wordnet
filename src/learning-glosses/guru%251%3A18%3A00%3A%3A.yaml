simpleMeaning: a leader and teacher in the Hindu or Buddhist religion, who helps people with matters of
  the spirit
scope: A Hindu or Buddhist religious leader and teacher, not just a well-known expert in a subject.
examples:
- The guru led the morning prayers and spoke to his students about peace.
- Many people travelled to hear the guru teach about faith and the spirit.
