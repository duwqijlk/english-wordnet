simpleMeaning: something that says what will happen to a person in the future, made by looking at where
  the planets are in relation to each other
scope: A telling of a person's future from where the planets are, not the drawing that shows where the
  planets and signs are at a set time and place.
examples:
- Her horoscope said she would meet someone new this week.
- He reads his horoscope in the paper every morning.
