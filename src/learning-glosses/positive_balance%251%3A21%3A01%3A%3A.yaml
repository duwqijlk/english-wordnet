simpleMeaning: money left in an account after more money has gone in than has gone out, so the bank owes
  that money to the person who holds the account
scope: Also called credit balance, this is money left in an account when more has gone in than out, so
  the bank owes it to the person who holds the account, not money that person owes to the bank.
examples:
- Her account showed a positive balance after her pay went in.
- With a positive balance, the bank owes her money, not the other way round.
