simpleMeaning: A narrow strip of fine material put along the edge of a thing to make it look nice
scope: This is a strip of fine material for trimming the edge of a thing, not the inked strip in a typewriter
  and not any long thing that looks like a thin line.
examples:
- She tied a red ribbon around the gift box.
- A blue ribbon trimmed the edge of her dress.
