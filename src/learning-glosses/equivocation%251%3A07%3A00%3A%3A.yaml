simpleMeaning: being unclear on purpose, so words can be understood in more than one way
scope: 'Also called evasiveness: being unclear on purpose, not a statement that cleverly avoids a hard
  truth, and not making something false by using unclear words.'
examples:
- His equivocation left us unsure what he really meant.
- She used equivocation to avoid giving a clear answer.
