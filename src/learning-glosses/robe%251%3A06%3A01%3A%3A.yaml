simpleMeaning: A full-length outer garment that flows and is worn for official events or ceremonies.
scope: A formal ceremonial outer garment — another name for gown in this sense — not any loose flowing
  garment, and not the verb meaning to dress.
examples:
- The judge entered the court in a black robe.
- The choir wore purple robes for the ceremony.
