simpleMeaning: to stab with a sharp point, or to push someone or an animal to go on, in the way a sharp
  stick would
scope: To stab or push someone on with a sharp point; not the rude name for a person, not the small hollow
  in a surface, and not the sense of making a short sharp feeling on the skin.
examples:
- He pricked the balloon with a pin and it burst.
- She pricked the ox with a pointed stick to urge it on.
