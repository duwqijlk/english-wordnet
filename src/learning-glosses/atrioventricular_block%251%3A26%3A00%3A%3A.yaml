simpleMeaning: Fits of sudden blackout that come again and again, when the signal that sets the beat of
  the heart fails to get through
scope: This heart trouble, also called heart block, brings fits of blackout again and again, not a single
  one-time faint.
examples:
- Her atrioventricular block made her black out again and again.
- The atrioventricular block stopped the signal that sets the beat of his heart.
