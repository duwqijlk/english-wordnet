simpleMeaning: Making copies by putting ink on paper, as books and papers are made
scope: Making copies by putting ink on paper, as books and papers are made; printing is another name for
  this sense, not the machine that does the work and not the copy itself.
examples:
- The printing process took all night to finish the books.
- A new printing process made the pictures sharper than before.
