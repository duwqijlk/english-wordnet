simpleMeaning: with young seeds set on the wall along the seam on the belly side of a single seed case
scope: 'Also called marginal placentation: young seeds set on the wall along the seam on the belly side
  of a single seed case, not seeds set at the top of the case and not seeds in a seed case with many rooms.'
examples:
- In this flower, ventral placentation puts the young seeds along the wall of the seed case.
- The botanist noted ventral placentation in the simple ovary.
