simpleMeaning: Bread made from corn, often with no milk or eggs in it, baked or fried, from the south
  of the United States
scope: Corn bread, often made without milk or eggs and baked or fried in the south; pone is another name
  for this sense, not a bread made with milk and eggs.
examples:
- She fried a cornpone to serve with the beans.
- His grandmother baked a cornpone every Sunday.
