simpleMeaning: soil and rock left behind by a glacier, not sorted into layers and made of sand, clay,
  gravel, and large stones mixed together
scope: This is the mixed rock and soil left by a glacier, not the drawer that holds money in a shop and
  not the verb meaning to plough a field.
examples:
- The geologists mapped the till left by the retreating glacier.
- A stony till of clay, sand, and gravel covers much of the valley floor.
