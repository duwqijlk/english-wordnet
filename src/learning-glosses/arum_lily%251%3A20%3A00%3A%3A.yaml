simpleMeaning: Grown in many gardens, this South African lily has a showy pure white leaf-like cup and
  a yellow spike
scope: This lily is also called calla and calla lily, and its showy pure white cup and yellow spike are
  why gardens grow it.
examples:
- The arum lily opened its white cup in the garden.
- She grew an arum lily for its yellow spike.
