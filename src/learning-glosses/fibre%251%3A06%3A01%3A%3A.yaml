simpleMeaning: Layers of paper or cloth pressed together to make a material that is like leather
scope: 'Also called fiber: a material like leather made from pressed paper or cloth, not a thin thread
  for making yarn, not plant food, and not a person''s character.'
examples:
- The old suitcase was made of fibre that looked like leather.
- He cut a sheet of fibre to line the inside of the box.
