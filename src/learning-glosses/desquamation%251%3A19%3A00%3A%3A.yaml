simpleMeaning: The loss of small bits of outer skin as it peels or sheds or comes off in thin flakes
scope: This is the loss of small bits of outer skin as it peels or sheds; peeling and shedding are other
  names for it, not a cut and not the growth of new skin.
examples:
- Desquamation left flakes of skin on his shoulders.
- After the sunburn, desquamation began within a few days.
