simpleMeaning: The larger of the two kinds of spore made by some plants, which grows in the young seed
  into the female egg-making part
scope: The larger of the two spore kinds of some plants; macrospore is another name for this, not the
  smaller spore kind and not the egg-making part itself.
examples:
- The megaspore grows into the female part of the plant.
- Each megaspore holds the start of a new plant.
