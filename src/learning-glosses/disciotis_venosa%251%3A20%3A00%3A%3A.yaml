simpleMeaning: An edible morel shaped like a cup or saucer, up to 20 cm across, with lines inside spreading
  out from the middle; easily mixed up with mushrooms you cannot eat.
scope: An edible cup-shaped morel, also called a cup morel; not a poisonous mushroom and not a morel with
  a cone-shaped top.
examples:
- We found a Disciotis venosa growing under the beech trees.
- The Disciotis venosa in her basket was safe to cook.
