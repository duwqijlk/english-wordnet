simpleMeaning: to put a wall of bushes around a place, or to shut it off as a wall of bushes would
scope: To shut a place off with a wall of bushes, also called hedge, not to fence it with wood or wire
  and not to shut a person inside a room.
examples:
- They hedge in the garden with thick bushes.
- The farmer hedged in the field to keep the sheep safe.
