simpleMeaning: The thinner of the two bones in the human lower leg, on the outer side, between the knee
  and the ankle.
scope: The outer, thinner bone of the human lower leg, also called a calf bone.
examples:
- She broke her fibula in a fall from the ladder.
- The fibula runs down the outside of the lower leg.
