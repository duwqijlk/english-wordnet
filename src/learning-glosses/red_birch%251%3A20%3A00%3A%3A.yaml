simpleMeaning: A tree that grows in wet low land in the east of the United States, with bark the colour
  of rusty brown wood
scope: 'Also called black birch and river birch: a tree of wet low land, not a tree of dry high land and
  not one with pale bark.'
examples:
- The red birch stood at the edge of the swamp.
- We saw a red birch growing beside the river.
