senseId: 'positive_reinforcer%1:09:00::'
synsetId: 05837144-n
simpleMeaning: a thing that comes after an act and makes that act more likely to happen again
scope: This is a thing that follows an act and makes the act more likely again, also called a positive
  reinforcing stimulus, not a thing that stops an act.
examples:
- Praise can be a positive reinforcer that makes a child help again.
- The trainer used food as a positive reinforcer to get the dog to sit again.
