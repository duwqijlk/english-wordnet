simpleMeaning: A strong cloth made of cotton and linen, with a soft short raised surface.
scope: This is a strong cotton and linen cloth with a soft short raised surface; not canvas, which is
  a plain heavy cloth, and not denim.
examples:
- He wore a jacket of fustian to work in the fields.
- Fustian was once a common cloth for hard-wearing clothes.
