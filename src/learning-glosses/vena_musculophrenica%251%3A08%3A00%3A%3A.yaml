senseId: 'vena_musculophrenica%1:08:00::'
synsetId: 05381444-n
simpleMeaning: Blood tubes that drain the upper wall of the belly and the lower spaces between the ribs
  and the belly.
scope: Blood tubes draining the upper belly wall and lower rib spaces; musculophrenic vein is another
  name for this sense; not blood tubes of the chest and not ones of the legs.
examples:
- The vena musculophrenica drains the upper wall of the belly.
- Blood from the vena musculophrenica flows toward the chest.
