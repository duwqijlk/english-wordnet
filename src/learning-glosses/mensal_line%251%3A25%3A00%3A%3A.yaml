simpleMeaning: A crease on the hand that, people who read palms say, shows how you feel deep down
scope: This is a crease on the hand read for how you feel, also called heart line, line of heart and love
  line, not a crease from work and not a line on the face.
examples:
- The palmist traced the mensal line across her hand and said it showed a warm heart.
- He had a deep mensal line, which the reader took as a sign of strong feelings.
