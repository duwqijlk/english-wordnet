simpleMeaning: A shell-less sea animal with a soft body, a small shell inside it, and two pairs of tentacles
  shaped like ears
scope: This is a soft-bodied sea animal with ear-like tentacles, not a sea animal with a hard outer shell;
  sea hare is another name for this sense.
examples:
- Aplysia punctata glides over the rocks at low tide.
- We saw an Aplysia punctata with its two pairs of ear-like tentacles.
