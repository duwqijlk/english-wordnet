simpleMeaning: This big silver fish of warm seas all over the world is nowhere common, and, shaped like
  a whale, it feeds on tiny sea life.
scope: It is not a whale, though it looks like one; it is a big silver fish of warm seas all over the
  world.
examples:
- The louvar swam through the warm sea.
- Fishermen seldom catch a louvar, since it is nowhere common.
