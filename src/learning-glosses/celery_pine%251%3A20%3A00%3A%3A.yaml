simpleMeaning: An evergreen conifer from Australasia with an elegant crown of celery-like foliage, made
  of flattened leaf stalks that grow where small scale-like leaves join the stem.
scope: An Australasian conifer grown for its celery-like foliage; not the vegetable celery or an ordinary
  pine.
examples:
- The celery pine has an elegant crown of foliage that looks like celery leaves.
- A young celery pine stood in the glasshouse corner, its foliage like a bunch of celery.
