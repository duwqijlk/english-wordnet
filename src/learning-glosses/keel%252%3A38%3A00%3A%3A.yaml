simpleMeaning: to walk with steps that look as if you cannot keep them under control
scope: To walk with steps that look out of control; stagger, lurch, reel and careen are other names for
  this sense, not a beam of a boat, and not a ridge on a thing.
examples:
- The drunken man keeled into the room.
- She keeled across the deck in the storm.
