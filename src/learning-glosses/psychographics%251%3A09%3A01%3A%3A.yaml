simpleMeaning: People are sorted into groups by attitudes, values, fears, and other things in the mind,
  in market research or its figures; the word also names what such research finds.
scope: Market research that sorts groups of people by attitudes, values, and fears, not demographics,
  which sorts them by age and birth year; the word also names what such research finds.
examples:
- Psychographics sorts people by their attitudes and fears, not just by age.
- The psychographics from the study showed patterns in what people valued and feared.
