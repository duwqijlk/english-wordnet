simpleMeaning: a short line said or sung by a priest or minister in public worship, with an answer from
  the people
scope: A short line said or sung by a priest or minister in worship, with an answer from the people, not
  a hymn and not a reading from the Bible.
examples:
- The priest sang the versicle and the congregation gave the response.
- Each versicle was followed by the people's answer.
