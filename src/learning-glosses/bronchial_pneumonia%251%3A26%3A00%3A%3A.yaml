simpleMeaning: a lung illness where the walls of the smallest air tubes in the lungs swell up suddenly
scope: This is a lung illness where the walls of the smallest air tubes in the lungs swell up suddenly;
  bronchopneumonia is another name for it, not a common cold and not bronchitis.
examples:
- Bronchial pneumonia kept her in bed for two weeks.
- The child was treated for bronchial pneumonia.
