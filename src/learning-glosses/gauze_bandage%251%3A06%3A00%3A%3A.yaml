simpleMeaning: In medicine, white cotton cloth, bleached and woven in a plain way, is laid over wounds
  to cover and hold them.
scope: Also called gauze, this bleached white cotton cloth, woven plain, is the cloth laid over wounds
  to cover and hold them.
examples:
- She wrapped a gauze bandage round his arm.
- The nurse laid a gauze bandage over the cut.
