senseId: prophylactic%5:00:00:healthful:00
synsetId: 01170813-s
simpleMeaning: Able to stop disease before it starts, or to help stop it.
scope: Also called preventative and preventive, able to stop disease before it starts or to help stop
  it; not a sheath of thin rubber or latex worn during sex, not a remedy that stops an illness from starting
  or slows it down, and not the use for a thing that stops conception.
examples:
- The drug was prophylactic, given to stop the fever before it began.
- Vaccines are prophylactic, keeping illness away.
