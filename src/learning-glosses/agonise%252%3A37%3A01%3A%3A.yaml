senseId: 'agonise%2:37:01::'
synsetId: 01798534-v
simpleMeaning: to make a person suffer great pain in body or mind
scope: Also called agonize, this is making another person suffer great pain in body or mind; it is not
  suffering that pain yourself.
examples:
- The long wait for news agonised him day after day.
- Her son's illness agonised her, and she could not sleep.
