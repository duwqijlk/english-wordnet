simpleMeaning: An upright European bush with blue-black fruit and single flowers.
scope: An upright European bush with blue-black fruit; bilberry, blaeberry and whortleberry are other
  names for this sense, not a tall tree and not a bush with red fruit.
examples:
- We picked whinberries from the bush on the hill.
- The whinberry grows in the hills of Europe.
