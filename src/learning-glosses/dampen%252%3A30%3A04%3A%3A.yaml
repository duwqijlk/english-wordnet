simpleMeaning: to make the back-and-forth swing of a wave smaller, so it moves less far from side to side
scope: To shrink the swing of waves or shaking, not to blur a picture and not to soften a sound.
examples:
- Engineers dampen the waves in the tank before testing.
- Special pads dampen the waves that shake the bridge.
