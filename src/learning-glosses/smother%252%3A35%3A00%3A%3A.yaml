simpleMeaning: To take away the air a person needs, so they cannot breathe.
scope: To take away the air a person needs, so they cannot breathe, also called suffocate, not to hide
  a feeling and not to put out a fire.
examples:
- A cloud of dust smothered the workers in the tunnel.
- She feared the plastic bag would smother the child.
