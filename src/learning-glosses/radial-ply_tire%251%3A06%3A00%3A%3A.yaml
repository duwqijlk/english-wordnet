simpleMeaning: an air-filled ring on a wheel whose threads run straight across it from one side to the
  other
scope: 'Also called a radial and a radial tire: an air-filled wheel ring with threads that run straight
  across it, not a solid rubber ring and not a tire with threads that run at a slant.'
examples:
- The garage fitted a new radial-ply tire on the front wheel.
- A radial-ply tire lasts longer than the old kind on most cars.
