simpleMeaning: in a way that relates to the study of language and how it works
scope: This means in terms of the study of language and how it works. It is not about how well a person
  speaks a language.
examples:
- Linguistically, this old text is important because it shows how the sounds of English changed.
- She studied the speech sounds linguistically, looking at how they are made and used.
