senseId: 'daze%1:12:00::'
synsetId: 07525864-n
simpleMeaning: the upset feeling of not believing it when something bad happens by chance
scope: 'This sense is also called shock and stupor: the upset feeling of not believing it after something
  bad happens by chance. Not general confusion where you cannot think clearly, and not the verb sense
  that means to overcome someone with surprise or disbelief.'
examples:
- His mother's death left him in a daze for days.
- After hearing about the accident, she sat in a daze and said nothing.
