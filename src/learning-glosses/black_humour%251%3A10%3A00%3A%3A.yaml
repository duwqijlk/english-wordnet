simpleMeaning: in writing or plays, grim and comic parts set next to each other to leave a troubling sense
scope: Also called black humor, it is grim and comic parts set together in writing or plays, not writing
  that is only comic and not a plain sad play.
examples:
- The black humour of the film kept us laughing while the story stayed grim.
- Critics praised the black humour in her short stories.
