simpleMeaning: a water plant from Africa, widely grown for show for the ring of thin grass-like leaves
  that spread like a sunshade at the top of each stem
scope: Not the late-blooming plant of Virginia shale barrens; also called umbrella sedge.
examples:
- We keep an umbrella plant in a pot of water by the window.
- The umbrella plant's leaves spread like a sunshade at the top of each stem.
