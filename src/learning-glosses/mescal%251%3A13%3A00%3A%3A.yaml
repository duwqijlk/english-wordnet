simpleMeaning: Juice from certain desert plants of the agave group, above all the century plant, is left
  to go sour and then heated to make this clear Mexican drink
scope: A clear Mexican drink, not the small round cactus that gives mescal buttons.
examples:
- They poured mescal into small glasses.
- Mescal is made from desert plants in Mexico.
