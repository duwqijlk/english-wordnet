simpleMeaning: Chemists count how heavy one atom of a chemical element is, in tiny units made for atoms.
scope: This is the heaviness of one atom, also called atomic weight and relative atomic mass.
examples:
- The atomic mass of carbon is written in the table.
- To weigh one atom, chemists use the atomic mass.
