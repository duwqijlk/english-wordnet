simpleMeaning: People with AIDS, babies, and others whose bodies cannot fight sickness well can come down
  with a sickness of the lungs.
scope: Pneumocystis carinii pneumonia, pneumocytosis and interstitial plasma cell pneumonia are other
  names for this lung sickness of babies and people with weak defences.
examples:
- The doctor said the baby had pneumocystis pneumonia.
- The doctors treated the infant for pneumocystis pneumonia.
