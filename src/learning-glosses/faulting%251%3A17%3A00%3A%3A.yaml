simpleMeaning: In geology, the earth's crust splits when one side moves out of line with the other, leaving
  a crack.
scope: In geology, a crack in the earth's crust made when one side moves out of line with the other, also
  called break, shift, fault, fracture, or a geological fault.
examples:
- The faulting of the earth's crust made a long crack in the valley.
- He studied the faulting of the rocks after the quake.
