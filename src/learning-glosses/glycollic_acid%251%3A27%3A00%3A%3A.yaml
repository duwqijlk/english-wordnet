simpleMeaning: Grapes not yet ripe, sugar cane, and sugar beets hold this chemical, which forms clear
  crystals and lets light through.
scope: Also called glycolic acid or hydroxyacetic acid, this names the chemical in clear crystals that
  lets light through, found in sugar cane, sugar beets, and grapes not yet ripe.
examples:
- Glycollic acid occurs in sugar beets.
- Unripe grapes hold glycollic acid.
