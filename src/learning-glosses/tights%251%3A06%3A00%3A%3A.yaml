simpleMeaning: dancers and acrobats wear this tight knitted leg wear from the waist to the feet, and women
  and girls wear it in place of stockings
scope: Close-fitting knitted leg wear from waist to feet, worn by dancers and acrobats or as stockings,
  not ordinary trousers or socks.
examples:
- The dancer wore black tights under her costume.
- She pulled on her tights before the ballet class.
