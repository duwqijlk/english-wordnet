simpleMeaning: A brown animal of Malaysia with a bare back end fringed with long stiff hairs on both sides
  of its far third.
scope: 'Also called pen-tail and pentail: a brown tree shrew of Malaysia with a bare back end fringed
  with stiff hairs.'
examples:
- The pen-tailed tree shrew lives in Malaysia.
- A pen-tailed tree shrew's bare back end is fringed with long stiff hairs.
