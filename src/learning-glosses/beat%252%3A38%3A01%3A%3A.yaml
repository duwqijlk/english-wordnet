senseId: 'beat%2:38:01::'
synsetId: 01949797-v
simpleMeaning: To sail a boat by tacking often, or to make progress with difficulty.
scope: This is a way of moving a boat under sail, not the noun for the act of sailing close to the wind,
  not rowing or driving a motorboat, not hitting or defeating someone, not making a rhythm by striking
  something, not moving rhythmically or flapping, not stirring food or shaping something, and not striking
  bushes to rouse animals.
examples:
- The sloop beat against the headwind for hours before it reached the harbour.
- With the tide against them, the crew had to beat up the channel, tacking constantly.
