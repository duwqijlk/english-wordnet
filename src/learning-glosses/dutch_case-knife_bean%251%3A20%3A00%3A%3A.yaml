simpleMeaning: A tropical American food plant with red flowers and speckled black seeds, much like the
  common garden kind but living many years; a liked food in Great Britain.
scope: Also called a runner bean, a scarlet runner, a scarlet runner bean, Phaseolus coccineus, or Phaseolus
  multiflorus; a tropical American food plant with red flowers and speckled black seeds, kin to other
  food beans with red flowers.
examples:
- Dutch case-knife bean grows in the garden, its red flowers bright in summer.
- In Great Britain, Dutch case-knife bean is a preferred food bean.
