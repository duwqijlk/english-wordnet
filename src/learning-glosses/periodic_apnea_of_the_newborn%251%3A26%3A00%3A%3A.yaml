simpleMeaning: uneven breathing in very young babies, with times of fast breathing followed by pauses
  in breathing, thought to be linked to the sudden death of babies in their sleep
scope: Uneven breathing in very young babies, with fast breathing and pauses, not the sudden death of
  babies in their sleep itself and not a breathing problem of grown people.
examples:
- The newborn's breathing was uneven, with fast bursts and long pauses.
- The nurse noted periodic apnea of the newborn in the chart.
