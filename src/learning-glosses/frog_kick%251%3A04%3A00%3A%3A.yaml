simpleMeaning: a swimming move in which the knees bend up and out so the legs can come together when fully
  stretched
scope: This is a swimming move with the knees bending up and out and the legs coming together; not a front-crawl
  kick or a kick on land.
examples:
- She used a frog kick to swim slowly across the pool.
- The frog kick is the easiest kick for beginners.
