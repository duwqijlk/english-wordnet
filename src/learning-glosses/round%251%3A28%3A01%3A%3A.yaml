simpleMeaning: a regular period that comes again and again as part of a repeated pattern.
scope: This sense is about a repeated period in a cycle, not about a shape or a stage in a game.
examples:
- Life on the farm follows the round of the seasons.
- Her day was a tired round of meetings and phone calls.
