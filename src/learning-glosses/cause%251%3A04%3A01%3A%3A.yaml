simpleMeaning: an aim or principle that people work together to support.
scope: This is not the reason why something happened, and not the act of making something happen; it is
  a goal people fight for.
examples:
- She has campaigned for years for the cause of clean water.
- They gave money to the cause of protecting wild animals.
