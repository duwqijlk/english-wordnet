senseId: 'outwardness%1:07:00::'
synsetId: 05085830-n
simpleMeaning: The mark of being outside, or turned to the outside.
scope: This sense is also called externality, for the mark of being outside, or turned to the outside,
  unlike the sense for a care for, or answering to, outward things, especially stuff as against ideal
  thoughts, and unlike the sense for care for outward things and stuff, over mind and spirit.
examples:
- Outwardness is the mark of being outside.
- Outwardness turns to the outside.
