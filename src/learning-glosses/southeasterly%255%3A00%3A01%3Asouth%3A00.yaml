senseId: southeasterly%5:00:01:south:00
synsetId: 01608100-s
simpleMeaning: Set in, or turned toward, the southeast.
scope: This sense is also called southeast and southeastern, for being set in, or turned toward, the southeast,
  where southeast is placed in, or facing toward, the corner between south and east, unlike the sense
  for coming from the southeast.
examples:
- The wind was southeasterly, set in the southeast.
- The coast was southeasterly, turned toward the southeast.
