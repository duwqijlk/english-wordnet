simpleMeaning: A group of countries on the Continent, joined after the Second World War to cut trade walls
  and work more closely with each other.
scope: A group of countries on the Continent, also called the European Union, the European Community,
  the European Economic Community, the Common Market, the EEC, the EC, and Europe; not a single country
  and not the United Nations.
examples:
- The EU sets trade rules.
- Britain left the EU.
