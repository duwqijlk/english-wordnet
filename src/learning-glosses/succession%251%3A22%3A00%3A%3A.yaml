senseId: 'succession%1:22:00::'
synsetId: 13584065-n
simpleMeaning: In ecology, the slow, step-by-step change in a living place, as one group of plants and
  animals is slowly replaced by another until it settles into a steady state
scope: The slow, step-by-step change in a living place as one group replaces another; not a change of
  kings or rulers, and not the simple order in which things happen.
examples:
- The succession in the forest took years, as new plants slowly replaced old ones.
- After the fire, succession began as grass grew back first.
