senseId: 'prophesy%2:32:00::'
synsetId: 00928673-v
simpleMeaning: to say what will happen, or to make something known, with words that come from a god, or
  seem to come from a god
scope: This is saying what will happen, or making something known, with words from a god, or words that
  seem to be from a god. Not just a guess or a plain statement of what you think will happen.
examples:
- He prophesied that a great flood would come.
- The old woman prophesied the end of the war.
