simpleMeaning: In the shape of a square, with four straight sides of the same length meeting at right
  angles.
scope: Cut or formed in the shape of a square, also called square, and not set straight and firm in place.
examples:
- She folded the paper squarely and cut along the fold.
- He cut the cloth squarely into four pieces.
