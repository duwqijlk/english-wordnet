simpleMeaning: a sharp, very loud cry from a person
scope: Also called scream, screaming, and screech. This is a sharp cry made by a person, not a very high
  sound made by a thing such as brakes, and not the act of crying out.
examples:
- She gave a shriek when she saw the mouse.
- His shriek of fear woke the whole house.
