simpleMeaning: A Dravidian language closely related to Tamil, spoken in a hilly part of southwestern India.
scope: A language of the Dravidian group, close to Tamil and spoken in the hills of southwestern India;
  also called Irula language, not the Tamil language itself or another Dravidian language.
