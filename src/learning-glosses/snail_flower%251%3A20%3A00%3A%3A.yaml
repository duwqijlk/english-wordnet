simpleMeaning: A long-lived tropical American vine grown for clusters of yellow and purple blooms whose
  lower petal coils like a shell; some botanists place it in the bean genus.
scope: The ornamental tropical vine itself, not the edible bean crop nor the shell its blooms resemble;
  snail bean and snailflower are other spellings of the same plant.
examples:
- The snail flower's yellow and purple blooms hang in long clusters.
- She planted a snail flower by the fence so its coiled petals could be seen.
