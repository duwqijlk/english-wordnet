senseId: collectivist%5:00:00:socialistic:00
synsetId: 00299373-s
simpleMeaning: Holding the belief that the people together should own things, with no one person owning
  them
scope: Describes a person who believes things should be owned by all the people together; collectivized,
  collectivised and collectivistic are other names for this sense, not a belief in owning things alone
  or in a few hands.
examples:
- He is a collectivist who thinks land should belong to all.
- The collectivist argued that the factory should be owned by its workers.
