simpleMeaning: a letter from a church leader to all the people who meet and pray at that church
scope: This is a letter from a church leader to his or her people; it is not music or writing about country
  life, and not the describing word for a church leader's work.
examples:
- The pastor wrote a pastoral to guide his people after the fire.
- She read the pastoral aloud to the people at church on Sunday.
