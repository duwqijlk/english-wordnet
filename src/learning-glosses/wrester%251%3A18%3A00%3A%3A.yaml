senseId: 'wrester%1:18:00::'
synsetId: 10812659-n
simpleMeaning: a person who gets something by pulling it hard with a twisting pull
scope: This is a person who gets something by a hard twisting pull, not a person who asks for it and not
  a person who takes it by force alone.
examples:
- The wrester tore the rope from his hands with a hard twist.
- A wrester gave the stuck drawer a hard twisting pull and got it open.
