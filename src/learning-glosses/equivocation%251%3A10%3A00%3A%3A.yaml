simpleMeaning: a statement whose words are true, but made in a clever way so the speaker does not have
  to say an unpleasant truth
scope: 'Also called evasion: this is a statement that hides the truth without being false, not vague words
  used to make something false, and not just being vague.'
examples:
- His answer was pure equivocation, true in words but hiding what really happened.
- The report was full of equivocation, saying much while avoiding the hard truth.
