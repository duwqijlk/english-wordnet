simpleMeaning: to show someone in public so that others laugh at them and speak badly of them
scope: 'Also called pillory: to show someone in public for others to laugh at and speak badly of, not
  to hang someone to kill them.'
examples:
- The newspaper gibbeted the mayor for his lies.
- He was gibbeted by other workers for cheating them.
