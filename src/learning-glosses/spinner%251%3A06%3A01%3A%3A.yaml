simpleMeaning: a thing used in a board game, with a round face and a pointer that is turned round to choose
  the next move
scope: This is the board game piece with a pointer, not a fishing lure that turns in water and not a person
  who twists thread into yarn.
examples:
- She turned the spinner and moved her piece three spaces.
- The spinner stopped on red, so it was my turn next.
