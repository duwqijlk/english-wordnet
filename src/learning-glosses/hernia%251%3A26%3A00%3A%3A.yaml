simpleMeaning: A split in a smooth muscle wall, letting a part of the body push through it and stick out.
scope: Also called herniation; a split in muscle through which a body part pushes out, not a cut or a
  wound on the skin.
examples:
- The doctor found a hernia in the wall of his stomach.
- A hernia can hurt when the part that pushes out gets pinched.
