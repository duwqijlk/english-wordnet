simpleMeaning: a living thing so small that it can only be seen with a microscope, such as an amoeba or
  paramecium
scope: A living thing so small that it can only be seen with a microscope; animalculum is another name
  for this sense, and it is not a germ that makes people ill and not a tiny insect.
examples:
- Under the microscope, the drop of pond water was full of animalcules.
- The animalcule moved slowly across the slide.
