simpleMeaning: A sword used in fencing, like a foil but with a heavier blade.
scope: A sword used in fencing, like a foil but with a heavier blade, not a foil itself and not a broad
  sword for cutting.
examples:
- He fenced with an epee, which has a heavier blade than a foil.
- The epee touched her arm and scored a point.
