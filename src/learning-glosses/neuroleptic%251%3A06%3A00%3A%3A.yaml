simpleMeaning: A calming drug used to treat a severe mental illness in which a person loses touch with
  reality, when a calming effect is wanted.
scope: This medicine calms a person whose mind is very unwell when calm is wanted; antipsychotic, antipsychotic
  agent, antipsychotic drug, major tranquilizer, neuroleptic agent and neuroleptic drug are other names
  for it, not a drug that puts a person to sleep and not a drug for low mood.
examples:
- The doctor gave him a neuroleptic to calm the voices in his head.
- She takes a neuroleptic each night to keep her mind steady.
