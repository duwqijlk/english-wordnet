simpleMeaning: How a computer program works is shown in this drawing, made with strict rules for what
  follows from what
scope: A drawing of how a program works, also called a logic diagram; not the program itself and not a
  chart of its steps.
examples:
- The logical diagram shows how the program decides what to do next.
- He sketched a logical diagram before writing the code.
