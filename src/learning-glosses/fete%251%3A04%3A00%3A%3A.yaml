simpleMeaning: a set of acts and shows put on in a planned way, usually in one place
scope: Also called festival, this is a planned set of shows, usually in one place; it is not a single
  party and not a single show.
examples:
- The summer fete brought singers and actors to the main square.
- They held a fete with three plays in one hall.
