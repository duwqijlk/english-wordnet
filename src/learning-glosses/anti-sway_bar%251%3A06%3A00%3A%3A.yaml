simpleMeaning: To keep a car or truck's frame steady, a stiff metal rod joins the wheel-holding parts
  at the front and at the back.
scope: Also called stabilizer bar, this is a stiff metal rod that keeps a car's frame steady, not a rod
  that holds the wheels themselves.
examples:
- The anti-sway bar keeps the chassis steady.
- An anti-sway bar links the front suspensions and the rear suspensions.
