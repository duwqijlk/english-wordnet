simpleMeaning: one of the straight edges that form the boundary of a flat shape.
scope: This is not a surface of a solid object or a position in an argument; it is an edge of a flat figure.
examples:
- A square has four equal sides.
- The longest side of the triangle is opposite the largest angle.
