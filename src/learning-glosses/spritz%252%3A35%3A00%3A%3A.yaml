simpleMeaning: to spray liquid onto a place so that the liquid covers all of it or only part of it
scope: This is the action of spraying liquid onto a place; it is not the noun sense, a quick squirt of
  liquid itself, and not soaking a place by pouring.
examples:
- She spritzed the kitchen floor with a little water before mopping.
- They spritzed the lawn lightly, covering only the dry parts.
