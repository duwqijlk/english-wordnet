simpleMeaning: Soaps and wash powders work better with this salt of an acid.
scope: Also called tetrasodium pyrophosphate, this salt is the one put in soaps and wash powders to help
  them clean, not a soap itself and not the acid it comes from.
examples:
- The wash powder had sodium pyrophosphate in it to help the soap clean.
- Sodium pyrophosphate helps the soap in the wash powder work better.
