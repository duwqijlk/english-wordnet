simpleMeaning: a man who takes in and cares for a child who is not his own
scope: A man who takes in and cares for a child who is not his own; foster-father is another name for
  this sense, not the child's birth father and not a man who merely looks after a child for a day.
examples:
- The boy's foster father taught him to ride a bike.
- Her foster father came to every school play.
