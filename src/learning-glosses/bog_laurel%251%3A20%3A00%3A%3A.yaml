simpleMeaning: With small purple flowers and pale leaves that are grey-green below, this laurel grows
  in the wet lands of the northwestern United States.
scope: With small purple flowers and pale leaves, this laurel of the wet lands of the northwestern United
  States is also called bog kalmia and swamp laurel, not a laurel of dry ground and not one with large
  flowers.
examples:
- Bog laurel grows in the wet lands of the northwestern United States.
- The bog laurel has small purple flowers and pale leaves that are grey-green below.
