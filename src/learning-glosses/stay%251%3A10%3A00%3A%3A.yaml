simpleMeaning: a judge's ruling that blocks an action until an event takes place or the ruling is cancelled
scope: A court order blocking an action, not a period of remaining in a place, a strip stiffening a garment,
  or a rope supporting a ship's mast.
examples:
- The judge granted a stay of execution.
- The company asked the court for a stay while it appealed.
