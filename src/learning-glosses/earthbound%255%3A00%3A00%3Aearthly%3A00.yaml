simpleMeaning: kept on the earth and not able to leave it
scope: Staying on the earth, not going away from it. It is not the sense that means dull or without new
  ideas.
examples:
- Most earthbound animals live their whole lives on this planet.
- He dreamed of space travel but stayed earthbound all his life.
