simpleMeaning: to hold back the punishment of a person found guilty and let them stay free for a set time
  while they are watched
scope: This verb sense is about holding back punishment for a person found guilty; it is not about proving
  a will in court.
examples:
- The judge probated the young man for two years.
- She was probated instead of being sent to prison.
