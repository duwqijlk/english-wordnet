simpleMeaning: A machine for making copies, with a plate of jelly from which ink is taken to print each
  copy.
scope: A machine for making copies from a plate of jelly and ink, also called heliotype; not a modern
  photocopier and not a printing press.
examples:
- The teacher ran off copies on the hectograph before class.
- A hectograph uses a plate of jelly and ink to make copies.
