simpleMeaning: a large room where military personnel take meals and relax
scope: The dining room itself; mess hall is another name for this same sense, not the meal served there
  and not a state of confusion and disorder.
examples:
- The new mess was twice the size of the old one and had better food.
- Officers and enlisted troops used different messes on the post.
