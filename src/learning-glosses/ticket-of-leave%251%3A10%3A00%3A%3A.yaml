simpleMeaning: a paper given in the past to prisoners that let them go out of prison if they kept to set
  rules
scope: This is a paper that let a prisoner go out of prison if they kept to set rules; not a pardon, and
  not a free pass with no rules.
examples:
- He was given a ticket-of-leave after ten years in prison.
- Under the ticket-of-leave, she had to report to the police each week.
