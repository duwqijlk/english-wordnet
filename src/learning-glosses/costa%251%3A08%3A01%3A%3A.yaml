senseId: 'costa%1:08:01::'
synsetId: 05286525-n
simpleMeaning: Any of the 12 pairs of bent bone arches reaching from the spine to or toward the breastbone
  in folk, and like bones in most beasts with backbones.
scope: This sense is also called rib, any of the 12 pairs of bent bone arches reaching from the spine
  to or toward the breastbone in folk, and like bones in most beasts with backbones, where rib is a bent
  bone, a dozen pairs in all, from the spine toward the breastbone in folk and most beasts with backbones,
  unlike the sense for a riblike part of a plant or animal, such as a middle rib of a leaf or a thickened
  vein of an insect wing.
examples:
- Costae arch from the spine to the breastbone.
- The costa is a bent bone arch.
