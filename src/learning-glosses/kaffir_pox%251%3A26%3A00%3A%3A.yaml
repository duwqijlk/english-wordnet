senseId: 'kaffir_pox%1:26:00::'
synsetId: 14148170-n
simpleMeaning: A mild form of variola, the illness that covers the skin in spots, caused by a weaker form
  of the germ that causes it
scope: This is a mild form of smallpox caused by a weaker form of the virus; alastrim, milk pox, pseudosmallpox,
  pseudovariola, variola minor, white pox, Cuban itch and West Indian smallpox are other names for it,
  not a severe case of smallpox.
examples:
- Kaffir pox gave him only a few spots and a light fever.
- The doctor said the Kaffir pox was a mild form of the illness.
