simpleMeaning: A tool for looking at far-away things that bends light through glass, no longer used by
  people who study the stars.
scope: A kind of tool for looking at the sky, no longer used; not a tool that uses mirrors, and not one
  of the moons of Jupiter.
examples:
- He looked through the old Galilean telescope at the moon.
- The Galilean telescope in the display case is no longer used by people who study the stars.
