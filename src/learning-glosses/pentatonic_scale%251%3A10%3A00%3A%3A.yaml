simpleMeaning: Five notes with gaps between them, usually leaving out the fourth and seventh notes of
  the usual seven notes
scope: 'Also called a pentatone: a set of five notes with gaps, not a full seven-note set and not a set
  with no gaps.'
examples:
- The pentatonic scale has only five notes.
- He sang the pentatonic scale without the fourth note.
