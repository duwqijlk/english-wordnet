simpleMeaning: A way of thinking in politics or religion that keeps the best of what a society has and
  stands against sweeping change
scope: A way of thinking that keeps the best of society and stands against sweeping change, also called
  conservatism, not a wish to change everything and not a love of the past for its own sake.
examples:
- His conservativism made him wary of sweeping change.
- Conservativism shaped the party's platform.
