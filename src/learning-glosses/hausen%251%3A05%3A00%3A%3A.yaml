simpleMeaning: A fish prized as a source of caviar and of a clear jelly from fish, found in the Black
  and Caspian seas
scope: A fish prized as a source of caviar and of a clear jelly from fish, found in the Black and Caspian
  seas, not another sturgeon and not a common food fish; beluga is another name for this sense.
examples:
- The hausen is fished for its caviar.
- Hausen live in the Black and Caspian seas.
