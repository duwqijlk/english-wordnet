simpleMeaning: the part of a fish or other water animal that takes in the gas held in the water so it
  can breathe
scope: The breathing part of a fish or other water animal, not the plates under a mushroom cap and not
  a British measure of liquid.
examples:
- The fish opened and closed its gills as it swam.
- Water flows over the gills so the fish can breathe.
