senseId: 'impairment%1:04:01::'
synsetId: 00273722-n
simpleMeaning: the act of making something have no use and no good result, as when it is done the same
  way day after day
scope: Also called constipation and deadening in this use. This is the act of making something have no
  use, not the state of being unable to do things because the body or mind is not fit.
examples:
- The impairment of the class came from doing the same work in the same way every day, until the lessons
  had no use and taught nothing.
- The impairment of the game came from playing it the same way every day until it had no fun left.
