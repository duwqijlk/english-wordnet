simpleMeaning: A flat panel of material that electricity cannot pass through, holding switches, dials,
  and meters that control other electrical equipment.
scope: This sense is a panel of switches and meters for controlling electrical equipment, not a flat piece
  of wood used in a game or a circuit card inside a computer.
examples:
- The engineer checked the board, reading the dials and flipping switches one by one.
- A red light on the control board warned that the pump had stopped.
