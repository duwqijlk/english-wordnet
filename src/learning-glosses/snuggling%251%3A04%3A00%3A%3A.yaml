simpleMeaning: loving play between people, or such play before sex, with no touch of the sex parts of
  the body
scope: 'Also called kissing, hugging, petting, caressing, cuddling, fondling, smooching and necking: loving
  play with no touch of the sex parts, not sex itself.'
examples:
- They spent a long time snuggling, touching each other in a loving way but not touching each other's
  sex parts.
- Snuggling was as far as they went that night, with soft, loving play and nothing more.
