simpleMeaning: A gland at the base of the brain gives out a body chemical faster when a substance made
  in a small part of the brain acts on it
scope: This is a substance from a small part of the brain that speeds up a gland giving out a body chemical,
  also called releasing factor, not the body chemical itself.
examples:
- A releasing hormone from the brain speeds up the gland's work.
- The releasing hormone made the gland give out more of the body chemical.
