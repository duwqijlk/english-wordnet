simpleMeaning: The state of moving from place to place, with no fixed home and no way of earning a living.
scope: Of a person with no fixed home, moving from place to place after losing work and home.
examples:
- The town passed a law against vagrancy in the winter months.
- After losing his job and his home, he fell into vagrancy.
