simpleMeaning: a noise that comes out thin and high, as from a mouse, or from a hinge with rust on it
scope: 'Also called squeaking and squealing: a thin, high sound, not a low, deep sound and not a loud
  crash.'
examples:
- The squeaky gate woke the baby every time it moved.
- Her squeaky voice rose higher when she got excited.
