simpleMeaning: to make a person or animal stand still, held by a fixed look or by fear or wonder
scope: 'Also called grip: to hold a person or animal still with a fixed look or with fear or wonder, not
  to charm them in a pleasant way.'
examples:
- The snake charmer fascinates the cobra.
- The loud crash fascinated the deer, and it stood still in the road.
