simpleMeaning: A tool that sends a burst of sound through water and works out how far away things are
  from the time the sound takes to come back.
scope: People also call it sonar and asdic; the names mark a tool that finds how far away things under
  water are by timing a burst of sound and its return.
examples:
- The echo sounder sent a burst of sound through the water.
- The crew used the echo sounder to work out how deep the water was.
