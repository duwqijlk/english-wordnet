simpleMeaning: A small cone-shaped pouch that sticks out from the front top part of each upper chamber
  of the heart
scope: This is a small cone-shaped pouch at the front top of each upper chamber of the heart; auricle
  and auricula atrii are other names for it, not the lower pumping chamber and not the main wall of the
  heart.
examples:
- The atrial auricle sticks out from the upper chamber of the heart.
- Each atrial auricle is a small pouch at the front of the heart.
