simpleMeaning: In chemistry, a substance that helps a reaction start but is not the substance that speeds
  the reaction up
scope: A substance that helps a chemical change start, also called a sensitiser; not the catalyst itself,
  and not a substance that only speeds the change once it has started.
examples:
- The lab added a sensitizer to start the reaction.
- The sensitizer was added first so the reaction could begin.
