simpleMeaning: Wood that is hard and lasts a long time comes from this tree of warm America, and it is
  much prized
scope: 'Also called lancewood tree: a tree of warm America prized for its hard, lasting wood, not a softwood
  tree and not a tree grown for fruit.'
examples:
- The carpenter chose laurelwood for the table top.
- Laurelwood grows in the warm forests of South America.
