simpleMeaning: To do with the native peoples of the Americas, the way they live, or the ways they speak
scope: 'Also called Amerind, Indian and Native American: used for the native peoples of the Americas,
  their way of life or their ways of speaking, not for people who came from Europe later.'
examples:
- Amerindic art shows the old ways of the people.
- The museum has a fine Amerindic basket.
