senseId: 'notice%1:09:00::'
synsetId: 05711376-n
simpleMeaning: the act of paying attention to something or of becoming aware of it.
scope: This is not a written or printed announcement, and not a warning given in advance; it is the act
  of paying attention or becoming aware.
examples:
- The change in his mood did not escape her notice.
- She took no notice of the warning sign.
