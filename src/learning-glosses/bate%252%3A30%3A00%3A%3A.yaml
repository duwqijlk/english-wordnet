simpleMeaning: To leave something in a special liquid so it gets softer and chemicals left from earlier
  treatment are taken out
scope: This is about leaving something in a special liquid to soften it, not about a falcon beating its
  wings wildly and not about holding back or making something weaker.
examples:
- They bated the hides to make them softer.
- The skins were bated before the next stage of work.
