simpleMeaning: A set of rail cars used most of all by people who go back and forth between two places
  day after day
scope: A set of rail cars used most of all by people who go back and forth between two places day after
  day; commuter is another name for this sense, not a long-distance express and not a goods train.
examples:
- The commuter train was full of people going to work.
- She catches the commuter train at seven each morning.
