simpleMeaning: In surgery, drawing fluid out of a hollow space or organ in the body by piercing it with
  a hollow needle.
scope: Doctors call this the act of piercing a body space with a hollow needle to draw fluid out.
examples:
- The doctor ordered a centesis to draw the fluid out.
- A centesis was done with a hollow needle.
