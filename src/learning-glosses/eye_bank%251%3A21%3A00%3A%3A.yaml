simpleMeaning: A store that keeps corneas taken from people just after death, so they can be given to
  patients whose own corneas are damaged.
scope: A store of corneas for transplant, not a store of blood or organs for general use.
examples:
- The eye bank stored the corneas until a patient needed one.
- After his death, his family gave his corneas to the eye bank.
