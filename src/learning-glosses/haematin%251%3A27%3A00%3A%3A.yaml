scope: This is a red colouring stuff, made of iron and other tiny bits, to which oxygen sticks; haem,
  hematin, heme and protoheme are other names for this sense, not the red cells themselves and not iron
  on its own.
examples:
- Haematin is the red pigment that carries oxygen in blood.
- The sample showed haematin in the red cells.
