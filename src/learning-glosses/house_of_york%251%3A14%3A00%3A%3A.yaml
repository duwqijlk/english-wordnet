simpleMeaning: The English royal line, a branch of the Plantagenet line, that ruled from 1461 to 1485,
  with a white rose as its mark.
scope: 'Also called York: the English royal line that ruled from 1461 to 1485, not the royal line of Lancaster
  and not a later royal line.'
examples:
- The House of York ruled England in the 1400s.
- A white rose was the mark of the House of York.
