simpleMeaning: A picture that shows how certain amounts relate to each other, with points set out against
  a set of marked lines
scope: This picture of amounts is also called graph and graphical recording, and is not a written list
  of facts and not a plain drawing.
examples:
- The graphical record showed how sales changed over the year.
- She drew a graphical record of the test results.
