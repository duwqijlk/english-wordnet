senseId: 'saturate%2:30:01::'
synsetId: 00457312-v
simpleMeaning: to make a chemical, a vapour, a liquid, or a magnetic thing take in as much of another
  thing as it can hold
scope: To make a thing take in as much of another thing as it can hold; not to wet a cloth through and
  not to fill a room with people.
examples:
- The chemist saturated the solution with salt until no more salt would dissolve.
- They saturated the compound with hydrogen until it could take in no more.
