scope: A gas that cools and pushes out sprays, taking over from an older gas, not the older gas itself
  and not a gas that harms the air more.
examples:
- The new hydrochlorofluorocarbon replaced the older gas in the fridge.
- Hydrochlorofluorocarbon is used in spray cans as well as in cooling systems.
