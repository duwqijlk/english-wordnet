simpleMeaning: An unpleasant lack of grace in how one stands, looks, moves, or shows feeling.
scope: An unpleasant lack of grace in how one stands, looks, moves, or shows feeling; not the stiffness
  of someone tense and unrelaxed, as from embarrassment.
examples:
- Her gracelessness showed in every awkward step she took.
- The dancer's gracelessness surprised those who knew her.
