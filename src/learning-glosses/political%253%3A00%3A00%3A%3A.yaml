simpleMeaning: about government and public affairs, especially the competition between parties and the
  people who lead them.
scope: It is not about the profession or career of governing; it is about public life, party competition
  and the people involved.
examples:
- The debate turned into a political argument between the two parties.
- She has strong political views about taxes and health care.
