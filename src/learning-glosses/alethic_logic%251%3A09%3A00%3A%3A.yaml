simpleMeaning: The kind of reasoning about what must be true, what may be true, and what merely happens
  to be true.
scope: The study of what must be, may be, or happens to be true; not the rules of maths and not the rules
  of clear speech.
examples:
- In alethic logic, 'must' and 'may' have exact meanings.
- Alethic logic asks what could have been otherwise.
