simpleMeaning: being clever at tricking people, shown by making others believe what is not true
scope: 'Also called craft, craftiness, cunning, guile and slyness: cleverness shown in tricking people,
  not plain cleverness and not honest skill.'
examples:
- His foxiness showed in the way he hid his true plan.
- She used foxiness to get past the guards.
