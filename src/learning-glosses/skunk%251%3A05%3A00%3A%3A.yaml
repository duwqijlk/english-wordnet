simpleMeaning: An American mammal of the weasel family that usually sprays a very foul-smelling fluid
  when startled; some classifications place it in its own subfamily, Mephitinae.
scope: Another name for the American polecat, not a raccoon or the European polecat.
examples:
- A skunk sprayed the dog when it came too close.
- The skunk is an American mammal of the weasel family.
