simpleMeaning: A small slow-growing leaf-shedding shrubby tree of dry sandy wastes of the south-east United
  States, its leaves with bristle-tipped lobes like a turkey's toes.
scope: This sense is a small slow-growing leaf-shedding shrubby tree of dry sandy wastes of the south-east
  United States, its leaves with bristle-tipped lobes like a turkey's toes, unlike the sense for a large
  leaf-shedding tree of middle and south Europe and Asia Minor with spear-shaped leaves with spiked lobes,
  and unlike the sense for a small half-evergreen shrubby tree of the south-east United States with hairy
  young shoots and leaves narrowing to a slim bristly point.
examples:
- A turkey oak grew in the barrens.
- Turkey oaks bear bristle-tipped leaves.
