simpleMeaning: an officer on a ship who is in charge of food and drink stores and of meals
scope: A ship officer in charge of food stores and meals, not a worker chosen to speak for other workers
  in a union.
examples:
- The steward brought dinner to the people travelling on the ship.
- Ask the steward if there is enough food stored for the trip.
