simpleMeaning: a kind of fat with long carbon chains that have many double links and too few hydrogen
  atoms, used in some margarines and thought to go with low blood cholesterol
scope: A kind of fat with many double links, not a fat with no double links, one with a single double
  link, or a fat changed by heating.
examples:
- Polyunsaturated fat is in the oil I use for cooking.
- The label says this spread has polyunsaturated fat in it.
