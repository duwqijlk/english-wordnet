senseId: 'guiltless%3:00:00::'
synsetId: 01322826-a
simpleMeaning: not to blame for doing wrong, and not evil in any way
scope: This sense says a person has done no wrong and is not evil; it is not about the bad feeling a person
  has after doing wrong.
examples:
- The court found him guiltless and let him go home.
- She lived a guiltless life and harmed no one.
