simpleMeaning: this worker puts zinc over iron or steel, and does it with skill learned in the trade
scope: Also called a galvanizer, this is a worker who coats metal, not a person who makes steel and not
  a person who sells metal goods.
examples:
- The galvaniser dipped the steel sheets in molten zinc.
- As a galvaniser, he spent his days coating iron parts with zinc.
