simpleMeaning: A care for, or answering to, outward things, especially stuff as against ideal thoughts.
scope: A care for, or answering to, outward things, especially stuff as against ideal thoughts; not the
  quality or state of being outside, or turned to, or to do with, the outside or the outer face, nor a
  care for outward things or stuff as against the mind and spirit.
examples:
- Their outwardness showed at dawn.
- The outwardness was plain in the test.
