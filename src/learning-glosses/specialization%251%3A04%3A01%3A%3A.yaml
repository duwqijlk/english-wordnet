simpleMeaning: The work of fitting a thing for one special purpose.
scope: The work of fitting a thing for one special purpose, not the change of a body part in living things
  and not a line of work taken up as a career.
examples:
- The specialization of the tool for cutting glass took months.
- Specialization of the workshop for one kind of work raised its output.
