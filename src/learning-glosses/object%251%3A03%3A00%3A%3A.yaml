simpleMeaning: A physical thing that can be seen and touched, and that throws a shadow when light falls
  on it.
scope: The physical thing you can see and touch ('physical object' is another name), not the computing
  item, the grammar part or the act of protesting.
examples:
- The table was covered with objects of every size and shape.
- A shadow can only fall where some solid object stands in the light.
