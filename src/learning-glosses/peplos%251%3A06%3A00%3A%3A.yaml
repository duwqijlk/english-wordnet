simpleMeaning: Hanging in folds down to the waist and fastened at the shoulders, it is a piece of clothing
  worn by women in ancient Greece.
scope: Also called peplum and peplus, it is the piece of clothing worn by women in ancient Greece, fastened
  at the shoulders and hanging in folds down to the waist.
examples:
- The peplos hung in folds to her waist.
- She wore a peplos fastened at the shoulders.
