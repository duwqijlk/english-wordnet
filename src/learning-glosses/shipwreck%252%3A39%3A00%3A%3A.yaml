simpleMeaning: to cause a ship to be destroyed or left unable to sail at sea or on the shore
scope: Causing a ship to be destroyed or left unable to sail. This is the act that causes it, not the
  event itself and not what is left of a ship after it is destroyed.
examples:
- The storm shipwrecked the fishing boat off the coast.
- Pirates shipwrecked his ship on the rocks.
