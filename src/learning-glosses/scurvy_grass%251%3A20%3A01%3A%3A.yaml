simpleMeaning: a cress of the far north, found in many places and said to help cure or stop the gum and
  tooth sickness, and full of vitamin C
scope: Also called common scurvy grass; an Arctic cress valued against scurvy, not the yellow-flowered
  Eurasian cress grown for winter salad.
examples:
- Scurvy grass grows all over the Arctic.
- Sailors once ate scurvy grass to keep their gums strong.
