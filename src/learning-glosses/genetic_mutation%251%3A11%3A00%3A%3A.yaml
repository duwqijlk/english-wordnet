simpleMeaning: Any change in the chain of units a living thing inherits from its parents counts as one
  of these events.
scope: Also called mutation and chromosomal mutation, this is any change in what is passed down, not the
  passing down itself or a trait that stays the same.
examples:
- A genetic mutation can change the colour of a flower.
- The genetic mutation was passed from the mother to her child.
