simpleMeaning: at the two far ends of a thing, fully against each other in every way
scope: This is about things at the two far ends and fully against each other; diametrical, opposite and
  polar are other names for this sense, not things that differ only a little.
examples:
- The two sides held diametric views on the plan.
- His diametric claim went against everything she had said.
