simpleMeaning: a recording of moving pictures and sound, stored on magnetic tape
scope: This is the recording itself; not the wide magnetic tape it is stored on, and not the act of recording
  something.
examples:
- We watched an old videotape of my parents' wedding day.
- The videotape of the game shows every goal from start to finish.
