simpleMeaning: a person who says that something is true, right, or real
scope: 'Also called attester: a person who says something is true or real, not a person who signs a paper
  to show it is real.'
examples:
- An attestant at the meeting said the record was a true account.
- The attestant told the court that the signature was real.
