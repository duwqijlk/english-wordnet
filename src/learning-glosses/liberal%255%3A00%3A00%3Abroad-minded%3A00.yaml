simpleMeaning: Willing to accept and respect views and ways of life different from your own.
scope: This describes a person's willingness to accept differences, not a political or economic position.
examples:
- My parents were liberal about what I read and never censored my books.
- She takes a liberal view of other people's lifestyles.
