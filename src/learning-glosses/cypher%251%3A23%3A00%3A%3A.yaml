simpleMeaning: A sum of no worth; not a single thing, and nothing that counts.
scope: A sum of no worth; not a single thing, and nothing that counts; also called nothing, zero, zip,
  naught, aught, nil, cipher, nix, nada, null, zilch, goose egg, or zippo; not a number that, added to
  another, leaves it unchanged, nor to work out sums.
examples:
- Their cypher meant nothing at all.
- The cypher added up to nil.
