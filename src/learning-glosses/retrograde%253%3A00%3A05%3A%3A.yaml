senseId: 'retrograde%3:00:05::'
synsetId: 00773673-a
simpleMeaning: Moving from east to west on the sky ball, or, for wanderers, round the sun the wrong way
  to the Earth.
scope: Moving from east to west on the sky ball, or, for wanderers, round the sun the wrong way to the
  Earth; not of loss of mind, touching the time just before a hurt, nor moving or set or tending back,
  or against an old way, nor to move back in a ring, of sky bodies.
examples:
- Their path was retrograde at dawn.
- The course was retrograde by nature.
