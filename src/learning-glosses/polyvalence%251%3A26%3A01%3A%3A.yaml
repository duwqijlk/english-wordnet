simpleMeaning: In toxicology, the power to work against more than one poison, germ, or thing that sets
  off the body's defences
scope: In toxicology, the power to work against more than one poison, germ, or thing that sets off the
  body's defences; polyvalency is another name for this sense, not the power to work against one poison
  only and not the poison itself.
examples:
- The serum showed polyvalence against three poisons.
- Polyvalence lets one dose fight several germs.
