simpleMeaning: that can be seen with a microscope, or that uses a microscope
scope: Also called microscopical. This is about being seen with a microscope or using one, not about being
  so small that the eye cannot see it at all.
examples:
- The microscopic spots on the slide could only be seen with a microscope.
- Their microscopic study of the insect used a strong microscope.
