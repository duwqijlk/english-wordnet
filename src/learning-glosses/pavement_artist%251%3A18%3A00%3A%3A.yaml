simpleMeaning: A person who draws on the walkway with colored chalks, hoping that people who pass by will
  give money
scope: A person who draws on the walkway with colored chalks, hoping that people who pass by will give
  money, not a painter of walls and not a player of music.
examples:
- A pavement artist drew the queen's face outside the station.
- The pavement artist hoped for coins from the crowd.
