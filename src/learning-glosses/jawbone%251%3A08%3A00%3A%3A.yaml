simpleMeaning: the bone in animals with a backbone that is joined to the head so the mouth can open and
  shut
scope: The moving mouth bone in animals with a backbone, also called jowl and mandible; not the verb sense
  of talking in a friendly way.
examples:
- The dog broke its jawbone when it fell.
- Doctors fixed the child's jawbone after the accident.
