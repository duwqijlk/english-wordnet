simpleMeaning: A wasting state of the body, worst in children, in which too little food, or food the body
  cannot take in or use, leaves a person skin and bone.
scope: It names the wasted state itself, not the want of food that brings it on.
examples:
- Marasmus wasted the child to skin and bone when food ran short.
- Marasmus wasted him to skin and bone because his body could not take in the food he ate.
