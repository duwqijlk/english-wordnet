simpleMeaning: in favour of changes that make laws or the way a place is run better, often through action
  by the government
scope: Also called progressive. This describes ideas or actions that support change, often by the government;
  it is not the person who argues for change.
examples:
- The party took a reformist path and changed the tax laws.
- Her reformist ideas led the government to build more homes for poor people.
