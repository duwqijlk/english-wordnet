simpleMeaning: a thing that can cause danger, or the chance of losing something or having bad luck
scope: 'Also called risk, peril, hazard and endangerment: a thing that can cause danger or a chance of
  loss, not harm that has already happened.'
examples:
- The factory closure put hundreds of jobs in jeopardy.
- Drinking and driving puts other people's lives in jeopardy.
