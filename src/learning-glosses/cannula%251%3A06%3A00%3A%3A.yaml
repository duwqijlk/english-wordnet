simpleMeaning: A small, bendable tube put into a hollow place in the body to drain off fluid or to put
  medicine in.
scope: A small, bendable tube put into the body to drain fluid or put medicine in, not a needle for taking
  blood.
examples:
- The nurse slipped a cannula into the vein.
- A cannula drained fluid from the wound.
