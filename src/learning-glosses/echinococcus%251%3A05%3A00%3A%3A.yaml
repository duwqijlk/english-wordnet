simpleMeaning: a kind of tapeworm whose young live inside people and animals kept by people and get food
  from them
scope: A tapeworm whose young live inside people and animals kept by people, not a tapeworm whose young
  live free in soil and not the sickness the young cause.
examples:
- The echinococcus is a tapeworm that lives in dogs, and its young can grow inside sheep.
- A child can pick up echinococcus from a dog that carries the worm.
