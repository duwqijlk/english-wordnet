simpleMeaning: Through the north and south poles runs an imagined great circle on the earth, crossing
  the equator at right angles.
scope: Also called a line of longitude, an imagined great circle on the earth running through the north
  and south poles at right angles to the equator.
examples:
- The town lies on the same meridian as the capital.
- The ship crossed the meridian at noon.
