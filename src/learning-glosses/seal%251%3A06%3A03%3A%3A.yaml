simpleMeaning: a last coat put on a surface to keep water out
scope: A last layer put on a surface to keep water out. Not the substance for closing letters, not a tool
  or mark for papers, and not the sea animal.
examples:
- He put a clear seal over the wood to keep the rain out.
- Add a seal to the floor before you use the room, so water cannot get in.
