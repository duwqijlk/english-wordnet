simpleMeaning: a very bad sin that takes away God's grace and cuts a person off from God in spirit
scope: Also called mortal, a very bad sin that takes away God's grace, not a poison that can harm the
  body and not just able to kill.
examples:
- The priest spoke of the seven deadly sins and warned people to turn from them.
- He feared that his deadly sin had cut him off from God's grace.
