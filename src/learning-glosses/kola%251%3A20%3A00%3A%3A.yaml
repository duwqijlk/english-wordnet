simpleMeaning: Its large brown nuts hold such things as caffeine, and cola drinks get their flavour from
  this tree.
scope: Also called goora nut, kola nut and kola nut tree, it is the tree whose nuts give cola drinks their
  flavour.
examples:
- The kola tree dropped its large brown nuts.
- Kola nuts give cola drinks their flavour.
