senseId: 'enabling_act%1:10:00::'
synsetId: 06577192-n
simpleMeaning: The right officials get the power to put a law into force from this part of the law
scope: 'Also called enabling clause: the right officials get the power to put a law into force from this
  part of the law, not the law itself and not a court order.'
examples:
- The enabling act gave the minister power to enforce the new law.
- Under the enabling act, officials could put the rules into force.
