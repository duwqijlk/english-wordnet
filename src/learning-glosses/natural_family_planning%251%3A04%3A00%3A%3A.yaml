simpleMeaning: any of several ways to time births without surgery to stop them, birth-control tools, or
  birth-control drugs; a couple has no sex when a woman can get pregnant
scope: A way to plan births that uses no surgery, tools, or drugs, and avoids sex on the days when a woman
  can get pregnant; not a birth-control drug and not sterilization.
examples:
- They chose natural family planning because they wanted no drugs or surgery.
- Natural family planning means keeping track of the days when a woman can get pregnant.
