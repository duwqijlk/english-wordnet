simpleMeaning: a drug called Plavix that thins the blood after a mild heart attack, stopping tiny blood
  parts from sticking together to form clots that slow the flow of blood
scope: A blood thinner taken after a mild heart attack, not a drug that breaks up a clot already formed
  and not a painkiller for the chest.
examples:
- The doctor gave him clopidogrel bisulfate after his mild heart attack.
- She takes clopidogrel bisulfate each morning to keep her blood thin.
