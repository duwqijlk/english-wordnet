simpleMeaning: dried out by heat or by too much sun
scope: Also called baked, parched, scorched and sunbaked; it is about ground or land made dry by heat
  or sun, not about something wet or only briefly dry.
examples:
- The adust fields cracked under the summer sun.
- After weeks without rain, the adust earth was hard as stone.
