simpleMeaning: A high amount of a protein made by the unborn baby in the womb can point to a fault in
  the baby's nerve tube, such as spina bifida or anencephaly.
scope: 'A test result: a high amount of a protein made by the unborn baby, also called alpha fetoprotein
  and alpha foetoprotein; its nearest kin are other blood tests of the unborn baby.'
examples:
- The AFP result was high, so the doctor ordered more tests.
- A high AFP can point to a fault in the baby's nerve tube.
