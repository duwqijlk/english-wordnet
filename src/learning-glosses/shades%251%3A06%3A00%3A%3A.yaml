simpleMeaning: glasses with lenses that are dark, or made in a special way to cut strong light, worn to
  keep the sun's bright light out of the eyes
scope: 'Also called sunglasses: dark glasses worn against the sun''s bright light, not a shadow and not
  a small difference in colour.'
examples:
- He wore his shades on the bright beach.
- She bought a new pair of shades to wear in the sun.
