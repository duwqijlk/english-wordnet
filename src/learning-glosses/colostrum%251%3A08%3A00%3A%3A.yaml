simpleMeaning: the milky fluid a mother gives out in the first day or two after giving birth
scope: This is the milky fluid a mother gives out just after birth, also called foremilk; not the milk
  that comes later and not blood.
examples:
- The newborn calf drank the colostrum its mother gave in the first hours after birth.
- The colostrum came in the first day after the baby was born.
