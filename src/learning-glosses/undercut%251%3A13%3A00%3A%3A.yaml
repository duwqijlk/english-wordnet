simpleMeaning: the soft meat from the loin muscle (the muscle of the lower back), on each side of the
  backbone
scope: Also called tenderloin, this is meat from along the back, not a cut made under something, not a
  sports stroke, and not a notch in a tree.
examples:
- The butcher sold the undercut as a soft, good piece of meat.
- She cooked slices of undercut taken from beside the backbone.
