simpleMeaning: a European plant that lives one year, often found as a weed on waste ground, most of all
  along roads and hedges
scope: A short-lived European weed of waste ground, not the barley crop and not a lawn grass.
examples:
- Barley grass grows along the hedgerow by the road.
- The field edge was thick with barley grass.
