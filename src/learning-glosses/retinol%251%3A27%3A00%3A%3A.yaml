simpleMeaning: Living things make this kind of alcohol from carotene, the orange plant stuff; it is not
  full of hydrogen and turns up in the oils of sea fish livers.
scope: A kind of alcohol found in the oils of sea fish livers, made by living things from carotene.
examples:
- Retinol is found in the liver oils of sea fish.
- The body makes retinol from carotene.
