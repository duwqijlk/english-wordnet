simpleMeaning: a badge in the shape of a V, worn on the sleeve of a uniform, that shows a soldier's rank
  and time in service
scope: 'Also called stripe, stripes, and grade insignia: a V-shaped badge on a uniform sleeve that shows
  rank and service, not a V shape used as a mark on a shield.'
examples:
- The sergeant wore three chevrons on his sleeve.
- She earned her first chevron after two years of service.
