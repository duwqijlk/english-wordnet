simpleMeaning: not able to be made to fit together or agree with each other
scope: This describes things that cannot fit together or agree with each other, not things that just change
  from time to time.
examples:
- Their two inconsistent accounts could never be made to agree.
- He gave inconsistent stories that could not both be true.
