simpleMeaning: In golf, a score on one hole that is two hits less than par (the set number of hits for
  that hole)
scope: In golf, a score two hits below par on one hole, not the large bird that hunts other animals.
examples:
- He made an eagle on the last hole, finishing two hits under par.
- Her eagle on the ninth hole helped her win the game.
