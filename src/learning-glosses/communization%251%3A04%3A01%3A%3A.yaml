simpleMeaning: A shift in which things held in private hands pass into the hands of the whole community.
scope: 'Also called communisation: a shift from things held in private hands to things owned by the whole
  community, not the setting up of a whole country on shared ownership.'
examples:
- The communization of the mines was slow.
- Communization turned the farms over to the village.
