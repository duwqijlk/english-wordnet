senseId: 'thunderhead%1:17:00::'
synsetId: 09480823-n
simpleMeaning: a round mass of cumulus cloud (a tall puffy cloud) that sticks out and has bright edges,
  often seen before a storm with thunder and lightning
scope: This is the round top part of a cloud seen before a storm, not the storm itself and not any dark
  rain cloud.
examples:
- A white thunderhead rose above the fields before the storm came.
- We saw a thunderhead with bright edges over the hills in the late afternoon.
