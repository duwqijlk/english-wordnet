simpleMeaning: A bed made of cloth or rope netting, hung up so that it swings easily, usually between
  two trees
scope: A bed of cloth or rope netting that hangs and swings, also called a sack; not a bed that stands
  on legs.
examples:
- They hung the hammock between two trees.
- She slept in the hammock all afternoon.
