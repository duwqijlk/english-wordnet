simpleMeaning: A long pole on the low mast at the front of a ship with square sails, holding up the front
  sail.
scope: A pole on the front mast of a square-sailed ship; fore-yard is another name for this sense, not
  a pole on a back mast and not the sail itself.
examples:
- The crew tied the sail to the foreyard before they set off.
- A sailor climbed up to fix the rope on the foreyard.
