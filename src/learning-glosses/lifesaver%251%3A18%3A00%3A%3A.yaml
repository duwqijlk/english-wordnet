simpleMeaning: a person paid to work at a beach or pool and protect swimmers from accidents
scope: 'Also called lifeguard: a person paid to watch swimmers at a beach or pool and keep them safe,
  not a swimmer or a person visiting the beach.'
examples:
- The lifesaver blew his whistle when a child went too deep.
- A lifesaver helped the boy who was struggling in the pool.
