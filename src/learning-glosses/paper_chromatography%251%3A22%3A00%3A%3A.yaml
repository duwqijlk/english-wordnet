senseId: 'paper_chromatography%1:22:00::'
synsetId: 13553130-n
simpleMeaning: A way of sorting the parts of a mixture by how far each part moves along a strip of thin
  sheet, sticking to it at different rates
scope: A way of sorting the parts of a mixture on a strip of paper, not chromatography done in a tube
  or a column and not a way of sorting things by weight.
examples:
- Paper chromatography showed that the ink was made of three dyes.
- The students used paper chromatography to split the green dye into its parts.
