simpleMeaning: Split, or splitting, into two parts or kinds that are sharply different from each other.
scope: Split into two sharply different parts or kinds.
examples:
- The report was dichotomous, dividing the town into rich and poor.
- Their views were dichotomous, with no middle ground at all.
