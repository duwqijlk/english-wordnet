simpleMeaning: With long, thin arms and legs, and a tall, thin body
scope: 'Also called lanky, rangy, and gangling: tall and thin with long arms and legs. This is not just
  tall, and not just thin in the body alone.'
examples:
- The gangly boy had long arms and legs and towered over his friends.
- She was a gangly teenager who grew tall very fast.
