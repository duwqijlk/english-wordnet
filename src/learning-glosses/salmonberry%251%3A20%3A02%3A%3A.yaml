simpleMeaning: A bramble whose orange fruit is shaped like a thimble, with white flowers, growing in western
  North America and northern Mexico.
scope: It is also called salmon berry and thimbleberry, a white-flowered raspberry with orange fruit shaped
  like a thimble, not the red-flowered kind with pinkish-orange fruit and not the creeping kind with yellow
  or orange fruit.
examples:
- Salmonberries grew in western North America.
- Salmonberries grew in northern Mexico.
