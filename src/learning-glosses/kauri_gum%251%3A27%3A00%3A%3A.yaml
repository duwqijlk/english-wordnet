simpleMeaning: This sticky stuff from New Zealand trees is gathered to coat wood with a bright finish
  and to cover floors, and most often turns up as old hard remains.
scope: Kauri, kauri copal, and kauri resin are other names for this sticky stuff from New Zealand trees,
  most often found as old hard remains in the ground and gathered to coat wood with a bright finish and
  to cover floors.
examples:
- They polished the table with varnish made from kauri gum.
- They dug a lump of kauri gum from the ground.
