simpleMeaning: Coming from the body, or showing in the body, and not in the mind or the spirit.
scope: Said of the body as against the mind or the spirit; also called bodily, corporal, or corporeal.
examples:
- She complained of a somatic symptom that no test could explain.
- His somatic illness kept him in bed for a week.
