simpleMeaning: A tree from India and the East Indies with clusters of pale yellow and white flowers, grown
  to look nice
scope: 'Also called coral-wood, coralwood and peacock flower fence: a tree grown for its looks, not the
  hard wood of the tree and not the dye from its wood.'
examples:
- A red sandalwood stood by the gate, full of pale yellow flowers.
- They planted red sandalwood in the park because its flowers look so nice.
