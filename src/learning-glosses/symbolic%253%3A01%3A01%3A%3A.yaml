simpleMeaning: using one thing to stand for another, such as a picture or sign
scope: Using a picture or sign to stand for something else; not a single sign that stands for one idea,
  and not a system of signs.
examples:
- The dove is a symbolic bird of peace.
- The red rose has symbolic meaning in the poem.
