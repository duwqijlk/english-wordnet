simpleMeaning: any of several kinds of mint plant, in the group of plants called Thymus (a set of close
  plant kinds)
scope: The living plant, a kind of mint, not its leaves used to add taste to meat, stews, and vegetables
  in cooking.
examples:
- Thyme grows low in her garden all summer.
- He planted thyme next to the rosemary by the wall.
