simpleMeaning: in a way that is not polite or formal, and with no special act to mark what happens
scope: 'This says how a thing was done: with no polite or formal acts around it. Not done in a formal
  way with a special act for an important event.'
examples:
- He was dismissed unceremoniously after ten years with the firm.
- The guards pushed the man out unceremoniously and shut the door.
