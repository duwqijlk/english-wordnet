simpleMeaning: the forming of ice on a surface
scope: The forming of ice on a surface; not the white ice itself, not putting a sweet covering on a cake,
  and not harming or covering something with ice.
examples:
- Frost formed on the window during the cold night.
- By morning, frost was forming on the grass and the cars.
