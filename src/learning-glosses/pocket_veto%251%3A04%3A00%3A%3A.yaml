simpleMeaning: Stopping a law by not signing it, with no formal no given.
scope: A way of stopping a law by not signing it, not a formal vote against a law and not a court ruling.
examples:
- The president used a pocket veto to stop the bill.
- A pocket veto let the bill die without a vote.
