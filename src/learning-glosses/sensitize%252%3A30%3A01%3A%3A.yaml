senseId: 'sensitize%2:30:01::'
synsetId: 00574748-v
simpleMeaning: To make a material react to light, often light of one colour, by covering it with a coating
  used in photography.
scope: To make a material react to light by covering it with a photographic coating, not making a person
  react to a drug or allergen, not making someone aware, and not causing someone to sense a thing.
examples:
- They sensitized the photographic film before loading the camera.
- The plate was sensitized so it would react to red light.
