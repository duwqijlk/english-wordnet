simpleMeaning: 'Made of plaster, wood pulp, or other stuff, it forms the inside faces of houses most of
  all: a wide flat board for covering the sides of a room.'
scope: Also called drywall or wallboard, it is a wide flat board made of plaster, wood pulp, or other
  stuff, for covering the sides of a room and forming the inside faces of houses.
examples:
- The dry wall in the hall was made of plaster.
- They fixed the dry wall panels over the old plaster.
