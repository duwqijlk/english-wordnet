simpleMeaning: To feed a machine gun, bendable linked strips hold these small bullets, most often of small
  size.
scope: Also called a belt and belted ammunition, these small bullets, most often of small size, ride in
  bendable linked strips to feed a machine gun.
examples:
- The belt ammunition fed into the machine gun.
- They loaded the belt ammunition into the gun.
