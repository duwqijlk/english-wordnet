simpleMeaning: a set of illnesses caused by a virus, usually found in one area only; high temperature
  and stomach and gut troubles come first, then blood leaks from tiny blood vessels
scope: 'Also called haemorrhagic fever, viral haemorrhagic fever and viral hemorrhagic fever: a set of
  viral illnesses with bleeding from tiny blood vessels, not an ordinary fever or a stomach bug alone.'
examples:
- The clinic treated several cases of hemorrhagic fever after the outbreak.
- Hemorrhagic fever begins with a high temperature before bleeding starts.
