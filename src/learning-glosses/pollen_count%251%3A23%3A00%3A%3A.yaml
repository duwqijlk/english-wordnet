simpleMeaning: the number of tiny plant grains, usually from ragweed, in a set amount of air over one
  day at a set time and place
scope: This is a number that tells how many plant grains are in a set amount of air over one day at a
  set time and place, not the grains themselves.
examples:
- The pollen count was high today, so I stayed inside with the windows shut.
- She checks the pollen count each morning before she goes out for a walk.
