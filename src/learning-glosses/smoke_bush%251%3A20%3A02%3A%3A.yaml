simpleMeaning: Any of several shrubs of the Conospermum group, with loose heads of mostly white woolly
  flowers
scope: Any of several shrubs of the Conospermum group with loose heads of mostly white woolly flowers,
  not a tree and not a shrub with bright coloured blooms.
examples:
- The smoke bush flowered white in the dry garden.
- A smoke bush grew beside the path, its woolly blooms catching the light.
