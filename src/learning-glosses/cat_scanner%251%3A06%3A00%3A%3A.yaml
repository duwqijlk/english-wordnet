simpleMeaning: A machine that builds a three-dimensional picture of a thing by joining flat views of it.
scope: Also called computerized axial tomography scanner; a machine that builds a three-dimensional picture
  from flat views, among the machines that build pictures of things from flat views.
examples:
- The CAT scanner built a three-dimensional picture of the broken bone.
- Doctors used a CAT scanner to see inside the patient's chest.
