simpleMeaning: the sound of something bursting out in small drops with force
scope: 'Also called sputter, splutter, splatter, spatter, sputtering and spattering: the sound of something
  bursting out, not the act of throwing liquid onto a surface.'
examples:
- A loud splattering came from the pot as the soup burst out.
- The splattering of gunfire could be heard down the street.
