simpleMeaning: A flap hangs over the back of the neck from this cloth cover for a soldier's cap, to keep
  the direct sun off it.
scope: This cloth cover is worn over a soldier's cap, and its flap shields the back of the neck from the
  sun.
examples:
- The soldier wore a havelock.
- His havelock kept the sun off the back of his neck.
