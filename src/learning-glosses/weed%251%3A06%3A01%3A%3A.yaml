simpleMeaning: a black band worn by a man on his arm or hat to show that he is in mourning
scope: A black band worn as a sign of mourning, not a plant that grows where it is not wanted.
examples:
- He wore a weed on his arm after his father's death.
- The old man kept his weed on his hat all week.
