simpleMeaning: so tight that it presses hard and does not feel good, as if it has been pressed from both
  sides
scope: This is about something pressed tight so it hurts or feels bad, not about a voice that sounds as
  if it comes through the nose.
examples:
- Her pinched toes hurt inside her narrow shoes.
- The pinched skin on his arm turned red where the tight band pressed it.
