simpleMeaning: To give someone a task to do and make them answer for getting it done
scope: 'Also called charge and saddle: to give someone a task to do, not the main idea of a piece of writing
  and not a heavy load to carry.'
examples:
- He burdened her with cleaning up all the files over the weekend.
- The new law burdened small shops with extra forms.
