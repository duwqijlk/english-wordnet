simpleMeaning: to put a liquid into a body through a vein, as a medical treatment
scope: To put liquid into the body through a vein to treat illness, not to soak a thing in liquid and
  not to teach by repeating.
examples:
- The nurse will infuse the medicine into his arm.
- Some doctors infuse sugar solutions into the veins of animals.
