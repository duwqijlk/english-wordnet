simpleMeaning: Under a wheeled vehicle, this set of mechanical parts joins the wheels and axles to the
  body frame, using springs and shock absorbers.
scope: This is the set of springs and shock absorbers under a wheeled vehicle; suspension is another name
  for this sense.
examples:
- The suspension system smoothed the bumps on the rough road.
- A worn suspension system made the car shake.
