simpleMeaning: The batter strikes the ball well in the bat-and-ball game and reaches a safe spot on the
  field without being put out.
scope: This is also called safety, the strike that lets the batter reach a safe spot without being put
  out.
examples:
- A base hit sent the batter to a safe spot.
- With a base hit, the batter reached a safe spot.
