simpleMeaning: A muscle that pulls the arm in toward the body and turns it outward.
scope: A muscle that pulls the arm in and turns it outward; not the larger muscle that turns the arm inward,
  and not a shoulder muscle that lifts the arm.
examples:
- The musculus teres minor steadied his arm as he threw.
- She felt pain in the musculus teres minor after the match.
