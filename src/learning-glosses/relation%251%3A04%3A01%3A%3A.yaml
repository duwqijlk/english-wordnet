simpleMeaning: sex between people, especially when a man's penis goes into a woman's vagina until the
  strongest sexual feeling comes and fluid leaves his penis
scope: This sense is about sex between people, not dealings between groups, not a family member, and not
  a link between two things.
examples:
- Sexual relations between the couple began after they married.
- He denied having sexual relations with the woman.
