simpleMeaning: a lizard of the Americas, Madagascar, and some Pacific islands, usually with a long tail
  and, in males, a bright patch on the throat
scope: 'Also called an iguanid lizard: a lizard of the Americas, Madagascar, and some Pacific islands,
  not a snake and not a chameleon.'
examples:
- The male iguanid showed a bright patch on his throat as he sat in the sun.
- Iguanids live in warm lands across the Americas and on Madagascar.
