senseId: 'genuflect%2:38:01::'
synsetId: 02044554-v
simpleMeaning: In the manner of a servant before a master, to bend the knees and bow low.
scope: Also called scrape or kowtow; to bend the knees and bow low like a servant before a master, not
  the bow made in church before a holy person or image.
examples:
- He genuflected before the king, bowing low.
- The servant genuflected as the master entered the room.
