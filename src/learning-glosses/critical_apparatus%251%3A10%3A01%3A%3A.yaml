schema: oewn-learning-gloss-v2
senseId: 'critical_apparatus%1:10:01::'
synsetId: 92460709-n
simpleMeaning: The different wordings, notes, and other such matter found in a learned book or a careful
  new printing of a text
scope: The variant wordings and notes in a learned work or careful edition, not the main text itself and
  not a list of sources.
examples:
- The critical apparatus lists every change between copies.
- She checked the critical apparatus before quoting the passage.
