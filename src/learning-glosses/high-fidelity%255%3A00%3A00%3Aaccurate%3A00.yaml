simpleMeaning: Very little is lost or changed when the sound is played back
scope: 'Also called hi-fi: sound kept almost as it was first made, not sound made louder or changed for
  effect.'
examples:
- She bought a high-fidelity recording of the concert.
- The high-fidelity speakers played the music clearly.
