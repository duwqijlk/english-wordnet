simpleMeaning: an inherited metabolic disorder in which missing enzymes stop the body breaking down lysine,
  causing weak muscles and impaired mental development.
scope: This is the inherited disorder in which the body cannot process lysine, not a lack of lysine in
  the diet or a general shortage of enzymes.
examples:
- Babies with lysinemia lack the enzymes needed to break down lysine.
- Lysinemia can cause weak muscles and delayed mental development.
