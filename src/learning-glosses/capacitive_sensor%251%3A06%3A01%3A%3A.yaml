simpleMeaning: a device that finds things that carry electric charge or hold a dielectric, a substance
  that holds electric force without letting it flow, unlike air
scope: A device that finds things that carry charge or hold a dielectric, not a switch and not a meter
  that measures heat.
examples:
- The capacitive sensor switched on when her hand came near.
- A capacitive sensor can tell a metal key from a plastic one.
