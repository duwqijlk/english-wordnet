simpleMeaning: A sealed room where poison gas is let in to kill people or animals, used as a means of
  execution.
scope: This is a sealed room where poison gas is let in to kill people or animals, also called a gas chamber,
  not an open room where gas is used or a place where people are kept.
examples:
- The death chamber was a sealed room filled with poison gas.
- Prisoners were killed in the death chamber.
