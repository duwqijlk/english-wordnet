senseId: 'high-angle_fire%1:04:00::'
synsetId: 00996831-n
simpleMeaning: A cannon shoots past the slant that gives the longest shot, so its shots rise at a steep
  slant
scope: Shots sent up at a steep slant from a big gun, not shots aimed straight at a target or at the slant
  that gives the longest reach.
examples:
- The gunners used high-angle fire to lob shells over the hill.
- High-angle fire sends shells up at a steep slant before they fall.
