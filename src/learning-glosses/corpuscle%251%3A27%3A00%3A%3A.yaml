simpleMeaning: In plain talk, a tiny scrap of anything.
scope: This sense is also called an atom, a speck, a molecule, a particle, and a mote, for, in plain talk,
  a tiny scrap of anything, where an atom is, in everyday talk, a very small bit of anything, unlike the
  sense for one of two kinds of blood cells, sometimes with platelets too.
examples:
- Not a corpuscle of food was left.
- Corpuscles are tiny bits of anything.
