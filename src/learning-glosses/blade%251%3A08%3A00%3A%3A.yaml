simpleMeaning: a wide, flat structure in the body, such as at the shoulder or on the tongue
scope: A broad flat part of the body, not the beef cut from the shoulder or the flat part of a tool.
examples:
- His shoulder blade ached after the long climb.
- The blade of the tongue sits just behind the tip.
