simpleMeaning: A glass or plastic container for holding drinks or other liquids, usually shaped like a
  tube, with no handles and a narrow neck that takes a stopper or cap.
scope: The container itself, not the amount it holds or the baby's feeding bottle.
examples:
- She filled the bottle with water and screwed the cap back on.
- Empty glass bottles stood in rows on the shelf.
