simpleMeaning: An early drawing that shows the intended plan for how something will be built or arranged.
scope: Not the aim you intend to reach; this is the drawn sketch itself, made before the work begins.
examples:
- The architect showed us an early design for the new library.
- She sketched a rough design for the garden on the back of an envelope.
