simpleMeaning: a bus that carries people, with a motor that takes power from wires above the street
scope: This is a bus that runs on power from wires above the street; also called trolleybus and trackless
  trolley. Not a bus that runs on fuel and not a tram that runs on rails.
examples:
- The trolley coach drew power from the wires above the street.
- We rode a trolley coach across the city.
