simpleMeaning: A drawing or a model of a thing with the outside left out, so the parts inside can be seen.
scope: Also called a cutaway drawing or a cutaway model, a drawing or model that leaves out the outside
  to show the inside, not a man's coat.
examples:
- The book showed a cutaway of the engine.
- A cutaway of the house showed every room inside.
