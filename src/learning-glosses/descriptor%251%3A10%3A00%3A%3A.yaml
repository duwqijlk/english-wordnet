simpleMeaning: the sound of a word or the way it looks in writing, used to tell what something is
scope: Another name for this sense is form, and it is also called signifier. It is the sound or written
  look of a word, not a stored piece of information used to pick out an item in a computer system.
examples:
- The descriptor shows how the word sounds and how it is written.
- She wrote down a descriptor for each new word in the list.
