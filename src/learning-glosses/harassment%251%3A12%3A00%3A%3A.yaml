simpleMeaning: a very strong feeling of annoyance, caused by being hurt in your mind or feelings
scope: 'Also called torment: this is the very strong bad feeling in the person who is hurt, not the act
  of hurting them again and again.'
examples:
- His harassment was so great that he could not sleep at night.
- The harassment she felt after weeks of threats kept her awake at night.
