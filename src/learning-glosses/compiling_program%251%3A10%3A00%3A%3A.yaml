simpleMeaning: In computer science, a tool that works out steps written in a high-level language and turns
  them into low-level code a machine can run
scope: A tool that turns high-level code into low-level code, also called a compiler; not a word-processing
  tool and not a tool that runs the code itself.
examples:
- The compiling program turned her code into low-level code the machine could run.
- He ran the compiling program to turn the new code into machine code.
