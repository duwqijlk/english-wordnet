simpleMeaning: A god in Greek tales who is the bright upper air breathed by the gods of Olympus; son of
  Erebus and Night, or of Chaos and Darkness.
scope: 'A Greek tale figure: the bright upper air itself, not a god who lives in the air or rules it;
  his parentage is told in two different ways.'
examples:
- In the old tales, Aether is the bright upper air.
- Aether was the son of Erebus and Night.
