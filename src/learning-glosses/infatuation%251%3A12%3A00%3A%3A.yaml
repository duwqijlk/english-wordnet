simpleMeaning: a silly love or strong liking for someone or something, usually far too strong
scope: This is the silly, usually too strong feeling of love or strong liking, not the person or thing
  that someone loves in this way for a short time.
examples:
- His infatuation with the singer made him buy a ticket for every show.
- Her infatuation did not last long, and she soon lost interest.
