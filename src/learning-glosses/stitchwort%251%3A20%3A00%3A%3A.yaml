simpleMeaning: Said to ease sharp pains in the side, a low-growing herb of cool northern lands has small
  white star-shaped flowers.
scope: This is also called greater stitchwort and starwort, a low-growing herb with small white star-shaped
  flowers, said to ease sharp pains in the side, not a tall plant of warm lands.
examples:
- Stitchwort grows low in cool northern lands.
- Stitchwort is said to ease sharp pains in the side.
