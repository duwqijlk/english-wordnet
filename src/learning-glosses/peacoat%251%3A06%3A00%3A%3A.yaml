simpleMeaning: a heavy jacket made of thick wool, with two rows of buttons, worn by sailors
scope: A heavy wool coat for sailors with two rows of buttons, not a light jacket for warm weather.
examples:
- He wore a warm peacoat on the cold ship.
- The sailor buttoned his peacoat before going on deck.
