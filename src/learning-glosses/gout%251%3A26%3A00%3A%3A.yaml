simpleMeaning: A painful swelling of the big toe and foot, caused by faulty uric acid processing that
  leaves deposits of the acid and its salts in the blood and joints.
scope: The metabolic joint disease itself, not arthritis from other causes or a plain toe injury; gouty
  arthritis is another name for it.
examples:
- He could not wear tight shoes because of the gout in his big toe.
- The gout made his big toe painful and swollen.
