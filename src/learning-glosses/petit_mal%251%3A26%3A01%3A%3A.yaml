simpleMeaning: The mind goes blank for a moment in these short fits of epilepsy, which may bring other
  such troubles too.
scope: This form of epilepsy, also called epilepsia minor and petit mal epilepsy, is a brief clouding
  of the mind, not a short seizure with muscle spasms.
examples:
- She has had petit mal since she was a child.
- During a petit mal fit, their mind went blank for a moment.
