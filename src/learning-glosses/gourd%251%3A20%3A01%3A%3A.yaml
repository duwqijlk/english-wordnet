simpleMeaning: any vine in the Cucurbitaceae family (a family of plants) that grows fruit with a hard
  outer skin
scope: Also called gourd vine. This is the living climbing plant, not a bottle made from its dried shell
  and not the hard-skinned fruit itself.
examples:
- The gourd vine spread across the garden fence.
- This gourd bears large fruit with hard skins late in summer.
