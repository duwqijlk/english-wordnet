simpleMeaning: The final figure counts some numbers more than others, because each number to be worked
  out carries a weight.
scope: Also called weighted arithmetic mean and weighted mean, it is the figure where each number carries
  a weight that sets how much it counts.
examples:
- The weighted average of the prices took the bigger shops into account more.
- The weighted average of the test marks was worked out.
