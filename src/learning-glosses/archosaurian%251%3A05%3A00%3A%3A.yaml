simpleMeaning: The dinosaurs, the plesiosaurs, the pterosaurs, the ichthyosaurs, and the thecodonts, all
  long-dead creeping animals grouped under one name.
scope: It is also called archosaur and archosaurian reptile, and it names the group of long-dead creeping
  animals made up of the dinosaurs, the plesiosaurs, the pterosaurs, the ichthyosaurs, and the thecodonts,
  not the creeping animals alive today.
examples:
- The archosaurian group holds the dinosaurs and the ichthyosaurs.
- The archosaurian reptiles died out long before people lived.
