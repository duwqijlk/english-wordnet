simpleMeaning: a chemical used mainly by animal doctors to clear farm animals of worms and other pests
  inside them
scope: A chemical used mainly to clear farm animals of pests inside them; phenothiazine is another name
  for this sense. Not a drug for people, and not a feed for farm animals.
examples:
- The vet gave the sheep thiodiphenylamine to clear them of worms.
- Farmers once used thiodiphenylamine to rid cattle of gut pests.
