simpleMeaning: to make a surface look nicer by putting patterns or shapes on it with a soft mix made mostly
  from Portland cement, sand and lime
scope: This is using the material to add patterns or shapes that make a surface look nicer. It is not
  just covering a whole surface with it, and not the material as a thing on its own.
examples:
- Craftsmen stuccoed the ceiling with raised flowers and leaves.
- The wall was stuccoed in a pattern of curls and lines.
