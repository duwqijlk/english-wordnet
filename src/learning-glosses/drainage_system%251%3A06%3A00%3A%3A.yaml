simpleMeaning: channels and pipes joined up so extra water can flow away from a place
scope: 'Also called drain system and drainage well: channels and pipes joined up to carry extra water
  away, not one pipe on its own and not a ditch dug to carry water away.'
examples:
- The drainage system kept the streets dry in the storm.
- Engineers built a new drainage system for the housing estate.
