simpleMeaning: How much stronger a signal, a voltage, or a current becomes, shown as the size of what
  comes out against what goes in.
scope: Also called gain, how much stronger a signal, a voltage, or a current becomes, shown as the size
  of what comes out against what goes in, not the adding of extra matter or detail to a piece of writing.
examples:
- The amplification of the signal was ten times.
- High amplification made the sound too loud.
