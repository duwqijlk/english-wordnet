simpleMeaning: A ceremonial feast of some Pacific Northwest Indigenous peoples, where hosts give gifts
  to mark weddings or new leadership and show wealth, sometimes in the past to their ruin.
scope: This is the ceremonial gift-giving feast of certain Northwest Coast Indigenous peoples, not an
  ordinary banquet or a religious sacrifice.
examples:
- The family hosted a potlatch to celebrate the marriage and gave blankets and food to every guest.
- Museum labels explain that a potlatch can mark a new chief taking office.
