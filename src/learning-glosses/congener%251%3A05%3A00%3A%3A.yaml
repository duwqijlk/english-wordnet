senseId: 'congener%1:05:00::'
synsetId: 01330943-n
simpleMeaning: an animal or a plant that stands as kin to another, because they share the same line of
  birth or the same group of living things
scope: This is an animal or plant kin to another through shared birth or shared group; congenator, congeneric
  and relative are other names for this sense, and it is not the chemical that gives wine or liquor its
  character.
examples:
- The congener grows beside its kin in the same valley.
- Scientists traced the congener to the same group of living things as the garden plant.
