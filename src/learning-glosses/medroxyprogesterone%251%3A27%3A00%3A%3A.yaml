simpleMeaning: A drug like progesterone, a body chemical (trade name Provera), used to treat problems
  with monthly bleeding
scope: A hormone drug sold as Provera for problems with monthly bleeding, not a painkiller and not a vitamin.
examples:
- Her doctor gave her medroxyprogesterone for her monthly bleeding.
- Medroxyprogesterone is sold under the trade name Provera.
