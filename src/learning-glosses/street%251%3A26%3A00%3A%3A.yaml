simpleMeaning: the rough, poor side of city life, where there is crime, sex work and neglect.
scope: It is not a road you can point to on a map, but the poor and dangerous side of city life.
examples:
- The film shows the city's streets, where poverty and crime are part of daily life.
- He grew up on the streets, surrounded by crime and neglected buildings.
