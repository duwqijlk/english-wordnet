simpleMeaning: A person chooses to do this work for no pay, and the work makes something real
scope: 'Another name for labour of love: useful work done freely for no pay, not paid work and not a hobby
  done only for fun.'
examples:
- Restoring the old church was a labor of love for the whole village.
- She spent ten years on the garden as a labor of love.
