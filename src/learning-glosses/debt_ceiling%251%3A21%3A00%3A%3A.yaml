simpleMeaning: the most money a government can borrow
scope: This is the most a government can borrow, also called a debt limit; not a cap on what a person
  can borrow and not the money a government already owes.
examples:
- Congress raised the debt ceiling so the government could keep paying its bills.
- The debt ceiling sets a hard cap on new government borrowing.
