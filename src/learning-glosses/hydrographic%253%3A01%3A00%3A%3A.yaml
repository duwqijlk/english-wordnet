simpleMeaning: Of or relating to the science of measuring and mapping oceans, seas, lakes and rivers
scope: Of or relating to the science of measuring and mapping waters, also called hydrographical; not
  of the study of land, and not of the study of weather.
examples:
- The hydrographic survey mapped the sea floor.
- Hydrographic charts show the depth of the harbour.
