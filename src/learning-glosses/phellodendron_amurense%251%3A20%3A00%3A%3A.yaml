simpleMeaning: A tree of China and Manchuria that sheds its leaves each year, smells of turpentine, and
  has fine compound leaves that turn yellow in autumn and deeply cracked corky bark.
scope: Also called cork tree; not an evergreen.
examples:
- The Phellodendron amurense dropped its yellow leaves in autumn.
- We planted a Phellodendron amurense for its corky bark.
