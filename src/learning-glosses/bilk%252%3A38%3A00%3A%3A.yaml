simpleMeaning: To slip away, in body or in mind.
scope: This sense is also called elude and evade, for slipping away, in body or in mind, where elude is
  getting away from someone or something, by running off or by slipping out of your mind's reach.
examples:
- He bilked the guards and slipped away.
- She bilked the question in her mind.
