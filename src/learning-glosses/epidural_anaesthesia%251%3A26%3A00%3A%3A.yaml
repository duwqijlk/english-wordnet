senseId: 'epidural_anaesthesia%1:26:00::'
synsetId: 14052134-n
simpleMeaning: numbing of the belly, genitals and pelvis by injecting painkiller into the space around
  the spinal cord; used in childbirth and gynecological surgery
scope: Another name for this procedure is epidural anesthesia (also spelled epidural anaesthesia); the
  short noun epidural means the same thing, and it is not the adjective sense 'on or outside the dura
  mater'.
examples:
- The epidural anaesthesia left her awake but free of pain from the waist down.
- Epidural anaesthesia is often offered to women in labour.
