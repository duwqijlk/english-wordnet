simpleMeaning: long pods of a food bean, usually cut into short pieces about half an inch long, much liked
  in Britain
scope: These are long pods of a food bean, usually cut into short pieces, much liked in Britain; runner
  bean and scarlet runner bean are other names for this sense, not the plant that grows the pods and not
  a green bean.
examples:
- She sliced the scarlet runner into short pieces for the stew.
- Scarlet runner is a favourite in Britain, often served with roast lamb.
