simpleMeaning: to add up the money received and the money paid in an account
scope: This is not the act of making things equal in weight and not the state of an account; it is the
  work of adding up its entries.
examples:
- She balances the accounts every Friday afternoon.
- He spent the evening balancing the company's books.
