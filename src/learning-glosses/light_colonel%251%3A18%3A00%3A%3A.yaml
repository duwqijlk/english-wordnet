simpleMeaning: The rank just above a major and just below the next rank up is held by an officer with
  a formal post in the American Army, Air Force or Marines
scope: 'Another name for lieutenant colonel: an officer rank just above a major in the American Army,
  Air Force or Marines, not the rank of major and not a higher rank.'
examples:
- The light colonel took command of the battalion.
- She was made a light colonel after twenty years of service.
