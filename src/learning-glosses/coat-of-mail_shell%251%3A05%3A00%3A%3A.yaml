simpleMeaning: an early sea animal with a long body that matches on both sides, its soft cover plated
  by eight chalky plates
scope: 'Also called a chiton, a polyplacophore, and a sea cradle: a sea animal with eight chalky plates,
  not a snail with one shell and not a clam with two shells.'
examples:
- A coat-of-mail shell clung to the rock at low tide.
- The coat-of-mail shell has eight plates over its soft body.
