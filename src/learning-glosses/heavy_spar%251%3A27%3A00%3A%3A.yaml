simpleMeaning: A white or clear mineral of barium, sulphur and oxygen is the main place where barium,
  a soft grey metal, comes from
scope: A white or clear mineral, also called barite, barium sulphate and barytes, that gives us barium,
  not a white stone used for building and not a coloured gem.
examples:
- Miners dug heavy spar from the hillside.
- Heavy spar is crushed to get barium from it.
