simpleMeaning: A B vitamin needed for the nerves and the gut to work as they should.
scope: A B vitamin needed for the nerves and the gut to work as they should, also called nicotinic acid;
  not a vitamin for the bones and not a drug for the nerves.
examples:
- Niacin in the diet keeps the nerves and the gut working well.
- The doctor said a lack of niacin can harm the gut.
