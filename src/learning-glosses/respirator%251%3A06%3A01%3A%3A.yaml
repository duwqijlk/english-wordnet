simpleMeaning: a mask with a part that cleans the air, worn to keep the face and lungs safe from poisonous
  gases
scope: Also called gas helmet and gasmask, this is a mask worn for safety from harmful gases, not a machine
  that helps a person breathe when they cannot breathe on their own.
examples:
- The worker wore a respirator before entering the room full of harmful gas.
- Firefighters put on respirators to protect their lungs from smoke and gas.
