simpleMeaning: feeling a sharp, unhappy want for the good things someone else has
scope: 'Also called jealous: an unhappy, painful want for what someone else has, not simple admiration
  and not anger at a rival.'
examples:
- She felt envious of her friend's new house.
- He was envious of their art collection.
