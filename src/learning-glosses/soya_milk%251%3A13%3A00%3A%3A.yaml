simpleMeaning: Flour of the beans it is named for, mixed with water, makes a drink that stands in for
  dairy, used in some food for babies and in making tofu.
scope: It is also called soybean milk and soymilk, a drink that stands in for dairy and not the white
  liquid that comes from cows.
examples:
- The baby's food was made with soya milk.
- Tofu was made with soya milk.
