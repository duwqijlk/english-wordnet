simpleMeaning: a long, thin split or crack in a thing
scope: A long narrow split in something, not a split in a person's palate or chin and not a leaf cut nearly
  to its middle vein.
examples:
- Water ran down the cleft in the rock.
- He slipped his hand into the cleft between the two stones.
