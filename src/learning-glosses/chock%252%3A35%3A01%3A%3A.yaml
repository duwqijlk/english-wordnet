simpleMeaning: to hold something firmly in place with blocks of wood put against it so it cannot roll
  or slide
scope: 'This is the verb: to hold something in place with blocks of wood. It is not the block itself,
  and not just resting something on blocks for support.'
examples:
- He chocked the wheels of the truck before he left it on the hill.
- She chocked the wheels of the cart so it could not roll away down the slope.
