simpleMeaning: a wooden or metal frame holding a sheet of glass, built into a wall or roof so that light
  and air can get in.
scope: This is the frame built into a building, not an opening in a vehicle and not a clear panel in an
  envelope.
examples:
- She opened the window to let in fresh air.
- Rain was beating against the kitchen window.
