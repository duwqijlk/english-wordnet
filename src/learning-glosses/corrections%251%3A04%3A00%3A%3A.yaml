simpleMeaning: 'the way society controls people who break the law: prison, help to change and live in
  society again, and release under watch instead of or after prison'
scope: This is the whole system for controlling people who break the law, not the government office that
  runs part of it and not the fixing of mistakes in work.
examples:
- She got a job in corrections after training to work with prisoners.
- Corrections includes prison, help for prisoners to change, and release under watch.
