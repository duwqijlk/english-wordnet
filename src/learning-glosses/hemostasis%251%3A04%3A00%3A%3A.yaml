simpleMeaning: While the surgeon works, the blood is made to stop flowing; a clamp that pinches a vessel
  shut is one way to do it
scope: Stopping the flow of blood during an operation, also called haemostasia, haemostasis and hemostasia,
  not blood clotting on its own and not first aid for a cut.
examples:
- Hemostasis was reached with a clamp on the vessel.
- The team checked hemostasis before the patient left the operating room.
