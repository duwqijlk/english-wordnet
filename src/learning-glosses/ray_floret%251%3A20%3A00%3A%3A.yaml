simpleMeaning: These small flowers usually sit round the edge of a large flower head, each with a flat,
  strap-like ring of petals.
scope: Also called a ray flower, it is a small flower with a flat strap-like ring of petals, usually found
  round the edge of a large flower head.
examples:
- We looked at the ray floret at the edge of the daisy.
- Each ray floret of the sunflower has a flat strap of petals.
