senseId: 'surround%2:33:00::'
synsetId: 01129837-v
simpleMeaning: To close in around someone or something until they are forced to give up.
scope: The sense of closing in to force surrender, also called besiege, beleaguer, circumvent or hem in,
  not plain encirclement or walling something for defence.
examples:
- Enemy troops surrounded the town and waited until its defenders gave up.
- The rebels surrounded the palace, cutting off supplies until it surrendered.
