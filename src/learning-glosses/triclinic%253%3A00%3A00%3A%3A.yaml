simpleMeaning: Having three unequal crystal lines that meet at slanted angles
scope: A crystal shape with three unequal lines meeting at slanted angles, also called anorthic; not a
  crystal with equal lines and not one with lines meeting at right angles.
examples:
- The mineral formed triclinic crystals with three unequal axes.
- A triclinic system has no right angles between its axes.
