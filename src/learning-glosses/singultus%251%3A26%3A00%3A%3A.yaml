simpleMeaning: A fit of automatic spasms of the muscle sheet under the lungs, with the throat snapping
  shut to make a sound; the word is usually plural and sometimes signals indigestion.
scope: Another name for the hiccups, also spelled hiccough; it is not a belch or a common cough.
examples:
- The doctor asked how long the singultus had lasted.
- Singultus is sometimes a sign of indigestion.
