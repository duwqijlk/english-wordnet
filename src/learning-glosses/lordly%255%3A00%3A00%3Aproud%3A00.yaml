simpleMeaning: feeling or showing proud scorn for people one looks down on as not good enough
scope: Proud scorn for people one looks down on, with haughty, imperious and disdainful as other names
  for this sense, and not merely proud or like a lord in rank.
examples:
- His lordly manners were offensive to the guests.
- She gave a lordly look at the servant's plain dress.
