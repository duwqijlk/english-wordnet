simpleMeaning: A group of parts of the United States government that gather secret news for that government,
  led by the head of its secret-news service.
scope: 'Also called the Intelligence Community: the group that gathers secret news for the United States,
  not a single office that does the work alone.'
examples:
- The United States Intelligence Community gathers secret news for the country.
- The United States Intelligence Community is led by the head of its secret-news service.
