simpleMeaning: Cows or sheep feed on grass under this person's care, and are sold later
scope: A person who raises cattle or sheep for sale, not a cowboy who rides with a herd and not a butcher
  who sells meat.
examples:
- The grazier moved his cattle to the green hills for the summer.
- She worked as a grazier, selling sheep at the market each year.
