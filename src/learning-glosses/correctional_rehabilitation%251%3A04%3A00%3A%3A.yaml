simpleMeaning: holding people found guilty in prison, or watching over them in the community instead of
  prison, or watching over them in the community after early release
scope: Holding people found guilty in prison, or watching over them in the community instead of prison,
  or watching over them in the community after early release; not the prison building itself, and not
  punishment for its own sake.
examples:
- The new law put money into correctional rehabilitation for young offenders.
- Correctional rehabilitation may mean prison, probation or parole.
