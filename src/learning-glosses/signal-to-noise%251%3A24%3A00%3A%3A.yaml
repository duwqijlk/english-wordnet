senseId: 'signal-to-noise%1:24:00::'
synsetId: 13847877-n
simpleMeaning: a number that says how strong a wanted sound is when set against unwanted sound
scope: A number that says how strong a wanted sound is against unwanted sound, also called signal-to-noise
  ratio, signal/noise and signal/noise ratio; not the strength of the wanted sound on its own and not
  the strength of the unwanted sound on its own.
examples:
- The engineer checked the signal-to-noise of the radio link before the test.
- A high signal-to-noise means the wanted sound is easy to hear.
