simpleMeaning: 'It gives manna, a sweet sap, and has sweet-smelling white blossoms in thick bunches: a
  southern Mediterranean ash'
scope: Manna ash is another name for this southern Mediterranean ash with sweet-smelling white blossoms
  in thick bunches that gives manna, unlike the shrubby ash of the southwestern United States or California.
examples:
- The flowering ash had sweet-smelling white blossoms.
- Flowering ash gives manna, a sweet sap.
