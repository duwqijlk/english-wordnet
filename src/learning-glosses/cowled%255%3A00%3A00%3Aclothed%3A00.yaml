simpleMeaning: with the head covered inside a loose hood
scope: This describes a person whose head is inside a loose hood. It is not just wearing a hat, and it
  does not name the person alone.
examples:
- A cowled monk walked slowly through the cold morning.
- The cowled figure stood by the door, with his face hidden in shadow.
