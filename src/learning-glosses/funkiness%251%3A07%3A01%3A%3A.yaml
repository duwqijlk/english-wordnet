simpleMeaning: In American slang, the quality of being new and odd, not like other things, and not following
  the usual way
scope: In American slang, the quality of being new and odd, not the quality of being odd in a bad way
  and not the quality of being plain and usual.
examples:
- The shop's funkiness drew in young shoppers looking for something different.
- Her funkiness showed in the bright colours she wore.
