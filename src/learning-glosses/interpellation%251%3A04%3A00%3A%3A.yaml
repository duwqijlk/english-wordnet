simpleMeaning: The act of throwing in, or putting between, a deed or word that breaks in.
scope: The act of throwing in, or putting between, a deed or word that breaks in; also called interjection
  or interpolation; not, in law-making, a law-making way of bidding a state officer tell of some deed
  or rule.
examples:
- Their interpellation broke at dawn.
- The interpellation was heard at noon.
