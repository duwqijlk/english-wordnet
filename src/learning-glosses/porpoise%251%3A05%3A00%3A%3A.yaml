simpleMeaning: any of several small cetaceans (sea mammals of the whale group) that live in groups and
  have a nose and mouth that is not pointed, and many teeth
scope: A small sea animal that lives in groups, not a dolphin with a long pointed mouth and not a fish.
examples:
- A group of porpoises swam beside the boat.
- The porpoise showed its short round nose above the water.
