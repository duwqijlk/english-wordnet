simpleMeaning: in a way that costs a lot of money
scope: This tells how something is done when it costs a lot of money, not how it is done cheaply or for
  little money.
examples:
- She dressed expensively in a coat that cost a lot of money.
- They furnished their home expensively with chairs and tables that cost a great deal.
