senseId: 'shunt%1:06:01::'
synsetId: 04218068-n
simpleMeaning: a wire or part that carries electric flow very easily, set beside another device to take
  some of the flow away from it
scope: 'Also called bypass and electrical shunt: a part set beside a device to take some electric flow
  away from it. Not the medical tube put in the body, and not a body passage for blood.'
examples:
- The engineer fitted a shunt across the meter to protect it from too much current.
- A small shunt beside the device carries part of the electric current away.
