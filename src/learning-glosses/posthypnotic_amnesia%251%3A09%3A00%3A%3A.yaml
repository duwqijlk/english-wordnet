simpleMeaning: 'Some things are lost from memory after a sleep-like state: what happened in it, or facts
  the person who led it picked out.'
scope: This loss of memory covers only some things after a sleep-like state, not everything that happened.
examples:
- After the session, posthypnotic amnesia left them unable to recall what happened.
- With posthypnotic amnesia, the facts named in the session stayed out of reach.
