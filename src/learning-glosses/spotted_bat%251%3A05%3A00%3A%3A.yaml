simpleMeaning: a big flying night animal of the south-west of the United States, with marks on its body
  and very large ears
scope: 'Also called a jackass bat: a big night-flying animal with marks and very large ears from the south-west
  of the United States, not a small bat and not a bird.'
examples:
- The spotted bat roosted in the cave during the day.
- We saw a spotted bat with huge ears fly past at dusk.
