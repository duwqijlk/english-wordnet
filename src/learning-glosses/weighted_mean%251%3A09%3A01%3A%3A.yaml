simpleMeaning: Each number to be worked out carries a weight, so the average that comes out counts some
  numbers more than others.
scope: Also called weighted arithmetic mean and weighted average, it is the average where each number
  carries a weight that sets how much it counts.
examples:
- The weighted mean of the figures gave the latest month the most weight.
- A weighted mean was used to work out the final mark.
