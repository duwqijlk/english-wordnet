scope: 'This cover is also called a tent: you can pack it up and move it, put it up on poles and hold
  it down with ropes and pegs.'
examples:
- We put up the collapsible shelter on poles and held it down with ropes and pegs.
- They packed up the collapsible shelter and moved it to a new place.
