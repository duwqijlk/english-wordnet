simpleMeaning: A slow tree animal of Central America with a pair of long claws on each front foot and
  three long claws on each back foot.
scope: This is a slow tree animal of Central America with a pair of long claws on each front foot, also
  called unai and unau; not a monkey and not a bear.
examples:
- The two-toed sloth hung from the branch.
- Two-toed sloths move slowly through the trees.
