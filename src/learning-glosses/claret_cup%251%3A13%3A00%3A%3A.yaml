simpleMeaning: With lemon juice and sugar, and at times sherry, curacao or fresh fruit, this drink mixes
  red wine and brandy
scope: This is a drink of red wine and brandy with lemon juice and sugar, not a plain glass of wine and
  not a cup for drinking from.
examples:
- We shared a claret cup.
- The claret cup was mixed with lemon juice and fresh fruit.
