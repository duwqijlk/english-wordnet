senseId: 'chemical%3:01:00::'
synsetId: 02703361-a
simpleMeaning: about the science that studies what things are made of and how they change, or used in
  that science
scope: This describes something about or used in the science that studies what things are made of and
  how they change; it is not the name of a substance itself, and not the sense that means made from or
  using substances that take part in such changes.
examples:
- She works in a chemical laboratory where she tests water samples.
- They use chemical methods to study what the rock is made of.
