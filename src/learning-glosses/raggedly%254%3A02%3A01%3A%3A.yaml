schema: oewn-learning-gloss-v2
senseId: 'raggedly%4:02:01::'
synsetId: 00440888-r
simpleMeaning: in a rough way that does not follow a regular pattern
scope: This is about how something moves or is done, in a rough way with no regular pattern; not the rough,
  uneven look of a thing, and not the near sense about moving in an uneven way, where the parts are not
  even.
examples:
- A stone wall trails raggedly through the woods, turning this way and that.
- The old road ran raggedly along the edge of the hills.
