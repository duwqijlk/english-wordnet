simpleMeaning: A kind of grasshopper with long thin feelers and, in the male, well-grown sound-making
  parts on the front wings
scope: This is a grasshopper with long thin feelers, also called a long-horned grasshopper; not a short-horned
  grasshopper and not a cricket.
examples:
- The tettigoniid sang from the tall grass with its long feelers waving.
- Male tettigoniids make sound with parts on their front wings.
