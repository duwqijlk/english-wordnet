simpleMeaning: a meal out in the open where food is cooked over a fire, especially a whole animal turned
  on a spit
scope: A meal out in the open with food cooked over a fire, not the frame that holds the meat and not
  the cooked meat itself.
examples:
- We held a barbecue on the beach at sunset.
- The whole village came to the barbecue after the harvest.
