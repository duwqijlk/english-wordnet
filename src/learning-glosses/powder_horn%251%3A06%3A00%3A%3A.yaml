simpleMeaning: a small holder for carrying the stuff that makes a gun fire, made from the hollow part
  on an animal's head
scope: Also called a powder flask, it is a small holder for carrying the stuff that makes a gun fire,
  not a large place for keeping weapons.
examples:
- The hunter carried a powder horn at his side for his old gun.
- He filled the powder horn before he left for the hunt.
