simpleMeaning: In a divorce case, one person is charged along with another of having sex with the husband
  or wife who is seeking the divorce.
scope: Also called a corespondent, this is the person charged with another of having sex with the husband
  or wife seeking a divorce.
examples:
- The co-respondent was named in the divorce case.
- The co-respondent had to answer the charge in court.
