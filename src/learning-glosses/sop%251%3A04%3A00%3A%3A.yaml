simpleMeaning: A set way of doing a job, laid down in advance and used each time.
scope: A fixed routine for doing a job, also called a standard operating procedure, a standard procedure
  and a standing operating procedure; not a one-off plan.
examples:
- The SOP for the lab is pinned to the wall.
- Staff must follow the SOP every time they open the store.
