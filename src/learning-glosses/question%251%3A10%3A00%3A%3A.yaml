simpleMeaning: A single act of asking for information or an answer, or of being asked about something.
scope: This sense is the asking itself — the act of putting a question to someone. It is not the subject
  under discussion (as in 'the question of pay'), not a matter of doubt, and not the informal mention
  of a marriage proposal.
examples:
- A reporter's first question was about the missing money.
- After the talk, a short question came from the audience.
