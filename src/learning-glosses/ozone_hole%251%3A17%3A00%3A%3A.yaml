simpleMeaning: a part of the high layer of gas around the earth, near the poles, that loses much of its
  protective gas at certain times of year
scope: A part of the high layer of gas around the earth, near the poles, that loses much of its protective
  gas at certain times of year; not a tear in the sky and not a place with no gas at all.
examples:
- The ozone hole grows larger over the South Pole each spring.
- Scientists watch the ozone hole to see how much gas is lost.
