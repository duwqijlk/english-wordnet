simpleMeaning: Gas is taken out of an empty space by a pump that gives its tiny bits an electric charge
  and sticks them to a metal surface
scope: This pump takes gas out of an empty space by charging its bits and catching them on a metal surface.
examples:
- The ion pump took the gas out of the empty space.
- An ion pump sticks charged bits to metal to clear the gas.
