simpleMeaning: a piece of metal in a ring or other jewelry that holds a gem (a valuable stone) in place
scope: 'Also called setting: the metal part that holds a gem in a ring or other jewelry, not the verb
  sense of going up step by step.'
examples:
- The diamond sat in a plain gold mount.
- She chose a silver mount for the small ruby.
