simpleMeaning: Showing care to use words and acts that do not hurt or insult any group of people
scope: This describes words or acts that show care not to hurt or insult any group; not the opposite,
  saying things that offend people, and not just being polite in general.
examples:
- The teacher used politically correct words when talking about the new pupils.
- He tried to stay politically correct in the meeting.
