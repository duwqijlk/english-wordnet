simpleMeaning: The group of Sikhs who have gone through the rite of entry, which devout orthodox Sikhs
  join at puberty; begun by the tenth and last Guru in 1699
scope: This is the group of Sikhs entered by rite at puberty and begun by the tenth and last Guru in 1699;
  only devout orthodox Sikhs are admitted to it.
examples:
- The Khalsa welcomed the young Sikh after the rite of entry.
- He joined the Khalsa at puberty, as his father had.
