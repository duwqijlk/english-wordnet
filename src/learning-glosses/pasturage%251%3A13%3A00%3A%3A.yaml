simpleMeaning: Horses or cattle eat this bulky plant food, like grass or hay, as they move about.
scope: Also called grass, forage, pasture, and eatage, this is the bulky plant food that horses or cattle
  eat as they move about, not the animals themselves.
examples:
- The horses ate the pasturage.
- The cattle grazed on the pasturage.
