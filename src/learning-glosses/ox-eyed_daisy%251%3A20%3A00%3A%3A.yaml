simpleMeaning: a tall, long-lived plant with leafy stems and white flowers, from Europe and Asia; it now
  grows wild in many places and is often put in the Chrysanthemum group
scope: A tall white-flowered plant that lives for many years, also called marguerite, moon daisy, oxeye
  daisy, and white daisy; not a yellow daisy and not a short garden flower.
examples:
- Ox-eyed daisies grow tall along the edge of the field.
- She picked an ox-eyed daisy and put it in a glass of water.
