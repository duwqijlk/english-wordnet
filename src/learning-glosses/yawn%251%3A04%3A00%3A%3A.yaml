senseId: 'yawn%1:04:00::'
synsetId: 00838954-n
simpleMeaning: a deep breath taken in through a wide open mouth without meaning to, usually when a person
  is tired or bored
scope: No partner name for this sense; this is the breath itself, not the act of taking that breath.
examples:
- He could not suppress a yawn during the long talk.
- The yawning in the audience told him it was time to stop.
