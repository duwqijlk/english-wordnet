simpleMeaning: Any animal that feeds its young on milk, with long teeth that stick out, especially an
  elephant or a wild pig.
scope: For any mammal with sticking-out teeth, an elephant or wild boar above all.
examples:
- The old tusker led the herd through the forest.
- Hunters tracked the tusker by its great white teeth.
