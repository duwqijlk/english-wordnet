simpleMeaning: This trillium of the east of North America bears foul pink-to-purple flowers, and a root,
  sharp to the taste, put to old-time medicine, especially for easing childbirth.
scope: Also called birthroot and purple trillium, this trillium of the east of North America bears foul
  pink-to-purple flowers, and a root, sharp to the taste, put to old-time medicine, especially for easing
  childbirth, unlike the sense for a trillium of the northeastern United States with stalkless leaves
  and red or purple flowers with a sharp smell.
examples:
- Red trillium eases childbirth in folk cures.
- Red trillium flowers smell foul.
