simpleMeaning: a person who travels from place to place selling things, for example in the streets or
  at carnivals
scope: 'Also called peddler and hawker: a person who travels about selling goods, not a person with a
  fixed shop.'
examples:
- A pedlar came to the village selling pots and cloth.
- The pedlar carried his goods in a large bag on his back.
