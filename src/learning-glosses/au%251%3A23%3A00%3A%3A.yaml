simpleMeaning: A unit of length for gaps in the Sun's set of worlds, the mean gap from Earth to Sun —
  about 93 million miles or 150 million kilometres.
scope: Also called an Astronomical Unit; not a unit for weighing things and not a short gap on earth.
examples:
- The AU is about 93 million miles.
- Astronomers use the AU to give gaps inside the solar system.
