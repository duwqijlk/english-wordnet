simpleMeaning: Something that holds a person back and takes away their freedom, above all a tie used on
  a prisoner.
scope: A thing that keeps a person from going free, also called a bond and a shackle, and not a basket
  for food or clothes.
examples:
- The heavy chains acted as a hamper on the prisoner.
- Old laws were a hamper on free trade.
