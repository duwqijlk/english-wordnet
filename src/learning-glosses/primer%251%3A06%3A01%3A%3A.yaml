simpleMeaning: the first layer of paint, or of a glue-like stuff that seals a surface, put on before the
  main paint
scope: Also called ground and priming, this is the first layer put on a surface before the main paint;
  it is not a small thing used to start burning in a gun or engine.
examples:
- Put primer on the bare wood before you paint it.
- The wall needs a coat of primer so the new paint will stick well.
