simpleMeaning: A stringed instrument that makes sounds with a round part that turns and rubs the strings.
scope: A stringed instrument played by a turning round part; hurdy-gurdy and hurdy gurdy are other names
  for this sense, not a violin and not a guitar.
examples:
- He played a tune on the wheel fiddle at the fair.
- The wheel fiddle makes its sound as the round part rubs the strings.
