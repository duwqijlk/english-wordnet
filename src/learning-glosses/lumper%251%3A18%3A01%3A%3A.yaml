simpleMeaning: A worker in a port who puts goods on ships and takes goods off them
scope: Also called a dock worker, dock-walloper, docker, dockhand, dockworker, and loader, this is a worker
  who loads and unloads ships in a port, not a scientist who groups living things.
examples:
- The lumper spent the morning loading crates onto the freighter.
- Lumpers unloaded the ship before the tide turned.
