simpleMeaning: a job or task done with a clear aim and hard work, especially one that needs much effort
  or brave action
scope: 'Also called endeavor, and another name for it is enterprise: one job or task done with a clear
  aim and hard work, not the general hard, serious activity of trying to do something.'
examples:
- Climbing the mountain alone was a brave endeavour.
- The new shop was a risky endeavour, but it worked.
