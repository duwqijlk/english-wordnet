simpleMeaning: A fast way for a horse to move, with each foot hitting the ground on its own
scope: A fast way a horse moves, not a cut of meat and not a tool that hurts people by stretching them.
examples:
- The horse broke into a rack as it crossed the field.
- At a rack, each of the horse's feet struck the ground one after another.
