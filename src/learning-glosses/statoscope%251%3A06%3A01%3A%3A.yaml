simpleMeaning: This tool keeps a record of how hard the air presses, and from it tells how far up or down
  a plane has moved, even by a little.
scope: It is for the small ups and downs of a plane's height, read off from how hard the air presses.
examples:
- The statoscope showed that the plane had climbed a little.
- The pilot watched the statoscope as the plane rose and fell by small amounts.
