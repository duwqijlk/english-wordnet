simpleMeaning: to make a person or a thing very tired by too much use, great strain, or stress
scope: To make a person or a thing very tired by too much use, great strain, or stress, also called wear,
  tire, weary, and jade, not boredom from too much of a thing and not soldiers' work.
examples:
- The long climb fatigued the whole party.
- Hours of digging fatigued his arms.
