simpleMeaning: A substance made for one job in the body, sent out by a gland or a cell, especially not
  waste.
scope: A substance made for one job and sent out by a gland or cell, not the act of making and sending
  it out.
examples:
- Sweat is a secretion of the skin.
- The gland's secretion helps the body digest food.
