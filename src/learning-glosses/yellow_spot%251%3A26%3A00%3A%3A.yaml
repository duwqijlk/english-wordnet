simpleMeaning: one of a few plant sicknesses, caused by a fungus or a virus, that leave gold marks on
  the leaves
scope: This is a plant sickness that leaves gold marks on leaves; not the small gold area in the eye that
  helps you see clearly.
examples:
- The leaves had yellow spot, with gold marks all over them.
- Yellow spot spread through the crop after the wet spring.
