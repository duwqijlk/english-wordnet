simpleMeaning: A tool shaped like a T, with a rubber edge across the top. You pull it across a wet surface,
  such as a window, to take off the water
scope: The tool itself, a T-shaped cleaner with a rubber edge, not the act of wiping a surface with such
  a tool.
examples:
- He used a squeegee to clear the water from the window.
- She pulled the squeegee down the wet glass.
