simpleMeaning: Less shaped for swimming than its long-necked kin, this sea beast of the past had arms
  and legs longer and thinner than theirs.
scope: A dead sea beast, not a fish and not a beast of the land, with limbs longer and thinner than those
  of its long-necked kin.
examples:
- Long ago, the nothosaur lived in the sea.
- Its long thin limbs set the nothosaur apart from its long-necked kin.
