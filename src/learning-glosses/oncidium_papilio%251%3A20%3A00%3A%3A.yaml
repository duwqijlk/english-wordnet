simpleMeaning: An orchid of South America and Trinidad with big yellow and red-brown blooms, at times
  put in one group with its close kin.
scope: Also called Psychopsis papilio; it is the South American orchid with big yellow and red-brown blooms,
  at times put in one group with its close kin.
examples:
- Oncidium papilio bloomed with big yellow flowers in the glasshouse.
- The Oncidium papilio in the show had red-brown marks on its blooms.
