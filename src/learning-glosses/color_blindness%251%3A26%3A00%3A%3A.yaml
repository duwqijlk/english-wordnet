senseId: 'color_blindness%1:26:00::'
synsetId: 14176492-n
simpleMeaning: A condition passed down in the family that makes a person unable to tell one shade from
  another
scope: A condition passed down in the family that leaves a person unable to tell shades apart; color vision
  deficiency, colour blindness and colour vision deficiency are other names for this sense, not poor sight
  in general and not a lack of sight.
examples:
- His color blindness means he cannot tell red from green.
- Color blindness runs in her family.
