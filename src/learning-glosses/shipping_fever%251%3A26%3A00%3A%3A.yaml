simpleMeaning: A deadly blood-poisoning sickness of cows and sheep, with high fever and lung sickness,
  caught through strain or cold, as often happens when beasts are sent to market.
scope: This sense is also called shipping pneumonia.
examples:
- Shipping fever struck the cattle.
- Shipping fever kills sheep.
