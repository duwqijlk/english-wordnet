simpleMeaning: A carving that stands out from its flat ground by a middling amount, between the lowest
  and the highest kinds
scope: 'Also called half-relief and mezzo-rilievo: a carving that stands out by a middling amount, not
  a nearly flat carving and not one that stands out far.'
examples:
- The mezzo-relievo showed the figures half free of the stone.
- She chose a mezzo-relievo for the wall, deeper than low relief but not fully round.
