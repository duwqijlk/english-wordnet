simpleMeaning: An eye operation that treats a kind of eye disease in which the eye's drain is shut, by
  cutting out part of the coloured ring of the eye.
scope: An eye operation that cuts out part of the coloured ring of the eye to treat a kind of eye disease,
  not an operation to remove the whole eye and not eye drops.
examples:
- The surgeon performed an iridectomy to ease the pressure in his eye.
- After the iridectomy, fluid could drain from her eye again.
