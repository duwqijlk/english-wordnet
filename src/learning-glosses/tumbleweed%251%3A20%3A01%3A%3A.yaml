simpleMeaning: a bushy wild plant in the middle part of North America that lives for one year and has
  greenish flowers and seeds with wing-like parts
scope: This kind is also called winged pigweed. It is a bushy plant of central North America, not any
  plant that breaks off and rolls in the wind and not the prickly plant from Europe and Asia.
examples:
- Tumbleweed with small greenish flowers grew across the dry field.
- The tumbleweed in this part of Texas had seeds with small wing-like parts.
