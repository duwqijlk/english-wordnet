simpleMeaning: the spot at the middle of the brow where the hair starts
scope: This is the spot at the middle of the brow where the hair starts, not the hairline at the side
  of the head and not the top of the nose.
examples:
- The crinion sits at the centre of the forehead where the hairline begins.
- She marked the crinion as the middle point of the brow.
