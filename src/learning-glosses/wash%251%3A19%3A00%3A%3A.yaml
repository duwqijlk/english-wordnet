simpleMeaning: the stream of air pushed backwards by a plane's spinning propeller
scope: This is air driven back by an aircraft propeller, not water flowing over ground, the dry bed of
  a stream, or a thin coat of paint, and race is another name for the same sense.
examples:
- The ground crew kept well clear of the propeller's wash.
- Loose papers blew across the tarmac, caught in the wash.
