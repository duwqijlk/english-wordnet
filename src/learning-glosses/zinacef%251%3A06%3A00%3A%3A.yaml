simpleMeaning: A drug of the cephalosporin kind that can be given by needle or taken by mouth as tablets;
  used for infections of the lungs, throat, ears, urinary tract, or meninges.
scope: Not penicillin or amoxicillin, other infection-fighting drugs; also called cefuroxime and Ceftin.
examples:
- The doctor gave him Zinacef for the chest infection.
- Zinacef cleared up the ear infection.
