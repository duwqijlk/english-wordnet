simpleMeaning: The female egg-making part of a plant, grown from the larger spore of a plant that makes
  two kinds of spores
scope: The female egg-making part of a plant that makes two kinds of spores, not the male part and not
  the spore itself.
examples:
- The megagametophyte grows inside the seed.
- In pines, the megagametophyte holds the eggs.
