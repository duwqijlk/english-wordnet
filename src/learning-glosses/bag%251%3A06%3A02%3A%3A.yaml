simpleMeaning: A purse holding money, keys and other small personal things, typically carried by women.
scope: A purse for money and personal items, not the larger travel case for clothes and not a soft, open
  container.
examples:
- She checked her bag for her phone before leaving the taxi.
- She dropped her keys and lipstick into her bag.
