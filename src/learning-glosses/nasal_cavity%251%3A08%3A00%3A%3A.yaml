simpleMeaning: Either of the two hollow spaces between the floor of the skull and the roof of the mouth,
  running from the face to the throat.
scope: Either of the two hollow spaces from the face to the throat, not the nose tip and not the throat
  itself.
examples:
- Air warms in the nasal cavity.
- Each nasal cavity runs from the face to the throat.
