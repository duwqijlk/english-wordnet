synsetId: 00694652-n
simpleMeaning: An operation that makes a hole into the windpipe and puts in a tube for air, done when
  the throat is blocked by swelling, cancer, or other causes
scope: This operation, also called tracheotomy, opens the windpipe so air can pass; it is not an operation
  on the lungs and not a tube put through the mouth.
examples:
- After the tracheostomy, he breathed through a tube in his throat.
- The doctors did a tracheostomy because swelling had blocked her throat.
