senseId: 'literally%4:02:00::'
synsetId: 00341857-r
simpleMeaning: In the exact, basic meaning of the words used, without treating them as a picture or an
  exaggeration.
scope: This is not the emphatic use before a figure of speech; it says that the words are meant exactly
  as they stand.
examples:
- He was literally born in that house, in the front bedroom.
- She literally walked ten miles to work that day.
