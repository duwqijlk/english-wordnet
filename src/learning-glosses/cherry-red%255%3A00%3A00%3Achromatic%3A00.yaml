simpleMeaning: having the warm color at one end of the rainbow, next to orange, like blood, tomatoes,
  or rubies
scope: Having the warm color at one end of the rainbow, next to orange; red, scarlet, crimson, ruby, cherry,
  reddish, ruddy, carmine, cerise, blood-red and ruby-red are other names for this sense, not a pale pink
  and not a dark purple.
examples:
- She wore a cherry-red dress.
- The cherry-red paint matched the tomatoes.
