simpleMeaning: a person who on purpose damages things or breaks them
scope: A person who damages things on purpose, also called wrecker and diversionist. Not the member of
  a secret group who helps an enemy that may attack.
examples:
- A saboteur cut the wires so the machines stopped working.
- The saboteur damaged the bridge on purpose during the night.
