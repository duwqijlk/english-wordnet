simpleMeaning: A bush that loses some leaves in winter yet keeps some green, grown for hedges.
scope: It is a half-green hedge bush, not a bush that stays fully green; also called common privet.
examples:
- Ligustrum vulgare is used for hedges.
- The Ligustrum vulgare hedge stayed partly green.
