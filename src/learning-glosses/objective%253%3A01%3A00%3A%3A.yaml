simpleMeaning: In grammar, about the form of a word when it is the object of a verb or of a linking word
  like 'to' (a preposition), and for some other uses
scope: 'The grammar use, as in ''objective case'': about the form a word takes as the object of a verb
  — not the glass-part sense in a telescope or microscope, and not the sense that means fair and based
  on facts.'
examples:
- In 'She saw him', 'him' is in the objective case.
- Teachers call 'me' an objective form in the sentence 'He called me'.
