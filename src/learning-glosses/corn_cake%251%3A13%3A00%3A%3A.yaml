simpleMeaning: a baked food made from maize, the yellow grain, cooked in a pan or on a hot flat plate
  in the south and midlands
scope: A baked food made from maize and cooked in a pan or on a hot plate in the south and midlands, not
  a sweet cake and not bread baked in an oven.
examples:
- She baked corn cakes in a pan for supper.
- The corn cake was still warm from the griddle.
