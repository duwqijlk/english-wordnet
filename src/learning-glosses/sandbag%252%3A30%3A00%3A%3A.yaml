simpleMeaning: to keep something safe or make it stronger by piling bags filled with sand against it,
  or to block a hole or opening with them
scope: To guard a place or block a hole with bags of sand; not the noun for the bag itself, not hiding
  your skill to fool others in a game, and not forcing a person by threats.
examples:
- The town sandbagged the river bank before the flood came.
- Workers sandbagged the doorway to stop the water getting in.
