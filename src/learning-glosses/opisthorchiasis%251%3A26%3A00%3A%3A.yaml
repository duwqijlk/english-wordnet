simpleMeaning: A sickness got from eating raw fish, in which small flat worms live in the body; found
  a lot in eastern Asia
scope: A worm sickness from raw fish, not a lasting body disorder and not a nerve illness.
examples:
- He caught opisthorchiasis after eating raw fish on the trip.
- Opisthorchiasis is common in parts of eastern Asia.
