simpleMeaning: Animals like prawns, whose mothers carry eggs and young in a pouch between the legs
scope: A pouch animal like a prawn, not a land animal and not a tree.
examples:
- The opossum shrimp carries her young in a pouch between her legs.
- We saw an opossum shrimp with eggs in the pouch between its legs.
