simpleMeaning: an insect that lives and works in groups; males and the queen who can breed usually have
  wings in the mating season; wingless females who cannot breed do the work
scope: The insect that lives in groups and works together; not a bee and not a spider.
examples:
- An ant can carry a piece of food much heavier than its own body.
- The ants worked together to build a nest under the ground.
