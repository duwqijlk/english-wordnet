simpleMeaning: about or near the thigh, or about or near the long bone in the thigh
scope: About the thigh or its long bone; not about the lower leg, the arm, or other parts of the body.
examples:
- The femoral vein runs down the inside of the thigh.
- A femoral muscle near his thigh hurt after the run.
