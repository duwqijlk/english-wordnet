schema: oewn-learning-gloss-v2
senseId: 'truly%4:02:04::'
synsetId: 00038407-r
simpleMeaning: used to add emphasis when saying that something is really so
scope: This is the emphatic use that adds force to a statement; it is not the sense of being factual or
  accurate, and not the sense of acting sincerely.
examples:
- It was a truly awful meal.
- I truly believe she meant no harm.
