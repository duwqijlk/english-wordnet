simpleMeaning: one of several kinds of small bird in the north of the world that eats insects and climbs
  tree trunks, holding itself up with stiff tail feathers and its feet
scope: 'Also called tree creeper: a small bird that climbs trees, not a plant that grows along the ground
  or a wall, and not a person who moves low on the ground.'
examples:
- A creeper climbed up the pine trunk looking for insects.
- We watched the creeper hold on to the bark with its stiff tail feathers.
