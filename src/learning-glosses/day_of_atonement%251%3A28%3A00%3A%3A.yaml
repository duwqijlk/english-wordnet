simpleMeaning: In Judaism, a solemn and great fast on the Jewish calendar, the 10th of Tishri, whose keeping
  is one of the rules of the Mosaic law
scope: In Judaism, this is a solemn and great fast on the 10th of Tishri; Yom Kippur is another name for
  this sense, and it stands apart from other Jewish holy days by its fast and its place in the Mosaic
  law.
examples:
- On the Day of Atonement, Jews fast and pray.
- The Day of Atonement falls on the 10th of Tishri.
