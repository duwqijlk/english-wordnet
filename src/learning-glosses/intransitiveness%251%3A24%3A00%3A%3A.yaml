simpleMeaning: In grammar, the way a verb works when it takes no object and needs nothing after it
scope: In grammar, the way a verb works when it takes no object, also called intransitivity; not the way
  a verb takes an object and not a verb itself.
examples:
- The intransitiveness of the verb 'sleep' means it stands alone in the sentence.
- Students learn about intransitiveness when they study verbs that take no object.
