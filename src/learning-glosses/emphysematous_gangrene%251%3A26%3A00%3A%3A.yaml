simpleMeaning: Clostridium germs whose poisons kill tissue usually set off this deadly sickness in pathology,
  where body tissue dies; it can be used as a weapon made from germs.
scope: It is also called clostridial myonecrosis, emphysematous phlegmon, gangrenous emphysema, gas gangrene,
  gas phlegmon and progressive emphysematous necrosis, and it is a deadly sickness where body tissue dies,
  usually set off by germs.
examples:
- Emphysematous gangrene is a deadly sickness where body tissue dies.
- Emphysematous gangrene can be used as a weapon made from germs.
