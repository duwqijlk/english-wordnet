simpleMeaning: a long robe without sleeves, worn by a priest for Mass
scope: A long robe without sleeves worn by a priest at Mass, not a daily robe and not a choir robe.
examples:
- The priest put on the chasuble before Mass began.
- The red chasuble was worn on the feast day.
