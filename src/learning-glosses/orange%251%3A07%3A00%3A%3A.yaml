simpleMeaning: a colour in the range between red and yellow, or a pigment of that colour
scope: The colour itself (also called orangeness), not the adjective, the pigment substance, or the fruit.
examples:
- The walls were painted a soft orange.
- The orange of the sunset deepened as evening came.
