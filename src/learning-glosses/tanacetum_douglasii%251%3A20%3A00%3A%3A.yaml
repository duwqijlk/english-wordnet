simpleMeaning: A long-lived lightly hairy plant with spreading roots, sweet-smelling feathery leaves,
  and open groups of small round yellow flowers on sand dunes of the Pacific coast of North America.
scope: Also called northern dune tansy; a hairy plant with yellow flowers that grows on sand dunes, not
  a tall shrub and not a garden flower.
examples:
- Tanacetum douglasii grows on the sand dunes near the sea.
- The yellow flowers of Tanacetum douglasii open in summer.
