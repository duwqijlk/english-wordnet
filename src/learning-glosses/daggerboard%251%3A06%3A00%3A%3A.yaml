simpleMeaning: a board in the middle of a small sailing boat that can be lowered into the water to act
  as a keel and can be taken out
scope: A board in the middle of a small sailing boat that can be lowered into the water to act as a keel
  and can be taken out; not a fixed keel and not a rudder.
examples:
- The daggerboard was lowered into the water.
- He pulled up the daggerboard as the boat came in.
