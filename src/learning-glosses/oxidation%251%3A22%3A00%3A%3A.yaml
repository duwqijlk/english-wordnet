simpleMeaning: The process by which oxygen is added to a compound, which then loses electrons, always
  happening together with reduction.
scope: The process of adding oxygen to a compound, with a loss of electrons, also called oxidisation or
  oxidization.
examples:
- Oxidation turned the iron red with rust.
- The metal showed oxidation after a wet winter.
