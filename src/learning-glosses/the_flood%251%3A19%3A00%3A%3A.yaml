simpleMeaning: In the Bible, the great rush of water over the earth that Genesis says came in the time
  of Noah, sent by God because people had grown wicked.
scope: 'Also called Noachian deluge, Noah''s flood and Noah and the Flood: in the Bible, the great rush
  of water in the time of Noah, not a small local flood and not a flood of any other time.'
examples:
- The Flood covered the whole earth in the Bible story.
- Noah built the ark before the Flood came.
