simpleMeaning: A drug that widens blood vessels, sold as Loniten for severe high blood pressure; extra
  hair growth is a side effect, so it is also sold for men's hair loss.
scope: Also called minoxidil and Loniten; a drug that widens blood vessels, first sold for high blood
  pressure and now also sold for hair loss in men.
examples:
- Rogaine is sold for hair loss in men.
- The drug in Rogaine was first sold as Loniten for high blood pressure.
