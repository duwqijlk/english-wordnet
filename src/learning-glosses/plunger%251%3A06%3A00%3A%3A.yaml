simpleMeaning: a part of a machine that moves suddenly down or pushes hard forward
scope: 'Also called piston: a machine part that moves down or forward, not the hand tool with a rubber
  cup used for blocked pipes and not a person who risks money.'
examples:
- The plunger in the pump moves down and pushes the water out.
- A broken plunger stopped the machine from working.
