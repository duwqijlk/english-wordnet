simpleMeaning: in law, the acts an English feudal tenant performed for his lord in exchange for the property
  granted to him
scope: This is the feudal land-law sense, not work done by one person or group that benefits another,
  not an act of help or assistance, not employment in or work for another, not the duties of a waiter
  or servant, not a branch of the armed forces, not an act of public worship, and not the act of delivering
  a writ or summons.
examples:
- In return for his land, the tenant owed service to the lord of the manor.
- The lord could demand service from every tenant who held land on the manor.
