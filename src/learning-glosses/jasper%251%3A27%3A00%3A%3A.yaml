simpleMeaning: a kind of quartz (a common hard mineral) that you cannot see through, red, yellow, brown,
  or dark green, used for pretty things or as a jewel
scope: A hard stone you cannot see through, in red, yellow, brown, or dark green; not clear quartz and
  not another kind of jewel stone.
examples:
- She wore a ring set with red jasper.
- The small box was made of dark green jasper.
