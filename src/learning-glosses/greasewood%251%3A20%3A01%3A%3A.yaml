simpleMeaning: In the west of America, where the soil is alkaline, the opposite of acid, grows a low,
  tough shrub with thorns and many branches.
scope: Black greasewood is another name for this low, tough, thorny shrub of the west of America.
examples:
- Greasewood grows in the alkaline soil of western America.
- The greasewood stood low, with many branches and thorns.
