simpleMeaning: in biology, the process by which a living thing develops step by step from a simple form
  into a more complex one
scope: The development of a single living thing, not an increase in size or number, a tumour, or the plants
  in an area.
examples:
- The growth of a seedling depends on light and water.
- The rapid growth of a tadpole into a frog takes several weeks.
