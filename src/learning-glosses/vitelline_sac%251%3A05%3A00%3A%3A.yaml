simpleMeaning: a thin skin that works as the blood system in the young of mammals until the heart starts
  to work
scope: A thin skin that works as the blood system in the young of mammals, also called umbilical vesicle,
  vesicula umbilicus and yolk sac; not the womb and not the heart itself.
examples:
- The vitelline sac works as the blood system until the heart starts to work.
- In the early young, the vitelline sac does the work of the heart.
