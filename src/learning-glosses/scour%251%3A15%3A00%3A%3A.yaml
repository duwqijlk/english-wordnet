simpleMeaning: A place that has been worn away, especially by running water.
scope: A place worn away, especially by running water, not the act of washing a thing out with liquid.
examples:
- The scour at the foot of the bridge showed where the water had worn the stone away.
- Running water had left a deep scour in the riverbed.
