simpleMeaning: to fix a part or short pipe to a container so liquid can be let out from it
scope: To fix a part to a barrel or other container so liquid can come out, not the part itself, not a
  plug for a barrel hole, and not listening in secret to a phone line.
examples:
- They tapped the barrel of wine and fitted a spout so guests could draw a drink.
- He tapped a new cask and put in a spout before the party.
