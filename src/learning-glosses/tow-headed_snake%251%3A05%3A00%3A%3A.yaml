simpleMeaning: A boa of the grass lands and woods of western North America, that looks and feels like
  rubber, with its tail and head of much the same shape
scope: A boa of the grass lands and woods of western North America that feels like rubber; rubber boa
  is another name for this sense, and not a water snake or a desert snake.
examples:
- The tow-headed snake lives in the grasslands of the west.
- Its tail and head looked much the same on the tow-headed snake.
