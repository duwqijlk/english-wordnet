senseId: 'lycium_barbarum%1:20:00::'
synsetId: 12925895-n
simpleMeaning: A shrub that sheds its leaves, upright or spreading, with spiny branches and violet-purple
  flowers followed by orange-red berries; from southeastern Europe to China.
scope: Also called common matrimony vine, Duke of Argyll's tea tree, and Lycium halimifolium; a spiny
  shrub with violet-purple flowers, not a rose and not a fruit tree.
examples:
- Lycium barbarum bears orange-red berries after its violet flowers fade.
- The spiny branches of Lycium barbarum make it a good hedge.
