simpleMeaning: White or greenish flesh with no musky smell fills fruit with a smooth white skin, borne
  on a climbing plant, one of many kinds of vine.
scope: Also called honeydew melon and winter melon vine, this is a climbing plant that bears smooth white-skinned
  fruit, not the fruit itself.
examples:
- Winter melon vines bear fruit with a smooth white skin and white or greenish flesh.
- Winter melon climbs and bears fruit with white or greenish flesh and no musky smell.
