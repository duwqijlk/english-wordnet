simpleMeaning: An evergreen long-lived plant with a ring of long spoon-shaped leaves and heads of pink,
  pink-purple, or white-and-red-striped flowers, on cliffs and cracks in southwest Oregon and north California
  mountains.
scope: Not other plants of the same genus, nor other pink-flowered cliff plants; also called siskiyou
  lewisia.
examples:
- Lewisia cotyledon blooms on the cliff face.
- We saw Lewisia cotyledon in the mountains.
