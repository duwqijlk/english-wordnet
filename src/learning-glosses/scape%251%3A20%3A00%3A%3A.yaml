simpleMeaning: a flower stalk with no leaves that stands straight up and grows straight from the ground,
  such as on a tulip
scope: 'Another name for flower stalk: a stalk with no leaves that grows straight from the ground. Not
  the up-and-down part of a column in a building.'
examples:
- The tulip's scape grew straight up from the ground with no leaves.
- Each scape held one flower and had no leaves at all.
