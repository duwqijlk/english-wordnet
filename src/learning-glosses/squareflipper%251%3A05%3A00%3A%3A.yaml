simpleMeaning: On each side of its nose, this seal of the far north seas has stiff hairs; it is of middle
  size and greyish to yellow in colour.
scope: Bearded seal, square flipper, and square flipper seal are other names for this seal of the far
  north seas, of middle size and greyish to yellow in colour, with stiff hairs on each side of its nose,
  and not a seal of warm seas.
examples:
- The squareflipper had stiff hairs on each side of its muzzle.
- A squareflipper lives in the Arctic Ocean.
