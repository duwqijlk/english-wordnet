simpleMeaning: A severe illness, often deadly, in people, monkeys and chimpanzees, caused by a virus;
  it brings high temperature and severe inner bleeding, spreads between people, and occurs mostly in Africa.
scope: A deadly viral illness, also called Ebola and Ebola hemorrhagic fever, found mostly in Africa and
  spread between people.
examples:
- The Ebola fever outbreak spread quickly through the town.
- She survived Ebola fever after weeks in hospital.
