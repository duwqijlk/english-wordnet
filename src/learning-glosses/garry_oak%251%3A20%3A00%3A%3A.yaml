simpleMeaning: A small tree of the west of North America that sheds its leaves each year, with bent branches
  and pale grey bark.
scope: Also called Oregon oak, Oregon white oak, or Quercus garryana, this small tree of the west of North
  America is set apart by its bent branches and pale grey bark.
examples:
- The Garry oak by the road had bent branches and pale grey bark.
- Garry oaks lose their leaves each year in the west of North America.
