simpleMeaning: To stir up hope, want, or a wish to know more in someone, and then give them nothing
scope: To raise hopes or a wish to know more and leave them unmet, not picking on a person with mean words
  and not combing hair back.
examples:
- The advertisement teased customers with a glimpse of the new phone.
- She teased him with hints about the surprise but never told him what it was.
