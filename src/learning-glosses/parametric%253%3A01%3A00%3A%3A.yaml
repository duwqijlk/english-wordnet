simpleMeaning: about, to do with, or shown through a chosen value that stays fixed in one case but may
  change in another
scope: This links a thing to a chosen value of that kind; it is not about a value that never changes at
  all, and not about size or shape on their own.
examples:
- The chart shows a parametric curve drawn from two sets of values.
- They used a parametric model that changes when the starting value changes.
