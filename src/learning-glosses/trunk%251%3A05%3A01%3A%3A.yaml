simpleMeaning: a long nose that can bend, as on an elephant
scope: This is an elephant's long nose, not the main part of a tree, not the back part of a car for bags,
  and not the middle part of a body.
examples:
- The elephant used its trunk to pick up the peanut.
- The elephant lifted its trunk and sprayed water over its back.
