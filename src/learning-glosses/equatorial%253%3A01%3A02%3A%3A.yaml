simpleMeaning: To do with the line around the middle of a round body, or at that line.
scope: To do with any equator, or found at one, not the telescope, not the conditions at the earth's equator,
  and not the use for what lies at or near the earth's equator.
examples:
- The equatorial diameter of the planet is its widest line.
- Scientists measured the equatorial bulge of the gas giant.
