simpleMeaning: a unit of weight used for medicines, equal to 20 grains (a grain is a very small unit of
  weight)
scope: A unit of weight for medicines, equal to 20 grains; not a feeling of doubt about whether an act
  is right, and not a moral rule that stops a person from acting.
examples:
- The old recipe called for one scruple of the dried herb.
- He weighed out two scruples of the powder for the medicine.
