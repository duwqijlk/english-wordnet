simpleMeaning: Not spreading pollution or contamination, especially radioactive material.
scope: This describes something that does not pollute, not something washed, free of dirt, or skilfully
  done.
examples:
- The plant uses clean energy that releases no harmful pollution.
- Engineers tested the soil to confirm it was clean of radioactive contamination.
