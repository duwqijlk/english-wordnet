simpleMeaning: a long horizontal pole, tapered at the ends, that holds and spreads a square sail or a
  lateen, a triangular sail.
scope: The sail pole, not the railway depot, the ground around a house, or the unit of length.
examples:
- The sailors climbed out along the yard to furl the sail.
- A sudden gust snapped the yard in two.
