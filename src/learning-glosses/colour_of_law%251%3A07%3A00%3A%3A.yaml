simpleMeaning: a mere show of a right that seems to come from the rules but is in fact against the rules
scope: This is a mere show of a right that seems to come from the rules but is against them, also called
  color of law; not a real right and not a wrong done with no show of right at all.
examples:
- The officer acted under colour of law when he took the man's rights away.
- She claimed the search was done under colour of law, though it broke the rules.
