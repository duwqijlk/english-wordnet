simpleMeaning: A severe, early-onset form of diabetes controlled by diet and insulin injections, marked
  by heavy urination, great thirst, hunger, weight loss and bouts of blood acid build-up.
scope: Another name for the early-onset, insulin-treated form of diabetes also called juvenile-onset diabetes;
  not the adult-onset type 2 form, and not diabetes insipidus.
examples:
- Her insulin-dependent diabetes mellitus was diagnosed when she was nine.
- People with insulin-dependent diabetes mellitus must inject insulin every day.
