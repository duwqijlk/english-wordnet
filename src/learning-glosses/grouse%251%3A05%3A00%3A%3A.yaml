simpleMeaning: a bird that many people hunt for sport, with a fat round body and with feathers on its
  legs and feet
scope: This is the live bird that people hunt for sport, not its meat served as food and not the act of
  hunting it.
examples:
- A grouse flew up from the grass when we walked past.
- The grouse has feathers all the way down to its feet.
