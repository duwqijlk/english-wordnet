simpleMeaning: This corn plant was grown for young ears that are sweet and good to eat.
scope: Also called Zea mays rugosa, green corn, sugar corn, sweet corn and sweet corn plant, this is a
  corn plant grown for sweet young ears that are good to eat, not flour corn, whose kernels are almost
  all soft starch.
examples:
- We grew Zea saccharata in the garden for its sweet young ears.
- The Zea saccharata was ready to pick while its ears were still young and sweet.
