simpleMeaning: Of a situation that falls neatly into two sides that cannot both be true.
scope: Of a situation that falls neatly into two sides that cannot both be true; not a matter with room
  for middle views and not a plain fact.
examples:
- He saw the choice in black-and-white terms.
- There are no black-and-white answers to this problem.
