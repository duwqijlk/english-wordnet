simpleMeaning: to show a particular quality of movement or handling when someone operates it.
scope: Not the act of operating a vehicle; this sense describes how the vehicle itself behaves.
examples:
- This old sedan drives smoothly even on rough gravel roads.
- The rental van drives like a much smaller vehicle.
