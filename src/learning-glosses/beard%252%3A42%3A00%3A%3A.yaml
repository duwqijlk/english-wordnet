simpleMeaning: Trace the outline of something, the way hair runs around the chin.
scope: The verb for lining an edge, not the facial hair, the tuft on a plant or the threads of a shellfish.
examples:
- Tall pines beard the ridge above the valley.
- Ivy bearded the old wall from end to end.
