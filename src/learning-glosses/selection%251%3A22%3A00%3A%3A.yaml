simpleMeaning: In nature, the change of living things over time, as those best fitted to their place live
  on and pass on their kind
scope: Also called survival; the working of nature on living things, not the act of picking something,
  not the thing picked, and not a piece taken from a longer work.
examples:
- Natural selection shaped the birds of the island over many ages.
- The selection of the fittest goes on in every wild place.
