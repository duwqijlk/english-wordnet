simpleMeaning: A small sea creature that lives on the sea floor in warm waters, with a flat body, a long
  nose and a mouth with no teeth
scope: A small sea creature that lives on the sea floor in warm waters, with a flat body, a long nose
  and a mouth with no teeth, not a shark and not a ray.
examples:
- The bellows fish hid on the sea floor, its long snout poking from the sand.
- Bellows fish live in warm seas and feed with their toothless mouths.
