simpleMeaning: a thin bag of skin-like tissue that can stretch, most often holding liquid or gas
scope: A stretchy sac, most often holding liquid or gas, such as the sac that stores urine before it leaves
  the body.
examples:
- The bladder stretched as it filled with urine.
- A fish's swim bladder holds gas to help it float.
