simpleMeaning: Plants with long green or red sour leaf stems in clumps at the base; only the stems can
  be eaten when cooked, and the leaves are poisonous
scope: Also called rhubarb plant, this is the living plant, not the cut sour stems sold and eaten as food.
examples:
- Rhubarb grows in large clumps at the back of the garden.
- Do not eat rhubarb leaves, because they are poisonous.
