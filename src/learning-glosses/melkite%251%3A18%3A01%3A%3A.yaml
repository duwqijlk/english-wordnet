simpleMeaning: An eastern Christian in Egypt or Syria who holds the Orthodox faith as laid out by the
  council of Chalcedon in 451 and as taken up by the Byzantine ruler.
scope: 'Also called Melchite: an eastern Christian in Egypt or Syria who holds the Orthodox faith of Chalcedon
  in 451, not the Orthodox or Rome-joined Christian of Alexandria, Antioch or Jerusalem.'
examples:
- The Melkite church in Syria holds the faith of Chalcedon.
- Melkite Christians in Egypt follow the council of Chalcedon of 451.
