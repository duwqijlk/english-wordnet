simpleMeaning: the first coast seen on a trip by boat, or on a flight over water
scope: The first coast seen on a boat trip or on a flight over water; not just any coast, and not the
  act of landing.
examples:
- Landfall was sighted just after sunrise, a dark line of coast ahead.
- The pilot reported landfall as the coast came into view below the plane.
