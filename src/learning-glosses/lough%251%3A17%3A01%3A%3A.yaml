simpleMeaning: A narrow bay in Ireland that stretches far into the land, almost shut off from the sea
scope: A long narrow bay in Ireland, almost shut off from the sea, not a wide open bay and not a lake.
examples:
- The fishermen anchored in the lough before nightfall.
- We walked along the shore of the lough at dawn.
