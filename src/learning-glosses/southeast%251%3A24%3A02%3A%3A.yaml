simpleMeaning: the way that lies between south and east, toward the corner where the two meet
scope: The way toward the corner between south and east, not the compass mark itself and not a place in
  that corner.
examples:
- We drove southeast for an hour before we stopped.
- The road runs southeast toward the coast.
