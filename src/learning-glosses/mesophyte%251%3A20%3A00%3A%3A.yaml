simpleMeaning: Where the water is neither too much nor too little, a land plant lives, between dry-land
  plants and water plants
scope: A land plant with an average supply of water, also called a mesophytic plant, not a dry-land plant
  and not a water plant.
examples:
- The mesophyte grew well in the garden's damp soil.
- Mesophytes need more water than desert plants.
