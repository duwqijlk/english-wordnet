senseId: 'coquette%2:32:00::'
synsetId: 01039782-v
simpleMeaning: To speak or act fondly, with no serious aim.
scope: This sense is also called a butterfly, a flirt, a romance, a mash, a dally, and a philander, for
  speaking or acting fondly, with no serious aim, where a butterfly is talking or acting in a loving way
  with someone, without meaning it in a serious way, a flirt is talking or acting in a loving, sexual
  way with someone, without meaning it in a serious way, and a romance is talking to or acting with someone
  in a loving way, without meaning it in a serious way, unlike the sense for a tempting woman, working
  her charms to use men.
examples:
- She coquetted with him, fond but not serious.
- Coquetting means acting fondly with no serious aim.
