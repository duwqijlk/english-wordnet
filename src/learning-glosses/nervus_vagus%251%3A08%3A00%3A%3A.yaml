simpleMeaning: a nerve that carries messages both ways and reaches the throat, voice box, lungs, heart,
  food pipe, stomach, and most of the organs in the belly
scope: 'Also called pneumogastric, pneumogastric nerve, tenth cranial nerve, vagus, vagus nerve, and wandering
  nerve: a nerve that reaches the throat, lungs, heart, and belly, not a nerve of the arm and not a nerve
  that stays in the head.'
examples:
- The nervus vagus reaches the throat, lungs, heart, and stomach.
