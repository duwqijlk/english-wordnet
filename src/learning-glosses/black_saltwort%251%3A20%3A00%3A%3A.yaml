simpleMeaning: Pink or white flowers grow on this small thick herb of North American shores and of marshes
  where fresh and sea water mix.
scope: Also called sea milkwort and sea trifoly, this small herb grows on North American shores and in
  brackish marshes, not on dry ground inland.
examples:
- Black saltwort grew along the edge of the marsh near the sea.
- We saw black saltwort with pink flowers by the shore.
