simpleMeaning: in a way that makes people laugh, or that should make people laugh
scope: In a way that makes people laugh or should make them laugh; also called ridiculously, laughably,
  and preposterously. Not in a way that is only a little odd or a little funny.
examples:
- The hat was ludicrously large for his small head.
- He asked a ludicrously high price for his old bike.
