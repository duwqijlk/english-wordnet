simpleMeaning: White berries follow greenish flowers on this common climbing plant of the eastern and
  central United States, with leaves in threes; touch its oil and a rash breaks out.
scope: Also called poison ivy and poison oak; a common climbing plant of the eastern and central United
  States whose oil brings out a rash on touch.
examples:
- The markweed climbed the fence behind the shed.
- Touching markweed gave him a rash on his arms.
