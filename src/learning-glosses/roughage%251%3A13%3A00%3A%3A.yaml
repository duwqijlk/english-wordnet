simpleMeaning: Coarse plant food the body cannot break down has little food value in it, yet its size
  makes the gut squeeze and push food along.
scope: It is also called fiber and fibre, and it is coarse plant food the body cannot break down, not
  food the body takes goodness from.
examples:
- Eating roughage helps keep the gut moving.
- The diet had little roughage, so the gut moved slowly.
