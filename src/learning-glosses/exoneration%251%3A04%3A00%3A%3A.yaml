simpleMeaning: the act of showing that a person did nothing wrong and defending them when others blame
  or speak against them
scope: 'Also called vindication: this is the act of clearing a person of blame, not the state of being
  free from blame or duty.'
examples:
- The lawyer's work led to the prisoner's exoneration.
- The exoneration of the nurse by her friends helped stop the blame against her.
