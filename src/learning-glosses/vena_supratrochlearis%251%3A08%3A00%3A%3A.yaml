simpleMeaning: On the forehead, this blood tube takes blood from the front of the scalp to the one above
  the eye, the two joining at the corner of the eye.
scope: Also called a supratrochlear vein, it is the forehead tube that drains the front of the scalp and
  meets the one above the eye to form the one at the corner of the eye.
examples:
- Blood from the front of the scalp drains through the vena supratrochlearis.
- The vena supratrochlearis joins the blood tube above the eye.
