simpleMeaning: Scarlet fruit grows on this woody plant of eastern North America that spreads along the
  ground, with shiny leaves that stay green all year.
scope: Also called boxberry and partridgeberry, it is a woody plant of eastern North America with scarlet
  fruit and shiny leaves that stay green all year.
examples:
- Along the ground in eastern North America, twinberry spreads with woody stems.
- On woody stems that spread along the ground, twinberry bears scarlet fruit.
