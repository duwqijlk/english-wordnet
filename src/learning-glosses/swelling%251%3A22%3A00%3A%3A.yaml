simpleMeaning: the way some things grow larger in size when they are heated, often with water coming out
  of them
scope: The growing larger of a heated thing; not a raised part made larger on the body and not a part
  that sticks out from a surface.
examples:
- The swelling of the heated clay was easy to measure.
- Heat caused a clear swelling in the material.
