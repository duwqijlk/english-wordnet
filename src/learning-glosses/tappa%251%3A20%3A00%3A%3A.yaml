simpleMeaning: The thin stringy outer skin of the paper mulberry and Pipturus albidus
scope: The thin stringy outer skin of the paper mulberry and Pipturus albidus, also called tapa, tapa
  bark, and tappa bark; not the cloth made from it and not the inner wood.
examples:
- Tappa from the paper mulberry was pounded into cloth.
- They soaked the tappa to soften it for beating.
