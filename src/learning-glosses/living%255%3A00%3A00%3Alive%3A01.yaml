simpleMeaning: Stone or mineral left in the natural place where it formed, not mined or quarried.
scope: This is not the sense that describes a creature that is not dead, nor a language still in use;
  it applies only to rock or minerals left in the ground where they formed.
examples:
- The chapel was carved directly into living rock.
- They built the cellar into the living rock instead of using quarried blocks.
