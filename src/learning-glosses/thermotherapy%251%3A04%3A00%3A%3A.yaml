simpleMeaning: The use of heat to treat illness, with heating pads, hot cloths, or hot-water bottles,
  to help blood flow in limb blood-vessel illness or to ease tight muscles.
scope: For treatment by heat, as with hot pads or hot-water bottles.
examples:
- Thermotherapy uses heat to treat illness.
- They tried thermotherapy for tense muscles.
