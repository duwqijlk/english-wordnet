simpleMeaning: a new growth that has just come from a plant or, especially, from a seed that is starting
  to grow
scope: This is the small new part on a plant itself, not the act of a plant putting out such parts or
  of a seed starting to grow.
examples:
- A tiny sprout came up from the seed in the pot.
- She watered the small green sprout every morning.
