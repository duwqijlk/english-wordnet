simpleMeaning: A group of guns, or things that fire missiles, worked together in one place.
scope: A group of guns worked together in one place, not a thing that makes power, and not the pitcher
  and catcher in baseball.
examples:
- The battery of guns fired at the enemy ships.
- A battery of missile launchers stood on the hill.
