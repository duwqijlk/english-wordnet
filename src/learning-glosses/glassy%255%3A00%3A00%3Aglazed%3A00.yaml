simpleMeaning: 'Of pots and other clay ware: having a shiny skin that lets no water through, made by melting
  a clear coat onto it'
scope: 'Of clay ware: a shiny surface that lets no water through, not smooth like glass and not a dull,
  rough surface.'
examples:
- The glassy porcelain shone in the light.
- The glassy surface of the plate would not let water in.
