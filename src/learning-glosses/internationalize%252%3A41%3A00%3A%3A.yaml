simpleMeaning: To place something under the joint control of many nations.
scope: Placing a thing under the joint control of many nations, also called internationalise; not giving
  it the ways of many nations.
examples:
- They moved to internationalize trade in certain drugs.
- The treaty would internationalize the port.
