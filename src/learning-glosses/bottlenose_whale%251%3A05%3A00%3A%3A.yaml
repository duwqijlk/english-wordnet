simpleMeaning: A large sea animal of the north Atlantic with a beak-like snout and a round, swollen forehead
scope: A large sea animal of the north Atlantic with a beak-like snout and a round, swollen forehead,
  also called bottlenose and bottle-nosed whale; not a whale of warm southern seas and not a whale with
  a flat forehead.
examples:
- We saw a bottlenose whale off the coast of Norway.
- The bottlenose whale has a round forehead like a swollen bump.
