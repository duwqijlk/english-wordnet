simpleMeaning: The seeming surface of a great ball shape imagined in the sky, with the sun, moon, stars
  and other bodies in space seeming to lie on it
scope: The sky as it seems to be a surface with things in space on it, also called heavens, sphere, empyrean
  and celestial sphere; not the real air or space itself.
examples:
- Stars seemed to shine from the firmament above us.
- He looked up at the firmament on a clear night.
