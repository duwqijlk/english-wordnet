simpleMeaning: With a head shaped like a flat spade, this small, harmless fish of the hammerhead kind
  is found in large numbers in bays and where rivers meet the sea.
scope: A bonnet shark is also called a bonnethead or a shovelhead.
examples:
- A bonnet shark swam through the bay.
- We saw a bonnet shark near the mouth of the river.
