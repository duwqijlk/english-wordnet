simpleMeaning: having a thin edge or a pointed tip, or being made with one, so it can cut or pierce
scope: This describes a blade or tool that can cut, not something that merely ends in a point and not
  a pain that feels like a cut.
examples:
- Use a sharp knife to slice the bread.
- These scissors are not sharp enough for fabric.
