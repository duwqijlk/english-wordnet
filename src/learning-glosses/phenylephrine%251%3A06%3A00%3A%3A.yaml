simpleMeaning: a strong drug that narrows the blood tubes, used to widen the pupils and to clear a stuffed
  nose
scope: A strong drug that narrows the blood tubes, used to widen the pupils and clear a stuffed nose;
  not a drug that widens the blood tubes and not a pain-killer.
examples:
- The nurse put phenylephrine drops in his eyes to widen the pupils.
- Phenylephrine cleared his stuffed nose by narrowing the blood tubes.
