simpleMeaning: not able to make a defence in the body after meeting an antigen, a thing that sets off
  the body's defence
scope: Not able to make a defence in the body after meeting a thing that sets it off; not the opposite
  state, where a defence can be made, and not a short illness.
examples:
- Immunodeficient patients must avoid contact with sick people.
- The researchers worked with immunodeficient rodents in the lab.
