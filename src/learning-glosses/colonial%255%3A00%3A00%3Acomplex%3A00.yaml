simpleMeaning: made of many separate living things joined together to form one whole or colony
scope: Made of many living things joined as one whole, also called compound; not about a land ruled by
  another country and not a person who lives in such a land.
examples:
- Coral is colonial because many tiny living things join together to make one whole.
- The colonial sponge is really many small living things joined as a single body.
