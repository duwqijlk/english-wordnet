simpleMeaning: Meat dishes and milk dishes can both take food with no meat and no milk, or anything made
  from them, under the food laws of Judaism.
scope: 'Also called parve: food with no meat or milk in it, fit to eat with meat dishes or with milk dishes.'
examples:
- The pareve margarine has no milk in it.
- We served pareve bread with the meat dinner.
