simpleMeaning: In psychoanalysis, a way the mind, without the person knowing, joins two ideas or pictures
  into one sign, especially in dreams
scope: This is the mind sense in psychoanalysis, not water that forms on a cold surface from air.
examples:
- In his dream, the condensation joined his father and his teacher into one figure.
- The doctor said the condensation in her dream put two people together as one.
