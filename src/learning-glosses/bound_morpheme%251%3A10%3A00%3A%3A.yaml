senseId: 'bound_morpheme%1:10:00::'
synsetId: 06317935-n
simpleMeaning: A bit of word meaning that never stands on its own but only inside a bigger whole, such
  as the -s at the end of plural nouns.
scope: Also called a bound form, this bit of word meaning only stands inside a bigger whole, not on its
  own as a word.
examples:
- The bound morpheme -s marks the plural of nouns.
- A bound morpheme must join a bigger word to make sense.
