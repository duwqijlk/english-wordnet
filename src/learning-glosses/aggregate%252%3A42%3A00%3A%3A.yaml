simpleMeaning: to add up to a total amount
scope: This is the verb sense that says what things add up to in total. It is not the building material
  made of sand and stone, and not the sense that means made of many small parts joined close together.
examples:
- The three bills aggregate to more than two hundred dollars.
- When added together, the payments aggregate to a large sum.
