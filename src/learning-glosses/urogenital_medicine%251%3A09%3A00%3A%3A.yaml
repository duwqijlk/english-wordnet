simpleMeaning: The doctoring that looks after the parts that pass water and the parts that make babies,
  finding what is wrong and treating it.
scope: Urology is another name for this doctoring, which finds and treats sicknesses of the parts that
  pass water and the parts that make babies.
examples:
- The doctor who works in urogenital medicine found what was wrong and put it right.
- A patient whose water parts were sick was helped by urogenital medicine.
