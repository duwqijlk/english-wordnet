senseId: 'continuation%1:07:00::'
synsetId: 05059047-n
simpleMeaning: the result of something being made to last for a longer time
scope: 'Also called prolongation and protraction: the result of something lasting longer, not the act
  of going on without a break and not a part added to a book or play.'
examples:
- The continuation of the course from six weeks to eight gave students more time to practise.
- The continuation of winter into April delayed the planting of crops.
