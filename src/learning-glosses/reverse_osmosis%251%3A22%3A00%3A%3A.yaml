senseId: 'reverse_osmosis%1:22:00::'
synsetId: 13549644-n
simpleMeaning: 'In chemistry, a way to make pure water: liquid pressure stronger than the liquid''s own
  natural pull forces a solvent through a membrane''s tiny holes, against the usual flow.'
scope: This is the pressure-driven purification method, not natural osmosis, in which a solvent crosses
  a membrane without added pressure, and not distillation.
examples:
- The desalination plant uses reverse osmosis to turn seawater into fresh drinking water.
- Engineers chose reverse osmosis because it removes salts and other dissolved solids from water.
