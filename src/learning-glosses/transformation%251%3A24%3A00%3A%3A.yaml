simpleMeaning: In mathematics, a rule that matches points to new points and changes the place or direction
  of the axes (the lines of a system for showing where points are)
scope: This is the mathematics sense, about moving or turning the lines used for points, not a change
  to a living cell and not a rule for changing sentence forms.
examples:
- We used a transformation to turn the axes on the graph.
- In class, a transformation turned the lines of the chart by a quarter turn.
