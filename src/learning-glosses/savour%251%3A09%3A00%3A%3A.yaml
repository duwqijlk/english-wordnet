simpleMeaning: the taste you feel in your mouth when you take in something added to food to give it a
  salty or spicy taste, not a sweet one
scope: The taste itself in the mouth, from something added to food to give it a salty or spicy taste;
  not the act of getting pleasure from something.
examples:
- The savour of the spicy sauce filled her mouth.
- He paused to enjoy the rich savour of the hot, salty sauce.
