simpleMeaning: A bad itch on the body comes from lice, the kind called Pediculus humanus, living on it.
scope: Lousiness is another name for this state, in which lice live on the body and make it itch badly.
examples:
- The skin itched badly from pediculosis.
- Lice living on the body brought on pediculosis.
