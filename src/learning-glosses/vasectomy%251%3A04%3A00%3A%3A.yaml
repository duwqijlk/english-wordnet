simpleMeaning: A surgical act that takes away all or part of the vas deferens, usually as a means of sterilization,
  at times able to be undone.
scope: Surgery removing all or part of the vas deferens, usually for sterilization; sometimes reversible.
examples:
- Their vasectomy was done at dawn.
- The vasectomy was undone at last.
