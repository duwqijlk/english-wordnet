simpleMeaning: to make a musical instrument sound at the right pitch by changing its notes
scope: To make a musical instrument sound at the right pitch, not a row of notes, not setting a radio
  and not the state of sounding at the right pitch.
examples:
- My piano needs to be tuned before the concert.
- He tuned his guitar between the songs.
