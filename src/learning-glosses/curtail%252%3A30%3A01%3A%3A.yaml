simpleMeaning: to stop something before it is meant to end, or to make it shorter or less than it is meant
  to be
scope: Also called clip. This means something is stopped early or made shorter or less than it was meant
  to be; it is not about cutting a piece off a physical thing.
examples:
- The trip was curtailed by bad weather.
- The government curtailed free speech in the city.
