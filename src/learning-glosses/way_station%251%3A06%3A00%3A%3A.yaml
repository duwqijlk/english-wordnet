simpleMeaning: a small train stop between the main stops, or a stop where a train halts only when a signal
  is given
scope: 'Also called flag stop and whistle stop: a small train stop between big stops, not a main train
  station and not a bus stop.'
examples:
- The way station had only a small shed and a bench.
- The train slowed at the way station when the guard waved a flag.
