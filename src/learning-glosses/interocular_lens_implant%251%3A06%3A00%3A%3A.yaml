simpleMeaning: a clear piece of man-made stuff put inside the eye, most often after the eye's own clear
  part has been taken out in an operation for a cloudy eye
scope: A clear piece of man-made stuff put inside the eye, also called a lens implant; not glasses worn
  outside the eye and not a lens that sits on the eye's surface.
examples:
- The surgeon fitted an interocular lens implant after the cataract operation.
- An interocular lens implant gave her clear sight again.
