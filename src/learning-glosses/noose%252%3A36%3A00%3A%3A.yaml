simpleMeaning: To tie a loop in a rope or cord, so that it pulls tight when the end is pulled.
scope: Making a loop in rope or cord, not the loop itself as a thing and not catching birds with a trap.
examples:
- He noosed the rope around the post.
- She noosed the cord and pulled the loop tight.
