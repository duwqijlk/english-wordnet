simpleMeaning: Either of two small silvery sea animals without scales, from the north Pacific, that dig
  into the beach.
scope: A small silver sea animal of the north Pacific that digs into the beach; not the other fish of
  the same name in warm western seas and not a sand eel.
examples:
- Sandfish bury themselves in the beach at low tide.
- The sandfish is so small you can miss it in the shallows.
