simpleMeaning: A single tooth sticking out from the rim of a toothed wheel.
scope: 'Also called cog: a single tooth sticking out from the rim of a toothed wheel, not a thin wheel
  with teeth that engage with a chain, and not a roller with teeth on its rims that pulls film or paper
  through.'
examples:
- One sprocket on the wheel had broken off.
- They filed the broken sprocket smooth so it would not snag.
