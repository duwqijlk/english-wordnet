simpleMeaning: a pile of sand, or a box filled with sand, for children to play in
scope: 'Also called a sandbox: a pile of sand or a box of sand for children to play in, not a large pit
  in the ground where sand is dug out.'
examples:
- The children built castles in the sandpit all afternoon.
- He put a small sandpit in the garden for his daughter.
