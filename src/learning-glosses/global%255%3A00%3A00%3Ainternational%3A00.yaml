simpleMeaning: Involving or affecting the whole world, not just one country or small area.
scope: This is not about a round shape, and not about the whole of a single file or set of data; it is
  only about things that cover the whole world.
examples:
- Climate change is a global problem.
- The company has a global network of offices.
