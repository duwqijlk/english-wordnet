simpleMeaning: To keep making someone angry or upset by saying unkind things to them again and again
scope: To keep making someone angry or upset by saying unkind things again and again, also called needle;
  not the pointed tool used to poke animals.
examples:
- His sister liked to goad him about his mistakes.
- Stop goading her with those mean remarks.
