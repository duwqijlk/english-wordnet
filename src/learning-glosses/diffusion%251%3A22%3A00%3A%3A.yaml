simpleMeaning: In physics, the course by which a substance moves from a place of high strength of that
  substance to a place of lower strength.
scope: In physics, the course by which a substance moves from a place of high strength of that substance
  to a place of lower strength; not the act of spreading or scattering a thing, nor the state of being
  spread or scattered.
examples:
- Their diffusion spread the dye.
- The diffusion was seen at dawn.
