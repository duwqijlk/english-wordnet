simpleMeaning: Pakistan's spy service, a strong political, military force almost on its own, with nuclear
  arms know-how and ways to send them, close to the Taliban and other armed Islamic groups
scope: Pakistan's spy service; Directorate for Inter-Services Intelligence and ISI are other names for
  this sense, not a military unit that fights battles or a foreign spy service.
examples:
- Inter-Services Intelligence has long shaped politics in Pakistan.
- Reporters say Inter-Services Intelligence keeps close ties with armed groups.
