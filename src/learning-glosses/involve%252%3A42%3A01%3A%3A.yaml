simpleMeaning: to link a person closely to something, often in a way that shows they took part in a crime
scope: 'Also called regard and also called affect: to link a person closely to something, often a crime,
  not just to include something or to need something.'
examples:
- The police report involved two men in the bank crime.
- New letters involve her in the plan to steal the money.
