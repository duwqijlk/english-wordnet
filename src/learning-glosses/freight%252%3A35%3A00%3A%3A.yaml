simpleMeaning: To put goods into a vehicle or ship so they can be carried somewhere.
scope: This is loading goods for carrying somewhere; not the goods themselves, and not carrying people.
examples:
- Workers freighted the lorry with crates before dawn.
- They freighted the ship with grain for the long voyage.
