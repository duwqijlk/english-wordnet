simpleMeaning: the study of the body by its parts or areas, with care for how things in one area, such
  as muscles, nerves, and arteries, link to each other
scope: Also called regional anatomy and topographic anatomy, this is the study of body areas and how their
  parts link, not the maths sense and not the study of a place's shape and history.
examples:
- He studied topology to understand how muscles and nerves fit together in the hand.
- The book on topology describes each area of the body and the structures inside it.
