simpleMeaning: about or like the old way of ruling land, where a king gave land to rich lords and they
  let poorer people use it
scope: About the old land-ruling system with kings and lords, not about any old king or castle on its
  own.
examples:
- The village lived under a feudal lord who owned all the land.
- In feudal times, poor farmers worked on land owned by a lord.
