senseId: 'universalise%2:32:00::'
synsetId: 01024749-v
simpleMeaning: To make a thing apply to all people or places
scope: To make a thing apply everywhere; universalize is another name for this sense, not to make a thing
  local and not to copy a thing.
examples:
- The writer tried to universalise the old story.
- The new rule will universalise safety checks in all schools.
