simpleMeaning: Much like the limber pine, this small pine of the west of North America has a smooth pale
  grey outer covering and wood that is soft and breaks easily.
scope: Also called whitebarked pine, this small pine of the west of North America is the one with a smooth
  pale grey outer covering and soft wood that breaks easily, much like the limber pine.
examples:
- Whitebark pine grew in the west of North America.
- The whitebark pine had a smooth pale grey outer covering.
