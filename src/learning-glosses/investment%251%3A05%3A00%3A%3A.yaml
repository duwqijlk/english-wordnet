simpleMeaning: A layer that wraps the outside of an organ, a body part, or a whole living thing.
scope: This is an anatomical covering around a body organ, not a ceremonial promotion, a robe worn for
  ritual, or money placed for profit.
examples:
- The surgeon cut through the fibrous investment around the kidney.
- In the dissection, the outer investment of the organ was peeled away.
