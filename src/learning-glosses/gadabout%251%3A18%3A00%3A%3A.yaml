simpleMeaning: a person who keeps moving from place to place in search of fun and company
scope: A person who cannot sit still and seeks fun and company, not a traveller with a purpose and not
  a partygoer who stays in one place.
examples:
- She was a real gadabout, never spending two nights in the same town.
- The old gadabout knew everyone in the village and was always out visiting.
