simpleMeaning: a man who has joined the army or marines and holds the lowest rank
scope: 'Also called private and common soldier: a man who has joined the army or marines and holds the
  lowest rank, not an officer and not a soldier of higher rank.'
examples:
- The buck private stood at the back of the line on his first day.
- As a buck private, he took orders from every officer above him.
