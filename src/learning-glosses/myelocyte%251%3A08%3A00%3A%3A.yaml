simpleMeaning: A young white blood cell (a leukocyte) that is usually found in the soft stuff inside bones.
scope: A young white blood cell found in the soft stuff inside bones, not a grown white blood cell and
  not a red blood cell.
examples:
- The sample held many myelocytes.
- Myelocytes are young white blood cells found inside bones.
