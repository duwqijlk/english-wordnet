senseId: 'conventionality%1:09:00::'
synsetId: 05658025-n
simpleMeaning: Lack of fresh ideas, because a thing sticks too closely to what is usual.
scope: Lack of fresh ideas from sticking too closely to what is usual; not the holding of usual views
  as the right ones, and not simply going along with the usual thoughts and ways of behaving.
examples:
- The conventionality of the play bored the audience.
- His conventionality showed in every safe choice he made.
