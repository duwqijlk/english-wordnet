simpleMeaning: Its long back and belly fins, together with the end fin, give this big fish people eat
  from warm seas worldwide a three-lobed look at the back.
scope: A big food fish of warm seas around the world, whose fins make it look as if it had three tails,
  though it has only one.
examples:
- The tripletail we caught was big enough to feed the whole family.
- Tripletails swim in warm waters around the world.
