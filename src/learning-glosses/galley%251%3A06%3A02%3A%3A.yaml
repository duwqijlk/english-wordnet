simpleMeaning: In ancient Greek and Roman times, a boat with a thin curved shape, moved on the sea by
  oars (long flat pieces of wood pushed through water)
scope: This is an old boat for the sea, not the small kitchen area on a plane where food is made ready.
examples:
- The men rowed the galley slowly across the sea.
- A galley with many long oars carried soldiers in old times.
