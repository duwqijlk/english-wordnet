simpleMeaning: a set charge for borrowing money, usually a percentage of the amount borrowed
scope: This is not an activity you enjoy or a share in a company; it is the fee a lender charges for the
  use of money.
examples:
- The loan carries interest of five percent a year.
- She paid the card off early to avoid mounting interest.
