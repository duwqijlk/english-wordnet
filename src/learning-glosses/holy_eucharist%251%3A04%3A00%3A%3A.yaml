simpleMeaning: A Christian rite that recalls the Last Supper by blessing bread and wine
scope: This is a Christian rite that recalls the Last Supper by blessing bread and wine, also called Liturgy,
  Eucharist, Eucharistic liturgy, Holy Sacrament, Lord's Supper and sacrament of the Eucharist; near rivals
  are baptism and confirmation.
examples:
- The Holy Eucharist is shared at the Sunday service, with bread and wine blessed in memory of the Last
  Supper.
- At the Holy Eucharist, the priest blesses bread and wine as the Last Supper is recalled.
