simpleMeaning: a soft yellowish suede leather (leather with a soft surface that is not smooth), made at
  first from deer skin but now usually from sheep skin
scope: This is a kind of soft leather, not a horse of a light yellowish color with a dark mane and tail.
examples:
- She wore gloves made of soft yellow buckskin.
- His jacket was made from buckskin that came from sheep skin.
