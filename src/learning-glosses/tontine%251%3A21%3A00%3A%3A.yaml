simpleMeaning: People pay into a shared pot and draw yearly payments; when one dies, that share goes to
  those still alive, until a set time ends or only one is left.
scope: A shared pot that people pay into and draw yearly payments from, with each death passing that share
  to those still alive.
examples:
- The neighbours joined a tontine and paid in every year.
- Her share of the tontine grew each time another member died.
