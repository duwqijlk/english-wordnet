senseId: 'sell_short%2:40:00::'
synsetId: 02247968-v
simpleMeaning: To trade shares, goods, or foreign money that you do not own, hoping to buy them back at
  a lower price and so make money
scope: Trading things you do not own to buy them back cheaper, not a plain sale of things you own and
  not buying to keep.
examples:
- He decided to sell short when the shares looked too dear.
- To sell short is to trade what you do not own.
