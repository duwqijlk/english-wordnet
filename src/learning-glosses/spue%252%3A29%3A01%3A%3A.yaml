simpleMeaning: to force spit or thick mucus out of the mouth
scope: To force spit or thick mucus out of the mouth, also called spit, spew, ptyalise and ptyalize, not
  to swallow it and not to throw up food.
examples:
- He had to spue the thick mucus from his mouth.
- She tried to spue after the bitter medicine touched her tongue.
