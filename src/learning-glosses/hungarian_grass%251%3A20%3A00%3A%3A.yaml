simpleMeaning: A coarse annual plant that resists drought, grown for grain, hay, and feed in Europe and
  Asia, and mostly for feed and hay in the United States.
scope: Also called foxtail millet, Italian millet, and Setaria italica; a coarse grain plant, not wheat.
examples:
- Hungarian grass grew well in the dry field.
- Farmers cut Hungarian grass for hay.
