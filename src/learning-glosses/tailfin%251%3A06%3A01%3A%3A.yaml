simpleMeaning: one of two raised shapes above the back wheel covers of a car, made to look good
scope: This is one of a pair of raised shapes above the back of a car; tail fin and fin are other names
  for this sense, not a fish's fin and not a part of a plane.
examples:
- The tailfin on the old car swept up over the back wheel.
- Both tailfins on the car were painted red.
