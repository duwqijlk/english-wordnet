simpleMeaning: the act of complaining in a weak, sad voice while crying
scope: 'Also called sniveling: the act of complaining while crying, not breathing hard through a blocked
  nose and not pulling liquid up through the nose.'
examples:
- All I could hear was his snivel as he sat crying and complaining.
- Her soft snivel went on as she wiped her eyes and complained.
