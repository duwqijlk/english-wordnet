simpleMeaning: a branch of the main artery of the belly that feeds the smaller curve of the stomach and
  the part of the food pipe inside the belly
scope: Another name for the left gastric artery; it feeds only the smaller curve of the stomach and the
  belly part of the food pipe, not the larger curve.
examples:
- The arteria gastrica sinistra runs along the smaller curve of the stomach.
- During the operation, the surgeon tied off the arteria gastrica sinistra to stop the bleeding.
