senseId: 'kala-azar%1:26:01::'
synsetId: 14201559-n
simpleMeaning: Tiny living things of the group Leishmania, spread by sandflies, bring on a tropical sickness
  whose marks are open sores on the skin.
scope: People also call these sores kala azar, leishmaniasis, or leishmaniosis.
examples:
- His arms were marked by kala-azar sores.
- The kala-azar sores came from a sickness spread by sandflies.
