synsetId: 00130563-n
simpleMeaning: in baseball, a runner who has to run is got out when a fielder holds the ball and stands
  on the base the runner must reach first
scope: Also called force, force out and force play, this is an out in baseball for a runner who must run,
  not a catch that puts a batter out.
examples:
- The shortstop got the force-out at second base.
- With the bases full, a force-out ended the inning.
