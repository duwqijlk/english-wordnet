simpleMeaning: the trouble of moving or handling something because of its size or shape
scope: The trouble of moving or handling something because of its size or shape, not clumsy movement and
  not stiff, uneasy behaviour.
examples:
- The movers cursed the awkwardness of the big piano.
- The awkwardness of the long box made it hard to carry upstairs.
