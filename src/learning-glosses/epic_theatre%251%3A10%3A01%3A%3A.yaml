simpleMeaning: Speaking straight to the watchers with reasons, debate, or facts, it often stops the story,
  in a kind of play meant to teach, of loosely joined scenes that shun pretence.
scope: This is a kind of play meant to teach, not a play that keeps up pretence all through.
examples:
- The epic theatre stopped the story to speak straight to the watchers.
- In epic theatre, the scenes stay loosely joined and shun pretence.
