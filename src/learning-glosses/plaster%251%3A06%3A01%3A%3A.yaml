simpleMeaning: a surface on a wall or ceiling made of a mix that has set hard
scope: The hard surface itself on a wall or ceiling, not the wet mix used to make it and not a covering
  put on a cut.
examples:
- There were small cracks in the plaster on the wall.
- He touched the cold plaster of the ceiling.
