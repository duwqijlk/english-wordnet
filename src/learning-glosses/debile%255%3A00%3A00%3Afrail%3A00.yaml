simpleMeaning: 'low in bodily power: the muscles have little strength, and the body has little life or
  energy'
scope: This is a body with little strength in it, also called weak, weakly, feeble, rickety, infirm and
  decrepit; not a weak mind and not a wobbly chair.
examples:
