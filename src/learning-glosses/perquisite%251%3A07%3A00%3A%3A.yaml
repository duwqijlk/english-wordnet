senseId: 'perquisite%1:07:00::'
synsetId: 05186242-n
simpleMeaning: A right held by one person or one group and no one else, especially one that comes by birth
  or with an office.
scope: Also called privilege or prerogative, a right held by one person or one group and no one else,
  especially one that comes by birth or with an office, not an extra gain that comes with some kinds of
  work, especially one seen as a right.
examples:
- Free travel was a perquisite of the job, kept for senior staff alone.
- The perquisite of free housing went only to the head of the college.
