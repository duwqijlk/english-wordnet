simpleMeaning: In physics, the rule that, within the stretch limit, the pull on a solid grows in step
  with the stretch it makes.
scope: In physics, a rule about how solids stretch under a pull, not a rule about heat and not a rule
  about moving bodies.
examples:
- Hooke's law helps engineers test springs.
- When the pull on the spring doubled, the stretch doubled too, just as Hooke's law says.
