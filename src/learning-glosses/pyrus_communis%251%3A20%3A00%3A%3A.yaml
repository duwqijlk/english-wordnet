simpleMeaning: A tree from the Old World with sweet fruit full of juice and rough to the bite, grown widely
  in many kinds.
scope: Also called pear and pear tree; a tree from the Old World with sweet juicy fruit, not a tree with
  sour fruit and not a small bush with red fruit.
examples:
- Pyrus communis in the garden gives sweet fruit every autumn.
- Farmers grow Pyrus communis in many kinds across the valley.
