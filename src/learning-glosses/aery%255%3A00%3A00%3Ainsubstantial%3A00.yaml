simpleMeaning: so light and thin that it has no weight or solid body, like air
scope: Something light and thin like air, with no weight or solid body; airy, aerial, ethereal and aeriform
  are other names for this sense, not a bird's high nest.
examples:
- The aery figures in the poem seemed to melt away.
- She spoke of aery fancies that drifted through her mind.
