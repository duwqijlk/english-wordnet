simpleMeaning: To throw back an image of something, as calm water does with the sky above it.
scope: Sending back a visible image, as a still surface does, not resembling something or showing a faithful
  likeness.
examples:
- At dawn, the lake mirrors the mountains perfectly.
- The glass tower mirrors the clouds passing behind it.
