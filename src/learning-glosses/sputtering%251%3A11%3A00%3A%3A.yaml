simpleMeaning: the broken noise made when something bursts out in small drops or bits
scope: The broken noise of something bursting out in drops, also called sputter, splutter, splatter or
  spatter, and not a steady roar or a single bang.
examples:
- He heard the sputtering of the engine.
- The sputtering of gunfire came from the far field.
