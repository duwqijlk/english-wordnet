senseId: 'defibrillator%1:06:00::'
synsetId: 03176301-n
simpleMeaning: A machine that gives an electric shock of set strength to the heart through the chest,
  to try to bring back its normal beat when its lower parts shake fast
scope: This is the machine that shocks the heart to bring back its normal beat, not a machine that only
  watches the heart or keeps its beat going.
examples:
- When her heart beat in a wild, uneven way, the doctor used a defibrillator on her chest.
- The team carried a defibrillator and gave his heart a shock to bring back its normal beat.
