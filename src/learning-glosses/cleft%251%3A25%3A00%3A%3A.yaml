simpleMeaning: where a surface dips in or splits apart, as in the roof of the mouth or the chin
scope: A split or a dip in a thing, not a long narrow crack in rock and not the leaf shape.
examples:
- The baby was born with a cleft in the roof of his mouth.
- She had a small cleft in her chin.
