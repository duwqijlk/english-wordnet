simpleMeaning: Prison inmates make this liquor by mixing things such as prunes, raisins, milk, and sugar,
  and letting the mix ferment until it turns into alcohol.
scope: A liquor that prison inmates make by mixing things such as prunes and raisins and letting them
  ferment, not a drink bought ready-made.
examples:
- The pruno was made from prunes and raisins left to ferment.
- The inmates made pruno from milk and sugar.
