simpleMeaning: A substance made when the amino part of one amino acid joins with the acid part of another
  amino acid; usually got by partly breaking down protein with water
scope: This is a substance made when amino acids join together, not a whole protein and not a single amino
  acid on its own.
examples:
- The lab made a short peptide in a test tube.
- This peptide is formed from two amino acids.
