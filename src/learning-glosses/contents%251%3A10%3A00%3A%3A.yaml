senseId: 'contents%1:10:00::'
synsetId: 06501650-n
simpleMeaning: a list in a book or paper that names its parts, such as chapters or articles, and shows
  the pages where each part starts
scope: This is the list at the start of a book or paper that names its parts and the pages where they
  start. It is not the things that are inside a box, a bag, or a book.
examples:
- The contents at the front of the book show that chapter 3 starts on page 40.
- She looked at the contents to find the article she wanted.
