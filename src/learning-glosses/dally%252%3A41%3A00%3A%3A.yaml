simpleMeaning: to act with no care and no real interest in what you do
scope: This sense is acting with no care or real interest, also called play, toy, and flirt; it is not
  talking in a loving way without serious plans.
examples:
- He dallied with her feelings and never thought about how she felt.
- They dallied over the small job and gave it no real care or thought.
