senseId: 'gastrolobium%1:20:00::'
synsetId: 12550410-n
simpleMeaning: An Australian evergreen shrub whose leaves grow in rings of leaflets, with showy yellow
  to orange-red flowers and pods of two seeds; foliage is toxic to livestock.
scope: The Gastrolobium shrub, also called poison bush and poison pea; not the Swainsona plants that share
  the poison bush name and poison sheep.
examples:
- Gastrolobium shrubs covered the hillside with yellow and orange-red flowers.
- The farmer fenced off the gastrolobium to keep the sheep away.
