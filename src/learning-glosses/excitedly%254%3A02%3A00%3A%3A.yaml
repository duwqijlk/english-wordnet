simpleMeaning: in a way that shows a happy, eager feeling and lots of energy
scope: Used for the way someone does something, with a strong feeling and lots of energy; not a word that
  names a person who feels that way.
examples:
- She waved excitedly when she saw her friends arrive.
- The children talked excitedly about the trip all morning.
