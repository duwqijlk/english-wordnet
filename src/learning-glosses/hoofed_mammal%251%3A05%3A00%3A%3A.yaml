simpleMeaning: any of a group of warm-blooded animals with hard feet, alike in looks but not always close
  kin
scope: Any of a group of warm-blooded animals with hard feet, alike in looks but not always close kin;
  ungulate is another name for this sense, not a clawed animal and not a sea creature.
examples:
- A horse is a hoofed mammal, and so is a deer.
- Most hoofed mammals graze on grass and leaves.
