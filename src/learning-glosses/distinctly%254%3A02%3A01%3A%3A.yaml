senseId: 'distinctly%4:02:01::'
synsetId: 00309032-r
simpleMeaning: In a way that is clear and easy to tell one thing from another.
scope: In a way that is clear and easy to tell one thing from another, not clear only in the mind and
  not to a high degree.
examples:
- She spoke distinctly so that everyone could hear her.
- He could see the hills distinctly in the clear air.
