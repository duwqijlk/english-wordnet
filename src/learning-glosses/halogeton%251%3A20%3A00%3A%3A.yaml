simpleMeaning: Harmful to sheep and cattle on western grasslands because it holds much of a salt that
  poisons them, this rough one-year herb was brought to North America from Siberia.
scope: This rough one-year herb was brought from Siberia to North America and is known by the harm it
  does to sheep and cattle on western grasslands.
examples:
- Halogeton spread across the western rangelands.
- The rancher cleared halogeton from the pasture.
