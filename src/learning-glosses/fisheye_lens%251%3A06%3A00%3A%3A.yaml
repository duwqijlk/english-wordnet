senseId: 'fisheye_lens%1:06:00::'
synsetId: 04590498-n
simpleMeaning: Its pictures come out squeezed in the middle and bent more toward the edges, since this
  lens takes in a wider view than normal, usually with a short focal length.
scope: Also called wide-angle lens, this is a camera lens with a very wide view that bends the picture
  at the edges, not a normal lens and not a zoom lens.
examples:
- The photographer used a fisheye lens to capture the whole room.
- A fisheye lens bends straight lines near the edges of the photo.
