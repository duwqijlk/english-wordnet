simpleMeaning: the act of checking or changing a measuring tool, by matching it against a set standard,
  so it reads true
scope: The act of checking or changing a measuring tool, by matching it against a set standard, so it
  reads true; standardization and calibration are other names for this sense, not the making of a tool
  and not the use of a tool.
examples:
- Standardisation of the scale took an hour.
- The standardisation made the gauge read true.
