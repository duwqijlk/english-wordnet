simpleMeaning: A pilot steers a plane by what the dials and gauges show, with no view of the ground or
  sky
scope: Flying a plane by what its dials show alone; not flying by looking out of the window and not flying
  on a clear day by sight.
examples:
- The pilot used instrument flying through the thick cloud.
- In instrument flying, the pilot trusts the dials, not the view outside.
