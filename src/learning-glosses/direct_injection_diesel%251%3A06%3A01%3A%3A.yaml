simpleMeaning: A diesel engine that sprays fuel into the top of the combustion chamber, with nozzles opened
  either by hydraulic pump pressure or by an electronic signal from the engine controller.
scope: Another name for the direct injection diesel engine; the term names the whole engine, not its injectors,
  and not an indirect injection diesel.
examples:
- A direct injection diesel uses less fuel than an indirect injection diesel.
- In a direct injection diesel, the injectors sit at the top of the combustion chamber.
