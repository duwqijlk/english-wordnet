simpleMeaning: A grass that lives one year or through the winter, with soft hairy leaves, from the lands
  around the Mediterranean Sea.
scope: Also called cheatgrass, downy brome, downy bromegrass, downy cheat, downy chess, and drooping brome;
  a grass of the lands around the Mediterranean Sea, distinct from the long-lived grasses that return
  each year.
examples:
- Bromus tectorum spreads fast across the dry hills of the Mediterranean lands.
- Farmers pull up Bromus tectorum before it takes over the field.
