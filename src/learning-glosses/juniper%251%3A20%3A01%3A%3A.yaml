simpleMeaning: the wood of a coniferous (cone-bearing) shrub or small tree with cones that look like berries
scope: This is the wood of the plant, not the living shrub or small tree itself and not a desert shrub
  with small white flowers.
examples:
- The small chest was made of juniper wood.
- He cut a piece of juniper to make the box.
