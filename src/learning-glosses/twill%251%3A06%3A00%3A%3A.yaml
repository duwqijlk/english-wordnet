simpleMeaning: a cloth with raised lines that run across it at an angle, side by side
scope: This is the cloth itself, not the way of making such cloth and not the act of making it.
examples:
- He wore a jacket made of strong cotton twill.
- The twill showed clear raised lines running at an angle.
