simpleMeaning: A crooked business, such as blackmail, cheating, drug selling, or selling sex, run to make
  money.
scope: A crooked business run to make money; racket and illegitimate enterprise are other names for this
  sense, not a lawful business and not a single crooked act.
examples:
- The police broke up a fraudulent scheme that sold drugs.
- He ran a fraudulent scheme to blackmail rich men.
