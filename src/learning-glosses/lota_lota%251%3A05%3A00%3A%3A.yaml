simpleMeaning: A long thin cod of fresh water in northern Europe, Asia and North America, with thin feelers
  around its mouth.
scope: A long thin fresh-water cod of the north, also called ling, burbot, cusk and eelpout; not a sea
  cod and not an eel.
examples:
- Lota lota lives in the cold fresh waters of the north.
- The thin feelers of Lota lota hang around its mouth.
