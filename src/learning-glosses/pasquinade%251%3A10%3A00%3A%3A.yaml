schema: oewn-learning-gloss-v2
senseId: 'pasquinade%1:10:00::'
synsetId: 06793148-n
simpleMeaning: A piece of writing or other work that copies or twists the way a person writes or works,
  most often to make people laugh
scope: 'Also called mockery, parody, a takeoff, a travesty, burlesque, a spoof, or a lampoon: a piece
  of writing or other work that copies or twists the way a person writes or works, most often to make
  people laugh, not a fair copy and not a plain insult.'
examples:
- The magazine printed a pasquinade of the mayor's speech.
- His pasquinade of the poet's style made the whole class laugh.
