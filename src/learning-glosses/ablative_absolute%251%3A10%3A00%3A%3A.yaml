senseId: 'ablative_absolute%1:10:00::'
synsetId: 06323602-n
simpleMeaning: 'in Latin, a part of a sentence: a noun with the word that goes with it, which can stand
  on its own and say something about the whole sentence'
scope: In Latin grammar, it is a noun with its modifier that can stand apart from the rest of the sentence,
  not a phrase that forms part of the main clause.
examples:
- In the ablative absolute 'the city having been taken, they fled', the first part stands apart from the
  rest.
- Latin teachers point to the ablative absolute when a noun and its modifier stand on their own.
