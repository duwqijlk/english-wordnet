simpleMeaning: a drug made from amphetamine (a drug that speeds up the body), sold as Methedrine in crystal
  salt form; it speeds up the nerves and cuts hunger
scope: Also called glass, ice, trash, chalk, meth, crank, methamphetamine, chicken feed, deoxyephedrine
  and methamphetamine hydrochloride. This is a drug that speeds up the body, not a food or a drink.
examples:
- Police found shabu hidden in a small plastic bag.
- Using shabu kept him awake and stopped him eating.
