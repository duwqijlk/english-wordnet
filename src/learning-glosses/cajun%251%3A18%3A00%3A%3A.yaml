simpleMeaning: A person from Louisiana whose family came from French settlers who left Nova Scotia.
scope: This is a person from Louisiana descended from French settlers from Nova Scotia; not other people
  of Louisiana with different roots, and not the French settlers themselves.
examples:
- Her grandmother was a Cajun from the bayou country.
- The Cajun spoke French at home with his family.
