simpleMeaning: In maths, a number that a rule for turning one number into another comes nearer and nearer
  to as one number grows without end
scope: Also called a limit or a limit point, this is a number in maths that a rule comes nearer and nearer
  to as its input grows without end, not the number the rule starts with.
examples:
- The point of accumulation of the rule is 2, since the answers come closer and closer to 2 as the input
  grows.
- For this rule, the point of accumulation is 0, because the answers shrink toward 0.
