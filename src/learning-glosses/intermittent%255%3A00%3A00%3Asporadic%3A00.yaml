simpleMeaning: Stopping and starting again, with gaps that do not come at set times.
scope: This is about something that stops and starts with gaps at uneven times; not something that goes
  on without a break, and not something that happens once.
examples:
- Intermittent rain showers kept us indoors all afternoon.
- The patient had intermittent pains through the night.
