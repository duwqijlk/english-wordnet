simpleMeaning: to steal things from a place, and take them as the goods won in war or by force
scope: 'Also called rifle: stealing things and taking them as goods won by force; not just emptying a
  place, and not taking the dry leaves off a plant.'
examples:
- During the riot, people stripped the empty shops and carried the goods home.
- The army stripped the beaten town, taking its food and gold as spoils.
