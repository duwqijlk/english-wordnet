simpleMeaning: to show that something is true or correct with facts, reasons, or test results
scope: This is not about testing something to see how it works and not about turning out to be true; it
  is about establishing the truth.
examples:
- Scientists have proved that the new drug works.
- Can you prove where you were on the night of the fire?
