simpleMeaning: A business that lends money to people and firms, often tied to a firm that owns other firms
  or to a maker of goods
scope: A business that lends money to people and firms, not a bank that keeps savings and not a shop that
  sells goods on credit.
examples:
- She took out a loan from a finance company to buy a car.
- The finance company lent the small shop money to buy new stock.
