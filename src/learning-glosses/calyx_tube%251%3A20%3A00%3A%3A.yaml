senseId: 'calyx_tube%1:20:00::'
synsetId: 11710723-n
simpleMeaning: The small green outer leaves, the pollen stalks and the outer cup of the flower sit in
  this cup, ring or tube, as in roses.
scope: 'Also called floral cup and hypanthium: the cup, ring or tube of a flower, not the petals and not
  the stalk that holds the flower.'
examples:
- The calyx tube of the rose held the petals in place.
- In this flower the calyx tube is shaped like a narrow cup.
