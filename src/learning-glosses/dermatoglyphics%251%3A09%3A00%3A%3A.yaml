simpleMeaning: The study of the curls, loops, and arches in the skin of the fingertips, the palms, and
  the soles of the feet
scope: The study of curls, loops, and arches in finger and foot skin, not the study of hand bones and
  not palm reading.
examples:
- Some police experts study dermatoglyphics to tell people apart.
- Dermatoglyphics looks at the patterns on fingertips and palms.
