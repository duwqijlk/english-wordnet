senseId: 'slipstream%1:19:00::'
synsetId: 11443311-n
simpleMeaning: the flow of air pushed back by a plane's propeller (its spinning blades that pull the plane
  forward)
scope: This is the air pushed back behind a plane; race, wash and backwash are other names for this sense.
  It is not the moving air behind a fast car that makes it easier for a car behind to keep up.
examples:
- Standing behind the plane, he felt the strong slipstream from its propeller.
- The slipstream pushed the grass flat as the plane took off.
