simpleMeaning: a secret group of people who work together to bring down a government or to drive out an
  army that holds their land
scope: 'Also called underground: a secret group that tries to bring down a government or drive out an
  army holding its land. Not open fighting by soldiers and not saying no to a plan in public.'
examples:
- During the war, she worked for the resistance and hid soldiers in her house.
- The resistance met in secret to plan how to drive out the enemy army.
