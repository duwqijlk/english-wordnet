simpleMeaning: A person who stays calm under strain, waits with patience and faces danger with courage
scope: Calm courage under strain, not a lack of feeling and not a burst of anger.
examples:
- Fred has nerves of steel; he faced the thugs without fear.
- You need nerves of steel to stay calm when the crowd turns hostile.
