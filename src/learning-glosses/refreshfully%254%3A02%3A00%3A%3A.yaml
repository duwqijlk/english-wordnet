simpleMeaning: in a way that takes away tiredness and makes a person feel strong and fresh again
scope: 'Another name for this is refreshingly: in a way that takes away tiredness and brings back strength,
  not in a way that only cools the air or cheers someone up.'
examples:
- The cool breeze blew refreshfully through the open window.
- She splashed cold water on her face and felt refreshfully awake again.
