simpleMeaning: before emptying into the inner jugular vein in the neck, this face vein joins the vein
  behind the jaw, carrying on from the angular vein
scope: 'Also called vena facialis anterior: a vein of the face that runs on from the angular vein into
  the jugular vein, not an artery and not a vein of the arm or leg.'
examples:
- The anterior facial vein joins the vein behind the jaw.
- Blood from the face drains through the anterior facial vein.
