simpleMeaning: the fact that a thing holds onto a surface it touches
scope: This is the quality that makes a thing hold onto a surface, not the glue or other stuff itself
  that does the holding.
examples:
- The stickiness of the tape helped it stay on the box.
- Wash off the stickiness left by the sweet drink on the table.
