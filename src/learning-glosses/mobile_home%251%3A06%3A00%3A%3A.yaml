simpleMeaning: Lived in for good, this big house on wheels can be parked in one place and hooked up to
  water and power
scope: 'Also called a manufactured home: a house on wheels lived in for good, not a holiday caravan and
  not a house built on one plot of land.'
examples:
- They bought a mobile home and parked it near the lake.
- Her mobile home has water and power hooked up all year.
