simpleMeaning: The tongue into which the Bible was put in the 800s, the tongue of the Slavs of long ago.
scope: Also called Church Slavic, Church Slavic language, Old Bulgarian, Old Bulgarian language, Old Church
  Slavic, Old Church Slavic language and Old Church Slavonic; the Slavic tongue into which the Bible was
  put in the 9th century, the tongue of the early Slavs.
examples:
- Old Church Slavonic language was the tongue of the first Slavic Bible.
- The Bible was read in Old Church Slavonic language in the old churches.
