senseId: 'headpiece%1:06:01::'
synsetId: 03511172-n
simpleMeaning: the band that is part of a bridle (the straps put on a horse to guide it), and that fits
  around the horse's head
scope: 'Also called headstall: only the band that goes around the horse''s head. It is not the whole set
  of straps used to guide the horse.'
examples:
- The headpiece of the bridle was too tight around the horse's head.
- She cleaned the leather headpiece before she put the bridle on the horse.
