simpleMeaning: the amount of something that fills one bowl for holding water or food
scope: An amount measured by one full bowl, not the bowl itself, not a fixed sink for washing, and not
  land where water runs into a river.
examples:
- She used a basin of water to wash the vegetables.
- He added a basin of flour to the large mixing bowl.
