simpleMeaning: Found in western Europe, above all around the western Mediterranean and along Atlantic
  coasts, this smooth one-year plant has a thin main root and clusters of white flowers
scope: A smooth one-year plant with a thin main root and clusters of white flowers, found in western Europe;
  not a coral and not a necklace worn round the neck.
examples:
- Coral necklace grew along the path with small white flowers.
- The coral necklace in the meadow had a thin main root.
