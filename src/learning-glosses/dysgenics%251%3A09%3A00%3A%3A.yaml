synsetId: 06052221-n
simpleMeaning: the study of how some things at work cause the children that are born to be weaker in kind
scope: The study of what makes the kind of children born get worse, not the study of what makes them better,
  and also called cacogenics.
examples:
- The course on dysgenics looked at how poor food made later children weaker.
- His book on dysgenics asked why the children born to each new age were weaker than before.
