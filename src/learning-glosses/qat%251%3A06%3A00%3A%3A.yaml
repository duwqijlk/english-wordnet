simpleMeaning: A lift in mood and a waking of the body come from leaves of a bush called Catha edulis,
  chewed like tobacco or brewed as tea.
scope: Cat, kat, khat, and quat are other names for these leaves, chewed like tobacco or brewed as tea.
examples:
- In Yemen, qat is used daily by most adults.
- The qat leaves were chewed like tobacco.
