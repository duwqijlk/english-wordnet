simpleMeaning: Birds of southeast Asia and the East Indies that nest in trees and carry upright crests,
  unlike true swifts.
scope: Also called tree swift; a bird with an upright crest that nests in trees, not a true swift.
examples:
- A crested swift nested in the tall tree.
- We watched a crested swift fly over the forest.
