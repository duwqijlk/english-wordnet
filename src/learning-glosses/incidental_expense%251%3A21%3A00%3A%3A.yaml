simpleMeaning: A cost that was not planned for and not named in the plan, often in the plural.
scope: A cost not planned for and not named in the plan, not a cost written in the budget; incidental
  and minor expense are other names for this sense.
examples:
- The taxi fare was an incidental expense on the trip.
- She asked for her incidental expenses to be paid back.
