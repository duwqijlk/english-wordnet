simpleMeaning: a thing, often one that looks good but is not safe, that catches you when you do not see
  it coming
scope: A thing, often one that looks good but is not safe, that catches you when you do not see it coming,
  not a drain made of a U-shaped pipe and not a machine that throws clay discs.
examples:
- The exam was full of trap questions.
- The cheap price was a trap to catch new buyers.
