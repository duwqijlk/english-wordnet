simpleMeaning: Wood from a common tree of the south-east of the United States, its trunk wide at the foot,
  growing in coastal swamps and low land by rivers that flood.
scope: 'Also called pond bald cypress, southern cypress and swamp cypress: wood from this tree of wet
  land, not the living tree itself.'
examples:
- The chest was made of bald cypress.
- Bald cypress wood came from trees that grow in the swamps of the south-east.
