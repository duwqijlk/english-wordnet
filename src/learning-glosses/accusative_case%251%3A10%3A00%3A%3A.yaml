simpleMeaning: In grammar, the form of a noun used when it is the direct object of a verb
scope: This is the noun form used for a direct object, also called accusative and objective case; not
  the form used for the subject and not the form used after a preposition.
examples:
- In Latin, the accusative case marks the direct object.
- The accusative case shows which noun the verb acts on.
