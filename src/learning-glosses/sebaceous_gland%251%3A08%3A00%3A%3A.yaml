simpleMeaning: A part of the skin that gives out an oily stuff, most often into a hair root, to oil hair
  and skin
scope: A skin gland that gives out an oily stuff, most often into a hair root, to oil hair and skin, also
  called glandulae sebaceae or sebaceous follicle; not a sweat gland and not a hair root itself.
examples:
- The sebaceous gland oils the hair as it grows.
- A blocked sebaceous gland can swell.
