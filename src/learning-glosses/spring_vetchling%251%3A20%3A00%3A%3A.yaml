simpleMeaning: In Europe, a thick, bushy plant comes back year after year, bearing violet-blue flowers
  that hang down in bunches along a stem.
scope: Also called spring vetch, this is a thick, bushy plant of Europe that lives on year after year,
  with violet-blue flowers hanging down in bunches along a stem.
examples:
- The spring vetchling has violet-blue flowers hanging down in bunches.
- A spring vetchling comes back year after year.
