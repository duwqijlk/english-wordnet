simpleMeaning: When a current of one flows under a push of one, the power used up is a measure of electric
  power in a circuit with changing current.
scope: Also called var, it is the measure of electric power in a circuit with changing current.
examples:
- The volt-ampere rating of the machine showed its power use.
- Engineers measured the load in volt-amperes.
