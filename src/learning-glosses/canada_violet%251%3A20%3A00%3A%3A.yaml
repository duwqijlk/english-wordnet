simpleMeaning: A tall plant of North America that lives many years, with heart-shaped leaves and white
  flowers marked with purple streaks.
scope: Also called tall white violet, white violet and Viola canadensis; a tall plant with heart-shaped
  leaves and white flowers with purple streaks, among the violets of North America.
examples:
- A Canada violet grew tall beside the path, its white flowers marked with purple.
- The Canada violet in the garden had heart-shaped leaves.
