simpleMeaning: A common wild goose of Europe with ash-coloured feathers, from which many farm breeds come.
scope: 'Also called a graylag, a graylag goose, or a greylag goose: a common wild goose of Europe, not
  a farm goose and not a swan.'
examples:
- The greylag is the wild goose of northern Europe.
- Many farm geese come from the greylag.
