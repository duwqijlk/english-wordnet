simpleMeaning: a long collared garment reaching the feet, sleeves tapering toward the hand, worn beneath
  outer robes by all clergy, monks and nuns, and often by men training for the priesthood
scope: 'Also called an inner cassock: a long garment worn beneath outer church robes, not the outer robe
  worn over it.'
examples:
- The monk's inner rason reached to his feet.
- He wore his inner rason under his cloak during the service.
