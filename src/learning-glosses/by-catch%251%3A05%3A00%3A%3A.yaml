simpleMeaning: Sea animals that no one wants, taken in nets set for a different kind.
scope: Sea animals no one wants, taken in nets set for another kind, also called bycatch; not the fish
  the nets were set for and not animals taken on purpose.
examples:
- The by-catch included dolphins and small sharks.
- Thousands of dolphins die as by-catch each year.
