simpleMeaning: The front pin in the three-sided set of ten pins in bowling
scope: This is the front pin in the three-sided set of ten pins in bowling; headpin is another name for
  this sense, not a back pin and not any other pin in the set.
examples:
- The kingpin fell first when she bowled.
- He aimed straight at the kingpin.
