simpleMeaning: A sex-gland hormone made by the front pituitary, which in females spurs growth of the milk
  glands and milk-making after birth.
scope: Also called luteotropin and prolactin, a sex-gland hormone made by the front pituitary, which in
  females spurs growth of the milk glands and milk-making after birth.
examples:
- Lactogenic hormone spurs milk-making.
- Lactogenic hormones act after birth.
