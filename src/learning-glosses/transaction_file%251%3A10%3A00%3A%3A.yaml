simpleMeaning: In computer science, a set of computer records holding short-lived facts about one job
  of working with data
scope: In computer science, a set of records holding short-lived facts about one job of working with data;
  detail file is another name for this sense. Not a file that keeps facts for a long time and not the
  program that does the work.
examples:
- The transaction file was cleared after the day's orders were done.
- Each transaction file holds the facts for one batch of work.
