simpleMeaning: In computer science, the wait while a disk head moves one data line over
scope: In computer science, the wait for a disk head to move one data line over, not the wait for a disk
  to spin and not the wait to reach a far data line.
examples:
- The track-to-track seek time was only a few thousandths of a second.
- A short track-to-track seek time makes the disk feel fast.
