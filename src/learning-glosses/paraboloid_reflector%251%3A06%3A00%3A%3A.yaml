simpleMeaning: Light in lines running side by side comes from this bowl-shaped mirror, curved in, when
  it starts at its centre point; light coming in is brought together there.
scope: Also called a parabolic reflector, this mirror is set apart by its centre point, where light starts
  or where light coming in is brought together.
examples:
- The paraboloid reflector threw the light out in straight lines.
- A paraboloid reflector brought the light together at one point.
