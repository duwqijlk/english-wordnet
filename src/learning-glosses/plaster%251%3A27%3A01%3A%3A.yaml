simpleMeaning: 'Any of several gypsum cements: a white calcium sulphate powder that becomes a paste with
  water and sets into a solid, used for molds, sculptures and casts for broken limbs.'
scope: The gypsum cement powder, also called plaster of Paris; not the wall covering, the hardened wall
  surface, or the adhesive bandage.
examples:
- The sculptor mixed plaster with water and poured it into a mold.
- Doctors used plaster to make a cast for his broken arm.
