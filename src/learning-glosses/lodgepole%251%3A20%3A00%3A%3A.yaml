simpleMeaning: This bushy tree of the north-west coast of America bears two needles in each bunch, and
  its bark splits into small squares from red to yellow-brown.
scope: Also called lodgepole pine, shore pine, and spruce pine, it is the bushy two-needled tree of the
  north-west coast of America.
examples:
- The lodgepole grew low and bushy near the shore.
- The lodgepole's bark split into small squares.
