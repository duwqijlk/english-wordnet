simpleMeaning: A fine stand on which a coffin lies in state at a funeral.
scope: A fine stand on which a coffin lies in state at a funeral; not a plain stand for a coffin, and
  not a box for carrying a coffin.
examples:
- The catafalque stood in the hall during the funeral.
- Mourners filed past the catafalque.
