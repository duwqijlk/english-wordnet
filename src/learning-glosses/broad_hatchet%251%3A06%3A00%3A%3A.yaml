scope: This is a small axe with a short handle, a wide cutting edge on one side and a hammer head on the
  other, not a long-handled felling axe and not a plain hammer.
examples:
- He split the kindling with a broad hatchet.
- The broad hatchet had a wide blade and a hammer head.
