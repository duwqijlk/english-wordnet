simpleMeaning: the point on a compass 225 degrees round from north, lying halfway between south and west
scope: The compass mark halfway between south and west, not the direction it points to and not a place
  in the southwest.
examples:
- The wind blew from the southwest all afternoon.
- Turn the map so southwest is at the bottom left.
