senseId: 'crampoon%1:06:00::'
synsetId: 03131036-n
simpleMeaning: A sharp iron point fixed to a shoe so the wearer does not slip on ice while walking or
  climbing
scope: This is a sharp iron point fixed to a shoe so the wearer does not slip on ice while walking or
  climbing; climber, climbing iron and crampon are other names for it; not an ice skate, which slides
  on ice, and not a snowshoe, which spreads weight over snow.
examples:
- He fixed crampoons to his boots before crossing the ice.
- The crampoon bit into the ice as she climbed.
