simpleMeaning: Showing plain, open simplicity, with no slyness and no worldly know-how.
scope: Plain and open, with no slyness and no worldly know-how; naive is another name for this, and it
  is not foolishness or false modesty.
examples:
- Her naif smile won them over.
- He gave a naif answer, with no slyness in it.
