simpleMeaning: a feeling of trouble and confusion when something is too hard to understand because it
  has many parts
scope: This is the confused feeling caused by something hard, not the hard thing itself.
examples:
- He stared at the long form in perplexity.
- Her perplexity grew as the instructions became harder to follow.
