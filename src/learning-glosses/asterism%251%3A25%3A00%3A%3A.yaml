simpleMeaning: In mineralogy, when light is bounced off some crystals or passed through them, a star shape
  with six rays shows up
scope: This is a star shape with six rays seen in some crystals under light, not a pattern of stars in
  the night sky.
examples:
- The asterism in the sapphire showed six fine rays under the lamp.
- Under the light, the asterism stood out as a clear six-rayed star.
