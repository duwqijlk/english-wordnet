simpleMeaning: A sound of weeping that tells of great sorrow and grief.
scope: 'Also called a wail and a lament, and another name for it is lamentation: a sound of weeping that
  tells of great sorrow and grief, not a written statement of a wrong put before a court.'
examples:
- Her plaint rose through the night.
- The plaint of the mourners could be heard in the ward.
