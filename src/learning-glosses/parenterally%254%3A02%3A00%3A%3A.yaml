simpleMeaning: in a way that puts medicine into the body without using the mouth
scope: This is about how a drug is given, not about the drug itself and not about a dose taken by mouth.
examples:
- The drug is given parenterally when the patient cannot swallow.
- The nurse gave the medicine parenterally.
