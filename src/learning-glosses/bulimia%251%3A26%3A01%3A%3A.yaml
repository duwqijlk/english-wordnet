simpleMeaning: An eating disorder found in young women, who eat far too much at one sitting and then feel
  guilt, low spirits, and blame towards themselves.
scope: Also called binge-eating syndrome, an eating disorder found in young women, who eat far too much
  at one sitting and then feel guilt, low spirits, and blame towards themselves, not a hunger that cannot
  be filled.
examples:
- Bulimia left her eating far too much at one sitting and then feeling guilt.
- The doctor spoke to the young woman about her bulimia.
