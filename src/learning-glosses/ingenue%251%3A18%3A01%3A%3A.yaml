simpleMeaning: A young girl who is sweet and trusting and knows little of the world is the part this actress
  plays more than any other
scope: An actress known for playing a sweet, innocent young girl; not a young girl in real life and not
  an actress who plays older or worldly parts.
examples:
- The young ingenue won the part of the farm girl.
- As an ingenue, she played the innocent daughter in the play.
