simpleMeaning: a strap that goes round a horse's belly to keep its saddle from moving
scope: A strap that holds a horse's saddle in place, not the card game of the same name and not the verb
  sense of tying it on.
examples:
- He tightened the cinch before mounting the horse.
- The cinch held the saddle firm as they rode.
