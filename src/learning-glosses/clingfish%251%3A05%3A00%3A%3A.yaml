simpleMeaning: a sucking disc on its belly lets this very small flat sea fish, no more than 3 inches long,
  hold fast to rocks and other things
scope: A very small flat sea fish that holds fast to rocks with a disc on its belly, not a free-swimming
  fish of open water.
examples:
- The clingfish held fast to the rock with the disc on its belly.
- A clingfish no more than three inches long lay flat on the stone.
