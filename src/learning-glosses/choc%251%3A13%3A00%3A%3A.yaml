simpleMeaning: In British informal use, a short word for a sweet brown food, or for one small piece of
  that food
scope: A short British informal word for the sweet brown food or for a piece of it, not the full long
  name for that food.
examples:
- She bought a box of chocs for her friends.
- He ate one choc after dinner.
