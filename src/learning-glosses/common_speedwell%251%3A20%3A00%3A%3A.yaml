simpleMeaning: Pale blue or lilac flowers in bunches that grow where the leaves join the stem mark this
  hairy plant of Europe that lives for years.
scope: Also called gypsyweed, this is the hairy European plant with pale blue or lilac flowers in bunches
  where the leaves join the stem.
examples:
- The common speedwell is a hairy plant of Europe.
- A common speedwell had lilac flowers in bunches.
