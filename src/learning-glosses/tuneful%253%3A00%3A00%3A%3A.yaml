simpleMeaning: with a sound that is like music, especially a nice tune that is pleasing to hear
scope: 'Also called melodious: this means a pleasing sound like music. It is not a harsh sound, and not
  speech with no music in it.'
examples:
- She sang a tuneful song that everyone liked.
- The small bird made a tuneful sound in the tree.
