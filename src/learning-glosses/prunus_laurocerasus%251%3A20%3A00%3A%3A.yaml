simpleMeaning: An evergreen shrub or small tree from Eurasia, often grown in gardens, with showy bunches
  of white flowers and shiny leaves; it gives oil much like bitter almond oil.
scope: An evergreen shrub or small tree, also called cherry laurel and laurel cherry; not the bay tree
  used in cooking and not a true cherry tree.
examples:
- Prunus laurocerasus lines the garden path with white flowers in spring.
- The oil from Prunus laurocerasus smells like bitter almonds.
