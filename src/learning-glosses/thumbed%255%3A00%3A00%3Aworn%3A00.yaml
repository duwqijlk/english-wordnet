simpleMeaning: of pages, worn or dirty from being held or turned again and again by people's hands
scope: This describes pages that look worn and dirty from much use, not the act of turning pages quickly
  to look through a book.
examples:
- The old book had soft, thumbed pages from years of reading.
- His thumbed copy of the dictionary falls open at the words he looks up most.
