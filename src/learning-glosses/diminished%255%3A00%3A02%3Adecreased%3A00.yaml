simpleMeaning: In music, a gap between two notes made one half step smaller than a gap of the full or
  smaller kind
scope: In music, a gap between two notes made one half step smaller, not a body part made smaller by illness
  or injury and not a power made weaker.
examples:
- The gap between the notes was diminished by a half step.
- They played a diminished fifth in the piece.
