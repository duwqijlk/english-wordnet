simpleMeaning: In a plant or an animal, a rib-like part — the middle rib of a leaf, say, or a thick vein
  in an insect's wing
scope: This rib-like part of a plant or animal is not one of the curved bones in a person's chest.
examples:
- The costa runs down the middle of the leaf like a rib.
- He pointed to the costa in the insect's wing.
