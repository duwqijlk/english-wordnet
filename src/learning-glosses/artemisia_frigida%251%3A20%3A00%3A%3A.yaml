simpleMeaning: A long-lived plant with soft, silky leaves and a sweet smell, growing in the dry north
  of the Northern Hemisphere, with brown-yellow flowers.
scope: Also called prairie sagewort and wormwood sage; a long-lived plant of the dry north with silky
  leaves, not a sage grown in gardens for cooking.
examples:
- The Artemisia frigida on the dry hill had soft silky leaves.
- We found Artemisia frigida with tawny flowers in the northern hills.
