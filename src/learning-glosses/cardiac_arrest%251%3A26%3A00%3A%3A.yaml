simpleMeaning: The heart stops when its lower chambers stop squeezing, usually because they shake out
  of rhythm, so the body gets no air, and death follows.
scope: 'Also called asystole and cardiopulmonary arrest: a state in which the heart has stopped beating,
  not a brief pause between beats.'
examples:
- Cardiac arrest means the heart has stopped beating.
- Cardiac arrest leads to death because the body gets no air.
