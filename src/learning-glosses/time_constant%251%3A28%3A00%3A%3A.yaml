simpleMeaning: In electronics, how long it takes a current or voltage in a circuit to rise or fall by
  about 63 per cent of its full size, in ever smaller steps
scope: How long a current or voltage takes to change in a circuit, not a number got by dividing inductance
  by resistance.
examples:
- The time constant tells how fast the voltage falls.
- Engineers measured the time constant of the circuit.
