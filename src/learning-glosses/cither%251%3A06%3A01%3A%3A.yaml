senseId: 'cither%1:06:01::'
synsetId: 03039817-n
simpleMeaning: A 16th-century music tool like a guitar, with a pear-shaped sound box and wire strings.
scope: This sense is also called cithern, citole, cittern, and gittern, a 16th-century music tool like
  a guitar, with a pear-shaped sound box and wire strings, unlike the sense for a musical stringed instrument
  with strings stretched over a flat sounding board, laid flat and played with a plectrum and with fingers.
examples:
- Cithers sound like guitars.
- The cither has wire strings.
