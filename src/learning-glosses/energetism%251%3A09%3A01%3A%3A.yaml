senseId: 'energetism%1:09:01::'
synsetId: 92445469-n
simpleMeaning: In philosophy, the view that power is the stuff of all things and that all changes we see
  can be read as one kind of power turning into another
scope: In philosophy, this is the view that power is the stuff of all things and all changes can be read
  as one kind of power turning into another; energetic monism is another name for it, not the view that
  matter is the stuff of all things and not the view that mind is.
examples:
- Ostwald's energetism holds that power is the stuff of all things.
- Energetism reads each change as one kind of power turning into another.
