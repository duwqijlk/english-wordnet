simpleMeaning: a flat sheet of rock from hot melted stone, usually lying level, between two older layers
  of rock made from sand and mud
scope: In geology, a flat sheet of rock between older layers, not the lowest wood of a frame.
examples:
- The sill of rock ran level between the old layers.
- Geologists found a sill of dark rock in the cliff.
