simpleMeaning: a person who fills the skins of dead animals and sets them up to look alive for show
scope: 'Also called a taxidermist or an animal stuffer: a person who fills dead animals'' skins and sets
  them up for show, not a person who makes clothes and not a hunter.'
examples:
- The stuffer filled the fox's skin and set it up in the museum.
- A skilled stuffer made the dead bird look as if it were still alive.
