simpleMeaning: A night-active bird from New Zealand that cannot fly, with a long neck and thick legs;
  the only living kind in its group, the order Apterygiformes
scope: Also called apteryx; this is the bird, not the climbing plant that bears the fruit and not the
  fruit itself.
examples:
- The kiwi, a bird that cannot fly, hunts for food at night.
- We watched a kiwi walk through the dark on its thick legs.
