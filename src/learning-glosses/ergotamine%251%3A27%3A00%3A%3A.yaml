simpleMeaning: To treat severe head pain, people use a plant chemical from the ergot fungus, less poisonous
  than the fungus itself, that narrows the blood tubes.
scope: This is a drug from the ergot fungus that narrows blood tubes, not the fungus itself and not a
  drug that widens them.
examples:
- Ergotamine helped her migraine within the hour.
- The doctor gave him ergotamine for his severe headaches.
