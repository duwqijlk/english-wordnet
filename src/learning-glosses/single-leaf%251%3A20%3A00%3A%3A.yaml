simpleMeaning: Its nuts are prized, and this pine of the southwest of the United States bears needles
  one by one on trunks that are often many.
scope: Also called a single-leaf pine or a single-leaf pinyon, it is a pine of the southwest of the United
  States valued for its nuts.
examples:
- They gathered nuts from a single-leaf in the southwest of the United States.
- Needles grow one by one on the single-leaf, which often has many trunks.
