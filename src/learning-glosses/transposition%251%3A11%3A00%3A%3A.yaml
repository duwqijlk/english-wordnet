senseId: 'transposition%1:11:00::'
synsetId: 07440503-n
simpleMeaning: In gene science, a kind of change in which a chromosome bit is moved to a new spot on the
  same or another chromosome.
scope: In gene science, a kind of change in which a chromosome bit is moved to a new spot on the same
  or another chromosome; not, in power work, a re-setting of the places of power lines, to cut down the
  effects of shared charge and pull, nor, in music, playing in a key other than the one meant, moving
  the pitch of a piece up or down, nor, in maths, the moving of a number from one side of a sum to the
  other, with a change of sign.
examples:
- Their transposition moved the gene.
- The transposition was seen at dawn.
