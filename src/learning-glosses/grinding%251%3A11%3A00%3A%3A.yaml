simpleMeaning: A loud, rough sound, like metal parts of a machine rubbing against each other
scope: This is a rough sound, not the material that is left after something is crushed into small pieces.
examples:
- A loud grinding came from the machine when its metal parts rubbed together.
- We heard a harsh grinding as the train stopped.
