simpleMeaning: a river turtle from the west of the United States, with a rough bumpy back, that likes
  still water best
scope: A river turtle from the west of the United States, with a rough bumpy back; not a sea turtle and
  not a turtle with a hard shell.
examples:
- A spiny softshell slid into the quiet water of the river.
- The spiny softshell basked on a log in the western river.
