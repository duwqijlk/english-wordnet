senseId: 'molar_pregnancy%1:26:00::'
synsetId: 14216424-n
simpleMeaning: 'a problem with a baby growing in the womb: chorionic villi, growths round the baby, break
  down and form bunches of sacs full of fluid, and the baby usually dies'
scope: 'Also called hydatid mole and hydatidiform mole: a problem in which growths round the baby break
  down into sacs of fluid, not a normal pregnancy and not a simple loss of the baby.'
examples:
- The doctor said it was a molar pregnancy, and the baby had died.
- A molar pregnancy was found when the growths round the baby formed sacs of fluid.
