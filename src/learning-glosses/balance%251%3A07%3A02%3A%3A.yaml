simpleMeaning: In mathematics, the quality of a shape or relation whose two halves mirror each other across
  a line or plane.
scope: This is the geometric kind, where one half is an exact mirror of the other, not a pleasing arrangement
  of parts in a design and not equal amounts on each side.
examples:
- The building's balance comes from its perfectly mirrored wings.
- A line down the middle shows the perfect balance of the pattern.
