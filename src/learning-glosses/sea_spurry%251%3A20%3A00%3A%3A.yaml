simpleMeaning: A low-growing weed with small pink flowers, found across Europe and Asia on dunes, heath
  and coastal cliffs, and now growing wild in eastern North America.
scope: This is the whole low weed of dunes, heath and coastal cliffs, not just its pink flowers; sand
  spurry is another name for the same plant, and corn spurry is a different weed with white flowers.
examples:
- Sea spurry spreads across the dunes behind the beach.
- The heath was bright with sea spurry in early summer.
