simpleMeaning: Any way of thinking that puts inner feeling and the spirit above facts from the senses
  and things that can be touched
scope: A way of thinking that puts inner feeling and the spirit above facts from the senses and things
  that can be touched; transcendentalism is another name for this sense. Not a way of thinking based only
  on what can be seen and measured, and not a religion.
examples:
- Transcendental philosophy values what the heart knows over what the eyes see.
- He studied transcendental philosophy and its ideas about the spirit.
