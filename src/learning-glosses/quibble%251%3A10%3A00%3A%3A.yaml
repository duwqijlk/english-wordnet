schema: oewn-learning-gloss-v2
senseId: 'quibble%1:10:00::'
synsetId: 06774509-n
simpleMeaning: a way of avoiding the main point of an argument by raising differences or objections that
  do not matter to it
scope: Also called a cavil and a quiddity, this is a way of avoiding the main point of an argument by
  raising differences or objections that do not matter to it. It is not an objection that truly answers
  the main point.
examples:
- His long quibble about the dates was just a way to avoid answering the question.
- She raised a quibble about one small word and never spoke to the main point.
