simpleMeaning: someone who can work out numbers well, or who can run machines that work out numbers
scope: 'Also called a calculator, a computer and an estimator: someone who can work out numbers well or
  run machines that work out numbers, not someone who guesses at numbers and not a machine on its own.'
examples:
- The firm hired a figurer to check the accounts.
- As a young figurer, she could work out long sums in her head.
