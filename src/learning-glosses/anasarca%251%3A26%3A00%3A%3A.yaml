simpleMeaning: A clear liquid from the blood gathers in the tissue just under the skin, so the whole body
  swells.
scope: This is the swelling all over the body, not a swelling in one place.
examples:
- Anasarca made his whole body swell.
- His whole body was puffed up with anasarca.
