simpleMeaning: A public rite on the Thursday before Easter when the ruler hands out coins
scope: This is the public rite itself, held on the Thursday before Easter, when the ruler gives out the
  coins, and not the day itself or the coins given out.
examples:
- Maundy is held on the Thursday before Easter.
- At Maundy, the monarch gives out Maundy money.
