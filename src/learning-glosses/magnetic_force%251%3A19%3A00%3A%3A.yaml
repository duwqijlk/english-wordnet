senseId: 'magnetic_force%1:19:00::'
synsetId: 11499458-n
simpleMeaning: A pull on iron, linked with flows of electric charge and with magnets, that acts through
  fields reaching out around them
scope: A pull on iron linked with electric flows, magnets and fields of force, not a pull on wood and
  not the magnet itself; magnetism and magnetic attraction are other names for this sense.
examples:
- The magnetic force pulled the iron nail toward the magnet.
- Magnetic force grows stronger as the iron comes closer.
