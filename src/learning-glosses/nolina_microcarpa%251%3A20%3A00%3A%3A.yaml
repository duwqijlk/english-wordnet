simpleMeaning: A plant with no stem, with tufts of grass-like leaves and a tall head of tiny creamy white
  flowers; it grows in the south-west United States and Mexico.
scope: This is a stemless plant with grass-like leaves and tiny creamy white flowers; also called bear
  grass.
