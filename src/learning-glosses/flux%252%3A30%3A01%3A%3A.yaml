simpleMeaning: to turn into a liquid when heat is put on it
scope: This means turning liquid when heated, also called liquefy and also called liquify; it is not the
  noun sense of not knowing what to do.
examples:
- The frozen fat began to flux as the pan grew hot.
- This solid will flux if you heat it long enough.
