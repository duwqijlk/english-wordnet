simpleMeaning: The mark left on the belly where a baby was once joined to its mother by a cord
scope: The mark on the belly left where a baby was joined to its mother, also called navel, bellybutton
  and omphalus; not a cut from an injury and not the cord itself.
examples:
- The baby's omphalos was still red a week after birth.
- She dabbed the omphalos gently while changing the nappy.
