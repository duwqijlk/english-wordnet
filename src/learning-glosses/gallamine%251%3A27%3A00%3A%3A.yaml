simpleMeaning: While a patient is put to sleep for an operation, this drug, sold under the trade name
  Flaxedil, stops the muscles from moving.
scope: Flaxedil is another name for this drug, which stops the muscles from moving while a patient is
  put to sleep.
examples:
- The gallamine kept the patient's muscles still during the operation.
- Gallamine kept the muscles still while the patient was asleep for the operation.
