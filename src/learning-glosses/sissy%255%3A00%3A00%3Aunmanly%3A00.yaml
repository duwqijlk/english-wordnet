simpleMeaning: having ways or looks that people see as like a woman's and not right for a man or boy
scope: Also called emasculate, effeminate and epicene. This describes a man or boy as seeming like a woman,
  not a word that names a weak and childish man or boy.
examples:
- They called his soft voice and gentle ways sissy.
- He stopped wearing the pink shirt because his friends said it looked sissy.
