simpleMeaning: A part that something is thought of as being split into, with all such parts making up
  the whole.
scope: This is one part of a whole that has been split up, not the arithmetic operation and not the act
  of separating.
examples:
- The book is organized into three divisions, each covering a different period.
- The course is arranged in five divisions, from beginner to advanced.
