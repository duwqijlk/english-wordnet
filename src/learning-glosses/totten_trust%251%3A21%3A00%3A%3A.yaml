scope: 'Also called a savings account trust, a savings bank trust, a trust account, or a trustee account:
  a savings account whose opener names themself keeper of the money for another, staying in charge while
  alive, with the money going to the person named after death.'
examples:
- She opened a Totten trust for her grandson.
- The Totten trust paid out to the named beneficiary after his death.
