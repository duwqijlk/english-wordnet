simpleMeaning: A natural gagging action that can start when the soft back of the mouth is touched.
scope: A natural gagging action that can start when the soft back of the mouth is touched; gag reflex
  is another name for this sense, not a cough and not a swallowed object.
examples:
- Touching the back of her mouth set off a pharyngeal reflex.
- The doctor tested his pharyngeal reflex with a tongue depressor.
