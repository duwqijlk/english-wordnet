simpleMeaning: a check that measures how well a system works when it is put under set amounts of pressure
scope: A check of how a system copes under pressure, not a test of a person's memory and not a check of
  a machine's speed alone.
examples:
- They ran a stress test on the new bridge design.
- The stress test showed how the system worked under a heavy load.
