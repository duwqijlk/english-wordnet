simpleMeaning: a small case that can fit in a pocket, used for holding papers and paper money
scope: This is the small case for papers and paper money, not the bag a woman uses for money and small
  things of her own, and not a small paper book.
examples:
- He took the train ticket from his pocketbook and showed it to the man.
- She put the folded letter into her pocketbook with her paper money.
