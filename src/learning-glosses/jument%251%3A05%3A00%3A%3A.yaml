simpleMeaning: An animal, such as a donkey, an ox or an elephant, used to carry loads or to do other heavy
  work.
scope: An animal used to carry loads or to do heavy work; beast of burden is another name for it, not
  a pet kept for company and not a wild animal never put to work.
examples:
- The jument carried the sacks down the hill.
- A jument pulled the heavy cart.
