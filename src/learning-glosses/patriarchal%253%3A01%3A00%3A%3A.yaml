simpleMeaning: Connected with a man who is older than others or who has a high place over others, or like
  such a man
scope: This describes an older man or a man higher in rank, or things like him; it is not a name for the
  man himself.
examples:
- His patriarchal manner made the young workers listen to him in silence.
- The firm's patriarchal leader, old and high in rank, made every big choice.
