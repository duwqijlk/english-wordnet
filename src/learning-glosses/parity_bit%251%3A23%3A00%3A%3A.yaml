simpleMeaning: In computer science, a bit (0 or 1) added to each group of bits so the group has an odd
  or even number of 1s; a mismatch signals an error.
scope: This sense is the bit itself, another name for a check bit, not the odd-or-even condition it creates.
examples:
- Every byte is followed by a parity bit.
- The parity bit caught the error before the file was saved.
