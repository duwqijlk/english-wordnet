simpleMeaning: Showing something that was hidden, without meaning to do so.
scope: It is not about speaking or narrating a story, but about an accidental sign that reveals something.
examples:
- Her shaking hands gave away how nervous she really was.
- The look on his face showed what he had tried to hide.
