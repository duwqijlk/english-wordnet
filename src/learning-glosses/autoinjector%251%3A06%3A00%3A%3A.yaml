simpleMeaning: a needle that puts a liquid under your skin so you can give the dose to yourself
scope: A needle for giving yourself a liquid under the skin, not a needle a doctor uses on you in a clinic.
examples:
- He pressed the autoinjector against his thigh and the medicine went in.
- Soldiers carry autoinjectors in their first-aid kits in case of nerve gas.
