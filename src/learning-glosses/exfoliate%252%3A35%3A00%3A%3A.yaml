simpleMeaning: to fall off in thin flat layers, small flat pieces, or thin sharp bits
scope: This sense is about a surface coming off in thin pieces, not about a whole thing breaking off in
  large pieces.
examples:
- The old paint began to exfoliate in small flakes.
- Dry skin can exfoliate in tiny scales during winter.
