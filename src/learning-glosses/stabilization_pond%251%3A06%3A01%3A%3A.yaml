simpleMeaning: Dirty water is left in big shallow basins so sun, germs, and the green growth in the water
  can clean it together.
scope: An oxidation pond and a water stabilization lagoon are other names for these big shallow basins,
  where sun, germs, and green growth clean dirty water together.
examples:
- The stabilization pond held dirty water till the sun and germs cleaned it.
- Green growth in the stabilization pond helped clean the dirty water.
