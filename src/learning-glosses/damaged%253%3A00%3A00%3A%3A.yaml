simpleMeaning: 'Having been hurt or made worse: used of a person whose body has been hurt, or of a thing
  that has been hurt or spoiled'
scope: This is about a person or thing that has been hurt or spoiled and is now in worse shape, not about
  a person or thing that is new or in good shape.
examples:
- I won't buy damaged goods at full price.
- The storm left many badly damaged buildings behind.
