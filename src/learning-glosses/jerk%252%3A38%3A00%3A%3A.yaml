simpleMeaning: to move in sudden, sharp ways that seem to be out of control
scope: 'Also called twitch: to move in sudden ways that seem out of control; it is not one single short
  move, and not dried meat.'
examples:
- The patient's legs jerked again and again and would not keep still.
- The old car jerked down the road, stopping and starting as it went.
