simpleMeaning: in slow fresh or faintly salty water grows a common water lily of the east and middle of
  North America, with wide leaves and round yellow blooms
scope: Also called a cow lily and a yellow pond lily, this is a common water lily of eastern and central
  North America.
examples:
- Spatterdock grew where the water ran slow.
- The spatterdock showed round yellow blooms above its wide leaves.
