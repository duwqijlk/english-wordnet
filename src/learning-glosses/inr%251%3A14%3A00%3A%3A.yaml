simpleMeaning: The State Department's main source of analyses explaining world events, and its focal point
  for the Intelligence Community's policy issues and activities.
scope: Also called Bureau of Intelligence and Research; the State Department agency providing interpretive
  analysis and coordinating Intelligence Community policy matters.
examples:
- The INR briefed the secretary on events in the region.
- Analysts at INR study reports from around the world.
