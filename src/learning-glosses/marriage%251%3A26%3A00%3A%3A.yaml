simpleMeaning: the relationship of two people who have chosen to stay together for life, or until they
  divorce
scope: This is the state of being a couple, not the wedding ceremony, not the couple themselves, and not
  a close union of another kind.
examples:
- Their marriage has lasted more than forty years.
- She talked warmly about her marriage of twenty years.
