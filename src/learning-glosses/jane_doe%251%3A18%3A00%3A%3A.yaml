simpleMeaning: This name marks a woman in a case in court whose real name no one knows, or who is made
  up.
scope: This is the name used for a woman in a case in court when her real name is not known or she is
  made up, not for a man, who is called John Doe.
examples:
- The court papers named the woman Jane Doe.
- Jane Doe asked the judge for help.
