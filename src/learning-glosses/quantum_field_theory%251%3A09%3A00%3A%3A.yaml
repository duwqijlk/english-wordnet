simpleMeaning: A part of the study of tiny matter, about forces in space, it grew from asking how an atom
  gives off light when its charged parts jump from higher states.
scope: This part of the study of tiny matter deals with forces in space, and it stands apart from other
  parts of that study by the question of how an atom gives off light.
examples:
- Quantum field theory asks how an atom gives off light.
- In quantum field theory, atoms give off light as their charged parts jump from higher states.
