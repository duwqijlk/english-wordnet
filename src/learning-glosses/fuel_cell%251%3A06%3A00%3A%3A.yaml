simpleMeaning: a unit that makes electricity by a chemical change in hydrogen and oxygen or zinc and air,
  often used in electric cars
scope: This is a unit that makes electricity from hydrogen and oxygen or zinc and air; not a battery that
  stores power or an engine that burns fuel.
examples:
- The fuel cell powered the bus without smoke.
- Fuel cells are often used in electric cars.
