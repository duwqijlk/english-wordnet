simpleMeaning: an operation that fixes a joint in place so that the bones grow together
scope: An operation that fixes a joint in place so the bones grow together, not a joint replacement and
  not the setting of a broken bone.
examples:
- The surgeon performed an arthrodesis on her damaged ankle joint.
- After the arthrodesis, his wrist could no longer bend.
