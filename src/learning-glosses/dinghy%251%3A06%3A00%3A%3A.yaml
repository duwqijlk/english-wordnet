simpleMeaning: a small boat that sits high in the water, with boards across it to sit on and fittings
  to hold oars for rowing
scope: A small rowing boat, also called a rowboat; not a big ship and not a boat with a motor.
examples:
- We rowed the dinghy out to the anchored yacht.
- The dinghy carried two people across the bay.
