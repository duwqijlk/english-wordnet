simpleMeaning: This thin curved piece of glass or plastic rests on the front of the eye, making sight
  clear or carrying medicine to it.
scope: Also called a contact, this thin curved piece of glass or plastic sits on the front of the eye,
  not a pair of glasses and not an eye drop.
examples:
- She put in a contact lens to see clearly.
- He wears a contact lens to fix his sight.
