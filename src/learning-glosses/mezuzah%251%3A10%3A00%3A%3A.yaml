simpleMeaning: religious words from Deuteronomy, written on parchment (skin made into a sheet), rolled
  up in a case fixed to the door frame of many Jewish homes, as Jewish law says
scope: 'Also called mezuza: religious words in a case fixed to a door frame in many Jewish homes, not
  a prayer book and not a plain door ornament.'
examples:
- He touched the mezuzah on the door frame as he came into the house.
- A mezuzah is fixed to the door frame of their home.
