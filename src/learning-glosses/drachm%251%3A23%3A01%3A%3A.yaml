simpleMeaning: In old pharmacy, a small measure of liquid equal to one eighth of a fluid ounce.
scope: In old pharmacy, a small measure of liquid; fluid drachm, fluid dram and fluidram are other names
  for this sense, not a measure of weight and not a modern measure.
examples:
- He measured out a drachm of the liquid.
- A drachm of the mixture was poured into the bottle.
