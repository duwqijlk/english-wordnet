simpleMeaning: The highest federal law bench in the United States; it gives the final ruling on appeals
  and stands above all other law benches in the nation.
scope: This is the highest federal law bench in the United States, giving the final ruling on appeals;
  Supreme Court of the United States and United States Supreme Court are other names for it, not a lower
  federal law bench and not a state law bench.
examples:
- The Supreme Court gave the final ruling on the appeal.
- The Supreme Court stands above all other courts in the nation.
