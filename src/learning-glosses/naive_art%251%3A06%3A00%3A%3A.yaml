simpleMeaning: Work made by people with no training, who do not see themselves as makers of such work,
  and outdoor things made in the same way.
scope: Work made by people with no training; outsider art is another name for this, and it is not work
  by trained makers or children's drawings.
examples:
- Naive art hangs in the folk museum.
- Her naive art showed village life.
