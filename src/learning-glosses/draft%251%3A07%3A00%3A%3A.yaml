simpleMeaning: how deep the lowest part of a ship (its keel) sits below the water, especially when the
  ship is loaded
scope: 'Also called draught: how deep a ship sits in the water, not a serving of drink drawn from a keg,
  not a written order to pay money, and not the act of pulling a load.'
examples:
- The ship's draft is too deep for this shallow harbour.
- When fully loaded, the draft of the vessel reached nine metres.
