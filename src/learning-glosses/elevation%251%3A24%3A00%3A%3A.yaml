simpleMeaning: How far above the horizon a thing is, measured as an angle, above all a star or planet
scope: How far above the horizon a thing is, as an angle; altitude is another name for this sense, not
  a dancer's leap in ballet.
examples:
- The star's elevation above the horizon was thirty degrees.
- They measured the elevation of the moon at midnight.
