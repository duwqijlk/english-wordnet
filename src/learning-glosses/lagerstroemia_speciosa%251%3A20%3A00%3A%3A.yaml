scope: Also called pride-of-India or Queen's crape myrtle; this is the tree grown for its big bright flowers,
  not other flowering trees.
examples:
- Lagerstroemia speciosa flowered in the garden.
- The Lagerstroemia speciosa gives timber called pyinma.
