simpleMeaning: To repair the spaces between bricks by filling them with fresh material that holds the
  bricks together.
scope: This is not making a sharp tip or aiming at something; it is repairing the material between bricks.
examples:
- The mason pointed the brickwork on the old house.
- Workers pointed the chimney after its joints cracked.
