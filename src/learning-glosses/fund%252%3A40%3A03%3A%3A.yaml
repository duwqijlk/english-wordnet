synsetId: 02220572-v
simpleMeaning: Set money aside over time so that a regular cost can be paid.
scope: This is building up money over time to meet a cost that keeps coming back, not simply paying for
  something once and not stashing money away with no purpose.
examples:
- The cooperative funds its annual maintenance by setting aside a share of each sale.
- To fund the pension plan, the firm puts money aside every quarter.
