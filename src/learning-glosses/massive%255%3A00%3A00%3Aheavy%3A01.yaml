simpleMeaning: Having an enormous amount of material in it.
scope: Describes something with a very large amount of matter, not something merely big in size or impressive
  in scale.
examples:
- Jupiter is far more massive than Earth.
- Because the star is so massive, it pulls nearby gas toward it.
