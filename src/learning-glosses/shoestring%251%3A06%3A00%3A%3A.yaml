simpleMeaning: a long thin cord that you tie to keep a shoe on your foot
scope: This is the cord that ties a shoe, not the shoe itself and not a strap used for other things.
examples:
- His shoestring came loose and he nearly tripped.
- She tied her shoestrings again before the run.
