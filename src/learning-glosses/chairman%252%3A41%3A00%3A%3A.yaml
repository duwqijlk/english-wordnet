simpleMeaning: To chairman a group is to act as chair of a group, such as a university department, and
  lead its meetings.
scope: 'This is the verb: it means to do the job of a chairman, not the noun for the person who holds
  the post. It is rare today, and most writers use ''chair'' instead. The word also carries the old assumption
  that the person in the chair is a man.'
examples:
- She was asked to chairman the department for a year.
- He will chairman the committee until a new head is appointed.
