simpleMeaning: 'European weed established in the southwestern United States and Mexico: reddish sprawling
  stems, small fernlike leaves, small deep reddish-lavender flowers, slender upright fruits; often grown
  as fodder.'
scope: This is the low, reddish-stemmed desert weed grown as fodder, also called pin clover and redstem
  storksbill; despite the name it is neither a true grass nor a clover.
examples:
- Pin grass covered the dry hillside where the cattle grazed.
- Ranchers in the valley plant pin grass to feed their herds through winter.
