simpleMeaning: The chemical processes within cells and tissues through which some organisms release energy
  from organic molecules and give off carbon dioxide, which the blood carries to the lungs.
scope: This is the same cell-level energy process as cellular respiration, not the act of breathing; respiration
  in its breathing senses means inhaling and exhaling.
examples:
- Internal respiration releases energy from food molecules inside the tissues.
- Internal respiration takes place in the cells and tissues, not in the lungs.
