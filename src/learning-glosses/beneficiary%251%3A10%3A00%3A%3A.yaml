simpleMeaning: In the study of meaning in language, the role in a clause of the person who is meant to
  gain from what the verb says happens
scope: Also called benefactive role. This is the role, in the study of meaning, of the person in a clause
  who is meant to gain from what the verb says. Not a person who gets money or other help in everyday
  life.
examples:
- In 'I baked a cake for Anna', Anna has the role of beneficiary.
- The teacher asked which person in the sentence was the beneficiary.
