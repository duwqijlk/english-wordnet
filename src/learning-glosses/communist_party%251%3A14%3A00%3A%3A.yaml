senseId: 'communist_party%1:14:00::'
synsetId: 08275444-n
simpleMeaning: A political group that works for rule by the state owning land and business; in countries
  ruled that way it is the only political group allowed.
scope: It is a party that works for rule by a state that owns land and business, and where it rules it
  is the only party, not one party among many.
examples:
- The Communist Party ruled the country alone.
- She joined the Communist Party as a young woman.
