simpleMeaning: a cut made through a solid body by a flat surface that runs at right angles to its longest
  side
scope: A cut through a solid body made at right angles to its longest side, not a cut along its length
  and not the physics sense of how likely a hit between tiny bits is.
examples:
- The drawing shows a cross section of the pipe.
- A cross section of the tree trunk showed its rings.
