simpleMeaning: A bag-like part in many birds and some low animals, like a stomach, where food is kept
  and softened first
scope: A food pouch in a bird, not a farm crop and not the stomach itself.
examples:
- The crop of the pigeon held the seeds it had eaten.
- Food stays in the crop before it moves to the stomach.
