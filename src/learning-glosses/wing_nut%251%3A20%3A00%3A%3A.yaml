simpleMeaning: A small fruit with thin flat sides grows on any tree of the group Pterocarya, from the
  Caucasus to the southeast of Asia.
scope: This tree is also called a wing-nut, not the small metal nut with two flat sides for turning by
  hand.
examples:
- The wing nut grows in southeastern Asia.
- Wing nut trees bear small fruit with thin flat sides.
