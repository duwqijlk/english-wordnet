simpleMeaning: People wash with this dry, stringy part of the fruit of a plant of the group Luffa, or
  let water run through it to strain.
scope: Also called loofah, loufah sponge, and luffa, it is the dried fruit part people use to wash with
  or to strain through.
examples:
- She scrubbed her back with a loofa.
- He poured the water through the loofa to strain it.
