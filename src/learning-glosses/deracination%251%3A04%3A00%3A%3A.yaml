simpleMeaning: The act of pulling a thing up or out by its roots so that it is gone for good
scope: This is the act of pulling a thing up or out by its roots so that it is gone for good; excision
  and extirpation are other names for this sense, and it is not simply moving a plant or cutting a branch.
examples:
- The deracination of the old tree took a whole morning.
- After the deracination, nothing was left of the hedge.
