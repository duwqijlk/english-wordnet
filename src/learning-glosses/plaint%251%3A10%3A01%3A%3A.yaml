simpleMeaning: In the United Kingdom, a written paper given to a court that sets out the reasons for a
  claim and asks for the wrong to be put right.
scope: In the United Kingdom, a written paper given to a court that sets out the reasons for a claim and
  asks for the wrong to be put right, not a cry of sorrow and grief.
examples:
- The plaint set out the grounds on which she sought redress.
- He filed a plaint with the court asking for the money owed him.
