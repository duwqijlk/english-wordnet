simpleMeaning: to wind round and round or to move along a winding, turning path
scope: To wind round and round or move along a winding, turning path, not to move in a straight line and
  not to make a flat winding shape.
examples:
- Black smoke spiraled up into the sky.
- The dancers spiraled across the floor in wide turns.
