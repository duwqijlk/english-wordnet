simpleMeaning: One row of buttons holds it shut, and the two sides meet with only a small overlap.
scope: It is a piece of clothing with one row of buttons and only a small overlap, not one with two rows
  and a wide overlap.
examples:
- A single-breasted jacket needs only one row of buttons to stay shut.
- With its single row of buttons, the single-breasted coat closes with only a small overlap.
