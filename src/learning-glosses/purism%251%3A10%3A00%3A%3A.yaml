simpleMeaning: Holding too hard to keeping things free of anything new or foreign, most of all in the
  words people use
scope: Holding too hard to keeping things free of anything new or foreign, most of all in words, not a
  calm care for good speech.
examples:
- His purism made him strike out every new word.
- Her purism kept the old forms of the language.
