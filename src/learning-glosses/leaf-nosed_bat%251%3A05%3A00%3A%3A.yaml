simpleMeaning: A flat flap at the front of the face, shaped like the flat green part of a plant, marks
  this bat, found above all in three named groups.
scope: Also called leafnose bat, this bat is known by the flat flap at the front of its face, found above
  all in three named groups.
examples:
- We watched a leaf-nosed bat fly past.
- A leaf-nosed bat passed close by, and we could see the flap on its face.
