senseId: 'transship%2:38:00::'
synsetId: 02017015-v
simpleMeaning: to move something from one boat or vehicle to another so it can go on to the next part
  of the trip
scope: To shift something between boats or vehicles on a longer trip; not to load it for the first time
  and not to unload it at the end.
examples:
- The workers transshipped the crates from the freighter to a smaller boat.
- Cargo is often transshipped at the port before it goes on by rail.
