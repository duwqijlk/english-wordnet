simpleMeaning: a tool for shaping wood that cuts the slots into which wedge-shaped pins fit
scope: A wood tool that cuts the slots for wedge-shaped pins, not a tool that smooths flat wood and not
  the pins themselves.
examples:
- He used a dovetail plane to cut the grooves in the drawer sides.
- The dovetail plane left clean slots for the pins.
