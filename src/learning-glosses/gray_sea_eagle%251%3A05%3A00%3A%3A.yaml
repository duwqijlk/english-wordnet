simpleMeaning: Found in Europe and Greenland, a large bird of prey with grey-brown feathers and a short
  white tail shaped like a wedge.
scope: This large bird of prey is also called ern, erne, grey sea eagle and white-tailed sea eagle.
examples:
- A gray sea eagle flew past us.
- The gray sea eagle's white tail stood out as it flew.
