simpleMeaning: People joined in a closed circle that looks for power, most of all by secret scheming,
  often hidden from others.
scope: 'Also called a faction: people joined in a closed circle that looks for power, most of all by secret
  scheming, not the secret plan itself and not the act of plotting.'
examples:
- The cabal met in secret to plan its next move for power.
- A cabal inside the party worked to push its own leader forward.
