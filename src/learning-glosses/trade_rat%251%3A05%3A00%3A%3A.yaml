simpleMeaning: Food and other things are stored away by one of many kinds of bushy-tailed rodent of the
  west of North America, in the Neotoma group.
scope: Also called a bushytail woodrat, a pack rat and a packrat, this is the rodent that stores food
  and other things away.
examples:
- We found the trade rat's store of food and odds and ends.
- The trade rat kept adding to its store.
