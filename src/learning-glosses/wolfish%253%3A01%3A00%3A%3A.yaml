simpleMeaning: like a wolf in how it looks or acts, or thought to be like a wolf
scope: 'Also called wolflike: like a wolf in looks or in the way of acting, not the sense about eating
  or wanting food in great amounts.'
examples:
- The dog had a wolfish face with sharp, watchful eyes.
- He moved through the forest with quiet, wolfish steps.
