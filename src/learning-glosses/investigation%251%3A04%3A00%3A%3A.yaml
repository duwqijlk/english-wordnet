simpleMeaning: the careful, organized work of examining a subject until the facts are clear.
scope: This is the work or process of examining something systematically, not one particular inquiry into
  suspicious or unknown activities.
examples:
- The investigation took six months and involved hundreds of documents.
- Careful investigation showed that the original report was wrong.
