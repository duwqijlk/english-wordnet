simpleMeaning: A herb found widely in warm lands, grown for animal feed and used as a soothing medicine,
  with fine soft fibres stronger than jute; at times a fast-spreading weed.
scope: A herb of warm lands, also called jellyleaf and Sida rhombifolia; not jute and not other fibre
  plants grown for rope.
examples:
- Queensland hemp grows wild across the warm lowlands.
- Farmers cut Queensland hemp for feed when grass runs short.
