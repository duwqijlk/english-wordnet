simpleMeaning: A large cart with wide wheels and a curved cloth top, used by the first settlers of the
  United States to cross the grass plains in the 1800s.
scope: Also called covered wagon, prairie schooner, prairie wagon and Conestoga wagon, this is a large
  wagon of the United States pioneers, not a small farm cart.
examples:
- The Conestoga crossed the prairie in the 1800s.
- A Conestoga carried the family west.
