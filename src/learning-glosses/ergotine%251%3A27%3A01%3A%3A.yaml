simpleMeaning: A brown, bitter stuff with no fixed shape, this strong plant chemical from the ergot fungus
  tightens tissue and makes the womb squeeze shut.
scope: This is a strong bitter chemical from ergot that makes the womb squeeze shut, not ergotamine, the
  migraine drug from the same fungus, and not a drug that relaxes the womb.
examples:
- Doctors used ergotine to make the womb contract.
- The bitter ergotine was brown and had no fixed shape.
