simpleMeaning: a heavy blade set between two tall upright posts, used as a tool to kill people by cutting
  off their heads
scope: A machine with a heavy blade for cutting off a person's head, not a rule that stops a debate and
  not the act of killing itself.
examples:
- The old guillotine stood in the town square, its blade held high.
- During the revolution, many prisoners were led to the guillotine.
