synsetId: 14302144-n
simpleMeaning: A disease of lettuce, caused by a fungus, that first spoils the lower leaves and then spreads
  up the plant
scope: A disease of lettuce that first spoils the lower leaves and then spreads up the plant; not a disease
  of the roots and not a disease that strikes the top leaves first.
examples:
- Bottom rot spoiled the lower leaves of the lettuce.
- The farmer lost half his lettuce to bottom rot.
