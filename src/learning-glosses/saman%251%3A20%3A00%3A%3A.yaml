simpleMeaning: Planted for ornament, this handsome tree from tropical America grows large and bears twice-divided
  leaves, rounded flower clusters with crimson stamens, and seed pods used as cattle feed.
scope: Another name for the large ornamental tree of the American tropics also called monkey pod and rain
  tree; it is the tree, not a different tropical plant.
examples:
- The saman cast a wide canopy over the square.
- Cattle rested beneath the saman at noon.
