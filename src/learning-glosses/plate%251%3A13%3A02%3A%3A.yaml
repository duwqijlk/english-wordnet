simpleMeaning: a thin piece of meat from the underside of an animal's front quarter
scope: A thin meat cut from the front quarter, not a main course or the dish it is served on.
examples:
- The butcher trimmed the plate before weighing it.
- Beef plate is an inexpensive cut that benefits from slow cooking.
