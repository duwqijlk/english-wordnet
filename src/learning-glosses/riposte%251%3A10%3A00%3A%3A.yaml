senseId: 'riposte%1:10:00::'
synsetId: 07214582-n
simpleMeaning: An answer given at once after another person has spoken, especially one that is clever
  or finds fault.
scope: Also called a return, a counter, a retort, a comeback, a replication, or a rejoinder, this is a
  fast answer given at once, not the fencing move of striking back right after turning aside a lunge.
examples:
- Her riposte came at once, and the whole room laughed.
- His riposte to the rude question was so clever that no one could answer it.
