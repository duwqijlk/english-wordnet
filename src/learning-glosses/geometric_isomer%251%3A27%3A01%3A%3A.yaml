simpleMeaning: Two chemicals share the same kinds and numbers of atoms, yet the parts of one are set out
  in a different shape from the other's.
scope: This names one of two chemicals that share the same kinds and numbers of atoms but differ only
  in the shape their parts take.
examples:
- Chemists found two geometric isomers in the sample.
- Chemists told the geometric isomer apart by the shape of its parts, not by its atoms.
