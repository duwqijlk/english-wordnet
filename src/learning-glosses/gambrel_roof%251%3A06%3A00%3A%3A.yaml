simpleMeaning: A gable house top with two slopes on each side, the lower slope steeper than the upper
  one.
scope: This is a gable house top with two slopes on each side, also called a gambrel; not a flat house
  top, and not a top with one slope on each side.
examples:
- The old barn had a gambrel roof with steep lower slopes.
- A gambrel roof gives more room under the top of the house.
