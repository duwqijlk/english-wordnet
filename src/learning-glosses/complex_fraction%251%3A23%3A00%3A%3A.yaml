simpleMeaning: a part of a whole with a part of a whole on top of the line, below the line, or both
scope: A part of a whole that has parts of wholes on top, below, or both, also called a compound fraction;
  not a simple part of a whole and not a whole number.
examples:
- The complex fraction with 2/3 below the line is hard to read.
- She worked out the complex fraction by first working out the small fraction on top.
