simpleMeaning: a thing that can be seen and stands for an idea that cannot be seen or touched
scope: 'Also called emblematic, symbolic and symbolical: a thing that can be seen and stands for an idea
  that cannot be seen or touched, not a picture of the thing itself and not a word that names the idea.'
examples:
- The crown was emblematical of the king's power.
- The spinning wheel was emblematical of life in old Massachusetts.
