simpleMeaning: Any plant of one small group in the rose family with sprays of small white or pink flowers
scope: Any plant of one small group in the rose family with sprays of small white or pink flowers; spiraea
  is another name for this sense, not a rose bush and not a plant with big red flowers.
examples:
- The spirea in the garden has sprays of small white flowers.
- A spirea blooms pink in early summer.
