simpleMeaning: Hoping to gain from the gap in price, a person buys stocks and bonds in one market and
  sells them at once in another
scope: Also called arbitrageur and arbitrager, this is a person who works the gap in price between two
  markets, not a person who holds shares for a long time.
examples:
- The arb bought stocks and bonds in one market and sold them at once in another.
- An arb gains from the gap in price between two markets.
