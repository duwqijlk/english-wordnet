simpleMeaning: A thing that is compared to the metal because of its shine, its high worth, or its great
  superiority.
scope: Not the metal itself or money made from it; here the word points to something else being compared
  to the metal.
examples:
- The singer's voice was pure gold on that final note.
- Her advice turned out to be gold when the crisis came.
