simpleMeaning: a show with short funny scenes about recent events, songs, dancing, and people who make
  others laugh
scope: 'Also called review: a stage show made of short scenes, songs, and dancing, not a written report
  about a book or play.'
examples:
- The theatre put on a revue with songs and short funny scenes about the news.
- We watched a revue full of dancing, singing, and jokes about recent events.
