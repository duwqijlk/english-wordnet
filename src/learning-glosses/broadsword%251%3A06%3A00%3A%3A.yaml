simpleMeaning: a sword with a wide blade and usually two sharp edges, used for cutting, not for pushing
  the point into someone
scope: This is a wide sword made for cutting, not a thin sword made for pushing its point into someone
  and not a short knife.
examples:
- The knight swung his broadsword to cut through the rope.
- He lifted the heavy broadsword with both hands and cut at the wooden post.
