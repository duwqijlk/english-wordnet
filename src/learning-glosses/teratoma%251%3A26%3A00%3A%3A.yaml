simpleMeaning: a growth in the body made of a mix of body parts that do not belong in that place
scope: A growth made of body parts that do not belong where they are found; not a common growth of one
  kind of body part.
examples:
- The surgeon removed a teratoma from the patient's ovary.
- A teratoma can contain hair and teeth.
