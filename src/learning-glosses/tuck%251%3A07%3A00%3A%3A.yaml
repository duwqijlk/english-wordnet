simpleMeaning: In sports, a way of holding the body, as in diving or skiing, with the knees bent and the
  upper legs pulled close to the chest
scope: This is a sports body position, not a small flat fold sewn in cloth and not a straight sword.
examples:
- The diver held a tight tuck as she fell toward the water.
- He went into a tuck to go faster down the ski slope.
