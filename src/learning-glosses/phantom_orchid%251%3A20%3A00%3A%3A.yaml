simpleMeaning: A white waxy plant with almost no leaves, its stems in bunches carrying loose bunches of
  white flowers, from the northwestern United States to northern California and east to Idaho.
scope: 'Also called snow orchid: a white, nearly leafless plant of the far west, not a green leafy orchid.'
examples:
- The phantom orchid stood white with almost no leaves.
- We found a phantom orchid in flower in northern California.
