simpleMeaning: on Halloween, children going from door to door to ask for sweets, saying they will play
  a joke on people who give them nothing
scope: Children going from door to door on Halloween to ask for sweets, with a joke threatened for those
  who give nothing; not a party game and not begging for money.
examples:
- The children went trick or treat around the block on Halloween.
- Dressed as ghosts, they shouted trick or treat at every door.
