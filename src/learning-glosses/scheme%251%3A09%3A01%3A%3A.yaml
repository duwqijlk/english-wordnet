schema: oewn-learning-gloss-v2
senseId: 'scheme%1:09:01::'
synsetId: 05936599-n
simpleMeaning: a picture in the mind of the world, a joining of ideas and actions that can change when
  a person learns new facts about the world
scope: This is a set of ideas in the mind about the world and about how to act in it; it is not a rough
  early plan and not a statement that avoids a question.
examples:
- A child's scheme for how dogs behave can change when she meets a friendly dog.
- His scheme of the world changed after he learned new facts on his travels.
