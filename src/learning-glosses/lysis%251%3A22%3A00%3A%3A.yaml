simpleMeaning: In biochemistry, cells such as blood cells or germs are broken apart or wiped out
scope: In biochemistry, this is the breaking apart of cells, not the slow easing of a sickness.
examples:
- Lysis of the blood cells left the sample clear.
- The drug caused lysis in the bacteria.
