simpleMeaning: A brief sudden loss of awareness that the person does not remember, sometimes with slight
  twitching or fluttering eyelids; common in petit mal epilepsy.
scope: 'The medical sense: a brief spell in which awareness is lost, unlike the everyday meaning of being
  away or not present; an absence seizure is another name for it.'
examples:
- During an absence, she stares blankly for a few seconds and then carries on.
- His absences went unnoticed until the teacher described them to a doctor.
