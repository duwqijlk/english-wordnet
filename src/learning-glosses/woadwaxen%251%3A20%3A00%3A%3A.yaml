simpleMeaning: Its yellow flowers give a dye, on a small bush from Europe and Asia, often a weed in Britain
  and the United States, sometimes kept for show
scope: This sense is also called whin, dyer's-broom, dyer's greenweed, dyeweed, greenweed, or woodwaxen,
  and it is a small bush whose yellow flowers give a dye.
examples:
- Woadwaxen grew as a weed in Britain.
- The woadwaxen flowers gave a yellow dye.
