simpleMeaning: a machine that lifts and moves heavy things, with its lifting parts hanging from a long
  arm that can turn around a straight up-and-down line
scope: This is a machine for lifting heavy things, not the large long-necked bird that lives near water.
examples:
- A crane lifted the steel beams to the top of the building.
- The workers used a crane to move the heavy box onto the ship.
