simpleMeaning: Any stuff that can break red blood cells apart and let their red colouring matter out.
scope: Any stuff that can break red blood cells apart and let their red colouring matter out; erythrocytolysin,
  erythrolysin and hemolysin are other names for it, not a protein joined to iron and not the part of
  medicine that deals with blood sicknesses.
examples:
- The haemolysin broke the red blood cells apart.
- Haemolysin let the red colouring matter out of the cells.
