simpleMeaning: Used to build chemicals that hold carbon, to coat film with a light-sensitive layer, and
  in table salt with iodine in it, this clear salt comes in hard grains.
scope: In chemistry and photography, this salt is used to build chemicals that hold carbon and to coat
  film, and it is also put in table salt.
examples:
- The chemist used potassium iodide.
- The photographer used potassium iodide for the film.
