simpleMeaning: a swelling of the scrotum, the bag of skin that holds a man's testicles, caused by a long-lasting
  block in the flow of lymph
scope: A swelling of the scrotum caused by a long-lasting block in the flow of lymph, also called elephantiasis
  scroti; not a swelling from a blow and not a tumour.
examples:
- Chyloderma swelled the scrotum after years of blocked lymph.
- The doctor found chyloderma in the patient with long-standing lymph trouble.
