simpleMeaning: Its stems have thick walls, and this large bamboo comes from China and perhaps Japan and
  is now grown far and wide.
scope: Also called giant timber bamboo and madake, it is a large bamboo from China and perhaps Japan,
  now grown far and wide.
examples:
- The ku-chiku came from China.
- Ku-chiku now grows far and wide.
