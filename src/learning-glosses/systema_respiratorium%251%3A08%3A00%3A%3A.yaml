simpleMeaning: The network for taking in oxygen and giving off carbon dioxide; in land animals this is
  done by breathing.
scope: This is the network for taking in oxygen and giving off carbon dioxide, also called respiratory
  system, and not the blood network or the lungs alone.
examples:
- The systema respiratorium takes in oxygen with each breath.
- The systema respiratorium of a dog works through its lungs.
