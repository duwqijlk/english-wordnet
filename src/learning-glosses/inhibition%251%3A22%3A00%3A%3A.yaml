simpleMeaning: In physiology, the way nerves can slow down or stop an organ or part of the body from working
scope: The body process in which nerves slow or stop an organ or part. It is not a mind pushing away thoughts
  it does not accept, not an act that bans something, and not a general feeling of holding back.
examples:
- The inhibition of the heart by this nerve slows the heart down.
- Doctors studied the inhibition of the stomach muscles by the nerves.
