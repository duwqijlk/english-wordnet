simpleMeaning: Painful burning in the chest caused by stomach contents flowing back up and irritating
  the food pipe; a sign of an ulcer, a hernia through the diaphragm or another disorder.
scope: This is burning chest pain from stomach acid flowing back up, not the crushing pain of a heart
  attack or ordinary indigestion.
examples:
- He complained of pyrosis after every heavy meal.
- The clinic notes recorded pyrosis and a chronic cough.
