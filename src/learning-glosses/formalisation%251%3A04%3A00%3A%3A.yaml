senseId: 'formalisation%1:04:00::'
synsetId: 01011579-n
simpleMeaning: The act of making something follow set rules, as by writing out the rules that govern kinds
  of word strings.
scope: Making something follow set rules; formalization is another name for this sense, not making something
  official by law and not a casual change.
examples:
- The formalisation of the rules took months of hard work.
- His formalisation of the grammar helped students learn it.
