simpleMeaning: In computer science, the smallest single part of a picture on a CRT screen (a screen that
  makes its picture inside a glass tube), usually a colored dot
scope: This is the smallest part of a screen picture, also called pixel and also called picture element;
  it is not the whole picture or the whole screen.
examples:
- Each pel on the screen showed as a tiny dot of color.
- The picture was made of many pels, each one a single dot.
