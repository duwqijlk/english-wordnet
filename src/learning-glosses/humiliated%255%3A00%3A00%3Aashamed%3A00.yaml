simpleMeaning: Made to feel uneasy after shame or a hurt to your pride
scope: Feeling uneasy from shame or hurt pride, also called embarrassed; not feeling proud and not feeling
  merely shy.
examples:
- He felt humiliated when his mistake was pointed out in front of everyone.
- She was humiliated when the whole class laughed at her answer.
