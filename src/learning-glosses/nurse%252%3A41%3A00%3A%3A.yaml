simpleMeaning: To work as a professional carer and look after people who are ill or disabled.
scope: This is doing the job or giving such care, not treating an illness itself, feeding a baby at the
  breast, or the noun for the profession.
examples:
- He nursed the elderly patients on the night ward.
- She nursed in the same hospital for over twenty years.
