simpleMeaning: One of three blood tubes that feed the front walls of the belly.
scope: 'Also called an arteria epigastrica: one of three blood tubes that feed the front walls of the
  belly, not a blood tube that takes blood away and not a tube that feeds the back of the belly.'
examples:
- The epigastric artery feeds the front wall of the belly.
- One epigastric artery runs down the front of the belly.
