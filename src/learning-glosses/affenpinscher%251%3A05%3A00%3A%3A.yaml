simpleMeaning: Like a terrier, this small European dog has dark stiff hair and a muzzle with a tuft of
  hair.
scope: This is also called a monkey dog and a monkey pinscher; it looks like a terrier but is its own
  small European kind.
examples:
- The affenpinscher's dark wiry hair and tufted muzzle showed in the photo.
- An affenpinscher trotted beside him, muzzle tufted with hair.
