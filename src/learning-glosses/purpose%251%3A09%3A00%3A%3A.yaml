senseId: 'purpose%1:09:00::'
synsetId: 05991037-n
simpleMeaning: The result that you intend to achieve and that guides what you plan to do.
scope: This is not the firmness of character that keeps someone going; it is the intended result that
  their actions aim at.
examples:
- The purpose of the meeting is to agree on a budget.
- She explained the purpose of her visit straight away.
