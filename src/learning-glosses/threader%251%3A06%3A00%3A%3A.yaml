simpleMeaning: a blunt needle used to push a strip of cloth through small rings
scope: 'Bodkin is another name for this sense: a blunt needle for pushing ribbon through loops, not a
  sharp sewing needle and not a tool for cutting cloth.'
examples:
- She used a threader to pull the ribbon through the loops of the dress.
- The threader slid the ribbon through each loop with ease.
