simpleMeaning: In phonetics, a single speech sound, whether or not it is a phoneme in a particular language.
scope: This is not the particular audible effect of a cause, the sensation of hearing, mechanical vibrations
  in a medium, a sudden audible event, the audible part of a broadcast signal, a narrow channel of the
  sea, or a large sea inlet or bay.
examples:
- The phonetics class counted every sound in the word 'strength'.
- Each sound in the word is written with its own symbol in the transcription.
