senseId: 'philosophicalness%1:07:01::'
synsetId: 92423552-n
simpleMeaning: the state of having the mind of a thinker, above all of staying calm and steady when trouble,
  loss, or defeat comes
scope: The state of having the mind of a thinker, above all of staying calm and steady when trouble comes;
  not skill in arguing and not a love of hard questions.
examples:
- She faced the loss with philosophicalness, calm and steady to the end.
- His philosophicalness showed in the way he took defeat without complaint.
