senseId: 'phenolphthalein%1:06:00::'
synsetId: 03928231-n
simpleMeaning: Chemists use this chemical to show when an acid has been neutralized, since it turns red
  in strong alkali and colorless below pH 8; many branded laxatives contain it.
scope: The laxative chemical that also acts as a color-change indicator, not another laxative or a different
  laboratory dye.
examples:
- The solution turned pink as soon as a drop of phenolphthalein was added.
- Phenolphthalein was once a common laxative in over-the-counter pills.
