simpleMeaning: to make fine open lace by tying knots or loops in thread
scope: This is making fine open lace by tying knots or loops in thread; intertwine is another name for
  this sense, and it is not the noun sense of cheap bad taste or weaving cloth.
examples:
- She learned to tat lace from her grandmother.
- He sat by the fire and tatted a collar for the dress.
