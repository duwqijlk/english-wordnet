simpleMeaning: To hit a ball above its center in golf, baseball or pool so that it spins forward.
scope: This is not placing something on the highest point, not covering something with a lid and not the
  spinning toy; it is striking a ball above its center in a game.
examples:
- He topped the ball and it rolled along the ground.
- She topped her drive into the rough.
