simpleMeaning: a clear liquid that small glands in the mouth make; it wets the mouth and begins the breaking
  down of starches
scope: The clear liquid in the mouth, also called spit or saliva, and not the act of spitting it out.
examples:
- He wiped the spittle from his chin.
- Spittle helps to break down the starch in bread.
