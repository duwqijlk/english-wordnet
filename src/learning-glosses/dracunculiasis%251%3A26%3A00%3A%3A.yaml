simpleMeaning: A painful disease caught by drinking standing water that holds Guinea worm larvae (young
  worms), which grow inside the body and later push out through a skin blister.
scope: A parasitic worm infection also called Guinea worm disease, not an ordinary stomach illness or
  a bacterial infection; it comes from swallowing the worm's larvae in untreated standing water.
examples:
- Dracunculiasis has been eliminated in most countries where it once occurred.
- Villagers filter their drinking water to prevent dracunculiasis.
