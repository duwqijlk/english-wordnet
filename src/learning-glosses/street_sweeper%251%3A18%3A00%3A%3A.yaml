simpleMeaning: a worker whose job is to clear roads, above all one who works for the town's cleaning service
scope: This is a worker whose job is to clear roads, also called street cleaner; not a person who cleans
  houses and not a driver of a cleaning truck.
examples:
- The street sweeper cleared the road before the shops opened.
- A street sweeper works for the town's cleaning service.
