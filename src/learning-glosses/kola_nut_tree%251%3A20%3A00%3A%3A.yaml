simpleMeaning: Large brown seeds that hold such things as caffeine grow on it, and cola drinks take their
  flavour from those seeds.
scope: Also called goora nut, kola and kola nut, it names the tree whose seeds give cola drinks their
  flavour.
examples:
- The kola nut tree bore large brown seeds.
- Seeds from the kola nut tree go into the extract for cola drinks.
