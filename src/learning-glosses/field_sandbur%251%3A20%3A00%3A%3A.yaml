simpleMeaning: Small flower heads shut inside sharp, spiky seed cases mark this grass of the eastern United
  States and hot parts of America.
scope: Also called sandbur and sandspur, this names the grass of the eastern United States and hot parts
  of America, with small flower heads shut inside sharp, spiky seed cases.
examples:
- Field sandbur spread across the pasture.
- The field sandbur caught on his socks with its prickly burs.
