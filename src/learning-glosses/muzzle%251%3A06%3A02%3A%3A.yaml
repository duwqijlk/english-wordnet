simpleMeaning: A leather or wire cover that fits over an animal's nose and jaws, especially a dog's, to
  stop it eating or biting
scope: A cover fitted over an animal's nose and jaws, not the animal's own nose and jaws and not a gag
  put in a person's mouth.
examples:
- The dog wore a muzzle on the walk.
- They put a muzzle on the biting dog.
