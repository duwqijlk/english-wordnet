simpleMeaning: a band of flesh in the eye whose pull turns the eyeball outward
scope: A band of flesh in the eye whose pull turns the eyeball outward, also called lateral rectus and
  lateral rectus muscle; not the flesh that turns the eye inward and not the lid flesh.
examples:
- The abducens muscle turns the eyeball outward.
- Damage to the abducens muscle stops the eye turning out.
