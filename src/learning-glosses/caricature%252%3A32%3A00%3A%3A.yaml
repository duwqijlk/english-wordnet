senseId: 'caricature%2:32:00::'
synsetId: 00851272-v
simpleMeaning: to draw or write about a person in a funny way, with their look or actions made to seem
  much more than they really are
scope: 'This is the verb: to make a funny drawing or piece of writing like this about a person, not the
  noun for the drawing or writing itself.'
examples:
- The artist caricatured the mayor, drawing his nose much larger than it really is.
- She caricatures famous actors in quick, funny drawings.
