simpleMeaning: Leaves that spread like a fan and fork again and again mark this big fern from Australia
  and nearby lands, at times put in the Gleichenia group.
scope: This big fern from Australia and nearby lands is also called fan fern, and its leaves spread like
  a fan and fork again and again.
examples:
- We found an umbrella fern with leaves that spread like a fan.
- The umbrella fern's leaves forked again and again.
