simpleMeaning: Soldiers who rode camels formed the mounted force of Arab, Afghan, Persian, and Indian
  armies in early modern times.
scope: Camel cavalry is another name for this mounted force of soldiers on camels, also called zamburak,
  zamburek, zumbooruck, and zumbooruk, used by Arab, Afghan, Persian, and Indian armies in early modern
  times.
examples:
- Ahead of the main army rode the zamboorak.
- The general sent the zamboorak to guard the pass.
