simpleMeaning: In psychoanalysis, the second step in a child's growth in the body's feelings and in dealing
  with people, when the child learns to control the bowels
scope: In psychoanalysis, the second stage in the way a child grows, also called anal phase; not the first
  stage of a baby and not a later stage.
examples:
- The therapist said the anal stage is the second stage in a child's growth.
- During the anal stage, the child learns to use the toilet on her own.
