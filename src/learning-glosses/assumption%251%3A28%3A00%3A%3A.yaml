simpleMeaning: A Roman Catholic feast day marking the Virgin Mary being taken up into heaven when her
  life on earth ended; the Eastern Orthodox Church keeps it as the Dormition.
scope: Not the taking up itself, nor any other feast of Mary; also called the Assumption of Mary and August
  15.
examples:
- Catholics keep the Assumption on August 15.
- The Assumption is a holy day in many lands.
