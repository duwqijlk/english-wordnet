simpleMeaning: Clusters of small white or pinkish blooms and broad leaves that end in a point or a round
  edge mark what grows in marshes.
scope: This is what grows in marshes, with clusters of small white or pinkish blooms and broad leaves
  that end in a point or a round edge.
examples:
- The water plantain grew in the marsh, its white blooms in clusters.
- We found water plantain by the marsh, its broad leaves ending in a point.
