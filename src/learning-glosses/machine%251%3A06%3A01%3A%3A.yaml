simpleMeaning: 'A car: a four-wheeled road vehicle that is usually powered by an engine that burns fuel.'
scope: This is the everyday word for a car, a road vehicle for carrying people; it is not a powered household
  appliance, and not a simple lever-and-pulley tool.
examples:
