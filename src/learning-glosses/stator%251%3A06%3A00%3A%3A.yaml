simpleMeaning: Inside a motor or a generator, the moving part turns in or round this machine part, which
  stays still
scope: Also called stator coil, this machine part stays still inside a motor or a generator while the
  moving part turns in or round it.
examples:
- I checked the stator in the motor.
- The rotor turned round the stator.
