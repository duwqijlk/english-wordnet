simpleMeaning: a person who causes another person great pain or suffering
scope: 'Also called tormenter: a person who causes great pain or trouble for another person, not the pain
  itself and not a person who hurts someone by chance.'
examples:
- In the story, the child finally stood up to his tormentor.
- She left the job to get away from her tormentor at work.
