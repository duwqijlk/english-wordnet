simpleMeaning: how short parts of music are grouped together in a tune
scope: This is about how parts of music are grouped in a line of music, not about the choice of words
  in speech or writing.
examples:
- The pianist's phrasing made the slow line of music feel smooth and clear.
- In this song, the phrasing groups the notes into short, clear parts.
