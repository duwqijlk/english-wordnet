simpleMeaning: Black patches and stripes run through the red-brown wood of this tree from south-east Asia.
scope: This tree from south-east Asia is also called padauk and padouk, and it is not the wood cut from
  it.
examples:
- The amboyna was cut for its red-brown wood.
- The wood of the amboyna was picked for its dark streaks.
