simpleMeaning: A white, tasteless, smell-free, crystal-like stuff made when the body breaks down protein,
  found in the blood and urine.
scope: A white, tasteless, smell-free, crystal-like stuff from the body's breaking down of protein, found
  in blood and urine, not a salt and not a gas.
examples:
- Uric acid is found in the blood and urine.
- Uric acid is a white, tasteless stuff made when the body breaks down protein.
