simpleMeaning: 'They stop muscles from moving: any of several poisons that harm nerves, made by a germ
  that lives without air.'
scope: Any of several nerve-harming poisons made by a germ that lives without air, not the germ itself.
examples:
- The patient could not move her arm after the botulinum toxin took hold.
- The botulinum toxin left his legs limp and still.
