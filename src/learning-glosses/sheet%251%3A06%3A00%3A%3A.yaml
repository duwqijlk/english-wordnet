simpleMeaning: One of a pair of big rectangular cloths of cotton or linen that make up bed linen
scope: 'The bed-linen sense: a cloth for a bed; bed sheet is another name for it. It is not a flat item
  such as paper or metal and not the wind-catching cloth of a sail.'
examples:
- She changed the sheets on the bed before the guests arrived.
- The hotel uses white cotton sheets and matching pillowcases.
