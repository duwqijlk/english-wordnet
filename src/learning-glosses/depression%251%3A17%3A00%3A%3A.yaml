simpleMeaning: In geology, a part of the earth's surface that has sunk below the land around it
scope: This is a low, sunk area of land, not a mental illness that needs doctor care and not an angle
  below the horizon.
examples:
- The river runs through a wide depression in the rock.
- From the hill we could see a shallow depression in the ground.
