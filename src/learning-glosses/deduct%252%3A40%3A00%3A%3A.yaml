simpleMeaning: to keep back money and not pay it out, when the money is a payment
scope: 'Also called withhold and recoup: this sense is keeping back a payment and not paying it out, not
  working out an answer by thinking step by step.'
examples:
- My employer deducts part of my pay for tax and does not give me that part.
- The bank deducts a fee each month and keeps the money instead of paying it to me.
