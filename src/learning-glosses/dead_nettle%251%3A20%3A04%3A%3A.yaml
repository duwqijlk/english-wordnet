simpleMeaning: A rough bristly plant from Europe and Asia with white or reddish flowers and leaves like
  a stinging plant's, common as a weed in America
scope: Also called hemp nettle; a rough weed with leaves like a stinging plant's, not the stinging plant
  itself.
examples:
- Dead nettle spread along the edge of the field.
- She pulled the dead nettle out of the flower bed.
