simpleMeaning: From Asia comes a bushy shrub that winds round other plants, bears pinkish fruit, and spreads
  wide, with many kinds or sorts within it.
scope: A bushy Asian shrub with pinkish fruit, not the American bittersweet of North America.
examples:
- The evergreen bittersweet climbs over the old wall.
- Gardeners plant evergreen bittersweet for its pinkish fruit.
