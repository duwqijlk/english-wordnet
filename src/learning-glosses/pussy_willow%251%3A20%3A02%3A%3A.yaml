simpleMeaning: A much-branched tree of Europe and Asia with large soft flower buds and wide leaves that
  are big for this kind of tree
scope: A much-branched Old World tree with large soft buds and wide leaves, also called goat willow and
  florist's willow; not the small eastern North American tree with grey leaves, and not any other willow.
examples:
- The pussy willow spread its many branches over the fence, its wide leaves shading the path.
- We picked the large soft buds from the pussy willow to use in a spring display.
