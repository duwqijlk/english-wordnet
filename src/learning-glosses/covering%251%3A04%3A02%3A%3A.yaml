senseId: 'covering%1:04:02::'
synsetId: 01051609-n
simpleMeaning: The act of hiding a thing so no one can see it, by putting something in the way of the
  eyes
scope: Also called cover, this is the act of hiding a thing by blocking the view of it, not a made thing
  that lies over something, and not the act of keeping a thing safe by lying over it.
examples:
- Their covering of the guns hid them from the planes above.
- The soldiers' covering of the truck kept it out of sight.
