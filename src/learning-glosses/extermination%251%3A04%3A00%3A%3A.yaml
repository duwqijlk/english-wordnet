simpleMeaning: the act of killing all of a kind or group, so that none are left
scope: Killing every one of a kind or group. It is not killing one person, and it is not harm that leaves
  some alive.
examples:
- The extermination of the rats in the barn took two days.
- They planned the complete extermination of the harmful insects.
