schema: oewn-learning-gloss-v2
senseId: 'true_dwarf%1:18:00::'
synsetId: 10492032-n
simpleMeaning: a short person whose small size comes from a fault in the genes, with normal body parts
  and normal mental and sexual growth
scope: A person of small size from a fault in the genes, with normal growth otherwise; hypoplastic dwarf,
  normal dwarf and primordial dwarf are other names for this sense, not a person whose small size comes
  from poor food or illness.
examples:
- The true dwarf was small because of a fault in his genes, but his body and mind grew in the normal way.
- Doctors said the true dwarf's growth was normal in every way but height.
