scope: 'Also called common dogbane, rheumatism weed, and spreading dogbane: a North American plant living
  for many years, with pinkish flowers in loose clusters, used in folk medicine for pain or inflammation
  in joints, unlike its Canadian relative, which yields a tough fibre used as cordage.'
examples:
