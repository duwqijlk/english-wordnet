simpleMeaning: a building made in parts in a factory, ready to be put together in the place where it will
  be used
scope: This is a building made in parts first; it is not the describing word for things made in set sizes
  and sent to be built in another place.
examples:
- They lived in a prefab while their new house was built.
- The school added a prefab for two more classrooms.
