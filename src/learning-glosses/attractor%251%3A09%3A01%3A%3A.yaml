simpleMeaning: In physics, a point in a made-up space of many sides, used to show where a system is heading,
  whatever state it starts in.
scope: Also called an attracter, this is a point in physics that shows where a system is heading, not
  a pleasing thing or a person who draws crowds.
examples:
- The attractor showed where the system would end up.
- In the model, the attractor pulled every path toward one point.
