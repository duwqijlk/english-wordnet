simpleMeaning: To take great care over your appearance, spending time on your clothes, hair and grooming.
scope: This is about spending a lot of care on your appearance and grooming; it is not simply putting
  clothes on, and not about following a particular style of clothing.
examples:
- She spent an hour dressing, choosing her clothes and fixing her hair.
- He dressed with great care, checking every detail in the mirror.
