senseId: 'partial_tone%1:09:00::'
synsetId: 05728040-n
simpleMeaning: In sound, a sound that shakes two, three, or more times as fast as the main low sound it
  goes with
scope: 'Also called a partial or an overtone: in sound, a high sound that shakes a whole number of times
  as fast as the main low sound, not the main low sound itself and not a sound with no set pitch.'
examples:
- The violin string gave off a clear partial tone above the main note.
- Each partial tone of the bell rang at a whole-number multiple of the lowest pitch.
