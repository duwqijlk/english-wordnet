simpleMeaning: Of paint or varnish, having a surface covered in a pattern of cracks
scope: 'This is about the look of paint or varnish: its surface is covered in a pattern of cracks. It
  is not the informal or slang sense for a person whose mind does not work in a normal way.'
examples:
- The old door had cracked paint with lines all over it.
- The table's cracked varnish looked rough and dry in the sun.
