simpleMeaning: To talk fast and without stopping about things that do not matter.
scope: This is talking fast and without stopping about unimportant things; chatter and clack are other
  names for this sense, not empty talk as a thing in itself or serious talk.
examples:
- The children prattled all the way home about their new teacher.
- She prattled on about the weather while the soup grew cold.
