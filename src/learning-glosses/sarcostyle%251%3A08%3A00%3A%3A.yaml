senseId: 'sarcostyle%1:08:00::'
synsetId: 05467529-n
simpleMeaning: one of many thin threads that can shorten and pull, and together they form a striped muscle
  fibre
scope: One of many thin threads in a muscle fibre; myofibril and myofibrilla are other names for this
  sense. Not the whole muscle, and not a nerve thread.
examples:
- Each sarcostyle shortens when the muscle pulls tight.
- The sarcostyle is one of thousands of tiny threads inside a muscle fibre.
