simpleMeaning: A big cat-like animal from the Americas that looks like a lion
scope: A big cat-like animal from the Americas that looks like a lion; painter, panther, cougar, catamount
  and mountain lion are other names for this sense, and it is not a lion or a tiger.
examples:
- A puma crossed the road in front of our car.
- The puma rested in the shade of a tall tree.
