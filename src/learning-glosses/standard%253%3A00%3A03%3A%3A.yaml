simpleMeaning: Said of words and grammar that well-educated native speakers accept as correct.
scope: This is about correct usage in a language, not the general sense of being usual, regularized, or
  accepted in kind, not something commonly used or supplied, not something widely recognized as a model
  of authority or excellence, not something regularly used or sold, and not the noun senses such as a
  basis for comparison, an ideal, a board measure, the value behind money, an upright pole, or a flag.
examples:
- Newspapers generally use standard English in their news reports.
- The teacher corrected the pupils' dialect forms and asked for standard spelling.
