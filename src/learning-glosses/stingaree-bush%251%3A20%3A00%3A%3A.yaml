simpleMeaning: A thorny, drought-tolerant evergreen shrub that has showy flowers in rose and purple and
  grows in dense thickets. It is found on California's dry, rocky mountain slopes.
scope: This is a thorny evergreen California mountain shrub with rose and purple flowers, not the eastern
  creeping wintergreen that bears the spicy red fruit and yields the fragrant oil, and not the other wintergreen-named
  plants in this group.
examples:
- The stingaree-bush was blooming among the rocks on the dry hillside.
- Thickets of stingaree-bush made the slope nearly impassable.
