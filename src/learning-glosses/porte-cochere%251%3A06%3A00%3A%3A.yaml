senseId: 'porte-cochere%1:06:00::'
synsetId: 03992429-n
simpleMeaning: a roof that sticks out from a building door and gives cover to people as they get in and
  out of vehicles
scope: This is a roof that sticks out from a building door to cover people getting in and out of vehicles,
  not a carriage entrance that passes through a building to a closed yard.
examples:
- We waited under the porte-cochere while the driver brought the car to the door.
- Rain fell on the porte-cochere as guests got out of their cars at the hotel entrance.
