simpleMeaning: A radio set that moves by itself over a chosen range of wave rates, looking for a signal
  or a state.
scope: A radio set that scans wave rates by itself, also called a scanner; not a fixed radio and not a
  person listening.
examples:
- They used an electronic scanner to watch the police radio channels.
- The electronic scanner stopped when it found a strong signal.
