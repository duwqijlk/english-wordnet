simpleMeaning: Used of nerves and the signals they carry, sending word out from the brain and spine to
  the body.
scope: Also called efferent; used of nerves and signals that carry word out from the brain and spine,
  not of nerves that carry word in from the senses.
examples:
- Motorial signals tell the hand to grip.
- The motorial path runs from the spine to the muscle.
