simpleMeaning: A very large fruit from East India, like breadfruit, with soft parts you can eat inside
  and seeds full of good food value that people often roast
scope: 'Also called jack and jak: this is the fruit itself, not the East Indian tree that bears it.'
examples:
- We cut open a jackfruit and ate the soft yellow parts inside.
- The market sold a huge jackfruit and bags of its roasted seeds.
