schema: oewn-learning-gloss-v2
senseId: 'purify%2:30:02::'
synsetId: 00477064-v
simpleMeaning: to become clean, or to become free from the wrong you have done and from feeling you have
  done wrong
scope: This sense is about a person becoming free from wrong acts themselves; it is not about someone
  making a person free, and not about cleaning a thing or a liquid.
examples:
- He went to the temple hoping to purify after years of wrong acts.
- She tried to purify by living a good and honest life.
