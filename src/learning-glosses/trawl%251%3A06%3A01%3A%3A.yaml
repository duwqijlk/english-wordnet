simpleMeaning: a long line for catching fish, with many short lines and hooks on it, usually hung in the
  water between floats
scope: This long fishing line is also called a trotline, a spiller, a setline, or a trawl line; it is
  not a cone-shaped net dragged through deep water, and not the act of fishing with such a net.
examples:
- They set a trawl between two buoys and checked the hooks in the morning.
- The trawl had dozens of hooks on its short side lines.
