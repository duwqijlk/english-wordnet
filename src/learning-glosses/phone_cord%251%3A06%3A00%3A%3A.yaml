simpleMeaning: The part you hold to your ear is joined to the rest of the set by this wire
scope: The wire that joins the earpiece to the rest of the set, not the wire that joins the set to the
  wall and not a wire for a computer.
examples:
- The phone cord was tangled, so I could not walk far with the handset.
- She wound the phone cord round the base when she put the set away.
