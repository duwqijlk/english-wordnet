simpleMeaning: a mark (:) used after a word that comes before a list, an example, or words that explain
  something, or after the opening words of a business letter
scope: This is the writing mark (:), not the long part of the gut inside the body.
examples:
- 'Use a colon before this list: pens, paper, and ink.'
- She put a colon after 'Dear Sir' in the business letter.
