simpleMeaning: In human shape with horns, pointed ears, and a goat's tail, a god from Italy in very early
  times, the same as a Greek satyr
scope: This is the old Italian god in human shape with goat parts, the Italian form of a Greek satyr,
  not a real animal.
examples:
- The story tells of a faun playing music in the woods.
- A faun with horns and a goat's tail stood by the path.
