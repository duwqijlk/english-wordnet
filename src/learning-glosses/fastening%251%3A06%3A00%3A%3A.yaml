simpleMeaning: something that holds a thing still by being joined to it
scope: Something that holds a thing still by being joined to it; fixing and holdfast are other names for
  this sense, and it is the thing itself, not the act of joining.
examples:
- Check that the fastening on the gate is shut.
- The fastening held the rope in place.
