simpleMeaning: to write, draw, or copy the shape of something with a stick of soft white stone
scope: The act of writing or drawing with the white stick, not the stick itself and not the drug of the
  same name.
examples:
- The teacher chalked the new words on the board.
- He chalked a line on the floor to show where to stand.
