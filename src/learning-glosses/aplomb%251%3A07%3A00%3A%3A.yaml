simpleMeaning: a way of staying very calm and steady when you are under pressure
scope: Cool, poise and assuredness are other names for this sense. It is staying very calm and steady
  when you are under pressure, not coldness of the body or the weather.
examples:
- She spoke with aplomb, even though the crowd pressed her with hard questions.
- He kept his aplomb when the plan failed and calmly told us the next step.
