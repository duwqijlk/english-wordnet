simpleMeaning: a small shark that lives on the sea floor in warm, shallow water off both coasts of North
  and South America and from southeast Asia to Australia
scope: A small shark that rests on the sea floor in warm, shallow water, not a great white shark and not
  a shark that hunts in open water.
examples:
- A nurse shark lay still on the sea floor in the warm, shallow water.
- We saw a nurse shark off the coast of Florida.
