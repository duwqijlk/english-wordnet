schema: oewn-learning-gloss-v2
senseId: 'memory_picture%1:09:00::'
synsetId: 05944734-n
simpleMeaning: something you see in your mind that looks like a thing you really saw
scope: What you see again in your mind from something you saw before, like a mental image but tied to
  a real sight, not a dream and not a thought about the future.
examples:
- A memory picture of her childhood home came to her as she closed her eyes.
- He kept a memory picture of the lake in his mind.
