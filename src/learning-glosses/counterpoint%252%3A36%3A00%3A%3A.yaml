simpleMeaning: to write music where two or more tunes are played at the same time and fit well together
scope: This is the act of writing music with tunes that play at the same time, not the name for that kind
  of music itself.
examples:
- The student learned to counterpoint a slow tune against a fast one.
- He counterpointed the two tunes so they could be played together.
