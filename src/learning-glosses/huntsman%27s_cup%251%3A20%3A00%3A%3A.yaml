simpleMeaning: A perennial bog herb whose dark red flowers rise above flat winged tube-shaped traps in
  a ring; native to northeastern North America and now wild in Ireland and Europe.
scope: The same dark-red-flowered bog dweller that common pitcher plant also names; not the taller southern
  pitcher plants with yellow flowers or white-hooded traps.
examples:
- Huntsman's cup opens dark red flowers just above its ring of winged leaves.
- Botanists first recorded huntsman's cup in the bogs of northeastern North America.
