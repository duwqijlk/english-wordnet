simpleMeaning: In electronics, a short, sharp wave that rises and falls quickly in the usual flow of power,
  or a set of such waves
scope: In electronics, a short, sharp wave in the flow of power, also called pulse or pulsing. Not the
  sign that moves along a nerve, and not a sudden wish to do something.
examples:
- A sudden impulse in the circuit damaged the small device.
- The machine sent a short impulse through the wire.
