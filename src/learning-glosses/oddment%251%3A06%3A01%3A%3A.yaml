simpleMeaning: an unusual thing that may be worth collecting
scope: An unusual thing a person may want to collect, also called curiosity, oddity, rarity, curio, or
  peculiarity; it is not a small leftover piece of cloth or other material.
examples:
- He kept the oddment, a tiny silver spoon, in his collection.
- 'She bought an oddment at the market: a strange old key that no one could name.'
