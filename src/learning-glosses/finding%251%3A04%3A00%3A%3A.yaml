simpleMeaning: the work of discovering the facts or qualities of something, often through study or calculation.
scope: This is the act of establishing facts, not the result or conclusion that is reached.
examples:
- The finding of the ship's exact position took several hours.
- The finding of the cause of the outbreak took months of study.
