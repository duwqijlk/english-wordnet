simpleMeaning: The lesser part comes after the main part in a group of words that says a full thought
scope: This is a group of words that says a full thought, with the lesser part after the main part, not
  a group of words with the main part last and not a group of words with only one part.
examples:
- He wrote a loose sentence that began with the main point and added the details after it.
- Her loose sentence started with the news and then gave the reason why.
