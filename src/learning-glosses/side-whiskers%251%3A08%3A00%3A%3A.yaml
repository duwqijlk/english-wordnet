simpleMeaning: Hair that grows in front of a man's ears, especially when the rest of his beard is shaved
  off
scope: Hair on the side of a man's face, also called a sideburn, a burnside or a mutton chop; not a full
  beard and not a moustache.
examples:
- His side-whiskers reached down to his jaw.
- He kept his side-whiskers but shaved the rest of his beard.
