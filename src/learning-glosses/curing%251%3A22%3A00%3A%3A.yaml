simpleMeaning: the process in which something becomes hard or solid when it cools, dries or forms crystals
scope: Also called set, hardening and solidifying; this is a material becoming hard, not healing a sick
  person and not a way to keep food from going bad.
examples:
- The curing of the concrete took several days in the cold air.
- We waited for the curing of the glue before we used the chair.
