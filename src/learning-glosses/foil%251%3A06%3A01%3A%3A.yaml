simpleMeaning: A thin sheet of metal that bends easily.
scope: A thin sheet of metal that bends easily, not a light sword, not a picture on clear film, not a
  water device, and not a thing that sets off another's good points by contrast.
examples:
- She wrapped the fish in foil before cooking it.
- He covered the dish with foil to keep it warm.
