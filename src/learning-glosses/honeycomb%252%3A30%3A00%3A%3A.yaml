simpleMeaning: to make many small holes through something, like the cells in a bees' nest
scope: To fill a thing with small holes; not the wax comb itself, and not cutting a pattern into a surface.
examples:
- The wood was honeycombed with tiny holes.
- Worms had honeycombed the old beam.
