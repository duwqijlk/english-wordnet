simpleMeaning: a board with holes set in even rows, with short sticks that can be put into the holes
scope: This is a board with holes in even rows for short sticks; it is not a plain board with no holes
  and not a board used for a game.
examples:
- He hung his tools on a pegboard in his work room.
- She put the short sticks into the holes of the pegboard.
