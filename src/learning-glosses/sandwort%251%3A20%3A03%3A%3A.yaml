simpleMeaning: A loosely matted plant with moss-like leaves set with tiny starry four-petaled white blooms,
  of the mountains of central and southern Europe.
scope: This sense is a loosely matted plant with moss-like leaves set with tiny starry four-petaled white
  blooms, unlike the sense for a low-growing, chiefly perennial plant, usually with small white flowers,
  fit for rock gardens and the like.
examples:
- Sandwort bloomed white in the mountains.
- Sandwort mats the ground with moss-like leaves.
