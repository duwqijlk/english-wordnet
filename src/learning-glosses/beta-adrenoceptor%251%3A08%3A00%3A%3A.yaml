simpleMeaning: Receptors said to lie in sympathetic nerves on the walls of nerve cells, showing why some
  drugs reach only a few of its doings, like wider vessels and faster heartbeat.
scope: Also called beta-adrenergic receptor and beta receptor, receptors said to lie in sympathetic nerves
