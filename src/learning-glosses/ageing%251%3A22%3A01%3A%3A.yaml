simpleMeaning: getting better in the way people want by being left alone and not touched for some time
scope: This sense, also called aging and also called ripening, is about a thing getting better while it
  is left alone; it is not about a person growing old.
examples:
- The ageing of the wine in barrels made it taste better.
- Ageing helps this cheese get a richer taste when it is left alone.
