simpleMeaning: not held back by good manners or by what people think is right, and showing no shame
scope: 'Also called insolent, brazen, audacious and barefaced: about a person who does not care about
  good manners and shows no shame, not about a sound like a thing made of brass used to make music.'
examples:
- With a brassy smile, she walked in late and took the best seat without asking.
- His brassy reply shocked everyone in the quiet room.
