simpleMeaning: A hairy upright plant with a soft stem native to southeastern Asia but grown in many places
  for its large shiny fruit, which is commonly eaten as a vegetable.
scope: This is the plant that bears the fruit, not the fruit sold as a vegetable or a cooked dish. The
  same word often names the fruit, but here it means the growing plant. The name is standard, not technical
  or dated.
examples:
- The eggplant in our garden grew almost a metre tall and felt rough to the touch.
- Eggplants grow best in warm, sunny beds.
