simpleMeaning: A North American plant of wet places that lives many years, with soft stems and slender
  curled spikes of small white flowers.
scope: Also called lizard's-tail, swamp lily and water dragon; a plant of wet places with curled spikes
  of small white flowers, not a dry-land plant and not a tree.
examples:
- Saururus cernuus grows in wet places in North America.
- Saururus cernuus has slender curled spikes of small white flowers.
