simpleMeaning: very harsh and unkind in the way something is said or written
scope: This is about the tone of words, not a sharp taste and not a painful feeling from cold.
examples:
- She used bitter words when she spoke about her former boss.
- He wrote a bitter attack on the plan in the newspaper.
