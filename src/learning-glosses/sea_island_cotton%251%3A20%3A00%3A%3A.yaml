simpleMeaning: Fibers far longer than most, soft as silk, come from a small tree with many branches on
  Caribbean islands and off the Atlantic coast of the southern United States.
scope: Also called tree cotton, this small tree of Caribbean islands and the southern United States coast
  gives long soft fibers.
examples:
- Sea island cotton grows on Caribbean islands and gives very long soft fibers.
- Sea island cotton yields fibers far longer than most.
