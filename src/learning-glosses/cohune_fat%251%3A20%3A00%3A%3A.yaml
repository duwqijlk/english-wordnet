simpleMeaning: a half-solid cooking grease from the seeds of a palm tree, also used to make soap
scope: A half-solid cooking grease from the seeds of a palm tree, also used to make soap; cohune-nut oil
  and cohune oil are other names for this, not a liquid cooking grease and not a grease from an animal.
examples:
- Cohune fat is half solid at room temperature.
- They cook with cohune fat.
