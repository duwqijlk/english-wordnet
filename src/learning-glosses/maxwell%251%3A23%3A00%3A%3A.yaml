simpleMeaning: A unit of magnetic flux in the cgs (centimeter, gram, second) system, equal to the flux
  through 1 square centimeter at right angles in a magnetic field of 1 gauss
scope: This is a unit for measuring magnetic flux, not the magnetic field itself and not a unit of length
  or weight.
examples:
- The flux was measured as 500 maxwells.
- One maxwell is a very small unit of magnetic flux.
