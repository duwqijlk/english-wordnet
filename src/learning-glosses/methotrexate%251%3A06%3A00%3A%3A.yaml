simpleMeaning: a toxic substance that interferes with body chemicals (an antimetabolite); it blocks folic
  acid and slows how fast cells multiply; used against some cancers, psoriasis and rheumatoid arthritis
scope: The drug itself, not the sodium salt, a different form of the same medicine, and not folic acid,
  which it blocks.
examples:
- Methotrexate is prescribed to treat rheumatoid arthritis.
- The treatment uses methotrexate to slow the growth of certain cancer cells.
