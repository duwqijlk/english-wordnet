simpleMeaning: a person who has a disease where the body cannot keep the amount of sugar in the blood
  at a safe level
scope: This is a noun for a person with this disease; not the describing word for things linked to this
  disease, and not the describing word for a person who has it.
examples:
- As a diabetic, he checks the sugar in his blood each day.
- The nurse gave the diabetic a list of safe foods.
