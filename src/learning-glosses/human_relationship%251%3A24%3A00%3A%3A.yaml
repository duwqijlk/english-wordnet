simpleMeaning: People are tied to each other in many ways, and this word is used most for those ties,
  not for links between things like prices and jobs.
scope: Also called a relationship, this word is used most for the ties between people, not for links between
  things such as prices and jobs.
examples:
- The human relationship between a mother and her child grows stronger over time.
- They talked about the human relationship between workers and their boss.
