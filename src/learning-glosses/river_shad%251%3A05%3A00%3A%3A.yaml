simpleMeaning: The streams that drain into the Mississippi are where this fish lays its eggs; it is very
  much like the fish called Alosa sapidissima.
scope: No other name is listed for this fish; it is the one that lays its eggs in the streams of the Mississippi
  drainage, very much like Alosa sapidissima.
examples:
- A river shad swam past us in the stream.
- We saw river shad in the Mississippi drainage.
