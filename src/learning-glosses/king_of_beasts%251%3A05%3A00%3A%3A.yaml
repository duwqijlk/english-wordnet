  and, in the male, a shaggy mane.
scope: Also called lion, this is a big flesh-eating cat of Africa and India with a shaggy mane on the
  male.
examples:
- The king of beasts roared loudly in the night.
- A king of beasts with a shaggy mane watched the herd.
