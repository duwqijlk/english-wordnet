simpleMeaning: a heater that clears ice or frost from things like a car windshield, a fridge, or the wings
  of a plane
scope: Also called a deicer. This is a heater that clears ice or frost from a surface, not a chemical
  that melts ice and not the ice itself.
examples:
- Turn on the defroster to clear the ice from the back window of the car.
- The defroster in the old fridge no longer works, so ice builds up inside.
