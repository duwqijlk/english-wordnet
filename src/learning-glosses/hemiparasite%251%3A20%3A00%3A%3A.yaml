senseId: 'hemiparasite%1:20:00::'
synsetId: 13141534-n
simpleMeaning: This plant lives off another plant but still makes some of its own food from light, since
  it holds the green stuff that lets plants do that
scope: A plant that lives partly off another plant yet makes some food from light, not a plant that lives
  wholly off a host and not an ordinary green plant.
examples:
- The hemiparasite draws water from its host tree.
- A hemiparasite can make some of its own food, unlike a full parasite.
