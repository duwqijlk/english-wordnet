simpleMeaning: A plant with very hot, medium-sized, oblong red peppers, grown mainly in the Gulf Coast
  states to make hot sauce.
scope: Also called hot pepper, tabasco pepper and tabasco plant, this is one very hot pepper plant of
  the Gulf Coast states among other hot pepper plants and other sauce peppers, grown to make hot sauce.
examples:
- Capsicum frutescens grows in the Gulf Coast states.
- Hot sauce is made from Capsicum frutescens peppers.
