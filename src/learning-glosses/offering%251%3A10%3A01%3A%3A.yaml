simpleMeaning: The act of saying that you will give something or do something
scope: Also called offer, this is the act of saying you will give or do something, not the thing itself
  put forward as a plan or a price and not money given for holy use.
examples:
- His offering of help came at just the right time.
- Her generous offering of assistance surprised us all.
