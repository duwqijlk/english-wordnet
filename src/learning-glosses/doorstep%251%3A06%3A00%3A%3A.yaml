simpleMeaning: The flat piece of wood or stone at the bottom of a doorway, which holds the frame and which
  you step over when you go in or out.
scope: The flat piece at the bottom of a doorway; also called a threshold.
examples:
- She left the parcel on the doorstep.
- He stood on the doorstep and knocked.
