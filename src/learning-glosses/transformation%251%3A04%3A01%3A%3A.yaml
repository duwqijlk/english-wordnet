simpleMeaning: In genetics, a change in a cell or bacterium (very small living thing) when it takes in
  DNA (material carrying life instructions) from outside and makes it part of itself
scope: In genetics, a change in a living cell; not a language rule for changing sentence form, and not
  a maths rule for changing how position is shown.
examples:
- Scientists watched the transformation of the bacterium after it took in new DNA.
- In the lab, transformation let the cells take in DNA from outside.
