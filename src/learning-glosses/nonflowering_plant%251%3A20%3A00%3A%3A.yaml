simpleMeaning: A living thing with tubes that carry water and food, making new ones from tiny grains called
  spores
scope: 'Also called a pteridophyte: a living thing with tubes that carry water and food and that grows
  from spores, not a plant with flowers and not a plant with no tubes.'
examples:
- Ferns are nonflowering plants that grow from spores.
- The nonflowering plant in the garden spreads by spores.
