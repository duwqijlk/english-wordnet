simpleMeaning: In mathematics, any of the five starting rules that most people take as the base of the
  geometry of Euclid.
scope: Also called Euclid's axiom and Euclidean axiom, this is one of the five starting rules of Euclid's
  geometry in mathematics, not a starting rule of any other geometry.
examples:
- Euclid's postulate is one of the five starting rules of his geometry.
- The proof began with Euclid's postulate.
