simpleMeaning: a machine that by itself keeps a ship, plane or spacecraft on a steady course
scope: A machine that by itself keeps a ship, plane or spacecraft on a steady course; autopilot and automatic
  pilot are other names for it, not a person who flies a plane and not a hand-held steering wheel.
examples:
- The robot pilot held the ship on course through the night.
- Pilots switch on the robot pilot once the plane is in the air.
