simpleMeaning: a quick animal whose fur is mixed with grey, from Europe, Asia and Africa, that hunts and
  eats snakes and rodents (animals such as rats and mice)
scope: This is the quick animal with fur mixed with grey that hunts snakes; it is not a snake and not
  one of the small animals it hunts.
examples:
- A mongoose moved fast through the grass and caught a snake.
- The mongoose stood by the hole, watching for rats.
