senseId: 'open-end_wrench%1:06:00::'
synsetId: 03853688-n
simpleMeaning: A tool with two flat parts that stay a set distance apart, often on both tips of the handle
scope: A tool with two flat parts set a fixed distance apart, not a tool with parts that move to fit and
  not a tool with a closed ring that goes round a nut.
examples:
- He tightened the bolt with an open-end wrench.
- The open-end wrench has jaws on both ends of the handle.
