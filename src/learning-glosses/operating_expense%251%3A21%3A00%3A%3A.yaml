senseId: 'operating_expense%1:21:00::'
synsetId: 13298202-n
simpleMeaning: 'Not the fall in its worth, loan charges, or tax on money made: what is paid to keep land
  or a building in use is taxes, light, heat, and insurance.'
scope: Operating cost, overhead, and budget items are other names for this sense, which covers the cost
  of keeping land or a building in use.
examples:
- The operating expense of the hall covers heat and light.
- They cut the operating expense by switching off lights at night.
