simpleMeaning: To make a picture of a part inside the body, this tool sends out sound too high to hear
  and reads how it passes through and comes back.
scope: It is a tool that makes a picture of a part inside the body by sound.
examples:
- The sonograph made a picture of her liver.
- The sonograph found the organ inside the body.
