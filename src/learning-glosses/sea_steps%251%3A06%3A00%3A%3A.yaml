simpleMeaning: In sailing, a ladder that is let down over the side of a ship so people can climb aboard
scope: In sailing, a ladder let down over a ship's side for coming aboard, also called a sea ladder; not
  a fixed stairway inside the ship and not a gangway.
examples:
- The sailors lowered the sea steps so we could climb aboard.
- We came up the sea steps from the small boat.
