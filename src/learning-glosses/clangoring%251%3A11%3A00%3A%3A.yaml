simpleMeaning: a loud sound that rings and echoes again and again
scope: A loud sound that rings and echoes again and again; clang, clangor, clangour, clank, clash and
  crash are other names for this sense, not a single short bang and not quiet music.
examples:
- The clangoring of the bells filled the square.
- We heard the clangoring of hammers in the workshop.
