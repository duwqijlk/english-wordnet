simpleMeaning: Describes a plant with groups of upright branches that often look like one single column.
scope: Describes a plant with groups of upright branches that often look like one single column, not a
  plant with wide-spreading branches and not a plant with drooping branches.
examples:
- The fastigiate poplar rose in a narrow column.
- Fastigiate branches give the tree a tall, narrow shape.
