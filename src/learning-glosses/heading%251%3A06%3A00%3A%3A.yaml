simpleMeaning: A way dug level, or nearly level, through the ground in a mine, for people to walk along
scope: This is a level way dug in a mine, also called drift. It is not the line of words at the top of
  a text that says what the text below is about.
examples:
- The miners walked down the heading to reach the coal.
- A new heading was dug level through the rock.
