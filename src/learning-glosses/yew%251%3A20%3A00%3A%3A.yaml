simpleMeaning: Many trees or bushes stay green all year and have red cup-shaped berries and flat leaves
  like needles
scope: This is a tree or bush that stays green all year, not the wood of the tree.
examples:
- A yew stood beside the church.
- Yews grew along the old wall.
