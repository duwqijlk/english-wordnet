simpleMeaning: In the final statement of a three-step line of thought, the word that says something about
  its subject comes from this starting statement
scope: Also called major premiss, this is the statement in a line of reasoning that holds the word used
  in the final statement, not the smaller statement and not the final statement itself.
examples:
- The major premise was that all men are mortal.
- He set out the major premise first, then the minor premise.
