simpleMeaning: being much too easily hurt by words that say you have done something wrong
scope: Being much too easily hurt when people say you have done something wrong; not the act of protecting
  a place from attack, and not giving reasons to show you are right.
examples:
- His defensiveness showed when he fell silent after a small correction.
- Her defensiveness grew after the teacher pointed out one small mistake.
