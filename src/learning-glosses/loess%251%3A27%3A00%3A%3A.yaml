simpleMeaning: A fine-grained pile of clay and silt, dropped by the wind, with no clear layers in it.
scope: This is a fine-grained pile of clay and silt dropped by the wind, not sand and not clay laid down
  by water.
examples:
- The hills are covered in deep loess.
- Loess makes good soil for wheat.
