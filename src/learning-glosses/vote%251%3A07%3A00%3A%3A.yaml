simpleMeaning: the lawful right to cast a ballot in elections, ensured by the 15th Amendment to the US
  Constitution and ensured for women by the 19th
scope: This is the right itself, not the act of choosing by counting ballots, not the group decision that
  results, not a bloc of voters with shared interests, and not the number of people who turned out.
examples:
- Women won the vote in 1920.
- The 15th Amendment gave Black men the vote after the Civil War.
