simpleMeaning: A British thinker, born in Austria, who said science can never prove a theory true, but
  can only test it by trying to show it false (1902-1994).
scope: Not another thinker about science; also called Karl Popper and Sir Karl Raimund Popper.
examples:
- Popper argued that theories can only be tested, never proved.
- Popper was born in Austria in 1902.
