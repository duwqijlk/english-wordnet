simpleMeaning: In poems, the way of leaving the main subject, course, or idea to look at a different or
  unrelated matter
scope: In poems, leaving the main subject to look at something else, not losing the thread by mistake
  and not a change of topic in plain talk.
examples:
- The digressiveness of the poem lets it wander to other matters.
- Critics praised the digressiveness of her long poem.
