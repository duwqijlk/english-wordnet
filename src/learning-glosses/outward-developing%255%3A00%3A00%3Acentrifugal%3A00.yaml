simpleMeaning: Growing away from a middle line, as in a bunch of flowers with the oldest blooms in the
  middle and the youngest at the edge
scope: Growing away from a middle line, with the oldest blooms in the middle and the youngest at the edge,
  not growing towards the middle and not opening all at once.
examples:
- The outward-developing flower cluster opens from the centre outwards.
- In an outward-developing bunch the youngest blooms sit at the edge.
