simpleMeaning: a story told on a stage through steps and moves set to music, done by people trained to
  do it
scope: 'Also called ballet: a story told on stage through steps and moves set to music, not a play with
  spoken words and not a show of songs sung on stage.'
examples:
- The concert dance told the tale of a lost prince through music and movement.
- She joined the concert dance company to perform in the new show.
