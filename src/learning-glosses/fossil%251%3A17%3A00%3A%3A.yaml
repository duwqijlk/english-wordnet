simpleMeaning: the remains, or a mark left behind, of a plant or animal that lived in a past age of the
  earth and was dug up from the soil
scope: The remains or mark of a long-dead plant or animal dug from the ground, not the word used to describe
  something as like such remains.
examples:
- The fossil was dug from the soil near the river.
- This fossil shows the shape of a leaf from long ago.
