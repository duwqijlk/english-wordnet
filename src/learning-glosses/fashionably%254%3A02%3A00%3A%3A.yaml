simpleMeaning: in a way that follows the style that is popular now
scope: This is about following the style people like now, not just being neat, clean, or well dressed
  in any style.
examples:
- She always dresses fashionably, in the newest styles.
- He wore his hair fashionably, just like the actors in films.
