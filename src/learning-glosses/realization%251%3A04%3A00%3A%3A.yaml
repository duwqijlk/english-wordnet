simpleMeaning: the act of making something happen or exist, or of making it seem to happen or exist
scope: This is making something happen in fact, or making it seem to; it is not a sale to get money and
  not a piece of music finished by another person.
examples:
- The director's realization of the dream scene made it look real on screen.
- The realization of his idea into a working machine took two years.
