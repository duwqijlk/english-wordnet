simpleMeaning: An animal may carry this small living thing on its outside, where it stays and feeds off
  the animal, as a flea does
scope: 'Also called ectoparasite, ectozoan, ectozoon and epizoon: a small living thing carried on the
  outside of an animal, feeding off it, not one that lives inside the animal and not a free-living animal.'
examples:
- A flea is an epizoan that lives on the skin of a dog.
- The vet looked for any epizoan on the cat's coat.
