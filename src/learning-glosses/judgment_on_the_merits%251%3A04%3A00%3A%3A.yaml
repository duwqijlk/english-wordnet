simpleMeaning: A court gives its ruling on a case after it has looked at the facts and settled what they
  show
scope: A court ruling made after studying the facts put before it, also called judgement on the merits;
  not a ruling on a side point and not a ruling made without hearing the facts.
examples:
- The court gave judgment on the merits after weeks of testimony.
- The judge's judgment on the merits settled the dispute over the land.
