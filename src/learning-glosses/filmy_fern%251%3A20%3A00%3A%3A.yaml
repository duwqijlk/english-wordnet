simpleMeaning: Leaves so thin that light shines through them mark this plant of one group, which lives
  in hot, damp places in the tropics.
scope: Also called film fern, this plant of one group has thin leaves that light shines through, not the
  other plant of the same name that grows on tree branches with large fronds.
examples:
- A filmy fern grew in the damp corner of the hothouse.
- The filmy fern's thin leaves let the light through.
