simpleMeaning: a small bone in the ear that is joined to the eardrum
scope: The small bone inside the ear, joined to the eardrum; not a tool for hitting things and not the
  act of hitting hard again and again.
examples:
- The hammer is the first of the three small bones in the ear.
- When sound moves the eardrum, the hammer passes the movement on to the next bone.
