simpleMeaning: a test that finds how much of each part a thing is made of
scope: 'Also called quantitative analysis: a test that finds how much of each part a thing holds, not
  what the parts are and not a test of how a thing acts.'
examples:
- The lab ran a quantitative chemical analysis to find how much iron was in the rock.
- Her quantitative chemical analysis showed the soil held very little salt.
