senseId: 'enclave%1:15:00::'
synsetId: 08570669-n
simpleMeaning: an area of land that lies inside a different land on all sides, and whose people live in
  a different way from the people of the land around them
scope: This is land that lies inside a different land on all sides, whose people live in a different way
  from the people around them; not just any area of land and not a country on its own.
examples:
- The enclave lay inside another land on all sides, and its people kept their own language and food.
- They crossed into the enclave, where people spoke a different language from the people in the land around
  it.
