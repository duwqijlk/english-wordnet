simpleMeaning: Hairy-faced tree animals with nostrils set far apart and long tails that can grip, most
  of the time.
scope: These are tree animals of the Americas, not Old World monkeys with close-set nostrils; also called
  platyrrhine and platyrrhinian.
examples:
- The New World monkey grips with its long tail.
- New World monkeys have nostrils set far apart.
