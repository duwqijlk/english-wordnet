simpleMeaning: No good ideas come from this person, who has given up hope of winning
scope: A person who has given up on winning and puts forward no good ideas, also called a defeatist; not
  a person who keeps fighting and looks for a way to win.
examples:
- The negativist in the meeting said the plan would fail and offered nothing better.
- Don't listen to that negativist; he has already given up on the whole project.
