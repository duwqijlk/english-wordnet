simpleMeaning: a long loose top made of linked metal rings, usually without sleeves, worn in old times
  to guard the body in battle
scope: A long chain-mail shirt from old times, not a short coat and not a piece of plate armor.
examples:
- The knight wore a hauberk under his surcoat before the battle.
- His hauberk, made of linked metal rings, hung to his knees.
