simpleMeaning: A deciduous tropical American shrub or small tree with milky sap and funnel-shaped, sweet-smelling
  flowers in various colors.
scope: The tropical tree or shrub itself, also spelled frangipanni; not frangipane, the almond pastry,
  and not the perfume named after it.
examples:
- A frangipani grew beside the temple gate, dropping pale pink flowers onto the steps.
- The garden was planted with frangipani and bougainvillea.
