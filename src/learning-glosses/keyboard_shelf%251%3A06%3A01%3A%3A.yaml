simpleMeaning: To hold the set of letter buttons you type on, a flat board slides out from under a computer
  desk
scope: 'Another name for a keyboard tray: a sliding board under a computer desk that holds the typing
  buttons, not a drawer for papers and not the desk top itself.'
examples:
- He pulled out the keyboard shelf to type more easily.
- The keyboard shelf slides back under the desk when she finishes work.
