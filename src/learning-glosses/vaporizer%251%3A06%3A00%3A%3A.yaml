simpleMeaning: A device that releases a substance as vapor, especially for breathing it in as medicine.
scope: A device that releases vapor, especially for medicinal inhalation; not a device defined by releasing
  liquid droplets.
examples:
- She used a vaporizer to ease the child's cough.
- The vaporizer filled the room with a fine, warm mist.
