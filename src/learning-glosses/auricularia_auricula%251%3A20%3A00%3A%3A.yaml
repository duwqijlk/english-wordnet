simpleMeaning: A fungus found in many parts of the world that can be eaten, shaped like a human ear and
  growing on rotting wood.
scope: Also called an ear fungus, Jew's-ear, and Jew's-ears; a fungus shaped like a human ear and growing
  on rotting wood.
examples:
- Auricularia auricula grew on the rotting wood like a human ear.
- We cooked Auricularia auricula, a fungus that can be eaten.
