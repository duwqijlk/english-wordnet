simpleMeaning: able to make people feel excitement or strong interest
scope: This sense is about making people feel excitement or strong interest, not the sense about mixing
  a liquid and not the sense about strong feelings that are not unpleasant.
examples:
- The leader gave a stirring speech that made everyone want to help.
- It was a stirring song, and the crowd sang loudly and proudly.
