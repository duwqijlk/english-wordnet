simpleMeaning: This group of the government of the United States runs on its own and says how the prices
  of mail should change.
scope: A group of the country's government that says how the prices of mail should change, not the group
  that brings the mail and not a firm that sets its own prices.
examples:
- The Postal Rate Commission said the price of a stamp should rise.
- Changes in mail prices go through the Postal Rate Commission first.
