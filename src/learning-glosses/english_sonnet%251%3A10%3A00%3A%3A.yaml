senseId: 'english_sonnet%1:10:00::'
synsetId: 06394750-n
simpleMeaning: A poem of fourteen lines in three four-line parts and a last two-line part, in a five-beat
  rhythm, rhyming abab cdcd efef gg.
scope: A fourteen-line poem with three quatrains and a closing couplet, also called an Elizabethan sonnet
  and a Shakespearean sonnet; not the Italian form with an eight-line part and a six-line part.
examples:
- An English sonnet has three quatrains and a final couplet.
- She wrote an English sonnet for the school magazine.
