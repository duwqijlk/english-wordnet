simpleMeaning: Psychologists show things to look at for a very short time with this tool, then take them
  away, so a person sees them only for a flash.
scope: T-scope is another name for this tool, with which psychologists show things to look at for a very
  short time, not one that leaves them in view.
examples:
- The psychologist used the tachistoscope to show each picture for a very short time.
- A word appeared on the tachistoscope and was gone in a flash.
