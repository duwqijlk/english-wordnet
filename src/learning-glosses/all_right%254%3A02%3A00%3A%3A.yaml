simpleMeaning: a word said to show that you agree, most often at the start of a sentence
scope: 'Fine and alright are other names for this sense: a word that shows you agree, not a word that
  says a thing is good or well.'
examples:
- All right, let's start the lesson.
- All right, I agree with your plan.
