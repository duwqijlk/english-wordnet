simpleMeaning: a striking, fashionable grace in appearance or manner
scope: This is grace of appearance or manner, not a pointed tool, not a narrow growth on a plant or animal,
  and not rules for spelling and printing.
examples:
- She dresses with real style, even on ordinary weekdays.
- The hotel lobby has a quiet style that makes guests feel pampered.
