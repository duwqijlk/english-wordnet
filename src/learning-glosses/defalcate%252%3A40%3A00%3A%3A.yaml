simpleMeaning: to take things that were put in your care and use them for yourself by cheating
scope: To take things put in your care and use them for yourself by cheating — embezzle, malversate, misappropriate
  and peculate are other names for this sense — and not plain theft of what was never put in your care
  or an honest mistake with the money.
examples:
- The clerk defalcated funds from the trust over several years.
- When auditors found the missing money, they charged the manager with having defalcated from the charity's
  account.
