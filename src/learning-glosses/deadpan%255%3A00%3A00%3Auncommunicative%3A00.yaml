senseId: deadpan%5:00:00:uncommunicative:00
synsetId: 00503225-s
simpleMeaning: showing no feeling on purpose in your face or in the way you act
scope: Also called expressionless, and another name for it is impassive. It means showing no feeling on
  purpose in face and manner, not really having no feelings inside.
examples:
- She told the joke in a deadpan way, with a straight face.
- His deadpan face gave nothing away when he heard the news.
