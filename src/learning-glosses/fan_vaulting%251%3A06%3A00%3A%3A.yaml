simpleMeaning: An ornate way of building a curved roof, with ribs that spread out from one point in the
  shape of a half circle
scope: An ornate way of building a curved roof with spreading ribs, not a flat ceiling and not a fan used
  to cool a room.
examples:
- The fan vaulting in the old chapel spreads out above the choir.
- We looked up at the fan vaulting and saw the stone ribs spread in a half circle.
