simpleMeaning: living stuff falls apart into plainer stuff when a thing makes it do so, above all when
  sugar turns into alcohol without air
scope: Ferment, fermentation, fermenting, and zymosis are other names for this breaking-down of living
  stuff, in which a thing makes it fall apart, not one that happens on its own.
examples:
- Zymolysis turned sugar into alcohol without air.
- The zymolysis broke the sugar down into alcohol.
