simpleMeaning: A drug that holds back the body's defence system, used to stop the body from pushing out
  a new organ after a transplant.
scope: A drug that holds back the body's defence system, also called azathioprine, used to keep the body
  from pushing out a transplanted organ.
examples:
- She takes Imuran every day so her body will not push out the new kidney.
- The doctor gave him Imuran after the transplant to keep the new organ safe.
