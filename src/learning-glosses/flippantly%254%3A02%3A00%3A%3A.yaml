senseId: 'flippantly%4:02:00::'
synsetId: 00343559-r
simpleMeaning: In a light, careless way that shows no respect for a serious matter.
scope: Said in a light, careless way about a serious matter, not said in honest jest and not said in anger.
examples:
- He answered the reporters' questions flippantly, as if none of it mattered.
- You cannot speak flippantly about such a loss.
