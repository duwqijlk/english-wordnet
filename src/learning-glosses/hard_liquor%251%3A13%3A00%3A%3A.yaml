simpleMeaning: 'This is not made by letting a liquid ferment: a liquid with alcohol in it is heated until
  it turns to steam, and the steam is cooled back to liquid'
scope: Also called booze, hard drink, liquor and spirits, this is a strong alcoholic drink made by distilling,
  not a fermented drink like beer and not a soft drink.
examples:
- He poured himself a hard liquor after dinner.
- The shop sells hard liquor as well as wine.
