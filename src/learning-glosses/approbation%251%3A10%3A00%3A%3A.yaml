senseId: 'approbation%1:10:00::'
synsetId: 06699923-n
simpleMeaning: official notice and respect for something, or official agreement that it is good and right
scope: This is official notice and respect for something, or official agreement that it is good. The other
  sense of this word is only official agreement. It is not private liking or praise with no official part.
examples:
- The plan won the approbation of the city council.
- He looked for the approbation of his teachers before he published the work.
