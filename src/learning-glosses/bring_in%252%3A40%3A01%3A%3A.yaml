simpleMeaning: To get money from a sale or other trade, or as pay for work done.
scope: To get money from a sale or trade, or as pay for work; make, clear, realize, gain, earn, and realise
  are other names for this sense, not taking money in by trickery and not bringing a thing into a room.
examples:
- Her new job brings in a good salary each month.
- The shop brings in a lot of money at Christmas.
