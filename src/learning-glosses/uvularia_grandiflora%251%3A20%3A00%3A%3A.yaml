simpleMeaning: A plant of the south and south-east of the United States, grown for its yellow flowers,
  which can be dried.
scope: Also called cornflower and strawflower, this is a plant of the south and south-east of the United
  States, grown for yellow flowers that can be dried, not a plant grown for fruit.
examples:
- The Uvularia grandiflora in the garden has yellow flowers that we dried for winter.
- She grows Uvularia grandiflora for its yellow flowers, which dry well.
