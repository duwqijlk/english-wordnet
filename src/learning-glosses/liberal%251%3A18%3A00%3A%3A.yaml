simpleMeaning: Someone who supports social progress, changes to improve society, and the freedom and rights
  of individuals.
scope: This is a political supporter of reform and personal rights, not an economic free-market believer
  and not someone who is merely generous.
examples:
- As a liberal, he campaigned for equal rights and prison reform.
- The liberals in parliament backed the voting reform.
