simpleMeaning: On a ship, the officer who keeps the engines running and in good shape
scope: Also called naval engineer, this is the navy officer who keeps a ship's engines running, not a
  sailor who steers the ship and not an officer who commands it.
examples:
- The marine engineer checked the engines before the ship left port.
- A marine engineer is on duty in the engine room at all times.
