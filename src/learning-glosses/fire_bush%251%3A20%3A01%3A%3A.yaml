simpleMeaning: A thickly branched plant from Europe and Asia, whose leaves turn purple-red in fall
scope: This is a thickly branched plant from Europe and Asia with leaves that turn purple-red in fall;
  belvedere, burning bush, fire-bush and summer cypress are other names for this sense, not the evergreen
  South American shrub with orange trumpet flowers.
examples:
- The fire bush turned purple-red in autumn.
- A fire bush grew by the fence.
