simpleMeaning: draw out the different substances or ingredients that make up something, keeping each on
  its own
scope: This means drawing out the distinct ingredients of a mixture, not cutting something into portions
  or letting it fall into pieces.
examples:
- The machine separates the cream from the milk.
- We used a sieve to separate the sand from the gravel.
