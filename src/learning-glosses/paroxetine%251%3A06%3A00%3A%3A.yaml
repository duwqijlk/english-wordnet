  because it stops the body taking back one mood chemical, serotonin.
scope: Doctors often give this drug to lift low mood, and it is sold under the trade name Paxil.
examples:
- Her doctor gave her paroxetine for low mood.
- She takes paroxetine to lift her low mood.
