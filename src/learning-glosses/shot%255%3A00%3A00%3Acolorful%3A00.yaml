simpleMeaning: showing different colors when seen in different lights or from different angles.
scope: This is about colors that seem to change with light or angle, not a piece of metal or a photograph.
examples:
- The dress was made of shot silk that turned from green to blue.
- Shot fabric looks different depending on the light.
