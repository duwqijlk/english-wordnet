senseId: 'misalign%2:30:00::'
synsetId: 00467240-v
simpleMeaning: to put things so that they are not in the right line with each other, or to be not in the
  right line with each other
scope: About things not in the right line with each other; not about losing something for a time, and
  not about running something badly.
examples:
- If the wheels misalign, the car will not go straight.
- The two parts misaligned and the door would not close.
