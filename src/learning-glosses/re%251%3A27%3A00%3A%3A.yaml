simpleMeaning: a scarce heavy metal that joins in many ways, acts like manganese, and goes into some mixed
  metals; it is a side gain when molybdenum is made clean
scope: This is the hard to find heavy metal that acts much like manganese, not the soft pale metal or
  the dark liquid element, and it is also called rhenium and atomic number 75.
examples:
- Re is used in alloys for jet engines.
- The mine yielded Re as a side gain.
