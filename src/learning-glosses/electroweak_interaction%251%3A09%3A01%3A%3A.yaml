simpleMeaning: The force of magnets and charged bits, and the force that turns bits into other kinds,
  are joined in one account, two of the four known basic forces in nature.
scope: It is one joined account of two of the four known basic forces in nature, not an account of all
  four forces.
examples:
- The electroweak interaction joins two of the four known forces in one account.
- The electroweak interaction shows how two forces act as one.
