simpleMeaning: One of the large sections that make up a symphony or sonata, able to stand on its own as
  a piece of music.
scope: This is one complete section of a long musical work, not the gears and springs inside a watch or
  clock (movement%1:06:00::, the mechanical sense in this lane), not a change of position that stays in
  one place (movement%1:04:00::), not a trip from one place to another (movement%1:04:04::), not a natural
  event in which something shifts position (movement%1:11:00::), not an organized group with shared beliefs
  (movement%1:14:00::), not a campaign of actions for a cause (movement%1:04:03::), not the illusion of
  motion made by rapid still pictures (movement%1:19:00::), not a polite word for defecation (movement%1:22:00::),
  not a trend in opinion (movement%1:09:00::), and not the act of shifting something (movement%1:04:02::).
