simpleMeaning: a set amount used to state how much something can hold
scope: A set amount used to state how much something can hold; capacity unit and volume unit are other
  names for this sense; not a unit of length, and not a unit of weight.
examples:
- The litre is a capacity measure used in most countries.
- She looked up the capacity measure for the tank.
