simpleMeaning: in a way that comes from powers beyond the natural world, such as ghosts or magic
scope: This describes how something happens, in a way linked to ghosts or magic; it is not just very strange
  or strong in a normal way.
examples:
- She seemed to know, supernaturally, what would happen the next day.
- He heard his name called supernaturally, though no one was in the room.
