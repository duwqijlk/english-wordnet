simpleMeaning: The formal telling of a new law or rule, by which the law or rule starts to work
scope: The formal telling of a new law or rule that puts it into effect; not the making of the law and
  not a private notice.
examples:
- The promulgation of the new law took place in the town square.
- After its promulgation, the ordinance came into force.
