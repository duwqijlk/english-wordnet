simpleMeaning: A yellow fruit of the gourd family with a thin bent neck and skin that is a little rough
  with bumps.
scope: This is a yellow squash with a bent neck, not a round squash or a pumpkin; also called crookneck
  and summer crookneck.
examples:
- Crookneck squash grew well in the garden.
- She cooked crookneck squash for dinner.
