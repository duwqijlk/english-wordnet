simpleMeaning: A mint of Europe and Asia that lives for years, with small lilac-blue flowers and egg-shaped
  leaves, giving a sweet-smelling oil.
scope: This is a mint of Europe and Asia that lives for years, with small lilac-blue flowers and egg-shaped
  leaves, giving a sweet-smelling oil; pennyroyal is another name for this sense, not a mint of the Americas
  and not a mint without the sweet-smelling oil.
examples:
- The Mentha pulegium in the herb bed had small lilac-blue flowers.
- We crushed Mentha pulegium leaves to smell the sweet oil.
