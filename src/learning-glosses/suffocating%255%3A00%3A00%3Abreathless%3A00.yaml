simpleMeaning: Making it hard to breathe, most of all when there is no fresh air and the air is hot
scope: Also called choking; this is about hot, still air making breathing hard, not about being under
  water or held by the throat.
examples:
- The suffocating heat of the small room made her gasp for air.
- On a suffocating summer day the air felt too thick to breathe.
