simpleMeaning: a written note or promise that shows a room or place has been kept for you ahead of time
scope: This is the written note or promise itself, not the room or seat it is about, and not a quiet doubt
  in your mind.
examples:
- Please bring your reservation when you arrive at the hotel.
- The hotel sent her a written reservation promising her a room for two nights.
