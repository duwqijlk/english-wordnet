simpleMeaning: In Norse myth, one of the three goddesses who shape what must be; matched to the Anglo-Saxon
  Wyrd, and like the Greek Moirae and the Roman Parcae.
scope: 'Also called weird sister: one of the three Norse goddesses of destiny, not a Greek Fate by name
  and not a witch.'
examples:
- The Norn spun the thread of the hero's life.
- In the old tale, a Norn foretold the king's doom.
