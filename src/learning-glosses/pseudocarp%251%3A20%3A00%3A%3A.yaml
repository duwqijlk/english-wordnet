senseId: 'pseudocarp%1:20:00::'
synsetId: 13161144-n
simpleMeaning: 'An apple or a strawberry is one of these: a fruit with much soft flesh besides the flesh
  of the ripened seed case.'
scope: 'Also called accessory fruit: a fruit with much soft flesh besides the flesh of the ripened seed
  case, as an apple or a strawberry, not a fruit made of the seed case alone.'
examples:
- The pseudocarp of the apple holds much soft flesh around the seed case.
- A strawberry is a pseudocarp, with soft flesh beyond its ripened seed case.
