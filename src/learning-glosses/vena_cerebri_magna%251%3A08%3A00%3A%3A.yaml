simpleMeaning: The straight blood channel takes in a blood tube of the brain made from the two blood tubes
  deep inside the brain.
scope: Also called great cerebral vein, this is the blood tube of the brain that the two blood tubes deep
  inside the brain form, running on into the straight blood channel.
examples:
- The vena cerebri magna is formed by the two internal cerebral veins.
- Blood flows through the vena cerebri magna into the sinus rectus.
