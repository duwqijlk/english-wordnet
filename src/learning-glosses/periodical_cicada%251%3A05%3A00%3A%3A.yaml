simpleMeaning: a North American insect that comes out in great numbers only once in many years, because
  its young take 13 to 17 years to grow up
scope: 'Also called a seventeen-year locust: a North American insect that comes out in great numbers only
  once in many years, not a yearly insect and not a grasshopper.'
examples:
