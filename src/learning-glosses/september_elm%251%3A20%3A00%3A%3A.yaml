simpleMeaning: A tree of the south-east of the United States that flowers in autumn.
scope: Red elm and Ulmus serotina are other names for this sense; this is a tree of the south-east of
  the United States that flowers in autumn, not a tree that flowers in spring.
examples:
- The September elm flowers in autumn, late in the year.
- September elm grows in the south-east of the United States.
