simpleMeaning: Steps turn unsteady and the walk turns into a stagger when a person cannot get their muscles
  to work together in a move they mean to make.
scope: Also called ataxia, ataxy, and dyssynergia; this is a failure to make the muscles work together
  in moves done on purpose.
examples:
- Motor ataxia made his steps unsteady and his walk a stagger.
- With motor ataxia, she could not get her muscles to work together when she tried to move.
