simpleMeaning: Into the vein at the eye corner or the one along the jaw pours one of the tubes that take
  blood from the outside of the nose.
scope: Also called the external nasal vein, this tube takes blood from the outside of the nose, not from
  inside it.
examples:
- Blood from the outside of the nose runs through the vena nasalis externa.
- The vena nasalis externa joins the vein at the eye corner.
