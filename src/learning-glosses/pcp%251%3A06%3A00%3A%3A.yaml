simpleMeaning: A drug vets use to put animals to sleep for treatment, first taken in secret as powder
  or dust that makes people see and hear things that are not there
scope: This is a drug, also called angel dust, phencyclidine or phencyclidine hydrochloride; it is not
  a person who helps treat illness.
examples:
- The vet gave the dog PCP before the operation.
- He took PCP at the party and saw things that were not there.
