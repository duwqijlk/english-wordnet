simpleMeaning: A set of connected rooms, usually on one floor of a building with other homes, where you
  live.
scope: A home made of several rooms, not a painted stage backdrop, and not an open railway wagon.
examples:
- We rented a flat on the third floor.
- Their flat has two bedrooms and a small kitchen.
