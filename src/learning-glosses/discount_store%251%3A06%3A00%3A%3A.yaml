simpleMeaning: a place to buy goods at prices cut below the usual level
scope: A place to buy goods at prices cut below the usual level, also called a discount house or a discounter,
  and not a shop that sells goods at the full price.
examples:
- We found the lamp we wanted at a discount store for much less money.
- The discount store on the edge of town sells food at low prices.
