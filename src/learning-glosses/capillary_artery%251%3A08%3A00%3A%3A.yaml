simpleMeaning: one of the small blood tubes with thin walls that end in still smaller blood tubes
scope: 'Also called arteriola and arteriole: one of the small blood tubes with thin walls that end in
  still smaller blood tubes, not a large blood tube and not one of the tiny tubes that carry blood back
  to the heart.'
examples:
- The capillary artery ends in tiny blood tubes in the muscle.
- A capillary artery carries blood to the smallest tubes in the skin.
