simpleMeaning: to carry something from one place to another, or to be the way it travels through
scope: 'Also called carry, channel, conduct, convey and impart: to pass something along, or to be the
  way it travels. Not the sense of handing something over to another person.'
examples:
- Metal wires transmit heat well.
- Water transmits sound faster than air does.
