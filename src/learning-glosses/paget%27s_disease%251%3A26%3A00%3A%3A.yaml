simpleMeaning: A bone illness of middle-aged and older people, in which too much bone is broken down,
  sometimes causing bone pain, breaks, and bent or misshapen bones
scope: Also called osteitis deformans; a bone illness of middle-aged and older people, in which too much
  bone is broken down.
examples:
- Paget's disease weakened the bones in her leg.
- He was told he had Paget's disease after the X-ray.
