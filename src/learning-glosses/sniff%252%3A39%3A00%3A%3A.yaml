simpleMeaning: to notice a smell by breathing in through the nose
scope: To notice a smell by breathing in through the nose; not breathing in with a sound for its own sake,
  and not the noun name for the act of noticing a smell.
examples:
- Sniff the perfume before you buy it to see if you like the smell.
- He sniffed the air and could smell smoke.
