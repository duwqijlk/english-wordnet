simpleMeaning: in a way that breaks common rules about what is proper to show of the body or to do in
  public
scope: This says how something is done in a way that is not proper in public, such as in dress or in talk
  about the body. It is not a proper or decent way of acting.
examples:
- She was rather indecently dressed for a family meal.
- He spoke indecently in front of the children, using bad words about the body.
