simpleMeaning: 'a right set down in the 2nd change to the US Constitution: people may keep and carry weapons'
scope: The right to keep and carry weapons, not the right against search and seizure and not the right
  against harsh acts by the state.
examples:
- The freedom to bear arms is one of the rights in the US Constitution.
- The court ruled on the freedom to bear arms.
