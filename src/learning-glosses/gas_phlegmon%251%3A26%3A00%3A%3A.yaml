simpleMeaning: Usually, poisons made by clostridium germs kill body tissue in this deadly sickness in
  pathology, which can be used as a weapon made from germs.
scope: Also called clostridial myonecrosis, emphysematous gangrene, emphysematous phlegmon, gangrenous
  emphysema, gas gangrene and progressive emphysematous necrosis, this is a deadly sickness in which body
  tissue dies.
examples:
- Gas phlegmon killed the tissue.
- She died of gas phlegmon.
