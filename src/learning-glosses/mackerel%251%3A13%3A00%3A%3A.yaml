simpleMeaning: the meat of an Atlantic fish that is very important as food, usually small, up to 18 inches
  long, and full of fat
scope: This is the meat eaten as food, not the living Atlantic fish itself and not the flesh of another
  fish.
examples:
- We ate grilled mackerel for dinner.
- She bought fresh mackerel at the fish shop.
