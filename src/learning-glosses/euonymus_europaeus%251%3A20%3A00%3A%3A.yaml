simpleMeaning: A small straight bush that sheds its leaves each year, with hard white wood, and with bark
  and fruit that purge the bowels.
scope: Also called the common spindle tree, this is a small bush that loses its leaves each year, with
  hard white wood and bark and fruit that purge the bowels; not an evergreen bush, and not a tall tree.
examples:
- Euonymus europaeus stands straight in the hedge.
- The white wood of Euonymus europaeus is hard and tough.
