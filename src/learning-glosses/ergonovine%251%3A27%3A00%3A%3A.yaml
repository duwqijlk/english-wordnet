senseId: 'ergonovine%1:27:00::'
synsetId: 14737909-n
simpleMeaning: A drug made from ergot fungus (trade name Ergotrate Maleate) that is safer than the fungus;
  it makes the womb's muscles tighten and is given after birth or abortion.
scope: The drug derived from ergot, not the fungus itself or the plant disease caused by it.
examples:
- Ergonovine is given to help the womb contract after delivery.
- The doctor prescribed ergonovine to control bleeding after the birth.
