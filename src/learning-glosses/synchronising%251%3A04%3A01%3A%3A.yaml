simpleMeaning: a change that makes things happen or happen again at the same time
scope: A change that makes things happen or happen again at the same time; synchronization, synchronisation
  and synchronizing are other names for this sense, and it is not a change that sets only one time.
examples:
- The synchronising of the clocks made them all show the same time.
- Synchronising the two machines kept them working in step.
