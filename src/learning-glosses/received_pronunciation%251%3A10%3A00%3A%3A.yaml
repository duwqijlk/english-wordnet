simpleMeaning: The approved speech of Britain, first based on the king's speech at public schools, Oxford
  and Cambridge, used widely elsewhere in Britain; until recently the speech of British broadcasting.
scope: Also called King's English, Queen's English and Received Pronunciation language; the standard way
  of speaking in Britain, not a local way of speaking and not the speech of another country.
examples:
- She speaks with Received Pronunciation.
- Received Pronunciation is often heard on the radio.
