simpleMeaning: To work someone up into an agitated, eager, or alert state.
scope: This means making someone agitated or stirred up; rouse and agitate are other names, not the nearby
  senses about stirring feelings or sexual desire.
examples:
- The fiery speech excited the crowd into a roar of protest.
- News of the surprise visit excited the children so much they could not sit still.
