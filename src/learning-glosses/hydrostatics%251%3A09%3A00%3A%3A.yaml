simpleMeaning: The study of how liquids that are not moving push and press on things
scope: The study of still liquids and their pushes, not the study of moving liquids and not the liquids
  themselves.
examples:
- She took a course in hydrostatics to learn how water presses on a dam.
- Hydrostatics explains why a still pool can hold up a floating boat.
