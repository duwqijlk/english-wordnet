simpleMeaning: land a person gets from public land in the United States by putting their claim on record,
  then living on it and farming it, as a special law allows
scope: This is land got from the United States under a special law, not a farmhouse with its land, not
  a family's home and grounds, and not the act of settling such land.
examples:
- Their homestead was land they got from the government after they put their claim on record and farmed
  it for years.
- Under the law, his homestead was the public land he lived on and farmed after filing his record.
