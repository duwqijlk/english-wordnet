simpleMeaning: A small insect that lives high up among branches and twigs and jumps from place to place,
  and feeds by taking the juice from them
scope: A small jumping insect that sucks juices from branches and twigs, not a leafhopper that feeds on
  leaves and not a grasshopper that eats grass.
examples:
- A treehopper sat on the twig, sucking its juice.
- Treehoppers can jump far for their size.
