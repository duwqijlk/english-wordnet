simpleMeaning: hard to bear in the mind, and causing worry or anxiety
scope: This sense is about a feeling that is hard to bear and causes worry, not about a matter that is
  important and needs serious thought, and not about a thing that is heavy to lift.
examples:
- She faced weighty problems that kept her awake at night with worry.
- The weighty news left him anxious all day.
