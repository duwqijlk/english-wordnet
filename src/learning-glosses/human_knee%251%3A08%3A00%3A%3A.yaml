simpleMeaning: The joint that lets the leg bend, joining the thigh bone to the two lower leg bones, with
  a small flat bone in front of it.
scope: This joint, also called knee, genu, articulatio genus and knee joint, lets the leg bend where the
  thigh bone meets the two lower leg bones, with a small flat bone in front.
examples:
- The human knee bends every time you take a step.
- They put ice on the human knee.
