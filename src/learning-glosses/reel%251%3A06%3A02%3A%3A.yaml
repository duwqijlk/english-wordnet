simpleMeaning: a roll of film that holds a row of single pictures, to be shown by a machine that puts
  films on a screen
scope: A roll of film itself, not the round thing that thread or tape is wound around and not a dance.
examples:
- He loaded a new reel into the projector and started the film.
- Each reel holds about twenty minutes of the movie.
