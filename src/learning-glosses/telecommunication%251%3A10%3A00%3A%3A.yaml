simpleMeaning: systems, often used in the plural, that are used to send messages over a distance by electronic
  means
scope: 'Also called telecom: these are the systems used to send messages far away, not the field of electrical
  engineering that studies and makes such systems.'
examples:
- Modern telecommunications carry phone calls and data around the world.
- Telecommunications failed after the storm cut the cables.
