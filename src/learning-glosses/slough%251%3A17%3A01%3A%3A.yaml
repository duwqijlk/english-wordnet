simpleMeaning: a wet low area where water stands still and does not flow, especially one that is part
  of a bayou (a slow, flat stream in low wet land)
scope: A wet low area where water stands still, especially part of a bayou; not a skin or covering an
  animal leaves behind and not dead flesh on a body.
examples:
- Alligators hid in the dark water of the slough.
- We walked around the slough at the edge of the bayou.
