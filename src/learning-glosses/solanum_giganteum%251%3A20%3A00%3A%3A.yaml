simpleMeaning: A two-year tree-like shrub with woolly stems, found in tropical Africa and southern Asia,
  with silvery-white prickly branches, bunches of blue or white flowers, and red berries like holly berries.
scope: Not other shrubs with red berries, nor the true hollies of cooler lands; also called African holly.
examples:
- Solanum giganteum grows in tropical Africa.
- The berries of Solanum giganteum are bright red.
