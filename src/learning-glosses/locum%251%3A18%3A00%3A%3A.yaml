simpleMeaning: A doctor or a member of the clergy who stands in for a short time for another person in
  the same work
scope: 'Also called a locum tenens: a doctor or member of the clergy who stands in for a short time for
  another person in the same work, not a full-time doctor and not a helper with no training.'
examples:
- The practice hired a locum while Dr Smith was on holiday.
- A locum took the Sunday service.
