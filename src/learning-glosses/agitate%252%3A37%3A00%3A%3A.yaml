simpleMeaning: to make someone feel upset, very excited, or stirred up and ready to act
scope: 'Also called excite, and another name for it is rouse: to make people feel strong, upset, or eager
  feelings, not to speak and work in public to try to bring about a change.'
examples:
- The bad news agitated the crowd.
- His angry words agitated many people in the room.
