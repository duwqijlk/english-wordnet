simpleMeaning: Soft sea worms not divided into sections, with a thin thread-like snout and the power to
  stretch and shrink.
scope: Soft sea worms with a thread-like snout that can stretch and shrink, also called nemertine, proboscis
  worm and ribbon worm; not a flatworm and not an earthworm.
examples:
- The nemertean stretched its long snout to catch food.
- Nemerteans can shrink to a small size when they are disturbed.
