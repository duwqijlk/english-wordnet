senseId: 'procaryote%1:05:00::'
synsetId: 01418561-n
simpleMeaning: a living thing made of one cell with no nucleus in a skin; bacteria are the main example,
  and blue-green algae, actinomycetes, and mycoplasma are also in this group
scope: Also called prokaryote; a one-celled living thing without a nucleus, not a plant or animal cell
  with a nucleus.
examples:
- A procaryote has no nucleus inside its single cell.
- Bacteria are procaryotes, the best-known kind of one-celled life.
