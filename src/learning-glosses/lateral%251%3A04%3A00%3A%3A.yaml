simpleMeaning: a pass in a game to a player who catches the ball and is farther up the field than the
  person who threw it
scope: A pass to a player farther up the field, not the word for something at the side and not a pass
  to a player behind.
examples:
- The player threw a lateral to a teammate farther up the field.
- He caught the lateral and ran toward the goal.
