simpleMeaning: In genetics, one of two or more forms of a gene that sit at the same spot on a thread of
  heredity and shape the same trait.
scope: In genetics, one of two or more forms of a gene at the same spot on a thread of heredity, also
  called allele; not the gene itself and not the thread it sits on.
examples:
- Each allelomorph of the gene sits at the same spot.
- The two allelomorphs shape the same trait.
