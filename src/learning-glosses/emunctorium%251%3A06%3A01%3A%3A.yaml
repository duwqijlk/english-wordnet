simpleMeaning: A white linen cloth used to wipe the cup after each person at Communion has drunk from
  it
scope: This is a white linen cloth used to wipe the cup after each person at Communion has drunk from
  it; purificator and purificatorium are other names for it, not a table cloth and not a cloth for the
  altar.
examples:
- The priest wiped the chalice with the emunctorium.
- After each communicant, the emunctorium cleaned the cup.
