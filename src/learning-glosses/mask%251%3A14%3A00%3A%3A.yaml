simpleMeaning: a party where guests wear clothes that make them look like other people or characters,
  and coverings over their faces
scope: A party whose guests wear clothes that make them look like other people or characters, and face
  coverings; not the face covering itself, whether worn to hide who you are or to keep the face safe.
examples:
- At the mask, no one knew who anyone was until midnight.
- They held a mask every winter, and all the guests came in fine clothes with their faces covered.
