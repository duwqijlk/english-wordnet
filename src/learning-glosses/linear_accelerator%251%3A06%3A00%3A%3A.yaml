simpleMeaning: a machine that speeds charged bits of matter along a straight path, using changes in electric
  push on metal plates along the path
scope: A machine that speeds charged bits of matter along a straight path; linac is another name for this
  sense, not a machine that speeds them round a ring and not a plain electric motor.
examples:
- The linear accelerator sped the ions along a straight path.
- Doctors use a linear accelerator to aim beams at a tumour.
