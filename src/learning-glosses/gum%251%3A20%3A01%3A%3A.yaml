simpleMeaning: any of several kinds of tree in the groups called Eucalyptus, Liquidambar or Nyssa, which
  give a sticky plant stuff
scope: This is a tree that gives a sticky plant stuff, not the stuff itself and not the flesh around the
  teeth.
examples:
- The gum tree in the park gives shade all summer.
- Gum trees grow fast in warm places.
