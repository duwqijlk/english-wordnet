simpleMeaning: A person who holds that ups and downs in the economy come from more money or less money
  in use
scope: A person who holds that changes in the money supply drive ups and downs in the economy, not a person
  who blames spending or taxes, and not a banker.
examples:
- The monetarist argued that the crash came from too little money in use.
- As a monetarist, she blamed the boom on a rise in the money supply.
