simpleMeaning: A German movement of the 1600s and 1700s in the Lutheran Church, putting weight on a person's
  own faith and love of God.
scope: A German movement in the Lutheran Church of the 1600s and 1700s, set apart from other church movements
  by its stress on a person's own faith and love of God.
examples:
- Pietism shaped the way many German families prayed at home.
- The preacher's Pietism showed in his plain, heartfelt sermons.
