  that shape, taken together
scope: The force in a solid that goes with any change of its shape, and with a slow change of that shape,
  taken together; not a break and not a bend in a liquid.
examples:
- Mechanical stress changed the shape of the beam.
- Engineers test how much mechanical stress a bridge can bear.
