simpleMeaning: this word is used of a gun, or the shot it fires, when its inner hole is a little more
  than three eighths of an inch across
scope: It is also called .38-calibre, .38 caliber, and .38 calibre, and it is used of a gun or its shot
  whose bore is a little more than three eighths of an inch across, not of one with a narrower bore.
examples:
- He loaded a .38-caliber shell.
- She held a .38-caliber pistol.
