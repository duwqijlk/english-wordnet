simpleMeaning: A compound formed by solvation, when solvent molecules combine with molecules or ions of
  the solute.
scope: It is the compound produced by solvation, not solvation, the joining process itself.
examples:
- A solvate formed in the liquid.
- The solvate held the tiny bits of the liquid and the stuff in it.
