simpleMeaning: When the tiny bits of a liquid join with the tiny bits of the stuff dissolved in it, a
  new chemical is made.
scope: It is a new chemical made when a liquid and the stuff in it join, unlike solvation, which is the
  joining itself.
examples:
- A solvate formed in the liquid.
- The solvate held the tiny bits of the liquid and the stuff in it.
