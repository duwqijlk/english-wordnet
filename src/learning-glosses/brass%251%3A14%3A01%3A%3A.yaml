simpleMeaning: the players in a band or orchestra who blow into instruments made of a yellow metal made
  from copper and zinc
scope: This is the group of players, not the yellow metal itself, not one instrument, and not an object
  made from the metal.
examples:
- The brass played loudly at the start of the song.
- In the orchestra, the brass sit behind the strings.
