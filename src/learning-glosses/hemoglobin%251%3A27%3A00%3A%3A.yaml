simpleMeaning: The stuff in red blood cells that makes them red and mainly carries oxygen from the lungs
  to the rest of the body.
scope: Also called haemoglobin, this is the red stuff in blood that carries oxygen, not the blood itself.
examples:
- Her hemoglobin was low after the illness.
- Hemoglobin carries oxygen from the lungs to the tissues.
