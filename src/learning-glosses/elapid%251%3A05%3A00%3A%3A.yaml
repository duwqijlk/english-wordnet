simpleMeaning: any of a large group of snakes with poison fangs that live in warm parts of both halves
  of the world
scope: Any of a large group of snakes with poison fangs, also called elapid snake; not a snake with no
  poison and not a snake that squeezes its prey.
examples:
- The cobra is an elapid with deadly venom.
- Elapids live in warm parts of both hemispheres.
