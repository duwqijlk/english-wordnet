simpleMeaning: a common wild flower of the eastern United States with large pale blue or purple blooms
  with broad flat faces
scope: A common wild flower of the eastern United States with large pale blue or purple blooms with broad
  flat faces; bird's-foot violet and wood violet are other names for this sense, and it is not a garden
  flower or a wild flower with small white blooms.
examples:
- The pansy violet grows in the eastern United States.
- A pansy violet with pale blue blooms grew by the path.
