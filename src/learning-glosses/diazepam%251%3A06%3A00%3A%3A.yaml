senseId: 'diazepam%1:06:00::'
synsetId: 03194679-n
simpleMeaning: A sedative medicine (brand name Valium) that eases anxiety and relaxes muscles by boosting
  GABA, a calming brain chemical; it can also treat seizures after nerve-agent poisoning.
scope: This is the sedative sold under the brand name Valium; not another benzodiazepine such as lorazepam,
  and not an antipsychotic drug.
examples:
- The doctor prescribed diazepam to calm her anxiety before the scan.
- In nerve-agent poisoning, diazepam can be given to stop convulsions.
