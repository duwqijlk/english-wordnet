simpleMeaning: A tall tree of East India with wide-spreading branches whose tips droop, prized both for
  how it looks and for its wood
scope: A tall tree prized for its looks and wood; deodar, deodar cedar and Cedrus deodara are other names
  for this sense, not a low bushy evergreen or a pine grown only for timber.
examples:
- The Himalayan cedar shaded the whole lawn with its wide branches.
- We planted a Himalayan cedar where its drooping branch tips could be seen.
