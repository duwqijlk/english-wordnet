scope: Also called balsa; a forest tree of the low lands of Central America with strong, very light wood,
  used for floats and rafts and in crafts, not a heavy hardwood tree.
examples:
- Ochroma lagopus gives wood light enough for rafts.
- Craftsmen carve floats from Ochroma lagopus.
