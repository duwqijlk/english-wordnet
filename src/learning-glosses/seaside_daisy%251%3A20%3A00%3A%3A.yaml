simpleMeaning: A low coastal perennial with fleshy basal leaves and sticky stems, bearing a single bloom
  with narrow pink or lavender petals; it grows from Oregon to southern California.
scope: The same coastal plant also called beach aster, with a single bloom per stem; not the small white
  flowers that dot lawns and roadsides.
examples:
- Seaside daisy spreads across the dunes above the surf.
- She planted seaside daisy along the top of the sea wall.
