simpleMeaning: to be in the middle between two things, or to join them as a link or step between them
scope: This is being in the middle between two things, or joining them as a link or step between them;
  it is not helping two sides to settle an argument.
examples:
- A thin layer mediates between the skin and the bone.
- This short part mediates between the old section and the new one.
