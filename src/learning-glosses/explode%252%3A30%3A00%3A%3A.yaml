simpleMeaning: to break open and move outward suddenly, usually with a noise
scope: 'Also called burst: a thing breaks open and moves outward, usually with noise; not numbers growing
  fast and not anger suddenly coming out.'
examples:
- The champagne bottle exploded when the gas built up inside.
- The balloon exploded with a loud bang when she pricked it.
