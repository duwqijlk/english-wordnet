simpleMeaning: whether something can be held in the mind as a thought
scope: Whether something can be held in the mind as a thought, also called conceivability; not whether
  it is real and not whether it can be made.
examples:
- The conceivableness of time travel makes it a fine story.
- She questioned the conceivableness of a pain-free life.
