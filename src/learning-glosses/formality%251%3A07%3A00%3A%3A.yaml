simpleMeaning: A way of acting that keeps strictly to all forms and ceremonies.
scope: A strict way of acting by all forms and ceremonies; not a rule of good manners, and not simply
  following formal rules.
examples:
- The formality of his voice made the others listen closely.
- There was great formality at the state dinner.
