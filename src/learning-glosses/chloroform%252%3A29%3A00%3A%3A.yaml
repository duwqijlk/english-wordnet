simpleMeaning: to put a person into a deep sleep and stop them feeling pain by using a strong chemical
  liquid
scope: This is the verb for using the liquid on a person to make them sleep and feel no pain. It is not
  the liquid itself, which is the noun sense.
examples:
- Doctors once chloroformed the patient before the operation.
- He was chloroformed so the doctors could work without causing pain.
