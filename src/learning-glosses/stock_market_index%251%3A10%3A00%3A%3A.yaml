simpleMeaning: a figure worked out from the prices of a set of shares that stand for all shares together
scope: This is a figure that shows how a set of shares is doing, also called stock index, not the price
  of one share and not the shares themselves.
examples:
- The stock market index fell after the bad news.
- She checks the stock market index each morning.
