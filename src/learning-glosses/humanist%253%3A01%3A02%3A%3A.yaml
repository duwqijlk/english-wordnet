senseId: 'humanist%3:01:02::'
synsetId: 02754704-a
simpleMeaning: to do with a way of thinking that says people have worth and can live a full life through
  reason and science, and that often turns away from religion
scope: Also called humanistic. This word describes the way of thinking itself; it is not the noun for
  a person who holds these ideas, and not the senses about the Renaissance or about the humanities.
examples:
- He held humanist beliefs and trusted reason more than prayer.
- The school follows a humanist way of teaching that puts the child first.
