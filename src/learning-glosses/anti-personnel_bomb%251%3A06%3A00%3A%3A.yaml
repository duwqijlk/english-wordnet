simpleMeaning: a bomb that is only a tenth to a fifth explosive; the rest is a shell made to burst into
  many small fast bits, best used against soldiers and vehicles
scope: 'Also called antipersonnel bomb, daisy cutter, and fragmentation bomb: a bomb made to wound people
  and vehicles with flying bits, not a bomb made to smash buildings.'
examples:
- The anti-personnel bomb scattered small fragments over the field.
- Troops feared the anti-personnel bomb more than the shelling.
