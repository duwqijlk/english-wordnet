simpleMeaning: a feeling of strong dislike for someone or something you do not respect
scope: 'Also called despite, contempt, and scorn: a feeling of disrespect mixed with strong dislike, not
  a message meant to show it and not mild disapproval.'
examples:
- He looked at the thieves with open disdain.
- The outsiders were held in disdain by the whole town.
