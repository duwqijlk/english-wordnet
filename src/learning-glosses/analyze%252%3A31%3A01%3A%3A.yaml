simpleMeaning: to break something into its parts and study them closely to find its main features, as
  is done in maths, chemistry, or grammar
scope: This is the breaking-down kind of study used in maths, chemistry and grammar, not just thinking
  about something in detail to learn what it means.
examples:
- In class we analyzed the sentence to find its parts.
- The scientist analyzed the chemical to see what parts it was made of.
