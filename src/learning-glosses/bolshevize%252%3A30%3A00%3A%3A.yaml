simpleMeaning: to turn a thing to the ideas of Communism, or to bring it in line with those ideas
scope: 'Also called bolshevise, communise and communize: to turn a thing to Communist ideas, not to vote
  for a new leader and not to change a law.'
examples:
- The party set out to bolshevize the trade unions.
- They hoped to bolshevize the whole country within a few years.
