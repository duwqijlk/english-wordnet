simpleMeaning: To fall apart until a thing is in ruins.
scope: To fall apart until a thing is in ruins, not to lose power from a battery and not to rot as dead
  matter breaks down.
examples:
- The old pier decayed until it was unsafe to walk on.
- Without care, the garden wall decayed year by year.
