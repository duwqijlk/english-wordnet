simpleMeaning: At the top end of a lock or canal, a barrier that can be shut or opened lets water through
  or holds it back
scope: A barrier at the top end of a lock or canal that controls the flow of water, not a lock itself
  and not the valve that controls water through a sluice.
examples:
- The keeper closed the head gate to stop the water flowing into the canal.
- They opened the head gate at the top of the lock.
