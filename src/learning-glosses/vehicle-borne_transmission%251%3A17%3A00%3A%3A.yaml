simpleMeaning: Germs on a thing pass a sickness on without touch, when a person touches the thing or swallows
  it.
scope: This is a sickness passed on by germs carried on a thing, without touch.
examples:
- The sickness was passed on by vehicle-borne transmission, not by touch.
- Vehicle-borne transmission carried the germs to the next person to touch the same thing.
