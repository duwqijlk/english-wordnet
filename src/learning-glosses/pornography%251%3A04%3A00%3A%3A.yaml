simpleMeaning: Things people make, such as writing, pictures or films, that have no worth as art or good
  writing and are made only to make people want sex.
scope: Also called porn, smut, porno and erotica. These are things made only to make people want sex,
  not art or writing with other worth.
examples:
- The shop was closed for selling pornography to children.
- He was charged with making pornography and selling it online.
