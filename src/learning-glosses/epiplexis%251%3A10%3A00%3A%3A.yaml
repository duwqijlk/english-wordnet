simpleMeaning: A speaker's trick in which they scold the listeners to stir them up or win them over.
scope: A speaker's trick in which they scold the listeners to stir them up or win them over, not a trick
  that only praises the listeners and not a plain statement of facts.
examples:
- The speaker used epiplexis to scold the crowd into action.
- Epiplexis reproaches the audience to convince them.
