simpleMeaning: a thing or event that frightens people because it threatens to hurt them badly
scope: 'Also called serious, dangerous, grave and severe: a frightening threat of great harm, not a matter
  that needs serious thought and not grief.'
examples:
- The doctor warned of a grievous wound that could kill him.
- A grievous illness kept her in hospital for weeks.
