simpleMeaning: a dogfish with plain skin, found in the sea off the coasts of Europe
scope: A dogfish found in the sea off the coasts of Europe, also called smoothhound; not a fish that lives
  in fresh water, and not a dogfish from other seas.
examples:
- A smoothhound shark glided past the boat off the coast of Spain.
- We saw a smoothhound shark in the shallow water near the shore.
