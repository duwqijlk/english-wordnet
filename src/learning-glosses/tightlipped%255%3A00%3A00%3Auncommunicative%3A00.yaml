senseId: tightlipped%5:00:00:uncommunicative:00
synsetId: 00502916-s
simpleMeaning: Not given to talking, holding back what one knows and keeping it to oneself.
scope: This sense is also called close, secretive, and closemouthed, for one not given to talking, holding
  back what one knows and keeping it to oneself, where close is tending to keep things secret, saying
  little, and unwilling to share what is known, and secretive is saying little about what one knows, keeping
  one's own business to oneself.
examples:
- She stayed tightlipped about the plan.
- He is tightlipped and says little about what he knows.
