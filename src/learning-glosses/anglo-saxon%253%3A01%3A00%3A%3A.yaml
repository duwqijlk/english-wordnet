simpleMeaning: To do with the people of England in early times, or the language they spoke
scope: An adjective for the early people of England and their language, not the name of a person of that
  descent or a native of England before the Norman Conquest.
examples:
- The class studied Anglo-Saxon poetry from the early period.
- The Anglo-Saxon population of Scotland grew over the centuries.
