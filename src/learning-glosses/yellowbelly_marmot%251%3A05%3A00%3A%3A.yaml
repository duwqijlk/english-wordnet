simpleMeaning: a thick, heavy animal with brown fur with a pale gold tint, living among rocks in western
  North America
scope: A heavy animal with brown fur with a pale gold tint that lives among rocks, also called a rockchuck;
  not a beaver and not a prairie dog.
examples:
- We spotted a yellowbelly marmot sunning itself on a rock above the trail.
- The yellowbelly marmot whistled a warning and darted into its burrow.
