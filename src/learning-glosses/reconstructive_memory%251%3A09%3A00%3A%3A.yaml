simpleMeaning: The idea that recall works by keeping only the main parts of a past event and building
  the full picture from them when it is needed
scope: The idea that recall builds a past event from its main parts, also called reconstruction; not a
  perfect record of the past and not forgetting.
examples:
- Reconstructive memory fills in gaps from what we expect.
- Her reconstructive memory changed details each time she told the story.
