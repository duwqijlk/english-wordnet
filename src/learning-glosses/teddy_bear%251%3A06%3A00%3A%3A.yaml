simpleMeaning: A plaything for a child, a soft toy in the shape of a large furry animal, usually covered
  in plush and filled with soft stuff
scope: A child's soft toy in the shape of a large furry animal, usually covered in plush and filled with
  soft stuff, also called a teddy; not a doll and not a real animal.
examples:
- The child hugged her teddy bear all night.
- His teddy bear was covered in soft brown plush.
