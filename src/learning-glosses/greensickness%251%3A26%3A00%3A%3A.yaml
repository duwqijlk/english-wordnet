simpleMeaning: A lack of iron in the blood of young women, which leaves them weak, disturbs their monthly
  bleeding, and turns their skin green
scope: This is a lack of iron in young women; chlorosis is another name for this sense, not a lack of
  iron in older people and not a skin illness on its own.
examples:
- The doctor said her greensickness came from too little iron in her diet.
- Her greensickness left her tired and pale, with a faint green tint to her skin.
