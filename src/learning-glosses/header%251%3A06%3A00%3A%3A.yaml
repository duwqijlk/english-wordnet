simpleMeaning: a machine that cuts the tops off grain plants and puts them into a wagon
scope: A farm machine that cuts grain, not the words at the top of a page, not a beam over a door, and
  not a brick laid sideways in a wall.
examples:
- The header cut the ripe wheat and dropped the grain into the wagon behind it.
- Farmers drove the header slowly across the field at harvest time.
