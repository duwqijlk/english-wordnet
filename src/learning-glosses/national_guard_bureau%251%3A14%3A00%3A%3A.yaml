simpleMeaning: The group that runs the land guard and the air guard of the United States, and links the
  army, the air force and the guard groups.
scope: 'Also called NGB: the office in charge of the land and air guards of the United States, not the
  guards themselves and not a fighting unit.'
examples:
- The National Guard Bureau issued new rules for the air guard.
- Officers from the National Guard Bureau met with the army and the air force.
