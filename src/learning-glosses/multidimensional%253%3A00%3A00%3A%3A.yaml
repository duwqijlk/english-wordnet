simpleMeaning: having several different sides or parts, or looking at a thing in several different ways
scope: This sense is about having many sides or many ways to look at a thing, not about size in space
  alone.
examples:
- She has a multidimensional personality, with many interests and moods.
- They studied a multidimensional problem that touched money, health, and family life.
