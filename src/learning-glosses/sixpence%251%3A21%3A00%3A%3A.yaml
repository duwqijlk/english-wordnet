simpleMeaning: A small coin worth six pennies from the United Kingdom. No new ones have been made since
  1970.
scope: 'Also called tanner: a small coin from the United Kingdom worth six pennies and not made since
  1970, not a coin still made and used today.'
examples:
- She found an old sixpence in her grandmother's purse.
- He kept a sixpence from before 1970 as a lucky coin.
