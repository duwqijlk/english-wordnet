schema: oewn-learning-gloss-v2
senseId: 'choke%2:29:00::'
synsetId: 00002724-v
simpleMeaning: to have great trouble breathing when you feel something very strongly
scope: This is breathing hard because of a strong feeling, not struggling for breath because the body
  is not getting enough air, and not someone squeezing a throat to stop breath.
examples:
- She choked with sadness as she tried to thank them.
- He choked with anger and could barely speak.
