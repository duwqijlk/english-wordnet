simpleMeaning: A vowel can start with this sound, made by letting go of air held back at the voice box.
scope: Also called a glottal catch or a glottal plosive, this names the sound made by letting go of air
  held back at the voice box at the start of a vowel.
examples:
- The glottal stop marked the start of the vowel.
- A glottal stop cut off the air before the vowel.
