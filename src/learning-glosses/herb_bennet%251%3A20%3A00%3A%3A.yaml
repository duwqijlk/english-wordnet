simpleMeaning: With small yellow flowers and a sharp-tasting root once used as a medicine, this hairy
  plant grows in Europe and Asia.
scope: Also called clover-root, cloveroot or wood avens, this hairy plant from Europe and Asia has small
  yellow flowers and a sharp-tasting root once used as a medicine.
examples:
- Herb bennet bore small yellow flowers.
- The root of herb bennet was once used as a medicine.
