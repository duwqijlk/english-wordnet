simpleMeaning: the part of a company's profit set aside for each piece of ordinary stock that people still
  hold
scope: The part of a company's profit set aside for each piece of ordinary stock that people still hold,
  not the whole profit of the company and not the price of one piece of stock.
examples:
- Earning per share rose after the company made a bigger profit.
- Investors watch earning per share to see how well the company is doing.
