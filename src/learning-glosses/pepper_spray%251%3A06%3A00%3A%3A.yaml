simpleMeaning: A spray of fine droplets that is not deadly, made from a pepper resin; it briefly blinds
  and disables an attacker and is also used to discourage bears.
scope: The defensive spray used against attackers or bears, not ground pepper used as a spice.
examples:
- The officer used pepper spray to stop the attacker.
- Hikers in bear country often carry pepper spray.
