simpleMeaning: In rocky ground from the southwest of the United States to Central America lives a snake
  with a U-shaped mark on its head, whose bite is only mildly poisonous.
scope: A mildly poisonous snake with a U-shaped mark on its head, found in rocky ground from the southwest
  of the United States to Central America.
examples:
- The lyre snake slipped between the rocks as the sun went down.
- We saw a lyre snake with a U-shaped mark on its head near the trail.
