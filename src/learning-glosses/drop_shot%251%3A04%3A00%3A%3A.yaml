simpleMeaning: a soft hit back over the net in a game of tennis, made so the ball falls fast just past
  the net
scope: 'Also called a dink: a soft hit back in tennis that falls fast just past the net, not a hard hit
  that flies deep.'
examples:
- Her drop shot fell just past the net and her rival could not reach it.
- He won the point with a drop shot that died right after crossing the net.
