simpleMeaning: In rough woodwork, a small strip of ridged steel with sharp points on one side is hammered
  across the place where two pieces of wood meet.
scope: A wiggle nail is a small strip of ridged steel with sharp points on one side, hammered across the
  place where two pieces of wood meet in rough woodwork.
examples:
- He hammered a corrugated fastener across the joint to hold the frame.
- The corrugated fastener kept the two boards together.
