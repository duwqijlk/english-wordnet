simpleMeaning: Made from a streptomyces germ and sold under the trade name Lincocin, this germ-killing
  drug treats some ills that penicillin cannot cure.
scope: Among germ-killing drugs, it is the one made from a streptomyces germ and sold as Lincocin, used
  where penicillin cannot cure.
examples:
- Lincomycin cleared the infection that penicillin could not.
- The drug lincomycin comes from a streptomyces germ.
