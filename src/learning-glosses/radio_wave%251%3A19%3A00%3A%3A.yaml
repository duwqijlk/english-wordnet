simpleMeaning: a moving form of electric and magnetic power, between half a centimetre and thirty thousand
  metres long
scope: 'Also called radio emission and radio radiation: a moving form of electric and magnetic power of
  this long length, not light we can see and not a sound wave.'
examples:
- The radio wave reached the set across the town.
- A radio wave can pass through walls that light cannot.
