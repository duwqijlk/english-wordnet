simpleMeaning: in a flat shape with straight sides, having all sides the same length and all corners the
  same size
scope: 'Also called regularity: a shape with all sides equal and all corners equal, not a shape with sides
  of mixed length and not a curved shape.'
examples:
- A square shows geometrical regularity because all its sides match.
- The teacher pointed out the geometrical regularity of the equal-sided figure.
