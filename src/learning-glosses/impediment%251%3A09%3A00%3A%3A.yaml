schema: oewn-learning-gloss-v2
senseId: 'impediment%1:09:00::'
synsetId: 05697054-n
simpleMeaning: something you cannot see or touch that gets in the way of an action or makes progress slower
scope: This sense is also called check, balk, deterrent, hindrance, handicap, and baulk. It is about something
  you cannot see or touch that slows or stops action, not a hard object in the way.
examples:
- Lack of money was a big impediment to finishing the house.
- His fear of speaking was an impediment to his progress at work.
