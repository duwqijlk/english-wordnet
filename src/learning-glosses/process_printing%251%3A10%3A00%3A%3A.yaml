simpleMeaning: a way of making color copies of a picture with plates made of tiny dots that form shades
  of color
scope: A way to print color copies from dotted plates, not a hand-made copy and not printing in black
  and white only.
examples:
- The book's color pictures were made by process printing.
- Process printing lets a shop make many color copies of one photo.
