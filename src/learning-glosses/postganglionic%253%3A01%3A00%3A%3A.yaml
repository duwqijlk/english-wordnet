simpleMeaning: Said above all of bare threads starting from cells in the knots that run the body's inner
  workings, this word marks a place past a knot of nerve cells.
scope: This word marks a place past a knot of nerve cells, not a place at the knot itself.
examples:
- The postganglionic threads start in the knot and run on past it.
- Postganglionic fibres run on from the knot to the body's inner workings.
