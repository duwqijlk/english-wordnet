simpleMeaning: a climbing plant in the south of the United States that has flowers of a purple colour
  touched with the colour of a clear sky
scope: 'Also called blue jasmine, curly clematis, and marsh clematis: a climbing plant from the south
  of the United States with purple flowers touched with the colour of a clear sky, not a plant that stays
  low on the ground and not a climbing plant with white flowers.'
examples:
- The blue jessamine wound round the trellis in the garden.
- Blue jessamine flowers opened purple with a hint of sky colour in the spring.
