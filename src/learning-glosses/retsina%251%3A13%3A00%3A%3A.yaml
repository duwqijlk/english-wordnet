simpleMeaning: a Greek wine that has the taste of resin (a sticky substance from trees) in it
scope: This is a Greek wine with resin in it, not a plain wine with no resin and not any other Greek drink.
examples:
- We drank retsina with dinner in Athens.
- The retsina had a strong taste of pine trees.
