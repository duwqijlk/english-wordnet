simpleMeaning: As great or as many as an amount added to itself twice
scope: As great or as many as an amount taken three times over, threefold being another name for this
  sense; not twice as great and not four times as great.
examples:
- A three-fold increase in sales surprised everyone.
- The firm reported a three-fold rise in profits.
