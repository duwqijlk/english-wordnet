simpleMeaning: Of a woman's body, having curves that look pleasing and a large chest
scope: Also called stacked, curvy, voluptuous, busty, bosomy and curvaceous; this is about a large chest
  and a pleasing curving shape, not about being healthily plump and strong.
examples:
- The buxom singer wore a dress that fitted her curving shape.
- A buxom young woman in a tight dress walked into the room.
