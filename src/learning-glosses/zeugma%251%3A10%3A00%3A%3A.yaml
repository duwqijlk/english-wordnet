schema: oewn-learning-gloss-v2
senseId: 'zeugma%1:10:00::'
synsetId: 07123492-n
simpleMeaning: a joke in words where one verb is used with two or more things at once, and the verb means
  something different for each
scope: A joke in words where one verb fits two or more things in different ways; not a pun on one word
  and not a plain use of a verb.
examples:
- The line 'He took his hat and his leave' is a zeugma.
- The writer used a zeugma to make the readers smile.
