simpleMeaning: A thorny shrub or small tree of Central America and the West Indies, with twice-divided
  leaves and bright yellow flower bunches; its hard brown-red heartwood gives a black dye.
scope: A thorny tree of Central America and the West Indies, also called bloodwood tree, campeachy, logwood,
  and logwood tree; its dye comes from its hard heartwood.
