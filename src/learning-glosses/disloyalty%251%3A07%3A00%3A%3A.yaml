simpleMeaning: the way a person is when they do not stay true to a person, group, or cause they should
  support
scope: This is the bad quality in a person who does not stay true to others they should support, not just
  one act that breaks trust.
examples:
- His disloyalty to his friends made them stop trusting him.
- The king punished the soldier for his disloyalty to the country.
