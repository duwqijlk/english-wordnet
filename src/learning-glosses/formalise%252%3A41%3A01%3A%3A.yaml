synsetId: 02484290-v
simpleMeaning: To give a thing standing in law.
scope: This sense is also called validate and formalize, for giving a thing standing in law, where validating
  is saying in law that a thing counts, or making it count in law, unlike the sense for making a thing
  formal or official.
examples:
- They formalised the deal in law.
- Formalising gives a thing standing in law.
