senseId: 'principle_of_relativity%1:09:00::'
synsetId: 05999365-n
simpleMeaning: 'The rules of how things move stay the same when the whole frame moves in a straight line
  at one steady speed: in physics, this law holds for all.'
scope: A law of physics about motion itself, holding for every moving frame.
examples:
- The principle of relativity says the laws of motion do not change for a train moving at a steady speed.
- Under the principle of relativity, a ball dropped inside a smoothly moving ship falls straight down.
