simpleMeaning: trying hard to look and act in a very fine and smart way
scope: 'Also called dandified and foppish: putting on very fine dress and manners, not just being neat
  and tidy and not being truly grand.'
examples:
- His dandyish clothes made him stand out at the party.
- She spoke in a dandyish way, with great care for every word.
