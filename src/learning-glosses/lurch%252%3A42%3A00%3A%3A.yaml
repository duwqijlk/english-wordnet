simpleMeaning: To hang about in a place, with no clear thing you are trying to do
scope: To hang about with no clear aim, not to walk as if you cannot control your steps and not to beat
  someone in a game.
examples:
- He lurched around the station for an hour, waiting for no one.
- They lurched near the gate, with no plan and nowhere to go.
