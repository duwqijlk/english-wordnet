simpleMeaning: a dark brown cockroach that came from the East and now lives in most parts of the world
scope: Also called the oriental cockroach and the oriental roach, a dark brown cockroach from the East
  now found in most parts of the world, not a beetle and not a cockroach found in one place only.
examples:
- A blackbeetle ran across the kitchen floor at night.
- The blackbeetle hid under the sink where it was dark and damp.
