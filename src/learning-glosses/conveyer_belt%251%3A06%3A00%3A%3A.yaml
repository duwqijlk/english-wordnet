simpleMeaning: a long moving strip that moves things from one place to another, as in a factory
scope: This is a long moving strip that moves things along, also called a conveyer, a conveyor, a conveyor
  belt and a transporter; not a truck and not a lift.
examples:
- The suitcases rode the conveyer belt to the plane.
- She put her bag on the conveyer belt at the checkout.
