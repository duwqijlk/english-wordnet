simpleMeaning: to cover a thing closely with warm thin plastic that gets smaller as it cools
scope: To cover a thing closely with warm thin plastic that gets smaller as it cools, not to cover it
  loosely with paper and not to put it in a box.
examples:
- Please shrinkwrap the CDs before you post them.
- We will shrinkwrap the books to keep them dry.
