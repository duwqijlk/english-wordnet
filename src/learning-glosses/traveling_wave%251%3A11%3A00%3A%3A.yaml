schema: oewn-learning-gloss-v2
senseId: 'traveling_wave%1:11:00::'
synsetId: 07361651-n
simpleMeaning: a moving rise and fall that goes through a thing, and the thing itself moves in the same
  way it goes
scope: This is a moving rise and fall whose carrier moves in the same way it goes; travelling wave is
  another name for this sense. Not a wave that stands still in place.
examples:
- The traveling wave moved along the rope, and each part of the rope moved with it.
- A traveling wave passed down the spring as the coils pushed each other forward.
