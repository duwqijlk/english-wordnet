simpleMeaning: how much a line or surface is not level, but goes up or down
scope: 'Also called slope: how much a line or surface is not level; not a change in size that grows or
  shrinks step by step, as with heat or light.'
examples:
- The road has a steep gradient, so cyclists ride up it slowly.
- A five-degree gradient made the ramp hard to climb.
