simpleMeaning: able to be broken down in the stomach and gut so the body can take it in and use it
scope: This describes food that the body can break down in the stomach and gut and take in; it does not
  just mean soft food or food that is easy to chew.
examples:
- Plain rice is digestible for most people, even when they feel ill.
- The doctor told him to eat only soft, digestible food for a few days.
