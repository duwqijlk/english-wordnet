senseId: 'anovulant%1:06:00::'
synsetId: 03943171-n
simpleMeaning: Taken by a woman, this pill keeps an egg from leaving her body, so no baby can start; it
  holds estrogen and progestin.
scope: Also called anovulatory drug, birth control pill, contraceptive pill, oral contraceptive, oral
  contraceptive pill, and pill, this is a pill that stops an egg from being freed, not a pill taken after
  conception.
examples:
- She takes an anovulant to avoid becoming pregnant.
- The anovulant works by stopping ovulation.
