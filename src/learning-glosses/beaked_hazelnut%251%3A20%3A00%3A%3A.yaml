simpleMeaning: A nut tree of the western United States whose nuts sit in showy leaf cups ending in a sharp
  point
scope: A nut tree of the western United States with showy leaf cups on its nuts, not a common hazel and
  not the nut on its own.
examples:
- The beaked hazelnut grows wild along the streams of the western United States.
- She gathered beaked hazelnuts still wrapped in their pointed leaf cups.
