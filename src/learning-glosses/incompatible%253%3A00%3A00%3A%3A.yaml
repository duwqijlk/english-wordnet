simpleMeaning: 'used especially of drugs or muscles: working against each other so that each stops or
  weakens the other''s effect'
scope: 'Also called antagonistic: used especially of drugs or muscles that work against each other, not
  of solids or liquids that cannot mix well, and not of machines or parts that cannot be used together
  without change.'
examples:
- 'These two drugs are incompatible: each one stops the other from working.'
- He was told not to mix the medicines, because they are incompatible and weaken each other.
