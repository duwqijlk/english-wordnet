simpleMeaning: 'Said of a marriage or a child: accepted by law as lawful.'
scope: Said of a marriage or a child accepted by law, not the act of making a child lawful, not a practice
  that meets accepted standards, not a government backed by law, and not showing a thing to be fair and
  right.
examples:
- Their marriage was legitimate in the eyes of the law.
- The child was legitimate, born to married parents.
