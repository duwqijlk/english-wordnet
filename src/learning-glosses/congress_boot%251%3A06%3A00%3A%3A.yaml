simpleMeaning: a shoe that comes up to the ankle, with stretchy pieces in the sides that let the foot
  slip in
scope: This is a shoe that reaches the ankle and slips on with stretchy side pieces; congress gaiter and
  congress shoe are other names for this sense, and it is not a tall boot or a shoe with laces.
examples:
- He pulled on his congress boots before heading out.
- The shop sold congress boots with stretchy sides for easy wear.
