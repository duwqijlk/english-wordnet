simpleMeaning: Groups of light lines set close side by side, seen in the light given off by atoms of some
  kinds of matter
scope: This is a pattern of close lines in light from atoms, not a single line and not the shape of an
  atom itself.
examples:
- The fine structure showed up as close lines in the spectrum.
- Scientists studied the fine structure of the atom's light.
