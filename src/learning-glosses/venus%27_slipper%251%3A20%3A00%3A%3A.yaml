simpleMeaning: An orchid of the Paphiopedilum group with thin flower stems that carry one or more waxy
  blooms with pouch-shaped lips.
scope: One of the pouch-lipped orchids of the genus Paphiopedilum, also called Venus's shoe and Venus's
  slipper; its nearest kin are the flat-flowered orchids grown as house plants.
examples:
- The Venus' slipper in the pot has a single waxy flower with a pouch-like lip.
- She grows several Venus' slippers in the cool greenhouse.
