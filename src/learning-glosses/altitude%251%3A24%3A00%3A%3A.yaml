simpleMeaning: How far above the line where earth meets sky a thing sits, measured as an angle, especially
  a star or planet.
scope: How far above the horizon a thing sits, measured as an angle, not the straight line across a flat
  shape.
examples:
- The altitude of the star was forty degrees above the horizon.
- Sailors once worked out the altitude of the sun at noon.
