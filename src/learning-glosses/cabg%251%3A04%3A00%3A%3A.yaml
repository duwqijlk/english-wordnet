simpleMeaning: 'Open-heart surgery: chest is opened and a piece of vessel is joined from the aorta to
  a heart artery past the blocked part, to bring back the heart''s blood supply.'
scope: 'Also called a coronary artery bypass graft, a coronary bypass, and coronary bypass surgery: open-heart
  surgery that joins a vessel past a blocked heart artery, not a drug treatment and not a small cut.'
examples:
- CABG opened her chest to join a vessel past the blocked artery.
- After CABG, blood reached his heart muscle again.
