simpleMeaning: A one-year plant of the lands from the Mediterranean to Portugal, with hairy stems, leaves
  with tiny spiny teeth, and large heads of yellow flowers.
scope: Also called blessed thistle and sweet sultan, this is a one-year plant with hairy stems and large
  heads of yellow flowers, not a plant with smooth stems and small pale flowers.
examples:
- The Cnicus benedictus grows in the dry fields of the south.
- Cnicus benedictus bears large yellow flower heads.
