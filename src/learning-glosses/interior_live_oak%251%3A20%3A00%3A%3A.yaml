simpleMeaning: A small bushy oak of the west keeps its leaves all year, grows mostly in foothills away
  from the sea, and forms a big part of the dry scrub.
scope: A small bushy oak of western North America that keeps its leaves all year, much like the coast
  live oak but growing mostly in foothills away from the sea.
examples:
- The interior live oak kept its leaves through the winter.
- Interior live oaks dot the foothills above the valley.
