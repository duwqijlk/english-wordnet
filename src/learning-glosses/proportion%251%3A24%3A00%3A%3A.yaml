simpleMeaning: The number got by dividing the size of a part by the size of the whole
scope: The number got by dividing the size of a part by the size of the whole, not how things stand to
  each other in size or amount and not a pleasing arrangement of parts in a design.
examples:
- The proportion of girls in the class is three out of five.
- Work out the proportion of the part to the whole.
