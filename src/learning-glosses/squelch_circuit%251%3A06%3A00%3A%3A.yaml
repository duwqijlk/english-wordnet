simpleMeaning: a set of electric wires that shuts off a receiving set when the signal grows weaker than
  the background hiss
scope: A set of electric wires that shuts off a receiving set when the signal grows weaker than the background
  hiss; squelch and squelcher are other names for this sense, not a part that makes sound louder and not
  a part that tunes the receiving set.
examples:
- The squelch circuit cut the hiss when the station faded.
- A squelch circuit keeps the radio quiet between calls.
