simpleMeaning: quick to be affected by something, or able to be acted on as stated, often used with 'of'
  or 'to'
scope: Quick to be affected by something, or able to be acted on as stated, often used with 'of' or 'to',
  not easily hurt in the body alone and not a person who gives in to every wish.
examples:
- He is susceptible to colds every winter.
- The claim is susceptible of proof, if the papers can be found.
