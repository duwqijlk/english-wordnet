simpleMeaning: 'First help for a person with no heartbeat and no breath: chest presses and breaths, to
  get blood moving and stop death or brain harm from lack of air.'
scope: 'Also called cardiac resuscitation, cardiopulmonary resuscitation, kiss of life, or mouth-to-mouth
  resuscitation: first aid that restarts blood flow, not a heart operation and not a breathing machine.'
examples:
- The nurse started CPR at once when the man stopped breathing.
- Everyone at the pool should learn CPR.
