simpleMeaning: Dust from mouldy hay, holding the spores of fungi, sets off an allergic reaction that leaves
  the air sacs sore and swollen.
scope: Thresher's lung is another name for this sickness of the air sacs.
examples:
- He had farmer's lung from breathing dust from mouldy hay.
- Her farmer's lung came from the spores in the dust of mouldy hay.
