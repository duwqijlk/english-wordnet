simpleMeaning: Its young live in water, but the grown insect, a thin creature with fine clear wings, usually
  lives on land for less than two days.
scope: 'Also called mayfly and dayfly: a thin insect whose young live in water and whose adults live on
  land for a very short time.'
examples:
- A shadfly flew over the water.
- The shadfly spent its short adult life on land.
