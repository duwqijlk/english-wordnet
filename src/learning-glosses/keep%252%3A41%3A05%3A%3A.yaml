simpleMeaning: To observe a holiday or ceremony in the usual way.
scope: This is not holding on to an object and not staying in a place; it is about observing a holiday
  or ceremony.
examples:
- The community keeps the Sabbath strictly.
- Many families still keep the old harvest festival.
