simpleMeaning: going from one place to another in a straight line, without turning aside or stopping,
  and so being short.
scope: This is not about having no go-between, and it is not about plain, frank speech; it is about a
  way through space.
examples:
- We took the most direct route to the airport.
- There is a direct train from here to the coast.
