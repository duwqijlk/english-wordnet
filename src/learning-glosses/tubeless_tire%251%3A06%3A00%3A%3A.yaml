simpleMeaning: A tyre filled with air that stays airtight with no inner lining.
scope: This is a tyre that stays airtight with no inner lining, also called tubeless; not a solid tyre
  and not a tyre with an inner tube.
examples:
- The tubeless tire held its air after the puncture.
- He fitted a tubeless tire to the front wheel.
