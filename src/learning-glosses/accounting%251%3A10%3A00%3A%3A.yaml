simpleMeaning: an answer that makes clear why something happened, and leaves no doubt about the real reasons
scope: This is an explanation that lays bare the true reasons, not the job of keeping money records and
  not a list of debits and credits.
examples:
- He was unable to give a clear accounting for his actions.
- Her accounting of the failure showed what had really gone wrong.
