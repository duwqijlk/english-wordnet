simpleMeaning: a low tree with fan-shaped leaves growing on the south coast of the United States, whose
  leaf buds can be eaten
scope: A low tree with fan-shaped leaves growing on the south coast of the United States, whose leaf buds
  can be eaten, also called cabbage palm, and not a tall palm of the West Indies or a palm whose buds
  are not eaten.
examples:
- Cabbage palmetto grew thick along the shore.
- The cabbage palmetto's leaf buds were eaten when young.
