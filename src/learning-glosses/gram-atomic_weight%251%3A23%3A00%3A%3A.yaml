simpleMeaning: Take this much of a chemical element, and in small mass units it comes to the same number
  as the number that tells how heavy its atoms are.
scope: Also called a gram atom, this is the amount of a chemical element that, in small mass units, comes
  to the same number as the number that tells how heavy its atoms are.
examples:
- They worked out the gram-atomic weight of the element.
- She looked up the gram-atomic weight of the element.
