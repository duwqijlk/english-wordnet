simpleMeaning: Too many young white cells fill the blood in this harmful growth of the parts of the body
  that make blood.
scope: Also called myelocytic leukemia, this is the harmful growth of the parts of the body that make
  blood, where too many young white cells fill the blood.
examples:
- Granulocytic leukemia filled the blood with too many young white cells.
- Granulocytic leukemia showed up in the blood-forming parts of the body.
