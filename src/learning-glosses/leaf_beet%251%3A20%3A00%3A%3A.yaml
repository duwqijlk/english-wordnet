simpleMeaning: Grown as a vegetable for the green parts and stalks that can be eaten, this beet has no
  swollen root.
scope: Also called chard, chard plant, and spinach beet, this beet is grown as a vegetable for its green
  parts and stalks, and not for a swollen root.
examples:
- We ate the leaf beet's green parts and stalks.
- The leaf beet had no swollen root to dig up.
