senseId: 'hyperadrenocorticism%1:26:00::'
synsetId: 14141150-n
simpleMeaning: Too much cortisol, a chemical made by the body, causes this sickness of the glands
scope: A sickness of the glands caused by too much cortisol; not a sickness of the glands from too little
  cortisol and not a sickness caused by other body chemicals.
examples:
- The vet said the dog's hyperadrenocorticism came from too much cortisol.
- Hyperadrenocorticism made her glands work too hard.
