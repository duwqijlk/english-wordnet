simpleMeaning: a moth of North America, of the silk-making kind, whose young eat the leaves of forest
  trees
scope: 'Also called cecropia moth: a North American moth of the silk-making kind whose young eat forest
  tree leaves, not a butterfly and not a moth that eats clothes.'
examples:
- The cecropia rested on the oak branch with its wings spread wide.
- We found a cecropia on the trunk of a forest tree.
