senseId: 'intersperse%2:35:02::'
synsetId: 01379285-v
simpleMeaning: to put things in among other things, with spaces between them
scope: To put things here and there among other things; this is not the sense about adding words or sayings
  into speech or writing.
examples:
- Small trees were interspersed among the houses along the street.
- She interspersed red stones in the row of white ones.
