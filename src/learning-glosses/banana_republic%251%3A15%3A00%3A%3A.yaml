simpleMeaning: Living by selling one thing abroad, such as the fruit, this small land, especially in Central
  America, has shaky rule and trade run by firms from other lands.
scope: This is a small land with shaky rule that lives by selling one thing abroad.
examples:
- The banana republic sold little but bananas, and firms from other lands ran its trade.
- Firms from other lands ran the trade of the banana republic, which lived by one export.
