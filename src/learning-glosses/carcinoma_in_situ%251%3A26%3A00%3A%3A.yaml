schema: oewn-learning-gloss-v2
senseId: 'carcinoma_in_situ%1:26:00::'
synsetId: 14270517-n
simpleMeaning: a group of cancer cells that has not yet grown into deeper layers of surface tissue or
  moved to other parts of the body
scope: A cluster of bad cells that has stayed in place, not a cancer that has spread and not a harmless
  growth; preinvasive cancer is another name for this sense.
examples:
- The doctor found carcinoma in situ during the screening.
- Carcinoma in situ had not yet reached the deeper tissue.
