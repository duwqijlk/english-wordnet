senseId: 'quantity_unit%1:23:00::'
synsetId: 13654422-n
simpleMeaning: a way to say how much power has moved, worked out from how strong the flow is and how long
  it runs
scope: 'Also called charge unit: a way to say how much power has moved, not a way to say how strong the
  flow is on its own and not a unit of time.'
examples:
- A quantity unit is used to work out how much power the lamp used in an hour.
- The meter showed the quantity unit had gone up after the heater ran all day.
