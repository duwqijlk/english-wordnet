simpleMeaning: A legal agreement between two or more people that the law can force them to follow.
scope: This is the deal itself, not the card game of bridge and not the act of making the deal.
examples:
- She signed a contract with the company before she started work.
- The builder broke the contract when he stopped work halfway.
