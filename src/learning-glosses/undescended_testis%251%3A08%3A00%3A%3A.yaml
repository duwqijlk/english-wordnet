simpleMeaning: a male sex gland that does not move down into the bag of skin below as a baby boy grows
  before he is born
scope: This is a male sex gland that stays in the body and does not move down into the bag of skin below,
  also called undescended testicle, and not a gland that has moved down in the normal way.
examples:
- The doctor found an undescended testis in the baby boy.
- An undescended testis may need care if it does not move down on its own.
