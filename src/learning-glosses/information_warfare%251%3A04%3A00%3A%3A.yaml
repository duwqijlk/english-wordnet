simpleMeaning: In a time of trouble or fighting, facts and the tools that carry them serve a set aim over
  a named foe or foes.
scope: It is the use of facts and the tools that carry them in a time of trouble or fighting to reach
  a set aim over a named foe, not the fighting itself.
examples:
- Information warfare was used against the enemy during the crisis.
- During the crisis, information warfare helped one side against the other.
