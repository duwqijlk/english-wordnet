simpleMeaning: an Old World plantain with long narrow leaves marked by raised lines, now growing widely
  in mild parts of the world
scope: An Old World plantain with long narrow leaves marked by raised lines; buckthorn, narrow-leaved
  plantain, ribgrass and ribwort are other names for it, not a grass of lawns and not a garden herb.
examples:
- Ripple-grass grows along the field path.
- The leaves of ripple-grass are long and narrow.
