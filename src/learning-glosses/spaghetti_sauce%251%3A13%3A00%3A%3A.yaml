simpleMeaning: any of many liquids served with long thin pasta or other kinds of pasta
scope: Any of many liquids served with long thin pasta or other kinds of pasta, also called pasta sauce;
  not a sauce for meat and not a soup.
examples:
- She made spaghetti sauce with tomatoes and garlic.
- He poured spaghetti sauce over the pasta.
