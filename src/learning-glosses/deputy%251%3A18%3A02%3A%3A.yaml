simpleMeaning: A person picked to stand in for others and act in their name.
scope: A person picked to stand in for others and act in their name, not a member of a law-making body,
  and not a stand-in for a sheriff.
examples:
- She sent a deputy to the meeting in her place.
- The deputy signed the papers for his chief.
