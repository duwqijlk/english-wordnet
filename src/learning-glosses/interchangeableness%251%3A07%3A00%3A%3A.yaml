senseId: 'interchangeableness%1:07:00::'
synsetId: 04743169-n
simpleMeaning: the fact that one thing can be used in place of another
scope: The fact that one thing can take the place of another, also called interchangeability and exchangeability;
  not the act of swapping things, and not mere likeness.
examples:
- The interchangeableness of the two parts made repairs easy.
- Their interchangeableness meant either one would do the job.
