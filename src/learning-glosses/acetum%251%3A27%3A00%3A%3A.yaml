simpleMeaning: A weak mix of acetic acid, used to dissolve other things, such as a drug.
scope: This weak mix of acetic acid dissolves other things, and it is not the sour liquid used as a condiment
  or food preservative.
examples:
- The pharmacist used acetum to dissolve the drug.
- The drug dissolved in acetum.
