scope: The count of tiny bits, called molecules, in a mole, a set amount, of a substance, about 602,250,000,000,000,000,000,000;
  Avogadro's number is another name for this sense, not the count of bits in a different amount of the
  substance.
examples:
- Avogadro number is about 602,250,000,000,000,000,000,000.
- Chemists use Avogadro number to count molecules in a mole.
