synsetId: 14203428-n
simpleMeaning: A disease of the breathing system, cause unknown, that seemed to begin in 2003 in mainland
  China; it brings fever, cough, breathing trouble or low oxygen, and can kill.
scope: The specific illness behind the 2003 outbreak, not a cold or another common breathing infection.
examples:
- The first cases of severe acute respiratory syndrome were reported in 2003.
- Fever and breathing difficulty are signs of severe acute respiratory syndrome.
