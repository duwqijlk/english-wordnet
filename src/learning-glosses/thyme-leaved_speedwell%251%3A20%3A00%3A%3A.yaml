simpleMeaning: Small paired leaves and bunches of blue flowers along a stem mark this plant, which lives
  year after year lying low along the ground in Europe, Asia, and the Americas.
scope: One of the plants that live year after year, this low one is known by its small paired leaves and
  bunches of blue flowers.
examples:
- You can tell thyme-leaved speedwell by its small paired leaves and bunches of blue flowers.
- Year after year, thyme-leaved speedwell comes back, lying low along the ground.
