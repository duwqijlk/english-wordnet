simpleMeaning: one of the sharp points on a wire that has sharp points all along it
scope: One sharp point on a wire with sharp points along it, not the thin part of a feather, not a back
  point on a spear or arrow, and not an unkind remark.
examples:
- A barb on the fence caught his shirt and tore it.
- He cut his hand on a barb while he fixed the fence.
