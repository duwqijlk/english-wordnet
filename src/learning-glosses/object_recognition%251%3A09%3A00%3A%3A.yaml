simpleMeaning: Seeing a thing you already know and telling what it is
scope: The seeing and knowing of a thing you have met before, not the seeing of something new and not
  the naming of a thing you cannot see.
examples:
- Her object recognition failed when the face in the photo was one she had never seen.
- Object recognition lets a child point to a dog and say what it is.
