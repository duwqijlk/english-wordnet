simpleMeaning: A wall of stone or concrete that runs from the shore into the water, built to keep the
  beach from washing away
scope: A stone wall that runs into the sea, also called a groin; not the burrowing animal, not the unit
  of amount, and not the spicy sauce.
examples:
- Boats sheltered behind the mole in the storm.
- Waves broke against the mole all winter.
