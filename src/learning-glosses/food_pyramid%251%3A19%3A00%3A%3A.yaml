simpleMeaning: In ecology, a set of feeding chains in steps, with the main hunter at the top, and each
  step feeding on the step below.
scope: In ecology, this is a set of feeding chains in steps with the main hunter at the top, not a chart
  of what people should eat.
examples:
- The food pyramid shows who eats whom.
- At the top of the food pyramid sits the main hunter.
