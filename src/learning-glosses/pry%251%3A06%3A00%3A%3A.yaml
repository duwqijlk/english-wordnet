simpleMeaning: a heavy iron bar used to lift heavy things, with one end shaped like a wedge, thick at
  one side and thin at the edge
scope: This is a heavy iron tool for lifting and opening things; it is not the verb that means asking
  about another person's private life.
examples:
- He used a pry to lift the heavy stone lid.
- The worker picked up the iron pry and opened the wooden box.
