simpleMeaning: a tool for making holes in wood, with a bent handle you turn and a hole that holds the
  cutting bit
scope: A woodworker's tool for boring holes, not a rope on a ship, not teeth straighteners, and not the
  marks { }.
examples:
- He used a brace to bore a hole in the plank.
- The carpenter turned the brace to make a hole for the screw.
