simpleMeaning: a wooden thing shaped like a club, used in bowling and set up in groups of ten in a triangle
  as the thing to hit
scope: A wooden thing shaped like a club that bowlers try to knock down, not a small piece of wood or
  metal used to hold things together and not a piece of jewellery worn on clothes.
examples:
- He knocked down nine pins with his first ball.
- She set the pins up in a triangle for the next game.
