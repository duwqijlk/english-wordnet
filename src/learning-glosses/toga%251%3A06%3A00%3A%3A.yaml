simpleMeaning: one long piece of cloth worn as a loose outer garment by men in ancient Rome
scope: A loose outer garment worn by men in ancient Rome, not a modern coat and not a tight, fitted garment.
examples:
- The Roman leader wore a white toga in the painting.
- In the play, every man in a toga spoke to the crowd.
