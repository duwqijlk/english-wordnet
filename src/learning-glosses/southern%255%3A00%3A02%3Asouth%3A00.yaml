simpleMeaning: placed on the south side of something or pointing toward the south.
scope: This is not about coming from southern regions and not about the southern United States; it is
  about the side of something that faces or lies toward the south.
examples:
- The southern side of the building stays cool in summer.
- They planted trees along the southern edge of the field.
