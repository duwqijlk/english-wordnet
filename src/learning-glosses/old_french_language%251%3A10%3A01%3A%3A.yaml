simpleMeaning: The first form of the tongue of France, used from the 800s to the 1400s.
scope: Also called Langue d'oil, Langue d'oil French and Old French; the earliest form of French, used
  from the 9th to the 15th century, while later French came after it.
examples:
- Old French language was spoken in France from the 9th century.
- The earliest French books were written in Old French language.
