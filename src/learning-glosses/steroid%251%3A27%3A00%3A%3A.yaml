simpleMeaning: one of a group of substances that can dissolve in fat, built on 17 carbon atoms in four
  rings, and many strongly affect how the body works
scope: This sense is the wide group built on 17 carbon atoms in four rings, not only the smaller hormone
  sense (a substance the body makes that affects how sex parts grow).
examples:
- Cholesterol is a steroid found in the body.
- 'This plant substance is a steroid: it can dissolve in fat and is built on 17 carbon atoms in four rings.'
