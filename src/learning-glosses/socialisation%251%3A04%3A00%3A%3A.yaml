simpleMeaning: The taking on of the ways of the folk around.
scope: This sense is also called socialization and enculturation, for the taking on of the ways of the
  folk around, unlike the sense for the action of setting up on a socialist ground, and unlike the sense
  for the act of meeting for social ends.
examples:
- Socialisation is the taking on of the ways of the folk around.
- Socialisation takes on folk ways.
