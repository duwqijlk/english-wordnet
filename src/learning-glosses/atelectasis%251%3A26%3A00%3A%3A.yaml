simpleMeaning: A lung that was once open has fallen in, above all in babies, or the tiny air sacs in the
  lungs fail to open at birth
scope: This word covers a lung that was once open and then falls in, above all in babies, and it also
  covers tiny air sacs that fail to open at birth.
examples:
- The baby's atelectasis meant part of one lung had fallen in.
- Doctors watched for atelectasis in the newborn whose air sacs had not opened.
