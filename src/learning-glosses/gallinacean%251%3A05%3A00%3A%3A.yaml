simpleMeaning: birds that spend their days on the ground, feeding there, with thick, heavy bodies, and
  people keep them on farms or hunt them as game
scope: A bird of this kind, also called a gallinaceous bird, is not a bird that hunts in the air and not
  a small songbird that feeds in trees.
examples:
- The gallinacean scratched the ground for seeds in the farmyard.
- A gallinacean like a chicken spends much of its day feeding on the ground.
