simpleMeaning: A North American tree with large round leaves with wavy edges and brownish bark and wood.
scope: This is a North American tree with large round leaves, also called black cottonwood, downy poplar,
  or swamp cottonwood, and not a willow or a birch.
examples:
- The swamp poplar shaded the river bank with its wide leaves.
- We cut brownish wood from the swamp poplar.
