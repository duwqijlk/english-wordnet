simpleMeaning: a glass tube that goes around the wick of an oil lamp, the short string that burns
scope: The glass part of an oil lamp, not the tall part on the roof of a house that lets smoke out.
examples:
- She lifted the chimney off the oil lamp and wiped the soot from it.
- The chimney of the lamp cracked when the lamp fell over.
