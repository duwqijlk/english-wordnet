simpleMeaning: In computer science, the built-in link between a machine and a disk drive or other attached
  equipment, made of the wires and parts that carry signals between them
scope: 'Also called port: in computer science, the wiring that links one device to another, not the face
  where two liquids meet and not a program you use on a screen.'
examples:
- The printer connects to the computer through a fast interface.
- This interface lets the hard disk drive talk to the rest of the machine.
