simpleMeaning: A thing that makes power, and it can hold several small parts joined side by side or one
  after another, some used once and some again.
scope: A thing that makes power for a machine, not a set of guns used together, not a set of stamps for
  crushing rock, and not the pitcher and catcher in baseball.
examples:
- The battery in my torch has run out.
- Put a new battery in the radio.
