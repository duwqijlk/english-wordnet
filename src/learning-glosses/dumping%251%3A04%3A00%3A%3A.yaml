simpleMeaning: Selling goods in another country for less than the price charged at home.
scope: Selling goods abroad below the home price; not a sale at home, and not giving goods away.
examples:
- The firm was accused of dumping steel abroad.
- Dumping cars abroad at a lower price than at home hurt local makers.
