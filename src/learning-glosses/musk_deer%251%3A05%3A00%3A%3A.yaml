simpleMeaning: In the high lands of central Asia lives a small deer with thick legs, and its male gives
  off a strong-smelling stuff that people value.
scope: This is the small deer with thick legs that lives in the high lands of central Asia, not the strong-smelling
  stuff its male gives off.
examples:
- A musk deer crossed the high grassland.
- The male musk deer gives off a strong smell.
