simpleMeaning: a feeling of admiration for someone because of their qualities or achievements.
scope: This is the admiration you feel for someone, not the good name you have with others and not a particular
  point or detail.
examples:
- I have great respect for nurses and the work they do.
- He spoke of his coach with deep respect.
