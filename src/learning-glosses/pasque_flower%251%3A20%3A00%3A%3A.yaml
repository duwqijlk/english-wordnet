simpleMeaning: At times placed with the Anemone kind, this plant is of the Pulsatilla kind
scope: 'Also called a pasqueflower: any plant of the Pulsatilla kind, at times placed with the Anemone
  kind, not a plant that is of the Anemone kind by itself.'
examples:
- The pasque flower grows in the meadow.
- She pressed a pasque flower between the pages of a book.
