simpleMeaning: To rub or scrape, as one does to calm an itch.
scope: This is the itch-calming action, with rub and itch as other names for it, not cutting or wearing
  a surface, erasing writing, or cancelling a plan.
examples:
- He scratched his arm where the mosquito had bitten him.
- Stop scratching that rash or it will get worse.
