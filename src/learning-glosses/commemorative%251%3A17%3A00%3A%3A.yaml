simpleMeaning: A coin, stamp, or other thing made to mark an event or to honour a person.
scope: An object made to mark an event or honour a person, not the adjective use that calls a thing commemorative
  when it is meant to mark something.
examples:
- She bought a commemorative stamp for the queen's jubilee.
- The mint issued a commemorative coin for the anniversary.
