simpleMeaning: To stop a horse, or yourself, or make it go more slowly, by pulling back as if on the straps
  that guide a horse
scope: Stopping or slowing a horse or yourself, not turning a horse and not letting it run free.
examples:
- They reined in in front of the post office.
- The rider reined his horse to a slow walk at the gate.
