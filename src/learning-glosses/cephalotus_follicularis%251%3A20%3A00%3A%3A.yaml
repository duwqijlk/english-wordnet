simpleMeaning: A meat-eating long-lived herb with a green jug and a hinged lid, both edged with red, from
  western Australia.
scope: Also called Australian pitcher plant, this meat-eating herb from western Australia is known by
  its green jug with a hinged lid edged in red, one meat-eating plant among others, set apart from other
  pitcher plants by its hinged lid with red edges and by its home in western Australia.
examples:
- Cephalotus follicularis grows in western Australia.
- The Cephalotus follicularis has a green jug with a hinged lid.
