simpleMeaning: a tree from the hot lands of the Americas, with big shield-shaped leaves and stems that
  are empty inside
scope: A tree from tropical America, also called imbauba, trumpet-wood, trumpet tree and trumpetwood;
  not a snake and not a tree cut for its wood.
examples:
- The snake wood stood by the river, its big leaves catching the sun.
- Gardeners plant snake wood for its hollow stems and wide leaves.
