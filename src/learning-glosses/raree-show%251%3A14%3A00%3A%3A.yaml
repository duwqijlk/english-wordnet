simpleMeaning: Pictures or things put out to be looked at through a small hole or a glass that makes things
  look bigger
scope: Pictures or things put out to be looked at through a small hole or a glass that makes things look
  bigger; peepshow is another name for it, not a play on a stage and not pictures hung on a wall.
examples:
- The children crowded round the raree-show at the fair.
- A raree-show let visitors peep at painted scenes through a tiny hole.
