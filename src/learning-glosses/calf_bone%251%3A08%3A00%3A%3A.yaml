simpleMeaning: The outer and thinner of the two hard parts of a person's lower leg, between the knee and
  the ankle.
scope: 'Also called fibula: the thin outer leg bone, not the thick inner shin bone and not a bone of the
  arm.'
examples:
- He broke his calf bone in the fall.
- The calf bone runs down the outside of the lower leg.
