simpleMeaning: Blood sugar that is too low, often because of too much insulin or a poor diet.
scope: Blood sugar that is too low, often from too much insulin or a poor diet; hypoglycemia is another
  name for it, not blood sugar that is too high.
examples:
- She felt shaky when her hypoglycaemia set in after the extra insulin.
- A sweet drink can lift hypoglycaemia fast.
