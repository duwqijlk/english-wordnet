simpleMeaning: to tell the main points of something in a short, rough way, with no small details
scope: 'Also called outline and sketch: to tell the main points in a short, rough way, not a full account
  and not a picture drawn on paper.'
examples:
- She adumbrated the plan in a few short lines.
- He adumbrated his ideas before the meeting began.
