simpleMeaning: a way of showing a person or thing in a picture
scope: 'Also called portraying: a showing of a person or thing in a picture, not acting a part on stage,
  and not a showing made by drawing or painting.'
examples:
- The portrayal of the city in the old picture is very clear.
- This portrayal shows the man in a picture with his dog beside him.
