simpleMeaning: a thing that has the shape of a triangle with all three sides the same length
scope: This is any thing with this shape, not the low land of the same shape where a river splits before
  it meets the sea or a lake.
examples:
- The kite was a bright red delta that flew well in the wind.
- She drew a delta on the board to show a shape with three equal sides.
