simpleMeaning: A general loss of strength and life in body and mind, brought on by a long illness that
  wears a person down.
scope: A general loss of strength and life in body and mind from a long illness, also called wasting and
  cachexia; not a short illness and not simple tiredness.
examples:
- Cachexy left him weak in body and mind.
- The long illness brought on cachexy.
