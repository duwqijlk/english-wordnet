simpleMeaning: having or showing unfair dislike formed before knowing the facts, wanting what others have,
  or a strong dislike
scope: About unfair feelings toward people or things; not the sense about skin turning yellow because
  of illness.
examples:
- He took a jaundiced view of the new club and disliked it before he knew anything about it.
- She looked at their success with jaundiced eyes, full of envy and dislike.
