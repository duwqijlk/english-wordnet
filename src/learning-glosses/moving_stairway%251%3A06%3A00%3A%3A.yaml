simpleMeaning: On a belt that goes round and round, a set of steps keeps going
scope: 'Also called an escalator or a moving staircase: a set of steps that keep going on a belt that
  goes round, not a set of steps that stays still and not a lift.'
examples:
- She took the moving stairway down to the ground floor.
- The moving stairway carried shoppers between the floors.
