simpleMeaning: A heading that names a law or a proposed law and may give a short sum-up of what it deals
  with
scope: A heading that names a law or a proposed law, also called a title or a rubric; not a heading for
  a chapter of a book.
examples:
- The statute title names the new law about schools.
- A clear statute title tells the reader what the bill deals with.
