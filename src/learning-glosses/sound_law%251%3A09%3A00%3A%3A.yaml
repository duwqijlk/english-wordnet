simpleMeaning: a rule that tells how the noises of a language change over time
scope: In the study of language, a rule about how speech noises change over time; not a rule of grammar
  and not a law made by a government.
examples:
- Grimm's law is a famous sound law in the history of English.
- The sound law explains why the old word changed its first letter.
