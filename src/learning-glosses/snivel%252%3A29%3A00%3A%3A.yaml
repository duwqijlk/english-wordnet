simpleMeaning: to breathe in hard through the nose so thick liquid in the nose is pulled up
scope: 'Also called snuffle: pulling liquid up through the nose, not crying or complaining while breathing
  in through the nose.'
examples:
- With a bad cold, he kept snivelling and pulling the thick liquid back up through his nose.
- She snivelled to pull the liquid in her nose back up.
