simpleMeaning: saying numbers in order, one after another, to find how many things there are
scope: Saying numbers in order to find how many there are; count, counting and reckoning are other names
  for this sense, not a score in baseball and not the verb sense of agreeing.
examples:
- The tally continued for several hours.
- Keep a tally of the votes as they come in.
