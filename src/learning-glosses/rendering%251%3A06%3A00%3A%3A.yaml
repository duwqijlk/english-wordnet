simpleMeaning: A drawing that shows how a building will look, made from the architect's plan.
scope: This is a drawing that shows how a building will look; not a performance of a piece, and not a
  coat of plaster on a wall.
examples:
- The rendering of the new library showed a tall glass front.
- Architects sent a rendering of the house before work began.
