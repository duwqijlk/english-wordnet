simpleMeaning: Small yellow flowers grow on this shrub of the dry southwest United States and New Mexico,
  whose leaves stay on all year, smell strong and sweet, and feel sticky.
scope: Also called coville and hediondilla; a desert shrub with sticky sweet-smelling leaves, not the
  dark liquid creosote used to treat wood.
examples:
- The creosote bush grew at the edge of the desert.
- We saw a creosote bush with small yellow flowers.
