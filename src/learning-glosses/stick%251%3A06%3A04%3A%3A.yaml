simpleMeaning: A long tool, usually wooden, that hockey or polo players use to hit a puck or ball.
scope: The sports item used to hit a puck or ball in hockey or polo, not a plain piece of wood and not
  the block of butter.
examples:
- She raised her stick and sent the ball flying towards the goal.
- The polo player swung his stick and struck the ball cleanly.
