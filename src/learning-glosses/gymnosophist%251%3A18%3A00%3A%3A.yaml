simpleMeaning: A member of a Hindu group that follows gymnosophy, a way of life that most of all means
  going without clothes.
scope: A member of a Hindu group that follows gymnosophy, a way of life that most of all means going without
  clothes; not a person with both male and female sexual traits and not a set of moves that builds strength.
examples:
- The gymnosophist lived without clothes as part of his faith.
- Gymnosophists follow a Hindu way of life that most of all means going without clothes.
