simpleMeaning: the pleasing sound you hear when musical notes are put together in a good way
scope: This is the pleasing sound made by notes put together well, not the row of notes itself that makes
  a tune you can know again.
examples:
- He closed his eyes to enjoy the melody, the pleasant sound of the notes together.
- The melody she heard from the violin was soft and pleasing.
