simpleMeaning: to scatter drops of liquid over a thing so it gets lightly wet
scope: 'Also called sprinkle: to scatter drops of liquid over a thing, not to pour water on it and not
  to soak it through.'
examples:
- She besprinkled the plants with water before the sun grew hot.
- He besprinkled the cake with lemon juice to keep it moist.
