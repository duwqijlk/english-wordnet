simpleMeaning: of an island, like an island, or placed on an island
scope: This sense is about islands and places on them; it is not the sense of a person or group with a
  narrow view and little interest in others.
examples:
- Hawaii has an insular culture shaped by the sea.
- The workers look after the insular areas far from the mainland.
