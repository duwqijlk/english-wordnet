simpleMeaning: One of many kinds of fold in cloth, kept in shape by folding the cloth back on itself and
  then pressing or sewing it
scope: A fold in cloth doubled back and pressed or sewn into shape; plait is another name for this sense,
  not a fold made by gathering cloth and not the act of folding.
examples:
- The pleat in her skirt fell in a straight line.
- He ironed a sharp pleat into the trousers.
