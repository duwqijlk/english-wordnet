simpleMeaning: To collect information systematically from a group in order to describe it with numbers.
scope: This is collecting data from a sample of people or things so the results can be counted, not looking
  something over carefully, not thinking about a subject as a whole, and not mapping land.
examples:
- Researchers surveyed two thousand households about their spending habits.
- The company surveyed its customers to find out which features they used.
