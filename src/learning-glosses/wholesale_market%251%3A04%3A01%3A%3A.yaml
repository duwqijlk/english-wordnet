simpleMeaning: 'goods are sold here in large amounts to shops, not to the public: a middleman buys stock
  from makers and passes it on to shops, where people buy it'
scope: The sale of goods in large amounts to shops, not to the public; not a shop that sells to the public
  and not a single sale between two people.
examples:
- The wholesale market opens before dawn, when shopkeepers come to buy stock.
- She buys fruit at the wholesale market and sells it in her shop.
