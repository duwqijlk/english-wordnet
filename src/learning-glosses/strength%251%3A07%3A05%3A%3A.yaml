simpleMeaning: How well a military force can wage war, judged by the troops and equipment it has.
scope: Not 'physical or mental power,' not 'the intensity of a force or signal,' not 'a special talent,'
  not 'the persuasiveness of an argument,' not 'the potency of a drink or drug,' not 'financial success,'
  and not 'durability.'
examples:
- The general reported the strength of his division before the attack.
- Planners compared the strength of the two armies.
