simpleMeaning: Marked with small spots or bits of a different colour or feel.
scope: Also called spotted, this is a thing marked with spots of a different colour or feel, not a thing
  mended with cloth over a hole.
examples:
- A field patched with ice and snow lay before them.
- The black-and-white patched cow stood by the gate.
