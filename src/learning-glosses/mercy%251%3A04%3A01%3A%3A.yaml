simpleMeaning: Help that takes away pain or trouble, and great kindness shown to people who are in pain
scope: Kind help that eases pain, not kind treatment of a law-breaker by a court.
examples:
- Distributing food and clothing to the flood victims was an act of mercy.
- Her mercy to the sick and hungry gave them hope.
