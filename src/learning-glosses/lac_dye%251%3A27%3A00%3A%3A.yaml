simpleMeaning: A bright red colouring like cochineal, taken with an alkali from the hard resin left on
  twigs by small insects
scope: This is a bright red colouring like cochineal, taken from the hard resin left on twigs by small
  insects, not cochineal itself and not a paint.
examples:
- Lac dye gave the cloth a deep scarlet colour.
- The dyer used lac dye to colour the silk red.
