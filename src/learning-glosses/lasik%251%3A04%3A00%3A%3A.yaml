simpleMeaning: An eye operation that changes how the eye bends light by reshaping its clear front, making
  a flap with the outer layer and the deeper layer of tissue
scope: Also called laser-assisted in situ keratomileusis; an eye operation that reshapes the clear front
  of the eye.
examples:
- LASIK gave her clear sight without glasses.
- He had LASIK to fix the shape of his eye.
