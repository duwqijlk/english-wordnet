senseId: 'agglutination_test%1:09:00::'
synsetId: 05747558-n
simpleMeaning: A blood test that finds an unknown antigen, a germ or cell marker, by whether blood clumps
  with a known antibody; used in tissue matching, blood typing and infection diagnosis.
scope: This is the blood test that reveals an antigen by clumping, not a test that measures how much of
  a substance is present or one that grows germs in a dish.
examples:
- The lab used an agglutination test to identify the antigen behind the infection.
- An agglutination test showed that the donor tissue matched the patient.
