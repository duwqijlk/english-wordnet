simpleMeaning: a mould-like growth that makes soft wet rot in fruit and vegetables and rings of dry rot
  round the roots of sweet potatoes
scope: 'Also called ring rot fungus: a growth that rots fruit, vegetables and sweet potato roots, not
  a leak in a pipe and not another rot.'
examples:
- Leak fungus turned the stored fruit soft and wet.
- The leak fungus left rings of dry rot round the sweet potato roots.
