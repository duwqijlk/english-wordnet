simpleMeaning: a group of tiny sea animals that live joined together, often clear or brightly coloured,
  floats or swims in the sea
scope: This is the name for a floating group of sea animals that live joined together, not one animal
  on its own.
examples:
- A siphonophore drifted past in the open sea.
- We saw a siphonophore floating in the sea.
