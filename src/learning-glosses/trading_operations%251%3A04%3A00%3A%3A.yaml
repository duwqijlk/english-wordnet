simpleMeaning: the money work at a firm that buys and sells investments for people, carrying out deals
  and keeping records of each person's account
scope: The everyday money work of a firm that buys and sells for clients; operations is another name for
  this sense, not the act of buying or selling itself and not a bank account.
examples:
- Trading operations at the firm keep every client's records in order.
- He works in trading operations, carrying out deals for customers.
