simpleMeaning: Letters or symbols set down or printed on a surface as a way of standing for the sounds
  or words of a language.
scope: This is the marks on a surface, not the activity of producing text, and not a composed work such
  as a book.
examples:
- The writing on the cave wall is thousands of years old.
- The writing on the label had faded until the letters were barely visible.
