simpleMeaning: a mess that comes when people or things do not act in the way that was looked for
scope: A mess from things not acting as looked for, not an act that mixes things up and not a shy feeling.
examples:
- The army retreated in confusion.
- The crowd scattered in confusion when the rain began.
