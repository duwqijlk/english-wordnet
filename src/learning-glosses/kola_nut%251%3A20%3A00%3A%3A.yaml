simpleMeaning: Cola drinks take their flavour from this tree, whose large brown seeds hold such things
  as caffeine.
scope: Also called goora nut, kola and kola nut tree, it names the tree whose seeds give cola drinks their
  flavour, not the bitter seed on its own.
examples:
- The kola nut tree bore large brown nuts.
- Kola nuts go into the cola extract.
