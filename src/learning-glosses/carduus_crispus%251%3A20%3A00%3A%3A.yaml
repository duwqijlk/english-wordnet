simpleMeaning: A European plant that lives two years, brought into North America, with flower heads in
  crowded groups at the ends of its branches.
scope: Also called welted thistle; a European two-year plant with crowded flower heads, among the thistles
  brought into North America.
examples:
- Carduus crispus grew by the road, its flower heads in crowded groups.
- The Carduus crispus was brought into North America from Europe.
