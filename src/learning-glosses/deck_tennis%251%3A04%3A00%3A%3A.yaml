simpleMeaning: A game played mainly on big ships at sea, in which players throw a ring back and forth
  over a net stretched across a small court.
scope: A game played mainly on big ships, throwing a ring over a net; not tennis and not quoits.
examples:
- They played deck tennis on the liner.
- Deck tennis is played with a ring and a net.
