simpleMeaning: In electronics, a circuit with an uneven response that holds down how tall a signal gets,
  cutting off its peaks
scope: Another name for the electronic clipper; it caps signal peaks and is not a speed limiter or a volume-control
  device.
examples:
- A limiter holds the audio signal below its peak level.
- The circuit uses a limiter to prevent sudden spikes.
