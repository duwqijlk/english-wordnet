simpleMeaning: the upper part of an inside wall that rises above the roof next to it, with windows that
  let in light
scope: The upper part of an inside wall that rises above the roof next to it, with windows that let in
  light; clerestory is another name for this sense, not a skylight in the roof and not an ordinary window.
examples:
- Light came in through the clearstory windows.
- The clearstory rose above the low roof of the hall.
