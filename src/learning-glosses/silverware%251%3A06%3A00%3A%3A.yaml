simpleMeaning: things for the table, such as knives, forks and spoons, made of silver, silver plate, pewter
  or steel that does not rust
scope: These are things for the table made of silver, silver plate, pewter or steel that does not rust,
  not pots and pans and not jewellery.
examples:
- She polished the silverware before the guests arrived.
- The silverware was laid out beside each plate.
