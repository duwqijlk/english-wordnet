simpleMeaning: A substance that gives off rays on its own, of the heavy set of such substances; found
  in rocks that hold uranium.
scope: Not uranium itself, nor any other stuff that gives off rays; also called actinium and atomic number
  89.
examples:
- Ac gives off rays and is found in uranium rock.
- The sample held a trace of Ac.
