simpleMeaning: A body chemical made early in pregnancy by the afterbirth, and finding it in urine and
  blood is how one kind of pregnancy test works.
scope: This is a body chemical of early pregnancy also called human chorionic gonadotrophin and human
  chorionic gonadotropin, not a chemical made later in pregnancy or by another part of the body.
examples:
- HCG levels rise early in pregnancy.
- A pregnancy test looks for HCG in the urine.
