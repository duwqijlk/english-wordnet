simpleMeaning: The quality of not being tidy, with things dirty or left in the wrong places
scope: 'Also called untidiness: this is a lasting quality of not being tidy, not a single dirty spot or
  one untidy act.'
examples:
- The messiness of his desk made it hard to find papers.
- Her roommates complained about the messiness of the kitchen.
