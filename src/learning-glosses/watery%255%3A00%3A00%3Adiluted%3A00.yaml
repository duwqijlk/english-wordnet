simpleMeaning: having too much liquid added, so it is thin and has little taste
scope: 'Also called weak: having too much liquid added and little taste, not wet with tears or sweat,
  not full of water, and not simply made of or like water.'
examples:
- The coffee was watery and had almost no taste.
- She poured out the watery soup and made a thicker one.
