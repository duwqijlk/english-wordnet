simpleMeaning: a strong urge with no good reason, making you do things that do not matter or the same
  thing again and again, even when you do not want to
scope: 'Also called obsession: a strong urge with no good reason that makes you do small actions again
  and again. Not the urge to do or say one thing that would be better left undone or unsaid.'
examples:
- Her compulsion to wash her hands again and again left her hands red and sore.
- He felt a compulsion to check the locked door ten times before bed.
