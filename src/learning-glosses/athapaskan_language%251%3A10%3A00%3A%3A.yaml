simpleMeaning: A group of the tongues of the first peoples of America, a name made up by an American man
  who studied peoples, Edward Sapir.
scope: Also called Athabascan, Athabaskan, Athapascan, and Athapaskan; a group of tongues, not the people
  who speak them.
examples:
- Athapaskan language is a group of tongues of the first peoples of America.
- The Athapaskan language group was named by Edward Sapir.
