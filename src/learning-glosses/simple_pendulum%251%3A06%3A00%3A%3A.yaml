simpleMeaning: A weight hangs on a cord that has no weight of its own, never stretches, and meets no drag.
scope: This is the imagined case of a weight hanging from a cord that has no weight of its own and never
  stretches, not a real weight on an ordinary rope.
examples:
- For the simple pendulum, the cord has no weight and never stretches.
- Nothing slows the simple pendulum down, and its cord never changes in length.
