simpleMeaning: to work out exactly what kind of problem or illness it is by examining the signs.
scope: This sense is not about giving someone or something a label or title, and not about identifying
  a plant or animal species; it is about working out the nature of a problem or illness.
examples:
- The doctor could not name the disease without more tests.
- Investigators named the cause of the crash after examining the wreckage.
