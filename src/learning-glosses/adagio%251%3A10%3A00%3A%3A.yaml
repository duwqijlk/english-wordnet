simpleMeaning: In music, a piece played slowly and with grace.
scope: In music, a slow and graceful piece, not the slow part of a dance for two and not a fast piece.
examples:
- The orchestra opened with a soft adagio.
- She chose an adagio for the quiet close of the concert.
