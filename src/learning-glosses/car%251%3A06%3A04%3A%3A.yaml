simpleMeaning: a vehicle that takes people or goods along a railway pulled by a long steel rope.
scope: This is a vehicle on a cable-hauled railway, not a road vehicle and not a railway carriage pulled
  by an engine.
examples:
- A small car carried us up the mountain on its steel rope.
- Workers loaded the car with coal at the top of the line.
