simpleMeaning: Said of a chemical in which the crystal frame of one part holds another part fast inside
  it
scope: A chemical in which one part is held fast inside the crystal frame of another part is described
  by this word.
examples:
- The clathrate compound held one part fast inside the crystal frame of another.
- The clathrate held its trapped part fast inside the crystal frame.
