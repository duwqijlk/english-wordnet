simpleMeaning: Sailors eat this dish of meat and vegetables cooked with hard dry bread.
scope: This is a sailor's stew of meat, vegetables and hard dry bread, not a thin soup and not a stew
  eaten only on land; lobscuse and scouse are other names for this sense.
examples:
- The sailors ate lobscouse from tin bowls on deck.
- Mother made lobscouse with the last of the salt meat.
