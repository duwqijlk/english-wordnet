simpleMeaning: something used to make another thing less thin or less runny
scope: This is something used to make another thing less thin or less runny; not the act of becoming less
  thin or less runny, and not a part that has become wider.
examples:
- Add a little flour as a thickening for the gravy.
- Corn starch is a common thickening in many sauces.
