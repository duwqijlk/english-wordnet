simpleMeaning: In physics, in a world where the laws of nature work the same in a right-handed set of
  measures as in a left-handed one, a sameness stays put.
scope: Also called parity, conservation of parity, and space-reflection symmetry, it is the sameness of
  nature's laws in a right-handed set of measures and a left-handed one.
examples:
- Mirror symmetry held in the right-handed set of measures and in the left-handed one.
- The laws of nature worked the same under mirror symmetry.
