simpleMeaning: A sea worm, mostly, with both male and female parts in one body and pairs of leg-like flaps
  that carry stiff hairs
scope: 'Also called polychaete worm, polychete, and polychete worm: a sea worm with pairs of hairy flaps,
  not a roundworm and not a land worm.'
examples:
- The polychaete crawled over the rock with its hairy flaps.
- Many polychaete worms live in tubes on the sea floor.
