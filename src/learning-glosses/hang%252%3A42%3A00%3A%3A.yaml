simpleMeaning: To pose a threat, or to press down like a heavy load.
scope: This describes a threatening or crushing presence, not a jury that cannot agree, something suspended
  from above, or a killing by rope.
examples:
- A sense of dread hung over the whole office.
- The threat of layoffs hung over the staff all winter.
