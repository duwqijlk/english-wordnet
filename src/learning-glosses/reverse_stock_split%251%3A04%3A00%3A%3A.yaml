senseId: 'reverse_stock_split%1:04:00::'
synsetId: 00440224-n
simpleMeaning: a cut in the number of a firm's shares that are out in the world, while what each owner
  holds in worth stays the same
scope: Not a rise in share price, and not a cut in what owners are owed; also called reverse split and
  split down.
examples:
- The board voted for a reverse stock split this spring.
- A reverse stock split cut the share count by half.
