senseId: 'ischaemia%1:26:00::'
synsetId: 14189600-n
simpleMeaning: Too little blood in one part of the body, sometimes caused by blood tubes narrowing, a
  clot, or a blockage carried in the blood
scope: Too little blood in one part of the body, sometimes from narrowing tubes, a clot or a blockage;
  ischemia is another name for this sense, not a general lack of blood and not a stroke.
examples:
- Ischaemia in his foot made it cold and pale.
- The doctor said the ischaemia came from a narrowed blood tube.
