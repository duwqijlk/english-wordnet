simpleMeaning: A delicate fern found widely in North America and Europe, with thin finely cut leaves on
  stems that break easily.
scope: Also called a brittle bladder fern, a brittle fern, or a fragile fern; a delicate fern with thin
  finely cut leaves on stems that break easily, kin to other delicate ferns.
examples:
- Cystopteris fragilis grows in the damp shade, its thin leaves on brittle stems.
- The Cystopteris fragilis by the stream has finely cut fronds.
