simpleMeaning: Any of several thorny shrubs of the same-named genus, with small white flowers and then
  hard red or orange-red berries.
scope: Also called fire thorn, firethorn, and pyracanth; any of several thorny shrubs with small white
  flowers and then hard red or orange-red berries.
examples:
- The Pyracantha by the wall has hard red berries.
- A Pyracantha hedge bears small white flowers in spring.
