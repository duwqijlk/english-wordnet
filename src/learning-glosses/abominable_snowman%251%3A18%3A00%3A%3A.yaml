simpleMeaning: a large hairy creature shaped like a person, said to live in the high mountains of the
  Himalayas
scope: This is a large hairy creature shaped like a person, also called yeti; not a real animal seen by
  scientists and not a snowman made of snow.
examples:
- Stories say the abominable snowman roams the high passes of the Himalayas.
- The climbers claimed to see abominable snowman tracks in the snow.
