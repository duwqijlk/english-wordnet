simpleMeaning: A blood tube that branches off the face's main blood tube and feeds the lower lip.
scope: A blood tube off the face's main blood tube that feeds the lower lip, also called arteria labialis
  inferior; not a vein and not a blood tube that feeds the upper lip.
examples:
- The inferior labial artery feeds blood to the lower lip.
- A cut near the inferior labial artery bled a lot.
