simpleMeaning: a shaped piece of cloth, wide at one end and narrow at the other, often like a triangle,
  sewn into clothes, umbrellas, or sails
scope: A shaped piece of cloth sewn into clothes, umbrellas, or sails; also called a panel; not the verb
  sense of wounding by piercing.
examples:
- The skirt was made with gores to give it a full shape.
- She added a gore to the side of the sail.
