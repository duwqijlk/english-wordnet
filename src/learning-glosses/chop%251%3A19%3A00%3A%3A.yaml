senseId: 'chop%1:19:00::'
synsetId: 11548218-n
simpleMeaning: the rough, uneven movement of waves, usually made by wind blowing in the other direction
  to the tide
scope: This is about the movement of waves on water. It is not a tennis hit made with a downward move
  that makes the ball spin back.
examples:
- The boat headed into the chop and rocked up and down.
- Strong wind made a heavy chop on the lake.
