simpleMeaning: The moving law force of the service for immigration and citizenship that finds and stops
  people entering the country without leave
scope: The moving law force of the service for immigration and citizenship, also called the US Border
  Patrol; not the coast guard that watches the shores and not the police of a single state.
examples:
- The United States Border Patrol stopped the truck near the border.
- United States Border Patrol agents watch the desert roads at night.
