simpleMeaning: acting or speaking in a plain, open way, with no hint and no holding back
scope: 'Also called blunt, frank, candid, forthright, outspoken, free-spoken, plainspoken and point-blank:
  plain and open in what you say or do, not polite talk that hides what you mean and not a sudden blow.'
examples:
- He gave a straight-from-the-shoulder answer to the question.
- Her straight-from-the-shoulder talk left no doubt about what she thought.
