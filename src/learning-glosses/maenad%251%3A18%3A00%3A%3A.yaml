simpleMeaning: In Greek myth, a woman who took part in the wild, drunken rites held for Dionysus, the
  god of wine.
scope: In Greek myth, a woman who took part in the wild rites of Dionysus; not a priestess of a calm temple
  rite and not a goddess.
examples:
- The maenad danced through the night in the god's honour.
- Maenads tore through the woods in the old story.
