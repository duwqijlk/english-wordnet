simpleMeaning: The flap at the top of the windpipe has this thin sheet of springy gristle at its middle.
scope: The middle of the flap at the top of the windpipe is this thin sheet of springy gristle, not the
  whole flap.
examples:
- The epiglottic cartilage gives the flap its springy shape.
- Damage to the epiglottic cartilage can affect the flap at the top of the windpipe.
