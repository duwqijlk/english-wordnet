senseId: 'macrobiotic%3:01:00::'
synsetId: 02995171-a
simpleMeaning: Of or relating to the ideas and way of life that hold that what you eat can keep you well
  and help you live long
scope: Of or relating to the ideas and way of life about food and health, not the food itself and not
  any diet for health.
examples:
- She followed a macrobiotic diet of whole grains and greens.
- The macrobiotic cook wrote books about food and health.
