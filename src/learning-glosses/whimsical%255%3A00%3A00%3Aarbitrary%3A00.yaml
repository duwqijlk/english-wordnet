simpleMeaning: decided by chance or a sudden feeling, not by need or by thinking it through
scope: 'Also called impulsive and capricious: decided by chance or a sudden feeling. Not done because
  it is needed or because of clear thinking.'
examples:
- His whimsical choice of a hat was made on a sudden feeling, with no real reason.
- She made a whimsical decision to leave at once, just because she felt like it.
