simpleMeaning: A disease of the heart and blood tubes in which the wall of an artery (a tube for blood
  from the heart) grows weak and wide like a bag
scope: 'Also called aneurism: a weak, wide place in the wall of an artery, not an artery that is blocked
  and not one that has broken open.'
examples:
- The doctor found an aneurysm in a blood tube in his brain.
- An aneurysm can break open if the wall gets too weak.
