simpleMeaning: to let something touch a strong acid (a liquid that can burn things), or to hurt something
  with that liquid
scope: This is the action of using the strong acid to hurt something, not the acid itself and not bitter,
  angry words used to blame someone.
examples:
- The workers vitrioled the metal sheet, and the acid soon ate into its surface.
- Someone had vitrioled the car's paint, leaving deep marks in it.
