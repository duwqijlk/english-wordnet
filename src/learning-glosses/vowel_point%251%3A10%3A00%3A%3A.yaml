simpleMeaning: A mark put under or near a letter that stands for a consonant, as in Hebrew or Arabic,
  to show the sound said with it.
scope: A mark used in Hebrew or Arabic writing, put under or near a consonant to show the vowel sound
  said with it.
examples:
