simpleMeaning: A person who looks at the signs for mind powers such as moving things by thought, reading
  minds and seeing what is hidden.
scope: A person who studies signs of mind powers, not an ordinary mind doctor and not a person who claims
  the powers.
examples:
- The parapsychologist tested the woman's claim to read minds.
- A parapsychologist spent years on reports of moving objects.
