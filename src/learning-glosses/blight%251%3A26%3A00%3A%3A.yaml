simpleMeaning: the state of being harmed or spoiled by something bad
scope: The state of being harmed or spoiled by something bad, not the act of bringing the harm and not
  a plant disease itself.
examples:
- The blight on the neighbourhood grew worse as more shops closed.
- A blight had fallen on the town after the factory shut.
