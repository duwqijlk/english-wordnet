simpleMeaning: Joining to make the great vein of the brain, two veins in pairs run back near the middle
  of the brain.
scope: Also called internal cerebral vein, two veins in pairs run back near the middle of the brain and
  join to make the great vein of the brain.
examples:
- The vena cerebrum internus runs back near the middle of the brain.
- Each vena cerebrum internus runs back to join the great vein of the brain.
