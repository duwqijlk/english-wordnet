synsetId: 06017497-n
simpleMeaning: A way to find where a set point is, from angles to it from two set points a known distance
  apart, by triangle maths, useful for finding the way.
scope: A way of working out a set point's place from angles and a known distance, using the maths of triangles,
  not a method of surveying land by splitting it into triangles and measuring one side and its angles
  to work out the rest.
examples:
- Triangulation let the sailors fix their position from two headlands.
- They used triangulation to find where the lost marker stood.
