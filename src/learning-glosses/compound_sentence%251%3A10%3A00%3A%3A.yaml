senseId: 'compound_sentence%1:10:00::'
synsetId: 06296753-n
simpleMeaning: a group of words that says a full thought, made of two or more whole parts joined as equals
scope: A group of words with two or more whole parts joined as equals, not a group with only one whole
  part and not a group where one part depends on another.
examples:
- The compound sentence joined two full thoughts with the word and.
- She wrote a compound sentence with two main parts.
