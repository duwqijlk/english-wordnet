simpleMeaning: The tongues of the North American Indian peoples form one group.
scope: A group of tongues of the North American Indian peoples, not one tongue on its own and not a group
  from another part of the world.
examples:
- Na-Dene covers many of the tongues of the North American Indian peoples.
- Scholars group these tongues under the name Na-Dene.
