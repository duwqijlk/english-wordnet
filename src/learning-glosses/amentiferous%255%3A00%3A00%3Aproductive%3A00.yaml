simpleMeaning: of a plant, that grows catkins, the long soft flower spikes that hang down from it
scope: This is said of a plant that grows catkins, with amentaceous as another name for this sense, and
  not a plant with ordinary flowers or a plant with cones.
examples:
- The amentiferous hazel bears its flowers in long catkins.
- An amentiferous willow was easy to spot by its hanging flower spikes.
