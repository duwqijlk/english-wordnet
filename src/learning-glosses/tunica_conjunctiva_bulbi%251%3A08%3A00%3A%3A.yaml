simpleMeaning: The part of the thin clear skin over the eye that covers the front of the white part and
  the thin outer layer of the clear front of the eye.
scope: This is the part of the thin clear skin over the eye that covers the front of the white part, also
  called bulbar conjunctiva and conjunctival layer of bulb; not the white part itself and not the clear
  front window alone.
examples:
- The tunica conjunctiva bulbi covers the front of the eye.
- Doctors check the tunica conjunctiva bulbi for redness.
