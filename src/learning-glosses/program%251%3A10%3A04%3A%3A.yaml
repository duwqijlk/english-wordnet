simpleMeaning: a written statement that sets out what a political party wants to achieve and the basic
  beliefs it stands for
scope: This sense is not a list of acts at a show or a sports event, and not a plan of action for an ordinary
  organization.
examples:
- The party published its program before the election, promising lower taxes and better schools.
- Delegates argued for hours over the program that would guide the party for the next four years.
