simpleMeaning: A long-lived mountain plant from Europe, with leaves covered in whitish soft hairs and
  small flower heads set in stars of shining whitish leaf-like parts.
scope: 'Also called edelweiss: a mountain plant with whitish downy leaves and star-like flower heads,
  not a lowland flower and not a plant with large single blooms.'
examples:
- Leontopodium alpinum grows high in the Alps, its leaves covered in whitish down.
- We found Leontopodium alpinum with small flower heads held in shining stars.
