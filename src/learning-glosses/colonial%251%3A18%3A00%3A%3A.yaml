simpleMeaning: a person who lives in a land that is ruled by another country
scope: A person who lives in a colony; this names a person, not the describing word for things linked
  to a colony, for a whole made of many joined parts, or for animals that live in a group.
examples:
- The colonial was born in the colony and lived there all his life.
- Many colonials worked on farms far from the country that ruled them.
