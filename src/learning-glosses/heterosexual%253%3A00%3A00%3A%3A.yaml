simpleMeaning: feeling a sexual attraction to people of the opposite sex
scope: This describes a person who is sexually drawn to the opposite sex; it is not the noun that names
  such a person, and it is not attraction to the same sex.
examples:
- She is heterosexual and is attracted to men.
- He described himself as heterosexual.
