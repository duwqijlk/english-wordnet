simpleMeaning: looking pale and sickly, as a face does when illness or strong feeling has drained the
  colour from it
scope: 'Also called white or livid: a sickly pale look brought on by illness or strong feeling, not the
  grey of ash and not a healthy glow.'
examples:
- Her face turned ashen when she heard the news.
- The invalid's ashen cheeks worried the nurse.
