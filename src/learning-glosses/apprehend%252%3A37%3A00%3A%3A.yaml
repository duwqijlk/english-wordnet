simpleMeaning: to expect something bad to happen and feel fear or worry about it before it happens
scope: To expect something bad with fear; it is not to catch and arrest a person, and not to understand
  an idea.
examples:
- She apprehended the test results, fearing bad news.
- He apprehended a hard winter ahead and worried all through the autumn.
