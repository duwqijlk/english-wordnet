senseId: 'solidness%1:07:01::'
synsetId: 04678432-n
simpleMeaning: The mark of being firm and sound in purse, in fact, or in soul.
scope: The mark of being firm and sound in purse, in fact, or in soul; also called solidity; not the state
  in which a substance has no bent to flow under fair strain, fights back powers, as squeeze, that would
  bend it, and keeps a set size and shape, nor the body of a firm thing.
examples:
- Their solidness showed at dawn.
- The solidness was plain at noon.
