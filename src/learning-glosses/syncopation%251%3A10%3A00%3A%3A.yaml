simpleMeaning: A music beat pattern stressing a beat that is usually weak.
scope: A music beat pattern stressing a beat that is usually weak; not, in sound lore, the dropping of
  sounds from inside a word, as in 'fo'c'sle' for 'forecastle', nor music, especially dance music, with
  a syncopated beat.
examples:
- Their syncopation drove the tune.
- The syncopation was heard at dawn.
