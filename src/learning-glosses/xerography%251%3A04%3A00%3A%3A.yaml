simpleMeaning: making a picture by shining light on a charged plate with a special coat; the hidden picture
  is then brought out with powders that stick only to the charged parts
scope: Making a picture with light on a charged plate, not a photograph and not a print.
examples:
- Xerography lets the office copy pages without wet ink.
- In xerography, light forms the hidden picture on the charged plate.
