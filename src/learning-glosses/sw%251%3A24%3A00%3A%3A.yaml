simpleMeaning: Halfway round from south toward west sits this compass mark, at 225 degrees.
scope: This is the compass point halfway from south to west, also called southwest, sou'-west, and southwestward,
  not south itself and not west itself.
examples:
- SW is halfway from south to west.
- The wind blew from the SW.
