simpleMeaning: When a muscle shortens or grows long, the force it makes does not go up or down
scope: A muscle tightening with steady pull and changing length, not a muscle tightening with rising pull
  and not a musical scale.
examples:
- Lifting the weight is an isotonic movement of the arm.
- Isotonic work lets the muscle shorten while the pull stays steady.
