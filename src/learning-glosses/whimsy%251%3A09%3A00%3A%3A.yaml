simpleMeaning: a strange, playful idea that comes to mind suddenly, for no clear reason, and may change
  just as fast
scope: 'Also called notion and whim: one strange idea that comes suddenly, not the lasting habit of acting
  in sudden ways no one can guess, and not a careful plan.'
examples:
- He had a whimsy about flying to the moon in a boat he built himself.
- Buying the old bicycle was just a whimsy; he never rode it.
