simpleMeaning: a man given a title at court who lives in ease and idleness, never having fought in battle
scope: A titled man of ease, not a knight who won his title in battle and not a mere rich idler.
examples:
- The carpet knight spent his days at court in fine clothes.
- A carpet knight never drew his sword in war.
