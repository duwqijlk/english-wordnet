simpleMeaning: a deep belief in a god or gods or another unseen power that is thought to control what
  happens to people.
scope: This is not trust in a particular person or thing, and not an organized religion.
examples:
- For many people, faith in a higher power brings comfort in hard times.
- She held a deep faith that God was watching over her family.
