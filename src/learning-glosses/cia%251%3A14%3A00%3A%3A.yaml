simpleMeaning: An independent United States government arm that gathers and links secret news and counter-secret
  work abroad; led by the Director of Central Intelligence, under the President and National Security
  Council.
scope: This is the United States agency for secret work abroad, also called Central Intelligence Agency,
  not the army nor the police.
examples:
- The CIA gathers secret news from abroad.
- She works for the CIA in Washington.
