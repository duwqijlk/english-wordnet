simpleMeaning: With sweet-smelling white flowers or yellow, orange, or peach ones, this flower of the
  far north lives year after year in both halves of the world
scope: It is a flower of the far north that lives year after year, not a flower that lives for one year
  only.
examples:
- The arctic poppy opened its white flowers in the far north.
- Arctic poppy flowers can be white, yellow, orange, or peach.
