senseId: 'leveraging%1:04:00::'
synsetId: 01101851-n
simpleMeaning: using borrowed money to buy things that may rise in value, to try to make gains bigger,
  with the risk of bigger losses
scope: Also called leverage; this is using borrowed money to try to gain more, not using only your own
  money and not a tool used to lift things.
examples:
- Leveraging helped him buy more shares, but it also raised his risk of loss.
- The company used leveraging to grow fast and took on large debts.
