simpleMeaning: In physics, when waves meet, the move of any point is the sum of the moves made by each
  wave on its own.
scope: In physics, this is the rule that the move of a point where waves meet is the sum of the moves
  of each wave; principle of superposition is another name for it; not a rule about single waves alone.
examples:
- Huygens' principle of superposition explains how waves add up when they meet.
- We used Huygens' principle of superposition to work out the height of the combined wave.
