simpleMeaning: a plant of the cabbage family with a thick round yellow root that can be eaten
scope: This is a plant of the cabbage family with a thick yellow root that can be eaten; rutabaga, rutabaga
  plant and turnip cabbage are other names for this sense. Not a turnip and not the root alone.
examples:
- We grow swede in the back garden.
- She peeled a swede for the soup.
