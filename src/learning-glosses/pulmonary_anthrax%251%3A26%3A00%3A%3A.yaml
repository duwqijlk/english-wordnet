simpleMeaning: A lung infection from breathing in dust carrying the bacterium that causes a serious illness
  in animals; chills, cough and breathlessness are followed by a collapse of the circulation.
scope: This is the lung form of anthrax, also called inhalation anthrax or woolsorter's disease, not the
  skin form that begins with a sore.
examples:
- Pulmonary anthrax is the form caused by breathing in contaminated dust.
- The patient died of pulmonary anthrax within days of exposure.
