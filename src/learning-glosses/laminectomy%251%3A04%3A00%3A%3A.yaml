senseId: 'laminectomy%1:04:00::'
synsetId: 00683991-n
simpleMeaning: An operation in which the surgeon takes away the bony arches on one or more bones of the
  spine.
scope: An operation that takes away bony arches from the bones of the spine; not an operation that joins
  the bones, and not one that takes away a whole bone.
examples:
- The surgeon performed a laminectomy to ease pressure on the nerves.
- After the laminectomy, the patient could walk without pain.
