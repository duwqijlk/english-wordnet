simpleMeaning: an early kind of musket, fired by lowering a slow-burning cord into a hole at the back
  to light the powder
scope: An early kind of musket; not a later gun fired by a spark and not a cannon.
examples:
- The matchlock hung above the fireplace.
- Soldiers loaded the matchlock with powder and shot.
