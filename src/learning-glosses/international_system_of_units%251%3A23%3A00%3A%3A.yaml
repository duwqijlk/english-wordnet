simpleMeaning: 'A full set of metric measures for scientists: length in metres, mass in kilograms, time
  in seconds, current in amps, temperature in kelvins, matter in moles, and brightness in candelas.'
scope: 'Also called SI, International System, SI system, SI unit, Systeme International, or Systeme International
  d''Unites: a full set of metric measures for scientists, not the old imperial measures and not a set
  of measures for cooks.'
examples:
- The International System of Units is used by scientists everywhere.
- The lab records lengths in the International System of Units.
