simpleMeaning: this word describes a gun, or the shot it fires, whose inner hole is a little more than
  a fifth of an inch wide
scope: It is also called .22-caliber, .22 caliber, and .22 calibre, and it describes a gun or its shot
  with a bore a little more than a fifth of an inch wide, not one with a wider bore.
examples:
- She held a .22-calibre pistol.
- He bought a .22-calibre rifle.
