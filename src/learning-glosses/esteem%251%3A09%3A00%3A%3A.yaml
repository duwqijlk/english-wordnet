simpleMeaning: holding a person high in your mind for their good qualities and what they have done
scope: 'Also called respect or regard: holding a person high in your mind for their good qualities and
  what they have done, not the feeling of delighted approval and not the state of being honoured by others.'
examples:
- She lost all esteem for him after the scandal.
- He held his teacher in high esteem.
