simpleMeaning: a bitter plant of the cress kind that grows in Europe and America
scope: Also called cuckooflower, lady's smock, or meadow cress, this is a bitter plant of the cress kind
  in Europe and America, not the pink-flowered plant of the same name.
examples:
- We found cuckoo flower growing in the wet meadow and tasted its bitter leaves.
- She picked a cuckoo flower and tasted its bitter leaf.
