simpleMeaning: a pure form of the clear liquid used in drinks and medicines, with no more than one part
  in a hundred of water
scope: This is the pure form of the liquid used in drinks, with almost no water in it; not ordinary drinking
  alcohol and not a medicine on its own.
examples:
- The lab kept a bottle of absolute alcohol on the shelf.
- Absolute alcohol must be stored away from any flame.
