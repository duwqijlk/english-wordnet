simpleMeaning: get things from others, or sell things to them, through energetic and often dishonest dealing
scope: This is getting things from others, or selling things to them, through energetic and often dishonest
  dealing; it is not wandering about with no goal and not making something turn.
examples:
- Someone rolled him for his wallet while he slept on the train.
- The gang rolled tourists for cash outside the station.
