senseId: 'apocarpous%3:00:00::'
synsetId: 00114287-a
simpleMeaning: In buttercups or roses, the seed cases of a flower stay free of one another, each carpel
  on its own.
scope: This word marks seed cases of a flower whose carpels stay free of one another, not joined into
  one case.
examples:
- The buttercup has apocarpous ovaries with carpels that stay free.
- In roses, the apocarpous seed cases hold carpels apart from one another.
