simpleMeaning: Your voice comes out much stronger from this small thing you carry, with a microphone and
  a power box built into it
scope: Also called a bullhorn and a loud hailer, this is a hand-held device that makes a voice carry,
  not a fixed speaker on a wall and not a small radio.
examples:
- The coach spoke through a loud-hailer so the whole team could hear her.
- He picked up the loud-hailer and called the swimmers back to shore.
