simpleMeaning: Bunches of small purple and white flowers grow on this sweet-smelling mint of Europe, now
  at home, above all in the east of North America.
scope: Also called basil balm and mother of thyme, this is a sweet-smelling mint of Europe with small
  purple and white flowers, now at home, above all in the east of North America.
examples:
- The basil thyme smelled sweet.
- Basil thyme now grows in the east of North America.
