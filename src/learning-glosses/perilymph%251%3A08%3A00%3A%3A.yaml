simpleMeaning: Between the hard winding passage of the inner ear and the soft skin-lined passage within
  it lies a gap filled with this watery stuff.
scope: The fluid filling the gap in the inner ear, not the fluid inside the soft inner passage.
examples:
- The perilymph fills the space round the soft inner passage of the ear.
- A knock to the head can stir the perilymph in the inner ear.
