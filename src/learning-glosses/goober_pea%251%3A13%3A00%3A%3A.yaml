simpleMeaning: a case that grows on a vine and holds two nuts or seeds inside it as a rule; in Britain
  it goes by the names groundnut and monkey nut
scope: Also called peanut, goober, earthnut, groundnut, and monkey nut; a pod from a vine, not a single
  nut and not another kind of pod.
examples:
- She shelled a goober pea and ate the two nuts inside.
- The farmer pulled up the vines and gathered the goober peas for market.
