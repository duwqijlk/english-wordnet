simpleMeaning: to make something dirty or leave a mark on it with liquid that is thrown on it
scope: To make something dirty with liquid thrown on it; not the act of throwing liquid as a noun, not
  moving about in liquid, and not a small amount of liquid.
examples:
- He splashed mud all over his clean shirt.
- The truck splashed dirty water onto her shoes.
