simpleMeaning: In astronomy, light from very far-off galaxies moves toward longer waves and the red end;
  most often read as a sign that the universe is growing bigger
scope: Also called redshift; a change in the light from far-off galaxies, not a change in place and not
  a shift in meaning.
examples:
- Astronomers measured the red shift of a far-off galaxy.
- The red shift of its light tells us the galaxy is moving away.
