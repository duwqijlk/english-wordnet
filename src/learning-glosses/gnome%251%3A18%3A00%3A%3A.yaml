simpleMeaning: a creature in old stories that looks like a tiny old man, living deep under the ground
  and keeping watch over buried treasure
scope: 'Also called a dwarf: a creature in old stories that looks like a tiny old man, not a garden figure
  and not a real person.'
examples:
- The gnome guarded the gold buried under the hill.
- In the story, a gnome led the children deep into the earth.
