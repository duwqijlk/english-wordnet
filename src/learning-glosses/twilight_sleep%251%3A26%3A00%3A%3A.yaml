simpleMeaning: A state in which a person given drugs for a whole-body numbness keeps a small share of
  awareness; a shot of scopolamine or morphine can bring it on.
scope: This state leaves a person with a small share of awareness while drugs dull the whole body.
examples:
- Twilight sleep left her half aware.
- A shot of morphine brought on twilight sleep.
