simpleMeaning: A tool that finds the direction of radio signals coming in, by working out their angle.
scope: A tool that works out the angle of radio signals coming in, not a compass and not a radio set itself.
examples:
- The goniometer showed the signal came from the north.
- They used a goniometer to find the direction of the radio signals.
