senseId: 'desiccant%1:27:00::'
synsetId: 14803955-n
simpleMeaning: Keep a thing dry with this substance, which takes in water; calcium oxide, for one, soaks
  up water and takes damp away
scope: Also called a drier, a drying agent, or a siccative; not a substance that adds water to a thing.
examples:
- Put a desiccant in the box to keep the tools dry.
- This desiccant takes in water and keeps the papers dry.
