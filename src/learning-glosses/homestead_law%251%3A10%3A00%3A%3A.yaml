simpleMeaning: People who own and live on a piece of land get extra rights under this rule
scope: A rule giving extra rights to people who own and live on a piece of land; not a rule about renting
  land and not a tax rule.
examples:
- The homestead law protected families who had settled the land.
- Under homestead law, owners kept rights others did not have.
