simpleMeaning: Waves of sound or light build up and swing back and forth in a hollow room whose size makes
  this possible
scope: Also called cavity resonator and resonator, it is a hollow room sized so waves build up inside
  it, not a box of any size and not a thing that makes sound.
examples:
- Sound waves build up inside the resonating chamber.
- The resonating chamber is sized so that light waves swing back and forth.
