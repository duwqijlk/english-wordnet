simpleMeaning: move along by rolling, or as if carried along in a vehicle.
scope: Also called roll, this is travelling along on wheels or in a vehicle, not turning in place and
  not riding a bicycle.
examples:
- The convoy wheeled past the cheering crowd.
- The cart wheeled down the cobbled street, its load swaying.
