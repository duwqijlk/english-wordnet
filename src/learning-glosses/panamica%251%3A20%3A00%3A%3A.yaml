simpleMeaning: Bunches of small green blooms and soft brownish-green toothed leaves mark a low nettle
  of Central and South America that does not sting.
scope: It is also called panamiga and friendship plant, and it is a low nettle of Central and South America
  that does not sting.
examples:
- The panamica grows low in Central America and does not sting.
- Panamica has bunches of small green flowers.
