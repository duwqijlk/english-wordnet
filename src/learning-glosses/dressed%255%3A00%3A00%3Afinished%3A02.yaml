simpleMeaning: 'Of wood or stone: shaped by cutting and made even on the surface.'
scope: About wood or stone cut to a smooth finish, not about being clothed or having a medicated wound;
  the same sense is also called polished.
examples:
- The wall was built from dressed stone.
- Dressed timber sells for more than rough boards.
