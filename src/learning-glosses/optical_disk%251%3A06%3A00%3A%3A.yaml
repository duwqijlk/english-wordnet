simpleMeaning: A beam of light that moves over its face reads this flat round plate, with a plastic coat,
  that keeps computer data as tiny holes cut in it.
scope: 'It is also called optical disc: a flat round plate with a plastic coat, read by a beam of light
  that moves over its face.'
examples:
- The optical disk stored the film as tiny holes in its face.
- A beam of light read the optical disk as it passed over its face.
