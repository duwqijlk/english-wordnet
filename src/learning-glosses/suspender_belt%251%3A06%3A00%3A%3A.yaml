simpleMeaning: A wide band of stretchy material with bands hanging from it, worn by women to hold up their
  stockings.
scope: A wide band of stretchy material with bands hanging from it, worn by women to hold up stockings;
  also called garter belt; not a belt worn to hold up trousers and not a pair of stockings itself.
examples:
- She wore a suspender belt to hold up her stockings.
- The suspender belt had bands hanging down to her stockings.
