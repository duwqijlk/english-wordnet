simpleMeaning: the way parts are put together in space, so each part fits with the others and with the
  whole
scope: 'Also called composition: the way parts fit together in a thing, not the act of writing music or
  a piece of writing itself.'
examples:
- The composing of the painting places the house in the centre, with trees on both sides.
- Good composing means each part of the picture fits with the others and with the whole.
