senseId: 'etymological%3:01:00::'
synsetId: 03033517-a
simpleMeaning: Grounded in or belonging to the study of where words come from and how they change over
  time.
scope: Of a distinction, or an argument, drawn by tracing words back to their roots.
examples:
- Her argument was etymological, tracing the word back to its Latin root.
- The distinction he drew was etymological rather than a matter of present use.
