simpleMeaning: In ethics, the idea that claims about right and wrong can be true or false
scope: In ethics, the idea that claims about right and wrong can be true or false; not the view that such
  claims only show feelings, and not the linguistics sense of describing how people use words.
examples:
- Descriptivism holds that the claim that stealing is wrong can be true or false.
- Under descriptivism, a moral claim is the kind of claim that can be judged true.
