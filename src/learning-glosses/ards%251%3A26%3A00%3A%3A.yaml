simpleMeaning: 'sudden lung damage with coughing and crackling sounds: the lungs swell, stiffen and turn
  fibrous and cannot take in oxygen, after breathing corrosive chemical vapors, ammonia, chlorine or other
  irritants'
scope: 'Also called adult respiratory distress syndrome, wet lung, and white lung: sudden lung damage
  from breathing irritants, not a long-term lung disease and not a common chest cold.'
examples:
- ARDS left him in intensive care for two weeks.
- The doctor said ARDS had damaged her lungs after she breathed in chlorine.
