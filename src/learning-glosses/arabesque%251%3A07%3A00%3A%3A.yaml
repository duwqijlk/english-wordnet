simpleMeaning: A dance pose in which one leg is lifted behind and both arms are stretched out, in the
  set way dancers use.
scope: A dance pose in which one leg is lifted behind and both arms are stretched out, in the set way
  dancers use; not an ornament of woven leaves, made to look like real leaves, in a fine tangled pattern.
examples:
- The dancer held an arabesque, one leg raised behind them.
- They finished the dance in a perfect arabesque.
