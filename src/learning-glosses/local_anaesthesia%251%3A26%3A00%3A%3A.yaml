senseId: 'local_anaesthesia%1:26:00::'
synsetId: 14050686-n
simpleMeaning: Loss of feeling in a small part of the body, as when a numbing drug is put in for taking
  out a tooth
scope: 'Also called local anesthesia: loss of feeling in a small part of the body, not loss of feeling
  in the whole body and not loss of feeling from a knock on the head.'
examples:
- Local anaesthesia kept her mouth numb during the filling.
- The dentist used local anaesthesia for the tooth extraction.
