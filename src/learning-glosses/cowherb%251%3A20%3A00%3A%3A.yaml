simpleMeaning: An annual European plant bearing pale pink blooms, either cultivated in gardens or a self-sown
  weed of grainfields; introduced to North America and sometimes placed among the soapworts.
scope: Another name for cow cockle, the pale-pink European annual of grainfields; not corncockle, a different
  cereal weed.
examples:
- Cowherb appeared as a pink-flowered weed along the field edge.
- The botanist listed cowherb among plants brought from Europe.
