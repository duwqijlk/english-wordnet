simpleMeaning: From the hollow of the middle ear, this blood tube carries blood away and empties it into
  the blood tube behind the jaw.
scope: Vena stylomastoidea is another name for this blood tube, which drains the hollow of the middle
  ear into the blood tube behind the jaw.
examples:
- The stylomastoid vein carries blood out of the hollow of the middle ear.
- Blood from the stylomastoid vein flows into the vessel behind the jaw.
