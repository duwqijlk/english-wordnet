simpleMeaning: The International Monetary Fund holds this store of wealth on top of its gold and its money
  that can be changed, keeping trade between countries steady.
scope: Also called paper gold, it is a store of wealth held by the International Monetary Fund, not gold
  itself.
examples:
- Special drawing rights add to a country's stocks of gold.
- The International Monetary Fund holds special drawing rights to steady trade between countries.
