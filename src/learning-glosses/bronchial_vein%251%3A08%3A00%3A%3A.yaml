simpleMeaning: blood vessels that serve the air tubes of the lungs and drain into the azygos vessel (a
  large blood vessel in the chest)
scope: These are blood vessels that serve the air tubes of the lungs and drain into the azygos vessel;
  vena bronchialis is another name for them, not an artery of the lungs and not a vein of the arm.
examples:
- The bronchial vein drains blood from the air tubes.
- Blood from the bronchial vein flows into the azygos vessel.
