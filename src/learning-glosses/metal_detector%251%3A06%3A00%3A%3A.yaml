simpleMeaning: When the stuff coins are made of is near, this tool gives a sign; food passes by it to
  catch stray bits, and it finds what lies buried.
scope: Among tools that give a sign, this one looks only for the stuff coins are made of, whether stray
  bits in food or what lies buried.
examples:
- The metal detector gave a sign when it passed over the buried coins.
- They ran the food past a metal detector to catch stray bits.
