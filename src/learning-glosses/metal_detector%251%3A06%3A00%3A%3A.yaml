simpleMeaning: A detector that signals when metal is present, used to find stray metal bits in food products
  or buried metal.
scope: This tool signals only for metal, whether stray bits in food or metal buried in the ground.
examples:
- The metal detector gave a sign when it passed over the buried coins.
- They ran the food past a metal detector to catch stray bits.
