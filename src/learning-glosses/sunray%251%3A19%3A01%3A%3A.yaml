simpleMeaning: a beam of ultraviolet light, a kind of light that cannot be seen, made by a lamp
scope: This is a beam of man-made ultraviolet light from a lamp, also called a sun-ray, not a beam of
  light from the real sun, not the lamp itself, and not the desert plant of the same name.
examples:
- The nurse turned on the sunray for the skin treatment.
- He sat under the sunray for a few minutes each day.
