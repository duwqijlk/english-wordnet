simpleMeaning: Words that slip past a question by a clever trick, so it goes unanswered
scope: This is a statement that slips past a question by cleverness or trickery, also called dodge or
  scheme, not failing to do a duty and not merely staying away from a thing.
examples:
- His dodging in the interview answered nothing.
- The dodging in her reply left the question open.
