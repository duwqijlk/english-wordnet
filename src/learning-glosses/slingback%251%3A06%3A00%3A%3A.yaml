simpleMeaning: a shoe with a strap that goes around the back of the heel
scope: Another name for this is sling. It is a shoe with a strap around the heel, not a shoe with a closed
  back and not a strap that holds up an arm.
examples:
- She wore red slingbacks with her dress.
- His new slingback slipped off his heel as he walked.
