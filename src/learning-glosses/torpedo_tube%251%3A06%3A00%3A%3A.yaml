simpleMeaning: a pipe near the water's edge on a ship, through which a long weapon that moves under water
  is shot out
scope: A pipe near the water's edge on a ship for firing a long weapon that moves under water. Not a gun
  on the deck and not the weapon itself.
examples:
- The torpedo tube opened just above the waterline.
- The crew loaded a torpedo tube before the drill.
