simpleMeaning: The study of how the body and brain give rise to thought and other workings of the mind.
scope: This is the study of how the body and brain give rise to thought and other workings of the mind;
  not the study of the mind alone and not the study of the brain's cells alone.
examples:
- Cognitive neuroscience asks how thought grows out of the brain.
- She works in cognitive neuroscience, linking mind and brain.
