simpleMeaning: A wide bay where the shore bends inward, making a hollow in the coast.
scope: A wide bay where the shore bends inward, making a hollow in the coast, not the loose middle part
  of a slack rope, not a bend or curve, especially one in a coastline, and not the verb use for fastening
  with a bight.
examples:
- The Bight of Benin is a wide bay on the west coast of Africa.
- Ships sheltered in the bight during the storm.
