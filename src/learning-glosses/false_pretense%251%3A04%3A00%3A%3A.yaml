simpleMeaning: In law, getting another person's goods by telling them lies on purpose.
scope: False pretence is another name for this crime, which needs both a lie told on purpose and goods
  taken because of it.
examples:
- He was charged with false pretense after taking money with a fake letter.
- The false pretense cost the old woman her savings.
