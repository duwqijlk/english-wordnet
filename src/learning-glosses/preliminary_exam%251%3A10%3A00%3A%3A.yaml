simpleMeaning: A test that students doing higher study take to show they are good enough to go on.
scope: 'Another name for a prelim and a preliminary examination: a test for students doing higher study,
  to show they are good enough to go on; not a school test for children.'
examples:
- She passed her preliminary exam in the spring.
- The preliminary exam decides who can go on to write a thesis.
