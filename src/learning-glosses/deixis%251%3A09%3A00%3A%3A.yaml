synsetId: 06189701-n
simpleMeaning: how words point to and pick out people, places, or times as seen by someone taking part
  in speech or writing, with their sense resting on the setting
scope: The way meaning shifts with the speaker and the setting, not a word that points, and not a fixed
  meaning.
examples:
- Deixis is at work when 'now' means a different time each day.
- The deixis of 'you' changes with who is being spoken to.
