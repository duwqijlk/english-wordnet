simpleMeaning: a tight pressing together that makes a space narrow
scope: A tight pressing together that makes a space narrow, not a wide opening and not a loose hold on
  something.
examples:
- The constriction of the blood vessel slowed the flow of blood.
- A constriction in the pipe stopped the water from moving.
