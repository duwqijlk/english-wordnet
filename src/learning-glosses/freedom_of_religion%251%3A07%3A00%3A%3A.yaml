simpleMeaning: Showing their faith in teaching, practice, belief and observance, a person or a group is
  backed by a civil right safe under the First Amendment to the US Constitution.
scope: This is the right to show one's faith in teaching, practice, belief and observance, not the right
  to meet in peace, which is freedom of assembly.
examples:
- Her freedom of religion let her teach her faith to her children.
- The group kept its freedom of religion to teach and practise its faith.
