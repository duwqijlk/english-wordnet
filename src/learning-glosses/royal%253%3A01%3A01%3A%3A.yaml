simpleMeaning: Set up or officially approved by a king, queen, or other ruler.
scope: This sense is not about things that merely belong to or represent a monarch, but about organizations
  or rights officially set up or approved by one.
examples:
- The university was founded by royal charter in 1837.
- The town's market still operates under a royal charter.
