simpleMeaning: a former British unit of length of 6,080 feet (1,853.184 meters), 800 feet longer than
  the usual land unit
scope: 'Also called mile: the former British unit of 6,080 feet, not the navigation unit of 1,852 meters
  and not the usual 1,760-yard land unit.'
examples:
- The old British chart marked the harbour ten mi away.
- On old British charts, each mi stood for 6,080 feet.
