simpleMeaning: A money promise sold below face value, paying no added cash, and open for resale for 91
  days
scope: Also called a Treasury bill; a promise to pay that earns no extra money, unlike a bond that pays
  interest.
examples:
- She bought a T-bill at a discount and held it for 91 days.
- A T-bill pays no interest, so buyers pay less than its face value.
