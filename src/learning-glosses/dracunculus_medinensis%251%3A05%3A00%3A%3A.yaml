simpleMeaning: A round worm that lives as a parasite in India and Africa, in the belly or under the skin
  of people and other animals with backbones
scope: A parasitic worm, not a harmless gut worm and not a skin insect; also called Guinea worm.
examples:
- The Dracunculus medinensis lives under the skin of its host.
- Doctors in India treat people who carry Dracunculus medinensis.
