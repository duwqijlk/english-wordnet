simpleMeaning: A person keeps forgetting the things they must do, or pays no heed to them
scope: This is the habit of forgetting or ignoring what you must do; heedlessness and inadvertency are
  other names for this sense, not a one-off slip.
examples:
- His inadvertence cost him his job when he forgot the deadline.
- Her inadvertence about the bills led to late fees.
