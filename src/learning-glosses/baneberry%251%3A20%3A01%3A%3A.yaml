simpleMeaning: A plant of the group Actaea with sharp-tasting poisonous small round fruit
scope: A plant of the group Actaea with sharp-tasting poisonous fruit, not a plant with fruit safe to
  eat and not a plant without fruit; cohosh is another name for it.
examples:
- The baneberry grew in the shady woods.
- Children were warned not to eat baneberry fruit.
