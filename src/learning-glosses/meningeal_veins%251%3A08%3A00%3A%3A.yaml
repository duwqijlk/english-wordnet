simpleMeaning: Beside the arteries of the thin skins that wrap the brain and spinal cord run blood vessels
  that carry blood back
scope: Blood vessels that run beside the arteries of the thin skins around the brain and spinal cord,
  not the arteries themselves and not veins elsewhere in the body.
examples:
- The meningeal veins run alongside the meningeal arteries.
- During the operation, the surgeon avoided the meningeal veins.
