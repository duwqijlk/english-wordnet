simpleMeaning: calm and in control of your feelings, and not upset, especially when things are hard or
  worrying
scope: Calm and in control of your feelings, especially under stress; not made up of parts, and not written
  or created, as a song or a piece of writing is.
examples:
- She stayed composed while she waited for the test results.
- He took a deep breath and tried to look composed.
