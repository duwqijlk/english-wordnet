simpleMeaning: This chemical takes heat in while it breaks down and gives heat out while it forms
scope: This chemical takes heat in as it breaks down and gives heat out as it forms, not a burning fuel
  and not a chemical that stays cold.
examples:
- The exotherm gave off heat as it formed in the flask.
- Scientists studied the exotherm to see how much heat it took in as it broke down.
