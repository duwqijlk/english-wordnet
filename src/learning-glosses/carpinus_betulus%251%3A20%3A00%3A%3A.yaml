simpleMeaning: A tree of middle size from the Old World, with smooth grey bark; its leaves look like those
  of a beech and turn yellow-orange in autumn.
scope: 'Also called European hornbeam: a mid-sized tree of the Old World with smooth grey bark, whose
  leaves look like beech leaves and turn yellow-orange in autumn, not a true beech.'
examples:
- Carpinus betulus grows in the Old World and has smooth grey bark.
- In autumn the leaves of Carpinus betulus turn yellow-orange.
