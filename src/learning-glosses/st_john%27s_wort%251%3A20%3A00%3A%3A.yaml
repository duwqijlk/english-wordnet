simpleMeaning: Any of many plants of the genus Hypericum with yellow flowers and leaves dotted with clear
  spots, long gathered on Midsummer Eve to keep away evil.
scope: Any of many yellow-flowered plants of the genus Hypericum with dotted leaves, gathered at Midsummer
  to keep away evil; the common St John's wort names one single kind, while this sense covers any of the
  many kinds in the genus.
examples:
- St John's wort grows along the roadside with its yellow flowers.
- She picked St John's wort on Midsummer Eve, as people long have done.
