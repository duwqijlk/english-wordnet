simpleMeaning: A big motor craft for fun on the water, with a room to sleep in, pipes for water, and all
  that is needed to live on board
scope: Also called a cruiser, a cabin cruiser, or a pleasure craft, this is a big motor craft for fun
  on the water with room to live on board, not a small rowing boat and not a ship for carrying goods.
examples:
- They spent the weekend on their pleasure boat, sleeping in the cabin and cooking on board.
- We hired a pleasure boat for a week on the river.
