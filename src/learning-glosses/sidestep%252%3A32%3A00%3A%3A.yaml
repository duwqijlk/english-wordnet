schema: oewn-learning-gloss-v2
senseId: 'sidestep%2:32:00::'
synsetId: 00811316-v
simpleMeaning: To keep away from doing a duty, answering a question, or dealing with a problem, or to
  try to keep away from it
scope: This is keeping away from a duty, a question, or a problem; duck, skirt, hedge, dodge, parry, elude,
  evade, and fudge are other names for this sense, not stepping to one side with your feet.
examples:
- He tried to sidestep the question about the missing money.
- She sidestepped her duties by saying she was too busy.
