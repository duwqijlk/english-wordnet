simpleMeaning: a thin pepper that gets narrow at the end and has a very hot, strong sharp taste
scope: Also called chilly, chili and chile. This is the hot pepper itself, not a dish made with peppers
  and meat.
examples:
- She grew a chilli plant on her kitchen window.
- Too much chilli in the dish made his mouth burn.
