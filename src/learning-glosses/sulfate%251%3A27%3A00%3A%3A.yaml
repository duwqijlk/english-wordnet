simpleMeaning: a substance of a kind made from sulphuric acid (a strong acid), either as a salt or as
  an ester
scope: This is a substance made from a strong acid, not the act of changing something into such a substance.
examples:
- The powder is a sulfate used in the factory process.
- The soil test showed a sulfate that came from the strong acid.
