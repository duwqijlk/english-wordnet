simpleMeaning: Help for someone who cannot look after themselves, whether through a disability or for
  another reason, which can cover washing, cooking, and the needs of the body.
scope: This is help with washing, cooking, and the needs of the body for someone who cannot look after
  themselves.
examples:
- They need personal care because they cannot wash or cook for themselves.
- The personal care they get covers washing, cooking, and the needs of the body.
