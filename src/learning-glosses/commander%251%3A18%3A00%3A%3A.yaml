simpleMeaning: An officer in the armed forces who is in charge of a group of soldiers.
scope: An officer in charge of a military group, not a navy rank and not any person in a post of power.
examples:
- The commander ordered the unit to move at dawn.
- Every commander knew the men under his charge.
