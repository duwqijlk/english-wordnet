simpleMeaning: A hard, tough wood comes from this Pacific coast tree, whose sweet-smelling leaves and
  small flowers in round clusters are followed by fruit like olives.
scope: Also called mountain laurel, pepperwood and spice tree, it is a Pacific coast tree with sweet-smelling
  leaves and fruit like olives.
examples:
- The sassafras laurel grew along the Pacific coast.
- The sassafras laurel bore fruit like olives.
