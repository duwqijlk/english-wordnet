simpleMeaning: In psychiatry, a way the mind guards itself by refusing to face painful thoughts
scope: In psychiatry, the mind's refusal to face painful thoughts, not a defendant's plea in court.
examples:
- His denial kept him from facing the loss.
- The patient lived in denial about her illness.
