simpleMeaning: a person whose job is to study works of art and explain what they mean and how good they
  are
scope: A person who studies works of art for a living, not just anyone who gives a judgment and not a
  person who only finds fault.
examples:
- The art critic studied the painting for a long time before writing about it.
- A film critic wrote about the movie in the morning paper.
