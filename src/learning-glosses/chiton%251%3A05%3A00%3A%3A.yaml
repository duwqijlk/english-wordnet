simpleMeaning: a simple long sea mollusk (a soft sea animal with a hard covering), with a body the same
  on both sides and eight hard plates on top
scope: 'Also called a coat-of-mail shell, a polyplacophore, and a sea cradle: this is the sea animal,
  not the woolen tunic worn in ancient Greece.'
examples:
- A chiton clung to the wet rock by the sea.
- The chiton's eight hard plates bent a little as it moved.
