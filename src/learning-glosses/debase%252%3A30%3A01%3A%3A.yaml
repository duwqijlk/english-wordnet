simpleMeaning: to make something less pure by adding in a worse or foreign thing, often by taking out
  good ingredients and putting poor ones in their place
scope: Also called stretch, load, dilute and adulterate; it is about making a thing less pure, not about
  making a person act in a bad way.
examples:
- Some sellers debased the olive oil by adding a cheaper oil.
- He debased the wine by replacing some of it with water.
