simpleMeaning: a thing that is part of what makes a system what it is, and that decides or limits how
  well the system works
scope: This sense is a thing that is part of what makes a system what it is and that decides or limits
  how well it works; it is not the number that describes a whole group in statistics, and not the fixed
  number in a maths equation that can be changed to give similar curves.
examples:
- The engineers changed one parameter to see how the system would work.
- Heat is an important parameter in this chemical process.
