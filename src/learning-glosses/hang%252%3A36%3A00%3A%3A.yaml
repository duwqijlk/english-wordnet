simpleMeaning: to decorate or furnish a place with objects held up off the ground
scope: This is putting up things such as wallpaper or pictures to decorate a place, not suspending meat
  to age it or holding an object in the air.
examples:
- We plan to hang new wallpaper in the hallway.
- She hung a painting above the fireplace.
