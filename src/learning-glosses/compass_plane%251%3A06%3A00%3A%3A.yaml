simpleMeaning: a tool for smoothing wood with a bendy base that can smooth hollows or rounded tops
scope: A wood-smoothing tool with a bendy base for hollows and rounded tops, also called circular plane;
  not a flat smoothing tool and not a saw.
examples:
- He used the compass plane to smooth the curved chair leg.
- The compass plane followed the hollow of the bowl.
