simpleMeaning: The group of Kamarupan languages used in western Burma and Bangladesh and in the far east
  of India.
scope: The group of Kamarupan languages of western Burma, Bangladesh and far eastern India, also called
  Chin, Chin language, Kuki, Kuki-Chin language and Kuki language; its near kin are other Kamarupan language
  groups.
