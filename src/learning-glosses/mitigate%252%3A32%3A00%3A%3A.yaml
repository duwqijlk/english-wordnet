simpleMeaning: to make a bad thing less serious or less wide-reaching, or to try to do so
scope: To make a bad thing less serious or less wide-reaching, not to get rid of it altogether.
examples:
- New rules helped mitigate the harm done by the spill.
- The judge said his youth could mitigate the sentence.
