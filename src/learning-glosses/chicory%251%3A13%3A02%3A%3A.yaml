simpleMeaning: Root of the plant it is named for, roasted and ground to stand in for, or thin, coffee.
scope: Root of the plant it is named for, roasted and ground to stand in for, or thin, coffee; also called
  chicory root; not a lasting Old World herb with rayed flower heads of blue florets, grown for its root
  and its heads of crisp eatable leaves used in salads, nor crisp, spiky leaves with a somewhat bitter
  taste, nor the dried root of the plant it is named for, used as a coffee stand-in.
examples:
- Their chicory filled the cup.
- The chicory was brewed at dawn.
