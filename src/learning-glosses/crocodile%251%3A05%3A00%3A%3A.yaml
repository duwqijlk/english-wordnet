simpleMeaning: a big, predatory water reptile with a long snout, powerful jaws, sharp teeth and bony plates
  on its body, living in slow tropical waters
scope: A big tropical water reptile with a long snout, strong jaws and bony plates; not an alligator,
  which has a broad rounded snout, or a caiman.
examples:
- A crocodile lay still in the muddy water.
- Crocodiles have powerful jaws and sharp teeth.
