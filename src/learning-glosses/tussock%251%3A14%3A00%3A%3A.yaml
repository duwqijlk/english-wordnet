simpleMeaning: a bunch of hair or feathers, or of grass that is growing
scope: 'Also called tuft: a bunch of hair or feathers, or of grass that is growing, not a single hair
  or feather and not a large area of grass.'
examples:
- A tussock of grass grew by the path.
- The bird's head had a small tussock of feathers.
