simpleMeaning: Skin turns redder than usual when the tiny blood tubes under it widen, as after too much
  sun or when the skin is sore.
scope: This is skin turning redder than usual because the tiny blood tubes under it widen.
examples:
- Erythema showed on her skin after too much sun.
- His skin showed erythema where it was sore.
