simpleMeaning: A hard case that covers the outside of certain animals such as crabs, other arthropods
  and turtles.
scope: Another name for a shell, carapace or cuticle, not a piece of armour or a protective structure.
examples:
- A crab's shield hardens as the animal grows.
- The turtle's shield was thick and covered in algae.
