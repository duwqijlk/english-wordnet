simpleMeaning: A joining metal mix with copper in it that melts only at a fairly high heat and is used
  to join metal parts by heat.
scope: This is a joining metal mix with copper in it that melts only at a fairly high heat, not a soft
  joining mix.
examples:
- The worker used hard solder to join the pipes.
- Hard solder needs a hot flame.
