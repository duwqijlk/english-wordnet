simpleMeaning: Most often in the lower back, this sore tear in the tough pad between the bones of the
  spine brings pain.
scope: Also called a herniated disc or a ruptured intervertebral disc, it is a sore tear in the pad between
  the bones of the spine, most often in the lower back.
examples:
- A slipped disc tore the tough pad between the bones of her spine.
- His slipped disc hurt most in the lower back.
