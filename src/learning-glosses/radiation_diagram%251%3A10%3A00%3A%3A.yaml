simpleMeaning: a chart of how strong an antenna's signal is in each direction, drawn with round or square
  grids that map strength against angle
scope: This chart of an antenna's signal strength is also called a pattern and a radiation pattern; it
  is not a map of the antenna itself.
examples:
- The radiation diagram shows the signal is strongest to the north.
- Engineers drew a radiation diagram for the new antenna.
