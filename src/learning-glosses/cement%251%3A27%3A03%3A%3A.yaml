simpleMeaning: a hard flat surface made of concrete, sometimes called by the name of the powder used to
  make it
scope: Hard flat ground made of concrete that people sometimes call by the powder's name, not the powder
  itself and not the stuff a dentist puts in a tooth.
examples:
- They stood on the grey cement beside the pool.
- Children drew with chalk on the cement outside the school.
