simpleMeaning: Small white flowers most often mark this low plant, which mostly lives on year after year
  and is good for rock gardens and the like.
scope: This low plant mostly lives on year after year, most often with small white flowers, and is good
  for rock gardens and the like, not the loosely matted plant with moss-like leaves of the same name.
examples:
- At the edge of the rock garden, sandwort grew.
- Small white flowers opened on the sandwort.
