simpleMeaning: A calming medicine used to ease worry and to lower strain and short temper.
scope: A calming medicine that eases worry; antianxiety drug, anxiolytic, minor tranquilizer, minor tranquilliser
  and minor tranquillizer are other names for it, and it is not a medicine for pain and not a medicine
  that puts a person to sleep.
examples:
- The doctor gave her an anxiolytic drug to calm her nerves.
- He takes an anxiolytic drug when his worry grows too strong.
