senseId: diestrous%5:00:00:anestrous:00
synsetId: 02145843-s
simpleMeaning: Describes an animal with several mating times in one breeding season, now in a time with
  no mating
scope: This word describes an animal with several mating times in one breeding season, now in a time with
  no mating; diestrual, dioestrous and dioestrual are other names for it, not an animal in its mating
  time and not an animal with only one mating time in a season.
examples:
- The ewe was diestrous between her cycles.
- A diestrous doe showed no interest in the buck.
