scope: A perching animal with feathers and wings and a voice box made for singing; oscine is another name
  for this sense, not an animal that cannot sing and not a hunting animal with hooked claws.
examples:
- The oscine bird sang from the top of the tree.
- An oscine bird learns its song from older birds.
