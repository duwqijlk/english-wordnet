simpleMeaning: A church member, not a priest, whom the bishop allows to say aloud parts of the service
  in an Anglican or Episcopal church
scope: This is a church member given leave by the bishop to take part in reading the service aloud; not
  an ordained priest, and not simply any person sitting in the church.
examples:
- The lay reader read the lesson from the front of the church.
- Our lay reader will read the prayers at Sunday's service.
