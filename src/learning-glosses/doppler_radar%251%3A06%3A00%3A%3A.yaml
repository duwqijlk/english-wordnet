senseId: 'doppler_radar%1:06:00::'
synsetId: 03229193-n
simpleMeaning: A device that uses radio waves to tell how fast a thing moves, from the change in the waves
  as it comes near or moves away.
scope: A device that uses radio waves to tell how fast a thing moves, not a device that only tells where
  a thing is.
examples:
- Doppler radar showed the storm moving fast towards the coast.
- The police use Doppler radar to check the speed of cars.
