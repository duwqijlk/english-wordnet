simpleMeaning: A build-up of blood in the space between the lungs and the walls of the chest
scope: This is a build-up of blood in the space between the lungs and the walls of the chest, also called
  haemothorax, and not blood inside the lung or air in the chest space.
examples:
- The crash caused a hemothorax on his left side.
- Doctors drained the hemothorax from her chest.
