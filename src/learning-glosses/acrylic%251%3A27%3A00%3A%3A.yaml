simpleMeaning: a clear plastic like glass that gets soft when it is heated; it can be poured into a shape,
  or used in thin coverings and in glues
scope: 'Also called acrylate resin and acrylic resin: this is the clear hard material itself, not the
  cloth sense of the same word and not the sense that names it by the chemical it is made from.'
examples:
- The sign is made of clear acrylic and looks like glass.
- She bought a small box made from acrylic to keep her rings in.
