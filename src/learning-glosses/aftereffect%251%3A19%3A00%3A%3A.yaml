senseId: 'aftereffect%1:19:00::'
synsetId: 11431615-n
simpleMeaning: any result that comes after the thing that caused it, with some time between the two
scope: This is a result that appears some time after its cause. It is not the cause itself, and it is
  not a result that happens at once.
examples:
- A headache is a common aftereffect of the illness.
- The aftereffects of the flood lasted for months.
