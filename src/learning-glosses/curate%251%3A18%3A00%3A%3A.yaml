simpleMeaning: a church leader who is allowed to lead worship and services
scope: This is a church leader allowed to lead worship, and minister, parson and pastor are other names
  for it, not a person who looks after a museum.
examples:
- The curate led the Sunday service while the vicar was away.
- She spoke to the curate after the wedding.
