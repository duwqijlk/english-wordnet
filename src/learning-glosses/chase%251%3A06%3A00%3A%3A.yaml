simpleMeaning: In letterpress printing (printing with set letters), a metal frame with four straight sides
  that holds pages or columns of set type together for printing at one time
scope: A metal frame used in printing; not the act of running after someone to catch them, and not going
  after someone you love or want.
examples:
- The printer locked the set type inside the chase before printing.
- Each chase held together a full page of type ready to be printed.
