senseId: autumnal%5:00:00:mature:02
synsetId: 01495274-s
simpleMeaning: typical of a person or thing in the late stage of being fully grown, close to the start
  of getting weaker
scope: This describes a person or thing in a late, fully grown stage, close to starting to get weaker.
  It is not the sense that means of, like, or happening in autumn.
examples:
- In his autumnal years, the writer worked slowly and looked back on his long life.
- In her autumnal years, the old queen was still calm and wise, but her strength was slowly leaving her.
