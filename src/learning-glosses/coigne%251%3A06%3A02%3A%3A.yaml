senseId: 'coigne%1:06:02::'
synsetId: 04042480-n
simpleMeaning: a wedge of wood or metal that can be made wider, used by printers to keep a set of type
  fixed in its frame
scope: A wedge that can be made wider, used by printers to keep type fixed; coign and quoin are other
  names for this sense; not a wedge for splitting wood.
examples:
- The coigne held the type firm in the frame.
- She tapped the coigne to tighten the form.
