simpleMeaning: In biology, a group of living things of the same kind that are different in small, unimportant
  ways from other like groups
scope: 'Also called form and strain: in biology, a group of living things that differ in small ways; not
  a random amount, and not the adjective sense meaning showing change.'
examples:
- Scientists found a variant of the frog that has lighter skin.
- This variant of the bacteria grows faster than the others.
