simpleMeaning: Its wide lower petal is brown and soft like cloth, on a flower whose outer parts are yellow,
  green, or pink, on a plant that flowers in spring.
scope: It is a spring-flowering plant with a brown velvety lip, not other orchids that flower later in
  the year.
examples:
- The early spider orchid opened its first flower in March.
- We found an early spider orchid on the chalk hill.
