simpleMeaning: a plant that lives for many years, with blue-purple flowers, brought to the east of the
  United States from elsewhere
scope: A long-lived plant with blue-purple flowers brought to the eastern United States, not a plant that
  grows there by nature and not a flower that lives for one year only.
examples:
- Field scabious grows along the roadside in summer.
- The field scabious in the meadow had pale blue-purple flowers.
