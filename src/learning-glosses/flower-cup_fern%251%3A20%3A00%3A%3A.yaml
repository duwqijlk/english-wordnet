simpleMeaning: A slender fern of northern North America whose glossy chestnut-brown stalks carry fronds
  divided twice, with spore clusters along the edges that are usually separate.
scope: This sense names a slender fern of northern North America, with chestnut-brown stalks and twice-divided
  fronds. Despite the word flower in its name it bears spores, not flowers, and the term is botanical
  rather than everyday.
examples:
- Flower-cup fern grows among rocks in the northern woods.
- The flower-cup fern's dark stalks stood out against the pale rock.
