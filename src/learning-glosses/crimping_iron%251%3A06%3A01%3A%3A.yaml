simpleMeaning: A tool that runs on power and makes hair wavy by pressing it, often in a zigzag shape
scope: A powered tool that presses hair into waves, also called a hair crimper; not a brush and not a
  tool for straightening hair.
examples:
- She used a crimping iron to give her hair waves.
- The crimping iron heated up in a few seconds.
