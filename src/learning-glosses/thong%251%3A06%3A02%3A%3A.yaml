simpleMeaning: A shoe with no back, kept on the foot by a strap between the big toe and the next toe
scope: A backless shoe held by a strap between the toes; not a leather strip for lashing and not the whip's
  strip.
examples:
- She slipped on her thongs and walked to the beach.
- His thong broke between the toes on the way home.
