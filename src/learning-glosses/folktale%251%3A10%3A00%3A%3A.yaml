simpleMeaning: a story passed from person to person by speaking, among ordinary people
scope: An old story told and retold by ordinary people; not a story written down by one known writer,
  and not a true account of real events.
examples:
- My grandmother told us a folktale about a clever fox.
- In this folktale, a poor farmer outwits a rich king.
