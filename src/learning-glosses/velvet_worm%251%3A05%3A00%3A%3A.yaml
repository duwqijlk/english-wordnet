simpleMeaning: Any of many soft-skinned worm-like meat-eating beasts, common in hot forests, with marks
  of both joint-legged beasts and ringed worms.
scope: This sense is also called onychophoran and peripatus.
examples:
- A velvet worm crawled in the forest.
- Velvet worms eat meat.
