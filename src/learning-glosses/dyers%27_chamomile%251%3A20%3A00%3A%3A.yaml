simpleMeaning: With hairy leaves split into parts and yellow flowers, this herb of Europe and Asia lives
  for years and is now at home in North America.
scope: People also call it golden marguerite and yellow chamomile; the names mark a herb of Europe and
  Asia with hairy leaves split into parts and yellow flowers that now grows wild in North America.
examples:
- The dyers' chamomile has hairy leaves and yellow flowers.
- Dyers' chamomile is now at home in North America.
