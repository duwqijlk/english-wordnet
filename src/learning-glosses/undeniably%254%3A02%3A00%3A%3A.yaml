senseId: 'undeniably%4:02:00::'
synsetId: 00488100-r
simpleMeaning: in a way that is clearly true and that no one can say is not true
scope: This says something is so clearly true that no one can say it is not true; it is not just a word
  for very or strongly.
examples:
- She is undeniably the most gifted student in the class.
- The plan was undeniably a success, and everyone could see it.
