simpleMeaning: a half-solid fat from the seeds of a palm tree, used in cooking and in making soap
scope: A half-solid fat from the seeds of a palm tree, used in cooking and in making soap; cohune fat
  and cohune oil are other names for this, not a liquid cooking fat and not a fat from an animal.
examples:
- Cohune-nut oil is used in cooking.
- Soap makers use cohune-nut oil.
