simpleMeaning: A harmful white, crystal-like acid from benzene that dissolves in water, used in works
  and to kill germs and keep wounds clean, deadly if drunk.
scope: This sense is also called carbolic acid, hydroxybenzene, oxybenzene and phenylic acid, for a harmful
  white, crystal-like acid from benzene that dissolves in water, used in works and to kill germs and keep
  wounds clean, deadly if drunk, unlike the sense for any of a set of weakly acid, carbon-based compounds,
  each with one or more hydroxyl groups.
examples:
- Phenol kills germs.
- Phenol is deadly if drunk.
