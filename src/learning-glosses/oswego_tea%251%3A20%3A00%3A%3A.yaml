simpleMeaning: a sweet-smelling plant from eastern North America that lives for many years and bears tube-shaped
  flowers of many colours in thick showy heads
scope: 'Also called bee balm, beebalm, and bergamot mint: a sweet-smelling plant with tube-shaped flowers
  in showy heads, not a tea made from dried leaves for drinking.'
examples:
- Oswego tea grew in a bright patch at the edge of the garden.
- Bees crowded round the oswego tea when its red flowers opened.
