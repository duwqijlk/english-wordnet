simpleMeaning: Many kinds of amphibian live both in water and on land, with no tail, a thick body, and
  long back legs made for jumping.
scope: Also called frog, toad, anuran, batrachian, and salientian, it is one of many kinds of tailless
  animal that lives both in water and on land.
examples:
- A toad frog leapt into the water.
- Toad frogs jump far on their long back legs.
