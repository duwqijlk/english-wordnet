simpleMeaning: The 'ch' in 'chair' and the 'j' in 'joy' are sounds of this kind, in which a stop and a
  hiss are made together at one place.
scope: Also called affricate and affricative, this sound puts a stop and a hiss together at one place;
  it is not a stop on its own and not a hiss on its own.
examples:
- An affricate consonant like the 'ch' in 'chair' starts with a stop and ends with a hiss.
- Teachers point out the affricate consonant at the start of 'chair' and 'joy'.
