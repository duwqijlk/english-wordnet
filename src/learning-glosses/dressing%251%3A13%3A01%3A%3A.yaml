simpleMeaning: 'a tasty sauce put on salad, of two main kinds: a thin kind made with oil and vinegar,
  or a thick kind made like mayonnaise'
scope: This is sauce for salad, not the stuff put inside meat, not a cloth over a wound, and not the act
  of putting on clothes.
examples:
- She poured dressing over the green salad.
- This dressing is too thick for the lettuce.
