simpleMeaning: It describes colors, especially red, orange and yellow, that seem to give off a feeling
  of heat.
scope: This describes the feeling a color creates, not the temperature of an object or a friendly manner.
examples:
- The room was painted in warm shades of orange and gold.
- Designers often use warm colors to make a space feel cozier.
