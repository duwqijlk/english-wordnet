simpleMeaning: A round of swelling and squeezing in a perfect heat machine that can run backwards and
  does work without losing heat.
scope: 'Also called Carnot''s ideal cycle: a round of swelling and squeezing in a perfect heat machine
  that can run backwards and does work without losing heat, not a round in a real machine that loses heat.'
examples:
- The Carnot cycle shows the most work a heat machine can do.
- Engineers use the Carnot cycle as a model.
