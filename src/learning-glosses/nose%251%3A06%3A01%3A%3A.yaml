simpleMeaning: A spout is a tube that sticks out and lets liquid or gas flow out.
scope: This is a projecting spout through which liquid or gas flows out, not the facial body part and
  not the front of an aircraft or tool.
examples:
- Steam whistled from the nose of the kettle.
- She tilted the oil can until its nose was over the hinge.
