simpleMeaning: able to react in some way when something acts on it
scope: Not the sense of reacting too strongly, nor being easily annoyed; this is simply being able to
  react at all.
examples:
- The irritable tissue responded when it was touched.
- An irritable cell reacts when a signal reaches it.
