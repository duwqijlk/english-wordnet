simpleMeaning: a coil of wire in which electric pressure is made when the coil moves through a magnetic
  field (the area around a magnet where its pull or push acts)
scope: This is the coil of wire where electric pressure is made by movement through a magnetic field;
  not a frame and not an outer covering.
examples:
- Electric pressure is made in the armature when its coil moves through a magnetic field.
- The worker checked the wire coil of the armature for breaks.
