simpleMeaning: 'In chaos theory, a complex system can turn a tiny local change into huge effects far away:
  a butterfly flapping in Rio might change Chicago''s weather.'
scope: The chaos-theory principle that tiny changes can have large distant effects; not the insect butterfly
  or the literal flapping of its wings.
examples:
- A small delay at one port can have a butterfly effect on supply chains worldwide.
- The butterfly effect makes long-range weather forecasts unreliable.
