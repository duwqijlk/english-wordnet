simpleMeaning: Its acorns grow long, thin, and pointed on this tall graceful oak of California, whose
  tough leathery leaves fall away each year.
scope: Also called a valley oak and a roble, this tall graceful oak of California bears tough leathery
  leaves and acorns that are long, thin, and pointed, dropping its leaves each year.
examples:
- The valley white oak sheds its leaves each year.
- Tough leaves and pointed acorns covered the valley white oak.
