simpleMeaning: a term printed at the top of a page in a dictionary or other book of facts to show the
  first or last entry on that page
scope: 'Also called guide word or guideword: a term at the top of a page in a dictionary or other book
  of facts that shows the first or last entry on that page, not a word in the main text and not a slogan
  used to win support.'
examples:
- The catchword at the top of the page told her she had reached the entries starting with M.
- He looked at the catchword to see whether the word he wanted was on that page.
