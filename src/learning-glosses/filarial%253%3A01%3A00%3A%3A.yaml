simpleMeaning: Describes something to do with the worms that live inside the body and cause sickness,
  or that spread those worms, above all one kind of those worms.
scope: Describes something to do with the worms that live inside the body and cause sickness, or that
  spread those worms, above all one kind of those worms; not a sickness from germs and not a bite from
  an insect.
examples:
- The doctor found a filarial infection in the man's leg.
- Filarial worms can block the flow of fluid in the body.
