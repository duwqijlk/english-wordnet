simpleMeaning: The inner curve of the stomach and the lower part of the food pipe get their blood from
  this tube, which comes off the main artery of the belly.
scope: 'Also called arteria gastrica sinistra: a blood tube that feeds the inner curve of the stomach.'
examples:
- The left gastric artery feeds the inner curve of the stomach.
- Blood reached the lower food pipe through the left gastric artery.
