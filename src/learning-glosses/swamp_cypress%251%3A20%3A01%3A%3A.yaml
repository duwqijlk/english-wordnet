simpleMeaning: In low wet ground by the sea and in river ground that floods stands a widespread cypress
  tree of the southeast United States, its trunk wide at its foot.
scope: Also called bald cypress, pond bald cypress, and southern cypress, this is the tree itself, not
  the wood cut from it.
examples:
- A swamp cypress grew where the river ground floods.
- The swamp cypress stood in low wet ground by the sea.
