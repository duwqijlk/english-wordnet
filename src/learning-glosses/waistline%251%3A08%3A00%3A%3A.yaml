simpleMeaning: the part of the body that is narrow between the ribs and the hips
scope: 'Also called waist: this is the narrow part of the body between the ribs and hips, not a line or
  size on clothes.'
examples:
- Her waistline is narrow, and the belt fits her well.
- Exercise made his waistline smaller over the winter.
