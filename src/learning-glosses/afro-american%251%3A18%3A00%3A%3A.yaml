simpleMeaning: People born in Africa are the ancestors of this person from the United States
scope: 'Also called African American and Black American: an American whose family goes back to people
  born in Africa, not an American whose family came from elsewhere, and not the word used to describe
  things of such Americans.'
examples:
- He is an Afro-American whose grandparents were born in Africa.
- Many Afro-Americans trace their families back to Africa.
