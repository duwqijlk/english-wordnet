simpleMeaning: In law, what a jury says about truth questions put to it, which can be used to shape a
  ruling.
scope: In law, what a jury says about truth questions put to it, which can be used to shape a ruling;
  also called verdict, not the judge's own ruling and not a guess.
examples:
- The finding of fact settled who had signed the paper.
- The judge used the finding of fact to shape the ruling.
