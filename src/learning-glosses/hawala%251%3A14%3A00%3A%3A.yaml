simpleMeaning: A hidden money system based on trust, in which money is made ready in another country without
  cash moving or a record being kept.
scope: A trust-based way to make money ready abroad, not a bank transfer and not a payment made by post.
examples:
- He sent money home through hawala, and his family picked it up the same day.
- The hawala dealer took the cash and promised it would be ready abroad by morning.
