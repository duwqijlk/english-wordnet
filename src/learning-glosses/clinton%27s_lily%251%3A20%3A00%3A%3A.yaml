simpleMeaning: Any mild-climate plant with wide leaves at the base and white, yellowish or purplish flowers
  followed by blue or black berries.
scope: 'Also called clintonia: any mild-climate plant of the genus Clintonia with broad basal leaves,
  not a tall tree and not a plant with a single flower.'
examples:
- Clinton's lily grows in the shade, its broad leaves flat on the ground.
- The Clinton's lily bore white flowers, then blue berries.
