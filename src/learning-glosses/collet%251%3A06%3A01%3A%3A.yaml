simpleMeaning: a metal ring or cover put round a wooden stick to stop it from splitting
scope: This is a metal ring or cover put round a wooden stick to stop it from splitting, also called a
  ferrule; not a tool for holding work in a lathe, and not a ring worn on a finger.
examples:
- He fitted a collet to the end of the walking stick.
- The collet on the pole keeps the wood from splitting.
