simpleMeaning: A middle-sized fir tree of the north-east of North America, whose leaves give off a sweet
  woody smell when crushed, much used for wood for paper and for Christmas trees.
scope: A middle-sized fir tree of the north-east of North America, whose leaves give off a sweet woody
  smell when crushed; balsam fir, Abies balsamea and balm of Gilead are other names for this sense, not
  the sticky tree sap of the same name.
examples:
- The Canada balsam in the yard is a middle-sized fir.
- Canada balsam leaves smell sweet when crushed.
