simpleMeaning: To work for a law to be passed by swapping political favours, such as trading votes.
scope: This is working for a law to be passed by swapping political favours, not simply asking lawmakers
  for help and not paying them for votes.
examples:
- The two parties agreed to logroll the road bill through.
- They logrolled each other's bills to get them passed.
