simpleMeaning: A drug taken by mouth that kills germs, used for serious bacterial infections of the skin,
  the breathing passages, the urinary tract, the bones, or the joints.
scope: Also called ciprofloxacin; a drug taken by mouth for serious bacterial infections of the skin,
  breathing passages, urinary tract, bones, or joints.
examples:
- The doctor gave her Cipro for the infection.
- Cipro cleared up his urinary tract infection.
