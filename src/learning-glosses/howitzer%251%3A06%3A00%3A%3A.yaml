simpleMeaning: A gun that fires shells high into the air over a short range, loaded from the front, with
  a short barrel set at a high angle.
scope: Also called a mortar or trench mortar; a front-loading gun that fires shells high over a short
  range, not a long gun that fires straight ahead.
examples:
- The howitzer fired shells high over the hill.
- A howitzer stood on the ridge, its short barrel raised.
