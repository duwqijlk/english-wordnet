simpleMeaning: A Hindu holiday of the sun that starts the new astrological year, when the sun moves into
  the star group Aries
scope: This is a Hindu holiday of the sun at the start of the new astrological year, when the sun enters
  the star group Aries; the day is set by where the sun stands among the stars, which is what makes it
  a sun holiday and gives it its place at the year's start.
examples:
- Mesasamkranti falls at the start of the new astrological year.
- On Mesasamkranti, the sun enters the constellation Aries.
