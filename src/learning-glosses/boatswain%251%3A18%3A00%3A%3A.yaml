simpleMeaning: A low-ranking officer on a trading ship who runs the work of the other sailors.
scope: Also called a bosun; a low-ranking officer on a trading ship, not the captain and not an ordinary
  sailor.
examples:
- The boatswain called the crew to mend the sails.
- Our boatswain told the sailors where to stow the ropes.
