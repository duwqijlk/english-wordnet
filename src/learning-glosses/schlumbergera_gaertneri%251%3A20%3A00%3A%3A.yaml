simpleMeaning: A South American cactus that blooms in spring, with long joints and coral-red flowers;
  sometimes put in the genus that shares its name
scope: Also called Easter cactus and Hatiora gaertneri; a spring-flowering South American cactus with
  long joints, not the Thanksgiving cactus often grown indoors as a house plant.
examples:
- The Schlumbergera gaertneri on the windowsill opened its coral-red flowers in spring.
- We water Schlumbergera gaertneri lightly while it is in bloom.
