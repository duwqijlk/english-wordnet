simpleMeaning: to do something badly so that it is ruined or destroyed
scope: 'Also called blow, fumble, spoil, fluff, bumble, botch, muff, bobble, mishandle and flub: to ruin
  something by doing it badly, not the other sense of spoiling something by acting in a clumsy, foolish
  way.'
examples:
- He bungled the repair, and the machine never worked again.
- She bungled the cake and had to throw it away.
