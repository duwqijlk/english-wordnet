simpleMeaning: able to rot and go bad, so that it spoils and smells bad
scope: This is a thing that can rot and go bad, with putrefiable and putrescible as other names for this
  sense, and not a thing that stays fresh for a long time or one that has already rotted away.
examples:
- Fresh milk is decayable, so it must be kept cold.
- The decayable fruit went bad after a few days in the heat.
