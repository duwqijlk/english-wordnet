simpleMeaning: the movement made when something moves up and down again and again, as a wing or a flag
  does
scope: This names the movement of going up and down itself, not the wing, flag or other thing that moves.
examples:
- The flapping of the bird's wings grew slower as it landed.
- We watched the flapping of the flags in the strong wind.
