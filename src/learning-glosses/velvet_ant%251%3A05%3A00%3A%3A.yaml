simpleMeaning: Bright soft hair covers this lone wasp of the Mutillidae family, whose females have no
  wings.
scope: This is a lone wasp of the Mutillidae family whose females have no wings and whose body wears a
  coat of brightly coloured soft hair, so it is a wasp and not an ant.
examples:
- A velvet ant crossed the path.
- The female velvet ant has no wings.
