simpleMeaning: In British informal use, holding someone close in your arms and kissing them
scope: A British informal word for holding someone close and kissing them; not just a quick kiss on its
  own and not just holding with no kiss.
examples:
- The young pair were snogging on a bench in the park.
- They spent the evening snogging at the back of the cinema.
