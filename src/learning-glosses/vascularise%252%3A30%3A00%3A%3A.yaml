simpleMeaning: To give a part of the body tubes that carry blood through it.
scope: To give a part of the body tubes that carry blood, with vascularize as another name for this sense;
  not the change of becoming full of blood tubes on its own, a different sense of the same word.
examples:
- The yolk sac is gradually vascularised.
- The new tissue will vascularise as it grows.
