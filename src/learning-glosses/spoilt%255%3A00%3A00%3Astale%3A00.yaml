simpleMeaning: food that has gone bad, so that it can no longer be eaten or used
scope: This is food that has gone bad and can no longer be eaten or used; bad and spoiled are other names
  for this sense, and it is not food kept too long but still safe or a person harmed by too much care.
examples:
- The spoilt meat had to be thrown away.
- A refrigerator full of spoilt food stood in the kitchen.
