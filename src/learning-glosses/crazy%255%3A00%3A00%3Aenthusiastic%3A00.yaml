simpleMeaning: Extremely keen about something, or so focused on it that you think of little else.
scope: Not mentally ill, and not wildly foolish or impractical.
examples:
- He's crazy about old motorcycles and spends every weekend restoring one.
- The kids are crazy for that new game and talk about nothing else.
