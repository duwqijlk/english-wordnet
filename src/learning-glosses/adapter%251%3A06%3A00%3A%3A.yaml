simpleMeaning: a device that lets you use a thing in a way it was not made for, or that joins two pieces
  of equipment so they can work together
scope: 'Also called adaptor: this is a device for joining or using equipment, not a person who changes
  music for different voices or instruments.'
examples:
- I used an adapter to plug my phone into the car.
- This adapter lets the old printer work with the new computer.
