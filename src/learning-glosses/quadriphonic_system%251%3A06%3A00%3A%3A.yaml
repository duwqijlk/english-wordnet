simpleMeaning: Four separate paths carry the sound when a recording is made or played back, and the sound
  comes from more than one speaker
scope: 'Also called quadraphonic system and quadraphony: sound sent through four separate paths, not sound
  through one or two paths.'
examples:
- The quadriphonic system in the hall played the concert through four speakers.
- He bought a quadriphonic system so the film sound would come from all sides.
