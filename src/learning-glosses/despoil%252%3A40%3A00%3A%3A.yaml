schema: oewn-learning-gloss-v2
senseId: 'despoil%2:40:00::'
synsetId: 02349564-v
simpleMeaning: to steal things from a place and keep them as goods won by force
scope: 'Also called strip, rifle, plunder, loot, ransack, pillage, foray, and reave: to steal things and
  keep them as goods won by force. It is not the sense of wrecking a place and taking away everything
  it has.'
examples:
- During the riot, people despoiled the empty shops and carried the goods home.
- Soldiers despoiled the village, taking food and gold as spoils of war.
