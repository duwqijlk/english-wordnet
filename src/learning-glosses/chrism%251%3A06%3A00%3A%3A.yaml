simpleMeaning: A holy oil, a mix of oil and sweet-smelling tree sap, blessed for use in church
scope: A holy oil, a mix of oil and sweet-smelling tree sap, blessed for use in church; chrisom and holy
  oil are other names for this sense, not plain oil for cooking and not a scent for the body.
examples:
- The priest used chrism to anoint the child.
- Chrism is blessed oil used in church.
