senseId: 'hem%1:10:00::'
synsetId: 07141229-n
simpleMeaning: a sound made like clearing the throat, used to get attention, show you are not sure, fill
  a pause, hide feeling embarrassed, warn a friend, and so on
scope: This is the sound itself, not the edge of a piece of cloth, not sewing that edge, and not the act
  of making the sound.
examples:
- His small hem made everyone in the room look up.
- She gave a quiet hem before she started to speak.
