simpleMeaning: When one number is big, the other is big too, and small goes with small; the number that
  measures this runs from 0 to +1
scope: 'Also called direct correlation: when one number is big, the other is big too, and when one is
  small, the other is small, not a link where one grows as the other falls.'
examples:
- The positive correlation between study time and marks was clear in the data.
- 'They found a positive correlation: taller people tended to weigh more.'
