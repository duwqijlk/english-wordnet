simpleMeaning: having the nature of songs or tunes, like them, or with them playing at the same time
scope: Of songs or tunes, like them, or with them playing; not only a pleasant tune, not a play or film,
  and not skilled in making tunes.
examples:
- His musical laugh sounded almost like a tune.
- The room felt musical, with a piano playing softly in the corner.
