simpleMeaning: A way of making food that brings together foods, ways of making food, and tastes from more
  than one kind of food tradition
scope: This is a way of making food that brings together foods, ways and tastes from more than one food
  tradition; not one single food tradition and not fast food.
examples:
- Fusion cooking mixes tastes from more than one food tradition.
- The chef likes fusion cooking because it joins foods from many places.
