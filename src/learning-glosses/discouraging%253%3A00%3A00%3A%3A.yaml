simpleMeaning: taking away a person's confidence, hope and strong interest, and so often stopping them
  from acting
scope: This describes something that takes away a person's confidence, hope and strong interest and so
  often stops them from acting, not words of disapproval meant to talk someone out of something.
examples:
- The team heard discouraging news about their chances of winning.
- His discouraging words made the young players lose hope.
