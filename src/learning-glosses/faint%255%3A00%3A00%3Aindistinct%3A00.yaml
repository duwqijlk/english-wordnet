simpleMeaning: difficult to make out, with no clear outline or detail
scope: About shapes, outlines or memories that are dim or blurred, not ideas grasped only faintly, not
  a faint light or sound that is merely weak, and not a blackout; dim, vague, shadowy and wispy are other
  names.
examples:
- A faint outline of the coast appeared through the haze.
- Figures in the mist looked faint and shapeless.
