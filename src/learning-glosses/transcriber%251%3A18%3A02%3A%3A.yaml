simpleMeaning: a person who makes music and changes a piece of music so it can be played or sung by other
  voices or instruments, or in another way
scope: This is a person who rewrites a piece of music for other voices, instruments, or a different style;
  adapter and arranger are other names for this sense, not a person who writes down spoken words or one
  who makes a new piece.
examples:
- The transcriber rewrote the song so a choir could sing it.
- Our transcriber changed the piano piece for a small group of strings.
