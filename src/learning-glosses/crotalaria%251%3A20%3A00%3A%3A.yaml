senseId: 'crotalaria%1:20:00::'
synsetId: 12540068-n
simpleMeaning: Grown to feed farm animals and to feed the soil, any of several plants with swollen pods
  holding seeds that rattle when shaken.
scope: Also called rattlebox; a plant whose seeds rattle in swollen pods, not a pea whose seeds sit still
  in flat pods.
examples:
- The farmer sowed crotalaria to feed the soil.
- We shook a crotalaria pod and heard the seeds rattle.
