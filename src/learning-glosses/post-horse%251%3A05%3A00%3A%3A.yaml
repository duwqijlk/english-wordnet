simpleMeaning: Kept at an inn or a place where animals are changed, this animal is for mail carriers to
  use or for travelers to hire
scope: 'Also called poster and post horse: a horse kept at an inn for mail carriers to use or for travelers
  to hire, not a horse kept for riding for fun and not a horse that carries the mail itself.'
examples:
- The post-horse was ready at the inn for the next mail carrier.
- Travelers hired a post-horse to take them to the next town.
