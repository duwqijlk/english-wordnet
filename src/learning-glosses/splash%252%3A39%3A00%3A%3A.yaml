simpleMeaning: to make the sound that water makes when it hits something or falls
scope: To make a sound like water hitting or falling. It is not to hit and move about in water, and not
  a small amount of liquid.
examples:
- Water was splashing on the floor.
- The rain splashed against the window all night.
