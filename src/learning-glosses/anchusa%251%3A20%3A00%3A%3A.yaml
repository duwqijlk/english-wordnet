simpleMeaning: Flowers shaped like trumpets grow in bunches all on one side of these Old World herbs,
  any of several kinds.
scope: These are herbs of the Old World with bunches of trumpet-shaped flowers all on one side, any of
  several kinds, not herbs with flowers all round the stem.
examples:
- The anchusa bore trumpet-shaped flowers all on one side.
- Anchusa grows as a herb of the Old World.
