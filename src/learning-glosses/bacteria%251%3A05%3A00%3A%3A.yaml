simpleMeaning: One-celled or noncellular life forms, round, spiral or rod-shaped, without chlorophyll,
  that split to reproduce. Some cause disease, some useful in chemistry; hard to classify, often treated
  as plants.
scope: 'The plural: many such organisms together, not one of them and not a virus.'
examples:
- Some bacteria in the soil break down dead leaves.
- The lab found bacteria in the water sample.
