scope: This is the casual, unrestrained sexual sense, not something that poses no difficulty, not relaxed
  or unhurried, not free from worry, not comfortable or pleasing, not having little impact, not a gentle
  slope, not easily tricked, not moderately rich, not money got with little effort or unlawfully, not
  less in demand, not lenient with rules, and not the adverb uses.
examples:
- The novel describes her as an easy woman who ignores the rules of her time.
