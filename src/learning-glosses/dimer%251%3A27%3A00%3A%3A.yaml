simpleMeaning: A chemical whose tiny parts are made of two matching pieces joined together.
scope: A chemical built from two matching pieces, not one built from a single piece and not one built
  from many different pieces.
examples:
- Two matching pieces join to form a dimer.
- The dimer breaks into two same pieces when heated.
