simpleMeaning: a person who gathers information and puts it together, for example in a book that people
  use to look things up
scope: A person who gathers information and puts it together; not the computer program with the same name
  that turns written code into a form a machine can use.
examples:
- The compiler of the dictionary spent years gathering words and their meanings.
- As the compiler of the guide, she checked facts from many different sources.
