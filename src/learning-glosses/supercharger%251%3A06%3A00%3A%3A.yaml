simpleMeaning: A device that pushes more oxygen into the tubes of an engine that burns fuel
scope: This pushes more oxygen into an engine that burns fuel; it is not a pump that moves fuel and not
  a part of the exhaust.
examples:
- The supercharger gave the old engine much more power.
- He fitted a supercharger to the race car to make it faster.
