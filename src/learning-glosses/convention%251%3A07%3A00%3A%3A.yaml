simpleMeaning: the set of accepted beliefs that comes from doing things the usual way
scope: The set of accepted beliefs that comes from doing things the usual way, not a meeting of people
  and not one single custom.
examples:
- The painter broke with convention and used bright, wild colours.
- By convention, the eldest child inherits the house.
