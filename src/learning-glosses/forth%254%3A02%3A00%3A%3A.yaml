simpleMeaning: A word no longer used, meaning away from a particular thing, place or position.
scope: The old 'away from a place' sense, shared with the words 'away' and 'off', not the 'forward in
  time' or 'out into view' meanings.
examples:
- Go forth and preach.
- They rode forth from the castle at sunrise.
