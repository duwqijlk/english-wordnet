simpleMeaning: of a bird or animal, having on its head a small bunch of hair or feathers, or a part sticking
  out, usually to look good; often used with another word
scope: 'Also called crested: this is about a bird or animal with a bunch or a raised part on its head.
  It is not the sense about a plant growing in small thick groups.'
examples:
- The tufted duck has a small bunch of feathers on its head.
- A tufted bird sat on the branch, with its head feathers clear to see.
