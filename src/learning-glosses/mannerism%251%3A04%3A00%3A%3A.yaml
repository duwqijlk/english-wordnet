simpleMeaning: a false or too-big show that a person makes on purpose
scope: 'Also called pose and affectation: a false show made on purpose, not a person''s own small habit
  or way of behaving that makes them different from others.'
examples:
- His grand mannerism at the party was only a show to impress people.
- She dropped the mannerism and spoke in a simple, honest way.
