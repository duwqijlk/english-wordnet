simpleMeaning: a liquid or other substance taken from a poisonous plant and used as a medicine
scope: This is the medicine made from the plant, not the poisonous plant itself.
examples:
- The doctor gave her a small amount of belladonna to help with the pain.
- Belladonna was once used in medicine, but it must be used with great care because the plant is poisonous.
