simpleMeaning: an office that watches over the intelligence work of Treasury offices and bureaus and joins
  the Intelligence Community to officials who make international money policy
scope: A Treasury office for intelligence links; Office of Intelligence Support is another name for this
  sense; not the Treasury itself and not the Intelligence Community.
examples:
- The OIS shares reports between the Treasury and the Intelligence Community.
- Officials at the OIS watch over intelligence work in Treasury bureaus.
