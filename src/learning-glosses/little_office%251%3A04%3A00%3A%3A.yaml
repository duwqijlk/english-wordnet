simpleMeaning: In the Roman Catholic Church, a set of prayers in honour of the Virgin Mary, like the daily
  round of prayers but shorter.
scope: A short set of Roman Catholic prayers for the Virgin Mary, not the longer Divine Office and not
  a Mass.
examples:
- The nuns said the Little Office each morning.
- The Little Office takes less time than the Divine Office.
