simpleMeaning: A thorny tropical American tree with yellow flower clusters at branch ends, followed by
  curved or coiled edible pods; it gives good timber, a yellow dye and a sticky gum.
scope: Also called camachile, huamachil, manila tamarind and wild tamarind; a thorny tree with edible
  pods, not a tamarind tree and not a thorn bush.
examples:
- Pithecellobium dulce grows in tropical America.
- The pods of Pithecellobium dulce are edible.
