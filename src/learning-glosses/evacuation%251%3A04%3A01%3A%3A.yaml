simpleMeaning: the act of leaving a place in a calm, planned way, above all to stay safe
scope: The act of leaving a place in a calm, planned way, above all to stay safe, not a hurried flight
  and not a move to a new home.
examples:
- The evacuation of the town took three hours.
- During the evacuation, buses carried people to safety.
