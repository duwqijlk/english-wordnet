simpleMeaning: So rude or nasty that people feel sick and want to keep away from it.
scope: Also called wicked, foul, disgusting, revolting, distasteful, loathsome, repellent, yucky, skanky,
  or repellant, this is a thing so rude or nasty that people feel sick and want to keep away from it.
examples:
- The repelling smell from the drain made them shut the door.
- His manners at the table were repelling, and no one wanted to sit near him.
