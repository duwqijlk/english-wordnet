simpleMeaning: Most often, passing waste grows hard after a person has held back the need to pass it for
  a long time.
scope: It is the hard passing of waste that most often follows holding back the need for a long time.
examples:
- His dyschezia came from holding back the need to pass waste for a long time.
- Her dyschezia made passing waste hard after she held back the need for a long time.
