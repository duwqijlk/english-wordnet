simpleMeaning: A glass block with a right angle that turns an upside-down picture the right way up
scope: A glass block that turns an upside-down picture the right way up; not a flat mirror, and not a
  lens that bends light to a point.
examples:
- The erecting prism in the telescope set the image upright.
- An erecting prism turns the upside-down picture the right way up.
