simpleMeaning: Area as the space inside a shape with four equal sides, each a hundredth of a metre long;
  a hundredth of a metre is 0.3937 inch.
scope: A measure of area, the space inside a shape with four equal sides of one hundredth of a metre;
  square centimetre is another name for it, not a measure of length.
examples:
- One square centimeter is the space inside a shape with four equal sides of one centimeter.
- They measured the leaf as twelve square centimeters.
