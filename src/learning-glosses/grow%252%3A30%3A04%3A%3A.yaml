simpleMeaning: To change over time until fully developed, as a child does on the way to adulthood.
scope: A living thing becoming fully adult over time; not a farmer raising crops, not simply getting larger,
  and not passing into a new condition.
examples:
- The puppies grew quickly and were fully adult by twelve months.
- She grew up on a farm in Yorkshire.
