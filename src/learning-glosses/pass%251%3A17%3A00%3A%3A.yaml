simpleMeaning: a low point in a mountain range, a gap in the land that sits below the peaks around it.
scope: This is not a ticket or a permit to enter, nor the act of moving past something; it is a low place
  between mountains.
examples:
- The road climbs through a narrow pass before dropping into the valley.
- Snow had closed the mountain pass, so the trucks took the long way round.
