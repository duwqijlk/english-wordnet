simpleMeaning: One thing in particular sets off a far too strong reaction in the body, most of all an
  allergy
scope: Also called allergic, hypersensitive, hypersensitised, and sensitized; a strong reaction to one
  thing in particular, not a passing dislike and not a weak body in general.
examples:
- The hypersensitized patient reacted badly to the smallest dose.
- He had become hypersensitized to the drug after the first course.
