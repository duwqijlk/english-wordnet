simpleMeaning: An American living in the North, a name used most of all in the years of the American Civil
  War.
scope: This is an American of the North, most of all in the Civil War years, not a person of the North
  in general nor a Southerner.
examples:
- He was a Northerner who fought for the Union.
- Northerners in the war years backed the North.
