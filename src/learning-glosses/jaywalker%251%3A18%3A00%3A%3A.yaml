simpleMeaning: A person who walks across a road without care, where the law says they must not cross
scope: A person who crosses a road without care and against the law; not a person who crosses at a marked
  crossing and not a driver.
examples:
- The jaywalker dashed across the busy road between the cars.
- Police warned the jaywalker not to cross there again.
