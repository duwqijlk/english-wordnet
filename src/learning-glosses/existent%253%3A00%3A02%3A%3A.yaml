simpleMeaning: being or happening in fact, proved to be there, and not imagined
scope: Also called real. This sense means proved to be real and not imagined, not just being there in
  general and not just being there now instead of only possible.
examples:
- No existent cure was known at that time.
- The report lists only existent buildings in the town.
