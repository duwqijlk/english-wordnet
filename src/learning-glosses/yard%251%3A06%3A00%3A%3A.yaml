simpleMeaning: a pen in which chickens, cattle or other farm animals are kept.
scope: This is the pen for chickens or livestock, not the land around a house or the enclosed ground used
  for particular activities.
examples:
- The hens were scratching around in the yard behind the barn.
- He led the goats into the yard and shut the gate.
