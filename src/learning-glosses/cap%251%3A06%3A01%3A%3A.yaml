simpleMeaning: the top part of a column that holds up the flat part (the entablature) that lies across
  the tops of columns
scope: 'Also called capital: the top part of a column, not a tight covering for the head, not the top
  of a mushroom, and not a small explosive.'
examples:
- The cap at the top of the column is carved with leaves.
- Workers lifted the heavy stone cap onto the top of the column.
