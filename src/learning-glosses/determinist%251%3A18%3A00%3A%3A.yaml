schema: oewn-learning-gloss-v2
senseId: 'determinist%1:18:00::'
synsetId: 10100277-n
simpleMeaning: a person who accepts the belief that they have no power to change what will happen to them
scope: This is a person who accepts that what will happen to them is fixed and cannot be changed; fatalist,
  predestinarian and predestinationist are other names for this sense, not a person who believes they
  can shape their own future.
examples:
- The determinist said there was no point in fighting what fate had planned.
- As a determinist, she believed her choices could not change the course of her life.
