simpleMeaning: In Africa, people think this woody plant shows where the land is good for health
scope: A woody plant in Africa thought to show where the land is good for health, not a plant whose leaves
  or bark are used to treat fever and not a tall, fast-growing plant whose leaves hold a healing oil.
examples:
- The guide pointed to a fever tree and said the land there was good for health.
- The old fever tree was said to mark a place where people stayed well.
