simpleMeaning: Having the hinged covers over the windows pulled shut.
scope: A building or window with its shutter panels pulled shut; not simply a place that is not open for
  business, not an entrance blocked against entry, and not a mouth or eye that is shut.
examples:
- The villa stayed closed all summer, its green shutters bolted against the heat.
- The closed shutters kept the afternoon sun out of the room.
