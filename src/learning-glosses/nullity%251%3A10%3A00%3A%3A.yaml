senseId: 'nullity%1:10:00::'
synsetId: 06544754-n
simpleMeaning: A thing that counts for nothing, especially a law or order that has no force in law.
scope: A thing with no force at all, especially a law that does not stand in law; not a thing that is
  merely empty or missing.
examples:
- The court declared the old decree a nullity.
- Without the seal, the contract was a nullity.
