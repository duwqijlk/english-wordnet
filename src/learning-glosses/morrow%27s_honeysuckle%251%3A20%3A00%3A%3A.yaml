simpleMeaning: A grey honeysuckle shrub that loses its leaves each year, with white flowers in pairs that
  turn yellow; from Japan
scope: Also called Lonicera morrowii; a grey shrub with paired white flowers turning yellow, not a shrub
  with red flowers and not a shrub that keeps its leaves.
examples:
- Morrow's honeysuckle bears white flowers that turn yellow.
- The Morrow's honeysuckle in the garden came from Japan.
