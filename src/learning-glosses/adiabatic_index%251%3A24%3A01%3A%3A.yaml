simpleMeaning: the number got by dividing how much heat is taken in at steady pressure (C_P) by how much
  is taken in at steady volume (C_V)
scope: It is also called the heat capacity ratio, and it is the number got by dividing how much heat is
  taken in at steady pressure by how much is taken in at steady volume.
examples:
- The book gave the adiabatic index of argon.
- For argon, the adiabatic index found by test matched the number worked out in theory.
