simpleMeaning: a child at a school where pupils can sleep, who eats at school but sleeps at home
scope: A schoolchild who eats at school but sleeps at home, not a full boarder who sleeps at school too
  and not a child at a school where no one sleeps.
examples:
- The day boarder eats lunch with her friends at school.
- As a day boarder, he goes home every evening after classes.
