simpleMeaning: To dodge a duty, a question, or a problem, or try to dodge it, instead of facing it
scope: Also called duck, skirt, hedge, dodge, parry, elude, evade and sidestep, this sense means avoiding
  a duty, question, or problem; not to make the sweet called fudge and not to cheat.
examples:
- He fudged the issue when the reporter pressed him.
- Do not fudge the question; give a straight answer.
