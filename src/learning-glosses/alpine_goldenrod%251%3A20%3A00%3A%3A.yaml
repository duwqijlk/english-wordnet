simpleMeaning: A goldenrod like narrow goldenrod, but with bristly hairs on the edges of its leaf stalks,
  of the mountains of western America.
scope: Of the mountain goldenrods of western America, told from narrow goldenrod by bristly hairs on the
  leaf stalks.
examples:
- Alpine goldenrod grows in the mountains.
- Alpine goldenrod has bristly leaf stalks.
