simpleMeaning: A creature with a backbone and no jaws, long and thin like an eel, with no paired limbs,
  one of the cyclostomes or a kind that has died out.
scope: Also called agnathan and jawless fish, it is a creature with a backbone, shaped like an eel, that
  has no jaws or paired limbs.
examples:
- A jawless vertebrate has a backbone but no jaws.
- The jawless vertebrate is long and thin, like an eel.
