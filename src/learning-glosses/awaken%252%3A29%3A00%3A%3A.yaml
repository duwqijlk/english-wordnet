simpleMeaning: to make someone stop sleeping, or to bring someone back to knowing what is around them
scope: This is making another person stop sleeping or become aware of what is around them again; not stopping
  sleeping yourself, and not the start of a new feeling in someone.
examples:
- The loud bell awakened everyone in the house.
- Please awaken me at six tomorrow morning.
