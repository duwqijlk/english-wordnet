simpleMeaning: A drug that makes the body pass more water, sold as Microzide, Esidrix, and HydroDIURIL,
  used to treat high blood pressure.
scope: A drug that makes the body pass more water, used to treat high blood pressure, not a beta blocker
  and not a laxative.
examples:
- The doctor gave her hydrochlorothiazide for her blood pressure.
- Hydrochlorothiazide can make you pass water more often.
