simpleMeaning: The church council of 1962-1965 that gave up the Latin service used everywhere and took
  up the idea that all Christians are one, and made other changes.
scope: This is the church council of 1962-1965 that gave up the Latin service used everywhere and took
  up the idea that all Christians are one, also called the Second Vatican Council; other church councils
  made different changes.
examples:
- Vatican II gave up the Latin service used everywhere.
- Vatican II met in 1962-1965.
