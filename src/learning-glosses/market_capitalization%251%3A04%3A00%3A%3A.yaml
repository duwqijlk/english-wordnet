simpleMeaning: A rough guess at the worth of a firm, worked out by multiplying the number of shares still
  in people's hands by the price of one share now
scope: A rough guess at the worth of a firm worked out from its shares, also called market capitalisation;
  not the worth of its buildings and not its yearly sales.
examples:
- The firm's market capitalization rose when its share price climbed.
- Analysts watch market capitalization to judge the size of a firm.
