simpleMeaning: a spider's net that is not even in shape, made flat in one level and shaped like low hanging
  beds
scope: A spider's net made flat in one level, uneven in shape and like low hanging beds; not a round net,
  and not a net made of threads in many levels.
examples:
- A sheet web hung between the low plants in the garden.
- The spider sat under its sheet web waiting for prey.
