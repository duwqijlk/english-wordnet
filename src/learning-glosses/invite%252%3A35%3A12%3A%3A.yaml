simpleMeaning: to let it be known that someone is welcome in your home or the surrounding area
scope: 'Another name for receive and take in: welcoming someone into your home or community, not asking
  a guest to come over and not making something seem appealing.'
examples:
- The village invited the homeless family to live in the empty cottage.
- Our neighbours invited him in when he had nowhere else to go.
