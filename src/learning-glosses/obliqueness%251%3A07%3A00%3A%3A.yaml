simpleMeaning: The state of lying at a slant, not side by side and not at a right angle
scope: Lying at a slant, neither side by side with a line nor crossing it at a right angle; not straight
  up and down and not flat.
examples:
- The obliqueness of the beam made the room look crooked.
- The obliqueness of the cut left a slanting edge.
