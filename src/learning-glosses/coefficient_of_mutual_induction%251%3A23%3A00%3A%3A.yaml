simpleMeaning: A gauge of the pull between two wire loops, the push share in one loop over the matching
  shift of flow in a near loop, usually sized in henries.
scope: A gauge of the pull between two wire loops, also called mutual inductance.
examples:
- The coefficient of mutual induction is sized in henries.
- A high coefficient of mutual induction links the loops.
