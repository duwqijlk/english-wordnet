simpleMeaning: Very fast, and without the person meaning it, the eyes close and open again
scope: Very fast, and without the person meaning it, the eyes close and open again, also called blink,
  blinking, eye blink, wink, winking and nictation, and not a slow blink or a wink done on purpose.
examples:
- His nictitation grew faster as the wind blew dust into his eyes.
- Nictitation shut and opened his eyes again in less than a second.
