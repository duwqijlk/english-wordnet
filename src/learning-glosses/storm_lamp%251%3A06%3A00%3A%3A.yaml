simpleMeaning: A light that burns oil, kept safe from strong winds by a glass tube round the flame and
  a holed metal top, or a candle holder with a glass tube.
scope: People also call it hurricane lamp, hurricane lantern, storm lantern, and tornado lantern, and
  it is an oil light with a glass tube round the flame and a holed metal top, or a candle holder with
  a glass tube.
examples:
- He lit the storm lamp.
- The storm lamp stayed alight in the wind.
