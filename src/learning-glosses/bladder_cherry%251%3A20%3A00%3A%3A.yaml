simpleMeaning: The puffed-up papery orange-red cup at the base of its flowers is why this Old World plant,
  which lives for many years, is grown for show.
scope: Also called winter cherry, this Old World plant lives for many years and is grown for the puffed-up
  papery orange-red cup at the base of its flowers.
examples:
- The bladder cherry has puffed-up orange-red cups.
- We grow bladder cherry for its papery orange-red cups.
