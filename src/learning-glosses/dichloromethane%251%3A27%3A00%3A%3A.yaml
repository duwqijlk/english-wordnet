simpleMeaning: A liquid that will not catch fire, used to take paint off, to dissolve things, and to cool
  things
scope: A liquid that will not burn, used to dissolve things, strip paint, and cool things; methylene chloride
  is another name for this sense.
examples:
- Dichloromethane stripped the old paint from the chair.
- The lab used dichloromethane as a solvent.
