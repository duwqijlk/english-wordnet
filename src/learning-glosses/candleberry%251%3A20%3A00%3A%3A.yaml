simpleMeaning: With grey-green berries that have a wax coat, this sweet-smelling bush of the east of North
  America loses its leaves each year
scope: 'Also called bayberry, swamp candleberry and waxberry: a sweet-smelling bush of the east of North
  America with grey-green berries, not a tree and not a bush with red fruit.'
examples:
- The candleberry lost its leaves each year.
- The grey-green berries of the candleberry had a coat of wax.
