simpleMeaning: A leaf-shedding or half-evergreen tree, with sweet-smelling dark brown to yellow flowers
  in hanging sprays and pods with pulp used as medicine; tropical Asia, Central and South America and
  Australia.
scope: Also called canafistola, canafistula, drumstick tree, golden shower tree, pudding pipe tree and
  purging cassia; a tree with sweet-smelling yellow flowers in hanging sprays, not a shrub and not a tree
  grown for timber.
examples:
- Cassia fistula bloomed with yellow flowers in spring.
- The pods of Cassia fistula are used as medicine.
