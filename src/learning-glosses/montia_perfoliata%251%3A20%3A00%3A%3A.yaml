simpleMeaning: A soft juicy herb, at times grown as a salad or pot herb, that grows on sand hills and
  waste ground on the Pacific shore of North America.
scope: This is a salad herb, not a garden lettuce; also called miner's lettuce, winter purslane and Cuban
  spinach.
examples:
- Montia perfoliata grows on the sand hills of the Pacific shore.
- Some grow Montia perfoliata as a salad herb.
