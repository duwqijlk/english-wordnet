simpleMeaning: a sharp, unkind remark aimed at a person and meant to hurt or make a strong point
scope: 'Also called shot, dig, slam, shaft, barb and gibe: a sharp remark aimed at a person, not the verb
  sense where two things match or agree.'
examples:
- His jibe about her work made the room go quiet.
- She answered his jibes with a calm smile.
