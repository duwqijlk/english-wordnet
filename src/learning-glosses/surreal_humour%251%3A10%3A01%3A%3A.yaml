simpleMeaning: 'Nothing that happens needs to make sense: cause and effect are broken on purpose, and
  that is the joke.'
scope: This is a kind of joke built on funny acts and words that break the rules of cause and effect;
  absurdist humor, absurdist humour and surreal humor are other names for this sense.
examples:
- The surreal humour of the show left the crowd laughing at the nonsense.
- She loved surreal humour that broke the rules of cause and effect.
