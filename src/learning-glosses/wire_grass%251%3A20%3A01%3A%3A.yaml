simpleMeaning: Finger-shaped spikes of flowers top this rough one-year plant from the warm lands of the
  Old World, now at home elsewhere as a weed.
scope: Also called goose grass, yard grass, and yardgrass, this is a rough one-year plant from the warm
  Old World, not the handsome hardy North American kind.
examples:
- Wire grass has finger-shaped spikes of flowers.
- Wire grass now grows elsewhere as a weed.
