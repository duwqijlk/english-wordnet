simpleMeaning: One of the four main kinds of cancer, this sickness of the parts that make blood makes
  white blood cells grow out of control in great numbers.
scope: Also called leukemia, leukaemia, or cancer of the blood, this is one of the four main kinds of
  cancer.
examples:
- The leucaemia is one of the four main kinds of cancer.
- White blood cells grow out of control in great numbers with leucaemia.
