simpleMeaning: a bush that grows in the middle and southeast parts of Europe and gets some of its food
  from beech, chestnut and oak trees
scope: The kind that grows in central and southeastern Europe and lives partly on beech, chestnut and
  oak trees; not the Christmas kind with white berries, and not the American kinds.
examples:
- Mistletoe was growing high in the branches of the old oak tree.
- We found mistletoe on a chestnut tree in the woods.
