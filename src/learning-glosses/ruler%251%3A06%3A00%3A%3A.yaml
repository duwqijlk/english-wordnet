simpleMeaning: a flat strip of wood, metal or plastic with one straight edge, used to measure length and
  to draw straight lines
scope: Also called a rule — another name for this same tool, used for measuring length and drawing straight
  lines; not a king or other person who is in charge of a country.
examples:
- She used a ruler to draw a straight line.
- He measured the page with a wooden ruler.
