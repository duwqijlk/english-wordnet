senseId: 'voucher%1:18:00::'
synsetId: 10780431-n
simpleMeaning: a person who tells others that another person can be trusted, or that what someone has
  said is true
scope: A person who backs another person or a statement; not the paper card you trade in for goods, and
  not the paper that shows money was spent.
examples:
- When she applied for the post, her old teacher agreed to act as her voucher.
- He stood as voucher for his friend, telling the court the man was honest.
