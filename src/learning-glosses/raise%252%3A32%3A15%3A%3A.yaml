synsetId: 00952814-v
simpleMeaning: To say a vowel sound with the tongue moved closer to the top of the mouth.
scope: To shape a vowel with the tongue held high in the mouth; it is not speaking more loudly, not growing
  crops or animals, and not bidding higher in a card game.
examples:
- In this dialect, speakers raise the vowel in 'bag' so it sounds almost like 'beg'.
- The teacher asked him to raise the vowel slightly in the second syllable.
