simpleMeaning: Crops such as beans and sugar beets are attacked by a dark-coloured small bug that feeds
  on plants.
scope: Also called bean aphid, this is a dark plant bug, not the biting fly of the same name that sucks
  blood.
examples:
- Blackfly had settled on the beans.
- We found blackfly on the sugar beets.
