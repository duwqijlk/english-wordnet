simpleMeaning: A strong leaf-losing climber from Europe to Afghanistan and Lebanon, with bunches of sweet-smelling
  green-white flowers in summer and autumn.
scope: 'Also called old man''s beard, traveler''s joy or traveller''s joy: a strong climber from Europe
  to western Asia, not a low shrub and not a plant with single large flowers.'
examples:
- Clematis vitalba climbed over the wall, its sweet-smelling flowers opening in summer.
- In autumn the Clematis vitalba still bore green-white bunches of flowers.
