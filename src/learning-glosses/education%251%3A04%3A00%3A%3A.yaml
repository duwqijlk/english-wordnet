simpleMeaning: the work of teaching people and giving them knowledge or skills.
scope: It is not a single lesson and not a school or university as a place; it is the activity of teaching
  and learning.
examples:
- She works in education, teaching science at a secondary school.
- The government spends more on education than on defence.
