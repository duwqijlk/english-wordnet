simpleMeaning: It can point to sugar diabetes when the body passes more water, unless the extra comes
  from drinking more or from a drug that makes the body pass water.
scope: This is more water passed by the body than usual, which can point to sugar diabetes unless it comes
  from drinking more or from a drug that makes the body pass water.
examples:
- Diuresis can be a sign of sugar diabetes.
- He passed more water than usual, a case of diuresis.
