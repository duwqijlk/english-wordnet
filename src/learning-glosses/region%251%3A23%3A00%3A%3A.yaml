simpleMeaning: a rough or estimated amount of something, usually used after a preposition to mean ‘about’
  or ‘around’
scope: An approximate quantity or sum, not a geographic area or a part of the body.
examples:
- The repairs will cost in the region of two hundred dollars.
- He earns somewhere in the region of fifty thousand a year.
