simpleMeaning: Describing a circuit or piece of equipment that expresses measured amounts as numbers.
scope: This describes how a circuit or device handles values, not 'showing figures on a display instead
  of a dial or scale,' and not 'relating to the fingers.'
examples:
- The old machine was replaced by a digital controller that works with numbers.
- A digital computer works with numbers rather than continuously varying voltages.
