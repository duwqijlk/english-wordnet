simpleMeaning: a small wind instrument with four holes for the fingers and two holes for the thumbs
scope: A small wind instrument with four holes for the fingers and two for the thumbs, also called a flageolet
  and a treble recorder; not a big flute and not a whistle with one hole.
examples:
- He played a tune on the shepherd's pipe.
- The shepherd's pipe has four holes for the fingers and two for the thumbs.
