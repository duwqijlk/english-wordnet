simpleMeaning: having hard parts on the head that grow out in branches, as a deer has
scope: This describes an animal with hard, branching growths on its head, like a deer. It is not the wider
  idea of having horns, and not an animal with a bare head.
examples:
- An antlered stag stood at the edge of the wood.
- The antlered deer turned and ran from the road.
