simpleMeaning: a wind instrument for music, with one reed (a small piece that shakes to make sound) and
  a tube that gets wider like a cone
scope: 'Also called sax: a wind instrument with one reed and a cone-shaped tube, not a flute, which has
  no reed, and not a trumpet, which is played with the lips alone.'
examples:
- He played a slow song on his saxophone.
- The saxophone in the band had a warm, deep sound.
