simpleMeaning: to trick people by changing a thing, adding something to it so it is no longer pure
scope: To trick people by changing a thing so it is no longer pure, also called doctor and sophisticate,
  and not to make a thing better or to fix it.
examples:
- The trader doctored up the wine with water to cheat buyers.
- They doctored up the oil so it looked pure.
