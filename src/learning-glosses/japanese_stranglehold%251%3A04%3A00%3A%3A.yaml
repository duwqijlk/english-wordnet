simpleMeaning: A wrestling hold in which the other wrestler's arms are crossed in front of their own neck
  to press on their windpipe
scope: This is a wrestling hold in which the other wrestler's arms are crossed in front of their own neck
  to press on their windpipe; it is one wrestling hold among many, not a hold on the legs and not a throw.
examples:
- He caught his foe in a Japanese stranglehold.
- The Japanese stranglehold presses on the windpipe with the foe's own crossed arms.
