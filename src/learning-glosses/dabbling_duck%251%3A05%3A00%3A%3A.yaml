scope: One of many swimming birds that feed in shallow water by tipping up and dipping their bills; also
  called dabbler, not a deep-diving bird and not a land bird.
examples:
- The dabbling ducks fed by tipping up in the shallows.
- A dabbling duck dipped its bill in the pond.
