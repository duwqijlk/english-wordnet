simpleMeaning: based on old stories, or told of in them, with no real facts or true past behind it
scope: 'Also called mythical, mythic, and fabulous: this is about a thing from old stories with no real
  basis, not a real person, place, or event from the past.'
examples:
- The book tells of mythological beasts with wings and long tails.
- He studies mythological heroes from old Greek stories.
