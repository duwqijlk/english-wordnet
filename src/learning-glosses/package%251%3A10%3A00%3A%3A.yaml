simpleMeaning: In computer science, a set of written programs and papers that tell a computer how to work,
  kept in its memory
scope: In computer science, a set of programs and papers that run a computer, not a wrapped parcel.
examples:
- The new package runs on most computers.
- She bought a software package for her office.
