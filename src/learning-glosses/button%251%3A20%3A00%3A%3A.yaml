simpleMeaning: any of the different parts of a plant that look like small round pieces used to fasten
  clothes
scope: A part of a plant that looks like a clothes fastener; it is not the fastener itself, not a switch
  you press, and not a thing made by people.
examples:
- In spring, the bush is covered with small round buttons that will become flowers.
- Tiny buttons on the stem grew and opened into new leaves.
