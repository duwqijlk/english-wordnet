simpleMeaning: a rule from the government that only allowed people may see or have certain papers or weapons
scope: This is a government rule that keeps certain papers or weapons for allowed people only; it is not
  sorting things into groups, and not a group made by sorting.
examples:
- The classification of these army papers means only top officers may read them.
- Because of its classification, the new weapon could be seen only by allowed staff.
