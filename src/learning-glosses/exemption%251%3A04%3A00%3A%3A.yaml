senseId: 'exemption%1:04:00::'
synsetId: 00214770-n
simpleMeaning: an act that frees a person from a duty or rule
scope: This is the act of freeing a person from a duty or rule; it is not the money taken off tax because
  of a person's state, such as having children to care for.
examples:
- The school gave him an exemption from the sports lesson because of his bad leg.
- She asked for an exemption from the rule so she could leave early.
