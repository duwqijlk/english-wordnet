simpleMeaning: Hanging bunches of pale yellow-white flowers mark this plant of north-eastern North America,
  which some put in the Prenanthes group.
scope: 'Also called white lettuce: a plant of north-eastern North America with hanging pale flower bunches,
  not a lettuce grown to eat and not a garden plant with no flowers.'
examples:
- The cankerweed hung its pale flowers over the path.
- We found cankerweed growing in the woods of the north-east.
