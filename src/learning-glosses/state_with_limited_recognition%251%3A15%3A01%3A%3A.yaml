simpleMeaning: A land that rules itself in fact but is not accepted as a land by most other lands
scope: A land that rules itself in fact but is not accepted by most other lands, also called a disputed
  state, a partially-recognized state, or an unrecognized state; not a fully recognized country.
examples:
- The state with limited recognition is not accepted by most other lands.
- Few countries grant the state with limited recognition full recognition.
