simpleMeaning: Shedding its leaves in fall, a small tree of eastern and central United States, with dark
  green deeply lobed leaves and tough waterproof wood, used above all for fence posts
scope: Also called box white oak, iron oak, and post oak, this tree drops its leaves each fall and gives
  tough wood that keeps water out, used above all for fence posts.
examples:
- The brash oak shed its leaves in the fall.
- They chose brash oak for the fence posts because its wood keeps out water.
