simpleMeaning: Valued for timber, this tall pine of the east of North America has pale wood and brown
  bark that splits in long lines when the tree is old.
scope: Also called weymouth pine; it is a tall timber pine of the east, not the scrub pine of dry sandy
  ground.
examples:
- Eastern white pines towered over the lake.
- The eastern white pine is prized for timber.
