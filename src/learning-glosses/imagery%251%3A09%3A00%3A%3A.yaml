simpleMeaning: the power to picture things or happenings in the mind
scope: The power to picture things or happenings in the mind; not a picture one can see, and not words
  that paint a picture.
examples:
- Her imagery was so clear she could see the old house in her mind.
- His imagery let him picture the battle before he wrote of it.
