simpleMeaning: the quality of holding to the usual accepted beliefs, especially in religion
scope: This is the quality of holding to the usual accepted beliefs, especially in religion. It is not
  one single belief that follows the usual standards.
examples:
- Her orthodoxy meant she always followed the traditional teachings of her faith.
- The group's orthodoxy left no room for new religious ideas.
