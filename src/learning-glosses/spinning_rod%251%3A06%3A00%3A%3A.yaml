simpleMeaning: a long thin stick for fishing, made to throw out a bait that turns as it moves in the water
scope: A long thin stick for fishing, made to throw out a turning bait; not a stick for a fixed bait and
  not a net.
examples:
- He took his spinning rod to the lake and cast the lure out over the water.
- The spinning rod was made for a lure that turns as it moves.
