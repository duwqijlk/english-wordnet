simpleMeaning: In maths, the angle that has a given number as the ratio of the longest side of a right-angled
  triangle to the side next to it.
scope: 'Also called arc secant, arcsecant, and inverse secant: the angle worked out from a given number,
  not the secant itself and not the angle from a different triangle ratio.'
examples:
- The arcsec of 2 is 60 degrees.
- She used arcsec to work out the angle.
