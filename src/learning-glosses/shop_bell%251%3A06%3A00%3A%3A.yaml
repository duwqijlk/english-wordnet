simpleMeaning: a metal ringer fixed to the door of a small store, which tells the owner that a customer
  has come in
scope: A ringer on a shop door that tells the owner a customer has come in; not a church bell and not
  a doorbell in a house.
examples:
- The shop bell rang as she pushed the door open.
- When the shop bell sounded, the owner came out from the back room.
