simpleMeaning: a machine used in and after an operation to take out fluids, bits of body, or gases
scope: This is a machine used in and after an operation to take out fluids, bits of body, or gases, also
  called a surgical suction pump; not a machine that puts fluid into the body and not a heart-lung machine.
examples:
- Surgical vacuum pumps are being used not only for general surgery, but also for liposuction and endoscopy.
- The surgical vacuum pump removed fluid from the chest after surgery.
