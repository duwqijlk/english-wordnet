simpleMeaning: not rude, and doing only what social rules ask, with enough care for others but not special
  care
scope: 'Also called civil: not rude and doing only what social rules ask, not the fuller sense of showing
  care for others in your ways and speech, and not having fine taste and ways.'
examples:
- He was polite to the guests, but he did not go out of his way to help them.
- Even when he disliked them, he stayed polite and said hello as he should.
