simpleMeaning: the act of making a small cap filled with powder burst
scope: Making a small powder cap burst, not tapping the body to check health, not playing drums or other
  instruments you hit, and not the group in a band who plays them.
examples:
- The percussion of the cap was enough to fire the powder in the gun.
- When the hammer fell, the percussion of the cap came at once and the shot followed.
