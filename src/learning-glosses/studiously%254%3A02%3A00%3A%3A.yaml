simpleMeaning: in a careful way that shows a person puts real effort into the work they are doing
scope: Done with care and real effort, as in close study or careful work; not done in a quick, careless
  way and not done only to seem busy.
examples:
- She read the letter studiously before she wrote her answer.
- He checked each number studiously as he worked through the list.
