senseId: 'protectorate%1:15:00::'
synsetId: 08644891-n
simpleMeaning: A state or land partly ruled by a stronger state, though not owned by it, and free to run
  its own home affairs, set up by an agreement between states.
scope: Also called an associated state, it is a state or land partly ruled by a stronger state but free
  to run its own home affairs.
examples:
- The island became a protectorate after the treaty was signed.
- As a protectorate, the territory ran its own home affairs.
