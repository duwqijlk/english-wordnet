simpleMeaning: a body chemical, sold as Adrenalin, made by the small glands above the kidneys when a person
  is under stress, that wakes up the nerves that work without thought
scope: A body chemical made by the small glands above the kidneys when a person is under stress, that
  wakes up the nerves that work without thought, not a nerve itself.
examples:
- Adrenaline rushed through her body as the car swerved.
- The scare sent adrenaline through his veins.
