simpleMeaning: caused by a disease, changed by a disease, or showing that a disease is there
scope: About the body being ill with a disease, also called morbid and also called diseased. It is not
  about an ill mind, and not about the study of disease.
examples:
- The test showed pathological changes in the lung tissue.
- Pathological swelling showed that the joint was diseased.
