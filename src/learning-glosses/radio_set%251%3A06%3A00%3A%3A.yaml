simpleMeaning: This box turns signals sent through the air into sound you can hear, taking them in, picking
  out the sound, and making it loud.
scope: Unlike one that sends signals out, this takes them in; radio, wireless, tuner, radio receiver,
  and receiving set are other names for it.
examples:
- The radio set took in the signals and made them loud.
- We heard the news on the radio set.
