schema: oewn-learning-gloss-v2
senseId: 'kissing_kin%1:18:00::'
synsetId: 10257012-n
simpleMeaning: A relative who is not very close, yet close enough in the family to be greeted with a friendly
  peck on the cheek.
scope: A relative not very close but near enough to be greeted with a peck; kissing cousin is another
  name for this sense, not a close blood relative and not a stranger.
examples:
- My kissing kin came to visit and gave me a peck on the cheek.
- She calls them her kissing kin because the family link is distant but warm.
