simpleMeaning: A large tree for wood in western North America, with a trunk up to 12 feet wide and a height
  of up to 200 feet.
scope: It is a tall wood tree, not a small garden tree and not a pine; also called Chamaecyparis lawsoniana,
  Lawson's cedar, Oregon cedar, and Port Orford cedar.
examples:
- Lawson's cypress grows in western North America.
- The Lawson's cypress trunk was 12 feet wide.
