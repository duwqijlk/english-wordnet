simpleMeaning: the seed of a pod plant, eaten as food, and food made from that seed
scope: 'Also called golden gram, green bean, green gram, green soy, mash bean, monggo, moong, mung bean,
  or munggo: the seed of a bean plant, eaten as food, and food made from that seed; not a red bean and
  not a soy bean.'
examples:
- Mung is cooked and eaten as food.
- She soaked the mung overnight.
