simpleMeaning: With good sense, or in a fair, bright way.
scope: This sense is also called reasonably and sensibly, for having good sense, or a fair, bright way,
  unlike the sense for a sane, clear way.
examples:
- They spoke sanely, with good sense.
- They acted sanely, in a fair way.
