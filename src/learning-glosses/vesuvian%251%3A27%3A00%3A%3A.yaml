simpleMeaning: Hard shapes in limestone, cut as a jewel, are a green, yellow or brown mineral made of
  a watery chemical.
scope: This green, yellow or brown mineral is also called idocrase or vesuvianite.
examples:
- This vesuvian is green and was cut as a jewel.
- A vesuvian crystal was found in limestone.
