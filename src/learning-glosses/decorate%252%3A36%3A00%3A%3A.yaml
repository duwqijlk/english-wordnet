simpleMeaning: to make a person or thing look better by adding colour or pretty things
scope: 'Also called grace, ornament, and adorn: to make a person or thing look better by adding colour
  or pretty things, not just to put pretty things on a thing.'
examples:
- They decorated the room with flowers for the party.
- She decorated herself with gold earrings for the special day.
