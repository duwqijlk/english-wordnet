simpleMeaning: A mechanical device fixed on top of a high building or pole, turning freely to show which
  way the wind blows.
scope: Also called a vane, a mechanical device fixed on top of a high building or pole, turning freely
  to show which way the wind blows.
examples:
- The weathervane on the barn spun round in the wind.
- They watched the weathervane to see which way the wind blew.
