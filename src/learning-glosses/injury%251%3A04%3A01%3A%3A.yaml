simpleMeaning: An act of treating someone unfairly by denying them their rights.
scope: This is a moral or legal wrong against someone's rights, not damage to the body and not an accident
  that causes such damage.
examples:
- The court treated the seizure of the farm as an injury to the family's rights.
- She argued that the new tax was an injury to the rights of every citizen.
