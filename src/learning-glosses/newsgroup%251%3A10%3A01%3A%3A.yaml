simpleMeaning: People talk about one set subject in this place on a computer network, especially on the
  internet
scope: A place on a computer network where people talk about one set subject, especially on the internet;
  not a live chat room and not a one-to-one message.
examples:
- She joined a newsgroup about old trains.
- The newsgroup was full of talk about the new film.
