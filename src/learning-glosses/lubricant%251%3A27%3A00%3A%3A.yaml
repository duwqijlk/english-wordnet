simpleMeaning: a thing that makes surfaces smooth or slippery where they touch each other, so they rub
  less when they move
scope: 'Also called lube, lubricating substance and lubricator: a thing like oil that helps moving parts
  slide, not a part of a machine itself.'
examples:
- He put lubricant on the bike chain so it would move without noise.
- This lubricant helps the two metal parts slide past each other.
