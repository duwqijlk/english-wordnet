simpleMeaning: made very cold first, then kept so it lasts a long time by taking out all the water in
  a space with no air in it
scope: Things kept by cold and taking out water, not blood or tissue kept the same way.
examples:
- The freeze-dried coffee only needs hot water to make a cup.
- We packed freeze-dried meals for the long walk.
