simpleMeaning: a game on a court where players use light rackets with long handles to hit a shuttlecock
  (a light object with feathers) back and forth over a net
scope: This is the game with a shuttlecock hit over a net with light rackets, not tennis played with a
  ball.
examples:
- We played badminton on the court after school.
- In badminton, you hit the shuttlecock over the net with a light racket.
