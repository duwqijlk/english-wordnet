simpleMeaning: A tropical American fern with scaly brown underground stems, grown for its big, deeply
  divided, dark blue-green fronds; it is sometimes classed in the genus Polypodium.
scope: The fern itself, not the genus Polypodium as a whole, since it is only sometimes placed there,
  and not other cultivated ferns.
examples:
- Golden polypody grows best in warm, humid shade.
- The nursery sells golden polypody as a houseplant.
