simpleMeaning: a dye that shows whether a liquid is an acid or a base, working for liquids with a pH,
  how acid it is, between 6.0 and 7.6
scope: 'Also called bromthymol blue: a dye that shows whether a liquid is an acid or a base, not the bromophenol
  blue dye and not a dye for cloth.'
examples:
- The teacher used bromothymol blue to test the water.
- Bromothymol blue turned green when the liquid was neither acid nor base.
