simpleMeaning: a tree or bush of the tropics whose fruit sprouts while still on the tree, with many supporting
  roots forming a mass too thick to pass through, building up land
scope: A tree or bush of the hot tropics with sprouting fruit and roots that build up land, not a tree
  of dry land.
examples:
- Mangroves line the shore where the river meets the sea.
- The mangrove's roots held the mud in place as the tide came in.
