simpleMeaning: The longest blood vessel of its kind in the body, running from the foot to the groin, where
  it joins the main leg vessel
scope: This longest leg vessel is also called long saphenous vein, and is not an artery and not a short
  surface vessel.
examples:
- The great saphenous vein runs up the inside of the leg.
- Surgeons sometimes use the great saphenous vein in heart surgery.
