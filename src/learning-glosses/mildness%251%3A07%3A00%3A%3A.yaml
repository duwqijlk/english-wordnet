simpleMeaning: the kindness that comes from being willing to let things pass and not punish in a hard
  way
scope: 'Also called leniency: this is kindness in not punishing in a hard way, not the gentle and calm
  way of acting in the other sense of mildness.'
examples:
- The judge's mildness meant the young man was not sent to prison.
- She showed mildness and let the boy go without a hard punishment.
