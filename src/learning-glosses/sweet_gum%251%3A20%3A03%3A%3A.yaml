simpleMeaning: brown-red wood cut from the hard centre of a tree, used to make furniture
scope: This is wood from the centre of a tree, used for furniture, not the tree itself and not wood from
  another tree; hazelwood, red gum and satin walnut are other names for this sense.
examples:
- The table was made of sweet gum polished to a deep shine.
- Sweet gum is a brown-red wood often used for furniture.
