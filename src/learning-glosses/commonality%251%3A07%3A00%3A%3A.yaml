simpleMeaning: the fact that two or more people or things have the same features or qualities
scope: 'Also called commonness: the sharing of the same features, not a group of ordinary people with
  low rank.'
examples:
- The two towns share a commonality in their music.
- A commonality between the sisters is their love of books.
