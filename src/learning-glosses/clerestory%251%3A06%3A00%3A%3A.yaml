simpleMeaning: the high part of an inside wall, rising above the roof beside it, with windows that let
  in light
scope: The high part of an inside wall, rising above the roof beside it, with windows that let in light;
  clearstory is another name for this sense, not a skylight in the roof and not an ordinary window.
examples:
- The clerestory windows lit the whole church.
- A clerestory runs along the top of the nave.
