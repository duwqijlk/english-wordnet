simpleMeaning: a written message from the head of the Roman Catholic Church, sent to every bishop of that
  church in the world
scope: 'Also called encyclical letter: a written message from the head of the Roman Catholic Church, sent
  to every bishop of that church in the world, not a private note to one bishop and not a public speech.'
examples:
- The pope's latest encyclical was read in churches across the country.
- Bishops around the world received the new encyclical this week.
