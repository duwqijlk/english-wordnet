simpleMeaning: A fielding slip in baseball, when a plain play should have got the out.
scope: This sense is also called an error, for a fielding slip in baseball, when a plain play should have
  got the out, where an error is, in baseball, a player who is trying to stop the other team fails to
  get a player out when a normal play would have been enough, unlike the sense for playing wrongly, as
  a wrong note.
examples:
- The misplay was a fielding slip in baseball.
- Misplays are fielding slips.
