simpleMeaning: said or done in a way that is not direct, in words or in actions
scope: 'Also called circuitous: said or done in a way that is not direct, in words or in actions. This
  is not a road place where cars go around a centre, and not a big turning ride for children.'
examples:
- He gave a roundabout answer and never said yes or no.
- We heard in a roundabout way that her best friend was getting married.
