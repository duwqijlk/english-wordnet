simpleMeaning: The way a verb is used when the start and the end of its action do not matter
scope: This is a way of looking at a verb's action with no thought of its start or end; imperfective is
  another name for this sense, not the perfective way of looking at an action as done.
examples:
- The imperfective aspect shows an action in progress.
- We use the imperfective aspect when the end of the action does not matter.
