simpleMeaning: A blood tube that drains the eye, made from tubes from the back of the eye and from the
  ring round the lens, and running into the eye's blood tubes.
scope: A blood tube from the back of the eye that runs into the eye's blood tubes, also called vorticose
  vein and vena vorticosum; not an artery and not a nerve of the eye.
examples:
- The vortex vein carries blood away from the back of the eye.
- The doctor traced the vortex vein to the eye's blood tubes.
