simpleMeaning: A blood condition found mostly in Black people, present from birth, in which the blood
  cells take the curved shape of a new moon.
scope: Present from birth, this blood condition is also called crescent-cell anaemia, crescent-cell anemia,
  drepanocytic anemia, sickle-cell anaemia, sickle-cell anemia, and sickle-cell disease.
examples:
- She has had drepanocytic anaemia since birth.
- The drepanocytic anaemia was found in the newborn baby.
