synsetId: 01469999-v
simpleMeaning: to go around something on all sides at the same time and form a full circle around it
scope: Also called border, ring, and surround. This means to be on all sides of something, not to avoid
  a question or duty and not a piece of clothing.
examples:
- Tall trees skirt the lake on all sides.
- Low hills skirted the town, closing it in all the way round.
