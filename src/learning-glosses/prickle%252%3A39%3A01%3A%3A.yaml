simpleMeaning: to make the skin feel a light, sharp pain in many small places
scope: 'Also called prick: to make the skin feel light sharp pain in small places, not the small sharp
  point on a plant and not the stinging or tingling sense.'
examples:
- The thick wool sweater prickled her neck all day.
- Dry grass prickled the children's bare feet.
