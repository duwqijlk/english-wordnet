simpleMeaning: a common wild cherry that grows in the east of North America and bears small black fruit
  that tastes bitter but that birds eat
scope: A common wild cherry of eastern North America with small bitter black berries that birds like,
  also called a chokecherry; not a sweet garden cherry and not a plum tree.
examples:
- A chokecherry tree grew wild behind the barn.
- Birds stripped the chokecherry tree of its black berries.
