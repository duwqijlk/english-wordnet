simpleMeaning: This animal form is in shape between the therapsids, early animals with some mammal traits,
  and the earliest true mammals
scope: An animal form halfway between the therapsids and the earliest true mammals; not a therapsid itself
  and not a true mammal.
examples:
- The ictodosaur shows traits of both therapsids and early mammals.
- Fossils of the ictodosaur help show how true mammals first appeared.
