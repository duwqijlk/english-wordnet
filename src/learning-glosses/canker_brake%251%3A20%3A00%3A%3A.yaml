simpleMeaning: Its feathered leaves stay green all year on this North American fern, whose narrow, pointed
  leaf stems grow in thick bunches.
scope: 'Also called dagger fern and evergreen wood fern: a green-all-year fern of North America, not a
  tree fern and not a fern that loses its leaves in winter.'
examples:
- The canker brake kept its green leaves all winter.
- A canker brake grew in thick bunches along the shady bank.
