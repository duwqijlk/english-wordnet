simpleMeaning: The amount of water that would cover 43,560 square feet to a depth of twelve inches, or
  43,560 cubic feet, or 1233.5 cubic metres.
scope: Not a gallon and not a cubic metre of water.
examples:
- One acre-foot of water covers an acre a foot deep.
- The farmer ordered two acre-foot of water for the field.
