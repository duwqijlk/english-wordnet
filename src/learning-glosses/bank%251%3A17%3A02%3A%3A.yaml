senseId: 'bank%1:17:02::'
synsetId: 09236735-n
simpleMeaning: a slope across a curved road or track, with the outer edge raised to reduce the outward
  pull of turning
scope: This is not the side of a river or a row of similar objects; it is the raised outer edge of a curve
  built for speed.
examples:
- The bank on the bend helps cars hold the road at speed.
- Cyclists use the steep bank of the velodrome to carry speed through the turn.
