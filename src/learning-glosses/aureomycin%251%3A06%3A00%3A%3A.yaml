simpleMeaning: A yellow drug in crystal form, used to treat some illnesses caused by germs, including
  tiny germs called rickettsiae.
scope: This is a yellow drug in crystal form for some illnesses caused by germs; chlortetracycline is
  another name for it, and it is not a drug for every kind of illness.
examples:
- The doctor gave her Aureomycin for the infection.
- Aureomycin is a yellow drug used to treat some germ-caused illnesses.
