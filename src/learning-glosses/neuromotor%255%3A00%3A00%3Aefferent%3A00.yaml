simpleMeaning: It describes a nerve thread or signal passing toward a part of the body that moves.
scope: This word marks a nerve thread or signal that passes toward a part of the body that moves, not
  one that runs the other way.
examples:
- The neuromotor signal reached the muscle and made it pull.
- A neuromotor impulse runs out to the muscle that moves the arm.
