simpleMeaning: a light hit on the side of something, especially a car or other vehicle, that does not
  hit it straight
scope: A light hit on the side, especially of a car, not a straight crash into the front of something.
examples:
- The sideswipe left a long mark on the side of the car but did little harm.
- A sideswipe from the passing truck bent the mirror on our car.
