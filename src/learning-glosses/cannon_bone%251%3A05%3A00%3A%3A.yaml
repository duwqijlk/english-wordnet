simpleMeaning: In the shank of a hoofed animal, the long hard piece of the foot or of the foreleg grows
  very large.
scope: The long hard piece of the foot or foreleg in the shank of a hoofed animal, not a piece of the
  upper leg.
examples:
- The cannon bone in the lower leg of the horse was much bigger than the other hard parts there.
- Hoofed animals such as horses have a cannon bone in each lower leg.
