simpleMeaning: the act of trying to do better than others in order to win a prize or earn more money.
scope: This is not the business relationship between rival sellers, and it is not a single match; it is
  the activity of trying to beat others.
examples:
- Competition for the scholarship was intense.
- The competition between the two runners lasted until the final lap.
