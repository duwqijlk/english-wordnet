simpleMeaning: describing a person who notices and cares about details, is not easy to please, and cares
  more than most about being clean
scope: This describes a person who cares a lot about small details and being clean and is hard to please,
  not a living thing that needs special food or conditions to grow.
examples:
- She is fastidious about keeping her kitchen clean.
- The fastidious editor checked every small detail in the report.
