simpleMeaning: Facts about another country's armed forces that are of use when making plans and rules
  for armed forces and when carrying out armed action.
scope: Facts about another country's armed forces that are of use when making plans and rules for armed
  forces and when carrying out armed action; not the office that gathers such facts, and not news about
  one's own forces.
examples:
- Military intelligence warned that the enemy was moving at night.
- The report was based on military intelligence gathered over months.
