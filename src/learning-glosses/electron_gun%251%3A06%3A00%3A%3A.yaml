simpleMeaning: The part of a cathode-ray tube or microscope that produces a beam of electrons and focuses
  it, using a negative electrode and electric or magnetic fields.
scope: The beam-making assembly inside such a tube or microscope, not the whole instrument and not the
  screen it lights up.
examples:
- The electron gun at the back of the tube fires a beam at the screen.
- A speck of dust on the electron gun made the microscope image blurry.
