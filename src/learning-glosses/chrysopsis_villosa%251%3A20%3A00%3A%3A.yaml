simpleMeaning: A hairy long-lived plant with yellow flower heads in branching bunches, in dry ground almost
  everywhere from Canada to west-central and western America, sometimes in the same-named genus.
scope: Also called hairy golden aster, prairie golden aster and Heterotheca villosa, this is a hairy plant
  of dry western ground, not a garden aster grown for show.
examples:
- The Chrysopsis villosa bears yellow heads in branching bunches.
- Chrysopsis villosa grows in dry ground across the west.
