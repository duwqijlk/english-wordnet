simpleMeaning: to slow down or block something with something stuck in the way, or as if something is
  stuck in the way
scope: Clog is another name for this sense. This sense is about slowing or blocking something, as if something
  is stuck in the way. It is not the body sense, about making a person unable to pass solid waste from
  the body.
examples:
- Heavy paperwork constipated the whole office system.
- Too many rules can constipate new business.
