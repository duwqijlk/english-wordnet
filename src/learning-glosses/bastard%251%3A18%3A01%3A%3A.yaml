simpleMeaning: a child whose parents were not married to each other when the child was born
scope: A child born to parents who are not married to each other; not the rude name for a stupid or annoying
  person, and not a thing that is not a true or proper kind.
examples:
- In the story, the king's bastard grew up far from the court.
- He was born a bastard and had no right to his father's name.
