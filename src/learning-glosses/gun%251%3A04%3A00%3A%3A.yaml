simpleMeaning: The firing of weapons to give a signal or show respect during a military ceremony.
scope: This is the firing itself, used to give a signal or show honor at a military ceremony, not the
  weapon that fires, not a large piece of artillery, not a person judged by shooting skill, not a hired
  killer, not the hand-operated pump that forces grease into machinery, not the pedal that controls a
  throttle, and not the verb meaning to shoot.
examples:
- A gun fired in salute echoed across the harbor at noon.
- The soldiers waited for the gun that would signal the start of the attack.
