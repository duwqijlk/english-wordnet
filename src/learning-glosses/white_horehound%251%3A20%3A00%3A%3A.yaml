simpleMeaning: a fragrant, hairy-leaved herb of Europe whose many white flowers cluster where leaf meets
  stem, and whose leaves give a bitter extract used in medicine and flavoring.
scope: 'Another name for common horehound: the European herb with white flowers and a bitter leaf extract
  used in medicine and flavoring. Not black horehound, a different plant with dark flowers.'
examples:
- White horehound has been grown in herb gardens for centuries for its bitter leaves.
- She boiled white horehound leaves to make a tea for her cough.
