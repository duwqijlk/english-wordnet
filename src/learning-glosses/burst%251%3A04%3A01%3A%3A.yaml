simpleMeaning: a rapid firing of many guns at the same time.
scope: This is the gunfire sense, a quick round of shots fired together, not the sudden spell of activity
  sense, and not the act of something exploding.
examples:
- A burst of gunfire sent everyone running for cover.
- The guard fired a short burst from his rifle.
