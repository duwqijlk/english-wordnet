simpleMeaning: A row of false teeth joined to the real teeth that stand on either side of the space left
  by teeth that are gone.
scope: Also called a bridge; a row of false teeth joined to the real teeth on either side of a space left
  by teeth that are gone.
examples:
- Her bridgework was fixed to the teeth on either side of the gap.
- The dentist fitted new bridgework after two teeth were lost.
