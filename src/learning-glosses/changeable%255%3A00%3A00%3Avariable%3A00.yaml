senseId: changeable%5:00:00:variable:00
synsetId: 02514603-s
simpleMeaning: able to become different at any time; not staying the same
scope: Able to become different, as weather can; not the sense where a color looks different in different
  light, and not the sense about a strong habit of becoming different.
examples:
- The weather here is very changeable, with sun and rain on the same day.
- He has a changeable mood and can be happy one minute and sad the next.
