simpleMeaning: To take a tenth part from a crop or other produce, as a church due.
scope: To take a tenth part from a crop or other produce, as a church due, not to pay a tenth yourself
  and not to take it from a person.
examples:
- The lord tithed the harvest each year.
- The church tithed the wool from every flock.
