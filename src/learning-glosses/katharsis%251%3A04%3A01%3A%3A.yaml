simpleMeaning: Clearing the body out by taking a medicine (a cathartic) that makes the bowels empty
scope: This is the clearing of the body by a medicine that makes the bowels empty; catharsis is another
  name for this sense, not the release of strong feelings and not a wash of the skin.
examples:
- The doctor ordered a katharsis to clear the patient's bowels.
- The katharsis cleared his bowels before the examination.
