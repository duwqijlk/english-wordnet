simpleMeaning: In physics, the keeping of certain amounts the same during chemical changes or changes
  of form
scope: In physics, the keeping of certain amounts the same during chemical changes or changes of form;
  not a thing getting better by stopping loss.
examples:
- Conservation of energy means the total stays the same.
- The conservation of mass holds in every chemical change.
