simpleMeaning: an official statement that urges people to do an activity or tells them they must stop
  doing it
scope: This is an official statement that urges people to do something or tells them they must stop doing
  it, not the word for leading or showing the way.
examples:
- The boss sent a directive telling staff to stop using the old forms.
- A new directive says workers must wear gloves in the room.
