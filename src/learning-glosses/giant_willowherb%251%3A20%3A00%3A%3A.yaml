simpleMeaning: Tall North American perennial with creeping underground stems, narrow leaves and spikes
  of pinkish-purple flowers, growing in masses on burned ground and new clearings; a major honey source.
scope: This is the tall pinkish-purple plant of burned ground and clearings, the same species as fireweed,
  not the other weed of that name with small white or greenish flowers.
examples:
- The clearing was soon waist-high in giant willowherb, its pink spikes catching the light.
- Giant willowherb spreads quickly through disturbed ground by its creeping roots.
