simpleMeaning: The back part of the hind part of the brain in a young animal with a backbone, which becomes
  the lowest part of the brain in the adult.
scope: The back part of the hind part of the brain in a young animal, which becomes the lowest part of
  the brain in the adult, not the front part of the brain and not the middle part of the brain.
examples:
- The myelencephalon forms early in the developing embryo.
- In the adult, the myelencephalon has become the medulla oblongata.
