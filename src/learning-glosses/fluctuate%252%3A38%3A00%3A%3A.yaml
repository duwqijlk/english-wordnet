simpleMeaning: to move up and down, or from side to side, in a pattern like waves
scope: 'Also called waver, and another name for it is vacillate: this sense is about moving up and down
  like waves, not about making another thing move that way.'
examples:
- The line on the screen fluctuated, rising and falling like a wave.
- The small boat fluctuated gently on the water.
