simpleMeaning: to make a thing get small folds or pressed lines
scope: To make a thing get small folds or pressed lines, not a small fold in a surface, not a thing that
  gets folds by itself, and not making small folds or lines on a smooth flat thing.
examples:
- She wrinkled her forehead as she tried to recall the name.
- He wrinkled the letter before he threw it away.
