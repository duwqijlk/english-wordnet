senseId: 'tempt%2:32:01::'
synsetId: 00795447-v
simpleMeaning: To make a person feel ready and willing to do a thing, or to draw them toward it
scope: Making a person ready and willing to do a thing, not pushing them with promises, not winning them
  over by charm, and not drawing them in just by looking nice.
examples:
- We were tempted by the delicious-looking food.
- The warm sun tempted her to sit outside all afternoon.
