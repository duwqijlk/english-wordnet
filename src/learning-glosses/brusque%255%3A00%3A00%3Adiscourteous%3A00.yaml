simpleMeaning: Short, sharp, and rude in words or manner, expecting to be obeyed at once.
scope: Also called short or curt, this is short, sharp, and rude in manner, expecting to be obeyed at
  once, not merely brief.
examples:
- His brusque reply ended the talk.
- A brusque note on the door told visitors to go away.
