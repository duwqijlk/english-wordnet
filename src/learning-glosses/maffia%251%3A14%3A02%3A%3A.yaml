simpleMeaning: People who trust one another and stay close to one another form such a group
scope: Also called mafia, this is a group of people who trust one another and stay close to one another,
  not a criminal gang and not a loose circle of friends.
examples:
- The maffia of old friends ran the small club together.
- She relied on her maffia of trusted advisers to get the work done.
