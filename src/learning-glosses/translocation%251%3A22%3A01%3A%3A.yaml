simpleMeaning: The movement of dissolved matter around inside a plant
scope: The movement of dissolved matter around inside a plant, not the moving of a whole plant and not
  the flow of blood in an animal.
examples:
- Translocation carries sugars from the leaves to the roots.
- After the rain, translocation moved the salts through the stem.
