simpleMeaning: In linguistics and poetry, verse in which every line has the same number of syllables
scope: The use of verse with the same number of syllables in every line, not free verse and not verse
  with lines of mixed lengths.
examples:
- The poem shows strict isosyllabism in every line.
- Critics praised the isosyllabism of the old ballad.
