senseId: 'clangour%1:11:00::'
synsetId: 07394744-n
simpleMeaning: a loud sound that rings out and comes back again and again
scope: This is a loud sound that rings out and repeats; clang, clangor, clangoring, clank, clash and crash
  are other names for this sense, not a single sharp bang and not a soft hum.
examples:
- We could hear the clangour of distant bells across the valley.
- The clangour of the metal gates rang out again and again.
