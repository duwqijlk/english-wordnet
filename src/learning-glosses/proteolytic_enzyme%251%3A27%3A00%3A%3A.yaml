simpleMeaning: Smaller peptide pieces and single amino acids are what proteins become when this kind of
  body chemical cuts them apart in a splitting process called proteolysis.
scope: 'Also called proteinase, protease, and peptidase: any body chemical that cuts proteins into smaller
  pieces, not the protein it acts on.'
examples:
- The proteolytic enzyme cut the protein into smaller peptide pieces.
- A proteolytic enzyme works by splitting proteins into single amino acids.
