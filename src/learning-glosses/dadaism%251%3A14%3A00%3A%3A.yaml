simpleMeaning: Above all in painting, this art movement in Europe early in the nineteen hundreds threw
  out sense and the old rules of beauty
scope: Also called dada, this was an art movement in Europe early in the nineteen hundreds that threw
  out sense and the old rules of beauty.
examples:
- Dadaism shocked people by throwing out the old rules of beauty.
- Many dadaism works were made to seem senseless on purpose.
