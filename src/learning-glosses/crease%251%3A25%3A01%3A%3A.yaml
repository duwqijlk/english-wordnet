simpleMeaning: a small dip or fold in a surface that is smooth in other places
scope: This small dip or fold in a smooth surface is also called line, wrinkle, furrow, seam and crinkle.
  It is not the shape with a corner made by folding, and not the knife sense.
examples:
- There was a crease across the smooth sheet of paper.
- Ironing removed the crease from the front of his shirt.
