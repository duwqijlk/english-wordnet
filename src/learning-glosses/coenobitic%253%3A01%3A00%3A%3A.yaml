simpleMeaning: Of, about, or fitting monks who live together as one group, and their way of life.
scope: This is of, about, or fitting monks who live together as one group, and their way of life; cenobitic,
  cenobitical and coenobitical are other names for this sense, not the life of a lone monk and not a rule
  for nuns alone.
examples:
- The coenobitic rule shaped the monks' shared day.
- Their coenobitic life meant eating and praying together.
