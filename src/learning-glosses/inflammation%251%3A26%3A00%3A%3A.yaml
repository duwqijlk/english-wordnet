simpleMeaning: the way parts of the body react when they are hurt or made sore, shown by pain, swelling,
  redness and heat
scope: 'Also called redness: parts of the body reacting to being hurt, with pain, swelling, redness and
  heat, not strong feeling stirred up in the mind.'
examples:
- The cut caused inflammation around the wound.
- Inflammation in her knee made it sore and swollen.
