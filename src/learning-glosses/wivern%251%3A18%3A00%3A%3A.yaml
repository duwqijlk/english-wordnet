  on shields and coats of arms in the Middle Ages
scope: Also called wyvern, it is the fire-breathing beast shown on shields and coats of arms in the Middle
  Ages.
examples:
- A wivern breathed fire on the shield.
- The wivern on the shield had a snake tail.
