simpleMeaning: a carbon-based chemical base with the mark C3H4N2, which holds back histamine, a body chemical
  that brings on allergy signs
scope: A carbon-based base that holds back histamine; glyoxaline and imidazole are other names for this
  sense, not a drug that copies histamine and not a salt.
examples:
- The chemist used iminazole to hold back the histamine.
- Iminazole blocks histamine in the same way as imidazole.
