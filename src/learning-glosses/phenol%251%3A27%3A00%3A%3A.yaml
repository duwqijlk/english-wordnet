simpleMeaning: any of a group of mildly acid carbon compounds, each with one or more hydroxyl groups,
  each a pair of oxygen and hydrogen, in its molecule
scope: Any of a group of mildly acid carbon compounds; not the poisonous white solid made from benzene
  and used as a germ-killer.
examples:
- Phenol is one of a group of mildly acid carbon compounds.
- The chemist tested the phenol for the hydroxyl groups in its molecule.
