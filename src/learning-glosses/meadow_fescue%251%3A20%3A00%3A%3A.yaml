simpleMeaning: Grown in Europe and America for lasting grazing land and hay and for lawns, a grass with
  wide flat leaves.
scope: 'Fescue and fescue grass are other names for it: it is a grass with wide flat leaves grown in Europe
  and America for lasting grazing land and hay and for lawns.'
examples:
- Meadow fescue grew across the lawn.
- The farmer cut meadow fescue for hay.
