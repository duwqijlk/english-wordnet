simpleMeaning: known to and understood by only a small special group of people with deep knowledge
scope: This describes knowledge for a small special group only; it is not knowledge that is open to or
  easy for everyone.
examples:
- He gave a talk on esoteric ideas that only a few experts could follow.
- The book is full of esoteric language that most readers cannot understand.
