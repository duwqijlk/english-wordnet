simpleMeaning: Any of several small wrasses of the sea with flat, sharp-edged heads, found in the West
  Indies and the Mediterranean
scope: A small sea wrasse with a flat, sharp-edged head, also called a razor-fish; not a shark and not
  a flatfish.
examples:
- The razor fish hid among the coral.
- A razor fish swam past the divers.
