simpleMeaning: More of two brain chemicals stay free to act on the brain's receivers when this drug against
  low mood blocks the body from taking them back.
scope: Tricyclic and tricyclic antidepressant drug are other names for this drug against low mood, which
  blocks the taking back of two brain chemicals.
examples:
- He took a tricyclic antidepressant for his low mood.
- Her low mood lifted after she started on a tricyclic antidepressant.
