simpleMeaning: To run a task, deed, or making by machine.
scope: This sense is also called computerize, for running a task, deed, or making by machine, unlike the
  sense for to fit with machines, and unlike the sense for to keep in a machine.
examples:
- They computerise the task, running it by machine.
- They computerise work.
