simpleMeaning: The main blood vessel of the upper leg, carrying on from the large vessel in the lower
  belly
scope: The main blood vessel of the upper leg, carrying on from the large vessel in the lower belly, also
  called the arteria femoralis; not a vein and not a blood vessel of the lower leg.
examples:
- The femoral artery runs down the thigh.
- The surgeon clamped the femoral artery.
