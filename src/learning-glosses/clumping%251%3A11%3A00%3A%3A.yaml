simpleMeaning: the sound made when a horse's hoofs (the hard parts on its feet) hit a hard surface
scope: 'Also called clop, clopping and clunking: the sound of a horse''s feet on a hard surface, not a
  horse walking on soft ground and not a heavy metal sound.'
examples:
- We heard the clumping of the horse on the stone road.
- The clumping grew louder as the horse came near.
