simpleMeaning: The left-hand side of a boat or plane, as seen by someone on board looking toward the front.
scope: The left-hand side itself, not a harbour where ships load and unload, not a small opening for guns
  in a ship's wall, and not a word describing something as lying on that side.
examples:
- The ship leaned hard to port as the wind hit its sails.
- From the port side of the plane we could see the whole harbour below.
