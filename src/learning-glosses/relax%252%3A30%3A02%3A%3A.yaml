simpleMeaning: to become loose or less tight
scope: Loose is another name for this sense. This is when something becomes loose or less tight. It is
  not a person resting and feeling calm, and not something making a person feel calm.
examples:
- The rope relaxed as he let out more line.
- Her grip relaxed and the jar slipped from her hand.
