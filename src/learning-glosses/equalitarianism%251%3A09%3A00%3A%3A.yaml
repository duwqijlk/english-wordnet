simpleMeaning: The belief that all people are the same in worth, and that sameness in politics, money
  matters and social life is a good thing
scope: This is the belief that all people are the same in worth; egalitarianism is another name for this
  sense, not a belief in rule by the few and not a system that ranks people by birth.
examples:
- His equalitarianism led him to argue for the same rights for all.
- Equalitarianism holds that wealth should be shared more fairly.
