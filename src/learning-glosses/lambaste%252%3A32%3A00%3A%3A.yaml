simpleMeaning: Blaming a person to their face, hard and angry, for a wrong done.
scope: Blaming a person to their face, hard and angry, for a wrong done; also called jaw, rag, lecture,
  scold, chide, rebuke, berate, reprimand, trounce, remonstrate, or lambast.
examples:
- They would lambaste the minister in the press.
- The mother came to lambaste the boy.
