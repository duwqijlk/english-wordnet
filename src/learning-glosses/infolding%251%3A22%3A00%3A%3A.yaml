simpleMeaning: The act of an outer layer turning in so as to form a pocket in the surface.
scope: An outer layer folding in to make a hollow in a surface, also called introversion, intussusception
  or invagination; not a fold in cloth and not a crease in paper.
examples:
- The infolding of the blastula forms the first hollow of the embryo.
- An infolding of the outer skin made a deep pocket in the surface.
