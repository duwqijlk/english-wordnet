simpleMeaning: In astronomy, the middle of a comet's head, made of small solid bits of ice and frozen
  gas that turn to gas near the sun, forming its cloud and tail
scope: The middle of a comet's head in space, not the middle part inside a living cell and not the heavy
  middle of an atom.
examples:
- Through the telescope, the nucleus of the comet looked like a bright spot.
- As the comet came near the sun, gases streamed away from its nucleus.
