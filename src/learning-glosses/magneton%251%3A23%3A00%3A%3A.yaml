simpleMeaning: A unit for the twist of a bit of matter, whether of a molecule, an atom, or a still smaller
  bit
scope: A unit for the twist of a bit of matter, whether of a molecule, an atom or a still smaller bit;
  not a unit of weight and not a unit of length.
examples:
- The magneton is a tiny unit used to measure the twist of single atoms.
- Physicists state the magneton when they compare the twists of small bits of matter.
