simpleMeaning: A kind of barley grown for its showy flower heads with fine long silky bristles, found
  in North America and north-eastern Asia
scope: A barley grown for its showy flower heads; foxtail barley, squirreltail barley and squirreltail
  grass are other names for this sense, not a barley grown for grain or a wild grass with plain flower
  heads.
examples:
- Hordeum jubatum nodded in the breeze along the path.
- The gardener grew Hordeum jubatum for its silky flower heads.
