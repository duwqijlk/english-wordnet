simpleMeaning: Plants grown on a field to stop the soil washing away and to feed the soil with green plant
  matter
scope: These are plants grown on a field to stop the soil washing away and to feed the soil with green
  plant matter; not plants grown to sell, and not a field left bare.
examples:
- The farmer sowed a cover crop after the wheat harvest.
- Clover makes a good cover crop for the winter months.
