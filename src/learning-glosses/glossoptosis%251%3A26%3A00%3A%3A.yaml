simpleMeaning: the tongue lies too low or too far back in the mouth, not where it should be
scope: A tongue placed wrongly, low or back in the mouth, not a tongue that is too big and not a tongue
  that cannot move.
examples:
- The baby had glossoptosis, and her tongue sat far back in her mouth.
- Doctors noted glossoptosis when the tongue lay too low for the baby to feed well.
