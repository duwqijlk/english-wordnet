simpleMeaning: a small boat that does not go deep into the water and is moved with oars, with seats set
  across it and rests to hold the oars
scope: 'Also called a dinghy: a small boat moved with oars, not a boat with a motor and not a sailing
  boat.'
examples:
- They crossed the lake in a rowboat.
- We tied the rowboat to the dock after rowing back.
