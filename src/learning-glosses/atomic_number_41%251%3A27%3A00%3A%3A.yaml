simpleMeaning: A soft grey metal that can be pulled into thin threads, used in mixtures with other metals;
  found in niobite; once called columbium.
scope: A soft grey metal that can be pulled into thin threads, also called Nb and niobium; set apart from
  other soft grey metals and from metals that cannot be pulled thin.
examples:
- Atomic number 41 was once called columbium.
- Workers mix atomic number 41 with other metals to make alloys.
