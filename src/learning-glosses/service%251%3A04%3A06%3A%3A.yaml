simpleMeaning: the work a waiter or servant does in looking after guests or an employer.
scope: This is waiting on guests or an employer, not repairing machines, delivering legal papers, or a
  set of dishes.
examples:
- The service at the restaurant was slow but friendly.
- In that house, good service meant the fire was lit before the family rose.
