simpleMeaning: A feeling system in the inner ear that tells how the head is placed.
scope: A feeling system in the inner ear that tells how the head is placed; equilibrium, labyrinthine
  sense, sense of balance and sense of equilibrium are other names for this sense; not sight and not hearing.
examples:
- The vestibular sense tells you how your head is placed.
- Damage to the vestibular sense can make you feel dizzy.
