simpleMeaning: A fine plant with large flat leaves striped in reddish-purple and flowers with a bunch
  of long yellow stamens in a coral-red cup of fleshy leaf-like parts; from South Africa.
scope: 'Also called Haemanthus coccineus: a fine plant with large flat leaves and coral-red flower cups,
  not a true tulip and not a garden flower.'
examples:
- Cape tulip bloomed coral-red in the South African garden.
- The Cape tulip leaves lay flat and striped on the ground.
