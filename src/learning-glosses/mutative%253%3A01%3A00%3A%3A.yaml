simpleMeaning: This word is used for a thing that shows a change in the genes, or has to do with one
scope: Said of a thing that has to do with a change in the genes, not the change itself and not the thing
  that brings it on.
examples:
- The mutative processes of nature slowly change the genes of living things.
- Scientists study mutative changes in the genes of the fruit fly.
