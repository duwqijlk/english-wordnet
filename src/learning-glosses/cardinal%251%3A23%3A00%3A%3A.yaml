senseId: 'cardinal%1:23:00::'
synsetId: 13618828-n
simpleMeaning: In maths, the number of things in a set (a group of things thought of together); it shows
  how many, not the order they come in
scope: This is the number itself, the number that shows how many things are in a set. It is not the describing
  word used in 'cardinal number', and not the red color or the red bird of the same name.
examples:
- For the set of three books, the cardinal is three.
- The cardinal of the set of chairs in the room is six.
