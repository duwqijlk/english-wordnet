simpleMeaning: A plant with grey leaves that grows on the east coast of North America and is grown to
  make gardens look nice
scope: A plant with grey leaves from the east coast of North America, also called beach wormwood and dusty
  miller; not a woman of many years and not other grey-leaf plants grown for food.
examples:
- Old woman grows wild along the east coast of North America.
- She planted old woman in the garden for its grey leaves.
