simpleMeaning: A series of notes, one after another, that forms a pattern easy to tell apart.
scope: A set of notes, one after another, that you can tell apart, also called air, line, melodic line,
  melody, strain and tune; not a single note and not the words of a song.
examples:
- He played the opening melodic phrase on the piano twice.
- The melodic phrase at the end of the verse repeats three times.
