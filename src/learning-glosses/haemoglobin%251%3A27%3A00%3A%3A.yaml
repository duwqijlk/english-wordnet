simpleMeaning: Chiefly carrying oxygen from the lungs to the body's tissues, this protein in red blood
  cells, made of globin and heme, gives them their red colour.
scope: Also called hemoglobin, this is the protein that makes red blood cells red and carries oxygen round
  the body.
examples:
- Haemoglobin in her blood carried oxygen from her lungs to her muscles.
- Low haemoglobin left him pale and short of breath.
