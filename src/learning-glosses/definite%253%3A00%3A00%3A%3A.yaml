simpleMeaning: clear, exact and openly stated, leaving no doubt about what is meant
scope: This is about clear, exact wording or limits, not the sense meaning known for certain; the similar
  adjective definitive can also mean clearly defined or formulated, though it is a different word and
  often means final or authoritative.
examples:
- We need a definite date for the meeting.
- The contract sets a definite limit on hours.
