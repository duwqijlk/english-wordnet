simpleMeaning: like a fork in shape, split into two parts that go in different ways
scope: 'Also called forked, branched, bifurcate, biramous, forficate, and fork-like: split into two parts,
  not having sharp pointed parts.'
examples:
- The river was pronged, splitting into two streams around the island.
- A pronged path led to the left and to the right through the wood.
