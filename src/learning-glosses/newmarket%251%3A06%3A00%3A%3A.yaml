simpleMeaning: A long coat that fits close to the body, worn for riding in the 1800s.
scope: A long coat that fits close to the body, worn for riding in the 1800s, not a short riding jacket
  and not a coat worn for everyday dress.
examples:
- He wore a long newmarket for the morning ride.
- The newmarket coat fitted close and reached below his knees.
