simpleMeaning: a horn for music made from a ram's horn, blown by the Israelites long ago to warn or call
  people, and still blown in synagogues on solemn days
scope: Also called a shofar; a ram's-horn trumpet of old Israel, not a brass trumpet and not a modern
  horn.
examples:
- The shophar sounded through the synagogue on the holy day.
- Long ago the shophar called the people together when danger came.
