simpleMeaning: A leaf or another part of a plant can change so insects, mites, or fungi can shelter in
  it.
scope: This is a part of a plant that has changed to shelter insects, mites, or fungi, not the whole plant.
examples:
- The domatium on the leaf gave the mites a safe place.
- Insects found shelter in the domatium.
