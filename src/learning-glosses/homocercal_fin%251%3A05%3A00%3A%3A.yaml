simpleMeaning: Past the end of the backbone runs a tail fin in two even halves, as in most fish with bones.
scope: It is the tail fin itself, not the word that describes such a tail.
examples:
- The homocercal fin of the trout has two even halves.
- The fish swam with its homocercal fin.
