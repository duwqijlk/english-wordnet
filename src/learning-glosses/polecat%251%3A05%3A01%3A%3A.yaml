simpleMeaning: A dark brown animal of the weasel family, living in the woods of Europe and Asia, that
  gives off a bad smell when something threatens it.
scope: Also called a fitch, foulmart, or foumart, a dark brown animal of the weasel family from the woods
  of Europe and Asia that gives off a bad smell when threatened.
examples:
- The polecat sprayed a foul smell when the dog came near.
- A polecat crossed the woodland path at dusk.
