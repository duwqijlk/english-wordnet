simpleMeaning: Any of several kinds of squash plant grown for its long fruit, with smooth dark green skin
  and pale flesh.
scope: A squash plant grown for its long green-skinned fruit; marrow and marrow squash are other names
  for this sense; not a pumpkin and not a cucumber plant.
examples:
- We grew vegetable marrow in the garden for its long green fruit.
- She sliced the vegetable marrow and cooked it with herbs.
