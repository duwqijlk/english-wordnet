simpleMeaning: Well made and in good condition, with a strong structure.
scope: Describes a building or object that is strongly put together, not one that is merely of decent
  quality and not one that resists pressure when pushed.
examples:
- The house sits on a solid foundation of poured concrete.
- The old barn is still solid after a hundred years.
