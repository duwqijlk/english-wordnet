simpleMeaning: a plant disease that makes leaves and stems turn red-brown, caused by different kinds of
  fungi
scope: A disease of plants that turns leaves and stems red-brown, not the red-brown coat on iron and not
  the fungi that cause the disease.
examples:
- Rust spread over the wheat leaves and turned them brown.
- The farmer lost much of his crop to rust this year.
