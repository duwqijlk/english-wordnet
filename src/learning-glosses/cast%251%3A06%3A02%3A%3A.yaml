simpleMeaning: A stiff shell of plaster or similar material worn over a broken bone to keep it still while
  it heals.
scope: This is the stiff medical support worn over a broken bone, not the pouring of metal into a mould
  or the object that comes out of one.
examples:
- She had to keep the cast on her arm for six weeks.
- The doctor put a cast on his broken leg.
