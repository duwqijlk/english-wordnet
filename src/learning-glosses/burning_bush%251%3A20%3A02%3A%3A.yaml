simpleMeaning: Purple cases holding scarlet seeds grow on this shrub, which loses its leaves each year.
scope: This shrub, also called a wahoo, bears purple cases holding scarlet seeds and is not the thickly
  branched plant whose leaves turn purple-red in autumn.
examples:
- The burning bush lost its leaves when autumn came.
- She planted a burning bush beside the fence.
