simpleMeaning: a plan of the Soviet government that let people talk more freely about problems in society
scope: This is the Soviet plan that let people talk more freely about problems in society, not a plan
  to change the whole government or the way goods are bought and sold.
examples:
- Under glasnost, newspapers began to print criticism of local leaders.
- Glasnost let people speak openly about housing and food shortages.
