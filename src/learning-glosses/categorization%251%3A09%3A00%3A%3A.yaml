senseId: 'categorization%1:09:00::'
synsetId: 05740701-n
simpleMeaning: The mind's basic way of sorting things into kinds.
scope: This sense is also called sorting and classification, for the mind's basic way of sorting things
  into kinds, where sorting is the basic way the mind sets things into groups or kinds, unlike the sense
  for the act of handing things out into classes or kinds of the same type, and unlike the sense for a
  group of folk or things set out by class or kind.
examples:
- Categorization sorts things into kinds.
- The mind's categorization puts things in groups.
