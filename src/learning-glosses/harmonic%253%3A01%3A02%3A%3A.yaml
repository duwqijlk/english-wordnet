simpleMeaning: about the higher musical tones that sound with a main tone, when each one moves back and
  forth a whole number of times as fast as the main tone
scope: About the higher tones that go with a main tone, not about harmony in music in general and not
  about a sound being pleasant and in tune.
examples:
- The harmonic tones were clear above the main note.
- She studied the harmonic pattern made by the string.
