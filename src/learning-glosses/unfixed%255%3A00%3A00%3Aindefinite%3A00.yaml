simpleMeaning: Not fully formed or clear, and not exact in what it holds
scope: Also called nebulous, this means ideas or content that are not clear or exact; it is not about
  a thing that has not been repaired or held in place.
examples:
- She held unfixed notions about what a good leader should be.
- His reasons were unfixed, with no clear shape or detail.
