simpleMeaning: an event in which people take turns saying the letters of a word, and a player is out after
  one wrong word
scope: An event in which people say the letters of a word in turn and are out after one wrong word; also
  called spelldown and spelling bee; not a written test and not a quiz about word meanings.
examples:
- The spelling contest drew pupils from ten schools.
- She came second in the spelling contest last spring.
