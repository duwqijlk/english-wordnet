simpleMeaning: Any tiny hole that lets a liquid, or a gas, pass through it.
scope: Any tiny hole that lets liquid or gas pass through, not only the tiny holes in the skin of a leaf
  or stem.
examples:
- Sweat leaves the body through the pores of the skin.
- The stone is full of tiny pores that let water through.
