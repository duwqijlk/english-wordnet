simpleMeaning: a person at a racing track who looks for winning slips from the shared betting pool that
  others have thrown away without care
scope: A person at a racing track who looks for winning slips others have thrown away without care; not
  a cleaner and not a person who places bets.
examples:
- The stooper picked up a winning ticket from the floor.
- A stooper at the track found a slip worth fifty dollars.
