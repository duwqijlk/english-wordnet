simpleMeaning: A member of a Slavic people of southern European Russia, Ukraine, and nearby Asia, famed
  for horsemanship and war skill; they formed an elite cavalry force in czarist Russia.
scope: A member of this people, not a Russian soldier of any kind, and not a horseman of another land.
examples:
- The Cossack rode swiftly across the steppe.
- Cossacks formed an elite cavalry force in czarist Russia.
