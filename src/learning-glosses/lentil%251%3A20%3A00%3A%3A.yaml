simpleMeaning: A widely grown Eurasian plant that completes its life in one season, whose flat seeds are
  cooked like peas or ground into meal, and whose leafy stalks feed livestock.
scope: This is the growing plant, not the round flat seed sold as food; lentil plant is another name for
  the same crop.
examples:
- The lentil plants stood knee-high, their flat pods still green.
- Farmers grow lentil for its seeds and use the leafy stalks as fodder.
