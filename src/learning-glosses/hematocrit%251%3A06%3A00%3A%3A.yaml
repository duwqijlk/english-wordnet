simpleMeaning: Spinning blood fast is how this tool usually finds how much of it is cells and how much
  is liquid.
scope: People also call this tool haematocrit, and it measures the share of cells in blood rather than
  being the share itself.
examples:
- A hematocrit showed how much of his blood was cells.
- A hematocrit spins the blood fast and shows how much of it is cells.
