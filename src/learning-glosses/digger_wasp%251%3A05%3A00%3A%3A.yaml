simpleMeaning: Insects left still and helpless are stored in a nest in the ground by this lone wasp, for
  its young to feed on
scope: A lone wasp that digs a nest in the ground, not a wasp that lives in a big nest with others.
examples:
- A digger wasp dragged the insect into its nest in the soil.
- We watched a digger wasp digging in the dry ground.
