simpleMeaning: A South American begonia with fibrous roots, prominent lobes at the base of its leaves
  that look like angels' wings, and sprays of coral-red flowers.
scope: This is the South American species with wing-shaped leaf lobes and coral-red flower sprays, not
  the many related plants with differently shaped leaves or other flower colors.
examples:
- The angel-wing begonia on the windowsill has leaves shaped like folded wings.
- Coral-red flowers hung in loose sprays above the angel-wing begonia's leaves.
