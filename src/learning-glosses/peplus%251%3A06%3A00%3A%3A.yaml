simpleMeaning: A piece of clothing that hangs in folds down to the waist, it was worn by women in ancient
  Greece and fastened at the shoulders.
scope: Also called peplos and peplum, it is the piece of clothing worn by women in ancient Greece, fastened
  at the shoulders and hanging in folds down to the waist.
examples:
- The peplus draped in folds to the waist.
- She fastened her peplus at the shoulders.
