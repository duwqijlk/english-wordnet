simpleMeaning: Now at home in North America, this low flat herb of Europe bears small yellow flowers and
  bent black pods.
scope: Also called black medick, nonesuch clover, and yellow trefoil, it is a low flat herb of Europe
  now at home in North America, not the Irish clover with the same name.
examples:
- Hop clover grew low.
- Hop clover now grows in North America too.
