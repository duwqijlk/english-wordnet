senseId: 'decimal_number_system%1:10:00::'
synsetId: 06823648-n
simpleMeaning: A way of counting in which a sign is worth more or less by where it stands, and ten is
  the base
scope: This is a way of counting by place value with ten as the base, also called the decimal numeration
  system and the decimal system; not counting by twos, and not Roman numerals, which have no place value.
examples:
- We use the decimal number system every day when we count in tens.
- In the decimal number system, the 3 in 30 is worth ten times the 3 in 3.
