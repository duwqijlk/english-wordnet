simpleMeaning: to send out rays, real ones or ones in the mind, as when a person sends out joy
scope: To send out rays, real ones or ones in the mind, not to come out in rays by itself, not to feel
  happy inside, and not to spread out from a middle point.
examples:
- She radiates happiness wherever she goes.
- The lamp radiated a warm light.
