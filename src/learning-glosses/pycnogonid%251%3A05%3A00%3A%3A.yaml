simpleMeaning: A small sea animal like a spider, with a thin body and long thin legs, that lives in the
  sea
scope: 'Another name for a sea spider: a small sea animal like a spider that lives in the sea, not a true
  spider on land and not a crab.'
examples:
- The pycnogonid crept across the rock with its long thin legs.
- We saw a pycnogonid moving slowly over the sea floor.
