simpleMeaning: an act the body does without control, pushing gas noisily from the stomach out through
  the mouth
scope: 'Also called belch, burp, and burping: gas pushed noisily from the stomach out of the mouth, not
  throwing up food and not gas that leaves the body the other way.'
examples:
- His belching after the fizzy drink made everyone at the table laugh.
- The baby's belching stopped once the gas had come up.
