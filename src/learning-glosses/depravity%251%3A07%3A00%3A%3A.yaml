simpleMeaning: a state of being very bad in what is right and wrong, where good character and good rules
  for life are harmed
scope: 'Also called corruption, degeneracy, depravation, and putrefaction: this is a state of being very
  bad in right and wrong, not just one bad act or practice.'
examples:
- The book tells how the town fell into depravity, with lying and stealing everywhere.
- He shocked people with the depravity of his life, doing wrong without shame.
