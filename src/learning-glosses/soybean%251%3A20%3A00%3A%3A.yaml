simpleMeaning: A bushy, hairy annual plant with leaves in threes and pink to purple blooms, grown for
  food, feed and soil improvement, chiefly for its nutritious oily seeds; native to Asia.
scope: This is the growing plant, not the edible bean sold as food or the seed processed for oil.
examples:
- Soybean is sown in spring and harvested when the pods turn brown.
- The soybean grows upright and bushy, reaching about a meter in height.
