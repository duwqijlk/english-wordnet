simpleMeaning: A relatively small sum of money you give someone who has served you, such as a waiter.
scope: It is money for a service, not the pointed end of something, not a useful hint or piece of advice,
  and not a mountain top; gratuity, pourboire, baksheesh, bakshish, bakshis and backsheesh are other names.
examples:
- He left a generous tip on the table.
- She gave the taxi driver a tip for helping with the bags.
