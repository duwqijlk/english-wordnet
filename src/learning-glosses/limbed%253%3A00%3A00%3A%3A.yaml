simpleMeaning: having arms or legs, most often of a kind that is named, or seeming to have them; usually
  used only as part of a longer word
scope: Having arms and legs of a stated kind, usually only in combined words; not a word for a tree branch.
examples:
- The strong-limbed athlete lifted the heavy box with ease.
- A long-limbed dancer moved across the stage.
