simpleMeaning: Small folds in the throat shake to make this sound, and the echo in the throat and mouth
  shapes it.
scope: Also called voice, vocalisation, vocalism, vocalization, and vox, it is what the shaking folds
  in the throat make, shaped by the echo in the throat and mouth.
examples:
- A singer takes good care of his phonation.
- The giraffe cannot manage phonation at all.
