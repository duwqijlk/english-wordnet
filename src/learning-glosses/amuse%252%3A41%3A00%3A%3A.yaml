simpleMeaning: to keep a person busy in a fun and pleasant way
scope: This is keeping a person happily busy with something fun and pleasant; not the sense of making
  a person laugh.
examples:
- The clown amused the children with songs and games all afternoon.
- She amused herself by reading a funny book while she waited.
