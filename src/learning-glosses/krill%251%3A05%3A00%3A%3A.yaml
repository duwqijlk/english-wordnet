simpleMeaning: small sea animals like shrimp, with a hard outer covering, that drift in the water; a main
  food for baleen whales (large whales that take food from the water)
scope: This names the small sea animals themselves, not the whales that eat them and not shrimp caught
  for people to eat.
examples:
- Blue whales eat huge amounts of krill each day.
- Fishermen found krill in the cold water near the ice.
