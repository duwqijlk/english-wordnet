simpleMeaning: This bush of the east of North America sheds its leaves in the cold months and bears small
  yellow blooms on bendy branches with soft bark.
scope: 'It is also called leatherwood, moose-wood, ropebark and wicopy: a bush of eastern North America
  that sheds its leaves in the cold months, not the maple of the same name.'
examples:
- The moosewood sheds its leaves in the cold months.
- Moosewood branches bend without breaking.
