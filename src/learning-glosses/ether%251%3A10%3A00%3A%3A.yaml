senseId: 'ether%1:10:00::'
synsetId: 06265492-n
simpleMeaning: something people once thought filled all of space and carried the waves that bring light
  and radio
scope: Something people once believed filled all of space, not the liquid used to put people to sleep,
  not a chemical made of two parts joined by oxygen, and not the fifth element of old stories.
examples:
- In the old days, scientists thought ether filled the space between the stars.
- No one now believes ether carries light across space.
