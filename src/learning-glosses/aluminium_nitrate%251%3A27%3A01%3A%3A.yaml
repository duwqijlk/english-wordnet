simpleMeaning: A salt made from aluminium and nitric acid that usually occurs as water-containing crystals,
  most often with nine water molecules per salt unit.
scope: The chemical salt of aluminium and nitric acid, not the metal aluminium itself and not another
  nitrate such as ammonium nitrate.
examples:
- Aluminium nitrate dissolves readily in water to form a clear solution.
- The laboratory stores aluminium nitrate in a sealed jar.
