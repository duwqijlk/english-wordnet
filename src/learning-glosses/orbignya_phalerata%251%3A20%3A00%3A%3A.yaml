simpleMeaning: A tall palm with feather-like leaves, from north Brazil, with hard-shelled nuts that give
  rich oil and a kind of plant ivory.
scope: Also called babassu, babassu palm, coco de macao, Orbignya martiana and Orbignya spesiosa, it names
  the tall north Brazilian palm whose hard-shelled nuts give rich oil and a kind of plant ivory.
examples:
- Orbignya phalerata grew tall in the north of Brazil.
