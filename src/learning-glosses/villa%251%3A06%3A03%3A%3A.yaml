simpleMeaning: a house on the edge of a town, standing on its own or joined to just one other house
scope: A single or paired house in the suburbs, not a large country house with big grounds and not a Roman
  country house with farm buildings.
examples:
- They bought a small villa on the edge of town.
- Her villa stands on its own at the end of the street.
