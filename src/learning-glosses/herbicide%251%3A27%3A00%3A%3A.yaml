simpleMeaning: a chemical that kills plants or stops them from growing
scope: A chemical used to kill plants or stop their growth, also called weedkiller. It is not a chemical
  used to kill insects.
examples:
- The farmer sprayed herbicide on the field to kill the weeds.
- This herbicide stops young plants from growing among the crops.
