simpleMeaning: a concern with what goes on inside a person, above all with questions of right and wrong
  or of belief
scope: A concern with what goes on inside a person, above all with questions of right and wrong or of
  belief, also called inwardness; not a concern with outward behaviour and not a concern with wealth.
examples:
- His internality showed in his constant talk of conscience.
- The novel's internality lies in its study of the hero's beliefs.
