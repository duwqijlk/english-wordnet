simpleMeaning: The way a thing keeps stopping and starting again, with breaks in between
scope: The way a thing keeps stopping and starting again, also called intermittency; not a steady flow
  that never stops.
examples:
- The intermittence of the rain made it hard to plan the day.
- We grew used to the intermittence of the old radio signal.
