simpleMeaning: a large, richly made volume meant to be left out on show in a living room
scope: This is a large, richly made volume made to be shown off in a living room; not a small book for
  reading in bed and not a plain book of words.
examples:
- She bought a coffee-table book full of photos of the sea to leave in the living room.
- The coffee-table book was too big to fit on the shelf, so it stayed out on show.
