simpleMeaning: the downward pull of gravity on an object, which makes it feel heavy.
scope: This is the force of gravity on an object, not a gym object you lift and not how important something
  is.
examples:
- The weight of the box made it hard to carry.
- On the Moon, your weight is much less than on Earth.
