simpleMeaning: a group of players who play only wind tools made of yellow metal and things hit to make
  a beat
scope: A group of players who play only wind tools made of yellow metal and things hit to make a beat,
  not a band of all kinds of tools and not one player alone.
examples:
- The brass band played in the park on Sunday.
- A brass band led the march through the town.
