simpleMeaning: like cheese in look or feel, said of body tissue that is hurt or dead
scope: Like cheese, said of hurt or dead body tissue, not of fresh healthy tissue and not of food.
examples:
- The caseous mass in the lung looked like soft cheese.
- The doctor noted the caseous tissue around the old wound.
