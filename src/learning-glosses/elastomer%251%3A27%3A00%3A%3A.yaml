simpleMeaning: Any of several stretchy stuffs like rubber that spring back to their first shape when the
  pull or push stops.
scope: Any of several stretchy stuffs like rubber that spring back to their first shape, not hard plastic
  and not cloth.
examples:
- Rubber is an elastomer.
- The seal is made of an elastomer.
