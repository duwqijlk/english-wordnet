simpleMeaning: A sharp tingling feeling caused by poor flow of blood.
scope: A sharp tingling feeling when blood stops moving well, not pain from a cut and not the numb feeling
  of a limb that has gone to sleep.
examples:
- Pins and needles ran through my foot after I sat on it too long.
- The pins and needles in her hand faded as the blood came back.
