simpleMeaning: showing that you blame someone for doing wrong, especially in a way meant to help them
  do right
scope: 'Also called reproachful, admonitory and admonishing: this shows blame meant to set someone right,
  not praise and not blame said only in anger.'
examples:
- She gave him a reproving look when he spoke out of turn.
- His reproving tone told the boys that their joke had gone too far.
