senseId: 'thinness%1:07:01::'
synsetId: 05110948-n
simpleMeaning: the fairly small size through an object, from one side to the other, not along its length
  or its width
scope: How small an object is through it, from side to side; not how few things there are or how spread
  out they are.
examples:
- The thinness of the rope made it easy to tie.
- She was surprised by the thinness of the sheet of ice.
