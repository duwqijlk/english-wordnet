simpleMeaning: A spiced baked sweet, sweetened in part with the thick sweet stuff bees make
scope: A spiced baked sweet, sweetened only in part with the thick sweet stuff bees make; not a plain
  baked sweet, and not one sweetened with sugar alone.
examples:
- We cut the honey cake into thick slices for tea.
- Her honey cake was dark with spice and only partly sweet.
