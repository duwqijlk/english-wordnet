simpleMeaning: A tool that shows whether two beats that repeat are in step, especially one letting a pilot
  bring a plane's airscrews, two engines or more, into step.
scope: This sense is also called synchronizer, synchronoscope, and synchroscope.
examples:
- A synchroniser showed the beats in step.
- Synchronisers help pilots.
