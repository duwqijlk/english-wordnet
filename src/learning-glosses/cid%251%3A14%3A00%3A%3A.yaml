simpleMeaning: The main law arm of the United States Army, in charge of looking into crimes at every level
  of the Army, in any land.
scope: Not the civil police, nor the military police on guard duty; also called the Criminal Investigation
  Command and the United States Army Criminal Investigation Command.
examples:
- The CID looked into the theft at the base.
- CID agents flew in from abroad.
