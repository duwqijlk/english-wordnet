synsetId: 14115007-n
simpleMeaning: A disease, seen in children, in which tissue in the rear and side columns of the spinal
  cord hardens, with weak muscles and an unsteady walk.
scope: A medical term for hardened tissue in certain spinal cord columns, with weak muscles and an unsteady
  walk in children, not multiple sclerosis and not poor coordination from another cause.
examples:
- The child's hereditary spinal ataxia first showed up as a clumsy, swaying walk.
- Doctors told the family that hereditary spinal ataxia was slowly weakening her legs.
