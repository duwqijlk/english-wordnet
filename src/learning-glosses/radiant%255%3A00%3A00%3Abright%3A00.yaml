simpleMeaning: Bright with light that pours out, or that seems to pour out
scope: Bright with light that pours out, not shining in quick, broken flashes as in the twinkling sense.
examples:
- The sun was radiant in the clear morning sky.
- The sunrise was radiant, filling the sky with gold.
