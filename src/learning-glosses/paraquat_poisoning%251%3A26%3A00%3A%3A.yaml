simpleMeaning: Harm that grows worse in the food pipe, the liver and the kidneys is the mark of a bad
  state that comes from swallowing a weed-killing chemical.
scope: Swallowing a weed-killing chemical brings on this harm, which grows worse in the food pipe, the
  liver and the kidneys.
examples:
- He suffered paraquat poisoning after swallowing the weed killer.
- Paraquat poisoning damaged his food pipe and liver.
