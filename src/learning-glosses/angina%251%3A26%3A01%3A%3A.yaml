simpleMeaning: A heart trouble that brings sudden fits of pain in the chest, when the heart gets too little
  oxygen.
scope: 'Also called angina pectoris: a heart trouble with sudden fits of chest pain from too little oxygen,
  not a throat disease with attacks of choking pain.'
examples:
- He felt the angina grip his chest as he climbed the stairs.
- Angina left her with a sharp pain in her chest after the walk.
