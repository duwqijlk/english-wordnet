simpleMeaning: A court decision entered when a debtor admits the debt in writing, so the case ends without
  paying for full legal steps
scope: A court decision entered when a debtor admits the debt in writing, also called cognovit judgement,
  cognovit judgment, and confession of judgement, not a court decision after a trial and not a private
  deal.
examples:
- A confession of judgment lets a lender skip a long trial.
- She signed a confession of judgment and the case closed at once.
