simpleMeaning: His ideas, and Aristotle the Greek thinker himself, are what this word is about
scope: Also called Aristotelean and Aristotelian, and another name for it is peripatetic; not a follower
  of Aristotle, but of or relating to him and his ideas.
examples:
- Aristotelic logic is named for the Greek thinker.
- The Aristotelic view puts form at the heart of things.
