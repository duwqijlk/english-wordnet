simpleMeaning: the part of a shirt that faces forward, usually the part a jacket leaves uncovered
scope: This is the real front part of a shirt itself, not the separate piece a man can put on to look
  like a shirt front.
examples:
- He spilled soup on his shirtfront at lunch.
- Her shirtfront was wet from the rain.
