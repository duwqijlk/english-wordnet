simpleMeaning: Natural caramel, drink got from wine, and drink got from fruit go into a strong drink made
  by soaking the fruit of the mountain ash tree.
scope: It is also called rowan berry vodka and rowan vodka, and it is a strong drink made by soaking mountain
  ash fruit, not a plain vodka.
examples:
- This rowanberry vodka goes well with game.
- A small glass of rowanberry vodka is a strong drink.
