simpleMeaning: To mark a measuring tool so that its scale shows the units you want
scope: To mark a measuring tool's scale for the units you want, not to make small changes to it for best
  measuring and not to measure the size of something.
examples:
- He calibrated the thermometer for the Celsius scale.
- She calibrated the tool so its scale could be read in inches.
