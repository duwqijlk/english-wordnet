simpleMeaning: a servant in a kitchen who does the low, simple jobs, especially washing
scope: This is the kitchen worker who does the low jobs such as washing, not the cook who makes the food.
examples:
- The scullion washed pots all day in the kitchen.
- In the old house, a young scullion cleaned and washed for the cook.
