simpleMeaning: To go against a law, rule, deal, or promise, paying it no heed
scope: 'Also called break, offend, and breach: going against a law, rule, deal, or promise, not ruining
  a place, not failing to match a pattern, and not spoiling a holy place.'
examples:
- They violated the law by building on the land.
- He violated his promise and never came back.
