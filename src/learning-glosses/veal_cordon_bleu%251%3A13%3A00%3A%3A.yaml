simpleMeaning: Cheese and ham fill thin slices of young cow meat in this dish, which are then fried quickly
  in a pan.
scope: Among dishes of thin slices of meat with a filling, this one fills young cow meat with cheese and
  ham and fries it quickly in a pan.
examples:
- The veal cordon bleu came with cheese and ham inside each thin slice.
- The thin slices of veal cordon bleu were fried quickly in a pan after the cheese and ham went inside.
