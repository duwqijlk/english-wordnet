senseId: 'frostbite%1:26:00::'
synsetId: 14318180-n
simpleMeaning: damage to skin and flesh caused by freezing cold, with a prickly feeling, blisters, and
  possibly gangrene (flesh dying and turning black)
scope: 'Also called cryopathy: harm to the body from freezing cold, not just feeling cold or having pale,
  cold skin for a short time.'
examples:
- After hours in the snow, he had frostbite on his toes, and the skin had blisters.
- Frostbite can kill the flesh in your fingers if you stay out in freezing cold too long.
