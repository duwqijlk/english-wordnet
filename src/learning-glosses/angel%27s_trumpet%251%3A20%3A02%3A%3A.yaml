simpleMeaning: Its very large flowers, shaped like long horns, give off a sweet smell at night, and this
  South American plant is grown for them.
scope: This is the South American plant grown for very large flowers that smell sweet at night, not the
  close kind whose large flowers smell sweet at any time.
examples:
- The angel's trumpet opened its huge flowers after dark.
- She planted an angel's trumpet for its sweet smell at night.
