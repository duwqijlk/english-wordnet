simpleMeaning: An inflammatory disease of skin and muscle making limb and neck muscles weak, painful and
  swollen, with a rash on the face, eyelids, neck, chest and limbs; its course varies.
scope: An illness that inflames both muscle and skin, bringing weakness, pain and a rash; it is not a
  muscle-only inflammation, and not an inherited wasting disease of the muscles.
examples:
- She was diagnosed with dermatomyositis after months of weak, aching muscles and a rash on her eyelids.
- Dermatomyositis can affect children and adults, and how quickly it develops differs from one person
  to another.
