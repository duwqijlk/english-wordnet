simpleMeaning: Say something forcefully and with strong feeling.
scope: This is about words spoken with force, not sending a smile or a look toward someone and not sending
  an object through the air.
examples:
- She threw insults at him until he walked out.
- The crowd threw accusations at the minister as she left.
