simpleMeaning: a muscle that works on its own, with no thought needed, in the walls of inner body parts
  like the stomach, gut, bladder, and blood vessels, not the heart
scope: 'Also called smooth muscle: a muscle that works on its own in the walls of inner body parts, not
  a muscle moved by thought and not the heart muscle.'
examples:
- The involuntary muscle in the wall of her stomach kept working while she slept.
- An involuntary muscle tightens the blood vessels without any thought from us.
