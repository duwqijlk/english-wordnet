simpleMeaning: a piece of writing or other work that copies someone's style but shows it in a false way,
  usually to make people laugh
scope: 'Also called mockery, parody, travesty, burlesque, spoof, lampoon, and pasquinade: a work that
  copies and twists someone''s style for fun, not a plane leaving the ground and not just copying how
  a person speaks or acts in person.'
examples:
- His takeoff of the famous singer's songs made the whole room laugh.
- She wrote a takeoff of the poet's style, changing his serious lines into jokes.
