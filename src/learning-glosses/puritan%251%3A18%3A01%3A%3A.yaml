simpleMeaning: One too set on seemliness and good form.
scope: This sense is also called a prude, for one too set on seemliness and good form, unlike the sense
  for one who holds to strict godly rules, one set against fleshly joys.
examples:
- The puritan was too set on seemliness.
- Puritans are too set on good form.
