simpleMeaning: a machine with turning blades that turns the push of a moving fluid into power
scope: A machine whose turning blades change moving water, steam or air into power, not a plain wheel
  and not a motor that burns fuel.
examples:
- The turbine spins as water rushes past its blades.
- A wind turbine on the hill made power for the farm.
