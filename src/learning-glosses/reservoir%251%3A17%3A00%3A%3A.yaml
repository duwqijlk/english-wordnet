simpleMeaning: a germ that causes sickness lives and grows inside this person, animal, plant or stuff,
  as its usual home
scope: 'Also called source: a living thing or material where a germ that causes infection normally lives
  and breeds, not a tank that stores water or oil.'
examples:
- An infectious agent depends on a reservoir for its survival.
- The reservoir of the illness turned out to be a small forest animal.
