simpleMeaning: Said of a shape that splits into two matching halves no matter where the cut runs from
  top to bottom through its middle.
scope: Also called actinomorphic, this word tells you a shape can be split through its middle and both
  sides will match.
examples:
- The actinomorphous bloom split into two matching halves when it was cut down the middle.
- Botanists call the flower actinomorphous because any cut through its middle gives matching halves.
