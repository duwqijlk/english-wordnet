simpleMeaning: Breaking a rule or right that belongs to someone else, or stepping into their private life
  with no right to do so
scope: To step into what belongs to someone else or break a rule or right that is theirs, also called
  invade, encroach upon and intrude on; not simply to ask a question and not to help.
examples:
- The new colleague obtruded upon my work by taking over my desk.
- Please do not obtrude upon her privacy with questions.
