simpleMeaning: Making up or using ideas that try to explain how things work
scope: Making up or using ideas that explain how things work; theorisation is another name for this sense;
  not testing ideas by doing tests and not a single idea on its own.
examples:
- His theorization of the market took years.
- The theorization gave a clear shape to the findings.
