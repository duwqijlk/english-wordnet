simpleMeaning: The third great meeting of church leaders, in 431, which called Mary the mother of God
  and condemned Pelagius.
scope: The third great meeting of church leaders, in 431, which called Mary the mother of God and condemned
  Pelagius, also called Ephesus; it is the third such meeting, not the fourth.
examples:
- The Council of Ephesus met in 431 and condemned Pelagius.
- The Council of Ephesus declared Mary the mother of God.
