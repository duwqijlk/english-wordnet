senseId: 'contrarily%4:02:02::'
synsetId: 00249448-r
simpleMeaning: In a way that goes against, and will not obey.
scope: This sense is also called perversely and contrariwise, for acting in a way that goes against, and
  will not obey, unlike the sense for what runs against what was looked for.
examples:
- He acted contrarily, going against orders.
- Contrarily, she would not obey.
