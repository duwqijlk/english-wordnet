simpleMeaning: a loud speech in which someone speaks in a big, showy way with strong feeling
scope: 'Also called rant and ranting: a loud, showy speech full of strong feeling, not a quiet talk and
  not the act of speaking to someone in this way.'
examples:
- The leader gave a long harangue against the new law.
- We had to listen to his angry harangue for an hour.
