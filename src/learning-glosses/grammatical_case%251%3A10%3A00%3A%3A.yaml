simpleMeaning: In grammar, the form of a noun, pronoun or adjective, often shown by a change in ending,
  that shows how it links to other words in a sentence
scope: In grammar, the form of a noun, pronoun or adjective that shows how it links to other words in
  a sentence; also called case, not a word's meaning and not a tense.
examples:
- In the sentence, the grammatical case of the noun shows its job.
- Latin marks grammatical case by changing word endings.
