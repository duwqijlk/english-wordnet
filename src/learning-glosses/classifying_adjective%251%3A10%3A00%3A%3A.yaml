simpleMeaning: A word that puts its noun into a kind, as in 'a nervous disease' or 'a musical instrument'
scope: Also called relational adjective, this is a word that puts its noun into a kind.
examples:
- In 'a nervous disease', the classifying adjective 'nervous' puts the noun into a kind.
- A classifying adjective tells what kind of thing the noun is.
