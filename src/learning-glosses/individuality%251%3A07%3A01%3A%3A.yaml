simpleMeaning: the way one person is different from others in character, seen as staying the same over
  time
scope: 'Also called identity and personal identity: the character that makes one person different and
  stays over time, not just the fact of being separate from others.'
examples:
- Joining the army did not take away his individuality; he still thought and acted in his own way.
- Her clothes and jokes showed her individuality, the same strong character we had known for years.
