simpleMeaning: letters and signs that tell others who you are when you send word through the system that
  carries notes between computers
scope: A name that marks who you are when you send word through the mail system, not the whole mail system
  itself; also called email, e-mail address and email address.
examples:
- Please send your reply to my e-mail and I will get back to you.
- Her e-mail is printed at the foot of the letter.
