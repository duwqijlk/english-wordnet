simpleMeaning: to put a dead body into the long box used when a body is buried or burned
scope: This is the act of putting a dead body into its box, for burial or burning; it is not the box itself,
  which is the noun sense.
examples:
- Her body was coffined the day before the funeral.
- They coffined the old king and carried him to the church.
