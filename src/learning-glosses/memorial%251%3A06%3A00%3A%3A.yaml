simpleMeaning: A building or other raised thing put up so people will keep a person or event in mind.
scope: Also called a monument, this is a thing put up to keep a person or event in mind, not a written
  statement of facts sent with a plea to those in charge.
examples:
- They built a memorial for the soldiers who died in the war.
- A memorial stands in the town square.
