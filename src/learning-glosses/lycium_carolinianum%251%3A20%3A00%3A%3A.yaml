simpleMeaning: A thorny green shrub that keeps its leaves through winter, from the south-east of the United
  States, with wide-spreading branches, mostly blue or mauve flowers and red berries.
scope: 'Also called Christmas berry and Christmasberry: a thorny evergreen shrub with blue or mauve flowers
  and red berries, not other thorny shrubs with red berries.'
examples:
- Lycium carolinianum grew by the fence, its red berries bright among the green leaves.
- We planted Lycium carolinianum for its blue flowers and red berries.
