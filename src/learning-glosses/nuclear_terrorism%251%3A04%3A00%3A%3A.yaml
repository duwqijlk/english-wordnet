simpleMeaning: Use of an atom device by a group that uses fear and force to cause ruin, or use or threat
  of use of split-able atom stuff that gives off rays
scope: The use of an atom device by a group that uses fear and force to cause great ruin; not war by armies,
  and not a threat with plain guns.
examples:
- The police feared an act of nuclear terrorism at the plant.
- Nuclear terrorism is a threat the whole world fears.
