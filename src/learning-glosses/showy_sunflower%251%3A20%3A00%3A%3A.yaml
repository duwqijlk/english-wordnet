simpleMeaning: a tall plant that comes back year after year, with rough leaves and a few big flower heads,
  found in the middle of the United States
scope: A tall plant of the middle United States with rough leaves and a few big flower heads; not a common
  garden sunflower and not a low plant that lives for one year only.
examples:
- A showy sunflower grew tall beside the fence.
- We saw a showy sunflower with big flower heads in the middle of the United States.
