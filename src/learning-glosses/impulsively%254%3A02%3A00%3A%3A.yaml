simpleMeaning: in a way that shows a person acts at once on a sudden wish and does not take care to stay
  safe
scope: 'Also called impetuously: acting at once on a sudden wish without care first, not acting after
  slow thought and not acting in a planned way.'
examples:
- He impulsively bought the red car without checking its price.
- She impulsively ran across the road and nearly fell.
