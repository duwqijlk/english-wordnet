simpleMeaning: Outside the south of Russia, it grows in Eurasia, and in the north of North America.
scope: Also called wood horsetail; it is one of the horsetails, the one that grows in Eurasia outside
  the south of Russia and in the north of North America.
examples:
- Equisetum sylvaticum grows in the woods of northern North America.
- In Eurasia, Equisetum sylvaticum grows outside the south of Russia.
