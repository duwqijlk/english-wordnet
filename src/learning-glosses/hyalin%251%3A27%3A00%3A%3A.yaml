simpleMeaning: A clear glass-like substance found in smooth joint tissue or in some skin states
scope: This is a clear glass-like substance found in smooth joint tissue or in some skin states; hyaline
  is another name for this sense, not a hard bone and not a liquid.
examples:
- Hyalin was found in the smooth joint tissue.
- The doctor noted hyalin in the skin sample.
