simpleMeaning: To let a watery fluid out through the small openings in your skin.
scope: The body's act of giving off liquid through skin pores, not the salty fluid itself (the noun),
  the moisture that forms on a cold surface, or hard work; perspire and the rare sudate are other names
  for this sense.
examples:
- He began to sweat as the sun rose higher.
- She sweats heavily when she runs.
