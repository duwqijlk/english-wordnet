simpleMeaning: A small tree of West Indies and Florida, with large odd leaves split into leaflets and
  red-striped purple-to-white flower clusters, then showy curly winged seed pods; it yields fish poisons.
scope: Also called fish fuddle, Jamaica dogwood, and Piscidia piscipula; a small tree of the West Indies
  and Florida that yields fish poison, not a timber tree and not a fruit tree.
examples:
- Piscidia erythrina grows in Florida and the West Indies.
- Piscidia erythrina yields a poison used in fishing.
