simpleMeaning: The slow moving and shaping of the great land masses, as the science of moving plates describes
  it.
scope: The slow moving and shaping of the great land masses, not a sudden earthquake and not the sinking
  of land.
examples:
- Continental drift moved the land masses over millions of years.
- The map shows continental drift in slow motion.
