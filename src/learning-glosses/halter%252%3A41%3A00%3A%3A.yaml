simpleMeaning: to hang someone by a rope put around the neck
scope: To hang someone by a rope around the neck; not to put a rope on a horse, and not the rope itself,
  which are other senses of halter.
examples:
- The condemned man was haltered before the crowd.
- In old times, thieves were haltered at the gallows.
