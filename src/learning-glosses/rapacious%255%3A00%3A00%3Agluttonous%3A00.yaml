simpleMeaning: Wanting food and eating it in great amounts.
scope: 'Also called ravenous, wolfish, ravening, and voracious: devouring or craving food in great amounts,
  not being greedy and grasping for things, and not living by preying on other animals.'
examples:
- He ate with a rapacious appetite, clearing every plate.
- The rapacious sharks tore at the dead whale.
