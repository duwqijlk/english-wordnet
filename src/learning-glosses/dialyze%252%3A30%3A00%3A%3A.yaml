simpleMeaning: to take some parts out of a mix by letting it pass through a thin skin
scope: To take some parts out of a mix by letting it pass through a thin skin, also called dialyse; not
  filtering through paper, and not breaking a thing apart by force.
examples:
- The doctors dialyzed the patient's blood each week.
- The lab dialyzed the mixture to take out the salt.
