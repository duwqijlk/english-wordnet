simpleMeaning: Too much feed in lake or other water, usually washed in as waste, manures, and sewage from
  the land, growing plants thick; rotting plants drain the oxygen, killing animals.
scope: Of a lake or other water with too much feed washed in from the land, growing plants thick and draining
  oxygen.
examples:
- Eutrophication grows plants thick in the lake.
- Eutrophication kills animals.
