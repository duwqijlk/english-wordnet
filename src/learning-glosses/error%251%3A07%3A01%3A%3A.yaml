simpleMeaning: A way of behaving that is not right or good, that goes against ideas of right and wrong
scope: Doing what is not right or good; not a wrong action from poor thinking, not a wrong idea, and not
  a failed play in baseball.
examples:
- He saw his past cruelty as a grave error and asked for forgiveness.
- Stealing from a friend is an error no one should make.
