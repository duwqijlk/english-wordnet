simpleMeaning: A bottle with a hard shell, made from a bottle gourd left to dry.
scope: A bottle made from the dried shell of a bottle gourd, also called a gourd; not a glass bottle and
  not the gourd plant itself.
examples:
- He drank water from a calabash.
- The calabash held palm wine.
