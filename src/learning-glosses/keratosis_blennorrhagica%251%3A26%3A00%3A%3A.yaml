simpleMeaning: A scaly rash on the palms and the soles of the feet marks this skin illness, which goes
  with a joint illness called Reiter's syndrome.
scope: Keratoderma blennorrhagica is another name for this skin illness, where a scaly rash on the palms
  and soles goes with a joint illness called Reiter's syndrome.
examples:
- Keratosis blennorrhagica showed as scaly patches on the feet.
- A joint illness called Reiter's syndrome went with keratosis blennorrhagica.
