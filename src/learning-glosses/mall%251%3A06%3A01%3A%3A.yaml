simpleMeaning: A shopping centre with landscaped grounds and shops of leading brands; it usually has restaurants
  and easy parking and is a modern form of the traditional marketplace.
scope: A landscaped complex of shops with restaurants and parking, not a single store or an old-style
  open market.
examples:
- They spent the afternoon shopping at the mall.
- The new mall includes restaurants and a large parking area.
