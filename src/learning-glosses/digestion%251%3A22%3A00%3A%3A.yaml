simpleMeaning: the way the body breaks food down and changes it into parts that can go into the body and
  be used
scope: This is the body's way of breaking down food so it can be used, not the breaking down of waste
  or other matter outside the body.
examples:
- Good digestion helps the body get what it needs from food.
- He had poor digestion and felt sick after large meals.
