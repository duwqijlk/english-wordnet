simpleMeaning: A person picked out by someone or something hostile to be attacked, most of all to be mocked
  or used for gain
scope: A person picked out to be attacked, also called target, not an animal hunted for food and not a
  person who does the attacking.
examples:
- He fell prey to muggers on his way home.
- The old man was prey to cruel jokes at work.
