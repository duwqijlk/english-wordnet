simpleMeaning: A bitter yellow dust, used to make sick skin well.
scope: Also called araroba and chrysarobin; a bitter yellow dust used on sick skin, not a powder for cooking
  and not a medicine to drink.
examples:
- The doctor gave her Goa powder for the rash on her arm.
- Goa powder was rubbed on the sore skin twice a day.
