simpleMeaning: a skin condition in which the skin gets thick and its lines stand out more
scope: This is a skin condition in which the skin gets thick and its lines stand out more; eczema hypertrophicum
  and lichtenoid eczema are other names for this sense, not a short-term rash and not skin that gets thin.
examples:
- Her chronic eczema made the skin on her hands thick and lined.
- The doctor said his chronic eczema would need care for a long time.
