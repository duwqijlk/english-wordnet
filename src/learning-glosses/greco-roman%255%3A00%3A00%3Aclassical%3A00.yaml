simpleMeaning: Of the old Greeks and the old people of Rome, or like them, above all in their art, writing,
  or way of life
scope: Also called classical and Graeco-Roman, it is of the old Greeks and Romans, above all in their
  art, writing, or way of life, not of Greece alone and not of Rome alone.
examples:
- Greco-Roman art filled the museum.
- The Greco-Roman temple stood on the hill.
