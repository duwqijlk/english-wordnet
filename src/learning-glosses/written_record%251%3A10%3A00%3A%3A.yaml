simpleMeaning: A paper that sets down facts or events in words so they are kept
scope: A paper that sets down facts or events in words so they are kept; written account is another name
  for this sense, not a spoken account and not a personal diary.
examples:
- The written record of the trial fills ten boxes.
- A written record of the flood was kept by the town clerk.
