simpleMeaning: full of wild excitement or feeling that a person cannot hold back
scope: Full of wild excitement or feeling that cannot be controlled, also called mad, excited or frantic,
  and not the sense of being ill and seeing things that are not there.
examples:
- The delirious crowd cheered the winning goal.
- Fans went delirious when the band came on stage.
