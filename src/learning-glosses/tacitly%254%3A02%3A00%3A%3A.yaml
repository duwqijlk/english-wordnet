senseId: 'tacitly%4:02:00::'
synsetId: 00475152-r
simpleMeaning: Without saying so in words, by a shared understanding that no one has spoken aloud.
scope: Without saying so in words, by a shared understanding no one has spoken aloud, not by open agreement
  and not in silence alone.
examples:
- The rule was tacitly agreed by everyone in the room.
- She tacitly agreed by saying nothing against it.
