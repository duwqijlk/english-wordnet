senseId: 'rendition%1:04:01::'
synsetId: 00101363-n
simpleMeaning: the act of showing what you make of a song, poem, play or other work by the way you sing,
  play or act it
scope: 'Also called interpretation and rendering: the act behind a performance, showing what a person
  makes of a work when they sing, play or act it. It is not handing prisoners to another country, and
  not just one performance itself.'
examples:
- Her rendition of the old song was slow and sad, showing her own view of its words.
- His rendition of the poem made the sad parts feel stronger.
