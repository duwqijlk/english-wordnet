senseId: 'despotism%1:14:00::'
synsetId: 08457622-n
simpleMeaning: A way of ruling in which one ruler holds all power, held back by no constitution, laws,
  opponents, or the like.
scope: Also called tyranny, authoritarianism, dictatorship, totalitarianism, absolutism, monocracy, one-man
  rule, or a shogunate; rule by one unchecked ruler, not rule by fear and threats alone.
examples:
- Despotism left the people with no voice in the land.
- The despotism of the ruler crushed all opposition.
