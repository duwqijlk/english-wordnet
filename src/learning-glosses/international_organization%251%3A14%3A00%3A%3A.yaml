simpleMeaning: a group of many different countries joined together in an alliance
scope: A group of many different countries joined in an alliance, also called international organisation;
  not a group of people in one country and not a treaty between two countries.
examples:
- The international organization sent help to the countries hit by the flood.
- Several nations joined the international organization last year.
