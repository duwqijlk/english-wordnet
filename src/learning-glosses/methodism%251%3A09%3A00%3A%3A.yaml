simpleMeaning: The beliefs and ways of worship of one religious group, marked by care for the welfare
  of society and for right conduct in public life
scope: This is the beliefs and practices of the Methodists, marked by care for social welfare and public
  morals; it covers both what they believe and how they act toward others and in public life.
examples:
- Methodism teaches care for the poor and for right conduct in public life.
- He joined Methodism because its members work for social welfare.
