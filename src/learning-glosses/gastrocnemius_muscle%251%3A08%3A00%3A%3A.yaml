simpleMeaning: Most of the calf is this band of body tissue at the back of the leg, and it bends the foot
  so the toes point down
scope: Also called gastrocnemius, it is the large soft part at the back of the lower leg that moves the
  foot, not the shin part at the front and not a bone.
examples:
- The gastrocnemius muscle ached after the long climb up the hill.
- She stretched her gastrocnemius muscle before the race.
