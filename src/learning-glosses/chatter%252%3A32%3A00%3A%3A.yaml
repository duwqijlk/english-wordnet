schema: oewn-learning-gloss-v2
senseId: 'chatter%2:32:00::'
synsetId: 01038676-v
simpleMeaning: to talk fast about small, unimportant things, and to keep on talking without a break
scope: This is fast talk about small things, not the high sound of birds or monkeys and not teeth that
  click again and again.
examples:
- They chattered about the weather all through lunch.
- She chattered on about her neighbours for an hour.
