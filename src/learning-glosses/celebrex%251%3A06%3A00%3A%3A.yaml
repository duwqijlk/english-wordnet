simpleMeaning: A drug that blocks a body chemical called Cox-2, easing pain and swelling without harming
  the digestive tract.
scope: Also called celecoxib, this drug eases pain and swelling by blocking a body chemical, without harming
  the stomach and gut; other painkillers, other swelling drugs and other drugs that protect the stomach
  are near medicines with their own names.
examples:
- The doctor prescribed Celebrex for her pain.
- Celebrex eases pain and swelling without harming the digestive tract.
