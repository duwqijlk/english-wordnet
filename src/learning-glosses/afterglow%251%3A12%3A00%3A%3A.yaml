simpleMeaning: The joy one still feels when thinking back on a good time.
scope: The joy one still feels when thinking back on a good time, not the glow seen in the sky after the
  sun has set.
examples:
- She lived in the afterglow of her wedding day for weeks.
- The afterglow of the concert stayed with them all evening.
