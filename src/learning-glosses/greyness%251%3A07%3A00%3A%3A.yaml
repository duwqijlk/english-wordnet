simpleMeaning: a colour halfway between white and black, with no other colour mixed in
scope: This is the plain colour halfway between white and black, also called gray, grey, and grayness.
  It is not the colour black itself and not the colour white itself.
examples:
- The greyness of the sky made the sea look dull.
- She liked the soft greyness of his sweater.
