simpleMeaning: The ideas of Mendel about how traits pass from parent to child, built on his rules.
scope: Mendelism is another name for this sense; it is Mendel's theory of inheritance, not the theory
  of anyone else.
examples:
- She studied Mendelianism at school and learned how tall plants can have short children.
- Mendelianism explains why a child may look like a grandparent.
