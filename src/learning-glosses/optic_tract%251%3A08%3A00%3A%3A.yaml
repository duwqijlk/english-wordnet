simpleMeaning: The cord of nerve that joins the brain to the thin part at the back of the eye that takes
  in light
scope: A cord of nerve that joins the brain to the eye, also called nervus opticus and optic nerve; not
  a cord of nerve that moves a muscle and not one that carries feeling from the skin.
examples:
- The optic tract carries sight from the eye to the brain.
- Damage to the optic tract can take away sight in part of what a person sees.
