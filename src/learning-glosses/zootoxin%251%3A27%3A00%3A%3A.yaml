simpleMeaning: The body's defences react to this poison from the fluids of certain animals just as they
  do to poisons made by germs.
scope: Also called animal toxin, this poison comes from the fluids of certain animals, and the body's
  defences answer it as they answer poisons made by germs.
examples:
- A zootoxin found in the fluids of certain animals can stir the body's defences.
- The body's defences answer a zootoxin in the same way as a poison made by germs.
