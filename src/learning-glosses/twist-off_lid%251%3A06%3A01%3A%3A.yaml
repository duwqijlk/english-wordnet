simpleMeaning: a top for a jar or glass bottle that you undo by turning it
scope: A top for a jar or glass bottle that you undo by turning it, also called a twist-off cap; not a
  top that lifts straight up and not a cork.
examples:
- The twist-off lid on the pickle jar would not move.
- He turned the twist-off lid and the bottle opened.
