senseId: 'resolution%1:10:02::'
synsetId: 07041708-n
simpleMeaning: In music, a group of notes played together that sounds rough is followed by a group of
  notes played together that sounds smooth
scope: In music, the move from a rough-sounding group of notes to a smooth one; not a decision that settles
  a problem, not the sharpness of a picture, and not swelling going down in the body.
examples:
- The resolution came when the rough chord gave way to a smooth one.
- In the last part of the song, a harsh chord moves to a resolution that sounds calm and at rest.
