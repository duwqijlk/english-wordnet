simpleMeaning: Breaking down the honesty and loyalty of a person or a group, and the sense of right and
  wrong in them.
scope: Also called corruption, the wearing away of honesty and loyalty, not the overthrow of a government.
examples:
- The subversion of the young clerk began with small bribes.
- Years of subversion had left the officials with no loyalty to the state.
