simpleMeaning: any of many kinds of insect that roll balls of waste, which they eat and in which they
  lay eggs
scope: Any of many kinds of insect that roll balls of waste, not a fly that feeds on waste and not a worm
  that lives in soil.
examples:
- A dung beetle rolled a ball of dung across the path.
- Dung beetles lay their eggs inside balls of dung.
