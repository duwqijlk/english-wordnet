simpleMeaning: The male of this North American finch wears bright crimson feathers, with a tuft on its
  head and a thick beak.
scope: Also called cardinal and cardinal grosbeak, this North American finch has a tuft on its head and
  a thick beak, and the male wears bright crimson feathers.
examples:
- We saw a redbird in the garden.
- A male redbird perched on the fence.
