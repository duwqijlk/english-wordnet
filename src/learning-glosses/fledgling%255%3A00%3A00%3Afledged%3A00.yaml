simpleMeaning: (of a young bird) having grown the feathers it needs to fly
scope: Used to describe a young bird that has grown the feathers it needs to fly, not the name for the
  young bird itself.
examples:
- A fledgling robin sat on the low branch, its flight feathers fully grown.
- The fledgling sparrow spread its new flight feathers and flew a short way.
