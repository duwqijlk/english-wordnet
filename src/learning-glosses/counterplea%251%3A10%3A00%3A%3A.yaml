senseId: 'counterplea%1:10:00::'
synsetId: 06573334-n
simpleMeaning: the reply made in court by the person who brings the case to the formal statement put in
  by the other side
scope: The reply in court by the person who brings the case to the other side's formal answer, not the
  first claim and not the judge's ruling.
examples:
- The counterplea answered the defendant's plea point by point.
- After the counterplea was filed, the judge set a date for the hearing.
