simpleMeaning: to make someone lose courage, feel discouraged, and turn away.
scope: To discourage someone or make them back off, not simply to frighten them, and not the noun for
  a public panic.
examples:
- The steep climb scared him into turning back.
- Loud shouts scared the birds off the roof.
