simpleMeaning: in football and professional basketball, one of the four periods of play into which a game
  is divided
scope: This is a period of a football or basketball game, not one of four equal parts, not a district
  of a city, not a period of the school year or a fourth of a year, not a coin, and not mercy shown to
  a defeated opponent.
examples:
- The home team led by ten points at the end of the third quarter.
- He scored twice in the final quarter.
