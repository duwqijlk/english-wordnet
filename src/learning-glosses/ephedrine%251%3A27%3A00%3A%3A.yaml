simpleMeaning: A white, odorless alkaloid (plant chemical) in powder or crystal form, taken from Ephedra
  plants, especially Ephedra sinica, or made artificially; used to widen the airways in bronchitis and
  asthma.
scope: A white alkaloid obtained from Ephedra plants or made artificially, used to widen the airways.
  It is not pseudoephedrine, a related compound sold mainly as a decongestant, and not the Ephedra plant
  itself.
examples:
- The doctor prescribed ephedrine to open the patient's airways during the asthma attack.
- Ephedrine was once a common ingredient in cold and allergy medicines.
