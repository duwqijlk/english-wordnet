senseId: 'unpredictability%1:07:01::'
synsetId: 04873902-n
simpleMeaning: the quality of not being able to decide firmly, so others cannot guess what you will do
  next
scope: 'Also called volatility: this is about not being able to decide firmly in a way others cannot guess,
  not about acting on sudden wishes without thinking.'
examples:
- Her unpredictability in making decisions made planning hard for the team.
- His unpredictability came from never deciding firmly; he changed his answer each day.
