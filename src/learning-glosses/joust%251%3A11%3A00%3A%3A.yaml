scope: 'Also called a tilt: a fight between two knights on horseback with blunt spears, not a sword fight
  on foot and not the verb sense of fighting in a tournament.'
examples:
- The two knights met in a joust before the cheering crowd.
- He won the joust by knocking his rival from his horse.
