simpleMeaning: In the warm dry parts of the west of North America, a bush grows that mostly keeps its
  leaves all year
scope: This is a bush that stays green all year in the warm dry west of North America, not a tree and
  not a plant of wet cold places.
examples:
- Manzanita grows on the dry hills of California.
- The manzanita kept its green leaves through the long dry summer.
