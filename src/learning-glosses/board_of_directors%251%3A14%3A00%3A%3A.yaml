simpleMeaning: A group of people picked to run the business of a large firm or other big organisation
scope: A group picked to run a large firm or other big organisation; directorate is another name for this
  sense, not the managers who run the firm day by day and not a group that owns the firm.
examples:
- The board of directors met to pick a new chief.
- She was asked to join the board of directors of a large bank.
