simpleMeaning: In prosody, the strong stress put on one syllable (one sound part of a word) in a small
  group of syllables in a line of poetry
scope: Also called beat, measure, meter and metre. This is the one strong stress in a small group of syllables
  in poetry, not the whole pattern of sounds in a line.
examples:
- The cadence falls on the first syllable of this foot in the poem.
- She marked the cadence in each line of verse with a small mark over the strong syllable.
