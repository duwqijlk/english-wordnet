simpleMeaning: Deep-coloured inner wood from a tree of India and the East Indies dyes cloth, and the tree's
  hard wood smells sweet and is loved for fine furniture
scope: 'Also called red sandalwood, red sanders, and red saunders: a tree of India and the East Indies
  whose hard wood is loved for fine furniture and whose inner wood dyes cloth.'
examples:
- Red sanderswood gave the cloth its deep colour.
- The cabinet maker chose red sanderswood for its hard sweet-smelling wood.
