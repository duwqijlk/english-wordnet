simpleMeaning: a coloured lamp on an instrument panel that comes on to warn of trouble, as when the oil
  runs low
scope: A warning lamp on an instrument panel that comes on to warn of trouble; not a headlamp and not
  a gauge with a needle.
examples:
- The idiot light came on as soon as the oil pressure dropped.
- She ignored the idiot light on the dashboard until the engine stopped.
