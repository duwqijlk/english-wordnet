simpleMeaning: A person who goes without things they want, as a way of training the spirit.
scope: A person who denies themself as a spiritual discipline, also called ascetic; not a person who simply
  does not drink alcohol.
examples:
- The abstainer lived simply and ate little.
- As an abstainer, they gave up meat and wine for the holy season.
