simpleMeaning: Goods, or broken remains, lying on the sea floor and tied to a floating marker so they
  can be got back.
scope: Goods, or broken remains, lying on the sea floor and tied to a floating marker so they can be got
  back; lagend and ligan are other names for this sense, not goods floating on the sea and not goods sunk
  with no marker.
examples:
- The lagan was marked with a buoy for later recovery.
- Divers found the lagan tied to a floating marker.
