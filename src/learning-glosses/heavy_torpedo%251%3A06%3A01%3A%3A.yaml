simpleMeaning: Fired from far off, mainly by submarines under the water, this weapon carries a warhead
  of at least 450 kg
scope: Also called heavyweight torpedo, this is an underwater weapon fired from far off, not a lightweight
  torpedo.
examples:
- The submarine fired a heavy torpedo from far off.
- A heavy torpedo carries a warhead of at least 450 kg.
