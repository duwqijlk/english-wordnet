simpleMeaning: A small thorny bush of the west United States and Mexico that keeps its leaves all year,
  with tiny flowers and bright red berries.
scope: Also called red-berry and redberry; a small thorny bush of the west United States and Mexico with
  bright red berries, not a tall tree and not a bush with blue berries.
examples:
- Rhamnus croceus grows on the dry hills of the west.
- The bright red berries of Rhamnus croceus feed the birds in winter.
