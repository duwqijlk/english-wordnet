simpleMeaning: A soft raised pad of fat over the front part of a woman's body between the legs
scope: A soft raised pad of fat over the front part of a woman's body between the legs; mons and mons
  veneris are other names for this, not a muscle and not a bone.
examples:
- The mons pubis is a pad of fat over the front of the body.
- Doctors call that pad the mons pubis.
