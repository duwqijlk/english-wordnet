simpleMeaning: the big green leaf-like cup that stays at the base of a fruit like a strawberry
scope: The big green leaf-like cup that stays at the base of a fruit like a strawberry, not the dry outer
  covering of a fruit, seed, or nut.
examples:
- The hull of the strawberry was still green and fresh.
- She pulled the hull off the raspberry before eating it.
