simpleMeaning: From a lotus of America come seeds like nuts that taste like the nuts they are named for
  and are eaten.
scope: These are seeds like nuts from a lotus of America, tasting like the nuts they are named for, not
  the water-lily plant of the other sense.
examples:
- Seeds of the water chinquapin from the lotus were eaten.
- The seeds of the water chinquapin were eaten for their nutlike taste.
