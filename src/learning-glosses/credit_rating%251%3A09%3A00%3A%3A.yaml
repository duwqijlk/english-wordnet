simpleMeaning: A judgment, based on past dealings, of how well a person or firm can meet its money promises.
scope: This is a judgment of how well someone can pay what they owe, not a loan or a bank account; also
  called credit.
examples:
- Her credit rating helped her get the loan.
- A bad credit rating can make borrowing hard.
