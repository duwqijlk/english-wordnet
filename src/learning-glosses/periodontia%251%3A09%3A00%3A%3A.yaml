simpleMeaning: Illness of the gums and the parts round the teeth is what this part of tooth care deals
  with.
scope: Also called periodontics, this part of tooth care is for the gums and the parts round the teeth
  when they are ill.
examples:
- Illness of the gums is dealt with in periodontia.
- The gums and the parts round the teeth are the concern of periodontia.
