simpleMeaning: In ball games, to hit the ball toward the side the player is facing as the swing follows
  through.
scope: This is a batting or golf stroke sent toward the side the player faces, not a tug on an object
  or a rip in fabric.
examples:
- He pulled the ball into left field for a single.
- She pulled her drive wide of the fairway.
