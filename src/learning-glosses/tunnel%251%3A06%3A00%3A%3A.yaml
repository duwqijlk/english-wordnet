simpleMeaning: usually a below-ground route, especially for trains or cars, that lets you pass through
  or beneath something
scope: A built passage for people or vehicles, not the hole an animal digs for shelter or the verb for
  moving by digging.
examples:
- The train disappeared into a long tunnel under the mountain.
- Workers are digging a tunnel beneath the river.
