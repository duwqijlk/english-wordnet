simpleMeaning: The belief that lands where people of one group live should be ruled by the country whose
  people are of the same group and share their past
scope: The belief that such lands should be ruled by the country of their own people; irridentism is another
  name for this sense, not plain love of one's country and not a wish to break away.
examples:
- Irredentism drove the claim for the border lands.
- The party's irredentism called for the lost lands to join the home country.
