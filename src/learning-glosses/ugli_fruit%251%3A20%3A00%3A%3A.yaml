simpleMeaning: A cross between a large citrus and a mandarin orange, grown above all in Florida.
scope: This is a cross between a grapefruit and a mandarin orange grown above all in Florida, also called
  tangelo and tangelo tree; not the other sense of the same name, a big sweet juicy cross with a thick
  wrinkled skin.
examples:
- The ugli fruit grows in Florida groves.
- Farmers plant ugli fruit trees in Florida.
