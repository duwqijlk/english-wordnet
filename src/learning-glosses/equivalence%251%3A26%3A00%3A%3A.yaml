schema: oewn-learning-gloss-v2
senseId: 'equivalence%1:26:00::'
synsetId: 13969940-n
simpleMeaning: A state in which two things are in effect the same, with neither one above the other
scope: This is a state in which two things are in effect the same; par, equality and equation are other
  names for this sense, not a state of being the same in every small detail and not a maths sum with an
  equals sign.
examples:
- Her equivalence with the best players was clear to all.
- The equivalence of the two plans made the choice hard.
