simpleMeaning: To make a thing work again by fitting a new part, or by joining torn pieces back together
scope: 'Also called doctor, fix, and repair: making a broken thing work again by fitting a new part or
  joining torn pieces, not bringing a person back to health.'
examples:
- She restored the old chair by fitting a new leg.
- Please restore my shoes.
