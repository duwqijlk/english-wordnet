simpleMeaning: any way of speaking Chinese that people use in Fukien province
scope: This is any of the ways of speaking Chinese used in Fukien province, not the way of speaking used
  in the north of China or the written form of Chinese, and it is also called Amoy, Amoy language, Fukien,
  Fukien language, Fukkianese, Fukkianese language, Hokkianese, Hokkianese language, Min dialect, Min
  language, Taiwanese, and Taiwanese language.
