simpleMeaning: A climbing shrub, green all year, of southern Florida and the West Indies, grown for its
  clusters of sweet-smelling white to creamy flowers followed by round white juicy berries.
scope: Also called blolly and Chiococca alba; a climbing shrub, green all year, of southern Florida and
  the West Indies, grown for its flowers and berries, not the common snowberry of the north and not the
  coralberry.
examples:
- West Indian snowberry climbs over the wall with its white flowers.
- The white berries of West Indian snowberry followed its creamy flowers.
