schema: oewn-learning-gloss-v2
senseId: 'stumping%1:04:00::'
synsetId: 00803259-n
simpleMeaning: trying to win support for something by giving speeches about politics
scope: This is giving speeches about politics to win support for something; it is not one speech on its
  own, and not being stuck without an answer to a hard question.
examples:
- She spent the autumn stumping for the new mayor in small towns.
- His stumping across the state won him many new supporters.
