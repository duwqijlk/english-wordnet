simpleMeaning: A medium-sized moth that flies at night and is usually dull in color; its caterpillars
  are usually smooth and do serious damage to crops.
scope: Another name for noctuid and noctuid moth; this is the adult night-flying insect, not its smooth
  caterpillar, the crop pest.
examples:
- An owlet moth landed on the window screen after dark.
- The owlet moth's caterpillars are smooth and feed on crop plants.
