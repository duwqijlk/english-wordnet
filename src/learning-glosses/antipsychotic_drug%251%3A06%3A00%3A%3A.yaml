simpleMeaning: a cure used to calm people with serious mental illness when they need to feel settled
scope: 'Another name for antipsychotic, antipsychotic agent, major tranquilizer, major tranquilliser,
  major tranquillizer, neuroleptic, neuroleptic agent and neuroleptic drug: a drug that calms serious
  mental illness, not a drug for sleep and not a drug for low mood.'
examples:
- The doctor changed her antipsychotic drug after the old one stopped working.
- He was given an antipsychotic drug to calm the fears that would not leave him.
