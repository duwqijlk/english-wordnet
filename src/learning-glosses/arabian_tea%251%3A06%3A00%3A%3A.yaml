simpleMeaning: The leaves of a shrub, chewed like tobacco or brewed as a drink, which lift the mood and
  act as a stimulant.
scope: These are the leaves of a shrub, chewed like tobacco or brewed as a drink, also called cat, kat,
  khat, qat, quat and African tea; not a tobacco leaf.
examples:
- Arabian tea lifted his mood.
- He chewed Arabian tea like tobacco.
