simpleMeaning: caught for food and sport, a small to mid-size fish lives on the bottom of shallow coastal
  and fresh waters and makes a beating sound
scope: Also called drum, this is a bottom fish of shallow coastal and fresh waters that makes a beating
  sound, not a fish of the deep sea.
examples:
- The drumfish drummed in the shallow water at dusk.
- Anglers prize the drumfish for sport as well as food.
