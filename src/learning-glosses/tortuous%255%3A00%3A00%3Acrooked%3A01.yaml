simpleMeaning: having turns and bends again and again
scope: 'Also called twisting, winding, twisty and voluminous: having many turns and bends, not the sense
  about a thing that is hard to follow.'
examples:
- We drove up a tortuous road to the top of the hill.
- The river followed a tortuous path through the woods.
