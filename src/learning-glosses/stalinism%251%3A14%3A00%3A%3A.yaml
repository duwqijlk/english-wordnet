simpleMeaning: A way of ruling a country in which one ruler holds all power, and no laws, no written rules
  of the land, and no rivals can hold them back.
scope: Also called tyranny, authoritarianism, dictatorship, totalitarianism, despotism, absolutism, monocracy,
  one-man rule, shogunate and Caesarism; a way of ruling a country in which one ruler holds all power,
  with no laws, no written rules of the land and no rivals to hold them back.
examples:
- Stalinism ruled the country with fear and no free press.
- Under Stalinism, no one could speak against the ruler.
