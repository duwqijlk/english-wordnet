simpleMeaning: a substance usually made by melting two or more metals together, or a metal with another
  material, so that they blend while hot
scope: A substance made by melting metals together, also called metal; not a single pure metal and not
  a mixture only stirred, not melted.
examples:
- Brass is an alloy of zinc and copper.
- The alloy was harder than either metal alone.
