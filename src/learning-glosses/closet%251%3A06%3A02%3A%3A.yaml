simpleMeaning: a tall piece of furniture for keeping clothes, with a door and rails or hooks to hang clothes
  on
scope: 'Also called press: a tall piece of furniture for keeping clothes, with a door and rails or hooks
  to hang clothes on, not a small room or cupboard for keeping things.'
examples:
- She hung her coat in the closet.
- He opened the closet and took out a clean shirt.
