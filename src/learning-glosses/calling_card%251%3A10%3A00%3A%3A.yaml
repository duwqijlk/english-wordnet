simpleMeaning: a printed or handwritten note left behind to show that you have come to visit
scope: 'Also called a card: a printed or handwritten note left behind to show that you have come to visit,
  not a business card and not a phone card.'
examples:
- She left her calling card on the hall table after her visit.
- In the past, visitors left a calling card to show they had come.
