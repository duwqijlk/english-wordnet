simpleMeaning: changing a computer program so that part of it runs better or takes less from the computer
scope: Also called program optimisation, program optimization and software optimisation; changing a computer
  program to run better, not writing a new program and not fixing a fault in it.
examples:
- The team spent a week on software optimization to cut the app's memory use.
- Good software optimization can make an old program run much faster.
