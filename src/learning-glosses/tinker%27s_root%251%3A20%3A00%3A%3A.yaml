simpleMeaning: With big leaves that usually wrap round the stem, this rough weed-like American herb lives
  for years and bears purple or dull red flowers.
scope: Also called feverroot, horse gentian, and wild coffee, it is a rough American herb with big leaves
  and purple or dull red flowers.
examples:
- Tinker's root had big leaves that wrap round the stem.
- She gathered tinker's root for its purple flowers.
