simpleMeaning: Any physical or mental disturbance, such as sweating or depression, felt by a drug addict
  when deprived of the drug
scope: This is the upset in body or mind that a person hooked on a drug feels when kept from the drug.
examples:
- After the drug was kept away, withdrawal symptoms set in.
- Sweating was one withdrawal symptom, and low spirits another.
