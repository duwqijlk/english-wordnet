simpleMeaning: For glaucoma, drops put in the eye let more of the watery fluid inside it flow out through
  a side path.
scope: This is one of the treatments for glaucoma that work by draining fluid from the eye.
examples:
- The topical prostaglandin eyedrop was put in to treat the glaucoma.
- With the topical prostaglandin eyedrop, more of the watery fluid drained out of the eye.
