simpleMeaning: exactly the same as another thing, with no difference that a person can see or notice
scope: This means two or more things are exactly the same; not twins that came from one egg, and not a
  thing whose qualities are the same in every direction.
examples:
- The two houses look identical, with the same doors, windows and roof.
- She bought two identical chairs so both sides of the table would match.
