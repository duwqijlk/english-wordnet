simpleMeaning: A fold in cloth with the extra cloth turned to the inside, made by turning a box fold round
scope: A fold in cloth made by turning a box fold round so the extra cloth goes inside; not a fold with
  the extra cloth on the outside and not a flat seam.
examples:
- The skirt has an inverted pleat at the back.
- She pressed the inverted pleat so it lay flat.
