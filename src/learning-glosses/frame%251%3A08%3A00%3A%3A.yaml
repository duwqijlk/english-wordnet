simpleMeaning: the bones and cartilage (a strong material in the body, not as hard as bone) in an animal's
  body, which together hold the body up and give it shape
scope: This is all the bones and cartilage in an animal's body; it is not the border round a picture,
  not one still picture in a film, and not a part of a computer screen.
examples:
- An X-ray showed the frame of the fish, with every thin bone in place.
- The animal's frame stayed whole long after the soft parts were gone.
