simpleMeaning: A small woody plant of the southwestern United States with red fruit touched with purple,
  at times grown to look at for its large leaves.
scope: A small woody plant of the southwestern United States with red fruit touched with purple, at times
  grown to look at; not a cherry and not a large shade plant.
examples:
- The big-tree plum bore dark red fruit in the summer.
- A big-tree plum grew at the edge of the yard.
