simpleMeaning: darkness in a place, less strong than in full light, made when something that light cannot
  pass through blocks the light
scope: The darker place where light is blocked, not a cover for a lamp and not a cover made to block the
  sun.
examples:
- We sat in the shade of the big tree at noon.
- It was much cooler in the shade than in the sun.
