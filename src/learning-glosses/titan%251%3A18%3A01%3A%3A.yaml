simpleMeaning: a person of very great importance who is very well known
scope: 'Also called giant, behemoth, heavyweight and colossus: a person of great importance and a great
  name, not just a person who is very large in body.'
examples:
- He became a titan of the film business, known by everyone in it.
- The book tells the story of a titan who changed how computers are made.
