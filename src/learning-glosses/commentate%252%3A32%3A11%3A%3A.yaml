simpleMeaning: to speak or write about something, giving facts and your thoughts on it
scope: To speak or write about a subject and give facts and thoughts on it; not working as the person
  who describes a sports game or other event while it is happening.
examples:
- She was asked to commentate on the photos in the exhibition.
- The writer commentated on the election in yesterday's newspaper.
