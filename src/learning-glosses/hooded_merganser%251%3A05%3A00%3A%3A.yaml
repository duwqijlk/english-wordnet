simpleMeaning: The male of this small duck from North America has a high, round crest on top of its head.
scope: The male of this small duck from North America has a high, round crest on top of its head, also
  called a hooded sheldrake; not a duck with a plain head, and not a duck of Europe.
examples:
- The hooded merganser dove under the water for fish.
- A male hooded merganser showed its tall round crest.
