simpleMeaning: to put computers into a place so that the people there can use them
scope: 'Also called computerise: giving a place computers to use, not using a computer to control a process
  and not storing information in a computer.'
examples:
- They computerized the library and gave every reader a computer to use.
- Our office is fully computerized now, with a computer on every desk.
