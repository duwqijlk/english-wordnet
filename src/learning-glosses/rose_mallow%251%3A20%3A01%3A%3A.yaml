simpleMeaning: a showy bush of the salt marshes of the eastern United States, with large pink flowers
scope: A showy bush of the salt marshes of the eastern United States; common rose mallow, swamp mallow
  and swamp rose mallow are other names for it, not a garden mallow and not a hollyhock.
examples:
- Rose mallow flowered in the salt marsh.
- The rose mallow stood tall among the reeds.
