simpleMeaning: a mould that brings a sickness to citrus trees, coffee plants, rubber trees, and other
  such plants, turning parts of the plants rose-coloured
scope: A mould that brings a sickness turning plants pink, found on citrus, coffee and rubber trees, not
  a mould that rots wood and not a harmless mould.
examples:
- Pink disease fungus attacked the coffee plants.
- The pink disease fungus spread through the rubber trees.
