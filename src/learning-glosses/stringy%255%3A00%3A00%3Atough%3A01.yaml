simpleMeaning: of meat, full of tough cords that run through it, and especially impossible to chew
scope: Of meat, full of tough cords and impossible to chew, not made of strings and not thick like glue.
examples:
- The stringy beef was so tough that he could hardly chew it.
- She left the stringy meat on her plate and ate the potatoes.
