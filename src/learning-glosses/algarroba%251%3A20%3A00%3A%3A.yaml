simpleMeaning: The carob named in the Bible is this green-all-year tree of the lands round the Mediterranean
  Sea, bearing pods that can be eaten.
scope: Also called a carob, a carob bean tree, or a carob tree, this green-all-year Mediterranean tree
  bears pods that can be eaten, and it is not the mesquite of the Gulf Coast that shares its name.
examples:
- They picked pods from the algarroba and ate them.
- The algarroba kept its leaves through the winter.
