simpleMeaning: A North American plant living many years, with few branches and bright yellow flower clusters
  at the stem ends, like those of the foxglove; sometimes placed in the genus Gerardia.
scope: 'Also called the false foxglove and Gerardia virginica: a North American plant with bright yellow
  flowers, not a true foxglove and not a tall shrub.'
examples:
- Aureolaria virginica bloomed bright yellow along the woodland edge.
- We found Aureolaria virginica with few branches and yellow flowers.
