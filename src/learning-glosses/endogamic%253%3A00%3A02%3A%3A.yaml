simpleMeaning: a flower that can bear seed when pollen comes from another flower of the same kind
scope: 'Also called endogamous: a flower that can bear seed when pollen comes from another flower of the
  same kind, not by pollen from a flower of a different kind, and not the custom of marrying within one
  group.'
examples:
- The endogamic flower took pollen from another flower of the same kind.
- Endogamic plants can be made to bear seed with pollen from a flower of the same kind.
