simpleMeaning: of or about manic depressive illness (an illness of the mind that makes a person's moods
  swing between very high and very low)
scope: This is about an illness of the mind, not about the far north and far south parts of the earth.
examples:
- She was treated for bipolar disorder after her moods kept swinging between high and low.
- Bipolar illness can make a person feel very high one week and very low the next.
