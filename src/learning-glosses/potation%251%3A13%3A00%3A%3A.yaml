simpleMeaning: From a barrel comes this cup of drink, most often with alcohol in it
scope: 'Another name for a draft, a draught, or a tipple: a serving of drink, most often with alcohol
  in it, drawn from a barrel; not a full barrel of drink.'
examples:
- He ordered a potation of ale from the keg.
- She poured herself a potation after the long day.
