simpleMeaning: an illness passed down in families in which bone grows hard in the inner ear, causing ringing
  in the ears and, in time, loss of hearing
scope: An illness passed down in families in which bone hardens in the inner ear, not deafness from loud
  noise and not an ear infection.
examples:
- Otosclerosis caused a ringing in her ears that never went away.
- His otosclerosis slowly took his hearing over ten years.
