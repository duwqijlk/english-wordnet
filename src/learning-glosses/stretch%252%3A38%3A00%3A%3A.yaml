simpleMeaning: to open or spread something out until it reaches further or its full length
scope: This means opening or spreading something out along its length, not pulling it to make it longer
  and not something growing longer on its own.
examples:
- They stretched the tarp across the ground before setting up the tent.
- He stretched the cord from the wall to the desk.
