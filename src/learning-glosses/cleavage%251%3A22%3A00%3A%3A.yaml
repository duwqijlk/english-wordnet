simpleMeaning: In embryology, the study of life before birth, the splitting of a fertilised egg cell again
  and again
scope: In embryology, the splitting of a fertilised egg cell again and again, not the line between two
  body parts and not the breaking of a chemical bond.
examples:
- Cleavage of the egg begins soon after it is fertilised.
- Scientists watched the cleavage of the egg under the microscope.
