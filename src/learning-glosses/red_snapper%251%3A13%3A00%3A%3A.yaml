simpleMeaning: Caught off the Atlantic coast and in the Gulf of Mexico, this lean pinkish meat of the
  fish is much prized as food.
scope: This is the lean flesh of the fish eaten as food, not the living fish itself, which is a different
  sense of the same words.
examples:
- We ate red snapper caught in the Gulf of Mexico.
- The red snapper tasted lean and pinkish.
