simpleMeaning: the act of making something move down to a less high place or level
scope: Making something move down to a less high level. It is not a fall in price or number, and not the
  dark look of a heavy sky.
examples:
- The lowering of the bridge took an hour.
- The lowering of the box onto the floor was slow and careful.
