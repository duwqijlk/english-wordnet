senseId: 'expectancy%1:09:00::'
synsetId: 05960190-n
simpleMeaning: something that people think will be true or will happen, based on what is usual
scope: This is the sense based on what is usual or normal, not just the general feeling that something
  will happen.
examples:
- Doctors use average life expectancy to show how long people usually live.
- The chart shows the expectancy for growth at each age, based on what is normal for children.
