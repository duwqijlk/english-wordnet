simpleMeaning: Sharp-smelling blooms in rose-pink or purple sit on a plant of the north-east of the United
  States, its leaves flat on the stem.
scope: Also called sessile trillium and toadshade, this plant of the north-east of the United States bears
  sharp-smelling blooms, not the kind whose root is used in folk medicine.
examples:
- A red trillium grew beside the path.
- We saw the red trillium in bloom.
