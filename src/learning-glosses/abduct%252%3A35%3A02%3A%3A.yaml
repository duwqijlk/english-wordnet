simpleMeaning: to seize a person and carry them off to a hidden place they do not want to go to, most
  often to force money out of their family
scope: 'Also called snatch or kidnap: to seize a person and carry them off to a hidden place against their
  will.'
examples:
- The industrialist's son was abducted on his way home from school.
- Masked men abducted the banker and hid him in an old farmhouse.
