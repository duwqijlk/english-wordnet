simpleMeaning: A cloth that covers the lower half of a woman's face, up to the eyes, worn by Muslim women
  who follow their faith closely.
scope: A cloth that covers the lower half of a woman's face, up to the eyes, worn by Muslim women who
  follow their faith closely, not a scarf that covers the hair only and not a wedding veil.
examples:
- She wore a niqab that covered the lower part of her face.
- The niqab left only her eyes showing.
