simpleMeaning: A bacterial skin infection that starts as a small pimple, turns into a blister that bursts
  and leaks toxins, then causes severe vomiting, high fever, heavy sweating and often death.
scope: The skin form of anthrax, marked by a pimple that becomes a blister; not the inhaled lung form
  caught by breathing spores or the intestinal form.
examples:
- Cutaneous anthrax usually begins as a small pimple on the hand or forearm.
- He was given antibiotics after cutaneous anthrax left a blister on his arm.
