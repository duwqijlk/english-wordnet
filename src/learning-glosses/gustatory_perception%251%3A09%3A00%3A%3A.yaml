synsetId: 05723230-n
simpleMeaning: A thing that melts in the mouth sets off a feeling when the taste buds on the tongue and
  in the throat tell you what it is made of.
scope: Also called taste, gustatory sensation, taste perception and taste sensation, this is the feeling
  when taste buds tell you what a melting thing is made of.
examples:
- The gustatory perception of the soup told her it was too salty.
- His gustatory perception faded after the cold dulled his taste buds.
