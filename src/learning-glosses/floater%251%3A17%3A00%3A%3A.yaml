synsetId: 09304683-n
simpleMeaning: A thing that stays on top of water, or that can do so.
scope: A thing that stays on top of water, or that can do so, not a debt paper with a changing rate of
  interest, not an insurance paper covering things that can be moved, not spots seen before the eyes,
  not a voter who votes illegally in more than one place, not a person with no fixed home, and not a swimmer
  who floats in the water.
examples:
- The floater bobbed on the surface of the pool.
- A plastic floater marked the edge of the swimming area.
