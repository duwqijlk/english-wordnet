simpleMeaning: of colors, bright and too showy, in a way that does not look good
scope: Of colors that are bright and too showy, not of a high sharp sound and not the act of making a
  high sharp cry.
examples:
- She wore a shrill pink dress that stood out in the crowd.
- The room was painted in shrill green and orange.
