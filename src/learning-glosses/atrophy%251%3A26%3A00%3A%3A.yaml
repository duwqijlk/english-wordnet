simpleMeaning: a part inside the body getting smaller because of illness or because it is not used
scope: Also called wasting, this is a body part getting smaller from illness or no use, not the verb that
  means for a body part to get smaller.
examples:
- After months in bed, his leg showed clear atrophy, with the muscle much smaller.
- The doctor said the atrophy came from illness and from not using the arm.
