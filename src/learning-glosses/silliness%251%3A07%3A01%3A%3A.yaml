simpleMeaning: a way of acting without thinking first, and of not keeping your thoughts clear and in order
scope: Also called giddiness. This is a person's way of acting without thinking, not a single foolish
  act or joke.
examples:
- Her silliness at work meant she often acted before she thought.
- People noticed his silliness, as his thoughts kept changing from one thing to the next.
