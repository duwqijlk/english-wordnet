simpleMeaning: less able to feel things or to react to what is happening around you
scope: This is about being less able to feel or react to things around you. It is not about being slow
  to learn, and not about having little life or energy.
examples:
- So tired, she was dull to what went on about her.
- His dull gaze showed he did not react to the news.
