simpleMeaning: To push a person's mind out of balance so they can no longer think straight, and make them
  mad
scope: To push a person's mind out of balance until they can no longer think straight; unbalance is another
  name for this sense; not to confuse someone for a moment, and not to upset a plan.
examples:
- The death of his parents deranged him, and he could no longer think clearly.
- Years of fear deranged the old man until he no longer knew his own children.
