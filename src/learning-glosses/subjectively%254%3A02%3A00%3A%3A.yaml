simpleMeaning: in a way that is based on what a person thinks or feels, not on facts alone
scope: This sense is about a way based on what a person thinks or feels, not a way based only on facts
  that other people can check.
examples:
- She judged the paintings subjectively, picking the ones she liked most.
- You cannot look at these facts subjectively and ignore what the numbers show.
