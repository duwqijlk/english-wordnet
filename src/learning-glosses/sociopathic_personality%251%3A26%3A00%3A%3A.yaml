senseId: 'sociopathic_personality%1:26:00::'
synsetId: 14411544-n
simpleMeaning: A lasting absence of moral feeling and emotional depth, so that harming others causes the
  person no guilt.
scope: Another name for the same condition, used when its effects on other people are stressed; not a
  distinct illness or a mild character flaw.
examples:
- The court was told that the defendant had a sociopathic personality.
- A sociopathic personality can make someone treat other people as tools to be used.
