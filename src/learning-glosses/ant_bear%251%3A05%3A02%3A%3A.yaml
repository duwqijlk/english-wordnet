simpleMeaning: From South America, this big shaggy animal has no teeth, a long tongue and strong claws
scope: This is also called a giant anteater, a great anteater and a tamanoir, and it is not the African
  burrowing animal that eats termites.
examples:
- The ant bear used its long tongue to reach the ants.
- Its strong claws and long tongue showed that it was an ant bear.
