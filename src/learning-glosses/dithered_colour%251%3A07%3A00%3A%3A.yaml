simpleMeaning: A shade built from a pattern of small dots in unlike hues that, seen together, look like
  the shade wanted
scope: This is a shade built from a pattern of small dots in unlike hues; dithered color, nonsolid color
  and nonsolid colour are other names for it, not a flat single shade.
examples:
- The dithered colour on the page looked smooth from a distance.
- He picked a dithered colour for the faded poster.
