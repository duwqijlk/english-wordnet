simpleMeaning: having parts that match each other well in size or amount, or matching another thing in
  the same way
scope: 'Also called symmetrical and harmonious: about parts that match each other well, not just being
  the right size compared with something else.'
examples:
- The building looks proportionate, with each side the same as the other.
- Her arms and legs are proportionate and match well.
