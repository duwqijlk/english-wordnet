simpleMeaning: Passed widely from hand to hand in Europe in the Middle Ages, this gold coin came from
  the Byzantine Empire.
scope: Bezzant, byzant and solidus are other names for this gold coin of the Byzantine Empire, which passed
  from hand to hand across Europe in the Middle Ages.
examples:
- The merchant paid with a bezant from the Byzantine Empire.
- Bezants passed from hand to hand across Europe in the Middle Ages.
