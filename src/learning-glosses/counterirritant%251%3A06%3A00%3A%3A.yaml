simpleMeaning: A medicine put on the skin to cause a slight swelling on the surface so that a deeper swelling
  underneath is eased
scope: This is a medicine put on the skin to cause a slight swelling on the surface so a deeper swelling
  is eased; not a medicine taken by mouth, and not a cream that simply cools the skin.
examples:
- The doctor rubbed a counterirritant into her sore shoulder.
- He used a counterirritant to ease the deep ache in his back.
