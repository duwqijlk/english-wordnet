simpleMeaning: The fifth church-wide meeting in 553 that said the writings of Origen were false teaching.
scope: Constantinople is another name for this sense, for the fifth church-wide meeting held in 553, not
  the city of Constantinople itself.
examples:
- The Second Council of Constantinople met in 553.
- The Second Council of Constantinople judged the writings of Origen to be false teaching.
