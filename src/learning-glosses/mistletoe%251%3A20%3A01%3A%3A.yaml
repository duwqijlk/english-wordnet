simpleMeaning: an Old World bush that lives on and feeds from other plants, with branching greenish stems,
  thick tough leaves and sticky waxy white berries; the kind long used at Christmas
scope: This is the Old World kind with sticky white berries, long used at Christmas; it is not the American
  plants that look like it, and not the central and south-east Europe kind that grows on beech, chestnut
  and oak trees.
examples:
- They hung mistletoe over the door at Christmas.
- The mistletoe on the tree had small white berries.
