simpleMeaning: The unlawful taking of plants of a land by big firms, who then claim them as their own
  by law.
scope: The unlawful taking of plants of a land by big firms, who then claim them as their own by law;
  not fair trade and not farming.
examples:
- Biopiracy took the rare plant from the forest for a firm's gain.
- The tribe fought biopiracy of its healing plants.
