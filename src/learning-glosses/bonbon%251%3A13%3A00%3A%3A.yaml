simpleMeaning: a candy that usually has a middle of fondant (a soft sweet paste), fruit or nuts, with
  chocolate all over the outside
scope: This is a chocolate-covered candy with a middle of fondant, fruit or nuts, not a plain chocolate
  bar and not a hard candy with no middle.
examples:
- She ate a bonbon with a nut in the middle.
- He chose a fruit bonbon from the box.
