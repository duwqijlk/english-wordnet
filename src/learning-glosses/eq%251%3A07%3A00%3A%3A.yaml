simpleMeaning: In chemistry, the weight of a basic substance that joins with a set weight of another substance;
  the set weight for oxygen is 8
scope: In chemistry, this is the weight of a basic substance that joins with a set weight of another substance;
  equivalent, combining weight and equivalent weight are other names for this sense, not the weight of
  one atom on its own.
examples:
- The eq of the metal was worked out from its joining power.
- Chemists use eq when they compare how much of each substance joins together.
