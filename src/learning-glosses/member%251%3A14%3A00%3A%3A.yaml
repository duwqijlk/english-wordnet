simpleMeaning: a group or state that belongs to another organization, especially a country in a group
  of nations
scope: This is a whole organization or country that belongs to another organization, not one person who
  joins a club.
examples:
- Canada is a member of the United Nations.
- The library was a member of the interlibrary loan association.
