simpleMeaning: A thick liquid and strong oxidizer, which reacts vigorously with other substances; it bleaches
  powerfully, disinfects mildly when mixed with water, and at high strength helps rocket fuel burn.
scope: One of two names for this bleaching, disinfecting liquid, the other being hydrogen peroxide; it
  is not the whole family of peroxide compounds, nor the verb meaning to bleach with it.
examples:
- Dilute peroxide is often used to clean a scraped knee.
- The bottle of peroxide in the bathroom cabinet had lost its strength.
