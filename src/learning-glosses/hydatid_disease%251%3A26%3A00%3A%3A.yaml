simpleMeaning: tiny young tapeworms, a kind of flat worm that lives inside animals, have got into a body
  and are living there
scope: An illness caused by young tapeworms living inside the body, also called echinococcosis and hydatidosis;
  not an illness caused by grown tapeworms and not a bite.
examples:
- The sheep had hydatid disease, and the vet found cysts full of young worms in its liver.
- Doctors found hydatid disease in the farmer after months of stomach pain.
