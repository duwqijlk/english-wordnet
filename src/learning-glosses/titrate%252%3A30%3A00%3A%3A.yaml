simpleMeaning: To work out the strength or amount of a liquid by adding a second liquid drop by drop until
  it changes.
scope: A way of measuring how strong a liquid is, by adding another liquid drop by drop until it changes.
examples:
- The chemist will titrate the acid to find its strength.
- She learned to titrate solutions in her first chemistry class.
