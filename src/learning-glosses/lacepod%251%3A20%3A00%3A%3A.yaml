simpleMeaning: Flat winged cases, each holding one seed, follow the thin stems of small white flowers
  on this plant, which lives for one year and has deeply cut leaves low down.
scope: Also called fringepod, this is a one-year plant with small white flowers and winged seed cases.
examples:
- The lacepod grew along the path, its white flowers in thin sprays.
- After the lacepod flowered, winged seed cases formed.
