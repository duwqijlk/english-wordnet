simpleMeaning: In physics, a spot in a picture of all the ways a system can change, which the system moves
  toward no matter where it starts
scope: This is a point in physics, also called attractor, that a system moves toward no matter where it
  starts, not a real place the system sits in.
examples:
- The attracter is the point the system moves toward.
- No matter where it starts, the system moves toward its attracter.
