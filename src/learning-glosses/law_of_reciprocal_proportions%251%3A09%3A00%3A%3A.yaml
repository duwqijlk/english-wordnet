simpleMeaning: In chemistry, two kinds of stuff join each other in the same amounts in which each of them
  joins a third kind.
scope: Also called the law of equivalent proportions, this rule is about the amounts in which two kinds
  of stuff join a third kind and then each other.
examples:
- The law of reciprocal proportions says the two stuffs join each other in the same amounts they joined
  the third stuff.
- The law of reciprocal proportions let him work out how the two stuffs would join from how each joined
  the third.
