simpleMeaning: The pouring out of smoke or melted rock from a volcano, or the rock left behind after it.
scope: The pouring out of smoke or melted rock from a volcano; also called eruption or eructation, not
  a slow leak of water and not the eruption of a geyser.
examples:
- Extravasation covered the slope with fresh lava.
- The volcano's extravasation left a wide field of rock.
