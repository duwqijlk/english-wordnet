simpleMeaning: larger in size, more important, or higher in amount or level than something else.
scope: This is not a word for something excellent or admirable, and not a comparison of quality; it compares
  size, importance, or degree.
examples:
- The risk of injury is greater for people who work at heights.
- Her influence in the company is greater than her job title suggests.
