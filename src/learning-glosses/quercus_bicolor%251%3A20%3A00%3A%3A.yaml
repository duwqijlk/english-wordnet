simpleMeaning: A large deciduous oak of eastern America with flaky bark and leaves with fewer lobes than
  other white oaks, giving heavy strong wood for building and thriving in wet soil.
scope: Also called swamp oak and swamp white oak; a deciduous oak of the eastern United States with flaky
  bark and leaves with fewer lobes than other white oaks, giving heavy, strong wood used in building and
  growing in wet soil.
examples:
- Quercus bicolor grew beside the marsh, its bark peeling in flakes.
- The heavy wood of Quercus bicolor was used to build the barn.
