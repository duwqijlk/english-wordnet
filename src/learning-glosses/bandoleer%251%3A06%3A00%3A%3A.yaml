simpleMeaning: A wide belt that soldiers wear over the shoulder to carry bullets
scope: A wide belt for bullets worn over the shoulder by soldiers, not an ordinary belt round the waist
  and not a bag for bullets; bandolier is another name for it.
examples:
- The soldier wore a bandoleer across his chest.
- His bandoleer held rows of cartridges.
