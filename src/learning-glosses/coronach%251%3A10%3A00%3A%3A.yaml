simpleMeaning: A sad song or hymn made or sung to remember a person who has died
scope: A sad song or hymn made or sung to remember a dead person; dirge, lament, requiem and threnody
  are other names for this sense, not a happy song.
examples:
- The singers sang a coronach at the funeral.
- A coronach was played in memory of the fallen soldier.
