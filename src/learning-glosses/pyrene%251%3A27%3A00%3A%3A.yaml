  hard grains with the formula C16H10.
scope: This pale yellow chemical from coal tar is not the hard seed case of a fleshy fruit, a different
  sense of the same word.
examples:
- The pyrene came from coal tar as pale yellow grains.
- Pyrene has the formula C16H10.
