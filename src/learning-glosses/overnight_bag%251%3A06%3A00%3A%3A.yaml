simpleMeaning: A small case for clothes and small things, carried on a trip that lasts one night.
scope: A small case for one night's trip; overnighter and overnight case are other names for this sense,
  not a large case for a long trip and not a handbag.
examples:
- She packed an overnight bag for her one-night stay.
- He carried his overnight bag onto the train.
