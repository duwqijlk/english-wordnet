simpleMeaning: Not being able to be trusted or counted on, because something is not steady
scope: Not being able to be trusted or counted on, because something is not steady; not the state of being
  unable to make up your mind.
examples:
- The instability of the old bridge kept drivers away.
- The instability of the power supply made the lights go out again and again.
