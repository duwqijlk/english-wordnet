senseId: 'normalcy%1:07:00::'
synsetId: 04802662-n
simpleMeaning: the quality of being what people expect because it is usual, regular or common
scope: 'Also called normality: this is the quality of being what people expect from something usual. It
  is not the state of a person or thing working within set limits in a usual way.'
examples:
- After the storm, the return of the buses brought a sense of normalcy to the town.
- People liked the normalcy of their daily routine at work.
