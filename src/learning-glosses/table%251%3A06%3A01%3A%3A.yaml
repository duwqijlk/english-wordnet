simpleMeaning: a piece of furniture with a flat top held up by legs, used for putting things on.
scope: It is the bare object itself, not one already laid with plates for a meal and not a chart of data.
examples:
- We put the books on the table by the window.
- He wiped the kitchen table after dinner.
