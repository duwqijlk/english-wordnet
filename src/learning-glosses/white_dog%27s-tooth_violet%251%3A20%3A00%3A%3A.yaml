simpleMeaning: Yellow in the middle and blue or pink outside, its single pale flowers mark this North
  American plant.
scope: Also called white dogtooth violet and blonde lilian, this North American plant bears single pale
  flowers, yellow in the middle and blue or pink outside, never in bunches.
examples:
- A white dog's-tooth violet stood alone.
- The white dog's-tooth violet showed yellow in the middle.
