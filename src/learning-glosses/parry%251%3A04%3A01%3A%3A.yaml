simpleMeaning: In fencing, the act of stopping a thrust or turning it aside with a round move of the sword
scope: In fencing, a move that stops a thrust, not a hit and not a way of putting off a hard question.
examples:
- His parry turned the blade aside just in time.
- She answered the thrust with a quick parry.
