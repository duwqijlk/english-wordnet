simpleMeaning: The gaps between the ribs of the chest get their blood from several blood tubes.
scope: The intercostal artery is the name for these several blood tubes, which feed the gaps between the
  ribs of the chest.
examples:
- The arteria intercostalis supplies the space between two ribs.
- Blood flows through the arteria intercostalis to the gaps between the ribs.
