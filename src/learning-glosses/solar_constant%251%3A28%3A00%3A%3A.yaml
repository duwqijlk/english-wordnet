simpleMeaning: The amount of the sun's energy that falls on each bit of the outer edge of the air round
  the earth in a set time
scope: The amount of the sun's energy that falls on each bit of the outer edge of the air round the earth
  in a set time; not the heat felt on the ground, and not the light of the moon.
examples:
- Scientists measure the solar constant from satellites.
- The solar constant stays nearly the same year after year.
