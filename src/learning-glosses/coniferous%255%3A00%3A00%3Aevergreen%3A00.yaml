simpleMeaning: Describes trees or bushes that carry seed cases and keep green leaves all year.
scope: Also called cone-bearing; describes trees and bushes with seed cases and leaves that stay green,
  not trees that lose their leaves in winter.
examples:
- Coniferous forests stay green through the winter.
- The coniferous trees kept their needles all year.
