simpleMeaning: When blood is low because the body has too little iron, this medicine lifts the red part
  of the blood that carries oxygen
scope: A medicine, also called hematinic, that raises the red part of the blood, used for low blood from
  too little iron, not a painkiller and not a vitamin.
examples:
- The doctor gave her a haematinic after her blood test showed too little iron.
- He took the haematinic each morning to build up his blood.
