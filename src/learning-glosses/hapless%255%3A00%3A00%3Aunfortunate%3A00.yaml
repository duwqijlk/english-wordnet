simpleMeaning: a person others feel sorry for, or should feel sorry for
scope: 'Also called poor, miserable, wretched, pathetic, or pitiful: a person others feel sorry for, or
  should feel sorry for, not just someone who has had bad luck and not someone who is sad themselves.'
examples:
- The hapless victims of the war had lost everything.
- A hapless child stood at the door, cold and hungry.
