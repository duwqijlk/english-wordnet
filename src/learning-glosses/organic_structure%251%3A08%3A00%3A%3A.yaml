simpleMeaning: the whole body of a living thing, animal, plant, or human being
scope: It is all the parts of a living thing taken together, not one single part of it and not the way
  it acts.
examples:
- The organic structure of the plant includes roots, stem, and leaves.
- Doctors study the organic structure of the human body.
