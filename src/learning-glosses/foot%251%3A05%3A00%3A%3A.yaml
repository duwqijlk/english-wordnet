simpleMeaning: Any body part that lets an animal without a backbone move about or hold on.
scope: A moving or gripping organ on an animal without a backbone, not the leg ending of a backboned animal,
  the metrical unit of poetry, or a support shaped like a leg ending.
examples:
- A snail glides along on a broad muscular foot.
- The starfish uses hundreds of tiny tube feet to crawl across the seabed.
