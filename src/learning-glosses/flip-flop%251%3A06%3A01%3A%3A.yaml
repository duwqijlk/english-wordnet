senseId: 'flip-flop%1:06:01::'
synsetId: 03368854-n
simpleMeaning: An open shoe with no back, held on the foot by a strap that passes between the big toe
  and the next toe.
scope: A backless shoe held on by a strap between the toes, also called a thong; not a shoe with a back
  and not a sudden change of mind.
examples:
- She wore flip-flops to the beach.
- His flip-flop broke when the strap came loose.
