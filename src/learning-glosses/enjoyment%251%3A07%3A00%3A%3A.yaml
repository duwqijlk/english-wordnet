simpleMeaning: In law, the use of the legal right to get the good things that come from owning something
scope: In law, using the right to get the good things from owning property, not the feeling of pleasure.
examples:
- The family was given the enjoyment of the house for the year.
- Her enjoyment of the land was set out in the will.
