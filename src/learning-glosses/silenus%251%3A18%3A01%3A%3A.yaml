simpleMeaning: one of the lesser gods of the woods who went with Dionysus, much like the satyrs
scope: One of the lesser gods of the woods who went with Dionysus, much like the satyrs; not a satyr himself
  and not a great god like Zeus.
examples:
- A silenus played the pipes in the wood.
- The old tale tells of a silenus who followed Dionysus.
