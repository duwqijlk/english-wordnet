simpleMeaning: A cheap stiff sheet made from wood chips pressed together and stuck with man-made resin
scope: A cheap stiff sheet made from wood chips pressed together and stuck with man-made resin, not plywood
  and not solid wood; chipboard is another name for this sense.
examples:
- The back of the cupboard is made of hardboard.
- Hardboard is cheap because it is pressed wood chips.
