simpleMeaning: a way of acting that keeps people at a distance and shows little care for them
scope: 'Also called remoteness: a person''s cold, distant way of acting, not the fact that a place is
  far away.'
examples:
- Her aloofness made new workers afraid to ask her for help.
- He was known for his aloofness and rarely talked with his neighbours.
