simpleMeaning: Hidden aims and hidden ways mark the way this kind of action is carried out
scope: Also called secret, underground, surreptitious, undercover, clandestine, cloak-and-dagger, hugger-mugger
  and hush-hush, this is a thing done with hidden aims, not a small and unimportant part of life.
examples:
- The hole-and-corner deal was kept from the press until it was done.
- They ran a hole-and-corner plan to move the goods at night.
