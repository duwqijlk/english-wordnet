simpleMeaning: A tree whose bark is rough, smells bad and is toxic, with strong, durable timber; its bark
  and seeds serve as a laxative, a worm treatment and a narcotic.
scope: Another name for the cabbage-bark tree, the toxic timber tree; not a piece of bark, nor the Australian
  palm with edible buds.
examples:
- Cabbage bark yields a strong wood that resists decay.
- The seeds of cabbage bark were used as a worm treatment.
