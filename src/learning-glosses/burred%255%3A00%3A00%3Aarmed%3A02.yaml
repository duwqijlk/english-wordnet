simpleMeaning: Covered with barbs, quills, spines, thorns, stiff hairs, or the like, that guard it.
scope: Also called prickly, bristled, barbed, thorny, bristly, spiny, barbellate, briary, briery, burry,
  setaceous, or setose, covered with sharp bits that guard it.
examples:
