simpleMeaning: These veins join the veins on the back of the hand to those on the palm, or the veins on
  the top of the foot to those on the sole.
scope: Also called intercapitular vein, these veins join the veins on the back and palm of the hand, or
  the top and sole of the foot.
examples:
- The vena intercapitalis joins the veins on the back of the hand to those on the palm.
- A vena intercapitalis links the veins on the top of the foot with those on the sole.
