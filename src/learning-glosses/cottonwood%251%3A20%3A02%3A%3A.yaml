simpleMeaning: a tree of the kind called American basswood, which grows in the Allegheny area
scope: This is the American basswood tree of the Allegheny area; it is not the other cottonwood, a North
  American tree whose seeds have soft white parts like cotton.
examples:
- The cottonwood in this valley is a basswood, not a poplar.
- They planted a cottonwood, the Allegheny kind of basswood, near the river.
