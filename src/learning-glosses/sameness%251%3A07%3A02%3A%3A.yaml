simpleMeaning: A dull state where things keep happening in a set way, with no change and nothing new
scope: 'Also called monotony and humdrum: a dull state where things keep happening in the same set way
  and nothing is new, not the simple fact that two things are alike.'
examples:
- The sameness of her daily work made her tired and bored.
- He left the job because of the sameness of each day.
