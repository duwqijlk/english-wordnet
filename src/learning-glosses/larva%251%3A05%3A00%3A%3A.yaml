simpleMeaning: The young, free-living form of most animals without backbones, of amphibians, and of fish,
  which on hatching looks nothing like its parent and must change shape to become an adult.
scope: The young form of most animals without backbones, of amphibians — animals that live both in water
  and on land — and of fish, not the adult form.
examples:
- The larva swam free in the pond, nothing like the frog it would become.
- After the eggs hatched, the larvae fed in the water.
