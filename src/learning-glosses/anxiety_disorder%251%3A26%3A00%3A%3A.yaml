simpleMeaning: A general name for a group of mind illnesses in which strong worry stands out as a key
  sign.
scope: A general name for mind illnesses where strong worry is a key sign, not one single illness and
  not a short spell of worry.
examples:
- Her anxiety disorder makes everyday worry hard to bear.
- He was treated for an anxiety disorder that kept him awake at night.
