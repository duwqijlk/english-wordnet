simpleMeaning: a snake with poison in its bite, from the south of Africa, known for the dark inside of
  its mouth
scope: A poison snake from the south of Africa with a dark mouth, not a snake without poison and not a
  snake from another place.
examples:
- When the black mamba opened its mouth, the dark inside showed.
- A black mamba in the south of Africa can kill with one bite.
