simpleMeaning: In grammar, the link between a word and the group of words that comes right after it
scope: A grammar link between a word and the words that follow it, not the growth of a cell wall in biology
  and not a pair of words joined by 'and'.
examples:
- '''Rudolph the red-nosed reindeer'' is an example of apposition.'
- In 'my friend Anna', the apposition links 'friend' and 'Anna'.
