simpleMeaning: Taking in 3 sides or groups
scope: A thing with 3 sides or groups taking part; three-party is another name for this sense; not a thing
  with two sides and not a shape with three corners.
examples:
- The three-way race was close to the end.
- They signed a three-way deal.
