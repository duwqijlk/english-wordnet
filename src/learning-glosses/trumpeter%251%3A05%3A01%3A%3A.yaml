simpleMeaning: A large bird like a crane that lives in groups in the forests of South America, with shiny
  black feathers and a loud, long cry; it is easy to tame
scope: This is the South American forest bird, not the white swan of North America and not a person who
  plays the trumpet.
examples:
- A trumpeter called loudly from the edge of the forest.
- The villagers kept a tame trumpeter near their homes.
