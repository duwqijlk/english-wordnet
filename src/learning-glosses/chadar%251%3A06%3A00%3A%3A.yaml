simpleMeaning: a cloth worn over the head by Muslim and Hindu women, also used as a veil and shawl
scope: A cloth worn over the head by Muslim and Hindu women, also used as a veil and shawl; chador, chaddar
  and chuddar are other names for this sense, not a hat and not a dress.
examples:
- She wore a chadar over her head.
- The chadar served her as both veil and shawl.
