simpleMeaning: Turning nitrites, a nitrogen salt, into a second nitrogen salt is what these tiny germs
  do
scope: Tiny germs that turn one nitrogen salt into another, also called nitric bacterium; not the germs
  that start from ammonia.
examples:
- The nitrate bacterium turns nitrites into nitrates in the soil.
- Nitrate bacteria help make nitrogen salts in the ground.
