simpleMeaning: a group of medicines that stop or slow down a process in the body
scope: A group of medicines that stop or slow down a process in the body; not the football player with
  the same name who stops other players.
examples:
- This blocker stops a process in the body that raises blood pressure.
- She takes a blocker every morning as part of her treatment.
