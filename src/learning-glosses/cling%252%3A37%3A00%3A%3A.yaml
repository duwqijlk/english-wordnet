simpleMeaning: to hold on to a thought or feeling in your mind and not let it go
scope: To stay tied to an idea or feeling in your mind, not to hold on to a thing with your hands and
  not fruit stuck to its stone.
examples:
- He clings to the idea that she might still love him.
- She still clings to her hope of going home one day.
