simpleMeaning: To lay down layers of rock so that one kind of layer follows another in turn
scope: To lay rock in layers that take turns, one kind after another; not to lay rock in one even mass
  and not to mix the layers up.
examples:
- Over time the river began to interstratify the rocks on its bed.
- The two kinds of rock interstratify in thin bands.
