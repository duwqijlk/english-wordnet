simpleMeaning: In genetics, bringing two different kinds of animal or plant together to get young that
  are a mix of both
scope: In genetics, the joining of different kinds of animal or plant to make mixed young, also called
  cross, crossbreeding, crossing, hybridization, hybridizing and interbreeding; not the joining of the
  same kind and not the young themselves.
examples:
- Hybridisation of the two wheat kinds gave plants that grew well in dry soil.
- The breeder used hybridisation to join a red rose with a white rose.
