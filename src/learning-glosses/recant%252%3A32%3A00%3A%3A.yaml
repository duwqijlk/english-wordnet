simpleMeaning: to say in a formal way that you no longer believe something you believed before, usually
  because of pressure from others
scope: 'Also called retract, forswear, and abjure: giving up a belief in a formal way. It is not just
  changing your mind in private, and not taking back one small fact you said.'
examples:
- Under pressure, he recanted his old beliefs in public.
- She was forced to recant what she had said about her faith.
