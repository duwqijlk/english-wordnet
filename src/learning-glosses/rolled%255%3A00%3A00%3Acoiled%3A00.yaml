simpleMeaning: The edges of petals or leaves curl inward, especially while they are still in bud.
scope: This botanical sense describes leaf or petal edges curling inward in the bud, not something wound
  up and tied, nor the verb meaning to turn over and over.
examples:
- The rolled leaves of the young fern keep their edges turned inward.
- In cold weather the rolled blades of the grass protect the growing tip.
