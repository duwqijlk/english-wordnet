senseId: 'rifled%3:00:00::'
synsetId: 02255822-a
simpleMeaning: of a gun, having lines that go round in a spiral cut inside the barrel (the long tube a
  bullet goes through)
scope: This sense describes a gun that has spiral lines cut inside its barrel; it does not mean that someone
  searched a place and took things, and it is not the gun by itself.
examples:
- He cleaned his rifled shotgun carefully.
- A rifled barrel helps the bullet spin as it leaves the gun.
