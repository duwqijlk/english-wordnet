simpleMeaning: In billiards, a shot where the white ball hits one ball and then hits the other ball
scope: Also called cannon. This is a shot in billiards where the white ball hits both other balls, not
  the verb sense of making such a shot.
examples:
- He won the point with a perfect carom off both balls.
- A carom is hard because the cue ball must touch both balls.
