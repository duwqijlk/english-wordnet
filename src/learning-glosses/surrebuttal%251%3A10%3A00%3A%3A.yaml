senseId: 'surrebuttal%1:10:00::'
synsetId: 06575631-n
simpleMeaning: In law, a written statement by the person who started a court case, made in answer to the
  other side's rebutter
scope: This is a court statement by the person who brought the case, also called surrebutter; not a statement
  by the defendant and not the first statement in a case.
examples:
- The lawyer filed a surrebuttal after the defence replied.
- Her surrebuttal answered the points the defendant had made.
