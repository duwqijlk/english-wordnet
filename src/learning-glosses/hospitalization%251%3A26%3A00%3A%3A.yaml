simpleMeaning: The state of being in hospital, looked after there as a patient.
scope: The state of being in hospital as a patient, not insurance that pays for a hospital stay, not the
  act of placing a person in hospital, and not the time spent shut up in one.
examples:
- The cost of hospitalization worried the family.
- The doctor ordered her hospitalization after the fall.
