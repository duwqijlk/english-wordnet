simpleMeaning: A harmless swelling made of a mass of blood tubes, and some of these swellings show as
  birthmarks.
scope: A harmless swelling made of a mass of blood tubes, and some of these swellings show as birthmarks;
  hemangioma is another name for it, not a swollen vein near the opening where solid waste leaves the
  body and not a build-up of blood in the body.
examples:
- The baby had a haemangioma that showed as a birthmark.
- Her haemangioma was a harmless mass of blood tubes.
