simpleMeaning: A side arm of the main gut blood tube that feeds the last part of the small gut.
scope: A side arm of the main gut blood tube that feeds the last part of the small gut, also called arteria
  ilealis and ileal artery; not the arm that feeds the middle part of the small gut and not a vein of
  the gut.
examples:
- The intestinal artery feeds the last part of the small gut.
- A block in the intestinal artery starved the gut of blood.
