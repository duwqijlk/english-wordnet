simpleMeaning: In Jewish folk tales, a demon that goes into a living person's body and takes over how
  that person acts
scope: In Jewish folk tales, a demon that goes into a living person and takes over their acts, also called
  a dibbuk; not a ghost that haunts a place and not an illness of the mind.
examples:
- In the old tale, a dybbuk entered the young man's body.
- The dybbuk made its host speak in a strange voice.
