senseId: 'cloister%2:30:00::'
synsetId: 00496572-v
simpleMeaning: To shut yourself or another person away from the world, in or as if in a place where people
  live apart for religion
scope: Shutting a person away from the world; not putting a covered walkway around a garden or other place,
  and not the place itself where people live apart.
examples:
- She cloistered herself in the office and saw no one all day.
- He cloistered himself in a quiet house far from the town.
