simpleMeaning: A liquid with no colour and a sharp smell, at times used as a drug that wakes the body
  up, by people who misuse drugs.
scope: A sharp-smelling liquid used at times as a waking drug, also called isobutyl nitrite; not a medicine
  given by a doctor and not a cleaning liquid.
examples:
- Butyl nitrite has a sharp smell that stings the nose.
- Some people misuse butyl nitrite as a drug.
