simpleMeaning: Various wild perennials bear white, pink or purple aster-like blooms in autumn and grow
  in damp ground from New Jersey to Florida and Texas.
scope: A fall-blooming wild perennial with aster-like flowers of the southeastern United States, not true
  chamomile.
examples:
- False chamomile covered the wet meadow in late September.
- Bees visited the false chamomile growing along the ditch.
