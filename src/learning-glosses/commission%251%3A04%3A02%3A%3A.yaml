simpleMeaning: the act of giving a person the authority to carry out particular duties.
scope: This is not the share-of-sales payment, and it is not the ship being made ready; it is the act
  of giving authority.
examples:
- The council approved the commission of an independent review.
- The king's commission of a new governor gave him power over the region.
