simpleMeaning: The part of the body in people from the neck down to the sheet of muscle under the lungs;
  the same part in other creatures that have a backbone.
scope: The part of the body in people from the neck down to the sheet of muscle under the lungs, and the
  same part in other creatures that have a backbone; also called the chest, and also pectus; not the part
  of an insect's body that holds its wings and legs.
examples:
- The blow struck him in the thorax and winded him.
- The doctor listened to the patient's thorax with a stethoscope.
