simpleMeaning: Sky-blue flowers shaped like funnels grow on damp open heaths, on a gentian of Europe and
  Asia that lives for years.
scope: This gentian of damp open heaths is also called marsh gentian, not one that grows on dry ground.
examples:
- The calathian violet opened its sky-blue flowers on the damp heath.
- We found calathian violet growing on the damp open heath.
