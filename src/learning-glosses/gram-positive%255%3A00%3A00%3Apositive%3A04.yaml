simpleMeaning: In the study of germs, of a germ that keeps the violet colour used in a set way of staining.
scope: Of a germ that keeps the violet colour used in a set way of staining, not one that lets it wash
  away, as in the Gram-negative sense.
examples:
- Gram-positive germs keep the violet colour.
- The germ was Gram-positive, so it kept the violet colour used in the test.
