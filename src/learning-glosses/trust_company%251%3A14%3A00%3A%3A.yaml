simpleMeaning: A firm that acts for others, usually with a commercial bank, looks after money held for
  them, things in its care, shares that change hands, or other such work.
scope: This firm is also called a trust corporation.
examples:
- The trust company looked after the money left for the children.
- She asked the trust company to handle the shares.
