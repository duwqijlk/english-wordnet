simpleMeaning: An engine in which a spinning set of blades, driven by a turbine, sends extra air to the
  burner and gives extra push.
scope: An engine in which a spinning set of blades driven by a turbine sends extra air to the burner for
  extra push, also called turbofan, fan-jet and fanjet engine; not a plain engine without such blades
  and not a propeller engine.
examples:
- The fanjet gave the plane extra thrust on take-off.
- A fanjet uses a turbine-driven fan to push extra air into the burner.
