simpleMeaning: Of or to do with the people or the language of the country of that name, the northern peninsula
  and parts of the western island group.
scope: This is a word for the people or the language of Malaysia and the nearby lands, not a word for
  a member of that people; Malayan is another name for it.
examples:
- Malay peoples live across Malaysia and the nearby islands.
- She studies the Malay language.
