simpleMeaning: a complaint said in a sad, high, unhappy voice that goes on a long time
scope: 'Also called whine: a sad complaint said in a high, unhappy voice, not the verb sense of crying
  weakly or softly.'
examples:
- '"It''s not fair," she said with a whimper.'
- His answer was only a weak whimper that he did not want to go.
