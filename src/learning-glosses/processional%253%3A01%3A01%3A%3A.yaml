simpleMeaning: Made to be used as people walk in line.
scope: Made to be used as people walk in line, not the church music played for such a walk, and not a
  thing to do with a procession in general.
examples:
- The cross was processional, carried at the front of the walk.
- The banner was processional, made to be carried in the walk.
