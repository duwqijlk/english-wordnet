simpleMeaning: a company record that lets staff who sell or run the business put the cost of work trips
  and hosting guests on the firm
scope: A company record for work costs, not a personal bank record and not a travel budget.
examples:
- She put her hotel bill on her expense account.
- The firm checks each expense account at the end of the month.
