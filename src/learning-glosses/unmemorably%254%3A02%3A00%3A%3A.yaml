synsetId: 00401612-r
simpleMeaning: in a way that is easy to forget and leaves no strong mark on the mind
scope: For something done or said in a way that makes little lasting impression, as opposed to a memorable
  one.
examples:
- The evening passed unmemorably, and no one spoke of it again.
- He spoke unmemorably for an hour.
