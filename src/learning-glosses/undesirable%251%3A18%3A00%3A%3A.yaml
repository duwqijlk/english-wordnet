simpleMeaning: a person who other people do not want to have there
scope: A person who is not wanted in a place; not the describing word for a person or thing that is not
  fit to be chosen, especially as a husband or wife.
examples:
- The hotel staff asked the undesirables to leave the lobby.
- He was treated as an undesirable and was not allowed to enter.
