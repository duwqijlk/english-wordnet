simpleMeaning: a way of typing where the fingers are trained to hit the right keys, so the typist can
  read and type at the same time
scope: This is a way of typing where the fingers are trained to hit the right keys; touch typing is another
  name for this sense, and it is not a computer display you press or just any way of typing.
examples:
- He learned the touch system so he could type without looking down.
- With the touch system, she read the notes and typed at the same time.
