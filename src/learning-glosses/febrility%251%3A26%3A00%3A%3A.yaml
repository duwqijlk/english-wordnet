simpleMeaning: A rise in how hot the body is, often showing that an infection is present in the body
scope: 'Also called fever, febricity, feverishness, or pyrexia: a rise in how hot the body is, not heat
  from hard work and not a warm bath.'
examples:
- The child's febrility worried her mother all evening.
- His febrility fell once the medicine began to work.
