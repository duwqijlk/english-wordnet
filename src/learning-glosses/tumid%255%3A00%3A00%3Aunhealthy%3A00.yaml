simpleMeaning: Swollen out of shape, especially by fluids or gas.
scope: This sense is also called swollen, puffy, bloated, distended, turgid, and tumescent, for being
  swollen out of shape, especially by fluids or gas, where swollen is grown far bigger than it should
  be, most of all with fluid or gas inside it, unlike the sense for, of the sex organs, stiff and hard.
examples:
- The limb was tumid, swollen out of shape.
- The belly was tumid, swollen by fluids.
