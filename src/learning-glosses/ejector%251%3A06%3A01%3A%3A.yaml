simpleMeaning: A kind of pump that moves a liquid or gas along by means of a jet of steam or water.
scope: A kind of pump that moves a liquid or gas along by means of a jet of steam or water, also called
  injector, eductor-jet pump, steam ejector, steam injector, or thermocompressor, not a part in a gun
  that throws out the empty case after firing.
examples:
- The ejector cleared the tank with a jet of steam.
- A steam ejector kept the condenser free of air.
