simpleMeaning: Work for a performer or a group of performers that lasts only for a limited time
scope: This is work for performers that lasts for a limited time; it is not a promise to marry someone
  and not an agreed meeting or time to meet.
examples:
- The band got a two-week engagement at the theatre.
- Her summer engagement as a singer took her to three towns.
