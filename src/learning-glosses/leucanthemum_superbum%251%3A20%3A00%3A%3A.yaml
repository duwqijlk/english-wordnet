simpleMeaning: A garden flower bred from Chrysanthemum maximum and Chrysanthemum lacustre, with large
  white flower heads like oxeye daisies; often put in the genus Chrysanthemum.
scope: A large white garden flower, not an oxeye daisy and not a wild daisy; also called shasta daisy
  and Chrysanthemum maximum maximum.
examples:
- Leucanthemum superbum towers over the other daisies.
- Leucanthemum superbum blooms white all summer.
