scope: This is a tiny worm like a small eel that feeds on the tiny living things that turn liquids sour,
  also called vinegar eel, vinegar worm and Turbatrix aceti; not a large worm and not a worm that lives
  in soil.
examples:
- Anguillula aceti lived in the vinegar.
- The tiny Anguillula aceti fed on the things that made the vinegar sour.
