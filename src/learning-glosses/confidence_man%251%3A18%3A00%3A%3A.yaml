simpleMeaning: a male person who wins the trust of someone and then tricks them out of money
scope: This is a male swindler who first wins a person's trust and then tricks them out of money; con
  man is another name for this sense, and it is not a confidence woman or a plain thief.
examples:
- The confidence man won the old lady's trust before taking her savings.
- Police warned that a confidence man was working the market, offering deals that were too good to be
  true.
