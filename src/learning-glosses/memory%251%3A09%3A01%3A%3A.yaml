simpleMeaning: the mental process of storing past experiences and bringing them back to mind.
scope: This is not a device that stores data and not one particular thing recalled; it is the mind's general
  ability to keep and recover past experience.
examples:
- He has an excellent memory for faces.
- Sleep plays an important role in memory.
