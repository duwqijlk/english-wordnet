simpleMeaning: a false story made on purpose to lead people to believe something that is not true
scope: A false story made on purpose so people believe what is not true, not a true report and not a false
  story told by mistake.
examples:
- The story about the mayor was a canard, and no one should believe it.
- He spread a canard about his rival to harm her good name.
