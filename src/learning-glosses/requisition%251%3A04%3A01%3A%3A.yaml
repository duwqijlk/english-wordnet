senseId: 'requisition%1:04:01::'
synsetId: 00088038-n
simpleMeaning: The act of taking another person's property and keeping it, so that the money it earns
  pays the demand it was taken for
scope: Taking and keeping someone else's property until money from it pays a demand, not an official request
  for something or an official taking over of something for army or public use.
examples:
- The court ordered the requisition of the land until the debt was paid from its rents.
- Under the requisition, the factory was held until its earnings covered the amount demanded.
