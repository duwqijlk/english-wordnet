simpleMeaning: behaviour that fits the situation; doing what is good
scope: 'Also called appropriateness: behaviour that fits the situation and doing what is good. Not being
  correct by a standard of beauty or style.'
examples:
- She acted with rightness and treated everyone fairly.
- The rightness of her conduct was clear to all who saw it.
