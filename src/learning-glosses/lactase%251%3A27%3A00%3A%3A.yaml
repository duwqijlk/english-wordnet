simpleMeaning: Any of a group of body chemicals, sold as Lactaid, that split milk sugar into two simpler
  sugars, glucose and galactose
scope: This is any of a group of body chemicals that split milk sugar into glucose and galactose, not
  the milk sugar itself and not a medicine for the stomach.
examples:
- Lactase helps the body break down the sugar in milk.
- People who lack lactase take a tablet before drinking milk.
