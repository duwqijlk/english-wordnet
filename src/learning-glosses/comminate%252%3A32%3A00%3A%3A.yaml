senseId: 'comminate%2:32:00::'
synsetId: 00866574-v
simpleMeaning: to curse someone, or say that they are evil and cut off from God, and warn them of God's
  punishment
scope: To curse someone or say they are cut off from God; accurse, execrate, anathematise, anathematize,
  anathemise and anathemize are other names for this sense; not a mild scolding, and not a blessing.
examples:
- In the old rite, the bishop would comminate those who broke the law of the church.
- He feared the curse and begged them not to comminate him.
