simpleMeaning: to a level far higher than is usual, so high that it shocks people
scope: About how much or how far a thing goes, as in very rich; not about doing something in a rude way
  linked to sex.
examples:
- He is obscenely rich and owns five big houses.
- The tickets were obscenely expensive for a short show.
