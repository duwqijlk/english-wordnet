simpleMeaning: Over-active parathyroid glands, or Paget's disease, most often break bone down too fast,
  leaving too much calcium in the blood.
scope: Blood with more calcium than it should carry is this condition, also called hypercalcaemia, not
  blood with too little.
examples:
- Hypercalcemia meant the blood calcium was far above normal.
- Paget's disease can bring on hypercalcemia.
