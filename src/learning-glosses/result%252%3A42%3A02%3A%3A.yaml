simpleMeaning: To produce something that remains afterwards, such as a mark or a stain.
scope: This transitive verb means to produce something that remains, like a mark or a stain. It is not
  the common intransitive 'result', which means to happen as a consequence; that sense takes 'from' and
  has no object. Transitive use like this is not idiomatic in modern English, where writers normally say
  'leave' or 'produce'.
examples:
- The evaporation resulted a crust of salt along the rim of the basin.
- The leak resulted a damp patch on the ceiling.
