simpleMeaning: the control of when things happen, and how fast, so they work well together, as in music,
  plays, sport, or machines
scope: The control of when things happen and how fast, so they work well together, not luck and not speed
  alone.
examples:
- Good timing made the joke land well.
- The runner's timing was perfect at the start.
