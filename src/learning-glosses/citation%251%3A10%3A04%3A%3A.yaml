simpleMeaning: In law, the act of quoting or naming spoken words, written parts, earlier court cases,
  or other things of the same kind
scope: In law, this is the act of quoting or naming words or earlier cases. Not the quoted words themselves,
  not a short note that names a source, and not an order to come to a court.
examples:
- His citation of earlier cases helped the court decide.
- The lawyer's citation of the old law was clear and short.
