simpleMeaning: From a volcano rose a mountain under the sea, found most often in the Pacific Ocean
scope: A mountain under the sea that rose from a volcano, most often in the Pacific Ocean, not a mountain
  on land and not a live volcano on an island.
examples:
- The guyot rose from the ocean floor off the coast.
- Scientists mapped the guyot in the Pacific.
