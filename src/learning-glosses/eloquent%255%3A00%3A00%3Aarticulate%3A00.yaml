simpleMeaning: able to speak easily and well, in a clear way that has a strong effect on people
scope: Speaking well and clearly with strong effect, also called silver and fluent, not merely talking
  a lot and not speaking in a hard, flat way.
examples:
- The eloquent speaker held the crowd for an hour.
- She gave an eloquent speech about the town's past.
