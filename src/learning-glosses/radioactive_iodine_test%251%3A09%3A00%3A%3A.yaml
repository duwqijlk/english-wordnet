senseId: 'radioactive_iodine_test%1:09:00::'
synsetId: 05752366-n
simpleMeaning: a way to check how well the thyroid gland works, by having the person swallow a small amount
  of a form of a chemical that gives off rays
scope: A check of thyroid work that uses a swallowed dose that gives off rays, not a blood test for thyroid
  levels and not a scan of the thyroid.
examples:
- The doctor ordered a radioactive iodine test to check how well her thyroid was working.
- His radioactive iodine test showed that his thyroid was working too fast.
