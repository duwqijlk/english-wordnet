synsetId: 06492394-n
simpleMeaning: At a set price on a set day ahead, a set amount of goods or paper worth money is bought
  or sold, and the deal can be sold first
scope: A deal to buy or sell at a set price on a set day ahead, not a sale that happens now and not a
  deal with no set day.
examples:
- They signed a futures contract to buy wheat at a fixed price next spring.
- She sold her futures contract before the settlement date.
