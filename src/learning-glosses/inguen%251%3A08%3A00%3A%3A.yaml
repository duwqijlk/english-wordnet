simpleMeaning: Where the inner leg meets the body, the skin folds, and this word means that fold with
  the area around it and often the outer sex parts.
scope: This fold at the top of the inner leg is also called the groin.
examples:
- The doctor pressed the inguen.
- He felt a sharp pain in the inguen.
