senseId: one%5:00:00:extraordinary:00
synsetId: 01682215-s
simpleMeaning: Used informally before a describing word to mean 'very' or to make it stronger.
scope: This is an informal intensifier before an adjective, not the number, not a unified whole, and not
  a pronoun for a person.
examples:
- That is one big dog you have there.
- She is one talented musician.
