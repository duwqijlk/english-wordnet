simpleMeaning: A member of the Sioux people who made up one arm of the Teton Sioux and once lived in the
  Black Hills of the west of South Dakota
scope: 'Also called Oglala: a member of the Sioux people who made up one arm of the Teton Sioux and once
  lived in the Black Hills of the west of South Dakota, not a speaker of the tongue of the same name or
  a member of another Sioux arm.'
examples:
- The Ogalala man told stories of the Black Hills.
- Ogalala families once lived in the west of South Dakota.
