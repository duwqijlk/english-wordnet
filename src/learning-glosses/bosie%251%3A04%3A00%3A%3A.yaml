simpleMeaning: a ball in cricket sent to turn one way that turns the other way instead
scope: 'Also called bosie ball and googly: a ball in cricket sent to turn one way that turns the other
  way instead, not a straight ball and not a ball that turns the way it looks.'
examples:
- The batsman missed the bosie and was bowled.
- He bowled a bosie that turned the other way.
