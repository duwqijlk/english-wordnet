simpleMeaning: A person who makes a thing hard to follow or deal with.
scope: A person who turns a plain thing into a hard one to follow, not a builder and not someone who solves
  hard things.
examples:
- The new manager was a complexifier who made every plain job hard to follow.
- A complexifier can turn a short talk into a long puzzle.
