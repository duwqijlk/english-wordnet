simpleMeaning: a person, or a member of a group, who moves around an area to watch over it and keep it
  safe
scope: A person who moves around an area to watch over it, not someone who only watches from one fixed
  place.
examples:
- The patroller walked the fence line each night.
- A patroller stopped to check the gate.
