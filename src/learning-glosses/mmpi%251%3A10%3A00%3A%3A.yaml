simpleMeaning: A test of 550 items about feelings and acts, where the person says yes or no to each, used
  to build many scales that rate traits and qualities of personality
scope: Also called the Minnesota Multiphasic Personality Inventory; a 550-item test in which a person
  agrees or disagrees with items about feelings and acts.
examples:
- She took the MMPI at the clinic.
- The MMPI has 550 items.
