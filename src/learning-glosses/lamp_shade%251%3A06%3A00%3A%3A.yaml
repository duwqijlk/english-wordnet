simpleMeaning: A pretty cover that shields a light and keeps the bright bulb out of direct view.
scope: A pretty cover that shields a light and keeps the bright bulb out of direct view; shade and lampshade
  are other names for this sense, not a bare bulb, and not a cover for a candle.
examples:
- She chose a new lamp shade for the bedroom lamp.
- The lamp shade softened the light in the room.
