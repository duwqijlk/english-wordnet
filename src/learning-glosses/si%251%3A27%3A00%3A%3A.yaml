simpleMeaning: A nonmetal that forms four bonds; after oxygen, the most common element in the earth's
  crust, found in clay, feldspar, granite, quartz, and sand, and used in small switches.
scope: A nonmetal common in the earth's crust, not oxygen and not a metal; also called silicon and atomic
  number 14.
examples:
- Si is found in sand and in quartz.
- Transistors are made with Si.
