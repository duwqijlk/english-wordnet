simpleMeaning: to make someone very tired, or to become very tired, through too much use, great strain
  or stress
scope: 'Also called wear, tire, weary, fatigue or jade: to make someone very tired, or to become very
  tired, through too much work or strain; not a cigarette.'
examples:
- Carrying the heavy boxes all day fagged her.
- He fagged himself out digging the garden.
