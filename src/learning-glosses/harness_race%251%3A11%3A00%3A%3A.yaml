simpleMeaning: A horse contest in which drivers ride in light two-wheeled carts behind horses that trot
  or pace
scope: A horse contest in which drivers ride in light two-wheeled carts behind horses that trot or pace,
  not a race ridden on the horse and not a steeplechase; harness racing is another name for this sense.
examples:
- He won the harness race at the county fair.
- A harness race is run with trotting horses pulling sulkies.
