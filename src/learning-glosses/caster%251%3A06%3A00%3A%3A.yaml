simpleMeaning: a wheel that can turn in any direction, fixed under furniture, trucks or machines that
  can be moved, so they are easy to move
scope: 'Also called castor: a wheel under furniture or a machine that can be moved, not a shaker for sugar
  and not a worker who makes things from hot metal.'
examples:
- One caster on the chair was broken, so the chair would not roll well.
- The heavy table moves easily because it has four casters underneath.
