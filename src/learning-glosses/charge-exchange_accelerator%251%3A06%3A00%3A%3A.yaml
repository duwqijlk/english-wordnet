simpleMeaning: a machine in which tiny bits that carry electric force and move with great power get out
  of hot glowing gas after they trade the force with other bits
scope: A machine in physics that lets fast charged bits escape from hot gas, not a machine that speeds
  bits up and not a device that stores electric force.
examples:
- The charge-exchange accelerator sent the ions out of the plasma in a fast stream.
- Engineers tested the charge-exchange accelerator to see how the ions left the plasma.
