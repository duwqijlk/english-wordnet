simpleMeaning: This sharp gap lies between the front-to-back line of a wing and the path of the wind past
  it, before the wing stirs the air.
scope: This is the sharp gap between a wing's front-to-back line and the path of the wind past it.
examples:
- The wing met the wind at a sharp angle of attack.
- The angle of attack grew when the wing tilted.
