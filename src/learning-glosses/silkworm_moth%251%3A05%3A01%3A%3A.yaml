simpleMeaning: The young of this mid-sized Asian winged insect eat mulberry leaves and turn what they
  eat into a fine thread for cloth.
scope: This mid-sized Asian insect is also called a bombycid or a bombycid moth.
examples:
- The silkworm moth's young turn mulberry leaves into a fine thread for cloth.
- Mulberry leaves feed the young of the silkworm moth.
