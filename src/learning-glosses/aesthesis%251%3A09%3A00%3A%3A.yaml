simpleMeaning: a plain first feeling that comes when something stirs one of the senses
scope: Also called sensation and esthesis, this is a plain first feeling from a sense, not a thought about
  it and not a strong feeling like joy or fear.
examples:
- A sensation of touch is one kind of aesthesis.
- The cold water gave him a sharp aesthesis on his skin.
