simpleMeaning: It moves the top of the leg, and it is one of three big bands of flesh that shape the buttock
scope: One of three big muscles that form the buttock and move the thigh, also called glute, gluteus and
  gluteus muscle; not a vein that drains the buttock and not a muscle that moves the arm.
examples:
- The gluteal muscle on her left side was sore after the climb.
- A strong gluteal muscle helps you push off when you run.
