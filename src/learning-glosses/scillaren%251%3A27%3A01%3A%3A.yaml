simpleMeaning: A crystal-like plant chemical of the steroid kind, found in squill (Drimia maritima).
scope: A crystal-like plant chemical from squill, used for the heart; not digitalis, a heart drug from
  foxglove, and not a plain heart pill.
examples:
- The doctor gave scillaren for her weak heart.
- Scillaren comes from the squill plant.
