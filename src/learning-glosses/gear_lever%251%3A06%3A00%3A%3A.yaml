simpleMeaning: a stick you move by hand to join or free the toothed wheels that change how fast something
  moves
scope: A stick moved by hand to join or free the toothed wheels, also called a gearshift, a gearstick,
  or a shifter, not the closed box that holds the wheels and not a lever that works the brakes.
examples:
- She pulled the gear lever into first before the car moved off.
- He moved the gear lever with his left hand.
