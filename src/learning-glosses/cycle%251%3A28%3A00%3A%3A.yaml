simpleMeaning: a length of time in which a set of things happen in the same order again and again
scope: This is a length of time in which a set of things happens in the same order again, also called
  round, and another name for it is rhythm. It is not one full time through a repeated thing, and not
  a unit for how often something happens.
examples:
- The cycle of the seasons lasts a year.
- The long cycle of wet and dry years can last for ten years.
