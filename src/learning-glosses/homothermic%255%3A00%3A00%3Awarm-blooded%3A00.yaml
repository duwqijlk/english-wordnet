simpleMeaning: A bird or mammal whose body keeps the same fairly high heat all the time
scope: Warm-blooded birds and mammals, also called homoiothermic and homeothermic, whose body heat stays
  steady and fairly high; not cold-blooded animals whose heat shifts with the air.
examples:
- A homothermic bird keeps its body warm through a cold night.
- Mammals are homothermic, so their heat stays steady inside.
