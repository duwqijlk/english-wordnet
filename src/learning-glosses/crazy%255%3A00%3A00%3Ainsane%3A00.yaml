simpleMeaning: suffering from a serious mental illness, so that the mind does not work normally.
scope: This is not the sense 'wildly excited' and not the everyday sense 'very silly or foolish'; it refers
  to real mental illness.
examples:
- The story tells of a king who went crazy and left his throne.
- After weeks without sleep, he feared he was going crazy.
