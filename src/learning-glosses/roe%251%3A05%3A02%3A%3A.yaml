simpleMeaning: a mass of eggs laid by some animals with hard shells that live in water, such as a lobster
scope: The eggs of a lobster or a like water animal with a hard shell; not the eggs of a fish, and not
  fish eggs served as food.
examples:
- The lobster carried its roe under its tail.
- Crab roe is bright orange in colour.
