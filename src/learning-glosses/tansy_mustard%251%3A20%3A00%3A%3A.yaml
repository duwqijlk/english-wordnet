simpleMeaning: A bitter-leaved herb of North America, its leaves made of many small leaflets along a stem,
  like the leaves of the plant it takes its name from.
scope: This is the North American herb with bitter leaves like those of the plant it takes its name from,
  not that plant itself.
examples:
- Along the fence grew tansy mustard.
- She pulled up some tansy mustard by the path.
