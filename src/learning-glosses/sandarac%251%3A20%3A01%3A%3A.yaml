simpleMeaning: A large evergreen cone-bearing tree growing in Spain and in North Africa, with flat branches
  and scale-like leaves; its hard wood smells sweet and its bark yields resin for varnish.
scope: The tree itself — sandarac tree is another name for it — not the fragrant wood or the brittle resin
  that also go by sandarac.
examples:
- The sandarac grows in parts of Spain and North Africa.
- Old sandarac trees have flattened branches covered in tiny scale-like leaves.
