simpleMeaning: having to do with the part of breathing when air leaves the body
scope: Of the breath going out, not of the breath coming in and not of holding the breath.
examples:
- The expiratory phase of breathing pushes air out of the lungs.
- An expiratory cough forces air out with a sharp burst.
