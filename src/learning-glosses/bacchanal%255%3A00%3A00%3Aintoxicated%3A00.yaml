senseId: bacchanal%5:00:00:intoxicated:00
synsetId: 00801277-s
simpleMeaning: Said of wild, drunken fun and revelry.
scope: This sense is also called carousing and orgiastic, for what is said of wild, drunken fun and revelry,
  unlike the sense for a wild meet with too much drink and loose sex, and unlike the sense for a drunken
  reveller, a lover of Bacchus.
examples:
- The night was bacchanal, wild with drunken fun.
- The revels were bacchanal, wild and drunken.
