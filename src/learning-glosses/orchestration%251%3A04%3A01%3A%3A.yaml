senseId: 'orchestration%1:04:01::'
synsetId: 00941634-n
simpleMeaning: the act of changing a piece of music so that a large group of players can play it, and
  choosing which part each instrument will play
scope: 'Also called instrumentation: this is the act of changing a piece of music so a large group of
  players can play it and giving a part to each instrument; it is not the finished written music itself,
  and not a plan for events that tries to get the strongest effect.'
examples:
- He spent a month on the orchestration of the song for the full orchestra.
- For the orchestration, she gave the main tune to the violins and a low part to the drums.
