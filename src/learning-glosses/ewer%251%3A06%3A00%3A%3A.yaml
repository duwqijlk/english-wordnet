simpleMeaning: an open container with a handle and a spout (the part that sticks out for pouring)
scope: 'Also called pitcher: this is an open container with a handle, used for pouring, not a closed bottle
  and not a small cup for drinking.'
examples:
- She filled the ewer with water and carried it to the table.
- A silver ewer stood beside the bowl on the old table.
