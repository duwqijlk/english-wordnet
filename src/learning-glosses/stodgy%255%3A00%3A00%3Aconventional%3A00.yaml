simpleMeaning: Far too set in old ways, with no new ideas, and dull because of it.
scope: Too set in old ways, with no new ideas, and dull because of it; also called stuffy.
examples:
- His views on music are stodgy and never change.
- The committee was stodgy, and the meeting dragged on.
