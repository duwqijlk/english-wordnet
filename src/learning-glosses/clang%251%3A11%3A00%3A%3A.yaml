simpleMeaning: a loud noise that rings out and repeats
scope: A loud ringing noise that repeats, also called crash, clash, and clank; not a single soft sound.
examples:
- The clang of distant bells could be heard across the town.
- A loud clang came from the metal gate as it shut again and again.
