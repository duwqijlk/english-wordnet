simpleMeaning: a long thin creature that digs in the ground in warm places and has eyes too small to see
  with
scope: This is a long thin burrowing creature of warm places, also called blind snake; not a worm and
  not a snake with working eyes.
examples:
- The worm snake burrowed into the soft soil after the rain.
- We found a worm snake under a stone in the warm garden.
