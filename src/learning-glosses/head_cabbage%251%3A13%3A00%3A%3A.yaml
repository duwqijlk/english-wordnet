simpleMeaning: any of several kinds of cabbage with a large tight round ball of leaves, that may be steamed,
  boiled, stir-fried, or eaten raw in coleslaw
scope: A cabbage with a large tight round ball of leaves, not the cabbage plant grown for its stalk and
  not a loose-leaf cabbage.
examples:
- We grew head cabbage in the garden and used it for coleslaw.
- The head cabbage was steamed and served with butter.
