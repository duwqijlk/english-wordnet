simpleMeaning: Usually named in the plural, this is the main workplace from which a whole firm is run
scope: Also called central office, headquarters, home base or main office, this is a firm's main workplace,
  not a branch workplace and not a room for working at home.
examples:
- The company's home office is in Chicago.
- All orders go through the home office.
