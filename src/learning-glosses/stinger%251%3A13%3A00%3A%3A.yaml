simpleMeaning: An alcoholic mixed drink made of brandy and creme de menthe, a sweet drink with a mint
  taste
scope: This is the drink made with brandy, not the sharp part on an animal that can hurt, not a sharp
  remark, and not a hard blow.
examples:
- The barman made her a stinger with brandy and creme de menthe.
- He ordered a stinger after dinner at the bar.
