simpleMeaning: following a fixed pattern, rule or plan, and happening again and again at the same times.
scope: This is not a word for a customer who visits a place often; it describes things that follow a set
  pattern.
examples:
- He keeps regular hours at work.
- The buses run on a regular timetable.
