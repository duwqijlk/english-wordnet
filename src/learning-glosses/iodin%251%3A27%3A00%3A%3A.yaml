simpleMeaning: A non-metal element of the halogen group, used in medicine first, photography and dyes;
  found in nature only in small amounts joined with things, as in sea water or rocks
scope: Also called I, iodine, or atomic number 53; a chemical element used in medicine, in photographs,
  and in dyes.
examples:
- The doctor painted iodin on the cut to keep it clean.
- The photographer kept iodin among the chemicals for making prints.
