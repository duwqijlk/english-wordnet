synsetId: 05805481-n
simpleMeaning: a sudden clear understanding that comes as part of solving a problem
scope: This is a sudden idea that helps solve a problem. It is not breathing in, not a god's special influence
  on minds, and not a general feeling that makes you want to make something new.
examples:
- In a moment of inspiration, she saw how to fix the puzzle.
- His inspiration came suddenly, and he wrote down the answer at once.
