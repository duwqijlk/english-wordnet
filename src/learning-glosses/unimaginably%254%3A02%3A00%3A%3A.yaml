schema: oewn-learning-gloss-v2
senseId: 'unimaginably%4:02:00::'
synsetId: 00490485-r
simpleMeaning: to a degree so great that a person cannot picture it in the mind
scope: It tells how great in degree something is, too great to picture; it does not name a thing, a person,
  or an action.
examples:
- The hall was unimaginably large, with rows of seats going on and on.
- Prices rose unimaginably fast in the weeks after the storm.
