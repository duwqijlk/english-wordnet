simpleMeaning: Set down, allowed, or punished by a law passed by lawmakers.
scope: Ordered, allowed, or punished under a statute, not the wider sense of simply coming from statutes.
examples:
- The statutory age limit is eighteen.
- Breaking the rule is a statutory offence.
