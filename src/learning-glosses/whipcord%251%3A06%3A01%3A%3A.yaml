simpleMeaning: A tough cloth of wool or cotton, with raised lines running across it on the slant.
scope: A tough wool or cotton cloth with a raised diagonal rib; not the hard twisted cord for whip lashes.
examples:
- He wore a whipcord jacket with a fine rib.
- The tailor cut the whipcord on the slant.
