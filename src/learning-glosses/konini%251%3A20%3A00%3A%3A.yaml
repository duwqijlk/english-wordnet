simpleMeaning: A straight shrub or small tree from New Zealand, up to ten feet high, with deep red flowers
  that lose their leaves each year
scope: This is a straight shrub or small tree from New Zealand with deep red flowers, also called native
  fuchsia and tree fuchsia, not a garden fuchsia and not a tree of another land.
examples:
- Konini grew along the edge of the New Zealand forest.
- The konini in the garden had deep red flowers in spring.
