simpleMeaning: The bank's good name stands in for the buyer's own in this bank paper, which stands behind
  a buyer's promise to pay.
scope: This bank paper puts the bank's good name behind a buyer's promise to pay, standing in for the
  buyer's own name.
examples:
- The letter of credit guaranteed payment to the seller.
- The bank issued a letter of credit for the buyer.
