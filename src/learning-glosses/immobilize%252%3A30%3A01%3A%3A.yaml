simpleMeaning: to forbid money or goods from being changed or used
scope: 'Also called block and freeze: to forbid money or goods from being used, not to hold money back
  as a reserve.'
examples:
- The court ordered the bank to immobilize the suspect's funds.
- The government will immobilize the assets of the hostile regime.
