simpleMeaning: A good-to-eat fungus with a wide rounded blackish-brown cap and an underside of tiny holes,
  yellow when young and darkening with age; stalk is thick and widens toward the base.
scope: A good-to-eat fungus with a wide rounded blackish-brown cap and an underside of tiny holes, distinct
  from fungi with gills under the cap and from fungi that are not good to eat.
examples:
- Boletus pulverulentus has a blackish-brown cap.
- We found Boletus pulverulentus with its thick stalk.
