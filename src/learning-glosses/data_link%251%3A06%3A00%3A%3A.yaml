simpleMeaning: A joining line between two or more places, made so facts can be sent and got back between
  them.
scope: A joining line between places for sending and getting facts; link is another name for it, not a
  phone line and not a single wire.
examples:
- The data link joins the two offices.
- They set up a data link between the sites.
