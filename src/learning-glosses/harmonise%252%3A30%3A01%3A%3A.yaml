simpleMeaning: To bring into tune, concord, or accord while making music or singing.
scope: To bring into tune, concord, or accord while making music or singing; also called chord or harmonize;
  not to bring sundry things into tune or join them in tune, nor to sing or play in tune, nor to write
  a tune for.
examples:
- Their choir would harmonise at dawn.
- The band did harmonise at noon.
