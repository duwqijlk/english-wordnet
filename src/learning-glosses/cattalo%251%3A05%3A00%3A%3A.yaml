simpleMeaning: A tough breed of cattle produced by crossing ordinary cattle with the American buffalo;
  its meat contains less fat than that of usual breeds.
scope: This is the hybrid of ordinary cattle and the American buffalo, bred for its low-fat meat; it is
  not a pure breed of either parent, and beefalo is another name for the same animal.
examples:
- Farmers experimented with cattalo in the late nineteenth century.
- Cattalo produce leaner meat than ordinary cattle.
