simpleMeaning: An upright plant that lives year after year in the north temperate zone, with feather-like
  leaves and a few hanging flowers with a brown-purple cup and orange and pink petals.
scope: Also called chocolate root and water avens, it is an upright plant that lives year after year in
  the north temperate zone, with feather-like leaves and a few hanging flowers with a brown-purple cup
  and orange and pink petals, unlike the sense for a North American plant that lives year after year with
  hairy low feather-like leaves and purple flowers and plume-tipped fruits.
examples:
- Purple avens hang their flowers.
- Purple avens grow in the north temperate zone.
