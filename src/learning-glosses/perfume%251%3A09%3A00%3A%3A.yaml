simpleMeaning: a pleasant smell that is different in its own way, so you can know it from other smells
scope: 'Also called scent, aroma and fragrance: this is a pleasant smell itself, not the sweet-smelling
  liquid you put on your skin and not the act of putting that liquid on.'
examples:
- The perfume of the roses filled the room.
- A sweet perfume came from the flowers in the garden.
