simpleMeaning: Grown in the Philippines most of all for the part under the ground that people eat, this
  bad-smelling aroid, a leafy plant, comes from southeast Asia.
scope: People also call it an elephant yam or pungapung, and it is a bad-smelling plant of southeast Asia
  grown in the Philippines most of all for the part under the ground that people eat.
examples:
- A telingo potato grew in the garden in the Philippines.
- They dug up a telingo potato and cooked its tuber.
