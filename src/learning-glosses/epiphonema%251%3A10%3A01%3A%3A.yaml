simpleMeaning: A sentence that cries out, makes a broad or sharp remark, or sums up in few words what
  has been said before.
scope: A sentence that cries out, makes a broad or sharp remark, or sums up in few words what has been
  said before, not a plain sentence that only gives facts and not a question.
examples:
- He closed his tale with an epiphonema that summed it up.
- The Reeve's epiphonema drove home his story of the cheating Miller.
