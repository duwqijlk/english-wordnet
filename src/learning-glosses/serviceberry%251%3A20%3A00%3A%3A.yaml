simpleMeaning: Blue-black or purplish fruit you can eat grows on one of many kinds of North American plants
  or low bushes with showy white flowers.
scope: Shadbush, juneberry, service tree and shadblow are other names for this North American plant with
  showy white flowers and blue-black or purplish fruit you can eat.
examples:
- The serviceberry had fruit you can eat, blue-black or purplish in colour.
- Showy white flowers grew on the serviceberry.
