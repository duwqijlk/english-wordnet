synsetId: 02547977-v
simpleMeaning: do what someone's rules, orders, or wishes say you should do
scope: This is not going after someone physically, tracking how something develops, or adopting a theory;
  it is doing what another person's rules, orders, or wishes require.
examples:
- The soldiers followed the captain's orders without question.
- If you follow the house rules, you will not get into trouble.
