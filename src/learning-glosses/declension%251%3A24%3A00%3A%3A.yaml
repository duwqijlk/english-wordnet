simpleMeaning: the way nouns, pronouns, and adjectives in Indo-European languages (a big family that includes
  Latin) change their endings to show their job in a sentence
scope: This is the act of changing word endings to show a job in a sentence; it is not a group of words
  that change in the same way and not a downward slope.
examples:
- Declension changes the ending of a Latin noun to show if it is the subject.
- Students practice declension by learning all the endings of a word.
