simpleMeaning: A book or other printed thing printed again with no changes and put on sale once more.
scope: A book printed again without changes and sold once more, also called a reprint or reprinting, not
  a new edition with changes.
examples:
- The publisher brought out a reissue of the old novel.
- Collectors sought the first reissue of the book.
