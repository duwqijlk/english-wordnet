simpleMeaning: a frame put up for looks at the top of a window to hide the parts that hold the curtains
scope: 'Also called pelmet, valance, and valance board: a frame at the top of a window that hides the
  parts holding the curtains, not the strip at the top of a wall or building and not the act of putting
  one up.'
examples:
- A wooden cornice hid the curtain rod above the window.
- She painted the cornice white to match the window frame.
