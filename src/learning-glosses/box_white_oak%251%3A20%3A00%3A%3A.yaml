simpleMeaning: Used above all for fence posts, a small tree of eastern and central United States, losing
  its leaves in fall, with dark green deeply cut leaves and tough waterproof wood
scope: Also called brash oak, iron oak, and post oak, this tree sheds its leaves each fall and gives tough
  wood that keeps water out, used above all for fence posts.
examples:
- The box white oak lost its leaves in the fall.
- They cut fence posts from the tough wood of a box white oak.
