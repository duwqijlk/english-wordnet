simpleMeaning: Top bosses of a company get a right they can use only if the company meets set money aims
scope: A right given to top bosses if the company meets money aims; incentive option is another name for
  this sense, not a wage and not a cash bonus.
examples:
- The incentive stock option let her buy shares once the company met its goals.
- His incentive stock options paid out only after the firm hit its money targets.
