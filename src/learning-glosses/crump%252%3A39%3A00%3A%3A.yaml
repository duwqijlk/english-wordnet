simpleMeaning: To give out the sound of a machine running with too little of the stuff that lets its parts
  slide.
scope: Also called thud and scrunch, the sound of a machine running with too little of the stuff that
  lets its parts slide, not a heavy blast with a loud, low noise.
examples:
- The old tractor began to crump as the oil ran low.
- They could hear the engine crump each time it turned over.
