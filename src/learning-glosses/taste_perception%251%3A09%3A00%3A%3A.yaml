simpleMeaning: A thing that can melt in water has a make-up the small buds on the tongue and in the throat
  can tell, and the feeling that comes is this.
scope: The feeling that comes when the buds on the tongue and in the throat send word about what a dissolved
  thing is made of; taste, gustatory perception, gustatory sensation and taste sensation are other names
  for it.
examples:
- His taste perception caught the bitterness at once.
- The taste perception told her the drink was sweet.
