senseId: 'extractant%1:27:01::'
synsetId: 92460302-n
simpleMeaning: A liquid that will not mix with another liquid, used to take something out of that other
  liquid.
scope: A liquid that will not mix with another liquid, used to take something out of it; not a liquid
  that mixes freely and not a solid used for the same job.
examples:
- The chemist chose an extractant that would not mix with water.
- Hydroxyoximes serve as extractants for copper.
