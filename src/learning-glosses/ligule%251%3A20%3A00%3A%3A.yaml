simpleMeaning: In botany, a part that sticks out from a plant, shaped like a long flat band
scope: A strap-shaped part on a plant, not a leaf and not a flower part.
examples:
- The ligule on the grass leaf was a thin, pale strip.
- Botanists use the ligule to tell one grass from another.
