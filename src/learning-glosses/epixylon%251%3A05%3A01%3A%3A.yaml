simpleMeaning: Living things that cling to wood lying under water in lakes, rivers, and other water places.
scope: Living things fixed to wood under water, not free-swimming life and not life on rock or mud; no
  other name is listed for this sense.
examples:
- The epixylon on the old log gave small fish a place to feed.
- Samples of epixylon showed how much life the sunk wood could hold.
