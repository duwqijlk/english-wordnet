simpleMeaning: Any of the curled, spongy hard parts inside the nose in people and other animals with a
  spine.
scope: This is one of the curled, spongy hard parts inside the nose, also called turbinate and turbinal;
  not the hard bone of the skull and not the soft flesh of the nose.
examples:
- The turbinate bone helps warm the air we breathe.
- A swollen turbinate bone can block the nose.
