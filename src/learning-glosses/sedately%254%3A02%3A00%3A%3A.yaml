simpleMeaning: in a calm, quiet and serious way, without hurry or strong feeling
scope: This describes doing something in a calm and serious way, not in a fast, loud or excited way.
examples:
- She walked sedately into the room and sat down.
- He spoke sedately, never raising his voice.
