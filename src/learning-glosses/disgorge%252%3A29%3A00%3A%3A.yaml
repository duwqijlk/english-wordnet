simpleMeaning: to throw up what is in your stomach through your mouth
scope: 'Also called sick, cat, cast, vomit, spew, puke, chuck, purge, retch, honk, barf, regurgitate,
  and upchuck: throwing up what is in your stomach, not taking food down when you eat.'
examples:
- The sick child disgorged his lunch onto the floor.
- After drinking the bad milk, she disgorged everything she had swallowed.
