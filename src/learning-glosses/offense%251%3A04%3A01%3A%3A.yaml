simpleMeaning: an act that goes against what people judge to be right
scope: This is a wrong act that breaks what people judge to be right, not a rude act that hurts feelings
  and not the feeling of anger itself.
examples:
- In that community, breaking the fast was seen as an offense against their beliefs.
- He knew that cheating his neighbours was an offense, even if no law was broken.
