simpleMeaning: How good someone or something is at doing work that helps others
scope: How good someone or something is at doing work that helps others; serviceability is another name
  for this sense, not how long a thing lasts, and not how well it is made.
examples:
- The serviceableness of the tool made it a favourite in the shop.
- She praised the serviceableness of the new kettle.
