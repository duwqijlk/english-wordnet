simpleMeaning: the level part of a stair or step that you put your foot on
scope: The level part of a stair or step that you put your foot on, not the grooved face of a tyre and
  not the act of walking.
examples:
- The tread of the top stair was worn smooth.
- He replaced a broken tread on the staircase.
