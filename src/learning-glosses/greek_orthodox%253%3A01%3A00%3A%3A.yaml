simpleMeaning: Said of things that belong to the Eastern group of Christians, or show what they are like.
scope: Also called Orthodox, Eastern Orthodox, and Russian Orthodox; this word marks things of the Eastern
  group of Christians, not things of the Roman Catholic group.
examples:
- The Greek Orthodox priest led the service.
- She wore a Greek Orthodox cross.
