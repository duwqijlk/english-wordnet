simpleMeaning: a group of mammals of the same kind that people keep and guide, such as cows or sheep
scope: A group of farm animals kept by people, not a group of wild animals living together and not a crowd
  of people.
examples:
- The farmer keeps a herd of cows in the field.
- The herd of sheep was led back to the farm at night.
