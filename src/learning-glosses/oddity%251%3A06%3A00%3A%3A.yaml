simpleMeaning: a strange thing that is not common and may be worth keeping
scope: 'Also called curiosity, rarity, curio, peculiarity and oddment: a strange thing that may be worth
  keeping, not a strange way of thinking or acting.'
examples:
- He kept the two-headed coin as an oddity in a small box.
- The shop sells oddities such as old keys and stones with faces.
