simpleMeaning: a flat part of a plant made of a number of small parts joined on one stem
scope: A flat part of a plant made of small parts joined on one stem; not a plain single leaf and not
  a stem on its own.
examples:
- The compound leaf of the ash tree has several small leaflets on one stalk.
- She drew a compound leaf with five small parts joined on a single stalk.
