simpleMeaning: With marks set in a grid of lines standing for points, number work is used to study shapes
  and lines.
scope: This is the part of maths that studies shapes and lines by means of number work, also called analytical
  geometry or coordinate geometry.
examples:
- Analytic geometry let her work out the area of the shape.
- He used analytic geometry to show the curve as marks in a grid.
