simpleMeaning: Hindu and Buddhist belief that after death a person is born again and again as a god, human,
  animal, hungry ghost, or one in Hell, by what the person did
scope: This is the Hindu and Buddhist belief that a person is born again after death, not a single life
  after death with no new birth.
examples:
- In her religion class, she learned that reincarnation can lead to birth as an animal.
- He believes reincarnation depends on how a person lived before.
