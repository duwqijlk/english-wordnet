simpleMeaning: A sickness of unknown cause that struck many soldiers who served in 1991, marked by tiredness,
  headache, dizziness, sickness, skin rashes, sore joints, and breathing troubles.
scope: A sickness that struck Gulf War veterans, also called Persian Gulf illness; not a single known
  disease.
examples:
- Many veterans live with Gulf War syndrome years after the war.
- Gulf War syndrome left him tired and aching for months.
