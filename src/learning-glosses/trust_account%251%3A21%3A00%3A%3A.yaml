simpleMeaning: Money put in a bank by a person who keeps charge of it while they live and names someone
  else to get what is left when they die.
scope: Also called savings account trust, savings bank trust, and trustee account; money in a bank run
  by its owner for another person, who gets what is left after the owner dies.
examples:
- She opened a trust account naming her daughter as beneficiary.
- The trust account passed to his son when he died.
