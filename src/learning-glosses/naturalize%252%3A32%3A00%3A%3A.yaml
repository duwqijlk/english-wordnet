simpleMeaning: To explain a thing by how it works in the living world.
scope: To explain a thing by how it works in the living world, not to make a thing seem more like a real
  living thing.
examples:
- The teacher naturalized the strange glow by showing it came from the marsh.
- She naturalized the old story, giving it a cause in the world around us.
