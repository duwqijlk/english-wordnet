simpleMeaning: A two-year Mediterranean herb with long-stemmed heads of purple ray flowers and milky sap
  and a long edible root, now growing wild throughout the United States.
scope: Also called oyster plant, salsify, and vegetable oyster; a two-year Mediterranean herb with purple
  ray flowers and a long edible root, while the common dandelion is a different weed with yellow flowers.
examples:
- Tragopogon porrifolius opens purple ray flowers on long stems.
- We dug the long edible root of Tragopogon porrifolius for supper.
