simpleMeaning: one of the two large blood vessels of the neck and head, coming from the main vessel that
  leaves the heart
scope: One of the two large blood vessels of the neck and head, also called the carotid artery, not a
  vein in the neck and not the main vessel from the heart itself.
examples:
- The arteria carotis carries blood up to the head.
- A block in the arteria carotis can cut off blood to the brain.
