simpleMeaning: the sharp side where two surfaces of an object meet.
scope: This is not the border of an area and not a slight advantage; it is the sharp line where two surfaces
  of an object meet.
examples:
- The knife has a sharp edge.
- He rounded the edges of the wooden box with sandpaper.
