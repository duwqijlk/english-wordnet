simpleMeaning: A member of the old American party in the United States, active before the American Civil
  War.
scope: A member of the old American party, not a supporter of the American Revolution and not a member
  of the old English party.
examples:
- He was a Whig, a member of the party.
- She joined the Whigs before the Civil War.
