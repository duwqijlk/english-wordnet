simpleMeaning: play that is shown again on television at once, most often sport, from a tape of what has
  just happened
scope: Play shown again on television at once, most often sport, from a tape; also called replay and instant
  replay, not a first showing and not a later repeat of a whole game.
examples:
- The action replay showed the goal from a second angle.
- We watched the action replay to see if the ball had crossed the line.
