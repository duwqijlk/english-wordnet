senseId: 'precondition%1:10:00::'
synsetId: 06768279-n
simpleMeaning: a thing that is taken as true, and that another thing depends on to be valid or to have
  an effect
scope: 'Also called condition, and also called stipulation: a thing taken as true that something else
  depends on, not a person''s health or state.'
examples:
- 'His whole argument rests on one precondition: that the old records are true and complete.'
- A key precondition of her claim is the belief that the two men met before the fire.
