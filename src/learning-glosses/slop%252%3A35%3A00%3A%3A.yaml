simpleMeaning: to make or let a liquid run or flow out of the thing that holds it
scope: 'Also called spill and splatter: to make or let a liquid run out of the thing that holds it, not
  weak watery food, not wet feed for pigs and not waste water.'
examples:
- Be careful not to slop the soup over the edge of the bowl.
- He slopped water all over the floor as he carried the bucket.
