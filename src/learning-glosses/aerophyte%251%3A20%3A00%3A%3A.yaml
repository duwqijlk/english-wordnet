simpleMeaning: A plant that takes water and food from the air and rain, often growing on another plant
  but not living off it.
scope: A plant that takes water and food from the air and rain, also called an air plant, an epiphyte,
  and an epiphytic plant; not a plant that lives off its host and not a plant rooted in the soil.
examples:
- The aerophyte clung to the tree branch, taking water from the rain.
- An aerophyte needs no soil to live.
