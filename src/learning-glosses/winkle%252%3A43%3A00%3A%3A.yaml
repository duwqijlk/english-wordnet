simpleMeaning: to give out light, or send light back, in a way that goes bright and less bright again
  and again
scope: 'Also called twinkle and scintillate: a light going bright and less bright again and again, not
  the small sea snail that people eat.'
examples:
- The stars winkled in the cold night sky.
- Lights winkled across the water from the boats.
