simpleMeaning: a hand whose fingers are bent firmly into the palm, as for hitting
scope: The closed hand itself, also called a clenched fist, not an open hand or the blow it can deliver.
examples:
- He slammed his fist on the table.
- She held the coin tight in her fist.
