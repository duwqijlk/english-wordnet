simpleMeaning: 'an operation on the heart: the chest is opened, the heart is stopped, and blood runs through
  a heart-lung machine while a valve or heart blood vessel is fixed'
scope: An operation in which the chest is opened and the heart is stopped, not surgery done through a
  small cut with the heart still beating.
examples:
- She needed open-heart surgery to fix a faulty valve.
- The baby recovered well after open-heart surgery.
