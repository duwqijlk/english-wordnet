simpleMeaning: A calming drug used to ease worry and to lower strain and short temper.
scope: A calming drug that eases worry; antianxiety drug, anxiolytic drug, minor tranquilizer, minor tranquilliser
  and minor tranquillizer are other names for it, and it is not a drug for pain and not a drug that puts
  a person to sleep.
examples:
- The doctor gave her an anxiolytic to calm her nerves.
- He takes an anxiolytic when his worry grows too strong.
