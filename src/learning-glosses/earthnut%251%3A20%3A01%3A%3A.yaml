simpleMeaning: a plant found in much of Europe with parts under the ground that can be eaten and taste
  like roasted chestnuts
scope: A plant with underground parts that can be eaten, not a fungus that grows under the ground and
  not the pod of the peanut plant.
examples:
- The earthnut grows in fields across Europe.
- They dug up the earthnut and roasted its tubers for supper.
