simpleMeaning: In Christian churches, a church worker with a rank just below a priest; this rank is one
  of the Holy Orders (the set of main church ranks)
scope: This is the church rank just below a priest in Christian churches. It is not the other sense of
  this word, a Protestant church member who is not a trained leader and who helps the minister.
examples:
- The deacon read from the Bible before the priest spoke.
- After his training, he became a deacon, the rank just below a priest.
