simpleMeaning: Hard, heavy red timber and a sticky gum come from this tree of warm lands.
scope: Also called balata, a balata tree, and a bully tree, this tree of warm lands gives a sticky gum
  and hard, heavy red timber, not the Australian trees of the same name.
examples:
- They cut the beefwood for its hard red timber.
- A beefwood grew in the warm lands and gave a sticky gum.
