simpleMeaning: A quick, uneven twitching of a muscle, with single muscle fibres moving on their own and
  not together.
scope: A quick, uneven twitching of a muscle, not the forming of tiny fibres.
examples:
- Fibrillation of the heart muscle can stop the heart from beating in a steady way.
- The doctor watched for fibrillation in the patient's arm.
