simpleMeaning: The thin skin covering the white part's front face and the clear front window's thin skin
scope: The thin skin covering the front of the white of the eye, also called bulbar conjunctiva and tunica
  conjunctiva bulbi, not the white of the eye itself and not the lid's inner skin.
examples:
- The conjunctival layer of bulb covers the white of the eye.
- Doctors check the conjunctival layer of bulb for redness.
