senseId: 'latin_square%1:14:00::'
synsetId: 08286427-n
simpleMeaning: A grid of n rows and columns with n different marks in its cells, set out so no mark turns
  up more than once in any row or column.
scope: A square grid whose defining rule is that each of its n different marks appears exactly once in
  every row and exactly once in every column.
examples:
- A Latin square of order four has four marks in each row.
- She filled in the Latin square so no mark repeated in a row.
