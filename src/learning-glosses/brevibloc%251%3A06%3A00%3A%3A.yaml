simpleMeaning: A drug given by drip that slows the heart for a short time, used chiefly for uneven heartbeats
scope: A short-acting heart drug given by drip; also called esmolol, not a long-lasting heart pill.
examples:
- The nurse gave Brevibloc by drip to steady his heartbeat.
- Brevibloc acts for only a short time.
