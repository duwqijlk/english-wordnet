simpleMeaning: the way a person is linked by birth to their parents, grandparents and the family members
  before them
scope: The family link to the people a person comes from, not the qualities a person gets from them, and
  not a slope or path going down.
examples:
- The book traces his descent from his great-grandfather.
- Their shared descent means they are part of the same family line.
