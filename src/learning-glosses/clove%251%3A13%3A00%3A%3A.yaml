simpleMeaning: A spice made from the dried, unopened flower buds of the tree that bears them, used whole
  or ground up
scope: A spice from dried flower buds; not the bud itself, not the tree, and not a piece of garlic, the
  other clove senses.
examples:
- She added a clove to the stew for flavour.
- Whole cloves give the cake a warm, sweet taste.
