simpleMeaning: Showing luxury and giving pleasure to the senses.
scope: Showing luxury that pleases the senses, also called luxurious, luxuriant, or voluptuous; not a
  person devoted to refined pleasures of the senses, especially good food and drink.
examples:
- The banquet was epicurean, rich food and fine wine at every turn.
- Life in the villa was epicurean, full of soft music and good food.
