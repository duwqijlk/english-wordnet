senseId: 'whistle%2:38:01::'
synsetId: 02097512-v
simpleMeaning: to make something move, go, or come quickly and easily, as if carried by a high sound in
  the air
scope: Something is made to move, go, or come in this quick, easy way, not a thing moving on its own with
  a sound and not a sign to call someone.
examples:
- His good mood whistled away all her worries.
- The kind words whistled away her fears in a moment.
