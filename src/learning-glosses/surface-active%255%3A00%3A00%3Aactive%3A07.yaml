simpleMeaning: able to make the pull at the top of a liquid weaker, used most of all in cleaning products
scope: This is about a thing that can weaken the pull at the top of a liquid, used most of all in cleaning
  products; not a thing that makes a liquid thicker and not a cleaner on its own.
examples:
- This surface-active liquid helps water spread over the dirty plate.
- The surface-active agent in the wash lets the water reach the dirt.
