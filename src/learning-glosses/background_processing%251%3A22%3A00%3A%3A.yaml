simpleMeaning: less important jobs a computer runs while more important jobs are not using it
scope: 'Also called backgrounding: less important jobs run when more important work is not using the computer,
  not the main work done while the computer is busy.'
examples:
- The computer does its background processing at night, when no important job is running.
- Background processing runs less important jobs only when more important work is not using the system.
