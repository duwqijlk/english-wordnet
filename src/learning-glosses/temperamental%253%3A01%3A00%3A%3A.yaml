simpleMeaning: about or caused by a person's own nature, the way they feel and act
scope: This is about a person's basic nature, not about having moods that change fast and hard.
examples:
- His temperamental need for quiet made him choose a house in the country.
- Her temperamental shyness came from her nature, not from fear of this group.
