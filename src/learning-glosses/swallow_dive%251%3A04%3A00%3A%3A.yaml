senseId: 'swallow_dive%1:04:00::'
synsetId: 00445475-n
simpleMeaning: a jump into water in which the person bends the back and holds the arms out wide before
  going in
scope: This is a jump into water with the back bent and arms held out wide, also called swan dive; not
  a jump done feet first and not a jump with the body held straight.
examples:
- She did a swallow dive from the high board.
- His swallow dive arched his back before he hit the water.
