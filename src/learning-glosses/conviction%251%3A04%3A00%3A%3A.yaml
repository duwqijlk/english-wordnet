simpleMeaning: In criminal law, a court's last decision that a person is guilty of a crime, and the punishment
  the court gives for it
scope: 'Also called sentence: this is a court''s decision that a person is guilty, together with its punishment,
  not a strong belief that something is true.'
examples:
- His conviction for stealing led to two years in prison.
- The conviction came after a long trial, and she was sent to prison.
