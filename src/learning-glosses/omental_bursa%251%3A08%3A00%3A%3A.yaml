simpleMeaning: A shut-off part of the belly space that lies behind the stomach.
scope: A shut-off part of the belly space that lies behind the stomach, also called bursa omentalis and
  lesser peritoneal cavity; not the main belly space and not a part in front of the stomach.
examples:
- The omental bursa lies behind the stomach.
- Fluid can gather in the omental bursa.
