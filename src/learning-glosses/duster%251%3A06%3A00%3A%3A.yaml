simpleMeaning: a loose coat or dress worn over clothes, hanging down to the ankles
scope: A loose coat or dress worn over clothes, hanging down to the ankles; smock is another name for
  this sense, not a windstorm that lifts dust and not a cloth used for cleaning.
examples:
- She wore a duster over her dress against the dust.
- His long duster reached down to his ankles.
