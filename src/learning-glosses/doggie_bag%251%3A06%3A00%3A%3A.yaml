simpleMeaning: a pack for food left over from a meal at a restaurant, said to be taken home for the pet,
  though no one really believes it
scope: A pack for food left over at a restaurant, also called a doggy bag, and not a pack for shopping
  or for carrying things in general.
examples:
- She asked for a doggie bag to take home the pasta she could not finish.
- He put the rest of his steak in a doggie bag for later.
