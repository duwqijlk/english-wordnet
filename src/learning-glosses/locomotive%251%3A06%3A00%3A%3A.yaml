simpleMeaning: a vehicle on wheels with its own engine, used to pull trains along railway tracks
scope: Also called engine, locomotive engine and railway locomotive; this is the vehicle that pulls a
  train, not the word for how a person or animal moves from place to place.
examples:
- The locomotive pulled ten carriages into the station.
- A heavy locomotive can draw a long train up the hill.
