senseId: 'homeostasis%1:26:00::'
synsetId: 14026652-n
simpleMeaning: In physiology, metabolic balance kept steady by several complex biological mechanisms working
  through the autonomic nervous system to counter changes that would disturb it.
scope: This is the process that holds an internal state steady, not the steady state itself and not the
  nervous system that carries out the adjustments. It is a physiology term.
examples:
- 'Sweating is part of homeostasis: it cools the body when it overheats.'
- The lecture explained how homeostasis keeps blood sugar within a narrow range.
