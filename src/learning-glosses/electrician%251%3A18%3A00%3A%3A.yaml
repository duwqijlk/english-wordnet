simpleMeaning: a person whose job is to put in or fix lines for power or for telephones
scope: This is a worker who puts in and fixes the lines themselves, not a person who makes the power and
  not a person who fixes machines that use power.
examples:
- The electrician put in new power lines for the house.
- We called an electrician to fix the broken telephone line.
