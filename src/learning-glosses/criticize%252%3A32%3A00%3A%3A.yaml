simpleMeaning: to say what is wrong with a thing, saying what you think is bad about it and naming its
  real or supposed faults
scope: Saying what is wrong with a thing and naming its faults, also called knock, not acting as a critic.
examples:
- The paper criticized the new movie.
- Don't criticize the food — it's free.
