simpleMeaning: In plants of the group called Asclepias, a crown sits on top of the male flower part
scope: The top of the male flower part, not the whole flower and not the female part that takes in pollen.
examples:
- The gynostegium of the milkweed flower holds the pollen in place.
- Bees must push past the gynostegium to reach the nectar.
