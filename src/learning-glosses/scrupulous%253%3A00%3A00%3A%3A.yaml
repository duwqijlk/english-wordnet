simpleMeaning: having strong feelings about what is right and wrong, coming from that sense of right and
  wrong, and acting in a fair, honest way
scope: This means acting in a right and honest way because of a strong sense of right and wrong, not just
  being very careful and exact in work.
examples:
- She was a scrupulous leader who would not take money that was not hers.
- His scrupulous choice came from his belief that lying was wrong.
