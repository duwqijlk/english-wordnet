simpleMeaning: the part of an animal's body that matches, in its place on the body, the chest of a person
scope: This is the chest-like part of an animal's body, not a woman's milk-making part, not the front
  of a person's chest, and not meat cut from a bird.
examples:
- The dog's breast was white while the rest of its coat was black.
- The horse had a broad breast and strong front legs.
