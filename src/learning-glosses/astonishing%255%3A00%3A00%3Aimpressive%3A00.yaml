simpleMeaning: so surprisingly impressive that it shocks a person and is too much for them
scope: 'Also called staggering: so surprisingly impressive that it shocks a person and is too much for
  them, not just good or great in a normal way.'
examples:
- The astonishing speed of the car left everyone silent.
- She got an astonishing amount of money for her old house.
