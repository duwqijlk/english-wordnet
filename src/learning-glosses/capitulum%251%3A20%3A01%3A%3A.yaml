simpleMeaning: a tight bunch of flowers or leaves packed close together on a plant
scope: 'Also called head: a tight bunch of flowers or leaves on a plant, not the grain head of a cereal
  plant and not the leafy top of a tree.'
examples:
- The capitulum of the cauliflower was white and firm.
- A head of lettuce is a capitulum of leaves packed tight.
