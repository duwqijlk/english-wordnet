simpleMeaning: In a figure, the act of putting right by clearing out unwanted staff, ways, or states.
scope: In a figure, the act of putting right by clearing out unwanted staff, ways, or states; not the
  act of cleaning the rooms and fittings of a house.
examples:
- Their housecleaning cleared the firm.
- The housecleaning was done at dawn.
