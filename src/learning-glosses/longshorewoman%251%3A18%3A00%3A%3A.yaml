simpleMeaning: A female worker at a port who puts goods on ships and takes goods off them
scope: A female worker at a port who puts goods on ships and takes goods off them, not a sailor and not
  a worker on land away from the port.
examples:
- The longshorewoman lifted the heavy crates onto the ship.
- As a longshorewoman, she worked at the docks all day.
