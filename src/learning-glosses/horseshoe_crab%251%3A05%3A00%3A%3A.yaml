simpleMeaning: These large sea animals live along North America's Atlantic coast, each with a domed horseshoe-shaped
  shell and a stiff, pointed tail. They are living fossils related to the wood louse.
scope: This is the horseshoe-shaped creature also called king crab here; not the edible king crab of northern
  seas.
examples:
- A horseshoe crab crawled slowly over the wet sand.
- Horseshoe crabs have changed very little since prehistoric times.
