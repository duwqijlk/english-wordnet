simpleMeaning: A short blood tube in the heart that takes in most of the heart's veins and empties into
  its right upper room.
scope: This is a short blood tube in the heart that takes in most of the heart's veins and empties into
  its right upper room, not a blood tube that feeds the heart and not a hollow in the nose.
examples:
- The coronary sinus carries blood into the right upper room of the heart.
- Most veins of the heart join the coronary sinus.
