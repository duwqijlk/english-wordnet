simpleMeaning: With no second slice of bread over it, this food is one slice of bread with food on top
scope: One slice of bread with food on top and no second slice over it, also called open-face sandwich;
  not a sandwich with two slices of bread and not a slice of bread on its own.
examples:
- He ate an open sandwich with egg on top.
- For lunch she had an open sandwich with cheese on top.
