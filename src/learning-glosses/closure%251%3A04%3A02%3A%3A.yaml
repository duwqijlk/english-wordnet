senseId: 'closure%1:04:02::'
synsetId: 00282306-n
simpleMeaning: the act of getting nearer to a place you are going to, so the space between you and it
  gets smaller
scope: The act of getting nearer to a place; closing is another name for this sense, not a block in a
  pipe, not a settled matter, and not a rule that ends debate.
examples:
- The closure of the two ships was fast, and they nearly hit each other.
- We watched the closure of the plane as it came down to land.
