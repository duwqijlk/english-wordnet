simpleMeaning: Any of several things found in the body before birth that the body's defences react to,
  and that sometimes show up in grown people with cancer.
scope: Any of several things found in the body before birth that the body's defences react to, and that
  sometimes show up in grown people with cancer, also called a fetoprotein; not a thing found only in
  grown people and not a thing the body's defences ignore.
examples:
- Foetoprotein is found in the fetus and sometimes in adults with cancer.
- Doctors test for foetoprotein when they look for signs of cancer.
