simpleMeaning: A bruising illness linked to a fall in the number of small blood cells that help blood
  clot, which can come from many causes.
scope: This is bruising from a low count of the small blood cells that help blood clot, also called idiopathic
  thrombocytopenic purpura, purpura hemorrhagica and thrombocytopenic purpura, and it can come from many
  causes rather than one cause alone.
examples:
- Werlhof's disease left purple marks on her arms.
- The doctor said Werlhof's disease had cut the number of his blood platelets.
