simpleMeaning: a fault from birth in which the cells of the body have one or more extra tiny threads that
  carry the plan for life
scope: A fault from birth in which the cells of the body carry one or more extra tiny threads, not a fault
  with too few and not a fault that comes later in life.
examples:
- Polysomy was found when the baby's cells were tested.
- The test showed polysomy, with an extra chromosome in the body's cells.
