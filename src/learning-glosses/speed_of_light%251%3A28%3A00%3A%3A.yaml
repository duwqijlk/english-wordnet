simpleMeaning: Rays move through empty space at a rate that never changes and holds everywhere, set at
  exactly 299,792,458 meters per second.
scope: It is also called light speed, the rate at which rays move through empty space, set at exactly
  299,792,458 meters per second, the same at all times and in all places.
examples:
- Nothing can travel faster than the speed of light.
- They measured the speed of light in empty space.
