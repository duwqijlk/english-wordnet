simpleMeaning: Seen as the safest paper people buy to put money in, this is a written promise from the
  United States Treasury to pay back money it has borrowed.
scope: This is a promise to pay back money put out by the United States Treasury, not a promise from a
  company or a bank, and not a loan from a bank.
examples:
- She put her savings in a government bond.
- The government bond will pay him back in ten years.
