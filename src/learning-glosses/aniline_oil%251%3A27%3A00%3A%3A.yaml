simpleMeaning: dyes, plastics, and medicines are made from this poisonous oily liquid, one of the amines,
  chemicals built round nitrogen, got from nitrobenzene
scope: 'Also called aminobenzine, aniline, and phenylamine: a poisonous oily liquid used to make dyes,
  not a dye itself and not a medicine.'
examples:
- Aniline oil is used to make plastics and medicines.
- The aniline oil spilled from the bottle is poisonous, so keep it away from children.
