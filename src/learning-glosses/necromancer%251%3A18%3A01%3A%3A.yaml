simpleMeaning: a person who tries to learn hidden things by calling up people who are dead and speaking
  to them
scope: This is a person who calls up the dead to learn hidden things, not just any person who uses magic
  and not a person who tells the future in other ways.
examples:
- In the story, a necromancer called up the dead king to ask him a question.
- People feared the necromancer who spoke with the dead at night.
