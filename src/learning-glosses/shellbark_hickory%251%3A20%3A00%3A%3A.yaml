simpleMeaning: Its nuts can be eaten, and loose grey peel hangs in strips from this North American nut
  tree.
scope: Also called shagbark, shagbark hickory and shellbark, it is the same nut tree, with loose grey
  bark in strips, not a smooth-barked kind.
examples:
- They ate the nuts of the shellbark hickory.
- Strips of loose grey bark hung from the shellbark hickory.
