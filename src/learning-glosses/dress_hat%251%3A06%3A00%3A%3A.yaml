simpleMeaning: Most times covered with silk or with beaver fur, this tall-topped headwear is worn by men.
scope: A tall-topped piece of headwear for men, usually covered with silk or beaver fur, is also called
  a beaver, a stovepipe, a topper, a high hat, an opera hat, a silk hat, and a top hat.
examples:
- He wore a dress hat to the wedding.
- The dress hat sat high on his head, covered in silk.
