simpleMeaning: the act of saying numbers in order, one after another, to find how many things there are
scope: 'Also called count, counting, and tally: saying numbers in order to find how many there are, not
  working out a problem with numbers.'
examples:
- The reckoning of the votes took all night.
- The reckoning continued for several hours.
