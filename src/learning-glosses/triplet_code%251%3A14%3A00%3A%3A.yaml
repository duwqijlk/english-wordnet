simpleMeaning: Three small bits at a time tell a cell which building block of a protein to make, and that
  is the usual way living things spell out their building blocks.
scope: It is the usual way living things spell out their building blocks, three small bits at a time.
examples:
- In the triplet code, each group of three nucleotides stands for one amino acid.
- The triplet code lets a cell read a gene three bits at a time.
