simpleMeaning: a thing that happens when mixed bits are put together into a ball-like lump
scope: This is a mixed set of bits joined into a ball-like lump; conglomeration is another name for this
  sense, not a single thing on its own and not a flat pile.
examples:
- The conglobation of old papers formed a lump on the desk.
- A conglobation of snow and ice rolled down the hill.
