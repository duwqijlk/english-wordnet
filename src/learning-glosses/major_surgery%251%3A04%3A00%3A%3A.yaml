simpleMeaning: Any operation that needs drugs to put the patient to sleep or a machine to help them breathe.
scope: Any operation that needs sleep drugs or help with breathing; not a small cut stitched up while
  the patient stays awake.
examples:
- Major surgery was planned for the morning.
- Her major surgery needed a night in the hospital.
