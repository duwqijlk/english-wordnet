simpleMeaning: A burdock with heart-shaped leaves that grows in open woodland, hedgerows and rough grassland
  across most of Europe and Asia Minor. It is sometimes grown for medicine and cooking.
scope: The burdock with heart-shaped leaves, not the coarse weed whose spiny burs cling to clothing.
examples:
- The cocklebur's heart-shaped leaves grew thickly along the hedgerow.
- Herbalists once gathered cocklebur for use in medicines.
