simpleMeaning: An artist of that school, who turned against the older way of painting.
scope: Also called Postimpressionist; an artist of that school who turned against the older way of painting,
  not an artist of the older school and not a painter of everyday scenes.
examples:
- The Post-impressionist showed his work beside the older painters.
- She became a Post-impressionist after turning against the older way of painting.
