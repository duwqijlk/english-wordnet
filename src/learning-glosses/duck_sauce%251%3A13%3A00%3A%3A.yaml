simpleMeaning: a thick, sweet, sharp-tasting food from China, put on other food to add taste
scope: 'Also called hoisin sauce: a thick, sweet, sharp-tasting food from China, put on other food to
  add taste, not a thin dipping sauce and not a hot chilli sauce.'
examples:
- She spooned duck sauce onto her spring rolls.
- The duck sauce on the table was sweet with a sharp bite.
