simpleMeaning: having one or more hard, curved, pointed nails on the feet, or looking like that; often
  used as part of a joined word
scope: This sense covers any animal or thing that has hard pointed nails on its feet, or looks like it
  does; it is not limited to hunting animals that are armed with them for attack.
examples:
- The bird's clawed feet held fast to the branch.
- She drew a strange animal with three clawed toes on each foot.
