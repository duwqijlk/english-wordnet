simpleMeaning: Leaves like feathers crown this palm of warm parts of America, with a thick trunk full
  of sharp points and nuts people can eat.
scope: Also called grugru, grugru palm, and macamba, this is a palm of warm America with a spiny trunk
  and nuts people eat, not a coconut palm.
examples:
- The gri-gri palm in the garden had nuts we could crack and eat.
- A gri-gri grows tall with a trunk covered in sharp points.
