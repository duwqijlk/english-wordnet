simpleMeaning: a person who bets money and throws dice in a game of dice
scope: A gambler who throws dice, also called a shooter; not a person who bets on cards and not a person
  who throws dice for fun without a bet.
examples:
- The crap-shooter threw the dice and waited for the result.
- A lucky crap-shooter won three throws in a row.
