simpleMeaning: Grass used to cover pasture and lawns, above all the greens where bowling and putting are
  played.
scope: The grass used for pasture and playing greens, also called bent grass, not a lasting tendency of
  mind or an open stretch of unfenced grassland.
examples:
- Bent is sown on golf greens because it tolerates close mowing.
- The farmer sowed bent across the pasture to thicken the turf.
