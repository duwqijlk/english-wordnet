simpleMeaning: 'A tall, coarse plant or shrub from Mexico to Panama, with big sunflower-like heads: golden
  to orange-red outer petals around a yellow center.'
scope: This is the tall Mexican sunflower relative with large orange-red blooms, not a true sunflower
  or an ordinary garden daisy.
examples:
- Tithonia has spread across the back of the garden, its orange blooms towering over the fence.
- Butterflies gather on the tithonia along the path from July onward.
