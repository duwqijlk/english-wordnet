simpleMeaning: To do with liquids or gases in motion, or the forces that start or change such motion.
scope: To do with liquids or gases in motion, or the forces that start or change such motion, not hydrostatic
  and not aerodynamic.
examples:
- Hydrokinetic power comes from moving water.
- The hydrokinetic study looked at waves hitting the shore.
