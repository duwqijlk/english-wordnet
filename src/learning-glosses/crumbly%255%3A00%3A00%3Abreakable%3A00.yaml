simpleMeaning: easy to break into small pieces or into powder
scope: About food or material that breaks into small pieces or powder; not hard and staying in one piece,
  and not just soft.
examples:
- The crumbly cake fell into small pieces when I cut it.
- The dry soil was crumbly and turned to powder in my hands.
