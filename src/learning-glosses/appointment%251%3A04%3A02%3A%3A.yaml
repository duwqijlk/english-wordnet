simpleMeaning: In law, when a person uses a right to choose who shall have their things, and so passes
  them on to that person
scope: In law, passing on a person's things by a right to do so, not the job you are given and not the
  person who is given a job.
examples:
- She allocated part of the trust to her church by appointment.
- The appointment let him pass the house to his son.
