simpleMeaning: Its young live in great numbers in roots and stems, and this bright-coloured bug eats the
  green blades of plants.
scope: Also called a chrysomelid, this bright-coloured bug eats green blades, and its young live in great
  numbers in roots and stems.
examples:
- A leaf beetle ate the leaves of the plant.
- The young of the leaf beetle lived in the roots and stems of the plant.
