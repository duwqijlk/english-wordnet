simpleMeaning: In old Greek and Roman stories, a snake, lizard, or dragon that can kill with its breath
  or its look
scope: A made-up killing animal from old stories; not the real small lizard of warm America that can run
  on its back legs.
examples:
- In the old story, the basilisk killed a man with one look.
- No one dared to face the basilisk and its deadly breath.
