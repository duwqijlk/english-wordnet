simpleMeaning: no matter what happens, and with no thought for the bad points that come with it
scope: Going on in spite of all problems and bad sides; not just not caring about people or being careless.
examples:
- He carried on regardless, even though the road was blocked.
- She bought the house regardless of the cost.
