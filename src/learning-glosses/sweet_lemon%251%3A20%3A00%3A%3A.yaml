simpleMeaning: A fruit tree whose fruit has a somewhat flat pulp with only a mild sugary taste.
scope: This is a fruit tree with a flat, mildly sugary pulp, also called sweet lime, and not a sour lemon
  or an orange.
examples:
- The sweet lemon grew beside the house.
- We cut open a sweet lemon to taste its mild pulp.
