simpleMeaning: A string pulled through small holes or around hooks to pull two edges together, as on a
  shoe or a piece of clothing
scope: A cord for pulling two edges together on a shoe or garment, also called lace, not the act of hitting
  someone again and again as a punishment.
examples:
- She pulled the lacing tight on her boot.
- The lacing on his shoe came undone during the walk.
