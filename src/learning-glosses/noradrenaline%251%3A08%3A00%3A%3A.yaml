simpleMeaning: The body makes a second chemical from this one, which the small gland above the kidney
  sends out and nerve ends let go where they meet.
scope: Also called norepinephrine, this body chemical comes first in the body and is sent out from the
  gland above the kidney and from nerve ends.
examples:
- The small gland above the kidney sends out noradrenaline.
- Where nerve ends meet, noradrenaline is let go.
