simpleMeaning: the last small blood tube that branches off the main blood tube of the face
scope: 'Another name for arteria angularis: the last small blood tube that branches off the main blood
  tube of the face, not the main blood tube itself and not a vein.'
examples:
- The angular artery runs up the side of the nose.
- A cut near the nose can nick the angular artery.
