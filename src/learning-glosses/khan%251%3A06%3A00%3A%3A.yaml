simpleMeaning: a place to stay in some countries in the east, with a big open yard, made for groups of
  people traveling together
scope: 'Also called caravansary: this is a building where groups of people traveling together can stay,
  not a single tent or a private home.'
examples:
- The travelers rested for the night at a khan by the road.
- The khan had a large open yard where the horses could drink.
