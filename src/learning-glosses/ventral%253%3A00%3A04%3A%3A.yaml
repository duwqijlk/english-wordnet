simpleMeaning: nearest to or turned toward the middle line of a body part or a living thing
scope: 'Also called adaxial: the side nearest the middle line of a body part or living thing, not the
  side farthest from it and not the front of the body.'
examples:
- The ventral surface of the leaf is the side nearest its middle line.
- On the ventral side of the fish, the fins sit close to the middle line of the body.
