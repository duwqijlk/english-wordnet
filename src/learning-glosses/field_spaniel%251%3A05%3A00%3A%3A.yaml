simpleMeaning: A cross of cocker and Sussex spaniel, this big dog, usually black, has a thick flat or
  slightly wavy coat and is used for hunting and bringing back game.
scope: A large black hunting spaniel with a thick coat, a cross of cocker and Sussex spaniel, not a cocker
  spaniel and not a Sussex spaniel.
examples:
- The field spaniel flushed a pheasant from the reeds.
- Our field spaniel loves to swim after ducks.
