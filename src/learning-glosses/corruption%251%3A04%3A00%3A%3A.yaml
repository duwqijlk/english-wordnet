simpleMeaning: the act of making a person or a group lose their honesty or loyalty, so their sense of
  right and wrong is worn away
scope: Making a person or a group lose their honesty or loyalty, not the bribing of an official and not
  the rotting of dead matter.
examples:
- The corruption of a minor is a serious crime.
- The film showed the big city's corruption of rural innocence.
