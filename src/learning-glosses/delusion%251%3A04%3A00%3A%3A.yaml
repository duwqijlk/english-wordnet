simpleMeaning: the act of tricking someone by putting false ideas into their head
scope: Also called illusion, it is the act of tricking someone with false ideas, not a fixed false belief
  held in the face of facts.
examples:
- The con man's delusion of the old couple cost them their savings.
- Through delusion, the magician made the crowd believe the coin had vanished.
