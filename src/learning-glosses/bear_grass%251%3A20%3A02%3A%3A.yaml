simpleMeaning: a yucca of the west central United States, with a clump of thin blade-like leaves at its
  base and a middle stalk ending in small whitish flowers
scope: The yucca of the west central United States with a clump of blade-like leaves at its base and a
  middle stalk of small whitish flowers, not the stemless kind of the south-west United States and Mexico
  and not the yucca of the southern United States.
examples:
- Bear grass grows in clumps across the west central plains.
- The bear grass in the field had a tall middle stalk of small white flowers.
