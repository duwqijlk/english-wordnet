simpleMeaning: a knife from Malaya with a blade that has a wave shape
scope: This is a knife with a wavy blade, also a weapon; it is not a fold or line in cloth or paper, and
  not a shape made by folding.
examples:
- He kept an old crease in a wooden box, and its wavy blade was still sharp.
- The crease on the wall had a short handle and a blade with a wave shape.
