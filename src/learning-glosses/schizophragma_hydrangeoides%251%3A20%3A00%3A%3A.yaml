simpleMeaning: A climbing shrub with sticky aerial roots, bearing paired leaves and small white flowers
  in clusters at the branch tips; found from the Himalayas to Taiwan and Japan.
scope: Also called climbing hydrangea; not a tree and not a shrub with coloured flowers.
examples:
- The Schizophragma hydrangeoides climbed the wall with sticky roots.
- We saw Schizophragma hydrangeoides flowering white in Japan.
