simpleMeaning: A way of counting where what a mark means depends on its place, using eight marks and eight
  as its base.
scope: A way of counting with eight marks and eight as its base, also called octal number system; not
  the ten-mark way of counting and not a way of counting with two marks.
examples:
- The octal numeration system uses eight as its base.
- In the octal numeration system, the marks run from zero to seven.
