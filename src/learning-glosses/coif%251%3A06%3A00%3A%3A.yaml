simpleMeaning: a small close cap worn by nuns under a veil, by soldiers under a hood of mail, or in the
  past by British sergeants-at-law
scope: This is the small cap itself, not the veil or the hood of mail worn over it.
examples:
- The nun wore a white coif under her veil.
- The soldier put on a coif before his hood of mail.
