simpleMeaning: playing or singing while other instruments or voices also play or sing at the same time
scope: 'Also called accompanied: playing or singing with other music or voices at the same time; not being
  present at a meeting, and not being cared for by someone.'
examples:
- The choir gave an attended performance, with violins playing along.
- His attended singing sounded rich, with a guitar joining every line.
