simpleMeaning: Illness from little niacin or tryptophan, or trouble making niacin; gut trouble, red skin,
  nerve or mind troubles; may come from poor food, heavy drinking, or other poor nutrition.
scope: Not true scurvy, nor other illnesses from poor food; also called pellagra, maidism, mal de la rosa,
  mal rosso, mayidism, and Alpine scurvy.
examples:
- Saint Ignatius' itch comes from poor food.
- Saint Ignatius' itch brought red skin and gut trouble.
