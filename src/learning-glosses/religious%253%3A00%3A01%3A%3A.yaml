simpleMeaning: Connected with priests or other church leaders who have taken vows and live under monastery
  rules.
scope: This sense is not about a person's belief in a god or about holy things in general, but about church
  leaders who live under monastery vows.
examples:
- He took religious vows before entering the monastery.
- The community follows a religious rule that dates back centuries.
