simpleMeaning: How much can be worked on or moved at once, in one go.
scope: How much can be worked on or moved at once, also called load, not the work of putting goods on
  a truck, and not the ratio of a plane's weight to its lift.
examples:
- The loading was too much for the old lift.
- One loading filled the whole van.
