simpleMeaning: Between two heats, a female mammal other than a person has a quiet time when she is not
  ready to mate.
scope: Also called anestrum, anestrus, and anoestrus, this is a quiet time for mammals other than people,
  not the time when a female is ready to mate.
examples:
- The anoestrum came between two heats, and the doe showed no wish to mate.
- During anoestrum the female rests and does not seek a mate.
