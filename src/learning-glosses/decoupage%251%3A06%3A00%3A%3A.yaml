simpleMeaning: Art made by decking a face with cutouts, then coating it with various layers of varnish
  or lacquer.
scope: Art made by decking a face with cutouts, then coating it with various layers of varnish or lacquer;
  not the art of decking a face with shapes or pictures, then coating it with varnish or lacquer.
examples:
- Their decoupage decked the box.
- The decoupage was shown at dawn.
