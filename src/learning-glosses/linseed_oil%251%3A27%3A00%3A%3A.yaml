simpleMeaning: A liquid that dries hard, got from flax seed and used in making things such as paints
scope: Flaxseed oil is another name for this liquid that dries hard, got from flax seed; it is not an
  oil for cooking and not a paint itself.
examples:
- Linseed oil is used to thin the paint.
- He rubbed linseed oil into the wooden table.
