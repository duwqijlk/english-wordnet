simpleMeaning: A snail with a short shell that is smooth or has spiral ridges, a thick outer lip that
  usually bears teeth, and a toothed plate closing the opening.
scope: A short-shelled snail with a thick, usually toothed lip and a toothed plate over the opening; not
  a periwinkle or a whelk.
examples:
- A nerita has a short shell with a thick, usually toothed outer lip.
- The shell opening of a nerita is closed by a toothed plate.
