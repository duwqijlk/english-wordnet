simpleMeaning: a deep, loud sound that goes on for some time
scope: A deep loud sound that goes on for some time, also called a roar, and thunder is another name for
  this sense; not a pole and not a sudden stroke of luck.
examples:
- We heard the boom of distant guns across the valley.
- The boom of the drum filled the whole hall.
