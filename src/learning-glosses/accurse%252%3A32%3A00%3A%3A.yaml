simpleMeaning: to ask for evil to come to someone, or say they are evil and shut out by God, and that
  God will punish them
scope: To call down evil on someone or declare them shut out by God; not a mild scolding and not a legal
  sentence.
examples:
- In the old tale, the witch would accurse anyone who stole from her garden.
- The villagers feared the holy man might accurse them for their sins.
