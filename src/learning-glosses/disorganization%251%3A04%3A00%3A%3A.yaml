simpleMeaning: The upset of a neat, set order, which leaves a mess and confusion
scope: The upset of a neat order into mess and confusion, not a tidy change and not a simple mistake;
  disorganisation is another name for this sense.
examples:
- The disorganization of the troops followed the flank attack.
- Disorganization spread through the office after the move.
