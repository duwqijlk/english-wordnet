simpleMeaning: Usually a sign of a bad infection of the air tubes or lungs, when a person brings up blood
  from the airways by coughing.
scope: Also called hemoptysis, it is blood brought up from the airways by coughing when the air tubes
  or lungs are badly infected.
examples:
- After the long coughing fit, haemoptysis left blood on his handkerchief.
- The doctor asked about haemoptysis when the patient coughed up blood.
