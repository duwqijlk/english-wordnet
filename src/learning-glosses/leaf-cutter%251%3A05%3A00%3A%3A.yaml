simpleMeaning: A bee that cuts round bits from the green parts of plants and from flowers to line its
  nest
scope: A bee that cuts pieces from plants to line its nest; leaf-cutter bee and leaf-cutting bee are other
  names for this sense, not a honeybee that gathers nectar.
examples:
- The leaf-cutter carried a round piece of petal back to its nest.
- A leaf-cutter had lined its nest with neat round pieces of leaf.
