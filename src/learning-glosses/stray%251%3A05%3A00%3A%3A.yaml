simpleMeaning: an animal that is lost or has run away from home, especially an animal kept by people
scope: A lost animal, especially one kept by people. It is not the verb sense about moving around with
  no clear aim, and not the verb sense about turning away from the main subject.
examples:
- The stray was hungry, so we gave the dog some food.
- They took the stray to a home for lost animals.
