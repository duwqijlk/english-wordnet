simpleMeaning: the rider stays clear of the water and mud a wheel throws up, because a bent shield sits
  above the wheel
scope: Also called a mudguard and a splash-guard, it shields the rider of a bike or motorbike from what
  the wheels throw up.
examples:
- The splash guard kept the mud off the rider.
- Water thrown up by the wheel hit the splash guard, not the rider.
