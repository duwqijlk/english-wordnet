simpleMeaning: Shares in a company with a set worth left unnamed in the company rules or on the share
  paper.
scope: Shares in a company with a set worth left unnamed in the company rules or on the share paper, with
  no-par stock as another name for this sense, not shares with a set worth and not a bond.
examples:
- The firm sold no-par-value stock with no set worth on the paper.
- Holders of no-par-value stock own shares with no set worth.
