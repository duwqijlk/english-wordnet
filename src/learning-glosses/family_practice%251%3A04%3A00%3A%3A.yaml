simpleMeaning: Doctors looking after whole households together, and giving health care to people of any
  age or either sex
scope: 'Also called family medicine: health care for people of any age or either sex with a focus on the
  whole household, not care for one part of the body and not a hospital ward.'
examples:
- Our family practice looks after my grandmother, my parents, and me.
- She joined a family practice that treats babies, teenagers, and older people.
