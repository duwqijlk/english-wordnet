simpleMeaning: a hard rock made from ash from a volcano that has been pressed tight together
scope: A hard rock made from ash from a volcano that has been pressed tight together; tufa is another
  name for this sense. Not soft ash and not lava that has cooled.
examples:
- The wall was built from tuff cut from the hillside.
- Tuff forms when ash from a volcano is pressed tight together.
