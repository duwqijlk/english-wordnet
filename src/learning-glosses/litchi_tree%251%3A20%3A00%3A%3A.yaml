simpleMeaning: At times put in the group Nephelium, this woody plant of China is grown above all in the
  Philippines and India for its fruit that can be eaten.
scope: Also called lichee and litchi, it is the tree that bears the fruit, not the fruit itself.
examples:
- The litchi tree is grown in India for its fruit.
- Litchi trees bear fruit that can be eaten.
