simpleMeaning: The office in the State Department that keeps diplomats and embassies overseas safe.
scope: Also called DS; the State Department office that guards diplomats and embassies overseas, not the
  office that guards the president and not the office that watches foreign spies.
examples:
- The Bureau of Diplomatic Security guards the embassy in the capital.
- He joined the Bureau of Diplomatic Security after ten years in the army.
