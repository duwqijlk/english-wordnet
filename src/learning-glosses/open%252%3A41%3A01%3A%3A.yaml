simpleMeaning: to start an event such as a meeting, speech, or musical performance, or to set it going.
scope: This is not about a door, box, or lid becoming unclosed; it is about starting a planned event.
examples:
- The chair opened the meeting with a short welcome.
- She opened the concert with a piece by Bach.
