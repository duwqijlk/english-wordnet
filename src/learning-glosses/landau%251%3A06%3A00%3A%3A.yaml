simpleMeaning: A four-wheeled covered carriage whose roof is in two parts, front and back, that can each
  be lowered on their own.
scope: A four-wheeled covered carriage whose roof is in two parts that can each be lowered on their own;
  not a carriage with a fixed roof, and not a small open cart.
examples:
- The landau carried the couple through the town.
- They hired a landau for the wedding procession.
