simpleMeaning: acting as if you stand above other people and looking down on those you think are not good
  enough
scope: To think yourself above others and scorn them, not merely to feel pleased with what you have done.
examples:
- The haughty aristocrats barely looked at their guests.
- She gave a haughty nod and walked past without a word.
