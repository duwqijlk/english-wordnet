simpleMeaning: A night streak of light in the sky, made when a space rock strikes the air round the earth
  and rubs so hard it melts, turns to gas, or bursts.
scope: This sense is also called meteor.
examples:
- A shooting star crossed the night sky.
- Shooting stars streak the sky.
