simpleMeaning: describing a flower that has, as a rule, just one ring of petals
scope: A flower with one ring of petals, not a person who is unmarried, a thing that is only one in number,
  or something meant for one person.
examples:
- Single daffodils have one ring of petals, while double ones have many.
- The garden has both single and double peonies.
