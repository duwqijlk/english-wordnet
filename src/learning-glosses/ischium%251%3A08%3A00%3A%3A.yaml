simpleMeaning: Below the big upper part of the hip sits one of its three parts
scope: One of the three parts of the hip, below the big upper part, also called ischial bone or os ischii;
  not the part above it and not the part in front of it.
examples:
- The doctor pointed to the ischium on the X-ray of the hip.
- The ischium joins with the other two parts to form the hip bone.
