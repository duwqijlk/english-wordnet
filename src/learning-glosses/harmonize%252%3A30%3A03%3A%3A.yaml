simpleMeaning: to make several things work well together, or to link them in a way that works well
scope: Also called harmonise, this is making different things fit and work well together, not singing
  or playing music with others and not writing parts for music.
examples:
- The two teams worked to harmonize their plans before the meeting.
- We need to harmonize the new rules with the old ones.
