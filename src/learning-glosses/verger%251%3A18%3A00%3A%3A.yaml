simpleMeaning: A church worker who looks after the inside of the church and attends ceremonies, carrying
  the rod of office.
scope: A church worker who looks after the building and attends ceremonies; not the priest and not a choir
  member.
examples:
- The verger unlocked the church and set out the candles.
- As verger, she looked after the church during the ceremony.
