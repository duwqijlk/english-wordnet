simpleMeaning: A green plant that grows in the north of America and in Europe and Asia
scope: A green plant of the north of America and of Europe and Asia, also called a long beech fern and
  a narrow beech fern; not a tree and not a plant of warm lands.
examples:
- Northern beech fern grows in the damp woods of the north.
- We found northern beech fern along the trail in Canada.
