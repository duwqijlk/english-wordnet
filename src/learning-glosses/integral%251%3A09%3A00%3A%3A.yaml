simpleMeaning: In maths, the result of adding up a changing value; F(x) is it for f(x) if F changes at
  the rate f(x) gives
scope: This maths noun is a worked-out result, not the word for whole and complete, not built-in and basic,
  and not to do with whole numbers.
examples:
- The integral of 2x is x squared plus a constant.
- She worked out the integral to find the area under the curve.
