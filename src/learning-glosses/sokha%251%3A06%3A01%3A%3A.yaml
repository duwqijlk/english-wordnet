simpleMeaning: 'A light wooden plough for tillage, drawn by one horse: two plough bodies whose parallel
  beams form the shafts, with two blades set in sockets.'
scope: A light wooden plough pulled by one horse for turning soil, not a heavy modern plough.
examples:
- The farmer harnessed one horse to the sokha.
- A sokha breaks the soil with two blades set in sockets.
