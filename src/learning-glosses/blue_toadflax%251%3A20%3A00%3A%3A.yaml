simpleMeaning: a plant from North America with bunches of small flowers on one stem, of a colour between
  sky colour and violet
scope: 'Also called old-field toadflax: a North American plant with bunches of blue-violet flowers on
  one stem, not a garden snapdragon and not a common toadflax with yellow flowers.'
examples:
- Blue toadflax covered the old field with its violet flowers.
- We found blue toadflax growing beside the path, its flower bunches a soft blue-violet.
