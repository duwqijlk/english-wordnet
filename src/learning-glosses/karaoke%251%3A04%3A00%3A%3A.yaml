simpleMeaning: singing popular songs with a recording of an orchestra (a large group of people playing
  music together), usually in bars or nightclubs
scope: Singing popular songs to music from a recording, usually in a bar or nightclub. It is not singing
  with a live group of players, and not just listening to songs.
examples:
- They sang karaoke at the bar on Friday night.
- She picked a popular song for karaoke and sang it with the recording.
