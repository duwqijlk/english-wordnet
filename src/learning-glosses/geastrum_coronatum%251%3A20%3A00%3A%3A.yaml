simpleMeaning: A star-shaped fungus with a bluish spore sac holding a purple-brown spore mass, the gleba;
  when ripe, its outer skin splits into rays that curl back and lift the sac.
scope: A star-shaped fungus with a spore sac, not a puffball and not a mushroom with gills.
examples:
- Geastrum coronatum opened its rays after the rain.
- We found Geastrum coronatum on the forest floor.
