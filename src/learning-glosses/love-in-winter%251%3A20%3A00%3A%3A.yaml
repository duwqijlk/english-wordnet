simpleMeaning: A plant of Europe and Asia with white or pale rose flowers grouped as a flat bunch at the
  top of the stem.
scope: This is a plant of Europe and Asia with white or pale rose flowers in a flat bunch, not a plant
  with red flowers and not a shrub; western prince's pine is another name for this sense.
examples:
- Love-in-winter bloomed white along the wood edge.
- We found love-in-winter with pale rose flowers in the hills.
