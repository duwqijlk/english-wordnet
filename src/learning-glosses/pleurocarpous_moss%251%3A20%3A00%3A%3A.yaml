scope: A small green plant that carries the parts for making new plants on a short side shoot, not on
  the main stem; also called pleurocarp; not a plant that bears them on the main stem.
examples:
- The pleurocarpous moss grew low on the damp log.
- The pleurocarpous moss was easy to spot by its short side shoots.
