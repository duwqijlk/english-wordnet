simpleMeaning: of cloth, having a soft raised surface made by brushing the cloth
scope: 'Also called brushed, and another name for this sense is napped: this is cloth with a soft raised
  surface, not hair or wool that is soft and thick.'
examples:
- She wore a coat with a warm, fleecy lining.
- This fleecy cloth feels soft against the skin.
