simpleMeaning: It is the use of chemical tests to work out how old rocks or other geological samples are.
scope: This is about finding the age of rocks and similar samples, not about romantic meetings.
examples:
- Scientists used dating to establish when the rock formed.
- The fossil's age was found by dating the surrounding rock.
