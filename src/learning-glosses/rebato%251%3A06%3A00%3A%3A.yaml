simpleMeaning: Fine patterned lace, held stiff with wire or starch, worn as a collar in the 1600s.
scope: Also called a rabato, it is a lace collar of the 1600s, stiff with wire or starch, and not one
  worn today.
examples:
- The rebato in the portrait was made of fine lace.
- People in the 1600s wore a rebato with their best clothes.
