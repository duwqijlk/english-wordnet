simpleMeaning: The picture on this paper for walls is made to order or picked from a set list, and it
  most often covers only one wall.
scope: This paper for walls has a picture printed on it, most often covers only one wall, and is also
  called mural wallpaper, photo mural, and wall mural.
examples:
- The photo wallpaper covered only one wall.
- The photo wallpaper was picked from a set list.
