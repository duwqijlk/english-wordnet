simpleMeaning: The thin watery part that is left after the curd is taken out when cheese is made.
scope: 'Also called whey: the thin watery part left after the curd is taken out when cheese is made, not
  the curd itself and not cream.'
examples:
- She poured off the milk whey after the curd had set.
- The milk whey ran clear from the cheese cloth.
