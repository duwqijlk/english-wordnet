simpleMeaning: a person who hunts or fishes against the law on another person's land or water
scope: This sense is a person who hunts or fishes against the law on land that belongs to someone else;
  it is not the small fish with bony plates, and not the cooking pot with the same name.
examples:
- The poacher was caught hunting deer in the forest at night.
- Police arrested two poachers who had been fishing in the private lake.
