simpleMeaning: A small evergreen bush or tree of the south-east United States that often grows into thick
  clumps people can hardly pass through, on sandy land near the sea.
scope: Also called myrtle oak and seaside scrub oak; a small evergreen bush or tree of the south-east
  United States, not a tall tree of inland hills and not a plant that loses its leaves in winter.
examples:
- Quercus myrtifolia forms thick clumps along the sandy shore.
- We pushed through the Quercus myrtifolia thicket to reach the beach.
