simpleMeaning: one of two pairs of wet skin folds that stick out into the voice box
scope: One of two pairs of wet skin folds in the voice box, also called vocal cord, vocal fold and plica
  vocalis; not the throat itself and not the tongue.
examples:
- The singer's vocal bands moved as she held the high note.
- A cold can make the vocal bands swell and the voice go hoarse.
