simpleMeaning: the act of swimming just under the surface of the water and breathing through a tube that
  reaches the air above
scope: This is swimming near the surface of the water with a breathing tube, not deep diving with air
  tanks and not swimming on top of the water.
examples:
- We went snorkeling in the clear water near the rocks.
- Snorkeling let her watch fish while she stayed near the surface.
