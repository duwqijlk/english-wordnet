simpleMeaning: a wide flat sheet of flesh in the lower leg, under the big sheet at the back of the calf
scope: A wide flat sheet of flesh in the lower leg, under the big sheet at the back of the calf, also
  called soleus; not the big calf muscle itself and not a bone.
examples:
- The soleus muscle helps you stand on tiptoe.
- A strain in the soleus muscle made walking painful.
