simpleMeaning: To do with how a thing works, not with the body or its parts.
scope: This is about how a thing works rather than the body, not the sense of a machine that works, nor
  the sense of being based on use rather than shape, nor the two senses of being made for a use.
examples:
- The patient had functional deafness, not damage to the ear.
- Her functional blindness came and went with stress.
