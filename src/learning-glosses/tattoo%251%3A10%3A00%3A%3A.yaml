simpleMeaning: Soldiers hear this beat of a drum or call on a horn, and know they must go back to their
  rooms.
scope: A drum beat or horn call telling soldiers to go back, not a picture made on the skin.
examples:
- The tattoo sounded at night, and the soldiers went back to their rooms.
- At ten o'clock the tattoo called the soldiers back to their quarters.
