simpleMeaning: In ohms, this is how much a substance holds back the flow of electric current through it
scope: How much a substance holds back electric current, also called resistance, electric resistance,
  electrical resistance, and ohmic resistance; not the current itself and not the voltage.
examples:
- The impedance of the speaker must match the amplifier.
- Engineers measure impedance in ohms before wiring the circuit.
