simpleMeaning: Small blades that turn round tell how fast the ship moves, on a tool shaped like a cigar.
scope: Also called screw log and taffrail log, this cigar-shaped tool is the one whose turning blades
  tell how fast the ship moves.
examples:
- The patent log told us how fast the ship was moving.
- The patent log's small blades turned round as the ship moved.
