senseId: 'ampoule%1:06:00::'
synsetId: 03929501-n
simpleMeaning: A small bottle holding a drug, especially a sealed container free of germs for giving a
  drug with a needle.
scope: Also called a vial, a phial, an ampule, or an ampul; a small bottle holding a drug, especially
  a sealed container free of germs for giving it with a needle.
examples:
- The nurse broke open an ampoule and drew the drug into a needle.
- Each ampoule held one dose of the medicine.
