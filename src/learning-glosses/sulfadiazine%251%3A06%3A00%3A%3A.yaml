simpleMeaning: a drug that fights germs, used to treat meningitis, a bad illness of the brain and spine,
  pneumonia, and other infections
scope: A drug that fights germs and treats meningitis, pneumonia and other infections, not a painkiller
  and not a drug used only for one kind of infection.
examples:
- The doctor gave her sulfadiazine for her meningitis.
- Sulfadiazine was used to treat the pneumonia and stop the infection from spreading.
