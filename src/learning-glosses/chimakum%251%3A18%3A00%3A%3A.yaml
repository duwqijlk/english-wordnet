simpleMeaning: This person belongs to the Salishan group of peoples, who live in the north-west of Washington
scope: A member of that people, not a speaker of their tongue and not a member of another people of the
  north-west.
examples:
- She was a Chimakum from northwestern Washington.
- The Chimakum lived in the north-west of Washington.
