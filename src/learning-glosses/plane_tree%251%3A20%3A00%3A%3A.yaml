simpleMeaning: any of several tall plants of the group Platanus, bearing round heads of fruit and leaves
  cut into rounded parts, with thin pale bark that peels away in small plates
scope: Also called a sycamore and a platan; not a maple and not an oak.
examples:
- A plane tree shades the street with its wide leaves.
- The plane tree dropped its round heads of fruit on the path.
