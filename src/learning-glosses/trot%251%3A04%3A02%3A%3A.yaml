simpleMeaning: a pace faster than a walk, in which the front leg on one side and the back leg on the other
  side hit the ground together
scope: A pace faster than a walk, with opposite legs moving together, not a word-for-word translation
  and not the verb for running this way.
examples:
- The horse broke into a trot as we left the yard.
- Her trot was smooth and even on the long road home.
