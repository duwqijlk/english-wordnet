simpleMeaning: A person who works at measuring how strong light is.
scope: This is a person who works at measuring how strong light is, also called a photometrician; it is
  not a person who takes pictures, and not a person who makes lamps.
examples:
- The photometrist tested the lights in the shop.
- A photometrist came to check the new lamps.
