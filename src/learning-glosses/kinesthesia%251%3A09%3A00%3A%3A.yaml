senseId: 'kinesthesia%1:09:00::'
synsetId: 05730155-n
simpleMeaning: The sense that tells you where the parts of your body are, how they move, and how tight
  your muscles are
scope: Also called feeling of movement and kinaesthesia; it is the sense of where your body parts are,
  not sight and not touch.
examples:
- Kinesthesia helps you touch your nose with your eyes closed.
- After the stroke, his kinesthesia was weak and he often lost his balance.
