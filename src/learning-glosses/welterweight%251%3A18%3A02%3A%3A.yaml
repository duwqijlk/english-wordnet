simpleMeaning: An amateur boxer at no more than 148 pounds.
scope: This sense is an amateur boxer at no more than 148 pounds, unlike the sense for a weight class
  in fight sports, for fighters heavier than lightweights and lighter than middleweights, unlike the sense
  for a weight of 28 pounds, sometimes set as a handicap in a horse race, unlike the sense for a professional
  boxer weighing between 141 and 147 pounds, and unlike the sense for a wrestler weighing 154 to 172 pounds.
examples:
- The welterweight boxer weighed 147 pounds.
- Welterweights fight at no more than 148 pounds.
