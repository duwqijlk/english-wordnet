simpleMeaning: often sweet and charming in a childlike or innocent way, and easy to feel fond of.
scope: This is not about physical beauty; it describes a person or manner that is sweet and endearing
  in a childlike way.
examples:
- The children's lovely manners impressed all the guests.
- His lovely, trusting manner made people want to protect him.
