simpleMeaning: a rough figure or reckoning of how much there is, how great something is, or what it is
  worth.
scope: This is not a thought, plan, or suggestion in the mind; it is a rough estimate of an amount, level,
  or value.
examples:
- The builder gave us a rough idea of what the repairs would cost.
- From the map, we formed a rough idea of the distance to the coast.
