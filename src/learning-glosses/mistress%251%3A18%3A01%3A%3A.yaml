simpleMeaning: a woman who has an ongoing sexual relationship with a man who is married to another woman
scope: This is a woman in a sexual relationship with a married man, not a woman teacher and not a woman
  who is in charge of a house or of other people.
examples:
- She became his mistress and saw him every week for two years.
- Everyone in the town knew that the married man had a mistress.
