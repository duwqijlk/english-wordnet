simpleMeaning: not firm or safe, and having many problems
scope: 'Also called precarious: not firm or safe and having many problems, not shaking a little, and not
  weak in a way that makes a thing move or fall.'
examples:
- Their marriage felt shaky after months of money problems.
- The new business is still shaky and may fail if sales stay low.
