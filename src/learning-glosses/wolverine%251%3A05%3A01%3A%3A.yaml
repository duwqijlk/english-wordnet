simpleMeaning: a meat-eating mammal (an animal that feeds its young on milk) of North America, short and
  thick, with long, rough hair
scope: 'Also called carcajou and skunk bear: the North American kind of this animal, not the kind that
  lives in the north of Europe and Asia.'
examples:
- A wolverine in North America dug through the snow to find food.
- The wolverine is short and thick, with long, rough hair.
