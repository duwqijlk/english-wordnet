simpleMeaning: A rite that makes a person or place clean from dirt or wrong, done in the set way
scope: A rite that cleans a person or place of dirt or wrong, not a drug that clears the bowels; purification
  is another name for this sense.
examples:
- The purgation was held at dawn before the feast.
- After the long purgation, the temple was open again.
