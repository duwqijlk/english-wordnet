simpleMeaning: a small hard sweet with medicine in it that you suck to make a sore throat feel better
scope: A small sweet with medicine in it that you suck to soothe a sore throat; pastil and pastille are
  other names for this sense, not a plain sweet and not a drink for a cold.
examples:
- She sucked a cough drop to soothe her sore throat.
- He took a cough drop before he had to talk for an hour.
