simpleMeaning: A round shape made of rings set one inside another, as when leaves or flower petals curl
  round a centre
scope: 'Also called roll, curl and scroll: a round shape of rings set one inside another, not a thing
  wound in loops and not a tube wound in a spiral.'
examples:
- The coil of leaves opened slowly in the sun.
- A coil of petals curled round the centre of the flower.
