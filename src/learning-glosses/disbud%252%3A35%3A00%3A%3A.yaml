simpleMeaning: to take away some of the small growths that would turn into flowers so the flowers left
  behind are of better quality
scope: To take away some young growths so the flowers left behind are of better quality, and not to cut
  off the whole plant or to destroy the horn buds of cattle.
examples:
- She disbuds the roses each spring so the rest of the flowers grow big and strong.
- The gardener disbudded the chrysanthemums to keep only the best blooms.
