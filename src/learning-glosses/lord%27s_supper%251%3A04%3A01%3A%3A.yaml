simpleMeaning: The old Passover meal that Jesus ate with his followers on the night before he died on
  the cross.
scope: This is the Passover meal Jesus ate with his followers on the night before he died on the cross;
  Last Supper is another name for this meal, and it is not the church rite that recalls it with bread
  and wine.
examples:
- The Lord's Supper took place on the night before Jesus died.
- At the Lord's Supper, Jesus shared bread with his disciples.
