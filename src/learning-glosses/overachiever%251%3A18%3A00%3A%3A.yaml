simpleMeaning: a student who reaches a higher level in school than their score on an IQ test (a test of
  learning and thinking ability) would lead people to expect
scope: A student who does better than a test score led people to expect, not a student who just works
  hard and not one who does worse than expected.
examples:
- Tests said she would struggle, but the overachiever passed every class with high marks.
- As an overachiever, he did far better in school than his early test scores suggested.
