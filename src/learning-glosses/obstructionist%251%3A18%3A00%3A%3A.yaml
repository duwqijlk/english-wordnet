senseId: 'obstructionist%1:18:00::'
synsetId: 10368974-n
simpleMeaning: A person who keeps getting in the way of something others want to do, on purpose and time
  after time.
scope: A person who keeps getting in the way of what others want to do; obstructer and obstructor are
  other names for this; not a person who blocks the way by accident, and not a thing that stands in the
  road.
examples:
- The obstructionist delayed every plan the council put forward.
- He was known as an obstructionist of the new road.
