simpleMeaning: A swift, skin-deep reader.
scope: This sense is a swift, skin-deep reader, unlike the sense for a gull-like sea bird, flying along
  the top of the water with a long lower beak dipped in, to skim out food, unlike the sense for a stiff
  straw hat, flat-topped, and unlike the sense for a cook tool used to skim fat from the face of fluids.
examples:
- The skimmer is a swift, skin-deep reader.
- Skimmers read swiftly and skin-deep.
