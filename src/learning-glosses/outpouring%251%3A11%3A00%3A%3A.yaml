simpleMeaning: a flow of liquid or gas out of something
scope: 'Also called run and discharge: a flow of liquid or gas coming out, not a fast, non-stop flow of
  spoken or written words.'
examples:
- An outpouring of water flooded the street after the pipe burst.
- The wound caused a steady outpouring of blood.
