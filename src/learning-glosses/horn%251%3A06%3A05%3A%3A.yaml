simpleMeaning: a part in a car used to make a warning sound
scope: This is the part in a car that makes a warning sound. It is not the sound itself and not the hard
  growth on an animal's head.
examples:
- He pressed the horn to warn the child in the road.
- The car's horn did not work, so she could not warn anyone.
