simpleMeaning: harm or damage that someone suffers because another person broke the law.
scope: This is not a mistaken belief, an incorrect answer, or bad behaviour in general; it is the legal
  harm that a person actually suffers.
examples:
- The court found that the company had done a wrong to its customers.
- She went to court to get compensation for the wrong she had suffered.
