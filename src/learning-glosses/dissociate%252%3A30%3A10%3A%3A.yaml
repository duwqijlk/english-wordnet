schema: oewn-learning-gloss-v2
senseId: 'dissociate%2:30:10::'
synsetId: 00210024-v
simpleMeaning: For a molecule to break apart, in a way that can be undone or that lasts only a while,
  into simpler molecules or single atoms.
scope: For a molecule to break apart into simpler molecules or single atoms, in a way that can be undone,
  not to join together into a larger whole.
examples:
- The acid will dissociate in water to give hydrogen ions.
- In water, the compound will dissociate into simpler molecules.
