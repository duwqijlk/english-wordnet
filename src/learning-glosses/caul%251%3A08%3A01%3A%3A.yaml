simpleMeaning: Part of the thin layer inside the belly that is joined to the stomach and the colon and
  covers the intestines
scope: A thin layer inside the belly joined to stomach and colon; not the membrane around a baby before
  birth.
examples:
- The surgeon lifted the caul to see the organs beneath.
- The caul covers the intestines and joins the stomach to the colon.
