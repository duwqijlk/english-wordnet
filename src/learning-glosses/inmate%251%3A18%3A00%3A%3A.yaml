simpleMeaning: one of several people who live in the same place, most often someone kept in a prison or
  a hospital
scope: One of several people living in the same place, most often in a prison or hospital, not a person
  serving a jail sentence.
examples:
- Each inmate of the old house had a small room of their own.
- The inmates of the hospital were moved to a new wing.
