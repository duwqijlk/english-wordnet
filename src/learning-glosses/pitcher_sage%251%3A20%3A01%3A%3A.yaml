simpleMeaning: Big white flowers grow on this California plant, whose stems and leaves are covered in
  soft hairs
scope: This California plant has big white flowers and soft-haired stems and leaves; it is not the other
  California pitcher sage, a tall plant with few branches.
examples:
- The pitcher sage by the path had big white flowers.
- We found a pitcher sage with stems and leaves covered in soft hairs.
