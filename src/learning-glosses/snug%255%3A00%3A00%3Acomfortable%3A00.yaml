simpleMeaning: warm and safe and comfortable, giving comfort and shelter, most of all in a small space
scope: Warm and safe and comfortable, most of all in a small space — cozy is another name for this sense
  — not just tight-fitting, and not just safe from danger.
examples:
- The children felt snug in bed on the cold night.
- It was a snug little apartment near the fire.
