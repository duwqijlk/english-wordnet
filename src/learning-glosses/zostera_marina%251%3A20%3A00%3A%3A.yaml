simpleMeaning: A plant that grows under the sea, with very long narrow leaves, found in great numbers
  along the coasts of the North Atlantic.
scope: 'Also called eelgrass, grass wrack and sea wrack: a plant that grows under the sea with very long
  narrow leaves, not a plant of fresh water.'
examples:
- Zostera marina covers the shallow sea floor in long green bands.
- Zostera marina grows in great numbers along the North Atlantic coasts.
