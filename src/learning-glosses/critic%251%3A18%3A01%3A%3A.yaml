simpleMeaning: anyone who weighs a thing carefully and then says what they think of it
scope: Any person who gives a reasoned judgment, not a professional art critic and not a person who only
  finds fault.
examples:
- Every critic of the plan had good reasons for doubting it.
- She is a fair critic who weighs both sides before she speaks.
