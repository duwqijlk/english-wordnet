simpleMeaning: how much of a thing there is, or how many of them there are, when you can count or measure
  it
scope: How much of a thing there is, or how many of them there are, when you can count or measure it,
  not the idea of size or amount in maths.
examples:
- Tell me the quantity of flour you need for the cake.
- The quantity of rain this year was far above normal.
