simpleMeaning: to make things separate by undoing how they were joined
scope: Another name for this is disjoin. It means taking joined things apart yourself, not things coming
  apart on their own.
examples:
- The workers disjointed the metal frame so it would fit through the door.
- He carefully disjointed the two joined parts of the model.
