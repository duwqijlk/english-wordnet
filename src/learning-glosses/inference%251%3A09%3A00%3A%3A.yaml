senseId: 'inference%1:09:00::'
synsetId: 05782611-n
simpleMeaning: The thinking that goes into reaching a conclusion or a reasoned judgment from signs and
  earlier conclusions, rather than from seeing the thing itself.
scope: Also called an illation; the thinking that reaches a conclusion from signs and earlier conclusions,
  not a guess and not something seen with your own eyes.
examples:
- Her inference followed from the footprints in the mud.
- The inference that he had left early rested on the empty chair.
