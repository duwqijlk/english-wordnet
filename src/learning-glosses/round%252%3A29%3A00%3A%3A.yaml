simpleMeaning: to become fuller, softer, or more attractively curved in shape
scope: Not making a number simpler and not turning physically; it describes a body or form filling out.
examples:
- Her cheeks rounded as she regained the weight she had lost.
- As the fruit ripened, it rounded and softened.
