simpleMeaning: A part of the group that runs the United States, no longer there, set up in nineteen fifty-three
  and split in nineteen seventy-nine.
scope: A past part of the government, not a present one.
examples:
- The Department of Health Education and Welfare was set up in nineteen fifty-three.
- In nineteen seventy-nine, the Department of Health Education and Welfare was split.
