simpleMeaning: With long grooves down the throat and a small pointed fin on top, several large whales
  of the rorqual family strain food from the sea.
scope: 'Also called a rorqual: a large whale with grooves down its throat, not the thin hog with a ridged
  back.'
examples:
- The razorback swam slowly past the boat, its throat grooves clear in the water.
- We watched a razorback lift its small pointed fin above the waves.
