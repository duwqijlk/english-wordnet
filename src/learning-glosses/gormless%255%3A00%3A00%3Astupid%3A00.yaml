simpleMeaning: 'British informal: not good at thinking or understanding, and with little energy'
scope: This British informal word describes a person who is not good at thinking or understanding and
  has little energy. It is not just being tired for a short time.
examples:
- He stood there with a gormless look on his face.
- She gave a gormless stare and said nothing.
