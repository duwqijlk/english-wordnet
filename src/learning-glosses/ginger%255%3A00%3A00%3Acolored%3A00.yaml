simpleMeaning: bright orange-brown in color, used especially to talk about hair or fur
scope: This is the color word for hair or fur, not the plant, not the fresh root used in food, and not
  the dried powder.
examples:
- She has long ginger hair that shines in the sun.
- A ginger kitten slept by the fire.
