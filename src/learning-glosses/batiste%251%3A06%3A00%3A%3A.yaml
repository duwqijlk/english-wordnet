simpleMeaning: Shirts or dresses are made from this thin cloth of cotton or linen, woven in a plain flat
  way.
scope: A thin plain-weave cloth of cotton or linen for shirts and dresses, not a thick cloth and not one
  woven with a raised pattern.
examples:
- She chose batiste for a dress.
- The shirt was sewn from thin batiste.
