simpleMeaning: being ready and willing to give in and do what someone else wants
scope: Also called indulgence. This is being ready to do what another person wants; it is not making a
  punishment lighter, and not the kindness shown to a person who has done wrong.
examples:
- Her leniency with her children meant they got the toys they asked for.
- His leniency let his son stay out as late as he wished.
