simpleMeaning: Dark, heavy wood comes from this tree of wet low ground in the south of the United States,
  which bears short oval pods.
scope: Water locust is another name for it, a tree of wet low ground in the south of the United States
  with short oval pods and dark, heavy wood.
examples:
- Short oval pods hung from the swamp locust in the wet low ground.
- The swamp locust gave dark, heavy wood.
