synsetId: 06260901-n
simpleMeaning: 'a Gestalt rule about how the mind groups what it sees: things near each other in place
  or time are seen as one group, when nothing else is different'
scope: A Gestalt rule about how the mind groups what it sees, also called proximity, not the rule about
  things moving together and not the rule about lines keeping their direction.
examples:
- The law of proximity says things near each other look like one group.
- Under the law of proximity, the close dots seem to belong together.
