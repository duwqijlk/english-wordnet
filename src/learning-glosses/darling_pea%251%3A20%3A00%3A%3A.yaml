simpleMeaning: One of two kinds of Australian plant in the Swainsona group that poison sheep.
scope: One of two Australian plants that poison sheep; poison bush is another name for it, not a garden
  flower and not a food plant.
examples:
- The darling pea is poisonous to sheep.
- Farmers keep sheep away from the darling pea.
