simpleMeaning: a quiet, bad-tempered way of being, unhappy and angry at others and not ready to be friendly
scope: 'Also called sulkiness, moroseness and sullenness: a person''s unhappy, angry way of being, not
  the sharp taste of lemon or vinegar.'
examples:
- Her sourness made every talk at work feel cold and hard.
- After he lost his job, a deep sourness stayed with him for months.
