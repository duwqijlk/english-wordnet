simpleMeaning: an insect-eating bird of Australia and south-east Asia with a very wide opening at the
  front of the head
scope: This is an insect-eating bird of Australia and south-east Asia with a very wide opening at the
  front of the head; not an owl or a nightjar.
examples:
- A frogmouth sat still on the branch all day.
- The frogmouth opened its wide mouth to catch a moth.
