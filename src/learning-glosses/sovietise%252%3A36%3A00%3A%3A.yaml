simpleMeaning: To shape a country's social, political, and economic system on the pattern of the Soviet
  Union
scope: 'Also called sovietize: to remake a country on the Soviet pattern, not merely to bring it under
  Soviet control.'
examples:
- The new leaders sovietised the country's farms and factories.
- After the war, the state sovietised its schools and courts.
