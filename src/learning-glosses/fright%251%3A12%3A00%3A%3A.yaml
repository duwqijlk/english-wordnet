senseId: 'fright%1:12:00::'
synsetId: 07534492-n
simpleMeaning: the bad feeling a person gets when they think some pain or danger will come, which usually
  makes them want to run away or fight
scope: 'Also called fear: the feeling a person gets before pain or danger comes, not pain itself and not
  danger itself.'
examples:
- Fright made her want to run when she heard steps behind her in the dark.
- He felt fright as he waited and thought the storm might hit his house.
