scope: This is a large freshwater fish from Asia, raised for food and now a pest in the United States;
  domestic carp is another name for this sense, and it stands apart from other food fish by feeding on
  the bottom.
examples:
- Cyprinus carpio feeds on the bottom of ponds.
- Cyprinus carpio has become a pest in the United States.
