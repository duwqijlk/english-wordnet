simpleMeaning: the act of making things all the same and keeping them in a set order
scope: This is the act of making things the same, not a rule that guides how people act and not the sense
  that means set by a rule.
examples:
- Regulation of the machines kept every part moving at the same speed.
- The regulation of all the clocks in the station took all morning.
