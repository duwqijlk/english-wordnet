simpleMeaning: A tiny living thing tied to the malaria germ, with a stage of its life in the inner organs
  of many kinds of birds.
scope: A tiny living thing tied to the malaria germ, with a stage of its life in the inner organs of many
  kinds of birds; not a tiny living thing that lives in the blood cells of animals and not a protein joined
  to iron.
examples:
- The haemoproteid lived in the inner organs of the bird.
- Haemoproteids have a stage of life in the inner organs of birds.
