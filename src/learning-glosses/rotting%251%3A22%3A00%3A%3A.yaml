simpleMeaning: In biology, the way a thing breaks down, caused by tiny living things (bacteria) or by
  growths like mold (fungi)
scope: Also called rot and breakdown, this is the breaking down of a thing in nature, not a machine that
  stops working.
examples:
- The rotting of the fallen leaves feeds the soil.
- Rotting went on in the wet wood until it fell apart.
