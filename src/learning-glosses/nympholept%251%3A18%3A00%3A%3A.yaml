simpleMeaning: A person overcome by a wild longing for a female spirit of woods and waters.
scope: A person overcome by a wild longing for a wood spirit; not a person who is ill in the mind, and
  not an ordinary lover.
examples:
- The poet wrote of a nympholept wandering the woods in search of his love.
- In the old tale, the nympholept could think of nothing but the spirit he had seen.
