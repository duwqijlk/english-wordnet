simpleMeaning: A cut made by a surgeon through the chest wall to open the space around the lungs
scope: This is a cut through the chest wall to open the space around the lungs; not an operation on the
  heart and not a cut to drain fluid.
examples:
- The surgeon made a thoracotomy to open the space around the lungs.
- After the thoracotomy, the chest was closed again.
