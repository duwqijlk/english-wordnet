simpleMeaning: 'a small fruit with one of a few forms: one whole piece, like a grape, or many small parts
  joined together'
scope: This sense is about the form a small fruit takes, as one whole piece or as small parts joined together;
  not the food sense of a small soft fruit that people eat.
examples:
- In plant science, a grape is a berry that grows as one simple piece.
- A raspberry is a berry made of many small parts joined together.
