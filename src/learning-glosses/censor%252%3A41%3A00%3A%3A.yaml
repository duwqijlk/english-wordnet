simpleMeaning: To forbid a film or a newspaper from being shown or shared with the public
scope: To forbid a film or a newspaper from being shown or shared with the public, also called ban; not
  the person who reads books and cuts out what is not allowed.
examples:
- The government moved to censor the film.
- They tried to censor the newspaper before it reached the streets.
