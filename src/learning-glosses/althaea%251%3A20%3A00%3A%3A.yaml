simpleMeaning: Any of several plants of one group, like the hollyhock group but with smaller flowers.
scope: Any of several plants of one group, like the hollyhock group but with smaller flowers, also called
  hollyhock and althea; not a rose mallow and not a plain garden flower.
examples:
- Althaea bloomed beside the wall all summer.
- She planted althaea for its soft pink flowers.
