simpleMeaning: To act the part of a character while taking part in a game or other fun activity.
scope: This is not performing in a written drama, not taking part in a sport and not producing recorded
  sound; it is pretending to be someone as part of a game.
examples:
- The children played pirates, using sticks as swords.
- In the classroom game, he played a shopkeeper and she played a customer.
