senseId: 'surrejoinder%1:10:00::'
synsetId: 06575792-n
simpleMeaning: In law, a written statement by the person who brought a court case, made in answer to the
  defendant's rejoinder
scope: This is a court statement by the person who brought the case, made in answer to the defendant's
  rejoinder; not an answer to a rebutter and not a statement by the defendant.
examples:
- The surrejoinder answered the defendant's rejoinder point by point.
- She filed a surrejoinder after the defence had replied.
