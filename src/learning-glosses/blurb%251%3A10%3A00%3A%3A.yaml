simpleMeaning: a short written statement that praises a book to help sell it, such as the one on the paper
  cover of a book
scope: 'Also called endorsement: a short piece of praise in writing that helps sell a book, not a full
  review of the book.'
examples:
- The blurb on the back cover said the story was funny and sad.
- A famous writer wrote a kind blurb for her first book.
