simpleMeaning: putting the things looked at in order on purpose in a way that has no pattern, so it acts
  like chance
scope: 'Also called randomization: putting things in a set order on purpose with no pattern, not a true
  chance event and not choosing members of a group by chance.'
examples:
- The test used randomisation to put the questions in a mixed order.
- By randomisation, the list of results was set out in no set order.
