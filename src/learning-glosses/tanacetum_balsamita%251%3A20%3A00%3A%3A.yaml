simpleMeaning: A long-lived Eurasian herb smelling of tansy, with round yellow flowers; eaten cooked or
  in salads, sometimes for potpourri, tea, or flavouring, and sometimes put in the genus Chrysanthemum.
scope: A Eurasian herb smelling of tansy, also called alecost, balsam herb, bible leaf, costmary, mint
  geranium, and Chrysanthemum balsamita; not tansy itself and not other scented garden herbs.
examples:
- Tanacetum balsamita scents the garden like tansy.
- She adds Tanacetum balsamita to salads and tea.
