simpleMeaning: A tall spruce with blue-green needles and a thick cone-shaped top, whose older trees grow
  tall and straight with lower branches that sweep down
scope: Also called silver spruce, Colorado blue spruce and Colorado spruce, it is a tall spruce with blue-green
  needles and a thick cone-shaped top whose older trees grow tall and straight with lower branches that
  sweep down, while other tall spruces with blue-green needles and other spruces with cone-shaped tops
  are different kinds.
examples:
- The Picea pungens stood tall with blue-green needles in the garden.
- Older Picea pungens trees grow tall and straight with sweeping lower branches.
