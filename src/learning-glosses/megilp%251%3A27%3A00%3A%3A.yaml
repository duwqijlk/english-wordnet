simpleMeaning: Linseed oil with sticky tree gum or turpentine makes this, which painters mix into oil
  paint.
scope: Also called magilp, it is what painters stir into oil paint, not the paint itself.
examples:
- He stirred megilp into the oil paint.
- They bought megilp to mix into oil paint.
