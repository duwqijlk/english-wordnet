simpleMeaning: The thick, long-lasting stem of a soft-stemmed plant that lives for several years.
scope: The thick, lasting stem of a soft-stemmed perennial only; not a cooking liquid, a graft rootstock,
  a bright-flowered Old World plant, a Malcolmia ornamental, the goods a shop has on hand, a supply kept
  for future use, corporate equity, a share certificate, a person's ancestry, a breed of domesticated
  animals, a person's reputation, lumber, the handle end of a tool, the handle or butt of a gun, a white
  cravat, farm animals, a routine thing, an overused saying, a standard item regularly sold, or any verb
  use (keeping goods on hand, fitting something out, putting fish into a pond, putting livestock on land,
  gathering a store for later, supplying something with goods, putting out sprouts).
examples:
- The plant dies back each winter, but its underground stock survives.
- New shoots emerge from the thick stock at the base of the plant.
