simpleMeaning: Small signs of blood in bits of what the body passes, checked at home, can show cancers
  of the large bowel.
scope: People also call it faecal occult test and fecal occult test, and it is a home check of bits of
  what the body passes for small signs of blood, to find cancers of the large bowel.
examples:
- She did a stool test at home.
- The stool test found no blood.
