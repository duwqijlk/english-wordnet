senseId: 'bell_pepper%1:20:00::'
synsetId: 12922024-n
simpleMeaning: Bearing big, mild fruits with thick walls, usually bell-shaped, this plant is the top salad
  peppers.
scope: This sense is also called paprika, pimiento, pimento, sweet pepper, and sweet pepper plant, bearing
  big, mild fruits with thick walls, usually bell-shaped, this plant is the top salad peppers, where pimiento
  bears big, mild, thick-walled fruits that usually take the shape of bells and are the main salad peppers,
  and pimento bears big, mild, thick-walled fruits that are usually bell-shaped and are the leading salad
  peppers, unlike the sense for a large bell-shaped sweet pepper in green or red or yellow or orange or
  black varieties.
examples:
- Bell peppers are the top salad peppers.
- The bell pepper bears thick-walled fruits.
