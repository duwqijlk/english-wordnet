simpleMeaning: The spot where the nerve of the eye meets the back of the eye, which cannot sense light
scope: 'Also called an optic disk or a blind spot: the spot where the eye nerve joins the back of the
  eye, not the lens and not the front of the eye.'
examples:
- The optic disc is the one place on the back of the eye that cannot see light.
- The doctor looked at the optic disc during the eye test.
