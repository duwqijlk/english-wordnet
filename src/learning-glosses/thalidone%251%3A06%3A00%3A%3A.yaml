scope: Also called chlorthalidone and Hygroton; a water-passing drug that keeps high blood pressure down,
  eases swelling from too much fluid, and helps stop heart attacks by lowering blood pressure.
examples:
- Thalidone keeps high blood pressure down.
- The doctor gave Thalidone to ease the swelling.
