simpleMeaning: to grow, evolve or change gradually over time in a helpful setting
scope: This sense is about something growing or evolving, such as a plant, child or country, not about
  a plot becoming known and not about processing film.
examples:
- Over twenty years, the village developed into a busy market town.
- The seeds developed into strong plants by midsummer.
