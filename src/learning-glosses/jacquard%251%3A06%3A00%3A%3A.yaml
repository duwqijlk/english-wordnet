simpleMeaning: A loom with a device that lifts threads to open gaps for the shuttle to pass between them,
  used to weave cloth with a pattern.
scope: Also called Jacquard loom; a loom that weaves patterned cloth, not a plain loom and not a sewing
  machine.
examples:
- The mill still runs a Jacquard from the 1800s.
- This Jacquard weaves the flower pattern into the cloth.
