senseId: 'microsporangium%1:20:00::'
synsetId: 11708433-n
simpleMeaning: The part of a plant where microspores are made, tiny cells that help make new plants.
scope: A plant part for making microspores; not the tiny cell itself, and not a part that makes other
  kinds of spores.
examples:
- Each microsporangium in the flower releases thousands of tiny cells.
- The microsporangium opens when the pollen is ripe.
