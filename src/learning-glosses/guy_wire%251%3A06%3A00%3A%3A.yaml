simpleMeaning: A cord or rope used to hold something steady, most of all a tent.
scope: A cord or rope used to hold something steady, most of all a tent; guy, guy cable and guy rope are
  other names for it, not a tent peg and not the pole that holds a tent up.
examples:
- They tied a guy wire to the tent to hold it steady.
- The guy wire kept the mast from swaying in the wind.
