simpleMeaning: With a puffed-out lip shaped like a bag, this is one of many kinds of wild flowers, mostly
  from the Americas, hard or impossible to grow in a garden.
scope: Also called ladies' slipper, lady's-slipper, lady's slipper, lady-slipper, and lady slipper, it
  is one of many kinds of wild flowers with a puffed-out lip shaped like a small bag, hard or impossible
  to grow in a garden.
examples:
- The slipper orchid bears a puffed-out lip shaped like a small bag.
- A slipper orchid is hard or impossible to grow in a garden.
