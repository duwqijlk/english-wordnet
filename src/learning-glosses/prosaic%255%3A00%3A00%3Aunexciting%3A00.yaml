simpleMeaning: Dull and easy, with nothing in it to stir you or hold your mind.
scope: Also called commonplace, unglamorous, or humdrum, this is dull and easy with no stir of excitement,
  not the sense of lacking wit or imagination.
examples:
- He led a prosaic life in the suburbs.
- The prosaic job bored her within a week.
