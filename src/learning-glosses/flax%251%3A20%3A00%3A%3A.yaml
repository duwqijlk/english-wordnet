simpleMeaning: a plant of the Linum group that people grow for its seeds and for the thin strands in its
  stem
scope: This is the living plant itself, not the thread-like material taken from its stem to make cloth.
examples:
- Farmers grow flax for its seeds and for the strands in its stem.
- Flax grows well in cool, wet places.
