simpleMeaning: With threads that run across, this flat band of flesh in the belly forms its front and
  side walls.
scope: Transversus abdominis, transverse muscle of abdomen, and musculus transversalis abdominis are other
  names for this flat band of flesh in the belly.
examples:
- The transversus abdominis muscle runs across the front of the belly.
- The transversus abdominis muscle forms the side wall of the belly.
