simpleMeaning: the lively, active quality of a person who has lots of energy
scope: 'Also called oomph and dynamism: the lively energy in a person''s character. It is not the short,
  high buzzing sound that this word can also mean.'
examples:
- She has real zing and makes every party fun.
- His zing lifts the whole team at work.
