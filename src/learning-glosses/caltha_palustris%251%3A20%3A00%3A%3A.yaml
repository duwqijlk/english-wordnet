simpleMeaning: A plant of wet marshy ground in Europe and North America, with bright yellow flowers like
  buttercups.
scope: Also called cowslip, kingcup, marsh marigold, meadow bright, water dragon and May blob, it is a
  marsh plant with bright yellow flowers like buttercups, not a buttercup itself and not a dry-ground
  yellow flower.
examples:
- Caltha palustris brightened the marsh in spring.
