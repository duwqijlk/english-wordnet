simpleMeaning: A book that sets out the ways of one group, above all the set forms of worship in a house
  of monks or nuns
scope: A book setting out the ways of one group, also called a consuetudinary, not a book of laws and
  not a history of the group.
examples:
- The consuetudinal laid down the order's daily rites.
- She read the consuetudinal to learn the house rules.
