simpleMeaning: This magnet pulls iron to it and can itself be pulled by other magnets; it is made of a
  dark iron stone, lasts, and has two ends.
scope: 'Also called lodestone: a lasting magnet of dark iron stone.'
examples:
- The old loadstone in the drawer still pulled nails toward it.
- A loadstone can pull iron to it and be pulled by another magnet.
