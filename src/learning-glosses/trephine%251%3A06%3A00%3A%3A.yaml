simpleMeaning: a tool used by a doctor to take out a piece of bone from the head
scope: This is a doctor's tool for taking out bone from the head; trepan is another name for this sense.
  Not a drill for teeth and not a saw for cutting wood.
examples:
- The trephine cut a clean piece of bone from the skull.
- Doctors once used a trephine when they needed to reach the brain.
