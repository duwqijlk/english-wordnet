simpleMeaning: A plant that lives for years, grown above all as a plant for the house, for its sweet-smelling
  flowers of blue to dark lavender.
scope: Also called Exacum affine; a house plant grown for its sweet-smelling blue to dark lavender flowers,
  set apart from outdoor flowers by its life indoors and its scent.
examples:
- The Persian violet on the windowsill filled the room with scent.
- She watered her Persian violet every morning.
