simpleMeaning: Used in healing creams and to make parts move smooth, this soft, half-solid mix comes from
  oil.
scope: This is a soft mix from oil for creams and for easing movement; petrolatum and petroleum jelly
  are other names for this sense.
examples:
- She rubbed mineral jelly on her skin to ease it.
- Mineral jelly on the hinge lets it move smooth.
