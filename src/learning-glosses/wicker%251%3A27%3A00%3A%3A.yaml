simpleMeaning: 'what you weave baskets and other things from: thin, bendy branches or twigs, most often
  willow or cane'
scope: Thin, bendy branches or twigs used for weaving, not the finished woven work itself.
examples:
- He cut wicker from the willow trees by the pond.
- The basket maker soaked the wicker before weaving it.
