simpleMeaning: The form of the tongue of Rome written between the 3rd and 8th centuries
scope: Also called Biblical Latin, the Biblical Latin language and the Late Latin language, it is the
  form of the tongue of Rome written between the 3rd and 8th centuries, not the tongue of an earlier time
  and not the tongue of a later time.
examples:
- Late Latin was written between the 3rd and 8th centuries.
- Late Latin is the form of Latin of that time.
