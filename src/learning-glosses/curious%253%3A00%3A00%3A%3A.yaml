simpleMeaning: wanting very much to find out about things and learn more, sometimes about what other people
  are doing.
scope: Eager to learn and find out about things, not strange or odd in nature or appearance.
examples:
- The curious child asked question after question about the stars.
- The neighbors grew curious about the lights in the empty house.
