simpleMeaning: A spiny scaled animal often seen warming itself in the sun on low barriers in the United
  States and northern Mexico.
scope: A spiny scaled animal often seen warming itself in the sun on low barriers in the United States
  and northern Mexico, not a snake and not a horned lizard.
examples:
- A fence lizard basked on the wooden fence all afternoon.
- We saw a fence lizard sunning itself on the fence.
