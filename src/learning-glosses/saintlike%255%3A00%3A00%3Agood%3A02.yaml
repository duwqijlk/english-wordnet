simpleMeaning: Kindness with no bad feeling in it marks this way of acting, fitting for a holy person
  or a messenger from heaven.
scope: Saintly, angelic, sainted, beatific, and angelical are other names for this kind and good way of
  acting, fitting for a holy person.
examples:
- A saintlike smile can make a hard day feel lighter.
- It takes saintlike patience when tempers run high.
