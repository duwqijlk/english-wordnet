simpleMeaning: The blood and the parts of the body that make it are what this doctor knows and treats
  when they fall ill
scope: A doctor who treats illnesses of the blood, also called haematologist, not a heart doctor and not
  a surgeon.
examples:
- The hematologist checked his blood counts.
- She was sent to a hematologist when her blood tests looked odd.
