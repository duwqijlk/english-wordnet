simpleMeaning: In living things, this is one tiny purine bit of the two kinds of code of life; it joins
  with thymine in one kind, with U in the other.
scope: A building block of living things, also called adenine; not the first letter, and not the unit
  of current.
examples:
- A pairs with thymine in DNA.
- In RNA, A pairs with uracil.
