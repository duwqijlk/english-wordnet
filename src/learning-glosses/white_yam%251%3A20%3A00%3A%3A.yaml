simpleMeaning: a plant grown in Australasia and Polynesia for its large root, with good pale flesh that
  can be eaten
scope: 'Also called water yam: a food plant grown for its large root, not a sweet potato and not a yam
  grown for its leaves.'
examples:
- The farmer dug up a white yam for dinner.
- White yams grow well in the warm islands of Polynesia.
