simpleMeaning: In acids from minerals, in alkali, or with the right enzyme, this compound breaks down
  fast; it also turns light in one direction.
scope: A compound that turns light one way and breaks down fast in acids from minerals, in alkali, or
  with the right enzyme, not one that stays whole in them.
examples:
- The phenolic glycoside turned the light and broke down in the acid.
- A phenolic glycoside breaks down fast when the right enzyme is added.
