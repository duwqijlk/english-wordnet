senseId: 'earth%1:06:00::'
synsetId: 03467679-n
simpleMeaning: A link joining an electrical device to a large body able to carry current, for example
  the planet itself, which is treated as being at zero voltage.
scope: This is the electrical path that ties equipment to a large conducting mass, not soil or loose dirt,
  not the solid surface of the ground, not the world as a place where people live, not the classical element
  of earth, not worldly concerns as opposed to heaven and the afterlife, and not the verb senses meaning
  to hide underground like a hunted animal or to make such a connection.
examples:
- The electrician connected a separate earth from the metal casing to the water pipe.
- A faulty earth in the old wiring made the chassis live.
