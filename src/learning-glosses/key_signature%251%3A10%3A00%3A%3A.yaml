simpleMeaning: After the clef, the sign at the start of written music, come sharp or flat signs that show
  which notes stay sharp or flat through the piece
scope: 'Another name for a signature: the sharp or flat signs after the clef in written music, not the
  signs that mark single notes and not the time signs at the start of a piece.'
examples:
- The key signature of this song has three sharps.
- She looked at the key signature before she began to play.
