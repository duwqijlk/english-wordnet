simpleMeaning: the act of taking people or goods on board a ship, plane, train, or other vehicle
scope: This is the act of taking people or goods on board, not a person you meet for a short time and
  not how fast a vehicle can go.
examples:
- The bus made a pickup of passengers at the small village stop.
- Pickup of goods is at eight in the morning at the dock.
