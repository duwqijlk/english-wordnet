simpleMeaning: Its silvery leaves and tiny white flowers mark this much-branched low bush of Texas and
  northern Mexico, grown by people as a source of rubber.
scope: This low bush of Texas and northern Mexico is grown for its rubber, which is what people take from
  the plant.
examples:
- Guayule grows across Texas and northern Mexico.
- Farmers plant guayule for the rubber it yields.
