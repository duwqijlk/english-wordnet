simpleMeaning: having the right in law to get money or things from a person who has died
scope: This means having the right in law to get something after a death. It is not the act of getting
  it, and it is not getting something while a person is still alive.
examples:
- The inheriting son will get the farm when his father dies.
- She is an inheriting family member, so the house will go to her by law.
