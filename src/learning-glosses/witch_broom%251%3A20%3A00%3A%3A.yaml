simpleMeaning: Fungi, insects, or some other upset inside the plant can make a tree or bush grow a strange
  thick bunch of small shoots
scope: This sense is also called hexenbesen, staghead, or witches' broom, and it names a strange thick
  bunch of small shoots on a tree or bush.
examples:
- A witch broom grew on the tree.
- We saw a witch broom on the bush.
