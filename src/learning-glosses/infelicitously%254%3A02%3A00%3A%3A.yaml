senseId: 'infelicitously%4:02:00::'
synsetId: 00341175-r
simpleMeaning: in a way that is badly chosen or ill-suited to the moment
scope: Saying or doing something in a way that is badly chosen or ill-suited to the moment; not merely
  saying it rudely and not saying something untrue.
examples:
- He chose his words rather infelicitously.
- She spoke infelicitously at the funeral, and guests winced.
