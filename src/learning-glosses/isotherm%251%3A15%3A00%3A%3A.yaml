simpleMeaning: At one time, places that share the same temperature are joined by a line, in meteorology
scope: A line joining places of the same temperature at one time, not a line joining places of the same
  height and not a line joining places of the same air pressure.
examples:
- The isotherm on the map joins the towns that share the same temperature.
- Draw the isotherm for 20 degrees across the chart.
