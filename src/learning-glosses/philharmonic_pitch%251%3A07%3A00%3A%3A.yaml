simpleMeaning: Before a show, players set their instruments by this note, which usually puts the A above
  middle C at 440 Hz.
scope: It is also called concert pitch and international pitch, and it is the note players tune by before
  a show.
examples:
- The orchestra tuned to the philharmonic pitch before the concert.
- They checked the philharmonic pitch before the first piece.
