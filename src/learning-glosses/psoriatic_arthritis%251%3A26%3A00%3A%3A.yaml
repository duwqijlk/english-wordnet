simpleMeaning: a kind of rheumatoid joint disease, often in the fingers and toes, that goes with the skin
  trouble psoriasis
scope: A kind of rheumatoid joint disease, often in the fingers and toes, that goes with the skin trouble
  psoriasis; not joint disease on its own, and not the skin trouble on its own.
examples:
- Psoriatic arthritis made her fingers stiff in the morning.
- His psoriatic arthritis came with red patches on the skin.
