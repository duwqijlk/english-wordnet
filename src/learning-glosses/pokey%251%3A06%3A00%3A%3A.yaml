simpleMeaning: A building run by the government where people accused of a crime are locked up while they
  wait for their trial, or while they serve their sentence.
scope: US slang for a prison, another name for jail (also spelled poky); not the adjective meaning slow,
  or the one meaning small and remote.
examples:
- He did a year in the pokey for theft.
- The pokey was small, but at least it was dry.
