simpleMeaning: A tree of tropical Asia with hard white wood, whose bark was once used as a cure for dysentery
  and for watery bowels.
scope: This is a tree of tropical Asia also called conessi, ivory tree, kurchee, kurchi and Holarrhena
  pubescens, not a tree of cool lands or a tree whose wood is soft.
examples:
- Holarrhena antidysenterica grows in tropical Asia.
- The bark of Holarrhena antidysenterica was once used as a cure for dysentery.
