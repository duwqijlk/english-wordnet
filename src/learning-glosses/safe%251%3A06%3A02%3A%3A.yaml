simpleMeaning: a cupboard with air holes or cooling, used to keep food away from insects and other animals.
scope: Not the strong metal box for money and jewels; this is the cupboard that keeps food fresh and free
  from pests.
examples:
- The milk was kept in the safe to stop the ants getting to it.
- Grandma's old food safe hung on the cool wall of the pantry.
