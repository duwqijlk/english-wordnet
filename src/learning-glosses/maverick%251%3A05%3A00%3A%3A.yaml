simpleMeaning: An animal left to roam with no brand on it, often a stray calf, that goes to the first
  person who brands it.
scope: Of an unbranded range animal, often a stray calf, that belongs to the first person to brand it.
examples:
- The maverick calf wandered the range with no brand on its side.
- Any maverick found on the open range belonged to the first man to brand it.
