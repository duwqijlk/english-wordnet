simpleMeaning: A prize given each year by the Academy of Television Arts and Sciences for the best work
  in television
scope: This is a prize given each year for the best work in television; its nearest rivals are prizes
  for films and prizes for stage plays.
examples:
- She won an Emmy for her work in television.
- The Emmy is given each year for outstanding television.
