simpleMeaning: being the owner of a thing, with the right to give it to someone else
scope: Being the owner of a thing, with the right to give it to someone else, not the thing owned itself
  and not just the fact of holding it.
examples:
- Ownership of the house passed to her daughter.
- The company proved its ownership of the land.
