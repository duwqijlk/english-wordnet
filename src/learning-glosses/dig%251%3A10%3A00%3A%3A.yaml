simpleMeaning: an unkind remark aimed at a person and meant to hurt them
scope: 'Also called shot, slam, and shaft: an unkind remark aimed at a person and meant to hurt them,
  not a quick hard touch with a finger and not the act of taking things from under the ground.'
examples:
- Her dig about his cooking stung him.
- His parting dig was meant to hurt.
