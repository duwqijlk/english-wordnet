simpleMeaning: Often as part of a holy rite of blessing, oil or ointment is put on a person
scope: To put oil or ointment on a person, often in a holy rite of blessing, also called anele, anoint,
  embrocate or oil; not to wash a person and not to bless without oil.
examples:
- The priest will inunct the sick man with oil during the service.
- She was inuncted with ointment as part of the blessing.
