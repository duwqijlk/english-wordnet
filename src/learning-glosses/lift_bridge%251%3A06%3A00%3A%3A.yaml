simpleMeaning: To let boats and ships pass below, or to stop the way across, this road over water can
  go up
scope: 'Another name for a drawbridge: a road over water that can go up, not a fixed road over water and
  not a bridge that swings to one side.'
examples:
- The lift bridge went up to let the tall ship pass.
- Cars waited while the lift bridge was raised.
