simpleMeaning: lenses in frames that grow dark when the sun shines on them
scope: Lenses in frames that grow dark when the sun shines on them; photochromic eyeglasses and photochromic
  eyewear are other names for this sense, not plain dark glasses and not lenses that only shield the eyes
  from glare.
examples:
- Her photochromic glasses grew dark when she walked out into the sun.
- Photochromic glasses let the wearer read in shade and in sun alike.
