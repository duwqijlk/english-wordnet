simpleMeaning: showing that you think a person has done something wrong
scope: Also called accusing and accusative, this describes words or a look that say a person has done
  wrong. It does not prove the person did wrong, and it is not a plain report with no blame.
examples:
- She gave him an accusatory look when she saw the broken cup.
- In an accusatory voice, he asked who had taken his book.
