simpleMeaning: a fruit of rabbitwood, full of oil, with one hard stone inside
scope: 'Also called buffalo nut and oil nut: a fruit of rabbitwood, full of oil, with one hard stone inside,
  not a nut with a thin shell and not a fruit eaten fresh.'
examples:
- The elk nut grows on rabbitwood and is full of oil.
- She cracked an elk nut and found one hard stone inside.
