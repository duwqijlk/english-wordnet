simpleMeaning: Any of several Australian trees that grow on wet soil or on soil left by rivers.
scope: Any of several Australian trees that grow on wet soil or soil left by rivers; not a tree on dry
  land and not any Australian tree.
examples:
- The flooded gum grows best where the soil stays wet.
- Flooded gums line the banks of the river.
