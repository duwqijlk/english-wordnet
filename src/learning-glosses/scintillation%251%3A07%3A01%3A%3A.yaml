senseId: 'scintillation%1:07:01::'
synsetId: 04778367-n
simpleMeaning: Changes in how thick the air is bend starlight unevenly, so stars seem to blink on and
  off.
scope: This is the twinkling of stars in the sky, not the flash of light in a phosphor.
examples:
- The scintillation of the stars was easy to see.
- The scintillation of the stars came and went with changes in the air.
