senseId: 'neoteny%1:09:00::'
synsetId: 06207818-n
simpleMeaning: A trend in how living things change over time to be born sooner, so growth stops early
  and grown animals keep the looks of the young.
scope: A trend for animals to be born sooner and keep young looks as grown animals, not a birth defect
  and not a short childhood.
examples:
- 'The axolotl shows neoteny: it keeps its young gills as a grown animal.'
- Through neoteny, the species keeps the looks of its young into adult life.
