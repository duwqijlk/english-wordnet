senseId: 'futility%1:07:00::'
synsetId: 05158102-n
simpleMeaning: the state of being useless because it brings no useful result
scope: This is the state of being useless because there is no useful result; it is not success and it
  is not a useful act.
examples:
- He felt the futility of arguing further.
- The futility of the search became clear after days with no result.
