senseId: 'benefactive_role%1:10:00::'
synsetId: 06343538-n
simpleMeaning: In grammar, the part played by the person or thing meant to gain from what the verb in
  the sentence describes
scope: In grammar, the part played by the person or thing meant to gain from what the verb in the sentence
  describes, also called beneficiary, not the doer of the act and not the thing acted on.
examples:
- In 'She baked him a cake', 'him' has the benefactive role.
- The benefactive role marks the person meant to gain from the act.
