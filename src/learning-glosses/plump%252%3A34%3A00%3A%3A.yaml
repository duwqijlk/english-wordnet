simpleMeaning: to make a person or animal grow fatter and rounder
scope: The verb for making someone or something fatter and fuller; not the word that describes a person
  who already looks pleasingly fat and round.
examples:
- The farmer plumped up the chickens before selling them.
- Good food will plump out the thin child in a few weeks.
