simpleMeaning: eating food in very large amounts, or wanting food in very large amounts
scope: 'Also called ravenous, wolfish, voracious and rapacious: eating or wanting a lot of food, not wanting
  too much money and not living by hunting other animals.'
examples:
- After the long walk, the ravening children ate three plates of food each.
- His ravening hunger made him eat very fast.
