simpleMeaning: Blue colour in the hands and feet that can come on when the small blood tubes tighten from
  cold or strong feeling.
scope: Also called acrocyanosis; blue colour in the hands and feet that can come on from cold or strong
  feeling, not a bruise from a knock and not blue skin from lack of air at birth.
examples:
- Raynaud's sign showed in her hands after she came in from the cold.
- Strong feeling can bring on Raynaud's sign in the fingers.
