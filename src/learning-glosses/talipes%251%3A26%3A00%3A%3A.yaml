simpleMeaning: From birth, a foot is bent out of shape, usually with the ankle, heel, and toes curled
  or set at a twist.
scope: Also called clubfoot, this is a foot bent out of shape from birth, not one hurt in a fall.
examples:
- The baby was born with talipes, and his foot curled inward.
- Her talipes bent her foot so the toes curled inward.
