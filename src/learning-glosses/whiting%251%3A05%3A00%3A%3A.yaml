  sometimes put in the group Gadus
scope: This is the live fish from the Atlantic waters of Europe, not its flesh sold as food and not a
  North American food fish.
examples:
- The boat caught several whiting in the Atlantic waters off Europe.
- A whiting looks like a small cod.
