simpleMeaning: in a way that has to do with the body's nerve system that works without thought, such as
  making the heart beat faster
scope: About the nerve system that works without thought, not the sense of acting in a kind, caring way.
examples:
- The stimulus acted sympathetically, speeding up her heart.
- The medicine acted sympathetically, making his heart beat faster without him thinking about it.
