senseId: 'disputation%1:10:01::'
synsetId: 07197811-n
simpleMeaning: A sharp speech act, or a quarrel where folk disagree hard.
scope: This sense is also called a tilt, an argument, arguing, controversy, and contention, for a sharp
  speech act, or a quarrel where folk disagree hard, where a tilt is talk folk argue over, or a quarrel
  where folk disagree hard, an argument is an angry talk between folk who disagree hard with each other,
  and arguing is talking in a sharp, angry way when folk hold very different views and disagree hard,
  unlike the sense for the set putting of a claim and the case against it, usually followed by a vote.
examples:
- The disputation was sharp and angry.
- Disputations are quarrels where folk disagree hard.
