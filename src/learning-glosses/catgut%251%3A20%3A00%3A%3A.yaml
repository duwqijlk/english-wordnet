simpleMeaning: A plant that lives for years, a low bush of eastern North America with downy leaves and
  yellowish and rose flowers, the source of rotenone, a poison for insects.
scope: Also called goat's rue or wild sweet pea, a low bush of eastern North America, not the strong cord
  made from sheep gut.
examples:
- Catgut grew along the edge of the wood.
- The catgut bushes were in flower by June.
