simpleMeaning: Any of a set of green colouring matters in living things that make food from sunlight;
  four kinds occur in nature.
scope: 'Also called chlorophyl: one of a set of green colouring matters in living things that make food
  from sunlight, not the green colour of leaves itself.'
examples:
- Chlorophyll is what makes leaves green.
- Without chlorophyll, the plant could not make food from sunlight.
