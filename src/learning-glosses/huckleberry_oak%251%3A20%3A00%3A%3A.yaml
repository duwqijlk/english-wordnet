simpleMeaning: In the south-west of the United States grows a low, wide bush with small nuts; its leaves
  look like those of the fruit bush it is named for.
scope: This is the bush whose leaves look like those of the fruit bush it is named for, a low, wide grower
  of the south-west of the United States with small nuts.
examples:
- The huckleberry oak spread low across the ground.
- We found small acorns under the huckleberry oak.
