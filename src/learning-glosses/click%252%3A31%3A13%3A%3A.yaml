simpleMeaning: to become clear in your mind, or to come into your thoughts or feelings
scope: 'Dawn is another name for this sense: this is when something becomes clear in your mind or comes
  into your thoughts or feelings, not making a sound and not pressing a mouse button.'
examples:
- When he saw her face, it clicked that she was angry.
- It suddenly clicked why the door would not open.
