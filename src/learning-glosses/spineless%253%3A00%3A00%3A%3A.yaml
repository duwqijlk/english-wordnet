simpleMeaning: having no sharp pointed parts that stick out
scope: This sense is about a part of a plant or animal with no sharp points that stick out; it is not
  about having no backbone, and not about lacking courage.
examples:
- The fish has soft, spineless fins with no sharp points.
- These spineless leaves feel smooth when you touch them.
