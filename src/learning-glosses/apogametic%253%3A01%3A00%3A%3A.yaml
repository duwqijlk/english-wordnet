senseId: 'apogametic%3:01:00::'
synsetId: 02644098-a
simpleMeaning: about the growth of an embryo, a young plant or animal, without a male cell joining a female
  cell
scope: 'Also called apogamic and apogamous: about growth without a male cell joining a female cell, not
  growth after such a joining and not growth from a seed made in the usual way.'
examples:
- The apogametic growth of the plant needed no male cell at all.
- In apogametic plants, the young plant grows without a male cell joining a female cell.
