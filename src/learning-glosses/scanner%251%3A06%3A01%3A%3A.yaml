simpleMeaning: a round dish used with radar that turns or swings back and forth to search a wide area
scope: A turning radar dish that searches a wide area, not the radio set that searches for signals and
  not the machine that copies pictures into a computer.
examples:
- The scanner on the ship turned slowly as it searched the sea.
- A scanner swept the sky for planes.
