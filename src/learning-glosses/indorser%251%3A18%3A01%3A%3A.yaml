senseId: 'indorser%1:18:01::'
synsetId: 10077079-n
simpleMeaning: By signing a cheque or a paper of value, this person passes on what they own in it
scope: A person who hands over a cheque or a paper of value by signing it, also called an endorser; not
  a person who simply signs a letter and not the person who first wrote the cheque.
examples:
- As indorser of the cheque, she signed it over to her brother.
- The indorser of the bond passed his interest in it to the bank.
