simpleMeaning: that is an integer (a number with no part after a point, like -2, 0 or 3), or shown by
  one
scope: The math sense about an integer (a number with no part after a point, like -2, 0 or 3). Not the
  noun for a math result, not the sense that means whole and complete, and not the sense that means a
  needed part.
examples:
- The integral values in the table are 2, 5 and 9.
- Only integral answers count here, so 3.5 is not allowed.
