senseId: 'contradance%2:38:00::'
synsetId: 01900288-v
simpleMeaning: to take part in a folk dance where two lines of dancers face each other and move through
  set steps
scope: To take part in a folk dance in two lines facing each other; contra danse and contredanse are other
  names for this sense; not the dance itself as a thing, and not a modern dance.
examples:
- They will contradance at the harvest fair.
- The whole village gathered to contradance on Saturday night.
