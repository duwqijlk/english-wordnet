simpleMeaning: the act of picking or cutting a crop when it is ripe and ready
scope: The act of gathering a ripe crop, not the crop itself and not the time of year when it happens.
examples:
- The harvest began as soon as the corn was ripe.
- They hired extra workers for the harvest this year.
