simpleMeaning: An enzyme, a substance that speeds up a chemical change, that splits sucrose, a sugar,
  into glucose and fructose with the help of water.
scope: An enzyme that splits sucrose into glucose and fructose; saccharase and sucrase are other names
  for this sense, not an enzyme that builds sugars up.
examples:
- Invertase splits sucrose into glucose and fructose.
- The lab used invertase to break down the sugar in the mixture.
