simpleMeaning: With deep green leathery leaves and flowers that turn purplish-green in the end, this dark
  plant is a little hairy and lives year after year.
scope: Also called lenten rose, this dark plant lives year after year, not the evergreen plant with white
  or purplish rose-like winter flowers.
examples:
- Black hellebore leaves stayed deep green through the year.
- We saw black hellebore flowers turn purplish-green.
