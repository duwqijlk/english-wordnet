simpleMeaning: The eye and the parts round it get their blood from this tube, which leaves the inner neck
  tube.
scope: Also called ophthalmic artery, it is the inner neck tube's branch that feeds the eye and the parts
  round it.
examples:
- The arteria ophthalmica carries blood to the eye.
- The arteria ophthalmica runs from the inner neck tube to the eye.
