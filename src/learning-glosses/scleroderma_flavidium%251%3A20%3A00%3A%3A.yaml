senseId: 'scleroderma_flavidium%1:20:00::'
synsetId: 12990430-n
simpleMeaning: An earthball with a smooth top that starts out buried in sand; the top of the fruiting
  body opens into parts like the rays of an umbrella
scope: Also called star earthball; a round earthball that starts buried in sand and opens at the top into
  star-like parts, not the warty earthball with a dark purple centre.
examples:
- Scleroderma flavidium was half buried in the sand at the dune edge.
- The top of Scleroderma flavidium had opened into segments.
