simpleMeaning: The lowest forward gear in a car or other vehicle, used to set it moving from a stop.
scope: This is the lowest gear of a vehicle, not the baseball position and not the first item in a series.
examples:
- Shift into first when you pull away from the curb.
- The truck crawled up the hill in first.
