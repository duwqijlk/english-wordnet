simpleMeaning: a small amount of something that is a little wet, or of a liquid
scope: A small amount of a liquid. It is not the sound of water, and not the act of moving about in water.
examples:
- She added just a splash of milk to her tea.
- He put a splash of lemon juice on the fish.
