simpleMeaning: A cypress tree that grows in the river valleys of the high lands of Mexico.
scope: A cypress tree of the river valleys of the Mexican highlands, also called the Mexican swamp cypress
  and the Montezuma cypress, unlike other cypress trees that grow outside those river valleys.
examples:
- A Taxodium mucronatum shades the river bank in the highlands of Mexico.
- We saw a Taxodium mucronatum growing beside the river in Mexico.
