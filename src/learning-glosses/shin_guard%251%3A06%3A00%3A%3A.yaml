simpleMeaning: For the lower leg, hockey players and a baseball catcher wear this stiff piece of wear
  to keep it safe.
scope: People also call this a shinpad, and players in hockey and baseball wear it on the lower leg.
examples:
- He wore a shin guard on his lower leg.
- The catcher put on a shin guard.
