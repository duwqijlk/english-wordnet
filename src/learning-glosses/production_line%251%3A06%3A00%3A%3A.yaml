simpleMeaning: a machine-run set-up in a factory where a thing moves past work stops, and each stop does
  the next job on it
scope: 'Also called line or assembly line: a factory set-up where a thing moves past stops that each do
  the next job, not work done by one person at one bench and not a line of people waiting.'
examples:
- Cars move along the production line as workers add parts at each stop.
- The new production line can finish a hundred chairs a day.
