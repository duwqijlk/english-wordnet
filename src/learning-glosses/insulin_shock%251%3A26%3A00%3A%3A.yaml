simpleMeaning: low blood sugar caused by too much of the drug that lowers blood sugar, which can bring
  on a deep sleep from which a person cannot wake
scope: Low blood sugar caused by too much of the drug that lowers blood sugar, also called insulin reaction;
  not the planned giving of the drug to bring on fits and not a coma from high blood sugar.
examples:
- An insulin shock left him in a deep sleep.
- She was rushed to hospital after an insulin shock.
