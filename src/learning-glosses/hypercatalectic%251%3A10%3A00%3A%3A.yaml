simpleMeaning: In poetry, a line that goes past the end of its last measured part by one or more syllables.
scope: A line of poetry with extra syllables at its end, not the adjective describing a whole verse that
  has them, and not a line that is simply too long.
examples:
- The last line of the poem was hypercatalectic, with an extra syllable at the end.
- Her hypercatalectic line ran one syllable past the last measured foot.
