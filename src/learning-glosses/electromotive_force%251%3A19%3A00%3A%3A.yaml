senseId: 'electromotive_force%1:19:00::'
synsetId: 11543971-n
simpleMeaning: how fast a source gives out power to make it flow round a path, shown in volts
scope: The speed at which power is drawn from a source, also called voltage and emf; not the flow of power
  itself and not the push of water in a pipe.
examples:
- The electromotive force of the cell was two volts.
- They measured the electromotive force across the battery.
