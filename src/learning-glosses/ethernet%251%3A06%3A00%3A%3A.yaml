simpleMeaning: A cable with one wire inside another carries radio signals between computers at ten million
  bits a second, linking computers that stand close together.
scope: This is a way to link computers close together with a cable, not a way to link computers far apart
  over the world.
examples:
- The two computers were joined by ethernet.
- Our ethernet link lets the computers talk to each other.
