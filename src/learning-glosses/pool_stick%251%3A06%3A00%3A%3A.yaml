simpleMeaning: The white ball is struck with this long, thin rod, which gets narrower toward one end,
  in a game where balls are hit into pockets on a table.
scope: This is one of the table games' striking sticks, also called a cue, a cue stick, or a pool cue.
examples:
- The pool stick sent the white ball into the pocket.
- The white ball rolled away after the pool stick struck it.
