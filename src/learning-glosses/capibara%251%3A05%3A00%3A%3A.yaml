simpleMeaning: The biggest rodent that lives now, a South American animal with no tail that swims and
  has partly webbed feet, about as big as a pig
scope: 'Also called capybara: the biggest rodent alive, not a pig and not a small rodent like a rat.'
examples:
- We watched a capibara swim across the river.
- A capibara stood at the water's edge, as big as a pig.
