senseId: 'dipolar%3:01:00::'
synsetId: 02965519-a
simpleMeaning: For a thing with equal strengths of opposite electric charge, or magnetic poles of opposite
  kind, held a short way apart
scope: A thing with equal and opposite charges or poles a small way apart, not a thing with one charge
  only and not a thing with matching poles.
examples:
- The dipolar molecule has opposite charges at its two ends.
- A dipolar magnet shows a north pole at one end and a south pole at the other.
