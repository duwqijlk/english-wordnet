schema: oewn-learning-gloss-v2
senseId: 'bamboozle%2:32:00::'
synsetId: 00840873-v
simpleMeaning: To win one's end by keeping one's true aims hidden, especially by acting as if one meant
  well, in a show worked out in fine detail.
scope: Also called snow, hoodwink, lead by the nose, play false, or pull the wool over someone's eyes;
  to hide one's true aims, especially by a show of good intentions, so as to gain an end.
examples:
- He bamboozled his professors into thinking he knew the subject well.
- She bamboozled the committee with warm words while pushing her own plan.
