senseId: 'graecophilic%3:01:00::'
synsetId: 03144809-a
simpleMeaning: Said of a person or thing that shows a love of Greece and Grecian things.
scope: Also called philhellene, philhellenic, and Graecophile; said of what shows a love of Greece and
  Grecian things, not of a person who loves Greece.
examples:
- His Graecophilic tastes led him to study Greek art and history.
- The Graecophilic scholar wrote about Greek temples and poems.
