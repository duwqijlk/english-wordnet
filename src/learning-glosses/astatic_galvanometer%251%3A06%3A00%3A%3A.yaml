simpleMeaning: Coils set to cancel the pull of the earth's magnetic field let a measuring device work
  with a moving magnet
scope: This measuring device has a moving magnet and coils set to cancel the pull of the earth's magnetic
  field, not a compass needle that simply turns toward the north.
examples:
- The astatic galvanometer showed no change when the earth's field shifted.
- He set up an astatic galvanometer to watch the magnet move without the earth's pull getting in the way.
