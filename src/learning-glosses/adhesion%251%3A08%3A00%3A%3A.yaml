simpleMeaning: body parts that are usually apart are joined by this tough strip of scar tissue
scope: It is a tough strip of scar tissue that joins body parts that are usually apart, not the sticking
  of two surfaces together.
examples:
- The doctors found an adhesion joining two body parts that are usually apart.
- The adhesion would not let the two body parts move apart.
