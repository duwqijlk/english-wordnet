simpleMeaning: a work outfit of matching parts, a jacket and a skirt or trousers
scope: A work outfit of matching parts, a jacket and a skirt or trousers; lounge suit and two-piece are
  other names for this sense, not a dress and not a three-piece suit with a waistcoat.
examples:
- Her two-piece suit was navy blue.
- He bought a two-piece suit for his new job.
