simpleMeaning: A figure of speech that, after years of use, has become a new plain sense of the words,
  as when ‘he is a snake’ no longer feels like a picture.
scope: Also called a dead metaphor, this figure of speech has become a new plain sense of the words.
examples:
- The frozen metaphor ‘he is a snake’ no longer feels like a picture at all.
- Years of use turned the phrase into a frozen metaphor with a new plain sense.
