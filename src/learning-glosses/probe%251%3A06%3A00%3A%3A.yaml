  in the body
scope: A thin, bendy tool used by doctors to look inside wounds or hollows in the body, not the search
  made with this tool, and not a search for facts about wrongdoing.
examples:
- The doctor used a probe to look inside the wound.
- A probe helped the surgeon find the small cut.
