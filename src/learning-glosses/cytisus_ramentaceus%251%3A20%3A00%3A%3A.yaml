simpleMeaning: An upright shrub with big leaves in threes and thick bunches of yellow flowers, then poisonous
  seeds; it grows in Yugoslavia and is sometimes placed in genus Cytisus.
scope: Also called Dalmatian laburnum or Petteria ramentacea; an upright shrub with big three-part leaves
  and thick bunches of yellow flowers followed by poisonous seeds, kin to other yellow-flowered shrubs.
examples:
- Cytisus ramentaceus grows in Yugoslavia, its yellow flowers in thick bunches.
- The seeds of Cytisus ramentaceus are poisonous, so children must not eat them.
