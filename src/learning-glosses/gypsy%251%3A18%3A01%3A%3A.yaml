simpleMeaning: a person who works with his or her hands and moves from place to place, going where the
  work needs him or her
scope: 'Also called gipsy and itinerant: a worker who moves from place to place for work. This is not
  a person who lives a free travelling life like a Romani.'
examples:
- The gypsy worked on farms in summer and in towns in winter, moving where work was.
- Gypsies on the building team moved to a new town for each new job.
