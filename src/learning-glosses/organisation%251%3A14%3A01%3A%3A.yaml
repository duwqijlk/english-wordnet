simpleMeaning: the people, groups, or parts of a group who together run or look after something
scope: 'Also called organization, brass, administration, establishment, and governance, and another name
  is governing body: the people who together run something, not the work of putting things in place and
  not a neat way of working.'
examples:
- The organisation that runs the hospital has its office on the top floor.
- He became a well-known member of the organisation that runs the school.
