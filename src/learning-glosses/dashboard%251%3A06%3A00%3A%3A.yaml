simpleMeaning: A board in a car or plane with dials and controls that show how it works and let you control
  it.
scope: The board with dials in a car or plane, not the board that keeps off splashing water and mud.
examples:
- The dashboard lights came on as she started the car.
- He watched the dashboard to check his speed.
