simpleMeaning: One of several kinds of sour cherry tree grown for fruit with dark skin and juice
scope: One of several kinds of sour cherry tree grown for dark-skinned fruit, not the fruit itself and
  not a sweet cherry tree.
examples:
- The morello bore dark fruit in June.
- We planted a morello at the end of the garden.
