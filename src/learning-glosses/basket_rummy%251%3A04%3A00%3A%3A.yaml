simpleMeaning: The aim is to make sets of the same rank in a card game with two packs and four jokers,
  where jokers and twos can stand for any card
scope: This sense names a card game with two packs and four jokers, also called meld or canasta, in which
  jokers and twos can stand for any card.
examples:
- We played basket rummy with two packs of cards.
- She won at basket rummy by making sets of cards of the same rank.
