simpleMeaning: A yellow-brown coat marked with dark spots covers this wild cat of Central and South America,
  which is active at night.
scope: Also called panther cat, this is the wild cat of Central and South America, active at night, with
  a yellow-brown coat marked with dark spots.
examples:
- The ocelot moves about at night.
- The ocelot's yellow-brown coat was marked with dark spots.
