simpleMeaning: a show of feeling that is not held back at all
scope: A show of feeling that is not held back, also called an outburst, a gush and a blowup; not liquid
  flowing out, and not a calm, quiet statement.
examples:
- She greeted her old friend with an effusion of joy.
- His effusion of gratitude went on for several minutes.
