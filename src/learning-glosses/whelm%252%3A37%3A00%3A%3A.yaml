senseId: 'whelm%2:37:00::'
synsetId: 01813288-v
simpleMeaning: To leave a person overcome by feeling, or by what they see and hear.
scope: 'Also called overwhelm, overcome, overtake, and overpower: to leave a person overcome by feeling,
  or by what they see and hear, not to meet what was hoped for exactly, neither falling short nor going
  past it.'
examples:
- The news whelmed them with grief.
- They were whelmed by the noise and the lights.
