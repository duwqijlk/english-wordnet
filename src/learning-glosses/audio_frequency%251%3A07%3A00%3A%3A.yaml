simpleMeaning: how fast a sound wave moves back and forth, when the sound is one a person can hear
scope: 'Also called audio: the rate of a sound wave that can be heard, not a loudness level and not a
  radio wave that cannot be heard.'
examples:
- An audio frequency of 1,000 cycles a second sounds like a high whistle.
- The speaker can play an audio frequency as low as 40 cycles a second.
