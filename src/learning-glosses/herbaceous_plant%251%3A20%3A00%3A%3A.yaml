simpleMeaning: Many of these plants flower in gardens or are cooked as food, yet none has a woody stem
  that lasts; some can heal the sick, and some are pests.
scope: Also called herb, this is a plant with no woody stem that lasts, not a tree or shrub.
examples:
- The herbaceous plant in the pot has no woody stem.
- Many herbaceous plants flower in the garden each spring.
