simpleMeaning: a picture in the mind that is like seeing something with the eyes
scope: This sense is a picture in the mind like seeing, not a real picture or chart on paper or on a screen.
examples:
- Her visualization of the beach, with its blue sea and soft sand, helped her relax.
- In his visualization, the new house had a red door and a small garden.
