simpleMeaning: With two flaps that hang down in front and at the back, it is a band worn round the shoulders
  in the Roman Catholic Church.
scope: In the Roman Catholic Church, it is the band worn round the shoulders with two hanging flaps, not
  the layer of nerve cells in the brain and not the shell-making layer in shellfish.
examples:
- The pallium was worn round the shoulders.
- The pallium's two flaps hung down in front and at the back.
