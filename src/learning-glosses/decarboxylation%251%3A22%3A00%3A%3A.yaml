senseId: 'decarboxylation%1:22:00::'
synsetId: 13477540-n
simpleMeaning: The act of taking a carboxyl group, a small part made of carbon, oxygen and hydrogen, off
  a chemical, often putting hydrogen in its place.
scope: This is taking a carboxyl group off a chemical, not adding a carboxyl group or taking a whole part
  off a molecule in general.
examples:
- Decarboxylation takes a carboxyl group off the chemical.
- The reaction uses decarboxylation to put hydrogen in place of the group.
