simpleMeaning: a still stage in the growth of some insects, between the young stage and the stage when
  they change shape
scope: A stage between the young stage and the change stage, not the young stage itself and not the later
  change stage.
examples:
- The prepupal stage lasts only a few days before the insect changes shape.
- During the prepupal stage, the young insect stops moving and rests.
