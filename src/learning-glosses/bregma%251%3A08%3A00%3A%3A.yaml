simpleMeaning: Skull measurers name this spot on top of the head, where the seam that runs front to back
  meets the seam that runs side to side.
scope: The bregma is the spot on top of the head where the seam that runs front to back meets the seam
  that runs side to side.
examples:
- The bregma lies where the two seams of the skull meet.
- The two seams meet at the bregma.
