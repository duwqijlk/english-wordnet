simpleMeaning: letters and marks set round a round part in a typing machine, which turns so each mark
  can strike paper and leave its shape
scope: 'Another name for a daisy print wheel: letters and marks round a round part that turns to strike
  paper, not a flower and not a wheel that moves a car.'
examples:
- The daisy wheel turned and struck the letter A onto the paper.
- She changed the daisy wheel when the print grew faint.
