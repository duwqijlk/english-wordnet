simpleMeaning: used to show a strong feeling, such as anger, loss of all hope, annoyance at being unable
  to do what you want, strong approval, or surprise
scope: This sense shows the speaker's strong feeling, such as anger or surprise; it is not the use before
  a noun to make that noun sound stronger.
examples:
- You are goddamn right, and I am glad you said it.
- I am goddamn tired of waiting for this bus!
