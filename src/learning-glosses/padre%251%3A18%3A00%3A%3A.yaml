simpleMeaning: A word used to speak to priests in some churches, above all the Roman Catholic Church or
  the Orthodox Catholic Church; soldiers often use this word.
scope: Also called Father; a word used to speak to a priest, not the priest's own name.
examples:
- The men called the chaplain Padre.
- Padre, will you hear my confession?
