simpleMeaning: one of a set of blood tubes just under the skin that drain into blood tubes deep inside
  the body
scope: 'Also called a cutaneous vein: a vein just under the skin, not a deep vein and not a vein in the
  skull bones.'
examples:
- The vena cutanea lay just under the skin of her arm.
- Blood from the vena cutanea drains into the deep veins.
