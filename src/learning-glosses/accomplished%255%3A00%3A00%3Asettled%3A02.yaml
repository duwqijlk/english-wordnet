simpleMeaning: set in a firm and complete way, with no conditions at all, so nothing can change it
scope: 'Also called established: this sense is about a fact or thing being fixed and final, not about
  a person who is very good at something, and not about a job that is finished.'
examples:
- That smoking harms health is now an accomplished fact.
- By then, the change was an accomplished fact and no one could undo it.
