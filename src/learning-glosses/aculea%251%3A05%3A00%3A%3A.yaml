simpleMeaning: a small sharp point that grows on the wing of some insects
scope: A small sharp point on an insect's wing, not a sting and not a hair on the insect's body.
examples:
- The aculea on the fly's wing caught the light.
- Under the lens, the aculea looked like tiny thorns on the wings.
