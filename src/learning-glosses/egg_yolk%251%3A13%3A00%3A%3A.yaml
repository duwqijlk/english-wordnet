simpleMeaning: the round yellow part inside a shell, held in the clear white part that goes round it
scope: 'Also called yolk: the round yellow part inside a shell, not the clear white part round it and
  not the shell itself.'
examples:
- She broke the egg yolk when she cracked the egg into the pan.
- The recipe calls for two egg yolks, beaten with sugar.
