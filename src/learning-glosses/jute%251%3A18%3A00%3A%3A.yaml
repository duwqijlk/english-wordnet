simpleMeaning: One of a Germanic people who took England and joined the Angles and Saxons to form the
  Anglo-Saxons.
scope: This is a member of the Germanic people who joined the Angles and Saxons, not an Angle or a Saxon
  alone.
examples:
- The Jute chiefs sailed to England long ago.
- Jute settlers joined the Angles and Saxons in England.
