simpleMeaning: What you get from one group of plants is a small round fruit, and the one people mean most
  often is the small cone of the common kind.
scope: This is the small round fruit of a plant of one group, not the plant itself, and above all the
  small cone of the common kind.
examples:
- I held a juniper berry in my hand.
- A juniper berry fell from the plant.
