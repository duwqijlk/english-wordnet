simpleMeaning: One of the chemical elements in the set that has carbon in it.
scope: A chemical element in the carbon group, like other chemical elements, and carbon group element,
  crystallogen, Group 14 element and tetragen are other names for this sense.
examples:
- Carbon is a tetrel, one of the elements in the carbon group.
- The tetrel carbon turns to gas at very high heat.
