simpleMeaning: Fast handwriting in which whole letters are joined inside words without lifting the writing
  tool from the paper.
scope: Also called cursive and longhand; fast joined-up handwriting, not printed writing and not shorthand.
examples:
- Her cursive script flowed across the page without lifting the pen.
- He learned cursive script at school.
