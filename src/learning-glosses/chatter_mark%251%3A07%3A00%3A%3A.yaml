simpleMeaning: a line or dent left on a piece of work by a tool that shakes as it cuts
scope: A line or dent left on a piece of work by a shaking tool, not a scratch made by hand and not a
  stain on the surface.
examples:
- The lathe left a chatter mark across the metal.
- You can see a chatter mark where the tool shook on the wood.
