simpleMeaning: In botany, the part that grows out from the petals of a daffodil or narcissus flower and
  is shaped like a trumpet or a cup
scope: In botany, this is the trumpet-like or cup-like part of a daffodil or narcissus flower, not the
  ring of light around the sun and not a crown-shaped part of the body.
examples:
- The yellow corona in the middle of the daffodil looks like a tiny trumpet.
- Each narcissus flower has a bright orange corona shaped like a cup.
