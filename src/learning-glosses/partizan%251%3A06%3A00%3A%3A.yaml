simpleMeaning: A long spear of the 1500s and 1600s, with a blade that narrows to a point, is sharp on
  both edges, and has side points.
scope: Also called partisan, this is a long spear of the 1500s and 1600s with a double-edged blade.
examples:
- The guard carried a partizan with a long tapering blade.
- Partizans were common weapons in the 1500s and 1600s.
