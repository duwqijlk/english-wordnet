simpleMeaning: feeling uneasy and shy about yourself, or ashamed, or made to feel that way
scope: This is feeling uneasy and shy or ashamed; embarrassed is another name for this sense; not feeling
  proud, and not feeling calm.
examples:
- He felt abashed when everyone turned to look at him.
- She was abashed by the praise and looked down at her shoes.
