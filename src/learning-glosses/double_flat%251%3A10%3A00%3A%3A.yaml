simpleMeaning: A music sign of two low marks before a note, telling the player to lower it by two half-steps
scope: A music sign of two low marks before a note, telling the player to lower it by two half-steps;
  not a single low mark and not a sharp sign.
examples:
- The double flat lowered the note by two half-steps.
- He wrote a double flat before the B.
