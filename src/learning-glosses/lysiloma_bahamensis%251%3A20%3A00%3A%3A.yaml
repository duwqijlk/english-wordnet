simpleMeaning: A tree of the West Indies, Florida and Mexico, like the tamarind, with long flat pods.
scope: This is a tree of the West Indies, Florida and Mexico, like the tamarind, with long flat pods;
  wild tamarind and Lysiloma latisiliqua are other names for this sense, and it is not the tamarind itself.
examples:
- The Lysiloma bahamensis grew near the shore in Florida, its long flat pods hanging down.
- We rested under a Lysiloma bahamensis in Mexico.
