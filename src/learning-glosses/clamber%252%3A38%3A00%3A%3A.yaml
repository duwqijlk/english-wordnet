simpleMeaning: to climb in a clumsy way, using your hands and feet to pull yourself along
scope: 'Also called skin, struggle, shin, scramble, and sputter: to climb in a clumsy way, not to climb
  up in a smooth, easy way.'
examples:
- The children clambered over the big rocks by the river.
- He clambered up the steep bank, holding on with both hands.
