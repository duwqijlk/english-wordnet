synsetId: 14329902-n
simpleMeaning: A condition in men marked by small testes, long legs, larger breasts, less sperm, and intellectual
  disability; caused by an extra X chromosome (XXY) in the male.
scope: Also called Klinefelter's syndrome and XXY-syndrome; a condition in men only, not a condition of
  women and not a single missing chromosome.
examples:
- Klinefelter syndrome comes from an extra X chromosome in men.
- Boys born with Klinefelter syndrome may grow tall with long legs.
