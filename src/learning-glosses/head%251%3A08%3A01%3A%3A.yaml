simpleMeaning: the round end of a bone that fits into a round hollow in another bone to make a joint
scope: This is not the body part above the neck; it is the rounded end of a bone where it meets another
  bone.
examples:
- The scan showed a small crack in the head of the thigh bone.
- The ball-shaped head of the upper arm bone sits in the shoulder socket.
