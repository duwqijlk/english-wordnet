simpleMeaning: The part of the United States government that guards and makes use of natural resources,
  set up in 1849
scope: Also called Interior, DoI or the Interior Department; the United States government part that guards
  and makes use of natural resources, not any other government office.
examples:
- The Department of the Interior manages the national parks.
- The Department of the Interior was set up in 1849.
