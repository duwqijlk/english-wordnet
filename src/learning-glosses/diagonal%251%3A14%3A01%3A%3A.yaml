simpleMeaning: In maths, the entries in a square table that run from one corner to the opposite corner,
  top left to bottom right or top right to bottom left
scope: In maths, the entries that run from one corner of a square table to the other, not a line joining
  two corners of a flat shape and not a cut across cloth.
examples:
- The diagonal of the matrix holds the numbers 1, 2 and 3.
- Add up the diagonal to check the total.
