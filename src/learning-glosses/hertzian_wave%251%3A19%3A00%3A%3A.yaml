simpleMeaning: An old name for a radio signal, an electric-magnetic signal of radio frequency made by
  current swinging back and forth in an electric circuit.
scope: This is an old name for a radio signal made in an electric circuit, not a sound signal or a light
  signal.
examples:
- Hertzian waves carry radio signals through the air.
- The book calls a radio wave a Hertzian wave.
