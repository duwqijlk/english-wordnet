simpleMeaning: A long-lived herb of Europe and Asia, with white flowers that give off a gas in hot weather
  that can catch fire.
scope: This plant is also called dittany, fraxinella, and gas plant, and it is not the bush of the Old
  Testament that burned without being consumed.
examples:
- The burning bush gave off a gas in the hot weather.
- In hot weather the burning bush can give off a gas that catches fire.
