simpleMeaning: a tree-dwelling mammal of Southeast Asia and the Philippines, active at night, lemur-like,
  gliding long distances using a skin fold from neck to tail.
scope: Another name for the colugo and the flying cat; it is a gliding mammal, not a true lemur.
examples:
- The flying lemur is not really a lemur; it glides using a skin fold.
- At dusk, a flying lemur launched itself from a tall tree.
