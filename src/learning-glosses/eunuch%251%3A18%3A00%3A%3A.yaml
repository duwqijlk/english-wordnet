simpleMeaning: a man who has been castrated (had his testicles cut off) and so cannot have children
scope: This sense is the man himself, made unable to have children in this way; it is not a man who simply
  has no children.
examples:
- Eunuchs guarded the harem in the old palace.
- The king trusted one eunuch to guard the women's rooms.
