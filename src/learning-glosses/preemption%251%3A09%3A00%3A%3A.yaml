simpleMeaning: The rule in law that says when the central government and a state both make laws on the
  same matter, the central government's law wins.
scope: Also called pre-emption; the judicial principle that federal law stands above state law on the
  same subject.
examples:
- Preemption meant the state law could not stand against the federal rule.
- The court relied on preemption to strike down the state ban.
