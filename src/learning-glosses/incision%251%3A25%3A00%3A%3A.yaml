simpleMeaning: a low place in a surface made by scratching or cutting into it
scope: 'Also called scratch, prick, dent and slit: a low place cut or scratched into a surface, not the
  act of cutting into the body in an operation.'
examples:
- The old table had a deep incision scratched across its surface.
- He found an incision cut into the stone.
