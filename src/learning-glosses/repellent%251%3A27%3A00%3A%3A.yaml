simpleMeaning: a substance made with chemicals that keeps animals away
scope: 'Also called repellant: this is the substance used against animals and insects, not the substance
  put on cloth to keep water out and not the word for something very unpleasant.'
examples:
- She put insect repellent on her arms before walking in the woods.
- This repellent keeps mosquitoes away from the tent.
