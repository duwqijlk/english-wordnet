simpleMeaning: One whose inner sex organs are of one sex and whose outer sex marks are of the other sex.
scope: Also called pseudohermaphroditic, this word is used of a living thing whose inner and outer sex
  marks do not match.
examples:
- The pseudohermaphrodite animal had male organs inside and female marks outside.
- The animal was described as pseudohermaphrodite.
