simpleMeaning: a thing said or written that is clever, well put, or odd in a way that makes people laugh
scope: Another name for wit; also called humour. It is words said or written to make people laugh, not
  a person's mood or state of feeling, and not the skill of seeing what is funny.
examples:
- I liked the quiet humor in his speech; it made the whole room laugh.
- The humor of the joke lies in its surprising last line.
