simpleMeaning: the ability to feel or notice things that start inside the body
scope: This is feeling things that come from inside the body, not seeing, hearing or touching things outside
  the body.
examples:
- Interoception helps you notice when your heart beats fast.
- With good interoception, she could feel that she was hungry.
