simpleMeaning: having to do with plants that take water from other plants yet also make their own food
scope: It concerns plants that live partly on other plants, not plants that take all their food from others
  and not plants that live on their own.
examples:
- Semiparasitic plants draw water from their hosts.
- Mistletoe is a semiparasitic plant.
