simpleMeaning: One side takes another side to court over a wrong done, to guard a right, or to stop a
  wrong
scope: 'Another name for action and action at law: one side takes another to court over a wrong done,
  to guard a right, or to stop a wrong, not a friendly talk to settle a row.'
examples:
- She took legal action against the firm after they broke the deal.
- They warned him they would start legal action if he did not pay.
