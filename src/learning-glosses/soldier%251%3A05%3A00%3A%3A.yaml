simpleMeaning: A wingless, sterile member of an ant or termite colony with a big head and strong jaws,
  which it uses to defend the nest.
scope: This is the defensive caste of an ant or termite colony, not a person who serves in an army.
examples:
- The soldiers of the termite colony blocked the tunnel entrance.
- Soldiers with huge jaws defended the nest from intruders.
