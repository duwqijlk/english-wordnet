simpleMeaning: with eyes that face forward in a large head, a beak like a hawk's, and claws, this bird
  of prey hunts after dark
scope: Also called an owl or a hooter, this bird of prey hunts after dark, not by day.
examples:
- We heard the bird of night call in the dark.
- A bird of night swooped down on a mouse in the dark.
