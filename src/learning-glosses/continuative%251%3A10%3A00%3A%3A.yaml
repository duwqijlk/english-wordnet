simpleMeaning: A word with no change in form that joins words, word groups, clauses, or sentences
scope: A word with no change in form that joins words and sentences, also called conjunction, connective,
  and conjunctive, not a word that names a thing and not a word that changes form.
examples:
- The continuative 'and' links the two clauses.
- A continuative joins words without changing its own form.
