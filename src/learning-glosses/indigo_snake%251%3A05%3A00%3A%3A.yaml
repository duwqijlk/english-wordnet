simpleMeaning: A big, dark blue, harmless reptile that moves into holes in the ground, found in the south
  of North America and Mexico.
scope: A big dark blue harmless reptile that moves into holes, also called a gopher snake; not a venomous
  snake and not a small garden snake.
examples:
- The indigo snake slipped into a burrow to hide.
- An indigo snake crossed the path in southern Texas.
