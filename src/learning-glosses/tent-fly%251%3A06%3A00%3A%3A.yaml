simpleMeaning: A flap made of a piece of strong cloth that can be pulled back to make a way into a shelter
scope: A flap of strong cloth that can be pulled back to make a way into a shelter, also called a fly,
  a fly sheet, a rainfly, and a tent flap; not the roof of the shelter and not a door of wood.
examples:
- She pulled back the tent-fly to step inside.
- The tent-fly was tied open to let in the air.
