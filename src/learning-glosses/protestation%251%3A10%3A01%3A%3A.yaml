simpleMeaning: a formal and serious statement that you do not agree with something
scope: 'Also called protest: this is a formal and serious statement of not agreeing, not just a strong
  statement of disagreement in any setting.'
examples:
- He made a formal protestation against the decision in a letter to the court.
- Their protestations were serious and written, but the plan still went ahead.
