simpleMeaning: Any of many pale-colored flying insects with three pairs of full-grown legs.
scope: This is any of many pale-colored butterflies with three pairs of full-grown legs; pierid is another
  name for this sense, not a moth and not a butterfly with weak or missing legs.
examples:
- The pierid butterfly sat on a leaf in the sun.
- Pierid butterflies are pale with strong legs.
