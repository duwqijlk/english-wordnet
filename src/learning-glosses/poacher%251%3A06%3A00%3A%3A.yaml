simpleMeaning: a cooking pan used to cook food such as fish or eggs in hot water
scope: This is a cooking pan, not a person who hunts or fishes without the right to do so and not a small
  fish with hard plates on its body.
examples:
- She put the eggs into the poacher and set it over hot water.
- The poacher has small cups for cooking fish or eggs.
