simpleMeaning: a list of dates in the Christian year showing when fasts and feasts fall
scope: A list of Christian feast and fast dates, also called church calendar; not a plain list of months
  and not a book of church rules.
examples:
- The ecclesiastical calendar marks Easter and Lent.
- She checked the ecclesiastical calendar for the date of the feast.
