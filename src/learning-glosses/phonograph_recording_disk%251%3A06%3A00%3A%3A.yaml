scope: 'Also called an acetate disk: a round flat thing covered with a clear stuff made from plant fibre,
  not a record made for playing and not a compact disc.'
examples:
- The phonograph recording disk was coated with a thin layer of acetate.
- She placed the phonograph recording disk on the turntable to cut a new record.
