simpleMeaning: Plants with thick stems and sharp spines, with flat parts and oval fruit that can be eaten
  in some kinds, often fed to farm animals
scope: These are plants with thick stems and sharp spines, with flat parts and oval fruit that can be
  eaten in some kinds, often fed to farm animals; prickly pear cactus is another name for them, not the
  round fruit itself.
examples:
- The prickly pear bore oval fruit.
- Farmers feed prickly pear to their stock.
