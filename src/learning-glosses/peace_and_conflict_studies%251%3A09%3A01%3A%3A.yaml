simpleMeaning: A social science field identifying and examining violent and nonviolent behaviour and the
  structural mechanisms involved in conflicts, including social ones, to understand processes leading
  to better conditions for people.
scope: This names the academic field itself, not a particular peace agreement or a single method of settling
  a dispute.
examples:
- She is taking a degree in peace and conflict studies.
- Peace and conflict studies examines both violent and nonviolent behaviour in conflicts.
