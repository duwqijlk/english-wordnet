simpleMeaning: A widespread herb of the tropics and subtropics, grown for feed and used as a soothing
  medicine, with fine soft fibres stronger than jute; at times a fast-spreading weed.
scope: A herb of warm lands, also called jellyleaf and Queensland hemp; not jute and not other fibre plants
  grown for rope.
examples:
- Sida rhombifolia spreads fast in warm, wet fields.
- Farmers grow Sida rhombifolia for feed and medicine.
