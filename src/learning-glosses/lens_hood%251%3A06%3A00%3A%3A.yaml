simpleMeaning: A tube that fits on a camera and stops extra light from getting into the glass
scope: 'Also called a hood: a tube fixed to a camera to keep extra light out, not a cap that covers the
  lens and not a case that holds the camera.'
examples:
- He put the lens hood on the camera before the shoot.
- The lens hood kept the bright sun out of the shot.
