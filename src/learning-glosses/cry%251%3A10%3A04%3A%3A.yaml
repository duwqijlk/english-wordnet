simpleMeaning: A loud sound that expresses strong feeling, especially one without words.
scope: A wordless or almost wordless outburst of feeling such as rage or pain, not a loud protest or public
  call and not the act of weeping.
examples:
- With a cry of rage, he swept the papers off the desk.
- A cry of pain came from the room next door.
