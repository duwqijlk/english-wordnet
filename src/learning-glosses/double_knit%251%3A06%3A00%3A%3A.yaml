simpleMeaning: Made with two sets of needles, this cloth like jersey comes in two layers, joined by stitches
  that lock together.
scope: It is a cloth like jersey in two layers joined by locking stitches, and not a single-layer cloth
  or a woven one.
examples:
- She sewed the dress from double knit.
- He wore a double knit jacket.
