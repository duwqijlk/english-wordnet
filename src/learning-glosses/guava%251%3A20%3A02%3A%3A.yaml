simpleMeaning: a small tree that grows in hot places and is like a bush in shape, and gives small yellowish
  fruit
scope: The small hot-country tree itself, not its fruit that people eat, and not the kind described as
  American and widely grown for its sweet round yellow fruit.
examples:
- A small guava grew behind the house in the hot garden.
- They planted a guava near the fence, and it soon gave small yellow fruit.
