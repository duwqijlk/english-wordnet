simpleMeaning: a bright quality of spirit that lifts the mood and drives gloom away
scope: The quality of good spirits in a person or place (also called cheerfulness, sunshine or sunniness),
  not a shout of praise and not the act of becoming happier.
examples:
- The children's laughter brought cheer to the gloomy house.
- There was a note of cheer in her voice.
