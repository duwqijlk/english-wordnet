simpleMeaning: a plan given to a person in a deep sleep-like state for a thing to do after waking, usually
  when a set sign is given
scope: A plan given during a deep sleep-like state for a thing to do after waking, not a plan made while
  awake and not a dream or a wish.
examples:
- The posthypnotic suggestion told him to open the window when he heard the bell.
- After she woke up, she followed the posthypnotic suggestion and stood up when the music played.
