simpleMeaning: Animal feed cut while still green and kept soft and fresh by half-fermenting it, as in
  a tall store tower
scope: This is animal feed cut while still green and kept soft and fresh by half-fermenting it, as in
  a tall store tower; silage is another name for it, not dry hay and not fresh grass.
examples:
- Farmers stored ensilage in the tall tower.
- The ensilage stayed soft and fresh through the winter.
