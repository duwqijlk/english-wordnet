simpleMeaning: a person who has broken the law or been found guilty by a court
scope: Also called criminal, this is a person who breaks the law, not a bend in a road or path.
examples:
- The police caught the crook who had stolen the jewels from the shop.
- A crook who breaks into homes was sent to prison by the court.
