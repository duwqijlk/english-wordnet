simpleMeaning: In law, a talk before a trial where the sides meet to plan what facts to share and what
  points to try, more useful in civil cases than criminal ones
scope: Also called pretrial, this is a talk before a trial to plan what facts to share and what points
  to try, not the trial itself.
examples:
- The judge set a pretrial conference to plan what facts each side would share.
- At the pretrial conference, the two sides agreed on the points that would be tried.
