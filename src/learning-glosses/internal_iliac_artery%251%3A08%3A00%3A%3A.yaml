simpleMeaning: Splitting into smaller tubes that carry blood to the hip and buttock areas, this inner
  branch of the main blood tube runs on either side of the lower belly.
scope: This inner branch of the main blood tube is also called the hypogastric artery, and it is not the
  outer branch of the same blood tube.
examples:
- The internal iliac artery supplies blood to the pelvis.
- The internal iliac artery carries blood to the hip area.
