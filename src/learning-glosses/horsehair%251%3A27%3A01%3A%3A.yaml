simpleMeaning: the hair on a horse's neck or tail, taken off the horse
scope: Hair from a horse's mane or tail; not cloth made from such hair, which is another sense of horsehair.
examples:
- The bow was strung with horsehair.
- They stuffed the chair with horsehair.
