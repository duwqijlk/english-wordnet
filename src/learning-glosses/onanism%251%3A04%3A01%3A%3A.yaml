simpleMeaning: A way of stopping a pregnancy in which the man starts the sex act but pulls out before
  the seed is spent.
scope: Also called withdrawal, coitus interruptus, pulling out, and withdrawal method; a birth-control
  way of pulling out before the seed is spent, not rubbing the sex organs by hand for pleasure.
examples:
- The couple used onanism as their only birth control.
- Onanism needs the man to pull out in time, every time.
