simpleMeaning: a quiet feeling or hidden meaning that sits under what someone says
scope: A quiet feeling or hidden meaning behind spoken words, not a quiet tone of voice.
examples:
- There was an undertone of anger in her polite reply.
- His undertone of doubt made me ask what he really meant.
