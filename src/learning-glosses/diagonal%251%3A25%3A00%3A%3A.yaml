simpleMeaning: a line or cut across cloth that runs at a slant, not straight across
scope: 'Also called bias: a slanting line or cut across cloth, not a straight cut and not a line across
  a flat shape.'
examples:
- She cut the cloth on a diagonal so it would hang better.
- The seam runs on the diagonal of the fabric.
