simpleMeaning: A science tool that speeds up tiny charged bits of matter so they move with great energy
scope: 'Also called an atom smasher or an accelerator: a science tool that gives tiny charged bits of
  matter great speed, not a tool for making power and not a microscope.'
examples:
- The new particle accelerator can push protons close to the speed of light.
- Scientists use the particle accelerator to smash atoms and study the pieces.
