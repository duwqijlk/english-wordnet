simpleMeaning: Fixing dyes, keeping wood from rotting, and laying metal on things with an electric current
  are the jobs of this powder with no colour that melts in water.
scope: White vitriol, zinc sulphate, and zinc vitriol are other names for this powder, used to fix dyes,
  to keep wood from rotting, or to lay metal on things with an electric current.
examples:
- The dyer mixed zinc sulfate into the bath to fix the colour.
- The fence posts were dipped in zinc sulfate to keep them from rotting.
