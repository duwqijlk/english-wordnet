simpleMeaning: This infection comes from germs, above all the germ called Candida albicans, one of two
  groups of germs that cause it.
scope: Also called candidiasis and monilia disease, this infection is caused by germs of one of two groups,
  above all Candida albicans.
examples:
- The moniliasis was caused by the germ called Candida albicans.
- One of two groups of germs can cause moniliasis.
