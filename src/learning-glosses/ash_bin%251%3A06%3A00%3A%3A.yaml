simpleMeaning: a container where waste is kept until it is picked up and taken away
scope: 'Also called ash-bin, ashbin, ashcan, dustbin and garbage can: a container for waste waiting to
  be picked up, not a bag of waste and not a place where waste is burned.'
examples:
- He wheeled the ash bin out to the road on Monday morning.
- The ash bin by the back door was full of old paper.
