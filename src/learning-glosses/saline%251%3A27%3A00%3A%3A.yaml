simpleMeaning: a liquid made by mixing salt (sodium chloride, the salt used in food) in pure water, with
  the same salt strength as body fluids
scope: This liquid is salt mixed in pure water at body strength. It is not sea water, which is stronger
  and not made clean in this way.
examples:
- The nurse put saline into his arm through a thin tube.
- She cleaned the cut with saline from a small bottle.
