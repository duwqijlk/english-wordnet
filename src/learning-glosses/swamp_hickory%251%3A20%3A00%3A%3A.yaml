simpleMeaning: A nut tree of the east of the United States, with leaves of seven or nine small leaves,
  and thin-shelled nuts that taste very bitter.
scope: A nut tree of the east of the United States, with leaves of seven or nine small leaves and thin-shelled
  nuts that taste very bitter; also called bitter hickory, bitter pignut, bitternut and bitternut hickory;
  not a nut tree with sweet nuts and not a tree of the west.
examples:
- The swamp hickory drops thin-shelled nuts that taste very bitter.
- Swamp hickories grow in the wet woods of the east.
