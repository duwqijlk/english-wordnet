simpleMeaning: a light that exists in thought, moving along the sky's middle line at one steady speed
  and taking the time of the real one, which moves at changing speeds
scope: This light exists only in thought, and it is not the real light in the sky.
examples:
- The mean sun keeps a steady speed all year round.
- Unlike the real sun, the mean sun never speeds up or slows down.
