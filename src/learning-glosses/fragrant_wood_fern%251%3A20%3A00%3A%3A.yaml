simpleMeaning: A leafy plant of northern Eurasia and North America with sweet-smelling leaves.
scope: A sweet-smelling leafy plant of the far north; fragrant cliff fern and fragrant shield fern are
  other names for this sense, not a sweet-smelling flower and not a leafy plant of the warm south.
examples:
- The fragrant wood fern grew on the cool north slope.
- We found a fragrant wood fern with sweet-smelling leaves by the path.
