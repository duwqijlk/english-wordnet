synsetId: 13563001-n
simpleMeaning: 'In psychiatry, a way the mind guards itself: you put your own feelings and ways of acting
  onto someone else, as if they were theirs'
scope: In psychiatry, a way of putting your own feelings onto someone else, not a guess about the future
  and not a film picture thrown onto a screen.
examples:
- His projection made him accuse her of the anger he felt himself.
- The therapist said her projection was hiding her own fear.
