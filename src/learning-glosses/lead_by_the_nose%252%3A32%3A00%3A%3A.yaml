simpleMeaning: to hide what you really want from someone, above all while putting on a big show of meaning
  well, so you can get what you want
scope: To hide what you really want from someone while pretending to mean well, also called snow, hoodwink,
  bamboozle, play false or pull the wool over someone's eyes, not to guide someone openly and not to trick
  someone with a lie told straight out.
examples:
- She led the committee by the nose, pretending to agree while pushing her own plan.
- They were led by the nose into backing a deal that only helped him.
