simpleMeaning: An edible sea snail from warm seas, one of the Strombus group, with a brightly coloured
  spiral shell whose outer edge, or lip, is wide.
scope: The living sea snail, not its spiral shell and not another kind of sea snail.
examples:
- We ate grilled conch at a seaside restaurant.
- The conch lives inside a brightly coloured spiral shell.
