simpleMeaning: Any of the paired threads in body cells that carry what is passed on, but not the ones
  that fix sex, and they sit singly in seed cells
scope: Any of the paired threads in body cells that carry what is passed on, but not the ones that fix
  sex, and they sit singly in seed cells; also called autosome; not a sex thread, and not a thread found
  only in seed cells.
examples:
- Each somatic chromosome comes in a pair in body cells.
- A somatic chromosome carries genes for eye colour.
