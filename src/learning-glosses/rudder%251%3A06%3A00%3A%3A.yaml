simpleMeaning: In ships and boats, a flat up-and-down piece at the back that turns from side to side to
  steer
scope: A steering piece at the back of a ship or boat, not the steering piece at the tail of a plane.
examples:
- The sailor turned the rudder to steer the boat to the left.
- A broken rudder left the ship unable to change direction.
