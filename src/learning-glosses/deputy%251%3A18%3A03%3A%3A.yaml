simpleMeaning: A member of the lower house of a law-making body, such as the one in France.
scope: A member of the lower house of a law-making body, not a stand-in for a sheriff, and not any person
  who acts for others.
examples:
- The deputy spoke for his town in the assembly.
- Deputies in France meet in Paris to make laws.
