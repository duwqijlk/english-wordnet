simpleMeaning: A legal session, usually in a court, in which evidence is presented so that a question
  of fact can be settled and a ruling made on that evidence.
scope: This is a legal proceeding where evidence settles a question of fact, not 'the ability to hear,'
  not 'the act of listening attentively,' not 'the distance over which a voice carries,' not 'a chance
  to state your case,' not 'a committee or jury session that takes testimony,' and not the adjective 'able
  to perceive sound.'
examples:
- The judge scheduled a hearing to decide whether the search was lawful.
- At the hearing, the defense called two witnesses before the court ruled.
