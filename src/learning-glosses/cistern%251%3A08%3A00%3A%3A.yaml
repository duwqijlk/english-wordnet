senseId: 'cistern%1:08:00::'
synsetId: 05524362-n
simpleMeaning: a bag or empty space inside the body that holds fluid, especially lymph (a clear body fluid)
  or the fluid around the brain and spine
scope: 'This sense is also called cisterna: a space inside the body that holds fluid; it is not the underground
  tank for rainwater and not the tank for a toilet.'
examples:
- Fluid collects in a cistern inside the body.
- The doctor pointed to a cistern that holds fluid near the brain.
