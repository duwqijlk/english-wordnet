simpleMeaning: a whisk fern of warm lands everywhere, growing on other plants or on the ground, with usually
  dull yellow branches and tiny leaves, found in America, Japan, and Australia
scope: A whisk fern of warm lands, not a tree fern and not a ground fern.
examples:
- The skeleton fork fern grows on the trunk of a rainforest tree.
- In the glasshouse, a skeleton fork fern hangs from a branch, its dull yellow stems easy to see.
