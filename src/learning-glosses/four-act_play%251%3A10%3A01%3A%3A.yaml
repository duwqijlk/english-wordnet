simpleMeaning: a way of building a stage work in four parts, found in stage works of the early 1900s,
  such as those of Anton Chekhov and Henrik Ibsen
scope: This is a stage work built in four parts, as in early twentieth-century drama; not a one-part play
  or a three-part play.
examples:
- The four-act play ran for nearly three hours.
- Chekhov wrote a famous four-act play about a cherry orchard.
