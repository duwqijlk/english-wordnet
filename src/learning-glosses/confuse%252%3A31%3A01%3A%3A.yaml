simpleMeaning: to take away sharpness or clarity from something
scope: Making an image, idea or account unclear; blur, obscure and obnubilate are other names for this
  same sense, not puzzling a person and not mistaking one thing for another.
examples:
- The new evidence confused the issue rather than settling it.
- The overlapping lines confused the shape until it was hard to tell what it was.
