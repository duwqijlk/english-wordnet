simpleMeaning: A big tree grown to look at, with lovely branches that spread out bit by bit, common in
  the east of North America
scope: A big tree grown to look at, with lovely branches that spread out bit by bit; rock elm and water
  elm are other names for this sense, and it is not a small hedge tree or a pine.
examples:
- The white elm in the park spreads its branches over the path.
- We planted a white elm beside the house for shade.
