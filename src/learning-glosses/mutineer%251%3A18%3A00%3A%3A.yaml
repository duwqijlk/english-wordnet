simpleMeaning: a person who openly fights against and will not obey those in power, especially sailors
  or soldiers
scope: A person, especially a sailor or soldier, who will not obey those in charge and fights against
  them, not a worker who stops work or a person who protests in peace.
examples:
- The mutineers took control of the ship and locked up its captain.
- The army punished the mutineer for refusing to obey his officers.
