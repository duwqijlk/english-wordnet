simpleMeaning: A tiny grey woolly tufted plant living one year, with small golden-yellow flower heads,
  found from southeastern California through northwestern Arizona to southwestern Utah and sometimes put
  in genus Eriophyllum.
scope: This is the tiny grey woolly desert plant with golden-yellow flower heads; it is not the common
  white lawn daisy, and not a shrub or tree.
examples:
- A patch of dwarf daisy covered the rocky slope in gold.
- The dwarf daisy opens its small golden heads in late spring.
