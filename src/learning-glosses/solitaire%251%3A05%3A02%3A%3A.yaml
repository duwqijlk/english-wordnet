simpleMeaning: a bird that no longer lives, could not fly, and was related to the dodo
scope: This is the bird that died out and could not fly, not the dull grey North American bird known for
  its beautiful song.
examples:
- The solitaire died out long ago, after people came to its island home.
- Like the dodo, the solitaire was a bird that could not fly.
