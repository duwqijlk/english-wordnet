simpleMeaning: in a way that follows the rules of numbers, amounts, shapes and patterns
scope: This means in a way that follows the rules of numbers, amounts, shapes and patterns, not in a way
  tied to words or to everyday life in general.
examples:
- It is mathematically impossible to split ten into three equal whole parts.
- Mathematically, the two sides of this sum must come to the same amount.
