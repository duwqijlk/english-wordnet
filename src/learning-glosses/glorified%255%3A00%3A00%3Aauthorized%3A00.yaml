simpleMeaning: treated as holy and not to be questioned, or as having authority that others must accept
scope: 'Also called canonized: treated as holy and not to be questioned, or as having authority that others
  must accept. Not just praised in a warm or kind way.'
examples:
- The founder's old rules became glorified, and no teacher felt free to change them.
- The ancient text was glorified, and people took it as the final word on right and wrong.
