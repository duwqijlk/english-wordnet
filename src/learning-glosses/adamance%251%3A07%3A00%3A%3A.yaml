simpleMeaning: a firm will that will not bend or give way
scope: A firm will that will not bend or give way, also called obduracy; not mere stubbornness over small
  things and not strength of body.
examples:
- Her adamance kept her working until the job was done.
- His adamance made him refuse every offer to change his mind.
