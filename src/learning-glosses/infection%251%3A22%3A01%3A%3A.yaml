simpleMeaning: In phonetics, a change in a speech sound because a sound close to it has an effect on it
scope: In phonetics, a change in a speech sound caused by a sound near it, not a disease passing to someone
  and not illness in the body.
examples:
- In this way of speaking, infection changed the vowel sound before a nasal sound.
- The teacher used infection to explain why the speech sound changed next to its neighbor.
