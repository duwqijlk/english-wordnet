simpleMeaning: In physics, staying as it is, in balance, until a push strong enough to move it sends it
  to a steadier state
scope: In physics, staying as it is, in balance, until a strong enough push moves it to a steadier state;
  not fully stable, and not falling apart at once.
examples:
- The system was metastable, staying in balance until a small push moved it.
- A metastable state holds until a push sends it to a steadier state.
