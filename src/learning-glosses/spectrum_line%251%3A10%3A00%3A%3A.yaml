simpleMeaning: One separate band of light or rays, made by waves that all move at the same rate
scope: One separate band of light or rays made by waves that all move at the same rate, not a broad wash
  of light and not a band made by mixed waves.
examples:
- The spectrum line on the chart marks one band made by waves at one rate.
- A spectrum line shows a single part of the light split up.
