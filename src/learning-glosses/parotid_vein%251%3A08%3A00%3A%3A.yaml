simpleMeaning: vessels that branch off the blood vessel of the face and drain part of the gland near the
  ear that makes saliva, then join the vessel behind the lower jaw
scope: Small vessels that branch off the blood vessel of the face and drain the gland near the ear, not
  the blood vessel of the face itself and not the vessel behind the lower jaw.
examples:
- The parotid vein drains part of the gland near the ear.
- A parotid vein runs from the face's main vessel toward the jaw.
