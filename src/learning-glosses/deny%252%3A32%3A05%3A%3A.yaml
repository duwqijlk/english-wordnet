simpleMeaning: in a court case, to say no in a set way to a claim made by the other side
scope: In a court case, to say no in a set way to the other side's claim, not to say a thing is not true
  in plain talk and not to hold back a pleasure from yourself.
examples:
- The firm will deny the claim in court.
- In the suit, she must deny the charge made by the other side.
