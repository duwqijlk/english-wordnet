simpleMeaning: of a meal in a restaurant where you can choose any dish you like, and each dish has its
  own price
scope: This is a way of ordering a meal dish by dish, each with its own price; not a set meal with one
  price for the whole meal.
examples:
- We ordered a la carte and paid for each dish on its own.
- The a la carte menu lets you pick just the dishes you want.
