simpleMeaning: Three-sided, or like a capital delta, with a point at the top.
scope: Three-sided, or like a capital delta, with a point at the top; not a big three-sided muscle covering
  the shoulder joint, serving to lift and bend and stretch and turn the arm.
examples:
- Their leaf was deltoid at dawn.
- The shape was deltoid by nature.
