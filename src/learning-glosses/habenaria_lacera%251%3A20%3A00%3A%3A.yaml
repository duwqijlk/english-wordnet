simpleMeaning: A fringed orchid of the east of the United States with a greenish flower whose lip is cut
  deeply.
scope: Also called a green fringed orchis, a ragged-fringed orchid, a ragged orchid, or a ragged orchis;
  this fringed orchid of the eastern United States is known by its greenish flower with a deeply cut lip.
examples:
- Habenaria lacera is a fringed orchid of the east of the United States.
- The Habenaria lacera flower is greenish, with a lip cut deeply.
