schema: oewn-learning-gloss-v2
senseId: 'stemma%1:25:00::'
synsetId: 13935555-n
simpleMeaning: a branching drawing that maps the history of how copies of a written work were passed on
  from one to the next
scope: This is a branching drawing of how copies of a work were passed on, not a family tree of people
  and not a plain list of copies.
examples:
- The stemma showed which copies came from the same lost original.
- She drew a stemma to trace how the old text had spread.
