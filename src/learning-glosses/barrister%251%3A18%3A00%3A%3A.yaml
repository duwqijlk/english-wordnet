simpleMeaning: A lawyer in Britain or Canada who speaks in the higher courts for one side in a case, for
  the person charged or against that person
scope: This is a British or Canadian lawyer who speaks in the higher courts for one side in a case. It
  is not a lawyer who only gives advice and does papers, and not a judge.
examples:
- The barrister stood up and spoke to the judge for the defence.
- She hired a barrister to speak for her in the high court.
