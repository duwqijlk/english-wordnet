simpleMeaning: A strip that goes round the neck, usually folded back on itself.
scope: Also called a collar, a strip that goes round the neck, usually folded back on itself; not a necklace
  that fits tightly round a woman's neck.
examples:
- The shirt's neckband was frayed at the edge.
- She ironed the neckband flat before folding it over.
