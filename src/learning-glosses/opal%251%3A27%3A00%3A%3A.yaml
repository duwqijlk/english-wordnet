simpleMeaning: a stone that lets some light through, made of silica (a hard material in sand and rock)
  with water, in many colors; some kinds are used as jewels
scope: This sense is the stone itself, in its many colors; it is not a jewel already cut and set in a
  ring or other piece.
examples:
- She wore a ring with a bright opal.
- The opal in the shop window showed blue and green colors.
