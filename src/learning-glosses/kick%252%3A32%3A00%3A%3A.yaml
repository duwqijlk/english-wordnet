simpleMeaning: To say that you are unhappy or dissatisfied with something.
scope: To complain or show you are unhappy, not to strike something with your foot, and not the leg movement
  used in swimming.
examples:
- The neighbours kicked up a fuss about the new parking rules.
- There is plenty to kick about in the new contract.
