simpleMeaning: in a way that has little strength or force, or only to a small degree
scope: Done with little strength or force, or only to a small degree; not used to describe a person who
  lacks bodily strength.
examples:
- She agreed weakly, with a small nod and a quiet voice.
- He was only weakly interested in the game and soon stopped watching.
