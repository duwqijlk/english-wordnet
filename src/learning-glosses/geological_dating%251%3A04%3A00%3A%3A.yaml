simpleMeaning: working out how old samples of rock and earth are by testing them with chemicals
scope: 'Also called dating: working out the age of rock and earth samples with chemical tests, not guessing
  from the look of a rock and not counting tree rings.'
examples:
- Geological dating showed the fossil was millions of years old.
- The lab used geological dating to find the age of the rock layer.
