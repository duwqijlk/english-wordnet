simpleMeaning: Nietzsche's theories calling for the defeat of threatening nihilism and slave morality,
  seen in historical Christianity, through a fresh judgement of all values based on a will to power
scope: Nietzsche's theories about defeating nihilism and slave morality, not a political movement and
  not the teachings of Schopenhauer.
examples:
- Nietzscheanism rejects slave morality and calls for new values.
- She studied Nietzscheanism and its idea of the superman.
