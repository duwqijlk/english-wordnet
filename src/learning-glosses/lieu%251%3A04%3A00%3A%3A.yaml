simpleMeaning: the job or role that another person rightly or usually holds and does
scope: 'Also called place, position, and stead: a job or role filled for someone else, not a spot or area
  and not a rank.'
examples:
- She attended the meeting in lieu of her boss.
- The nurse took the night shift in lieu of her sick coworker.
