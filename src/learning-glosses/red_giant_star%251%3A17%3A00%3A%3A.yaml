simpleMeaning: An old bright body in the sky, very large, whose outside is not very hot and which is far
  wider than the sun
scope: 'Also called red giant: an old, very large bright star, not a small young star and not a star that
  is hot on its surface.'
examples:
- The red giant star filled the telescope's view.
- That red giant star is far wider than the sun.
