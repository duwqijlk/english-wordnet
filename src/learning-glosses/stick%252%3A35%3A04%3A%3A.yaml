simpleMeaning: force a sharp tool through something with a hard push
scope: Piercing done with a forceful push of a sharp tool, not the plain act of making a hole with a point,
  and not fixing an object in place by its end.
examples:
- He stuck the needle right through the thick cloth.
- The gardener stuck the spade into the soil and leaned on it.
