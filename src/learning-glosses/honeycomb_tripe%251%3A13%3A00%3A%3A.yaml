simpleMeaning: Eaten as food, this is the inner skin of the second stomach of an animal that chews its
  food twice
scope: This is the inner skin of the second stomach of an animal that chews its food twice, eaten as food;
  not the whole stomach, and not other meat from the animal.
examples:
- Honeycomb tripe is often served in soup.
- She bought honeycomb tripe at the market.
