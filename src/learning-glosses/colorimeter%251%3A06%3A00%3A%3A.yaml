simpleMeaning: A measuring instrument used in colorimetric analysis to work out how much of a substance
  there is from the colour it makes with specific reagents
scope: This tool, also called a tintometer, works out the amount of a substance in a mix from the shade
  the mix turns when set liquids are added.
examples:
- The colorimeter showed how much of the stuff was in the mix.
- She used a colorimeter to test the shade the mix turned.
