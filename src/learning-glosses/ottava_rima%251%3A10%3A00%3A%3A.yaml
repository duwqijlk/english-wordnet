simpleMeaning: A group of eight lines of verse for tales of heroes, with lines that rhyme in the set order
  a b a b a b c c
scope: A group of eight lines of verse for tales of heroes, with lines that rhyme in a set order, not
  a group of four lines and not free verse with no rhyme.
examples:
- The poem is written in ottava rima, eight lines to a group.
- He chose ottava rima for the long tale in verse.
