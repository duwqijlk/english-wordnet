simpleMeaning: the part of science that studies the force that pulls iron in and makes pieces of iron
  with the force pull toward or push away from each other
scope: This is the part of science that studies this pulling and pushing force, not the force itself that
  pulls iron in.
examples:
- She studies magnetism at university.
- His book on magnetism explains how compasses work.
