simpleMeaning: Connected with a way of thinking that says no to religion and no to using ideas from religion
scope: This sense is about a belief that says no to religion. It is not the sense about priests who are
  not monks, and not the wider sense that means of this world, not of the spirit.
examples:
- He holds secular views and thinks religion should play no part in law.
- The group teaches a secular way of thinking that leaves religion out.
