simpleMeaning: any of a group of fat-like compounds containing a sugar such as glucose or galactose, found
  in the protective sheath around nerve fibres
scope: The fat-and-sugar compound found in nerve tissue; not a simple sugar or a protein.
examples:
- Cerebrosides are a major part of the sheath that insulates nerve fibres.
- The researchers measured cerebroside levels in samples of nerve tissue.
