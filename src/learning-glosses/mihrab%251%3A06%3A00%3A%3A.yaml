simpleMeaning: In Islam, a hollow place in the wall of a mosque that shows which way Mecca lies.
scope: In Islam, a hollow place in the wall of a mosque that shows which way Mecca lies; not the niche
  shape woven into a prayer rug and not a window.
examples:
- The mihrab in the mosque wall shows which way Mecca lies.
- Worshippers face the mihrab when they pray.
