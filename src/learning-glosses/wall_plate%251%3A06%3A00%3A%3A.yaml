simpleMeaning: a piece of wood along the top of an upright side that holds the ends of beams and spreads
  their weight
scope: A piece of wood along the top of an upright side that holds beams; not a beam itself and not a
  metal bracket.
examples:
- The wall plate runs along the top of the wall.
- The builder fixed the wall plate above the door.
