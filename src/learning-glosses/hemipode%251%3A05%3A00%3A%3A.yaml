simpleMeaning: A small quail-like ground bird of southern Eurasia and northern Africa with no hind toe;
  grouped with wading birds but living on grassy plains.
scope: Another name for the button quail, the same small grassland bird with no hind toe; not a true quail.
examples:
- We flushed a hemipode from the tall grass at the edge of the field.
- A hemipode has no hind toe, unlike a true quail.
