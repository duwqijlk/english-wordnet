simpleMeaning: a tall sage plant that lives for years, from the Old World, with violet-blue flowers, found
  in open grassland
scope: A tall sage plant with violet-blue flowers; not a low plant of wet ground and not a garden sage
  grown for its leaves.
examples:
- Meadow clary grew tall in the open grassland.
- The meadow clary in the field had violet-blue flowers.
