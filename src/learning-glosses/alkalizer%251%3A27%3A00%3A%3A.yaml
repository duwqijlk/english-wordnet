simpleMeaning: a substance that works against acid, most often against the acid in the stomach
scope: 'Also called antacid, alkaliser, antiacid, and gastric antacid: a substance that works against
  acid, most often in the stomach, not a substance that stops the stomach from making acid, and not a
  substance that makes acid.'
examples:
- She kept an alkalizer by her bed for nights when acid rose in her chest.
- The alkalizer worked fast, and the sour taste soon went away.
