simpleMeaning: of an adjective, used after a word like is or seems to say something about the person or
  thing talked about in a sentence
scope: An adjective used after is or seems, not an adjective placed right before a noun.
examples:
- ‘Red’ is a predicative adjective in ‘the apple is red’.
- In ‘she seems tired’, tired is a predicative adjective.
