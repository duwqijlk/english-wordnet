simpleMeaning: A two-part code given to banks and savings groups to name them; the first part shows where
  the bank is, the second part names the bank.
scope: This is a two-part code that names a bank, also called bank identification number and ABA transit
  number, not a box for rubbish and not a waste container.
examples:
- The BIN names the bank on the card.
- Each bank has its own BIN.
