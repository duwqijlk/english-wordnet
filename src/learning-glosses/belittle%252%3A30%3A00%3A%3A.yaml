simpleMeaning: to lower a person's power, respect and good name
scope: 'Also called diminish: to lower how much power and respect a person has, not to make a thing smaller
  in size.'
examples:
- Do not belittle your colleagues in front of other people.
- He belittled her work in the meeting and hurt her good name.
