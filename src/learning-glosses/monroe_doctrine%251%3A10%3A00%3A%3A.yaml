senseId: 'monroe_doctrine%1:10:00::'
synsetId: 06675111-n
simpleMeaning: A policy of the United States that stands against meddling in the western half of the world
  by powers from outside it.
scope: A policy of the United States against outside meddling in the western half of the world, not other
  foreign policies and not a policy about trade.
examples:
- The Monroe Doctrine opposed interference in the western hemisphere.
- Under the Monroe Doctrine, outside powers were warned not to meddle.
