simpleMeaning: A very large sea fish of the tuna group that people eat and catch for sport, kin to the
  mackerel and found mostly in warm seas.
scope: This is a very large sea fish of the tuna group, also called tuna; not a shark and not a small
  reef fish.
examples:
- The tunny fought hard on the line.
- Tunny are caught for sport in warm seas.
