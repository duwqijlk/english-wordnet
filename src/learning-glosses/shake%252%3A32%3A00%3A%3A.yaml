simpleMeaning: move a part of the body back and forth to show a greeting, a feeling, or what one is thinking
scope: This is the verb for moving your own head, hand, or fist as a signal, while the noun 'shake' names
  the hand-clasping greeting and rapid trembling is a different verb sense.
examples:
- She shook her head to show she disagreed.
- He shook his fist at the driver who cut him off.
