simpleMeaning: Stubbornly attached to old customs and ideas and unwilling to accept newer ways.
scope: This describes a person's attitudes as narrow and old-fashioned, not the noun for a conservative
  person and not the sense meaning honest and fair.
examples:
- My grandfather is pretty square about music and only listens to old records.
- She thought the club was too square to allow women members.
