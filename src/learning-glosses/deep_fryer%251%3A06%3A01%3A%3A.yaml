simpleMeaning: a kitchen tool that cooks food in a pot full of very hot oil, made in a size to fit the
  job it is meant to do
scope: A kitchen tool that cooks food in a pot full of very hot oil; deep fat fryer, frier, fryer and
  fryolator are other names for this sense, not a grill and not a pot for boiling.
examples:
- The deep fryer at the chip shop runs all day.
- He cleaned the deep fryer after cooking the chicken.
