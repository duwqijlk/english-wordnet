simpleMeaning: a state in which something needs to be dealt with at once
scope: This is a state in which something needs to be dealt with at once; criticalness is another name
  for this sense, and it is not a calm state or the urgent thing itself.
examples:
- The criticality of the water shortage forced quick action.
- Doctors spoke of the criticality of the patient's state.
