simpleMeaning: the changes in the air and sky that come when the sun goes down each day
scope: What happens in the air and sky when the sun goes down, not the exact time the sun goes down and
  not the end of a life, job, or period.
examples:
- We watched the sunset light up the sky in red and gold.
- A bright sunset filled the sky with red and gold.
