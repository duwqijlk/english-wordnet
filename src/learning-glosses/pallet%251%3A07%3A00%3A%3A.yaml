simpleMeaning: the colours that mark the work of one artist, one picture, or one school of art
scope: The colours of one artist, picture, or school of art, not a potter's flat tool, not a straw mattress
  used as a bed, and not a flat platform for moving goods.
examples:
- The artist's pallet of warm reds and golds marks all his late work.
- That school of art is known for its pallet of soft blues and greys.
