senseId: 'bipolar_disorder%1:26:00::'
synsetId: 14416044-n
simpleMeaning: A mental illness in which a person has times of very high spirits and times of very low
  spirits.
scope: A mental illness with times of very high spirits and times of very low spirits; manic depression,
  manic-depressive psychosis and manic depressive illness are other names for this sense, not a lasting
  low mood alone and not a single high mood.
examples:
- He was diagnosed with bipolar disorder after years of mood swings.
- Bipolar disorder can bring weeks of high energy followed by weeks of deep sadness.
