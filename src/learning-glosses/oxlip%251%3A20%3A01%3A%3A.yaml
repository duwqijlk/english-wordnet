simpleMeaning: a primrose from Europe and Asia with yellow flowers grouped on one side of the stalk
scope: A primrose with yellow flowers grouped on one side of the stalk; paigle is another name for this
  sense, and it is not the cowslip flower or a primrose with flowers all round the stalk.
examples:
- The oxlip blooms in spring with soft yellow flowers.
- We found an oxlip growing at the edge of the wood.
