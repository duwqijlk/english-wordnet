simpleMeaning: Keeping your face still on purpose, so it shows nothing of what you feel.
scope: Also called expressionless, this is a face kept still on purpose, not a face that merely shows
  little feeling by nature.
examples:
- His face remained impassive as the verdict was read.
- She kept an impassive look through the whole meeting.
