simpleMeaning: A white and olive-green monkey of East Africa with long white tufts of hair beside its
  face.
scope: A white and olive-green monkey of East Africa with long white tufts beside its face, not a baboon
  and not a green monkey of West Africa.
examples:
- The grivet sat in the acacia tree eating leaves.
- Grivets live in groups across East Africa.
