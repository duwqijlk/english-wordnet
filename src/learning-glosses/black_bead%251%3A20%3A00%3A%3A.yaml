simpleMeaning: Curved, pointed pods holding shiny black seeds follow white-to-yellow flower clusters on
  this upright shrub with small or no spines; it grows in Florida and the West Indies.
scope: One of several names, with cat's-claw and catclaw, for this West Indian and Floridian shrub with
  curved pods and shiny black seeds; not the unrelated black nightshade.
examples:
- Black bead grows as an upright shrub along the edges of hammocks in Florida.
- The black bead shrub bears curved pods that open to reveal shiny dark seeds.
