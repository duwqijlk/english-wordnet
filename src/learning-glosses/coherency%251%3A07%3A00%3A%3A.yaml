simpleMeaning: the way the parts of a thing fit together in a clear, neat and steady way
scope: This is the way the parts of a thing fit together in a clear, neat and steady way, also called
  coherence; not a set of parts that clash or sit apart.
examples:
- The coherency of her talk came from the clear order of its parts.
- Readers liked the coherency of the book, with each part in place.
