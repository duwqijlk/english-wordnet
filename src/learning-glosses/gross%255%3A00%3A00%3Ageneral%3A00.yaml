simpleMeaning: only in broad outline, not showing small differences or small details
scope: This sense is about a broad view with no small details, not about what you can see with your eyes
  alone and not about something clearly bad.
examples:
- He gave only a gross outline of the building, with no small details.
- She described the house in gross outline and left out all the small details.
