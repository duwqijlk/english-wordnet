simpleMeaning: a thing made to look pretty, in the shape of a small branch with leaves or flowers on it
scope: This is a made thing in the shape of leaves or flowers; it is not a real small branch of a plant.
examples:
- She wore a small silver sprig on her coat to make it look pretty.
- The dress had a sprig worked in thread on the front.
