senseId: 'shock%1:12:01::'
synsetId: 07525864-n
simpleMeaning: The upset and disbelief you feel when something bad happens by chance.
scope: This is the distressed feeling after an accident or bad news, not the act of stunning someone with
  horror or disgust, nor an earth tremor.
examples:
- He was numb with shock after hearing about the crash.
- The shock of the bad news left her unable to speak.
