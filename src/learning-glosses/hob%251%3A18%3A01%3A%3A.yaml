scope: 'Also called imp, elf, brownie, pixie, pixy and gremlin: in old stories, small magic people who
  cause a little trouble, not the hob sense of a single small ugly creature that makes trouble for people.'
examples:
- In the old tale, hobs played tricks on the farmer at night.
- For fun, the hobs hid the shepherd's hat while he slept.
