simpleMeaning: An object that stops or limits how far something can move.
scope: This is a stop that halts or limits the movement of a part, such as a wedge under a door; it is
  not the part attached to a door or window that keeps it shut, not the act of trapping an animal in a
  snare or trap, not catching a fleeing person after a chase, not noticing a mistake or slip, and not
  grabbing a moving object to stop it.
examples:
- The catch under the lever stops it from travelling too far.
- A worn catch let the machine arm fall further than it should.
