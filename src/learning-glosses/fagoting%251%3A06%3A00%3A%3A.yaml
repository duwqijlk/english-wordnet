senseId: 'fagoting%1:06:00::'
synsetId: 03322285-n
simpleMeaning: needlework in which groups of straight threads lying side by side are tied together with
  open stitches
scope: This is needlework tying bunches of threads together; faggoting is another name for this sense;
  not plain sewing and not weaving cloth.
examples:
- Fagoting ties groups of threads together.
- The fagoting on the collar used open stitches.
