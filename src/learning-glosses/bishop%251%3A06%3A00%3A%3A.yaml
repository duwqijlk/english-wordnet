simpleMeaning: In chess, a playing piece that moves in slanted lines across empty squares that are all
  the same color
scope: In chess, this piece moves only in slanted lines on squares of one color; it is not the wine drink
  with oranges and cloves that has the same name.
examples:
- She moved her bishop across the board in a long slanted line.
- His bishop can only stay on the black squares.
