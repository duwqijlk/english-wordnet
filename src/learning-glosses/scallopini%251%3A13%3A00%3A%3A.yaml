simpleMeaning: Usually calf or bird, it is meat pounded thin, coated in flour, and fried fast in a pan.
scope: Also called scallopine, it is meat pounded thin and coated in flour, fried fast in a pan, not meat
  left thick and cooked slowly.
examples:
- The scallopini was coated in flour before it went into the pan.
- She fried the scallopini fast in the pan.
