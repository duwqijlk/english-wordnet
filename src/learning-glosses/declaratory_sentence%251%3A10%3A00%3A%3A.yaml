simpleMeaning: a statement made with a group of words in the form used for facts
scope: This is a statement made with a group of words, also called a declarative sentence; not a question
  and not a command.
examples:
- A declaratory sentence gives facts, like 'The shop opens at nine.'
- He began his note with a declaratory sentence about the new rules.
