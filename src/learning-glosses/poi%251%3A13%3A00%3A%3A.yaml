simpleMeaning: a Hawaiian food made by crushing taro root into a soft thick paste, often left for a time
  so it can ferment (change and become a little sour)
scope: A Hawaiian paste food made from taro root, not a sweet dessert and not plain cooked taro root on
  its own.
examples:
- At dinner in Hawaii, they served poi with the fish.
- She made fresh poi by crushing cooked taro root.
