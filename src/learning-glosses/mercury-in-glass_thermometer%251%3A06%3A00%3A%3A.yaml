simpleMeaning: 'A temperature gauge: silvery metal in the bulb at the bottom of a sealed narrow tube expands
  when warm, rising as a thin thread along a Celsius or Fahrenheit scale.'
scope: A traditional glass gauge for temperature, not a digital or alcohol-filled one; the metal inside
  is mercury.
examples:
- The mercury-in-glass thermometer on the wall read thirty degrees.
- Nurses once relied on a mercury-in-glass thermometer to check for fever.
