simpleMeaning: A group of people who live far from home yet keep ties with it, still counted as its people
  but not ruled by it
scope: A group living far from home yet tied to it, also called a colony; not the ending of a business,
  not the act of colonizing, and not a decision reached.
examples:
- The American settlement in Paris kept its own customs.
- A settlement of traders grew up beside the river.
