simpleMeaning: a wide flat base of strong concrete, usually put on soft ground to hold up a building
scope: 'Also called mat and raft: a wide flat base under a building, not a pile of logs on water and not
  a wall that holds up a roof.'
examples:
- The builders laid a raft foundation under the new house because the ground was soft.
- A raft foundation spreads the weight of the building over a wide area.
