simpleMeaning: not interested or excited, and with no strong warm feeling
scope: This describes a person or a response that shows little interest or excitement, not a person who
  is against something or angry about it.
examples:
- The crowd gave an unenthusiastic round of clapping.
- He was unenthusiastic about the plan and spoke in a flat voice.
