simpleMeaning: a sudden burst of fear and worry among many people about something expected to happen.
scope: A public alarm, also called panic, not one person's sudden fright and not the verb meaning to frighten.
examples:
- News of the fuel shortage set off a scare across the city.
- A bomb scare forced them to leave the building.
