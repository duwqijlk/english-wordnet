simpleMeaning: one of many small bodies of rock and metal that go round the sun, mainly between the paths
  of Mars and Jupiter
scope: A small rock and metal body going round the sun, mainly between Mars and Jupiter; it is not a planet
  and not a piece that falls to Earth.
examples:
- An asteroid passed near Earth last night.
- Many asteroids move round the sun between Mars and Jupiter.
