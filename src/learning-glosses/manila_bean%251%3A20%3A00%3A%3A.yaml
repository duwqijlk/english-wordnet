simpleMeaning: A climbing plant that lives one year, with an underground stem, bearing clusters of purplish
  flowers and pods with four jagged wings, of the warm lands of the Old World
scope: Also called goa bean, goa bean vine, winged bean, winged pea, or Psophocarpus tetragonolobus; a
  climbing plant of the warm lands of the Old World with pods with four jagged wings.
examples:
- The Manila bean climbed the poles, its purplish flowers bright in the sun.
- She grew Manila bean for its pods with four jagged wings.
