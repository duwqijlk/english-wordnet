simpleMeaning: An upright or bushy tree of Africa with ridged dark grey bark and stiff shiny leaves of
  medium to long size
scope: Also called Podocarpus latifolius; an upright or bushy African tree with ridged dark grey bark
  and stiff shiny leaves, its near kin being other African podocarps such as the Outeniqua yellowwood.
examples:
- South-African yellowwood grows in the forests of the Cape.
- The dark grey bark of South-African yellowwood is deeply ridged.
