simpleMeaning: usually made of silver, a tray or large plate for bringing food or drinks to people
scope: This is a tray or large plate for serving, usually silver, not a plate a person eats their own
  meal from and not a drinking cup.
examples:
- The waiter brought the drinks in on a silver salver.
- She placed the cups on the salver and carried them to the guests.
