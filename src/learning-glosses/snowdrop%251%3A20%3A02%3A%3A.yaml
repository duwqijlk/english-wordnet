simpleMeaning: a common anemone (a flowering plant) that grows in eastern North America, with single white
  flowers that have a light pink colour
scope: Also called wood anemone, this is a flowering plant of eastern North America, not a piece of snow
  or a drop of water.
examples:
- In the woods of eastern North America, a snowdrop showed its single white flower with a light pink colour.
- The snowdrops opened by the path, each plant with one white flower touched with pink.
