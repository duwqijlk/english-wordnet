simpleMeaning: A body of officers with a formal rank, set up to judge and punish soldiers who break the
  rules of service.
scope: A body of officers with a formal rank that judges and punishes soldiers who break the rules of
  service, not a civilian hearing and not a hearing about pay.
examples:
- The soldier faced a military court for breaking the rules.
- A military court can punish troops who desert.
