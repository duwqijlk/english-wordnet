simpleMeaning: a doctor who treats all kinds of sickness and does not work in one narrow field of medicine
scope: A doctor who treats all kinds of sickness, not a doctor who works in one narrow field, and not
  a nurse.
examples:
- She went to her general practitioner about the cough.
- Our general practitioner treats the whole family.
