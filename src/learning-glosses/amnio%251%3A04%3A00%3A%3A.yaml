simpleMeaning: In pregnancy, the drawing out by needle of fluid from the womb of a pregnant woman, after
  the fifteenth week of pregnancy, to help find faults in the unborn child.
scope: Also called amniocentesis, in pregnancy, the drawing out by needle of fluid from the womb of a
  pregnant woman, after the fifteenth week of pregnancy, to help find faults in the unborn child.
examples:
- Amnio is done after the fifteenth week.
- Amnio helps find faults in the unborn child.
