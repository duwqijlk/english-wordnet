simpleMeaning: A plant like the common teasel and used in the same way, found widely in Europe, North
  Africa and western Asia, and now settled in the United States.
scope: A teasel-like plant of Europe, North Africa and western Asia, also called fuller's teasel; not
  the common teasel itself and not a plant found only in Europe.
examples:
- Dipsacus sativus grew by the field edge in Europe.
- Dipsacus sativus is now settled in the United States.
