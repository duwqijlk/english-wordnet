simpleMeaning: in a way that people find unpleasant and that shocks or offends them
scope: This means in a way that shocks or offends people, not in a way that is dirty or makes people feel
  sick.
examples:
- The magazine printed a distastefully detailed report on the couple's private life.
- He joked distastefully about her illness in front of everyone.
