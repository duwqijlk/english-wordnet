simpleMeaning: At times this weed-like plant of the eastern United States down to Texas spreads too far,
  bearing yellow flowers, and it is at times put in the group Senecio.
scope: Also called golden ragwort, this is the weed-like plant of the eastern United States down to Texas
  that at times spreads too far and is at times put in the group Senecio.
examples:
- The golden groundsel had spread too far.
