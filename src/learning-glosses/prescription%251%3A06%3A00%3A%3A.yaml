simpleMeaning: a medicine you can only get when a doctor or dentist writes to the pharmacist that you
  should have it
scope: A medicine that needs a doctor's written order, not the written order itself and not glasses made
  to a written order.
examples:
- He told the doctor that he had been taking his prescription regularly.
- You need a prescription to buy this medicine.
