simpleMeaning: A commissioned officer in the Navy, ranking above a lower officer rank and below a higher
  officer rank
scope: A Navy officer between the lieutenant below and the commander above; not a lieutenant junior grade
  and not a full commander.
examples:
- The lieutenant commander took charge of the ship.
- She was promoted to lieutenant commander last year.
