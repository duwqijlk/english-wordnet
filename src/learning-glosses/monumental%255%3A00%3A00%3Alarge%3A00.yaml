simpleMeaning: Very big and solid, in a way that strikes you with its size
scope: This is being very big and solid in a way that strikes you with its size; massive is another name
  for this sense, not a stone put up to remember someone, and not merely tall.
examples:
- The monumental doors of the hall were made of oak.
- A monumental arch stood at the entrance.
