simpleMeaning: Flowers with sky-coloured rays spread round a centre grow on this hairy low bush from South
  Africa or Australia.
scope: Also called a blue marguerite, this is a hairy low bush of South Africa or Australia, not a tall
  tree, with flowers whose sky-coloured rays spread round a centre.
examples:
- We saw blue daisies growing in South Africa.
- The blue daisy's flowers opened with sky-coloured rays round the centre.
