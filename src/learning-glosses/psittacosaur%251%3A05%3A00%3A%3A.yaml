simpleMeaning: Long back legs and short front legs mark this early dinosaur, which had no horns and only
  the start of a frill, and may have walked on two legs.
scope: 'Also called psittacosaurus: an early dinosaur with long back legs and short front legs, no horns,
  and only the start of a frill, not a horned dinosaur with a full frill.'
examples:
- The psittacosaur had long back legs and may have walked on two legs.
- This psittacosaur had no horns, only the start of a frill.
