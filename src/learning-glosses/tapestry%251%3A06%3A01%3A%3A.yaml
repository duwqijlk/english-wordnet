simpleMeaning: a heavy cloth with a design woven into it, used for curtains and for covering chairs and
  seats
scope: A heavy cloth for curtains and for covering seats; not a cloth picture that hangs on a wall, and
  not a thing said to be like such cloth in how its parts fit together.
examples:
- The curtains were made from a thick tapestry with flowers woven into it.
- She chose a red tapestry to cover the old chair seats.
