simpleMeaning: when an animal drives its horn or long pointed tooth into a thing
scope: 'Also called horn: to stab with a horn or a long pointed tooth, not the tooth itself.'
examples:
- The boar tusked the hunter's leg.
- The elephant tusked the wooden post and split it.
