simpleMeaning: Any of various usually bushy plants whose fruit is eaten while young, before the skin or
  seeds harden.
scope: Also called summer squash and summer squash vine; a usually bushy plant whose fruit is eaten young,
  not a winter squash plant.
examples:
- We picked Cucurbita pepo melopepo while the fruit was still young.
- Cucurbita pepo melopepo plants are usually bushy.
