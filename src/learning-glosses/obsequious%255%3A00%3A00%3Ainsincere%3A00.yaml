simpleMeaning: trying to win the good opinion of people with power by praising them too much, when you
  do not mean it
scope: 'Also called fawning, sycophantic and bootlicking: praising people with power to please them when
  you do not mean it, not the other sense of being too ready to help and serve like a servant.'
examples:
- He gave the director an obsequious smile and agreed with everything she said.
- Her obsequious praise of the rich man made everyone feel uneasy.
