simpleMeaning: to take out the middle of a coin and put a cheaper metal in its place
scope: A verb about changing a coin; it is not about filling or closing a hole, and not about praising
  something to help sell it.
examples:
- He plugged the coin by taking out its middle and putting in cheap metal.
- In the old days, a man might plug a coin and pass it off as full value.
