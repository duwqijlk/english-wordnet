simpleMeaning: A low-ranking soldier in the marines, one step above a private first class and one step
  below the next rank up.
scope: A low-ranking soldier in the marines, one step above a private first class; not a private first
  class, and not a soldier of higher rank.
examples:
- The lance corporal led the small patrol.
- She was made a lance corporal after two years of service.
