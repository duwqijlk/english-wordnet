simpleMeaning: a harmless legless creature of Europe with a bright yellow band round the neck, found often
  in England
scope: Not the North American snake of the same name, and not a snake with no neck band; also called grass
  snake and ringed snake.
examples:
- A ring snake basked on the warm wall.
- The ring snake in the garden had a bright yellow collar.
