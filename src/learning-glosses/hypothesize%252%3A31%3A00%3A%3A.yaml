simpleMeaning: to think something is true, especially when the reason you have is weak or not yet sure
scope: To think something is true for a weak reason, also called suppose, speculate, conjecture, and theorize;
  it is not to know a fact for sure.
examples:
- Scientists hypothesize that the fish lived in deep water long ago.
- She hypothesized that the delay was caused by the storm, but she had no proof.
