simpleMeaning: In sewing, a finished join where the edge of the cloth is folded back on itself or against
  another piece and stitched so no raw edge shows.
scope: This is the stitched seam itself, not the adjective meaning cruel, not an animal's dressed hide,
  not the act of cutting down a tree, not the verb meaning to strike something down, not the verb meaning
  to die quickly, and not the verb meaning to sew a folded edge.
examples:
- The seamstress stitched a narrow fell along the hem to stop the raw edge from fraying.
- A flat fell leaves the inside of the jacket clean and smooth.
