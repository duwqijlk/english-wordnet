simpleMeaning: Lines and other marks of age leave the face when the surgeon cuts near the hair, draws
  the skin back, and cuts off the spare flesh.
scope: A lift, a facelift, a face lift, face lifting, cosmetic surgery, rhytidectomy and rhytidoplasty
  are all names for this face operation that takes away lines and other marks of age.
examples:
- She chose a nip and tuck to take away the lines on her face.
- The nip and tuck left her face looking smoother, with the lines gone.
