senseId: 'whistle%2:32:02::'
synsetId: 01045484-v
simpleMeaning: to make a high sound with your mouth as a sign to someone, for example to call them or
  to tell them to start
scope: A sound made as a sign, for example to call someone or to start something, not a tune played for
  music and not a sound a fast thing makes as it moves.
examples:
- She whistled for her dog to come back to her.
- The man whistled to call a taxi to the side of the road.
