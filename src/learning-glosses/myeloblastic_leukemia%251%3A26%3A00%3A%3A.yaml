simpleMeaning: Marked by a great many young cells that grow into white blood cells in the blood, a bad
  growth sits in the parts of the body that make blood.
scope: It is a cancer of the parts of the body that make blood, and what marks it out is a great many
  young cells in the blood.
examples:
- The blood in myeloblastic leukemia holds a great many young cells.
- Myeloblastic leukemia grows in the parts of the body that make blood.
