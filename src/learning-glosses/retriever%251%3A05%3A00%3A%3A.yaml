simpleMeaning: a dog with a thick coat that water does not pass through easily, and that can be taught
  to bring back animals hunted for sport or food
scope: This is a hunting dog with a thick coat for water, not a person who finds and brings back lost
  things and not any dog that plays at fetching a ball.
examples:
- Our retriever swam out and brought back the duck.
- The golden retriever has a thick coat that keeps it warm in cold water.
