simpleMeaning: A strip of paper or ribbon put between the pages to show where the reader stopped
scope: A strip of paper or ribbon put between pages to show where the reader stopped, also called a bookmark;
  not a pen used to write in a book and not a fold in the page.
examples:
- She put a bookmarker between the pages to keep her place.
- I lost my bookmarker and had to search for the page.
