senseId: 'symbolization%1:04:00::'
synsetId: 00413284-n
simpleMeaning: the practice of giving things a meaning by making them stand for other ideas
scope: The practice of giving things a meaning by making them stand for other ideas, with symbolism and
  symbolisation as other names for this sense, not using a sign to pass on a message and not a thing that
  stands for something else.
examples:
- Symbolization gives the old house a meaning as a sign of home.
- The poet's symbolization turns plain things into signs of hope.
