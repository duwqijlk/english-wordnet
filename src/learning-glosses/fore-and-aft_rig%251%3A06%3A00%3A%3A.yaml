senseId: 'fore-and-aft_rig%1:06:00::'
synsetId: 03386510-n
simpleMeaning: The set of main sails on a boat that run from the front to the back, along the boat's length.
scope: Sails that run front to back on a boat, not sails that run across the boat and not a single sail.
examples:
- The fore-and-aft rig let the small boat sail close to the wind.
- Her boat had a fore-and-aft rig with two tall sails.
