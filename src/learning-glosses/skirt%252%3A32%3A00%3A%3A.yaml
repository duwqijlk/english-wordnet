simpleMeaning: to stay away from doing a duty, answering a question, or dealing with an issue, or to try
  to stay away from it
scope: Also called duck and hedge. This means to avoid a duty, a question, or an issue, not to wear clothing
  and not to go around something on all sides.
examples:
- He skirted the hard question and talked about the weather instead.
- The leaders skirted their duty and left the problem for others.
