senseId: 'pulmonary_artery%1:08:00::'
synsetId: 05361367-n
simpleMeaning: One of two blood tubes, branches of the main blood tube from the heart, that carry used
  blood from the heart to the lungs.
scope: A blood tube from the heart to the lungs, also called arteria pulmonalis; not a blood tube to the
  body and not a vein that brings blood back.
examples:
- The pulmonary artery carries used blood from the heart to the lungs.
- Blood leaves the heart through the pulmonary artery on its way to the lungs.
