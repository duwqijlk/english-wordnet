simpleMeaning: a social scientist whose work is studying people, their ways of life, and how their groups
  change
scope: A person who studies people and their ways of life as a science, not a scientist who studies rocks,
  animals, or the body alone.
examples:
- The anthropologist lived in the village for a year to learn how its people live.
- An anthropologist asked older people in the town about their past ways of life.
