simpleMeaning: the fifth church council, held in 553, that judged the writings of Origen to be heretical
scope: 'Also called the Second Council of Constantinople: the fifth church council, held in 553, that
  judged the writings of Origen to be heretical, not the second council of 381 and not the later councils
  of 680 and 869.'
examples:
- At Constantinople in 553, the bishops judged the writings of Origen.
- The fifth council at Constantinople called the writings of Origen heretical.
