simpleMeaning: parts of the blood that swallow and break down germs and fungi, and are an important help
  to the body in fighting sickness
scope: 'Also called leucocyte, leukocyte, white blood cell, white blood corpuscle and white corpuscle:
  a part of the blood that fights germs, not a red blood cell and not a piece of skin.'
examples:
- The white cell count rose after the infection.
- A white cell swallows the germs that enter the blood.
