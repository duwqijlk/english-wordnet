simpleMeaning: A cactus from Brazil that grows on trees, widely kept as a houseplant, with jointed flat
  segments and usually rose-purple flowers that bloom in winter.
scope: Also called Christmas cactus and Schlumbergera buckleyi; not a desert cactus and not a plant with
  yellow flowers.
examples:
- The Schlumbergera baridgesii bloomed rose-purple in winter.
- She kept a Schlumbergera baridgesii on the windowsill.
