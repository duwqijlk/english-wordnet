simpleMeaning: one of the two far ends of the Earth, where the line it turns on meets the ground
scope: One of the two ends of the Earth's line of spin, not the point where that line meets the sky and
  not an end of a magnet.
examples:
- The North Pole is covered in ice for most of the year.
- Explorers reached the South Pole after months of travel.
