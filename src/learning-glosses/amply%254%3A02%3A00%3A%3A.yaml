simpleMeaning: to a large degree and in a full way, with more than enough
scope: 'Also called richly: to a large degree, with more than enough, not in a costly rich way and not
  with a deep, strong taste or sound.'
examples:
- These voices were amply represented in the meeting.
- She was amply rewarded for her hard work.
