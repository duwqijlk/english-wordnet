simpleMeaning: An old kind of frog from New Zealand, with four toes without skin between them on its front
  feet and five on its back feet.
scope: An old kind of New Zealand frog with unwebbed toes, not a tree frog and not a common toad.
examples:
- Liopelma hamiltoni lives in the forests of New Zealand.
- The front feet of Liopelma hamiltoni have four toes with no skin between them.
