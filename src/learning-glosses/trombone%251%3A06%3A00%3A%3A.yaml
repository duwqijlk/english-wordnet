simpleMeaning: a brass wind instrument made of a long tube that can be made longer or shorter with a U-shaped
  slide
scope: A brass instrument with a sliding tube; not a trumpet, which uses valves, and not a horn.
examples:
- He played the trombone in the school band.
- The trombone's slide moved as she played.
