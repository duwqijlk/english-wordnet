simpleMeaning: smelling like musk, a strong, sweet scent used in perfume and made by some animals
scope: This describes a smell like musk, not a taste or a look, and not the scent itself on its own.
examples:
- The room had a warm, musky smell from the old wooden box.
- She liked the musky scent of his soap.
