simpleMeaning: a list of amounts on two sides in bookkeeping with two columns, made to check that the
  two sides add up to the same
scope: In bookkeeping, a check that the two sides of the books add up to the same; not a bank balance
  and not a final set of accounts.
examples:
- The clerk drew up a trial balance at the end of the month.
- A trial balance showed that the debits and credits did not match.
