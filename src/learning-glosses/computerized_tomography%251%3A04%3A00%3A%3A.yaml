simpleMeaning: pictures of the organs inside the body, made from X rays and joined by a machine into flat
  slices along one line
scope: 'Also called computed axial tomography, computed tomography, and computerized axial tomography:
  a way of seeing inside the body with X rays, not a single X-ray picture and not an ultrasound scan.'
examples:
- Computerized tomography showed the organs inside his belly.
- She had computerized tomography after the fall.
