simpleMeaning: a circle that cuts a sphere (a ball) or other surface into two parts, usually equal and
  the same in shape on both sides
scope: A circle on any ball or other round surface, not only the line around the Earth.
examples:
- The equator of this ball divides it into two equal halves.
- The equator of a sphere lies halfway between its two poles.
