simpleMeaning: A strong bear of a brownish-yellow color, living in the high lands of western North America.
scope: Also called grizzly, grizzly bear, silver-tip, silvertip and Ursus horribilis, this is a strong
  brownish-yellow bear of the uplands of western North America, not a black bear and not a bear of the
  far north.
examples:
- We saw an Ursus arctos horribilis in the uplands of western North America.
- The Ursus arctos horribilis is a strong bear of the western uplands.
