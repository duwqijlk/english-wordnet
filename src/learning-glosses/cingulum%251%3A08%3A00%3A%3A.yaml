simpleMeaning: In anatomy, a ring-like part that goes round something, such as the ridge round the base
  of a tooth
scope: In anatomy, this is a ring-like part that goes round something, such as the ridge round the base
  of a tooth; not a band round the waist and not a hair on the eye.
examples:
- The cingulum forms a ridge round the base of the tooth.
- The dentist pointed to the cingulum on the model of the tooth.
