simpleMeaning: a close look at two or more things side by side to find where they do not agree
scope: This is checking things side by side to find where they differ, not putting pages in order and
  not a light meal.
examples:
- The collation of the two copies showed where they differed.
- Her collation of the texts took a whole afternoon.
