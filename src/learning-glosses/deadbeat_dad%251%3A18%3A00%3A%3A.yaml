simpleMeaning: a father who chooses not to pay the money he must pay to help raise his children
scope: A father who chooses not to pay money for his children's care, not a father who cannot pay and
  not a father who is simply absent.
examples:
- The deadbeat dad had not sent money for his children in a year.
- She sued the deadbeat dad to get the support her son was owed.
