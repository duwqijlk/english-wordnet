simpleMeaning: a worried feeling that an action may not be fitting, above all for reasons of right and
  wrong or of what is proper
scope: A worried doubt that an action may be wrong, not fear of danger and not simple dislike.
examples:
- She had misgivings about lying to her friend.
- Despite his misgivings, he signed the letter.
