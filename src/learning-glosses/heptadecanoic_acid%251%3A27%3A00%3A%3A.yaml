simpleMeaning: A clear crystal-like fat stuff made by people, with no colour.
scope: A clear crystal-like man-made fat stuff with no colour; margaric acid is another name for this
  sense, and this is not a natural fat from food or a coloured crystal.
examples:
- The lab made heptadecanoic acid for use in the test.
- Heptadecanoic acid forms clear crystals in the dish.
