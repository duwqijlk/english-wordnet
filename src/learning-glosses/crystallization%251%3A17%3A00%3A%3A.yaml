simpleMeaning: A stone formed when something turns solid, with the same small pattern all through it and
  flat faces outside
scope: This is a stone with a set pattern and flat faces, also called crystal, not a fixed idea in the
  mind and not the act of forming crystals.
examples:
- The crystallization had flat faces and a clear pattern.
- He held up a fine crystallization from the cave.
