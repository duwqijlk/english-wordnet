simpleMeaning: in grammar, the form of a noun, pronoun, or adjective that shows how it relates to other
  words in a sentence, often marked by a change in ending.
scope: This sense is not a container, a legal matter, or one instance among many; it is a grammatical
  form showing a word's role in a sentence.
examples:
- In Latin, the case of a noun tells you whether it is the subject or the object.
- Russian has six cases, each with its own endings.
