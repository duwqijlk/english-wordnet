simpleMeaning: A handsome, spreading plant from eastern North America and eastern Asia, now wild in western
  Europe, with feathery leaves that fold slightly when touched; beadlike lobes hold its spore cases.
scope: A woodland fern whose leaves respond to touch, not the tropical houseplant called the sensitive
  plant, and not other ferns with different spore structures.
examples:
- Sensitive fern spreads quickly through damp, shady ground.
- The sensitive fern's fronds curl a little when brushed.
