simpleMeaning: 'European weed established in the southwestern United States and Mexico: reddish sprawling
  stems, small fernlike leaves, small deep reddish-lavender flowers, slender upright fruits; often grown
  as fodder.'
scope: This is the low, reddish-stemmed desert weed grown as fodder, also called pin grass and redstem
  storksbill; it is not a true clover and not a grass.
examples:
- Pin clover spread quickly through the sandy pasture after the spring rains.
- The rancher sowed pin clover to give the sheep extra forage.
