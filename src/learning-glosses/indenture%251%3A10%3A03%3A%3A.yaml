simpleMeaning: the empty space between the edge of a page and the start of a line that begins further
  in
scope: This empty space on a page, also called indentation, indent, and indention; not a formal agreement
  about debt, and not the act of binding a worker by agreement.
examples:
- The indenture is wider in the first line of each new part of the text.
- Leave a clear indenture before the first word of the paragraph.
