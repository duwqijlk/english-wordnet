simpleMeaning: 'Mounds of rotting plants keep their eggs warm: big-footed, short-winged birds of Australasia
  build the mounds and lay their eggs in them.'
scope: Also called megapode, mound bird, mound builder, and scrub fowl; these are big-footed, short-winged
  birds of Australasia that build mounds of rotting plants to keep their eggs warm.
examples:
- The mound-bird built a mound of rotting plants for its eggs.
- Mound-birds lay their eggs in the mound to keep them warm.
