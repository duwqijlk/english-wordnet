simpleMeaning: All guesswork about where things come from or why they are is set aside by a person who
  puts weight on what can be seen and checked.
scope: This is a person who sets aside guesswork about first causes and puts weight on what can be seen
  and checked, also called a rationalist.
examples:
- The positivist asked for facts she could see and check.
- As a positivist, he set aside all talk of first causes.
