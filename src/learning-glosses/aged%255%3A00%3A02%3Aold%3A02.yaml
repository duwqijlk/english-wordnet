simpleMeaning: A person or thing that is a stated number of years old, said in one sound
scope: Having reached a certain age, not wine or cheese at its best, not an old person, and not worn rock.
examples:
- The boy, aged ten, started school this year.
- She is aged forty and runs the shop.
