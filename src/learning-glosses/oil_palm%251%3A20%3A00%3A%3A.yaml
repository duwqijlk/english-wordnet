simpleMeaning: A palm of the genus Elaeis, with feather-shaped leaves, tight clusters of crowded flowers
  and bright red fruit, grown for the high-quality oil pressed from it.
scope: The tree that palm oil comes from, with feathery leaves and red fruit; not the oil itself, and
  not other palms such as the date or coconut palm.
examples:
- Vast oil palm plantations have replaced rainforest in parts of Southeast Asia.
- Oil palm fruit gives more oil per hectare than any other crop.
