simpleMeaning: when you think a person did wrong, to blame them to their face in angry words
scope: To tell someone off with sharp, angry words, also called jaw, rag, lecture, scold, chide, berate,
  or reprimand; not the noun sense of the telling-off itself.
examples:
- The mother rebuked the child for getting into a stranger's car.
- The customer rebuked the waiter for bringing cold soup.
