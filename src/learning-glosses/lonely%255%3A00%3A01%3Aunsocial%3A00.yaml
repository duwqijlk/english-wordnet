simpleMeaning: marked by being alone, or liking to be alone and away from other people
scope: 'Also called lone: about living or being by yourself, by choice or by nature. This is not just
  having no one with you at one time.'
examples:
- He lives a lonely life in a small house far from town, and he likes it that way.
- She takes long, lonely walks alone in the hills.
