simpleMeaning: a person who helps someone else carry out a plan, most often a bad or unlawful one
scope: A person who joins someone else in carrying out a plan, most often a wrong or unlawful one, not
  the main person acting alone.
examples:
- The accomplice waited in the car while his partner broke into the shop.
- She was charged as an accomplice in the theft of the paintings.
