simpleMeaning: A shift that comes from, or brings about, a change in the shape of the hard outer shell
  of the earth
scope: A shift that comes from or brings about a change in the shape of the earth's outer shell, not a
  shift of the sea and not a single earthquake.
examples:
- Crustal movement slowly raised the mountains.
- The crustal movement bent the rock layers.
