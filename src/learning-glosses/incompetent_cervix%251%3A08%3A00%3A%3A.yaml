simpleMeaning: In birth care, the loss of the baby or a birth too soon often follows when a womb cervix
  opens before the baby is due, with no birth pains.
scope: In birth care, this womb cervix opens before the baby is due and with no birth pains, unlike one
  that opens when birth begins.
examples:
- They were told they had an incompetent cervix.
- With an incompetent cervix, the baby came too soon.
