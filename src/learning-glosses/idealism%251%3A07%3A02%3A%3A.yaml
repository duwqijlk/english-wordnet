senseId: 'idealism%1:07:02::'
synsetId: 04877838-n
simpleMeaning: high thoughts about what is right and good, and living by them; the quality of believing
  that such thoughts should be followed
scope: 'Also called high-mindedness or noble-mindedness: holding and living by high thoughts about right
  and good, not thinking of things only as you wish they were rather than as they really are.'
examples:
- Her idealism led her to work for free to help poor families.
- His idealism showed in the honest, generous way he lived.
