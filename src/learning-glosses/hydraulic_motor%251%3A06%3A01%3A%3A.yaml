simpleMeaning: a machine part that uses the push and flow of liquid under force to produce a turning motion
scope: A machine part that turns liquid pressure into a turning motion, not a pump that moves liquid and
  not an electric motor.
examples:
- The hydraulic motor drives the winch on the crane.
- A leak cut the power to the hydraulic motor, so the arm stopped turning.
