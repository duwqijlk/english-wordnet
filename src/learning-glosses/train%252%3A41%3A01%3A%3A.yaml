simpleMeaning: To help someone develop the ability to notice fine differences and make good judgments
  about quality.
scope: To sharpen someone's sense of quality and ability to tell good from bad, not the broader work of
  teaching a skill or profession, not learning or being instructed, not sports coaching, fitness exercise,
  child or animal discipline, or plant shaping; also not a railway service, a line of coupled cars, travel
  by rail, an ordered series of things or events, a file of pack animals, a chain of consequences, a gown's
  trailing cloth, a set of gears, aiming, or dragging.
examples:
- The class is designed to train your eye to spot small differences in color.
- Years of reading poetry had trained her taste for precise language.
