senseId: 'release%1:04:06::'
synsetId: 00211789-n
simpleMeaning: In music, the way a performer ends a phrase or a note.
scope: This is the ending of a musical note or phrase, not merchandise issued for sale or public showing,
  not the act of setting someone free, not a process that discharges something, not a press announcement,
  not the ending of someone's employment, not a euphemism for death, not a legal document discharging
  a debt, not a part you press on a mechanism, not an outlet for creative energy, not the escape of a
  fluid, not a formal written statement of relinquishment, and not any of the verb senses such as letting
  go, freeing, issuing, or giving off gas.
examples:
- The pianist's slow release of the final chord let the sound fade naturally.
- Good horn players control the release of each note as carefully as the attack.
