simpleMeaning: A play made only of sound is put out on the radio or sold on tape or CD
scope: Also called radio drama, radio theater, or radio theatre, this is a play made only of sound and
  put out on the radio or on tape or CD, not a play acted out on a stage.
examples:
- We listened to an audio drama on the radio last night.
- The audio drama used only voices and sound effects to tell the story.
