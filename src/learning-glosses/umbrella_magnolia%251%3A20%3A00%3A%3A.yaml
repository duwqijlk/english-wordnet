simpleMeaning: This small tree of eastern North America sheds its leaves each year, and at branch ends
  it bears creamy white flowers and big leaves spread out like small parasols.
scope: Also called elk-wood, elkwood, and umbrella tree, it is a small tree of eastern North America,
  shedding its leaves each year, with creamy white flowers and big leaves spread out like small parasols
  at branch ends.
examples:
- Creamy white flowers opened on the umbrella magnolia.
- Big leaves spread like small parasols on the umbrella magnolia.
