simpleMeaning: the US federal office that works to better the working life of people paid wages, set up
  in 1913
scope: Also called Labor, the Department of Labor, or the Labor Department; the US office for wage earners'
  working life, not a trade union and not a court.
examples:
- The DoL issued new rules on overtime.
- She wrote to the DoL about her pay.
