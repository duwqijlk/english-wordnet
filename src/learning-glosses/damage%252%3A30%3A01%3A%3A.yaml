simpleMeaning: To become harmed, or to be easy to harm.
scope: This is not the act of harming something else; here the subject is the thing that gets harmed or
  can easily be harmed.
examples:
- This kind of cloth damages easily in hot water.
- The paint damages quickly if it is left in the sun.
