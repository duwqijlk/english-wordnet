simpleMeaning: Of meat, beginning to spoil and smelling strong.
scope: Said of game or meat that has hung long enough to smell; it is not the sense of great height or
  of strong feeling.
examples:
- The pheasant was a little high, but the sauce covered it.
- That beef smells high; I would not serve it.
