simpleMeaning: A calming medicine, sold as Haldol, used to treat some mind illnesses in which a person
  loses touch with what is real, and Tourette's syndrome.
scope: This is a calming medicine sold as Haldol for some mind illnesses in which a person loses touch
  with what is real, and for Tourette's syndrome, not a sleeping pill or a painkiller.
examples:
- The doctor gave him haloperidol for his symptoms.
- Haloperidol helped control the tics.
