simpleMeaning: To hide a thing close against your chest
scope: To hide a thing at your chest, not the chest itself, not the cloth that covers it, and not a warm
  loving welcome.
examples:
- She bosomed his letters and kept them safe.
- He bosomed the small book under his coat.
