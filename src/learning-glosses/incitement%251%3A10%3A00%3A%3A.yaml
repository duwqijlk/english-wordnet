simpleMeaning: Trying hard, with strong words, to talk someone into doing something
scope: 'Another name for this sense is exhortation: trying hard with strong words to talk someone into
  something, not an act of urging someone on to action, and not a thing that stirs someone to act.'
examples:
- His incitement moved the crowd to march.
- The speech was an incitement to the workers to strike.
