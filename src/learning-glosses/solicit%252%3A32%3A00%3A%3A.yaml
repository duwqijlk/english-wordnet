senseId: 'solicit%2:32:00::'
synsetId: 00784104-v
simpleMeaning: to ask for something in a strong way, and to keep asking again and again until you get
  an answer
scope: 'Also called tap and beg: asking strongly and again and again for something, not pushing someone
  to break the law or disobey, and not just making a formal request for something wanted.'
examples:
- The charity sent letters to solicit money from local shops.
- He kept soliciting help from his neighbours until someone said yes.
