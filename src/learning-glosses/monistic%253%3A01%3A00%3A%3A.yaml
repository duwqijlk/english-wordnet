simpleMeaning: To do with the idea in philosophy that all things are one
scope: About the idea in philosophy that all things are one, not the idea that there are two kinds of
  things and not the idea that there are many kinds.
examples:
- The monistic view holds that mind and body are one.
- He argued for a monistic view of the world.
