simpleMeaning: To tighten the spring inside a clock or similar device by turning its knob.
scope: This is tightening a spring-driven mechanism with a knob, not wrapping something around a spool
  and not moving along a twisting path.
examples:
- She forgot to wind the old clock and it stopped overnight.
- He wound his watch every morning before leaving the house.
