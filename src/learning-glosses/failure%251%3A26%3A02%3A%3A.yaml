simpleMeaning: Not having the money to settle what you owe by the agreed dates.
scope: This is about money you owe and cannot pay on time, not a person who keeps losing, and not a general
  lack of success.
examples:
- The bank's failure left hundreds of suppliers unpaid.
- Years of losses pushed the chain store toward failure.
