simpleMeaning: a tiny animal of fresh water, a crustacean with a round body in a clear shell, that hops
  about like a flea on hairy branched feelers
scope: Also called daphnia; a tiny fresh-water animal that hops like a flea, not a flea itself.
examples:
- The water flea darted through the pond water in quick hops.
- Under the glass, the water flea's clear shell showed its round body.
