simpleMeaning: able to catch fire on its own, or to start fires, or to burn easily
scope: This describes a thing that can catch fire or start burning easily, not a bomb made to start fires
  and not the act of setting property on fire on purpose.
examples:
- The warehouse stored incendiary chemicals that could catch fire easily.
- They removed the incendiary material because it might burn on its own.
