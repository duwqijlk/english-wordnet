simpleMeaning: a plant that grows large, mild fruits with thick walls, usually in the shape of a bell;
  these are the main peppers used in salads
scope: This plant is also called pimiento, pimento, bell pepper, sweet pepper, and sweet pepper plant;
  it is the plant itself, not the mild red powder made from dried peppers.
examples:
- The paprika plants in the garden are full of large green peppers.
- She grows paprika for fresh salads, not for drying.
