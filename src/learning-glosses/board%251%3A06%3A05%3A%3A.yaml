simpleMeaning: a flat, portable surface, usually rectangular, made for playing games in which pieces are
  moved around on it
scope: This is the flat surface used for games, not the panel of electrical controls or the circuit card
  fitted inside a computer.
examples:
- She set the chess board on the table and began to arrange the pieces.
- The children spent the rainy afternoon playing a board game by the fire.
