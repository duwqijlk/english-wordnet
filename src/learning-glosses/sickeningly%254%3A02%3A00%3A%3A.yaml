simpleMeaning: in a way that is very unpleasant and makes you feel strong dislike, or to that degree
scope: Also called disgustingly, distastefully and revoltingly. This word shows a way or a degree that
  is very unpleasant and fills you with strong dislike, not how ill a person feels.
examples:
- The room smelled sickeningly sweet, like old fruit left in the sun.
- The soup was sickeningly salty, and I could not eat another spoonful.
