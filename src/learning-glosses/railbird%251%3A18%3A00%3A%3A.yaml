simpleMeaning: a person who loves racing and watches the races from the edge of the track
scope: A keen fan who watches races from the edge of the track, not a person who bets on races and not
  a rider in a race.
examples:
- The railbird stood by the rail all afternoon, watching race after race.
- Every Saturday the railbird was back at the track to watch the races.
