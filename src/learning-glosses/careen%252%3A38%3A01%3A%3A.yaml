simpleMeaning: to walk in a wild, wobbly way, as if your legs will not do what you tell them
scope: 'Also called stagger, lurch, or reel: to walk as if you cannot keep your steps under control, not
  to walk fast on purpose and not to run.'
examples:
- The drunken man careened into the room.
- She careened down the hallway, grabbing at the wall to stay upright.
