simpleMeaning: the root of a plant with a strong hot taste, cut into small pieces or ground, and used
  to add taste to food
scope: The root itself, used to add taste to food, not the whole plant and not the grated root served
  as a food.
examples:
- She dug up horseradish and cleaned the thick white root.
- The shop sells horseradish root in small bags for cooking.
