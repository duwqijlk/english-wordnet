simpleMeaning: finding out what is wrong with the nerves and muscles by using a machine that charts the
  charge they make
scope: Finding out what is wrong with the nerves and muscles with a machine that charts their charge,
  not the chart itself and not a test of the blood.
examples:
- Electromyography showed that the nerve to his hand was hurt.
- The doctor ordered electromyography to find why her arm felt weak.
