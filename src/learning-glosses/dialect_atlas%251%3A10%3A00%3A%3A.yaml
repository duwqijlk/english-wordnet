simpleMeaning: a book of maps that shows where different ways of speaking are found
scope: A book of maps showing where ways of speaking differ, also called a linguistic atlas; not a book
  of maps of roads or countries, and not the study of ways of speaking.
examples:
- The dialect atlas shows where people say 'bath' with a long vowel.
- She looked in the dialect atlas to find where that word is used.
