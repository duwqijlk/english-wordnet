simpleMeaning: Land ruled in fact by its own people but not accepted as a country by other countries
scope: Land that rules itself in fact but lacks wide welcome as a country, not a free state and not a
  colony; partially-recognized state, state with limited recognition and unrecognized state are other
  names for this sense.
examples:
- The disputed state runs its own affairs but lacks wide welcome.
- Few countries accept the disputed state as a country.
