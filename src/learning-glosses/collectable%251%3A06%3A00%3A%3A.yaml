simpleMeaning: things people think are worth getting and keeping, though they need not be worth much money
  or very old
scope: These are things people think are worth getting and keeping, also called collectible; not the best
  piece in a set, and not only old or dear things.
examples:
- She keeps a shelf of collectables from her travels.
- These old postcards are collectable, though they cost very little.
