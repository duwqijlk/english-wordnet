schema: oewn-learning-gloss-v2
senseId: 'unsyllabic%3:00:00::'
synsetId: 02297470-a
simpleMeaning: 'Not forming a whole speech beat or its core: either a consonant sharing a beat with a
  vowel, or a vowel dominated by another vowel in the same beat.'
scope: The negative quality of a sound that carries no beat of its own, the same sense spelled nonsyllabic,
  not the ordinary syllabic case where the sound does carry one.
examples:
- In fast speech the vowel in 'potato' can become unsyllabic.
- The unsyllabic n in 'botany' is why the word is often said as 'botny'.
