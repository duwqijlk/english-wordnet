senseId: 'wantonness%1:07:00::'
synsetId: 04892593-n
simpleMeaning: Doing as one likes, with nothing held back, no control over oneself, and no care for what
  may follow.
scope: Acting freely without holding back, also called abandon.
examples:
- She danced with a wantonness that surprised everyone.
- His wantonness showed in the way he spent money without a thought.
