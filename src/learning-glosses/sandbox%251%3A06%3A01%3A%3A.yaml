simpleMeaning: a box with sand in it, where the sand is shaped to form metal into a set shape
scope: A box of sand used to shape metal, not a pile of sand or a box of sand for children to play in.
examples:
- The worker shaped the sand in the sandbox before pouring in the metal.
- Metal was poured into the shape made in the sandbox.
