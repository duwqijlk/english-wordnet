simpleMeaning: The skin of its big sweet fruit, deep red-gold in colour, comes off with ease, and the
  woody plant that bears it is grown a great deal in Florida.
scope: This plant is also called king orange, tangor, and temple orange.
examples:
- The temple orange tree bore fruit that peeled with ease.
- They planted a temple orange tree in Florida.
