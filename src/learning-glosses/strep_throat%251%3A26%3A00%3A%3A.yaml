simpleMeaning: an illness in which germs make the back of the mouth and the small glands there sore
scope: 'Also called streptococcal sore throat, streptococcus tonsilitis, septic sore throat, or a throat
  infection: an illness caused by germs in the back of the mouth, not a cold and not a sore mouth from
  shouting.'
examples:
- Strep throat left her with a sore throat and a fever.
- The doctor said the boy had strep throat and gave him medicine.
