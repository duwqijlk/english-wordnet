simpleMeaning: A sweet-smelling long-lived herb of Europe that grows in clumps, with hairy red or purple
  stems, dark green leaves white and soft below, and red-brown flower heads.
scope: 'Also called common mugwort: a sweet-smelling long-lived herb of Europe growing in clumps with
  hairy red or purple stems, not a tree and not a flower grown for its large blooms.'
examples:
- Artemisia vulgaris grew in a thick clump behind the old stone wall.
- The hairy red stems of Artemisia vulgaris stood out among the green leaves.
