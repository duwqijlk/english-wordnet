senseId: 'clinch%1:04:00::'
synsetId: 00060548-n
simpleMeaning: In boxing, when one boxer holds the other for a short time to rest and to keep safe from
  hits
scope: In boxing, a hold used to stop hits and rest for a short time, not a tight loving hold with the
  arms and not a tool that holds things together.
examples:
- The tired boxer went into a clinch to stop the hits and rest.
- In the last round, a long clinch gave him time to breathe.
