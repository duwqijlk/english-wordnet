simpleMeaning: So pleasing to look at or think of that it stirs hope or want in you.
scope: Something so pleasing that it stirs hope or want in you, not a thing that only looks nice.
examples:
- It was a tempting invitation to spend the summer abroad.
- The tempting smell of fresh bread drew her into the shop.
