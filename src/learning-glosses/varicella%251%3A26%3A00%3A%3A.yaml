simpleMeaning: A rash of small blisters on the face and body marks this sudden sickness, spread from person
  to person by the chickenpox virus.
scope: 'Also called chickenpox: a sudden sickness spread from person to person by the chickenpox virus,
  marked by a rash of small blisters on the face and body.'
examples:
- Varicella left a rash of blisters on the child's face.
- She caught varicella from a classmate.
