simpleMeaning: 'A card game: chips go on an ace, king, queen, jack of four suits; players lay higher cards
  until the run stops, and matching a table card wins its chips.'
scope: A gambling card game in which chips go on high cards and rising runs win; also called stops, boodle,
  Chicago, and Michigan.
