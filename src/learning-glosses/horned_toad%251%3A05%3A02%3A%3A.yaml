simpleMeaning: Covered in prickly scales and with sharp points on its head, this lizard of the west of
  North America eats insects.
scope: Also called a horned lizard and a horny frog, this insect-eating lizard of the west of North America
  is known by the sharp points on its head and the prickly scales over its body.
examples:
- The horned toad stayed still, its prickly scales hard to spot.
- A horned toad caught a fly that came too close.
