simpleMeaning: to change a thing or put it in a new order, above all to bring it up to date and make it
  better
scope: Changing a thing to bring it up to date, not merely going over it to fix small errors.
examples:
- We must revise the town's plan to meet the new rules.
- The writer will revise the book before it goes to print.
