simpleMeaning: A plant that lives for years and spreads by bulbs, tubers or corms under the ground
scope: This is a plant that lives for years and spreads by bulbs, tubers or corms under the ground, not
  a plant grown from seed each year and not a tree.
examples:
- The geophyte sends up new shoots each spring.
- Gardeners lift the geophyte bulbs in autumn.
