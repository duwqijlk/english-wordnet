simpleMeaning: To go along with what another person asks, keeping to their rules, orders, or wishes.
scope: 'Also called follow: to go along with what another person asks, keeping to their rules, orders,
  or wishes, not merely to agree in words.'
examples:
- She complied with the new rules without complaint.
- You must comply with the safety orders.
