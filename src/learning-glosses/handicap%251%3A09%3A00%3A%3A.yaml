simpleMeaning: something you cannot see or touch that gets in the way of action and makes progress slower
scope: 'Also called check, balk, deterrent, hindrance, impediment and baulk: something not seen or touched
  that slows work or progress, not a help in a race and not a body or mind condition.'
examples:
- Lack of money was a real handicap for the small shop.
- Fear was a handicap that stopped her from trying new work.
