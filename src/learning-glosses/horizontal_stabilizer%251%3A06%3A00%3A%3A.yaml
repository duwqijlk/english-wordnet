simpleMeaning: This fixed, flat wing on a plane's tail has a small flap hinged to it that lifts or lowers
  the tail.
scope: People also call this fixed, flat wing on a plane's tail a tailplane or a horizontal stabiliser.
examples:
- The pilot checked the horizontal stabilizer before take-off.
- A fault in the horizontal stabilizer made the tail hard to control.
