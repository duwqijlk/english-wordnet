simpleMeaning: Waking, sleep, paying attention and muscle tone all involve a tangled web of nerve cells
  deep in the middle of the brainstem, which watches over the body
scope: It is a web of nerve cells deep in the brainstem, not the whole brain and not one nerve on its
  own.
examples:
- The reticular formation helps the body wake up.
- The reticular formation watches over the body while we sleep.
