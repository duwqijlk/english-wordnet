senseId: 'medicine%2:29:00::'
synsetId: 00083983-v
simpleMeaning: To treat someone medically, as with a drug or other remedy.
scope: 'This is the rare verb: to give medicine or treat medically. It is not the noun for the substance,
  for the profession, or for the practice of medicine. Archaic and dialectal; it survives in older writing
  and alongside the related verb ''medicate''.'
examples:
- The shepherd medicined the sick lambs with a bitter draught.
- They medicined the wound with a paste of herbs.
