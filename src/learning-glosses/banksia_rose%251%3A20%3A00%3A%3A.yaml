simpleMeaning: a climbing plant from China that keeps its leaves all year and has single yellow or white
  flowers
scope: A climbing rose from China that keeps its leaves all year, with single yellow or white flowers,
  not a rose that loses its leaves in winter and not a garden rose with full double blooms.
examples:
- The banksia rose climbed over the garden wall in a mass of yellow blooms.
- She planted a banksia rose beside the fence for its white spring flowers.
