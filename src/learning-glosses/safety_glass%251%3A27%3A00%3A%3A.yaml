simpleMeaning: a clear sheet made with layers of plastic or resin or other material between two sheets
  of clear hard material so it will not break into pieces
scope: 'Also called laminated glass and shatterproof glass: clear panes that will not break into pieces,
  not ordinary window panes and not a drinking glass.'
examples:
- The windscreen was made of safety glass that held together after the crash.
- They fitted safety glass in the doors so it would not shatter.
