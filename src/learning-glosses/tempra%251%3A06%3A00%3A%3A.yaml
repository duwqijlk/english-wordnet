simpleMeaning: A pain-killing drug for mild pain, not for swelling; it is also used to bring down fever,
  and it is one brand name for acetaminophen tablets.
scope: Also called acetaminophen, and also sold as Anacin III, Datril, Panadol, Phenaphen, and Tylenol;
  a drug for mild pain and fever, not a drug for swelling and not a drug that puts you to sleep.
examples:
- She took two Tempra tablets for her headache.
- Tempra helped bring down his fever.
