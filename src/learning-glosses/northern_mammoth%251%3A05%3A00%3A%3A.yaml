simpleMeaning: A very hairy great animal like an elephant, common in the colder parts of the north of
  the world
scope: A very hairy great animal like an elephant of the colder north; not a living elephant, and not
  a hairless kind of the same animal.
examples:
- The northern mammoth lived in the cold lands of the far north.
- Bones of a northern mammoth were found frozen in the ice.
