simpleMeaning: a bag made of paper or plastic that a shop gives you to carry the things you buy
scope: A paper or plastic bag for carrying things bought in a shop, also called a poke, not the amount
  inside such a bag and not the act of losing a job.
examples:
- She put the bread in a paper sack.
- The shop gave him a plastic sack for his books.
