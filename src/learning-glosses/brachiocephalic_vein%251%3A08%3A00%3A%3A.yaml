simpleMeaning: blood tubes made when the tube from the neck and the tube from under the collarbone join
  into one
scope: 'Also called innominate vein: blood tubes made where the neck and collarbone tubes join, not the
  tubes that carry blood from the legs and not the tubes that carry blood out from the heart.'
examples:
- The brachiocephalic vein carries blood from the head and arm toward the heart.
- A scan showed a clot in the brachiocephalic vein.
