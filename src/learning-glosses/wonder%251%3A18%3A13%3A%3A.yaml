simpleMeaning: A person of remarkable intelligence who comes up with fresh, original ideas.
scope: This sense is a remarkably clever and original person, not the feeling of surprise, not a thing
  that causes surprise, not the wish to learn more about something, and not any verb use (wanting to know,
  doubting or speculating, being amazed).
examples:
- The boy wonder finished his university degree at fifteen.
- At school she was a wonder, working through advanced calculus on her own.
