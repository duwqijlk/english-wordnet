simpleMeaning: a sodium compound of carbonic acid, used in making soap powders and glass and paper
scope: 'Also called soda, soda ash, sodium carbonate, or washing soda: a sodium compound used in making
  soap, glass, and paper, not table salt and not baking soda.'
examples:
- She used sal soda to soften the wash water.
- Sal soda goes into soap powders and glass.
