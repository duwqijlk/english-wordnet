simpleMeaning: a rough-haired herb of eastern and central North America, with black fruit and bark used
  as medicine
scope: A rough-haired herb of eastern and central North America, also called bristly sarsaparilla and
  bristly sarsparilla; not the low European herb with pink flowers and a bad smell.
examples:
- The dwarf elder grows in woods across eastern North America.
- Dwarf elder bark was once used as medicine.
