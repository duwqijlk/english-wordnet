simpleMeaning: A thin liquid, like the liquid part of blood, with white blood cells and fat from food;
  it can thicken and clot, and small tubes carry it to the blood
scope: A thin liquid inside the body that helps carry white blood cells, not blood itself and not the
  clear part of blood it is like.
examples:
- Lymph carries white blood cells around the body.
- Small tubes carry lymph through the body to the blood.
