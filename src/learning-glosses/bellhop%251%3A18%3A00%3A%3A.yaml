simpleMeaning: a person who works in a hotel, running small jobs for guests and carrying their bags
scope: A worker in a hotel who carries bags and runs small jobs for guests; not the person at the front
  desk who gives out rooms, and not a guest staying at the hotel.
examples:
- The bellhop carried our bags up to our room.
- A bellhop met us at the hotel door and took our cases.
