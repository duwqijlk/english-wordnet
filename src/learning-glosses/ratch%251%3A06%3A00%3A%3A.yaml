synsetId: 04062292-n
simpleMeaning: This mechanical device is a toothed wheel or rack held by a small catch so it can move
  in one way only.
scope: Also called ratchet and rachet, this mechanical device is a toothed wheel or rack held by a small
  catch so it can turn in one way only, not a wheel that turns freely both ways.
examples:
- The ratch held the wheel so it could turn in one way only.
- He used a ratch to keep the wheel from turning back.
