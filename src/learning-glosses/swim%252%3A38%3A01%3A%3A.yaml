simpleMeaning: to stay up in water or other liquid, on top of it or just under it, and not go down to
  the bottom
scope: 'Also called float: to stay up in a liquid without going down, not to move through water by moving
  arms and legs.'
examples:
- The leaf can swim on the top of the pond.
- A cork will swim in the water and not sink.
