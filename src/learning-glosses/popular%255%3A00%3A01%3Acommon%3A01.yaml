simpleMeaning: made for or aimed at ordinary people as a whole, not just a small expert group.
scope: Not the sense of being liked by many people; here it is about being made for or aimed at the general
  public.
examples:
- He writes popular science books for the general reader.
- The party promised popular reforms that would help ordinary families.
