simpleMeaning: The state of not staying steady and not being able to make up your mind
scope: The state of not staying steady and not being able to make up your mind; not the fact that something
  cannot be trusted because it is unsteady.
examples:
- The instability of his moods made it hard to work with him.
- Her instability showed in the way she changed her plans every day.
