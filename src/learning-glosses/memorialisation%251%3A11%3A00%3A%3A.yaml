senseId: 'memorialisation%1:11:00::'
synsetId: 07467451-n
simpleMeaning: A formal act held to keep alive the thought of a person or thing from the past
scope: A formal act that honours a person or thing of the past, also called memorialization; not a grave
  itself and not a written account of the past.
examples:
- The town held a memorialisation for the soldiers lost in the war.
- A memorialisation took place at the old hall each year.
