simpleMeaning: of the eye or ear, for example, without the help of any tool for seeing or hearing
scope: This is about the eye or ear working without a tool for seeing or hearing, not about a body with
  no clothes on, and not about a feeling or aim shown plainly with nothing hidden.
examples:
- The star is too small to see with the naked eye.
- You can hear it with the naked ear if you stand close.
