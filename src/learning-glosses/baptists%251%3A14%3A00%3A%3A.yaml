simpleMeaning: Any of several Protestant groups that stress the good news and hold that only people who
  choose for themselves should be baptised.
scope: This is any of several Protestant groups that stress the good news and hold that only people who
  choose for themselves should be baptised; Baptist Church is another name for it, and it is not a church
  that baptises babies or a Catholic church.
examples:
- The Baptists baptise only people who choose for themselves.
- He grew up among the Baptists and was baptised as an adult.
