simpleMeaning: a person who is part of the third of the four main Hindu castes, the group of traders and
  people in skilled work
scope: A person in the third of the four main Hindu castes, the caste of traders and people in skilled
  work, and not a member of one of the other three main castes.
examples:
- A Vaisya traditionally worked in trade or a profession.
- The Vaisya caste ranks third among the four main castes.
