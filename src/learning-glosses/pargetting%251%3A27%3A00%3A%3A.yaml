simpleMeaning: A coat of plaster spread over outside walls and inside smoke shafts.
scope: A coat of plaster for outside walls and smoke shafts, also called parget and pargeting; not paint
  and not the brickwork itself.
examples:
- The builder spread pargetting over the old cottage wall.
- Fresh pargetting lined the chimney.
