simpleMeaning: To understand the true character of something and then express or copy it exactly.
scope: This is about capturing something's character accurately, not about reaching someone by phone,
  catching them, or becoming ill.
examples:
- Her photographs really get the mood of the old town.
- The actor got the character's accent exactly right.
