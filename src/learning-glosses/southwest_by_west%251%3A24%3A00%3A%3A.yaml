simpleMeaning: The compass point one step clockwise from the point halfway between the setting sun and
  south
scope: A compass point one step clockwise from the south-west point, not that point itself and not the
  point two steps away.
examples:
- The ship held a course of southwest by west.
- Southwest by west lies just past southwest on the compass.
