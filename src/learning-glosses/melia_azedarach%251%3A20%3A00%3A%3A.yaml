simpleMeaning: A tree of northern India and China with purple blossoms and small yellow fruits that cannot
  be eaten, now settled in the southern United States where it gives shade.
scope: Chinaberry, azedarach, azederach, chinaberry tree, China tree, Melia azederach, Persian lilac and
  pride-of-India are other names for this sense; it is not a tree with edible fruit.
examples:
- The Melia azedarach in the yard gave deep shade in summer.
- We planted a Melia azedarach for its purple blossoms.
