simpleMeaning: a drug made from a periwinkle plant, sold as Oncovin, that treats cancer of the lymph glands
scope: A plant drug for cancer of the lymph system, not its sister drug vinblastine, which stops cells
  from splitting.
examples:
- Vincristine was part of her treatment for cancer of the lymph glands.
- The doctor chose vincristine because it works on cancers of the lymph system.
