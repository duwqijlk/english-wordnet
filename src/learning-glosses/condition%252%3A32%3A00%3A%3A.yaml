simpleMeaning: To state in a contract or agreement that something must be done or supplied, and to make
  that demand clearly.
scope: This is about writing a requirement into a formal agreement, not about training someone's behavior,
  creating a learned reflex, or naming a premise.
examples:
- The contract conditions payment on delivery of the goods.
- The agreement conditions the loan on an independent audit.
