simpleMeaning: after death, a person's soul starts a new round of life in a different human body
scope: This sense is a soul starting a new life in a new body after death, not the deep change in faith
  that makes a person live in a new way in this life.
examples:
- In this belief, rebirth means the soul lives again in a new body after death.
- They believe in rebirth and that each person has lived many lives before.
