simpleMeaning: The act of getting in the way of the work of the law-making body of the United States on
  purpose.
scope: The act of getting in the way of the work of the law-making body of the United States on purpose;
  it is a crime against the legislature, not a crime against a court.
examples:
- He was charged with contempt of Congress for refusing to answer questions.
- Contempt of Congress can lead to a fine or prison.
