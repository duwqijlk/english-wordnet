simpleMeaning: a small animal like a spider, with a round body and very thin legs that stretch far out
scope: Also called a harvestman, it is a spiderlike creature with a small round body and very thin legs,
  not a true spider and not the long-legged fly of the same name.
examples:
- A daddy longlegs hung from the ceiling by one thin leg.
- We found a daddy longlegs hiding behind the curtain.
