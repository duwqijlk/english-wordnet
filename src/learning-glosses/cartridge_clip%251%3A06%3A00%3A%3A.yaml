simpleMeaning: A metal box that holds bullets in their cases and slides into a gun that fires again and
  again with one pull of the trigger.
scope: A metal box that holds bullets in their cases and slides into a gun that fires again and again
  with one pull of the trigger, also called magazine, clip or cartridge holder; not a box for holding
  loose bullets, and not a part of the gun itself.
examples:
- He slid a fresh cartridge clip into the rifle.
- The cartridge clip holds ten rounds.
