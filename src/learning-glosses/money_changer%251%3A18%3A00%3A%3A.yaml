simpleMeaning: A person whose work is to swap the coins and notes of one land for those of another land
scope: This is a person whose work is swapping the coins and notes of one land for those of another; exchanger
  is another name for this sense, and not a trader of goods or a clerk who only keeps deposits.
examples:
- The money changer gave me local coins for my dollars.
- Ask the money changer at the airport for the best rate.
