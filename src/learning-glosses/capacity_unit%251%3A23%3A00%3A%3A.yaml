simpleMeaning: a fixed amount used to state the size of what a container can hold
scope: A fixed amount used to state the size of what a container can hold; capacity measure and volume
  unit are other names for this sense; not a unit of length, and not a unit of weight.
examples:
- A gallon is a capacity unit still used in some places.
- The recipe gave the amount in an old capacity unit.
