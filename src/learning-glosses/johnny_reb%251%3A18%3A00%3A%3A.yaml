simpleMeaning: A name the Union men gave in the American Civil War to men who fought for the South, also
  called greyback from their grey uniforms.
scope: 'Also called greyback, Rebel, Johnny and Reb: a name the Union men gave in the American Civil War
  to men who fought for the South, also called greyback from their grey uniforms; this is the Civil War
  name, not a name for soldiers of other wars.'
examples:
- Johnny Reb fought for the South in the American Civil War.
- The Union men called him Johnny Reb, and his grey uniform gave him the name greyback.
