simpleMeaning: A tree bearing large brown nuts that hold caffeine, the source of the flavouring for a
  dark sweet drink.
scope: Also called goora nut, kola, kola nut and kola nut tree, this is a tree whose nuts flavour a dark
  sweet drink, not the cacao tree whose beans make chocolate.
examples:
- The Cola acuminata bears large brown nuts.
- Cola acuminata nuts give the flavouring for cola drinks.
