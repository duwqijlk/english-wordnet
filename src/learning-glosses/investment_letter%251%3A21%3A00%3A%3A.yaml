simpleMeaning: a written promise that a share bought without public listing is bought to keep, not to
  sell on, so no filing with the SEC, the share-dealing body, is needed
scope: A written promise that a share bought without public listing is bought to keep, not to sell on;
  not a letter offering to buy shares and not a share certificate.
examples:
- The buyer signed an investment letter for the unlisted shares.
- An investment letter showed the shares were bought to keep.
