simpleMeaning: a flat sea creature with both eyes on the left side and a tail that narrows to a point,
  of little worth to sellers
scope: A flat sea creature with both eyes on the left side and a tail that narrows to a point, also called
  a tonguefish; not a round sea creature, and not one caught and sold for much money.
examples:
- The tongue-fish lay flat on the sand, both eyes on its left side.
- Fishermen caught a tongue-fish, but it was worth little at the market.
