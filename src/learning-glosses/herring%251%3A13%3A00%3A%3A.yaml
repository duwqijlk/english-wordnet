simpleMeaning: the flesh of a fat fish from the shallow seas in the north of the Atlantic or Pacific,
  prized as food and usually kept in salt or vinegar
scope: This is the flesh of a fat fish from the shallow northern seas, not the living fish itself.
examples:
- We ate herring with potatoes.
- Pickled herring was served at lunch.
