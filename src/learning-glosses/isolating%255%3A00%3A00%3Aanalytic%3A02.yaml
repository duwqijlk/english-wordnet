simpleMeaning: describing a language where each word typically shows one idea and one kind of word, and
  links between words are decided almost only by word order and helper words
scope: This describes a kind of language, not the act of keeping a person or thing alone and apart from
  others.
examples:
- In an isolating language, word order shows how words are linked to each other.
- Teachers used short sentences to show how an isolating language puts one idea in each word.
