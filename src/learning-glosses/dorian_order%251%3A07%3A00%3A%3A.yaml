simpleMeaning: The oldest and plainest style of Greek column, the only one that often has no foot
scope: This is the oldest and plainest style of Greek column, the only one that often has no foot; Doric
  order is another name for it, and it is not a later and fancier style of Greek column.
examples:
- The Dorian order has plain columns with no foot.
- Greek temples in the Dorian order look simple and strong.
