simpleMeaning: a tree that loses its leaves in winter, gives shade, has small black berries, grows in
  the south of the United States, and gives soft pale yellow wood
scope: This is a shade tree of the southern United States with small black berries, not a bush with red
  berries and not a tree grown for hard wood.
examples:
- A sugarberry shades the yard in summer.
- The sugarberry dropped its black berries on the path.
