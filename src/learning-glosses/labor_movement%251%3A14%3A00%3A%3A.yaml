simpleMeaning: A joint push by workers, above all through unions, to improve their standing, or the leaders
  of that push.
scope: A joint push by workers, above all through unions, to improve their standing, also called labor,
  or the leaders of that push; not one strike and not one union alone.
examples:
- The labor movement won shorter hours for workers.
- She wrote a book about the labor movement in her country.
