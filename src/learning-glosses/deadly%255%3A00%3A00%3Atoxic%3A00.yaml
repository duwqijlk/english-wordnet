simpleMeaning: so poisonous that it can cause great harm, made by a creature that puts its poison into
  a bite or sting
scope: So poisonous that it can cause great harm, not just able to kill in any way and not a sin that
  cuts a person off from God.
examples:
- The deadly snake gave a bite that made the man very ill.
- The deadly scorpion gave a sting that made the child very ill.
