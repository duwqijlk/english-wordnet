simpleMeaning: stringy tissue in a sheet or a band that binds muscles and organs together or keeps them
  apart, and more
scope: Also called facia, this is a thin sheet of tissue in the body, not the panel of dials and controls
  in a car or plane.
examples:
- The fascia around the muscle holds it in place.
- Surgeons cut through the fascia to reach the organs beneath.
