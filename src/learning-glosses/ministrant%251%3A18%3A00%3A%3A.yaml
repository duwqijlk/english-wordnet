simpleMeaning: A person who carries out the work of a minister
scope: A person who carries out the work of a minister, not a person who leads a government department
  and not a person who merely attends a service.
examples:
- The ministrant helped the priest during the service.
- As a ministrant, he served at the altar each Sunday.
