senseId: 'well%4:02:01::'
synsetId: 00012591-r
simpleMeaning: In a calm, good-humored way, without becoming unusually upset or resentful.
scope: This is not about doing something skillfully or pleasingly, and not about being healthy; it describes
  accepting something without upset or resentment.
examples:
- She took the bad news well and asked what she could do to help.
- He lost the match but took it well, shaking hands with his opponent.
