simpleMeaning: Most often found as old hard remains in the ground, this sticky stuff from New Zealand
  trees is gathered to give wood a bright finish and to cover floors.
scope: Kauri, kauri gum, and kauri resin are other names for this sticky stuff from New Zealand trees,
  found most often as old hard remains in the ground and gathered to give wood a bright finish and to
  cover floors.
examples:
- They found a lump of kauri copal buried in the ground.
- They gathered kauri copal to make varnish for wooden floors.
