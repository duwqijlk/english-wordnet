senseId: 'clubroot_fungus%1:20:00::'
synsetId: 13004414-n
simpleMeaning: a fungus like a slime mold that makes the roots of cabbages and related plants swell or
  grow out of shape
scope: A fungus that swells cabbage roots out of shape, not a mold that rots leaves and not a worm that
  eats roots.
examples:
- Clubroot fungus made the cabbage roots swell into lumps.
- The clubroot fungus spread through the whole cabbage bed.
