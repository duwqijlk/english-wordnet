simpleMeaning: The biggest hunting bird of Europe and Asia, with black feathers hanging around its beak.
scope: The biggest hunting bird of Europe and Asia, with black feathers hanging around its beak; bearded
  vulture and lammergeyer are other names for this sense, not a smaller hunting bird, and not an eagle
  with a white head.
examples:
- A lammergeier circled high above the mountain valley.
- The lammergeier dropped a bone onto the rocks below.
