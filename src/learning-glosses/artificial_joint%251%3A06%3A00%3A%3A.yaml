simpleMeaning: Surgeons put in this metal or plastic part to take the place of a bending body part, usually
  the hip or knee, at times the elbow or wrist.
scope: A man-made part that takes the place of a bending body part, not the body part itself.
examples:
- Her artificial joint let her walk without pain.
- The artificial joint in his knee was made of metal.
