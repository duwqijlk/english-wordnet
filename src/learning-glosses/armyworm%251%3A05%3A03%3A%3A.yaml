simpleMeaning: Cereals and other grains are eaten bare by the young of a small fly, which then move on
  together in neat lines when nothing is left to eat.
scope: This is the young of a small fly that eats grain bare and then moves on in neat lines, not the
  young of a night moth.
examples:
- The farmer found armyworm eating the wheat in the field.
- When the grain was gone, the armyworm moved on in neat lines.
