senseId: 'close-up%1:06:01::'
synsetId: 90011001-n
simpleMeaning: a photo or other picture in which the thing shown fills most or all of the picture and
  looks large
scope: A picture that fills the frame with its subject, not a wide view of a place and not a small detail
  lost in a large scene.
examples:
- The close-up showed her face filling the whole screen.
- We took a close-up of the flower so its petals filled the photo.
