simpleMeaning: a sickness from a worm-like animal of the group Schistosoma that lives in the body, common
  in the tropics and Far East; signs change with the part hit
scope: 'Also called bilharzia and bilharziasis: a sickness from a worm-like animal that lives in the body,
  not a sickness caught from bad food and not a cold.'
examples:
- Schistosomiasis is common in the tropics, where the worm-like animal lives in still water.
- He was treated for schistosomiasis after swimming in a river in the Far East.
