simpleMeaning: a colourless poison made by living things that forms crystal bits, found in oxalis and
  other plants; used to whiten things, take rust off, and test things in a lab
scope: A poison found in plants and used to whiten things and take rust off, also called ethanedioic acid;
  not a poison from animals and not a common kitchen cleaner.
examples:
- Oxalic acid can take rust off an old tool.
- The gardener warned us that oxalic acid is a poison found in some plants.
