schema: oewn-learning-gloss-v2
senseId: 'demonstrate%2:32:00::'
synsetId: 00822637-v
simpleMeaning: to be clear proof of something, shown by facts or by the way a person acts, thinks or looks
scope: Also called evidence and manifest; this is proof shown by facts or by how a person acts or looks,
  not proof made by an example, an explanation or a test, and not marching in protest.
examples:
- His shaking hands demonstrated his fear.
- Her kind acts demonstrated her love for her family.
