simpleMeaning: It hits a person hard and makes them see and hear things that are not there
scope: 'Also called mind-blowing: it hits a person hard and makes them see things that are not there;
  not a mild change in mood like mind-altering, and not a wider sense of things like mind-expanding.'
examples:
- Her mind-bending visions made her see faces that were not there.
- He took a mind-bending drug and saw colours that were not there.
