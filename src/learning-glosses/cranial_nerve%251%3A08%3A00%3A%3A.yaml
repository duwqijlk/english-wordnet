simpleMeaning: any one of the 12 pairs of thin cords that start in the lower part of the brain and carry
  messages through the body
scope: One of the 12 pairs of cords that start in the brain stem, not a cord in the arm or leg and not
  a part of the spinal cord.
examples:
- The doctor tested a cranial nerve that controls the face.
- Damage to a cranial nerve can change how a person swallows.
