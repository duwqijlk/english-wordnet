simpleMeaning: a narrowing that should not be there in the opening that leads from the right lower part
  of the heart into the main blood tube to the lungs
scope: A narrowing that should not be there in the opening from the right lower part of the heart into
  the blood tube to the lungs, not a narrowing of the heart's other openings and not a healthy heart.
examples:
- The baby was born with pulmonary stenosis, so blood could not flow well to the lungs.
- Doctors found pulmonary stenosis when they checked the opening from her heart.
