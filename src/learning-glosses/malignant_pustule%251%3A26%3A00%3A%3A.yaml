simpleMeaning: The skin form of anthrax starts as a small bump that becomes a blister and releases poisons,
  then brings severe vomiting, high fever, heavy sweating and often death.
scope: This names the same skin disease as cutaneous anthrax, not the lung form caught by breathing spores.
examples:
- In the past, doctors called the sore on a wool handler's arm a malignant pustule.
- Malignant pustule is an old name for the skin form of anthrax.
