simpleMeaning: To give tooth work a firm base and hold metal caps and fillings fast for good, dentists
  still use this very old sticky mix widely.
scope: Also called zinc phosphate dental cement, this old sticky mix holds metal caps and fillings in
  place and forms a base under tooth work, and is not the cap or filling itself.
examples:
- The dentist used zinc phosphate cement to fix the crown in place.
- Zinc phosphate cement has held metal fillings in place for many years.
