simpleMeaning: the quality of being a single person with your own way of being, different from others
scope: 'Also called individuality and individuation: this is the quality of being one person in your own
  way, not the belief that each person should be free and stand on their own.'
examples:
- Her individualism showed in her odd clothes and her own way of speaking.
- His individualism made his paintings unlike anyone else's work.
