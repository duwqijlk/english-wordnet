simpleMeaning: small flower buds kept in salty water or vinegar, used to give a sharp taste to many kinds
  of food and sauces
scope: These are the small buds eaten as food; not the plant itself, not a playful jump, and not a fun
  or silly act.
examples:
- She added capers to the fish and lemon sauce.
- Capers give the salad a sharp, salty taste.
