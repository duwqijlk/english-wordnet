simpleMeaning: To think of something, or show it, as perfect, better than it really is
scope: 'Also called idealize: to treat a thing as perfect, not to see its faults and not merely to form
  ideals.'
examples:
- She idealized her husband after his death.
- He tends to idealise his teachers and forget their faults.
