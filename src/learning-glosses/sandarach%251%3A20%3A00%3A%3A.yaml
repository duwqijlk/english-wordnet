simpleMeaning: A resin that breaks easily, faintly sweet-smelling and clear to see through, used to make
  varnish.
scope: A clear resin for varnish, also called sandarac; not the hard wood of the same name and not amber,
  a hard resin from trees.
examples:
- The artist mixed sandarach into her varnish.
- Sandarach dries to a clear, hard coat.
