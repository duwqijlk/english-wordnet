simpleMeaning: A ground-hugging plant found only in Hawaiian volcanic craters, with rings of narrow pointed
  silver-green leaves and clusters of many red-purple flowers on a tall stem.
scope: A plant of Hawaiian volcanic craters with leaf rosettes and a tall flower stem, not a yucca or
  an agave.
examples:
- The silversword grows only in volcanic craters on Hawaii.
- The silversword's narrow, pointed leaves grow in rings.
