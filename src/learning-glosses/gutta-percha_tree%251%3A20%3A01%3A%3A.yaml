simpleMeaning: Any of several trees from the East Indies that produce gutta-percha, namely the kinds known
  as getah taban merah or getah taban sutra (Palaquium gutta).
scope: This is the tree itself, not the gutta-percha it yields; it is one of several East Indian trees
  that supply that material.
examples:
- The gutta-percha tree was tapped for its latex.
- Farmers planted gutta-percha trees along the ridge.
