simpleMeaning: the most used chip, holding the bits programs need while it runs; bits can be put in or
  taken out in any order, and all are reached as fast
scope: Also called random-access memory, random access memory, and read/write memory; the short-term working
  store of a computer, not the disk that keeps files when the machine is off.
examples:
- The computer's random memory holds the program I am using right now.
- When the power goes off, everything in random memory is lost.
