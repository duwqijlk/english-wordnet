simpleMeaning: 'Its note changes when the top skin is pulled tighter or left looser: a big half-ball drum
  of brass or copper that players strike.'
scope: Also called kettle, kettledrum, timpani, and tympanum, this big half-ball drum of brass or copper
  is tuned by tightening or loosening its top skin.
examples:
- The tympani boomed low and deep.
- She tuned the tympani by tightening its top skin.
