simpleMeaning: A speech sound made with air coming out of the mouth, not out of the nose
scope: A mouth sound in speech, not a nose sound and not a pill taken by mouth.
examples:
- The letter b is an oral consonant, made with air from the mouth.
- An oral consonant lets air out through the mouth, not the nose.
