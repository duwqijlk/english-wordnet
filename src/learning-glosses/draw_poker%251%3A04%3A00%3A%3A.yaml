simpleMeaning: a card game in which a player can give back cards and get new ones from the dealer
scope: 'Also called draw: a card game where players swap cards with the dealer, not a game where all cards
  are kept and not a game with no dealer.'
examples:
- We played draw poker all evening, swapping cards to improve our hands.
- She won the draw poker game after she threw away two cards and got a pair.
