simpleMeaning: The corresponding body part in an animal, the same passage a person has at the front of
  the neck.
scope: The animal's counterpart of the human passage, not the human structure itself or the channel inside
  a container.
examples:
- The vet shone a light down the dog's throat.
- The bird's throat swelled as it sang.
