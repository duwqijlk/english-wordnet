simpleMeaning: Most often in the lower back, this sore tear in the tough springy stuff of the pad between
  the small bones of the back brings pain.
scope: This painful tear in the pad between the bones of the back, most often low down, is also called
  a herniated disc or a slipped disc.
examples:
- He has a ruptured intervertebral disc in his lower back.
- Her ruptured intervertebral disc hurt most in the lower back.
