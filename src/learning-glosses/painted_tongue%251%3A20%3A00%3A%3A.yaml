simpleMeaning: A Chilean herb whose velvety, funnel-shaped flowers are yellowish or violet, with long
  tongue-like styles (the female stalks) at the throat of each bloom.
scope: Another name for Salpiglossis sinuata; it is this Chilean herb, not an actual painted tongue.
examples:
- The painted tongue in the garden bed opened velvety violet flowers.
- Painted tongue comes from Chile and bears velvety, funnel-shaped flowers.
