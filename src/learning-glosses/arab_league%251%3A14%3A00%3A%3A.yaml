simpleMeaning: A group of free states of one people, set up in 1945 to work together on culture, money,
  war, rule, and how their people live
scope: A group of free states of one people that joined in 1945 to work together, not a group of states
  from a single country and not a trade group alone.
examples:
- The Arab League met in Cairo to talk about trade.
- Egypt was one of the first members of the Arab League.
