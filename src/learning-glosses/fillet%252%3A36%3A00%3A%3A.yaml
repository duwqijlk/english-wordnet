senseId: 'fillet%2:36:00::'
synsetId: 01682852-v
simpleMeaning: to decorate something with lace that has a pattern made of shapes such as squares and circles
scope: Also called filet. This is a verb, to decorate with patterned lace; it is not the noun for a piece
  of beef or fish, and not a headband.
examples:
- She filleted the border of the tablecloth with lace in a diamond pattern.
- They filleted the edge of the cover with a lace of small squares.
