simpleMeaning: a feeling of very great suffering, with strong pain in the mind or in the body
scope: 'Also called torture, and another name for it is torment: a feeling of very great suffering and
  strong pain, not a small pain or a short worry.'
examples:
- He was in agony after breaking his leg.
- She waited in agony for news of her missing son.
