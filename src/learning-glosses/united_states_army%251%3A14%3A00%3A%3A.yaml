simpleMeaning: The land arm of the country's armed services, which puts soldiers in order and trains them
  to fight on land.
scope: The land arm of the country's armed services, also called Army, U. S. Army, US Army, and USA; not
  the flying arm, the navy, or other armed services.
examples:
- He served in the United States Army.
- The United States Army trains soldiers for land warfare.
