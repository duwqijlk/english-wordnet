simpleMeaning: often in the plural, an instruction from someone in charge that must be carried out
scope: This is a command from a person in charge, not a request for goods, a court decision, a state of
  proper arrangement, or the act of arranging things.
examples:
- The captain gave the order to retreat.
- Soldiers must obey orders from their commander.
