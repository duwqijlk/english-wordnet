simpleMeaning: a short, sharp sound, as when two things hit each other; it may happen again
scope: 'Also called clack: this is the short, sharp sound itself, not the act of hitting hands together
  and not a sudden very loud noise.'
examples:
- A loud clap came from the two boards hitting together.
- We heard three sharp claps as the sticks struck each other.
