simpleMeaning: a jacket-like piece of clothing that ties the arms tight against the body to hold back
  a violent person
scope: 'Also called straightjacket: a real piece of clothing used to hold a violent person, not a rule
  or limit that stops a person from acting freely.'
examples:
- The nurses put the patient in a straitjacket for his safety.
- He could not move his arms in the straitjacket.
