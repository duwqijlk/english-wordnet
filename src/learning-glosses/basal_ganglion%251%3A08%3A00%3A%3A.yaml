simpleMeaning: Movements a person makes on purpose seem to be steered by one of several lumps of grey
  nerve tissue low down in each half of the brain
scope: The sense here is one of several lumps of grey nerve tissue low down in each half of the brain,
  the kind that seems to help steer movements made on purpose.
examples:
- Her basal ganglion seemed to play a part in the way she moved her hand on purpose.
- When he lifted his arm on purpose, a basal ganglion helped steer the lift.
