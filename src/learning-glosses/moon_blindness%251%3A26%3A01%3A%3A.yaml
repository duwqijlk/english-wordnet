simpleMeaning: Not being able to see well in dim light, from too little vitamin A or from a fault in the
  back of the eye
scope: 'Night blindness and nyctalopia are other names for this sense: not seeing well in dim light, not
  the eye inflammation of horses that bears the same name.'
examples:
- Moon blindness made it hard for him to see at dusk.
- A lack of vitamin A can bring on moon blindness.
