simpleMeaning: A headache with tingling or burning feelings and sweating, brought on by eating food with
  monosodium glutamate in it.
scope: 'It is named for the food it follows: the signs come after eating food with monosodium glutamate
  in it.'
examples:
- After the meal she had Chinese restaurant syndrome, her head aching and her skin tingling.
- Chinese restaurant syndrome left him sweating, with a headache and a tingling feeling.
