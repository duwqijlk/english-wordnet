simpleMeaning: A piece of music written to go with a Hungarian dance.
scope: Also called czardas; music written for a Hungarian dance, not a piece in the rhythm of that dance
  and not a folk song.
examples:
- The orchestra played a csardas written for the Hungarian dance.
- She wrote a csardas to go with the Hungarian dance.
