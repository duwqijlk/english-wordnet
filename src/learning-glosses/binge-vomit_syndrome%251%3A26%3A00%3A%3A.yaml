simpleMeaning: A food ill where one shifts between keen hunger and disgust at food, shown by overeating
  and then bouts of fasting or self-made sickness.
scope: This sense is also called binge-purge syndrome, bulimarexia, and bulimia nervosa, a food ill where
  one shifts between keen hunger and disgust at food, shown by overeating and then bouts of fasting or
  self-made sickness.
examples:
- Binge-vomit syndrome shifts between hunger and disgust.
- The binge-vomit syndrome brings bouts of fasting.
