simpleMeaning: a delay in putting a right, claim, or special right of yours into effect, and a holding
  back from acting
scope: A wait before you put a right, claim, or special right of yours into effect, and a choice not to
  act; not being kind and calm when things are slow or done badly.
examples:
- The bank showed forbearance and waited six months before it asked for the money back.
- His forbearance meant he did not take the house at once, though the law said he could.
