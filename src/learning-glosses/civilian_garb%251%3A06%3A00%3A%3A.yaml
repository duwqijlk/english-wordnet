simpleMeaning: Plain things to wear in daily life, not a uniform, not clothes for work, and not the clothes
  of a priest, and the like
scope: These plain things to wear are also called civilian clothing, civilian dress, and plain clothes,
  and they are not a uniform, not clothes for work, and not the clothes of a priest.
examples:
- The actor wore civilian garb for the street scene.
- In civilian garb, no one could tell she was a police officer.
