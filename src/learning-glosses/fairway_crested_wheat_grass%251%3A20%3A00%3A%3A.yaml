simpleMeaning: A plant from Europe and Asia grown on the wide open plains of the United States to feed
  farm animals and to hold the soil.
scope: A plant from Europe and Asia grown on the wide open plains of the United States to feed farm animals
  and hold the soil, also called crested wheat grass or crested wheatgrass; not a lawn plant and not a
  wild prairie plant.
examples:
- The fairway crested wheat grass held the dry soil in place.
- Ranchers sow fairway crested wheat grass for their herds.
