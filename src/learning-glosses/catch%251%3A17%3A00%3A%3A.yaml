simpleMeaning: Something taken or trapped, above all when it is worth having.
scope: The thing itself that has been taken, such as fish or game; it is not the number or amount taken,
  not the grabbing action, not something snagging, not a faithful copy, not a catcher's play, or a pursuit
  gaining ground.
examples:
- The fishermen brought their catch to the market.
- We grilled the day's catch on the beach.
