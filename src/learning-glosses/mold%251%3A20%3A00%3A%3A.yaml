simpleMeaning: a fuzzy living growth that forms on wet or rotting food and other matter
scope: A fuzzy growth on wet or rotting matter, not a container, not soil, not a shaped dish, and not
  the verbs of shaping.
examples:
- Mold grew on the bread left in the damp cupboard.
- The old book had mold on its cover.
