simpleMeaning: Said by a court to be free of blame for one stated crime
scope: Said by a court to be free of blame for one stated crime, with acquitted as another name for this
  sense; not a person proved to have done the crime, and not a pardon.
examples:
- The jury found him not guilty of the theft.
- She was found not guilty and walked free from the court.
