simpleMeaning: a woman whose marriage has ended, or a woman who is living apart from her husband
scope: This is a woman whose marriage has ended or who lives apart from her husband; it is not a man in
  the same position, and not the court act that ends a marriage.
examples:
- The divorcee moved to a smaller house after her marriage ended.
- As a divorcee living apart from her husband, she built a new life on her own.
