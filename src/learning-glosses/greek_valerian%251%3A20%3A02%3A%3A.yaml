simpleMeaning: A plant of the eastern United States that stands up straight or spreads out, and lives
  for more than two years.
scope: Also called Polemonium reptans; a plant of the eastern United States, not the European plant with
  blue or white flowers.
examples:
- Greek valerian grows along the river in the eastern United States.
- We planted Greek valerian in the garden for its spreading stems.
