simpleMeaning: a plant under water, with narrow leaves in rings and single flowers where leaf meets stem,
  from the Old World, now wild in the southern United States, blocking Florida waterways
scope: A plant that grows under water and blocks waterways, not a plant that floats on the surface and
  not a land plant.
examples:
- Hydrilla has spread through the canals and now blocks the boats.
- The hydrilla in the lake grows thick under the water.
