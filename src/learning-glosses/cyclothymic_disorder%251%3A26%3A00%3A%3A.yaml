simpleMeaning: a long-term mood illness that stays mild, with small shifts between high and low moods
scope: 'Another name for cyclothymia and cyclic disorder: a mild mood illness that goes on for years,
  not a brief change in mood and not a strong mood illness.'
examples:
- Cyclothymic disorder left him with small mood shifts that went on for years.
- She learned to live with cyclothymic disorder and its mild mood shifts.
