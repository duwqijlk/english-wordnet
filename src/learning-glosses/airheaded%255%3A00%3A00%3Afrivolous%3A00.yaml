senseId: airheaded%5:00:00:frivolous:00
synsetId: 02128108-s
simpleMeaning: Light-headed and fond of fun, with no thought for what matters.
scope: This sense is also called silly, dizzy, giddy, and lightheaded, for being light-headed and fond
  of fun, with no thought for what matters, where silly is not serious, too ready to laugh and play rather
  than think with care, and dizzy is not serious, ready to laugh and play rather than think with care.
examples:
- She was airheaded, fond of fun with no thought for what matters.
- He seemed airheaded and light-headed.
