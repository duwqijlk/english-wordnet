simpleMeaning: the home of a king, queen, or other noble person
scope: This is a royal or noble home, not an enclosed yard, a playing surface, or a roadside hotel.
examples:
- The duke's court was a grand building with gardens that ran down to the river.
- Visitors came from distant lands to see the court where the queen lived.
