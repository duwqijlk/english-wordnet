simpleMeaning: A bend of the spine that curves too far in toward the front of the body.
scope: A bend of the spine that curves too far in toward the front, not a hunch that curves out at the
  back; also called lordosis.
examples:
- Years of bad posture left him with a hollow-back.
- The doctor said her hollow-back came from weak back muscles.
