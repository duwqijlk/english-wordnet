simpleMeaning: a forked stick that people say moves down when it is over water or oil under the ground
scope: 'Also called a divining rod and a dowser: a forked stick said to point to water or oil under the
  ground, not a tool for digging and not a machine that finds metal.'
examples:
- He held the dowsing rod over the dry ground.
- The dowsing rod dipped sharply above the hidden spring.
