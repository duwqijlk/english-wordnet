simpleMeaning: A hairy American herb that grows upright and branches, with purple-blue flowers; its essential
  oil repels insects and is sometimes used in folk medicine.
scope: The American herb, not the Eurasian mint of the same name.
examples:
- A patch of pennyroyal grew thick along the garden path, starred with purple-blue flowers.
- Her grandmother gathered pennyroyal for a folk remedy.
