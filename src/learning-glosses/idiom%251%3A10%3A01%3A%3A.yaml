simpleMeaning: a group of words whose whole meaning cannot be worked out from the meanings of the single
  words in it
scope: 'Also called phrase: a set of words with a meaning you cannot guess from the single words, not
  the special words and way of speaking of one group of people.'
examples:
- '''Break the ice'' is an idiom that means to start a friendly talk.'
- The idiom 'kick the bucket' does not mean kicking anything.
