simpleMeaning: Usually brought on by germs that make poisons, this deadly kind of gangrene kills body
  tissue, and it can serve as a weapon made from germs
scope: Also called emphysematous gangrene, emphysematous phlegmon, gangrenous emphysema, gas gangrene,
  gas phlegmon, and progressive emphysematous necrosis, this is a deadly kind of gangrene in which body
  tissue dies.
examples:
- The wound was checked for clostridial myonecrosis, a deadly form of gangrene.
- The textbook lists clostridial myonecrosis among the deadliest kinds of gangrene.
