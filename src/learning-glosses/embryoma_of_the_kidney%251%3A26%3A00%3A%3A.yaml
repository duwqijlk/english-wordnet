simpleMeaning: High blood pressure, blood in the urine, and a lump that can be felt mark this cancerous
  growth in the organ that cleans the blood, in a young child
scope: This cancerous growth in a young child, also called adenomyosarcoma and nephroblastoma, shows itself
  through high blood pressure, blood in the urine, and a lump that can be felt.
examples:
- The child with an embryoma of the kidney had blood in her urine.
- A lump that could be felt turned out to be an embryoma of the kidney.
