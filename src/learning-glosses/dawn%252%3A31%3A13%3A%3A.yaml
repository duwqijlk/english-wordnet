simpleMeaning: to become clear in your mind, so that you begin to know or feel something new
scope: Also called click. This is when an idea becomes clear in your mind, not the time of day when light
  first comes and not the start of a new time.
examples:
- It dawned on him that he had left his keys at home.
- The truth began to dawn on her as she read the letter.
