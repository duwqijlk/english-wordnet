simpleMeaning: Lines or paths that get closer to each other instead of staying the same distance apart.
scope: Lines or paths that get closer to each other instead of staying the same distance apart, not lines
  that run side by side and never meet and not one line by itself.
examples:
- The two paths are nonparallel and slowly come together.
- Nonparallel lines meet if you follow them far enough.
