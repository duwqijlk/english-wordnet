simpleMeaning: A fault in which the clear front of the eye bulges out in a cone shape, which can be treated
  by placing a thin layer of tissue on it.
scope: This is a fault in which the clear front of the eye bulges out in a cone shape, which can be treated
  by placing a thin layer of tissue on it, not a clouding of the lens and not short sight.
examples:
- Keratoconus made the front of her eye bulge into a cone shape.
- His keratoconus was treated by adding a thin layer of tissue to the eye.
