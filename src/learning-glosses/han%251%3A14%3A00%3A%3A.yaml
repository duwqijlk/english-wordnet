simpleMeaning: a line of kings in China from 206 BC to AD 220, with a gap, who grew lands and built offices;
  one of the great times of Chinese life
scope: This is the line of kings in China from 206 BC to AD 220, not a later line of kings or a single
  king, and it is also called Han dynasty.
examples:
- The Han ruled China for over four hundred years.
- Han officials built roads across the empire.
