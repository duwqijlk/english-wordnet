simpleMeaning: The rebel colonies' law-making body of envoys, which met during and after the American
  Revolution; it put out the Declaration of Independence and drew up the Articles of Confederation.
scope: The law-making body of the rebel colonies in the American Revolution, not a state legislature and
  not the later United States Congress.
examples:
- The Continental Congress met in Philadelphia to direct the war.
- The Continental Congress issued the Declaration of Independence in 1776.
