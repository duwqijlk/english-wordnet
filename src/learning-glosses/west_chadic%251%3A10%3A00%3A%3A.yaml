simpleMeaning: A group of related languages spoken in the north of Nigeria, of which Hausa is the most
  important member.
scope: This is a group of related languages of northern Nigeria, with Hausa as its most important member,
  and it is separate from other language groups of the country, such as Yoruba.
examples:
- Hausa belongs to West Chadic.
- West Chadic covers many languages of northern Nigeria.
