simpleMeaning: A usual way of thinking, held over time, decides how a person reads what happens and how
  they answer it.
scope: Also called mindset, outlook, and mentality, it is the way of thinking a person brings to what
  happens.
examples:
- A mind-set decides how a person reads what happens.
- A mind-set decides how a person answers what happens.
