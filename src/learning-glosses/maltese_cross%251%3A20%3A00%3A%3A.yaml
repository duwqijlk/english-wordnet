simpleMeaning: A garden plant from Europe and Asia that lives for many years, with bright red flowers
  packed in tight bunches at the ends of its stems.
scope: A garden plant from Europe and Asia that lives for many years, with bright red flowers in tight
  bunches, also called scarlet lychnis, not a rose and not a plant that lives for one year.
examples:
- The maltese cross bloomed red in the border.
- Maltese cross grew tall at the back of the garden.
