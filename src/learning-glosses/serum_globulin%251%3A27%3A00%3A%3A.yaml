simpleMeaning: proteins found in the liquid part of blood that hold most of the blood's germ-fighting
  parts
scope: Proteins in the liquid part of blood that carry most of its germ-fighting parts; not the red cells
  of the blood and not a drug.
examples:
- The test showed a low level of serum globulin in his blood.
- Serum globulin helps the body fight off germs.
