simpleMeaning: Blue-violet or lilac blooms open in early spring on a short hairy plant that lives for
  years, found in North America and Siberia.
scope: Also called blue tulip, lion's beard, and wild crocus, this is a short hairy plant that lives for
  years and blooms in early spring.
examples:
- The prairie anemone bloomed early in the spring.
- A prairie anemone with lilac blooms grew beside the path.
