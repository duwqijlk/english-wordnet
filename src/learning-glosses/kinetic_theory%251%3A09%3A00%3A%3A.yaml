simpleMeaning: In physics, the idea that gases are made of tiny bits moving about in no set pattern.
scope: This is the idea that gases are made of tiny bits moving about in no set pattern; kinetic theory
  of gases is another name for it, not a rule about how gases act when heated.
examples:
- Kinetic theory says gases are made of tiny bits in random motion.
- Under kinetic theory, gas particles move about with no set pattern.
