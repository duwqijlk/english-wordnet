simpleMeaning: A stage work from the Middle Ages that shows scenes from the life of a saint or martyr.
scope: A stage work from the Middle Ages that shows scenes from the life of a saint or martyr, not a mystery
  work about Bible stories and not a modern stage work.
examples:
- The miracle play told the story of Saint George.
- Actors performed a miracle play in the town square.
