simpleMeaning: the act of going with a person or thing to keep them safe
scope: This is going with a person or thing to keep them safe, not the music that plays behind a main
  song or voice.
examples:
- He went to the bank with police accompaniment for his safety.
- The money was moved under armed accompaniment so no one could steal it.
