simpleMeaning: a card game like rummy with two packs and four jokers, where jokers and twos count as any
  card and the aim is to make sets of the same rank
scope: A card game, not the verb sense of things losing their shape and mixing together.
examples:
- They played meld with two packs of cards.
- In meld, jokers and twos can stand for any card.
