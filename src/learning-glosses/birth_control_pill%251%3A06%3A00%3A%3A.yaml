simpleMeaning: A woman takes this tablet to stop her body from setting free an egg, so she does not become
  pregnant; it holds estrogen and progestin, two female hormones.
scope: Also called pill, anovulant, anovulatory drug, contraceptive pill, oral contraceptive, and oral
  contraceptive pill, this tablet stops an egg from being set free so a woman does not become pregnant.
examples:
- She takes a birth control pill to stop her body from setting free an egg.
- The birth control pill holds estrogen and progestin.
