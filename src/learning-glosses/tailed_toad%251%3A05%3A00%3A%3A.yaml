simpleMeaning: a small animal from the west of North America that lives near water, with a tail-like part
  used for mating
scope: This is a small animal from the west of North America with a tail-like part used for mating; bell
  toad, ribbed toad and tailed frog are other names for this sense, not an ordinary toad without such
  a part.
examples:
- The tailed toad hides under stones by a stream.
- A tailed toad has a tail-like part used for mating.
