simpleMeaning: In the first months when a woman is going to have a baby, a feeling as if you are going
  to throw up early in the day is a sign
scope: Feeling as if you are going to throw up early in the day in the first months of a pregnancy, not
  a stomach bug and not sickness at any time of day.
examples:
- Her morning sickness was worst just after she woke up.
- Morning sickness made the first months of her pregnancy hard.
