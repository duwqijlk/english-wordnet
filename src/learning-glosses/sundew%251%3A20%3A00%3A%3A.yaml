simpleMeaning: any of several bog plants of the group Drosera, with leaves covered in sticky hairs that
  catch insects and break them down for food; found all over the world
scope: Also called daily dew and sundew plant; a bog plant that catches insects on sticky leaves, not
  a pitcher plant and not an ordinary bog plant that feeds only from the soil.
examples:
- A sundew caught a small fly on its sticky leaf.
- Sundews grow in the wet bog behind the house.
