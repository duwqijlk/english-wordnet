simpleMeaning: Near the elbow it joins the large vein of the arm, after running along the thumb side of
  the lower arm.
scope: Also called accessory cephalic vein, this vein runs along the thumb side of the lower arm and joins
  the large vein of the arm near the elbow.
examples:
- The vena cephalica accessoria runs along the thumb side of the forearm.
- Blood from the thumb side of the forearm drains through the vena cephalica accessoria.
