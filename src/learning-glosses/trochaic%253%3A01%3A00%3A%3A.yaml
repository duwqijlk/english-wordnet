senseId: 'trochaic%3:01:00::'
synsetId: 03138167-a
simpleMeaning: made up of trochees, pairs of beats in which a strong beat is followed by a weak one
scope: In poetry, a line built from trochees; not a line built from iambs.
examples:
- The trochaic line beats strong-weak, strong-weak.
- A trochaic dactyl mixes two kinds of foot.
