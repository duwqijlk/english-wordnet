simpleMeaning: to do small jobs with no plan, or to spend time doing nothing much
scope: 'Also called monkey, tinker, and putter: to do small jobs with no plan, not the person who makes
  clay pots for a living.'
examples:
- He pottered around the garden all morning, fixing small things here and there.
- On Sundays she likes to potter in the kitchen with no plan at all.
