simpleMeaning: a person who claims to have beliefs and opinions that he or she does not really hold, to
  hide his or her true feelings or reasons
scope: 'Also called phony, pretender, dissembler, phoney, and dissimulator: this is a person who hides
  true feelings by claiming beliefs he or she does not hold, not a person who only tells one lie.'
examples:
- He called the leader a hypocrite for praising honesty while hiding his own lies.
- The hypocrite said stealing was wrong, but he secretly took money himself.
