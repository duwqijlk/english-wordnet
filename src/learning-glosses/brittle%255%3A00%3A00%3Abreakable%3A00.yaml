simpleMeaning: With almost no give in it, so it cracks, breaks, or snaps with ease instead of bending.
scope: With almost no give, breaking or snapping easily, not the sweet made of sugar, not metal or glass
  left unsoftened, and not a cold heart.
examples:
- Glass is brittle and breaks with a knock.
- Her brittle bones broke with a small fall.
