simpleMeaning: A drug taken by mouth against high blood sugar, that makes the pancreas give out insulin
scope: Also called glyburide and DiaBeta; a drug taken by mouth that makes the pancreas give out insulin,
  not a drug put into the blood and not a drug for low blood sugar.
examples:
- Micronase is taken by mouth to control blood sugar.
- The doctor gave her Micronase to help her pancreas give out insulin.
