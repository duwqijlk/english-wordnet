simpleMeaning: The semantic relation between two words that can express opposite meanings in a given context.
scope: This name marks the link between two words that can mean the reverse of each other in one use.
examples:
- Hot and cold show antonymy in the sentence about the weather.
- In the sentence the door is open, not shut, open and shut show antonymy.
