simpleMeaning: when a male baby's sex glands do not move down into the pouch of skin below the body during
  growth in the womb
scope: 'Also called cryptorchidism or cryptorchidy: a state in which a male baby''s sex glands do not
  move down into the pouch below the body, not a wound and not an illness of grown men.'
examples:
- Cryptorchism was found in the baby at birth.
- The doctor told the parents about the baby's cryptorchism.
