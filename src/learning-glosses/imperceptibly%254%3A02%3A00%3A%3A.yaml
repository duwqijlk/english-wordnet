senseId: 'imperceptibly%4:02:00::'
synsetId: 00367210-r
simpleMeaning: in a way or to a degree that cannot be noticed
scope: Unnoticeably is another name for this sense. This means in a way, or by an amount, that people
  cannot notice; it is not a clear change that people notice at once.
examples:
- The light changed imperceptibly as the sun went down.
- His voice grew imperceptibly weaker each day.
