simpleMeaning: a thick spread of mashed chickpeas, tahini, a sesame paste, lemon juice and garlic, used
  above all as a dip for pita; it first came from the Middle East
scope: 'Also called hummus, humus, hoummos and humous: a thick spread of mashed chickpeas and tahini,
  used above all as a dip for pita, not a sauce and not a soup.'
examples:
- We spread hommos on warm pita bread for lunch.
- The hommos at the market is made fresh every morning.
