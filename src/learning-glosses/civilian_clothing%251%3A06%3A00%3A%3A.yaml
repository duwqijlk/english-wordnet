simpleMeaning: Dress for everyday life, worn instead of a uniform, clothes worn for work, or the clothes
  of a priest, and the like
scope: This everyday dress is also called civilian dress, civilian garb, and plain clothes, and it is
  worn instead of a uniform, clothes worn for work, or the clothes of a priest.
examples:
- After leaving the army, he wore civilian clothing for the first time in years.
- She packed civilian clothing for the trip, not her uniform.
