senseId: 'electromotive_drug_administration%1:04:00::'
synsetId: 00665121-n
simpleMeaning: a way to treat sickness by sending a flow of charge through one small place to carry tiny
  charged bits of a medicine into the body
scope: 'Also called ionic medication, iontophoresis and iontotherapy: a way to treat sickness by sending
  a flow of charge through one small place to carry tiny charged bits of a medicine into the body, not
  a pill taken by mouth and not a shot with a needle.'
examples:
- Doctors used electromotive drug administration to get the medicine into the tissue without a needle.
- Electromotive drug administration helped the medicine reach the sore joint.
