simpleMeaning: A sour substance in which four hydrogen atoms in each molecule can be replaced by other
  atoms
scope: This is a sour substance with four hydrogen atoms in each molecule that can be replaced; not a
  sour substance with only one such atom and not a strong sour substance in general.
examples:
- This tetrabasic acid has four hydrogen atoms in each molecule that can be replaced.
- The lab stored the tetrabasic acid in a sealed bottle.
