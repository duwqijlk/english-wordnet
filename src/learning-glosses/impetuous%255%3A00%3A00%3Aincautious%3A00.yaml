simpleMeaning: done or acting with too much hurry and without stopping to think things through carefully
scope: 'Also called impulsive, hotheaded and madcap: acting too fast without thinking; not careful and
  planned, and not just fast in a good way.'
examples:
- His impetuous decision to quit left him without a job.
- She made an impetuous buy and later wished she had waited.
