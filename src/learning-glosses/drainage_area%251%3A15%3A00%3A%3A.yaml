simpleMeaning: One outlet takes all the water that runs off the land round one river and its smaller streams.
scope: All the water that runs off the land round one river leaves by one outlet, and this land is also
  called a basin, a watershed, a catchment area, a catchment basin, a drainage basin, and a river basin.
examples:
- Water falling anywhere in the drainage area ends up in the same river.
- All the streams in the drainage area run into one river.
