simpleMeaning: A woman in some old tales who has magic power and brings sudden good luck to the hero or
  heroine.
scope: A woman in some old tales who has magic power and brings sudden good luck to the hero or heroine,
  not a wicked witch and not an ordinary helper.
examples:
- The fairy godmother waved her wand and the rags turned to silk.
- In the tale, a fairy godmother brings the hero sudden good luck.
