simpleMeaning: a light, airy baked sweet made with no egg yolks at all
scope: This is a light, airy baked sweet with no egg yolks; angel cake is another name for it, not a heavy
  cake made with butter and whole eggs.
examples:
- Angel food cake is so light it almost melts in your mouth.
- He baked an angel food cake for the party, using only egg whites.
