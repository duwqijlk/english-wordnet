schema: oewn-learning-gloss-v2
senseId: 'consistent%3:00:00::'
synsetId: 00579031-a
simpleMeaning: that agrees with something else and can be trusted to stay true
scope: This means a thing agrees with facts or other things and can be trusted, sometimes used with 'with';
  it is not about the parts of a work fitting together in a neat, clear way.
examples:
- Her story was consistent with the facts the police had already found.
- The test gave consistent results, so the team could trust them each time.
