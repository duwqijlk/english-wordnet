simpleMeaning: in a way that shows very strong feeling and great interest in something
scope: Done with very strong feeling and great interest in something; not done in a cold way or without
  really caring about the thing.
examples:
- She ardently supported the plan to save the old library.
- He spoke ardently about the need to help poor children.
