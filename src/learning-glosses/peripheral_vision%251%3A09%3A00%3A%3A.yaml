simpleMeaning: Seeing at the sides of what the eye takes in, using only the outer edge of the back of
  the eye.
scope: Seeing at the sides of what the eye takes in, using only the outer edge of the back of the eye,
  not seeing straight ahead and not seeing with the middle of the eye.
examples:
- His peripheral vision caught the car at the side.
- With good peripheral vision she saw the ball coming from the left.
