simpleMeaning: finding where a noise comes from by timing when it reaches microphones set out in known
  places
scope: Finding where a noise comes from, such as a gun, by timing when it reaches set microphones; not
  a way of making a noise, and not a map.
examples:
- Sound ranging helped the soldiers work out where the guns were firing from.
- The team used sound ranging to track the blast back to its source.
