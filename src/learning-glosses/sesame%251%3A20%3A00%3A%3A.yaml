simpleMeaning: a plant from East India that grows straight up, lives for one year, and gives seeds and
  oil made from those seeds
scope: This plant is also called benni, benny, and benne. It is the plant itself, not just its seeds or
  the oil made from them.
examples:
- Sesame grows well in hot, dry fields in India.
- The farmer planted sesame for its seeds and oil.
