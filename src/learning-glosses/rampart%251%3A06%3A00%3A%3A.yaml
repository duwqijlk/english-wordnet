simpleMeaning: Earth heaped up as a wall round a place, to hold off an attack.
scope: A bank of earth round a place for defence, also called a wall, not a stone wall and not a fence.
examples:
- They stormed the ramparts of the old city at dawn.
- The soldiers stood on the rampart and watched the road.
