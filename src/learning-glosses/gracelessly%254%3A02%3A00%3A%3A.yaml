simpleMeaning: in a clumsy way, without smooth or easy movement
scope: Moving or acting in a clumsy way that is not smooth to watch; the near sense of the same word in
  this batch stresses stiff, unbending movement instead.
examples:
- She danced gracelessly and nearly fell twice.
- He climbed gracelessly over the fence.
