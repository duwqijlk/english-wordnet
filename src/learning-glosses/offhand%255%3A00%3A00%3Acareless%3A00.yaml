simpleMeaning: showing little thought or care for other people's feelings
scope: Also called offhanded. This describes a person, a remark or a way of behaving, not the word that
  describes how an action is done.
examples:
- His offhand remark upset everyone in the room.
- She gave an offhand answer and did not think about how it sounded.
