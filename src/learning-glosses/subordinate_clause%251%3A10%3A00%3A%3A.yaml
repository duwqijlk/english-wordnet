simpleMeaning: A part of a sentence with a main part, that cannot stand alone as a sentence, and that
  does the work of a noun, an adjective, or an adverb.
scope: Also called a dependent clause, this is a part of a sentence with a main part that cannot stand
  on its own, not a sentence on its own.
examples:
- The subordinate clause in that sentence tells us when it happened.
- She added a subordinate clause to say where they met.
