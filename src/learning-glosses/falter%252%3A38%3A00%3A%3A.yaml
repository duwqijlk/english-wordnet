simpleMeaning: to walk in a way that is not steady, and to almost fall again and again
scope: 'Another name for stumble: to walk in a way that is not steady. This is about moving the feet,
  not about speaking in a weak, stopping way.'
examples:
- The old man faltered as he walked across the icy path.
- She faltered on the rough ground and almost fell several times.
