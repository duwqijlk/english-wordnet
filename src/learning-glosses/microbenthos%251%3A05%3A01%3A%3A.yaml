simpleMeaning: Tiny living things that live on the bottom of the sea or a lake and are smaller than a
  tenth of a millimetre
scope: Tiny living things on the bottom of the sea or a lake, not bigger sea animals and not tiny things
  that float in the water.
examples:
- Microbenthos live in the mud at the bottom of the lake.
- The researchers counted the microbenthos in the sea-floor sample.
