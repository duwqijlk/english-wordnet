simpleMeaning: Given to a woman who is not feeding a baby at the breast, a drug or other thing cuts down
  how much milk she makes
scope: A drug or other thing that cuts down how much milk a woman makes, given when she is not feeding
  a baby, not a drug that starts milk flow and not a drug for the baby.
examples:
- The doctor gave her a lactifuge after she stopped nursing.
- A lactifuge can help dry up milk when a mother is not breast-feeding.
