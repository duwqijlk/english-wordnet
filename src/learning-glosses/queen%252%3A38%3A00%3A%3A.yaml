senseId: 'queen%2:38:00::'
synsetId: 01974005-v
simpleMeaning: to become the most powerful chess piece, as a pawn does at the far end of the board
scope: This is a pawn becoming that piece by itself, not the act of promoting a pawn to that rank, and
  not the female ruler, the playing card, or the insect.
examples:
- Her pawn queened when it reached the far rank.
- The pawn queened and the game was soon over.
