simpleMeaning: The opening church-wide meeting in 325, which wrote the words of the Nicene Creed and spoke
  against the false teaching of Arianism.
scope: 'Also called Nicaea: the opening church-wide meeting of 325 that wrote the Nicene Creed, not a
  later church meeting and not a meeting of one church only.'
examples:
- The First Council of Nicaea met in 325.
- The First Council of Nicaea wrote the words of the Nicene Creed.
