schema: oewn-learning-gloss-v2
senseId: 'xenotransplantation%1:04:00::'
synsetId: 01270764-n
simpleMeaning: an operation in which tissue (soft parts of the body) or whole organs are moved from one
  kind of living thing to a different kind
scope: This is an operation that moves body parts from one kind of living thing to another; xenotransplant
  is another name for this sense, not a move of body parts between people of the same kind, and not the
  piece of tissue itself.
examples:
- Doctors planned a xenotransplantation to give the patient a heart from a pig.
- The xenotransplantation moved a kidney from one kind of animal to a person.
