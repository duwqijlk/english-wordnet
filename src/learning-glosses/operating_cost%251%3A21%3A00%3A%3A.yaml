simpleMeaning: Taxes, bills, and cover against loss are paid to keep land or a building in use, leaving
  out the fall in its worth, loan charges, and tax on money made.
scope: Overhead, budget items, and operating expense are other names for this sense, which covers the
  cost of keeping land or a building in use.
examples:
- The operating cost of the shop includes taxes, light, and insurance.
- She worked out the operating cost before signing the lease.
