simpleMeaning: the spinal cord runs on into this part of the brain, made of the lowest part, the bridge,
  the middle part, and part of the small region below the centre
scope: 'Also called brain-stem and brainstem: the part of the brain the spinal cord runs into, not the
  whole brain and not the spinal cord itself.'
examples:
- The brain stem links the brain with the spinal cord.
- Doctors look at the brain stem after a head injury.
