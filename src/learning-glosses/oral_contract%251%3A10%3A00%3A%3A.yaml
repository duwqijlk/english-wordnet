synsetId: 06785384-n
simpleMeaning: A deal that is not written down and not signed, yet still counts as a real deal, missing
  only the written note that would make a court enforce it.
scope: This is a real deal made with spoken words alone, with no paper to show for it, and a court will
  not enforce it until a written note of it exists.
examples:
- They made an oral contract with no paper at all.
- The oral contract was never written down, so the court would not enforce it.
