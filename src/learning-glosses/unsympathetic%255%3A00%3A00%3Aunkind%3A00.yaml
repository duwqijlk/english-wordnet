simpleMeaning: not caring about other people's feelings or troubles; not kind
scope: Not kind and not caring about other people's troubles, also called unkindly; not the sense of a
  thing not fitting what a person likes or expects, and not the sense about a character in a story whom
  people dislike.
examples:
- His unsympathetic reply to her bad news made her cry.
- The manager was unsympathetic when the workers asked for a day off.
