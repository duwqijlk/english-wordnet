simpleMeaning: A South American plant that trails along the ground, often grown in gardens, with shield-shaped
  leaves and pink-red flowers.
scope: Also called hanging geranium, ivy-leaved geranium, and ivy geranium; a trailing South American
  plant, set apart from upright geraniums by its trailing stems and shield-shaped leaves.
examples:
- Pelargonium peltatum trailed over the edge of the hanging basket.
- Pink-red flowers covered the Pelargonium peltatum all summer.
