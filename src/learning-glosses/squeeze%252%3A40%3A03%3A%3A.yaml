simpleMeaning: get something from someone by threatening or frightening them
scope: Getting something from someone by threats, not making a person act under pressure and not pressing
  something with the hands; extort, rack, gouge and wring are other names for this sense.
examples:
- The gangsters squeezed money out of the small shopkeepers.
- She squeezed a full refund out of the company by threatening to sue.
