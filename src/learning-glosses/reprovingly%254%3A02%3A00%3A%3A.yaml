senseId: 'reprovingly%4:02:00::'
synsetId: 00164275-r
simpleMeaning: in a way that shows you think someone has done something wrong and you do not approve of
  it
scope: Another name for this sense is reproachfully. It describes speaking or looking at someone in a
  way that shows you think they did wrong, not in a kind, joking or praising way.
examples:
- She looked at him reprovingly when he tracked mud across the clean floor.
- '"You know better than that," his mother said reprovingly.'
