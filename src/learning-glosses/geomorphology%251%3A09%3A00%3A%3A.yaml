simpleMeaning: The branch of the study of rocks that looks at the shape, build and change of rocks and
  land forms
scope: This is the branch of the study of rocks that looks at the shape, build and change of rocks and
  land forms; morphology is another name for this sense, not the study of rocks alone and not the study
  of weather.
examples:
- She studied geomorphology to learn how valleys form.
- Geomorphology explains why the hills look the way they do.
