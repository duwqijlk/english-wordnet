simpleMeaning: Bright yellow flowers that give way to a fluffy seed ball mark this plant, one of several
  with a long main root and deeply cut leaves.
scope: Another name for the blowball, the same yellow-flowered plant; not just its fluffy seed head.
examples:
- Dandelions open bright yellow flowers that later turn into fluffy seed balls.
- The dandelion's long tap root makes it difficult to pull out.
