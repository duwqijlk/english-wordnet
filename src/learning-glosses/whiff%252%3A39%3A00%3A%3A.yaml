simpleMeaning: To breathe in through the nose and so pick up a smell.
scope: 'Also called sniff: to pick up a smell by breathing it in through the nose, not striking out in
  baseball, not the strikeout that follows, and not a flat fish.'
examples:
- She whiffed the fresh bread as she passed the bakery.
- He whiffed the perfume and smiled.
