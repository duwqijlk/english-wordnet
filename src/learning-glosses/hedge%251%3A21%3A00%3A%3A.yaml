simpleMeaning: Any way of cutting or getting rid of money risk, such as by taking two bets that cancel
  each other out if prices move
scope: A way to lower money risk, not a fence of bushes and not a vague answer.
examples:
- The fund used a hedge to guard against a fall in prices.
- A hedge can save a trader when the market turns.
