simpleMeaning: The person who looks after the look of a play — its clothes, sets, and lights.
scope: The person who looks after the look of a play — its clothes, sets, and lights; not a stage manager
  and not a set designer.
examples:
- The art director chose the colours for the play's sets.
- Our art director plans the clothes and lights for each show.
