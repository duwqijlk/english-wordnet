simpleMeaning: words that are very angry and unkind, used to blame someone or to show strong, long-held
  hate for them
scope: 'Also called invective and vituperation: this is angry, unkind speech or writing, not the strong
  acid with the same name and not the act of harming someone with that acid.'
examples:
- His speech was full of vitriol against his rivals.
- She wrote a page of vitriol about the mayor.
