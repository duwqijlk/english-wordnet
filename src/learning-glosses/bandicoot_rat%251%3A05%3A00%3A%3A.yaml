simpleMeaning: Its tail is covered in scales, and this animal from India and Ceylon digs tunnels under
  the ground.
scope: The mole rat is another name for this tunnelling animal with a scaly tail.
examples:
- A bandicoot rat dug a burrow under the ground.
- The bandicoot rat hid in its burrow when we came near.
