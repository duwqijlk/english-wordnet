simpleMeaning: Hard wood and nuts fit to eat come in a prickly case from any of several good-looking leaf-shedding
  trees, yellow-brown in autumn.
scope: 'Also called chestnut: any of several good-looking leaf-shedding trees with nuts fit to eat, not
  a tree grown only for its wood.'
examples:
- The chestnut tree turned yellow-brown in autumn.
- Chestnut trees give hard wood and nuts in prickly cases.
