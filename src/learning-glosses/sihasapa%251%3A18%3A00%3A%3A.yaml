simpleMeaning: A person of a Siouan group that formed one part of the Teton Sioux, living in the western
  Dakotas on the Great Plains
scope: A member of one Siouan group that formed a division of the Teton Sioux, not the whole Teton Sioux.
examples:
- The Sihasapa lived in the western Dakotas on the Great Plains.
- He was a Sihasapa, a member of a Siouan group that formed part of the Teton Sioux.
