simpleMeaning: A wooden thing shaped like a club, set up in groups of ten in a triangle as the target
  of a rolling ball
scope: A wooden thing shaped like a club, set up in groups of ten in a triangle as the target of a rolling
  ball, also called a pin; not a wooden bat and not a target for arrows.
examples:
- He knocked down nine bowling pins with one ball.
- The bowling pin stood at the end of the lane.
