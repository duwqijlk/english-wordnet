simpleMeaning: to work out how strongly a lens (a clear curved piece for seeing) bends light
scope: Working out how strongly a lens bends light, not the bending of light itself when it passes through
  something.
examples:
- The specialist refracted each lens to find out how strongly it bends light.
- Before making the glasses, she refracted the lens and wrote down its power.
