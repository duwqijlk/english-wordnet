simpleMeaning: A program that changes programs written in that language so the machine can run them.
scope: This word is for a program that works with programs written in that language, not for a program
  written in that language.
examples:
- The Fortran compiler turned her program into a form the machine could run.
- He installed a new Fortran compiler on his computer.
