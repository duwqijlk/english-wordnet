simpleMeaning: Shut inside a two-part shell, a tiny water animal has a body like a small prawn and lives
  in the sea and in fresh water.
scope: Also called mussel shrimp and ostracod, this tiny water animal has a prawn-like body shut inside
  a two-part shell, and it is not a true shrimp.
examples:
- We found seed shrimp in fresh water.
- A seed shrimp kept its body inside a two-part shell.
