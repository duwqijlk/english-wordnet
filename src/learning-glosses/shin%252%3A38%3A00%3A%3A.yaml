simpleMeaning: to climb in an awkward way, using your hands and feet as you go up
scope: 'Also called skin, struggle and scramble: to climb in an awkward way. Not the noun for the larger
  bone in the lower leg.'
examples:
- He shinned up the tall tree to get his ball back.
- She shinned up the pole and looked over the wall.
