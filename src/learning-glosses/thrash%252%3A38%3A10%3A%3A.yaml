simpleMeaning: to beat so fast that the heart sends out less and less blood, until it cannot send out
  any blood at all
scope: This is about a heart beating too fast and failing to send out blood, not about beating a person
  hard.
examples:
- His heart thrashed so fast that it could no longer pump blood well.
- The sick heart thrashed wildly, sending out less blood with each beat.
