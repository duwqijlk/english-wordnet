senseId: 'hysteron_proteron%1:10:00::'
synsetId: 07118815-n
simpleMeaning: Saying two words or parts of a sentence in the other way round from their usual order,
  as in 'bred and born'
scope: A figure of speech that puts two words or parts of a sentence in the other way round from their
  usual order; not the mistake of using a claim that still needs proof as if it were true.
examples:
- '''Bred and born'' is a hysteron proteron, since ''born'' comes before ''bred'' in time.'
- The poet used a hysteron proteron when she put the later event first in the line.
