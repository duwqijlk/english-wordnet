simpleMeaning: to cause someone deep pain in mind or feelings
scope: To cause deep pain in mind or feelings; torture, rack and torment are other names for this sense,
  not to hurt the body, and not to tease lightly.
examples:
- The memory of the accident excruciated her for years.
- His guilt excruciated him every night.
