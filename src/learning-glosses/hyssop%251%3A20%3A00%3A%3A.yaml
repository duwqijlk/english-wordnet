simpleMeaning: A European mint with fragrant, sharp-tasting leaves used in perfume making and as a cooking
  seasoning; it is often grown as a remedy for bruises and yields an oil.
scope: This is the European mint grown for its fragrant leaves, not the hyssop of the Bible and not another
  kitchen herb such as oregano.
examples:
- Hyssop grows well in poor, dry soil in full sun.
- She picked a few hyssop leaves to flavor the soup.
