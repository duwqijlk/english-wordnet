simpleMeaning: a cheap flute (a long, thin pipe played by blowing) that has a fixed mouth part which sends
  the air in to make the sound
scope: A cheap pipe for making music that you blow through a fixed mouth part, not the small signal device
  a referee uses and not the act or the sound of signalling.
examples:
- He learned to play a tune on a cheap tin whistle.
- She bought a thin whistle with holes along it and played songs on it.
