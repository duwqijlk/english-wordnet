simpleMeaning: In the armed forces, a person who joins of their own free will.
scope: In the armed forces, a person who joins of their own free will; not a person forced to join, and
  not a soldier hired for pay.
examples:
- He joined as a military volunteer, not as a draftee.
- The army welcomed military volunteers from every town.
