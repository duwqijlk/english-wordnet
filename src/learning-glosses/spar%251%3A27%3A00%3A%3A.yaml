simpleMeaning: any of some kinds of stone, not metal, such as calcite, light in color, that you can see
  through or partly see through and can be split
scope: This is a kind of stone, not a strong round pole used to hold parts of a ship, and not the fighting
  moves used when training for boxing.
examples:
- The white spar shone in the side of the rock.
- He found a clear piece of spar in the cave.
