simpleMeaning: A piece of matter that carries electric current, mostly because tiny charged bits (electrons)
  move through it.
scope: A piece of matter that carries current mostly by moving electrons, not a piece that carries current
  by holes and not a plain wire.
examples:
- The n-type semiconductor lets electrons carry the current.
- An n-type semiconductor was used in the circuit.
