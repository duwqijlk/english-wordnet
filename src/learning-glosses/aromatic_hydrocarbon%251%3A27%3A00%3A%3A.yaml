simpleMeaning: Rings of six carbon atoms, one or more of them, show that this carbon-and-hydrogen substance
  is one of the benzene family of organic substances.
scope: This carbon-and-hydrogen substance with rings of six carbon atoms is the aromatic hydrocarbon,
  a near twin of the aromatic compound, but named for the organic substances it belongs with.
examples:
- They found an aromatic hydrocarbon in the sample.
- They sorted the aromatic hydrocarbon with the benzene family.
