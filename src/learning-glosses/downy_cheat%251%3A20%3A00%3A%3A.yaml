simpleMeaning: from the lands around the Mediterranean Sea, a grass with leaves covered in soft, fine
  hairs that grows for one year, or for one cold season
scope: 'Also called cheatgrass, downy brome, downy bromegrass, downy chess, and drooping brome: a grass
  with soft-haired leaves from the Mediterranean that grows for one year, or one cold season, not a grass
  that lives for many years and not a grass with smooth leaves.'
examples:
- Downy cheat spread across the dry hillside.
- The farmer cut the downy cheat before it set seed.
