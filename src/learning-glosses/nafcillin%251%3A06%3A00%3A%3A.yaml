simpleMeaning: A kind of penicillin that stands up to penicillinase, sold as Nafcil, used, usually in
  its salt form, to fight ills from penicillin-proof staph germs.
scope: 'In medicine: a penicillin that stands up to penicillinase, sold as Nafcil, for staph ills.'
examples:
- Nafcillin fights staph germs.
- Nafcillin is sold as Nafcil.
