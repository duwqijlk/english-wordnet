simpleMeaning: said of something that has to do with large star-shaped cells in the tissue that holds
  nerve cells in place
scope: Said of things linked to the large star-shaped cells that support nerve cells, not of the nerve
  cells themselves and not of other brain tissue.
examples:
- Astrocytic cells help hold nerve cells in place.
- The astrocytic layer protects the nerve cells beneath it.
