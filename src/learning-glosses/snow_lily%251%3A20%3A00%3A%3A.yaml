simpleMeaning: a dogtooth violet, a plant with bright yellow flowers that grows in the west of North America
scope: A dogtooth violet with bright yellow flowers from western North America, also called glacier lily;
  not a white flower, and not a plant from the east of North America.
examples:
- The snow lily opened its bright yellow flowers in the spring sun.
- We found a snow lily growing beside the mountain path.
