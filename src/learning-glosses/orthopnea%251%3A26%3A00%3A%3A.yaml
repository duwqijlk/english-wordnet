simpleMeaning: Linked with asthma, emphysema and chest pain from the heart, this is a state in which a
  person can breathe with ease only when standing or sitting upright.
scope: It is a state in which a person breathes with ease only when standing or sitting upright, linked
  with asthma, emphysema and chest pain from the heart.
examples:
- His orthopnea meant he could only breathe easily sitting upright.
- Orthopnea kept her from lying flat.
