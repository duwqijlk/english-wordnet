simpleMeaning: A small brown-red wallaby of the scrub country in Australia and New Guinea
scope: A small brown-red wallaby of the scrub country in Australia and New Guinea; pademelon is another
  name for it, not a kangaroo and not a possum.
examples:
- A paddymelon darted through the scrub at dusk.
- Paddymelons feed on grasses in the dry country.
