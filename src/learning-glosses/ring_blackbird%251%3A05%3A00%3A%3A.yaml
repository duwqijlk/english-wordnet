simpleMeaning: a songbird of Europe found often in stony places, whose male has dark feathers with a white
  band round the neck
scope: Not a plain brown songbird, and not a songbird of woodland; also called ring ouzel and ring thrush.
examples:
- A ring blackbird sang from the rocks at dawn.
- The male ring blackbird had a white band round its neck.
