simpleMeaning: A stiff plant of the Mediterranean that lives for years, with many branches and very white
  woolly stems and leaves.
scope: This is a stiff plant of the Mediterranean that lives for years, with many branches and very white
  woolly stems and leaves, also called dusty miller or Senecio cineraria; it is not a soft annual of the
  garden and not a plant with green smooth leaves.
examples:
- Cineraria maritima stood by the sea wall, its white woolly leaves bright in the sun.
- The Cineraria maritima in the rock garden has lived there for years.
