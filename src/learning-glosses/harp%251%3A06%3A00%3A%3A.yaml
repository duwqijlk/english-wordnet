simpleMeaning: A stringed instrument with a triangular frame, a soundboard, a pillar and a curved neck;
  its strings are plucked with the fingers.
scope: This is the triangular stringed instrument played by plucking; not the small free-reed harmonica,
  and not the metal supports that hold a lampshade.
examples:
- She plucked the strings of the harp with her fingers.
- A harp stood in the corner of the concert hall.
