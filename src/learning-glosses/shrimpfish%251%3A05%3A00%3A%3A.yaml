simpleMeaning: a thin sea creature of warm shallow water in the East Indies, covered with clear plates
scope: A thin sea creature of warm shallow water in the East Indies covered with clear plates, also called
  shrimp-fish; not a true shrimp and not a flat sea fish.
examples:
- A shrimpfish swam among the coral in the shallow water.
- The shrimpfish hid under a rock, its clear plates hard to see.
