simpleMeaning: a bridge put in place for a short time so people can walk on and off a ship where it stops
  at the land
scope: 'Also called gangway: a board or bridge for walking on and off a ship, not a fixed bridge and not
  a road on land.'
examples:
- Passengers walked down the gangplank onto the land.
- The crew lifted the gangplank away before the ship left.
