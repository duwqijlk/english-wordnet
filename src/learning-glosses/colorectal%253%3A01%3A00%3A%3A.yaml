simpleMeaning: about or having an effect on the colon (the main part of the large tube that takes solid
  waste from the body) and the rectum (its last short part)
scope: About the colon and the rectum together, not about the stomach or other parts of the body.
examples:
- Most colorectal cancers start as small growths in the bowel.
- Doctors offer colorectal tests to check for early signs of illness.
