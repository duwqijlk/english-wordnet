simpleMeaning: Said to come from Orpheus, or like the ideas in works said to come from Orpheus.
scope: Said to come from Orpheus, or like the ideas in works said to come from him; used of writings and
  ideas.
examples:
- Scholars call the hymn Orphic because it is said to come from Orpheus.
- The Orphic ideas in the poem come from works said to be by Orpheus.
