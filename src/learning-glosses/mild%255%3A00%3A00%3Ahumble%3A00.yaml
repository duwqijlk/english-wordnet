simpleMeaning: quiet and not proud in mind or in how you act, and showing a shy wish to stay back or even
  a fearful readiness to obey others
scope: 'Also called modest and meek: quiet, not proud, and ready to obey, not gentle in weather or taste
  and not soft in strength.'
examples:
- Though rich and powerful, she stayed mild and never spoke as if she were better than others.
- The mild young clerk nodded and obeyed at once, too shy to argue.
