simpleMeaning: written words that turn what people say in a foreign movie or TV show into another language,
  usually shown at the bottom of the screen
scope: 'Also called a caption: written words that turn speech in a foreign film or show into another language,
  not the act of adding these words to a film.'
examples:
- We turned on the subtitles so we could read what the actors said in English.
- The subtitle at the bottom of the screen helped me follow the French film.
