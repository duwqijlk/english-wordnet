simpleMeaning: To wipe away or wash off or out, and cleanse, and, chiefly in medical use, to clear foul
  matter from the body
scope: To wipe away or wash off or out, and cleanse, and chiefly in medical use to clear foul matter from
  the body, not to wash clothes and not to wipe a table clean.
examples:
- The nurse used the wash to deterge the wound.
- They had to deterge the cut before dressing it.
