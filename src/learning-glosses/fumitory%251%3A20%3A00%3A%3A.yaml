simpleMeaning: Tall thin groups of purplish flowers top this frail plant of Europe, which has greyish
  leaves and was once used by people as a medicine
scope: Also called fumeroot and fumewort, a frail plant of Europe with purplish flowers.
examples:
- Fumitory stood by the fence with greyish leaves and spikes of purplish flowers.
- Old books say fumitory was once used as a medicine.
