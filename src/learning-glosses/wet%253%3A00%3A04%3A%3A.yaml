simpleMeaning: allowing, or in favour of allowing, alcohol to be made and sold lawfully.
scope: Describes a person, place or policy that allows alcohol to be produced and sold legally, not goods
  made of or trading in alcohol, nor the slang for drunk.
examples:
- The candidate ran on a wet platform that backed legal liquor sales.
- The county stayed wet, so local bars could keep trading.
