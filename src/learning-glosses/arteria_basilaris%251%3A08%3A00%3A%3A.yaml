simpleMeaning: Feeding the bridge of the brain, the small brain at the back, the back of the large brain,
  and the inner ear, this artery is a single one
scope: Also called basilar artery, it is a single artery that feeds the bridge of the brain and the back
  parts of the brain and the inner ear, not one of a pair.
examples:
- The arteria basilaris feeds the bridge of the brain and the inner ear.
- Blood flows through the arteria basilaris to the back of the brain.
