senseId: 'letter%2:36:01::'
synsetId: 01696474-v
simpleMeaning: To write words down or print with letters, setting language out in alphabetic characters.
scope: 'This is the writing-and-printing sense: putting words down in letters. The nearest sibling, ''mark
  letters on'', is about lettering a surface such as a sign or a nameplate; the two are close and some
  dictionaries treat them as one. It has nothing to do with sending a letter.'
examples:
- The child was learning to letter her name in neat capitals.
- The printer lettered the whole book in a single size of type.
