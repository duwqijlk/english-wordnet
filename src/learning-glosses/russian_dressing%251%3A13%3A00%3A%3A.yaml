simpleMeaning: A thick sauce of egg and oil mixed with horseradish, grated onion and chilli sauce or tomato
  sauce, at times with caviar added.
scope: Also called Russian mayonnaise; a thick sauce with horseradish, onion and chilli sauce, not a plain
  sauce without those flavours.
examples:
- Russian dressing is a thick sauce with horseradish and onion.
- We put Russian dressing on the salad.
