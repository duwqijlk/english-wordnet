simpleMeaning: Strikingly right and to the point.
scope: This sense is also called apt and pertinent, for being strikingly right and to the point, where
  apt is exactly right for the time and place, standing out as fitting.
examples:
- Her remark was apposite, strikingly right and to the point.
- The quote proved apposite for the occasion.
