simpleMeaning: A South African herb, not very harmful, that people smoke like tobacco
scope: A South African herb, not very harmful, smoked like tobacco; dagga and red dagga are other names
  for this sense, and it is not a strong drug plant or a garden herb.
examples:
- Wilde dagga grows on the dry hills.
- They smoked wilde dagga at the fire.
