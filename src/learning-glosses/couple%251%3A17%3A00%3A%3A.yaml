simpleMeaning: In physics, this is a pair of forces of equal size that push opposite ways along parallel
  lines, treated as one unit.
scope: This is the physics unit formed by two such forces, not two people who are partners or live together,
  not a small number, not a pair of matching items, and not the verbs meaning to join things or have sex.
examples:
- The two forces form a couple that rotates the beam.
- Engineers measured the couple acting on the shaft.
