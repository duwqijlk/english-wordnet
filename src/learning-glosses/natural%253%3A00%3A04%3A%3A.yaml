simpleMeaning: in music, a pitch left at its basic level, with no semitone added above or below it.
scope: This describes a note left at its basic pitch, not something working in the usual way, not something
  that follows the course of nature, not something produced by the natural world rather than by people,
  not what is neither magical nor supernatural, not a relative by blood, not an action done on instinct,
  not goods left unprocessed, not inborn talent, and not behaviour free of pretence.
examples:
- In the key of C major, all the white keys are natural notes.
- Play B natural, not B flat.
