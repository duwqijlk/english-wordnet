simpleMeaning: The leg muscles drain through these blood tubes, which run beside the piercing arteries
  and empty into the deep blood tube of the thigh.
scope: 'Also called the perforating vein: blood tubes that run beside the piercing arteries and drain
  the leg muscles, not the piercing arteries themselves.'
examples:
- The vena perforantis drains blood from the leg muscles into the deep vein of the thigh.
- A scan showed the vena perforantis running beside a piercing artery in her leg.
