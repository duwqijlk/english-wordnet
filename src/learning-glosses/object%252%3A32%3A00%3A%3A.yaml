simpleMeaning: To say that you disagree with something, are against it, or think it is wrong.
scope: To speak out against something in protest, not simply to dislike it, and not a physical thing,
  a computing item or a grammar part.
examples:
- The residents objected to the plan for a new parking lot.
- She objected that the report ignored the workers' safety concerns.
