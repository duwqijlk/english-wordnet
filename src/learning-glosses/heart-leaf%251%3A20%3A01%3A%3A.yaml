simpleMeaning: From Virginia to South Carolina grows a low evergreen plant that lives for years, with
  spotted green and silver blades with a broad base and a point, smelling sharp
scope: Also called heartleaf, this is a low plant of Virginia to South Carolina, not the wild ginger with
  the same name.
examples:
