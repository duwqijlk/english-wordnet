simpleMeaning: the main written part of a work, not its pictures, notes, or other extra material
scope: This is the central written content of a book or article, not a short phone message and not a textbook.
examples:
- The diagrams are helpful, but the text explains the theory clearly.
- She read the text first and looked at the pictures later.
