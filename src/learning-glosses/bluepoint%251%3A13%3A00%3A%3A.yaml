simpleMeaning: Oysters first found in Long Island Sound, now gathered anywhere along the north-east coast,
  and usually eaten raw
scope: Oysters of this kind, also called blue point; not oysters from the Pacific coast and not oysters
  that are cooked.
examples:
- We ordered a dozen bluepoints on ice.
- Bluepoints from the north-east coast are often served raw.
