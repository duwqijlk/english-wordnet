simpleMeaning: a dress worn mainly by Hindu women, made of several yards of light cloth that is wrapped
  around the body
scope: 'Also called saree: this is the long cloth dress worn mainly by Hindu women, not a short dress
  or a skirt worn alone.'
examples:
- She wore a red sari to the wedding.
- Her sari was made of light cloth wrapped around her body.
