simpleMeaning: any device, driven by moving parts or electricity, that carries or changes energy in order
  to do or help with tasks people need to do.
scope: This is not an organized group of people, and not the verb meaning to make something with powered
  equipment; it is a physical device that does work.
examples:
- The machine cuts the metal sheets into exact shapes.
- Our washing machine stopped working last night.
