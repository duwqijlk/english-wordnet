simpleMeaning: A state of mind in which a person wrongly believes they are far greater or more powerful
  than they are.
scope: A state of mind marked by false beliefs about one's own greatness, not ordinary pride or ambition.
examples:
- His megalomania made him think he could rule the world.
- Megalomania led the general to ignore all advice.
