simpleMeaning: a firm that puts money in under set rules, with a pool of things of worth that keeps selling
  its shares and buying them back
scope: A firm that puts money in under set rules, with a pool of things of worth that keeps selling its
  shares and buying them back; open-end fund, mutual fund and mutual fund company are other names for
  this sense, not a bank and not a firm that puts money in without rules.
examples:
- The open-end investment company puts money in under set rules.
- An open-end investment company keeps selling its shares and buying them back.
