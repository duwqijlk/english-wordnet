simpleMeaning: a doctor who treats sick people with X-rays and with stuff that gives off rays
scope: 'Another name for this sense is radiologist: a doctor who treats sick people with rays, not a doctor
  who only takes pictures with X-rays and not a doctor who gives drugs.'
examples:
- The radiotherapist planned the course of X-ray treatment for her patient.
- After the scan, the radiotherapist explained how the rays would help fight the disease.
