simpleMeaning: Bearing small white flowers and red berries, this shrub stays green all year and spreads
  like a mat in North America and northern Eurasia, its leaves turning red in autumn
scope: Also called bear's grape, creashak, hog cranberry, mealberry, mountain box, red bearberry, sand
  berry, sandberry, and wild cranberry; a low shrub with red berries, not a cranberry bush.
examples:
- Common bearberry covers the rocky ground with its small white flowers in spring.
- In autumn the common bearberry shows red leaves and red berries.
