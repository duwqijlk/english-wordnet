simpleMeaning: A farm tool of round steel plates, curved inward, that cut the earth, for work in hard
  dry ground.
scope: This farm tool, also called a disc plow, has round steel plates, curved inward, that cut the earth,
  for work in hard dry ground.
examples:
- The farmer used a disc plough to break the hard dry soil.
- A disc plough cuts the earth with its round steel plates.
