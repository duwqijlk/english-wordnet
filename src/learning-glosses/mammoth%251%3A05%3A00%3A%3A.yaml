simpleMeaning: a kind of elephant, now gone from the earth, that lived long ago in many places; very big,
  with long hair and tusks that curved up
scope: A kind of elephant, now gone from the earth, that lived long ago in many places, very big with
  long hair and tusks that curved up; not the word for something very large.
examples:
- The mammoth's long tusks curved up from its jaw.
- Mammoths lived in the cold north long ago.
