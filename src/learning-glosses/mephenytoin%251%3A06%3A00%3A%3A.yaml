simpleMeaning: When milder drugs of the same kind have failed, this harmful drug, sold as Mesantoin, is
  used to stop fits in falling sickness.
scope: It is used for falling sickness only when milder drugs of the same kind have failed, not a drug
  tried first.
examples:
- Mephenytoin stopped the fits when the milder drugs had failed.
- The mephenytoin was given only after the milder drugs had failed.
