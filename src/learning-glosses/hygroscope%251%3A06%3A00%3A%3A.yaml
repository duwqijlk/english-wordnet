simpleMeaning: A tool that shows how the dampness of the air changes.
scope: A tool that shows how the dampness of the air changes, not a hygrometer that gives an exact reading
  and not a barometer.
examples:
- The hygroscope needle moved as the air grew damp.
- She watched the hygroscope before opening the windows.
