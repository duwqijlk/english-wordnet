simpleMeaning: In physics, a machine of any of several kinds that keeps and controls an atom change, to
  make power or new man-made bits of matter
scope: In physics, a machine that keeps and controls an atom change to make power or new man-made bits
  of matter, with reactor as another name for this sense; not a machine that burns coal, and not a bomb.
examples:
- The nuclear reactor makes power for the whole town.
- Workers shut down the nuclear reactor for repairs.
