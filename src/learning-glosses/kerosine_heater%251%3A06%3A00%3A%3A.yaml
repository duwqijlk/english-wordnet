simpleMeaning: A device that burns oil to give heat or to cook
scope: This is a device that burns oil to give heat or to cook; oilstove, kerosene heater and oil heater
  are other names for this sense, not a device that burns gas and not one that burns wood.
examples:
- They lit the kerosine heater to warm the room.
- A kerosine heater burns oil for heating or cooking.
