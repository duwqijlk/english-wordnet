senseId: 'unpredictably%4:02:00::'
synsetId: 00108490-r
simpleMeaning: in a way that keeps changing and cannot be known or told ahead of time
scope: 'Also called erratically: in a way that keeps changing with no clear pattern, so you cannot tell
  what will happen next. Not in a steady way that stays the same.'
examples:
- The wind blew unpredictably, first from the north and then from the south.
- Prices rose and fell unpredictably all week.
