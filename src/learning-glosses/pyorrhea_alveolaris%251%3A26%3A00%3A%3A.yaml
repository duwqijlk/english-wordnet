simpleMeaning: A long-lasting gum disease in which the flesh holding the teeth is sore and gives off pus
scope: A long-lasting gum disease; also called pyorrhea and pyorrhoea, not a short attack of sore gums.
examples:
- Pyorrhea alveolaris had left his gums sore for years.
- The dentist treated her pyorrhea alveolaris before any teeth came loose.
