simpleMeaning: People who have lately come to live in a new country and are grouped together because they
  are poor, even though they come from different cultures.
scope: Newcomers to a country grouped together because they are poor, not all poor people and not people
  from one culture.
examples:
- The report studied the immigrant class in the city.
- Many in the immigrant class worked long hours for low pay.
