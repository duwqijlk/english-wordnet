simpleMeaning: In maths, used for an equation (a statement that two amounts are equal) where each part
  has no power higher than one
scope: Also called linear. In maths, this describes an equation with no power higher than one, not a thing
  put into food or paint, and not the sense of being made by adding amounts.
examples:
- In class we solved an additive equation with no squared parts.
- An additive equation is easier because each part has no power higher than one.
