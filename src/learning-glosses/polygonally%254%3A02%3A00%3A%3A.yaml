simpleMeaning: In a way that has many straight sides and angles, like a shape with straight edges
scope: This describes doing or forming a thing with many straight sides and angles; not in a round way,
  and not with one straight side only.
examples:
- The tiles were laid polygonally around the hall.
- He cut the wood polygonally to fit the corner.
