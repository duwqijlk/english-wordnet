simpleMeaning: A big machine with two endless metal tracks, often used on building sites and farms to
  push earth around.
scope: A heavy tracked work machine, not the animal and not the leafy plant product also called cat.
examples:
- The crew brought in a cat to clear the site before the foundations went down.
- A cat crawled across the field, its metal tracks churning the mud.
