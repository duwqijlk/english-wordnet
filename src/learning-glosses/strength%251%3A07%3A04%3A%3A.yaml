simpleMeaning: the level of energy carried by sound, light, or other radiation
scope: This is the measured power of a signal such as sound or light, not muscle power, not persuasive
  force, and not the capacity to produce chemical effects.
examples:
- They measured the signal strength at the far end of the tunnel.
- The strength of the radio signal dropped behind the hills.
