simpleMeaning: First built in Italy in the middle of the 1400s, this stronghold usually has five to eight
  pointed three-sided walls that stick out so each can guard the next.
scope: 'Also called a star fort, a star fortress, a star-shaped fortress and trace italienne: a stronghold
  of pointed walls that stick out and guard each other, not one whose walls stand alone.'
examples:
- The bastion fort was built with five pointed walls that guard each other.
- They built the bastion fort in Italy in the middle of the 1400s.
