senseId: 'classic%1:18:00::'
synsetId: 09945884-n
simpleMeaning: An artist who has produced works regarded as lasting models of excellence.
scope: 'This means the artist, not the work: in ordinary modern English ''a classic'' is almost always
  a book, film or piece of music, while this sense names the person who made such works. It is rare and
  appears mostly in older criticism or formal writing. A learner meeting ''a classic'' should assume the
  work unless the context clearly names a person.'
examples:
- He was a classic of his generation, a painter whose works younger artists copied for decades.
- She is regarded as a classic of modern design, though her name is little known outside the field.
