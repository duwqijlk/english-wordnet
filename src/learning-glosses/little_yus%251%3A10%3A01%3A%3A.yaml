simpleMeaning: A front vowel sound made through the nose in Common Slavonic, used in the early Cyrillic
  and Glagolitic alphabets.
scope: This is a front vowel sound made through the nose in early Slavonic writing, one of the letters
  of the early Cyrillic and Glagolitic alphabets; it is not the big yus, its back-vowel fellow letter.
examples:
- The little yus stands for a nasal front vowel in the old Slavonic texts.
- In the early alphabets, the little yus and the big yus were both written as capitals and as small letters.
