synsetId: 06232435-n
simpleMeaning: doubt about whether God exists, and the view that no one can know for sure
scope: Doubt about whether God exists, with the view that the truth cannot be known; not belief in God
  and not the claim that there is no God.
examples:
- Her agnosticism means she is not sure whether God exists.
- His agnosticism holds that no one can prove or disprove God's existence.
