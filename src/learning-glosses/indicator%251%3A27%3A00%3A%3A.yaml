senseId: 'indicator%1:27:00::'
synsetId: 14941359-n
simpleMeaning: In chemistry, a substance that changes colour to show a certain chemical is present or
  a change has finished; in medicine, it can test for one kind of reaction
scope: In chemistry, a substance that changes colour to show something is there, not a number that shows
  how things change over time.
examples:
- The indicator turned red when the acid was added.
- Add a few drops of indicator to see if the reaction is complete.
