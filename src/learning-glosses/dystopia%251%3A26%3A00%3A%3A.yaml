senseId: 'dystopia%1:26:00::'
synsetId: 13955246-n
simpleMeaning: a state where life is extremely bad because people have too little, are ruled in a cruel
  and unfair way, or live in great fear
scope: This sense is the bad state itself where life is very hard, not a book or story that describes
  such a place.
examples:
- After the war, the country fell into a dystopia where food was scarce and people lived in fear.
- No one wanted to live in a dystopia ruled by fear and hunger.
