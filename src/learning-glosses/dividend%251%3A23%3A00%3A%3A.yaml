simpleMeaning: The number you start with in a maths sum, before another number splits it
scope: This is the number in a maths sum that gets split by another number, not the money a company pays
  to people who own parts of it.
examples:
- In 12 divided by 3, 12 is the dividend.
- The teacher wrote the dividend in large numbers on the board so we could split it by 4.
