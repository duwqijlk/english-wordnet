simpleMeaning: In medicine, tossing and twitching without rest, usually in a person who is severely ill.
scope: In medicine, tossing and twitching without rest, usually in a person who is severely ill; jactation
  is another name for this sense, not a single twitch and not a false boast in law.
examples:
- Jactitation troubled the patient through the night.
- The doctor noted jactitation as a sign of severe illness.
