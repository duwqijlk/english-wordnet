simpleMeaning: a person sent by one government to speak for it in another country, who ranks below an
  ambassador
scope: A person sent by one government to speak for it in another country, also called a minister, who
  ranks below an ambassador, and not an ambassador or a low-level clerk.
examples:
- The diplomatic minister met the foreign secretary to talk about trade.
- She was posted abroad as a diplomatic minister after years in the foreign service.
