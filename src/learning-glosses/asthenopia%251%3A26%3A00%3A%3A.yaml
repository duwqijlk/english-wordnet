simpleMeaning: tired eyes after long close work, in a person whose sight has not been put right
scope: 'Also called eyestrain: tired eyes from long close work with sight not put right, not a disease
  of the eye and not tiredness from lack of sleep.'
examples:
- Hours of reading gave her asthenopia, and her eyes ached.
- His asthenopia came from long close work with glasses he never wore.
