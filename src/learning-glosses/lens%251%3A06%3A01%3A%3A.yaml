simpleMeaning: a piece of electronic equipment that uses a magnetic or electric field to bring a beam
  of electrons to one point
scope: This is electronic equipment that brings electrons to one point, not the clear part inside the
  eye and not the glass piece used to form pictures.
examples:
- The electron lens in the machine brought the beam to a sharp point.
- Engineers changed the lens so the beam of electrons stayed tight and clear.
