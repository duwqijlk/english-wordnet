  made solid, a gas in the air turned hard and cold.'
scope: Made solid from carbon dioxide, it turns straight to gas at -78.5 C and most of all keeps things
  cold.
examples:
- The dry ice kept the fish cold on the long trip.
- Dry ice turned to gas and left no wet patch behind.
