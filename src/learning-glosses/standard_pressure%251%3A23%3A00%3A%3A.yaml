simpleMeaning: a measure of how hard something pushes, the push that holds up a column of mercury, a silver
  liquid metal, 760 mm high at sea level and 0 degrees centigrade
scope: 'Also called atmosphere, atm, or standard atmosphere: a set measure of push, not a measure of heat
  and not a measure of height.'
examples:
- The lab set the standard pressure to one atmosphere before the test.
- At standard pressure, the mercury column stood at 760 mm.
