simpleMeaning: not clear at the edges, so you cannot make out the shape well
scope: Unclear at the edges, so the shape is hard to make out, and blurred, fuzzy, hazy, blurry and foggy
  are other names for this sense; not dim from lack of light and not tired eyes.
examples:
- The bleary shapes in the mist were hard to make out.
- The bleary view through the wet glass hid the road.
