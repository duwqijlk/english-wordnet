simpleMeaning: A big tree of the East Indies, semi-evergreen, with sticky gum in its trunk, bitter tonic
  bark, seeds full of aromatic oil, and sometimes classed in the genus Melia.
scope: One of several names for this tropical tree, also called arishth, neem and nim tree; not the aromatic
  oil pressed from its seeds.
examples:
- Margosa bark has a bitter taste and was once used as a tonic.
- The margosa by the gate produces seeds that are pressed for aromatic oil.
