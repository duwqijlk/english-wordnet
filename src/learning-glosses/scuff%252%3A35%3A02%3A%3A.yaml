simpleMeaning: to get small marks or worn spots on its surface from rubbing or dragging
scope: This is about a surface getting marked or worn by rubbing, not about the act of dragging the feet
  or a slipper.
examples:
- These patent leather shoes scuffed.
- The new boots scuffed the first time he wore them on the rough floor.
