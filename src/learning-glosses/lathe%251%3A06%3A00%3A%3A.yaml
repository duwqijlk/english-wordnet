simpleMeaning: a machine for shaping metal or wood, where the piece being made turns on a line that goes
  from side to side against a tool that stays still
scope: A machine that shapes metal or wood by turning the piece against a still tool, not a machine that
  cuts with a moving blade and not a hand tool.
examples:
- He shaped the wooden leg on a lathe in his workshop.
- The metal part turns on the lathe while the tool cuts it.
