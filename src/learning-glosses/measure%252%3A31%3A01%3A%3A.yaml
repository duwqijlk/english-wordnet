schema: oewn-learning-gloss-v2
senseId: 'measure%2:31:01::'
synsetId: 00683348-v
simpleMeaning: to judge or guess how good, able, big, or important something or someone is, or what it
  is like
scope: 'Also called value: judging how good or important something is, not finding its size with a tool
  and not giving it as a number.'
examples:
- The teacher measured the students by how well they could write, not by test scores alone.
- We measured his skill by watching him play in three games.
