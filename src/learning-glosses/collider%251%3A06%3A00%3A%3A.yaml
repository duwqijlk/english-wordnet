simpleMeaning: a machine that speeds up two streams of tiny bits of matter and drives them straight into
  each other
scope: This is a machine that speeds up two streams of tiny bits of matter and drives them straight into
  each other; not a machine that speeds up one stream alone, and not a crash between cars.
examples:
- The new collider will smash the two streams of particles together at high speed.
- Physicists use the collider to study what happens when the particles meet.
