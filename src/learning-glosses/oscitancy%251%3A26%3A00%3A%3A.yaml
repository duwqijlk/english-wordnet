simpleMeaning: Yawning shows this state of being drowsy and dull
scope: Yawning that shows a drowsy, dull state, also called oscitance; not a single wide open-mouthed
  breath and not mere tiredness.
examples:
- Her oscitancy was clear from the yawns that came one after another.
- Oscitancy settled on the room, and soon everyone was yawning.
