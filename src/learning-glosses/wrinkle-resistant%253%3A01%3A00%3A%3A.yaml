senseId: 'wrinkle-resistant%3:01:00::'
synsetId: 03068276-a
simpleMeaning: Of cloth that keeps its smooth look and does not crease easily
scope: Of cloth that stays smooth and does not crease easily; wrinkleproof is another name for this sense,
  not cloth that is simply free of creases now.
examples:
- This shirt is wrinkle-resistant, so it still looks neat after a long day.
- She chose a wrinkle-resistant suit for travelling.
