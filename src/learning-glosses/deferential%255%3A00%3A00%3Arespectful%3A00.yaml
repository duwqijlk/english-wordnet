simpleMeaning: showing respect for someone by doing what they want or by following their ideas
scope: 'Also called deferent: this means showing respect for a person, not putting a decision off to a
  later time.'
examples:
- He gave a deferential nod to the judge before he spoke.
- She spoke to her teacher in a quiet, deferential way.
