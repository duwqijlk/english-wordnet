simpleMeaning: A hard material like horn, from the top jaws of some whales, used for thin sticks in fans
  or stiff parts in corsets (tight underclothes that shape the body)
scope: This hard material from a whale's top jaw is also called whalebone; it is the material itself,
  not a fan or a piece of clothing made from it.
examples:
- The museum showed a long piece of baleen from a whale's jaw.
- Long ago, baleen was used to make women's clothes stiff.
