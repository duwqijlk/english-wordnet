simpleMeaning: By testing tissue from round the unborn baby, this test done before birth looks for faults
  in the baby early in the pregnancy
scope: This test done before birth looks for faults in the unborn baby early in the pregnancy by testing
  tissue from round the baby; also called chorionic villus sampling, not a test done after the baby is
  born.
examples:
- The chorionic villus biopsy showed no faults in the unborn baby.
- She had a chorionic villus biopsy early in her pregnancy.
