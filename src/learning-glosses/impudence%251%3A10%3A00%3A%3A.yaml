simpleMeaning: something rude and without respect that a person says
scope: Something rude a person says; not the quality of being rude in general, and not a rude action.
examples:
- His impudence — 'Mind your own business!' — made the teacher angry.
- She was punished for the impudence of telling the principal, in front of everyone, that he was wrong.
