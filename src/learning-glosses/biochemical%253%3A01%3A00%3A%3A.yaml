simpleMeaning: about the chemical processes in living things, and about the study of those processes
scope: About chemical processes inside living things and the study of them; not about chemistry in rocks
  or other things that are not alive.
examples:
- Biochemical tests can show what is happening inside the blood.
- The biochemical changes in the plant start when the light gets weak.
