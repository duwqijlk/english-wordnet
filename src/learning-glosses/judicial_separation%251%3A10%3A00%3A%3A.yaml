simpleMeaning: A court order that sets out what a husband and wife who live apart may and must do
scope: A court order setting out the rights and duties of a husband and wife living apart, also called
  legal separation; not a divorce and not an informal agreement to live apart.
examples:
- The judge granted a judicial separation after the couple had lived apart for two years.
- Under the judicial separation, he paid support while she kept the house.
