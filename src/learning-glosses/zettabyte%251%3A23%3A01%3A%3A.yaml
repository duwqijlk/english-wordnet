simpleMeaning: A measure of computer information, equal to 1,000 exabytes, or 10 to the power of 21 bytes.
scope: A measure of computer information, 1,000 exabytes, not the 1,024-exbibyte measure of the same name.
examples:
- The archive was said to hold a zettabyte of data.
- One zettabyte equals 1,000 exabytes of information.
