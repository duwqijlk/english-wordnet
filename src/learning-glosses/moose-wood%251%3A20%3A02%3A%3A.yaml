simpleMeaning: A maple tree of eastern North America, with striped bark and big two-lobed leaves that
  turn clear yellow in autumn
scope: 'Goosefoot maple, moosewood, striped dogwood and striped maple are other names for this sense:
  a maple of eastern North America with striped bark, not the shrub of the same name with tough branches.'
examples:
- The moose-wood showed clear yellow leaves in autumn.
- We planted a moose-wood by the path.
