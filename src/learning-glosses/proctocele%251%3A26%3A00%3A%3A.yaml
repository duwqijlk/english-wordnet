simpleMeaning: A protrusion of the rectum into the vagina, which can occur when pelvic muscles are weakened
  by childbirth.
scope: 'Also called rectocele: the end of the gut bulging into the vagina after the muscles of the pelvis
  grow weak.'
examples:
- Her proctocele came on after childbirth weakened the muscles of her pelvis.
- The doctor found a proctocele, where the end of the gut had bulged into the vagina.
