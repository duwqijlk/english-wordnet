simpleMeaning: An old television camera tube, now unused, that turned light into a picture signal. Light
  hitting a light-sensitive surface freed electrons, focused onto a target that released still more electrons.
scope: Another name for the orthicon, the same obsolete camera tube. It is not the screen tube that shows
  the picture, and not a modern digital image sensor.
examples:
- The image orthicon made live outdoor broadcasts possible in the late 1940s.
- Studios replaced the image orthicon once cheaper camera tubes arrived.
