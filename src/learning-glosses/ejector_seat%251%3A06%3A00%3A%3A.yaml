senseId: 'ejector_seat%1:06:00::'
synsetId: 03272379-n
simpleMeaning: The pilot of a plane in trouble is thrown clear in this seat, then comes down to earth
  under a parachute.
scope: An ejection seat and a capsule are other names for this pilot's seat, built to throw its pilot
  clear of a plane in trouble and bring the pilot down under a parachute.
examples:
- The ejector seat fired and carried the pilot away from the stricken plane.
- An ejector seat lets a pilot leave a plane that can no longer fly.
