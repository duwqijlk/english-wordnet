simpleMeaning: A tall pine of east North America whose bark turns brown and splits in long lines as it
  grows old, and which is prized for its timber
scope: Also called eastern white pine, weymouth pine and American white pine, this is a tall east North
  American pine prized for timber, not a short shrub pine and not a pine of the west.
examples:
- The Pinus strobus towered over the yard.
- They cut a Pinus strobus for timber.
