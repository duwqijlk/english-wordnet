simpleMeaning: a crowd, especially of common people or things that are not special in any way
scope: A crowd of common people or things, not a group of wild animals and not a group of farm animals
  kept together.
examples:
- She did not want to follow the herd and think like everyone else.
- A herd of shoppers pushed into the shop for the sale.
