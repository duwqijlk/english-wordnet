simpleMeaning: forcing a choice between two or more possibilities that cannot all be taken
scope: This means the options exclude one another, not that they are unusual or outside the mainstream.
examples:
- Members were given alternative dates for the meeting, but could attend only one.
- The council weighed alternative sites for the new school, since only one could be built.
