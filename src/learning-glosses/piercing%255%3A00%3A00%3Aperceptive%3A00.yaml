simpleMeaning: able to notice small differences between things and tell them apart well
scope: 'Also called sharp, keen and acute: good at noticing small differences. This is about the mind,
  not about pain, cold or wind that hurts in a sharp way.'
examples:
- She has a piercing eye for detail and spots every small mistake.
- His piercing questions showed he could tell truth from lies at once.
