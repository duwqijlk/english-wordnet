simpleMeaning: given pain, shame, loss, or being held back for doing wrong, or to make a person do what
  is wanted
scope: This describes a person who has been made to suffer for doing wrong or to make them obey. It does
  not name the suffering itself.
examples:
- The punished boy was not allowed to go out to play.
- The punished prisoners were kept in their rooms all day.
