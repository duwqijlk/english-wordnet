simpleMeaning: a person who speaks for and tries to spread a set of ideas and beliefs
scope: This is a person who speaks for and tries to spread a set of ideas and beliefs. It is not the set
  of ideas itself, and not a person who only studies such ideas.
examples:
- The party ideologue gave speeches for hours about his plan for the country.
- As an ideologue, she would not listen to any other view.
