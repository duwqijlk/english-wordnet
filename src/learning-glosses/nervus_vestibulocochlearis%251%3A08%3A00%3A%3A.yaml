simpleMeaning: Hair cells in the balance organ and hair cells in the hearing part of the inner ear send
  their signals through one nerve made of two parts.
scope: The acoustic nerve, the auditory nerve, the eighth cranial nerve, and the vestibulocochlear nerve
  are also names for this one nerve made of two parts, which carries signals from the hair cells of the
  balance organ and of the hearing part of the inner ear.
examples:
- The nervus vestibulocochlearis carries signals from the hair cells of the balance organ.
- The nervus vestibulocochlearis also carries signals from the hair cells of the hearing part of the inner
  ear.
