synsetId: 01058906-v
simpleMeaning: To make a signal hard or impossible to receive.
scope: To disturb or stop radio, phone or other signals from being received; not to ban the use of money
  or property, not to obstruct a road, pipe or passage, not to stop an action in general, and not a noun
  for a memory lapse or a unit of data.
examples:
- The thick stone walls block the phone signal inside.
- The government blocked broadcasts from the foreign station.
