simpleMeaning: holes that take a plug, joined to the wires of a building so machines can run
scope: 'Also called electric outlet, electrical outlet and outlet: holes that take a plug, joined to the
  wires of a building so machines can run, not a switch that turns power on and off and not the wire itself.'
examples:
- He pushed the plug into the electric receptacle behind the desk.
- The electric receptacle near the door is loose.
