simpleMeaning: The brain or the cord down the back takes in signals through one of these nerve cells,
  which carries them inward.
scope: Also called a sensory neuron, this nerve cell carries signals inward to the brain or the cord down
  the back.
examples:
- The afferent neuron carried the signal from her fingertip to her brain.
- Damage to an afferent neuron can stop touch signals from reaching the brain.
