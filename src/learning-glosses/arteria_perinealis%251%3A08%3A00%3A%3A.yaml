simpleMeaning: The shallow parts of the skin between the legs are fed by a side tube off the deep blood
  tube that runs to the private parts
scope: This side tube off the deep blood tube that runs to the private parts is also called the perineal
  artery.
examples:
- The arteria perinealis carries blood to the shallow parts of the skin between the legs.
- The arteria perinealis comes off the deep blood tube that runs to the private parts.
