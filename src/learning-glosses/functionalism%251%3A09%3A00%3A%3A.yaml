senseId: 'functionalism%1:09:00::'
synsetId: 06149505-n
simpleMeaning: In psychology, the view that every part of the mind is of use to a living thing as it gets
  used to the world around it
scope: A view in psychology about the mind as a help in getting used to the world, not a view of the mind
  as a set of separate parts and not a way to treat a sick mind.
examples:
- Functionalism looks at how the mind helps a person get used to new things.
- She studied functionalism to learn why the mind works the way it does.
