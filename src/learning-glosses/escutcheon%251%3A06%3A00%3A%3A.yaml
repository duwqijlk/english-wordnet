simpleMeaning: a shield, especially one that shows a coat of arms, the signs and pictures that stand for
  a family or a group
scope: A shield with family signs on it, not a flat cover on a door or wall to keep it clean, and not
  a plate on the back of a ship with its name.
examples:
- The old escutcheon above the gate showed a lion and three stars.
- He painted a new escutcheon with his family's signs on it.
