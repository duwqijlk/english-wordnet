simpleMeaning: A straight rod for measuring land, painted with red and white bands in turn, each one foot
  wide; people measuring land use it to line up their sights
scope: Also called a range pole and a ranging pole, this is a short measuring rod, not the tall pole that
  holds a flag.
examples:
- The surveyor asked his helper to hold the flagpole straight at the mark.
- He looked through his instrument at the red and white flagpole in the field.
