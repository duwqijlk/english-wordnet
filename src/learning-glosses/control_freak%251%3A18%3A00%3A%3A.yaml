simpleMeaning: someone who feels a strong need to tell other people what to do and to run every part of
  a plan
scope: A person who must run everything and tell others what to do, not a person who simply likes things
  neat and not a leader who guides a group.
examples:
- The control freak rewrote everyone's part of the plan before the meeting.
- Nobody wanted to work with the control freak because she changed every detail.
