simpleMeaning: Food cannot get from the stomach into the first part of the gut when the ring of muscle
  at the stomach's outlet grows narrow.
scope: This narrowing sits at the stomach's outlet, where food should pass into the first part of the
  gut.
examples:
- The doctors found pyloric stenosis when food would not leave the stomach.
- After eating, the pyloric stenosis kept food from leaving the stomach.
