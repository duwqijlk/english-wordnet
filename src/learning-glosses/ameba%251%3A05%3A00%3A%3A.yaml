simpleMeaning: a one-celled animal with no shell or fixed shape that grows short-lived feet to move and
  feed, in fresh or sea water or inside another living thing
scope: Also called amoeba; a one-celled animal that changes shape as it moves, not a fixed-shape germ
  and not a tiny plant.
examples:
- An ameba in the pond water stretched out a foot to reach the food.
- The ameba changed shape as it moved across the slide.
