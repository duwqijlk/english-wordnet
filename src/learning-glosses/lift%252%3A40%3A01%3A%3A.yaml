simpleMeaning: use words or ideas from another person's writing, speech or other protected work without
  crediting the source
scope: Copying words or ideas without credit, not raising an object or taking a physical thing.
examples:
- The reporter lifted several paragraphs from a rival's article.
- Her thesis lifted ideas from an unpublished paper.
