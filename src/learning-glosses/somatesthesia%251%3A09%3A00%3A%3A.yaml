simpleMeaning: 'The body is known in three ways: by touch, by the feel of where the limbs are, and by
  what the parts inside are doing.'
scope: Also called somaesthesia, somaesthesis, somataesthesis, somatic sense, somatic sensory system,
  somatosensory system, somesthesia, or somesthesis, it covers only the senses of the body itself, not
  sight or hearing.
examples:
- Through somatesthesia, a person knows the legs are crossed.
- By somatesthesia, a person feels a limb move.
