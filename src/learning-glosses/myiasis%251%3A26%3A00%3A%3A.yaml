simpleMeaning: An invasion of the body by the young of flies, most often through a cut or other opening,
  or any illness that comes from such an invasion.
scope: An invasion of the body by the young of flies, most often through a cut, or an illness from such
  an invasion; not a bite from one fly and not a skin cut on its own.
examples:
- Myiasis set in after flies laid eggs in the wound.
- The vet treated the dog for myiasis.
