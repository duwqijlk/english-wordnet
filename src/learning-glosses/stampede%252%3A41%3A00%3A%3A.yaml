senseId: 'stampede%2:41:00::'
synsetId: 02600446-v
simpleMeaning: for a whole group to do something in a rush, most often all together, because a sudden
  urge takes hold
scope: For a whole group to act in a rush on a sudden urge, not a wild rush of frightened animals and
  not a headlong rush of people.
examples:
- Companies will now stampede to release their latest software.
- Fans stampeded to buy the first tickets.
