simpleMeaning: to write an amount of money into an account book on the side for money owed or paid out
scope: This is the act of writing the amount in, not the written entry for money that is owed, which is
  the noun sense of the same word.
examples:
- The bank debited twenty pounds from his account for the card payment.
- She debited the cost of the repairs to the company's account.
