simpleMeaning: a worker who takes the stems from wet tobacco leaves and ties the leaves into packs
scope: A worker who takes the stems from wet tobacco leaves and ties the leaves into packs; stripper and
  stemmer are other names for this sense, not a worker who dries tobacco and not a worker who rolls cigars.
examples:
- The sprigger worked through the wet leaves all morning.
- A sprigger ties the stemmed leaves into packs.
