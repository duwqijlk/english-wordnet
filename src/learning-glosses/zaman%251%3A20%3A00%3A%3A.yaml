simpleMeaning: A large decorative tree native to the American tropics; its leaves split twice into leaflets,
  its blooms form round clusters with crimson stamens, and its pods feed cattle.
scope: Another name for the tropical American ornamental tree also called rain tree and saman; in English
  it is the tree, not the unrelated word for time or an age.
examples:
- A zaman stood at the edge of the pasture.
- The zaman's branches were full of red-stamened flowers.
