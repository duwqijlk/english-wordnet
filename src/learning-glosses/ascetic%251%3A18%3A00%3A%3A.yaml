simpleMeaning: a person who lives without comfort or pleasure, as a strict way of life for their faith
scope: Also called abstainer. This is a person who gives up comfort and pleasure for faith, not the describing
  word for such a person or their strict way of life.
examples:
- The ascetic lived in a small room and ate very little.
- As an ascetic, he gave up rich food and soft beds.
