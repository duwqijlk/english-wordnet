simpleMeaning: A person who takes part in a religious time of prayer and quiet away from daily life.
scope: This is a person who joins in such a time of prayer and quiet, not the person who leads it or a
  person on holiday.
examples:
- The retreatant spent the weekend in silence and prayer.
- Each retreatant had a small room of their own.
