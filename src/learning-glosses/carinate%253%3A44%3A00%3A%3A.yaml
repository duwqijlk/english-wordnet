simpleMeaning: Having a raised line, or shaped like a raised line or like the bottom of a boat.
scope: Having a raised line, or shaped like a raised line or like the bottom of a boat; ridged, keeled
  and carinated are other names for this sense, not smooth and flat, and not the birds with ridged chest
  bones.
examples:
- A carinate sepal has a raised line.
- The carinate leaf looks as if it had a keel.
