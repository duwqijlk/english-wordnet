simpleMeaning: A sleep drug, a white powder with no smell and a slightly bitter taste, used as a salt
  of sodium to calm people and to treat fits
scope: Also called red devil, secobarbital and secobarbital sodium; a white bitter powder used to calm
  people and stop fits, its near kin being other sleep drugs such as phenobarbital and pentobarbital.
examples:
- The doctor prescribed Seconal to help her sleep.
- Seconal comes as a white powder used as a salt of sodium.
