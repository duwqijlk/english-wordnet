simpleMeaning: a computer program that keeps order in an online forum or talk by itself
scope: A computer program that keeps order in an online forum by itself, not a person who runs a forum.
examples:
- The automated moderator removed the rude post within seconds.
- Our automated moderator checks every new message in the forum.
