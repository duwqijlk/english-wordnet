simpleMeaning: a sky-coloured flag with a white square in the middle, flown to show a ship is ready to
  leave
scope: A ship's signal flag that shows it is ready to sail, not a flag asking for help and not a flag
  marking a ship at rest.
examples:
- The blue peter was flying from the mast, so we knew the ship would sail soon.
- When the captain raised the blue peter, the crew hurried aboard.
