simpleMeaning: Used to describe something to do with the inner ear, something that has an effect on it,
  or something that starts inside it
scope: This sense is only about the inner ear. It is not the sense that means like a maze in shape or
  in how hard it is to understand, and not the sense that means very complex and hard to sort out, at
  times in a dishonest way.
examples:
- Labyrinthine deafness starts in the inner ear.
- The doctor said the labyrinthine problem was causing his loss of balance.
