simpleMeaning: Eye muscles that cannot move and a body grown very weak mark a brain swelling that spread
  widely from 1915 to 1926
scope: 'Also called epidemic encephalitis, lethargic encephalitis, sleeping sickness, and sleepy sickness:
  a brain swelling of 1915 to 1926 that left eye muscles still and the body very weak, not the usual brain
  swelling brought on by a virus.'
examples:
- Encephalitis lethargica spread widely between 1915 and 1926.
- Patients with encephalitis lethargica could barely move their eyes.
