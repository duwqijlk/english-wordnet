simpleMeaning: the number equal to twelve gross, with a gross being one hundred and forty-four
scope: This is the number twelve gross, also called great gross; not one thousand and not two thousand.
examples:
- 1728 is twelve times 144.
- There are 1728 items in a dozen gross.
