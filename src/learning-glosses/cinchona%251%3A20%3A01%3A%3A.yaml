simpleMeaning: A healing bark from the tree of the same name, from which quinine and quinidine come
scope: A healing bark from the tree of the same name, from which quinine and quinidine come; cinchona
  bark is another name for this sense, not the bark of other trees and not the drugs themselves.
examples:
- Cinchona is the bark from which quinine comes.
- Doctors once used cinchona for fevers.
