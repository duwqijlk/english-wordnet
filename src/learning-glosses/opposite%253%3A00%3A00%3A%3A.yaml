simpleMeaning: Of leaves and similar plant parts, growing as a pair, one on each side of a stem.
scope: It describes plant parts arranged in matching pairs along a stem, not extreme or contrary in meaning,
  and not lying across from each other; paired is another name.
examples:
- Opposite leaves grow in matching pairs along the stem.
- The plant has opposite leaves rather than alternating ones.
