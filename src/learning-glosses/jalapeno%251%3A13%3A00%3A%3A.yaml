simpleMeaning: a green or red pepper with a hot taste, from Mexico and the south-west of the United States
scope: This is the pepper itself that you eat, not the plant that these peppers grow on.
examples:
- He sliced a jalapeno and added it to the beans.
- The green jalapeno gave the sauce a hot taste.
