simpleMeaning: High-power rays that can split things they pass through into charged bits.
scope: High-power rays that split what they pass through into charged bits, not ordinary light and not
  rays too weak to split anything.
examples:
- The workers wore shields against ionizing radiation.
- Ionizing radiation from the source split the air into charged bits.
