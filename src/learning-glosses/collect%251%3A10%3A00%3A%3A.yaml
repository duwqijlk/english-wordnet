simpleMeaning: a short prayer that generally comes before the lesson in the Church of Rome or the Church
  of England
scope: A short church prayer that generally comes before the lesson, not gathering things and not a call
  or package that the person who gets it pays for.
examples:
- The priest read the collect before the lesson.
- The collect for the day asked for peace for all people.
