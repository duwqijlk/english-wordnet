simpleMeaning: a 'to' form of a verb with a describing word put between 'to' and the verb, as in 'to boldly
  go'
scope: A 'to' form of a verb with a describing word between 'to' and the verb; not a plain 'to' form with
  nothing between and not a verb form with no 'to'.
examples:
- Some teachers hate a split infinitive like 'to boldly go'.
- She used a split infinitive in her essay.
