simpleMeaning: A tube-like part of the body has a hollow space inside it
scope: The hollow space inside a tube-like part of the body, not the wall of the tube and not the light
  unit of the same name.
examples:
- The lumen of the intestine was blocked.
- Food moves through the lumen of the gut.
