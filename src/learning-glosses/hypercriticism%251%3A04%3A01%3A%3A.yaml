simpleMeaning: Fault-finding that is far harsher and goes far further than is fair
scope: Finding fault far too strongly and unfairly; not a fair and useful judgment and not praise.
examples:
- His hypercriticism of every dish made the cook give up.
- Hypercriticism of the body appears more in some writings than in others.
