simpleMeaning: a person who studies geology, the rocks and soil of the earth and how they were made
scope: This is a person whose work is the study of the earth and its rocks, not a person who studies living
  things or the weather.
examples:
- The geologist studied the rocks by the river.
- A geologist told us how the hill was made long ago.
