simpleMeaning: a dog-like animal of the Old World, out at night, smaller than a wolf, hunting at times
  in a group but most often alone or in a pair
scope: A dog-like animal of the Old World that is out at night, smaller than a wolf; not the desert kind
  of North Africa and not the golden-coated kind.
examples:
- We heard a jackal calling alone in the night.
- Jackals hunt alone more often than in packs.
