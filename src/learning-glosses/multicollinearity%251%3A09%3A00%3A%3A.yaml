senseId: 'multicollinearity%1:09:00::'
synsetId: 06037373-n
simpleMeaning: Several things used to guess an answer are themselves closely tied to each other
scope: A case where the things used to guess an answer are closely tied to each other, not a case where
  they move on their own and not a single guess from one thing.
examples:
- The numbers showed multicollinearity, with the two measures rising and falling together.
- She checked for multicollinearity before she trusted the results of her study.
