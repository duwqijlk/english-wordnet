simpleMeaning: Broad land kept for the owner's own use, especially country land.
scope: This sense is also called an estate, land, and acres, for broad land kept for the owner's own use,
  especially country land, where an estate is a large spread of land and buildings, especially in the
  countryside, kept by its owner for their own use, and land is a large spread of ground owned by someone,
  often in the countryside, kept by the owner for their own use.
examples:
- The demesne stretched over broad land.
- Demesnes are broad lands kept by their owners.
