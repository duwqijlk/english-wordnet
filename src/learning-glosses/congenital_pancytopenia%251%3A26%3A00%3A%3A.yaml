senseId: 'congenital_pancytopenia%1:26:00::'
synsetId: 14188348-n
simpleMeaning: 'A rare illness found at birth: the blood lacks red cells and other cells too, because
  the soft matter inside the bones has not grown as it should.'
scope: This rare illness found at birth is not one caught later in life.
examples:
- The child was found to have congenital pancytopenia at birth.
- Congenital pancytopenia leaves too few blood cells of every kind.
