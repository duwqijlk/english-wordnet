senseId: 'nonparametric_statistic%1:09:00::'
synsetId: 06032076-n
simpleMeaning: a number worked out from a set of figures without knowing the shape of the spread they
  came from or the fixed values that set its shape
scope: A number worked out from figures without knowing the shape of their spread; also called distribution
  free statistic, not a number that needs a known shape and not a simple count.
examples:
- The study used a nonparametric statistic because the figures did not follow a known shape.
- A nonparametric statistic works without knowing the spread of the figures.
