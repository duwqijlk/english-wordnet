senseId: unbelieving%5:00:00:incredulous:00
synsetId: 00650269-s
simpleMeaning: refusing to believe the main beliefs of a group, especially a religion, or asking if they
  are true
scope: 'Also called skeptical, disbelieving and sceptical: refusing to believe or questioning the main
  beliefs of a group, especially a religion. Not the sense of rejecting all belief in gods, and not the
  sense that only things you can see and touch can be known.'
examples:
- His unbelieving friends questioned the story of the miracle.
- She took an unbelieving view of the church's teachings.
