simpleMeaning: Bars of metal are joined into a set that can shut off one part of a space from another,
  or cover a hole with gaps in it
scope: A set of metal bars joined to make a screen or a cover with holes in it, also called grill and
  grille, not a cooking fire and not a single bar.
examples:
- The grillwork across the window kept out thieves.
- Iron grillwork covered the opening in the wall.
