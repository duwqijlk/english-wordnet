simpleMeaning: The celebration of the saint it is named for, and one of the four dates in Scotland on
  which rents are paid.
scope: The feast on 11 November, also called Martinmas, one of the four quarter days in Scotland; not
  the other quarter days.
examples:
- St Martin's Day falls on 11 November.
- On St Martin's Day, rents were once due in Scotland.
