simpleMeaning: A sharp-tasting brown sticky stuff, now used most of all in medicine for animals.
scope: A sharp-tasting brown sticky stuff used most of all in medicine for animals; euphorbium is another
  name for it, not a sticky stuff used to thicken food and not one used to tan leather.
examples:
- The vet used gum eurphorbium on the sick horse.
- Gum eurphorbium is a brown sticky stuff used in medicine for animals.
