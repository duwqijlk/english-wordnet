simpleMeaning: the place, most often in the plural, from which a firm or other group is run and its work
  is led
scope: 'Also called headquarters, home base, home office, or main office: the place, most often in the
  plural, from which a firm or other group is run, not a small branch place and not the place where goods
  are made.'
examples:
- Many companies have their central office in New York.
- The central office sent new rules to all the shops.
