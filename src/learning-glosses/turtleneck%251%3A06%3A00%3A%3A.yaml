simpleMeaning: a knitted top, like a sweater or jersey, with a high collar that fits close round the neck
scope: 'Also called turtle: a knitted top with a high, close collar, not a top with a low round collar
  or an open neck.'
examples:
- She wore a black turtleneck under her jacket on cold days.
- His red turtleneck kept his neck warm all winter.
