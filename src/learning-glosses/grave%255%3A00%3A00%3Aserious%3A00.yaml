senseId: grave%5:00:00:serious:00
synsetId: 02126493-s
simpleMeaning: acting in a serious, controlled and not cheerful way, or having that kind of character,
  and firm about keeping promises
scope: 'Also called solemn: serious, controlled and not cheerful in how a person acts or in their character,
  and firm about keeping promises. Not a place where a dead body is put, and not grave meaning very bad
  or very important.'
examples:
- She made a grave promise and kept it.
- He was a grave man who never broke a promise.
