simpleMeaning: To do with the work of reporting the news, or like that work in how it is written and put
  together
scope: To do with news reporting and its style, not about a daily diary or a book of records.
examples:
- She writes in a clear journalistic style for the newspaper.
- The report has a journalistic feel, like a news story.
