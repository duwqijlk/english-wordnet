senseId: 'utopian%1:18:02::'
synsetId: 10763013-n
simpleMeaning: a person who wants to change society to make it perfect, but whose ideas usually cannot
  work in real life
scope: This is a person who wants to change society to make it perfect. It is not the describing word
  for a plan that aims at being perfect but cannot work, and not the describing word for things linked
  to an imagined perfect place.
examples:
- The Utopian wanted to build a town where no one was poor.
- Many people liked the kind Utopian, but they did not think his plan could work.
