simpleMeaning: A join at the ends of two rails or beams, made by bolting flat metal plates to their sides.
scope: A join between two rails or beams made by bolting flat metal plates to their sides; not a join
  made by welding, and not a plain end-to-end join with no plates.
examples:
- The workers bolted a fish joint to hold the two rails together.
- A fish joint keeps the rails from shifting apart.
