simpleMeaning: A bad headache that comes back again and again, caused by blood vessels, and it happens
  more often in women than in men
scope: This is a bad headache that comes back again and again, also called migraine, megrim, and sick
  headache, and not a short headache from tiredness or a headache from a cold.
examples:
- Her hemicrania returned every few weeks.
- Hemicrania is more common in women than in men.
