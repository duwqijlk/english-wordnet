simpleMeaning: An upright half-shrub with purple-tinged flowers and a swollen pod in which the ripe seeds
  shake and rattle; it grows in India.
scope: Also called Indian rattlebox; an upright half-shrub with purple-tinged flowers and a swollen pod
  whose ripe seeds rattle, kin to other shrubs with rattling pods.
examples:
- Crotalaria spectabilis stands by the path, its swollen pods full of rattling seeds.
- In India, Crotalaria spectabilis grows with purple-tinged flowers.
