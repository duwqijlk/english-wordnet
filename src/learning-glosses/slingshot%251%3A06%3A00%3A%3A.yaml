simpleMeaning: a toy in the shape of a Y, made of a stick with stretchy bands between its top ends, used
  to shoot small stones
scope: 'Also called sling and catapult: a small hand toy that shoots stones, not a big machine that throws
  heavy stones in war.'
examples:
- The boy used a slingshot to shoot a small stone at the can.
- She kept her slingshot in her pocket when she went out to play.
