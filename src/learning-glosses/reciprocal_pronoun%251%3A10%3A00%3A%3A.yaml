simpleMeaning: A small word, like 'each other', for what two or more people or things do to one another,
  or for how they stand to one another.
scope: It is the small word that shows what two or more people or things do to one another, as in 'They
  cared for each other'.
examples:
- The sentence 'They cared for each other' contains a reciprocal pronoun.
- In 'The two friends helped each other', 'each other' is a reciprocal pronoun.
