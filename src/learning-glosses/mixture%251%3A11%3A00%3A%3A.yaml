simpleMeaning: something that happens when different things come together and join with each other
scope: An event that brings different things together; not a substance mixed together in chemistry, and
  not a food made by joining different parts.
examples:
- The meeting was a mixture of talks, music, and games in one evening.
- A gradual mixture of cultures took place as the two towns grew together.
