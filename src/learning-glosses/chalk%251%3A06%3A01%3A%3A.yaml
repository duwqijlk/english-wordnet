simpleMeaning: a drug made from amphetamine (a drug that speeds up the body), sold as Methedrine in clear
  crystal salt form, used to wake the nerves and cut hunger
scope: A drug sense, also called glass, ice, trash, meth, and crank; not the stick used for writing on
  a board, and not the act of writing with it.
examples:
- The man was charged with selling chalk as a street drug.
- Using chalk to stay awake and eat less harmed his health.
