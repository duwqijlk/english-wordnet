simpleMeaning: a plant that grows fruit like nuts, with sharp points in four places, that people can eat
scope: 'Also called water chestnut and water chestnut plant: the plant with nut-like fruit that people
  can eat, not the poisonous plant with sharp fruit that grows as a weed in fields.'
examples:
- She picked a caltrop fruit, which had four sharp points and could be eaten.
- Caltrops bear nut-like fruit with four sharp ends.
