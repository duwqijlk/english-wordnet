simpleMeaning: The result left after one number is taken from another; added to the amount removed, it
  gives the starting number.
scope: This is the arithmetic result of subtracting, not a disagreement or a point that makes things unlike.
examples:
- The difference between nine and four is five.
- Subtract the smaller figure and write the difference in the box.
