simpleMeaning: to make something shorter or smaller in what it covers, while keeping its most important
  parts
scope: 'Also called cut, reduce, contract, shorten, abbreviate and foreshorten: to make something smaller
  in what it covers while keeping its most important parts. Not the sense of making something less in
  general.'
examples:
- The editor abridged the long novel for young readers.
- They abridged the report but kept all the main facts.
