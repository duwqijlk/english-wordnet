simpleMeaning: For joining wires at a board made for the job, this length of wire has a plug at each end
scope: A length of wire with a plug at each end, for joining wires at a board made for the job, not a
  wire fixed in a wall and not a wire that carries power to a house.
examples:
- He used a patchcord to link the two machines.
- The patchcord had a plug at each end.
