simpleMeaning: the act of giving up something, such as land or a right, to another person or group
scope: This is the act itself, of giving something up to another; not the thing that is given up and not
  taking something from another.
examples:
- Ceding the land to the next town ended the long argument.
- The king spoke of ceding his power to his son.
