simpleMeaning: to eat far more than you need, in a greedy way and with no control over yourself
scope: 'Also called stuff, gorge, binge, engorge, glut, satiate and overindulge: eating far more than
  you need, not just eating until you feel full in a normal way.'
examples:
- He overate at dinner and then felt sick.
- The children overate on cake and sweets at the party.
