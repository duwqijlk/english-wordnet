simpleMeaning: Too little oxygen getting to the body because the blood has too little of the red stuff
  that carries oxygen
scope: This is too little oxygen in the blood because the blood lacks the red stuff that carries oxygen;
  not low oxygen from bad breathing in the lungs, and not anoxia from poor oxygen in the lungs.
examples:
- The doctor said the patient had anemic hypoxia after losing a lot of blood.
- Anemic hypoxia can leave a person weak and short of breath.
