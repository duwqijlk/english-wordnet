senseId: 'book_jacket%1:10:00::'
synsetId: 07262988-n
simpleMeaning: a paper cover that wraps round a bound set of pages, most often with words on it that praise
  what is inside to help sell it
scope: 'Also called dust cover, dust jacket and dust wrapper: a paper cover that wraps round a bound set
  of pages, most often with words on it that praise what is inside to help sell it, not the hard cover
  itself and not a plain paper bag.'
examples:
- The book jacket was torn at the corner.
- She read the praise printed on the book jacket before she bought it.
