simpleMeaning: a person whose way of being and acting is strange and not like most people
scope: 'Also called flake, eccentric, and geek: this is a person whose way of acting is strange, not just
  a strange object or idea.'
examples:
- Our neighbour is a friendly oddball who paints his door a new colour each week.
- The class oddball always wore a hat made of paper.
