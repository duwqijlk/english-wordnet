simpleMeaning: Bands that take turns in red and white, each one foot wide, mark a straight rod that surveyors
  use to line up their sights.
scope: Another name for a range pole and a flagpole, it is a striped rod used by surveyors to line up
  a sight.
examples:
- The ranging pole stood at the end of the line.
- He moved the ranging pole to mark the next point.
