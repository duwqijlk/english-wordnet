simpleMeaning: how much less the core of an atom weighs than its parts weighed together
scope: How much less the core of an atom weighs than its parts weighed together; mass deficiency is another
  name for this sense, not the weight of the whole atom and not the energy given out when the core forms.
examples:
- The mass defect of the nucleus is small but real.
- Physicists measure the mass defect to find the binding energy.
