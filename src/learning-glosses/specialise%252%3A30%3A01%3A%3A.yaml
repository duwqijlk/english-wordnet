senseId: 'specialise%2:30:01::'
synsetId: 00438687-v
simpleMeaning: To give a thing one set job, shaping it so it serves that job and no other.
scope: Also called specialize; to shape a thing for one set job, not to be exact about what you mean,
  and not the evolving or devoting senses.
examples:
- She specialised her research on river birds.
- This kind of beak has become specialised in certain Galapagos finches.
