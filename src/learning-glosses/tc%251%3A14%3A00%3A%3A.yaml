simpleMeaning: A lasting body of the United Nations that asks one or more countries to run a land for
  it.
scope: Also called the Trusteeship Council, this is a lasting United Nations body that hands a land to
  a country to run, not a court or a meeting of all member states.
examples:
- The TC asked New Zealand to run the islands.
- Under the TC, one country took charge of the territory.
