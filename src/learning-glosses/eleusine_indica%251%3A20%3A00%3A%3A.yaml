simpleMeaning: A rough grass that lives one year, with flower heads like fingers; from the hot lands of
  the Old World, now a weed that has settled in other places.
scope: A rough one-year grass with finger-like flower heads, also called goose grass, wire grass, yard
  grass and yardgrass; it comes from the hot lands of the Old World and now grows wild as a weed elsewhere.
examples:
- Eleusine indica grows along the path, its finger-like flower heads easy to spot.
- The gardener pulled out the Eleusine indica before it spread across the lawn.
