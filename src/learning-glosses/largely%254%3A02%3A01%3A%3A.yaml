simpleMeaning: in a way that is big in size or that spreads over a wide area
scope: About size or area, done in a big way; not the sense that means mostly or for the most part.
examples:
- The picture was drawn so largely that it filled the whole wall.
- He wrote his name largely across the top of the page.
