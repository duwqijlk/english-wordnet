simpleMeaning: a way inside the body that moves a body liquid, especially blood, from one tube or path
  to another
scope: A passage in the body for moving blood or other liquid, not a tube put in the body to drain liquid
  and not a part in an electric circuit.
examples:
- A shunt in his heart let blood pass from one side to the other.
- Blood flowed through the shunt to the other vessel.
