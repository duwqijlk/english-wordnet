simpleMeaning: This tree of the south Mediterranean Sea gives a sweet stuff and bears sweet-smelling white
  blooms in thick bunches.
scope: 'People also call it flowering ash: it is the tree whose sweet-smelling white blooms grow in thick
  bunches.'
examples:
- The manna ash flowered, its white blooms in thick bunches.
- They took the sweet stuff from the manna ash.
