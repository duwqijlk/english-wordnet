simpleMeaning: Put into holes drilled beforehand, this round-headed metal pin for wood carries a screw
  thread on part of its shaft
scope: This round-headed metal pin for wood has a thread on part of its shaft, unlike a screw and unlike
  a nail.
examples:
- He fixed the beam with a carriage bolt through the drilled hole.
- The carriage bolt slid into the hole already drilled in the timber.
