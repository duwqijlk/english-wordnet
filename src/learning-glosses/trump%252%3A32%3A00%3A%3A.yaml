simpleMeaning: to say something loudly and in public, as if with a short burst of loud music to draw people's
  attention
scope: To say something loudly and in public, as if with a short burst of loud music; not a card that
  wins over other cards, not playing such a card, and not a metal music tool you blow.
examples:
- The town crier trumped the news of the new road to the crowd in the square.
- They trumped the start of the fair so that everyone in the town could hear it.
