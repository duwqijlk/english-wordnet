simpleMeaning: Tart and sweet at once, the purple flesh of this deep red-purple fruit from India, like
  a gooseberry, goes above all into preserves.
scope: Also called ketembilla and kitembilla, this is a deep red-purple Indian fruit, not a gooseberry.
examples:
- Kitambilla preserves were sweet and tart.
- The kitambilla tasted tart and sweet at once.
