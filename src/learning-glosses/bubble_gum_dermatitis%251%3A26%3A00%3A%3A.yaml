scope: This is a skin rash from touching something one is allergic to, that forms round the lips of children
  who chew a sweet, stretchy treat, not a cold sore and not chapped lips.
examples:
- Bubble gum dermatitis reddened the skin round her lips.
- The child had bubble gum dermatitis from chewing gum all day.
