simpleMeaning: A person damaging a thing so that it becomes worse
scope: 'Also called spoil and spoilage: this is a person doing damage to something, not the slow change
  by which a thing becomes bad on its own.'
examples:
- Her spoiling of my dress left a bad mark on it.
- His spoiling of the painting did real damage to its surface.
