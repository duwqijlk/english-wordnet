senseId: 'over-burned_lime%1:27:01::'
synsetId: 92429158-n
simpleMeaning: A white material made by heating limestone above 1,100 C, after which it can no longer
  react or set, so it binds poorly or not at all.
scope: This sense names high-fired material that has lost its reactive power; it is not ordinary quicklime,
  and the near-synonym dead-burned lime is treated in its own entry.
examples:
- The over-burned lime failed to harden the mortar mix.
- We rejected the over-burned lime because it would not react with water.
