simpleMeaning: A doctor's tool made of a wire ring that can be pulled tight round the foot of a small
  growth to cut it off, used especially inside the body
scope: A doctor's wire tool for cutting off small growths inside the body, not a trap for animals, not
  the drum or its strings, and not a thing that catches you by surprise.
examples:
- The surgeon used a snare to remove the small growth.
- With a snare the doctor cut the polyp away.
