simpleMeaning: This word names a person with forebears from more than one people, above all from Europe
  and from the first peoples of the Americas.
scope: It names a person whose forebears came from more than one people, above all from Europe and from
  the first peoples of the Americas, not a person of one people only.
examples:
- The mestizo had forebears from Europe and from the first peoples of the Americas.
- A mestizo is a person of more than one people.
