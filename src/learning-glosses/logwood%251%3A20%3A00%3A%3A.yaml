simpleMeaning: Thorny bush or small tree growing in Central America and the West Indies, with finely divided
  leaves and clusters of yellow flowers. Its hard reddish-brown wood makes black dye.
scope: This is the living shrub that supplies the dye wood, another name for campeachy and bloodwood tree;
  it is not the heartwood itself, which is sold for dyeing cloth.
examples:
- Logwood covered the low hills near the coast, its yellow flowers showing above the scrub.
- Farmers cleared logwood to make room for crops and sold the timber.
