simpleMeaning: At the two furthest extremes and completely at odds with each other.
scope: It describes two things at the furthest extremes, not things merely unlike in nature, not the other
  half of a matching pair, and not two things facing each other; polar, diametrical and diametric are
  other names.
examples:
- They hold opposite views on almost every subject.
- The two ends of the magnet have opposite charges.
