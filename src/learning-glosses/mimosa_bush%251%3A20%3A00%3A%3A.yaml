simpleMeaning: Sweet-smelling yellow flowers, used to make perfume, grow on this thorny shrub or small
  tree of warm America.
scope: Also called cassie, flame tree, huisache, scented wattle, sweet acacia, and sweet wattle, it is
  a thorny shrub or small tree of warm America.
examples:
- The mimosa bush has sweet-smelling yellow flowers.
- A mimosa bush grows in warm America.
