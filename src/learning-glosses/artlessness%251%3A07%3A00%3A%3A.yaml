simpleMeaning: an honest and open way of acting, with no wish to trick or deceive anyone
scope: A plain, honest quality of a person, not a lack of skill and not a show of being clever.
examples:
- Her artlessness made everyone trust her at once.
- He spoke with such artlessness that no one doubted him.
