simpleMeaning: Shaped like a fork, split into two parts that spread apart.
scope: Shaped like a fork and split into two parts; forked, branched, pronged, bifurcate, forficate and
  fork-like are other names for this sense, not a single straight part and not a part split into many
  parts.
examples:
- The biramous legs of the crab split into two branches.
- A biramous tail forks into two even parts.
