synsetId: 06779826-n
simpleMeaning: something you say or write that shows you have thought about a thing with care
scope: 'Also called reflection: something you say or write after thinking with care, not the act of looking
  at something and not the facts you learn by looking.'
examples:
- She made a useful observation about the plan after reading it twice.
- His observation that the road was not safe made us think again.
