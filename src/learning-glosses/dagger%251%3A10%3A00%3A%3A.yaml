simpleMeaning: a printed sign for a second note at the foot of a page, or for pointing to another part
  of the same text, when the star sign is already used
scope: A printed sign for a second note or link, not a short knife with a sharp blade used for stabbing.
examples:
- The dagger after his name points to a second note at the foot of the page.
- In this book, a dagger is used for the second note because the star is used for the first.
