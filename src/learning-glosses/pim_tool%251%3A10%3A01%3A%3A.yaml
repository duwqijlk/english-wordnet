simpleMeaning: A computer program that keeps a person's notes, dates, contacts and other private facts
  in order, so they can be found and used.
scope: A computer program that keeps one person's own facts in order, also called a personal information
  manager and also called PIM, not a paper diary and not a database shared by a whole office.
examples:
- I keep all my meeting notes in a PIM tool on my laptop.
- She uses a PIM tool to track birthdays and phone numbers.
