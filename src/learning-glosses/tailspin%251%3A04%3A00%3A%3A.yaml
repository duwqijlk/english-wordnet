simpleMeaning: A plane dropping fast out of the sky, turning round and round as it falls.
scope: A plane falling fast in a steep spiral, also called a spin; not a spin on the ground and not a
  dive in a straight line.
examples:
- The plane went into a tailspin over the sea.
- After the engine failed, the tailspin began at once.
