senseId: 'demurrage%1:21:00::'
synsetId: 13345449-n
simpleMeaning: A charge asked as payment for the delay of a ship, freight car, or other cargo, past its
  set time of leaving.
scope: A charge asked as payment for the delay of a ship, freight car, or other cargo, past its set time
  of leaving; not the holding of a ship, freight car, or other cargo, past its set time of leaving.
examples:
- Their demurrage mounted at dawn.
- The demurrage was paid at noon.
