simpleMeaning: one tenth of a liter, used as a unit to say how much a thing holds
scope: This is one tenth of a liter, used to measure how much a thing holds; deciliter and dl are other
  names for this sense, not a whole liter and not a unit for weight.
examples:
- Pour a decilitre of cream into the bowl.
- The recipe calls for three decilitres of stock.
