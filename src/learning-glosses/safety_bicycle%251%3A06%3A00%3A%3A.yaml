simpleMeaning: Its pedals joined to the back wheel by a gear that turns the wheel faster than the pedals,
  this cycle has two wheels of the same size.
scope: This cycle has two wheels of the same size, with pedals joined to the back wheel by a gear, and
  is also called a safety bike, not a cycle with one big wheel and one small wheel.
examples:
- She rides a safety bicycle every day.
- He fixed the gear on his safety bicycle.
