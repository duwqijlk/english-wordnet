simpleMeaning: Got in ways that break the law or are otherwise improper.
scope: Money or gains from illegal or improper methods; another name for this sense is ill-gotten — not
  a general lack of ethics or physical grime.
examples:
- Investigators traced the dirty money to a smuggling ring.
- He refused to accept dirty profits from the deal.
