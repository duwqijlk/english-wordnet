simpleMeaning: in a way that makes people doubt, or that shows doubt
scope: Done in a way that raises doubt or shows doubt; not in a way that is clearly wrong and not in a
  way that is clearly honest.
examples:
- He looked dubiously at the old bridge before crossing.
- She smiled dubiously when he told her the news.
