simpleMeaning: ducks from North America that dive under water and have a blue-grey bill
scope: These are ducks that dive and have a blue-grey bill; also called broadbill, bluebill and scaup
  duck. Not other diving ducks and not a duck that feeds on the surface.
examples:
- We watched scaups dive for food in the lake.
- The scaup's blue-grey bill stood out among the other ducks.
