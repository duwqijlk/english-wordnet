synsetId: 01447325-a
simpleMeaning: Holding shares, bonds or commodities in the hope that their prices will rise.
scope: This is a financial position based on expected price increases, not a great length, not a great
  duration, not a sound held for extra time, not a risky venture, and not being prudent about the future.
examples:
- She is long on technology stocks, betting they will climb.
- The fund stayed long in copper through the summer.
