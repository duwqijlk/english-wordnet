simpleMeaning: A nettle of tropical America that does not sting, shooting out its pollen with a sudden
  burst.
scope: Also called artillery plant; a nettle of tropical America, set apart from stinging nettles by its
  lack of a sting and its bursting pollen.
examples:
- Pilea microphylla puffed out a cloud of pollen when I touched it.
- The Pilea microphylla in the greenhouse never stings.
