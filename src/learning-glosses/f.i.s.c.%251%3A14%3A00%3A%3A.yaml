simpleMeaning: A secret federal court created in 1978 by the Foreign Intelligence Surveillance Act, approving
  wiretaps and electronic spying and searches of suspected spies and terrorists by Justice or intelligence
  officials.
scope: Also called the Foreign Intelligence Surveillance Court; a secret court that approves spying, not
  the law that created it.
examples:
- The F.I.S.C. approved the wiretap request.
- Critics say the F.I.S.C. works in secret.
