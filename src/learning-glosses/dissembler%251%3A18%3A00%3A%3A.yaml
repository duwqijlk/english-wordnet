senseId: 'dissembler%1:18:00::'
synsetId: 10215212-n
simpleMeaning: A person who says they believe things they do not believe, to hide what they really feel
  or want.
scope: A person who pretends to hold beliefs they do not hold, also called a phony, a hypocrite, a pretender,
  a phoney, or a dissimulator.
examples:
- The dissembler praised the plan in public but worked against it in private.
- No one trusted the dissembler, whose fine words hid other aims.
