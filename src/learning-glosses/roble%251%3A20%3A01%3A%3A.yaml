simpleMeaning: Long, thin, pointed acorns and tough leaves grow on a tall, graceful oak of California
  that sheds its leaves each year.
scope: 'Also called valley oak and valley white oak: a tall, graceful oak of California with tough leaves
  and slender pointed acorns.'
examples:
- The roble sheds its leaves each year.
- We gathered slender pointed acorns under the roble.
