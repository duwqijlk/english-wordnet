senseId: 'singularise%2:32:00::'
synsetId: 00924612-v
simpleMeaning: To pick something out as one thing, not one of a group
scope: To pick something out as one thing rather than one of a group, also called singularize; not just
  seeing a thing, and not splitting a group apart.
examples:
- The writer singularised the hero by giving him a name no one else had.
- She singularised the case as the only one of its kind.
