simpleMeaning: Soft clay with no iron in it, made into pots and shaped into things
scope: This is soft clay with no iron in it, used to make pots and to shape things, also called potter's
  clay, and not the clay used for bricks.
examples:
- The potter's earth was free of iron, so it fired to a pale colour.
- She dug the potter's earth from the bank and kneaded it well.
