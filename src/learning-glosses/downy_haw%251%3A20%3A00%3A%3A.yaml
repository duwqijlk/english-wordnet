simpleMeaning: Its stems and leaves are thickly covered with short, woolly hairs, and this American tree
  or shrub bears red fruit.
scope: This American tree or shrub, also called red haw, bears red fruit and has stems and leaves thickly
  covered with short, woolly hairs.
examples:
- The downy haw bore red fruit.
- We brushed the downy haw leaves and felt the short woolly hairs.
