simpleMeaning: the act of letting a person have or do what they want, to please them
scope: 'Also called indulgence, indulging and pampering: the act of letting a person have what they want
  to please them, not a joke meant to make people laugh.'
examples:
- Humoring the child with another sweet only made him ask for more.
- She knew that humoring her father's wish for a long drive would make him happy.
