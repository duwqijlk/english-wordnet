simpleMeaning: A green sea plant that can be eaten, with leaf-like parts that let light through and have
  wavy edges.
scope: A green sea plant that can be eaten, with leaf-like parts that let light through and have wavy
  edges; not a sea plant with thick brown leaves, and not a land plant with green leaves.
examples:
- Laver is gathered from the rocks and cooked as a green food.
- The laver on the shore had crinkly green fronds.
