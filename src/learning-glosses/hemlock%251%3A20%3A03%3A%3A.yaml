simpleMeaning: Large branching plant living two years, with large fern-like leaves and white flowers,
  native to Eurasia and Africa and introduced to North America, usually in damp places, extremely poisonous
  throughout.
scope: The living poisonous plant, not the poison taken from it and not the evergreen tree that shares
  its name.
examples:
- Hemlock grows along the damp banks of the stream.
- Every part of the hemlock is poisonous, so keep children away from it.
