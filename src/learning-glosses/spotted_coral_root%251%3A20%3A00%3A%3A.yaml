simpleMeaning: A leafless orchid with brownish or purplish stems and loose sprays of flowers whose white
  lip, a petal-like part, is dotted with purple; it grows from Canada to Guatemala.
scope: A leafless woodland orchid told apart by its purple-dotted white lip, not the yellow-flowered or
  striped-lip kinds.
examples:
- We found a spotted coral root growing in the shade of the pines.
- The spotted coral root has no leaves, only brownish stems.
