simpleMeaning: Grown far and wide in Florida, this big citrus tree bears big sweet fruit of a deep red-gold
  colour that peels with ease.
scope: Also called a tangor, a temple orange, or a temple orange tree, this tree of Florida bears big
  sweet fruit of a deep red-gold colour that peels with ease.
examples:
- A king orange grows in the garden behind their house in Florida.
- They picked the sweet fruit from the king orange and peeled it with ease.
