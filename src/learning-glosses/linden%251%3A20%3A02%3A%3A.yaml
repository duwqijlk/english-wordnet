simpleMeaning: soft, pale wood from this kind of tree, used for making boxes for goods, for carving, and
  for making wood parts
scope: 'Also called basswood: the wood from this tree, not the tree itself and not wood from other kinds
  of tree.'
examples:
- The large box for moving goods was made from pale linden.
- He carved the small figure from a piece of linden.
