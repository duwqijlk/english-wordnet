simpleMeaning: 'wavelengths of electromagnetic radiation are given in this metric unit of length: one
  ten billionth of a meter, or 0.0001 micron'
scope: 'Also called angstrom unit: a tiny unit of length used for wavelengths, not a unit for weighing
  things or for everyday lengths.'
examples:
- The wavelength was measured in angstroms.
- Light of 5000 angstroms falls in the green part of the spectrum.
