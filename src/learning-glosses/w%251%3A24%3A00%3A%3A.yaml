simpleMeaning: A main point of a compass, at 270, a fourth of a turn from north, the other side from east.
scope: The main point on a compass at 270 degrees, a quarter turn from north the other way; also called
  west, westward, and due west, and not the letter, and not the metal.
examples:
- They drove west to the sea.
- The sun sets in the west.
