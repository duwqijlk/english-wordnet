simpleMeaning: in a way that makes people feel pity mixed with a low opinion of the person or thing
scope: In a way that makes people feel pity mixed with a low opinion of a person or thing, not pity mixed
  with kind sympathy and care.
examples:
- The team played pathetically badly in the final game.
- He had pathetically little to show for years of work.
