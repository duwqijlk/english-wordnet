simpleMeaning: An organ's small side parts belong with it and sit beside it, most often those of the young
  before birth.
scope: Also called adnexa, this word is used for an organ's small side parts, most often those of the
  young before birth.
examples:
- The fallopian tubes and ovaries, annexa of the uterus, were healthy.
- Beside the womb sit the annexa, the tubes and ovaries that belong to it.
