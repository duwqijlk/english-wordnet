simpleMeaning: Any information or event that pushes a person to act
scope: This is a fact or event that pushes a person to act, also called input, stimulus, and stimulant.
  It is not sexual touching before sex, and not an effect on nerves or parts of the body.
examples:
- The busy city gave her mind much stimulation.
- Good books can give children stimulation to learn and to act.
