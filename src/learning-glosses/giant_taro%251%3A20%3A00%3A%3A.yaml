simpleMeaning: Grown across the tropics for its edible underground stem and shoots, this large evergreen,
  with enormous leaves pointing up or out, is a stately ornamental in warm, wet places.
scope: This is the very large tropical foliage plant with enormous leaves, grown for its edible stem and
  shoots and valued as a striking ornamental; it is not common taro, the smaller food crop, and not a
  tree or palm despite its size.
examples:
- Giant taro towers over the border with its enormous, spreading leaves.
- In warm wet climates, people grow giant taro for its edible stem and shoots.
