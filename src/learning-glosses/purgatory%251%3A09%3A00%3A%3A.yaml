simpleMeaning: In theology, in the Roman Catholic faith, the place where people who die in God's favour
  suffer pain for a limited time to make up for their sins
scope: This is the Roman Catholic place after death, not just any short time of pain or suffering in life.
examples:
- In Catholic teaching, souls in purgatory are made clean before heaven.
- He prayed for his grandfather's soul in purgatory.
