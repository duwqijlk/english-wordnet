simpleMeaning: A picture made to order, or picked from a set ready-made, is printed on paper for show
  and most often put up on one side of a room only.
scope: Also called mural wallpaper, photo mural, and photo wallpaper, it is paper for show put on one
  side of a room, with a picture made to order or picked from a set.
examples:
- The wall mural was printed on paper and put up on one side of the room.
- They picked a wall mural from a set ready-made.
