simpleMeaning: A cross beam that lies under the rails and holds them in place, one of many across the
  track
scope: 'Also called tie: one of the cross beams that hold the rails on a track, not a person asleep, not
  a hidden agent, not a fish, and not a train car.'
examples:
- The British call a railroad tie a sleeper.
- Workmen laid new sleepers under the rails.
