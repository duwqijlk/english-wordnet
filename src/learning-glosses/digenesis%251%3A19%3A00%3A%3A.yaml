simpleMeaning: a way of life in which one set of young is born by mating and the next set is born without
  mating, and so on
scope: A way of life in which birth by mating and birth without mating take turns, also called metagenesis,
  and not a life with only one way of making young.
examples:
- In digenesis, one set of young comes from mating and the next set grows without it.
- The plant shows digenesis, with birth by mating and birth without mating taking turns.
