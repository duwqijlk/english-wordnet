senseId: sulphurous%5:00:00:unpleasant:00
synsetId: 01807340-s
simpleMeaning: Harsh or biting in tone.
scope: This sense is also called bitter, acid, acrid, blistering, sulfurous, caustic, virulent, acerbic,
  and vitriolic, for being harsh or biting in tone, where bitter is very harsh and unkind in the way something
  is said or written, acid is very harsh and unkind in the way words are said or written, and acrid is
  words or a voice that cut and sting, the way acid eats into what it touches, unlike the sense for being
  of sulfur, to do with sulfur, holding sulfur, or come from sulfur, and unlike the sense for being marked
  by close heat and damp.
examples:
- The words were sulphurous, harsh in tone.
- The voice was sulphurous, biting in tone.
