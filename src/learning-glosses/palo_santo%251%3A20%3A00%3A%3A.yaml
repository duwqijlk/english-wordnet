simpleMeaning: Burned as incense, its heart wood is full of sticky sap, and it is a tree of the dry lands
  deep inside Argentina and Paraguay in South America.
scope: It is the South American tree of the dry interior whose heart wood, full of sticky sap, is burned
  as incense.
examples:
- The palo santo grows in the dry lands deep inside Argentina.
- The heart wood of the palo santo is burned as incense.
