simpleMeaning: To find out exactly where a person or thing is.
scope: This is not recognizing who or what something is and not putting an object down; it is only about
  finding its position.
examples:
- Witnesses placed him at the scene of the crime.
- Using the signal, rescuers could place the boat within a few hundred meters.
