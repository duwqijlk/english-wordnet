simpleMeaning: An estimate of how much two or more things together shape the thing being watched, which
  depends on them.
scope: An estimate of how much several things together shape one thing; not the method that works the
  value out, and not a link between two things only.
examples:
- The multiple correlation coefficient was close to one.
- They reported the multiple correlation coefficient for the model.
