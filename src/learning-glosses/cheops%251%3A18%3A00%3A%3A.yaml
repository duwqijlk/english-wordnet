simpleMeaning: A king of Egypt in the 27th century BC who had the Great Pyramid built at Giza.
scope: A king of Egypt who had the Great Pyramid built, not a king who built a temple or a tomb of a later
  age; also called Khufu.
examples:
- Cheops ordered the Great Pyramid built at Giza.
- The reign of Cheops fell in the 27th century BC.
