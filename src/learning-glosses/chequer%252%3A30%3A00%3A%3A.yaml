simpleMeaning: To give a thing a mix of colours, shades, or patterns, so it looks varied all over.
scope: Also called checker; to give a thing a mix of colours, shades, or patterns, not to mark it in squares.
examples:
- Autumn chequered the hills with gold and red.
- The artist chequered the wall with shades of blue and green.
