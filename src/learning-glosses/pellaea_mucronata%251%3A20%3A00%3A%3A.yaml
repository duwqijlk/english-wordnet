simpleMeaning: A fern of the cliffs in California and Baja California, with leaf stems of a purple-brown
  colour.
scope: Also called bird's-foot fern and Pellaea ornithopus; a fern of California cliffs, set apart from
  other cliff ferns by its purple-brown leaf stems.
examples:
- Pellaea mucronata clung to the rock face above the trail.
- The Pellaea mucronata in the canyon had dark purple-brown leaf stems.
