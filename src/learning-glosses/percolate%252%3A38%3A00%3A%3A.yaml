simpleMeaning: to spread slowly through something, or to go slowly into and through it
scope: 'Also called leach: to pass slowly through something; not to make coffee, not to force a liquid
  through something to take a part out of it, and not the thing made by that passing.'
examples:
- Water percolated through the soil after the rain.
- Rain slowly percolated down through the sand.
