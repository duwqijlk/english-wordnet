simpleMeaning: A tall plant from Europe and Asia that lives for years, with leafy stems and white flowers,
  now naturalized in many places, often put in the group called Chrysanthemum.
scope: Also called a moon daisy, an ox-eyed daisy, an oxeye daisy, or a white daisy; a tall white-flowered
  plant from Europe and Asia, not the low Canary Islands plant with pale yellow flowers.
examples:
- Marguerites grew tall along the garden wall.
- She picked a marguerite and put it in a vase.
