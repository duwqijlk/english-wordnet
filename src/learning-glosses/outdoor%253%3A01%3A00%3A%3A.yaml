simpleMeaning: describing things made for use outside a building, places outside a building, or activities
  that people do outside a building
scope: This word describes things made for use outside a building, places outside a building, and activities
  people do there, not things, places, or activities inside a building.
examples:
- They bought outdoor chairs for the garden.
- Swimming and walking are his favorite outdoor activities.
