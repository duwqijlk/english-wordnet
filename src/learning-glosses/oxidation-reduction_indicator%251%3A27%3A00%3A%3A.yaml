simpleMeaning: A substance that shows a change of colour that can go back, between a form with oxygen
  added and a form with oxygen taken away
scope: A substance that shows a colour change that can go back, between two forms of a chemical, not a
  substance that changes colour only one way and not the colour change itself.
examples:
- The oxidation-reduction indicator changed colour when the solution gained oxygen.
- We added the oxidation-reduction indicator to watch the colour go back and forth.
