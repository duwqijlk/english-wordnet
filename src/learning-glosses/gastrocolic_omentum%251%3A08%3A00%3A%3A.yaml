simpleMeaning: A fold of the thin skin that lines the belly, joined to the stomach and the large gut and
  lying over the bowels
scope: This is a fold of belly lining joined to the stomach and the large gut; caul and greater omentum
  are other names for this sense, not the stomach itself and not the gut.
examples:
- The surgeon lifted the gastrocolic omentum to reach the bowels.
- The gastrocolic omentum covers the intestines like a sheet.
