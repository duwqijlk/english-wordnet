simpleMeaning: blood tubes that run beside the blood tube that brings blood to the upper belly
scope: These are blood tubes that run beside the blood tube bringing blood to the upper belly, also called
  venae epigastricae superiores; not the blood tubes of the lower belly and not the blood tube itself.
examples:
- The superior epigastric veins run beside the artery in the upper belly.
- The surgeon found the superior epigastric veins next to the main blood tube of the upper belly.
