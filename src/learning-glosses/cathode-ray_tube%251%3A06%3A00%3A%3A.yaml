simpleMeaning: A sealed glass tube with a vacuum inside, where a heated electrode releases a stream of
  electrons that an electric field speeds up and steers onto a glowing screen.
scope: The electron-beam tube used in older televisions and computer monitors; not a flat-panel display.
examples:
- The old television's cathode-ray tube had to warm up before a picture appeared.
- Repair shops once replaced cathode-ray tubes in computer monitors.
