senseId: 'unction%1:06:00::'
synsetId: 03851070-n
simpleMeaning: A thick, half-solid substance, usually holding a medicine, rubbed on the skin to heal or
  to calm a sore spot.
scope: Also called an unguent, an ointment, a salve, or a balm; a thick substance rubbed on the skin to
  heal or soothe, not words of praise, not an anointing in a ceremony, and not smug earnestness.
examples:
- She rubbed the unction into the rash to calm the itch.
- The doctor gave them an unction for the sore skin on their hands.
