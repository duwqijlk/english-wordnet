simpleMeaning: In the armed forces, a person hired in secret by a country to learn about its enemies,
  or by a firm to learn secret facts about how rivals make things.
scope: 'Also called spy: a person hired in secret to get facts about enemies or rivals, not a soldier
  in uniform and not a police officer on open patrol.'
examples:
- The undercover agent passed the plans to his handler in secret.
- An undercover agent must never let anyone learn who he really works for.
