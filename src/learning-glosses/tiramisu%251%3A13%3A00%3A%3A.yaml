simpleMeaning: a dessert from Italy in which sponge cake soaked in coffee and brandy or a liqueur is layered
  with soft mascarpone cheese and finished with grated chocolate
scope: This is the chilled layered dessert, not a coffee drink or an ordinary baked cake.
examples:
- We shared a slice of tiramisu after dinner.
- The tiramisu was rich with coffee and mascarpone.
