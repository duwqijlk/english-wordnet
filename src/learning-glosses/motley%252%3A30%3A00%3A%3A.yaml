simpleMeaning: to make something many-coloured, giving it patches of different colours
scope: Making something many-coloured, not wearing a jester's costume and not a mixed crowd of people.
examples:
- She motleyed the cloth with bright dyes.
- The painter motleyed the wall in many colours.
