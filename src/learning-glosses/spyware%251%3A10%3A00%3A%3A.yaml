simpleMeaning: a computer program that gets information from a person's computer without the person knowing
  or agreeing to it
scope: A program that secretly gets information from a computer; not a helpful program a person chooses
  to use, and not a program made to damage the computer.
examples:
- Spyware on his computer sent his passwords to strangers.
- She ran a check and found spyware hiding on the laptop.
