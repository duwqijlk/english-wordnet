simpleMeaning: A person who buys old buildings or ships, takes them apart, and keeps the parts and stuff
  that can be used again.
scope: One who buys old buildings or ships to break them up for what can be used again, not one who buys
  old horses to kill them.
examples:
- The knacker bought the old ship and took it apart for scrap metal.
- A knacker cleared the site after buying the worn-out warehouse.
