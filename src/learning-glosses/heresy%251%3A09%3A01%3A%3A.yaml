simpleMeaning: any opinions or beliefs that go against the official position or the accepted teachings
scope: 'Also called unorthodoxy: ideas that go against an official position in any area, not only a belief
  that goes against the accepted teachings of a religion.'
examples:
- His speech was called heresy by the party leaders.
- The professor was punished for heresy after he spoke against the official view.
