simpleMeaning: About the way courts run a case and the order of the steps, not about the ideas behind
  the law.
scope: About how a court runs a case and the order of its steps, not about the ideas behind the law; also
  called adjective, and not the broad sense of to do with any procedure at all.
examples:
- The question was procedural, about how the court should run the case.
- That point is procedural, not a matter of what the law itself says.
