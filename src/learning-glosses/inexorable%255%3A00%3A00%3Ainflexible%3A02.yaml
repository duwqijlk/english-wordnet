simpleMeaning: unable to be moved by begging, words meant to change your mind, asking or reason
scope: Not to be moved by begging, talk meant to win you over, asking or reason, with adamant as another
  name for this sense, and not merely firm or the sense of refusing to be calmed or won over.
examples:
- 'Cynthia was inexorable: she would have none of him.'
- The inexorable judge would not change the sentence.
