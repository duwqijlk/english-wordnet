simpleMeaning: A peach tree of a kind that bears fruit with smooth skin and usually yellow flesh.
scope: Also called nectarine tree; a peach tree of a kind bearing smooth-skinned fruit, usually with yellow
  flesh, not the fruit itself, which is a smooth-skinned peach.
examples:
- The nectarine in the garden bore its first fruit this year.
- They planted a nectarine by the south wall for the sun.
