simpleMeaning: a member of the lower house of the United States Congress
scope: A member of the lower house of the United States Congress, not just any person who speaks for others
  and not a person who argues for someone else's plans.
examples:
- She was a representative from Ohio in the House.
- The representative spoke for his district in Congress.
