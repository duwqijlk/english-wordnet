simpleMeaning: a boy with no home, left alone by others, who walks about the streets, sometimes used as
  a rude word for such a boy
scope: 'Also called gamin: a homeless boy left alone on the streets, and sometimes a rude word; not a
  printed ad given out to many people and not a thing made to be thrown away after use.'
examples:
- The throwaway slept in a doorway after the people who should have cared for him left him and never came
  back.
- The story tells of a throwaway who lived on the streets of the city.
