simpleMeaning: Prized as food, this small fish of the northern Pacific has red flesh and swims in rivers
  and the streams that feed them; grown fish die after laying eggs.
scope: People also call it blueback salmon, red salmon, and sockeye, and it is a small Pacific salmon
  with red flesh that is prized as food.
examples:
- They caught sockeye salmon in the river.
- The sockeye salmon died after laying its eggs.
