simpleMeaning: Strips of white bark peel off this small American birch, and people often use the bark
  to make baskets, toy boats and other things.
scope: 'Also called paper birch and paperbark birch: a small American birch with peeling white bark, not
  the white birch of Europe and not a birch grown for timber alone.'
examples:
- They peeled bark from the canoe birch to make a toy canoe.
- The canoe birch stood small and white-barked by the lake.
