simpleMeaning: to think something is true, especially when the facts are not clear and the idea is not
  firm
scope: 'Also called suppose, speculate, theorize and hypothesize: to think something is true when the
  facts are weak, not the guessed idea itself.'
examples:
- Scientists conjecture that the old animal lived near water.
- I conjecture that he left early, but I have no clear proof.
