simpleMeaning: connected to something else in meaning, in cause, or by shared features.
scope: It is not about belonging to the same family; it describes things that are linked in meaning, cause,
  or features.
examples:
- The two problems are closely related, so one solution may fix both.
- The island is home to several related species of bird.
