scope: 'Also called death angel, death cap, death cup or destroying angel: a very poisonous fungus, most
  often white, with a clear cup-shaped base, set apart from the edible Agaricus only by its white gills.'
examples:
- Amanita phalloides grows under the oak, white and deadly.
- Do not eat Amanita phalloides; only its white gills set it apart from the edible mushroom.
