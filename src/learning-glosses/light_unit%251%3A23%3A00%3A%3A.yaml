simpleMeaning: A way to say how much of the rays that make things seen there is
scope: A way to say how much of the rays that make things seen there is, not a distance such rays go in
  a time and not a kind of lamp.
examples:
- The light unit tells us how much visible radiation the lamp gives out.
- Scientists use a light unit to measure the rays from the sun.
