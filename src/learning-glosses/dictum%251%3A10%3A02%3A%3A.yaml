simpleMeaning: In law, an opinion a judge gives on a question about the law that does not directly affect
  the case, so it does not have to be followed
scope: In law, a judge's opinion on a question about the law that does not decide the case and does not
  have to be followed; not the court's decision on the case itself.
examples:
- The judge's remark was only a dictum, so later courts were free to ignore it.
- Lawyers noted the dictum but knew it did not decide the case.
