simpleMeaning: a layer of boards, for example, put on a building's wood frame to protect and strengthen
  it and to give a base for an outer wall that keeps out weather
scope: This sense is a building covering, also called overlay and overlayer; it is not a cover for a knife
  or sword and not the outer wall itself.
examples:
- The builders nailed sheathing over the wood frame before adding the outer wall.
- New sheathing made the house stronger and gave the outer wall a firm base.
