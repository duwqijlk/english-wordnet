simpleMeaning: Being taken in with love and kept under care, close and guarded
scope: 'Also called embrace: taking a person in with love and care, not the breast or chest, not the cloth
  that covers it, and not hiding a thing close to the body.'
examples:
- He grew up in the bosom of a loving family.
- They took the orphan into the bosom of their family.
