simpleMeaning: a covering put on the outside of a building to keep it safe from harm
scope: A covering on the outside of a building; not the cloth strip on the edge of clothing, and not looking
  or turning toward something.
examples:
- The building's facing was made of stone to protect its walls.
- Rain had damaged the facing on the outside of the old house.
