simpleMeaning: the state of being joined or linked to something else
scope: 'Also called connection: the state of being joined or linked, not a relation where one thing causes
  another or is like another.'
examples:
- The connectedness of the phone to the network lets it work online.
- Good connectedness between the parts keeps the whole system working.
