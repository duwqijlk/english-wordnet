simpleMeaning: In fencing, a quick attack made by stepping forward with one foot, keeping the back leg
  straight and stretching the sword arm out in front.
scope: A fencing attack with one foot forward and the sword arm stretched out, not a sudden move forward
  in any fight and not a jump.
examples:
- His lunge caught his opponent off guard.
- She made a neat lunge and scored a point.
