simpleMeaning: describing an alcoholic drink that contains very little sugar because most of it has turned
  into alcohol during fermentation
scope: This describes an alcoholic drink that is not sweet, not a place or law that bans alcohol, and
  not something lacking water or moisture.
examples:
- She ordered a dry white wine with her fish.
- This sherry is too dry for my taste.
