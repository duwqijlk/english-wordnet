simpleMeaning: good to look at on the surface and in a smart style, and giving the idea of wealth or high
  cost
scope: Also called glossy, this is good to look at on the surface and costly in style, not clothes made
  for bright display and not a grand display that lacks taste.
examples:
- They bought a showy car with bright paint and costly details.
- The hotel has a showy front room full of gold and glass.
