senseId: 'democratise%2:41:00::'
synsetId: 02539573-v
simpleMeaning: for a country to start letting its people choose its government, or to let them choose
  it more fully
scope: For a country to start letting its people choose its government, also called democratize; not a
  change of one ruler for another, and not the bringing in of reforms.
examples:
- The country began to democratise after the fall of the old regime.
- Many states democratised in the last century.
