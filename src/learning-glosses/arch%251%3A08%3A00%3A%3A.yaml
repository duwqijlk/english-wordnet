simpleMeaning: a curved part made of bone that holds up or goes around parts inside the body, especially
  the curved inside part of a foot
scope: This is a curved part of the body, especially in the foot. It is not the stone or brick part built
  over an opening in a building.
examples:
- The arch of her foot hurt after the long run.
- Good shoes hold up the arch inside your foot.
