simpleMeaning: a substance a gland makes and sends through the blood to the part of the body it acts on
scope: A substance carried in the blood to the part of the body it acts on, not a nerve signal and not
  a drug you swallow.
examples:
- The hormone travels in the blood to the part of the body it acts on.
- Hormones control how fast we grow.
