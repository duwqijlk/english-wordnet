simpleMeaning: having so much work and so many hard things to do that it feels heavy
scope: Carrying a heavy load of work, troubles, or duties; not carrying a heavy physical weight.
examples:
- She felt burdened by the load of paperwork.
- He was burdened with the care of his family.
