senseId: 'brevet%1:10:00::'
synsetId: 06482740-n
simpleMeaning: A paper that lets a commissioned officer hold a higher rank for a short time, but without
  the higher pay that goes with that rank.
scope: A paper letting an officer hold a higher rank for a short time without higher pay; not a lasting
  promotion and not the officer's first commission.
examples:
- He received a brevet to the rank of major during the campaign.
- The brevet gave her the rank but not the pay of a colonel.
