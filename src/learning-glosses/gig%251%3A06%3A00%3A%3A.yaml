simpleMeaning: a small carriage pulled by a horse, running on two wheels, with two seats and no cover
  over the top
scope: A small two-wheeled carriage with two seats and no hood, not the fishing hook or the fishing spear
  of the same name.
examples:
- They rode to the village in a gig.
- The gig had room for two, with no hood against the rain.
