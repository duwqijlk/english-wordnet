simpleMeaning: a wheel with a groove that a rope runs through, used to change the direction of a pulling
  force
scope: This is a pulley-like wheel for a rope, not the metal casing of an engine, and not the act of getting
  in someone's way.
examples:
- The sailors pulled the rope through the block to raise the sail.
- A single block changes the direction of the pull but not the effort needed.
