simpleMeaning: To pass grain through a coarse sieve so the chaff is left behind.
scope: This is the act of sifting grain, not the strainer tool itself and not the act of stopping something
  from getting in.
examples:
- The farmers screened the wheat to remove the chaff.
- After harvest, they screened the seed before storing it in sacks.
