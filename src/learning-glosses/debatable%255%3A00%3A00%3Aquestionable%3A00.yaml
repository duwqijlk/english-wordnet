senseId: debatable%5:00:00:questionable:00
synsetId: 01923165-s
simpleMeaning: not known for sure, so people can question it or argue about it
scope: This describes a point people can doubt and question as not sure to be true, not a point that is
  only argued about by different sides.
examples:
- Whether the plan will work is debatable.
- It is debatable if this old story is true.
