simpleMeaning: A small part on clothing that joins two sides when you press them together; it closes with
  a short, sharp sound
scope: This is a small part on clothing that you press shut, not a bean, not a round ginger cookie, and
  not the act or sound of moving a finger across the thumb.
examples:
- The baby's shirt has snaps instead of buttons.
- She closed the snap on her jacket with a quick press.
