simpleMeaning: Sold as Celebrex, this drug eases pain and sore swelling without harming the gut by blocking
  Cox-2, a body chemical.
scope: This is a drug that blocks Cox-2 and eases pain and sore swelling without harming the gut, not
  a plain pain drug that can upset the gut.
examples:
- Celecoxib eased the pain and sore swelling without harming the gut.
- He took celecoxib to ease the pain and sore swelling.
