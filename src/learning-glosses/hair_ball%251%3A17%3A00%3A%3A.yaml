simpleMeaning: A tight lump of swallowed fur that builds up in the gut, above all in the stomach of an
  animal that licks its coat.
scope: This is a tight lump of swallowed fur in an animal's gut, not a lump of food; also called hairball
  and trichobezoar.
examples:
- The cat coughed up a hair ball.
- The vet found a hair ball in the cat's stomach.
