simpleMeaning: used after a number to mean a little more than that number, without an exact figure
scope: The approximate-count use after a number, not the strange sense, the not-divisible-by-two sense,
  or the one-of-a-pair sense.
examples:
- Thirty-odd people came to the talk.
- He owns forty-odd books on birds.
