simpleMeaning: Showing warm pleasure and kind feeling because someone has done well or had good luck
scope: This word for warm pleasure at another's good luck is also called congratulatory, and is not praise
  for one's own success and not mere politeness.
examples:
- She sent a gratulatory note when her friend won the prize.
- His gratulatory words made the young singer smile.
