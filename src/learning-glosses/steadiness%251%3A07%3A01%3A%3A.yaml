senseId: 'steadiness%1:07:01::'
synsetId: 04777307-n
simpleMeaning: the quality of going on in a regular way and not changing
scope: This is about going on in a regular way and not changing, not about a thing fixed firmly in place
  and not about a person who never changes their mind.
examples:
- The steadiness of the rain made it easy to plan the day.
- Pilots praised the steadiness of the plane's speed in the wind.
