simpleMeaning: The electric current grows in step with the voltage and falls as the resistance grows;
  I = E/R.
scope: It is the rule that links current, voltage and resistance, and it tells how the current changes
  when either of the other two changes.
examples:
- Ohm's law tells us the current will double if the voltage doubles.
- We used Ohm's law to work out the resistance of the wire.
