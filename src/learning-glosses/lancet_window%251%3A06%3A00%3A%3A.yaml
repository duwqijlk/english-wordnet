simpleMeaning: A tall pointed top and no stonework pattern mark this narrow opening in a wall
scope: A narrow wall opening with a tall pointed top and no stonework in it, not a wide opening and not
  one with a round top.
examples:
- Light came in through the lancet window above the door.
- The old church has a tall lancet window on each side.
