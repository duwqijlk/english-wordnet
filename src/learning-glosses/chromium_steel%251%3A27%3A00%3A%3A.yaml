simpleMeaning: a hard metal that holds a second metal in it so that it does not rust easily
scope: A hard metal that holds a second metal in it so that it does not rust easily; stainless is another
  name for this sense, and it is not plain iron that rusts or a metal made hard by heat alone.
examples:
- The sink was made of chromium steel so it would not rust.
- Chromium steel kept the tools bright even after years of use.
