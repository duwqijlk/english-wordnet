simpleMeaning: A drug that brings sleep, made by mixing the poppy drug with alcohol, or any mix in which
  the poppy drug is the main part.
scope: Also called laudanum, it is either the poppy drug mixed with alcohol or any mix in which the poppy
  drug is the main part.
examples:
- A dose of tincture of opium helped them sleep.
- They measured out the tincture of opium before taking it.
