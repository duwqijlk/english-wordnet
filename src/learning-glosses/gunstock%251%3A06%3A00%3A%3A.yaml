simpleMeaning: The part of a hand weapon that you hold, the end of a long weapon that rests on your shoulder,
  or a support part on a larger weapon.
scope: The part of a hand weapon that you hold, the end of a long weapon that rests on your shoulder,
  or a support part on a larger weapon; stock is another name for it, not the piece of hard stone that
  makes a spark in an old weapon and not the topmost boards along the side of a boat.
examples:
- He held the rifle by its gunstock.
- The gunstock of the shotgun rested against his shoulder.
