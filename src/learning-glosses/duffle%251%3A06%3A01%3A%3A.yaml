simpleMeaning: made to carry what a person owns, a big, long, round piece of thick cloth sewn into a bag
scope: 'Also called duffel, duffel bag and duffle bag: made to carry what a person owns, a big, long,
  round piece of thick cloth sewn into a bag, not a stiff case and not a small handbag.'
examples:
- She packed a duffle with clothes for the weekend.
- His duffle lay open on the bed, half full of gear.
