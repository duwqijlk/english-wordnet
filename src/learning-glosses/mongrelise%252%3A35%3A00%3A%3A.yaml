simpleMeaning: To cause a living thing to become one of mixed breed
scope: To cause a living thing to become one of mixed breed; mongrelize is another name for this sense,
  and not to breed animals of one kind.
examples:
- Crossing the two breeds would mongrelise the dogs.
- Breeders warned that the plan might mongrelise the line.
