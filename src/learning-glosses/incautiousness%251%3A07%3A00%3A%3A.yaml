simpleMeaning: To act without thought for danger, forgetting it or paying it no heed, is this trait
scope: Acting without thought for danger that may lie ahead, with incaution as another name for this sense,
  not courage and not a lack of knowledge about the danger.
examples:
- His incautiousness on the icy steps led to a bad fall.
- Her incautiousness with the hot stove burned her hand.
