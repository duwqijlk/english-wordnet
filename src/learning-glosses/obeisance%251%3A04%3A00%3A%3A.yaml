senseId: 'obeisance%1:04:00::'
synsetId: 01169636-n
simpleMeaning: doing what you are told, and acting toward another person in a way that shows you will
  do your duty and give way to them
scope: 'Also called obedience: doing what you are told and giving way to another person, not bending your
  head, body or knee as a sign of respect.'
examples:
- The servants showed obeisance to the king in all they did.
- He paid obeisance to his master and did all he was told.
