simpleMeaning: In a way that shows bitter feeling at being treated badly or passed over
scope: In a way that shows bitter feeling at unfair treatment; not with open anger, and not with quiet
  sadness alone.
examples:
- The best doctors stayed resentfully out of the national service.
- She watched resentfully as her brother took the prize.
