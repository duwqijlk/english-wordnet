synsetId: 03422112-n
simpleMeaning: the long beam along the bottom of a wooden ship has a thick band of wood laid right next
  to it, and this is the first such band
scope: Also called garboard and garboard plank, this is the first band of wood next to a ship's keel,
  not a band higher up the side of the ship and not the keel itself.
examples:
- The carpenter fastened the garboard strake to the keel with wooden pegs.
- A crack had opened in the garboard strake just above the keel.
