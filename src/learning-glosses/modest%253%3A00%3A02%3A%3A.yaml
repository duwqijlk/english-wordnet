simpleMeaning: plain and simple, and not thinking of yourself as better than other people
scope: This is plain and simple, with a low view of yourself; not the sense about clothes that do not
  show the body, and not just a shy, gentle manner.
examples:
- She lives in a modest apartment and never talks about her success.
- He is a modest man who does great work but claims little credit.
