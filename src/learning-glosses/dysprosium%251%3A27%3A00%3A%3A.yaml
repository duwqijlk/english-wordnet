simpleMeaning: A metal element that can form three chemical bonds, one of the rare earth metals, whose
  compounds are strongly drawn to magnets.
scope: Also called Dy and atomic number 66; a metal element of the rare earth group whose compounds are
  strongly drawn to magnets, not iron or other common magnetic metals.
examples:
- Dysprosium is used in magnets that must stay strong.
- The lab ordered a small amount of dysprosium for the new magnet.
