simpleMeaning: To cause a person to be admitted to an institution; used of people sent to a hospital,
  prison, or similar place.
scope: 'This is an old legal and administrative use: someone is charged to an institution, meaning put
  into it. It is not the sense of accusing someone of a crime, asking for payment, or loading a device.
  Dated; modern English says ''commit someone to'' or ''admit someone to'' an institution.'
examples:
- The parish charged the orphan to the workhouse.
- After the second episode she was charged to the asylum.
