simpleMeaning: Much of a doctor's work can be done by this person on the official list, trained to look
  after sick people, after special training
scope: This person on the official list, trained to look after sick people, can do much of a doctor's
  work after special training, and nurse practitioner is another name for this sense; not a doctor and
  not a helper with little training.
examples:
- The nurse clinician examined the patient and planned her care.
- Patients saw the nurse clinician instead of waiting for the doctor.
