senseId: 'ascertain%2:32:00::'
synsetId: 00922307-v
simpleMeaning: to find out something and be sure about it, usually by asking questions or by making some
  other effort
scope: 'Also called see, watch, learn, check and determine: to find out and be sure, usually by asking
  or trying; not the sense where a fact is worked out by numbers, tests or study.'
examples:
- She called the station to ascertain whether the train leaves on time.
- We need to ascertain if he speaks French before the trip.
