simpleMeaning: A box where new coins from the place that makes coins are kept until they are tested to
  check the metal in them
scope: A box for new mint coins waiting to be tested; pix, pix chest and pyx chest are other names for
  this sense. Not a church box for holy bread and not an ordinary money box.
examples:
- The pyx held the new coins until the assay was done.
- Each morning the clerk locked the fresh coins in the pyx.
