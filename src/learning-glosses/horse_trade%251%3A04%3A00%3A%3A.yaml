simpleMeaning: Two sides give and take animals in a swap, with much hard talk over the price
scope: The swapping of animals with much bargaining, also called horse trading; not the wider sense of
  hard bargaining over any deal and not buying animals at a set price.
examples:
- The two farmers made a horse trade at the market after hours of talk.
- A horse trade was settled only after both sides had argued over every detail.
