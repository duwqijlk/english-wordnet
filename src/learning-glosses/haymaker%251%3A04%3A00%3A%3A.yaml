simpleMeaning: a very hard hit with the hand that leaves the other boxer unable to go on fighting
scope: 'Also called a knockout punch: a hard hit in a boxing fight, not a farm machine used for hay.'
examples:
- He won the fight with one strong haymaker in the last round.
- The boxer fell after a haymaker hit his chin.
