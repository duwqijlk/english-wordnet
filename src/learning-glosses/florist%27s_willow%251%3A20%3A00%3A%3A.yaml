simpleMeaning: A tree of the Old World with many branches, large soft flower clusters, and quite large
  wide leaves.
scope: A tree of the Old World with many branches and quite large wide leaves, also called a goat willow;
  not a tree with few branches and not a tree with small narrow leaves.
examples:
- The florist's willow was in flower in early spring.
- Florist's willow grows well in a damp garden.
