simpleMeaning: a frame shaped like a person's shoulders that holds a garment up by its top
scope: A shoulder-shaped frame for hanging a garment; coat hanger and dress hanger are other names for
  this, not a wall hook and not a rail for many garments.
examples:
- Hang your jacket on a clothes hanger in the closet.
- She took the shirt off the clothes hanger.
