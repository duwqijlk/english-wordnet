simpleMeaning: care for another person that asks for nothing in return, with no wish for sex, most often
  of a holy kind
scope: Also called agape, this is care for another person that asks for nothing in return, with no wish
  for sex, not love between husband and wife and not love that wants something back.
examples:
- Her agape love for the poor asked for nothing in return.
- His agape love showed in the way he cared for strangers without wanting praise.
