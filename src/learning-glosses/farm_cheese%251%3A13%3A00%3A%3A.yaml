simpleMeaning: A mild white food made from milk with most of the fat taken out, after the milk has gone
  sour and formed lumps.
scope: A mild white food made from milk with most of the fat taken out, after the milk has gone sour and
  formed lumps, also called cottage cheese and farmer's cheese; not a hard aged food of this kind and
  not butter.
examples:
- She spread farm cheese on her bread.
- The farm cheese was mild and white.
