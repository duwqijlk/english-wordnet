simpleMeaning: the act of cooling or freezing things, such as food, to keep them from going bad
scope: Cooling or freezing things to keep them fresh; not cooling a person's body as a treatment.
examples:
- Refrigeration keeps milk fresh for days.
- Without refrigeration, the meat would spoil quickly.
