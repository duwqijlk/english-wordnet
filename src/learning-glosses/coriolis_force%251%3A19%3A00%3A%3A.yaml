simpleMeaning: In physics, a push from earth's turning on moving things in turning frames; Newton's second
  law works if this push and a centre-fleeing push are added to the real pushes.
scope: A push that comes from the turning of the earth, acting on moving things; not a real push like
  gravity and not a push from wind.
examples:
- The Coriolis force bends the path of winds.
- Artillerymen must allow for the Coriolis force.
