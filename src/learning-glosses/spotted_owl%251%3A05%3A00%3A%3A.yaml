simpleMeaning: a big night bird of the forests of North America, from British Columbia to central Mexico,
  with dark brown feathers and a chest thickly marked with spots
scope: A large owl of North American forests, not a small owl of open fields and not the barn owl of farm
  buildings.
examples:
- We saw a spotted owl in the pine forest at dusk.
- The spotted owl's chest was thickly marked with dark spots.
