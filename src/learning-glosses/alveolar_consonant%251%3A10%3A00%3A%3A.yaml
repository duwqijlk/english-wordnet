simpleMeaning: This speech sound comes when the tip of the tongue is held close to the ridge behind the
  front teeth.
scope: The name alveolar means the same speech sound.
examples:
- The first sound in 'dog' is an alveolar consonant, made with the tongue tip near the gum ridge.
- To make an alveolar consonant, hold the tongue tip close to the ridge behind the front teeth.
