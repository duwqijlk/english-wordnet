simpleMeaning: A deer found all over North America, with white on the underside of its tail.
scope: Also called whitetail, white-tailed deer, white tail, whitetail deer and Virginia deer; a common
  deer of North America with a white-tailed mark, while the mule deer of the western mountains is a different
  kind.
examples:
- The Odocoileus virginianus lifted its tail, showing the white underside, and ran.
- Odocoileus virginianus grazed at the edge of the wood at dusk.
