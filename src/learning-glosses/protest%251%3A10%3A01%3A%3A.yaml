simpleMeaning: the act of showing in public, in a strong way, that you do not agree with something and
  think it is wrong
scope: A strong public show that you do not agree with something and think it is wrong; not a planned
  group act that shows people do not agree, not a formal statement of objection on its own, and not the
  verb sense of saying words against something.
examples:
- A loud protest was heard from the back of the hall when the result was read out.
- Their protest against closing the school was heard across the town.
