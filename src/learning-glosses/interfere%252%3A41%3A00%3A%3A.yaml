senseId: 'interfere%2:41:00::'
synsetId: 02544431-v
simpleMeaning: to get involved in something in a way that changes it or makes it harder to go on, or by
  using force or the threat of force
scope: 'Intervene is another name for this sense: getting involved in a way that changes something or
  makes it harder to go on, by force or by the threat of force; not the science sense of waves meeting,
  and not the sense of getting in the way of something working well.'
examples:
- The army interfered in the country's politics and changed the result of the election.
- He interfered by threatening the workers until they stopped the strike.
