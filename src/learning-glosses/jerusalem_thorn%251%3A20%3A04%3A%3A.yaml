simpleMeaning: A spiny tree from East India with leaves split twice into small leaflets, yellow flowers
  followed by flat pods, the source of black catechu
scope: A spiny East Indian tree with leaves split twice, yellow flowers and flat pods; catechu and Acacia
  catechu are other names for this sense; not the Eurasian shrub with dry woody winged fruit, and not
  the tree with dark red fruit.
examples:
- The Jerusalem thorn in the garden has yellow flowers and flat pods.
- Black catechu comes from the Jerusalem thorn.
