simpleMeaning: A tall herb of east North America and Asia, with blue berry-like fruit and a thick knotty
  root stock once used as a cure.
scope: This sense is also called blue cohosh, blueberry root, papoose root, papooseroot, and squawroot.
examples:
- A squaw root grew in the east.
- Squaw roots bore blue fruit.
