simpleMeaning: From the colour a substance makes with certain chemicals, this tool works out how much
  of the substance is in a sample.
scope: Also called a colorimeter, this is the tool used in colorimetric analysis to work out how much
  of a substance is in a sample.
examples:
- The tintometer showed how much iron the water held.
- She used a tintometer to work out how much dye was in the mix.
