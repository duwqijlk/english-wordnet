simpleMeaning: A Mediterranean evergreen shrub that grows like a tree, with fragrant white flowers in
  large clusters at the branch tips and hard roots used to make tobacco pipes.
scope: The Mediterranean shrub whose hard roots make tobacco pipes, also called brier and tree heath;
  not a briar pipe or the wild rose also called briar.
examples:
- Briar grows as a tall evergreen shrub around the Mediterranean.
- Pipe makers prize the hard roots of briar.
