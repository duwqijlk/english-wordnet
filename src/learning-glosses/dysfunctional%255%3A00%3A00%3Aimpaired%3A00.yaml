simpleMeaning: not working as it should, especially of a system or part in the body
scope: A body system or part that does not work as it should. Not the sense about a trait or condition
  that fails to serve a helpful purpose.
examples:
- A dysfunctional kidney cannot clean the blood well.
- He was treated for a dysfunctional heart valve.
