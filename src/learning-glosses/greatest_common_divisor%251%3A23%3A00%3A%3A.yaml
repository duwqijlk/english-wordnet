simpleMeaning: For a set of whole numbers, the biggest whole number that goes into each of them with nothing
  left over
scope: For a set of whole numbers, this is the biggest whole number that goes into each of them with nothing
  left over, also called greatest common factor and highest common factor, not the smallest shared number
  and not a number that only goes into one of them.
examples:
- The greatest common divisor of 12 and 18 is 6.
- We worked out the greatest common divisor of 24 and 36.
