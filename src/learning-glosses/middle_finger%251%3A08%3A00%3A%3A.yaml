simpleMeaning: The second of the four parts of the hand that bend and grip, between the pointing one and
  the ring one
scope: The one in the centre of the hand, not the thumb and not the smallest one.
examples:
- He hurt his middle finger when the door closed on it.
- She wore a bandage on her middle finger all week.
