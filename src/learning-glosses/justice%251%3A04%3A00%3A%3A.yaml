simpleMeaning: The fair handling of people's rights, including giving each person the rewards or punishments
  they deserve.
scope: This is about fair decisions and treatment, not the judge who makes them.
examples:
- The victims' families are still waiting for justice.
- She believed in justice and spoke up for the workers.
