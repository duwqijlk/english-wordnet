simpleMeaning: Before birth, a young one can gain features or body parts that older kinds never had, such
  as the afterbirth in mammals.
scope: Caenogenesis, cainogenesis, cenogenesis, and kainogenesis are other names for this, where a young
  one gains features or body parts before birth that older kinds never had.
examples:
- The placenta first appeared in the young of mammals through kenogenesis.
- New traits reached the young before birth through kenogenesis.
