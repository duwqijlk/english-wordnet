simpleMeaning: a small pointed ridge on the hard outer shell of an animal with jointed legs
scope: This is a small pointed ridge on the hard outer shell of an animal with jointed legs, not a tooth
  and not a small bump on a plant.
examples:
- The denticle on the crab's leg caught the light.
- Each denticle along the insect's shell is sharp and pointed.
