simpleMeaning: An orchid of the northeast and high mountains of eastern North America, closely related
  to the purple fringed orchids but with rosy-purple or violet flowers and finely toothed leaf divisions.
scope: An orchid with purple flowers, also called purple fringeless orchid and purple fringeless orchis,
  not a purple fringed orchid, of the northeast and high mountains of eastern North America.
examples:
- Habenaria peramoena grows in the mountain meadows.
- The violet flowers of Habenaria peramoena stood out among the grasses.
