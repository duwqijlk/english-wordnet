simpleMeaning: clear, and not made hard to see through by small solid bits that sink in a liquid
scope: This sense is about a liquid that stays clear, not about a clear sky or a clear mind with no doubts.
examples:
- The wine stayed unclouded in the glass, with nothing settled at the bottom.
- The cook used only the unclouded stock from the top of the pot.
