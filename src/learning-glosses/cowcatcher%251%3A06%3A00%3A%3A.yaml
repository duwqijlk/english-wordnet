simpleMeaning: A sloping metal frame at a train's front, to clear the track.
scope: This sense is also called a pilot, a fender, and a buffer, for a sloping metal frame at a train's
  front, to clear the track, where a pilot is a metal frame set sloping at a train's front, shoving things
  off the track.
examples:
- The cowcatcher cleared the track.
- Cowcatchers push things off the track.
