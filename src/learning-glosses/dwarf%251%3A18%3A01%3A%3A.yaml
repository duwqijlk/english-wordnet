simpleMeaning: a creature in old stories that looks like a very small old man, lives deep under the earth
  and guards valuable things buried there
scope: This is a creature from old stories that looks like a small old man. Not a real person who is very
  small, and not the act of making something look small.
examples:
- In the story, a dwarf guarded the gold under the mountain.
- The dwarf lived in a dark hole deep in the earth.
