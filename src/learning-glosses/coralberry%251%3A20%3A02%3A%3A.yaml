simpleMeaning: Grown for its many clusters of bright pinkish-red small round fruits, this North American
  shrub loses its leaves in winter
scope: A North American shrub that loses its leaves in winter, grown for its many clusters of pinkish-red
  round fruits, not the shrub with pinkish-red fruits that grows from Japan to northern India.
examples:
- The coralberry in the garden was covered in pinkish-red fruits.
- Coralberry loses its leaves in winter but keeps its bright fruits.
