simpleMeaning: An English group of honour, set up in 1660 and given a king's charter by Charles II in
  1662, through which the British government has backed science.
scope: An honorary English society set up in 1660, through which the British government has backed science,
  not a university or a government office, also called Royal Society.
examples:
- The Royal Society of London for Improving Natural Knowledge was set up in 1660.
- Charles II gave a charter to the Royal Society of London for Improving Natural Knowledge in 1662.
