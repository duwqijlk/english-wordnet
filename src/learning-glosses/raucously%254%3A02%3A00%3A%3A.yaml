simpleMeaning: with a loud, rough sound
scope: 'This word says how a sound is made: in a loud, rough way. It is not about being quiet or soft,
  and it does not name a person or a group by itself.'
examples:
- His voice rang raucously across the hall.
- The men laughed raucously at the joke.
