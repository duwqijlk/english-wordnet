simpleMeaning: From the cool lands of the north, one of two soft-stemmed plants like rushes that grow
  in wet marshy ground, with small yellow flowers and grasslike leaves.
scope: This plant of wet marshy ground is one of two soft-stemmed plants like rushes, with small yellow
  flowers and grasslike leaves, not a plant of dry ground.
examples:
- Bog asphodel grows in the wet marshy ground of the north.
- We found bog asphodel with small yellow flowers in the wet ground.
