simpleMeaning: open land, usually with soil of dead plants, covered with heather (a low plant with small
  purple flowers), bracken (a tall fern) and moss
scope: Also called moor; this is open land with heather, bracken and moss, not a forest and not a garden.
examples:
- We walked for hours across open moorland with no trees in sight.
- The moorland was covered with purple heather and green moss.
