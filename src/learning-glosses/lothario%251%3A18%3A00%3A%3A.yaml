simpleMeaning: A man who wins women easily and acts selfishly in his love affairs with them
scope: This is about a man who charms women one after another and puts his own wants first with them,
  not a true lover who stays with one woman.
examples:
- He was a Lothario who left a trail of broken hearts.
- The play's Lothario charmed every woman he met.
