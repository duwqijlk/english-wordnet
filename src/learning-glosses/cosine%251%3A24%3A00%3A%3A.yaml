simpleMeaning: The number got by dividing the length of the side next to an angle in a right-angled triangle
  by the length of the side opposite the right angle.
scope: In maths, a number got by dividing two sides of a right-angled triangle, also called cos.
examples:
- The cosine of 60 degrees is one half.
- She used the cosine to work out the length of the side.
