simpleMeaning: A number got by dividing a circuit's power to resist a change in current (inductance, in
  henries) by its power to resist current flow (resistance, in ohms)
scope: A number that tells how a circuit acts, not the time a current or voltage takes to rise or fall
  in a circuit.
examples:
- The time constant of the circuit was worked out from its inductance and resistance.
- A short time constant means the circuit acts fast.
