simpleMeaning: a sweet food eaten as a special treat, such as fruit kept in sugar or a sweet baked food
scope: A sweet treat such as a preserve or a pastry; it is not meat at all, despite the name, and not
  a main meal.
examples:
- The children were given sweetmeats after dinner.
- She put a plate of sweetmeats on the table for her guests.
