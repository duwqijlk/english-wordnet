simpleMeaning: the hot parts on top of a cooker where pots and pans sit while food cooks
scope: The heated parts on a cooker, not the whole cooker and not a device for burning fuel.
examples:
- She put the pan on the front burner.
- Turn the burner down or the milk will boil over.
