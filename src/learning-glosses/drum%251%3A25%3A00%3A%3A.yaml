simpleMeaning: A round shape that swells out in the middle, empty inside, with flat ends
scope: Also called barrel, this is a round shape that swells out in the middle, not a music tool, not
  a metal can for liquid, and not a brake part.
examples:
- The tower had a drum shape, wide in the middle with flat ends.
- He drew a drum, a hollow round shape with flat ends.
