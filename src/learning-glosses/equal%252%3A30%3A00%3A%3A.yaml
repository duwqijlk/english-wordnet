simpleMeaning: to make things the same as each other, or to make them match each other well
scope: Also called match. This is making things the same or making them fit each other, not being as good
  as something, and not a person with the same rank.
examples:
- The manager equaled the pay for both jobs so that neither paid more.
- She equaled the two piles by moving three stones from the larger one.
