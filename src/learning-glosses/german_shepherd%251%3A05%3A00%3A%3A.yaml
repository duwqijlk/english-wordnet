simpleMeaning: This large animal works with people who look after sheep; people who enforce the law use
  it, and it leads people who cannot see.
scope: Also called alsatian, German police dog, and German shepherd dog; a large kind of animal that works
  for people, not a small house pet and not a wild animal.
examples:
- Our German shepherd helps the officers at the station every day.
- The German shepherd led her owner safely across the busy street.
