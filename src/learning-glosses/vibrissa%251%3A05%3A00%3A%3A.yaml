simpleMeaning: A long stiff hair that grows on the snout or brow of most mammals, such as a cat.
scope: A long stiff hair on the snout or brow of a mammal; whisker and sensory hair are other names for
  this sense; not soft fur and not an eyelash.
examples:
- The cat's vibrissa twitched as it sniffed the air.
- Each vibrissa grows from the cat's snout.
