simpleMeaning: any bush or tree of one kind, loved for living a long time and for its very sweet-smelling,
  beautiful flowers
scope: This is the living bush or tree itself, not the dried bark from it that some people use as a home
  cure.
examples:
- A magnolia in the garden has large, sweet-smelling white flowers.
- They planted a magnolia because it can live for many years.
