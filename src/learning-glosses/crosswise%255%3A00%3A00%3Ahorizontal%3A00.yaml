simpleMeaning: in the shape of the flat bar of a cross, lying across from side to side
scope: This is the shape of the flat bar of a cross, lying flat across from side to side; not going across
  the length of another thing.
examples:
- The crosswise bar of the sign lay flat across the upright post.
- She set the crosswise piece flat, with its long side running from left to right.
