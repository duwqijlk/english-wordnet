simpleMeaning: Something built, such as a structure put together from many separate parts.
scope: This is a completed built thing or structure, not the paid building industry that erects and repairs
  structures (that is the other building-related sense), not the general act of putting something together,
  not a group of words forming a unit of a sentence, not the mental combining of ideas into a coherent
  object, not a geometric figure drawn for a proof, and not an interpretation of a text or action.
examples:
- The bridge is an impressive construction of steel and concrete.
- She wore her hair in a strange construction of ribbons and pins.
