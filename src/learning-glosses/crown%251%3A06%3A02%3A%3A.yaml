simpleMeaning: a ring of leaves or flowers worn on the head to show that a person has won
scope: This is a ring of leaves or flowers for a winner. It is not the rich band with jewels a king or
  queen wears, and not a cover for a tooth.
examples:
- The winner wore a crown of green leaves on his head.
- In the old picture, the runner has a crown made of flowers.
