simpleMeaning: A step that runs how facts are written down, worked on, sent, or made sense of.
scope: Also called control function; a step that runs how facts are written down, worked on, sent, or
  made sense of, not the facts themselves and not the machine that holds them.
examples:
- A control operation started the data processing.
- The control operation stopped the recording.
