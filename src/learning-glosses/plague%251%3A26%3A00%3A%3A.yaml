simpleMeaning: A severe infection of rodents, caused by the bacterium Yersinia pestis, that is sometimes
  deadly and reaches people by accident when an infected animal's flea bites them.
scope: This is the flea-borne rodent disease, with pest, pestilence and pestis as other names for it;
  it is not the word's looser sense of a nuisance or a swarm.
examples:
- Health workers checked the rodents for plague after several animals died.
- A flea bite can carry plague from an infected animal to a person.
