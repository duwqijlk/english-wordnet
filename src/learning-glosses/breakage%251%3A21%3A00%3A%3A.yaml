simpleMeaning: money paid back for goods that are damaged while they are being carried or while they are
  in use
scope: Money paid back when goods are damaged, not the act of breaking something itself.
examples:
- The shop paid breakage for the cups that were damaged on the truck.
- They claimed breakage after the chairs were damaged in use.
