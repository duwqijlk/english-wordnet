senseId: 'par%1:26:00::'
synsetId: 13969940-n
simpleMeaning: a state in which two things are equal in the main ways, in level or value, with neither
  one above the other
scope: The state of being equal in level or value, also called equation and equality; not the set number
  of times a player may hit the ball for a hole in golf.
examples:
- Her skill as a cook is on a par with his.
- Pay for women in this job is now on a par with pay for men.
