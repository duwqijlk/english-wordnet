simpleMeaning: A plant with upright leafy stems bearing clusters of yellow flower heads without outer
  rays on bent single stalks; found in moist parts of the southwestern United States.
scope: Also called nodding groundsel; not a daisy with white rays and not a plant of dry lands.
examples:
- The Senecio bigelovii nodded its yellow heads in the damp meadow.
- We found Senecio bigelovii in the moist southwest.
