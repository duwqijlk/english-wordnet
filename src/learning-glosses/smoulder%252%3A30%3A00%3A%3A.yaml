simpleMeaning: to go on burning in a slow way and make no flame
scope: 'Also called smolder: to burn slowly with no flame, not a fire that gives thick smoke.'
examples:
- The wood smouldered all night and gave off a thin line of smoke.
- Dry leaves can smoulder for days without a flame.
