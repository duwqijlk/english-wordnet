scope: A drug that stops blood from clotting and has mostly been replaced by warfarin, also called dicoumarol,
  and not a drug that helps blood clot or a painkiller.
examples:
- Doctors once gave dicumarol to stop blood clots.
- The patient took dicumarol after a clot was found.
