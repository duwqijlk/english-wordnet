simpleMeaning: An early election in which a political party chooses its candidates for a later election.
scope: This is not a general election between parties and not a wing feather; it is the earlier vote in
  which a party picks its candidates.
examples:
- She won the primary in her home state by a wide margin.
- Voters will choose the party's candidate in next month's primary.
