simpleMeaning: In time the sheet of gristle between this end of a long bone and the main bone turns to
  bone, so the two join into one
scope: It is the end of a long bone, not the small gland in the brain of the same name.
examples:
- The epiphysis at the end of the bone had not yet joined the main bone.
- In time the epiphysis becomes one with the main bone.
