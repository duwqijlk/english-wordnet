simpleMeaning: A nearly leafless wildflower with upright reddish-purple stems and spikes of pale pink
  flowers marked with brown, native from western Canada to Mexico.
scope: A woodland orchid with reddish-purple stems and brown-marked pink flowers, also called striped
  coralroot; not the spotted coralroot, which has spotted flowers instead.
examples:
- Striped coral root grew in the shady pine woods.
- We found striped coral root blooming along the trail in July.
