senseId: 'stratum%1:15:00::'
synsetId: 08674880-n
simpleMeaning: One of several layers of stuff lying one on top of another, such as tissue or cells in
  a living thing or rock laid down over time.
scope: One layer in a stack of layers, not a group picked for a sample and not an abstract place thought
  of as having depth.
examples:
- The dig cut through each stratum of rock in turn.
- A thin stratum of tissue covers the inner wall.
