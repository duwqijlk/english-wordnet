simpleMeaning: a living thing that makes its own food from simple organic stuff
scope: 'Also called autophyte, autotroph and autotrophic organism: a living thing that makes its own food,
  not one that feeds off other living things.'
examples:
- The autophytic plant made its own food in the sun.
- An autophytic plant needs light, water and air to make its food.
