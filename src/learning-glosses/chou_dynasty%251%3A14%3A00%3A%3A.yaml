simpleMeaning: The ruling house of China from 1122 to 221 BC, known for the rise of the teachings of Confucius
  and of the Tao.
scope: The ruling house of China from 1122 to 221 BC, not a later ruling house or a house that ruled only
  one part of China; also called Chow, Chou, Chow dynasty, Zhou and Zhou dynasty.
examples:
- The Chou dynasty ruled China for many hundreds of years.
- The teachings of Confucius grew during the Chou dynasty.
