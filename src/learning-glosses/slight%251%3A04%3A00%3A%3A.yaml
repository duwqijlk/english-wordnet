senseId: 'slight%1:04:00::'
synsetId: 01228272-n
simpleMeaning: A rude act done on purpose, often to show anger or disapproval.
scope: It is the insulting act itself, not the adjective senses for a small amount or little importance,
  nor the verb for treating someone with disrespect.
examples:
- She read his silence at dinner as a deliberate slight.
- He apologised for the slight and they shook hands the next day.
