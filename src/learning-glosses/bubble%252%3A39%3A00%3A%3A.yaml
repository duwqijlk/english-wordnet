simpleMeaning: to move along in an uneven flow, making a noise as it goes
scope: Also called ripple. This sense is about flowing in an uneven way with a noise; it is not a ball
  of gas and not a round cover.
examples:
- The small stream bubbled over the rocks.
- The brook bubbled along under the trees.
