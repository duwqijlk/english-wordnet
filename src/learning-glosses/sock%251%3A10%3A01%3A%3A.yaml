simpleMeaning: a short cloth cone with its tip cut off, fixed on top of a tall pole, that turns to show
  which way the wind blows
scope: A cloth cone on a pole that shows wind direction, not the cloth foot covering worn inside a shoe.
examples:
- The sock on the pole at the airfield swung round to point east.
- Pilots watched the sock to see which way the wind blew.
