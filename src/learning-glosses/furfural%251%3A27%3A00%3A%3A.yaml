simpleMeaning: Used to make furan, a chemical, and to dissolve other things, this thin liquid with a sharp
  smell comes from plant hulls and corncobs.
scope: This thin liquid is also called furfuraldehyde; it comes from plant hulls and corncobs.
examples:
- The furfural came from plant hulls.
- Furfural gives the mixture its sharp smell.
