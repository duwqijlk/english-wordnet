simpleMeaning: anything used to start burning a propellant, the fuel that pushes a bullet or rocket forward
scope: 'Also called fuse and primer: this is a thing that starts fuel burning, not the first thin coat
  of paint put on a surface.'
examples:
- The priming set off the main charge in the old gun.
- He checked the priming before loading the propellant.
