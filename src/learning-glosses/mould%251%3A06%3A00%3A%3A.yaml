simpleMeaning: a hollow shape into which liquid is poured so that it sets hard in that shape
scope: A hollow shape into which liquid is poured so that it sets hard in that shape; cast and mold are
  other names for this sense, and it is not the fungus that grows on damp things or the act of shaping.
examples:
- She poured the jelly into a mould and left it to set.
- The cake came out of the mould in one piece.
