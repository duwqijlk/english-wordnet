simpleMeaning: one of several kinds of large animal like a cow, with a big head, short horns, thick rough
  hair around its neck, and a raised part on its back
scope: This sense is the large wild animal itself, not a cow kept on a farm and not another large animal
  that eats grass.
examples:
- The bison stood near the road with its big head low.
- A group of bison moved slowly across the wide open land.
