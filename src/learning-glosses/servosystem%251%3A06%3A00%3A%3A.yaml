simpleMeaning: a set of parts that uses a small movement to drive a much more powerful movement, and may
  correct itself
scope: Also called a servo and a servomechanism; a set of parts that turns a small movement into a much
  stronger one, not a single motor and not a hand control.
examples:
- The servosystem turned a small hand movement into a powerful push.
- A fault in the servosystem stopped the arm from lifting the load.
