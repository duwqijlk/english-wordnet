simpleMeaning: In the Roman Catholic Church, a person sent by the head of the Church in Rome to a land
  that has no formal ties with it.
scope: In the Roman Catholic Church, a person sent by the head of the Church to a land with no formal
  ties with it; not an ambassador and not a local bishop.
examples:
- The apostolic delegate met the president in the capital.
- An apostolic delegate was sent to the country after years without ties.
