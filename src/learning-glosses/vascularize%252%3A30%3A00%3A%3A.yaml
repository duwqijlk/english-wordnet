simpleMeaning: To make a part of the body grow tubes that carry blood through it.
scope: To make a part of the body grow tubes that carry blood, with vascularise as another name for this
  sense; not the change of becoming full of blood tubes on its own, a different sense of the same word.
examples:
- The yolk sac is gradually vascularized.
- The graft will vascularize over the next few weeks.
