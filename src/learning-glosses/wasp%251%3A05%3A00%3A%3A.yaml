simpleMeaning: a flying insect, living alone or in a group, usually with a thin body, its rear part joined
  by a narrow stalk, and a sting that hurts a lot
scope: A flying insect with a thin body and a sting that hurts a lot, not a bee and not a fly.
examples:
- A wasp stung her on the arm.
- Wasps built a nest under the roof.
