simpleMeaning: a harmless growth that sticks out from a bone, usually with a layer of firm, bendy tissue
  over it
scope: A harmless growth sticking out from a bone, not a broken bone and not a cancerous growth that spreads.
examples:
- The doctor found an exostosis on her shin bone.
- The exostosis on his heel made walking painful.
