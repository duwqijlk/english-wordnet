simpleMeaning: In computer science, one time that a set of steps is run, when the steps are run again
  and again
scope: One single run of steps in a program, also called a loop; not the whole act of running the steps
  again and again.
examples:
- Each iteration of the program checks one name on the list.
- After three iterations, the answer was still wrong.
