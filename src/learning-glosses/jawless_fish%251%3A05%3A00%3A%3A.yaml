simpleMeaning: With no jaws and no paired limbs, this long thin creature with a backbone, shaped like
  an eel, is one of the cyclostomes or a kind now gone.
scope: Also called agnathan and jawless vertebrate, it is an eel-shaped creature with a backbone and no
  jaws, unlike most fish.
examples:
- The jawless fish moved along, long and thin like an eel.
- A jawless fish is one of the cyclostomes.
