simpleMeaning: a doctor with special training about the nerves, the brain and the cord in the back, and
  the illnesses that harm them
scope: A doctor for illnesses of the nerves and brain, not a doctor for the mind and not a general doctor
  for all illness.
examples:
- The neurologist tested his nerves and asked about his headaches.
- She saw a neurologist after she kept losing feeling in her hand.
