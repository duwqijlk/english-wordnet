simpleMeaning: A drug that lifts low mood and gets the body moving, made as a salt or ester from an acid,
  and not one of the three-ring drugs
scope: It names a drug made from an acid that lifts low mood and gets the body moving.
examples:
- He took maleate to lift his low mood.
- Maleate helped her feel less slow and more ready to move.
