simpleMeaning: to be thickly covered with stiff, short hairs or with thin, stiff parts like them
scope: Covered thickly with stiff hairs or points; not one stiff hair by itself, and not reacting in an
  angry or offended way.
examples:
- The cactus bristles with long, sharp spines.
- The small brush bristled with stiff wire points.
