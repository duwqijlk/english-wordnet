simpleMeaning: A thorny, branching, leaf-shedding shrub of the southwestern US whose clusters of tiny
  yellow-white flowers open before the leaves, followed by showy black berry-like fruits.
scope: A thorny southwestern shrub with black berry-like fruits, also listed as tanglebush; not the desert
  willow.
examples:
- A desert olive grew beside the dry creek bed.
- The desert olive's black fruits stood out against its bare branches.
