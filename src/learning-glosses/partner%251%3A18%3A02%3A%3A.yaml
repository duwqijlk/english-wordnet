simpleMeaning: a person who shares ownership of a business with one or more other people.
scope: This is not a spouse, and not simply someone who shares an activity; it is a co-owner of a business.
examples:
- Each partner is liable for the debts of the firm.
- The junior partner was promoted after ten years with the law firm.
