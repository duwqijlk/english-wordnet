simpleMeaning: A tree of north-eastern North America with wide leaves shaped like hearts
scope: A tree of north-eastern North America with wide heart-shaped leaves, not a tree with narrow leaves
  and not a tree of other lands; hackmatack is another name for it.
examples:
- The balsam poplar grew beside the river.
- Balsam poplar leaves turned gold in autumn.
