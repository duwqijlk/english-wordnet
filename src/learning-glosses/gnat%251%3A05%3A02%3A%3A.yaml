simpleMeaning: In British use, a small flying insect that bites, the same as a mosquito
scope: In British use, a small biting fly, the same as a mosquito; not the wider group of small biting
  flies in general.
examples:
- A gnat bit her arm as she sat in the garden.
- The gnats were out in force by the river at dusk.
