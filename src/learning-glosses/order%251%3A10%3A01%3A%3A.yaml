simpleMeaning: A business document that asks a supplier to provide stated goods in stated amounts, in
  return for payment.
scope: This is a buying document, not a command, a neat arrangement, or a rank on a scale.
examples:
- The shop sent an order for fifty chairs.
- We received the goods two days after placing the order.
