schema: oewn-learning-gloss-v2
senseId: 'diminish%2:30:04::'
synsetId: 00442836-v
simpleMeaning: to make a person have less power, get less respect from others, or be thought of less well
  by others
scope: To make a person seem less important or less respected, not to make something smaller in size,
  amount, or strength.
examples:
- His angry words diminished her in the eyes of the team.
- The report diminished the leader in the eyes of the public.
