simpleMeaning: To act as a hopeful person who sees the good side of things
scope: Acting as a hopeful person who sees the good side of things, not making a thing work as well as
  it can and not changing a thing to make it store more or cost less.
examples:
- She optimizes every setback, finding some good in it.
- He always optimizes, seeing the bright side of every failure.
