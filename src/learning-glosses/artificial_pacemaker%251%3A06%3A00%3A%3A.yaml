simpleMeaning: an electronic machine put inside the body that keeps the heart beating in its normal way
  when the heart cannot do it itself
scope: 'Also called a pacemaker: a machine put inside the body to run the heart''s beat, not a pill and
  not a machine kept outside the body.'
examples:
- The artificial pacemaker keeps her heart beating at a steady speed.
- Doctors put an artificial pacemaker in his chest after his heart slowed down.
