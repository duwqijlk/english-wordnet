simpleMeaning: one of a group of very similar chemicals made by a gland in the neck that change how fast
  the body uses food and energy
scope: This is one of a set of closely related chemicals made by a gland in the neck that change how fast
  the body uses food and energy; not a chemical from another gland and not a vitamin.
examples:
- Her thyroid hormone levels were low, so the doctor gave her a pill.
- The thyroid hormone in his blood told the doctor his gland was working too hard.
