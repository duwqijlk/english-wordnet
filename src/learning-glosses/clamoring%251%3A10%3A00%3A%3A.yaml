simpleMeaning: loud shouting that goes on and on, made by many people at the same time
scope: A loud, lasting outcry from many people, also called clamor, clamour and clamouring; not a single
  person's shout and not quiet talk.
examples:
- The clamoring of the crowd could be heard outside the hall.
- He tried to speak over the clamoring for change.
