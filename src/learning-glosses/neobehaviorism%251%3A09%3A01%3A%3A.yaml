simpleMeaning: A branch of psychology that keeps the focus on visible actions but adds inner experience,
  using experiments and lab analysis to study fantasies, love, stress, empathy, trust and personality.
scope: This is the mid-20th-century school that kept psychology's focus on visible actions while also
  taking on hidden inner life. It is not classic behaviorism, which ignored such inner states, nor psychoanalysis,
  which worked from the unconscious rather than the laboratory.
examples:
- Skinner's neobehaviorism brought laboratory methods to questions about motivation and emotion.
- The lecture explained how neobehaviorism widened the study of behavior to include stress and empathy.
