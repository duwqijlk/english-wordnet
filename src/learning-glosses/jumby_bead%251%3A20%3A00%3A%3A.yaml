simpleMeaning: A tree of the West Indies, like the Ormosia monosperma tree but bigger, with smaller leaflets
  and smaller seeds.
scope: A tree of the West Indies like the Ormosia monosperma tree but bigger; jumbie bead is another name
  for it, not the Ormosia monosperma tree itself and not a smaller tree with bigger seeds.
examples:
- A jumby bead grew near the shore.
- The jumby bead bore small seeds.
