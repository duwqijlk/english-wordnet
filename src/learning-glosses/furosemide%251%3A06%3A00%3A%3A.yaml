simpleMeaning: A water pill (trade name Lasix) often used to treat high blood pressure and swelling from
  too much water in the body.
scope: This is a water pill, sold as Lasix, that treats high blood pressure and swelling from too much
  water; not a pill for pain, and not a pill that lowers blood sugar.
examples:
- The doctor gave her furosemide to bring her blood pressure down.
- Furosemide helped the swelling in his legs go down.
