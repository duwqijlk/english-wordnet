simpleMeaning: A sugar made in blood cells, most of all in the lungs and liver, that stops a clotting
  protein; used as a blood-thinning drug for clots and in heart surgery.
scope: A sugar that stops blood from clotting, not a clot itself; also called heparin and Liquaemin.
examples:
- Lipo-Hepin kept the blood thin during the operation.
- The nurse gave Lipo-Hepin before the heart surgery.
