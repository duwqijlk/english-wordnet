simpleMeaning: A North American plant with a spike of pink or white flowers, each with two lips.
scope: A North American plant with a spike of pink or white two-lipped flowers, also called false dragon
  head or obedient plant; not a true snapdragon and not a foxglove.
examples:
- The false dragonhead bloomed white in the meadow.
- False dragonheads grow along the river bank.
