simpleMeaning: With roots that creep along the ground, a rough ragweed lives for years on the dry bare
  lands of the southwest United States and Mexico.
scope: Also called perennial ragweed, this coarse ragweed with creeping roots grows on dry bare land in
  the southwest United States and Mexico.
examples:
- Western ragweed grew on the dry bare land of the southwest United States.
- The ragweed roots of the west crept through the dry ground.
