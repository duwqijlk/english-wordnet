simpleMeaning: A cost that was not planned in a budget or not named, often used in the plural
scope: An unplanned or unnamed cost, often in the plural; not the adjective sense of a small side matter.
examples:
- He asked for seven dollars for incidental expenses.
- Keep the receipts for any incidentals on the trip.
