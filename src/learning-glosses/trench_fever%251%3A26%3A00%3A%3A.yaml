simpleMeaning: a sickness that brings pain in the muscles and joints and spreads through lice
scope: This is a sickness with pain in the muscles and joints, spread by lice; not a fever from a cold
  and not pain in the joints from hard work.
examples:
- He caught trench fever in the crowded camp.
- Trench fever left her with aching joints for weeks.
