simpleMeaning: Used as bait, kept in tanks, or set to keep down mosquitoes, these small swimmers, mostly
  of warm sea waters, move in groups like carp.
scope: These small warm-water swimmers move in groups like carp and serve as bait, tank stock, or mosquito
  control.
examples:
- The killifish swam in a group in the warm water.
- Killifish kept the mosquitoes down.
