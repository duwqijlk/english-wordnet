simpleMeaning: the way a tooth grows its hard outer coat as it forms
scope: This is the way a tooth grows its hard outer coat as it forms, and not the growth of the tooth
  itself or the repair of a tooth once it is grown.
examples:
- Amelogenesis takes place while the tooth is still forming in the gum.
- Problems during amelogenesis can leave the enamel thin and weak.
