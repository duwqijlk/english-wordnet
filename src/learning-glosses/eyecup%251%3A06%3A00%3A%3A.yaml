simpleMeaning: To put medicine or a wash on the round part you see with, use a small pot whose curved
  edge sits round that part.
scope: Also called an eye cup or an eyebath, this small pot is for washing the eye with medicine or a
  cleansing liquid, not the cup-like part in an embryo that grows into the eye's seeing layers.
examples:
- She filled the eyecup with the wash and held it against her eye.
- He held the eyecup to his eye and tipped his head back.
