simpleMeaning: The second highest of the four groups of Hindu society, the group of lords and fighters
scope: This is the second highest of the four groups of Hindu society, the group of lords and fighters,
  not the highest group and not the lowest group.
examples:
- The rajanya stood just below the highest group in Hindu society.
- A rajanya belonged to the group of lords and fighters.
