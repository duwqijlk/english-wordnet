simpleMeaning: a job office run by a workers' union, where work is given out to people who ask for it
  by length of service or in turn
scope: A union-run job office where work is given out by length of service or in turn, not a private job
  agency and not a union meeting room.
examples:
- Workers gathered at the hiring hall each morning to wait for jobs.
- The hiring hall gave the longest-serving men the first jobs of the day.
