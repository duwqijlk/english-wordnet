simpleMeaning: Any of several living things with leaves that stand on the stem in such a way that they
  point to north, south, east and west
scope: Any of several living things with leaves that point to north, south, east and west; compass flower
  is another name for this sense, not a sunflower and not a living thing whose leaves turn to follow the
  sun.
examples:
- The compass plant by the path points north and south.
- A compass plant showed us which way was east.
