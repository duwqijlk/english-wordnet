simpleMeaning: 'No one sees this one until the end of the game: in poker it is given to a player face
  down'
scope: In poker, this is the face-down one kept hidden until the end, not a card dealt face up for all
  to see.
examples:
- His hole card was an ace, and no one at the table knew it.
- She kept her hole card face down until the showdown.
