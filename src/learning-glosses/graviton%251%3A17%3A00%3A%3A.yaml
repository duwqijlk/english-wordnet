senseId: 'graviton%1:17:00::'
synsetId: 09314539-n
simpleMeaning: Between bits of matter, an extremely weak pull passes by way of a force-carrying bit, the
  smallest piece that bears that pull.
scope: This is not the pull of gravity itself but the bit that carries it between bits of matter.
examples:
- Physicists say a graviton carries gravity's pull between two bits of matter.
- A graviton passes the pull between the earth and the moon.
