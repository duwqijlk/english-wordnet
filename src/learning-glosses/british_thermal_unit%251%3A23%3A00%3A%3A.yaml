senseId: 'british_thermal_unit%1:23:00::'
synsetId: 13749057-n
simpleMeaning: 'A measure of heat: the heat needed to warm one pound of water by one degree Fahrenheit
  at normal air pressure, equal to about 252 calories.'
scope: This is a measure of heat based on warming water; BTU and B.Th.U. are other names for it, not the
  calorie or the joule, which are other measures of heat.
examples:
- One British thermal unit warms a pound of water by a single degree.
- The heater gives out thousands of British thermal units each hour.
