simpleMeaning: To ask the court that gave an order to explain, change, or undo it, a step is taken in
  court.
scope: This step in court asks the same court to explain, change, or undo its own order, not a fresh case
  before a higher court.
examples:
- The lawyer filed a bill of review to ask the court to change its order.
- A bill of review goes to the court that gave the order in the first place.
