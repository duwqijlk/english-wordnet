simpleMeaning: a silvery kind of brown fish that lives in salt water and swims into fresh water to lay
  its eggs
scope: A silvery fish that swims from salt water to fresh water to lay eggs; not the flesh of the fish,
  and not one of the North American coastal fish of the same name.
examples:
- The sea trout swam up the river to lay its eggs.
- We watched a sea trout jump as it moved into fresh water.
