simpleMeaning: A seed that can kill, dark brown, from a climbing plant of Africa, and the source of physostigmine,
  a drug used in the magic of the people there.
scope: This dark brown seed, also called an ordeal bean, can kill and is the source of physostigmine,
  a drug used in the magic of the people there.
examples:
- They warned him that a calabar bean can kill.
- The calabar bean comes from a climbing plant of Africa.
