senseId: 'summary_judgement%1:04:00::'
synsetId: 01193051-n
simpleMeaning: A decision given by a court before a verdict, because no important point of fact is in
  doubt and one side is entitled to win as a matter of law.
scope: A court judgment given before trial when no fact is in doubt; also called summary judgment, judgement
  on the pleadings and judgment on the pleadings; not a verdict after a trial and not a settlement between
  the sides.
examples:
- The judge gave summary judgement before the trial began.
- Summary judgement ended the case without a jury.
