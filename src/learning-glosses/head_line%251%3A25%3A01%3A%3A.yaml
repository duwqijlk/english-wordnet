simpleMeaning: A fold in the skin of the palm said to show a person's mind and how it works, with the
  way they learn, speak, think, and seek knowledge
scope: This is a fold in the skin of the palm said to show a person's mind and how it works, and not the
  life line or any other fold on the palm.
examples:
- The head line on her palm runs across the middle.
- Often, the head line is joined with the life line at the start.
