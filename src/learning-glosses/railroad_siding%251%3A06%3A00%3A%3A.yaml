simpleMeaning: a short extra track where trains can wait or pass each other, and where train cars can
  be kept
scope: 'Also called a turnout, a siding, and a sidetrack: a short extra track where trains wait or pass,
  not the main line and not a station platform.'
examples:
- The freight cars were left on a railroad siding overnight.
- The slow train pulled onto a railroad siding to let the fast train pass.
