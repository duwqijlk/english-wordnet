simpleMeaning: Any of several statistical methods that shrink a big set of correlated measurements into
  a few underlying factors, which then explain how the measurements relate.
scope: A statistical method for finding a few hidden factors behind a mass of correlated measurements,
  not a way of testing whether one thing causes another.
examples:
- The researchers used factor analysis to group the survey questions into a few broad themes.
- Factor analysis showed that the twelve test scores mostly reflected three underlying abilities.
