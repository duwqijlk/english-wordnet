senseId: double-geared%5:00:00:geared:00
synsetId: 01104288-s
simpleMeaning: Said of a machine that gains more force because two small toothed wheels mesh with two
  wheels.
scope: It is a machine whose gearing joins two small toothed wheels with two wheels for more force, and
  not the lathe kind that slows the spindle down.
examples:
- The crane's double-geared lifting mechanism raised the load.
- A double-geared winch gives more force for the same effort.
