simpleMeaning: the work of trying to be chosen in an election
scope: The work of trying to be chosen in an election; campaigning, candidacy and electioneering are other
  names for this sense; not the election itself, and not the act of voting.
examples:
- Her candidature began with a speech in the town hall.
- His candidature for mayor lasted six months.
