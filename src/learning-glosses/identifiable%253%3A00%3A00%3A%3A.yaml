simpleMeaning: able to be known for who or what it is
scope: This covers a person or thing that can be known for who or what it is, not a person or thing that
  stays unknown.
examples:
- The bird was identifiable by the white mark on its wing.
- Even in the old photo, she is easily identifiable.
