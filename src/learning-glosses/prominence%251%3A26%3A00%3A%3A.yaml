simpleMeaning: the state of being known by many people or greatly respected
scope: The state of being known by many people or greatly respected; not a part that sticks out, and not
  how important a thing is compared with others.
examples:
- She rose to prominence as a singer known across the country.
- After years of hard work, he reached prominence and was respected by many people.
