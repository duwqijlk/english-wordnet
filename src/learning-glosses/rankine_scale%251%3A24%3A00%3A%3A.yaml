simpleMeaning: A way of measuring true heat in Fahrenheit steps; water freezes at 491.69 and boils at
  671.69.
scope: A way of measuring true heat in Fahrenheit steps; not the common Fahrenheit scale and not the Celsius
  scale.
examples:
- On the Rankine scale, water freezes at 491.69 degrees.
- The Rankine scale measures true heat in Fahrenheit steps.
