simpleMeaning: Of or like the richly decorated style of building, art and music that was popular in Europe
  between 1600 and 1750
scope: This word describes a building, work of art or piece of music as being in the richly decorated
  European style of 1600 to 1750. It is not the name of that style itself, and not just any richly decorated
  thing.
examples:
- The church has a baroque front with gold and curved stone everywhere.
- She likes baroque music from the 1600s more than modern music.
