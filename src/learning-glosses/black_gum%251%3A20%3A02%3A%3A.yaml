simpleMeaning: this small mallee yields a red gum; its bark is rough and dark low down on the trunk
scope: Also called black mallee and black sally; a small mallee that gives a red gum, not the tall black
  gum of eastern North America.
examples:
- The black gum by the creek has rough dark bark.
- They tapped the black gum for its red gum.
