simpleMeaning: any of several plants from warm lands in the Capsicum group (a set of plants of the same
  close kind), which bear the fruits this plant is named for
scope: This is the living Capsicum plant itself, not the spice made from a different plant's berry and
  not the fruits that grow on it.
examples:
- She grew a pepper in her garden and picked its red fruits in summer.
- This pepper needs warm weather to grow well.
