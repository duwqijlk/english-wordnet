simpleMeaning: of a nerve thread that carries signals out from the outer layer of the brain
scope: Of a nerve thread that carries signals out from the outer layer of the brain; corticoefferent and
  corticofugal are other names for this sense, not a thread that carries signals into the brain, and not
  a thread in the spine.
examples:
- The corticifugal fibres carry signals out from the outer layer of the brain.
- A corticifugal nerve thread runs outward from the cortex.
