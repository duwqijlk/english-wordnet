simpleMeaning: the colour of a thing looks different each time the light changes or you move to look at
  it from another side
scope: 'Also called shot: a colour that shifts with the light or the angle, not a steady rainbow shine.'
examples:
- The dragonfly hovered, its wings iridescent in the sun.
- Her iridescent dress changed from green to purple as she turned.
