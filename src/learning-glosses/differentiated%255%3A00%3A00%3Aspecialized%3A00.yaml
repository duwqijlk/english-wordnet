simpleMeaning: In biology, having become special for one use during growth; changed as it grows to fit
  one job or one place where it lives
scope: This biology sense means a part or a living thing becomes made for one job or one place as it grows,
  not just made different or shown to be different in a general way.
examples:
- These differentiated cells are made to carry oxygen around the body.
- In the growing plant, differentiated tissues carry water from the roots to the leaves.
