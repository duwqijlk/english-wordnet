simpleMeaning: As a young life grows, this middle layer turns into muscle, bone, gristle, blood, and the
  stuff that joins parts together.
scope: Mesoderm is another name for this middle layer of a young life, which turns into muscle, bone,
  gristle, blood, and the stuff that joins parts together.
examples:
- The mesoblast gives rise to the muscles of the body.
- Bone and blood both come from the mesoblast.
