simpleMeaning: A very large fish of warm seas, caught for sport, with a long round upper jaw that has
  no teeth.
scope: A very large warm-sea fish caught for sport, with a long round toothless upper jaw; not a slender
  long-beaked fish of mild Atlantic waters and not a shark.
examples:
- The billfish leapt clear of the water as they fought it.
- A billfish with a long round jaw took the bait.
