schema: oewn-learning-gloss-v2
senseId: 'monohybrid%1:05:00::'
synsetId: 01330550-n
simpleMeaning: Two parents alike except at one place in their genes have young that can show either of
  two forms of that gene, as in Mendel's pea trials.
scope: This is one kind of cross, differing at a single gene place, not a cross that differs at many places
  in the genes.
examples:
- The monohybrid came from parents that differed at only one gene place.
- In Mendel's work, a monohybrid showed one of two forms of a single gene.
