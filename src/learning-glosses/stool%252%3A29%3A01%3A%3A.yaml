scope: A plant growing new side shoots from its base; not the body-waste noun, not the toilet, and not
  either of the wild-bird verb senses.
examples:
- The cut willow stooled quickly, sending up many new shoots.
- After the tree was cut back, it stooled and grew a ring of fresh stems.
