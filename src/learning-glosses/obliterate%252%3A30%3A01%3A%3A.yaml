senseId: 'obliterate%2:30:01::'
synsetId: 00314788-v
simpleMeaning: To make a thing so hard to read or see that it cannot be made out, by hiding it from view.
scope: Also called hide, veil, or obscure, this is making a thing impossible to read or see by hiding
  it, not rubbing it out or marking it for removal.
examples:
- Clouds obliterated the view of the valley.
- She obliterated the message by folding the paper over it.
