simpleMeaning: to hold to a creed, have faith, and be a follower of a set of teachings
scope: This is holding to a creed or faith, not accepting a statement as true, not judging or regarding
  something in a certain way, not being confident that something will happen, and not trusting someone's
  truthfulness.
examples:
- Many people believe in a higher power.
- She has believed in God since childhood.
