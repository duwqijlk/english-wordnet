simpleMeaning: A higher court decides that a lower court was wrong, so the lower court's decision should
  not stand
scope: 'This is the court sense: a higher court putting aside a lower court''s decision. It is not a bad
  event that stops progress, not turning the order of things round, and not a general decision to undo
  an earlier decision outside court.'
examples:
- The appeal led to a reversal of the guilty finding.
- The court's reversal meant the first judgment no longer stood.
