simpleMeaning: a strong wish to win against other people, and a readiness to push hard to do so
scope: 'Also called fight: this is a strong wish to win against others, not a real fight with hands or
  weapons and not one single game.'
examples:
- Her competitiveness made her train hard before every race.
- The team's competitiveness was clear in how hard they tried to win each game.
