synsetId: 12994822-n
simpleMeaning: around the roots of sweet potatoes it leaves dry decay in round marks, and in fruit and
  vegetables it causes a soft wet decay
scope: Also called leak fungus; a growth that rots fruit and roots, not a mould that grows on bread and
  not a mushroom you can eat.
examples:
- The ring rot fungus left soft wet patches on the stored fruit.
- Farmers check the roots for ring rot fungus before they lift the sweet potatoes.
