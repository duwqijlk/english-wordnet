simpleMeaning: a set of electrical and electronic parts that lets people at the street and at home talk
  to each other, in houses, apartments or villas
scope: A set of parts that lets people at the street and at home talk to each other, also called a door
  phone, and not a plain bell that only rings and not a telephone for calls to other houses.
examples:
- She pressed the door bell phone and spoke to the visitor at the gate.
- The door bell phone let him talk to the courier without going downstairs.
