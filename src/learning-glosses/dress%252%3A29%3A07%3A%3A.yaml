simpleMeaning: To wear clothes in a particular style or way.
scope: This is about the style of clothes someone wears; it is not the act of putting them on, and not
  about taking elaborate care over your appearance.
examples:
- He dresses in a sharp, formal style for work.
- They dress casually at the weekend, in jeans and old sweaters.
