senseId: 'waterline%1:15:00::'
synsetId: 08696521-n
simpleMeaning: a line that shows where the water reaches on a ship that is floating flat and steady; it
  is often painted on the ship's outer side
scope: Also called water level or a water line, this is the line where water meets a floating ship; it
  is not a mark for water inside a tank and not a pipe that carries water.
examples:
- The red paint at the waterline was just above the waves.
- Below the waterline, the ship's side was green with sea growth.
