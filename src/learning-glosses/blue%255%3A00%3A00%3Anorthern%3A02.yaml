simpleMeaning: belonging to the northern side in the American Civil War, whose soldiers wore blue uniforms.
scope: This sense is about a side in a historical war, not about the color blue or about feeling sad.
examples:
- The blue troops camped beside the river.
- In the history book, the blue side is called the Union.
