simpleMeaning: To change so the surface turns rough and thick, like cloth made of pressed wool.
scope: To change so a surface turns rough and thick like felt cloth, matte being another name for this;
  not to become smooth and not to wear thin.
examples:
- The wool sweater matted up after I washed it.
- The old blanket had matted up in the wash.
