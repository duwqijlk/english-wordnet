simpleMeaning: To put seeds, young seedlings or other growing things into the ground.
scope: This is not the noun for a hidden performer in a crowd; it is the action of putting seeds or young
  growths into soil.
examples:
- They planted tomatoes along the back wall.
- The children planted sunflower seeds in small pots.
