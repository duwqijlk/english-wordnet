simpleMeaning: To say what is right and wrong, talking as if giving a sermon
scope: To say what is right and wrong, talking as if giving a sermon; moralize, sermonize, sermonise and
  moralise are other names for this sense, not simply giving a talk in church.
examples:
- He began to preachify about how young people should behave.
- Don't preachify at me; just tell me what happened.
