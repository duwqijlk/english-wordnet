simpleMeaning: when the body on its own pushes what is in the stomach out through the mouth
scope: 'Also called vomit, vomiting, regurgitation and emesis: this is the act itself, not the sick feeling
  before it and not what comes out.'
examples:
- His puking went on all night, so his mother called a doctor.
- She started puking soon after eating the bad fish.
