scope: 'Also called infernal, hellish, unholy, demonic, diabolical, satanic and diabolic: very evil and
  cruel, not just bad or unkind in a small way.'
examples:
- The fiendish ruler enjoyed making his people suffer.
- They made a fiendish plan to hurt innocent people.
