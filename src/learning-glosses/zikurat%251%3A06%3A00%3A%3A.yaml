simpleMeaning: A flat-topped mound or temple in steps, four-sided, raised by the ancient Assyrians and
  Babylonians.
scope: Also called ziggurat and zikkurat, this stepped temple or mound was raised by the ancient Assyrians
  and Babylonians.
examples:
- The zikurat rose in steps.
- The zikurat's steps led up to the temple top.
