simpleMeaning: a scientist who works on health and studies how diseases spread to many people and how
  to stop them
scope: This is a scientist who studies how diseases spread, not a doctor who treats one sick person and
  not a scientist who studies other things.
examples:
- The epidemiologist tracked how the flu spread from town to town.
- Epidemiologists warned that clean water could stop the disease spreading.
