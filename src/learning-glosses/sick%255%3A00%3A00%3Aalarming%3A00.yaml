simpleMeaning: So horrible or disgusting that it shocks you and fills you with fear.
scope: This describes something gruesome and horrifying, not a person who is ill or nauseated, and not
  dim, faint light.
examples:
- The killer's sick obsession with torture shocked the whole court.
- She told a sick joke about the accident, and no one laughed.
