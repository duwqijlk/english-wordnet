simpleMeaning: A business project that two or more firms or groups run together, to share the risk and
  the know-how
scope: A business project run by two or more firms or groups together; not a project run by one firm alone
  and not a merger of firms into one.
examples:
- The two film companies formed a joint venture to make TV shows.
- Their joint venture shared the cost of the new factory.
