simpleMeaning: A fast-growing yearly climber with big blooms in every shade of orange, from red-orange
  to pale orange, and seeds that are pickled and used like capers.
scope: A fast yearly climber with orange blooms and pickled seeds, close to other climbers with bright
  blooms; also called garden nasturtium and Indian cress.
examples:
- Tropaeolum majus climbed the sunny wall in weeks.
- We pickled the seeds of Tropaeolum majus like capers.
