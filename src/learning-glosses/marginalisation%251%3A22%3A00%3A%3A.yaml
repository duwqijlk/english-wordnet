senseId: 'marginalisation%1:22:00::'
synsetId: 13532149-n
simpleMeaning: the social process by which people, above all a group, move to or are pushed to the edge
  of the larger society
scope: The social process by which people, above all a group, move to or are pushed to the edge of the
  larger society, also called marginalization; not a single act of leaving someone out.
examples:
- The marginalisation of the underclass worries many people.
- The marginalisation of literature in schools is often discussed.
