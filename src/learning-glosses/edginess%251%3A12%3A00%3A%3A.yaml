simpleMeaning: worried feelings that make you tight with nerves and quick to get angry
scope: Worried feelings that make you tight and quick to get angry, also called uneasiness, inquietude
  and disquietude; not a sharp edge, and not anger alone.
examples:
- Her edginess grew as she waited for the test results.
- There was a clear edginess in his voice before the meeting.
