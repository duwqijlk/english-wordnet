senseId: 'subordinative%3:00:00::'
synsetId: 00554838-a
simpleMeaning: used to join a smaller part of a sentence to the main part
scope: 'Also called subordinating: a word that joins a smaller part of a sentence to the main part, not
  a word that joins two main parts.'
examples:
- The word 'when' is subordinative in 'I will come when I can'.
- In 'She left after the bell rang', 'after' is a subordinative word.
