simpleMeaning: Thoughts follow one another in good order to test whether a claim is true or not true
scope: Also called a line, an argument, argumentation, and a logical argument, it puts a claim to the
  test by thoughts that follow one another in good order.
examples:
- I can't follow your line of reasoning.
- The line of reasoning moved from one fact to the next until the claim was clear.
