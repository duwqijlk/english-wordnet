simpleMeaning: Found in beds of rock laid down by water, this natural solid is made of potassium chloride
  and is a key source of potassium.
scope: This is also called sylvine, and it is dug from beds of rock laid down by water as a key source
  of potassium.
examples:
- Sylvite turned up in the beds of rock laid down by water.
- They crushed sylvite to get at the potassium inside.
