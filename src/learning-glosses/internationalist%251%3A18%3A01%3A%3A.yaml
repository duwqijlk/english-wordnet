simpleMeaning: A member of a socialist or communist league that spans nations.
scope: A member of a socialist or communist league that spans nations; not moved by, or speaking for,
  nations working together, nor one who speaks for nations working together.
examples:
- Their internationalist sat on the board.
- The internationalist spoke at noon.
