simpleMeaning: Pay that is enough for a worker and their family to meet their needs in comfort
scope: Pay enough for a worker and their family to meet their needs in comfort, not the lowest pay allowed
  by law and not pay that covers one person only.
examples:
- She campaigned for a living wage for all cleaners.
- A living wage lets a family live in comfort.
