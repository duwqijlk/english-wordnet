simpleMeaning: to make an electric current flow by the effect of still electric charge or by the effect
  of a magnet
scope: 'Also called induce: making an electric current in this way, not bringing a person into a group
  or a job, and not starting a process in the body.'
examples:
- The moving magnet inducts a small current in the coil of wire.
- The device inducts current without touching the metal ring.
