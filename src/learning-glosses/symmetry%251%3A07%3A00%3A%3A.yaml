simpleMeaning: In mathematics, a quality of a shape or link in which the two halves match exactly as mirror
  images on either side of a line or flat surface
scope: In mathematics, a quality of a shape or link whose two halves match exactly as mirror images; balance
  and correspondence are other names for this, not the quality of being the same in every direction and
  not a shape with no pattern.
examples:
- The symmetry of the butterfly's wings pleased the eye.
- In maths, symmetry means the two halves match exactly.
