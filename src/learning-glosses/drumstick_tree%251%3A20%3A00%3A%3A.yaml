simpleMeaning: A tree that may shed or keep its leaves, with fragrant brown-to-yellow flowers in hanging
  sprays and pods of medicinal pulp; tropical Asia, Central and South America, Australia.
scope: This is the tropical tree with hanging yellow flowers and medicinal pod pulp, not the cassia bark
  sold as a spice, and not other cassias such as the pink-flowered Java cassia.
examples:
- Our guide pointed out a drumstick tree, its long pods hanging beside the yellow flowers.
- The drumstick tree grows wild in tropical Asia and parts of South America.
