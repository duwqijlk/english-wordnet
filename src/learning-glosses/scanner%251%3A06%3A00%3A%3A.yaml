simpleMeaning: a radio set that sweeps by itself through a chosen range of frequencies, listening for
  a signal or condition
scope: A radio that scans a chosen range of frequencies on its own for signals, not the radar dish and
  not the machine that copies pictures into a computer.
examples:
- Police used a scanner to listen for emergency calls.
- His scanner picked up the fire brigade's channel.
