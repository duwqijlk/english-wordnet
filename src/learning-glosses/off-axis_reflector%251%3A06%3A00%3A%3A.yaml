senseId: 'off-axis_reflector%1:06:00::'
synsetId: 03521810-n
simpleMeaning: A star-gazing tube whose mirror is tipped a little so the picture falls to one side, where
  it can be seen.
scope: A star-gazing tube whose tipped mirror throws the picture to one side; not a tube whose mirror
  faces straight on and not a tube that bends light with glass.
examples:
- The off-axis reflector threw the picture to the side.
- He looked through the off-axis reflector at the stars.
