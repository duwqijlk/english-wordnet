simpleMeaning: plants with a pleasant smell, some living for one year and some living for several years,
  growing as plants with soft stems or as bushes with woody stems
scope: This means the living plants themselves, not the dried leaves that people smoke or take into the
  body.
examples:
- Tobacco grows well in warm fields.
- Farmers planted tobacco in neat rows in the field.
