simpleMeaning: Coming from parents and earlier family that are all members of one known and accepted breed
  or strain, over many generations
scope: This describes a living thing whose family all belong to one known and accepted breed or strain;
  it does not name the animal itself, and it is not mixed from two breeds.
examples:
- She bought a purebred horse with papers showing its family line.
- Their purebred dog came from many generations of the same breed.
