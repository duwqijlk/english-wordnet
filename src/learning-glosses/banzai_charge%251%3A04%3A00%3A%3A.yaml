simpleMeaning: In a mass, soldiers rush at the enemy with no thought for the dead, in a move first made
  by troops from Japan shouting their cheer.
scope: This rush by many soldiers is also called a banzai attack, and it is not a careful move that spares
  lives.
examples:
- The banzai charge rushed at the enemy, the men shouting 'banzai' as they ran.
- The men gave a banzai charge, shouting 'banzai' as they ran forward.
