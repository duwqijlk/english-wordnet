simpleMeaning: to accuse or condemn a person, group, or thing publicly as shameful or disgraceful.
scope: This is about publicly judging something or someone as shameful, not about burning a mark into
  an animal or naming a product.
examples:
- The press branded him a traitor.
- Critics branded the policy a disaster.
