simpleMeaning: a piece of hair in the shape of a curl or of a line that turns round and round
scope: 'Also called a curl, and also called a ringlet: a small piece of hair in a curl shape, not a thing
  wound in a set of loops and not a round shape made by leaves or flower parts.'
examples:
- A dark whorl of hair fell over her forehead.
- He had a whorl at the back of his head where the hair grew in a circle.
