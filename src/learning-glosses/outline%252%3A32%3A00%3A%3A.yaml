simpleMeaning: To say the main points of a thing in a short, rough way, with no small details
scope: To tell the main points of a thing, not the short summary itself and not the act of drawing up
  such a plan.
examples:
- She outlined her ideas for the new book in a few short lines.
- He outlined the plan for the meeting before we started.
