simpleMeaning: A person who sticks up printed notices on walls and on boards meant for them.
scope: A person who sticks up printed notices on walls and boards, also called poster and bill sticker;
  not a printer and not a sign painter.
examples:
- The bill poster worked through the night putting up notices.
- A bill poster pasted the new playbill on the wall.
