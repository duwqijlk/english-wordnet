simpleMeaning: A sudden illness that passes from one animal to another, marked by lung sickness and infected
  blood
scope: 'Also called hemorrhagic septicemia: a sudden illness that passes from one animal to another, marked
  by lung sickness and infected blood, not a slow cough and not a wound.'
examples:
- The vet said the calf died of pasteurellosis.
- Pasteurellosis can kill young cattle.
