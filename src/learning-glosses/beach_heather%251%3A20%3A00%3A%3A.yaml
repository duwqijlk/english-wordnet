simpleMeaning: a small plant like a heath, with soft white fuzz on it, that grows on the sand by the sea
  in the north-east of North America
scope: 'Another name for poverty grass: a small plant that grows on sandy shores, not a tall plant and
  not a heath that grows inland.'
examples:
- We found beach heather growing among the dunes.
- The beach heather was covered in soft white fuzz.
