simpleMeaning: A bone shaped like a horseshoe sits under the tongue and holds up the muscles that move
  the tongue.
scope: Also called hyoid and hyoid bone, this bone props up the tongue muscles from beneath the tongue.
examples:
- The os hyoideum holds up the muscles that move the tongue.
- The muscles that move the tongue rest on the os hyoideum.
