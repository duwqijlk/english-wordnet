simpleMeaning: One of a set of veins that drain the soft core of the back bones and pour into the front
  inner vein web of the spine.
scope: This sense is also called vena basivertebralis, one of a set of veins that drain the soft core
  of the back bones and pour into the front inner vein web of the spine.
examples:
- Basivertebral veins drain the back bones.
- The basivertebral vein pours into the spine's vein web.
