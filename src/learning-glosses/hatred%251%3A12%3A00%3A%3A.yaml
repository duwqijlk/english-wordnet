simpleMeaning: a very strong feeling of not liking someone or something, so strong that it makes a person
  want to act against them
scope: 'Also called hate: a very strong feeling of dislike that pushes a person to act, not a small dislike
  or a short angry feeling.'
examples:
- His hatred for the man who hurt his family made him want to fight back.
- She felt deep hatred toward the group that had taken her home.
