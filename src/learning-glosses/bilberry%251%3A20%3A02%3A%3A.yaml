simpleMeaning: An upright European blueberry, with single flowers and blue-black berries.
scope: An upright European blueberry, with single flowers and blue-black berries; also called blaeberry,
  whinberry, or whortleberry; not an upright blueberry of the west United States, with lone flowers and
  rather sour berries, nor blue-black berries like American blueberries.
examples:
- Their bilberry grew on the hill.
- The bilberry was picked at dawn.
