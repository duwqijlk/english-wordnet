simpleMeaning: connected with seeking deep truth about God and the spirit through quiet thought
scope: 'Also called mystic: this is about the search itself, through quiet thought, for deep truth about
  God and the spirit. It is not just a way of thinking that is like that search, and not a hidden meaning
  that is hard to understand.'
examples:
- The monks lived a mystical life of prayer and quiet thought about God.
- She wrote mystical poems about feeling close to God.
