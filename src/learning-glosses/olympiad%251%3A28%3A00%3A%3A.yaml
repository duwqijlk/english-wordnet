simpleMeaning: One of the four-year gaps between Olympic Games, used to count time in old Greece for twelve
  hundred years from 776 BC.
scope: It is a four-year gap between Olympic Games used to count time in old Greece, not the Games themselves.
examples:
- The first Olympiad began in 776 BC.
- Greek writers dated events by Olympiad, not by year.
