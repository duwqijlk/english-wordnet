senseId: 'pulverisation%1:27:00::'
synsetId: 15021579-n
simpleMeaning: A hard thing that has been crushed into very small loose dry bits
scope: A hard thing crushed into tiny loose bits; powder and pulverization are other names for this sense,
  not a liquid and not a whole lump of solid.
examples:
- The pulverisation of the dried herbs left a fine dust.
- The pulverisation felt soft between her fingers.
