simpleMeaning: a lower limb whose knee or the part below it curves out to the side, so the knees stand
  apart when the feet meet
scope: 'Also called bandy leg, bow leg, bowleg and genu varum: a limb that curves out at the knee, not
  a straight limb and not one that bends in at the knee.'
examples:
- His bandyleg was plain to see when he stood with his feet together.
- The child's bandyleg did not stop her from running fast.
