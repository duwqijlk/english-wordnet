simpleMeaning: Of or to do with the giant of old tales called Procrustes, or with his way of hurting people
  to fit them to a set size.
scope: Of or to do with the giant Procrustes of old tales and his way of hurting people, not a kind or
  gentle way of dealing with people and not a word for a real man of history.
examples:
- His Procrustean rules forced every worker into the same shape.
- The Procrustean bed of the old tale stretched or cut its guests to fit.
