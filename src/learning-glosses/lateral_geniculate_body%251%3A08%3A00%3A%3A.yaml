simpleMeaning: On the way from the eye to the back of the brain, a knot of nerve cells that takes in the
  sight signal and passes it on.
scope: People also call it corpus geniculatum laterale and lateral geniculate, the way station that passes
  sight from the eye to the back of the brain.
examples:
- The lateral geniculate body relayed the sight signal toward the back of the brain.
- The lateral geniculate body sits between the eye and the back of the brain.
