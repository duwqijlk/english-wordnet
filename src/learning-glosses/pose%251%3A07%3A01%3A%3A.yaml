simpleMeaning: The way a model holds the body still for a photo or a work of art
scope: This is a body held still for a photo or art, not a false show put on to get praise and not a claim
  to be someone else.
examples:
- The model held her pose for the artist while he drew her.
- He changed his pose when the photographer asked for a side view.
