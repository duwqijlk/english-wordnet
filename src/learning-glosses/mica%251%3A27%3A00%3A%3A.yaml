simpleMeaning: A family of minerals that peel into thin, flexible, transparent sheets; they do not conduct
  electricity well, so they are used as insulators.
scope: Another name for isinglass; the same mineral group, not a single mineral and not the fish glue.
examples:
- The old stove had a mica window that glowed red in the dark.
- Mica peels apart in thin, shiny sheets.
