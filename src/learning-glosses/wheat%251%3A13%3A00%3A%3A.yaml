simpleMeaning: the seeds of the common kind of this plant, sometimes cooked whole or broken up as cereal,
  and usually ground to make flour
scope: This is the seeds used for food, not the living plant in the field and not the pale yellow colour.
examples:
- She bought a bag of wheat to grind at home.
- He ate the wheat whole, cooked soft like rice.
