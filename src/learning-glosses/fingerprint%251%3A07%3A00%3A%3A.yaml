simpleMeaning: a dirty mark left by a finger
scope: A dirty mark left by a finger, not the clean print of the skin lines used to name a person, and
  not a general sign that shows who did something.
examples:
- There was a dirty fingerprint on the clean glass door.
- A dark fingerprint was left on the white cup by dirty hands.
