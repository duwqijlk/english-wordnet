simpleMeaning: A man who buys goods in bulk and sells them on to traders, not to the last buyers.
scope: A man who buys goods in bulk and sells them on to traders, not to the last buyers; not a male singer
  in the middle of a minstrel line who draws the others into talk.
examples:
- Their middleman sold the goods.
- The middleman was paid at noon.
