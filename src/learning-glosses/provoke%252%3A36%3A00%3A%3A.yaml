simpleMeaning: to cause something to happen or to come into view
scope: 'Also called evoke: to cause a thing or event to happen, not to bring out a feeling and not to
  annoy a person again and again.'
examples:
- His angry words provoked a fight between the two men.
- The new law provoked protests across the city.
