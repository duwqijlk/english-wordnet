simpleMeaning: The third stage of the illness, when the inner organs are harmed, above all the brain and
  the cord down the back, as well as the heart and liver
scope: The third stage of the illness, when the inner organs are harmed, above all the brain and the cord
  down the back, as well as the heart and liver; not the first stage and not the second stage.
examples:
- Tertiary syphilis can harm the brain and heart.
- Doctors watch for tertiary syphilis years after the first signs.
