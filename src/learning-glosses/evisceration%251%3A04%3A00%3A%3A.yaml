simpleMeaning: The surgical taking of an organ, or the contents of an organ, from a patient.
scope: The surgical taking of an organ, or the contents of an organ, from a patient; not the act of taking
  out the bowels or guts, the act of cutting so the guts stick out, nor the gutting of a thing, as a law
  or a statement, so its worth is cut down.
examples:
- Their evisceration saved the patient.
- The evisceration was done at dawn.
