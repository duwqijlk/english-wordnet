simpleMeaning: the act of giving a signal, for example calling someone to come, by making a high sound
  with the mouth or by blowing into a small device
scope: The act of giving a signal in this way, not the small device you blow and not the high sound itself.
examples:
- A sharp whistle from the teacher called the children back inside.
- One short whistle from the guard called the dog back to him.
