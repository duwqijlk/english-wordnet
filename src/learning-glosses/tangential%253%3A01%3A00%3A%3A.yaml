simpleMeaning: of or acting along a straight line that touches a curve at just one point
scope: This is about a line that touches a curve at one point, not about a point that is only slightly
  linked to the main subject.
examples:
- A tangential line touches the circle at only one point.
- At that point, the wheel moves in a tangential direction.
