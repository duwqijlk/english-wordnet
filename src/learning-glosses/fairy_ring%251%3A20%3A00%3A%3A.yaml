senseId: 'fairy_ring%1:20:00::'
synsetId: 13027794-n
simpleMeaning: a round band of mushrooms that marks the edge of a long-lived growth of thread-like fungus
  under the ground
scope: This is a ring of mushrooms over underground fungus; fairy circle is another name for this sense;
  not a ring of stones and not mushrooms growing on their own.
examples:
- A fairy ring grew in a wide circle on the grass.
- We found a fairy ring near the old oak.
