simpleMeaning: A long thin hollow cut into a surface, worn away by water or cut by a tool, like the track
  on a record
scope: 'Also called channel: a long narrow furrow cut by nature or by a tool, not the batch-340 senses
  of a routine, a body furrow, or cutting one.'
examples:
- Water had worn a groove in the rock.
- The needle followed the groove on the record.
