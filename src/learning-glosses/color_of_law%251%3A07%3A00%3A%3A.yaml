simpleMeaning: a false show of right under the rules, when an act only looks allowed by the rules but
  breaks them
scope: A false show of right under the rules; also called colour of law, and not a true right under the
  rules.
examples:
- The officer acted under color of law when he took the man's car without cause.
- She said the search was done under color of law, though it broke the rules.
