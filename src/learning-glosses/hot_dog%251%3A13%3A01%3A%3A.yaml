simpleMeaning: A bread roll often holding a smooth sausage of finely chopped beef or pork inside, usually
  smoked.
scope: Also called a dog, frank, weenie, frankfurter, wiener, hotdog or wienerwurst, it is a smooth sausage
  of beef or pork in a bread roll.
examples:
- He ordered a hot dog for lunch.
- He ate two hot dogs.
