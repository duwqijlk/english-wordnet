simpleMeaning: a small van shaped like a box, for carrying people, that usually has seats you can take
  out and is used as a family car
scope: This is a small family van with seats you can take out, not a large bus and not a truck for carrying
  things.
examples:
- We drove to the beach in our minivan with the seats taken out for more room.
- The family bought a minivan so all the children could ride together.
