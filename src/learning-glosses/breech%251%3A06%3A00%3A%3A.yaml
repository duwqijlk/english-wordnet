simpleMeaning: the opening at the back end of a gun's barrel (the long tube that a bullet goes through),
  where bullets are put in to be fired
scope: The opening at the back of a gun where bullets go in, not the front end of the gun and not a gap
  or break in something.
examples:
- He opened the breech and put in a new bullet.
- The soldier cleaned the breech of his rifle.
