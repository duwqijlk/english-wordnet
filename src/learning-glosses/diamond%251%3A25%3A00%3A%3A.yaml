simpleMeaning: a flat shape with four sides of the same length and corners that are not square
scope: A flat shape with four sides of the same length and corners that are not square, not a clear hard
  stone cut as a gem and not the part of a ball field inside the bases.
examples:
- The kite was cut in the shape of a diamond.
- Draw a diamond with four equal sides on the page.
