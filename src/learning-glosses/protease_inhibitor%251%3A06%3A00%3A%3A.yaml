senseId: 'protease_inhibitor%1:06:00::'
synsetId: 04020369-n
simpleMeaning: a drug against HIV that stops the virus from making copies of itself by fastening onto
  and blocking the HIV protein that cuts other proteins; often used with other drugs
scope: A drug that blocks HIV from copying itself, not a drug that kills the virus outright and not a
  vaccine.
examples:
- The protease inhibitor stopped HIV from copying itself in the test.
- Doctors gave her a protease inhibitor with two other drugs.
