simpleMeaning: a person who has paranoia, a state of mind in which a person wrongly fears that others
  want to harm them
scope: This is a person who has paranoia, not a word that describes a person who suffers from it.
examples:
- The paranoid believed his neighbours were watching him.
- She felt sorry for the paranoid who trusted no one.
