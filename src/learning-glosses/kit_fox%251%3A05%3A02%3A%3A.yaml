simpleMeaning: A small grey wild dog of the south-west of the United States; it may be a kind of Vulpes
  velox.
scope: A small grey wild dog of the south-western United States, not a red fox and not a pet dog kept
  in a home.
examples:
- A kit fox darted across the desert road at dusk.
- The kit fox lives in a burrow in the dry ground.
