simpleMeaning: A unit for measuring land, written in short as 'ha', equal to 100 ares (a small unit of
  land) or 10,000 square metres.
scope: A measure of land area, not a measure of length or weight.
examples:
- The farm covers fifty hectares of land.
- They bought ten hectares of woodland.
