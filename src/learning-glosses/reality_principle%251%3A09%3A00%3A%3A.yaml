senseId: 'reality_principle%1:09:00::'
synsetId: 05880720-n
simpleMeaning: The mind's own rule, in psychoanalysis, that a growing child must learn what the world
  is really like and bend what it wants to fit that world.
scope: In psychoanalysis, it is the rule of the ego that a growing child learns to live by once it knows
  the world as it is.
examples:
- The reality principle taught the child to wait for what it wanted.
- A child who follows the reality principle learns to put up with what the world gives.
