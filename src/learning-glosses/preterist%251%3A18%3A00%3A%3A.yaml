simpleMeaning: Already come true are the Bible's words about the last days, a person who studies God believes.
scope: This names the person who holds the belief, not the belief itself, and the belief is that the Bible's
  words about the last days have already come true.
examples:
- The preterist said the words about the last days had already come true.
- The preterist held that the last days had already come true.
