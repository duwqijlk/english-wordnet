simpleMeaning: One of a group of body chemicals that speed up moving a small part from a building block
  of the body to a different thing in the body.
scope: Aminopherase and aminotransferase are other names for one of a group of body chemicals that move
  a small part from a body building block to a different thing in the body.
examples:
- The transaminase moved the small part from one compound to another.
- Without transaminase, moving the small part from one building block to another would be slow.
