simpleMeaning: In informal or slang talk, not having a mind that works in the normal way
scope: Also called cracked, nuts, buggy, bats, crackers, daft, nutty, dotty, loopy, balmy, batty, wacky,
  bonkers, haywire, loony, barmy, loco and kooky. This is informal talk for a mind not working in the
  normal way, not the taste or smell of fruit.
examples:
- Do not mind his fruity talk; he often says strange things that make no sense.
- The old man got fruity and started shouting at people who were not there.
