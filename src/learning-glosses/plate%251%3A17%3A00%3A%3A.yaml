simpleMeaning: One of the huge rigid slabs of the Earth's outer shell that scientists believe move slowly.
scope: This is one of the huge moving slabs of the Earth's outer shell — crustal plate is another name
  — not a flat piece of metal and not a flat body part.
examples:
- The Pacific plate is moving slowly north-west.
- Most major earthquakes happen where two plates meet.
