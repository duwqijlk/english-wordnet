simpleMeaning: a speech that formally supports a motion put forward at a meeting.
scope: This sense is not a unit of time, a gear, a fight attendant, or flawed merchandise; it is a formal
  statement of support for a proposal.
examples:
- Her second was brief but persuasive.
- He rose to deliver a second to the motion.
