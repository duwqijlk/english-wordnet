simpleMeaning: A hormone made and released into the blood by the parathyroid glands; it controls the body's
  phosphorus and calcium and aids nerve and muscle activity and blood clotting.
scope: Another name for parathyroid hormone; it names the hormone itself, not the parathyroid glands that
  make it.
examples:
- The doctor measured her parathormone level after the operation.
- Parathormone helps keep the body's calcium in balance.
