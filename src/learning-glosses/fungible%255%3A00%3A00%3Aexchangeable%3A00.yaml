simpleMeaning: of goods or things for sale; able to be freely swapped for, or replaced by, another of
  the same kind to meet what must be paid or done
scope: This says goods can be swapped for other goods of the same kind; it is not the noun that names
  one such good itself.
examples:
- Money is fungible, because one ten-dollar note can replace another.
- These grain bags are fungible, so the buyer will take any bag of the same kind.
