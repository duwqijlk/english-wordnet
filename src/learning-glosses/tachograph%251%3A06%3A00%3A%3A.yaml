simpleMeaning: Over a trip in a motor vehicle, this gauge draws a line that shows how speed changes and
  how long the trip lasts.
scope: Fitted in a motor vehicle, this gauge keeps a drawn record of speed and trip length over time,
  unlike a dial that only shows the speed at one moment.
examples:
- The tachograph showed how fast the motor vehicle had gone on the trip.
- A tachograph writes down the speed and length of each trip.
