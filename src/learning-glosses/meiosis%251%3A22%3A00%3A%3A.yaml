simpleMeaning: 'In genetics, the cell division behind sexual reproduction: one nucleus becomes four, each
  with half the usual chromosomes, giving an animal''s eggs and sperm or a plant''s spores.'
scope: 'This is the genetics sense: a cell division that halves the chromosome count to make sex cells;
  miosis and reduction division are other names for the same process, while meiosis can also mean a figure
  of speech that says less than it means.'
examples:
- Meiosis produces eggs and sperm with half the normal number of chromosomes.
- In the diagram, meiosis begins with one cell and ends with four.
