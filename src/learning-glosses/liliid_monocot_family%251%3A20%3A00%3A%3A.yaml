simpleMeaning: A family of plants with one seed leaf, one branch, mostly soft plants whose flowers usually
  have outer leaves like petals and petals and a seed case of joined parts.
scope: A family of one-seed-leaf plants, not a genus and not a single plant.
examples:
- The liliid monocot family groups many herbs with petal-like flowers.
- Botanists place the lily in the liliid monocot family.
