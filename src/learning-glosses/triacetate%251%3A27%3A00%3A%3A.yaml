simpleMeaning: A man-made material from plant matter that burns rather slowly, used in place of celluloid
  for cinema film
scope: A man-made material that burns slowly, used in place of celluloid for cinema film, also called
  cellulose triacetate; not paper film and not glass plates.
examples:
- Old films were printed on triacetate instead of celluloid.
- The triacetate film base burns slowly.
