simpleMeaning: One field of work has its own rules and steps for asking questions and seeking answers,
  and in philosophy these are what is studied.
scope: Also called methodology, it studies the rules and steps of inquiry in one field, not the inquiry
  itself.
examples:
- In methodological analysis, the rules behind inquiry come first.
- Methodological analysis asks how questions are put and answers sought in one field.
