simpleMeaning: A sleep drug, sold as Nembutal, used to calm people, to bring sleep, and to stop sudden
  jerks of the body.
scope: A sleep drug sold as Nembutal that calms people, brings sleep and stops sudden jerks of the body,
  also called pentobarbital sodium, not a drug that wakes people up and not a pain drug.
examples:
- The doctor gave him pentobarbital to help him sleep.
- Pentobarbital calmed her before the small operation.
