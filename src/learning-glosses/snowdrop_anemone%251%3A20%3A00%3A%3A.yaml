simpleMeaning: A herb of Europe and Asia with single hanging sweet-smelling white flowers
scope: A herb of Europe and Asia with single hanging sweet-smelling white flowers; also called snowdrop
  windflower; not a tall garden flower with many blooms, and not a wild flower with pink petals.
examples:
- The snowdrop anemone nods its white flowers in spring.
- She planted snowdrop anemones along the woodland path.
