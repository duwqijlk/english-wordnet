senseId: 're-formation%1:04:00::'
synsetId: 00270807-n
simpleMeaning: Making a thing again, above all making it better or taking its faults away; making it new
  and putting it together again
scope: Making a thing again and making it better, also called regeneration; not a first making and not
  a small repair.
examples:
- The re-formation of the club brought in new members.
- After the war came the re-formation of the old town.
