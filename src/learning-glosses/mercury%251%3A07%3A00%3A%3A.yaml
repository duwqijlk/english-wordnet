simpleMeaning: a temperature reading taken from a thermometer filled with a silver liquid metal
scope: This is the temperature shown by a thermometer filled with a silver liquid metal; it is not the
  metal itself, and not the planet.
examples:
- The mercury was falling rapidly as night came on.
- By noon the mercury had climbed to thirty degrees.
