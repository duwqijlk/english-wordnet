simpleMeaning: Deep in the brain, a lens-shaped group of nerve cells has a pale yellow inner part
scope: The pale yellow inner part of the lens-shaped nucleus in the brain, also called paleostriatum and
  pallidum, not the outer part and not the whole brain.
examples:
- The globus pallidus lies deep inside the brain.
- Damage to the globus pallidus can affect movement.
