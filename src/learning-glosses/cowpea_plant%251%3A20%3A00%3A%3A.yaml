simpleMeaning: a low, wide living thing from the Old World that lives one year, grown most in the southern
  United States for food, animal feed, or to feed the soil
scope: Also called black-eyed pea and cowpea, this is the plant grown for food, to feed farm animals,
  and to dig into the soil to make it rich, not the bean eaten fresh or dried.
examples:
- They planted cowpea plants to feed the soil for next year's crop.
- A cowpea plant can cover a wide patch of ground by late summer.
