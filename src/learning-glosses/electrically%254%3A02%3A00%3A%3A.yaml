simpleMeaning: by using power that flows through wires to make lights and machines work
scope: This is about work done by power that flows through wires, not work done by hand. It is not about
  power in the mind or power over other people.
examples:
- The gate is electrically controlled and opens when you press the button.
- This car is electrically powered, so you charge it instead of filling it with petrol.
