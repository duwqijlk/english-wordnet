simpleMeaning: Other lenders keep their reserve funds here, while this government body puts out money,
  controls credit, and sells new government debt papers.
scope: This is the government body that puts out money, controls credit, and keeps other lenders' reserve
  funds.
examples:
- The central bank controls how much credit is on offer.
- Other lenders keep their reserves with the central bank.
