simpleMeaning: to change a text by leaving out or changing the parts that people think are rude
scope: 'Also called bowdlerise, castrate, expurgate and shorten: to change a text by leaving out rude
  parts, not to write a new text and not to cut a text short for length alone.'
examples:
- The publisher decided to bowdlerize the novel for young readers.
- She refused to bowdlerize the play, even the rude jokes.
