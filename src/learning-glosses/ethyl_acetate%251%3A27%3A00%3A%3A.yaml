senseId: 'ethyl_acetate%1:27:00::'
synsetId: 14875135-n
simpleMeaning: A fragrant, colorless ester, an acid-and-alcohol compound formed from ethanol and acetic
  acid; it evaporates quickly, burns easily, and is used for flavor, scent and dissolving plastics.
scope: This is the liquid solvent and flavoring compound; it is not ethanol, the drinking alcohol it is
  made from, nor acetic acid, the sour liquid in vinegar.
examples:
- She wiped the adhesive off the table with a little ethyl acetate.
- A fruity smell of ethyl acetate came from the bowl of candy.
