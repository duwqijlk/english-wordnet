simpleMeaning: A way a person spends their time that shows what they hold dear and how they think
scope: 'Also called a life style, a lifestyle and a modus vivendi: the way a person spends their time,
  not a single habit and not a job.'
examples:
- 'Her life-style is simple: she walks to work and cooks at home.'
- His life-style shows how much he cares about the sea.
