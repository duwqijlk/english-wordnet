simpleMeaning: A drug that eases pain and swelling, made without steroids
scope: This is a drug that eases pain and swelling, made without steroids; Orudis KT, Oruvail and ketoprofen
  are other names for this sense, and a drug that eases pain in other ways is a different kind.
examples:
- The doctor gave her Orudis for the swelling in her knee.
- Orudis eased the pain after the operation.
