simpleMeaning: in a way that follows fashion and looks good
scope: 'This tells how a person dresses or does something: in a way that follows fashion. It is more than
  being clean or neat; it is in fashion and good to look at.'
examples:
- She was dressed stylishly in a black coat and bright scarf.
- He stylishly turned the old room into a bright, modern space.
