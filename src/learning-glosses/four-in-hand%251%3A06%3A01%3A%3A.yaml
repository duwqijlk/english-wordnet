simpleMeaning: a long tie for the neck, tied in a knot that pulls loose, with one end hanging down in
  front of the other end
scope: A long necktie tied in a knot that pulls loose, not a bow tie and not a tie worn with a clip.
examples:
- He wore a four-in-hand with his grey suit.
- The four-in-hand hung down in front of his shirt.
