simpleMeaning: A perennial Eurasian herb smelling of tansy, with button-like yellow flowers; eaten as
  a cooked green or salad, sometimes used for potpourri, tea or flavoring, and sometimes placed in Chrysanthemum.
scope: Another name for the aromatic herb called balsam herb and bible leaf; not tansy itself, though
  it smells like it.
examples:
- She added a few alecost leaves to the salad.
- Alecost was once grown in herb gardens for its scent.
