simpleMeaning: Perfumes, medicines, and vanilla flavour all use these black seeds, shaped like small nuts
  and smelling sweet, from the tree that bears them.
scope: Also called coumara nut, these are black seeds from a tree, not the tree itself.
examples:
- The cook grated tonka bean into the cream for its sweet scent.
- Perfume makers prize tonka bean for its warm smell.
