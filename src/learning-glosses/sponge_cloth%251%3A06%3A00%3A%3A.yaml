simpleMeaning: any soft material with holes in it, especially one woven in a loose pattern of holes like
  a honeycomb
scope: Any soft material with holes in it, especially one woven in a loose pattern of holes; not a smooth
  cloth and not a sponge for washing.
examples:
- She wiped the table with a sponge cloth.
- The sponge cloth soaked up the spilled water.
