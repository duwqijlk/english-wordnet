simpleMeaning: to call someone by name over a loudspeaker or send a message to their small device.
scope: It is not turning the sheets of a book or the young ceremony helper; it means trying to reach a
  person with a call.
examples:
- They paged him over the store's loudspeaker.
- The nurse was paged during the emergency.
