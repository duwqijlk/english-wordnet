simpleMeaning: A compound of hydrogen and oxygen, at room temperature a clear colourless odourless tasteless
  liquid; it freezes below 0°C and boils above 100°C; widely used to dissolve other things.
scope: Also called water; the liquid made of hydrogen and oxygen, not ice and not steam.
examples:
- H2O is the chemical name for water.
- The bottle was full of H2O.
