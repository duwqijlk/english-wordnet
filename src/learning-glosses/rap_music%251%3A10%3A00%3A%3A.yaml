simpleMeaning: A style of African-American music from the 1980s and 1990s where rhyming words are chanted
  over a backing track; several forms have appeared.
scope: This is the music genre — 'rap' and 'hip-hop' are other names for it — not a knock or a criminal
  charge.
examples:
- She listens to rap music on her way to work.
- The radio station plays rap music all evening.
