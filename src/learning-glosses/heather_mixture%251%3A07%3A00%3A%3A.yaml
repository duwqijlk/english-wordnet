simpleMeaning: Soft grey shades with small spots of colour come from yarns of mixed colours woven together
scope: Also called heather, this is a mix of yarn colours, not the plant itself.
examples:
- Her sweater was made of heather mixture yarn.
- The heather mixture gave the cloth soft grey shades with flecks of colour.
