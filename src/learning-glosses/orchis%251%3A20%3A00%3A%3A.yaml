simpleMeaning: Upright spikes of flowers at the tips grow on any of many kinds of plant that lose their
  leaves, grow on land, and bear thick fleshy parts under the ground.
scope: Any of many kinds of plant with thick fleshy parts under the ground, not the male gland of the
  same name.
examples:
- The orchis grows on land and bears upright spikes of flowers.
- She dug up the orchis and found its thick fleshy parts under the ground.
