simpleMeaning: a knife used by doctors in operations, with a pointed blade that is sharp on both sides,
  used to make holes and small cuts
scope: This is the knife used by doctors in operations, not the long pointed rod used as a weapon and
  not the pointed tool used for catching fish.
examples:
- The doctor used a lance to open the small swelling on his arm.
- A lance lay on the tray next to the other tools for the operation.
