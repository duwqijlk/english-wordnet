senseId: 'surfeit%2:40:00::'
synsetId: 02338221-v
simpleMeaning: to give someone too much food or drink, or more of something than they want
scope: This is giving too much to someone else, not eating or enjoying too much yourself until you have
  had more than enough.
examples:
- The host surfeited his guests with rich food and wine.
- Do not surfeit the children with cake before dinner.
