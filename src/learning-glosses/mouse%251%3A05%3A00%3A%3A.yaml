simpleMeaning: A small rodent with a long thin body, small ears and a pointed nose; its long slender tail
  is usually bare, and it typically looks like a tiny rat.
scope: The animal, not the computer device you move with your hand, nor the bruise from a blow to the
  eye.
examples:
- A mouse ran across the kitchen floor and disappeared under the stove.
- The cat left a dead mouse on the doorstep.
