simpleMeaning: A light roof shaped like half a ball, made of flat-sided shapes that lock into each other,
  first made by R. Buckminster Fuller.
scope: A light roof shaped like half a ball, made of flat-sided shapes that lock into each other, not
  a solid dome of stone.
examples:
- The geodesic dome over the garden lets in the light all day.
- They built a geodesic dome from flat-sided shapes for the show.
