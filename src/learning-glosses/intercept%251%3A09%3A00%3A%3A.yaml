simpleMeaning: In mathematics, the point where a line crosses an axis, a line with numbers on it used
  to mark positions
scope: In mathematics, the point where a line crosses an axis, not the act of stopping something on its
  way and not any crossing of two lines.
examples:
- Find the intercept of the line on the vertical axis.
- The intercept tells you where the line meets the axis.
