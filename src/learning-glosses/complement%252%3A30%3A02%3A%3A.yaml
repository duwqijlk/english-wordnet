simpleMeaning: to add what is missing so that a thing is whole or as good as it can be
scope: To add what is missing so a thing is whole; not the grammar word that finishes a sentence and not
  a thing added to a meal.
examples:
- I need some pepper to complement the sweet touch in the soup.
- Her calm voice complements his quick temper.
