senseId: 'wayfaring_tree%1:20:00::'
synsetId: 12701413-n
simpleMeaning: A strong bush of Europe with a woody stem grows beside roads and paths, drops its leaves
  each year, and bears red berries that turn black.
scope: Also called twist wood and twistwood, this strong bush of Europe grows beside roads and paths and
  is known by red berries that turn black.
examples:
- A wayfaring tree grows beside the old road.
- The wayfaring tree by the path had berries turning black.
