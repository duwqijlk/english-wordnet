simpleMeaning: the part of a gunlock (the firing part of a gun) that hits a cap and makes it burst when
  the trigger is pulled
scope: Also called cock, this is the part of a gun that hits the cap, not the hand tool for nails and
  not the piano part.
examples:
- The hammer of the old gun fell and hit the cap.
- He pulled back the hammer before firing the gun.
