simpleMeaning: A strong pole standing straight up, whatever its purpose.
scope: This is a general-purpose sturdy upright pole, not the sail-carrying spar of a ship or the fallen
  nuts of forest trees.
examples:
- A tall flag mast stood beside the parade ground.
- The radio antenna was fixed to a steel mast on the roof.
