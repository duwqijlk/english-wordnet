synsetId: 01313640-a
simpleMeaning: not open and honest, and only seeming to be open and honest
scope: 'Another name for this sense is artful: seeming honest while hiding the truth. It does not mean
  simply clever or full of skill.'
examples:
- His disingenuous excuse hid the real reason he was late.
- She gave a disingenuous smile and said she knew nothing about it.
