simpleMeaning: a hard, bowl-shaped base of small leaf-like parts that holds the nut of an oak tree
scope: This is the hard, bowl-shaped base that holds the nut of an oak tree, also called a cupule; not
  the nut itself, and not the cap of another fruit.
examples:
- The acorn cup held the nut tight to the branch.
- A tiny acorn cup sat at the foot of each acorn on the oak.
