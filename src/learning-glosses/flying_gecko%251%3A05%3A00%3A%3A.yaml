simpleMeaning: Thin skin flaps along its body, legs and tail let this gecko glide for short distances.
scope: This gecko is also called a fringed gecko, and it glides on thin skin flaps along its body, legs
  and tail, not on wings.
examples:
- The flying gecko spread the skin flaps along its sides and glided through the air.
- A flying gecko glided for a short way through the air.
