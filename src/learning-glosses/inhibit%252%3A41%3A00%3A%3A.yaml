simpleMeaning: to hold back feelings, wants, urges, or actions on purpose and not let them show
scope: This is holding back feelings on purpose, also called suppress and bottle up; it is not making
  a person shy and unable to act in a natural way.
examples:
- She inhibited a smile and kept her face still.
- He inhibited his anger and spoke in a calm, quiet voice.
