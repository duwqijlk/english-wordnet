simpleMeaning: Stitching in which threads that run side by side are pulled out and the bare threads left
  are caught in bunches
scope: This is stitching in which threads that run side by side are pulled out and the bare threads left
  are caught in bunches, also called hemstitch, and not a plain stitch that joins two edges or stitching
  that makes a picture.
examples:
- Hemstitching decorates the edge of the cloth.
- She learned hemstitching from her grandmother.
