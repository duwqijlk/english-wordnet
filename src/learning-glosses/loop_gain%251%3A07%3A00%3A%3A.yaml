senseId: 'loop_gain%1:07:00::'
synsetId: 05118548-n
simpleMeaning: In telecommunication, the rise in strength of a set-up that feeds its output back into
  its input, as a measure of how much output is fed back.
scope: In telecommunication, this is the rise in strength of a set-up that feeds output back to input,
  not the rise in a set-up with no feedback and not the rise of one part alone.
examples:
- If the loop gain is too great, the system may start to swing back and forth.
- They raised the loop gain until the sound began to howl.
