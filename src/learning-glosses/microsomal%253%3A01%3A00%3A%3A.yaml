simpleMeaning: Of or relating to microsomes, tiny pieces that form from the inner parts of a cell.
scope: Of or relating to microsomes, tiny pieces that form from the inner parts of a cell; not the tiny
  pieces themselves, and not of or relating to cells in general.
examples:
- Microsomal enzymes in the liver break down many drugs.
- The microsomal fraction was spun out of the broken cells.
