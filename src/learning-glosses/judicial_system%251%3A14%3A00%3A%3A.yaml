simpleMeaning: All the law courts that give justice and form the judging arm of the state.
scope: All the law courts that give justice and form the judging arm of the state; judiciary, judicatory
  and judicature are other names for it, not the law-making arm and not the arm that carries laws out.
examples:
- The judicial system of the country dates back two hundred years.
- Reform of the judicial system took many years.
