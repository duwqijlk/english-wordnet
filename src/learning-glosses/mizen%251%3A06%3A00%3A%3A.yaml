simpleMeaning: The shorter mast at the back of a yawl, ketch, or dandy; on a bigger ship with three or
  more masts, the third mast back from the front.
scope: Also called mizzen, mizzenmast, and mizenmast; the third mast from the front of a ship with three
  or more masts, or the shorter mast at the back of a yawl, ketch, or dandy.
examples:
- On a ship with three masts, the mizen stands third from the bow.
- The crew raised the sail on the mizen.
