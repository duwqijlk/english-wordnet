simpleMeaning: In Chinese thought about the world, the bright, positive, male force, one of two opposite
  forces
scope: The bright, positive, male force in Chinese thought, not yin, its dark opposite force.
examples:
- In Chinese thought, yang is the bright force that pairs with yin.
- Yin and yang together produce everything that comes into existence.
