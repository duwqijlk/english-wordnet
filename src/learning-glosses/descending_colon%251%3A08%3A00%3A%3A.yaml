simpleMeaning: The part of the large gut that goes down from the crosswise gut to the S-shaped gut
scope: The part of the large gut that goes down from the crosswise gut to the S-shaped gut, not the part
  that rises and not the small gut.
examples:
- The descending colon runs down the left side of the belly.
- Food waste passes through the descending colon before the S-shaped gut.
