simpleMeaning: Any of many pale-colored butterflies with three pairs of full-grown legs.
scope: This is any of many pale-colored butterflies with three pairs of full-grown legs; pierid butterfly
  is another name for this sense, not a moth and not a butterfly with weak or missing legs.
examples:
- A pale pierid rested on the flower.
- Pierids are pale butterflies with three pairs of fully formed legs.
