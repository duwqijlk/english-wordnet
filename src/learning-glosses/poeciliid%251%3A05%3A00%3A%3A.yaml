simpleMeaning: Often used to keep down mosquitoes, these small fish of warm fresh or slightly salty water
  feed at the surface, usually brightly coloured, and bear live young.
scope: A poeciliid fish, a live-bearer and a topminnow are other names for this small bright fish that
  feeds at the surface of warm water and bears live young.
examples:
- A poeciliid swam near the surface of the warm water.
- Poeciliids were put in the pond to keep down mosquitoes.
