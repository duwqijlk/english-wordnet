simpleMeaning: To give a living thing a sore that spreads.
scope: To give a living thing a spreading sore, not the canker itself as a disease, an ulcer, or a malign
  influence, and not becoming infected with one.
examples:
- Disease cankered the old apple trees.
- The damp cankered the bark of the young trees.
