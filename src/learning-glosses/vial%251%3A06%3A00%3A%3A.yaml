simpleMeaning: a small bottle holding a drug, especially a sealed container free of germs, for giving
  medicine with a needle
scope: A small bottle that holds a drug, not a cup or a large jar.
examples:
- The nurse took a vial of medicine from the shelf.
- He broke the vial and the drug spilled out.
