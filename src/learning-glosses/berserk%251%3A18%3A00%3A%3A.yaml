simpleMeaning: One of the old Norse fighters known in stories for working themselves into wild anger before
  a fight and fighting in a mad, violent way with no care for danger
scope: 'Also called berserker: an old Norse fighter of this kind, not a person today who is wild with
  anger.'
examples:
- In the old story, a berserk fought alone against ten men.
- The berserks charged into battle shouting with fury.
