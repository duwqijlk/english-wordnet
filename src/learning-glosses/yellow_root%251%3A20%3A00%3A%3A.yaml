simpleMeaning: Big round leaves top a herb of the north-east of the United States that lives year after
  year, with a thick knotted gold stem under the ground.
scope: Also called goldenseal, golden seal and turmeric root, it is a herb of the north-east of the United
  States.
examples:
- Big round leaves mark yellow root above the ground.
- Under the ground, yellow root hides a thick knotted gold stem.
