simpleMeaning: to show you feel hurt or angry by what someone said or did, in the way you speak or act
scope: This means showing anger when you feel attacked, not the stiff hairs on a brush and not hair standing
  up or covering something thickly.
examples:
- He bristled at her suggestion that he had not checked his work.
- She bristled when I said her plan would not work.
