simpleMeaning: to become less clear to see, and little by little go from sight, or only seem to go
scope: 'Also called fade: to become hard to see and slowly go from sight, not to turn from a solid into
  a liquid and not to lose shape and mix in with what is around.'
examples:
- In the thick fog, the ship melted from view.
- The shapes in the mist melted away until we could not see them at all.
