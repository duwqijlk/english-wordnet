senseId: 'cockscomb%1:05:00::'
synsetId: 01794896-n
simpleMeaning: The soft red raised bit of flesh on top of the head of a farm hen or cock or a bird like
  them.
scope: This is the soft red raised bit of flesh on top of a farm bird's head; comb and coxcomb are other
  names for this sense, not a jester's cap and not a proud foolish man.
examples:
- The cockscomb stood bright red on the rooster's head.
- A hen's cockscomb drooped in the heat.
