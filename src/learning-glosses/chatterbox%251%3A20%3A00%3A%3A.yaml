simpleMeaning: an orchid growing by streams or ponds in western North America, with leafy stems and one
  greenish-brown and pinkish flower in the angle where each upper leaf meets the stem
scope: 'Also called giant helleborine and stream orchid: this is a plant, not a person who talks too much
  in a foolish, annoying way.'
examples:
- A chatterbox grew beside the stream, its stem full of leaves.
- We found a chatterbox by the pond, with one small flower at each upper leaf.
