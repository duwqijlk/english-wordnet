simpleMeaning: A part of the brain's outer layer is what shapes how the body moves
scope: 'Also called the excitable area, the motor area or the motor region: the part of the brain that
  shapes how the body moves, not the part that takes in what the senses feel and not the part that plans
  or thinks.'
examples:
- The doctor said the motor cortex was hurt in the fall.
- Signals from the motor cortex told her hand to close.
