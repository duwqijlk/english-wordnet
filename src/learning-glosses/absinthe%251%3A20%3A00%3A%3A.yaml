simpleMeaning: Bitter to the taste, this sweet-smelling herb of the mild lands of Europe and Asia and
  North Africa is used to make a strong drink.
scope: Also called common wormwood, lad's love, and old man, this sweet-smelling bitter herb of Europe
  and Asia and North Africa is used to make a strong drink, and it is not the drink itself.
examples:
- She grew absinthe for its bitter leaves.
- Absinthe gives the liqueur its bitter taste.
