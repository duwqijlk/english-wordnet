simpleMeaning: the hollow part of a musical instrument that makes its notes fuller, such as the body of
  a violin
scope: 'Also called body: the hollow part of an instrument that makes its notes fuller, not the strings
  and not the whole instrument.'
examples:
- The soundbox of her violin gave the notes a warm, full tone.
- A crack in the soundbox spoiled the guitar's voice.
