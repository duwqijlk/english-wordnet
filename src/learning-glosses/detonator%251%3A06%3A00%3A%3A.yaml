senseId: 'detonator%1:06:00::'
synsetId: 03186898-n
simpleMeaning: an explosive device worked by moving parts or by electricity, or a small amount of material
  that can explode; it can set off an explosive that breaks things apart
scope: Also called cap, and another name for it is detonating device. This is the small thing that sets
  off a bigger explosive, not the main explosive itself.
examples:
- The detonator set off the main charge.
- Workers checked the detonator carefully before the blast.
