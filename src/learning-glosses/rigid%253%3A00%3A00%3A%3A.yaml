senseId: 'rigid%3:00:00::'
synsetId: 01030336-a
simpleMeaning: used for an airship (a ship that flies) that keeps its shape with a hard frame that does
  not bend
scope: This sense is about a flying ship with a hard frame, not about a thing that will not bend, not
  about a person who will not change his ideas, and not about something that cannot change when things
  change.
examples:
- A rigid airship keeps its shape because of its inner frame.
- They built a rigid airship with a hard metal frame inside.
