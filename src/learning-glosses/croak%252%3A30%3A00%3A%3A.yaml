simpleMeaning: To stop living, so the body loses all it needs to keep going and stops working
scope: 'Also called die, go, pass, choke and exit: to stop living, not to make a hoarse sound and not
  to complain under one''s breath.'
examples:
- The old man croaked at the age of 102.
- Her grandmother croaked peacefully in her sleep.
