simpleMeaning: Said of a person tied to a piece of land, whose work passes to each new owner of the land.
scope: Said of a person tied to a piece of land, also called adscripted; not a free worker who can leave
  and not a person owned outright.
examples:
- An adscript serf could not leave the land he worked.
- The adscript family served each owner of the estate in turn.
