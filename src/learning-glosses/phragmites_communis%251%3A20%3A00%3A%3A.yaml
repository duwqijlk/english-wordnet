simpleMeaning: A tall North American reed with fairly wide leaves and large feather-like flower heads;
  it grows widely in wet places and is used for mats, screens and arrow shafts.
scope: A tall North American reed used for mats, screens and arrow shafts; also called carrizo, common
  reed, and ditch reed.
examples:
- Phragmites communis fringes the marsh with tall reeds.
- Phragmites communis gives stems for mats and screens.
