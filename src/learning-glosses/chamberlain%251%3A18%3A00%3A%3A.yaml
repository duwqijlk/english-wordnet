simpleMeaning: the person who looks after the money of a town or city group that runs local services
scope: The person who looks after the money for a town or city body; not the officer who runs the home
  of a king or a lord.
examples:
- The chamberlain presented the town's yearly money report.
- Our city chamberlain keeps a record of all payments.
