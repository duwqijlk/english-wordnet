simpleMeaning: a country dance from America for pairs of people, who start standing face to face in two
  lines
scope: This is the American dance in two lines, not the Scottish dance and not the music played for such
  a dance.
examples:
- The couples stood in two lines to dance the reel.
- At the hall, they formed two lines and began the reel.
