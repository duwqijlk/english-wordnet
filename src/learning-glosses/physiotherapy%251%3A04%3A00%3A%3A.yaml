simpleMeaning: Treatment that uses bodily means — exercise, rubbing the body, and other such ways.
scope: Treatment by bodily means such as exercise and massage, not treatment by drugs or surgery.
examples:
- Physiotherapy helped her walk again after the accident.
- He went for physiotherapy twice a week for his bad back.
