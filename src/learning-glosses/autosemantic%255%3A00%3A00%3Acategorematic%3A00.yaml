simpleMeaning: a word or short group of words that still has a clear sense on its own, with no other words
  around it
scope: A word or phrase that keeps its sense on its own, not a word that needs the words around it to
  make sense.
examples:
- The word 'dog' is autosemantic because it has a clear sense on its own.
- She wrote 'rain' as an autosemantic word that needs no other words to make sense.
