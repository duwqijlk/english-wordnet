simpleMeaning: a clump-forming evergreen plant that keeps shiny, round or heart-shaped leaves all year;
  they turn copper, maroon or purple in autumn, while tiny white flowers rise on upright spikes.
scope: Another name for the low evergreen plant also called galax, galaxy and coltsfoot, not the different
  coltsfoot whose yellow flowers open before its leaves.
examples:
- Beetleweed forms a glossy carpet that turns maroon in autumn.
- Beetleweed sends up spikes of tiny white flowers.
