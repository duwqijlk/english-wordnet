simpleMeaning: A cover that shields the wrist or arm in archery, fencing, and other sports.
scope: 'Also called bracer: a cover that shields the wrist or arm in archery, fencing, and other sports,
  not a glove and not a shield.'
examples:
- He wore an armguard on his left arm for the archery contest.
- The fencer's armguard kept her wrist safe.
