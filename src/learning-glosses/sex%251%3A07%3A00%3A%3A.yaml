senseId: 'sex%1:07:00::'
synsetId: 05014082-n
simpleMeaning: the things about a living thing that show whether it is male or female, based on the part
  it plays in making new life
scope: About the things that show if a living thing is male or female; not the male or female group itself,
  and not strong feelings about sex.
examples:
- In many birds, bright colours are a sign of the male sex.
- The sex of a plant can be seen in the parts it uses to make seeds.
