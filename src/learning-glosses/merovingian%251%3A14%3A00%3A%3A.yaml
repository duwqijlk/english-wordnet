simpleMeaning: A Frankish ruling house set up by Clovis I, that ruled Gaul and Germany from about 500
  to 750
scope: Also called the Merovingian dynasty; a Frankish ruling house of about 500 to 750, not a later French
  ruling house and not a single king.
examples:
- The Merovingian kings ruled Gaul for about 250 years.
- Clovis I founded the Merovingian dynasty.
