simpleMeaning: a curved piece under a thing that lets it rock back and forth
scope: A curved support that lets a thing rock, not a chair on rockers and not a young person in the 1960s
  who wore a leather jacket and rode a motorbike.
examples:
- The cradle sat on a rocker that moved with a soft creak.
- A rocker under the chair lets it sway gently.
