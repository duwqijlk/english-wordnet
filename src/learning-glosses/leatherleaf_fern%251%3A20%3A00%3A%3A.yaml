simpleMeaning: Its tough leaves are cut deep into narrow strips, and this plant is found far and wide
  in the warm south lands.
scope: Also called a leather fern and a ten-day fern, this plant of the warm south lands has tough leaves
  cut deep into narrow strips.
examples:
- A leatherleaf fern grew in the warm south lands.
- Its tough leaves, cut deep into narrow strips, marked it out as a leatherleaf fern.
