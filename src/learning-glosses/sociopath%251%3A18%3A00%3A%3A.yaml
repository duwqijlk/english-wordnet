simpleMeaning: a person with a mind that does not care about other people or their rights; 'psychopath'
  was once widely used, but this word is now used instead
scope: 'Also called psychopath: this names a person with this way of thinking and acting, not the problem
  itself and not a person who is cruel just once.'
examples:
- The court heard that the man was a sociopath who felt no shame for the harm he caused.
- She read about a sociopath who lied to people and never cared about their rights.
