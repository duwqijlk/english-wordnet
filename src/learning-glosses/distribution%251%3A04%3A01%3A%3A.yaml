synsetId: 01114977-n
simpleMeaning: The work of moving goods from those who make them to those who buy them, and selling them
  there.
scope: This is the work of moving goods from maker to buyer and selling them, not a set of values in numbers,
  not the way things are spread over a place, and not the plain act of giving things out.
examples:
- The firm handles the distribution of its goods across the country.
- Good distribution keeps the shops full.
