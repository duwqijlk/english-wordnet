simpleMeaning: Heard, not watched, this play comes over the air or on audio media such as tape or CD,
  made only of sound.
scope: Unlike a play that is watched, this is a play heard; audio drama, radio theater, and radio theatre
  are other names for it.
examples:
- We listened to a radio drama.
- The radio drama used only sound to tell its story.
