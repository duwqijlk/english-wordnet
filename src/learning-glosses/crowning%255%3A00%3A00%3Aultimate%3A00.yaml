simpleMeaning: being the greatest success that someone could reach
scope: This means the greatest success a person can reach, not a thing that sits at, or makes, the top
  part of something.
examples:
- Winning the prize was the crowning moment of her long working life.
- His crowning success came after thirty years of hard work.
