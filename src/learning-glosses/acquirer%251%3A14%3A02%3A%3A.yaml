simpleMeaning: A bank that takes in credit card payments for shops and pays the shops for credit card
  sales, keeping a small fee for the work.
scope: Merchant bank is another name for this sense, not a bank machine that gives out cash and not a
  shop itself.
examples:
- The shop's acquirer pays it for card sales each week.
- As acquirer, the bank takes a small fee from each sale.
