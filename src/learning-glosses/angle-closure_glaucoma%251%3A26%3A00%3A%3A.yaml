simpleMeaning: When the coloured ring blocks the flow of the clear liquid inside the eye, this sickness
  follows.
scope: Acute glaucoma and closed-angle glaucoma are other names for this eye sickness, in which the coloured
  ring blocks the flow of the clear liquid.
examples:
- Angle-closure glaucoma can build up pressure in a couple of days.
- The pressure rose in the eye when angle-closure glaucoma blocked the flow of liquid.
