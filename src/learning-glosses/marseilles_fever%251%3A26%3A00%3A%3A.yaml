simpleMeaning: An illness, common in India and round the Mediterranean Sea, brought on by a tiny germ
  carried to people by a red-brown tick that lives on dogs and other mammals.
scope: 'Also called boutonneuse fever, Indian tick fever and Kenya fever: an illness spread by a red-brown
  tick that lives on dogs, common in India and round the Mediterranean, not other tick-borne illnesses.'
examples:
- Marseilles fever is common in India and round the Mediterranean Sea.
- The dog tick gave him Marseilles fever, and he lay ill for days.
