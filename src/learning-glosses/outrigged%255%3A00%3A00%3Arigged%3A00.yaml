simpleMeaning: To stop a boat turning over, to hold an oar, or to help hold a mast, among other uses,
  it is fitted with a frame jutting from its side.
scope: It is a boat fitted with a frame jutting from its side, among other uses to stop it turning over,
  to hold an oar, or to help hold a mast.
examples:
- The outrigged boat kept its mast up.
- The outrigged boat did not turn over.
