simpleMeaning: A machine that prints whole lines, with the signs fixed on a turning round part that holds
  a full set of signs for each place on the line.
scope: A machine that prints whole lines, with the signs fixed on a turning round part, not a machine
  that prints one letter at a time and not a copier.
examples:
- The office used a drum printer for its reports.
- A drum printer prints a whole line at once.
