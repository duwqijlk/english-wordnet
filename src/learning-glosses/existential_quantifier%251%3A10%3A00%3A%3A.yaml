simpleMeaning: A mark in logic that says a claim is true for at least one thing.
scope: A mark in logic that says a claim is true for at least one thing, also called existential operator;
  not a mark that says a claim is true for all things and not a word of plain speech.
examples:
- The existential quantifier at the start says that some number fits.
- Use an existential quantifier when one true case is enough.
