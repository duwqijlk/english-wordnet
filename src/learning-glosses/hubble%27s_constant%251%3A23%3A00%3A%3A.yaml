simpleMeaning: In cosmology, how fast a galaxy moves away, as the universe grows, divided by its distance
  from us; not truly fixed, it measures how fast the universe grows today.
scope: A number in cosmology about the growing universe, also called Hubble's parameter, the Hubble constant,
  and the Hubble parameter; not a fixed number in nature and not a speed.
examples:
- Hubble's constant links a galaxy's speed to its distance.
- Astronomers use Hubble's constant to date the universe.
