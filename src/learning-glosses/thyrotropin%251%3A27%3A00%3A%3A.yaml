scope: This is a messenger made by the front of the small gland under the brain that spurs the neck gland
  into action, also called thyroid-stimulating hormone, thyrotrophic hormone, thyrotrophin and thyrotropic
  hormone; not a messenger from another gland and not a drug for the neck gland.
examples:
