simpleMeaning: words put together in a clever or odd way that makes people laugh
scope: 'Also called humor and wit: a message that makes people laugh, not a passing mood, and not the
  old idea of a fluid in the body.'
examples:
- His speech was full of humour that had the whole room laughing.
- She told a joke full of dry humour.
