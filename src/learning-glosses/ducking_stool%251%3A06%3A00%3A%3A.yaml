simpleMeaning: A chair used as a punishment, in which wrongdoers were lowered into water.
scope: A chair used as a punishment, in which wrongdoers were lowered into water; cucking stool is another
  name for this sense, not a prison cell and not a fine.
examples:
- The ducking stool stood by the pond.
- Offenders were tied to the ducking stool and lowered into the water.
