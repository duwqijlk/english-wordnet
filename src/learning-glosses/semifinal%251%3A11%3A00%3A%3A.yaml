simpleMeaning: one of the two games in the round just before the final, in a contest where the loser of
  each game is out
scope: One of the two games just before the final, also called a semi; not the final itself and not an
  early round of the contest.
examples:
- Our team won the semifinal and will play in the final on Sunday.
- She lost the semifinal in a close game against the champion.
