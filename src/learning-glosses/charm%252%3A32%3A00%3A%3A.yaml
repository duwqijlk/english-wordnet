simpleMeaning: to get someone to do something by being pleasing and friendly in a way that wins them over
scope: 'Also called influence, and another name for this sense is tempt: this is winning someone over
  so they act, not controlling someone by magic and not a pleasing quality a person has.'
examples:
- She charmed him into lending her the car.
- He charmed the manager into giving him a second chance.
