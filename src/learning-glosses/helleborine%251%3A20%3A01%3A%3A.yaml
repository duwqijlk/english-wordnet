simpleMeaning: Any of several orchids of the Cephalanthera kind.
scope: This sense is any of several orchids of the Cephalanthera kind, unlike the sense for any of the
  small mild- and warm-climate orchids, with mottled or striped leaves, and spikes of small yellowish-white
  flowers in a twisted cluster, and unlike the sense for Epipactis orchids, of various sorts.
examples:
- Helleborines are orchids of the Cephalanthera kind.
- The helleborine is an orchid.
