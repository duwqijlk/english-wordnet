simpleMeaning: To bat from the right side when the pitcher throws with the left hand, and from the left
  side when the pitcher throws with the right hand.
scope: This is about how a batter stands at the plate, not about pitching and not about batting from one
  side only.
examples:
- He can switch-hit against any pitcher.
- She learned to switch-hit in her second season.
