simpleMeaning: the answer a person charged with a crime gives in court, saying the charges against them
  are not true
scope: 'Also called defense, and another name for it is denial: the accused person''s formal answer in
  court, not the lawyers who speak for them and not the act of guarding against attack.'
examples:
- His defence was that he had been at home all evening.
- The defence argued that the charges were not true.
