simpleMeaning: A drug that weakly stops a protein-cutting enzyme, sold as Invirase, and used to treat
  HIV.
scope: A weak drug that blocks a protein-cutting enzyme, used for HIV; not a strong drug of the same kind
  and not a drug that kills the virus outright.
examples:
- The doctor gave saquinavir as part of his HIV treatment.
- Saquinavir is taken with other HIV drugs.
