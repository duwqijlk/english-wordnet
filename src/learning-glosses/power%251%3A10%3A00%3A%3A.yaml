simpleMeaning: A written number or symbol showing how many times a quantity is multiplied by itself.
scope: This is mathematical notation, not an influential person, businessperson, or country.
examples:
- In the expression 2³, the power shows that 2 is multiplied by itself three times.
- The small 4 written above the 10 is the power.
