simpleMeaning: In large shallow ponds, sunlight, germs, and green growth in the liquid work together to
  clean dirty liquid.
scope: Also called oxidation pond and stabilization pond, these are large shallow ponds where sunlight,
  germs, and green growth in the liquid work together to clean dirty liquid.
examples:
- The water stabilization lagoon cleaned the dirty liquid.
- We saw a water stabilization lagoon at work in the sun.
