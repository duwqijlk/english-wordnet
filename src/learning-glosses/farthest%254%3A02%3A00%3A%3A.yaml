simpleMeaning: To the greatest distance away, in space or time, this word being used more often than furthest
  here.
scope: This is about the greatest distance in space or time, not the greatest degree or the most advanced
  stage of a thing.
examples:
- See who could jump the farthest.
- He chose the farthest seat from the door.
