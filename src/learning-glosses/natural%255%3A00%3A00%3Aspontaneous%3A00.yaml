simpleMeaning: done without stopping to think, driven by instinct or by something that works like instinct
scope: This describes behaviour that comes without thought, not raw goods that are unprocessed and not
  a person's inborn talent.
examples:
- Catching the falling glass was a natural reflex; her hand moved before she had time to think.
- Digging is natural to a terrier, and no one has to teach it.
