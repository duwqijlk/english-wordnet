simpleMeaning: Act in defence of a cause, a rule about right and wrong, or a belief you hold.
scope: To stand by a cause, a rule about right and wrong, or a belief; not to keep a law or a court decision
  in force.
examples:
- He upholds the cause of free speech.
- They uphold the ideals of their school.
