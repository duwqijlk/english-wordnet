simpleMeaning: A way of counting by place that uses sixteen marks and sixteen as its base
scope: This is a way of counting by place that uses sixteen marks and sixteen as its base, also called
  hexadecimal system and sexadecimal number system, and not a way of counting by place that uses ten marks
  and ten as its base.
examples:
- The hexadecimal number system uses sixteen as its base.
- Computers often use the hexadecimal number system.
