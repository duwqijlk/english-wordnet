simpleMeaning: behavior that shows no respect for God or holy things; also, the act of taking away the
  holy character of a thing or place
scope: 'Also called blasphemy, desecration and profanation: this is bad treatment of holy things, not
  just rude behavior with no link to God or holy things.'
examples:
- Stealing from the church was seen as sacrilege.
- For many people, burning a holy book is sacrilege.
