simpleMeaning: a hollow part inside the body that has grown wider or swollen out
scope: 'Also called ectasis: a hollow part inside the body that has grown wider or swollen out, not a
  part that has shrunk and not a lump on the skin.'
examples:
- The scan showed ectasia in the blood vessel.
- The doctor found ectasia of the gullet after the scan.
