simpleMeaning: One of several kinds in the group Crepis, it grows long leafy stems that split into branches,
  with loose heads of yellow flowers, in the Northern Hemisphere.
scope: Also called hawk's-beard, it is one of several kinds in the group Crepis, and hawkweed is a different
  plant.
examples:
- We found hawk's-beards with loose heads of yellow flowers on long leafy stems.
- The hawk's-beards opened their loose heads of yellow flowers.
