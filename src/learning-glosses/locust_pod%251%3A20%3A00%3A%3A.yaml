simpleMeaning: Farm animals are fed on the sweet flesh and small seeds inside this long case, and people
  turn it into a thing that stands in for chocolate.
scope: Also called carob, algarroba, algarroba bean, carob bean, and locust bean, this long case holds
  the sweet flesh that feeds farm animals and stands in for chocolate.
examples:
- He fed the locust pods to the goats.
- She cracked a locust pod and tasted the sweet pulp.
