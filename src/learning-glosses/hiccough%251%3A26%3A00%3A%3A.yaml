simpleMeaning: A bout of automatic spasms of the muscle sheet under the lungs, with the throat snapping
  shut to make a sound; the word is usually plural and sometimes signals indigestion.
scope: The bout of automatic spasms that makes the sound, not a minor problem or delay; hiccup is the
  usual spelling of this same word.
examples:
- He drank the fizzy lemonade too fast and got the hiccoughs.
- A fit of the hiccoughs kept her awake half the night.
