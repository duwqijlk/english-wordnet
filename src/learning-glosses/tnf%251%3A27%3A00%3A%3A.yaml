simpleMeaning: A chemical made by white blood cells of two kinds that stirs up swelling and can kill tumour
  cells, but also causes swelling, as in the joint disease rheumatoid arthritis
scope: 'Also called tumor necrosis factor or tumour necrosis factor: a chemical made by white blood cells
  that stirs up swelling and can kill tumour cells, but also causes swelling, as in the joint disease
  rheumatoid arthritis.'
examples:
- TNF levels rise when the body fights an infection.
- The drug blocks TNF to ease the swelling in her joints.
