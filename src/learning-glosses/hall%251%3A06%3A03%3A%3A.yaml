simpleMeaning: A passage inside a building that other rooms open onto.
scope: This is not a large room for gatherings; it is the narrow way inside a building that connects the
  rooms.
examples:
- He walked down the hall to the bathroom.
- Their coats were hanging in the hall by the front door.
