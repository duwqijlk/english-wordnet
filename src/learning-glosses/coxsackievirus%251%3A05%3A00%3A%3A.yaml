simpleMeaning: A gut virus that causes a sickness much like polio, but without the loss of movement
scope: This is a gut virus that causes a sickness much like polio, but without the loss of movement; not
  polio itself, and not a cold virus that gives a runny nose.
examples:
- The child caught coxsackievirus at nursery school.
- The coxsackievirus illness was much like polio, but it did not leave him unable to move.
