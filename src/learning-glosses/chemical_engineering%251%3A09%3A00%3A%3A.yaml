simpleMeaning: the work of planning, building and running the works and machines used to make stuff by
  changing what things are made of on a large scale
scope: The work of planning, building and running the works and machines that make stuff by changing what
  things are made of on a large scale, not the making of the stuff itself and not other kinds of making
  things.
examples:
- She studied chemical engineering at university.
- His firm does chemical engineering for a paint plant.
