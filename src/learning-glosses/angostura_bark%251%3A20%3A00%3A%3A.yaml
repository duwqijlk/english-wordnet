simpleMeaning: A bitter outer cover, used for cures, sweet strong drinks, and bitter drinks, comes from
  a South American tree.
scope: Also called angostura, this is the bitter outer cover of a South American tree used for cures and
  drinks.
examples:
- Angostura bark from a South American tree went into the bitter drink.
- The angostura bark gave the cure its bitter taste.
