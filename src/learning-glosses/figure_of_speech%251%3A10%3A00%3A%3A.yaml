simpleMeaning: a way of using words so they mean something other than their plain sense
scope: A way of using words so they mean something other than their plain sense, with figure as another
  name for this; not plain words and not a grammar rule.
examples:
- Saying 'it's raining cats and dogs' is a figure of speech.
- The poem is full of figures of speech.
