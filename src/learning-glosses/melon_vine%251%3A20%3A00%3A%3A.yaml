simpleMeaning: A trailing plant of the gourd family bears several kinds of fruit, cucumbers among them.
scope: Also called melon, it is the fruit of a gourd-family vine, not the vine itself.
examples:
- They picked a melon vine fruit from the trailing plant.
- A melon vine fruit grew beside the cucumbers.
