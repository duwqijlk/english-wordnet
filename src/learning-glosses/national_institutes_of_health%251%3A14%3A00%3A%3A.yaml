simpleMeaning: An agency in the health and human services department that uses science to seek knowledge
  and improve human health, and is the main medical research agency of the federal government
scope: Also called the NIH; the main medical research agency of the United States government, whose nearest
  rivals are the National Academy of Sciences and other federal research bodies.
examples:
- The National Institutes of Health funds medical research across the country.
- A scientist at the National Institutes of Health studies how the body fights disease.
