simpleMeaning: A way of drawing a map of the earth on a cylinder, so places look bigger the farther they
  are from the equator
scope: 'Also called Mercator''s projection: a way of drawing a map of the earth on a cylinder, so places
  look bigger the farther they are from the equator; other map drawings show the size of places in a different
  way.'
examples:
- Mercator projection makes Greenland look very large.
- Sailors used Mercator projection for navigation.
