simpleMeaning: a tool with a mesh screen used in gardening to take big unwanted bits out of earth
scope: Also called dirt sifter; a gardening tool that takes big unwanted bits out of earth, not a tool
  for grinding or mixing earth, and not a kitchen sieve for flour.
examples:
- She used the soil sifter to clear stones from the garden earth.
- The soil sifter left only fine earth for the seed trays.
