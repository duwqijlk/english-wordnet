schema: oewn-learning-gloss-v2
senseId: 'distinguish%2:31:02::'
synsetId: 00653662-v
simpleMeaning: to be the quality or part that makes a person or thing different from others, sometimes
  in a very good way
scope: This sense, also called mark and differentiate, is about the quality that sets a person or thing
  apart, not about telling which type a plant or animal is.
examples:
- His calm voice distinguishes him from the other teachers.
- A red roof distinguishes the house from all the others on the street.
