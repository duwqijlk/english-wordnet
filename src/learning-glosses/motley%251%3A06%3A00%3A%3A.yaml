simpleMeaning: a wool cloth of many colours, woven from mixed threads, made in England in the 14th to
  17th centuries
scope: A many-coloured wool cloth from old England; not a garment made from it, and not a mixed group
  of things.
examples:
- She bought a length of motley to make a cloak.
- Motley was woven from threads of many colours.
