simpleMeaning: 'Of a leaf shape: a leaf whose small leaf parts are themselves split into still smaller
  parts, as in ferns.'
scope: A leaf shape in which the small leaf parts are split again; not a leaf split only once and not
  a whole leaf with no splits.
examples:
- The bipinnate fronds of the fern spread wide.
- A bipinnate leaf looks twice split, with tiny parts along each side.
