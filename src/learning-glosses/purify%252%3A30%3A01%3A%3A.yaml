simpleMeaning: to make someone free from sin (wrong acts against God) and from guilt (the bad feeling
  after doing wrong)
scope: This sense is about making a person free from wrong acts, also called purge and sanctify; it is
  not about cleaning water or a liquid, and not about a person becoming free on their own.
examples:
- The priest prayed to purify the man's soul after his wrong acts.
- They believe this rite can purify people and wash away their sins.
