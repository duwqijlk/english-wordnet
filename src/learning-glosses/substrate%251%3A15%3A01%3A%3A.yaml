simpleMeaning: A surface that a living thing grows on or clings to.
scope: This is the growing surface for a living thing; not a language whose sounds pass into a new tongue,
  not the stuff an enzyme works on, and not a layer lying underneath another.
examples:
- Moss needs a damp substrate to grow on.
- The plant took hold on its substrate and spread fast.
