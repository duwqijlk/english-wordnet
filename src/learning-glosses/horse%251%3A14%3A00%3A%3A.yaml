simpleMeaning: soldiers trained to do battle while riding animals
scope: This is the collective term for mounted troops, not the animal itself, a padded gymnastic apparatus,
  a chess piece, a frame for holding wood, or the verb meaning to supply someone with animals.
examples:
- Five hundred horse led the attack.
- A thousand horse advanced across the plain at dawn.
