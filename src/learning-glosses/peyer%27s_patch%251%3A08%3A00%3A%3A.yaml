simpleMeaning: Any of a set of small round bits of body tissue in the walls of the gut, near where the
  small gut meets the large gut.
scope: Also called Peter's gland; one of the small round bits of body tissue in the gut wall, set apart
  from other gut tissue by its place near the meeting of the small and large gut.
examples:
- The doctor pointed to a Peyer's patch in the wall of the gut.
- The Peyer's patches were swollen after the infection.
