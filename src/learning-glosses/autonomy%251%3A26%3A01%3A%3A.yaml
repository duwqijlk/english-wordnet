simpleMeaning: the right of a people to run its own affairs, safe from a higher power that does what it
  pleases with no fair reason given
scope: 'Also called liberty: the freedom of a people to govern itself, not personal freedom to make one''s
  own choices and not mere freedom from one ruler.'
examples:
- The region won its autonomy after years of struggle.
- The new charter protects the island's autonomy from outside interference.
