simpleMeaning: in loose, everyday talk, describes a person whose mind does not work in a normal way
scope: 'Also called cracked, nuts, buggy, bats, crackers, daft, nutty, dotty, loopy, fruity, balmy, batty,
  bonkers, haywire, loony, barmy, loco and kooky: this is a loose, everyday word for a mind that does
  not work in a normal way, not a formal word used by a doctor.'
examples:
- The old man in the film acts wacky, as if his mind does not work in a normal way.
- People called him wacky because he heard voices and saw things that were not there.
