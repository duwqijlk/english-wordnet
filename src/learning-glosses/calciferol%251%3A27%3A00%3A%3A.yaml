simpleMeaning: a vitamin that dissolves in fat and stops rickets, a bone illness in children that makes
  bones soft and bent
scope: 'Another name for this is cholecalciferol and ergocalciferol: a vitamin that stops rickets, not
  a vitamin that helps the eyes see and not a drug that mends broken bones.'
examples:
- The doctor gave the child calciferol to stop rickets.
- Milk with calciferol helps keep young bones strong.
