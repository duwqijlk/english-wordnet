simpleMeaning: A lens-shaped knot of nerve cells has this pale yellow part on its inside
scope: 'Also called pallidum and globus pallidus: the inner pale yellow part of the lens-shaped knot of
  nerve cells, not the outer part and not the tail-shaped knot beside it.'
examples:
- The paleostriatum lies inside the lenticular nucleus.
- Cells of the paleostriatum send signals to other parts of the brain.
