simpleMeaning: a feeling in the body like many small sharp pricks
scope: This body feeling is also called tingling and prickling. It is not the feeling of fear that is
  almost nice, and not the verb that means to cause this feeling.
examples:
- A tingle ran down her arm after she hit her elbow.
- He felt a tingle in his feet as the blood came back.
