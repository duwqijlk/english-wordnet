simpleMeaning: Air lifts the front of its bed, and the load slides out by its own weight, so this motor
  vehicle tips its load out by itself
scope: It is also called tipper, dump truck, tip truck, tipper lorry, and tipper truck, a motor vehicle
  that empties its load by lifting the front of its bed, not a vehicle that must be unloaded by hand.
examples:
- The dumper tipped its load out by itself.
- The dumper's bed was raised by air, and the load slid out.
