senseId: 'majority_operation%1:22:00::'
synsetId: 13531841-n
simpleMeaning: A cut-off rule takes numbers that are 0 or 1, and gives 1 as the answer exactly when more
  than half of the numbers put in are 1
scope: This is a cut-off rule for numbers that are 0 or 1, not a vote by a group of people and not a plain
  sum of the numbers put in.
examples:
- A majority operation gives 1 when most of the inputs are 1.
- The circuit uses a majority operation to decide the output.
