simpleMeaning: A broad cover wraps round a spike where small blooms sit in a tight bunch, on one of the
  plants of the family Araceae.
scope: Aroid is another name for this plant, which is not the starch got from its root.
examples:
- We found an arum with a spike of small blooms.
- The arum's big leaf-like cover opened round the spike.
