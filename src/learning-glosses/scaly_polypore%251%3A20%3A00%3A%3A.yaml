simpleMeaning: a fungus with a side stalk, when it has one, and a top covered in scales that turns almost
  black as it grows old; found across the Northern Hemisphere
scope: A fungus with a side stalk and a scaly cap that darkens with age, found across the Northern Hemisphere;
  not a fungus with a stalk in the middle.
examples:
- The scaly polypore grows on the dead oak trunk.
- We found a scaly polypore with a cap nearly black.
