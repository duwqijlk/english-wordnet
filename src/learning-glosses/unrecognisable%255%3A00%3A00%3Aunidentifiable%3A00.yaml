simpleMeaning: So changed or damaged that no one can tell what or who it is.
scope: So changed or damaged that it cannot be known, also called unrecognizable; not a way of doing something
  so that it cannot be known.
examples:
- After the fire, the old house was unrecognisable.
- His face was unrecognisable after the accident.
