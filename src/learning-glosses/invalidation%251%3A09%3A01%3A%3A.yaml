simpleMeaning: Other people push a person's thoughts and feelings aside, call them wrong, or simply do
  not hear them
scope: Other people push a person's thoughts and feelings aside, call them wrong, or do not hear them;
  not a formal legal act that ends a relationship or a court case.
examples:
- His constant invalidation of her feelings left her afraid to speak up.
- The therapist explained that invalidation can make a child doubt their own thoughts.
