simpleMeaning: The referee stops a boxing match and gives the win to the other boxer when one boxer cannot
  go on
scope: A win given when the referee stops a boxing match because one boxer cannot go on; not a win on
  points and not a win after a knockdown count.
examples:
- The referee called a technical knockout in the third round.
- He won by technical knockout when his rival could not go on.
