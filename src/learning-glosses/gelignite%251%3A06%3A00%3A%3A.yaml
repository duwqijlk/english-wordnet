simpleMeaning: Wood pulp mixed with sodium or potassium nitrate takes in a strong blasting liquid, making
  this kind of dynamite.
scope: Also called gelly, this names the dynamite made by soaking a blasting liquid into wood pulp mixed
  with sodium or potassium nitrate.
examples:
- The workers used gelignite to blast the rock.
- A stick of gelignite blew a hole in the cliff.
