simpleMeaning: The electromagnetic waves a theoretical perfect absorber would emit; how its spectrum distributes
  energy rests on temperature alone, following Planck's radiation law.
scope: Another spelling of black-body radiation, the glow of an ideal perfect absorber; not the absorber
  itself.
examples:
- The spectrum matches blackbody radiation at about 5,800 kelvin.
- His lecture explained how blackbody radiation led Planck to quantum theory.
