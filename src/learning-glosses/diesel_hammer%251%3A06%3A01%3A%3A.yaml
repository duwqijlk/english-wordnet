simpleMeaning: a large machine for driving posts into the ground, built around a big oil-burning engine
  that works in two strokes
scope: A large machine that drives posts into the ground, also called a diesel pile hammer, and not a
  hand tool for hitting nails and not a machine that lifts posts out of the ground.
examples:
- The crew brought a diesel hammer to the site to drive the posts.
- A diesel hammer shook the ground as it drove each post down.
