simpleMeaning: To do with the first part of that long stretch of time in the earth's past.
scope: This word is used for the first part of that long stretch of time in the earth's past, not for
  a later part of it.
examples:
- Triassic rocks lie under the later layers of stone.
- The Triassic period was the first part of that long stretch of time in the earth's past.
