simpleMeaning: to make a line of small curves or round dents in something
scope: Making small curves or dents in the surface of something, such as meat; not cutting an edge into
  curves, and not catching the sea animal with this name.
examples:
- Scallop the meat with the back of a spoon before you cook it.
- She scalloped the soft clay with her thumb.
