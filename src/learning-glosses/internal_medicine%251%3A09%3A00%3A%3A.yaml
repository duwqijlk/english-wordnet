simpleMeaning: Doctors in this part of healing find and treat, without cutting, the ills of the organs
  inside the body, above all in grown people
scope: Also called general medicine, this is the part of healing for the ills of the body's inner organs,
  treated without cutting, above all in grown people.
examples:
- They chose internal medicine as their field of healing.
- Internal medicine found the cause of the illness in the organs inside the body.
