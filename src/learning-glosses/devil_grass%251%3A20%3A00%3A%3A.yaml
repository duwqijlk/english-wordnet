simpleMeaning: Lawns and grazing land use this trailing grass from Europe, now found all over warm lands,
  above all in the southern United States and India
scope: Doob, kweek, scutch grass, and star grass are other names for this trailing grass from Europe,
  now found in warm lands and used for lawns and grazing land.
examples:
- Devil grass spreads over the lawn.
- The devil grass came from Europe and now grows in warm lands.
