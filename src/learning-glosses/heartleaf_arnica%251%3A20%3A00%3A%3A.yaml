simpleMeaning: In high mountains west of the Rockies from Alaska to southern California, a wild flower
  grows broad yellow flower heads and leaves shaped with a point and two round lobes.
scope: It grows as a wild flower in high mountains west of the Rockies from Alaska to southern California.
examples:
- Heartleaf arnica grew in the high mountains west of the Rockies.
- The heartleaf arnica showed broad yellow flower heads above its pointed leaves.
