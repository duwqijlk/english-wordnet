senseId: 'x-ray_photograph%1:06:00::'
synsetId: 04107714-n
simpleMeaning: An image made by passing a kind of invisible light through the body onto film, used by
  doctors to look inside the body.
scope: Also called a roentgenogram, an X-ray, an X-ray picture or an X ray; an image made by passing invisible
  light through the body onto film, not the invisible light itself or a drawing of the body.
examples:
- The X-ray photograph showed a crack in the bone.
- She held up the X-ray photograph for the doctor.
