simpleMeaning: A shape that forms where two parts are joined.
scope: The form of the join itself, such as a Y-shaped junction, not a separate connector piece such as
  a pipe or coupling, not the state of being joined, and not an influential person you know.
examples:
- The connection between the pipes forms a smooth Y-shape.
- The drawing shows the connection as a wide V where the beams meet.
