simpleMeaning: In law, property set aside for a woman about to marry, as her marriage settlement instead
  of a widow's share of her husband's land
scope: In law, property set aside for a bride-to-be; jointure is another name for this sense, not a dowry
  brought by her family and not a widow's dower.
examples:
- The legal jointure gave her a house and land for life.
- Her legal jointure was settled before the wedding.
