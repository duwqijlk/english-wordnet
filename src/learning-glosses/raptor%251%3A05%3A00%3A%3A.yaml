simpleMeaning: any of many birds that eat meat and hunt and kill other animals
scope: A bird that hunts and kills other animals to eat, not any animal that eats meat and not a bird
  that eats only plants.
examples:
- The raptor flew over the field and caught a small mouse.
- Eagles and hawks are raptors that hunt in the day.
