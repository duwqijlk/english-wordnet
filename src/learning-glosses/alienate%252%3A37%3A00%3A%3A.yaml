simpleMeaning: to make someone who once loved you or liked you become cold or unfriendly toward you
scope: To turn a person who once cared for you against you, so they grow cold or hostile; not simply to
  make someone feel cut off and alone.
examples:
- Her harsh words alienated the friends who had once loved her.
- He alienated his family by treating them with cold indifference.
