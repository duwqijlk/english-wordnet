simpleMeaning: A fierce sea creature from warm seas, with a beak like a bird of prey, hunted for food
  and for the finest shell plates.
scope: This is a fierce sea creature from warm seas with a beak like a bird of prey, hunted for food and
  shell plates, not a land turtle; also called hawksbill, hawkbill, and tortoiseshell turtle.
examples:
- The hawksbill turtle swam through the warm water.
- Fishermen once hunted the hawksbill turtle for its shell.
