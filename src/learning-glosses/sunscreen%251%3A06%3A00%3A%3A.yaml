simpleMeaning: A cream you put on skin, with a chemical that blocks ultraviolet light (harmful light from
  the sun that you cannot see) and so helps stop sunburn
scope: This cream is also called sunblock and sun blocker. It is put on skin to keep it safe in the sun,
  not a shade or clothes that cover the skin.
examples:
- She put sunscreen on her arms before going to the beach.
- He uses sunscreen every day to stop his skin from burning in the sun.
