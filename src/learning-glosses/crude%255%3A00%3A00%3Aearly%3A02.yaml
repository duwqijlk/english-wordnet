simpleMeaning: Belonging to the first stages of technical development, plain and often roughly made.
scope: This is about early, simple technology, not unprocessed material such as oil and not something
  made without care.
examples:
- The first crude telescopes could barely show the moons of Jupiter.
- They built a crude bridge from logs and rope.
