simpleMeaning: a false set of teeth made to take the place of missing ones
scope: The dental fitting that replaces lost teeth (also called a denture or a dental plate), not a dinner
  dish or a flat part of the body.
examples:
- The dentist made a plate to fill the gap left by two missing teeth.
- He takes his plate out every night and cleans it.
