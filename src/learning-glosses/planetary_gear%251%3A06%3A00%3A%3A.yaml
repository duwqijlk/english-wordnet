simpleMeaning: An outer toothed disc that turns around a middle disc in a set of discs that turn around
  one another.
scope: An outer toothed wheel that turns around a middle wheel in a set of wheels that turn around one
  another; epicyclic gear, planet gear and planet wheel are other names for this sense, not the middle
  wheel and not the ring wheel.
examples:
- The planetary gear turned slowly around the sun gear.
- A broken planetary gear stopped the whole machine.
