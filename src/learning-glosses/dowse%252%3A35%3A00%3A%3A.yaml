simpleMeaning: To seek underground water or metal with a forked stick.
scope: This sense is to seek underground water or metal with a forked stick, unlike the sense for seeking
  underground water or minerals with a dowsing rod, and unlike the sense for sloshing liquid on a thing,
  wetting it right through.
examples:
- He dowsed for water with a forked stick.
- Dowsing seeks underground water.
