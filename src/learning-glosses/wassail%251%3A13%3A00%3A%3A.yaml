simpleMeaning: Sweet ale or wine, warmed with spices and roasted apples, makes this hot punch, drunk above
  all at Christmas.
scope: This hot punch of sweet ale or wine, warmed with spices and roasted apples, is drunk above all
  at Christmas, not the noisy celebrating of the verb sense.
examples:
- Cups of wassail were passed round at Christmas.
- The wassail on the stove smelled of spices and roasted apples.
