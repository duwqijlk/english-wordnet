simpleMeaning: the study of how living things take shape and grow in the first part of their lives
scope: The study of how living things take shape and grow early in life, not the study of grown plants
  and animals and not the care of mothers and babies.
examples:
- She took a course in embryology to learn how a chick grows inside the egg.
- His work in embryology traced the first weeks of a frog's growth.
