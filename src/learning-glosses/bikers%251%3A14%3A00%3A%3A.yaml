simpleMeaning: A 1960s British youth group, descended from the teddy boys, known for black leather jackets,
  jeans and boots, greased hair, motorcycles, rock'n'roll, and mostly unskilled manual work.
scope: The 1960s British motorcycle-and-rock'n'roll youth group in leather and greased hair; the same
  style was also called rockers, and this is not a present-day motorcycle gang or a bicycle club.
examples:
- Her grandfather rode with the bikers in the 1960s, in a leather jacket and with greased hair.
- The bikers of that era were mostly young men in manual jobs who loved rock'n'roll.
