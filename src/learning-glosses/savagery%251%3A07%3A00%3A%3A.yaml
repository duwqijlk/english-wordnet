simpleMeaning: the quality of being very cruel, with no care at all for the pain of others
scope: This is a quality in a person, also called brutality, viciousness and ferociousness; it is not
  one single cruel act done by a person.
examples:
- His savagery shocked everyone who worked for him.
- The king was known for his savagery toward his enemies.
