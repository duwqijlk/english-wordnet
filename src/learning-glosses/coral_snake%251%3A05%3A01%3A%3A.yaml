simpleMeaning: bright bands of red and black and bands of yellow or white mark any of several poisonous
  snakes of the Americas, found far and wide in South and Central America
scope: This is a poisonous snake of the Americas with bright bands of red, black and yellow or white;
  harlequin-snake is another name for it, and it is not the coral snake of Asia, Africa and Australia.
examples:
- The coral snake had bright bands of red, black and yellow.
- Coral snakes live in South and Central America.
