simpleMeaning: A large group of related tongues spoken in south and central India and Sri Lanka, and also
  overseas in Malaysia and Singapore
scope: A large family of tongues, not one single tongue and not the people who speak them; also called
  Dravidian language and Dravidic.
examples:
- Tamil belongs to the Dravidian family of languages.
- Dravidian tongues are spoken in south India and Sri Lanka.
