simpleMeaning: A North American woody plant that loses its leaves in winter, with leaves in three parts
  and red berries
scope: This is a North American woody plant that loses its leaves in winter, with leaves in three parts
  and red berries; cranberry tree and highbush cranberry are other names for it; not the Old World shrub
  of the same name, and not a blueberry plant.
examples:
- The cranberry bush in the garden had bright red berries.
- Cranberry bushes lose their leaves in winter.
