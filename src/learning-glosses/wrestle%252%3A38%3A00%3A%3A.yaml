simpleMeaning: to move by twisting and bending the body, especially when struggling
scope: 'Also called twist, worm, wriggle, squirm and writhe: to twist and bend the body, especially when
  struggling, not to fight a feeling in the mind and not a sport match.'
examples:
- The child wrestled in his aunt's arms, trying to get free.
- She wrestled on the floor, twisting to free herself.
