simpleMeaning: Of or about William James, his ideas, or his teaching
scope: This word describes things of or about William James, his ideas, or his teaching; it is about the
  thinker William James, not the writer Henry James.
examples:
- Jamesian ideas about the mind shaped American thought.
- She took a Jamesian view of truth as what works in life.
