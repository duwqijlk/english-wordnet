simpleMeaning: the activity of aiming a weapon at targets and firing, especially as a sport.
scope: This is not a new branch growing from a plant, not a photography session, and not the firing of
  a gun at a person; it is the activity or event of aiming at targets.
examples:
- The archery shoot attracted competitors from across the county.
- He took part in a shoot at the rifle range.
