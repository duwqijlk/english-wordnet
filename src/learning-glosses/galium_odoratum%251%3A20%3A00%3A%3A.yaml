simpleMeaning: Sweet-smelling Old World perennial spreading by runners, with small white flowers and narrow
  leaves for flavouring and scented bags, widely grown as ground cover, sometimes put in the group Asperula.
scope: Also called fragrant bedstraw, sweet woodruff, waldmeister, woodruff, and Asperula odorata; a scented
  ground-cover plant, not a tall garden herb.
examples:
- Galium odoratum scented the whole room.
- We grow Galium odoratum as ground cover.
