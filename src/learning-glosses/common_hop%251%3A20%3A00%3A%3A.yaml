simpleMeaning: Grown in America, this plant of Europe winds around other plants, and its flowers are used
  above all to give taste to malt drinks
scope: Also called bine and common hops; a European plant whose flowers flavour malt drinks, not a garden
  vine.
examples:
- Common hop winds up the poles in the field.
- Brewers grow common hop for its flowers.
