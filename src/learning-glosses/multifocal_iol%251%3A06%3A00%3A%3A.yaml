simpleMeaning: A kind of lens put inside the eye, with several rings round one centre, that sets the eye
  for near and far sight at the same time
scope: Also called a multifocal lens implant; a lens put inside the eye, with several rings round one
  centre, that sets it for near and far sight at once, not a lens for one distance only.
examples:
- The multifocal IOL lets her see near and far at the same time.
- After the operation she had a multifocal IOL put in her eye.
