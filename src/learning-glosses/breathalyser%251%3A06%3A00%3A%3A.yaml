simpleMeaning: A tool that measures chemicals, chiefly alcohol, in the air a person breathes out.
scope: A tool that measures chemicals, chiefly alcohol, in air breathed out; breathalyzer is another name
  for this sense, not a blood test for alcohol and not a lung test.
examples:
- The police officer asked the driver to blow into the breathalyser.
- The breathalyser showed alcohol in his breath.
