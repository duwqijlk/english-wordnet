simpleMeaning: Most of all when it turns or goes round a bend, a thing is said to go or head away from
  the middle
scope: Said of a thing that goes or heads away from the middle, not one that goes toward it and not one
  that stays still.
examples:
- The outward-moving water flew off the spinning wheel.
- Outward-moving air rushed away from the center of the storm.
