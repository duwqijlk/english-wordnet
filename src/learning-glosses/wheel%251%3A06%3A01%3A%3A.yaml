simpleMeaning: the round handle used to steer a boat or ship by turning its rudder.
scope: This is the circular helm that controls a ship's rudder, not a car's steering wheel or a general
  turning disc in a machine.
examples:
- She gripped the wheel as the ferry pushed through the swell.
- The captain spun the wheel hard to avoid the rocks.
