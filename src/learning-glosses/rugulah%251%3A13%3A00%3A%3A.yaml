simpleMeaning: A pastry whose dough includes cream cheese, with different fillings, such as raisins, walnuts
  and cinnamon, or chocolate, walnuts and apricot jam.
scope: Another name for rugelach and ruggelach, the same cream-cheese pastry; not a strudel or a Danish
  pastry.
examples:
- The deli sells rugulah with cinnamon, raisins and walnuts.
- He filled the rugulah with apricot preserves.
