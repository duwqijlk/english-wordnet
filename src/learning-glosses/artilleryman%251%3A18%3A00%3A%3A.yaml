simpleMeaning: a man in the army whose job is to work with large guns
scope: A soldier who works with large guns; not a soldier who fights on foot and not a sailor on a ship.
examples:
- His grandfather served as an artilleryman during the war.
- The artilleryman checked the large gun before the battle began.
