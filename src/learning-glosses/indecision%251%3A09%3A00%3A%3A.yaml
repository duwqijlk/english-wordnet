senseId: 'indecision%1:09:00::'
synsetId: 05707137-n
simpleMeaning: Not being sure which thing to do when you could do two or more different things.
scope: This is doubt about which of two or more ways to choose; not the habit of being unable to decide,
  and not fear.
examples:
- His indecision was only momentary, but the opportunity was lost.
- After a moment of indecision, she took the left-hand road.
