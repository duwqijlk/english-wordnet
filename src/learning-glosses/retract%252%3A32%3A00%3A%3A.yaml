simpleMeaning: to make a formal statement that you no longer hold a belief you once held, usually because
  others press you to do so
scope: Saying in a formal way that you no longer hold a belief you once held; not pulling something back,
  and not holding a wound open in surgery.
examples:
- He retracted his earlier statements about his religion.
- Under pressure, she retracted her claim.
