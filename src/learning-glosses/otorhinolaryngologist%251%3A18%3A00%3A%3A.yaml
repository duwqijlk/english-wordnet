simpleMeaning: A doctor who treats illnesses of the ear, nose, or throat.
scope: A doctor for ear, nose, and throat illnesses; otolaryngologist and ear-nose-and-throat doctor are
  other names for this sense, not a doctor for the eye or the teeth.
examples:
- The otorhinolaryngologist treated her sore throat.
- He saw an otorhinolaryngologist about his blocked nose.
