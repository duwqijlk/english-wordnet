simpleMeaning: a large set of computer systems all over the world, joined by one set of shared rules called
  TCP/IP, that share facts and messages
scope: 'Also called the net: a large set of computer systems all over the world joined together to share
  facts and messages, not one computer on its own and not a set of wires in one building.'
examples:
- She found the recipe on the internet.
- The internet went down during the storm.
