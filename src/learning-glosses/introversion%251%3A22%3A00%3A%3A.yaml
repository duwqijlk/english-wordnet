simpleMeaning: The turning in of an outer part so that it makes a hollow in the surface.
scope: The turning in of an outer part so that it makes a hollow in the surface; not a turn of mind that
  looks inward, and not the state of being folded inward or sheathed.
examples:
- The introversion of the blastula forms a pocket in its surface.
- Introversion of the outer layer left a deep hollow.
