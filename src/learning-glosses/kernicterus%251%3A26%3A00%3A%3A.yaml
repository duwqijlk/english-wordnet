simpleMeaning: When a yellow pigment from bile builds up in the brain and other nerve tissue, it stains
  them yellow and harms them.
scope: A yellow bile pigment building up in the brain and harming nerve tissue.
examples:
- Doctors found kernicterus in the patient's brain.
- Kernicterus can damage nerve tissue if the yellow pigment builds up.
