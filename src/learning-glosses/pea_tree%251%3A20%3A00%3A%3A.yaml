simpleMeaning: With mostly yellow flowers and seeds in a long thin pod, any plant of the Caragana group
  has leaves made of pairs of small leaves.
scope: Also called caragana, it is a plant of the Caragana group with mostly yellow flowers, seeds in
  a long thin pod, and leaves made of pairs of small leaves.
examples:
- The pea tree bore yellow flowers.
- Seeds in a long thin pod followed the pea tree's yellow flowers.
