simpleMeaning: a person who other people think is very bad and not worth any respect
scope: 'Also called rat, puke, git, and skunk: a person people think is very bad, not a small piece of
  bread or cake and not the act of covering food in small bread pieces.'
examples:
- Only a crumb would steal money from his own friend.
- Do not be such a crumb; say sorry for what you did.
