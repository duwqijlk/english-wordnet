simpleMeaning: Describing data or research that rests on evidence which experiments cannot easily confirm
  or disprove.
scope: It describes evidence or a research method that experiments cannot settle, not a gentle manner,
  a lenient rule, or an easy task.
examples:
- Economists were wary of the soft data behind the survey.
- The soft sciences rely on interviews and observation rather than controlled trials.
