simpleMeaning: a tiny plate that holds bits of DNA that match one side of the DNA double twist and can
  pick out matching DNA in test samples
scope: A tiny plate that holds bits of DNA to test samples, not a computer chip and not a gene test done
  by hand.
examples:
- The lab used a gene chip to test the patient's DNA for signs of disease.
- A gene chip can pick out matching DNA from hundreds of samples at once.
