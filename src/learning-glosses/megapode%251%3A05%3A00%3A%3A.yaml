simpleMeaning: Birds of Australasia with big feet and short wings that heap up rotting plants into mounds
  to warm their eggs until they hatch
scope: 'Also called mound-bird, mound bird, mound builder and scrub fowl: birds of Australasia that heap
  up rotting plants to warm their eggs.'
examples:
- A megapode heaped rotting plants into a mound for its eggs.
- Megapodes use big feet to pile up the mound that warms their eggs.
