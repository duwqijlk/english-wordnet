simpleMeaning: One after another in the order in which they fire, this device sends power to the spark
  plugs of a petrol engine.
scope: Also called a distributor and a distributer, it sends power to the spark plugs of a petrol engine
  in firing order, not a device that makes the power itself.
examples:
- Without the electrical distributor, the spark plugs would get no power.
- The electrical distributor works in time with the engine.
