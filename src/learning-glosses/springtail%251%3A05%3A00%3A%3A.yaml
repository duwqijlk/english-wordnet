simpleMeaning: A tiny wingless insect with a special rear appendage that lets it jump almost constantly;
  it lives in soil rich in decaying matter, or on snow or water.
scope: This is the tiny jumping soil insect also called collembolan; it is not a wingless parasite such
  as a louse or flea.
examples:
- A springtail leapt many times its own body length when I touched it.
- Springtails speckled the snow in their thousands on the mild winter day.
