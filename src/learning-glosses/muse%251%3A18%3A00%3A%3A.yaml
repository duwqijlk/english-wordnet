senseId: 'muse%1:18:00::'
synsetId: 09589128-n
simpleMeaning: In old Greek tales, one of the nine daughters of Zeus and Mnemosyne, each of whom guards
  one art or one field of study.
scope: Not a god of Mount Olympus nor a nymph of sea or wood; one of nine sisters who guard the arts.
examples:
- The poet prayed to the Muse of song for help.
- Each Muse guards one art, such as poetry or dance.
