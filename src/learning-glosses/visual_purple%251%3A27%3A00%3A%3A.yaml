simpleMeaning: a red-coloured material in the rod cells of the eyes of animals with backbones, which light
  breaks down into something called retinene
scope: A red colour stuff in the eyes of animals with backbones, also called retinal purple and rhodopsin;
  not the white of the eye and not a dye.
examples:
- The visual purple in the rods breaks down when light falls on it.
- A flash of light breaks down the visual purple in the eye.
