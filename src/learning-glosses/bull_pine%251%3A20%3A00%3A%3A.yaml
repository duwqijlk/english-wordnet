simpleMeaning: Western North America's familiar, widespread timber pine is tall and bears dark green needles
  two to five per cluster; its bark becomes thick and plated dark brown with age.
scope: Another name for the tall western pine also called ponderosa, ponderosa pine or western yellow
  pine, not an eastern pine such as the white pine.
examples:
- Bull pine wood is used for construction and fencing.
- The bull pine's bark forms thick dark plates as the tree ages.
