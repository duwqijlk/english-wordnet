simpleMeaning: In folklore, a small ugly creature with powers beyond nature that makes trouble for people
scope: In folklore, this is a small ugly creature that makes trouble for people, also called goblin and
  hobgoblin; it is not the sense that means fairies that play tricks.
examples:
- In the old story, a hob hid the farmer's tools every night.
- The children were told that a hob lived in the barn and made trouble.
