simpleMeaning: 'The money used in six free states in the middle of Africa: Cameroon, Central African Republic,
  Chad, Republic of the Congo, Equatorial Guinea, and Gabon.'
scope: The money used in six free states in the middle of Africa, not the West African money of the same
  name and equal value.
examples:
- The Central African CFA franc is used in Cameroon.
- Prices in Chad are given in Central African CFA francs.
