simpleMeaning: given to show respect, but with none of the usual work that goes with that job, title or
  place
scope: This is about a title or place given to show respect, with no usual work to do; it is not a normal
  job with day-to-day work.
examples:
- She was made an honorary member of the club and did not have to do any of its work.
- He got an honorary degree from the university for his help to the town.
