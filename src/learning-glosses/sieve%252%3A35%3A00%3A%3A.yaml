senseId: 'sieve%2:35:00::'
synsetId: 01462658-v
simpleMeaning: to pass something through a tool with many small holes, so the bigger pieces stay back
  and the smaller pieces go through
scope: 'Also called sift and strain: passing something through a tool with small holes to keep back the
  big pieces, not the tool itself.'
examples:
- She sieved the flour to take out the lumps.
- He sieved the soil, and the small stones stayed behind.
