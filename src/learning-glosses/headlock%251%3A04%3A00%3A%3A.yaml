simpleMeaning: In wrestling, a hold where the opponent's head is held tight between the inside of the
  other person's bent elbow and the side of their body
scope: This wrestling hold traps the head between a bent arm and the body; it is not a hold around the
  neck alone and not a throw.
examples:
- He put his opponent in a headlock and would not let go.
- The wrestler broke free from the headlock.
