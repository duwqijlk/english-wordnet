simpleMeaning: sewing done to fix a hole that is worn or torn, especially in a piece of clothing
scope: 'Patch and darn are other names for this sense: the sewing done to fix a worn or torn hole, especially
  in a piece of clothing. Not the verb sense of fixing something that is broken.'
examples:
- Her stockings had several mends where the cloth had worn thin.
- You can hardly see the mend on the sleeve of his shirt.
