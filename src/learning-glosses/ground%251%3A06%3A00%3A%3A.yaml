simpleMeaning: the first layer of paint, or of a glue-like sealer, put on a surface before the main coats
scope: This is a preparatory coating on a surface, not the soil of the earth, not a reason or basis for
  something, and not the background behind a figure in a picture.
examples:
- Apply a white ground to the canvas and let it dry before you start painting.
- The restorer found an old ground beneath the top layer of paint.
