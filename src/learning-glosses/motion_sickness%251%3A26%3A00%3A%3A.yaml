senseId: 'motion_sickness%1:26:00::'
synsetId: 14226828-n
simpleMeaning: Feeling dizzy or sick to the stomach because of the movement of a car, boat, plane or other
  vehicle you are travelling in or on.
scope: Also called kinetosis; feeling dizzy or sick to the stomach from the movement of a vehicle, not
  a stomach bug and not fear of travel.
examples:
- Motion sickness made her feel ill on the boat.
- He gets motion sickness on long car rides.
