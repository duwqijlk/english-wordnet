simpleMeaning: To tighten the belly muscles while giving birth, so the birth goes more easily
scope: To tighten the belly muscles during childbirth to ease the birth, also called overbear, not to
  press on a thing and not to scold someone.
examples:
- The midwife told her to bear down with each pain.
- She learned to bear down and breathe slowly during labour.
