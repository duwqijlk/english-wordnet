senseId: 'crosier%1:10:00::'
synsetId: 07282014-n
simpleMeaning: A long stick topped with a bent hook or a cross, carried by bishops as a sign of their
  office as shepherds of their people
scope: A bishop's staff topped with a hook or cross, also called a crozier; not a walking stick and not
  a king's sceptre.
examples:
- The bishop raised his crosier during the blessing.
- The crosier stood in the corner of the chapel.
