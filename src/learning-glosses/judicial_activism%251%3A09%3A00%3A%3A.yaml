senseId: 'judicial_activism%1:09:00::'
synsetId: 05774695-n
simpleMeaning: A view of the United States constitution that lets the mood of the age and the country's
  needs rightly shape court rulings, above all those of the Supreme Court.
scope: This is a view of the constitution that lets the mood of the age and the country's needs rightly
  shape court rulings; broad interpretation is another name for it, not a reading that sticks only to
  the words as written.
examples:
- Critics called the ruling judicial activism, saying the court had gone beyond the words of the constitution.
- Supporters of judicial activism say judges must weigh the needs of the nation today.
