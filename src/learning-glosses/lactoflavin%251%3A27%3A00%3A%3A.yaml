simpleMeaning: A B vitamin, one of the food stuffs the body needs in small amounts, that stops sore spots
  on the skin and loss of weight
scope: 'Also called riboflavin, hepatoflavin and ovoflavin: a B vitamin that stops sore spots on the skin
  and loss of weight, not vitamin C and not a drug that heals wounds.'
examples:
- A lack of lactoflavin can cause sore skin and weight loss.
- Milk and eggs give the body lactoflavin.
