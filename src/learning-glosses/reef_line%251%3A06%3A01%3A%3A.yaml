simpleMeaning: In sailing, one of a few short cords sewn through a sail, used to tie up part of the sail.
scope: 'Also called reef point or reefing line: in sailing, one of a few short cords sewn through a sail
  to tie up part of it, not the rope that hoists the sail.'
examples:
- The sailor tied the reef line to shorten the sail.
- A reef line held the folded sail in place.
