simpleMeaning: the quality of staying true and loyal, and of doing what you promised
scope: Staying loyal and true to a person, a promise or a duty; not belief in God or strong trust in an
  idea.
examples:
- Her faithfulness to her husband lasted through many hard years.
- The dog's faithfulness to its owner never changed.
