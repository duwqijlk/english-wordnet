simpleMeaning: any of several bushes or small trees that keep their green leaves all year and have white,
  pink, or reddish flowers that grow alone
scope: 'Also called camelia: a bush or small tree that keeps its green leaves all year and has single
  white, pink, or reddish flowers, not a rose or another garden flower.'
examples:
- A pink camellia grew beside the front door.
- The camellia in the garden has white flowers in winter.
