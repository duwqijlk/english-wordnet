senseId: 'profundity%1:07:01::'
synsetId: 05102125-n
simpleMeaning: Depth of thought, a sharp grasp of ideas, and clear sight into what they mean, or the like.
scope: Also called profoundness, this is depth of thought with a sharp grasp of ideas, not wisdom that
  is hard to grasp and deep, and not the power to see deeply into ideas.
examples:
- The profundity of her thought impressed the class.
- His essay showed great profundity.
