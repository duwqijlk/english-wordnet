scope: A green bush that keeps its leaves all year, found on the sea coast of the United States from Virginia
  to Texas, not a plant that loses its leaves in winter.
examples:
- The tall gallberry holly kept its leaves through the winter.
- Tall gallberry holly grows along the coast from Virginia to Texas.
