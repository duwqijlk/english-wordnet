simpleMeaning: 'Cigarettes are one, leaves for chewing another, snuff a third: anything made at least
  in part from leaves of the plant it is named for that people can take in.'
scope: Cigarettes, leaves for chewing, and snuff are all of this kind, made at least in part from leaves
  of the plant it is named for that people can take in.
examples:
- The shop sold every kind of tobacco product.
