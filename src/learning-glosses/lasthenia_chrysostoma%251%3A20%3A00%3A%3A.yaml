simpleMeaning: A small thin woolly one-year plant with very narrow paired leaves and branches with single
  golden-yellow flower heads; from southwestern Oregon to Baja California and Arizona, often grown.
scope: Also called goldfields; a small woolly one-year plant of the far west, not a tall shrub and not
  a grass.
