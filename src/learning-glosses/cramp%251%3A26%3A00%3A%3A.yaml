simpleMeaning: a sudden, painful tightening of a muscle that you cannot control
scope: 'Also called spasm: a painful tightening of a muscle. This is the noun for the pain, not the verb
  for suffering it and not a metal strip that holds stone together.'
examples:
- She got a cramp in her leg while swimming.
- A cramp in his hand made it hard to write.
