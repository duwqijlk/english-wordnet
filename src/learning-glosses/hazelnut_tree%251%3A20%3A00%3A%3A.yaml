simpleMeaning: Food in hard shells inside a leafy case grows on one of several bushes or small trees of
  the group called Corylus.
scope: Also called hazel and hazelnut, this is a shrub or small tree with nuts in leafy husks.
examples:
- The hazelnut tree bore nuts in leafy husks.
- We planted a hazelnut tree by the wall.
