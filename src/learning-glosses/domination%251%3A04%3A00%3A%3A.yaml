simpleMeaning: control over people in a group or in daily life, by holding power over them
scope: This is control over people in a group or in daily life; it is not the separate sense that means
  the power to beat or defeat others.
examples:
- The workers lived under the complete domination of the factory owner.
- Their domination of the small town lasted for many years.
