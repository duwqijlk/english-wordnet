simpleMeaning: the mat that makes the floor of the ring where boxers or wrestlers who do this for work
  fight
scope: 'Also called canvas: the mat floor of a fighting ring, not the heavy cloth itself, not a sail,
  and not asking people for their votes.'
examples:
- The boxer fell hard onto the canvass and got up slowly.
- Dark spots marked the canvass in the middle of the ring.
