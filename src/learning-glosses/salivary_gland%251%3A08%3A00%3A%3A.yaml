simpleMeaning: any of three pairs of spit-making parts in the mouth and gut that make spit to help break
  down food
scope: Spit-making parts in the mouth, not sweat parts in the skin and not the liver.
examples:
- The salivary gland under his tongue was swollen.
- Salivary glands make the spit that starts to break down food.
