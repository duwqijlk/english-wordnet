simpleMeaning: An Australian evergreen shrub whose leaves grow in rings of leaflets, with showy yellow
  to orange-red flowers and pods of two seeds; foliage is toxic to livestock.
scope: The Gastrolobium shrub also called gastrolobium and poison bush; not any Swainsona plant, which
  carries the poison bush name instead.
examples:
- The poison pea was in full flower along the creek bank.
- Sheep that grazed on poison pea quickly sickened.
