simpleMeaning: to give someone the paper or card they need to travel or to go into a place
scope: The act of giving someone that paper or card, not the paper or card itself, not a fine for breaking
  a traffic rule, and not a party's list of people running for office.
examples:
- The airline ticketed us for the morning flight.
- All visitors were ticketed before they entered the hall.
