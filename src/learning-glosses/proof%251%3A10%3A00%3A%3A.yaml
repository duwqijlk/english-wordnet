simpleMeaning: a carefully ordered set of statements showing that one claim must be true whenever another
  holds
scope: This is a formal chain of reasoning in logic or mathematics, not factual evidence that something
  is true, not a printer's trial copy, not a test print of a photograph, not a measure of alcoholic strength,
  and not the act of testing or validating something.
examples:
- The mathematician gave a proof that no even number greater than two is prime.
- Her proof rests on two earlier theorems.
