simpleMeaning: The poison from the bite of a snake, insect, or other animal is fought by this cure.
scope: The cure that fights the poison left by a bite goes by this name, and also by antivenene.
examples:
- They keep antivenin on hand for snake bites.
- After the insect bite, antivenin stopped the poison from doing more harm.
