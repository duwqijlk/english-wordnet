simpleMeaning: to change a thing or put it in a new order, especially to bring it up to date and make
  it better
scope: 'Also called revise: changing a thing and putting it in a new order to make it better, not giving
  a workshop or factory new tools.'
examples:
- They retooled the system to make it work better for new users.
- The city will retool its bus service for more riders.
