simpleMeaning: The bending and breaking of the earth's outer layer is what this branch of the study of
  rocks and the earth is about.
scope: Tectonics and the plate tectonic theory are other names for this branch of the study of rocks and
  the earth, which covers how the earth's outer layer bends and breaks.
examples:
- She chose plate tectonics as the topic of her talk.
- In class we learned how plate tectonics shows the earth's outer layer bending and breaking.
