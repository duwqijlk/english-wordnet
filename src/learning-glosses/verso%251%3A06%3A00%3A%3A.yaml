simpleMeaning: The back face that bears no chief mark.
scope: This sense is also called reverse, for the back face that bears no chief mark, where reverse is
  the back side of a coin or medal, the side that does not carry the main design.
examples:
- The verso is the back face that bears no chief mark.
- Versos bear no chief mark.
