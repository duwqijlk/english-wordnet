senseId: 'laying_waste%1:04:00::'
synsetId: 00218640-n
simpleMeaning: Breaking or spoiling something so badly that it is left in ruins
scope: This is harm that leaves a thing wrecked; ruin, ruining, wrecking and ruination are other names
  for it, not light damage that can be put right.
examples:
- The army's laying waste of the fields left the village with nothing to eat.
- Years of laying waste had turned the rich farms into bare ground.
