scope: A tall grass from New Zealand grown for its feather-like flower heads; also called toetoe and plumed
  tussock. Not a lawn grass and not a part of the foot.
examples:
- The toe toe swayed in the wind beside the path.
- They planted toe toe for its tall, feathery flower heads.
