simpleMeaning: A chemical formed from nitric acid, used in paints and in things that blow up.
scope: A chemical formed from nitric acid, used in paints and in things that blow up; cellulose nitrate,
  nitrocellulose and nitrocotton are other names for it, not a mix of cement and sand sprayed on a wall
  and not the piece of hard stone that makes a spark in an old weapon.
examples:
- The factory made guncotton for paints and explosives.
- Workers stored the guncotton away from any flame.
