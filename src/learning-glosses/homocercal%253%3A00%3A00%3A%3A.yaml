simpleMeaning: In two even halves, a tail that runs past the end of the backbone, as in most fish with
  bones.
scope: It describes a tail with two even halves, not the fin itself.
examples:
- The homocercal tail of the trout has two even halves.
- Most bony fish have a homocercal tail.
