simpleMeaning: cloth coloured with patches of green, brown, black and light brown, made so a person in
  clothes made from it is hard to tell apart from what is around them
scope: 'Also called camouflage: this is the cloth itself, not the act of hiding and not the marks on an
  animal''s skin.'
examples:
- His jacket was made of camo, with green and brown patches.
- Soldiers wore camo so they were hard to see among the trees.
