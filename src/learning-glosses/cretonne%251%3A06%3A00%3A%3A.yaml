simpleMeaning: A heavy cloth with no shine, printed in bright colours, used for chair covers and curtains.
scope: This is a heavy printed cloth for covers, not a light dress cloth or a carpet.
examples:
- The chairs were covered in cretonne.
- She chose cretonne for the curtains.
