simpleMeaning: a valuable stone cut with a smooth top that curves out, made very shiny, and with no flat
  cut faces
scope: A smooth, shiny stone with a curved top and no flat cut faces; not a stone cut with many flat faces.
examples:
- The ring held a green cabochon in the centre.
- She chose a cabochon for the necklace because she liked its smooth top.
