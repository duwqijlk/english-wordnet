simpleMeaning: used to show a strong feeling, such as anger, loss of all hope, annoyance at not being
  able to do what you want, strong approval, or surprise
scope: 'Also called goddamn and goddamned: used to show a strong feeling, not the adjective use that adds
  force to a noun as an informal swear word.'
examples:
- You are goddam right that the treatment was unfair!
- She worked goddam hard to get the work done in time.
