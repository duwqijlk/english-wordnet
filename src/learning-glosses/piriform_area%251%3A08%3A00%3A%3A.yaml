simpleMeaning: Shaped like a pear, this part made of nerve cells sits on both sides of the brain, in the
  part that deals with smell
scope: A pear-shaped part made of nerve cells on both sides of the brain in the smell part, also called
  a piriform lobe, a pyriform area or a pyriform lobe; it is not a part that moves the body.
examples:
- The piriform area helps the brain make sense of smells.
- Damage to the piriform area can change how a person smells things.
