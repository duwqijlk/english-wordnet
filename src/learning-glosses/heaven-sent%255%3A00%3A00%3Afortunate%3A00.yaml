simpleMeaning: A thing that comes just when it is needed, and brings such good luck, that it seems to
  come from God
scope: Luck that is good and well timed, also called miraculous and providential, not just good luck and
  not a planned success.
examples:
- A heaven-sent rain saved the crops.
- The heaven-sent help came just when we needed it most.
