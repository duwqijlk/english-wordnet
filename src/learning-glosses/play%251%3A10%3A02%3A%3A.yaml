simpleMeaning: clever teasing or mocking remarks, often aimed at someone but not to be taken seriously.
scope: This sense is not a stage drama, not a skillful move in a sport, and not light activity for fun;
  it is joking or mocking talk.
examples:
- She called him a fool in play, and he laughed.
- He only said it in play, so don't take it to heart.
