simpleMeaning: a speech sound made with the tongue pressed to the top teeth
scope: A speech sound made with the tongue on the top teeth, also called dental; not a sound made with
  the lips or at the back of the mouth.
examples:
- The 'th' in 'thin' is a dental consonant.
- Spanish speakers often make the 'd' a dental consonant.
