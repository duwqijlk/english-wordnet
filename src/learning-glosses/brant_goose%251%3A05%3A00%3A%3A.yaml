simpleMeaning: dark little birds that make nests in the north and then fly south
scope: 'Also called brant, brent and brent goose: small dark geese that nest in the north and fly south,
  not a large pale goose and not a duck.'
examples:
- The brant goose nested near the cold northern lake.
- We saw a brant goose fly south with its flock.
