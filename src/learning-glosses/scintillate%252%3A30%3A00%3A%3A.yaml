senseId: 'scintillate%2:30:00::'
synsetId: 00473934-v
simpleMeaning: To be so quick and clever in talk or in play that one stands out.
scope: Also called sparkle or coruscate, this is to be quick and clever in talk or in play, not to give
  off flashes of light and not to glow for a moment when struck by a tiny bit of matter.
examples:
- She scintillated at dinner, her talk quick and full of wit.
- His playing scintillated, each note bright and sure.
