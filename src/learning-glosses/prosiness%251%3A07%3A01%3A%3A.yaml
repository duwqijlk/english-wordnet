senseId: 'prosiness%1:07:01::'
synsetId: 04803127-n
simpleMeaning: Being dull and not exciting makes a thing ordinary
scope: This is dull ordinariness; prosaicness is another name for this sense, not liveliness and not fine,
  fresh writing.
examples:
- His speech had a prosiness that put the whole room to sleep.
- The prosiness of her letter made it hard to finish.
