simpleMeaning: in biology, the natural process by which one living thing grows, changing step by step
  from a simple form to a more complex one
scope: The biological growth of a living thing, not the act of improving something by expanding it, a
  recent event, or making land more productive.
examples:
- The book explains the development of a frog from egg to adult.
- Poor nutrition can affect a child's development.
