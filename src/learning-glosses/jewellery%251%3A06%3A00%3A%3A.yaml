simpleMeaning: a thing worn to look fine, such as a ring, bracelet or necklace, made of costly metal and
  set with gems or stones that look like gems
scope: 'Also called jewelry: a thing worn to look fine, made of costly metal and set with gems or stones
  that look like gems; not a single gem stone on its own.'
examples:
- She keeps her jewellery in a locked box.
- The shop sells gold jewellery and silver rings.
