simpleMeaning: A form of address for any British lord other than a duke, also used for a bishop or a judge.
scope: Not 'Your Grace', the form for a duke, nor 'Sir'; a form of address for lords, bishops and judges.
examples:
- The clerk said, 'Your Lordship, the court is ready.'
- His Lordship will see you now.
