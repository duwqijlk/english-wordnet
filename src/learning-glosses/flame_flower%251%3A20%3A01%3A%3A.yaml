simpleMeaning: A plant with fleshy roots, upright stalks, narrow leaves and one reddish-orange blossom
  in each upper leaf joint; native to the southwestern United States, where its roots were once cooked.
scope: This is the low Southwestern plant with one orange blossom in each upper leaf joint, not the tall
  red-hot-poker with drooping spikes of red or yellow flowers.
examples:
- We spotted a flame flower beside the trail, with one orange blossom at each upper leaf joint.
- Long ago, Native Americans in the Southwest cooked the roots of the flame flower.
