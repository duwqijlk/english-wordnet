simpleMeaning: When X-rays or beams of tiny charged bits hit it, a light-giving coat on one side of this
  clear screen glows
scope: This is a screen that lights up under X-rays, not a plain glass screen and not a television screen.
examples:
- The doctor watched the patient's chest on the fluorescent screen.
- The fluorescent screen glowed where the X-rays struck it.
