simpleMeaning: Strong feeling for God and holy things, shown in a way that is too much or put on
scope: 'Another name for religiosity: strong feeling for God and holy things that is too much or put on,
  not quiet faith and not mere church-going.'
examples:
- His pietism put some people off at the prayer meeting.
- Her pietism was clear in every word she said about her faith.
