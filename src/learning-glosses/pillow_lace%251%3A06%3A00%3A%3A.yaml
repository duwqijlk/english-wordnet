simpleMeaning: handmade lace worked on a soft pad, with threads wound on small spools; the pattern is
  marked out on the pad with pins
scope: Also called bobbin lace; lace made by hand on a pad with pins, not lace made by a machine and not
  crochet.
examples:
- She learned to make pillow lace on a small pad with pins.
- The pillow lace on the table took weeks to finish.
