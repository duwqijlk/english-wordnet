simpleMeaning: the making of beer or ale from malt and hops, ground and boiled, then left to change with
  yeast
scope: Making beer or ale from malt and hops with yeast, not making wine and not simply cooking.
examples:
- Brewing took place in the back room of the inn.
- The brewing of ale was a village trade.
