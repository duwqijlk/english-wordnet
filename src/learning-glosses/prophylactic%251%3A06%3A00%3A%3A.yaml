simpleMeaning: Worn on the penis during sex to stop a woman getting pregnant, a thin cover of rubber or
  latex.
scope: Also called a safe, a safety, a rubber, or a condom, this is a thin cover worn during sex to stop
  a woman getting pregnant, not a drug that stops illness, not the use for a thing that helps stop disease,
  and close in sense to the use for a thing able to stop a woman getting pregnant.
examples:
- He bought a packet of prophylactics at the chemist.
- A prophylactic stops a woman getting pregnant during sex.
