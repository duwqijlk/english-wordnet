synsetId: 06405443-n
simpleMeaning: A part of a written deal that lets pay, prices, or gains go up or down when set things
  change, such as a change in the cost of living.
scope: A part of a written deal that moves pay or prices with set changes, also called escalator; not
  a fixed price in a deal and not a rule about work hours.
examples:
- The escalator clause raised their pay when the cost of living rose.
- Their deal has an escalator clause, so prices move with the cost of living.
