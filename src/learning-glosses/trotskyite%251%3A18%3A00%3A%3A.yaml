simpleMeaning: Radicals who back Trotsky's teaching that socialism, a fair sharing of wealth, must be
  set up all over the world by unending revolt.
scope: Also called Trot and Trotskyist, these are radicals who back Trotsky's teaching that socialism
  must be set up all over the world by unending revolt, not radicals who back a single country's revolt
  or a slow change by law.
examples:
- The Trotskyite spoke of world revolution.
- Trotskyites back Trotsky's theory of continuing revolution.
