simpleMeaning: a block or bar pushed under a wheel or between its spokes to stop a vehicle rolling down
  a slope
scope: A block or bar pushed under a wheel or between its spokes to stop a vehicle rolling down a slope;
  not a brake worked from inside the vehicle and not a stone put behind a wheel.
examples:
- He put a sprag under the cart wheel on the hill.
- The sprag kept the wagon from rolling back.
