simpleMeaning: The land-fighting arm of the United States of America, the arm that gets soldiers ready
  for war on land.
scope: The land-fighting arm of the United States of America, also called Army, United States Army, US
  Army and USA, not the flying arm, not the navy, and not the land-fighting arm of another land.
examples:
- He joined the U. S. Army at eighteen.
- The U. S. Army trains soldiers for war on land.
