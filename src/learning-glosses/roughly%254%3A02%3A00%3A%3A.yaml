simpleMeaning: for amounts, not exact but fairly close to the true amount
scope: 'Also called about, some, or around: used with amounts that are not exact but close; not for moving
  in a bumpy way over a surface, and not for treating someone in a hard, violent way.'
examples:
- The trip took roughly three hours.
- Roughly fifty people came to the meeting.
