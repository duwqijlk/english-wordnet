simpleMeaning: A timid man or boy whom people consider childish or unwilling to stand up for himself.
scope: Also called pansy, sissy, milksop and pantywaist, this is a timid man or boy, not a brave one.
examples:
- The other boys called him a milquetoast.
- He was a milquetoast who never spoke up in class.
