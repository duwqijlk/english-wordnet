simpleMeaning: Through holes in its chalky shell, this tiny sea creature puts out false feet.
scope: Also called a foraminifer, this names the tiny sea creature with a chalky shell full of holes,
  through which it puts out false feet.
examples:
- The foram's chalky shell had tiny holes in it.
- The foram put out a false foot through a hole in its chalky shell.
