simpleMeaning: A British place of learning in the past that taught hands-on skills for work more than
  book learning
scope: This is a British school of the past that taught hands-on work skills more than book learning;
  not a grammar school, not a comprehensive school, and not a school for young children.
examples:
- My grandfather went to a secondary modern school in Leeds.
- The secondary modern school taught him carpentry and metalwork.
