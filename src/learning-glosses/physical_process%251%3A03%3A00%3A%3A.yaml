synsetId: 00029976-n
simpleMeaning: One state after another, a happening slowly changes, or it simply goes on for a while
scope: Also called a process, this is a happening that goes on for a while or slowly changes through a
  run of states, not a single quick event and not a thing that stays still.
examples:
- The physical process went on for weeks as the ice slowly melted.
- A physical process like rust changes metal bit by bit over time.
