simpleMeaning: A test that measures or describes what a substance contains, especially an ore or a drug;
  often used to find infectious agents or antibodies or to measure their amount.
scope: This is a test of what a sample contains, not an appraisal of a situation and not a try at something.
  Ores and drugs are its typical subjects, and in medicine it looks for germs or antibodies.
examples:
- The assay showed that the ore sample contained traces of gold.
- Laboratory assays for antibodies can take several hours to complete.
