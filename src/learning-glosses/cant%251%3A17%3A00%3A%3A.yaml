simpleMeaning: a slope across a bend in a road or track, with the outer edge higher than the inner, to
  cut the outward push of a turn
scope: A slope across a bend, with the outer edge raised, not a flat road and not a slope made for looks;
  bank is another name for this sense.
examples:
- The cant on the bend helped the cars hold the road.
- Engineers gave the track a cant so trains could take the curve at speed.
