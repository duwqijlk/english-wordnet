simpleMeaning: a person who is not loyal and leaves or acts against a cause, their faith, a political
  party, a friend or another group they once supported
scope: Also called deserter, renegade, ratter, apostate and recreant. This is a person who leaves their
  own side, not a person who stays loyal to it.
examples:
- When he left his party and joined its enemies, his old friends called him a turncoat.
- The turncoat gave his former group's plans to the other side.
