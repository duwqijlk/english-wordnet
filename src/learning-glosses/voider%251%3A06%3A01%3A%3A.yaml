simpleMeaning: a piece of linked metal rings that covers a spot where hard plates leave the body bare
scope: 'Also called a gusset: a piece of linked metal that guards a bare spot in armor, not a hamper for
  dirty clothes and not a plate of armor itself.'
examples:
- The knight's voider covered the gap under his arm.
- A voider of chain mail guarded the joint where the plates did not meet.
