simpleMeaning: A differential equation describing how smooth, repeating waves travel through a medium.
scope: In maths, this equation relates rates of change to describe waves travelling through a medium;
  it is not the wave itself.
examples:
- The physicist used the wave equation to describe waves travelling through water.
- A solution of the wave equation shows how a wave changes over time.
