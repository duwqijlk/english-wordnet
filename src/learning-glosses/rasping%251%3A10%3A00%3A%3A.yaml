simpleMeaning: saying words in a cross voice because you are annoyed
scope: Saying words in a cross voice; rasp is another name for this sense, and it is not the harsh sound
  of a voice itself, which is the adjective sense.
examples:
- His rasping grew louder as the argument went on.
- There was a lot of rasping in her voice when she told us to hurry.
