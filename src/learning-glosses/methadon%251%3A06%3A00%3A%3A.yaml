simpleMeaning: a man-made drug that dulls pain like morphine, but less likely to cause dependence; used
  to help people stop taking heroin and to keep them off it
scope: A man-made drug like morphine used to help people stop taking heroin, also called fixer, methadone,
  dolophine hydrochloride, methadone hydrochloride, and synthetic heroin; not morphine itself and not
  heroin.
examples:
- The doctor gave him methadon to help him stop taking heroin.
- Methadon is less likely than morphine to make people depend on it.
