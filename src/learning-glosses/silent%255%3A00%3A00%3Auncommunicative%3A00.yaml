simpleMeaning: not saying anything when others expect an answer or a reaction
scope: This is choosing not to answer when speech is expected, not being unable to speak and not something
  merely implied.
examples:
- The witness remained silent when the lawyer asked where he had been.
- When asked about the missing money, he stayed silent.
