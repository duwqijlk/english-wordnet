simpleMeaning: Said of a test or a question that gives a few set answers, and the right one is to be picked
scope: Said of a test or a question that gives a few set answers to pick the right one from, not a question
  that asks for an answer in your own words and not a question with only two answers to pick from.
examples:
- The exam had fifty multiple-choice questions.
- She got full marks on the multiple-choice test.
