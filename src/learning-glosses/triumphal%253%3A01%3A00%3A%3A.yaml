simpleMeaning: about a great win, or made to mark and praise a great win
scope: This sense is about a great win or made to mark one; it is not the feeling of being happy and proud
  because of a win.
examples:
- The city held a triumphal parade after the team won the cup.
- A triumphal arch stood at the end of the road the winners used.
