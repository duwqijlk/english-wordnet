simpleMeaning: a set of clothes for work, a jacket and a skirt or trousers that match
scope: A matching jacket with a skirt or trousers, worn for work; lounge suit and two-piece suit are other
  names for this sense, not a dress and not a suit with a waistcoat.
examples:
- She wore a two-piece to the job interview.
- His two-piece had a grey jacket and matching trousers.
