simpleMeaning: A heart-slowing drug (beta blocker) taken by mouth for high blood pressure and chest pain,
  with side effects of low mood and worse heart failure with fluid build-up.
scope: Also called atenolol; a heart-slowing drug taken by mouth for high blood pressure and chest pain,
  not a water pill for high blood pressure and not a blood-pressure drug that works by widening blood
  vessels.
examples:
- Her doctor gave her Tenormin for her high blood pressure.
- Tenormin slowed his heart but left him feeling low.
