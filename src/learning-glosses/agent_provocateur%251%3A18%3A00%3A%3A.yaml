scope: A secret worker who pushes people thought to be law-breakers to do unlawful things; provocateur
  is another name for this, not a spy who only watches and not a police officer who arrests people.
examples:
- The agent provocateur urged the group to break the law.
- Police used an agent provocateur to trap the gang.
