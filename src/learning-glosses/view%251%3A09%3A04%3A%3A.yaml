simpleMeaning: a belief or opinion of your own that is not based on proof or certainty
scope: This is a judgment held in the mind, not an opinion spoken out to others and not a picture.
examples:
- He holds the view that hard work always pays off.
- Their view of the newcomer was shaped by rumor rather than fact.
