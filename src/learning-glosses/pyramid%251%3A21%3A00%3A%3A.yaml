simpleMeaning: In the stock market, a set of deals where a buyer gets more shares, using the rising value
  of shares they own to borrow money for still more shares
scope: This is the set of deals itself, not the act of doing such deals, and not a solid shape with a
  flat base and sides that meet at a point.
examples:
- He built up a pyramid on the stock market, buying more shares as prices rose.
- The trader's pyramid grew as his rising shares let him borrow to buy still more.
