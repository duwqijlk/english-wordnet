simpleMeaning: Done in a hurry and without care for the small points, and left far from complete
scope: Done in a hurry and without care for the small points, and left far from complete; passing and
  casual are other names for this sense; not work that only looks at the surface of things.
examples:
- His superficial reading of the report left him with the wrong idea.
- A superficial look at the house hid the cracks in its walls.
