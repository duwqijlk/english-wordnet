simpleMeaning: An open railway wagon for goods, with no permanent sides or roof.
scope: An open railway wagon for goods, not a closed carriage for passengers, and not a home of several
  rooms.
examples:
- The timber was loaded onto a flat and taken to the port.
- A line of flats stood waiting in the rail yard.
