simpleMeaning: The act of touching a thing with the hands, or of using the hands or a machine with skill.
scope: The act of touching a thing with the hands or using them with skill, also called manipulation,
  not the carrying or moving of things by hand or machine.
examples:
- His handling of the violin showed years of practice.
- Gentle handling kept the old papers from tearing.
