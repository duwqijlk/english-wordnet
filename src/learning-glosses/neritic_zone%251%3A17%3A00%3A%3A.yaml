simpleMeaning: The sea water from the low tide mark out to a depth of about 100 fathoms.
scope: The sea water from the low tide mark out to a depth of about 100 fathoms, not the deep ocean and
  not the shore itself.
examples:
- The neritic zone runs from the low tide mark to deep water.
- Many fish live in the neritic zone near the shore.
