simpleMeaning: A Mediterranean herb living two years and bearing purple ray-flower heads on long stems,
  milky sap, with a long root to eat; naturalized across America.
scope: This sense is also called oyster plant and salsify, for a Mediterranean herb that lives two years,
  with milky sap, a long root to eat, and purple ray-flower heads on long stems, now naturalized all over
  the United States.
