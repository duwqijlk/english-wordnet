simpleMeaning: to make skin feel as if many small sharp points are touching it
scope: 'Also called prickle: to make skin feel small sharp points, not to stab or push with a pointed
  stick and not a mark cut into a surface.'
examples:
- The cold wind pricked at my skin and made it sting.
- The rough wool socks pricked her feet all morning.
