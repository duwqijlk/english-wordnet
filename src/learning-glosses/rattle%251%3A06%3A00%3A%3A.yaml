simpleMeaning: a toy for a baby that makes a short sharp noise when you shake it
scope: A baby's toy that makes a noise when shaken; not the hard parts on a rattlesnake's tail, and not
  a series of short loud sounds.
examples:
- The baby shook her rattle and laughed at the noise.
- He gave the crying baby a bright red rattle to hold.
