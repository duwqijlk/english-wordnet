simpleMeaning: a place where a road and a railway meet on flat ground, with gates that shut the road when
  a train comes
scope: A place where a road and a railway meet on flat ground, also called a level crossing, not a bridge
  over a railway and not a road that goes under one.
examples:
- The car stopped at the grade crossing while the train went past.
- They waited at the grade crossing until the gates went up.
