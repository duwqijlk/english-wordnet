simpleMeaning: a sea fish that lives at the bottom in warm water and has two thin feelers (barbels) on
  its chin
scope: This sea fish lives at the bottom in warm water and has feelers on its chin; it is not the food
  fish with a long thin body and not the flesh of such a fish.
examples:
- The mullet rested on the sand at the bottom of the warm sea.
- We saw a mullet with two small feelers under its chin.
