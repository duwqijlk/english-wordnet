simpleMeaning: Most of all in the face, gone red as if blood had rushed to it, because of strong feeling
  or hard work
scope: 'Also called red and flushed: a face gone red with feeling or hard work, not the deep red colour
  of a dress and not a face red from sunburn.'
examples:
- He went crimson with fury when he heard the news.
- She turned crimson with embarrassment at the party.
