simpleMeaning: the key on electric typewriters or computer keyboards that sends the typing position back
  to the start of a new line
scope: This is not a reply, a tennis shot, or a journey back; it is the key that starts a new line.
examples:
- Press the return key to start a new paragraph.
- On an old electric typewriter, the return key also moved the carriage.
