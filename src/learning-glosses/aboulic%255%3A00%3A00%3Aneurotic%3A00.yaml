simpleMeaning: unable in an odd, unhealthy way to act or make a decision
scope: This is being unable to act or decide in an odd, unhealthy way; abulic is another name for this
  sense, not just being slow to decide and not being too tired to act.
examples:
- The aboulic patient sat for hours, unable to choose what to eat.
- His aboulic state left him unable to start even the smallest task.
