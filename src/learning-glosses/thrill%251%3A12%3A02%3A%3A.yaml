senseId: 'thrill%1:12:02::'
synsetId: 07535351-n
simpleMeaning: a feeling of fear that is almost fun to feel
scope: Also called a shiver, a shudder, a chill, and a quiver, this is a feeling of fear that is almost
  fun, not the thing that brings a strong feeling and not the act of shaking with fear.
examples:
- A thrill of fear ran through him when the door creaked open in the dark.
- He felt a thrill as the ghost story reached its scariest part, and he liked the scare.
