simpleMeaning: A small group of unofficial advisers close to the leader of a country
scope: 'Also called a brain trust: a small group of unofficial advisers to a country''s leader, not a
  formal cabinet of ministers and not a piece of furniture.'
examples:
- The president relied on his kitchen cabinet for honest advice.
- Her kitchen cabinet met in private before the big decision.
