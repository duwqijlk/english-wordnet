simpleMeaning: In music, a machine that uses electric power to make sounds like a pipe instrument
scope: This is the electric music instrument, not the large pipe instrument played in churches, not the
  small instrument with reeds, and not a part of the body.
examples:
- She played the electronic organ at the wedding.
- The shop sells an organ that sounds like a big church organ.
