synsetId: 12223453-n
simpleMeaning: A tree of the genus Tilia that loses its leaves each year, with heart-shaped leaves and
  hanging clusters of yellow, often fragrant flowers; several are valued for their wood.
scope: This sense is the tree, not the wood cut from it; linden and basswood are other names for the same
  tree.
examples:
- They sat in the shade of a linden tree.
- The linden trees along the avenue were planted a century ago.
