simpleMeaning: A blood tube that feeds the belly and the muscles between the ribs.
scope: A blood tube that feeds the belly and the rib muscles; arteria musculophrenica is another name
  for it, not a blood tube that feeds the arm and not a vein.
examples:
- The musculophrenic artery runs along the lower ribs.
- Surgeons take care not to cut the musculophrenic artery.
