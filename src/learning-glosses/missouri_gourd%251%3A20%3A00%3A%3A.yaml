senseId: 'missouri_gourd%1:20:00::'
synsetId: 12182942-n
simpleMeaning: A vine that lives many years, of dry parts of the middle and south-west United States and
  Mexico, with small hard green fruit marked with spots that cannot be eaten
scope: Also called buffalo gourd, calabazilla, prairie gourd, prairie gourd vine, wild pumpkin and Cucurbita
  foetidissima; a long-lived vine of dry land with small hard inedible fruit, not a vine grown for food
  and not a vine of wet lands.
examples:
- The Missouri gourd grows in the dry parts of the United States.
- Missouri gourd fruit is small, hard and green, and cannot be eaten.
