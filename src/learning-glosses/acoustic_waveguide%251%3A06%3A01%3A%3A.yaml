simpleMeaning: a shape that leads sound waves along a set path
scope: This is a shape that leads sound waves along a set path, not a wire that carries electric signals
  and not a tube that moves water.
examples:
- The acoustic waveguide carried the sound from the speaker to the far room.
- A bend in the acoustic waveguide sent the sound around the corner.
