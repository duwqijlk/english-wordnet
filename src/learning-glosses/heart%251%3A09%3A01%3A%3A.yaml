simpleMeaning: The best, most needed or most important part of an idea or of something someone experiences.
scope: This is not the shape with two rounded lobes, the cut of meat or the playing card; it is the most
  valuable, central part of an idea or an experience.
examples:
- The heart of the matter is that neither side trusts the other.
- 'We argued about details for hours, but the heart of her argument was simple: people need hope.'
