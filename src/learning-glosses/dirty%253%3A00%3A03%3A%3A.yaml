simpleMeaning: Describing something that spreads contamination through its surroundings, radioactivity
  above all.
scope: Spreading pollution or contamination, chiefly radioactive — another name for contaminating — not
  merely marked with grime and not infected with germs.
examples:
- A dirty bomb would scatter radioactive material across the city.
- The soil near the old reactor is still too dirty to farm.
