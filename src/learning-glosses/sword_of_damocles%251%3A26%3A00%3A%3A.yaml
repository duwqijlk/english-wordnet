simpleMeaning: A danger that is always there and may happen at any time.
scope: A danger that is always near and may happen at any time, not a real sword and not a danger that
  has already passed.
examples:
- The threat of losing his job was a sword of Damocles over him.
- They lived under the sword of Damocles, never knowing when trouble would come.
