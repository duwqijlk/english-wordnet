simpleMeaning: the share of rented rooms or flats that stand empty at one time, out of every hundred
scope: The share of rented rooms that stand empty at one time, not the share that are full and not the
  price of rent.
examples:
- The vacancy rate in the town fell as more rooms were let.
- Hotels report a high vacancy rate in the quiet months.
