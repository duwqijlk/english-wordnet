simpleMeaning: A negative electrode that gives off electrons when light falls on it.
scope: A part that gives off electrons when light falls on it, not a part that gives off light and not
  an ordinary wire.
examples:
- The photocathode gives off electrons when light hits it.
- In the old camera tube, a photocathode turned light into a stream of electrons.
