senseId: 'dialectic%1:09:00::'
synsetId: 06173264-n
simpleMeaning: A set way of thinking that reaches the truth by putting clear arguments against each other.
scope: A formal way of reasoning that reaches truth through the exchange of arguments, not a clash of
  ideas itself and not the adjective for things of this kind.
examples:
- Hegel's dialectic shaped much of modern thought.
- The dialectic of question and answer led them to the truth.
