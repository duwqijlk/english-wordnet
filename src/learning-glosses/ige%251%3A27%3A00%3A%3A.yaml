simpleMeaning: One of the five main kinds of immunoglobulin, a protein that helps the body fight germs,
  found chiefly in the skin and the wet linings of the body.
scope: One of the five main kinds of immunoglobulin, also called immunoglobulin E; not one of the other
  four kinds.
examples:
- The test looked for IgE, one of the five main kinds of immunoglobulin.
- The test measured IgE in her blood.
