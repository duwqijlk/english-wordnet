simpleMeaning: a rope thrown from a ship for people in the water to hold on to so they do not drown
scope: A rope thrown from a ship for people in the water to hold on to; not the line on a person's palm,
  not the rope for a diver, and not help that keeps people going.
examples:
- He threw the lifeline to the man in the water.
- She clung to the lifeline until the crew pulled her aboard.
