simpleMeaning: working as a ruler, with power to rule a country
scope: Describes someone who is ruling a country for a time. It is not the noun, which names that person.
examples:
- As prince-regent, he signed laws in place of the king.
- She served in a regent role while the queen was too ill to rule.
