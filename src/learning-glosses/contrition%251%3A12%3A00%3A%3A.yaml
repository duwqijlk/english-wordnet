simpleMeaning: sadness for a wrong done against God, because of fear of being punished forever after death
scope: 'Also called attrition and contriteness: deep sadness for a wrong against God because of fear of
  punishment after death, not just feeling sorry for a mistake in daily life.'
examples:
- He felt deep contrition for his sins and prayed for hours.
- Her contrition came from a real fear of hell.
