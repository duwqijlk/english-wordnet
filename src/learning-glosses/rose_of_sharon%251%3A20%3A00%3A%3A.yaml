simpleMeaning: An Asian shrub or small shrubby tree with showy bell-shaped pink, purple, or white flowers
  and usually three-lobed leaves; widely grown in temperate North America and Europe.
scope: Also called Hibiscus syriacus; an Asian shrub with showy bell-shaped flowers, not a rose and not
  a tree of the tropics.
examples:
- The rose of Sharon blooms with showy bell-shaped flowers in late summer.
- They planted a rose of Sharon by the gate for its purple flowers.
