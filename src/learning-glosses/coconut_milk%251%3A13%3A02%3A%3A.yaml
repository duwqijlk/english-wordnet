simpleMeaning: A white liquid squeezed from the fresh white flesh inside a big tropical nut.
scope: This is a white liquid squeezed from the fresh white flesh inside a big tropical nut; coconut cream
  is another name for it, not the clear water inside the nut and not cream from milk.
examples:
- He poured coconut milk over the rice.
- Coconut milk made the soup rich and white.
