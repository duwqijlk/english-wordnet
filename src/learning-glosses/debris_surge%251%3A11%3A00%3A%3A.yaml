synsetId: 07455011-n
simpleMeaning: when a building falls down, its dust and broken bits rush out all at once
scope: This is dust and broken bits rushing out all at once from a falling building, also called a debris
  storm; not a rush of water and not a storm of wind and rain.
examples:
- The debris surge rose in a great cloud when the roof fell in.
- Rescue workers waited for the debris surge to settle before they moved in.
