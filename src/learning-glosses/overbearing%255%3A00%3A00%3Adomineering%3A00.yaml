simpleMeaning: expecting people to do what you say, with no questions asked
scope: 'Also called authoritarian and dictatorial: this is about expecting people to obey with no questions,
  not about feeling proud and looking down on people you think are worth less.'
examples:
- His overbearing boss told the staff to work late and let no one ask why.
- The overbearing teacher would not let the class ask any questions.
