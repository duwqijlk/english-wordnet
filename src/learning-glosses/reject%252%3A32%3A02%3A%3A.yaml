simpleMeaning: to say no to someone or something while showing you think they are worthless
scope: To turn someone or something away while showing you think they are worthless, not to dismiss someone
  from a contest, not to refuse entry, and not a body pushing out foreign tissue.
examples:
- She rejected his offer with a laugh, as if it were worth nothing.
- He rejected the cheap gift, showing he thought it was worthless.
