simpleMeaning: In football, an official who stands down the ground behind the back line of players who
  stop passes, on the same side as the official who watches the line
scope: An official in football who works far down the ground behind the back line of defenders, not the
  official who starts the play and not the one who watches the line from the side.
examples:
- The field judge ran down the sideline to watch the pass.
- A field judge signals when a catch is made deep down the ground.
