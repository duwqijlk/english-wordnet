simpleMeaning: A tall plant from Europe and Asia that lives for years, with leafy stems and white flowers,
  now wild in many places and often put in the group Chrysanthemum.
scope: This is the tall white-flowered plant that lives for years, also called marguerite, ox-eyed daisy,
  oxeye daisy, or white daisy — not other daisies that grow low or have yellow flowers.
examples:
- The moon daisy by the fence has tall leafy stems and white flowers.
- Moon daisies grow wild along the road here.
