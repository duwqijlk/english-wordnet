simpleMeaning: In western Texas and the mountains of Mexico grows a small tree whose wide-spreading limbs
  end in thin twigs that hang down.
scope: This small tree grows in western Texas and the mountains of Mexico, and its thin branch ends hang
  down from wide-spreading limbs.
examples:
- The drooping juniper by the trail had thin branches that hung down.
- Drooping junipers grow in the mountains of Mexico as well as in western Texas.
