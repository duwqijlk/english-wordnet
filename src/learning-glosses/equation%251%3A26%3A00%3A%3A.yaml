simpleMeaning: a state in which two things are much the same in value or amount, and evenly matched
scope: A state in which two things are much the same in value, also called par or equality; not a maths
  statement that two sums are equal.
examples:
- There was an equation of strength between the two armies.
- The equation of the two offers made the choice hard.
