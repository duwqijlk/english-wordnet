simpleMeaning: an amount or a number that goes down fast and far in a short time
scope: 'Also called a dip, a drop or a fall: a sharp decrease in an amount, not a person or thing falling
  through the air and not a drop of water.'
examples:
- When the news broke, the price of their stock went into free fall.
- The company's sales went into free fall after the factory closed.
