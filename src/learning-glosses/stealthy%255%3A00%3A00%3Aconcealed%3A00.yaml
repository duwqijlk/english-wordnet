simpleMeaning: Done with care and without sound, in a way that hides what you are doing from other people
scope: 'Also called sneak, sneaky, furtive and surreptitious: quiet, careful and secret so no one sees
  you; not loud or open for all to see.'
examples:
- With stealthy steps, the cat moved toward the bird.
- He gave a stealthy look at the papers on the desk and then looked away.
