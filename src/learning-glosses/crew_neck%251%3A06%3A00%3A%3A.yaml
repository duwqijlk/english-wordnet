simpleMeaning: A plain, straight opening at the top of a sweater, running from one shoulder to the other
scope: A plain straight opening at the top of a sweater, also called a crew neckline; not a V-shaped opening
  and not a high collar.
examples:
- His sweater had a plain crew neck.
- She likes a crew neck on her winter sweaters.
