simpleMeaning: A lasting plant of coastal sands and shingles of north Europe, Baltic and Black Seas, with
  small white flower clusters and big fleshy blue-green leaves often used as potherbs.
scope: This sense is also called sea kale, for a lasting plant of coastal sands and shingles of north
  Europe, Baltic and Black Seas.
examples:
- Sea coles grow on coastal sands.
- Sea cole leaves serve as potherbs.
