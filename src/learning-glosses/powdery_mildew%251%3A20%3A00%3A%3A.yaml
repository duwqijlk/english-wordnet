simpleMeaning: Any of a group of tiny living things of the group called Erysiphe that make dust-like bits
  on the outside of the plant they live on
scope: This is any of a group of tiny living things that make dust-like bits on the outside of the plant
  they live on, not a single kind of mould and not plain dust on the leaves.
examples:
- The powdery mildew left white dust on the leaves.
- Powdery mildew spread over the rose leaves.
