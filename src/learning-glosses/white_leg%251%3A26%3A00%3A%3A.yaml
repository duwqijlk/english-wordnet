simpleMeaning: a painful blood clot in a vein of the thigh that comes after a woman gives birth
scope: 'Another name for milk leg and phlegmasia alba dolens: a sore clot in a thigh vein after childbirth,
  not a broken bone and not a swelling from a bite.'
examples:
- The doctor said the white leg was caused by a clot in the vein.
- She could not walk far because of the pain of her white leg.
