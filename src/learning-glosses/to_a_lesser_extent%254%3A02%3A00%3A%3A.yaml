simpleMeaning: Used to make the comparative form of some describing words, to show that a thing has less
  of a quality
scope: Used to show less of a quality in a comparison; less is another name for this sense, and not the
  phrase that shows more of a quality.
examples:
- He was tired to a lesser extent after resting.
- The plan worked to a lesser extent than we had hoped.
