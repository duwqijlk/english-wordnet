simpleMeaning: a plant that grows upward by means of small growths that come out of its stem, as ivy does
scope: A plant that grows upward by means of small growths that come out of its stem; not a plant that
  twines round a support, and not a plant that climbs by tendrils.
examples:
- Ivy is a root climber, gripping the wall as it rises.
- The root climber covered the old wall.
