simpleMeaning: a person who sings, most often one who adds extra notes to a song
scope: This sense is a person who sings, usually with extra notes in the song, not the small bird that
  sings.
examples:
- The warbler sang the old song with many extra turns.
- As a warbler, she added soft high notes to each line of the song.
