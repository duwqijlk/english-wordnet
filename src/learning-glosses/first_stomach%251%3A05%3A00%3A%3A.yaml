simpleMeaning: The opening chamber of the belly of a cud-chewing animal, where food is held and sent back
  to the mouth to be chewed again
scope: This is the opening chamber of the belly of a cud-chewing animal; rumen is another name for this
  sense, not the later chambers and not the whole belly.
examples:
- The first stomach held the grass for chewing.
- Food passed into the first stomach first.
