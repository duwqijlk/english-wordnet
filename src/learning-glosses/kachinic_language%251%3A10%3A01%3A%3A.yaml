simpleMeaning: A group of Tibeto-Burman tongues spoken in the far north of Burma and in nearby parts of
  China and India
scope: Also called Kachin, Kachin language, or Kachinic; these are the tongues of northernmost Burma and
  nearby lands, not the Kamarupan group of tongues.
examples:
- Kachinic language is spoken near the China border.
- He speaks Kachinic language at home.
