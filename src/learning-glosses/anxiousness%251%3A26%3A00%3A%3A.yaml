simpleMeaning: In psychiatry, worry and nerves that stay for a long time with other mind troubles, usually
  with acts done again and again or sudden attacks of strong fear
scope: Also called anxiety, this is the lasting state named in psychiatry; it is not a mild, short feeling
  of worry about what might happen.
examples:
- His anxiousness grew worse, and he began to have sudden attacks of fear.
- The doctor treated her anxiousness along with her other troubles of the mind.
