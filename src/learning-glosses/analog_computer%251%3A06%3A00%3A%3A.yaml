simpleMeaning: Working with amounts that change, this machine shows facts by where a needle points or
  how strong a voltage is.
scope: This is a machine that turns facts into amounts that change, also called an analogue computer.
examples:
- The analog computer used a needle to show the pressure.
- Our analog computer showed the wind speed as a voltage.
