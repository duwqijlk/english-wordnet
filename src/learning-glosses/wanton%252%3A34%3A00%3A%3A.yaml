simpleMeaning: to start spending and using far too much, and to give yourself far too much pleasure and
  comfort
scope: 'Another name for luxuriate: to live with far too much pleasure and comfort, not to behave in a
  cruel way and not to waste time doing nothing.'
examples:
- At the palace, they wantoned in silk beds and rich meals.
- She wantoned in hot baths and fine wine for days.
