simpleMeaning: not fit to talk about, or not allowed as a subject of talk
scope: Not fit or not allowed to be talked about; not the noun sense, which is a piece of clothing worn
  under other clothes.
examples:
- He used an unmentionable word in front of the children.
- At that house, money was an unmentionable subject at the dinner table.
