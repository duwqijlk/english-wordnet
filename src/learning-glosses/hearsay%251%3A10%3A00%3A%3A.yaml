senseId: 'hearsay%1:10:00::'
synsetId: 07238110-n
simpleMeaning: talk passed from person to person by speaking, usually a mix of what is true and what is
  not true
scope: 'Also called rumor and rumour: talk people pass on by speaking, not something a person saw for
  himself and not a proven fact.'
examples:
- I would not believe that story; it is only hearsay from people in the market.
- She repeated the hearsay about the new shop, but no one knew if it was true.
