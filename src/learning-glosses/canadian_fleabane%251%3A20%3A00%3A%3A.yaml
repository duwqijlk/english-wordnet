simpleMeaning: A common weed of North America with straight leaves and small round heads of yellowish
  flowers; widely settled through warm and cool lands; sometimes placed in the genus Erigeron.
scope: 'Also called fleabane, horseweed, Conyza canadensis, and Erigeron canadensis: a common weed of
  North America with small yellowish flower heads, not a garden flower and not a tall shrub.'
examples:
- Canadian fleabane spread along the dry roadside.
- We pulled Canadian fleabane from the garden beds.
