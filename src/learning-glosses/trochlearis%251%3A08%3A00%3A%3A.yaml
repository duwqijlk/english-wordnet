simpleMeaning: a nerve, one of two, one on the left and one on the right, that controls the muscles that
  move the eyes
scope: This is a nerve that controls eye muscles; also called trochlear, trochlear nerve and fourth cranial
  nerve. Not a nerve that carries sight and not a muscle of the eye.
examples:
- The trochlearis carries signals to the muscle that turns the eye.
- A hurt trochlearis can make one eye turn wrong.
