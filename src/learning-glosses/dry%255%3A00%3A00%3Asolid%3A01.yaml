simpleMeaning: Said of a substance in its solid form, as opposed to its liquid form.
scope: This is about the solid form of a substance rather than the liquid form; it is not about something
  that has lost its moisture, and not about food served without sauce.
examples:
- Mix the dry ingredients in a separate bowl before adding the milk.
- The label gives the dry weight of the product.
