simpleMeaning: It looks much like a creature with claws and a curved tail that stings, yet this eight-legged
  animal has a long thin tail with no sting and no poison.
scope: Also called whip scorpion, it only looks like the stinging creature with claws; its long thin tail
  has no sting and no poison.
examples:
- The whip-scorpion waved its long thin tail but could not sting.
- A whip-scorpion hid under the rock, its tail curled behind it.
