simpleMeaning: a large object in space that moves around a star and is neither a comet nor a moon.
scope: This is a body that circles a star, not a star itself, and not a comet or a moon.
examples:
- Mars is the fourth planet from the sun.
- Astronomers have found planets orbiting distant stars.
