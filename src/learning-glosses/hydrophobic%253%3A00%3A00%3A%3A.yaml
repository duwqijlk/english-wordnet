simpleMeaning: Water does not wet it, nor does it come apart or mix in water; it pushes water away and
  does not soak it up, and is not drawn to water.
scope: This word is used of things that push water away.
examples:
- The hydrophobic coat sheds rain.
- Wax is hydrophobic and keeps the water out.
