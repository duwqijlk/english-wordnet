simpleMeaning: the back part of a shoe or boot, made of leather
scope: This is the leather back of a shoe or boot, not a shop table and not dining-room furniture.
examples:
- The counter of his boot was worn and soft.
- A stiff counter helps hold the back of the shoe in shape.
