scope: A long-lived plant of the south-east of the United States with leaves that smell of vanilla, also
  called wild vanilla, not the vanilla plant grown for its pods.
examples:
- The leaves of Trilisa odoratissima smell of vanilla.
- Trilisa odoratissima comes back year after year in the south-east.
