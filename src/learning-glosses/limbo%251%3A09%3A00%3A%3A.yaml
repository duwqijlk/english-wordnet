simpleMeaning: In theology, in Roman Catholic belief, the place for souls of babies and good people who
  did no wrong and were not baptized (washed with water to join the church)
scope: This is a place in Roman Catholic belief for souls after death, not the dance done under a low
  bar and not a state of being left waiting with no clear result.
examples:
- In old church teaching, a baby who died without baptism was said to go to limbo.
- The priest explained limbo as a place for good souls who were not baptized.
