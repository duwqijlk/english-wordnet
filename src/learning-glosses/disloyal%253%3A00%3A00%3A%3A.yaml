simpleMeaning: not supporting a leader, cause, or belief you should support, or not doing the duty you
  owe to them
scope: Not supporting a leader, cause, or belief you should support, or not doing the duty you owe to
  them. It is not just failing to obey an order, and not just lying.
examples:
- Disloyal aides told the newspapers his private mistakes.
- A disloyal member shared the group's plans with its enemies.
