simpleMeaning: A hormone from the back pituitary gland and nerve ends in the hypothalamus; it raises blood
  pressure by tightening blood vessels and cuts urine flow by helping kidneys hold water.
scope: Not other hormones from the pituitary gland, nor other substances that change blood pressure or
  urine flow; also called antidiuretic hormone, vasopressin, and Pitressin.
examples:
- ADH helps the body hold water.
- Doctors measure ADH when blood pressure is low.
