simpleMeaning: A drug used to treat people who drink too much alcohol; it makes them feel sick and vomit
  if they drink alcohol.
scope: This is a drug used to treat people who drink too much alcohol, also called disulfiram; not a painkiller
  and not a drug for sleep.
examples:
- The doctor gave him Antabuse to help him stop drinking.
- He took Antabuse and felt sick after one drink.
