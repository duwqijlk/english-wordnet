simpleMeaning: a fifteen-year round used as a unit for counting years in old Rome, later taken up in some
  kingdoms of the Middle Ages
scope: A fifteen-year round used to count years in old Rome and some medieval kingdoms, not a single year
  and not a king's reign.
examples:
- The scribe dated the deed by the indiction of that year.
- An indiction lasted fifteen years in old Rome.
