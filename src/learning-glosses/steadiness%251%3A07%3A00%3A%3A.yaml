simpleMeaning: the quality of being fixed firmly in one place so that it cannot be moved
scope: 'Also called firmness: the quality of being fixed firmly in one place; not a firm purpose that
  does not change, and not a regular speed or movement that stays the same.'
examples:
- He checked the steadiness of the ladder before he climbed it.
- The steadiness of the table made it safe to work on.
