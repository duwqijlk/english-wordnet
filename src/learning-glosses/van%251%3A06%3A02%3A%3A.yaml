simpleMeaning: a closed railway carriage used for carrying luggage or goods.
scope: This is a railway carriage for luggage or goods, not a road vehicle and not a creative group of
  artists.
examples:
- The guard put our suitcases in the van at the back of the train.
- A long goods van stood alone on a side track.
