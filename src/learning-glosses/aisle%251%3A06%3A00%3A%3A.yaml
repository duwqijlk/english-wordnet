simpleMeaning: A walkway between rows of seats in a hall or a bus or train, or between rows of shelves
  in a shop
scope: A walkway between rows of seats or shelves, not the side part of a church and not a narrow path
  through trees or a cave.
examples:
- She walked down the aisle to find her seat.
- The shop's widest aisle held the bread and milk.
