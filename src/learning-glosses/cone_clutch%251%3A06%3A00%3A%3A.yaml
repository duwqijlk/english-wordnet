simpleMeaning: A gripping device in which the parts that rub together taper to a point
scope: A gripping device whose rubbing parts taper to a point, also called a cone friction clutch, not
  a flat gripping device and not a brake.
examples:
- The old car used a cone clutch to join the engine to the wheels.
- A cone clutch grips by pressing two tapering parts together.
