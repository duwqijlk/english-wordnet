senseId: 'inlay%1:06:00::'
synsetId: 03577600-n
simpleMeaning: a pattern that makes a surface look nice, made by putting pieces of wood in a way that
  fits into cut spaces in that surface
scope: This is a pattern in wood set into a surface to make it look nice, not a hard filling put into
  a hole in a tooth to fix it.
examples:
- The table top has a beautiful inlay of dark wood.
- He made an inlay of light wood shapes in the door.
