simpleMeaning: an open area dug in the ground to take out stone or slate (a hard grey rock used for roofs)
scope: An open place dug to get stone or slate, not a coal mine with its buildings and not a hollow in
  a surface.
examples:
- Workers dug stone from the pit all day.
- They opened a new pit to take slate out of the ground.
