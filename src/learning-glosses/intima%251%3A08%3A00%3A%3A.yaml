simpleMeaning: The soft wall inside a blood tube, or inside a tube that carries clear fluid, is the innermost
  skin of a body part
scope: The innermost layer of a body part, not the outer skin and not the middle layer of a blood tube
  wall.
examples:
- The intima lines the inside of the artery.
- Damage to the intima can narrow the blood vessel.
