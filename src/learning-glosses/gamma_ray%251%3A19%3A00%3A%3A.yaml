simpleMeaning: Very short waves of power given off when atoms break down, far shorter than waves of light
scope: These are very short waves of power given off when atoms break down, far shorter than waves of
  light; gamma radiation is another name for this sense, not light you can see and not sound waves.
examples:
- A gamma ray is given off when atoms break down.
- Gamma rays have waves far shorter than light.
