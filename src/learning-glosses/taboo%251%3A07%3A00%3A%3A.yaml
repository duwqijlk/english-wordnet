simpleMeaning: a ban or a strong feeling that stops people from doing or saying something, coming from
  group custom or from a strong dislike
scope: This is a general ban that comes from group custom or strong dislike, not the special ban in South
  Pacific islands on using something held sacred, and not the act of declaring something forbidden.
examples:
- In their family, talking about money at dinner was a taboo.
- There is a strong taboo against asking about her past.
