senseId: 'paranoic_type_schizophrenia%1:26:00::'
synsetId: 14423256-n
simpleMeaning: 'A mental disorder with false beliefs: being pursued, important or cheated on; anger, worry,
  coldness and gender confusion arise, yet they seem fine and cope normally unless acting on them.'
scope: The same delusion-dominated form as paranoid schizophrenia, under an older name; it is not the
  separate condition paraphrenia.
examples:
- The older case notes described her as having paranoic type schizophrenia, with jealousy centred on her
  spouse.
- Paranoic type schizophrenia can look like ordinary functioning until the delusions begin to shape daily
  decisions.
