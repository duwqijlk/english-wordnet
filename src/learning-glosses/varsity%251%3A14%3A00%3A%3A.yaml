simpleMeaning: a British short form of the word 'university'; it usually means Oxford University or Cambridge
  University
scope: In Britain, a short form of 'university', usually meaning Oxford or Cambridge; it is not the name
  of a school sports team.
examples:
- She still calls Oxford 'the varsity' when she talks about her student days.
- In Britain, people sometimes use varsity to mean Cambridge University.
