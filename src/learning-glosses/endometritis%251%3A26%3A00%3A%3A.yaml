simpleMeaning: a sore, swollen state of the thin inner skin of the womb
scope: 'Also called metritis: a sore, swollen state of the thin inner skin of the womb, not a sore state
  of the womb''s outer wall and not a sore state of any other part of the body.'
examples:
- She was treated for endometritis after the lining of her womb became sore and swollen.
- Endometritis made the inner skin of her womb sore after the birth.
