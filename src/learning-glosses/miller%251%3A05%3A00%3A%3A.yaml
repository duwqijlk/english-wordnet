simpleMeaning: any of several kinds of moth with wings that look as if they are covered with fine powder
scope: This is a moth with powdery wings, not a person who works in a mill, especially a grain mill, and
  not a machine tool that cuts metal into shape.
examples:
- A pale miller flew around the lamp, its wings dusty with powder.
- Several millers rested on the wall near the light at night.
