simpleMeaning: a mill driven by people or animals walking on a round moving belt or climbing steps
scope: This is a mill driven by people or animals walking on a round belt or climbing steps; treadwheel
  and treadmill are other names for this sense. Not a mill driven by water or wind.
examples:
- The old tread-wheel ground the grain as the ox walked round and round on the belt.
- Prisoners once worked a tread-wheel by climbing its steps all day.
