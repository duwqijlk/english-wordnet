simpleMeaning: a round plate inside the part that mixes fuel and air in an engine, which turns to let
  in more or less of the mix
scope: A round plate inside the part that mixes fuel and air in an engine, which turns to let in more
  or less of the mix, not a tap on a pipe and not a plate that stays still.
examples:
- The butterfly valve stuck and the engine would not start.
- He cleaned the butterfly valve in the carburettor.
