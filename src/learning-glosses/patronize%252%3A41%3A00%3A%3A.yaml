simpleMeaning: to buy things from a place or use what it sells, as one of its customers
scope: To buy things from a place or use what it sells as a customer, with shop, frequent and sponsor
  as other names for this sense; not to treat someone as less than you.
examples:
- They patronize the little shop on the corner.
- We patronize that café every Sunday morning.
