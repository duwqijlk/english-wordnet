simpleMeaning: Too quick to think, without good cause, that a rival will take your place, or afraid that
  this will happen
scope: 'Also called jealous or green-eyed: too quick to think, without good cause, that a rival will take
  your place, not a fair fear based on clear facts and not plain anger.'
examples:
- His overjealous watch over her every move wore her down.
- She grew overjealous when a new colleague joined the team.
