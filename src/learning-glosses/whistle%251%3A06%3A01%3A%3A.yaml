simpleMeaning: A device that makes a loud, high sound when air or steam is pushed against an edge or into
  a hollow space
scope: The device itself, which makes a loud, high sound when air or steam is pushed against an edge or
  into a hollow space. It is not the act of giving a signal and not the sound on its own.
examples:
- The steam whistle on the old boat made a loud, high sound.
- A whistle on the factory roof used steam to warn the workers.
