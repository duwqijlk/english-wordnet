simpleMeaning: A thin skin that wraps around a nerve fibre.
scope: A thin skin around a nerve fibre, with neurilemma as another name for this sense, not the fatty
  coat that speeds signals along a nerve and not the nerve fibre itself.
examples:
- The neurolemma wraps the nerve fibre like a thin skin.
- Damage to the neurolemma can slow signals along the nerve.
