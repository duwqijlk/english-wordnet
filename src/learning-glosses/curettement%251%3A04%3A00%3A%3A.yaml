simpleMeaning: Surgery in which a scraping tool clears tissue or growths from a hollow place in the body,
  such as the womb.
scope: Also called curettage, this surgery scrapes tissue or growths from a hollow place in the body,
  not surgery that cuts them out with a knife.
examples:
- Curettement cleared the growths from her womb.
- The curettement scraped tissue from the hollow place in her body.
