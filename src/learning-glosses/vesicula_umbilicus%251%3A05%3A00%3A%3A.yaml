simpleMeaning: A thin-walled bag that works as the blood system in a mammal before it is born, until its
  heart starts to work.
scope: A thin-walled bag that serves as the blood system of a mammal before it is born; umbilical vesicle,
  vitelline sac and yolk sac are other names for this sense; not the womb itself and not the cord.
examples:
- The vesicula umbilicus works as the blood system of the mammal before it is born.
- The vesicula umbilicus fades once the heart starts to work.
