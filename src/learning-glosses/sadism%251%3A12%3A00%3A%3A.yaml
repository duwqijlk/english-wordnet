simpleMeaning: pleasure in sex that a person gets from hurting other people, in the body or in the mind
scope: This is sexual pleasure from hurting others, not pleasure from being hurt yourself and not hurting
  others outside sex.
examples:
- He took pleasure in sex from hurting his partner, and doctors described this as sadism.
- Sadism was the name given to her need to hurt others to feel sexual pleasure.
