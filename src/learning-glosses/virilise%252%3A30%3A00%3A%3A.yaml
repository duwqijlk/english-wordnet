simpleMeaning: Hormone treatment or a hormone upset can leave a person with male traits.
scope: Also called masculinize, masculinise, and virilize, this is a change in which a person takes on
  male traits through a hormone upset or hormone treatment.
examples:
- The drugs virilised the teenage girl, giving her male traits.
- Hormone treatment can virilise a patient.
