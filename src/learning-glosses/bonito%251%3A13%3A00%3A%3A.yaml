simpleMeaning: the meat of a group of sea fish found mostly in the Pacific, eaten as food, in the same
  family as tuna but smaller than tuna
scope: This is the meat of the fish as food, not the whole live fish and not the dried flakes of a related
  fish used in Japanese cooking.
examples:
- We ate grilled bonito with rice for dinner.
- The market sells fresh bonito from the Pacific.
