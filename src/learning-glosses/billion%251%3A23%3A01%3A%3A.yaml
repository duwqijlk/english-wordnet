simpleMeaning: the number written as a one followed by twelve zeros; this was the old British value, though
  the American value is now often used in Britain too.
scope: This is not the modern American value of one thousand million; it is the older, larger value of
  a million million.
examples:
- Under the old British system, a billion was a one followed by twelve zeros.
- Historians writing in 1900 used billion to mean a million million.
