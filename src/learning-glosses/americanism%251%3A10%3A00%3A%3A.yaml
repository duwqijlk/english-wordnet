simpleMeaning: A word or way of speaking that marks English as spoken by people of the United States.
scope: A word or way of speaking that marks English as spoken by people of the United States, as distinct
  from American spelling, which covers how such words are written.
examples:
- An Americanism is a word that marks English as spoken in the United States.
- '''Gotten'' is an Americanism.'
