simpleMeaning: Looked at more than any other of its kind, this tiny germ was the first found, in 1892,
  and makes the leaves of the plant it is named for patchy.
scope: Among plant germs, this is the one found first, in 1892, and looked at more than any other.
examples:
- The tobacco mosaic virus made the leaves of the plant patchy.
- The tobacco mosaic virus was first found in 1892.
