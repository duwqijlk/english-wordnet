simpleMeaning: A brave person does great deeds, and a long story told in verse tells of them
scope: A long story in verse about a brave person's great deeds, also called an epic, an epic poem, or
  an epos, not a short lyric poem and not a play about a hero.
examples:
- The class read a heroic poem about a warrior who saved his city.
- That heroic poem tells of the hero's journey across the sea.
