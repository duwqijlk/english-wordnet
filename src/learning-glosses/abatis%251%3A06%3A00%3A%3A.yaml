simpleMeaning: a line of defence to hold back an enemy, made of cut-down or living trees whose branches,
  sharpened or wound with barbed wire, point at the foe
scope: 'Also called abattis: a barrier of trees to hold back an enemy, not a fence round a field and not
  a wall of stone.'
examples:
- The soldiers built an abatis of felled trees across the road.
- Branches in the abatis pointed toward the enemy.
