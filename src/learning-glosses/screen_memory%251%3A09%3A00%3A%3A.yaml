simpleMeaning: a made-up thought about something from childhood that covers up a real past event that
  was painful to think about
scope: This is a false childhood memory that hides a painful real one; not a true memory of childhood
  and not an ordinary bad dream.
examples:
- She had a screen memory of playing in a garden, but it hid a much harder time in her childhood.
- His screen memory of a birthday party covered a day he did not want to recall.
