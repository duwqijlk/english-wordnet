simpleMeaning: A cassava plant with long thick roots for eating and soft stems that break easily; used
  especially to make cassiri (a drink that makes people drunk) and tapioca
scope: This plant is also called gari, bitter cassava, mandioc, mandioca and tapioca plant; it is not
  the starch food made from its root and not the root eaten as food.
examples:
- Farmers grow manioc for its long roots.
- They used manioc to make tapioca for the market.
