simpleMeaning: a creeping, fragrant mint-family plant from Europe, with round leaves and small purple
  flowers, often grown in hanging baskets, naturalized in North America, sometimes classed in genus Nepeta.
scope: Another name for the same creeping mint; it is not a bird.
examples:
- Runaway robin formed a low mat of round leaves along the garden path.
- The trailing stems of runaway robin were covered with small purple flowers.
