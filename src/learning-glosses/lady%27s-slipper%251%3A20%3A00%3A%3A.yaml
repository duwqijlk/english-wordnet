simpleMeaning: Gardeners find it hard or impossible to grow this wildflower of the Americas, one of several
  kinds whose lower lip swells into a pouch.
scope: One of several kinds of wildflower from the Americas, also called ladies' slipper, lady's slipper,
  lady-slipper, lady slipper, and slipper orchid, this one has a lower lip that swells into a pouch, and
  gardeners find it hard or impossible to grow.
examples:
- A lady's-slipper bloomed beside the trail.
- We tried a lady's-slipper in the garden, and it would not grow.
