simpleMeaning: Flat strips of pasta that are wider than linguine, which is a similar pasta in less wide
  flat strips
scope: Also called fettuccini, this is pasta in wide flat strips, not the thinner flat strips of linguine
  and not round strips like spaghetti.
examples:
- We ate fettuccine with a white cheese sauce for dinner.
- She cooked the fettuccine in a large pot of hot water.
