simpleMeaning: This measures, in physics, how much light or other rays get through a substance.
scope: Also called absorbance, photographic density, and transmission density, this is a measure of how
  much light a substance lets through.
examples:
- The optical density of the glass told how much light it let through.
- They measured the optical density of the film.
