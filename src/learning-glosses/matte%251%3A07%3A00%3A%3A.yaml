senseId: 'matte%1:07:00::'
synsetId: 04963287-n
simpleMeaning: Something looks this way when light and dark hardly change across it, and no part of it
  is bright or shiny.
scope: The look of a thing with almost no play of light and dark and no shine, also called matt and mat,
  not the mix formed when metal rock is heated, and not the act of making a thing felt-like.
examples:
- The matte finish of the paint gave the wall a soft look.
- She liked the matte surface of the old photo.
