simpleMeaning: Not having the body or mind strength, and likely to fail when put under pressure, stress,
  or strain
scope: Lacking strength of body or mind and likely to fail under pressure, stress, or strain, not the
  powerlessness shown by not being able to act at all.
examples:
- His weakness increased as he became older.
- The weakness of the span was overlooked until it collapsed.
