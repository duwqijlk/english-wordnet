simpleMeaning: a fast, unbroken rattle from quick repeated beating, a snare in particular
scope: A fast, unbroken rattle from quick repeated beating, a snare in particular, also called a roll
  and a paradiddle; not a single beat and not a slow march beat.
examples:
- A drum roll announced the arrival of the mayor.
- The drum roll grew louder as the curtain rose.
