simpleMeaning: to make something that is moving go more slowly and with less force
scope: This is about slowing a moving thing and making it weaker, not making feelings or sounds weaker
  and not making a picture less clear.
examples:
- He used the brakes gently to deaden the car's speed.
- Soft, deep sand deadened the cart's movement as it rolled.
