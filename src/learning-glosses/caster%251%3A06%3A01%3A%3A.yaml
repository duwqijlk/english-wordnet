simpleMeaning: a container with holes in its top, used for shaking out sugar that has been made into a
  powder
scope: Also called castor. This is a container with holes in its top for shaking out sugar made into a
  powder, not a small wheel under furniture and not a worker who makes things from hot metal.
examples:
- She picked up the caster and shook sugar over the cake.
- The caster on the table holds fine white sugar.
