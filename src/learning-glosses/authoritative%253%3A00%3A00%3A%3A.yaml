senseId: 'authoritative%3:00:00::'
synsetId: 00179875-a
simpleMeaning: given the right or power to make decisions and tell others what to do
scope: Authorized and authorised are other names for this sense. This is being given the right or power
  to make decisions and tell others what to do, not being known as the best and most trusted source, and
  not only having a strong effect on others.
examples:
- The board gave an authoritative order to stop the work.
- Only an authoritative person may sign this paper for the town.
