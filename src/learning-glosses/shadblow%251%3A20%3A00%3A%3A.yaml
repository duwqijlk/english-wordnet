simpleMeaning: A North American tree or shrub with showy white blooms and dark fruit, blue-black or purplish,
  that people can eat — one of many kinds of such plants.
scope: Shadbush, juneberry, service tree, and serviceberry are other names for this North American tree
  or shrub, whose white blooms stand out and whose dark fruit people can eat.
examples:
- White flowers open on the shadblow.
- The shadblow bears blue-black fruit.
