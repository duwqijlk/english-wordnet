simpleMeaning: being alone as a way of life, or liking to be alone
scope: 'Lonely is another name for this sense: it is about being alone as a way of life or liking to be
  alone, not about having no one with you at one time.'
examples:
- He is a lone wolf who likes to live by himself.
- She took a lone walk in the woods, happy to be by herself.
