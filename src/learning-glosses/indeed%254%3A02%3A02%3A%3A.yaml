simpleMeaning: a short reply that shows surprise, doubt, or irony about what someone has just said.
scope: This is the short reply showing surprise or doubt, not the use that simply adds emphasis to a statement.
examples:
- '"Indeed? I find that hard to believe."'
- He claimed he had never lost a match, and his coach said, 'Indeed?'
