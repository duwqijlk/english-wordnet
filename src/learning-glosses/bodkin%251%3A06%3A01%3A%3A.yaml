simpleMeaning: A small tool with a sharp point, used to punch holes in leather or cloth.
scope: This is the sharp tool for punching holes in leather or cloth, not the blunt needle for threading
  ribbon through loops, the long hairpin usually with an ornamental head, or the slender dagger of the
  same name.
examples:
- She used a bodkin to punch a hole in the leather strap.
- The bodkin slipped through the thick cloth with ease.
