simpleMeaning: one of the small parts that make up DNA, built from thymine, a sugar with one oxygen part
  missing, and a phosphate group
scope: 'Also called thymidine monophosphate, deoxythymidine monophosphate and deoxythymidylic acid: one
  of DNA''s small building blocks, not a whole DNA strand and not a protein.'
examples:
- Thymidylic acid helps build the DNA in a cell.
- The sample held thymidylic acid made from thymine.
