simpleMeaning: to be all around something at the same time, or form a circle around it
scope: Being all around something at the same time, not walling it in for defense or closing in to force
  surrender; border, ring, skirt and environ are other names for this sense.
examples:
- Tall pine trees surround the cabin.
- A thick crowd surrounded the stage.
