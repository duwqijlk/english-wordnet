simpleMeaning: to put a layer of material over the outside of something, or to give an object a finish.
scope: This is not rising to the top of water or becoming visible; it means adding a coating or finish
  to an object.
examples:
- The workers surfaced the road with fresh asphalt.
- The table was surfaced with a thin layer of marble.
