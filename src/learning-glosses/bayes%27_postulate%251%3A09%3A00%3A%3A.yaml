simpleMeaning: 'In statistics, a rule for using the theorem when the odds of the different causes are
  seldom known: take all as equal, sometimes called making all the unknowns equally likely.'
scope: A rule in statistics for when the odds of causes are unknown, not Bayes' theorem itself, and not
  a rule for known odds.
examples:
- Bayes' postulate lets us take all causes as equal.
- When the odds were unknown, she used Bayes' postulate.
