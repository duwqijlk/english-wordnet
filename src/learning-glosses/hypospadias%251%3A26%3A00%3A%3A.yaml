senseId: 'hypospadias%1:26:00::'
synsetId: 14222479-n
simpleMeaning: A fault in a boy or man in which the tube that carries urine out of the body opens on the
  underside of the penis.
scope: A fault in a boy or man in which the urine tube opens on the underside of the penis, not a fault
  in which the tube is blocked and not a fault of the bladder.
examples:
- The baby boy was born with hypospadias and needed a small operation.
- Hypospadias was found at his first check.
