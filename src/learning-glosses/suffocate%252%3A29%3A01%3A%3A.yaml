simpleMeaning: to fight for breath, because too little of the gas the body needs is getting in
scope: To fight for breath because too little of the gas the body needs is getting in; also called choke,
  strangle, or gag, not to stop someone else from breathing and not to hold back growth or new ideas.
examples:
- He swallowed a fishbone and began to suffocate.
- She suffocated in the smoke-filled room.
