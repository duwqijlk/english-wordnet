simpleMeaning: First seen in Italy in the mid-15th century, this walled stronghold usually has five to
  eight three-sided points that stick out, each guarding the next.
scope: Also called a bastion fort, a star-shaped fortress, a star fort and a star fortress, this is a
  fortification whose points are set to guard one another.
examples:
- Soldiers held the trace italienne against the enemy.
- The trace italienne was praised for the way its points covered one another.
