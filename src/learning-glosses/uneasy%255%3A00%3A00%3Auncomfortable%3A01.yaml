simpleMeaning: feeling not comfortable with other people, not sure of yourself, and held back in how you
  act
scope: 'Also called awkward: this is about feeling not comfortable with other people, not a bad feeling
  in the body and not feeling worried about safety.'
examples:
- He felt uneasy with strangers at the party.
- She was uneasy in the group and said very little.
