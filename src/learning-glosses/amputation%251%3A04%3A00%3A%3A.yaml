simpleMeaning: an operation in which a doctor cuts off all or part of an arm or a leg
scope: This is the operation in which a doctor cuts off all or part of an arm or a leg, not the lasting
  health problem a person has after losing an arm or a leg.
examples:
- After the bad accident, an amputation of his left leg was needed.
- The doctor said amputation was the only way to save her life.
