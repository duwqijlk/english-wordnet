simpleMeaning: any of several drugs that lower the amount of sugar in the blood, used to treat diabetes
scope: Any of several drugs that lower blood sugar to treat diabetes; not insulin and not a drug for high
  blood pressure.
examples:
- Her doctor gave her a sulfonylurea to lower her blood sugar.
- A sulfonylurea helps people with diabetes keep their blood sugar down.
