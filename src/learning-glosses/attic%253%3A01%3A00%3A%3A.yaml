senseId: 'attic%3:01:00::'
synsetId: 03028799-a
simpleMeaning: Of or about the land round Athens, the people who live there, or the way Greek was said
  in Athens in old times.
scope: Of or about Attica, its people, or its speech, not the dialect as a thing itself and not of Greece
  in general.
examples:
- Attic Greek was the speech of Athens in old times.
- She read an Attic text from Athens.
