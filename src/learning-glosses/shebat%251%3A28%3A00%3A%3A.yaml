simpleMeaning: The fifth month of the civil year in the Jewish calendar, the eleventh of the church year,
  in January and February.
scope: Shevat is another name for this sense, for the fifth month of the civil year in the Jewish calendar,
  the eleventh of the church year, falling in January and February, not the first month of the civil year.
examples:
- Shebat falls in January and February in the Jewish calendar.
- The fifth month of the civil year is Shebat.
