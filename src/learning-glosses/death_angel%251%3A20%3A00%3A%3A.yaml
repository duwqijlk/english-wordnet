simpleMeaning: With a clear cup at its foot and white gills, this often white fungus is very poisonous,
  and only the white gills set it apart from the edible Agaricus.
scope: This fungus is also called death cap, death cup, and destroying angel, and it is not the safe Agaricus
  it looks like.
examples:
- The death angel is a very poisonous white fungus.
- You can tell a death angel from the edible Agaricus only by its white gills.
