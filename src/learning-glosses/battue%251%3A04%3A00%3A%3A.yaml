simpleMeaning: a hunt in which helpers drive wild animals to run towards the person waiting to shoot them
scope: A hunt in which helpers drive wild animals towards the waiting hunter, not a hunt in which one
  person tracks and follows the animals alone.
examples:
- The battue drove the deer straight towards the waiting hunters.
- During the battue, the beaters moved through the wood to push the game forward.
