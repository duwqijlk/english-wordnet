simpleMeaning: The sides on those sheets are its top and bottom, and the corners of this many-sided solid
  all sit on one of two flat sheets running side by side
scope: This many-sided solid has corners that all sit on one of two flat sheets running side by side,
  and the sides on those sheets are its top and bottom.
examples:
- Her prismatoid model had corners on two flat sheets.
- The top and bottom of her prismatoid lay on the flat sheets.
