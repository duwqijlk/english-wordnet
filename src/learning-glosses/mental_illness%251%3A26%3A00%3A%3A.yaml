simpleMeaning: When feeling or behaviour trouble is so bad that a doctor of the mind must step in, the
  person is in this state of sickness of the mind
scope: This is a state of sickness of the mind needing a doctor of the mind to step in, also called mental
  disease and psychopathy, not a passing low mood and not a sickness of the body.
examples:
- Her mental illness meant she needed care from a doctor of the mind for many months.
- Mental illness is no small thing; it can stop a person from living a full life.
