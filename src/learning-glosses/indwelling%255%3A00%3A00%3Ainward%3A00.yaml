simpleMeaning: Living inside a person or thing as a power that moves it from within
scope: A power that lives inside a person or thing and moves it from within, not a power that acts on
  it from outside.
examples:
- She believed an indwelling divinity guided her choices.
- The indwelling goodness of the old teacher touched everyone she met.
