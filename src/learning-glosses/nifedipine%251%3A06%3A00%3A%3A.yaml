simpleMeaning: Sold as Procardia, this drug blocks calcium, a mineral in the body, and seems to make repeat
  heart attacks more likely
scope: A drug sold as Procardia that blocks calcium, a mineral in the body, and seems to make repeat heart
  attacks more likely; not a drug that protects the heart.
examples:
- Nifedipine is sold under the trade name Procardia.
- The study found that nifedipine seemed to raise the risk of a second heart attack.
