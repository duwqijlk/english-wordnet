simpleMeaning: Describing someone who has grown rich or risen in rank but still lacks the manners that
  fit the new place
scope: 'Also called an upstart, nouveau-riche, or parvenue: describing someone who has grown rich or risen
  in rank but still lacks the manners that fit the new place, not someone born to rank and not a plain
  snob.'
examples:
- His parvenu manners made the old families smile behind his back.
- She called the new rich man a parvenu at the party.
