simpleMeaning: 'A measuring tool: a marked glass tube for drawing up and moving exact amounts of liquid.'
scope: A marked glass tube for taking up and moving set amounts of liquid, with pipet as another name
  for it; not a dropper, which has no scale, and not a burette.
examples:
- She used a pipette to add exactly two millilitres of the solution.
- The technician rinsed the pipette before drawing up the next sample.
