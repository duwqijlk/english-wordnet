simpleMeaning: a flat mat or plate put under a cold glass or bottle to keep its wet marks off a table
scope: A mat under a drink, not a person who lives by the sea and not someone who coasts.
examples:
- She put a coaster under her glass to protect the table.
- The coaster caught the drops from the cold bottle.
