simpleMeaning: a tube with small holes in it, pushed down into the ground to take in water from the earth
  around it
scope: 'Also called a wellpoint: a tube with holes pushed into the ground to take in water, not a deep
  hole dug for water and not a pipe that carries water away.'
examples:
- They drove a well point into the sand to draw up water for the garden.
- The well point filled the tank with water from the ground below.
