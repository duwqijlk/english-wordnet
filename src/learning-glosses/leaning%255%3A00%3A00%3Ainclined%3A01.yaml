simpleMeaning: turned away from straight up and down or from flat and level, to one side
scope: 'Also called tilted: it describes a thing turned to one side, not straight up or flat; it is not
  the noun that names the slant itself.'
examples:
- The leaning tower draws visitors from all over the world.
- A leaning fence post stood at the edge of the field.
