simpleMeaning: In physics, pressure times volume equals R times temperature, where R is the fixed number
  8.3143 joules per kelvin per mole
scope: Not a number that changes with the gas or the heat; also called gas constant.
examples:
- The universal gas constant links pressure, volume, and temperature.
- He used the universal gas constant to work out the volume.
