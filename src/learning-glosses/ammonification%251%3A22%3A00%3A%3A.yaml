simpleMeaning: soaking a thing through with ammonia, a sharp-smelling gas, or with a compound made from
  ammonia
scope: Soaking a thing through with ammonia or a compound made from it, not making ammonia and not breaking
  a thing down.
examples:
- Ammonification of the soil leaves it rich in ammonia.
- The ammonification step fills the liquid with ammonia.
