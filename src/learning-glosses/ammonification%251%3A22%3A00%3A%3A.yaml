simpleMeaning: soaking a thing through with ammonia, a sharp-smelling gas, or with a chemical stuff made
  from it
scope: Soaking a thing through with ammonia or a stuff made from it, not making ammonia and not breaking
  a thing down.
examples:
- Ammonification of the soil leaves it rich in ammonia.
- The ammonification step fills the liquid with ammonia.
