simpleMeaning: A stringed instrument whose steel strings are plucked while a steel bar that moves is pressed
  on them, to make a sliding sound.
scope: 'Also called the steel guitar: a stringed instrument whose steel strings are plucked while a steel
  bar that moves is pressed on them, to make a sliding sound, close to other stringed instruments played
  with a steel bar.'
examples:
- He played the Hawaiian guitar with a steel bar.
- The Hawaiian guitar gave a sliding sound.
