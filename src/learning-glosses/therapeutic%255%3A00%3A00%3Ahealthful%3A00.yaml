simpleMeaning: that helps a person get well or get back to good health
scope: Also called healing, remedial, and curative. This describing sense means something tends to make
  a person well; it is not the noun sense that names a medicine or treatment.
examples:
- Fresh air and rest can have a therapeutic effect.
- She followed a therapeutic diet to help her get well.
