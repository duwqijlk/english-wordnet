simpleMeaning: a nut tree of the eastern United States that is like the tree with loose peeling bark except
  that it bears much larger nuts
scope: 'Also called big shagbark, big shellbark, king nut and king nut hickory: a nut tree of the eastern
  United States with much larger nuts than the tree with loose peeling bark, not a small-nut tree and
  not a nut tree from the west.'
examples:
- The big shellbark hickory in the wood bears nuts much larger than those of the tree with loose bark.
- We planted a big shellbark hickory in the east of the United States for its large nuts.
