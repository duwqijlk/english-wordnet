simpleMeaning: a light that holds a metal vapour and gives out rays, used to treat the skin or body or
  to change how skin looks
scope: This is a light that gives out strong rays for treating skin or the body, also called a sunlamp,
  a sun-ray lamp and a sun lamp, not an ordinary house light and not the beam of light itself.
examples:
- The clinic used a sunray lamp for the skin treatment.
- She sat under the sunray lamp for a few minutes.
