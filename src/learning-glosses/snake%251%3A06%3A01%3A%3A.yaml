simpleMeaning: A long steel coil that bends to follow a curved pipe and break up a blockage.
scope: This drain-clearing tool is also called a plumber's snake or an auger, not the reptile and not
  just any long, bendy object.
examples:
- He pushed the snake down the drain until it reached the blockage.
- The plumber used a snake to clear the curved pipe.
