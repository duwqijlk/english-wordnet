simpleMeaning: a salt formed from an acid that is only supposed to exist
scope: A salt made from an acid that is only supposed to exist, also called bichromate, and not a salt
  of a real, common acid.
examples:
- The lab keeps a jar of potassium dichromate on the shelf.
- The chemist tested a dichromate to see how the salt would act.
