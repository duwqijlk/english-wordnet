simpleMeaning: A small hand tool used to fill and smooth the gaps in stone or brick work with mortar or
  cement
scope: A small hand tool used to fill and smooth the gaps in stone or brick work with mortar or cement;
  not a tool for spreading plaster and not a tool for cutting bricks.
examples:
- He used a pointing trowel to fill the joins in the brickwork.
- A pointing trowel finishes the joins with mortar.
