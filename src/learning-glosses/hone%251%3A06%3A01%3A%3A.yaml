simpleMeaning: a machine tool with fine rough strips that spin and move back and forth to smooth the inside
  of round holes and other such parts
scope: A machine tool that smooths the inside of round holes and other such parts, not a whetstone for
  sharpening blades by hand.
examples:
- The hone spun inside the cylinder to smooth its bore.
- They fitted a new hone to the machine head before the run.
