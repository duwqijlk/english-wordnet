simpleMeaning: A thing that keeps a person tied down and unable to move freely; most often it is put on
  a prisoner.
scope: A band or chain that binds a person, also called a bond, not the U-shaped metal bar.
examples:
- The prisoner rattled his shackles.
- They cut the shackle from his ankle.
