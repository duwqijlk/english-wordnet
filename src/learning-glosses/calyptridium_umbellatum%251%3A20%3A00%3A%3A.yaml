simpleMeaning: Pink groups of tight-packed flowers on flat stems that look like the upturned pads of cats'
  feet; it grows in needle-tree forests of western North America.
scope: Also called pussy's-paw, pussy-paw, pussy-paws, and Spraguea umbellatum; a low plant with pink
  flower groups like cats' feet, not a tall shrub and not a garden flower with single blooms.
examples:
- Calyptridium umbellatum grows in the pine woods of the west.
- The pink flowers of Calyptridium umbellatum look like cats' feet.
