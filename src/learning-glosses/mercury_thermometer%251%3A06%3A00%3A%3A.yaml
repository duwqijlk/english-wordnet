simpleMeaning: 'A temperature gauge: a sealed glass tube with a bulb of silvery metal at one end; warming
  makes the metal expand and climb a printed Celsius or Fahrenheit scale.'
scope: The same instrument as a mercury-in-glass thermometer, as opposed to a digital gauge or one filled
  with colored alcohol.
examples:
- A mercury thermometer broke in the lab, so the room was closed for cleaning.
- She shook the mercury thermometer down before taking his temperature.
