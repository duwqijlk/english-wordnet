simpleMeaning: used of a place that is away from other people, where a person can be alone and not be
  troubled by others
scope: This is a place away from other people, where a person can be alone and not be troubled by others;
  not a person who lives alone and keeps away from others.
examples:
- They chose a secluded table in the corner, away from the noise.
- We spent the afternoon in a secluded garden, alone and far from other people.
