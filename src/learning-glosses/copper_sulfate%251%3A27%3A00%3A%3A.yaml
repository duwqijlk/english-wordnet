simpleMeaning: a salt made when sulfuric acid acts on the oxide of a reddish-brown metal
scope: A salt made when sulfuric acid acts on the oxide of a reddish-brown metal; copper sulphate, cupric
  sulfate and cupric sulphate are other names for this sense, not a salt of iron, and not a salt used
  as food.
examples:
- The gardener mixed copper sulfate with water to spray the vines.
- Copper sulfate forms blue crystals when it dries.
