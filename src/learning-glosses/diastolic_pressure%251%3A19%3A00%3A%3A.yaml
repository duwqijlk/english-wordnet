simpleMeaning: The force of the blood, as read on a cuff that measures blood force, after the heart has
  squeezed and while its rooms fill with blood again
scope: This is the force of the blood after the heart has squeezed and while its rooms fill with blood
  again, not the force while the heart is squeezing and not the force in a vein.
examples:
- Her diastolic pressure was lower than her systolic pressure.
- The nurse wrote down the diastolic pressure after the heart squeeze.
