simpleMeaning: Sometimes the drug agency lets a drug be sold while the maker watches its effects, and
  it may be tested on people a little different from those in earlier tests
scope: 'Also called phase IV clinical trial: a late stage of drug testing after the drug is on sale, not
  an early test of a new drug and not the first approval itself.'
examples:
- The phase IV trial tested the drug on new groups of patients.
- Doctors watched the patients closely during phase IV.
