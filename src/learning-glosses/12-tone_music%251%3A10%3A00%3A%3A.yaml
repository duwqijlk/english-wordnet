simpleMeaning: A kind of serial music devised by Schoenberg, in which a fixed order of the twelve chromatic
  notes, or inverted or reversed forms of it, shapes the work.
scope: This names the composing method as a whole, not the tone row, the ordered sequence of notes it
  works from, and not serial music in general. It is a technical term in music theory. The variant '12-tone
  system' names the same method.
examples:
- Her dissertation traces how 12-tone music travelled from Vienna to American universities.
- The orchestra programmed an evening of 12-tone music that many subscribers found hard going.
