simpleMeaning: a person whose case has been sent to an expert or to a group of experts for help
scope: This is the person who is sent on for help. It is not the act of sending a person on, and not the
  note or words that tell a person to go to an expert.
examples:
- The patient is a referral from another doctor.
- As a referral, she was sent to a heart expert for tests.
