simpleMeaning: the first part of the stomach of a cud-chewing animal, where food is kept and sent back
  to the mouth to be chewed again
scope: 'Also called the first stomach: the first part of a cud-chewing animal''s stomach, not the second
  stomach and not the whole stomach.'
examples:
- The rumen holds food before it is chewed again.
- Food stays in the rumen until the cow brings it back up.
