simpleMeaning: A light, soft, silver-white metal of the alkali group that dulls fast in air, burns in
  water, plentiful in combined forms in sea water and carnallite, kainite and sylvite.
scope: A light, soft, silver-white metal of the alkali group, also called K and atomic number 19; not
  sodium and not another alkali metal.
examples:
- Potassium burns when it touches water.
- Bananas hold much potassium in their flesh.
