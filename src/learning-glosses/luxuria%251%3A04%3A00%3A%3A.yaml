simpleMeaning: A strong wish for sexual pleasure that a person gives in to without self-control, shown
  as a person and counted as one of the deadly sins.
scope: Strong sexual desire given in to without self-control, also called lust; not love and not a passing
  fancy.
examples:
- In the old play, luxuria tempts the hero with pleasure.
- The preacher warned that luxuria leads people to ruin.
