simpleMeaning: Five straight lines join the corners of a five-sided shape to make a star with five points,
  with a smaller five-sided shape inside
scope: 'Also called a pentacle or a pentagram: a five-pointed star drawn with five straight lines, not
  a star in the sky and not a plain five-sided shape.'
examples:
- She drew a pentangle on the cover of her notebook.
- The pentangle on the old church door was made of five straight lines.
