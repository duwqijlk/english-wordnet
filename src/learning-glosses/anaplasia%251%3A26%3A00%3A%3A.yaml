simpleMeaning: A loss of the clear shape and job of cells, often with a greater power to grow, as in a
  harmful growth.
scope: A loss of the clear shape and job of cells, often with a greater power to grow, as in a harmful
  growth, not normal cell growth and not a harmless lump.
examples:
- The test showed anaplasia in the cells.
- Anaplasia means the cells have lost their clear shape and job.
