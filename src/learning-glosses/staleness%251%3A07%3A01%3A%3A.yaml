simpleMeaning: The state of having lost its freshness and purity through growing old.
scope: The state of having lost freshness and purity through growing old, not the dullness of a thing
  said too often.
examples:
- The staleness of the bread made it hard to eat.
- Staleness had crept into the air of the closed room.
