simpleMeaning: to do with or holding a group of three atoms of the gas nitrogen joined together
scope: It says a thing is to do with a group of three nitrogen atoms, not with the azo group of two nitrogen
  atoms and not with a thing that holds no such group.
examples:
- This azido compound holds a group of three nitrogen atoms.
- The azido group breaks apart when the compound is heated.
