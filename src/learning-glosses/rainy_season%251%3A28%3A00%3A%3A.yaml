simpleMeaning: In hot lands near the equator, this is the yearly time when most of a country's wet weather
  falls, one of only two such times.
scope: This is the yearly time in hot lands near the equator when most of a country's wet weather falls,
  unlike the dry time when little falls.
examples:
- Most of a country's wet weather falls during the rainy season.
- The rainy season is the yearly time when the wet weather comes.
