simpleMeaning: advice that tells you to be careful about something that is about to happen, especially
  danger or something bad
scope: Advice that tells you to be careful about something that is about to happen; not a rule you must
  follow and not a punishment for doing wrong.
examples:
- The letter gave a clear warning about the ice on the road ahead.
- He took no notice of the warning that the bridge might fall down.
