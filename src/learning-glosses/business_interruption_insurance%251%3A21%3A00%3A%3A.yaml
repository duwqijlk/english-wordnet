simpleMeaning: cover that pays for lost gains and fixed costs that go on when trade stops because of a
  harmful event
scope: Cover that pays for lost gains and fixed costs that go on when trade stops because of a harmful
  event, not ordinary cover for broken goods and not cover for lost trade from a slow downturn.
examples:
- The shop's business interruption insurance paid the rent after the fire.
- They claimed on their business interruption insurance when the flood closed the store.
