simpleMeaning: Dried bark of a Pacific coast tree, used to loosen the bowels.
scope: Dried bark of a Pacific coast tree, used to loosen the bowels, also called cascara, chittam bark
  or chittem bark; not fresh bark, and not bark used for flavour.
examples:
- The doctor gave her cascara sagrada to loosen her bowels.
- Cascara sagrada comes from dried bark.
