simpleMeaning: A tropical climber living one season, one of several kinds, with big yellow blooms and
  edible young fruit; farmers harvest the ripe fruit for dried fibres used as a sponge.
scope: Another name for the tropical vine also called dishcloth gourd, luffa or sponge gourd; not the
  dried sponge made from its fruit.
examples:
- Rag gourd is one of several tropical vines grown for natural sponges.
- The young rag gourd fruit can be cooked and eaten.
