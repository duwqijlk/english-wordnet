simpleMeaning: About the oldest known rocks, formed in the earliest age of the Earth.
scope: 'Also called archaean: about the oldest known rocks, not rocks from a later age of the Earth.'
examples:
- The archean rocks in the valley are among the oldest on Earth.
- Archean stone dates from the earliest age of the Earth.
