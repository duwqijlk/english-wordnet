simpleMeaning: a piece of clothing, such as a jacket, coat or robe, made from the skin of a seal
scope: This is a piece of clothing made from seal skin, not the seal's skin and fur on its own.
examples:
- He wore his sealskin over his shoulders in the cold wind.
- She put on the sealskin before going out into the snow.
