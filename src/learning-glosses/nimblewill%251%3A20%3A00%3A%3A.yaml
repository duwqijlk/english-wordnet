simpleMeaning: A thin grass with many branches that grows in America and is of some use as food for grazing
  animals in the middle of the United States.
scope: A thin grass with many branches that grows in America and is of some use as food for grazing animals
  in the middle of the United States, not lawn grass and not a weed with no use.
examples:
- Nimblewill grows thin and low across the field.
- Cattle graze on nimblewill in the central United States.
