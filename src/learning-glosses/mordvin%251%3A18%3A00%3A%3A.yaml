simpleMeaning: A person of the farming people who live in the middle Volga lands of the part of Russia
  that lies in Europe.
scope: 'Also called Mordva and Mordvinian: a person of the farming people who live in the middle Volga
  lands of the part of Russia that lies in Europe, not the language spoken by these people.'
examples:
- A Mordvin farmer worked the fields by the Volga.
- The Mordvin have farmed the middle Volga lands for many years.
