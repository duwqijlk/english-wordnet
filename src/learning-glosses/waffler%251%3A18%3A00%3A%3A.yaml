simpleMeaning: a person who talks or writes in a vague way and dodges giving a clear answer
scope: A person who speaks or writes vaguely and dodges clear answers, not a person who lies and not a
  person who talks too much.
examples:
- The waffler dodged every question about the budget.
- When asked for a date, the waffler gave no clear answer.
