simpleMeaning: A liquid with something dissolved in it, thinned with water or another liquid.
scope: A weak liquid with something dissolved in it, not the act of making a thing weak by adding water
  or a thinning liquid.
examples:
- The nurse prepared a dilution of the drug.
- They drank a dilution of juice and water.
