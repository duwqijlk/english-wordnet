simpleMeaning: A tool made of several hooks for catching and holding things, often thrown on the end of
  a rope.
scope: A tool made of several hooks for catching and holding things, often thrown on a rope, not the hinged
  bucket for digging and not the act of gripping in a fight.
examples:
- The sailor threw a grapple over the side to catch the rope.
- They used a grapple to pull the wreck from the water.
