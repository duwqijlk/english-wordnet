simpleMeaning: A name usually used with scorn for small or weak poets is given to a maker of poor verses,
  a writer who makes rhymes.
scope: A writer who makes rhymes is also called a rhymer, a poetiser, a poetizer or a rhymester.
examples:
- The versifier wrote rhymes that the critics laughed at.
- Critics called him a mere versifier, not a true poet.
