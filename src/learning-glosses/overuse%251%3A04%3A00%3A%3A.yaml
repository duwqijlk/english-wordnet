simpleMeaning: using something so much that each extra use gives less and less good result
scope: The loss of gain that comes from using something too much, not using it once or in a normal amount.
examples:
- Overuse of the soil made each new crop smaller than the last.
- The overuse of antibiotics can make each later use work less well.
