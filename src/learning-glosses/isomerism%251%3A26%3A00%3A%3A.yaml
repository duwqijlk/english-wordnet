simpleMeaning: The state of being a joined-atom stuff in forms with different atom patterns but the same
  weight, and all the chemical and physical facts of such stuffs
scope: The state of being an isomer and the facts that go with such stuffs, not the stuff itself and not
  a change in weight.
examples:
- Isomerism lets one stuff take several shapes.
- The book explains isomerism with the two forms of butane.
