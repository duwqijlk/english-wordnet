simpleMeaning: The point of the compass half-way between south and south-west.
scope: 'Also called sou''-sou''-west and south southwest: the compass point midway between south and southwest,
  not the point midway between south and southeast.'
examples:
- The wind came from the SSW all afternoon.
- We sailed SSW for two days.
