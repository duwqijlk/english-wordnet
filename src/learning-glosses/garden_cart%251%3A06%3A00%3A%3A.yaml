simpleMeaning: A small wheeled carrier for light loads, with handles and one or more wheels.
scope: This is a small wheeled carrier for light loads, also called a barrow, a wheelbarrow or a lawn
  cart; not a hand truck for heavy boxes, and not a sack carried on the back.
examples:
- She pushed the garden cart full of weeds to the pile.
- The garden cart has one wheel and two handles.
