simpleMeaning: a coffee maker that grinds the beans, presses them down, and pulls a shot of espresso by
  itself; some also froth milk and pour it out on their own
scope: A coffee maker that does the whole job itself, not a hand-run espresso maker and not a drip coffee
  pot.
examples:
- Our new super-automatic espresso machine grinds the beans and pulls the shot while I get the cups ready.
- She bought a super-automatic espresso machine that froths the milk for her morning coffee.
