simpleMeaning: Perching birds, most often small and living near the ground, with feet of four toes set
  to grip the perch; most sing, and their young are helpless.
scope: Perching birds, most often small and living near the ground, with feet of four toes set to grip
  the perch; most sing, and their young are helpless; also called passeriform bird; not to do with the
  passeriform birds.
examples:
- Their passerine sang at dawn.
- The passerine nested low in the hedge.
