simpleMeaning: A sudden, serious infection of the brain and spinal cord, caught when germs enter an open
  wound, that in late stages may make jaw and voice-box muscles spasm.
scope: The serious infection, not any ordinary stiffness or locking of the jaw.
examples:
- Lockjaw can develop after germs get into a deep wound.
- In its late stages, lockjaw makes the jaw muscles seize up.
