simpleMeaning: From the tips down to the thicker branches, the young shoots of a plant slowly wither in
  this illness
scope: This is the name for a plant illness in which young shoots slowly wither from the tips down to
  the thicker branches.
examples:
- Dieback left the young shoots withered from the tips.
- The gardener saw dieback spreading from the tips of the shoots to the larger branches.
