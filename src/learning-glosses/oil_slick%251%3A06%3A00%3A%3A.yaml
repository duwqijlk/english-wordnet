simpleMeaning: On top of water there floats a thin layer of greasy liquid, most often raw liquid fuel
  spilled from a ship
scope: A thin layer of greasy liquid floating on water, most often spilled from a ship; not a thick pool
  of fuel and not a stain on dry land.
examples:
- An oil slick spread across the bay after the tanker leaked.
- Workers cleaned up the oil slick before it reached the shore.
