senseId: 'truncus_celiacus%1:08:00::'
synsetId: 05347865-n
simpleMeaning: A blood vessel leaving the belly aorta beneath the diaphragm, splitting into the splenic,
  common hepatic, and left gastric arteries.
scope: This sense is also called arteria celiaca, celiac artery, and celiac trunk, for a blood vessel
  leaving the belly aorta beneath the diaphragm and splitting into three branches, the left gastric, common
  hepatic, and splenic arteries.
examples:
- The truncus celiacus leaves the aorta.
- Truncus celiacus splits into three arteries.
