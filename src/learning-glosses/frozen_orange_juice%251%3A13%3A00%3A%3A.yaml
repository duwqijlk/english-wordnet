simpleMeaning: the drink from a round fruit with a thick skin, made stronger by taking out water and then
  kept very cold
scope: 'Also called orange-juice concentrate: juice made stronger by taking out water and then frozen,
  not fresh juice and not juice that has only been chilled.'
examples:
- She mixed the frozen orange juice with water to make a drink.
- A can of frozen orange juice sat in the freezer.
