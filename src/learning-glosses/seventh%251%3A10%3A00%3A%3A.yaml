senseId: 'seventh%1:10:00::'
synsetId: 06873099-n
simpleMeaning: In music, the distance between one note and another note that is seven notes away from
  it
scope: In music, the distance between two notes seven notes apart; not one part made by cutting a whole
  into seven equal parts, and not the place of number seven in a list.
examples:
- The song opens with a seventh that sounds tense.
- He played a seventh between the two notes.
