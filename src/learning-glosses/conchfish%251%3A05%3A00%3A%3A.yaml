simpleMeaning: a fish found in the West Indies that lives inside the soft fold of a living conch
scope: A fish that lives inside the soft fold of a living conch in the West Indies, not a fish that swims
  free in the open sea and not the conch itself.
examples:
- The conchfish hides inside its host in the warm waters of the West Indies.
- Divers found a conchfish living in the mantle cavity of a conch.
