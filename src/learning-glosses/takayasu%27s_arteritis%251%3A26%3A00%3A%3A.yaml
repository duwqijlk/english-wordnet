simpleMeaning: A disorder in which no pulse can be felt in either arm or in the neck arteries
scope: Also called pulseless disease; the pulse is missing in both arms and in the neck arteries, which
  is what sets this disorder apart from other disorders of the arteries.
examples:
- Takayasu's arteritis left her with no pulse in either arm.
- Doctors found Takayasu's arteritis when they could not feel a pulse in her neck.
