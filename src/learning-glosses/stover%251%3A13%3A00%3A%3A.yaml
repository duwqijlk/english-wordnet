simpleMeaning: Farm animals are fed on the dry stems and leaves of a field crop once the grain has been
  cut, above all maize.
scope: These are the dry stems and leaves of a field crop fed to farm animals after the grain is cut,
  not the grain itself and not fresh green feed.
examples:
- Once the grain had been cut, the stover was fed to the farm animals.
- The farm animals ate stover from the field crop.
