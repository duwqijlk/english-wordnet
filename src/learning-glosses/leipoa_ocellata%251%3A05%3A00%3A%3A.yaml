simpleMeaning: An Australian bird that lays its eggs in sandy mounds, letting the heat of the mound hatch
  them.
scope: 'Also called leipoa, lowan and mallee fowl: an Australian bird that lays its eggs in sandy mounds,
  where the heat of the mound hatches them, not a bird that sits on its eggs.'
examples:
- The Leipoa ocellata had built a large sandy mound for its eggs.
- We watched a Leipoa ocellata scratching at the mound where its eggs lay.
