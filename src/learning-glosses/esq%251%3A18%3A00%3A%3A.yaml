simpleMeaning: A title of respect for a person of the English gentry, just below a knight, put after the
  name
scope: This is a title of respect for a person of the English gentry, just below a knight, put after the
  name; Esquire is another name for this sense, and its nearest rivals are titles put before the name,
  like Sir.
examples:
- He signed the letter John Smith, Esq.
- Esq is placed after the name as a title of respect.
