simpleMeaning: A clear liquid inside the centre of a cell, in which a small round body and the threads
  that carry the cell's genes and other parts are spread out.
scope: This is a clear liquid inside the centre of a cell, in which a small round body and the threads
  that carry the cell's genes and other parts are spread out, not the jelly-like liquid that fills the
  rest of the cell.
examples:
- The karyolymph fills the centre of the cell around the nucleolus.
- Karyolymph is the clear liquid in which chromatin is spread out.
