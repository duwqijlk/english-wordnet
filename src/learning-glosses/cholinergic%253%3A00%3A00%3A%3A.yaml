simpleMeaning: giving out or switched on by acetylcholine, a chemical that carries signals between nerve
  cells, or by a substance like it
scope: Having to do with a chemical that carries signals between nerve cells, not a drug that blocks such
  signals and not a nerve cell itself.
examples:
- The cholinergic nerves send signals to the muscles.
- This cholinergic drug acts on the same chemical that carries signals between nerve cells.
