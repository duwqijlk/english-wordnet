simpleMeaning: News travels by signs that can be read when a board stops in one place, sent from a tower
  with turning flat boards, also called blades or paddles.
scope: A tower that sends news by moving boards that stop in set places.
examples:
- The semaphore telegraph sent news when its boards stopped in set places.
- Watchers read the semaphore telegraph when a board stopped in one place.
