simpleMeaning: To take for oneself, by cheating, property that was given to one to look after
scope: 'Also called embezzle, defalcate, malversate and misappropriate: to take by cheating what was given
  to one to look after, not to steal from a stranger and not to take by mistake.'
examples:
- The treasurer peculated the club's funds over several years.
- He was caught after he peculated money meant for the orphans.
