simpleMeaning: the outer skin of a fruit or a vegetable, such as an apple or a potato
scope: The outer skin of a fruit or vegetable; skin is another name for this sense, and it is not the
  act of taking the skin off.
examples:
- She threw the orange peel into the bin.
- The potato peel came off in one long strip.
