simpleMeaning: Thrilling, with feeling stirred as by a jolt.
scope: Also called electric or galvanic; this describes thrilling emotion as if from an electric shock,
  not an actual electric current.
examples:
- The announcement had a galvanizing effect on the audience.
- Her galvanizing speech thrilled everyone in the hall.
