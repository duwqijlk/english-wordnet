simpleMeaning: A communications system that sends pictures of things, still or moving, from one distant
  place to another.
scope: This is the technology that carries the pictures, not 'the broadcasting of shows as a medium,'
  and not 'the set that receives the signals in your home.'
examples:
- Television allows pictures to be sent between distant cities almost instantly.
- The new television system carried images from the studio to the station.
