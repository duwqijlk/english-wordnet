simpleMeaning: an idea reached by thinking through what is known or what has been seen
scope: An idea worked out by thinking, with implication as another name for this sense, and not a cut
  in a tax bill or a guess with no facts behind it.
examples:
- From the wet coats, she made the deduction that it had rained.
- The deduction that he had left early proved wrong.
