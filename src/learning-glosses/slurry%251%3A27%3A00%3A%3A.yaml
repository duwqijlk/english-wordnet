senseId: 'slurry%1:27:00::'
synsetId: 14615513-n
simpleMeaning: a mix of small solid bits that do not dissolve in a liquid, such as clay or lime, usually
  in water
scope: This sense is a wet mix with solid bits in it, not a dry powder and not a clear liquid with nothing
  in it.
examples:
- They poured the slurry into the mould to make the tile.
- The workers stirred the clay slurry before using it.
