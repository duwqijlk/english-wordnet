simpleMeaning: A young cell that will grow into a white blood cell, found as a rule only in the soft stuff
  inside bones.
scope: A young cell that grows into a white blood cell, found as a rule only in the soft stuff inside
  bones; not a grown white blood cell and not a red blood cell.
examples:
- Myeloblasts are normally found only in the bone marrow.
- The doctor found myeloblasts in the marrow sample.
