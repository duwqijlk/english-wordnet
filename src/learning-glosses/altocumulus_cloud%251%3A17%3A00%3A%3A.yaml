simpleMeaning: a puffy mass in the sky about halfway up, at a height of 2 or 3 miles
scope: A puffy mass in the sky at a height of 2 or 3 miles; altocumulus is another name for this sense,
  not a low puffy mass and not a flat grey sheet.
examples:
- The pilot flew through an altocumulus cloud at three miles up.
- Altocumulus clouds gathered in the afternoon sky.
