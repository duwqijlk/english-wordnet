simpleMeaning: said of something that has to do with the upper and lower rooms of the heart, or that acts
  on them
scope: 'Also called atrioventricular: said of things linked to the heart''s upper and lower rooms, not
  of the heart''s outer wall and not of a blood vessel.'
examples:
- The auriculoventricular valve lets blood pass from the upper room to the lower room.
- Auriculoventricular disease slows the flow of blood through the heart.
