simpleMeaning: A germ-killing drug used to treat infections caused by a germ called staphylococcus that
  do not answer to penicillin
scope: A germ-killing drug for infections caused by a germ called staphylococcus that does not answer
  to penicillin, also called dicloxacillin, not penicillin itself or a drug for other germs.
examples:
- The doctor gave Dynapen for a staphylococcus infection that penicillin could not cure.
- Dynapen worked where penicillin had failed.
