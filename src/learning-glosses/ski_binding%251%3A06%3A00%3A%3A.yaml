simpleMeaning: a boot should come free in a fall from one of a pair of small machines fixed to a long
  narrow board for snow that hold it firm
scope: It is also called a binding, one of a pair of small machines fixed to a ski that hold a boot firm
  and let it go in a fall, not the boot itself.
examples:
- The ski binding held her boot firm.
- His ski binding let the boot go when he fell.
