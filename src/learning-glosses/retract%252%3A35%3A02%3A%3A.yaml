simpleMeaning: to use a tool in surgery to hold open the edges of a cut or an organ
scope: Using a tool in surgery to hold open the edges of a cut or an organ; not taking back a belief,
  and not pulling a part back into the body.
examples:
- The surgeon retracted the wound to see inside.
- A nurse retracted the skin around the cut.
