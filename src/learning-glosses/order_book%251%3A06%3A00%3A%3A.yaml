simpleMeaning: a bound set of pages where a shop writes down what buyers ask for, and which usually makes
  several copies of each note
scope: A bound set of pages for writing down what buyers ask for, not a printed list of a meeting's business
  and not a single receipt.
examples:
- The shopkeeper wrote the sale in the order book.
- She checked the order book before phoning the supplier.
