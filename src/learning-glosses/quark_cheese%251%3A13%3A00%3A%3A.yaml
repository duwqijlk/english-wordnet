simpleMeaning: Made from milk that has been heated, with a starter and rennet added, this fresh food has
  a smooth feel and is not left to age.
scope: Quark is another name for this fresh food made from milk.
examples:
- They made quark cheese from heated milk, a starter, and rennet.
- The quark cheese had not been left to age.
