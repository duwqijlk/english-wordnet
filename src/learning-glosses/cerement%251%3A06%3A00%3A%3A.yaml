simpleMeaning: a piece of cloth used to wrap a dead body for burial
scope: 'Also called pall or shroud: a cloth that wraps a dead body for burial, not a coffin and not a
  coat for the living.'
examples:
- The cerement was laid out beside the coffin.
- They wrapped the body in a clean white cerement.
