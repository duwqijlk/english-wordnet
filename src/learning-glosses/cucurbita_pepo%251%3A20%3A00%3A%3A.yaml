simpleMeaning: A coarse vine widely grown for its large soft round orange fruit with firm orange skin
  and many seeds; its kinds include the summer squashes and a few autumn squashes.
scope: Also called pumpkin, autumn pumpkin and pumpkin vine; a vine grown for its fruit, not a vine grown
  for its flowers and not a cucumber vine.
examples:
- Cucurbita pepo grows a large orange fruit in our garden.
- The farmer planted Cucurbita pepo for its summer squashes.
