simpleMeaning: Sticking to old ways, especially in how a people lives or worships.
scope: Sticking to old ways, especially in how a people lives or worships, not the teaching that all knowledge
  came by divine revelation, and close in sense to strict following of old methods or teachings.
examples:
- His traditionalism showed in his love of old customs.
- Traditionalism shaped the village's festivals and rites.
