simpleMeaning: An organised group of religious workers in a foreign land, sent to teach their faith and
  carry on religious work
scope: An organised group of religious workers in a foreign land; mission, foreign mission and missionary
  post are other names for this sense, and not one worker on his or her own.
examples:
- The missionary station had a small church and a school.
- She spent two years at a missionary station in Africa.
