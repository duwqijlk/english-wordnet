simpleMeaning: A carbon-and-hydrogen substance counts as one of the benzene family when it holds one or
  more rings of six carbon atoms.
scope: This carbon-and-hydrogen substance with rings of six carbon atoms is the aromatic compound, a near
  twin of the aromatic hydrocarbon, which carries the same rings in organic substances.
examples:
- The lab tested the aromatic compound.
- Chemists grouped the aromatic compound with the benzene family.
