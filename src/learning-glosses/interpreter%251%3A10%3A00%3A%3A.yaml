simpleMeaning: In computer science, a program that puts code into another form and runs it one line at
  a time
scope: In computer science, a program that runs code line by line, not a person who speaks for others
  and not a person who turns speech from one language to another.
examples:
- The interpreter ran the code one line at a time.
- She used an interpreter to test the new program.
