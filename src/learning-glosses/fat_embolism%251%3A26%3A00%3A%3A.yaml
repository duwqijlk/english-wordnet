simpleMeaning: a grave state in which fat blocks an artery; fat can get into the blood from a broken long
  bone, hurt fatty tissue, or a fatty liver
scope: A grave state in which fat blocks an artery, not a blood clot and not a heart attack.
examples:
- A fat embolism can follow a broken thigh bone.
- Doctors watch for a fat embolism after a bad fracture.
