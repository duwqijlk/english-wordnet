simpleMeaning: Several linked actions done to reach one aim, usually within set limits of place and time.
scope: 'Also called campaign: several linked actions done to reach one aim, usually within set limits
  of place and time, not one single fight and not a whole war.'
examples:
- The military campaign took the army across the river valley.
- A military campaign needs food, maps, and time.
