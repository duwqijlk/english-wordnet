senseId: 'triiodothyronine%1:08:00::'
synsetId: 05421216-n
simpleMeaning: A hormone of the thyroid, like thyroxine, with one fewer iodine atom in each molecule and
  made in lesser amounts; it has thyroxine's effects but is stronger, briefer.
scope: This sense is also called liothyronine, for a thyroid hormone akin to thyroxine, with one fewer
  iodine atom in each molecule and made in lesser amounts, that works the same way but stronger and briefer.
examples:
- Triiodothyronine acts like thyroxine.
- Triiodothyronine is made in small amounts.
