simpleMeaning: A bad infection of the tubes that carry air or of the lungs usually shows itself when one
  brings up blood from the airways by coughing.
scope: People also call this haemoptysis, and bringing up blood from the airways when coughing usually
  points to a bad infection of the air tubes or lungs.
examples:
- Hemoptysis brought up blood from his airways when he coughed.
- His hemoptysis pointed to a bad infection of the lungs.
