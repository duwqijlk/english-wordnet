simpleMeaning: This shrub of the eastern United States loses its leaves each year; its leaves and bark
  smell strong, and its yellow flowers are followed by scarlet or yellow berries.
scope: Also called spice bush, this shrub of the eastern United States bears yellow flowers and scarlet
  or yellow berries, not the straggling shrub of the southwest with brown flowers.
examples:
- Yellow flowers on the spicebush turned into scarlet berries.
- The spicebush smelled strong from its leaves and bark.
