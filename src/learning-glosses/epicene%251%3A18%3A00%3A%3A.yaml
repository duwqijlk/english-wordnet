simpleMeaning: One with both male and female sex traits and organs, so that at birth no clear call of
  male or female can be made.
scope: One with both male and female sex traits and organs, so that at birth no clear call of male or
  female can be made; also called hermaphrodite, androgyne, epicene person, gynandromorph, or intersex;
  not having a doubtful sex self, nor having unfit womanly traits.
examples:
- Their epicene was born at dawn.
- The epicene was noted in the chart.
