scope: 'Also called a hermaphrodite brig: a sailing ship with two poles for sails, with the sails across
  the ship on the front pole and along the ship on the main pole; not a ship with the same kind of sails
  on both poles.'
examples:
- The brigantine sailed into the harbour with all its sails up.
- In the painting, a brigantine crosses the sea under two tall masts.
