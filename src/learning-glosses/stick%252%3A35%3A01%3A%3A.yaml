simpleMeaning: to stay in close contact with something and hold together, so the parts do not come apart
scope: This sense is about things touching and holding together on their own; it is not about fixing something
  in place or fastening it with glue, and it is not the wooden object.
examples:
- The two slices of cheese stuck together in the warm car.
- Wet pages stick to each other and are hard to pull apart.
