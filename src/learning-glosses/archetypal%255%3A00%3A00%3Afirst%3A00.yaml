simpleMeaning: Standing as the first of its kind, the one other things like it are shaped after.
scope: 'Also called archetypical and prototypal: standing as the first of its kind, the one other like
  things are shaped after, not a mere copy of something older.'
examples:
- She was the archetypal student activist of her generation.
- The old farmhouse was archetypal of the region.
