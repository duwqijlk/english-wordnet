scope: A strong-smelling plant common in the southern United States, covered with glands and hairs mixed
  together; not a plant without a strong smell and not a smooth plant without hairs.
examples:
- The clammyweed filled the field with its strong smell.
- She brushed past the clammyweed and its hairs caught on her sleeve.
