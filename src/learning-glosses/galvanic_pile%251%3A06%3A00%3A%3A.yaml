simpleMeaning: Volta devised the first electric battery as a row of voltaic cells joined one after another.
scope: Also called a pile and a voltaic pile, this battery was Volta's first electric battery.
examples:
- Volta built a galvanic pile.
- Volta's galvanic pile was the first electric battery.
