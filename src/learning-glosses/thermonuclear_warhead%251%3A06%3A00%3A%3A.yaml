simpleMeaning: the front part of a missile made to carry an atom bomb
scope: 'Also called a nuke, an atomic warhead, or a nuclear warhead: the front part of a missile made
  to carry an atom bomb, not an ordinary bomb dropped from a plane, and not the missile itself.'
examples:
- The thermonuclear warhead was built to be carried by a long-range missile.
- Inspectors checked the thermonuclear warhead before it was fitted to the missile.
