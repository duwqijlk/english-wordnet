simpleMeaning: A bicycle made to ride rough, hilly ground, with wide, thick tyres and a strong frame.
scope: Also called mountain bike and off-roader, it is the name for the bicycle itself, built strong for
  rough, hilly ground.
examples:
- They rode all-terrain bikes up the rocky track.
- The shop sold all-terrain bikes with wide tyres and strong frames.
