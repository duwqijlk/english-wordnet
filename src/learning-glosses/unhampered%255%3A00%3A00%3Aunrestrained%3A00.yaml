simpleMeaning: Free to move or act, with nothing slowing, blocking, or getting in the way.
scope: Also called unhindered, this is said of a thing free to move or act, with nothing slowing, blocking,
  or getting in the way.
examples:
- The market was unhampered by old rules.
- Their work was unhampered by the bad weather.
