simpleMeaning: a net of blood vessels that drain the area of the chewing muscles and empty into the deep
  jaw vein and the front face vein
scope: A net of veins draining the jaw-muscle area, not a single vein and not the veins of the neck.
examples:
- The pterygoid plexus drains blood from the chewing muscles.
- Surgeons take care near the pterygoid plexus when they work on the jaw.
