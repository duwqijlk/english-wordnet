senseId: 'pure_absence%1:26:00::'
synsetId: 14112400-n
simpleMeaning: A short fit in which a person briefly stops and stares, with no other troubles, and then
  the brain shows quick waves three times each second.
scope: A short staring fit with no other troubles, also called simple absence; not a fit with shaking
  and not a daydream.
examples:
- During a pure absence she stopped and stared for a few seconds.
- His pure absence fits came with no other troubles.
