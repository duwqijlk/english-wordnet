simpleMeaning: To make an object by pouring a liquid material, such as melted metal or wax, into a shaped
  hollow and letting it harden.
scope: This is the shaping of an object by pouring material into a hollow form, not the stiff support
  worn over a broken bone or the hollow container itself.
examples:
- The sculptor cast the bronze in a single pour.
- They cast the engine parts from molten iron.
