simpleMeaning: In older groupings, a subgroup of rodents made of gnawing animals that matched the order
  of rabbits, hares and pikas
scope: An old name for a group of gnawing animals that matched the rabbit order, not the wider order of
  rodents.
examples:
- Duplicidentata once grouped the rabbits and hares with the rodents.
- In old books, Duplicidentata named the gnawing animals that are now called lagomorphs.
