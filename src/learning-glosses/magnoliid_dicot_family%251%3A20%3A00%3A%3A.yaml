simpleMeaning: A group of flowering plants with two seed leaves, seen as among the oldest of the flowering
  plants still living.
scope: A group of flowering plants with two seed leaves, seen as among the oldest still living; not a
  group of pines and not a single kind of plant.
examples:
- The magnoliid dicot family holds some of the oldest flowering plants.
- Botanists place the magnolia in the magnoliid dicot family.
