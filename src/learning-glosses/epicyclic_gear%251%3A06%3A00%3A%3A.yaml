simpleMeaning: An outer toothed wheel that turns round a middle sun wheel in a set of wheels.
scope: 'Also called a planet gear, a planet wheel and a planetary gear: an outer toothed wheel that turns
  round a middle sun wheel, not the middle wheel itself and not a wheel that turns on its own.'
examples:
- The epicyclic gear turned round the middle sun wheel.
- An epicyclic gear moves round the centre of the set.
