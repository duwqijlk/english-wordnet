simpleMeaning: In this joint, which moves freely, the round end of one bone sits in a round hollow in
  the other bone
scope: Also called articulatio spheroidea, cotyloid joint, enarthrodial joint, enarthrosis, and spheroid
  joint, this joint moves freely, with the round end of one bone sitting in a round hollow in the other,
  not a joint that bends only one way.
examples:
- The shoulder is a ball-and-socket joint.
- A ball-and-socket joint lets the leg move round.
