simpleMeaning: Strong, straight-grained wood from the lacewood tree, used for building, making furniture,
  and making tools.
scope: Strong, straight-grained wood from the lacewood tree, used for building, making furniture, and
  making tools; not soft wood, and not wood from any other tree.
examples:
- The carpenter chose lancewood for the tool handles.
- Lancewood is prized for its strength and straight grain.
