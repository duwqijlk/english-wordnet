simpleMeaning: a short blood channel in the heart that takes in most of the heart's veins and lets the
  blood out into the right upper chamber of the heart
scope: A short blood channel in the heart that takes in most of the heart's veins, also called a coronary
  sinus; not an artery and not a chamber of the heart.
examples:
- The sinus coronarius carries blood from the heart's veins.
- Blood from the sinus coronarius flows into the right atrium.
