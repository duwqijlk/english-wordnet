simpleMeaning: a machine that turns a picture into numbers a computer can read and keep
scope: A machine that turns a picture into numbers for a computer, also called an image scanner or a scanner,
  and not a printer or a photocopier.
examples:
- She put the old photo in the digital scanner to save it on her computer.
- The digital scanner turned the drawing into a file we could send by email.
