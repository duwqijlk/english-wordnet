simpleMeaning: In the part of the government that runs the country, this group watches the Central Intelligence
  Agency and advises the president on other lands, war, and the country's safety.
scope: 'Also called NSC: a group in the part of the government that runs the country which advises the
  president and watches the Central Intelligence Agency, not the Cabinet and not a court of law.'
examples:
- The National Security Council met to talk about the crisis.
- The president asked the National Security Council for advice.
