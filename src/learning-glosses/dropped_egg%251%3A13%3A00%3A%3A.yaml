simpleMeaning: the white and yolk of a hen, cooked in water that is just at the boil
scope: 'Also called poached egg: the white and yolk of a hen cooked in water that is just at the boil,
  not an egg boiled in its shell and not a fried egg.'
examples:
- She served a dropped egg on toast for breakfast.
- The dropped egg held its shape in the hot water.
