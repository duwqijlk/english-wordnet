simpleMeaning: Able to make people feel very strongly and disagree with each other
scope: A subject that makes people feel very strongly and disagree with each other, not a fizzy drink
  and not a thing with electric power.
examples:
- The charged question about the new law made the whole room argue.
- Abortion is a charged issue that still divides the town.
