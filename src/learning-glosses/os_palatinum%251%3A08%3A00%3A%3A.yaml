  the nose hollow and the floors of the eye sockets.
scope: One of a pair of oddly shaped bones, also called palatine and palatine bone, this one backs the
  roof of the mouth and helps shape the nose hollow and the floors of the eye sockets.
examples:
- The os palatinum forms the back of the roof of the mouth.
- Each os palatinum helps shape the nose hollow and the floor of an eye socket.
