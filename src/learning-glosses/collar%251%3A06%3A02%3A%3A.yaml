simpleMeaning: a strip of leather or rope put round an animal's neck to hold it or to show whose it is
scope: A strip of leather or rope put round an animal's neck to hold it or to show whose it is, not the
  band at the neck of a shirt and not a ring of stitching on a shoe.
examples:
- The dog wore a red leather collar.
- She put a new collar on the cat to show it was hers.
