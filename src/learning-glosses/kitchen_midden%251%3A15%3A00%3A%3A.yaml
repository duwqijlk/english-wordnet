simpleMeaning: In archaeology, shells and animal bones in a heap of household waste show where people
  lived long ago.
scope: Also called midden and eitchen midden, this is a heap of old household waste marking a place where
  people lived long ago.
examples:
- The kitchen midden held shells and bones from long ago.
- Digging the kitchen midden showed where the settlement had been.
