simpleMeaning: The life of a monk lived alone, in which the shared part of life is given up so that religious
  experience comes first.
scope: A monk's life lived alone for the sake of religious experience, not life in a shared house of monks
  and not a short stay alone; no other name is listed for this sense.
examples:
- His eremitism meant years alone in a small hut on the hill.
- Eremitism gives up shared life so that religious experience comes first.
