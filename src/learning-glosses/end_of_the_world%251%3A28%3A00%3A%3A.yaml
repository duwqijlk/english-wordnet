simpleMeaning: In the New Testament, the last day at the close of time, after Armageddon, when God will
  judge each person by the good and bad of a life on earth
scope: In the New Testament, this is the last day at the close of time, after Armageddon, when God will
  judge each person; doomsday, crack of doom, day of reckoning and eschaton are other names for it, not
  the last day of a person's life and not the ruin of the earth by people.
examples:
- They spoke of the end of the world after Armageddon.
- At the end of the world, God will judge each person.
