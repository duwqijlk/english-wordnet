simpleMeaning: a chemical formed when propenoic acid joins with another substance, either as a salt or
  as an ester
scope: This is a chemical made from propenoic acid; propenoate is another name for it, not the acid itself
  and not a plastic made from it.
examples:
- The factory uses acrylate in the mix for paints and glues.
- Acrylate salts are used in some water-absorbing gels.
