senseId: 'freudian_slip%1:04:00::'
synsetId: 00074912-n
simpleMeaning: A small mistake that, in Freud's view, comes from hidden wishes or clashes in the mind
  and can show them at work in healthy people.
scope: A small mistake that shows hidden wishes or clashes at work in a healthy person, not an ordinary
  mistake with no hidden wish behind it.
examples:
- He made a Freudian slip and called his teacher 'Mum'.
- Her Freudian slip showed what she really wished for.
