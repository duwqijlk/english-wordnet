simpleMeaning: A harmful growth in the soft core of bones, most often in the hip or in long bones.
scope: Also called endothelial myeloma, Ewing's sarcoma and Ewing's tumour, this is a cancerous growth
  in bone marrow, most often in the pelvis or in long bones.
examples:
- Ewing's tumor grew in the soft core of the bone.
- The doctors found Ewing's tumor in her hip.
