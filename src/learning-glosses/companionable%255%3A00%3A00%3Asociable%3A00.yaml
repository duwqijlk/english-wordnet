simpleMeaning: pleasant and easy to spend time with, in a friendly way
scope: A word for a person, an animal or a time that is pleasant and friendly to be with. It does not
  mean liking to meet and talk with many people.
examples:
- They have a companionable dog that sits with them all day.
- It was a companionable evening by the fire with old friends.
