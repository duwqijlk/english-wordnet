simpleMeaning: A soft rock full of small holes, made of calcium carbonate, a white mineral left by springs
  rich in lime.
scope: Also called calc-tufa; a soft rock of lime left by springs, not the hard volcanic rock of packed
  ash.
examples:
- Tufa formed round the spring where the water left its lime behind.
- The old wall was built of pale tufa, soft and full of holes.
