simpleMeaning: A germ that brings on chest and nose illness, such as a cold or a swelling of the small
  air tubes, most often in children.
scope: A germ that brings on nose and chest illness, not the flu germ and not a germ that strikes the
  stomach.
examples:
- Parainfluenza virus gave the toddler a harsh cough.
- The parainfluenza virus spread through the nursery.
