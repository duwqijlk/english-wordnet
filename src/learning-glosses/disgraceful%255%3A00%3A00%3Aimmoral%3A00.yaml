simpleMeaning: So wrong that it shocks people's sense of right and harms a person's good name
scope: Shocking and shameful are other names for this sense; it offends people's sense of right and harms
  a good name, not the wider sense of conduct that simply deserves disgrace.
examples:
- The disgraceful way the funds were spent shocked the whole town.
- Critics called the book disgraceful for its cruel scenes.
