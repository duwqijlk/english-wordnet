simpleMeaning: A large shrub that stays green all year, or a small tree, with white sweet-smelling bark,
  tough leaves and small purple-to-red flowers in bunches at the ends of the branches.
scope: A large shrub that stays green all year, or a small tree, with white sweet-smelling bark and small
  purple-to-red flowers; white cinnamon tree, wild cinnamon and Canella winterana are other names for
  this sense.
examples:
- Canella alba has white sweet-smelling bark.
- The Canella alba in the garden bore small purple flowers.
