simpleMeaning: a measure of radiation judged by how much of it can make charged bits
scope: This is a measure of radiation by its power to make charged bits, not a measure of the harm it
  does to a body and not a count of how long a person is near it.
examples:
- The worker's exposure dose was checked after the shift.
- The meter gave an exposure dose for the room.
