simpleMeaning: To grow bigger and then smaller again, over and over, in a steady beat
scope: 'Also called pulse: to grow bigger and then smaller again in a steady beat, not a shake from fear
  or excitement and not a beat much harder than usual.'
examples:
- His heart throbbed in a steady beat as he slept.
- The vein in his neck throbbed as he ran.
