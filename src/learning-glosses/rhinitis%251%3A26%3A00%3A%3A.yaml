simpleMeaning: The thin wet skin that lines the nose turns sore and swollen, most often with fluid running
  from it.
scope: Also called coryza, it is a sore, swollen state of the thin wet skin that lines the nose, most
  often with fluid running from it.
examples:
- The rhinitis made the nose run.
- The rhinitis came with a runny nose.
