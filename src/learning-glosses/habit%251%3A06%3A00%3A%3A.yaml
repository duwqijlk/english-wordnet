simpleMeaning: The clothes that people in a religious group wear, which show that they belong to that
  group
scope: This sense is the special clothes of a religious group, not a thing you do again and again and
  not the clothes worn for riding a horse.
examples:
- The nun wore a long black habit.
- The monks' habits were plain and brown.
