simpleMeaning: the act of making a person or thing seem small or less important than they really are
scope: This is the act itself, not one remark that does this, and not the word that describes a person
  or remark that does this.
examples:
- His constant belittling of the new worker made her want to leave.
- She was tired of the belittling from her manager and asked him to stop.
