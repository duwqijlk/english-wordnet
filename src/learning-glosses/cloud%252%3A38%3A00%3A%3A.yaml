simpleMeaning: to rise and swell in a thick, rolling mass.
scope: It describes something rising and swelling in a cloud-like mass, not covering the sky to make it
  dull and not making something hard to see.
examples:
- Smoke clouded above the burning houses.
- Dust rose and clouded in the air above the road.
