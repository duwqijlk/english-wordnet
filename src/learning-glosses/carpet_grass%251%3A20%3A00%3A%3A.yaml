simpleMeaning: Bunched wiry stems, often overrun by a dark fungus, mark this grass, from the West Indies
  but common in the southern United States
scope: Also called blackseed and smut grass, this grass comes from the West Indies but is common in the
  southern United States, and its bunched wiry stems are often overrun by a dark fungus.
examples:
- Carpet grass covered the lawn in the southern yard.
- The carpet grass stems were overrun by a dark fungus.
