simpleMeaning: Something not of the body that holds up or slows down what is being done.
scope: Something not of the body that holds up or slows down what is being done, also called check, balk,
  deterrent, hindrance, impediment, or handicap; not one of the sloping beams set side by side to hold
  up a roof.
examples:
- Fear was the baulk that kept them from asking for help.
- A lack of money proved a baulk to the whole plan.
