simpleMeaning: Each lower limb of a bird is one where the first and second toes point back and the third
  and fourth point forward
scope: The lower end of a bird's leg, with the first and second toes pointing back and the third and fourth
  pointing forward, not a limb with all toes pointing forward and not the adjective that describes toes
  shaped this way.
examples:
- The trogon's heterodactyl foot grips the branch.
- Each heterodactyl foot has two toes pointing back.
