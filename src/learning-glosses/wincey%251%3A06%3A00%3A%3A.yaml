simpleMeaning: Warm shirts, skirts, and nightclothes are most of all what this wool-and-cotton cloth is
  made for, plain or with a diagonal weave.
scope: This cloth is a mix of wool and cotton for warm shirts, skirts, and nightclothes, not wool alone
  or cotton alone.
examples:
- She sewed pajamas from wincey.
- His wincey shirt kept him warm.
