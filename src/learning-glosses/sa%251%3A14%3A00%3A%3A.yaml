simpleMeaning: A Nazi armed group set up by Hitler in 1921 that helped him gain power, but lost out to
  the SS after 1943
scope: A Nazi armed group, also called the Storm Troops and the Sturmabteilung; not the SS and not the
  German army.
examples:
- The SA marched through the streets in 1933.
- Hitler used the SA to gain power before the SS took over.
