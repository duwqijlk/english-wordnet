synsetId: 01039175-v
simpleMeaning: to make a fast run of short sounds, much like quick talk that goes on and on
scope: This is a fast run of short sounds like quick talk, not the short sharp sounds of teeth or a machine
  and not fast talk about small things by a person.
examples:
- The magpies chattered in the trees all morning, making a fast run of short sounds.
- The monkeys chattered in the trees, making short sounds that went on and on.
