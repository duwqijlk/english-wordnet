simpleMeaning: To hold together, its parts joined in sense so the whole looks right.
scope: To hold together, its parts joined in sense so the whole looks right; not to bring things together
  into one ordered whole that looks right.
examples:
- The story did not cohere from start to finish.
- Their argument failed to cohere.
