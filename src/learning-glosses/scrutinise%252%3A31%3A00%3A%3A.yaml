simpleMeaning: to look at something closely and with care to check that it is right and true
scope: Also called inspect, scrutinize and audit; this checking is done to prove something is right, not
  just to look at small details closely.
examples:
- She scrutinised the accounts to check that every number was right.
- The officer will scrutinise the papers before he says they are true.
