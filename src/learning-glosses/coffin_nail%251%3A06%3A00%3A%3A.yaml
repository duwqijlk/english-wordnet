simpleMeaning: tobacco ground into very small bits and wrapped in paper, for a person to smoke
scope: This is tobacco in very small bits wrapped in paper for smoking; butt, cigaret, cigarette and fag
  are other names for this sense, not a nail for a coffin and not loose tobacco for a pipe.
examples:
- He lit a coffin nail and smoked it on the porch.
- She bought a pack of coffin nails at the shop.
