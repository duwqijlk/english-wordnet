simpleMeaning: a kind of pain, like the pain you get from a wound, a burn, or a sore
scope: 'Also called smart and smartness: a kind of pain in the body, like pain from a burn. Not hurt feelings.'
examples:
- The smarting from the burn lasted all afternoon.
- He felt a smarting on his knee where the skin was cut.
