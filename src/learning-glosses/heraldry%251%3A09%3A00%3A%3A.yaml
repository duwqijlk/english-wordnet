simpleMeaning: The study of the shields and designs that stand for a person or family, how they are put
  into kinds, and how family lines are followed back
scope: This is the study of the shields and designs that stand for a person or family, and of how family
  lines are followed back. It is not just a family tree on its own, and not the shields and designs themselves.
examples:
- She studies heraldry to understand the shields on old castles.
- Heraldry helped him find which family the old shield belonged to.
