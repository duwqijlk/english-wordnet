simpleMeaning: Pale orange-yellow at first and reddish brown later, this round fungus has a firm dry outer
  skin, even when young, that splits as it grows old.
scope: It is a round fungus with a firm dry skin, even when young, that cracks with age, changing from
  pale orange-yellow to reddish brown.
examples:
- The young smooth earthball was pale orange-yellow with a firm dry skin.
- The old smooth earthball had turned reddish brown and its skin had cracked.
