simpleMeaning: To fool an opponent in cards by betting boldly on a weak hand, so that the opponent gives
  up a winning hand
scope: To fool a card opponent into giving up a winning hand by betting boldly on a weak one, not the
  act of bluffing itself and not frightening by a show of strength.
examples:
- He bluffed with a pair of twos and took the pot.
- She bluffed her rival out of the hand.
