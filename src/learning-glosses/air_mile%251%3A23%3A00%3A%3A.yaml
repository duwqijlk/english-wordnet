simpleMeaning: Once fixed by one minute of arc in latitude, this length of exactly 1,852 meters serves
  to find one's way at sea and in the sky.
scope: Mile, mi, international nautical mile, naut mi, and nautical mile are all other names for this
  length, once fixed by one minute of arc in latitude.
examples:
- The captain reckoned the crossing in air miles.
- The chart gave the distance in air miles.
