simpleMeaning: This motor runs on fuel from under the ground, not the liquid fuel cars burn, though it
  burns its fuel inside it much like a car motor does
scope: A motor that burns fuel inside it like a car motor, but runs on fuel from under the ground, not
  a car motor and not a motor that burns coal or wood.
examples:
- The old pump was driven by a gas engine.
- The factory used a gas engine to power the mill.
