simpleMeaning: Such plants as grapes, potatoes, and melons host one of several kinds of fungus of the
  Peronosporaceae group that live on and harm them.
scope: Also called downy mildew, this fungus lives on living plants, not on dead matter.
examples:
- False mildew harmed the grapes and the potatoes.
- The false mildew lived on the melons and spoiled them.
