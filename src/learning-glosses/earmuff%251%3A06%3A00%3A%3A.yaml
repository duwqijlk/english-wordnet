simpleMeaning: One of a pair of warm covers for the ears, usually joined by a band over the head, worn
  to keep the ears warm in cold weather
scope: A warm cover for an ear, one of a pair worn in cold weather; not a headphone used for listening,
  and not a plug put inside the ear.
examples:
- She wore earmuffs to keep her ears warm in the snow.
- His red earmuff slipped off one ear in the cold wind.
