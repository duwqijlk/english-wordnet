simpleMeaning: Of or about Protestant fundamentalism, or about the people who follow it.
scope: This word describes a thing or a person linked to Protestant fundamentalism, also called fundamentalist;
  not Protestant belief in general.
examples:
- His fundamentalistic views set him apart from other Protestants in his town.
- She wrote about fundamentalistic ideas in American Protestant life.
