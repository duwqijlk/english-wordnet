simpleMeaning: feeling respect for yourself or pleasure in something you value, or being something that
  gives a good reason for that feeling.
scope: This is a feeling of personal worth or satisfaction in something valued, not an outward show of
  dignity or noble manner.
examples:
- It was a proud day for the whole family.
- She was proud of her son for finishing the race.
