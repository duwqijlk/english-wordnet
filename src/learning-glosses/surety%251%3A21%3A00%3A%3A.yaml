synsetId: 13370410-n
simpleMeaning: property that the person you owe money to can take if you do not do what you agreed to
  do
scope: 'Also called security: property a lender can take when a debt is not paid, not a prisoner held
  to make another side keep an agreement.'
examples:
- He put his house up as surety for the loan.
- The bank took the land that had been given as surety.
