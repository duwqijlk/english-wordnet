simpleMeaning: having a very good name that many people know, and well thought of by people
scope: 'Also called honored, prestigious, and esteemed: having a good name and being well thought of;
  not just given a prize or title as a sign of respect.'
examples:
- Our honoured leader has served the town well for forty years.
- She is an honoured writer whose books are read around the world.
