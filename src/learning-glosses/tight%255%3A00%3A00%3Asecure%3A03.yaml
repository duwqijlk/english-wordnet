simpleMeaning: Fixed firmly so it cannot move or loosen; stiff rather than bending.
scope: This says something is held firmly and will not move, not that it is stretched straight or squeezed
  together.
examples:
- Check that the bolts are tight before the machine starts.
- The lid is tight and will not come off.
