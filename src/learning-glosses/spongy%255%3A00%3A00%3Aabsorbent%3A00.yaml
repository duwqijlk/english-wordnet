simpleMeaning: able to take in liquid and give it back when it is pressed
scope: This sense is about taking in liquid and giving it back when pressed; it is not the sense that
  means only soft and easy to press down.
examples:
- The spongy cloth took up all the water on the table.
- This spongy material holds water and lets it out when you press it.
