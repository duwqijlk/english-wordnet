simpleMeaning: Off the Pacific Coast of South America, cold sea water moves north and then turns west.
scope: Also called Peruvian current; a cold flow of sea water off South America, not a warm flow and not
  a flow in another ocean.
examples:
- Fishing boats work the cold Humboldt current off South America.
- The Humboldt current turns west after flowing north.
