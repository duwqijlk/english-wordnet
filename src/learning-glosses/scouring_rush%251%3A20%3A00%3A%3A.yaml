simpleMeaning: People once used this straight evergreen horsetail to clean kitchen utensils, its stems
  rough at the edges.
scope: Also called rough horsetail, this is a straight evergreen horsetail with stems rough at the edges,
  once used to clean kitchen utensils, not a plant with soft smooth stems.
examples:
- The scouring rush stood straight with stems rough at the edges.
- We once used scouring rush to clean kitchen utensils.
