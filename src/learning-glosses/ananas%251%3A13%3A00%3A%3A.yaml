simpleMeaning: Stiff leaves crown the top of this large fruit of warm lands, sweet and soft to eat, grown
  by farmers far and wide.
scope: This is a large sweet soft fruit of warm lands, crowned by stiff leaves, also called pineapple,
  and not the plant that bears the fruit.
examples:
- The ananas was sweet and soft, with stiff leaves at the top.
- Farmers grow ananas in warm lands far and wide.
