simpleMeaning: any of many woody plants of the cypress family that look like the plants they are named
  after
scope: Also called cedar, this is any of many woody plants of the cypress family that look like the plants
  they are named after, not a pine and not a fir.
examples:
- A cedar tree grew beside the old stone wall.
- We planted a cedar tree at the back of the yard.
