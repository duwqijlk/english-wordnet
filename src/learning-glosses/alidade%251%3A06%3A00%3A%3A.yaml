simpleMeaning: Lines drawn toward far things and the size of angles are found with this tool, which a
  surveyor sets on a flat board.
scope: 'Also called alidad: a tool a surveyor sets on a flat board to draw lines toward far things and
  find angles, not the moving top part of a theodolite.'
examples:
- The alidade helped him draw a straight line toward the far tree.
- She turned the alidade to find the size of the angle.
