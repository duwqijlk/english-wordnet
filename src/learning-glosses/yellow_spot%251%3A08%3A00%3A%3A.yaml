simpleMeaning: a small pale-gold middle part of the retina, the thin layer at the back of the eye, full
  of tiny cone-shaped cells that sense light and give clear, sharp sight
scope: A small pale-gold middle part of the retina, also called macula, macula lutea and macular area;
  not the white of the eye and not the blind spot.
examples:
- The yellow spot in the middle of the retina gives us clear sight.
- Light falls on the yellow spot when we look straight at a thing.
