simpleMeaning: a woman who works on the railroad and looks after the lights and track switches in a train
  yard
scope: A woman who looks after the lights and track switches in a train yard; not a man in the same job,
  and not the person who drives the train.
examples:
- The signalwoman changed the lights for the evening train.
- A signalwoman was on duty when the freight train came in.
