simpleMeaning: A measure that counts in tens, from the system based on metres, kilograms and seconds.
scope: A measure that counts in tens, from the system based on metres, kilograms and seconds, also called
  metric; not an imperial measure such as an inch or a pound.
examples:
- Convert all the measurements to metric units before you start.
- It is easier to work in metric units.
