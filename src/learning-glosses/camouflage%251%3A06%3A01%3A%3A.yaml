simpleMeaning: Cloth with marks of green, brown, black and tan, made so a person who wears clothes made
  from it is hard to tell apart from what is around them
scope: This is the cloth itself, not the act of hiding something and not a thing or plan used to hide
  or trick people.
examples:
- The soldiers wore uniforms made of camouflage that matched the trees.
- His jacket was made from green and brown camouflage.
