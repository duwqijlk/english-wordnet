senseId: 'monologue%1:10:02::'
synsetId: 07171527-n
simpleMeaning: a long stretch of talk by one person, above all one that leaves no room for others to speak
scope: One person talking at length, keeping others out of the talk; not a talk back and forth between
  people.
examples:
- His monologue about his trip lasted the whole dinner.
- She broke into a monologue and no one else could get a word in.
