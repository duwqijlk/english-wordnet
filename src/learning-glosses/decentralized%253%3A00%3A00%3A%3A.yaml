senseId: 'decentralized%3:00:00::'
synsetId: 01111666-a
simpleMeaning: not held in one main place but spread out, especially when power or work is given from
  one main body to smaller bodies in each area
scope: This means not held in one main place but spread out, especially power or work given to smaller
  bodies in each area; it is not just things being far apart in place, and it is not one main body keeping
  all the power and work.
examples:
- The country has a decentralized school system, with local towns making most choices.
- They wanted a decentralized office, so each town ran its own services.
