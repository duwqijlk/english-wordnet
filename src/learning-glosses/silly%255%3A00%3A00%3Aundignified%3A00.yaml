simpleMeaning: making people feel sorry for someone in a way that also looks down on them
scope: 'Also called ridiculous: this sense describes someone or something that makes others feel sorry
  for them in a way that also looks down on them, not the not-serious sense and not the dazed-after-hits
  sense.'
examples:
- The old man looked silly as he begged for love that would never come back.
- He made a silly fool of himself, chasing her for years with no hope.
