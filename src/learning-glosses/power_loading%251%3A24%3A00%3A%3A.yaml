simpleMeaning: The share of a plane's weight carried by each unit of its engine strength
scope: This is the share of a plane's weight carried by each unit of its engine strength; not the total
  weight of a plane, and not the top speed of its engine.
examples:
- The power loading of the small plane was low.
- Engineers checked the power loading before the test flight.
