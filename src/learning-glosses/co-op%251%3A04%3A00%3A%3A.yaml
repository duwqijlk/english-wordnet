simpleMeaning: a shop or firm owned together by its members, usually farmers or buyers, that makes and
  sells goods and services for their own good
scope: 'Also called a cooperative: a firm owned together by its members, not a firm owned by one person
  and not a charity.'
examples:
- The farmers set up a co-op to sell their milk together.
- She buys her bread from the local food co-op.
