simpleMeaning: a wheeled vehicle that moves by its own power, made to carry things
scope: A vehicle that moves on wheels under its own power and is made to carry things, not a person who
  carries things for a living and not a ship that carries planes.
examples:
- Refrigerated carriers have changed how food reaches the shops.
- The carrier brought the crates to the warehouse.
