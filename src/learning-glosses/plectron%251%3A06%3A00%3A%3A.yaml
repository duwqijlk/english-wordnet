simpleMeaning: With this small thin bit of metal, plastic or ivory, you pull the strings of an instrument.
scope: A small thin piece of metal, plastic or ivory for plucking the strings of an instrument; pick and
  plectrum are other names for this sense, and this is not a bow.
examples:
- He plucked the strings with a plectron.
- She lost her plectron during the song.
