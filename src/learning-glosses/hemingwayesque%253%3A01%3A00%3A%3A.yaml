simpleMeaning: The way Ernest Hemingway did things is what this word marks.
scope: A word for what is done in the manner of Ernest Hemingway, not in the manner of any other writer.
examples:
- Her short, plain sentences sounded Hemingwayesque.
- The story had a Hemingwayesque feel, with few words and much left unsaid.
