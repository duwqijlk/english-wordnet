simpleMeaning: A man who lives in a closed religious house and gives himself to prayer, quiet thought,
  and work.
scope: A man living in a closed religious house under religious vows; also called a monk; not the adjective
  for communal life shut away from the world under religious vows.
examples:
- The monastic rose before dawn to pray in the chapel.
- After years as a monastic, they still kept the same hours of prayer and work.
