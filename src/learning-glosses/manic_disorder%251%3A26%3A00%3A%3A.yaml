simpleMeaning: 'A mood illness: a person with it tends to act far too much, and at times in a wild or
  rough way.'
scope: Also called mania; a mood illness in which a person acts far too much, unlike a low mood.
examples:
- His manic disorder made him talk fast all night and spend money he did not have.
- She got help for her manic disorder after shouting at friends for no reason.
