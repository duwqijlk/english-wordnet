simpleMeaning: To burn, sear, or freeze living flesh with a hot iron, an electric current, or a burning
  chemical.
scope: Also called burn or cauterize, to burn, sear, or freeze living flesh with a hot iron, an electric
  current, or a burning chemical, not to make feelings or morals dead.
examples:
- The surgeon cauterised the cut to stop the bleeding.
- She cauterised the wart with a hot iron.
