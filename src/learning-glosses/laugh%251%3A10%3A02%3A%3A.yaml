simpleMeaning: the look on a person's face that is typical of laughing.
scope: This is only the expression on the face, not the sound of laughing and not a joke or funny remark.
  It is uncommon in modern English and survives mainly in descriptive writing about a face, as in 'a silent
  laugh'. The ordinary noun 'laugh' means the sound, so a reader will usually take it that way unless
  the sentence points to the face.
examples:
- His face wrinkled into a silent laugh of contempt.
- A slow laugh spread across her face before she shook her head.
