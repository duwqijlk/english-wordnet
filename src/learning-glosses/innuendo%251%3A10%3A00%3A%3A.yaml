schema: oewn-learning-gloss-v2
senseId: 'innuendo%1:10:00::'
synsetId: 07253115-n
simpleMeaning: a hint said in an indirect way, usually meant in an unkind way, that suggests something
  bad
scope: 'Also called insinuation: an indirect hint, usually unkind, that points to something bad. It is
  not a plain, direct statement said openly.'
examples:
- She did not accuse him directly, but her innuendo made it clear she thought he had taken the money.
- His innuendo about her past made everyone at the table feel uneasy.
