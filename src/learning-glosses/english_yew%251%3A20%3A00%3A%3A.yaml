simpleMeaning: The chief tree of its kind in Europe, living a very long time and growing very slowly,
  one of the oldest kinds in the world.
scope: Also called Old World yew and Taxus baccata; the chief tree of its kind in Europe, living a very
  long time and growing very slowly, not a fast-growing hedge tree and not a pine.
examples:
- The English yew grows very slowly in the churchyard.
- An English yew can live a very long time.
