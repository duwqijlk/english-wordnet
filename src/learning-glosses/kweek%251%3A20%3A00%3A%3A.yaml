simpleMeaning: From Europe, this creeping grass now grows in warm lands everywhere; lawns and grazing
  land use it, above all in the southern United States and India.
scope: Also called devil grass, doob, scutch grass and star grass, it is a creeping grass from Europe
  now found in warm lands everywhere.
examples:
- Kweek crept across the lawn.
- Kweek covers the pasture.
