simpleMeaning: blood tubes that carry blood away from the upper belly wall, the lower spaces between the
  ribs, and the belly
scope: 'Also called the vena musculophrenica: blood tubes that carry blood away from the upper belly wall,
  the lower spaces between the ribs, and the belly; not an artery and not a vein of the leg.'
examples:
- The musculophrenic vein carries blood away from the lower spaces between the ribs.
- Blood flows through the musculophrenic vein to the heart.
