simpleMeaning: a way of flying in which a plane moves to the side through the air
scope: This is a plane moving to the side in the air as a planned move. It is not a part cut from a plant,
  and not a small fall by a person.
examples:
- The pilot used a slip so the plane moved sideways as it came down.
- In a slip, the plane slides to the side through the air.
