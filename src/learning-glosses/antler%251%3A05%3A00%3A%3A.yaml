simpleMeaning: a horn that falls off and grows again each year, on an animal of the deer family
scope: A horn that falls off and grows again each year, on a deer, not a horn that stays for life and
  not a tusk.
examples:
- The stag shed an antler in the spring.
- The hunter found an antler on the forest floor.
