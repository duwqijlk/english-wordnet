simpleMeaning: Sold newly caught or smoked, these creatures live inland when grown but swim back to the
  sea to lay eggs, and are found in Europe and America.
scope: Also called a common eel, it is one of the creatures that live inland when grown, swim back to
  the sea to lay eggs, are found in Europe and America, and are sold newly caught or smoked.
examples:
- The freshwater eel swims back to the sea to lay its eggs.
- Freshwater eels from Europe are sold fresh or smoked.
