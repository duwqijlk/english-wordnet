simpleMeaning: A tight ring of hair pressed flat against the forehead or cheek.
scope: A single ring of hair pressed flat on the face, not a loose wave of hair and not a hairdo that
  covers the whole head.
examples:
- She wore a kiss curl on her forehead.
- The kiss curl on his cheek had been set with water.
