simpleMeaning: any of several slow-moving sea snails with a shell wound in a spiral, such as whelks, tritons,
  moon shells, and neritids
scope: A slow-moving sea snail with a spiral shell, not the small tadpole-shaped cold-water fish of the
  same name.
examples:
- A seasnail crept across the rock pool.
- Seasnails like whelks and moon shells have spiral shells.
