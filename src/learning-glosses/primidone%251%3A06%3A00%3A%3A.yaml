simpleMeaning: a drug sold as Mysoline used to help people with the great shaking fits called grand mal
  and with the steady shaking of essential tremor
scope: A drug for shaking fits and steady shaking, not a drug for pain and not a drug for low mood.
examples:
- The doctor gave him primidone for his grand mal seizures.
- She takes primidone each morning to keep the tremor down.
