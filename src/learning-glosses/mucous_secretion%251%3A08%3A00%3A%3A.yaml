simpleMeaning: A protective fluid released by moist body linings; in the gut it eases food along and shields
  surface cells, and in the nose, throat and lungs it helps block germs.
scope: The protective fluid from moist body linings, the same substance usually called mucus, not saliva
  or tears.
examples:
- A thick mucous secretion coated the back of his throat.
- The lining cells produce a mucous secretion that keeps the tissue moist.
