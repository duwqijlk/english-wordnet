simpleMeaning: the features of two things that let you see how they are alike or different
scope: 'Also called compare: these are the features that let you set two things side by side, not the
  link itself between things that are alike or different.'
examples:
- There is no comparison between the two books; one is far better.
- In size and shape, the two boxes bear no comparison.
