simpleMeaning: An upright plant that lives one or two years, grown widely, above all for hay and to make
  the soil better.
scope: This is an upright plant grown widely for hay and to better the soil, also called melilot or melilotus,
  and not a red clover or alfalfa.
examples:
- The farmer sowed sweet clover to feed the soil.
- Sweet clover stood tall in the hay field.
