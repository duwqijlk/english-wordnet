simpleMeaning: the quality of standing at a slant rather than straight up, as of a line or surface
scope: The noun for a slant away from upright, not the act of bending your body sideways and not a tendency
  to behave in a certain way; list is another name for this sense.
examples:
- The old tower has a noticeable lean to the left.
- Engineers measured the lean of the chimney.
