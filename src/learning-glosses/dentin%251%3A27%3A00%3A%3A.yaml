simpleMeaning: Most of a tooth is made of a hard, chalky stuff that is tougher and more tightly packed
  than bone.
scope: This is also called dentine, and is the hard stuff that makes up most of a tooth, not the ring
  round its soft middle.
examples:
- Most of a tooth is dentin, a hard chalky stuff.
- The dentin in his tooth was harder than bone.
