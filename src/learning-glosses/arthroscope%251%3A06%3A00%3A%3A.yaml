simpleMeaning: a thin tube with a light that is put into a joint so the inside of the joint can be seen
scope: A thin tube put into a joint to look inside it, not a tube used to look inside the stomach and
  not an X-ray picture of a joint.
examples:
- The surgeon used an arthroscope to look inside the patient's knee.
- The doctor guided the arthroscope into her shoulder joint to find the damage.
