simpleMeaning: The mother has her baby taken out through a cut in her belly and womb, a birth once thought
  to be how Julius Caesar was born.
scope: Also called cesarean, caesarian, abdominal delivery, caesarean, caesarean delivery, caesarean section,
  caesarian delivery, caesarian section, cesarean section, cesarian, and cesarian section; a birth by
  surgery, not a birth the usual way.
examples:
- The baby was born by cesarean delivery after a long labour.
- Her second child arrived by cesarean delivery.
