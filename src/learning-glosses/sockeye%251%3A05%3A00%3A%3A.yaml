simpleMeaning: After laying eggs, the grown fish die; this small salmon with red flesh is found in rivers
  and side streams of the northern Pacific and prized as food
scope: Also called blueback salmon, red salmon and sockeye salmon, it is a small salmon with red flesh
  from the rivers of the northern Pacific, prized as food, whose grown fish die after laying eggs.
examples:
- Sockeye laid eggs in the river.
- We ate sockeye.
