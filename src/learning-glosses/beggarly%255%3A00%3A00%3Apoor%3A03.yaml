simpleMeaning: marked by deep poverty, like the life of a person who must ask others for money
scope: 'Also called mean: showing deep poverty like that of a person who begs, not just having little
  money and not a hard life lived by choice.'
examples:
- They lived a beggarly existence in a cold room with no heat.
- The beggarly hut had a dirt floor and no glass in the windows.
