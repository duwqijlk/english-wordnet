simpleMeaning: To lead a person to the seat where they will sit, as in a theater or hall.
scope: This is not pointing something out and not displaying a film or performance; it is about leading
  a guest to a seat.
examples:
- An usher showed us to our seats near the stage.
- She showed the latecomers to seats at the back.
