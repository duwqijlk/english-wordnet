simpleMeaning: the soft living stuff that joins parts of the body together, found under the wet skin that
  lines the inside of the body
scope: The layer under the wet lining inside the body, not the lining itself and not the skin on the outside.
examples:
- The doctor looked at the submucosa under the lining of the gut.
- A small cut in the submucosa can bleed for a long time.
