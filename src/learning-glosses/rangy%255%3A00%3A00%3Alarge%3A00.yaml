simpleMeaning: giving lots of room to move around in
scope: This sense means giving lots of room to move around in; it is not tall and thin with long arms
  and legs, and it is not the sense of being suited to wandering from place to place.
examples:
- The rangy land gave the cattle lots of room to move around.
- They kept the horses on rangy ground with plenty of open space.
