simpleMeaning: Showing the true, basic nature of something rather than a false or surface version.
scope: This is not the sense of actually existing rather than imagined, and it is not a mathematical term;
  it means expressing the genuine, essential character of something.
examples:
- What she saw was the real man, not the polished public figure.
- The portrait shows the real character of the old king, not the legend.
