simpleMeaning: A liquid medicine or lotion that soothes, fights germs, or heals when put on the skin.
scope: This is a substance you put on your skin, not the act of putting something to use or a computer
  program.
examples:
- She bought an antiseptic application for the cut.
- The vet used a medicinal application on the horse's leg.
