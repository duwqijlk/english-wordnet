simpleMeaning: in a way that has no energy and holds no interest
scope: 'Also called dimly: in a way that has no energy and holds no interest, not in a weak or light colour.'
examples:
- The show went on palely, and few people in the room stayed awake to watch it.
- He spoke palely about his trip, and no one asked him a question.
