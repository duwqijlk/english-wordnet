simpleMeaning: real now in fact, and not only something that could become real
scope: This is about something that is real now, not something that could be real later. It is not just
  the general idea of being real at all.
examples:
- Use the existent roads, not the roads that are only planned.
- The existent population is much smaller than the population that might come later.
