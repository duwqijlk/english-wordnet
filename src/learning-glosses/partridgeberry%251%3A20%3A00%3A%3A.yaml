simpleMeaning: In the east of North America, a woody plant creeps along the ground, its shiny leaves staying
  on all year and its fruit scarlet.
scope: This woody plant creeps along the ground in the east of North America, also called a boxberry and
  a twinberry, with shiny leaves that stay on all year and scarlet fruit.
examples:
- The partridgeberry crept along the ground, with scarlet fruit among its shiny leaves.
- A partridgeberry grew in the east of North America, its leaves shiny all year.
