simpleMeaning: A false set of teeth made to take the place of missing ones
scope: A false set of teeth that takes the place of missing ones, also called plate and denture; not a
  single false tooth and not a brace.
examples:
- He took out his dental plate to clean it.
- Her dental plate replaced the teeth she had lost.
