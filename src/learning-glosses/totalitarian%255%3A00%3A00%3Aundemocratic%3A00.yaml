simpleMeaning: having a government where those in power hold full control from one center
scope: Used for a government that holds full control from the center. This is not a person who supports
  such a government, and not the general word for ideas linked to that system.
examples:
- They lived under totalitarian rule, with one party in full control.
- A totalitarian state controls the news, the schools, and the courts.
