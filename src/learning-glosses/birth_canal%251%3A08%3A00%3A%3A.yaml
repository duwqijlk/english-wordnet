simpleMeaning: An unborn baby moves along this way to be born, through the womb and the tube leading out
  of it.
scope: This way out of the womb is not the womb itself; it is the way an unborn baby moves along to be
  born.
examples:
- The baby moved through the birth canal.
- The birth canal opens to let the baby out.
