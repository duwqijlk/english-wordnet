simpleMeaning: In the plant group Seseli, any of many kinds with thick flat tops of small white or pink
  flowers and leaves cut into fine parts.
scope: Also called stone parsley, this is a plant of the Seseli group with small white or pink flowers,
  a different kind from the carrot grown for food.
examples:
- The moon carrot grew beside the path, its flat tops of white flowers showing above the leaves.
- Moon carrots bear small white or pink flowers in dense flat tops.
