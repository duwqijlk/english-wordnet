simpleMeaning: a tool with a small cup on the end of a handle, used to put out the flame of a wax stick
  that burns to give light
scope: A tool for putting out a flame, not a pair of scissors and not a lamp.
examples:
- She used the candlesnuffer to put out the candles on the table.
- The candlesnuffer hung beside the fireplace.
