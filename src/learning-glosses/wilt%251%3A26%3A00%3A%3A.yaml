simpleMeaning: any plant can catch this illness, most often when pests eating its roots make it hang down
  and dry up
scope: A plant illness that makes it droop, not the act of making a plant droop.
examples:
- The wilt spread through the field after the roots were attacked.
- Farmers feared the wilt that left their plants hanging down and dried up.
