simpleMeaning: A liquid soaks right through a thing that has this property, as when it soaks through a
  thin wall or spreads out through it
scope: 'Also called permeability: how well a liquid can soak right through a thing, not how well it holds
  a liquid back and not how fast it dries.'
examples:
- The permeableness of the cloth let the rain soak through.
- We tested the permeableness of the paper with water.
