simpleMeaning: An act of the body that happens on its own, without thought or learning, when something
  stirs it.
scope: This is an act of the body without thought or learning, not an act done on purpose.
examples:
- His reflex made him pull his hand back.
- Blinking at a bright light is a reflex.
