simpleMeaning: letting people see very great skill, in a bright and clear way
scope: This sense is about great skill that people can see, not about bright clothes and not about a rich,
  stylish look that tries too hard to get attention.
examples:
- The pianist's showy playing was full of fast notes and great skill.
- He gave a showy dance with hard steps done with great skill.
