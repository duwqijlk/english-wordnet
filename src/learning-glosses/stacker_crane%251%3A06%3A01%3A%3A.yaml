simpleMeaning: A lifting machine with a fork that lifts and moves goods in a store run by computers, putting
  them away on shelves and taking them out again.
scope: A lifting machine with a fork, used in a store run by computers, not a forklift driven by a person.
examples:
- The stacker crane lifted the pallet and put it away on a shelf.
- The new warehouse uses a stacker crane to store and fetch goods.
