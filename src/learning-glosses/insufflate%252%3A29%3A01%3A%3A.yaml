simpleMeaning: to treat a patient by blowing a powder or a gas into a hollow part of the body
scope: To treat a patient by blowing powder or gas into a hollow part of the body; not blowing onto a
  person in a church rite and not spraying medicine on the skin.
examples:
- The doctor will insufflate the powder into the patient's nose.
- Nurses insufflate the medicine into the ear canal.
