simpleMeaning: In mathematics, the value a function (a rule linking input to output) approaches as its
  input grows without end.
scope: This is the value a function tends toward in calculus, not a maximum allowed amount or a boundary
  line.
examples:
- The limit of this sequence as n goes to infinity is one.
- As x grows without bound, the function approaches a limit of zero.
