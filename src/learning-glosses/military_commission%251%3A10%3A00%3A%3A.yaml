simpleMeaning: An official paper given by a government that gives its holder the rank of an officer in
  the armed forces.
scope: 'Also called commission: an official paper that gives its holder the rank of an officer in the
  armed forces, not a letter naming a civilian post and not the rank itself.'
examples:
- He received his military commission from the government.
- A military commission made him an officer.
