simpleMeaning: the seeing part at the back of the brain, where sight signals carried by nerve threads
  from a relay deep inside first turn into what we see
scope: 'Another name for striate area and first visual area: the part of the brain where seeing starts,
  not the part that moves the eyes and not the part that hears sound.'
examples:
- The striate cortex turns light signals into what we see.
- Signals reach the striate cortex from the eyes.
