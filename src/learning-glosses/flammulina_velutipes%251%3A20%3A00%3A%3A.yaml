simpleMeaning: Edible mushroom of early spring or late fall, when few others grow, with smooth sticky
  orange-brown cap, velvet-soft stalk that blackens with age, and pale gills, often in groups.
scope: 'Also called winter mushroom: a mushroom good to eat, not a toadstool and not a mushroom grown
  in summer.'
examples:
- The Flammulina velutipes grows in groups in late fall.
- We picked Flammulina velutipes in early spring.
