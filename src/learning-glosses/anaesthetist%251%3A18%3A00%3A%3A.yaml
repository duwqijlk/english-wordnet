senseId: 'anaesthetist%1:18:00::'
synsetId: 09812936-n
simpleMeaning: a trained person who gives a patient medicine that stops pain or makes them sleep before
  they are treated
scope: 'Also called anesthesiologist and anesthetist: a trained person who gives a patient this medicine
  before treatment, not the person who does the main treatment.'
examples:
- The anaesthetist spoke to the patient before the operation began.
- An anaesthetist checked that the patient was fully asleep.
