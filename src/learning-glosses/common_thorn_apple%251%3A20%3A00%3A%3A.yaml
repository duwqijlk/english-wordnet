simpleMeaning: A tall, coarse tropical weed that grows in one season, has foul-smelling leaves, big white
  or violet trumpet-shaped flowers and spiky fruit, and is highly poisonous.
scope: This is the whole poisonous weed, not a hawthorn bush or the fruit of an apple tree.
examples:
- Common thorn apple grows on waste ground and along roadsides.
- Livestock that eat common thorn apple can die within hours.
