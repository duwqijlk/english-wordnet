simpleMeaning: A baked food made of fruit with rich biscuit dough, usually only on top of the fruit.
scope: A baked food of fruit with rich biscuit dough usually only on top; cobbler is another name for
  it, not a tart and not a cake.
examples:
- The deep-dish pie was full of apples.
- She made a deep-dish pie with biscuit dough on top.
