scope: Also called delta wave, this is the usual brain wave in a sleep test of a person in deep sleep
  without dreams, strong and only 1 to 4 beats each second.
examples:
- Delta rhythm showed up on the sleep test while she slept deeply.
- The delta rhythm in his sleep test was slow and strong.
