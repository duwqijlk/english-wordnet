simpleMeaning: Used to make threads and cloth, photo film, and a clear coat that dries hard, this chemical
  is formed from vinegar acid.
scope: A chemical used to make threads, cloth, photo film, and a clear hard coat; not a cloth or film
  itself, and not the acid it is made from.
examples:
- The dress was made from cellulose acetate.
- Cellulose acetate is used to make photo film.
