senseId: 'heat_of_fusion%1:19:00::'
synsetId: 11491978-n
simpleMeaning: Warmth taken in by a set amount of a solid at the point where it melts, to turn it into
  a liquid at the same warmth.
scope: Warmth taken in by a set amount of a solid as it melts into a liquid, not warmth given out when
  a liquid turns solid and not warmth taken in at other changes of state.
examples:
- Ice takes in a set amount of warmth as it melts; that is the heat of fusion.
- The heat of fusion is the warmth ice takes in as it melts into water.
