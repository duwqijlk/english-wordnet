synsetId: 00167686-n
simpleMeaning: In chess, a pawn of the other side that guards the square a pawn jumped over can catch
  it there, even though it has moved two squares.
scope: In chess, this is a capture on the square a pawn passed, not a capture on the square where the
  pawn now stands.
examples:
- He took the pawn en passant after it moved two squares.
- En passant let her take the pawn that had moved two squares.
