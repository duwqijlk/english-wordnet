simpleMeaning: A set of weights used for precious metals and jewels, built on a pound of 12 ounces and
  an ounce of 480 grains.
scope: Also called troy weight; the weight set for precious metals and jewels, not the common pound of
  16 ounces.
examples:
- Gold is weighed in troy, not in common pounds.
- The troy pound holds 12 ounces, not 16.
