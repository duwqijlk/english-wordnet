simpleMeaning: A number that tells something about a group of people, or about one part of it split up
  by age, sex, income, and so on
scope: A number that describes a group of people or part of one, not the adjective that means relating
  to the study of populations.
examples:
- The demographic showed that most people in the town were under thirty.
- Advertisers study demographics to learn who buys their goods.
