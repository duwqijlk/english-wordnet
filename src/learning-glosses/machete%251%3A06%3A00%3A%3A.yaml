simpleMeaning: A big, heavy knife that people use to cut plants or to fight with
scope: This is the large knife itself, used for cutting plants or as a weapon, not a small kitchen knife
  and not a sword.
examples:
- He used a machete to cut a path through the thick plants.
- The farmer carried a machete to clear small branches.
