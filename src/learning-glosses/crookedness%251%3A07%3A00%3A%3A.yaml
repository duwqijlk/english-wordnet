simpleMeaning: the quality of having bends, curves, or angles and not being straight
scope: The quality of a thing that is bent or turned and not straight; it is not about a person being
  dishonest or cheating.
examples:
- The crookedness of the path made it hard to walk in a straight line.
- He noticed the crookedness of the tree branch after the storm.
