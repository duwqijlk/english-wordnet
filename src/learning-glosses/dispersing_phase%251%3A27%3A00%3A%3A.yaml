simpleMeaning: the part of a mix of tiny bits that has the other bits spread through it
scope: The part of a mix of tiny bits that has the other bits spread through it; dispersing medium and
  dispersion medium are other names for this, not the thing spread through and not a plain liquid.
examples:
- The dispersing phase of the cream was water, with tiny drops of oil spread through it.
- Milk's dispersing phase holds tiny drops of fat spread through it.
