senseId: 'confabulate%2:36:03::'
synsetId: 01638429-v
simpleMeaning: Without knowing it, to put made-up things in place of real ones in what one remembers.
scope: For putting made-up things in place of real ones in what one remembers, without knowing it.
examples:
- After the accident, he confabulated, filling the gaps in his memory with things that never happened.
- She did not lie on purpose; she confabulated, and believed what she said.
