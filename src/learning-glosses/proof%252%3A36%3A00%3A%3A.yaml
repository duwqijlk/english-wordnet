simpleMeaning: to make a test copy of set text, an etching, or a photographic negative so that it can
  be checked before the final version.
scope: This is about making a trial print, not about showing something to be true and not about being
  resistant.
examples:
- The designer proofed the pages before the final print run.
- The photographer proofed the negatives to choose the best shots.
