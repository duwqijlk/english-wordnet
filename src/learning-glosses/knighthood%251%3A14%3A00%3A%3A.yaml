simpleMeaning: People of high rank who have been made knights, taken as a group
scope: People of high rank who are knights, taken as a group; not the rank itself, and not a single knight.
examples:
- The knighthood of the realm gathered for the coronation.
- He was proud to join the knighthood after years of service.
