simpleMeaning: to do with a system where businesses are owned by people, not the state, or to do with
  people who back that system
scope: 'Also called capitalist: to do with the system where businesses are owned by people, not the state,
  or to do with the people who back it, not backing or using that system.'
examples:
- They live in a capitalistic nation.
- The book describes capitalistic methods and incentives.
