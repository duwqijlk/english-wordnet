simpleMeaning: A harmless growth of the tissue that joins parts of the body, holding a jelly-like stuff
  inside.
scope: A harmless growth of the tissue that joins parts of the body, holding a jelly-like stuff inside;
  not a harmful growth and not a lump of fat.
examples:
- The myxoma was removed from the wall of the heart.
- A myxoma is a harmless growth, not a cancer.
