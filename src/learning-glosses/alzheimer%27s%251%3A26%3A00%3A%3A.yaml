simpleMeaning: A loss of mind worsening before old age, like the old-age kind but usually starting in
  the forties or fifties; memory fails first, then thought and speech, ending fully helpless.
scope: Also called Alzheimer's disease and Alzheimers; a disease of the mind that slowly worsens from
  the forties or fifties to full helplessness, unlike the loss of mind that only comes with old age.
examples:
- Her grandmother's Alzheimer's began with forgetting names.
- Alzheimer's took his memory first, then his speech.
