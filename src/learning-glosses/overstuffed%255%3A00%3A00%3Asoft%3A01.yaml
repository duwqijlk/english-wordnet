simpleMeaning: having a thick, deep soft covering, as a chair or sofa does
scope: This describes soft chairs and sofas with a thick covering, not a person who has eaten too much
  and not a bag filled too tightly.
examples:
- She sank into the overstuffed armchair by the fire.
- They bought an overstuffed sofa for the living room.
