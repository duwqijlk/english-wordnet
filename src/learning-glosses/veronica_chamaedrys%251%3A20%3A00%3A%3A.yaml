simpleMeaning: A plant of the lands of Europe, Asia and Africa, with bunches of blue-and-white flowers
  that grow from where the leaves meet the stem.
scope: Also called bird's eye and germander speedwell, this is a plant with blue-and-white flowers, not
  a plant with flowers of one color.
