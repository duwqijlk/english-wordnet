simpleMeaning: mention someone when you greet them, or speak their name to show friendship
scope: This means speaking someone's name to greet them or show friendship, not keeping them in your memory
  or honouring them in a ceremony.
examples:
- Remember me to your parents when you get home.
- She asked me to remember her to you and to thank you for the flowers.
