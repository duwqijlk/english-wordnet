simpleMeaning: In ballet, a dance for two people, usually a woman dancer and a leading man dancer
scope: This is a ballet dance for two people, not a piece of music made for two people to play or sing,
  which is another sense of this word.
examples:
- The duet at the end of the ballet told the story of the two lovers without words.
- She and her partner worked for weeks on the slow duet in the second act.
