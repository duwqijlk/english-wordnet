simpleMeaning: The making of time-keepers to agree.
scope: This sense is also called synchronization and synchronisation, for the making of time-keepers to
  agree, unlike the sense for an adjustment that brings a thing about, or about again, together, and unlike
  the sense for the bond of things that fall together.
examples:
- Synchronizing is the making of time-keepers to agree.
- Synchronizing makes time-keepers agree.
