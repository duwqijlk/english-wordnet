simpleMeaning: A tall, very woolly mullein whose stems carry tightly packed yellow flowers; the ancient
  Greeks and Romans dipped its stalks in tallow to make funeral torches.
scope: A tall woolly mullein with spikes of yellow flowers, not other mullein species with different flowers
  or leaves.
examples:
- Common mullein sends up a tall stalk covered in yellow flowers.
- The woolly leaves of common mullein feel soft to the touch.
