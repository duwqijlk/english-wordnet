simpleMeaning: A knot of special heart muscle in the right atrium's dividing wall, which takes signals
  from the sinoatrial node and passes them to the atrioventricular bundle.
scope: This is the heart's second electrical relay, not the sinoatrial node that starts each beat and
  not the bundle that carries the signal onward. It sits in the wall between the upper chambers and is
  often shortened to AV node.
examples:
- In a healthy heart, the atrioventricular node briefly delays each signal so the ventricles can fill.
- Damage to the atrioventricular node can slow the heartbeat enough to need a pacemaker.
