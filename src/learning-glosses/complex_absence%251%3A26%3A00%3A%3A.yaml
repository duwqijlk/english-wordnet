simpleMeaning: 'Other strange signs join a staring fit here: slack muscles, movements done without thought,
  or changes in blood flow, while the person stares and does not answer.'
scope: This staring fit comes with other strange signs, not on its own.
examples:
- During a complex absence she stared at the wall and did not hear her name.
- The doctor said the complex absence came with strange movements of his hands.
