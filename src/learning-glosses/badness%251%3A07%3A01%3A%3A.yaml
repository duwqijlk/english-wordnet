simpleMeaning: how strong something that people do not want is, such as pain or weather
scope: 'Another name for this is severity: this is about how strong pain or weather is, not about what
  is right or fair in how someone acts.'
examples:
- The badness of the pain kept her awake all night.
- We stayed inside because of the badness of the weather.
