simpleMeaning: 'Courage of the highest kind: a hero or heroine holds a brave heart when danger comes,
  above all in battle.'
scope: Valiancy, valorousness, valour, valor, heroism and gallantry are other names for this sense, the
  courage of a hero or heroine facing danger.
examples:
- The soldier's valiance in battle earned him honour.
- She faced the fire with valiance.
