simpleMeaning: one of a group of long-nosed water animals, most often found in fresh water in South America
  and southern Asia
scope: A long-nosed water animal of fresh water in South America and southern Asia, not a sea dolphin
  and not a whale.
examples:
- A river dolphin surfaced in the Amazon.
- River dolphins live in the fresh waters of South America and southern Asia.
