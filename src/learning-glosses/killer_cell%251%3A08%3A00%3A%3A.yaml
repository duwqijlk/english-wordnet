simpleMeaning: A T cell with a CD8 receptor that recognizes antigens on a virus-infected cell, binds to
  it, and kills it.
scope: A white blood cell that finds and kills a cell hit by a virus.
examples:
- The killer cell bound to the infected cell and killed it.
- Killer cells hunt down cells carrying a virus.
