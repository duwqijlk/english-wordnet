simpleMeaning: Inside a television set, this tube turns the signal the set gets into a picture on a screen
  that gives off light.
scope: This tube in a television set is also called a picture tube or a television tube.
examples:
- The kinescope in the back of the set had gone dark, so no picture showed.
- He took the broken kinescope out of the television set.
