simpleMeaning: In everyday talk, said of a person who thinks far too much of themselves
scope: 'In everyday talk, also called bigheaded, snooty and snotty: said of a person who thinks far too
  much of themselves, not a person who is merely fussy over details.'
examples:
- They're snobs — stuck-up and uppity and persnickety.
- Don't be so persnickety about your fancy car.
