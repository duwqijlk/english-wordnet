simpleMeaning: A storyteller in West Africa who keeps alive the spoken tales and history of a family or
  village.
scope: A storyteller in West Africa who keeps alive the spoken tales and history of a family or village,
  not a writer of history books and not a singer of songs.
examples:
- The griot told the children the story of their village.
- Every family in the village knew its griot by name.
