simpleMeaning: one of the two large areas of muscle and flesh that make up a person's bottom
scope: The rear-body sense of cheek, another name for a buttock, not the side of the face or the sense
  meaning impudent boldness.
examples:
- After hours in the saddle, the cyclist's cheeks were sore and raw.
- He fell backward on the ice and landed hard on his cheeks.
