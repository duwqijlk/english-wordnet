simpleMeaning: A trained person who takes charge of a ship to bring it into a harbour or take it out,
  through water that is hard to sail
scope: A person who leads ships in and out of a harbour, not the person who flies a plane and not the
  frame at the front of a train.
examples:
- The pilot met the ship at the mouth of the harbour.
- Only a pilot may take a big ship through the narrow channel.
