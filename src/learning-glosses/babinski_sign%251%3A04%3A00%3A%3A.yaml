simpleMeaning: Toes turning up when the sole's outer side is stroked hard from heel to front; normal in
  babies under two, but showing brain or spinal cord harm in older people.
scope: Also called Babinski and the Babinski reflex, this response is normal in babies under two and a
  sign of brain or spinal cord harm in older people.
examples:
- The Babinski sign was normal in the six-month-old baby.
- A Babinski sign in an older person can mean harm to the brain or spinal cord.
