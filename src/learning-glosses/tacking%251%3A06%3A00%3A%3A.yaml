simpleMeaning: a loose stitch used for a short time to hold layers of cloth together
scope: 'Also called baste, basting, and basting stitch: a loose stitch that holds cloth for a short time,
  not the final strong sewing that stays.'
examples:
- She used tacking to hold the two pieces of cloth in place.
- The tacking came out easily once she no longer needed it.
