simpleMeaning: With marks a few degrees above and below the body's usual heat, this slim tube of silver
  liquid metal takes a person's heat.
scope: It is also called a clinical thermometer, and it takes a person's heat with a slim tube of silver
  liquid metal marked a few degrees either side of the body's usual heat.
examples:
- The mercury-in-glass clinical thermometer showed a heat a few degrees above the usual.
- The mercury-in-glass clinical thermometer showed the heat was back to the usual.
