senseId: 'granulocytopenia%1:26:00::'
synsetId: 14095378-n
simpleMeaning: The white cells that fight germs fall far below their normal number in a sudden blood sickness,
  often brought on by rays or by drug treatment.
scope: Also called agranulocytosis and agranulosis, it is a sudden blood sickness in which the white cells
  that fight germs fall far below their normal number.
examples:
- The blood test showed granulocytopenia.
- The doctor found granulocytopenia after the drug treatment.
