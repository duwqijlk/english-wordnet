simpleMeaning: A low green plant of the western United States that keeps its leaves all year and grows
  partly flat along the ground.
scope: This is the low evergreen herb of the western United States, also called purple heather and Brewer's
  mountain heather; other heathers and other low plants of the west are other senses.
examples:
- Phyllodoce breweri grows low and partly flat over the rocks.
- The Phyllodoce breweri keeps its leaves through the winter.
