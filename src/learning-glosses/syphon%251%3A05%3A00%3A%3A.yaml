simpleMeaning: A tube-shaped part of a water animal, especially of a soft-bodied sea creature called a
  mollusk, through which water can flow in or be pushed out.
scope: A tube-shaped part of a water animal, especially of a mollusk, through which water can flow in
  or be pushed out; also called a siphon; not the tube that runs from liquid in a vessel to a lower level
  outside it so that its own weight pulls the liquid through, and not the act of moving liquid off or
  emptying it by such a tube.
examples:
- The clam drew water in through its syphon to feed.
- A squid can push water out through its syphon to move.
