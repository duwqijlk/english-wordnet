simpleMeaning: A piece that is one of the parts a bigger thing is made of, usually flat and with four
  straight sides
scope: A flat sheet that is one part of a larger thing, not a group of people and not a board with switches.
examples:
- The wooden panel covered one side of the wall.
- One panel of the door was cracked.
