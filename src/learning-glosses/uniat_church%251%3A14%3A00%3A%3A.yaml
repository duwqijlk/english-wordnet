simpleMeaning: Any one of several Christian groups in eastern Europe or the Middle East that accept the
  Pope as head but keep their own form of worship
scope: One of several churches in eastern Europe or the Middle East that accept the Pope as head but keep
  their own form of worship, also called a Uniate Church; not a church that follows the Pope in all its
  worship and not a church that rejects the Pope wholly.
examples:
- The Uniat Church in Lviv keeps its old form of worship.
- She attends a Uniat Church that honours the Pope.
