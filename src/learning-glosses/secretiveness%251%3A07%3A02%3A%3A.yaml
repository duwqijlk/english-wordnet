senseId: 'secretiveness%1:07:02::'
synsetId: 04659534-n
simpleMeaning: A settled way of behaving, keeping what one knows or does out of sight of others.
scope: Also called secrecy, a settled way of behaving that keeps what one knows or does out of sight of
  others, not the use for a lack of openness about what one does or means.
examples:
- His secretiveness made it hard to know what he was planning.
- Her secretiveness about the trip kept us guessing for weeks.
