simpleMeaning: a loud, deep and full quality in a sound
scope: This sense is about the loud, deep quality of a sound in general. It is not the shaking sense in
  physics, and not the special quality given to speech sounds by the mouth and throat.
examples:
- The resonance of the big bell filled the hall.
- The drum has a deep resonance that you can hear across the room.
