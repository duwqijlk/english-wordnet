simpleMeaning: The seed of a plant, eaten as food, and food made from that seed
scope: This seed food is also called golden gram, green gram, green soy, mash bean, monggo, moong, mung,
  mung bean and munggo, and is not a fresh pod eaten as a vegetable and not the plant itself.
examples:
- The cook soaked the green beans overnight before making soup.
- Green beans are often sprouted and eaten in salads.
