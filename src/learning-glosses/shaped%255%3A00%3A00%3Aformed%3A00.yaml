simpleMeaning: made to fit by, or as if by, work or hard trying that changes the outer lines of a soft
  lump that can be bent or pressed
scope: This means made to fit by work on a soft lump, not just having the form of something else.
examples:
- A shaped handgrip is easy to hold because it fits the hand.
- The shaped lump of clay fit exactly into the corner.
