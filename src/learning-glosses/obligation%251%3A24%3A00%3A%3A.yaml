simpleMeaning: a link between people in which one person owes thanks or help to another for a service
  or kind act they were given
scope: Owing thanks or help to a person who did something for you; not a legal agreement about payment
  and not the general social push to do your duty.
examples:
- After all his help, she felt a deep obligation to him.
- He did not want to be under any obligation to his neighbors.
