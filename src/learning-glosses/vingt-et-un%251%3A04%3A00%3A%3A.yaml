simpleMeaning: a gambling game played with cards, where you try to hold cards that add up to more than
  the banker's but no more than 21
scope: 'Also called blackjack and twenty-one: a card game against the banker, not poker and not a game
  of pure luck.'
examples:
- We played vingt-et-un until someone's cards added up to 21.
- At vingt-et-un, she beat the banker with a count of 20.
