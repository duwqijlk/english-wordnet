simpleMeaning: On Caribbean islands and along the southern United States coast grows a small bushy tree
  whose fibers are very long and silky.
scope: 'Also called sea island cotton: a small bushy tree that gives long silky cotton, not the East Indian
  shrub grown for its flowers.'
examples:
- Tree cotton grows on Caribbean islands.
- Tree cotton gives fibers that are very long and silky.
