simpleMeaning: Bringing something to its close by completing what remains.
scope: The act of bringing something to its close by completing it only; not a surface's texture, not
  the point or time at which something stops, not top quality, not the place where a race ends, not the
  race that concludes a contest, not someone's downfall, not an event that ends something, not a wine's
  aftertaste, not ending something in general, not finally doing something, not coming to an end, not
  giving a surface a coating, not eating all the food on a plate, and not ending a relationship with someone.
examples:
- The speaker's finishing was greeted with applause.
- The judges praised the skater's finish, which was sharp and controlled.
