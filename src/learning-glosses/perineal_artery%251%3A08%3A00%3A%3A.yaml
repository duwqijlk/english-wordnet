simpleMeaning: Feeding the outer parts of the area between the legs is a blood tube that comes off a larger
  one deep inside.
scope: Also called arteria perinealis, this blood tube comes off a larger one deep inside, and it is not
  that larger tube.
examples:
- Blood reaches the outer parts of the area between the legs through the perineal artery.
- The outer parts of the area between the legs get their blood from the perineal artery.
