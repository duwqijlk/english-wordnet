simpleMeaning: a small shell that flies very fast and makes a high, rushing sound and then a loud bang
  when it hits
scope: 'Also called whizbang shell and whizzbang: a small shell that whizzes and then bangs on hitting,
  not a firecracker and not a big gun.'
examples:
- The whizbang flew over the trench and burst with a bang.
- Soldiers learned the whizbang by its whizzing sound.
