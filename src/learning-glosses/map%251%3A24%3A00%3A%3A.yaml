simpleMeaning: in mathematics, a rule that links every item in one set to an item in another set
scope: This is the mathematical link between two sets, not a drawing of the earth's surface, nor any of
  the verb senses such as making a diagram or planning something in detail.
examples:
- The course introduces the idea of a map from one set to another.
- In topology, a map can be continuous without being a simple line.
