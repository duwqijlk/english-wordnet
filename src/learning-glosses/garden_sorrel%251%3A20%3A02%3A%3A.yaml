simpleMeaning: It stays close to the ground and lives for many years, with small leaves of a pale silvery
  green, shaped like eggs or like arrowheads.
scope: A low plant with small pale leaves, not the taller sorrel with large sour leaves grown for salads.
examples:
- Garden sorrel grows along the edge of the path.
- We found garden sorrel with small silvery leaves near the fence.
