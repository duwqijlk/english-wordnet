simpleMeaning: a group of leaves that grow in tight circles from one center, usually at or close to the
  ground
scope: A group of leaves growing in tight circles, usually near the ground, not a rose-like ornament worn
  as a badge.
examples:
- The plant's rosette of leaves sat close to the ground.
- A rosette grew in a tight circle from one center.
