simpleMeaning: A prickly shrub of warm America that keeps its leaves all year half climbs and half stands,
  its divided leaves folding at a touch or a change of light.
scope: A prickly shrub of warm America whose leaves fold at a touch, not a true climber and not a low
  herb.
examples:
- The sensitive plant folded its leaves when I touched them.
- The sensitive plant closed its leaves when the light changed.
