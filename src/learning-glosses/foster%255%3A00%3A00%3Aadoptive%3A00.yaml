simpleMeaning: giving or getting the care of a parent, though not joined by birth or by law
scope: This describes a parent, child or home in this kind of care; it is not the verb sense about bringing
  up a child in this way.
examples:
- She grew up in a foster home with kind people.
- He is a foster child who lives with a new family.
