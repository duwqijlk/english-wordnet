simpleMeaning: The act of turning the head from side to side to mean no, disbelief, or puzzlement.
scope: Moving from side to side to say no or to show disbelief, also called a headshake, not a nod and
  not a shake of the whole body.
examples:
- Her headshaking told me she did not believe a word of it.
- There was much headshaking in the crowd when the news was read out.
