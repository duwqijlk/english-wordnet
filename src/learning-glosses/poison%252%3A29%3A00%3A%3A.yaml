simpleMeaning: to give a person or animal a material that can hurt them, make them ill, or kill them
scope: Giving a harmful thing to a person or animal, not the harmful thing itself and not a bite or sting
  that kills.
examples:
- She poisoned her husband, but he did not die.
- The farmer poisoned the rats that were eating his corn.
