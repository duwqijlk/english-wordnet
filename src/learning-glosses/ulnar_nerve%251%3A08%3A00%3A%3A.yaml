simpleMeaning: A cord that feeds the small muscles of the hand and the skin on its inner side, running
  along the inner side of the arm past the elbow.
scope: Also called the cubital nerve and nervus ulnaris, this cord runs along the inner side of the arm
  past the elbow and feeds the hand.
examples:
- The ulnar nerve runs along the inner side of his arm.
- The ulnar nerve feeds the small muscles of the hand.
