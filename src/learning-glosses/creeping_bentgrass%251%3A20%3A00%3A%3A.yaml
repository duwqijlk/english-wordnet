simpleMeaning: Long runners spread this common grass of fields and lawns along the ground
scope: A grass found in many fields and lawns that grows out by long stems that run along the ground;
  creeping bent is another name for this sense, and it is not a weed or a grass that grows only in a clump.
examples:
- Creeping bentgrass is good for lawns because it spreads fast.
- The golf course used creeping bentgrass for its greens.
