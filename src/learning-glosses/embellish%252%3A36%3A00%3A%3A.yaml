simpleMeaning: to make something look nicer by adding colour or other pretty things
scope: 'Also called grace, decorate, ornament, adorn and beautify: this is about making a thing look nicer
  by adding things, not about changing a story by adding untrue parts.'
examples:
- She embellished the dress with small gold beads.
- He embellished the room with bright paint and flowers.
