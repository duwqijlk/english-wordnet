simpleMeaning: A tree of southern Europe stays green all year, with green parts that look much like those
  of the plant it is named for, and wood that is hard.
scope: This tree of southern Europe, which stays green all year and gives hard wood, is also called evergreen
  oak, holm oak, or holm tree.
examples:
- A holly-leaved oak stays green all year.
- The holly-leaved oak has hard wood.
