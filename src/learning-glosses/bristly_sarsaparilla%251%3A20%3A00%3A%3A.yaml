simpleMeaning: a stiff-haired herb of eastern and central North America, with black fruit and bark used
  as medicine
scope: This is a stiff-haired herb of eastern and central North America with black fruit and bark used
  as medicine; bristly sarsparilla and dwarf elder are other names for it, not wild sarsaparilla and not
  a smooth-stemmed herb.
examples:
- The bristly sarsaparilla grew at the edge of the woods.
- Its black fruit marked the bristly sarsaparilla among the other herbs.
