simpleMeaning: In computing, a piece of code that points from one part of a program, or one item in a
  list, to a different program or list.
scope: This is the computing instruction, not the physical circuit carrying data between places or the
  channel for communication between groups.
examples:
- Each link in the list pointed to the next record.
- The program crashed when it followed a link to a missing module.
