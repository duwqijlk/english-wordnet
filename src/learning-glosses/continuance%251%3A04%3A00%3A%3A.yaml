simpleMeaning: The deed of keeping on with a deed, with no break.
scope: This sense is also called continuation, for the deed of keeping on with a deed, with no break,
  unlike the sense for the mark of lasting or keeping on in time, and unlike the sense for the span of
  time while a thing keeps on.
examples:
- Continuance is the deed of keeping on.
- Continuance keeps on.
