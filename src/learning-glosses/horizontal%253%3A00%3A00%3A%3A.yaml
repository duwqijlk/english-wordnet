simpleMeaning: flat and level, running in the same direction as the line of the horizon or of a base line
scope: This is the adjective for a flat, level line or surface, not the noun for a thing that lies flat.
examples:
- The floor must be horizontal before we lay the tiles.
- Draw a horizontal line across the top of the page.
