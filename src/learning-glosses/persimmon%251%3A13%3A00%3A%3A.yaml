simpleMeaning: an orange fruit like a plum, that you can eat when it is fully ripe
scope: This is the fruit itself, not the tree that this fruit grows on.
examples:
- She waited until the persimmon was soft before eating it.
- He cut the ripe persimmon into pieces for dessert.
