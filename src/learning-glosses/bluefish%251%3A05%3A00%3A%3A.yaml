simpleMeaning: A blue-grey sea fish of warm waters, eaten as food and caught for sport, that chases shoals
  of small fish into the shallows.
scope: A blue-grey sea fish of warm waters, caught for food and sport, not the fatty bluish flesh of the
  fish eaten as food.
examples:
- The bluefish chased the shoal right up to the beach.
- Anglers prize bluefish for the fight they put up.
