simpleMeaning: square pieces of meat or food from the sea, cooked in hot oil and then dipped in any of
  several sauces
scope: Also called fondu. This is meat or sea food cooked in hot oil, not the dish of hot melted cheese
  or chocolate for dipping bread or fruit.
examples:
- For dinner we had a meat fondue with three different sauces.
- The beef fondue cooked quickly in the hot oil at the table.
