senseId: 'bill_of_particulars%1:10:00::'
synsetId: 06571105-n
simpleMeaning: the details of what will be dealt with in a criminal trial, telling the accused and the
  court what facts the accused will have to answer
scope: This names the specific points to be dealt with at a criminal trial and the facts the accused must
  answer, not the charge that starts the case and not the court's final decision.
examples:
- The lawyer asked for a bill of Particulars before the trial.
- The bill of Particulars set out the facts the accused had to meet.
