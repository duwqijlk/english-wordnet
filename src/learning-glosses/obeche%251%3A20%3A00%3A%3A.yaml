simpleMeaning: A big west African tree with big, hand-shaped, lobed leaves and side bunches of little
  white blooms and seeds with one wing, giving soft white to pale yellow wood.
scope: This sense is also called samba, arere and obechi, for a big west African tree with big, hand-shaped,
  lobed leaves and side bunches of little white blooms and seeds with one wing, giving soft white to pale
  yellow wood.
examples:
- Obeche grows in west Africa.
- Obeche wood is soft and pale.
