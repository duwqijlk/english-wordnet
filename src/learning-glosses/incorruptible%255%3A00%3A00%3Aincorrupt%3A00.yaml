simpleMeaning: not able to be led to do wrong or dishonest things
scope: This sense is about a person who stays honest and cannot be led to do wrong; it is not about a
  thing that does not rot or break down.
examples:
- The incorruptible judge would not take money to change his decision.
- People trusted her because she was incorruptible and always fair.
