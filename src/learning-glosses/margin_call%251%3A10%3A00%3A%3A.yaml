senseId: 'margin_call%1:10:00::'
synsetId: 07207321-n
simpleMeaning: A demand from a broker that a person with an account put in more money until the money
  in the account reaches the least amount the broker asks for
scope: Also called call; a demand from a broker for more money, not a demand for a loan and not a bill.
examples:
- The broker made a margin call after the shares fell.
- A margin call forced him to put in more money.
