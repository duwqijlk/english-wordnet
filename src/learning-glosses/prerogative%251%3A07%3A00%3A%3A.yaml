senseId: 'prerogative%1:07:00::'
synsetId: 05186242-n
simpleMeaning: a right that only one person or group can have, especially a right passed down in a family
  or given with an official job
scope: 'Also called privilege, and another name for this sense is perquisite: a right held by only one
  person or group, not a right that everyone has.'
examples:
- Voting was once the prerogative of rich men only.
- Signing this paper is the prerogative of the head teacher.
