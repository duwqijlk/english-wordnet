simpleMeaning: A show worker at a travelling fair whose act is doing nasty things that make people feel
  sick
scope: This is a show worker at a travelling fair whose act is doing nasty, sick-making things. It is
  not a person with an odd or unusual way of being.
examples:
- At the old carnival, the geek shocked the crowd with his unpleasant act.
- People paid to watch the geek perform his disgusting act at the fair.
