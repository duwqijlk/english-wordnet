simpleMeaning: a dip in a mountain range, lower than the peaks on each side, where you can cross over
scope: A low place where you can cross a range of mountains, also called a pass, not a cut in a surface
  and not the plain V-shaped hollow.
examples:
- We got through the notch before it started to snow.
- The road climbs to a notch between two high peaks.
