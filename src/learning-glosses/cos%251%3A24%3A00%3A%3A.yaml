simpleMeaning: In maths, a number found by dividing the side next to an angle by the longest side of a
  triangle that has a right angle (a 90-degree corner)
scope: 'Also called cosine: this is the maths number from a triangle with a right angle, not a lettuce
  with long dark-green leaves.'
examples:
- In our maths class, cos 60 is equal to 0.5.
- Use cos of the angle to find the length of the side next to it.
