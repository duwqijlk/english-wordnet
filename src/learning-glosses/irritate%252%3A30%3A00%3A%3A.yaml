senseId: 'irritate%2:30:00::'
synsetId: 00504796-v
simpleMeaning: To set a part of a living thing going in its usual way, such as moving, tightening, or
  sending a nerve signal, by something that stirs it
scope: To stir a living part into its usual action, not to make skin or a body part sore, and not to annoy
  a person.
examples:
- The scientist irritated the glands of a leaf to see how they moved.
- A touch of light irritated the plant's leaves, and they folded shut.
