simpleMeaning: made to lead people to a wrong idea, on purpose or by accident
scope: 'Also called deceptive: this describes a thing that gives a wrong idea, whether it was planned
  or not; it is not just a plain mistake made by the reader.'
examples:
- The ad was misleading and made the room look much bigger than it is.
- Misleading signs sent drivers the wrong way, though no one meant to trick them.
