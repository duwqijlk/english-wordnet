simpleMeaning: Carried by females but striking only males, this passed-down muscle-wasting disease is
  the most common form of its kind.
scope: The most common form of muscle-wasting disease, carried by females but striking only males, not
  a form that strikes females as well.
examples:
- Doctors told them the boy had pseudohypertrophic dystrophy, the most common form of muscle-wasting disease.
- The boy's pseudohypertrophic dystrophy was carried by his mother but struck him, not her.
