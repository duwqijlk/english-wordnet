simpleMeaning: the wood of a tree from the southern United States and Mexico, grown for its smooth brown
  oval nuts
scope: Wood taken from this tree, not the smooth brown oval nut that you eat and not the living tree itself.
examples:
- The table was made of dark pecan and felt very strong.
- He used pecan to make the shelves for his kitchen.
