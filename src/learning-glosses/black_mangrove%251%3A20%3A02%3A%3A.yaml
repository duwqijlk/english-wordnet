simpleMeaning: An Australian tree that looks like the shore tree of the West Indies and Florida.
scope: An Australian tree that looks like the shore tree of the West Indies and Florida; not the West
  Indies shore tree itself, with its dense thickets and short roots that bend up from the ground, and
  not a tree of dry inland ground.
examples:
- Black mangrove lines the Queensland shore.
- The black mangrove roots held the muddy bank.
