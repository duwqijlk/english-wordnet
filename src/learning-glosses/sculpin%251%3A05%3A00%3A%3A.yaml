simpleMeaning: With wide mouths and big heads covered in sharp points, these fish are usually bare of
  scales, one of many kinds of the scorpionfish group.
scope: It is one of many kinds of fish in the scorpionfish group, with a big spiny head and a wide mouth.
examples:
- The fisherman held up a sculpin and pointed to its wide mouth.
- We counted three sculpins with big heads and wide mouths.
