simpleMeaning: its outer flower parts form a hood over violet-purple flowers mixed with white, borne on
  a spike; a North American orchid
scope: Also called purple-hooded orchis and purple orchis; a North American orchid with hooded flowers,
  not a garden orchid grown in a pot.
examples:
- The showy orchis bloomed in the wet woods, its hood bright against the green.
- We found a showy orchis with violet-purple flowers mixed with white.
