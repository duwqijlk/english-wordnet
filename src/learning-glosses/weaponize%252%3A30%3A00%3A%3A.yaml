simpleMeaning: to turn something into a weapon, or to use it as one, even if it was not made for fighting
scope: To turn something into a weapon or use it as one, not to make a real weapon in a factory and not
  to fight with one.
examples:
- Some fear that scientists will weaponize new discoveries.
- The group tried to weaponize the virus for use in war.
