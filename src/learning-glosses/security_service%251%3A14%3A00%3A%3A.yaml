simpleMeaning: The government body in the United Kingdom that guards the country from spies and threats
  inside its borders.
scope: MI and Military Intelligence Section 5 are other names for this sense; this body guards the country
  from spies and threats inside its borders, not the police force and not an army abroad.
examples:
- The Security Service guards the United Kingdom from spies.
- She worked for the Security Service on threats inside the country.
