simpleMeaning: hinted at rather than spoken, and worked out from actions or words
scope: This is the implied sense, also called silent, not the sense meaning fully grasped or clear.
examples:
- No one said it, but it was understood that the meeting would start at nine.
- Her silence was understood as agreement.
