simpleMeaning: An upright forest tree of Cuba and Jamaica with leaves of changing hairiness and orange-yellow
  or orange-red flowers; it gives fairly dense wood for cabinet work and gun stocks.
scope: 'Also called blue mahoe, mahagua, mahoe, majagua, or Hibiscus elatus: an upright forest tree of
  Cuba and Jamaica, not a palm tree and not a shrub grown for fruit.'
examples:
- The Cuban bast in the yard has orange-red flowers.
- Carpenters prize Cuban bast wood for cabinet work.
