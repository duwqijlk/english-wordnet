simpleMeaning: A group of people chosen to look into charges of crime and to judge whether there is enough
  reason to bring a person to trial
scope: This is a body that screens crime charges before trial, not the small group that decides guilt
  at a trial and not a court hearing itself.
examples:
- The grand jury heard the evidence and decided whether to bring charges.
- After weeks of testimony, the grand jury returned its decision.
