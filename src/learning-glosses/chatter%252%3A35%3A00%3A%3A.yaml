simpleMeaning: to cut in a rough, uneven way, because the tool shakes as it moves
scope: This is rough, uneven cutting done by a shaking tool, not fast talk about small things and not
  the high sound of birds or monkeys.
examples:
- The drill began to chatter and left rough marks on the metal.
- If the blade chatters, the cut will come out uneven.
