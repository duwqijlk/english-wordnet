simpleMeaning: A wild pig of the Old World with a slim body and large tusks, from which most farm pigs
  come; it was brought to the United States.
scope: This is a wild pig of the Old World with a slim body and large tusks, from which most farm pigs
  come; boar and wild boar are other names for it, not a farm pig and not a pig of the New World.
examples:
- A Sus scrofa rooted in the forest floor.
- Sus scrofa was brought to the United States long ago.
