simpleMeaning: a bush from Japan that loses its leaves, with sweet white flowers whose petals spread in
  points, opening before the leaves come out; grown in the United States for show
scope: A bush from Japan grown for show, not the tall tree magnolias and not other spring flowers.
examples:
- The star magnolia by the gate opened its white flowers before any leaves showed.
- We planted a star magnolia in the front yard because it stays small.
