simpleMeaning: The process that makes a substance able to pull iron and steel, for a short time or for
  good
scope: Also called magnetic induction and magnetization, this is the way a thing is made able to pull
  iron and steel, not the pull itself and not the thing that has already been made able to pull.
examples:
- The magnetisation of the bar took only a moment.
- After magnetisation, the needle could pick up small nails.
