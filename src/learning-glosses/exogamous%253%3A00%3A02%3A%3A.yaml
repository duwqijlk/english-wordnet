simpleMeaning: a flower that can take pollen from a flower that is not closely related to it and so bear
  seed
scope: Also called exogamic, this is said of a flower that can take pollen from a flower that is not closely
  related to it, not the custom of marrying outside one's group.
examples:
- The exogamous flower bore seed only after pollen arrived from an unrelated plant.
- The gardener crossed the exogamous flower with one from a far-off bed.
