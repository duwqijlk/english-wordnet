simpleMeaning: in everyday talk, a holiday place in the Catskill Mountains of New York, once the favourite
  of Jewish guests
scope: 'Also called borscht belt, borscht circuit, and borsht circuit: a holiday area in the Catskill
  Mountains once favoured by Jewish guests, not a belt worn round the waist.'
examples:
- Many comedians learned their trade playing the borsht belt.
- Families from New York spent their summers in the borsht belt.
