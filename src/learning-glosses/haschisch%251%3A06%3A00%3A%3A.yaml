simpleMeaning: A cleaned sticky extract of the hemp plant, used as a drug that makes people see things
  that are not there
scope: A cleaned sticky extract of the hemp plant, used as a drug that makes people see things that are
  not there, not the raw plant and not another drug; hash, hashish and hasheesh are other names for this
  sense.
examples:
- He smoked haschisch and saw strange visions.
- Haschisch comes from the hemp plant.
