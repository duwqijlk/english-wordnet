simpleMeaning: the middle point of the opening of the ear canal, used when measuring the skull
scope: 'Also called auricular point: the middle point of the ear canal opening, not the ear canal itself
  and not another spot on the skull.'
examples:
- The auriculare lies at the centre of the ear opening.
- The auriculare is used as a set mark when measuring the skull.
