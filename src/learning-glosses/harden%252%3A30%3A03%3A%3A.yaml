simpleMeaning: to make someone become used to something, so that they accept it as a normal part of life
scope: This is about a person getting used to something unpleasant; it is not about a thing becoming hard,
  not about making a thing hard, and not about making metal hard by heating it and cooling it in oil.
examples:
- Years of working outside in winter hardened him to the cold.
- The soldiers were hardened to the noise and danger of war.
