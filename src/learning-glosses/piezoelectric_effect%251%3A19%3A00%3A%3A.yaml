simpleMeaning: Some crystals, quartz and Rochelle salt among them, release an electric charge when squeezed,
  or swell and shrink when a voltage is applied across them.
scope: 'Another name for piezoelectricity: the two-way link between pressure and electric charge in certain
  crystals; not the charge that friction produces, and not a battery.'
examples:
- Engineers use the piezoelectric effect to turn pressure into an electrical signal in sensors and microphones.
- Quartz watches rely on the piezoelectric effect, because a tiny quartz crystal vibrates at a steady
  rate when a voltage is applied.
