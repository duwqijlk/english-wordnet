senseId: 'betterment%1:26:00::'
synsetId: 14446155-n
simpleMeaning: A change for the better that makes land, a building, or a facility (a place made for a
  special use) worth more
scope: This sense is a change that makes land, a building, or a place built for a use worth more; it is
  not just any change for the better or progress, and not the act of fixing people's problems.
examples:
- Adding a new roof was a betterment that raised the farm's value.
- The betterment to the school building made the property worth more.
