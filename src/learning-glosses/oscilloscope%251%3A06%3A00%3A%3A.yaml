simpleMeaning: A piece of electronic equipment that shows changing electric signals as pictures.
scope: A piece of electronic equipment that shows changing electric signals as pictures; scope and cathode-ray
  oscilloscope are other names for this sense, not a television and not a radio.
examples:
- The oscilloscope showed the wave as a bright line.
- He watched the oscilloscope trace the signal.
