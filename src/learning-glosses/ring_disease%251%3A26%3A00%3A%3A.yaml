simpleMeaning: A germ called Pseudomonas solanacearum gives sickness to tomatoes, potatoes, tobacco and
  the like.
scope: Also called ring rot and tobacco wilt, this is the name for the plant sickness that a germ called
  Pseudomonas solanacearum gives.
examples:
- The ring disease spread through the tomato crop.
- Farmers watch for ring disease on their tobacco plants.
