simpleMeaning: How much binary notation a digit from another base is worth on average; roughly 3.3 binary
  digits go with every decimal digit.
scope: This is a conversion ratio between number bases; it is not the mathematical factor that divides
  a whole number, and not a single binary digit.
examples:
- Engineers use the equivalent-binary-digit factor to estimate how many bits a decimal number will need.
- With an equivalent-binary-digit factor of about 3.3, ten decimal digits call for roughly thirty-three
  binary digits.
