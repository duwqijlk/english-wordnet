simpleMeaning: Set deep in the ground to carry the weight of a building above it, a long post of wood,
  steel, or concrete.
scope: A long post driven into the ground to hold a building up; also called a pile.
examples:
- The workers drove a piling into the river bed.
- Each piling held up one corner of the pier.
