simpleMeaning: A ring-shaped compound formed inside a single molecule from an acid that also carries an
  alcohol group
scope: This is a ring-shaped compound formed inside a single molecule from an acid that also carries an
  alcohol group, not a straight-chain compound and not an ordinary acid.
examples:
- A lactone forms when the two ends of one molecule join in a ring.
- The new lactone had a five-sided ring.
