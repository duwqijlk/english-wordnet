simpleMeaning: a still form of trypsin, made by the pancreas and turned into working trypsin by a gut
  chemical called enterokinase in the small gut
scope: The still form of trypsin made by the pancreas, not trypsin itself and not a gut chemical that
  acts on food.
examples:
- Trypsinogen waits in the pancreas until it is turned into working trypsin.
- The small gut turns trypsinogen into trypsin with the help of enterokinase.
