simpleMeaning: The rules that give the sole right to a new invention are what this part of the study of
  rules looks at
scope: The part of the study of rules that looks at the rules for new inventions, not the rules about
  crime and not the rules about buying and selling houses.
examples:
- She studied patent law before she became a lawyer for inventors.
- Patent law decides who may make and sell a new invention.
