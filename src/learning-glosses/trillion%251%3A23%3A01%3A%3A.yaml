simpleMeaning: in Britain, the number written as a one followed by 18 zeros
scope: In Britain, a one followed by 18 zeros, not the American trillion of 12 zeros.
examples:
- In England they call a quintillion a 'trillion'.
- The old book said a trillion was a one followed by 18 zeros.
