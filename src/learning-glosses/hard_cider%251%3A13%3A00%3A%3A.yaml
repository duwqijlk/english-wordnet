simpleMeaning: an alcoholic drink made from apple juice left to ferment, called cider or cyder in Europe,
  above all in Britain
scope: An alcoholic drink from fermented apple juice, called cider or cyder in Europe, not apple juice
  and not beer.
examples:
- They serve hard cider at the farm stand in autumn.
- A glass of hard cider is stronger than apple juice.
