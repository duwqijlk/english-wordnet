simpleMeaning: Of someone with a mental illness that makes them act in silly ways, laugh for no clear
  reason, hold false beliefs, and go back to childlike ways
scope: This word is for a person with this form of mental illness, not for someone who is simply silly
  or laughing.
examples:
- The hebephrenic patient laughed for no clear reason.
- He was called hebephrenic because his mannerisms seemed foolish and childlike.
