simpleMeaning: to avoid possible bad results or punishment for doing something that was not allowed
scope: To avoid bad results for a forbidden act; escape, get by, get off and get out are other names for
  this sense, not stepping aboard a bus or train and not reaching a place after trouble.
examples:
- He hoped to get away with cheating on the test.
- She got away without paying for the broken window.
