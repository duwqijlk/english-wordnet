simpleMeaning: A very narrow hollow pipe that holds liquid by drawing it up through its narrow space.
scope: A very narrow hollow pipe that holds liquid by drawing it up; capillary and capillary tubing are
  other names for this sense, not a wide pipe and not a drinking straw.
examples:
- The liquid rose up the capillary tube on its own.
- She drew a drop of blood into a capillary tube.
