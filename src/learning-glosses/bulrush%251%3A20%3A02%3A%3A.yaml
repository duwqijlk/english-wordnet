simpleMeaning: Tall marsh plant; cylindrical seed heads burst when ripe, scattering fluff; long flat leaves
  woven into mats and chair seats; native to North America, Europe, Asia and North Africa.
scope: This is the tall marsh plant with cylindrical seed heads; bullrush and cat's-tail are other names
  for it, and it is not the tall rush with soft arching stems that bulrush also names.
examples:
- A stand of bulrush swayed at the edge of the marsh.
- Bulrush leaves were dried and woven into mats.
