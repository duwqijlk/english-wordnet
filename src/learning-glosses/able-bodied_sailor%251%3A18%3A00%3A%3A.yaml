simpleMeaning: a person who works on a trading ship and has been taught special skills for the work
scope: This is a trained person who works on a trading ship; not a sailor in the navy and not a worker
  on a ship with no special training.
examples:
- The able-bodied sailor tied the ropes and checked the sails before the ship left port.
- After two years at sea, the able-bodied sailor knew every job on the ship.
