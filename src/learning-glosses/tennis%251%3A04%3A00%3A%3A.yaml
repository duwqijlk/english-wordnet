simpleMeaning: a game for two or four people who use rackets to hit a ball back and forth over a net that
  splits the court in two
scope: This game with rackets, a ball and a net across a court; not a game played with a bat, and not
  a game played with the hands only.
examples:
- They played tennis on the court behind the school.
- She is good at tennis and hits the ball over the net well.
