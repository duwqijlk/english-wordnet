simpleMeaning: Electric signals go in and sound comes out strong enough for people far away to hear it.
scope: Also called speaker, loudspeaker, speaker system, and speaker unit, this turns electric signals
  into sound that people far away can hear.
examples:
- The loudspeaker system filled the hall with sound.
- They set up a loudspeaker system so people far away could hear.
