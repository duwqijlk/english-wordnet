simpleMeaning: to make a person unable to help themselves and unable to keep themselves safe
scope: To make someone unable to help or defend themselves; not to lie flat, face down, to show respect
  or to give in.
examples:
- The long illness prostrated him, leaving him too weak to get up or care for himself.
- The attack prostrated the small force, and they could no longer fight back.
