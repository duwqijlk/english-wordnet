senseId: 'euphemize%2:32:00::'
synsetId: 00935069-v
simpleMeaning: To speak of a thing with a mild word used in place of a harsher one.
scope: Of a notice about job cuts, or a death spoken of as passing away.
examples:
- The notice euphemized the job cuts as a restructuring.
- She euphemized his death, saying only that he had passed away.
