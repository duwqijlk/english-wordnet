simpleMeaning: One of several fish caught for food or sport, in the drum family (a group of fish), that
  come from warm Atlantic waters near the North American coast
scope: One of several drum-family fish from warm Atlantic seas near North America, not the large mackerel
  type and not the small fish from California seas.
examples:
- Fishers caught kingfish in the warm water off Florida.
- Kingfish from the drum family are common along the warm Atlantic coast.
