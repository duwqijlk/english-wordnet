simpleMeaning: A middle shade, neither dark nor very light, of the colour of a clear sky, with much less
  green in it than that colour
scope: A middle shade of the colour of a clear sky with little green in it, not a darker shade and not
  the cornflower plant.
examples:
- Her dress was cornflower blue, a soft middle shade.
- He painted the kitchen wall cornflower blue.
