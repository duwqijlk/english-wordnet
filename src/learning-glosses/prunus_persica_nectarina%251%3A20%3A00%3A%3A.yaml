scope: This is a kind of peach, or a changed form of it, with smooth-skinned fruit and flesh that is yellow,
  usually; nectarine and nectarine tree are other names for this sense, and it is one of the peach kinds,
  close to the common peach grown for its fruit.
examples:
- Prunus persica nectarina bears fruit with smooth skin.
- The flesh of Prunus persica nectarina is yellow, usually.
