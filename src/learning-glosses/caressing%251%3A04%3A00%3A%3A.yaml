simpleMeaning: loving play, or play before sex that does not touch the sex parts of the body
scope: Loving play, or play before sex that does not touch the sex parts of the body; kissing, hugging
  and petting are other names for this sense, and it is not the act of stroking in a loving way in general.
examples:
- They spent a long time in gentle caressing before they made love, all kisses and soft touches.
- She liked the slow caressing, the kissing and holding, with no rush toward sex.
