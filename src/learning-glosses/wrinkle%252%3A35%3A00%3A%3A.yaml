simpleMeaning: to make small folds or lines on a smooth flat thing, or to make a pressed line in it; the
  old word crisp for this is no longer used
scope: To make small folds or lines on a smooth flat thing, or a pressed line in it, not a small fold
  in a surface, not pulling cloth or skin into folds, not a thing that gets folds by itself, and not making
  a thing folded or creased in a general way.
examples:
- She wrinkled the smooth paper by pressing it hard.
- He wrinkled the sheet of paper by folding it in half.
