simpleMeaning: This plant grows over much of Europe, North Africa, and western Asia, and now grows wild
  in the United States, like its common kin and put to the same uses.
scope: This names a plant like the common teasel, put to the same uses, that grows over much of Europe,
  North Africa, and western Asia and now grows wild in the United States.
examples:
- The fuller's teasel grew wild beside the road in the United States.
- She planted fuller's teasel much like the common teasel.
