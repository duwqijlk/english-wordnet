simpleMeaning: People hold on to a long piece of metal and are pulled up the hill along the ground on
  their skis by this machine.
scope: 'Also called Alpine lift and T-bar: a machine that pulls skiers up the hill along the ground, not
  a lift with seats.'
examples:
- The T-bar lift pulled us up the hill on our skis.
- We took the T-bar lift to the top of the slope.
