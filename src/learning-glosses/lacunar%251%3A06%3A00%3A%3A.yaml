simpleMeaning: A pretty panel set deep into a ceiling or a dome, made for show.
scope: A pretty panel set deep into a ceiling or a dome, made for show; coffer and caisson are other names
  for this sense, not a flat painted panel and not a plain ceiling beam.
examples:
- The lacunar in the dome was painted gold.
- Each lacunar of the ceiling held a carved rose.
