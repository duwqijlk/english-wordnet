simpleMeaning: a man-made material made when many small parts of a chemical called acrylonitrile are joined
  together in a long chain
scope: This is the material made in this way, not the hard, clear solid that can be shaped or used in
  paints and glue, and not the cloth made from a similar material.
examples:
- The factory makes acrylic from acrylonitrile.
- This acrylic was made by joining many small chemical parts together.
