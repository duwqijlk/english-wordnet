simpleMeaning: very strong excitement or very strong interest in something, and not held back in any way
scope: Very strong excitement or a very strong interest in something, not the disease spread by the bite
  of a sick animal.
examples:
- When the team won, madness filled the stadium as fans shouted and waved flags.
- He has a real madness for old cars and spends every weekend working on them.
