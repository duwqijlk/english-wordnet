simpleMeaning: For its swollen papery cup of orange-red, this Old World plant is grown for show and lives
  many years.
scope: Also called bladder cherry, it belongs with the Old World plants grown for show, not the South
  American houseplant grown for its red or yellow fruit.
examples:
- The winter cherry showed its swollen papery orange-red cup.
- The papery cup of the winter cherry stayed bright orange-red.
