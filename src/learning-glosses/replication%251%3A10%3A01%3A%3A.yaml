simpleMeaning: a fast answer to a question or to something someone says, especially a clever one or one
  that finds fault with it
scope: 'Also called return, counter, retort, comeback, riposte and rejoinder: a fast clever or sharp answer.
  It is not the copying that happens before a cell splits, not doing a test again, and not a reply in
  a law case.'
examples:
- When asked why he was late, his replication made the whole class laugh.
- Her replication was so sharp that the teacher stopped and stared.
