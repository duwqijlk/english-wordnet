simpleMeaning: The act of mixing the parts of a thing together until they are one smooth whole.
scope: Also called blend; not the slow change from one shade to another, which is a different sense of
  blending.
examples:
- The blending of the paints gave the wall one even colour.
- Good blending of the spices makes the sauce taste the same all through.
