simpleMeaning: Easy and free in sex ways, with no hold.
scope: This sense is also called light, easy, loose, wanton, and promiscuous, for being easy and free
  in sex ways, with no hold, where light is easygoing and uninhibited about sexual matters, easy is having
  sex without serious commitment or restraint, and loose is treating sex casually, with little restraint
  in sexual conduct, unlike the sense for marking, or fit for, a slovenly loose woman, used especially
  of women.
examples:
- She was sluttish, easy in sex ways.
- He was sluttish, free with no hold.
