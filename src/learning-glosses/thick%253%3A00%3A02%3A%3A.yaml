simpleMeaning: Fairly heavy and closely packed in texture, so it flows slowly or hangs in the air.
scope: This is the texture of a liquid or gas, not the distance across a solid or a crowd packed closely
  together.
examples:
- The soup was too thick to pour from the ladle.
- Thick fog covered the harbour all morning.
