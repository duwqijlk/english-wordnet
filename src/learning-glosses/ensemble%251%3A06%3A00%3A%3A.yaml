simpleMeaning: a set of clothes that are made to go well together
scope: A set of clothes worn together as one look. It is not a group of musicians or actors, and not one
  single piece of clothing.
examples:
- She wore a blue ensemble with a matching hat and shoes.
- His ensemble of a grey jacket and dark trousers looked neat.
