simpleMeaning: In these fits a person blacks out while the muscles go stiff, then the whole body jerks
  and shakes
scope: It is also called generalized epilepsy, grand mal, and grand mal epilepsy, fits that knock a person
  out and shake the whole body.
examples:
- His epilepsia major began with his body going stiff.
- During epilepsia major she lost feeling for what went on around her.
