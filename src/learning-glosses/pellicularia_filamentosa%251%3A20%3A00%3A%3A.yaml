senseId: 'pellicularia_filamentosa%1:20:00::'
synsetId: 13036836-n
simpleMeaning: A fungus that brings a disease to potatoes, marked by black rough spots on the parts of
  the plant that grow underground.
scope: Also called potato fungus and Rhizoctinia solani; a fungus that sickens potatoes, set apart from
  harmless soil fungi by the black rough spots it leaves on the tubers.
examples:
- Pellicularia filamentosa left black spots on the potato tubers.
- The crop failed after Pellicularia filamentosa spread through the field.
