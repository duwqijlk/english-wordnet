simpleMeaning: An object you can hold, given as a sign of approval or special honour.
scope: This is not the money or prize given for winning; it is the object that stands as a sign of honour.
examples:
- The trophy on the shelf is an award for twenty years of service.
- She keeps her awards in a glass cabinet.
