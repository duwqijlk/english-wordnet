simpleMeaning: the study, using ideas about what is real, of how the universe began and what it is like
scope: The study of how the universe began and what it is like, done through ideas about what is real,
  not the science study of the universe's growth and build.
examples:
- In cosmology, he asked what is real and how the universe began.
- Her book on cosmology uses ideas about what is real to say what the universe is like and how it began.
