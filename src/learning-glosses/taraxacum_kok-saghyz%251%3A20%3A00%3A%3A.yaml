simpleMeaning: A dandelion that lives for many years, from Kazakhstan, grown for its thick roots, which
  hold much rubber.
scope: 'Also called kok-saghyz, kok-sagyz and Russian dandelion: a dandelion from Kazakhstan grown for
  the rubber in its thick roots, not a dandelion grown for salad leaves and not a dandelion of North America.'
examples:
- Taraxacum kok-saghyz is grown for its rubber-rich roots.
- Farmers in Kazakhstan grow Taraxacum kok-saghyz for rubber.
