simpleMeaning: the act of forcing a thing out of a place with power
scope: 'Also called projection: the act of forcing a thing out, not the act of taking a thing in.'
examples:
- The expulsion of air from the bellows fed the fire.
- The expulsion of the stone cleared the pipe.
