simpleMeaning: A grass that lives for one year, grows like a weed, and is cut to make hay.
scope: Also called goose grass and Texas millet; a grass that lives for one year and grows like a weed,
  not a grass that lives for many years.
examples:
- Panicum Texanum grew thick along the field edge.
- The farmer cut Panicum Texanum for hay.
