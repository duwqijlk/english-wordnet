senseId: 'signature%1:10:03::'
synsetId: 07042575-n
simpleMeaning: a tune that people hear and know as the sign of a performer, a dance band, or a radio or
  TV programme
scope: A tune linked to a performer, a dance band, or a radio or TV programme, not the sharp and flat
  signs at the start of written music, and not a printed sheet folded into a book.
examples:
- Listeners knew the radio programme by its signature, a tune played at the start of each show.
- The dance band opened every night with its signature.
