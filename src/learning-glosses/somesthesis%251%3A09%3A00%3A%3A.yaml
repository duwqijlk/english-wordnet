synsetId: 05667701-n
simpleMeaning: Feeling, not seeing, tells a person what the body is doing, through the skin, the limbs,
  and the parts inside.
scope: Also called somaesthesia, somaesthesis, somataesthesis, somatesthesia, somatic sense, somatic sensory
  system, somatosensory system, or somesthesia, it is what the body feels from within, not sight or hearing.
examples:
- Through somesthesis, a person feels the heart beat.
- Through somesthesis, a person feels hunger.
