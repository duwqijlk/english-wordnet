simpleMeaning: a strip of cloth wound tight to stop blood from a blood tube by pressing on it
scope: A strip of cloth wound tight to stop blood from a blood tube, also called a tourniquet; not a loose
  cover for a small cut and not a sticky plaster.
examples:
- The nurse put a compression bandage on his arm to stop the bleeding.
- A compression bandage pressed hard on the wound.
