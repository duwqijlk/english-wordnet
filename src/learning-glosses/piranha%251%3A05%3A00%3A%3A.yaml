simpleMeaning: a small fish from fresh water in South America that hungrily eats meat and attacks and
  kills living animals
scope: 'Also called caribe and pirana: a small meat-eating fish of South America that attacks living animals,
  not a plant-eating fish and not a fish from the sea.'
examples:
- A piranha can bite an animal that comes into the river to drink.
- Piranhas hunt together in the rivers of South America.
