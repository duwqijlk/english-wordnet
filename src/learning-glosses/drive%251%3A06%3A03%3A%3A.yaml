simpleMeaning: In computing, a piece of equipment that records information on a storage medium or reads
  it back from one.
scope: This is a computer storage device, not a journey in a car, not the act of applying force to move
  something, not a road leading to a house or a tree-lined scenic road, not a machine part that passes
  on power, not a strong inner need or the trait of being highly motivated, not a campaign to advance
  a cause, not a hard golf or tennis stroke, not the herding of animals overland, and not any of the verb
  senses such as operating a vehicle.
examples:
- I saved the file to an external drive before shutting down.
- The laptop's drive failed, so she lost all her photos.
