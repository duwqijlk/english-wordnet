simpleMeaning: A common tall timber tree of western North America, widespread, with dark green needles
  in bunches of two to five and thick bark that forms dark brown plates when old.
scope: Also called ponderosa, bull pine, ponderosa pine, and western yellow pine; not a shrub and not
  a tree of eastern North America.
examples:
- The Pinus ponderosa stood tall above the western forest.
- We camped beneath a Pinus ponderosa with thick bark.
