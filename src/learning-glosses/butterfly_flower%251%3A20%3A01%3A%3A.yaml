simpleMeaning: With finely cut leaves and showy blooms of many colours, this is one of many kinds of plant
  of the group Schizanthus.
scope: This plant is also called poor man's orchid and schizanthus, and it is not the shrub of Dutch Guiana
  with pink flowers streaked with purple.
examples:
- The butterfly flower had showy blooms of many colours.
- The butterfly flower had finely cut leaves.
