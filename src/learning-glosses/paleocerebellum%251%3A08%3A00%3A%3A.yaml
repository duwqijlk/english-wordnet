simpleMeaning: the front part of the small brain at the back of the head, one of the first parts of the
  back brain to form in mammals
scope: The front part of the small brain at the back of the head, one of the first parts of the back brain
  to form in mammals; not the whole small brain and not a part of the front brain.
examples:
- The paleocerebellum is the front part of the cerebellum.
- In mammals the paleocerebellum formed early in the back brain.
