simpleMeaning: An English new soldier, in a dark-and-light uniform, serving in the Irish police to put
  down the Sinn Fein rising of 1919 to 1921.
scope: An English recruit in the Irish constabulary in 1919 to 1921, in a dark-and-light uniform, serving
  to suppress the Sinn Fein rebellion.
examples:
- A Black and Tan patrolled the village street at dusk.
- The Black and Tan wore a dark-and-light uniform.
