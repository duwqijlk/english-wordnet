simpleMeaning: the ruler of a Muslim state who leads both its government and its faith, seen as Allah's
  representative on earth
scope: The leader of a Muslim state in both government and religion, not a king in general and not a priest
  who leads only worship.
examples:
- The caliph ruled the empire from Baghdad.
- Many Muslims hoped a caliph would unite their lands.
