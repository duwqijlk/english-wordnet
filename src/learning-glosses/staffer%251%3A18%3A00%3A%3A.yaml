simpleMeaning: a worker who is one of a team of workers, especially one of the team that works for the
  President of the United States
scope: This names one worker in a team, especially a team working for the President of the United States,
  not the whole team itself.
examples:
- A White House staffer answered the reporters' questions.
- The staffer carried the papers into the meeting.
