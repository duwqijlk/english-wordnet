simpleMeaning: the basic unit of luminous intensity in the International System, equal to one sixtieth
  of the light per square centimeter from a black body at 2,046 kelvin.
scope: This is the unit of luminous intensity, another name for the candela and standard candle, not the
  Roman numeral CD for four hundred.
examples:
- The lamp's brightness was measured at 100 cd.
- The phone screen reaches 600 cd per square meter at full brightness.
