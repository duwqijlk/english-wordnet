senseId: 'dictaphone%1:06:00::'
synsetId: 03197227-n
simpleMeaning: A tape machine that keeps what a person says when they speak into it and plays it back
  later.
scope: This is a machine for spoken notes, not a tape player for music nor a phone for talking.
examples:
- She spoke her letter into the Dictaphone.
- The Dictaphone played back his notes.
