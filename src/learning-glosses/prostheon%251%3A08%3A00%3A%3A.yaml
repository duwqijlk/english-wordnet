simpleMeaning: the point used to take head measurements that lies farthest forward in the middle line
  on the low front edge of the upper jaw bone
scope: 'Another name for alveolar point and prosthion: the farthest-forward point on the middle line of
  the upper jaw bone, not a tooth and not the whole jaw.'
examples:
- The researcher marked the prostheon on the skull before taking the measurements.
- To find the prostheon, look for the farthest forward point on the middle of the upper jaw.
