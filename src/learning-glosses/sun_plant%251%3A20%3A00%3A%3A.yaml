simpleMeaning: bright blooms in great numbers and thick leaves like moss are what people love in this
  plant, grown in many kinds in gardens everywhere
scope: Also called rose moss; a garden plant grown for its moss-like leaves and bright flowers, not a
  true moss and not a plant grown for food.
examples:
- The sun plant in the window box is full of bright flowers.
- She grows a sun plant for its thick moss-like leaves.
