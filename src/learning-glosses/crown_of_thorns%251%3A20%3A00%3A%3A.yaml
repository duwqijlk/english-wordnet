simpleMeaning: A somewhat climbing bushy spurge of Madagascar, with long woody thorny stems, few leaves,
  and blooms with scarlet leaf-like cups.
scope: This sense is a somewhat climbing bushy spurge of Madagascar, with long woody thorny stems, few
  leaves, and blooms with scarlet leaf-like cups, unlike the sense for a mock crown made of thorn branches
  that Roman soldiers placed on Jesus before the Crucifixion.
examples:
- The crown of thorns climbed the wall.
- A crown of thorns grew in the pot.
