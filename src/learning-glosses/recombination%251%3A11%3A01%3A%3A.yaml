simpleMeaning: In physics, a gas loses its charged bits when they join up again or pass tiny parts between
  atoms; this matters for the charged bits left by fast-moving bits.
scope: In physics, the loss of charge when charged bits in a gas join up again, not the mixing of traits
  passed down in living things.
examples:
- Recombination in the gas left few charged bits behind.
- The team studied recombination after fast bits passed through the gas.
