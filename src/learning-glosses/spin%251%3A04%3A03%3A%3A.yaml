simpleMeaning: a special way of explaining events, especially used by people in politics to change what
  people think
scope: A special way of explaining events, especially used by people in politics, not a fast turn of a
  thing and not a plane falling in a round path.
examples:
- The campaign put a good spin on the bad news.
- Her spin made the loss sound like a win.
