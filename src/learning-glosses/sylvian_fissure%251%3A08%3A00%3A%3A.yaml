synsetId: 05231373-n
simpleMeaning: In the brain, the deepest and clearest groove on the surface, which sets the front lobes
  apart from the side lobes in both halves of the brain.
scope: A groove of the brain, deeper than other brain grooves; also called lateral cerebral sulcus, sulcus
  lateralis cerebri and fissure of Sylvius.
examples:
- The Sylvian fissure runs across each side of the brain.
- Scans show the Sylvian fissure between the frontal and temporal lobes.
