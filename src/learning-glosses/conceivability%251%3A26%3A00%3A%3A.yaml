simpleMeaning: whether something can be thought of or pictured in the mind
scope: Whether something can be thought of or pictured in the mind, also called conceivableness; not whether
  it is true and not whether it can be done.
examples:
- The conceivability of life on other worlds still draws debate.
- He doubted the conceivability of a world without war.
