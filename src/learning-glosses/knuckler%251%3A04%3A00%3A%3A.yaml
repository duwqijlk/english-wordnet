simpleMeaning: The pitcher gives this throw almost no speed and almost no turn, so it drifts slowly toward
  the batter
scope: 'Another name for a knuckleball: a slow, barely turning throw, not a fastball and not a curveball.'
examples:
- The knuckler floated toward the plate and the batter swung too early.
- He learned to throw a knuckler that barely spun at all.
