simpleMeaning: a foot lever that you press to let more fuel into an engine, so it runs faster
scope: Also called the accelerator, accelerator pedal, gas, gun, or throttle, it is the foot lever that
  lets more fuel into an engine to make it run faster, not the brake that slows a vehicle down.
examples:
- He stepped on the gas pedal to pass the slow truck.
- She pressed the gas pedal gently as the light turned green.
