simpleMeaning: The tiny bits by which a mushroom or a similar fungus grows are made on thin leaf-like
  plates that spread out like rays under its cap.
scope: Also called gill, this is a thin plate under a mushroom cap that makes spores, not the cap itself
  and not the thin bone layer that shares its name.
examples:
- The lamellae under the cap were crowded close together.
- Each lamella on the mushroom cap makes the tiny bits by which it grows.
