senseId: 'catatonia%1:26:01::'
synsetId: 14568647-n
simpleMeaning: A state in which the muscles stay stiff and tight, with very high muscle tension, and a
  common sign of schizophrenia, an illness of the mind.
scope: This state has no other name in this set, and it is not the form of schizophrenia that keeps a
  person in a fixed still state for long periods.
examples:
- Catatonia left his muscles stiff and tight.
- Catatonia appeared as one sign of his schizophrenia.
