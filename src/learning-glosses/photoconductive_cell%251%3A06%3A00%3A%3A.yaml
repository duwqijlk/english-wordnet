senseId: 'photoconductive_cell%1:06:00::'
synsetId: 03931100-n
simpleMeaning: Light and other rays are turned into another kind of power by this thing, and that is how
  they are found and measured
scope: 'Another name for a photocell or a photoelectric cell, also called an electric eye or a magic eye:
  a thing that turns light and other rays into power so they can be found and measured, not a battery
  and not a lamp.'
examples:
- The photoconductive cell turns light into power.
- A photoconductive cell in the door lets the light switch it on.
