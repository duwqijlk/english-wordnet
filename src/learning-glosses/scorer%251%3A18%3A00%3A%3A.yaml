simpleMeaning: Someone who plays in a game or contest and gets points in it
scope: This is a player who gets points in a game. It is not the person who writes down the points during
  a game, and not a person who marks trees to be cut.
examples:
- He was the top scorer in the game, with three goals.
- The young scorer scored twice in the second half.
