senseId: 'majority_rule%1:09:00::'
synsetId: 05973312-n
simpleMeaning: The idea is that choices made by the larger part of a group set up in an orderly way must
  be followed by the whole group
scope: Also called democracy, this is the idea that the larger part of a group can make choices the whole
  group must follow, not a count of votes on one question and not the power of one person to decide.
examples:
- Under majority rule, the larger side in the club made the choice for all.
- The group chose majority rule so that most members could decide.
