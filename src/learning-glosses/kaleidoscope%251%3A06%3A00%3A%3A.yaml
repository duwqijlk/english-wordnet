simpleMeaning: A toy in a tube that you look through; bits of colored glass inside are shown back by mirrors,
  and they make patterns that match on both sides
scope: This is the toy in a tube that you look through; it is not the sense of a pattern of colors and
  shapes that keeps changing in real life.
examples:
- She turned the kaleidoscope and watched the colors move.
- The child held the kaleidoscope up to one eye.
