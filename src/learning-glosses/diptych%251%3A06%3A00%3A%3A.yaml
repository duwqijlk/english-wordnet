simpleMeaning: A picture or carving on two joined boards, above all an altarpiece, that usually fold together
  like a book.
scope: A picture or carving on two folding boards, not a picture on one board and not a picture in three
  parts.
examples:
- The diptych on the altar folds shut like a book.
- She painted a small diptych of two saints.
