scope: This is a common fish of the Pacific coast of the Americas with dark oily flesh that keeps well
  in cans, also called the Chile bonito, the Pacific bonito or Sarda chiliensis; it is a coastal fish,
  not a fish of the Atlantic.
examples:
- The Chilean bonito we caught had dark oily flesh.
- We grilled a Chilean bonito, its dark flesh rich and oily.
