scope: This is a small group of languages from the Tibet and Burma area, also called Himalayish language,
  and it sits inside the larger Tibeto-Burman family rather than being a separate full family.
examples:
- Tibetan and Newari both belong to Himalayish, a small group of languages of the area.
- Linguists place Tibetan in Himalayish, though the grouping is not a standard one.
