simpleMeaning: used in everyday speech, not formal speech, as a swear word to make another word stronger
scope: Also called damn, blame, damned, blessed, goddamn, blasted, blamed, goddamned, infernal, darned
  and deuced. This is a swear word placed before another word to make it stronger in informal speech,
  not the use that stands alone to show anger or surprise.
examples:
- He is a goddam fool for trusting him.
- This goddam car will not start again.
