simpleMeaning: In verse, a line in a poem that is complete, especially with the full number of syllables,
  the separate sounds in a word, in its last part
scope: This is a line of verse that is complete, especially with the full number of syllables in its last
  part; not a line with syllables left out and not a line from prose.
examples:
- The acatalectic verse in the old song keeps every beat in its last line.
- She chose an acatalectic line because it had the full count of beats.
