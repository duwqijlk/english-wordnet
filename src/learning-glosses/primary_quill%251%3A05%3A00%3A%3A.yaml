simpleMeaning: one of the long main wing parts that help a bird fly and stick out along the outer edge
  of its wing
scope: Also called primary and primary feather, this is one of the long main wing parts at the outer edge
  of a bird's wing, not a soft down part and not a tail part.
examples:
- The falconer found a broken primary quill on the glove.
- She counted the primary quills on the eagle's wing.
