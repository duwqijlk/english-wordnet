simpleMeaning: Often with bubbles and often used to heal, this drink holds salts or gases from the ground,
  or has them put in.
scope: Unlike plain water, this drink holds salts or gases, often with bubbles, and is often used to heal.
examples:
- He drank mineral water, liking the bubbles in it.
- They drank mineral water for its healing use.
