simpleMeaning: In computing, a list of steps in order that a machine can read and carry out
scope: A set of steps in order for a machine to read and carry out; computer programme, program and programme
  are other names for this sense, not the machine itself and not the written papers that go with it.
examples:
- She wrote a computer program that adds up the numbers in a list.
- The computer program stopped working after the last update.
