simpleMeaning: A number of values that change by chance hang on a second value that also changes; in statistics,
  that second value is most often time.
scope: In statistics, this is a number of values that change by chance and hang on a second value that
  also changes, most often time.
examples:
- The values in a stochastic process change by chance and hang on a second value.
- Most often that second value is time in a stochastic process.
