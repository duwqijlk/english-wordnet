senseId: 'ton_capacity%1:23:01::'
synsetId: 92419062-n
simpleMeaning: the heaviest load that a crane is said to be safe to lift
scope: The heaviest load a crane should lift; lift capacity is another name for this. Not how much a crane
  can lift at its very limit, and not the weight of the crane itself.
examples:
- The ton capacity of this crane is 60 tons.
- Do not go past the ton capacity when you lift the steel.
