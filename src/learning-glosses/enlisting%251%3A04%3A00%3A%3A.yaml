simpleMeaning: the act of finding and bringing in new people to join the army, or to take a job or support
  a cause
scope: 'Also called recruitment: this is the act of bringing new people in, not the training or the work
  they do after they join.'
examples:
- The army's enlisting of new soldiers took place at the town hall.
- His job was the enlisting of workers for the new factory.
