simpleMeaning: one half of a butchered animal, cut along its length, used for food.
scope: This is not a feature of a situation and not an outer face; it is a large cut of meat from one
  half of an animal.
examples:
- The butcher hung a whole side of beef in the cold room.
- They ordered a side of pork for the feast.
