simpleMeaning: any of the blood tubes that bring blood to the outer layer of the brain
scope: 'Also called arteria cerebri: a blood tube that brings blood to the brain, not a blood tube that
  carries blood back to the heart and not a blood tube in the arm.'
examples:
- A blocked cerebral artery can cause a stroke.
- The scan showed blood flow in the cerebral artery.
