simpleMeaning: a part with two or three pins that you push into a socket to join something to power
scope: The part with pins that you push into a socket for power, not a thing that fills a hole to stop
  a leak, and not the part that starts an engine.
examples:
- Put the plug into the socket before you turn on the lamp.
- The plug has three pins, so it will not fit that socket.
