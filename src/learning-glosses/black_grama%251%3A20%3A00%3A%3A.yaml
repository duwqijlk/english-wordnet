simpleMeaning: A grass for grazing animals, above all of the western coastal lands of North America.
scope: A grass for grazing animals, above all of the western coastal lands of North America; not a grass
  of the eastern plains and not a garden lawn grass.
examples:
- Black grama covers the dry coastal flats.
- Cattle graze on black grama through the summer.
