simpleMeaning: soft stuff put inside things, made in rolls or sheets from cotton wool or from fibers made
  by people
scope: This soft stuffing is also called batting. It is the material itself, not the act of fixing strips
  in place.
examples:
- The quilt is thick because it has a layer of cotton batten inside.
- She bought a roll of batten to put inside the baby blanket.
