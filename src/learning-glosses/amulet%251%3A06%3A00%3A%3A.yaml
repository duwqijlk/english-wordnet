simpleMeaning: a small piece of jewelry, usually worn around the neck, believed to keep away evil or sickness
  by magic
scope: A small piece of jewelry worn for magical protection, not just any necklace or ornament.
examples:
- She wore an amulet around her neck to keep away bad luck.
- The old amulet was said to protect its owner from sickness.
