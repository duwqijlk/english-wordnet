simpleMeaning: After days in spiced sour liquid, beef is cooked in a pot as a roast, usually served with
  potato dumplings.
scope: It is not plain roast beef, but beef kept for days in spiced sour liquid before cooking.
examples:
- We had sauerbraten with potato dumplings.
- The sauerbraten had soaked in spiced vinegar for several days.
