simpleMeaning: A wild cat of warm parts of the Americas, with a long body and a long tail.
scope: A wild cat of the warm Americas; eyra, jaguarundi and jaguarundi cat are other names for this animal,
  not a big cat such as a lion or a leopard.
examples:
- A jaguarondi slipped through the tall grass at dusk.
- The jaguarondi hunts small animals in the forest.
