simpleMeaning: 'In logic and mathematics, a link between three things: if it joins first to second and
  second to third, it must join first to third'
scope: In logic and mathematics, a link between three things that must join first to third, not a link
  between two things only and not a link that fails between first and third.
examples:
- Transitivity holds for the relation 'is taller than'.
- If A is bigger than B and B is bigger than C, transitivity says A is bigger than C.
