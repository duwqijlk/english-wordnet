simpleMeaning: the act of arranging a piece of music for an orchestra and giving a part to each kind of
  instrument
scope: Also called orchestration. This is the act of arranging music for an orchestra, not the instruments
  named in the written music, and not the act of giving or using tools for a job.
examples:
- He studied instrumentation so he could write parts for a full orchestra.
- Her instrumentation of the song took weeks, as she chose a part for each kind of instrument.
