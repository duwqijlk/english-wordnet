simpleMeaning: A low swamp plant of eastern North America that lives for years, sheds its leaves, and
  smells bad, with tiny flowers inside a mottled greenish or purple hood-shaped cover.
scope: A low swamp plant of eastern North America, also called foetid pothos, polecat weed, and skunk
  cabbage; not other swamp plants and not the garden cabbage.
examples:
- Symplocarpus foetidus smells bad in the spring swamp.
- The tiny flowers of Symplocarpus foetidus hide inside a purple hood.
