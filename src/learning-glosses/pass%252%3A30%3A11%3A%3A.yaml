simpleMeaning: to die, leaving the body and losing all physical features and every working function needed
  to stay alive
scope: This means dying, not moving past a place or handing something to another person.
examples:
- Her grandfather passed away peacefully at home last winter.
- The poet passed in 1890, leaving a small body of work.
