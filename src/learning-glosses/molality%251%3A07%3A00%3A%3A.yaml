simpleMeaning: 'How much of a thing is dissolved in a liquid, counted by weight: the number of moles,
  set amounts, in each kilogram of the liquid'
scope: 'Molal concentration is another name for this sense: the strength of a liquid counted by moles
  in each kilogram of liquid, not the strength counted by volume.'
examples:
- The molality of the mixture was two moles per kilogram.
- She worked out the molality before she mixed the batch.
