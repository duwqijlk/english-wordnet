simpleMeaning: In wet earth or in rotting plants or animal waste live germs that gather in slime they
  make themselves.
scope: Also called gliding bacteria, slime bacteria, myxobacteria, or myxobacterium, they are found in
  wet earth and in rotting plants or animal waste.
examples:
- Wet soil and rotting plants are where myxobacter live.
- The myxobacter in the damp soil gathered in the slime.
