simpleMeaning: In the kidney a body chemical is made that sets off the breaking down of clots in the blood
  by turning one blood stuff into another.
scope: Plasminogen activator is another name for this body chemical from the kidney, which sets off the
  breaking down of clots in the blood.
examples:
- The kidney makes urokinase, a stuff that turns one blood stuff into another.
- When urokinase is at work, clots in the blood start to break down.
