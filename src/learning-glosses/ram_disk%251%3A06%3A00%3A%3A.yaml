simpleMeaning: In computers, a make-believe drive made by keeping part of the working memory to use as
  if it were a set of storage blocks.
scope: In computers, a make-believe drive made from part of the working memory, not a real hard drive
  and not a floppy disk.
examples:
- He kept his files on a RAM disk for fast access.
- A RAM disk loses everything in it when the computer is turned off.
