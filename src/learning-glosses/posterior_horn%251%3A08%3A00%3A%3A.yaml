simpleMeaning: one of two roots of a nerve from the spine that runs along the back from the cord in the
  spine and is made of threads that carry feeling
scope: 'Also called a dorsal horn, a dorsal root, or a posterior root: the back root of a spine nerve
  that carries feeling, not the front root that carries orders to move.'
examples:
- The posterior horn carries feeling from the skin to the cord.
- Damage to a posterior horn can dull feeling in the arm.
