simpleMeaning: One whose right to what is left by a dead kin cannot be lost, if the one lives longer than
  the kin.
scope: One whose right to what is left by a dead kin cannot be lost if the one lives longer than the kin,
  not one named in a will and not one whose right can be taken away.
examples:
- The prince is the heir apparent to the throne, and will take it if he lives longer than the king.
- As heir apparent, her right to the estate cannot be lost if she outlives her father.
