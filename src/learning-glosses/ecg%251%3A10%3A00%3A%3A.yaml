simpleMeaning: A drawn record of the heart's beat cycle, made by a heart-recording machine.
scope: Also called cardiogram, electrocardiogram and EKG; the record is drawn by a machine that reads
  the heart's beats.
examples:
- The nurse ran an ECG after his chest pain.
- The ECG showed a steady heartbeat.
