simpleMeaning: the look of being shabby and poorly dressed, because the clothes are worn thin or dirty
scope: 'Another name for shabbiness, manginess and seediness: a shabby, poorly dressed look caused by
  worn or dirty clothes; not a lack of good taste in manners and not a dirty room.'
examples:
- His sleaziness showed in his frayed coat and stained shirt.
- Her sleaziness came from the torn, dirty clothes she wore every day.
