simpleMeaning: To reach or continue across a distance, area, period, or range, from one point to another
  or past a certain point.
scope: This is about something extending across space or time, not a person traveling to a place and not
  dying.
examples:
- The fence goes all the way down to the river.
- Her knowledge of the subject goes far beyond the basics.
