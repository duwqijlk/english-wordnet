simpleMeaning: In computer science, the set-up of a disk's main list of files and the tables that say
  where files sit, with the other basic settings
scope: In computer science, this is the basic set-up of a disk's file lists and tables, not the act of
  writing files and not low-level work on the disk surface.
examples:
- High-level formatting sets up the root directory before you can use the disk.
- The drive needed high-level formatting after the file tables were damaged.
