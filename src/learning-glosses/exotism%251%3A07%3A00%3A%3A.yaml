simpleMeaning: The strange, far-off feel of a thing from a place unlike home.
scope: The strange, far-off feel of a thing from a place unlike home; exoticness and exoticism are other
  names for this sense, not a thing that is merely new, and not a thing from one's own home town.
examples:
- He loved the exotism of Egypt.
- The exotism of the old temple charmed the travellers.
