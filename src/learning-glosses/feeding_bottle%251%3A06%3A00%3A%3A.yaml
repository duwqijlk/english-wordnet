simpleMeaning: To give milk to babies and very young children in place of the breast, this vessel is fitted
  with a soft teat and filled with milk or formula
scope: Also called a bottle and a nursing bottle, this is a vessel that gives milk to babies in place
  of the breast, not an ordinary drinking bottle and not a breast pump.
examples:
- She warmed the feeding bottle before the baby's nap.
- He filled the feeding bottle with formula.
