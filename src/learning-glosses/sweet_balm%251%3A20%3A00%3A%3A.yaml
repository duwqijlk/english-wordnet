simpleMeaning: A bushy year-on-year Old World mint with small white or yellowish blooms and sweet lemon-scented
  leaves, a runaway from gardens in north Europe and North America.
scope: This sense is also called bee balm, beebalm, garden balm, and lemon balm.
examples:
- Sweet balm grew in the garden.
- A sweet balm smelled of lemon.
