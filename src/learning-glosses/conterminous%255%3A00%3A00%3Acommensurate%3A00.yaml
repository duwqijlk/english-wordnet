senseId: conterminous%5:00:00:commensurate:00
synsetId: 00483453-s
simpleMeaning: having the same size, range, or length of time as something else
scope: To be the same in size, range, or length of time as something else, not to be bigger or smaller
  and not to share only a border; coextensive and coterminous are other names for this sense.
examples:
- The two fields are conterminous, covering the same ground.
- Their reigns were conterminous, lasting exactly the same number of years.
