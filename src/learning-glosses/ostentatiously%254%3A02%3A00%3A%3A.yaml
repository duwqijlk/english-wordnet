simpleMeaning: in a way that shows off wealth, skill, or importance, so that people will notice and look
scope: 'Also called showily: done in a way that shows off to make people notice, not in a quiet or plain
  way.'
examples:
- He ostentatiously counted his money in front of everyone.
- She ostentatiously parked her new sports car where all could see it.
