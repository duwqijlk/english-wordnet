simpleMeaning: A way of drawing maps that keeps areas true to size, with lines of latitude and the equator
  straight and other lines of longitude curved, used for tropical latitudes.
scope: Also called a sinusoidal projection; an equal-area way of drawing maps, not one that keeps shapes
  true and not a globe.
examples:
- The Sanson-Flamsteed projection keeps areas true to size.
- Mapmakers use the Sanson-Flamsteed projection for warm latitudes.
