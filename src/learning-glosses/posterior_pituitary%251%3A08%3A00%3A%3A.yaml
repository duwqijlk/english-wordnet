simpleMeaning: the back part of the small body that sends out body chemicals, made mostly of gland tissue
scope: 'Also called a neurohypophysis, a pars nervosa, and a posterior pituitary gland: the back part
  of the small body that sends out body chemicals, not the front part of that body.'
examples:
- The posterior pituitary is the back part of the small body that sends out body chemicals.
- The doctor pointed to the posterior pituitary on the scan.
