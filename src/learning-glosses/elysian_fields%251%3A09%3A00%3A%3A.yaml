simpleMeaning: In Greek stories, the home of the good after they die
scope: In Greek stories this is where the good go after death; Elysium is another name for this sense,
  and its nearest rival is the dark land of the dead.
examples:
- In the old stories, heroes went to the Elysian Fields after death.
- The Elysian Fields were a place of rest for the blessed.
