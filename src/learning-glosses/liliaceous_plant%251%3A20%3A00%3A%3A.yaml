simpleMeaning: A thing that grows from a part kept under the ground, such as a bulb, a corm, a rhizome
  or a tuber
scope: A thing that grows from a store kept under the ground, not one grown from seed and not a tree.
examples:
- The liliaceous plant in the pot grew back each spring from its bulb.
- Gardeners plant liliaceous plants in the autumn so they flower in spring.
