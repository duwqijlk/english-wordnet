simpleMeaning: A large carriage pulled by four horses that once carried passengers and mail along fixed
  routes between towns.
scope: This sense is not the raised floor where actors perform, nor a step in a process.
examples:
- In the 1700s the stage left Bristol every morning for London.
- Robbers on horseback often stopped the stage before it reached the next town.
