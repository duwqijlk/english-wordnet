simpleMeaning: Grey matter with no fatty coat round its nerve cells makes up the surface of the main part
  of the brain.
scope: Also called cortex, cerebral cortex, or cerebral mantle, this names the grey coat over the brain,
  not the shell-making layer in shellfish and not the band worn by church leaders.
examples:
- The pallium lies over the deeper parts of the brain.
- The pallium covers the brain.
