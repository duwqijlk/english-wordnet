simpleMeaning: having no home for the body or for the mind and heart, or having no safety and no safe
  place
scope: 'Also called homeless and roofless: with no home or no safety, in body or in spirit. Not just poor,
  and not just away from home for a short time.'
examples:
- After the war, many dispossessed families had no home and no safe place to live.
- He felt dispossessed, with no home in his heart and no place where he felt safe.
