simpleMeaning: a short piece of clothing that hangs loose from the shoulders
scope: A short loose piece of clothing worn over other clothes, not a long coat and not a tight jacket.
examples:
- She wore a box coat over her dress.
- His box coat hung loose from his shoulders.
