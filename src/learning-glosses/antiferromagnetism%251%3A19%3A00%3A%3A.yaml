simpleMeaning: The tiny spinning bits, lined up side by side by a pull, each point the opposite way from
  their neighbours, and the pattern changes as the heat changes
scope: Unlike the pull that lines tiny spinning bits up all the same way, this one lines them up in opposite
  ways.
examples:
- The tiny spins in antiferromagnetism point in opposite ways.
- As the heat rose, the antiferromagnetism changed.
