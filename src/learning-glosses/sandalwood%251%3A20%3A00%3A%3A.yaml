simpleMeaning: yellowish inner wood of the true kind of this tree, with grains close together and a pleasant
  smell; it can keep insects away and is used for carving and cabinets
scope: This is the yellowish inner wood used for carving and cabinets; it is not the whole tree and not
  the outer part of the wood.
examples:
- The small box was carved from sandalwood.
- Sandalwood has a pleasant smell and can keep insects away.
