simpleMeaning: the way a thing tends to float in water or in another liquid
scope: The way a thing floats in water or another liquid, not a person's cheerful mood.
examples:
- The buoyancy of the wood kept the box on top of the water.
- Salt water gives a swimmer more buoyancy than fresh water does.
