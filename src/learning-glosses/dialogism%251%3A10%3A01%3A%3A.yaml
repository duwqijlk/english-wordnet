senseId: 'dialogism%1:10:01::'
synsetId: 92463890-n
simpleMeaning: A written work can hold tones and views that differ and pull against each other, and how
  they clash or mix is what gives the work its sense
scope: Tones and views that differ and clash or mix in one text, not one voice speaking alone and not
  a talk between two people.
examples:
- The dialogism of the novel comes from its many clashing voices.
- The dialogism of the poem comes from its mix of high and low tones.
