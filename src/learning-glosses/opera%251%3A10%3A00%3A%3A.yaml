simpleMeaning: a play told through music, made up of singing with a large music group playing along, plus
  music at the start and between parts of the play
scope: A play where the story is sung to music. Not a play where people mostly speak, and not a single
  song on its own.
examples:
- We watched an opera where the whole sad story was sung.
- The opera opened with beautiful music before anyone sang.
