simpleMeaning: 'One of the largest bony fish: open-ocean swimmer with a round, flattened body, tall fins
  along its back and underside, and a rudder-like tail; found in warm seas worldwide.'
scope: Another name for the ocean sunfish, also called mola or sunfish; not the small freshwater sunfish
  of North America.
examples:
- A headfish drifted at the surface, its tall fins breaking the water.
- We spotted a headfish floating on its side near the reef.
