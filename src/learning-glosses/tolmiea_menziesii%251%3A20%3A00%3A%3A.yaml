simpleMeaning: A strong herb that lives many years, with blooms in upright bunches and young plants that
  grow where a leaf blade meets its stalk.
scope: A strong herb with upright flower bunches, known for young plants that grow at the leaf joints;
  also called pickaback plant, piggyback plant and youth-on-age.
examples:
- Tolmiea menziesii spread fast in the damp shade.
- Young Tolmiea menziesii plants grew on the old leaves.
