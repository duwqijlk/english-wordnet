simpleMeaning: On a stem or leaf sits a small sharp tip, like a spike in shape.
scope: A spine, a prickle, a thorn, or a sticker is another name for the small sharp tip on a stem or
  leaf, which is not the stem or leaf itself.
examples:
- There was a pricker on the stem.
- The leaf had a pricker on it.
