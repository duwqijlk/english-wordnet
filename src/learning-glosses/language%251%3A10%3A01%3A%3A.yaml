simpleMeaning: communication that takes place through spoken words
scope: This is spoken communication, not a whole system of words and grammar, not the words of a song,
  not the mental ability to use words, and not the special terms of a subject.
examples:
- The coach was fined for the language he used toward the referee.
- She recorded the everyday language of market traders for her study.
