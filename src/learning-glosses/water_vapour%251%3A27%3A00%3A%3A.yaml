simpleMeaning: the gas form of the liquid that falls as rain and fills seas, spread through the air but
  not as hot as boiling
scope: 'Also called water vapor: gas in the air below boiling point, not liquid water and not steam.'
examples:
- Water vapour gathered on the cold glass as the room warmed.
- The water vapour in the air made the morning misty.
