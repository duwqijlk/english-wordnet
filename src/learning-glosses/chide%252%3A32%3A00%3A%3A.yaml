simpleMeaning: to speak to a person in a hard and angry way, showing strong disapproval of what they did
scope: 'Also called jaw, rag, lecture, scold, rebuke, berate, or reprimand: an angry telling-off for something
  done wrong, not a calm word of advice and not a charge in court.'
examples:
- The mother chided the child for getting into a stranger's car.
- The customer chided the waiter for bringing cold soup.
