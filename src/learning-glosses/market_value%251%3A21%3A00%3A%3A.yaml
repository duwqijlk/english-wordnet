simpleMeaning: In the open, buyers and sellers agree on the amount of money a thing goes for
scope: Also called market price, this is the amount of money a thing goes for when buyers and sellers
  trade in the open, not what it cost to make and not a price set by law.
examples:
- The market value of the house rose when the new school opened.
- An expert put the market value of the painting at ten thousand pounds.
