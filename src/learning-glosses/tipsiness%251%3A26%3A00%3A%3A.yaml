senseId: 'tipsiness%1:26:00::'
synsetId: 14042038-n
simpleMeaning: a state that lasts a short time, after a person drinks too much alcohol
scope: 'Also called drunkenness, intoxication, inebriation, inebriety and insobriety: a state that lasts
  a short time after too much drink, not a hangover the next morning and not a long-term drink problem.'
examples:
- After two glasses of wine she felt a pleasant tipsiness.
- His tipsiness wore off before dinner.
