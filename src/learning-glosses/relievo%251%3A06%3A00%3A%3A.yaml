senseId: 'relievo%1:06:00::'
synsetId: 04080781-n
simpleMeaning: a work of art made by cutting shapes into a flat face so that they stand out from the flat
  part round them
scope: 'Also called relief, embossment, rilievo and sculptural relief: shapes cut into a flat face so
  they stand out, not a flat picture and not a free-standing statue.'
examples:
- A relievo of horses ran along the top of the wall.
- The relievo on the door showed leaves that stood out from the flat wood.
