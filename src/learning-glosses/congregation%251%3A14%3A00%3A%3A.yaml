simpleMeaning: a set of people with one shared faith, who turn up at the same church time and again
scope: 'Also called fold and faithful: the people of one faith who meet at the same church, not a single
  service and not the act of gathering.'
examples:
- The congregation sang the last hymn together.
- Each Sunday the congregation filled the small village church.
