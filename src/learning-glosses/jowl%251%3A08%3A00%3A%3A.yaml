simpleMeaning: the lower jaw of an animal with a backbone, jointed so the mouth can open
scope: The lower jaw of an animal with a backbone, jointed so the mouth can open; not the loose flesh
  of the cheek in old age.
examples:
- The dog's jowl hung open as it panted.
- The fish moved its jowl to take in water.
