simpleMeaning: A low North American bush with narrower leaves and small red blooms than the mountain kind
  it resembles, poisonous to young farm animals.
scope: It is also called lambkill and sheep laurel, the low bush with small red blooms that is poisonous
  to young farm animals.
examples:
- Young lambs fell sick after eating pig laurel.
- Young farm animals should not eat pig laurel, as it is poisonous to them.
