simpleMeaning: a person who sells sex and finds buyers by walking in the streets
scope: 'Also called hooker, slattern, streetwalker and floozy: a person who walks the streets to find
  buyers for sex, not a clever or dishonest person who gets around hard problems.'
examples:
- The hustler walked up and down the street, waiting for a customer.
- Police watched the corner where a hustler was looking for buyers.
