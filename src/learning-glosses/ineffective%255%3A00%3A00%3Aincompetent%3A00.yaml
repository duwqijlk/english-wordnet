simpleMeaning: not having the power or skill to do a job well; not good enough
scope: 'Also called inefficient: about a person or group not able to do a job well and not good enough
  for it, not about a drug or plan that has no effect.'
examples:
- The ineffective manager could not lead the team well.
- He was an ineffective worker and needed help to do the job.
