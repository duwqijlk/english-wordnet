simpleMeaning: The part of that country's government in the United States that makes and keeps the rules
  for dealing with other countries.
scope: 'Also called State, Department of State and United States Department of State: the federal part
  of the government of the United States that deals with other countries, not a department of government
  in one of the 50 states.'
examples:
- The State Department was set up when the country was young.
- The State Department makes the rules for dealing with other countries.
