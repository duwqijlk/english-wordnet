simpleMeaning: used in everyday speech before a word to make it stronger, with no limit and often to show
  dislike
scope: 'Also called perfect, complete, staring, utter, pure, thorough, gross, stark, everlasting, consummate,
  unadulterated, sodding and arrant: a word put before another word to make it stronger, not a word that
  describes a colour and not a word for something done twice.'
examples:
- He is a double-dyed villain, through and through.
- She called him a double-dyed fool in front of everyone.
