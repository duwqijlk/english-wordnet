simpleMeaning: not smooth or pleasing in the way something is said or written
scope: This is about words that are not smooth or pleasing. It is not about moving without skill, and
  not about feeling uneasy with other people.
examples:
- He wrote an awkward sentence that was hard to follow.
- Her awkward apology did not sound clear or kind.
