simpleMeaning: A wide piece of cloth that wraps round a person and covers them
scope: A loose outer coat folded round a person, also called wrap, not a dressing gown and not a paper
  cover.
examples:
- She drew her wrapper close against the cold.
- He wore a thick wrapper over his night clothes.
