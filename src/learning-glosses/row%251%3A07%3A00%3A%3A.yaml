simpleMeaning: a run of things following one another in time, with nothing interrupting them.
scope: This is a run of consecutive time, not objects or people placed side by side, not a line of figures
  or symbols, and not a long thin strip.
examples:
- She missed her bus three mornings in a row.
- The team lost five games in a row before the coach changed the lineup.
