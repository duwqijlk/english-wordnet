simpleMeaning: The usual brain signal shown on a brain scan of a person who is awake and alert, repeating
  12 to 30 times each second.
scope: Beta rhythm is another name for this brain signal, the usual one in a person who is awake and alert.
examples:
- The beta wave showed on the scan while he stayed awake.
- Her beta wave repeated 25 times each second.
