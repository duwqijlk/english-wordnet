simpleMeaning: a name for phone links that carry computer data at high speed, offered by a phone company
  to people in its area
scope: A name for fast phone links that carry computer data, and not a single phone cable and not a service
  for voice calls only.
examples:
- Our house got a digital subscriber line so we could use the internet fast.
- The phone company offers a digital subscriber line to homes in this town.
