simpleMeaning: The dirty crust that forms on top of melted metal as it meets the air.
scope: Also called slag; the dirty crust forming on melted metal as it meets the air.
examples:
- The smith skimmed the dross off the top of the molten lead.
- Dross had formed on the surface of the melted tin.
