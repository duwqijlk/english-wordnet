simpleMeaning: A body chemical made by the front of the pituitary gland; it starts the release of eggs
  in female mammals and the release of male sex chemicals in male mammals
scope: Also called interstitial cell-stimulating hormone, luteinizing hormone, and LH, this body chemical
  from the front of the pituitary gland starts egg release in female mammals and male sex chemical release
  in male mammals.
examples:
- ICSH starts the release of eggs in female mammals.
- The doctor measured ICSH in the blood test.
