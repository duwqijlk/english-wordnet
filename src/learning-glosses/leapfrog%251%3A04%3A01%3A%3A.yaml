simpleMeaning: going forward by jumping over the things or people in the way, as in a children's game
  where players jump over each other
scope: This is a way of moving forward by jumping over people or things in front, not the children's game
  itself where players jump over each other.
examples:
- The new phone was a leapfrog over all the other phones on sale.
- For the small company, the deal was a leapfrog past its bigger rivals.
