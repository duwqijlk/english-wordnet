simpleMeaning: People spread this tar or rubber-like stuff beneath a motor vehicle to slow down rust.
scope: Also called undercoat, this layer of tar or rubber-like stuff is spread under a motor vehicle to
  slow rust.
examples:
- They put underseal on the underside of the car.
- The underseal slowed the rust on the underside of the truck.
