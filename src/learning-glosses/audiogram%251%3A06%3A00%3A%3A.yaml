simpleMeaning: A chart that shows how well a person can hear sounds
scope: This is a chart that shows how well a person can hear sounds, not the test itself and not the machine
  used to make the chart.
examples:
- The audiogram showed she could hear high sounds better than low ones.
- The doctor looked at his audiogram to see how well he could hear.
