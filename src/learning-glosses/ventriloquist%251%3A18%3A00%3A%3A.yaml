simpleMeaning: A stage performer who makes it seem that a wooden figure is speaking, by throwing their
  voice into it.
scope: Of a stage act where a wooden figure seems to ask questions or sing.
examples:
- The ventriloquist made the dummy ask the crowd questions.
- As a ventriloquist, they could make the wooden figure sing.
