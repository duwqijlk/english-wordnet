simpleMeaning: A set of lights or arms that move, used to send signs that can be seen from far off.
scope: A set of lights or moving arms used to send signs that can be seen; not the act of sending signs
  in that way.
examples:
- The semaphore on the hill signalled the train to stop.
- Sailors read the semaphore from the shore.
