simpleMeaning: a V-shaped mark worn on the sleeve that shows a soldier's rank and time in service
scope: A V-shaped badge on a sleeve that shows rank and service, not a strip of contrasting colour on
  cloth and not the braid that shows length of service.
examples:
- He earned his stripes in Kuwait.
- Two stripes on her sleeve showed her rank.
