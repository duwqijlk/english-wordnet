simpleMeaning: a short, light oar that is not held by a fixed holder on the boat, used to move a canoe
  or small boat
scope: A hand-held oar for a canoe or small boat, not a flat blade on a wheel and not a small bat used
  to hit balls in games.
examples:
- She dipped her paddle into the water and pushed the canoe forward.
- He lost his paddle in the river and had to reach the bank with his hands.
