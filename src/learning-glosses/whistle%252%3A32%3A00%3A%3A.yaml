simpleMeaning: to play a tune or say something by blowing air through your lips to make high musical sounds
scope: A person plays a tune or says something in this way, not giving a short sign to call someone and
  not a thing moving with a sound.
examples:
- She whistled a happy tune as she walked to school.
- He whistled the song his mother used to sing to him.
