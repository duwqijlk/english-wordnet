simpleMeaning: to have your own book or other work brought out for people to read or buy
scope: This is about a writer having their own work brought out for the public. It is not the work a company
  does to get a book ready and bring it out.
examples:
- She published three books in her long life as a writer.
- He hopes to publish his first book next year.
