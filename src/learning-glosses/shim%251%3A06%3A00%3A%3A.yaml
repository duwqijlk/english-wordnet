simpleMeaning: a thin piece of wood, metal or stone with one thick end and one thin end, made to be pushed
  into a small gap
scope: This is the thin piece of wood, metal or stone made to be pushed into a small gap, not a tool for
  cutting.
examples:
- He pushed a shim into the gap beside the door to hold it tight.
- She put a thin wooden shim into the crack under the table leg.
