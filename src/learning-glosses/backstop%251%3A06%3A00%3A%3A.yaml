simpleMeaning: In baseball, a fence or screen behind home plate that stops the ball from going out of
  the playing field
scope: This is the fence or screen behind home plate in baseball, not the act of acting as one or giving
  support.
examples:
- The ball hit the backstop behind home plate and bounced back.
- A tall backstop kept wild pitches from reaching the seats.
