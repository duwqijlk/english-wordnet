simpleMeaning: having to do with a cell being dissolved or destroyed
scope: It describes something that breaks up or kills a cell, not something that builds a cell up and
  not a cell itself.
examples:
- The cytolytic drug broke the cancer cells apart.
- The cytolytic effect of the drug left the cells in pieces.
