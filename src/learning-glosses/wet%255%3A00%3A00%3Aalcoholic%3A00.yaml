simpleMeaning: made up of alcoholic drink, or engaged in buying and selling it.
scope: Describes goods or businesses made of or trading in alcohol, not the adjective for policies that
  allow alcohol sales, nor the slang sense meaning drunk.
examples:
- The dock workers unloaded a wet cargo of rum and brandy.
- Soldiers could buy beer at the wet canteen on the base.
