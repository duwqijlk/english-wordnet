simpleMeaning: in a way that is funny and makes people laugh
scope: This means in a funny way that makes people laugh; it is not a serious way and not a sad way.
examples:
- He told the story comically, waving his arms and pulling funny faces.
- The actor fell comically slowly, one step at a time, to make the crowd laugh.
