simpleMeaning: In the south-east of the United States grows a hardy plant with red-brown flowers that
  give off a pleasant smell and wood that smells of cloves.
scope: Also called strawberry bush and sweet shrub, it is the hardy plant of the south-east of the United
  States with clove-scented wood and red-brown flowers.
examples:
- A strawberry shrub was covered with red-brown flowers.
- The wood of the strawberry shrub smelled of cloves.
