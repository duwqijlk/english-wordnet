simpleMeaning: a time when everything is in great confusion and nothing is in order
scope: 'Also called chaos, and another name for it is bedlam: a time when everything is badly mixed up,
  not a time of quiet order and calm.'
examples:
- Pandemonium broke out when the fire alarm rang during the concert.
- There was pandemonium in the street after the match ended.
