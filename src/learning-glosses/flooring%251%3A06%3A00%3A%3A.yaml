simpleMeaning: the flat surface at the bottom inside a room, hallway, tent, or another place like these,
  that you walk on
scope: The flat surface you walk on inside, also called floor. It is not the material used to make that
  surface, and not a level of a building.
examples:
- They put rugs over the bare flooring in the hall.
- We spread our sleeping bags on the dry flooring of the tent.
