simpleMeaning: Bits of ice high in the air make a ring of light that runs level with the ground at the
  height of the sun.
scope: Also called a parhelic circle or a parhelic ring, it is a ring of light level with the ground at
  the height of the sun.
examples:
- A solar halo showed in the sky at the height of the sun.
- The solar halo came from bits of ice high in the air.
