simpleMeaning: a lens-shaped knot of nerve cells low down in the brain, with a red outer layer, the putamen,
  and a pale yellow inner layer, the pallidum
scope: 'Also called lenticular nucleus: a lens-shaped knot of nerve cells deep in the brain, not a nerve
  and not another part of the brain.'
examples:
- The lentiform nucleus is shaped like a lens deep in the brain.
- The lentiform nucleus has a red outer layer and a pale yellow inner layer.
