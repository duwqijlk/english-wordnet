schema: oewn-learning-gloss-v2
senseId: 'impervious%3:00:00::'
synsetId: 01778210-a
simpleMeaning: not letting things pass through, and not able to be changed by things
scope: This means nothing can go through it or change it. It is not about being open to things or easy
  to change.
examples:
- The coat is impervious to rain, so she stayed dry.
- He was impervious to argument and would not change his mind.
