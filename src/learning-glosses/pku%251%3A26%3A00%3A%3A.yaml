simpleMeaning: 'A disorder of body chemistry inherited: without the enzyme that turns one food chemical
  into another, the first builds up in body fluids and harms the mind to different degrees.'
scope: Also called phenylketonuria; not a disease caught from others.
examples:
- The baby was tested for PKU soon after birth.
- Children with PKU follow a special diet.
