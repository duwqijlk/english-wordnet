simpleMeaning: the power of an emperor or empress, shown by the special stick held as a sign of that power
scope: 'Also called sceptre: this sense is the power itself, not the stick that stands for it.'
examples:
- After the old emperor died, the scepter passed to his son, who ruled the country for twenty years.
- She held the scepter of the empire until her death, and no one questioned her right to rule.
