simpleMeaning: in any place in the world, when there is a place but it does not matter which one place
  it is
scope: No partner name for this sense; it means any place at all, with the exact place left open, not
  one set place.
examples:
- You can sit wherever you like in the garden.
- Wherever she goes, she takes her notebook with her.
