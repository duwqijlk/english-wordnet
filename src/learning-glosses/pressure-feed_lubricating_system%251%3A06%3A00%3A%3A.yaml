simpleMeaning: A machine set-up that oils engines that burn fuel inside, in which a pump pushes oil into
  the parts where the moving shafts rest
scope: This is a machine set-up that oils engines that burn fuel inside, in which a pump pushes oil into
  the parts where the moving shafts rest; force-feed lubricating system, force feed, lubricating system
  and pressure feed are other names for it, not a can of oil and not a single pump.
examples:
- The pressure-feed lubricating system kept the engine oiled.
- A pressure-feed lubricating system pushes oil into the bearings.
