simpleMeaning: A long, thin part of the sea that goes in between high, steep rock sides, often found in
  Norway.
scope: 'Also called fiord: sea water reaching far into land between steep rock sides, not a lake set away
  from the sea and not a wide open bay.'
examples:
- Their boat sailed slowly along the fjord, with steep cliffs on both sides.
- We saw a fjord in Norway where the sea ran far in between the mountains.
