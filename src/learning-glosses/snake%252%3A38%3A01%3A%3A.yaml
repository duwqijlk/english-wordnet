simpleMeaning: move in smooth, winding curves, the way a reptile does
scope: Not the way a river or road lies in long curves, and not simply travelling a winding route, but
  moving the body in smooth, sliding curves.
examples:
- The eel snaked through the water toward the rocks.
- She snaked between the parked cars and reached the door.
