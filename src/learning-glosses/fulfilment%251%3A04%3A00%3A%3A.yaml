simpleMeaning: The act of carrying out a wish, a promise, or the like to the end.
scope: 'Also called fulfillment: the act of bringing a wish, a promise, or the like to completion, not
  the feeling of being satisfied.'
examples:
- The fulfilment of his promise took many years.
- She worked for the fulfilment of her childhood dream.
