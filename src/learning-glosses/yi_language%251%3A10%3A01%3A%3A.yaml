simpleMeaning: A Loloish way of speaking, used by the Lolo people in China, Vietnam and Thailand.
scope: A Loloish way of speaking used in China, Vietnam and Thailand, also called Yi, Lolo and Lolo language;
  it is the speech of the Lolo people, not a way of speaking of another group.
examples:
- She speaks the Yi language at home.
- The Yi language is heard in parts of China, Vietnam and Thailand.
