simpleMeaning: weighed down by something that stops you moving freely
scope: Weighed down by something that slows movement, not thickened into lumps and not stopped up like
  a blocked pipe.
examples:
- The wings of birds were clogged with ice and snow.
- His boots were clogged with mud, and he could hardly walk.
