simpleMeaning: A fat from the hard centres of palm nuts, much like the fat from coconuts
scope: A fat from palm nuts, much like coconut fat but not the same; babacu oil is another name for it.
examples:
- Babassu oil is used in soaps and skin creams.
- She cooked with babassu oil instead of butter.
