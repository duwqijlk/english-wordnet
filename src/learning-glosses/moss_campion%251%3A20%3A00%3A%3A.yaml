simpleMeaning: In the far north of western and central Europe and North America, a tiny plant that lives
  for years and grows in tight tufts or flat mats.
scope: This is a tiny plant of the far north that grows in tight tufts or flat mats, a different kind
  from moss phlox.
examples:
- Moss campion grew in a tight tuft between the rocks.
- In the Arctic, moss campion forms flat mats on the ground.
