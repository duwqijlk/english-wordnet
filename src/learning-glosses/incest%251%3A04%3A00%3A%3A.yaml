simpleMeaning: sex between people who are close family, such as a parent and a child, who are too close
  in family to marry each other
scope: Sex between close family members who may not marry each other, not sex between people who are not
  close family.
examples:
- The story is about incest between a father and his daughter.
- The law treats incest as a serious crime.
