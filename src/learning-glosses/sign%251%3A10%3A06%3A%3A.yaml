simpleMeaning: In language study, the basic unit that pairs a form, such as a word, with the concept it
  represents.
scope: This is the basic unit of language pairing a form with a meaning, not a visible clue that something
  has happened, not a public display carrying a message, not a nonverbal gesture encoding a message, not
  a board structure for advertisements, not one of the twelve zodiac areas, not objective medical evidence
  of disease, not a positive or negative electric pole, not an event seen as foretelling the future, not
  a gesture in sign language, not a mathematical character, and not the verb senses such as writing one's
  name or approving something.
examples:
- For Saussure, the sign unites a sound pattern with a concept.
- The meaning of a sign depends on its difference from other signs in the system.
