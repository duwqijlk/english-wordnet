simpleMeaning: to bend or tip away from a straight upright position
scope: The verb for a body or object bending or tipping away from upright, not the noun for the slant
  itself and not the sense of having a tendency toward something.
examples:
- She leaned against the railing and watched the boats.
- The tall bookshelf leaned slightly to one side.
