simpleMeaning: A small holdall for clothes and small things, carried on a trip that lasts one night.
scope: A small holdall for one night's trip; overnighter and overnight bag are other names for this sense,
  not a large case for a long trip and not a handbag.
examples:
- She packed an overnight case for her one-night stay.
- He carried his overnight case onto the train.
