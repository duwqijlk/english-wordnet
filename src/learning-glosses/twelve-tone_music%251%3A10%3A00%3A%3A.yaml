simpleMeaning: Serial music begun by Arnold Schoenberg, using a tone row made from the twelve notes of
  the chromatic scale, or turned-over or backward forms of the row.
scope: This sense is also called 12-tone music and 12-tone system, for serial music devised by Schoenberg,
  built on a fixed order of the twelve chromatic notes, or turned-over or backward forms of that order.
examples:
- Twelve-tone music uses a tone row.
- Twelve-tone music came from Schoenberg.
