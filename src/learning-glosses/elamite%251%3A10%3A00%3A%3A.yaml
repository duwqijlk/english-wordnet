simpleMeaning: A dead old tongue of unknown kin, once spoken by the people of Elam.
scope: Also called Elamite language, Elamitic, Elamitic language, Susian and Susian language; it is the
  old dead speech of Elam, not the speech of a living people and not the people themselves.
examples:
- Elamite died out long ago.
- Scholars still study Elamite texts.
