simpleMeaning: Pull yourself upward while hanging by your hands until the lower edge of your face is level
  with the support bar.
scope: The exercise of raising yourself from a hanging position, not the noun for the lower part of the
  face and not merely hanging there; chin-up is another name for this movement.
examples:
- She chinned herself ten times on the bar before dropping to the mat.
- He could barely chin the bar after the long climb.
