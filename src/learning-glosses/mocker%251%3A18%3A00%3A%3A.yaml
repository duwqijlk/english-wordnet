simpleMeaning: A person who laughs at others in scorn, or calls out against them with contempt.
scope: 'Also called a flouter or a jeerer: a person who laughs at others in scorn, or calls out against
  them with contempt; not the grey-and-white songbird that copies the songs of other birds.'
examples:
- The mocker in the crowd laughed at the speaker in scorn.
- They paid no heed to the mocker shouting from the back.
