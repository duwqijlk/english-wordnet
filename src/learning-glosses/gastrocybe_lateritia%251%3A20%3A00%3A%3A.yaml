senseId: 'gastrocybe_lateritia%1:20:00::'
synsetId: 13068622-n
simpleMeaning: Fungus with a cone-shaped cap and thin stalk; the stalk stands up, then bends down, and
  the cap turns to jelly, dropping a slimy mass of spores to the ground.
scope: Not other fungi with cone-shaped caps or thin stalks; this one is known by the way its stalk bends
  down and its cap turns to jelly.
examples:
- Gastrocybe lateritia grows in the damp leaf litter.
- We found Gastrocybe lateritia with its cap turned to jelly.
