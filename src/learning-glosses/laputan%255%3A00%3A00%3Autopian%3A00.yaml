simpleMeaning: It can not be done and can not happen; it is only an idea.
scope: 'Also called windy, airy, impractical or visionary: a plan or thought that can not be done or made
  real, not a plan that can work and not a fact about the world.'
examples:
- His Laputan plan to build a city on the moon could never be done.
- She smiled at his Laputan hopes of getting rich without work.
