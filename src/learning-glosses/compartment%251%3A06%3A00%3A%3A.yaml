simpleMeaning: a small part cut off by walls inside a bigger closed space, such as a room of its own
scope: A walled-off part inside a bigger closed space, not a whole room on its own and not a box you carry.
examples:
- She put her bag in the overhead compartment of the train.
- The drawer has a small compartment for keys.
