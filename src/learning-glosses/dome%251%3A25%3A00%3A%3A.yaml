simpleMeaning: a shape that curves inward (concave) and whose hollow side faces down
scope: This is a hollow shape that faces down, not the round roof on top of a building.
examples:
- In the drawing, the dome is shown as a hollow curve facing down.
- The shape they cut out was a dome, with its hollow side turned downward.
