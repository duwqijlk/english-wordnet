simpleMeaning: Leaves that taste of the yellow citrus fruit, used to make a hot drink, or in soups or
  fruit punch drinks
scope: Leaves used for drinks and cooking; not the whole bushy plant itself, and not leaves of another
  mint.
examples:
- She steeped lemon balm in hot water for a soothing drink.
- Lemon balm gives the soup a fresh, light taste.
