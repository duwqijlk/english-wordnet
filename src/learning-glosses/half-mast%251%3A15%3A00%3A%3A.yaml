simpleMeaning: A place part-way down a tall pole where a flag is lowered to show grief or to call for
  help.
scope: This is a place part-way down a tall pole where a flag is lowered in grief or distress, not the
  top of the pole; also called half-staff.
examples:
- The flag flew at half-mast.
- They lowered the flag to half-mast in mourning.
