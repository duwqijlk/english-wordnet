simpleMeaning: the act of giving power to a person or thing and making it active and ready to move or
  work
scope: The act of giving power to a person or thing and making it active, also called activating; activation
  is another name for this sense. It is not the power itself.
examples:
- Energizing the tired crowd took only a few strong songs.
- The coach spent the first minutes energizing his tired team.
