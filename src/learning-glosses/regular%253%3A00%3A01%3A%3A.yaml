simpleMeaning: 'For a solid object: its dimensions are definite and can be measured, so a geometry formula
  can work out how much space it takes up.'
scope: 'This is the geometry sense for solid shapes whose size can be worked out by formula; distinct
  from regular%3:00:00:: (following a fixed order or rule), regular%5:00:00:standard:02 (fitting a standard
  pattern), regular%5:00:00:usual:00 (customary practice), regular%5:00:00:scheduled:00 (set timetable
  times), regular%5:00:00:steady:00 (fixed intervals), regular%5:00:00:frequent:00 (habitual customers
  or drinkers), regular%5:00:00:typical:00 (emphasis use), regular%5:00:00:symmetrical:00 (even arrangement),
  regular%5:00:00:normal:01 (not odd or abnormal), regular%5:00:00:full-time:00 (official full-time work),
  regular%3:00:02:: (official army forces), regular%3:00:06:: (normal bowel function), and the noun senses
  regular%1:18:00:: (a habitual patron), regular%1:18:02:: (a standing soldier), regular%1:18:01:: (a
  loyal party follower), and regular%1:07:00:: (an average clothing size).'
examples:
- A cube is a regular solid, so its volume can be found from the length of one edge.
- The crystal is regular enough for us to calculate its volume with a simple formula.
