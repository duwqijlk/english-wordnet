simpleMeaning: to allow imported goods through the border office without payment of the taxes normally
  charged on them
scope: This is about taxes on goods crossing a border, not about granting permission in general.
examples:
- The shipment was cleared through customs in under a day.
- The agent cleared the goods on arrival so they could go straight to the warehouse.
