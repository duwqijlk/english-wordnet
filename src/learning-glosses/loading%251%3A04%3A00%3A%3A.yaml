simpleMeaning: The work of putting a load of things on or in a vehicle, a ship, a box, or the like.
scope: The work of putting a load of things on or in a vehicle, a ship, a box, or the like, not the ratio
  of a plane's weight to its lift, and not the amount carried at one time.
examples:
- Loading the ship began at dawn.
- The loading of the lorries went on all day.
