senseId: 'taciturn%3:00:00::'
synsetId: 02391948-a
simpleMeaning: in the habit of keeping thoughts and feelings to yourself and not talking much to other
  people
scope: This is a person's usual way of not sharing thoughts and not talking much, not being silent for
  a short time and not being too shy to speak once.
examples:
- The taciturn farmer answered our questions with only a few words.
- She is taciturn at work and rarely joins in talk.
