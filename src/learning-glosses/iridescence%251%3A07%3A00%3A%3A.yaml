simpleMeaning: A look a thing has when its face shines with a soft white glow and shows many colours that
  change across it
scope: A look a thing has when its face shines with a soft white glow and shows many colours; also called
  opalescence; not a single flat colour and not a shine with no colour in it.
examples:
- The iridescence of the soap bubble caught her eye.
- Light showed the iridescence of the shell.
