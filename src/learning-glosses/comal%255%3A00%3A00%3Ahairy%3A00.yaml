simpleMeaning: said of certain seeds, such as cotton seeds, that have one or more small bunches of hair
scope: Said of certain seeds, such as cotton seeds, that carry one or more small bunches of hair; also
  called comate and comose, and not a smooth seed.
examples:
- The comal seeds floated on the wind on their tufts of hair.
- Cotton has comal seeds with soft tufts that help them spread.
