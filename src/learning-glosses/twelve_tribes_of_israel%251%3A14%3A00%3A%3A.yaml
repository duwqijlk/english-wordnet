simpleMeaning: A dozen family groups of an old land, each held to come down from one of Jacob's dozen
  sons.
scope: This is a dozen family groups of an old land, each held to come down from one of Jacob's dozen
  sons, also called the Tribes of Israel; other old family groups of the same land are not counted among
  the dozen.
examples:
- The Twelve Tribes of Israel were said to come down from the sons of Jacob.
- Each of the Twelve Tribes of Israel had its own land.
