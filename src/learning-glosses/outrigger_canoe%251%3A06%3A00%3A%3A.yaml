simpleMeaning: A sea-going boat, such as those of the South Pacific, with a side float that keeps it from
  turning over.
scope: A sea-going boat with a side float that keeps it from turning over; not a plain boat and not a
  large ship.
examples:
- The outrigger canoe cut through the waves without tipping.
- They paddled an outrigger canoe across the bay.
