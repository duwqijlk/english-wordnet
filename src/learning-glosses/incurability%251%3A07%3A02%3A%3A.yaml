senseId: 'incurability%1:07:02::'
synsetId: 04749491-n
simpleMeaning: The fact that a person's way of thinking or way of doing things cannot be changed
scope: This is the fact that a person's way of thinking or way of doing things cannot be changed, and
  not the fact that an illness cannot be cured.
examples:
- The incurability of his optimism surprised everyone who knew him.
- She accepted the incurability of her father's stubborn habits.
