simpleMeaning: This climbing aid takes a metal wedge, a chock, and the like out of a crack once they have
  been used.
scope: Also called a nut key, this climbing aid takes a metal wedge out of a crack after use, not one
  for putting the wedge in.
examples:
- The nut tool freed the wedge from the crack.
- The nut tool pulled the chock out after the climb.
