simpleMeaning: In the study of skulls, the place where the front and side parts of the cheek bone join.
scope: This is the place where the front and side parts of the cheek bone join; jugal point is another
  name for it, not any other marked spot on the skull used for measuring.
examples:
- The jugale is the place where the cheek bone's two arms meet.
- Students marked the jugale on the skull diagram.
