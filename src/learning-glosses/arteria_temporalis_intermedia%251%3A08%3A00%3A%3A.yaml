simpleMeaning: The middle of the brain's outer layer on the side of the head gets its blood from this
  tube.
scope: Also called intermediate temporal artery, this tube feeds the middle part of the brain's outer
  layer on the side of the head.
examples:
- The arteria temporalis intermedia feeds the middle of the brain's outer layer near the temple.
- Blood reached the side of the brain through the arteria temporalis intermedia.
