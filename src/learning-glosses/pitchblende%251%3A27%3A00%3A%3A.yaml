simpleMeaning: A mineral made mainly of uranium combined with oxygen, with tiny amounts of radium, thorium,
  polonium, lead and helium, in the massive form that is the main ore of uranium.
scope: This is the massive, ore-grade form of the mineral; uraninite is another name for the same mineral,
  not a different substance.
examples:
- The old shaft was dug through rich pitchblende, the ore that yielded radium.
- Pitchblende from this mine was shipped abroad for uranium production.
