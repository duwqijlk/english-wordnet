simpleMeaning: A hickory of the east of the United States, with leaves of 7 or 9 small leaflets and thin-shelled,
  very bitter nuts.
scope: A hickory of the east of the United States, also called bitter hickory, bitter pignut, bitternut,
  bitternut hickory and swamp hickory; not a hickory with sweet nuts.
examples:
- Carya cordiformis has leaves with 7 or 9 leaflets.
- The nuts of Carya cordiformis taste very bitter.
