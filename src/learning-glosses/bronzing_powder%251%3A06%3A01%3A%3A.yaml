simpleMeaning: A make-up in many shades of brown, meant to make skin look as if it has been browned by
  the sun.
scope: A make-up in shades of brown that makes skin look sun-browned; bronzer is another name for this
  sense, not blusher and not foundation.
examples:
- She brushed bronzing powder across her forehead.
- The bronzing powder gave her face a warm glow.
