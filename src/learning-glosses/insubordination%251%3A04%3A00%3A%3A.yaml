simpleMeaning: an act in which someone will not do what the person in charge tells them to do
scope: This is an act of not doing what a person in charge says, not just rude talk and not a general
  dislike of rules.
examples:
- His repeated insubordination led the officer to punish him.
- She was sent home from work for insubordination after she refused to follow her manager's orders.
