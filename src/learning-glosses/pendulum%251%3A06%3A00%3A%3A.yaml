simpleMeaning: a tool with a weight hung so that it swings back and forth on its own under gravity
scope: A swinging weight on a mount, not a clock itself and not any other hanging thing.
examples:
- The pendulum of the old clock swung back and forth all day.
- He watched the pendulum swing in a slow, steady rhythm.
