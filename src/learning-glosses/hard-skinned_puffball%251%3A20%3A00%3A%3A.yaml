simpleMeaning: Under the ground, round bodies with tough coats grow as one of several kinds of fungi of
  the group Scleroderma, looking like truffles.
scope: It is also called puffball, earthball, and false truffle, and it looks like a truffle without being
  one.
examples:
- The hard-skinned puffball grew just below the soil.
- She dug a hard-skinned puffball out of the ground.
