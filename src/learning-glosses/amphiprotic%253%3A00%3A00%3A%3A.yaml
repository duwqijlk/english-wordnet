senseId: 'amphiprotic%3:00:00::'
synsetId: 00026628-a
simpleMeaning: able to act like an acid and also able to act like a base, with the traits of both
scope: This is about a substance that can act as an acid and as a base, also called amphoteric, not a
  substance that acts as only one of the two.
examples:
- Water is amphiprotic because it can act as an acid or a base.
- The chemist called the liquid amphiprotic after it reacted both ways.
