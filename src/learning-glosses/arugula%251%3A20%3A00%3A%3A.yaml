simpleMeaning: Cut while still young and soft, this upright European plant lasts a single year and is
  most often raised for salads.
scope: Rocket, garden rocket, rocket salad, and roquette are other names for this one-year European salad
  plant.
examples:
- We picked the arugula while it was still young and soft.
- The salad had arugula picked young and soft.
