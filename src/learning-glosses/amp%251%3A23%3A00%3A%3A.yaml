simpleMeaning: the basic unit used to measure electric current, fixed by the world system of units
scope: The basic unit for measuring electric current; not a unit of voltage, power or resistance.
examples:
- A typical household circuit carries 15 to 50 amps.
- The charger draws only two amps.
