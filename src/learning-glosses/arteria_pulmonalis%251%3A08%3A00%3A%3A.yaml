simpleMeaning: The lungs get used blood from the heart through one of two tubes off the main lung tube.
scope: Also called pulmonary artery, it is one of two tubes off the main lung tube that carry used blood
  from the heart to the lungs.
examples:
- The arteria pulmonalis carries used blood from the heart to the lungs.
- Blood on its way to the lungs passed through the arteria pulmonalis.
