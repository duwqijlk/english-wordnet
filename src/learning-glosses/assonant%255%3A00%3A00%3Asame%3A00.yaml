simpleMeaning: Having the same sound, above all the same vowel sound, in stressed beats that follow one
  after another
scope: Having the same sound, above all the same vowel sound, in stressed beats that follow one after
  another; not the same vowel sound with different consonants in whole words, and not words that rhyme.
examples:
- The assonant words in 'tilting at windmills' share the same vowel sound.
- She pointed out the assonant beats in the two lines of the poem.
