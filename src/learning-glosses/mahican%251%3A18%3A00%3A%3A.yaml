simpleMeaning: A member of the Algonquian people who once lived in the Hudson valley and eastward to the
  Housatonic.
scope: Not the Algonquian tongue of the same name or the other peoples of the Hudson valley; also called
  Mohican.
examples:
- The Mahican lived in the Hudson valley.
- A Mahican family once lived eastward to the Housatonic.
