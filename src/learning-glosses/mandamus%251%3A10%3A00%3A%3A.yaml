simpleMeaning: A rare court order telling an officer to do a set duty the law treats as fixed, not left
  to choice, used only when all other court cures fail.
scope: This sense is also called writ of mandamus, for a rare court order telling an officer to do a set
  duty the law treats as fixed, not left to choice, used only when all other court cures fail.
examples:
- Mandamus forced the officer to act.
- The court issued mandamus.
