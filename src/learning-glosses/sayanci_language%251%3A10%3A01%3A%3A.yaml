simpleMeaning: A way of speaking of the Chadic group, used in the north of Nigeria, above all in Bauchi
  State, in the Tafawa Balewa area.
scope: 'Also called Sayanci, Zaar, or Zaar language: a Chadic language of northern Nigeria, not a language
  of southern Nigeria and not a language of another part of Africa.'
examples:
- Sayanci language is spoken in the north of Nigeria.
- Children in Bauchi State learn the Sayanci language at home.
