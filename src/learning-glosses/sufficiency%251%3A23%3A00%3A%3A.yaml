simpleMeaning: an amount that is enough; an amount large enough to do what is needed
scope: 'Also called enough: an amount that is enough for a need, not money and goods that let a person
  live in comfort, and not the quality of being enough.'
examples:
- There is a sufficiency of food for everyone at the table.
- The camp kept a sufficiency of clean water for the whole trip.
