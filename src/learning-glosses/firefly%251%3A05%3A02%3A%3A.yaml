simpleMeaning: a beetle from tropical America whose bright spots glow in the dark and that makes a clicking
  sound
scope: A beetle of tropical America with bright glowing spots, not the common night beetle of warm regions.
examples:
- A firefly glowed as it clicked among the leaves.
- Fireflies lit up the warm night with their bright spots.
