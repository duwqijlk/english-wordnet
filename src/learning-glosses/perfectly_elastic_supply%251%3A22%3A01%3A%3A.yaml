simpleMeaning: What sellers offer of a thing or a piece of work falls to nothing in a market, even when
  its price falls by the smallest amount
scope: What sellers offer when even a tiny fall in price wipes it out, not what buyers want and not a
  small change in what sellers offer.
examples:
- Perfectly elastic supply meant the stalls vanished as soon as the price dipped.
- With perfectly elastic supply, a tiny drop in price left nothing for sale.
