simpleMeaning: beauty or charm that draws people in, often with a strong pull linked to sex
scope: Also called glamour, this is beauty or charm that pulls people in, often linked to sex, not plain
  good looks with no such pull.
examples:
- The glamor of the film star drew crowds wherever she went.
- There was a glamor about her smile that men found hard to resist.
