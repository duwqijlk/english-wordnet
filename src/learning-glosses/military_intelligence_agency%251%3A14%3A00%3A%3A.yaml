simpleMeaning: A part of the armed forces that gets, studies, and uses facts that matter for planning
  a war and for fighting battles.
scope: 'Also called military intelligence: a part of the armed forces that gets, studies, and uses facts
  that matter for planning a war and for fighting battles, not a spy network outside the forces and not
  news reports.'
examples:
- The military intelligence agency gathers facts about the enemy.
- A military intelligence agency works in secret.
