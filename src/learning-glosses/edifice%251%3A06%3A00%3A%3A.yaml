simpleMeaning: a thing built with a roof and walls and made to stay in one place more or less all the
  time
scope: 'Also called building: a built thing with a roof and walls that stays in place, not a tent or other
  cover put up for a short time only.'
examples:
- The large edifice on the corner is used as a school.
- They built a new edifice to house the town offices.
