simpleMeaning: A plant from North America whose leaves stay green all year
scope: 'Also called evergreen wood fern and marginal wood fern: a plant from North America with leaves
  that stay green all year, not a tree and not a plant that loses its leaves in winter.'
examples:
- The leatherleaf wood fern grows in the damp shade of the woods.
- We saw leatherleaf wood fern along the north-facing slope.
