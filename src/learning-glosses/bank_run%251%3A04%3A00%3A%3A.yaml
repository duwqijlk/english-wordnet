simpleMeaning: many people who keep money in one place all trying at once to take their money out because
  they fear it will close
scope: Many people who have put money in a bank all try at once to take it out because they fear the bank
  will fail, not one person closing an account and not a bank closing its doors.
examples:
- When word spread that the bank was in trouble, a bank run emptied its cash in a day.
- The bank run began when hundreds of savers lined up to take their money out.
