simpleMeaning: Coat a dead animal's skin with grease, fill it out, and get it ready to be fixed in a lifelike
  pose for display.
scope: This is the taxidermy process for animal skins, not filling a container, eating too much, or the
  material inside something.
examples:
- The museum's taxidermist stuffed the fox and mounted it on a driftwood base.
- He learned to stuff birds on a course in preserving specimens.
