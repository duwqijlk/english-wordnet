simpleMeaning: Lymph tissue packed into a mass in the throat, behind the small piece that hangs down,
  on the back wall and roof of the passage behind the nose.
scope: Also called adenoid, pharyngeal tonsil, tonsilla adenoidea and tonsilla pharyngealis, this mass
  is the one whose growth is called adenoids and can make breathing hard in children.
examples:
- The doctor said the third tonsil had grown and was making breathing hard.
- An enlarged third tonsil can narrow the passage at the back of the nose.
