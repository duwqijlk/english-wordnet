simpleMeaning: A flow of pieces of matter, whole atoms or the parts that make them up. Each piece may
  carry a positive charge, a negative charge, or none at all.
scope: This is matter in the form of moving particles, not electromagnetic waves such as light; corpuscular
  radiation is another name for exactly the same thing.
examples:
- Alpha and beta emissions are forms of particulate radiation.
- The team measured particulate radiation inside the reactor hall.
