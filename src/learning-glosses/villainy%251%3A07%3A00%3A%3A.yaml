synsetId: 04860592-n
simpleMeaning: the quality of being evil, shown by the bad things a person does
scope: This is the very bad quality shown by the bad things a person does. It is not a single bad act
  by itself, and not a person who does bad things.
examples:
- The story shows his villainy in the cruel way he treats the poor family.
- Her villainy grew clear when she lied to take the children's home.
