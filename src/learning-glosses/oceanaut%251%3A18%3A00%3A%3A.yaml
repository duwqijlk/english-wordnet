simpleMeaning: A trained worker who can live in a base under the sea and help with science work there.
scope: A trained worker who lives in a base under the sea and helps with science work, also called aquanaut;
  not an astronaut and not a diver who only visits for a short time.
examples:
- The oceanaut spent a month in the base under the sea.
- As an oceanaut, she helped with science work on the sea floor.
