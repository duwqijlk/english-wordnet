simpleMeaning: a bell fixed to a sleigh or to the harness of a horse pulling one
scope: A bell for a sleigh, also called sleigh bell; not a church bell and not a cowbell.
examples:
- The cascabel jingled as the sleigh moved over the snow.
- A cascabel hung from the horse's harness.
