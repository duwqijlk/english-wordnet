simpleMeaning: A small tree of China and Japan with large yellow to red fruit, as a rule a little worse
  in taste than the fruit of European trees
scope: A small tree with large yellow to red fruit; Prunus salicina is another name for this sense, not
  the evergreen tree with fuzzy yellow fruit and not the fruit itself sold for jellies.
examples:
- The Japanese plum bore large yellow fruit in late summer.
- We planted a Japanese plum by the fence and watched it grow into a small tree.
