simpleMeaning: the main unit of length in the Systeme International d'Unites, a world system for measures,
  about 1.094 yards
scope: 'Also called meter: the unit for measuring length, not the beat in a line of poetry and not a pattern
  of equal beats in music.'
examples:
- The room is four metres long.
- A metre is a little longer than a yard.
