senseId: 'preliminary_prospectus%1:10:00::'
synsetId: 07180429-n
simpleMeaning: a first draft of a paper about a new offer, and it must be clearly marked to show that
  parts of it may change in the final paper
scope: 'Also called red herring: a first draft of a paper about a new offer, marked to show that parts
  may change, not the final paper itself.'
examples:
- The bank sent out a preliminary prospectus before the final offer was ready.
- Investors read the preliminary prospectus, knowing that some details in it might change.
