simpleMeaning: the hard mouth of a bird that sticks out from its face and is made of a hard, horn-like
  material
scope: The mouth part of a bird, also called a bill, a beak, a nib, and a neb. It is not the bird itself
  that climbs trees and digs into wood for insects.
examples:
- The duck used its flat pecker to take food from the water.
- The small bird cleaned its pecker after eating seeds.
