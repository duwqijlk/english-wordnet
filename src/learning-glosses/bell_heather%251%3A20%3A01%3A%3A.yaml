simpleMeaning: a low bush from Europe, found in many places, with red-purple flowers
scope: 'Also called fine-leaved heath and heather bell: a low European bush with red-purple flowers, not
  the dwarf kind with rose-coloured flowers and not a tall heath.'
examples:
- Bell heather grew low along the path, its red-purple flowers bright in the sun.
- She planted bell heather at the edge of the garden.
