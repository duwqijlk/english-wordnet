simpleMeaning: mostly about ideas and guesses about how things work, rather than about what to do in real
  life
scope: 'Another name for theoretical: mostly about ideas and guesses, rather than about what to do in
  real life; not a practical plan and not a proven fact.'
examples:
- The book gives a theoretic account of how minds work.
- Her theoretic ideas had not yet been tested in real life.
