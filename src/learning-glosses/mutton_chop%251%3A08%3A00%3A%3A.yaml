simpleMeaning: Hair that grows down the side of a man's face, in front of the ear, most of all when the
  rest of the beard is shaved off.
scope: Hair down the side of a man's face; sideburn and burnside are other names for this, and it is not
  a full beard or a moustache.
examples:
- He grew mutton chops and shaved his chin clean.
- The actor's mutton chop ran down in front of each ear.
