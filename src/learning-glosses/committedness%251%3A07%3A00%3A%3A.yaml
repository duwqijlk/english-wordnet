simpleMeaning: an honest, firm wish to keep to a plan and not give up on it
scope: This is an honest, firm wish to keep to a plan, with commitment as another name for this sense,
  and not a passing wish or a promise to do one thing.
examples:
- Her committedness showed in years of work on the same plan.
- His committedness to the cause never wavered.
