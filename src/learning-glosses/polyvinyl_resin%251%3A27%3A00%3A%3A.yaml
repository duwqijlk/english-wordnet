simpleMeaning: A plastic that softens when hot, made from stuffs that hold a small part called vinyl
scope: A plastic that softens when hot, made from stuffs that hold a small part called vinyl; vinyl polymer
  and vinyl resin are other names for this sense, not a plastic that stays hard when hot and not a natural
  gum.
examples:
