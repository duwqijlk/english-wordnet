simpleMeaning: Cloth made when the threads across pass over and under the threads along in turn, so the
  cloth shows squares in two colours.
scope: Taffeta weave is another name for this way of making cloth, in which the threads across and along
  cross over each other in turn.
examples:
- We chose a plain weave for the curtain.
- This shirt is made in a plain weave.
