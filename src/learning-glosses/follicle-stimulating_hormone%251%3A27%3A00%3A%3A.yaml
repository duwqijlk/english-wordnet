senseId: 'follicle-stimulating_hormone%1:27:00::'
synsetId: 14772944-n
simpleMeaning: A hormone from the front of the pituitary that acts on the sex organs, making Graafian
  follicles grow in female mammals and switching on sperm-forming cells in male mammals.
scope: This is the pituitary hormone that acts on the ovaries and testes, not luteinising hormone, the
  other pituitary hormone with a related role. The name is technical and used in medicine and biology.
examples:
- Follicle-stimulating hormone levels rise at the start of the menstrual cycle.
- The doctor measured her follicle-stimulating hormone before starting treatment.
