simpleMeaning: Bunches of berries people can eat grow on many kinds of woody climbing plant of the group
  Vitis
scope: Also called grape and grapevine, this is a woody climbing plant that bears berries people can eat,
  not a plant that grows as a tree.
examples:
- The grape vine climbed the wall behind the house.
- They planted a grape vine to get berries for wine.
