simpleMeaning: the full amount a shop asks a buyer to pay for a thing, made up of what it cost to make
  plus the shop's own extra charge
scope: The full amount a buyer pays in a shop, not the price a shop pays to buy the goods and not a price
  cut.
examples:
- The retail price of the new game is about sixty dollars.
- Shoppers check the retail price before they buy.
