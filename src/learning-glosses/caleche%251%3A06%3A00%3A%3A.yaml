simpleMeaning: a top that folds back on a carriage pulled by a horse
scope: Also called a calash or a calash top; it is the folding top of a horse-drawn carriage, not a woman's
  hooded head cover and not a whole carriage.
examples:
- The driver put down the caleche when the sun came out.
- Rain pattered on the caleche of the old carriage.
