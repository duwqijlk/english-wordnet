simpleMeaning: Giving a substance that tightens the skin, this fern of Europe, Africa and Asia has leaves
  split into small leaflets.
scope: This fern grows in Europe, Africa and Asia, not in the Americas, and it bears no flowers.
examples:
- The leaves of black spleenwort are split into small leaflets.
- Black spleenwort gives a substance that tightens the skin.
