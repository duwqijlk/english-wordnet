simpleMeaning: to show a thing or an idea in a picture, drawing, or statue, in a general way rather than
  in fine detail
scope: 'Also called present: to show something in a picture or statue in a general way, not to paint a
  true likeness and not to tell about it in words.'
examples:
- The father is portrayed as a good-looking man in this painting.
- The artist portrayed peace as a white dove in the drawing.
