simpleMeaning: A greasy fruit with a hard stone inside, from the plant called rabbitwood
scope: The greasy fruit of the rabbitwood plant, also called buffalo nut and elk nut; not a walnut or
  a hazelnut, and not the fruit of a different tree.
examples:
- She cracked an oil nut to see the greasy flesh inside.
- Oil nuts grow on the rabbitwood shrub in the woods.
