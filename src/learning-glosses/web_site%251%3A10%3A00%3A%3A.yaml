simpleMeaning: A machine joined to the internet that keeps a set of pages together.
scope: A machine on the internet that keeps a set of pages; site, website and internet site are other
  names for this sense, not a single page and not a search tool.
examples:
- The Israeli web site was damaged by hostile hackers.
- She found the recipe on a cooking web site.
