simpleMeaning: Bones joined this way can swing a long way back and forth, but only in one flat direction,
  and the link moves freely
scope: A link between bones that bends in one flat direction, also called a ginglymoid joint or ginglymus;
  not a ball-and-socket link, which turns in many directions.
examples:
- The hinge joint in your elbow lets your arm bend.
- A hinge joint moves in one plane only.
