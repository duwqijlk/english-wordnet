simpleMeaning: This tropical shrub's sweet-smelling, ruffled blooms open after dark above shining leaves,
  and it grows from northern India to Thailand.
scope: Another name for the night-blooming tropical shrub also called coffee rose and pinwheel flower;
  not a true jasmine.
examples:
- A crape jasmine by the gate fills the garden with scent after dark.
- They planted crape jasmine along the fence for its glossy leaves and white flowers.
