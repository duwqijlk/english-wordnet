simpleMeaning: to sing in a voice that keeps moving between high and low, as in yodeling
scope: Singing that shifts between voice levels, not singing with quick trills that waver between two
  close notes and not the lump under an animal's skin.
examples:
- The singer warbled a folk song as she climbed the hill.
- He warbled the chorus, his voice sliding up and down.
