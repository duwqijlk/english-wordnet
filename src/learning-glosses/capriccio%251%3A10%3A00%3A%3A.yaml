simpleMeaning: a piece of music for instruments that follows no set form and is played with free invention
scope: A piece of music for instruments that follows no set form and is played with free invention; not
  a piece in a strict form and not a song with words.
examples:
- The orchestra played a lively capriccio.
- Her capriccio wandered freely from one tune to another.
