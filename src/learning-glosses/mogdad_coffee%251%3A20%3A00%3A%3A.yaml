simpleMeaning: a very leafy, bad-smelling tropical weedy shrub whose seeds have been added to the hot
  drink made from roasted beans to stretch it; sometimes put in the plant group Cassia
scope: 'Also called coffee senna, stinking weed, and styptic weed: a leafy tropical shrub whose seeds
  are added to a hot drink to stretch it, not a coffee plant and not a garden shrub.'
examples:
- Mogdad coffee grew wild by the road, its leaves giving off a bad smell.
- Farmers once mixed mogdad coffee seeds into the hot drink to stretch it.
