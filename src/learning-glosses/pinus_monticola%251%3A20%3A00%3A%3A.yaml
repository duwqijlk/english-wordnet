simpleMeaning: A tall pine of western North America with thick blue-green needles, whose bark is grey-brown
  with flat four-sided plates when grown
scope: Also called mountain pine, silver pine and western white pine, it is a tall pine of western North
  America with thick blue-green needles and grey-brown bark with flat four-sided plates when grown, while
  other tall pines of western North America and other pines with grey-brown bark are different kinds.
examples:
- The Pinus monticola stood tall in the mountains of western North America.
- Old Pinus monticola trees have grey-brown bark in flat plates.
