simpleMeaning: A soft stone of calcium fluoride that glows in light our eyes cannot see, and the chief
  source of fluorine.
scope: This is a soft stone that glows in light our eyes cannot see, not a hard gem or a metal ore, and
  it is also called fluor and fluorspar.
examples:
- Fluorite glows under ultraviolet light.
- The miner found a piece of fluorite.
