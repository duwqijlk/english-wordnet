simpleMeaning: in a way that pleases people and makes them like the person or thing
scope: It tells how an action is done, in a pleasing way that makes people like the person doing it; it
  does not mean just neatly or just politely.
examples:
- She smiled charmingly at the guests.
- He charmingly offered everyone a seat by the window.
