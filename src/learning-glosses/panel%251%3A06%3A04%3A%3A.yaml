simpleMeaning: A piece of cloth, often shaped like a triangle or getting narrower at one end, used to
  make clothes, umbrellas, or sails
scope: A piece of cloth used to make clothes, umbrellas, or sails, not the flat board with switches and
  dials and not a small box on a computer screen.
examples:
- The panel of the dress was cut from a bright cloth.
- A torn panel of the sail flapped in the wind.
