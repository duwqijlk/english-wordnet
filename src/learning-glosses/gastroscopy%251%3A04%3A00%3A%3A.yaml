simpleMeaning: Looking inside the stomach by passing a thin tube down the throat
scope: This is looking inside the stomach with a tube, not washing the stomach out and not an X-ray picture
  of the stomach.
examples:
- The doctor ordered a gastroscopy to find the cause of the pain.
- Her gastroscopy showed a sore in the stomach lining.
