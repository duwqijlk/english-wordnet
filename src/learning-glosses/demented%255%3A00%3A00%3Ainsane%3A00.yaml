simpleMeaning: having a mind so ill that it no longer works in a normal way
scope: 'Sick, crazy, mad, disturbed and unbalanced are other names for this sense: a mind so ill that
  it no longer works normally, not just acting in a wild or foolish way.'
examples:
- The old man was demented and no longer knew his own children.
- She feared she might go demented like her grandfather.
