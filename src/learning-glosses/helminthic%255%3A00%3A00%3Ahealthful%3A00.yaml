senseId: helminthic%5:00:00:healthful:00
synsetId: 01168810-s
simpleMeaning: Able to drive out or kill worms that live in or on a person or animal and feed on it.
scope: Able to drive out or kill worms that feed on a body; anthelminthic, anthelmintic and parasiticidal
  are other names for this sense, and this is not the drug itself, only the power a drug can have.
examples:
- The doctor gave her a helminthic drug to clear the worms from her gut.
- This helminthic medicine kills the worms living in the body.
