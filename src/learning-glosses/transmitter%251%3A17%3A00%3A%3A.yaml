simpleMeaning: a person, animal, or tiny living thing that carries a disease and passes it on to others
scope: A person, animal, or tiny living thing that carries a disease and passes it on, not a set of machines
  that sends out radio signals and not someone who passes on a message.
examples:
- Mosquitos are transmitters of malaria and yellow fever.
- Fleas are transmitters of the plague.
