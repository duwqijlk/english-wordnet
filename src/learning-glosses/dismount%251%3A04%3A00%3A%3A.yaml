simpleMeaning: the act of getting off a horse, a bike, or the like
scope: This noun names the act of getting off a horse, a bike, or the like; it is not staying on, and
  not getting on.
examples:
- Her dismount from the horse was quick and clean.
- He hurt his ankle during the dismount from his bike.
