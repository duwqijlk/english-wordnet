simpleMeaning: a person who works or takes part with another person in an activity or area of shared interest.
scope: This is not a husband, wife, or romantic companion, and not a co-owner of a business; it is someone
  who shares an activity or interest.
examples:
- She trained with a partner for the doubles tournament.
- The two scientists became partners in a long study of coral reefs.
