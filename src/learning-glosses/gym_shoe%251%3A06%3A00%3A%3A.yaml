scope: A cloth foot covering with a rubber bottom that bends easily; sneaker is another name for it, not
  a sleeveless tunic worn as part of a school uniform and not a set of moves that builds strength.
examples:
- He wore gym shoes for the run.
- Her gym shoes had soft rubber bottoms that bent easily.
