simpleMeaning: A member of a race from the east of Asia; Asians, above all Asian Americans, find the word
  rude
scope: A dated name for a person from East Asia that many find rude, not a neutral word for where someone
  comes from.
examples:
- The old book calls him an oriental person, a word most readers now find rude.
- She objected when the form used the words oriental person.
