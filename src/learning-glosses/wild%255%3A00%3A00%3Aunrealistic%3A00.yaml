simpleMeaning: Based on imagination rather than fact, and not sensible.
scope: A fanciful, silly idea or hope; not a claim that merely lacks evidence and not a place that is
  bleak and remote.
examples:
- It was a wild plan to build a railway across the mountain in a single year.
- His wild hopes of becoming a millionaire by twenty soon faded.
