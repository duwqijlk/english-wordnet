simpleMeaning: going against beliefs or ways of acting that a group accepts as right
scope: Also called dissident. This is about going against beliefs or ways a group accepts as right, not
  just having a new or unpopular idea.
examples:
- The group called her heretical views a danger to their shared beliefs.
- He was punished for heretical writing that went against the accepted teaching of his time.
