simpleMeaning: 'used especially of goods sold as raw materials: not processed, or produced using only
  simple or very few steps'
scope: This describes raw goods that are untreated or only lightly worked, not a person's inborn talent
  and not behaviour that comes from instinct.
examples:
- The shop sells natural honey straight from the hive, with nothing added.
- Buyers pay a premium for natural rubber that is tapped and dried but not chemically treated.
