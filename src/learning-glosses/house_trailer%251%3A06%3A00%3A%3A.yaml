simpleMeaning: People can live or stay inside this wheeled vehicle, which is pulled along by a car or
  truck
scope: 'Another name for this sense is trailer: a place on wheels that a car or truck pulls, made for
  people to live or stay in, not a lorry for carrying goods and not a tent.'
examples:
- They bought a house trailer and drove it to the coast for the summer.
- The house trailer has a bed, a small kitchen, and room to sit.
