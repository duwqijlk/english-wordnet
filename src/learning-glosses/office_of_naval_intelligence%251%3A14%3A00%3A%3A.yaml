simpleMeaning: The part of the United States Navy that gathers secret news about other forces, stops spies,
  looks into wrongdoing, and keeps Navy people and ships safe.
scope: Also called ONI; the United States Navy's own service for secret news and safety, while the Army
  and the Air Force have their own such services.
examples:
- The Office of Naval Intelligence sent its report to the fleet commander.
- The Office of Naval Intelligence looks into wrongdoing in the Navy.
