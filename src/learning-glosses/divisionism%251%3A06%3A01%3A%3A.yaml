simpleMeaning: A style of Neo-Impressionist painting in which colours are laid down as separate dots or
  patches that blend in the eye.
scope: The identifying style of Neo-Impressionist painting, recognised by separate dots or patches of
  colour that blend in the eye to make the picture.
examples:
- Divisionism builds a picture from separate dots of colour that blend in the eye.
- Sluijters was a chief representative of Divisionism in Amsterdam.
