simpleMeaning: the passage running through the bones of the back, through which the cord of nerves passes
scope: The passage running through the bones of the back, through which the cord of nerves passes; spinal
  canal and vertebral canal are other names for this sense, not the tube that carries food.
examples:
- The canalis vertebralis carries the spinal cord through the back.
- Injury to the canalis vertebralis can harm the nerves inside.
