simpleMeaning: a person accused with another person in a court case, especially a divorce case, for having
  sex with that other person while one of them was married to someone else
scope: In a court case, a person accused together with another person, especially in a divorce case; not
  a person who simply answers or gives a reply.
examples:
- In the divorce case, the respondent was accused of having sex with the other accused person, who was
  married to someone else.
- The court heard that the respondent and the other accused person had had sex while one of them was married
  to someone else.
