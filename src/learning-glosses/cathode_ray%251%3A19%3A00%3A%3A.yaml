simpleMeaning: From the negative end of a tube through which a current runs comes a stream of tiny charged
  bits.
scope: This stream has no other name in this set, and it is not the tube itself.
examples:
- The cathode ray struck the far end of the tube.
- A cathode ray shot from the negative end of the tube.
