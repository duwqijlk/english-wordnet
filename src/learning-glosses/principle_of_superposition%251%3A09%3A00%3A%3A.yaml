simpleMeaning: When waves pile on one another, the shift at any point is the sum of the shifts each wave
  makes there on its own.
scope: This rule is about waves piled on one another, not the rule in geology about the oldest layer of
  rock lying lowest.
examples:
- The principle of superposition is the basis of the wave theory of light.
- By the principle of superposition, the two waves together moved the point twice as far.
