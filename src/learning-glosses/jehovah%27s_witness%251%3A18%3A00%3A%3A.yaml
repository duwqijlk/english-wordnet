simpleMeaning: A person who believes the thousand-year reign is near and who tells others about the faith.
scope: This names a member of one named faith group who both believes the reign is near and spreads the
  faith, and it does not cover believers in general or people who keep their faith to themselves.
examples:
- A Jehovah's Witness knocked on the door to talk about the faith.
- The Jehovah's Witness believes the thousand-year reign is near.
