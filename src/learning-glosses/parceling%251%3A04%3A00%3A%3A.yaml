simpleMeaning: Sharing things out to people as planned, giving each one a part
scope: 'Also called allotment, allocation, assignation, apportioning, apportionment or parcelling: sharing
  things out as planned, not keeping things together and not sharing things out with no plan.'
examples:
- The parceling of the land among the farmers followed the old plan.
- After the parceling of the seats, each town had its share.
