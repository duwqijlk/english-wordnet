senseId: 'unidimensional%3:00:00::'
synsetId: 00662902-a
simpleMeaning: dealing with only one part or side of a thing, and having no depth or wider reach
scope: 'Also called one-dimensional: about only one part or side of a thing, not about many sides and
  not deep or wide.'
examples:
- His unidimensional account left out every other side of the problem.
- A short statement of fact can be unidimensional, judged only by whether it is true.
