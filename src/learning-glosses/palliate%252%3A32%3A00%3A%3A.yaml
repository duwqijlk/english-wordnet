simpleMeaning: To try to cut down the harm or the size of a thing, or to cut it down
scope: 'Also called mitigate and extenuate: to make a bad thing less bad or less wide, or to try to, not
  to end it and not to hide it.'
examples:
- He tried to palliate the harm by saying it was a small mistake.
- The new law did little to palliate the effects of the drought.
