simpleMeaning: A Chadic tongue spoken south of Lake Chad, above all in Borno State, in the Biu and Askira-Uba
  areas, and in Adamawa State, in the Gombi area.
scope: Also called Bura, Pabir, and Pabir language; a Chadic tongue spoken south of Lake Chad, above all
  in Borno State and Adamawa State.
examples:
- He speaks the Bura language with his family.
- The Bura language is spoken in Borno State.
