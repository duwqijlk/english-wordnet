simpleMeaning: A state of going too far in what one does, most of all in giving in to the wants of the
  body or to wild feelings.
scope: This is a state of going too far in what one does, most of all in giving in to the wants of the
  body or to wild feelings, also called intemperance or self-indulgence.
examples:
- Their intemperateness showed in all they did.
- The intemperateness of their drinking was plain to see.
