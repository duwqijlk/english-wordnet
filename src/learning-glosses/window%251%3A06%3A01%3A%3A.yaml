simpleMeaning: a see-through opening on the side or back of a vehicle that lets you look out and can usually
  be opened.
scope: This is an opening on a vehicle, not a frame built into a building and not a panel in an envelope.
examples:
- He rolled down the window to speak to the guard.
- The back window of the van was covered in dust.
