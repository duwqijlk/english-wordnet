simpleMeaning: Large shrub from tropical Africa and Asia with hand-shaped leaves and spiny capsules whose
  seeds yield a thick oil and the poison ricin; now widely spread through the tropics.
scope: Another name for the same tropical shrub, also called palma christi; not a true palm, despite the
  name, and not the oil from its seeds.
examples:
- Old herbalists praised the palma christ for the oil pressed from its seeds.
- A palma christ grew by the gate, its broad leaves spread out like a hand.
