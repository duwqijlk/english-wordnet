simpleMeaning: A block made with sand and slaked lime rather than clay, usually pale gray or off-white
  in colour.
scope: This is a building block made without clay, not a clay block, and it is also called calcium-silicate
  brick, sand-lime brick, and sandlime brick.
examples:
- The builders used flintlime brick for the wall.
- This flintlime brick is pale gray.
