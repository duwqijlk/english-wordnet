  or roots that run flat under the ground
scope: Any of many kinds of flowering plant with stringy roots, not roots that are thick and fleshy or
  roots that run flat under the ground; not a plant with thick roots and not one with roots that run flat
  under the ground.
examples:
- The fibrous-rooted begonia grew in the pot.
- Her fibrous-rooted begonia has stringy roots.
