simpleMeaning: One of many kinds of pale or grey plant of the group called Sphagnum dies and breaks down,
  and what is left builds up into dark fuel.
scope: Sphagnum, bog moss, and sphagnum moss are also names for this pale plant, whose dead remains build
  up into dark fuel.
examples:
- The ground was covered in pale patches of peat moss.
- The peat moss died back and broke down where it grew.
