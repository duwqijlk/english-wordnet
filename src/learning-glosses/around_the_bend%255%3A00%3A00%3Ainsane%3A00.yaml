simpleMeaning: in loose everyday talk, a word for a person whose mind is not working right
scope: 'Also called balmy, barmy, bats, batty, bonkers, buggy, cracked, crackers, daft, dotty, fruity,
  haywire, kookie, kooky, loco, loony, loopy, nuts, nutty, and wacky: a loose everyday word for a mind
  that is not working right, not a word for a person who is merely odd or a word for a person who is ill
  in body.'
examples:
- After a week with no sleep, he felt he was going around the bend.
- She joked that the long hours at work would send her around the bend.
