senseId: 'annoyance%1:18:00::'
synsetId: 09797978-n
simpleMeaning: a person who other people do not like, because this person troubles them and makes them
  angry
scope: This sense is a person who troubles others, not a feeling of anger and not the act of troubling
  someone.
examples:
- The noisy boy next door is a real annoyance to everyone on the street.
- She called her little brother an annoyance when he kept following her around.
