simpleMeaning: in a warm, comfortable way, safe from the cold and weather outside
scope: This means warm, comfortable and safe from the weather, not fitting tightly or lying close in a
  small space.
examples:
- The children sat snugly by the fire while the storm went on outside.
- She lay snugly under the thick covers on the cold night.
