simpleMeaning: 'The money of eight free states in West Africa: Benin, Burkina Faso, Guinea-Bissau, Ivory
  Coast, Mali, Niger, Senegal, and Togo.'
scope: The money of eight free states in West Africa; the Central African CFA franc is a different money
  of equal value, and the euro is a different money of Europe.
examples:
- The West African CFA franc is the money of Senegal and seven other states.
- She paid in West African CFA franc at the market in Mali.
