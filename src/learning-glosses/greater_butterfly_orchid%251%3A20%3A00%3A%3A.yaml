simpleMeaning: Larger and less sweet-smelling than those of Platanthera bifolia, the dark green flowers
  mark this south European orchid, which is sometimes placed in the group Habenaria.
scope: This south European orchid differs from the lesser butterfly orchid in its larger, less sweet-smelling
  flowers.
examples:
- We found a greater butterfly orchid in southern Europe.
- The greater butterfly orchid's flowers were dark green.
