simpleMeaning: a tall round oven that stands upright, used to melt iron so the iron can be poured into
  shapes
scope: A tall oven for melting iron in a place where metal things are made, not the small round part on
  top of a roof.
examples:
- Workers melted iron in the cupola before pouring it into shapes.
- The cupola stood tall in the yard where metal parts were made.
