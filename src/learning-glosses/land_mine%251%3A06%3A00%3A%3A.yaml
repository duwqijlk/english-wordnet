simpleMeaning: A hidden bomb buried under the ground that goes off when a foot steps on it or a wheel
  rolls over it
scope: This is a hidden bomb buried under the ground that blows up when stepped on or driven over, also
  called booby trap and ground-emplaced mine, not a bomb dropped from the air and not a sea mine.
examples:
- The soldiers marked the field where a land mine had been found.
- A land mine blew up under the truck on the dirt road.
