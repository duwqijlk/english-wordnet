simpleMeaning: A common wild water bird of Europe with ash-coloured feathers, from which many farm breeds
  come.
scope: 'Also called a graylag, a graylag goose, or a greylag: a common wild water bird of Europe, not
  a farm goose and not a swan.'
examples:
- The greylag goose nests in the marshes of northern Europe.
- The greylag goose is the wild kin of the farm goose.
