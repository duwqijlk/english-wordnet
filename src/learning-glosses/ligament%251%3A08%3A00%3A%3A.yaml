simpleMeaning: A sheet or band of strong body stuff. It joins bones or cartilage, a firm body stuff softer
  than bone. It also holds up muscles and organs.
scope: This is a strong band inside the body, not a muscle and not a bone itself.
examples:
- He hurt a ligament in his knee when he fell.
- The ligament holds the bones of her ankle in place.
