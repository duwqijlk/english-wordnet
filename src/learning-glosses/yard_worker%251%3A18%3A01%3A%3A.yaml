simpleMeaning: a person paid to do work outside, such as cutting grass
scope: This is a person of any sex paid to do work outside, not only a man or only a woman hired for that
  work, and not a person who works inside.
examples:
- We hired a yard worker to cut the grass every week.
- The yard worker raked the leaves and cleared the path.
