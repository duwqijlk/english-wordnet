simpleMeaning: Of or having to do with the group of animals that includes cattle
scope: Of or having to do with the group of animals that includes cattle, also called bovine; not of sheep
  or goats and not of wild deer.
examples:
- Bovid animals such as cattle and their wild kin graze on the plain.
- The bovid skull was that of an ox.
