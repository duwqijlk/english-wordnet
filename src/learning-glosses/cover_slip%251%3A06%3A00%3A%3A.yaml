simpleMeaning: a tiny, very thin sheet of glass laid over the small thing put on a flat plate for a close
  look through a microscope
scope: A tiny thin sheet of glass laid over what is looked at under a microscope; cover glass is another
  name for this sense, and it is not the flat plate itself or a large sheet of glass.
examples:
- She put a cover slip over the drop of water on the slide.
- The cover slip kept the sample flat under the microscope.
