simpleMeaning: A poinsettia of the United States and eastern Mexico, often mixed up with a plant of the
  same group.
scope: Also called fire-on-the-mountain, painted leaf, and Mexican fire plant, this poinsettia of the
  United States and eastern Mexico is often mixed up with Euphorbia heterophylla, not that other plant.
examples:
- Euphorbia cyathophora grows in eastern Mexico.
- People often mix up Euphorbia cyathophora with Euphorbia heterophylla.
