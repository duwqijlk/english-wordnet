simpleMeaning: a full beauty treatment that changes a person's hair style, make-up, and clothes, done
  to make the person look better
scope: This is a full change to a person's hair, make-up, and clothes, not just a new haircut, and not
  work done to a room or a house.
examples:
- After her makeover, she had short hair, new make-up, and a new dress.
- The television show gave him a makeover, with a new hair style and new clothes.
