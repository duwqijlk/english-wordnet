simpleMeaning: A plane that lands on the flat top of a warship that carries planes is held back by this
  device, which slows it down until it stops.
scope: Also called arrester hook, this device is the one that holds a plane back and slows it down as
  it lands on the flat top of a warship that carries planes.
examples:
- The arrester caught the plane as it landed on the carrier.
- An arrester slowed the jet on the flight deck.
