simpleMeaning: any of several poisonous long reptiles with no legs and with short fixed teeth at the front
  of the mouth, found in Asia, Africa and Australia
scope: Any of several poisonous long reptiles with no legs and with short fixed teeth at the front of
  the mouth, found in Asia, Africa and Australia; not the brightly banded New World snake of the same
  name, and not a harmless snake.
examples:
- The coral snake slipped away into the grass.
- Walkers were warned that the coral snake is venomous.
