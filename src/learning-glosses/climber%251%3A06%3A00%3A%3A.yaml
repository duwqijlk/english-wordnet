simpleMeaning: a sharp iron point fixed to a shoe so the wearer does not slip on ice while moving about
scope: An iron spike fixed to a shoe to stop slipping on ice, not a climbing plant and not a person who
  climbs mountains.
examples:
- The climber on his boot bit into the ice and kept him from slipping.
- He fixed a climber to each shoe before crossing the frozen lake.
