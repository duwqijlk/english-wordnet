simpleMeaning: A high sound that lasts a very short time and is made to give a sign or a warning
scope: 'Also called beep: a short, high sound used as a sign or warning, not the act of making that sound.'
examples:
- The machine gave a short bleep when the time was up.
- I heard a bleep from the phone, so I checked the screen.
