simpleMeaning: At formal gatherings the native peoples of America smoke this richly patterned pipe, above
  all as a sign of peace.
scope: This richly patterned pipe of the native peoples of America is also called peace pipe and pipe
  of peace, not a pipe for everyday smoking.
examples:
- They smoked the calumet at the gathering as a sign of peace.
- The calumet was smoked at formal gatherings.
