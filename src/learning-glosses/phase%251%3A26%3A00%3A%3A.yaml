simpleMeaning: In physical chemistry, a separate state of matter in a system, the same in chemical make-up
  and physical state all through, and split from other matter by an edge
scope: This sense, also called form, is a state of matter in a system, not the shape of light on the moon
  and not a point in a repeating cycle.
examples:
- In this system, water as a liquid is one phase and ice is another.
- The oil stayed in its own phase, split from the water by a clear edge.
