simpleMeaning: The faith of one God followed by Muslims, begun in Arabia in the 7th century and built
  on the teachings of Muhammad as set down in the Koran
scope: The faith of one God followed by Muslims; Islamism, Mohammedanism, Muhammadanism and Muslimism
  are other names for this sense, not the civilisation of Muslims as a whole.
examples:
- Islam began in Arabia in the 7th century.
- The Koran is the holy book of Islam.
