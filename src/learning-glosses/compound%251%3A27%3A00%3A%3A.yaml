simpleMeaning: In chemistry, a substance made by joining two or more basic substances or other parts that
  go into it, always in the same set share by weight
scope: In chemistry, a substance made by joining other substances, not a word made by joining word parts
  and not a group of buildings inside a wall.
examples:
- Water is a compound made of hydrogen and oxygen.
- Salt is a compound that forms from sodium and chlorine.
