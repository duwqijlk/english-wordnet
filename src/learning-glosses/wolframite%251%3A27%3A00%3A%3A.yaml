simpleMeaning: A crystal-form mineral of iron-manganese tungstate, the chief tungsten ore, lying in veins
  of quartz by granite rocks.
scope: This sense is also called iron manganese tungsten, for a crystal-form mineral of iron and manganese
  tungstate, the chief ore of tungsten, lying in quartz veins by granite rocks.
examples:
- Wolframite is the main tungsten ore.
- Wolframite lies in quartz veins.
