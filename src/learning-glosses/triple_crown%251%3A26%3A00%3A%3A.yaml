simpleMeaning: In baseball, an unofficial honour for a batter who tops the league in batting average,
  runs driven in, and home runs
scope: In baseball, an unofficial honour for a batter who tops the league in batting average, runs driven
  in, and home runs; not the horse-racing honour of the same name and not a prize for pitching.
examples:
- He won the triple crown by leading the league in all three marks.
- A triple crown winner must top the league in batting, runs driven in, and home runs.
