senseId: 'fragrant_bedstraw%1:20:00::'
synsetId: 12686032-n
simpleMeaning: A sweet-smelling, runner-spreading Old World perennial with narrow leaves and small white
  flowers; used for flavouring and in sachets, widely grown as ground cover, and sometimes placed in genus
  Asperula.
scope: This sense names the plant itself, not the flavouring or sachet contents made from it. Other bedstraws
  are separate plants, and the Asperula note is a matter of classification, not a different sense.
examples:
- Fragrant bedstraw spread across the shady bank, covering it with a mat of green.
- She dried fragrant bedstraw and sewed it into small bags for the linen cupboard.
