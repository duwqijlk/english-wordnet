simpleMeaning: a person who stands out as very fine, as if made by boiling a tasty soup down to its best
  part
scope: 'Also called broth of a boy: a person who stands out as very fine, not an ordinary person and not
  a dish of soup.'
examples:
- He is a broth of a man, honest and brave.
- They called him a broth of a man after he saved the child.
