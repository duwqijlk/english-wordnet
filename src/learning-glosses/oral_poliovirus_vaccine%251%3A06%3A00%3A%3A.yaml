simpleMeaning: Taken by mouth, this holds live but weak germs of the disease that cripples the limbs,
  given so the body can fight off that disease.
scope: This is also called trivalent live oral poliomyelitis vaccine, and it is taken by mouth to guard
  against the disease that cripples the limbs.
examples:
- The oral poliovirus vaccine is taken by mouth to guard against the disease that cripples the limbs.
- The oral poliovirus vaccine is given by mouth.
