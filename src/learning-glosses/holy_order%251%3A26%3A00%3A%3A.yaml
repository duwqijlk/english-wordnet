simpleMeaning: The rank or post, often in the plural, held by a Christian priest or other church leader
  in the church's chain of ranks
scope: This is the rank or post held by a Christian priest or other church leader in the church's chain
  of ranks, also called Order; near rivals are the separate ranks of bishop and deacon.
examples:
- He took Holy Orders when he was made a priest in the church.
- She asked whether Holy Order was a rank in the church or the act of giving that rank.
