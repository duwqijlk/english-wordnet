simpleMeaning: A thickly branched plant from Europe and Asia, whose leaves turn a red-purple colour in
  autumn.
scope: A thickly branched plant from Europe and Asia with leaves that turn red-purple in autumn; also
  called belvedere, burning bush, fire-bush and fire bush; not a true cypress tree and not a garden shrub
  grown for flowers.
examples:
- Summer cypress turns red-purple in the autumn garden.
- They planted summer cypress along the path.
