simpleMeaning: A low, tufted plant with tiny greenish flowers and leaves usually growing in rings; found
  in warm regions worldwide, once thought to cure nail infections.
scope: This is the plant; it does not mean the painful infection around a fingernail that it was once
  believed to heal.
examples:
- Whitlowwort grows in small tufts along dry, sunny paths.
- Old herbals claimed that whitlowwort could heal a sore finger.
