simpleMeaning: an injury that badly changes how a person looks or takes away an arm, a leg, or another
  important part of the body
scope: A bad injury that changes how a person looks or takes away a body part, not a small cut and not
  an illness.
examples:
- The accident caused the mutilation of his right hand.
- Doctors worked hard to repair the mutilation to her face.
