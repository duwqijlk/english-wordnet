simpleMeaning: a male pilot who flies his plane outside and behind the leader of a group of planes flying
  together
scope: This is the pilot who flies behind and to the side of the leader in a group, not the leader himself
  and not a helper on the ground.
examples:
- The wingman flew behind the leader to guard the group.
- As wingman, he stayed outside and behind the lead plane.
