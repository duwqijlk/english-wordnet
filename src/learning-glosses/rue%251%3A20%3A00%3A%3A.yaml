simpleMeaning: A strong-smelling plant from Europe that lives for years, with grey-green leaves that taste
  bitter and can sting the skin like poison ivy.
scope: A strong-smelling plant from Europe that lives for years, with grey-green leaves that taste bitter
  and can sting the skin like poison ivy, not the leaves used to flavour drinks in the next batch.
examples:
- Rue grew along the garden wall, its grey leaves giving off a sharp smell.
- She touched the rue and her skin reddened like a rash.
