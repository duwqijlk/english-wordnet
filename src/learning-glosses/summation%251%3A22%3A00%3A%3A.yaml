simpleMeaning: In the body, the way a number of small pushes together can set off a response in a muscle,
  a nerve, or another part, when one push alone cannot.
scope: In physiology, the process whereby multiple stimuli can produce a response that one stimulus alone
  does not produce, not adding up numbers and not a closing summary in court.
examples:
- Summation in the nerve let a weak signal build into a clear response.
- The summation of small stimuli made the muscle twitch.
