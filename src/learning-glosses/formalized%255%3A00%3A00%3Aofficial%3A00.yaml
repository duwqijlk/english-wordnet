simpleMeaning: given an accepted place or support, and made official or proper by following the right
  steps
scope: 'Also called formalised: made official by following the right steps. It is not the sense about
  strictly keeping to set forms in religion or art.'
examples:
- The two schools formalized their agreement in a signed paper.
- Once the plan was formalized, the building work could begin.
