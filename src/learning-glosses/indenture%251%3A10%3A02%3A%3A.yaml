simpleMeaning: a formal agreement that sets the rules for a debt, between the side that gives out bonds
  (papers promising to pay back money lent) and the side that holds them
scope: This sense is the paper agreement about bonds and debt, not the act of binding a worker to serve
  someone and not the space at the start of a line.
examples:
- The indenture set the date for paying back the bonds.
- Investors read the indenture carefully before buying the bonds.
