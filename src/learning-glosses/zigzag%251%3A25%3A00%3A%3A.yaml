simpleMeaning: a shape that has sharp turns, first one way and then the other way
scope: 'Also called a zig, and another name for it is a zag: this is the shape itself, with sharp turns
  one way then the other; not moving along such a path, and not the word for going in such a way.'
examples:
- She drew a zigzag across the page with her pen.
- The path down the hill is a steep zigzag.
