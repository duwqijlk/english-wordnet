simpleMeaning: The tubes and living stuff that carry fluids such as blood, lymph or sap through the body
  of an animal or plant.
scope: The tubes and living stuff that carry fluids such as blood, lymph or sap through the body of an
  animal or plant, not the tubes that carry air and not the nerves.
examples:
- The vascular system carries blood through the body.
- In a plant, the vascular system carries sap.
