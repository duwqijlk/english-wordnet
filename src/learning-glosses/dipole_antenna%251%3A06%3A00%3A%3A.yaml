simpleMeaning: An aerial half a wave long, made of two rods joined at the middle to the line that carries
  the signal.
scope: A two-rod aerial half a wave long, also called a dipole; not the charge sense of the same word
  and not a single-rod aerial.
examples:
- The dipole antenna on the roof picks up the signal.
- A dipole antenna has two rods joined at the middle.
