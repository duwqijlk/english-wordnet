simpleMeaning: A person who takes bets, especially on horse races, and pays out the winnings to those
  who bet right.
scope: Also called bookie; a person who takes bets, especially on horse races, and pays out the winnings
  to those who bet right, not a maker of books who edits, publishes, or binds them.
examples:
- The bookmaker paid out after the favourite won the race.
- She placed her bet with the bookmaker at the track.
