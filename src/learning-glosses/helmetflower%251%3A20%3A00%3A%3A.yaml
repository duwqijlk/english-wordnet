simpleMeaning: Turned upside down, the small green cup of this soft-stemmed herb of the group Scutellaria
  looks like a soldier's head cover with its face guard lifted.
scope: People also call this herb skullcap, and it is not the orchid of the same name nor the poisonous
  blue-purple-flowered herb of the same name.
examples:
- The helmetflower had soft stems and small green cups.
- She turned a helmetflower upside down to show the shape like a head cover.
