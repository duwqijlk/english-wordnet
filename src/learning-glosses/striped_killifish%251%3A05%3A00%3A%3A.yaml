simpleMeaning: a fish with black bars, found in bays and coastal marshes of the Atlantic and Gulf coasts
  of the United States
scope: This is a fish with black bars, also called may fish and mayfish; not a plain fish of the open
  sea and not a fresh-water fish.
examples:
- Striped killifish live in the coastal marshes of the Gulf.
- We caught a striped killifish in the bay.
