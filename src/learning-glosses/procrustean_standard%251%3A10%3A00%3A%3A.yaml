senseId: 'procrustean_standard%1:10:00::'
synsetId: 07276450-n
simpleMeaning: A rule made to fit everyone the same way, with no care for what makes each one different
scope: A rule forced on everyone alike, with no regard for individual differences; procrustean bed and
  procrustean rule are other names for this sense, not a rule made to suit each person.
examples:
- The procrustean standard left no room for personal differences.
- They applied a procrustean standard to every student, whatever their needs.
