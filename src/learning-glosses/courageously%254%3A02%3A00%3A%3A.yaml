simpleMeaning: in a brave way, doing what is needed even when it is dangerous or frightening
scope: This is about how someone acts with bravery when there is danger, not about a brave person or thing
  by itself.
examples:
- She courageously went into the burning house to help the child.
- He courageously stood in front of his friends when danger came.
