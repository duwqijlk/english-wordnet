senseId: 'enactment%1:10:00::'
synsetId: 06544086-n
simpleMeaning: A paper with the force of law, setting out what a group that makes rules, such as a lawmaking
  body, agreed after talking it through.
scope: Also called an act, this is a written paper with the force of law, not the act of playing a part
  on stage.
examples:
- The enactment was signed into law on Monday.
- The committee published the enactment after months of debate.
