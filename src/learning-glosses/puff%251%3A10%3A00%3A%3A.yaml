simpleMeaning: praise that makes something sound far better than it is, used to help sell it
scope: Overstated praise meant to sell something, not a bed cover and not a light pastry.
examples:
- The puff in the ad called the hotel the finest in the world.
- Critics saw the puff as mere sales talk, not a fair review.
