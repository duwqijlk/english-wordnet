simpleMeaning: too much work by the pituitary gland, above all by the front part of the gland, which makes
  too much of the hormone that makes the body grow
scope: Too much work by the pituitary gland, above all its front part, not too little work by the gland
  and not a disorder of the adrenal gland.
examples:
- Hyperpituitarism caused the boy to grow far taller than his friends.
- The doctor said hyperpituitarism was making too much growth hormone.
