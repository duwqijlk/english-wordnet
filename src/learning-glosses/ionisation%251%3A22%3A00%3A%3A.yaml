simpleMeaning: The act of ionizing, making ions by pulling apart atoms or molecules or radicals, or by
  adding or taking away electrons from atoms with strong electric fields in a gas.
scope: The act of ionizing, making ions by pulling apart atoms or molecules or radicals, or by adding
  or taking away electrons from atoms with strong electric fields in a gas; it is also called ionization,
  unlike the sense for the state of being split into ions, as by heat or radiation or a chemical change
  or an electric discharge.
examples:
- Ionisation makes ions in a gas.
- Ionisation pulls atoms apart.
