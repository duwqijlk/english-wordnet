simpleMeaning: The way words are spelled in Australia, using forms like analyse, centre and usable.
scope: This is the way words are spelled in Australia, marked by forms like analyse, centre and usable;
  Australian English orthography and Australian English spelling are other names for it, and it is about
  spelling on the page, not about how words are spoken.
examples:
- Australian spelling uses centre instead of center.
- Her Australian spelling follows the forms analyse and centre.
