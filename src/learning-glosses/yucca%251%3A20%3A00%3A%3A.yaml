simpleMeaning: any of several plants that stay green all year, with usually tall thick stems and a group
  of white flowers at the top, from warm parts of North America
scope: A plant that stays green all year, with tall thick stems and white flowers at the top; not a tree
  and not a short garden flower.
examples:
- A tall yucca grew by the front door of the desert house.
- Yucca flowers open white at the top of the stem in summer.
