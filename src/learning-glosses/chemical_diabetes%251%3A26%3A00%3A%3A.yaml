simpleMeaning: A mild blood-sugar illness in which the person shows no clear signs, but tests that look
  for the illness give odd results.
scope: 'Also called latent diabetes: a mild blood-sugar illness found only by tests, not the illness in
  its full form.'
examples:
- Chemical diabetes gave her no signs, but the test results were odd.
- The doctor said his chemical diabetes showed up only in the lab tests.
