simpleMeaning: With reddish-brown feathers, this grouse, a wild bird, lives on the high open hills of
  Great Britain
scope: Also called moor-bird, moorbird and moorfowl, this is the reddish-brown grouse of the high moors
  of Great Britain, not the black moorhen of ponds and lakes.
examples:
- We saw moorgame among the heather on the high moor.
- The moorgame hid in the heather when we came near.
