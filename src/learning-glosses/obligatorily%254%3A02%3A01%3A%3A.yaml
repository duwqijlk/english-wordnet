senseId: 'obligatorily%4:02:01::'
synsetId: 00416660-r
simpleMeaning: In a way that must be done, with no choice about it.
scope: In a way that must be done, with no choice about it; not done because it is liked, and not done
  merely because it is needed.
examples:
- This rule applies obligatorily to every member.
- The form must be filled in obligatorily, not as you please.
