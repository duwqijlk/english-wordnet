simpleMeaning: The most essential or typical part of something, the element that matters most or defines
  it.
scope: This is the key part or defining quality of something, not physical material, personal belongings,
  or an activity in general.
examples:
- The real stuff of good journalism is patient checking of facts.
- Courage and patience are the stuff of lasting friendships.
