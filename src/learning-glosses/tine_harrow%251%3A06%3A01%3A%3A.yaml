simpleMeaning: A harrow for readying the seed-bed before planting, pulling small weeds from growing crops
  and loosening the soils between rows so water can soak into the subsoil.
scope: For a farm tool used to ready seed-beds and weed crops before planting.
examples:
- The tine harrow loosens the soil.
- Farmers use a tine harrow before planting.
