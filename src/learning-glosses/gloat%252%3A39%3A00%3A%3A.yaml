simpleMeaning: to dwell with great pleasure on something that makes you feel pleased with yourself
scope: To keep enjoying a thought that makes you feel pleased with yourself, not to feel sorry for someone
  and not to share a victory.
examples:
- He gloated over his rival's defeat all week.
- She gloated about winning the prize.
