simpleMeaning: A drawing that shows the beating of the heart over time, made by a machine that records
  heartbeats.
scope: Also called an electrocardiogram, a drawing that shows the beating of the heart over time, made
  by a machine that records heartbeats.
examples:
- The cardiogram showed her heart beating in a steady rhythm.
- The doctor studied the cardiogram after the test.
