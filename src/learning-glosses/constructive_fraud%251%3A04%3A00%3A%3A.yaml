simpleMeaning: A fair or lawful duty, or a trust or confidence placed in someone, is broken by any act,
  failure to act or hiding of facts.
scope: Also called legal fraud, this covers any act, failure to act or hiding of facts that breaks a fair
  or lawful duty or a trust or confidence placed in someone.
examples:
- Constructive fraud covers acts and omissions that break a duty of trust.
- Constructive fraud covers the hiding of facts that breaks a trust.
