simpleMeaning: a cell (a very small part of a living thing) in the eye that takes in light and works when
  light is weak
scope: This is a cell in the eye that helps you see when light is weak, not a long thin stick or bar,
  and not a tiny living thing with a long thin shape.
examples:
- Rods in the eye help us see in dim light.
- A rod reacts more to weak light than to bright light.
