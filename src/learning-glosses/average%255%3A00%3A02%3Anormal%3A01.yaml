simpleMeaning: close to what is typical or expected for a set of measurements
scope: This describes a value near the norm, not something ordinary or undistinguished, not a middle rating
  on a scale, and not a distribution's most frequent or median value.
examples:
- The average price of a home rose slightly last month.
- Average rainfall in April is about 40 millimeters.
