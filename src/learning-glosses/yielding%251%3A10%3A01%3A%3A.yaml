schema: oewn-learning-gloss-v2
senseId: 'yielding%1:10:01::'
synsetId: 07269695-n
simpleMeaning: saying in words that you have lost and give up
scope: This is saying out loud that you have lost, also called surrender; it is not being a person who
  is easy for others to lead, and not the wider act of giving something in.
examples:
- Her yielding was clear when she stood up and said in front of everyone, 'We have lost.'
- After his yielding, in which he told the judges he could not win, the contest ended.
