scope: A long-lived plant of the Old World grown for its showy orange-red cup, not a plant grown for its
  fruit or a tree with lantern-like flowers; also called bladder cherry, winter cherry and Physalis alkekengi.
examples:
- The Chinese lantern plant shows orange-red cups in autumn.
- We grow Chinese lantern plant for its showy cups.
