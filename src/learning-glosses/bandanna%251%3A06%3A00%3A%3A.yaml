simpleMeaning: a large piece of cloth in bright colors, used as a cloth for the nose, and often worn around
  the neck
scope: Also called bandana. This is a large, bright cloth often worn around the neck, not a hat and not
  a thick scarf for cold weather.
examples:
- He wore a red bandanna around his neck.
- She tied a blue bandanna over her hair.
