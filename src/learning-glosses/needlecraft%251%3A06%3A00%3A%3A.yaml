simpleMeaning: A thin pointed sewing tool and thread are what make or put together this thing
scope: A thing made or put together with a thin pointed sewing tool and thread, also called needlework,
  not a thing made by machine and not the act of sewing itself.
examples:
- Her needlecraft hung on the wall.
- The shop sells needlecraft made by local hands.
