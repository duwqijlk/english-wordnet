simpleMeaning: A part of the armed forces that gets, studies, and uses facts that matter for planning
  a war and for fighting battles.
scope: 'Also called military intelligence agency: a part of the armed forces that gets, studies, and uses
  facts that matter for planning a war and for fighting battles, not a spy network outside the forces
  and not news reports.'
examples:
- Military intelligence warned of an attack at dawn.
- The general relied on military intelligence before the battle.
