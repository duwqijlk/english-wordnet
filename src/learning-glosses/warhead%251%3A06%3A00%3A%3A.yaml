simpleMeaning: The front end of a guided missile, rocket, or torpedo, holding a nuclear charge, a charge
  that blows up, or the chemicals or living things used as weapons.
scope: Also called a load or a payload; the front end of a guided missile, rocket, or torpedo, holding
  its charge, not the whole missile.
examples:
- The warhead sat at the front of the missile.
- Engineers removed the warhead from the rocket.
