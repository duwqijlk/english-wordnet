simpleMeaning: Leaving duties undone and not caring about it is this person's way of being
scope: Leaving duties undone and not caring about it is this way of being; neglect and negligence are
  other names for this sense, not a single missed duty and not a lack of skill.
examples:
- His neglectfulness showed when he left every bill unpaid and never worried about it.
- The neglectfulness of the landlord left the roof leaking for years.
