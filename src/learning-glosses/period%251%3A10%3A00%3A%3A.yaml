simpleMeaning: the punctuation mark written as a dot (.), used to show a statement has ended or placed
  after an abbreviation
scope: This is the punctuation mark, not a length of time such as a school term or a historical era.
examples:
- Put a period at the end of every sentence in your essay.
- In American usage, the abbreviation 'Dr' is written with a period after it.
