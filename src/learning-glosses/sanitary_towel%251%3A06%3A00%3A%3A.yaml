simpleMeaning: A pad sold under the trade name Kotex, thrown away after one use, that soaks up the blood
  that leaves a woman's body each month.
scope: Also called a sanitary napkin, it is a throw-away pad worn to soak up the blood that leaves a woman's
  body each month, sold under the trade name Kotex.
examples:
- They packed a clean sanitary towel for the trip.
- They bought a pack of sanitary towels at the shop.
