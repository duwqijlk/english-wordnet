simpleMeaning: In chemistry, the splitting of one thing into two or more things that can differ from each
  other and from the first thing
scope: In chemistry, the splitting of one thing into two or more things; breakdown, decomposition and
  decomposition reaction are other names for this sense, not the joining of parts and not rotting by germs.
examples:
- The chemical decomposition reaction split the salt into two parts.
- Heat set off a chemical decomposition reaction in the powder.
