senseId: 'hindrance%1:04:00::'
synsetId: 01075919-n
simpleMeaning: the act of blocking or slowing the way something happens or moves forward
scope: Also called interference. This is the act of blocking or slowing something, not the person or thing
  that does the blocking, and not something that is not a thing you can touch, which holds up action or
  progress.
examples:
- The hindrance of rescue work by the storm made the night harder.
- Police charged him with the hindrance of an officer doing his job.
