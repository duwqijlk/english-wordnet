simpleMeaning: to keep money back as a reserve, or take it out of use, when the money is capital
scope: To hold money back as a reserve or take it out of use, not to forbid its use by law.
examples:
- The bank will immobilize part of its capital this year.
- They immobilized funds to guard against losses.
