simpleMeaning: the form of ‘few’ used to show the smallest number, for things you can count, usually with
  ‘the’ before it
scope: This word means the smallest number of things you can count; 'fewer' means only a smaller number
  than another one, and this word is not used for amounts you cannot count, like water.
examples:
- Of all the classes in the school, mine has the fewest students.
- She made the fewest mistakes in the whole test.
