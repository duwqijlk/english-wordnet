simpleMeaning: a fresh-water fish of Europe and western Asia, like a dace, caught for sport and able to
  live out of water
scope: A fresh-water fish caught for sport, not a sea fish and not a dace, though it looks like one.
examples:
- He caught a tench in the lake at dawn.
- The tench lay on the bank, still alive out of the water.
