simpleMeaning: The royal family ruled Britain by this name from nineteen oh one to nineteen seventeen,
  then people changed it to Windsor for ill will toward Germans in World War One.
scope: The name of a royal family, not the family itself, and not the later name Windsor.
examples:
- The royal family gave up the Saxe-Coburg-Gotha name in nineteen seventeen.
- Windsor replaced Saxe-Coburg-Gotha as the name of the royal family.
