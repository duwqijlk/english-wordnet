simpleMeaning: to blame someone or something in strong words, and to judge what they did harshly
scope: To speak blame in strong, harsh words, not to praise someone and not to make a mild remark about
  a small fault.
examples:
- She animadverted on his careless work in front of the whole team.
- The critic animadverted on the new play, calling it dull and badly made.
