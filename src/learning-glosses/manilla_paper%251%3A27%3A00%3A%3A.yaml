simpleMeaning: Strong and smooth, light brown in colour, it comes in sheets made from a plant fibre such
  as hemp, or in thin cardboard.
scope: Also called manila, manilla, and manila paper, it is strong, smooth stuff in sheets, light brown,
  made from a plant fibre.
examples:
- He held up a sheet of manilla paper to the light.
- A stack of manilla paper stood on the shelf.
