simpleMeaning: With reddish berries, large showy leaves at its base, and a boat-shaped flower cover, this
  is one of the plants of the group Alocasia.
scope: It is also called alocasia and elephant's ear, and it is a plant with reddish berries and large
  showy leaves at its base.
examples:
- The elephant ear has large showy leaves at its base.
- The elephant ear bears reddish berries.
