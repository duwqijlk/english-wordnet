simpleMeaning: A healer who treats people by moving their bones and muscles
scope: A healer who treats people by moving their bones and muscles, also called osteopathist; not a doctor
  who gives medicine and not a healer who works only on the back.
examples:
- She saw an osteopath for the pain in her shoulder.
- The osteopath moved his arm to ease the stiff joint.
