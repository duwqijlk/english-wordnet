synsetId: 02863755-n
simpleMeaning: a round tool that thread, tape, film, or other things that can bend easily can be wound
  around
scope: This tool is also called a reel or a bobbin. It is the round thing itself, not winding thread onto
  it, and not sending data to a printer to keep for a short time.
examples:
- She wound the thread onto a spool.
- The film was wound on a large spool in the old camera.
