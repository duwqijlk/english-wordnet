simpleMeaning: the act of splitting something into parts, or making a boundary that splits it and keeps
  the parts apart
scope: 'Also called division, partition, partitioning, sectionalisation and sectionalization: splitting
  into parts, not the splitting of an egg at the start of life.'
examples:
- The segmentation of the market helped the company sell to each group.
- Segmentation of the long report into short parts made it easier to read.
