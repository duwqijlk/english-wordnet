simpleMeaning: Bright orange or red flowers grow on this warm-climate bush, at times put in the group
  called Poinciana.
scope: Also called poinciana, this warm-climate bush has bright orange or red flowers, not the bird of
  the same name and not the South African plant with stalks of orange and purplish-blue flowers.
examples:
- The bird of paradise had bright orange flowers.
- The bird of paradise showed red flowers on its bush.
