schema: oewn-learning-gloss-v2
senseId: 'incongruity%1:07:00::'
synsetId: 04722123-n
simpleMeaning: The quality of not fitting together, so that a thing is out of place or not right for its
  use.
scope: The quality of a thing that does not fit or agree with what is around it, being wrong for its place.
examples:
- The incongruity of a beach umbrella in the snow made us laugh.
- There was an incongruity between the grand hall and the cheap plastic chairs.
