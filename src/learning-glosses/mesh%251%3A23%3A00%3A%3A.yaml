simpleMeaning: a number that tells how fine a screen is, by counting its holes in each inch, and so tells
  how small the bits are that can pass through
scope: A number used to size a screen and the bits that go through it, not the open cloth itself and not
  the way a computer network is wired.
examples:
- The lab ordered a 100 mesh screen for the fine powder.
- The 100 mesh powdered cellulose passed through the fine mesh screen.
