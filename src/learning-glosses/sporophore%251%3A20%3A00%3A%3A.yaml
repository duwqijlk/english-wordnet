simpleMeaning: A branch or organ that produces spores — the part of a plant body that develops them; in
  ferns, mosses and liverworts it is practically the whole spore-producing plant.
scope: The spore-bearing structure of a plant; not the spore case itself (a sporangium), and not the spores.
  In ferns, mosses and liverworts it is practically the whole spore-producing plant.
examples:
- In mosses the sporophore is practically the whole spore-producing plant.
- The botanist examined the sporophore under a lens to see where the spores formed.
