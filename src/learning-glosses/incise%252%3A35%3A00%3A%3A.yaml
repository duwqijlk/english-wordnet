simpleMeaning: By carving or cutting, to make a cut into something
scope: Making a cut into something by carving or cutting it. It is not just drawing a line on the surface,
  and not the word for a surface that already has deep marks in it.
examples:
- The artist incised the design into the metal plate.
- He incised a deep line in the wood with a sharp tool.
