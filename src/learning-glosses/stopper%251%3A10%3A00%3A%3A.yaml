senseId: 'stopper%1:10:00::'
synsetId: 06905397-n
simpleMeaning: An act in a show that moves the crowd so much the show must pause until the crowd falls
  quiet
scope: An act in a show so fine or so strong that the show has to wait until the crowd stops cheering,
  not a thing that fills a hole and not a remark that leaves no reply.
examples:
- Her song was a real stopper, and the crowd cheered for minutes.
- The stopper brought the whole hall to its feet.
