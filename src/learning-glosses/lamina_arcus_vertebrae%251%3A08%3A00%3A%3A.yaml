senseId: 'lamina_arcus_vertebrae%1:08:00::'
synsetId: 05588792-n
simpleMeaning: A bony point at the back sticks out from the flat back part of the ring of bone round a
  backbone joint.
scope: The flat back plate of a backbone's bony arch, not the whole arch and not the bony point itself.
examples:
- The lamina arcus vertebrae forms the flat back part of the vertebral arch.
- The spinous process extends from the lamina arcus vertebrae.
