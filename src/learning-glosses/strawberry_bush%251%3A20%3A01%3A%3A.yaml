simpleMeaning: From New York to Florida and Texas, in the east of the United States, an upright plant
  with deep red pods and seeds loses its leaves in winter.
scope: People also call it wahoo, and it is an upright plant of the east of the United States, with deep
  red pods and seeds, not the hardy shrub with scented wood and sweet-smelling red-brown flowers.
examples:
- A strawberry bush grew by the path.
- The strawberry bush lost its leaves.
