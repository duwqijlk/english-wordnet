  wish spreads from person to person
scope: A strong wish to get rich from a sudden rush for the yellow metal, a wish that spreads from person
  to person, not a real sickness and not the sudden event itself.
examples:
- Gold fever swept the town after the first nugget was found.
- He caught gold fever and sold his farm to join the diggers.
