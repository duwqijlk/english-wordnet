simpleMeaning: In a written work, play, or film, a move back to an earlier event or scene that breaks
  the normal order of the story in time
scope: This is a move back in time in a written work, play, or film, not a sudden strong memory of a past
  experience in real life.
examples:
- The film uses a flashback to show the hero as a child.
- A flashback in the novel shows how the two friends first met.
