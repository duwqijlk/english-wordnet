simpleMeaning: to cover soil with a layer of rotting plant matter, such as dead leaves
scope: This is the act of covering soil with rotting plant matter, not the rotting plant matter itself.
examples:
- They mulch the flower beds in the fall to keep the soil wet.
- He mulched around the young trees with dead leaves.
