simpleMeaning: a pale yellow fatty liquid pressed out of nuts, made from mild or bitter kinds
scope: This is a pale yellow fatty liquid pressed from nuts; almond oil and expressed almond oil are other
  names for this sense. Not a cooking oil made from other seeds and not a solid fat.
examples:
- She rubbed sweet almond oil into her dry hands.
- The recipe calls for a spoonful of sweet almond oil.
