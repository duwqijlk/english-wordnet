simpleMeaning: Green-and-purple flowers shaped like small cups grow on this plant of northwestern America.
scope: Also called rice-grain fritillary, it is the northwestern plant with green-and-purple cup-shaped
  flowers, not the southwestern plant with dark purple flowers mottled with green.
examples:
- The mission bells were in flower when we saw them.
- He could tell the mission bells by their green-and-purple flowers.
