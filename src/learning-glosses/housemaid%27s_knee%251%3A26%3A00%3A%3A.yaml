simpleMeaning: Swelling of the small sac of fluid in the joint in the middle of the leg, caused by a blow
  or by pressing on the joint again and again
scope: This is a swelling of the fluid sac in the joint in the middle of the leg, not a broken bone and
  not a swelling caused by illness in the blood.
examples:
- Her housemaid's knee swelled after hours of scrubbing floors.
- The housemaid's knee was sore and puffed up.
