simpleMeaning: Teeth bite and grind food in the mouth until it is broken down
scope: Also called chew, jaw and masticate, this is the act of biting and grinding food with the teeth,
  not the act of swallowing it and not the act of tasting it.
examples:
- He manducated his steak slowly at the table.
- She manducated the tough bread with care.
