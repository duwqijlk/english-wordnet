simpleMeaning: a thousand grams, the main unit for measuring mass, the amount of matter in a thing, in
  the world system of measures
scope: A thousand grams, the main unit of mass; kilo is another name for this sense, not a pound and not
  a gram on its own.
examples:
- A kilogram is about 2.2 pounds.
- The bag of flour weighs two kilograms.
