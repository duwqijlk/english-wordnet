simpleMeaning: A pipe in an organ that makes its sound when air passes over the sharp edge of a narrow
  opening or lip.
scope: An organ pipe, also called a flue pipe or labial pipe, not the flat blade on the arm of an anchor.
examples:
- The organ builder tuned the flue by hand.
- Air passed across the flue and the note sounded.
