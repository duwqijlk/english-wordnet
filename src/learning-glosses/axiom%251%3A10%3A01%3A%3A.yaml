senseId: 'axiom%1:10:01::'
synsetId: 06766264-n
simpleMeaning: In logic, a statement that cannot be shown to be true or shown to be false, and that people
  take as true because it seems clearly true
scope: A starting statement in logic that people accept without proof. Not a rule that has been proved
  and not a guess about everyday life.
examples:
- In logic, 'nothing can be both true and false at the same time' is treated as an axiom.
- The teacher said an axiom is taken as true without proof.
