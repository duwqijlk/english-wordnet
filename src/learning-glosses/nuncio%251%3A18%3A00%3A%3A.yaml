simpleMeaning: In the Roman Catholic Church, a person sent by the Pope to another country to speak for
  him, with the standing of an ambassador
scope: In the Roman Catholic Church, a person sent by the Pope to another country to speak for him; also
  called papal nuncio, not a local priest and not a government ambassador.
examples:
- The nuncio met the president to speak for the Pope.
- A nuncio holds the standing of an ambassador.
