simpleMeaning: A great sea animal with flat plates along its upper jaw for sifting tiny sea life from
  the sea.
scope: A great sea animal with flat plates along its upper jaw; baleen whale is another name for this
  sense, not a toothed sea animal and not a shark.
examples:
- The whalebone whale sifts tiny sea life from the sea with its plates.
- A whalebone whale swam past the boat, its great back showing.
