schema: oewn-learning-gloss-v2
senseId: 'hesitate%2:42:00::'
synsetId: 02646524-v
simpleMeaning: to wait before acting because you are unsure or do not want to
scope: This is holding back from uncertainty or reluctance, not a brief stop-and-go pause nor a flat refusal;
  waver and waffle are other names for it.
examples:
- She hesitated before signing, unsure whether the terms were fair.
- Don't hesitate to call if you need help.
