simpleMeaning: Any of a set of small round bits of body tissue in the walls of the gut, near where the
  small gut meets the large gut.
scope: Also called Peyer's patch; one of the small round bits of body tissue in the gut wall, set apart
  from other gut tissue by its place near the meeting of the small and large gut.
examples:
- The doctor pointed to a Peter's gland in the wall of the gut.
- Peter's glands sit near the end of the small intestine.
