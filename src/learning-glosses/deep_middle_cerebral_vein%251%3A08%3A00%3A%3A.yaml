simpleMeaning: In a groove far inside, this blood tube drains into the basal tube after running beside
  the artery across the side of the brain.
scope: This blood tube runs deep in a groove of the brain, not near the brain's surface.
examples:
- The deep middle cerebral vein runs beside the artery across the side of the brain.
- The deep middle cerebral vein drains into the basal vein.
