simpleMeaning: to watch a person or place closely over a period, usually to gather information.
scope: This is not asking people a set of questions for a study, and not looking over an area once from
  a high place.
examples:
- Police surveyed the building from a van across the street.
- Agents surveyed his movements for several weeks.
