simpleMeaning: a fish of about middle size that lives in warm seas, is caught for food, and makes low
  short sounds when it is caught
scope: This is the fish, not a soldier or worker with a low rank, not the short low noise itself, and
  not the act of making that noise.
examples:
- The fisherman pulled up a grunt from the warm water.
- Grunts live in warm seas and are caught for food.
