simpleMeaning: The outer sex parts of a person are of one sex and the inner sex organs of the other sex,
  a state present from birth.
scope: It is a state present from birth, not one that comes on later in life, in which the outer sex parts
  and the inner sex organs are of different sexes.
examples:
- The baby was born with outer parts of one sex and inner organs of the other, a state called pseudohermaphroditism.
- The child was born with pseudohermaphroditism.
