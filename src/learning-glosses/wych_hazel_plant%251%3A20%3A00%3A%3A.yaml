simpleMeaning: The bark of one of several bushes or trees of the group Hamamelis gives a lotion that makes
  skin feel tight
scope: Witch hazel, witch hazel plant and wych hazel are other names for this bush or tree, whose bark
  gives the lotion rather than the lotion itself.
examples:
- Bark from wych hazel plant gives a lotion that makes the skin feel tight.
- The bark of wych hazel plant makes a lotion that tightens the skin.
