synsetId: 01365271-v
simpleMeaning: to put a hard case around a broken part of the body to keep it still while it gets better
scope: Putting a hard case on a broken arm or leg; not covering a wall with a wet mixture that turns hard,
  and not putting a soft dressing on skin.
examples:
- The doctor plastered his broken arm.
- They will plaster the child's leg to keep the broken bone still.
