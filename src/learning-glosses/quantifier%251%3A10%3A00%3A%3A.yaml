simpleMeaning: In grammar, a word that says how much or how many, like 'fifteen' or 'many'
scope: A word that says how much or how many, not the logic sense of a word like 'some' or 'all' that
  binds the parts of a claim.
examples:
- The quantifier 'many' in the sentence showed there were a lot of apples.
- In the phrase 'fifteen books', the quantifier is 'fifteen'.
