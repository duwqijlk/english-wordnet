simpleMeaning: In cosmology, the cooled remains of the hot big bang that fill all of space and can still
  be seen today, at about 2.725 kelvin on average.
scope: In cosmology, the cooled remains of the hot big bang that fill all of space and can still be seen
  today; cosmic background radiation, cosmic microwave background, cosmic microwave background radiation,
  CMB and CMBR are other names for this sense.
examples:
- The CBR fills all of space.
- Scientists measure the CBR to learn about the big bang.
