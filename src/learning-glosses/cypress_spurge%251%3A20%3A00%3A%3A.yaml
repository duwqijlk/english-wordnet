simpleMeaning: A plant from the Old World that lives for many years, with leaves like those of an evergreen
  tree, now grown wild as a weed in the United States.
scope: This is a long-lived Old World plant with leaves like those of an evergreen tree, not the evergreen
  tree itself or a garden shrub grown for its flowers.
examples:
- Cypress spurge grows wild along the roadside here.
- The gardener pulled out the cypress spurge before it spread.
