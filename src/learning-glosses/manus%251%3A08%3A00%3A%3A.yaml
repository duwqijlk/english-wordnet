simpleMeaning: The end of the upper limb that can grip and hold things.
scope: Also called the hand, the paw, and the mitt, this is the end of the arm that can grip and hold
  things, not the foot and not the whole arm.
examples:
- The surgeon scrubbed his manus before the operation.
- He extended his manus to greet the visitor.
