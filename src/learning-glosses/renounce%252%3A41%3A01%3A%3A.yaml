simpleMeaning: to give up power, as kings and emperors do, or to give up duties and other things you must
  do
scope: 'Also called abdicate: to give up power or duties, not just to say no to something or to stop using
  it.'
examples:
- The king renounced his power and left the palace.
- She renounced her duties as head of the group.
