simpleMeaning: to write your name at the marked place on a document.
scope: This is not a hand movement that sends a message, a public notice on a wall, or a clue that something
  has happened; it is only the act of adding your name.
examples:
- Please sign the form at the bottom and return it to the desk.
- The author signed each copy of her book.
