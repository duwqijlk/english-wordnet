simpleMeaning: A sound made in speech by breathing in, so the air moves in through the mouth or nose
scope: A speech sound made by breathing air in through the mouth or nose; not a sound made by breathing
  air out.
examples:
- The linguist noted an ingressive in the speaker's dialect.
- An ingressive is made when the speaker draws air in while speaking.
