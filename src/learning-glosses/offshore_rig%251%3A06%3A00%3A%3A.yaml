simpleMeaning: Many oil wells can be bored out in all directions from this drilling frame out at sea,
  on a base that floats or stands on the sea bed.
scope: It is also called drilling platform, a drilling frame out at sea on a base that floats or stands
  on the sea bed.
examples:
- The offshore rig worked far from land.
- The offshore rig floated on the sea.
