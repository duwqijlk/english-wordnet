  and skin sores full of pus that crust over, drop off, and leave scars
scope: 'Also called smallpox and variola: a very catching viral sickness with pus-filled skin sores, not
  chickenpox and not measles.'
examples:
- Variola major spread from person to person through the whole town.
- The scars left by variola major marked her face for life.
