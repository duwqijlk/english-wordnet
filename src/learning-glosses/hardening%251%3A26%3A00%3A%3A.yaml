simpleMeaning: when body tissue becomes harder or thicker in a way that is not normal
scope: A health problem in body tissue; not the act of making a thing harder, and not a thing becoming
  hard as it cools or dries.
examples:
- Hardening of the arteries can make blood flow more slowly.
- The doctor found hardening in the tissue around the joint.
