simpleMeaning: tough wiry stems and purple flowers mark this weedy plant that lives for years; it comes
  from Europe but now grows wild in many other lands
scope: Also called hardheads and lesser knapweed; a weedy plant of Europe with tough stems and purple
  flowers, now growing wild in many other lands, not a thistle and not a daisy.
examples:
- Black knapweed lines the field edge with purple flowers.
- The black knapweed has spread far beyond Europe.
