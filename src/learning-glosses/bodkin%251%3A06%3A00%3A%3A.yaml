simpleMeaning: A needle with a blunt end, used to pull ribbon through loops.
scope: A blunt needle for pulling ribbon through loops, not a small sharp-pointed tool for punching holes
  in leather or cloth, not a long hairpin, usually with a pretty head, and not a dagger with a thin blade.
examples:
- She used a bodkin to thread the ribbon through the loops of the dress.
- The bodkin slipped through the hem, drawing the ribbon after it.
