senseId: 'resolving_power%1:19:00::'
synsetId: 11526187-n
simpleMeaning: how well a tool for seeing tiny or far things can tell two things that are very close together
  apart and say how far apart they seem
scope: 'Also called resolution: how well a lens tool can tell two close things apart, not how big a thing
  looks and not how bright a picture is.'
examples:
- The resolving power of the new telescope let us see the two stars as two, not one.
- A microscope with high resolving power can show two tiny dots as separate.
