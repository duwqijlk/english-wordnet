simpleMeaning: a soft food that other food is dipped into, made by crushing avocado and mixing it with
  cut onions and other things that add taste
scope: A dip made from avocado, not a thin sauce poured over food and not a whole avocado on its own.
examples:
- She dipped the chip into the guacamole.
- He made fresh guacamole with avocado and onion for the party.
