simpleMeaning: equipment that uses electricity to take in radio or television signals, or to send them
  out
scope: Equipment that uses electricity to take in radio or television signals, or to send them out, not
  the feelers on an insect's head and not a keen sense for what is going on.
examples:
- The antenna on the roof picks up television signals.
- He fixed the antenna so the radio would come in clear.
