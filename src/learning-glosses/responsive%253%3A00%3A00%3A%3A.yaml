simpleMeaning: quick to react or reply to people, events, or things that act on you, and showing feeling
scope: This sense is about a person who is quick to react or reply and shows feeling, not the sense where
  replies are used in turn, one after the other.
examples:
- The teacher was responsive to the children's questions and smiled at their jokes.
- He is a responsive baby who laughs when you talk to him.
