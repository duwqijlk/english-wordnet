senseId: 'standby%1:18:00::'
synsetId: 10756760-n
simpleMeaning: an actor who can take the place of the usual actor if there is a need
scope: 'Also called understudy: this sense is an actor ready to take another actor''s place, not a thing
  kept ready to use if it is needed.'
examples:
- The standby was ready to go on stage if the lead actor fell ill.
- As the standby, she learned all the lines but did not play the part that night.
