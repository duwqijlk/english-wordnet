simpleMeaning: a hard outer coat, most often copper, covers a bullet made of lead
scope: A lead bullet with a hard coat around it, not a bare lead bullet and not a bullet made all the
  way through of hard metal.
examples:
- The soldier loaded full metal jacket rounds into his rifle.
- A full metal jacket round keeps its shape better than a bare lead bullet.
