simpleMeaning: New life starts when male and female sex cells join, as sperm and eggs in an animal or
  pollen and ovule (the part that makes a seed) in a plant
scope: The start of new life when male and female sex cells join; fertilization, fertilisation and impregnation
  are other names for this sense, not the growth of the young after it starts.
examples:
- Fecundation takes place when the male and female cells join.
- In plants, fecundation follows the meeting of pollen and the part that makes a seed.
