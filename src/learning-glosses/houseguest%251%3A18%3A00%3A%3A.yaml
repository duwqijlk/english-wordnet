simpleMeaning: a person who comes to your home as a guest and is welcomed and looked after there
scope: This is a person welcomed in someone's home, not the person who lives there and welcomes them,
  and not a guest in a hotel.
examples:
- Our houseguest slept in the small room upstairs.
- We cooked a special dinner for our houseguest.
