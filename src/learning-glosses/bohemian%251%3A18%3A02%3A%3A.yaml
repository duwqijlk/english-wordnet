simpleMeaning: A member of a dark-skinned people who speak Romany and traditionally live by seasonal work
  and telling fortunes; thought to come from north India and now live on all continents.
scope: Not a native of Bohemia; also called Gypsy, Gipsy, Roma, Romani, Romany and Rommany.
examples:
- Bohemians live in Europe, North Africa and North America.
- Many Bohemians speak Romany at home.
