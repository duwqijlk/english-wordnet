simpleMeaning: A small electric push in one place carries the bits of a drug into the flesh, to treat
  a sick part of the body
scope: A small electric push in one place that carries the bits of a drug into the flesh; also called
  electromotive drug administration, ionic medication or iontotherapy; not a drug taken by mouth and not
  a treatment with no electric push.
examples:
- Iontophoresis brought the drug into the sore wrist.
- The nurse used iontophoresis on the swollen knee.
