simpleMeaning: to do something rude in front of other people, to do something wrong, or to make a big
  mistake
scope: 'Also called sin, blunder, and boob: this is doing a rude or wrong thing or making a big mistake.'
examples:
- I goofed during the job interview and gave the wrong name.
- He goofed by calling his teacher by the wrong name in front of the whole class.
