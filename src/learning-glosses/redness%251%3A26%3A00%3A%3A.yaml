simpleMeaning: a reaction in body tissue (the material that the body is made of) to harm or irritation,
  shown by pain, swelling, a red colour and heat
scope: 'Also called inflammation: a reaction in the body to harm, not just the red colour of something.'
examples:
- The redness around the cut came with pain, swelling and heat.
- The redness on his knee was hot and painful after he fell.
