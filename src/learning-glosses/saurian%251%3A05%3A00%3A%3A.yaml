simpleMeaning: The group Sauria holds lizards and other creeping animals, and any one of them is this;
  older groupings also held crocodiles and dinosaurs in it.
scope: Any creeping animal of the group Sauria may be called this, and the name is not for lizards alone.
examples:
- A saurian moved slowly over the ground.
- The saurian lay still in the grass.
