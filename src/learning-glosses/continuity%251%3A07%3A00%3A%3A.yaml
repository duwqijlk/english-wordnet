schema: oewn-learning-gloss-v2
senseId: 'continuity%1:07:00::'
synsetId: 05061281-n
simpleMeaning: the way a stretch of time goes on without a break and stays joined as one whole
scope: This is time going on without a break as one whole stretch. It is not the detailed written plan
  used when making a film.
examples:
- There was no break in the continuity of the meeting; it went on for three hours.
- She valued the continuity of her work, with each day following on from the last.
