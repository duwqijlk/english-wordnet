simpleMeaning: A mass of germ-fighting soft tissue in the throat behind the small piece of flesh that
  hangs down, on the back wall and roof of the nose passage.
scope: A mass of soft tissue in the back of the throat, also called adenoid, pharyngeal tonsil, third
  tonsil, tonsilla adenoidea and tonsilla pharyngealis; not a sore throat and not a swollen gland of the
  neck.
examples:
- Luschka's tonsil can grow large in children and block the nose.
- Doctors removed the boy's Luschka's tonsil when he could not breathe well.
