simpleMeaning: An upright hairy herb native to southeastern Asia but widely grown for its large shiny
  fruit, which is commonly eaten as a vegetable.
scope: The plant grown for its fruit, not the fruit on its own, and nothing to do with a hen's egg.
examples:
- The garden egg is grown widely across West Africa.
- Garden egg plants need full sun and regular watering.
