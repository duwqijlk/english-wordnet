simpleMeaning: In medicine, a set plan for treating a person, often including what they should eat
scope: 'Also called regime: this is a medical plan for treatment, often with rules about food; it is not
  a government or the people in power in a country.'
examples:
- The doctor put him on a strict regimen of exercise and low-salt food.
- Her regimen includes medicine each morning and a special diet.
