simpleMeaning: In search of new and exciting things to do, a man in armour goes from place to place
scope: A man in armour who goes from place to place in search of new and exciting things to do, not a
  soldier who stays with an army and not a lord who lives in a castle.
examples:
- The knight-errant rode into the village at dusk.
- In the old tale, a knight-errant set out to rescue the captive.
