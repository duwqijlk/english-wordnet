senseId: 'palpably%4:02:00::'
synsetId: 00162619-r
simpleMeaning: in a way that is clear and easy to feel or notice
scope: In a way that everyone can feel or notice clearly; not in a small, hidden or hard-to-see way.
examples:
- The room was palpably tense after the bad news was read out.
- She was palpably relieved when she heard that the test was over.
