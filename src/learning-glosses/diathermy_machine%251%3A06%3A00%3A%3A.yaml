simpleMeaning: A medical tool that warms one part of the body to treat it
scope: This is a medical tool that warms one part of the body to treat it, not a tool that warms the whole
  body and not a lamp that warms the skin from outside.
examples:
- The doctor used a diathermy machine on her sore knee.
- A diathermy machine warmed the deep tissues of his shoulder.
