simpleMeaning: The end of a magnet that turns toward the Arctic when the magnet hangs free
scope: The end of a magnet that turns toward the north; not the end that turns the other way, and not
  the north end of the earth.
examples:
- The north-seeking pole of the magnet swung round to face north.
- Hang the magnet free and the north-seeking pole will point north.
