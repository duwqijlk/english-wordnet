simpleMeaning: Most often with icing on top, this sweet food has flat pieces held together by a sweet
  spread between them
scope: A sweet food of stacked flat pieces with a sweet spread between them, most often with icing on
  top, not a single flat sponge and not a pie.
examples:
- She baked a layer cake for her daughter's birthday.
- The layer cake had jam between its layers and icing on top.
