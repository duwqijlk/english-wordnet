simpleMeaning: shiny pale grey in colour, or covered with or touched a little by that pale grey colour
scope: 'Also called silver: this is about a pale, shiny grey colour, not a bright white shine and not
  a soft, sweet sound.'
examples:
- Her silvery hair shone in the light.
- The silvery paint gave the old chair a pale grey shine.
