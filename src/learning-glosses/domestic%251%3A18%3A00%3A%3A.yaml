simpleMeaning: a paid household worker who does cleaning, cooking, and other routine chores.
scope: This is a paid worker in a household, not a member of the family and not an animal kept at home.
examples:
- She worked as a domestic for a wealthy family in the city.
- In the 19th century, wealthy households often employed several domestics.
