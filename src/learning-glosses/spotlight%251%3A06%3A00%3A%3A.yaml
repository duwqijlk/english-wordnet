simpleMeaning: a lamp used on a stage to throw a strong beam of light onto one small area, so everyone
  looks at the performer there
scope: A lamp used on a stage to throw a strong beam onto one small area, also called spot; not the act
  of lighting someone with it, and not the act of bringing someone forward.
examples:
- A single spotlight picked out the singer on the dark stage.
- The spotlight followed the dancer as she crossed the stage.
