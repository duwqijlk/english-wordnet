simpleMeaning: a drug that fights one kind of virus, retroviruses, by stopping the tool they use to copy
  their code, such as the virus that causes AIDS
scope: Not a drug that kills the virus outright, and not a cure for the illness; a drug that blocks one
  step the virus needs.
examples:
- Doctors gave her a reverse transcriptase inhibitor as part of the treatment.
- A reverse transcriptase inhibitor slows the virus down.
