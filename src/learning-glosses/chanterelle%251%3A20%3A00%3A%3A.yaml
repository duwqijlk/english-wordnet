simpleMeaning: A deep yellow mushroom found in many places, safe to eat, with a smooth top and a sweet
  smell like apricots.
scope: 'Also called chantarelle: a yellow mushroom with a smooth top, not a pale or white one and not
  one with a rough cap.'
examples:
- We picked chanterelles in the woods after the rain.
- The chanterelle had a smooth yellow cap and smelled faintly of apricots.
