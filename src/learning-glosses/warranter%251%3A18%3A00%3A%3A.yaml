simpleMeaning: a person who gives another person a promise that backs something up
scope: A person who gives another person a promise that backs something up, also called a guarantor and
  a warrantor; not the person who receives such a promise.
examples:
- The warranter signed the promise to repair the roof.
- As warranter, she stood behind the sale.
