simpleMeaning: Shaped like the letter U, this bone lies under the tongue and bears the weight of the muscles
  that move it.
scope: This is the U-shaped bone that bears the tongue muscles, also called hyoid and os hyoideum.
examples:
- The hyoid bone lies under the tongue.
- The tongue muscles rest on the hyoid bone.
