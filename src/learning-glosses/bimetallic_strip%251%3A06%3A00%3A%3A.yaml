simpleMeaning: A thin flat piece made of two metals that bends as it gets warmer.
scope: A thin flat piece of two metals that bends as it gets warmer; not a wire and not a spring.
examples:
- The bimetallic strip bent as the room warmed up.
- A bimetallic strip in the switch moved when the heat rose.
