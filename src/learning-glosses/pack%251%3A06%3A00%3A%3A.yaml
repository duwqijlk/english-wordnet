simpleMeaning: A small sealed container or wrapped bundle of goods sold together, such as cigarettes or
  film.
scope: This is a small unit of goods for sale, not a group of animals and not a bag carried on the back.
examples:
- He bought a pack of cigarettes at the station.
- She took a pack of film out of her bag.
