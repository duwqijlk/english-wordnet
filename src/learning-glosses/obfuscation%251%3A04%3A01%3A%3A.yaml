simpleMeaning: Making a thing hard to see, by darkening it or hiding it from sight.
scope: Making a thing hard to see, not the act of clouding people's minds so that they are left puzzled.
examples:
- The obfuscation of the sign made it hard to read.
- Smoke caused an obfuscation of the view.
