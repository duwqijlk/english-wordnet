simpleMeaning: In economics, a market where a few makers hold the supply of a good, and each one can move
  prices and change what rivals can do.
scope: In economics, a market where a few makers hold the supply of a good; not a market where one maker
  holds it all and not a market where many small makers sell.
examples:
- The oligopoly kept prices high.
- A few big makers formed an oligopoly.
