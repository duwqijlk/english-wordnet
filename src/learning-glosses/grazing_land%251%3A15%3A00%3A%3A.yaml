simpleMeaning: A field with grass and other green plants where farm animals can feed
scope: This is a field where farm animals can feed; lea, ley, pasture, pastureland and pasture land are
  other names for it, not a field for crops and not a bare field.
examples:
- Cows stood in the grazing land all afternoon.
- The farmer kept the grazing land for his sheep.
