simpleMeaning: To make a thing soft and easy to chew, by soaking it, beating it, or putting a softening
  powder on it
scope: Making a thing soft and easy to chew, not a kind or loving person, and not a formal offer to buy
  at a set price.
examples:
- Tenderize the meat before you grill it.
- She tendered the beef by soaking it in wine overnight.
