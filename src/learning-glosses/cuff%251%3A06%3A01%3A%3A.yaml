simpleMeaning: a metal ring that can be locked around the wrist, usually used in pairs
scope: This sense is also called handcuff; it is a metal ring for the wrist, not the folded end of a sleeve
  or trouser leg and not the act of holding a person.
examples:
- The officer locked a cuff around each of the man's wrists.
- The cuffs were made of strong metal.
