simpleMeaning: having no new ideas, no way that is its own, and not done or made freely in the moment
scope: Stereotypical and stereotyped are other names for this sense. This is about words or acts that
  are not new, not different in their own way, and not done freely at the moment. Not the sense about
  a person who cannot think of new things.
examples:
- He sent an unimaginative card with the same words everyone else uses.
- Even his angry words were unimaginative and sounded copied from others.
