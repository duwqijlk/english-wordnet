simpleMeaning: New flowers form near the middle of a flower head, like a sunflower's, with the oldest
  flowers at the edge and the youngest in the middle
scope: Flower growth toward the middle, oldest at the edge, not growth outward from the middle and not
  mere movement toward the middle.
examples:
- The sunflower's inward-developing florets open from the edge toward the middle.
- In an inward-developing flower head, the youngest blooms sit in the center.
