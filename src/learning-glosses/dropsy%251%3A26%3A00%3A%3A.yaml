simpleMeaning: Too much watery fluid builds up in cells, tissues, or the body's hollow spaces, and the
  part swells
scope: It is also called edema, hydrops, and oedema, a swelling from too much watery fluid building up
  in the body's cells, tissues, or hollow spaces.
examples:
- Too much watery fluid had built up, and the dropsy made the tissues swell.
- The dropsy was caused by watery fluid building up in the cells.
