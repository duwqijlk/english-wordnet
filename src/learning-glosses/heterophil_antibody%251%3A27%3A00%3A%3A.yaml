simpleMeaning: The blood of a person with a disease that brings fever and great tiredness holds a bit
  of the body's defence
scope: A part of the body's defence, also called heterophile antibody, found in the blood of a person
  with this gland illness, not a part of the body's defence in general.
examples:
- The test found heterophil antibody in her blood, a sign of the gland illness.
- Doctors look for heterophil antibody when they think a patient has infectious mononucleosis.
