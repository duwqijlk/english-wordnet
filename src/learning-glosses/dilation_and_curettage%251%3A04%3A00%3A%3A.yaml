simpleMeaning: A scrape of the womb's lining after the cervix is widened, often with local pain relief,
  to sample tissue, halt bleeding, remove growths, clear leftover placenta, or end a pregnancy.
scope: This is the womb-scraping operation, not an imaging test or removal of the whole womb; 'dilatation
  and curettage' names the same procedure.
examples:
- A dilation and curettage was scheduled for the following morning.
- The tissue was removed by dilation and curettage.
