simpleMeaning: A person who kills wild animals that hunt other animals, in order to earn the reward paid
  for them
scope: A person who kills wild animals that hunt other animals, in order to earn the reward paid for them;
  not a hunter who hunts for food and not a person who catches animals alive.
examples:
- The bounty hunter tracked the wolf for three days.
- A bounty hunter is paid for each animal he kills.
