simpleMeaning: to make a drawing with lines and simple shapes that shows how a thing is put together,
  or how its parts act on each other
scope: 'Also called plot: to draw how a thing is built or how its parts act on each other, not the noun
  for the drawing itself.'
examples:
- She diagrammed the flow of water through the plant.
- He diagrammed how the new bridge would be built.
