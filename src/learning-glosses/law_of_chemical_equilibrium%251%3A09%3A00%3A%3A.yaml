simpleMeaning: In chemistry, once a change that can run both ways has settled, its forward speed over
  its backward speed stays the same.
scope: People also call it equilibrium law, the rule that the forward speed over the backward speed stays
  the same once a change that can run both ways has settled.
examples:
- The law of chemical equilibrium tells us the ratio stays fixed once the reaction settles.
- By the law of chemical equilibrium, the forward and backward speeds keep a fixed ratio.
