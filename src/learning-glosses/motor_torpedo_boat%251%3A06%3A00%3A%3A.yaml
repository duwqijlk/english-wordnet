simpleMeaning: A small fast craft, light on guns and with no armour, it patrols the seas and fires underwater
  missiles.
scope: It is also called a mosquito boat and a mosquito craft, and among small fast boats it is the lightly
  armed one with no armour, used to patrol and to fire torpedoes.
examples:
- The motor torpedo boat sped across the water.
- Motor torpedo boats patrolled the coast.
