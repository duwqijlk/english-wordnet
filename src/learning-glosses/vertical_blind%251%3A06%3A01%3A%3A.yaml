simpleMeaning: Thin strips hang down in front of a window and turn as a group to close with a slight overlap
  and block the window.
scope: This window cover is made of thin strips that hang down and turn together to close with a slight
  overlap, unlike the kind with flat strips that lie across the window.
examples:
- The vertical blind hung in thin strips in front of the window.
- Turning the vertical blind closed the thin strips over the window.
