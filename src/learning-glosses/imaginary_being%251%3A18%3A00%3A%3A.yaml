senseId: 'imaginary_being%1:18:00::'
synsetId: 09506868-n
simpleMeaning: a creature made up in the mind, a person who lives only in old stories, myths, or made-up
  tales
scope: A creature that lives only in stories; imaginary creature is another name for this sense, not a
  real living thing and not a character in a true story.
examples:
- The dragon is an imaginary being from old tales.
- Children love to hear about the imaginary being who guards the forest.
