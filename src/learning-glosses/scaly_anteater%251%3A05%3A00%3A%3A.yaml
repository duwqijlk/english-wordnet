simpleMeaning: a mammal of southern Africa and Asia with no teeth, its body covered in hard scales and
  a long nose for eating ants and termites
scope: A toothless mammal with a scaly body and a long snout for eating ants and termites, not a mammal
  that eats plants; anteater and pangolin are other names for this sense.
examples:
- The scaly anteater curled up when the dogs came near.
- A scaly anteater uses its long snout to lick up termites.
