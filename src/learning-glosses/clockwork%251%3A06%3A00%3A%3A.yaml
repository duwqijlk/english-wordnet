simpleMeaning: a set of wheels that fit together and are made to move by a spring wound up tight, like
  the parts inside a clock
scope: The turning parts inside a machine, not a clock itself and not the idea of something working in
  a set, exact way.
examples:
- The clockwork inside the old toy train still turns when you wind it up.
- He opened the back to show us the clockwork that makes the hands move.
