simpleMeaning: To put a hard face of stone or other hard material on a bank or wall, so it holds firm.
scope: This is to put a hard face on a bank or wall, not to dig it out or pull it down.
examples:
- Workers revet the river bank with stone.
- They revet the slope to stop it sliding.
