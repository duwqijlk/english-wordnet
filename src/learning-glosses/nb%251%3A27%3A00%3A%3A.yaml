simpleMeaning: A soft grey metal that bends and draws out, used in mixes with other metals; it comes from
  niobite and was once called columbium.
scope: This is a metal, not a steel; also called atomic number 41 and niobium.
examples:
- Nb is a soft grey metal used in mixes.
- Nb was once called columbium.
