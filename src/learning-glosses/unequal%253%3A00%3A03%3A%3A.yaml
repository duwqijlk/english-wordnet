schema: oewn-learning-gloss-v2
senseId: 'unequal%3:00:03::'
synsetId: 00051936-a
simpleMeaning: not having the skill, strength, or things needed to do a task
scope: 'Also called inadequate: not able to do a task because the skill or things needed are missing.
  It is not the sense that means not the same in size, amount, or value.'
examples:
- She felt unequal to the task of running the whole office alone.
- The small team was unequal to the heavy work that winter.
