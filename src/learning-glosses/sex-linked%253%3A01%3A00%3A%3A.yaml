simpleMeaning: of traits fixed by genes on the X chromosome in particular, the chromosomes that fix whether
  a child is male or female
scope: These are traits fixed by genes on the chromosomes that fix whether a child is male or female,
  not traits fixed by genes on other chromosomes.
examples:
- The sex-linked trait passed down through the X chromosome.
- Sex-linked traits run on the X chromosome.
