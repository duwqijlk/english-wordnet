simpleMeaning: A rare birth disorder tied to missing gene material in chromosome 7, with low learning,
  slow growth, and elfin faces, yet very friendly and with a remarkable gift for words.
scope: Not Down syndrome or Fragile X, other disorders present from birth.
examples:
- Williams syndrome gives children elfin faces and a gift for words.
- The little girl with Williams syndrome chatted with everyone.
