simpleMeaning: to make someone's way of living bad and wrong, through drink with no limit or through body
  pleasures with no control
scope: 'Also called corrupt, pervert, profane, demoralize, subvert, misdirect, deprave, debauch, demoralise,
  and vitiate: to make a person''s way of living bad and wrong. Not the sense about making a thing worse
  by mixing in a cheap or poor part.'
examples:
- Wine and wild living debased the young men in the town.
- He said the bad company had debased her and taken away her good values.
