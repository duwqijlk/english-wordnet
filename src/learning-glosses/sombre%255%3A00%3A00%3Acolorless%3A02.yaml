simpleMeaning: not bright and with little color, and dull to look at
scope: Also called sober, drab and somber. This is about a dull look with little color, not about being
  serious or sad in mood.
examples:
- He wore a sombre grey suit with a black tie.
- The room had sombre brown walls and heavy curtains.
