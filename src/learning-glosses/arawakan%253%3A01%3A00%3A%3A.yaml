simpleMeaning: Said of the peoples who speak the tongue of the Arawak, and of things that belong to them
scope: This word is used of the peoples who speak the tongue of the Arawak, not of the family of languages
  they speak and not of one member of the peoples.
examples:
- The Arawakan peoples speak a tongue of their own.
- She studies Arawakan history.
