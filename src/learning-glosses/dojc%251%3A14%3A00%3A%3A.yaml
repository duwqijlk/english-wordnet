simpleMeaning: In Canada, this office helps the government with its court cases and with legal advice.
scope: This is the office in Canada that gives the government legal advice and takes its cases to court;
  Department of Justice Canada is another name for it. Not the whole government, and not a private law
  office.
examples:
- The DoJC gave the minister advice before the case went to court.
- The DoJC took the government's case to court.
