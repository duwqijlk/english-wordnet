simpleMeaning: The belief in a slow change, by votes, from a system where rich owners hold the wealth
  to a system where the wealth is shared by all
scope: The belief in a slow change, by votes, from a system where rich owners hold the wealth to a system
  where the wealth is shared by all; not a sudden overthrow of the old order, and not rule by one party
  alone.
examples:
- Social democracy shaped the party's programme.
- He argued for social democracy as a slow path to change.
