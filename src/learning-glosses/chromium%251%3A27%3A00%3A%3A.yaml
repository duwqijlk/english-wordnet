simpleMeaning: A hard metal that breaks easily and can join with other atoms in more than one way, and
  resists rust and going dull
scope: Cr and atomic number 24 are other names for this sense; not steel and not any hard metal.
examples:
- Chromium keeps car parts bright and free of rust.
- A thin coat of chromium stops steel from rusting.
