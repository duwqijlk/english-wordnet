senseId: 'unintelligible%3:00:00::'
synsetId: 01340074-a
simpleMeaning: So badly spoken, or so covered by noise, that the words cannot be understood.
scope: Speech so badly spoken or so covered by noise that the words cannot be understood; not speech that
  is merely quiet or in another language.
examples:
- His unintelligible speech was lost in the roar of the crowd.
- The message came through as unintelligible noise.
