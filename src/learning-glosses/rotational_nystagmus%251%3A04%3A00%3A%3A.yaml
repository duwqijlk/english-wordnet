simpleMeaning: quick jerks of the eyes brought on by the body turning round fast; the large slow eye movements
  go the same way as the turn
scope: Quick jerks of the eyes brought on by the body turning round fast; not eye jerks caused by drink,
  and not simple dizziness.
examples:
- Rotational nystagmus followed the spin on the roundabout.
- The doctor watched for rotational nystagmus after the turning test.
