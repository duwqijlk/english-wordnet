simpleMeaning: Loss of hair, especially on the head, or of wool or feathers; in people it can come from
  family, hormone trouble, some ills, or drugs and cures, as cancer drugs.
scope: Of loss of hair on the head, or of wool or feathers, coming after a cure.
examples:
- Their alopecia thinned the hair.
- The alopecia came after the cure.
