senseId: 'divider%1:06:01::'
synsetId: 03220452-n
simpleMeaning: A drawing tool like a compass, used to split lines into equal parts or to move a measurement
  from one place to another
scope: A drawing tool sense; not a wall or other structure that separates rooms, and not a person who
  sorts living things into many groups.
examples:
- She used a divider to split the line into four equal parts.
- With a divider, he moved the measurement onto the new drawing.
