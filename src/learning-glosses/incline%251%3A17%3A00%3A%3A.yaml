simpleMeaning: a raised area of land formed by nature, such as the side of a hill
scope: 'Also called side and slope: a raised area of land, not a surface joining two levels and not the
  act of bending the head.'
examples:
- They climbed the steep incline on the side of the mountain.
- A small house was built on the incline of the hill.
