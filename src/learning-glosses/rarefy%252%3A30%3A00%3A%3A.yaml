simpleMeaning: to make a chemical substance thinner or weaker
scope: 'Also called attenuate: to make a chemical substance thinner or weaker, not making other things
  less thick or less solid.'
examples:
- Heat can rarefy the chemical substance in the glass tube.
- The worker rarefied the chemical substance in the tank to make it thinner.
