simpleMeaning: the date set for an election; in the United States it is the first Tuesday after the first
  Monday in November
scope: Also called election day, this is the date set for an election, not a date set for another kind
  of public vote.
examples:
- Polling day is when people in the United States vote in the election.
- The next polling day will be the first Tuesday after the first Monday in November.
