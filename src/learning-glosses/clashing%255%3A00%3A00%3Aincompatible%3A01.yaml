simpleMeaning: not agreeing or not going well together in a strong, sharp and unpleasant way
scope: About things that do not go well together, not about a fight or about hard things hitting each
  other and making a loud sound.
examples:
- Their clashing aims made it hard for the two groups to work together.
- She wore a pink top with clashing orange trousers.
