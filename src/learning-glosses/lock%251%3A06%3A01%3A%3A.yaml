simpleMeaning: A safety device built into a vehicle's ignition switch that stops anyone without the key
  from using the vehicle.
scope: Also called an ignition lock, this is the vehicle-ignition safety device, not the fastener on a
  door or drawer, the canal enclosure, or the wrestling hold.
examples:
- The ignition lock stopped him from driving off without the key.
- A thief tried to start the car, but the ignition lock held.
