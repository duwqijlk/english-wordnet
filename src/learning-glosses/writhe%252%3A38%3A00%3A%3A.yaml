simpleMeaning: to move by twisting and bending the body, especially when struggling
scope: Also called twist, worm, wrestle, wriggle and squirm. This is moving the whole body by twisting
  and bending, not just turning one thing in place.
examples:
- The prisoner writhed in pain on the floor.
- She writhed as she tried to get free from the ropes.
