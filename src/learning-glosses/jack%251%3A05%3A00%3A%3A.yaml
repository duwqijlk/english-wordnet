simpleMeaning: one of several kinds of fish that swim fast, eat other fish, and live in hot to warm seas
scope: A fast sea fish that eats other fish; not the large fruit with the same name and not the socket
  for a plug.
examples:
- A jack raced after the smaller fish in the warm sea.
- The jack chased small fish through the warm water near the reef.
