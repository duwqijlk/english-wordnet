simpleMeaning: often with the front and the heel in colours that stand apart, a woman's low shoe with
  a mid heel
scope: Also called a spectator, this shoe has a mid heel and colours that stand apart at the front and
  the heel.
examples:
- She chose a spectator pump for its mid heel.
- The spectator pump she wore had a front and a heel in colours that stood apart.
