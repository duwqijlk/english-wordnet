simpleMeaning: Raw dough goes into this machine, which cuts it into small bits and rolls each bit into
  a ball of one weight and shape.
scope: Also called a bun divider, this is the machine that cuts raw dough into small bits and rolls each
  bit into a ball of one weight and shape.
examples:
- The bun rounder turned the cut dough into balls of the same weight.
- She fed the dough into the bun rounder and watched the balls roll out.
