simpleMeaning: A strong wind that lifts up clouds of fine earth or sand
scope: A strong wind lifting clouds of fine earth or sand, also called duster, sandstorm and sirocco;
  not a rain storm and not a snow storm.
examples:
- A dust storm swept over the town, turning the sky brown.
- The dust storm lifted clouds of fine earth and sand.
