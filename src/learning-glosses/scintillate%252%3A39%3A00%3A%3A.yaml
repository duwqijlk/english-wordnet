senseId: 'scintillate%2:39:00::'
synsetId: 02165760-v
simpleMeaning: To give off a short flash of light when struck by a tiny charged bit of matter or by a
  strong burst of light energy.
scope: To give off a short flash of light when struck by a tiny charged bit of matter or by a strong burst
  of light energy, not to be lively or brilliant, and not to give off a flickering light.
examples:
- The phosphor scintillated when the beam struck it.
- The crystal scintillated under the ray.
