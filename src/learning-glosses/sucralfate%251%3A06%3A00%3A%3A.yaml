simpleMeaning: A pill sold under a trade name that is said to stick to a sore in the stomach and cover
  it, treating the sores there.
scope: It is one of the drugs used to treat sores in the stomach, and it works by sticking to the sore
  and covering it.
examples:
- The doctor gave her sucralfate for the sore in her stomach.
- She took a sucralfate tablet to coat the sore.
