simpleMeaning: upright bars fixed to the bar at the front or back of a vehicle so it cannot lock with
  the bar of another vehicle
scope: Upright bars fixed to the front or back of a vehicle to stop it locking with another vehicle, not
  the bar itself and not a tow bar.
examples:
- The old car still had its bumper guards on the front.
- He fitted new bumper guards after the crash.
