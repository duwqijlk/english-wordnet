simpleMeaning: Some towns or regions make people pay for stays in holiday lodgings of more than a day,
  when they come for a holiday, rest, or training.
scope: Also called tourist tax, this is a charge paid by visitors who stay in holiday lodgings for more
  than a day.
examples:
- The visitor's tax added a few pounds to their hotel bill.
- She paid the visitor's tax when she checked out after a week.
