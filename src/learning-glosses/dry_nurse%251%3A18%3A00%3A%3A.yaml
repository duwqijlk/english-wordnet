simpleMeaning: a woman who looks after a baby but does not feed it from her own breast
scope: A woman who cares for a baby but does not feed it from her own breast, not a wet nurse who does.
examples:
- The dry nurse took charge of the baby each morning.
- As a dry nurse, she fed the child with a bottle.
