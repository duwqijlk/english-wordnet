simpleMeaning: an orange root eaten as food; it gives the body a lot of carotene (a thing in food that
  the body turns into vitamin A)
scope: This is the orange root as food, with a lot of carotene in it, not the whole plant and not a promised
  reward to make someone act.
examples:
- She put chopped carrots into the soup.
- He ate raw carrots as a healthy snack.
