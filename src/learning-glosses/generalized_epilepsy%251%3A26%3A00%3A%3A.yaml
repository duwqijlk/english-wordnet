simpleMeaning: A person loses consciousness in the attacks of this sickness, with stiff spasms of the
  muscles followed by jerking all over the body.
scope: Also called epilepsia major, grand mal and grand mal epilepsy, this is a sickness in which attacks
  make a person lose consciousness.
examples:
- Generalized epilepsy made her lose consciousness.
- His generalized epilepsy brought on jerking all over his body.
