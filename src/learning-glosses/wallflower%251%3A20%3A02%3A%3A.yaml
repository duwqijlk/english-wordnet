simpleMeaning: A plant of the group called Erysimum; there are many kinds, and their flowers smell sweet
  and are yellow, orange or brownish in color
scope: 'This is a plant: one of the wider group of these sweet-smelling plants. It is not just the single
  kind from southern Europe, and not a shy person who keeps to the side at a party.'
examples:
- Wallflowers filled the bed by the gate with yellow and orange flowers.
- She planted wallflower seeds in spring for their sweet smell.
