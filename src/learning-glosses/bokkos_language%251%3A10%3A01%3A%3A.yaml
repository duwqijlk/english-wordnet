simpleMeaning: A Chadic tongue spoken in northern Nigeria, above all in Plateau State, in the local government
  areas of Barakin-Ladi, Mangu and the one that shares its name.
scope: A Chadic tongue of northern Nigeria, also called Ron, Bokkos, Daffo, Daffo language and Ron language;
  set apart from other Chadic tongues and from other tongues of northern Nigeria.
examples:
- Bokkos language is spoken in Plateau State in northern Nigeria.
- Children learn the Bokkos language at home.
