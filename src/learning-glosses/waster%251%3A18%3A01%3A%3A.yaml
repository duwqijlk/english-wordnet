simpleMeaning: a person who destroys a thing or place, or leaves it ruined and useless
scope: 'Also called destroyer and ruiner: a person who destroys or ruins a place or thing, not a person
  who just uses time or money badly.'
examples:
- The waster burned the old barns and left the fields in ruin.
- He was known as a waster who ruined every building he entered.
