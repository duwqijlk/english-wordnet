simpleMeaning: Things a person owns that can be moved, like chairs, farm animals or a car, as opposed
  to land or buildings.
scope: Things a person owns that can be moved, like chairs, farm animals or a car, as opposed to land
  or buildings; movable and chattel are other names for this sense, not land or a house.
examples:
- The will listed her personal chattel, from chairs to the old car.
- His personal chattel included two cows and a cart.
