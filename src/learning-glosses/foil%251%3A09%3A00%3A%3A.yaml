simpleMeaning: A person or thing that, set beside another, makes its good points stand out
scope: A person or thing that sets off another's good points by contrast, not a sword and not a thin sheet
  of metal.
examples:
- Her plain dress was a foil for her sister's bright gown.
- The quiet brother acted as a foil to his lively sister.
