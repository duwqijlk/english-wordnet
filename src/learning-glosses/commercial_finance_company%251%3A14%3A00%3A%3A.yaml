simpleMeaning: a firm that gives loans to firms that make goods and firms that sell them in bulk
scope: A firm that lends to makers and wholesalers; commercial credit company is another name for this
  sense, not a firm that lends to ordinary people.
examples:
- The commercial finance company gave the maker a loan to expand.
- She called a commercial finance company about funds for the warehouse.
