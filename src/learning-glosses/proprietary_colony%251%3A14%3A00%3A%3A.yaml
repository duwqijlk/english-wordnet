simpleMeaning: A land given to the person who owns it to rule, in the 1600s
scope: A land given to its owner to rule in the 1600s; not a land ruled straight from home, and not a
  free state.
examples:
- The king gave the land as a proprietary colony to a trusted friend.
- Life in a proprietary colony was shaped by the man who owned it.
