simpleMeaning: A person or a group that stays with an important guest, or with the coffin at a military
  funeral
scope: A person or a group that stays with an important guest or with the coffin at a military funeral,
  also called a guard of honor; not the soldiers who fire the salute.
examples:
- The honor guard stood beside the coffin at the military funeral.
- An honor guard met the visiting leader at the airport.
