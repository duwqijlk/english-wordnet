simpleMeaning: In chemistry, it is the sum got by adding the atomic weights of all the atoms that make
  up a molecule, each measured against the same scale.
scope: Also called molecular weight, this is a sum in chemistry worked out from the atoms of a molecule.
examples:
- They found the relative molecular mass by adding the atomic weights.
- She worked out the relative molecular mass of the molecule.
