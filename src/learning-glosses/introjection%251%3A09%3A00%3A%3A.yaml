simpleMeaning: In psychoanalysis, taking parent figures and their values into the mind; this leads to
  the growth of the part of the mind that judges right and wrong.
scope: In psychoanalysis, the taking in of parent figures and their values, not the figures themselves
  and not a child's outward copying of a parent.
examples:
- Introjection helped the child build a sense of right and wrong.
- Through introjection, she took her father's rules into her own mind.
