simpleMeaning: a set of scales that makes a flow of charge that grows with how far its dish moves
scope: A set of scales that makes a flow of charge that grows with how far its dish moves, not a set of
  scales that uses weights and not a meter that shows how much charge flows.
examples:
- She put the powder on the electronic balance to weigh it.
- The electronic balance gave a reading as soon as the dish moved down.
