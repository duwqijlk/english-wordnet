simpleMeaning: in a way that is not loyal and breaks trust
scope: 'Also called false, and another name for this sense is traitorously: in a way that is not loyal,
  not just in a way that is wrong or untrue.'
examples:
- He acted treacherously and told the enemy his friends' secret plans.
- She spoke treacherously, promising help while she gave their names to the other side.
