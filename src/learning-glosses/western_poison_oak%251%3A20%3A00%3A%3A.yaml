simpleMeaning: A bush of the Pacific coast of North America that makes the skin break out in a rash when
  touched.
scope: A bush of the Pacific coast that makes the skin break out in a rash; not poison ivy and not a harmless
  garden bush.
examples:
- Do not touch the western poison oak or your skin will break out in a rash.
- The western poison oak grows along the Pacific coast.
