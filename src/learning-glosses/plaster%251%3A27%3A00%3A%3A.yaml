simpleMeaning: a mix of lime or gypsum (a white stone powder) with sand and water that gets hard into
  a smooth solid and is used to cover walls and ceilings
scope: This is the wet mix that goes on walls and ceilings and then gets hard. It is not the sticky tape
  put on a cut, and not the hard surface itself after it has set.
examples:
- Workers spread wet plaster over the brick wall.
- He mixed the plaster with water before putting it on the wall.
