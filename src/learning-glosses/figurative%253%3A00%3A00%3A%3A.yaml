senseId: 'figurative%3:00:00::'
synsetId: 01422022-a
simpleMeaning: Said of words or text that mean something other than their plain sense, by using a picture
  in words
scope: Words or text that mean something other than their plain sense, not the plain sense itself and
  not a picture of a person or animal.
examples:
- The poet used figurative language to describe the sea.
- Her figurative words painted a picture of the storm.
