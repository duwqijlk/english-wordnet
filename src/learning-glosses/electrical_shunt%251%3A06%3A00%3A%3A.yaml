senseId: 'electrical_shunt%1:06:00::'
synsetId: 04218068-n
simpleMeaning: A path for power that lets flow pass very easily, set beside another device to take some
  of the flow away from it.
scope: 'Also called bypass and shunt: a path for power that lets flow pass very easily, set beside another
  device, not a wire that carries all the flow and not a switch.'
examples:
- The electrical shunt took some current away from the meter.
- An electrical shunt sits beside the main device.
