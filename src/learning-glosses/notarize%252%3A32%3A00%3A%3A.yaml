senseId: 'notarize%2:32:00::'
synsetId: 00823762-v
simpleMeaning: to prove in an official way that a signature on a paper is real, done by a person the law
  allows to do this work
scope: This is the official checking and signing done by the person the law allows for this work, not
  just any person signing their own name on a paper.
examples:
- We had to notarize the form before we sent it in.
- She notarized his signature at her office.
