simpleMeaning: to become filled with salts of calcium (a substance that is also in bones)
scope: This sense is about a thing becoming filled with salts of calcium. It is not about turning into
  lime.
examples:
- Over time, the soft tissue can calcify and become hard.
- The doctor said the lump in her shoulder had begun to calcify.
