simpleMeaning: China dishes with a blue Chinese design on a white ground, showing a tree with long thin
  hanging branches and often a river
scope: This is china with a blue Chinese design on a white ground, showing a tree with long thin hanging
  branches and often a river; willowware is another name for this sense, not plain china and not china
  with a different picture on it.
examples:
- The willow-pattern plates showed a blue tree beside a river.
- She collected willow-pattern cups with the blue Chinese design.
