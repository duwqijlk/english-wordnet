simpleMeaning: A North American bird that builds its own nest and raises its own young.
scope: A North American bird that builds its own nest and raises its own young; not a bird that lays eggs
  in other birds' nests and not a bird from outside North America.
examples:
- The black-billed cuckoo sang from the thicket.
- A black-billed cuckoo raised two chicks in the old orchard.
