simpleMeaning: One of the upper limbs of a person, strictly the part from the shoulder to the elbow but
  often meant as the whole limb.
scope: This is a body part of a person; it is not a weapon, not a branch or section of an object, and
  not the act of getting ready for war.
examples:
- She broke her arm when she fell off the bike.
- He carried the box under his arm.
