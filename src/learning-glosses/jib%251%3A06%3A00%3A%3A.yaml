simpleMeaning: a sail with three sides on a boat, running from front to back and set in front of the front
  pole that holds the sails
scope: This is the small front sail with three sides, not the big main sail and not the arm of a machine
  that lifts things.
examples:
- The crew raised the jib at the front of the boat.
- A strong wind tore the jib, so they put up a smaller one.
