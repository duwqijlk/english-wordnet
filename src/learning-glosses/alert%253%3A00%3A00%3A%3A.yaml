simpleMeaning: Watching with close care, either at this moment or as a usual habit
scope: Watching with close care, now or as a habit, not a quick mind that sees ideas fast, and not a state
  of being ready to act.
examples:
- A couple of alert cops caught the thief as he left the shop.
- She stayed alert enough to spot the chance when it came.
