simpleMeaning: Usually a leading woman dancer and a leading male dancer perform this dance for two people
  in ballet
scope: 'Another name for a duet: a dance for two people in ballet, not a dance for one person and not
  a dance for a whole group.'
examples:
- The pas de deux closed the first act of the ballet.
- She and her partner rehearsed the pas de deux for weeks.
