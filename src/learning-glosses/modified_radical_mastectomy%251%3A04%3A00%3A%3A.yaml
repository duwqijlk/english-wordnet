simpleMeaning: Some of the small round glands in the armpit next to the breast are taken away, along with
  the breast and the small chest muscle.
scope: It is the breast operation that takes away the breast, the small chest muscle, and some glands
  from the armpit next to it.
examples:
- She had a modified radical mastectomy.
- A modified radical mastectomy takes away the breast and the glands in the armpit.
