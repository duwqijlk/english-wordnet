simpleMeaning: A chemical with fluorine and carbon in it, and chlorine too, once used to cool fridges
  and to push sprays from cans.
scope: A chemical used in fridges and spray cans, not a gas that occurs in nature or a fuel; also called
  chlorofluorocarbon.
examples:
- Old fridges once used CFCs to stay cold.
- CFCs were banned because they harm the ozone layer.
