simpleMeaning: People change their clothes here and shut their things away in small boxes for a short
  time; it stands at a sports ground or a work place.
scope: A cloakroom also holds clothes, but only this room gives people somewhere to change their clothes
  at a sports ground or a work place.
examples:
- She left her bag in the locker room while she changed into her kit.
- The team met in the locker room before the game.
