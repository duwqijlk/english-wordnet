simpleMeaning: a sheep that walks at the front of a flock, often with a small thing around its neck that
  makes a ringing sound
scope: A sheep that leads a flock, not the person who leads a group and not a sign of what will come next.
examples:
- The bellwether walked ahead of the flock as they moved to the next field.
- We followed the bellwether through the gate and the rest of the sheep came after it.
