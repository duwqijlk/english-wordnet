simpleMeaning: a long strong piece made from flat pieces of wood, hollow inside, with a shape of four
  straight sides
scope: 'Also called box girder: a long strong piece made from flat pieces of wood, hollow inside, not
  a solid piece of wood and not a steel bar.'
examples:
- The workers lifted the box beam into place above the doorway.
- A box beam held up the roof of the old barn.
