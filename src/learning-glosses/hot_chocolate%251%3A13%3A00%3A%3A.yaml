simpleMeaning: People usually drink this warm sweet drink, which is milk and sugar mixed with the powder
  of cocoa beans
scope: Also called chocolate, cocoa, and drinking chocolate, this is a warm sweet drink made from cocoa
  powder, milk and sugar, not a cold milk shake.
examples:
- She ordered a hot chocolate with cream on top.
- On a cold night, a hot chocolate warms you up.
