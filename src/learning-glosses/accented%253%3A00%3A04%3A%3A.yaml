simpleMeaning: used of a part of a word, having the main force when you say it, usually with a change
  in how high or low the voice is
scope: 'Also called tonic: this is about a part of a word that has the main force, usually with a change
  in how high the voice is, not just any part that has some force on it.'
examples:
- In the word 'happy', the first part is accented and said with more force.
- The teacher marked the accented part of each word for the class.
