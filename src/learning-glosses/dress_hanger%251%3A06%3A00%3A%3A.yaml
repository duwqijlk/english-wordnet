simpleMeaning: a shaped frame like a person's shoulders, made to hold clothes up
scope: A shaped frame for holding clothes up, also called a clothes hanger and a coat hanger; not a hook
  on a wall and not a rail for hanging clothes.
examples:
- She put the jacket on a dress hanger in the cupboard.
- The dress hanger kept the shoulders of the coat in shape.
