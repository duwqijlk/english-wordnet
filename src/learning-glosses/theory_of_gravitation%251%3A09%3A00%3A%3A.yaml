simpleMeaning: Double the mass of either bit of matter and the pull between the two doubles; double the
  gap between them and the pull drops to a fourth.
scope: 'People also call this the theory of gravity and gravitational theory: in physics, the name stands
  for the rule itself, not for the pull the rule describes.'
examples:
- The theory of gravitation says that the Earth pulls the Moon toward it.
- Under the theory of gravitation, two rocks in space pull on each other.
