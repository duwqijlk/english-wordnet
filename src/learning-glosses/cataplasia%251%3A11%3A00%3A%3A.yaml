simpleMeaning: In biology, the falling back of cells or tissue to a simpler, less formed state
scope: A falling back of cells to a simpler form, not normal growth and not cancer.
examples:
- Cataplasia showed in the tissue under the microscope.
- The cells underwent cataplasia after the injury.
