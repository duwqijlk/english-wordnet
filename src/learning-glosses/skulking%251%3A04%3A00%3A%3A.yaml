simpleMeaning: Getting out of work or duty by making it look as if you are too ill or hurt to do it
scope: Getting out of work by pretending to be ill or hurt, not resting when truly ill and not hiding
  from danger.
examples:
- The test was made to catch skulking among the men.
- His skulking kept him off the hard jobs all week.
