simpleMeaning: a smaller second point that faces the other way from the main point and makes an arrowhead
  or spear hard to pull out
scope: This is the small backward point on a weapon, not a part of a feather, not the pointed part of
  barbed wire, and not a hurtful remark.
examples:
- The barb kept the arrowhead stuck in the wood.
- A spear with a barb is hard to pull out.
