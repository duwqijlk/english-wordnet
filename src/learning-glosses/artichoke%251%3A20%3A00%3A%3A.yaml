simpleMeaning: a plant from the Mediterranean area, like a thistle (a prickly plant), grown in many places
  for its large flower head, which people can eat
scope: This plant is also called artichoke plant and globe artichoke; it is the whole plant, not just
  the flower head that people eat.
examples:
- The artichoke grows tall in warm gardens near the Mediterranean.
- Farmers grow artichokes for their large flower heads.
