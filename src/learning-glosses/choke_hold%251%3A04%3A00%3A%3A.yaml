simpleMeaning: A way of keeping someone still by putting an arm round their neck in a tight grip, often
  from behind
scope: A way of keeping someone still by putting an arm round their neck in a tight grip, often from behind;
  chokehold is another name for this sense, not a grip on the arm or waist and not the act of cutting
  off someone's air.
examples:
- He put her in a choke hold from behind.
- The wrestler escaped the choke hold by twisting free.
