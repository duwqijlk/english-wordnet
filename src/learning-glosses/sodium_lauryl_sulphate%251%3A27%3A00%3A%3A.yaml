simpleMeaning: a strong soap-like stuff that strips grease away; makers often add it to shampoos and toothpaste,
  though it can sting the skin and is not safe to swallow
scope: Also called sodium lauryl sulfate; not a mild soap, and not something safe to swallow.
examples:
- She put sodium lauryl sulphate in the shampoo to cut the grease.
- The label warns that sodium lauryl sulphate can irritate the skin.
