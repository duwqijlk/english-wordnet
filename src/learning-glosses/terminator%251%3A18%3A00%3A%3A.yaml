simpleMeaning: A person who kills off pests, above all one whose job is killing off rodents (small animals
  like rats and mice) and insects that cause trouble
scope: A person who kills off pests, above all one whose job is killing off rodents (small animals like
  rats and mice) and insects that cause trouble, also called an exterminator and an eradicator; not a
  hunter of wild game and not a person who traps animals alive.
examples:
- They called a terminator to clear the rats from the barn.
- The terminator sprayed the house for insects.
