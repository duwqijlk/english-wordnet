simpleMeaning: A block in the blood flow kills one small part of the body
scope: This is one small dead part of the body where the blood stopped flowing; infarction is another
  name for this sense, and it is not a wound or a sickness of the whole body.
examples:
- The scan showed an infarct in the heart muscle.
- A small infarct in the brain can still cause harm.
