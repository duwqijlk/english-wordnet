scope: An evergreen holly bush of eastern North America with long, tough leaves and small black berries,
  also called evergreen winterberry, gall-berry and gallberry; not a holly with red berries and not a
  bush that loses its leaves in winter.
examples:
- The inkberry bush keeps its leaves through winter.
- Small black berries hung from the inkberry in the yard.
