simpleMeaning: A made-up stuff that old seekers of gold thought could turn cheap metals into gold.
scope: A made-up stuff that old seekers of gold thought could turn cheap metals into gold; elixir and
  philosopher's stone are other names for this sense, not a real metal and not a jewel.
examples:
- The alchemist spent his life hunting the philosophers' stone.
- Legends say the philosophers' stone could make gold from lead.
