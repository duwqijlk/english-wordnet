simpleMeaning: A big-headed shore bird of the Old World and warm parts of America, with big eyes, a thick
  knee joint, and a life spent at dusk or by night.
scope: 'Also called thick-knee: a big-headed shore bird with big eyes and a thick knee joint, active at
  dusk or by night rather than by day.'
examples:
- We saw a stone curlew on the shore at dusk.
- The stone curlew has a thick knee joint and big eyes.
