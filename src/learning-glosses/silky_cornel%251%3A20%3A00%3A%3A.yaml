simpleMeaning: a bush from the east of North America with stems that are a bit purple and blue fruit
scope: A bush of eastern North America with stems that are a bit purple and blue fruit, also called silky
  dogwood; not a silky terrier and not a shrub with red fruit.
examples:
- The silky cornel bore blue fruit in the autumn.
- We planted a silky cornel with purple stems by the fence.
