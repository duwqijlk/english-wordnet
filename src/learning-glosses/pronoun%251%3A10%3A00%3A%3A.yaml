senseId: 'pronoun%1:10:00::'
synsetId: 06336363-n
simpleMeaning: a word that takes the place of a noun (a word for a person, place or thing) or a longer
  group built around one
scope: A word like 'she', 'it' or 'they' used in place of a noun or a noun group, not the noun itself
  and not a word that joins or describes.
examples:
- In 'She is happy', the pronoun 'she' stands for the woman's name.
- We used a pronoun instead of saying the boy's name again.
