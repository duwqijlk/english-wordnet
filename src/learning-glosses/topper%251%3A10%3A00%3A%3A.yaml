simpleMeaning: A cracking good jest that beats all before.
scope: This sense is a cracking good jest that beats all before, unlike the sense for a man's hat with
  a tall crown, usually covered with silk, or with beaver fur, and unlike the sense for a worker who cuts
  tops off trees or greens, or the like.
examples:
- The topper is a cracking good jest.
- Toppers beat all before.
