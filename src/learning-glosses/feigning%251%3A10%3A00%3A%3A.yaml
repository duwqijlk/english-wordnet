senseId: 'feigning%1:10:00::'
synsetId: 06772060-n
simpleMeaning: acting as if something were true when it is not, in order to fool others
scope: 'Also called pretense, pretence, and dissembling: acting as if something were true in order to
  fool others; not an honest mistake and not a true feeling shown openly.'
examples:
- Her feigning of illness fooled the teacher for one day.
- 'His feigning was clear to us: he was not really asleep.'
