simpleMeaning: A fund for good works, paid for by gifts from single people, that pays for help needed
  by local people
scope: A fund for good works, paid for by gifts from single people; not a single gift to one person and
  not a government fund.
examples:
- The community chest pays for help needed in our town.
- She gave money to the community chest every month.
