simpleMeaning: On any part of the body, a place that sticks out or has swollen up
scope: A raised lump or swollen area on the body, not the swelling on a plant stem where leaves grow,
  and not a point in space or in a moving system.
examples:
- The doctor felt a small node under the skin of his neck.
- A hard node near the joint made it hurt to move her finger.
