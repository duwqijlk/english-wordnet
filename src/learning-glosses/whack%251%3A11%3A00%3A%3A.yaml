simpleMeaning: the sound made when something is hit hard and fast
scope: This is the sound of a hard hit, not the hit itself and not a try at something.
examples:
- The whack of the bat on the ball could be heard across the park.
- A loud whack came from the kitchen when the pan fell onto the floor.
