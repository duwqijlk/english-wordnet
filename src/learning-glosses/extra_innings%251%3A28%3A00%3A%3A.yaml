simpleMeaning: Play kept going past the set rounds until one side is ahead when a round ends, as in baseball.
scope: Play kept going past the set rounds until one side is ahead when a round ends; not the set rounds
  of a game and not a tie that ends in a draw.
examples:
- The game went to extra innings after nine rounds.
- Extra innings stretched the baseball game past midnight.
