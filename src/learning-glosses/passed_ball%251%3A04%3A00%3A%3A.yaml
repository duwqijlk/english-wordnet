synsetId: 00109485-n
simpleMeaning: A runner can move on to the next base when the catcher misses a throw that should have
  been held
scope: When the catcher misses a throw that should have been held, a runner can move on to the next base,
  not a throw too wild to catch and not a runner stealing a base.
examples:
- The passed ball let the runner move to second base.
- After the passed ball, the runner took third.
