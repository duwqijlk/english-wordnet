simpleMeaning: a clock that wakes a person at a time set before
scope: A clock set to wake a person, not a warning sound about danger, not a thing that shows a bad event,
  and not a feeling of fear.
examples:
- My alarm clock wakes me at six every morning.
- She set her alarm clock for seven and got up when it rang.
