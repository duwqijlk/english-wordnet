simpleMeaning: A weed from Europe and Asia, with flowers of yellow or mauve or white, and fruits shaped
  like small pods
scope: A weed from Europe and Asia with yellow or mauve or white flowers; jointed charlock, runch and
  wild radish are other names for this sense, and it is not a garden root crop or a mustard plant.
examples:
- Wild rape grew along the ditch.
- The wild rape flowers were pale mauve.
