simpleMeaning: The chemical join between an acid group and an amine group is the main link in every protein,
  tying its parts together.
scope: 'Also called peptide bond: the main chemical link that holds every protein together.'
examples:
- Peptide linkage holds the parts of a protein together.
- A peptide linkage joins an acid group to an amine group.
