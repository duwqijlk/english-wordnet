simpleMeaning: the state of parts or things not fitting well together because they do not stay the same
  or agree with each other
scope: This is the general state of not agreeing or not staying the same, not one single act and not a
  state where all parts agree and fit well.
examples:
- The inconsistency in his story made people doubt him.
- There is an inconsistency between what she says and what she does.
