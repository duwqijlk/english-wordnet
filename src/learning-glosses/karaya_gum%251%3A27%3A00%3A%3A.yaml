simpleMeaning: 'Cloth is finished with it, and foods and cosmetics are thickened with it: sticky stuff
  that oozes from a tree of Asia.'
scope: Sterculia gum is another name for this sticky stuff from a tree of Asia, used to finish cloth and
  to thicken foods and cosmetics.
examples:
- Karaya gum thickened the sauce.
- They finished the cloth with karaya gum.
