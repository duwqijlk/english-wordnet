simpleMeaning: Orders slipped into a program, set to run or blow up when a state is met; they may wipe
  or spoil facts, print a false note, or do other harm.
scope: This sense is also called logic bomb.
examples:
- Slag code blew up the files.
- A slag code wiped the facts.
