simpleMeaning: to watch or ask about a person or thing in secret, so that no one knows what you are doing
scope: 'Also called spy, stag, and snoop: to watch or ask about someone in secret. Not the word for a
  person whose job is to find out hidden facts.'
examples:
- She sleuths around the town, watching people and asking questions in secret.
- He spent the night sleuthing in the library, quietly looking into the case.
