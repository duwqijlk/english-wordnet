simpleMeaning: The nose gives a feeling when certain chemicals in gas form set off the parts inside it
  that pick up smells.
scope: Smell, odor, odour, and olfactory perception are other names for this feeling, which the nose gives
  when certain chemicals in gas form set off the parts inside it that pick up smells.
examples:
- His olfactory sensation came with the smell of roses.
- The olfactory sensation followed when the chemicals in gas form reached her nose.
