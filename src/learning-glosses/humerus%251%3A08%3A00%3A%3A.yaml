simpleMeaning: The bone in the upper arm that joins the shoulder to the elbow
scope: The bone of the upper arm, not the bones of the lower arm and not the shoulder blade.
examples:
- He broke his humerus in the fall from the ladder.
- The humerus meets the bones of the forearm at the elbow.
