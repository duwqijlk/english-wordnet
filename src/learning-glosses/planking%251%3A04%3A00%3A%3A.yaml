simpleMeaning: the work of covering an area with long, flat pieces of wood
scope: This sense is the work of covering an area. It is not the finished covering on a ship, and it is
  not a pile or amount of boards as a thing.
examples:
- Planking the floor of the small hut took them all morning.
- He spent the day planking the area at the back of the house.
