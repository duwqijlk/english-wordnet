senseId: reverse%5:00:02:backward:01
synsetId: 00203687-s
simpleMeaning: turned to the opposite way in order, in kind, or in what it does
scope: Describes a thing turned to the opposite in order, kind or effect; not the act of turning something,
  not a car gear, and not the back of a coin.
examples:
- The names are listed in reverse order, from last to first.
- The drink had the reverse effect and made him more awake, not sleepy.
