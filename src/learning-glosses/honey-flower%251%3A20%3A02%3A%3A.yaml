simpleMeaning: Red blooms in bunches at the ends of the branches give lots of sweet juice on this tall
  bushy shrub of eastern Australia.
scope: Also called honeyflower and mountain devil, this is a tall bushy shrub of eastern Australia with
  red blooms, not the other Australian honey-flower shrub.
examples:
- The honey-flower was covered in red blooms.
- Honey-flower grows in eastern Australia.
