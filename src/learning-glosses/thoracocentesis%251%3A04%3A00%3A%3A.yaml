simpleMeaning: To find what is wrong, or to treat it, fluid is drawn from the chest with a needle put
  through the chest wall.
scope: Also called thoracentesis, this is a test or a treatment in which fluid is drawn from the chest
  with a needle.
examples:
- A thoracocentesis drew fluid from the chest with a needle.
- Fluid taken by thoracocentesis showed what was wrong in the chest.
