simpleMeaning: A heavy sea bird with a short tail that lives in the cold waters near the poles.
scope: This is a heavy short-tailed sea bird of the polar seas, also called fulmar; not a gull or an albatross,
  which have longer tails.
examples:
- The fulmar petrel glided over the grey polar sea.
- A fulmar petrel nested on the rocky cliff.
