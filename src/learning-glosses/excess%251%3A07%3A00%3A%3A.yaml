simpleMeaning: not holding back after going past what is enough or allowed
scope: Losing control by going past what is enough or allowed, not just having too much of something and
  not the act of giving in to pleasure.
examples:
- His excess in eating made him feel ill.
- The excess of his drinking ruined his health.
