simpleMeaning: With eyes on tall stalks, these pale little fish of shallow tropical waters off the Americas
  lie buried in sand, waiting for prey.
scope: A small pale fish of shallow tropical American waters with eyes on stalks, not the larger stargazers
  of other seas.
examples:
- Sand stargazers lie half-buried, with only their stalked eyes showing above the sand.
- A sand stargazer snapped up a passing shrimp without leaving its burrow.
