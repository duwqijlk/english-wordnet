simpleMeaning: A bit of DNA that stays outside the main set of genes yet copies with it, above all in
  the cells of bacteria
scope: This is a bit of DNA that stays outside the main set of genes yet copies with it, above all in
  the cells of bacteria, not a bit of DNA inside the main set and not a bit that copies on its own.
examples:
- The episome copied with the main set of genes.
- In the cells of bacteria, an episome stays outside the main set of genes.
