simpleMeaning: to do with people who look after sheep or cattle, or with the work of raising sheep or
  cattle
scope: 'Also called bucolic: this describes people who look after sheep or cattle and the work of raising
  sheep or cattle; it is not the sense about a church pastor, and not the sense that means a pleasant,
  perfect country life.'
examples:
- Pastoral people move with their sheep from place to place.
- The area has a pastoral economy based on raising cattle.
