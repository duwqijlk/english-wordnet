senseId: 'counterpreparation_fire%1:04:00::'
synsetId: 00992405-n
simpleMeaning: heavy shooting planned in advance and let off as soon as signs show that the other side
  is about to attack
scope: Heavy shooting planned in advance and let off when signs show the other side is about to attack,
  not shooting in reply to an attack already under way and not shooting at a fixed target for practice.
examples:
- The counterpreparation fire began the moment scouts reported the enemy moving up.
- Their counterpreparation fire caught the attackers before they could form up.
