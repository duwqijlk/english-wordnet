simpleMeaning: A marsh plant that lives year after year, with long sword-like leaves and sweet-smelling
  roots.
scope: A marsh plant with long sword-like leaves and sweet-smelling roots, also called flagroot and myrtle
  flag; not a water lily and not a reed.
examples:
- Calamus grows at the edge of the marsh.
- He dug up calamus roots for their sweet smell.
