simpleMeaning: A person who sits on a small court group that decides a trial.
scope: This is about a person on the small court group that decides a trial, not a person on the larger
  group that decides whether to bring a charge, and not a judge.
examples:
- The petit juror listened to the witnesses all day.
- She was chosen as a petit juror for the trial.
