simpleMeaning: a set of notes in a row that make a song you can tell apart
scope: A set of notes in a row that make a song you can tell apart, also called an air and a line, and
  strain is another name for this sense; not setting a radio and not making an instrument sound at the
  right pitch.
examples:
- She hummed a tune from Beethoven as she worked.
- The band played a tune everyone knew by heart.
