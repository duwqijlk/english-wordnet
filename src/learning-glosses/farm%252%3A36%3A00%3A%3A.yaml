simpleMeaning: to grow crops or raise animals on land, often improving it with better growing methods
scope: This is the act of growing crops or raising animals, not the occupation of working as a farmer,
  collecting fees or profits, or the noun for a workplace of buildings and land.
examples:
- They farm wheat and barley on the valley floor.
- The family farms a hundred acres near the river.
