simpleMeaning: a nut tree from America whose nuts taste bitter
scope: Also called brown hickory, pignut and pignut hickory, it is a tree with bitter nuts, not the walnut
  tree also called black hickory and not the smooth-barked tree with hard-shelled nuts.
examples:
- The black hickory in the yard drops bitter nuts every autumn.
- We planted a black hickory for shade, though no one eats its bitter nuts.
