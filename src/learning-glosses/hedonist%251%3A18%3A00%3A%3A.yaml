simpleMeaning: The pleasures of the body and the senses lead this person's choices
scope: The pleasures of the body and the senses lead this person's choices; pagan and pleasure seeker
  are other names for this sense, not a person chasing wealth and not a follower of a pagan faith.
examples:
- The hedonist spent his days chasing fine food and soft music.
- She called him a hedonist for living only for pleasure.
