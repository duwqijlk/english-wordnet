simpleMeaning: The metric system has this unit of weight, and it is one thousandth of a kilogram
scope: A unit of weight in the metric system, also called gram and gramme, not a kilogram and not a pound.
examples:
- Add 50 gm of flour to the bowl.
- The parcel weighs 200 gm in all.
