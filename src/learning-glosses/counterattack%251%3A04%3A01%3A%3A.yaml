simpleMeaning: In chess, an attack made to act against the other player's better position in another part
  of the board
scope: In chess, an attack in one part of the board made to act against the other player's better position
  in another part; not a fighting attack by soldiers and not the verb for making such an attack.
examples:
- His counterattack in chess won back the piece he had lost.
- She planned a counterattack on the other side of the chess board.
