simpleMeaning: A painkiller for mild pain that does not ease swelling, also used to bring down fever;
  sold as a brand of acetaminophen tablets.
scope: A mild painkiller, also called acetaminophen, Anacin III, Datril, Panadol, Tempra and Tylenol;
  not aspirin and not ibuprofen.
examples:
- She took Phenaphen for her headache.
- Phenaphen brought his fever down.
