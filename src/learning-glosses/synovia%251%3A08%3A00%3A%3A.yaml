simpleMeaning: a thick slippery liquid made by the skin that lines joints, tendon covers, and such, to
  let them move
scope: Also called synovial fluid; not blood and not the joint itself.
examples:
- Synovia keeps the knee joint moving smoothly.
- The doctor drew off some synovia from the swollen joint.
