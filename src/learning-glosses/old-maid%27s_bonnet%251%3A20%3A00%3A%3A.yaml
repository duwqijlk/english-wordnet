simpleMeaning: Showy blue flowers in bunches mark this thick, long-lived plant of eastern and middle North
  America, with hand-shaped leaves.
scope: Also called sundial lupine and wild lupine, this plant of eastern and middle North America is known
  for its hand-shaped leaves and its showy blue flowers in bunches.
examples:
- The old-maid's bonnet was in flower.
- The old-maid's bonnet opened its blue flowers.
