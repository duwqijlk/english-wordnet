simpleMeaning: Any of several illnesses of the mind that change what a person thinks is real, cause problems
  with thought and language, and make the person keep away from others
scope: Also called dementia praecox, schizophrenic disorder and schizophrenic psychosis. This names a
  group of serious mind illnesses, not a person who has one of them.
examples:
- He is being treated for schizophrenia.
- Schizophrenia can make it hard for a person to tell what is real.
