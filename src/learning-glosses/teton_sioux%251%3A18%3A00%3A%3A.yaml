simpleMeaning: That people had a large western branch, made up of several groups that lived on the plains,
  and this person was one of them.
scope: 'Also called Lakota, Teton and Teton Dakota: one of the large western branch of that people, not
  a member of another branch.'
examples:
- He was a Teton Sioux of the western plains.
- The Teton Sioux lived in several groups on the plains.
