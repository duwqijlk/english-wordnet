simpleMeaning: a thick liquid stuff that you put on your skin to make it feel soft and less dry or sore
scope: This is a thick liquid for the skin. It is not the act of putting such a liquid on your face or
  body, and not the act of adding a milk product to coffee.
examples:
- She put cream on her dry hands before bed.
- This cream made his sore skin feel soft and calm.
