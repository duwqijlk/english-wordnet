simpleMeaning: The quality of a person who keeps asking for things in a greedy or thoughtless way, making
  demands that go too far.
scope: The quality of making greedy or thoughtless demands, not simple greed and not firm asking for what
  is fair; importunateness is another name for this sense.
examples:
- His importunity wore down everyone in the office.
- Her importunity made the committee refuse her request.
