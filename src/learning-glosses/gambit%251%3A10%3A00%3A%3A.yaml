simpleMeaning: the first thing someone says in a talk, meant to put them ahead of the other side
scope: 'Also called ploy: a first remark in a talk meant to put the speaker ahead; not the early chess
  move in which a player gives up pieces to get a better place.'
examples:
- His opening gambit was a joke that made everyone relax.
- She began with a clever gambit, asking a question her rival could not answer.
