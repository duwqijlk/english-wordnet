senseId: 'incomprehensible%3:00:04::'
synsetId: 00942374-a
simpleMeaning: so hard to make sense of that no one can say how or why it came about
scope: Also called inexplicable; this is about a thing no one can explain, not about a person who cannot
  understand.
examples:
- The letter arrived at three in the morning for incomprehensible reasons.
- His sudden change of plan was incomprehensible to us all.
