simpleMeaning: killing a person as a punishment by cutting off their head
scope: 'Also called beheading: killing a person as a punishment by cutting off their head. Not cutting
  off a head in any other way, and not another way of killing as a punishment.'
examples:
- The king ordered the decapitation of the prisoner.
- In the past, decapitation was used as a punishment for some crimes.
