simpleMeaning: In American football, a play where the ball is thrown by one player to another player on
  the same team
scope: In American football, this is a play where a player throws the ball to a teammate, also called
  a pass; it is not a good-enough test result and not one thing moving past another.
examples:
- The coach called for a passing play on the last down.
- A quick passing play sent the ball to his teammate.
