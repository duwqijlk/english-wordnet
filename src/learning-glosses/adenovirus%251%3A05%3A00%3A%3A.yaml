simpleMeaning: In people these germs bring on sicknesses of the nose and throat, or a sore red eye that
  spreads to others; they are one of a group of germs.
scope: This word names one of a group of germs, known by the sicknesses of the nose and throat and the
  sore red eyes it brings on in people.
examples:
- The adenovirus going round the school gave the children sore throats.
- Her red, sore eye came from an adenovirus she caught at work.
