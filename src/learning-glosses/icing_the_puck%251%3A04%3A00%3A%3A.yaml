simpleMeaning: In ice hockey, shooting the small flat disc from your own end of the rink all the way past
  the other team's goal.
scope: In ice hockey, shooting the small flat disc from your own end of the rink past the other team's
  goal; icing is another name for it, not a shot at goal and not a pass to a team-mate.
examples:
- The referee called icing the puck when he shot it the length of the rink.
- Icing the puck gave the other team a face-off in his end.
