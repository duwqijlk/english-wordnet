simpleMeaning: Of bright grey, or veiled, or brushed by, the hue of silver.
scope: This sense is also called silver and silvery, for being of bright grey, or veiled, or brushed by,
  the hue of silver, where silver is shiny grey in colour, or covered with or slightly tinted by that
  pale metallic grey, and silvery is shiny pale grey in colour, or covered with or touched a little by
  that pale grey colour.
examples:
- The cloth was silverish, of bright grey.
- The paint was silverish, brushed by the hue of silver.
