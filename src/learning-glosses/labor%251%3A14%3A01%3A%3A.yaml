simpleMeaning: The part of the United States government that looks after work conditions for people who
  are paid for the work they do; set up in 1913.
scope: The work department, also called the DoL, the Department of Labor, or the Labor Department; not
  the British party of the same name, and not any other department.
examples:
- Labor was created in 1913.
- Labor looks after workers' conditions.
