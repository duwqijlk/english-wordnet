simpleMeaning: A moving part that carries current and turns across a row of fixed points and stops on
  one to make a link.
scope: Also called wiper; a moving part that turns across fixed points and stops on one to make a link,
  not a switch that is pushed and not a wire.
examples:
- The contact arm swung round to the next point.
- A worn contact arm failed to reach the outlet.
