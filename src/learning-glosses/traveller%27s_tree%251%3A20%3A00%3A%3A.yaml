simpleMeaning: A huge plant like a tree, with nuts fit to eat, its leaf stalks yielding a cool, clear,
  watery drink, a last-hope well of water, they say, for travellers.
scope: This sense is also called ravenala and traveler's tree.
examples:
- A traveller's tree gave us water.
- Traveller's trees bear eatable nuts.
