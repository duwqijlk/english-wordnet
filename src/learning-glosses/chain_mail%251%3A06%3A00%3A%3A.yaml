simpleMeaning: In the Middle Ages, a body covering made of small metal rings joined so it bends
scope: Flexible body covering of joined metal rings from the Middle Ages; mail, chain armor and chain
  armour are other names for this sense, not a metal plate and not a cloth coat.
examples:
- He wore chain mail under his cloak on the long ride.
- The chain mail was heavy but it bent with every move.
