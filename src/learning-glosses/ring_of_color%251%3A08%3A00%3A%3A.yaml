simpleMeaning: a small round patch, like the one round a human nipple or round a spot or an insect bite
  that is red and sore
scope: Not a ring worn on the finger, and not a bruise; also called areola.
examples:
- The ring of color round the bite grew wider.
- A ring of color marks the skin round the nipple.
