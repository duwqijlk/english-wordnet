simpleMeaning: Written into each part of a magnetic disk, it lets a reader spot mistakes in the data stored
  there.
scope: It is the code a disk keeps in each part so mistakes in the stored data can be caught.
examples:
- The cyclic redundancy check caught the bad sector before the file was read.
- Each disk keeps a cyclic redundancy check with its data.
