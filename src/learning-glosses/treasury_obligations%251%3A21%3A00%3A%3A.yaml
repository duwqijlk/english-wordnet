simpleMeaning: Debts of the United States government that can be bought and sold, with a promise that
  the interest and the sum owed will be paid on time.
scope: Also called Treasury, these are debts of the United States government that can be bought and sold,
  with a promise of payment on time, not a private firm's debts.
examples:
- Treasury obligations are sold by the United States government.
- He bought Treasury obligations for a safe return.
