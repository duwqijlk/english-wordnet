simpleMeaning: loose rocks that form a slope at the foot of a cliff
scope: 'Also called talus: a pile of loose rocks at the foot of a cliff, not the cliff itself and not
  one single rock.'
examples:
- Loose scree covered the foot of the cliff.
- We walked slowly down the scree, and small rocks slid under our feet.
