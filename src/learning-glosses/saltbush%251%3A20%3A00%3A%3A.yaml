simpleMeaning: any of various shrubby plants of the kind Atriplex that grow well in dry soil that is alkaline
  rather than acid
scope: A shrubby plant of dry alkaline soil, not a sagebrush and not a cactus.
examples:
- Saltbush grew in the dry soil by the road.
- The saltbush spread over the dry alkaline plain.
