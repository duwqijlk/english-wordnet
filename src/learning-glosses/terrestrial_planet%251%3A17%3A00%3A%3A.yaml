simpleMeaning: A world with a dense rocky surface like the Earth's; the four worlds nearest the sun in
  the solar system
scope: A world with a dense rocky surface like the Earth's, one of the four worlds nearest the sun; not
  a gas giant and not a world with no solid ground.
examples:
- Mars is a terrestrial planet with a rocky surface.
- The four terrestrial planets are the ones nearest the sun.
