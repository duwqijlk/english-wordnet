simpleMeaning: A light earth made of the remains of tiny creatures that live in water with glass-like
  shells, often used to strain things
scope: This is a light earth made of the remains of tiny creatures that live in water with glass-like
  shells, often used to strain things; diatomaceous earth and diatomite are other names for this sense,
  not sand and not ordinary garden earth.
examples:
- Kieselguhr is used to strain liquids.
- The filter held a layer of kieselguhr.
