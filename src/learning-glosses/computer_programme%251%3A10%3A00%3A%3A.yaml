simpleMeaning: In computing, a set of orders, one after the other, that a machine can make sense of and
  act on
scope: A set of orders, one after the other, for a machine to make sense of and act on; computer program,
  program and programme are other names for this sense, not the machine itself and not the written papers
  that go with it.
examples:
- He installed a new computer programme to sort the photos.
- The computer programme ran all night to finish the job.
