simpleMeaning: one card from a set, usually 78 in all, with 22 showing good and bad qualities, death and
  luck, used for card games and by people who tell the future
scope: Also called a tarot card, this is a card from this special set, not a plain card from a normal
  pack used only for games.
examples:
- He laid out the tarot cards to tell her what might happen next.
- The tarot pack she bought has 78 cards.
