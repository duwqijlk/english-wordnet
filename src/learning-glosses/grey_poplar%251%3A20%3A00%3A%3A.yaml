simpleMeaning: Now growing wild in other places too, this big fast-growing poplar came from Europe, with
  leaves that have shallow cuts and toothed edges and are pale underneath.
scope: Also called gray poplar, this is a fast-growing poplar from Europe, now growing wild elsewhere,
  not a poplar that grows only in Europe.
examples:
- The grey poplar in the park grew taller than the house in a few years.
- Turn a grey poplar leaf over and you will see its pale underside.
