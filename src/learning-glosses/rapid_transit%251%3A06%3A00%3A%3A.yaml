simpleMeaning: a city travel system that anyone can use, with trains that run below ground or up in the
  air
scope: 'Another name for mass rapid transit: a city train system below ground or in the air, not a bus
  system and not a long-distance train.'
examples:
- We took the rapid transit across town because the streets were jammed.
- The new rapid transit line runs below ground for most of its route.
