simpleMeaning: A whisk fern of the tropics, growing on trees or on the ground, with mostly dull yellow
  branches and tiny leaves; native to America, Japan and Australia.
scope: A tropical whisk fern with dull yellow branches and tiny leaves; also called skeleton fork fern.
examples:
- Psilotum nudum grows on the trunks of trees in warm forests.
- In Australia, Psilotum nudum can be found on damp ground.
