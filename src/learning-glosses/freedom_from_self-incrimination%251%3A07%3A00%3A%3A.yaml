senseId: 'freedom_from_self-incrimination%1:07:00::'
synsetId: 05192078-n
simpleMeaning: The legal right, given by the Fifth Amendment to the United States Constitution, to refuse
  to answer questions or give evidence that would count against the person giving it
scope: The right to refuse to answer questions or give evidence that would count against the person asked,
  not the right to a lawyer and not a general right to refuse any question.
examples:
- He claimed freedom from self-incrimination and refused to answer.
- Freedom from self-incrimination is protected by the Fifth Amendment.
