simpleMeaning: A box that holds a machine which plays records by itself when a coin is put in.
scope: A box holding a machine that plays records on its own when a coin is put in, with jukebox as another
  name for this sense, not a record player used at home without coins and not a radio.
examples:
- They put a coin in the nickelodeon and a record began to play.
- The nickelodeon stood in the corner of the cafe.
