simpleMeaning: Any of several body chemicals that change a substance into smaller parts that act in the
  body.
scope: Any of several body chemicals that change a substance into smaller active parts, not a chemical
  that builds things up and not a drug.
examples:
- Convertase splits the protein into smaller fragments.
- The convertase changed the compound into smaller parts that act in the body.
