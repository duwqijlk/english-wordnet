simpleMeaning: A light carried on a boat to show which way it is going; at night, red on the left front
  side and green on the right front side.
scope: A light carried on a boat to show which way it is going, also called a running light.
examples:
- The sidelight showed the boat was heading our way.
- At night, the sidelight on the port bow glowed red.
