simpleMeaning: done fully and in full detail, looking at every part, and not done in a shallow way or
  with only some parts done
scope: 'Also called thorough: a full and complete piece of work that covers every part, not a quick, shallow
  one that leaves parts out.'
examples:
- She did an exhaustive study of every record in the office.
- The police made an exhaustive search of the whole building.
