senseId: 'pathos%1:12:00::'
synsetId: 07569430-n
simpleMeaning: Sorrow and sympathy felt for the hardships of others.
scope: Also called pity, commiseration, or ruth, a feeling of sorrow and sympathy for the hardships of
  others, not the quality in a thing that stirs feelings in people, especially pity or sorrow.
examples:
- There was real pathos in the old man's story of losing his home.
- The pathos of the scene moved the whole crowd to tears.
