simpleMeaning: a green plant with thin blades, grown as lawn; it is grazed by animals and cut and dried
  as hay
scope: The lawn and pasture plant, not the bulky feed made from it or the verb meaning to feed animals
  with it.
examples:
- She lay on the grass and watched the clouds.
- The grass in the meadow grew tall before the first cut.
