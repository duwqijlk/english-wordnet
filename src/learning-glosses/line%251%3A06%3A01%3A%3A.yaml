simpleMeaning: a wire or cable that carries electric power or signals, whether electrical or carried by
  light.
scope: This is not a mark on paper or a row of people; it is a physical conductor for power or signals.
examples:
- The power line was knocked down by the storm.
- A fibre-optic line carries the internet signal across the city.
