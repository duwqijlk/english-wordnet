simpleMeaning: slowly getting better by resting after being sick or hurt
scope: 'Also called recovery and recuperation: slowly getting better by resting after sickness or injury,
  not the sickness or injury itself.'
examples:
- His convalescence after the operation took several weeks.
- During her convalescence, she rested at home and did little work.
