simpleMeaning: cheerful, bold, and full of life, in a light and playful way
scope: 'Also called impertinent, pert, and saucy: light, bold, and lively in manner, not quiet and shy,
  and not a serious lack of respect for holy things.'
examples:
- With an irreverent grin, he joked even during the long, serious meeting.
- Her irreverent, lively manner kept the talk light and fun.
