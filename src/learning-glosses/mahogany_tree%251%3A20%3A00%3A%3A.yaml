simpleMeaning: any of several tropical timber plants of the Meliaceae family, above all Swietinia, prized
  for hard yellow-brown wood that is easy to work and takes a high shine
scope: 'Also called mahogany: any of several tropical timber plants prized for hard wood, not a pine and
  not an oak.'
examples:
- The mahogany tree in the yard is prized for its hard wood.
- Mahogany trees grow in warm lands and give wood that takes a high shine.
