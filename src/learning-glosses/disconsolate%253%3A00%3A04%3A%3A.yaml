simpleMeaning: so sad, and not able to be made to feel better by words or help
scope: So sad that words or help cannot make a person feel better; also called inconsolable. It is not
  just being a little unhappy or sad for a short time.
examples:
- She was disconsolate after her dog died, and no one could cheer her up.
- The disconsolate child cried all night and would not be comforted.
