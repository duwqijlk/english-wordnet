senseId: fatherless%5:00:00:unparented:00
synsetId: 01738516-s
simpleMeaning: whose male parent is no longer living
scope: This means the person's male parent has died. It does not mean the male parent is not known. It
  does not mean that no male parent is held responsible for the child by law.
examples:
- The fatherless boy lived with his mother and his grandparents.
- She grew up fatherless after her father's early death.
