simpleMeaning: a plant that grows seeds in pods (long thin cases), grown as food for farm animals
scope: This sense is the plant grown as food for farm animals. The other sense of the same word is about
  the plant itself as a living thing, with its leaves and flowers.
examples:
- Farmers grow alfalfa to feed their cows in winter.
- The field of alfalfa was cut and dried for hay.
