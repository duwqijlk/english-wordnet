simpleMeaning: A way of speaking that shows the speaker wants the hearer to do something
scope: 'Also called imperative, imperative form, or imperative mood: a way of speaking that urges the
  hearer to act, not a way of stating facts or asking questions.'
examples:
- The jussive mood shows up in commands like 'let him go.'
- In the jussive mood, the verb urges the listener to act.
