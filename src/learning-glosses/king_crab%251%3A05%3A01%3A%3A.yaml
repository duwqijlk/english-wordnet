simpleMeaning: People eat this big crab from the north Pacific, above all off the shores of Alaska and
  Japan.
scope: Eaten as food, this big crab comes from the north Pacific, above all off Alaska and Japan, and
  not from seas far to the south.
examples:
- They caught a king crab off the coast of Alaska.
- The cook cracked open a king crab for our dinner.
