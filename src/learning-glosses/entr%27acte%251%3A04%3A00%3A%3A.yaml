schema: oewn-learning-gloss-v2
senseId: 'entr''acte%1:04:00::'
synsetId: 00521936-n
simpleMeaning: Between the parts of a longer show, a short bit of music, dance, or some other show is
  put in
scope: 'Also called interlude and intermezzo: a short bit put in between the parts of a longer show, not
  a part of the show itself and not a pause with nothing shown.'
examples:
- An entr'acte of dance filled the time between the two acts.
- The entr'acte gave the singers a short rest before the last act.
