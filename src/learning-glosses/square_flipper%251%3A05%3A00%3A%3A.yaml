simpleMeaning: This seal of the far north seas, of middle size and greyish to yellow in colour, has stiff
  hairs on each side of its nose.
scope: Bearded seal, square flipper seal, and squareflipper are other names for this seal of the far north
  seas, of middle size and greyish to yellow in colour, with stiff hairs on each side of its nose, and
  not a seal of warm seas.
examples:
- The square flipper had stiff hairs on each side of its muzzle.
- A square flipper lives in the Arctic Ocean.
