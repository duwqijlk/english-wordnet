simpleMeaning: a person who tells people about goods or work done for others to help sell them, or who
  trades them for money
scope: 'Also called a seller, a vendor, a trafficker and a vender: a person who helps to sell goods or
  work done for others, or trades them for money, not a buyer.'
examples:
- She works as a marketer, telling shops about new drinks to help sell them.
- The marketer sold the farmer's cloth to shops in other towns.
