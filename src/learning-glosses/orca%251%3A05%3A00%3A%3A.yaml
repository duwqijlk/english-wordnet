simpleMeaning: a black and white whale with teeth that hunts other animals, with a big fin on its back;
  common in cold seas
scope: 'Also called killer, grampus, killer whale and sea wolf: this black and white hunting whale, not
  any other whale or large sea animal.'
examples:
- An orca hunted seals near the ice.
- We watched an orca swim past the boat, its tall fin above the water.
