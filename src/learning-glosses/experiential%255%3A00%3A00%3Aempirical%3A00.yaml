simpleMeaning: gained from living one's own life; coming from what a person has lived through and known
  for themselves
scope: Existential is another name for this sense. It is for things that come from a person's own life
  and from living it, such as what a person knows from that life. It is not the wider sense of the same
  word in this batch, which is for anything to do with or coming from what a person has lived through.
examples:
- His writing has a rich experiential content drawn from his own long life.
- 'For him, truth was experiential: it had to be lived to be known.'
