simpleMeaning: To show an action that started in the past and is still going on, a verb is put together
  with has been or have been and the -ing form
scope: 'Another name for the present perfect progressive: a verb form made with has been or have been
  and the -ing form, showing an action that started in the past and is still going on; not the simple
  past and not a finished action.'
examples:
- In 'I have been working all day', 'have been working' is a present perfect continuous.
- She used the present perfect continuous to say she had been reading since morning.
