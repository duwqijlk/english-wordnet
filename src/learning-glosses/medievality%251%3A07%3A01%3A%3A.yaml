simpleMeaning: The quality of being of or relating to the Middle Ages, roughly from the year 500 to the
  year 1500
scope: The character of being of or relating to the Middle Ages; not the character of modern times and
  not the character of ancient Rome.
examples:
- The castle's medievality drew crowds of visitors.
- Scholars still debate the medievality of the old ballads.
