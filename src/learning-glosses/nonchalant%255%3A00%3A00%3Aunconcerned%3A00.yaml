simpleMeaning: Showing that you do not care, in a light and easy way
scope: This is showing that you do not care, in a light and easy way; casual is another name for this
  sense, not being calm after careful thought, and not being rude on purpose.
examples:
- He gave a nonchalant shrug when asked about the money.
- She walked in with a nonchalant air, as if nothing had happened.
