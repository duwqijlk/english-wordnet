simpleMeaning: a very high level of being perfect, with a quality that has no faults at all
scope: 'Also called finish, culture, polish and cultivation: this is a state of being perfect with no
  faults, not the act of cleaning oil, metal or sugar to take out bad parts.'
examples:
- People praised the refinement of her piano playing, which had no faults at all.
- His prose has a refinement that makes every sentence clear and perfect.
