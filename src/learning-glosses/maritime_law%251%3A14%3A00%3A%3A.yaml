simpleMeaning: For ships at sea and for fish caught from it, the rules that many lands share say what
  may and may not be done, and the like.
scope: Also called admiralty law and marine law, it sets the rules many lands share for the sea, not the
  rules of one land alone.
examples:
- Maritime law sets out what a ship may do in waters shared by two lands.
- The captain turned to maritime law over the catch.
