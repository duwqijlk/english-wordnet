simpleMeaning: To say or write something that gives your opinion about something or adds information about
  it.
scope: This is not the act of writing explanations between the lines of a text; it is the act of giving
  an opinion or information about something.
examples:
- Several readers commented on the article's tone.
- The teacher commented that the essay was well organized.
