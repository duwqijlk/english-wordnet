simpleMeaning: The way of life of the first people to live in North America and South America, in times
  long before written records.
scope: 'Also called Paleo-Amerind culture and Paleo-Indian culture: the early way of life of the first
  people in North America and South America, from times long before written records.'
examples:
- The Paleo-American culture was the way of life of the first people of North and South America.
- Paleo-American culture dates from times long before written records.
