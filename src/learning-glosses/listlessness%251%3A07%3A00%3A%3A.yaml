senseId: 'listlessness%1:07:00::'
synsetId: 04644238-n
simpleMeaning: Not doing anything, because of tiredness and a lack of strength or energy.
scope: Also called torpor; a lack of activity that comes from tiredness and having no strength or energy.
examples:
- His listlessness kept him on the sofa all day.
- The heat brought a listlessness over the whole camp.
