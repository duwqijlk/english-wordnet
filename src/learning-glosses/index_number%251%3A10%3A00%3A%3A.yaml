senseId: 'index_number%1:10:00::'
synsetId: 06652323-n
simpleMeaning: a figure or a comparison, a value on a measuring scale, worked out from a set of facts
  that were seen, which can show changes over time when compared
scope: A figure on a measuring scale, worked out from facts that were seen, which shows change over time;
  index, indicator and indicant are other names for this sense, not a single count and not a price on
  its own.
examples:
- The index number rose by three points last month.
- Economists watch the index number to track prices over time.
