simpleMeaning: a little ill, or likely to get ill often
scope: 'Also called unwell, sickly, poorly, peaked, ailing and seedy: a little ill or likely to get ill
  often, not very ill and not unwilling to do something.'
examples:
- She felt a bit indisposed today and stayed at home.
- The indisposed child often missed school in winter.
