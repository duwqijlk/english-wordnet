simpleMeaning: A strong-smelling liquid got from the dried buds of a spice tree and used to give medicines
  a pleasant taste.
scope: This is a strong-smelling liquid got from the dried buds of a spice tree, used to give medicines
  a pleasant taste; oil of cloves is another name for it, not a cooking liquid and not a medicine on its
  own.
examples:
- A drop of clove oil made the cough medicine taste less bitter.
- The chemist added clove oil to the medicine to give it a warm taste.
