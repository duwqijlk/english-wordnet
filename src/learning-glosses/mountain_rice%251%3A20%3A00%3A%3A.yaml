simpleMeaning: Prized as food for grazing animals, this grass grows on the dry high lands and plains of
  the west of North America down to the north of Mexico.
scope: It is also called silk grass or silkgrass, and it is a grass of the dry high lands and plains of
  the west of North America down to the north of Mexico, prized as food for grazing animals.
examples:
- On the dry uplands of the west, mountain rice grows.
- Grazing animals feed on mountain rice in the dry uplands.
