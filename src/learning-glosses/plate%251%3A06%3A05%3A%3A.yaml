simpleMeaning: A horizontal beam in a building or other structure that carries weight and holds other
  parts firmly in place.
scope: This is a load-bearing beam in a structure, not a flat sheet of material and not the protective
  metal covering on a gun.
examples:
- The steel plate carries the load of the floor above.
- A plate bolted to each column anchors the frame.
