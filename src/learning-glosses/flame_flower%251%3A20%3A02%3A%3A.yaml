simpleMeaning: This plant of the group Kniphofia grows long thin leaves like grass, and from it rise tall
  stems of red or yellow blooms that hang down.
scope: Also called a flame-flower, a flameflower, kniphofia, or tritoma, this plant of the group Kniphofia
  grows long thin leaves like grass and tall stems of red or yellow blooms that hang down.
examples:
- The flame flower in the border had tall stems of yellow blooms.
- He planted flame flowers where their long thin leaves would show.
