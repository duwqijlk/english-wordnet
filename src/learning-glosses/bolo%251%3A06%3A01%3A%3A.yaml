simpleMeaning: a cord worn around the neck as a tie, with a pretty clasp holding it in place
scope: Also called bola, bola tie, and bolo tie, this is a cord worn as a neck tie; it is not the long
  heavy knife also called bolo.
examples:
- He wore a bolo with a silver clasp over his shirt.
- Her bolo hung around her neck instead of a cloth tie.
