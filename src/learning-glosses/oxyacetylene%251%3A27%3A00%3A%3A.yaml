simpleMeaning: A mix of two gases that burns hot enough to cut or join metal.
scope: This is a mix of two gases, not one gas alone, and it burns hot enough to cut or join metal.
examples:
- The oxyacetylene flame cut through the metal sheet.
- They lit the oxyacetylene torch to join the metal parts.
