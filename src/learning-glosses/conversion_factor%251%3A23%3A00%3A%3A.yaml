simpleMeaning: a number that a size in one set of units is multiplied by to get it in another set of units
scope: This is a number used to change units, not the size itself and not a rate of exchange.
examples:
- To change miles to kilometres, use the conversion factor 1.609.
- The book gave a conversion factor for changing pounds to kilograms.
