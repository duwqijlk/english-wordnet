simpleMeaning: to make a person feel shy, uncomfortable, and very aware of how they look to others
scope: To make a person feel shy and uncomfortable in front of others, not to block or hold back a person
  or a plan.
examples:
- His loud singing embarrassed his daughter in front of her friends.
- Do not embarrass me by telling that story at dinner.
