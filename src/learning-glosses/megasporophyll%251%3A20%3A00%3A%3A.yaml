senseId: 'megasporophyll%1:20:00::'
synsetId: 11708022-n
simpleMeaning: In plants with no flowers, a leaf that bears only the sacs that make big spores
scope: This is a leaf of a plant with no flowers that bears only the sacs that make big spores, not a
  leaf that bears small spores and not a leaf of a flowering plant.
examples:
- The megasporophyll of the fern bore only large spore sacs.
- Botanists found a megasporophyll on the lower stem of the plant.
