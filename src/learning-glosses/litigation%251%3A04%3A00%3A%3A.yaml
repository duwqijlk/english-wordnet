simpleMeaning: a case in a court of law, where two sides argue so the court can decide and carry out what
  the law says about their rights
scope: 'Also called judicial proceeding: a case argued in court to settle rights under the law, not a
  talk or a vote outside court.'
examples:
- The litigation lasted two years before the court made its decision.
- After months of litigation, the company had to pay the workers what the court ordered.
