simpleMeaning: The weight of a motor vehicle, a rail car, or an aircraft, with no fuel and no load in
  it.
scope: The weight of a motor vehicle, a rail car, or an aircraft with no fuel and no load in it, not a
  weight taken off for packaging, not a counterweight used in testing chemicals, not a grass weed, and
  not a plant grown for feed.
examples:
- The tare of the truck was marked on its side.
- They weighed the empty rail car to find its tare.
