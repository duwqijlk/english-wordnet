simpleMeaning: a person whose back is bent because the top part of the spine is curved in a way that is
  not normal
scope: 'Also called humpback and crookback: this is a person with a bent back, not the bent shape of the
  spine itself.'
examples:
- The old hunchback walked slowly with his back bent.
- In the story, a kind hunchback lives in the tower.
