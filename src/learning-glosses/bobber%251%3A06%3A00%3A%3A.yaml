simpleMeaning: a small piece that floats on water, usually made of cork, and is tied to a fishing line
scope: 'Also called bob and cork: a small float on a fishing line, not a hook and not bait.'
examples:
- The bobber moved when a fish pulled the line.
- He tied a red bobber to his fishing line.
