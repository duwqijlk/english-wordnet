simpleMeaning: the person charged with a crime together with the lawyers who speak for them in court
scope: 'Also called defense: the accused person and their lawyers acting as one side in a case, not the
  accused person''s answer to the charges and not the act of guarding against attack.'
examples:
- The defence called for a mistrial.
- The defence asked the judge to drop the case.
