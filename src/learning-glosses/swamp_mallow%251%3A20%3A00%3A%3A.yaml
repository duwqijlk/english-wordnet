simpleMeaning: A showy bush of the salt marshes of the east of the United States, with big rose-coloured
  flowers.
scope: A showy bush of the salt marshes of the east of the United States, with big rose-coloured flowers;
  also called common rose mallow, rose mallow and swamp rose mallow; not a bush of dry land and not a
  bush with white flowers.
examples:
- Swamp mallow blooms with big rose-coloured flowers in the salt marsh.
- The swamp mallow by the creek is in full flower.
