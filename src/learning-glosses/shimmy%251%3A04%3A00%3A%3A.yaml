simpleMeaning: an energetic dance, often to ragtime music, in which the dancer shakes the shoulders and
  hips a lot
scope: An energetic dance with much shaking of the shoulders and hips, not a shake in a car's wheels and
  not a piece of women's underwear.
examples:
- She did the shimmy to the band's ragtime tune.
- The dancers did the shimmy across the floor.
