simpleMeaning: a plant from the Old World that people often grow, with a stem like wood and large flowers
  that are light pink to red
scope: This plant sense is also called cayenne jasmine, old maid, red periwinkle and rose periwinkle;
  it is not the small sea snail that people eat and not the plant that grows along the ground with blue
  flowers.
examples:
- The periwinkle in her garden has large pink flowers.
- He planted periwinkle because he liked its large red flowers.
