simpleMeaning: a thin tube with a light and a lens that a doctor puts into the stomach to look inside
  it
scope: A thin tube with a light used to look inside the stomach, not a tube for taking food and not a
  tool for cutting.
examples:
- The doctor used a gastroscope to look inside the patient's stomach.
- A gastroscope lets the doctor see the lining of the stomach.
