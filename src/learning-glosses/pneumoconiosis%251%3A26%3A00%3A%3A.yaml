simpleMeaning: A long-lasting lung disease caused by breathing in bits of metal or mineral
scope: A long-lasting lung disease caused by breathing in bits of metal or mineral; pneumonoconiosis is
  another name for this sense, and this is not a short illness from a cold.
examples:
- Pneumoconiosis is a lung disease from breathing in mineral bits.
- Miners can get pneumoconiosis from breathing in metal bits.
