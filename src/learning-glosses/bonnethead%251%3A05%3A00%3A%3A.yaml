simpleMeaning: In bays and where rivers meet the sea, this small, harmless hammerhead shark is found in
  large numbers, with a head shaped like a flat spade.
scope: A bonnethead is also called a bonnet shark or a shovelhead.
examples:
- A bonnethead swam in the bay.
- We saw a bonnethead where the river meets the sea.
