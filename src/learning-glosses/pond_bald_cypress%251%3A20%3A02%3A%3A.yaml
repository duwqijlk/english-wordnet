scope: Also called bald cypress, southern cypress and swamp cypress, this is the wood of a common cone-bearing
  tree of the southeastern United States, not the living tree itself.
examples:
- The table was made of pond bald cypress.
- The pond bald cypress in the table came from trees in the coastal swamp.
