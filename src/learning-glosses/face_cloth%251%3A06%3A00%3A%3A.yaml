simpleMeaning: A piece of washing material used to clean the front of the head and body in the bath.
scope: A washing piece for the front of the head and body in the bath, also called a flannel, a washcloth
  or a washrag; not a towel and not a sponge.
examples:
- She wrung out the face cloth and wiped her cheeks.
- Keep a clean face cloth beside the basin.
