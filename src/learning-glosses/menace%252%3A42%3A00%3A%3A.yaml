simpleMeaning: to be a danger to a person or thing and put them at risk of harm
scope: 'Also called threaten, endanger, peril, and jeopardize: to be a danger to a person or thing, not
  to say or show in words or moves that you will harm someone.'
examples:
- Rising water menaced the small village by the river.
- Bad air menaces the health of people who live in the city.
