simpleMeaning: A rule that says each planet moves round the sun in an oval, with the sun at one of the
  two points that fix the oval's shape
scope: This is the rule that each planet moves round the sun in an oval with the sun at one of the two
  points that fix the oval's shape, not Kepler's other rules about the speed and time of a planet's path.
examples:
- Kepler's first law says the planets move in ovals round the sun.
- By Kepler's first law, the sun sits at one focus of the planet's oval path.
