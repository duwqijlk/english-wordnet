simpleMeaning: white or ivory blooms that usually give off scent at night grow on any of several showy
  orchids of the group Angraecum, whose leaves are dark green and leathery
scope: A showy orchid with dark green leathery leaves and white flowers that smell at night, not a small
  wild orchid with plain flowers.
examples:
- The angrecum opened its white flowers after dark, filling the room with scent.
- Her angrecum has thick dark green leaves and ivory blooms.
