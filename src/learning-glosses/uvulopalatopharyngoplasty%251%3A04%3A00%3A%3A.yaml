senseId: 'uvulopalatopharyngoplasty%1:04:00::'
synsetId: 00690982-n
simpleMeaning: A cutting away by surgery of needless mouth-roof and throat flesh to open the air way,
  meant to cure most grave snoring, with or without stops in sleep breathing.
scope: This sense is also called palatopharyngoplasty.
examples:
- An uvulopalatopharyngoplasty opened the air way.
- Uvulopalatopharyngoplasties cure snoring.
