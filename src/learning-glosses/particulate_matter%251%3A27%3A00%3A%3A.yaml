simpleMeaning: A small separate bit of solid or liquid stuff that stays spread out on its own in gas or
  liquid given off, usually counted as something that dirties the air.
scope: It is also called particulate, and it is a small separate bit of solid or liquid stuff that stays
  spread out on its own in gas or liquid given off.
examples:
- Particulate matter from the smoke filled the air.
- The gas held particulate matter spread out on its own.
