simpleMeaning: The act of bringing new offspring into being, or of increasing numbers that way.
scope: This is the act of breeding or bearing young, not a group of people born at the same time and not
  the making of heat or electricity.
examples:
- The generation of offspring happens once a year in this species.
- Rapid generation of offspring allows the insects to spread quickly.
