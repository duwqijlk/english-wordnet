simpleMeaning: to cut out or change parts of a text that are thought rude or unfit to read
scope: To cut or change the rude parts of a text, not to make a text shorter in general and not to shorten
  a word or a journey.
examples:
- The teacher shortened the old novel by taking out its rude passages.
- They shortened the play by cutting its coarsest jokes.
