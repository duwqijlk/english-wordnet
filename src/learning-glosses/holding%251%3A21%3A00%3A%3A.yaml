simpleMeaning: Anything a person owns, whether an object you can touch or something you cannot touch,
  such as a right.
scope: This is a broad word for what someone owns, including buildings, land and shares kept as investments;
  the act of holding something in your hands is a different word.
examples:
- Her holdings include two houses and a small farm.
- The company sold its overseas holdings last year.
