senseId: inquisitorial%5:00:02:inquiring:00
synsetId: 00882866-s
simpleMeaning: Full of interest in knowing things, especially like a church questioner who asks people
  about what they believe.
scope: Marked by interest in knowing things, especially like a church questioner; not the form of prosecution
  in which the hearings are secret and the accused is questioned by a prosecutor who also acts as judge.
examples:
- The reporters were inquisitorial, pressing her with question after question.
- His manner was inquisitorial, as if he were questioning a prisoner.
