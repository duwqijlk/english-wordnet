simpleMeaning: a seat for a woman on a horse, made so the rider sits with both feet on the same side of
  the horse
scope: This is the seat itself for riding with both feet on one side of the horse, not the word for riding
  in that way.
examples:
- She rode with a sidesaddle so both her feet were on the same side of the horse.
- The old sidesaddle in the museum was made for a woman rider.
