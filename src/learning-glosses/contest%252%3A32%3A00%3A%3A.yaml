simpleMeaning: to argue against something because you say it is wrong, sometimes in court
scope: Contend is another name for this sense. This is to argue against something because you say it is
  wrong, sometimes in court; not a game or a race where a winner is picked.
examples:
- They contested the result of the race.
- She contested the fine in court.
