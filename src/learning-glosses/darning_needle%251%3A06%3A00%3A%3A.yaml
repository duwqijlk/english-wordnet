simpleMeaning: a long sewing pin with a wide hole, made to take thick thread for mending or sewing patterns
scope: 'Also called an embroidery needle: a long pin for mending with thick thread, not a fine pin for
  thin thread and not the insect called a darning needle.'
examples:
- She threaded a darning needle with thick wool to mend the sock.
- A darning needle has a wide eye for heavy thread.
