simpleMeaning: Lilac-pink blooms and leaves shaped like a triangle and an egg mark this plant of Europe,
  which lives year after year and now grows in the United States.
scope: People also call it white mallow, and the word names a plant from Europe now at home in the United
  States.
examples:
- The marsh mallow grows in the United States, though it came from Europe.
- Marsh mallow lives year after year in the United States.
