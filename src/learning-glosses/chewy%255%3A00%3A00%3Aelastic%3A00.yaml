simpleMeaning: of food or its feel in the mouth, needing many bites with the teeth before you can swallow
  it
scope: This is about food that needs much work with the teeth before you can swallow it, not food that
  is soft and easy to swallow, and not food that is hard and dry.
examples:
- The chewy caramels took a long time to eat.
- This bread is chewy and takes much work with the teeth.
