simpleMeaning: a holder for burning incense (sweet-smelling material that is burned), especially one swung
  on a chain in a religious ceremony
scope: 'Also called thurible: this is a holder for burning incense, especially one swung on a chain in
  a religious ceremony; not a plain candle holder and not a box for keeping incense unburned.'
examples:
- The priest swung the censer on its chain during the service.
- Smoke rose from the censer as it was carried down the church.
