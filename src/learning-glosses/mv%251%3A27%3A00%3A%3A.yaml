simpleMeaning: A radioactive element beyond uranium, made by hitting einsteinium with alpha particles;
  it was the old sign for the element, now signed Md.
scope: Also called atomic number 101, Md, and mendelevium; a radioactive element beyond uranium, not a
  stable metal and not a gas.
examples:
- Mv was the old symbol for mendelevium.
- Old books use Mv where new books use Md.
