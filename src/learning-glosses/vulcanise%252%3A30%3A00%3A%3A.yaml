senseId: 'vulcanise%2:30:00::'
synsetId: 00539123-v
simpleMeaning: to go through vulcanization, heating rubber with sulphur so it grows stronger and keeps
  its shape
scope: To go through vulcanization on its own, also called vulcanize; not to put rubber through that process,
  which is the other sense of the same word.
examples:
- The rubber must vulcanise before it can be used for tyres.
- Heat helps the material vulcanise.
