simpleMeaning: Large white blooms and a swollen cup below them mark this plant of the far north of Europe,
  which lives many years.
scope: This plant of the far north of Europe has large white blooms and a swollen cup, and is not the
  sticky-stemmed kind that opens its blooms in the evening.
examples:
- The bladder campion grew in the far north with large white blooms.
- A swollen cup sat below the white blooms of the bladder campion.
