simpleMeaning: fierce anger that rises when you believe someone has done you wrong, counted as one of
  the deadly sins
scope: 'Also called anger: fierce anger that rises when you believe someone has done you wrong, counted
  as one of the deadly sins, not anger on a grand, epic scale.'
examples:
- The king's wrath fell on all who had wronged him.
- She faced his wrath with a calm face.
