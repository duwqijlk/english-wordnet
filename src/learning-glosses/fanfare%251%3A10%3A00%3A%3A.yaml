simpleMeaning: a bright and showy outward show in poor taste
scope: 'Also called flash: a bright, showy show in poor taste. Not a short, lively tune played on brass
  instruments (metal instruments you blow into).'
examples:
- The shop opened with a lot of fanfare, with bright lights and loud music.
- The new shop's fanfare included gold balloons and a red carpet.
