simpleMeaning: A hand tool with a blade that a woodworker pushes across wood to smooth or shape it.
scope: The hand tool a woodworker pushes over wood, not the powered version and not an aircraft.
examples:
- He ran the plane along the edge of the board until it was smooth.
- The carpenter sharpened his plane before starting on the door.
