simpleMeaning: Common through the southern and eastern United States, this coarse prickly weed has pale
  yellow flowers and yellow fruit like small berries
scope: Also called ball nettle, ball nightshade and horse nettle, this coarse prickly weed is common through
  the southern and eastern United States and has pale yellow flowers and yellow fruit like small berries.
examples:
- Bull nettle grew across the southern United States.
- She kept clear of the bull nettle.
