simpleMeaning: A tree grown for wood, of the middle and southeastern United States, with hairy small branches
  and a thick base to its trunk.
scope: A tree grown for wood in the middle and southeastern United States, not a fruit tree and not a
  tree of the far north.
examples:
- The pumpkin ash grows in the southeastern United States.
- Pumpkin ash wood is used for timber.
