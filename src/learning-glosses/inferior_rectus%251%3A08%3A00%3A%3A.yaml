simpleMeaning: An eye muscle that, when it tightens, turns the eyeball down and toward the middle.
scope: An eye muscle that turns the eyeball down and toward the middle, not the muscle that turns the
  eye up and not a muscle that turns it out; inferior rectus muscle is another name for this sense.
examples:
- The inferior rectus turns the eye downward.
- When the inferior rectus tightens, the eyeball moves down.
