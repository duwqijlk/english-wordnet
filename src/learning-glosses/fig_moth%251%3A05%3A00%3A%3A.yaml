simpleMeaning: Stored plant goods of different kinds get bound together with silk threads by the young
  of this small night-flying insect, which feed on them.
scope: Also called almond moth, this is the small night-flying insect whose young bind stored plant goods
  together with silk threads as they feed on them.
examples:
- A fig moth laid eggs among the stored grain.
- The fig moths had bound the dried fruit together with webbing.
