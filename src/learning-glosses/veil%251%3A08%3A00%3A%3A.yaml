simpleMeaning: the inner thin layer around a young animal before it is born, in higher animals with a
  backbone, especially when it covers the head at birth
scope: This is the thin layer around a young animal at birth, not a priest's silk shawl and not the thin
  covering on a young mushroom.
examples:
- The baby was born with a veil over his head.
- A veil covered the newborn calf's head at birth.
