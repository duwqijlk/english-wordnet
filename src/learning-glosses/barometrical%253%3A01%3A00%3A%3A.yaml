simpleMeaning: about the push of the air, or what a barometer, a tool that measures the push of the air,
  shows
scope: 'Also called barometric: about air pressure or what a barometer shows, not a measure of heat or
  of wind.'
examples:
- The barometrical chart showed a sharp fall in pressure.
- He noted the barometrical change before the rain came.
