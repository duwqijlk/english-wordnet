simpleMeaning: If steel or iron cools very slowly, the hard stuff in it may form small round balls instead
  of layers.
scope: 'Also called globular pearlite: when steel or iron cools very slowly, the hard stuff in it may
  form small round balls instead of layers, not a fast-cooled steel and not a layered metal.'
examples:
- Granular pearlite forms when steel cools very slowly.
- The sample showed granular pearlite under the microscope.
