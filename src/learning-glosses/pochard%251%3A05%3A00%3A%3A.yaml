simpleMeaning: A duck of the Old World that dives under water, with a thick body, a grey-and-black body,
  and a head of a red-brown colour
scope: A duck of the Old World that dives under water, with a thick body, a grey-and-black body, and a
  head of a red-brown colour; not a light river duck and not a sea duck with a white head.
examples:
- A pochard dived under the still water.
- We watched the pochard swim among the reeds.
