simpleMeaning: a part of music that comes back again and again or is built on in the same piece
scope: This is a repeated part in music, not a repeated shape or color in a building or in decoration,
  and not a person's reason for doing something.
examples:
- The opening motive returns in every part of the song.
- She heard the same short motive played by the violins again.
