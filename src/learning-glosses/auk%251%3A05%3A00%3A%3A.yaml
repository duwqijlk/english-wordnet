simpleMeaning: A black and white sea bird with a short neck and webbed feet that dives in northern seas
scope: This is a black and white sea bird with a short neck and webbed feet that dives in northern seas,
  not a penguin and not a puffin.
examples:
- The auk dived into the cold northern sea.
- We saw an auk with black and white feathers on the rocks.
