simpleMeaning: a rough drawing of an area made from what a person sees, not from exact measures, showing
  its main parts
scope: A rough drawing of an area's main parts made from what is seen, not an exact map drawn from measures
  and not a full plan.
examples:
- She made a sketch map of the village to show the main roads.
- The guide used a sketch map to point out the hills and the river.
