simpleMeaning: A plain court decision saying which side wins, with no extra findings about the facts.
scope: This is a plain court decision saying which side wins, with no extra findings about the facts,
  not a decision that lists findings about the facts and not a jury that cannot agree.
examples:
- The jury gave a general verdict for the claimant.
- A general verdict ends the case without detailed findings.
