simpleMeaning: in a way that has to do with the way of life of a group of people
scope: In a way that has to do with a group's way of life; not in a way that has to do with nature, money,
  or place alone.
examples:
- The two schools are culturally different, with different songs, food, and holidays.
- She felt culturally at home when she heard her own language spoken.
