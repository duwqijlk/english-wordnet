simpleMeaning: 'A Kant-inspired philosophical movement begun by C. B. Renouvier: it denies we can know
  things as they are in themselves, allowing only what the mind shapes through built-in concepts.'
scope: A Kant-inspired school of thought about what the mind can know, not Kant's own philosophy and not
  literary criticism.
examples:
- His early essays show the strong influence of neocriticism.
- The lecture compared neocriticism with later readings of Kant.
