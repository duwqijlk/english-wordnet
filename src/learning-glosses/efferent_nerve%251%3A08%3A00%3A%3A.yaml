simpleMeaning: A cord in the body that carries signals out to muscles or glands.
scope: 'Also called efferent and motor nerve: a cord in the body that carries signals out to muscles or
  glands, not a cord that carries signals in and not a muscle.'
examples:
- The efferent nerve carries signals to the muscle.
- An efferent nerve fires when the muscle must move.
