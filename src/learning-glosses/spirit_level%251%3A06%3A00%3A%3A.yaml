simpleMeaning: When the bubble in its tube of liquid sits in the middle, the surface under it is flat.
scope: Also called a level, it is a tool that tells whether a surface is flat, by a bubble in a tube of
  liquid.
examples:
- The spirit level showed the shelf was flat when the bubble sat in the middle.
- Hold the spirit level against the shelf and watch the bubble.
