simpleMeaning: used above all of money, not able to be changed for or replaced by other money of the same
  worth
scope: Not able to be changed for other money of the same worth, used above all of money; unconvertible
  and unexchangeable are other names for this sense, not money that is merely weak and not a ban on spending.
examples:
- The inconvertible notes could not be changed for dollars.
- He held inconvertible money that no bank would take.
