schema: oewn-learning-gloss-v2
senseId: 'overcompensate%2:41:00::'
synsetId: 02526026-v
simpleMeaning: to change something more than you need to when you make it right, because you are afraid
  of making a mistake
scope: This is about fixing a thing too much for fear of a mistake, not about trying too hard to make
  up for a weak point you feel bad about.
examples:
- He overcompensated for a small error by checking the page ten times.
- Do not overcompensate when you drive; a small turn is enough.
