simpleMeaning: to take a thing in as part of a wider whole, or to have it within the area one covers
scope: 'Also called cover, embrace, or encompass: to take a thing in as part of a wider whole, or to have
  it within the area one covers.'
examples:
- The new law comprehends all workers in the trade.
- His lands comprehend the whole valley.
