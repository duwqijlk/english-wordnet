simpleMeaning: many plants in the group Plantago, mostly small weeds by roads and yards, with oval leaves
  and small spikes of tiny flowers; seeds of some are used as medicine
scope: This is the small roadside weed, not the banana-like tree also called plantain and not its starchy
  fruit eaten as a vegetable.
examples:
- Plantain grows in cracks by the road, with flat oval leaves close to the ground.
- She picked plantain seeds, which some people use as medicine.
