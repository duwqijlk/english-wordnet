simpleMeaning: In the past this soldier passed on commands, and is the most senior soldier of a group
  of soldiers
scope: The most senior soldier of a group of soldiers, once the one who passed on commands; not a new
  soldier and not an officer of higher rank.
examples:
- The orderly sergeant checked the morning parade before the captain arrived.
- As orderly sergeant, she passed the captain's commands to the men.
