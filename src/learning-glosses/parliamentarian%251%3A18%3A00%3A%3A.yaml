simpleMeaning: a person who knows a lot about the rules and the right way to run meetings of a law-making
  group
scope: This is a person who knows the rules for running such meetings well, not a person chosen to be
  a member of the British Parliament.
examples:
- The parliamentarian told the chair that the vote was not allowed.
- They asked the parliamentarian to check the rules before the meeting.
