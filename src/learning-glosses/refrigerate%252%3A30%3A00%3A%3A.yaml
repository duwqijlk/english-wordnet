simpleMeaning: to make something cold, as if by keeping it in a cold box made for food
scope: To cool or chill something in a cold box made for food; not to freeze it, and not to keep it cool
  in cold weather.
examples:
- Refrigerate this medicine after opening it.
- You should refrigerate the milk as soon as you get home.
