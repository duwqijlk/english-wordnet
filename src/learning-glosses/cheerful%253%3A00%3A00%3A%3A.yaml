simpleMeaning: full of happiness or helping other people feel happy, and having or showing a good mood
scope: This is being happy and showing a good mood, and making others feel happy too, not thinking that
  things will turn out well when that is not likely.
examples:
- She gave us a cheerful smile when we arrived.
- The room looked bright and cheerful with its yellow walls.
