senseId: 'mitigation%1:10:00::'
synsetId: 06754423-n
simpleMeaning: a part excuse used to lessen blame, or a try to make a wrong act seem less bad than it
  looks by showing facts that help explain it
scope: Also called extenuation, this is an excuse or argument that a wrong act is less bad than it looks;
  it is not the act of making a bad thing itself less strong or less hard.
examples:
- In mitigation, his lawyer said he had been ill and under great stress.
- The judge heard the mitigation but still gave him a strong punishment.
