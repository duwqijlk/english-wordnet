simpleMeaning: A sudden quick movement of the throat, as if swallowing.
scope: A sudden quick movement of the throat, as if swallowing, with gulp as another name for this sense,
  and not the act of swallowing food or drink.
examples:
- His gulping gave away how nervous he was.
- She heard his gulping as he tried to speak.
