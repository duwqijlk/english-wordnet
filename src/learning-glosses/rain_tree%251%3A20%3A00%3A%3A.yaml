simpleMeaning: Grown for decoration, this tree of the American tropics grows large, with doubly divided
  leaves made of many tiny leaflets, spherical bunches of red-stamened flowers, and pods grazed by cattle.
scope: Another name for the large ornamental tree of the American tropics also called monkey pod and zamang;
  it is the tree itself, not a weather term.
examples:
- The rain tree dropped its pods across the lawn.
- A rain tree can spread wider than it is tall.
