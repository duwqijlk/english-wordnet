simpleMeaning: The look of a room people can live in, made by how its things are set out and what is put
  in it.
scope: The look of a room people can live in, made by how its things are set out and what is put in it,
  also called decor; not the work of arranging a room and not the outside of a house.
examples:
- The interior decoration of the flat pleased the guests.
- She chose the interior decoration for the new house.
