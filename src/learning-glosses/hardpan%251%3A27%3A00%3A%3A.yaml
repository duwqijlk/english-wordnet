simpleMeaning: a crust or layer of tough earth below the surface, coated with calcium carbonate, a white
  mineral, found in dry or half-dry land
scope: 'Also called caliche: a tough crust of earth below the surface in dry land, not topsoil and not
  rock.'
examples:
- The farmer could not dig through the hardpan under the field.
- Hardpan forms in dry land where the soil is coated with minerals.
