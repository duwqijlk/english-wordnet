simpleMeaning: The tough threads that hold a blood clot together are broken down by this enzyme, a thing
  in the body that makes changes happen
scope: Also called fibrinolysin, this is a thing in the body that breaks down blood clots, not a thing
  that makes blood clot.
examples:
- Plasmin breaks down the fibrin in a blood clot.
- After the wound healed, plasmin dissolved the clot.
