simpleMeaning: to make a song or tune waver fast between a note and the one a half step higher or lower
scope: Singing or playing with fast wavering notes, also called trill and quaver, not singing that shifts
  between high and low voice levels and not a lump under an animal's skin.
examples:
- The bird warbled in the morning light.
- She warbled the tune, her voice rising and falling on each note.
