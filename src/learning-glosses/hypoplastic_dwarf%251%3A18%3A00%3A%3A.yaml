senseId: 'hypoplastic_dwarf%1:18:00::'
synsetId: 10492032-n
simpleMeaning: A short person with short arms and legs whose small size comes from a fault in the genes,
  while the body, mind and sexual growth are all normal.
scope: A short person with short arms and legs whose small size comes from a fault in the genes, with
  body, mind and sexual growth all normal; normal dwarf is another name for it, not a short person whose
  growth is held back by poor food.
examples:
- The hypoplastic dwarf grew up with normal mind and body apart from his short size.
- Doctors said the hypoplastic dwarf would need no special care.
