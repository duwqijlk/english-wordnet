simpleMeaning: A low plant that stays green all year, a common kind from the Old World with many forms,
  grown widely in the north of the world.
scope: This is a low plant that stays green all year, common in the Old World with many forms and grown
  widely in the north; broom, ling, heather and Scots heather are other names for it, not other low green
  plants of other regions.
examples:
- Calluna vulgaris covered the hillside in bloom.
- We planted Calluna vulgaris along the garden path.
