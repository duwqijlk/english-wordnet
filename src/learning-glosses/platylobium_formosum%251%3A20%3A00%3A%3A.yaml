simpleMeaning: A green shrub all year round with leaves almost shaped like a heart and bright yellow flowers
  like peas, followed by flat pods with flat wings, from Australia and Tasmania.
scope: Also called flat pea; a green shrub of Australia and Tasmania with almost heart-shaped leaves and
  bright yellow flowers like peas, followed by flat winged pods.
examples:
- Platylobium formosum flowered bright yellow in the Australian garden.
- The flat pods of Platylobium formosum followed its yellow flowers.
