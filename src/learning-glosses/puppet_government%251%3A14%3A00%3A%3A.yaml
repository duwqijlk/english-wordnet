simpleMeaning: A group that rules a country but was put in place by an outside power, which tells it what
  to do and may make life hard for those it rules
scope: A group that rules a country but takes orders from an outside power; also called puppet regime
  and puppet state. Not a group freely chosen by the people it rules, and not a group that answers to
  no one.
examples:
- The puppet government did what the foreign power told it to do.
- People said the puppet government was not free to make its own laws.
