simpleMeaning: swelling and red skin on the hands and feet, caused by cold and wet
scope: Also called chilblain, this is swelling and red skin on the hands and feet caused by cold and wet,
  not swelling from a hit or a bite.
examples:
- Working outside in the wet winter gave him chilblains on his toes.
- Her chilblains made her fingers red and sore in the cold weather.
