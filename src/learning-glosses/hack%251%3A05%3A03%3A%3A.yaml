simpleMeaning: A horse with a saddle on it that you ride to travel from place to place or for other such
  uses, not one kept for sport
scope: A horse ridden to get from one place to another, not for sport, not a tool for breaking up soil
  and not a politician in a small group.
examples:
- He rode a hack to the next town.
- The old hack carried him along the road each day.
