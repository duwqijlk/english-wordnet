simpleMeaning: likely to make a person no longer drunk, or think in a more serious way
scope: Describes something that makes a person no longer drunk or more serious in mind; not something
  that makes a person drunk or light and happy.
examples:
- The sobering news about the crash made everyone quiet.
- It was a sobering thought that the money was almost gone.
