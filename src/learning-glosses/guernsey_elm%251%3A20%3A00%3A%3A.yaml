simpleMeaning: A kind of English tree with straight-up branches and wider leaves.
scope: A kind of English tree with straight-up branches and wider leaves, not a wych elm and not an oak.
examples:
- The guernsey elm stood tall with straight branches.
- Guernsey elms line the old lane with their broad leaves.
