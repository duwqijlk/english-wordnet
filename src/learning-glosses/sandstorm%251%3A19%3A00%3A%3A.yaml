simpleMeaning: A storm in which strong wind picks up dust or sand and carries it through the air in thick
  clouds
scope: 'Also called duster, sirocco, and dust storm: a strong wind carrying clouds of dust or sand, not
  a rainstorm or a snowstorm.'
examples:
- A sandstorm covered the desert town in dust.
- We stayed inside while the sandstorm passed over the village.
