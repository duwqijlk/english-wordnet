simpleMeaning: Too much watery fluid builds up in the cells, the soft parts of the body, or the wet hollow
  spaces, and that build-up is a swelling.
scope: It is also called edema, dropsy, and hydrops, a swelling from too much watery fluid building up
  in the body.
examples:
- Oedema made the tissues swell with fluid.
- The swelling of oedema came from fluid building up.
