simpleMeaning: A room, often below the ground, made strong to keep out blasts and stocked with food and
  things for living, used during air raids
scope: A room, often below the ground, made strong against blasts and stocked for living; bombproof and
  air-raid shelter are other names for this sense, not a cellar for storing food and not a trench for
  soldiers.
examples:
- The family ran to the bomb shelter when the siren sounded.
- Their bomb shelter was stocked with food and water.
