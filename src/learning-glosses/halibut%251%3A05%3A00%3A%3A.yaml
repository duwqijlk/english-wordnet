simpleMeaning: a sea fish that people eat, from the north Atlantic or north Pacific; it is the biggest
  flat fish and one of the biggest fish with bones
scope: This is the live sea fish itself, also called holibut; it is not just the soft part of the fish
  that people eat.
examples:
- The fisher caught a halibut in the cold north sea.
- A halibut can grow very large and lies flat on the sand.
