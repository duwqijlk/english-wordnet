simpleMeaning: doing a thing with no thought or plan, and no good reason behind it
scope: Doing a thing with no thought or plan and no good reason behind it; not doing it with your eyes
  shut.
examples:
- She followed the new leader blindly, asking no questions at all.
- They bought the car blindly, without even a test drive.
