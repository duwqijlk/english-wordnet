simpleMeaning: a way of sorting statements by whether they say something must be so, can be so, or cannot
  be so
scope: Also called mode. It is not a way of treating illness, and not the forms of verbs that show how
  a speaker sees an action.
examples:
- The teacher explained modality by asking if each statement said must, can, or cannot.
- In this lesson on modality, we sorted claims about what has to happen from claims about what may happen.
