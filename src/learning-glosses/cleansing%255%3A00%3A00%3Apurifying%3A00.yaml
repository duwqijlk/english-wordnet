simpleMeaning: that washes the body clean, especially in a religious washing act, such as washing the
  hands
scope: 'Also called ablutionary: this word describes washing the body, especially as a religious act.
  Not the act of making a thing clean in general.'
examples:
- The priest poured cleansing water over his hands.
- A cleansing bath is part of the ceremony before the feast.
