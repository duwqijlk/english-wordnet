simpleMeaning: White or pink flowers grow on this upright Old World plant that lives for years, with leaves
  that smell faintly sweet, and it now grows in the United States.
scope: Also called mus rose, it is an upright plant of the Old World with white or pink flowers, now also
  found in the United States, not the tropical plant with yellow or pink to scarlet blooms.
examples:
- The musk mallow by the wall had white flowers with a faint sweet smell.
- Musk mallow now grows in parts of the United States.
