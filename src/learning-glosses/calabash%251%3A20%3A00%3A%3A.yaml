simpleMeaning: A green plant from tropical America that keeps its leaves all year and grows big round
  gourds.
scope: A tropical American evergreen that bears large round gourds, also called a calabash tree; not the
  bottle made from its gourds and not a palm.
examples:
- The calabash shades the yard.
- Large round gourds hang from the calabash.
