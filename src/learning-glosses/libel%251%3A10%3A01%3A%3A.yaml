schema: oewn-learning-gloss-v2
senseId: 'libel%1:10:01::'
synsetId: 06574427-n
simpleMeaning: a written paper by a person who sues, saying what false printed words harmed their good
  name and what help they ask the court for
scope: This sense is the paper that starts a case about harm to a good name, not the false printed words
  themselves and not the act of printing them.
examples:
- In his libel, he told the court how the article had hurt his good name and asked for money.
- The lawyer read the libel to the court, which set out the claim and the help the man wanted.
