senseId: 'blemish%2:35:00::'
synsetId: 01540949-v
simpleMeaning: to spoil something by leaving a mark or fault on it
scope: Another name for this sense is spot, as a verb. This is spoiling a thing by leaving a mark or fault
  on it, not the mark or fault itself, which is the noun sense.
examples:
- A deep scratch blemished the smooth top of the table.
- Her face was blemished by a small scar.
