simpleMeaning: with bits of ham, corn loaf is the kind usually made in a shallow pan over an open fire,
  and at times an Irish soda loaf
scope: It is also called fry bread, bread usually made in a shallow pan over an open fire, above all corn
  loaf with bits of ham, not bread baked in an oven.
examples:
- They cooked skillet bread over the open fire.
- Skillet bread with bits of ham was made in the pan.
