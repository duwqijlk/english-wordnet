simpleMeaning: one or more letters that come after a dot at the end of a computer label for a piece of
  work, and that need not be there
scope: 'Also called an extension and a filename extension: one or more letters after a dot at the end
  of a computer label, not the main part of the label and not a word on its own.'
examples:
- The file name extension .BAS shows that the work was made in BASIC.
- She typed the file name extension after the dot.
