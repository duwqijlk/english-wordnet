simpleMeaning: having a certain kind of sound or colour, often used joined with another word that names
  that kind
scope: Used for a stated kind of sound or colour, often in joined words like deep-toned; not used for
  a body with firm muscles.
examples:
- The full-toned sound of the bell filled the hall.
- She spoke in a soft-toned, calm voice.
