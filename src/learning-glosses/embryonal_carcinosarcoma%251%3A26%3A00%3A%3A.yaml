simpleMeaning: a growth in the body made of young cells that have not yet grown into one kind of cell
scope: 'Also called blastocytoma and blastoma: a growth in the body made of young cells that have not
  yet grown into one kind, not a growth of one kind of cell and not a sore on the skin.'
examples:
- The doctors found an embryonal carcinosarcoma in the child's kidney.
- An embryonal carcinosarcoma grows from cells that have not yet taken on one form.
