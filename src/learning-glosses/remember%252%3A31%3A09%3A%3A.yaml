senseId: 'remember%2:31:09::'
synsetId: 00613035-v
simpleMeaning: Honor the memory of a person or thing and keep that memory alive, for example through a
  ceremony.
scope: This is not mentioning someone in greeting or to show friendship; it is honoring a memory, often
  in a ceremony.
examples:
- Every November, the village gathers to remember the soldiers who died in the war.
- A memorial service was held to remember the victims of the disaster.
