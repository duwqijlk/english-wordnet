simpleMeaning: A frame that closes round a very young child, on small wheels, that helps the child learn
  to walk
scope: A wheeled frame that holds a very young child while it learns to walk, not a pushchair and not
  a toy car; walker and go-cart are other names for it.
examples:
- The baby-walker rolled across the kitchen floor.
- She put her son in the baby-walker so he could practise walking.
