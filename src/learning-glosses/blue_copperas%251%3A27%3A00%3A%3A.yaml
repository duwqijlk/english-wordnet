simpleMeaning: a form of copper sulfate, a salt of the metal copper, that holds water and makes clear
  sky-coloured crystals
scope: 'Also called blue stone, blue vitriol and chalcanthite: a water-holding form of copper sulfate,
  not the dry form and not a green salt of copper.'
examples:
- The sample of blue copperas showed clear crystals under the lens.
- Blue copperas was kept in a sealed jar so it would stay dry.
