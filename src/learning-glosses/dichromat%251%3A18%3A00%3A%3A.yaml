senseId: 'dichromat%1:18:00::'
synsetId: 10031313-n
simpleMeaning: a person who sees the world in only two colours, in one of several different ways, instead
  of the full range
scope: A person who sees the world in only two colours; not a person who sees no colour at all, and not
  a person with normal colour sight.
examples:
- The dichromat could not tell red from green.
- As a dichromat, she saw the sunset in shades of blue and yellow.
