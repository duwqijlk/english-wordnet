simpleMeaning: In grammar, a word like 'myself' or 'herself', made by adding '-self' to a pronoun, used
  when the doer of an action is also the one it happens to
scope: This is a pronoun like 'myself' that shows the doer of an action is also the one it happens to;
  not an ordinary pronoun like 'he' or 'she'.
examples:
- In 'She hurt herself', 'herself' is a reflexive.
- '''Themselves'' is a reflexive pronoun.'
