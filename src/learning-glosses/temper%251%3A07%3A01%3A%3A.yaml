simpleMeaning: how springy and hard a piece of metal is, and how much force it can take before it breaks
scope: How springy and hard a piece of metal is, not a quick burst of anger, and not a person's mood.
examples:
- The temper of the steel made it hard to bend.
- A good temper in the blade kept it from snapping.
