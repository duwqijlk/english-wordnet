simpleMeaning: The study of the earth's land and seas, and of how people live with its hills, weather,
  soil, and plants.
scope: The study of the earth's surface and how people live with it, not the study of rocks alone or of
  weather alone.
examples:
- She studied geography at school and learned to read maps.
- The geography of the valley shapes the way people farm there.
