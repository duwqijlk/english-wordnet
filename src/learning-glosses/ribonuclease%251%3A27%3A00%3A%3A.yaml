simpleMeaning: a protein that splits ribonucleic acid, a cell acid that carries the code for making proteins,
  into smaller parts using water
scope: 'Also called ribonucleinase: a protein that splits ribonucleic acid, not a protein that joins pieces
  together and not a protein that copies the acid.'
examples:
- Ribonuclease broke down the ribonucleic acid in the test tube.
- They added ribonuclease to clear the RNA from the sample.
