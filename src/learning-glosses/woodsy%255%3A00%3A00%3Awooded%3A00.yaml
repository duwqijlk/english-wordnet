simpleMeaning: like a forest, or reminding you of a forest
scope: This describes something that is like a forest or that reminds you of a forest; it is not a thing
  made of wood, and it is not simply land covered with trees.
examples:
- The room had a fresh, woodsy smell from the pine branches.
- We walked along a woodsy path under tall trees.
