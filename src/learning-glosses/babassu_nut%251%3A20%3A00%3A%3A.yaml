simpleMeaning: a hard seed with a tough shell that grows on a palm tree
scope: A hard seed with a tough shell from a palm tree, not the palm tree itself and not the soft flesh
  of a fruit.
examples:
- She cracked a babassu nut to get at the flesh inside.
- He gathered babassu nuts from the ground under the palm.
