simpleMeaning: A sheet of paper without sizing, treated with a dye, used to show whether a liquid is an
  acid or a base.
scope: What shows if a liquid is an acid or a base is this plain sheet soaked in a dye, not writing paper
  and not a strip that measures heat.
examples:
- She dipped the litmus paper in the solution to test it.
- The litmus paper turned red in the acid.
