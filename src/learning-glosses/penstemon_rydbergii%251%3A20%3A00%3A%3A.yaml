simpleMeaning: A plant with rings of small dark blue-purple flowers, found from Washington to Wyoming
  and south to California and Colorado.
scope: Also called Rydberg's penstemon; a plant of the western states, set apart from other penstemons
  by its rings of small dark blue-purple flowers.
examples:
- Penstemon rydbergii grew in rings of dark flowers along the path.
- The Penstemon rydbergii we found in Wyoming had small blue-purple blooms.
