simpleMeaning: A liquid put on the skin to soothe it, kill germs, or heal it.
scope: A liquid for the skin that soothes or heals, also called an application, and not a cream for beauty
  alone.
examples:
- She put lotion on her dry hands.
- This lotion will soothe the sunburn.
