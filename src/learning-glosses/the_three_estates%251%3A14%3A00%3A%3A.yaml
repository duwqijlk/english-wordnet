simpleMeaning: Seen as a whole in the public life of a country, one of its great groups of people once
  held its own political rights, above all in Britain.
scope: Estate and estate of the realm are other names for one of the great groups of people in a country,
  seen as a whole in its public life and once holding its own political rights.
examples:
- The clergy formed one of the three estates in old France.
- The nobles were one of the three estates.
