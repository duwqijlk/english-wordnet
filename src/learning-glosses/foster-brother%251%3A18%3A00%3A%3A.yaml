simpleMeaning: A boy or man who is not your parents' son but who was brought up by your parents
scope: This is a boy or man who is not your parents' son but who was brought up by your parents, also
  called foster brother; it is not your parents' own son and not a close friend.
examples:
- My foster-brother grew up in our house from the age of three.
- Her foster-brother still calls her every Sunday.
