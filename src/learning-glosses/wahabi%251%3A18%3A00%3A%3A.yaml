simpleMeaning: A member of a strictly orthodox Sunni Muslim group from Saudi Arabia, working to purify
  Islamic beliefs and rejecting any new idea that came after the third century of Islam.
scope: Also called Wahhabi; a member of a strictly orthodox Sunni Muslim group from Saudi Arabia, not
  a member of a Shia group and not a Muslim who accepts later innovations.
examples:
- The Wahabi scholar taught in Riyadh.
- He was raised as a Wahabi in Saudi Arabia.
