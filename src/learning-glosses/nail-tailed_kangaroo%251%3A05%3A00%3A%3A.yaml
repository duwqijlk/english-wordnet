simpleMeaning: Small wallabies with a hard, horn-like point on the tip of the tail.
scope: Small wallabies with a hard point on the tip of the tail; nail-tailed wallaby is another name for
  this, and it is not a big kangaroo or a wallaby with no point on its tail.
examples:
- The nail-tailed kangaroo hopped through the scrub.
- A nail-tailed kangaroo has a hard point on its tail.
