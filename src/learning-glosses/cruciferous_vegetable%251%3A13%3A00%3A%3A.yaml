simpleMeaning: A vegetable of the mustard family, above all mustard greens, various cabbages, broccoli,
  cauliflower, and brussels sprouts.
scope: A mustard-family vegetable such as broccoli or cauliflower, not a bean or a potato.
examples:
- Broccoli is a cruciferous vegetable I cook often.
- She grows cruciferous vegetables like cauliflower in her garden.
