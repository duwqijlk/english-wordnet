simpleMeaning: The base unit of light strength in the modern metric system; equals 1/60 of the light from
  a square centimetre of an ideal radiator at 2,046 kelvin.
scope: This is the unit of light intensity, another name for the candle; it is not the wax candle that
  burns.
examples:
- The candela is the SI unit used to measure how bright a light source is.
- This lamp has a brightness of about 1,200 candelas.
