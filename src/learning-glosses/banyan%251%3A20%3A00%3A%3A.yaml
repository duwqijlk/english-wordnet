simpleMeaning: a tree from India that sends out new growth from its branches. This growth goes down into
  the ground and makes new trunks
scope: Also called banian, banian tree, and banyan tree. This is the tree from India that grows new trunks
  from its branches; it is not the loose jacket first worn in India.
examples:
- A huge banyan stood in the middle of the village.
- Birds sat in the branches of the old banyan.
