simpleMeaning: the turned-back part at the front of a woman's garment, showing its back side
scope: This is the folded-back front of a woman's garment; revers is another name for this sense; not
  a collar, and not the act of honouring someone.
examples:
- The revere of her coat was lined with silk.
- She smoothed the revere flat before the photograph.
