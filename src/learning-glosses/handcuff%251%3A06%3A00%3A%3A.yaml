simpleMeaning: a metal ring that locks around a person's wrist, usually used in pairs, one on each wrist
scope: 'Also called a cuff: a metal ring that locks around the wrist, usually in a pair; not a bracelet,
  and not the verb sense of locking someone up.'
examples:
- The officer put a handcuff on each of the man's wrists.
- The police took off the handcuffs after the arrest.
