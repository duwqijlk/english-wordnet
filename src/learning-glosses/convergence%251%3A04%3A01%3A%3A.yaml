simpleMeaning: the act of two or more things coming closer together
scope: Also called converging, this is things coming closer together. It is not a shared idea between
  two sets of ideas, and not things moving apart.
examples:
- The convergence of the two roads surprised the driver.
- We watched the convergence of the two lines on the page.
