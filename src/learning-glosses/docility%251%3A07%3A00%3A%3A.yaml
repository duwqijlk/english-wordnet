simpleMeaning: the quality of being easy to lead or control and happy to do what others say
scope: 'This is a lasting quality in a person or animal: being easy to manage and willing to follow others.
  It is not one single act of doing what you are told.'
examples:
- The dog's docility made it easy to train.
- Her docility helped the new teacher settle the class quickly.
