simpleMeaning: In a way that looks at what works in real life, not at fine ideas about how things ought
  to be.
scope: Acting with an eye to what works in real life, not to theory or fine ideas.
examples:
- We must act pragmatically if we want the plan to work.
- She dealt with the problem pragmatically, taking the quickest useful step.
