simpleMeaning: Those leaving school hear the best of their class give a goodbye speech at the leaving
  ceremony.
scope: Valediction, valedictory, and valedictory address are other names for this goodbye speech, given
  by the best of a class that is leaving school.
examples:
- The valedictory oration said goodbye to the class that was leaving.
- The best of the class gave the valedictory oration at graduation.
