simpleMeaning: the back or top part of a theatre with the cheapest seats
scope: The back or top seats of a theatre, cheapest of all; family circle, peanut gallery and upper balcony
  are other names for this sense, not the seats at the front or the best seats in the middle.
examples:
- We sat in the second balcony and could still hear every word.
- The second balcony had the cheapest seats in the theatre.
