simpleMeaning: in a way that makes someone feel less sad, worried, or in pain
scope: 'Also called consolingly: done in a way that helps someone feel calmer and less sad, not just in
  a kind or cheerful way.'
examples:
- She spoke comfortingly to the child until he stopped crying.
- The nurse smiled comfortingly and told him the pain would soon pass.
