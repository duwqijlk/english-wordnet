simpleMeaning: made or done to look for something new or to find out about a place or subject
scope: Used for a first look or test to find out about something, not for a final job that uses what was
  already found.
examples:
- They made an exploratory trip into the valley to look for water.
- The doctors did an exploratory operation to find the cause of the pain.
