simpleMeaning: This plant bears bright yellow flowers that stand out, and it comes back year after year
  in the east of the United States
scope: This is a plant of the eastern United States with bright yellow flowers, also called golden honey
  plant, not a yellow flower of the west and not a plant that lives for one year only.
examples:
- Golden ironweed grew along the road in the eastern United States.
- We saw golden ironweed with bright yellow flowers in the field.
