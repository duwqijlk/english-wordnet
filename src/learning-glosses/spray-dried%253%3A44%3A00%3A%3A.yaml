simpleMeaning: made into a powder by blowing hot air over a fine mist of a thing such as milk or soap,
  then gathering what is left
scope: It is a way of drying a sprayed thing such as milk or soap into powder.
examples:
- They bought spray-dried milk.
- She used spray-dried soap.
