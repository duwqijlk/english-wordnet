simpleMeaning: a part shaped like a long thin round tube, forming part of a larger thing
scope: 'Also called shank: a long thin round part of a thing, not the tube of a pipe used for smoking
  and not the part that holds up a plant.'
examples:
- The stem of the wine glass broke when it fell.
- The small stem on the watch is used to set the time.
