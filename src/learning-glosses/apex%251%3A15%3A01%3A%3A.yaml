simpleMeaning: the spot in the sky toward which the sun and the whole solar system seem to move, as seen
  against the stars that stay put
scope: The spot in the sky toward which the sun and the whole solar system seem to move; not the highest
  point of a thing, and not the tip of a shape.
examples:
- Astronomers worked out the apex toward which the solar system moves.
- The sun's apex lies in the direction of the constellation Hercules.
