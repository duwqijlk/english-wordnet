simpleMeaning: a party where friends come together to give gifts, usually of one set kind, to one person
scope: A party where friends give gifts to one person, not the thing in the bathroom that sprays water
  and not a short fall of rain.
examples:
- Her friends held a baby shower for her last week.
- They held a bridal shower and gave her things for her new home.
