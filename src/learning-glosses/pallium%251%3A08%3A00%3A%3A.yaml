simpleMeaning: In zoology, a thin skin layer that guards soft animals with shells and gives off the stuff
  that makes the shell
scope: 'Also called mantle: in zoology, a skin layer in shell animals that makes shell stuff, not the
  brain layer or the church garment also called pallium.'
examples:
- The pallium in a clam gives off the stuff that forms its shell.
- A snail's pallium lies just under the shell and guards its soft body.
