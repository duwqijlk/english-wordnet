  that hold it up on the water
scope: 'Also called a pontoon plane: a flying machine that lands on water, not one that lands on a runway
  and not a boat.'
examples:
- The floatplane landed on the lake and taxied to the dock.
- A floatplane can take off from the river near our cabin.
