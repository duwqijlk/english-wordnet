simpleMeaning: A one-year twining vine with a root tuber, with sprays of purplish blooms, pods bearing
  four toothed wings, from the hot lands of the Old World.
scope: This sense is also called goa bean, goa bean vine, and winged bean.
examples:
- A winged pea twined up the pole.
- Winged peas bear purplish blooms.
