simpleMeaning: The large gut gets its blood from this tube, which starts near the low end of the aorta,
  the body's main blood tube
scope: A blood tube that feeds the large gut from near the low end of the aorta; not the upper gut artery
  and not a vein.
examples:
- The inferior mesenteric artery carries blood to the large intestine.
- The surgeon clamped the inferior mesenteric artery near the aorta.
