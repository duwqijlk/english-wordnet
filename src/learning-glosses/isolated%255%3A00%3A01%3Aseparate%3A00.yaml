simpleMeaning: split off from things that are usually next to each other and touching
scope: This sense is about things split from parts next to them; it is not about a place far from people,
  and not about a person kept apart for health reasons.
examples:
- The study looked at an isolated group of cells, split away from the main group.
- One isolated piece sat alone, apart from the parts it usually touched.
