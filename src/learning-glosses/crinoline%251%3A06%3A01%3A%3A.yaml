simpleMeaning: A full, stiff underskirt made from the cloth that shares its name.
scope: A full, stiff underskirt made from the cloth that shares its name; not the stiff, coarse cloth
  itself, used to stiffen hats or clothes, and not a skirt stiffened with hoops.
examples:
- Her crinoline rustled as she walked through the doorway.
- The dancer's crinoline held their skirt out in a wide bell.
