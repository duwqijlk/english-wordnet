simpleMeaning: a sheet with several pages printed on it; it is folded to the size of a page and joined
  with other such sheets to make a book
scope: A printed sheet folded to page size and joined with others to make a book, not the music marks
  that show the key and not a tune that shows who a performer or show is.
examples:
- The bookbinder folded each signature before sewing them together.
- This old book is made of sixteen signatures bound in leather.
