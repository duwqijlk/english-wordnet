simpleMeaning: A two-year Eurasian plant with white hairs and pale purple flowers, now growing wild in
  North America
scope: Also called cotton thistle, woolly thistle, Onopordon acanthium and Onopordum acanthium; a white-haired
  Eurasian thistle with pale purple flowers that now grows wild in North America, its near kin being the
  common thistle and the milk thistle.
examples:
- Scotch thistle grew tall along the fence, its pale purple flowers open.
- We cut back the Scotch thistle before it seeded.
