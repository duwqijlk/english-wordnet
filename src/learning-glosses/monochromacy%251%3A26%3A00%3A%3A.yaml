simpleMeaning: Only how light or dark a thing is tells its colours apart for a person who sees no colour
  at all
scope: 'Also called monochromasy, monochromatic vision, monochromatism and monochromia: a state of seeing
  with no colour at all, not poor colour sight and not night blindness.'
examples:
- People with monochromacy see the world in shades of grey.
- Monochromacy means red and green look the same shade to her.
