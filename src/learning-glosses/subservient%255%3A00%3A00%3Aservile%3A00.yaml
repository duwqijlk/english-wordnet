simpleMeaning: far too ready to obey others and do what they want, like a slave or a servant
scope: 'Also called submissive and slavish: far too ready to obey others, not just helpful or polite,
  and not simply lower in rank than another thing.'
examples:
- He was so subservient that he agreed to every order without a question.
- She played a subservient part and did whatever her boss told her to do.
