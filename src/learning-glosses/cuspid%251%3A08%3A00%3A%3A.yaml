simpleMeaning: One of the four pointed cone-shaped teeth, two in each jaw, that sit between the front
  teeth and the back teeth
scope: This is one of the four pointed teeth between the front and back teeth; canine, canine tooth, dogtooth,
  eye tooth and eyetooth are other names for this sense.
examples:
- The cuspid tore at the meat.
- His upper cuspid ached after the fall.
