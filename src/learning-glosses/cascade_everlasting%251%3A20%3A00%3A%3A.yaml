synsetId: 12020125-n
simpleMeaning: A shrub whose branches and leaves carry fine white hairs, with fragrant flowers in long
  sprays that dry well; it is sometimes placed in the genus Helichrysum.
scope: This is the woolly shrub whose fragrant flowers are dried for decoration; the name does not refer
  to the low everlasting daisies of open grassland.
examples:
- Cascade everlasting has white, woolly branches and long sprays of fragrant flowers.
- She dried cascade everlasting for winter arrangements because the flowers keep their shape.
