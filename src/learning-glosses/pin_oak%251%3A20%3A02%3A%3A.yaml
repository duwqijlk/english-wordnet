simpleMeaning: In wet ground of the southeastern United States grows this large tree, which keeps most
  of its leaves through the winter.
scope: Also called a laurel oak, it is a large tree that keeps most of its leaves through the winter and
  does well in wet ground.
examples:
- The pin oak kept most of its leaves through the winter.
- In damp soil, the pin oak does well.
