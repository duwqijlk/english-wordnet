simpleMeaning: A line on a map joining places where earthquake shocks are felt with the same strength
scope: A line on a map joining places where earthquake shocks are felt with the same strength, not a line
  of equal hail and not a line of equal flowering.
examples:
- The isoseismal on the map rings the area of strongest shaking.
- Geologists draw isoseismals after each big quake.
