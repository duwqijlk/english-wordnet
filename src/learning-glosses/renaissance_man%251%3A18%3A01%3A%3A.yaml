simpleMeaning: A scholar of those days who could know almost everything about a wide range of topics,
  when there was less to know.
scope: A scholar of that time who could know almost everything about many topics, not a scholar of today
  who knows more than a little about many different things.
examples:
- He was a Renaissance man who could speak about history, art, and science.
- People called him a Renaissance man because he knew almost everything about so many topics.
