simpleMeaning: used most often of muscles that pull parts together toward the middle of the body or toward
  a nearby part
scope: A word for a muscle that pulls parts together toward the middle of the body or toward a nearby
  part, also called adducting or adductive; not a muscle that pulls parts apart.
examples:
- The adducent muscles of the thigh pull the legs together.
- An adducent muscle draws the arm toward the middle of the chest.
