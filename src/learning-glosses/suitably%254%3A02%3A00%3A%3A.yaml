simpleMeaning: in a way that is right or fitting for what is happening at the time
scope: 'Also called properly, appropriately, duly, fitly and fittingly: this means in a way right for
  the place and time, not just in any good way.'
examples:
- She was suitably dressed for the cold weather.
- Please behave suitably when guests are in the house.
