simpleMeaning: a building block of protein that the body must get from food, needed for growth and for
  mending body tissue
scope: A building block of protein the body must get from food, needed for growth and mending tissue,
  not a vitamin and not a drug.
examples:
- Histidine is one of the amino acids found in meat and beans.
- Babies need histidine for healthy growth.
