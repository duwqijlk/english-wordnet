senseId: 'hieroglyphic%1:10:01::'
synsetId: 06415322-n
simpleMeaning: Writing that looks like picture-signs, usually because no one can read it.
scope: 'Also called hieroglyph: writing that looks like picture-signs, usually because it cannot be read;
  not writing actually in the picture-sign system, and not the adjective sense that only looks like such
  writing.'
examples:
- His handwriting was pure hieroglyphic to the clerk.
- The doctor's hieroglyphic notes puzzled the nurse.
