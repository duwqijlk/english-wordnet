simpleMeaning: A plant from Europe and Asia, with pink to purple-red flowers that smell of spice, usually
  with extra petals, grown widely in many kinds and many colours.
scope: Also called carnation or clove pink, a plant from Europe and Asia with pink to purple-red flowers
  that smell of spice; not the other Old World plants grown for their bright flowers.
examples:
- The gillyflower in the pot had deep pink blooms.
- Gillyflowers filled the garden with their spicy smell.
