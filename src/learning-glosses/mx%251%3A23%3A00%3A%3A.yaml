simpleMeaning: A unit of magnetic flow in the cgs set of units, the flow at right angles through one square
  centimetre in a field of one gauss.
scope: This is a unit of flow, not a magnet or a field; also called maxwell.
examples:
- One Mx is the flow through a square centimetre in a one-gauss field.
- Mx is a unit of magnetic flow.
