simpleMeaning: a church officer who most often stands just below a bishop in the Anglican Church
scope: A high officer of the Anglican Church just below a bishop, not a bishop and not a parish priest.
examples:
- The archdeacon visited the parish to inspect the church.
- He was made archdeacon after years as a vicar.
