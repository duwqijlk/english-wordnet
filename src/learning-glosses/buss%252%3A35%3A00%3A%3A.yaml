simpleMeaning: To show love, to say hello, or the like, by pressing one's lips to a person's mouth or
  to some other part of the body.
scope: Also called kiss, snog, or osculate; to touch a person with the lips as a sign of love or greeting,
  not the noun naming that act.
examples:
- She bussed her grandfather on the forehead when she entered the room.
- The newly married couple bussed each other before the guests.
