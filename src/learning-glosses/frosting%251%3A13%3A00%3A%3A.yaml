simpleMeaning: A sweet sugar cover with a taste added, spread over cakes to coat and decorate them
scope: A sweet sugar cover with a taste added, spread over cakes to coat and decorate them, also called
  ice or icing; not the cold white cover on grass in winter.
examples:
- She spread pink frosting over the birthday cake.
- The frosting on the cupcakes was soft and sweet.
