simpleMeaning: a hard plate of armor worn to guard the lower leg, from the knee down
scope: A plate of armor that guards the leg below the knee, not a helmet and not a shield.
examples:
- The knight's greaves shone as he marched across the yard.
- He strapped a greave onto each leg before the battle.
