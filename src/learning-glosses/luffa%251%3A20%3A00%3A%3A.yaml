simpleMeaning: One of several one-season tropical climbers with big yellow flowers and edible young fruit,
  grown as a crop for sponges from its ripe fruit's dried fibres.
scope: Another name for the tropical vine also called dishcloth gourd, rag gourd or sponge gourd; not
  the dried sponge sold from its fruit.
examples:
- Luffa vines climb over trellises in warm climates.
- Farmers harvest ripe luffa fruit for the fibres that become sponges.
