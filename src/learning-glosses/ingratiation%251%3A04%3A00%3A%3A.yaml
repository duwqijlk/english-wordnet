simpleMeaning: The act of winning liking or love for yourself with smooth, sly praise.
scope: The act of winning liking for yourself with smooth, sly praise, also called insinuation; not honest
  praise and not a gift given to win favour.
examples:
- His ingratiation won him a place at the table.
- She saw through his ingratiation and its smooth praise.
