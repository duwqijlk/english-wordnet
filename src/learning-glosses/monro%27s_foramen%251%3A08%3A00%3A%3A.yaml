simpleMeaning: The small hole on each side that joins the third hollow space in the middle of the brain
  to the side hollow space in the brain's large half
scope: Also called the interventricular foramen and the foramen of Monro; a small hole on each side joining
  the third hollow space in the middle of the brain to the side hollow space in the brain's large half.
examples:
- Monro's foramen joins the third ventricle to the lateral ventricle.
- Monro's foramen is the small opening between two hollow spaces in the brain.
