simpleMeaning: an officer in an Episcopal parish who helps the priest with day-to-day matters that are
  not part of worship
scope: An officer in an Episcopal parish who helps the priest with day-to-day matters that are not part
  of worship, not the priest himself and not a church bell.
examples:
- The churchwarden unlocked the hall for the meeting.
- Our churchwarden helps the priest with the parish accounts.
