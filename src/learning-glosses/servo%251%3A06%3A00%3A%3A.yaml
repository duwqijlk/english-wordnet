simpleMeaning: a control set-up that turns a small move into a much stronger move, and may check itself
  as it works
scope: A control set-up that turns a small move into a much stronger one, also called a servomechanism
  and a servosystem; not a plain switch and not a motor on its own.
examples:
- The servo turned the pilot's light touch into a strong pull on the wing.
- A servo in the machine made the small turn of the wheel move a heavy load.
