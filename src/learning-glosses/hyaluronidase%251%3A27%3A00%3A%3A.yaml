senseId: 'hyaluronidase%1:27:00::'
synsetId: 14934316-n
simpleMeaning: An enzyme sold under the trade name Hyazyme that breaks down hyaluronic acid, thinning
  it and letting fluids pass into connective tissue more easily.
scope: Also called spreading factor; not a digestive enzyme, but the one that loosens connective tissue
  by breaking up hyaluronic acid.
examples:
- The doctor injected hyaluronidase to help the medicine spread through the tissue.
- Hyaluronidase breaks down hyaluronic acid and makes tissue easier for fluid to enter.
