simpleMeaning: a way of growing plants in water with food mixed in it, with no soil
scope: This is growing plants in water with no soil; hydroponics and aquiculture are other names for this
  sense. Not growing plants in soil and not keeping fish in a tank.
examples:
- Tank farming lets her grow lettuce in water on her roof.
- The tank farming setup uses water with food mixed in, not soil.
