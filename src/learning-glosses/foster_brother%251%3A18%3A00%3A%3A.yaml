simpleMeaning: A boy or man brought up by your parents, though he is not their son
scope: This is a boy or man brought up by your parents, though he is not their son, also called foster-brother;
  it is not your parents' own son and not a close friend.
examples:
- Tom is my foster brother; he joined our family when he was four.
- My foster brother still lives in the old house.
