simpleMeaning: a game where iron rings are thrown at a peg stuck in the ground, in the hope of getting
  a ring round it
scope: Also called horseshoes, this is a game of throwing iron rings at a peg in the ground, not a game
  of throwing balls and not a game of hitting a target with darts.
examples:
- We played quoits on the grass behind the house.
- The quoits rang as they hit the iron peg.
