simpleMeaning: about gravity, the force that pulls things toward each other, or caused by that force
scope: To do with the pull of gravity or made by it, not just about a thing being heavy or about a matter
  being serious.
examples:
- The moon's gravitational pull makes the sea move in and out.
- Gravitational forces keep the planets moving around the sun.
