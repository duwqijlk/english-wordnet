simpleMeaning: A firm statement from a person who saw or heard a thing for themselves, saying that it
  is true.
scope: A firm statement from one who saw or heard a thing firsthand, not a guess and not a written record
  alone.
examples:
- Her testimony helped the court see what had happened.
- His testimony was the first account of the crash.
