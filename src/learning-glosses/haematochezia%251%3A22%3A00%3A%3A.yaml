simpleMeaning: Stools that leave the body carry blood in them, as from a weak pouch in the gut, cancer
  of the large gut, or a sore in the gut.
scope: Also called hematochezia, stools that leave the body carry blood in them.
examples:
- Blood in the stools pointed to haematochezia.
- The patient spoke of haematochezia when blood showed in the waste.
