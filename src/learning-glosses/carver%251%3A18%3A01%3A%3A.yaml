simpleMeaning: a person who cuts up meat so it can be served and eaten
scope: This is the person who cuts meat for a meal, not a carver who makes decorative wooden panels.
examples:
- The carver sliced the roast turkey for the guests.
- As carver, he cut a thick slice of ham for each person.
