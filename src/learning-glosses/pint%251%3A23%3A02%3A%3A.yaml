simpleMeaning: A British measure of how much a thing holds, for liquids or dry goods, equal to four gills
  or 568.26 cubic centimetres.
scope: A British measure equal to four gills, not the United States liquid pint and not the dry pint.
examples:
- He drank a pint of bitter at the pub.
- A pint of milk cost little then.
