simpleMeaning: Its food comes from the air, and this plant makes its home on rocks or ground full of small
  rocks.
scope: The plant that takes its food from the air and makes its home on rocks or ground full of small
  rocks is also called lithophytic plant.
examples:
- The lithophyte grows where the ground is rock.
- The lithophyte took its food from the air around it.
