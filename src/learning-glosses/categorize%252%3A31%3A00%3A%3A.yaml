simpleMeaning: to put a person or thing into a group with others of the same kind
scope: 'Also called categorise: to sort people or things into groups by kind, not to name or describe
  one thing on its own.'
examples:
- Teachers categorize the books by the age of the children.
- The shop categorizes its clothes by size.
