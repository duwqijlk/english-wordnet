simpleMeaning: Tears leave the glands that make them through any of several small tubes
scope: 'Also called lacrimal duct: small tubes that carry tears away from the glands that make them, not
  the glands themselves and not the tubes that carry blood.'
examples:
- A blocked lachrymal duct can make the eye water.
- Tears drain through the lachrymal duct into the nose.
