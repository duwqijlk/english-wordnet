simpleMeaning: the act of taking a part away from the whole thing
scope: This is taking a part away from a whole. It is not adding something, and not the amount that stays
  after a part is taken away.
examples:
- The subtraction of money from their paychecks upset the workers.
- In this sum, the subtraction of 3 from 10 gives 7.
