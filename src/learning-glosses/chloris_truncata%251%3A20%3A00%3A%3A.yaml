simpleMeaning: A long-lived Australian grass with many long flower spikes set out like the blades of a
  windmill.
scope: Also called creeping windmill grass, star grass and windmill grass, this is a long-lived Australian
  grass, not a short-lived lawn grass.
examples:
- The Chloris truncata holds its long spikes out like the blades of a windmill.
- Chloris truncata is easy to spot by its windmill shape.
