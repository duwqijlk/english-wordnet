simpleMeaning: During an operation, the surgeon stops blood from flowing, for example by pinching a vessel
  shut with a tool
scope: A way to stop blood from flowing during an operation, also called haemostasia, haemostasis and
  hemostasis, not the body's own clotting and not a way to stop bleeding from a cut at home.
examples:
- The surgeon achieved hemostasia before closing the wound.
- Good hemostasia kept the field clear during the operation.
