simpleMeaning: how fast a person breathes in and out, most often counted to get a quick check on how well
  the person is
scope: Not the depth of each breath, and not the beat of the heart; also called rate of respiration.
examples:
- The nurse wrote down his respiratory rate at each visit.
- A high respiratory rate can be a sign of fever.
