senseId: 'letters_of_marque%1:10:00::'
synsetId: 06562882-n
simpleMeaning: Ships that belong to another country, and the goods on them, may be taken by a private
  person with this written paper from a government
scope: 'Also called a letter of mark and reprisal and a letter of marque: a written paper that lets a
  private person take ships of another country, not a note sent by post and not a permit to trade.'
examples:
- The letters of marque let the captain seize any enemy ship he met.
- He kept the letters of marque safe on board, in case he met a foreign vessel.
