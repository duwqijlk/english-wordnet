simpleMeaning: A Christian group that grew out of the Byzantine group and keeps its rites.
scope: Also called Eastern Orthodox, Eastern Orthodox Church, Orthodox Catholic Church and Orthodox Church;
  the Christian group that grew out of the Byzantine Church and keeps its rites, not the older Catholic
  Church of the Byzantine Empire.
examples:
- She attends an Eastern Church service on Sundays.
- The Eastern Church keeps the old Byzantine rites.
