simpleMeaning: Found across the cool lands of the north, these are mostly herbs that live for many years,
  with sticky stems that hold fast to small flying insects.
scope: This herb is also called lychnis, and it is not the plant that only lives for one year.
examples:
- The catchfly held a small fly fast on its sticky stem.
- The same catchfly came back year after year.
