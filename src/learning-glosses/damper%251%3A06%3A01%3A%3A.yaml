simpleMeaning: a flat iron plate that can be moved to control the flow of air in a stove, chimney or furnace
scope: This is the iron plate for controlling air in a stove, chimney or furnace, not a device that cuts
  down shaking, sound waves or electric signals.
examples:
- He opened the damper to let more air into the stove.
- Close the damper in the chimney when the fire is out.
