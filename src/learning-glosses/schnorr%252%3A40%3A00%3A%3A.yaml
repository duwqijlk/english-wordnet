simpleMeaning: to get something, or try to get something, by begging for it in a smooth, coaxing way
scope: To get something by begging and coaxing; also called scrounge, cadge or shnorr. Not to buy or earn
  it, and not to steal it.
examples:
- He tried to schnorr a free ticket from the usher.
- She schnorred a lift home from a stranger.
