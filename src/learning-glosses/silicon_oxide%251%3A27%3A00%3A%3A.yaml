simpleMeaning: A white or colorless glassy solid, formula SiO2, that will not dissolve; its various forms
  are widespread in the earth's crust as quartz, cristobalite, tridymite or lechatelierite.
scope: Another name for silicon dioxide; the same compound is also called silica, and quartz, cristobalite,
  tridymite and lechatelierite are only forms of it.
examples:
- The lab identified the white, glassy solid as silicon oxide.
- Silicon oxide occurs in the earth's crust in various forms.
