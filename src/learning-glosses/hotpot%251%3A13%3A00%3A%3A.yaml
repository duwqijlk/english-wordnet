simpleMeaning: Meat and starchy vegetables cooked in a covered dish with a tight lid, making a stew
scope: This is a stew of meat and starchy vegetables cooked in a covered dish; hot pot is another name
  for this sense, not a soup served in a bowl and not a dish cooked quickly in an open pan.
examples:
- We had hotpot for dinner on a cold night.
- The hotpot was still warm when we sat down.
