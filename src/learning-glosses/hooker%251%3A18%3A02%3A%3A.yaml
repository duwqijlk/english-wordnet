simpleMeaning: a player in golf who, swinging right-handed, most often sends the ball bending away to
  the left
scope: A golfer whose shots bend left, not the rugby player in the front row and not the prostitute sense.
examples:
- As a hooker, his drives always curved left.
- The hooker watched his ball bend away to the left.
