simpleMeaning: a common grape vine from Europe grown in many kinds, the main source of wine grapes and
  table grapes from the Old World
scope: Also called the common grape vine and vinifera grape, this is the vine itself, not a single fruit
  picked from it.
examples:
- The vinifera vines in the valley give the wine its taste.
- Farmers grow vinifera in many kinds across Europe.
