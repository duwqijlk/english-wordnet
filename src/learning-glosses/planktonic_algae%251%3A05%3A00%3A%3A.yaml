simpleMeaning: One of four kinds of Charophyte, a group of green living things made of one cell
scope: One of four kinds of green living things made of one cell, not one of the other three kinds and
  not a land plant.
examples:
- The pond water was full of planktonic algae too small to see.
- Under the microscope, the planktonic algae showed up as single green cells.
