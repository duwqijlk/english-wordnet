simpleMeaning: Things go against you, and that leaves you worse off
scope: Being worse off because things have gone against you, also called bad luck and misfortune; not
  a bad mood and not one single bad event.
examples:
- After three failed harvests, the family blamed their ill luck.
- He took his ill luck in his stride and kept working.
