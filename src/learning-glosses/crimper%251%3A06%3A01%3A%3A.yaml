senseId: 'crimper%1:06:01::'
synsetId: 92460209-n
simpleMeaning: A hand tool used to join two pieces of bendable stuff, usually a wire and a metal plate,
  by pressing one or both out of shape so they hold together.
scope: This is a hand tool for joining metal parts, not a tool for curling hair; also called crimping
  pliers.
examples:
- He used a crimper to join the wire to the plate.
- The crimper squeezed the connector tight.
