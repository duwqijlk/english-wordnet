simpleMeaning: Most often, a baby born after 42 weeks inside its mother shows signs that the part that
  feeds it before birth is not working well
scope: A baby born late, after 42 weeks, that most often shows signs that the part that feeds it before
  birth is not working well; not a baby born early and not one born on time.
examples:
- The postmature infant was born after 42 weeks inside his mother.
- Doctors watched the postmature infant for signs that the part feeding him before birth had not worked
  well.
