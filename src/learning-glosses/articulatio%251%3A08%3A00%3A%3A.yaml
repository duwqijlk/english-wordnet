simpleMeaning: In anatomy, the place where two bones or parts of a skeleton meet, especially where they
  can move
scope: 'Also called a joint or articulation: the place where two bones meet, not a bone itself and not
  a muscle that moves a bone.'
examples:
- The articulatio in her knee hurt when she walked.
- The doctor pointed to the articulatio where the two bones meet.
