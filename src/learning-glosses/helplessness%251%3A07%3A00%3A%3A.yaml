senseId: 'helplessness%1:07:00::'
synsetId: 05212250-n
simpleMeaning: the state of being unable to help yourself or change what is happening
scope: Being unable to act or to change what is happening; weakness is another name for this sense, not
  a passing tiredness and not a choice to do nothing.
examples:
- He felt a deep helplessness as he watched the flood rise and could do nothing.
- Their helplessness showed when no one moved to help.
