simpleMeaning: Dried leaves of an Asian kind of mugwort, a herb, make up this long thin piece, used to
  warm the skin in a kind of treatment
scope: 'Also called a moxa roll: a long thin piece made of dried mugwort leaves, used to warm the skin,
  not a stick of wood and not a medicine taken by mouth.'
examples:
- She lit a moxa stick and held it near the sore knee.
- The healer burned a moxa stick over the patient's back.
