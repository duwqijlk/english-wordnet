synsetId: 11500216-n
simpleMeaning: A magnetic effect in which copper, bismuth and similar materials become magnetized the
  opposite way to a nearby magnet, so they are pushed slightly away rather than drawn toward it.
scope: The weak repelling effect some materials show toward magnets, not the strong attraction of iron.
examples:
- Diamagnetism makes a piece of bismuth drift away from a strong magnet.
- The effect of diamagnetism is too weak to notice in everyday life.
