simpleMeaning: The nose and the parts around it get their blood from this tube, which comes off the blood
  tube of the eye.
scope: Also called arteria ethmoidalis, this is a blood tube that comes off the blood tube of the eye
  and feeds the nose and the parts around it.
examples:
- The surgeon tied off the ethmoidal artery.
- Blood reaches the nose through the ethmoidal artery.
