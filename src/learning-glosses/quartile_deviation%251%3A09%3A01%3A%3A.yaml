simpleMeaning: Half the gap between the first and third quarter marks in a set of counted values
scope: Half the gap between two quarter marks in counted values; not the full gap, and not an average.
examples:
- The quartile deviation of the test scores was small.
- She worked out the quartile deviation from the marks.
