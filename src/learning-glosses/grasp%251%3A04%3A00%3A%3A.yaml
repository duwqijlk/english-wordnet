simpleMeaning: the act of holding something tight in your hand
scope: This sense is the act of holding tight in the hand, not a person's reach and not how well a person
  understands an idea.
examples:
- He loosened his grasp on the rope and let it fall.
- Her grasp on the handle stayed firm as the bus turned.
