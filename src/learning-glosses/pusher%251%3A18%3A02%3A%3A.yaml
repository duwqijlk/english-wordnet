senseId: 'pusher%1:18:02::'
synsetId: 10515341-n
simpleMeaning: A person who thrusts themself into a place or a group, pushing forward where they are not
  wanted.
scope: 'Also called a thruster: a person who thrusts themself into a place or a group, pushing forward
  where they are not wanted, not the sandal held by a thong over the toes, and not the small four-wheeled
  carriage for a baby, and not one who merely pushes.'
examples:
- He was a pusher, always forcing his way into the front.
- The pusher elbowed her way to the head of the line.
