simpleMeaning: a flat part joined at one edge to the top of a plane wing, lifted up to cut upward force
  and slow the plane down
scope: This is a part on a plane wing, not a similar part on the back of a car and not a person who gives
  someone too much or who takes things in war.
examples:
- The pilot lifted the spoiler on the wing as the plane came down.
- A spoiler on each wing helps the plane slow down after it lands.
