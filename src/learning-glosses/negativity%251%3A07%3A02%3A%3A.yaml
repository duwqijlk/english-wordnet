simpleMeaning: In chemistry, how much an atom or a radical (a group of atoms joined together) pulls electrons
  toward itself when an ionic bond (a joining of charged atoms) forms
scope: 'Also called electronegativity: in chemistry, this is an atom''s pull on electrons, not a person''s
  habit of doubting and saying no, and not the state of a negative electric pole.'
examples:
- Because of its negativity, chlorine pulls an electron from sodium when salt forms.
- The teacher used the negativity of fluorine to show how strongly it pulls electrons in a bond.
