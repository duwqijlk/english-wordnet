simpleMeaning: To do with a system for writing words, where the printed page looks just the same as the
  screen.
scope: To do with a system for writing words where the printed page looks just the same as the screen,
  not one that shows the text one way and prints it another.
examples:
- This WYSIWYG editor prints the page just as it looks on the screen.
- She likes WYSIWYG programs because the printed page matches the screen.
