simpleMeaning: Where the ground drops away, sloping or bending downward.
scope: 'Also called a fall, a decline, a descent, a declension, a downslope, or a declivity: where the
  ground drops away, not a polite refusal and not a fall from a better state.'
examples:
- The road fell away in a sharp declination.
- They walked down the declination to the river.
