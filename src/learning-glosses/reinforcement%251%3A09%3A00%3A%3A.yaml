simpleMeaning: In psychology, a thing that comes after an act and makes that act stronger or weaker, so
  the act is more or less likely to happen again.
scope: This is the psychology sense, not the military sense of sending more troops and supplies to make
  a force stronger.
examples:
- The trainer used a treat as a reinforcement to help the dog learn the trick.
- Each time the child shared, praise acted as a reinforcement that made sharing more likely.
