simpleMeaning: Flat worms that swim free, mostly in fresh water, often used in labs because they can grow
  back lost parts.
scope: Flat worms that swim free, mostly in fresh water, often used in labs because they can grow back
  lost parts; planaria is another name for this sense, not a tapeworm and not a fluke.
examples:
- Planarians can regrow a whole body from a small piece.
- We kept planarians in a tank for the experiment.
