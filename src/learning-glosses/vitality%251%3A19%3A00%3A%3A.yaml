simpleMeaning: In biology, a supposed force, not physical or chemical, that Henri Bergson once thought
  made living things grow and change over time
scope: 'Also called elan vital, life force, and vital force: a past idea about living things, not the
  energy or strength a person or thing shows in daily life.'
examples:
- Bergson wrote about vitality as a force that drives living things to grow.
- In old biology books, vitality was once seen as a special force behind how living things change.
