simpleMeaning: In psychoanalysis, a teenager reaches the fifth step in growing up, and sex and mixing
  with others hold the most interest.
scope: Also called a genital phase, this psychoanalytic term marks the fifth step in growing up, reached
  in the teens, when sex and mixing with others hold the most interest.
examples:
- Her genital stage arrived in her teens, when sex and friendships held her interest most.
- His genital stage brought new interest in sex and in time spent with friends.
