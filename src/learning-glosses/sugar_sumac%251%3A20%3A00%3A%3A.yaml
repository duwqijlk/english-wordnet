simpleMeaning: Spikes of red-yellow flowers mark this green shrub of the south-east of the United States,
  which keeps its leaves all year and bears sticky hairy fruit.
scope: 'Also called sugar-bush: a green shrub of the south-east of the United States with spikes of red-yellow
  flowers.'
examples:
- The sugar sumac by the road had spikes of red-yellow flowers.
- Sugar sumac keeps its leaves all year and bears sticky hairy fruit.
