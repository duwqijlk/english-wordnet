simpleMeaning: This wildflower from the Americas has a lower lip that swells into a pouch, and it is one
  of several kinds that gardeners find hard or impossible to grow.
scope: With a lower lip that swells into a pouch, this wildflower from the Americas, also called ladies'
  slipper, lady's-slipper, lady's slipper, lady-slipper, and slipper orchid, is one of several kinds that
  gardeners find hard or impossible to grow.
examples:
- We saw a lady slipper with its pouch open.
- A lady slipper in the garden failed to come back.
