simpleMeaning: How bright light is, most of all, and its other qualities are what this measures
scope: The measuring of light, most of all how bright it is, not the chemical action of light and not
  a picture made with light.
examples:
- Photometry showed that the lamp gave off very little light.
- The scientist used photometry to measure how bright the new bulb was.
