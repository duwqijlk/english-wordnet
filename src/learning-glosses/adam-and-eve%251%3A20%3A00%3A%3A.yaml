simpleMeaning: An orchid from North America that has only one leaf and flowers of a yellow-brown colour.
scope: Also called puttyroot, this orchid from North America is known by its single leaf and its yellow-brown
  flowers.
examples:
- In the woods, adam-and-eve showed a single leaf beside its yellow-brown flowers.
- The gardener marked the adam-and-eve so its single leaf would not be cut.
