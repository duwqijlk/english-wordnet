simpleMeaning: a cover that fits above the front window of a car to cut the bright light, at times made
  of a green mineral
scope: This is a shade fixed above a car's front window, not a hat with a wide edge and not a screen inside
  the car.
examples:
- The sun visor in his car was pulled down against the low light.
- She lifted the sun visor after the road turned away from the bright sky.
