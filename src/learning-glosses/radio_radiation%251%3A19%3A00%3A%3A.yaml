simpleMeaning: a wave made of electric and magnetic power, with a length from half a centimetre to thirty
  thousand metres
scope: 'Also called radio emission and radio wave: a wave of electric and magnetic power of this long
  length, not light we can see and not a much shorter wave such as a microwave.'
examples:
- The radio radiation from the station can travel far across the sea.
- Radio radiation carries the music from the tower to our set.
