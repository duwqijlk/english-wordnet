simpleMeaning: the quality of standing out, so people notice a thing easily
scope: This is how much a thing stands out and is noticed, not the thing itself and not being hidden or
  hard to notice.
examples:
- The salience of the red sign made everyone look at it.
- The salience of the danger became clear after the accident.
