simpleMeaning: The pull toward the middle that keeps a thing in space in its oval path.
scope: The pull toward the middle that holds a thing in space in its oval path, not a push away from the
  middle and not the speed of the thing itself.
examples:
- Centripetal acceleration keeps the moon in its path round the Earth.
- Without centripetal acceleration the satellite would fly off in a straight line.
