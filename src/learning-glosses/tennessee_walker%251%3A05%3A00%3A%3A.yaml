simpleMeaning: A horse that can keep going for a long time, taught to move at a fast running walk.
scope: 'Also called Tennessee walking horse, Plantation walking horse and Walking horse: a horse that
  can keep going for a long time, taught to move at a fast running walk, not a horse taught to move in
  another way.'
examples:
- The Tennessee walker moved at a fast running walk around the ring.
- Her Tennessee walker was taught to move at a fast running walk.
