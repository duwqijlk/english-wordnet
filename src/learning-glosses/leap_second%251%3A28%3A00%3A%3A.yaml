senseId: 'leap_second%1:28:00::'
synsetId: 15260131-n
simpleMeaning: A second added to or taken from world time, as read by a very exact clock, to make up for
  the Earth turning more slowly.
scope: A second added to or taken from world time to match the Earth's slower turn.
examples:
- The leap second was added at midnight to keep world time in step with the Earth.
- A leap second keeps clocks in step as the Earth turns more slowly.
