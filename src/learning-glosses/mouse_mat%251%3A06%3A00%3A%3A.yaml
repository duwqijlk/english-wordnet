simpleMeaning: A small flat pad that can be carried from place to place and gives grip to the ball of
  a small hand tool that moves things on a screen
scope: 'Also called a mousepad: a small pad that gives grip to the ball under a computer mouse, not a
  desk pad and not a pad for writing.'
examples:
- She set her mouse mat on the desk beside the keyboard.
- The mouse mat gave the ball grip as he moved it.
