simpleMeaning: the qualities a person gets from parents and earlier family, shared with others in the
  same family line
scope: 'Also called lineage and derivation: the qualities a person shares with the family they come from.
  It is about what is passed down in a family, not about one parent alone.'
examples:
- People with the same ancestry often share qualities that come from their family line.
- Her ancestry gave her the same dark eyes shared by her mother and grandmother.
