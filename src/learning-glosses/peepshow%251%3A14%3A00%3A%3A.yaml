simpleMeaning: Seen through a small hole or a glass that makes them look big, pictures or things are put
  on view
scope: Also called a raree-show, this is a display of pictures or things seen through a small hole or
  a glass that makes them look big, not a short sex film in a coin booth.
examples:
- At the fair, children crowded round the peepshow to look at the pictures through the little hole.
- The old peepshow at the museum lets you see tiny scenes through a glass that makes them look big.
