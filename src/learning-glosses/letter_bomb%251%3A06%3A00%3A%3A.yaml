simpleMeaning: A thin explosive device hidden inside an envelope or package that goes off when opened
scope: Package bomb and parcel bomb are other names for this thin explosive device hidden in an envelope
  or package; it is not a car bomb and not an ordinary parcel.
examples:
- The letter bomb exploded when the clerk opened the envelope.
- Police warned that a letter bomb had been sent to the office.
