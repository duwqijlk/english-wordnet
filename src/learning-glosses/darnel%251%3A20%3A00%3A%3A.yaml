scope: Also called cheat, tare, and bearded darnel, this is a weed grass that lives one year in fields
  of grain and other farmed land, with seeds sometimes thought to be poison.
examples:
- Darnel grows among the wheat in the field.
- Darnel seeds were found among the grain.
