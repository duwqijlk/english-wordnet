simpleMeaning: To trick a rival into giving up a winning hand by betting boldly on a weak one.
scope: This move is also called bluff, and it is not a plain bet on a strong hand.
examples:
- The player tried to bluff out a rival with a big bet.
- They bluffed out a rival who held a winning hand.
