simpleMeaning: A woman giving birth has a helper who stays with her and urges her to use what she learned
  in birth classes, often the father of the unborn child
scope: 'Also called doula, birthing coach and monitrice: a helper for a woman giving birth, not a doctor
  and not a midwife.'
examples:
- Her husband acted as her labor coach during the birth.
- The labor coach reminded her to breathe slowly.
