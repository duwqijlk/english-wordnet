senseId: 'x-ray_picture%1:06:00::'
synsetId: 04107714-n
simpleMeaning: An image made by passing a kind of invisible light through the body onto film, used by
  doctors to look inside the body.
scope: Also called a roentgenogram, an X-ray, an X-ray photograph or an X ray; an image made by passing
  invisible light through the body onto film, not the invisible light itself or a drawing of the body.
examples:
- The X-ray picture showed the broken wrist.
- An X-ray picture of his chest was taken.
