simpleMeaning: used so many times that it feels old and worn out, with nothing new left in it
scope: 'Also called tired or stock: a saying or idea worn out by use, not cloth worn thin.'
examples:
- He kept repeating threadbare jokes no one laughed at any more.
- Her threadbare remarks bored the whole room.
