simpleMeaning: A copy made by putting a coated sheet under the sheet you write on
scope: A copy made with coated paper, not the coated paper itself and not a copy made by a machine.
examples:
- She kept a carbon copy of the letter for her files.
- He made a carbon of the form before he sent it.
