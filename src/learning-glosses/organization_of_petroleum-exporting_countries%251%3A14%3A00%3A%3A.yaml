simpleMeaning: A group of nations that came together in nineteen sixty-one to agree on how to make and
  sell oil.
scope: This word is for a group that agrees on making and selling oil, not for one nation alone.
examples:
- The Organization of Petroleum-Exporting Countries met to talk about oil prices.
- The Organization of Petroleum-Exporting Countries sets rules for the sale of oil.
