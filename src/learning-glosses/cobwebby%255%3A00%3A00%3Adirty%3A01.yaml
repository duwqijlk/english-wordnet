simpleMeaning: covered with the thin nets that spiders make
scope: This describes a place or thing with spider nets on it. It is not clean and new, and not just dusty
  with no nets on it.
examples:
- The cobwebby corner of the old room was dark and dusty.
- She slowly opened the cobwebby door of the empty house.
