simpleMeaning: A cone-shaped tool once used to send sound to a person who could not listen well
scope: A cone-shaped tool once used to send sound to a person who could not listen well, also called hearing
  aid; not a modern electric aid and not a musical instrument.
examples:
- The old man held an ear trumpet to his ear to listen better.
- An ear trumpet was once used to send sound to a person who could not listen well.
