senseId: 'thoughtlessly%4:02:00::'
synsetId: 00218444-r
simpleMeaning: in a way that shows you did not stop to think about others or about what may happen
scope: This sense says that what a person does shows they did not think or care, as when they treat other
  people in this way. The other sense of this word only says that a person does a thing in a careless
  way.
examples:
- He thoughtlessly left his little sister alone by the deep pool.
- She thoughtlessly threw the letter away without reading it.
