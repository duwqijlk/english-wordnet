simpleMeaning: A set of false teeth that takes the place of some of the teeth in one jaw
scope: A plate that takes the place of only some teeth in one jaw, not a full set of false teeth and not
  a fixed bridge.
examples:
- My new partial denture fits well and lets me chew again.
- The dentist made a partial denture to replace the three teeth I lost.
