simpleMeaning: A fish whose flesh is dried and made into thin flakes for Japanese cooking; it may be the
  same kind of fish as the skipjack tuna
scope: 'Also called oceanic bonito: this is the fish used dried for Japanese cooking, not its flesh as
  a food and not any of the wider group of similar fishes.'
examples:
- Dried bonito is used to make Japanese soup stock.
- Fishermen caught bonito off the coast.
