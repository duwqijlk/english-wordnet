simpleMeaning: Breaths taken in a set way go with hard held poses that shut the mind off from the world
  outside, in body exercises well liked in the West.
scope: People in the West call these body exercises hatha yoga, joining hard held poses that shut the
  mind off from the world outside with breaths taken in a set way.
examples:
- She does hatha yoga every morning before work.
- The hatha yoga class starts with slow breathing.
