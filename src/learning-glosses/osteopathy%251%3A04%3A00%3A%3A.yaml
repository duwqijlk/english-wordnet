simpleMeaning: A way of treating sick people that rests on the idea that health comes back best when bones
  and muscles are moved and pressed.
scope: Bones and muscles are moved and pressed in this treatment, on the idea that health comes back best
  that way.
examples:
- Osteopathy moves and presses bones and muscles, holding that health comes back best that way.
- They chose osteopathy because it moves and presses bones and muscles.
