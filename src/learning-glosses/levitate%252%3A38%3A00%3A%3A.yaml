schema: oewn-learning-gloss-v2
senseId: 'levitate%2:38:00::'
synsetId: 01948111-v
simpleMeaning: to stay up in the air with no support, as if the pull that draws things to the ground did
  not hold
scope: Another name for this is hover. This means a person or thing itself stays up in the air, not that
  someone makes a thing rise and float.
examples:
- The guru claimed he could levitate above the floor.
- In the story, the stone levitates and stays still in the air.
