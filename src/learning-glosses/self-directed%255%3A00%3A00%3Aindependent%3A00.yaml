simpleMeaning: Of people, free from outside control and pressure in what they do and how they judge things
scope: 'Also called autonomous or self-reliant: a person free from outside control, not a person ruled
  by others and not a person who only follows orders.'
examples:
- She is a self-directed learner who plans her own study.
- A self-directed worker needs little telling what to do.
