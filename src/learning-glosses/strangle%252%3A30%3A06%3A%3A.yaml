simpleMeaning: to die because the throat is pressed so hard that no air can get in
scope: To die because the throat is pressed and no air can get in; not pressing someone else's throat,
  and not holding back a feeling or sound.
examples:
- He nearly strangled when the rope tightened around his neck.
- The kitten would have strangled if the string had pulled any tighter.
