simpleMeaning: From the seeds of a plant of the Old World, now found wild in America, comes an oil that
  clears the bowels, though the plant itself can poison.
scope: Also called caper spurge or mole plant, its seeds give an oil that clears the bowels, while the
  plant itself can poison.
examples:
- Do not eat the myrtle spurge; it is poisonous.
- The myrtle spurge grows wild in America.
