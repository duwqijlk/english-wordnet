simpleMeaning: A round or egg-shaped warm-climate fruit, its skin thick, reddish-brown and leathery, and
  juicy yellow or red flesh.
scope: This sense is also called mammee and mammee apple, for a round or egg-shaped warm-climate fruit,
  its skin thick, reddish-brown and leathery, and juicy yellow or red flesh, unlike the sense for a warm-climate
  American tree with edible fruit in a leathery rind.
examples:
- Mamey tastes sweet and juicy.
- They ate mamey after lunch.
