simpleMeaning: the regular, steady pulse of blood through your arteries as your heart pumps.
scope: This is the pulse of blood in the body, not a hit, a musical rhythm, or a police officer's area.
examples:
- The doctor listened to the beat of his heart.
- She could feel the beat of her heart after running up the stairs.
