simpleMeaning: The arm of the nation's government that runs plans to help farmers, from research and care
  of the soil to steadying the farm economy; set up in 1862.
scope: Not the arm that deals with trade or with the land itself; also called the Agriculture Department,
  the Department of Agriculture and USDA.
examples:
- Agriculture set up farm aid after the drought.
- The farmer wrote to Agriculture for help.
