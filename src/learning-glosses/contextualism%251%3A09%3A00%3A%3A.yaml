simpleMeaning: Any view that stresses how much the setting matters when working out questions or fixing
  what words mean
scope: Any view stressing how much the setting matters for questions and word meanings, not a view that
  words mean the same everywhere and not a rule about single words alone.
examples:
- Contextualism guides her reading of old texts.
- He argued for contextualism in the debate on meaning.
