senseId: homogenized%5:00:00:homogeneous:00
synsetId: 01204160-s
simpleMeaning: Made the same all the way through, with no part unlike another.
scope: Made the same all the way through; not made by mixing unlike things, especially by breaking one
  thing into tiny bits and spreading them through another.
examples:
- The milk was homogenized, so the cream did not rise to the top.
- After shaking, the paint was homogenized and smooth all through.
