simpleMeaning: From Europe, this plant of the germander kind bears bunches of yellow blooms all on one
  side and now grows on its own in North America.
scope: This is the European plant of the germander kind with bunches of yellow blooms all on one side,
  now growing on its own in North America, not the North American kind with cream to pink or purple flowers.
examples:
- Bunches of yellow blooms grow all on one side of wood sage.
- In North America, wood sage now grows on its own.
