simpleMeaning: The pattern for making protein; the kind of acid that carries the instructions from DNA
  in the cell's control centre to the spots where protein is made.
scope: 'Also called mRNA, informational RNA and template RNA: the kind of acid that carries the instructions
  from DNA in the cell''s control centre to the spots where protein is made, not the DNA itself and not
  the protein it helps to make.'
examples:
- Messenger RNA carries the instructions from DNA to the places where protein is made.
- Without messenger RNA, the cell could not read the plan in its DNA.
