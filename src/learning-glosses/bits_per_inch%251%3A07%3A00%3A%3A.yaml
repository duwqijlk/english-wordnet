simpleMeaning: A measure of how closely pieces of information are packed on a thing that stores them.
scope: A measure of how closely pieces of information are packed on a thing that stores them; bpi is another
  name for this sense, not the total amount stored and not the speed of reading.
examples:
- The tape holds 6250 bits per inch.
- Higher bits per inch means more data on the same tape.
