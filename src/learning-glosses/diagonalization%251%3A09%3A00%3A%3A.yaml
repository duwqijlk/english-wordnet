simpleMeaning: Changing a square set of numbers in rows so that only the numbers on the main slanting
  line are not zero
scope: This is changing a square set of numbers in rows so that only the numbers on the main slanting
  line are not zero; diagonalisation is another name for it, not adding two sets of numbers and not turning
  a set of numbers on its side.
examples:
- Diagonalization turns the square set of numbers into slanting-line form.
- He used diagonalization to make the sums easier.
