simpleMeaning: land that is not used for farming and is covered with small trees and low bushes
scope: Land covered with small trees and low bushes that no one farms, not a farm field and not a thick
  forest of tall trees.
examples:
- Beyond the village lay miles of dry scrubland.
- Few crops grow in this poor scrubland, so goats graze there instead.
