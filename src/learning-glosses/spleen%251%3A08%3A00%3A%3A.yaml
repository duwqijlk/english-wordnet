simpleMeaning: a large, dark red, egg-shaped body part on the left side, between the stomach and the muscle
  sheet under the lungs; it makes cells that help the body fight sickness
scope: 'Also called a lien: this body part on the left side of the body, not anger or a bad temper, which
  is another sense of the same word.'
examples:
- The doctor found that his spleen had grown too large.
- After the accident, her spleen had to be taken out.
