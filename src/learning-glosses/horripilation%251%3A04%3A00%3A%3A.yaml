simpleMeaning: The tiny hairs on your skin stand up on their own when you feel cold, when you feel a strong
  feeling, or when something upsets your skin
scope: This is the hairs of the skin standing up on their own, also called goose bump, goose pimple, goose
  skin, goosebump, gooseflesh or pilomotor reflex, not a rash and not hair raised by styling.
examples:
- Horripilation made the hairs on her arms stand up in the cold wind.
- He felt horripilation when the scary music started.
