simpleMeaning: The average of a set of numbers worked out by taking one divided by each number, averaging
  those, then taking one divided by that average
scope: The average of a set of numbers worked out by dividing one by each number and then dividing one
  by the average of those, not the ordinary average and not the middle value.
examples:
- The harmonic mean of 2 and 4 is 2.67.
- Use the harmonic mean when you average rates.
