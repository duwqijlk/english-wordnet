simpleMeaning: A British youth subculture of the 1950s, mainly from unskilled working-class homes, that
  copied Edwardian dress and rock'n'roll, was anti-foreign and took part in race riots.
scope: This is the 1950s British working-class youth movement; not the teddy bear toy, and not later groups
  such as the mods and rockers.
examples:
- In the 1950s, teddy boys gathered outside dance halls in long Edwardian-style jackets.
- The teddy boys clashed with immigrant communities in a series of race riots.
