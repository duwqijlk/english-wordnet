simpleMeaning: A set of assorted bits of equipment needed for one job or sport, or the like.
scope: A set of assorted bits of equipment needed for one job or sport, also called gear or paraphernalia;
  not a spare part added to make a thing work better.
examples:
- The appurtenance for the camping trip filled two whole boxes.
- Every appurtenance the team needed was laid out on the bench before the game.
