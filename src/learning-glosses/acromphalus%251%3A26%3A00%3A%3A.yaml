simpleMeaning: A navel that sticks out more than usual, sometimes the start of a hernia, a bulge where
  inner parts push through the belly wall.
scope: Not a normal navel and not a hernia in the groin.
examples:
- The baby's acromphalus stuck out like a small knob.
- An acromphalus can be the start of a hernia.
