simpleMeaning: any outer covering that a living thing can drop off, such as the old skin a snake leaves
  behind
scope: This is an outer covering a living thing drops off, not dead body tissue and not a wet swamp area.
examples:
- The snake left its slough behind on the rocks.
- We found a thin slough where the snake had shed its skin.
