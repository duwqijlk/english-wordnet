simpleMeaning: to find out with your eyes that something is there, is present, or is true
scope: 'Also called find, notice, discover, and observe: to find out with your eyes, not to find out by
  hearing, smell, or touch alone.'
examples:
- She detected a small crack in the wall with her eyes.
- He detected movement in the dark room as he looked through the window.
