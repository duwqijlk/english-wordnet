simpleMeaning: An earring worn without a piercing, coming in many sizes and shaped as a small wrap or
  hook that lies over the whole ear and dangles from the rim.
scope: This is a piece of ear jewellery that needs no piercing and sits over the rim of the ear. It is
  not a stud or hoop that passes through a hole. 'Ear cuff', 'ear hook earring' and 'ear wrap' are other
  names for the same item; the term is current, not dated or technical.
examples:
- The earcuff was the only jewellery she wore that night.
- She ordered an earcuff online but sent it back because it did not fit.
