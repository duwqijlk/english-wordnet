simpleMeaning: in baseball, to let the opposing team get a run or point
scope: This is the baseball use about giving up runs to the other side, not about permission, not about
  accepting a fact, and not about making something possible.
examples:
- The pitcher allowed three runs in the first inning.
- Our defense allowed two home runs.
