simpleMeaning: People go into this small room, put up for a short time at a voting place, to mark who
  they choose
scope: A small room at a voting place where a person marks a vote, not the voting place itself and not
  the box the votes go into.
examples:
- She stepped into the polling booth to cast her vote.
- The polling booth was set up in the school hall.
