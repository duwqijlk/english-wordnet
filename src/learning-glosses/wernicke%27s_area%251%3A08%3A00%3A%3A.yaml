simpleMeaning: The part of the brain where heard words are understood, at the back of the upper fold of
  the brain on the side, in most people.
scope: This is the brain part for understanding heard words, also called Wernicke's center, not the part
  for making speech, which is Broca's area.
examples:
- Damage to Wernicke's area left him unable to follow spoken words.
- Wernicke's area sits at the back of the upper part of the brain.
