senseId: 'pull%2:35:02::'
synsetId: 01507886-v
simpleMeaning: to draw a person or thing closer, either by physical force or by mental or emotional influence.
scope: This is not removing something from a container or moving yourself in a direction; it is making
  something come closer, whether through physical force or emotional power.
examples:
- This old song always pulls me back to my childhood.
- The moon pulls the ocean toward it and creates the tides.
