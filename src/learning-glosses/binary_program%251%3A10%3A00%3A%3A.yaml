simpleMeaning: A set of orders for a computer, put together in advance and ready to run on one operating
  system, but not on a different one.
scope: A set of orders for a computer, ready to run on one operating system only, also called binary;
  not the written code and not a document.
examples:
- The binary program ran at once on her machine.
- A binary program made for one operating system would not run on another.
