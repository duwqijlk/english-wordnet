senseId: 'enticement%1:04:00::'
synsetId: 00160440-n
simpleMeaning: The act of swaying a person by waking hope or longing in them.
scope: Also called temptation, this is the act of swaying a person by waking hope or longing, not the
  pleasing qualities in a thing that seem to promise a reward.
examples:
- The enticement of a free trip drew many to sign up.
- She saw through his enticement and walked away.
