simpleMeaning: typical of an area outside the capital, or of the people who live there
scope: Typical of an area outside the capital or of its people; not just linked to a province, and not
  the Roman Catholic Church official in charge of one.
examples:
- Their provincial way of life was quiet and closely tied to the land.
- He felt provincial among the well-educated people in the city.
