simpleMeaning: The growth of a crystal layer of one mineral on the crystal base of another, lined up in
  the same direction as the base.
scope: This is crystal growing on crystal with the same line-up, not a crystal growing on its own and
  not a coat painted on.
examples:
- Epitaxy lets makers grow one crystal layer on another.
- The team used epitaxy to build the thin film.
