simpleMeaning: a person trained to make medicines ready and give them out to people
scope: 'Also called pharmacist, chemist, and apothecary: a person who makes medicines ready and gives
  them out, not a doctor who tells people what medicine to take.'
examples:
- The druggist gave her the medicine the doctor had asked for.
- He asked the druggist how to take the pills safely.
