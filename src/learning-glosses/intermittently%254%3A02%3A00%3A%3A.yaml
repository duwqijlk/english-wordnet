simpleMeaning: in a way that stops and starts again, not all the time
scope: This is about doing something with breaks in between, not doing it all the time without a break
  and not doing it just once.
examples:
- It rained intermittently all day, stopping and starting again.
- We checked the pressure gauge intermittently through the night.
