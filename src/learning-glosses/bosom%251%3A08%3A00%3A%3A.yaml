simpleMeaning: The soft, milk-making part of a woman's chest, one of a pair
scope: One of the two soft milk-making parts of a woman's chest, also called a breast or a tit; not the
  cloth that covers the chest and not a person's chest in general.
examples:
- The baby nursed at her bosom.
- She held the child close to her bosom.
