simpleMeaning: In maths, a number found by dividing the longest side of a right-angled triangle by the
  side next to the angle
scope: In maths, a number from a right-angled triangle; sec is another name for this sense. Not the sine
  and not the cosine.
examples:
- To find the secant of the angle, divide the longest side by the side next to it.
- The secant of that angle is bigger than one.
