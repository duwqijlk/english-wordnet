simpleMeaning: a bus that carries people, with a motor that takes power from wires above the street
scope: A bus for people that gets power from wires above the street; trolleybus and trolley coach are
  other names for this sense, not a bus that runs on fuel and not a tram on rails.
examples:
- The trackless trolley stopped at the corner to pick up passengers.
- Our city still runs trackless trolleys along the main avenue.
