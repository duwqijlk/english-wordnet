simpleMeaning: A hand tool that holds a saw steady while it cuts wood across the grain or at a slant to
  make a joint
scope: 'Mitre box is another name for this sense: a guide that holds a saw steady for straight or slanted
  cuts, not a box for storing tools.'
examples:
- He used the miter box to cut the frame at a neat slant.
- She set the wood in the miter box before she began to saw.
