simpleMeaning: to go against the usual way of doing things or the limits set for them
scope: To go against the usual way of doing things, not to take a short way across a field and not to
  cross a road.
examples:
- His plan cut across the rules the team had agreed to follow.
- Her ideas cut across party lines and won support on both sides.
