simpleMeaning: knowing what is right and kind to say or do when dealing with other people
scope: Knowing what is fitting and kind in dealing with others; not blunt speech, and not skill in handling
  people with care.
examples:
- She was tactful enough not to tell him the bad news at once.
- A tactful word from her eased his shame.
