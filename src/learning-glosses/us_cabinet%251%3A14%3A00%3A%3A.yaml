simpleMeaning: A group that gives advice to the President, made up of the heads of the main government
  departments, though the land's written laws do not set it up.
scope: 'Also called the United States Cabinet: a group that gives advice to the President, made up of
  the heads of the main government departments, though the land''s written laws do not set it up, different
  from the President''s own staff and from the heads of the armed forces.'
examples:
- The US Cabinet met to advise the President.
- She joined the US Cabinet as head of a department.
