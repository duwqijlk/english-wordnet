simpleMeaning: A person whose work is to plan and run the service held for a dead person
scope: 'Also called funeral undertaker: a person whose work is to plan and run services for dead people;
  not a priest and not a maker of coffins.'
examples:
- The funeral director met the family to plan the service.
- She asked the funeral director about the cost of the burial.
