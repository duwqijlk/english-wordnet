simpleMeaning: Living and feeding on plants in inland lakes and streams, this tiny cone-shaped snail only
  looks like a sea shellfish.
scope: Also called a river limpet, this is a tiny cone-shaped snail that only looks like a sea shellfish
  but lives and feeds on plants in inland lakes and streams.
examples:
- The freshwater limpet clung to a stone in the stream.
- Freshwater limpets feed on the plants in the pond.
