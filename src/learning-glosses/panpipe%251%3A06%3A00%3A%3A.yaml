simpleMeaning: a simple wind instrument made of several straight tubes tied side by side
scope: A simple wind instrument made of several straight tubes tied side by side; pandean pipe and syrinx
  are other names for this sense, and it is not a single tube or a modern wind instrument.
examples:
- He played a tune on the panpipe.
- The panpipe is made of tubes tied side by side.
