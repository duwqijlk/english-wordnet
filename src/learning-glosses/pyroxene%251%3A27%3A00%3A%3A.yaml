simpleMeaning: Any of a group of crystal-shaped minerals made of silicon and oxygen, often found in rocks
  formed from cooled lava or from heat and pressure
scope: One of a group of crystal-shaped minerals in rock, not quartz and not feldspar, and not one single
  kind of stone.
examples:
- Pyroxene is common in volcanic rock.
- The geologist found pyroxene in the cooled lava.
