simpleMeaning: of fruits and the like, not opening on its own when ripe to let the seeds out
scope: Of a fruit, not opening on its own when ripe to free its seeds, not a fruit that bursts open and
  not a seed that will not grow.
examples:
- The indehiscent pods stayed shut long after they ripened.
- Farmers pick the indehiscent fruit before it dries.
