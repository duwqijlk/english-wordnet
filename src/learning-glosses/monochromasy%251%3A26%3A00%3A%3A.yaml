simpleMeaning: One shade can be told from another only by how light or dark it is, and no colour at all
  is seen
scope: 'Also called monochromacy, monochromatic vision, monochromatism and monochromia: a state of seeing
  with no colour at all, not poor colour sight and not night blindness.'
examples:
- Monochromasy left him able to tell things apart only by how bright they were.
- With monochromasy, she sees no colour in a rainbow.
