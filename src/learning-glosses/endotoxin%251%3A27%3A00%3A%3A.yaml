simpleMeaning: Tiny living things hold this poison inside them, and it comes out only when they break
  apart or die
scope: A poison held inside tiny living things and set free only when they break apart or die, not a poison
  made outside them and not a poison that is always free.
examples:
- The endotoxin stays inside the germs until they die.
- When the cells broke apart, the endotoxin was set free.
