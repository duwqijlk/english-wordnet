schema: oewn-learning-gloss-v2
senseId: 'partitioning%1:04:00::'
synsetId: 00398761-n
simpleMeaning: the act of splitting something into parts, or of making a mark that sets something off
  and keeps it apart
scope: The act of splitting something into parts or setting something apart by a mark; division, partition,
  segmentation, sectionalisation and sectionalization are other names for this sense.
examples:
- The partitioning of the hall into two rooms took a week.
- Partitioning the land kept the two farms apart.
