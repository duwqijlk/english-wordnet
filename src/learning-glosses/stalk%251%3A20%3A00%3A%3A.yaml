simpleMeaning: A thin long part that holds up a plant, a fungus, or a part of a plant
scope: This is the thin part that holds a plant up, not the dry bits left after seeds are taken out, and
  not the act of following someone in secret.
examples:
- The flower's stalk bent in the wind but did not break.
- Cut the stalk close to the base of the plant.
