  a source of gold in Australia and America.
scope: A silver-white mineral made of silver, gold and a third element joined to them, a source of gold
  in Australia and America, not a gold nugget and not a silver ore.
examples:
- Graphic tellurium was mined in Australia for its gold.
- The graphic tellurium sample shone silver-white.
