simpleMeaning: A set of rooms joined to each other, used as one place to live, as in a hotel
scope: 'Also called rooms: a set of rooms joined together as one place to live, not a set of pieces of
  music and not a set of furniture.'
examples:
- They booked a suite at the hotel for the weekend.
- The suite had a bedroom, a sitting room, and a small kitchen.
