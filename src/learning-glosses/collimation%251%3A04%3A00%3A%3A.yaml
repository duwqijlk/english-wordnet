simpleMeaning: the careful setting of the line of sight of a telescope so that it points true
scope: This is the careful setting of the line of sight of a telescope so that it points true; not the
  telescope itself, and not a fault in its lenses.
examples:
- Good collimation makes the stars sharp in the eyepiece.
- After the move, the collimation of the telescope had to be checked.
