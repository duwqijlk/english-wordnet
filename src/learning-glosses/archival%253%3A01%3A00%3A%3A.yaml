simpleMeaning: about a kept set of old records, held in such a set, or serving as such a set
scope: This word describes a thing and its link to a kept set of old records; it is not the set of records
  itself and does not just mean very old.
examples:
- The museum keeps its archival papers in a cool, dry room.
- She found an archival copy of the letter from 1920.
