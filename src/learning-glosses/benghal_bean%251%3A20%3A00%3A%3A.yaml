simpleMeaning: A one-year woody vine of Asia with long clusters of purplish flowers and densely hairy
  pods; grown in the southern United States to feed the soil and for grazing.
scope: 'Also called cowage, the velvet bean, Bengal bean, the Florida bean, Mucuna aterrima, Mucuna deeringiana,
  Mucuna pruriens utilis, and Stizolobium deeringiana: a one-year woody vine of Asia grown in the southern
  United States for green manure and grazing.'
examples:
- Benghal bean grew thick along the fence by the field.
- Farmers planted Benghal bean to feed the soil.
