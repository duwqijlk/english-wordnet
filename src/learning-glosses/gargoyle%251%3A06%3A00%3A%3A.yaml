simpleMeaning: A carved figure of a person or animal, made strange and ugly, set up as a decoration
scope: An ornament of a grotesquely carved figure of a person or animal, not the spout sense that ends
  in such a figure.
examples:
- A gargoyle grinned down from the roof edge.
- The old church was decked with gargoyles.
