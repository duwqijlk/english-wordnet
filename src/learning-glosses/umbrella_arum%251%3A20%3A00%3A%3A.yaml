simpleMeaning: A bad-smelling, fleshy tropical plant from Southeast Asia, grown for edible starchy underground
  stems or in greenhouses for big leaves and a dark red hood around its flower spike.
scope: One of three names for the same smelly Southeast Asian aroid, alongside devil's tongue and snake
  palm; it is not taro, and not an ornamental arum lily.
examples:
- A dark red spathe curled around the umbrella arum's flower spike.
- She grows umbrella arum for its starchy corms.
