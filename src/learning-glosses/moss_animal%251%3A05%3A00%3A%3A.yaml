simpleMeaning: A water creature that stays fixed and lives in dense colonies of tiny tube-shaped bodies,
  each ringed with tentacles; it grows on stones or seaweed and multiplies by budding.
scope: This is a colony-forming water animal that looks like moss, not a plant or seaweed.
examples:
- A moss animal colony can coat a rock like a thin carpet.
- Divers often mistake a moss animal for a kind of seaweed.
