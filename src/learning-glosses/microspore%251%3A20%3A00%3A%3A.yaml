simpleMeaning: the smaller of two kinds of spore made by some plants, growing in the pollen sac into the
  male form that makes sex cells
scope: The smaller of two kinds of spore in some plants; not the larger kind and not a seed.
examples:
- The microspore grows in the pollen sac of the plant.
- A microspore becomes the male form that makes sex cells.
