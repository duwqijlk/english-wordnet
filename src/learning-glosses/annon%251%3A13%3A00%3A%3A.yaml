simpleMeaning: Inside a thick skin covered in scales, this sweet soft fruit of warm lands holds shiny
  black seeds.
scope: 'Also called annona, sugar apple and sweetsop: a sweet soft fruit of warm lands with a thick scaly
  skin, not the tree it grows on.'
examples:
- The annon was sweet and soft, with shiny black seeds inside.
- She cut open an annon to reach the soft fruit.
