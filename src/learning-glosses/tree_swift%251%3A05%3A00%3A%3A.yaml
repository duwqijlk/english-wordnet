simpleMeaning: With upright crests on their heads, these birds of southeast Asia and the East Indies nest
  among branches, unlike true swifts.
scope: 'Also called a crested swift: a bird of southeast Asia with an upright crest that nests among branches,
  not a true swift.'
examples:
- Tree swifts nest among branches.
- A tree swift has an upright crest.
