simpleMeaning: A thin shiny cloth made from the wool of the Lama pacos, or from a rayon or cotton copy
  of that wool.
scope: This sense is a thin shiny cloth made from the wool of the Lama pacos, or from a rayon or cotton
  copy of that wool, unlike the sense for a tame llama with long silky fleece, thought to be a tame kind
  of the guanaco.
examples:
- An alpaca cloth shone thin.
- Alpacas are thin and shiny.
