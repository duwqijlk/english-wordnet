simpleMeaning: a person who helps find, stop, or treat sickness or a lasting problem with the body or
  mind
scope: 'Also called a caregiver, a health care provider, and a health professional: a person who helps
  find, stop, or treat sickness or a lasting problem with the body or mind, not a building or a drug.'
examples:
- My primary care provider helped find why I kept feeling sick.
- You can ask your primary care provider for help to stop an illness before it gets worse.
