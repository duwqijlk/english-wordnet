simpleMeaning: A style of African-American music from the 1980s and 1990s in which rhyming words are chanted
  over a musical backing; several kinds of rap have emerged from it.
scope: This is the music genre built on chanted rhyming lyrics, not a single rap performance and not the
  wider street culture of dance, art and clothing that shares the name.
examples:
- By the early 1990s, hip-hop had taken over the radio.
- His first record mixed hip-hop with jazz samples.
