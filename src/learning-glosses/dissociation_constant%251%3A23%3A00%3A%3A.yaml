senseId: 'dissociation_constant%1:23:00::'
synsetId: 13611160-n
simpleMeaning: a number that shows where the balance sits when a thing can split apart and come back together
scope: A number showing the balance point of a splitting that can run back the other way, not a measure
  of how fast the splitting happens and not the heat it takes.
examples:
- The dissociation constant of the weak acid told them how far it would split in water.
- A high dissociation constant means the salt splits apart more easily in water.
