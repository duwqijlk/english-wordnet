simpleMeaning: A radioactive element beyond uranium, made by hitting einsteinium with alpha particles;
  the sign now used for it is Md, and Mv was its old sign.
scope: Also called atomic number 101, Md, and Mv; a radioactive element beyond uranium, not a stable metal
  and not a gas.
examples:
- Mendelevium is a radioactive element made in the laboratory.
- The symbol for mendelevium was once Mv, but now it is Md.
