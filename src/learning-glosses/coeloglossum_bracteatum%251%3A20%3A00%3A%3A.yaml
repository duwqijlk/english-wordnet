simpleMeaning: An orchid with broad egg-shaped leaves and green flowers of a very uneven shape, each with
  a long leaf-like part at its base.
scope: An orchid, also called satyr orchid, set apart from the frog orchid by its broad egg-shaped leaves
  and the long leaf-like parts at the base of its flowers.
examples:
- Coeloglossum bracteatum grew in the damp field.
- The Coeloglossum bracteatum flowers were green and uneven.
