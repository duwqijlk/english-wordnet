simpleMeaning: a floating plant found in warm lands everywhere, making a ring of wedge-shaped leaves,
  a common weed in rivers and lakes
scope: Also called water cabbage and water lettuce; not a water lily and not a plant that grows in soil.
examples:
- Pistia floats on the pond in a neat ring of leaves.
- The river was choked with pistia after the rains.
