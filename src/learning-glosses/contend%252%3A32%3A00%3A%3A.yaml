simpleMeaning: to bring something forward as a matter to argue about, in a dispute or in a court of law
scope: To raise something as a point to be argued over, also called contest, not to compete for something
  and not to cope with too little.
examples:
- They contended that the will was not valid.
- The lawyers contended every point of the claim in court.
