simpleMeaning: In law, a protest from either side, or the choice of the judges, can take a judge or jury
  off a case because of bias or a clash of interests.
scope: In law, a judge or jury taken off a case for bias or a clash of interests is also called recusal.
examples:
- The defence sought the recusation of the juror for bias.
- A recusation may come from either side in the case.
