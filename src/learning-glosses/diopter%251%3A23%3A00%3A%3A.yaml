simpleMeaning: A measure of how strongly a lens bends light, worked out from one over its focal length
  in metres, and used by eye doctors
scope: A measure of a lens's power, also called dioptre; not the lens itself.
examples:
- The diopter of the lens was written on the box.
- The eye doctor checked the diopter before ordering new glasses.
