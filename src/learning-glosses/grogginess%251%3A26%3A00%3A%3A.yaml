simpleMeaning: the state of feeling very tired, weak and not able to think clearly because you need rest
scope: The tired, weak feeling that comes from needing rest, not the mixed-up, unsteady feeling caused
  by alcohol.
examples:
- Grogginess stayed with her all morning after a night with almost no sleep.
- His grogginess made it hard to think clearly until he had rested.
