  which calms the body and brings sleep.
scope: Taken to calm the body and bring sleep, this barbiturate drug eases sleeplessness and stops fits.
examples:
- Sleeplessness eased with amobarbital, and sleep came through the night.
- With amobarbital, the fits stopped and sleep came.
