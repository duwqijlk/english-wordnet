simpleMeaning: Used to shape things when hot, a man-made stuff made from one kind of small part joined
  again and again
scope: Also called polypropylene, this man-made stuff is used to shape things when hot, not the light
  stuff used for wrapping and keeping heat in.
examples:
- This chair is made of polypropene, a tough plastic.
- Polypropene can be heated and shaped into many forms.
