synsetId: 00341137-a
simpleMeaning: sure to happen; fixed by fate or impossible to avoid
scope: This is not about someone feeling sure or having no doubt; it is about an event that will definitely
  happen.
examples:
- With the storm closing in, a cancellation seemed certain.
- The senator's re-election looked certain until the scandal broke.
