simpleMeaning: The place for the baseball player who catches balls hit to one third on one side of the
  outer ground, seen from the plate where batters stand
scope: The spot for the player who covers one side of the outer ground; left field is another name for
  this sense, not the middle or the other side of the outer ground.
examples:
- He plays leftfield for the home team.
- The ball sailed over the leftfield fence.
