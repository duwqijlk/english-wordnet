schema: oewn-learning-gloss-v2
senseId: 'figure%1:10:01::'
synsetId: 07120141-n
simpleMeaning: Words used in a way that is not literal, so the plain sense is not the one meant.
scope: Not literal language, and not a numeral or a drawn shape.
examples:
- '''A sea of troubles'' is a figure of speech that pictures trouble as an ocean.'
- The teacher explained that 'the classroom was a zoo' uses a figure of speech, not a literal claim.
