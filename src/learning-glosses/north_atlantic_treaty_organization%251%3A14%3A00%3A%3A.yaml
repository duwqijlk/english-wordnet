simpleMeaning: An international body set up in 1949 under an agreement between countries, for their shared
  defence.
scope: This is an international body set up in 1949 under an agreement between countries for their shared
  defence, also called NATO; not the council that runs it and not other international bodies.
examples:
- The North Atlantic Treaty Organization was created in 1949.
- The North Atlantic Treaty Organization works for collective security.
