simpleMeaning: A skilled worker who fills and sets up the skins of dead creatures so they can be shown
scope: A skilled worker who fills and sets up dead creatures' skins for show; taxidermist is another name
  for this sense, not a hunter and not a worker who makes leather clothes.
examples:
- The animal stuffer prepared the fox for the museum show.
- An animal stuffer mounted the deer head for display.
