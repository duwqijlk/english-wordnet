simpleMeaning: a coat or sweater with sleeves that join the body in a long slant from the neck to under
  the arm
scope: A coat or sweater with slanting sleeves that reach the neck, not a coat with sleeves sewn on at
  the shoulder and not a cape.
examples:
- She wore a warm raglan to the game.
- His new raglan had long sleeves that ran right up to the collar.
