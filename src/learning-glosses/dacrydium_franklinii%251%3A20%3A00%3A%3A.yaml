simpleMeaning: A Tasmanian timber tree with yellow, sweet-smelling, wavy-grained wood used for carving
  and building ships, sometimes put in the genus that shares its name.
scope: Also called huon pine and Lagarostrobus franklinii; a Tasmanian timber tree whose wood is used
  for carving and shipbuilding.
examples:
- Dacrydium franklinii grows in Tasmania.
- Shipbuilders use Dacrydium franklinii wood.
