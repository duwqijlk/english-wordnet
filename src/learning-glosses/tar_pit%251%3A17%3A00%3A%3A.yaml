simpleMeaning: A natural pool of thick black sticky stuff at the surface of the earth, often a trap for
  animals whose bones are kept safe in it
scope: A natural pool of thick black sticky stuff on the earth's surface that often traps animals, keeping
  their bones safe; not a man-made hole and not a pool of water.
examples:
- The tar pit trapped the mammoth thousands of years ago.
- Bones found in the tar pit were kept safe for study.
