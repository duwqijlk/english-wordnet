simpleMeaning: to change a text by taking out or changing parts that are thought rude or not fit to read
scope: Also called shorten and expurgate. This is about changing a text, not about a man who cannot have
  children, and not about removing sex parts from a person or animal.
examples:
- The editor castrated the novel by removing all the rude scenes.
- They castrated the play for schools, changing the words some people thought rude.
