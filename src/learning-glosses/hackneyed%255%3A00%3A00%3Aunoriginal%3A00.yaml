senseId: hackneyed%5:00:00:unoriginal:00
synsetId: 01693210-s
simpleMeaning: Worn out by too much use, too well known.
scope: This sense is also called tired, stock, threadbare, commonplace, banal, trite, and timeworn, for
  being worn out by too much use, too well known, where tired means said or used so often that it has
  grown too familiar to feel fresh, stock means an expression or idea used so often that it feels too
  familiar and no longer fresh, and threadbare means used so many times that it feels old and worn out,
  with nothing new left in it.
examples:
- The joke was hackneyed, worn out by too much use.
- The phrase was hackneyed, too well known.
