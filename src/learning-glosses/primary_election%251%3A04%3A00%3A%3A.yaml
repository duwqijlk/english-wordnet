simpleMeaning: an early vote that picks a party's candidates and delegates for a later vote
scope: Also called primary, this early vote picks a party's candidates and delegates for a later vote,
  not the final vote and not a vote on a law.
examples:
- The primary election will be held in March, months before the main vote.
- She won the primary election and will now stand for the party in November.
