simpleMeaning: The older parts of the brain in its long history, that is, nearly all of it except the
  outer layer
scope: The older parts of the brain in its long history; palaeencephalon and paleoencephalon are other
  names for it, not the outer layer itself and not the whole brain.
examples:
- The paleencephalon covers most of the brain outside the cortex.
- Damage to the paleencephalon can upset basic body control.
