scope: Of or like one of the traditional racial divisions of humankind, above all central and eastern
  Asian peoples; not the noun sense of a member of that group.
examples:
- Mongoloid features were once used to sort people into groups.
- The old books called the peoples of eastern Asia Mongoloid.
