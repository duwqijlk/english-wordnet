simpleMeaning: purple flowers and fruits tipped with soft plumes mark this North American plant, which
  lives for years; its hairy leaves sit low at the base, split into pairs of leaflets
scope: Also called purple avens; a plant of the prairie with purple flowers and plume-tipped fruits, not
  a smoke or a fire.
examples:
- Prairie smoke grows in open grassland in the spring.
- The prairie smoke in the garden had purple flowers and feathery fruits.
