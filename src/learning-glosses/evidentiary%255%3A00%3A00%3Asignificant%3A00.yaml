simpleMeaning: Used as facts that show what is true, or built on such facts.
scope: Based on facts that show what is true; evidential is another name for this sense, not a word for
  something that only relates to such facts.
examples:
- The evidentiary value of the letter was clear to the judge.
- Evidentiary signs of a forced entry were found at the door.
