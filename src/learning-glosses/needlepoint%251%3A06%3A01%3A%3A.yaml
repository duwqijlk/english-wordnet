simpleMeaning: Lace made with a needle, using buttonhole stitch (a stitch made of loops) on a pattern
  on paper
scope: 'Also called point lace. It is not the other sense of this word: sewing with thread on thick cloth
  to make a picture like a wall hanging.'
examples:
- The needlepoint on her dress was lace made with a needle over a paper pattern.
- This needlepoint edging is fine lace, light and full of small open spaces.
