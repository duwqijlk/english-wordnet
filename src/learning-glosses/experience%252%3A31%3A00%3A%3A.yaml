simpleMeaning: to know a feeling or situation from having been in it yourself.
scope: It is not a passing feeling and not skill built up over years, but personal knowledge of a state
  or emotion.
examples:
- She has experienced real grief, so she knows how to sit with someone who is hurting.
- He has experienced poverty himself and understands the pressure it puts on a family.
