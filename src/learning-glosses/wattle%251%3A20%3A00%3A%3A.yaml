simpleMeaning: any of several trees from Australia and nearby places that give thin poles used to make
  woven branch fences
scope: This is a tree that gives thin poles, not the fence frame made from those poles and not the fold
  of skin on a bird's neck.
examples:
- A wattle tree grew near the fence and gave long, thin poles.
- They cut poles from the wattle for the new fence.
