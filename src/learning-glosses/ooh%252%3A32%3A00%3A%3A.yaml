senseId: 'ooh%2:32:00::'
synsetId: 00867440-v
simpleMeaning: to show you admire something and are pleased by it by making 'oo' or 'aa' sounds
scope: Also called aah. It means making an 'oo' or 'aa' sound because you like something; not shouting
  in pain or for help.
examples:
- They oohed over the baby's tiny shoes.
- She oohed when she opened the box and saw the gift.
