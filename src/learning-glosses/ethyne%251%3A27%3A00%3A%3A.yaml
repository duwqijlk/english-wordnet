simpleMeaning: A gas with no colour that catches fire with ease, used most of all in joining metals with
  heat and in making new carbon-based substances.
scope: A gas with no colour that burns with ease, also called acetylene and alkyne; not air and not a
  gas used for light.
examples:
- The welder lit the ethyne to join the two steel bars.
- Ethyne burns hot enough to cut metal.
