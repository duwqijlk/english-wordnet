scope: The cup-shaped hollow in the hip bone where the top of the thigh bone fits to make a ball-and-socket
  joint; acetabulum is another name for this sense, not the thigh bone itself, and not the knee joint.
examples:
- The cotyloid cavity holds the head of the thigh bone.
- A fracture of the cotyloid cavity can ruin the hip joint.
