simpleMeaning: the state of not being neat or well ordered, when things are messy and not in their right
  places
scope: This is the state of a person or place being messy and not neat; it is not the lasting part of
  a person's character that makes them messy.
examples:
- The untidiness of his room surprised his mother.
- She was ashamed of the untidiness in the kitchen after the party.
