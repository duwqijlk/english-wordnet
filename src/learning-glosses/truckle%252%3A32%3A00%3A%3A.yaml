senseId: 'truckle%2:32:00::'
synsetId: 00882499-v
simpleMeaning: To try to win favour by acting humble and fearful and praising someone too much.
scope: Also called fawn, kowtow, toady, or bootlick, this is trying to win favour by acting humble and
  fearful and praising someone too much.
examples:
- He would truckle to his boss to win favour.
- She refused to truckle to anyone for a better post.
