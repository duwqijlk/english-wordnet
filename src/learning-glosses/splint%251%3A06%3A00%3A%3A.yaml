senseId: 'splint%1:06:00::'
synsetId: 04289632-n
simpleMeaning: a stiff support fixed to an injured part of the body, such as a broken leg, to keep it
  still and keep it safe
scope: A stiff support put on an injured part of the body, not the act of putting one on.
examples:
- The doctor put a splint on her broken wrist.
- He wore a splint to keep his leg still while it healed.
