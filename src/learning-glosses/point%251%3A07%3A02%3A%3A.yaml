simpleMeaning: A quality that helps distinguish a person or thing from others.
scope: This is not an item on a written list or the shape of a sharp tip; it is a particular quality that
  sets someone or something apart.
examples:
- Patience is one of her best points.
- One of his weak points is that he often forgets appointments.
