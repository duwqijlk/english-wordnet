simpleMeaning: In pathology, the time after a germ that can cause disease first gets into the body and
  before the first signs of illness show
scope: This is the early time of an illness in the body, not keeping eggs warm to hatch them and not keeping
  something at the best heat for it to grow.
examples:
- The incubation of the flu lasts a few days, so she only got sick on Friday.
- During incubation, a person may feel well but already carry the germ.
