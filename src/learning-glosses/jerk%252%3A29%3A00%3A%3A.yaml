senseId: 'jerk%2:29:00::'
synsetId: 00009624-v
simpleMeaning: to move once in a sudden way that you cannot control, and only for a very short time
scope: 'Also called twitch: one short, sudden move that is not under control; it is not moving again and
  again in that way, and not the dried meat sense.'
examples:
- His eye jerked once under the bright light.
- A muscle in her cheek jerked for a second and then stopped.
