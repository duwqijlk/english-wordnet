simpleMeaning: Unlike any other smell, this one puts people off with how bad it is
scope: Also called malodor, stink, stench, reek, fetor, foetor and mephitis, this is a smell you can pick
  out at once because it is so bad, not a faint smell and not a nice one.
examples:
- The malodour from the bins drifted across the yard.
- He wrinkled his nose at the malodour in the old cellar.
