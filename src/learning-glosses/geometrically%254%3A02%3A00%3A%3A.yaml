simpleMeaning: In a way that follows the rules of shapes and their sizes and angles
scope: In a way that follows the rules of shapes; not in a free, uneven way and not merely about size.
examples:
- It grew geometrically, doubling in size each year.
- The pattern grew geometrically across the wall.
