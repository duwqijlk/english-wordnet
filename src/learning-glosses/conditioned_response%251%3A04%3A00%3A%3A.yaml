simpleMeaning: a learned reply that takes place only after a set signal appears
scope: This is a learned reply that takes place only after a set signal appears; acquired reflex, conditional
  reaction, conditional reflex, conditional response, conditioned reaction and conditioned reflex are
  other names for this sense, not a reflex you are born with and not a free act done by choice.
examples:
- The conditioned response appeared each time the tone sounded.
- His conditioned response to the smell was to feel hungry at once.
