simpleMeaning: to tell a person a thing with no doubt, in a firm and sure way
scope: 'Also called tell: to tell a person a thing with no doubt, not to tell them a thing is true so
  they feel safe about it.'
examples:
- He assured the court that he had told the truth.
- I assure you, the work is done.
