simpleMeaning: a container for rubbish that stays in it until the rubbish is collected
scope: 'Also called ash-bin, ash bin, ashcan, dustbin and garbage can: a container for rubbish waiting
  to be collected, not a bag of rubbish and not a place where rubbish is burned.'
examples:
- The ashbin stood beside the garden gate.
- She tipped the cold ashes into the ashbin.
