simpleMeaning: A large shark of the warm open sea with a long whip-like tail it uses to herd small fish
  for food.
scope: 'Also called the thresher shark, thresher, fox shark and thrasher: a shark of the warm open sea
  that herds small fish with its long whip-like tail.'
examples:
- An Alopius vulpinus swept its long tail to herd a school of small fish.
- The Alopius vulpinus uses its whip-like tail to round up the fish it feeds on.
