simpleMeaning: An old tongue of India, from Sanskrit, used as the holy and church tongue of Theravada
  Buddhism.
scope: Also called Pali; among the old tongues of India, it is the one used for the holy books and worship
  of Theravada Buddhism.
examples:
- Monks chant in Pali language during the service.
- The holy books of Theravada Buddhism are written in Pali language.
