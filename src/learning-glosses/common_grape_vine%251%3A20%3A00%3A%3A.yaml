simpleMeaning: A fruit plant of Europe grown in many kinds, the main source of old-world wine and fruit
  for the table
scope: A fruit plant of Europe grown in many kinds, the main source of old-world wine and fruit for the
  table; not a fruit plant of the New World and not a plant grown for juice alone.
examples:
- The common grape vine covered the sunny wall.
- They pruned the common grape vine in spring.
