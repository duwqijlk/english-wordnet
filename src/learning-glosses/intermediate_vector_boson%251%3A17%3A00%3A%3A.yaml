simpleMeaning: A tiny bit that carries the weak force between bits of matter.
scope: A tiny bit that carries the weak force between bits of matter; not the bit that carries light and
  not the bit that holds the heart of an atom together.
examples:
- The intermediate vector boson carries the weak force.
- Physicists found the intermediate vector boson in their tests.
