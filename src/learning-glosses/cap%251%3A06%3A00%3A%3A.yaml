simpleMeaning: a covering that fits close on the head and is worn there
scope: A close-fitting covering worn on the head, not the top of a mushroom, not a small explosive, and
  not the top of a column.
examples:
- He wore a warm wool cap in the cold weather.
- Her swimming cap kept her hair dry in the pool.
