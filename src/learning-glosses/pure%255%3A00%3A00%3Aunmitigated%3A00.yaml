simpleMeaning: complete and without any limit, used in informal speech to make a word stronger, often
  to show dislike
scope: 'Also called perfect, complete, staring, and utter: this sense makes a word stronger and means
  complete and total, not a person having no faults and not a color free of white or black.'
examples:
- That story was pure nonsense and no one believed a word of it.
- It was pure folly to walk home alone in the storm.
