simpleMeaning: a tall, upright plant of eastern North America that lives for years, with many leaves and
  thick bunches of sky-coloured flowers
scope: 'Also called great lobelia: a tall leafy plant with thick bunches of blue flowers, not the red
  cardinal flower.'
examples:
- The blue cardinal flower grows tall beside the stream in summer.
- Bees visit the blue cardinal flower for its thick bunches of blooms.
