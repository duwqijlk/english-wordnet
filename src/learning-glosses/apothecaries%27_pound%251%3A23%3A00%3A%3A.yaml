simpleMeaning: a weight used by makers of medicine, equal to 12 ounces or 373.242 grams
scope: A unit of weight used by makers of medicine, not a pound used for ordinary goods and not a weight
  of 16 ounces.
examples:
- The chemist weighed the powder in apothecaries' pounds.
- An apothecaries' pound holds 12 ounces, while an ordinary pound holds 16.
