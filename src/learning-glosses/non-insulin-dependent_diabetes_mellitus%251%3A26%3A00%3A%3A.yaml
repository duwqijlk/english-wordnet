schema: oewn-learning-gloss-v2
senseId: 'non-insulin-dependent_diabetes_mellitus%1:26:00::'
synsetId: 14142418-n
simpleMeaning: A mild adult sugar-processing problem that appears slowly and may be caused by obesity,
  severe stress, menopause or other factors, usually controlled by diet and sugar-lowering drugs, not
  insulin.
scope: The long older name for this same mild adult form of diabetes, not the form that starts in childhood
  and needs insulin injections.
examples:
- Non-insulin-dependent diabetes mellitus was the term in his file, though he took no insulin.
- Older guidelines describe non-insulin-dependent diabetes mellitus as a mild, slow-starting condition.
