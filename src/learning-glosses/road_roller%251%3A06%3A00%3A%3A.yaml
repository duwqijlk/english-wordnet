simpleMeaning: a heavy vehicle with wide smooth drums that turn as it moves, pressing down the surface
  of streets and paths
scope: A heavy vehicle with wide smooth drums that press down streets and paths; steamroller is another
  name for it, not a lorry for carrying loads and not a farm tractor.
examples:
- The road roller pressed the new tarmac flat.
- A road roller followed the men laying the path.
