senseId: 'lute%1:27:00::'
synsetId: 14730375-n
simpleMeaning: a stuff used to fill a join or to cover a surface full of tiny holes, so that gas or liquid
  cannot pass through it
scope: A stuff that seals a join or a surface full of tiny holes, not the stringed musical instrument
  and not glue for sticking things together.
examples:
- He used lute to seal the joint in the pipe.
- The lute kept the gas from leaking out.
