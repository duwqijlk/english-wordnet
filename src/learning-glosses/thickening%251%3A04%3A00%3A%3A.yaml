senseId: 'thickening%1:04:00::'
synsetId: 00358732-n
simpleMeaning: the act of becoming less thin or less runny, or of making something become like this
scope: The act itself; not the stuff you add to a liquid to make it less runny, and not a part that has
  become wider.
examples:
- The thickening of the sauce took a few minutes over low heat.
- The thickening of the paint made it hard to spread on the wall.
