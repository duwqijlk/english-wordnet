senseId: 'air-sleeve%1:10:00::'
synsetId: 07272250-n
simpleMeaning: Set high on a pole at a flying field, this short cloth cone, cut off at the tip, turns
  with the wind to show which way it blows.
scope: 'Also called a sock, a drogue, a windsock, an air sock, a wind cone, a wind sleeve, or a wind sock:
  a short cloth cone with its tip cut off, set on a tall pole to show which way the wind blows, not a
  flag.'
examples:
- The air-sleeve on the pole pointed with the wind.
- The air-sleeve showed which way the wind blew.
