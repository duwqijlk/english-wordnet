simpleMeaning: A joint that joins two shafts (turning metal rods) and lets them move in all directions
scope: This is a moving joint in a machine, not a pattern shared by all people and not a rule found in
  all languages.
examples:
- A worn universal made the truck shake as it went over bumps.
- He replaced the universal joint so the shaft could move up and down.
