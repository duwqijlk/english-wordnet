simpleMeaning: a farm tool with a row of turning wheels with spikes, used to break up the top of the soil
  and make it smooth
scope: A farm tool with turning spiked wheels, not a plough and not a roller.
examples:
- The farmer pulled the rotary harrow across the field.
- A rotary harrow broke up the hard soil and left it smooth.
