simpleMeaning: a substance that helps the body turn food and oxygen into energy in a set of steps called
  the Krebs cycle
scope: This is a substance that helps the body make energy in the Krebs cycle, not a vitamin and not a
  drug that treats illness.
examples:
- Cocarboxylase helps cells release energy from food.
- Without cocarboxylase, the Krebs cycle would slow down.
