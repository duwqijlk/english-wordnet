simpleMeaning: A rough plant of the Old World that lives for years, with a big bulb and a tall stem of
  greenish flowers touched with purple; now wild in many places
scope: Also called kurrat, wild leek, or Allium ampeloprasum; a rough Old World plant with a big bulb
  and a tall stem of greenish flowers touched with purple.
examples:
- Levant garlic grew along the wall, its tall stem topped with greenish flowers.
- She dug up the Levant garlic bulb to plant it in her own garden.
