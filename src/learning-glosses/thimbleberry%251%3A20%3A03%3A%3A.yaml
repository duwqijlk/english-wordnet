simpleMeaning: A bushy raspberry plant of eastern North America, with showy flowers from rose pink to
  purple and red or orange fruit shaped like a thimble.
scope: Also called a flowering raspberry or a purple-flowering raspberry; a bushy raspberry with showy
  pink-to-purple flowers and red or orange thimble-shaped fruit, not the western kind with orange berries
  or the eastern kind with black fruit.
