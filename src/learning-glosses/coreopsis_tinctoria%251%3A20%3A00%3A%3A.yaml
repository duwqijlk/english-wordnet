simpleMeaning: A North American plant that lives one year, widely grown for its yellow flowers with purple-red
  to brownish centres; some place it in a smaller group called Calliopsis.
scope: 'Also called calliopsis: a North American plant that lives one year, grown for its yellow flowers,
  not a long-lived shrub and not a plant with white flowers.'
