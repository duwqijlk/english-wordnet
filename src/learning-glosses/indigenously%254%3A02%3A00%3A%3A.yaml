senseId: 'indigenously%4:02:00::'
synsetId: 00059029-r
simpleMeaning: In the way of a thing that belongs to a place by birth, not brought in from outside.
scope: For a plant, animal, or way of life that belongs to a place by birth.
examples:
- The shrubs grew indigenously along the riverbank, and nowhere else in the region.
- They lived indigenously, in the way of the first people of the valley.
