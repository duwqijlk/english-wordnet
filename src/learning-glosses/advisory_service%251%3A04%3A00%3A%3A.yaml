simpleMeaning: Help from a CPA, a checker of money books, who works out findings, what they mean and what
  to do, and puts them to the customer to weigh and choose.
scope: This is a CPA's help in working out what to do, put to the customer to weigh and choose; it is
  not the checking of the books itself.
examples:
- The firm asked for advisory service when it needed help weighing what to do.
- Advisory service put the findings before the customer to weigh and choose.
