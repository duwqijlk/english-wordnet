simpleMeaning: A made-up line running round the earth beside the line round its middle, where a compass
  needle stays level and does not dip.
scope: A made-up line round the earth where a compass needle stays level, also called aclinic line, not
  the true line round the earth's middle and not a line of latitude drawn on a map.
examples:
- The magnetic equator runs through northern Brazil.
- Along the magnetic equator, the needle neither dips up nor down.
