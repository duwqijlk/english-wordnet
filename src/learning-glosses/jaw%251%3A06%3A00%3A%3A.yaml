simpleMeaning: one of a tool's opposing gripping parts, or both of them, that close on an object to hold
  it
scope: This is a tool's gripping part, not the bones of the mouth or the act of chewing.
examples:
- The vise's jaws clamped down on the metal pipe.
- He adjusted the jaws of the wrench to fit the nut.
