simpleMeaning: A game in which two players take turns putting crosses or rings into a nine-spot square
  grid, the aim being three in a row, crosses or rounds, first.
scope: This sense is also called noughts and crosses, tic-tac-toe, ticktacktoe, ticktacktoo, and tit-tat-toe.
examples:
- Tick-tack-toe is played on a grid.
- A tick-tack-toe ended in three rounds.
