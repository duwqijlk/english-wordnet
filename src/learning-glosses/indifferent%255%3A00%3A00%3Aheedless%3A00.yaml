simpleMeaning: usually with 'to' after it, unwilling to listen or take notice
scope: Not willing to listen or take notice, usually with 'to', also called deaf, not the sense of having
  no liking for one thing over another, not the chemical sense, and not the sense of not mattering.
examples:
- She was indifferent to his warnings and went on anyway.
- He remained indifferent to the danger and walked on.
