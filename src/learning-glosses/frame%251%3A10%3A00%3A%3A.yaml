simpleMeaning: one single drawing in a comic strip, one of a set of drawings in a row that tell a story
scope: One drawing in a comic strip; not a single still picture from a film, not a part of a baseball
  game, and not the part that holds a pair of glasses.
examples:
- The first frame of the comic strip shows the hero waking up.
- In the last frame of the comic strip, the dog finally catches the ball.
