simpleMeaning: to think of one thing as like or the same as another thing, or say so
scope: To think of one thing as like or the same as another, or say so, not to look at things side by
  side to mark how they differ.
examples:
- We can compare the old king to a wise father.
- You cannot compare hard work with greed.
