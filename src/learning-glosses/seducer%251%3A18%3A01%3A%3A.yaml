senseId: 'seducer%1:18:01::'
synsetId: 10594685-n
simpleMeaning: A bad person who makes others want to do wrong things or make mistakes
scope: A bad person who leads others to do wrong; not a person who is led into wrong himself, and not
  someone who helps others do good.
examples:
- The seducer told the young men that stealing was fun and easy.
- People warned her brother not to listen to the seducer who led others into trouble.
