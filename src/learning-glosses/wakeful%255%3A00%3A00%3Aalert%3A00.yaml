simpleMeaning: watching and listening with care, and looking out for danger that may come
scope: 'Also called watchful, vigilant, argus-eyed and open-eyed: watching with care for danger, not just
  being awake and not able to sleep.'
examples:
- The wakeful guard watched the gate all night for any danger.
- She stayed wakeful and listened for any sound while the children slept near the open door.
