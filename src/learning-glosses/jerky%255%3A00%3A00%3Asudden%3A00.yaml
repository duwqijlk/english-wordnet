simpleMeaning: changing suddenly from one thing to another, with no smooth steps in between
scope: Marked by sudden changes, not dried meat and not a beat without a steady rhythm.
examples:
- Her jerky prose jumped from one idea to the next.
- The film's jerky cuts made it hard to follow.
