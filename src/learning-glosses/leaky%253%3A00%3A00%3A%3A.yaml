simpleMeaning: letting liquids or gases go through in a way that is not wanted
scope: This sense is about liquids or gases getting out through a hole or crack, not about a person who
  cannot hold urine and not about a person who tells secret information.
examples:
- We put a bucket under the leaky pipe.
- The leaky roof let rain fall into the room.
