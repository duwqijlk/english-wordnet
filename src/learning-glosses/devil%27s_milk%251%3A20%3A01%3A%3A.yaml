simpleMeaning: a weed from Europe, not ugly to look at, whose flowers turn to face the sun
scope: This is a European weed whose flowers turn toward the sun, not a garden flower grown for show and
  not a weed with flowers that stay shut.
examples:
- Devil's milk grew along the edge of the field, its flowers turned toward the sun.
- She picked a stem of devil's milk and watched its flowers follow the light.
