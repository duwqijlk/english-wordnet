simpleMeaning: Sold as Pneumovax, this shot guards against the 23 kinds of small germs that are found
  most often
scope: A shot sold as Pneumovax that guards against the 23 kinds of small germs found most often, not
  a shot against other germs and not a medicine taken to cure a sickness.
examples:
- The nurse gave him the pneumococcal vaccine before the winter.
- She asked whether the pneumococcal vaccine would guard her against the commonest germs.
