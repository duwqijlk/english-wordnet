simpleMeaning: A mild blood-sugar problem that develops slowly in adults; obesity, stress, menopause or
  other factors can trigger it; diet and blood-sugar-lowering drugs (hypoglycemic agents) usually control
  it without insulin.
scope: This is an older name for type 2 diabetes, the adult form that seldom produces harmful acids; it
  is not the early-onset form that needs insulin, nor the pregnancy form.
examples:
- She was diagnosed with ketosis-resistant diabetes mellitus in her fifties.
- Older medical records often mention ketosis-resistant diabetes mellitus in patients who never needed
  insulin.
