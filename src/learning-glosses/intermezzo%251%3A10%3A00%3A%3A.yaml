senseId: 'intermezzo%1:10:00::'
synsetId: 07053366-n
simpleMeaning: A play or an opera has its acts split by a short piece of music with no singing, written
  to be played between them
scope: A short piece of music with no singing played between the acts of a play or an opera; not a short
  show of music or dance put between the parts of a longer show.
examples:
- The orchestra played a quiet intermezzo between the first and second acts of the opera.
- The composer wrote an intermezzo for the pause between acts of the drama.
