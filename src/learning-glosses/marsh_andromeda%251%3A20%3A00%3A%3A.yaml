simpleMeaning: An evergreen shrub with upright or trailing stems and hanging clusters of white or pink
  flowers, growing in peat bogs and other wet acidic ground in northern Europe.
scope: Another name for common bog rosemary, the low evergreen bog shrub, not the kitchen herb rosemary
  or a separate species.
examples:
- Marsh andromeda forms low mats of evergreen leaves in acid bogs.
- We found marsh andromeda blooming beside the sphagnum moss.
