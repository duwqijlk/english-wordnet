simpleMeaning: growing into a lump that sticks out, usually one that is too big
scope: A growth that sticks out, usually too big, not a normal part of the body and not a wound.
examples:
- The excrescent lump on the branch had to be cut away.
- An excrescent growth on his finger made it hard to wear a ring.
