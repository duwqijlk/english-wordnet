simpleMeaning: The colour is gone from the skin in a way that is not natural, after a bruise, sickness
  or upset feelings
scope: Also called lividity, lividness, pallor, paleness, pallidness and achromasia, this is the skin
  losing its colour in a way that is not natural, not a healthy pale skin and not the luridness of shocking
  news stories.
examples:
- Her luridness after the accident worried the nurse.
- The luridness of his skin showed he was ill.
