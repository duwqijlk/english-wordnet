simpleMeaning: As a fine mist, the liquid that burns is sprayed straight into the tubes of a motor by
  this set of parts, and no carburettor is needed.
scope: Also called a fuel injection system, this set of parts sprays the liquid that burns as a fine mist
  straight into a motor's tubes, doing away with the carburettor.
examples:
- The fuel injection in her car sprays fuel straight into the motor.
- With fuel injection, the motor needs no carburettor.
