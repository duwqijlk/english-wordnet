simpleMeaning: a thing that holds something shut so it cannot open
scope: A small thing that holds a door or lid shut, not a tall cupboard for clothes and things of value,
  and not a box for your own things kept at the foot of a bed.
examples:
- The locker on the gate was stiff, so the gate would not shut.
- She fixed a new locker to the lid of the wooden box.
