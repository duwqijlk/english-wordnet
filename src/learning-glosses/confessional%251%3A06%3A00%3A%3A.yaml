simpleMeaning: a small room or box in a church where a priest sits to listen as people tell him the bad
  things they have done
scope: A small room or box in a church for a priest to hear what people have done wrong, not the act of
  telling those things and not a place for prayer alone.
examples:
- She went into the confessional to tell the priest what she had done wrong.
- The wooden confessional stood at the back of the church.
