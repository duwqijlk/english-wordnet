simpleMeaning: A stick used on snow, made from the plant it is named for, a kind of bamboo.
scope: Also called Tonkin ski pole, this is a stick used on snow made from the plant it is named for,
  a kind of bamboo, not a stick of metal or wood.
examples:
- He leans on his Tonkin cane ski pole at the top of the run.
- He pushes with his Tonkin cane ski pole as he moves down the snow.
