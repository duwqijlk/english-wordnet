simpleMeaning: A plant from the south of Australia, with soft hairs like feathers all round its fruit
scope: A plant from southern Australia with feathery hairs round its fruit, not a plant with smooth fruit
  and not a northern Australian plant.
examples:
- The pteropogon grew low on the dry southern ground.
- The fruit of the pteropogon was ringed with fine feathery hairs.
