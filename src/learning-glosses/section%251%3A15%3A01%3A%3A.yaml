simpleMeaning: A separate part of a country, area, or group of people.
scope: It is not a thin piece cut for a microscope, and not a part of a written text; it is a part of
  a place or group.
examples:
- This section of the city has many old buildings.
- Every section of the community was represented at the meeting.
