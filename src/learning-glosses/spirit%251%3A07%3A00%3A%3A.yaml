simpleMeaning: the basic inner feeling or attitude that drives a person's actions and shapes the kind
  of person they are
scope: This is a person's inner drive or attitude, not the life force believed to keep a body alive, and
  not the rare verb meaning to fill someone with energy.
examples:
- Her generous spirit made everyone feel welcome.
- His fighting spirit inspired the whole team.
