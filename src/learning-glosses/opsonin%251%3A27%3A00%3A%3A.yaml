simpleMeaning: Germs and other things the body must fight get a fighter in the blood stuck to them, so
  the cells that eat germs can kill them more easily.
scope: It is a fighter in the blood that marks germs for the cells that eat them, not one that kills germs
  by itself.
examples:
- Opsonin stuck to the germs so the eater cells could kill them.
- Opsonin stuck to the other things the body must fight as well as to the germs.
