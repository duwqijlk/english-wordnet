simpleMeaning: about the study of big questions about life, knowledge, and right and wrong, or about the
  people who do that study
scope: About the ideas of philosophy, not the calm, steady way of facing trouble like a thinker.
examples:
- Her philosophical writing asks big questions about what is real.
- He studied philosophical ideas about how we know what is true.
