simpleMeaning: Through Europe far and wide grows this upright plant of the genus Arabis.
scope: This upright plant of the genus Arabis is also called tower mustard, and it grows far and wide
  through Europe, not the stiff-stemmed plant sometimes put in the group Turritis.
examples:
- This tower cress is found all over Europe.
- Where the tower cress grows, it stands upright.
