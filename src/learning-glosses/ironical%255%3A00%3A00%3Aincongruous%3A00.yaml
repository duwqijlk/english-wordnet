simpleMeaning: showing a sharp and often sad gap between what was expected and what really happened
scope: Also called ironic; about a sad gap between what was expected and what really happened, not mocking
  words meant to be funny.
examples:
- It was ironical that the well-planned scheme failed so completely.
- His ironical fate was to win the prize and lose the job on the same day.
