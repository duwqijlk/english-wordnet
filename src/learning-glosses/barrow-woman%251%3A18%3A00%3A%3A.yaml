simpleMeaning: a person who sells fruit and vegetables from a small cart she pushes
scope: 'Also called barrow-girl: a woman who sells fruit and vegetables from a small cart she pushes,
  not a man selling from a cart and not a seller in a shop.'
examples:
- The barrow-woman called out her prices as she pushed her cart down the street.
- I bought pears from the barrow-woman on the corner.
