simpleMeaning: the field of study about the ideas used to plan, build, and add decoration to fine buildings
scope: This is the study of how fine buildings are planned and made, not the job of planning buildings,
  not the way a computer is built inside, and not a finished building.
examples:
- She studied architecture at university because she loved old churches.
- Architecture teaches how a building can be both strong and beautiful.
