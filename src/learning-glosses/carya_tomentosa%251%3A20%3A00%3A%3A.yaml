senseId: 'carya_tomentosa%1:20:00::'
synsetId: 12342616-n
simpleMeaning: A smooth-barked North American hickory tree with seven to nine small leaves, bearing a
  nut with a hard shell that can be eaten.
scope: This sense covers only the smooth-barked North American hickory with seven to nine small leaves
  and a hard-shelled nut that can be eaten; big-bud hickory, black hickory, mockernut, mockernut hickory
  and white-heart hickory are other names for this sense.
examples:
- Carya tomentosa bears a nut with a hard shell.
- The Carya tomentosa in the woods has smooth bark.
