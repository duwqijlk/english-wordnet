senseId: 'paper_profit%1:21:00::'
synsetId: 13279724-n
simpleMeaning: A gain not yet made real, found by taking what was paid for an investment from its present
  market price.
scope: A rise in value that exists only on paper, not a gain made real by selling, and not the opposite
  fall, a paper loss.
examples:
- He showed a paper profit when the shares rose above what he had paid.
- Her paper profit would vanish if the price fell back to what she had paid.
