simpleMeaning: A word people in the south use for a person from a northern state in the United States,
  most of all for a Union soldier.
scope: This is a word people in the south use for a northerner, most of all a Union soldier, not a word
  for a person from the south.
examples:
- Southerners called the Union troops Yankees.
- He was proud to be a Yankee from the north.
