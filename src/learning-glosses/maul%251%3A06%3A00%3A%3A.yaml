simpleMeaning: You hold its long handle and swing it to drive stakes or wedges in; it is a heavy kind
  of hammer
scope: This is a heavy hammer with a long handle; sledge and sledgehammer are other names for this sense;
  not a small hammer, and not the act of beating someone.
examples:
- He swung the maul and drove the fence post into the ground.
- The maul lay beside the stakes, ready for the next blow.
