simpleMeaning: A member of a Native American people who lived in what is now southern Colorado and Utah
  and northern Arizona and New Mexico and built homes in cliffs.
scope: This is a member of a Native American people who lived in the south-west and built homes in cliffs,
  not a member of a plains people and not a member of an eastern woodland people.
examples:
- The Anasazi built homes in the cliffs of the south-west.
- Anasazi dwellings still stand in the cliffs of Colorado.
