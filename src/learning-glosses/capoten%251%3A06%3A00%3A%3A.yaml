simpleMeaning: A drug that stops the kidneys making a substance that narrows blood vessels, so the vessels
  widen; used for high blood pressure and heart failure with fluid build-up.
scope: A drug that stops the kidneys making a substance that narrows blood vessels, so the vessels widen;
  captopril is another name for this sense.
examples:
- The doctor gave her Capoten for high blood pressure.
- Capoten helps blood vessels widen.
