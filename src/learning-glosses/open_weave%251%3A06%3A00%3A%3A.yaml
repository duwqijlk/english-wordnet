simpleMeaning: A way of making cloth where the threads that run along it never meet, leaving small gaps
  in the cloth.
scope: A way of making cloth where the threads that run along it never meet, leaving small gaps; not a
  tight way of making cloth and not cloth with no gaps at all.
examples:
- The curtain had an open weave.
- An open weave lets air through the cloth.
