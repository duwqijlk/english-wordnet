simpleMeaning: the work of making sure workers and the things they need are supplied as needed during
  a job
scope: The work of making sure workers and the things they need are supplied as needed, not the moving
  of goods alone and not the job itself.
examples:
- The logistics of feeding an army are a huge task.
- She was in charge of logistics for the concert.
