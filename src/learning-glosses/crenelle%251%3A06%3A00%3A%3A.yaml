simpleMeaning: an open gap in the top of a castle wall, between two of the raised blocks of stone, called
  merlons, that stand along the top
scope: An open gap in the top of a castle wall between two raised blocks of stone; crenel is another name
  for this sense, and it is not a window or a door in the wall.
examples:
- The archer shot through the crenelle in the castle wall.
- Rain came in through the crenelles along the top of the wall.
