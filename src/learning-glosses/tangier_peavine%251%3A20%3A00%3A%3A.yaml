simpleMeaning: A North African plant that lives one year, much like its close kin, with showy flowers
  that have no smell
scope: Also called Tangier pea and Lalthyrus tingitanus; a North African one-year plant whose showy flowers
  have no smell, which sets it apart from the sweet-smelling flowers of its close kin.
examples:
- The Tangier peavine bloomed with showy flowers in the garden.
- Tangier peavine flowers look bright but have no smell.
