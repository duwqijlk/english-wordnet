simpleMeaning: A relative who is not very close, yet close enough in the family to be greeted with a friendly
  peck on the cheek.
scope: A relative not very close but near enough to be greeted with a peck; kissing kin is another name
  for this sense, not a close blood relative and not a stranger.
examples:
- My kissing cousin came to the wedding and gave me a peck on the cheek.
- She calls him her kissing cousin because they are family and always greet each other warmly.
