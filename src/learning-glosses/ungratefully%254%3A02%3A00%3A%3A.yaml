senseId: 'ungratefully%4:02:00::'
synsetId: 00272901-r
simpleMeaning: in a way that shows no thanks for help or kindness given
scope: This word says how a person acts when they show no thanks for help or kindness; it does not mean
  in a rude way in general or in an angry way.
examples:
- After we drove him home, he ungratefully complained about the car.
- She spoke ungratefully about the gift her friend had made for her.
