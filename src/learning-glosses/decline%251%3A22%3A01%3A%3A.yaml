simpleMeaning: a slow fall in amount, as of stored charge or of current (the flow of electricity)
scope: 'Also called decay: a slow fall in amount, as of charge or electric flow, not ground that goes
  down and not a state that gets worse.'
examples:
- The battery showed a steady decline in stored charge.
- They measured a decline in the current over time.
