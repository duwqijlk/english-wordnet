simpleMeaning: Shorter and tighter is how a part or organ gets, above all a soft part that moves the body
  or its threads, in the study of the body.
scope: Contraction and muscular contraction are other names for this shortening or tensing of a part or
  organ, above all a soft part that moves the body.
examples:
- The muscle contraction shortened the arm and held it tight.
- A muscle contraction in the leg made the calf grow hard for a moment.
