simpleMeaning: one of several kinds of small field animal (a vole) that live in high land in Europe, Asia,
  and America
scope: 'Also called a redback vole: one of several kinds of vole in high land, not a house mouse and not
  a vole of flat low land.'
examples:
- The red-backed mouse lives in the hills and eats seeds and grass.
- A red-backed mouse was caught in a trap near the mountain hut.
