simpleMeaning: Found in North America, Europe and Asia, this plant lives one year, its stem covered in
  small curved hooks.
scope: Also called cleavers, catchweed, clivers or spring cleavers, this is the one-year plant of North
  America, Europe and Asia whose stem is covered in small curved hooks, not the low-growing perennial
  with silvery leaves underneath and not the coarse tropical plant with finger-like spikes of flowers.
examples:
- Goose grass caught on my sleeve as I walked past.
- The goose grass had stems covered in small curved hooks.
