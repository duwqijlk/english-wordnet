senseId: 'factory_whistle%1:06:00::'
synsetId: 03321933-n
simpleMeaning: A thing at a works that makes a high, sharp sound to tell workers when to start work and
  when to stop work.
scope: A thing at a works that makes a high, sharp sound to mark the start and stop of work, not a clock
  and not a bell.
examples:
- The factory whistle blew at six in the morning.
- Workers hurried in when the factory whistle sounded.
