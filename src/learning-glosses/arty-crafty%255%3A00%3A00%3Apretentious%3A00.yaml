simpleMeaning: said of a person or a thing whose sweet, fine manner is meant to impress but soon feels
  false and tiresome
scope: 'Also called artsy-craftsy: used of a manner that tries too hard to please, not a plain love of
  making things and not honest warmth.'
examples:
- His arty-crafty poems were full of pretty words and little else.
- The arty-crafty cafe charmed her at first, then bored her.
