simpleMeaning: The wrongful taking of a post or power by force, and holding on to it, especially taking
  a throne or the highest power.
scope: Of a post or power, especially a throne, taken by force and held on to.
examples:
- The general's usurpation of the throne shocked the whole country.
- They ruled by usurpation, having seized power by force.
