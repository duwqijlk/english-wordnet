simpleMeaning: words and pictures that help sell a book are usually printed on the paper that folds round
  the outside of the book
scope: 'Also called a book jacket, a dust cover, and a dust wrapper: the printed paper round a book, not
  a plastic sheet put over a machine.'
examples:
- The dust jacket was torn at one corner, so the book looked old.
- He put the dust jacket back on the book after he had read the back of it.
