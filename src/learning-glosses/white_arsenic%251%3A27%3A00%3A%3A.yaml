simpleMeaning: used to kill rats, pests, and weeds and to make glass, this white powder poison is arsenic
  with three parts oxygen
scope: Also called arsenic, arsenic trioxide, arsenous anhydride, arsenous oxide, or ratsbane; a white
  powder poison used to make glass and to kill rats, pests, and weeds, not a harmless white powder.
examples:
- White arsenic killed the rats in the barn, but it is deadly to people too.
- The factory used white arsenic to make glass.
