simpleMeaning: A worm that lives chiefly in the sea, carrying both sexes in one body and paired flaps
  with stiff hairs on its sides
scope: 'Also called polychaete, polychaete worm, and polychete: a sea worm with pairs of hairy flaps,
  not a tapeworm and not a freshwater worm.'
examples:
- The polychete worm swam with a wave of its side flaps.
- We watched a polychete worm crawl out of its tube.
