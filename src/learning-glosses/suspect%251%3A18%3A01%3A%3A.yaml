simpleMeaning: a person, company or other group that is taken to court; the one who must answer a claim
  or a charge in court
scope: This noun is a person taken to court, not the verb for thinking a person may not be honest and
  not trusting them.
examples:
- The suspect sat in court and listened to the charge against him.
- The judge told the suspect to answer the claim made against her.
