simpleMeaning: the quality of not holding back or controlling yourself, and of acting freely without care
  or worry
scope: This noun means a wild, free way of acting with no control; it is not the verb that means to leave
  a person or place.
examples:
- She danced with wild abandon.
- He laughed with complete abandon, not caring what others thought.
