simpleMeaning: The belief that several different ways of life can live side by side in peace and fairly
  in one country, rather than one shared national way of life.
scope: The belief that many ways of life can share one country in peace; not the belief that one national
  way of life must win out, and not a law about living together.
examples:
- Multiculturalism shapes the city's schools and festivals.
- They said multiculturalism lets many ways of life share one country in peace.
