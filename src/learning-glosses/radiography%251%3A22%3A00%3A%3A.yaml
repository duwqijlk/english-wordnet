simpleMeaning: the way of making a picture on a special surface, using rays that are not light we can
  see
scope: 'Also called skiagraphy: making a picture with rays other than light we can see, not the picture
  itself and not a photo made with light we can see.'
examples:
- The hospital used radiography to find the crack in his arm.
- She learned radiography to make pictures of bones without cutting the skin.
