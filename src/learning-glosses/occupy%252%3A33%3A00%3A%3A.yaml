simpleMeaning: To march into another land in a hostile way, with an army, to take it by force and hold
  it
scope: Marching into another land with an army to take and hold it, not taking up a job or role and not
  filling a whole place.
examples:
- The army will occupy the town by force.
- Troops moved in to occupy the land and hold it.
