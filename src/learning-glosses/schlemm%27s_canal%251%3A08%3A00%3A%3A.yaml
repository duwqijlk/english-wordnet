simpleMeaning: A round passage in the eye that drains the watery fluid from the front chamber of the eye
  into veins at the front of the eye
scope: A round passage in the eye that drains watery fluid from the front chamber into veins at the front
  of the eye; sinus venosus sclerae and canal of Schlemm are other names for it.
examples:
- Schlemm's canal drains fluid from the front of the eye.
- If Schlemm's canal is blocked, pressure builds up in the eye.
