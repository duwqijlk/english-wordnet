simpleMeaning: A pale smooth topping for food made with spice powder and coconut milk in place of stock.
scope: A pale sauce with spice powder and coconut milk, not a plain white sauce and not a hot curry dish.
examples:
- She poured curry sauce over the rice.
- The curry sauce was rich with coconut milk.
