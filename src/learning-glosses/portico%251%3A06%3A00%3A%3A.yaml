simpleMeaning: a covered area at the entrance to a building, often with round posts
scope: This is a covered area at the entrance to a building, often with round posts. It is not just a
  single door and not a room inside the building.
examples:
- Rain kept us dry under the portico at the front of the school.
- The portico has four tall white posts in front of the library doors.
