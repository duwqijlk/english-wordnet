simpleMeaning: the skin near the hairline is cut and pulled back so wrinkles and other marks of age come
  off the face, and the extra flesh is cut away
scope: This is a cut made to take wrinkles and other marks of age from the face; lift, facelift, face
  lift, face lifting, nip and tuck, rhytidectomy and rhytidoplasty are other names for it.
examples:
- She had cosmetic surgery to take the wrinkles from her face.
- Cosmetic surgery cuts the skin near the hairline and pulls it back.
