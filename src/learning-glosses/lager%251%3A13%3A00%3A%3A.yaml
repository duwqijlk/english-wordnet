simpleMeaning: a kind of beer made with yeast that works at the bottom, usually by heating part of the
  mash, first made in March or April and ripened until September
scope: A kind of beer made with yeast that works at the bottom, not the camp of wagons that shares the
  name.
examples:
- He ordered a cold lager with his lunch.
- The brewery makes a pale lager that is sold all over the country.
