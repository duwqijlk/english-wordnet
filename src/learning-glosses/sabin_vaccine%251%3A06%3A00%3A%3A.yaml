simpleMeaning: An oral vaccine, made with live but weak polio virus, given to guard against polio.
scope: An oral vaccine with live but weakened poliovirus, given to guard against polio, not an injected
  polio vaccine or a flu shot, also called oral poliovirus vaccine, trivalent live oral poliomyelitis
  vaccine, OPV and TOPV.
examples:
- Children got the Sabin vaccine on a sugar lump.
- The Sabin vaccine guards against polio.
