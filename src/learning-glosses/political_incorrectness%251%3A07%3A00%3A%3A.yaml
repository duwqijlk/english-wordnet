simpleMeaning: Groups of people who are badly treated or held back in society may seem shut out, pushed
  aside, or insulted by the use of words or acts.
scope: This names the use of words or acts that may seem to shut out, push aside, or insult groups of
  people who are badly treated or held back in society.
examples:
- His words showed political incorrectness.
- She was blamed for political incorrectness.
