simpleMeaning: To make a place bright, for example by turning on a lamp or opening a curtain.
scope: This is about filling a place with brightness, not about starting a fire, a lamp itself, or a pale
  colour.
examples:
- He lit the dark kitchen with a torch.
- Tall windows lit the whole hall.
