simpleMeaning: Ideas that spread in many ways to take in many sides of a thing and sometimes bring fresh
  notions and answers go with making new things.
scope: Also called divergent thinking, it is ideas spreading in many ways to take in many sides of a thing,
  sometimes bringing fresh notions and answers, and going with making new things.
examples:
- Out-of-the-box thinking helped find a fresh answer.
- With out-of-the-box thinking, many sides of a thing come into view.
