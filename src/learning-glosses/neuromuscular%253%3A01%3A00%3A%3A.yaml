simpleMeaning: Touching, or true of, both nerve tissue and muscle tissue.
scope: To do with both nerves and muscles together, not with nerves alone and not with muscles alone.
examples:
- The illness is neuromuscular, touching both nerves and muscles.
- A neuromuscular test checks how nerves and muscles work together.
