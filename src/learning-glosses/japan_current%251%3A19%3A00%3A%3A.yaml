simpleMeaning: A warm flow of sea water that moves north-east past the coast of the islands it is named
  for, into the north Pacific.
scope: A warm flow of sea water in the north Pacific, also called Kuroshio and Kuroshio current, and not
  the same as other ocean flows.
examples:
- The Japan current carries warm water north-east past Japan.
- Ships use the Japan current on the way across the north Pacific.
