simpleMeaning: The act of two people joining as husband and wife, or the ceremony in which that happens.
scope: This is not the couple themselves or the state of being husband and wife; it is the act or ceremony
  that joins them.
examples:
- The marriage was held in the garden behind her parents' house.
- Guests travelled from three countries to attend the marriage.
