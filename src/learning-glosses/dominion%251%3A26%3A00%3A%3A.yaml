simpleMeaning: power over a place or people that comes from law or rightful rule
scope: Power over a place or people by lawful right; not a marked-off region, which is another sense of
  dominion, and not power by force alone.
examples:
- France held undisputed dominion over vast areas of Africa.
- The rule of Caesar spread his dominion far and wide.
