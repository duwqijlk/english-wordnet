simpleMeaning: In Judaism, men traditionally wear two little leather boxes, each holding verses from Hebrew
  scripture, strapped to the forehead and left arm for morning prayer.
scope: Another name for phylactery, the same two leather prayer boxes, not a different ritual item.
examples:
- He adjusted his tefillin before the morning service.
- The tefillin were kept in a faded velvet pouch between prayers.
