simpleMeaning: That makes rotting by germs start, or helps it along
scope: Also called putrefactive, this is a thing that brings on rotting by germs, not the rotting itself
  and not a thing that stops it.
examples:
- A putrefacient substance speeds the rotting of dead flesh.
- Putrefacient germs in the wound made the tissue rot faster.
