simpleMeaning: Either of the two jointed feelers on the front of the lower lip of an insect
scope: This is either of the two jointed feelers on the front of an insect's lower lip, not a leg and
  not an antenna.
examples:
- The labial palpus is one of the jointed feelers on the front of the insect's lower lip.
- The beetle moved its labial palpus as it fed.
