simpleMeaning: the quality of being dependable and willing to answer for one's own actions.
scope: This is the personal quality of being dependable and accountable, not a duty or task attached to
  a role.
examples:
- She showed great responsibility in caring for her younger brother.
- He has a strong sense of responsibility toward his team.
