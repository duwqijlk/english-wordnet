simpleMeaning: A foot with a fallen arch, flat and spread out more than usual.
scope: A foot with a fallen arch, flat and spread out more than usual; flatfoot is another name for this
  sense, not a broken foot and not a foot with a high arch.
examples:
- His pes planus made long walks painful.
- The doctor noted pes planus in both of her feet.
