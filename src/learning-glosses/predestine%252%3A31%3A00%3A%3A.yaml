simpleMeaning: to decide or fix what will happen before it happens
scope: To fix the future before it happens, also called preordain and foreordain; not only by God's will
  and not by an official order.
examples:
- Some people believe their lives were predestined from birth.
- He felt his failure was predestined, no matter what he tried.
