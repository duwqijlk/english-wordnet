simpleMeaning: To cover a thing in soft wet earth and so make it dirty
scope: 'Also called mud, muck or mire: to make a thing dirty with soft wet earth, not to clean a thing
  and not to dig in the earth.'
examples:
- The child mucked up his shirt while playing ball in the garden.
- Rain had mucked up the path to the house.
