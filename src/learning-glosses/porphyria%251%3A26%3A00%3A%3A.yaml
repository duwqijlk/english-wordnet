simpleMeaning: Pains in the belly and a muddled mind come when the body's inner workings go wrong in this
  state, passed down in families.
scope: This is a state passed down in families, not a sickness caught from someone else, in which the
  body's inner workings go wrong.
examples:
- Porphyria brought belly pains and a muddled mind.
- The porphyria runs in the family.
