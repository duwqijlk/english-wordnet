senseId: 'solvating_agent%1:27:00::'
synsetId: 15072751-n
simpleMeaning: A thing that changes something so that it combines with the liquid around it
scope: A thing that makes another thing combine with a liquid, not the liquid itself and not a substance
  that merely speeds up a change.
examples:
- Water acts as a solvating agent for the salt.
- The chemist added a solvating agent to free the ions.
