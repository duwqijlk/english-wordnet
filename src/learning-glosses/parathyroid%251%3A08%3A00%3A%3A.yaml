simpleMeaning: One of four glands that make body chemicals, set above or inside the gland in the neck.
scope: One of four glands above or inside the neck gland, also called parathyroid gland; not the neck
  gland itself and not a gland in the belly.
examples:
- The parathyroid keeps the body's calcium in balance.
- Surgeons take care not to harm a parathyroid.
