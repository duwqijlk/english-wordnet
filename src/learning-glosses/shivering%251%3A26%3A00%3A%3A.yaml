simpleMeaning: A cold feeling that often comes first when an illness starts and a fever is on its way
scope: 'Also called chill: the cold feeling at the start of a fever, not shaking hands or knees.'
examples:
- A shivering came over her just before the fever rose.
- His shivering warned the doctor that an infection was starting.
