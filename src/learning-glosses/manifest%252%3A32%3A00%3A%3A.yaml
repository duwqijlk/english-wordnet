simpleMeaning: to give proof of a thing, or to stand as proof of it, or to show it by how you act, feel,
  or look
scope: To give proof of a thing, or to stand as proof of it, or to show it by how you act, feel, or look;
  also called evidence, and demonstrate is another name for this sense; not the customs paper, not clear
  to see, and not writing things down in such a paper.
examples:
- His high fever manifested his illness.
- The buildings manifested a high level of skill in their making.
