simpleMeaning: like the wading birds it resembles, this American stork has a bill that bends down, and
  it lives in swamps among trees in the warm New World tropics
scope: Also called flinthead and wood ibis, a stork of warm American swamps with a bill that bends down,
  not a heron and not a crane.
examples:
- The wood stork waded through the swamp, its bill bent down to the water.
- Wood storks nest in trees above the swampy ground.
