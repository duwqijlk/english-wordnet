simpleMeaning: to make a car or other vehicle stop by using the part that slows it down
scope: This sense is about making a vehicle stop. It is not the tall fern plant, and it is about acting
  on the vehicle, not just ending your own travel.
examples:
- She braked the car before the corner.
- He quickly braked the truck when a child ran out.
