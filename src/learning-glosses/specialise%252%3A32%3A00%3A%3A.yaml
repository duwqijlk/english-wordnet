senseId: 'specialise%2:32:00::'
synsetId: 01023982-v
simpleMeaning: To say what you mean in full detail, point by point.
scope: Also called specialize or specify; to be exact about what you mean, not to shape a thing for one
  set job, and not the evolving or devoting senses.
examples:
- Please specialise your answer and tell us the exact date.
- She specialised her complaint, naming each fault in turn.
