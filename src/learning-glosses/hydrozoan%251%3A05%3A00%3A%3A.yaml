simpleMeaning: Sea animals that live in groups, in which the fixed cup-shaped stage of life is the main
  one.
scope: Sea animals that live in groups, in which the fixed cup-shaped stage of life is the main one, not
  a jellyfish and not a coral; hydroid is another name for this sense.
examples:
- Hydrozoans coat the rocks at low tide.
- The hydrozoan colony looked like a small plant.
