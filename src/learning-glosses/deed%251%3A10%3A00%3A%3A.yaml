senseId: 'deed%1:10:00::'
synsetId: 06557128-n
simpleMeaning: a legal paper that is signed, sealed, and handed over to pass property to someone and to
  show their legal right to own it
scope: Also called title. This sense is the legal paper that passes property and shows who owns it, not
  an action a person does.
examples:
- He signed the deed when he bought the house.
- She kept the deed in a safe place to prove she owned the land.
