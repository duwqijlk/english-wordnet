synsetId: 13902473-n
simpleMeaning: a three-sided shape in which every inside corner is sharper than a square corner
scope: A three-sided shape with all its inside corners sharp and less than a right angle, also called
  an acute triangle; not a shape with a right corner and not a shape with a wide corner.
examples:
- The acute-angled triangle has three corners that are all less than a right angle.
- She drew an acute-angled triangle with all its angles sharp.
