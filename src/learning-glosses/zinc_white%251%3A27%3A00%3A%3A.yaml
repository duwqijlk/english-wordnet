simpleMeaning: a pale powder used to make paint for houses, made from a metal joined with the gas in air
  that helps things burn
scope: A pale powder for house paint, made from a metal compound; not a dye for cloth and not paint itself.
examples:
- The painter mixed zinc white into the paint for the walls.
- Zinc white gave the old house a bright coat.
