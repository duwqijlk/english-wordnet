simpleMeaning: A loss of movement in the arm, caused by harm to the group of nerves that supply the arm,
  usually during birth.
scope: Also called Erb's palsy, this is a loss of movement in the arm from harm to its nerves, usually
  during birth, not any other kind of paralysis.
examples:
- Erb-Duchenne paralysis left the baby's arm weak after birth.
- The doctor said Erb-Duchenne paralysis came from harm to the nerves.
