simpleMeaning: A person who greets guests when they arrive and helps them during their stay.
scope: A worker who greets guests at a place to stay; hotel desk clerk is another name for this sense,
  not a worker who cleans rooms and not the person who runs the place.
examples:
- The hotel clerk gave us the key to our room.
- Ask the hotel clerk about the bus times.
