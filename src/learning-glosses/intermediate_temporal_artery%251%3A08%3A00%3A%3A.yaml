simpleMeaning: A blood tube at the side of the head that runs to the middle of the outer layer of the
  brain's side part.
scope: A blood tube at the side of the head that runs to the middle of the outer layer of the brain's
  side part, also called arteria temporalis intermedia; not a blood tube of the front of the head and
  not one that runs to the back of the brain.
examples:
- The intermediate temporal artery feeds the middle of the brain's side part.
- A scan showed the intermediate temporal artery was open.
