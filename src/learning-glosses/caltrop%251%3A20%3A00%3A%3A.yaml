simpleMeaning: a flat plant of hot lands, living one year, not safe to eat, with fruit breaking into five
  hard, sharp parts; a harmful weed in fields where farm animals eat
scope: This plant is also called devil's weed; it is the harmful flat plant with five-part fruit, not
  the water plant with four-pointed fruit that people can eat.
examples:
- Caltrop grows flat along the dry ground near the road.
- Farmers pulled up the caltrop before the sheep went into the field.
