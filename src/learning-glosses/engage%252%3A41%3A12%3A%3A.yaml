simpleMeaning: to fight a war or a battle, or to carry out a long planned set of fights in a war
scope: This is to fight and carry on a war, not to hire a person for work and not to take a place or car
  for a set time under an agreement.
examples:
- The two countries engaged in war for three years.
- The king engaged in a long campaign to take back the land.
