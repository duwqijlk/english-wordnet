simpleMeaning: letting no light or other rays pass through or bounce back, so you cannot see through it
scope: Something light cannot pass through, so you cannot see through it, not clear glass you can see
  through and not a mirror that throws light back.
examples:
- The opaque windows of the jail let in no light.
- The screen is opaque to X-rays.
