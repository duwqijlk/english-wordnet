simpleMeaning: 'Where a star or planet sits sideways in the sky is fixed by the gap between two flat sheets:
  one straight up through it, one running north and south.'
scope: The sideways gap that fixes where a star or planet sits is what this name stands for.
examples:
- The sailor worked out the azimuth of the bright star.
- The azimuth of the planet changed as the night went on.
