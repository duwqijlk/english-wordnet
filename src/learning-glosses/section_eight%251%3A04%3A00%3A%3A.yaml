simpleMeaning: A release from the United States Army for a person judged unfit or of bad character.
scope: A release from the United States Army for unfitness or bad character, not an honourable discharge
  for full service and not the soldier who got such a release.
examples:
- He got a Section Eight after the hearing.
- A Section Eight ended her Army service.
