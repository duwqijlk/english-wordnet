simpleMeaning: Waves from far-off things in space that the eye cannot see are caught by this dish, which
  sky watchers use.
scope: Also called radio reflector, this dish catches waves from space, not the light the eye can see.
examples:
- The radio telescope caught waves from a far-off galaxy.
- Astronomers pointed the radio telescope at the new star.
