simpleMeaning: Take the mark for a class at a college or university and times it by the hours of credit
  the class is worth; the number you get is this
scope: The number you get when you times the mark for a class by the hours of credit the class is worth,
  not the mark itself and not the hours of credit alone.
examples:
- Her grade point for the history course was 12.
- To get the grade point, multiply the mark by the credit hours for the course.
