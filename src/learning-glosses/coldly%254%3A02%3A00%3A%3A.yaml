synsetId: 00166097-r
simpleMeaning: in a way that shows no warm feeling and no feeling of any kind
scope: This says how a person acts or speaks, with no warm feeling; it is not about the low heat of a
  place or a thing.
examples:
- She looked at him coldly and said nothing.
- He spoke coldly to the man who had lied to him.
