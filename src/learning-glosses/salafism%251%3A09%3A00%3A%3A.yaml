simpleMeaning: Extreme Sunni fighters who hold they alone read the Koran rightly, call moderates unbelievers,
  and seek to turn all Muslims to their strict reading of Islam and rule the world.
scope: A militant Sunni group, also called Salafi movement; not all Sunnis and not the moderate Muslims
  it calls unbelievers.
examples:
- Salafism calls for a return to early Islam.
- He follows Salafism and its strict reading of the Koran.
