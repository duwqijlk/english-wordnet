simpleMeaning: a large spider from southern Europe that people once thought made people move their bodies
  in ways they could not control
scope: This is the large spider from southern Europe linked in old belief to uncontrolled movement, not
  the large hairy spider from warm lands with a painful bite.
examples:
- People once believed that a tarantula from southern Europe could make them move without control.
- The tarantula in the museum came from southern Europe and was once feared for causing wild movement.
