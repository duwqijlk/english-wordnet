simpleMeaning: Without touch, the left hand shapes how the notes sound on this electric music-making box,
  while the right hand moves between two rods to set the notes.
scope: A music-making box played in the air without touch.
examples:
- She played the theremin by waving her hands near the rods.
- The theremin sang a slow tune as his right hand moved between the rods.
