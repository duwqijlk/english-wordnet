simpleMeaning: a wild kind of the common fruit tree that helps certain fruit trees get pollen so they
  can make fruit
scope: A wild kind of the common fruit tree that helps other fruit trees get pollen, not the fruit eaten
  at the table and not a garden kind grown for its fruit.
examples:
- The caprifig hung wild at the edge of the orchard.
- Growers kept a caprifig near the trees to help them set fruit.
