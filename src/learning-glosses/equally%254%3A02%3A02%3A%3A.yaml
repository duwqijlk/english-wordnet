simpleMeaning: in the same amounts or shares, and in a fair way to all sides
scope: 'Also called evenly: done in the same amounts for each person and in a fair way, not in a way that
  helps one side more than another.'
examples:
- They split the money equally between the two brothers.
- The teacher treats all her students equally.
