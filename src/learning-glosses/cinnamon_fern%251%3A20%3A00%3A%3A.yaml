simpleMeaning: an American fern that in early spring sends up woolly, reddish-brown spore-bearing fronds,
  with green leaves forming a ring around them later; the young fronds are edible while still uncurling
scope: Another name for the fiddlehead fern, whose young fronds are eaten; not the ostrich fern, which
  also goes by fiddlehead.
examples:
- Cinnamon fern sends up woolly brown fronds in early spring.
- We picked the young fronds of cinnamon fern to cook.
