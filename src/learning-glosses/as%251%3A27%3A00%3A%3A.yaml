simpleMeaning: A metal that can poison and comes in three forms; used to kill weeds and bugs and to mix
  with other metals; found in arsenopyrite, orpiment and realgar
scope: A metal that kills in tiny amounts and comes in three crystal forms; arsenic and atomic number
  33 are other names for this sense, and it is not a metal safe to touch nor a metal used to build things.
examples:
- Farmers once used As to kill weeds.
- As is found in orpiment and realgar.
