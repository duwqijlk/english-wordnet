simpleMeaning: an appointment to see a doctor, lawyer, or other expert for help or advice.
scope: This is a planned meeting for treatment or advice, not an official inspection and not a friendly
  call.
examples:
- I have a visit with the doctor at four o'clock.
- She made a visit to her lawyer to discuss the contract.
