simpleMeaning: to put fear and worry into a person, so that they are taken aback by something bad
scope: To put fear and worry into a person so they are taken aback by something bad, also called alarm,
  horrify, and dismay, not to strike a person with disgust.
examples:
- The thought of being late appalled her.
- The accident appalled the whole village.
