simpleMeaning: The state of being a fixed part of something, always there and not added on
scope: 'Also called inherency: the state of being a fixed part of something, not a passing mood and not
  a thing added from outside.'
examples:
- The inherence of polysemy in human language shows how words hold many meanings.
- The inherence of kindness in her nature never changed.
