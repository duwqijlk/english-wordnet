simpleMeaning: a set of steps done to music as part of a ceremony, as done by the Hopi, in which people
  hold live serpents or call on them
scope: A set of steps done to music as part of a ceremony, as done by the Hopi, in which people hold live
  serpents or call on them; not a dance done for fun, and not a dance that tells a story.
examples:
- The snake dance was held at dawn in the village square.
- During the snake dance, the men carried the snakes with great care.
