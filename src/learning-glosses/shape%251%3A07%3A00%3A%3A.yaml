simpleMeaning: the outline or overall form of something, especially as you see it from outside
scope: This is not the arrangement of parts considered apart from the material, and not the condition
  of something, as in being fit or healthy.
examples:
- The clouds kept changing shape.
- The table has an unusual shape, like a leaf.
