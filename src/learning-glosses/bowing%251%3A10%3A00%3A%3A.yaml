simpleMeaning: bending the head, body, or knee to show respect, or that one gives in, or shame, or as
  a greeting
scope: Bending the head, body, or knee as a sign, also called a bow; not the way of moving a violin bow,
  and not a manner that shows too much respect.
examples:
- His bowing before the queen showed deep respect.
- The actor's bowing at the end of the play drew applause.
