senseId: 'luck%1:19:00::'
synsetId: 11438252-n
simpleMeaning: An unknown and unpredictable force that makes an event turn out one way instead of another.
scope: This is not the sense limited to good results; it covers any outcome, whether people want it or
  not.
examples:
- It was luck, not planning, that decided which team won.
- Whether we meet them tomorrow depends on luck and timing.
