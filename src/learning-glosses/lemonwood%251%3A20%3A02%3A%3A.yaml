simpleMeaning: Hard, tough, springy wood from the tree it grows on, used to make bows and fishing rods
scope: Hard, tough, springy wood for bows and rods; not the tree it comes from, and not a soft wood that
  bends and stays bent.
examples:
- The bowyer chose lemonwood for its spring and strength.
- Lemonwood makes fishing rods that bend without breaking.
