simpleMeaning: the act of giving up or losing something as a price paid for a mistake or fault or a failure
  to do what was asked
scope: The act of giving up something as a price paid for a mistake, a fault, or a failure, not people
  given up to reach an aim and not a play in baseball.
examples:
- His sacrifice of the car was the price of his mistake.
- The sacrifice cost him his savings.
