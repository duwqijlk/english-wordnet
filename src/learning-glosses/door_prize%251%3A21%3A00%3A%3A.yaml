simpleMeaning: A gift won by the holder of the lucky ticket handed out at the entry to a dance, party,
  or other gathering
scope: A gift won by the holder of the lucky ticket handed out at the entry to a dance, party, or other
  gathering, not a raffle prize bought with a ticket and not a contest award.
examples:
- She won the door prize at the school dance.
- The door prize was a basket of fruit.
