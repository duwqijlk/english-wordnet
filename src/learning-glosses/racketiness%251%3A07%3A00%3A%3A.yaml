simpleMeaning: the sound of loud noise that goes on and on without a break
scope: 'Also called noisiness: the sound of loud noise that keeps going, not a single loud bang and not
  a quiet hum.'
examples:
- The racketiness of the building work made it hard to think.
- We could hear the racketiness from the street long before we saw the machines.
