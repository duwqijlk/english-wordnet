senseId: 'festering%1:22:00::'
synsetId: 13501092-n
simpleMeaning: In medicine, the way pus forms in a sore place (an abscess) or a small skin blister (a
  vesicle), and then comes out
scope: Also called maturation and suppuration; this is pus forming and coming out in a sore place, not
  a sore just getting worse.
examples:
- The doctor cleaned out the festering so the pus could drain away.
- Festering in the deep wound needed care at once.
