simpleMeaning: a drug that kills germs, made by a tiny living thing and used to treat tuberculosis, a
  bad lung illness
scope: A drug that kills germs and treats a lung illness, not a drug for a cold and not a drug for a sore
  throat.
examples:
- The doctor gave him streptomycin for his tuberculosis.
- Streptomycin was one of the first drugs used against tuberculosis.
