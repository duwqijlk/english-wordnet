simpleMeaning: Causing great shock and dismay, so people can hardly take in what has happened
scope: Causing great astonishment and dismay, not the sense of dazing or stunning a person senseless.
examples:
- The news came as a stunning defeat for the team.
- It was a stunning protest against the bosses.
