simpleMeaning: Doctors cut the band of nerve fibres joining the two halves of the brain, so they can no
  longer pass messages to each other, when drugs cannot stop bad fits.
scope: 'Also called callosotomy: brain surgery to stop fits that drugs cannot control, not drug treatment
  and not surgery on one half of the brain alone.'
examples:
- The doctors chose a callosectomy after years of fits that drugs could not stop.
- After the callosectomy, the two halves of her brain could no longer pass messages to each other.
