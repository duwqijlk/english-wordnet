simpleMeaning: In the Italian way of building forts, a part made of a pair of half-bastions that sticks
  out from the main wall.
scope: This is a part of the Italian way of building forts, made of a pair of half-bastions that stick
  out from the main wall.
examples:
- The hornwork was used to extend the fortified area and stop the enemy taking the high ground.
- A hornwork of two half-bastions stood out from the wall of the fort.
