simpleMeaning: A general name for beer made with yeast that makes alcohol at the top; in some United States
  places, by law, a beer over 4% alcohol by volume
scope: A kind of beer made with yeast that makes alcohol at the top; in some United States places the
  law says it must be over 4% alcohol by volume, so it is not just any beer.
examples:
- He drank a glass of dark ale at the pub.
- This ale was made with yeast that works at the top.
