simpleMeaning: A shopping complex where leading stores are set among carefully designed landscaping; it
  usually has restaurants and convenient parking, and is today's counterpart of the old marketplace.
scope: Mall, center and centre are other names for this same shopping complex; it is not an open public
  square or a toll plaza.
examples:
- The plaza has several restaurants and plenty of parking.
- She bought a new coat at a shop in the plaza.
