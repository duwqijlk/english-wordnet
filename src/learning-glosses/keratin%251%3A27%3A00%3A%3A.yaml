simpleMeaning: a tough, thread-like protein found in the outer skin and in hard body parts such as hair,
  feathers, nails, and hooves
scope: 'Also called ceratin: a tough protein in skin, hair, feathers, nails, and hooves, not the soft
  protein in muscle, and not fat.'
examples:
- Keratin makes your nails hard and strong.
- A bird's feathers are made mostly of keratin.
