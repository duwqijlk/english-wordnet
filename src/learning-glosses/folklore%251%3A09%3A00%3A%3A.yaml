simpleMeaning: the stories, sayings, riddles and songs of a people, passed on by word of mouth and never
  written down
scope: Stories, sayings, riddles and songs passed on by word of mouth, not written history and not one
  person's tale.
examples:
- The folklore of the region is full of tales about the sea.
- She studied the folklore of her grandmother's village.
