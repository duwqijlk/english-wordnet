simpleMeaning: To hand a court order or official notice to a person.
scope: This is formally giving someone a legal document, not putting food or drink in front of them and
  not working for a person or cause.
examples:
- The deputy served the summons at the defendant's home.
- A warrant must be served on the person named in it.
