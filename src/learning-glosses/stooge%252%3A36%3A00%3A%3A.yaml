simpleMeaning: to work as the helper of a comedian in a comedy show
scope: To act as the helper a comedian's jokes are aimed at. Not to obey another person in a weak, low
  place, not the noun for a victim of tricks, and not to fly slowly on a set route.
examples:
- In the show, he stooged for the famous comedian every night.
- She agreed to stooge for the comedian during the tour.
