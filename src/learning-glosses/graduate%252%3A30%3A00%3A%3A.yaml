simpleMeaning: To make small changes to a thing, or to mark it out in set steps, so it measures well
scope: To mark out a thing in set steps so it measures well, not a glass cup for measuring liquid and
  not getting a degree at the end of a course.
examples:
- Graduate a cylinder before you use it to measure.
- He graduated the scale so each mark showed the right amount.
