simpleMeaning: A brief note that names where a piece of information or a quotation came from.
scope: This is a short written note naming a source; it is not the act of mentioning something, and not
  a person who recommends someone for a job.
examples:
- Each quotation in the essay is followed by a short reference giving the author and page.
- He added a reference at the bottom of the page so readers could find the source.
