simpleMeaning: A bout of strong fear, most often in young children, in which the child wakes up in fear
  and worry but cannot recall what set it off.
scope: A bout of strong fear, most often in young children, who wake up afraid but cannot recall what
  set it off; not a bad dream they can recall and not a fear felt while awake.
examples:
- The child had a night terror and woke up shaking with fear.
- Night terrors most often strike young children, who cannot recall what set them off.
