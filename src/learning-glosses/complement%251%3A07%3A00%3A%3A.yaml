simpleMeaning: a thing added to make something whole, finer, or as good as it can be
scope: A thing added to make something whole or finer; not the grammar word that finishes a sentence and
  not one of two parts that fit together.
examples:
- A fine wine is a perfect complement to the dinner.
- Wild rice was served as a complement to the main dish.
