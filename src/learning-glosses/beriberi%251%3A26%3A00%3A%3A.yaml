simpleMeaning: a sickness caused by too little thiamine, also called vitamin B1, in the body
scope: A sickness from too little vitamin B1, not a sickness from too little of another vitamin and not
  an infection caught from someone else.
examples:
- The doctor said his weak legs and tired heart came from beriberi.
- Eating food with too little vitamin B1 can lead to beriberi.
