simpleMeaning: A canal in the brain joining the third and fourth hollow spaces.
scope: 'Also called aqueductus cerebri and cerebral aqueduct: a canal in the brain joining two hollow
  spaces, not a canal that carries water and not a blood vessel.'
examples:
- The Sylvian aqueduct joins the third and fourth ventricles in the brain.
- Doctors could see the Sylvian aqueduct on the scan.
