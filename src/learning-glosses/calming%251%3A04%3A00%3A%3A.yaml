simpleMeaning: the act of making a person or group less angry by giving them what they ask for
scope: Making an angry person or group less angry by giving them what they ask for, not making them calm
  by force and not the act of soothing pain.
examples:
- The calming of the crowd came after the mayor met their demands.
- Calming the protesters meant giving in to most of what they asked.
