simpleMeaning: any of a number of climbing plants in hot places, in the group called Dioscorea, many with
  thick roots people can eat
scope: This is the climbing plant itself, also called yam plant; it is not its thick root eaten as food
  and not a sweet potato.
examples:
- The yam climbs up sticks in the garden, and its thick roots are dug up for food.
- Yams grow well in hot places, where people plant them for their roots.
