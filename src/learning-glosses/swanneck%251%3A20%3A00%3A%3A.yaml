senseId: 'swanneck%1:20:00::'
synsetId: 12075542-n
simpleMeaning: any of several orchids of the group Cycnoches whose flower stems rise slim and arching,
  curved like a big white water bird
scope: Also called a swan-flower, a swan-neck, a swan orchid, and a swanflower; an orchid with slim arching
  flower stems, not a swan and not a water lily.
examples:
- The swanneck bloomed with slender columns of flowers.
- A swanneck in the glasshouse curved like a swan's neck.
