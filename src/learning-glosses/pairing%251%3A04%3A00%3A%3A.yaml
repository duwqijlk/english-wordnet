simpleMeaning: the act of bringing a male and a female together so they can have young
scope: The act of bringing a male and a female together to have young, with union as another name for
  this sense; not a dance pairing and not a match of equals.
examples:
- The pairing of the two birds took place in spring.
- Careful pairing helps the zoo breed rare animals.
