simpleMeaning: The flesh of any of several sea fishes of the Sparidae or Bramidae families.
scope: The flesh of any of several sea fishes of the Sparidae or Bramidae families, not the whole fish
  itself and not the flesh of freshwater fishes.
examples:
- Bream was on the menu, its white flesh served with lemon.
- The cook bought bream for the evening meal.
