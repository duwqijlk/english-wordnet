simpleMeaning: In biology, the study of the broad rules and ideas used for putting living things into
  groups in a scientific way
scope: This sense is the study of the rules for grouping living things, not a grouping system itself for
  living things.
examples:
- In taxonomy, scientists study the rules they use to put plants and animals into groups.
- She learned taxonomy to understand how living things are sorted into groups.
