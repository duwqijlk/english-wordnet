simpleMeaning: When a gland that makes skin oil gets blocked, the fatty stuff it makes gathers into this
  common lump in the skin.
scope: Also called a wen, a sebaceous cyst, or a steatocystoma, this common lump in the skin comes from
  a blocked gland that makes skin oil.
examples:
- The pilar cyst showed as a lump under the skin.
- This pilar cyst had grown where a gland in the skin was blocked.
