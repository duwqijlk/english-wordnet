simpleMeaning: the power of a thing to be pulled longer
scope: The power of a thing to be pulled longer; stretch and stretchiness are other names for this sense,
  not a thing that is already long and not a thing that springs back.
examples:
- The stretchability of the cloth made it easy to sew.
- Rubber is known for its stretchability.
