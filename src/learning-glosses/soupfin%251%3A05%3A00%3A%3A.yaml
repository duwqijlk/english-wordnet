simpleMeaning: A liver rich in vitamin A and thin flat parts that help it swim, put into a broth dish
  by people in China, make this Pacific shark prized
scope: Soup-fin and soupfin shark are other names for this Pacific shark, whose fins go into a broth dish
  in China and whose liver is rich in vitamin A.
examples:
- The soupfin lives in the Pacific.
- People in China put soupfin fins into soup.
