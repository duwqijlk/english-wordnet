simpleMeaning: A long high strip of the earth's crust pushed up between two cracks, so it stands higher
  than the land around it
scope: This is a raised strip of the earth's crust between two cracks, not a low valley between hills
  and not a single hill made of rock.
examples:
- The horst rose above the flat land on both sides.
- Geologists mapped the horst between the two faults.
