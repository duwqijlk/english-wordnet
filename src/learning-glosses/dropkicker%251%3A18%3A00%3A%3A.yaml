simpleMeaning: in football, a player who strikes the ball with a foot the moment it lands after falling
scope: A football player who strikes the ball with a foot just after it has fallen, not a player who strikes
  it from a hold or a kick from the ground.
examples:
- The dropkicker sent the ball through the posts just after it touched the ground.
- Our dropkicker caught the snap, let the ball fall, and struck it cleanly.
