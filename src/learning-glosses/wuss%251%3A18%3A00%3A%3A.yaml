simpleMeaning: a person who is weak in body and not able to do things well
scope: 'Also called weakling and doormat: this is a person who is weak in body and not able to do things
  well, and doormat here names the person, not a mat for wiping shoes.'
examples:
- The other boys called him a wuss because he could not lift the heavy box.
- He felt like a wuss when he could not do one push-up.
