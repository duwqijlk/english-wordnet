simpleMeaning: A soft, light sound, like silk clothes moving or leaves stirred by the wind
scope: 'Also called whisper and whispering: a soft, light sound like silk clothes or leaves moving, not
  a loud rattling noise.'
examples:
- We heard the rustle of leaves as the wind moved through the trees.
- The rustle of her silk dress could be heard as she crossed the room.
