simpleMeaning: The use of echoes from high-pitched sound waves to build a picture of a body part, a sonogram,
  often used to watch a babe grow or study body parts.
scope: This sense is also called ultrasound, echography, and ultrasonography.
examples:
- Sonography builds a picture of a body part.
- A sonography watched the babe grow.
