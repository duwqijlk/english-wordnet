simpleMeaning: A dish or tray, in many shapes and sizes, used to hold food while it cooks in an oven
scope: A dish or tray for cooking food in an oven, in many shapes and sizes, not a flat tray for serving
  and not a pot for the top of the cooker; baking form, baking mold, cake mold, cake mould and cake tin
  are other names for it.
examples:
- The baking mould came in the shape of a heart.
- She lined the baking mould with paper.
