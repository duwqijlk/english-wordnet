simpleMeaning: having a round shape that goes straight along its length, with flat ends
scope: This shape is round on the side and has flat ends; it is not round all over like a ball and not
  square like a box.
examples:
- The tank is cylindrical, with a round side that goes straight up.
- He put the seeds in a tall cylindrical jar.
