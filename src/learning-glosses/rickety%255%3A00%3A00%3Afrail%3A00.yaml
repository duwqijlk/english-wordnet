simpleMeaning: weak in body, with little strength or life in you
scope: 'Also called weak, weakly, or feeble: a person with little bodily strength or life in them, not
  a shaky table and not a sick bone.'
examples:
- The rickety old woman could barely walk across the room.
- After weeks in bed, his rickety body had lost all its strength.
