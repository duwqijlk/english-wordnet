simpleMeaning: To put a thing into a shape that is the same on both sides
scope: To put a thing into a shape the same on both sides; symmetrise is another name for this sense,
  not to cut a thing in half and not to make a thing square.
examples:
- The scientist symmetrized the waves for the test.
- He symmetrized the two halves of the drawing.
