simpleMeaning: Ketones build up until the blood turns too acid, a state seen most often in people with
  diabetes.
scope: Diabetic acidosis is another name for this state, where ketones build up until the blood turns
  too acid, most often in people with diabetes.
examples:
- The test showed ketoacidosis, with ketones building up in the blood.
- They watched for ketoacidosis in people with diabetes.
