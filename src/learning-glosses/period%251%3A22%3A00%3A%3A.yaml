simpleMeaning: the blood that flows monthly from the womb of a woman who is not pregnant, from puberty
  until menopause
scope: This is the monthly bleeding, not an amount of time, not the dot at the end of a sentence, and
  not one period of play in an ice hockey game.
examples:
- Cramps are common in the days before a woman's period starts.
- She missed her period and wondered whether she was pregnant.
