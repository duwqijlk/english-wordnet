simpleMeaning: a tool with a wide cutting edge that a worker in stone uses to smooth and shape stone
scope: 'Also called drove: a wide-edged tool for smoothing stone, not a narrow tool for cutting fine detail
  and not a hammer.'
examples:
- The mason used a drove chisel to smooth the face of the block.
- He tapped the drove chisel along the edge to dress the stone.
