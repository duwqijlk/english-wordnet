simpleMeaning: Red fruit and small white flowers mark a low evergreen bush that lies flat like a mat across
  North America and northern Eurasia, its leaves turning red in autumn
scope: A low evergreen bush that lies flat like a mat, with small white flowers and red fruit, also called
  bear's grape, common bearberry, creashak, hog cranberry, mealberry, mountain box, red bearberry, sandberry
  and wild cranberry.
examples:
- Sand berries grew low across the ground.
- The sand berry leaves turn red in autumn.
