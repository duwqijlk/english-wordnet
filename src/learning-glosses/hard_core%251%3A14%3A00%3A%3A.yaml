simpleMeaning: A small set of people in a group or cause stands out for being most loyal and most devoted
scope: The most loyal and keen people at the heart of a group, not the whole group and not its leaders.
examples:
- The hard core of the club kept meeting every week.
- Only the hard core stayed when the movement lost support.
