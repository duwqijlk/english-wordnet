simpleMeaning: A plant with feathery leaves that grows in the rain forests of tropical Australia and New
  Zealand and South Africa.
scope: This is a plant with feathery leaves that grows in the rain forests of tropical Australia and New
  Zealand and South Africa; crepe fern is another name for it, not the large deeply rooted fern found
  all over the world.
examples:
- King fern grows in the rain forests of tropical Australia.
- A king fern shaded the forest floor in New Zealand.
