simpleMeaning: a small European finch, a kind of small bird, with a deep red face and yellow-and-black
  wings
scope: This is the small European finch with a deep red face and yellow-and-black wings, not the American
  bird whose male has a yellow body in summer.
examples:
- A goldfinch with a red face fed on seeds in the garden.
- We saw two goldfinches with yellow-and-black wings in the field.
