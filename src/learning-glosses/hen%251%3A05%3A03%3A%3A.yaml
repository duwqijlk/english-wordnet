simpleMeaning: a female of some kinds of water animal, such as an octopus or a lobster
scope: A female of certain water animals, such as an octopus or a lobster; not a female chicken, and not
  chicken meat for slow cooking.
examples:
- A hen lobster carries her eggs under her tail.
- The fisherman put the hen back in the water so she could lay more eggs.
