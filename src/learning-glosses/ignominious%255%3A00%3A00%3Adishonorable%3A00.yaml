simpleMeaning: used of behaviour or character, so bad that it deserves shame or makes people lose respect
scope: Also called black, shameful, disgraceful and inglorious, this sense is about behaviour or character
  that brings shame; it is not about a dark colour or something only sad.
examples:
- He faced an ignominious defeat after cheating in the final game.
- Their ignominious retreat from the town made everyone lose respect for them.
