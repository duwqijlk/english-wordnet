simpleMeaning: With much rich detail, in a way that is full and complex.
scope: With much rich detail, in a way that is full and complex; not plainly and not in a spare way.
examples:
- He described the palace luxuriantly, down to the last carving.
- The novel luxuriantly piled detail upon detail.
