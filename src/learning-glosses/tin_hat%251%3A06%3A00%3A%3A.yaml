simpleMeaning: a light helmet of plastic or metal that building workers wear to guard their heads
scope: A light helmet worn by building workers to guard their heads; hard hat and safety hat are other
  names for this sense. Not a soldier's helmet, and not a soft cap.
examples:
- The builder put on his tin hat before he went onto the site.
- Every worker on the site must wear a tin hat.
