simpleMeaning: Used to scent perfumes and to make drugs, this sweet-smelling underground stem comes from
  many kinds of iris, most of all the Florentine kind.
scope: This is also called orris, and it is a sweet-smelling underground stem of many kinds of iris, most
  of all the Florentine kind, used to scent perfumes and to make drugs.
examples:
- The orrisroot scents perfumes.
- Medicines are made with orrisroot.
