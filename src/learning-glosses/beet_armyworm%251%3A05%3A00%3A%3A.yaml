simpleMeaning: Leaves of the red root plant grown for food and other vegetables are what this young moth
  eats.
scope: This name fits the young of a moth that eats the leaves of the red root plant grown for food and
  of other vegetables, not the grown moth itself.
examples:
- The beet armyworm ate the leaves off the beets.
- The beet armyworm had eaten the leaves of other vegetables too.
