senseId: 'instrument%1:10:01::'
synsetId: 06343724-n
simpleMeaning: the role of a thing, usually not a person, that someone uses to do something or to start
  something
scope: This is the role of a thing, usually not a person, that someone uses to do or start something,
  not a paper that gives a legal right and not a tool that makes music sounds.
examples:
- In 'She cut the bread with a knife', the knife is the instrument.
- In 'He opened the box with a key', the key is the instrument.
