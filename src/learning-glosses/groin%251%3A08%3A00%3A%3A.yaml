simpleMeaning: the fold where the top of the inner leg meets the body, with the area around it and often
  the outer sex organs
scope: The fold where the leg meets the body, not a stone wall built out into the sea to hold a beach
  in place.
examples:
- He pulled a muscle in his groin during the match.
- The doctor pressed gently on the patient's groin.
