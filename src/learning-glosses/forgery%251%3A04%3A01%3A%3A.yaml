simpleMeaning: the crime of making a false paper or written record, or changing a real one, in order to
  cheat someone
scope: The crime of making or changing a paper to cheat someone, not the false paper itself that is made
  in that crime.
examples:
- He was sent to prison for forgery after he made a false bank paper.
- Forgery of a famous painter's name on a painting is a serious crime.
