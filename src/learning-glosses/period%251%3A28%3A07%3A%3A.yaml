simpleMeaning: In ice hockey, a section of the match, of which there are three.
scope: This is a section of an ice hockey game, not a length of time in general, a unit of geological
  time, menstruation, or the dot at the end of a sentence.
examples:
- The home team scored twice in the second period.
- The goalie was injured late in the third period.
