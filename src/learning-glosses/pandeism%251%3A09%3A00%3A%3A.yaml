senseId: 'pandeism%1:09:00::'
synsetId: 06235186-n
simpleMeaning: The belief that God created the universe and all its events by becoming the universe, which
  is then God's only manifestation
scope: This is the belief that God became the world in making it, not the belief that God stands apart
  from what was made.
examples:
- In pandeism, the world itself is all there is of God.
- Pandeism holds that God became the world.
