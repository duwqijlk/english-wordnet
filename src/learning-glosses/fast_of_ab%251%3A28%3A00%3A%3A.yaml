simpleMeaning: In Judaism, a main day of going without food on the Jewish calendar, kept in memory of
  the temples in Jerusalem being destroyed
scope: In Judaism, a main day of going without food on the Jewish calendar, kept in memory of the temples
  in Jerusalem being destroyed; Fast of Av, Ninth of Ab, Ninth of Av, Tisha b'Ab, Tisha b'Av, Tishah b'Ab
  and Tishah b'Av are other names for it, not a small fast day and not a day that marks the killing of
  a governor.
examples:
- On the Fast of Ab, Jews remember the temples in Jerusalem.
- The Fast of Ab is a main fast day on the Jewish calendar.
