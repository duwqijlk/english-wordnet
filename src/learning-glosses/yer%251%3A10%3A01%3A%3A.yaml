simpleMeaning: One of two letters in the Cyrillic alphabets (the writing systems for Russian and other
  languages). At first it stood for its own very short vowel sound in Slavic languages
scope: This sense is a letter in the Cyrillic writing system, one of two that at first stood for very
  short vowel sounds; it is not the sound itself and not any other letter.
examples:
- The old Russian word was written with a yer at the end.
- A teacher showed us how a yer was used in old Slavic writing.
