simpleMeaning: A drawing that shows the inside of a thing as if cut by a straight up-and-down flat surface.
scope: A drawing showing the inside of a thing as if cut straight down; not a drawing of the outside and
  not a side view.
examples:
- The vertical section shows the inside of the machine as if cut straight down.
- The engineer drew a vertical section of the engine.
