simpleMeaning: to see that something is there, is present, or is true, by using your eyes
scope: 'Also called find, notice and discover: to see that a thing is there or is true, not to watch something
  with care and not to mark a holiday or special ceremony in the usual way.'
examples:
- The scientist observed a small crack in the wall that no one had seen before.
- From the hill, we observed smoke rising from a house far away.
