simpleMeaning: to make someone feel like doing something or want to do it
scope: To draw someone toward doing something, also called tempt; it is not the noun sense of a person's
  pleasing power to attract people.
examples:
- The smell of fresh bread allured her into the small shop.
- He was allured by the offer of a free trip to the sea.
