simpleMeaning: a link between two things or events, such as one causing the other or sharing features
  with it
scope: This is not a wire or joint and not the state of being joined; it is an abstract link between things
  or events.
examples:
- There is a clear connection between smoking and lung disease.
- Police found no connection between the two crimes.
