simpleMeaning: about or to do with the study of what is real and why things exist at all
scope: About the study of what is real and why things exist, not the other sense of this word that means
  only ideas in the mind with no clear link to real life.
examples:
- They had a long metaphysical talk about whether the mind is separate from the body.
- The book asks metaphysical questions about time and being.
