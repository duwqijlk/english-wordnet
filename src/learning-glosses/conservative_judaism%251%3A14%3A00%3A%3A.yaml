simpleMeaning: Jews who keep some of the rules of the Mosaic law but let other rules, such as some of
  the food rules, change to fit life today.
scope: These are Jews who keep some of the rules of the Mosaic law but let other rules change to fit life
  today; near kinds are other Jewish movements that keep the rules more strictly or change them more freely.
examples:
- Conservative Judaism keeps some rules of the Mosaic law.
- In Conservative Judaism, some food rules change to fit life today.
