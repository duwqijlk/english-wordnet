simpleMeaning: 'A measure of speed: how far a thing goes in one sixtieth of a minute, counted in thousands
  of metres'
scope: Also called kilometers per second and km/s; a measure of speed, not of distance alone and not speed
  counted by the hour.
examples:
- Light moves at almost 300,000 kilometres per second in empty space.
- The rocket climbed at several kilometres per second.
