simpleMeaning: to stop or disturb someone while they are doing something
scope: To stop or disturb a person who is busy doing something; it is not the computer signal that stops
  a program for a short time.
examples:
- Please do not interrupt me while I am on the phone.
- She kept interrupting the teacher while he was speaking.
