simpleMeaning: thought to be in the line of early animals from which dinosaurs, crocodiles and birds all
  came
scope: 'Another name for a thecodont reptile: an early animal in the line that gave rise to dinosaurs,
  crocodiles and birds, not a dinosaur, crocodile or bird itself.'
examples:
- The thecodont lived long before the first dinosaurs.
- Scientists study thecodont fossils to learn how birds and crocodiles are linked.
