synsetId: 03199496-n
simpleMeaning: light from a lamp spread out by a thing so it is the same in all parts
scope: A thing that spreads a lamp's light out the same way in all parts, also called a diffuser, and
  not a thing that spreads sound.
examples:
- The diffusor over the lamp made the light soft and even.
- She put a diffusor on the studio lamp so the light would spread out the same way.
