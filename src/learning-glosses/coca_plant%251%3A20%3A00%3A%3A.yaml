simpleMeaning: a South American bush whose leaves people of the Andes chew; it is the source of a drug
scope: A South American bush whose leaves people of the Andes chew, the source of a drug; coca is another
  name for this, not the drug itself and not a bush whose leaves are brewed as tea.
examples:
- The coca plant grows on the slopes of the Andes.
- Leaves of the coca plant are chewed by local people.
