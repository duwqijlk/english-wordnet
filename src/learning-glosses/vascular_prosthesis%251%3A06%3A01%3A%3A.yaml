simpleMeaning: a tube made by people that carries blood, fitted in an operation to change the way blood
  flows in one part of the body
scope: 'Another name for a vascular conduit: a man-made tube fitted in an operation to change the way
  blood flows in one part of the body, not a real blood vessel and not a tube that drains blood from the
  body.'
examples:
- The vascular prosthesis let blood reach the arm again.
- Doctors chose a vascular prosthesis when the vein was too weak to use.
