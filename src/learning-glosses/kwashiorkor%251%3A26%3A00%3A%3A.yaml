simpleMeaning: A diet far too rich in starchy and sweet food and far too poor in protein brings on a serious
  lack of good food in a child.
scope: The state named here comes from a child's diet that is far too rich in starchy and sweet food and
  far too poor in protein.
examples:
- The child had kwashiorkor from a diet of sweet starchy food with little protein.
- The child's food was mostly sweet starch with little protein, and kwashiorkor set in.
