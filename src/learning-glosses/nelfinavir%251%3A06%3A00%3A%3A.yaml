simpleMeaning: A drug sold as Viracept that blocks a body chemical that cuts up proteins, used to treat
  HIV, usually with other drugs.
scope: A drug for treating HIV, sold as Viracept; not a cure for HIV and not a drug for other viruses.
examples:
- The doctor gave her nelfinavir along with two other HIV drugs.
- Nelfinavir is usually taken in combination with other drugs.
