simpleMeaning: Eaten as food, these soft-finned sea animals swim in schools in the shallow waters of northern
  seas; there are many kinds of them.
scope: Also called a clupeid, this is one of many kinds of soft-finned sea animals in the shallow waters
  of northern seas, eaten as food.
examples:
- The clupeid fish swims with others of its kind in northern seas.
- Many people eat clupeid fish as food.
