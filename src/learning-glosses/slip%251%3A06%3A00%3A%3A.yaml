simpleMeaning: A piece of clothing with no sleeves that a woman wears under her other clothes
scope: Shift is another name for this sense. This is a piece of clothing with no sleeves that a woman
  wears under her other clothes, not a pillow cover, not a small flat piece, and not a fall.
examples:
- She wore a silk slip under her dress.
- Her slip showed below the hem of her skirt.
