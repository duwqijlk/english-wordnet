simpleMeaning: With two pairs of thin clear wings, these small flying creatures sting or pierce with a
  sharp egg-laying part.
scope: It is one of the four-winged kinds with a stinging egg-layer, also called hymenopter, hymenopteran,
  and hymenopterous insect.
examples:
- The hymenopteron flew past and folded its thin wings.
- A hymenopteron stung him.
