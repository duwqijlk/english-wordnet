simpleMeaning: Like a lyre in shape, this plant part bends in a curve and is all one piece
scope: A single plant part that curves like a lyre, not one made of many small parts joined together.
examples:
- The lyrate leaf on the plant bent like a small lyre.
- She pressed a lyrate leaf between the pages of her book.
