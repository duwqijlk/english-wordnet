simpleMeaning: a business person who brings people or firms together to work on a shared plan
scope: A business person who forms a group to work on a shared plan, not a person who merely joins such
  a group.
examples:
- The syndicator brought five small firms together to build the road.
- As a syndicator, she formed a group to buy the old theatre.
