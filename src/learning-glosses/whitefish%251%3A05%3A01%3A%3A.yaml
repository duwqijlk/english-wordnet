simpleMeaning: a silver-coloured fish like a herring, that lives in fresh water in cold lakes in the northern
  half of the world, and is eaten as food
scope: The living fish itself, not its flesh eaten as food and not a saltwater fish sold for food.
examples:
- A whitefish swam in the cold lake.
- They caught a whitefish from the fresh water.
