simpleMeaning: A pointed bit that stands out from the rest of a thing and ends sharp
scope: This is a pointed bit that stands out and ends sharp, also called spine, not the sharp point on
  a rider's heel and not the tube-shaped part of a flower.
examples:
- A spur of rock jutted from the cliff.
- The spur of land reached into the sea.
