simpleMeaning: a note written in the margin of a book by a person who explains old or classical books
scope: A note in the margin of a book, also called a scholium; not a note by the author, and not a note
  written in the main text.
examples:
- The scholia in the margin explain the hard lines of the poem.
- She read the scholia to make sense of the old Latin text.
