simpleMeaning: a part fitted to a record player that puts on the next record by itself, with no need for
  anyone to touch it
scope: The device on a record player that changes the record on its own, not a person who changes something.
examples:
- The old changer dropped the next record onto the turntable.
- With a changer, the music played on without anyone getting up.
