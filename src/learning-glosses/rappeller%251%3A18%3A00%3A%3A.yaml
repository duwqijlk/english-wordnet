senseId: 'rappeller%1:18:00::'
synsetId: 09776780-n
simpleMeaning: A person who climbs down a steep face on a rope folded in two, wound round the body and
  fixed to a high point
scope: A person who climbs down a steep face on a doubled rope, also called an abseiler; not a rock climber
  going up and not a person sliding down a pole.
examples:
- The rappeller lowered himself slowly down the cliff.
- A skilled rappeller reached the ground in minutes.
