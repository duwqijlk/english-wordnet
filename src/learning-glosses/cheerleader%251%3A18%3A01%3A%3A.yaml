simpleMeaning: a person who backs something with loud, eager praise
scope: A loud, eager backer of a cause or idea, not the person who leads cheers at a game.
examples:
- He has become a cheerleader for therapeutic cloning.
- She acted as a cheerleader for the new school lunch plan, praising it at every meeting.
