simpleMeaning: to say or write very strong words against a person or thing, saying what is wrong with
  them
scope: 'Also called blast: to speak or write against someone in a very strong way, not to hurt a person
  in the body and not to fight with great force.'
examples:
- The newspapers savaged the leader for his poor plan.
- Critics savaged her new book in their reviews.
