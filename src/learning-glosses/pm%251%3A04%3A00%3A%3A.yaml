simpleMeaning: A cut-open look at a dead body to find why the person died or what harm the illness did.
scope: Also called an autopsy, a postmortem, a necropsy, a post-mortem, a post-mortem examination and
  a postmortem examination; not the radio sense of the same short name.
examples:
- The PM showed the cause of death.
- A PM was done on the body the next day.
