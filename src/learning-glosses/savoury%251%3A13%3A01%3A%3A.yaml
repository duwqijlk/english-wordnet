senseId: 'savoury%1:13:01::'
synsetId: 07610411-n
simpleMeaning: A dish with a pleasant smell or a spicy taste, served at the end of dinner or as a small
  dish before the meal.
scope: Also called savory, a spicy or pleasant-smelling dish served at the end of dinner or as a small
  dish before the meal, not either of the two sweet-smelling herbs of the mint family and not the adjective
  use for what is morally wholesome or acceptable.
examples:
- A savoury of cheese and herbs finished the meal.
- They served a small savoury before the main course.
