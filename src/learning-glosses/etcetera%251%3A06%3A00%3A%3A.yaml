senseId: 'etcetera%1:06:00::'
synsetId: 03304208-n
simpleMeaning: other things of the same kind that are not named, and more things like the ones already
  said
scope: This names the extra unnamed things themselves, not the words 'and so on' placed at the end of
  a list.
examples:
- The drawer held pens, clips, rubber bands and all sorts of etceteras.
- His bag was full of books, papers, etceteras and other small things.
