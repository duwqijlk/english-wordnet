simpleMeaning: A long-lived herb of Europe and Asia, with hairy leaves cut into narrow parts and yellow
  flowers, now growing wild in North America
scope: This is a long-lived herb with yellow flowers now growing wild in North America, not a herb with
  white or pink flowers; dyers' chamomile, golden marguerite and yellow chamomile are other names for
  this sense.
examples:
- Anthemis tinctoria grows in Europe, with hairy leaves and yellow flowers.
- The Anthemis tinctoria in our garden has bright yellow flowers.
