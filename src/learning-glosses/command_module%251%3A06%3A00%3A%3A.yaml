simpleMeaning: the part of a space ship where the crew live, steer the ship, and talk to earth
scope: This is the crew's living and control part of a space ship, not the part that lands on the moon
  and not the part that stores fuel.
examples:
- The astronauts slept in the command module during the trip.
- She checked the controls inside the command module before the crew woke.
