simpleMeaning: its tall leaves stand up in bunches, each split twice into small leaflets, on a big plant
  with deep roots found all over the world
scope: Also called a ditch fern, a king fern, and a royal osmund; a tall fern with deep roots, not a small
  ground fern.
examples:
- The royal fern by the pond sends up tall leaves each spring.
- We planted a royal fern where the soil stays damp.
