simpleMeaning: The hollow place in the bones of the skull that holds the eyeball
scope: This is the hollow place in the bones of the skull that holds the eyeball; orbit, eye socket and
  orbital cavity are other names for it; not the hollow that holds the nose, and not the passage that
  leads to the ear.
examples:
- The cranial orbit protects the eyeball.
- The blow broke the bones of his cranial orbit.
