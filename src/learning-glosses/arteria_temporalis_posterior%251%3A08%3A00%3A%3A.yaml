simpleMeaning: The back part of the outer layer of the side part of the brain is fed by a blood tube of
  the side of the head
scope: This blood tube of the side of the head is also called the posterior temporal artery, not the one
  that feeds the front part.
examples:
- The arteria temporalis posterior brings blood to the back part of the side of the brain.
- The arteria temporalis posterior runs to the back of the outer layer of the side part of the brain.
