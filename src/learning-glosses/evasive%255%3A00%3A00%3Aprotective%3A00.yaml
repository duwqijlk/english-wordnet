simpleMeaning: moving or acting so as to get away from trouble or danger, most of all from shots fired
  by an enemy
scope: Moving to get away from danger, not a vague answer and not a person who dodges a question.
examples:
- Pilots are taught to take evasive action when fired on.
- The plane made an evasive turn to escape the guns.
