simpleMeaning: Packed close, a small group of message-carrying parts runs one job of the body
scope: 'Another name for this sense is nerve center, also called center or centre: a small group of cells
  that looks after one job of the body, not one single cell and not the whole nervous system.'
examples:
- The nerve centre for breathing sits low in the brain.
- A blow to the nerve centre that controls the heartbeat can be deadly.
