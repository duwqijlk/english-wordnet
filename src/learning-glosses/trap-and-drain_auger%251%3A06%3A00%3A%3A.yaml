simpleMeaning: A long tool that bends, used by a plumber to clear a block in a bend in a pipe or in the
  pipe that takes water away
scope: A long tool that bends, used by a plumber to clear a block in a pipe; not a drill for making holes
  and not a plunger for pushing a block through.
examples:
- The plumber used a trap-and-drain auger to clear the blocked sink.
- A trap-and-drain auger can reach a block deep inside the pipe.
