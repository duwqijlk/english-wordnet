simpleMeaning: It breathes with one of the often bright, colourful branching growths shaped like horns
  on the back of a soft sea slug, and of other soft sea animals like it.
scope: One of the often bright, colourful branching growths shaped like horns on the back of a soft sea
  slug; not a true horn, and not a growth on its belly.
examples:
- The ceras on the slug's back were bright and branched.
- Each ceras works like a gill, letting the animal breathe.
