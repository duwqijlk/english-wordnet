simpleMeaning: Any one of five related elements that are not metals — fluorine, chlorine, bromine, iodine,
  or astatine — each joining with one other atom and readily forming a negative ion.
scope: One of five related elements that are not metals, each forming a negative ion, not a metal element.
examples:
- Chlorine is a halogen used to clean pools.
- Each halogen readily forms a negative ion.
