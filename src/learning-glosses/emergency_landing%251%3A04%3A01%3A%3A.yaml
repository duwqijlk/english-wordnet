simpleMeaning: A plane coming down at a time not planned, forced by things outside the pilot's control
  such as engine failure or bad weather
scope: This is a plane coming down at a time not planned, forced by things outside the pilot's control;
  forced landing is another name for it, not a planned stop and not a crash.
examples:
- The plane made an emergency landing after the engine failed.
- Bad weather forced an emergency landing.
