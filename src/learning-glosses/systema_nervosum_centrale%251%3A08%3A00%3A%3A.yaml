simpleMeaning: The part of the nerve network of animals with backbones that is made up of the brain and
  the spinal cord.
scope: This is the part of the nerve network made up of the brain and the spinal cord, also called central
  nervous system, and not the nerves of the limbs or the brain alone.
examples:
- The systema nervosum centrale controls the body from the brain.
- Injury to the systema nervosum centrale can paralyse the limbs.
