simpleMeaning: a clear sign that a person or thing is there, or of what it is like
scope: A clear sign that a person or thing is there, or of what it is like; not the thing itself, but
  the sign that shows it.
examples:
- A rash can be a manifestation of the disease.
- His anger was a manifestation of his fear.
