simpleMeaning: able to notice or make small, fine differences that most people miss, and quick to feel
  small changes
scope: About noticing fine differences and feeling small changes, not about being quietly kind and understanding,
  and not just about having keen insight and good judgment.
examples:
- She has a discerning eye for color and light.
- A discerning nose can pick out each spice in the dish.
