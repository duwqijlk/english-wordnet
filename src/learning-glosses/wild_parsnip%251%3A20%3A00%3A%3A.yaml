simpleMeaning: The wild plant from which the cultivated parsnip was bred, a two-year weed of Europe and
  America with big feathery leaves, yellow blooms and a bitter, mildly toxic root.
scope: The everyday name for this two-year weed with yellow flowers and a mildly toxic root; madnep names
  the same plant, and the cultivated parsnip is the edible root vegetable.
examples:
- Wild parsnip flowers in its second year, then dies after its seeds have formed.
- In Europe and America, wild parsnip is classed as a weed.
