simpleMeaning: A machine that burns fuel outside itself to make hot vapour, which then turns a wheel with
  blades or pushes a flat round piece up and down in a tube
scope: A machine that burns fuel outside itself to make hot vapour; not a machine that burns fuel inside
  itself and not a windmill.
examples:
- The old steam engine pulled the train up the hill.
- A steam engine needs hot vapour to turn its wheels.
