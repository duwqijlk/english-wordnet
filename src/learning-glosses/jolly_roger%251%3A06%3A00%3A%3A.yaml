simpleMeaning: A black flag, often with a white skull and crossed bones, that shows a ship is a pirate
  ship
scope: A black flag, often with a white skull and crossed bones, that shows a ship is a pirate ship; blackjack,
  black flag and pirate flag are other names for this sense; not a plain black flag flown for another
  reason, and not the flag of a navy ship.
examples:
- The Jolly Roger flew from the mast of the pirate ship.
- When the Jolly Roger went up, the crew knew pirates were near.
