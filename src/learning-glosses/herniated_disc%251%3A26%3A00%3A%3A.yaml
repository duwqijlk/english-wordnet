simpleMeaning: Most often in the lower back, a sore tear opens in the tough gristle pad between two bones
  of the spine.
scope: People also call this sore tear a ruptured intervertebral disc and a slipped disc, and it comes
  most often in the lower back.
examples:
- Her herniated disc made it hurt to bend down.
- His herniated disc hurt in his lower back.
