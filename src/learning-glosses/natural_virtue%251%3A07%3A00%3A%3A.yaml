simpleMeaning: 'In scholasticism, one of the four good qualities that come from nature: good judgment,
  fairness, courage and self-control.'
scope: In scholasticism, one of the four good qualities that come from nature — good judgment, fairness,
  courage and self-control; not a gift from God and not a bad habit.
examples:
- Prudence is a natural virtue in scholastic thought.
- The four natural virtues come from nature, not from grace.
