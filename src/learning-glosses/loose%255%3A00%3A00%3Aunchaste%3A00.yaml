simpleMeaning: Treating sex casually, with little restraint in sexual conduct.
scope: This is the sexual-conduct sense, another name for light, easy, wanton, promiscuous and sluttish,
  not the physical sense of something not tight and not a general lack of responsibility.
examples:
- She was warned to stay away from loose women.
- The scandal exposed his loose morals.
