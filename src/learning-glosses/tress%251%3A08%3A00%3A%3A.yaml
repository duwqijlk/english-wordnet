simpleMeaning: a way of wearing the hair by crossing parts of it over each other again and again
scope: 'Also called twist, braid, and plait: hair crossed over itself in a long piece, not loose hair
  and not a short cut.'
examples:
- She wore her hair in one long braided tress down her back.
- Her dark tresses were twisted together and tied with a ribbon.
