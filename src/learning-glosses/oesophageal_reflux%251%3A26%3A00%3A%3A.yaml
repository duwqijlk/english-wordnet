simpleMeaning: What is in the stomach flows back up into the food pipe
scope: What is in the stomach flows back up the food pipe, also called esophageal reflux and gastroesophageal
  reflux, and not food thrown up through the mouth.
examples:
- His oesophageal reflux kept him awake at night.
- The doctor said her oesophageal reflux was worse after meals.
