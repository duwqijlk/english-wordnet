simpleMeaning: Food must supply this building block of proteins, which the body cannot make, and it is
  found above all in gelatin and in the protein of milk.
scope: This building block of proteins cannot be made by the body, so it must come from food, and it is
  found above all in gelatin and in the protein of milk.
examples:
- Lysine from food helps the body build proteins.
- Gelatin is rich in lysine.
