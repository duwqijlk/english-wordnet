simpleMeaning: showing no warm or friendly feeling, and showing that you do not like a person and think
  little of them
scope: Also called frozen, icy, frigid, frosty, and wintry, this describes a cold, unfriendly way of meeting
  people. It is about a person's manner, not about huge sheets of ice that move very slowly.
examples:
- She gave him a glacial look and walked past without speaking.
- His glacial welcome made the new worker feel unwanted.
