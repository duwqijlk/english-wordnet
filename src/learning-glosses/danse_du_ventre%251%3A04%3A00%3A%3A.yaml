simpleMeaning: A dance from the Middle East in which the dancer moves the hips and belly in soft movements
  meant to please the senses.
scope: A Middle Eastern dance of hip and belly movement; belly dance and belly dancing are other names
  for it, not a folk dance and not a ballroom dance.
examples:
- She learned the danse du ventre for the show.
- The danse du ventre is danced with slow movements of the hips.
