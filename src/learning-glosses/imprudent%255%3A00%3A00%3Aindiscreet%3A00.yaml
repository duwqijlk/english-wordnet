senseId: imprudent%5:00:00:indiscreet:00
synsetId: 00777014-s
simpleMeaning: having no wise control over what you do or say
scope: It describes a person or act with no wise control over words or actions, not a person who is just
  rude and not an act that is against the law.
examples:
- It was imprudent to send that angry email without reading it again.
- He made an imprudent remark about his boss at the party.
