simpleMeaning: a device in a car's exhaust system that cuts pollution by using a platinum-iridium catalyst
  to turn harmful gases and carbon monoxide into carbon dioxide and water.
scope: This is the pollution-control device in a vehicle's exhaust that changes harmful gases into safer
  ones, not a muffler, which mainly quietens the engine.
examples:
- The garage replaced the catalytic converter after the exhaust failed its emissions test.
- A catalytic converter turns much of the carbon monoxide in exhaust into carbon dioxide.
