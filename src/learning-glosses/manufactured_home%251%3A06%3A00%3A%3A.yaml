simpleMeaning: Lived in all year round, this big house on wheels stays in one spot, hooked up to water
  and power
scope: Also called a mobile home, this is a big wheeled house that stays in one place and is lived in
  all year round, not a small camper and not a house built on a fixed plot.
examples:
- The manufactured home was hooked up to water and power when the family moved in.
- They bought a manufactured home and parked it on a quiet lot for good.
