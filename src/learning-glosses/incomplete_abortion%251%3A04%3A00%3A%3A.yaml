senseId: 'incomplete_abortion%1:04:00::'
synsetId: 00231864-n
simpleMeaning: A pregnancy ends but not all of what grew with the baby leaves the body
scope: This is a pregnancy that ends with some of what grew with the baby still inside the body; partial
  abortion is another name for this sense. Not a pregnancy that ends with everything expelled and not
  a threatened loss.
examples:
- The doctor said the incomplete abortion would need treatment to clear the womb.
- After the incomplete abortion, she was kept in hospital for a check.
