simpleMeaning: all the Jews, or groups of Jews, who live outside Palestine or modern-day Israel
scope: This is the group of Jews living outside Palestine or modern Israel, not the wider spreading of
  any people, language or way of life from its first place.
examples:
- Many families in the Diaspora keep in touch with relatives in Israel.
- The Jewish diaspora includes communities in many countries around the world.
