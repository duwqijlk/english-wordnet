simpleMeaning: a paid clown who made a king or a rich lord laugh in the Middle Ages
scope: 'Also called fool and motley fool: a paid clown for a king or lord long ago, not a person who acts
  in a silly way today.'
examples:
- The jester told jokes and did tricks to make the king laugh.
- In the Middle Ages, a jester worked in the court of a rich lord.
