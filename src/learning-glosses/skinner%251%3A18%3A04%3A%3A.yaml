simpleMeaning: a worker whose job is to drive and guide mules
scope: 'Also called muleteer: a worker who drives mules, not a person who gets animal skins ready or sells
  them.'
examples:
- The skinner drove the mules along the narrow mountain path.
- As a skinner, he took a team of mules to the mine each day.
