simpleMeaning: to pull the lips back so the teeth show, as in a smile, a grimace or a snarl
scope: The act itself of pulling the lips back to show the teeth, in a smile, grimace or snarl — not the
  noun grin in this lane, and not the separate verb smile, which spreads the lips but need not show the
  teeth.
examples:
- He grinned at me across the table.
- She grinned when she opened the present.
