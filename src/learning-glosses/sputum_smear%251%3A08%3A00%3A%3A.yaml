simpleMeaning: One of several thin spreads of spit taken from the lower breathing tubes lets cells be
  looked at for signs of cancer and other lung sickness.
scope: Also called a bronchoscopic smear and a lower respiratory tract smear, this is one of several thin
  spreads of spit taken from the lower breathing tubes.
examples:
- A sputum smear can show cancer cells.
- They took a sputum smear from the lower breathing tubes.
