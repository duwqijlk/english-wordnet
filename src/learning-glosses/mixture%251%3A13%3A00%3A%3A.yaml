simpleMeaning: any food made by putting two or more different things together
scope: This is a food made by putting things together, not a substance mixed together in chemistry and
  not an event that brings different things together.
examples:
- She poured the cake mixture into the tin and put it in the oven.
- The mixture of flour, eggs and milk was ready to cook.
