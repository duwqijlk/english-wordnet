senseId: 'unevenly%4:02:01::'
synsetId: 00334089-r
simpleMeaning: in a way that is not the same for all, or that treats one side better than another
scope: This is about sharing or treating people in a way that is not fair or not equal. Not a rough, not
  steady way of doing something, and not a way that is not regular.
examples:
- The money was shared unevenly, so one brother got much more than the other.
- The teacher treated the class unevenly, giving more time to some pupils than to others.
