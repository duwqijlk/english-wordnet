simpleMeaning: a soft mix like dough, made of a white powder (whiting) and boiled oil from flax seed,
  used especially to mend woodwork or hold glass panes in place
scope: This is the soft material itself, not the act of putting it on wood or glass to fix or fill a hole,
  which is the verb sense listed elsewhere.
examples:
- He pressed putty around the edge of the new window glass to hold it in place.
- She filled the small hole in the wood with putty and let it dry.
