simpleMeaning: A word used in everyday talk before another word, making it stronger by saying it is complete
  and has no limit, often with scorn.
scope: 'Also called perfect, complete, staring, utter, pure, thorough, gross, stark, everlasting, consummate,
  unadulterated, and arrant: a word used in everyday talk to make another word stronger, often with scorn.'
examples:
- What a sodding mess this room is!
- He called it a sodding nuisance and walked out.
