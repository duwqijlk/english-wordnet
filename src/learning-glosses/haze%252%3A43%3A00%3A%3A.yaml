simpleMeaning: to become not clear to see, dull, or cloudy
scope: This is the verb for becoming unclear or cloudy, not the noun for dust or smoke in the air that
  makes it hard to see, and not confusion in the mind.
examples:
- By late afternoon, the sky began to haze over and the hills looked dull.
- The bathroom mirror hazed up while she was in the shower.
