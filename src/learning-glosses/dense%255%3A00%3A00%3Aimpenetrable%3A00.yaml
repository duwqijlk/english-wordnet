simpleMeaning: hard to move through because plants grow very close together there
scope: This is about plants or trees growing close together so a person finds it hard to move through.
  It is not about smoke or fog letting little light through, and not about a person who is slow to learn.
examples:
- Dense bushes blocked the path through the garden.
- We pushed our way through dense woods.
