simpleMeaning: A tool that makes something slightly wet.
scope: A tool that makes something slightly wet, also called dampener; not a tool that dries things, and
  not water itself.
examples:
- He used a moistener to wet the shirts before he ironed them.
- She kept a moistener by the desk for sealing envelopes.
