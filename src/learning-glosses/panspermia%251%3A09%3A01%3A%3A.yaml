simpleMeaning: the idea that tiny living things may carry life from space to worlds where life can live,
  or the carrying itself
scope: The idea that tiny living things may carry life from space to worlds where life can live, or the
  carrying itself; not the idea that life began on earth and not the idea that lifeless dust from space
  alone gave rise to life on earth.
examples:
- Panspermia says life may have come from space.
- Some scientists back panspermia as the source of life on earth.
