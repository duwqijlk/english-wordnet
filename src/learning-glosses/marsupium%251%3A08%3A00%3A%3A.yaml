simpleMeaning: Newborn young are fed with milk in a pouch on the outside of the belly of most pouched
  animals.
scope: This pouch sits on the outside of the belly of most pouched animals, where the newborn young are
  fed with milk, not a pocket inside the body.
examples:
- The baby kangaroo stayed in the marsupium.
- A marsupium holds the newborn young close to the mother's belly.
