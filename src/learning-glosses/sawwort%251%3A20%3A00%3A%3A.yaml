simpleMeaning: a plant of Europe that lives for years, with leaves with toothed edges that give a yellow
  dye
scope: A long-lived European plant whose leaves give a yellow dye, not a food plant and not a dye made
  from minerals.
examples:
- Sawwort grew in the garden, and its leaves were used to make a yellow dye.
- She dried the sawwort leaves to colour cloth yellow.
