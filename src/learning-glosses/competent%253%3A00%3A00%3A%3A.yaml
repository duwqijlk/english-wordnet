senseId: 'competent%3:00:00::'
synsetId: 00511975-a
simpleMeaning: able to do a job well, with the skill and knowledge it needs
scope: Having the skill to do a job well, not the legal sense of being qualified, and not the sense of
  merely adequate.
examples:
- She is a competent typist who rarely makes a mistake.
- We need a competent manager to run the office.
