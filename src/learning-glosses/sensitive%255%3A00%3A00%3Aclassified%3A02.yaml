simpleMeaning: relating to secret information that only a few people may see, or to matters that affect
  a country's safety
scope: This is about secret information and matters that affect a country's safety, not about being easily
  affected by other people's feelings or needs.
examples:
- The files hold sensitive information about the army, so only a few officers may see them.
- He works on sensitive matters of national safety and cannot talk about his job.
