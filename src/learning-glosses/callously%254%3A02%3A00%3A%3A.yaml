simpleMeaning: in a way that shows no care for how other people feel or for the hurt you cause
scope: It says how an act is done, with no care for other people, not the word for a person or thing that
  is like this.
examples:
- He callously laughed while she was crying.
- The company callously left its workers with no help after the fire.
