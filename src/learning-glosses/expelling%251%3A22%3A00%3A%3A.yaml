simpleMeaning: one of several ways that things in the body leave the body
scope: 'Also called emission and discharge: a way the body lets things out, not putting a student out
  of school or forcing a person out of a place.'
examples:
- Sweating is a form of expelling water from the body.
- The expelling of pus from a wound can help it heal.
