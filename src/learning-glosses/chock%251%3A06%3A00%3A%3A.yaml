simpleMeaning: a block of wood put against a heavy thing to stop it sliding or rolling
scope: 'Also called a wedge: a wood block that stops a heavy thing from moving. Not the verb senses, which
  mean to hold or support something with such a block.'
examples:
- He put a chock behind the wheel so the cart would not roll back.
- The worker slid a chock under the heavy crate to keep it still.
