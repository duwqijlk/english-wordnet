simpleMeaning: Pleased with oneself and not knowing much, and not caring about art and learning, or even
  set against them
scope: Pleased with oneself and not knowing much, and not caring about art and learning, or even set against
  them; philistine is another name for this sense, not simply untaught and not a lover of art who dislikes
  new ideas.
examples:
- His anti-intellectual sneer put off the artists.
- An anti-intellectual crowd booed the new play.
