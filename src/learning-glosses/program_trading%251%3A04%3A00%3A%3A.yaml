simpleMeaning: a way of buying and selling in which big lots of shares are sold and bought when a computer
  starts the deals
scope: A way of buying and selling big lots of shares when a computer starts the deals; not buying and
  selling by hand, and not a way of buying shares to keep for years.
examples:
- Program trading moved thousands of shares in a few seconds.
- The crash was made worse by program trading on the big markets.
