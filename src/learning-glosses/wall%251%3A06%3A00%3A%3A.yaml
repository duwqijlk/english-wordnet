simpleMeaning: a tall, flat structure that forms the side of a room or building and can hold up a roof
  or divide a space.
scope: This is a solid side or barrier of a building, not the side of a container and not a feeling of
  being trapped.
examples:
- They painted the walls of the bedroom light blue.
- A high wall around the garden keeps the noise out.
