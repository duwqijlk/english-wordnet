simpleMeaning: to reduce something to small pieces by striking it again and again, as a pestle does.
scope: Reducing something to fragments with repeated blows, as a pestle does, not merely hitting it hard
  or driving it against something.
examples:
- She pounded the spices into a fine powder.
- He pounded the roots into a paste with a flat stone.
