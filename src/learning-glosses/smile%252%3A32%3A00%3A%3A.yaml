simpleMeaning: convey something by turning up the corners of your mouth
scope: The verb for conveying something by this expression, as in smiling one's thanks; not the plain
  act of making the expression, nor the noun naming it.
examples:
- She smiled her thanks and slipped out of the room.
- He smiled a greeting at the new arrivals.
