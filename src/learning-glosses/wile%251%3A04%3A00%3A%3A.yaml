simpleMeaning: the use of tricks to make someone believe what is not true, usually to get money from them
scope: 'Also called trickery, shenanigan, guile and chicanery: the use of tricks to fool someone, not
  an honest plan and not a magic trick.'
examples:
- He used every wile he knew to get her money.
- By wiles and lies, the seller took money from old people.
