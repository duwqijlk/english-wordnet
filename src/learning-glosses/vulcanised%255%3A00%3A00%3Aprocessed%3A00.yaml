simpleMeaning: of rubber, treated by a chemical or physical way to make it harder, stronger, better-smelling
  and springier
scope: Of rubber, treated to make it harder, stronger, better-smelling and springier, also called cured
  and vulcanized; not raw rubber and not rubber that has gone soft.
examples:
- The vulcanised rubber in the tyre is hard and strong.
- Vulcanised rubber keeps its shape in the heat.
