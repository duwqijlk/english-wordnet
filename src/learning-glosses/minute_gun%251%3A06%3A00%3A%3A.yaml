simpleMeaning: In the armed forces, a cannon fired once every sixty seconds, usually as part of a funeral
  for a person in the armed forces.
scope: In the armed forces, a cannon fired once every sixty seconds, usually as part of a funeral for
  a person in the armed forces; not a weapon carried by hand, and not shots fired as a salute.
examples:
- The minute gun sounded once every sixty seconds during the funeral.
- A minute gun fired from the fort as the procession passed.
