simpleMeaning: A made-up world that children keep going for a long time, which can have its own lands,
  speech and past.
scope: A long-lived made-up world of children, not a passing daydream and not a single made-up friend.
examples:
- The sisters shared a paracosm with its own maps and kings.
- His paracosm had a language only he and his brother spoke.
