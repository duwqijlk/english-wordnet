senseId: 'vernacular_art%1:06:00::'
synsetId: 03867479-n
simpleMeaning: a kind of work, including things built out of doors, by people with no training who do
  not think of themselves as makers of such work
scope: 'Also called naive art, outsider art, primitive art, and self-taught art: work made by people with
  no training who do not see themselves as makers of such work, not work made by people trained in art
  schools.'
examples:
- Her garden is full of vernacular art made from old wood and stone.
- The museum shows vernacular art by people who never went to art school.
