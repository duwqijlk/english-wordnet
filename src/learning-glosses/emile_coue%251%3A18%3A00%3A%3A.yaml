simpleMeaning: A French healer of the mind who said that picturing oneself getting better would make one
  better, who lived from 1857 to 1926
scope: This is the French healer of the mind who said picturing oneself getting better would make one
  better; Coue is another name for this sense, and his nearest rivals are other healers of the mind.
examples:
- Emile Coue taught that imagining health could bring health.
- People followed Emile Coue's idea of getting better by thought.
