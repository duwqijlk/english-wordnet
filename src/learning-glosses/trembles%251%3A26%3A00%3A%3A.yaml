simpleMeaning: a sickness of farm animals, above all cows, poisoned by eating certain kinds of snakeroot
scope: A sickness of farm animals poisoned by snakeroot, not a shaking movement of the body.
examples:
- The trembles killed several cows that summer.
- The vet said the trembles came from snakeroot in the field.
