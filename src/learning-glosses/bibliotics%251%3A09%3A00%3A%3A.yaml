simpleMeaning: The scientific study of documents and handwriting, especially to find who wrote them and
  whether they are real
scope: This names the study of old papers and handwriting used to settle who wrote them and whether they
  are real.
examples:
- The papers were sent for bibliotics to find out who had written them.
- Through bibliotics, the old letter was shown to be real.
