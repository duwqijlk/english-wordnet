simpleMeaning: Extra time that both sides agree to give for finishing a job or paying back money that
  is owed
scope: Extra time agreed by both sides for finishing a job or paying a debt, not a new part added to a
  building, not a plan made to reach more people, and not a belief spreading into new places.
examples:
- They applied for an extension of the loan when the work ran late.
- The builder was given an extension of two weeks to finish the roof.
