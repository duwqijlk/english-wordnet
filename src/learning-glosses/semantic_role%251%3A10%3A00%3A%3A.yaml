simpleMeaning: In the study of language, the hidden link that a part of a sentence has to the main verb
scope: 'Also called a participant role: the hidden link a part of a sentence has to the main verb, not
  the part of speech of a word and not its job as subject or object.'
examples:
- In a sentence, the semantic role of 'Mary' is the doer of the act.
- Students learn the semantic role each part of the sentence plays.
