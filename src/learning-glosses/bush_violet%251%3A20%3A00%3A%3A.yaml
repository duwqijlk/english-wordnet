simpleMeaning: any of several herbs of the genus Browallia grown for their blue, purple or white flowers
scope: Any of several herbs of the genus Browallia grown for their blue, purple or white flowers, also
  called browallia, and not a wild violet or a garden plant grown for its leaves.
examples:
- Bush violets filled the pots on the windowsill.
- She grew bush violet for its blue flowers.
