simpleMeaning: a control of any kind that starts or stops power going round a path, or sends it a new
  way
scope: A control that joins or breaks links in a path for power, also called switch and electric switch;
  not a plug and not a fuse.
examples:
- Flip the electrical switch to turn on the light.
- The electrical switch broke the circuit when it was turned off.
