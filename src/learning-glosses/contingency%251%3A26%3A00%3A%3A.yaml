simpleMeaning: the state in which one thing depends on another thing
scope: This sense is the state of one thing depending on something else; it is not a possible future event,
  and it is not a plan made for such an event.
examples:
- The letter explains the contingency of the job offer on a good reference.
- In this agreement, the contingency of the payment on delivery is written in clear words.
