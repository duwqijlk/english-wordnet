simpleMeaning: free flow or movement through a thing, as liquid moving inside a living cell or a plant
scope: Free movement through a thing, as of liquid in a cell or a plant; not the spread of newspapers,
  and not blood moving round the body.
examples:
- Ocean circulation shapes the world's weather.
- A fan helps air circulation in the room.
