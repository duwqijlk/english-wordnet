simpleMeaning: The quality of thinking too well of oneself and showing it off.
scope: The quality of thinking too well of oneself and showing it off, not the shameful act of showing
  one's own private parts to draw attention to them.
examples:
- Her immodesty showed in the way she talked about her own looks.
- His immodesty put people off at the party.
