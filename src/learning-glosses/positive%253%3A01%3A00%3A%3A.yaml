simpleMeaning: Of or relating to the philosophy that knowledge comes only from observable facts and scientific
  evidence.
scope: This refers to the philosophy that knowledge rests on observable facts, not to optimism, firm confidence,
  an imposed rule, or electric charge.
examples:
- Comte's positive philosophy held that society should be studied with the methods of natural science.
- The course traces the positive tradition, which treats only observable facts as real knowledge.
