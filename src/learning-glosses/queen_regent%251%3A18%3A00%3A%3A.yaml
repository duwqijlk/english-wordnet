simpleMeaning: a woman who rules a country when the king cannot
scope: A woman who rules in place of a king, not a king's wife and not a woman who rules in her own right.
examples:
- The queen regent ruled while the young king grew up.
- As queen regent, she signed the laws in the king's name.
