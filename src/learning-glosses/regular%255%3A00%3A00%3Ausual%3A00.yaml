simpleMeaning: following someone's normal routine or the customary way of doing things
scope: Only for personal habits or ordinary procedure; not clothing size, frequent customers, army membership,
  party loyalty, timetables, repeated intervals, standard patterns, solid measurement, health, symmetry,
  normality, full-time status, or emphasis.
examples:
- A cup of tea is part of his regular morning routine.
- She skipped her regular evening swim because of the storm.
