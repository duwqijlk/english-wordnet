simpleMeaning: In physics, the rule that two bodies pull each other with a force that grows with the product
  of their matter and falls with the square of their gap
scope: Also called law of gravitation; in physics, a rule about how any two bodies pull each other, with
  the pull growing with their matter and falling with the square of the gap between them.
examples:
- Newton's law of gravitation tells us why the Moon stays near the Earth.
- He used Newton's law of gravitation to work out the pull of the Sun.
