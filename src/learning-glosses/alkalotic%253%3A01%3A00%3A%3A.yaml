simpleMeaning: showing the signs of a state in which the blood has too little acid, or likely to move
  toward that state
scope: Of a person or a state of the body with too little acid in the blood, not of one with too much
  acid, and not of a body in a normal state.
examples:
- The blood test showed he was alkalotic after days of hard breathing.
- Her breathing made her alkalotic, and the nurse watched her closely.
