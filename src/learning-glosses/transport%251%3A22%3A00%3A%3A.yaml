simpleMeaning: the passing of molecules, along with their energy and momentum, across the boundary between
  neighbouring layers of a fluid or across a cell membrane.
scope: This is a process in physics and biology, not a vehicle or system for carrying people or goods.
examples:
- The transport of molecules across the cell membrane requires energy.
- The rate of transport across the membrane depends on temperature.
