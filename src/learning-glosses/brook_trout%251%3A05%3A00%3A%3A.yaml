simpleMeaning: a fish that lives in fresh water in North America and has been brought to live in Europe
  too
scope: A fish of fresh water from North America, now also found in Europe; not a sea fish and not a fish
  that lives only in Europe.
examples:
- He caught a brook trout in the cold stream.
- Brook trout were first brought to Europe from North America.
