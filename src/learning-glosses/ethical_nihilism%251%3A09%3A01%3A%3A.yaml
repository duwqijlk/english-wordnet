simpleMeaning: In thinking about right and wrong, the view that nothing is good or bad in itself
scope: In thinking about right and wrong, the view that nothing is good or bad in itself; moral nihilism
  is another name for this sense, not a belief that all acts are wrong and not a refusal to think about
  right and wrong.
examples:
- Ethical nihilism holds that no act is good or bad in itself.
- The speaker's ethical nihilism shocked the class.
