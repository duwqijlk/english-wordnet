simpleMeaning: Grown by Native Americans as an important food, this is a vine of North America with sweet-smelling
  flowers and swollen roots that can be eaten.
scope: Also called groundnut, groundnut vine, and potato bean, this vine of North America has sweet-smelling
  flowers and swollen roots that can be eaten and is grown by Native Americans as an important food.
examples:
- Wild bean grew in North America.
- Native Americans grew wild bean as food.
