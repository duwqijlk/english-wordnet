simpleMeaning: In Costa Rica, a climbing plant with a few hook-like spines bears large lilac-blue flowers.
scope: 'Also called the giant potato creeper: a vine of Costa Rica with hook-like spines and large lilac-blue
  flowers, not the potato vine of Brazil with white flowers tinged with blue.'
examples:
- The potato vine climbed the fence, its lilac-blue flowers opening in the sun.
- We planted a potato vine in the garden for its large lilac-blue flowers.
