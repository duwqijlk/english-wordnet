simpleMeaning: a substance in some make-up that blocks the tiny holes in the skin
scope: This is a substance in some make-up that blocks holes in the skin; pore clogging ingredient is
  another name for this sense, and it is not a make-up that cleans the skin.
examples:
- This cream has a comedogenic ingredient that blocks her pores.
- She checks labels for any comedogenic ingredient before she buys face cream.
