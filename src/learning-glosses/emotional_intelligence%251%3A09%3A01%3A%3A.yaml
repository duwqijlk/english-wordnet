simpleMeaning: Using what feelings show to guide thought and acts calls for watching feelings in oneself
  and in other people, telling feelings apart and naming them right.
scope: It is the skill of watching feelings in oneself and in other people and using what they show to
  guide thought and acts.
examples:
- Good emotional intelligence means telling feelings apart and naming them right.
- Emotional intelligence helps a person use what feelings show to guide thought.
