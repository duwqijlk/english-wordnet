simpleMeaning: In Gnosticism, a holy power or being that comes from the highest God and takes many parts
  in running the world
scope: A holy power in Gnosticism that comes from the highest God, not an angel and not a very long time.
examples:
- In the old Gnostic books, each eon had its own part to play in the world.
- The teacher said an eon was a power sent out from the highest God.
