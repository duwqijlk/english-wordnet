simpleMeaning: a drug breathed in through the nose or mouth, sold as Virazole, that may be used to fight
  serious infections caused by viruses
scope: A drug breathed in to fight serious virus infections, not a pill and not a drug that kills bacteria.
examples:
- The doctor gave ribavirin to treat the child's serious virus infection.
- Ribavirin is breathed in through a mask.
