simpleMeaning: in what a person or thing truly is; by the true nature of the person or thing
scope: This points to what a person or thing truly is at the deepest level; it does not mean in most parts
  or only in a rough way.
examples:
- Essentially, the two plans are the same.
- He is essentially a kind man, even when he is strict.
