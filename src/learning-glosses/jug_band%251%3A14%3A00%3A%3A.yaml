simpleMeaning: A group of players who make music with pitchers and washboards and kazoos and other everyday
  things used as instruments.
scope: This is a group of players who make music with pitchers, washboards, kazoos and everyday things
  used as instruments, not a brass band and not an orchestra with formal instruments.
examples:
- The jug band played washboards and kazoos at the street fair.
- A jug band opened the show with music made from jugs and washboards.
