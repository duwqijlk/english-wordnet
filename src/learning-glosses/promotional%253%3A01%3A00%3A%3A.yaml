simpleMeaning: used to tell the public about something and draw interest in it
scope: For things made to draw public interest in a product, event, or person; not a move to a higher
  job and not a cut in price for a short time.
examples:
- The airline offered promotional fares for its new flights.
- They sent out promotional letters about the new shop.
