simpleMeaning: Thin, brush-like bunches of blooms top this plant of North America, most often a weed where
  crops are grown.
scope: Also called old witch grass, old witchgrass, tumble grass, and witch grass, this plant of North
  America is most often a weed where crops are grown, not the European grass that spreads by creeping
  roots.
examples:
- On farmed land, witchgrass grows wild in North America.
- In North America, witchgrass bears thin, brush-like bunches of blooms.
