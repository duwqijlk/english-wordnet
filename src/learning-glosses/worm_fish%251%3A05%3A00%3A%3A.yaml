simpleMeaning: a little-known group of small tropical creatures that swim in shallow sea water and are
  kin to gobies, a kind of small sea creature
scope: This is a little-known group of small tropical sea creatures kin to gobies, not a goby itself and
  not a worm.
examples:
- The worm fish hid among the rocks in the shallow water.
- Divers rarely see a worm fish because so little is known about where it lives.
