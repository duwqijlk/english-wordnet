simpleMeaning: A condition a person is born with in which the sex glands do not work and smell is missing,
  so the sex organs do not grow up at puberty
scope: This is a condition present from birth that stops the sex organs from growing up and takes away
  smell, not a sickness caught later in life.
examples:
- Kallman's syndrome runs in some families.
- The doctor told him he had Kallman's syndrome.
