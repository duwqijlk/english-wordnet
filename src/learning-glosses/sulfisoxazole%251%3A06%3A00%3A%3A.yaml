simpleMeaning: a drug that fights germs, sold as Gantrisin, used to treat infections of the tubes that
  carry urine out of the body
scope: A germ-fighting drug, also sold as Gantrisin, for infections of the urinary tract; not a drug for
  chest infections and not a painkiller.
examples:
- The doctor gave him sulfisoxazole for an infection of the urinary tract.
- Sulfisoxazole, sold as Gantrisin, helped clear the infection.
