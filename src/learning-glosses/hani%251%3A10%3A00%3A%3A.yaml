simpleMeaning: A Loloish tongue spoken in south Yunnan, in Jingdong and Jinggu counties, the Yuanjiang
  and Lancang (Mekong) river basins, and the Ailao mountains.
scope: A language of south Yunnan, also called the Hani language, Akha, and the Akha language; not a dialect
  of Chinese and not the people who speak it.
examples:
- Hani is spoken in the Ailao mountains.
- She learned Hani from her grandmother in Jingdong.
