simpleMeaning: one of a group of mostly small sea animals of the blenny kind, living on coral reefs and
  in beds of sea grass
scope: One of a group of mostly small sea animals of the blenny kind, living on coral reefs and in beds
  of sea grass; clinid is another name for this sense, not an eel and not any other small fish of the
  reef.
examples:
- The clinid fish darted between the corals.
- A clinid fish is a small reef dweller.
