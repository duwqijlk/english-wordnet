simpleMeaning: a fungus that destroys the seeds of wheat by replacing them with greasy lumps of bad-smelling
  spores
scope: This is the fungus itself that harms wheat, not the disease it causes in wheat, not a light hit
  in baseball, and not a push or shove.
examples:
- Bunt destroyed much of this year's wheat crop.
- The farmer found bunt growing in the wheat seeds.
