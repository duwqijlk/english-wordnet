simpleMeaning: A sticky material that sets hard when heated, used most of all for strong sticking, covering,
  and layered sheets.
scope: A hard-setting sticky material used for strong joins and coats, also called epoxy and epoxy resin;
  not a weak paste and not a plain paint.
examples:
- She fixed the broken handle with epoxy glue and held it until it set.
- The epoxy glue bonded the two boards so well that they would not come apart.
