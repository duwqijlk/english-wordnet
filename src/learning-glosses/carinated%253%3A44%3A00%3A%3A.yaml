simpleMeaning: Having a raised line, or shaped like a raised line, or like the keel of a ship.
scope: A raised line, or a shape like a raised line or like the keel of a ship, also called ridged, keeled
  or carinate, not a flat shape and not a cup shape.
examples:
- The carinated sepal has a raised line down its back.
- A carinated leaf looks keeled.
