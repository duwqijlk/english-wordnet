simpleMeaning: Often out in the country and in big groups, these fighters without a fixed army hit by
  wrecking things and wearing the foe down.
scope: Also called a guerrilla force, this is a band of fighters without a fixed army that hits by wrecking
  things and wearing the foe down, often out in the country and in big groups.
examples:
- The guerilla force struck the bridge.
- Guerilla forces often work in big groups out in the country.
