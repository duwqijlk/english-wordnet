simpleMeaning: In psychology, all the reactions and movements a living creature makes in a given situation.
scope: This is the scientific term for an organism's whole set of reactions; it is not everyday good or
  bad conduct, and not the way a machine responds.
examples:
- The researchers measured the behavior of rats placed in a new cage.
- In psychology, behavior includes every movement and reaction an animal makes.
