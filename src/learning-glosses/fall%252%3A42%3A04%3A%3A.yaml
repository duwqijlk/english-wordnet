simpleMeaning: 'Of light or sound: to reach something and appear to touch it when seen or heard.'
scope: This describes light or sound seeming to touch something; it is not a physical drop, a drop in
  amount, or a defeat.
examples:
- A narrow band of sunlight fell across the kitchen table and seemed to touch the cups.
- The first notes of the song fell on the silent crowd and hushed them.
