simpleMeaning: To sign up on a social media site to receive another person's new posts.
scope: This is the act of signing up to receive another user's posts, not moving behind or after someone,
  not coming later in time or as a result, not being next in a series, not traveling along a route, not
  obeying rules or accepting a leader's guidance, not adopting an idea, policy, or plan, not copying someone
  as a model, not keeping watch on someone, not grasping an explanation, not keeping track of a situation,
  and not the state of already being subscribed to another user's updates.
examples:
- I followed my favorite author on the site so I would see her new posts.
- If you follow that account, its updates will show up in your feed.
