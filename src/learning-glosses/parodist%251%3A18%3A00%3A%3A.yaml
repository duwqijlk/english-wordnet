simpleMeaning: How books and songs are made is what this person copies, to make people laugh
scope: 'Another name for this sense is lampooner: one who copies the way books or songs are made to make
  people laugh, not one who writes a serious book or song.'
examples:
- The parodist copied the poet's style to make the audience laugh.
- As a parodist, she turned the hit song into a joke.
