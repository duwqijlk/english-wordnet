simpleMeaning: A joy to the senses, from something rich and full and in great plenty
scope: Also called lushness, this is a rich and full quality that pleases the senses, not the act of enjoying
  such pleasure and not mere size.
examples:
- The luxuriance of the garden filled the air with sweet scents.
- Visitors admired the luxuriance of the rainforest growth.
