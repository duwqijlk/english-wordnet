simpleMeaning: one of many kinds of small living thing that lives inside the body of an animal, in particular
  a worm in the gut
scope: 'Also called endoparasite, endozoan, entozoan and entozoon: a small living thing that lives inside
  the body of an animal, in particular a worm in the gut, not a small living thing that lives on the skin
  and not a germ that makes an animal ill.'
examples:
- The vet found an entoparasite in the dog's gut.
- An entoparasite can live for months inside its host animal.
