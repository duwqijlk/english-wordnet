senseId: modest%5:00:00:humble:00
synsetId: 01899577-s
simpleMeaning: not proud in mind or in how you act; quiet and gentle, or even so fearful that you do what
  others want
scope: 'Also called mild, and also called meek: not proud and quiet in how you act, even fearful and ready
  to give way; not the sense about dress and sex, and not only having a low view of your own worth.'
examples:
- She gave a modest smile and stepped back, letting others speak first.
- The modest clerk spoke in a soft voice and quickly did what his boss asked.
