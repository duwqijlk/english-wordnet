simpleMeaning: Said in a blurred, unclear way, as though the speaker's tongue were heavy.
scope: This describes unclear speech from a heavy tongue, not a liquid's texture or a solid's measured
  distance.
examples:
- His voice was thick with sleep when he answered the phone.
- Her speech grew thick after the anaesthetic.
