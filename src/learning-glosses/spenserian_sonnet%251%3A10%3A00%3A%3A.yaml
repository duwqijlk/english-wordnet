simpleMeaning: A 14-line poem made of three groups of four lines and a final pair, in a five-beat weak-strong
  rhythm, with the rhyme pattern abab bcbd cdcd ee.
scope: A 14-line poem, not the Shakespearean kind with its own rhyme pattern and not the Petrarchan kind.
examples:
- The Spenserian sonnet links its groups with shared rhymes.
- Her Spenserian sonnet used the abab bcbd cdcd ee rhyme pattern.
