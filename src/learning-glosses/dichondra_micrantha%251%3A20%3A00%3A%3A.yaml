simpleMeaning: A creeping plant that lives for years, with hairy stems and round to kidney-shaped leaves
  and small white to greenish flowers; used in place of grass in warm lands.
scope: A creeping plant with hairy stems and round to kidney-shaped leaves, also called dichondra; not
  a lawn grass.
examples:
- The Dichondra micrantha spread into a soft green mat in the warm garden.
- Gardeners plant Dichondra micrantha where grass will not grow.
