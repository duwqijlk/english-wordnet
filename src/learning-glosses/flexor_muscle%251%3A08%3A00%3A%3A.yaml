simpleMeaning: a part of the body that joins to bones and, when it pulls tight, bends the place where
  two bones meet
scope: 'Also called a flexor: a part of the body that pulls tight to bend a joint, not a part that makes
  a joint straight and not the rope-like part that joins a muscle to a bone.'
examples:
- The flexor muscle in her arm bent her elbow.
- He tore a flexor muscle in his leg and could not bend his knee.
