simpleMeaning: the fruit of a wild cherry tree
scope: The fruit itself; not the wild cherry tree it grows on, which is the other sense of the same word,
  and not a sweet cherry grown for eating.
examples:
- Birds ate the ripe chokecherries from the tree in our yard.
- She made jam from chokecherries she picked by the river.
