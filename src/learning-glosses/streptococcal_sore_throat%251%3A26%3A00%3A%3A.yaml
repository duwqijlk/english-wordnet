simpleMeaning: an illness in which germs infect the back of the mouth and the small glands there
scope: 'Also called strep throat, streptococcus tonsilitis, septic sore throat, or a throat infection:
  an illness caused by germs in the back of the mouth, not a cold and not a cough with no germs.'
examples:
- Streptococcal sore throat kept him home from school for a week.
- The nurse checked her for streptococcal sore throat after she complained of pain.
