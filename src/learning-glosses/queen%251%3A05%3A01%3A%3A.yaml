senseId: 'queen%1:05:01::'
synsetId: 02315660-n
simpleMeaning: The only female in a colony of social insects, such as bees, ants, or termites, that can
  produce young; her role is to lay eggs.
scope: This is the insect, not a female ruler, not a playing card, and not a chess piece.
examples:
- The queen bee lays thousands of eggs in her lifetime.
- Each ant colony has a single queen.
