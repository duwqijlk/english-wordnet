senseId: 'aftertaste%1:09:00::'
synsetId: 05945018-n
simpleMeaning: a taste that stays in your mouth after you finish eating or drinking something
scope: A taste that is left after food or drink is gone; not a smell that stays, and not a picture that
  stays in your mind.
examples:
- The garlic left a strong aftertaste in my mouth.
- This medicine has a bitter aftertaste, so she drank some water.
