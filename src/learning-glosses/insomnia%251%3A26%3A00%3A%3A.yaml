simpleMeaning: not being able to sleep, and this problem lasts for a long time
scope: This is a long-lasting problem of not being able to sleep, not one night of poor sleep.
examples:
- She has had insomnia for months and lies awake most nights.
- His insomnia made it hard for him to sleep even when he was very tired.
