simpleMeaning: On her 12th birthday, a Jewish girl takes up her duties as a grown member of the faith
  in this rite of Judaism.
scope: This rite, also called a bat mitzvah and a bath mitzvah, brings a Jewish girl into her religious
  duties at twelve.
examples:
- Her bas mitzvah was held on her 12th birthday.
- The family held a bas mitzvah for their daughter.
