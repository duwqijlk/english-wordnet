simpleMeaning: a thin, long part that holds up a plant or a fungus (a living thing like a mushroom), or
  holds up a part of a plant
scope: 'Also called stalk: the thin part that holds up a plant, not a turn in skiing and not the tube
  of a pipe.'
examples:
- The rose has small sharp points on its stem.
- Cut the stem and put the flower in water.
