simpleMeaning: how fast a piece of music goes, counted by the number of beats in one minute
scope: 'Also called beats per minute and metronome marking: the speed of music counted by beats in a minute,
  not the loudness of the music and not the pitch of a note.'
examples:
- The song has a bpm of 120.
- The DJ chose a track with a fast bpm for the dance floor.
