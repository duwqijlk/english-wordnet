senseId: barmy%5:00:00:insane:00
synsetId: 02082059-s
simpleMeaning: In informal or slang talk, describes a person whose mind does not work in a normal way
scope: Also called cracked, nuts, buggy, bats, crackers, daft, nutty, dotty, loopy, fruity, balmy, batty,
  wacky, bonkers, haywire, loony, loco and kooky, this informal word is for a mind not working in a normal
  way, not for enjoying life with spirit.
examples:
- He went a bit barmy after weeks with no sleep.
- You must be barmy to swim in that cold river!
