simpleMeaning: not needing something any more, especially, for mammals, not needing mother's milk any
  more
scope: About a young animal that no longer needs its mother's milk, or about someone who no longer needs
  something, not about a baby that still drinks milk.
examples:
- The weaned puppies now eat solid food on their own.
- The just-weaned calf cried for its mother.
