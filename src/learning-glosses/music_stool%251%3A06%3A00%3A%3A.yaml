simpleMeaning: Often raised or lowered, this small seat with no back is made for a person who plays the
  piano
scope: 'Also called a piano stool: a small seat with no back made for a person who plays the piano, not
  a chair with a back and not a seat for a singer.'
examples:
- She sat on the music stool and set it to the right height before she played.
- The music stool by the piano can be raised so a tall player can sit at ease.
