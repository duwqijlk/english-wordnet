scope: Dirty air from tiny bits of black soot, such as bits from power plants or diesel engines; not dirty
  water, and not dirty air from gases.
examples:
- The small-particle pollution over the city was worst near the power plant.
- Doctors warned that small-particle pollution from diesel engines can harm the lungs.
