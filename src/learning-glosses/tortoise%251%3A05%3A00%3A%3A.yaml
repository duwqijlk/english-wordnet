simpleMeaning: a land turtle that usually eats plants, with thick legs like an elephant's and claws, found
  in dry places all over the world except Australia and Antarctica
scope: A plant-eating land turtle with thick, clawed legs, found in dry places; not a sea turtle and not
  a freshwater turtle.
examples:
- The tortoise moved slowly across the dry sand.
- A tortoise can live for many years in the desert.
