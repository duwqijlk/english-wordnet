simpleMeaning: a small hollow in a wall for a jar holding the ashes of a dead person who was burned after
  death
scope: A small hollow for a jar holding the ashes of a dead person who was cremated; columbarium is another
  name for this sense, not the place where bodies are burned, and not a grave in the ground.
examples:
- The cinerarium held the urn with her grandmother's ashes.
- A small cinerarium was cut into the stone wall.
