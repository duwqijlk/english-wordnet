simpleMeaning: One of six accepted ways of thinking about what is real and how to be free from karma,
  from a Sanskrit word that means to see.
scope: One of six accepted systems of thought, set apart from the other five by its roots in the Sanskrit
  word for seeing and its view of release from karma.
examples:
- In class we read about Darsana and the five other orthodox systems.
- Darsana teaches that seeing what is real frees one from karma.
