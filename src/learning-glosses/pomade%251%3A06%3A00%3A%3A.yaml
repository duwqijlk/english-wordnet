simpleMeaning: a sweet-smelling oil or thick, soft stuff that people put on their hair
scope: The oil or thick, soft stuff itself that people put on hair, not the act of putting it on hair.
examples:
- He smoothed pomade through his hair before the party.
- A small tin of pomade sat by the mirror.
