simpleMeaning: a hard outer layer, fairly stiff, that guards an animal or plant
scope: 'Also called armor: a hard outer covering on an animal or plant, not metal gear worn in battle
  and not a unit of fighting vehicles.'
examples:
- The armour of the armadillo guards it from attack.
- A turtle's armour is a hard shell over its back.
