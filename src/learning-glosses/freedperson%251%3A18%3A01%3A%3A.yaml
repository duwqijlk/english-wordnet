simpleMeaning: A person who was once held as a slave and has been set free
scope: This is a person once held as a slave and now set free, not a person still held as a slave and
  not someone who freed others.
examples:
- The freedperson bought land and built a house.
- After the war, many freedpersons found work in the towns.
