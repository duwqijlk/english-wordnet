simpleMeaning: a small round cactus with no spines, whose dried tops are taken as a drug
scope: A small round cactus with no spines, whose dried tops are taken as a drug; peyote and mezcal are
  other names for this sense, not the Mexican liquor of the same name.
examples:
- Mescal grows low and round, a spineless cactus of the desert.
- The dried tops of the mescal are taken as a drug.
