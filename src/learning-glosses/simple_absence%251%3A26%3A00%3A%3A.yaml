simpleMeaning: a time when a person stops noticing what goes on around them, with no other problems, and
  the brain gives off wave spikes three times a second
scope: A time when a person stops noticing what goes on around them, with no other problems, and the brain
  gives off wave spikes three times a second, also called pure absence; not a loss of awareness with shaking
  limbs and not a long loss of awareness.
examples:
- The child had a simple absence and stared blankly for a few seconds.
- A simple absence left her unaware of what was said.
