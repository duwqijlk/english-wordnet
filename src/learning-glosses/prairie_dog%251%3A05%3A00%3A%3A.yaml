simpleMeaning: Any of a group of gnawing animals of the grasslands of North America that live in big tangled
  sets of holes and cry like a barking animal
scope: This is any of a group of gnawing animals of the grasslands of North America that live in big tangled
  sets of holes and cry like a barking animal; prairie marmot is another name for it, not a ground squirrel
  and not a pet.
examples:
- The prairie dog stood up outside its hole.
- Prairie dogs cry with a barking sound.
