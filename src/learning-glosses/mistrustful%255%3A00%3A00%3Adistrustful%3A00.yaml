simpleMeaning: openly showing that you do not trust people, and not willing to tell them your private
  thoughts
scope: 'Also called suspicious, wary, leery and untrusting: openly not trusting a person and not sharing
  private thoughts with them, not just being careful for a short time.'
examples:
- He gave me a mistrustful look and said nothing about his plans.
- She was mistrustful of the new worker and kept her papers locked away.
