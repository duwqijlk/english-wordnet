simpleMeaning: The thicker of the two bones in a person's lower leg, on the inner side, between the knee
  and the ankle.
scope: Also called the shin or the tibia, the thicker of the two bones in a person's lower leg, on the
  inner side.
examples:
- He broke his shinbone in the fall.
- A sharp pain shot up her shinbone when she kicked the post.
