simpleMeaning: Flowing into the vein at the base of the brain, this vein runs beside the artery at the
  front of the brain
scope: This is also called vena cerebri anterior, and it belongs at the front of the brain, not at the
  back.
examples:
- Beside the artery at the front of the brain ran the anterior cerebral vein.
- The anterior cerebral vein emptied into the vein at the base of the brain.
