simpleMeaning: a clever trick that deceives the eye and seems impossible to people who do not know how
  it is done.
scope: This is the performed illusion, not the supposed supernatural force or the adjective describing
  such a force.
examples:
- The audience gasped at the magic he performed with coins and cards.
- She performed a simple piece of magic with three cups and a ball.
