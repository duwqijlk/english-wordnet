simpleMeaning: a long strip of cloth or paper used to make a place look nice or to tell people about goods
  for sale
scope: A long strip of cloth or paper used to make a place look nice or to tell people about goods for
  sale, also called a banner; not a beam of light and not a flag on a pole.
examples:
- Bright streamers hung across the street for the fair.
- The shop put a streamer in the window to show its sale.
