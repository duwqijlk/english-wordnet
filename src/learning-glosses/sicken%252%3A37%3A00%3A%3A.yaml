simpleMeaning: to make someone feel strong dislike for something and feel that it is bad and wrong
scope: 'Also called disgust, revolt, and nauseate: making a person feel a thing is bad and wrong, not
  making a person ill in the body.'
examples:
- The cruel pictures sickened everyone who saw them.
- His lies sickened her, and she left the room at once.
