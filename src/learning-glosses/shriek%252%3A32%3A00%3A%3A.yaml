simpleMeaning: to make a high, sharp cry
scope: Also called pipe. This is the act of making a high, sharp cry; it is not the cry itself and not
  a very high sound made by a thing.
examples:
- She shrieked when the cold water hit her.
- The children shrieked with laughter on the ride.
