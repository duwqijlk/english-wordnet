simpleMeaning: cooking food in hot liquid that is kept just below the point where it boils hard
scope: This sense is only about cooking food in hot liquid that is just below boiling; it is not about
  cooking with dry heat or with fat.
examples:
- Poaching is a gentle way to cook eggs in hot water.
- She used poaching to cook the fish in hot water.
