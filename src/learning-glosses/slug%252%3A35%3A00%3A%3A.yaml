simpleMeaning: To hit a thing or person hard, especially with the fist or a bat.
scope: This is hitting hard with the fist or a bat, also called a swig, not a unit of mass, nor the soft
  animal, nor a drink of liquor, nor the boxing blow.
examples:
- He slugged me so hard that I passed out.
- She slugged the ball over the fence.
