simpleMeaning: To give out something only in small amounts.
scope: To give out something only in small amounts, also called scant and stint, not to live on very little
  money, and not to work in a hasty, careless way.
examples:
- The cook told them not to skimp on the butter.
- Do not skimp on the paint, or the wall will show through.
