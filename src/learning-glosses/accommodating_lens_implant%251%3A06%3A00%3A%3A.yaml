simpleMeaning: with a hinge that lets it focus both near and far, a man-made clear disc set inside the
  eye copies the natural disc of a young eye
scope: With a hinge that lets it focus both near and far, it is a man-made clear disc set inside the eye,
  not a fixed disc that focuses at one distance only.
examples:
- Her accommodating lens implant lets her read and drive without glasses.
- The accommodating lens implant moved on its hinge as she looked from near to far.
