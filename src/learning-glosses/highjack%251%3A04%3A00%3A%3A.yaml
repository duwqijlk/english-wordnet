simpleMeaning: the taking of a moving vehicle by force, to steal from it or to send it to a different
  place
scope: This is the forceful taking of a vehicle in transit; hijack is another name for this sense, not
  stealing a parked car and not a lawful seizure.
examples:
- The highjack of the truck left the driver shaken but unhurt.
- Police feared a highjack might divert the train to another city.
