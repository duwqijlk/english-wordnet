simpleMeaning: the part of a person that thinks, feels and is aware, and that makes reasoned decisions.
scope: It is not a person's opinion, and it is not the brain as a physical organ.
examples:
- She has a sharp mind and learns quickly.
- Reading poetry keeps his mind active.
