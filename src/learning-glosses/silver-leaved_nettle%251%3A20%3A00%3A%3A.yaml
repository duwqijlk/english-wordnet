simpleMeaning: A weedy nightshade with silver leaves and violet, blue, or white blooms, its roundish berry
  used far and wide to curdle milk, from the middle United States to South America.
scope: This sense is also called prairie berry, purple nightshade, silver-leaved nightshade, silverleaf
  nightshade, trompillo, and white horse nettle.
examples:
- A silver-leaved nettle grew by the fence.
- Silver-leaved nettles bear roundish berries.
