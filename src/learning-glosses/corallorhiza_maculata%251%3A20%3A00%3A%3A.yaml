senseId: 'corallorhiza_maculata%1:20:00::'
synsetId: 12074159-n
simpleMeaning: A common coral root with leafless stems in yellow-brown, red-brown, or purple-brown, bearing
  loose bunches of same-coloured flowers, with white lips spotted purple; it grows from Guatemala to Canada.
scope: Not other coral roots, nor other leafless plants with spotted flowers; also called spotted coral
  root.
examples:
- Corallorhiza maculata grows in the woods.
- The flowers of Corallorhiza maculata have spotted lips.
