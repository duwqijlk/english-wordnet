senseId: 'obscure%2:30:03::'
synsetId: 00588561-v
simpleMeaning: to make a vowel sound weak and short, so it becomes a neutral sound such as a schwa (the
  weak 'uh' sound)
scope: In word sounds, to make a vowel sound weak and neutral, not to hide something and not to make an
  idea hard to see clearly.
examples:
- When she speaks fast, she obscures the first vowel so it sounds weak and short.
- In this word, the middle vowel is obscured and said as a schwa.
