simpleMeaning: A tree from hot parts of Asia, with sweet-smelling yellow-brown bark, that is the source
  of a spice made from its bark
scope: This is the tree itself, not the spice made from its bark.
examples:
- Cinnamon trees grow in the hot, wet parts of Asia.
- Farmers strip the bark from cinnamon trees to make the spice.
