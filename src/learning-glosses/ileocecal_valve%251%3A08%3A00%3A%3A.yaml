senseId: 'ileocecal_valve%1:08:00::'
synsetId: 05544271-n
simpleMeaning: A valve between the ileum of the small intestine and the cecum of the large intestine,
  stopping material flowing back into the small intestine.
scope: It is the flap at the meeting of the small gut and the large gut, which stops what is inside flowing
  back.
examples:
- The ileocecal valve kept the contents of the large gut from flowing back.
- Food passes through the ileocecal valve into the large intestine.
