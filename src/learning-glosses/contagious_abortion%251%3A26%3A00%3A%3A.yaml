simpleMeaning: A catching sickness of animals kept by people that often makes them lose their young before
  birth, and that people can catch too
scope: A catching sickness of animals kept by people that often makes them lose their young, also called
  brucellosis, not a sickness that stays in one animal and not a birth defect.
examples:
- Contagious abortion spread through the herd that spring.
- Farmers guard against contagious abortion in their cattle.
