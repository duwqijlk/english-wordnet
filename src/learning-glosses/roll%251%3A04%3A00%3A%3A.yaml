simpleMeaning: a flying move in which an aircraft turns around its long axis while keeping its course
  and height
scope: This sense is an aircraft maneuver, not the general spinning of an object or the sound of a drum.
examples:
- The pilot performed a slow roll over the runway.
- The plane did a roll to show off its agility.
