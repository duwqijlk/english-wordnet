simpleMeaning: A mineral that splits into thin sheets, clear or pale brown in colour, and holding sodium,
  a soft metal
scope: A clear or pale brown mineral that splits into thin sheets, not a dark mica and not a stone that
  will not split.
examples:
- The paragonite split into thin clear sheets.
- A sample of paragonite showed a pale brown colour.
