simpleMeaning: one of several kinds of sharp-toothed animals that live on land and dig in the ground in
  the Old World and New World; they often harm crops
scope: Also called ground squirrel and spermophile. This is a digger that lives on land in many parts
  of the world, not the cheek-pouch kind, the land tortoise, or a very eager person.
examples:
- A gopher dug holes all over the field and ate the young crops.
- Gophers often harm crops, so the farmer put a fence deep in the ground.
