simpleMeaning: a long loose robe worn by teachers at a college or by judges in court
scope: This is a long loose robe worn by college teachers or judges; academic robe and judge's robe are
  other names for this sense, not a dress for a party and not a coat for cold weather.
examples:
- The professor wore his academic gown at the graduation.
- The judge put on her academic gown before the hearing.
