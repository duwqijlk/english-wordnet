simpleMeaning: In a network, a ring of parts joined one after another, with the last part joined back
  to the first
scope: A ring-shaped network, not a wire circuit and not a computer program.
examples:
- The computers were joined in a loop so each could talk to the next.
- In a loop network, the last machine links back to the first.
