simpleMeaning: A movement of Jews around the world that began late in the 1800s, aiming to build a Jewish
  state in Palestine.
scope: Also called the Zionist movement; a movement of Jews around the world that began late in the 1800s
  to build a Jewish state in Palestine, not a policy for setting up a national home for Jews in Palestine.
examples:
- Zionism arose late in the 19th century.
- Zionism aimed to create a Jewish state in Palestine.
