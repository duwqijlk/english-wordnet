simpleMeaning: of or like a thing whose tiny seeds are made by special cells called basidia
scope: Of or like a thing that makes its seeds this way, not of a thing that makes seeds in another way
  and not of the seeds themselves.
examples:
- The basidiosporous cap shed its seeds onto the paper below.
- Under the lens, the basidiosporous growth showed seeds on special cells.
