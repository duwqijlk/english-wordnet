simpleMeaning: the link between basic ideas or rules, forces, or other things that work against each other
scope: The link between opposing ideas, forces, or things, not a shown feeling of strong dislike and hate,
  and not one thing in the body stopping another thing from working.
examples:
- The story shows the antagonism between freedom and control.
- 'There is a natural antagonism between these two forces: one pushes up and the other pulls down.'
