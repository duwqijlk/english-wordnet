senseId: 'relieve%2:29:02::'
synsetId: 00082316-v
simpleMeaning: to make a bad thing, such as an illness, less strong or make it go away
scope: This sense is about making a bad thing, such as an illness, less strong or gone. It is not easing
  pain in the body, not calming a feeling, and not freeing a person from a rule or duty.
examples:
- This medicine can relieve his illness.
- The new treatment relieved her long illness.
