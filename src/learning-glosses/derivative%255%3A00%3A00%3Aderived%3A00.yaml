schema: oewn-learning-gloss-v2
senseId: derivative%5:00:00:derived:00
synsetId: 00702031-s
simpleMeaning: coming from another thing or idea, or using a way of working that gets something from another
  thing or idea
scope: This is about coming from another thing or idea, or using a way of working that gets something
  from another thing or idea. It is not a maths result, not a chemical made from another chemical, and
  not a word formed from another word.
examples:
- Her novel has a highly derivative style, copied from older writers.
- The new song sounds derivative because it takes so much from an old tune.
