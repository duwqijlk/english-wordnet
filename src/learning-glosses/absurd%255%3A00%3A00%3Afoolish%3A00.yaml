simpleMeaning: so silly and with so little good sense that people laugh at it
scope: 'Also called ridiculous, ludicrous and idiotic: so silly that people laugh at it, not just strange
  or a little wrong.'
examples:
- His absurd excuse about the dog eating his homework made the whole class laugh.
- It is absurd to call a small cottage a mansion.
