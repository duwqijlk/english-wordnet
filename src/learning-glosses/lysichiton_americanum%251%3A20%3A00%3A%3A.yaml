simpleMeaning: A long-lived swamp plant that grows in a clump and sheds its leaves, from the west of North
  America, like the skunk cabbage but with a yellow flower cover.
scope: 'Also called skunk cabbage: a clump-forming swamp plant of western North America with a yellow
  flower cover, not the other skunk cabbage, which has no yellow flower cover.'
examples:
- Lysichiton americanum grew in thick clumps in the wet marsh.
- We saw Lysichiton americanum in the swamp, its yellow flower covers bright in spring.
