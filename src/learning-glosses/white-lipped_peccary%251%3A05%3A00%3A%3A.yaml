simpleMeaning: A dark pig-like animal with pale cheeks, bigger than the animal with a pale band round
  its neck.
scope: A dark pig-like animal with pale cheeks; not the smaller animal with a pale band round its neck
  and not a true pig.
examples:
- The white-lipped peccary is bigger than its collared cousin.
- We saw a white-lipped peccary with pale cheeks in the forest.
