simpleMeaning: a very loud noise that comes all at once
scope: 'Also called bang, blast, clap and eruption: a very loud noise that comes all at once, not a quiet
  sound or a sound that goes on and on.'
examples:
- A loud bam woke the baby when the heavy door slammed shut.
- Then, with a sudden bam, the firework lit up the sky.
