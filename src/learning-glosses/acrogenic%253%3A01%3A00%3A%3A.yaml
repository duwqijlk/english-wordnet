simpleMeaning: growth only at the tip of the main stem marks flowerless plants, such as ferns or mosses
scope: Acrogenous is another name for this word, which marks flowerless plants, such as ferns or mosses,
  and not plants that put out growth along the stem.
examples:
- The acrogenic fern grows only at the tip of its main stem.
- Acrogenic plants do not flower.
