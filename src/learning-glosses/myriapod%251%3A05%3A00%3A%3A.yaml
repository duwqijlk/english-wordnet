simpleMeaning: Centipedes and millipedes are called by one general word, as is any land creature with
  jointed legs and a long body made of many like parts.
scope: A general word for any land creature with jointed legs and a long body made of many like parts,
  such as centipedes and millipedes.
examples:
- A centipede is a myriapod with a long body of many like parts.
- Millipedes and centipedes are myriapods that live on land.
