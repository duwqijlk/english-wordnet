simpleMeaning: the family link between a child and his or her father
scope: 'Also called fatherhood: the family link between a father and his child, not the link with a mother
  and not time off work when a child is born.'
examples:
- A blood test proved his paternity of the child.
- The court asked for proof of paternity before it made its order.
