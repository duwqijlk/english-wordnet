simpleMeaning: living things that live on their own or in groups, and that feed and breed in many different
  ways
scope: Living things that live on their own or in groups, and that feed and breed in many different ways;
  also called protistan; not plants, and not animals with backbones.
examples:
- The pond water was full of protists too small to see.
- A protist can live alone or as part of a group.
