simpleMeaning: having hair or wool cut off, in the way it looks when cut with sharp blades made for that
  work
scope: 'Also called shorn: this means hair or wool has been cut off, not fur or wool cut and shaped to
  one even length.'
examples:
- The sheared sheep stood in the field with its wool gone.
- She looked at her sheared head in the mirror, with all her long hair gone.
