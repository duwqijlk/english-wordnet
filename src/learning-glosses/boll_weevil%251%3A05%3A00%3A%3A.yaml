simpleMeaning: A greyish weevil that lays its eggs in the seed pods of cotton plants and so ruins the
  cotton.
scope: This is a greyish weevil that lays its eggs in the seed pods of cotton plants and ruins the cotton,
  not the cotton plant itself and not a weevil that leaves the cotton unharmed.
examples:
- The boll weevil lays its eggs in cotton bolls.
- Boll weevils ruined the cotton crop.
