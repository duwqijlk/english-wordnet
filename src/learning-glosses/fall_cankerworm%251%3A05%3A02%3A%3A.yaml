simpleMeaning: A green or brown caterpillar with white stripes, the young of the Alsophila pometaria moth.
scope: A green or brown caterpillar with white stripes, the young of the Alsophila pometaria moth, not
  an adult moth and not a spring cankerworm.
examples:
- The fall cankerworm chewed the young leaves.
- Fall cankerworms fed on the buds of the apple tree.
