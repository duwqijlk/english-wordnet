simpleMeaning: the way a gun's aim is set for height and side wind, on one range of ground in good light
scope: The way a gun's aim is set for height and side wind, on one range of ground in good light; not
  the aiming device itself and not a shot fired at a target.
examples:
- The soldier checked the sight setting before he fired at the target.
- A wrong sight setting made his shots land too high.
