simpleMeaning: 'This memorial honours people whose bodies are not in it: they are buried somewhere else,
  or they cannot be found'
scope: 'Also called cenotaph: a memorial put up to honour people whose bodies are buried somewhere else
  or cannot be found, not a tomb that holds the body and not a stone that marks where a body lies.'
examples:
- The empty tomb in the square honours soldiers whose bodies were never found.
- They laid flowers at the empty tomb for the sailors buried at sea.
