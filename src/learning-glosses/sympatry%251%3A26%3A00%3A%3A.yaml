simpleMeaning: when living things live in areas that overlap, but do not breed with each other
scope: This is the noun for living things sharing overlapping areas without breeding together, not the
  adjective sympatric and not kinds that breed together.
examples:
- Sympatry lets two kinds of fish share the same lake.
- The birds show sympatry but never breed with each other.
