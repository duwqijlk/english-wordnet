simpleMeaning: A calming drug used to ease worry and lower tension and bad temper.
scope: 'Also called antianxiety drug, anxiolytic, anxiolytic drug, minor tranquilliser, and minor tranquillizer:
  a calming drug used to ease worry and lower tension and bad temper, not a sleeping pill and not a strong
  drug for serious mental illness.'
examples:
- The doctor gave her a minor tranquilizer for the flight.
- A minor tranquilizer eased his worry before the exam.
