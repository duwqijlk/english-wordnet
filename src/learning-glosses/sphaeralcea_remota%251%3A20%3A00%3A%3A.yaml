scope: Also called wild hollyhock and Iliamna remota; a rare mallow found only in Illinois, like the common
  hollyhock, with pale pink-purple flowers, not the common hollyhock itself.
examples:
- Sphaeralcea remota grows only in a few places in Illinois.
- The pale flowers of Sphaeralcea remota look like small hollyhocks.
