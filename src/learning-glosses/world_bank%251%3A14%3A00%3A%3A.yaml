simpleMeaning: A body of the United Nations set up to help growing countries with loans backed by its
  member states
scope: 'Also called the IBRD or the International Bank for Reconstruction and Development: a body of the
  United Nations that helps growing countries with loans backed by its member states, not a bank for ordinary
  savers and not the International Monetary Fund.'
examples:
- The World Bank lends money to growing countries.
- The World Bank backs its loans with the promise of member governments.
