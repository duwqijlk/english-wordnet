simpleMeaning: In astronomy, any small solid body from space that strikes the earth's air.
scope: In astronomy, any small solid body from space that strikes the earth's air, also called a meteor;
  not a star and not a comet.
examples:
- A meteoroid burned up as it hit the earth's air.
- The class watched a film about a meteoroid striking the earth's air.
