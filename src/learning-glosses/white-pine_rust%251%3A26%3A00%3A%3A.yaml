simpleMeaning: A group of pine diseases caused by Cronartium rust fungi that invade and destroy bark and
  sapwood, erupting as blisters on the surface.
scope: This is the pine disease itself, with ruined bark and wood and blisters on the trunk, not the fungus
  that causes it; 'white pine blister rust' is another name for the same disease.
examples:
- White-pine rust spread through the stand within a few years.
- Foresters fell infected trees to slow white-pine rust.
