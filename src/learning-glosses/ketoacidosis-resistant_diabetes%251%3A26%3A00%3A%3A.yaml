simpleMeaning: A mild high-blood-sugar condition that develops slowly in adults; obesity, stress, menopause
  or other factors can trigger it; blood-sugar-lowering drugs (hypoglycemic agents) and diet usually control
  it without insulin.
scope: This is an older name for type 2 diabetes, so called because dangerous acids do not build up; it
  is not type 1 diabetes, which always needs insulin, nor diabetes limited to pregnancy.
examples:
- Her ketoacidosis-resistant diabetes was managed with tablets and a careful diet.
- He lived for years with ketoacidosis-resistant diabetes and never needed insulin injections.
