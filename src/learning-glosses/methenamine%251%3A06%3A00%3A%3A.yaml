simpleMeaning: a germ-fighting drug sold as Mandelamine or Urex, found in many medicines that treat infections
  of the urinary tract
scope: A germ-fighting drug for urinary infections; not a drug for allergies and not a muscle relaxant.
examples:
- The doctor prescribed methenamine for her urinary infection.
- Methenamine is in the medicine he takes for his bladder infection.
