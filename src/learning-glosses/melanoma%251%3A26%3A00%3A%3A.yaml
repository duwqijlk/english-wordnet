simpleMeaning: one of several kinds of cancer, usually on the skin, made of melanocytes (cells that make
  the dark colour in skin)
scope: A kind of cancer, usually on the skin, made of cells that make dark colour in skin. It is not a
  harmless skin spot, and it is not a cancer of another part of the body.
examples:
- The doctor found a melanoma on his back and removed it at once.
- A dark spot on her arm turned out to be a melanoma.
