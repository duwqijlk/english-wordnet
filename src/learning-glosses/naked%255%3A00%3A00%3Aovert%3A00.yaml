simpleMeaning: having nothing added, nothing made less, and nothing hidden; plain and pure
scope: 'Also called raw: shown plainly with nothing hidden or made less, not about the eye or ear working
  without a tool, and not about a body without clothes.'
examples:
- His naked ambition to be leader was clear to everyone.
- She spoke with naked honesty and hid nothing from us.
