simpleMeaning: wood, or wood cut into boards, that comes from some kinds of trees that give a sticky substance,
  especially from the sweet kind of those trees
scope: This is wood from those trees, not the trees themselves, not the sticky substance from a plant,
  and not the soft pink part around the teeth.
examples:
- The cabinet was made of gum, a warm brown wood.
- Workers cut the gum into boards for the house.
