simpleMeaning: People or goods ride in carriers hung from wires held up by a row of towers.
scope: Also called tram, aerial tramway, ropeway, and tramway, this is a line of cars hung from wires
  on tall posts, not a rail line on the ground.
examples:
- The cable tramway carried us in a car hung from wires.
- Workers fixed a cable tramway line after one of the wires broke.
