simpleMeaning: a deal between two or more people to put their skill and money together and share the gains
  and the losses
scope: A deal between two or more people to work together and share gains and losses, not a marriage and
  not a loose working friendship.
examples:
- They formed a partnership to open the shop together.
- The partnership shared the year's profits equally.
