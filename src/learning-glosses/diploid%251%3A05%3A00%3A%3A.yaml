simpleMeaning: In genetics, a cell or living thing with the normal amount of DNA in each cell, in two
  sets of thread-like parts holding a body's plan, twice the single set
scope: In genetics, a cell with two full sets of body-plan threads, not a cell with one set and not a
  cell with extra sets.
examples:
- A diploid cell holds two sets of chromosomes.
- Most body cells are diploid, with twice the single set.
