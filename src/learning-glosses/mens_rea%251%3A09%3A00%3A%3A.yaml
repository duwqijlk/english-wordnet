simpleMeaning: Often in murder trials, the question is whether the person who did a wrong act knew it
  broke the law and meant to do it
scope: This is the guilty mind behind a wrong act in law, also called malice aforethought, not the wrong
  act itself and not being found guilty in court.
examples:
- The court had to decide whether mens rea was shown before it could convict him.
- Mens rea was the key question in the murder trial, since the act itself was not in doubt.
