senseId: 'shiver%1:12:00::'
synsetId: 07535351-n
simpleMeaning: a feeling of fear that you almost like
scope: Also called a shudder, a chill, a thrill and a quiver. This is an almost happy feeling of fear,
  not the shaking of the body from cold or fear.
examples:
- He felt a pleasant shiver as he read the scary story late at night.
- A shiver of fear that she almost liked went through her in the dark house.
