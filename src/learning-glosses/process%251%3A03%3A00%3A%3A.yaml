simpleMeaning: a continuing event or situation that can be observed and that slowly changes through a
  series of stages
scope: This sense is not a legal action against someone, and not a growth sticking out from a plant or
  animal.
examples:
- Aging is a slow process that affects every cell in the body.
- The process of turning milk into cheese takes several weeks.
