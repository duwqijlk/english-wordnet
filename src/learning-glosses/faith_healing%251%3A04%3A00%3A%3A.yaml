simpleMeaning: Care that comes from praying and trusting in God.
scope: It is help given to a person through prayer and trust in God, and faith cure is another name for
  this sense, while help from a doctor and prayer on its own, with no help given, are different things.
examples:
- Faith healing drew crowds to the little church.
- He spoke of faith healing as a gift from God.
