simpleMeaning: As part of a monk's dress, it is a long wide piece of wool cloth with a hole for the head,
  worn over the shoulders.
scope: Also called scapulary, it is a long wide piece of wool cloth worn over the shoulders, with a hole
  for the head and no sleeves of its own.
examples:
- The monk's scapular hung down over his shoulders.
- He wore a scapular over his shoulders.
