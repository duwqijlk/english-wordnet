simpleMeaning: One of a group of cactus-like plants whose fleshy, tooth-edged stems carry no leaves and
  whose big blooms stink, often opening in a star shape.
scope: Another name for carrion flower and starfish flower; a cactus-like plant with foul-smelling blooms,
  not a true cactus.
examples:
- The stapelia in the window pot smelled of rotting meat when it bloomed.
- Growers prize the stapelia for its strange star-shaped flowers, not its scent.
