simpleMeaning: A score for how clever a person is, worked out from a test; the score is the person's mind
  age over their real age, times 100.
scope: This is a score for how clever a person is, worked out from a test, the mind age over the real
  age times 100; intelligence quotient and IQ are other names for it; not a test of strength and not a
  school grade.
examples:
- Her I.Q. was measured with a test at school.
- An I.Q. of 100 is taken as the middle score.
