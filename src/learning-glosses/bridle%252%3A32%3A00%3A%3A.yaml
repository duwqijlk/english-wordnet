simpleMeaning: to obey the pull of the reins, as a horse does
scope: A horse's response to the reins, not the headgear itself and not the act of holding back power.
examples:
- The horse bridled when the rider pulled gently on the reins.
- The pony bridled and turned when the rider pulled the reins.
