simpleMeaning: A soft-headed stick strikes a plate of metal, and the plate rings out; that is this instrument.
scope: Also called a gong, this is the instrument in which a soft-headed stick strikes a plate of metal
  and makes it ring out.
examples:
- The stick struck the tam-tam and it rang out.
- One hit on the tam-tam made it ring out.
