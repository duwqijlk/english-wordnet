simpleMeaning: A tiny wingless insect with a special rear appendage that lets it jump almost constantly;
  it lives in soil rich in decaying matter, or on snow or water.
scope: This is the tiny jumping soil insect also called springtail; it is not a wingless parasite such
  as a louse or flea.
examples:
- A collembolan shot across the soil the moment I lifted the fallen leaf.
- The collembolan population was highest in compost full of decaying leaves.
