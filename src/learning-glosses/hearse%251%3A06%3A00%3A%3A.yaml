simpleMeaning: a vehicle that carries a coffin to a church or burial place; horses pulled it in the past,
  but now it is usually a motor car
scope: A vehicle for carrying a coffin to a church or burial place, not an ambulance for living sick people
  and not a car for guests at a funeral.
examples:
- The hearse drove slowly to the cemetery.
- A black hearse waited outside the church.
