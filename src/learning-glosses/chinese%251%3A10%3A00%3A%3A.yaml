simpleMeaning: Any of the Sino-Tibetan tongues spoken in China, thought of as forms of one language because
  they share one picture-based written system, though speakers of one may not follow another.
scope: Not a person from China or the adjective; this is the group of tongues.
examples:
- Chinese has many forms that sound very different.
- Written Chinese uses one set of signs.
