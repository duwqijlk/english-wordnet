simpleMeaning: a large wild ox from Europe with long horns that died out not long ago; it is thought to
  be one of the animals that today's farm cattle came from
scope: 'Also called urus: a large wild ox that has died out, not the European bison that is given the
  same name in another sense.'
examples:
- The last aurochs died hundreds of years ago.
- Farm cattle came in part from the aurochs of Europe.
