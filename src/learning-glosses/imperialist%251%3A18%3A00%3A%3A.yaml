simpleMeaning: a person who believes that a country should take and keep power over other countries and
  their land
scope: A person who holds this belief about a country taking power over other lands, not the word for
  describing such plans or actions.
examples:
- He was an imperialist who thought his country should rule other lands.
- Many imperialists supported taking land in other parts of the world.
