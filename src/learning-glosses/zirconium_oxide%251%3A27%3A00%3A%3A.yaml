simpleMeaning: The linings of hot ovens, covers that keep heat in, rough powders, and shiny coats for
  pots and tiles all use this white stuff made of crystals.
scope: Zirconia and zirconium dioxide are other names for this white stuff made of crystals, used in the
  linings of hot ovens, in covers that keep heat in, in rough powders, and in shiny coats for pots and
  tiles.
examples:
- The potter added zirconium oxide to the glaze.
- The furnace is lined with zirconium oxide to stand the heat.
