simpleMeaning: A place where stone or slate is dug out of the ground, open to the sky.
scope: 'Also called pit: an open place where stone or slate is dug out, not a person hunted or attacked,
  and not the act of digging it out.'
examples:
- The quarry supplied stone for the new bridge.
- They worked in the quarry from dawn to dusk.
