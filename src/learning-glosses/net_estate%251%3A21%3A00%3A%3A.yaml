simpleMeaning: What is left of the whole estate after debts, funeral costs and administration costs are
  paid, to be shared out and still subject to federal and state inheritance taxes.
scope: The estate after debts and expenses are deducted, ready to be distributed and taxed; not the gross
  estate before those deductions.
examples:
- The net estate is what remains after debts and funeral costs are paid.
- Federal and state inheritance taxes apply to the net estate.
