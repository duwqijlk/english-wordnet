simpleMeaning: In Islam, Muslims believe an unseen spirit lives on earth, named in the Koran, and can
  take the shape of a person or an animal to work on people
scope: An unseen spirit of Islamic belief that lives on earth and works on people in human or animal shape,
  not an angel and not a ghost.
examples:
- The story tells of a jinnee who took the shape of an old man.
- In the tale, a jinnee appeared in the form of a horse.
