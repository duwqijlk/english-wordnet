simpleMeaning: A person who goes from place to place selling goods, on the streets or at fairs
scope: A person who goes from place to place selling goods, not a shopkeeper who stays in one shop and
  not a seller with a fixed stall.
examples:
- The packman came down our street with pots and pans to sell.
- In the old days a packman would carry his goods on his back from town to town.
