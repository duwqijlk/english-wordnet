simpleMeaning: A bee strain first bred in Brazil in the 1950s from an aggressive African bee and a honeybee;
  it keeps most African traits and has spread north to Texas.
scope: This sense is the aggressive hybrid bee, not the investment banker who plots to make a takeover
  target less attractive.
examples:
- The killer bee is far more defensive than the common honeybee.
- Killer bees have spread from Brazil into the southern United States.
