simpleMeaning: The seed of the cacao tree; once ground and roasted, it gives chocolate.
scope: This is the seed of the cacao tree, ground and roasted to give chocolate; cacao bean is another
  name for it, not a coffee seed and not chocolate itself.
examples:
- She ground the cocoa bean for the cake.
- Cocoa beans are roasted before they become chocolate.
