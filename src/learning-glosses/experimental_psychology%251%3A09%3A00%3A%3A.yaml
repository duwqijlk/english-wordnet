simpleMeaning: the part of the study of the mind that tests ideas with set trials to learn about how people
  think and feel
scope: 'Also called psychonomics: the part of the study of the mind that uses set tests, not the study
  of the mind by talk alone and not the study of the brain.'
examples:
- She studied experimental psychology to learn how memory works.
- His course in experimental psychology used tests to study how people react to fear.
