simpleMeaning: 'A rust-hued dye made with nitrogen, used above all to test a liquid for acid: it keeps
  its hue in a base and turns blue in an acid.'
scope: 'This dye is used above all as a chemical test for acid: it turns blue in an acid and keeps its
  hue in a base.'
examples:
- Congo red showed the liquid was acid by turning blue.
- In a base, congo red keeps its own hue.
