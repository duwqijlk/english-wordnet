simpleMeaning: One of a British or American group made up mostly of shaven-headed young people; some take
  part in white-supremacist or anti-immigrant activity, so many assume them racist and violent.
scope: A member of a youth subculture, not just any person whose head is bald or shaved.
examples:
- He joined a skinhead group as a teenager.
- Skinheads from several cities attended the concert.
