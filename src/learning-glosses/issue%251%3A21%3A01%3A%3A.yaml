simpleMeaning: goods such as food, clothing, or ammunition that a government gives out
scope: This is the supplied goods themselves, not the act of handing such goods out, not one number in
  a series of publications, and not a question that people are arguing about.
examples:
- The soldiers collected their monthly issue of food and boots from the storehouse.
- The winter issue included coats, boots, and blankets for every family.
