simpleMeaning: strictly keeping to ways of doing things that people know and accept, most of all in religion
  or art
scope: 'Also called formalized or formalised: keeping strictly to known ways of doing things, most of
  all in religion or art, not a free new way of doing things and not a careless way.'
examples:
- The play was highly formalistic in style, with every scene kept to a set pattern.
- Her formalistic way of painting followed the old rules of the school.
