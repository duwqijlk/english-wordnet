simpleMeaning: This part of a computer gives back data newest first, the thing put in last coming out
  before all the rest.
scope: Also called stack and push-down storage, it hands back data newest first, not oldest first.
examples:
- The push-down store gave back the entry put in last.
- In a push-down store, the newest piece of data is the next one out.
