simpleMeaning: a large, rough fern that often grows several feet high; it is basically a weed fern, and
  it grows in many places in the world
scope: This is a large rough fern found in many places, not the fern in the Pteris group kept as a house
  plant and not a part used to stop a car.
examples:
- Tall brake grew along the edge of the field.
- The brake by the path was taller than the children.
