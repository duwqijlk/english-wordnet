simpleMeaning: an advertisement, usually printed on a page or in a small sheet of paper, made to reach
  many people
scope: 'Also called bill, circular, flier, flyer, throwaway and broadsheet: a printed advertisement for
  many people, not the firing of guns from a war ship and not the side of a ship.'
examples:
- He handed out a broadside about the town fair to people in the street.
- The shop put a broadside in every mailbox to tell people about the sale.
