senseId: 'pedestrian_crossing%1:06:00::'
synsetId: 03910302-n
simpleMeaning: A place in a road where people on foot may go across and cars must let them pass; often
  marked, above all with lines that run at a slant.
scope: A marked place for people on foot to go across a road, not a footbridge over the road and not a
  place where cars may turn.
examples:
- The pedestrian crossing near the school has bold white stripes.
- Drivers must stop when people are using the pedestrian crossing.
