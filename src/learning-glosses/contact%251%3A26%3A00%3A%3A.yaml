simpleMeaning: The state of two things touching or being very close together.
scope: It is not a person you know or a way of reaching someone; it is the physical state of touching
  or nearness.
examples:
- Make sure the two surfaces stay in contact.
- The ball was in contact with the ground for only a moment.
