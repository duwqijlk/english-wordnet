simpleMeaning: settled or made certain, or having taken part in the religious ceremony that marks full
  membership of a church.
scope: This is about something made definite or a person who has been through that ceremony, not about
  a long-standing habit or attitude.
examples:
- The hotel sent an email to say the booking was confirmed.
- She was confirmed at the village church when she was thirteen.
