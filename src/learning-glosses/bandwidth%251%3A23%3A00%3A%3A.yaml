simpleMeaning: how fast data can be sent, and the most data that can be sent in one second along a path,
  measured in bits (small pieces of data) per second
scope: This is about how much data can be sent and how fast, not a person's time or power to do things,
  and not the width of a radio band.
examples:
- The video keeps stopping because our bandwidth is too low.
- This connection has enough bandwidth to send large files quickly.
