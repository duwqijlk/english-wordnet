simpleMeaning: The first device that printed messages as text on a paper strip, invented by the man it
  is named for.
scope: This is the first device that printed messages as text on a paper strip, invented by David Edward
  Hughes; not a hand-written message and not a telephone call.
examples:
- The Hughes telegraph printed the message on a paper tape for the clerk to read.
- Museums still show a Hughes telegraph from the 1800s.
