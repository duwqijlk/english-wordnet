simpleMeaning: A device with a flap that sets how fast water runs through a channel
scope: A device with a flap that sets how fast water runs through a channel, also called sluice valve,
  floodgate, head gate, penstock or water gate; not a tap on a pipe and not a dam wall.
examples:
- The sluicegate held back the river until the fields needed water.
- Workers raised the sluicegate to let the canal fill.
