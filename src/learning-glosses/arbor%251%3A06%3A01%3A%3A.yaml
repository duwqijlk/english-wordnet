simpleMeaning: one of several kinds of turning rod that a larger turning part turns around
scope: Also called a spindle, this is a turning rod in a machine, not the garden frame that plants grow
  up.
examples:
- The arbor in the machine holds the large wheel and turns with it.
- He replaced the bent arbor so the cutting tool could turn again.
