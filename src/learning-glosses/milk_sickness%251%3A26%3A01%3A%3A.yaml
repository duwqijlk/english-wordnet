simpleMeaning: An illness of farm animals, above all cattle, poisoned by eating certain kinds of snakeroot.
scope: 'Also called trembles: an illness of farm animals, above all cattle, caused by eating certain kinds
  of snakeroot, not an illness from bad feed and not a fever.'
examples:
- The cows got milk sickness after grazing near the snakeroot.
- Milk sickness struck the herd that summer.
