simpleMeaning: a way of behaving that in general shows no respect for others
scope: 'Also called disrespect: a way of behaving that shows no respect for others. It is not the law
  sense of not obeying a court, and not the inner feeling of looking down on someone.'
examples:
- He spoke to the waiter with open contempt.
- She looked at the mess with contempt and turned away.
