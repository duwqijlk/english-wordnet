simpleMeaning: to take a baby or young animal off its mother's milk a little at a time
scope: To take a baby or young animal off its mother's milk a little at a time, also called to wean; not
  to stop feeding all at once and not to feed with a bottle from birth.
examples:
- She ablactated the baby at three months.
- Farmers ablactate the calves a little at a time.
