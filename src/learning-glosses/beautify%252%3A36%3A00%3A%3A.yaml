senseId: 'beautify%2:36:00::'
synsetId: 01679858-v
simpleMeaning: to make a person or thing look nicer by adding pretty things or colour
scope: Also called grace, decorate, ornament, adorn and embellish. This sense makes a person or thing
  look nicer by adding pretty things or colour. Not just making something more beautiful in any other
  way, and not being beautiful to look at.
examples:
- She beautified the hall by adding flowers and colour to the walls.
- They beautified the garden with lights and pretty stones.
