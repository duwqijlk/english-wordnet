simpleMeaning: The making of seed by moving the fine dust from the male part of one flower to the female
  part of another flower
scope: The making of seed by moving flower dust from one flower to another, not the making of seed within
  one flower and not the scattering of seed.
examples:
- Bees bring about cross-pollination as they move between flowers.
- Cross-pollination gave the orchard a better crop.
