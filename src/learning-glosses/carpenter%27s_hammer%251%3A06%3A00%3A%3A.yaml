simpleMeaning: a tool with a split end for pulling out nails
scope: 'Also called a claw hammer or a clawhammer: a tool with a split end for pulling out nails, not
  a plain hammer with no split end and not a tool for cutting wood.'
examples:
- He used a carpenter's hammer to pull the bent nail from the board.
- The carpenter's hammer has a split end that grips a nail head.
