simpleMeaning: growing farm plants in bands that follow the shape of the land, so the soil is less washed
  away
scope: Growing farm plants in bands that follow the shape of the land; not growing one plant over a whole
  field and not leaving the land bare.
examples:
- Strip cropping keeps the soil from washing away on the hill.
- Farmers use strip cropping on land that slopes.
