simpleMeaning: A chemical liquid used above all to make plant food, explosives and rocket fuel.
scope: A chemical liquid used above all to make plant food, explosives and rocket fuel, with aqua fortis
  as another name for this sense, not a weak acid used in cooking and not the plant food itself.
examples:
- Nitric acid is used to make fertilizers and explosives.
- Handle nitric acid with care; it burns the skin.
