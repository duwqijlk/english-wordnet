simpleMeaning: a dishonest lawyer who urges people hurt in crashes to take others to court
scope: A dishonest lawyer who urges crash victims to sue, not an honest lawyer and not a lawyer who waits
  to be asked.
examples:
- The ambulance chaser rang the crash victim the same day.
- People warned her not to trust the ambulance chaser who knocked on her door.
