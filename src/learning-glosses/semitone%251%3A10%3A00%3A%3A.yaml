simpleMeaning: In music, the gap between two notes that lie next to each other on a keyboard
scope: 'Also called a half step: the gap between two notes next to each other on a keyboard, not a whole
  tone and not a single note.'
examples:
- A semitone is the smallest step on a piano.
- The two notes are a semitone apart.
