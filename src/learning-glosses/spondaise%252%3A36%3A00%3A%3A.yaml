senseId: 'spondaise%2:36:00::'
synsetId: 01707054-v
simpleMeaning: To make a line of verse have two long, heavy beats in each foot
scope: To give verse two long, heavy beats in a foot, also called spondaize; not to shorten a line and
  not to change its words.
examples:
- The poet spondaised the line to slow it down.
- He spondaised the verse for a grave, slow sound.
