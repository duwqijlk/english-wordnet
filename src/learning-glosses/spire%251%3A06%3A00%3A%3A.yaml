simpleMeaning: a tall, pointed tower that stands on top of a building, usually a church or temple, and
  narrows to a point at the top
scope: 'Also called a steeple: a tall pointed tower on top of a building, not a flat roof and not a short
  chimney.'
examples:
- The spire of the church rose above the roofs of the town.
- A tall spire marked the temple from miles away.
