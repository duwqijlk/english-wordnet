simpleMeaning: Of old Chaldea, its people, their tongue, or their way of life.
scope: 'Also called Chaldaean and Chaldee: it is the word for things of old Chaldea, not for one person
  who lived there and not for a wise man skilled in hidden learning.'
examples:
- The Chaldean art of the old city showed the skill of its people.
- She studied the Chaldean tongue spoken long ago in that land.
