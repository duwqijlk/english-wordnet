simpleMeaning: a game for two teams of five players on a court, played against each other, where players
  score points by throwing a ball through a high flat ring
scope: The game itself, played on a court, not the ball used to play the game.
examples:
- They played basketball on the school court every afternoon.
- She scored the last points to win the basketball game.
