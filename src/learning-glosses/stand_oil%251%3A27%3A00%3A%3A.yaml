simpleMeaning: A thick oil comes from heating one of three oils — linseed, tung, or soya — to more than
  300 C.
scope: A thick oil made from linseed, tung, or soya oil by heating; it is not linseed oil, tung oil, or
  soya oil on its own.
examples:
- He opened a can of stand oil.
- She stirred the stand oil before she used it.
