simpleMeaning: a thing that is like another thing in some ways, so the two can be compared
scope: 'Also called analog: a thing that is like another thing in some ways, not the word for a circuit
  or tool whose output grows or falls in line with what is put in.'
examples:
- The old paper map is an analogue of the new map on the screen.
- He looked for a modern analogue to the ancient tool.
