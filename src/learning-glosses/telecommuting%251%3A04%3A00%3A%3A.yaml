simpleMeaning: working from home and staying in touch with the office by phone, fax, or modem
scope: 'Also called teleworking: working at home while in touch with the office, not working in the office
  and not travelling to work.'
examples:
- She does her telecommuting from a small room at home.
- His telecommuting lets him call the office by phone instead of going in.
