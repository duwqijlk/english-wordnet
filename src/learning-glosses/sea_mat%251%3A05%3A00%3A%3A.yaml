simpleMeaning: A water creature that stays attached and lives in dense groups of tiny tube-shaped bodies,
  each edged with tentacles; it grows on stones or seaweed and multiplies by budding.
scope: This is an animal colony, not a woven floor covering or a patch of seaweed.
examples:
- At low tide, the sea mat shows as a lacy crust on the rocks.
- A sea mat had grown across the kelp frond.
