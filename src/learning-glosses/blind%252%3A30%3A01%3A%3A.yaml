simpleMeaning: to make something seem faint or dull, either by outshining it or by hiding it
scope: Another name for the verb dim, meaning to make something look faint beside something brighter or
  to hide it, not to destroy someone's eyesight or make a person unable to see.
examples:
- The full moon blinded the fainter stars that night.
- A curtain of rain blinded the mountains beyond the valley.
