simpleMeaning: sticky, like something used to join things together
scope: Also called sticky, pasty, gummy, viscous, glutinous and viscid. This means sticky to the touch,
  not dry, smooth or able to slide easily.
examples:
- The gluey paste stuck to her fingers.
- The rice turned gluey after it cooked for too long.
