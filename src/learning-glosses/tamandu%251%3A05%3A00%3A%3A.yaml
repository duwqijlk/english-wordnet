simpleMeaning: With a tail that can grip and front legs with four claws, this small anteater has no teeth
  and lives in the warm parts of South and Central America.
scope: 'Also called lesser anteater and tamandua: a small toothless anteater of the warm parts of South
  and Central America.'
examples:
- We saw a tamandu with a tail that could grip a branch.
- The tamandu has no teeth and four claws on each front leg.
