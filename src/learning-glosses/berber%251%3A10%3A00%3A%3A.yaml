simpleMeaning: A group of closely linked ways of speaking that were once the main language of north Africa
  west of Egypt, and are now heard most in Morocco
scope: A family of related tongues from north Africa west of Egypt, now heard most in Morocco, not Arabic
  and not a single tongue.
examples:
- Berber is still spoken in many parts of Morocco.
- The old Berber tongues were once the main language of north Africa.
