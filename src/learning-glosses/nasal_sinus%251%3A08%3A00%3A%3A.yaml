simpleMeaning: The nose's moist lining carries on into the paired hollows in the facial bones, which share
  that same unbroken surface.
scope: One of three interchangeable names for these paired facial cavities, alongside paranasal sinus
  and sinus paranasales; it is not the blood channels inside the skull that are also called sinuses, nor
  the nasal cavity itself.
examples:
- The cold left her with a blocked nasal sinus and a dull ache across her cheek.
- The scan showed an inflamed nasal sinus on the left side.
