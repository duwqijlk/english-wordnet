simpleMeaning: In golf, a long-shafted club for hitting the ball a long way, once made with a head of
  timber.
scope: The golf club, not the hard material cut from trees and not a wooded area.
examples:
- He reached for a wood instead of an iron on the long par five.
- Modern woods are made of metal rather than timber.
