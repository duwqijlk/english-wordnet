simpleMeaning: A glass-like clear substance found in firm tissue in the body or in some skin states
scope: This is a clear glass-like substance found in firm tissue in the body or in some skin states; hyalin
  is another name for this sense, not a hard bone and not a liquid.
examples:
- Hyaline was found in the firm tissue of the knee.
- The doctor found hyaline in skin that had changed.
