synsetId: 05924405-n
simpleMeaning: A Chinese system of arranging and facing buildings, graves and furniture to match the flow
  of energy and the balance of yin and yang, for good or bad fortune.
scope: This is the traditional Chinese practice for laying out and facing buildings and rooms, not a religion,
  not a style of interior decorating, and not the energy it claims to work with.
examples:
- They consulted a feng shui expert before deciding where the new office door should go.
- In feng shui, a mirror facing the bed is thought to bring bad luck.
