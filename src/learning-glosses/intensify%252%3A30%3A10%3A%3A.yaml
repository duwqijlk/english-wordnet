senseId: 'intensify%2:30:10::'
synsetId: 00575812-v
simpleMeaning: To make the dark parts of a photographic negative thicker and less clear, so light and
  dark stand out more strongly
scope: In photography, to thicken the dark parts of a negative so light and dark stand out more, not to
  make a feeling or a thing stronger in general.
examples:
- The printer intensified the negative to sharpen the contrast.
- He intensified the plate so the shadows came out black.
