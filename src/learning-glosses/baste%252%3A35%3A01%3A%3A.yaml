simpleMeaning: to hit a person or thing hard, again and again
scope: 'Also called batter and clobber: hitting a person or thing hard again and again, not sewing cloth
  together loosely and not a stitch as a thing.'
examples:
- In the story, the giant basted the knight again and again with his club.
- She basted the thief with her bag until he ran away.
