simpleMeaning: A strip along an edge, cut so that its side looks like an S, with the part that bulges
  out on top and the part that curves in below
scope: A strip along an edge shaped like an S in section, also called cyma reversa, and not a plain straight
  strip or a curve that bends only one way.
examples:
- The ogee on the cornice curves out at the top and in at the bottom.
- He cut an ogee into the edge of the shelf.
