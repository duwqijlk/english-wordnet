simpleMeaning: a person who is killed for refusing to give up their faith, choosing death rather than
  giving in
scope: A person killed for refusing to give up their faith; not someone who suffers for a belief without
  dying, and not the act of killing such a person.
examples:
- The early Christians honoured the martyr who died for his faith.
- She was remembered as a martyr for refusing to deny her religion.
