simpleMeaning: One of the places a traveling music or drama group visits to put on a show.
scope: This is a tour date for performers, not the seating area at a stadium and not a firm refusal or
  position.
examples:
- The band added a second stand in Chicago after the first show sold out.
- The theater company's summer stand in Brighton lasted three weeks.
