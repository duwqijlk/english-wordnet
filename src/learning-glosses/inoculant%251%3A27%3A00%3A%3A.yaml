simpleMeaning: Something, such as a germ, a poison or blood fluid, put into the body to build up the body's
  guard against one illness.
scope: A substance, such as a germ, a poison or blood fluid, put into the body to build up the body's
  guard against one illness, also called inoculum; not a cure given after illness and not a drug that
  kills germs.
examples:
- The nurse gave the child an inoculant against measles.
- This inoculant is put into the arm to build up guard.
