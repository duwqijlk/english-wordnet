senseId: 'parallel_axiom%1:09:00::'
synsetId: 06015807-n
simpleMeaning: In geometry, the rule that through a given point only one straight line can be drawn that
  never meets a given straight line
scope: In geometry, this is the rule about one line through a point that never meets another line; not
  a rule about lines that meet and not a rule about shapes.
examples:
- The parallel axiom lets us draw one line through a point.
- Euclid's parallel axiom says only one such line exists.
