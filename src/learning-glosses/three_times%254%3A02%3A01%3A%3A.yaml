simpleMeaning: Making an amount as great as itself added twice
scope: Making an amount as great as itself added twice, threefold being another name for this sense; not
  twice as great and not four times as great.
examples:
- The rent is now three times what it was five years ago.
- Her pay grew to three times its old size in one year.
