simpleMeaning: A sudden happening that breaks into something people are doing and stops it for a time
scope: A sudden happening that breaks into what people are doing, not the act of delaying and not the
  stretch of time when something stops; also called a break.
examples:
- The telephone is an annoying interruption.
- There was an interruption when a player was hurt.
