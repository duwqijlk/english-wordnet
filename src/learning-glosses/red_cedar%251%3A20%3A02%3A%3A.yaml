simpleMeaning: East of the Rocky Mountains grows a small juniper with brown bark peeling away in shreds,
  short sharp needles, and a top shaped like a cone
scope: Also called eastern red cedar and red juniper; a small juniper of the land east of the Rocky Mountains,
  not the tall Pacific-coast tree of the same name.
examples:
- We planted a red cedar by the fence for its neat cone shape.
- The red cedar in our yard sheds thin strips of brown bark.
