simpleMeaning: A port where goods can be brought in and sent out again without paying tax on them.
scope: A port where goods can be brought in and sent out again without paying tax on them, not a port
  where all goods pay tax and not a port that only sends goods out.
examples:
- Bahrain has been an entrepot of trade since ancient times.
- The goods passed through the entrepot without paying tax.
