senseId: 'electronic_drum_set%1:06:01::'
synsetId: 92460343-n
simpleMeaning: A group of striking pads and cymbal-like pieces wired to a sound unit, letting a player
  produce percussion and other sounds with sticks, hands or brushes.
scope: A complete playable instrument, not one pad by itself and not an acoustic drum kit; 'electronic
  drum kit' means the same.
examples:
- She set up her electronic drum set in the corner of the room.
- An electronic drum set is easier to carry than an acoustic one.
