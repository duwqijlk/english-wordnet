simpleMeaning: a quick long-tailed African lemur, out at night, with thick soft fur and big eyes and ears
scope: A quick long-tailed African lemur out at night, not a slow one and not one out by day; bushbaby
  and galago are other names for this sense.
examples:
- The bush baby leapt between branches in the dark.
- A bush baby stared at us with its big eyes.
