simpleMeaning: 'a large bone that spreads out wide, forming one half of the pelvis (a ring of bones low
  in the body), made of three bones: the ilium, ischium, and pubis'
scope: Also called innominate bone. This is one half of the pelvis, not the whole pelvis and not the long
  bone of the leg.
examples:
- He broke his hipbone in the fall.
- The doctor showed her where the hipbone joins the spine.
