simpleMeaning: A round of fault-finding in which people pass the fault for a bad event from one to another
  instead of owning it.
scope: A round of fault-finding in which people pass the fault for a bad event from one to another instead
  of owning it, not an honest talk about who did what and not a real game.
examples:
- After the defeat, the blame game began in the team.
- Stop the blame game and fix the problem.
