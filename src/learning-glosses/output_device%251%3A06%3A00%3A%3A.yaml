simpleMeaning: A piece of electronic or machine-run equipment joined to a computer that sends information
  from the computer as words, pictures, sounds, or other forms
scope: A piece of equipment joined to a computer that sends information out of it, not a piece that puts
  information into it and not the computer itself.
examples:
- A printer is a common output device.
- The speaker is an output device that plays sound from the computer.
