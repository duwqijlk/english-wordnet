simpleMeaning: 'used for a tumor (a growth in the body), a sore or an illness: slow to heal or grow and
  usually causing no pain'
scope: This sense is about a tumor, a sore or an illness in the body that is slow to heal or grow and
  usually has no pain, not about a person who is lazy and does not like to work.
examples:
- The doctor said the indolent tumor was growing very slowly and did not hurt.
- She had an indolent sore on her leg that took months to heal.
