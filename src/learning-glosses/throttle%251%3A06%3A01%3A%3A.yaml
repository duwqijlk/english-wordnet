simpleMeaning: a pedal pressed by the foot that governs the valve letting fuel into an engine, and so
  how fast the engine runs
scope: 'Also called a gun or gas: the foot pedal that sets an engine''s speed, not the brake pedal and
  not a valve itself.'
examples:
- He pressed the throttle and the car sped up.
- She eased off the throttle as she came to the bend.
