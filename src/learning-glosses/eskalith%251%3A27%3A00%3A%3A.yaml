simpleMeaning: A white powder used to make glass and ceramics and, as a drug, to treat some kinds of depression
  and the high moods of a mood-swing disorder.
scope: A white powder drug, also called lithium carbonate, Lithane, and Lithonate.
examples:
- The doctor prescribed Eskalith for her depression.
- Eskalith comes as a white powder pressed into tablets.
