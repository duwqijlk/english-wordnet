simpleMeaning: a white hard bitter-tasting salt used to make glass, paper, dyes and medicines
scope: A hard white salt used in making glass, paper, dyes and medicines, also called sodium sulphate;
  not the table salt used on food, and not a liquid.
examples:
- The factory ordered sodium sulfate to make a new batch of glass.
- Workers used sodium sulfate in the dyes for the cloth.
