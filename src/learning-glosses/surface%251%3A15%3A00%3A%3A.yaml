synsetId: 08677970-n
simpleMeaning: the outer boundary of a solid object, treated as a flat area with length and width but
  no thickness.
scope: This is not the outer layer or coating of a made object; it is the boundary of a solid considered
  as a flat area.
examples:
- The surface of a cube has six square faces.
- Mathematicians treat the surface of a sphere as a curved two-dimensional space.
