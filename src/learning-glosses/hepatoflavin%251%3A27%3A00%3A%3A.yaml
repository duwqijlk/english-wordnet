simpleMeaning: Without this B vitamin, sore spots form on the skin and the body loses weight
scope: A B vitamin that stops sore spots on the skin and loss of weight, also called lactoflavin, ovoflavin
  and riboflavin, not a vitamin that builds muscle and not a medicine for the skin alone.
examples:
- Without enough hepatoflavin, sores can form on the skin.
- The diet lacked hepatoflavin, and the animals lost weight.
