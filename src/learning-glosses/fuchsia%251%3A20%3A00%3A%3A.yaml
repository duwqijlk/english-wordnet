simpleMeaning: A tropical shrub of several kinds, grown widely for showy drooping flowers that may be
  purplish, reddish or white, from Central and South America, New Zealand and Tahiti.
scope: This sense names the tropical shrub, not the purplish-red colour that shares its name. The definition
  covers several kinds rather than one species, and places them in Central and South America, New Zealand
  and Tahiti.
examples:
- A hanging basket of fuchsias swung gently in the wind.
- The fuchsia on the windowsill drooped under the weight of its red flowers.
