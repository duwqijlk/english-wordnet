simpleMeaning: A vain man who thinks too highly of what he has done and likes to show it off.
scope: A vain man who shows off his own deeds, also called a cockscomb; not the red crest on a chicken's
  head and not the jester's cap.
examples:
- The young coxcomb spent the evening boasting of his victories.
- He played the coxcomb, strutting about in his new coat.
