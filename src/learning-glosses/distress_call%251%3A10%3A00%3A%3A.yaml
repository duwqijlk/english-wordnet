simpleMeaning: a sign agreed on around the world, sent by a ship or plane to say that help is needed
scope: A sign sent out by a ship or plane to ask for help, also called a distress signal, and not a normal
  radio message or a call for help on land.
examples:
- The crew sent a distress call after the engine failed at sea.
- A passing ship picked up the distress call and turned back to help.
