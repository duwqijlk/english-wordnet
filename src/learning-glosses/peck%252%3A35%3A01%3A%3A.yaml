simpleMeaning: to hit something with small, light movements that pick at it
scope: 'Also called pick and beak: to hit lightly, as a bird does with its beak. Not a measure for dry
  goods, and not to keep bothering a person with small complaints.'
examples:
- The bird pecked at the window again and again.
- A small chick pecked the ground with its beak.
