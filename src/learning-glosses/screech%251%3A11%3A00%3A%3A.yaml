simpleMeaning: A noise that climbs so high it sounds like a person crying out
scope: 'Also called scream, screaming, and shriek: a very high sound like a person''s cry, not a sharp
  cry that cuts through other sounds and not the act of crying out.'
examples:
- He ducked at the screech of shells overhead.
- We heard the screech of the brakes as the train stopped.
