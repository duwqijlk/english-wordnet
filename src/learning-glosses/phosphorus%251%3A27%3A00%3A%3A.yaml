simpleMeaning: A non-metal element of the nitrogen family, found in phosphate rocks and in all living
  cells; it can join in more than one way, reacts fast and takes several forms.
scope: Not nitrogen or sulfur; also called P and atomic number 15.
examples:
- Phosphorus is found in phosphate rocks.
- All living cells hold phosphorus in some form.
