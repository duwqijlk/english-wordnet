simpleMeaning: a tiny one-celled living thing, usually not making food from light, that lives free and
  moves with whip-like threads; some kinds cause disease in people and animals
scope: A tiny one-celled living thing that moves with whip-like threads; flagellate, flagellate protozoan,
  flagellated protozoan and mastigophore are other names for this sense, not a plant and not a one-celled
  thing without whip-like threads.
examples:
- The mastigophoran moved through the water with its whip-like threads.
- Some mastigophorans cause disease in people.
