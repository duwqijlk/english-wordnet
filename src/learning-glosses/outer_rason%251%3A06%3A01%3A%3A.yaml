simpleMeaning: a wide outer robe worn on top of the inner robe by bishops, priests, deacons, and monks
  and nuns as their usual outer clothing
scope: 'Also called outer cassock: a wide outer robe worn over the inner robe by church leaders, not the
  inner robe itself.'
examples:
- The deacon put on his outer rason before the service began.
- An outer rason is the usual outer dress of monks and nuns as well as priests.
