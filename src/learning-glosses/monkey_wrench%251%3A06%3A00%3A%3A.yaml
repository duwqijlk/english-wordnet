simpleMeaning: Set to more than one width, this tool has one jaw that stays fixed and one jaw that moves
scope: 'Also called a monkey-wrench: a tool with one fixed jaw and one that moves, not a tool with two
  fixed jaws and not a pair of pliers.'
examples:
- He set the monkey wrench to the right width for the bolt.
- She tightened the monkey wrench around the nut and turned.
