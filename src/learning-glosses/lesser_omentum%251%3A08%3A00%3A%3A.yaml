simpleMeaning: a part of the lining of the belly joined to the stomach and liver, holding up the blood
  vessels of the liver
scope: A part of the lining of the belly joined to the stomach and liver, holding up the blood vessels
  of the liver, not the lining of the chest and not a band of fat alone.
examples:
- The lesser omentum joins the stomach to the liver.
- The surgeon saw the lesser omentum holding the liver's blood vessels.
