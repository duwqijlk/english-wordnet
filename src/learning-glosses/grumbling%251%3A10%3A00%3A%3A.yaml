simpleMeaning: Words of complaint said so low and so unclearly that you can hardly catch them
scope: This is a complaint said low and unclearly, also called mutter, murmur, grumble, muttering, or
  murmuring, not a loud low sound and not a sound that goes on and on.
examples:
- His grumbling about the food went on all evening.
- She heard his grumbling from the next room.
