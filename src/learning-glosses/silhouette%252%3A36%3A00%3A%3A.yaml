simpleMeaning: to show a thing as a dark edge shape
scope: To show a thing as a dark edge shape, not to throw its shape on a screen, not the dark shape itself,
  and not a picture of it filled in with one colour.
examples:
- The artist silhouetted the tree against the sunset.
- She silhouetted the cat in black paper.
