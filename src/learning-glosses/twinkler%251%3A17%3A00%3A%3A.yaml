simpleMeaning: A thing that gives off or throws back light in short, uneven flashes.
scope: This is a thing that gives off or throws back light in short, uneven flashes, not a steady lamp
  and not a mirror.
examples:
- The twinkler flashed on the dark water.
- A twinkler caught her eye in the night sky.
