simpleMeaning: A North American plant much like true licorice, with a root that has much the same qualities.
scope: Also called wild licorice, wild liquorice, American licorice, and American liquorice; a North American
  plant much like true licorice, set beside true licorice and other plants with roots of much the same
  kind.
examples:
- Glycyrrhiza lepidota grows wild in North America, its root much like true licorice.
- The root of Glycyrrhiza lepidota was used in the same way as licorice.
