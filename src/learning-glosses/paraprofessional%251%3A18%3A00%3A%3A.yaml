senseId: 'paraprofessional%1:18:00::'
synsetId: 10418323-n
simpleMeaning: A trained worker who helps a person with a job that needs special training, without being
  one of them
scope: A trained worker who helps a skilled worker, not the skilled worker in that job and not a worker
  with no training.
examples:
- The paraprofessional helped the teacher prepare the lesson.
- The paraprofessional works beside the doctor and helps with the patients.
