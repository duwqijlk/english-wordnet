simpleMeaning: a seed case shaped like a tall pointed hat grows on any of several long-lived plants of
  the group Mitella, which spread by underground stems
scope: Also called miterwort and mitrewort; a long-lived herb with a seed case shaped like a tall pointed
  hat, not the tall pointed hat itself.
examples:
- The bishop's cap spreads by underground stems in the shady border.
- Look for the seed case of the bishop's cap, shaped like a tall pointed hat.
