simpleMeaning: A large flat sea fish that can poison and badly hurt with large sharp spines (sharp points
  with small hooks) near the start of its long, thin tail
scope: This is the large sea fish with sharp spines on its tail, not other flat sea fish without those
  spines.
examples:
- A large stingray swam past us, its long thin tail behind it.
- He stepped near a stingray and was badly hurt by its tail.
