simpleMeaning: One of a group of matching parts of living things that carry the plan for dividing the
  body of a young animal into sections as it grows before birth.
scope: One of a group of matching parts of living things that carry the plan for dividing the body into
  sections before birth, not a part that makes a body chemical; also called a homeobox.
examples:
- The homeobox gene helps shape the body before birth.
- A change in a homeobox gene can alter how the body forms.
