senseId: inept%5:00:00:maladroit:00
synsetId: 00064212-s
simpleMeaning: showing that a person does not notice or understand things well, and lacks good judgment
  and careful skill
scope: Also called tactless; this is about poor sense and skill in what a person does or says, not just
  about words that are not smooth or graceful.
examples:
- His inept remark hurt her feelings at once.
- The manager's inept handling of the complaint made customers more angry.
