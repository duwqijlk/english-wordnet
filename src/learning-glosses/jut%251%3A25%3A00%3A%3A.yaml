senseId: 'jut%1:25:00::'
synsetId: 13917127-n
simpleMeaning: a part that sticks out from the surface around it
scope: A part that sticks out from what is around it; bump, bulge, swelling and hump are other names for
  this sense, and it is not a hole or dip in a surface or a sharp point.
examples:
- The jut of rock made the path hard to pass.
- A jut in the wall caught his coat as he passed.
