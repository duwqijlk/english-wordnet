simpleMeaning: A way of cutting a line or a flat shape in two so the short part is to the long part as
  the long part is to the whole
scope: A way of cutting a line or flat shape into two parts in a set share, also called golden section,
  not a half and not a cut at any place.
examples:
- The artist used the golden mean to place the door in the wall.
- In the golden mean, the short part is to the long part as the long part is to the whole.
