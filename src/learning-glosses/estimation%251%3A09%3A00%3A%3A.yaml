synsetId: 05811387-n
simpleMeaning: a rough working out of how much there is, how great something is, or what it is worth
scope: 'Also called idea, estimate, and approximation: a rough working out of a number or worth, not the
  paper that sets a value for insurance or tax.'
examples:
- His estimation of the cost was close to the final bill.
- By her estimation, the trip would take about three hours.
