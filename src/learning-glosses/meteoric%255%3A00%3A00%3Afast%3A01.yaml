senseId: meteoric%5:00:00:fast:01
synsetId: 00982425-s
simpleMeaning: As quick, as bright, or as short-lived as a shooting star.
scope: Like a shooting star in speed, in brightness, or in lasting only a short time; not to do with meteors
  or lumps of rock from space, and not to do with what happens in the air above the earth, especially
  the weather.
examples:
- Her rise to fame was meteoric.
- His success was meteoric, bright and over in a flash.
