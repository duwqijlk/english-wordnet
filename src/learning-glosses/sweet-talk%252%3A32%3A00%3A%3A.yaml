simpleMeaning: to get someone to do something by kind words, a gentle touch, or praise
scope: To get someone to do something with kind words, a gentle touch, or praise; coax, wheedle, cajole,
  inveigle, palaver and blarney are other names for this sense. Not an order and not a threat.
examples:
- He tried to sweet-talk her into lending him the car.
- She could sweet-talk anyone into helping with the move.
