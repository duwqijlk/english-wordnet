simpleMeaning: A radioactive metal much like tellurium and bismuth, found in uranium ores and also made
  by firing neutrons at bismuth in a nuclear reactor.
scope: Also called Po and atomic number 84; not tellurium and not bismuth, the metals it most resembles.
examples:
- Polonium was found in the uranium ore sample.
- Scientists made polonium by bombarding bismuth with neutrons.
