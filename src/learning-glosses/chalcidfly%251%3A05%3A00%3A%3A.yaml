simpleMeaning: One of many kinds of tiny bug whose young prey on the eggs and young of bugs not their
  own, many kinds being useful for killing harmful bugs.
scope: One of many kinds of tiny bug whose young prey on the eggs and young of bugs not their own, also
  called chalcid, chalcid fly, and chalcid wasp.
examples:
- Chalcidflies kill harmful bugs.
- A chalcidfly lives off other bugs' eggs.
