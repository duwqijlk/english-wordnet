simpleMeaning: in a calm way, without getting angry or upset, even when something takes a long time or
  is hard
scope: This word tells how a person waits or acts, in a calm way without anger; it is not about a sick
  person in hospital.
examples:
- She waited patiently for the bus in the rain.
- He listened patiently while his young son told the long story.
