simpleMeaning: All over Europe it climbs, winding itself round other plants, with thick roots, heart-shaped
  leaves and red berries.
scope: People also call it black bindweed, and it is a European climber that winds itself round other
  plants.
examples:
- Black bryony had wound itself round the other plants.
- Black bryony was already climbing in the garden.
