senseId: dizzy%5:00:00:ill:01
synsetId: 02554818-s
simpleMeaning: feeling as if you or things around you are turning round and round, and likely to fall,
  or making someone feel that way
scope: 'Also called giddy: feeling as if things are turning and you may fall, not lacking care and serious
  thought, and not the verb that means to make someone feel this way.'
examples:
- After spinning round, she felt dizzy and had to sit down.
- The high bridge made him dizzy when he looked down.
