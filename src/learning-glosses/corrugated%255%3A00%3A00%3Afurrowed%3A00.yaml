simpleMeaning: shaped with raised lines and low lines that run side by side, one after the other, again
  and again
scope: A surface shaped into raised and low lines side by side; not a smooth flat surface.
examples:
- The roof was made of corrugated metal with raised and low lines.
- The corrugated sheet had long raised lines running side by side across it.
