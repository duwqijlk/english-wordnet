simpleMeaning: under a thing or a surface, in a lower place or on a lower level, straight below the thing
  or surface
scope: This means in a lower place, straight under something; it is not the sense about being on the bottom
  side of a thing.
examples:
- The old painting was hidden, and we could see the first drawing underneath.
- A house needs a strong base underneath.
