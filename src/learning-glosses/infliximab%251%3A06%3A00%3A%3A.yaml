simpleMeaning: A drug sold as Remicade, an antibody that blocks the body protein TNF, given into a vein
  every one to three months for Crohn's disease and rheumatoid arthritis.
scope: This is the medicine itself, not the TNF protein it blocks and not other drugs used for the same
  conditions.
examples:
- Her doctor started her on infliximab when other drugs failed to control her arthritis.
- Infliximab is given into a vein at the hospital every few months.
