simpleMeaning: The flat face at the front of a drawing or painting, the same size as the work but not
  the same as the real face it is made on.
scope: This is the flat face at the front of a drawing or painting, the same size as the work but not
  its real flat face; not the back of the work, and not the wall it hangs on.
examples:
- The figures stand on the picture plane at the front.
- He set the still life on the picture plane of the canvas.
