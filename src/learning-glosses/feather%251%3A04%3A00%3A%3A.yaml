simpleMeaning: the act of turning an oar so it lies flat, level with the water, between one pull and the
  next
scope: This sense is the act of turning an oar between pulls, not the light growth on a bird's body and
  not joining wood in building work.
examples:
- A clean feather lets the oar move back without hitting the water.
- She practised the feather, turning the oar flat after each pull.
