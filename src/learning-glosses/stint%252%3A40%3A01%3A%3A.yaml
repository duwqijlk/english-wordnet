simpleMeaning: to give only a small amount of something, less than is wanted or needed
scope: To give only a small amount of something, also called scant and skimp; it is not living on very
  little money yourself, and not the small bird.
examples:
- The camp stinted water, giving each person only a small cup a day.
- He stinted the paint, so one thin coat did not cover the wall.
