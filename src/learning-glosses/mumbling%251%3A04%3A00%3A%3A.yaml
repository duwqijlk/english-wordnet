senseId: 'mumbling%1:04:00::'
synsetId: 00280079-n
simpleMeaning: weak chewing that moves food around the mouth without really biting it, as if the person
  had no teeth
scope: Weak chewing that gets little done, not the low, unclear way of speaking that shares the name.
examples:
- His mumbling of the soft bread took a long time at lunch.
- Without her teeth, her mumbling of the apple left it barely chewed.
