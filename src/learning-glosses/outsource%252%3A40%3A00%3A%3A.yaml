simpleMeaning: to get work or goods done by a firm outside your own, instead of doing it yourself
scope: Getting work or goods from a firm outside your own, not doing the work yourself and not buying
  goods from your own staff.
examples:
- Many companies outsource and hire consultants to keep a flexible workforce.
- The firm decided to outsource its cleaning to an outside supplier.
