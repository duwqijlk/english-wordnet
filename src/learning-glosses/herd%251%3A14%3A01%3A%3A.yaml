simpleMeaning: a group of wild mammals of the same kind that stay together, such as antelope, elephants,
  seals, whales or zebra
scope: A group of wild animals living together, not a group of farm animals kept by people and not a crowd
  of people.
examples:
- A herd of elephants moved slowly across the plain.
- We watched a herd of zebra drinking at the river.
