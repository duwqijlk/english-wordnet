simpleMeaning: an automatic move up to the next round of a tournament when there is no opponent to play
scope: This is a free place in a competition, not a document giving permission to go somewhere.
examples:
- She got a pass to the final when her opponent withdrew with an injury.
- Because only seven teams entered, the top seed received a pass into the second round.
