simpleMeaning: A small shy four-legged animal with a tail that comes out after dark, of the south-west
  of North America and Cuba, which gives birth to live young.
scope: A small shy four-legged animal with a tail that comes out after dark and gives birth to live young,
  not a snake and not a day animal.
examples:
- The night lizard hid under the rock by day.
- A night lizard came out after dark to hunt small bugs.
