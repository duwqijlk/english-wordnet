simpleMeaning: an animal whose family line is all of one kind, with that line written down; used especially
  of horses
scope: This animal is also called a pureblood or a thoroughbred; it is not the describing sense for an
  animal bred in this way.
examples:
- She bought a purebred from the horse breeder.
- The purebred won the race by a long way.
