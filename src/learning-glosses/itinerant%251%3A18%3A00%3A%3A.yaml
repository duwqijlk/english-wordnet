simpleMeaning: a worker who moves from place to place, going where work is needed
scope: 'Also called gypsy and gipsy: a worker who moves for work, not a person who travels for fun and
  not a person who simply has no home.'
examples:
- The itinerant found work picking fruit in the summer.
- Itinerants moved to the next town when the harvest ended.
