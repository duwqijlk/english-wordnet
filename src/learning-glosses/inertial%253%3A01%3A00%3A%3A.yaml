simpleMeaning: of or having to do with the way a body keeps moving or stays still unless a force acts
  on it
scope: Of or having to do with the way a body keeps moving or stays still unless a force acts on it; not
  of speed itself and not of weight.
examples:
- Inertial forces keep the car moving after the brakes fail.
- The inertial mass of the block resisted the push.
