simpleMeaning: connected with a set of beliefs that are held as fixed and true, and not open to question
scope: About dogma itself, a set of beliefs held as fixed and true; not the close sense for a doctrine
  or code of beliefs accepted as having authority, and not a person who states beliefs as certain when
  they are not proved.
examples:
- The book is a dogmatic work about the church's fixed beliefs.
- He studied old dogmatic texts that set out the beliefs of the faith.
