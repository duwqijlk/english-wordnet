simpleMeaning: A bed cover, usually with stretchy edges, made to fit one bed exactly.
scope: A bed cover, usually with stretchy edges, made to fit one bed exactly; contour sheet is another
  name for this sense, not a flat sheet with no stretchy edges, and not a blanket.
examples:
- The fitted sheet hugged the mattress corners.
- She bought a fitted sheet with stretchy edges.
