simpleMeaning: An upright branching plant grown for loose bunches of sweet-smelling white, pink, red,
  or lilac flowers; it comes from sands and sea cliffs of southwestern Greece and southern Albania.
scope: Also called Malcolmia maritima and Virginian stock; a garden plant grown for its sweet-smelling
  flowers, not a wild grass and not a tree.
examples:
- Virginia stock grows along the garden path.
- The pink flowers of Virginia stock smell sweet in the evening.
