simpleMeaning: Reddish or violet twigs and bark full of tannin, the stuff used to tan leather, mark this
  willow of Europe and Asia.
scope: Also called basket willow, purple willow, red osier, and red willow, it is a willow of Europe and
  Asia whose bark is full of the bitter stuff used to tan leather.
examples:
- The purple osier had twigs of red or violet and bark full of tannin.
- Bark full of tannin and twigs of reddish or violet mark the purple osier.
