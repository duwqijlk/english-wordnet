senseId: 'begin%2:42:02::'
synsetId: 02685037-v
simpleMeaning: To be the first thing in a series, story, or period, so that everything else comes after
  it.
scope: This is being the first item that opens a series, story, or period, not an event itself starting
  at a point in time and not opening in a stated way.
examples:
- A short prologue begins the novel.
- The opening ceremony begins the school year.
