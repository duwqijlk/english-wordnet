simpleMeaning: holding firmly to the same mind or action, and refusing to change in any way
scope: 'Also called stubbornly and mulishly: doing something in a way that will not change. It does not
  mean in a way that is ready to change.'
examples:
- She obstinately refused to move from her seat.
- He obstinately held to his plan even when everyone told him it would not work.
