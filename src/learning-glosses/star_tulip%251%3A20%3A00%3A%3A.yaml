simpleMeaning: A small plant with thin, bent stems and a few white blooms with pointed petals in loose
  clusters; it is found from Washington and Oregon to Montana.
scope: This is the same wild white-flowered plant as elegant cat's ears, not a garden tulip.
examples:
- Star tulips open their white flowers in early summer.
- The meadow was dotted with star tulip blooms.
