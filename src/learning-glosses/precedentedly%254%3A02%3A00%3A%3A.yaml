simpleMeaning: In a way that follows what was done before in a like case
scope: In a way that follows what was done before in a like case; not in a way with no past case to follow,
  and not simply by old custom.
examples:
- The court acted precedentedly in the case.
- He ruled precedentedly, as judges had before.
