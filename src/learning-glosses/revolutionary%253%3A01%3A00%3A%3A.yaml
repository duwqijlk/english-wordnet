simpleMeaning: to do with a fight by people to take power from a government and change the way a country
  is run
scope: This sense says something is to do with a fight by people to take power from a government. It is
  not the sense for taking part in or supporting such a fight, it is not a person who supports such a
  fight, and it is not the sense that means very new and very different.
examples:
- He read a book about revolutionary wars in the past.
- The town still has a museum about its revolutionary days.
