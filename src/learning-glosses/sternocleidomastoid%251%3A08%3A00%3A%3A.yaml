simpleMeaning: A thick paired muscle fastening chest bone and collarbone onto the back of the skull, moving
  the head aslant across and flexing the neck and raising the head as one.
scope: Also called musculus sternocleidomastoideus, sternocleido mastoideus, and sternocleidomastoid muscle,
  this is a thick paired muscle fastening chest bone and collarbone onto the back of the skull, moving
  the head aslant across and flexing the neck and raising the head as one, where musculus sternocleidomastoideus
  is one of a pair of thick muscles running from the chest bones to the back of the head, that swings
  the head toward the far side and, acting as one, bends the neck and tips the head back.
examples:
- The sternocleidomastoid turns the head.
- Doctors check the sternocleidomastoid after a neck injury.
