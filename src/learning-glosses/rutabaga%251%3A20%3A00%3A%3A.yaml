simpleMeaning: a plant in the same group as a cabbage, with a thick, round, yellow root that people can
  eat
scope: This is the whole plant that grows in the ground. It is not just the large yellow root of the plant
  when that root is used as food.
examples:
- She planted rutabaga in her garden last spring.
- Rutabaga grows well in cool weather and has a thick yellow root.
