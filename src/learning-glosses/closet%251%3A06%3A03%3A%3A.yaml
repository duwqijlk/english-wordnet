simpleMeaning: a small room, a hollow in a wall, or a cupboard used for keeping things
scope: 'Also called cupboard: a small room, a hollow in a wall, or a cupboard used for keeping things,
  not a tall piece of furniture for keeping clothes.'
examples:
- She kept the cleaning things in the closet under the stairs.
- He put the old books in the closet at the end of the hall.
