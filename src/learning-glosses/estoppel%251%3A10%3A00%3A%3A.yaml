senseId: 'estoppel%1:10:00::'
synsetId: 06666656-n
simpleMeaning: Once a fact has been settled, this rule of evidence stops a person from saying it is not
  true
scope: A rule of evidence that stops a person denying a settled fact, not a law that punishes lying and
  not a judge's order to keep silent.
examples:
- The lawyer used estoppel to stop the witness denying what he had already agreed.
- Under estoppel, she could not go back on the fact she had accepted.
