simpleMeaning: a climbing woody vine from Madagascar with thick dark waxy evergreen leaves and clusters
  of large fragrant white flowers along its stems; widely grown in warm climates.
scope: This is the climbing Madagascar vine grown for its fragrant white blooms, not the small woodland
  plant that turns black or the Guiana tree-dweller.
examples:
- The waxflower climbed up the garden trellis.
- She picked a sprig of waxflower for the table.
