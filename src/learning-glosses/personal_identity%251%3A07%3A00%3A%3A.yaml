simpleMeaning: The set of traits that make a person who they are and that stay with them through their
  life.
scope: The set of traits that make a person who they are and that stay with them through their life; identity
  and individuality are other names for this sense, not a name or a job title.
examples:
- Joining the army can make a person lose their personal identity.
- Her personal identity stayed strong even after years abroad.
