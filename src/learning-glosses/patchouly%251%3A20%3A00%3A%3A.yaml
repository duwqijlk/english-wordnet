simpleMeaning: A small sweet-smelling mint shrub from the East Indies; a scented oil from its leaves goes
  into perfumes
scope: 'Also called patchouli or pachouli: a small sweet-smelling mint shrub from the East Indies, its
  scented leaf oil used in perfumes, not a flower and not a cooking herb.'
examples:
- She dabbed patchouly oil behind her ears.
- The patchouly plant grew in a pot by the window.
