simpleMeaning: A weak-stemmed plant that lives one cold season, from round the Mediterranean, long grown
  in the south of the United States; grown to cover ground and feed stock
scope: A weak-stemmed plant that lives one cold season; rough pea and singletary pea are other names for
  this sense, and it is not a tall garden pea or a bean grown for pods.
examples:
- Wild winterpea covered the field in spring.
- The wild winterpea fed the sheep all winter.
