simpleMeaning: a white man from the southern US, plain and friendly, with right-wing or shutting-out views
  and a fellow feeling for men of his group, and loyalty to them
scope: Also called good old boy and good ole boy; a plain, friendly white man of the US South with right-wing
  views, not just any friendly southern man and not a man from the North.
examples:
- He is a good ol' boy who greets everyone at the county fair.
- The good ol' boy stayed loyal to his old friends through the whole campaign.
