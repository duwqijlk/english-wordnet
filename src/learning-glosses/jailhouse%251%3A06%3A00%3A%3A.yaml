simpleMeaning: A building run by the government where people accused of a crime are locked up while they
  wait for their trial, or while they serve their sentence.
scope: An informal US name for a prison, another name for jail; not the verb meaning to imprison someone.
examples:
- The sheriff led the prisoner back to the jailhouse.
- The jailhouse had only six cells and one guard.
