simpleMeaning: the seed-making part of a plant whose seeds grow inside its fruit, especially one with
  bright, colorful parts that are easy to see
scope: 'Also called flower and bloom: this is the seed-making part itself, not a whole plant and not its
  fruit.'
examples:
- The apple tree was covered in white blossom in spring.
- Each blossom on the cherry tree had five pink parts around its centre.
