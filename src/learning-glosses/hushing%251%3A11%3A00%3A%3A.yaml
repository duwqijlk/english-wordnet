simpleMeaning: a sound made by pushing air through a narrow space, especially to show that you do not
  like something
scope: This sound, also called hiss, hissing, and fizzle, is made to show you do not like something; it
  is not soft speech and not a call for quiet.
examples:
- Loud hushing came from the seats after the bad play.
- The actors heard hushing all through the hall and knew the crowd did not like the show.
