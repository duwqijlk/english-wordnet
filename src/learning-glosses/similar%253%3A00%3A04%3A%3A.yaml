simpleMeaning: matching each other closely in looks or qualities.
scope: Not one thing compared with another using 'to'; this sense describes two or more things that are
  alike each other, often with 'in'.
examples:
- The twins are so similar that I often confuse them.
- The two plans are similar in cost.
