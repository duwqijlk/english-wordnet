simpleMeaning: a mix of ground raw chicken, mushrooms, pistachios, truffles, onions, and parsley, with
  lots of butter, held together with eggs
scope: A stuffing mix of ground chicken and other foods bound with eggs, not a comic play and not the
  act of stuffing.
examples:
- The cook spread farce inside the chicken before roasting it.
- She made farce with mushrooms, nuts, and plenty of butter.
