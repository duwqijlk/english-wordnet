simpleMeaning: A servant, usually the head servant in a house, who looks after the wine and the serving
  of meals
scope: A servant, usually the head servant in a house, who looks after the wine and the serving of meals,
  not a cook and not a footman.
examples:
- The butler poured the wine at dinner.
- The butler showed the guests to their rooms.
