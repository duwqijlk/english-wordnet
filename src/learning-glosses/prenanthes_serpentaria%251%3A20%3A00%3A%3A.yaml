simpleMeaning: A common perennial herb widely spread in southern and eastern United States, with drooping
  pinkish flower clusters and thick low leaves like a lion's foot; sometimes placed in this genus.
scope: Also called gall of the earth, lion's foot, and Nabalus serpentarius; a common herb of the southern
  and eastern United States, not a tree and not a grass.
examples:
- Prenanthes serpentaria grows in the woods of the southern United States.
- The drooping pink flowers of Prenanthes serpentaria bloom in late summer.
