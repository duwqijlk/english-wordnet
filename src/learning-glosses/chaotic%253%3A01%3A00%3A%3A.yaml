simpleMeaning: In the study of change, said of a set-up where the smallest shift at the start leads to
  a wholly different end.
scope: In the study of change, said of a set-up where the smallest shift at the start leads to a wholly
  different end, not merely messy or unordered.
examples:
- The chaotic system responded wildly to tiny changes.
- Chaotic weather models hinge on the smallest shift at the start.
