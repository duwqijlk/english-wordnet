simpleMeaning: Often bad for farm animals to eat, any of a set of western American plants of the Grindelia
  group has sticky leaves and stems once used as medicine.
scope: Any of a set of western American plants of the Grindelia group with sticky leaves and stems, once
  used as medicine and often bad for farm animals to eat; gum plant, gumweed and rosinweed are other names
  for it.
examples:
- Tarweed grew in the west of America.
- Farm animals that ate the tarweed fell sick.
