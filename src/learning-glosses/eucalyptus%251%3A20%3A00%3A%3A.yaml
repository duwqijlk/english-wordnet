simpleMeaning: a tree that belongs to a group of closely related kinds of tree
scope: Also called eucalypt. This is the living tree itself, not the wood from such a tree.
examples:
- A tall eucalyptus grew beside the house.
- We sat in the shade of an eucalyptus tree on the hot day.
