simpleMeaning: A hand tool with a curved blade and a short handle, used to cut grass or crops
scope: A hand tool with a curved blade for cutting grass or crops, also called a sickle or a reaping hook;
  not a scythe with a long handle and not a knife.
examples:
- He cut the tall grass with a reap hook.
- The reap hook hung on the barn wall.
