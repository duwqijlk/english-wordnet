simpleMeaning: A grey metal that can be drawn out thin, one of the lanthanide metals, used in lighter
  flints, the most common of the rare-earth group.
scope: Also called Ce and atomic number 58, this grey metal can be drawn out thin, belongs with the lanthanide
  metals, is used in lighter flints, and is the most common of the rare-earth group, which sets it apart
  from the other, less common metals of the rare-earth group.
examples:
- Cerium is used in lighter flints.
- Cerium is the most common metal of the rare-earth group.
