simpleMeaning: In linguistics, the view that the study of a language should describe how people really
  use it
scope: In linguistics, this is the view that language study should describe how people really use a language,
  not the view that it should tell people how they ought to speak.
examples:
- Descriptivism holds that a dictionary should record how words are used.
- He argued for descriptivism against the old rules of grammar.
