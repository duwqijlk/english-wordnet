simpleMeaning: A germ attack held to one part or place in the body, above all one that brings on signs
  in other parts.
scope: This is a germ attack held to one part or place in the body, not a germ attack spread through the
  whole body.
examples:
- The focal infection was in her tooth.
- A focal infection can cause pain elsewhere in the body.
