simpleMeaning: The dark that falls on a city when its lights are all switched off to hide it from enemy
  planes overhead.
scope: 'Also called a blackout or a dimout: darkness when the lights are put out, as when a city hides
  from enemy planes.'
examples:
- A brownout left the whole city in darkness during the raid.
- The brownout hid the streets from enemy aircraft.
