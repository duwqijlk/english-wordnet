senseId: 'temperament%1:04:00::'
synsetId: 01002353-n
simpleMeaning: a change made to the gaps between notes, as when you tune a keyboard instrument, so the
  set of notes can be used in different keys
scope: This is about tuning music; it is not a person's strong feelings or quick anger, the other sense
  in this batch.
examples:
- Equal temperament lets a piano play in every key.
- With this temperament, the keyboard could be used for music in many different keys.
