simpleMeaning: A big insect that sucks the juice of plants, with wide flat parts on its legs that look
  like green blades
scope: A big plant-juice insect with flat leg parts; leaf-foot bug is another name for this sense, not
  the small bright leaf bug and not a beetle.
examples:
- A leaf-footed bug clung to the stem, sucking sap from the plant.
- The leaf-footed bug's wide leg parts looked like tiny green leaves.
