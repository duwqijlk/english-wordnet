simpleMeaning: Sick with an eating sickness that makes a person far too thin
scope: Sick with an eating sickness that makes a person far too thin; anorexic is another name for this
  sense, not simply thin by nature and not thin from lack of food.
examples:
- The anorectic girl weighed far less than she should.
- Anorectic patients need care to eat well again.
