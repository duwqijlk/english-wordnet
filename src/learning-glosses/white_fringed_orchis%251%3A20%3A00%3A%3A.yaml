simpleMeaning: In the wet ground of eastern North America grows this plant, with pure pale blooms with
  ragged edges in a spike.
scope: Also called white fringed orchid, this plant of the wet ground of eastern North America bears pure
  pale blooms with ragged edges in a spike, not blooms on dry ground.
examples:
- A white fringed orchis grew in the bog.
- The white fringed orchis bore a spike of pale blooms.
