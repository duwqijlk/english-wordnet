simpleMeaning: a cover that keeps water out, worn over a shoe to keep the shoe dry in water or snow
scope: This is a cover worn over a shoe to keep it dry, also called rubber, arctic, golosh, and gumshoe.
  It is not a normal shoe worn on its own.
examples:
- She wore galoshes over her shoes in the deep snow.
- He put on a galosh before stepping out into the rain.
