simpleMeaning: A drug that helps nerves pass their signals (trade name Prostigmin), used for some eye
  problems and for a sickness in which the muscles grow weak.
scope: A drug that helps nerves pass their signals, used for some eye problems and for weak muscles; not
  a painkiller and not an eye drop.
examples:
- The doctor gave neostigmine for the weakness in her eye muscles.
- Neostigmine helps nerves pass their signals to the muscles.
