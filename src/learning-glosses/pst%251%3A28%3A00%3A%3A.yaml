simpleMeaning: The clock setting of the far western states of the United States, in the eighth time zone
  west of Greenwich, set by the 120th line of longitude west.
scope: 'Also called Pacific Standard Time or Pacific Time: the clock setting of the far western states
  of the United States, not the clock setting of the east.'
examples:
- In winter, California keeps PST.
- The meeting is at 9 a.m. PST.
