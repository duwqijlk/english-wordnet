simpleMeaning: a rude slang word for an Asian person, used above all for North Vietnamese soldiers in
  the Vietnam War
scope: A rude slang insult for an Asian person, above all a North Vietnamese soldier in the Vietnam War;
  not a neutral name and not a word about a person's eyes.
examples:
- He was hurt when a stranger called him a slant-eye.
- The book warns that slant-eye is a cruel word for an Asian person.
