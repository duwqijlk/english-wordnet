simpleMeaning: In logic, the link between two claims where one says 'if this, then that', so that if the
  first is true the second cannot be false
scope: In logic, the link between two claims where one says 'if this, then that'; not being mixed up in
  a wrong act, not a thing worked out from facts, and not a charge.
examples:
- In logic, the implication of 'if it rains, the ground is wet' is clear.
- 'The implication holds: if the first claim is true, the second cannot be false.'
