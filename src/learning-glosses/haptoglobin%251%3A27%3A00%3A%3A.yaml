simpleMeaning: A body protein in blood fluid that grips loose blood protein and takes it away, as from
  a wound.
scope: This is a body protein in blood fluid that grips loose blood protein and takes it away, not a blood
  cell or a clot.
examples:
- Haptoglobin levels fall after heavy bleeding.
- The lab measured haptoglobin in her blood.
