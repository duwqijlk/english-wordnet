simpleMeaning: A person from a South American Indian people in Peru who once formed the ruling class of
  the Inca empire.
scope: Also called Kechua; a person from a South American Indian people in Peru, once the ruling class
  of the Inca empire, not a speaker of the language as such and not a person from another people of Peru.
examples:
- A Quechua elder led the village meeting.
- The Quechua farmer works the land in the hills of Peru.
