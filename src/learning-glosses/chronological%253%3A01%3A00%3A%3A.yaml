simpleMeaning: linked to the order of time, or put in the order in which things happened
scope: About time order, or put in the order things happened; not in order by size, place, or how much
  a thing matters.
examples:
- Put the events in chronological order, from first to last.
- The book gives a chronological list of the king's wars.
