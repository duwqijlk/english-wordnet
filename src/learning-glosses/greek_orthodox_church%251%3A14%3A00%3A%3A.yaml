simpleMeaning: The official group of Christians in Greece, which runs its own affairs as a part of the
  Eastern group of Christians.
scope: Also called the Greek Church; the official group of Christians in Greece, not the Roman Catholic
  group and not a small local group.
examples:
- The Greek Orthodox Church is the state church of Greece.
- He was baptised in the Greek Orthodox Church.
