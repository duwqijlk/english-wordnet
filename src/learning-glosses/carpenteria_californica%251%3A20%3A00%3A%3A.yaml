simpleMeaning: An evergreen shrub of the far west coast, with shiny leaves in pairs and bunches of a few
  sweet-smelling white flowers at the branch ends.
scope: This sense covers only the evergreen shrub of California, told apart by its shiny leaves in pairs
  and its few sweet-smelling white flowers at the branch ends; carpenteria is another name for this sense.
examples:
- Carpenteria californica has shiny leaves in pairs.
- The Carpenteria californica bore white flowers at the branch ends.
