simpleMeaning: The hundred-year rites and games of ancient Rome that marked a new generation's start;
  they may have begun in the 5th century BC and lasted well into the Christian era.
scope: The hundred-year rites and games of ancient Rome, not a yearly festival; also called secular games.
examples:
- The Ludi Saeculares marked the start of a new age in Rome.
- Priests led the Ludi Saeculares once every hundred years.
