simpleMeaning: Used of soaps and cleaners and the like, making a lot of foam.
scope: Of soaps and cleaners, one that makes a lot of foam, not one that makes little foam and not one
  that makes none.
examples:
- This high-sudsing powder makes a lot of foam in the wash.
- Use a high-sudsing soap if you want thick bubbles.
