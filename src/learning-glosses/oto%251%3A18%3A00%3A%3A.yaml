simpleMeaning: A member of the Siouan people who live in the valleys of the Platte and Missouri rivers
  in Nebraska.
scope: Also called Otoe; it names a member of the Siouan people of the Platte and Missouri valleys in
  Nebraska, not a speaker of the Oto tongue.
examples:
- An Oto elder told stories of the Platte valley.
- The Oto live in the valleys of the Platte and Missouri rivers.
