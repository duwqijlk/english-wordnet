simpleMeaning: to put a first layer of paint or coating on a surface before the main coat.
scope: This is not to make a weapon ready and not to fill something with liquid; it means giving a surface
  its first protective coat.
examples:
- We primed the walls before painting them blue.
- The metal door must be primed to stop rust.
