scope: Also called the MMPI; a 550-item written test in which a person agrees or disagrees with items
  about feelings and acts.
examples:
- She took the Minnesota Multiphasic Personality Inventory at the clinic.
- The Minnesota Multiphasic Personality Inventory has 550 items.
