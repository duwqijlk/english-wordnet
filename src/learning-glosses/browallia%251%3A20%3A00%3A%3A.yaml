simpleMeaning: any of several herbs grown for their blue, violet or white flowers, all of one plant group
scope: This is any of several herbs grown for their blue, violet or white flowers, all of one plant group;
  bush violet is another name for it, not a petunia and not a true violet.
examples:
- Browallia filled the border with blue flowers.
- She grew browallia in pots on the porch.
