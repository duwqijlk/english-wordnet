senseId: 'ordered%3:00:00::'
synsetId: 01671772-a
simpleMeaning: Laid out as a system, with each element coming after the one before it according to a fixed
  rule.
scope: This stresses a fixed rule that controls how one element follows another; it is not about the pleasing
  fit of parts in a design, and not just about things being put in some arrangement.
examples:
- The names appear in an ordered list, sorted by rank.
- In an ordered universe, every event follows a fixed law.
