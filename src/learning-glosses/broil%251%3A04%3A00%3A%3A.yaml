simpleMeaning: a way of cooking food with strong heat that hits it directly, as over a fire or under a
  grill
scope: 'Also called grilling and broiling: this is the way of cooking itself, not the verb for cooking
  food under strong heat.'
examples:
- A quick broil under the grill browned the top of the fish.
- Broiling the meat over an open fire cooked it quickly.
