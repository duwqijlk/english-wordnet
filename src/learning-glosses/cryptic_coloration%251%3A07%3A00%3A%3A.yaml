simpleMeaning: marks on an animal's body that hide its shape or make it look like something else
scope: Marks on an animal's body that hide its shape or make it look like something else, not bright marks
  meant to warn or attract.
examples:
- The moth's cryptic coloration made it blend with the bark.
- Its cryptic coloration hid the animal's shape from hunters.
