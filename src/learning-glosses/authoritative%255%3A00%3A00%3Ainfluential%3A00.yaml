simpleMeaning: having power over others and a strong effect on what they do or think
scope: This means having power and a strong effect on others, not given an official right to act, and
  not known as the best and most trusted source on a subject.
examples:
- The captain spoke in an authoritative voice and everyone listened at once.
- Her authoritative manner made the team follow her plan.
