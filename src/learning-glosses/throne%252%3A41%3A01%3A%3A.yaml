senseId: 'throne%2:41:01::'
synsetId: 02570461-v
simpleMeaning: to sit on the special chair used by a ruler
scope: This is the verb for sitting as a ruler. It is not the chair itself, not the power of a ruler,
  and not putting a new ruler in place.
examples:
- The queen sat throned in the great hall, ready to listen to her people.
- The old king throned there each day, watching over his court in silence.
