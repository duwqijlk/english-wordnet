simpleMeaning: Inside a closed ring of feelers, each one has both a mouth and an anus; it is one of several
  kinds of water animals like moss, usually in branching groups.
scope: This is one of several kinds of water animals like moss, not a plant, though it looks like one.
examples:
- Entoprocts usually grow in branching groups in the water.
- Each entoproct has both a mouth and an anus inside a closed ring of feelers.
