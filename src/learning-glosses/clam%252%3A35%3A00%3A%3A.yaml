simpleMeaning: To dig in the sand by the sea and pick up the shellfish that live there
scope: To gather the shellfish by digging, not the animal itself and not its flesh.
examples:
- We went clamming at low tide and filled a bucket by noon.
- They clammed all morning along the sandy shore.
