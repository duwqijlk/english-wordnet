senseId: 'deictic%3:01:00::'
synsetId: 03147071-a
simpleMeaning: of a word, when what it points to can only be known from the facts of how it is used
scope: This is about a word that points to different things as the facts around its use change; not the
  word itself that points to a person, place, or time.
examples:
- In 'this book', the word 'this' is deictic because it points to the book near the speaker.
- The word 'now' is deictic, since it means a different time each time it is said.
