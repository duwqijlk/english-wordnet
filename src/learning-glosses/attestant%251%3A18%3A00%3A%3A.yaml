senseId: 'attestant%1:18:00::'
synsetId: 10805946-n
simpleMeaning: In law, a person who signs a paper or a written name to say it is true, adding their own
  signature
scope: In law, this is a person who signs a paper or a written name to say it is true; witness, attestator
  and attestor are other names for this sense, not a person who speaks in court about what they saw and
  not the person who wrote the paper.
examples:
- The attestant signed the will to say the signature on it was true.
- An attestant adds their own signature to show the document is genuine.
