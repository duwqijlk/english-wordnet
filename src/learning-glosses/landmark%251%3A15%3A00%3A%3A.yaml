simpleMeaning: the place where a thing that stands out and is well known sits in a landscape
scope: The place of a big, well-known thing in a landscape, not an event that marks a change in history
  and not a point used in surgery.
examples:
- The church steeple provided a convenient landmark.
- We used the old oak as a landmark to find the path.
