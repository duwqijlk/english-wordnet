simpleMeaning: Thin and thick strokes differ little in these print letters, made after an 18th-century
  design, with uneven shapes and tall letters whose ends lean.
scope: Also called old style font, it is a kind of print lettering made after an 18th-century design.
examples:
- The printer chose old style for the book because its letters look uneven.
- You can tell old style by the leaning ends on its tall letters.
