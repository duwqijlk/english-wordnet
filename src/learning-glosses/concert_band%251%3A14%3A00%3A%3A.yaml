simpleMeaning: A group of players who play brass, woodwind, and drums and other struck instruments
scope: A group of players who play brass, woodwind, and drums and other struck instruments; military band
  is another name for this sense, not a string orchestra and not a single player.
examples:
- The concert band played brass, woodwind, and drums.
- Our school concert band gave a show on Friday.
