simpleMeaning: A blast from a volcano leaves a hole in the ground with a flat bottom, often full of water
scope: A flat-bottomed hole left by a volcanic blast, often full of water, not a tall volcano cone and
  not an ordinary lake.
examples:
- The maar held a still lake in its flat bottom.
- Hikers walked down into the maar to reach the water.
