simpleMeaning: A mix of the dark sticky stuff with crushed stones or sand, used especially for roads and
  also for roofs.
scope: A mix of the dark sticky stuff with stones or sand for roads and roofs, not the sticky stuff on
  its own, and not the act of covering a road with it.
examples:
- They laid fresh asphalt on the high street.
- The roof was sealed with asphalt.
