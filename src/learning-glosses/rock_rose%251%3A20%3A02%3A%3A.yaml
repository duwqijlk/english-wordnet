simpleMeaning: any of many kinds of a plant with small flowers in yellow, white, or a reddish colour,
  shaped like garden blooms
scope: 'Also called rockrose: a plant with small yellow, white, or reddish flowers, not a rock pink, which
  has pale red flowers, and not a garden shrub.'
examples:
- A rock rose spread its yellow flowers over the dry bank.
- The rock rose by the wall had small white flowers.
