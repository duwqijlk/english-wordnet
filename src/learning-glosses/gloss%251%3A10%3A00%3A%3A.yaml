simpleMeaning: an explanation or definition that tells what a hard word in a piece of writing means
scope: This is an explanation or definition that tells what a hard word in a text means, not a list of
  such words and not a false front put on to mislead.
examples:
- The book gives a gloss for each old word in the poem.
- She wrote a gloss in the margin to explain the strange term.
