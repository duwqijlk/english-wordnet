simpleMeaning: The feet or joints of hogs, eaten as food, kept in sour liquid, cooked slowly in liquid,
  or set in jelly.
scope: This is the feet or joints of hogs eaten as food; pigs' feet is another name for this sense, not
  fresh meat and not the feet of other farm animals.
examples:
- Pigs' knuckles were pickled and served cold.
- She stewed pigs' knuckles for dinner.
