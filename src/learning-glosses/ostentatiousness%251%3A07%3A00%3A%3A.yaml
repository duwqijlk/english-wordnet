senseId: 'ostentatiousness%1:07:00::'
synsetId: 04825154-n
simpleMeaning: A showy display without grace, made by someone puffed up with pride in themselves.
scope: A showy display without grace; inflation, puffiness and ostentation are other names for this sense,
  not a quiet display and not true pride in good work.
examples:
- His ostentatiousness at the party put everyone off.
- Her ostentatiousness showed in the gold and jewels she wore.
