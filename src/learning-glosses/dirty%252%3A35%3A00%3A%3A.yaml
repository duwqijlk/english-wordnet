simpleMeaning: To make something unclean or covered in filth.
scope: To put grime on something — another name for soil, begrime, grime, colly or bemire — not to be
  unclean already and not to spread radioactive contamination.
examples:
- Don't dirty your shirt before the photograph.
- The workers dirtied the floor with their muddy boots.
