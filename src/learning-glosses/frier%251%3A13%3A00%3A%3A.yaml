simpleMeaning: the meat of a young chicken of middle size, fit for cooking in hot fat
scope: This is the meat of a young chicken of middle size, fit for cooking in hot fat; fryer and pullet
  are other names for it, not an old hen or a chick.
examples:
- The butcher sold a fine frier for Sunday dinner.
- A frier is best cooked in a pan.
