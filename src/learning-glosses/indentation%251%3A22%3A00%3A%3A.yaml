simpleMeaning: the making of small pits in a surface as a result of corrosion (damage to a surface caused
  by chemicals)
scope: Also called pitting and roughness; this is about small holes in a surface made by damage over time,
  not about cutting notches into an edge and not about the space at the start of a line of writing.
examples:
- Indentation appeared on the metal plate after years in sea water.
- Close up, you could see indentation in the steel where small pits had formed.
