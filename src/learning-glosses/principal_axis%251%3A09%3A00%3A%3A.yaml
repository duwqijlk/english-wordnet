senseId: 'principal_axis%1:09:00::'
synsetId: 06019454-n
simpleMeaning: A straight line through the middle of the bend of a lens, along which light moves straight
  on, not bent and not thrown back
scope: 'Also called optic axis: a line through the middle of a lens where light goes straight, not a line
  where light bends and not a line through the edge of the glass.'
examples:
- The principal axis of the lens runs through its centre.
- Light that moves along the principal axis goes straight through the lens.
