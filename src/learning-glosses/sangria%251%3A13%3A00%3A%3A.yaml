simpleMeaning: a drink made of red wine with sugar, orange or lemon juice, and water with bubbles
scope: This drink is made from red wine and fruit juice; it is not plain wine and not a soft drink with
  no wine in it.
examples:
- She poured a glass of sangria at lunch.
- We shared a jug of cold sangria in summer.
