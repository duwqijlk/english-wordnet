simpleMeaning: a tool that measures how high a star, the moon, a planet, or another body stands in the
  sky
scope: A tool for measuring the height of a star, the moon, a planet, or another body in the sky, not
  a quarter of a circle and not one of the four areas of a graph.
examples:
- The sailor used a quadrant to find the star's height.
- With his quadrant, he measured the height of the moon.
