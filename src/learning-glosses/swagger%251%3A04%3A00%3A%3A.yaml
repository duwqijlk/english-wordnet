simpleMeaning: a stiff, proud way of walking, as if to show off
scope: A stiff, proud way of walking; prance is another name for this sense, and it is not the act of
  walking that way, which is the verb sense, or a showy manner of behaving in general.
examples:
- He entered the room with a swagger.
- Her swagger told everyone she felt sure of herself.
