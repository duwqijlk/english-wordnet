simpleMeaning: A light metal mixed with copper makes this hard stuff, which takes a hard pull without
  breaking and does not wear away in air and water.
scope: The name aluminum bronze means the same hard mix.
examples:
- The factory ordered aluminium bronze for parts that must take a hard pull without breaking.
- Valves of aluminium bronze showed no rust in damp air.
