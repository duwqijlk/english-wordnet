simpleMeaning: In the body, a disc of firm bendy tissue that pads the ends of bones where they meet at
  a joint
scope: 'Also called a meniscus: a disc of firm bendy tissue that pads bone ends at a joint, not a bone
  end itself and not a band that joins bones.'
examples:
- The semilunar cartilage pads the bones in his knee.
- A torn semilunar cartilage can make the knee lock.
