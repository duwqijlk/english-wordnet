simpleMeaning: a way of being that makes a person show anger they cannot hold back
scope: 'Also called temper, peevishness, and surliness: a person''s readiness to show anger they cannot
  hold back; not a body part being too quick to react, and not just one bad, cross feeling at one moment.'
examples:
- His irritability grew worse when he was tired, and he shouted at small problems.
- Her irritability meant that even a small delay could make her lose control and shout.
