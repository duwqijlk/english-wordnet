simpleMeaning: Blood for the lower lip alone runs through this side tube off the face tube.
scope: Also called inferior labial artery, it is the face tube's side branch that feeds the lower lip.
examples:
- Blood flowed to the lower lip through the arteria labialis inferior.
- The arteria labialis inferior branches off from the face tube.
