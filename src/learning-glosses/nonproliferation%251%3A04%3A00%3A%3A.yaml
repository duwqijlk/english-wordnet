simpleMeaning: Most of all, it stops more countries from getting nuclear weapons and stops things from
  growing or spreading
scope: Stopping things from growing or spreading, most of all stopping more countries from getting nuclear
  weapons; non-proliferation is another name for this sense, not getting rid of weapons that already exist.
examples:
- The nonproliferation treaty aims to stop more countries from getting nuclear weapons.
- Nonproliferation efforts try to keep dangerous weapons from spreading.
