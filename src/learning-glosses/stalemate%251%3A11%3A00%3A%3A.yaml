senseId: 'stalemate%1:11:00::'
synsetId: 07368680-n
simpleMeaning: In chess, a place in the game where a player cannot make a move without putting their own
  king in danger, so no one wins
scope: A chess position that ends the game with no winner; not checkmate, where one player wins, and not
  the verb sense about holding someone in such a position.
examples:
- The game ended in stalemate because every move would have put his king in danger.
- She had more pieces, but the position was a stalemate, so neither player won.
