simpleMeaning: the first workable camera for television pictures, invented in 1923 by Vladimir Kosma Zworykin
scope: The first working camera for television pictures, invented in 1923 by Zworykin, not a later camera
  and not the screen that shows the pictures.
examples:
- The iconoscope was the first practical television camera.
- Zworykin invented the iconoscope in 1923 to pick up television pictures.
