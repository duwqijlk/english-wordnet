simpleMeaning: A plant of southern Europe that lives many years, grown for feed and for its pink flowers
  full of nectar, which make it a valued source of honey.
scope: A plant of southern Europe that lives many years, grown for feed and for its pink flowers full
  of nectar, also called sulla and Hedysarum coronarium; it is a valued source of honey, unlike the other
  French honeysuckle with small crimson or white flowers.
examples:
- French honeysuckle covers the field with pink flowers full of nectar.
- Bees work the French honeysuckle all summer, and it gives much honey.
