simpleMeaning: a round drawing cut into wedge shapes, each wedge as big as its share of the whole
scope: A round drawing cut into wedge shapes by share of the whole, not a bar drawing and not a plain
  round shape.
examples:
- The pie chart showed how the money was shared out.
- She read the pie chart to see the biggest share.
