senseId: 'calorisator%1:06:01::'
synsetId: 92461316-n
simpleMeaning: A machine in a beet-sugar factory that heats the juice so the sugar spreads more easily
  into the water.
scope: 'Also called calorizator: a heater for beet juice in a sugar factory, not a boiler for water and
  not a press for the beets.'
examples:
- The calorisator heats the beet juice before the next stage.
- Workers checked the calorisator as the juice flowed through it.
