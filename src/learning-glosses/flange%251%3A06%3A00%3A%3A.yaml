simpleMeaning: a part that sticks out from an object, used to make it stronger or to join it to another
  object
scope: 'Also called a rim: this is a part that sticks out from an object, used to make it stronger or
  to join it to another object. It is not the outer edge of a wheel or the top edge of a cup, which are
  other senses of rim.'
examples:
- The pipe has a wide flange at the end so it can be joined to the next pipe.
- A metal flange around the base makes the post stronger.
