simpleMeaning: A person is put to death without pain, most often one with a sickness that cannot be cured
scope: This is putting a person to death without pain, also called euthanasia, not murder and not letting
  a sick person die without help.
examples:
- The doctor faced a hard choice about mercy killing for the dying man.
- Mercy killing is allowed by law in some countries.
