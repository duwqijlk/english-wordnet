simpleMeaning: to cut something into thin, flat pieces
scope: This verb means to cut food or other things into thin, flat pieces; it is not the golf shot that
  curves to the right, and not the flat tool for spreading paint.
examples:
- Please slice the bread into thin pieces for lunch.
- She sliced the cake and gave a piece to each child.
