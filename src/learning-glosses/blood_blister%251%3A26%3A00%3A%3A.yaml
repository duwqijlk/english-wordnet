simpleMeaning: a raised sore on the skin filled with dark red liquid, usually caused by a hurt
scope: A raised sore on the skin filled with dark red liquid, not a plain sore filled with clear liquid
  and not a bruise under the skin.
examples:
- He got a blood blister on his thumb after pinching it in the door.
- The blood blister on her heel came from her new shoes rubbing.
