simpleMeaning: A dish of poultry with tomatoes, mushrooms and herbs, made in the Italian way
scope: This is a dish of poultry with tomatoes, mushrooms and herbs made in the Italian way; chicken cacciatora
  and chicken cacciatore are other names for this sense, not a roast bird and not a soup.
examples:
- We ordered hunter's chicken at the Italian restaurant.
- The hunter's chicken was served with bread.
