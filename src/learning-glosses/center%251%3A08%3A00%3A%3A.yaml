simpleMeaning: a group of nerve cells that controls one particular function of the body
scope: This is not the main part of something; it is a group of nerve cells in the body.
examples:
- Damage to the brain's respiratory center can make breathing difficult.
- The cough center responds to irritation in the throat by triggering a reflex.
