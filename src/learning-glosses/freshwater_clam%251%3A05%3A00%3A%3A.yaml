simpleMeaning: a soft-bodied animal with two hard shells that lives in great numbers in rivers in the
  middle of the United States
scope: 'Also called freshwater mussel: a two-shelled river animal found in great numbers in the middle
  of the United States, not a sea animal with shells and not a snail.'
examples:
