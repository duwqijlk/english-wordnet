simpleMeaning: A slow ray of the torpedo-ray group rests on the sea floor, round in body, with an electric
  organ on each side of its head giving strong shocks.
scope: 'Also called torpedo, electric ray, and numbfish: a slow, round-bodied ray that gives strong shocks,
  not a stingray.'
examples:
- The crampfish lay on the sea floor.
- A crampfish can give a strong electric shock.
