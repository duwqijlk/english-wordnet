simpleMeaning: in a friendly, kind way that puts people at ease
scope: This means acting in a warm, friendly way. It is not acting in a cold, rude, or unfriendly way.
examples:
- He smiled affably and invited us to sit down.
- She spoke affably to every guest at the door.
