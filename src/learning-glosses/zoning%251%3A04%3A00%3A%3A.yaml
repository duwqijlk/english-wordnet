simpleMeaning: The act of splitting an area into parts, each part kept for a different use, such as homes,
  business, and making things
scope: This is the act of dividing land for different uses, not one single part of land and not a rule
  for one building alone.
examples:
- City zoning keeps factories away from homes.
- New zoning rules allow shops on this street.
