simpleMeaning: a showy part played alone by one player near the end of a piece of music
scope: A showy solo part near the end of a piece of music, not the main tune and not a part played by
  the whole group.
examples:
- The violinist played a cadenza that brought the hall to its feet.
- Her cadenza near the end of the piece showed all her skill.
