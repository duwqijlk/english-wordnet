simpleMeaning: Blood tubes at the side of the head in front of the ear come together to form the back
  branch of the blood tube of the face.
scope: Also called posterior facial vein and retromandibular vein, this is the back branch of the face's
  blood tube, formed where the tubes at the side of the head meet.
examples:
- The vena retromandibularis carries blood from the side of the head as the back branch of the face's
  blood tube.
- Blood from the side of the head flows through the vena retromandibularis in front of the ear.
