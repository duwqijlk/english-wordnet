simpleMeaning: a long hollow tube of metal or plastic that water, oil, gas and other like things can move
  through
scope: This is a long tube for water, oil or gas, not a tube for smoking tobacco and not parts of an organ.
examples:
- Water ran through a metal pipe under the street.
- They laid a new pipe to carry gas to the houses.
