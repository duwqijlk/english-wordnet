simpleMeaning: A cheat in which a person is tricked at gambling, or talked into buying a thing that is
  worth nothing.
scope: 'Also called a con, a sting, a hustle, bunco, a bunco game, bunko, a bunko game, a con game, a
  confidence game, or a confidence trick: a cheat in which a person is tricked at gambling or talked into
  buying a thing with no worth.'
examples:
- The flimflam cost him his savings at the card table.
- She saw through the flimflam before buying the worthless land.
