simpleMeaning: to use grain that was soaked in water, left to start growing and then dried, or a thing
  made from that grain, on or in something
scope: This means using grain that was soaked in water, left to start growing and then dried, or a thing
  made from that grain, on or in something else, not changing grain into that form and not the grain or
  the drink itself.
examples:
- The brewer malts the beer to give it a richer taste.
- They malt the liquid before it is bottled for sale.
