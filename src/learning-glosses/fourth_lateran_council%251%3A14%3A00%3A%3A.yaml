simpleMeaning: The church meeting of 1215, the most important of the Middle Ages; it issued a creed against
  Albigensianism, reform laws, transubstantiation, and church teaching on the Trinity and the Incarnation.
scope: The most important church council of the Middle Ages, held in 1215, known for its creed against
  Albigensianism and its teaching on transubstantiation, the Trinity, and the Incarnation.
examples:
- The Fourth Lateran Council met in Rome in 1215.
- The Fourth Lateran Council taught that bread and wine become the body and blood of Christ.
