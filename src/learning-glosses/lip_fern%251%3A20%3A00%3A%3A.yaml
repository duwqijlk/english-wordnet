simpleMeaning: any of several land ferns of one group, the group called Cheilanthes, found all over the
  world in dry and half-dry warm and cool lands
scope: 'Also called lipfern: any of several land ferns of one group, found in dry lands all over the world,
  not a fern that grows in water and not a tall tree-like fern.'
examples:
- We saw a lip fern growing in a dry crack in the rock.
- The lip fern grew on the hot, dry hillside.
