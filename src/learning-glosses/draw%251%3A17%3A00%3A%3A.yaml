simpleMeaning: a narrow channel worn in the ground by water, not as deep as a ravine.
scope: This is not a deep ravine, a river, or a game result; it is a shallow channel cut by water.
examples:
- A dry draw ran along the bottom of the hill.
- The cattle found shade in a shallow draw.
