simpleMeaning: Pinkish to purple blooms ringed by scales tipped with spines grow on this Mediterranean
  plant, which lives one or two years and now grows wild across America.
scope: Another name for caltrop, this Mediterranean plant with spine-ringed flowers; not the creeping
  poisonous tropical weed or the water plant with four-pronged edible nuts.
examples:
- Star-thistle has spread from the Mediterranean into America.
- The star-thistle's flower heads are ringed with spine-tipped scales.
