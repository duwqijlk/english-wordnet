senseId: 'interregnum%1:28:00::'
synsetId: 15298508-n
simpleMeaning: The gap in time after one ruler or government ends and before the next one starts.
scope: The gap in time between one reign or government and the next; not the reign itself.
examples:
- The interregnum lasted three months before a new king was crowned.
- During the interregnum, the council kept the country running.
