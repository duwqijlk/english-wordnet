simpleMeaning: to say hello to someone in a warm and joyful way
scope: To greet someone with joy, also called hail; not to call out to get someone's notice and not to
  announce something that is coming.
examples:
- The crowd heralded the returning team with cheers and songs.
- When the singer came on stage, the fans heralded her with loud cheers.
