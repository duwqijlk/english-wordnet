simpleMeaning: A made-up reason, or something else made up, that hides the true reason for what someone
  does or hides their plans
scope: A made-up reason, or something else made up, that hides the true reason for an act or hides plans,
  not a real reason and not a mere look of being something else.
examples:
- He left on the pretext of feeling ill.
- The meeting was a pretext to talk about the plan in secret.
