simpleMeaning: the change in electric charge in one place across the wall of a nerve cell as a signal
  moves along it
scope: The change in electric charge in one place in a nerve cell as a signal moves along it; not a steady
  charge in a cell at rest, and not a signal in a wire.
examples:
- The action potential travels along the nerve to the muscle.
- Scientists measured the action potential as the signal passed through the cell.
