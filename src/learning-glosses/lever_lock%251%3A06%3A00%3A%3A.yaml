senseId: 'lever_lock%1:06:00::'
synsetId: 03665276-n
simpleMeaning: In this fastening, flat bars that turn on a point must rise to a set height before the
  bolt can move
scope: A lock opened by raising flat bars to a set place, not a lock with pins and not a lock opened by
  a code.
examples:
- The old door had a lever lock.
- A lever lock needs its tumblers raised before the bolt moves.
