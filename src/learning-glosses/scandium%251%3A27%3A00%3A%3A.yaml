simpleMeaning: A white metal that can join with three other atoms, at times put in the rare earth group,
  found in a mineral of the far north of Europe
scope: This is a white metal found in a northern mineral; Sc and atomic number 21 are other names for
  it, and its nearest neighbours are the other rare earth metals.
examples:
- The sample contained scandium from the northern mineral.
- Scandium sits in the rare earth group in some lists.
