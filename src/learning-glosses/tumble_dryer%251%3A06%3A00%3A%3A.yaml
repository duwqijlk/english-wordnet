simpleMeaning: A machine that takes the wet out of clothes by turning them over and over in a drum of
  hot air
scope: This is a machine that takes the wet out of clothes by turning them over and over in a drum of
  hot air, also called tumble-dryer and tumble drier; not a washing machine and not a rack for drying
  clothes in the open air.
examples:
- The tumble dryer takes the wet out of the clothes in under an hour.
- He emptied the tumble dryer and folded the warm shirts.
