simpleMeaning: A heart beat with an extra sound in it, which can mean the heart is not well.
scope: This is a heart beat with an extra sound in it, also called a cantering rhythm; not a normal heart
  beat, and not a murmur from a valve.
examples:
- The doctor heard a gallop rhythm in the child's chest.
- A gallop rhythm can mean the heart is not well.
