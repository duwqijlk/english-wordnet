simpleMeaning: People at times cut this rough one-year panic plant for dry feed or leave it for animals
  to eat, though it grows all over the world as a weed.
scope: Also called barn millet and barn grass, this is a rough panic plant that grows all over the world,
  used at times for dry feed.
examples:
- We cut the barnyard grass for hay.
- The barnyard grass was left for the cows to graze on.
