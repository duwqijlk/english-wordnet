simpleMeaning: kept apart and not free to leave, especially for health reasons
scope: Kept apart for health reasons and not free to leave, not just far away from other places and not
  just separate from things next to it.
examples:
- The isolated patients stayed in a room by themselves until they got better.
- The sick dog was isolated so the illness would not spread to other dogs.
