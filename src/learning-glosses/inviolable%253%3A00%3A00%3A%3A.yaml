simpleMeaning: that cannot be broken or treated with no respect
scope: This is about a rule, a promise, or a sacred person that cannot be broken or treated with no respect;
  it is not a right that cannot be taken away, and it is not being safe from attack.
examples:
- The person of the king was held to be inviolable.
- They swore an inviolable oath and kept it all their lives.
