senseId: 'complex_sentence%1:10:00::'
synsetId: 06296212-n
simpleMeaning: A group of words that makes sense on its own, made of at least one main part and one part
  that leans on it
scope: A group of words that makes sense on its own, made of at least one main part and one part that
  leans on it; not a single short group of words and not two main parts joined with and.
examples:
- That complex sentence has one main part and one part that leans on it.
- She wrote a complex sentence with a main clause and a subordinate clause.
