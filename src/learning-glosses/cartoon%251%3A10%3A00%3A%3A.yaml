simpleMeaning: a drawing in a newspaper or magazine that is funny or makes fun of people or events
scope: 'Also called a sketch: a funny drawing in print, not a film made from many drawings shown one after
  another, and not the act of drawing such pictures.'
examples:
- The newspaper printed a cartoon about the mayor.
- She laughed at the cartoon on the back page of the magazine.
