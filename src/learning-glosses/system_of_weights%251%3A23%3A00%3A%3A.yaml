simpleMeaning: a set of fixed measures used to say how heavy a thing is
scope: A system of units for stating weight, with weight as another name for this sense, not a single
  unit such as a pound and not a set of scales.
examples:
- The system of weights in this country is metric.
- Cooks must know the system of weights used in a recipe.
