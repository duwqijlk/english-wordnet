simpleMeaning: Mosquitoes carry this infectious sickness of warm lands, marked by a rash and aching head
  and joints.
scope: Also called dengue, breakbone fever and dengue fever; this is the infectious, mosquito-spread sickness
  of warm lands, not a sickness of cold lands.
examples:
- He caught dandy fever from a mosquito bite.
- A rash and aching head marked her dandy fever.
