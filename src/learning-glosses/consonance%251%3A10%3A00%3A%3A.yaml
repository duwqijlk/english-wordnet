simpleMeaning: The use of the same consonant sounds again and again, especially at the ends of words.
scope: For repeated consonant sounds, especially at the ends of words, as in 'pitter patter'.
examples:
- The consonance in 'pitter patter' comes from the repeated t sounds.
- Poets use consonance to tie the ends of words together with the same sounds.
