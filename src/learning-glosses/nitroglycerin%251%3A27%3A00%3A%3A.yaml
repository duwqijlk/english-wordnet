simpleMeaning: A heavy, yellow, poisonous, oily, explosive liquid made by treating glycerol with nitrogen
  compounds; used in making explosives and, medically, to widen blood vessels. Trade names are Nitrospan
  and Nitrostat.
scope: Nitroglycerine and glyceryl trinitrate are other names for this same substance, not a different
  explosive or a different medicine that widens blood vessels.
examples:
- Nitroglycerin is a poisonous, oily liquid used in explosives.
- The doctor gave him nitroglycerin to widen his blood vessels.
