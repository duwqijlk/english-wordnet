simpleMeaning: In chemistry, a substance able to take part in chemical change or make it happen.
scope: Unlike the adjective senses for illness growing worse, forces ready for action, people who are
  ready to act, take part, feel energetic, exert influence or are busy, machines in service, the sun at
  its stormy peak, verbs naming an action or an actor subject, volcanoes that may erupt or are erupting,
  and people in full-time work, and unlike the noun for a grammar voice or an organization member, this
  is the chemistry noun for a substance that acts.
examples:
- The label lists the actives that protect the skin from ultraviolet light.
- Chemists measured how much of the active was left in the sample after heating.
