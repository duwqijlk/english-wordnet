simpleMeaning: to make an alternating current (electric power that goes one way, then the other) or its
  voltage (its strength) higher or lower
scope: This is about making electric power higher or lower, not putting a number or shape through a maths
  rule, and not changing a living cell with material from another cell.
examples:
- The machine transforms the current to a higher voltage for the long trip.
- Engineers transform the voltage down before the power goes into homes.
