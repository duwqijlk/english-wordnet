simpleMeaning: A layer of fat under the skin of whales and other big sea animals that keeps them warm,
  used to make oil.
scope: A layer of fat under the skin of whales and other big sea animals; not the crying of a person,
  which is a different sense of the word.
examples:
- Whalers once hunted the animals for their blubber.
- The blubber keeps the whale warm in cold seas.
