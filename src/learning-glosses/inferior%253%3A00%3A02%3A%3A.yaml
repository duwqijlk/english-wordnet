simpleMeaning: not as good as it should be, made or done to a poor standard
scope: Of poor quality, not the low rank of a person, not a mark printed below a letter, and not an orbit
  close to the sun.
examples:
- The cheap shoes were of inferior quality and wore out in a month.
- We sent back the inferior cloth because it tore too easily.
