simpleMeaning: making very strong demands all the time, without a break
scope: 'Also called stern: this means making very strong demands all the time, without a break; it is
  not about refusing to change your mind, and not about being exact with no change from a set rule.'
examples:
- Our strict teacher expects every piece of work to arrive on time.
- They set strict standards for safety and check them every day.
