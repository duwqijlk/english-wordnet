senseId: irritative%5:00:00:stimulative:00
synsetId: 02317865-s
simpleMeaning: It rouses the body to act, when it comes as a touch or another thing felt by the body
scope: Said of a thing felt by the body that rouses it to act, also called irritating; not a thing that
  soothes the body and not a thing that merely touches it without effect.
examples:
- The irritative agent made the muscle twitch.
- An irritative touch on the skin set the nerve firing.
