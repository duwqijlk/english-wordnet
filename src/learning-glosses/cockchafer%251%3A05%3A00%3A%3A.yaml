simpleMeaning: Any of several big European beetles that harm plants, both as grubs and as grown beetles.
scope: This is any of several big European beetles that harm plants, both as grubs and as grown beetles;
  not a beetle that harms plants only as an adult and not a small harmless beetle.
examples:
- The cockchafer ate the leaves of the young trees.
- Cockchafers can strip a hedge bare in a single summer.
