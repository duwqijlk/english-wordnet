synsetId: 02009792-v
simpleMeaning: to come back to the place it started from, in the same way a flat curved piece of wood
  comes back when it is thrown
scope: 'The verb sense: to come back to where it started. Not the curved wood thing you throw, and not
  a plan that harms the person who made it.'
examples:
- The disc boomeranged through the air and came back to the boy who threw it.
- The toy boomeranged in a wide curve and landed back in her hands.
