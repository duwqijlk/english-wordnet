simpleMeaning: a person hired at a port to move cargo between ships and the land
scope: A person hired at a port to move cargo between ships and the land, also called a dock worker, dock-walloper,
  docker, dockworker, loader and lumper, and not a sailor or a ship's captain.
examples:
- The dockhand helped unload the grain ship before dawn.
- Each dockhand was paid by the hour at the port.
