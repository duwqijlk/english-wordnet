senseId: 'practically%4:02:02::'
synsetId: 00023283-r
simpleMeaning: Used before a noun group to say that something is almost true, but not quite fully true
scope: Also called much, this word goes before a noun group to mean almost but not fully, not a word for
  doing things in a useful way.
examples:
- Practically everyone in the room had heard the news.
- Practically all the seats were full before the show began.
