simpleMeaning: A number that shows how well a student has done at a college or university, worked out
  by dividing all the grade points won by all those tried for.
scope: Also called a grade point average; a number that shows how well a student has done at a college
  or university, worked out by dividing all the grade points won by all those tried for.
examples:
- Her GPA shows how well she has done at the university.
- His GPA was worked out by dividing all the grade points he won by all those he tried for.
