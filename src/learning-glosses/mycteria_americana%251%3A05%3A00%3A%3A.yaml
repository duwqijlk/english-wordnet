scope: 'Also called flinthead, wood ibis and wood stork: an American stork that looks like the true ibises,
  with a bill that bends down, living in the wooded wet lands of the warm New World, not a true ibis.'
examples:
- The Mycteria americana waded through the swamp with its bill bent down.
- A Mycteria americana nested in the trees above the wooded swamp.
