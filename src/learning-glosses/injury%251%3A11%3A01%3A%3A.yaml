simpleMeaning: a wound suffered by military personnel in combat
scope: This is a military casualty from combat, not physical damage to the body, an accident that causes
  such damage, an act that causes harm, or wrongdoing against someone's rights.
examples:
- He still limped from an injury received at the front.
- The report listed the injuries suffered in the attack.
