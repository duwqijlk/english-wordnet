simpleMeaning: Blocked tubes that carry sweat, when the air is very hot and wet
scope: Blocked sweat tubes in hot, wet air, also called heat rash and prickly heat, not a sunburn and
  not a rash from soap.
examples:
- The baby got miliaria during the hot, wet summer.
- Miliaria broke out on his back in the heat.
