simpleMeaning: Known for the hard white nuts it bears, this palm of Brazil and Peru has no trunk.
scope: Also called ivory-nut palm and ivory plant, it is the palm of Brazil and Peru that is known for
  the hard white nuts it bears and has no trunk.
examples:
- The ivory palm of Peru bears hard white nuts.
- The ivory palm bears hard white nuts although it has no trunk.
