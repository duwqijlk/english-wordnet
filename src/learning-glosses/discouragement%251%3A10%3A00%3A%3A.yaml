senseId: 'discouragement%1:10:00::'
synsetId: 07268305-n
simpleMeaning: a way of showing you are against something and do not approve of it
scope: This is a way of showing you are against a thing; it is not the act of trying to stop a person
  or make them lose hope.
examples:
- The council's discouragement of the plan was clear in the way its members spoke against it.
- His loud discouragement showed that he was strongly against the idea.
