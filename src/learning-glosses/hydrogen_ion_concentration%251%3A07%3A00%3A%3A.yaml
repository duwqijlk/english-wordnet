simpleMeaning: The number of tiny charged bits of the lightest gas in each litre.
scope: How many tiny charged bits of the lightest gas there are in each litre, not the pH scale and not
  a measure of the gas itself.
examples:
- The hydrogen ion concentration tells chemists how sour a liquid is.
- A low hydrogen ion concentration means the liquid is not very sour.
