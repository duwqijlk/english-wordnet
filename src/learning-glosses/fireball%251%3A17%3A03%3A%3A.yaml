simpleMeaning: a round mass of fire, like the sun or a round flash of lightning
scope: This is a round mass of fire, like the sun or a flash of lightning, not a bright shooting star.
examples:
- The fireball of the sun sank behind the hills.
- A fireball hung in the sky like a second sun.
