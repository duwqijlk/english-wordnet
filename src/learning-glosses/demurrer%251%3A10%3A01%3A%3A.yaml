senseId: 'demurrer%1:10:01::'
synsetId: 06574793-n
simpleMeaning: In law, a court paper that claims the other side's written case is not good enough in law
  to be heard
scope: This is a court paper that attacks whether the other side's written case is good enough in law;
  not a formal objection to a single point and not a plea of guilty.
examples:
- The demurrer claimed the papers failed to state a real case.
- His demurrer said the claim had no legal basis.
