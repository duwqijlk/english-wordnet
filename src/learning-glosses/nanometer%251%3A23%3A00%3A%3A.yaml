simpleMeaning: One part in a thousand million of one standard unit of length is this small measure
scope: 'Also called a nanometre, a millimicron, a micromillimeter or nm: one thousand-millionth part of
  one standard unit of length, not a big unit and not a unit of weight.'
examples:
- The nanometer is far too small to see with the eye alone.
- The film is only a few nanometers thick.
