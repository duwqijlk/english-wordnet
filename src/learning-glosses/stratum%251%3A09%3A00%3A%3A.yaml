senseId: 'stratum%1:09:00::'
synsetId: 06257026-n
simpleMeaning: An abstract place, usually seen as going deep down, such as a level of sense in a work
  or a thought.
scope: Also called level or layer, an abstract place, usually seen as going deep down, such as a level
  of sense in a work or a thought; not one of several parallel layers of stuff laid one on top of another,
  such as tissue or cells in a living thing or rock laid down over time, and not a set of people picked
  out for a sample split into levels.
examples:
- The actor worked on several strata of meaning at once.
- A good joke has two strata, one plain and one hidden.
