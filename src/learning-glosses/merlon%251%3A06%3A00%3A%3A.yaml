simpleMeaning: the solid part between two gaps along the top of a wall built to protect a place, with
  solid parts and gaps following each other in a line
scope: A solid part between two gaps at the top of a wall built to protect a place; not the gap itself
  and not the whole top part of the wall.
examples:
- The guard hid behind a merlon at the top of the castle wall.
- An arrow flew over the merlon and hit the wall behind it.
