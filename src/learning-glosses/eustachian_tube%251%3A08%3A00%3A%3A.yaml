simpleMeaning: One of two passages joining the middle ears to the back of the nose and throat, that keeps
  air pressure the same on both sides of the eardrum
scope: One of the paired passages from the middle ears to the back of the nose and throat, keeping air
  pressure even on both sides of the eardrum; auditory tube is another name for it, not a tube of the
  outer ear.
examples:
- The Eustachian tube joins the middle ear to the back of the nose.
- When the Eustachian tube is blocked, the ears feel full.
