simpleMeaning: a flat part fixed on the back of a car to cut the push of air that lifts the car at high
  speed
scope: A flat part on the back of a car, not the flat part on a plane wing, not a person who gives someone
  too much, and not a person who takes things in war.
examples:
- The sports car has a large spoiler on its back.
- At high speed, the spoiler helps keep the car firm on the road.
