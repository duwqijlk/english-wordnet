simpleMeaning: A song that tells a story and has a chorus that keeps returning.
scope: This is the story song with a repeated chorus, not the narrative poem, and not the verb for imposing
  a duty.
examples:
- The sailors sang a lay with a chorus everyone knew.
- She learned the old lay by heart, chorus and all.
