simpleMeaning: the group of people who make laws, change them, or end them
scope: The group of people who make, change or end laws for a place, not a single law and not one person
  who makes laws alone.
examples:
- The legislature passed a new law on clean water.
- Members of the legislature voted to end the old tax law.
