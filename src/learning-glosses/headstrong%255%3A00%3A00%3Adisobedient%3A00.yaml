simpleMeaning: having a habit of not obeying and of fighting against what others want
scope: 'Also called willful and wilful: a person who by habit does not obey and fights against others,
  not a person who simply has one strong view once.'
examples:
- The headstrong boy refused to listen to his teacher again and again.
- She was headstrong and always argued when told what to do.
