simpleMeaning: A heat gauge pushed into the middle of a roast, with its top kept away from the heat, to
  tell how well cooked the flesh is
scope: A heat gauge pushed into the middle of a roast, with its top kept away from the heat, to tell how
  well cooked the flesh is; not an oven gauge and not a gauge for sweets.
examples:
- She pushed the meat thermometer into the roast.
- The meat thermometer showed the flesh was done.
