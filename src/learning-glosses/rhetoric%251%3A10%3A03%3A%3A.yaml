simpleMeaning: talk that is loud, mixed up, and has nothing real in it
scope: 'Also called palaver: this is loud, mixed-up talk with nothing in it, not talk in a high, fancy
  style with too many fine words.'
examples:
- His speech was mere rhetoric, loud words with no plan behind them.
- We heard a lot of rhetoric but got no real answers.
