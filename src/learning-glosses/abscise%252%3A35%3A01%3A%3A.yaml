simpleMeaning: After scar tissue forms, a plant drops its blooms, leaves and fruit.
scope: This is what a plant does when scar tissue forms and it drops blooms, leaves and fruit, not the
  name for the dropping itself.
examples:
- The tree will abscise its leaves once scar tissue forms.
- After the scar tissue formed, the plant began to abscise its fruit.
