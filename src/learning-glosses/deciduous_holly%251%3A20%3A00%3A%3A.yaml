simpleMeaning: a tree that loses its leaves each year, also called possumhaw
scope: This is a tree that loses its leaves each year, also called possumhaw or swamp holly, not a tree
  that keeps its leaves all year and not a bush.
examples:
- Deciduous holly lines the edge of the wet field.
- In winter the deciduous holly stands bare, with no leaves.
