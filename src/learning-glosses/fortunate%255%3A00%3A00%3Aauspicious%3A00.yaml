simpleMeaning: giving a sign that good things are likely to happen in the future
scope: A sign that good things are likely to come, as with a good choice or a good start. This is not
  having good luck that you did not expect.
examples:
- She made a fortunate decision to go to medical school.
- It was a fortunate start to their new life together.
