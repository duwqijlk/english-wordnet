simpleMeaning: A unit that measures how strongly something gives off rays, set at the amount that breaks
  apart 37,000,000,000 times in one second
scope: This is a unit for the strength of rays from a breaking-apart stuff, not a unit of weight and not
  a unit of heat.
examples:
- The sample gave off ten curies of radiation.
- A curie is a very large unit of radioactivity.
