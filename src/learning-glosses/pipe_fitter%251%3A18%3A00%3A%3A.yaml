simpleMeaning: a skilled worker who puts in and mends tubes and the taps and machines joined to them
scope: 'Also called plumber: a skilled worker who puts in and mends tubes and the taps and machines joined
  to them, not a builder and not an electrician.'
examples:
- The pipe fitter came to mend the leaking tap.
- A pipe fitter put in the new bathroom tubes.
