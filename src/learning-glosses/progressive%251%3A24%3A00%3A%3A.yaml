senseId: 'progressive%1:24:00::'
synsetId: 13827946-n
simpleMeaning: a verb form that shows an action still going on at the time you speak of it
scope: 'Also called imperfect: a verb form for an action still going on, not a person who backs reform
  and not a tax that rises with income.'
examples:
- The progressive form 'is running' shows the action still going on.
- In 'she was reading', the progressive shows an action in the middle of happening.
