senseId: 'hydrothorax%1:26:00::'
synsetId: 14344029-n
simpleMeaning: Fluid builds up in the space between the lungs and the walls of the chest, often because
  of disease of the heart or kidneys.
scope: This is fluid that gathers in the chest, not a sickness of the lungs themselves.
examples:
- The doctor found hydrothorax on the X-ray, with fluid round both lungs.
- Hydrothorax was found when fluid showed between his lungs and his chest wall.
