simpleMeaning: a thing used to draw fish or other animals into danger, so they can be caught or killed
scope: A thing used to draw fish or other animals into danger so they can be caught or killed, also called
  bait, not the act of talking a person into a thing and not the drawing power of a thing.
examples:
- The fisherman put a lure on his hook.
- The lure drew the fish into the trap.
