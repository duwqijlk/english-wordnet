senseId: 'hyperkalemia%1:26:00::'
synsetId: 14293058-n
simpleMeaning: too much potassium, a salt in the body, in the blood that moves around the body, linked
  to kidney failure or, at times, to water pills
scope: Too much potassium in the blood that moves around the body; not too much of a fatty substance in
  the blood and not low potassium.
examples:
- Her hyperkalemia was caused by kidney failure.
- The doctor warned that hyperkalemia can follow the use of water pills.
