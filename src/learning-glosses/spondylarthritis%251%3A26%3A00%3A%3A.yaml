simpleMeaning: a painful swelling of one or more of the joints between the bones in the back
scope: A swelling of the joints between the bones of the back, not a swelling of a knee or shoulder joint
  and not a wearing out of the bones themselves.
examples:
- His back pain was caused by spondylarthritis in the joints between his back bones.
- The doctor said the spondylarthritis was making the joints in her spine stiff.
