simpleMeaning: any close group of people who are joined together and trust each other
scope: This sense is any close, trusted group of people, not only the large crime group from Sicily and
  not a crime group in general.
examples:
- A small mafia of senior teachers runs the school timetable.
- He joked that a mafia of old friends controls the local tennis club.
