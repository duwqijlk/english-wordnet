simpleMeaning: A great deal of tough, fine thread, spun by the young of a large moth, makes the case it
  wraps itself in.
scope: Also called a silkworm or a wild silkworm, this names the young of a large moth, not the grown
  moth itself.
examples:
- The giant silkworm spun a case of fine thread around itself.
- Inside its case, the giant silkworm waited to grow into a moth.
