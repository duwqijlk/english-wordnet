simpleMeaning: of or about the way a person takes in and knows things through the senses
scope: This word is about taking in the world through the senses, such as by seeing and hearing. It is
  not about thinking through facts step by step, and not about the body parts that see or hear.
examples:
- The test checks perceptual skills, like seeing small differences in shape.
- A baby's perceptual growth helps her know faces by sight.
