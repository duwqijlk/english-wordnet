senseId: vegetative%5:00:00:asexual:00
synsetId: 02144077-s
simpleMeaning: In breeding, done by means that need no mate.
scope: This sense is also called vegetal, for what is, in breeding, done by means that need no mate, unlike
  the sense for what has to do with bodily acts beyond will, unlike the sense for a dull, passive sort
  of activity, and unlike the sense for what is made of plants.
examples:
- The growth was vegetative, needing no mate.
- The breeding was vegetative, done with no mate.
