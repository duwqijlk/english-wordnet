simpleMeaning: Bothered again and again over time, most of all by small things that keep getting in the
  way
scope: Annoyed and harassed are other names for this sense; this is about being troubled by small things,
  not about a hard question that no one can settle.
examples:
- The vexed parents of the unruly teenager had heard enough.
- She gave a vexed sigh at the constant interruptions.
