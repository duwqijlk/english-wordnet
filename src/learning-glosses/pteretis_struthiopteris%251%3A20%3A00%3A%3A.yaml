simpleMeaning: A tall fern of the cool northern lands with graceful bending leaves and spore-bearing leaves
  that look like the long feathers of an ostrich.
scope: Also called fiddlehead, ostrich fern, shuttlecock fern, Matteuccia struthiopteris and Onoclea struthiopteris;
  a tall fern of the cool northern lands with graceful bending leaves and spore-bearing leaves like ostrich
  feathers.
examples:
- Pteretis struthiopteris grew tall beside the stream, its fronds arching over the water.
- The young shoots of Pteretis struthiopteris curled like fiddleheads in spring.
