simpleMeaning: a part such as a switch, lever, or dial that sets how a machine works.
scope: This is not the act of managing something, not a policy that limits prices, and not a spirit helper
  at a sitting; it is a physical part that sets how a machine works.
examples:
- The volume control is on the left side of the radio.
- He reached for the control that lowers the landing gear.
