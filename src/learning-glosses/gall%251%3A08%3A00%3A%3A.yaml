simpleMeaning: A juice made by the liver and kept in a small bag beside it, which helps the body break
  down fats in food.
scope: A juice from the liver that helps break down fats, also called bile, not rudeness, not a plant
  swelling, and not a horse sore.
examples:
- Gall helps the body break down fats in food.
- Too much gall can upset the stomach.
