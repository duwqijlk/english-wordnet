senseId: 'patronage%1:04:01::'
synsetId: 01156356-n
simpleMeaning: In politics, giving help, government jobs, or work deals to people in return for their
  political support
scope: In politics, help and jobs given for political support; it is not talking down to a person as if
  they were less, and not the support given by a regular customer or backer.
examples:
- The mayor used patronage to give city jobs to people who had helped him win.
- Critics said the new jobs were patronage, given in return for votes.
