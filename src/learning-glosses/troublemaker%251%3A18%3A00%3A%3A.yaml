senseId: 'troublemaker%1:18:00::'
synsetId: 10750901-n
simpleMeaning: a person who on purpose starts problems or fights between people
scope: This is a person who starts problems on purpose, not a person who has problems and not a person
  who starts a problem by chance.
examples:
- The teacher called him a troublemaker for starting fights in class.
- As a troublemaker, he often set one friend against another.
