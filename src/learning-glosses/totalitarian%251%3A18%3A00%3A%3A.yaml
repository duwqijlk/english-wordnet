simpleMeaning: a person who supports the idea that one government should have full control, or who supports
  a government of that kind
scope: A person who supports a government with full control. This is not the word for the government itself,
  and not the word for things linked to that kind of government.
examples:
- As a totalitarian, he wanted one party to rule everything.
- She was a totalitarian who worked to bring a government with full control to power.
