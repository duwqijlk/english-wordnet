simpleMeaning: A small fish with spiny fins, like a sea bream, found in bays along the south-east coast
  of the United States.
scope: This is a small fish with spiny fins, like a sea bream, found in bays along the south-east coast
  of the United States; not a large fish, and not a fish of the open sea.
examples:
- The pinfish swam in the shallow bay.
- Pinfish have sharp spiny fins.
