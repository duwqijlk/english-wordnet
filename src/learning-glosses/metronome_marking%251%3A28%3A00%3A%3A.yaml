simpleMeaning: How fast music goes, counted by the number of beats in one minute
scope: 'Also called beats per minute and bpm: the speed of a piece of music, not the loudness and not
  the beat of a single drum.'
examples:
- The metronome marking at the top of the page said 120.
- She set the metronome marking before she began to play.
