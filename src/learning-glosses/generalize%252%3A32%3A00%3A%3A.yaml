senseId: 'generalize%2:32:00::'
synsetId: 01024915-v
simpleMeaning: to speak or write in broad words, not about single cases or details
scope: 'Also called generalise: to speak or write in broad words, not to draw a broad rule from single
  cases and not to make something popular for all people.'
examples:
- The teacher generalizes when she talks, saying that young people are all lazy.
- He tends to generalize in his essays instead of giving single examples.
