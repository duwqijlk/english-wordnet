simpleMeaning: a nerve that parts into two nerves for the lower leg after running from the nerves at the
  base of the back down the thigh to about the middle
scope: 'Also called nervus ischiadicus: a nerve that runs down the thigh and parts in two, not a nerve
  of the arm and not a nerve that stays in the back.'
examples:
- The sciatic nerve runs down the back of the thigh.
- Damage to the sciatic nerve can cause pain down the leg.
