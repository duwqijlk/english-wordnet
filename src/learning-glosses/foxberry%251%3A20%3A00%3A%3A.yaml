scope: 'Also called cowberry, lingberry, lingenberry, lingonberry and mountain cranberry: a low shrub
  with red berries you can eat, not a tall bush and not a cranberry bog plant.'
examples:
- Foxberries grow low on the hillside, and we picked their red berries for jam.
- The foxberry keeps its leaves through the winter and bears bright red berries.
