simpleMeaning: A low plant that lives for years, with usually two big long lance-shaped leaves and a cluster
  of small sweet-smelling hanging bell-shaped flowers, then bright red berries
scope: Also called lily of the valley or Convallaria majalis; a low plant with usually two big long leaves
  and hanging bell-shaped flowers, then bright red berries.
examples:
- The May lily bloomed in the shade, its small bell-shaped flowers sweet in the air.
- We found May lily under the trees, its bright red berries easy to spot.
