  level with the bar
scope: To pull yourself higher while hanging by your hands until the lower edge of your face is level
  with the bar; chin is another name for this sense, not a pull-up on a rope and not a jump.
examples:
- He did ten chin ups after his run.
- She can do twenty chin ups without stopping.
