simpleMeaning: A machine that cleans the blood by passing it through a filter (dialysis), taking out waste
  and dirt before the blood goes back into the body
scope: A machine that cleans the blood, also called a hemodialyzer; not the body's own blood-cleaning
  organ and not a blood pump.
examples:
- The artificial kidney cleaned her blood three times a week.
- An artificial kidney takes over when the kidneys fail.
