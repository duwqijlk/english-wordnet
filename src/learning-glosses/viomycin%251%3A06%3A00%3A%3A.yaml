simpleMeaning: a germ-killing drug, a basic chain of small parts, sold as Viocin, given by a shot into
  a muscle, with other drugs, to treat tuberculosis
scope: A germ-killing drug for tuberculosis, sold as Viocin; not a pill and not a drug for colds.
examples:
- The doctor gave him viomycin for his tuberculosis.
- Viomycin is given by a shot into a muscle, with other drugs.
