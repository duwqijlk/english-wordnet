simpleMeaning: a drug vets use to stop animals feeling pain during treatment, taken against the law, at
  first as a powder, for its power to change what people see and hear
scope: A drug vets use to stop animals feeling pain during treatment, also taken against the law for its
  mind-changing effects; angel dust and phencyclidine hydrochloride are other names for this sense, not
  a drug that stops people feeling pain during treatment and not a drug that calms pain.
examples:
- The vet gave the dog phencyclidine so it would feel no pain during the operation.
- Phencyclidine was first taken as a powder for the strange sights it brought.
