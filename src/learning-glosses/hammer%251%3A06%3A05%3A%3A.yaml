simpleMeaning: a heavy metal ball joined to a wire that bends, used in a sport where a person throws it
  as far as they can
scope: This is the heavy metal ball on a wire for a throwing sport, not the hand tool for nails and not
  the light stick for music.
examples:
- The athlete swung the hammer round and round and then let it fly.
- In the hammer throw, she spun twice before she let go.
