simpleMeaning: a cloth for use on a table, made from linen, with a pattern woven into the cloth
scope: This is cloth for a table made from linen with a woven pattern, not the general fabric with such
  a pattern used for other things.
examples:
- She spread a white damask over the table before dinner.
- The damask on the table had a pattern you could see in the light.
