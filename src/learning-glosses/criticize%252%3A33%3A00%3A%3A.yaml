simpleMeaning: to take the part of a critic, judging a thing and saying what is good or bad in it
scope: To take the part of a critic, judging a thing and saying what is good or bad in it; not to point
  out faults alone.
examples:
- Those who criticize others are often far from perfect.
- She liked to criticize the new plays in the town paper.
