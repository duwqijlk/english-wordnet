simpleMeaning: the way a piece of music, a part in a play, or something like them is performed
scope: A performance of music or a role, not the act of explaining and not a drawing of a design.
examples:
- They heard a live rendering of three pieces by Schubert.
- Her rendering of the queen won praise.
