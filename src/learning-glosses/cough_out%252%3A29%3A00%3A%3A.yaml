simpleMeaning: to bring thick wet stuff up from the lungs and through the mouth
scope: To bring thick wet stuff up from the lungs and through the mouth; cough up and expectorate are
  other names for this sense, not swallowing it and not spitting out food.
examples:
- He coughed out a thick lump of phlegm.
- She coughed out the mucus that had filled her chest.
