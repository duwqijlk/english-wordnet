simpleMeaning: A very light colourless element, one of the six inert gases, the hardest gas to liquefy;
  found in amounts worth taking from certain natural gases, as in Texas and Kansas.
scope: 'Also called He and helium: a very light colourless element, one of the six inert gases, not a
  heavy gas and not a gas that burns.'
examples:
- Atomic number 2 fills the balloon so it floats.
- Helium, atomic number 2, will not burn.
