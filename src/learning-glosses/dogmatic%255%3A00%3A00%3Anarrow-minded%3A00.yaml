senseId: dogmatic%5:00:00:narrow-minded:00
synsetId: 00288936-s
simpleMeaning: marked by stating ideas as if they are true, when they have not been proved and cannot
  be proved
scope: 'Also called dogmatical: this describes stating ideas as true when they are not proved and cannot
  be proved, not just being about a set of accepted beliefs.'
examples:
- She made dogmatic claims about the future that no one could prove.
- His dogmatic way was to state his own ideas as facts, even though he had no proof.
