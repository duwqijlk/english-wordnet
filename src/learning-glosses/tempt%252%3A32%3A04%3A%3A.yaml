simpleMeaning: To push a person to do a thing by making promises or by talking them round, often with
  promises that are not true or are too big
scope: Pushing a person to act with promises or talk, not winning them over by charm, not leading them
  gently toward a thing, and not drawing them in by being pleasant to look at.
examples:
- The ad tempted him to buy a car he could not afford.
- She tempted the guard with the promise of a large sum of money.
