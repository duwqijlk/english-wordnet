senseId: voiceless%5:00:00:inaudible:00
synsetId: 00175980-s
simpleMeaning: said in a very quiet way, with breath only and almost no sound
scope: This describes something said with breath only and almost no sound, not a speech sound made without
  any shaking of the vocal cords (the parts in the throat that make the voice), and not being unable to
  speak, except by whisper, because of illness or hurt.
examples:
- Her voiceless whisper could hardly be heard.
- He gave a voiceless plea for help.
