simpleMeaning: to show how dark an area is where light does not reach it, in a picture or drawing
scope: This is the verb for showing dark areas in a picture or drawing; it is not the dark area itself,
  and not a cover for a lamp or against the sun.
examples:
- She shaded the side of the house under the tree in her drawing.
- He shaded the corners of the picture to make them look darker.
