simpleMeaning: A sweet-smelling bush from lands around the Mediterranean, grown in many places for its
  pale purple flowers, which are dried and put in small scented bags.
scope: A sweet-smelling Mediterranean bush grown for its pale purple flowers, also called Lavandula angustifolia
  and Lavandula officinalis; the flowers are dried and put in small scented bags.
examples:
- English lavender fills the garden with scent in summer.
- She dried the English lavender and put it in small bags for the drawers.
