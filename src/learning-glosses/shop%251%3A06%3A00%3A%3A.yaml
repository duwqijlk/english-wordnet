simpleMeaning: A building or place where goods or services are sold to the public.
scope: This is not a place where goods are made by hand and not a class in a trade; it is a place that
  sells goods or services to customers.
examples:
- There is a small shop on the corner that sells fresh bread.
- Most of the shops in the town centre stay open until late.
