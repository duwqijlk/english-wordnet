simpleMeaning: a fuel made from a hydrocarbon, a substance that burns, that catches fire easily and is
  burned in lamps and heaters
scope: A fuel that catches fire easily and is burned in lamps and heaters; kerosene, kerosine and lamp
  oil are other names for this sense, not a fuel for cars and not a cooking fat.
examples:
- She filled the lamp with coal oil before dark.
- The heater ran on coal oil through the cold night.
