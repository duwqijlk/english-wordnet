simpleMeaning: the act of pulling back or taking away something or someone
scope: The act of pulling back or taking away; not the taking of blood or growths from the body, which
  is another sense of withdrawal, and not a formal break from a group.
examples:
- The withdrawal of French troops from Vietnam took months.
- His sudden withdrawal from the race surprised everyone.
