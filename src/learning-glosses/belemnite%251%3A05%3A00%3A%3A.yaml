simpleMeaning: A pointed, cone-shaped stone fossil from the hard inner shell of an extinct squid-like
  animal, with a hollow at its wider end that may hold a small chambered shell.
scope: The pointed stone fossil of the animal's inner shell, not the living squid-like creature or a modern
  shell.
examples:
- She found a belemnite in the soft chalk of the cliff.
- The museum displays belemnites beside a model of a squid.
