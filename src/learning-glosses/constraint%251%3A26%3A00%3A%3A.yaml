simpleMeaning: the state of being held back or kept from moving freely
scope: The state of being held back or kept from moving freely, not the act of forcing people and not
  a device that slows a thing.
examples:
- The dogs were kept under constraint in the yard.
- He hated the constraint of the tight seat belt.
