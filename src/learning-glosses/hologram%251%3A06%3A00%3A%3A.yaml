simpleMeaning: A photo or record made as a middle step that holds what is needed to make again an image
  that looks solid, with length, width and depth
scope: 'Also called holograph: this photo record made as a middle step for building an image with depth,
  not the finished image itself and not a normal flat photo.'
examples:
- The hologram on the film held the facts needed to rebuild the image.
- He kept the hologram in a dark box so the record would not be spoiled.
