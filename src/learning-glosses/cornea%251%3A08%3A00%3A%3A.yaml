simpleMeaning: The clear, rounded front layer of the eye that lies over the coloured ring and the dark
  centre, blending into the white outer coat.
scope: The clear front of the eyeball, not the coloured iris or the white sclera it joins.
examples:
- A scratch on the cornea can make the eye water and sting.
- Contact lenses rest directly on the cornea.
