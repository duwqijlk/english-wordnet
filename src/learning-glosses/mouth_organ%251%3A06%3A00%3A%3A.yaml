simpleMeaning: Held to the lips, this small box-shaped thing sounds when you blow into one air hole, where
  a row of thin strips that shake free sits set back.
scope: It is also called a harp, a harmonica and a mouth harp, and it is the small box-shaped one held
  to the lips and played by blowing into one of its air holes.
examples:
- She held the mouth organ to her lips and blew.
- He played a tune on the mouth organ.
