simpleMeaning: a piece that a person puts over or into their mouth
scope: A part that fits over or into a person's mouth; not the mouthpiece of a pipe or a wind instrument,
  and not a telephone mouthpiece.
examples:
- The mouthpiece of a respirator must fit tightly.
- She cleaned the mouthpiece before putting it on.
