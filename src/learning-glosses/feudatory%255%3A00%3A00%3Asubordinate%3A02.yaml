simpleMeaning: in old times, under a ruler's power, or owing loyalty to that ruler
scope: To do with a land or person under a ruler's power and owing that ruler loyalty, not a free land
  and not the bond between a landholder and a lord.
examples:
- The small state remained feudatory to India until 1365.
- The province stayed feudatory to the king for many years.
