simpleMeaning: A long-lived wet-ground plant with dark red flowers and flat, broad-winged leaf-tubes in
  a ring; it grows in northeastern North America and now grows wild in Europe, especially Ireland.
scope: Also called the common pitcher plant, huntsman's cup, and huntsman's cups; it is a wet-ground plant
  with tube-like leaves, not an ordinary garden flower.
examples:
- Sarracenia purpurea grows in the wet ground near the lake.
- The dark red flowers of Sarracenia purpurea open in early summer.
