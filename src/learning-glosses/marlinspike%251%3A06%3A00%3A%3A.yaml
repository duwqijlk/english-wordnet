simpleMeaning: a pointed iron tool held in the hand, used to part the strands of a rope or cable when
  joining them
scope: A pointed iron hand tool for parting rope strands; marlinespike and marlingspike are other names
  for this sense, not a knife and not a hook for pulling rope.
examples:
- He used a marlinspike to open the strands of the rope.
- The sailor kept a marlinspike in his tool bag.
