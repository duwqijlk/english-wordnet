simpleMeaning: a person who strongly supports freedom for people and wants the government to control as
  little as possible
scope: This names a person who holds this view about freedom and small government; it does not name the
  view itself.
examples:
- As a libertarian, she opposes most government controls on business.
- The libertarian spoke in favor of lower taxes and more personal freedom.
