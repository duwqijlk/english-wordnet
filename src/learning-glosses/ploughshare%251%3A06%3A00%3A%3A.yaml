simpleMeaning: A sharp wedge of steel for cutting loose the top layer of soil
scope: A sharp wedge of steel for cutting loose the top layer of soil; share and plowshare are other names
  for this sense, and this is not the whole plough.
examples:
- The ploughshare cut the top layer of soil loose.
- He fitted a new ploughshare to the plough.
