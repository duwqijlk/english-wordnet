simpleMeaning: a mark in the shape of a pointed head, used to show that a thing belongs to the British
  state
scope: A mark in the shape of a pointed head that shows a thing belongs to the British state, not a mark
  on convicts' clothing and not a mark on a road sign.
examples:
- The broad arrow was stamped on the crate.
- A broad arrow marked the old army blanket.
