simpleMeaning: one sixtieth of a minute; the basic unit for measuring time in the international system
  of units
scope: 'Also called second: a unit of time, one sixtieth of a minute; not the maths word sec used with
  triangles.'
examples:
- The timer counts down the last ten secs before the start.
- Each sec on the clock is one sixtieth of a minute.
