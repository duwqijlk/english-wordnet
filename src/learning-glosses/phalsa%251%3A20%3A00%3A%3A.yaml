simpleMeaning: A shrub from Asia that looks like a small tree and resists drought, bearing small red fruits
  that are edible and pleasantly tart, often used in sherbets.
scope: The shrub itself, not just its fruit or the sherbet made from it.
examples:
- The phalsa in our yard looks almost like a small tree.
- Farmers here plant phalsa because it survives long dry spells.
