simpleMeaning: Packed tight together, with very little space between its small parts.
scope: This is stuff packed tight together from very small parts; fine-grained is another name for it,
  not stuff with big open gaps between its parts.
examples:
- The close-grained birch felt smooth under my hand.
- Close-grained rock splits cleanly along its tight lines.
