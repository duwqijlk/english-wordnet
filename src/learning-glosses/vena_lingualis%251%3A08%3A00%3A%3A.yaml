simpleMeaning: Blood from the tongue and the floor of the mouth runs through this tube into the inner
  neck blood tube or the face blood tube.
scope: Also called lingual vein, this tube serves the tongue and the floor of the mouth, sending blood
  to the neck or the face.
examples:
- Blood leaves the tongue through the vena lingualis.
- Blood from the tongue flows out through the vena lingualis toward the neck.
