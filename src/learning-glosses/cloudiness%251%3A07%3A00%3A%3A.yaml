simpleMeaning: The state of having clouds in it, so it is not clear.
scope: The quality of being cloudy, not the gloom of a dark sky, and not the sky itself being covered
  with clouds.
examples:
- The cloudiness of the water made it hard to see through.
- Cloudiness in the glass showed the drink was not clear.
