simpleMeaning: a loose coat that women wear at home
scope: A loose coat worn by women at home, also called a wrapper or a negligee. It is not a coat for going
  out and not night clothes worn alone.
examples:
- She put on a housecoat over her nightdress before breakfast.
- In the morning she wore a housecoat while she made tea.
