simpleMeaning: In grammar, a word that says how many things are meant
scope: 'Also called a cardinal number: in grammar, a word that says how many, not a word that says first
  or second and not a written digit.'
examples:
- The cardinal numeral 'five' tells how many apples there are.
- Cardinal numerals like 'two' and 'ten' show a count, not an order.
