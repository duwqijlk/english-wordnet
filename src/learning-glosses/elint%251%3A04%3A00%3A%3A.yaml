simpleMeaning: Knowledge got from electric and magnetic waves from other lands, not from the rays of matter
  that breaks down by itself
scope: This is knowledge got from electric and magnetic waves from other lands; electronics intelligence
  is another name for this sense, and its nearest rivals are knowledge got from spies and knowledge got
  from pictures.
examples:
- ELINT helped them learn about the new radar.
- The team gathered ELINT from foreign signals.
