simpleMeaning: any of several kinds of freshwater fish like perch, usually good to eat, with flat bodies
  and bright scales, above all of the Lepomis kind
scope: 'Also called bream: a flat-bodied freshwater fish with bright scales, not the flesh of the fish
  eaten as food and not a sea bream.'
examples:
- Freshwater bream swim in the lake, their bright scales flashing in the sun.
- We caught a freshwater bream with a flat body and shiny scales.
