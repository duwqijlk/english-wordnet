simpleMeaning: to light up a place with strong lights that spread light over a wide area
scope: This is the act of lighting a place with strong, wide lights, not the light itself, which is another
  sense of the same word.
examples:
- They floodlight the sports field so games can be played at night.
- The workers floodlight the building while they work after dark.
