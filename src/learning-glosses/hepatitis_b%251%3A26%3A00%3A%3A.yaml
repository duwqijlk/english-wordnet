synsetId: 14154424-n
simpleMeaning: A sudden, sometimes fatal, liver infection from a DNA virus that stays in the blood serum
  and spreads through sex, blood transfusions, or swallowing infected blood or other body fluids.
scope: Also called serum hepatitis; a liver infection from a virus in the blood, not a liver infection
  from drink and not a liver infection from food.
examples:
- He caught hepatitis B from a blood transfusion.
- The nurse was vaccinated against hepatitis B.
