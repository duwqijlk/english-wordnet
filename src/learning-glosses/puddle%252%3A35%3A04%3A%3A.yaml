simpleMeaning: to dip a plant into mud before you put it in the ground
scope: This is dipping a plant in mud before planting it, not playing in a liquid, not working wet concrete
  or mud, and not the clay and sand mix for lining a pond.
examples:
- Farmers puddle the rice plants before setting them in the field.
- He puddled each young plant and then planted it in its hole.
