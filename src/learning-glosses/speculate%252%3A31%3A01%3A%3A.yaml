simpleMeaning: to believe something, especially when the grounds for it are shaky and far from firm
scope: 'Also called suppose: believing something when the grounds are shaky, not knowing it for sure and
  not talking a matter over in an idle, doubting way.'
examples:
- We can only speculate about what happened that night.
- She speculated that the letter had been lost in the post.
