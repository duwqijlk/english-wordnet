simpleMeaning: A virus that causes sores in and around the mouth.
scope: A virus that causes sores in and around the mouth; not a virus that causes sores elsewhere on the
  body, and not a cold.
examples:
- Herpes simplex 1 caused the cold sores around her lips.
- He caught herpes simplex 1, which gave him sores in his mouth.
