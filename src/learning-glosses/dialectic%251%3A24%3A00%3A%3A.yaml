simpleMeaning: A clash between opposite ideas, which shapes how they act on each other.
scope: A clash of opposite ideas that decides how they act on each other, not a formal system of reasoning
  by argument.
examples:
- The dialectic between freedom and order shaped the debate.
- The dialectic of the two ideas drove the story forward.
