simpleMeaning: official permission to do something in a way that breaks a rule, typically a building rule
scope: This is official permission to break a rule, not a number used in maths and not the fact that things
  can change.
examples:
- The shop got a variance to build a taller sign than the rules allow.
- He asked the town for a variance so he could add a room to his house.
