simpleMeaning: One of the Shinto gods, which may be a figure from old stories, a spirit of a great person,
  or a force of nature
scope: One of the Shinto gods, which may be a figure from old stories, a spirit of a great person, or
  a force of nature; not a god of another faith, and not a single human hero.
examples:
- The kami are honoured at Shinto shrines.
- Each kami has its own shrine.
