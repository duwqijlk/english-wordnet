simpleMeaning: a tree from East India grown for its very large fruit that can be eaten and for its seeds
  that can be eaten
scope: This is the tree itself, also called jackfruit tree; it is not the very large fruit that grows
  on it.
examples:
- The jackfruit in the garden is now tall, and its large fruit will be ripe soon.
- Farmers grow jackfruit in warm parts of India for the fruit and seeds they can eat.
