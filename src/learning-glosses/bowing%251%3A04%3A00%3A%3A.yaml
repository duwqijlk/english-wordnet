simpleMeaning: the way a player moves the bow over the strings of a violin or a similar instrument
scope: The way a player moves the bow over the strings, not the bend of the head or body, and not a manner
  that shows too much respect.
examples:
- The violinist's bowing was excellent.
- Her bowing grew smoother with practice.
