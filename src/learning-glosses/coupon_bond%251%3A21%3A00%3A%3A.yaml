simpleMeaning: A loan paper sold with small slips that can be torn off and given back to the one who sold
  it to get the interest paid on it
scope: This is a loan paper sold with small slips that can be torn off and given back to the one who sold
  it to get the interest paid; bearer bond is another name for it; not a share in a company, and not a
  loan paper kept on a list of owners.
examples:
- He kept the coupon bond in a safe and clipped off a slip each year.
- The coupon bond paid interest when its slips were handed in.
