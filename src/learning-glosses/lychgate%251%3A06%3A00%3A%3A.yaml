simpleMeaning: During funerals, a coffin on its stand once waited a short time under the roofed opening
  into a churchyard.
scope: Also called a lichgate, it is a roofed opening into a churchyard where a coffin on its stand once
  waited during funerals.
examples:
- The coffin waited under the lychgate during the funeral.
- The lychgate gave the coffin shelter during the funeral.
