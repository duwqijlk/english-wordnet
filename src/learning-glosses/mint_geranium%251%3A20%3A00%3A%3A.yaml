simpleMeaning: a perennial Eurasian herb with round yellow flowers and a tansy-like scent, eaten cooked
  or raw in salads and used for tea, scent or seasoning; sometimes classed with chrysanthemums
scope: Another name for this plant is costmary; it is the whole herb, not the separate sense for its leaves
  used in cooking.
examples:
- Mint geranium spreads quickly across a sunny border.
- I picked a few mint geranium leaves to scent the room.
