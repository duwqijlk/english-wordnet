simpleMeaning: The act of putting a person into a hospital for medical care.
scope: The act of putting a person into a hospital for medical care, not the time spent there, not the
  insurance that pays for it, and not the state of being treated there.
examples:
- Her hospitalization followed the accident on Monday.
- The doctor ordered his hospitalization after the tests.
