simpleMeaning: the highest class among the four varnas, the old Hindu classes of people, the class of
  priests
scope: 'Also called brahman: the highest class among the four varnas, the class of priests, not a warrior
  and not a trader.'
examples:
- A brahmin led the morning prayers.
- The young brahmin studied the holy books.
