simpleMeaning: Signals from the tiny hair-like parts in the ear's balance part and in its hearing part
  travel along thin cords joined into one.
scope: Also called acoustic nerve, auditory nerve, eighth cranial nerve, and nervus vestibulocochlearis,
  it is the one cord in the ear that serves both balance and hearing.
examples:
- Damage to the vestibulocochlear nerve can take away both hearing and balance.
- The vestibulocochlear nerve carries signals from the inner ear to the brain.
