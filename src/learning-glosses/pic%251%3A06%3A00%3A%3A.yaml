simpleMeaning: a likeness of a person or scene, kept as a print, on a clear slide, or as computer data
scope: 'Also called photo, picture, photograph, and exposure: a picture of a person or scene, kept as
  a print, on a clear slide, or as computer data; not a film and not a drawing.'
examples:
- She showed us a pic of her new house.
- He took a pic of the mountains at sunset.
