simpleMeaning: Bread slices go in upright through slots, and jump up when done, in this machine that browns
  bread
scope: This bread-browning machine, also called pop-up toaster, takes slices upright and lets them jump
  up when done, not a machine that browns bread lying flat.
examples:
- The automatic toaster popped the bread up when the browning round was done.
- Bread slices go into the automatic toaster upright and jump up when done.
