simpleMeaning: a table-like piece of furniture with a flat surface for writing on, often with drawers
  or storage compartments
scope: This is furniture made for writing at, not a dining table or a shop counter.
examples:
- He cleared the papers from his desk and started typing.
- The letter had been sitting on her desk for a week.
