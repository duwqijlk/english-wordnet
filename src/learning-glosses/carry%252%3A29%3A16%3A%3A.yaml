simpleMeaning: To act in a particular way and present yourself to others through your behavior and the
  way you hold yourself.
scope: This is about the way a person acts and presents themselves; it is not about lifting, supporting,
  or transporting an object, and not about keeping something with you.
examples:
- He carried himself with quiet confidence throughout the interview.
- She carries herself like someone who has never been afraid.
