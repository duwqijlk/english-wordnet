simpleMeaning: The liquid part of the blood and the watery stuff between the cells are the watery stuff
  outside the cells of the body, holding proteins and salts.
scope: This names the liquid outside the cells of the body, not the liquid inside the cells.
examples:
- The body normally has about 15 quarts of extracellular fluid.
- The extracellular fluid fills the spaces between the cells in the body.
