simpleMeaning: a doctor's way of putting a body part that has moved out of place back where it belongs,
  using the hands
scope: A doctor putting a displaced body part back by hand, not the movement of a small living thing towards
  or away from something.
examples:
- The surgeon used taxis to put the joint back in place.
- Taxis restored the displaced bone without cutting.
