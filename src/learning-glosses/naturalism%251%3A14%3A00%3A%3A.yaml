simpleMeaning: In France in the 1800s, makers of pictures and books tried to show life in full, true-to-life
  detail, as a way of making art.
scope: People also call it realism, a way of making art in France in the 1800s, not a view about how the
  world can be known.
examples:
- Naturalism grew in France in the 1800s.
- Her novel showed naturalism in its true-to-life detail.
