senseId: 'eye_tooth%1:08:00::'
synsetId: 05314590-n
simpleMeaning: one of the four sharp, pointed bits used for biting, two in each jaw, set between the front
  cutting ones and the back grinding ones
scope: This is a pointed biting tooth between the front and back teeth; canine, canine tooth, cuspid,
  dogtooth and eyetooth are other names for this sense; not a front cutting tooth and not a back grinding
  tooth.
examples:
- Her eye tooth ached after she bit the hard crust.
- The eye tooth sits between the incisor and the premolar.
