simpleMeaning: An inability to call to mind some or all of what a person once knew
scope: A gap in what a person can call to mind, covering some or all of the past; not forgetting one small
  thing and not a failure to learn.
examples:
- After the fall he suffered memory loss and could not recall the evening.
- Her memory loss grew worse over the years.
