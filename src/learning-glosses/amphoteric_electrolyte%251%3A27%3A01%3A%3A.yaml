senseId: 'amphoteric_electrolyte%1:27:01::'
synsetId: 92464616-n
simpleMeaning: Something that can act as an acid or as the opposite of an acid, as the liquid it is put
  in grows more or less acid.
scope: 'Also called ampholyte: a substance that can act as an acid or as the opposite of an acid, as the
  liquid it is put in grows more or less acid, not a substance that is always an acid and not a substance
  that is always a base.'
examples:
- The amphoteric electrolyte acted as a base in the sour liquid.
- In a bitter liquid the amphoteric electrolyte acted as an acid.
