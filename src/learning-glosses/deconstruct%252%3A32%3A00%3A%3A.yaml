simpleMeaning: to explain what a piece of writing or a work of art means by using a set way of looking
  at it very closely
scope: To explain a piece of writing or art by looking at it very closely in a set way. It is not taking
  a building or a thing apart into pieces.
examples:
- In class, we deconstruct the poem line by line to find what it means.
- She deconstructed the painting by looking closely at each part and idea in it.
