simpleMeaning: a comment that can hurt a person's feelings
scope: Also called a cut. This is a hurtful remark, not the sharp part of a bee or wasp, not a drink,
  and not a hard hit.
examples:
- His last words were a real stinger, and she walked away in tears.
- She smiled, but her reply ended with a stinger about his failed test.
