synsetId: 03001970-n
simpleMeaning: A small cup shaped like a thimble, put over the neck of the womb to stop tiny male cells
  from getting in and keep a woman from becoming pregnant.
scope: A small cup shaped like a thimble, put over the neck of the womb to stop tiny male cells from getting
  in; not a pill, and not a cover worn by a man.
examples:
- A cervical cap is put over the neck of the womb.
- The cervical cap stops tiny male cells from getting in.
