simpleMeaning: Often many-trunked, this tree of the southwest of the United States bears its needles one
  by one and nuts that people value.
scope: Also called single-leaf or a single-leaf pine, it is a tree of the southwest of the United States
  with needles one by one and nuts people value.
examples:
- Nuts from the single-leaf pinyon are valued in the southwest of the United States.
- The single-leaf pinyon bears needles one by one on trunks that are often many.
