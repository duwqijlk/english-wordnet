simpleMeaning: not willing to follow advice, teaching, or rules, and hard to control
scope: Describing a person who will not do what they are told, also called perverse; it is not the logic
  sense about two statements that cannot both be true.
examples:
- The contrary child refused to listen to his teacher.
- She was in a contrary mood and argued with everyone who tried to help her.
