simpleMeaning: the part of a road between the paths at the sides, where cars drive.
scope: It is not the whole road with its paths and buildings, only the part where vehicles drive.
examples:
- A dog ran into the street and a bus had to stop.
- Children were told to stay out of the street and use the sidewalk.
