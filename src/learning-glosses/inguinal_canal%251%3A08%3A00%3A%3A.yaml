simpleMeaning: 'A slanting passage in the lower belly wall: in males, the testes'' route into the scrotum,
  containing the spermatic cord; in females, it carries the round ligament of the uterus.'
scope: This sense is the groin passage through the lower belly wall, also called canalis inguinalis; it
  is not the femoral canal or another opening in the body wall.
examples:
- The surgeon repaired a hernia at the inguinal canal.
- In men, the inguinal canal carries the spermatic cord from the abdomen to the scrotum.
