simpleMeaning: a tree found across much of eastern Australia, giving strong, long-lasting fibre and soft
  light wood with a fine grain; its leaves feed cattle in hard times
scope: 'Also called currajong: a tree of eastern Australia whose leaves feed cattle in hard times, not
  a gum tree, and not a tree grown only for timber.'
examples:
- The kurrajong's leaves kept the cattle alive through the drought.
- Kurrajong wood is soft and light, and easy to carve.
