simpleMeaning: looking or seeming like a man rather than like a woman
scope: This says someone or something seems like a man rather than a woman; it is not the noun for the
  quality of being an adult man.
examples:
- She walked with a mannish stride.
- Her short hair and deep voice gave her a mannish look.
