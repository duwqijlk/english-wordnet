simpleMeaning: a wide flat board you stand on to glide over the surface of a lake, river or sea while
  a fast boat pulls you along
scope: A wide flat board you stand on to glide over the surface of a lake, river or sea while a fast boat
  pulls you along, not a snow ski and not a board you ride on waves without a boat.
examples:
- He put on a water ski and held the rope as the boat sped off.
- She learned to balance on one water ski behind the speedboat.
