simpleMeaning: A sticky stuff got from many kinds of hot-country plants, used to draw body tissues tight
  and in tanning leather.
scope: A sticky stuff from hot-country plants, used to draw body tissues tight and in tanning leather;
  kino and kino gum are other names for it, not the sticky stuff used to thicken food and not the brown
  sticky stuff used in medicine for animals.
examples:
- The tanner used gum kino in tanning leather.
- Gum kino comes from many kinds of hot-country plants.
