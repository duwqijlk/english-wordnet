simpleMeaning: to make a broken thing work again by putting in a new part or by joining torn or broken
  pieces together
scope: Also called doctor, fix, repair and restore. This is making a broken thing work again, not the
  sewing used to fix a hole in clothes.
examples:
- He mended the chair by putting in a new leg.
- They mended the broken fence by joining the pieces together.
