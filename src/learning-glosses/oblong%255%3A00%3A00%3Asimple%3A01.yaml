simpleMeaning: Of a leaf shape, a bit longer than it is wide, with two long sides that stay about the
  same distance apart all the way along
scope: 'This is the leaf shape only: a leaf that is a bit longer than it is wide, with two long sides
  about the same distance apart; not the general sense for any shape made longer in one way, and not the
  flat figure itself.'
examples:
- The plant has oblong leaves that are longer than they are wide.
- Each oblong leaf has two long sides that run side by side.
