senseId: 'idealize%2:31:00::'
synsetId: 00694673-v
simpleMeaning: to think of a person or thing as perfect, or to show them as perfect
scope: This is about seeing or showing a person or thing as perfect, not about forming your own ideas
  of what perfect should be.
examples:
- She idealized her husband after his death, remembering only his good sides.
- The film idealizes country life and shows none of its hard parts.
