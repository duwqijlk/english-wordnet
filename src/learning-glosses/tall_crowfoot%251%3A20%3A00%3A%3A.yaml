simpleMeaning: When spring comes, this European plant bears yellow flowers; it lives year after year and
  grows wild in many places, above all in the east of North America.
scope: Also called meadow buttercup, tall buttercup, and tall field buttercup, this is a plant from Europe
  that comes back each year, with yellow blooms in spring, now growing on its own in many places, above
  all in the east of North America.
examples:
- In spring the tall crowfoot shows yellow flowers.
- In the east of North America tall crowfoot now grows wild.
