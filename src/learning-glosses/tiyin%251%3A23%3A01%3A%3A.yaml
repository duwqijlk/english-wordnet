simpleMeaning: A unit of money in Uzbekistan; 100 of them equal one som.
scope: It is not the tiyin of Kazakhstan, where 100 of them equal one tenge, the larger unit of money
  there.
examples:
- She paid fifty tiyin for a bus ride in Uzbekistan.
- One hundred tiyin equal one som in Uzbekistan.
