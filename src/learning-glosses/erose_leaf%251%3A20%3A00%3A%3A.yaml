simpleMeaning: a plant part with a rough, uneven edge, as if something had bitten pieces out of it
scope: A plant part with a bitten-looking edge, not a smooth-edged plant part and not a part really eaten
  away by an animal.
examples:
- The erose leaf had a rough edge that looked as if it had been nibbled.
- An erose leaf on the plant showed a jagged edge, not a smooth one.
