simpleMeaning: tubes that carry blood from the pouch of skin holding a man's sex glands to the tubes near
  the groin
scope: These are blood tubes that run from the pouch of skin holding a man's sex glands to the tubes near
  the groin; also called vena scrotalis, not a tube that carries blood away from the heart and not a tube
  in the leg.
examples:
- The doctor traced the scrotal vein on the scan.
- A scrotal vein carries blood from the scrotum toward the groin.
