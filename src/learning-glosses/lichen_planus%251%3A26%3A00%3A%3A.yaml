simpleMeaning: Skin breaks out in shiny, flat-topped purple bumps, often itchy, on the wrists, the lower
  arms, and the thighs.
scope: 'Also called lichen ruber planus: a rash of shiny purple bumps on the wrists, arms, and thighs,
  not a rash of blisters.'
examples:
- The lichen planus on her wrists itched so much she could not sleep.
- His doctor looked at the purple bumps of lichen planus on his thighs.
