simpleMeaning: a tool fixed high up that turns on its own to show which way the wind blows
scope: 'Also called vane, weathervane and wind vane: a tool fixed high up that turns on its own to show
  which way the wind blows, not a flag and not a tool that tells how hard the wind blows.'
examples:
- The weather vane on the barn turned to point east.
- She looked up at the weather vane to see which way the wind blew.
