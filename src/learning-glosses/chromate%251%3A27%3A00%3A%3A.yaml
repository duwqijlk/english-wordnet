simpleMeaning: a salt or an ester, a chemical made from an acid that holds chromium, a hard grey metal
scope: A salt or ester of an acid holding chromium, not the acid itself and not a salt of another acid.
examples:
- Lead chromate is a bright yellow chromate used in paint.
- The chemist stored the chromate in a sealed jar.
