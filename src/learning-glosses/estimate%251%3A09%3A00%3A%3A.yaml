simpleMeaning: a rough working out of how much there is, how great something is, or what it is worth
scope: Also called idea, this is a rough working out of an amount, size, or worth, not a written paper
  giving a value for insurance or tax and not the act of judging roughly.
examples:
- His estimate of the cost was close to the real price.
- Give me a rough estimate of how long the trip will take.
