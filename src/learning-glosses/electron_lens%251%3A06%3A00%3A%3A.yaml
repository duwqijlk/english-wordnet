simpleMeaning: a device that brings a stream of tiny charged parts together to one point, using the push
  of a magnet or of a charge
scope: 'Also called lens: a device that brings a stream of tiny charged parts together to one point, not
  a piece of glass that bends light and not a tube that makes a stream of such parts stronger.'
examples:
- The electron lens in the microscope brought the beam to a sharp point.
- Engineers tuned the electron lens to keep the stream of tiny parts in focus.
