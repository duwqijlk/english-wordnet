simpleMeaning: used of a liquid holding a fixed amount, called a mole, of a dissolved thing in each litre
scope: Used of a liquid holding a fixed amount of a dissolved thing in each litre; not a tooth, and not
  a strong or thick liquid.
examples:
- She made up a molar solution for the test.
- The lab used a one molar salt solution.
