simpleMeaning: A long-lived tropical American vine grown for its sprays of showy yellow and purple flowers,
  whose lowest petal curls like a snail shell; sometimes put in the genus Phaseolus.
scope: Also called corkscrew flower, snail-flower, snail bean, snail flower, snailflower and Phaseolus
  caracalla; a tropical American vine grown for its yellow and purple flowers, not a bean grown for food
  and not a vine with plain flowers.
examples:
- Vigna caracalla climbed over the wall of the garden.
- The yellow and purple flowers of Vigna caracalla opened in the morning.
