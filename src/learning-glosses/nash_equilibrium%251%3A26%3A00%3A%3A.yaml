simpleMeaning: In game theory, a steady state in a game with several players in which no player gains
  by changing plan while all the others stay the same.
scope: In game theory, a steady state where no player gains by changing plan; its near kin are the other
  steady states of games with several players.
examples:
- The Nash equilibrium held because no player could gain.
- At the Nash equilibrium, no player wanted to change plan while the others stayed the same.
