simpleMeaning: Sores kept to the skin and the wet lining inside the body mark a kind of sickness found
  in Mexico and in Central and South America.
scope: This sickness, also called leishmaniasis americana and mucocutaneous leishmaniasis, is found in
  Mexico and in Central and South America, with sores kept to the skin and the wet lining inside the body,
  not spread through the whole body.
examples:
- Sores on the skin and the wet lining inside the body came from nasopharyngeal leishmaniasis.
- In Mexico, nasopharyngeal leishmaniasis leaves sores on the skin and the wet lining inside the body.
