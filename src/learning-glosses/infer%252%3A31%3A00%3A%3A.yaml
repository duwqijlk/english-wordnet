simpleMeaning: to work out that something is true by thinking step by step from facts, and to show it
  is true in that way
scope: 'Also called derive, deduce, and deduct: this is working out a truth step by step from facts, not
  guessing an answer and not just reaching a view in logic.'
examples:
- From the footprints, the police inferred that two people had entered.
- We can infer the answer from the facts given in the report.
