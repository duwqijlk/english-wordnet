simpleMeaning: A juniper of wet coastal land in the southeast United States, like the eastern juniper
  of the same sort
scope: A juniper of wet coastal land in the southeast United States, like the eastern juniper, not a dry-land
  pine and not a tall mountain fir.
examples:
- A southern red cedar grows in the wet ground near the coast.
- The southern red cedar looks much like the eastern kind.
