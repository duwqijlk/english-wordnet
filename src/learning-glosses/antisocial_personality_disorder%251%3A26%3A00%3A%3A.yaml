senseId: 'antisocial_personality_disorder%1:26:00::'
synsetId: 14411544-n
simpleMeaning: A lasting pattern of disregard for others' rights and for right and wrong, with shallow
  feeling, that can let someone commit violent acts without guilt.
scope: A recognized mental-health condition, not simply cruel or criminal behavior; it is also known as
  psychopathic or sociopathic personality.
examples:
- He was diagnosed with antisocial personality disorder after a series of violent offences.
- People with antisocial personality disorder often show no guilt when they hurt others.
