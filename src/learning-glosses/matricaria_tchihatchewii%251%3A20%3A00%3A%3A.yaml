simpleMeaning: A low thickly tufted plant of Turkey that lives for years, with small white flowers, used
  to cover dry ground; at times put in the genus that shares its name.
scope: This is a low tufted herb of Turkey with small white flowers, used to cover dry ground; turfing
  daisy and Tripleurospermum tchihatchewii are other names for this sense, not the mat-forming herb of
  Asia Minor.
examples:
- We planted Matricaria tchihatchewii as a ground cover on the dry slope.
- The Matricaria tchihatchewii in the rock garden had small white flowers.
