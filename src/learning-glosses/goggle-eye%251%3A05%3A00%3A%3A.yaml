simpleMeaning: A creature of the Atlantic coastal waters, often used as bait.
scope: 'Also called a big-eyed scad or a bigeye scad: a creature of the Atlantic coast used as bait, not
  a fish kept for food and not a deep-sea fish.'
examples:
- Fishermen use goggle-eye as bait off the Atlantic coast.
- The goggle-eye lives in the shallow waters of the Atlantic coast.
