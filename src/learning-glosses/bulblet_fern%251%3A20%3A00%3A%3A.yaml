simpleMeaning: A plant from North America with feathery leaves that often carry small buds on them
scope: A North American plant with feathery leaves that often carries small buds; berry fern and bulblet
  bladder fern are other names for this sense, not a flowering plant and not a tree.
examples:
- The bulblet fern grew in the damp shade.
- Small buds lined the leaves of the bulblet fern.
