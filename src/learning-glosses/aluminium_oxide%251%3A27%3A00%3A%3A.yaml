simpleMeaning: Any of several forms of a light metal joined with oxygen, found in nature as the hard stone
  corundum.
scope: Any of several forms of a light metal joined with oxygen, found in nature as the hard stone corundum,
  also called alumina and aluminum oxide; not rust and not a plain white powder.
examples:
- Aluminium oxide lines the inside of the kiln.
- The gem was a form of aluminium oxide.
