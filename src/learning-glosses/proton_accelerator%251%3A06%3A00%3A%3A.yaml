simpleMeaning: A machine that smashes together a fast stream of tiny bits and a fast stream of their opposites
scope: A machine that crashes a stream of tiny bits and a stream of their opposites together, not a machine
  that only speeds up one stream and not a device that breaks atoms apart.
examples:
- The proton accelerator sent two streams of tiny bits crashing into each other.
- Scientists used the proton accelerator to study what happens when the streams meet.
