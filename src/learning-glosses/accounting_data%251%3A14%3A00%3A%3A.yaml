simpleMeaning: all the lists and books, on paper or on a computer, that back up a firm's money report
scope: This is the full set of records behind a money report, not the report itself and not the work of
  one bookkeeping firm.
examples:
- The accounting data filled three boxes of old ledgers.
- All the accounting data was kept on paper and on disk.
