simpleMeaning: Strong rays flood out from the face of the sun all at once, with dark spots on the sun
  and breaks in radio signals.
scope: Also called a flare, it is a sudden flood of strong rays from the face of the sun.
examples:
- A solar flare threw off strong rays that broke radio signals.
- The solar flare came with dark spots on the face of the sun.
