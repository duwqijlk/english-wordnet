simpleMeaning: a number got by comparing the weight of a thing sliding over a surface with the push that
  keeps it pressed to the surface
scope: This is a number that compares weight with the push that keeps a sliding thing pressed to a surface;
  not a number for how far rank lists agree and not the push itself.
examples:
- The coefficient of friction between the tyre and the road was low, so the car slid easily.
- Engineers measured the coefficient of friction to see how much push the box needed to keep sliding.
