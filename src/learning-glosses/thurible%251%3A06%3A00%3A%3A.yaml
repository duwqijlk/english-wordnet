simpleMeaning: A holder for burning incense, above all one swung on a chain in a religious rite
scope: This is a holder for burning incense, above all one swung on a chain in a religious rite, also
  called a censer; not an incense stick and not a candle holder.
examples:
- The priest swung the thurible on its chain during the rite.
- Incense smoke rose from the thurible as it swung.
