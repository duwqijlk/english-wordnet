senseId: 'martyr%2:29:00::'
synsetId: 00071399-v
simpleMeaning: to hurt someone again and again, the way a person who suffers for a belief is hurt
scope: To hurt and torment a person in the way a sufferer for a belief is hurt; not the act of killing
  such a person, and not the noun for the sufferer.
examples:
- The guards martyred the prisoner with beatings and hunger, trying to make him give up his beliefs.
- They martyred her with pain and fear for years, but she would not give up what she believed.
