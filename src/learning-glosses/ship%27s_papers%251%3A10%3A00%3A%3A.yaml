simpleMeaning: the written records a boat must by law carry, about who owns it, what it carries, and other
  things
scope: The written records a boat must by law carry, about who owns it, what it carries, and other things;
  not a passport and not a ticket for a trip.
examples:
- The captain showed the ship's papers to the port officer.
- Without the ship's papers the boat could not leave the harbour.
