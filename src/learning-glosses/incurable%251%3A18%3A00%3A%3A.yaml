simpleMeaning: a person who has a sickness that no one can cure
scope: A person who has a sickness that no one can cure. It is not the sickness itself, and not a word
  for habits that will never change.
examples:
- As an incurable, he lived in a home where nurses cared for him each day.
- The doctor told the incurable that his sickness would stay with him for life.
