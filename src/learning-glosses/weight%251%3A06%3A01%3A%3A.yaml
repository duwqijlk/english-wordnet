simpleMeaning: a heavy piece of exercise equipment, not fixed to anything, that people lift with their
  hands and arms to build strength.
scope: This is the object you lift in a gym, not how heavy something is or how important it is.
examples:
- He lifted the weights above his head.
- She uses light weights in her exercise class.
