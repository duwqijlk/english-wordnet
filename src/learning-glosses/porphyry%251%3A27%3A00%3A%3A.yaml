simpleMeaning: Any stone formed from hot melted stuff, with crystals set in a finer bed of minerals
scope: Any stone formed from hot melted stuff, with crystals set in a finer bed of minerals; porphyritic
  rock is another name for this sense, not a stone made of sand and not a stone with no crystals.
examples:
- The cliff was porphyry with white crystals.
- Porphyry forms when hot melted stuff cools slowly.
