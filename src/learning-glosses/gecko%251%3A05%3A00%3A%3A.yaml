simpleMeaning: a small land lizard, mainly in warm places, that usually comes out at night to eat insects,
  with eyelids that typically cannot move, and that does no harm
scope: This sense is the small night lizard of warm places that does no harm, not a snake and not a larger
  lizard.
examples:
- A gecko walked across the wall on the warm night.
- The small gecko eats insects and does no harm to people.
