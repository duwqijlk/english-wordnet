simpleMeaning: Grown above all to feed farm animals, this one-year plant of warm South America stands
  half upright, is bushy, and bears long pods with white seeds.
scope: Also called giant stock bean and jack bean, this is a bushy plant of warm South America grown above
  all to feed farm animals, not a bean grown for the table.
examples:
- Wonder bean bears long pods with white seeds.
- Wonder bean is grown above all to feed farm animals.
