simpleMeaning: multiply a number by itself repeatedly, for example two times two times two equals eight
scope: 'This is the mathematics sense: using a number as a repeated factor, not increasing an amount or
  lifting something.'
examples:
- Three raised to the fourth power is eighty-one.
- The function raises every input to the power of two.
