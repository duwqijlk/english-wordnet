senseId: 'moralizing%1:10:00::'
synsetId: 06755627-n
simpleMeaning: speaking a lot about right and wrong, and setting out one set of rules about right and
  wrong, often in a shallow way
scope: 'Also called moralisation and moralization: a lot of talk about right and wrong and the rules for
  it, not living in a good way and not a single rule on its own.'
examples:
- His constant moralizing about how people should live drove me mad.
- She was tired of his moralizing and asked him to stop telling everyone what was right.
