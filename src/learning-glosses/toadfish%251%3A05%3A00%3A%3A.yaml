simpleMeaning: a fish that lives on the sea floor, with slimy skin and no scales and a wide thick head
  with a big mouth
scope: A fish that lives on the sea floor, not a toad and not a fish that swims near the top of the water.
examples:
- The toadfish lay still on the sea floor, its wide mouth half open.
- We saw a toadfish with smooth slimy skin under the rock.
