simpleMeaning: several small blood tubes that branch off the tube to the spleen and run to the wide curve
  of the stomach
scope: Several small blood tubes that branch off the tube to the spleen and run to the wide curve of the
  stomach, also called arteria gastrica breves and vasa brevis; not the main tube to the stomach and not
  a vein.
examples:
- The short gastric artery runs to the wide curve of the stomach.
- Surgeons take care near the short gastric artery.
