simpleMeaning: a slow walk in which the feet drag along the ground and are not lifted
scope: A slow walk with the feet dragging, not a quick walk and not the mixing of cards.
examples:
- His shuffle across the room showed how tired he was.
- She walked with a shuffle, her feet barely leaving the floor.
