simpleMeaning: A blood clot in a vein with no earlier inflammation, tied to slow-moving blood, as in long
  bed rest, pregnancy, or surgery, or to quick blood clotting.
scope: This sense is also called phlebothrombosis.
examples:
- A venous thrombosis blocked the vein.
- Venous thromboses come with slow blood.
