simpleMeaning: where there is almost no air, blood, serum or body tissue is dried by freezing
scope: Also called lyophilise, to dry blood, serum or body tissue by freezing it in almost no air, not
  to dry food and not to freeze something to keep it cold.
examples:
- They lyophilize tissue samples for later use in tests.
- The serum was lyophilized and sealed in small glass vials.
