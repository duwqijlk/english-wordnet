simpleMeaning: The big curve of the stomach is served by two blood tubes, and this is one of them
scope: Also called gastroomental vein, it is one of two blood tubes that serve the big curve of the stomach,
  not a tube that feeds the small curve and not a tube that feeds the heart.
examples:
- The gastroepiploic vein runs along the big curve of the stomach.
- The surgeon tied off the gastroepiploic vein during the operation.
