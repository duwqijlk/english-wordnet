simpleMeaning: A hurt part of the body is fixed in place, as in a plaster cast, so it heals the right
  way
scope: A hurt part of the body is held still so it heals the right way, also called immobilisation; not
  a bandage alone and not an operation.
examples:
- Immobilization of his ankle helped the torn ligament heal.
- The nurse explained that immobilization would keep the fracture still.
