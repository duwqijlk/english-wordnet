simpleMeaning: White hairs fringe the back and neck of this South African antelope, whose horns twist
  in a spiral.
scope: This is the South African antelope whose horns twist in a spiral and whose back and neck carry
  a fringe of white hairs.
examples:
- The nyala's horns twisted like a screw.
- A nyala's white fringe showed along its neck.
