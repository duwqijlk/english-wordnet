simpleMeaning: a man-made stuff made from joined small bits, used in place of rubber to cover electric
  wires
scope: A man-made stuff used in place of rubber to cover electric wires, not rubber itself and not a wire
  with no cover.
examples:
- The polyvinyl chloride cover on the cable keeps the wires safe.
- Workers used polyvinyl chloride to cover the electric cables in the new house.
