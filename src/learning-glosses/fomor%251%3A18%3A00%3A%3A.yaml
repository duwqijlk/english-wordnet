simpleMeaning: One of a group of Celtic sea demons that people at times tie to the power of nature that
  works against people.
scope: Also called Fomorian; one of a group of Celtic sea demons, not the whole group and not a demon
  of another people.
examples:
- The old tale tells of a Fomor who came from the sea.
- A Fomor is one of the sea demons in the Celtic stories.
