simpleMeaning: to picture a thing with the shape of a living creature
scope: Also called animalize; to picture a thing in animal shape, not to make it cruel and not to show
  it as a person.
examples:
- The artist chose to animalise the wind as a horse.
- In the tale, the river was animalised as a snake.
