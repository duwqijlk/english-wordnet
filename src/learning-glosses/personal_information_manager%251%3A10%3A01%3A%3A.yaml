simpleMeaning: A computer program, often called a PIM, that keeps a person's own facts in order as their
  own organizer.
scope: As an organizer, a PIM is a program that keeps one person's own facts in order.
examples:
- I put the meeting date into my personal information manager so I would not forget it.
- They opened their personal information manager to find the phone number.
