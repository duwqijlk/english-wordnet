simpleMeaning: A South African herb, fairly free of poison, that people smoke like tobacco.
scope: This is a South African herb smoked like tobacco, also called red dagga and wilde dagga, not tobacco
  itself or a strong drug that harms the mind.
examples:
- In South Africa, dagga is smoked like tobacco.
- The old man grew dagga behind his house.
