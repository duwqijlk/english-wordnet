simpleMeaning: To add a strip or trim around the outside of something.
scope: This is the act of adding a trim to something, not lying next to it, surrounding it on all sides,
  or the trim itself.
examples:
- She bordered the curtains with blue ribbon.
- They bordered the path with bricks.
