simpleMeaning: Joining the outer blood vessel of the neck, this blood vessel starts below the chin and
  takes blood from the lower face.
scope: A blood vessel of the front of the neck that starts below the chin and joins the outer neck vessel.
examples:
- The anterior jugular vein runs down the front of the neck.
- Blood from the lower face drains into the anterior jugular vein.
