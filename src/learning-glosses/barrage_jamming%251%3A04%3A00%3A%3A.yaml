simpleMeaning: the blocking of radio signals by sending out noise over many wave bands at the same time
scope: The blocking of radio signals across many wave bands at once, not the blocking of one signal and
  not a fault in the radio.
examples:
- Barrage jamming cut off the enemy radio links.
- The planes used barrage jamming to hide their approach.
