simpleMeaning: the state of being very unkind in a way that makes people feel tense or annoyed
scope: 'Also called cruelty and harshness: being very unkind in a way that makes people feel tense or
  annoyed, not a single unkind act and not plain anger.'
examples:
- His cruelness toward the new workers made everyone tense.
- The cruelness of her words left the room annoyed and uneasy.
