senseId: 'vena_circumflexa%1:08:00::'
synsetId: 05371224-n
simpleMeaning: one of a set of bent blood tubes that run side by side with the tubes of the same name
  that carry blood away from the heart
scope: 'Also called a circumflex vein: one of a set of bent veins, not a vein under the skin and not a
  vein in the skull bones.'
examples:
- The vena circumflexa ran beside the artery of the same name.
- The vena circumflexa is one of several curved veins that follow the arteries.
