senseId: 'receiver%1:18:01::'
synsetId: 10285229-n
simpleMeaning: In law, a person, usually chosen by a court, who sells the things a person or company owns,
  or keeps them safe, for the people affected
scope: This is a court-chosen person in law who deals with owned things, not a part you listen through,
  not a radio or TV set, and not a person who simply gets something.
examples:
- The court chose a receiver to sell the failed company's land.
- The receiver kept the money safe until the court decided who should get it.
