simpleMeaning: likely to change suddenly in a way that no one can guess
scope: 'Also called erratic, fickle and mercurial: this describes someone or something that is likely
  to change suddenly in a way no one can guess, not the liquid metal with the same name.'
examples:
- Her quicksilver mood changed from happy to angry in a minute.
- He has a quicksilver mind that jumps quickly from one idea to the next.
