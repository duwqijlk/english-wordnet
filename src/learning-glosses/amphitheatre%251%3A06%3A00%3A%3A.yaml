simpleMeaning: A large oval building with rows of seats that go up step by step, where people watch games
  and shows
scope: 'Also called amphitheater and coliseum: a large oval building for games and shows, not the sloping
  rows of seats inside a theater or a room where people watch work on a body.'
examples:
- Thousands of people sat in the amphitheatre to watch the games.
- The old stone amphitheatre still has rows of seats that go up high.
