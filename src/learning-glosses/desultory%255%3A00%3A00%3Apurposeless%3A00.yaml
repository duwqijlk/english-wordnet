simpleMeaning: with no clear plan, no set order, and no clear aim, jumping from one thing to another
scope: With no plan and jumping from one thing to the next, not steady and in order, and not done only
  by chance.
examples:
- They had a desultory conversation that moved from work to weather to old songs.
- His desultory reading jumped from one book to another with no plan.
