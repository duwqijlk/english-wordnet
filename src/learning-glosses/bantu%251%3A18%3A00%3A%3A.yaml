simpleMeaning: A person from one of the many peoples of Central and South Africa whose tongues belong
  to one family
scope: A person from one of these peoples, not the family of tongues itself and not the adjective sense
  said of those peoples.
examples:
- He is a Bantu from South Africa.
- The Bantu peoples live across Central and South Africa.
