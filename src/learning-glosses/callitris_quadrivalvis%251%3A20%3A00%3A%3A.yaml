simpleMeaning: A large evergreen cone-bearing tree of North Africa and Spain, with flat branches and scale-like
  leaves, yielding hard fragrant wood; its bark yields a resin used in varnishes.
scope: 'Also called sandarac, sandarac tree, and Tetraclinis articulata: a large tree, not a shrub, and
  not a varnish itself.'
examples:
- Callitris quadrivalvis grew in the dry hills of North Africa.
- The bark of Callitris quadrivalvis yields resin for varnish.
