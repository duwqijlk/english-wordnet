simpleMeaning: In botany, either of the two divided halves of a flower's petal ring or sepal ring
scope: The botanical part of a flower; not the mouth part, a shell's rim, or a rude reply.
examples:
- Each lip of the corolla was marked with purple veins.
- The lower lip of the calyx curved outward.
