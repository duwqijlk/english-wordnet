simpleMeaning: any machine that uses force to shape or cut material, squeeze solids, or draw liquid out
scope: This is the machine itself, not the act of using force or a cupboard for clothes.
examples:
- The workers fed steel sheets into the hydraulic press.
- The mechanic used a press to fit the new bearing.
