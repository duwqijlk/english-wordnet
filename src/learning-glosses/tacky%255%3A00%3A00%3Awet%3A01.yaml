simpleMeaning: of a thick liquid such as paint, not yet dry, and a little sticky when you touch it
scope: Of a thick liquid like paint, still a little sticky because it has not dried, not fully dry and
  not wet.
examples:
- The tacky varnish caught dust on its surface.
- Don't touch the wall yet — the paint is still tacky.
