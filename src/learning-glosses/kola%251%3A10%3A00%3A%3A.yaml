simpleMeaning: A Chadic tongue spoken south of Lake Chad, above all in the North Region, Mayo-Louti division,
  Mayo-Oulo and Guider, northwest of Guider, Far North Region, Mayo-Tsanaga, Hina and Bourrah.
scope: Also called Daba, Daba language, Kola language, Musgoi and Musgoi language; one Chadic tongue among
  many, spoken south of Lake Chad in the places named in its gloss.
examples:
- Kola is spoken south of Lake Chad.
- The old man still speaks Kola at home.
