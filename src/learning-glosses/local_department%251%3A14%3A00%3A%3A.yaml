simpleMeaning: a lasting part of the government of one area set up to do the work of that government
scope: A lasting part of the government of one area set up to do its work, also called department of local
  government, and not a national office or a short-lived group.
examples:
- The local department handles rubbish collection.
- He joined the local department last year.
