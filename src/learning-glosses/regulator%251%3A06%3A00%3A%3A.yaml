simpleMeaning: a control or device that keeps the flow of a liquid or gas, the pressure, the heat, or
  other such things at the right level
scope: A device that keeps a flow, pressure, or heat steady, not the control that keeps a machine running
  at a steady speed.
examples:
- The regulator on the gas tank keeps the pressure steady.
- A faulty regulator let the water heat up too much.
