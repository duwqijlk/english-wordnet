simpleMeaning: Smoke passes through water in a pot, cooling as it goes, in this tobacco pipe of the East,
  joined to the pot by a long bendy tube.
scope: It is also called a hookah, a shisha, a calean, a chicha, a hubble-bubble, a hubbly-bubbly, a narghile,
  a nargileh, a sheesha, or a water pipe, and its smoke cools as it passes through water.
examples:
- He filled the kalian with tobacco and water.
- Smoke from the kalian cooled as it passed through the water.
