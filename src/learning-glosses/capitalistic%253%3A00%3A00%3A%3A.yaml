simpleMeaning: backing a system where businesses are owned by people, not the state, or following that
  system
scope: 'Also called capitalist: backing a system where businesses are owned by people, not the state,
  or following that system. Not the sense that only describes things to do with that system or with the
  people who back it.'
examples:
- 'She is capitalistic: she backs private ownership and uses its rules in her own business.'
- He runs his firm in a capitalistic way, backing private ownership and following the system himself.
