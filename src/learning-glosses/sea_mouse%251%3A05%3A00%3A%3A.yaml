simpleMeaning: Under a thick mat of rough hairs, the broad, flat body of one of many kinds of big worms
  stays hidden.
scope: This worm is one of many kinds, with a broad, flat body and a thick mat of rough hairs over its
  back.
examples:
- A sea mouse keeps its broad, flat body hidden under a thick mat of rough hairs.
- Under the mat of rough hairs, the sea mouse shows a broad, flat body.
