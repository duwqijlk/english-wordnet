simpleMeaning: being allowed by law, or being in line with the law
scope: This is about being allowed by law or being in line with the law. It is not just about being accepted
  by people or seen as right in a wider sense.
examples:
- The court questioned the legitimacy of the new rule.
- He argued about the legitimacy of the tax, saying no law allowed it.
