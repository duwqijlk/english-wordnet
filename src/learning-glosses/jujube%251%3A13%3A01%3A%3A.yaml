simpleMeaning: a soft, chewy sweet with a fruit taste, made like jelly, sometimes with medicine in it
  to help a sore throat
scope: This is the sweet or candy sense, not the dark red fruit of the same name and not the spiny tree
  that grows that fruit.
examples:
- She kept a box of jujubes in her bag for the long trip.
- He took a jujube to help his sore throat feel better.
