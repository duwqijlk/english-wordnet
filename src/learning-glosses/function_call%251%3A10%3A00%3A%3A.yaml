simpleMeaning: A step that hands work to a small set of orders, and when that set ends, work goes back
  to the next order in the main set
scope: This is a step in computing that hands work to a small set of orders and then goes back; not a
  jump to a new part of a program and not a direct order.
examples:
- The program makes a function call to add the two numbers.
- After the function call ends, the program goes on with the next line.
