simpleMeaning: A bloom at the end of each main and side stem opens first, in a flower group often flat
  on top.
scope: This word is said of a flower group in which the top bloom opens first.
examples:
- The cymose cluster opened its top flower first.
- Her notes called the flower head cymose.
