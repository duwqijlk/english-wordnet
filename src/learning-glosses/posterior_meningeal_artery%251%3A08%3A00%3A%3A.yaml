simpleMeaning: a blood vessel that branches off the vessel running up the throat and feeds the tough cover
  of the back of the skull
scope: A blood vessel feeding the tough cover at the back of the skull, not the one feeding the cover
  at the side or the front.
examples:
- The posterior meningeal artery feeds the tough cover of the skull.
- A cut to the posterior meningeal artery can bleed into the head.
