simpleMeaning: the color of a clear sky in the daytime, or a paint or dye of this color
scope: 'Also called blue: this color itself, not a feeling of sadness and not the sky itself.'
examples:
- The blueness of the sea was bright on a clear day.
- She liked the deep blueness of his eyes.
