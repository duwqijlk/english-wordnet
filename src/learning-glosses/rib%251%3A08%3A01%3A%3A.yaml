simpleMeaning: one of twelve pairs of curved bones that run from the back bone toward the front of the
  chest in people and most animals with back bones
scope: A curved bone in the chest, not a raised band under a roof and not the act of making raised lines
  by knitting.
examples:
- He broke a rib when he fell off his bike.
- The doctor said the rib near her back was cracked.
