synsetId: 13586404-n
simpleMeaning: the pulling together of the cell's thread-like material, chromatin, to one side of its
  centre during the first stage of cell division
scope: This is the cell's chromatin gathering to one side of the nucleus early in meiosis, also called
  synezesis, and not a change in the whole cell or a later stage of meiosis.
examples:
- During prophase, synizesis pulls the chromatin to one side of the nucleus.
- The scientist watched synizesis as the cell prepared to divide.
