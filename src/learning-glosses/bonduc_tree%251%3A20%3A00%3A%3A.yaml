  this tree of warm lands.'
scope: 'Also called bonduc: a tropical tree whose bean-like seeds are used for jewelry, not the North
  American bonduc with green-white flowers.'
examples:
- The bonduc tree bore big spiky pods.
- She strung bonduc tree seeds into a necklace.
