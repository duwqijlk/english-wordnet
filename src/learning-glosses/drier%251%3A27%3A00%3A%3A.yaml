simpleMeaning: 'A substance that helps things dry; calcium oxide is an example: it takes in water and
  is used to take water away from wet things'
scope: Also called desiccant, drying agent and siccative. This is a substance that takes in water, not
  a machine that takes water out of clothes or hair.
examples:
- The powder is a drier that keeps the seeds dry in the box.
- A drier such as calcium oxide was put in the jar to take in water.
