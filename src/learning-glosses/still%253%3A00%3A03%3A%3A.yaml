senseId: 'still%3:00:03::'
synsetId: 01570144-a
simpleMeaning: Describing a photograph or picture that does not move like a film, or one that shows objects
  that cannot move.
scope: This is not the distillery sense and not the sense of calm air or water; it describes pictures
  that do not move.
examples:
- The camera can take still pictures as well as video.
- A still image of the mountain hung above the desk.
