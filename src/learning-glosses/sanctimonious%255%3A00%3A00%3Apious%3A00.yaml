simpleMeaning: too full of claims about being good and religious, in a way that is not honest or true
scope: This describes a person who acts too good and religious but is not honest about it, not a person
  who is truly religious.
examples:
- He gave a sanctimonious talk about honesty while lying to his friends.
- Her sanctimonious smile hid the fact that she did not care at all.
