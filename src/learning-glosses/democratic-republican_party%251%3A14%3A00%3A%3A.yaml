simpleMeaning: A former major political group in the early-19th-century United States, against the old
  Federalists, for a strict reading of the constitution to limit the central government's powers.
scope: A former major party of the early 19th century, opposed to the old Federalist party and unlike
  the later Democratic and Republican parties of similar name; it sought a strict reading of the constitution
  to limit federal power.
examples:
- The Democratic-Republican Party opposed the Federalists.
- The Democratic-Republican Party was a major group in the early 19th century.
