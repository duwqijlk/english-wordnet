senseId: 'pestle%2:30:00::'
synsetId: 00332652-v
simpleMeaning: to crush and rub food or other things into small bits or a smooth mix in a mortar (a strong
  bowl made for this work)
scope: To crush things in a strong bowl with a hand tool; not the tool itself, which is a different sense
  of the same word.
examples:
- Pestle the garlic until it becomes a smooth paste.
- She pestled the spices in the bowl until they were fine.
