simpleMeaning: Things that the law says you may not bring into or take out of a country, or have at all
scope: Things the law bans people from having or moving into or out of a country; not just goods carried
  in secret when the law allows them.
examples:
- The police found contraband hidden in the back of the truck.
- He was charged with carrying contraband across the border.
