simpleMeaning: The part of the great blood tube that goes down and splits into the chest and belly tubes
scope: The part of the great blood tube that goes down and splits into chest and belly tubes, not the
  part that rises from the heart and not a vein.
examples:
- The descending aorta carries blood down through the chest.
- A tear in the descending aorta is very grave.
