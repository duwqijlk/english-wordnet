simpleMeaning: Sap that smells nice and prickly round fruit bunches belong to this North American tree
  of the genus Liquidambar.
scope: This is a North American tree with prickly round fruit bunches and sap that smells nice; bilsted,
  red gum and sweet gum are other names for this sense.
examples:
- The sweet gum tree dropped its prickly fruit.
- We gathered the prickly fruit under the sweet gum tree.
