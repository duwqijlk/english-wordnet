simpleMeaning: a large sailing ship with three or more masts and square sails, used by the Spanish for
  trade and war in the 1400s to 1700s
scope: A large Spanish sailing ship of that time with three or more masts, not a small sailing boat and
  not a ship with a motor.
examples:
- A Spanish galleon carried gold across the sea.
- The galleon had three masts and large square sails.
