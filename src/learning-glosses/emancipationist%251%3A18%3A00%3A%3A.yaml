simpleMeaning: a person who works for change in the law so that slavery ends and no one is kept as a slave
scope: 'Also called abolitionist: a person who works to end slavery, not a person who owns slaves and
  not a person who fights for other kinds of change.'
examples:
- The emancipationist spoke at meetings across the country.
- She became an emancipationist after seeing the harm of slavery.
