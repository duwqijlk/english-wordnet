simpleMeaning: A sixth church-wide meeting in 680-681 that condemned a teaching by setting out two wills
  in Christ, one of God and one of man.
scope: 'Also called Constantinople: a sixth church-wide meeting in 680-681 that condemned a teaching by
  setting out two wills in Christ, not a meeting of one church alone and not a later meeting of the same
  name.'
examples:
- The Third Council of Constantinople met in 680-681.
- The Third Council of Constantinople condemned Monothelitism.
