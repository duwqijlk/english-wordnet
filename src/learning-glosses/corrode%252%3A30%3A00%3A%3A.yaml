simpleMeaning: to be destroyed by water or air, or by a thing that can harm things and wear them away,
  such as an acid
scope: Rust is another name for this sense; this is a thing being destroyed by water, air or a thing that
  wears things away, such as an acid, not a person destroying metal on purpose.
examples:
- The old iron pipes corroded after years in wet soil.
- The metal gate corroded in the salty air by the sea.
