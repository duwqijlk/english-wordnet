simpleMeaning: a stay for a short time in a place, for example as a guest
scope: 'Also called visit: a stay for a short time in a place, not living there as your home for all time
  and not just passing through on the way to somewhere else.'
examples:
- During her sojourn in Paris, she stayed with an old friend.
- Their sojourn at the farm lasted only two weeks before they went home.
