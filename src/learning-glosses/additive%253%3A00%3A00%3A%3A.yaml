simpleMeaning: having to do with putting things together so the whole grows, or made in that way
scope: An adjective for a process that grows by putting things together; not the thing put into food,
  fuel, paint or medicine, and not the maths adjective for equations of the first degree.
examples:
- Colour on a screen is made by an additive process, with lights put together.
- 'The score is additive: each new point is put on top of the last.'
