simpleMeaning: The body making special proteins that attack the tissues of its own body; this brings on
  illness in which the body attacks itself, or very strong harmful reactions
scope: This is the body's attack on itself by its own germ-fighting proteins; it is not the normal attack
  on germs from outside, and not just the name of one illness that follows from it.
examples:
- Autoimmunity can make the body attack its own joints.
- Doctors studied her autoimmunity to learn why her body was harming itself.
