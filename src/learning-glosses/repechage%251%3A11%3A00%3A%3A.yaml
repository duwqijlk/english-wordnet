simpleMeaning: a race, most of all in rowing, where the losers of the first heats race again for a place
  in the last race
scope: A race where the losers of the first heats race again for a place in the last race, not the last
  race itself and not a first heat.
examples:
- He won the repechage and so got a place in the final.
- After losing her first heat, she had one more chance in the repechage.
