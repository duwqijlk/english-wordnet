simpleMeaning: to make a person or group hold stronger views for big change in society or politics
scope: This means making a person or group hold stronger views for big change in society or politics.
  It is not about small changes, and not about change in private life.
examples:
- Years of unfair treatment radicalized many young workers.
- The speeches radicalized the group, and they began to ask for a new government.
