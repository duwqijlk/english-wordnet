simpleMeaning: a movement that makes something take a curved shape
scope: This is the movement that makes a curve. It is not the curved shape itself and not the line on
  a shield.
examples:
- With one bend, he turned the straight wire into a hook.
- A quick bend of the pipe gave it a curved shape.
