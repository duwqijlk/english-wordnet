scope: A plant of warm lands, found in many parts of the Old World and now growing wild in Jamaica and
  Florida; climbing maidenhair and snake fern are other names for this sense, not any other fern and not
  a plant of cold lands.
examples:
- The climbing maidenhair fern covered the old stone wall.
- In Florida the climbing maidenhair fern grows wild by the road.
