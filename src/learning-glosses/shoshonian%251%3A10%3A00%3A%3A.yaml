simpleMeaning: A group of ways of speaking within the Uto-Aztecan family, not of the usual kind, spoken
  most of all in the south-west of the United States.
scope: Also called Shoshonean, Shoshonean language, or Shoshonian language, it is a non-standard subfamily
  of Uto-Aztecan languages spoken mainly in the south-western United States.
examples:
- Shoshonian is a group of languages within the Uto-Aztecan family.
- Shoshonian languages are spoken in the south-west of the United States.
