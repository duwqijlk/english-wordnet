simpleMeaning: A plant of the cool north that lives for years, with toothed leaves and round tops of small
  purple-white flowers
scope: 'Also called livelong, live-forever, or orpine: a cool-north plant with toothed leaves, not a garden
  rose and not a weed of warm lands.'
examples:
- Orpin grew by the stone wall with its purple-white flowers.
- The orpin comes back each year from its thick roots.
