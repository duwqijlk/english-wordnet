simpleMeaning: to break a hard thing into very small loose dry bits, or to make it turn to dust
scope: This is the act of breaking a hard thing into very small dry bits, not the fine dry stuff itself
  and not putting that stuff on skin.
examples:
- She powdered the dry herbs with a stone to make a fine mix.
- The old bricks powdered as they fell and turned to dust.
