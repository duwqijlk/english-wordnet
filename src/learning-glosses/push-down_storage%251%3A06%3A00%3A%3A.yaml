simpleMeaning: Data put into this part of a computer comes back out newest first.
scope: Also called stack and push-down store, this part of a computer hands back what was put in newest
  first, not oldest first.
examples:
- The push-down storage gave back the last number first.
- With push-down storage, the most recent file comes out before older ones.
