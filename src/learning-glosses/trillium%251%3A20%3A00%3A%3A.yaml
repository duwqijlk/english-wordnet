simpleMeaning: Three leaves in a ring at the top of the stem, and one flower with three petals, mark this
  lily-kind plant of its own group.
scope: Also called wake-robin and wood lily, this is a lily-kind plant of its own group, known by its
  three leaves in a ring and its one flower with three petals.
examples:
- The trillium shows three leaves in a ring at the top of its stem.
- A trillium bears one flower with three petals.
