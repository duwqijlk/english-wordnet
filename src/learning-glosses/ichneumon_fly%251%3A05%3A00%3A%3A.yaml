simpleMeaning: An insect with thin clear wings, much like a wasp, whose young live on caterpillars and
  other young insects and feed on them.
scope: An insect much like a wasp whose young live on other young insects.
examples:
- An ichneumon fly laid its eggs in the caterpillar.
- We saw an ichneumon fly hunting among the leaves.
