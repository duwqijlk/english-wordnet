simpleMeaning: to put straps on a horse or other animal so it can pull a cart
scope: This is the act of putting the gear on an animal, not the leather straps themselves and not straps
  that hold a person to the body.
examples:
- He harnessed the horse to the cart.
- They harnessed the two horses so they could pull the wagon.
