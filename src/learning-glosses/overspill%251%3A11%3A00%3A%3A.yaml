simpleMeaning: Extra liquid, such as water, running over the edge of a thing that can hold no more.
scope: Also called overflow or runoff, extra liquid, such as water, running over the edge of a thing that
  can hold no more; not the moving of people out of crowded cities to new homes in smaller towns.
examples:
- The overspill from the tank ran across the floor.
- After the rain, overspill from the ditch flooded the lane.
