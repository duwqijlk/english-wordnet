simpleMeaning: the tiny bits that make up a crystal, set out in a fixed three-way pattern
scope: Also called a crystal lattice, this is the set-out of a crystal's smallest bits.
examples:
- The space lattice of this crystal shows a set-out that runs in three ways.
- To picture the crystal, she first learned its space lattice.
