simpleMeaning: Sold under two trade names, this body chemical from the outer layer of the glands above
  the kidneys helps the body use starches and sugars and build proteins.
scope: Cortisol is another name for this body chemical, made in the glands above the kidneys.
examples:
- They measured the hydrocortisone in her blood.
- The glands above her kidneys make hydrocortisone.
