simpleMeaning: A unit of information, one thousand twenty-four zebibytes.
scope: Also called yobibyte, yottabyte and YiB, this is a unit of one thousand twenty-four zebibytes,
  not the other unit of the same name, one of one thousand zettabytes.
examples:
- The new data centre can store five YB of information.
- One YB holds one thousand twenty-four zebibytes.
