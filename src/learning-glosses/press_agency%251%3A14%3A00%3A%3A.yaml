simpleMeaning: For newspapers, this office gathers news reports and sends them out by computer
scope: 'Also called press association, a news agency, or a news organisation: an office that gathers news
  reports for newspapers and sends them out by computer; not a newspaper itself and not a single reporter.'
examples:
- The press agency sent the story to papers across the country.
- She works for a press agency that covers the courts.
