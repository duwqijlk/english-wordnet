simpleMeaning: a set of beliefs and ways of living built on Rudolf Steiner's ideas, claiming to join hands-on
  work and the life of the mind in child-first teaching
scope: A way of thought and teaching built on Steiner's ideas, not a religion and not ordinary schooling.
examples:
- She studied anthroposophy and sent her children to a Steiner school.
- Anthroposophy shapes the way that school teaches young children.
