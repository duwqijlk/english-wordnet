simpleMeaning: to cut or hurt someone with a long, curved sword
scope: This is cutting or hurting someone with a long, curved sword; it is not killing someone with that
  sword, and it is not the sword itself.
examples:
- The horseman sabered his opponent's arm in the fight.
- The soldier sabered the enemy soldier and left a deep cut.
