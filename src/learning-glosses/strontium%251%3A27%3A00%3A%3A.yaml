simpleMeaning: A soft metal that looks silver-white or a bit yellow, in the alkali metal group; it turns
  yellow in air; found in celestite and strontianite.
scope: Also called Sr and atomic number 38; a soft metal of the alkali group, not calcium and not a hard
  metal.
examples:
- Strontium salts burn red in fireworks.
- The lab keeps strontium sealed from air.
