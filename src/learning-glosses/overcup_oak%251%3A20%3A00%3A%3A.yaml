simpleMeaning: A tree of middle size or more in the middle and south United States, grown for wood, that
  sheds leaves, with acorns deep in their hollow, ripening in one year.
scope: This tree of middle size or more in the middle and south United States is grown for wood, and its
  acorns sit deep in their hollow rather than shallow in it.
examples:
- An overcup oak grows in the southern United States.
- The overcup oak drops its leaves in winter.
