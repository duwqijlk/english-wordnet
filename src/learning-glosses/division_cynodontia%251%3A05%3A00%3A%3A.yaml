simpleMeaning: A group within the order Therapsida, from the Triassic period, of small meat-eating four-legged
  reptiles, often with teeth like those of mammals.
scope: Also called Cynodontia; a Triassic group of small meat-eating reptiles with mammal-like teeth.
examples:
- The division Cynodontia lived in the Triassic period.
- Division Cynodontia reptiles had mammal-like teeth.
