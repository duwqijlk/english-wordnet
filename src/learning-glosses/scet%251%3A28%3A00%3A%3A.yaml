simpleMeaning: The time the whole world uses, on the ship in space.
scope: 'Also called spacecraft event time: the shared world time used on a spacecraft, not the time on
  Earth alone and not the time a signal takes to travel.'
examples:
- The crew checked the SCET before the next step in the flight.
- SCET told them when the craft would turn.
