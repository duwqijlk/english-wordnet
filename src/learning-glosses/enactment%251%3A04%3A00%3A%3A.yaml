senseId: 'enactment%1:04:00::'
synsetId: 00549839-n
simpleMeaning: Playing a part on stage, showing the person by words, acts, and movements.
scope: Also called portrayal or characterization, this is the playing of a part on stage, not a written
  paper that records what a council, a society, or a law-making body has decided.
examples:
- Her enactment of the queen held the crowd silent.
- His enactment of the old sailor won warm praise.
