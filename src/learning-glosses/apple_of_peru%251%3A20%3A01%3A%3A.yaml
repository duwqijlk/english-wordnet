simpleMeaning: A rough herb of South America, grown for blue-and-white flowers that give way to a balloon-like
  fruit holding a dry berry
scope: This is a rough herb of South America grown for its blue-and-white flowers, not the tall poisonous
  weed of the same name; shoo fly and Nicandra physaloides are other names for this sense.
examples:
- The apple of Peru bore a balloon-like fruit after its blue-and-white flowers faded.
- Gardeners plant apple of Peru for its blue-and-white flowers.
