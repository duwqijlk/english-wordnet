simpleMeaning: In computer science, the physical parts and wiring that let one device connect to another,
  such as a computer and a disk drive or other attached equipment.
scope: This is a computer connection point, not an opening for firing a gun, not a ship's left side, and
  not a seaport.
examples:
- Plug the monitor cable into the port on the back of the computer.
- The printer connects through a port on the docking station.
