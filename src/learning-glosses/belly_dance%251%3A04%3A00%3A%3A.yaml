scope: Steps from the Middle East in which the performer moves the hips and stomach in a way that pleases
  the senses, also called belly dancing and danse du ventre, not a folk dance and not a ballet.
examples:
- She learned the belly dance and now performs it at festivals.
- The belly dance uses movements of the hips and stomach that please the senses.
