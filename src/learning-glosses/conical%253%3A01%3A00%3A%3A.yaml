simpleMeaning: shaped with a round base and a pointed top, and with sides that slope in as they go up
scope: 'Also called conelike: this describes a shape with a round base and a pointed top, not a flat shape
  or a round ball shape.'
examples:
- The mountain has a conical shape, wide at the bottom and pointed at the top.
- She wore a tall conical hat at the party.
