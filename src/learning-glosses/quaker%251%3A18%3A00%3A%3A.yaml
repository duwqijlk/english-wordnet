simpleMeaning: a member of the Religious Society of Friends, a group started by George Fox, a name given
  by others that its members never used for themselves
scope: A member of the Religious Society of Friends founded by George Fox, whose members have never called
  themselves by this name, also called a Friend, and not a member of any other church.
examples:
- The Quaker spoke quietly at the meeting.
- Quakers refuse to swear oaths in court.
