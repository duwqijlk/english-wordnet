simpleMeaning: A red glow at the tip of a plane's left wing and a green glow at the tip of its right wing
  show its place and direction
scope: A coloured glow on a plane's wings that marks its place and direction, red on the left wing and
  green on the right.
examples:
- The navigation light on the left wing glowed red as the plane taxied in.
- Pilots check the navigation light on each wing before take-off.
