scope: A rod-shaped germ that causes the plague and can be sent through the air as a weapon; it is a disease
  germ, set apart from harmless germs by the plague it causes.
examples:
- Yersinia pestis is the germ that causes the plague.
- The lab keeps Yersinia pestis under tight guard.
