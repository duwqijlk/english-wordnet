simpleMeaning: a court decision made after the person who owes money admits the debt in writing, without
  the cost of ordinary court steps
scope: A court decision made after the person who owes money admits the debt in writing, without the cost
  of ordinary court steps; cognovit judgment, confession of judgement and confession of judgment are other
  names for this, not a decision that went through ordinary court steps and not a decision with no written
  admission.
examples:
- The court entered a cognovit judgement after the debtor's written confession.
- A cognovit judgement avoids the expense of a full trial.
