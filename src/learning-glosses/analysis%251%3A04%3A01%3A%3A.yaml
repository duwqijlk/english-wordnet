simpleMeaning: A therapy based on Sigmund Freud's theories that brings hidden motives and conflicts into
  awareness to ease mental illness.
scope: This is the Freudian talking therapy; it is not the general investigation or abstract separation
  of a whole into its parts, not literary criticism, not the grammatical use of function words instead
  of endings, and not the mathematical field built on calculus and limits.
examples:
- After two years of analysis, he finally understood why he sabotaged every relationship.
- The doctor recommended analysis rather than medication for her anxiety.
