simpleMeaning: The taste buds on the tongue and in the throat give you a feeling by telling you what a
  thing that melts in the mouth is made of.
scope: Also called taste, gustatory perception, taste perception and taste sensation, this is the feeling
  when taste buds tell you what a melting thing is made of.
examples:
- The gustatory sensation of the lemon made her mouth pucker.
- A sweet gustatory sensation followed the first bite of cake.
