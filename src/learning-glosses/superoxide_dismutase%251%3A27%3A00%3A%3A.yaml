simpleMeaning: A harmful kind of oxygen is turned into plain oxygen and a pale liquid made of hydrogen
  and oxygen by a stuff in the body that speeds up the change.
scope: Other stuffs in the body speed up other changes, but this one turns a harmful kind of oxygen into
  plain oxygen and a pale liquid made of hydrogen and oxygen.
examples:
- Oxygen free radicals are normally removed in our bodies by the superoxide dismutase enzymes.
- Without superoxide dismutase, the harmful kind of oxygen would build up in the cells.
