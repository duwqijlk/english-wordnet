simpleMeaning: A stronger warm sea event that comes every few years, when cold food-rich water fails to
  rise; it kills tiny sea life and fish and shifts weather.
scope: A stronger warm sea event than the usual one, coming every few years when cold food-rich water
  fails to rise, killing tiny sea life and fish and shifting weather.
examples:
- El Nino southern oscillation kills plankton and fish when the cold water fails to rise.
- Farmers watched the El Nino southern oscillation shift the weather that year.
