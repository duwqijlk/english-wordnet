simpleMeaning: a bitter plant chemical that can give off cyanide, taken from the seeds of apricots, plums,
  and bitter almonds
scope: A bitter plant chemical from fruit seeds, not a medicine on its own and not the seeds themselves.
examples:
- Amygdalin from bitter almond seeds can give off cyanide.
- The amygdalin in apricot seeds tastes bitter.
