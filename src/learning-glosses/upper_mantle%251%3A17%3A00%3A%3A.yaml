simpleMeaning: The top part of the thick layer of rock that lies below the earth's crust.
scope: The top part of the thick layer of rock below the earth's crust; not the crust itself and not the
  core deep inside the earth.
examples:
- The upper mantle lies just below the earth's crust.
- Heat from the upper mantle drives the movement of plates.
