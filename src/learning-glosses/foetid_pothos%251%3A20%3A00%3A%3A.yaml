simpleMeaning: a low-growing swamp plant of eastern North America that lives for years, sheds its leaves,
  and smells bad, with tiny flowers inside a mottled greenish or purple hood-shaped sheath.
scope: This is the low, bad-smelling swamp plant of eastern North America; 'polecat weed' is another name
  for it, not a different species.
examples:
- Foetid pothos grew thickly along the muddy bank.
- We smelled foetid pothos before we spotted its mottled purple hoods.
