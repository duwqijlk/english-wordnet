simpleMeaning: completely and in every way; in everyday talk people sometimes say 'good' to mean the same
  thing
scope: This sense means completely, with nothing left partly done; it is not the sense of doing a job
  with great care.
examples:
- He was thoroughly beaten in the final game.
- The team was thoroughly beaten and had no chance to win.
