simpleMeaning: A group of nations made up of the United Kingdom and several former colonies that now rule
  themselves yet still owe loyalty to the Crown
scope: A group of self-ruling nations tied to the British Crown; also called Commonwealth of Nations,
  not a single country.
examples:
- The British Commonwealth brings together the United Kingdom and former colonies.
- Many nations of the British Commonwealth still pay allegiance to the Crown.
