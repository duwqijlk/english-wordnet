simpleMeaning: This short piece of writing shows what life in the country is like
scope: A short poem about country life, also called an idyll, a bucolic, or an eclogue; not a piece of
  music about country life and not a long poem.
examples:
- He read an idyl about shepherds and green fields.
- Her new idyl tells of quiet days on a farm.
