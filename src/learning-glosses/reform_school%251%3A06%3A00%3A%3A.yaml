simpleMeaning: a place where young people or people who broke the law for the first time are kept, taught
  to behave, and given skills
scope: 'Also called a reformatory and a training school: a place that keeps and trains young or first
  offenders, not an ordinary school and not a prison for adults.'
examples:
- After the court case, the teenager was sent to a reform school.
- The reform school teaches its pupils a trade as well as school lessons.
