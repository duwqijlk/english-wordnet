simpleMeaning: a quick short burst of liquid, usually water with gas bubbles in it
scope: A quick burst of liquid itself, not the act of spraying liquid over a place to cover it.
examples:
- She gave the dry plant a quick spritz of water.
- He put a spritz of soda in the glass.
