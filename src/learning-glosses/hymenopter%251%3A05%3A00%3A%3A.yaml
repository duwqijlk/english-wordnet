simpleMeaning: An egg-laying part made for stinging or piercing, and two pairs of thin skin-like wings,
  mark these insects.
scope: Hymenopteran, hymenopteron and hymenopterous insect are other names for these insects.
examples:
- The hymenopter stung her hand.
- Ants, bees and wasps are hymenopters.
