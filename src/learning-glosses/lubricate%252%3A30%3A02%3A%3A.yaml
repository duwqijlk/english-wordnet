simpleMeaning: to make something smooth or slippery by putting a slippery substance on it
scope: To make a surface smooth or slippery by putting a slippery substance on it, not just to put that
  substance on something and not to have smooth or slippery qualities by itself.
examples:
- He lubricated the lock with oil, and the key turned easily.
- The oil lubricated the metal parts so they moved smoothly.
