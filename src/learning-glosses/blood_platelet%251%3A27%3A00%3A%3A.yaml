simpleMeaning: When a cut bleeds, these tiny bits of living stuff in the red liquid of animals with backbones
  make it thicken and stop the flow.
scope: Also called platelet or thrombocyte, these are tiny bits of living stuff in the red liquid of animals
  with backbones, needed to make it thicken and stop a cut from bleeding.
examples:
- After the cut, blood platelets gathered to stop the bleeding.
- A test showed too few blood platelets in the sample.
