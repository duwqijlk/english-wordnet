simpleMeaning: A person from one of the first peoples of North America who speak a tongue, living in the
  cold north of western Canada and middle Alaska.
scope: Also called Athabaskan, Athapascan, and Athapaskan; a person from one of the first peoples of North
  America, not the group of tongues they speak.
examples:
- He is an Athabascan from the far north of Canada.
- The Athabascan speaks a tongue of the first peoples of North America.
