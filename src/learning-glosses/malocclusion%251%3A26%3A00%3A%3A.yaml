simpleMeaning: In dentistry, a state in which the upper and lower teeth do not meet in the normal way
scope: A bad fit between the upper and lower teeth, not a broken tooth and not a tooth that has grown
  out of place.
examples:
- The dentist said her malocclusion made chewing hard.
- His malocclusion means his back teeth do not meet when he bites down.
