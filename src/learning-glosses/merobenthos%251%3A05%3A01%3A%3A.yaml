simpleMeaning: life on the sea floor made of young creatures that later live as adults among the small
  floating life of the sea
scope: Life on the sea floor made of young creatures that later live among the floating life of the sea;
  not the floating life itself, and not animals that live on the sea floor all their lives.
examples:
- Merobenthos spend their youth on the sea floor before joining the plankton as adults.
- The young crabs are merobenthos, living on the bottom until they grow up.
