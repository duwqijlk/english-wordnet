simpleMeaning: The dried leaves of the hemp plant, thought of as a mild drug, smoked or chewed to give
  a feeling of great pleasure, the most used drug the law forbids.
scope: Also called marijuana, ganja, and marihuana; the drug made from the dried leaves of the hemp plant,
  not the plant itself.
examples:
- He was caught with cannabis in his pocket.
- Cannabis is smoked for the feeling of pleasure it gives.
