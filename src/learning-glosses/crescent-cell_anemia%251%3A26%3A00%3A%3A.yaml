simpleMeaning: Born with it, people with this blood illness, found mostly in black people, have red parts
  of the blood in the wrong shape, bent like a half moon
scope: People are born with this blood illness, also called crescent-cell anaemia, drepanocytic anaemia,
  drepanocytic anemia, sickle-cell anaemia, sickle-cell anemia, and sickle-cell disease, and it is found
  mostly in black people.
examples:
- The child was born with crescent-cell anemia.
- He has lived with crescent-cell anemia since birth.
