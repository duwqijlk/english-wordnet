simpleMeaning: the way a chain of building blocks of the body bends and turns until it takes its fine
  shape in three directions
scope: The way a chain of building blocks of the body bends and turns until it takes its fine shape in
  three directions; also called folding; not the making of the chain, and not the breaking of it.
examples:
- Protein folding gives each chain its working shape.
- When protein folding goes wrong, the chain cannot do its job.
