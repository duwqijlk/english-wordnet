simpleMeaning: A hard-wooded plant of America that bears nuts good to eat.
scope: A hard-wooded American plant bearing nuts good to eat; hickory is another name for this sense,
  and this is not a soft-wooded plant or one whose nuts cannot be eaten.
examples:
- A hickory tree stood at the edge of the field, dropping nuts in autumn.
- The hickory tree gave shade and nuts good to eat.
