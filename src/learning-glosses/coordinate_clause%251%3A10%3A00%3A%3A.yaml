senseId: 'coordinate_clause%1:10:00::'
synsetId: 06325588-n
simpleMeaning: In grammar, a part of a long sentence that works like the main part, doing the same job
  and standing on the same level
scope: In grammar, this name is given to a part of a long sentence that does the same work as the main
  part and stands equal to it.
examples:
- In 'She sang and he played,' 'he played' is a coordinate clause.
- The coordinate clause 'the rain fell' stands on its own in the long sentence.
