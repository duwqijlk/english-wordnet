scope: Also called a horned asp, cerastes, and a sand viper, this very poisonous snake of north Africa
  and south-west Asia is known by the hard point above each eye.
examples:
- The horned viper raised its head, the hard point above each eye clear to see.
- A horned viper in north Africa showed the hard point above each eye.
