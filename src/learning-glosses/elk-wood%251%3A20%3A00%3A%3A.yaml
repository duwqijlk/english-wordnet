simpleMeaning: Creamy white flowers and big leaves spread like open umbrellas at branch ends mark this
  small tree from eastern North America, which sheds its leaves each year
scope: This small tree, also called elkwood, umbrella magnolia, and umbrella tree, grows in eastern North
  America with creamy white flowers and big leaves spread like open umbrellas.
examples:
- The elk-wood in the garden had creamy white flowers in spring.
- Elk-wood grows as a small tree with big leaves at the ends of its branches.
