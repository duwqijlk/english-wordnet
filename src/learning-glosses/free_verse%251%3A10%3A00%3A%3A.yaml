senseId: 'free_verse%1:10:00::'
synsetId: 06391996-n
simpleMeaning: Poetry with no rhyme and no fixed beat or line length
scope: Poetry without rhyme or a set beat, not rhymed verse and not blank verse, which keeps a set beat.
examples:
- She wrote the poem in free verse, with lines of uneven length.
- Free verse lets the poet follow the sense of the words, not a set beat.
