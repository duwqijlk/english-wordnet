simpleMeaning: a machine that sends a copy of a page by wire or by radio
scope: A machine that sends copies of pages by wire or radio; not the paper copy itself and not a message
  sent by post.
examples:
- She sent the letter by fax from the office.
- He put the page into the fax and pressed the send button.
