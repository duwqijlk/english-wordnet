simpleMeaning: having parts or patches that are not the same color as each other, and usually bright
scope: 'Also called painted, multicolor, multicolored, motley, piebald, calico, multicolour, multicoloured,
  multi-color, multi-colored, multi-colour, multi-coloured, particolored and particoloured: having patches
  in different, usually bright colors, not all in one plain color.'
examples:
- The jester wore a pied coat of red and yellow patches.
- A pied horse with black and white patches stood in the field.
