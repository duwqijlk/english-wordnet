simpleMeaning: One of the Algonquian people, a group of native peoples of North America, who live in Maine
  and the south of Quebec
scope: 'Also called Abnaki: a member of the Algonquian people of Maine and southern Quebec, not a member
  of another native people.'
examples:
- The Abenaki lived in Maine and southern Quebec.
- She is Abenaki, and her family comes from Quebec.
