simpleMeaning: a plant sickness in which the leaves droop and dry up, brought on by one kind of fungus
scope: A plant sickness from one kind of fungus, not a lack of water and not damage from cold.
examples:
- Fusarium wilt killed half the tomato plants in the field.
- The farmer pulled up the plants hit by fusarium wilt before it could spread.
