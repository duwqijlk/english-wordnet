senseId: 'impressionable%3:00:00::'
synsetId: 02373016-a
simpleMeaning: easily affected by what others say or do, and easily led to change your mind, feelings
  or actions
scope: This describes a person whose mind, feelings or actions are easily changed by others. It is not
  about a mark made by pressing on something, and not about a person who stays firm and does not change.
examples:
- Young children are impressionable and copy what they see at home.
- He was impressionable, so his friends soon talked him into a new plan.
