simpleMeaning: a flared frill sewn to the waist of a dress, jacket or blouse
scope: A flared frill at the waist of a dress, jacket or blouse, not a skirt and not a belt.
examples:
- Her dress had a peplum at the waist.
- The jacket's peplum flared over her hips.
