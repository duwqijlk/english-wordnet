simpleMeaning: the state of having a baby growing inside a woman's body, and the time from when it starts
  to grow until the baby is born
scope: This is the state and the time while a baby grows inside a woman before birth, not the birth itself
  and not the baby.
examples:
- Her pregnancy lasted nine months, and the baby was born in June.
- During her pregnancy, she went to the doctor for regular checks.
