senseId: 'hiatal_hernia%1:26:00::'
synsetId: 14319901-n
simpleMeaning: A sickness in which part of the stomach pushes up through the sheet of muscle that divides
  the chest from the belly.
scope: Part of the stomach pushing up through the muscle sheet between chest and belly; diaphragmatic
  hernia and hiatus hernia are other names for this sense, and this is not a swelling in the groin or
  a hole in the belly wall.
examples:
- His hiatal hernia pushed part of his stomach up into his chest.
- A hiatal hernia can cause heartburn after meals.
