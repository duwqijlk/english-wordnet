simpleMeaning: Just above the sex parts on the outside of the body lies the lower part of the belly
scope: This is the lower part of the belly just above the sex parts on the outside of the body, not the
  sex parts themselves; loins and pubes are other names for this sense.
examples:
- He felt pain in his pubic region after the fall.
- The doctor checked the pubic region for swelling.
