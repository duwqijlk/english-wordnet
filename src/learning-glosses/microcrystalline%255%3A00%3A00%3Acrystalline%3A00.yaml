simpleMeaning: Only with a microscope can you see the crystals that make up this thing
scope: A thing made of tiny crystals, not one with crystals you can see with your eyes alone and not one
  with no crystals at all.
examples:
- The microcrystalline wax looked smooth until we put it under a microscope.
- Microcrystalline rock has crystals too small to see with the eye alone.
