simpleMeaning: a first award from a college or university given to a person who has finished a first course
  of study
scope: 'Also called a baccalaureate: the first award from a college or university for finishing a first
  course of study, not a higher award and not the course of study itself.'
examples:
- She earned her bachelor's degree in history last spring.
- His bachelor's degree helped him get his first job.
