simpleMeaning: the right to buy or sell shares at a set price within a stated time
scope: A right to trade shares at a fixed price within a set time, not the shares themselves and not a
  right to trade at any price.
examples:
- Her stock option lets her buy shares at last year's price.
- He sold his stock option before the deadline.
