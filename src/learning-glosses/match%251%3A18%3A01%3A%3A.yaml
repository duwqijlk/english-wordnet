simpleMeaning: a person that others see as a good possible husband or wife
scope: This is a person, not a game or contest, and not a pair of things that look the same.
examples:
- Her parents thought the young doctor was a fine match for their daughter.
- In those days, a wealthy landowner was seen as an excellent match.
