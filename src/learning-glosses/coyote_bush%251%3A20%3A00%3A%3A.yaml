simpleMeaning: In the southwest of the United States, a wide-spreading shrub that keeps its leaves through
  the year and bears flower heads in a leafy branching cluster.
scope: Also called chaparral broom, coyote brush and kidney wort; it is a wide-spreading bush that keeps
  its leaves through the year.
examples:
- Coyote bush keeps its leaves through the year.
- The coyote bush spreads wide in the southwest.
