simpleMeaning: made harder, more flexible or more springy, usually by heating and cooling
scope: This is not about medical care or a general chemical wash; it is specifically about material made
  harder, more flexible or more springy by heat.
examples:
- The heat-treated blade flexed without breaking.
- The treated springs were heated and cooled to make them springy.
