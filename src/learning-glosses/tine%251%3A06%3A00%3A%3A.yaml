simpleMeaning: a thin, pointed part that sticks out on a fork, a pitchfork, or an antler
scope: One pointed part on a fork, a pitchfork or an antler, not the whole fork or the whole set of horns.
examples:
- One tine of the fork was bent.
- Each tine on the pitchfork was sharp.
