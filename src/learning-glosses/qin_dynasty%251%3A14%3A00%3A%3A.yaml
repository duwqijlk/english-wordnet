simpleMeaning: The Chinese ruling house from 246 to 206 BC that set up the first central rule of one emperor
  and built much of the Great Wall
scope: This is the Chinese ruling house from 246 to 206 BC that set up the first central rule of one emperor;
  Ch'in, Ch'in dynasty and Qin are other names for this sense, and it is one of the ruling houses of China,
  close to the Han house and the Ming house.
examples:
- The Qin dynasty set up the first central rule of one emperor in China.
- The Qin dynasty built much of the Great Wall.
