simpleMeaning: so horrible and disgusting that it shocks people and fills them with horror
scope: 'Also called sick, grim, gruesome, ghastly or grisly: about something so horrible that it shocks
  people and fills them with horror; not just sad, dark or ugly in a small way.'
examples:
- The book tells a macabre story about a killer who kept the bodies in his house.
- They found the macabre remains of dead animals in the empty house.
