simpleMeaning: the act of giving a person a court paper that gives an order or tells them to come to court
scope: Also called service, this is the act of giving a court paper to a person.
examples:
- The serving of the court papers took place at his home on Monday.
- After the serving, she knew she had to appear in court the next week.
