simpleMeaning: A rough grey-green plant that lives one year and has yellow flowers, found from the southwest
  of the United States to Mexico.
scope: This is a yellow-flowered wild plant, not a garden flower or a crop; also called butter daisy,
  golden crown beard, and golden crownbeard.
examples:
- Cowpen daisies grow along the road in Texas.
- We saw a cowpen daisy near the fence.
