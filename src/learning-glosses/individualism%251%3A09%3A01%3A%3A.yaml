simpleMeaning: a belief that each person is of great worth, and that it is good to look after yourself
  and be free to make your own choices
scope: This is the belief that each person matters and should be free to live in their own way, not the
  quality of being one single, separate person.
examples:
- His strong individualism made him want to work alone and decide everything for himself.
- Individualism in this town means people look after themselves first and do not wait for help.
