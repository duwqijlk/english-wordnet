simpleMeaning: An antelope from Africa, closely related to the waterbuck, a kind of antelope that lives
  near water
scope: An African antelope, not a deer and not a goat; it is a close kin of the waterbuck.
examples:
- We watched a puku grazing near the river.
- The puku is smaller than the waterbuck it is related to.
