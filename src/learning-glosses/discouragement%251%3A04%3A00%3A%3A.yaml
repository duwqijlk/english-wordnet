senseId: 'discouragement%1:04:00::'
synsetId: 01078648-n
simpleMeaning: the act of making someone feel less sure or lose hope, or of trying to stop something from
  being done
scope: This is the act of making someone lose hope, not words that show you are against a plan, and not
  the sad feeling itself.
examples:
- His discouragement of her plan made her give up trying.
- They used loud warnings for the discouragement of theft from the shop.
