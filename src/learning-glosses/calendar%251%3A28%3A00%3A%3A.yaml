simpleMeaning: A way of counting time that sets when the year starts, how long it lasts, and how it is
  split up
scope: A system for counting the days of the year, not a list of coming events and not the act of writing
  one down.
examples:
- The old calendar began the year in spring.
- Each calendar divides the year in its own way.
