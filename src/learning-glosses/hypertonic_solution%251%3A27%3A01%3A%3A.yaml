simpleMeaning: A liquid with more salt than body cells have, so water is pulled out of the cells by osmosis,
  water moving through a thin wall
scope: A liquid saltier than body cells, which pulls water out of them; not a liquid with the same salt
  level as cells and not plain water.
examples:
- The nurse used a hypertonic solution to draw fluid from the swollen tissue.
- A hypertonic solution has more salt than the cells it touches.
