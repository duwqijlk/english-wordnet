simpleMeaning: 'a broad kind of writing: accounts that describe travel, also called travelogues or itineraries,
  telling how a person or group met a new place, its people, and their ways'
scope: Writing that tells of journeys to new places, not a guidebook telling you where to go and not a
  made-up story of travel.
examples:
- The travel literature of the 1800s tells of long sea voyages.
- She reads travel literature before every trip.
