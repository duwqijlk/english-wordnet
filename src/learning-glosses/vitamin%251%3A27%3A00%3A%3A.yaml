simpleMeaning: One of a set of natural stuffs the body needs in tiny amounts to stay well and work as
  it should.
scope: A natural stuff the body needs in tiny amounts to work well, not a medicine and not a food itself.
examples:
- Oranges give you vitamin C.
- The doctor said she needed more vitamin D.
