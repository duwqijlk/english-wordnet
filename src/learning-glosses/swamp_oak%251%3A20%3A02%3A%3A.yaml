senseId: 'swamp_oak%1:20:02::'
synsetId: 12297389-n
simpleMeaning: A medium-sized to large, fast-growing cone-shaped oak of the northeastern United States
  and southeastern Canada whose deeply cut leaves turn bright red in autumn before falling; it likes damp
  ground.
scope: In this sense swamp oak is another name for the northern pin oak, the cone-shaped tree with red
  autumn leaves; it is not the Australian broom-like shrub, nor the large flaky-barked oak of the eastern
  United States that also carries the name.
examples:
- The swamp oak in the hollow grows fast and turns bright red each autumn.
- Swamp oak seedlings do well in the damp soil along the creek.
