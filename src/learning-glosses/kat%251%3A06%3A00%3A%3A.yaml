simpleMeaning: The leaves of a small bush, chewed like tobacco or used to make tea, that make a person
  feel happy and more awake
scope: 'Also called cat, khat, qat and quat: these leaves chewed or made into tea, not the bush itself
  and not tobacco.'
examples:
- In Yemen, many adults chew kat every day.
- She made tea from kat leaves.
