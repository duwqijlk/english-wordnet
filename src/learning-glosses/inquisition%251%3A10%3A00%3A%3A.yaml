senseId: 'inquisition%1:10:00::'
synsetId: 07209336-n
simpleMeaning: A very hard questioning of a person, often breaking their rights or their right to keep
  their life private
scope: This sense is a very hard questioning of a person, not a normal set of questions and not the old
  church court also called the Inquisition.
examples:
- After his arrest, he faced a long inquisition about where he had been that night.
- She felt the interview had become an inquisition, with hard questions about her private life.
