simpleMeaning: special clothes of one design, worn by members of a group so that people can tell who they
  are
scope: The special clothes a group wears to show who its members are, not the verb sense of giving such
  clothes to a group, and not the word for things that are all the same.
examples:
- The nurses wear a blue uniform at the hospital.
- His school uniform has a white shirt and dark trousers.
