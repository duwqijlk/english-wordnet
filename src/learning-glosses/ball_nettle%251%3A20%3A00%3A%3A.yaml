simpleMeaning: Found all over the south and east of the United States, this rough weed with sharp points
  has pale yellow flowers and yellow fruit like small berries
scope: Also called ball nightshade, bull nettle, and horse nettle, this rough weed with sharp points has
  pale yellow flowers and yellow fruit like small berries, and is found all over the south and east of
  the United States.
examples:
- Ball nettle pricked her hands.
