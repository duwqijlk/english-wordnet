simpleMeaning: Wide wing-like side fins spread from bodies that are flat, yet these sharks swim in the
  usual shark way.
scope: These are flat-bodied sharks with wide wing-like side fins, also called monkfish and angel shark,
  not the deep-bodied food fish of the warmer western Atlantic waters that shares the same name.
examples:
- The angelfish rested with its wide fins spread like wings.
- An angelfish swam by, moving the way sharks do.
