simpleMeaning: a lamp that gives a short light so a person can take a photo
scope: 'Also called flash: this is a lamp that gives a short light for a photo, not a lamp that stays
  on to light a room.'
examples:
- The old camera used a flashbulb for each photo.
- She put a new flashbulb in the camera before the party.
