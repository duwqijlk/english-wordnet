simpleMeaning: a plant of middle size that grows from West Virginia to Florida and Texas
scope: A plant of middle size from West Virginia to Florida and Texas, also called opossum wood, a silverbell
  tree and a snowdrop tree; not a small bush and not a plant from another part of the country.
examples:
- A silver-bell tree grew beside the road in West Virginia.
- We saw a silver-bell tree in flower in Texas.
