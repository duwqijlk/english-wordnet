simpleMeaning: an undergarment a woman wears that fits close to her body and helps hold its shape
scope: This is a woman's undergarment that fits close and helps hold the body's shape; not about remaining
  in a place and not a rope on a ship.
examples:
- In the old days, women wore stays under their dresses.
- Her stays were laced so tight she could hardly breathe.
