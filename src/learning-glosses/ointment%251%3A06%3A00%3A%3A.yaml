simpleMeaning: a thick soft stuff, often with a medicine in it, that you spread on the skin to heal it
  or to calm a sore or itchy place
scope: A thick stuff spread on the skin to heal or soothe it, also called salve or balm, and not the thick
  liquid toiletry used to soften the skin.
examples:
- She put ointment on the cut.
- The ointment soothed the rash.
