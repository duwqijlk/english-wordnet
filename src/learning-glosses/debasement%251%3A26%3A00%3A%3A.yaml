simpleMeaning: The mixing of a thing with outside matter that lowers it, and the lowered thing itself.
scope: The act of spoiling a thing by mixing in outside matter, and the spoiled thing itself.
examples:
- The debasement of the coinage ruined trade.
- Debasement of the gold made the coins worth less.
