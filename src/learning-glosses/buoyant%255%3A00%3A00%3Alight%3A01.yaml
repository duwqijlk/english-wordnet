simpleMeaning: able to float on water or another liquid, or to rise through air or gas
scope: This is for a thing that can float or rise, also called floaty. It is not about a person who is
  lively and happy.
examples:
- The light wood is buoyant and will not sink in the lake.
- A buoyant balloon rose slowly above the houses.
