simpleMeaning: The parts in and around the nose are fed by a side tube off the blood tube of the eye
scope: This side tube off the blood tube of the eye is also called the ethmoidal artery.
examples:
- Blood from the arteria ethmoidalis feeds the nose and the parts around it.
- The arteria ethmoidalis runs from the blood tube of the eye toward the nose.
