simpleMeaning: having a very good name that people know, and well thought of by other people
scope: 'Also called prestigious: having a very good name and being well thought of by people; not about
  being given a special award, and not about a promise or a cheque being paid.'
examples:
- She is an honored teacher, known and well thought of by the whole town.
- Our honored guest gave a short speech at the dinner.
