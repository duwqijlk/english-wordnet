simpleMeaning: A body or a part of it is left cut, broken, wrecked or spoiled in how it looks by this
  person
scope: Also called mangler and mutilator, this is a person who leaves a body or a part of it cut, broken,
  wrecked or spoiled in how it looks, not a killer and not a person who hurts by accident.
examples:
- The maimer left his victim unable to walk.
- Police caught the maimer after he wrecked his third victim's leg.
