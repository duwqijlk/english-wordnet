simpleMeaning: Often mixed up with rattlesnake master, this rough, prickly plant of the southeast United
  States lives for many years and has sweet-smelling roots.
scope: A prickly plant of the southeast United States, not the one thought to cure a rattlesnake bite
  or the Liatris plants of the same name.
examples:
- The button snakeroot in the garden has sharp leaves.
- Do not mix up button snakeroot with rattlesnake master.
