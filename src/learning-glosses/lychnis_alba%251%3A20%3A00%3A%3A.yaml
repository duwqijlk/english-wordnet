simpleMeaning: A blue-green herb with sticky stems and bunches of large white flowers opening in the evening,
  each with a much-swollen cup at its base, sometimes put in the same-named genus
scope: 'Also called bladder campion, evening lychnis, white campion, white cockle, and Silene latifolia:
  a blue-green herb with sticky stems and bunches of large white flowers opening in the evening, each
  with a much-swollen cup at its base.'
examples:
- Lychnis alba has large white flowers that open in the evening.
- The sticky stems of Lychnis alba bear bunches of white flowers.
