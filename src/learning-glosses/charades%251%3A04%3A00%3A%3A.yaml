simpleMeaning: a game where one person acts out a word or a group of words without speaking, and the others
  try to guess it
scope: A guessing game played by acting without words, not a written word puzzle and not a board game.
examples:
- We played charades after dinner, and I acted out a film title.
- In charades, she moved her hands like a cat and we guessed at once.
