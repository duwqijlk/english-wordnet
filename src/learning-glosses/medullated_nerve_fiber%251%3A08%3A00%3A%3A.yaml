simpleMeaning: A cord that carries signals through the body, wrapped in a coat called myelin
scope: A signal-carrying cord wrapped in myelin; myelinated nerve fiber is another name for this, not
  a bare cord without a coat and not a blood tube.
examples:
- A medullated nerve fiber carries signals fast.
- The medullated nerve fibers in the arm were wrapped in myelin.
