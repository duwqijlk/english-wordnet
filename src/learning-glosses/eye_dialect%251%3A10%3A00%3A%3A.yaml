simpleMeaning: The use of odd spellings in writing to show that a speaker talks in a plain everyday way
  or has had little schooling.
scope: A way of writing that marks a speaker as plain-spoken or little-schooled, not a real spoken accent
  and not a careless spelling slip.
examples:
- The novelist used eye dialect to give the farmer's speech a country sound.
- In the play, eye dialect marks the old sailor as a man of little schooling.
