simpleMeaning: the green colouring stuff found in brown sea plants, in diatoms, tiny one-celled plants,
  and in flagellates, tiny one-celled living things
scope: 'Also called chlorofucin: the green colouring stuff in brown sea plants and tiny one-celled living
  things, not the kind found in most higher plants and not the main green colouring stuff in plants.'
examples:
- Chlorophyll c is found in brown algae.
- The diatoms in the sample hold chlorophyll c.
