simpleMeaning: A way of working with numbers that compares two or more averages at once and gives numbers
  to check if a real link exists between things that change.
scope: A way of working with numbers that compares two or more averages at once, also called analysis
  of variance; its nearest kin are other ways of working with numbers that test averages, such as the
  t-test.
examples:
- ANOVA showed the three averages were truly different.
- We ran ANOVA on the test scores to see if the group averages truly differed.
