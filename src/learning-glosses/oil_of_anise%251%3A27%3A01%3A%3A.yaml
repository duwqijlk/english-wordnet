simpleMeaning: A strong-smelling liquid got from the seeds of a plant called Pimpinella anisum, with a
  sharp smell like liquorice.
scope: Also called anise oil and aniseed oil, it is a strong-smelling liquid got from seeds.
examples:
- A drop of oil of anise gives the cake its sharp liquorice smell.
- The cook added oil of anise to the sweet.
