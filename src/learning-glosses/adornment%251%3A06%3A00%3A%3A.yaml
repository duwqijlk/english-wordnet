senseId: 'adornment%1:06:00::'
synsetId: 02684372-n
simpleMeaning: something added to a place or thing to add color or interest and make it look less plain
scope: The added thing itself, a bit of color or interest put on something plain; not the act of putting
  it there.
examples:
- A row of red flowers was the only adornment in the bare room.
- The plain hall had no adornment except a single painting.
