schema: oewn-learning-gloss-v2
senseId: 'loosen%2:30:01::'
synsetId: 00420328-v
simpleMeaning: to make something less tight than it was before
scope: 'Also called loose: to make something less tight by acting on it, such as easing the tension on
  a rope. It is not about becoming less tight on its own, and not about undoing a knot or tie.'
examples:
- He loosened the rope so it was less tight around the post.
- She loosened her grip on the handle a little.
