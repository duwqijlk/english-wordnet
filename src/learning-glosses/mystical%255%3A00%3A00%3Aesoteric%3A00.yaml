simpleMeaning: having a meaning that the senses cannot find and the mind cannot easily work out, and more
  than people can understand in the usual way
scope: Also called secret, mysterious, mystic, occult, and orphic. This means having a meaning people
  cannot understand in the usual way, not just to do with mysticism or its beliefs and practices.
examples:
- The poem has a mystical meaning that is hard to put into plain words.
- She felt a mystical power in the old stones that she could not explain.
