simpleMeaning: A painkiller for mild pain that also lowers fever but does not reduce swelling or inflammation;
  sold as Tylenol and other brands.
scope: The generic medicine itself, sold under brand names such as Tylenol and also called paracetamol;
  not a brand name or a different painkiller such as ibuprofen.
examples:
- She took acetaminophen for her headache but avoided it for her swollen knee, since it does not ease
  inflammation.
- Doctors often recommend acetaminophen to bring down a fever.
