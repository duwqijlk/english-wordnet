simpleMeaning: a gun that fills itself with a new bullet after each shot and keeps firing until the trigger
  is let go
scope: 'Also called an automatic firearm and an automatic gun: a gun that reloads itself and keeps firing,
  not a gun that fires one shot at a time and must be loaded by hand.'
examples:
- The automatic weapon kept firing until the trigger was let go.
- An automatic weapon loads itself after every shot.
