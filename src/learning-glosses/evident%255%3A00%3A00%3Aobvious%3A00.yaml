senseId: evident%5:00:00:obvious:00
synsetId: 01622528-s
simpleMeaning: shown in a clear way to the mind, to the senses, and to your judgment, so it is easy to
  see or understand
scope: Also called plain, apparent, manifest, unmistakable, palpable, and patent. This means clear to
  see, feel, or judge, not hidden and not hard to understand.
examples:
- It was evident from his smile that he was pleased with the result.
- The damage to the roof was evident after the storm.
