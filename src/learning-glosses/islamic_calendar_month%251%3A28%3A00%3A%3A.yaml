simpleMeaning: Any part of the year that follows the moon, as Muslims count the year.
scope: Any part of the year that follows the moon, as Muslims count it, not a part of the year that follows
  the sun.
examples:
- The Islamic calendar month of Ramadan begins with the new moon.
- Each Islamic calendar month starts when the moon is first seen.
