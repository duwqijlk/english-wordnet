simpleMeaning: about or being a Christian church that believes each person on their own must turn to God,
  and that the Bible has no errors, especially the four Gospels
scope: This is about a church that believes in personal turning to God and that the Bible has no errors.
  It is not the sense about being in keeping with the Christian gospel, especially in the first four books
  of the New Testament, and not the sense of being very keen for a cause.
examples:
- She grew up in an evangelical church that taught people to turn to God themselves.
- The evangelical church runs classes on reading the Bible.
