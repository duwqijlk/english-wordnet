simpleMeaning: Most often to make a person look silly, someone plays a trick on them
scope: This is a trick played on a person to make them look silly, not a funny story told in words or
  a trick meant to hurt someone.
examples:
- He played a practical joke on his brother by hiding his shoes.
- Her practical joke made the whole class laugh at the teacher.
