senseId: 'constipated%3:00:00::'
synsetId: 00641275-a
simpleMeaning: having trouble passing solid waste from the body, or passing it only in part or not often
scope: This word describes the body when solid waste is hard to pass, passes only in part, or does not
  pass often. It does not mean blocked in any other way.
examples:
- He felt constipated after days without enough water or fruit.
- The doctor asked if she had been constipated that week.
