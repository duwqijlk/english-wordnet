simpleMeaning: a cutting tool with a short stiff blade that ends in a curve, used for cutting floor covering
scope: A knife with a short stiff blade that ends in a curve for cutting floor covering; linoleum cutter
  is another name for this sense, not a kitchen knife and not a tool for cutting cloth.
examples:
- She cut the floor covering with a linoleum knife.
- The linoleum knife has a short stiff blade with a curved tip.
