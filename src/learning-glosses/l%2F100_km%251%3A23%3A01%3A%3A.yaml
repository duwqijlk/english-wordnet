simpleMeaning: A way of gauging how much fuel a vehicle uses, as the litres of petrol or diesel it burns
  to go one hundred kilometres
scope: This is a way of gauging fuel use by the litres burned over one hundred kilometres; liters per
  hundred kilometers and litres per hundred kilometres are other names for this sense.
examples:
- The car uses 6 L/100 km on the motorway.
- L/100 km shows how much fuel a vehicle burns over one hundred kilometres.
