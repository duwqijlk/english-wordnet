simpleMeaning: a protein that uses water to cut ribonucleic acid, the cell acid that carries the code
  for making proteins, into smaller pieces
scope: 'Also called ribonuclease: a protein that cuts ribonucleic acid into smaller pieces, not a protein
  that joins pieces together and not a protein that copies the acid.'
examples:
- Ribonucleinase cut the ribonucleic acid into small pieces in the dish.
- The lab used ribonucleinase to get rid of the RNA in the sample.
