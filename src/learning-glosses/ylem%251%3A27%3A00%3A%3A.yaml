simpleMeaning: In cosmology, the first stuff that, in the big bang theory, was there before the chemical
  elements formed
scope: In cosmology, the first stuff of the universe before the chemical elements formed; not ordinary
  matter and not the big bang itself.
examples:
- According to the theory, ylem filled the universe before the first atoms formed.
- Scientists use the word ylem for the first matter of the big bang.
