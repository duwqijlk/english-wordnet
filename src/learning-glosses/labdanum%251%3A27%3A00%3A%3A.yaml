simpleMeaning: Perfume makers use this sweet-smelling sticky plant stuff, dark brown to greenish, to make
  a scent last; it comes as a juice from certain rockroses.
scope: Also called gum labdanum, this is a sticky plant juice used to fix perfume, not the rockrose plant
  itself and not the soft resin that shares its name.
examples:
- The perfumer added a drop of labdanum to fix the scent.
- Labdanum is collected as a juice from certain rockroses.
