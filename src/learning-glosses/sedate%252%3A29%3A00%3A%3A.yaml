simpleMeaning: to make a person or animal calm and quiet by giving a drug that calms them
scope: To make a person or animal calm and quiet by giving a drug that calms them, also called calm; not
  a grave and solemn person who keeps promises.
examples:
- The patient must be sedated before the operation.
- The vet sedated the frightened dog so she could treat its leg.
