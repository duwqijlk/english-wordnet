simpleMeaning: A thickly tufted plant like a fern, from the southwestern United States to Peru, that rolls
  into a tight ball when dry and opens and grows again when wet
scope: Also called the resurrection plant and the rose of Jericho; a plant that curls up when dry, not
  the small grey desert plant from Asia that does the same.
examples:
- Selaginella lepidophylla curled into a tight ball in the dry heat.
- After watering, the Selaginella lepidophylla opened and grew again.
