simpleMeaning: A small tree of dry open land in southern Africa, with straight branches set at angles,
  much like a branched candle-holder.
scope: Also called the cactus euphorbia and naboom, this is a small tree of dry open land in southern
  Africa, with straight branches set at angles much like a branched candle-holder; not a true cactus,
  and not a tree of wet or shaded land.
examples:
- Euphorbia ingens stood in the dry open land, its straight branches rising like a branched candle-holder.
- The branches of Euphorbia ingens rise straight at angles.
