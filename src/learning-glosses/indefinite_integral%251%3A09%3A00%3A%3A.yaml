senseId: 'indefinite_integral%1:09:00::'
synsetId: 06025049-n
simpleMeaning: the set of all functions got by adding any fixed real number to one function whose rate
  of change is the given function
scope: In maths, the set of functions got by adding any fixed number to one function, not a single number
  found by adding up over a range, and not the rate of change itself.
examples:
- The indefinite integral of 2x is x squared plus a constant.
- Her teacher asked for the indefinite integral of 3x squared.
