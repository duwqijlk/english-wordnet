simpleMeaning: money paid to a person without work, such as a share of a firm's profits, a fee for a loan,
  or rent for a house
scope: This is money a person gets without working for it, also called unearned income, and not money
  a firm gets before it has done the work.
examples:
- His unearned revenue came mostly from the rent on his shops.
- Interest on her savings is unearned revenue.
