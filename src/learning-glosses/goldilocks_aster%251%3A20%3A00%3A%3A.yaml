simpleMeaning: With flower heads like those of a common yellow-flowered plant, this plant of the south
  and south-east of Europe flowers early and lives for years.
scope: Also called goldilocks, this is the long-lived plant of southern and southeastern Europe with flower
  heads like those of a common yellow-flowered plant.
examples:
- A goldilocks aster flowered early.
- The goldilocks aster had heads of yellow flowers.
