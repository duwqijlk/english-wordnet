simpleMeaning: People once dried this one-year plant of Europe and Africa, now a weed in America, as a
  medicine to clear the bowels, make water pass, or treat syphilis.
scope: Also called boys-and-girls and herbs mercury, this is a one-year plant from Europe and Africa,
  now a weed in America, not a plant still used as medicine.
examples:
- Herb mercury once grew as a weed along the garden wall.
- Old books say herb mercury was dried for use as a purgative.
