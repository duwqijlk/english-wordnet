simpleMeaning: the shape or outline of something, or any other feature of how it fills space
scope: This is the outline and other space features, not the arrangement apart from material and not a
  printed sheet with blanks.
examples:
- The mountain's jagged form stood out against the sky.
- The cloud changed form as the wind pushed it east.
