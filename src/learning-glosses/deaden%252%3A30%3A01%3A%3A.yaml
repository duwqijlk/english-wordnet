simpleMeaning: To make something less strong, less lively or less active, and to make feeling or force
  weaker.
scope: 'Also called blunt: to make something weaker or less lively, not to become weaker yourself, not
  to slow a moving thing, and not to make a picture less clear.'
examples:
- The medicine deadened the pain in his back.
- He put thick cloth over the bell to deaden the sound.
