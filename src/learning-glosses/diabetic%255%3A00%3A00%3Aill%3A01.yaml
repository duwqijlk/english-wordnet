simpleMeaning: having a long-term illness in which the body cannot keep the amount of sugar in the blood
  at a safe level
scope: Having this illness; not about the illness itself or what causes it, and not a person who has the
  illness.
examples:
- He is diabetic and must check the sugar in his blood each day.
- Diabetic patients often need daily care to keep their blood sugar safe.
