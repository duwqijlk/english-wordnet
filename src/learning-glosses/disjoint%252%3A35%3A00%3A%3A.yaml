simpleMeaning: to come apart into separate pieces or parts, so the parts are no longer joined
scope: Also called disjoin; this means to come apart on its own, not to pull something apart or make it
  come apart.
examples:
- If the glue is weak, the two boards will disjoint and come apart.
- The frame started to disjoint after years of heat and dry air.
