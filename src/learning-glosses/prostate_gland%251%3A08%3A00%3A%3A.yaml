simpleMeaning: 'The organ that adds the liquid portion of semen: a firm, chestnut-sized gland in men,
  wrapped partly in muscle, at the top of the urethra.'
scope: Another name for this organ is the prostate; this is the gland itself, not the adjective meaning
  'relating to the prostate'.
examples:
- The prostate gland sits just below the bladder.
- The prostate gland makes the fluid that carries sperm.
