simpleMeaning: someone whose work is to clean and care for fingernails, cutting them neat and making them
  shine
scope: A person who works on fingernails, not a person who works on hair or skin and not a person who
  works on toe nails.
examples:
- The manicurist trimmed and polished her nails.
- He went to a manicurist to have his fingernails cleaned and cut.
