simpleMeaning: a smart ape that lives in forests near the middle of Africa and spends part of its time
  in trees
scope: Also called chimpanzee, this is the smart forest ape of Africa; it is not a monkey and not a gorilla.
examples:
- A chimp climbed into the tree to look for fruit.
- The chimp used a stick to get food from the ground.
