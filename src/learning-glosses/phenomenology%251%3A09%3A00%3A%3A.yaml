simpleMeaning: a way of thinking put forward by Edmund Husserl that studies what people feel and know,
  and sets aside what things are in themselves
scope: A way of thinking put forward by Edmund Husserl that studies what people feel and know; not the
  study of what exists apart from how we know it, and not the study of right and wrong.
examples:
- Phenomenology studies what people feel and know, setting aside what things are in themselves.
- Husserl's phenomenology shaped a whole school of thought.
