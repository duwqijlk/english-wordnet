simpleMeaning: Two babies with the same body plan grow from one egg joined with a male cell, and this
  is one of the two
scope: 'Also called an identical twin or a monozygotic twin: one of a pair of babies from one egg, not
  a pair from two eggs and not babies who merely look alike.'
examples:
- She and her monozygous twin have the same genes.
- A monozygous twin shares one egg with his brother.
