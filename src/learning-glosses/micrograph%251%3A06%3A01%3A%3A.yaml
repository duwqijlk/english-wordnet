simpleMeaning: A picture of a thing as seen through a microscope, made by drawing or by taking a photograph.
scope: A picture of a thing as seen through a microscope, made by drawing or by taking a photograph; not
  a photograph of a thing seen with the bare eye and not a drawing made from memory.
examples:
- The micrograph showed the tiny cells in the drop of blood.
- She put the micrograph of the leaf under the lamp.
