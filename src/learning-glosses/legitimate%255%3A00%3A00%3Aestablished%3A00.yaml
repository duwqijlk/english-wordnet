simpleMeaning: In line with the standards and rules most people accept.
scope: In line with standards and rules people accept, not a lawful marriage or child, not a government
  backed by law, not the act of making a person lawful, and not showing a thing to be fair and right.
examples:
- His methods were legitimate and widely accepted.
- The firm's practices were legitimate by the standards of the trade.
