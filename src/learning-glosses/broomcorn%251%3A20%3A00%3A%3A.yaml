simpleMeaning: Grown for the long flower head with stiff branches, these tall plants with long thin leaves
  are used to make tools for sweeping floors and brushes.
scope: This is a tall plant with long thin leaves, grown for its long flower head with stiff branches,
  used to make tools for sweeping floors and brushes; other tall plants grown for their flower heads are
  its nearest rivals.
examples:
- Broomcorn is grown for its long flower heads with stiff branches.
- The broomcorn stood tall, its flower heads used to make tools for sweeping floors.
