simpleMeaning: a sea animal that sticks to stone, most of all where the sea comes in and goes out
scope: 'Also called an acorn barnacle: a sea animal that sticks to rocks, not a crab and not a mussel.'
examples:
- Rock barnacles covered the stones at low tide.
- We saw a rock barnacle stuck to the pier leg.
