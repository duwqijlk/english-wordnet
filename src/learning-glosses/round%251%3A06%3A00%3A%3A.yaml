senseId: 'round%1:06:00::'
synsetId: 03036796-n
simpleMeaning: Any mechanism that is circular in shape or that rotates.
scope: This is a rare, technical noun for a circular or turning part of a machine or structure; modern
  speakers usually name the part itself, such as a wheel, pulley, or disc. It is not the adjective for
  something shaped like a circle, not the 'round' of a route, a golf game, or a round of drinks, and not
  the 'round' that means a rung or crosspiece. It belongs to older technical writing.
examples:
- The machine punched out metal rounds the size of a coin.
- The windlass turned on a wooden round worn smooth by the rope.
