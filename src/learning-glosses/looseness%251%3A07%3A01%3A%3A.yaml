senseId: 'looseness%1:07:01::'
synsetId: 04812175-n
simpleMeaning: A want of strict rightness, and slackness in how one acts.
scope: A want of strict rightness, and slackness in how one acts; not loose, watery bowels that come often,
  a sign of infection or food poisoning or colitis or a tumour of the gut, nor wild pleasure-seeking,
  nor the state of moving freely, with nothing holding it back.
examples:
- Their looseness of expression caused the mix-up.
- The looseness in their work showed at once.
