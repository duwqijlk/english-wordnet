simpleMeaning: a long loose dress worn by teachers at a university or by judges in court
scope: This is a long loose dress worn by teachers or judges, also called an academic gown and a judge's
  robe; not an ordinary coat and not a student's dress.
examples:
- The professor wore his academic robe for the ceremony.
- The judge entered the court in her academic robe.
