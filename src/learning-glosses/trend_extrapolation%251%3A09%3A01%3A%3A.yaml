simpleMeaning: Figures over time are guessed ahead by number work, such as smoothing that leans on the
  latest figures or moving averages.
scope: One of the ways of looking ahead by number work, it guesses how figures over time will go on.
examples:
- By trend extrapolation, the figures for next year were guessed.
- With trend extrapolation, the pattern of the figures was guessed ahead.
