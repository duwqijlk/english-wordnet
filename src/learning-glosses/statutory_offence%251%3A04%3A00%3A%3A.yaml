simpleMeaning: wrong acts named as crimes by written rules, not by rules made by judges
scope: Wrong acts named as crimes by written rules, not by rules made by judges; statutory offense is
  another name for this sense; not a crime under judge-made rules, and not a wrong that only brings a
  fine in a civil case.
examples:
- The charge was a statutory offence under the new act.
- A statutory offence can only be created by written rules.
