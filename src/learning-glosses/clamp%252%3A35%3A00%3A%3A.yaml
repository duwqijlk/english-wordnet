senseId: 'clamp%2:35:00::'
synsetId: 01346292-v
simpleMeaning: to hold things together in a firm way, or fix them in place, with a tool that presses on
  them
scope: To hold or fix things with a pressing tool, not to force a rule or harm on people, and not the
  tool itself.
examples:
- Clamp the two pieces of wood together until the glue dries.
- He clamped the metal sheet to the table before cutting it.
