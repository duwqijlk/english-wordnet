simpleMeaning: A place where the ground has been opened up to look for ore, jewels, or old remains.
scope: A place where the ground has been opened up to look for ore, jewels, or old remains, not a mine
  in full use, and not a hole dug for building.
examples:
- The digs near the river yielded Roman coins.
- Archaeologists worked at the digs all summer.
