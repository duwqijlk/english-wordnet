simpleMeaning: Letting light and other rays pass straight through, so things can be seen through it
scope: This is letting light and other rays pass straight through, not a photo on a clear base and not
  the quality of being clear in itself.
examples:
- Glass has transparency, so light passes through it.
- The transparency of the water let us see the fish below.
