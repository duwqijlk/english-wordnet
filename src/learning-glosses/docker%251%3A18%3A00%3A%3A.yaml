simpleMeaning: ships in a port get their goods put on board and taken off by this worker
scope: A worker who loads and unloads ships at a port, also called a dock worker, dock-walloper, dockhand,
  dockworker, loader and lumper, and not a sailor or a ship's captain.
examples:
- The docker lifted crate after crate onto the freighter.
- Hundreds of dockers went on strike at the port.
