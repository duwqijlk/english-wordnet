simpleMeaning: In law, money meant as a punishment is paid beyond what a loss was worth when someone acted
  on purpose to do harm
scope: Also called exemplary damages and smart money, it is money a court orders beyond the loss, as a
  punishment for acting on purpose to do harm.
examples:
- The court gave her punitive damages after the firm acted on purpose to harm her.
- Punitive damages were added because the firm had acted on purpose to do harm.
