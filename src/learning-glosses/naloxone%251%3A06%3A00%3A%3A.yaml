senseId: 'naloxone%1:06:00::'
synsetId: 03811921-n
simpleMeaning: A strong drug (trade name Narcan) that blocks the effects of morphine and drugs like it,
  and works best against morphine.
scope: A strong drug that blocks the effects of drugs like morphine, not a drug that gives a high and
  not a painkiller.
examples:
- The nurse gave naloxone to the patient.
- Naloxone blocks the effects of morphine.
