simpleMeaning: to check a scientific experiment by running a parallel one or comparing it with a standard
scope: This is the verb for checking an experiment against a parallel run or a standard, not the noun
  for the standard used in an experiment, not exercising authority over people, not lessening intensity,
  not operating a machine, not limiting access by law, not checking accounts against a duplicate register,
  and not maintaining influence over others for one's own advantage.
examples:
- The researchers controlled for age by matching participants in both groups.
- They controlled the trial by running an identical experiment without the drug.
