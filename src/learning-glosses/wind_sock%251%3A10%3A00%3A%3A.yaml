simpleMeaning: Blowing air swings this cloth tube, its end cut off, round on its tall pole to show which
  way it blows, such as at airports.
scope: This wind sock is also called a sock, a drogue, a windsock, an air-sleeve, an air sock, a wind
  cone, and a wind sleeve.
examples:
- The wind sock at the airfield swung round in the breeze.
- The wind sock told us which way the wind blew.
