simpleMeaning: looking clever or good at first, but not deep and not taking care with the hard parts of
  a subject
scope: 'Also called neat: looking good at first but too simple for a hard subject, not easy to slip on
  and not smooth and shining.'
examples:
- The plan looked slick, but it did not deal with the hard parts of the problem.
- His slick answer sounded clever, yet it missed the real difficulty.
