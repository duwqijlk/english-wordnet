simpleMeaning: A ball-and-socket joint, the upper leg bone's head set in its socket.
scope: This sense is also called a hip, for a ball-and-socket joint, the upper leg bone's head set in
  its socket, where a hip is the joint where the thigh bone's round top sits in a round hollow of the
  pelvis, the large bone below the waist.
examples:
- The coxa joins thigh and hip.
- The coxa is a ball-and-socket joint.
