simpleMeaning: a report that shows an impostor or a cheat for what they are
scope: A report that shows a cheat or impostor for what they are, not the act of making fun of a false
  claim and not the act of letting light reach film.
examples:
- He published an expose of the graft and corruption in city government.
- Her expose showed that the mayor had taken bribes.
