simpleMeaning: a wall built to hold back water or to keep the sea out
scope: Also called dam, and another name for it is dike. This wall holds back water; it is not the rude
  sense used about a woman who is gay and looks like a man.
examples:
- The dyke kept the sea from flooding the fields.
- Workers built a high dyke along the river.
