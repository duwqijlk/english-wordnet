simpleMeaning: Eat far more than you need, greedily and with no restraint.
scope: This is about eating too much, not about filling an object, preserving an animal's skin, or the
  material something is made of.
examples:
- We stuffed ourselves on pizza and cake at the party.
- Stop stuffing your face and leave some for the rest of us.
