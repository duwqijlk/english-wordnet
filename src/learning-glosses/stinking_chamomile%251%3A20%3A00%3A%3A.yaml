simpleMeaning: Many places hold this plant, whose flower heads show white rays round yellow middles and
  whose smell is strong and bad.
scope: Dog fennel, mayweed, and stinking mayweed are other names for this strong-smelling plant found
  in many places.
examples:
- The stinking chamomile grew in many places, its flower heads ringed with white rays.
- The stinking chamomile had white rays round a yellow middle.
