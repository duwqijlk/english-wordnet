simpleMeaning: used especially of a person, not to be trusted in love or care for someone; not loyal
scope: Used especially of a person who is not loyal in love or care, not about a thing that is not real,
  and not about acting in a way that is not loyal.
examples:
- He was a false friend who left her when she needed help.
- She found that her false lover cared for someone else.
