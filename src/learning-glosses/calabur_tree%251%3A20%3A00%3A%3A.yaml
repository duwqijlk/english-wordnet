simpleMeaning: A fast-growing tropical American evergreen with white flowers and edible fruit; its bark
  gives a soft fiber for rope and its timber is valued for barrel staves.
scope: Another name for calabura and silk wood, all names for the same fast-growing tropical American
  tree; this is the tree itself, not its fruit or timber.
examples:
- The calabur tree bears white flowers and fleshy edible fruit.
- A calabur tree grew quickly along the fence line.
