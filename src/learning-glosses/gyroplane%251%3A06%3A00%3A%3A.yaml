synsetId: 02762392-n
simpleMeaning: Flat wings that spin round on their own, with no motor driving them, hold this aircraft
  up in the air, while an ordinary propeller pushes it forward.
scope: Also called autogiro and autogyro, this is an aircraft held up by spinning wings and pushed by
  a propeller, not a helicopter and not an ordinary plane.
examples:
- The gyroplane rose slowly as its spinning wings lifted it off the ground.
- A gyroplane uses a propeller to move forward while its wings spin freely.
