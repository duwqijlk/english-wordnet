simpleMeaning: A sticky substance taken from a certain tree, used to make celluloid (a kind of early plastic)
  and liniment (a liquid rubbed on the skin to ease pain)
scope: This is the sticky substance itself, not the tree it comes from and not the plastic or the skin
  liquid made from it.
examples:
- Camphor is used to make a kind of early plastic.
- The old bottle held liniment made with camphor.
