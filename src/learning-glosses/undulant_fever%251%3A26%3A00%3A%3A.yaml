simpleMeaning: a sickness caught from germs in sick animals or in their meat or milk, marked by a fever
  that rises and falls and a sore head
scope: Not a cold or a flu caught from other people; also called brucellosis.
examples:
- The farmer caught undulant fever from his sick goats.
- Undulant fever left her with a fever that rose and fell for weeks.
