simpleMeaning: The sense a word carries from its role in a sentence, which changes with the word's inflected
  shape.
scope: What a word shows by its job in a sentence, which changes with the shape of the word, not the word's
  own sense and not its sound.
examples:
- The ending gives the word its grammatical meaning in the sentence.
- In this sentence, the grammatical meaning of 'walked' comes from the '-ed' ending.
