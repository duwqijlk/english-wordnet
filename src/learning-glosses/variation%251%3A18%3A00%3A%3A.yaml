simpleMeaning: In biology, a living thing whose traits come from a change in its chromosomes, the parts
  of a cell that carry what parents pass on
scope: 'In biology, also called a sport and another name for a mutation: a living thing whose traits come
  from a change in its chromosomes, not a change in a planet''s path and not a change in music.'
examples:
- The variation grew taller than the other plants in the row.
- This variation has leaves of a different shape from the rest.
