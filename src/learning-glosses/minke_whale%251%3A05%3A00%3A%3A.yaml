simpleMeaning: A small sea animal with a fin on its back, found near the shores of the Atlantic and Pacific.
scope: 'Also called lesser rorqual and piked whale: a small sea animal with a fin on its back, found near
  the shores of the Atlantic and Pacific, not a great blue sea animal and not a dolphin.'
examples:
- A minke whale surfaced close to the boat.
- Minke whales feed in coastal waters.
