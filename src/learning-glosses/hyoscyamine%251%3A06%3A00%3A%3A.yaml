simpleMeaning: a poisonous drug in crystal form, a chemical like atropine but stronger, used to slow down
  too much movement of the gut
scope: A poisonous drug like atropine that slows the gut, not a drug that speeds the gut up and not a
  safe everyday painkiller.
examples:
- The doctor prescribed hyoscyamine to calm her stomach cramps.
- Hyoscyamine can slow the gut, but it is poisonous in large amounts.
