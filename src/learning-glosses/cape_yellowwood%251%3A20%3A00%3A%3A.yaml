simpleMeaning: a tree or bush from South Africa with a round top of branches and leaves
scope: A South African tree or bush with a round top, not a tree from another land and not a plant with
  a flat top.
examples:
- The cape yellowwood in the garden has a round crown of leaves.
- A cape yellowwood grows slowly in the hills of South Africa.
