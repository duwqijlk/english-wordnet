simpleMeaning: a post in a row of posts driven side by side to hold back earth or stop water leaking through
scope: A post in a row of posts driven side by side to hold back earth or stop water leaking through,
  also called a sheath pile and sheet piling; not a single fence post and not a wall.
examples:
- A sheet pile wall keeps the water out of the dig.
- They set sheet piles along the edge of the canal.
