simpleMeaning: the right given by law in a prison for a prisoner and their husband or wife to have sex
  together
scope: This is the right of a prisoner and their husband or wife to have sex together in prison, also
  called conjugal visitation right, and not an ordinary visit from family or friends.
examples:
- The prison allows conjugal visitation for married inmates once a month.
- He asked about conjugal visitation so he could spend private time with his wife.
