simpleMeaning: to pay for a plan that gives you money if the thing or person named in it is harmed, lost,
  or hurt
scope: This is buying such a plan for a thing or a person; it is not the plan itself, and not the sense
  of a thing being kept safe by a plan already bought.
examples:
- She insured her house against fire before she moved in.
- He insured his car before the long trip.
