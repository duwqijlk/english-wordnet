simpleMeaning: A kind of the skin-sore sickness found only in Mexico and Central America and South America,
  with sores only on the skin and the wet lining.
scope: A kind of the skin-sore sickness, also called leishmaniasis americana, mucocutaneous leishmaniasis,
  nasopharyngeal leishmaniasis and American leishmaniasis; its near kin are the other kinds of the skin-sore
  sickness found in warm lands.
examples:
- New World leishmaniasis causes skin sores.
- New World leishmaniasis is found in Mexico.
