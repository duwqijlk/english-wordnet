simpleMeaning: Where a clot forms, this drug sold as Activase breaks it up, and it is used to treat a
  sudden heart attack.
scope: This drug breaks up blood clots where they form and is used when a heart attack strikes.
examples:
- Doctors gave tissue plasminogen activator to break up the clot.
- Tissue plasminogen activator was used to treat her heart attack.
