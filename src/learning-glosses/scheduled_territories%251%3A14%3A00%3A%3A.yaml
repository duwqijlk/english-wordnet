simpleMeaning: the group of countries whose money is tied to the British pound
scope: The group of countries whose money is tied to the British pound; also called the sterling area
  and the sterling bloc. Not countries that use the euro and not one country on its own.
examples:
- The scheduled territories all tied their money to the British pound.
- Trade with the scheduled territories grew after the war.
