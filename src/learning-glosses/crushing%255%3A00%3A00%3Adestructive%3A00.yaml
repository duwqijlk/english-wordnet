simpleMeaning: doing very great harm to the body or to the mind, and often used joined with another word
scope: 'Also called devastating: this sense means harm that is very great for the body or the mind, not
  light pressure or a small loss.'
examples:
- The army suffered a crushing defeat in the battle.
- She felt a crushing sadness after she heard the news.
