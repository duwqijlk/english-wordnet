simpleMeaning: Signals from a motor nerve pass into a muscle through this flat tip, which sits at the
  meeting point of the two.
scope: This is also called endplate and motor end plate, and it is the flat tip where a nerve cell meets
  a muscle.
examples:
- The end-plate sends the signal from the nerve to the muscle.
- Damage to an end-plate can stop a muscle from moving.
