senseId: covariant%5:00:00:variable:00
synsetId: 02514875-s
simpleMeaning: Describes a thing that changes in step with another changing thing so that the links between
  them stay the same
scope: This describes a thing that changes in step with another changing thing so that the links between
  them stay the same; not a thing that stays fixed, and not two things that change with no link between
  them.
examples:
- The two covariant measures rose and fell together.
- In the model, the covariant terms kept their link as the values changed.
