simpleMeaning: a man who works in a restaurant, setting tables, helping the servers, and taking away dirty
  dishes
scope: This is a man who sets tables and clears plates in a restaurant; he is not the server who takes
  orders and not the cook.
examples:
- The busboy cleared the dirty dishes and set the table for the next guests.
- After dinner, the busboy helped the waiters carry plates to the kitchen.
