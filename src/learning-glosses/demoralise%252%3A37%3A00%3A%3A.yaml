simpleMeaning: To bring a person's spirits down, leaving them low.
scope: To bring a person's spirits down, leaving them low; also called depress, dismay, deject, dispirit,
  or demoralize; not to spoil a person in morals, or by too much drink or lust.
examples:
- The news did demoralise the whole team.
- Their defeat would demoralise anyone.
