simpleMeaning: The part in the womb of most mammals, full of blood vessels, that gives the unborn young
  air and food and takes away its waste.
scope: The blood-rich part in the womb that feeds the unborn young and takes away its waste, not the part
  of a flower where seeds form.
examples:
- The placenta gave the baby air and food before birth.
- Doctors checked the placenta after the baby was born.
