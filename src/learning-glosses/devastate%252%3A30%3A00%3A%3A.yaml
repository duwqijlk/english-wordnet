simpleMeaning: to destroy a place or thing very badly, so that it is ruined completely
scope: Also called waste, desolate, and ravage; this is destroying a place or thing completely, not just
  damaging it a little.
examples:
- The fire devastated the whole village.
- Floods devastated the farms along the river.
