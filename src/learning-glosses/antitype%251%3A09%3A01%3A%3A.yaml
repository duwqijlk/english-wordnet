schema: oewn-learning-gloss-v2
senseId: 'antitype%1:09:01::'
synsetId: 05935996-n
simpleMeaning: An earlier sign points forward to this person or thing, above all to a figure or event
  in the New Testament that has its match in the Old Testament.
scope: This name marks the later person or thing that an earlier sign points to, not the earlier sign
  itself.
examples:
- Aaron and Jesus stand as the type and antitype of the high priest who made atonement for the people.
- The figure in the new book is an antitype of the one in the old book.
