simpleMeaning: In maths, the round shape that fits exactly against a bending line at one point, on its
  hollow side, its radius matching how sharply the line bends there
scope: This round shape is also called an osculating circle; it touches a bending line on its hollow side
  and is not the line itself.
examples:
- The teacher drew the circle of curvature to show how sharply the line bent at that point.
- At that point on the graph, the circle of curvature was small because the line bent so much.
