simpleMeaning: a set of actions done over time to help an idea that people believe in or to reach a set
  goal
scope: 'Also called drive, cause, campaign, effort and movement: a set of actions for an idea or goal,
  not the verb for working hard for a cause and not fighting a holy war.'
examples:
- She led a crusade to stop the use of plastic bags in her town.
- Their crusade for clean water brought wells to many small towns.
