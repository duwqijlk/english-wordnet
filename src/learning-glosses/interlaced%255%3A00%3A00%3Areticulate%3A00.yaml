simpleMeaning: having a pattern made of lines or thin pieces that cross over each other
scope: 'Also called fretted and latticed: this describes a pattern of lines or thin pieces crossing over
  each other. It is not a plain, solid surface with no crossing pattern.'
examples:
- The gate had an interlaced pattern of thin iron bars.
- She wore a scarf with an interlaced design of red and gold lines.
