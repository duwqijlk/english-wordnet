simpleMeaning: the fact that a person is not as tall as most people
scope: This is about a person's height being low, not about how long a time or a distance is, and not
  about speaking in a rude, quick way.
examples:
- Her shortness made it hard to reach the top shelf.
- His shortness stood out in the team photo, where everyone else was tall.
