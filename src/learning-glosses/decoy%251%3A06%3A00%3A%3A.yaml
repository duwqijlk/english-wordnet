simpleMeaning: a thing used to draw fish or other animals into danger, so they can be caught or killed
scope: 'Also called bait or a lure: a thing used to draw animals into danger. It is not a person who leads
  someone into danger, and not the act of drawing them in.'
examples:
- The hunters set out a wooden decoy to draw ducks toward them.
- He used a decoy to draw the fish toward the net.
