simpleMeaning: Any of the air-like elements of the helium group in the table of elements that do not react
  with other chemicals
scope: Also called argonon and inert gas; the name covers only the helium-group elements that do not react
  with other chemicals.
examples:
- Helium is a noble gas that does not burn.
- A noble gas will not react with other chemicals.
