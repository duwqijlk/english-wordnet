simpleMeaning: An agreement that, for ten years or more, moves money to a person who pays less tax than
  the one who set it up.
scope: 'Also called grantor trust: an agreement that moves money to a person who pays less tax than the
  one who set it up, not a plain gift of money.'
examples:
- They set up a Clifford trust to move the income to their daughter.
- A Clifford trust must last ten years or more.
