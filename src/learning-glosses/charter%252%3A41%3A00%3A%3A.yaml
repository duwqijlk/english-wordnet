simpleMeaning: to give an official paper to a town, school or other group that lets it start and sets
  its rights and rules
scope: This is giving an official paper that lets a group start; not the paper itself, not a deal to hire
  a boat or plane, and not holding goods under a hire deal.
examples:
- The king chartered the new town in 1200.
- The state chartered a new university last year.
