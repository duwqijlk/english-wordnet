simpleMeaning: Obliged by the terms of a formal agreement.
scope: 'Another name for apprenticed, indentured or articled: held by a formal agreement, not by an oath,
  a chemical joining or ropes.'
examples:
- The young apprentice was bound to the workshop for five years.
- He was bound by contract to finish the building by spring.
