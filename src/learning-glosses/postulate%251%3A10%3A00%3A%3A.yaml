simpleMeaning: In logic, a statement taken as true so that reasoning can start from it.
scope: In logic, a statement taken as true so that reasoning can start from it, also called posit; not
  the act of taking something as given or assuming it.
examples:
- The proof starts from a postulate that everyone in the room accepts as true.
- Without that postulate, the whole line of reasoning falls apart.
