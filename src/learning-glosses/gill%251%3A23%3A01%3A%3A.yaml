simpleMeaning: four fluid ounces of liquid, the amount used as a unit in the United States
scope: A United States measure of liquid, not the mushroom plates, not the British measure, and not a
  fish's breathing organ.
examples:
- The old recipe called for a gill of cream.
- He poured a gill of milk into the jug.
