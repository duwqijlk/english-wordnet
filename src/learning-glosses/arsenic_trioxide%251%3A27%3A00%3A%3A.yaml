simpleMeaning: A white powdered poison trioxide of arsenic, used in making glass and as a pest-killer,
  rat poison, and weed killer.
scope: This sense is also called arsenic, arsenous anhydride, arsenous oxide, ratsbane, and white arsenic.
examples:
- Arsenic trioxide killed rats.
- An arsenic trioxide made glass.
