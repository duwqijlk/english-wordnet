simpleMeaning: the trade of a person who cuts up meat from animals and sells it
scope: This sense is the trade itself, also called butchering; it is not the building where animals are
  cut up for meat.
examples:
- He learned butchery as a young man and later opened his own meat shop.
- Butchery was the family trade for three generations.
