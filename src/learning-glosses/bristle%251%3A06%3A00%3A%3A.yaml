simpleMeaning: a stiff, thick hair or thin thread-like part, made by nature or by people
scope: This is a stiff hair, as on a brush or an animal, not reacting in an angry way and not being thickly
  covered with stiff hairs.
examples:
- This brush has short, stiff bristles that clean well.
- Thick bristles stood up on the pig's back.
