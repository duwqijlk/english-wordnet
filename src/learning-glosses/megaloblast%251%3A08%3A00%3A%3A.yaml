simpleMeaning: a red blood cell much larger than usual, found in people with a lack of vitamin B12 or
  of folic acid
scope: A red blood cell much larger than usual, found in a lack of vitamin B12 or folic acid; not a normal
  red blood cell, and not a white blood cell.
examples:
- The blood test showed megaloblasts, red cells far larger than usual.
- Megaloblasts appear when the body lacks vitamin B12 or folic acid.
