senseId: 'counterrevolutionary%1:18:00::'
synsetId: 09989399-n
simpleMeaning: A person who works against a revolution, trying to undo the changes an earlier revolution
  brought in.
scope: A person who fights to undo a revolution's changes, not the adjective for being against revolution
  and not the sense of relating to a counterrevolution.
examples:
- The counterrevolutionary plotted to bring back the old king.
- Counterrevolutionaries fought to undo the new laws.
