synsetId: 06570425-n
simpleMeaning: a court order sent after a libel or claim is put in, telling all those named to say why
  the ruling asked for should not be given
scope: A court order telling those named in a claim to say why the ruling asked for should not be given;
  also called monition; not a first order to come to court, and not the ruling itself.
examples:
- The process of monition was sent to every party named in the claim.
- After the process of monition arrived, the ship's owners had to give their reasons in court.
