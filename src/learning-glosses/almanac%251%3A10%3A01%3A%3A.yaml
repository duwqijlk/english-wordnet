simpleMeaning: A printed thing brought out every year with weather forecasts and other mixed facts, set
  out by the days of that year.
scope: 'Also called a farmer''s calendar: a yearly book of weather forecasts and mixed facts, not the
  kind that holds tables of facts for one field of study.'
examples:
- Farmers still consult the almanac for planting dates.
- The new almanac lists the tides for every month.
