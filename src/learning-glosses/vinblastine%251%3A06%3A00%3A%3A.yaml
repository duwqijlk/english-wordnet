simpleMeaning: a drug made from a periwinkle plant, sold as Velban, that stops cancer cells from splitting
  in two
scope: A plant drug against cancer, not the sister drug vincristine and not a drug made only in a lab.
examples:
- The nurse gave him vinblastine to stop the cancer cells from dividing.
- Vinblastine comes from the periwinkle plant and is used against cancer.
