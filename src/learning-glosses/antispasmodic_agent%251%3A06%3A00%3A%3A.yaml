simpleMeaning: a medicine that calms or holds back sudden cramps, most often in the soft muscles inside
  the body
scope: 'Another name for antispasmodic: a drug that eases or stops cramps, not a painkiller and not a
  drug that relaxes the whole body.'
examples:
- The nurse gave him an antispasmodic agent to calm the cramps.
- An antispasmodic agent can stop the gut from seizing up after surgery.
