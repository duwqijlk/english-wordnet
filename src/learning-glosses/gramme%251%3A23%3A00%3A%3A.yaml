simpleMeaning: a unit for measuring weight in the metric system, equal to one thousandth of a kilogram
scope: 'Also called gram: a small unit of weight, not a kilogram itself and not a measure of length.'
examples:
- The letter weighs twenty grammes.
- Add five grammes of salt to the water.
