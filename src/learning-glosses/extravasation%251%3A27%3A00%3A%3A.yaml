simpleMeaning: A liquid, blood, lymph, or urine, that has leaked out of its vessel; what is left after
  such a leak.
scope: A liquid, blood, lymph, or urine, that has leaked out of its vessel; not the pouring out of lava
  from a volcano and not the act of leaking itself.
examples:
- Extravasation pooled under the skin after the injury.
- The doctor drained the extravasation from the wound.
