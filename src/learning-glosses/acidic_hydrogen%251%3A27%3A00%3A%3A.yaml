simpleMeaning: A sour liquid holds tiny bits of the lightest stuff, and one such bit takes on a plus charge
  as the liquid breaks apart.
scope: Also called acid hydrogen, this is the name for one tiny bit of the lightest stuff that takes on
  a plus charge in a sour liquid breaking apart.
examples:
- When the sour liquid broke apart, acidic hydrogen took a charge.
- Tests showed acidic hydrogen in the liquid after it split.
