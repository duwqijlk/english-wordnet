simpleMeaning: The material that comes out when a cut is made under something
scope: The material taken away by a cut under something, not the cut itself and not the act of cutting
  away the lower part.
examples:
- The worker cleared away the undercut that fell from under the board.
- A small pile of undercut lay below the cut edge of the wood.
