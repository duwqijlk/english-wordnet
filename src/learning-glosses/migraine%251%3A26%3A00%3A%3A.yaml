simpleMeaning: A bad headache that keeps coming back, to do with the blood vessels in the head, and seen
  more often in women than in men
scope: A bad headache that keeps coming back; not a single headache from tiredness or a cold.
examples:
- A migraine kept her in a dark room all day.
- He gets a migraine whenever he misses sleep.
