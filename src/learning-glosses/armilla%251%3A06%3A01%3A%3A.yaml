simpleMeaning: Metal rings joined into a ball stand for the sky, and early star-watchers used them to
  fix the place of stars.
scope: This ball of metal rings is also called armillary sphere.
examples:
- The armilla helped the star-watchers find the place of a star.
- They turned the armilla to mark where the stars stood.
