simpleMeaning: A tropical Asian shrub with glossy foliage and perfumed blooms that appear after dark,
  their petals crimped or waved; found from northern India to Thailand.
scope: Another name for the night-blooming tropical shrub also called crape jasmine and coffee rose; not
  a true gardenia.
examples:
- The crepe gardenia in the corner opens its blooms only at night.
- She mistook the crepe gardenia for a true gardenia until she saw its twisted petals.
