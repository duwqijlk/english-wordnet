simpleMeaning: a swear word used in informal speech to make another word stronger
scope: Also called damn, blame, blessed, goddamn, blasted and blamed. It is a swear word that makes another
  word stronger, not the noun for people sent to punishment that never ends and not the adjective for
  someone in danger of it.
examples:
- This damned car will not start again.
- Where did I put the damned keys?
