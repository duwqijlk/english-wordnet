simpleMeaning: to put a person or thing in place of another that is broken, lost, not working well, no
  longer working, or not giving what is expected
scope: This is putting a person or thing in place of another that is broken, lost, not working well, no
  longer working, or not giving what is expected; it is not swapping in a thing that only seems the same.
examples:
- We need to replace the broken window this week.
- She replaced the worker who left with a new person.
