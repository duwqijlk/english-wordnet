simpleMeaning: Full of finely wrought, tangled detail.
scope: This sense is also called intricacy, elaboration, and elaborateness, for being full of finely wrought,
  tangled detail, unlike the sense for a shrinking of an organ or part, as in the womb's return to true
  size after birth, unlike the sense for the act of raising a number to a set power, and unlike the sense
  for a long, tangled, hard sentence build.
examples:
- The work was involution, full of tangled detail.
- Involution is finely wrought, tangled detail.
