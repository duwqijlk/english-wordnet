simpleMeaning: A small yellowwood tree of the southern United States with small white flowers that smell
  pleasant, whose leaves and bark yield a yellow dye.
scope: This is a small tree of the southern United States with small white flowers, not a yellowwood grown
  for timber and not a magnolia.
examples:
- The sweetleaf flowered white in the yard.
- Dyers used the sweetleaf bark for yellow dye.
