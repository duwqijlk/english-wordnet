simpleMeaning: A partial or full loss of clear speech caused by harm to the brain and the nerves.
scope: A partial or full loss of clear speech caused by harm to the brain and the nerves, not a loss of
  voice from a sore throat and not a loss of the power to understand words.
examples:
- The stroke left him with anarthria.
- Anarthria made clear speech hard for her.
