simpleMeaning: a thin stiff hair-like part near the end of the feelers of some flies
scope: A small hair-like growth on a fly's feelers, not the feeler itself and not a wing.
examples:
- The arista on the fly's antenna is easy to see under a microscope.
- Under the lens, the arista looked like a tiny bristle near the tip of the antenna.
