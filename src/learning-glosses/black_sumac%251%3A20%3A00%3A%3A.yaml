simpleMeaning: With leaves of many small leaflets and green flowers in loose bunches, this common shrub
  of eastern North America cannot poison people, and red berries follow its flowers.
scope: People also call it dwarf sumac, mountain sumac and shining sumac, and it is a common shrub of
  eastern North America that cannot poison people, with leaves of many small leaflets, green flowers in
  loose bunches and red berries.
examples:
- The black sumac had green flowers and red berries.
- Black sumac grows all over eastern North America.
