simpleMeaning: a soft pad, most often made of rubber or plastic, that can be filled with breath
scope: 'Also called inflatable cushion: a soft pad that can be filled with breath, not a hard seat pad
  and not the device that softens the shock of a moving machine.'
examples:
- She put an air cushion on the hard chair.
- He blew up the air cushion before the long trip.
