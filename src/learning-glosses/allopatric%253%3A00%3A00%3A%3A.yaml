simpleMeaning: Of living kinds, or of new kinds forming, found in places cut off from each other.
scope: Of living kinds, or of new kinds forming, found in places cut off from each other; not kinds living
  side by side and not kinds kept apart by walls.
examples:
- Allopatric birds live on far-apart islands.
- The allopatric frogs split into two kinds.
