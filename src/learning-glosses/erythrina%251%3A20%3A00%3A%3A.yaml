simpleMeaning: Grown for decoration, this bush or tree of the red-flowered group has leaves in three leaflets,
  spikes of scarlet or coral-red bloom, and black seeds.
scope: Another name for the coral tree of the Erythrina genus, not a coral or an unrelated garden shrub.
examples:
- Erythrina is often planted along roads for its brilliant flowers.
- Bees visit erythrina when its red blossoms open.
