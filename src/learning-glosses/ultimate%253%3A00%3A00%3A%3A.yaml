simpleMeaning: the greatest or furthest a thing goes in amount or order, the most it can be
scope: This means the most or the furthest a thing can go, not just a very big thing and not just the
  end of a list.
examples:
- Winning the race was the ultimate goal of her whole season.
- That was the ultimate test of his skill, harder than all the tests before it.
