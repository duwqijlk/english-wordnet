senseId: 'undershirt%1:06:00::'
synsetId: 04230374-n
simpleMeaning: a man's piece of clothing with no collar, worn next to the skin under other clothes on
  the top of the body
scope: This is a piece of clothing for men, worn under other clothes on the top part of the body, with
  no collar; vest is another name for this sense, and it is not an outer shirt or a woman's undergarment.
examples:
- He wore an undershirt beneath his work shirt.
- The undershirt kept him warm under his coat.
