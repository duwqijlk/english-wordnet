simpleMeaning: to move something about with your hands, or to think about an idea and imagine what it
  would be like
scope: Also called play and toy. This means to move a thing about with your hands or to think about an
  idea, not to cheat the person you work for and not to change something in a dishonest way.
examples:
- Don't fiddle with the screws on the back of the radio.
- He fiddled with the idea of moving to a new town.
