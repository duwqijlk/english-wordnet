simpleMeaning: to become bright and free of clouds or easy to see through.
scope: This is not an open area of land; it is about sky or water turning bright and easy to see through.
examples:
- After the storm, the sky cleared and the sun came out.
- The muddy water slowly cleared and we could see the bottom.
