simpleMeaning: a workers' group that covers one firm only and stands on its own, not tied to any wider
  body
scope: A workers' group for one firm only, standing on its own; not a group that covers many firms and
  not a club for workers after hours.
examples:
- The company union spoke for the workers at that one plant.
- She joined the company union when she started at the firm.
