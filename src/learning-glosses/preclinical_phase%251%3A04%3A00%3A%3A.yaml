simpleMeaning: In a lab, a new drug or a new device put inside the body is tried on animals, to gather
  proof that a test on people is worth doing.
scope: It is also called a preclinical test or a preclinical trial, and it comes before any test on people.
examples:
- The preclinical phase of the new drug was done in a lab.
- No people took part in the preclinical phase.
