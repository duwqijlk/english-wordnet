simpleMeaning: As fighters of old Japan did, a person kills oneself in a set rite, cutting open one's
  own belly with a sword.
scope: Hara-kiri, harakiri, and harikari are other names for this set rite of killing oneself by cutting
  open one's own belly with a sword.
examples:
- The rite of seppuku cut open the belly with a sword.
- A fighter of old Japan died by seppuku.
