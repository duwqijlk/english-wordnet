simpleMeaning: The most common kind of a heavy metal, not able to split on its own, but when hit by neutrons
  it makes plutonium 239, which can split
scope: 'The most common kind of uranium, set apart by what it does when hit by neutrons: it makes plutonium
  239, which can split, though it cannot split on its own.'
examples:
- Uranium 238 makes up most of the metal in the ore.
- When neutrons hit uranium 238, it makes plutonium 239.
