senseId: 'cataphoresis%1:22:00::'
synsetId: 13493721-n
simpleMeaning: 'Charged bits in a mix where tiny bits float in liquid move when a current runs through
  it: plus bits go to one end, minus bits to the other.'
scope: This movement is also called dielectrolysis, electrophoresis and ionophoresis, and it is not the
  still mix itself.
examples:
- Cataphoresis moved the charged bits toward the ends.
- Cataphoresis pulled the plus-charged bits to one end and the minus bits to the other.
