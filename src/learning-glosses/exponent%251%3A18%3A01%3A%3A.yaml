simpleMeaning: A person who sets out what a thing means and makes it clear.
scope: A person who explains and makes clear what a thing means, not a small raised number showing how
  many times a quantity is multiplied by itself.
examples:
- She is a leading exponent of the new theory.
- The professor acted as an exponent of ancient law.
