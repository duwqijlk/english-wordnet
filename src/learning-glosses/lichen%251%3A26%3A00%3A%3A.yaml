simpleMeaning: one of several skin illnesses that break out in hard, thick, sore patches that sit close
  together, looking like the flat crusty growths on rocks
scope: A skin illness, not the flat crusty plant growth found on rocks and tree trunks.
examples:
- The doctor said the lichen on his arm was one of several skin illnesses that form hard patches.
- Her lichen broke out in thick, sore patches that looked like the growths on the rocks by the sea.
