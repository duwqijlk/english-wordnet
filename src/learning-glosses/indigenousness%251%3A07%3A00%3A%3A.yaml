senseId: 'indigenousness%1:07:00::'
synsetId: 04807401-n
simpleMeaning: The quality of belonging to a place because it started or grows there on its own, by nature.
scope: Belonging to a place by nature, not brought in from outside and not spread there by people; autochthony
  and endemism are other names for this sense.
examples:
- The indigenousness of the plant showed it had grown there for ages.
- They studied the indigenousness of the island birds.
