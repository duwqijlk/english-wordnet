simpleMeaning: thick stiff paper with wavy ridges that can be stuck to flat paper on one side or on both
  sides
scope: Thick paper with wavy ridges, also called corrugated board; not flat paper and not a box made from
  it.
examples:
- The book was packed in corrugated cardboard to keep it safe.
- She cut a sheet of corrugated cardboard to line the bottom of the box.
