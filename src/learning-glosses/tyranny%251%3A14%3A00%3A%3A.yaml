simpleMeaning: a way of ruling a country where one ruler has complete power and no laws, constitution,
  or opposition can limit them
scope: Rule by one person with complete power, also called authoritarianism; not rule by a group, and
  not control kept by threats and violence alone.
examples:
- The people rose up against the tyranny of the dictator.
- Under his tyranny, no one could speak out.
