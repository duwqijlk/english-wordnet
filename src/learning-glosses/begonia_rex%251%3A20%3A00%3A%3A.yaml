simpleMeaning: Any of many hybrid plants, usually with thick underground stems, from an East Indian plant,
  with rough leaves patterned in silver and bronze and purple and red-brown, and plain flowers.
scope: 'Also called beefsteak geranium, king begonia, painted-leaf begonia, and rex begonia: a hybrid
  plant, not a wild species, and not a geranium.'
examples:
- Begonia rex showed silver and bronze leaves.
- She grew Begonia rex for its patterned leaves.
