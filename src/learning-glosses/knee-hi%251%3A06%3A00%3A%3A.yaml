simpleMeaning: A person wears this sock or stocking so it ends just below the joint in the middle of the
  leg
scope: 'Also called knee-high: a sock or stocking that ends just below the joint in the middle of the
  leg, not a short sock and not a boot.'
examples:
- He wore knee-hi socks under his trousers.
- The knee-hi stockings kept her legs warm.
