simpleMeaning: A problem with so many sides, spreading everywhere and so hard to get rid of, that one
  try cannot end it.
scope: A trouble with many sides that keeps coming back and cannot be beaten in one try, not the small
  water animal of the same name.
examples:
- 'The city''s traffic is a hydra: fix one jam and two more appear.'
- They fought the hydra of poverty for years without beating it.
