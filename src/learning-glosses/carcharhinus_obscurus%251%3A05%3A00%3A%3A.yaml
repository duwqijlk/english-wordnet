simpleMeaning: A fairly slender blue-grey shark, found nearly worldwide in tropical and temperate waters.
scope: Also called dusky shark, this fairly slender blue-grey shark found nearly worldwide in tropical
  and temperate waters is distinct from the shallow-water shark with fins that look dipped in ink, sharks
  of cold northern waters, and sharks found only in one small area.
