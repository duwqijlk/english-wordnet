simpleMeaning: showing very strong feeling, such as love or strong support
scope: 'Also called fiery, fervent, impassioned, fervid, and torrid: showing very strong feeling, not
  cold or calm and not just mild interest.'
examples:
- She is an ardent supporter of the school library.
- He wrote an ardent letter about his love for her.
