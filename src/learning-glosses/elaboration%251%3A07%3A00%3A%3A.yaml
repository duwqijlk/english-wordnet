simpleMeaning: The state of being full of fine, complex detail.
scope: Also called intricacy, elaborateness, or involution, the state of being full of fine, complex detail,
  not the act of developing a thing and not the adding of extra material.
examples:
- The elaboration of the carving was hard to take in at one look.
- They admired the elaboration of the old ceiling.
