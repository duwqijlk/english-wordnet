simpleMeaning: the act of working a bristled tool over your teeth
scope: The action of cleaning your teeth with a brush; brushing is another name for this sense. Not the
  action on hair, and not the tool itself.
examples:
- He gave his teeth a quick brush before bed.
- A good brush twice a day keeps the dentist away.
