synsetId: 00425915-r
simpleMeaning: to an amount that can be seen or known clearly
scope: This says a change can be seen or told clearly, to some amount. It is not about knowing a person
  or thing you have seen before.
examples:
- After losing weight, he was recognizably slimmer than before.
- Her hair was recognizably shorter after the cut.
