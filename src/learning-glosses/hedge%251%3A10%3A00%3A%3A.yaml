simpleMeaning: A remark made on purpose to say nothing clear, so you do not take a side
scope: A remark that stays vague on purpose, not a fence of bushes and not dodging a duty.
examples:
- When you say 'maybe', you are just hedging.
- His answer was a hedge that told us nothing.
