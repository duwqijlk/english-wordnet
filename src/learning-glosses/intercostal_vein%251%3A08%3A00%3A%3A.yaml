simpleMeaning: Blood tubes that drain blood from the gaps between the ribs of the chest.
scope: Blood tubes that drain blood from the gaps between the ribs of the chest, also called vena intercostalis;
  not blood tubes that feed the gaps and not the veins of the arms.
examples:
- The intercostal vein drains blood from between the ribs.
- Blood left the chest through the intercostal vein.
