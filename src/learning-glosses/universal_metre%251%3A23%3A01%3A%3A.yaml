simpleMeaning: Half a cm away from the length used today, this length is fixed by a free pendulum that
  swings once a second, put forward by Tito Livio Burattini in 1675.
scope: This length from a free pendulum is also called catholic meter, catholic metre, metro cattolico,
  and universal meter, and it is not the length used today.
examples:
- Burattini put forward the universal metre in 1675.
- The universal metre came from the swing of a free pendulum.
