simpleMeaning: the top of a horse, where a rider sits
scope: The part of a horse that a rider sits on, not a narrow ridge of hills and not the act of riding
  on a horse's back.
examples:
- She patted the horseback gently before climbing up.
- The saddle sat firmly on the horseback.
