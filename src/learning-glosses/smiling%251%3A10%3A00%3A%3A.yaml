simpleMeaning: the way a face looks when the corners of the mouth turn up, usually to show pleasure or
  amusement.
scope: Another name for the expression called smile, not the cheerful adjective sense or the verb for
  forming it.
examples:
- His constant smiling made everyone around him relax.
- There was a lot of smiling at the party.
