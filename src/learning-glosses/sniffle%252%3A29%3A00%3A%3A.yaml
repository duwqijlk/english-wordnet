simpleMeaning: to breathe in through the nose so the sound can be heard
scope: 'Also called a sniff: to breathe in through the nose so it can be heard, not the act of doing so
  when the nose is blocked and not crying with snuffling.'
examples:
- The sick student was sniffling in the back row.
- He tried not to sniffle during the quiet talk.
