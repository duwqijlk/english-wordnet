simpleMeaning: In chess, a piece that can move any number of empty squares in a straight line, up and
  down or side to side on the board
scope: 'In chess, also called castle: a piece that moves in straight lines across the board, not the large
  black bird that is like a crow.'
examples:
- He moved his rook across the board to take the queen.
- Her rook stood in the corner at the start of the game.
