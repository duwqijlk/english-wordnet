simpleMeaning: Pain cruelly put on a person, allowed by the state and done by officers the state has named.
scope: Pain cruelly put on a person with the state's leave, not pain put on a person by a private person
  and not pain from an accident.
examples:
- Judicial torture was renounced in England in 1640.
- The book tells how judicial torture was used by the state.
