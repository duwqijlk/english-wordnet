simpleMeaning: the act of removing something completely so that it is gone
scope: 'Also called expunging: this sense is the act of removing something so it is gone, not a tool for
  rubbing out marks and not the mark left behind.'
examples:
- The erasure of the old files left no copy behind.
- She asked for the erasure of her name from the list.
