simpleMeaning: the act of getting someone or something back from loss or danger, or of keeping them safe
  from it
scope: 'Also called rescue, saving, and delivery: getting a person or thing back from loss or danger,
  or keeping them safe from it, not letting them be lost or harmed.'
examples:
- The firefighters' quick work brought deliverance to the family trapped in the fire.
- For the lost sailors, the sight of a ship meant deliverance from danger.
