simpleMeaning: To bring things into line with one fixed rule or measure
scope: To make things follow one fixed rule or measure, not to test against a rule and not to set a rule
  for the first time.
examples:
- The weights and measures were standardized across the country.
- The firm standardized its forms to save time.
