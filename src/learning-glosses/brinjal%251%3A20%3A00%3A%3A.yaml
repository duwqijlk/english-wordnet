simpleMeaning: A hairy, upright herb (a soft-stemmed plant) from southeastern Asia, widely grown for its
  large, shiny fruit, which is commonly eaten as a vegetable.
scope: The South Asian name for the plant grown for its large, shiny fruit, which is cooked as a vegetable;
  elsewhere the same plant is called eggplant or aubergine. It is not the tomato, another soft fruit eaten
  as a vegetable.
examples:
- She fried slices of brinjal in oil until they were soft.
- Brinjal is a common crop in the warm, wet parts of southeastern Asia.
