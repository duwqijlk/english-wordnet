simpleMeaning: Any thin skin round an unborn child that guards it, feeds it, helps it breathe, or clears
  its waste
scope: Any thin skin round an unborn child that guards it, feeds it, helps it breathe, or clears its waste;
  not the skin of the child itself and not the cord that joins child and mother.
examples:
- The fetal membrane guards the unborn child.
- The fetal membrane feeds the unborn child and clears its waste.
