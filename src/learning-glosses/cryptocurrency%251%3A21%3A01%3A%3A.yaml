simpleMeaning: a kind of money that uses secret codes to keep each act of buying, selling or moving it
  safe
scope: This is a kind of money kept safe by secret codes. It is not ordinary paper money made by a government,
  and not one single payment.
examples:
- He paid for the computer with cryptocurrency.
- Many people buy cryptocurrency and keep it in an online wallet.
