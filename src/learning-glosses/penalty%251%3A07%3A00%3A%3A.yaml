synsetId: 05172372-n
simpleMeaning: The bad thing that follows an act or a state, a loss or pain you must bear
scope: This is about the bad thing that follows an act or a state, not about a handicap given in a game
  for breaking the rules or the act of punishing itself.
examples:
- He neglected his health and paid the penalty in the end.
- The penalty for leaving early was a smaller share of the pay.
