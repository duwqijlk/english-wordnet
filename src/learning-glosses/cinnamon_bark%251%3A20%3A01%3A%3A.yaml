simpleMeaning: the sweet-smelling outer covering of a tree from Saigon, used as a medicine to settle wind
  in the stomach
scope: The sweet-smelling outer covering of a Saigon tree, used as a medicine; not the powdered spice
  used in cooking and not the bark of another tree.
examples:
- Cinnamon bark was sold in the market as a medicine.
- She drank cinnamon bark in hot water to settle the wind in her stomach.
