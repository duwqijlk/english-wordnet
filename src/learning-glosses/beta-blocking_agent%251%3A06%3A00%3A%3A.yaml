simpleMeaning: One of many drugs for blood pressure running high or heartbeat that skips, easing heartbeats'
  strength and pace by holding back beta-adrenergic receptors in self-working nerves.
scope: Also called beta-adrenergic blocker, beta-adrenergic blocking agent, and beta blocker, one of many
  drugs for blood pressure running high or heartbeat that skips, easing heartbeats' strength and pace
  by holding back beta-adrenergic receptors in self-working nerves.
examples:
- Beta-blocking agents treat high blood pressure.
- Beta-blocking agent eases the heartbeat.
