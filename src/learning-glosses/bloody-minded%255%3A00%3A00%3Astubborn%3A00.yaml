simpleMeaning: refusing to give in and getting in the way of what others want to do, and not willing to
  work with them
scope: 'Also called cantankerous: it means a person who will not give in and gets in the way of others,
  not a person who is eager to use violence, and not a person who is merely slow to agree.'
examples:
- The bloody-minded committee refused to change the plan, even though everyone else agreed on it.
- His bloody-minded refusal to talk kept the work at a standstill for weeks.
