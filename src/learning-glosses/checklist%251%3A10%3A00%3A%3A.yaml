simpleMeaning: a list of names, tasks or other things that you go through and check, or look at for help
scope: This sense is a list you work through and check, not a list of prices and not a story or record
  of the past.
examples:
- She used a checklist to make sure she packed everything.
- The pilot went through his checklist before the flight.
