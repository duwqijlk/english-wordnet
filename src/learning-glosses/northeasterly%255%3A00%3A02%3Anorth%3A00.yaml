simpleMeaning: Blowing from the north-east.
scope: This sense is also called northeast, for blowing from the north-east, where northeast is coming
  from the upper right of a map, unlike the sense for set in, or turned to, the north-east.
examples:
- The wind was northeasterly, blowing from the north-east.
- The breeze was northeasterly, blowing from the north-east.
