simpleMeaning: to go from one place to another with no plan, often in search of food or a job
scope: 'Also called range, roll, cast, drift, wander, swan, stray, roam, and tramp: to move about with
  no fixed goal, often looking for food or work, not a slow walk along a winding road.'
examples:
- The cattle ramble across the prairie in search of grass.
- They rambled from town to town looking for work.
