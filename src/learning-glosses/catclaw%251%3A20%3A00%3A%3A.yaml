simpleMeaning: Curved, pointed pods holding shiny black seeds follow white-to-yellow flower clusters on
  this upright shrub with small or no spines; it grows in Florida and the West Indies.
scope: Another name for the same shrub as black bead and cat's-claw, with curved pods and shiny black
  seeds; not the unrelated black nightshade.
examples:
- Catclaw was blooming with pale yellow clusters along the trail.
- We found catclaw growing among the palms near the coast.
