simpleMeaning: Usually with harm to the nerves at the edge of the body, these odd feelings in the skin
  run to pricking, tickling, itching or burning.
scope: 'It is also called paresthesia: odd skin feelings, usually with harm to the nerves at the edge
  of the body.'
examples:
- Paraesthesia made his skin prickle and burn.
- Her paraesthesia came with harm to the nerves at the edge of the body.
