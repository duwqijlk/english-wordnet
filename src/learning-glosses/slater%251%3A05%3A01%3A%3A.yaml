simpleMeaning: A small land isopod — a tiny shelled creature — with a flat oval body made of rings, found
  in damp places
scope: A small land isopod with a flat oval body made of rings, also called wood louse or woodlouse, found
  in damp places; not a beetle and not a sea creature.
examples:
- A slater curled up under the damp log.
- Slaters hid in the wet leaves behind the shed.
