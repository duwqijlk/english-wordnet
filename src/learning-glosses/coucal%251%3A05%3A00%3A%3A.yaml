simpleMeaning: a cuckoo that lives on the ground in the lands of Europe, Asia and Africa and has a long
  back claw shaped like a knife
scope: A cuckoo that lives on the ground in Europe, Asia and Africa, with a long knife-shaped back claw,
  not a tree-living cuckoo and not a bird with a short claw.
examples:
- The coucal walked through the grass looking for insects.
- We saw a coucal perched low in a bush, its long hind claw plain to see.
