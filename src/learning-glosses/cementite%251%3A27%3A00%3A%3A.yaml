simpleMeaning: a new stuff made when parts join together, found in steel and cast iron, very hard and
  easily broken
scope: 'Also called iron carbide: a hard part of steel and cast iron, not the steel itself and not plain
  iron.'
examples:
- The cementite in the steel made the blade hard.
- Heat changes the cementite in cast iron.
