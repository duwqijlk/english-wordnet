simpleMeaning: the belief that a person is saved by turning to God for themselves and by trusting in him
scope: The belief that a person is saved by turning to God and trusting in him, not by church rites alone
  and not by good works alone.
examples:
- Evangelicalism spread through the town as preachers called people to turn to God.
- Her evangelicalism shaped her life, since she believed faith alone could save her.
