simpleMeaning: the end of a link between people or between countries, when it falls apart
scope: This is the end of a link between people or between countries; not the end of a meeting and not
  a break in a thing.
examples:
- The breakup of their friendship shocked everyone.
- The breakup between the two nations ended years of trade.
