simpleMeaning: of air moving in and out of the lungs in the usual way, sometimes joined with another word
  to make one word
scope: 'Also called breathing and eupnoeic: of air moving in and out of the lungs in the usual way, not
  of air held in the lungs and not of breathing that is fast or hard.'
examples:
- The doctor was glad to see the patient eupneic after the operation.
- The eupneic sleeper took air in and out with no effort.
