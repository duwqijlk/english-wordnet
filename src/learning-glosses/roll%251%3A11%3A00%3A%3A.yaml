senseId: 'roll%1:11:00::'
synsetId: 07403930-n
simpleMeaning: a long, low sound that echoes, like thunder or a big bell
scope: This sense is the long echoing sound itself, as made by thunder or a large bell; it is not the
  act of producing such a sound, and not the fast beat of a drum.
examples:
- We heard the slow roll of thunder over the hills.
- The deep roll of the cathedral bells echoed across the square.
