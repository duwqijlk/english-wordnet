simpleMeaning: in the study of speech sounds, one distinct unit considered on its own without regard to
  whether it functions as a meaningful unit in a language
scope: This is not a telephone, an earpiece that turns signals into sound, or the verb meaning to call
  someone, but a unit of speech sound studied by linguists.
examples:
- Linguists write each phone between square brackets.
- The two phones differ in place of articulation but not in meaning.
