simpleMeaning: A way a germ reaches a person through a thing or a small creature that carries it.
scope: A germ reaching a person through a thing or a carrier, not straight from one person to another;
  not the spread of a disease by touch alone.
examples:
- Indirect transmission can happen when someone touches a dirty towel.
- Indirect transmission spread the illness through shared cups.
