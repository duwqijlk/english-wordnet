simpleMeaning: a small upland tree of the eastern United States, in the Appalachians, whose dark brown
  bark flakes off and whose cones carry scales tipped with thorns, its needles in pairs
scope: Also called a hickory pine and a prickly pine; not a tall lowland pine and not a pine of the far
  west.
examples:
- A table-mountain pine grows on the ridge above the valley.
- The table-mountain pine has bark that flakes off in dark brown pieces.
