simpleMeaning: to change into a salt that holds one part carbon joined to three parts oxygen
scope: This means changing into that kind of salt; it is not the salt itself, and it is not treating something
  with carbon dioxide, a gas in the air.
examples:
- The lime in the soil carbonated slowly over many years.
- As the mineral carbonates, it changes into a new salt.
