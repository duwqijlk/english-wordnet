simpleMeaning: to set up a fight between dogs that is against the law
scope: This is setting up a fight between dogs, not the fight itself, not a fight between planes in the
  air, and not a hard, close contest between two sides.
examples:
- They dogfight in secret, choosing the dogs and the place for each fight.
- Two men were charged after they tried to dogfight in a hidden pit.
