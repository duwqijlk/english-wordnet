senseId: 'juggler%1:18:00::'
synsetId: 10246083-n
simpleMeaning: a person who performs by throwing and catching several objects in the air, and doing other
  skilled tricks with the hands
scope: A performer known for keeping objects moving in the air and for hand tricks, not a magician who
  makes things seem to appear or vanish.
examples:
- The juggler kept five balls in the air at once.
- A juggler at the fair tossed clubs high and caught each one.
