simpleMeaning: A bright-colored bird of North America that makes its nest in hollow trees
scope: A bright-colored North American bird that nests in hollow trees, also called summer duck and wood
  widgeon; not a tame farm bird and not a sea bird that nests on cliffs.
examples:
- A wood duck flew out of the hollow tree at the edge of the pond.
- We saw a wood duck with bright feathers near the lake.
