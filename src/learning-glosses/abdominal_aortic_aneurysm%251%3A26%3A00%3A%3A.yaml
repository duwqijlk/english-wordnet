simpleMeaning: a weak, swollen part in the main blood tube in the belly, linked with old age and high
  blood pressure
scope: A weak swollen part of the main blood tube in the belly, linked with old age and high blood pressure;
  not a swelling elsewhere in the body and not a healthy blood tube.
examples:
- The scan showed an abdominal aortic aneurysm that needed close watching.
- Doctors found his abdominal aortic aneurysm during a check for high blood pressure.
