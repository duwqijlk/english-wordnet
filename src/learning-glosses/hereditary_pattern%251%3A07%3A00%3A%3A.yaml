simpleMeaning: In genetics, the traits a person gets from parents through birth.
scope: In genetics, traits got from parents through birth; inheritance is another name for this sense,
  and this is not a trait picked up from life or from learning.
examples:
- Eye colour is a hereditary pattern passed down from parents.
- The hereditary pattern for red hair came from both parents.
