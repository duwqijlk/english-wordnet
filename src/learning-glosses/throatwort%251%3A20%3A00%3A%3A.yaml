simpleMeaning: Once used as a cure for pain when swallowing, this European bellflower bears blue-purple
  to lilac flowers.
scope: Also called nettle-leaved bellflower, this is a European bellflower with blue-purple to lilac flowers,
  once used as a cure for pain when swallowing.
examples:
- The throatwort bloomed, its blue-purple flowers open.
- In the old days, throatwort eased pain when swallowing.
