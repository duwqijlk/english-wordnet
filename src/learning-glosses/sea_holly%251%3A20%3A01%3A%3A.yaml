synsetId: 12958953-n
simpleMeaning: A European plant that keeps its leaves all year grows wild on the United States east coast,
  with twisted leaves that prick; its roots were once used to stir desire.
scope: Also called sea eryngium and sea holm, this is a spiny-leaved plant of the east coast, not the
  southern European plant with whitish purple-veined flowers.
examples:
- Sea holly grows wild along the east coast, its twisted leaves full of sharp points.
- Long ago, people used sea holly roots to stir desire.
