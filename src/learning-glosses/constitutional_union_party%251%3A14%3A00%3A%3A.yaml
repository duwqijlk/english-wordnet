simpleMeaning: In 1859, men who had left the Whigs formed a political group to keep the United States
  together; the group no longer exists
scope: A political group formed in 1859 that hoped to keep the United States together, not a party that
  still exists and not the army that fought for the country.
examples:
- The Constitutional Union Party was formed in 1859 by former Whigs.
- Members of the Constitutional Union Party hoped to keep the country together.
