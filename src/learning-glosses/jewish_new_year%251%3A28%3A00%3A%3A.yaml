scope: Also called Rosh Hashana, Rosh Hashanah, Rosh Hashona, or Rosh Hashonah; a solemn feast day in
  Judaism on the 1st, or the 1st and 2nd, of Tishri, known for the blowing of the shofar.
examples:
- The Jewish New Year began at sunset with the blowing of the shofar.
- For the Jewish New Year, families gathered for a solemn feast day.
