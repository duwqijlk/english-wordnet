simpleMeaning: any one of a group of trees or bushes that keep their leaves all year, from Australia and
  the north of New Caledonia
scope: One of several evergreen trees or bushes of Australia and northern New Caledonia, not the wood
  of such a tree and not a cypress tree.
examples:
- A cypress pine stood at the edge of the garden.
- Cypress pines grow across much of Australia.
