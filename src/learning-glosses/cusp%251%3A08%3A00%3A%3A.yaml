simpleMeaning: a small raised point on the surface of a tooth that is used to grind food
scope: A small raised point on a tooth, not a point made where two curved lines meet and not a thin flap
  on a heart valve.
examples:
- The dentist pointed to a small cusp on my back tooth.
- This tooth has a sharp cusp that helps break up hard food.
