simpleMeaning: the habit of keeping free from dirt and small marks on the outside
scope: This is the habit of staying free from dirt and small marks on the surface, not the careful effort
  a person puts into keeping things clean.
examples:
- Her cleanliness showed in her spotless clothes and tidy hair.
- He valued cleanliness and washed his hands often.
