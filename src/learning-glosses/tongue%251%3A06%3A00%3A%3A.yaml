simpleMeaning: The piece of material that lies under the laces of a shoe or boot.
scope: The material flap beneath a shoe's laces, not the organ in the mouth or the metal piece that strikes
  inside a bell.
examples:
- He pulled the tongue of his boot to get it on.
- The tongue of my sneaker was soaked after the walk in the rain.
