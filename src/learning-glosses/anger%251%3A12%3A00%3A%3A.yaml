simpleMeaning: a powerful feeling stirred when someone believes they have been treated unfairly
scope: This is the strong feeling itself, also called ire or choler; not the deadly-sin sense of wrath,
  and not the state of being angry.
examples:
- He could not hide his anger when the decision was made without him.
- Her anger faded once she understood why they had acted that way.
