simpleMeaning: money put into something that is very risky but could bring in a lot of money if it goes
  well
scope: 'Also called speculation: money put into something very risky that may bring a lot of money. Not
  a bold action or project with an unknown result, and not a business project set up to make money even
  though it may lose money.'
examples:
- He knew the shares were a risky venture when he bought them, but they could make him a lot of money.
- He put his savings into a venture that could fail or bring a big profit.
