senseId: 'chigger%1:05:01::'
synsetId: 01783712-n
simpleMeaning: A young mite that sucks the blood of animals with backbones, people among them, and leaves
  a fierce itch.
scope: Also called a jigger, a redbug, and a harvest mite; the young mite that sucks blood, not the small
  tropical flea of the other sense.
examples:
- The chigger bit her ankle and it itched for days.
- Chiggers left red marks all over his legs.
