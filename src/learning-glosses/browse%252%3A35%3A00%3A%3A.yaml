simpleMeaning: to drift from thing to thing, giving each only a passing look and not hunting for anything
  in particular
scope: To look over things with no set aim, also called surf, not animals feeding by small bites, and
  not plants that animals eat.
examples:
- She browsed the shelves with no idea what she wanted.
- We browsed through the market with no plan.
