simpleMeaning: Baked in an oven, this food starts as a dough of flour or meal, usually raised with yeast
  or baking powder
scope: Bread and staff of life are other names for this baked food, not for the flour or meal used to
  bake it.
examples:
- She baked breadstuff from a dough of flour and yeast.
- They sliced the breadstuff and ate it.
