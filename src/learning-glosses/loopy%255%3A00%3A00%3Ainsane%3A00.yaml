senseId: loopy%5:00:00:insane:00
synsetId: 02082059-s
simpleMeaning: In informal or slang talk, a word for a person whose mind does not work in the normal way
scope: 'Also called cracked, nuts, buggy, bats, crackers, daft, nutty, dotty, fruity, balmy, batty, wacky,
  bonkers, haywire, loony, barmy, loco and kooky: this is a loose word for a mind not working in the normal
  way, not a word about circles or bends.'
examples:
- After three nights with no sleep, he felt loopy and talked nonsense.
- The old man got a bit loopy and started singing to the cat.
