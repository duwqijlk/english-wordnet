senseId: 'beatify%2:37:03::'
synsetId: 01816291-v
simpleMeaning: To fill one with high, lifted feeling.
scope: This sense is also called thrill, exhilarate, exalt, and inebriate, for filling one with high,
  lifted feeling, where thrill is to fill a person with strong, high feeling, and exhilarate is to make
  a person feel high joy, full of life and energy, unlike the sense for calling a dead one blessed, the
  first step to sainthood.
examples:
- The music beatified her with high feeling.
- The sunset beatified the watchers.
