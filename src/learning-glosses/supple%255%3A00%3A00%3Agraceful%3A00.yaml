simpleMeaning: Slim, graceful, and able to bend and move with no effort.
scope: Thin, graceful and moving with ease; lithe is another name for this sense, and it is not a body
  that bends freely nor a mind that adapts easily.
examples:
- The dancer's supple body moved with grace.
- She admired his supple grace on the stage.
