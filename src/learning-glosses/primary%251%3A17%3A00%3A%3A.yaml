simpleMeaning: in astronomy, a body in space, usually a star, that other objects travel around
scope: This is the body that others orbit, not a preliminary election, not one of a bird's flight feathers,
  and not a coil in an electrical circuit.
examples:
- In that binary system, the primary is the brighter of the two stars.
- The smaller body orbits the primary once every eighty years.
