simpleMeaning: A thing that grows in wet places, in round groups that feel like jelly
scope: A thing found in wet places in round, jelly-like groups; not a plant with leaves and not a single
  round stone.
examples:
- Nostoc grew on the damp rock after the rain.
- The nostoc in the pond formed round jelly-like lumps.
