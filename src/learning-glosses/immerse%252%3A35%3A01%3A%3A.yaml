simpleMeaning: To close around a thing on every side, as if taking it in whole
scope: 'Also called swallow and bury: closing around a thing on every side, not putting a thing deep into
  something and not the act of causing it.'
examples:
- Fog immersed the whole valley by morning.
- Darkness immersed the house as the lamps went out.
