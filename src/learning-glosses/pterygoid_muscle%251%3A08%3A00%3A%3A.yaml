simpleMeaning: A band of flesh that runs down from a bone at the base of the skull to the lower jaw
scope: A jaw muscle that runs down from a bone at the base of the skull, not the bony part it starts from
  and not a muscle that moves the tongue.
examples:
- The pterygoid muscle helps move the lower jaw.
- Pain in the pterygoid muscle made it hard for her to chew.
