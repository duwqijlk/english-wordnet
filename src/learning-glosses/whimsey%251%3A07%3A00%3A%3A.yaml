simpleMeaning: the habit of doing things no one can guess, led more by a sudden fancy than by clear thought
scope: 'Also called whimsy, capriciousness, flightiness, arbitrariness and whimsicality: the habit of
  acting no one can guess, led by sudden fancy rather than clear thought, not careful planning and not
  a fixed habit.'
examples:
- His whimsey made him change his plans from one day to the next.
- The whimsey of her choices surprised even her friends.
