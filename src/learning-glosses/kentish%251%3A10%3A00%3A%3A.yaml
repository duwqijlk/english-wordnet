simpleMeaning: A southern way of speaking Old English, used in the Anglo-Saxon kingdom of Kent.
scope: A southern dialect of Old English, also called Jutish; its near kin are other Old English dialects,
  and the Middle English Kentish of the same name is a later sense.
examples:
- Kentish was spoken in the kingdom of Kent.
- The Kentish dialect is a southern form of Old English.
