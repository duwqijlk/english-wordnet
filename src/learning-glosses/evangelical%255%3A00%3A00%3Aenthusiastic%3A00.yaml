simpleMeaning: showing very strong and eager interest in a cause
scope: Very strong and eager interest in a cause, for any cause and not only religion; not about the gospel
  teaching and not about a Christian church and its beliefs.
examples:
- She is evangelical about clean water and tells everyone how to save it.
- His evangelical support for the new school won over many parents.
