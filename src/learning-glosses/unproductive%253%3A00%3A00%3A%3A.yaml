simpleMeaning: not making anything, and not able to make anything
scope: About making nothing or not being able to make anything; the opposite of making things well and
  in good amounts.
examples:
- The factory closed its unproductive lines and moved its workers to other jobs.
- The dry land was unproductive, and nothing would grow there.
