simpleMeaning: In women, the bulb of the vestibule is fed by a side tube off the deep blood tube that
  runs to the private parts
scope: This side tube in women is also called the artery of the vestibule bulb, not the matching tube
  found in men.
examples:
- In women, the arteria bulbi vestibuli carries blood to the bulb of the vestibule.
- The arteria bulbi vestibuli branches off the deep blood tube that runs to the private parts.
