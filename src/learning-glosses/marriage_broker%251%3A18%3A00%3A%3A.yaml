simpleMeaning: For someone else, a husband or a wife is found by this person, or the person tries to find
  one
scope: Also called matcher and matchmaker, this is a person who finds a husband or a wife for someone
  else, not a wedding planner and not one of the couple.
examples:
- The marriage broker introduced the two families last spring.
- Her grandmother had used a marriage broker to find her husband.
