simpleMeaning: The government group advising the President on military questions, made up of the heads
  of the United States Army, Navy and Air Force and the head of the Marine Corps.
scope: The government group advising the President on military questions, made up of the heads of the
  United States Army, Navy and Air Force and the head of the Marine Corps; also called Joint Chiefs, not
  a single service head or a group that runs wars.
examples:
- The Joint Chiefs of Staff met the President to talk about the war.
- The Joint Chiefs of Staff advised against the plan.
