simpleMeaning: A salt-like compound of two parts (CaH2) used to take oxygen away from things and as a
  source of the lightest gas
scope: This is a salt-like compound of two parts used to take oxygen away from things and as a source
  of the lightest gas; calcium hydride is another name for this sense, not a salt used in food and not
  a gas on its own.
examples:
- Hydrolith gave off gas when water was added.
- The lab used hydrolith as a source of gas.
