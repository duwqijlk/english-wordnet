simpleMeaning: Not dirty, with no dirt or unwanted marks on it; also used for a person who keeps things
  neat.
scope: This is about physical dirt or personal tidiness, not about playing fairly or obeying rules.
examples:
- Put the plates in the dishwasher so they are clean for dinner.
- She keeps her desk clean and never leaves old cups on it.
