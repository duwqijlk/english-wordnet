simpleMeaning: the kindness that comes from being gentle with people and accepting what they do, instead
  of treating them in a hard way
scope: 'Also called mildness: the kind quality that comes from being gentle and accepting with others,
  not the act of making a punishment lighter, and not giving in to what someone wants.'
examples:
- Her leniency toward her students came from real kindness.
- People praised the king for his leniency toward those who had failed him.
