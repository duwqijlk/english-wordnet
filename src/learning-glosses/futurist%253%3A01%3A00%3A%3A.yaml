simpleMeaning: connected with a movement in art and writing that loved speed, machines, and new ways of
  living
scope: This describes art or writing of that movement; futuristic is another name for this sense. It is
  not a person who says what will happen in the future, and not a person who believes holy writings say
  the end of the world is still to come.
examples:
- The museum showed futurist paintings full of speed and machines.
- She wrote a futurist poem about fast trains and new cities.
