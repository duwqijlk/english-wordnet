simpleMeaning: a kitchen tool made with a coil of wires, used for beating eggs or cream
scope: A kitchen tool for beating eggs or cream; not the small broom used to brush clothes, and not the
  action of beating or brushing something off.
examples:
- She used a whisk to beat the eggs and cream.
- He picked up the whisk and beat the cream until it was thick.
