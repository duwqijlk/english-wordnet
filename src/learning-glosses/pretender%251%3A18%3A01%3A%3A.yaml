senseId: 'pretender%1:18:01::'
synsetId: 10215212-n
simpleMeaning: A person who claims to hold beliefs and opinions that he or she does not hold. This is
  done to hide his or her real feelings and real reasons.
scope: Also called phony, hypocrite, dissembler, phoney, and dissimulator, this is a person who hides
  real feelings by claiming beliefs he or she does not hold; it is not a person who claims a throne, and
  not a person who makes false claims in general to trick people.
examples:
- She called him a pretender because he praised ideas he did not really believe in.
- The pretender smiled and agreed, while hiding what he truly felt.
