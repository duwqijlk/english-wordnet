simpleMeaning: A brown fruit shaped like an egg, with a fuzzy skin and green flesh that tastes a little
  sharp.
scope: Also called a kiwi or a kiwi fruit; it is the fruit, not the climbing vine that bears it.
examples:
- I peeled a Chinese gooseberry and ate the green flesh inside.
- The Chinese gooseberry on the stall was brown and fuzzy outside, green inside.
