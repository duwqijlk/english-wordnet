senseId: 'maneuver%2:33:00::'
synsetId: 01112274-v
simpleMeaning: to move soldiers or ships in war in a planned way, so you can get a better place to attack
  or to keep safe
scope: This verb, also called operate, is about moving soldiers or ships in war; it is not a noun move
  to avoid an opponent, and not a skilled movement in general.
examples:
- The army maneuvered into the hills before dawn.
- The general maneuvered his ships to block the enemy port.
