simpleMeaning: 'Dampness is taken away when this stuff is used: calcium oxide, for one, soaks up water
  to help things dry out.'
scope: This stuff helps things dry out, and is also called a drier, a desiccant, or a drying agent.
examples:
- The siccative soaked up the water and helped the surface dry.
- They added a siccative to take the dampness away.
