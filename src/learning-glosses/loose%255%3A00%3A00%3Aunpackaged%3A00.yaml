simpleMeaning: Not neatly packed together, but kept as separate items.
scope: This describes items left separate rather than packed neatly as a unit, not something unfastened
  or not fixed in place and not a texture full of small gaps.
examples:
- He bought a box of loose nails at the hardware store.
- The sweets were sold loose, scooped straight from the tin.
