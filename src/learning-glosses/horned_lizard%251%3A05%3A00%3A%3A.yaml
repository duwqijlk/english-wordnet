simpleMeaning: In the west of North America lives a lizard that feeds on insects, its head carrying sharp
  points and its body covered in prickly scales.
scope: Also called a horned toad and a horny frog, this lizard of the west of North America is known by
  the sharp points on its head and the prickly scales over its body.
examples:
- The horned lizard sat still, its sharp points easy to see.
- A horned lizard snaps up ants that crawl too close.
