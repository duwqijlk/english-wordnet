simpleMeaning: a part that senses light and other rays and gives a reading of how strong they are
scope: 'Also called magic eye, photocell, photoconductive cell and photoelectric cell: a part that senses
  light and other rays and gives a reading of how strong they are, not a camera that takes pictures and
  not the human eye.'
examples:
- The electric eye measured the light coming through the window.
- An electric eye on the machine stops it when the beam is broken.
