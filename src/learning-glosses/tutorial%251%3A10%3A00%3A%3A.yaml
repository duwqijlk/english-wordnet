senseId: 'tutorial%1:10:00::'
synsetId: 07162730-n
simpleMeaning: a lesson time when a teacher gives much help and teaching to one student or to a small
  number of students
scope: This sense names a teaching time for one student or a few students; it is not the describing word
  for things to do with such teaching.
examples:
- She has a weekly tutorial with her maths teacher.
- Only three students came to the morning tutorial.
