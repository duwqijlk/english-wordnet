simpleMeaning: the act of soothing someone in distress and easing their pain
scope: 'Another name for consolation or solace: soothing a person in distress, not the calm feeling of
  ease, the material ease money brings, or the verb for strengthening someone emotionally.'
examples:
- Her quiet presence was a comfort to the grieving family.
- He offered comfort to his friend after the sudden loss.
