simpleMeaning: to plug a wound or body opening with a soft plug made of cotton or other material that
  soaks up blood or other liquid
scope: This is the action of putting in a soft plug that soaks up liquid, not the plug itself, which is
  the noun sense of the same word.
examples:
- The nurse tamponed the wound to stop the bleeding.
- He tamponed the deep cut with a small cotton plug.
