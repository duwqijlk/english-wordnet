simpleMeaning: A South American plant with green to purple or red stems and green to purple showy leaves,
  and spikes of small woolly flowers with dry, thin bracts.
scope: 'Also called beef plant, beefsteak plant, and Iresine herbstii: a showy South American plant grown
  for its coloured leaves, not a plant grown for its flowers.'
examples:
- Iresine reticulata brightens the garden bed with its purple-red stems.
- We planted Iresine reticulata for its showy leaves, not for its tiny flowers.
