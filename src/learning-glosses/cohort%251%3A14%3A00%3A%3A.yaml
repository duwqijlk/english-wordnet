simpleMeaning: a group of fighters who fight together, first used for one part of an army of Rome in the
  past
scope: A group of fighters who fight together as one part of an army, not a group of students or workers
  and not one single fighter.
examples:
- A cohort of Roman soldiers marched into the town.
- The cohort stood ready to fight at the edge of the field.
