simpleMeaning: a drink made by soaking and boiling and letting it turn into alcohol, not by heating it
  to make it stronger
scope: 'Also called brew: a drink made by soaking and boiling and letting it turn into alcohol, not a
  drink made strong by heating and not a soft drink.'
examples:
- They drank the home-made brewage with their meal.
- This brewage is made by soaking grain and letting it turn into alcohol.
