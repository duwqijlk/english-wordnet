senseId: 'starkly%4:02:02::'
synsetId: 00467685-r
simpleMeaning: in a way that is plain and clear and not softened in any way
scope: This means in a plain, clear way with nothing added; it is not the sense about a sharp outline
  or a strong difference between things.
examples:
- The report starkly showed how little money was left.
- She spoke starkly about the danger, with no soft words.
