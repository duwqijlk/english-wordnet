simpleMeaning: One of two bag-like chest parts in people and animals with backbones. They take carbon
  dioxide (a waste gas) from the blood and give it oxygen (a needed gas)
scope: A part inside the chest that works when you breathe. It is not the heart, which moves blood around
  the body.
examples:
- His left lung was hurt in the accident.
- The doctor listened to her lungs with care.
