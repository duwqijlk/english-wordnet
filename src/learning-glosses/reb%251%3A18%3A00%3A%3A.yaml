simpleMeaning: A nickname for a Confederate soldier in the American Civil War; ‘Johnny’ was the name Federal
  troops gave such soldiers, and ‘greyback’ came from their grey uniforms.
scope: A nickname for a Confederate soldier in the American Civil War; also called greyback, Rebel, Johnny
  and Johnny Reb.
examples:
- The Reb fought bravely at Gettysburg.
- Federal soldiers called the enemy Rebs.
