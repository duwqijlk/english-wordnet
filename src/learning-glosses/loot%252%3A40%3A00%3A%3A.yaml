simpleMeaning: to steal things from a place and take them as the goods won by force
scope: 'Also called strip, rifle, or plunder: to steal things and take them as the goods won by force,
  not the stolen goods themselves.'
examples:
- During the earthquake people looted the stores that were deserted by their owners.
- Soldiers looted the houses and carried off everything of value.
