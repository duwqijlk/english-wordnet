simpleMeaning: a money worry for a country when it spends more on what it buys from other countries than
  it takes in from what it sells to them
scope: A money worry for a country when it spends more on what it buys from abroad than it takes in from
  what it sells abroad, not a plain gap in trade and not a shortfall in a state's yearly budget.
examples:
- The balance-of-payments problem grew worse when oil imports rose.
- Ministers met to discuss the balance-of-payments problem and how to cut it.
