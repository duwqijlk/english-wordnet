synsetId: 01579924-v
simpleMeaning: To drop a thing into liquid and take it out again at once, just long enough for it to come
  out wet, coated, or soaked through.
scope: Also called plunge, dip, dunk, and douse; to immerse briefly into a liquid so as to wet, coat,
  or saturate, not the pork dish and not a person who drinks too much, and not pouring liquid over a thing.
examples:
- Souse the garment in the cleaning solution before you scrub it.
- She soused the brush in the paint and began to work.
