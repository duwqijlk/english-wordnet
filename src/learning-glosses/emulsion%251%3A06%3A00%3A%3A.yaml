simpleMeaning: A coating on paper or film that reacts to light, made of tiny grains of silver bromide
  held in jelly.
scope: Also called a photographic emulsion, this is the light-reacting coating on paper or film, not the
  chemistry sense of two liquids mixed together.
examples:
- The emulsion on the film caught the light of the scene.
- They spread a fresh emulsion over the paper in the darkroom.
