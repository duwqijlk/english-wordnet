simpleMeaning: Set order, the deed of setting a thing by a set rule or reason.
scope: This sense is also called rationalization, for set order, the deed of setting a thing by a set
  rule or reason, unlike the sense for, in maths, the making simple of a sum or equation, by taking out
  roots without changing its worth, or the roots of the equation.
examples:
- Rationalisation is set order.
- Rationalisation sets a thing by a set rule.
