simpleMeaning: one of a pair of moving parts on the head of an insect or of an animal such as a crab,
  typically able to sense touch and taste
scope: 'Also called an antenna: this is the moving part on the head of an insect or a crab-like animal.
  It is not a test suggestion to see how people react, and not the thin part on a fish''s jaw.'
examples:
- The ant waved its feelers as it searched for food.
- A crab's feelers can sense touch and taste in the water.
