simpleMeaning: Made by setting the tongue's front on the mouth roof for 'y', or its edge there for the
  ch sound of chin or the j sound of gin.
scope: This sense is also called palatal and palatalised, for a sound made by setting the tongue's front
  on the mouth roof for 'y', or its edge there for the ch sound of chin or the j sound of gin.
examples:
- The sound was palatalized, made with the tongue tip.
- The 'y' was palatalized, made at the hard roof.
