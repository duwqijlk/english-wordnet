simpleMeaning: Talking in a sharp, angry way when people hold very different views and disagree strongly
scope: 'Also called tilt and argument: angry talk between people who disagree strongly, not a calm, planned
  debate and not a simple difference of views.'
examples:
- They were arguing loudly in the next room.
- The arguing went on all evening and nobody gave way.
