simpleMeaning: A thing someone does, or fails to do, that lets another person down
scope: An act or failure that lets someone down, not the sad feeling of being let down.
examples:
- Missing the meeting was a disappointment to the whole team.
- His broken promise was a bitter disappointment to his friends.
