simpleMeaning: An extra part of cat food, or a kind of cat food, that stops balls of swallowed fur from
  forming in the cat's stomach.
scope: An extra part of cat food, or a kind of cat food, that stops balls of swallowed fur from forming
  in the cat's stomach; not a foam used to style the strands on a person's head and not an uncomfortable
  top made of coarse animal fur.
examples:
- The vet put the cat on hairball formula to stop the balls of fur.
- Hairball formula in her food kept the balls of fur from forming in her stomach.
