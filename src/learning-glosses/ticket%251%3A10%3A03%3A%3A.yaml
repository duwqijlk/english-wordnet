simpleMeaning: Paper, cardboard, or plastic fixed to a thing, with words written or printed on it to show
  who owns it, what it is, its price, and such things
scope: A label fixed to a thing, with words that show its owner, what it is, or its price. Not a paper
  that lets you travel or enter a place, not an order to pay for breaking traffic rules, and not a list
  of people put forward for an election.
examples:
- The price ticket on the coat says twenty pounds.
- Each box has a ticket that shows who owns it.
