simpleMeaning: a round rolling part under the front of a plane, one of the parts that let it land and
  roll on the ground
scope: A round rolling part under the front of a plane, part of its landing gear; not a wing and not the
  main wheels under the wings.
examples:
- The nosewheel touched down first as the plane landed.
- A flat tyre on the nosewheel delayed the flight.
