senseId: 'pitched%3:44:00::'
synsetId: 03163882-a
simpleMeaning: of a sound, set at a certain high or low level, or set in a key (a group of notes in music),
  usually as part of a longer word
scope: This is about how high or low a sound is, usually as part of a longer word; it is not about a sloping
  roof or a thrown ball.
examples:
- She has a high-pitched voice that is easy to hear from far away.
- The low-pitched sound came from the big drum.
