simpleMeaning: a machine that turns in time with the current and changes current that keeps switching
  direction into current that flows one way, or back again
scope: 'Also called rotary converter and synchronous converter: this is a machine that changes one kind
  of electric current into the other. It is not a road place where cars go round a centre, and not the
  word for turning or moving in a circle.'
examples:
- The old power station used a rotary to change the current for the trains.
- When the rotary broke down, the machines that needed one-way current stopped.
