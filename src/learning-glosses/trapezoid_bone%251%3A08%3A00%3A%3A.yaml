simpleMeaning: A part of the wrist that sits between two other wrist parts, the trapezium and the capitate
scope: A part of the wrist between the trapezium and the capitate; trapezoid and os trapezoideum are other
  names for this sense. Not the trapezium itself and not the capitate.
examples:
- The trapezoid bone sits between the trapezium and the capitate in the wrist.
- A fall broke her trapezoid bone and hurt her wrist.
