simpleMeaning: A thin, four-sided muscle where the chest and lower back meet; it pulls against the diaphragm's
  tug on the ribs it attaches to.
scope: The lower of the two serratus posterior muscles, not the upper one or the serratus anterior on
  the side of the chest.
examples:
- The serratus posterior inferior helps steady the lower ribs during a deep breath.
- The serratus posterior inferior acts against the diaphragm's pull on the ribs.
