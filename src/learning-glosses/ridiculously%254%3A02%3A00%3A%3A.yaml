simpleMeaning: in a way that makes people laugh, or that is so silly it deserves laughter
scope: In a way that makes people laugh, or that is so silly it deserves laughter; not in a serious way
  and not in a way that is only a little odd.
examples:
- Her income was ridiculously small, but she managed to live well.
- He was ridiculously proud of his old car.
