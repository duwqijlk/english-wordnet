simpleMeaning: A tall, upright, very poisonous plant of Europe and Asia that lives for many years and
  grows in large numbers in wet, marshy ground
scope: Among poisonous plants of wet ground in Europe and Asia, this tall, upright one lives for many
  years and grows in large numbers in marshes; water hemlock is another name for it.
examples:
- Cicuta virosa grows in the marsh by the lake.
- Do not touch Cicuta virosa, as it is highly poisonous.
