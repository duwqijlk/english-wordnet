simpleMeaning: On a post in the middle of a seed box of joined parts, seeds start in a flower, with no
  walls inside or walls only at the foot.
scope: This is the name for seeds that start on a post in the middle of a flower's seed box, where no
  walls stand inside or walls stand only at the foot.
examples:
- The flower showed free central placentation, with seeds on a post in the middle.
- In free central placentation the seeds grow on a post in the middle.
