simpleMeaning: Used to make skin and flesh draw tight, this is the dried sap of the dhak tree
scope: The dried sap of the dhak tree, also called butea gum and butea kino, not the fresh sap of the
  tree and not a sweet for chewing.
examples:
- The healer rubbed gum butea on the cut to draw the skin tight.
- The shop sold gum butea in small hard lumps.
