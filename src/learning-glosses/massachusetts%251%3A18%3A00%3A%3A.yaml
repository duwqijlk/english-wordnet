simpleMeaning: Around that bay, in the past, a people of the Algonquian group lived, and this word names
  one of them.
scope: Also called Massachuset, this is a person of the Algonquian people who once lived around that bay,
  not a tongue of that people.
examples:
- A Massachusetts man fished in the bay long ago.
- Massachusetts people once lived around that bay.
