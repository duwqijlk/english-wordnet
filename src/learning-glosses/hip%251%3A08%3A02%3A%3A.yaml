simpleMeaning: The joint where the round top of the thigh bone fits into a round space in the pelvis (the
  large bone below the waist)
scope: This is the joint in the body, not the wider bone structure that supports the legs and not the
  outer corner where two sloping sides of a roof meet.
examples:
- He hurt his hip when he fell, and the joint hurt when he walked.
- The doctor said the ball in her hip joint had moved out of place.
