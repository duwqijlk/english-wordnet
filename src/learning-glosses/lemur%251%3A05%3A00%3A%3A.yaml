simpleMeaning: an animal like a monkey that lives in trees, with large eyes, a face like a fox, and a
  long tail covered in thick hair
scope: This is a tree-living animal with a fox-like face and a long, thick-haired tail; it is not a monkey
  and not a fox.
examples:
- A lemur sat high in a tree, looking out with its large eyes.
- We watched a lemur move through the branches, its long tail covered in thick hair.
