senseId: 'literalise%2:31:00::'
synsetId: 00625484-v
simpleMeaning: to take words in their plain, exact sense, not as a picture
scope: To read words by what they plainly say, also called literalize, and not to read them as a picture
  or a joke.
examples:
- Do not literalise the saying; it is a picture, not a fact.
- He literalised the old saying and missed its point.
