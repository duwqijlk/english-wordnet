simpleMeaning: with waves and small cuts, and curled in a very uneven way
scope: This means wavy and cut with small notches, curled in a very uneven way, not smooth and not curled
  in neat, even waves.
examples:
- The crispate leaf was wavy and curled in a very uneven way.
- The crispate petal had small cuts and curled in an irregular way.
