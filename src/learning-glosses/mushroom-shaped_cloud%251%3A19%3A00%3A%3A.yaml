simpleMeaning: After a blast, a huge ball of broken stone and dust climbs skyward, its top spreading wide
  like a fungus cap, especially after a nuclear bomb.
scope: It is also called mushroom and mushroom cloud, and it is the dust ball thrown up by a blast rather
  than a cloud that forms in the sky on its own.
examples:
- The mushroom-shaped cloud rose into the sky after the explosion.
- The mushroom-shaped cloud spread wide at the top as it climbed.
