senseId: 'knell%1:11:00::'
synsetId: 07400794-n
simpleMeaning: a slow bell sound that tells people a person has died, or a funeral is taking place, or
  something has ended
scope: The sound made by a slow bell at a death, a funeral, or the end of something. Not the act of ringing
  a bell.
examples:
- The knell from the church tower told the village someone had died.
- They heard the slow knell at the funeral.
