senseId: 'double-blind_study%1:04:00::'
synsetId: 00179026-n
simpleMeaning: a test in which the key facts are kept from everyone in it, both the people taking part
  and the people running it
scope: 'Also called double-blind experiment and double-blind procedure: a test in which the key facts
  are kept from everyone in it, not a test in which only one side is kept in the dark.'
examples:
- The double-blind study kept the key facts from both patients and researchers.
- In their double-blind study, neither the volunteers nor the staff knew who got the real pill.
