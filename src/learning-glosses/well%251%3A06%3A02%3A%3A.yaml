simpleMeaning: An open vertical space that runs through the floors of a building, such as the space a
  staircase passes through.
scope: This is not the water source dug in the ground, and not the adverb senses about skill or calm acceptance;
  it is the open vertical space inside a building.
examples:
- The staircase is built around an open well.
- Light from the roof reaches the ground floor through the well.
