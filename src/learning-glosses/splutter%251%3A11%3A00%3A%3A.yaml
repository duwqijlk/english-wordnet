simpleMeaning: the broken noise of something bursting out in small drops or bits
scope: The broken noise of something bursting out in drops, also called sputter, splatter and spatter,
  not the verb of making such a noise.
examples:
- We heard the splutter of the old engine as it tried to start.
- He heard the splutter of gunfire in the distance.
