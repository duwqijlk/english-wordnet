scope: This is a banker who works with investments and plans ways to make a company that others want to
  buy look less worth buying, not a stinging insect and not a banker who helps a takeover go ahead.
examples:
- The killer bee planned how to make the company less worth buying.
- As a killer bee, she devised ways to block the takeover.
