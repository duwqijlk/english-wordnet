senseId: 'sophism%1:09:00::'
synsetId: 05903745-n
simpleMeaning: A clever-sounding case made on purpose to mislead, built with smart but false steps of
  thought.
scope: Also called sophistication or sophistry, it is a case built to mislead, not an honest line of thought.
examples:
- The sophism sounded clever, but the steps of thought did not hold.
- A reader saw through the sophism and would not be misled.
