simpleMeaning: a board or large dish made of wood, used for serving food or for cutting it up
scope: A wooden board or dish for serving food, not a person who digs long, narrow holes in the ground.
examples:
- He put the meat on a wooden trencher and cut it there.
- They ate bread and cheese from a trencher.
