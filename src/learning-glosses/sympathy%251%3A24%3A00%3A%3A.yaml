schema: oewn-learning-gloss-v2
senseId: 'sympathy%1:24:00::'
synsetId: 13834112-n
simpleMeaning: a close link between people who think and feel in like ways; what affects one also affects
  the other in the same way
scope: A close link between people who think and feel alike, not sharing another person's pain or sorrow.
examples:
- The two old friends were in close sympathy and often knew what the other was thinking.
- She worked in sympathy with the team and shared all their aims.
