simpleMeaning: thin and wrinkled, the way skin and flesh grow smaller and dry out with age or illness
scope: Thin and wrinkled, the way skin and flesh grow smaller and dry out with age or illness, not merely
  thin or old; shriveled, shrunken, withered and wizened are other names for this sense.
examples:
- The wizen old man had thin arms and deep lines on his face.
- Her wizen hands were thin and lined after years of illness.
