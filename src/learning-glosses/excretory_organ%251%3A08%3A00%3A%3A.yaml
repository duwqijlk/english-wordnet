simpleMeaning: a part of the body that takes waste out of the blood and sends it out of the body
scope: A part of the body that clears waste from the blood, not a part that takes in food and not one
  that pumps blood.
examples:
- The kidney is the main excretory organ in the body.
- When an excretory organ fails, waste builds up in the blood.
