simpleMeaning: A nest of curled green plant parts, tied with fine spun thread, is the work of this moth's
  young.
scope: Also called leaf-roller, this moth's young make a nest by curling green plant parts and tying them
  with fine spun thread.
examples:
- We found a leaf roller's nest tied with fine thread.
- The leaf roller tied the leaves together to make its nest.
