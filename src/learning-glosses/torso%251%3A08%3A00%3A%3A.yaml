simpleMeaning: the main part of a person or animal, without the head, neck, arms and legs
scope: 'Also called body and trunk: this is the main middle part only, not the head, neck, arms, or legs.'
examples:
- The statue's torso was cracked, but its head was still whole.
- He twisted his torso to look behind him.
