simpleMeaning: A tall herb of eastern North America and Asia, with blue berry-like fruit and a thick knotty
  rootstock once used as a medicine.
scope: This sense is also called blueberry root, papoose root, papooseroot, squaw root, and squawroot.
examples:
- Blue cohosh has blue fruit.
- Blue cohosh was once used as a medicine.
