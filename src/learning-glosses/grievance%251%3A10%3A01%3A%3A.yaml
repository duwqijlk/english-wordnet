senseId: 'grievance%1:10:01::'
synsetId: 07251126-n
simpleMeaning: A claim made when a person is put under a duty the law does not allow, loses a right the
  law gives, or is treated unfairly.
scope: A claim of an unlawful duty or a denied right, not a complaint about a wrong that causes anger.
examples:
- The workers filed a grievance about the new rules.
- Her grievance was that the law denied her a fair trial.
