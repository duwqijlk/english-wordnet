simpleMeaning: Fruit shaped like the fruit it is named for, with a thick hard outer skin, grows on this
  tree.
scope: This tree, also called woody pear, bears fruit shaped like the fruit it is named for, with a thick
  hard outer skin.
examples:
- The native pear bore fruit with a thick hard outer skin.
- We picked the fruit of the native pear and found its skin thick and hard.
