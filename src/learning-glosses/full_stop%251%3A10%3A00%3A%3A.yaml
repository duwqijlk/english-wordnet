senseId: 'full_stop%1:10:00::'
synsetId: 06856570-n
simpleMeaning: A dot (.) that marks the end of a plain statement or comes after a shortened word
scope: This is the dot at the end of a statement or after a shortened word, not a comma or a question
  mark; point, stop, period and full point are other names for this sense.
examples:
- Put a full stop at the end of each sentence.
- In England they call a period a full stop.
