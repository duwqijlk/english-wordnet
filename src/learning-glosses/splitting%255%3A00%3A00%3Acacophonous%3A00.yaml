simpleMeaning: Like the sound of a thing being torn apart with force, or of lightning tearing a tree open.
scope: Like the sound of a thing torn apart with force, also called ripping.
examples:
- The sound was splitting, like cloth torn apart.
- The noise from the storm was splitting, like a tree torn open by lightning.
