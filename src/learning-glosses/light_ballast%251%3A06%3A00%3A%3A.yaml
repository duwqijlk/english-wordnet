simpleMeaning: An electrical device that starts and controls glowing tube lamps and other lamps that shine
  when power runs through a gas inside them
scope: Ballast is another name for this electrical device that starts and controls lamps; it is not the
  lamp itself and not a switch that only turns the lamp on.
examples:
- The light ballast in the ceiling fitting needs replacing.
- A faulty light ballast can make the lamp flicker.
