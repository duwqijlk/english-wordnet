simpleMeaning: The number that comes from adding twenty-eight and one.
scope: Also called 29 and twenty-nine; the number after twenty-eight, not twenty-eight and not thirty.
examples:
- XXIX in Roman numerals means twenty-nine.
- There were XXIX chairs in the hall.
