simpleMeaning: a sore, swollen state of a blood vessel or a tube that carries lymph
scope: Swelling inside a blood or lymph tube, not a growth of vessels and not the study of vessels.
examples:
- The doctor said the angiitis in her arm had made the vein red and sore.
- Angiitis can make a lymph duct swell and ache.
