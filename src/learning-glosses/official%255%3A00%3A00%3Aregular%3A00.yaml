senseId: official%5:00:00:regular:00
synsetId: 01966728-s
simpleMeaning: carried out in the accepted way, according to established customs, standard procedures,
  or required orderly conduct
scope: Not meaning approved by a government or holding a post; it describes the correct, rule-bound way
  something is done.
examples:
- The committee handled the complaint through the official procedure, exactly as the manual requires.
- The lab ran every test in the official way, timing and recording each step.
