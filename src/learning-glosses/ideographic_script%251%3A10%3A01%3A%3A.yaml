senseId: 'ideographic_script%1:10:01::'
synsetId: 92470494-n
simpleMeaning: One mark can stand for a thought or thing, not for one set word, in this way of writing
scope: A way of writing in which each mark stands for a thought or thing, not a way of writing in which
  marks stand for sounds.
examples:
- Hieroglyphs were once wrongly thought to be a purely ideographic script.
- In an ideographic script, one mark can stand for the thought of 'sun' without naming the word for it.
