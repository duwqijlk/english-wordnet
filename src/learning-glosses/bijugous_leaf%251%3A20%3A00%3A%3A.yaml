simpleMeaning: a green part of a plant shaped like a feather, with two pairs of small parts on a middle
  stem
scope: 'Also called a bijugate leaf: a green part of a plant shaped like a feather, with two pairs of
  small parts on a middle stem, not one with a single pair and not a plain part with no side parts.'
examples:
- The bijugous leaf showed two pairs of leaflets on its central stem.
- She pressed a bijugous leaf between the pages to keep its two pairs of leaflets.
