simpleMeaning: In accounting, a thing is written down by the same amount in each year of its working life,
  until its whole cost has been counted.
scope: Straight-line method is another name for this accounting rule, which writes a thing down by the
  same amount in each year of its working life.
examples:
- The straight-line method of depreciation gave the same charge for the van in every year.
- They chose the straight-line method of depreciation for the new press.
