simpleMeaning: A fern that forms mats on rock or ground, with creeping roots and large divided fronds,
  found across North America, Europe, Africa and east Asia.
scope: Another name for the mat-forming fern also called common polypody and adder's fern, not the tropical
  golden polypody.
examples:
- Golden maidenhair forms a low mat of fronds on the cliff face.
- She planted golden maidenhair in the rock garden, where it spreads by creeping roots.
