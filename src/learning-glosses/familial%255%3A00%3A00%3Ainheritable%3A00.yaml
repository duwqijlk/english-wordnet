senseId: familial%5:00:00:inheritable:00
synsetId: 01317491-s
simpleMeaning: happening among people who are related by birth, usually because it passes from parents
  to children
scope: Also called hereditary. This means seen among members of one family, usually passing from parents
  to children; it is not just about a family in general.
examples:
- This familial illness usually passes from a parent to a child.
- Doctors found a familial trait shared by the brothers and their mother.
