simpleMeaning: In Christian theology, the study of how to show that wrong beliefs are wrong
scope: The study of answering wrong beliefs in Christian thought, not the defence of the faith and not
  the study of church teaching in general.
examples:
- His book on polemics sets out the errors of rival churches.
- The course in polemics taught students to answer false teaching.
