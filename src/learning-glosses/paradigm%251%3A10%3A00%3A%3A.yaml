simpleMeaning: In grammar, the group of all things that can go in the same place in a sentence
scope: In grammar, things that can take the same place in a sentence; not the set of forms of one word.
examples:
- In the paradigm, 'cat' and 'dog' can both fill the same slot.
- The teacher gave a paradigm of words that can each fill the same slot in a sentence.
