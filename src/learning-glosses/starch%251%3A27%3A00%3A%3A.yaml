simpleMeaning: A sugar-based nutrient found in seeds, fruits, tubers, roots and stem cores, especially
  corn, potatoes, wheat and rice; a staple food, used in glues and for stiffening paper and cloth.
scope: The nutrient in foods such as potatoes and rice, not the laundry product sold to stiffen shirts
  and not the verb meaning to treat cloth with it.
examples:
- Potatoes and rice are his main sources of starch.
- Corn starch is used in glue and to give paper a smooth finish.
