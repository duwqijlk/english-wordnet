simpleMeaning: Words that look the same at the end but sound different when said aloud, like love and
  move
scope: Words that look alike at the end but do not sound alike, not a true rhyme where the ends sound
  the same and not words that only look alike in the middle.
examples:
- The poem's eye rhyme of love and move looks right on the page but sounds wrong aloud.
- She pointed out the eye rhyme in the song's last two lines.
