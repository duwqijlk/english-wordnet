simpleMeaning: Where the chord a step below the home chord comes before the home chord, often at the end
  of a church song, is a close of notes in music
scope: Also called plagal cadence, this close of notes comes where the chord a step below the home chord
  comes before the home chord, often at the end of a church song.
examples:
- The choir sang the amen cadence at the end of the hymn.
- She played the amen cadence.
