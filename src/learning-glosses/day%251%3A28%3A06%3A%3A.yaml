simpleMeaning: The time Earth takes to turn once relative to a distant star, about four minutes shorter
  than a full turn measured by the sun.
scope: This is not the ordinary period measured by the sun and not the rotation time of another planet;
  it is Earth's turn relative to a fixed star.
examples:
- A sidereal day is about 23 hours and 56 minutes long.
- Astronomers track a star for one sidereal day to measure Earth's rotation.
