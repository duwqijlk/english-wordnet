simpleMeaning: Cut off from the ways of the people around you, with no clear place in the group
scope: This is about being cut off from the life around you, not about having lost your bearings and not
  knowing where or when you are.
examples:
- In the new city he felt disoriented and alone among strangers.
- She grew disoriented in a crowd that shared none of her ways.
