simpleMeaning: A virus that brings on AIDS, the sickness that weakens the body's defences; it copies itself
  inside helper T cells and kills them.
scope: This is the virus itself, also called human immunodeficiency virus, not the infection it brings
  on nor the sickness AIDS.
examples:
- Doctors test blood for HIV to find the virus early.
- HIV attacks the cells that fight sickness.
