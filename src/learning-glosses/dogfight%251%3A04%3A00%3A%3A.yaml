simpleMeaning: a hard, rough fight between dogs, sometimes set up against the law for people to watch
  and bet money on
scope: This is a real fight between dogs, sometimes set up for people to watch and bet on. It is not a
  fight between planes in the air, and not a hard fight between people or groups over something.
examples:
- The police stopped an illegal dogfight in an empty building.
- Two dogs were hurt in the dogfight before men pulled them apart.
