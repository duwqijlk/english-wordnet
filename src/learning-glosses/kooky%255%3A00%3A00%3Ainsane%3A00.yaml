simpleMeaning: In joking everyday talk, odd in the way one thinks and acts.
scope: 'Also called cracked, nuts, buggy, bats, crackers, daft, nutty, dotty, loopy, fruity, balmy, batty,
  wacky, bonkers, haywire, loony, barmy, and loco: a word in joking everyday talk for someone odd in the
  way they think and act.'
examples:
- Her new neighbour is kooky, always talking to the birds in her garden.
- The plan sounded kooky at first, but it worked.
