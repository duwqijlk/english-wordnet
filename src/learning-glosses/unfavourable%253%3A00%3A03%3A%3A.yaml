simpleMeaning: Bringing about or making things that work against success or getting things done.
scope: Bringing about or making things that work against success or getting things done; also called unfavorable;
  not about wind or weather that gets in the way, and not about failing to cheer, approve, or please.
examples:
- The delay was unfavourable to the plan.
- The new rules proved unfavourable for the team.
