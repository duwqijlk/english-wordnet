simpleMeaning: the ill state of the body that comes when very small living things that cause disease enter
  it
scope: This is the ill state that follows when disease-causing tiny living things enter the body; it is
  not the entering itself, and not a bad effect on a person's morals.
examples:
- His infection left him weak and hot with fever for days.
- The doctor gave her medicine to treat the infection in her lung.
