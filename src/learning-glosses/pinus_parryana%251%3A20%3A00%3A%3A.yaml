simpleMeaning: A five-needled pinon of southern California and northern Baja California, sometimes with
  three or four needles where it has crossed with the California pine
scope: Also called Parry's pinyon and Pinus quadrifolia, it is a five-needled pinon of southern California
  and northern Baja California, sometimes with three or four needles where it has crossed with the California
  pine, while other five-needled pinons of California and other pinons of Baja California are different
  kinds.
examples:
- We found a Pinus parryana with five needles on the dry hills of Baja California.
- The Pinus parryana sometimes shows only three needles where it has crossed with other pines.
