simpleMeaning: The whole group of people who follow the faith based on the Torah and the Talmud.
scope: The whole group of people who follow the faith based on the Torah and the Talmud, also called Hebraism
  and Judaism, and not a single person and not the faith itself as a set of beliefs.
examples:
- The Jewish religion gathers its people in synagogues.
- The Jewish religion rests on the Torah and the Talmud.
