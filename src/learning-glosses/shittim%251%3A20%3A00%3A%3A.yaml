simpleMeaning: White flowers and small black fruit with a stone inside grow on this low, bushy, thorny
  tree of the southeastern United States, which loses its leaves each year.
scope: Mock orange, shittimwood, and southern buckthorn are other names for this low, bushy tree of the
  southeastern United States with white flowers and small black fruit.
examples:
- A shittim with white flowers stood low and bushy.
- The shittim loses its leaves each year and bears small black fruit.
