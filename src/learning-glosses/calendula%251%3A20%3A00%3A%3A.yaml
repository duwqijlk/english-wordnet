simpleMeaning: People widely grow this group of mostly one-season plants for their yellow or orange flowers,
  and often use them in cooking and medicine.
scope: The whole group of daisy-like plants with yellow or orange flowers; not the similar marigolds of
  the genus Tagetes.
examples:
- Calendula flowers brighten the garden from early summer.
- She scattered calendula petals over the salad.
