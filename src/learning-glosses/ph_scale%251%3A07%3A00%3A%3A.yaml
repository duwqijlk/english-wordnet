senseId: 'ph_scale%1:07:00::'
synsetId: 05046261-n
simpleMeaning: 'A 0-to-14 measure of a liquid''s acidity or alkalinity, from the log of the reciprocal
  of its hydrogen-ion level: 7 is neutral, higher is more basic, lower is more acid.'
scope: Also called pH; a measure of how acid or basic a liquid is, not a measure of heat and not a measure
  of salt.
examples:
- On the pH scale, pure water reads 7.
- The pH scale showed the liquid was more acid than neutral.
