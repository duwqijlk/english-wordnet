simpleMeaning: With a screw thread inside, this small piece turns by hand when thumb and first finger
  grip the two flat parts that stick out at its sides.
scope: Also called butterfly nut, thumbnut, wing-nut, and wing screw, it belongs with the fasteners that
  turn by hand, and it is not the tree of the same name.
examples:
- The wing nut held the cover in place once he had turned it tight by hand.
- After turning the wing nut, the lid came off easily.
