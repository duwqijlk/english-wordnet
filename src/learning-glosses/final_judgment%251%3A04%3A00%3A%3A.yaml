schema: oewn-learning-gloss-v2
senseId: 'final_judgment%1:04:00::'
synsetId: 01191491-n
simpleMeaning: A court ruling that ends a case, so after it or any appeal from it, only carrying it out
  is left
scope: This is a court ruling that ends a case; final decision is another name for this sense, not a ruling
  that leaves more of the case to be heard.
examples:
- The final judgment ended years of legal dispute.
- After the final judgment, the court ordered payment.
