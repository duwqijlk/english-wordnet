simpleMeaning: A procedure in which the baby is turned around inside the womb by hand, usually to help
  delivery.
scope: This is a hands-on medical procedure, not a particular edition or form of something, and not a
  translation.
examples:
- The obstetrician suggested a version to turn the baby before labor began.
- The version was done at thirty-seven weeks, and the baby stayed head-down.
