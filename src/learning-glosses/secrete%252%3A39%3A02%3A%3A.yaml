simpleMeaning: to put something where no one can see it, and to keep it hidden there
scope: Hiding a thing where no one can see it; not the body sense, where a part of the body makes a liquid
  and lets it out.
examples:
- He secreted the money under a loose board in the floor.
- She secreted the letters in a box at the back of the cupboard.
