simpleMeaning: A material that carries electric current mostly by the movement of gaps where an electron
  is missing.
scope: A material that carries current mostly by moving gaps; not a material that carries current by moving
  electrons and not a wire.
examples:
- The p-type semiconductor carries current by holes.
- A p-type semiconductor sits on one side of the junction.
