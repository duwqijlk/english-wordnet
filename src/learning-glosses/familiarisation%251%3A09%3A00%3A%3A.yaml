senseId: 'familiarisation%1:09:00::'
synsetId: 05766379-n
simpleMeaning: The process of getting to know something.
scope: It is the process by which a person comes to know something, and familiarization is another name
  for this sense, while knowing a thing at first sight and teaching a thing to someone else are different
  things.
examples:
- The familiarisation with the new town took a few weeks.
- Her familiarisation with the rules came slowly.
