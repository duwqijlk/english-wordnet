simpleMeaning: in genetics, a feature of structure or function that is set by one gene or a group of genes.
scope: This is a gene-determined trait, not an imaginary person in a story, not a defining property of
  something's individual nature, not the moral qualities of a person, not an actor's role, not an odd
  person, not good reputation, not a letter of recommendation, not a printed symbol, and not the verb
  meaning to engrave.
examples:
- Eye colour is a character controlled by several genes.
- In this species, leaf shape is a character inherited from the parent plant.
