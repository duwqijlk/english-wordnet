simpleMeaning: having many large feathers, or covered with large feathers
scope: This means having many feathers or being covered with them; it is not having just one showy feather
  or bunch of feathers as a decoration, as on a knight's helmet or as a tuft on a bird's head.
examples:
- The white-plumed egrets stood in the shallow water.
- The plumed bird spread its long feathers in the sun.
