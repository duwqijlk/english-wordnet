simpleMeaning: gas from the gut pushed out through the back passage by an automatic action of the body
scope: 'Also called wind, a fart, farting, and breaking wind: gas pushed out through the back passage
  by the body itself, not gas swallowed and burped up and not a stomach ache.'
examples:
- He felt flatus building up after the meal.
- The doctor asked whether flatus had passed since the operation.
