simpleMeaning: 'A medium reddish purple: stronger and a little lighter than heliotrope, bluer than that
  shade, and bluer but less bright than eupatorium purple.'
scope: This colour shade, another name for bishop's purple, not the violet flower itself or a bishop's
  garment.
examples:
- The bruise faded from black to a mottled bishop's violet.
- Her scarf was bishop's violet, with a faint reddish sheen.
