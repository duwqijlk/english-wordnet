simpleMeaning: A bond put out by a firm, with no claim to a share and no pay-outs, yet its holders are
  paid before share-holders.
scope: 'For company borrowing: a bond with no claim to ownership and no dividends, whose holders are paid
  before stockholders.'
examples:
- The firm sold a corporate bond to raise cash.
- A corporate bond pays its holders first.
