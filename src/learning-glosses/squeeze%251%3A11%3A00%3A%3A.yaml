simpleMeaning: the act of twisting something and pressing it firmly
scope: A twist given with pressure, not a firm grip on something and not a hug; wring is another name
  for this sense.
examples:
- She gave the wet cloth a hard squeeze over the sink.
- He gave the mop a squeeze before putting it away.
