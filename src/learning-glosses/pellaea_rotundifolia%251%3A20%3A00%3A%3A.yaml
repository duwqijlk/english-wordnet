simpleMeaning: A fern of New Zealand and Australia, with trailing fronds and dark green leaflets shaped
  like small round buttons.
scope: Also called button fern; a fern of New Zealand and Australia, set apart from upright ferns by its
  trailing fronds and its button-shaped leaflets.
examples:
- Pellaea rotundifolia trailed down from the shelf in the fernery.
- The Pellaea rotundifolia had dark green leaflets like tiny buttons.
