simpleMeaning: a way of saying how deep water is, where one unit is the same as 6 feet
scope: 'Also called a fathom: a unit for water depth, not a unit for the size of a room and not the mining
  unit for the amount of ore.'
examples:
- The depth was two fthm on the chart.
- He marked the spot as three fthm deep.
