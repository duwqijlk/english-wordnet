simpleMeaning: a feeling or belief that something will happen
scope: This is the general feeling that something will happen, not the sense worked out from what is usual
  or normal.
examples:
- There was an air of expectancy in the room as they waited for the result.
- She waited with quiet expectancy for his answer.
