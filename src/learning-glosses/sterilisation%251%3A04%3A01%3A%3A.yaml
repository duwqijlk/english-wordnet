simpleMeaning: the way of making a thing free of live germs, usually with heat or with chemicals
scope: Making a thing free of live germs, not making a living thing unable to have young; also called
  sterilization.
examples:
- Sterilisation of the tools kills the germs on them.
- Heat is one way to do sterilisation before surgery.
