senseId: 'insist%2:32:00::'
synsetId: 00820635-v
simpleMeaning: to stand one's ground, whether forcefully or with determination.
scope: Standing firm and refusing to give way (another name for this sense is 'take a firm stand'), rather
  than stating a claim as true or pleading urgently.
examples:
- She insisted on complete silence during the experiment.
- He insisted, and the committee finally gave way.
