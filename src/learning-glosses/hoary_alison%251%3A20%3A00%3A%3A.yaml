simpleMeaning: Small white flowers crowd into dense heads above soft grey-green leaves; the pods are hairy.
  This tall European annual grows wild in North America and is sometimes a troublesome weed.
scope: Also called hoary alyssum, since both names share one sense; not the garden flower sold as sweet
  alyssum.
examples:
- Hoary alison crowded the roadside, its small white flower heads bent by the wind.
- The farmer ploughed a field where hoary alison had taken hold.
