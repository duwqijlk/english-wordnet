simpleMeaning: Sharing the food of certain two-shelled shellfish without harming them, this tiny soft
  crab lives in the soft folds inside them.
scope: It is a tiny soft crab, not one that feeds on its own, that lives in the soft folds of certain
  two-shelled shellfish and shares their food without harming them.
examples:
- The pea crab lived in the mantle of the mussel.
- A pea crab shared the oyster's food without harming it.
