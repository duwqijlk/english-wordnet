simpleMeaning: Radiation in the ultraviolet range, with wavelengths shorter than visible light but longer
  than X rays.
scope: Also called ultraviolet, ultraviolet illumination, and ultraviolet radiation, these rays lie past
  the purple end of what the eye can see, with waves shorter than what the eye can see but longer than
  X rays.
examples:
- The white cloth glowed under ultraviolet light.
- Ultraviolet light filled the room.
