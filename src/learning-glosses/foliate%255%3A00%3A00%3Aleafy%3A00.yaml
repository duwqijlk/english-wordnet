simpleMeaning: a word part often added to other words that means a thing has leaves, or a set kind or
  number of leaves, or looks like a leaf
scope: A word part that says a thing has leaves or looks like a leaf, not a leaf itself and not the rock
  sense of thin layers.
examples:
- ‘Foliate’ is joined to ‘tri’ to make ‘trifoliate’, a word for three leaves.
- A foliate pattern on the wall looks like a row of leaves.
