simpleMeaning: In music, the way a player finishes a note or a few notes played together
scope: In music, the way a player ends a note or phrase; release is another name for this. Not the way
  a note begins, and not a note played on its own.
examples:
- Her tone ending was soft and clean.
- The teacher worked on his tone ending at the close of the phrase.
