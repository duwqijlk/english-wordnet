simpleMeaning: a health problem, often in children, in which a person keeps eating things that are not
  food
scope: A health problem in which a person keeps eating things that are not food, not a lack of hunger
  and not a wish to eat less.
examples:
- The child with pica kept eating bits of paper and chalk.
- Her pica made her mother hide the small stones in the garden.
