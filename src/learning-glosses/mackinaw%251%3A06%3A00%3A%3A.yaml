simpleMeaning: A thick wool cloth with a soft, fuzzy surface, often woven in a checked pattern of crossed
  bands.
scope: A thick fuzzy wool cloth, often in a checked pattern; not a light cotton cloth and not a thick
  plaid blanket.
examples:
- She wore a jacket of red mackinaw against the cold.
- The mackinaw was thick enough to keep out the wind.
