simpleMeaning: the state of being put forward as a person who is right for a job or for an election
scope: This is the state of being put forward for a job or election, not the speech that puts a name forward
  at a party meeting.
examples:
- His nomination for the job pleased his friends.
- She won the party's nomination after a long race.
