simpleMeaning: the pull on iron towards a magnet, linked to electric currents as well as to magnets, and
  shown by fields of force
scope: The pull of magnets and electric currents, not a person's charm and not the pull of the earth.
examples:
- Magnetism makes the compass needle point north.
- The children learned about magnetism with a bar magnet and some nails.
