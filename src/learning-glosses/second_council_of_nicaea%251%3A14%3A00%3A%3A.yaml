simpleMeaning: The seventh great meeting of the whole Church in 787, which said no to destroying holy
  pictures and set rules for honouring them.
scope: A gathering of the whole Church in 787 that decided holy pictures should be honoured; Nicaea is
  another name for this sense.
examples:
- The Second Council of Nicaea met in 787 to settle the question of holy images.
- Decisions of the Second Council of Nicaea still guide how icons are honoured.
