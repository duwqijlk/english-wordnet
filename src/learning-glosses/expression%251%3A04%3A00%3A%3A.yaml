simpleMeaning: Squeezing or pressing something so that what is inside it comes out.
scope: The physical pressing out of something, not the genetic activation of a gene or the look on someone's
  face.
examples:
- The expression of milk from the breast is sometimes done by hand.
- The expression of oil from the seeds requires a heavy press.
