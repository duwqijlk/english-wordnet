simpleMeaning: A long-lived plant of dry places whose leaves have sticky hairs that give off glue and
  juices that break down bugs for food; found in Portugal, southern Spain and Morocco.
scope: A long-lived plant of dry places that eats bugs, not a cactus and not a water plant.
examples:
- The Drosophyllum lusitanicum traps bugs on its sticky leaves.
- We saw Drosophyllum lusitanicum growing on dry ground in Portugal.
