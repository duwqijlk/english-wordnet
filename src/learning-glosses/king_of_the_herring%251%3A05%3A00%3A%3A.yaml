simpleMeaning: A thin fish of warm seas that lives in deep water, 20 to 30 feet long, with a red fin along
  its back
scope: A thin deep-water fish of warm seas, also called oarfish; not a herring, and not a fish of shallow
  cold water.
examples:
- The king of the herring can grow to 30 feet long.
- A king of the herring flashed its red fin in the deep water.
