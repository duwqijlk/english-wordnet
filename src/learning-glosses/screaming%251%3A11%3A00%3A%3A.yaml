schema: oewn-learning-gloss-v2
senseId: 'screaming%1:11:00::'
synsetId: 07407761-n
simpleMeaning: a very high sound that makes you think of a person calling out
scope: A high noise from a thing such as brakes or the wind, not a sound a person makes; scream, shriek,
  screech, shrieking and screeching are other names for this sense. Do not confuse it with the sharp cry
  a person actually gives.
examples:
- The screaming of the brakes made everyone cover their ears.
- We could hear the screaming of the wind through the broken window.
