simpleMeaning: the sad, empty feeling of a place that has nothing pleasant in it
scope: 'Also called desolation, bleakness and bareness: this is the sad, empty feeling of a place. It
  is not the sense of being open and hiding nothing, and not the sense of having no clothes on.'
examples:
- The nakedness of the winter landscape made the village feel empty and sad.
- There was a nakedness to the bare hills that left the whole place feeling bleak.
