simpleMeaning: Any of several rough, prickly-leaved bushes and low shrubs from the Old World, with milky
  sap and yellow flowers; now widespread abroad, often a harmful weed in cultivated soil.
scope: Another name for milk thistle; these are the coarse yellow-flowered weeds, not the tall biennial
  with purple flower heads.
examples:
- Sow thistle springs up wherever the soil has been disturbed.
- Gardeners pull sow thistle before its yellow flowers can set seed.
