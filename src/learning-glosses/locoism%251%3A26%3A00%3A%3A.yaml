simpleMeaning: Farm animals that eat a poisonous weed grow weak, lose their balance, shake, and can no
  longer move some parts of their bodies
scope: Also called loco disease; a sickness of farm animals from a poisonous weed.
examples:
- The vet said the locoism came from the weed in the north field.
- Locoism made the cow tremble and stumble when it walked.
