schema: oewn-learning-gloss-v2
senseId: 'amicus_curiae%1:18:00::'
synsetId: 09807678-n
simpleMeaning: a person who advises a court on law in a case they are not part of, most often to shape
  the result of a case of wide public interest
scope: A person who gives a court advice but is not a party to the case; friend of the court is another
  name for this sense, not a lawyer for one side and not the brief they file.
examples:
- The judge asked an amicus curiae to explain the new law.
- She acted as amicus curiae and gave the court her view of the law.
