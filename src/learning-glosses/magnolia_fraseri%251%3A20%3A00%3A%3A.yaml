senseId: 'magnolia_fraseri%1:20:00::'
synsetId: 11731127-n
simpleMeaning: A small tree that stands straight up, loses its leaves each year, and bears big leaves
  in curls at the ends of its branches.
scope: This is a small tree that stands straight up, loses its leaves each year, and bears big leaves
  in curls at the ends of its branches; earleaved umbrella tree is another name for this sense, and it
  is not a tree that keeps its leaves all year.
examples:
- Magnolia fraseri stood at the edge of the wood, its big leaves curled at the branch tips.
- In winter, Magnolia fraseri stands bare, its leaves gone.
