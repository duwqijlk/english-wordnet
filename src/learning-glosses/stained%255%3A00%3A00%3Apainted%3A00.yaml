simpleMeaning: Covered with a coat of colour or varnish
scope: A coat of colour or varnish over a thing, not a mark left by something that got on it.
examples:
- The stained wood looked darker and richer than the plain boards.
- He bought stained oak for the shelves in the new kitchen.
