simpleMeaning: Said of a person who will not stand by a belief or take a bold step
scope: 'Also called faint, timid, and fainthearted: said of a person who will not stand by a belief or
  take a bold step, not a person who feels weak or dizzy.'
examples:
- The faint-hearted speaker gave up before the debate began.
- A faint-hearted leader will not stand up for the plan.
