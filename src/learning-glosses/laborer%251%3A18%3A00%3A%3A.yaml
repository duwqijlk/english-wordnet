simpleMeaning: a person who works with their hands and does hard physical work
scope: This is a person who does hard work with the hands; it is not a worker whose job is mainly thinking,
  writing, or telling other people what to do.
examples:
- The laborer carried bricks up to the builders all day.
- Each laborer was paid at the end of the week for work on the road.
