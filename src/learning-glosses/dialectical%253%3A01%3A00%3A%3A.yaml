simpleMeaning: about or using a way of thinking that looks at two opposite ideas and talks through them
  to find the truth
scope: 'Also called dialectic: about testing ideas through talk between opposite sides, not about a local
  form of a language.'
examples:
- She used a dialectical method, testing each idea against its opposite.
- His dialectical way of thinking led him to hear both sides before deciding.
