simpleMeaning: A tall plant that lives for years, with hairy stems and leaves, grown in many places for
  its large, uneven lumps that grow under the ground and can be eaten
scope: Also called girasol, Helianthus tuberosus, or Jerusalem artichoke sunflower; this is the plant
  itself, not the tuber that is eaten as food.
examples:
- We grew Jerusalem artichokes along the back fence.
- The Jerusalem artichoke in our plot grew taller than the fence.
