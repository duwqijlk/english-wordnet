simpleMeaning: From Greenland to Alaska, this spreading plant lives through many seasons, bearing red
  berries and leaves clustered in rings around the ends of its stems.
scope: 'Another name for bunchberry, crackerberry and dwarf cornel: the creeping plant itself, not a berry
  dessert and not the fruit alone.'
examples:
- Pudding berry crept along the shaded bank.
- In autumn the pudding berry is bright with red fruit.
