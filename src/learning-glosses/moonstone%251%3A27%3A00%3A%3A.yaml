simpleMeaning: a clear or half-clear jewel stone with a soft shine like a pearl; some pieces are orthoclase
  feldspar and others are plagioclase feldspar, two pale kinds of mineral
scope: A clear or half-clear jewel stone with a soft shine like a pearl; not an opal and not a pearl itself.
examples:
- She wore a moonstone ring that glowed softly in the light.
- The moonstone in the brooch caught the sun.
