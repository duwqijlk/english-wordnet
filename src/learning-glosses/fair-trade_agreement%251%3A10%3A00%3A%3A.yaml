simpleMeaning: The maker of a marked brand and its sellers keep the price at or above the price the maker
  sets, a deal against the law in the United States.
scope: This deal fixes a lowest price for a brand, and the maker sets that price, not the sellers.
examples:
- The fair-trade agreement kept the price of the brand at the level the maker set.
- Under the fair-trade agreement, the shops could not sell the brand for less.
