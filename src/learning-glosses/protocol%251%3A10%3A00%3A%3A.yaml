simpleMeaning: The set forms of ceremony and good manners that diplomats and heads of state follow.
scope: This is the set forms of ceremony among diplomats and heads of state, not the rules for sending
  computer data.
examples:
- The protocol at the dinner was strict.
- They followed protocol when the queen arrived.
