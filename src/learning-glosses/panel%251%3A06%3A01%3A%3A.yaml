simpleMeaning: A flat surface that stops power from passing through it, with switches, dials, and meters
  on it to control other machines that use power
scope: 'Also called board: a flat surface with switches, dials, and meters to control other machines,
  not a small window on a computer screen and not a piece of cloth.'
examples:
