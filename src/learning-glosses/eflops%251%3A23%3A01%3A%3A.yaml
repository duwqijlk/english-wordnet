simpleMeaning: In computer science, a unit that measures how fast a computer works, equal to one quintillion
  floating-point operations a second, each one a maths step done by the machine.
scope: Also called an exaflop; a unit that measures how fast a computer works, not a computer itself.
examples:
- The new machine runs at several EFLOPS.
- EFLOPS measures the speed of a computer system.
