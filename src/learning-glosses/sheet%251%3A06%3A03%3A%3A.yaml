simpleMeaning: A flat object made by people, thin compared with its length and width
scope: A flat thing made by people, such as a panel or plate; flat solid is another name for it. It is
  not a bed covering, not the cloth of a sail, and not a wide natural stretch like ice on a pond.
examples:
- The factory rolls out thin sheets of steel.
- He wrote his name on a blank sheet of paper.
