simpleMeaning: In American football, the place in a team for the player behind the line who leads the
  team's attacks
scope: This is the position or place in the team, not the person who plays in that place and not the act
  of playing there.
examples:
- Quarterback is the most important position on the team.
- He was moved to quarterback for the last game.
