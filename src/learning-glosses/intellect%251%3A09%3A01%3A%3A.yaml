simpleMeaning: the power of the mind to think clearly, draw conclusions, and tell things apart
scope: The power of the mind to think clearly, draw conclusions, and tell things apart; also called reason
  or understanding, and not knowledge itself, and not skill at one subject.
examples:
- Her sharp intellect solved the puzzle in minutes.
- The book is a test of intellect as much as of memory.
