simpleMeaning: East and west are counted from this line round the earth, which lies at zero degrees; most
  often it is the line through Greenwich in England.
scope: This is the one line of longitude from which east and west are counted, and every other line of
  longitude is counted from it.
examples:
- London lies almost on the prime meridian.
- Their longitude was counted east or west from the prime meridian.
