simpleMeaning: something that is only imagined, such as a chance, a state of affairs, a remark, a plan,
  or a set of facts
scope: A thing that is only imagined, not a real event and not the adjective that describes a guess.
examples:
- Consider the following, just as a hypothetical possibility.
- It was only a hypothetical, not a real plan.
