simpleMeaning: the world where people live, seen as different from heaven or hell.
scope: Not the planet as a physical body and not the ground under your feet; this is the human world in
  a religious contrast.
examples:
- He believed good deeds on earth would be rewarded later.
- The prayer asks for peace on earth.
