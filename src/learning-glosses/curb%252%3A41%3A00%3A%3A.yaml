senseId: 'curb%2:41:00::'
synsetId: 02516039-v
simpleMeaning: to make something less strong, calm it down, hold it back, and keep it within limits
scope: Also called control, hold, check, contain, and moderate. This is about making something less strong
  and keeping it within limits, not the raised edge of a road or the piece in a horse's mouth.
examples:
- He tried to curb his anger and speak in a calm voice.
- The city put new rules in place to curb the rise in rents.
