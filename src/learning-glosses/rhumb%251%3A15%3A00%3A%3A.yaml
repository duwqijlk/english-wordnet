simpleMeaning: A ship or plane that keeps one compass direction follows this line, which cuts every north-south
  mark on a round surface at the same angle.
scope: Loxodrome and rhumb line are other names for this course, the line on a round surface that cuts
  every north-south mark at the same angle and that a ship or plane follows when it keeps one compass
  direction.
examples:
- They sailed along the rhumb without changing course.
- The pilot followed the rhumb to keep one compass direction.
