simpleMeaning: Of loss of mind, touching the time just before a hurt.
scope: Of loss of mind, touching the time just before a hurt; not moving from east to west on the sky
  ball, or, for wanderers, round the sun the wrong way to the Earth, nor moving or set or tending back,
  or against an old way, nor to move back in a ring, of sky bodies.
examples:
- Their blank was retrograde at dawn.
- The loss was retrograde by nature.
