simpleMeaning: A linked set of gaps and tubes between body parts carries lymph all through the body.
scope: Also called systema lymphaticum, this is the body's own set of gaps and tubes, lying between its
  parts, that carries lymph all through it.
examples:
- Lymph from the foot travels through the lymphatic system.
- The lymphatic system links the tissues and organs of the body.
