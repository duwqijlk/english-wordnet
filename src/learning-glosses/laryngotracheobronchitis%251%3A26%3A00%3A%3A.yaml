simpleMeaning: A swelling and soreness of the voice box, the windpipe, and the tubes that carry air into
  the lungs.
scope: A swelling and soreness of the voice box, the windpipe, and the tubes that carry air into the lungs;
  not a soreness of the lungs alone, and not a soreness of the nose and throat.
examples:
- Laryngotracheobronchitis made the child's breathing noisy.
- The doctor said the laryngotracheobronchitis would clear up in a few days.
