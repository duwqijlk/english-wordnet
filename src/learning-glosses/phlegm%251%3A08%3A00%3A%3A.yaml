simpleMeaning: spit coughed up from the chest, made of saliva mixed with matter from the airways; in old
  ideas about the body it was thought to make a person slow
scope: Spit coughed up from the chest, made of saliva mixed with matter from the airways; not clear spit,
  and not a lack of feeling.
examples:
- He coughed up phlegm all through the winter.
- The nurse asked him to bring up some phlegm for the test.
