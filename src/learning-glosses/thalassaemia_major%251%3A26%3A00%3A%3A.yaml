simpleMeaning: a deadly blood sickness passed down from both parents, in which the body makes no hemoglobin;
  the bones grow out of shape, and the heart, spleen, and liver grow large
scope: 'Also called thalassemia major: a deadly blood sickness passed down from both parents, not a mild
  blood problem and not an illness caught from germs.'
examples:
- Thalassaemia major left the child with no hemoglobin and a swollen spleen.
- Children with thalassaemia major need care from birth because their blood lacks hemoglobin.
