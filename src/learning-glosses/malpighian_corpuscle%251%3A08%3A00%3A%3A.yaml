simpleMeaning: A tiny case at the wide end of a kidney tube called a nephron, holding Bowman's capsule
  and a ball of tiny blood tubes called a glomerulus.
scope: A tiny case at the wide end of a kidney tube, holding Bowman's capsule and a glomerulus, also called
  malpighian body or renal corpuscle, not the whole kidney and not a blood vessel.
examples:
- The malpighian corpuscle filters blood at the nephron's end.
- Each malpighian corpuscle holds a glomerulus.
