simpleMeaning: a thing someone has that is worth a lot and helps them a great deal
scope: A thing of special worth or use that a person has, not the special line of work they have chosen
  as a career.
examples:
- Cooking is his specialty, and friends often ask him to cook for them.
- Her specialty is a rare old violin that she plays at every concert.
