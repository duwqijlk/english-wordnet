simpleMeaning: worth suggesting to someone because it is wise and careful
scope: This means a wise choice that is good to suggest, not something that must be done and not something
  unsafe or unwise.
examples:
- It is advisable to telephone first before you visit.
- Extreme caution is advisable when the roads are icy.
