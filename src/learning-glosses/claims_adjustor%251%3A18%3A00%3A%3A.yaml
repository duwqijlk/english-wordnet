simpleMeaning: someone whose job is to look into loss and harm and suggest a fair sum to settle it
scope: Someone whose job is to look into loss and harm and suggest a fair sum to settle it; adjuster,
  adjustor, claim agent and claims adjuster are other names for this sense, not the person who makes the
  request and not a lawyer.
examples:
- The claims adjustor asked for photos of the damaged roof.
- A claims adjustor will decide how much the firm should pay.
