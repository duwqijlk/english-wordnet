simpleMeaning: One of the body parts that builds fluids the body needs and lets them out through tubes
  or right into the blood
scope: 'Also called a gland, a secreter, and a secretory organ: a body part that builds fluids the body
  needs; not a part that stores food and not a part that moves blood.'
examples:
- The secretor lets its fluid out through a tube.
- The secretor sends its fluid straight into the blood.
