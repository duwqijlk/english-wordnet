schema: oewn-learning-gloss-v2
senseId: 'codicil%1:10:00::'
synsetId: 06556648-n
simpleMeaning: a paper added later to change a will (a paper that says who gets a person's things after
  that person dies)
scope: A paper added to change a will that is already made; it is not the will itself and not a new will
  that takes its place.
examples:
- She added a codicil to her will to leave the house to her son.
- By a codicil, he changed who would get his money after his death.
