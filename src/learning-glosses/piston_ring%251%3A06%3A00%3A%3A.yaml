simpleMeaning: Between the moving part inside a motor and the wall of its tube, a split metal band closes
  the gap.
scope: This split metal band closes the gap between the moving part inside a motor and the wall of its
  tube; it is not a solid band.
examples:
- The piston ring fitted round the moving part.
- The motor needed a new piston ring.
