senseId: 'brucellosis%1:26:01::'
synsetId: 14151511-n
simpleMeaning: A catching germ ill of folk, caught by touch with sick beasts or sick meat or milk goods,
  marked by fever and head pain.
scope: This sense is also called undulant fever, a catching germ ill of folk, caught by touch with sick
  beasts or sick meat or milk goods, marked by fever and head pain, unlike the sense for an infectious
  disease of domestic animals often resulting in spontaneous abortion, transmittable to human beings.
examples:
- Brucellosis spreads by touch with sick beasts.
- The brucellosis brings fever and head pain.
