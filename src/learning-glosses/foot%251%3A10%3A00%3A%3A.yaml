senseId: 'foot%1:10:00::'
synsetId: 07109509-n
simpleMeaning: In prosody, a unit of two or three syllables that forms the basic beat of a poem's rhythm.
scope: The metrical unit of poetry, a small group of syllables, not a moving or gripping organ on an animal
  without a backbone, the leg ending of a backboned animal, or a support shaped like a leg ending.
examples:
- The iamb is a common poetic foot made of an unstressed syllable followed by a stressed one.
- Each line of the poem contains five feet.
