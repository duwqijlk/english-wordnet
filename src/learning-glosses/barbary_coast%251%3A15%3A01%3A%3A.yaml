simpleMeaning: A part of a city with a bad name for gambling rooms, brothels, bars and wild night life,
  above all the San Francisco waterfront after the gold rush of 1849.
scope: A part of a city with a bad name for gambling and wild night life, above all the old San Francisco
  waterfront; set apart from other parts of a city and from other rough districts.
examples:
- The old Barbary Coast was the wild waterfront of San Francisco.
- We will have no Barbary Coast in this city!
