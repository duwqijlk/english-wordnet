senseId: flat%5:00:00:unstimulating:00
synsetId: 02315243-s
simpleMeaning: Dull and boring, giving you nothing to hold your interest.
scope: Describes a joke, show or evening that fails to excite anyone, not something shallow or lacking
  depth, and not food with no flavor.
examples:
- The party was flat, and most guests left early.
- His jokes were flat, and nobody even smiled.
