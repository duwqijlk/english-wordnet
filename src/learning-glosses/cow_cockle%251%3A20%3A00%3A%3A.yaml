simpleMeaning: 'An annual European plant with pale pink blooms: a garden flower or a self-sown weed among
  grain, brought to North America and sometimes classed as a soapwort.'
scope: Another name for cowherb, the pale-pink European annual of grainfields; not corncockle, a different
  weed of cereal crops.
examples:
- Cow cockle once spread through the wheat fields of the northern plains.
- She mistook the pale pink cow cockle for a garden flower.
