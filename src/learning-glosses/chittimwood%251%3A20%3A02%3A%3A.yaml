scope: A shrubby tree of the Pacific coast of the United States that gives cascara sagrada; bearberry,
  bearwood, cascara buckthorn and chittamwood are other names for this sense, not the southern tree with
  great plumes of feathery flowers.
examples:
- Chittimwood is a shrubby tree of the Pacific coast.
- Cascara sagrada comes from the chittimwood.
