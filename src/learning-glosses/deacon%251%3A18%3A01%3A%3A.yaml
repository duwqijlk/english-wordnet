simpleMeaning: In a Protestant church, a member who is not a minister and who helps the minister with
  church work
scope: A Protestant church member who helps the minister but is not a minister, not the sense for a church
  worker ranked just below a priest.
examples:
- The deacon helped the minister hand out food after the Sunday service.
- As a deacon, Mr Lee visits sick members of the church for the minister.
