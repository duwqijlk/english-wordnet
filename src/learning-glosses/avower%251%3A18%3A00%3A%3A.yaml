simpleMeaning: a person who says openly and with courage that something is true
scope: A person who speaks a truth out loud with courage, not a person who keeps it quiet and not a witness
  who merely gives facts.
examples:
- The avower of the plan stood before the crowd and said it was his idea.
- She was an avower of the new law, and she defended it in public.
