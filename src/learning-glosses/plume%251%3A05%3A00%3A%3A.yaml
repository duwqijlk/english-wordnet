simpleMeaning: the light outer covering of a bird, made of hard material that keeps water out and covers
  the bird's body
scope: A bird's own outer covering; not a feather or group of feathers worn as an ornament, and not a
  shape that looks like a feather.
examples:
- The duck's plume keeps water off its skin when it swims.
- Soft plume covers the whole body of the young bird.
