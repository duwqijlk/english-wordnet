simpleMeaning: A common sea plant that grows on rocks, used to make kelp and to feed the soil.
scope: Also called tang, black rockweed, bladder fucus, and bladderwrack, this common rockweed is used
  to make kelp and to feed the soil, unlike the serrated wrack, which has saw-like edges.
examples:
- Fucus vesiculosus is common on rocky shores.
- Farmers once gathered Fucus vesiculosus to feed the soil.
