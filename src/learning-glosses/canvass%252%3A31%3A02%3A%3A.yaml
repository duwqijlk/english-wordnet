simpleMeaning: to think about something closely and in detail to find its most important features or what
  it means
scope: 'Also called study, examine, analyze and analyse: this is thinking about something in detail, not
  asking people for votes and not heavy cloth.'
examples:
- The teacher asked us to canvass the evidence before we decided.
- She canvassed her real reasons for leaving before she made a choice.
