simpleMeaning: In this state the tubes that carry seed out and the glands that make seed fluid are sore
  and swollen, most often with a sore, swollen gland below the bladder.
scope: It belongs with the sore, swollen states of the tubes and glands that make and carry seed, most
  often found with a sore, swollen gland below the bladder.
examples:
- The seed tubes were sore and swollen from vasovesiculitis.
- A sore, swollen gland below the bladder often came with vasovesiculitis.
