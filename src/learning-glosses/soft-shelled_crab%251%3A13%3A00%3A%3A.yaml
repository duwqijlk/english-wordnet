scope: A sea creature just out of its old hard cover, with its new cover still tender and bendy; also
  called soft-shell crab; not a hard-covered sea creature, and not a sea creature with its old cover still
  on.
examples:
- Soft-shelled crabs are a summer dish.
- He caught a soft-shelled crab at low tide.
