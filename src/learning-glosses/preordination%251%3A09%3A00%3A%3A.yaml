simpleMeaning: God fixed even who is saved, the teaching holds above all, along with every event for all
  time; in theology, all that happens was settled beforehand, often tied to Calvin
scope: Also called foreordination, predestination, and predetermination; in theology, the teaching that
  all events were settled beforehand.
examples:
- Preordination teaches that God fixed every event before it happened.
- Calvin is often tied to the teaching of preordination.
