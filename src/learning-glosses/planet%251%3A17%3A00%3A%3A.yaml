simpleMeaning: in astronomy, any of the nine large bodies circling the sun and reflecting light, Mercury
  to Pluto outward from the sun, moving counterclockwise as seen from the constellation Hercules
scope: This is the nine-planet sense in astronomy, not any body orbiting any star, and not a person who
  follows or serves another.
examples:
- The book still called Pluto the ninth planet.
- The textbook listed nine planets, with Mercury nearest the sun.
