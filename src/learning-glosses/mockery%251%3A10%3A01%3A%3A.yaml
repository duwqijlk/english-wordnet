schema: oewn-learning-gloss-v2
senseId: 'mockery%1:10:01::'
synsetId: 06793148-n
simpleMeaning: a piece of writing or other work that copies or twists the way a person writes or works,
  usually to make people laugh
scope: A work that copies or twists someone's style for a laugh, not the act of laughing at someone and
  not a true copy of their work.
examples:
- The mockery of the poet's style made the whole class laugh.
- Her mockery was a short piece that copied the minister's way of speaking.
