simpleMeaning: a body chemical made by the front of a small brain gland and by the placenta, which starts
  the sex glands working and controls the making of young
scope: 'Also called gonadotrophin, gonadotropic hormone, and gonadotropin: a body chemical that starts
  the sex glands working and controls the making of young, not a sex gland itself and not a medicine.'
examples:
- Gonadotrophic hormone from the pituitary gland starts the sex glands working.
- Doctors can test the level of gonadotrophic hormone in the blood.
