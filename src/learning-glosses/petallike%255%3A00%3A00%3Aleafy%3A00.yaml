simpleMeaning: Looking like the thin soft coloured part of a flower.
scope: This is about something that looks like a flower's soft coloured part, also called petal-like;
  it is not a real flower part, and not something merely pink or soft.
examples:
- The petallike wings of the moth caught the light.
- She found a petallike shell on the beach.
