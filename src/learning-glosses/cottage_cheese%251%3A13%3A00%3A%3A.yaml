simpleMeaning: A mild white food made from the lumps that form in milk with the fat taken out after it
  has gone sour
scope: This is a mild white food made from soured milk with the fat taken out; farm cheese and farmer's
  cheese are other names for it; not a hard cheese pressed into blocks.
examples:
- She spread cottage cheese on her toast.
- The cottage cheese in the salad was mild and white.
