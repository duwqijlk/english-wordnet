schema: oewn-learning-gloss-v2
senseId: 'isolex%1:15:01::'
synsetId: 92419683-n
simpleMeaning: A certain word is used in one area and not in the next; a line on a map of speech shows
  where that area ends
scope: A line marking the area where a certain word is used; not a line marking how a sound is said and
  not a line joining places with the same number.
examples:
- The isolex runs through the county, marking where 'pail' gives way to 'bucket'.
- Dialect researchers drew an isolex around the region where that word is heard.
