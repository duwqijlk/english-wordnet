simpleMeaning: to be held back and unable to grow or develop as you should
scope: To be held back and unable to grow or develop as you should; also called choke, not to stop someone
  else from growing and not to stop breathing.
examples:
- He is suffocating, living at home with his aged parents in the small village.
- She felt she was suffocating in the small town.
