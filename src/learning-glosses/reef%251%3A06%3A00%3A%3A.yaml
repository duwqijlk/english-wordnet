simpleMeaning: one of several strips across a sail that can be taken in or rolled up to make the part
  of the sail that catches the wind smaller
scope: This is a strip across a sail, not a ridge of rock or coral just under the surface of the sea.
examples:
- When the wind grew strong, the sailors took in a reef to make the sail smaller.
- The lowest reef runs across the sail just above its bottom edge.
