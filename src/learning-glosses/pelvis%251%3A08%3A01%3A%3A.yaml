simpleMeaning: a funnel-shaped part at the end of the kidney, where urine gathers before it goes into
  the ureter (the tube that carries urine on)
scope: Also called renal pelvis. This is the funnel-shaped part in the kidney, not the set of bones that
  holds up the legs.
examples:
- The doctor found a small stone in the pelvis of her left kidney.
- Urine gathers in the pelvis of the kidney before it moves on.
