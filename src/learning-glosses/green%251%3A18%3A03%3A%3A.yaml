simpleMeaning: Someone who works to protect the environment and belongs to an environmental political
  party.
scope: This means a member of an environmental political party; it is not the color, a vegetable, or a
  naive person.
examples:
- The town council now includes two greens who campaigned on clean water.
- As a green, she pushed the city to ban single-use plastics.
