simpleMeaning: to leave your job or position at the end of your working life and stop working from then
  on
scope: This is a person stopping work and leaving a job, not taking bills or shares out of use, and not
  making someone else stop work.
examples:
- He retired at 68 after forty years of teaching.
- She plans to retire next year and leave her job at the school.
