senseId: 'fade%2:30:02::'
synsetId: 00225077-v
simpleMeaning: Become fainter or harder to make out, then go out of sight little by little, or only seem
  to.
scope: Visual loss toward invisibility, not the broader verb sense for things that gradually pass or blow
  over, nor losing freshness or energy, nor a golf shot; melt is another name for this sense.
examples:
- The letters on the old sign had faded until they could barely be read.
- As dusk fell, the far hills faded into the sky.
