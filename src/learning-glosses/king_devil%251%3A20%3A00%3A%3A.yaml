simpleMeaning: A European hawkweed brought into the northeastern United States, where it grows as a weed
  that troubles local people.
scope: This is a European hawkweed brought into the northeastern United States, where it grows as a weed
  that troubles local people; yellow hawkweed is another name for it, not a hawkweed native to America.
examples:
- King devil spread as a troublesome weed in the northeast.
- Farmers pulled up king devil where it crowded their fields.
