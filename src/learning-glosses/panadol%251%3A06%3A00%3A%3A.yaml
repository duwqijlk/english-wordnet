simpleMeaning: A painkiller for mild pain that does not ease swelling, also used to bring down fever;
  sold as a brand of acetaminophen tablets.
scope: A mild painkiller, also called acetaminophen, Anacin III, Datril, Phenaphen, Tempra and Tylenol,
  not a drug for swelling.
examples:
- She took Panadol for her headache.
- Panadol brought his fever down.
