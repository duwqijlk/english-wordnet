simpleMeaning: to put things in a steady state so that no side outweighs another
scope: To put things in a steady state; balance, equilibrate and equilibrize are other names for this
  sense, not bringing a chemical mix to a standstill.
examples:
- The engineer will equilibrise the pressure on both sides.
- They equilibrised the weights until the beam stood level.
