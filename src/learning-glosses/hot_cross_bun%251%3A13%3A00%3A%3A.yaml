simpleMeaning: With sugar glaze on top in two straight lines, one over the other, this roll of raised
  dough holds spices, raisins and citron and is only a little sweet.
scope: Also called a cross bun, it is a raised roll with sugar glaze on top in the shape of two straight
  lines.
examples:
- She bought a hot cross bun for breakfast.
- The hot cross buns were marked with sugar glaze.
