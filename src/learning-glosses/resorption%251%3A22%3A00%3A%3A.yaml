simpleMeaning: the way the body breaks down and takes back in a special part it once built
scope: Not the making of new body tissue, and not the passing of waste out of the body; also called reabsorption.
examples:
- After the tooth was lost, resorption slowly wore away the bone.
- The body used resorption to clear the old tissue.
