simpleMeaning: a boneless piece of beef for cooking, cut from the long soft meat along the back of the
  animal
scope: Also called filet. This is a boneless piece of beef, not a slice of fish, not a headband, and not
  a strip used to join steel.
examples:
- He ordered a fillet of beef with potatoes for dinner.
- The cook grilled the beef fillet until it was soft and brown.
