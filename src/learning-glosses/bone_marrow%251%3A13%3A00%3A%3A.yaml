simpleMeaning: very soft food taken from the inside of an animal's skeleton, very good for you
scope: 'Also called marrow: soft food from inside an animal, not the fatty stuff that fills the hollows
  of its hard frame and not a cut of meat.'
examples:
- She spread the bone marrow on toast.
- The bone marrow melted into the soup.
