senseId: 'disgustingly%4:02:00::'
synsetId: 00315534-r
simpleMeaning: in a way that is so bad, dirty or unpleasant that it makes people want to turn away, or
  to that degree
scope: Also called sickeningly, distastefully and revoltingly, this means in a very unpleasant way or
  to a very unpleasant degree, not just badly.
examples:
- The kitchen was disgustingly dirty, with old food all over the floor.
- The water tasted disgustingly bad after sitting in the sun all day.
