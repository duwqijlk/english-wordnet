simpleMeaning: loving someone in a very silly, too strong way, and letting them have what they want even
  when it is not good
scope: 'Also called fond and doting: loving someone too much in a silly way and letting them have their
  way, not just liking or caring for someone in a normal way.'
examples:
- Her adoring grandparents let her eat cake for breakfast every day.
- He gave his adoring wife flowers and never said no to her.
