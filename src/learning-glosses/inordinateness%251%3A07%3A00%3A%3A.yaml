senseId: 'inordinateness%1:07:00::'
synsetId: 05125737-n
simpleMeaning: Going too far, past what is enough or allowed, and so lacking restraint.
scope: Going too far past what is enough or allowed, not one large act on its own and not boldness; excess
  and excessiveness are other names for this sense.
examples:
- The inordinateness of his spending shocked his family.
- Her inordinateness knew no limits.
