simpleMeaning: A stone that fell from the sky, made of the stuff of rocks.
scope: A stone that fell from the sky, made of the stuff of rocks, not a fallen lump of iron and not a
  streak of light that burns away.
examples:
- The aerolite was found in the desert sand.
- An aerolite is a stone from space, not a stone of the earth.
