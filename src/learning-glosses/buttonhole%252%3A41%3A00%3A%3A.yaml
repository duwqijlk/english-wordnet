simpleMeaning: to keep a person in talk, as if by holding their clothes, so they will help you in politics
  or in money matters
scope: 'Also called lobby: keeping a person in talk to get help in politics or money, not the hole in
  clothes that a button goes through.'
examples:
- He buttonholed the minister after the meeting to ask for help with his business plan.
- She buttonholed a rich backer at the party and kept him talking about funding her project.
