simpleMeaning: A reader is given a piece of writing with words taken out and must fill in the gaps, which
  shows how well the reader can read.
scope: Also called a cloze procedure, this check of reading gives a reader a piece of writing with words
  taken out to fill in.
examples:
- He took a cloze test in his reading lesson.
- The cloze test showed how well she could read.
