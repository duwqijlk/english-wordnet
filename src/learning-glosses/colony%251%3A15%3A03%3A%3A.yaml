simpleMeaning: one of the 13 areas in North America ruled by Britain that became the first states of the
  United States
scope: This is one of those 13 areas in early United States history, not any area ruled by a far away
  country and not a group of living things grown in science.
examples:
- Virginia was a colony that later became a state.
- Massachusetts was a British colony before it became a state.
