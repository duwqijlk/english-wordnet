simpleMeaning: a real-life result that follows in a natural way from something else
scope: A result in real life that follows naturally from something; not the logic sense of a statement
  that follows from a proof.
examples:
- Blind jealousy is a common corollary of deep love.
- A rise in prices was a natural corollary of the shortage.
