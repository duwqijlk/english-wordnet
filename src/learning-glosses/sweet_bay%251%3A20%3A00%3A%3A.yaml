simpleMeaning: a bush or small tree with quite small white flowers that smell nice, found in large numbers
  in the south-east of the United States
scope: This is a bush or small tree with quite small white flowers; swamp bay and swamp laurel are other
  names for this sense. Not a bay tree grown for its leaves and not a large tree.
examples:
- A sweet bay grows beside the pond.
- The sweet bay was full of small white flowers in spring.
