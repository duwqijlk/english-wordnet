simpleMeaning: a plant with uneven showy flowers that have spurs, growing in the cool lands of the north,
  above all in the mountains
scope: 'Also called columbine and aquilegia: a plant with uneven spurred flowers, not a garden flower
  with even petals.'
examples:
- The aquilege grew wild on the mountain slope.
- Aquilege flowers hung down in bright colours.
