simpleMeaning: A North American green shoot with a spike of pink or white two-lipped blooms
scope: A North American green shoot with a spike of pink or white two-lipped blooms, with false dragon
  head and false dragonhead as other names for this sense; not a tree, and not a shoot with yellow blooms.
examples:
- The obedient plant bloomed pink in the garden.
- An obedient plant grew by the pond, its white blooms in a spike.
