simpleMeaning: A tropical American long-lived climbing plant grown for its hanging sprays of bright yellow
  and purple blooms whose boat-shaped lower petals curl like a snail shell; sometimes classed with beans.
scope: This is the tropical vine grown for its coiled blooms, not the petal shape alone; snail-flower
  is another name for the same plant.
examples:
- The corkscrew flower climbed the fence and opened its yellow and purple blooms in late summer.
- Gardeners grow corkscrew flower for its unusual coiled blossoms.
