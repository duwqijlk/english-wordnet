simpleMeaning: to push air out of your nose suddenly and with force that you cannot control, as when dust
  or pepper gets into your nose
scope: To do the act of forcing air from your nose, not the act itself used as a name, and not to breathe
  out in a normal way.
examples:
- Pepper always makes me sneeze.
- He sneezed three times because of the dust.
