simpleMeaning: the thin layer around a cell's inner fluid, a double sheet of fats, with proteins controlling
  which ions such as sodium, potassium or calcium pass in and out.
scope: 'Another name for cytomembrane and plasma membrane: the fatty outer layer of a cell. Not the membrane
  around the nucleus or other structures inside the cell.'
examples:
- Every living cell has a cell membrane that holds its contents together.
- The cell membrane lets potassium ions through while keeping other particles out.
