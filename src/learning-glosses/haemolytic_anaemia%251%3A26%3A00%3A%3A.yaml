simpleMeaning: A shortage of red blood cells caused by those cells being destroyed.
scope: 'Another name for this sense is hemolytic anemia: too few red cells in the blood, not a lack of
  iron and not a loss of blood from a cut.'
examples:
- The doctor said her haemolytic anaemia came from her red cells breaking down too fast.
- His haemolytic anaemia left him tired because his blood had too few red cells.
