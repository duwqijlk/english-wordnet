simpleMeaning: A group of forceful Black Americans who follow the faith taught by Mohammed and press for
  freedom and self-rule for Black Americans.
scope: This is a group of forceful Black Americans who follow the faith taught by Mohammed and press for
  freedom and self-rule for Black Americans, not a group of Black Americans of another faith and not a
  group of followers of the same faith in other lands.
examples:
- The Nation of Islam presses for independence for Black Americans.
- He joined the Nation of Islam in his twenties.
