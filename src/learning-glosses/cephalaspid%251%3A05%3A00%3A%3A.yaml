simpleMeaning: a fish with no jaw and a head covered with hard plates that lived in the Devonian, a time
  long ago, and is now gone
scope: 'Also called osteostracan: a fish with no jaw and a head covered with hard plates that lived long
  ago and is now gone, not a fish with jaws that lives today.'
examples:
- Fossils of the cephalaspid show a head covered with hard plates.
- The cephalaspid had no jaw, unlike a shark.
