simpleMeaning: In dentistry, a pressed copy of the teeth and gums made in wax or plaster
scope: In dentistry, a pressed copy of the teeth and gums made in wax or plaster, not a mark left by printing
  and not a copy of how a person acts.
examples:
- The dentist took an impression of my teeth.
- The impression in wax showed every tooth clearly.
