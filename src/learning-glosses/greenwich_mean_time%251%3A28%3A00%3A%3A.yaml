simpleMeaning: The local hour at the 0 meridian through the town in England, the same everywhere.
scope: Also called universal time, UT, GMT, Greenwich Time, and UT1; the local hour at the 0 meridian
  through the town in England, the same everywhere, set beside local clock times that change from place
  to place.
examples:
- The ship set its clocks by Greenwich Mean Time, the same everywhere.
- Greenwich Mean Time is the local hour at the 0 meridian through the town in England.
