simpleMeaning: In logic, a word, such as some, all, or no, that shows whether a claim is about all, some,
  or none of the things it names
scope: In logic, a word, such as some, all, or no, that shows whether a claim is about all, some, or none
  of the things it names, not a word that joins two statements and not a word that names a thing.
examples:
- In 'all men are mortal', the logical quantifier is 'all'.
- The logical quantifier 'some' fixes which things the claim covers.
