simpleMeaning: a motor-driven tool that makes wood smooth or cuts it to shape
scope: This is the powered workshop tool, not the carpenter's hand tool with an adjustable blade, and
  not an aircraft or a flat geometric surface.
examples:
- He switched on the plane and ran it along the plank until the surface was smooth.
- A fine layer of sawdust covered the bench after she used the plane on the door.
