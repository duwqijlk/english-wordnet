simpleMeaning: to say in public, or by a formal ruling, that a person or thing is shameful
scope: To call a person or thing shameful in public, with brand and mark as other names for this sense,
  and not a private complaint or the ending of a treaty.
examples:
- He denounced the government action in a public speech.
- She denounced the plan as cruel and unjust.
