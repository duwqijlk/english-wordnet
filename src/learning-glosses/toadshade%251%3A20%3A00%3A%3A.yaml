simpleMeaning: Where this trillium grows in the north-east of the United States, its flat leaves sit on
  the stem under red or purple blooms that give off a sharp smell.
scope: Red trillium and sessile trillium are other names for this trillium of the north-east of the United
  States, whose flat leaves and sharp-smelling blooms set it apart from other trilliums.
examples:
- The toadshade gave off a sharp smell from its red blooms.
- We found the toadshade by its leaves, which sat flat on the stem.
