simpleMeaning: One of two blood tubes, left and right, that carry blood back from the upper parts of the
  lungs.
scope: One of two blood tubes, left and right, that carry blood back from the upper parts of the lungs;
  also called vena pulmonalis superior; not a blood tube that carries blood to the lungs and not a lower
  lung blood tube.
examples:
- The superior pulmonary vein returns blood from the upper lobe of the lung.
- Blood flows through the superior pulmonary vein to the heart.
