simpleMeaning: The change from a mother's milk to other food in what a baby or young animal eats.
scope: The change from a mother's milk to other food in a baby's or young animal's diet, not the feeding
  of milk itself.
examples:
- Weaning usually begins when the baby is about six months old.
- The farmer started weaning the lambs in the spring.
