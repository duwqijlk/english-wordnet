simpleMeaning: With long needles and limbs that bend far without snapping, this tree of the west of North
  America has dark grey bark cut with deep grooves.
scope: It stands apart from other western pines by its long needles, bendy limbs, and grooved bark.
examples:
- The limber pine bent in the wind without breaking.
- Its long needles marked it as a limber pine.
