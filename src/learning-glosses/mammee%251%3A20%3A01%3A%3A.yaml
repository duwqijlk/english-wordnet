simpleMeaning: a tree of warm parts of the Americas whose fruit can be eaten and has a tough skin
scope: A tree of warm parts of the Americas; mamey, mammee apple and mammee tree are other names for this
  sense, not the fruit itself and not the wood of the tree.
examples:
- A mammee grows in the garden behind our house.
- The mammee in the yard bears large fruit each year.
