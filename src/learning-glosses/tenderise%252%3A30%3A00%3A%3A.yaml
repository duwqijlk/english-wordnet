simpleMeaning: To make a thing soft and easy to chew, by soaking it, beating it, or putting a softening
  powder on it
scope: To make a thing soft and easy to chew by soaking, beating, or a softening powder, also called tender
  and tenderize; not cooking food and not cutting food.
examples:
- She will tenderise the steak before grilling it.
- Tenderise the meat with a mallet to soften it.
