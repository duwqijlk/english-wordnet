simpleMeaning: Plant-eating animals of great size, with a long nose and long teeth
scope: Plant-eating animals of great size with a long nose and long teeth; proboscidean is another name
  for this sense, not other big plant-eaters without a long nose.
examples:
- Mammoths were proboscidians that died out long ago.
- The proboscidian group has only a few living kinds.
