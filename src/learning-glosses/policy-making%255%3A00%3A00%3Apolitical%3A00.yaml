simpleMeaning: Having to do with the rules that guide what a group does, not with running its day-to-day
  work
scope: About the rules that guide what a group does; not the day-to-day running of its work, and not the
  work of governing itself.
examples:
- The policy-making committee met to set new rules.
- Her policy-making role kept her out of daily administration.
