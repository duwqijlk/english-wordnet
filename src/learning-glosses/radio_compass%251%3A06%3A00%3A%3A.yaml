simpleMeaning: a tool that works out which way to go, by finding where incoming signals come from
scope: A tool that finds the way from incoming signals, not a needle that points north and not a map that
  shows the land.
examples:
- The pilot checked the radio compass to find the way back to land.
- Our radio compass showed that the signal came from the north.
