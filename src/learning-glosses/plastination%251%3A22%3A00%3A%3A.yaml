simpleMeaning: A way of preserving body tissue by fixing it, removing its water and fats, forcing in a
  hardenable plastic such as silicone, epoxy or polyester, then letting that set.
scope: This is the preservation technique that fills tissue with setting plastic, not ordinary fluid embalming
  and not simple drying.
examples:
- The anatomy lab relies on plastination to keep specimens for years.
- After plastination the heart was dry, odorless and safe to handle.
