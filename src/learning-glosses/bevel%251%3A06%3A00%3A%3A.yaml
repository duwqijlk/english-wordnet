simpleMeaning: A hand tool of two straight edges joined by a hinge, for drawing or measuring angles of
  any size.
scope: Also called a bevel square, a hand tool of two straight edges joined by a hinge, for drawing or
  measuring angles of any size, not two flat faces meeting at a slant and not the act of cutting such
  a slant.
examples:
- He set the bevel to the angle he needed and marked the wood.
- The bevel lay in the toolbox beside the square.
