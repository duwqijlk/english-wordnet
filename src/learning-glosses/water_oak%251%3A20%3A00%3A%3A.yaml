simpleMeaning: people often plant this fairly tall oak for shade in wet soil in the south-east of the
  United States; it sheds its leaves in winter and grows well
scope: Also called possum oak; a fairly tall oak of the south-east United States, grown for shade and
  at home in wet soil, not a live oak.
examples:
- A water oak shaded the yard, its leaves gone by midwinter.
- The water oak grew fast in the wet soil near the creek.
