simpleMeaning: To make money from a business deal or from paid work you do.
scope: This is receiving income as wages or profit, not converting goods or property into cash and not
  coming to understand something.
examples:
- The company realized a profit of two million dollars on the deal.
- He realized a modest income by renting out the spare flat.
