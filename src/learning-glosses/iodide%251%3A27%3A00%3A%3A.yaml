simpleMeaning: A chemical made from hydriodic acid, an acid with iodine in it, either as a salt or as
  a compound of that acid
scope: A chemical made from hydriodic acid, either as a salt or as a compound of that acid; not the acid
  itself and not a salt of a different acid.
examples:
- The doctor gave her potassium iodide for her thyroid.
- An iodide can form when hydriodic acid meets a metal.
