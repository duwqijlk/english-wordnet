simpleMeaning: someone who feels love or desire for people of the other sex
scope: Also called straight, heterosexual or heterosexual person, it is someone drawn to people of the
  other sex, not someone drawn to people of the same sex.
examples:
- He is a straight person who dates women.
- She described herself as a straight person.
