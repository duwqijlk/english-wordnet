simpleMeaning: Full of high worth and fine bearing, seen in the way a person or thing stands or moves
scope: A show of great dignity and nobility in bearing, not kind attention paid to women; also called
  proud and majestic.
examples:
- The gallant pageant filled the square.
- The gallant ships sailed into the harbour.
