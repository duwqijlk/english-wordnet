simpleMeaning: Without a person knowing, their private facts are taken — a name, a state number, a card
  number, or a travel paper — and used to cheat.
scope: It is the taking of a person's private facts, without that person knowing, and their use to cheat.
examples:
- After the identity theft, she found new cards opened in her name.
- Identity theft left him with bills for things he never bought.
