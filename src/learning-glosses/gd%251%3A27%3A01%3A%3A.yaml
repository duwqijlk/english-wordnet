simpleMeaning: A nerve poison that passes easily into the body and kills by stopping a body chemical that
  lets nerves work; breathing it in is highly deadly.
scope: Also called soman; a nerve poison that passes easily into the body and kills by stopping a body
  chemical, deadly when breathed in.
examples:
- GD passes easily into the body and kills by stopping a body chemical.
- Breathing in GD is highly deadly.
