simpleMeaning: An extra good thing that comes with some kinds of work, especially one the worker counts
  as a right of the job.
scope: An extra good thing that comes with some kinds of work, not the pay itself and not a gift given
  once.
examples:
- Free meals are a perk of the job.
- A company car is one of the perks of her post.
