simpleMeaning: to turn a grid of numbers into one with zeros everywhere except on the corner-to-corner
  line
scope: To turn a grid of numbers into one with zeros everywhere except on the corner-to-corner line, also
  called diagonalize; not to work with a grid that already has that form and not to turn a grid on its
  side.
examples:
- The teacher showed how to diagonalise the matrix in three steps.
- We diagonalise the matrix before we work out its values.
