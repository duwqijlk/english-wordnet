simpleMeaning: Corn or sorghum plants can have their grain tops attacked by a fungus that makes a covered
  growth on them.
scope: The fungus that attacks the grain tops of corn or sorghum plants and makes a covered growth on
  them is called head smut.
examples:
- Head smut covered the tops of the corn.
- The farmer found head smut on the sorghum.
