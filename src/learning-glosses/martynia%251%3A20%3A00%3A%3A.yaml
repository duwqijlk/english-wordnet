simpleMeaning: A low-spreading herb, either one-year or long-lived, native to Central America and the
  West Indies, with bell-shaped blooms in cream through red-purple and odd horned fruit.
scope: A spreading herb of Central America and the West Indies, notable for its unusual horned pods; not
  the devil's claw, a separate North American plant with a long curved beak on its fruit.
examples:
- Martynia's bell-shaped flowers shade from creamy white to red-purple.
- Martynia sprawls across the ground rather than growing upright.
