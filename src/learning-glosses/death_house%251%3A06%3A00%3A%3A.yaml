simpleMeaning: a block of cells in a prison that holds people who are to be killed by the state until
  the day it happens
scope: This is a prison block for people waiting to be put to death, also called death row; not an ordinary
  prison wing and not a court room.
examples:
- He spent his last weeks in the death house.
- The death house was a separate block at the back of the prison.
