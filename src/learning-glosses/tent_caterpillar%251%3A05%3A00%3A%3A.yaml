simpleMeaning: In shared webs of silk in fruit trees and trees grown for shade live the young of winged
  insects, which build the webs together.
scope: These are the young that live in shared webs of silk, not the winged insects they grow into.
examples:
- A web in the fruit tree was spun by tent caterpillars.
- The tent caterpillar lives with others in a web of silk.
