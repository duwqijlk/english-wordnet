simpleMeaning: A pine tree of middle to large size from the north of Europe and Asia, with needles in
  pairs and bark that peels in red-brown flakes.
scope: 'Also called Pinus sylvestris, Scotch pine, or Scots pine: a pine of the north of Europe and Asia
  with needles in pairs and bark that peels in red-brown flakes, not a small pine and not a pine with
  needles in threes.'
examples:
- Scotch fir grows across the north of Europe and Asia.
- The bark of the Scotch fir peels in red-brown flakes.
