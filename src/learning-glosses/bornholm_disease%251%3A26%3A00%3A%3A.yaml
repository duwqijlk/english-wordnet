simpleMeaning: A sudden sickness that spreads among many people at once, with bursts of pain, most often
  in the chest.
scope: It is a sudden sickness that spreads from person to person, also called diaphragmatic pleurisy,
  epidemic myalgia, epidemic pleurodynia and myosis, known by bursts of pain, most often in the chest.
examples:
- Bornholm disease gave him sharp pains in his chest.
- The whole village caught Bornholm disease that summer.
