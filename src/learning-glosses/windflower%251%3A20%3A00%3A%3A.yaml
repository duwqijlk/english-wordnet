simpleMeaning: Any plant of the woods, of the Anemone group, grown for its fine flowers and rings of cut
  leaves
scope: Any plant of the woods, of the Anemone group, grown for its fine flowers; anemone is another name
  for this sense, and it is not a low daisy or a garden rose.
examples:
- Windflower bloomed in the wood.
- The windflower leaves were cut fine.
