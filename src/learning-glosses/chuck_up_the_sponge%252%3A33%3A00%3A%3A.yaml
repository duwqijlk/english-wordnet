simpleMeaning: to stop trying when you have lost or have no hope left, and to say you have lost
scope: To stop trying when you have lost or have no hope left, and to say you have lost; drop by the wayside,
  drop out, fall by the wayside, give up and quit are other names for this sense, not just taking a short
  rest and not winning.
examples:
- After the third fall, he decided to chuck up the sponge.
- She refused to chuck up the sponge even when the game was lost.
