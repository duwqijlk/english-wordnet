synsetId: 08640338-n
simpleMeaning: In astronomy, the place of a planet, shown by the angle between it and perihelion (its
  nearest point to the sun), as seen from the sun
scope: In astronomy, this is a planet's place measured as an angle. It is not the general sense of something
  strange or different from what is usual.
examples:
- The anomaly of Mars was measured from the sun at that date.
- The astronomer worked out the planet's anomaly to find where it was in its path around the sun.
