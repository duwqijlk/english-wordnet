simpleMeaning: A sea animal on a stalk that sticks to the bottoms of ships or to floating wood
scope: A sea animal on a stalk that sticks to ship bottoms or floating wood; also called gooseneck barnacle,
  not a mussel and not a crab.
examples:
- Goose barnacle covered the bottom of the old boat.
- The goose barnacle stuck to the floating timber.
