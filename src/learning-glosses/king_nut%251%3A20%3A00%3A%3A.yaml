simpleMeaning: In the eastern United States grows a tree much like the shagbark, a hickory whose hard
  seed is much bigger
scope: A hickory tree of the eastern United States, also called big shagbark, big shellbark, big shellbark
  hickory and king nut hickory; not the shagbark itself, whose seed is smaller.
examples:
- The king nut tree bears much larger nuts than the shagbark.
- King nuts from the eastern United States are prized for their size.
