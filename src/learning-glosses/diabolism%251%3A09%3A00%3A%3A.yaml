simpleMeaning: giving devils great honour, most of all Satan, and believing that devils are real
scope: Believing devils are real and giving them great honour, also called demonism; not the worship of
  devils in acts and rites and not a fear of devils.
examples:
- The old man's diabolism led him to keep a small shrine for Satan.
- Her diabolism meant she believed devils were real and honoured them above all.
