simpleMeaning: A big leaf-shedding oak of the east United States, with flaky bark and leaves less lobed
  than other white oaks, giving heavy strong building wood, keen on wet ground.
scope: This sense is also called swamp white oak, unlike the sense for an Australian leafless shrub like
  broom with small yellow flowers.
examples:
- A swamp oak grew in wet ground.
- Swamp oaks give strong wood.
