simpleMeaning: A small eastern Mediterranean tree, widely grown in mild regions, bears masses of purplish-red
  flowers straight from old stems before its leaves; wood is valued for veneers (thin surface layers).
scope: Another name for the Judas tree, the small Mediterranean ornamental grown for its early purplish-red
  bloom and veneer wood, not a tree grown mainly for fruit.
examples:
- The love tree bears purplish-red flowers on old stems before its leaves.
- The love tree's wood is valued for veneers.
