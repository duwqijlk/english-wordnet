simpleMeaning: Living in the warm waters of the western Pacific and of Puerto Rico, this fish has a part
  under its eye that gives off light
scope: This is also called a flashlight fish, and it makes light only with the part under its eye, not
  with its whole body.
examples:
- The anomalops showed its light from the part under its eye.
- In the warm waters of the western Pacific, an anomalops gave off light from under its eye.
