simpleMeaning: So the two halves of an animal's head can no longer send word to each other, doctors cut
  the band joining them, and at times the eye-nerve crossing.
scope: A way of cutting the link between the two halves of the head in animals, not in people.
examples:
- In the split-brain technique, doctors cut the band that joins the two halves of the animal's head.
- They used the split-brain technique on animals to cut the link between the two halves of the head.
