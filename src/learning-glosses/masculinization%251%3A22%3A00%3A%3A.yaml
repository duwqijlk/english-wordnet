simpleMeaning: Male body marks that a woman should not have grow most often after hormone cures or when
  the glands above the kidneys fail to work as they should.
scope: Also called masculinisation, virilisation, and virilization, it is the growth in a woman of male
  body marks she should not have, most often after hormone cures or when the glands above the kidneys
  fail.
examples:
- Masculinization left the woman with male body marks she had not had before.
- After the hormone cures, masculinization began to show.
