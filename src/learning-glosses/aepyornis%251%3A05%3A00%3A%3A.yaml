simpleMeaning: A very large bird of Madagascar, up to nine feet tall, that could not fly and is now gone.
scope: A very large flightless bird of Madagascar, now gone, also called an elephant bird; not a living
  flightless bird and not a flying bird.
examples:
- The aepyornis stood nine feet tall.
- Bones of the aepyornis are found in Madagascar.
