senseId: 'embroidery%1:10:00::'
synsetId: 07187630-n
simpleMeaning: Adding extra details to an explanation or a telling of something, only to make it more
  pleasing; the extra details are sometimes not true
scope: Another name for this sense is embellishment. It is adding extra details to a story or explanation,
  not sewing patterns on cloth with thread.
examples:
- His later telling added embroidery to the simple facts of the night.
- She told the story with a lot of embroidery, adding details that were not true.
