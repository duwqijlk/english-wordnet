simpleMeaning: A sandwich of a long roll cut open lengthwise, stuffed with meats and cheese, with tomato,
  onion, and lettuce, and sauces, called other names elsewhere in the land.
scope: This sense is also called hero, wedge, submarine, sub, bomber, grinder, torpedo, hero sandwich,
  hoagie, hoagy, poor boy, and zep, a big sandwich made from a long crusty roll cut down its length and
  filled with meat and cheese, tomato, onion, lettuce, and sauces, with different names in different parts
  of the United States.
examples:
- A submarine sandwich filled us up.
- Submarine sandwiches come with lettuce.
