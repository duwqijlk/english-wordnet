simpleMeaning: the use of mind tactics to break the other side's will to fight
scope: 'Also called psychological warfare: a fight fought with pressure on the mind to break the other
  side''s will, not a fight with guns and not a contest of strength.'
examples:
- The two sides fought a war of nerves for weeks before the talks began.
- A war of nerves wore down the other team's will to keep going.
