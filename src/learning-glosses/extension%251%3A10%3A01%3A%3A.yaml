senseId: 'extension%1:10:01::'
synsetId: 06263648-n
simpleMeaning: A belief or way of doing things moving into new places where it was not known before
scope: A belief or way of doing things spreading into new places, not a plan made to reach more people,
  not extra time agreed for a payment, and not a new part added to a building.
examples:
- The extension of the new faith across the valley took many years.
- The extension of the farming practice into the hills changed how people worked.
