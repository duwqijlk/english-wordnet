simpleMeaning: Very fine grains that were once shaken out of a small pot with holes.
scope: Very fine grains that were once shaken out of a small pot with holes, also called castor sugar;
  not coarse grains, and not grains shaken from a bag.
examples:
- Caster sugar dissolves fast in tea.
- She dusted caster sugar over the cake.
