  of things, events, or ideas, not a line of wagons or animals in single file, not a chain of consequences
  from an event, not a gown's trailing back panel, not a set of connected gears, not producing something
  by instruction and teaching, not the learner's own course of preparation, not shaping a child's or animal's
  behaviour, not preparing someone for a career, not refining taste or judgment, not aiming a weapon or
  camera, not a coach instructing and supervising people, not one's own athletic exercise for a competition,
  not pruning a plant into a shape, and not dragging something along the ground.
examples:
- We trained from Paris to Berlin overnight.
- She trained to the coast every Friday to visit her mother.
