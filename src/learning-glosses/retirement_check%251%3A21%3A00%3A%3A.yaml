simpleMeaning: A sum of money sent each month to a person who has stopped working for good.
scope: This is a sum sent each month to a person who has stopped work, not money put by while still working;
  it is also called retirement benefit, retirement fund, and retirement pension.
examples:
- Her retirement check comes in the post each month.
- He waited for his retirement check to pay the rent.
