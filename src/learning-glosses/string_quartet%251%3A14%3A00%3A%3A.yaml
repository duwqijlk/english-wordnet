simpleMeaning: a group of four players who play bowed instruments, with two violins, a viola and a cello
scope: 'Also called a string quartette: a group of four players with two violins, a viola and a cello,
  not a group of four singers and not a piece for a piano.'
examples:
- The string quartet played at the wedding.
- Our town has a string quartet that meets every week.
