simpleMeaning: used for a person, or for what a person does, who is able or ready to cause pain or suffering
  to others
scope: Also called fell, cruel, savage and vicious. This sense is about a person or an act ready to cause
  pain, not the sense about being like a wild animal with no human feeling.
examples:
- The brutal guard beat the prisoners again and again.
- It was a brutal attack that left two men badly hurt.
