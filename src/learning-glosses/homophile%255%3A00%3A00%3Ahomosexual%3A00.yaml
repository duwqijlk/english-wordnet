simpleMeaning: A feeling of desire for people of your own sex, or a thing that brings on that feeling
scope: This word is used for a feeling of desire for people of your own sex, or for something that brings
  on that feeling, not for the person who feels it; also called gay and queer.
examples:
- The homophile feelings he had were hard for him to talk about.
- She wrote about homophile love in her poems.
