simpleMeaning: Newspaper and television reporters ask questions of a famous person or a politician at
  this meeting
scope: 'Another name for a news conference: a meeting where newspaper and television reporters ask questions
  of a famous person or a politician; not a private interview and not a speech with no questions.'
examples:
- The mayor called a press conference to answer questions about the budget.
- At the press conference, reporters asked the actor about her new film.
