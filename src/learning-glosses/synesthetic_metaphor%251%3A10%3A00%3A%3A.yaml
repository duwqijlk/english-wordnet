senseId: 'synesthetic_metaphor%1:10:00::'
synsetId: 07122207-n
simpleMeaning: a figure of speech that links a likeness between what is felt through different senses
scope: A figure of speech that links what is felt through different senses; not a plain comparison within
  one sense and not a literal description.
examples:
- Calling a voice 'warm' is a synesthetic metaphor.
- The poet's synesthetic metaphor joined the sound of the bell to its bright colour.
