simpleMeaning: feeling heavenly joy, or giving that joy to others
scope: Feeling or giving heavenly joy. Not the sense of being very kind and good, like a saint or an angel.
examples:
- She wore a beatific smile as she heard the good news.
- He spoke in a beatific voice that gave peace and joy to everyone in the room.
