simpleMeaning: of a part of a person's character or a state they are in, not helping them deal well with
  life around them
scope: A trait or condition that does not help a person deal with life around them. Not the sense about
  a body system or part that is not working as it should.
examples:
- His dysfunctional habit of avoiding all change made work harder.
- A dysfunctional way of dealing with stress can harm health and work.
