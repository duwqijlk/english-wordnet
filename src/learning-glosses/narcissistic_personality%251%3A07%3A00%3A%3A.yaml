simpleMeaning: A way of being marked by love of oneself and deep interest in oneself alone, with too high
  a view of one's own gifts and little care for others.
scope: A way of being marked by love of oneself and deep interest in oneself alone, with too high a view
  of one's own gifts and little care for others; not healthy self-respect and not simple pride in one's
  work.
examples:
- His narcissistic personality made every talk about himself.
- Her narcissistic personality left little room for other people's feelings.
