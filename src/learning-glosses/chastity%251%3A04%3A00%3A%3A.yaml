scope: 'Another name for celibacy: not having sex, for example because of a promise made as part of a
  religion. Not the sense about right and wrong in sex, such as staying faithful to one husband or wife.'
examples:
- The nuns take a vow of chastity and do not have sex.
- His chastity came from a promise he made as part of his religion.
