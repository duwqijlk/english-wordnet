senseId: 'absentmindedly%4:02:00::'
synsetId: 00066590-r
simpleMeaning: in a way that shows your mind is on other things, so you do not notice what you are doing
scope: This is a way of doing something, also called absently and abstractedly; it is not careful or planned,
  because your mind is on other things.
examples:
- He nodded absentmindedly while he thought about his work.
- She absentmindedly put the keys in the wrong pocket.
