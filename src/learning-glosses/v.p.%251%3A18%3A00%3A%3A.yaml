simpleMeaning: A high officer just under the president, who can stand in for the president when needed.
scope: Also called vice president, this is a high officer just under the president, not the president
  and not a lower officer.
examples:
- The V.P. of the firm spoke at the meeting.
- When the president was away, the V.P. took the president's place.
