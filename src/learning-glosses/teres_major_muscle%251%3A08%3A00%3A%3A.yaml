simpleMeaning: a band of flesh that moves the arm and turns it in toward the middle of the body
scope: 'Another name for teres major and musculus teres major: a band of flesh that turns the arm in,
  not the teres minor muscle, which turns it out.'
examples:
- The teres major muscle helps turn the arm in when you reach behind your back.
- He felt the teres major muscle pull as he turned his arm inward.
