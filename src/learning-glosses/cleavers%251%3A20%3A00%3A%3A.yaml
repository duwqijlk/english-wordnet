simpleMeaning: a plant that lives for one year, with small curved sharp points all along its stem, found
  in North America, Europe and Asia
scope: Also called catchweed, clivers, goose grass, and spring cleavers. This is the prickly plant itself,
  not a cutting tool with a similar name.
examples:
- Cleavers grew along the edge of the field.
- The cleavers stuck to his socks as he walked through them.
