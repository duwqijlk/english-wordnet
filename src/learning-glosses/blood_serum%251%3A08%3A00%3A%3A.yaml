simpleMeaning: When the red liquid in the body thickens into a lump, an amber liquid like water, full
  of protein, comes away from it.
scope: Also called serum, this is the amber liquid, like water and full of protein, that comes away when
  the red liquid in the body thickens into a lump.
examples:
- The blood serum was drawn off and kept in a small bottle.
- The blood serum from the sample was tested in the lab.
