simpleMeaning: In maths, a number that stands for an amount taken to have a value that does not change
  in a given problem
scope: A number with a set value in maths; not a person who does not change in love or purpose, and not
  something that goes on without a break.
examples:
- The speed of light is a constant used in this problem.
- In this sum, 2 is a constant and x can change.
