simpleMeaning: an instrument for music with strings stretched over a flat board that makes the sound stronger;
  you lay it flat and play it with a flat pick and your fingers
scope: 'Also called cither and zithern: a flat string instrument you lay down to play, not a guitar that
  you hold up to play.'
examples:
- He played a song on the zither at the party.
- The zither lay flat on the table while she played it.
