simpleMeaning: Either one of two hues that, mixed together, make white in lights or grey in paints
scope: Either one of two hues that make white or grey when mixed, also called complementary, not two hues
  that look alike and not a single hue on its own.
examples:
- Yellow and blue are complementary colors.
- Red and green are complementary colors that make grey in paint.
