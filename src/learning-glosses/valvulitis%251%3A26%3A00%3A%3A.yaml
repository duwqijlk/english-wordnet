simpleMeaning: A valve in the body, above all a heart valve after rheumatic fever, is sore and swollen.
scope: This is a state in which a valve in the body is sore and swollen, above all a heart valve after
  rheumatic fever.
examples:
- The valvulitis left the heart valve sore and swollen.
- After the rheumatic fever, valvulitis set in.
