simpleMeaning: One of a group of germs that can give animals with backbones illnesses that make spots
  on the skin
scope: This is a germ that gives spotty skin illnesses to animals with backbones, not a germ that causes
  other kinds of illness.
examples:
- Scientists found a poxvirus in the sick birds.
- The poxvirus spread quickly through the herd of cattle.
