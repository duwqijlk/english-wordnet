simpleMeaning: so bad that it brings or deserves strong blame
scope: This is a wrong act or thing that brings or deserves strong blame; criminal, deplorable, reprehensible
  and vicious are other names for this sense, and it is not a small fault.
examples:
- His condemnable waste of talent shocked the whole team.
- The condemnable act of violence drew strong blame from everyone.
