simpleMeaning: Used for speech sounds such as 'f', 's', 'z' and 'th' in 'thin' and 'then', which you make
  by pushing air through a narrow place
scope: Also called sibilant, continuant, fricative and spirant, this is about how speech sounds are made,
  not about a voice that is loud and harsh or loud in an angry way.
examples:
- The 's' in 'sun' is a strident sound.
- In 'thin', the first sound is strident because air is pushed through a narrow gap.
