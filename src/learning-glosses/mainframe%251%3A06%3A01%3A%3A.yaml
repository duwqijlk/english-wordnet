simpleMeaning: a large digital computer used by 100 to 400 people, that fills a special room where the
  air is kept cool
scope: This is a whole large computer used by many people at once, not the central part inside a computer
  that does most of its work.
examples:
- The bank kept all its records on a mainframe.
- Three hundred workers used the mainframe at the same time.
