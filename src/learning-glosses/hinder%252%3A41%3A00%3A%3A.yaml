senseId: 'hinder%2:41:00::'
synsetId: 02563025-v
simpleMeaning: Get in the way of something so it moves slowly or cannot be done at all.
scope: To slow or stop something from being done; not to forbid it by law, and not to fail at it yourself.
examples:
- His brother hindered him at every turn.
- Bad weather hindered the rescue work.
