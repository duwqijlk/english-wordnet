simpleMeaning: A device on a ship that uses radio waves to find other ships and planes at sea
scope: A radio-wave device on a ship for finding other ships, not a device on land and not a weapon.
examples:
- The naval radar picked up a ship in the fog.
- The crew watched the naval radar through the night.
