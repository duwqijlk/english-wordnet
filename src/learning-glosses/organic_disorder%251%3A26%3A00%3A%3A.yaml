simpleMeaning: A health problem caused by a change in how a body part works or how it is built, a change
  that can be found
scope: A body illness with a change in a body part that can be found, not a change of living things over
  time and not a theory about how life works.
examples:
- The doctor said the organic disorder came from damage to the organ.
- An organic disorder can be traced to a change in the body.
