synsetId: 03395173-n
simpleMeaning: Only a tenth to a fifth of this bomb blows up; the rest is a shell that breaks into many
  fast bits, and it works best against soldiers and vehicles
scope: Also called an anti-personnel bomb, an antipersonnel bomb, or a fragmentation bomb; its harm comes
  from flying bits, not from a large blast.
examples:
- The daisy cutter burst over the road and sent bits flying in all directions.
- Troops feared the daisy cutter more than any other bomb in the field.
