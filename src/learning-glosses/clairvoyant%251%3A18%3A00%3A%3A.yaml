schema: oewn-learning-gloss-v2
senseId: 'clairvoyant%1:18:00::'
synsetId: 09945411-n
simpleMeaning: a person who is said to be able to see or know things that other people cannot see or know,
  such as things far away or in the future
scope: This is a person who is said to have this power, not the power itself and not a person who only
  makes a good guess.
examples:
- The king asked a clairvoyant what would happen in the war.
- She went to a clairvoyant to ask about her future.
