simpleMeaning: change direction while seeming to swing around a fixed point.
scope: Another name is wheel around; this means changing direction in place, not moving along on wheels
  and not transporting a person or thing.
examples:
- The horse wheeled and galloped back the way it had come.
- She wheeled around when she heard her name.
