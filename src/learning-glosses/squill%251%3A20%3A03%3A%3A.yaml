simpleMeaning: the bulb of a sea plant, cut into thin pieces, dried, and used as a drug that helps clear
  phlegm from the chest
scope: The bulb of a sea plant used as a drug to clear phlegm, not the plant itself and not a flower bulb
  for the garden.
examples:
- The chemist sliced the squill and left it to dry.
- Squill was once used to help clear a bad cough.
