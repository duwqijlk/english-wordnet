simpleMeaning: To write a tune-part for.
scope: This sense is also called harmonize, for writing a tune-part for, unlike the sense for to bring
  into tune, concord, or accord while making music or singing, unlike the sense for to set things in tune,
  or tie them in tune, and unlike the sense for to sing or play in tune.
examples:
- They harmonise the song, writing a tune-part for it.
- They harmonise hymns.
