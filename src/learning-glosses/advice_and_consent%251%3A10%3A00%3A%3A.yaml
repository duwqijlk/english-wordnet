simpleMeaning: The Senate can hold back the President's naming of people to posts and making of treaties,
  under a phrase in the United States Constitution.
scope: This gives the Senate a say over the President's naming of people to posts and making of treaties,
  not a free hand for the President to choose alone.
examples:
- Advice and consent gave the Senate a say in the treaty.
- The nomination needed advice and consent before it could go ahead.
