simpleMeaning: Always joined with reduction, its opposite change, this is the change when a chemical takes
  in oxygen and gives up its tiny charged bits.
scope: 'Also called oxidation and oxidisation: a chemical takes in oxygen and gives up its tiny charged
  bits, and reduction, the opposite change, always comes with it.'
examples:
- In the lab, they timed the oxidization of the sample.
- They wrote down the oxidization of the copper in their notes.
