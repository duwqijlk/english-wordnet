simpleMeaning: Iron not handled right in the body can show as a brown grainy substance made of iron oxide,
  left when the red part of blood breaks down
scope: Also called haemosiderin, this is a brown substance left in the body, not the red part of blood
  itself.
examples:
- Hemosiderin can be a sign that iron is not being handled right.
- The doctor found hemosiderin left from the breakdown of blood.
