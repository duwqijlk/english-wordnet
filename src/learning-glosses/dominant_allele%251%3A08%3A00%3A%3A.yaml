simpleMeaning: A gene form that shows the same outward effect whether the form paired with it matches
  or not
scope: A gene form that shows the same outward effect whether its pair matches or not; dominant is another
  name for it, not a gene form whose effect hides when paired.
examples:
- The dominant allele for brown eyes showed in the child.
- A dominant allele needs only one copy to show its effect.
