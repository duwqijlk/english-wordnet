simpleMeaning: Tiny creatures that dig into plants and leave reddish-brown marks on leaves or fruit; there
  are a few kinds of them.
scope: A tiny creature that digs into plants and marks the leaves, not a bug that eats leaves and not
  a mould on the leaves.
examples:
- Rust mites left brown marks on the orange leaves.
- The rust mite burrows into the fruit and spoils it.
