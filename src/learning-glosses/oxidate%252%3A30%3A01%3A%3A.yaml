simpleMeaning: To join with oxygen, or to turn into a chemical made of oxygen and something else
scope: 'Also called oxidise: to join with oxygen or turn into an oxide, not to lose oxygen and not to
  stay the same.'
examples:
- The metal will oxidate if it is left in damp air.
- When iron oxidates, it joins with oxygen and turns to rust.
