simpleMeaning: A long round tub that can be taken off holds the dust that a machine sucking up dust has
  spun out of the air.
scope: 'Also called cyclonic cleaner and cyclonic vacuum cleaner: a machine that sucks up dust and spins
  it into a tub, not one that keeps the dust in a bag.'
examples:
- The cyclonic vacuum has no bag; the dust spins into a tub.
- He emptied the tub of the cyclonic vacuum.
