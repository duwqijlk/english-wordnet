simpleMeaning: a fairly narrow strip of land that sticks out from a larger area
scope: A strip of land that sticks out from a larger area; it is a shape of land, not a handle of a pan
  and not asking for money in the street.
examples:
- The town lies in the panhandle of the state, a narrow strip in the north.
- Wheeling is in the northern panhandle of West Virginia.
