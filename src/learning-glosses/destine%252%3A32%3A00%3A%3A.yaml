simpleMeaning: To order or choose beforehand what will happen to a person or a thing.
scope: This is settling in advance what will happen to someone, also called fate, doom, or designate,
  not the sense of meaning a thing for a set end.
examples:
- She was destined to become a great pianist.
- He felt destined to lead the team one day.
