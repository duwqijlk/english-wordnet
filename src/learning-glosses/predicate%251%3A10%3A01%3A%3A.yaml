schema: oewn-learning-gloss-v2
senseId: 'predicate%1:10:01::'
synsetId: 06327806-n
simpleMeaning: 'In logic, the part of a claim that says something about its subject: the second half of
  the claim, tied to the first half by a linking word.'
scope: In logic, what is said of the subject of a proposition, the second term joined to the first by
  the copula, not the part of a sentence that holds the verb and its complements, and not the verb senses
  of declaring or involving.
examples:
- In 'Socrates is a man', the predicate is 'is a man'.
- In the claim 'Socrates is a man', manhood is the predicate.
