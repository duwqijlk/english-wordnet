simpleMeaning: One of 40 men who serve the British king or queen on grand public days.
scope: This is one of 40 men who serve the British king or queen on grand public days, not a soldier who
  guards the doors and not a servant who brings food.
examples:
- He served as a gentleman-at-arms at the coronation.
- The gentlemen-at-arms stood by the throne.
