simpleMeaning: a lung disease in which the inner tissue of the lungs, not the air tubes, swells and fills
  with fluid because of germs or things that irritate the lungs
scope: A disease in which the inner tissue of the lungs swells, not a cold and not a disease of the air
  tubes.
examples:
- He was in hospital with pneumonia for two weeks.
- The doctor said the pneumonia had spread to both lungs.
