simpleMeaning: How bad or severe something is judged to be, as when a burn is mild or a crime is minor.
scope: This is the noun for how severe something is, not a position on a general scale of intensity, amount
  or quality, not a stage in a process or series, not a university award, not a measure of angles or arcs,
  not the highest power of a mathematical term, and not a unit of temperature.
examples:
- The charge was murder in the first degree.
- He suffered second-degree burns on both hands.
