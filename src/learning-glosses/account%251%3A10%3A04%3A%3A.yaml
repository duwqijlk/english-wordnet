simpleMeaning: a description that explains how something is built, how it works, or the conditions around
  it, so that it can be understood
scope: This is a description that explains how something is built, works or came about, not a bill of
  charges or a defence of someone's conduct.
examples:
- Her account of the accident matched what the witnesses saw.
- The manual gives a clear account of how the pump works.
