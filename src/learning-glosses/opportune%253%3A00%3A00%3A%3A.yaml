simpleMeaning: fitting well, or coming at a good time that helps, especially for a certain purpose
scope: This means right for the time and purpose, not just good at any time. It does not mean using a
  chance in an unfair way to help yourself.
examples:
- We chose an opportune moment to ask her for help.
- His arrival was opportune, just as we needed another driver.
