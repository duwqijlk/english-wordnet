senseId: 'fraud_in_the_inducement%1:04:00::'
synsetId: 00780306-n
simpleMeaning: cheating done on purpose to get a person to sign a legal paper, make a deal, or give a
  court decision, as by leading them wrong about the true facts
scope: Cheating on purpose that gets a person to sign a paper, make a deal or give a court decision, not
  just lying and not a forged signature.
examples:
- The seller's fraud in the inducement made her sign a paper she did not understand.
- His claim of fraud in the inducement rested on the lies told about the true facts.
