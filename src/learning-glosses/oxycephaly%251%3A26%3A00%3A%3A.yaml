simpleMeaning: a birth defect of the skull in which the top of the head grows into a pointed cone shape
scope: A birth defect in which the top of the skull grows into a pointed cone shape; acrocephaly is another
  name for this sense, and it is not a normal skull shape or an injury to the head.
examples:
- Oxycephaly is present from birth and changes the shape of the skull.
- The baby's oxycephaly made the top of the head pointed.
