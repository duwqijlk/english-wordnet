simpleMeaning: a coat that keeps out rain, made from cotton cloth that has been treated with oil and colour
  to stop water getting through
scope: Also called slicker, this is a coat made from cotton cloth treated with oil to keep rain out, not
  a plain coat with no such treatment.
examples:
- He wore an oilskin over his clothes while he worked on the boat in the rain.
- Her yellow oilskin kept her dry all through the storm.
