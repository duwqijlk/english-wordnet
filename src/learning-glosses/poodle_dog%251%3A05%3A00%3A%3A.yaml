simpleMeaning: Its thick curly coat of one colour is usually cut short; this clever animal is an old kind,
  at times taught to hunt or to do tricks.
scope: 'Also called poodle: a clever dog with a thick curly coat of one colour, usually clipped.'
examples:
- The poodle dog stood still while its curly coat was clipped.
- Our poodle dog learned to fetch on command.
