simpleMeaning: A horse-racing title for a horse that wins the Kentucky Derby, the Belmont Stakes, and
  the Preakness
scope: In horse racing, a title for a horse that wins the Kentucky Derby, the Belmont Stakes, and the
  Preakness; not the baseball honour of the same name and not a prize for one race alone.
examples:
- The colt won the triple crown with wins in all three races.
- Only a few horses have ever taken the triple crown.
