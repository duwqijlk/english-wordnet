senseId: 'deathly%4:02:00::'
synsetId: 00256007-r
simpleMeaning: to a degree that looks or feels almost like death itself
scope: How close something comes to seeming dead, not something that causes death, and not a body that
  looks dead.
examples:
- He was deathly pale after the accident.
- Her face went deathly white when she heard the news.
