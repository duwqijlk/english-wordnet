synsetId: 00474253-v
simpleMeaning: to take out things that are not wanted or not needed
scope: 'Also called cut, prune, and rationalise: to take out unwanted things. Not to think in a clear
  way with reasons, and not to give reasons to defend something.'
examples:
- The shop rationalized its range, taking out goods that no one wanted to buy.
- We rationalized our files and threw away the copies we did not need.
