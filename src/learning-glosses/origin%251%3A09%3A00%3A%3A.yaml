simpleMeaning: In maths, the point where the lines used for measuring position cross, and where every
  value is zero
scope: This is the zero point where the lines on a graph cross, not the place or cause where something
  starts and not a person's family past.
examples:
- On this graph, the origin is in the middle where the two lines cross.
- Start counting from the origin, where both numbers are zero.
