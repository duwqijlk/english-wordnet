simpleMeaning: In law, a tiny sum, often one dollar, paid to show that a legal wrong was done, as when
  a deal is broken only in a small technical way
scope: In law, a tiny sum paid to show a legal wrong was done; not full payment for a loss and not a fine.
examples:
- The court gave her nominal damages of one dollar for the broken promise.
- Nominal damages showed the firm had broken the deal, though the loss was small.
