simpleMeaning: To make a thing darker, so it is hard to see.
scope: To make a thing darker, so it is hard to see, not to shut a person off in social, intellectual,
  or moral darkness.
examples:
- Clouds benighted the valley before the storm.
- The thick smoke benighted the road, and drivers slowed down.
