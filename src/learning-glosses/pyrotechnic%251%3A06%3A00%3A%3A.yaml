simpleMeaning: A device holding stuff that blows up and burns slowly with coloured flames, used to light
  up places, send signals, or the like, usually in the plural.
scope: Also called a firework, it is a device that burns slowly with coloured flames, not the adjective
  for the craft of making fireworks.
examples:
- Pyrotechnics lit up the sky above the harbour.
- The crew set off a pyrotechnic to signal the start of the show.
