simpleMeaning: In the tough cover round the brain, on the bones at the side and back of the head, runs
  a blood tube bent like the letter S.
scope: Doctors also call it sinus sigmoideus, and it is one of the blood tubes that run through the tough
  cover round the brain.
examples:
- The sigmoid sinus runs along the bones at the side and back of the head.
- Blood passes through the sigmoid sinus on its way out of the head.
