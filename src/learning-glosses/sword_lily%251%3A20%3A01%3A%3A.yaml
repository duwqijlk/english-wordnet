simpleMeaning: Plants with leaves like sword blades and upright stalks carrying bright flowers of three
  petals, with three sepals hanging down.
scope: Also called flag, iris, and fleur-de-lis, this is a plant with leaves like sword blades and upright
  stalks carrying bright flowers of three petals, with three sepals hanging down, where flag is a plant
  with long, pointed, sword-like leaves, upright stems and bright flowers of three petals, with three
  sepals hanging down, iris is a plant with leaves like swords and upright stems, its bright flowers holding
  three petals, with sepals, three, drooping down, and fleur-de-lis is a plant with sword-shaped leaves
  and upright stems carrying bright flowers, each of three petals, with sepals, three, hanging down.
examples:
- The sword lily blooms in spring.
- Sword lily flowers have three petals.
