senseId: 'radius%1:15:00::'
synsetId: 08646153-n
simpleMeaning: a round area around a centre point, whose size is shown by the distance from the centre
  to its edge
scope: This sense is the round area around a point, not the straight line from the centre to the edge
  and not the bone in the lower arm.
examples:
- The shop delivers to homes within a radius of five miles.
- Police searched the area within a radius of two miles from the station.
