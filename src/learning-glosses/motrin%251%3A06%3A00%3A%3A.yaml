simpleMeaning: A drug, not a steroid, that eases swelling and pain and brings down fever, used for the
  pain of arthritis; sold as Advil and Nuprin.
scope: This is a pain drug, not a cure for arthritis; also called ibuprofen, isobutylphenyl propionic
  acid, Advil and Nuprin.
examples:
- Motrin eases the pain of arthritis.
- She took Motrin to bring down her fever.
