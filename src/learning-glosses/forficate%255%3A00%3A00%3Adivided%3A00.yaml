simpleMeaning: Shaped like a fork, split into two parts that branch off from one point.
scope: Shaped like a fork, split into two parts; forked, branched, pronged, bifurcate, biramous and fork-like
  are other names for this sense, not a thing with one point and not a thing split into three or more
  parts.
examples:
- The forficate tail of the fish split into two clear points.
- A forficate branch grew out from the main stem of the plant.
