simpleMeaning: a share of a whole, usually counted as a number out of a hundred, such as ten percent
scope: 'Also called percent: a share of a whole counted out of a hundred, not a share of something owned
  by a person or group.'
examples:
- What percentage of the class passed the test?
- A large percentage of the town voted in the election.
