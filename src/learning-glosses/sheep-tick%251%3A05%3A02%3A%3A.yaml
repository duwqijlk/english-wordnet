senseId: 'sheep-tick%1:05:02::'
synsetId: 01780858-n
simpleMeaning: A tick whose bites can give sheep a brain disease and people Lyme disease; it lives as
  a parasite on sheep, cattle and humans.
scope: A parasitic tick of sheep, cattle and people that spreads louping ill and Lyme disease; not the
  wingless fly also called a sheep-tick, which is an insect.
examples:
- Walkers in the hills should check themselves for sheep-ticks.
- The sheep-tick can pass louping ill to a flock.
