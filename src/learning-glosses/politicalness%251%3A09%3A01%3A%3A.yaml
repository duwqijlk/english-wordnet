simpleMeaning: The state of having to do with running a country and the work of governing it
scope: This is the quality of being about running a country and governing; not a single organized unit
  of government, and not a way of speaking that avoids offence.
examples:
- The politicalness of the topic surprised the class.
- They argued about the politicalness of the new law.
