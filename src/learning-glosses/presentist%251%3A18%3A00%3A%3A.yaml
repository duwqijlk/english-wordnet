simpleMeaning: The Bible's words about the last days are coming true now, says a person who studies God
  and holds this view.
scope: This names the person who holds the belief, not the belief itself, and the belief is that the Bible's
  words about the last days are coming true now.
examples:
- The presentist read the Bible's words about the last days as coming true now.
- As a presentist, they held that the last days were coming true now.
