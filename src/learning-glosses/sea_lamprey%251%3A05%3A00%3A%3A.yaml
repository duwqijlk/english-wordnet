simpleMeaning: a big, eel-like fish that lives in salt water and swims up rivers to breed, sometimes eaten,
  and harmful to the native fish of the Great Lakes
scope: A big eel-like fish that breeds in rivers and harms native Great Lakes fish; not a true eel and
  not a small freshwater lamprey.
examples:
- Sea lamprey have spread through the Great Lakes and hurt native fish.
- In some places people still cook sea lamprey as food.
