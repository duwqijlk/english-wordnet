senseId: hush-hush%5:00:00:covert:00
synsetId: 01710918-s
simpleMeaning: No one can find out what is being done or why, because its aims and methods are hidden
scope: Also called clandestine, cloak-and-dagger, hole-and-corner, hugger-mugger, secret, surreptitious,
  undercover and underground, this word is for plans or work done in secret, not for a thing that is merely
  quiet or hard to see.
examples:
- The hush-hush meeting took place behind closed doors.
- They kept the hush-hush plan from everyone outside the small group.
