simpleMeaning: used of parts of words, carrying the main stress, usually with a change in the tone of
  the voice
scope: About the part of a word that carries the main stress, not the fizzy drink and not the tightness
  of muscles.
examples:
- The tonic syllable carries the main stress in a word.
- In 'photograph', the tonic syllable is the first one.
