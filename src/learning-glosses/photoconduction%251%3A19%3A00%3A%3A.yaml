scope: A change in how well a substance lets power flow through it when it takes in light or other rays;
  photoconductivity is another name for this sense, not a change in how well a substance lets heat flow
  and not the power itself.
examples:
- Photoconduction changed how well the stuff let power flow when light fell on it.
- The class tested photoconduction by shining light on the plate and watching the current.
