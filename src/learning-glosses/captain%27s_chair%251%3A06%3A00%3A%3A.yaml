simpleMeaning: A wooden seat with arms, a curved seat shaped like a saddle, and a low back with upright
  rods.
scope: A wooden seat with arms and a low back with upright rods, not a plain stool and not a rocking chair.
examples:
- He sat in the captain's chair by the fire.
- The captain's chair has a low back with upright rods.
