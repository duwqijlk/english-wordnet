simpleMeaning: a second sheet made at the same time as the first, by a dark sheet put between two sheets
scope: A second sheet made at the same time as the first, by a dark sheet put between two sheets; carbon
  is another name for this sense; not a copy made later by hand, and not a copy made by a machine.
examples:
- She kept a carbon copy of every letter she sent.
- The carbon copy was faint but still easy to read.
