scope: A branch of the Department of Transportation that watches over the shores, also called U. S. Coast
  Guard and United States Coast Guard; not the Navy and not a state police force.
examples:
- The US Coast Guard rescued the sailors from the sinking boat.
- A US Coast Guard cutter patrols the harbour mouth.
