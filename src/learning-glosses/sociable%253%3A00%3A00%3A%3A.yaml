simpleMeaning: liking to be with other people, or helping people be together and talk with each other
scope: Describing a person who likes being with others, or a chat or time that helps people be together,
  not a party itself.
examples:
- She is a sociable person who loves talking with her neighbours.
- They had a sociable evening talking with friends.
