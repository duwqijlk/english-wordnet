simpleMeaning: People who come together to stand for a larger group.
scope: This is a group of people standing for a larger group, not the whole group itself and not something
  that is unsure.
examples:
- Each nation sent a contingent of athletes to the Olympics.
- The contingent from the factory marched at the front of the parade.
