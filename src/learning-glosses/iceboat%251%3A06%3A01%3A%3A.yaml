simpleMeaning: A cross-shaped frame on thin blades carries this sailing craft across frozen water.
scope: Also called ice yacht and scooter, it is a craft carried by a cross-shaped frame on blades over
  frozen water, not a craft that floats on open water.
examples:
- The iceboat sped over the frozen bay on its blades.
- We watched an iceboat cross the frozen bay.
