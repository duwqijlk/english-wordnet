simpleMeaning: to talk by using hard questions or unclear words instead of saying things in a plain way
scope: Talking in this unclear way, not putting a single hard problem to someone and not explaining the
  answer to one.
examples:
- He always riddles when you ask him a straight question, so no one knows what he means.
- Stop riddling and say plainly what you want us to do.
