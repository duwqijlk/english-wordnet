simpleMeaning: a North American finch (a small seed-eating bird) with feathers that stand up on its head,
  a thick bill, and bright red feathers on the male
scope: Also called cardinal grosbeak and redbird. This is the bright red bird, not a church leader, not
  the color red, and not a number in maths.
examples:
- A cardinal sat on the fence, its red feathers bright in the sun.
- The male cardinal uses its thick bill to crack seeds.
