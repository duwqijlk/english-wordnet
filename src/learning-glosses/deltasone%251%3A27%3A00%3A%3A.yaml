simpleMeaning: A drug made to act like cortisol, a chemical the body makes, sold as Orasone, Liquid Pred
  or Meticorten; it calms swelling in joints and holds back the body's defences.
scope: Also called prednisone, Liquid Pred, Meticorten, or Orasone; a drug that acts like cortisol, calming
  swelling in joints and holding back the body's defences, kin to other drugs that calm swelling.
examples:
- The doctor gave her Deltasone to calm the swelling in her joints.
- Deltasone holds back the body's defences, so infections must be watched.
