simpleMeaning: In music, in a sliding way, running quickly through one note after another.
scope: In music, a direction to play by running quickly through one note after another; not the run of
  notes itself.
examples:
- Play this passage glissando, running through the notes quickly.
- She played the scale glissando, sliding from note to note.
