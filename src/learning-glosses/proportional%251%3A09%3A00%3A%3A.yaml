synsetId: 05872503-n
simpleMeaning: In mathematics, one of the numbers in a proportion, a statement that two pairs of numbers
  are the same in the way their numbers compare
scope: In mathematics, a noun for one number in a proportion; not the adjective sense that means matched
  in size or degree, usually followed by 'to'.
examples:
- In the proportion 2 is to 4 as 3 is to 6, each number is a proportional.
- The teacher asked us to find the fourth proportional.
