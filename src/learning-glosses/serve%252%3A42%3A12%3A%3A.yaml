simpleMeaning: To be enough for what is needed, in amount or in quality.
scope: This is being enough for a need, not fulfilling a role or purpose and not handing someone a legal
  document.
examples:
- This old coat will serve for another winter.
- Will this amount of paint serve, or do we need more?
