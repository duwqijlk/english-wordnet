simpleMeaning: feeling sorry for wrong things you have done, or showing that you feel sorry
scope: 'Also called repentant: feeling or showing you are sorry for wrong you have done, not a person
  in the Roman Catholic Church who says sorry for wrong things done.'
examples:
- The penitent boy said sorry for breaking the window.
- She looked penitent after she lied to her friend.
