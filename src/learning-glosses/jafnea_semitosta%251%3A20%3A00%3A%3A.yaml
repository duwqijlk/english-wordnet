simpleMeaning: The fruiting bodies of this cup fungus are firm and keep their cup shape for a long time;
  the pale brown inside matches the colour of dead leaves.
scope: The fruiting bodies of this cup fungus are firm and keep their cup shape for a long time, with
  a pale brown inside that matches dead leaves; not a soft fungus or one whose cup soon falls apart.
examples:
- Jafnea semitosta kept its cup shape for weeks.
- The pale brown inside of Jafnea semitosta matched the dead leaves.
