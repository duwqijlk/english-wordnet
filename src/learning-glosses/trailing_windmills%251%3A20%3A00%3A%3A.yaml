simpleMeaning: Spreading plant whose clusters of three deep pink flowers look like one bloom near the
  ground, growing in dry gravelly or sandy soil of the southwestern United States and Mexico.
scope: This is the low spreading desert plant whose pink flower clusters look like a single bloom; trailing
  four o'clock is another name for the same plant, and it is not the tall garden four o'clock.
examples:
- A patch of trailing windmills covered the sandy bank beside the road.
- Trailing windmills blooms low, so its three pink flowers look like one.
