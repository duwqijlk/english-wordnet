simpleMeaning: The giving of a strong electric shock through the brain, so as to bring on fits and a deep
  sleep-like state.
scope: Also called electroconvulsive therapy or electroshock therapy; the giving of a strong electric
  shock through the brain to bring on fits and a deep sleep-like state.
examples:
- The doctor used electroshock to treat the patient's deep depression.
- Electroshock was given only when other treatments had failed.
