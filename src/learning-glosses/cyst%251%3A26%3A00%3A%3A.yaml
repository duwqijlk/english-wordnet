simpleMeaning: A shut sac that grows where it should not, in some part of the body.
scope: This sense is a shut sac that grows where it should not, in some part of the body, unlike the sense
  for a small, natural sac or bladder-like frame, especially one holding fluid.
examples:
- The cyst grew in the tissue.
- Cysts are shut sacs in the body.
