simpleMeaning: a small ground-hugging northern shrub whose dark oval leaves narrow at the base, forming
  flat mats in Arctic and alpine parts of North America and Greenland.
scope: A mat-forming shrub of cold northern regions, not the trailing bearberry bush that bears red berries.
examples:
- Bearberry willow hugs the ground in exposed alpine sites.
- The bearberry willow's oval leaves taper toward the base.
