simpleMeaning: With front teeth like a rat's and feet with toes like hoofs, this is one of several small
  hoofed animals of Africa and Asia.
scope: This is one of the small hoofed animals of Africa and Asia, also called a das, coney, dassie, or
  hyrax, and not the burrowing animal with long ears or the small burrowing animal of rocky uplands.
examples:
- A cony showed its front teeth.
- The cony moved on feet with toes like hoofs.
