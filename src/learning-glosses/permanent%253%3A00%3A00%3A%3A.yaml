simpleMeaning: Going on and on with no clear change in the state of a thing, its place, or its standing
scope: Lasting with no clear change, not a curl put into hair and not a thing that lasts only a short
  time.
examples:
- He gave his permanent address on the form.
- The permanent secretary stayed in the post for many years.
