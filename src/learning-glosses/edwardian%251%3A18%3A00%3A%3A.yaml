simpleMeaning: A person of the time of King Edward VII, or one who acts as if from that time.
scope: A person of the time of Edward VII, or one who acts as if from that time; a person of that era,
  not the king himself and not a person of the Victorian age before it.
examples:
- An Edwardian gentleman wore a high collar.
- She dressed like an Edwardian for the play.
