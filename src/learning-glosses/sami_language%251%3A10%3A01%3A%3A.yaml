simpleMeaning: The tongue of the wandering Lapp people of northern Scandinavia and the Kola Peninsula.
scope: Also called Same, Lapp, Lapp language, Saame, Saame language, Saami, Saami language, Same language,
  or Sami, this is the tongue of the wandering Lapp people of northern Scandinavia and the Kola Peninsula,
  not the people themselves.
examples:
- Sami language is spoken by nomadic Lapps in northern Scandinavia.
- Children learn Sami language from their parents on the Kola Peninsula.
