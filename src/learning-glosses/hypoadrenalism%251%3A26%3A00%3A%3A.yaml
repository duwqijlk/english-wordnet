simpleMeaning: When the outer layer of the small gland above the kidney fails, a person grows weak and
  worn out, with too few red blood cells and brownish skin.
scope: Also called hypoadrenocorticism, this is a disorder of the gland above the kidney, not a disorder
  of the kidney itself.
examples:
- His hypoadrenalism left him weak, with brownish skin and too few red blood cells.
- Doctors traced her hypoadrenalism to the outer layer of the gland above the kidney.
