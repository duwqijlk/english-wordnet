simpleMeaning: a tree of the western United States that looks like another tree of the same kind but has
  brownish bark
scope: This is a tree of the western United States with brownish bark, also called mountain birch and
  water birch; not the paper birch and not a tree of the eastern United States.
examples:
- The swamp birch stood at the edge of the wet ground.
- Its brownish bark marked it out as a swamp birch.
