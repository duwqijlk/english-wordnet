simpleMeaning: a device used with electricity to add reactance (how much a part holds back a changing
  flow of electricity) to a circuit
scope: A device for an electric circuit, not the machine that controls a reaction in atoms to make power
  or new substances.
examples:
- The engineer put a reactor in the circuit to add reactance.
- A reactor can help control the changing flow of electricity in this circuit.
