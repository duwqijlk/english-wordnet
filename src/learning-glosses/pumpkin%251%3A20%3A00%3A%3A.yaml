simpleMeaning: A coarse climbing plant, widely grown for its large, soft, round orange fruit with firm
  skin and many seeds; the same species includes summer squashes and some late-season squashes.
scope: The climbing plant that produces the fruit, not the orange fruit sold as food.
examples:
- We let the pumpkin climb the fence at the back of the garden.
- The pumpkin in that field has spread across the whole row.
