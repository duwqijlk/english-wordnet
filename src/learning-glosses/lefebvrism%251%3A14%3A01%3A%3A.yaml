simpleMeaning: Backing or belonging to the Society of Saint Pius X, a worldwide group of Catholics who
  keep to older ways of worship.
scope: The word covers both backing the Society of Saint Pius X and belonging to it, an international
  traditionalist Catholic group.
examples:
- His Lefebvrism showed in his backing for the Society of Saint Pius X.
- She showed her Lefebvrism by joining the Society of Saint Pius X.
