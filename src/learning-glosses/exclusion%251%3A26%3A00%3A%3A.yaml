simpleMeaning: the state of being left out and not let in or not let take part
scope: The state of being left out of a group, place, or activity, not the act or rule that keeps a person
  out.
examples:
- His exclusion from the team left him very sad.
- She felt her exclusion from the group each day at lunch.
