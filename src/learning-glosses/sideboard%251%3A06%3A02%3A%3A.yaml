simpleMeaning: a board fixed along the side of a cart so the cart can carry a bigger load, made to be
  taken off again when not needed
scope: This is a board fixed along the side of a cart so the cart can carry a bigger load, made to be
  taken off again; not a piece of dining-room furniture and not a fixed side of a cart.
examples:
- He fitted a sideboard to the wagon before loading the hay.
- The sideboard came loose and fell off the cart.
