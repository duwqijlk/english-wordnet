simpleMeaning: In physics, the way a material holds back magnetic flow, like the way a wire holds back
  an electric current
scope: In physics, a block on magnetic flow, not the everyday sense of being unwilling to do something.
examples:
- The iron core has low reluctance, so the magnetic field passes through it easily.
- Engineers measure the reluctance of the circuit to work out the magnetic flow.
