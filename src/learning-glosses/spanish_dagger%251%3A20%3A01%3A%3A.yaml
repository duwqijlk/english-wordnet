simpleMeaning: A tree-like yucca of the south-west of the United States and the north of Mexico, with
  sword-like leaves and white flowers.
scope: Also called Yucca carnerosana; unlike the other Spanish dagger of the south-east, with its shorter
  trunk and smoother leaves, this one is tree-like and grows in the south-west of the United States and
  the north of Mexico.
examples:
- Spanish dagger grows tall in the desert garden.
- The white flowers of Spanish dagger open at night.
