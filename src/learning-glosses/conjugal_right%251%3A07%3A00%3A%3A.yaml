simpleMeaning: the right of a married person to enjoy living with their husband or wife, sharing meals,
  trust, care, home life, what they own together, and closeness at home
scope: The right of married people to live together and share home life, not the right to end a marriage
  and not the right to remarry.
examples:
- A conjugal right lets a married person live with their husband or wife.
- She spoke of her conjugal right to share meals and home life with him.
