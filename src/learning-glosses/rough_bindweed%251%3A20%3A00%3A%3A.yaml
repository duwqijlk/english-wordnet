simpleMeaning: a creeping or climbing evergreen with shiny leaves, spiny zigzag stems and long clusters
  of pale-green flowers, native from the Canary Islands through southern Europe to Ethiopia and India
scope: This is the evergreen climber from the Canary Islands region, not the common field or hedge bindweed
  weeds that spread through temperate gardens.
examples:
- Rough bindweed climbs over walls with its spiny zigzag stems.
- Rough bindweed keeps its shiny leaves all year.
