senseId: 'discipline%2:41:01::'
synsetId: 02559394-v
simpleMeaning: to help a child or animal learn good behaviour by teaching and practice, especially to
  learn to control itself
scope: Also called train, condition, and check. This sense is teaching a child or animal to behave well
  and control itself, not punishing someone to make them obey.
examples:
- Parents discipline their children by teaching clear rules every day.
- She disciplined the dog with daily practice until it learned to wait.
