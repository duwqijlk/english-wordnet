simpleMeaning: The fatty, bluish flesh of the fish that shares its name.
scope: The fatty, bluish flesh of the fish that shares its name; not the bluish warm-water sea fish itself,
  caught for food and sport, that follows schools of small fish into shallow water.
examples:
- They grilled the bluefish and served it with lemon.
- Bluefish is fatty and best eaten fresh.
