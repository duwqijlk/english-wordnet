senseId: 'fatalism%1:09:00::'
synsetId: 05980261-n
simpleMeaning: In philosophy, the belief that all events are fixed before they happen for all time, and
  people have no power to change them
scope: This is the belief itself that all is fixed ahead of time; it is not just the quiet, giving-up
  way of thinking that comes from holding this belief.
examples:
- His belief in fatalism made him think effort could not change the future.
- Fatalism teaches that every event is fixed before it happens.
