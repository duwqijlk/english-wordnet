simpleMeaning: a material that explodes, soft enough to be pressed by hand around the thing it is meant
  to destroy
scope: 'Also called plastique: a material that explodes and can be pressed round a thing to destroy it,
  not a hard bomb and not a firework.'
examples:
- The plastic explosive was pressed round the old wall before it was blown up.
- They found plastic explosive hidden in the car.
