simpleMeaning: This stuff can be pressed by hand round the thing it is meant to break, and then it blows
  the thing up
scope: 'Also called plastique: a stuff that blows up and can be pressed round a thing, not a hard bomb
  and not a firework.'
examples:
- The plastic explosive was pressed round the old wall before it was blown up.
- They found plastic explosive hidden in the car.
