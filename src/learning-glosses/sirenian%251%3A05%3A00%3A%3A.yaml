simpleMeaning: with a flat tail like a paddle and front limbs like flippers, a big sea mammal eats plants
  and has no back limbs; it belongs to one of two families
scope: 'Also called a sea cow and a sirenian mammal: a plant-eating sea mammal, not a whale and not a
  seal.'
examples:
- Sirenians feed on sea grass in the warm shallows.
- The sirenian moved slowly, its paddle tail pushing it along.
