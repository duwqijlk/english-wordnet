simpleMeaning: A fir of medium to tall height, of central to western United States, with a narrow upright
  crown and soft wood.
scope: A fir of the central to western United States with a narrow upright crown and soft wood, also called
  white fir, Abies concolor, California white fir and Colorado fir; its narrow upright crown and soft
  wood are what mark it out among firs.
examples:
- Abies lowiana grows in the mountains of the west.
- The soft wood of Abies lowiana is easy to cut.
