simpleMeaning: 'In chemistry, gas fills its holder, liquid stuff holds size but takes the shape of the
  holder, and solid stuff holds shape and size: three old forms.'
scope: This is also called a state, one of the three old forms of stuff.
examples:
- Ice is one state of matter.
- Steam is one state of matter.
