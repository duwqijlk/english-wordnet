simpleMeaning: A grape that grows by nature in the south-east United States, the source of many farmed
  kinds.
scope: A native grape of the south-east United States; not a farmed table grape, and not a wine made from
  grapes.
examples:
- Muscadine grows along the river banks in the south-east United States.
- They picked muscadine for jam.
