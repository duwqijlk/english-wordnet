simpleMeaning: A flap made of a piece of thick cloth that can be pulled back to make a way into a tent.
scope: This is a flap of thick cloth that can be pulled back to make a way into a tent, not a tent wall
  or a door, and it is also called a fly, a rainfly, a tent-fly, and a tent flap.
examples:
- He pulled back the fly sheet to enter the tent.
- The fly sheet hung over the tent door.
