senseId: 'aplastic_anaemia%1:26:00::'
synsetId: 14187823-n
simpleMeaning: a sickness where the bone marrow fails, so the blood has too few cells of every kind; a
  growth or a poison can cause it
scope: 'Also called aplastic anemia: a sickness from failing bone marrow, not a sickness from losing blood
  and not a single low blood count.'
examples:
- Aplastic anaemia left her blood short of every kind of cell.
- The doctor said the aplastic anaemia came from his failing bone marrow.
