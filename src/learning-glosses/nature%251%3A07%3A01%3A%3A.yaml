senseId: 'nature%1:07:01::'
synsetId: 04630470-n
simpleMeaning: The whole set of a person's feelings and mental qualities that shape how they usually act
  and respond.
scope: This means a person's inner character, not the natural world, the countryside, or the basic qualities
  of a thing.
examples:
- It was not in her nature to complain, even when things went wrong.
- He has a gentle nature that puts nervous patients at ease.
