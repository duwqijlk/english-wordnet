simpleMeaning: A blood group whose red cells lack the Rh factor, also called the Rh antigen.
scope: 'Also called Rh-negative blood type and Rh negative: the blood group whose red cells lack the Rh
  factor, not a blood group whose red cells carry it.'
examples:
- The doctor found that her Rh-negative blood had red cells without the Rh factor.
- His Rh-negative blood was tested, and its red cells lacked the Rh antigen.
