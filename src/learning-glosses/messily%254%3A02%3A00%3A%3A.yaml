senseId: 'messily%4:02:00::'
synsetId: 00402908-r
simpleMeaning: in a way that is not neat, not clean, and not in order
scope: 'Also called untidily: this word tells how an action is done in a way that is not neat, not what
  a place that is not neat is like.'
examples:
- He ate messily, dropping food all over the table.
- She wrote messily across the page, so no one could read it.
