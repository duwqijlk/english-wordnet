simpleMeaning: One of several East Indian woody plants that give a hard rubber-like sap of the getah soondie
  kind
scope: This is one of several East Indian woody plants that give a hard rubber-like sap of the getah soondie
  kind, not a rubber tree and not a tree that gives soft sap.
examples:
- The gutta-percha tree grows in the forests of the East Indies.
- Sap from the gutta-percha tree was once used for cable coverings.
