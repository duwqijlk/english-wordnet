simpleMeaning: a warm-blooded animal with a backbone, its skin more or less covered with hair, whose young
  are fed with milk and, except for a small egg-laying group, are born alive
scope: A warm-blooded animal with a backbone and hair, not a bird or a fish; the young are fed with milk,
  and, except for a small egg-laying group, are born alive.
examples:
- A dog is a mammal, so it feeds its pups with milk.
- The whale is a mammal, though it lives its whole life in the sea.
