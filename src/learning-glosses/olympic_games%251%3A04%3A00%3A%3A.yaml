simpleMeaning: The old sports meeting of all Greece at Olympia in honour of Zeus, held every four years
  from 776 BC.
scope: Also called Olympian Games; this is the ancient Greek festival at Olympia, not the modern games
  held today.
examples:
- The Olympic Games were held every four years at Olympia.
- The Olympic Games began in 776 BC.
