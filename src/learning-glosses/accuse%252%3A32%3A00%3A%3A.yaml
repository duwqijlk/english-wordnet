simpleMeaning: to claim that a person did something wrong, in the form of a charge against them
scope: This is a claim of wrongdoing made as a charge against a person, not just blaming someone for bad
  behaviour.
examples:
- The neighbours accused the man of stealing the bike.
- Police accused her of taking the money from the shop.
