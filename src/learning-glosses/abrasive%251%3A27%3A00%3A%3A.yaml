simpleMeaning: a substance that rubs against a surface and wears it down
scope: A substance that wears a surface down by rubbing; it is not the describing word for a harsh, unpleasant
  person or manner, and not the describing word for a thing that rubs and wears a surface down.
examples:
- This powder is an abrasive used to clean metal.
- The shop sells an abrasive for taking rust off metal.
