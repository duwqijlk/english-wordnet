simpleMeaning: Things in the world at rest or in motion are what this happening is about
scope: Something that happens to things when they stay still or move, not a thought in the mind and not
  a change in heat or light.
examples:
- The fall of the ball was a mechanical phenomenon.
- A mechanical phenomenon can be seen when the wheel turns.
