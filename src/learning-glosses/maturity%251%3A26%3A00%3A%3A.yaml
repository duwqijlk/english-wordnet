simpleMeaning: the state of being fully grown and fully formed, when full growth has been reached
scope: This is full growth, not still growing and not being young. It is not the date when a loan must
  be paid back.
examples:
- Puppies reach maturity at about one year old.
- At maturity, the plant starts to make seeds.
