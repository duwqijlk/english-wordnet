simpleMeaning: to send something moving fast by hitting it hard or throwing it with great force.
scope: Not carrying or pushing something along; this sense needs a hard hit or a forceful throw.
examples:
- She drove the nail into the plank with two hard blows of the hammer.
- He drove the ball over the fence with one swing.
