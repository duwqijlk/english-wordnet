simpleMeaning: a plant with a strong smell of aniseed, whose leaves and seeds are used to give food flavour
scope: A plant with a strong smell of aniseed, whose leaves and seeds give food flavour; not a plant grown
  for its roots, and not a sweet herb for cakes.
examples:
- Common fennel scented the whole garden with aniseed.
- She added common fennel seeds to the fish dish.
