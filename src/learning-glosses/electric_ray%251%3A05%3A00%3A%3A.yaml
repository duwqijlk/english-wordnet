simpleMeaning: A slow flat fish of the torpedo group, living on the sea floor, with a round body and organs
  on each side of its head that can give strong shocks
scope: 'Also called torpedo, crampfish, and numbfish: a slow flat fish that can give strong shocks, not
  a stingray and not a torpedo weapon.'
examples:
- The diver kept clear of the electric ray on the sand.
- An electric ray can stun a small fish with a shock.
