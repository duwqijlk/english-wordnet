simpleMeaning: In criminal law, an act that the law can punish, usually seen as a wicked act
scope: This is an act the law can punish, usually seen as wicked; criminal offense is another name for
  this sense, and it is not a civil wrong or a mere mistake.
examples:
- Theft is a criminal offence under the law.
- He had a long record of criminal offences.
