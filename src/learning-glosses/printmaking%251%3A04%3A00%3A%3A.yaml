simpleMeaning: the art of designing and making prints, such as woodcuts (prints made from cut wood blocks)
  or silkscreens (prints made through fine cloth)
scope: This is the art of making prints, not one single print on its own and not painting straight onto
  paper or cloth.
examples:
- She studied printmaking and learned to make woodcuts.
- In his printmaking class, they made silkscreen prints of birds.
