simpleMeaning: a job or duty you are given to do, especially in the armed forces
scope: This is a duty you are given to do, especially as a soldier; it is not a piece of school work a
  teacher gives you, and not the act of giving things out to people or places.
examples:
- His next assignment was guard duty at the base.
- She was sent on a dangerous assignment with her unit in the army.
