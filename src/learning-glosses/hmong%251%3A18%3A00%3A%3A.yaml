simpleMeaning: A people living by old ways in mountain villages in southern China and nearby parts of
  Vietnam, Laos and Thailand; many have moved to the United States.
scope: Also called Miao; a people living by old ways in mountain villages in southern China and nearby
  parts of Vietnam, Laos and Thailand, many of whom have moved to the United States.
examples:
- The Hmong lived in mountain villages in southern China.
- Many Hmong have moved to the United States.
