senseId: 'heavy_syllable%1:10:01::'
synsetId: 92463283-n
simpleMeaning: In speech sounds, a beat of a word whose middle or end part splits into two.
scope: In speech sounds, a beat of a word whose middle or end part splits into two; not a short beat of
  a word and not a beat with a single short sound.
examples:
- In 'plant', the heavy syllable ends with two sounds after the vowel.
- The word 'stood' has one heavy syllable.
