simpleMeaning: to grow sharp and clear, as an image does when a lens is turned
scope: This is an image becoming sharp by itself, not a person turning a lens to make it sharp.
examples:
- The picture on the screen slowly focused as the projector warmed up.
- Wait a moment while the camera focuses.
