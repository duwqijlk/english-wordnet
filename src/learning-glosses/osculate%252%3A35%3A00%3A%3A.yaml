simpleMeaning: To touch or press the lips against someone's mouth or another part of the body, to show
  love, as a greeting, or the like
scope: 'Also called kiss, snog or buss: touching or pressing the lips against someone to show love, as
  a greeting, or the like, not a handshake and not a hug.'
examples:
- The couple paused to osculate before leaving.
- They osculated under the doorway as they said goodnight.
