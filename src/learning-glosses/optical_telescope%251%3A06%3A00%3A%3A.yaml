simpleMeaning: A tool for looking at the stars that takes in and keeps a record of light from far-off
  things in the sky
scope: A tool that takes in and keeps a record of light from far-off things in the sky, not a tool for
  looking at things on Earth and not one that only takes in radio waves.
examples:
- The optical telescope at the top of the hill takes in light from far stars.
- They used an optical telescope to keep a record of the light from a far star.
