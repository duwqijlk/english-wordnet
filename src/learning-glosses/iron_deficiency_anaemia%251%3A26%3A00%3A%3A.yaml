simpleMeaning: Too little of a metal from food, or a long bleed that drains that metal away, leaves the
  blood weak
scope: A sickness of the blood from too little of a metal from food or from long bleeding, also called
  iron deficiency anemia; not a sickness from too little food in general and not a short loss of blood.
examples:
- Her iron deficiency anaemia made her feel tired all the time.
- The doctor treated his iron deficiency anaemia with pills.
