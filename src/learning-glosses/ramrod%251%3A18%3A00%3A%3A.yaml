simpleMeaning: a person who watches over workers and makes them work in a strict, hard way
scope: A strict person who watches over workers; not a rod used to clean a gun, and not a rod for pushing
  a charge into an old gun.
examples:
- The workers feared the ramrod, who never let them rest.
- As a ramrod, he checked every man's work and demanded more.
