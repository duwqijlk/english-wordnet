simpleMeaning: machines and other equipment that control things or run them by themselves
scope: This is the equipment itself. It is not the act of setting up automatic control, and not the state
  of being run by itself.
examples:
- New automation on the factory floor sorts and packs the boxes.
- The office bought automation to check forms and move files by itself.
