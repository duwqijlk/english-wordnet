simpleMeaning: Any store in which different patterns of pull show stored bits or bytes of information.
scope: Also called magnetic storage and magnetic storage medium, it is a store whose stored bits or bytes
  of information are shown by different patterns of pull.
examples:
- The hard disk in your computer is a magnetic medium.
- The magnetic medium kept the stored bits as patterns of pull.
