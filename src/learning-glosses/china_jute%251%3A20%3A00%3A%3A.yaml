simpleMeaning: A tall plant of tropical Asia that lives one year or turns shrubby, with velvety leaves,
  yellow flowers and strong fibre; now wild in southeastern Europe and the United States.
scope: A tall plant with velvety leaves and yellow flowers, also called a butter-print, a velvet-leaf,
  velvetleaf, velvetweed, Abutilon theophrasti or Indian mallow.
examples:
- The China jute grew taller than the fence by midsummer.
- Farmers once grew China jute for its strong fibre.
