simpleMeaning: a worker paid to kill or chase away rats, mice, and other pests
scope: A worker paid to kill or chase away pests, not a person who catches wild animals and not a cleaner
  who only keeps a place tidy.
examples:
- The disinfestation officer sprayed the cellar to drive out the rats.
- They called a disinfestation officer when mice moved into the grain store.
