simpleMeaning: 'No one has to touch the load: air lifts the front of the flat bed, and the load runs off
  by its own weight from this truck.'
scope: Also called a tipper, a dump truck, a dumper, a tip truck and a tipper truck, this truck empties
  its load with no one touching it.
examples:
- The tipper lorry lifted its bed and the stones slid out.
- A tipper lorry stood by the trench, ready to drop its load.
