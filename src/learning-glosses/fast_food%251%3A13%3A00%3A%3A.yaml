simpleMeaning: Things to eat that are made and given to you in very little time, like burgers, chicken
  or milkshakes, and that do not cost much
scope: Things to eat made and given to you in very little time, like burgers, chicken or milkshakes, that
  do not cost much, not a slow meal in a restaurant and not food cooked at home.
examples:
- We stopped for fast food on the way home.
- The town has a new fast food place near the station.
