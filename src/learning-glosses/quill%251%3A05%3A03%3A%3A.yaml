simpleMeaning: One of the big feathers that grow on a bird's wing or tail
scope: This is a large feather on the wing or tail of a bird, not the sharp point on a porcupine or hedgehog
  and not a pen made from a feather.
examples:
- The bird lost a long quill from its tail.
- She picked up a large quill that had fallen from the wing.
