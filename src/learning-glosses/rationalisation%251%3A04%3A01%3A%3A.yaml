scope: In maths, the making simple of a sum or equation, by taking out roots without changing its worth,
  or the roots of the equation; also called rationalization; not a mind-trick that hides one's true drive
  by putting a safe face on one's acts and feelings, nor the setting of a thing in order by a system or
  a reason.
examples:
