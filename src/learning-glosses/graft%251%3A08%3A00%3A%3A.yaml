simpleMeaning: In surgery, body tissue or a whole organ moved from one person (the giver) to another person
  who receives it; sometimes the same person is both giver and receiver
scope: 'Also called transplant: this is the tissue or organ that is moved, not the act or the operation
  of moving it.'
examples:
- The skin graft took well and the burn began to heal.
- He needed a bone graft from a donor.
