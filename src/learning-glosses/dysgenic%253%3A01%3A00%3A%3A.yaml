simpleMeaning: having to do with a worsening in the young that are born, or causing it
scope: 'Also called cacogenic: to do with a worsening in the young, not a change that makes them stronger.'
examples:
- The dysgenic change left the young weaker than their parents.
- They studied whether the breeding plan was dysgenic.
