simpleMeaning: a god of the voodoo faith, from Africa, worshipped especially in the West Indies
scope: Also called zombie; a god of the voodoo faith, not a drink, not a dead body brought back to life,
  and not a person who acts like a machine.
examples:
- The zombi is honoured in the island's voodoo rites.
- Priests of the zombi sang through the night.
