simpleMeaning: That has mistakes in it, or shows the marks of a mistake.
scope: Said of a thing that holds a mistake or is marked by one, not of a lie told on purpose.
examples:
- The report was full of erroneous conclusions.
- She corrected the erroneous figures in the table.
