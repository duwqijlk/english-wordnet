simpleMeaning: An unlucky event that gets in the way, stops or slows what you are doing, and leaves you
  frustrated.
scope: An unlucky event that gets in the way and stops or slows what you are doing; blow, reverse, setback
  and reversal are other names for this sense, not a bruise round the eye and not a lucky break.
examples:
- Losing the contract was a black eye for the firm.
- The defeat proved a black eye for the young team.
