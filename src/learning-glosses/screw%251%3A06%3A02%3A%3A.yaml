simpleMeaning: a simple machine that works like a slope, a rod with round sides and a wound groove that
  fits and turns in a hole with the same wound groove
scope: A simple machine in the form of a threaded rod, not the small fastener with a slotted head and
  not the propeller that pushes water or air.
examples:
- A screw is a simple machine, like a slope wound round a rod.
- The teacher showed how a screw lifts a load as it turns.
