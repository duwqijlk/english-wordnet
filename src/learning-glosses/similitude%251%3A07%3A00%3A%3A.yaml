senseId: 'similitude%1:07:00::'
synsetId: 04752054-n
simpleMeaning: The way people or things are alike in how they look or in what they are like
scope: Being alike in looks or in what someone or something is like, close to a likeness or a resemblance,
  but not being the same thing and not a copy.
examples:
- The similitude between the two brothers made people mistake one for the other.
- She saw a clear similitude in character between the old house and the new one.
