simpleMeaning: the act of striking a golf ball from a small peg, called a tee, with a long club used for
  long shots.
scope: Not a putt or a short approach; this sense is only the long stroke from a tee with a long club.
examples:
- She spent an hour at the practice range working on her drive.
- His drive on the eighteenth hole landed just short of the green.
