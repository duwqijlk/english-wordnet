simpleMeaning: to talk loudly and with strong feeling, in a grand and forceful way
scope: 'Also called rant or spout: loud, excited talk, not a dance party and not a calm chat.'
examples:
- He began to rave about the price rise.
- She raved at the crowd for an hour.
