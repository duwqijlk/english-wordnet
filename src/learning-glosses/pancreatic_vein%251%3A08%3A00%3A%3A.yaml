simpleMeaning: The blood tubes that serve the gut and the spleen take in blood carried away from the pancreas.
scope: It is also called venae pancreatica, and it is a blood tube that carries blood away from the pancreas.
examples:
- The pancreatic vein carries blood away from the pancreas.
- Blood from the pancreatic vein flows into the tubes that serve the gut and the spleen.
