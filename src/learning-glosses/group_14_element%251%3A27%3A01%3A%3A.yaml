simpleMeaning: Any basic kind of matter that is one of the carbon set.
scope: Also called a carbon group element, crystallogen, tetragen, and tetrel; any basic kind of matter
  that is one of the carbon set, set beside the elements of Group 13 and Group 15.
examples:
- Carbon is a Group 14 element, one of the carbon set.
- Each Group 14 element belongs to the carbon set of basic kinds of matter.
