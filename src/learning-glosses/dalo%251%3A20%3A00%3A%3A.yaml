simpleMeaning: People grow this Pacific plant in warm lands for its root, which they eat, and in cooler
  lands they grow it just to look at, for its big shiny leaves
scope: Also called taro, dasheen, or a taro plant; a food plant of warm lands, not a tree or a grain.
examples:
- In Fiji, dalo is dug up and cooked for dinner.
- She keeps a dalo in a pot on the porch for its big shiny leaves.
