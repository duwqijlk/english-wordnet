simpleMeaning: the way a person acts toward other people
scope: 'Also called behavior, conduct, behaviour, demeanor and demeanour: the way a person acts toward
  other people, not the act of forcing a person to leave a country.'
examples:
- Her deportment toward guests was kind and polite at all times.
- The school praised his good deportment in class and with his friends.
