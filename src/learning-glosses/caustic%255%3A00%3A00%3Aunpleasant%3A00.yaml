simpleMeaning: harsh and unkind in the way something is said or written
scope: 'Also called bitter, acid, acrid, blistering, sulfurous, virulent, acerbic, sulphurous and vitriolic:
  harsh and unkind in tone. It is not the sense about a chemical that burns, and not the sense about light.'
examples:
- She made caustic remarks about his work in front of everyone.
- His caustic reply hurt her feelings.
