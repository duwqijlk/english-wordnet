simpleMeaning: a band you tie or fix around your body, usually at the waist
scope: A band worn around the body, usually at the waist. Not a band in a machine, not a strip that holds
  bullets, and not singing loudly.
examples:
- He wore a black belt around his waist.
- She tightened her belt so her trousers would not slip down.
