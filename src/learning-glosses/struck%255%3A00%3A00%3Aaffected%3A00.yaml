simpleMeaning: used with another word to mean overcome by something very great or powerful
scope: This is the combining adjective for being overwhelmed, not the past tense of strike nor the fascinated
  meaning in star-struck; stricken and smitten are other names for it.
examples:
- The crowd stood awe-struck as the huge doors opened.
- She was horror-struck when she saw the damage.
