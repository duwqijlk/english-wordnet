simpleMeaning: a large dark brown meat-eating animal from North America that lives in trees
scope: 'Also called a fisher, a fisher cat and a pekan: a large dark brown meat-eating animal that lives
  in trees in North America, not a house pet and not a small tree animal that eats plants.'
examples:
- A black cat moved through the trees at dusk.
- The black cat hunted in the trees of the North American forest.
