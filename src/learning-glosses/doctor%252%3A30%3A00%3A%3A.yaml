simpleMeaning: To change something, often by adding something else, so that it becomes impure, usually
  in order to trick people.
scope: This is not the sense of treating a sick person or repairing something; it means to tamper with
  something so that it is no longer genuine.
examples:
- The company doctored the figures to hide its losses.
- Someone had doctored the wine with cheap spirits.
