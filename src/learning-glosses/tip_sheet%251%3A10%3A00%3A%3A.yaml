simpleMeaning: A paper that gives the newest facts, advice, or guesses about one trade, the stock market,
  or horse race results, and more
scope: A paper of facts and guesses about one trade or market, not a daily newspaper and not a book of
  advice.
examples:
- He read the tip sheet before placing his bets.
- The tip sheet gave the latest news on the stock market.
