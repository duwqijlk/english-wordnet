simpleMeaning: a wooden frame that rests across the shoulders and lets a person carry a bucket hanging
  from each end
scope: This sense is a wooden frame for carrying buckets on the shoulders, not the gear that joins two
  work animals at the neck and not the top part of a piece of clothing.
examples:
- He carried two buckets of water on a yoke across his shoulders.
- She lifted the yoke onto her shoulders before picking up the buckets.
