simpleMeaning: a tool shaped like a wide open tube that is narrow at one end, held to the mouth to make
  the voice louder and send it one way
scope: This is a tool you hold to your mouth to make your voice louder in one direction, not a machine
  that plays sound out to a room.
examples:
- She spoke through a megaphone so the whole crowd could hear her.
- The coach used a megaphone to call to the players across the field.
