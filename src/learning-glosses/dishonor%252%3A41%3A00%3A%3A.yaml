simpleMeaning: to spoil the good name of a person, a family, or a group, so people think less of them
scope: 'Also called shame: to spoil the good name of a person or a group, not the feeling of shame and
  not a bad reputation as a thing.'
examples:
- He dishonored his family by committing a serious crime.
- The cheating scandal dishonored the whole team in the eyes of the town.
