simpleMeaning: A shrub of the coastal ranges of California and Baja California, with hairy branches and
  spikes of many mauve flowers; sometimes placed in the genus Sphaeralcea.
scope: Also called chaparral mallow and Sphaeralcea fasciculata; a shrub of the coastal ranges of California
  and Baja California with mauve flowers, not a rose and not a tree.
examples:
- Malacothamnus fasciculatus grows in the coastal ranges of California and Baja California.
- The mauve spikes of Malacothamnus fasciculatus stand out on its hairy branches.
