simpleMeaning: In eastern and central North America grows a thick-stemmed plant that lives year after
  year, its leaves spread like fingers under showy blue flowers in long clusters.
scope: Also called old-maid's bonnet and sundial lupine, it is a stout plant of eastern and central North
  America known by showy blue flowers and leaves that spread like fingers.
examples:
- Showy blue flowers in long clusters marked the wild lupine.
- The wild lupine lives year after year in eastern North America.
