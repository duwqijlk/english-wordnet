simpleMeaning: A Muslim who belongs to a Turkic people of western Asia, found chiefly in the land it is
  named for
scope: This is a Muslim of a Turkic people of western Asia, found chiefly in Kazakstan; Kazak is another
  name for this sense, not the Kazakh tongue and not a Muslim of another Turkic people.
examples:
- The Kazakh family kept the customs of their people.
- He was proud to be a Kazakh of western Asia.
