simpleMeaning: the part of medicine that studies blood and lymph vessels and the ills that affect them
scope: The study of blood and lymph vessels and their ills, not a swelling of a vessel and not a growth
  made of vessels.
examples:
- She chose angiology so she could treat people with diseased blood vessels.
- His book on angiology explains how lymph ducts can become blocked.
