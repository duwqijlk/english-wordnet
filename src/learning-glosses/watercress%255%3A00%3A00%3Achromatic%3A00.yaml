simpleMeaning: of a middle yellow-green color, more green and deeper than moss green, and more yellow
  and darker than pea green
scope: 'Also called cress green and cresson: this names a color, not the plant that grows in clear ponds
  and streams and not cress plants that love water.'
examples:
- She wore a watercress scarf in a deep yellow-green color.
- The wall was painted a watercress shade, darker than pea green.
