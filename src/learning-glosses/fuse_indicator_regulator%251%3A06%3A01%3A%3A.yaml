simpleMeaning: A tool that sets the burst time of shots that carry a clockwork timer, so they burst at
  the right moment.
scope: This is a tool that sets the burst time of shots with clockwork timers, also called a fuse setter
  or a fuze setter; not the timer itself, and not a sight for aiming a gun.
examples:
- The gunner used the fuse indicator regulator to set the burst time.
- A fuse indicator regulator makes each shell burst at the right height.
