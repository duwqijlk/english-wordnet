simpleMeaning: In hotel sitting rooms and bars, this man does nothing but look for a woman who will keep
  him
scope: Also called a lizard, this is a man who does nothing in hotel bars while looking for a woman to
  keep him, not a man who works in a bar and not a guest on holiday.
examples:
- He was known as a lounge lizard, always at the hotel bar.
- The lounge lizard spent his evenings chatting up women at the bar.
