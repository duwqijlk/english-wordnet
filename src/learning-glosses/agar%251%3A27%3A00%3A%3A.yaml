simpleMeaning: A jelly-like substance taken from seaweed, used especially to grow germs on and to set
  food firm.
scope: Also called agar-agar, this is a jelly-like substance taken from seaweed, not a dish of food or
  germs grown on it.
examples:
- The cook stirred agar into the fruit juice to set it.
- They poured the agar into dishes to grow germs on.
