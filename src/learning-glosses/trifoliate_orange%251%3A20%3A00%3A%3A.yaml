senseId: 'trifoliate_orange%1:20:00::'
synsetId: 12735014-n
simpleMeaning: A thorny, fast-growing Chinese orange tree that sheds its leaves each year and bears fragrant
  blossom and ornamental, inedible fruit; it is used as grafting stock and for hedges.
scope: The usual name for this thorny Chinese citrus, also called trifoliata; it is grown as grafting
  stock and for hedges rather than for its fruit. It is not the sweet eating orange, nor the bitter orange
  used in marmalade.
examples:
- The trifoliate orange bears small, fuzzy fruit that most people leave on the tree.
- He grafted a sweet orange variety onto a trifoliate orange trunk.
