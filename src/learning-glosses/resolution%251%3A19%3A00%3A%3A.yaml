simpleMeaning: the power of a microscope or telescope to show images that are close together as separate
  images, and to measure the angle between them
scope: This is about how well a microscope or telescope shows close images apart, not the number of small
  dots on a computer screen and not a decision or an answer to a problem.
examples:
- This telescope has high resolution, so it can show two close stars as two separate stars.
- The microscope's resolution was too low to show the tiny parts clearly.
