simpleMeaning: soft sea animals with no rings along the body, a thin thread-like tube, and the power to
  stretch and shrink
scope: Soft sea animals with a thin thread-like tube; also called nemertean, nemertine and ribbon worm;
  not a flat sea animal and not a ringed sea animal.
examples:
- The proboscis worm stretched out its long tube.
- A proboscis worm can shrink to half its length when touched.
