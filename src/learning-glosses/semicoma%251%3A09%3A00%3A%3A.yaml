simpleMeaning: a light state of deep sleep from which a person can be woken by the right thing
scope: This is a light state of deep sleep from which a person can be woken; not a full deep sleep from
  which a person cannot be woken, and not ordinary sleep.
examples:
- The nurse said he was in a semicoma and could be woken by a touch.
- After the fall she lay in a semicoma, but a loud voice woke her.
