simpleMeaning: a lasting sickness of the lungs in horses, making it hard to breathe out and making the
  sides heave
scope: A lasting sickness of the lungs in horses, making it hard to breathe out and making the sides heave;
  not a short cough, and not a sickness of people.
examples:
- The old horse had the heaves and coughed after work.
- Heaves made the mare breathe out with a double lift of her sides.
