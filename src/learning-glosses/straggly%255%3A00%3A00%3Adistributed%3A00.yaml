simpleMeaning: growing or spreading only a little in each place, with gaps, and not in an even way
scope: Growing thinly with gaps between parts; not the other sense of spreading out in an untidy way in
  many directions.
examples:
- Straggly ivy covered only part of the wall.
- A few straggly plants grew along the edge of the path.
