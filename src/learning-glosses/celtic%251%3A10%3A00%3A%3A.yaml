simpleMeaning: A branch of the Indo-European languages that, from old writing and place names, was once
  spread widely over Europe before the time of Christ.
scope: 'Also called Celtic language: a branch of the Indo-European languages once spread widely over Europe
  before the time of Christ, not the adjective for things of the Celts.'
examples:
- Celtic spread widely over Europe long ago.
- Irish and Welsh come from Celtic.
