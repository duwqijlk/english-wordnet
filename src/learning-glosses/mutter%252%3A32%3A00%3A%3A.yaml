simpleMeaning: to voice discontent or make unhappy sounds in a very quiet, low voice
scope: Saying complaints quietly under the breath, not the sense of talking indistinctly in a low voice,
  and not the noun for a low complaint or the low ongoing sound.
examples:
- She muttered something about the unfairness of it all as she left.
- He mutters complaints under his breath whenever the manager walks past.
