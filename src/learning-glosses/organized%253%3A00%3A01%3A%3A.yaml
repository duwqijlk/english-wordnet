simpleMeaning: doing things in a clear, planned way and working well, with things in their right places
scope: This describes a person or thing that works in a planned, tidy way; it is not about setting up
  an event or a group formed for a shared aim.
examples:
- She is very organized and never loses her papers.
- Their organized office made the work quick and easy.
