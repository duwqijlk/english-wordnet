simpleMeaning: A dish of rice with hard-boiled eggs and cooked fish broken into small flakes.
scope: This is a dish of rice with hard-boiled eggs and cooked fish broken into small flakes, not a curry
  and not plain boiled rice.
examples:
- We had kedgeree with rice, eggs and flaked fish for supper.
- She made kedgeree from leftover rice and smoked fish.
