simpleMeaning: In racket sports, about a hit made across the body, with the back of the hand facing the
  direction of the hit
scope: 'Also called backhand: this describes a racket hit made across the body, not a hit with the front
  of the hand facing forward and not a remark that sounds like praise but is really rude.'
examples:
- She hit a backhanded shot across the court.
- His backhanded return landed just inside the line.
