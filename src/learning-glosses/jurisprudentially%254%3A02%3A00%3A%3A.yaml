simpleMeaning: In a way that has to do with the study of law and how law works.
scope: In a way that concerns the study of law, not in a way that concerns one court case only.
examples:
- The question was treated jurisprudentially, as a matter of legal theory.
- He spoke jurisprudentially about how laws are made and used.
