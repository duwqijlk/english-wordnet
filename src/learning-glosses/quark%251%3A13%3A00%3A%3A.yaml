simpleMeaning: a fresh cheese with a smooth feel, not left to age, made from milk heated to kill germs,
  a starter and rennet, both added to help the milk set
scope: 'Also called quark cheese: this is the soft fresh cheese, not the tiny bit of matter that physics
  talks about as a basic part of things.'
examples:
- She spread quark on toast for breakfast.
- The shop sells soft quark made from fresh milk.
