simpleMeaning: Most of all in cells that make fluids, an animal cell holds a net-like structure in the
  cytoplasm, the soft stuff that fills it.
scope: Also called Golgi apparatus, Golgi body, and dictyosome; a net-like part inside an animal cell,
  not the whole cell and not the part that carries the cell's instructions.
examples:
- The Golgi complex helps cells that make fluids do their work.
- We learned how the Golgi complex looks inside an animal cell.
