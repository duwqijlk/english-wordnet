simpleMeaning: A blood vessel that brings blood to the joint of the hip and to the muscles of the upper
  leg.
scope: A blood vessel that feeds the hip joint and the muscles of the upper leg, also called arteria circumflexa
  femoris; not the blood vessel that feeds the shoulder and not a vein.
examples:
- The circumflex artery of the thigh carries blood to the muscles of the upper leg.
- A tear in the circumflex artery of the thigh can cut off blood to the hip.
