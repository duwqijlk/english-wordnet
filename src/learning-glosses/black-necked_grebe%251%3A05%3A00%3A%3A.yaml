simpleMeaning: In Eurasia and southern Africa and in the west of the United States lives this small water
  bird, with yellow tufts by its ears and a dark neck.
scope: This small water bird has yellow ear tufts and a dark neck, and eared grebe is another name for
  this sense.
examples:
- A black-necked grebe swam past with yellow tufts by its ears.
- A black-necked grebe was seen in the west of the United States.
