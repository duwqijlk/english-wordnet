simpleMeaning: In embryology, one of the 3 sheets of cells that form in young life after the early ball
  of cells grows sheets inside.
scope: This is one of the 3 sheets of cells that form in young life after the early ball of cells grows
  sheets inside, not a sheet of skin on a grown body and not one cell alone.
examples:
- Each germ layer gives rise to different body parts.
- The germ layer formed soon after gastrulation.
