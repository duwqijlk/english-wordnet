simpleMeaning: to shake again and again in a way you cannot stop, as from fear or from feeling excited
scope: 'Also called shudder and thrill: this is the act of shaking in this way, not the shaking move itself
  and not the almost happy feeling of fear.'
examples:
- She shivered with fear when she heard the loud noise behind her.
- He shivered with excitement as he waited for the result.
