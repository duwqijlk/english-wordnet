simpleMeaning: a wide area of land with the sheds and gear needed to raise animals, most often cows and
  bulls
scope: 'Also called cattle farm, ranch and spread: a wide area of land with sheds and gear for raising
  animals, not a small field and not a place that grows crops.'
examples:
- He works on a cattle ranch near the border.
- The cattle ranch raises cows for beef.
