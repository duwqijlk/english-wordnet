simpleMeaning: To treat a person as someone to be harmed or cheated.
scope: To treat a person as someone to be harmed or cheated, with victimize as another name for this sense;
  not to harm a person by accident and not to blame a person.
examples:
- I was victimised by this con-man.
- The gang victimised shopkeepers in the area.
