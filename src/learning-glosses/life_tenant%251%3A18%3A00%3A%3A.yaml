senseId: 'life_tenant%1:18:00::'
synsetId: 10280908-n
simpleMeaning: A person whose legal right to keep buildings or land lasts as long as they, or some other
  named person, live
scope: A person with a legal right to keep buildings or land for as long as they live, not a renter on
  a fixed term and not the owner of the land.
examples:
- The life tenant may live in the house until she dies.
- As a life tenant, he could not sell the land.
