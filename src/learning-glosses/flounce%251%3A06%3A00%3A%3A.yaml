simpleMeaning: a strip of cloth with many small folds, used to make something look pretty or to finish
  its edge
scope: 'Also called ruffle, frill, and furbelow: a strip of cloth with folds used to trim clothes, not
  the act of walking with big jerky moves.'
examples:
- The dress had a wide flounce at the bottom.
- She sewed a flounce around the edge of the skirt.
