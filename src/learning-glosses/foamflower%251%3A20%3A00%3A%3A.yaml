simpleMeaning: a plant of the woods that blooms in spring, with white flowers, and sends out low stems
  that take root and grow new plants
scope: 'Also called coolwart, false miterwort and false mitrewort: a woodland plant with white spring
  flowers, not a garden flower and not a plant that blooms in summer.'
examples:
- Foamflower grows in the woods behind our house.
- In spring the foamflower opens its small white blooms.
