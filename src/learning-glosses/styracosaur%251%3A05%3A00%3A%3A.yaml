simpleMeaning: Round the edge of its bony frill, this odd horned dinosaur of the late Cretaceous bore
  many large spikes and one long horn on its nose.
scope: Also called styracosaurus, this is an odd horned dinosaur of the late Cretaceous with many large
  spikes round its bony frill and a long horn on its nose.
examples:
- The styracosaur's bony frill was ringed with long spikes.
- A styracosaur skeleton stood beside the other horned dinosaurs.
