simpleMeaning: the thick underground stem of the plant, with a strong sharp taste; used fresh to add taste
  to food, especially in Asian cooking
scope: The fresh underground stem used to add taste to food, especially in Asian cooking; not the whole
  living plant and not its dried ground powder.
examples:
- She added fresh ginger to the soup.
- Fresh ginger gives this Asian stir-fry its sharp taste.
