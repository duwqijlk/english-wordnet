simpleMeaning: a unit of length in the metric system, equal to 100 meters
scope: A unit of length equal to 100 meters. It is not a sound a person makes, and not a measure of weight
  or time.
examples:
- One hm is the same as 100 meters, so the field is about 2 hm across.
- He measured the path as 4 hm from start to end.
