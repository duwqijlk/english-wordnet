simpleMeaning: a ruling by a court that follows a written admission of debt, made without the cost of
  ordinary court steps
scope: A ruling by a court that follows a written admission of debt, made without the cost of ordinary
  court steps; cognovit judgement, confession of judgement and confession of judgment are other names
  for this, not a ruling after a full trial and not a ruling with no written admission.
examples:
- The cognovit judgment was entered after the debtor confessed in writing.
- A cognovit judgment saves the cost of ordinary proceedings.
