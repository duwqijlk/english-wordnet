simpleMeaning: a long-lived fig tree of India, held holy by Buddhists, that grows to great size with no
  roots dropping from its branches like the banyan
scope: Also called a bo tree, peepul, pipal, pipal tree, and sacred fig; not a banyan and not any other
  fig tree.
examples:
- The pipul outside the temple is hundreds of years old.
- Buddhists gather under the pipul to pray.
