simpleMeaning: A turning copier that pushes ink through a cut sheet, sold under the trade mark Roneo.
scope: A rotary copier that presses ink through a stencil, not a photocopier or a printing press, also
  called mimeograph, mimeo, mimeograph machine and Roneo.
examples:
- The office used a Roneograph to copy the school paper.
- He ran the notes through the Roneograph.
