schema: oewn-learning-gloss-v2
senseId: diffused%5:00:00:distributed:00
synsetId: 00542852-s
simpleMeaning: of light rays, spread out by bouncing off a rough surface or by going through a material
  that lets light pass but is not clear
scope: This sense is about light spread out by a rough surface or by a material that is not clear; it
  is not just light sent out from a wide light source.
examples:
- The lamp gave diffused light after the rays bounced off the rough wall.
- Diffused light came through the white cover, so there were no sharp shadows.
