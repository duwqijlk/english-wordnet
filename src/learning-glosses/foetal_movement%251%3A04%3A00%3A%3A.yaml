simpleMeaning: The stir of an unborn child inside the womb, most often felt by the 16th week of being
  with child.
scope: This is the stir of an unborn child inside the womb, not a kick felt after birth, and it is also
  called fetal movement.
examples:
- She felt foetal movement for the first time.
- Foetal movement can be felt by the 16th week.
