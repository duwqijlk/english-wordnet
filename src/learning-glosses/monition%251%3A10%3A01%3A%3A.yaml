simpleMeaning: Advice that warns you about something about to happen, above all danger or something nasty
scope: Advice that warns you about something about to happen, above all danger or something nasty; warning
  and admonition are other names for this, not a court order to show cause.
examples:
- His monition warned us that danger was near.
- The letter was a monition about the floods to come.
