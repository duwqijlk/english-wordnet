simpleMeaning: Working out the right amounts of drugs and medicines to give is what this part of the study
  of drugs does
scope: The study of how much of a drug or a medicine to give, not the making of drugs and not the study
  of how a drug works in the body.
examples:
- The posology of the new drug was worked out before it was given to patients.
- Doctors follow the posology set out in the guide when they give the medicine.
