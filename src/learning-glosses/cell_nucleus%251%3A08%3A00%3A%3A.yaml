simpleMeaning: a part inside the smallest living unit that holds DNA and RNA, the stuff that tells it
  how to grow and make more of itself
scope: 'Also called karyon or nucleus: the part inside a living thing''s smallest unit that holds the
  plans for growth and making more of itself, not the outer skin of the unit and not the jelly inside
  it.'
examples:
- Under the microscope, the cell nucleus stood out as a dark round spot.
- The cell nucleus holds the plans that tell the cell how to grow.
