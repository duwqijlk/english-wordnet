simpleMeaning: Bunches of white flowers and small bright red berries mark this Old World bush, which loses
  its leaves in winter and grows in thickets.
scope: People also call this bush crampbark and cranberry tree, and its white flowers and small bright
  red berries mark it out.
examples:
- The guelder rose bore clusters of red berries.
- We planted a guelder rose.
