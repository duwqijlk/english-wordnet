simpleMeaning: A small rectangular music tool with a row of thin reeds (thin parts that make sound) set
  back in air holes, played by blowing into the hole you want
scope: This small music tool, also called harp, mouth harp and mouth organ, is played by blowing into
  holes; it is not a large harp with strings.
examples:
- He played a song on his harmonica around the fire.
- She keeps a small harmonica in her pocket and blows into it to make music.
