schema: oewn-learning-gloss-v2
senseId: 'modulate%2:30:05::'
synsetId: 00123702-v
simpleMeaning: to change how often electromagnetic waves (waves like radio and light) rise and fall, how
  strong they are, how their pattern is timed, or another quality
scope: This is about changing radio or light waves; it is not about changing the pitch, tone, or volume
  of a sound, and not about changing the pitch of your voice when you speak.
examples:
- Engineers modulate the radio wave to carry the music signal.
- The device can modulate the wave that sends data to the receiver.
