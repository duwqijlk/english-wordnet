simpleMeaning: A brittle grey crystalline element, a metalloid like silicon that conducts electricity
  in some conditions; used in transistors and found in the minerals germanite and argyrodite.
scope: The chemical element itself, not the minerals germanite or argyrodite that contain it, and not
  silicon, which it resembles.
examples:
- Early transistors were made from germanium rather than silicon.
- The lab tested the mineral for germanium content.
