simpleMeaning: In geology, the study of the shape, make-up, and change over time of rocks and land forms.
scope: Also called geomorphology, the branch of geology that studies rocks and land forms, not the branch
  of biology that studies the structure of animals and plants.
examples:
- She studied the morphology of the river valley.
- The morphology of the rocks showed how the land had changed.
