simpleMeaning: In Christianity, the home of Satan and the forces of evil, where people who have done wrong
  are punished for ever
scope: In Christianity, the place where evil powers live and people who do wrong suffer for ever, not
  the hard seed part inside fruit, and not a hole or low place in the ground.
examples:
- Old stories tell of a demon that came from the pit.
- The priest warned that bad deeds could send a soul to the pit.
