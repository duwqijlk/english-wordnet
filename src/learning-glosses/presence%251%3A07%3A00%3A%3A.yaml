senseId: 'presence%1:07:00::'
synsetId: 04917554-n
simpleMeaning: A calm, self-assured way of behaving that makes other people respect you.
scope: How a person carries themselves with dignity; not the fact of being in a place, not a felt sense
  that something unseen is near, and not a spiritual being.
examples:
- The young officer had a quiet presence that made the whole room listen.
- Her stage presence was so strong that no one noticed the faulty lighting.
