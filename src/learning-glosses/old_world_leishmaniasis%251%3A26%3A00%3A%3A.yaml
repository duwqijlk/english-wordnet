simpleMeaning: A sickness of the skin, marked by open sores that break the skin and stay open.
scope: Also called cutaneous leishmaniasis, oriental sore, tropical sore, Aleppo boil and Delhi boil;
  a sickness of the skin with open sores that break the skin and stay open.
examples:
- Old World leishmaniasis leaves open sores on the skin.
- The doctor treated the Old World leishmaniasis on the boy's arm.
