simpleMeaning: In maths, a number found by dividing the length of the side across from an angle by the
  length of the longest side of a triangle with a 90-degree corner
scope: 'Also called sin: a number got from the sides of a triangle with a 90-degree corner. It is not
  sin as a wrong act, and not the numbers got in other ways from the triangle, such as cosine or tangent.'
examples:
- The sine of this angle is 0.5.
- In class we learned how to find the sine of an angle in a right-angled triangle.
