simpleMeaning: a round part of a long, tube-shaped tool, usually at one end
scope: This is the round part of a tool, usually at one end, not a lamp and not a round wider part inside
  the body.
examples:
- She squeezed the bulb of the syringe to draw up the liquid.
- The bulb at the end of the tube filled with air when he pressed it.
