simpleMeaning: to cover a hurt part of the body with a substance that helps it heal
scope: 'Also called plaster: this is the act of covering a hurt part to help it heal, not the soft warm
  mass itself that is put on the skin.'
examples:
- She poulticed his sore leg with the warm mixture.
- The nurse poulticed the wound and then covered it with cloth.
