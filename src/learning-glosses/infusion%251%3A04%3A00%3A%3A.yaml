simpleMeaning: In medicine, letting a fluid, a drug or salts in liquid (an electrolyte) go into a vein
  or between tissues without being pushed, as when gravity moves it down
scope: In medicine, this is the act of letting a fluid or drug go into the body in this way, not the act
  of adding a new quality and not a drink made by soaking a plant in water.
examples:
- The patient was given a drug by infusion into a vein.
- The infusion let the fluid flow slowly into the tissues by gravity alone.
