simpleMeaning: A break in which the bone falls in on itself, above all in short bones such as the bones
  of the back
scope: A break in which the bone falls in on itself, above all in short bones such as the bones of the
  back; not a break where the bone is pulled apart and not a break in a long bone.
examples:
- The compression fracture made the bone fall in on itself.
- A compression fracture of the back is common in old age.
