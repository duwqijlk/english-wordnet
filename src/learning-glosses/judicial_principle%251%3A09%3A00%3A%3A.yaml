simpleMeaning: In law, when judges set out the law, they work from a basic idea that lies under it
scope: In law, a basic idea that lies under the way the law is made and set out, also called judicial
  doctrine or legal principle; not a single rule of law and not a court ruling.
examples:
- The judicial principle guided the court's reading of the law.
- A judicial principle underlies the way the law is made.
