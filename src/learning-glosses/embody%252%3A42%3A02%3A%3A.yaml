simpleMeaning: To show an idea or feeling in a thing you can see or touch.
scope: To give an idea or feeling a form you can see or touch, not merely to hold it in mind.
examples:
- This painting embodies the feelings of the Romantic period.
- Her speech embodied the hopes of the whole town.
