senseId: 'disparagingly%4:02:00::'
synsetId: 00318955-r
simpleMeaning: in a way that speaks of a person or thing as having little value or worth
scope: Speaking of someone or something as if it is of little worth; not praising it, and not just describing
  it in a fair, even way.
examples:
- He spoke disparagingly about the new plan, calling it a waste of time.
- She wrote disparagingly of the town, saying there was nothing good in it.
