simpleMeaning: A flat piece under a plane's wing that is pushed down to slow the plane as it comes down
  to the ground.
scope: A flat piece under a plane's wing that is pushed down to slow the plane as it comes down to the
  ground; not a piece on top of the wing, and not a piece that lifts the plane.
examples:
- The pilot lowered the landing flap before touching down.
- A landing flap helps the plane slow for landing.
