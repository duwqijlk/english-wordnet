simpleMeaning: a piece of clothing made of mixed-color cloth, such as the clothes of a court jester
scope: Clothes of mixed colors, above all a jester's costume, not the cloth itself and not a mixed group
  of things.
examples:
- The jester danced in his bright motley.
- He wore motley to the fair and made the children laugh.
