simpleMeaning: A rare, long-lasting brain illness from the measles virus that slowly gets worse, mostly
  in children and young adults; death usually within three years, after first measles before age two.
scope: A rare brain illness from the measles virus, also called inclusion body encephalitis, sclerosing
  leukoencephalitis, subacute inclusion body encephalitis, subacute sclerosing leukoencephalitis, subacute
  sclerosing panencephalitis, Bosin's disease, SSPE or Van Bogaert encephalitis; not ordinary measles
  and not a sudden brain fever.
examples:
- Dawson's encephalitis is a rare illness that follows measles in childhood.
- Doctors found Dawson's encephalitis in the young patient after his early measles.
