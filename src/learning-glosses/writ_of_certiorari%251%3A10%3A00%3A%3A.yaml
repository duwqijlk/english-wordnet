simpleMeaning: a written order under common law from a higher court to a lower court that demands the
  record of a case
scope: This is a written order from a higher court that demands the record of a case, and certiorari is
  another name for this sense, not an order to free goods that were kept back or a court order of any
  other kind.
examples:
- The high court sent a writ of certiorari to the lower court for the record of the case.
- Her lawyer asked for a writ of certiorari so the higher court could look at the case.
