simpleMeaning: A male worker who plans how a firm or a well-known person is talked about in public.
scope: Also called public relations man and publicity man; a male worker who plans how a firm or a well-known
  person is talked about in public, not a reporter and not a seller.
examples:
- The PR man arranged a press day for the new firm.
- The PR man spoke to reporters about the firm's new plan.
