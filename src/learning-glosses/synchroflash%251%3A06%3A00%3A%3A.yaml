senseId: 'synchroflash%1:06:00::'
synsetId: 04382167-n
simpleMeaning: a device in photography that times a flash to go off at its brightest just as the camera
  shutter opens
scope: A device that times a camera flash with the shutter; not the flash itself and not the camera shutter
  alone.
examples:
- The old camera needed a synchroflash to catch the flash at full strength.
- He fitted a synchroflash so the picture was lit at the right moment.
