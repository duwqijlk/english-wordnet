simpleMeaning: Small white flowers like little bells grow on this showy shrub of the southeast of the
  United States, which keeps its leaves through the year.
scope: It is also called a fetterbush or a mountain andromeda, and it is a showy shrub of the southeast
  of the United States with small white flowers like little bells.
examples:
- The mountain fetterbush keeps its leaves all year.
- The flowers of the mountain fetterbush are small, white, and shaped like little bells.
