simpleMeaning: An animal that steps only on its toes, keeping the rest of each foot off the ground, like
  a dog, a cat, or a horse
scope: An animal that walks on its toes alone, not one that walks flat-footed; digitigrade mammal is another
  name for this sense.
examples:
- The digitigrade moved on its toes, like a cat.
- Dogs are digitigrade, walking on their toes rather than flat feet.
