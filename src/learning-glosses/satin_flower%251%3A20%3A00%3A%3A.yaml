simpleMeaning: Round flat seed pods, thin as paper and silver-white, are dried from a southeast Europe
  plant for setting about the house, after its sweet-smelling purple blooms
scope: A southeast European plant grown for purple flowers and silver-white seed pods, not a plant grown
  for food; honesty, money plant, satinpod and silver dollar are other names for this sense.
examples:
- Satin flower brightens the garden with purple blooms in spring.
- She dried the satin flower seed pods for a winter display.
