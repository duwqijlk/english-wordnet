simpleMeaning: a way of fishing in which you pull a line with food on its hook through the water
scope: Also called troll, this is fishing with a moving line; it is not writing mean or angry comments
  on the internet.
examples:
- Trolling from the slow boat caught two fish before lunch.
- He spent the morning trolling along the edge of the lake.
