simpleMeaning: The body feels itself through the skin, the limbs, and the parts inside, so a person knows
  what it is doing.
scope: Also called somaesthesia, somaesthesis, somataesthesis, somatesthesia, somatic sense, somatic sensory
  system, somesthesia, or somesthesis, it is how the body is felt from within, not by sight or hearing.
examples:
- The somatosensory system lets a person feel a touch on the skin.
- Through the somatosensory system, a person feels the strain in the shoulders.
