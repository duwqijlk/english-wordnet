simpleMeaning: In computer science, a set of magnetic plates that can be carried around, used in a machine
  that stores data.
scope: In computer science, a portable set of magnetic plates for storing data, also called a disk pack;
  not a single plate and not a paper file.
examples:
- The disc pack holds the old records.
- She carried the disc pack to the next machine.
