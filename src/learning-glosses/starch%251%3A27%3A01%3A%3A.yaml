simpleMeaning: a shop-bought mix, made from a plant powder, used to make cloth stiff when it is washed
scope: A shop-bought mix that makes washed cloth stiff, not the act of putting it on cloth.
examples:
- She added starch to the rinse to make her husband's shirts stiff.
- A little starch keeps the collars of my shirts standing up.
