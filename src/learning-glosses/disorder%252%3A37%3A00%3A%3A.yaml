simpleMeaning: to trouble the mind and make a person feel uneasy, worried or afraid
scope: 'Also called trouble, distract and disquiet: this is troubling a person''s mind and making them
  worried, not making a place or thing untidy.'
examples:
- The bad news disordered her mind for days.
- His son's illness disordered his thoughts and left him afraid.
