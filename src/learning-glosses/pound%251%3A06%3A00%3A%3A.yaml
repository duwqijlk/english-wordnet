simpleMeaning: a public enclosure where dogs that have wandered off or lack a licence are kept.
scope: A place where stray dogs are kept, not the act of putting an animal there or the common verb meaning
  to hit.
examples:
- The stray dog spent three days in the pound before we found it.
- The city opened a new pound for unlicensed dogs.
