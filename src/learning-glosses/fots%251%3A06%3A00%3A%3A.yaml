simpleMeaning: A way to send messages through thin threads that carry light.
scope: Also called fiber-optic transmission system (or fibre-optic transmission system), it sends messages
  through thin threads that carry light, not through wires that carry power.
examples:
- The office uses FOTS to link its computers.
- FOTS carries our calls through cables under the street.
