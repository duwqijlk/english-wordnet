simpleMeaning: a shared way of working in which two or more people are paired up to help each other and
  stay safe, above all when swimming for fun
scope: This is a shared way of working in which two or more people are paired up to help each other and
  stay safe, above all when swimming for fun, not a sports team and not a lifeguard.
examples:
- The buddy system kept the young swimmers safe.
- They used the buddy system on the hike.
