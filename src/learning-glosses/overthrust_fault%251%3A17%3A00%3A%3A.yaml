simpleMeaning: In geology, a break in rock where the top side seems to have been pushed up by squeezing.
scope: In geology, a break in rock with the top side pushed up; not a break where the sides slide past
  each other and not a crack with no movement.
examples:
- The overthrust fault pushed the top layer of rock up over the rock below it.
- An overthrust fault shows rock pushed up over rock below.
