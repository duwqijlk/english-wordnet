simpleMeaning: The long piece of fabric at the back of a dress that trails along the floor behind the
  wearer.
scope: The long piece of fabric attached to the back of a dress, not a railway service, a line of coupled
  cars, or travel by rail; not an ordered series of things or events, a file of pack animals, or a chain
  of consequences; not a set of gears; and not any act of teaching, learning, coaching, fitness exercise,
  child or animal discipline, plant shaping, aiming, or dragging.
examples:
- Her silk train whispered across the floor as she walked to the altar.
- The bride asked her sister to carry the train of her wedding dress.
