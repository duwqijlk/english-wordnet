simpleMeaning: To say or cry out a thing again and again, loudly and with force
scope: To cry out a thing loudly and again and again, not the loud noise itself and not making a person
  act by crying out.
examples:
- The crowd clamored for the gates to be opened.
- Fans clamored for one more song.
