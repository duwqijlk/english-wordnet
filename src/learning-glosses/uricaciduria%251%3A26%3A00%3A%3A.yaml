simpleMeaning: Uric acid in the urine stands above its usual amount, a sign of gout.
scope: This is a urine finding that points to gout, with too much uric acid in the urine.
examples:
- The urine test showed uricaciduria, with too much uric acid.
- Too much uric acid in the urine pointed to uricaciduria.
