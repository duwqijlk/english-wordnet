simpleMeaning: saying the same word or words again at the start of each clause that follows the last
scope: 'Also called anaphora: the same word or words said again at the start of each clause, not a word
  said again at the end of a clause and not a single use of a word.'
examples:
- 'In his speech, the epanaphora stood out: every clause began with the words ''I have a dream''.'
- The poet used epanaphora, starting each new clause with the same word.
