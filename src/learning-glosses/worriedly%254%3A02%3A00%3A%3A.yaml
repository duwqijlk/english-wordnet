simpleMeaning: in a way that shows you feel uneasy and think something bad may happen
scope: Said or done in a way that shows unease about what may happen; it is not done in a calm or sure
  way.
examples:
- '''I can''t find my keys,'' she said worriedly.'
- He looked worriedly at the dark clouds before setting off on the trip.
