simpleMeaning: The hours when daylight is fading, after the afternoon and before full dark.
scope: The last part of the day, from late afternoon until nightfall, also called even, evening, or eve.
examples:
- They walked home in the eventide, as the light faded.
- Eventide fell over the lake, and the lamps were lit.
