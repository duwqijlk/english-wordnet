simpleMeaning: In the nests of spiders and wasps, the young of this bug that looks like a mantis live
  off others.
scope: It looks like a mantis, but its young live off others in the nests of spiders and wasps.
examples:
- A mantispid looked much like a mantis.
- Young mantispids lived in the wasps' nest, feeding off their hosts.
