simpleMeaning: Pulling the shoulder blade toward the backbone and a little up is the work of this diamond-shaped
  muscle.
scope: Lesser rhomboid muscle and rhomboid minor muscle are other names for this diamond-shaped muscle,
  which pulls the shoulder blade toward the backbone and a little up.
examples:
- The musculus rhomboideus minor pulled the shoulder blade toward the backbone.
- The musculus rhomboideus minor moved the shoulder blade a little up.
