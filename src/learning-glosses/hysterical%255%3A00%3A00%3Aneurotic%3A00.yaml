simpleMeaning: Showing or caused by a kind of illness of the mind called hysteria
scope: This sense is about hysteria, an illness of the mind; it is not the sense of showing very strong
  feelings that a person cannot control.
examples:
- The doctor said her loss of memory was hysterical amnesia.
- His hysterical blindness was caused by illness, not by damage to his eyes.
