simpleMeaning: The study of a language as it is at one point in time, covering its sounds, word shapes,
  sentence order and meanings, without judging it
scope: This is the study of a language as it is at one point in time, not telling people how they ought
  to speak and not the history of the language.
examples:
- Her work in descriptive linguistics looks at how people really speak.
- Descriptive linguistics records a language without judging it.
