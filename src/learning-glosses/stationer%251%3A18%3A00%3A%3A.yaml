simpleMeaning: a person who sells paper, pens, and other things used for writing and office work
scope: The person who sells things for writing and office work, not the things themselves and not a person
  who sells books.
examples:
- The stationer sold her paper and a new pen.
- He bought office paper from the stationer near his work.
