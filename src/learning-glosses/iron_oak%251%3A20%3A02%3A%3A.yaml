simpleMeaning: a medium-sized tree of the southwest United States and northwest Mexico that keeps its
  leaves all year, with long tough leaves that are often sharp at the edges
scope: 'Also called canyon live oak, canyon oak, and maul oak: a medium-sized tree of the southwest United
  States and northwest Mexico, not the small eastern tree called iron oak in another sense.'
examples:
- The iron oak keeps its leaves through the dry winter.
- An iron oak stood beside the road in the southwest desert.
