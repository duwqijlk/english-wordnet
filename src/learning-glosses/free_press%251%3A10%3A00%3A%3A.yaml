simpleMeaning: news reporting that the government does not control or limit when it covers politics or
  ideas
scope: News reporting the government does not control, not a printing machine and not a news service that
  must print what the government says.
examples:
- A free press lets reporters write about the government without fear.
- The country prided itself on having a free press.
