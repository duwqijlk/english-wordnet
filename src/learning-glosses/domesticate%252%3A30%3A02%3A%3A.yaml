simpleMeaning: to make a plant or animal fit for growing, for living with people, and for use by people
scope: This sense is about making plants or animals fit to grow, live with people and be used by people,
  not just about making a wild animal calm and easy to control.
examples:
- People domesticated wheat thousands of years ago.
- Farmers domesticated wild pigs for food.
