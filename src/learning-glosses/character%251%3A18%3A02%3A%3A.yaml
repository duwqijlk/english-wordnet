simpleMeaning: a made-up person in a story, play, or film.
scope: It is not a real person's moral nature, the special quality of a place, or a letter on a page;
  it is a made-up person.
examples:
- My favourite character in the book is the old sailor.
- She plays a funny character in the new film.
