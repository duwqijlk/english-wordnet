simpleMeaning: A set of people who come together to take on one job, such as sorting out a question, choosing
  who wins a contest, or something else of that kind
scope: A group gathered for one special purpose, not the group called for jury service and not a flat
  sheet.
examples:
- The panel met to discuss the new school rules.
- A panel of judges chose the winner of the contest.
