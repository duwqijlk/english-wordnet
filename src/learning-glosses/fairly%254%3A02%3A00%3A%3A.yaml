simpleMeaning: in a way that does not give one side a better chance than the other
scope: 'Also called fair: this is treating both sides in the same way; it is not the sense about following
  the rules without cheating.'
examples:
- The teacher treated all the children fairly.
- The judge decided the case fairly, giving both sides time to speak.
