simpleMeaning: A leaf with wide parts that stay joined, cut almost to the middle rib and not split into
  separate small leaves.
scope: This leaf shape has wide parts, unlike the narrow parts of pinnatisect.
examples:
- The pinnatifid leaf was cut almost to the middle rib.
- A pinnatifid leaf keeps its wide parts joined.
