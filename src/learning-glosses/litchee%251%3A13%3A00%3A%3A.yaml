simpleMeaning: a Chinese fruit, often dried, with a thin case that cracks at a light touch, holding soft
  sugary flesh like jelly round one seed
scope: 'Also called lychee, leechee, lichee, lichi, litchi, and litchi nut: a Chinese fruit with a thin
  shell and sweet soft flesh round one seed, not a real nut and not a fruit with many seeds.'
examples:
- We ate fresh litchees at the market.
- She peeled a litchee and ate the sweet flesh inside.
