senseId: 'alveolitis%1:26:01::'
synsetId: 14281495-n
simpleMeaning: A sore swelling in the socket of a tooth; it at times sets in after the tooth is pulled
  and no blood clot forms.
scope: Also called dry socket, this is a sore swelling in the socket of a tooth, not a sore swelling of
  the tiny air sacs in the lungs.
examples:
- Alveolitis set in after the tooth was pulled.
- No blood clot formed, and alveolitis set in.
