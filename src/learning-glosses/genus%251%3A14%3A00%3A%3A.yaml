simpleMeaning: In biology, a group used to sort living things, made up of one or more kinds
scope: In biology this is a sorting group holding one or more close kinds. It is not one kind itself,
  a smaller group, and not the larger group called family above it.
examples:
- The genus Panthera includes lions and tigers.
- Wolves and dogs belong to the same genus, Canis.
