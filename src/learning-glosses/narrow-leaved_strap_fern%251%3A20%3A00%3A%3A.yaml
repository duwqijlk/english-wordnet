simpleMeaning: a fern with leaves not as long or as wide as the Florida strap fern's, found from Florida
  through the West Indies and Mexico south to Argentina
scope: A fern with short narrow leaves that grows from Florida south to Argentina, not the Florida strap
  fern with longer wider leaves and not a common garden fern.
examples:
- The narrow-leaved strap fern grew beside the path in the shade.
- We found a narrow-leaved strap fern growing near the stream.
