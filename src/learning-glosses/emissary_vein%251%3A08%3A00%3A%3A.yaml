simpleMeaning: Veins outside the skull take blood from hollow spaces in the tough cover of the brain,
  through one of the veins in the scalp and head
scope: 'Also called vena emissaria: one of the veins that drain blood from inside the skull to the outside,
  not a vein that brings blood into the brain.'
examples:
- The emissary vein drains blood from the dura mater.
- Surgeons take care near an emissary vein during head surgery.
