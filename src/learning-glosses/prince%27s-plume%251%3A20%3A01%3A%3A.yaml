simpleMeaning: A tall, showy annual from tropical America, with hairy stems, deep purple-flushed leaves
  and long spikes of usually red flowers; people often eat its seeds as a cereal.
scope: Another name for the tall grain plant also called purple amaranth; not the southwestern perennial
  with leathery blue-green leaves and yellow plumes, nor the Asian annual with drooping crimson spikes.
examples:
- Prince's-plume stood head-high, its red flower spikes rising over purple-washed leaves.
- She ground the seeds of prince's-plume to make a coarse cereal.
