simpleMeaning: a fast series of short, loud sounds, like the sounds in the chest of a person who is ill
  and has trouble breathing
scope: A quick run of short loud sounds, such as the sounds in a sick person's chest; not a baby's toy
  and not the hard parts on a rattlesnake's tail.
examples:
- A faint rattle in his chest told the doctor his breathing was worse.
- The death rattle is a series of short sounds in a dying person's throat.
