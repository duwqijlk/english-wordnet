simpleMeaning: A double salt used in Seidlitz powder to loosen the bowels.
scope: Also called potassium sodium tartrate and Rochelle salt, this double salt is used in Seidlitz powder
  to loosen the bowels, not a single salt.
examples:
- Rochelle salts are used in Seidlitz powder.
- The doctor gave him Rochelle salts as a laxative.
