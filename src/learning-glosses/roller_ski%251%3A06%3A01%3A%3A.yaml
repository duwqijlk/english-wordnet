simpleMeaning: a long, narrow board with wheels on the bottom, used to move on hard, dry ground when there
  is no snow
scope: A wheeled board for moving on dry ground without snow, not a snow ski and not a skateboard.
examples:
- He trained on roller skis all summer.
- She put on her roller skis and pushed off down the road.
