simpleMeaning: Dead flesh that has gone dry and dark brown where blood can no longer flow through a blocked
  blood tube
scope: Also called dry gangrene, mumification necrosis or mummification, this is dead flesh gone dry and
  dark brown where a blocked blood tube stops the blood from flowing.
examples:
- Cold gangrene left the dead flesh dry and dark brown.
- Cold gangrene sets in where a blocked blood tube stops the blood from flowing.
