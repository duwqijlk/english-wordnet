simpleMeaning: A person is aware of the body through touch, through the place of the limbs, and through
  the parts inside, not through sight or hearing.
scope: Also called somaesthesia, somaesthesis, somataesthesis, somatesthesia, somatic sense, somatic sensory
  system, somatosensory system, or somesthesis, it is awareness of the body itself, not sight or hearing.
examples:
- Through somesthesia, a person feels the warmth of the hands.
- Through somesthesia, a person knows where the limbs are.
