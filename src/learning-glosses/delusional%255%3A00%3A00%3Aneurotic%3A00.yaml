simpleMeaning: Believing things that are not true and holding on to those false beliefs
scope: A mind that holds false beliefs as true, not a single wrong idea and not a passing mistake.
examples:
- After the accident, he became delusional and insisted that strangers were following him.
- Her delusional fear made her lock every door in the house.
