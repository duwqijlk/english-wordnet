simpleMeaning: Work made by people with no training in making it, who do not see themselves as makers
  of such work, including things built out of doors.
scope: Work made by people with no training; naive art is another name for this sense, not work by trained
  makers and not folk craft made for use.
examples:
- The gallery showed outsider art by self-taught makers.
- Outsider art hangs beside the trained painters' work.
