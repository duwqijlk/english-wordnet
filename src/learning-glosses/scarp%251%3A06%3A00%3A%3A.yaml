simpleMeaning: a steep slope made by people in front of a strong building or wall made for war
scope: 'Also called escarpment: this slope is made by people in front of a place built for war, not a
  long natural steep slope or cliff at the edge of high land.'
examples:
- Soldiers had to climb the steep scarp in front of the fort.
- The scarp rose sharply before the castle walls.
