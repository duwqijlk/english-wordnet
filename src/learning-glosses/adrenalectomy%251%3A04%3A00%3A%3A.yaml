senseId: 'adrenalectomy%1:04:00::'
synsetId: 00667350-n
simpleMeaning: an operation to take out one or both of the body parts near the kidneys that make body
  chemicals
scope: This is an operation to take out one or both adrenal glands, not an operation on a kidney and not
  a drug that treats the glands.
examples:
- The surgeon planned an adrenalectomy for next week.
- After the adrenalectomy, he took medicine to replace the body chemicals the glands had made.
