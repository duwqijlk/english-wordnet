simpleMeaning: a small lined animal of eastern America, living partly on the ground, with pouches in its
  cheeks
scope: This is a small lined animal of eastern America, also called eastern chipmunk, ground squirrel
  and hackee; not a tree animal and not a large ground animal.
examples:
- The striped squirrel stuffed seeds into its cheek pouches.
- A striped squirrel ran across the path and into its burrow.
