simpleMeaning: A fruit, most of all a peach, whose soft inside sticks fast to the stone
scope: For a peach or other fruit whose flesh holds fast to the stone, not the verb for holding on to
  a person or an idea.
examples:
- This cling peach is hard to cut away from the stone.
- The cling peach was sweet, but its flesh stuck to the stone.
