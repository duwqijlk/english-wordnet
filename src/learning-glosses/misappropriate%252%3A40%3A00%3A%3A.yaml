simpleMeaning: To take for your own use, by cheating, what was put in your care
scope: 'Embezzle, defalcate, malversate and peculate are other names for this sense: to take for your
  own use, by cheating, what was put in your care, not a plain theft and not an honest mistake.'
examples:
- The treasurer misappropriated funds from the club.
- She misappropriated money that had been left in her care.
