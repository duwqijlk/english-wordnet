simpleMeaning: a state in which the bones of a joint stick fast together and the joint cannot move
scope: This is a joint whose bones have stuck fast together so it cannot move, also called ankylosis,
  not a joint that is only stiff for a short time.
examples:
- Anchylosis of his knee left the leg fixed straight.
- The doctor said anchylosis had joined the bones of her finger joint.
