simpleMeaning: Two veins of the arm run on together into one vein, which then becomes the vein under the
  collar bone.
scope: It is the vein that carries on from the two veins of the arm into the vein under the collar bone,
  also called vena axillaris.
examples:
- The axillary vein carries blood from the arm toward the chest.
- A clot formed in the axillary vein after the injury.
