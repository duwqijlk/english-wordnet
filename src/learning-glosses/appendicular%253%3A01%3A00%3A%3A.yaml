simpleMeaning: To do with a limb or other part that sticks out from the body, above all the arms and legs.
scope: This describes a limb or a part that sticks out from the body, above all the arms and legs; not
  the main trunk of the body and not a part inside the body.
examples:
- The appendicular skeleton holds the bones of the arms and legs.
- Appendicular muscles move the limbs.
