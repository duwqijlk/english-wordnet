simpleMeaning: short and thick, for example with short legs and heavy muscles
scope: This word tells how a person or thing looks, short and thick, not the act of sitting low with bent
  knees and not living in a house without the right to be there.
examples:
- The small church has a squat tower.
- He is a squat man with short, strong legs.
