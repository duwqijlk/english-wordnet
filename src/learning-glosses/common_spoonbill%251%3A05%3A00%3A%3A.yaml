simpleMeaning: A pure white water bird with a tuft on its head and a wide flat bill, found in southern
  Eurasia and northeastern Africa
scope: A pure white water bird with a wide flat bill and a tuft on its head, not a heron or another long-legged
  water bird.
examples:
- We saw a common spoonbill feeding in the shallow lake.
- The common spoonbill swept its wide bill from side to side in the water.
