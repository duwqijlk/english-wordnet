senseId: 'cirque%1:17:00::'
synsetId: 09268421-n
simpleMeaning: A hollow in a mountain with steep walls all round it in a half circle, which may hold a
  lake.
scope: A half-circle hollow with steep walls in a mountain, also called corrie and cwm; not a wide valley
  and not a round hole left by a volcano.
examples:
- The cirque held a small lake at the foot of the cliffs.
- They climbed down into the cirque to camp beside the water.
