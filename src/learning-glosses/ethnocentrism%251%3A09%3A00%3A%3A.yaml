simpleMeaning: the belief that one's own people are better than all other peoples
scope: The belief that one's own people are better than all other peoples, not pride in one's own ways
  and not a dislike of strangers.
examples:
- His ethnocentrism made him look down on every other group.
- Ethnocentrism kept her from seeing the good in other peoples' ways.
