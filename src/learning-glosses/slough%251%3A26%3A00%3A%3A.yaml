simpleMeaning: body tissue that has died, or a lump or part of the body made of such dead tissue
scope: This is dead body tissue, also called gangrene, not an outer skin a snake drops off and not a wet
  swamp area.
examples:
- The doctor cut away the slough from the wound.
- Black slough formed on his wounded leg.
