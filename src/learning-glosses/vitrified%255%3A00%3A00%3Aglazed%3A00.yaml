simpleMeaning: In ceramics, the surface made bright and sealed against water by melting a glass-like wash
  onto it.
scope: Of clay ware, also called glassy, with a bright sealed surface made by melting a glass-like wash
  on it.
examples:
- The tiles were vitrified and shone like glass.
- This vitrified china will not soak up water.
