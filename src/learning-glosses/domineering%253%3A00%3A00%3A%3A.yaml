simpleMeaning: often trying to control other people and make them do what you want
scope: This describes a person who tries to run other people's lives, not a person who is simply firm,
  and not a king or ruler by position.
examples:
- Her domineering father chose all her friends for her.
- He is a domineering boss who will not let his staff decide anything.
