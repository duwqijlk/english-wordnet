simpleMeaning: a strong early supporter of a cause or of a change to make things better
scope: This sense is a strong early supporter of a new cause or change, not a religious messenger and
  not a supporter who joins much later.
examples:
- He was an early apostle of free schools for all children.
- As an apostle of reform, she spoke for changes to the prison system.
