simpleMeaning: Any of several plants whose leaves stand on the stem in such a way that they point to north,
  south, east and west
scope: Any of several plants whose leaves point to north, south, east and west; compass plant is another
  name for this sense, not a sunflower and not a plant whose leaves turn to follow the sun.
examples:
- The compass flower grows by the path, its leaves pointing north and south.
- We found a compass flower whose leaves showed the way north.
