simpleMeaning: one of several usually long-haired breeds of animal kept to herd and guard sheep
scope: A long-haired breed kept to herd and guard sheep, also called a sheepdog and a sheep dog; not a
  hunting dog and not a pet kept only for show.
examples:
- The shepherd dog watched over the flock all night.
- Our shepherd dog herds the sheep each morning.
