simpleMeaning: to make a product using powered tools or equipment rather than by hand.
scope: This is not the sense of cutting or finishing an existing piece; it is about making the whole product
  with powered equipment.
examples:
- The factory machines thousands of these bolts every day.
- The parts are machined in a workshop behind the shop.
