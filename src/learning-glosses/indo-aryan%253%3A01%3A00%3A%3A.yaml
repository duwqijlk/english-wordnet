simpleMeaning: Said of things that belong to the former Indo-European people or show what they were like.
scope: Also called Aryan and Indo-European, this word marks things of the former Indo-European people,
  not the branch of languages of the other sense.
examples:
- The Indo-Aryan peoples moved across the plains long ago.
- Indo-Aryan art shows the life of that old people.
