simpleMeaning: complete and without any limit, used in informal speech to make a word stronger, often
  to show dislike
scope: 'Also called perfect, complete, staring, utter, pure, gross and stark: used to mean total, with
  no limit. This is the strengthening use, not careful and exact, and not done fully in every part.'
examples:
- He is a thorough fool and never listens to anyone.
- What a thorough mess they made of the kitchen.
