senseId: 'hypertrophic_cardiomyopathy%1:26:00::'
synsetId: 14134615-n
simpleMeaning: A disorder in which the heart muscle is so strong that it does not relax enough to fill
  with blood, so it pumps less well
scope: This is a disorder in which the heart muscle is so strong that it does not relax enough to fill
  with blood, not a weak heart muscle and not a blocked blood vessel.
examples:
- Hypertrophic cardiomyopathy made her heart pump less well.
- The doctor found hypertrophic cardiomyopathy in the scan.
