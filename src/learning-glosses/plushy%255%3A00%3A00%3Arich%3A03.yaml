senseId: plushy%5:00:00:rich:03
synsetId: 02032677-s
simpleMeaning: Marked by rich overflow, beyond all need.
scope: This sense is also called plush and lavish, for being marked by rich overflow, beyond all need,
  where plush is full of costly things, with far more than is needed, and lavish is with far more than
  is needed, given freely and in great amounts, unlike the sense for being, of cloth, like plush.
examples:
- The feast was plushy, marked by rich overflow.
- The room was plushy, beyond all need.
