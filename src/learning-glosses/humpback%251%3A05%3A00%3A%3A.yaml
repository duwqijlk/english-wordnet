simpleMeaning: a large whalebone whale (a whale with hard plates in its mouth instead of teeth) with long
  flippers, known for bending its back as it dives down
scope: Also called humpback whale. This is the large sea animal, not a curved back and not a person with
  a hunched back.
examples:
- From the boat we watched a humpback bend its back and dive deep.
- The humpback used its long flippers to turn in the water.
