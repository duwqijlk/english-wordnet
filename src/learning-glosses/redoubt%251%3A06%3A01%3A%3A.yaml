simpleMeaning: In the military, a strong place built for a short time or as an extra, typically square
  or with many sides, with nothing at its sides to guard it
scope: 'A short-time or extra strong place made by soldiers, not the other sense: a strong safe place
  people go to when they are in danger.'
examples:
- The men quickly built a square redoubt of earth before the attack.
- A temporary redoubt was added beside the main fort.
