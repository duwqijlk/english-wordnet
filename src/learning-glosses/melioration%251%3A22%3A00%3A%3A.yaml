simpleMeaning: Over time, a word in a language gains a better sense or a higher sense
scope: A word slowly gains a better or higher sense over time; not a word gaining a worse sense and not
  a change in how a word sounds.
examples:
- The word 'nice' shows melioration, since it once meant foolish and now means kind.
- Melioration made the word 'knight' rise from servant to a title of honour.
