simpleMeaning: To utter words no one can follow, as people do when caught up by holy joy
scope: This is speech that no one can follow, made when a person is caught up in holy joy, not words in
  a foreign language and not shouting in worship.
examples:
- The parishioners spoke in tongues during the service.
- She spoke in tongues, and no one understood a word.
