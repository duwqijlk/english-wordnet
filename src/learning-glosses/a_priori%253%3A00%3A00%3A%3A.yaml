simpleMeaning: based on thought that starts from a general rule and works out what must follow, with no
  facts to back it up
scope: This is a judgment reached by thought alone from a general rule; not a judgment based on facts
  or on what has been seen.
examples:
- An a priori judgment comes from reason, not from tests or facts.
- She made an a priori claim about what must happen, without checking the facts.
