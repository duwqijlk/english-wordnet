simpleMeaning: A plant with white and lavender to pale-blue flowers in neat rings of wide-spaced bands
  around the stems, like a tiered tower; it grows in California.
scope: Also called Collinsia heterophylla, innocense, or purple chinese houses; a California wildflower
  with ringed bands of white and pale-blue flowers, kin to other ring-flowered wildflowers.
examples:
- Collinsia bicolor blooms along the trail, its flowers in neat rings around the stem.
- We saw Collinsia bicolor with white and lavender flowers in California.
