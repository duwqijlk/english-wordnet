simpleMeaning: Red blood cells carry oxygen with this clear protein, left when the red part is taken out
  of blood.
scope: The protein left after the red part is taken out of blood, not the whole red blood substance itself.
examples:
- The lab made globin by taking the red part out of blood.
- Globin is the part of blood that carries oxygen to the body.
