simpleMeaning: A colourless protein made by taking heme out of hemoglobin, the oxygen-carrying substance
  in red blood cells.
scope: It is the colourless protein left after heme is removed from hemoglobin, not hemoglobin itself.
examples:
- The lab made globin by taking heme out of hemoglobin.
- Globin is what remains after heme is taken out of hemoglobin.
