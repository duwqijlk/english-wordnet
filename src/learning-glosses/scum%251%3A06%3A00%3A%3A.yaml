simpleMeaning: a thin layer of dirt or green growth that can form on top of a liquid
scope: A dirty layer on the top of a liquid, not the liquid itself and not dirt settled at the bottom.
examples:
- Scum had formed on the surface of the pond.
- She skimmed the scum off the top of the soup.
