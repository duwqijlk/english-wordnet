simpleMeaning: a way of finding the weights of tiny charged bits of matter
scope: A way of finding the weights of tiny charged bits of matter; not a way of weighing large things
  and not the study of light alone.
examples:
- Mass spectroscopy showed the sample held two kinds of ions.
- The lab used mass spectroscopy to weigh the charged bits.
