simpleMeaning: The coasts of the northwestern Pacific are where it lives.
scope: Also called Kamchatkan sea eagle and Stellar's sea eagle, this is the one that lives on the coasts
  of the northwestern Pacific, not the eagles of Europe or North America.
examples:
- We watched a Haliaeetus pelagicus fly over the coasts of the northwestern Pacific.
- Haliaeetus pelagicus lives on the coasts of the northwestern Pacific.
