simpleMeaning: a new-style dance from Latin America, done in a dance hall, with small steps and swaying
  hips
scope: A new-style dance from Latin America, done in a dance hall, with small steps and swaying hips;
  cha-cha is another name for this sense, not a slow waltz and not a folk dance.
examples:
- The cha-cha-cha is a lively dance from Latin America.
- She taught them the cha-cha-cha at the dance class.
