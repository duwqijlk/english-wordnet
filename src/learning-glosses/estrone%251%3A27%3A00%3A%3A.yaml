simpleMeaning: A weak female sex hormone made naturally by the ovaries of mammals, also made artificially
  under the trade name Estronol and used to treat low estrogen.
scope: A weak estrogen made by the ovaries and also manufactured as a drug. It is not estradiol, the body's
  main and stronger estrogen, nor estriol, the other common form.
examples:
- Doctors sometimes prescribe estrone to women after menopause.
- The blood test measured estrone along with estradiol.
