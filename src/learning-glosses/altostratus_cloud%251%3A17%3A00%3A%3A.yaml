simpleMeaning: a wide flat layer of grey in the sky at a middle height, 2 or 3 miles up
scope: A flat grey layer in the sky at a height of 2 or 3 miles; altostratus is another name for this
  sense, not a puffy mass and not a low flat sheet.
examples:
- Altostratus clouds spread across the whole sky.
- We watched the altostratus cloud thicken before the rain.
