simpleMeaning: Guns set round a curve could not bring their fire to one point, so this curved wall of
  a fort, built in the 1500s, fell out of use.
scope: Half-moon bastion is another name for this curved wall of a fort from the 1500s, whose guns could
  not bring their fire to one point.
examples:
- The semi-circular bastion was used in the 1500s.
- Fire from the semi-circular bastion could not be brought to one point.
