simpleMeaning: A short advertisement on radio or television that a business pays to have broadcast.
scope: It is not the adjective for trade or quality, but the broadcast advertisement itself.
examples:
- The show was interrupted every ten minutes by a paid advertisement.
- She appeared in a toothpaste commercial on television.
