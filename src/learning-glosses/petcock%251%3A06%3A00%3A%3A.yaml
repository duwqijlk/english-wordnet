simpleMeaning: A small tap or valve that acts as a regulator for letting out air, releasing pressure,
  or draining liquid.
scope: A small tap for letting air out or draining liquid, not a tap that fills.
examples:
- He opened the petcock to let the air out.
- The petcock drains the last of the water.
