senseId: 'tsundere%1:22:01::'
synsetId: 90009071-n
simpleMeaning: 'A way a made-up person in a story changes: cold and even unfriendly to someone at first,
  then slowly kind over time'
scope: A way a made-up person in a story changes from cold and unfriendly to kind over time; not a person
  who stays cold and not a person who is kind from the start.
examples:
- At first the tsundere snaps at him, but later she starts to care.
- The tsundere in the show slowly warms to her friend.
