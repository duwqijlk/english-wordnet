simpleMeaning: to put a person in a post, or to give a person a job to do
scope: This is putting a person in a post or giving a person a job to do; assign and designate are other
  names for this sense, and it is not choosing someone to speak for a group.
examples:
- The manager delegated the task to her assistant.
- He delegated his deputy to attend the meeting.
