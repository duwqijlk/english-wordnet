simpleMeaning: A wood, steel or concrete post driven into the ground so a structure can rest on it.
scope: A support post driven into the ground, also called a piling, spile or stilt, not a nuclear reactor,
  a battery of cells, or a heap of things.
examples:
- The bridge rests on concrete piles sunk deep into the riverbed.
- Workers drove steel piles to support the new pier.
