simpleMeaning: the quality of having a firm aim and not giving up when you try to do or reach something
scope: 'This quality is also called purpose: a firm aim that does not give up. It is not deciding an outcome,
  and not finding out facts by study.'
examples:
- Her determination helped her finish the race despite the pain.
- He showed great determination in learning to walk again.
