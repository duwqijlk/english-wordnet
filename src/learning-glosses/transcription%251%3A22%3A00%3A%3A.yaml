senseId: 'transcription%1:22:00::'
synsetId: 13589441-n
simpleMeaning: In genetics, the copying of a gene's DNA sequence into messenger RNA, which is built on
  a matching DNA template.
scope: This sense is the biological process of copying DNA into RNA, not a written or typed copy of speech,
  a broadcast or audio recording, or a musical arrangement.
examples:
- The enzyme begins transcription by unzipping the double helix.
- Errors during transcription can change the messenger RNA and, in turn, the protein produced.
