simpleMeaning: a tool that lets a person see a view that something in the way blocks
scope: A tool for seeing over or around a block, not a tool for seeing far away stars and not a tool for
  seeing very small things.
examples:
- The captain looked through the periscope to see the ships above the water.
- From the trench, he used a periscope to watch without lifting his head.
