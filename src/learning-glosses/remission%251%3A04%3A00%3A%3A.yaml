simpleMeaning: The act of a priest formally saying that God forgives a person's sins, in the church act
  of penance (when a person confesses sins and is forgiven)
scope: 'Also called absolution, remission of sin, and remittal: a priest saying that God forgives a sin,
  not an illness getting less strong.'
examples:
- After confession, she received remission of her sins from the priest.
- The priest pronounced the remission, and the man left in peace.
