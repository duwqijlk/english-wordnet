simpleMeaning: Small pinkish bell-shaped flowers and oblong leaves grow on this North American evergreen,
  once used for plasters put on the lower leg.
scope: 'Also called shinleaf: a North American evergreen with small pinkish bell-shaped flowers and oblong
  leaves, not the one with rounded leaves and fragrant creamy-white flowers.'
examples:
- Wild lily of the valley bore small pinkish flowers.
- The wild lily of the valley kept its leaves all year.
