simpleMeaning: used especially of meats and fish, dried and kept from going bad by hanging in smoke from
  burning wood
scope: This word is for meat or fish dried and kept in wood smoke. It is not about smoking a cigarette,
  and not about fresh or plain cooked food.
examples:
- We ate smoked salmon for lunch.
- He bought some smoked ham from the shop.
