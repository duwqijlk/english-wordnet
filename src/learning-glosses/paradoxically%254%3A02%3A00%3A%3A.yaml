senseId: 'paradoxically%4:02:00::'
synsetId: 00023622-r
simpleMeaning: in a way that seems odd because two opposite things seem true at the same time
scope: Used when two opposite things seem true at the same time, not when something is just surprising
  and not when something is simply hard to understand.
examples:
- Paradoxically, the desert can feel very cold at night.
- Paradoxically, cutting staff to save money made the shop lose even more money.
