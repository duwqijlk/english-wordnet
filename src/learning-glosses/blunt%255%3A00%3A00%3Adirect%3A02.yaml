simpleMeaning: acting or speaking in a direct and open way, without hiding what you mean
scope: 'Also called frank: this is about acting or speaking in a direct, open way, not about a knife that
  is not sharp and not about a plain truth with nothing added to soften it.'
examples:
- He was blunt and told me my work was not good enough.
- Her blunt answer surprised everyone, but she meant to be honest.
