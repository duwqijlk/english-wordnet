simpleMeaning: A leafy plant of Europe and Asia Minor with a short thin underground stem and bright green
  leaves in thick tufts that look like a cooking herb.
scope: Also called mountain parsley fern and Cryptogramma crispa; a plant of Europe and Asia Minor with
  leaves like a kitchen herb.
examples:
- The European parsley fern grows in the shady corner.
- European parsley fern leaves look like parsley.
