simpleMeaning: A rush that grows low and lives for one year, found on wet low ground in nearly every part
  of the world.
scope: Also called toad rush, this is a low rush that lives for one year on wet low ground, not a rush
  that grows tall on dry land.
examples:
- The Juncus bufonius grows on the wet ground by the pond.
- Juncus bufonius grows low on the wet ground near the stream.
