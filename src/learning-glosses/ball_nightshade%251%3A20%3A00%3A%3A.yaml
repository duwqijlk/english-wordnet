simpleMeaning: A rough weed found all over the south and east of the United States, with pale yellow flowers,
  yellow fruit like small berries, and sharp points.
scope: This weed is also called ball nettle, bull nettle and horse nettle.
examples:
- She brushed against the ball nightshade and felt its sharp points.
- We saw ball nightshade with pale yellow flowers and yellow fruit like small berries.
