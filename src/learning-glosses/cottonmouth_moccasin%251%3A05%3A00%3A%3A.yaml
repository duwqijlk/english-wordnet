simpleMeaning: a snake whose bite has poison in it, that lives in and near the water in the swamps of
  the south of the United States
scope: A snake with a poison bite that lives in and near the water in southern swamps, also called cottonmouth,
  not a harmless water snake and not a land snake.
examples:
- The cottonmouth moccasin slid into the swamp water.
- We kept clear of the cottonmouth moccasin sunning itself on the bank.
