senseId: 'confusedly%4:02:00::'
synsetId: 00295603-r
simpleMeaning: in a way that shows the mind is not clear and cannot think in order
scope: This says how a thing is done, with a mind that is not clear; it does not describe a hard question
  or a thing that is hard to follow.
examples:
- He looked at the map confusedly and turned the wrong way.
- She answered confusedly, mixing up the two names.
