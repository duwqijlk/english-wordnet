senseId: 'morbidly%4:02:00::'
synsetId: 00405577-r
simpleMeaning: in a way that shows too much interest in death or disease, or to a degree that is not healthy
scope: It describes a way or a degree linked to death or disease in a not healthy way, not a disease itself
  and not normal medical care.
examples:
- He was morbidly interested in old murder stories.
- She looked morbidly at the photos of the dead soldiers.
