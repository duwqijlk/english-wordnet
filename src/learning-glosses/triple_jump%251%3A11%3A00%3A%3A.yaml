simpleMeaning: A track contest in which each person must do a hop, a step, and a leap in one unbroken
  move
scope: A track contest of a hop, a step, and a leap in one unbroken move, also called hop-step-and-jump;
  not a single long jump and not a high jump.
examples:
- She won the triple jump with a hop, step, and leap of 14 metres.
- The triple jump needs speed and a smooth change from hop to leap.
