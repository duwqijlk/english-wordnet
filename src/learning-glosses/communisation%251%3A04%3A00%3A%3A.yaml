simpleMeaning: The act of running a whole nation by the rules of shared ownership
scope: The act of running a whole nation by the rules of shared ownership; communization is another name
  for this sense, not a change of one piece of property from private to public hands, which is the other
  sense of the same word.
examples:
- Communisation changed how the whole nation was run.
- The communisation of the nation took years.
