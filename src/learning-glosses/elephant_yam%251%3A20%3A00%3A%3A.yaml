simpleMeaning: Grown for its thick underground stem that can be eaten, this plant of the arum kind from
  southeastern Asia, above all the Philippines, has a rotting smell.
scope: It is also called pungapung and telingo potato, and it is a plant of southeastern Asia with a rotting
  smell, grown for its thick underground stem that can be eaten.
examples:
- The elephant yam is grown for its thick underground stem.
- The elephant yam has a rotting smell.
