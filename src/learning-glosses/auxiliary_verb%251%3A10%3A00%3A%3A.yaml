schema: oewn-learning-gloss-v2
senseId: 'auxiliary_verb%1:10:00::'
synsetId: 06329506-n
simpleMeaning: a verb that joins with another verb to help show time, mood, voice, or condition in a verb
  phrase
scope: A verb that joins another verb to show time, mood, voice, or condition, not the main verb that
  names the action itself.
examples:
- In 'she has gone', 'has' is an auxiliary verb helping 'gone' show the past.
- An auxiliary verb like 'will' joins the main verb to show what is yet to come.
