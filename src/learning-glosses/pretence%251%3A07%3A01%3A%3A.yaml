schema: oewn-learning-gloss-v2
senseId: 'pretence%1:07:01::'
synsetId: 04686265-n
simpleMeaning: A false look of something, made with care to seem real.
scope: This is a false show made to seem real; pretense, pretext and guise are other names for this sense,
  not pretending in order to deceive or an honest show of feeling.
examples:
- Under the pretence of friendship, he betrayed them.
- Her pretence of calm fooled no one in the room.
