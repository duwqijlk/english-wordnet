simpleMeaning: a place where wild animals are kept so that people can come and see them
scope: This is the place where wild animals are kept for people to see; not a crowded, noisy place spoken
  of as if it were wild, and not the study of animals.
examples:
- We took the children to the zoo to see the lions.
- The zoo keeps its elephants in a large open area.
