simpleMeaning: to be something that a person cannot understand or work out
scope: This is a problem, question or other thing that a person cannot understand or work out. Not a person
  or event making someone feel mixed up and unsure what to do, and not a task that is hard to do.
examples:
- This hard problem bewilders even good students.
- The way the machine works bewildered him, and he could not fix it.
