simpleMeaning: A sharp tap on the cord below the knee that joins muscle to bone makes the leg straighten
  on its own.
scope: Also called knee-jerk reflex and knee jerk, a sharp tap on the cord below the knee sets off this
  straightening of the leg, not a movement the person chooses to make.
examples:
- A tap below the knee set off the patellar reflex.
- The patellar reflex straightened the leg after the tap.
