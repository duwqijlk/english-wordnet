senseId: 'anti-selection%1:22:01::'
synsetId: 92448349-n
simpleMeaning: A case where sellers know things buyers do not, or the other way round, about some part
  of how good a thing is
scope: A case where sellers know things buyers do not, or the other way round, about some part of how
  good a thing is; adverse selection is another name for this sense, not cheating by lying and not a fair
  deal where both sides know the same.
examples:
- The market suffered from anti-selection when sellers hid faults.
- Anti-selection grows when one side knows more than the other.
