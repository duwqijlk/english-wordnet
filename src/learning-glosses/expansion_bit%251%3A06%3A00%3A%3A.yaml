simpleMeaning: This hole-making tool cuts holes of different widths because its sharp edge can be set
  to the width wanted
scope: 'Also called an expansive bit: a hole-making tool whose sharp edge can be set to different widths,
  not a fixed drill and not a saw.'
examples:
- The carpenter chose an expansion bit to cut a wide hole for the pipe.
- With an expansion bit, he set the blade to the size he needed.
