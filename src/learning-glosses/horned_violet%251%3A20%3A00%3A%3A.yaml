simpleMeaning: A European flower plant with a flower that has a very long thin tube at its back
scope: A European flower plant with a flower that has a very long thin tube at its back; not a flower
  with a short tube, and not a flower of the Americas.
examples:
- The horned violet grows in the rock gardens of Europe.
- A horned violet has a spur longer than most flowers of its kind.
