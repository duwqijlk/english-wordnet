simpleMeaning: so bad that it cannot be controlled or made better, used in informal speech to show how
  bad a person or thing is
scope: Used to stress that a person or thing is very bad and cannot be put right; not used for a person
  who feels that nothing good will happen.
examples:
- She handed me a hopeless pile of papers in a complete mess.
- He is a hopeless cook and burns almost every meal he makes.
