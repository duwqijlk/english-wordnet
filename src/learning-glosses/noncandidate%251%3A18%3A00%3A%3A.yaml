senseId: 'noncandidate%1:18:00::'
synsetId: 10380065-n
simpleMeaning: Someone who has said in public that they will not stand for a post; the main case is a
  politician saying this about a political post
scope: Someone who has said in public that they will not stand for a post; not a person who has said nothing
  and not a person running for the post.
examples:
- After weeks of talk, she said she was a noncandidate for mayor.
- The noncandidate made it clear he would not run.
