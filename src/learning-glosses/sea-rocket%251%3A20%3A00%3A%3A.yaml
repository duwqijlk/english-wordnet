simpleMeaning: People grow this shore plant for its fragrant rose or violet flowers and soft thick grey-green
  leaves; it lives one year and can stand salt.
scope: This is a shore plant that lives one year, grown for its fragrant rose or violet flowers and soft
  thick grey-green leaves, not a plant of fresh water inland.
examples:
- The sea-rocket grew along the shore with rose flowers.
- Sea-rocket leaves were soft and thick and grey-green.
