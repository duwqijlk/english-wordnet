simpleMeaning: not able to be given money cover for harm or loss, or not allowed to have such cover
scope: This means a person or thing cannot get money cover for harm or loss at all, not just that they
  have no cover now.
examples:
- The old house was uninsurable because of the high risk of floods.
- His serious illness made him uninsurable under the company's rules.
