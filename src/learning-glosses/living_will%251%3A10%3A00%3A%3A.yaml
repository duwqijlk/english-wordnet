senseId: 'living_will%1:10:00::'
synsetId: 06556832-n
simpleMeaning: a paper a person writes while still able by law to choose for themselves, asking to be
  allowed to die if they later become badly hurt or sick beyond cure
scope: A paper written while a person can still choose for themselves, asking to be allowed to die if
  later badly hurt or sick beyond cure, not a will that gives away money and not a doctor's order.
examples:
- After he found out he had AIDS, he drew up a living will.
- Her living will said she wanted to be allowed to die if she became badly hurt and could not get better.
