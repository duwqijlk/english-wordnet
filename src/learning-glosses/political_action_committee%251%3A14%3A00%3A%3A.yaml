simpleMeaning: A group set up by people with shared interests to raise money for the candidates they favor
scope: A group that raises money for candidates; not a party that puts up candidates, and not a charity
  that raises money for a cause.
examples:
- The political action committee raised two million dollars.
- She gave money to a political action committee.
