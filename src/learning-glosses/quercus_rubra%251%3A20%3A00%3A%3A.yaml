simpleMeaning: A large shapely leaf-shedding tree with a rounded crown, widespread in eastern North America,
  with large leaves bearing three-sided spiny-tipped lobes and coarse wood less lasting than white oak.
scope: A large eastern oak, also called northern red oak and Quercus borealis, not a white oak, with large
  leaves bearing spiny-tipped lobes and coarse wood less lasting than that of white oaks.
examples:
- Quercus rubra shades the old farmhouse.
- The wood of Quercus rubra is coarse and less lasting than white oak.
