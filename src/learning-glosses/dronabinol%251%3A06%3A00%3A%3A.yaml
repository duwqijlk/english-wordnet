simpleMeaning: a mind-changing substance found in cannabis, used as a medicine to stop sickness caused
  by cancer treatment
scope: A mind-changing substance from cannabis used as a medicine against sickness, not a painkiller and
  not the plant itself.
examples:
- The doctor prescribed dronabinol to control his nausea.
- Dronabinol helped her keep food down during treatment.
