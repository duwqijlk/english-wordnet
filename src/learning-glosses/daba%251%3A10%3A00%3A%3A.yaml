simpleMeaning: A Chadic language spoken south of Lake Chad, above all in the North Region, Mayo-Louti,
  Mayo-Oulo and Guider, north-west of Guider, and the Far North Region, Mayo-Tsanaga, Hina and Bourrah
scope: This language is also called the Daba language, Kola, the Kola language, Musgoi and the Musgoi
  language; it is not the Ron language and not another Chadic language of the same area.
examples:
- Daba is spoken south of Lake Chad.
- She grew up speaking Daba at home.
