simpleMeaning: A round band of leaves or flowers made to look nice as a decoration
scope: Also called wreath, garland, chaplet and coronal; this is a round band made for decoration, not
  a single flower or a bunch held in the hand.
examples:
- She wore a lei of white flowers around her neck.
- They gave each guest a lei made of fresh flowers.
