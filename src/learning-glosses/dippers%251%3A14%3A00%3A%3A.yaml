simpleMeaning: A Baptist church group begun in 1708 by Americans of German stock, against military service
  and sworn legal oaths, that dipped people three times in baptism
scope: Church of the Brethren and Dunkers are other names for this sense; not Baptists in general and
  not a group that baptises once only.
examples:
- The Dippers met by the river to baptise new members.
- Dippers refused to swear oaths in court.
