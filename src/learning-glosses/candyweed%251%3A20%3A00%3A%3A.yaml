simpleMeaning: With tall thin bunches of odd yellow-orange flowers, this plant grows in the wet ground
  of the open pine land of the southeast of the United States
scope: 'Also called orange milkwort, yellow bachelor''s button and yellow milkwort: a plant of wet ground
  with yellow-orange flowers, not a plant of dry ground and not one with white flowers.'
examples:
- Candyweed grew in the wet ground near the pines.
- The candyweed had spikes of yellow-orange flowers.
