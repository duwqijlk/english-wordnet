simpleMeaning: not protected and not able to be protected from attack.
scope: This is not about being honest or relaxed, and not about something unclosed; it means left without
  defense and easy to attack.
examples:
- The camp lay open to attack from the hills.
- With its walls broken, the old fort was open to raiders from the sea.
