simpleMeaning: Some or all of the story is true, yet this book or play is told as if it were made up
scope: 'Also called fictionalization: a book or play whose story is true in part or in full but told as
  if made up, not a true life story told as fact and not a tale with no true part at all.'
examples:
- Her fictionalisation of the war drew on real letters from soldiers.
- The fictionalisation keeps the true names but changes what people said.
