simpleMeaning: a member of the Anasazi people of the southwestern United States, who built homes of rock
  or dried mud on shelves in the sides of caves
scope: A member of the Anasazi people of the southwestern United States who built homes of rock or dried
  mud on shelves in cave sides; not a member of the same people who lived on open ground and not any other
  cave dweller.
examples:
- The cliff dwellers built their homes high in the rock.
- A cliff dweller would climb down to the valley each morning.
