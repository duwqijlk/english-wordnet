simpleMeaning: having a piece of cloth tied over your eyes so that you cannot see
scope: 'Also called blindfold: having cloth tied over the eyes so you cannot see; not being unable to
  see for any other reason, and not the cloth itself.'
examples:
- The blindfolded boy tried to touch the picture on the wall.
- She walked, blindfolded, across the room with her hands out.
