simpleMeaning: the act of making a thing dirty with stuff that does not belong in it, on purpose or by
  chance
scope: The act of making a thing dirty with stuff that does not belong in it, on purpose or by chance,
  not the bad state of the land, air, or water after it has been made dirty.
examples:
- The pollution of the river came from waste poured in by the factory.
- Laws were passed to stop the pollution of the air.
