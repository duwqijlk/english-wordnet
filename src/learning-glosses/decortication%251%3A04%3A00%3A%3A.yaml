simpleMeaning: taking off the outer layer of a body part or organ
scope: Taking off the outer layer of a body part or organ, not cutting out the whole part and not taking
  the skin off a fruit.
examples:
- The surgeon performed a decortication to free the lung from its thick outer layer.
- Decortication of the kidney removed the tough covering around it.
