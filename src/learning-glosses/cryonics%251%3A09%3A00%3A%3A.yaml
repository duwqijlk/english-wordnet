simpleMeaning: The freezing of a very sick or newly dead person so the body does not rot, kept until new
  medical cures might bring the person back to life
scope: This is the freezing of a dead or dying person in hope of a future cure, not ordinary burial and
  not the study of cold on living things.
examples:
- He signed up for cryonics after his diagnosis.
- Some people pay for cryonics in the hope of waking one day.
