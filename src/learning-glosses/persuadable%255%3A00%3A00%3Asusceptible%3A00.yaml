simpleMeaning: easy for other people to change your mind or to make you agree to do something
scope: This says a person can be talked into a new view or action; it is not about a person who will not
  change, and not about forcing someone.
examples:
- He was persuadable, so his friends soon talked him into joining the trip.
- A persuadable voter may change his choice after hearing a new speech.
