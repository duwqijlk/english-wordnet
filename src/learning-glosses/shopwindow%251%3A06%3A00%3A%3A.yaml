simpleMeaning: the glass front of a store, facing the street, where goods for sale are shown
scope: This is the glass front of a store used to show goods, not a window in a house and not a shop door.
examples:
- She stopped to look at the dresses in the shopwindow.
- They put bright lights and new coats in the shopwindow to draw people in.
