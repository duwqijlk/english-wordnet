simpleMeaning: in South and Central America, birds of many kinds with curved beaks and stiff tail feathers
  feed and climb on tree trunks like the birds that hammer at bark
scope: Also called tree creeper, wood-creeper, and woodcreeper, a bird that climbs trees to feed, not
  a woodpecker and not a nuthatch.
examples:
- The woodhewer climbed the trunk, its stiff tail feathers bracing it.
- A woodhewer feeds on insects it finds under the bark.
