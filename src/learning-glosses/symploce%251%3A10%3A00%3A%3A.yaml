simpleMeaning: Using the same opening words again and again and the same closing words again and again,
  in clause after clause, is one trick made of two.
scope: This is the trick of using the same opening words and the same closing words in clause after clause.
examples:
- The symploce ran through her speech, the same words opening and closing each clause.
- He used symploce to open and close each clause with the same words.
