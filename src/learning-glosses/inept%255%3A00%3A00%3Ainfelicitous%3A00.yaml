simpleMeaning: not smooth or pleasing in the way something is said or written
scope: 'Also called awkward, clumsy, and cumbersome: this is about words that sound rough, not about a
  person who makes poor choices or does things badly.'
examples:
- His inept apology made the problem worse, not better.
- She wrote an inept letter that was hard to follow.
