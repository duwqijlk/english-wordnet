simpleMeaning: a marked line showing where a race or game begins.
scope: This sense is not the act of beginning and not a first point in time or value; it is the physical
  line on a track or field.
examples:
- The start was marked by a white stripe across the track.
- The runners lined up at the start, behind the painted line.
