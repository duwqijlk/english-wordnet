simpleMeaning: A single strand of DNA that matches a messenger RNA, or DNA made from a messenger RNA by
  an enzyme called reverse transcriptase.
scope: Also called complementary DNA; a single strand of DNA that matches a messenger RNA or is made from
  one.
examples:
- The lab made cDNA from the messenger RNA.
- cDNA is used to study which genes are active.
