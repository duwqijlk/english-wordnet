senseId: 'direct_sum%1:14:00::'
synsetId: 08015346-n
simpleMeaning: In maths, a joining of two groups with nothing shared, where each thing in the whole is
  made by adding one thing from each group.
scope: In maths, a joining of two groups with nothing shared, not a joining of groups that share things
  and not a simple adding of numbers.
examples:
- The direct sum joins the two groups into one whole.
- Each part of a direct sum comes from one of the two groups.
