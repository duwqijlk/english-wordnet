simpleMeaning: In grammar, nouns, pronouns, adjectives and articles take changed forms to show a word
  belongs to the male kind.
scope: Grammar gives nouns, pronouns, adjectives and articles one set of changed forms for the male kind,
  and other sets for the feminine and neuter kinds.
examples:
- In masculine declension, the endings mark the male kind.
- Masculine declension gives these nouns their male forms.
