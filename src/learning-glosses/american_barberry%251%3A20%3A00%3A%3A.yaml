simpleMeaning: A bush of eastern North America that loses its leaves in autumn, when they turn scarlet,
  and bears bunches of yellow flowers followed by oval shiny red berries.
scope: A bush of eastern North America that loses its leaves in autumn, also called Berberis canadensis;
  its nearest kin are other bushes with yellow flowers and red berries.
examples:
- American barberry grew at the wood edge with scarlet leaves in autumn.
- We picked the shiny red berries of American barberry in the fall.
