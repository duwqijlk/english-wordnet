simpleMeaning: A pine of middling to large size from north Europe and Asia, with needles in pairs and
  bark that peels in red-brown flakes.
scope: A pine of north Europe and Asia with needles in pairs and flaking red-brown bark, also called Scotch
  fir, Scotch pine and Scots pine, not a pine of America and not a pine with needles in threes.
examples:
- Pinus sylvestris grows across the forests of north Europe.
- The Pinus sylvestris by the road has red-brown bark that peels in flakes.
