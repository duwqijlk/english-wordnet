simpleMeaning: the act of changing a thing so that it fits one single purpose
scope: 'Also called specialization: the act of fitting a thing to one single purpose, not the biology
  sense of a body part changed for a job, and not a person''s chosen line of work.'
examples:
- The specialisation of the tool made it fit one job only.
- Specialisation turned the plain room into a place for one use.
