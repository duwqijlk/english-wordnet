simpleMeaning: The small case in the kidney that holds Bowman's case and a ball of tiny blood tubes at
  the wide end of a tiny tube that cleans the blood.
scope: 'Also called malpighian body or malpighian corpuscle: the small case in the kidney that holds Bowman''s
  case and a ball of tiny blood tubes at the wide end of a tiny tube that cleans the blood, not the kidney
  itself and not the tube alone.'
examples:
- The renal corpuscle filters the blood in the kidney.
- Each renal corpuscle holds a ball of tiny blood tubes.
