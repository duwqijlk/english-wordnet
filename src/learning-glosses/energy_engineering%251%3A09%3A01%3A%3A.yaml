simpleMeaning: A wide field of building work that deals with saving power, power services, running buildings,
  running plants, keeping to green rules, and new kinds of power
scope: This is a wide field of building work dealing with saving power, power services, running buildings
  and plants, keeping to green rules and new kinds of power, not the study of power alone and not the
  building of one machine.
examples:
- She studied energy engineering to learn how to save power.
- Energy engineering covers running buildings and new kinds of power.
