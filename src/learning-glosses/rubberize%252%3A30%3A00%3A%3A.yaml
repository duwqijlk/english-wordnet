simpleMeaning: To lay rubber on, or drench right through.
scope: This sense is also called rubber and rubberise, for laying rubber on, or drenching right through,
  where rubber is to cover a thing with the stretchy stuff, or soak it right through with it.
examples:
- They rubberize the cloth, laying rubber on.
- They rubberize canvas, drenching it right through.
