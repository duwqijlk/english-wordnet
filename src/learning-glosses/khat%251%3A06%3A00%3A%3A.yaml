simpleMeaning: Leaves chewed like tobacco, or brewed as tea, lift the mood and wake the body; they come
  from one kind of shrub.
scope: Also called cat, kat, qat, and quat, these leaves are chewed or brewed as tea and lift the mood.
examples:
- Khat is chewed like tobacco in Yemen.
- They made tea from khat leaves.
