senseId: 'constrain%2:30:00::'
synsetId: 00419690-v
simpleMeaning: to set hard limits on a thing, so it stays inside a small range and cannot grow past it
scope: 'Also called tighten and stiffen: to hold something back hard so it covers less, not to make a
  thing physically tight.'
examples:
- The new law will constrain what firms can spend.
- Strict rules constrain how far the plan can go.
