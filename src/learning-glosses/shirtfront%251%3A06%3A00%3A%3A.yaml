simpleMeaning: a separate piece a man wears to look like the front of a shirt, usually stiff
scope: A separate piece worn to look like a shirt front, also called dicky, dickey, and dickie; not the
  real front part of a shirt.
examples:
- He wore a shirtfront under his jacket so it looked like a clean shirt.
- Her grandfather kept a stiff shirtfront in a drawer for formal dinners.
