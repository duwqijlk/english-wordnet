simpleMeaning: a clam you can eat, with a thin egg-shaped shell, found on the sea coasts of the United
  States and Europe
scope: An edible clam with a thin egg-shaped shell from the coasts of the United States and Europe; not
  a cooking pot, not a steam ship, and not a clam that is steamed in its shell.
examples:
- We dug for steamers at low tide.
- The fishermen sold steamers at the market.
