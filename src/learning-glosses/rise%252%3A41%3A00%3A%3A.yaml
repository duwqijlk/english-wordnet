simpleMeaning: To join a rebellion and turn against the power you once obeyed.
scope: This is taking up arms against a ruler or state, not moving to a higher place and not a religious
  event about the Holy Spirit.
examples:
- The peasants rose against the king in the spring of 1381.
- When the taxes were raised again, the whole province rose.
