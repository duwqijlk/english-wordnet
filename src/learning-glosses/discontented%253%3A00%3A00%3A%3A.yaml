senseId: 'discontented%3:00:00::'
synsetId: 00592317-a
simpleMeaning: feeling or showing that you are not happy with things as they are, or having a strong wish
  for something different that will not let you rest
scope: 'Also called discontent: feeling or showing that you are not happy with things and want them to
  change. Not just sad, and not just unable to rest or stay still.'
examples:
- The workers were discontented with their low pay and long hours.
- She gave him a discontented look and said the room was too small.
