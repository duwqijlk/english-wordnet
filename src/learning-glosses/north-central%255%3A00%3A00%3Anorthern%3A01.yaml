simpleMeaning: Of or in a US region generally covering the upper Mississippi valley and Great Lakes, north
  of the Ohio River and southern Kansas-Missouri line, between western Pennsylvania and eastern Montana-Wyoming-Colorado.
scope: This adjective names a broad region of the United States, not the northern states alone or the
  central states alone.
examples:
- The north-central region stretches from western Pennsylvania to eastern Montana.
- On the map, the north-central states are shaded green.
