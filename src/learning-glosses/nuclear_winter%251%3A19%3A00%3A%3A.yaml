simpleMeaning: a long dark, freezing spell after a full nuclear war, scientists say, when dust and smoke
  cover the earth and hide the sun, and most living things would die
scope: A dark, freezing spell that scientists say would follow a nuclear war, not an ordinary cold winter
  and not the war itself.
examples:
- Scientists say a nuclear winter would follow a full-scale nuclear war.
- In a nuclear winter, dust and smoke would shut out the sun for months.
