simpleMeaning: A rise in blood pressure in the veins of the portal system, from a block in the liver,
  often tied to drink-driven liver scarring, swelling spleen and side veins.
scope: Used of raised pressure in the veins of the portal system, when a block in the liver backs the
  blood up.
examples:
- Portal hypertension raised the pressure in his portal veins.
- Portal hypertension can swell the spleen.
