simpleMeaning: A very free and generous spirit shows itself in giving much away to others
scope: A very free and generous giving, also called magnanimity, largesse and munificence; not a gift
  given once and not spending that shows off wealth.
examples:
- Her openhandedness filled the food bank with gifts every winter.
- The town praised his openhandedness after he paid for the new library.
