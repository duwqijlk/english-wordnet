simpleMeaning: a dome-shaped holy building put up by Buddhists
scope: A holy building with a round dome top put up by Buddhists; stupa is another name for this sense.
  Not a temple hall where people gather and not an ordinary house.
examples:
- Pilgrims walked in silence around the tope.
- The tope rose above the trees, its dome catching the light.
