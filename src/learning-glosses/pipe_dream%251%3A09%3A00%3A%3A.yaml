simpleMeaning: A wild hope that can never come true, born of fancies stirred by smoking opium.
scope: A wild hope that can never come true; dream is another name for this sense, not a real plan and
  not a wish that can be carried out.
examples:
- I have this pipe dream about being emperor of the universe.
- Her pipe dream of becoming a film star never came true.
