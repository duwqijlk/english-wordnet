simpleMeaning: Hits made, divided by the number of official turns at bat, give this count of how well
  a hitter does in baseball.
scope: In baseball, this count of how well a hitter does, worked out from hits and turns at bat, is also
  called the hitting average.
examples:
- Ted Williams once had a batting average above .400.
- A batting average of .300 marks a fine hitter.
