synsetId: 14385998-n
simpleMeaning: Sudden attacks of blacking out that come back again and again, caused by a fault in the
  flow of signals that sets the beat of the heart
scope: Also called atrioventricular block, heart block and Stokes-Adams syndrome, these are attacks in
  which a person blacks out again and again because the signals that set the beat of the heart go wrong.
examples:
- Adams-Stokes syndrome made him black out without warning.
- She was treated for Adams-Stokes syndrome after the attacks.
