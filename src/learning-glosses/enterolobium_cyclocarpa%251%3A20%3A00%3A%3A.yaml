simpleMeaning: A tropical South American tree with a wide crown of twice-divided leaves and curled fruits
  shaped like ears; grown for shade and looks, and for its fine wood.
scope: A tropical South American tree with ear-shaped fruits, also called conacaste and elephant's ear;
  not a tree grown only for its fruit.
examples:
- An Enterolobium cyclocarpa shades the whole yard.
- The Enterolobium cyclocarpa by the road drops curled pods.
