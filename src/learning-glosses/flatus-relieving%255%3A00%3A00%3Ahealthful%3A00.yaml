simpleMeaning: Easing gas in the gut, in cases of belly pain, wind, or griping pain
scope: This describes easing gas in the gut, in cases of belly pain, wind, or griping pain; carminative
  is another name for this sense, not a drug that causes gas and not a cure for hunger.
examples:
- The flatus-relieving tea eased her belly pain.
- A flatus-relieving herb helped with the wind.
