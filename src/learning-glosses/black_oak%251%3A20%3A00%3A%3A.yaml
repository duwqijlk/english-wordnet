simpleMeaning: A deciduous oak of the eastern United States and southeastern Canada, medium-to-large,
  with dark outer bark, yellow inner bark used for tanning, and broad leaves with five bristle-tipped
  lobes.
scope: This is the tree itself; quercitron oak, yellow oak and quercitron name the same tree, while the
  yellow dye taken from its bark is a separate thing.
examples:
- The black oak in our yard turns deep red each fall.
- Black oak bark was once stripped to make a yellow dye.
