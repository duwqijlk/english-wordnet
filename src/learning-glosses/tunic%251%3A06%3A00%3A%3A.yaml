simpleMeaning: A loose piece of clothing, like a cloak, that hangs down to your hips or knees
scope: A loose cloak-like garment, not a covering layer of body tissue and not a coat that reaches the
  ground.
examples:
- She wore a linen tunic over her trousers.
- The soldier's tunic reached to his knees.
