simpleMeaning: In mechanics, movement that slows down by the same amount in each equal bit of time.
scope: In mechanics, movement that slows by the same amount in each equal bit of time, not movement at
  a steady speed and not movement that speeds up.
examples:
- A uniformly decelerated motion slows by the same amount each second.
- The ball rolled with uniformly decelerated motion until it stopped.
