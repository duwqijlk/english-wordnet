senseId: 'unwellness%1:26:00::'
synsetId: 14085287-n
simpleMeaning: A fault in how the body works, in one part or the whole of it.
scope: This sense is also called illness, sickness, and malady, for a fault in how the body works, in
  one part or the whole of it, where illness is a change in a living thing that keeps part of it, or all
  of it, from working as it should.
examples:
- Unwellness slowed him for weeks.
- Her unwellness touched the whole body.
