simpleMeaning: in a light, cheerful and relaxed way, without worry
scope: This says how a person does something, lightly and cheerfully, not how the weather feels when there
  is a light wind.
examples:
- She walked breezily into the room and said hello to everyone.
- He breezily told us not to worry about the small mistake.
