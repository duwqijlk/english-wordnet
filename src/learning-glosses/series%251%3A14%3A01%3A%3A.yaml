simpleMeaning: a set of stamps that share a theme, or a set of coins or paper money gathered together
  for study or collecting.
scope: This is not a number of similar events or shows coming one after another; it is a set of stamps,
  coins, or paper money that share a theme or are collected or studied together.
examples:
- He completed the 1920s series of airmail stamps.
- The collector paid a high price for a rare coin series from the 1800s.
