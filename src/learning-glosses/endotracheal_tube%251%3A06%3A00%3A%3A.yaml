simpleMeaning: a hollow catheter placed through the mouth or nose into the windpipe to keep the airway
  open, supply oxygen, remove mucus or stop stomach contents being breathed in
scope: This is the catheter passed through the mouth or nose into the windpipe, not a tube inserted through
  a hole in the neck, and not the act of inserting it.
examples:
- The doctor inserted an endotracheal tube to keep the patient's airway open during surgery.
- Nurses suction mucus through the endotracheal tube every few hours.
