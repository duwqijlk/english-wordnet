simpleMeaning: a person with an antisocial personality disorder (a lasting way of acting that harms others
  and breaks rules); once widely used, this word has now been replaced by sociopath
scope: 'Another name for this sense is sociopath: it is a person with a lasting disorder, not just a person
  who is cruel or violent at one time.'
examples:
- The story's killer was described as a psychopath who felt no pity for his victims.
- Doctors in the past called him a psychopath, though they now use a different word.
