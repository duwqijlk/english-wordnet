simpleMeaning: One of three blood tubes that feed the covers of the brain and the parts near them
scope: One of three blood tubes feeding the covers of the brain; arteria meningea is another name for
  this, not a blood tube of the heart and not a blood tube of the leg.
examples:
- The meningeal artery feeds the covers of the brain.
- A cut to the meningeal artery can be deadly.
