simpleMeaning: Feeling unwell or in pain; in everyday speech, the word 'bad' is sometimes used with the
  same meaning.
scope: This sense describes how a person feels physically, not how hard a material is to chew or how hard
  a problem is to solve.
examples:
- He was still feeling tough the morning after the party.
- I felt tough all day, with a sore throat and aching joints.
