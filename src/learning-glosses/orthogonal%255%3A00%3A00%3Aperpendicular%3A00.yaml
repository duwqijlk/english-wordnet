simpleMeaning: Said of a set of lines or axes that meet at right angles to each other
scope: Said of lines or axes that meet at right angles to each other, also called rectangular; not lines
  that run side by side and not lines that meet at a slant.
examples:
- The graph uses three orthogonal axes to show the data.
- The two orthogonal lines cross at a right angle.
