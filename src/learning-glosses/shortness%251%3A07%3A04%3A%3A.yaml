senseId: 'shortness%1:07:04::'
synsetId: 05145203-n
simpleMeaning: the quality of being short, or of being cut off before the full length
scope: This is about a thing being short or cut off before its full length, not about a short time, not
  about a short space or distance, and not a rude way of speaking.
examples:
- The shortness of the cut rope, cut down to half its length, made it useless for tying the boat.
- The shortness of the article, cut from ten pages to two, left out key facts.
