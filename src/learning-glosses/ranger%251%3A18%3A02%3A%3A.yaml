simpleMeaning: a soldier trained to make quick, sudden attacks on the enemy and then leave at once
scope: A soldier in a group trained for quick attacks, not a person who guards a park or forest.
examples:
- The rangers attacked the camp at night and were gone before morning.
- He served as a ranger in a unit that made quick attacks behind enemy lines.
