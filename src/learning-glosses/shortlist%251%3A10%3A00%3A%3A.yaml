simpleMeaning: a list of a few people judged to be right, picked from a longer list of all the people
  who asked, from which the final person will be chosen
scope: This sense is the list itself of a few people still being considered, not the act of putting a
  person on such a list and not the full first list of all who asked.
examples:
- Her name was on the shortlist for the job.
- Only three people made the shortlist after the first interviews.
