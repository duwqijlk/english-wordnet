simpleMeaning: Grip for the ball of a small hand tool that moves things on a screen is what this small
  flat pad gives, and it can be carried about
scope: 'Also called a mouse mat: a small pad that gives grip to the ball under a computer mouse, not a
  pad for a cup and not a pad for writing.'
examples:
- His mousepad kept the ball from slipping.
- She bought a new mousepad for her desk.
