simpleMeaning: the act of giving up a struggle or a task and leaving it completely
scope: 'Also called relinquishment: the act of giving up a struggle or task, not a spoken act of giving
  up a claim or a right.'
examples:
- His relinquishing of the long struggle surprised everyone.
- Relinquishing the task was hard after so much work.
