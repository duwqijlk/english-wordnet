simpleMeaning: A round of visits in which a speaker goes from place to place to preach or give talks
scope: Travelling to preach or give talks from place to place, not staying to preach in one place and
  not a holiday tour.
examples:
- His itineration took him to a new town each week.
- Itineration was common for preachers without a fixed church.
