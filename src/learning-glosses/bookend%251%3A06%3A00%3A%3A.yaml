simpleMeaning: a thing put at the end of a row of books to hold them up straight, on a shelf or table
scope: A thing that holds a row of books up straight, not a cover at the front or back of a book and not
  a mark that shows where you stopped reading.
examples:
- A heavy metal bookend kept the row of novels standing straight.
- She put a bookend at each end of the shelf.
