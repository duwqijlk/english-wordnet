senseId: 'streptokinase%1:27:00::'
synsetId: 15085738-n
simpleMeaning: An enzyme from some strains of streptococcus that can dissolve blood clots by turning a
  blood protein into the clot-dissolving enzyme plasmin; used for some heart attacks and lung embolisms.
scope: A bacterial enzyme given to dissolve an existing clot in some heart attacks and lung blockages;
  not heparin, which prevents clotting rather than dissolving a clot, and not streptodornase, a different
  streptococcal enzyme. Medical.
examples:
- The team gave streptokinase to break up the clot in the coronary artery.
- Some patients are allergic to streptokinase because it is a bacterial protein.
