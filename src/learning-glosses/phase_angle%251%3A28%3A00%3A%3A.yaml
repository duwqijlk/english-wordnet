simpleMeaning: a given point in the time of a cycle, counted from a starting point picked at will and
  given as a measure of turning
scope: A given point in the time of a cycle, counted from a starting point and given as a measure of turning;
  phase is another name for this sense, not the length of the cycle and not the speed at which it turns.
examples:
- The phase angle of the wave was ninety degrees from the start of the cycle.
- To find the phase angle, count from the zero point round the cycle.
