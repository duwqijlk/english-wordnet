simpleMeaning: With no musky smell, white or greenish flesh fills the smooth white-skinned fruit of this
  climbing plant, one of many kinds of such plants.
scope: Also called honeydew melon and winter melon, this is a climbing plant with smooth white-skinned
  fruit, not the fruit itself.
examples:
- The winter melon vine bears fruit with a smooth white skin.
- A winter melon vine bears fruit with white or greenish flesh and no musky smell.
