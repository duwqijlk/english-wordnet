simpleMeaning: With tough leaves cut deep into narrow strips, this plant of the warm south lands is found
  far and wide.
scope: Also called a leatherleaf fern and a ten-day fern, this plant of the warm south lands has tough
  cut leaves, not the stout swamp kind with golden yellow spore cases under its leaves.
examples:
- The leather fern spread across the warm south lands.
- A leather fern grew in the warm south lands, its tough leaves cut deep into narrow strips.
