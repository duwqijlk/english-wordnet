simpleMeaning: a place in something that cannot be touched, usually imagined as having depth, such as
  a deeper layer of meaning
scope: This is a non-physical position or layer, not a floor of a building, a tool for checking flat surfaces,
  or a word for flat.
examples:
- The novel works on several levels, so different readers find different meanings in it.
- There was a deeper level to his question that I only understood later.
