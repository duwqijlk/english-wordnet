simpleMeaning: a loud mix of sounds that come from many places at once
scope: 'Also called uproar: a loud mix of sounds from many places at once, not one clear sound and not
  quiet talk from a few people.'
examples:
- We could hear the hubbub of the market from the street outside.
- A hubbub rose from the crowd as people talked and shouted at once.
