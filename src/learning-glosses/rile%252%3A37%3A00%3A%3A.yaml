simpleMeaning: to make someone feel annoyed and to trouble them, especially by small things that annoy
scope: 'Also called bother, annoy, rag, irritate, gravel, devil, nettle, vex and chafe: to make someone
  feel annoyed by small things. Not to make water cloudy by stirring it.'
examples:
- The loud music from next door really riled him.
- It riles her when people leave the door open.
