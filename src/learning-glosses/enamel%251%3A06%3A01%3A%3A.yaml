simpleMeaning: a kind of paint that leaves a hard coat with a bright shine once it has dried
scope: This is the paint sense of enamel, not the glassy coating melted onto metal or pots, not the hard
  white cover of a tooth, and not the act of putting enamel on something.
examples:
- She used white enamel on the kitchen door.
- The enamel dried to a hard, shiny finish.
