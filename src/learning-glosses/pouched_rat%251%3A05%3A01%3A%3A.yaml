simpleMeaning: This burrowing rodent of the gopher family digs underground and keeps large pouches outside
  its cheeks, living in Central America and the southwest of North America.
scope: 'Also called the gopher and the pocket gopher: a burrowing rodent with large outside cheek pouches,
  from Central America and the southwest of North America, not the pouched mouse, a small marsupial.'
examples:
- The pouched rat dug a burrow and stuffed food into its cheek pouches.
- A pouched rat from Central America carried seeds in the large pouches outside its cheeks.
