simpleMeaning: A bushy evergreen tree of dry parts of southwestern North America, with showy purple flowers
  and long seed pods, whose look recalls a willow.
scope: A purple-flowered desert tree that resembles a willow but is not one; also not the thorny desert
  olive.
examples:
- A desert willow grew beside the dry creek bed.
- The desert willow's purple flowers opened in late spring.
