simpleMeaning: care that helps a person whose body does not work well, using rubbing and pressing by hand,
  electricity on the body, and planned body movements
scope: This is care for a body problem, not work to bring back a person's good name and not work to make
  waste land good for building or growing things.
examples:
- After his leg injury, rehabilitation helped him walk again.
- Her rehabilitation included daily exercises and massage.
