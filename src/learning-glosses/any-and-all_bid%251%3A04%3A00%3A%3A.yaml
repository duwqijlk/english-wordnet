senseId: 'any-and-all_bid%1:04:00::'
synsetId: 00792338-n
simpleMeaning: An offer to take over a firm by buying every share that is still held by others.
scope: An offer to buy every share still held when taking over a firm, not an offer for part of the shares
  and not a bid for one asset only.
examples:
- The firm made an any-and-all bid for its rival.
- Shareholders accepted the any-and-all bid at once.
