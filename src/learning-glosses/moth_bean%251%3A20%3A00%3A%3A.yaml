simpleMeaning: 'Grown especially in India for food, animal feed and to enrich soil: a hairy East Indian
  bean plant with yellow flowers and tube-shaped pods, sometimes grouped with the Phaseolus beans.'
scope: The East Indian plant grown for food, animal feed and better soil, not the moth insect.
examples:
- Farmers in Rajasthan plant moth bean as a cover crop.
- The moth bean pods were drying in the sun.
