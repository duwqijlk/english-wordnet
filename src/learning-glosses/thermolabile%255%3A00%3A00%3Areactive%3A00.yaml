simpleMeaning: In chemistry, physics, and biology, easily changed or broken down by heat
scope: Easily changed or broken down by heat, not something that stands up to heat, and not something
  changed by cold.
examples:
- This thermolabile drug must be kept cool or it will break down.
- The thermolabile protein lost its shape when the water grew hot.
