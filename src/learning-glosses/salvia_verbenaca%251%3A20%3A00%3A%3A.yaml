simpleMeaning: A sage of Europe and Asia with blue flowers and leaves like verbena, now growing wild in
  the United States
scope: Vervain sage, wild clary and wild sage are other names for this sense, and it is set apart from
  other sages by its verbena-like leaves.
examples:
- Salvia verbenaca now grows wild in the United States.
- The blue flowers of Salvia verbenaca open beside its verbena-like leaves.
