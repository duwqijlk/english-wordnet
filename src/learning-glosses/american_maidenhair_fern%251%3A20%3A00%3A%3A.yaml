simpleMeaning: A tough plant of North America whose branches spread from one point like the fingers of
  a hand and curve back, borne on shiny dark red stalks.
scope: 'Also called the five-fingered maidenhair fern and Adiantum pedatum: a tough plant of North America
  with hand-like branches, not a tree fern and not a southern kind.'
examples:
- The American maidenhair fern grew in the cool shade by the stream.
- American maidenhair fern branches spread like fingers from one point.
