simpleMeaning: to dash off together in a wild, headlong rush, as animals or people do when scared
scope: To run off together in a wild rush, not a rush of animals itself and not people acting on impulse.
examples:
- The cattle stampeded when the thunder cracked.
- The crowd stampeded toward the doors when the alarm rang.
