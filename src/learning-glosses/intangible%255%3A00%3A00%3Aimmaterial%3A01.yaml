simpleMeaning: having no real solid form, and not able to be touched or seen
scope: A general word for something with no real form that cannot be touched or seen, such as the soul;
  not the sense about things a business owns with no solid form, and not the sense that means a thing
  cannot be known through the senses, above all through touch.
examples:
- Many people think of the soul as intangible, not a thing that can be touched or seen.
- The fear in the room was intangible, with no shape anyone could point to.
