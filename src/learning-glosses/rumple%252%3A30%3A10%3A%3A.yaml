simpleMeaning: to lose its smooth flat shape and get lines and folds in it
scope: 'Also called wrinkle, crumple, crease, and crinkle: getting lines and folds in it on its own, not
  bunching something up on purpose.'
examples:
- This fabric won't rumple, even after a whole day of wear.
- His shirt rumpled as he sat in the car.
