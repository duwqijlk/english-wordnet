simpleMeaning: An operation to take out the small lumps of tissue at the back of the nose, often done
  with the tonsils out too.
scope: An operation to take out tissue at the back of the nose, often with the tonsils; not the taking
  out of the tonsils alone and not any other nose operation.
examples:
- Her adenoidectomy was done when she was six.
- The adenoidectomy and the tonsillectomy were done at the same time.
