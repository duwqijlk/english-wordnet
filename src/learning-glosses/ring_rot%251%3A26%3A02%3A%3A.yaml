simpleMeaning: Tomatoes, potatoes, tobacco and the like go bad from a sickness brought on by a germ called
  Pseudomonas solanacearum.
scope: Also called ring disease and tobacco wilt, this name is used for the sickness itself, not for the
  germ that causes it.
examples:
- The ring rot spread from the potatoes to the tomatoes.
- The tomato crop was ruined by ring rot.
