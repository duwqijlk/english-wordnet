simpleMeaning: dried bark taken from several kinds of this plant, used in folk medicine (home cures passed
  down by ordinary people)
scope: This is the dried bark used as a cure, not the tree or shrub itself, which is known for living
  long and for its sweet-smelling flowers.
examples:
- She bought dried magnolia bark at the herb shop.
- Magnolia bark has long been used in folk medicine.
