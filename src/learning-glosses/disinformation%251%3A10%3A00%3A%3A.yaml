simpleMeaning: false information spread on purpose to have an effect on rivals or to confuse them, such
  as foreign enemies or business competitors
scope: This is false information spread on purpose to affect rivals, not a simple mistake and not false
  information shared with no plan.
examples:
- The army spread disinformation to confuse the enemy about its plans.
- The company used disinformation to make its business rivals believe a false story.
