simpleMeaning: a way of running the trade of a country in Europe in the 1700s, in which the government
  controlled all its business dealings to make the country richer
scope: A way of running a country's trade in 18th-century Europe, with the government controlling all
  its business; mercantile system is another name for this sense, not free trade, and not buying and selling
  as such.
examples:
- Under mercantilism, the government controlled all trade to build the nation's wealth.
- Mercantilism ruled European trade in the 1700s.
