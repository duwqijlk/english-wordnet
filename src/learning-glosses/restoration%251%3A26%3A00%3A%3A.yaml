simpleMeaning: The state of a thing brought back to the good shape it once had
scope: The state of being back in good shape, not the act of restoring, not a restored thing itself, and
  not a model of an old scene or animal.
examples:
- After the restoration, the house looked as it had a century ago.
- The inn's restoration pleased the whole village.
