senseId: 'nullifier%1:18:01::'
synsetId: 10234060-n
simpleMeaning: An official who has the power to say that a law, paper, or agreement no longer counts.
scope: An official who can make a law or paper no longer count; invalidator is another name for this;
  not a person who only holds the view that a state may refuse federal laws.
examples:
- My bank check was voided, and I wanted to know who the nullifier was.
- Only the nullifier could cancel the old agreement.
