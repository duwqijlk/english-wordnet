simpleMeaning: Used to dissolve other things and to make new chemicals built from carbon, this clear solid
  is made from the acid in vinegar.
scope: Also called acetamide, it is a clear solid that dissolves other things and helps make new chemicals
  built from carbon.
examples:
- They used ethanamide to dissolve other things.
- They made a new chemical built from carbon with ethanamide.
