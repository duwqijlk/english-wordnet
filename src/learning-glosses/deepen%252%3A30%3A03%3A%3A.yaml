simpleMeaning: to make something go down farther, such as water or a hole
scope: This sense is to make a thing itself go down farther; it is not a voice becoming lower in sound,
  and not making a feeling stronger.
examples:
- Workers deepened the lake so bigger boats could use it.
- He deepened the hole with a spade.
