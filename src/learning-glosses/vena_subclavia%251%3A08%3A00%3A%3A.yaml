simpleMeaning: The tube under the arm runs on and meets the big one in the neck, and the two together
  become a large one in the upper chest.
scope: Also called a subclavian vein, this tube is the meeting point of the one under the arm and the
  big one in the neck, forming a large one in the upper chest.
examples:
- Blood from the arm flows on through the vena subclavia toward the chest.
- The vena subclavia joins the big blood tube in the neck.
