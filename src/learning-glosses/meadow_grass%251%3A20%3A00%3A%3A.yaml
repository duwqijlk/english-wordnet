simpleMeaning: Where the ground stays wet, many kinds of green plants with thin leaves grow well there
scope: 'Also called meadowgrass: any of several green plants with thin leaves that grow well in wet ground,
  not a single kind of plant and not a dry-field crop.'
examples:
- Meadow grass grows thick beside the stream.
- The meadow grass stays green all summer in the wet field.
