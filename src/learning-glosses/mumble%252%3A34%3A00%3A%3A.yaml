simpleMeaning: to crush food with the gums, chewing with no teeth and with great trouble
scope: To crush food with the gums when there are no teeth, not to speak in a low unclear voice.
examples:
- The old man had no teeth left and mumbled his food.
- She watched her grandfather mumble his bread at the table.
