simpleMeaning: to give something its main idea or feeling, which the rest then follows
scope: To set the main idea or feeling for something; not the main idea itself, and not giving the main
  speech to a group of listeners.
examples:
- Comfort keynotes this designer's fall collection.
- A feeling of hope keynotes the whole book.
