simpleMeaning: a whale of middle size that lives in the north Pacific, and has black skin with some grey
  in it
scope: 'Also called gray whale and grey whale: a whale of the north Pacific; not the very large flat fish
  that lives in warm seas, and not the sea animal with eight long arms that lives on the sea floor.'
examples:
- Watchers on the shore saw a devilfish swimming north in the Pacific.
- The devilfish came up for air close to the boat.
