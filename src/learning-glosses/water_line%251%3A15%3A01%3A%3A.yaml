simpleMeaning: a mark showing how high the clear liquid we drink reached
scope: A mark showing how high the clear liquid we drink reached; watermark is another name for this sense,
  not the mark on a ship's hull and not a pipe carrying water.
examples:
- The water line on the wall showed how deep the flood had been.
- A dark water line marked the side of the bath.
