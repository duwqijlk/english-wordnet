simpleMeaning: The name given to a bear in old tales, after its use in the old story of Reynard the Fox.
scope: The name for a bear in old tales, after Reynard the Fox; not the ordinary word for a bear and not
  a toy bear.
examples:
- In the old tales, Bruin the bear is tricked by the fox.
- Children loved hearing about Bruin and his honey.
