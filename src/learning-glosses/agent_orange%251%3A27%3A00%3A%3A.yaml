simpleMeaning: A weed killer used in the Vietnam War to strip leaves from trees in forest land
scope: A weed killer used in war to strip leaves from trees in forest land, not a weed killer for gardens
  and not a poison made to kill people.
examples:
- Agent Orange was sprayed over the forests during the Vietnam War.
- The use of Agent Orange stripped the leaves from whole forests.
