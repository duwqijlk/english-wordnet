simpleMeaning: Acid build-up in the blood from poor exchange of gases in the lungs, as with emphysema
  or pneumonia; excess carbon dioxide and water form carbonic acid, raising blood acidity.
scope: This is another name for respiratory acidosis, the lung-related form caused by poor breathing;
  it is not metabolic acidosis, which starts elsewhere in the body.
examples:
- Carbon dioxide acidosis can develop when emphysema slows the exchange of gases in the lungs.
- Her doctor treated carbon dioxide acidosis by helping her breathe more effectively.
