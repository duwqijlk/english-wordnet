simpleMeaning: a thin strip of metal put between rows of printed letters to space them out.
scope: This is a printing material, not the act of guiding a group or being in first place.
examples:
- The printer adjusted the leading to make the page easier to read.
- Strips of leading separate the lines on this old press.
