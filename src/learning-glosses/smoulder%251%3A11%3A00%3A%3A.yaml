simpleMeaning: a fire with no flame, which burns in a way that makes thick smoke
scope: 'Also called smolder: a fire that gives thick smoke but no flame, not the act of burning slowly
  with no flame.'
examples:
- The smoulder gave off thick smoke for hours after the main fire died down.
- A small smoulder in the pile sent up smoke but no flame.
