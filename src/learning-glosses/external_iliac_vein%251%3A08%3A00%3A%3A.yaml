simpleMeaning: A blood tube that joins the inner one of the hip to make the shared one of the hip, carrying
  on from the one in the thigh
scope: This is a blood tube of the hip that joins two others, not the one in the thigh itself and not
  the shared one it helps to make.
examples:
- The external iliac vein carries on from the vein in the thigh.
- The external iliac vein joins the inner vein of the hip.
