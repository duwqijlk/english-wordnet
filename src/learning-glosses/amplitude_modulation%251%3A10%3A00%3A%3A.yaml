simpleMeaning: a way of changing the strength of a radio wave that carries a signal
scope: This changes how strong the radio wave is, not how often it waves, and not the wave itself.
examples:
- The station used amplitude modulation to send its programs.
- Amplitude modulation changes the strength of the carrier wave to carry sound.
