simpleMeaning: a hollow part inside a woman, low in the body between the hip bones, made of muscle, where
  a baby grows before it is born
scope: 'Also called womb: the part inside a woman where a baby grows. Not any other part of a woman''s
  body, and not a man''s body part.'
examples:
- The baby grows in the uterus before birth.
- The doctor checked her uterus during the scan.
