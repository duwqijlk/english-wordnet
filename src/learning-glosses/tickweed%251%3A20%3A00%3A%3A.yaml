simpleMeaning: These American plants of the genus Coreopsis flower for a long season, bearing great numbers
  of bright, usually yellow flowers shaped like daisies.
scope: Also called coreopsis, tick-weed, and tickseed, it is one of many kinds of plant with daisy-like
  flowers, not a true daisy.
examples:
- The tickweed bore yellow flowers in great numbers.
- She planted tickweed for its bright yellow flowers.
