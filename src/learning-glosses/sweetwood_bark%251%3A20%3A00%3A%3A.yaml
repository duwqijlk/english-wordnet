simpleMeaning: the sweet-smelling outer covering of the cascarilla, a tree that smells sweet, used to
  make people feel stronger and burned to give a sweet smell
scope: This is the sweet-smelling outer covering of the cascarilla tree, also called cascarilla bark and
  eleuthera bark; not the covering of other trees and not a cure for one set illness.
examples:
- The sweetwood bark gave the room a warm, sweet smell.
- She burned a piece of sweetwood bark to make the air smell sweet.
