simpleMeaning: a piece of leather sewn to the side of a horse's head straps, covering one eye so the horse
  cannot see to that side
scope: Also called blinker and winker, this is a leather piece that stops a horse seeing to the side;
  it is not a flashing light on a car.
examples:
- The horse wore blinders so passing carts would not scare it.
- He put a blinder on each side of the horse's head before the race.
