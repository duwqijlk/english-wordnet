synsetId: 92443586-n
simpleMeaning: In mathematics, the mark of a pairing in which each thing made comes from just one start,
  never from two.
scope: In mathematics, this is the mark of a one-to-one pairing, not of a pairing that lets two starts
  share one result.
examples:
- They proved the injectiveness of the rule by showing that no two starts gave the same result.
- Without injectiveness, two different starts could give the same result.
