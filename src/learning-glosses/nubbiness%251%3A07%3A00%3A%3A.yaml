simpleMeaning: How loose or rough a cloth feels to the touch
scope: A loose or rough feel of cloth, also called coarseness; not the feel of a smooth cloth and not
  a fault in the weave.
examples:
- The nubbiness of the tweed gave the jacket a homespun look.
- She liked the nubbiness of the hand-woven blanket.
