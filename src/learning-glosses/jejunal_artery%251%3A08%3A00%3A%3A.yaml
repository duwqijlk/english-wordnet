simpleMeaning: A branch of the main blood tube of the gut, this tube carries blood to the middle part
  of the small gut
scope: Also called intestinal artery, this is the branch off the main blood tube of the gut that serves
  the middle part of the small gut.
examples:
- Blood for the middle part of the small gut came through a jejunal artery.
- The jejunal artery runs from the main blood tube of the gut to the middle part of the small gut.
