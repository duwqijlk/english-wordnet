simpleMeaning: the part of astronomy that uses Newton's laws of motion to study how bodies in the sky
  move
scope: The part of astronomy that uses Newton's laws of motion to study how bodies in the sky move, not
  the study of stars and planets themselves and not the laws of motion on Earth.
examples:
- Celestial mechanics explains how the planets move around the Sun.
- She studied celestial mechanics to work out the Moon's path.
