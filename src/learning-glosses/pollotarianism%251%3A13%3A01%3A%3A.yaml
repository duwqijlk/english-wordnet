simpleMeaning: the way of eating that lets a person eat chicken or other birds kept for food, but not
  meat from animals that feed their young with milk
scope: This is a way of eating that includes chicken or other birds kept for food and leaves out meat
  from animals that feed their young with milk, not a way of eating that includes all meat or no meat
  at all.
examples:
- She follows pollotarianism, so she eats roast chicken but never eats beef.
- Pollotarianism works for him because he likes turkey and duck but does not want pork or lamb.
