simpleMeaning: to hide a thing under a cover, the way a burial cloth hides a body
scope: 'Also called cover: to hide a thing under a cover as if with a burial cloth, not to wrap a dead
  body and not a cloth or rope itself.'
examples:
- The origins of this civilization are shrouded in mystery.
- Fog shrouded the valley in grey.
