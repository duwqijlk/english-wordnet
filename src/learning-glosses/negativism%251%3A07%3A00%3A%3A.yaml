senseId: 'negativism%1:07:00::'
synsetId: 05175145-n
simpleMeaning: the habit of not trusting what others say and pushing back against their ideas or orders,
  in a way others find hard to take
scope: 'Also called negativity and negativeness: a habit of doubt and refusal, not a single angry outburst
  and not a reasoned objection.'
examples:
- The patient's negativism made it hard for the nurses to help him.
- His negativism showed itself in constant doubts and refusals.
