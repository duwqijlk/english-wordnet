simpleMeaning: A hard metal that breaks with ease, blue-grey or blue-black in colour, one of the platinum
  metals and the heaviest metal known.
scope: Also called Os and atomic number 76; of all metals known it is the heaviest, a hard metal that
  breaks with ease and is blue-grey or blue-black, one of the platinum metals.
examples:
- Osmium is the heaviest metal known.
- A lump of osmium is hard, brittle, and blue-grey.
