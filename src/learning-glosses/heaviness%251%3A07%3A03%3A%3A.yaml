simpleMeaning: a heavy, dull quality that is slow, grave and clumsy
scope: A heavy, dull quality that is slow, grave and clumsy; not an unwelcome burden, and not the weight
  of a thing.
examples:
- The heaviness of his lectures put the class to sleep.
- Her writing had a heaviness that slowed every page.
