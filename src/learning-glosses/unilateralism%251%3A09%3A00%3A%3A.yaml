senseId: 'unilateralism%1:09:00::'
synsetId: 05972611-n
simpleMeaning: the idea that each country should handle its dealings with other countries alone, without
  advice from other countries and without their taking part
scope: A belief about how a country should deal with other countries, not one single act done alone and
  not a wish to have no dealings with other countries at all.
examples:
- His unilateralism led him to make deals without asking his country's friends for advice.
- Under unilateralism, a country can be left to face big problems alone.
