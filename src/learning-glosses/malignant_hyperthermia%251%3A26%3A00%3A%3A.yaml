simpleMeaning: Some drugs that put a person to sleep, such as halothane, make the body very hot and the
  muscles go stiff, in a condition passed down in families
scope: It names a condition passed down in families in which certain sleep drugs make the body very hot
  and the muscles go stiff.
examples:
- Malignant hyperthermia made his body very hot and his muscles go stiff after the sleep drug was given.
- The sleep drug brought on malignant hyperthermia, and his body turned very hot.
