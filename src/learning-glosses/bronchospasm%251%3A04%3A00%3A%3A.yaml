simpleMeaning: a sudden tightening of the air tubes that makes breathing out hard and loud, found with
  asthma and bronchitis
scope: This is a sudden tightening of the air tubes that makes breathing out hard and loud, found with
  asthma and bronchitis, not a coughing fit and not a cramp in the leg.
examples:
