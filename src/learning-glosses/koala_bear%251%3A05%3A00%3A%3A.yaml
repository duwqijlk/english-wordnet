simpleMeaning: A slow-moving, tailless, tree-dwelling Australian marsupial, a mammal with a pouch for
  its young, grey furry ears and coat, feeding on eucalyptus leaves and bark.
scope: A tree-dwelling Australian mammal with a pouch; despite the name it is not a true bear or a kangaroo,
  while koala and kangaroo bear are other names for this same animal.
examples:
- We watched a koala bear eating eucalyptus leaves and bark.
- A koala bear has grey furry ears and no tail.
