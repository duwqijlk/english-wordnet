simpleMeaning: to make waves of electric and magnetic power come in short bursts, to change them in that
  way, or to make a machine do so
scope: 'Also called pulse: to make or change power waves in short bursts, not to beat in a steady way
  like a heart.'
examples:
- The transmitter pulsates the signal in short bursts.
- Engineers pulsated the radio waves to send the code.
