simpleMeaning: A person who believes they are ill, though their pains and sicknesses are not real.
scope: A person who believes they are ill, though their pains and sicknesses are not real, not the adjective
  use for suffering from hypochondria.
examples:
- The hypochondriac visited the doctor every week with a new complaint.
- They were known as a hypochondriac, always sure some new illness had struck.
