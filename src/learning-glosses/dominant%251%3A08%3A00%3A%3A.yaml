senseId: 'dominant%1:08:00::'
synsetId: 05445706-n
simpleMeaning: in a pair of gene forms, the one whose outward effect stays the same, whether the form
  it is paired with matches it or not
scope: 'A noun: one gene form in a pair, not the adjective sense of a gene that shows the same effect
  as its partner.'
examples:
- The brown-eye gene is a dominant that shows even when paired with the blue-eye gene.
- A dominant shows its effect whether its partner is the same or different.
