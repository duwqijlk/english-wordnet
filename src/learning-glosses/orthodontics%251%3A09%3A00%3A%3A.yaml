simpleMeaning: The part of tooth care that stops teeth growing crooked or straightens teeth that have
  grown out of line.
scope: Dentists who stop teeth growing crooked or straighten teeth that have grown out of line work in
  this field, also called dental orthopaedics, dental orthopedics, orthodontia, and orthodonture.
examples:
- Crooked teeth can be put right with orthodontics.
- Teeth that grow out of line are kept straight by orthodontics.
