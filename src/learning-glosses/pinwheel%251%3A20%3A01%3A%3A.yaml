simpleMeaning: a small, low plant of Tenerife that lives for many years and has a hard lower stem, with
  leaves in tight round groups spreading from one point
scope: This is a plant from Tenerife, not the paper toy that spins in the wind, not a spinning firework,
  and not a wheel with pins.
examples:
- The pinwheel in her Tenerife garden has leaves in tight round groups.
- Pinwheels grow well in dry soil, their leaves spreading out from one point.
