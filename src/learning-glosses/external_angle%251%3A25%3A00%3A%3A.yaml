simpleMeaning: For a shape with straight sides, what is left of a straight line after you take away a
  corner on the inside of the shape
scope: 'Also called an exterior angle: what is left of a straight line after an inside corner of a shape
  with straight sides is taken away, not the inside corner itself and not a corner of a shape with curved
  sides.'
examples:
- The external angle of the square was 90 degrees.
- To find the external angle, subtract the interior angle from 180 degrees.
