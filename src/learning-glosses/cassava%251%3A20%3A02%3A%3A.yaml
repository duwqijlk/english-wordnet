simpleMeaning: The root of this plant, eaten as a main food after drying and washing out its juices, and
  the source of tapioca.
scope: Also called manioc, the root eaten as a main food, not the starch made from it and not the plant
  itself.
examples:
- They boiled cassava and ate it with fish.
- Dried cassava keeps for months in the store.
