simpleMeaning: a piece of equipment you turn or move to let a liquid or gas through, slow it down, or
  stop it
scope: A tap-like device that starts, slows or stops a liquid or gas, not the part of a brass instrument
  that changes pitch and not a heart flap.
examples:
- Turn the valve to let water into the tank.
- He shut the valve and the gas stopped flowing.
