simpleMeaning: Often used as a medicine and in tanning, for example, a resin or extract comes from this
  East Indian tree.
scope: This is the East Indian tree that gives the resin, not the gum itself.
examples:
- Kino grew in the East Indies and gave a resin used in tanning.
- The kino gave a resin often used as a medicine.
