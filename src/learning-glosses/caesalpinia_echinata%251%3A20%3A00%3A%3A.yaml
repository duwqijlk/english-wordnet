simpleMeaning: A tree of tropical lands with a prickly trunk, whose heavy red wood gives a red dye and
  is used to make fine wooden furniture.
scope: This is a tropical tree with a prickly trunk whose heavy red wood gives dye and fine furniture
  wood; brazilwood, peach-wood, peachwood and pernambuco wood are other names for it, not other tropical
  trees with soft pale wood.
examples:
- Caesalpinia echinata grows in the hot forests of Brazil.
- The red wood of Caesalpinia echinata was once used for dye.
