simpleMeaning: A form of fun that tells a story with sound and a run of still images that seem to move.
scope: Also called movie, film, picture, flick, pic, motion picture, moving-picture show, moving picture
  and picture show; a story told with sound and still images that seem to move, not a live play and not
  a single still photograph.
examples:
- We watched a motion-picture show about the sea.
- The motion-picture show starts at seven.
