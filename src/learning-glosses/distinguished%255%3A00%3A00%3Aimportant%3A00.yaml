simpleMeaning: standing out above other people for fine character, great work, or a good name
scope: A person who stands above others in character, work, or name, not a person with a dignified look
  or manner.
examples:
- Our distinguished professor gave the opening talk.
- He is a distinguished scientist, known around the world for his work.
