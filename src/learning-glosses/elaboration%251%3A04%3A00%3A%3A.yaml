simpleMeaning: The act of working a thing out bit by bit, in fine detail and with great care.
scope: The act of working a thing out in fine detail and with great care, not the adding of extra material
  and not the quality of being full of fine detail.
examples:
- The elaboration of the plan took weeks of careful work.
- Her elaboration of the design added fine detail at every step.
