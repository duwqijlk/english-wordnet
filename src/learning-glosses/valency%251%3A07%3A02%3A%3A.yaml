simpleMeaning: This is the measure of how well a bit of living stuff joins with, acts on, or works with
  things the body fights off or other living stuff.
scope: Also called valence, this is a measure of how far a bit of living stuff can join with or act on
  other living stuff, not the combining power of atoms in chemistry.
examples:
- The valency of the stuff showed how well it could join with the antigen.
- Scientists measured the valency of the cell part to see how it would act on other living stuff.
