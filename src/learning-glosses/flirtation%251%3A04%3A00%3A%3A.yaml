simpleMeaning: fun, light ways of acting that are meant to make someone feel sexual interest in you
scope: 'Also called flirt, flirting, toying, dalliance and coquetry: fun acting meant to draw sexual interest,
  not serious love or a plan to start a lasting relationship.'
examples:
- Their flirtation at the party was light and fun, and both of them smiled a lot.
- She enjoyed the flirtation but did not want a serious relationship.
