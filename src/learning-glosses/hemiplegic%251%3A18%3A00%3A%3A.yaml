simpleMeaning: a person who cannot move one side of the body
scope: A person who cannot move one side of the body; not a person who cannot move at all and not a person
  with a weak arm only.
examples:
- After the stroke, he became a hemiplegic and needed help to walk.
- The hemiplegic patient worked with a therapist to move her left side.
