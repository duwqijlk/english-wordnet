simpleMeaning: More of two brain chemicals stay free to act on the brain's receivers with this medicine
  for low mood, which blocks the body from taking them back.
scope: Tricyclic and tricyclic antidepressant are other names for this medicine for low mood, which leaves
  more of two brain chemicals free to act in the brain.
examples:
- He took a tricyclic antidepressant drug for his low mood.
- Her low mood lifted after she started on a tricyclic antidepressant drug.
