simpleMeaning: In geology, the slow grinding down of a thing as small bits wash over it; the word is also
  used of other slow losses.
scope: In geology, a slow grinding down; wearing, eroding, erosion and eating away are other names for
  this sense, not a sudden break and not a chemical change.
examples:
- The wearing away of the cliff took thousands of years.
- Rain and wind caused the wearing away of the old stone steps.
