simpleMeaning: A machine run by power that both picks up broadcasts and plays records
scope: 'Also called radio-phonograph: one machine that both picks up broadcasts and plays records, not
  a set that only picks up broadcasts and not a machine that only plays records.'
examples:
- The radio-gramophone in the corner played records and picked up the evening news.
- They bought a radio-gramophone so they could hear broadcasts and play their records on one machine.
