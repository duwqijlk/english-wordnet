simpleMeaning: a set of things, events or ideas in a line, where each one follows the one before it and
  is linked to it
scope: 'Also called a train: a line of things, events or ideas that follow one after another, not a thin
  cord for tying and not music instruments played with a bow.'
examples:
- A string of bad luck kept hitting the family that year.
- She had a string of ideas and wrote them down in order.
