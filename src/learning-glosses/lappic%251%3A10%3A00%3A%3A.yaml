simpleMeaning: One of the ways of speaking used by the Lapp people, generally held to be part of the Uralic
  family of languages
scope: One of the Lapp ways of speaking, also called Lappic language, Lappish and Lappish language; not
  the Lapp people themselves and not one single tongue, since it covers several.
examples:
- Lappic is spoken across the far north of Europe.
- She learned a few words of Lappic on her trip north.
