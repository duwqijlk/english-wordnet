simpleMeaning: Often growing wild in Britain and the United States, this small Eurasian bush bears bunches
  of yellow flowers that give a dye and is at times grown for show.
scope: People also call it whin, dyer's-broom, dyeweed, greenweed, woadwaxen, and woodwaxen; the names
  all mark one small bush of Europe and Asia, known by its bunches of yellow flowers that give a dye and
  its weed growth in Britain and the United States.
examples:
- The dyer's greenweed bears bunches of yellow flowers.
- Dyer's greenweed grows as a weed in Britain and the United States.
