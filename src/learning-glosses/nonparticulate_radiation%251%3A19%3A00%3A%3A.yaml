simpleMeaning: Radiation made of waves of energy linked to electric and magnetic fields, produced when
  an electric charge speeds up.
scope: Electromagnetic radiation and electromagnetic wave are other names for it, energy that moves in
  waves tied to electric and magnetic fields and set off when an electric charge speeds up.
examples:
- Nonparticulate radiation moves in waves.
- The charge sped up and gave off nonparticulate radiation.
