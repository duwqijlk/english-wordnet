simpleMeaning: In chemistry, the trait of some substances that lets them be in two unlike crystal forms.
scope: In chemistry, the trait of some substances that lets them be in two unlike crystal forms; not,
  in life science, the being of two forms of one beast within the same kind, apart from sex differences.
examples:
- Their dimorphism showed in the test.
- The dimorphism was plain in the scan.
