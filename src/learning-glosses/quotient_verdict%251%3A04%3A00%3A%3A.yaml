simpleMeaning: A wrong and not allowed kind of decision, made when each side gives up something to reach
  a deal
scope: A wrong and not allowed kind of verdict reached by a compromise, not a fair verdict based on the
  facts.
examples:
- The quotient verdict was set aside because it was not a proper decision.
- They reached a quotient verdict by each giving up part of what they wanted.
