simpleMeaning: a shoe made of a flat bottom piece held to the foot by straps
scope: This is the open shoe held on by straps; it is not a closed shoe and not a soft shoe worn only
  inside the home.
examples:
- She wore a sandal on each foot for the walk along the beach.
- His sandal broke when a strap came loose.
