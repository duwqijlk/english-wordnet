scope: 'Also called Pinus parryana and Pinus quadrifolia: a five-needled pinon of southern California
  and northern Baja California, sometimes with three or four needles where it has crossed with Pinus californiarum.'
examples:
- We found a Parry's pinyon with five needles on the dry hills of Baja California.
- The Parry's pinyon sometimes shows only three needles where it has crossed with other pines.
