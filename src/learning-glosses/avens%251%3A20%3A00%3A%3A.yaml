simpleMeaning: With leaves most often feather-shaped low down and flowers of many colours, this is one
  of several kinds of plant that live year after year, of the group called Geum.
scope: This is one of several kinds of long-lived plant of the group called Geum, not a plant that lives
  only one year.
examples:
- The avens had feather-shaped leaves low down and flowers of many colours.
- Avens are plants that live year after year.
