senseId: 'pelvis%1:08:00::'
synsetId: 05604406-n
simpleMeaning: the set of bones that holds up the legs in a person, and the back legs or like parts in
  other animals with a backbone
scope: Also called hip, pelvic arch and pelvic girdle. This is the set of bones that holds up the legs,
  not the funnel-shaped part inside the kidney.
examples:
- She broke a bone in her pelvis when she fell.
- The pelvis holds up the legs and joins them to the upper body.
