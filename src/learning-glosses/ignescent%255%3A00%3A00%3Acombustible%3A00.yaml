simpleMeaning: Sparks can fly from it, or it can catch fire all at once
scope: Something that can throw out sparks or suddenly catch fire; not something already burning and not
  something that cannot burn.
examples:
- The dry wood is ignescent and can flare up with one spark.
- Handle the ignescent powder with care, since it may burst into flame.
