simpleMeaning: The gut and the breathing tubes grow their linings from this inner layer of cells in a
  very young embryo.
scope: This is also called endoderm, entoblast, entoderm, and hypoblast, and it is the inner layer of
  cells in a very young embryo, not the outer layer.
examples:
- The endoblast grows into the lining of the gut.
- In the early embryo, the endoblast forms the lining of the breathing tubes.
