simpleMeaning: a name for the many thin threads that carry smell in the lining of the nose
scope: A name for the many thin threads that carry smell in the lining of the nose; first cranial nerve
  and nervii olfactorii are other names for this sense, not the nerve that carries sight and not the nose
  itself.
examples:
- The olfactory nerve carries smell signals from the nose.
- Damage to the olfactory nerve can take away the sense of smell.
