simpleMeaning: The ridge down the middle of the breastbone of a bird that can fly
scope: The ridge down the middle of a flying bird's breastbone, not the long beam at the bottom of a boat
  and not any other ridge that looks like one.
examples:
- The keel of the bird gave its wing muscles a place to join.
- A strong keel showed the bird was built for flight.
