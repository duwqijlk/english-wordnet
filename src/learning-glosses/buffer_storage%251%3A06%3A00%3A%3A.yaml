simpleMeaning: In computer science, a holding place in memory where data waits to be taken by a machine,
  letting parts of a computer that move data at different speeds work together
scope: In computer science, this is a part of memory that holds data briefly while it waits to be sent
  to a machine; buffer and buffer store are other names for it, not the computer's main memory and not
  a hard disk.
examples:
- The buffer storage held the data until the printer was ready.
- Buffer storage evens out the flow of data between parts of the computer.
