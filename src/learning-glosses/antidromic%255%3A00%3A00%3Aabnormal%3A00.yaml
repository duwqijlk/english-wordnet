simpleMeaning: carrying signals along a nerve in the reverse of the usual direction
scope: Carrying nerve signals in the reverse of the usual direction, not the normal forward flow of signals
  along a nerve.
examples:
- The antidromic impulse travelled back along the nerve.
- An antidromic signal moves in the opposite direction to normal nerve traffic.
