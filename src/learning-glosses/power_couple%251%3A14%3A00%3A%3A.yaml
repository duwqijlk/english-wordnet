simpleMeaning: A pair of people, both with big jobs or with weight in the affairs of the country
scope: A pair of people who both hold big jobs or carry weight in the affairs of the country, not two
  people who merely work together and not a pair known only for being rich.
examples:
- The power couple both held top jobs in the city.
- They were called a power couple because each had weight in the affairs of the country.
