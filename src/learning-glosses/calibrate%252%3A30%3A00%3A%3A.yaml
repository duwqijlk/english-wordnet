schema: oewn-learning-gloss-v2
senseId: 'calibrate%2:30:00::'
synsetId: 00296478-v
simpleMeaning: to make small changes to a thing, or to mark it out in set steps, so that it measures as
  well as it can
scope: Also called graduate, and another name for this sense is fine-tune; it is about changing or marking
  a thing so it measures well, not just marking its scale to read in the units you want, and not measuring
  the inside width of a tube or gun.
examples:
- Please calibrate the scale before you weigh the fruit.
- He calibrated the glass tube by marking it in equal steps.
