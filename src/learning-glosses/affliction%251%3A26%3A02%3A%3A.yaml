simpleMeaning: A person in hard times feels deep pain and worry.
scope: This is deep pain and worry that comes from hard times in life; not one brief pain and not one
  illness by itself.
examples:
- Her affliction lasted through years of hardship.
- He bore his affliction with quiet patience.
