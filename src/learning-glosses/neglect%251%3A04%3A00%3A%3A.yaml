senseId: 'neglect%1:04:00::'
synsetId: 00740568-n
simpleMeaning: Not acting with the care that a careful person would show in the same situation
scope: A single failure to take care as one should, not a lasting habit of ignoring duties and not the
  bad state of a thing left unused.
examples:
- The court found neglect when the driver had not checked his brakes for months.
- Leaving the gate open was neglect, because a careful owner would have locked it.
