simpleMeaning: A point used in measuring skulls, halfway between the two raised bumps on the front of
  the skull.
scope: A point used in measuring skulls, halfway between the two raised bumps on the front of the skull;
  not the top of the skull and not the point between the eyes.
examples:
- The metopion lies halfway between the two bumps on the front of the skull.
- She marked the metopion on the skull before measuring it.
