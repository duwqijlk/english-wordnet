simpleMeaning: Most of all from some kinds in the southwest of North America, the seeds of any of several
  cone-bearing trees are ones people can eat.
scope: Also called pignolia and pine nut, these are seeds people can eat, most of all some kinds from
  the southwest of North America.
examples:
- We ate pinon nuts.
- They ate pinon nuts from the southwest of North America.
