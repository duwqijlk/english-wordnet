simpleMeaning: Said of things that belong to that family of kings, or have to do with them.
scope: This word marks things of that family of kings or its people, not the family of kings itself and
  not one of its people.
examples:
- The Merovingian kings ruled long ago.
- Merovingian art shows the style of that family of kings.
