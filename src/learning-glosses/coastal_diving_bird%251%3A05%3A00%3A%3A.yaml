simpleMeaning: a winged sea animal of the gull kind, skimmer kind, jaeger kind, or auk kind that swims
  down under water near the shore
scope: A winged sea animal of the gull, skimmer, jaeger or auk kind that swims down under water near the
  shore, not a land animal and not a sea animal of the open sea far from land.
examples:
- The coastal diving bird dropped under the waves to catch a fish.
- We watched a coastal diving bird swim down under the water near the rocks.
