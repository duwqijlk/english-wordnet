simpleMeaning: In animals, stopping or slowing down in summer, above all a slowing of the body's inner
  work in some animals in a hot or dry spell
scope: In animals, stopping or slowing down in summer, also called aestivation; not the way flower parts
  lie in a bud, and not sleep in winter.
examples:
- The snail's estivation lasted through the hot dry weeks.
- Estivation lets some animals rest when the heat is worst.
