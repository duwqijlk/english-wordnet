simpleMeaning: wet, spongy ground made of rotting plants, draining worse than a swamp, whose soil cannot
  be farmed but can be cut and dried for fuel
scope: Wet ground made of rotting plants, worse at draining than a swamp, not a swamp itself and not farmland.
examples:
- The hikers picked their way across the bog.
- They cut peat from the bog to burn for fuel.
