simpleMeaning: grown closely joined to a different part of a plant or body
scope: This is about unlike parts grown close together, not parts of the same kind and not parts that
  stay apart.
examples:
- The calyx was adnate to the ovary, so the two parts could not be pulled apart.
- The leaf is adnate to the stem and grows with it.
