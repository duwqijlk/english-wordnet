simpleMeaning: A disease of children, caused by too little of the vitamin called D and too little sun,
  so the body cannot use calcium and phosphorus as it should.
scope: Also called rachitis, this is a disease of children caused by too little vitamin D and sun.
examples:
- Rickets left the child's legs bent.
- The doctor said rickets came from too little sun.
