simpleMeaning: an automatic trembling of the body set off by cold, fear or excitement
scope: The involuntary bodily tremor from cold, fear or excitement, not the musical trill on a note and
  not a deliberate movement of the head or hand.
examples:
- A violent shake ran through her as she stepped into the freezing water.
- He could not stop the shake in his hands before the interview.
