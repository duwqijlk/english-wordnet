simpleMeaning: To work out how much a thing holds, by measuring it and doing the sums.
scope: To work out how much a thing holds by measuring and doing the sums, not the tool itself and not
  a set example to judge by.
examples:
- They gauged the wine barrels before the harvest.
- He gauged the tank to see how much water was left.
