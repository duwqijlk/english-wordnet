simpleMeaning: in a heavy, slow and dull way that is not interesting
scope: In a heavy, slow and dull way that is not interesting; this sense adds the idea of being dull,
  not just doing something in a heavy way.
examples:
- The play moved ponderously, with long dull scenes that made the crowd lose interest.
- He spoke ponderously for an hour, and his dull talk sent half the room to sleep.
