simpleMeaning: any of three substances (acetoacetic acid, beta-hydroxybutyric acid and acetone) produced
  when fats are broken down for energy; they build up in blood and urine in some metabolic disorders
scope: The general name for this group of three; acetone body means the same group, while acetone alone
  is just one member.
examples:
- Doctors checked his blood for ketone bodies when his diabetes was badly controlled.
- A very low-carb diet can raise ketone bodies in the blood.
