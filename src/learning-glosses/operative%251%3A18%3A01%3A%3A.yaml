simpleMeaning: a person who works in secret for a government to get secret facts about other people or
  countries
scope: A person who spies in secret for a government, not a detective hired to help catch criminals, not
  the word for needing surgery, and not a machine that is working.
examples:
- The operative passed secret files to his government contact.
- Police found that the man was an operative working for a foreign government.
