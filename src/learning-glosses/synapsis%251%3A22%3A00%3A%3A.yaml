senseId: 'synapsis%1:22:00::'
synsetId: 13585248-n
simpleMeaning: The side-by-side pairing of matching chromosomes from the mother and the father at the
  start of meiosis, the cell division that makes sex cells.
scope: This is the pairing of matching chromosomes at the start of meiosis, not the pairing of whole cells
  and not fertilisation.
examples:
- Synapsis pairs the chromosomes at the start of meiosis.
- During synapsis, matching chromosomes lie side by side.
