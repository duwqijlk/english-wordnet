simpleMeaning: lacking colour far more than usual, as a person looks when ill or deeply upset
scope: A face lacking colour from illness or distress, with pale and wan as other names for this sense,
  and not faint light or dull writing.
examples:
- The pallid face of the invalid worried the nurse.
- Her pallid cheeks showed how ill she felt.
