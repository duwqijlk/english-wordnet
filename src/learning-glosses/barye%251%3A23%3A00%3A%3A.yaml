simpleMeaning: an absolute unit that measures pressure, equal to one dyne, a very small push, on each
  square centimetre
scope: 'Also called bar absolute and microbar: a unit that measures pressure, not a unit of weight and
  not a unit of length.'
examples:
- The scientist gave the pressure in baryes.
- One barye is a very small unit of pressure.
