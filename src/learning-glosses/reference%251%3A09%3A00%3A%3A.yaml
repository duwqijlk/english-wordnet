simpleMeaning: The exact thing a word or phrase names, together with the whole group of objects it can
  point to.
scope: This is what a word names, not the link between a word and its object, and not the act of checking
  a source.
examples:
- 'Philosophers ask what fixes the reference of a name: description or direct contact with the thing.'
- '"The morning star" and "the evening star" share the same reference, because both point to Venus.'
