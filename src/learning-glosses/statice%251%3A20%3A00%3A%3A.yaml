simpleMeaning: With spikes of white or pale purple flowers, one of many kinds of plant of the Limonium
  group grows in mild salt marshes.
scope: This is also called marsh rosemary and sea lavender, a plant of mild salt marshes with spikes of
  white or pale purple flowers, not a plant of fresh water.
examples:
- She saw statice in the salt marsh.
- Statice grows in the salt marsh.
