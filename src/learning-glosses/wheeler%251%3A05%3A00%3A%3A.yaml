senseId: 'wheeler%1:05:00::'
synsetId: 02390233-n
simpleMeaning: a horse used for pulling heavy loads, put in straps behind the other horses and nearest
  to the vehicle it pulls
scope: This sense is the horse nearest to the vehicle in a team, not a person who makes or fixes wooden
  wheels and not a man at the end of a line in a turning move.
examples:
- The wheeler pulled hard as the wagon started to move.
- They put the strongest horse as the wheeler, closest to the cart.
