simpleMeaning: a tank joined to a toilet, holding the water that washes the toilet clean when it is let
  out
scope: This is the toilet tank, not a large underground tank for keeping rainwater and not a small space
  in the body that holds fluid.
examples:
- The cistern filled slowly after each flush.
- He lifted the lid of the cistern to fix the chain inside.
