simpleMeaning: A group of countries on the continent set up after World War II to cut trade barriers and
  help its members work together.
scope: Not the continent itself; also called the EU, the EC, the Common Market, the EEC, the European
  Community, the European Economic Community and the European Union.
examples:
- Europe sets rules on trade for its members.
- He tried to take Britain into Europe.
