simpleMeaning: A blood fat that carries cholesterol; it holds some protein and much cholesterol, and high
  amounts are thought to raise the chance of heart sickness and hard blood vessels
scope: Also called beta-lipoprotein or low-density lipoprotein; this is the blood fat that carries cholesterol,
  not the other blood fats.
examples:
- His LDL was high.
- The doctor said her LDL should come down.
