simpleMeaning: A dish, often shaped like a small ship, for serving meat juices or sauce at the table
scope: This is a dish for serving meat juices or sauce; boat and gravy boat are other names for it, not
  a plate for solid food and not a jug for pouring drinks.
examples:
- She passed the gravy holder around the table.
- He filled the gravy holder with sauce.
