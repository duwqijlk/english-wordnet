simpleMeaning: to make a sweet food or other preparation by mixing things together
scope: This is the verb, to make a sweet food or other preparation by mixing; not the noun sense in another
  batch that names the act of making something by mixing parts.
examples:
- She confectioned the herbs and sugar into a sweet medicine.
- The cook confectioned fruit and sugar into a sweet treat.
