simpleMeaning: a great disaster caused by a huge, harmful sea wave, which is made by an earthquake or
  by a volcano bursting out
scope: A disaster from a huge sea wave after an earthquake or a volcano, not a normal storm wave and not
  the earthquake itself.
examples:
- A tsunami hit the coast and destroyed whole towns in minutes.
- After the earthquake, people ran to high ground fearing a tsunami.
