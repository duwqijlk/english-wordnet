simpleMeaning: a wish that cannot be fought off to pick at the outer parts of the body, as in biting the
  nails again and again
scope: A wish that cannot be fought off to pick at the outer parts of the body; not a skin disease that
  itches and not a wish to pick at things around one.
examples:
- Her phaneromania made her pick at the skin round her nails until it bled.
- Phaneromania is the name for the strong wish to pick at the outer parts of the body.
