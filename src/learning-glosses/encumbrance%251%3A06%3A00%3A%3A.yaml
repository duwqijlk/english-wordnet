senseId: 'encumbrance%1:06:00::'
synsetId: 03525974-n
simpleMeaning: Any block that holds you back and weighs on you.
scope: This sense is also called a hitch, interference, hindrance, preventative, preventive, and incumbrance,
  for any block that holds you back and weighs on you, where a hitch is anything blocking the way or slowing
  things down, hard to deal with.
examples:
- The encumbrance held him back.
- Encumbrances weigh on you.
