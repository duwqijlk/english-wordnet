simpleMeaning: A plant from Europe that lives for many years, with groups of white or blue flowers along
  a stem
scope: This is a plant from Europe that lives for many years, with groups of white or blue flowers along
  a stem; peach bell and peach bells are other names for this sense, not a plant with one flower on each
  stem and not a garden flower.
examples:
- The willow bell grows along the path with pale flowers in groups.
- We saw a willow bell with blue flowers along its stem.
