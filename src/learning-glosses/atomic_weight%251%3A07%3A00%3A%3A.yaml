simpleMeaning: What one atom of a chemical element weighs, in the tiny units chemists use for atoms, is
  the sense here.
scope: This is the weight of one atom, also called atomic mass and relative atomic mass.
examples:
- The atomic weight of iron is written in the table.
- The table lists the atomic weight of each element.
