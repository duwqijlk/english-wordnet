simpleMeaning: Used to make bread dough rise and to ferment beer or whiskey, a mix sold in shops with
  yeast cells in it.
scope: This mix is also called yeast, and it is not bread dough but the stuff that makes bread dough rise.
examples:
- She added barm to the dough and left it to rise.
- The brewer kept barm for the next batch of beer.
