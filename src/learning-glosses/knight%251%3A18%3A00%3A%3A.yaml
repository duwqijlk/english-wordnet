simpleMeaning: Historically, a warrior of noble birth schooled in arms and chivalry; now in Britain, someone
  given an honor by the monarch for personal merit.
scope: This is the titled man, not the chess piece, and not the verb for raising someone to that rank.
examples:
- She was made a knight for her services to medicine.
- The old knight told stories of battles he had fought.
