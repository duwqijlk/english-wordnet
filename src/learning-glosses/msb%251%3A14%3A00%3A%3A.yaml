simpleMeaning: A savings bank set up by a state, owned by the people who keep money in it and run by a
  board of trustees.
scope: Also called mutual savings bank; a savings bank set up by a state and owned by the people who keep
  money in it, not other savings banks and not a bank owned by share owners.
examples:
- She kept her savings in the MSB.
- The MSB is owned by its depositors.
