simpleMeaning: A soft heavy close-grained kind of talc that feels slippery, used to make hearths, table
  tops and ornaments
scope: A soft heavy kind of talc that feels slippery; also called soap-rock, soapstone and steatite; not
  a rough building stone, and not a cleaning bar.
examples:
- Soaprock was used for the old hearth.
- The tabletop is made of soaprock.
