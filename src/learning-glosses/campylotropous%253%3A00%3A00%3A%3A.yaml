senseId: 'campylotropous%3:00:00::'
synsetId: 01033014-a
simpleMeaning: Of a plant seed-part, bent so that its tiny hole lies near the base, almost touching its
  stalk.
scope: A bent seed-part with its hole near the base, not a straight seed-part and not a seed itself.
examples:
- The campylotropous ovule bends back on its stalk.
- In campylotropous seeds the tiny hole sits near the base.
