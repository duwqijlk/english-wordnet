simpleMeaning: having very big and important results that change what happens later
scope: 'Also called fatal: having results that change what happens later in a big way, not fixed by fate
  beforehand and not bringing ruin.'
examples:
- Their fateful meeting changed the course of the war.
- She made a fateful decision to leave the company and start her own business.
