simpleMeaning: Of a flower, with soft coloured parts set around its centre.
scope: Of a flower, this means it has soft coloured parts, also called petaled and petalled; it is not
  a flower with no such parts, and not a flower part itself.
examples:
- The petalous bloom stood out in the garden.
- A petalous flower shows soft parts around its centre.
