senseId: 'granularity%1:07:00::'
synsetId: 04956433-n
simpleMeaning: the quality of being made of bits that are fairly large compared with most bits
scope: Also called coarseness, this is about how large the small bits are that make up a thing, not how
  rough a surface feels or how rude a person is.
examples:
- We measured the granularity of the powder, and found its bits were fairly large.
- The granularity of this sand is high, because each small piece is fairly large.
