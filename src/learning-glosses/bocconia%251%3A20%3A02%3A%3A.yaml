simpleMeaning: a plant of China and Japan that people grow far and wide for its creamy white flower heads
  shaped like feathers
scope: 'Also called plume poppy: a plant of China and Japan grown for its feathery white flower heads,
  not the small Central American tree of the same name.'
examples:
- Bocconia grows in the garden for its creamy white flower heads.
- The bocconia by the wall was in full flower in June.
