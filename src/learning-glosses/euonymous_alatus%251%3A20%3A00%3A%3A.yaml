simpleMeaning: A bushy shrub that loses its leaves, with thin wide corky ridges along its branches, turning
  bright red in autumn; it grows from north-eastern Asia to central China.
scope: A bushy shrub with winged branches, also called a winged spindle tree and Euonymus alatus; not
  an evergreen shrub.
examples:
- Euonymous alatus turned red in the October garden.
- They planted Euonymous alatus along the fence.
