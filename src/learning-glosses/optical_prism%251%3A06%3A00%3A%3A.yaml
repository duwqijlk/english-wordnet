simpleMeaning: a tool with a three-sided shape, made of glass or quartz, used to bend a beam of light
  or to turn a picture upside down
scope: A tool with a three-sided shape, made of glass or quartz, used to bend a beam of light or to turn
  a picture upside down; prism is another name for this sense, not a flat sheet of glass and not a lens.
examples:
- The optical prism split the beam into colours.
- An optical prism turns the picture upside down.
