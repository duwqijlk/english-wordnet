simpleMeaning: People sit back and rest in the chairs of this train coach, which also has a bar and tables
scope: Also called a club car, this is a train coach with a bar and chairs for sitting back, not an ordinary
  coach with rows of seats and not a dining car.
examples:
- We had a drink in the lounge car on the way to Chicago.
- The lounge car was full of travellers reading and talking.
