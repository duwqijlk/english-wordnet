simpleMeaning: A thin sheet of a plastic called saran sticks to itself and is used to wrap food.
scope: Also called cling film, this is a thin sheet that sticks to itself and wraps food.
examples:
- The clingfilm stuck to itself as she tried to cover the plate.
- Wrap the leftovers in clingfilm before you put them away.
