senseId: 'parenchyma%1:08:01::'
synsetId: 05276118-n
simpleMeaning: the animal tissue that makes up the main part of an organ, as against other tissue such
  as the tissue that joins parts and the blood tubes
scope: Animal tissue that makes up the main part of an organ, not the tissue that joins parts and not
  the blood tubes.
examples:
- The parenchyma of the liver does the organ's main work.
- In the kidney, the parenchyma sits between the blood vessels and the joining tissue.
