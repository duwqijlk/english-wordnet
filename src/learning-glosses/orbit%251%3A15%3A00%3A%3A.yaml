simpleMeaning: The path, usually a long round shape, that one body in the sky takes as it goes round another
scope: The path, usually a long round shape, that one body in the sky takes going round another, not the
  hollow place of bone holding the eye and not the path of a tiny bit of an atom.
examples:
- The orbit of Mars takes almost two years.
- Comets follow an orbit round the sun.
