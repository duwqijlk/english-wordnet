simpleMeaning: A round-roofed hollow or part that sticks out from a building, above all the east end of
  a church, which usually holds the altar.
scope: A round-roofed hollow or sticking-out part of a building, above all a church's east end; apse is
  another name for it, and it is not a flat wall and not the whole church.
examples:
- The apsis of the old church held the altar.
- Light fell through the windows of the apsis.
