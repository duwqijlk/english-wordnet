simpleMeaning: to celebrate an event or person by holding a ceremony or by doing a set act in its honour
scope: To celebrate an event or person with a ceremony or a set act in its honour, also called mark; not
  just to remember it in your mind with no act.
examples:
- They commemorate the end of the war with a parade each year.
- The town commemorated its founder with a special ceremony.
