simpleMeaning: A flat piece of metal fixed to a beam that holds up a floor, to make the beam stronger
scope: A metal plate that strengthens a joist, not a piece of cloth sewn into a garment, and not a piece
  of chain mail.
examples:
- The builder fixed a gusset to the joist to stop it bending.
- A steel gusset held the wooden beam in place.
