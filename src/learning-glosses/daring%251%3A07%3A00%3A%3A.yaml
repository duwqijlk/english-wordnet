simpleMeaning: a person's quality of being ready to do things that carry risk or danger
scope: This names the quality of being ready to take risks, not the describing word for a person who is
  ready to take risks.
examples:
- Climbing the high cliff took great daring.
- Her daring helped her try the dangerous jump.
