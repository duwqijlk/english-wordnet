simpleMeaning: The faithfulness that people owe to their own land, or those ruled owe to their king or
  queen.
scope: Also called fealty, this is the faithfulness owed to one's own land or ruler, not the act of tying
  oneself to a course of action.
examples:
- Citizens owe allegiance to their country.
- He swore allegiance to the queen.
