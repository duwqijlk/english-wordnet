simpleMeaning: a light stick with a round head, used to hit instruments such as chimes, kettledrums, marimbas,
  and glockenspiels
scope: This is the light stick for hitting music instruments, not the heavy hand tool for nails and not
  the part inside a piano.
examples:
- He picked up a soft hammer to play the marimba.
- The player hit the chimes with a small hammer.
