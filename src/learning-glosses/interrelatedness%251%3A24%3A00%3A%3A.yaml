simpleMeaning: How two things are tied to each other, each one having a bearing on the other
scope: A link that runs both ways between things, also called interrelation or interrelationship; not
  a one-way link and not a single thing on its own.
examples:
- The interrelatedness of the two economies meant that trouble in one soon reached the other.
- She wrote about the interrelatedness of animal structure and function.
