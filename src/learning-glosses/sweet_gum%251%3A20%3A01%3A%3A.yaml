simpleMeaning: In North America grows a tree of the genus Liquidambar, with prickly round fruit bunches
  and sap that smells nice.
scope: This is a North American tree with prickly round fruit bunches and nice-smelling sap; bilsted,
  red gum and sweet gum tree are other names for this sense.
examples:
- The sweet gum dropped its prickly fruit.
- Sap from the sweet gum smelled sweet.
