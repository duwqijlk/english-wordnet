simpleMeaning: in baseball, a move by the pitcher that breaks the rules, made while other players are
  standing on the bases
scope: In baseball, an illegal move by the pitcher while runners are on base, not a beam that holds up
  a roof and not a thing that holds up progress.
examples:
- The umpire called a balk on the pitcher.
- A balk lets the runners move up a base.
