simpleMeaning: 'Cook it before you eat it: this golden mushroom often grows at tree roots in late summer
  and autumn.'
scope: It is also called a honey mushroom, the golden kind that grows at tree roots in late summer and
  autumn and is only safe once cooked.
examples:
- Honey fungus grew at the base of a tree in the wood.
- We found honey fungus at the roots of a tree in late summer.
