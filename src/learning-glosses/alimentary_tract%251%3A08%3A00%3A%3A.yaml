simpleMeaning: A tube-like passage lined with mucus and built of muscle, about 8.3 metres long from mouth
  to anus, that digests food and gets rid of waste.
scope: This sense is also called alimentary canal, digestive tract, digestive tube, and gastrointestinal
  tract, for a tube-like passage lined with mucus and built of muscle, about eight point three metres
  long from mouth to anus, that digests food and gets rid of waste.
examples:
- The alimentary tract runs from mouth to anus.
- Alimentary tracts digest food.
