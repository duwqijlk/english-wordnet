simpleMeaning: in computing, the way symbols are arranged as data or commands in a program, or a whole
  set of such commands
scope: This is the symbolic content of a computer program, not a set of laws, not a system for sending
  secret messages, and not an identifying string of letters and numbers.
examples:
- The app crashed because of a single line of code.
- She spent the weekend writing code for her game.
