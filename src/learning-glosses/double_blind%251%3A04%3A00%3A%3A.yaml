senseId: 'double_blind%1:04:00::'
synsetId: 00795505-n
simpleMeaning: no one knows who got what is being tested, neither those giving it nor those getting it,
  until the test is over, to cut bias out of the results
scope: A test that hides who got what is being tested until it is over, not a double-blind experiment,
  procedure, or study, where no one knows the key facts of the test.
examples:
- The double blind kept doctors from knowing which patients had the new drug.
- They ran the trial as a double blind so no one knew who got the real treatment.
