simpleMeaning: A member of the Texas state road police; in the past, a lawman on horseback who kept order
  on the frontier.
scope: A member of the Texas state road police, not a soldier and not a forest guard; also called a Texas
  Ranger.
examples:
- The Ranger stopped the car on the highway.
- A Ranger once rode on horseback on the frontier.
