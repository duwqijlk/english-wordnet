senseId: 'fanjet_engine%1:06:00::'
synsetId: 03326048-n
simpleMeaning: A machine in which a spinning set of blades, driven by a turbine, sends extra air to the
  burner and gives extra push.
scope: A machine in which a spinning set of blades driven by a turbine sends extra air to the burner for
  extra push, also called turbofan, fan-jet and fanjet; not a plain machine without such blades and not
  a propeller-driven machine.
examples:
- The fanjet engine gave the plane extra thrust on take-off.
- A fanjet engine uses a turbine-driven fan to push extra air into the burner.
