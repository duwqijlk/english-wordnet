simpleMeaning: 'Between yellow and leaf colour lies this middle shade: yellower and darker than pea colour,
  and deeper and more leaf-coloured than moss colour'
scope: This shade is also called cresson or watercress, and it is deeper and more leaf-coloured than the
  colour of moss and yellower and darker than the colour of peas.
examples:
- The walls were painted cress green.
- She chose a cress green dress for the spring.
