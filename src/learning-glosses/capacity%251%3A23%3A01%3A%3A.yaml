simpleMeaning: In computer science, the number of bytes a disk can hold.
scope: This is how much data a disk can store, not how much a container holds or how much electric charge
  builds up.
examples:
- This laptop has enough capacity for all my photos and videos.
- The new drive doubles the capacity of the old one.
