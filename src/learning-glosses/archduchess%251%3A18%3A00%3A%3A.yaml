simpleMeaning: The wife or widow of an archduke, or a princess of the family that once ruled Austria.
scope: A wife or widow of an archduke, or a princess of Austria's former ruling family; not a duchess
  and not a queen.
examples:
- The archduchess opened the new hospital in Vienna.
- After her husband's death, the archduchess lived quietly in the country.
