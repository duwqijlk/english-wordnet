simpleMeaning: a machine that holds metal on a moving holder and pushes it against turning blades that
  cut and shape it
scope: 'Also called milling machine: a machine for cutting and shaping metal, not a person who works in
  a mill and not a small moth with soft, powder-like wings.'
examples:
- The workshop bought a new miller to shape the steel parts.
- He pushed the metal block slowly into the miller to cut its edge.
