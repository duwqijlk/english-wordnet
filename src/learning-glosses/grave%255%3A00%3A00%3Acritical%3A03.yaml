simpleMeaning: making people feel afraid or worried by threatening great harm
scope: 'Also called serious, dangerous and severe: making people feel afraid or worried by threatening
  great harm. Not a place where a dead body is put, and not grave meaning needing much thought.'
examples:
- The country faces a grave danger after the flood.
- His grave illness made his family very worried.
