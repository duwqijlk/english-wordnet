senseId: 'messuage%1:06:00::'
synsetId: 03757081-n
simpleMeaning: In law, the land the household uses and the buildings next to the house belong with the
  house to live in
scope: In law, a house with its outbuildings and the land the household uses; not a house alone and not
  a farm.
examples:
- The old messuage included the cottage, the barn, and the garden.
- The deed described the messuage and its two acres.
