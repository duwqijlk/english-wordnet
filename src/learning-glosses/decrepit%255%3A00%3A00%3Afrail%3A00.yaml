simpleMeaning: not strong in the body or the muscles, and with little life or energy
scope: 'Another name for weak, weakly, feeble, rickety and infirm: a person who is not strong in the body
  and has little energy, not an old building or thing in bad repair.'
examples:
- The decrepit old man needed help to climb the stairs.
- After the long illness, she felt decrepit and had no strength left.
