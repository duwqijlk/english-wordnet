simpleMeaning: a way of sorting things into groups that do not overlap, so each thing fits in only one
  group
scope: Sorting things into groups that do not overlap, not a substance splitting apart, not decay, and
  not a mental or physical collapse.
examples:
- The report gave a breakdown of costs by month.
- She asked for a breakdown of the votes into age groups.
