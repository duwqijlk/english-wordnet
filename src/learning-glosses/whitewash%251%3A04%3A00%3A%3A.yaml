simpleMeaning: a false show of clearing someone of blame, meant to hide faults and failings
scope: A false clearing of blame that hides faults; not a wash for whitening walls, and not an honest
  clearing of blame.
examples:
- The report was a whitewash of the company's failings.
- Critics called the inquiry a whitewash.
