simpleMeaning: Things are put under wider and wider groups, each group under a still wider one
scope: A way of sorting things under wider groups, not a flat list and not a sort by the alphabet.
examples:
- The library uses a hierarchical classification system for its books.
- In this hierarchical classification system, animals are grouped by family.
