simpleMeaning: the row of small bones down the middle of the back that holds the body upright and guards
  the cord of nerves inside
scope: 'Also called the back: the row of bones down the middle of the back, not a sharp point on an animal
  or plant and not the edge of a book.'
examples:
- The doctor checked the spine for injury after the fall.
- She felt a chill run down her spine.
