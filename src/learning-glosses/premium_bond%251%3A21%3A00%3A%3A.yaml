simpleMeaning: A loan paper from the government that pays no interest and does not grow in value, but
  puts the holder in draws for money prizes
scope: This government loan paper puts its holder in draws for money prizes rather than paying interest,
  so it is not a loan paper that pays interest or grows in value.
examples:
- She put her savings into a Premium Bond.
- He won fifty pounds with a Premium Bond.
