simpleMeaning: A person with fresh ideas no one else has had, who thinks far better than most people
scope: Also called a wonder, a brain, a genius, a mastermind, or a brainiac, this is a person with a very
  sharp mind and fresh ideas, not the scientist himself.
examples:
- The class called her an Einstein after she solved the hard puzzle in a new way.
- Only an Einstein could have thought of that plan so fast.
