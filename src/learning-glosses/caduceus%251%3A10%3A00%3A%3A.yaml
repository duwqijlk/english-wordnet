simpleMeaning: a sign used by doctors and others in medicine, made in the shape of the staff (a long stick
  carried by a person) of Hermes
scope: A sign for medicine in the shape of the staff of Hermes, not a tool that doctors use in their work.
examples:
- The caduceus was printed on the sign outside the hospital.
- She wore a small caduceus on her coat as a sign of her work in medicine.
