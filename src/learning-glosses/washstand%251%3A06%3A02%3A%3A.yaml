simpleMeaning: For washing your hands and face, a sink fixed in a bathroom and joined to pipes that bring
  water in and take dirty water away
scope: This bathroom sink, also called basin, lavatory, washbasin, and washbowl, is fixed to water pipes;
  it is not the table or stand that holds a loose bowl and a jug of water.
examples:
- Water ran from the tap into the washstand as she washed her hands.
- The plumber fixed the pipe under the washstand.
