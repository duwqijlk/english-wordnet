simpleMeaning: to move along on foot with slow, heavy steps, as people do when they are worn out or walking
  through mud
scope: To move along on foot with slow, heavy steps, as people do when they are worn out or walking through
  mud, also called pad or trudge; not walking far for pleasure and not wandering with no plan.
examples:
- Tired soldiers tramped through the mud.
- They tramped along the wet road.
