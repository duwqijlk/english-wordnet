senseId: 'corner_kick%1:04:00::'
synsetId: 00138529-n
simpleMeaning: in football, a free shot from where the field's sides meet, given to the other side when
  a player sends the ball past his own goal line
scope: This is a free shot from where the field's sides meet, given to the other side when a player sends
  the ball past his own goal line; not a free shot from the middle of the field, and not a penalty.
examples:
- The corner kick sailed into the box.
- He took the corner kick with his left foot.
