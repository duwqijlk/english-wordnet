simpleMeaning: 'The three arms of the central rule of the country: the arm that runs it, the arm that
  makes laws, and the arm that judges.'
scope: Also called U.S., U.S. government, United States government, and US Government, it is the three
  arms of the country's central rule; not one arm on its own and not a state government.
examples:
- The United States has three branches of government.
- The United States courts decide what the law means.
