simpleMeaning: In radiology, the body part meant to take in the healing dose of a substance that gives
  off rays
scope: In radiology, the body part meant to take in the healing dose of a substance that gives off rays;
  not any body part and not the part that gives the dose.
examples:
- The doctor aimed the dose at the target organ.
- The target organ took in most of the healing rays.
