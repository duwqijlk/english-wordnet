senseId: 'uraninite%1:27:00::'
synsetId: 15109112-n
simpleMeaning: A mineral made mainly of uranium combined with oxygen, with tiny amounts of radium, thorium,
  polonium, lead and helium; its massive form is called pitchblende, the main uranium ore.
scope: This is the mineral itself, named in its massive ore form; pitchblende is another name for the
  same substance, not a different mineral.
examples:
- Uraninite from these veins was once mined for radium as well as uranium.
- The dark crystal was identified as uraninite, a mineral rich in uranium.
