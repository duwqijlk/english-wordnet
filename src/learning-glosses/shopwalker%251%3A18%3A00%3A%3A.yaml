simpleMeaning: a worker in a store who watches over the sales staff and helps shoppers with problems
scope: A store worker who looks after sales staff and helps shoppers, also called a floorwalker; not a
  shop owner and not a sales assistant.
examples:
- The shopwalker showed us where to find the coats.
- Ask the shopwalker if you need help with a return.
