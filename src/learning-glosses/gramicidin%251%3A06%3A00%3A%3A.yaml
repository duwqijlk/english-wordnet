simpleMeaning: Used above all to clean and treat infections in one place, caused by one kind of germ,
  this germ-killing drug is made by a germ that lives in soil.
scope: A germ-killing drug from a soil germ, used to clean and treat infections in one place, not a drug
  taken to fight germs through the whole body.
examples:
- The doctor put gramicidin on the small cut.
- Gramicidin helped clear the skin sore in a few days.
