simpleMeaning: the raised stone edge between a walking path and a road, usually part of a water channel
  at the road side
scope: A stone edge by a road, not the verb meaning to hold something back or limit it, and not a chain
  or strap for a horse.
examples:
- She stepped off the curb and crossed the road.
- He sat on the curb waiting for the bus.
