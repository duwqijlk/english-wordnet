simpleMeaning: Heads of a dark purple colour mark the males of this water bird, found in many places in
  North America
scope: 'Also called lake duck and lesser scaup: a duck of North America whose males have purple heads,
  not a duck of Europe and not one whose males have plain heads.'
examples:
- A lesser scaup duck swam across the pond.
- The lesser scaup duck's dark purple head stood out among the other ducks.
