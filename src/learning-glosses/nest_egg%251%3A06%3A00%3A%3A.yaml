simpleMeaning: Put where hens lay, a false one draws the hens to lay their own there.
scope: A false one left where hens lay, to draw them to lay their own there, not a real one the hen herself
  laid.
examples:
- She left a nest egg where the hens lay, and they laid their own there.
- He put the nest egg where the hens lay so they would lay there too.
