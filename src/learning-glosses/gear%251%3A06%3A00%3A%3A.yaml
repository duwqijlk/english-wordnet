simpleMeaning: A wheel with teeth round its edge that turns against another toothed part to change how
  fast a thing moves or which way it goes
scope: A toothed wheel that turns against another to move a machine, not a set of such wheels and not
  the tools needed for a job.
examples:
- The gear slipped and the machine stopped.
- A broken gear had to be changed before the engine would run.
