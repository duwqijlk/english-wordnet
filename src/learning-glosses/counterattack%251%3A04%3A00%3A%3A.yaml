senseId: 'counterattack%1:04:00::'
synsetId: 00980259-n
simpleMeaning: an attack by soldiers who are being attacked, made to win back lost land or to cut off
  enemy soldiers who are moving forward
scope: 'Also called countermove: an attack back by a defending army, not a chess move against an opponent
  and not the verb for making such an attack.'
examples:
- The army launched a counterattack to win back the town.
- Their counterattack stopped the enemy from moving forward.
