simpleMeaning: 'said of soil: soft and wet because it has taken in too much water'
scope: This is about soil that is soft with too much water, not about dry hard ground, and not about a
  boat or wood filled with water.
examples:
- The waterlogged soil stuck to our boots after the rain.
- Farmers could not plant crops in the waterlogged fields.
