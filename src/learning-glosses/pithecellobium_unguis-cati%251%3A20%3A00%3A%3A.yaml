simpleMeaning: An upright shrub with small or no spines, bearing clusters of white to yellow flowers followed
  by curved pointed pods with black shiny seeds; in the West Indies and Florida.
scope: Also called black bead, cat's-claw, and catclaw; not a tree and not a shrub with red flowers.
examples:
- The Pithecellobium unguis-cati bore curved pods in Florida.
- We saw a Pithecellobium unguis-cati flowering in the West Indies.
