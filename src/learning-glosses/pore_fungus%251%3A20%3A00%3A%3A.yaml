simpleMeaning: A woody fungus whose spore-producing surface lies inside tubes or pores; its fruiting bodies
  are usually woody when mature and last a long time.
scope: Another name for this fungus is pore mushroom, and it is also called a polypore; unlike a gilled
  mushroom, it has its spores in tubes or pores.
examples:
- A pore fungus covered the fallen log, its underside a mass of tiny tubes.
- This pore fungus can stay on the same trunk for years and become tougher as it ages.
