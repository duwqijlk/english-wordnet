simpleMeaning: a bendy strip of wood or rubber used to draw curved lines
scope: A bendy strip used to draw curves, not a stiff ruler and not a piece of wood used to build.
examples:
- The artist held the spline against the paper to draw a smooth curve.
- A spline of wood helped her trace the arch.
