simpleMeaning: strong anger that wants to fight, caused by a real wrong or one that only seems real, shown
  as a person and as one of the deadly sins
scope: 'Also called anger, wrath and ira: a strong anger shown as a person and as a deadly sin, not just
  any strong feeling about a wrong.'
examples:
- In the old list of deadly sins, ire stands for anger that wants to fight over a wrong.
- The book shows ire as a person who is quick to fight when a wrong is done.
