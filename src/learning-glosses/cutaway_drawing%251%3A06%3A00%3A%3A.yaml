simpleMeaning: a picture or small copy of a thing with the outer part left out so the parts inside can
  be seen
scope: A picture or small copy of a thing that leaves out the outside so the inside shows; also called
  cutaway model and cutaway, not a plain picture of the whole thing.
examples:
- The cutaway drawing shows the engine's inner parts.
- In the cutaway drawing, the outer shell is left out.
