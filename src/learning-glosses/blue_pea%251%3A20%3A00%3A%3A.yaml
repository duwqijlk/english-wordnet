simpleMeaning: Bright sky-coloured flowers with yellow middles grow on this climbing plant of tropical
  Asia, whose leaves are small leaflets set along a middle stalk.
scope: Also called a butterfly pea, this climbing plant of tropical Asia bears bright sky-coloured flowers
  with yellow middles, its leaves made of small leaflets set along a middle stalk.
examples:
- We saw blue peas climbing in tropical Asia.
- The blue pea's bright sky-coloured flowers opened round yellow middles.
