simpleMeaning: A tool that ends in a sharp point; with it you can mark a surface, or push it through something
  to make a small hole
scope: A small hand tool for making marks and holes, not a sewing needle and not a drill.
examples:
- He used an awl to punch a small hole in the leather.
- She marked the wood with an awl before she cut it.
