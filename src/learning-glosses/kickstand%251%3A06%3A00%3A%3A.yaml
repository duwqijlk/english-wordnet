simpleMeaning: A metal bar that swivels on a bicycle, motorcycle or other two-wheeled vehicle; flat when
  unused, it can be kicked upright to hold the vehicle steady while nobody rides it.
scope: The built-in folding prop of a bicycle or motorcycle, not a separate bicycle rack, training wheels
  or a centre stand.
examples:
- She kicked the kickstand down before parking her motorcycle.
- The kickstand stayed flat against the frame while he rode.
