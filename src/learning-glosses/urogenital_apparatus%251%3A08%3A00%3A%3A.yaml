simpleMeaning: all the organs that take part in making babies and in making urine and letting it out
scope: 'Also called urinary apparatus, urinary system, urogenital system, genitourinary apparatus, genitourinary
  system, apparatus urogenitalis and systema urogenitale: all the organs for making babies and for making
  urine and letting it out, not the parts for making urine alone and not the parts for making babies alone.'
examples:
- The urogenital apparatus links the sex organs with the kidneys and bladder.
- An infection of the urogenital apparatus can hurt when you pass urine.
