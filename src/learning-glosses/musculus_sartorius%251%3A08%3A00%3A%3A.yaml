simpleMeaning: This thigh muscle, the longest in the body, helps turn the leg into the sitting pose a
  tailor takes to sew.
scope: Sartorius and sartorius muscle are other names for this thigh muscle, the longest in the body,
  which helps turn the leg into a tailor's sitting pose.
examples:
- The musculus sartorius helps turn the leg into the sitting pose a tailor takes.
- When the leg turns into a tailor's sitting pose, the musculus sartorius helps.
