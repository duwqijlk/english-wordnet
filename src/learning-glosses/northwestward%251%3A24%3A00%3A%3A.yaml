simpleMeaning: The compass mark halfway from north to west, at three hundred fifteen degrees.
scope: This sense is also called northwest, for the compass mark halfway from north to west, at three
  hundred fifteen degrees, where northwest is the mark on a compass at 315 degrees, halfway round from
  north toward west, unlike the sense for going in a north-westward way.
examples:
- Northwestward is the compass mark halfway from north to west.
- Northwestward lies at three hundred fifteen degrees.
