simpleMeaning: A plant of the Old World, found in many places, that lives for years and now grows wild
  in North America, with finely hairy leaves and hard-to-see white sweet-smelling flowers
scope: Also called hoary plantain, it is an Old World plant that lives for years, now grows wild in North
  America, and is known by its finely hairy leaves and small white sweet-smelling flowers.
examples:
- The Plantago media grew wild in the meadow with finely hairy leaves.
- Plantago media has small white sweet-smelling flowers.
