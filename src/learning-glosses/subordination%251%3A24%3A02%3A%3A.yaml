senseId: 'subordination%1:24:02::'
synsetId: 13830065-n
simpleMeaning: In the study of meaning, the link between a word and a wider word it falls under, as a
  lower rank or class under a higher one.
scope: Also called hyponymy, the meaning link between a word and a wider word above it, not the grammar
  link between a modifying word and its head, not the act of putting someone under one's control, and
  not simply the state of being under something.
examples:
- In subordination, 'dog' falls under 'animal', which is the wider word.
- The subordination of 'rose' to 'flower' shows the lower word belongs to the higher class.
