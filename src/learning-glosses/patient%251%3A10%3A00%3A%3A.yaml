schema: oewn-learning-gloss-v2
senseId: 'patient%1:10:00::'
synsetId: 06343129-n
simpleMeaning: the person or thing that is acted on or affected by a verb's action, rather than the one
  doing it
scope: This is not a sick person under medical care and not the doer of the action, but the grammatical
  role of what is acted on.
examples:
- In the sentence 'The ball was kicked,' the ball is the patient.
- Grammarians call the thing affected by the action the patient.
