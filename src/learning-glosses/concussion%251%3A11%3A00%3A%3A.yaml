simpleMeaning: harm to the brain from a hard hit, which most often makes the person lose consciousness
scope: Harm to the brain from a hard blow, not a cut on the head and not just a headache.
examples:
- The player suffered a concussion after the hard tackle.
- Doctors kept him in hospital overnight after his concussion.
