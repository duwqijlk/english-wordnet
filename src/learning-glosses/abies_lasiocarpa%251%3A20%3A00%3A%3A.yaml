simpleMeaning: A fairly tall timber tree of the Rocky Mountains, with a narrow crown shaped like a cone
  or a tall column
scope: A fairly tall timber tree of the Rocky Mountains with a narrow cone-shaped crown; subalpine fir
  and Alpine fir are other names for this sense, not other Rocky Mountain trees with wide spreading crowns.
examples:
- Abies lasiocarpa grew tall on the mountain slope.
- The Abies lasiocarpa crown is narrow and cone-shaped.
