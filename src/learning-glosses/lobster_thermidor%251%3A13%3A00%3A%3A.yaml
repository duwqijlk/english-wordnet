simpleMeaning: small cut pieces of shellfish meat mixed with a white cheese sauce, put back in the shell,
  topped with grated cheese, and heated until brown on top
scope: A hot dish of shellfish meat in a cheese sauce served in its shell, not plain boiled shellfish
  and not a cold seafood dish.
examples:
- We ordered lobster thermidor for our anniversary dinner.
- The lobster thermidor came back in its shell, browned on top with cheese.
