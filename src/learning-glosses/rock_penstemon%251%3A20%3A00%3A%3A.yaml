simpleMeaning: A showy wildflower from the West, with big vivid pink or rose blooms clustered on tall
  spikes above thick leafy mats, growing on cliffs and ledges from Washington to California.
scope: This is the showy pink-flowered wildflower of rocky ledges in the American West; cliff penstemon
  is another name for it, and it is not a garden hybrid or one of the other penstemons with blue or white
  flowers.
examples:
- Rock penstemon lit up the basalt slope with its pink flowers.
- The seed packet was labelled rock penstemon, a plant suited to dry rocky ground.
