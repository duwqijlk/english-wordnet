simpleMeaning: One of the Algonquian people in Rhode Island and Massachusetts who welcomed the Pilgrims
  when they came.
scope: This is one person from that Algonquian group in Rhode Island and Massachusetts, not one of the
  Pilgrims who were met, and not a member of a different people.
examples:
- A Wampanoag greeted the Pilgrims when they landed.
- The Wampanoag lived in Rhode Island and Massachusetts.
