simpleMeaning: From the southwest of North America and Mexico comes this big animal, with a bare nose
  and a white back and tail
scope: Also called badger skunk, hog-nosed skunk, and hognosed skunk, it lives in the southwest of North
  America and Mexico, with a bare nose and a white back and tail.
examples:
- The rooter skunk lifted its bare nose to the air.
- In the southwest of North America, a rooter skunk crossed the road.
