simpleMeaning: A small bushy tree shedding its leaves, from Asia and North Africa, with pretty pink blossoms
  and prized edible nuts in hard green hulls; grown in southern Australia and California.
scope: Also called almond, sweet almond, Amygdalus communis, and Prunus amygdalus; a bushy tree with pink
  blossoms and edible nuts, not a peach tree and not a plum tree.
examples:
- Prunus dulcis bears pink blossoms and prized nuts.
- They grow Prunus dulcis in California for its prized nuts.
