simpleMeaning: A giant plant like a tree with edible nuts and leaf stalks that give a clear, cool drink
  of watery sap, said to be an emergency water source for travellers.
scope: Also called ravenala, traveler's tree and traveller's tree; a giant plant like a tree with edible
  nuts and leaf stalks that give a clear, cool drink of watery sap, said to be an emergency water source
  for travellers.
examples:
- Ravenala madagascariensis towered over the path, its leaf stalks full of clear sap.
- Thirsty travellers drank from Ravenala madagascariensis in an emergency.
