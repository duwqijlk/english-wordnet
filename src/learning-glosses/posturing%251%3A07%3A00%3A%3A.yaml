senseId: 'posturing%1:07:00::'
synsetId: 04894896-n
simpleMeaning: the act of standing or behaving in a proud way that shows you think you are very important
scope: This is a proud, show-off way of standing or behaving, not a plain way of standing and not calm,
  honest behaviour.
examples:
- Everyone could see that his brave words were just posturing to make himself look important.
- She was tired of his posturing and his proud way of showing how important he thought he was.
