simpleMeaning: As the cord is drawn, the loop pulls tighter, for it is made in the cord or rope with a
  knot that slides.
scope: This loop in a cord or rope pulls tighter as it is drawn, and is also called a noose or a slip
  noose, not a fixed loop that stays the same size.
examples:
- He tied a running noose in the rope.
- The running noose slipped tighter with each tug.
