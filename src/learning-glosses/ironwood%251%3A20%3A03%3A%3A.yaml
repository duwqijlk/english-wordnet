simpleMeaning: An attractive evergreen tree from the East Indies, often planted for decoration, with scented
  white flowers that provide a perfume; its very heavy hardwood is used for railway ties.
scope: This is the living East Indian tree, not its very heavy wood or another unrelated plant that shares
  the name; ironwood tree in this lane is another name for the same tree.
examples:
- Ironwood was planted along the drive for its scented white flowers.
- Railway ties were cut from the very heavy wood of the ironwood.
