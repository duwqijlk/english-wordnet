simpleMeaning: A common weed from Europe, now growing in North America, often cooked and eaten as a green
  vegetable.
scope: A common European weed now in North America, often cooked and eaten as a green; not the plant whose
  leaves are sometimes used as potherbs, whose seeds are used as cereal, and which grows from the southern
  United States to Central America and in India and China.
examples:
- Pigweed grows wild along the field edge, and the farmer pulls it out.
- In the kitchen, they cooked the young pigweed leaves as greens.
