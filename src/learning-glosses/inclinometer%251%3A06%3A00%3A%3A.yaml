simpleMeaning: How far a needle tips down from level under the earth's pull is what this tool measures,
  such as from a plane.
scope: Also called dip circle, this is the tool that shows how far the earth's pull on a needle tips down
  from level, not the kind surveyors use to measure a slope.
examples:
- The inclinometer in the plane showed how far the needle tipped down.
- They checked the inclinometer before the flight.
