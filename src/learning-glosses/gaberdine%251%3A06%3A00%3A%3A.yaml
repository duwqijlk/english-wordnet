simpleMeaning: A loose outer coat or dress that hangs down to the ankles
scope: This is a loose outer coat or dress that hangs down to the ankles; smock, duster, gabardine and
  dust coat are other names for this sense, not a short jacket and not a raincoat.
examples:
- She wore a long gaberdine over her dress.
- The gaberdine reached down to his ankles.
