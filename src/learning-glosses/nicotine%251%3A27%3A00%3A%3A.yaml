simpleMeaning: a plant chemical (an alkaloid) that is a poison found in tobacco, used in medicine and
  to kill insects
scope: This is the poison itself that is in tobacco, used in medicine and to kill insects; not the tobacco
  plant and not its smoke.
examples:
- The nicotine in the tobacco leaves is a strong poison.
- Farmers once used nicotine to kill insects on plants.
