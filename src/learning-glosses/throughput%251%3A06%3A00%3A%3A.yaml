simpleMeaning: How much output a system gives compared with its input; the amount that passes through
  the system, especially for a computer program over a period of time
scope: This is how much passes through a whole system, especially a computer program, not the input on
  its own and not the output on its own.
examples:
- The network's throughput fell when too many people went online at once.
- Better software raised the throughput of the old computer.
