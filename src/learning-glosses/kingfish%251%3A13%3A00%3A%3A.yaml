simpleMeaning: Meat with very little fat, from one of several kinds of fish caught in the sea off the
  east coast of the United States
scope: The flesh of the fish when it is sold or eaten, not the live small silver fish found near California
  and not other live fish in Atlantic waters.
examples:
- We ate grilled kingfish for dinner last night.
- The shop sells fresh kingfish caught off the Atlantic coast.
