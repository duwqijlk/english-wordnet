simpleMeaning: any one of several kinds of flower plant in the group called Miltonia, with showy flowers
  that spread out wide, growing alone or in loose groups
scope: Any of several Miltonia flower plants with showy wide-spreading flowers, not a garden pansy and
  not any other kind of orchid.
examples:
- The pansy orchid in the pot had wide pink flowers that spread out flat.
- She grows a pansy orchid with loose groups of showy white flowers.
