simpleMeaning: A group of artists, writers or thinkers who share a style or were taught by the same or
  similar teachers.
scope: This is not a place of education and not the teachers and students of one institution; it is a
  group of creative or intellectual people with a shared style or teacher.
examples:
- These painters form a school of their own.
- Critics often group the two poets into the same school.
