simpleMeaning: A group that is with an important guest or beside a coffin at a soldier's funeral.
scope: 'Also called an honor guard: a group that is with an important guest or beside a coffin at a soldier''s
  funeral, not a bodyguard for one person and not soldiers on parade.'
examples:
- The guard of honor stood along the steps as the queen arrived.
- Soldiers formed a guard of honor beside the coffin.
