simpleMeaning: to take a person to the seat where they will sit, as in a theater or a hall for shows
scope: 'Another name for show in this use: taking a person to their seat in a theater or hall, not a person
  who works at the door of a court room.'
examples:
- The man ushered us to our seats near the front.
- She ushered the late guests to their seats in the theater.
