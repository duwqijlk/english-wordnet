simpleMeaning: A person that others look down on as low and bad, and not worth any respect
scope: A person others hold in contempt as low and bad, with rat, crumb, git, skunk and puke as other
  names for this sense, not a person who begs for a living and not a lazy person.
examples:
- Throw the bum out, the landlord shouted.
- Only a bum would steal from his own friends.
