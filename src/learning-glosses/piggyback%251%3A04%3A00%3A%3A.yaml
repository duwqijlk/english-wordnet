simpleMeaning: the act of carrying a person or thing on your back or shoulders
scope: This is the act of carrying someone on your back; it is not carrying goods by train, and not the
  word that says how a person sits on a back or shoulders.
examples:
- She gave her little brother a piggyback across the wet grass.
- A piggyback is an easy way to carry a tired child on your back.
