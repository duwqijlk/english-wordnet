simpleMeaning: A power tool that polishes a surface until it is smooth and bright
scope: Not a soft block used to polish things by hand, not a store of data in a computer, and not a safety
  gap between two sides in a quarrel.
examples:
- He used a buffer to bring back the shine on the old wooden floor.
- The buffer hummed as it smoothed the paint on the car door.
