senseId: 'murkiness%1:26:00::'
synsetId: 14545250-n
simpleMeaning: The state of the air when a cloud of stuff in it cuts down how far one can see.
scope: 'Also called fog, murk, and fogginess: air that is hard to see through because of a cloud of some
  stuff in it.'
examples:
- The murkiness over the river made the far bank hard to see.
- Drivers slowed in the murkiness of the smoke.
