simpleMeaning: Extra words or pictures added to make a thing clearer or fuller.
scope: Also called elaboration, extra words or pictures added to make a thing clearer or fuller, not the
  measure of how much a signal grows.
examples:
- The amplification of his first draft made the argument much clearer.
- A few remarks in amplification helped the committee grasp the plan.
