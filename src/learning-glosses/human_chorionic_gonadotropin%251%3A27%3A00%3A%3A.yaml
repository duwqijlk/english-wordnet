simpleMeaning: Early in pregnancy, the afterbirth makes a body chemical, and finding it in urine or blood
  is how one kind of pregnancy test works.
scope: This is a body chemical from the afterbirth, made early in pregnancy and found in urine and blood
  when one kind of pregnancy test is done, also called human chorionic gonadotrophin.
examples:
- Human chorionic gonadotropin was found in the urine.
- They test for human chorionic gonadotropin to confirm a pregnancy.
