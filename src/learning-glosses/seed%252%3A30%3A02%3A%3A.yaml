simpleMeaning: to put tiny bits of a chemical, silver iodide, into clouds to break them up and make rain
  fall
scope: To put tiny bits of a chemical, silver iodide, into clouds to break them up and make rain fall,
  not a small hard part of a plant and not the white fluid from a man's body.
examples:
- Pilots seed the clouds to bring rain to dry fields.
- They seeded the clouds above the farms that summer.
