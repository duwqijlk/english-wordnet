simpleMeaning: A skin in a young mushroom joining cap edge to stalk, torn as it grows, leaving a ring
  on the stalk and sometimes a fringe at the cap edge.
scope: This is the inner cover between cap edge and stalk, not the outer wrapping over the whole young
  fruiting body and not the ring or fringe it leaves behind.
examples:
- Before the cap opened, a partial veil stretched from its edge to the stem.
- The partial veil tore away, leaving a neat ring on the stalk.
