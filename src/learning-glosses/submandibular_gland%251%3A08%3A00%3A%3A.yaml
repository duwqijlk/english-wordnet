simpleMeaning: Inside the lower jaw on both sides sits a spit gland making most of the spit made at night,
  which it lets out into the mouth under the tongue.
scope: 'Also called mandibular gland, submandibular salivary gland, submaxillary gland, and submaxillary
  salivary gland: a spit gland inside the lower jaw that makes most of the spit made at night.'
examples:
- The submandibular gland makes most of the spit made at night.
- The doctor felt the submandibular gland under his jaw.
