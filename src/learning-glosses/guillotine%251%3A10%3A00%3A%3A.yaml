senseId: 'guillotine%1:10:00::'
synsetId: 06679772-n
simpleMeaning: The cutting short of debate on certain parts of a bill, by order.
scope: The forced end of debate on parts of a bill, not the blade used for beheading and not the act of
  beheading.
examples:
- The government used the guillotine to end debate on the bill.
- A guillotine was imposed on the remaining clauses.
