simpleMeaning: Buds on the tongue and in the throat learn what a thing that can melt in water is made
  of, and the feeling that follows is this.
scope: The feeling that follows when the buds on the tongue and in the throat learn what a dissolved thing
  is made of; taste, gustatory perception, gustatory sensation and taste perception are other names for
  it.
examples:
- The taste sensation of the lemon was sharp and sour.
- A taste sensation rose as the candy melted on her tongue.
