simpleMeaning: This worker picks up waste and takes it away to get rid of it
scope: A worker who picks up and gets rid of waste, also called a garbage collector or garbage hauler;
  not the bin that holds the waste and not the kitchen machine that grinds it.
examples:
- The garbage carter emptied our bins early this morning.
- Our garbage carter comes twice a week to take the rubbish away.
