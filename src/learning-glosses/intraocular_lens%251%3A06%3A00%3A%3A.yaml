simpleMeaning: To take the place of a hurt natural lens, or of one taken out when a cataract was removed,
  a man-made lens is put inside the eye
scope: This lens goes inside the eye to do the work of a hurt natural lens or of one taken out with a
  cataract.
examples:
- An intraocular lens took the place of the natural lens after the cataract was removed.
- The intraocular lens sits inside the eye where the natural lens used to be.
