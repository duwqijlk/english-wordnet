simpleMeaning: Across the central and southeastern United States and the West Indies, a plant with underground
  stems bears large showy heads of clear blue blooms, at times grouped with Eupatorium.
scope: Also called mistflower and ageratum, this plant of the central and southeastern United States and
  the West Indies bears large showy heads of clear blue blooms on underground stems.
examples:
- Mist-flower was in full bloom when we saw it.
- We knew the mist-flower by its clear blue blooms.
