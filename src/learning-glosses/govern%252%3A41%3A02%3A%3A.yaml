schema: oewn-learning-gloss-v2
senseId: 'govern%2:41:02::'
synsetId: 02517217-v
simpleMeaning: to put rules in place and get people or things to act in line with rules, basic ideas,
  or the usual way of doing things
scope: 'Also called order and regulate: to put rules in place and get people or things to act in line
  with rules, not to rule a country or lead a group.'
examples:
- We cannot govern the way people dress.
- The new rules govern how late shops may stay open.
