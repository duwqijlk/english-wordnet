simpleMeaning: In the south of Florida and in Cuba grows a short, thick tree whose wide leaves spread
  like a fan
scope: A short thick tree with fan-shaped leaves from southern Florida and Cuba, not a tall thin palm
  and not a palm from another place.
examples:
- The key palm grows low and wide near the shore in Cuba.
- We saw a key palm with broad leaves in southern Florida.
