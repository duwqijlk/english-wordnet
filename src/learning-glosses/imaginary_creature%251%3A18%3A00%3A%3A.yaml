simpleMeaning: a being made up in the mind, a person found only in old stories, myths, or made-up tales
scope: A being that lives only in stories; imaginary being is another name for this sense, not a real
  living thing and not a character in a true story.
examples:
- The unicorn is an imaginary creature of old stories.
- She drew an imaginary creature with wings and three heads.
