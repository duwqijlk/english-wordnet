senseId: halting%5:00:00:broken:02
synsetId: 00291650-s
simpleMeaning: words that come out in broken bits because strong feeling gets in the way
scope: Broken, stop-start speech caused by strong feeling, not speech that is slow because the speaker
  is unsure what to say.
examples:
- She spoke in halting words, her voice breaking as she told us the sad news.
- His halting account of the accident came out a few words at a time.
