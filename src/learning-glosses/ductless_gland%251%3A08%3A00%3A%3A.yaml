simpleMeaning: One of the parts of the body that send body chemicals straight into the blood, with no
  tube to carry them
scope: One of the body's hormone-making parts, also called endocrine and endocrine gland; not a part that
  sends its fluids through a tube.
examples:
- The thyroid is a ductless gland that sends hormones into the blood.
- A ductless gland has no tube to carry its chemicals away.
