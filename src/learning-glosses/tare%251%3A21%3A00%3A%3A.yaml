simpleMeaning: A weight taken off for the box or wrapping, so the true weight of the goods inside can
  be found.
scope: A weight taken off for the box or wrapping, so the true weight of the goods inside can be found,
  not the weight of an empty vehicle, not a counterweight used in testing chemicals, not a grass weed,
  and not a plant grown for feed.
examples:
- The tare on the crate was two kilos.
- Allow for the tare before you weigh the apples.
