simpleMeaning: To keep annoying someone, again and again, over a long time
scope: Provoke, harass, plague, hassle and harry are other names for this sense; this is about annoying
  someone again and again, not about a sexual attack.
examples:
- The noisy neighbours molested us with loud music night after night.
- He molested his staff with calls at all hours when he was overworked.
