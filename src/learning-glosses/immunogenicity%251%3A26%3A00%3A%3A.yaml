simpleMeaning: The quality of making the body's defences act against a thing
scope: How strongly a thing sets off the body's defences, not how harmful the thing is and not how the
  body cures itself.
examples:
- The immunogenicity of the new vaccine was high.
- Scientists test the immunogenicity of each new drug.
