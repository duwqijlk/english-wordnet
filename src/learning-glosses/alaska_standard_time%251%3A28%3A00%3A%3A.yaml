simpleMeaning: The set hours of the 9th band west of Greenwich, counted from the 135th line west, used
  in Hawaii and most of the far northern land
scope: These are the set hours of the 9th band west of Greenwich, counted from the 135th line west, also
  called Yukon Time, and used in Hawaii and most of the far northern land; not the set hours of another
  band.
examples:
- Alaska Standard Time is nine hours behind Greenwich.
- Hawaii uses Alaska Standard Time.
