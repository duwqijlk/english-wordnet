simpleMeaning: A North American water snake, placed in the genus Nerodia in some classifications, that
  seldom strays far from water.
scope: Also called a banded water snake or Nerodia sipedon; a snake that stays close to rivers and lakes,
  not a land snake.
examples:
- A common water snake slid off the bank into the river.
- We saw a common water snake basking on a rock near the lake.
