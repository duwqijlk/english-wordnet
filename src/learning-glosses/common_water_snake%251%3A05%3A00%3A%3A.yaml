simpleMeaning: In some lists of kinds it is put in the group Nerodia; a long thin animal without legs
  from the western United States that stays close to rivers and lakes
scope: Also called a banded water snake; a long thin animal without legs from the western United States
  that stays close to rivers and lakes, not a land animal of the same shape and not a fish.
examples:
- A common water snake slid off the bank into the river.
- We saw a common water snake basking on a rock near the lake.
