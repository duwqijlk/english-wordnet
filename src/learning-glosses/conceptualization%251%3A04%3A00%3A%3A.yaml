simpleMeaning: The making up or devising of an idea or account, and shaping it in the mind.
scope: The making up or devising of an idea or account, and shaping it in the mind; also called formulation
  or conceptualisation; not a worked-out thought.
examples:
- Their conceptualization shaped the plan.
- The conceptualization was done at dawn.
