senseId: 'oakum%1:27:00::'
synsetId: 14990722-n
simpleMeaning: Loose fibre from hemp or jute, pulled apart from old ropes; soaked in tar, it sealed the
  seams and joints of wooden ships.
scope: The tarred rope fibre used to seal gaps in wooden ship hulls; not the wood called oak, and not
  a rope still in one piece.
examples:
- Shipwrights drove tarred oakum into the seams between the deck planks.
- Workers sat on the docks unpicking old rope to make oakum.
