senseId: 'megacephaly%1:26:00::'
synsetId: 14532576-n
simpleMeaning: a head that is much bigger than usual, with the same growth on both sides and no extra
  pressure inside the skull, unlike a head swollen by fluid
scope: A head much larger than usual, with even growth and no extra pressure inside; macrocephaly and
  megalocephaly are other names for this sense, not a head swollen by fluid inside it.
examples:
- The baby was born with megacephaly, a head much larger than usual.
- Doctors noted the megacephaly but found no extra pressure inside the skull.
