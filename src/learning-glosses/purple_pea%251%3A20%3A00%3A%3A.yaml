simpleMeaning: any of several pretty Australian shrubs that keep their leaves all year, grown for their
  shiny dark green leaves and flowers in deep blues and strong violets
scope: 'Also called hovea: any of several pretty Australian evergreen shrubs grown for glossy leaves and
  blue or violet flowers, not a garden pea and not a climbing pea plant.'
examples:
- The purple pea bushes flowered in rich blue along the garden wall.
- She planted purple pea for its shiny leaves and deep violet blooms.
