simpleMeaning: A slow-growing tree of middle size on the east coast of the United States, much like the
  American arborvitae.
scope: A slow-growing tree of middle size on the east coast of the United States; coast white cedar, southern
  white cedar and white cedar are other names for this sense, not a pine and not a small evergreen with
  tiny scale-like leaves.
examples:
- The white cypress grows slowly on the east coast.
- This white cypress looks much like the American arborvitae.
