simpleMeaning: No one knows where it first grew, because this plant is now grown in so many places; it
  grows very fast, with thin hollow stems marked in green and yellow
scope: A fast-growing plant with thin striped stems, not a timber plant grown for wood.
examples:
- Common bamboo grows so fast that the gardener cuts it back every week.
- They planted common bamboo along the fence for shade.
