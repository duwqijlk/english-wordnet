simpleMeaning: The sung sound that names the first, home note of any major scale
scope: The sung sound that names the first, home note of any major scale; ut and doh are other names for
  this sense, and it is not the fifth note nor a written note.
examples:
- Sing do, re, mi to warm up your voice.
- The scale starts on do.
