scope: Of or about Scotland, its people, its ways of life, its form of English or its Gaelic speech; Scotch
  and Scots are other names for this sense, not the dialect of English used in Scotland alone.
examples:
- Scottish authors write about life in Scotland.
- The Scottish Symphony played to a full hall.
