simpleMeaning: The push that stops the pure liquid passing through a thin skin into a mix; in physical
  chemistry, the mix must make this push.
scope: In physical chemistry, it is the push a mix makes to stop the pure liquid passing through a thin
  skin into it, not a push made by the pure liquid itself.
examples:
- Osmotic pressure stops the pure liquid passing through the thin skin.
- Without osmotic pressure, the pure liquid would pass into the mix.
