simpleMeaning: a large part of the ocean, or a big area of salt water that is partly surrounded by land
scope: This is not rough water during a storm, and it is not a lake of fresh water.
examples:
- The Mediterranean is a sea between Europe and Africa.
- We swam in the warm sea near the coast.
