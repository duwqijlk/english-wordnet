simpleMeaning: the size of the hole in a gun, or of the shot it fires, when that hole is a little less
  than half an inch across
scope: This word is also called .45-calibre, .45 caliber, and .45 calibre, and it is the size-name for
  a gun, or its shot, when the hole is a little less than half an inch across.
examples:
- He bought a .45-caliber pistol.
- The .45-caliber rounds fit only that gun.
