simpleMeaning: A cold sweet food made from the fatty part of milk, sugar and flavouring, frozen hard.
scope: A cold sweet food made from the fatty part of milk, sugar and flavouring, frozen hard; ice cream
  is another name for it, not a cold drink and not a cake.
examples:
- We shared an icecream on the hot afternoon.
- She made icecream with fresh strawberries.
