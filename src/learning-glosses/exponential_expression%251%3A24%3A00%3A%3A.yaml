simpleMeaning: In maths, a set of signs that stands for a fixed number, above all e, raised to some power.
scope: In maths, a set of signs standing for a fixed number raised to a power; not a sum of two numbers
  and not a statement with an equals sign.
examples:
- The exponential expression e to the power x grows fast.
- Simplify the exponential expression before you go on.
