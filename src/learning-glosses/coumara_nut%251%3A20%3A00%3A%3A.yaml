simpleMeaning: These dark, sweet-smelling seeds, shaped like a small nut, come from the tonka bean tree
  and go into perfumes and medicines, and stand in for vanilla.
scope: 'Also called tonka bean: dark, sweet-smelling seeds from the tonka bean tree, not the vanilla pods
  themselves.'
examples:
- The coumara nut gives perfumes a sweet smell.
- Cooks use coumara nuts in place of vanilla.
