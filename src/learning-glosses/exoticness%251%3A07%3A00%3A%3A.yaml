senseId: 'exoticness%1:07:00::'
synsetId: 04806861-n
simpleMeaning: The feel of a thing that seems strange and from a far-off place.
scope: The feel of a thing that seems strange and from a far-off place; exotism and exoticism are other
  names for this sense, not a thing that is merely new, and not a thing from one's own home town.
examples:
- He loved the exoticness of Egypt.
- The exoticness of the market drew crowds of visitors.
