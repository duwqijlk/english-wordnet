simpleMeaning: to give someone a very big surprise, so big that they can hardly believe it
scope: 'Also called to floor, to shock, or to blow out of the water: to give someone a very big surprise,
  not to hit someone and not to beat someone in a game.'
examples:
- The size of the final bill would ball anyone over.
- News like that can ball a person over.
