simpleMeaning: a bird that is not a perching bird, mainly out at dusk or at night, with spotted brown
  and grey feathers and large eyes; it eats insects
scope: Also called a caprimulgid and a goatsucker, this is a bird that is out at dusk or night and eats
  insects.
examples:
- A nightjar flew low over the field at dusk, hunting insects.
- We heard a nightjar calling in the dark outside the house.
