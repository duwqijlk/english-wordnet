simpleMeaning: a little ill, or likely to fall ill often
scope: 'Also called unwell, sickly, poorly, peaked, seedy and indisposed: this means a little ill or often
  ill, not very ill with a big sickness, and not well and strong.'
examples:
- My poor ailing grandmother stayed in bed for most of the week.
- He was an ailing child who often missed school because he was ill.
