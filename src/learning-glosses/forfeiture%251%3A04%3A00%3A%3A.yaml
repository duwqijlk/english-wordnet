senseId: 'forfeiture%1:04:00::'
synsetId: 00206740-n
simpleMeaning: losing something you own or hold as a punishment for a mistake, a fault, or not doing what
  you were asked to do
scope: 'Also called a forfeit or a sacrifice: losing something as a penalty, not a fine paid in money
  and not a voluntary gift.'
examples:
- He faced the forfeiture of his deposit after missing the deadline.
- The forfeiture of her licence followed her failure to pay the fee.
