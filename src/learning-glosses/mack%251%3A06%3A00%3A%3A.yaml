simpleMeaning: a raincoat that keeps water out, made of cloth covered with rubber
scope: 'Also called mac, and also called mackintosh: this is a raincoat that keeps water out, not a coat
  made only for warmth.'
examples:
- He wore his mack in the heavy rain.
- She put on a mack before going out in the wet weather.
