scope: A set of coded orders that watches over, guides, controls and checks the work of a computer system;
  monitoring program is another name for this, not a person who watches a screen and not a television
  show.
examples:
- The monitor program watches the system and flags errors.
- A monitor program keeps the computer's work in order.
