simpleMeaning: In card games, playing a trump card to take a round when you have no card of the suit that
  was led
scope: In card games, taking a round with a trump when you cannot follow suit, not the bird's neck feathers
  and not the sandpiper.
examples:
- With no hearts left, she ruffed the trick with a low trump.
- He ruffed the lead when he ran out of clubs.
