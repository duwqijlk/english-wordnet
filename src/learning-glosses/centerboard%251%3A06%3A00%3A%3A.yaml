simpleMeaning: A fin under a sailing boat that can be pulled up or let down, to stop the boat sliding
  sideways in the wind.
scope: A fin under a sailing boat, also called a centreboard, a drop keel, or a sliding keel, that can
  be pulled up or let down to stop the boat sliding sideways in the wind.
examples:
- He raised the centerboard as the boat came into the shallows.
- With the centerboard down, the boat held its course.
