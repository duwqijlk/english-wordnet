simpleMeaning: In a way that has to do with pictures or drawings and how they look.
scope: About pictures and drawings and how they look, not about writing in a vivid, picture-like way.
examples:
- The designs were graphically interesting, full of bold shapes.
- He laid out the page graphically, with big pictures and wide blank spaces.
