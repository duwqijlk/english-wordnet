simpleMeaning: The state of being unclear because something is only hinted at, not said out in the open.
scope: Something left unclear because it is only hinted at, not said plainly; not a thing said in so many
  words and not a secret kept on purpose.
examples:
- There was an implicitness to her answer that left us guessing what she meant.
- The implicitness of his warning made it easy to miss.
