simpleMeaning: an infection of the lungs and skin that brings up too much thick mucus and forms small
  hard lumps
scope: An infection of the lungs and skin that brings up too much thick mucus and forms small hard lumps;
  coccidiomycosis, desert rheumatism and valley fever are other names for this, not a common cold and
  not a skin rash alone.
examples:
- Coccidioidomycosis affects the lungs and skin.
- The patient with coccidioidomycosis coughed up thick mucus.
