simpleMeaning: In the rocky high lands of Asia and western North America lives a small short-eared mammal
  that digs burrows.
scope: This small short-eared mammal that digs burrows is also called a cony, a mouse hare, a pika, or
  a rock rabbit, and it is not the long-eared burrowing animal of the hare family.
examples:
- The coney dug its burrow among the rocks.
- A coney watched from the rocky slope in the high lands.
