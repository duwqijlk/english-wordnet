simpleMeaning: Said of food with a bright coat put on it, such as beaten egg or a sugar or jelly mix.
scope: Food with a bright coat put on it, such as beaten egg or a sugar or jelly mix, not food that is
  merely cooked or baked plain.
examples:
- They ate glazed doughnuts for breakfast.
- A glazed ham stood at the centre of the table.
