senseId: 'antigenic_determinant%1:27:00::'
synsetId: 15062231-n
simpleMeaning: the spot on the outside of a molecule that sets off the body's defence, where a defence
  protein fastens on
scope: 'Also called determinant and epitope: the spot on a molecule where a defence protein fastens on,
  not the whole molecule and not the defence protein itself.'
examples:
- Each antigenic determinant on the virus binds a different antibody.
- The antigenic determinant is the part of the molecule that the antibody grips.
