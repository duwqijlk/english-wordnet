simpleMeaning: In a silly and empty way, feeling pleased with yourself and not knowing that you look foolish
scope: This says how a person speaks or acts, in an empty and foolish way while feeling pleased and not
  knowing it. It is not about a foolish thing or plan on its own.
examples:
- He grinned inanely at the camera and said nothing.
- She laughed inanely, pleased with a joke no one else understood.
