scope: This is a fern that grows on other plants; ribbon fern is another name for it, not a fern that
  grows in soil and not a fern with broad leaves.
examples:
- Ophioglossum pendulum grows on other plants in tropical America.
- The Ophioglossum pendulum has strap-like leaves that twist.
