simpleMeaning: Drug makers weigh things by this unit, which is 480 grains, a twelfth of a troy pound.
scope: Also called an ounce or a troy ounce, this is the unit drug makers use for weighing, equal to 480
  grains.
examples:
- The mixture called for one apothecaries' ounce of the powder.
- She weighed the herbs in apothecaries' ounces.
