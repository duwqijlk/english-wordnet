simpleMeaning: a long stitch that runs over the edge of cloth to stop the threads from coming loose
scope: This is a stitch used in sewing, not the cloudy sky or the act of sewing over an edge.
examples:
- She finished the seam with an overcast to keep the edge from fraying.
- The tailor used an overcast stitch along the raw edge of the cloth.
