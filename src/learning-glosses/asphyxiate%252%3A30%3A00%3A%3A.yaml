senseId: 'asphyxiate%2:30:00::'
synsetId: 00360165-v
simpleMeaning: to die because you cannot breathe and get no oxygen (the part of air needed to live)
scope: This sense is about a person who dies because they cannot breathe; it is not about making another
  person unable to breathe, which is the other sense of this word.
examples:
- The child nearly asphyxiated under the heavy covers.
- A worker can asphyxiate if bad gas fills a closed room.
