simpleMeaning: The clothes a person wears to play a part on stage or to go to a fancy dress ball
scope: Clothes for a part in a play or a fancy dress ball, not everyday dress and not clothes from another
  time.
examples:
- He wore a pirate costume in the school play.
- Her costume won first prize at the fancy dress ball.
