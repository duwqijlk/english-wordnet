simpleMeaning: A point on the skull where the bones join along the top, near the join at the back of the
  head
scope: A point on the skull where the bones join along the top, near the join at the back of the head;
  not the soft spot of a baby, and not a point on the face.
examples:
- The obelion lies on the top of the skull.
- Doctors mark the obelion when they measure the head.
