simpleMeaning: A word that says how a thing is, not what it does, is used of verbs like be or own and
  of most words made from verbs
scope: This word is used of verbs like be or own and of most words made from verbs, saying how a thing
  is rather than what it does.
examples:
- In the sentence they own a house, own is a stative verb.
- Be is stative in the sentence it is cold.
