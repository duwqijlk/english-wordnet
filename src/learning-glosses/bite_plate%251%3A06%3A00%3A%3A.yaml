simpleMeaning: To find out what is wrong or to make it better, a mouth piece that can be taken out is
  worn on the roof of the mouth.
scope: Also called biteplate, this mouth piece can be taken out and is worn on the roof of the mouth,
  not a plate fixed in place.
examples:
- She wore a bite plate on the roof of her mouth.
- A bite plate can be taken out and put back in.
