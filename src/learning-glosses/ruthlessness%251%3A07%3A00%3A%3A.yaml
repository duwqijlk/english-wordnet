simpleMeaning: the quality of hurting or treating people in a cruel way, with no feeling of pity for them
scope: The quality of being cruel and showing no pity; it is about the kind of person someone is, not
  one single cruel act and not being firm in a fair way.
examples:
- The general was known for his ruthlessness toward prisoners.
- Her ruthlessness shocked everyone; she felt no pity for the people she hurt.
