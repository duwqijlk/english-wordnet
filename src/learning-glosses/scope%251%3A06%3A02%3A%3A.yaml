simpleMeaning: A thing that makes far-off things look bigger so you can see them well
scope: A thing that makes far-off things look bigger, also called a telescope; not the electronic gear
  that shows changing electric amounts.
examples:
- He looked through the scope at the distant hills.
- The scope brought the far ship into clear view.
