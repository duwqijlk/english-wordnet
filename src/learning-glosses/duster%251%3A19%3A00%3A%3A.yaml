simpleMeaning: a hard rush of air that picks up great amounts of dust and sand and carries them through
  the air
scope: A strong wind that lifts dust or sand into the air; not a cloth for cleaning dust and not a baseball
  pitch.
examples:
- A duster swept across the desert town and filled the air with sand.
- The duster blew dust into every room of the house.
