simpleMeaning: A line joining places where a compass needle dips at the same angle
scope: A line joining places where a compass needle dips the same; isoclinic line is another name for
  this sense, not a line of equal compass direction and not a weather line.
examples:
- The isoclinal runs through places with the same needle dip.
- Sailors once used the isoclinal to check their compass.
