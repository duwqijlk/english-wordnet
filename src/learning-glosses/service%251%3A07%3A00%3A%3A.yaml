simpleMeaning: anything that is a way of being useful or helpful to someone else.
scope: This is not a regulated company or agency that supplies the public; it is anything that lets someone
  be of help to others.
examples:
- The village well was a service to every family on the hill.
- Her knowledge of the law was a service to neighbors in trouble.
