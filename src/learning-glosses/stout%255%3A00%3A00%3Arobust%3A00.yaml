simpleMeaning: strong in body and used to being tired and to hard times, so still able to keep going
scope: 'Also called sturdy: this means strong and able to keep going in hard times, not the strong dark
  beer that has the same name.'
examples:
- The stout sailors worked all day in the cold wind and did not get tired.
- She was a stout walker who could climb hills for hours without stopping.
