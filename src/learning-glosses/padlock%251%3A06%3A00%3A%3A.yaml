simpleMeaning: a lock that can be taken off, with a curved metal loop on a hinge that goes through a small
  catch or chain links and clicks shut
scope: A lock that can be taken off and clicked shut, not the act of fastening something with one.
examples:
- He put a padlock on the gate to keep it shut.
- She lost the key to the padlock on her bike.
