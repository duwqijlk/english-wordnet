simpleMeaning: The mast closest to the front of a ship that has two or more masts.
scope: The mast closest to the front of a ship with two or more masts; not a mast further back.
examples:
- The lookout climbed the foremast to watch for land.
- The foremast carried the largest sail on the old ship.
