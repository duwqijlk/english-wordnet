simpleMeaning: a dry case that splits open to let out seeds, or the part of a moss or a plant like it
  that holds its tiny seed-like bits
scope: A dry plant case that opens to free its seeds, not a pill and not a pilot's seat.
examples:
- The poppy capsule split open and dropped its seeds.
- Moss capsules hold the tiny bits that grow into new plants.
