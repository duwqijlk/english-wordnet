senseId: 'emoticon%1:10:00::'
synsetId: 06290592-n
simpleMeaning: Typed keys in a note sent by email can form a face, like a smile or a frown
scope: A typed face such as a smile or a frown in a written note, not a picture drawn by hand and not
  a word that says how you feel.
examples:
- She ended her message with an emoticon to show she was joking.
- He typed an emoticon instead of writing that he was sad.
