simpleMeaning: Wires that carry a strong flow share out the flow across a whole area
scope: 'Another name for a power system, also called a grid: a set of wires that share out the flow across
  a whole area, not a set of lines on a map and not a cooking grill.'
examples:
- A storm knocked out the power grid for the whole town.
- Workers repaired the power grid after the cables came down.
