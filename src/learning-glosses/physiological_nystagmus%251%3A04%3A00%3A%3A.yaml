simpleMeaning: 'Sight depends on tiny constant eye flickers: hold an image perfectly still on the retina
  and vision fades quickly as the light-sensing cells tire.'
scope: The normal flicker present in healthy eyes, not the jerky movements caused by disease or those
  triggered by a moving scene.
examples:
- Physiological nystagmus keeps the world from fading when the eyes rest on one point.
- The researchers held the image still to cancel out physiological nystagmus.
