senseId: 'xeroderma_pigmentosum%1:26:00::'
synsetId: 14561337-n
simpleMeaning: 'A rare inherited skin condition: extreme sensitivity to sunlight (photosensitivity) causes
  severe burning from childhood, and the body cannot repair the damage, raising the risk of cancer.'
scope: A rare inherited skin disorder, not ordinary sun sensitivity or a contagious disease.
examples:
- Even a short walk in the sun can burn a child with xeroderma pigmentosum.
- Xeroderma pigmentosum is an inherited condition that leaves the skin unable to repair damage from sunlight.
