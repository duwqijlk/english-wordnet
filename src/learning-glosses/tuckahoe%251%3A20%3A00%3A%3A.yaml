simpleMeaning: With leaves shaped like arrowheads, a long pointed leaf wrap, and green berries, this herb
  of the eastern United States lives many years.
scope: Also called green arrow arum, this eastern United States herb is known by its arrowhead leaves,
  long pointed leaf wrap, and green berries.
examples:
- I found a tuckahoe with green berries.
- The tuckahoe had a long pointed leaf wrap.
