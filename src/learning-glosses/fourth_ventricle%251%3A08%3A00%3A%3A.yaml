simpleMeaning: a hollow space of uneven shape in the brain, lying between the third hollow space and the
  main tube running down the spine
scope: This is a hollow space in the brain between the third hollow space and the tube down the spine;
  not the third hollow space or a space in the heart.
examples:
- The fourth ventricle carries fluid through the brain.
- A scan showed a blockage in the fourth ventricle.
