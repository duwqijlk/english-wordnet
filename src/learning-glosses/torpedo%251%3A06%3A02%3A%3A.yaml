simpleMeaning: a small firework made of a cap that fires when hit and some small stones wrapped in paper;
  it bursts when thrown hard against a hard surface
scope: This is a small paper firework that bursts on a hard surface, not the underwater weapon and not
  the flat sea fish with the same name.
examples:
- He threw a torpedo at the pavement and it popped loudly.
- The boys set off a torpedo by throwing it hard at the wall.
