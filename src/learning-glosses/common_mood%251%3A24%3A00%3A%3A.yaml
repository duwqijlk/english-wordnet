simpleMeaning: In grammar, a verb form with no special mark that states an act or state as a plain fact
scope: This is the plain verb form that states facts as they are; indicative, declarative, declarative
  mood, fact mood and indicative mood are other names for this sense, not the forms that give orders or
  express wishes.
examples:
- In the common mood, the verb states a fact.
- She used the common mood when she said the train leaves at noon.
