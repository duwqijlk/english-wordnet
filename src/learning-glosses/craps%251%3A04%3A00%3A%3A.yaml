simpleMeaning: 'a money game with two dice: first throw 7 or 11 wins, 2, 3 or 12 loses; other numbers
  must come again before 7, or bet and dice are lost'
scope: This is the dice game played for money, not the words said when both dice are thrown and each shows
  one spot.
examples:
- They played craps at the table and won on a first throw of 11.
- In craps, a first throw of 2 loses at once.
