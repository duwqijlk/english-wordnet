simpleMeaning: A sharp point that marks, fixed to a stand that can be moved up and down, is the tool for
  checking how flat a flat face is.
scope: Scribing block and surface gage are other names for this tool with a marking point on a stand that
  moves up and down, used to check how flat a flat face is.
examples:
- The surface gauge stood on the bench while the worker checked the flat face.
- A surface gauge showed that the flat face was true.
