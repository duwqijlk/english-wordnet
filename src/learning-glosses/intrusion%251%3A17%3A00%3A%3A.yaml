simpleMeaning: Rock that was formed by rock pushing its way into other rock.
scope: The rock made by rock pushing in, not the pushing-in itself.
examples:
- The intrusion of dark rock cut through the pale stone.
- Geologists mapped the intrusion beneath the hills.
