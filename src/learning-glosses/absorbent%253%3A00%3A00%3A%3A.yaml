simpleMeaning: able to take in and soak up things like a liquid or energy, or having a tendency to do
  so
scope: 'Also called absorptive: this word describes a thing that can take in a liquid or energy. It is
  not the material itself, but the quality of being able to take things in.'
examples:
- This towel is very absorbent and dries the floor fast.
- The absorbent cloth took in all the water.
