simpleMeaning: to shut a person in a locked place so they cannot leave, as in a prison
scope: This is the act of shutting a person away, not the place itself and not just keeping a person in
  one room at home.
examples:
- The judge decided to jail the man for five years after the trial.
- They threatened to jail anyone who tried to leave the town.
