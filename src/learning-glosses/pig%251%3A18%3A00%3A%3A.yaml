simpleMeaning: a person that other people see as greedy and as acting like the farm animal in wanting
  too much
scope: A person seen as greedy, not the farm animal, not a solid block of metal, and not the sand form
  used for hot iron.
examples:
- He is a pig at the table and always takes more than everyone else.
- Stop being such a pig and share the cake with your sister.
