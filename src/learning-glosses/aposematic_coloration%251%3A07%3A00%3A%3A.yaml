senseId: 'aposematic_coloration%1:07:00::'
synsetId: 04986251-n
simpleMeaning: A hunter sees these bright colours or marks on an animal and takes them as a sign to keep
  off.
scope: Also called warning coloration, this is the bright colouring that tells a hunter to keep away from
  the animal that wears it.
examples:
- A skunk's aposematic coloration warns other animals to keep away.
- The frog's aposematic coloration tells hunters to leave it alone.
