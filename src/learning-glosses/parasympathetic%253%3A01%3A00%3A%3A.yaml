simpleMeaning: To do with the part of the nervous system that works when the body is at rest.
scope: Of the nervous system branch that acts while the body is at rest.
examples:
- These nerves are parasympathetic, acting when the body is at rest.
- The response was parasympathetic, slowing the heart after the fright.
