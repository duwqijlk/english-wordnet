simpleMeaning: A living unit made of a cell's centre and the jelly-like stuff around it that works with
  it.
scope: A living unit of a cell's centre and the jelly-like stuff around it, not a whole cell and not the
  centre alone.
examples:
- The energid holds the centre and the jelly-like stuff together.
- Each energid in the cell works as one unit.
