simpleMeaning: The clear fluid of the brain and spine moves between the two inner sheets of the thin coats
  round the brain and spine.
scope: The two inner coats round the brain and spine are called the leptomeninges, and the clear fluid
  moves between them.
examples:
- The leptomeninges are the two inner coats round the brain.
- The clear fluid moves between the leptomeninges round the spine.
