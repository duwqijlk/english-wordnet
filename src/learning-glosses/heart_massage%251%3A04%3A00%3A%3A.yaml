simpleMeaning: an emergency step that presses the heart in a steady beat, through the chest or straight
  on the heart in surgery, to try to keep blood moving when it stops
scope: 'Also called cardiac massage: an emergency step that presses the heart to keep blood moving when
  it stops, not a relaxing rub and not a heart operation.'
examples:
- The surgeon gave heart massage to keep blood moving.
- Nurses learn heart massage for use when a patient's heart stops.
