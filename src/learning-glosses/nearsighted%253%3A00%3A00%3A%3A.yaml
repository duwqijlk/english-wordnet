senseId: 'nearsighted%3:00:00::'
synsetId: 02164641-a
simpleMeaning: not able to see things far away clearly
scope: This sense is also called shortsighted and myopic. It is about not seeing things far away clearly,
  not about failing to think about what will happen later.
examples:
- She is nearsighted and wears glasses to see the board at school.
- He is nearsighted, so road signs far away look blurred to him.
