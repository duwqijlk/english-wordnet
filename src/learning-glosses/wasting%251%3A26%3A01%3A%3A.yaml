simpleMeaning: a general loss of energy and strength in body and mind, caused by a long, serious illness
  that keeps making a person weak
scope: This is a general loss of strength in body and mind from long illness, not the shrinking of one
  body part from illness or from not being used.
examples:
- The wasting left him too weak to get out of bed.
- After months of illness, the wasting had taken her strength and clear thinking.
