simpleMeaning: In Judaism, a feast of the Jews, as a rule kept for 8 days from the 15th of Nissan, marking
  the flight of the Israelites out of Egypt
scope: This is the Jewish feast marking the flight out of Egypt, also called Feast of the Unleavened Bread,
  Passover and Pesach, not a feast of another faith.
examples:
- Pesah marks the flight of the Israelites out of Egypt.
- Jewish families keep Pesah for eight days.
