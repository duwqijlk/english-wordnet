simpleMeaning: a business that takes in farm goods and gets them ready to be sold
scope: A business that gets farm goods ready for sale, not a person who works on things such as food or
  photos, and not the part of a computer that does its work.
examples:
- The fruit processor buys apples from local farms and packs them for the shops.
- A meat processor in the town employs fifty people.
