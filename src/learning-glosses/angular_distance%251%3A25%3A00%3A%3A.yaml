senseId: 'angular_distance%1:25:00::'
synsetId: 13911184-n
simpleMeaning: How far apart two things seem to a watcher, judged by the size of the gap between them
scope: How far apart two things seem to a watcher, not how far apart they really are in space and not
  the height of a star above the ground.
examples:
- He recorded the angular distance between two stars.
- The angular distance between the moon and the star looked small.
