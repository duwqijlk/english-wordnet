senseId: 'dislocation%1:26:00::'
synsetId: 14315063-n
simpleMeaning: a part of the body, especially a bone, moved out of its usual place, as in the shoulder
  or the back bones
scope: This is a body part, most often a bone, that has moved out of its usual place; it is not a broken
  bone and not trouble or confusion in a plan or system.
examples:
- The doctor soon fixed the dislocation in her shoulder and put the bone back in place.
- He fell hard on the ice and the dislocation left his knee unable to bend.
