simpleMeaning: deserving blame because it is wrong, evil or harmful
scope: 'Also called blamable, blameable, blameful, blameworthy and culpable: an act or thing that earns
  blame because it is wrong or bad, not a small slip and not a kind act.'
examples:
- His censurable conduct cost him his job.
- The report called the censurable delay a failure of care.
