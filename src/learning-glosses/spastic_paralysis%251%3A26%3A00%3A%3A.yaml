simpleMeaning: a loss of control over how the body moves, with jerks the person cannot stop, caused by
  lasting harm to the brain that is there from birth
scope: 'Also called cerebral palsy: a loss of control over body movement with jerks that cannot be stopped,
  caused by lasting harm to the brain from birth; not a short illness and not a loss of feeling.'
examples:
- The child with spastic paralysis finds it hard to walk in a straight line.
- Doctors found spastic paralysis when the baby could not hold up her head.
