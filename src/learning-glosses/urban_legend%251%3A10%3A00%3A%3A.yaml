simpleMeaning: Most people take as true a tale that turns up out of nowhere and spreads on its own in
  many forms, most often untrue, with fun or fear in it.
scope: This is a tale that turns up out of nowhere and spreads on its own in many forms, most often untrue,
  with fun or fear that most people take as true.
examples:
- That urban legend turned up out of nowhere and spread on its own.
- Most people took the urban legend as true, though it was most often untrue.
