simpleMeaning: In Christianity, one part on its own from a creed or other list of what the church teaches
scope: In Christianity, this is one part on its own from a creed or other list of what the church teaches;
  article of faith is another name for it; not the whole creed itself, and not a prayer said in church.
examples:
- Each credendum of the creed was read aloud.
- The credendum states one part of what the church believes.
