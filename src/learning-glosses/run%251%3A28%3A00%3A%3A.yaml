simpleMeaning: The length of time that a machine or factory keeps working without stopping.
scope: This is the time a machine or plant keeps working, not the amount it produces or a quick act of
  movement.
examples:
- The factory's longest run lasted three days.
- The boiler had a run of six hours before it was shut down.
