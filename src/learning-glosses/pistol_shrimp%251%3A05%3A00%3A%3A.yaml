simpleMeaning: A small sea creature with a shell that makes a sharp snapping sound with one of its big
  claws.
scope: A small sea creature with a shell that makes a sharp snapping sound with one of its big claws;
  not a prawn and not a mantis shrimp.
examples:
- The pistol shrimp snapped its claw and the sound cracked through the water.
- A pistol shrimp hid under the rock, snapping at passers-by.
