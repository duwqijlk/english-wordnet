simpleMeaning: A fern from tropical America, grown for its grey-green fronds cut into many fine segments;
  it ranges from the West Indies and southern Mexico to Peru and Brazil.
scope: Another name for basket fern, the tropical American fern with finely cut fronds; not the giant
  Asian fern.
examples:
- A toothed sword fern spread its lacy fronds over the rock.
- Toothed sword ferns grow wild in the West Indies.
