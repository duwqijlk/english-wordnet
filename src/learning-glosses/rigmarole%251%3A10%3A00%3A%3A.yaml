simpleMeaning: a set of confused words or statements that mean little or nothing
scope: 'Also called rigamarole: confused talk that means little; not the other sense, a long and confusing
  way of doing something.'
examples:
- His letter was just rigmarole, full of words but saying nothing clear.
- She listened to his rigmarole for ten minutes and still did not know what he wanted.
