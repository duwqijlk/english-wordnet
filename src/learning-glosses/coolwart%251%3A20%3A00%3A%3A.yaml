simpleMeaning: a plant of the woods with white flowers in spring, that sends out long stems along the
  ground
scope: A woodland plant with white spring flowers that spreads by stems along the ground, also called
  false miterwort, false mitrewort and foamflower; not a garden flower and not a tree.
examples:
- Coolwart grows in the woods and puts out white flowers in spring.
- We found coolwart spreading along the ground near the stream.
