simpleMeaning: The slow taking out of a person's blood and putting in the same amount of blood from a
  giver.
scope: The slow swap of a person's blood for a giver's blood, not a single quick gift of blood and not
  a test of blood; no other name is listed for this sense.
examples:
- The baby needed an exchange transfusion to clear the bad blood.
- Doctors gave an exchange transfusion slowly over many hours.
