simpleMeaning: Shouting cruel words at someone to show scorn or to make them look small.
scope: Shouting cruel words at someone to show scorn, with mocking and jeering as other names for this
  sense, and not the act of making someone angry itself, which is the noun sense.
examples:
- Taunting shouts of coward followed him down the street.
- Her taunting smile made him feel small.
