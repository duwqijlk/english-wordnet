simpleMeaning: being clean in the moral sense, with no sin or wrong in you, and with no knowledge of evil
  at all
scope: 'Also called innocence and whiteness: being free of sin and of any knowledge of evil, not being
  undiluted or unmixed.'
examples:
- Her purity of heart impressed everyone who met her.
- The child's purity showed in his total lack of malice.
