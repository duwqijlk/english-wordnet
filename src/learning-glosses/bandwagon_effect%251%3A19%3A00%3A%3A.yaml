simpleMeaning: something that grows more popular just because it is already popular, and so draws still
  more people to it
scope: A popular trend that grows more popular because it is already popular, not a passing fashion that
  fades and not a single person's choice.
examples:
- Polls can create a bandwagon effect that pushes more voters toward the leading candidate.
- The bandwagon effect helped the song climb the charts as more and more people started to play it.
