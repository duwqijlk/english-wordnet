simpleMeaning: A thing that exists only in thought, taking in all the rays that fall on it.
scope: Also called blackbody and full radiator, this is an imagined thing that takes in all the rays that
  fall on it.
examples:
- No ray escapes a black body; it takes them all in.
- A black body kept at one steady heat gives out rays just as fast as it takes them in.
