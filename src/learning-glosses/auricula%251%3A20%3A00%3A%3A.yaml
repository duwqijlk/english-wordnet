simpleMeaning: A primrose with yellow flowers that grows wild in the Alps and is often grown by people
scope: This is a primrose with yellow flowers that grows wild in the Alps and is often grown by people;
  bear's ear is another name for it, not a primrose from the lowlands and not any yellow mountain flower.
examples:
- The auricula grows wild in the Alps and has yellow flowers.
- Gardeners grow auricula for its yellow flowers.
