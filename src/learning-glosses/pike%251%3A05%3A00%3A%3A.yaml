simpleMeaning: A long, thin fish with a long nose, living in fresh water in many places in the cooler
  parts of the Northern Hemisphere, caught for sport and eaten as food
scope: This is a fish with a long nose found in cool fresh water, not the long-handled weapon of the same
  name and not the kind prized for its lean flesh.
examples:
- He caught a pike in the lake early in the morning.
- The pike darted through the cold, clear water.
