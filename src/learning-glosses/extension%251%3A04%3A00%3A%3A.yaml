simpleMeaning: Classes given by a college or university to people who are not signed up as full students
scope: Classes given by a college or university to people who are not full students, not the stretching
  of a bent limb and not the letters after the dot in a computer file name.
examples:
- She took an extension course in art at the university.
- The college offers extension classes for adults who are not full students.
