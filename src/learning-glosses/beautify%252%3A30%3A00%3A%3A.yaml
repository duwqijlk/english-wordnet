simpleMeaning: to make a person, place, or thing look better and nicer to see
scope: This means making something look better in a general way, not only by adding colour or pretty extra
  things, and not the sense of a thing itself being nice to look at.
examples:
- She planted flowers to beautify the garden.
- They painted the old walls to beautify the room.
