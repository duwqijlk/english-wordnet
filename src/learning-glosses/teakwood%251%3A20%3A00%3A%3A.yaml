simpleMeaning: Hard, strong wood from teak trees, yellowish-brown in colour and long-lasting, that insects
  do not eat and that keeps its shape, used for furniture and for building ships.
scope: Also called teak, it is hard, strong, long-lasting wood from teak trees, used for furniture and
  for building ships.
examples:
- The table was made of teakwood, hard and warm in colour.
- Teakwood is used in shipbuilding because it keeps its shape.
