simpleMeaning: A Christian teaching judged wrong by the church, from the 100s and 200s, that threw out
  the Old Testament and denied that God became a man in Jesus.
scope: A belief of the early church that turned away from the Old Testament and from Christ as man; close
  to other early Christian teachings, but this one denies that God became a man in Jesus.
examples:
- Marcionism taught that the Old Testament should be set aside.
- Early church writers argued against Marcionism and its view of Jesus.
