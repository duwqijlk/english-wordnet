simpleMeaning: a fault from birth in which some fingers or toes are missing
scope: A fault from birth with fingers or toes missing, not an injury that cuts off a finger and not a
  hand with extra fingers.
examples:
- The baby was born with ectrodactyly and had only three toes on one foot.
- Ectrodactyly meant she was missing two fingers on her left hand.
