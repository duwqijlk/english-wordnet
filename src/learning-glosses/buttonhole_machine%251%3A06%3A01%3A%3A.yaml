simpleMeaning: A sewing device that makes every kind of slit for a fastener, with or without a thick cord
  that stiffens the edge.
scope: A sewing device that makes slits for fasteners, also called an eyelet buttonhole machine; not a
  plain sewing device that only joins cloth.
examples:
- The tailor bought a buttonhole machine for her shop.
- This buttonhole machine sews slits with or without a thick cord.
