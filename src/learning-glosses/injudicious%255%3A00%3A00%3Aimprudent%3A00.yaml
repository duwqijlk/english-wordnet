senseId: injudicious%5:00:00:imprudent:00
synsetId: 01906037-s
simpleMeaning: Not wise, showing poor judgment and too little care in what one does.
scope: Showing a lack of judgment in a choice or act, not a wise decision.
examples:
- The decision to spend the money was injudicious.
- It was injudicious of them to promise what they could not give.
