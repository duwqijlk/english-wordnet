senseId: 'diuretic_drug%1:06:00::'
synsetId: 03219373-n
simpleMeaning: Any substance that tends to make the body pass more water, so the body gets rid of extra
  water
scope: This is a substance that makes the body pass more water and lose extra water; diuretic and water
  pill are other names for it, not a substance that holds water in.
examples:
- The doctor gave her a diuretic drug to ease the swelling.
- A diuretic drug can make you pass water more often.
