simpleMeaning: Any stuff that tends to make the body pass more water, so the body gets rid of extra water
scope: This is a stuff that makes the body pass more water and lose extra water; diuretic and water pill
  are other names for it, not a stuff that holds water in.
examples:
- The doctor gave her a diuretic drug to ease the swelling.
- A diuretic drug can make you pass water more often.
