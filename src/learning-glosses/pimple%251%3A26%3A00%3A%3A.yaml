simpleMeaning: a small raised spot on the skin, red and swollen, sometimes filled with pus, the kind that
  often comes with acne
scope: A small red swollen spot on the skin that comes with acne, not a wart or a mole.
examples:
- A pimple appeared on her chin the day before the party.
- He tried not to touch the pimple on his forehead.
