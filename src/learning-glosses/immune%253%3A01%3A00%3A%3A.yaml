simpleMeaning: about the state of being safe from illness because the body can fight it off
scope: About the state of being safe from illness, as in the body's own defence system; not the sense
  about giving that safety against a disease, and not the noun for a person who cannot catch an illness.
examples:
- The immune system protects the body from illness.
- Doctors studied her immune response to the virus.
