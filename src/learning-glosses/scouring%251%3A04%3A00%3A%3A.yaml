simpleMeaning: rubbing a surface with a brush, soap, and water until it is clean
scope: Cleaning a surface by rubbing with a brush, soap and water; also called scrub or scrubbing, and
  not just washing with water alone.
examples:
- Scouring the pots took her most of the morning.
- He did the scouring of the old floor with a stiff brush and soapy water.
