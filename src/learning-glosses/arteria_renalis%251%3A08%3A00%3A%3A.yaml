simpleMeaning: an artery that starts from the main artery of the belly and feeds the kidneys, the small
  glands above them, and the tubes that carry urine from them
scope: 'Another name for the renal artery: the artery that feeds the kidneys and their tubes, not the
  arteries of the belly wall.'
examples:
- The arteria renalis carries blood to each kidney.
- A block in the arteria renalis can raise blood pressure.
