simpleMeaning: any of several bushy plants of the plant group Chrysopsis, with bright yellow flower heads
  like daisies, found across much of the United States and into Canada
scope: Any of several bushy plants with bright yellow daisy-like flower heads, found across the United
  States and into Canada; not a true aster and not a garden flower.
examples:
- The golden aster bloomed along the roadside in late summer.
- We saw golden aster growing wild on the dry hillside.
