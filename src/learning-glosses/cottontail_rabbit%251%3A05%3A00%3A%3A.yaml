simpleMeaning: A small rabbit found across North America, with grey-brown fur and a white patch under
  its tail; it can carry the ticks that spread Lyme disease.
scope: The small North American rabbit with a white tail underside; cottontail and wood rabbit are other
  names for the same animal, not different kinds.
examples:
- A cottontail rabbit froze at the edge of the field when the hawk passed overhead.
- The cottontail rabbit's white tail flashed as it darted into the brush.
