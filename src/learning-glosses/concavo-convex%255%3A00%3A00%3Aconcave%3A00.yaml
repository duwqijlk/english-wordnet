senseId: concavo-convex%5:00:00:concave:00
synsetId: 00538636-s
simpleMeaning: curved in on one side and curved out on the other, with the inward curve deeper than the
  outward curve
scope: A shape that bends in on one side and out on the other, with the inward bend deeper, not one that
  bends out on both sides and not a flat shape.
examples:
- The concavo-convex lens is curved in on one face and out on the other.
- A concavo-convex mirror dips in on one side and bulges out on the other.
