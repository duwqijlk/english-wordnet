simpleMeaning: With ideas about life that are too grand and dreamy to work in the real world, and not
  sensible about what can be done.
scope: Also called romantic, this is a person with ideas about life that are too grand and dreamy to work
  in the real world, and not sensible about what can be done.
examples:
- His quixotic plan to build a castle in the desert drew laughter.
- She was quixotic about the old mill, dreaming of turning it into a palace.
