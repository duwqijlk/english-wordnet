simpleMeaning: not possible to do in real life and based only on guesses and hopes
scope: 'Also called airy, windy and impractical: not possible to do in real life and based on guesses
  and hopes. Not the noun for a person who has wild ideas and hopes with little care for what can really
  be done.'
examples:
- His visionary plan to build a city on the sea could never be built.
- They had visionary schemes for getting rich, but no real way to make them work.
