simpleMeaning: one of four joined hollow spaces in the brain; it joins the tube in the main nerve cord
  in the back and holds fluid found around the brain
scope: This is a hollow space in the brain, not the part of the heart that pumps blood to the body.
examples:
- Doctors looked at fluid moving through a ventricle in his brain.
- The scan showed one ventricle in the brain was larger than the others.
