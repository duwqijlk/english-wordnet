simpleMeaning: to put things in a row of rings or chains, as with spores
scope: 'Also called catenate: to line things up in a row of rings or chains, as with spores, not to join
  separate things end to end.'
examples:
- The tiny cells catenulate into long chains under the microscope.
- Under the lens, the spores catenulate in a row of rings.
