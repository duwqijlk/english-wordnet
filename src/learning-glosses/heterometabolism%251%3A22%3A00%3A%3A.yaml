simpleMeaning: The growth of insects by a change that is not full, with no resting stage before they grow
  up
scope: This is the growth of insects by a change that is not full, with no resting stage before they grow
  up, also called heterometaboly, and not growth by a full change with a resting stage.
examples:
- Heterometabolism means no resting stage comes before the adult form.
- In heterometabolism, the young grow straight into adults.
