simpleMeaning: A crease on the palm that people who read palms say shows a person's emotional nature.
scope: 'Also called heart line, love line and mensal line: a fold in the hand said to show what you feel,
  not the fold said to show success and not the fold said to show how long you will live.'
examples:
- The line of heart on her palm curved down toward her wrist.
- He looked at the line of heart to learn about her feelings.
