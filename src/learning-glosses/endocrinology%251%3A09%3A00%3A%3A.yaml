simpleMeaning: The part of medicine that studies the tube-free parts of the body and the body chemicals
  they make.
scope: The part of medicine that studies the body's chemical-making parts and their chemicals, not the
  study of the heart and not the study of the brain.
examples:
- She studied endocrinology to learn how glands control the body.
- Endocrinology covers the glands and the chemicals they make.
