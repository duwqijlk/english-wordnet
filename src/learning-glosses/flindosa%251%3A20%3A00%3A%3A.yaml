simpleMeaning: A tall Australian wood tree that gives hard tough wood used for barrel sides and more
scope: This is a tall Australian wood tree that gives hard tough wood used for barrel sides and more;
  flindosy and native beech are other names for this sense, not a short shrub and not a soft-wood tree.
examples:
- The flindosa gave hard wood for barrels.
- A flindosa stood tall in the forest.
