simpleMeaning: whatever food happens to be available, especially when offered to a guest who was not expected,
  or when guests bring food and share it with all
scope: Food that is already there or that guests bring to share, not a planned meal made by the host alone.
examples:
- We arrived without warning, so we had to take potluck for supper.
- Everyone brought a dish for the potluck supper.
