simpleMeaning: To make a high, sharp, harsh sound
scope: Also called squeak, screech, and whine, this is a high harsh sound, not a low soft sound and not
  a loud bang.
examples:
- The old door creaked when I opened it slowly.
- The floorboards creak under my feet at night.
