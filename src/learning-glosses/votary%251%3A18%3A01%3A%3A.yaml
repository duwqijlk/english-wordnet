senseId: 'votary%1:18:01::'
synsetId: 10779650-n
simpleMeaning: A priest, priestess, or sworn worshipper in a religion or cult that is not Christian.
scope: A priest or sworn worshipper in a non-Christian religion or cult, not one bound by vows to a religion
  or a life of worship or service, and not an almost religiously devoted follower of a cause, person,
  or activity.
examples:
- The votary of Aphrodite tended the shrine day and night.
- As a votary of the old cult, they kept its rites faithfully.
