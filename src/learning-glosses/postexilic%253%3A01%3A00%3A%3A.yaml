simpleMeaning: about the time in Jewish history after 539 BC, after the time when the people were held
  in Babylon
scope: About the time in Jewish history after 539 BC, after the people were held in Babylon, not the time
  before that captivity and not the time of the captivity itself.
examples:
- The postexilic period began after 539 BC.
- These postexilic writings come from the time after the Babylonian Captivity.
