simpleMeaning: not well or able in the mind or in the body
scope: This means not well or able in the mind or the body; afflicted is another name for this sense.
  Not just feeling tired or weak for a short time.
examples:
- His impaired memory made it hard for him to remember names.
- She drove with impaired sight and could not see the signs clearly.
