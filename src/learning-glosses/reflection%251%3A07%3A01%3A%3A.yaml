simpleMeaning: How well a thing can throw back beams or rays of light
scope: How well a thing throws back light, not the picture in a mirror and not the bouncing back of a
  wave.
examples:
- The white paint has a high reflection in the sun.
- The reflection of the polished floor dazzled our eyes.
