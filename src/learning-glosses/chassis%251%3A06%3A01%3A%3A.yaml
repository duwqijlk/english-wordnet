simpleMeaning: a metal frame that holds the parts of a circuit in an electronic device
scope: This is the metal frame inside an electronic device, not the steel frame of a motor vehicle that
  holds its body and motor.
examples:
- He fixed the circuit parts to the chassis of the radio.
- The chassis of the television held all its electronic parts.
