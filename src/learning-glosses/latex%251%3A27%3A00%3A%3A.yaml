simpleMeaning: a white, milk-like liquid that comes out of some plants and turns thick when it meets the
  air
scope: This is the white liquid from some plants itself, not latex paint, the paint made with water that
  has this kind of liquid mixed in to hold it together.
examples:
- Latex drips from the cut stem of the plant.
- Workers collect latex from rubber trees and leave it out to turn thick in the air.
