simpleMeaning: In law, a step where a side says a line of questions, witness, proof, or other matter is
  improper or unlawful and should stop, and asks the judge to rule
scope: In law, a step where a side says a line of questions, witness, proof, or other matter is improper
  or unlawful and should stop, and asks the judge to rule, not a public show of not agreeing and not the
  act of saying you oppose a thing in earnest.
examples:
- The lawyer raised an objection to the question.
- The judge overruled the objection and let the witness answer.
