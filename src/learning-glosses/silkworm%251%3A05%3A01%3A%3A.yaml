simpleMeaning: The hairless white caterpillar bred on farms, the larva of a domesticated moth, whose cocoon
  is unwound to make silk; it is the principal source of commercial silk.
scope: This is the farmed caterpillar of the domestic silk moth, the main producer of commercial silk;
  it is not the wild saturniid larva that also spins strong silk, and not the adult moth.
examples:
- The farm raises silkworms on mulberry leaves and harvests their cocoons.
- Each silkworm spins a single long thread that workers unwind to make silk.
