simpleMeaning: a snack made from a thin crisp slice of a root vegetable fried in a lot of hot oil
scope: Also called chip and crisp, this is a thin fried snack, not a raw slice and not a soft cooked slice.
examples:
- I ate a crisp potato chip with my lunch.
- He put a potato chip on the plate next to his sandwich.
