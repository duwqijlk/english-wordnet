simpleMeaning: a unit in the United States for measuring dry things, equal to 4 pecks or 2152.42 cubic
  inches
scope: This is the United States dry measure, not the British measure of the same name and not the verb
  sense of fixing something that is broken.
examples:
- The farmer sold a bushel of corn.
- She picked a bushel of apples from the trees.
