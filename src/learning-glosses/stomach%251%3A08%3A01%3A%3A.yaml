simpleMeaning: the body area between the chest and the hips in animals with a backbone
scope: This is the outer body area, another name for the same sense as 'belly' and 'abdomen', not the
  digestive organ or a taste for conflict.
examples:
- He lay on his stomach on the warm sand.
- The seat belt pressed against her stomach.
