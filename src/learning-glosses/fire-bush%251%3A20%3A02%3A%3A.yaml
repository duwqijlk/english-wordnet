simpleMeaning: a South American bush that keeps its leaves all year and has bright orange flowers shaped
  like trumpets; people grow it to look at, outdoors or in the house
scope: A South American evergreen bush with bright orange trumpet-shaped flowers, also called fire bush
  or marmalade bush, not the Eurasian plant whose leaves turn purple-red in autumn.
examples:
- The fire-bush by the door was full of orange flowers.
- She keeps a fire-bush in a pot on her window sill.
