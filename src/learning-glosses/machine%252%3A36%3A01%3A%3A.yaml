simpleMeaning: to cut, shape, form, or give a final finish to a piece of material using powered tools.
scope: This is not the sense of making a whole product with powered equipment; it is about working an
  existing piece of material into shape or a finish.
examples:
- The workers machined the metal parts to within a hair's width.
- He machined a new handle from a block of wood.
