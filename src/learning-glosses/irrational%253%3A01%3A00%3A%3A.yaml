simpleMeaning: a real number that cannot be written as a fraction of two whole numbers, allowing a minus
  sign
scope: A real number that cannot be written as a fraction of two whole numbers, allowing a minus sign;
  not a number that can be so written, and not a number that is not real.
examples:
- Pi is an irrational number.
- The square root of two is irrational, since no whole number over another gives it exactly.
