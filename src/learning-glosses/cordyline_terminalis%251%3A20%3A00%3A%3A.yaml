simpleMeaning: A bush with long leaf tufts at branch ends, used locally for roofs and clothes, with thick
  sweet roots eaten as food, from tropical southeastern Asia, Australia and Hawaii.
scope: 'Also called ti: a leafy bush of tropical southeastern Asia, Australia and Hawaii, not a palm tree
  and not a food crop grown for its leaves.'
examples:
- The Cordyline terminalis by the hut has long leaves at its branch ends.
- Weavers cut Cordyline terminalis leaves for roof cover.
