simpleMeaning: the hollow muscle in the chest, between the lungs, whose steady beats push blood round
  the body
scope: 'Also called heart: the muscle in the chest that pushes blood round the body, not a machine that
  moves liquid or gas and not to move a thing up and down like a handle.'
examples:
- His pump raced after he ran up the stairs.
- The doctor listened to her pump with a stethoscope.
