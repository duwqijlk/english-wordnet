simpleMeaning: A medium-sized dog breed with a long head, a soft undercoat and a harsh, wiry top coat;
  it began in Holland and was mainly developed in France.
scope: Another name for the griffon gundog, the breed developed in France; not the tiny Belgian griffon,
  and not the griffon vulture.
examples:
- The wire-haired pointing griffon is a medium-sized gundog with a harsh, wiry coat.
- Our wire-haired pointing griffon loves working in the field.
