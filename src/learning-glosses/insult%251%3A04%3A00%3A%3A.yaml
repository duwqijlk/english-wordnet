simpleMeaning: an act done on purpose to offend a person, or anything that has that same effect
scope: An act done on purpose to offend, or anything with that effect, not a rude remark meant to hurt.
examples:
- Turning his back on me was a deliberate insult.
- Leaving her off the list was an insult to her work.
