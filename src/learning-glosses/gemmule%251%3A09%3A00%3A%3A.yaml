simpleMeaning: One of the separate bits that Darwin said carry traits from parents to their young.
scope: This is one of the separate bits that Darwin said carry traits from parents to their young, not
  a part of the body that we now call a gene and not a whole living cell.
examples:
- Darwin thought gemmules carried traits from parent to child.
- The gemmule was Darwin's idea, not a thing we can see.
