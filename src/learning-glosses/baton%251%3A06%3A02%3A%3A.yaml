simpleMeaning: a hollow metal stick waved or spun by the person who leads a marching band
scope: A hollow metal stick spun by a marching band leader, not the thin stick a conductor uses and not
  the tube passed in a relay race.
examples:
- The drum major tossed the baton high and caught it again.
- She practised twirling her baton before the parade.
