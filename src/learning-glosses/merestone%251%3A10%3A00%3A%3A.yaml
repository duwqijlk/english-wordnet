simpleMeaning: This old word names a heap of rocks with a flat upright piece set on top, set up as a mark
  in the land.
scope: It is also called a mearstone and a meerestone, and it is an old word for a heap of rocks topped
  with a flat upright piece that marks the land.
examples:
- The merestone still stood, a heap of rocks with a flat piece on top.
- They stopped beside the merestone to look at the flat piece on top.
