simpleMeaning: In the place itself, people may drink the strong drink sold there, under leave given in
  writing
scope: Leave to sell strong drink for drinking in the place where it is sold, not leave to sell it for
  people to take away.
examples:
- The pub's on-license lets it serve beer at the tables.
- They applied for an on-license so customers could drink on the premises.
