simpleMeaning: In music, a written sign that makes a note normal again after an earlier sign made it sharp
  (a little higher) or flat (a little lower)
scope: 'Also called natural: a written music sign that makes a note normal again, not the verb uses of
  cancel that mean to stop something that was planned or to make something have no effect.'
examples:
- The cancel in the music brought the note back to its normal sound.
- She wrote a cancel before the note to undo the sharp.
