simpleMeaning: In physics, the light, or other rays like it, that a substance lets through is put down
  as a number.
scope: Also called absorbance, optical density, and photographic density, it is a physics measure of the
  light or other rays a substance lets through.
examples:
- The transmission density of the glass was measured.
- The transmission density of the film was measured too.
