simpleMeaning: too smooth and eager to please in manner or speech, in a way that feels false and unpleasant
scope: Too smooth and eager to please in a way that feels false; oily and buttery are other names for
  this sense, and it is not being covered in soap or being kind.
examples:
- He gave her soapy compliments all evening.
- The soapy salesman praised everything we owned.
