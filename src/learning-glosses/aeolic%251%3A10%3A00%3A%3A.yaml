simpleMeaning: The old Greek way of speaking used in Thessaly, Boeotia and Aeolis.
scope: The dialect of Ancient Greek spoken in Thessaly, Boeotia and Aeolis, also called Aeolic dialect
  and Eolic; its home in those three lands sets it apart from other forms of Ancient Greek.
examples:
- Aeolic was spoken in Thessaly and Boeotia.
- The old songs were written in Aeolic.
