simpleMeaning: to give a city a long, narrow strip of water made by people
scope: This is the act of giving a city a long, narrow strip of water made by people. It is not the strip
  of water itself, not a tube in the body, and not a mark once thought to be seen on Mars.
examples:
- The city was canalled to link it with the river.
- This city was canalled so that boats could carry goods into it.
