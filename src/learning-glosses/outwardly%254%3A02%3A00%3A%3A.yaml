simpleMeaning: in the way a person or thing looks to others
scope: This is about how a person or thing looks on the outside; it is not about how they feel or are
  on the inside.
examples:
- Outwardly, he looked calm, but inside he was afraid.
- The house looked fine outwardly, though the roof needed work.
