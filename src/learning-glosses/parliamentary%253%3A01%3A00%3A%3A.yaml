simpleMeaning: connected with or like the group of people chosen to make a country's laws
scope: This means connected with the group of people chosen to make a country's laws. It is not the sense
  about a country's leaders coming from that law-making group, and not the sense about following that
  group's meeting rules.
examples:
- The country is holding parliamentary elections next month.
- She works in a parliamentary office that helps members make laws.
