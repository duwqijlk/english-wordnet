simpleMeaning: Often cooked by heat from above, this is the flesh of young Atlantic cod, haddock, or pollock,
  no more than 2 pounds in weight.
scope: Also called scrod, this is the flesh of young cod, haddock, or pollock, often cooked by heat from
  above, not the live young fish.
examples:
- We ate schrod.
- The schrod was broiled.
