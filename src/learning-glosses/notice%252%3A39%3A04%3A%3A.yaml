senseId: 'notice%2:39:04::'
synsetId: 02158938-v
simpleMeaning: to become aware of something, or to find out that it exists, is present, or is true, by
  using your eyes.
scope: This is not the act of paying attention, and not the more general verb sense of becoming aware
  of something; it is specifically about finding something out by seeing it.
examples:
- I noticed a small crack in the window.
- Did you notice that the door was open?
