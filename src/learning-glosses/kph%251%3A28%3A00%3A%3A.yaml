simpleMeaning: A thing's speed is the length it covers in sixty minutes, counted in thousands of metres
scope: 'Another name for kilometers per hour, kilometres per hour and km/h: a speed, not a distance on
  its own and not a time on its own.'
examples:
- The car drove at 60 kph on the open road.
- The sign said the speed limit was 80 kph.
