simpleMeaning: to jump from a plane, do different moves in the air, then open a parachute, a large cloth
  that slows your fall
scope: This is jumping from a plane and doing moves in the air before opening a parachute, not just falling
  from a plane or jumping because of danger.
examples:
- She learned to skydive last summer and now jumps every month.
- They skydive from the plane, turn in the air, and then open their parachutes.
