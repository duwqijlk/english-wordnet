simpleMeaning: A branch of the Indo-European family of tongues, close to the Slavonic tongues, that has
  kept many old ways of speech thought to have been in the first Indo-European tongue.
scope: Also called Baltic; a branch of the Indo-European family of tongues, not the Slavonic tongues themselves
  and not a single modern tongue.
examples:
- The Baltic language group keeps many old words.
- Lithuanian belongs to the Baltic language family.
