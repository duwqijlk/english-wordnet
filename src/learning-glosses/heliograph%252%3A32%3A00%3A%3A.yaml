simpleMeaning: To send signs with a mirror, using the rays of the sun.
scope: To send a message by turning a mirror in the sun's rays; not the mirror device itself that sends
  telegraphic messages by turning the sun's rays off and on.
examples:
- The scouts heliographed their position back to camp.
- They heliographed across the valley when the radio failed.
