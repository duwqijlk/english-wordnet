simpleMeaning: A machine that takes the wet out of clothes, turning them round and round in a drum filled
  with hot air
scope: This is a machine that takes the wet out of clothes, turning them round and round in a drum filled
  with hot air, also called tumble-dryer and tumble dryer; not a washing machine and not a line for drying
  clothes outdoors.
examples:
- The tumble drier finished the wash in half an hour.
- She put the wet sheets into the tumble drier.
