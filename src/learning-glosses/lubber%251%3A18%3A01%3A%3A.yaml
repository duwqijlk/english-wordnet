simpleMeaning: a sailor with little practice at sea and on a first trip on a ship
scope: 'Also called landlubber: a new sailor with little practice at sea, not a sailor with many years
  of work on ships.'
examples:
- The old sailors showed the young lubber how to tie the rope.
- On his first trip, the lubber did not know the names of the sails.
