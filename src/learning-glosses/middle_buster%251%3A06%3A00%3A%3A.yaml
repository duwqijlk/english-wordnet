simpleMeaning: A plough with a double board made to throw dirt to either side of a furrow down the centre.
scope: A plough with a double board made to throw dirt to either side of a furrow down the centre, also
  called a lister, a lister plough, a lister plow or a middlebreaker; not a plough with one board and
  not a harrow.
examples:
- The farmer used a middle buster to throw dirt to both sides of the furrow.
- A middle buster has a double board for the furrow down the centre.
