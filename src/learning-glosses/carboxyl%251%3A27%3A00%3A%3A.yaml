simpleMeaning: a small part of a molecule, written -COOH, that is found in and marks out the sour substances
  called acids that are made with carbon
scope: A small part of a molecule, written -COOH, that is found in and marks out the sour substances called
  acids that are made with carbon; carboxyl group is another name for this sense, not a word for things
  that hold or are made of this part.
examples:
- The carboxyl group marks the molecule as an acid.
- Chemists look for the carboxyl in the compound.
