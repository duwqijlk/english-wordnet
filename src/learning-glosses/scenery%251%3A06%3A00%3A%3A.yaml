simpleMeaning: the painted backdrops and built pieces on a stage that make it look like a place in the
  story
scope: 'Also called a scene: the painted set on a stage, not the natural view of a place.'
examples:
- They worked all night painting the scenery.
- The scenery showed a quiet street in an old town.
