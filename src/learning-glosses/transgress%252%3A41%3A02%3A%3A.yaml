simpleMeaning: to do a wrong act against God, or to break a law of God or a rule about right and wrong
scope: 'Also called sin and trespass: doing wrong against God or against right and wrong, not just breaking
  a general law, rule, contract or promise.'
examples:
- She believed she transgressed God's law by stealing.
- The story tells of a man who transgresses and then asks God to forgive him.
