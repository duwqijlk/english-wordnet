simpleMeaning: A tough fern from North America whose branches spread from one point like the fingers of
  a hand and curve backward, borne on shiny dark reddish stalks.
scope: A North American fern named for its branch pattern, which spreads from one point like fingers on
  dark reddish stalks. It is not the common maidenhair fern of the houseplant trade, which has finely
  divided fronds. This is a botanical name, and a stipe is the stalk of a fern frond.
examples:
- Five-fingered maidenhair fern grows well in damp shade beside the creek.
- The five-fingered maidenhair fern keeps its green through cold winters.
