simpleMeaning: A part of the body that bulges out in one spot after swelling, larger than it should be.
scope: Also called a lump or a swelling, this is a part of the body that bulges out in one spot, not a
  lack of grace from being puffed up with pride.
examples:
- Puffiness round her ankle showed where the sprain had swelled.
- The puffiness in his cheek went down after a day.
