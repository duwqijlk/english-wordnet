simpleMeaning: The English royal family, a side line of the Plantagenets, that ruled from 1461 to 1485,
  with a white rose as its mark
scope: House of York is another name for this sense; not the Lancaster family and not the city of York.
examples:
- York ruled England until 1485.
- The white rose was the mark of York.
