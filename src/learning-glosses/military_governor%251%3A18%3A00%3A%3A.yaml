simpleMeaning: The chief of a rule set up by soldiers, as in a land they have beaten in war
scope: The chief of a rule set up by soldiers in a beaten land; not a ruler chosen by vote and not a general
  in the field.
examples:
- The military governor ruled the defeated country for two years.
- A military governor took charge of the town after the surrender.
