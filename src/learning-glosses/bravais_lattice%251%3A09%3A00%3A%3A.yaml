simpleMeaning: A regular pattern in three directions in which atoms, molecules or ions are set out to
  form a crystal
scope: A regular pattern in three directions of atoms, molecules or ions in a crystal; also called crystal
  lattice and space lattice, not a flat pattern and not a random scatter of atoms.
examples:
- The Bravais lattice shows how atoms line up in a crystal.
- Scientists use the Bravais lattice to describe crystal shapes.
