senseId: 'immunize%2:29:00::'
synsetId: 00086587-v
simpleMeaning: to protect a person from a sickness by putting a substance into their body that helps the
  body fight that sickness
scope: 'Also called inoculate, vaccinate, and immunise: protecting a person from a sickness by putting
  a substance into their body to help the body fight it. Not the legal sense, where a person cannot be
  taken to court for a crime.'
examples:
- The nurse immunized all the children at the school against measles.
- Doctors immunized people in the village to stop the sickness from spreading.
