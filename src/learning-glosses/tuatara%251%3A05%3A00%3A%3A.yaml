simpleMeaning: On the islands off the coast of New Zealand lives the last living kind of the group Rhynchocephalia,
  a big spiny lizard-like reptile with two openings in the skull.
scope: The only living member of its group, a spiny lizard-like reptile of the islands off New Zealand,
  not a true lizard.
examples:
- A tuatara lives on an island off the coast of New Zealand.
- Tuataras are the only living members of the group Rhynchocephalia.
