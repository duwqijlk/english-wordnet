simpleMeaning: up to date and smart in the way you dress and the way you act
scope: 'Also called dashing, spruce, snappy, rakish, dapper, natty, raffish, and spiffy: smart in dress
  and manners, not happy and full of life in mood.'
examples:
- He wore a jaunty red hat that looked new and smart.
- A jaunty young man in a neat suit greeted us at the door.
