simpleMeaning: A coach on wheels, drawn by horse or horses.
scope: This sense is also called a carriage and a rig, for a coach on wheels, drawn by horse or horses,
  where a carriage is a wheeled thing pulled by one or more horses, and a rig is a horse-drawn cart, pulled
  by one horse or a team, unlike the sense for the kit and stores of an army.
examples:
- The equipage rolled along.
- Equipages are coaches drawn by horses.
