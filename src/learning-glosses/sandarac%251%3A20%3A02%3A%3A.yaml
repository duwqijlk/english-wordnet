simpleMeaning: A lasting, sweet-smelling wood used in building, as in the roof of the great church at
  Cordova in Spain.
scope: A lasting, sweet-smelling wood for building, also called citronwood; not the brittle resin of the
  same name and not ordinary pine wood.
examples:
- The roof beams were cut from sandarac.
- Sandarac was prized for building in old Spain.
