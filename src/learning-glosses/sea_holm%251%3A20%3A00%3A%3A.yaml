simpleMeaning: Its roots were once used to stir desire; this European plant keeps its leaves all year,
  with twisted leaves that prick, and grows wild on the United States east coast.
scope: Also called sea eryngium and sea holly, this is a spiny-leaved plant of the east coast, not the
  southern European plant with whitish purple-veined flowers.
examples:
- Sea holm grows wild on the east coast, its twisted leaves full of sharp points.
- Long ago, people used sea holm roots to stir desire.
