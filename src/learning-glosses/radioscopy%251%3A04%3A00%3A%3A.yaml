simpleMeaning: In radiology, using X rays or other rays that pass through things you cannot see through
  to look at what is inside them.
scope: Also called radiology; looking through things you cannot see through with X rays or other rays
  to see what is inside.
examples:
- Radioscopy let the doctor see inside the closed box.
- The radioscopy showed the crack inside the solid block.
