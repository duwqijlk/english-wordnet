simpleMeaning: The basic unit of money in Great Britain and Northern Ireland, worth one hundred pence.
scope: Also called pound, quid, British pound and British pound sterling; the basic unit of money in Great
  Britain and Northern Ireland, worth one hundred pence, not a coin from another land and not a larger
  sum.
examples:
- A pound sterling is worth one hundred pence.
- She paid five pounds sterling for the book.
