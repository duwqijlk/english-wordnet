simpleMeaning: When a person has a disease that brings fever and great tiredness, this bit of the body's
  defence shows up in their blood
scope: A part of the body's defence, also called heterophil antibody, that shows up in the blood during
  this gland illness, not a part of the body's defence in general.
examples:
- The lab found heterophile antibody in his blood after the fever began.
- A rise in heterophile antibody helps doctors spot infectious mononucleosis.
