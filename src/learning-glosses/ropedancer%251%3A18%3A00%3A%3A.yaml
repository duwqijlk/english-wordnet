simpleMeaning: a person who does tricks on a line pulled tight high above the ground
scope: 'Also called a ropewalker: a person who does tricks on a high line, not a juggler and not a clown.'
examples:
- The ropedancer crossed the square on a line high above the crowd.
- We watched a ropedancer balance on a thin line over the ring.
