simpleMeaning: a clinic where people are given medicine and supplies used in medical care
scope: This is a place that gives out medicine and medical supplies as part of care. It is not a shop
  where you buy medicine, and not a big hospital where sick people stay.
examples:
- At the dispensary, the nurse gave him his medicine for the week.
- She went to the dispensary to pick up bandages and medicine.
