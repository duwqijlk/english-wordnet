simpleMeaning: how far a person can be trusted with money, judged by how they have paid back money they
  owed in the past; a general mark of fitness for borrowing
scope: How far a person can be trusted with money, judged by past borrowing; not how much money a person
  has and not a promise to lend.
examples:
- Her creditworthiness helped her get a loan from the bank.
- The bank checked his creditworthiness before it lent him money.
