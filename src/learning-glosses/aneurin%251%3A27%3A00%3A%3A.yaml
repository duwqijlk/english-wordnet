simpleMeaning: Hunger and growth stay on track with this B vitamin, which also stops a sickness called
  beriberi.
scope: Thiamine, thiamin, and antiberiberi factor are other names for this B vitamin, which keeps hunger
  and growth going.
examples:
- Without aneurin, a person can fall ill with beriberi.
- Without aneurin, hunger fades and growth slows.
