simpleMeaning: round the long middle thread of some nerve fibres, a white fatty stuff forms a coat
scope: This white fatty stuff forms a coat round nerve threads, also called myelin and myeline, and it
  is not the lower part of the brain.
examples:
- The medulla forms a coat round the nerve fibre.
- A medulla coats the long middle thread of a nerve fibre.
