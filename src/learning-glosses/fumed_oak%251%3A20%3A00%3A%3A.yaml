simpleMeaning: Wood from a kind of tree, made to look old and worn by smoke from ammonia, used to make
  cupboards and other fine woodwork
scope: This is wood made to look old and worn by ammonia smoke; not plain wood and not wood stained with
  paint.
examples:
- The fumed oak cupboard looks old but is new.
- They chose fumed oak for the cabinetwork.
