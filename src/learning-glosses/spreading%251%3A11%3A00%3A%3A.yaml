simpleMeaning: The way something moves out over a wide space, or the result of that moving out
scope: 'Also called spread: the act or result of moving out over a wide space, not the act of reaching
  over a wider range of time or scope.'
examples:
- The spreading of the ink across the paper took only seconds.
- They watched the spreading fire move over the dry grass.
