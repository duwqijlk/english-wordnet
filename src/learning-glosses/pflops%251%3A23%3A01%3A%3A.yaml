simpleMeaning: In computer work, a unit that measures how fast a machine works, equal to a thousand million
  million maths steps each second.
scope: In computer work, this is a unit that measures how fast a machine works, also called a petaflop,
  not a unit of size or a count of files.
examples:
- The machine runs at ten PFLOPS.
- PFLOPS measure a computer's speed.
