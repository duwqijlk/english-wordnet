simpleMeaning: A way of speaking in the United States that is not the usual standard form, used by Black
  people there in a way that sets it apart
scope: This is a nonstandard way of speaking in the United States used by Black people there, also called
  AAVE, African American Vernacular English, Black English, Black English Vernacular, Black Vernacular,
  Black Vernacular English and Ebonics; not the standard speech taught in schools.
examples:
- He speaks African American English at home with his family.
- African American English has its own ways of saying things.
