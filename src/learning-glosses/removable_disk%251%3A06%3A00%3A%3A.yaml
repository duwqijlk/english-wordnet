senseId: 'removable_disk%1:06:00::'
synsetId: 04082580-n
simpleMeaning: a stiff plate that holds data and can be taken out of the computer, so no one else can
  use it
scope: A plate that holds data and can be taken out of a machine, not a plate that stays in the machine
  and not a small stick used to move files.
examples:
- He took the removable disk out of the drive before he left the office.
- She kept the removable disk in a locked drawer so no one else could use it.
