simpleMeaning: Grass-leaved plant whose leafless stem carries a narrow spray of star-shaped yellow-orange
  flowers; native to the southwestern United States and the only species of its genus in North America.
scope: The desert plant with grassy leaves and star-shaped orange flowers, not a garden lily or a water
  lily.
examples:
- The amber lily blooms in late summer among the rocks.
- You can find the amber lily on dry hillsides in the Southwest.
