simpleMeaning: A kind of pest brought by chance into Florida from the Middle East, then spread to California,
  where it is a grave pest eating nearly all green crops and poinsettias.
scope: This sense is also called poinsettia strain.
examples:
- A superbug ate the crops.
- Superbugs spread to California.
