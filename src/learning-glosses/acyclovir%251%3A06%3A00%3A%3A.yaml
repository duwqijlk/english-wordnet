simpleMeaning: Used for herpes of the sex organs, this drug by mouth fights viruses; sold as Zovirax,
  it eases what the sick person feels but does not cure the sickness.
scope: This is a drug taken by mouth that fights viruses and eases herpes of the sex organs without curing
  it.
examples:
- The doctor gave her acyclovir to ease what she felt from herpes of the sex organs.
- Acyclovir eased what he felt but did not cure the sickness.
