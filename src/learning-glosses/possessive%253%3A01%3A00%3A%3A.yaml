simpleMeaning: used for a word or ending that shows who owns something
scope: This is about a word or ending that shows who owns something. It is not about a person who wants
  to keep someone for themselves and will not share them.
examples:
- '''His'' is a possessive pronoun in the sentence ''His car is red''.'
- Possessive endings in English can show who owns something, as in 'Anna's hat'.
