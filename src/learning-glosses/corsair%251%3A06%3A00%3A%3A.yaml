simpleMeaning: a fast ship used to steal from other ships at sea, often with permission from its own government
scope: This is the fast ship itself, often used to steal at sea with government permission, not the person
  who sails it and not a normal war ship.
examples:
- The corsair raced across the sea to chase the rich ship.
- A corsair with the king's permission attacked enemy ships at sea.
