simpleMeaning: the art of sounding bells that are tuned to notes, in a set order that is never the same
  twice
scope: The sounding of tuned bells in a set order that is never the same twice, not the tolling of one
  bell and not a tune played on bells.
examples:
- The ringers practised change ringing in the church tower all morning.
- Change ringing needs each bell to sound in a new order every time.
