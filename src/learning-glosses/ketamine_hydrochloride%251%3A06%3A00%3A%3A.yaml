senseId: 'ketamine_hydrochloride%1:06:00::'
synsetId: 03616799-n
simpleMeaning: An anesthetic and sedative, not a barbiturate, given by injection, mostly to animals or
  for minor surgery on the old or young; large doses cause hallucinations like the drug PCP.
scope: This is the salt form of the same drug under a chemical name, not a separate medicine, and not
  PCP, the different drug its hallucinations are compared to.
examples:
- The clinic keeps ketamine hydrochloride in small vials for emergency sedation.
- Ketamine hydrochloride is injected into a muscle when a vein cannot be reached.
