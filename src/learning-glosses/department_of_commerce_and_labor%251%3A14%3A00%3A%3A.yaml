simpleMeaning: A part of the United States government that carries out the laws, made in nineteen hundred
  and three and cut into two parts in nineteen thirteen.
scope: This word is about a government office of the United States that no longer exists as one office,
  not one that still works today.
examples:
- The Department of Commerce and Labor was split into two departments in nineteen thirteen.
- In nineteen hundred and three, the Department of Commerce and Labor was made.
