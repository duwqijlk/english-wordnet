simpleMeaning: Using the lower arm muscles too much, as in twisting the hand, can leave the cord at the
  outer edge of the elbow sore and swollen.
scope: 'Also called lateral epicondylitis and tennis elbow: a sore swelling of the elbow cord from overuse.'
examples:
- After weeks of painting, lateral humeral epicondylitis left his elbow aching.
- She wore a band for lateral humeral epicondylitis while she worked.
