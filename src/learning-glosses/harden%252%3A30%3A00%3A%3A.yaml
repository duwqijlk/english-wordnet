senseId: 'harden%2:30:00::'
synsetId: 00444071-v
simpleMeaning: to become hard, or harder than before
scope: This sense is about a thing itself becoming hard, not about making something else hard, not about
  getting used to hard conditions, and not about heating and cooling metal in oil.
examples:
- The mud hardened in the hot sun.
- Leave the glue out overnight and it will harden.
