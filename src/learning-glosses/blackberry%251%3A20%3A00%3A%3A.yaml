simpleMeaning: A thorny bush with sweet black or dark purple berries that you can eat and that usually
  stay joined to the part that holds them.
scope: A thorny bush with sweet dark berries, not the fruit itself and not the act of picking them.
examples:
- Blackberries grew thick along the old wall.
- He cut back the blackberry that blocked the path.
