simpleMeaning: using very few words and leaving out every word that is not needed
scope: 'Also called elliptic: saying things in very few words and leaving parts out. It is not the shape
  sense, like a long flat round shape, and not a long, full way of speaking.'
examples:
- Her elliptical answer gave us the facts but no detail.
- He writes in an elliptical style, so some readers find him hard to follow.
