simpleMeaning: a stretchy leg cover that fits tight to take the strain off the veins in the leg, as when
  the veins are swollen
scope: This is a tight stretchy leg cover also called a support hose, not an ordinary sock and not a tight
  band round one spot on the leg.
examples:
- She put on a support stocking before her long walk.
- A support stocking helps when the veins in your leg swell.
