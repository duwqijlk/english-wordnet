simpleMeaning: to keep something from moving by backing it up, as if it had a stiff frame behind it
scope: 'Also called steady and brace: to hold something still with a stiff support, not to make prices
  or health steady.'
examples:
- She stabilized her elbows on the potter's wheel while she worked.
- He stabilized the ladder against the wall before he climbed it.
