simpleMeaning: A Hindu holy mark of the god Siva, made in the shape of a man's sex organ
scope: A holy Hindu mark of Siva, not a statue of the god and not a picture of him.
examples:
- The lingam stood on a stone base in the shrine.
- Pilgrims poured water over the lingam in the temple.
