simpleMeaning: to make the power or reach of a person or group wider, so more people or places come under
  it
scope: No partner name for this sense; this is the sense of making power or reach wider.
examples:
- The king expanded his rule to the eastern part of the land.
- The company plans to expand its influence into new towns.
