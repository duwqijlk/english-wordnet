synsetId: 08275105-n
simpleMeaning: A group of voters in the United States, no longer in being, that was set up in 1825 to
  keep a secret society out of public life
scope: A political group of the past in the United States, not a party that still runs today and not the
  society it stood against.
examples:
- The Anti-Masonic Party was set up in 1825 to oppose the Freemasons in public life.
- Voters who joined the Anti-Masonic Party wanted the Freemasons kept out of public affairs.
