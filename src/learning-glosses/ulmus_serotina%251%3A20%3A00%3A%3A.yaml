simpleMeaning: An elm of the south-east of the United States that flowers in autumn.
scope: Also called red elm and September elm, this elm of the south-east United States flowers in autumn;
  not the other elms of North America.
examples:
- The Ulmus serotina flowered in October.
- The Ulmus serotina by the house flowers every autumn.
