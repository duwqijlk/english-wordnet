simpleMeaning: This climbing creature most often bores into wood with a strong beak and eats insects;
  it is not one of the common perching kind, but one of many kinds.
scope: This climbing creature, one of many kinds, eats insects, most often with a strong beak for boring
  into wood, and is not one of the common perching kind.
examples:
- The piciform bird bored into the wood with its strong bill.
- A piciform bird climbed up the tree, hunting for insects.
