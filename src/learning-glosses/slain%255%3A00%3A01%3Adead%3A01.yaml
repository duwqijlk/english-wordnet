simpleMeaning: killed; a formal word used in books and other writing, as for fighters killed in war
scope: For a person or animal killed, said in formal writing; not the noun that names a group of people
  who were killed.
examples:
- The slain soldiers were carried from the field after the battle.
- A picture showed St. George standing over the slain dragon.
