simpleMeaning: By adding oxygen, one kind of tiny germ turns ammonia into nitrites
scope: One kind of tiny germ that turns ammonia into nitrites, also called a nitrite bacterium; not the
  germ that turns nitrites into nitrates.
examples:
- A nitrous bacterium turns ammonia into nitrites by adding oxygen.
- The sample held a nitrous bacterium that was turning ammonia into nitrites.
