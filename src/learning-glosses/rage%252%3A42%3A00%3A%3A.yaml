simpleMeaning: to show great force and violence, as a fire or a storm does
scope: This is about fires and storms burning or moving with great force; it is not a person acting in
  a wild way with great anger.
examples:
- The fire raged through the dry woods all night.
- Outside, the storm raged and shook the house.
