simpleMeaning: One of four or five pairs of tubes feeds the lower back bones, the back muscles, and the
  belly wall, starting in the main artery of the belly
scope: 'Also called arteria lumbalis: one of four or five pairs of tubes that feed the lower back.'
examples:
- The lumbar artery feeds the muscles of the lower back.
- Each lumbar artery starts in the main artery of the belly.
