simpleMeaning: a fungus that causes a soft growth on plants grown for smoking, while the plants are still
  growing
scope: A fungus that harms tobacco plants as they grow, not a fungus that harms other crops and not a
  mould that grows on stored food.
examples:
- Tobacco mildew spread over the young plants in the field.
- The farmer sprayed the crop to stop tobacco mildew.
