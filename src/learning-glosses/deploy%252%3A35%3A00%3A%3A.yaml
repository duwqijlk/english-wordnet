simpleMeaning: to place people or things in set positions in a planned way, as part of a larger plan
scope: Sending soldiers, workers, or machines out to set places in a planned way, as part of a larger
  plan; not opening something out flat, and not using a skill or tool.
examples:
- The army will deploy more soldiers to the north.
- They deployed the new machines across all the shops.
