simpleMeaning: A charged bit of stuff holding vanadium in its fivefold form, found as a salt or ester
  made from an acid of vanadium.
scope: This is one of the salts or esters made from an acid of vanadium.
examples:
- The chemist added vanadate to the mix.
- The vanadate in the sample was a salt of an acid of vanadium.
