senseId: 'cirrocumulus%1:17:00::'
synsetId: 09268556-n
simpleMeaning: Small puffs set out in neat rows, like the marks waves leave on sand, make up a cloud high
  in the sky
scope: Also called cirrocumulus cloud, this is a high pattern of small puffs in neat rows, not a low sheet
  of vapour and not a single large puff.
examples:
- The cirrocumulus broke the blue sky into neat rows of tiny puffs.
- We saw cirrocumulus high above us, like ripples across the sky.
