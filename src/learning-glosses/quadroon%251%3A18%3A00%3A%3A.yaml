simpleMeaning: The child of a white parent and a parent of mixed Black and white descent, a person one-quarter
  Black.
scope: For the offspring of a white parent and a parent of mixed Black and white descent.
examples:
- The quadroon was counted as one-quarter Black under the old laws.
- In the novel, the quadroon passes as white in the North.
