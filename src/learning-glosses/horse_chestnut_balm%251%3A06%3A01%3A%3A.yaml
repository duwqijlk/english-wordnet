simpleMeaning: a rub-on cream holding extract of a tree seed, used to ease sore muscles and joints
scope: A rub-on cream holding extract of a tree seed, used to ease sore muscles and joints; horse balsam
  and horse chestnut cream are other names for this sense, not a pill and not a bandage.
examples:
- He rubbed horse chestnut balm on his aching back.
- Horse chestnut balm helped her stiff joints after gardening.
