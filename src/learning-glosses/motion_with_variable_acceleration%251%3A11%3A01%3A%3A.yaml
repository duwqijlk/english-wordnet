simpleMeaning: In mechanics, any movement whose change in speed is not steady, because the push that causes
  it is not steady
scope: In mechanics, any movement whose change in speed is not steady, not a movement that speeds up at
  a steady rate and not a movement at one steady speed.
examples:
- Motion with variable acceleration needs a push that keeps changing.
- The car's motion with variable acceleration made the ride uneven.
