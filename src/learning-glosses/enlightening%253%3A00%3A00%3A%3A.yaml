simpleMeaning: helping a person learn more and know things they did not know before
scope: Also called illuminating and informative, this sense is about helping a person learn more, not
  about making a person feel happier or helping them become a better person.
examples:
- The talk was enlightening because it showed us how the system really works.
- Reading her letter was an enlightening experience that taught me a lot about the war.
