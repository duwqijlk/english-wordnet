simpleMeaning: In building, the upright middle part of a column, between its base and its top.
scope: In building, the upright middle part of a column, not a long tool handle and not a deep hole dug
  down into the ground.
examples:
- The marble shaft of the column rose from its base to the top.
- Each shaft in the old hall was carved with leaves.
