simpleMeaning: With no colour, this gas dissolves in alcohol and ether, and power companies use it a great
  deal, though it warms the earth strongly.
scope: Sulfur hexafluoride is another name for this colourless gas, which dissolves in alcohol and ether
  and warms the earth.
examples:
- Engineers use sulphur hexafluoride in the power trade.
- Sulphur hexafluoride dissolved in the ether in the flask.
