senseId: 'columbarium%1:06:01::'
synsetId: 03077698-n
simpleMeaning: a small hollow place in a wall for a pot holding the ash of a dead person who was burned
scope: A single small hollow place in a wall for one pot of ash; cinerarium is another name for this sense;
  not the whole building with many such places, and not a grave in the earth.
examples:
- One columbarium held her grandmother's urn.
- The columbarium in the wall was just big enough for the pot.
