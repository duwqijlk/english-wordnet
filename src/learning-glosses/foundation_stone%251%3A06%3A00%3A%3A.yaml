senseId: 'foundation_stone%1:06:00::'
synsetId: 03392352-n
simpleMeaning: a special event at which a block is set in place to mark the start of work on a new building
scope: A block set in place at a ceremony when work on a new building starts, not a stone in a wall and
  not the first stone of an old building.
examples:
- The mayor laid the foundation stone of the new school.
- A crowd watched as the foundation stone was set in place.
