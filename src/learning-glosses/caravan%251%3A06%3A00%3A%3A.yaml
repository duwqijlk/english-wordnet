simpleMeaning: a small home on wheels, with beds and a place to cook inside
scope: A small home on wheels, with beds and a place to cook inside, also called van, not a line of wagons
  or animals on the move and not the act of travelling in such a line.
examples:
- We spent the summer in a caravan by the sea.
- The caravan had a bed, a stove, and a small table.
