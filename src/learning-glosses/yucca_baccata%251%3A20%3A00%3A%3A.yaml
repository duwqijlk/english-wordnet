simpleMeaning: A tall plant of the southwestern United States and Mexico with a woody stem, stiff sword-like
  pointed leaves and a big bunch of white flowers.
scope: A tall plant with a woody stem and sword-like leaves, also called Spanish bayonet; its nearest
  kin are other tall plants with stiff pointed leaves and white flower bunches.
examples:
- Yucca baccata stood tall beside the desert road with its white flowers open.
- We saw Yucca baccata growing on the dry hillside in Mexico.
