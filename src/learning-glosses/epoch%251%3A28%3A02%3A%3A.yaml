synsetId: 15321930-n
simpleMeaning: In astronomy, a date picked by choice as a fixed point in time, from which facts such as
  the place of a star or planet are written down
scope: 'Also called date of reference: a fixed date in astronomy used as a starting point for facts about
  stars and planets, not a long period of time and not a part of rock time.'
examples:
- The star map uses the year 2000 as its epoch.
- The places of the stars in this list are given for the epoch of January 1, 2025.
