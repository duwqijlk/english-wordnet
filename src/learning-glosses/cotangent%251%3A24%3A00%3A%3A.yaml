senseId: 'cotangent%1:24:00::'
synsetId: 13810581-n
simpleMeaning: The number you get when you divide the length of the side next to an angle by the length
  of the side across from it in a right-angled triangle
scope: This is a ratio of two sides of a right-angled triangle; cotan is another name for it; not the
  tangent, which divides the side across from an angle by the side next to it.
examples:
- The cotangent of 45 degrees is 1.
- To find the cotangent, divide the length of the adjacent side by the length of the opposite side.
