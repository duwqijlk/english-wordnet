simpleMeaning: A raised line that makes the rims of the upper and lower jaws and holds the holes where
  the teeth sit.
scope: A raised line along the rims of the upper and lower jaws, holding the holes where the teeth sit;
  alveolar process and alveolar ridge are other names for it, not a tooth and not the jaw bone itself.
examples:
- The dentist looked at the gum ridge where the tooth had been.
- Her gum ridge held the holes where her teeth sat.
