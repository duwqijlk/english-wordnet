simpleMeaning: Two or more motors, each with its own fuel, fire one after another on this rocket, and
  each is dropped when its fuel is used up.
scope: Also called a step rocket, this rocket drops its motors one by one as their fuel runs out, unlike
  a rocket with a single motor.
examples:
- The multistage rocket dropped its first motor when its fuel ran out.
- Each motor of the multistage rocket fired in turn.
