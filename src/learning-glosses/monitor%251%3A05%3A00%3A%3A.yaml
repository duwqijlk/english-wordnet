simpleMeaning: Any of several kinds of big meat-eating lizard in hot lands in Africa, Asia, and Australia,
  said in old tales to give word of a crocodile near
scope: Any of several kinds of big meat-eating lizard of hot lands, not a screen that shows pictures and
  not a machine that watches a system.
examples:
- A monitor basked on the warm rock by the river.
- The monitor darted away when the crocodile moved.
