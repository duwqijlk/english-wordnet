simpleMeaning: the quality or habit of doing things at the set time and not being late
scope: Also called promptness, this is the quality or habit of being on time, not a single on-time arrival
  and not doing work fast.
examples:
- Her punctuality is well known; she is never late for a meeting.
- Punctuality matters in this job, so everyone comes at the set time.
