simpleMeaning: In the east of North America stands a small tree much like a bush; its leaves, when crushed,
  give off a strong smell.
scope: This small shrub-like tree of eastern North America is known by the strong smell its crushed leaves
  give off.
examples:
- Crush a leaf of the balsam willow and the smell is strong.
- We crushed leaves of the balsam willow and smelled them.
