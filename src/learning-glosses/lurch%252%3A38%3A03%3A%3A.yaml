simpleMeaning: To move on foot in a way that shows you are not in charge of where your feet go
scope: 'Also called stagger: to walk as if you cannot control your steps, not to hang about with no aim
  and not to beat someone in a game.'
examples:
- The drunken man lurched into the room.
- She lurched along the street after the long night.
