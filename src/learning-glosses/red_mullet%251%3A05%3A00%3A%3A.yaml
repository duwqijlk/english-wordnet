simpleMeaning: Warm-sea fishes with bright colours and feelers under the chin.
scope: 'Also called goatfish or surmullet: warm-sea fishes with bright colours and chin feelers, not the
  grey mullet of cooler seas.'
examples:
- The red mullet flashed its bright colours as it swam over the sand.
- Fishermen caught a red mullet in the warm bay.
