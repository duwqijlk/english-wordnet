simpleMeaning: power that travels as rays and can be there even where there is nothing at all
scope: Power that moves as rays, not power held in a moving thing and not power stored in fuel.
examples:
- The sun sends out radiant energy that warms the earth.
- We can feel radiant energy from the fire even before we touch it.
