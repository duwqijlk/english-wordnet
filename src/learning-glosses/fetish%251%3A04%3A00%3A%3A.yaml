simpleMeaning: giving too much care and attention to an activity, in a way that is not based on good reason
scope: This is giving too much care and attention to an activity, with no good reason for it; it is not
  the sense about sex desire, and not a charm that people believe has magic power.
examples:
- He made a fetish of cleanliness and washed his hands many times a day.
- She has a fetish for neat desks and checks them again and again.
