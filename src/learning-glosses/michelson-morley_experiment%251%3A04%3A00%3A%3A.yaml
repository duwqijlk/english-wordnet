simpleMeaning: A famed test of the earth's motion and the speed of light; the failure to find any effect
  was the start of Einstein's theory of relativity.
scope: A famed test run by Albert Michelson and Edward Morley, whose failure to find any effect of the
  earth's motion on the speed of light began Einstein's theory of relativity.
examples:
- The Michelson-Morley experiment found no effect of the earth's motion on light.
- The Michelson-Morley experiment opened the way to relativity.
