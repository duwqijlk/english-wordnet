simpleMeaning: The later part of the day, from late afternoon until it gets dark, when the light is fading.
scope: This is the time of day, not the act of making something level or equal, and not the fully dark
  hours of night.
examples:
- We spent the evening walking along the river.
- The evenings are getting colder now that autumn has arrived.
