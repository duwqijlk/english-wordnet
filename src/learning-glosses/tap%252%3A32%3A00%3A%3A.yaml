simpleMeaning: to ask someone for something in a strong way, and to keep asking if they do not say yes
scope: 'Also called beg: to ask hard and keep asking for something, not a part for letting water out,
  not dancing in metal-plated shoes, and not listening in secret to a phone line.'
examples:
- He tapped his rich uncle for a loan to start his shop.
- The charity taps local shops for food and clothes each winter.
