simpleMeaning: when a small set of people talk together with a trained helper, the talk itself helps them
  get better
scope: A small set of people talk together with a trained helper, also called group psychotherapy, not
  one person talking to a helper alone and not a social club.
examples:
- Group therapy helped him feel less alone with his worries.
- She goes to group therapy once a week with five other people.
