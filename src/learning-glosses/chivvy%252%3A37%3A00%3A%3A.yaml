simpleMeaning: to annoy someone again and again over a long time
scope: 'Also called provoke, harass, plague, hassle, harry, molest, beset and chivy: to annoy again and
  again over a long time, not to annoy just once.'
examples:
- He chivvied his brother with questions all day long.
- She kept chivvying me about the mess until I cleaned it.
