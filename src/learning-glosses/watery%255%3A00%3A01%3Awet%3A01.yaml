simpleMeaning: wet with liquid that comes out of the body, such as sweat or tears
scope: Wet from liquid from the body, such as sweat or tears; not thin and weak like a drink with too
  much water in it, and not full of water.
examples:
- She wiped her watery eyes after crying.
- His brow was watery with sweat in the heat.
