simpleMeaning: made by joining thin threads together with something that holds them, using heat and strong
  pressing
scope: This describes cloth made by pressing threads together, not cloth woven by crossing threads over
  and under each other.
examples:
- This felted cloth is thick and does not come apart easily.
- She bought a bag made of felted wool.
