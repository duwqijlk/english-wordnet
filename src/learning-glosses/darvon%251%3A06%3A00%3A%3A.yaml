simpleMeaning: A mild pain drug that dulls pain and can make one sleepy, close to methadone but less likely
  to cause a habit.
scope: 'Also called propoxyphene and propoxyphene hydrochloride: a mild pain drug close to methadone,
  set apart from stronger pain drugs by its mild effect and lower risk of habit.'
examples:
- The doctor gave her Darvon for the pain after the operation.
- Darvon dulled the ache but left him drowsy.
