simpleMeaning: A mix of magnesium sulfate and water, used as one thing, that loosens the bowels
scope: This is the laxative use of the name, taken as one thing; it is not the use that also treats heartburn
  and stops seizures.
examples:
- She took Epsom salts to ease her constipation.
- Epsom salts are dissolved in water and drunk as a laxative.
