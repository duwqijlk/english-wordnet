simpleMeaning: a sickness passed down from both parents in which the body fails to use tyrosine as it
  should, so the liver and kidneys work badly and the mind grows slowly
scope: A sickness passed down in families, not a liver illness caught from food or drink; it slows the
  mind as well as the liver and kidneys.
examples:
- The baby was tested for tyrosinemia soon after birth.
- Tyrosinemia runs in the family, so both parents were tested.
