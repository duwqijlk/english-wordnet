simpleMeaning: the number you get when you add up the values of a thing that can change by chance and
  split the total by how many values there are
scope: 'Also called expectation, expected value and first moment: the plain average of a set of numbers,
  not the middle number and not the most common number.'
examples:
- The arithmetic mean of 2, 4 and 9 is 5.
- To find the arithmetic mean, add the marks together and divide by the number of pupils.
