simpleMeaning: A line that runs over the sky through the point straight above the person who watches
scope: A line through the point straight above the watcher, not the line that runs east and west through
  that point and not the horizon.
examples:
- The star crossed the observer's meridian at midnight.
- Sailors used the observer's meridian to find their place.
