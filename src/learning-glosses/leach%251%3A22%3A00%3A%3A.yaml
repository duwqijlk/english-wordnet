simpleMeaning: the process by which liquid passing through a thing washes out what is in it
scope: Liquid passing through a thing and washing out what is in it, not the act of washing something
  out and not a leak.
examples:
- The leach of minerals from the soil left the field poor.
- Farmers watched the leach of salt from the dry ground.
