simpleMeaning: without a home in body or in spirit, or without safety
scope: 'Also called homeless and dispossessed: having no home, in body or in spirit, or having no safety;
  this is about a person, not about a building with no top covering.'
examples:
- After the fire, the roofless family slept in a tent by the road.
- He felt roofless at heart, with no place where he felt safe.
