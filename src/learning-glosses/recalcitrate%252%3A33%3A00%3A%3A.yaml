simpleMeaning: To push back hard against what one is asked to do, showing strong dislike and refusing
  to obey.
scope: This is a strong show of dislike with hard push-back and refusal to obey, not silent dislike.
examples:
- The senators recalcitrated against every proposal from the other side.
- He recalcitrated when told to sign the new rules.
