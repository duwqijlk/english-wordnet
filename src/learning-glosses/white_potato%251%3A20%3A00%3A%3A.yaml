simpleMeaning: A one-season plant from South America, with underground runners bearing edible starchy
  tubers, grown widely in gardens as a vegetable, with poisonous vines.
scope: This sense is also called potato and white potato vine, for a plant native to South America that
  lives one season, with creeping underground stems ending in edible starchy swellings, widely grown as
  a garden vegetable, its vines poisonous.
examples:
- White potatoes grow in gardens.
- White potato vines are poisonous.
