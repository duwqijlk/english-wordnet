simpleMeaning: A tall long-lived plant that spreads by creeping underground stems, grown for animal feed;
  settled in the southern United States, where it is a bad pest on farmed land.
scope: A tall long-lived plant that spreads by creeping underground stems, also called evergreen millet,
  means grass, Johnson grass and Sorghum halepense; its nearest kin are other tall plants that spread
  by underground stems.
examples:
- Aleppo grass spread across the field by its creeping underground stems.
- The farmer cursed Aleppo grass as a bad pest on his farmed land.
