simpleMeaning: a link to a crime or wrong act through being mixed up in it, especially in a way that makes
  you look guilty
scope: Being mixed up in a wrong act, especially in a way that makes you look guilty; not the link between
  'if' and 'then' claims, not a thing worked out from facts, and not a charge that links a person to a
  crime.
examples:
- He was suspected of implication in several robberies.
- Her implication in the crime made her look guilty.
