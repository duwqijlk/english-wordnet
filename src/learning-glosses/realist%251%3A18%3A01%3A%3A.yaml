simpleMeaning: a painter who shows the world as it really looks, not made prettier or dream-like
scope: A painter who shows the world as it really looks, not made prettier or dream-like; not a thinker
  about what is real and not a plain practical person.
examples:
- As a realist, she painted tired workers and plain streets, not heroes.
- The realist showed the market just as it was, with its dirt and noise.
