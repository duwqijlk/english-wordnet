simpleMeaning: a heavy metal that breaks easily, of the platinum group, mixed into other metals, found
  in natural mixes with platinum or osmium
scope: Also called iridium, atomic number 77; a heavy metal of the platinum group, not platinum itself
  and not osmium.
examples:
- Ir is one of the platinum group metals.
- The alloy contained Ir and platinum.
