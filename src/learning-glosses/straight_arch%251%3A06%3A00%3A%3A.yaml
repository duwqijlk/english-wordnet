simpleMeaning: a flat-topped structure made of wedge-shaped blocks that hold each other up, with level
  top and bottom edges
scope: This is a flat-topped structure made of wedge-shaped blocks, also called flat arch; not a round
  structure and not a pointed structure.
examples:
- The straight arch over the doorway was built of stone blocks.
- A straight arch needs each block to press on the next.
