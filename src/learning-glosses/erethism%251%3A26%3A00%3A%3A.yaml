simpleMeaning: Being far too quick to react, when a part of the body is far too easily stirred up by touch
  or other things
scope: Being far too quick to react to touch or other things; not a normal quick response, and not a lasting
  pain.
examples:
- The patient's erethism made even a light touch painful.
- Erethism left the injured arm twitching at the least touch.
