simpleMeaning: full of rich, costly comfort and giving much pleasure to sight, taste, smell, touch and
  sound
scope: This means full of rich comfort that pleases the senses, also called luxurious, voluptuous and
  epicurean; it is not the sense about rich detail in style or design.
examples:
- They stayed in a luxuriant suite with soft beds and fine food.
- She enjoyed the luxuriant meal, with rich tastes and sweet smells.
