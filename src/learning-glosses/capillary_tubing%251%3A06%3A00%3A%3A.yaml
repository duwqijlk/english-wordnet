simpleMeaning: A very narrow hollow pipe that holds liquid by drawing it up through its narrow space.
scope: A very narrow hollow pipe that holds liquid by drawing it up; capillary and capillary tube are
  other names for this sense, not a wide pipe and not a drinking straw.
examples:
- The liquid rose up the capillary tubing on its own.
- He cut a short length of capillary tubing for the test.
