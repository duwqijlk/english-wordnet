simpleMeaning: the joining of a sperm cell and an egg cell in the making of young by mating
scope: The joining of a sperm cell and an egg cell, not the wider joining of male and female cells in
  general and not the making of young itself.
examples:
- Amphimixis takes place when a sperm cell joins an egg cell.
- In amphimixis, the sperm and egg cells join to start a new life.
