simpleMeaning: A one-year sweet-smelling weed of the Pacific coast (the United States and north-east Asia),
  with leaves tipped with stiff points and yellow flowers with no rays.
scope: 'Also called pineapple weed and rayless chamomile: a one-year sweet-smelling weed of the Pacific
  coast, with stiff-tipped leaves and yellow flowers with no rays, not a white-rayed chamomile.'
examples:
- Matricaria matricarioides grew along the sandy path near the beach.
- The yellow flowers of Matricaria matricarioides have no rays at all.
