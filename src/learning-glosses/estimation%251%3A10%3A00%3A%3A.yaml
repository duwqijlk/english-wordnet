simpleMeaning: a paper that says how much something is worth, such as for insurance or tax
scope: 'Also called estimate and appraisal: a paper giving the worth of a thing, not a rough working out
  of a number in your head.'
examples:
- The bank asked for a written estimation of the house before the loan.
- For the tax office, the estimation of the land was put on an official form.
