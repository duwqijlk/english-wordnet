simpleMeaning: a Chinese fruit whose thin shell breaks open easily to show sweet flesh like jelly round
  a single seed, often dried
scope: 'Also called lychee, leechee, lichee, lichi, litchee, and litchi: a Chinese fruit with a thin shell
  and sweet flesh round one seed, not a real nut and not a fruit with many seeds.'
examples:
- She cracked a litchi nut and ate the sweet flesh.
- We bought dried litchi nuts at the market.
