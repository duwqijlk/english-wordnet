simpleMeaning: In law, what a court decides about the matters put before it, when it has the power to
  decide them
scope: In law, a court's decision on the matters before it, and judgment is another name for this sense;
  not the power to judge well and not the act of thinking something through.
examples:
- The judgement went against the company.
- She awaited the court's judgement with fear.
