simpleMeaning: To say that something belongs to you and ask for it because you believe it is yours by
  right.
scope: This is not saying that something is true; it is asking for something because you believe it is
  yours by right.
examples:
- After the war, many families claimed their land back.
- He claimed his prize at the front desk.
