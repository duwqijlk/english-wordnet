simpleMeaning: The thin layer that lines the inside of the back of the eye and senses light, joined to
  the nerve that runs to the brain
scope: The thin layer that lines the inside of the back of the eye and senses light, not the white of
  the eye and not the nerve itself.
examples:
- Light falls on the retina at the back of the eye.
- Damage to the retina can cause loss of sight.
