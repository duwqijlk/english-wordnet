simpleMeaning: divided into portions, often equal ones, following a plan or purpose.
scope: This is about something portioned out by design, not about something owned or used by two or more
  people together.
examples:
- The work was shared among the four teams according to a clear plan.
- Food supplies were shared out according to need.
