simpleMeaning: In economics, each side in a contest wins and loses, and those wins and losses are what
  the contest is judged by.
scope: In economics, a way of thinking about a contest by what each side wins and loses, not a set of
  rules for playing a sport and not a guess about who will win.
examples:
- She studied game theory to see how two firms set their prices.
- Game theory helped him work out what the other side would do next.
