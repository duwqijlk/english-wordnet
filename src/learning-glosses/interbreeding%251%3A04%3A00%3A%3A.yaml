senseId: 'interbreeding%1:04:00::'
synsetId: 00852055-n
simpleMeaning: Young that are part of both kinds come from mixing two different kinds of animal or plant
  in genetics
scope: Joining different kinds of animal or plant to make young that mix both kinds, also called cross,
  crossbreeding, crossing, hybridisation, hybridization or hybridizing; not breeding within one kind and
  not a single new kind.
examples:
- Farmers used interbreeding to get wheat that could grow in dry soil.
- The interbreeding of the two kinds of rose made flowers in a new colour.
