simpleMeaning: a thin strip of metal placed between rows of printing type to keep the printed lines apart
scope: This is not the wire jumper or the dog's rope; it is a printer's spacing strip.
examples:
- The printer kept a drawer of leads for spacing rows of type.
- She slid a lead between two lines of metal type before the page was printed.
