simpleMeaning: An old cottage-garden plant of south-eastern Europe, widely grown for its good-looking
  white woolly leaves and showy crimson flowers.
scope: This sense is an old cottage-garden plant of south-eastern Europe, widely grown for its good-looking
  white woolly leaves and showy crimson flowers, also called gardener's delight, mullein pink, and rose
  campion, unlike the sense for a stiff much-branched perennial of the Mediterranean region with very
  white woolly stems and leaves, and unlike the sense for a shrubby perennial of the Canary Islands with
  white flowers and leaves and hairy stems covered with dustlike down, sometimes placed in genus Chrysanthemum.
examples:
- The dusty miller grows in the cottage garden.
- Dusty millers line the path.
