simpleMeaning: in a steady way that stays the same and does not change
scope: This sense is about a steady way that stays the same. It is not the sense about doing something
  at set times again and again, and not the sense about having an even shape.
examples:
- Try to breathe regularly and slowly.
- His heart beat regularly all through the night.
