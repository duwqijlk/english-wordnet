simpleMeaning: belonging to a movement in the arts, or having the style of that movement
scope: Belonging to Romanticism or the Romantic Movement in art, music, and writing; not about love, and
  not about having dreams that are not practical.
examples:
- Romantic poetry put strong feeling and nature at its heart.
- The museum showed Romantic paintings full of wild nature and strong feeling.
