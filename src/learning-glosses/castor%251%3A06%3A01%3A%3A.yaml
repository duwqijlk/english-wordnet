simpleMeaning: a small wheel that can turn in any direction, fixed to the bottom of furniture, trucks,
  or machines that can be moved, so they can move easily
scope: 'Also called caster: a small turning wheel under furniture or a machine, not a shaker for sugar
  and not a hat made from beaver fur.'
examples:
- The chair moves easily on its castors.
- We put castors on the bottom of the heavy cabinet.
