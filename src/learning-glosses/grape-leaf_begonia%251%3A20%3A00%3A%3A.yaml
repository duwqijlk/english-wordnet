simpleMeaning: Small white flowers grow on a South African plant with egg-shaped leaves that have shallow
  cuts, and a root that is thick, at least in part, and stores food
scope: Also called maple-leaf begonia, this is a South African plant with egg-shaped leaves and small
  white flowers, not a vine that bears grapes and not a maple.
examples:
- The grape-leaf begonia in the pot had small white flowers.
- She grew a grape-leaf begonia for its egg-shaped leaves with shallow cuts.
