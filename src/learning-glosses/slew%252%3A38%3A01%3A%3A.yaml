simpleMeaning: to move at an angle or to the side, usually in a way you cannot control
scope: 'Also called slide, slip, and skid: moving to the side in a way you cannot control, not moving
  straight forward and not falling down.'
examples:
- The car slewed sideways on the wet road.
- The truck slewed across the ice before it stopped.
