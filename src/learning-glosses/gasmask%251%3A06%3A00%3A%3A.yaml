simpleMeaning: The face stays safe behind this covering with a filter, which keeps poison fumes out of
  the lungs.
scope: Also called a respirator or a gas helmet, this face covering with a filter keeps poison fumes out
  of the lungs.
examples:
- He put on his gasmask before entering the room.
- Her gasmask kept the poison fumes out of her lungs.
