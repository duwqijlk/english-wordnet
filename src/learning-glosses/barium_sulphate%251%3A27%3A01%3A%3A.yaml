simpleMeaning: a white or colourless hard matter found in the ground, and the main source of the metal
  that comes from it
scope: 'Also called barite, barytes and heavy spar: a white or colourless mineral, not the white powder
  used to colour paint.'
examples:
- The miners dug up barium sulphate from the rock.
- The mine sends out barium sulphate as the main source of barium.
