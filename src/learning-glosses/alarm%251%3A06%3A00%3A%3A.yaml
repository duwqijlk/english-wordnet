senseId: 'alarm%1:06:00::'
synsetId: 02697285-n
simpleMeaning: a thing made to give a sign when something bad happens
scope: This is a thing made to give a sign when something bad happens; it is not a clock that wakes you,
  not a warning sound on its own, and not the fear you feel when you see danger.
examples:
- The alarm went off when smoke filled the kitchen.
- He put an alarm by the door to sound if someone tried to break in.
