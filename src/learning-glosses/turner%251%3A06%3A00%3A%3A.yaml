simpleMeaning: A kitchen tool with a flat, bendy part and a long handle, used to turn food over or lift
  it onto a plate.
scope: A kitchen tool with a flat, bendy part and a long handle for turning or serving food, not a person
  who swings a skipping rope for others.
examples:
- The turner slipped under the pancake and flipped it.
- They used a turner to lift the fish onto the plate.
