simpleMeaning: one of a pair of wooden boards that make a track for things to roll or slide on
scope: One of a pair of boards that make a track for things to roll or slide on, not a brake part and
  not the act of sliding sideways.
examples:
- They set the crate on skids to move it across the yard.
- The heavy stone slid along the skid with ease.
