simpleMeaning: to cut down a tree or wood by hitting it again and again with an axe
scope: This is cutting down a tree or wood with an axe, not cutting food or paper with a knife.
examples:
- They hewed down the dead tree behind the house.
- He hewed at the thick log until it split in two.
