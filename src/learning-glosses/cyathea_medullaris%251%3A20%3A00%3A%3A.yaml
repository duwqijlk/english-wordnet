scope: This is a tall showy fern from New Zealand and Australia with a crown of feathery leaves; black
  tree fern, sago fern and silver tree fern are other names for this sense, and it stands apart from other
  tree ferns by its whitish leaf undersides.
examples:
- Cyathea medullaris grows tall in the forests of New Zealand.
- The Cyathea medullaris in the garden has a crown of feathery leaves.
