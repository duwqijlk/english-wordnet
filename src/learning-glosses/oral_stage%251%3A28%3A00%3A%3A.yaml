simpleMeaning: In the study of the mind, a baby's first time of growth in body and ties is when its mouth
  gives it most joy, through sucking, chewing and biting.
scope: It is also called oral phase, and it is the first stage of a baby's growth, when the mouth gives
  most joy.
examples:
- In the oral stage, the baby bites everything it can reach.
- During the oral stage, the baby sucks and chews for comfort.
