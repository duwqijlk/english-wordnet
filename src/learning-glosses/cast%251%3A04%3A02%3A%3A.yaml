simpleMeaning: A fisherman's forward swing of rod and reel that sends the line out across the water.
scope: This is the angler's swing that sends a line onto the water, not a throw of dice or a violent toss.
examples:
- His first cast landed just beside the reeds.
- She made a long cast toward the far bank.
