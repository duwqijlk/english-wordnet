simpleMeaning: A person who stands behind a politician, a team, or a like group, and backs them.
scope: 'Also called friend, champion, or admirer: a person who stands behind a politician, a team, or
  a like group, not a band worn to hold up a stocking, not a piece of clothing for hard exercise, not
  a person who gives what is needed for a job, and not a person who stands up for a cause.'
examples:
- The team's supporters cheered from the stands.
- She is a loyal supporter of the local candidate.
