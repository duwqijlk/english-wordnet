simpleMeaning: An edible sea bivalve with a grooved fan-shaped shell, that swims by pushing water out
  of the shell in a run of snapping moves.
scope: This sense is an edible sea bivalve with a grooved fan-shaped shell, that swims by pushing water
  out of the shell in a run of snapping moves, also called scallop and scollop, unlike the sense for a
  thin slice of meat, especially veal, usually fried or broiled, and unlike the sense for the edible muscle
  of mollusks with fan-shaped shells, served broiled or poached or in salads or cream sauces.
examples:
- The escallop swims by snapping its shell.
- They eat escallops.
