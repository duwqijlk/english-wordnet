simpleMeaning: In law, a written claim in court that brings up new facts to answer what the other side
  says
scope: In law, a written claim in court that brings up new facts to answer the other side; not a claim
  that only denies what the other side says and not a general request to the court.
examples:
- The lawyer filed a special pleading with new facts.
- Her special pleading answered the other side's claims with new facts.
