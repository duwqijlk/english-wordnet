simpleMeaning: a happy song of faith that marks the birth of Christ
scope: A happy song of faith for the birth of Christ as a piece of music or words; not the verb sense,
  which means to sing such songs, and not the other noun sense, which says the song is usually for this
  birth.
examples:
- This carol has been sung in church for many years.
- She wrote the words for a new carol about the birth of Christ.
