senseId: 'law_of_equal_areas%1:09:00::'
synsetId: 05888463-n
simpleMeaning: 'a rule about how fast planets move: a line from a planet to the sun covers the same amount
  of space in the same amount of time'
scope: A rule about how fast planets move, also called the law of areas, not a rule about how far planets
  are from the sun and not a rule about gravity.
examples:
- The law of equal areas says a planet sweeps out equal areas in equal times.
- Kepler's law of equal areas links a planet's speed to its place in its path.
