simpleMeaning: A bog plant with wide heart-shaped leaves at its base and cream-white saucer-shaped flowers
  with frilled petals; it grows west of the Rocky Mountains from Alaska to New Mexico.
scope: A bog plant with heart-shaped leaves, also called fringed grass of Parnassus; not a true grass.
examples:
- Parnassia fimbriata grew beside the bog pool.
- We saw Parnassia fimbriata in flower on the mountain.
