simpleMeaning: freedom to act or think as you choose, with no rules or limits holding you back
scope: This is freedom to act or think as you choose, not a line around the Earth and not a measure of
  how far north or south a place is.
examples:
- The teacher gave the students much latitude in choosing their topics.
- Managers have some latitude to change the plan.
