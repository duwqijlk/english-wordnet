simpleMeaning: a move of the tongue in which its tip turns back to touch the roof of the mouth while speaking
scope: 'Also called retroflection: a tongue movement used when making a speech sound, not the sound itself
  and not a movement of the lips.'
examples:
- Retroflexion turns the tip of the tongue back against the roof of the mouth.
- The student practised retroflexion until the sound came out right.
