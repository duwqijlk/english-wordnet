simpleMeaning: Strong cloth in the form of strips, made by weaving threads together
scope: Strong cloth in the form of strips, not the thin skin between a bird's toes and not the narrow
  tape used for seat belts or for covering chairs and sofas.
examples:
- The bag has strong webbing for its handles.
- He cut a length of webbing to hold the boxes in place.
