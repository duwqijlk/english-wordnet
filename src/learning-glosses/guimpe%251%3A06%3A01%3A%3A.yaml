simpleMeaning: A piece of stiff cloth that covers the shoulders of a nun's dress
scope: This is a piece of stiff cloth covering the shoulders of a nun's dress, not a blouse worn under
  a jumper and not a veil.
examples:
- The nun wore a white guimpe over her shoulders.
- Her guimpe was starched and stood out stiffly.
