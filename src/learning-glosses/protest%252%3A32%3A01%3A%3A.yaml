simpleMeaning: to say in a formal, serious way that something is true
scope: The verb sense of saying something is true in a formal, serious way; not saying that you do not
  agree, and not a noun for a public act.
examples:
- The suspect protested his innocence again and again.
- She protested that she had never taken the money.
