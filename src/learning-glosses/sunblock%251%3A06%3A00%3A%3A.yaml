simpleMeaning: a cream you put on your skin, with a chemical such as PABA in it that stops harmful sun
  light from reaching the skin and keeps it from burning
scope: 'Also called sunscreen and sun blocker: a cream that guards skin from the sun, not a cream that
  heals skin after it has burned.'
examples:
- She put sunblock on her children's faces before the beach.
- Wear sunblock on sunny days to protect your skin.
