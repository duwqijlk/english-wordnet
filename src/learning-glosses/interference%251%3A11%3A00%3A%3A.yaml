senseId: 'interference%1:11:00::'
synsetId: 07444811-n
simpleMeaning: electric or sound activity that gets in the way of a message
scope: Electric or sound activity that disturbs a message, with noise and disturbance as other names for
  this sense; not a person getting in the way and not a thing that blocks the road.
examples:
- Interference on the radio made the news hard to hear.
- The storm caused interference with the phone line.
