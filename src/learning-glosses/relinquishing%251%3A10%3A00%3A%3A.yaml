simpleMeaning: the act of saying in words that you give up a claim, a right, a position, or something
  like these
scope: 'Also called relinquishment: saying in words that you give up a claim, a right, a position or something
  like these; it is not the wider act of giving up a fight or a hard task.'
examples:
- His relinquishing of the claim ended the long fight over the land.
- The letter was her relinquishing of her right to the house.
