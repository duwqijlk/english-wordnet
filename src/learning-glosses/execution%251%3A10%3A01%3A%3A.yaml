simpleMeaning: In law, finishing a legal paper, such as a contract or deed, by signing it, and perhaps
  sealing it and handing it over, so the law holds people to it
scope: This is about signing a contract or deed to make it count in law, not a court order that tells
  an officer to carry out a court decision, and not just doing a task well.
examples:
- The execution of the deed was completed when both men signed it.
- She waited for the execution of the contract before starting work.
