simpleMeaning: the state of not being allowed to have or do something
scope: A person or thing does not meet what is needed to have or do something; the opposite state is being
  allowed to have or do it.
examples:
- His ineligibility for the prize disappointed him.
- The ineligibility of the player ended the team's hopes.
