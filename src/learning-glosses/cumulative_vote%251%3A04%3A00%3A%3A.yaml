senseId: 'cumulative_vote%1:04:00::'
synsetId: 00184984-n
simpleMeaning: An election in which each person gets as many choices as there are posts to fill, and may
  give them all to one person or spread them out.
scope: An election where each voter may pile all choices on one person, not an ordinary election and not
  a vote by show of hands.
examples:
- Under a cumulative vote, she gave all her votes to one candidate.
- The cumulative vote let small groups win a seat.
