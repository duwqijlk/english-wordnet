simpleMeaning: waste stuff that the body sends out, as urine or sweat, but most of all the solid waste
  from the bowels
scope: 'Also called excrement, excreta, excretion, and body waste: the waste stuff that leaves the body,
  not the organ that sends it out and not waste that stays inside.'
examples:
- Sweat is an excretory product that leaves the body through the skin.
- The nurse checked the excretory product in the sample for signs of illness.
