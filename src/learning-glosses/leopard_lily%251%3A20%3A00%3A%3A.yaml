simpleMeaning: a garden plant whose seed case opens when ripe to show a mass of seeds that look like a
  blackberry
scope: A garden plant whose seed case opens when ripe to show a mass of seeds that look like a blackberry,
  also called a blackberry-lily, not the western lily with orange-red flowers and not a true lily.
examples:
- The leopard lily in the garden opened its seed case to show black seeds.
- She grew a leopard lily for the strange blackberry-like seeds.
