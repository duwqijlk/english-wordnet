simpleMeaning: A chair-like device used to kill a condemned person with electric current; it looks like
  an ordinary chair for one person.
scope: A chair-like device for killing a condemned person with electric current, not an ordinary chair;
  chair, death chair, and electric chair are other names for this sense.
examples:
- He was sentenced to die in the hot seat.
- The old hot seat stood in a corner of the prison.
