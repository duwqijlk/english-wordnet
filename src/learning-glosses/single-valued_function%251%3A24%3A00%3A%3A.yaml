senseId: 'single-valued_function%1:24:00::'
synsetId: 13806028-n
simpleMeaning: In mathematics, a rule that links every item in one set to one item in another set
scope: A rule in mathematics where each item in one set is paired with exactly one item in another set,
  also called map, function, mapping or mathematical function, and not a rule that lets one item pair
  with many.
examples:
- A single-valued function gives each input exactly one output.
- In class we drew a single-valued function that sent every number in the first set to one number in the
  second.
