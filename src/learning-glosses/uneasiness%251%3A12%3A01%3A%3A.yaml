simpleMeaning: shame and awkwardness that comes from a sense that other people are watching you and judging
  you
scope: Shame felt because others seem to be watching and judging you, not the general trait of seeming
  ill at ease and not anxious feelings that make you tense.
examples:
- Her uneasiness grew as the whole room turned to look at her.
- He felt a deep uneasiness under the eyes of the crowd.
