simpleMeaning: A man at the match backs up the main judge, above all by watching the edge of the field
  and for players offside in tennis, soccer, football, and the like
scope: This man is the helper who backs up the main judge at a match, above all by watching the edge of
  the field and for players offside.
examples:
- The linesman called the ball out.
- A linesman stands at the edge of the field during the game.
