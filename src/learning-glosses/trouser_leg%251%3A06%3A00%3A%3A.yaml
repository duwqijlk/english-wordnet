simpleMeaning: One of the two tubes of cloth that cover a person's lower limbs in a pair of pants
scope: One half of a pair of trousers, not the whole garment and not a sleeve of a shirt.
examples:
- He tore the left trouser leg on a nail.
- She ironed each trouser leg carefully.
