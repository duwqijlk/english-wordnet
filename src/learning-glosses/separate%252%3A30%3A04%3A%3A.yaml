simpleMeaning: split into two or more arms that branch out from a single point, as a road does
scope: This is about paths or lines forking into branches, not about dividing something into portions
  or about breaking it into fragments.
examples:
- The path separates just past the bridge and leads to two different beaches.
- Where the river separates, follow the left channel to the mill.
