simpleMeaning: What the body does to fight off something foreign, recognizing it as an antigen (a virus,
  fungus, bacterium or transplanted organ) and producing antibodies aimed specifically at it.
scope: One of three names for this defense reaction, alongside immune reaction and immunologic response;
  it is not a vaccine and not the antibodies by themselves.
examples:
- Her immune response to the vaccine produced plenty of antibodies.
- The immune response treated the transplanted organ as foreign and attacked it.
