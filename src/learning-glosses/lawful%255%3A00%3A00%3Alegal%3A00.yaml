simpleMeaning: allowed by the law, or done in the way the law asks
scope: This is allowed by the law, or done in the way the law asks; legitimate is another name for this
  sense, and it is not merely honest or fair.
examples:
- They formed a lawful government after the vote.
- His claim to the land was lawful.
