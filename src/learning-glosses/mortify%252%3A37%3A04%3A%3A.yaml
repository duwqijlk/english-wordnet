simpleMeaning: to deny yourself food, drink, and other things your body wants
scope: To hold back from what the body wants, not to make someone feel ashamed.
examples:
- The monks mortified themselves by fasting and sleeping on hard beds.
- She mortified her body by giving up rich food for a year.
