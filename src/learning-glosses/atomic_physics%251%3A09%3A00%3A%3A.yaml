simpleMeaning: the part of the study of matter and energy that looks at what is inside the small middle
  parts of atoms
scope: 'Also called nuclear physics or nucleonics: the study of what is inside the middle parts of atoms,
  not the study of whole atoms and not the study of how atoms join together.'
examples:
- She studied atomic physics to learn about the inside of atoms.
- Atomic physics looks at the tiny middle parts of atoms.
