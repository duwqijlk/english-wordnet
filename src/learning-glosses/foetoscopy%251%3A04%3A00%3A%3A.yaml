simpleMeaning: Before birth, the unborn baby in the womb can be looked at straight, and some of its blood
  can be taken, as a way of finding what is wrong.
scope: Also called fetoscopy, this names the way of looking straight at the unborn baby in the womb before
  birth and taking some of its blood.
examples:
- Foetoscopy showed the unborn baby clearly in the womb.
- The foetoscopy took a small amount of the baby's blood.
