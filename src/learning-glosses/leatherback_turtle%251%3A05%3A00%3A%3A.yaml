simpleMeaning: The biggest turtle alive, a far-roaming sea turtle whose shell is a bendable sheet of tough
  skin.
scope: Also called the leatherback and the leathery turtle, this far-roaming sea turtle is the biggest
  alive, its shell a bendable sheet of tough skin.
examples:
- A leatherback turtle swam in the open sea.
- Leatherback turtles roam far across the open sea.
