simpleMeaning: The act of making something follow set rules, as by writing out the rules that govern kinds
  of word strings.
scope: Making something follow set rules; formalisation is another name for this sense, not making something
  official by law and not a casual change.
examples:
- The formalization of the rules took months of hard work.
- His formalization of the grammar helped students learn it.
