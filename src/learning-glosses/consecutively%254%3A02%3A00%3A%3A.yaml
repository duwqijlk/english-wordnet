senseId: 'consecutively%4:02:00::'
synsetId: 00020597-r
simpleMeaning: One after another, in a row, with no break in between.
scope: Of being ill, then well, then ill again, or of rain falling day after day.
examples:
- He was consecutively ill, then well, then ill again.
- It rained consecutively for five days.
