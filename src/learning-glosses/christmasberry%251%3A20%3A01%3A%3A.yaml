simpleMeaning: A showy green treelike bush of the Pacific coast of the United States with large white
  flowers and red fruits like small berries; often put in the genus Photinia.
scope: 'Also called toyon, tollon, Christmas berry, Heteromeles arbutifolia, or Photinia arbutifolia:
  a showy green treelike bush of the Pacific coast of the United States, with large white flowers and
  red fruits like small berries, not the spiny bush of the south-east with blue or mauve flowers.'
examples:
- Christmasberries brightened the garden in winter.
- The Christmasberry had large white flowers.
