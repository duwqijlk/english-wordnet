senseId: 'vermiform_process%1:08:00::'
synsetId: 05545209-n
simpleMeaning: a small pouch-shaped part left over from an earlier time, joined to the lower end of the
  large gut and with no clear use
scope: 'Also called an appendix, a cecal appendage, and a vermiform appendix: a small pouch-shaped part
  at the end of the gut, not the gut itself and not a part that does useful work.'
examples:
- The vermiform process is a small pouch joined to the lower end of the gut.
- Surgeons sometimes take out the vermiform process when it becomes sore.
