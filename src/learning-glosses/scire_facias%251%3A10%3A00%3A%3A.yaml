simpleMeaning: In law, a court order based on a record, telling the person it is brought against to give
  a reason why that record should not be enforced or set aside
scope: A court order that makes the person it is brought against give a reason why the record should not
  be enforced or set aside; not a new trial and not a simple demand for payment.
examples:
- The lawyer asked the court for a scire facias to enforce the old judgment.
- A scire facias was sent to the company, asking why the record should not be set aside.
