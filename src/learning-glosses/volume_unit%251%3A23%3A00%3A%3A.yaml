synsetId: 13622065-n
simpleMeaning: a fixed amount used to measure how much space a thing takes up, or how much it can hold
scope: A fixed amount for measuring how much space a thing takes up or how much it can hold; capacity
  measure and capacity unit are other names for this sense, not a unit of weight and not a unit of length.
examples:
- A litre is a volume unit used in most countries.
- The recipe gave the volume unit in cups.
