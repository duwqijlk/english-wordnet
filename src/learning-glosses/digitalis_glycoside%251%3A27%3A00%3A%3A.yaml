simpleMeaning: a drug that makes the heart beat with more force, made from the foxglove plant
scope: A drug that makes the heart beat with more force, made from the foxglove plant, also called digitalin
  or digitalis, and not a drug that slows the heart.
examples:
- Digitalis glycoside helped her heart beat with more force.
- The nurse gave him digitalis glycoside after his heart grew weak.
