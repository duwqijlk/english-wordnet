simpleMeaning: a plan to make up for past unfair treatment of women and minority groups by giving them
  better chances in work and schooling
scope: A plan to make up for past unfair treatment of women and minority groups; not simply treating everyone
  the same, and not a law against unfair treatment.
examples:
- Affirmative action has been very controversial in the United States.
- The university adopted affirmative action to widen its intake.
