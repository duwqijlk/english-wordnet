simpleMeaning: Most steps between notes are whole tones, but the step after the second note and the step
  after the fifth are only half tones.
scope: Also called minor diatonic scale, it is the note pattern whose steps are whole tones except for
  the two half-tone steps, after the second and fifth notes.
examples:
- She played the minor scale slowly on the piano.
- The teacher asked us to write out the minor scale.
