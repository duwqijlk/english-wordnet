simpleMeaning: a strong Mexican drink made from the juices of an agave plant that have been left to turn
  into alcohol
scope: This is the strong drink from Mexico made from an agave plant, not other strong drinks made from
  grain or fruit.
examples:
- He ordered a small glass of tequila at the bar.
- She added a little tequila to the drink for the party.
