simpleMeaning: one of three numbers that fix where a thing is in space
scope: One of three numbers that fix where a thing is in space, not a size in one direction, not an idea
  by which things are told apart, and not the verbs that mark sizes on a thing or shape a thing to set
  sizes.
examples:
- Height is one dimension of the point in space.
- The three dimensions fix the spot exactly.
