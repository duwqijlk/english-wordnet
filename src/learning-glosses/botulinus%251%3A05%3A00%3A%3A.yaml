simpleMeaning: A tiny germ that grows where there is no air makes a poison that brings on an illness from
  food.
scope: Also called botulinum, this is a tiny germ that grows where there is no air, not a germ that needs
  air to live.
examples:
- Botulinus grows in food kept where no air can reach it.
- People fell ill from the poison that botulinus had made in their food.
