simpleMeaning: One of two flat parts joined to a cap to keep the ears warm
scope: This is one of a pair of flaps on a cap that cover the ears in cold weather, not the whole cap
  itself and not a part of the ear.
examples:
- He pulled down an earflap against the cold wind.
- Her winter cap has an earflap on each side.
