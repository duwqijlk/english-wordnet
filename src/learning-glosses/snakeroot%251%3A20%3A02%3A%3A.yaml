simpleMeaning: Its small flat flower heads grow in bunches along a stem, on one of many kinds of North
  American plant of the group Liatris
scope: It is also called blazing star, button snakeroot, gay-feather, and gayfeather, a North American
  plant whose small flat flower heads grow in bunches along a stem.
examples:
- Snakeroot grew in bunches by the path.
- The snakeroot heads were small and flat, in bunches along a stem.
