simpleMeaning: a story or report made up on purpose, that is not true or is hard to believe
scope: 'Also called fiction and fable: a made-up story or report that is not true, not a true account
  and not the act of making something.'
examples:
- His story about meeting the king was a complete fabrication.
- The newspaper found that the report was a fabrication and printed a correction.
