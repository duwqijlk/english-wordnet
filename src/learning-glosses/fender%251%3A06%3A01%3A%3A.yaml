simpleMeaning: A cover that goes round a vehicle's wheels to stop water and mud from splashing
scope: 'Wing is another name for this sense: a cover round a wheel that blocks splashed water and mud,
  not a shock-absorbing pad and not a fire guard.'
examples:
- Mud had caked the front fender after the drive down the lane.
- In Britain they call a car's fender a wing.
