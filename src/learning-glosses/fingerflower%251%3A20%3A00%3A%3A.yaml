simpleMeaning: A tall leafy European plant that lives two years or more and bears bunches of tube-shaped
  pink-purple blooms; its foliage provides the heart drug digitalis but poisons livestock.
scope: The European foxglove, the same poisonous plant that fairy bell and fingerroot name; not a bellflower
  or another plant with bell-shaped blooms.
examples:
- A clump of fingerflower lit the damp corner with pink-purple tubes.
- Never let livestock graze where fingerflower grows, because every leaf is toxic.
