senseId: 'thermionic_current%1:19:00::'
synsetId: 11539176-n
simpleMeaning: a flow of power between two metal parts, caused by tiny charged bits set free by heat
scope: A flow of power between two metal parts, not the heat-driven release of charged bits itself, and
  not an ordinary flow of power through a wire.
examples:
- The thermionic current grew stronger as the tube warmed up.
- They measured the thermionic current between the two electrodes in the old radio tube.
