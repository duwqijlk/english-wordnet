simpleMeaning: a sweet fruit from China with one seed, a thin shell that snaps apart, and soft flesh like
  jelly, often dried
scope: A sweet Chinese fruit with a thin shell and one seed, also called lychee, leechee, lichee, litchee,
  litchi, and litchi nut; not a grape and not a cherry.
examples:
- He cracked open a lichi and sucked the sweet flesh from the seed.
- Lichi trees grow in warm parts of China.
