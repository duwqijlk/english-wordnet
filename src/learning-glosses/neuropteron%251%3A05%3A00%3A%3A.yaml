simpleMeaning: Four big thin wings with fine lines like a net, and jaws that bite, mark this bug.
scope: Neuropteran and neuropterous insect are other names for this bug, whose four big thin wings are
  crossed by fine lines like a net and whose jaws bite.
examples:
- The neuropteron flew on its four big thin wings.
- The neuropteron bit with its jaws.
