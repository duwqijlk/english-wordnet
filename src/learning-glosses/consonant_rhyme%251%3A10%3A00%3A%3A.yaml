senseId: 'consonant_rhyme%1:10:00::'
synsetId: 07112214-n
simpleMeaning: the same mouth sounds, the ones that are not vowel sounds, said again and again, most of
  all at the ends of words
scope: 'Consonance is another name for this sense: the same mouth sounds said again, most of all at the
  ends of words, not a full match of word ends and not the same sounds at the starts of words.'
examples:
- The poem's consonant rhyme links 'tall' and 'tell' through their closing sounds.
- She likes the consonant rhyme in 'black' and 'book', where the last sounds match.
