simpleMeaning: An upland lizard of the south-west United States and Mexico, with long stripes overlaid
  with light spots.
scope: Also called Chihuahuan spotted whiptail, this is an upland lizard of the south-west, not the western
  whiptail of the dry lands farther west.
examples:
- The Cnemidophorus exsanguis suns itself on the rocks.
- Cnemidophorus exsanguis bears light spots over its stripes.
