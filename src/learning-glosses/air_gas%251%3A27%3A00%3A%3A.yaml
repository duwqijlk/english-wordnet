simpleMeaning: Driving the stuff we breathe over hot coke gives a mix of carbon monoxide, hydrogen, and
  nitrogen.
scope: Producer gas is the other name for the mix of carbon monoxide, hydrogen, and nitrogen that comes
  from hot coke.
examples:
- Workers made air gas by passing air over hot coke.
- The air gas that came off the hot coke held carbon monoxide, hydrogen, and nitrogen.
