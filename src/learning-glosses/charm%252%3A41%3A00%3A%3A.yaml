simpleMeaning: to control someone or something by magic, by saying special words believed to have magic
  power
scope: This is controlling a person or thing with magic, not keeping someone safe by magic and not winning
  someone over by being pleasing and friendly.
examples:
- In the story, the witch charmed the river to stop flowing.
- He claimed he could charm wild animals by singing magic words.
