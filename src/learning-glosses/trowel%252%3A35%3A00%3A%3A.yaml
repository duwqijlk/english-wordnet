senseId: 'trowel%2:35:00::'
synsetId: 01315773-v
simpleMeaning: to use a small hand tool with a handle and a flat metal blade on something, for light garden
  work or plaster work
scope: This is the act of using the tool on something, for light garden or plaster work; it is not the
  tool itself, which is the noun sense.
examples:
- He troweled the soil flat around the young plants.
- She troweled a thin coat of plaster onto the wall.
