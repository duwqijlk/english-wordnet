simpleMeaning: A grammar word used with a noun, a pronoun or a noun group; together they make a phrase
  that can add detail to an action or describe another word
scope: This is a grammar word such as in or on, not the act in language study of putting one part of language
  before another.
examples:
- In the sentence 'The cat is on the mat', 'on' is a preposition.
- The teacher asked us to find the preposition in each sentence.
