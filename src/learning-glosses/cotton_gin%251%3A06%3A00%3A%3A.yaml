simpleMeaning: A machine that pulls the seeds out of raw plant fibres
scope: This is a machine that pulls seeds out of raw plant fibres; gin is another name for it; not a loom,
  which weaves cloth, and not a press, which squeezes things flat.
examples:
- The cotton gin made it much quicker to clean raw cotton.
- Eli Whitney built the first cotton gin in 1793.
