simpleMeaning: A kind of word form used chiefly, but not only, for females and for things counted as female.
scope: A kind of word form used chiefly for females, not a way of looking or acting like a woman and not
  a word ending in music or verse.
examples:
- In French, the word for table is feminine.
- The feminine form of the word ends in a different way.
