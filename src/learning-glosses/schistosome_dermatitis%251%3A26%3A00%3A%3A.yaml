simpleMeaning: a skin reaction after tiny worms get into the skin again and again
scope: A skin reaction after tiny worms get into the skin again and again; also called swimmer's itch.
  Not a sunburn and not a skin rash from soap.
examples:
- He got schistosome dermatitis after swimming in the lake again.
- Schistosome dermatitis made her skin red and itchy.
