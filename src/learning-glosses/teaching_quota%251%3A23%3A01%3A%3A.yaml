synsetId: 92414965-n
simpleMeaning: the smallest number of lessons a member of staff must give, as set out in their work agreement
scope: The smallest number of lessons a member of staff must give under their work agreement; not the
  most they may give, and not a limit on pupils.
examples:
- Her teaching quota is twelve lessons a week.
- The teaching quota in his contract rose this year.
