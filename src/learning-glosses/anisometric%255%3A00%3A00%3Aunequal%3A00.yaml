simpleMeaning: with parts that do not match in shape or with sides that are not the same length
scope: Said of a thing whose parts or measures do not match, not of a thing with matching parts and not
  of a thing that is simply big.
examples:
- The anisometric crystal had one face longer than the others.
- An anisometric design looks uneven because its parts do not match.
