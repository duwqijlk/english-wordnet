simpleMeaning: an African lemur with big eyes and ears and thick soft fur, quick and long-tailed, that
  comes out only at night
scope: An African lemur with big eyes and ears that comes out only at night, not a day animal and not
  a slow one; bush baby and galago are other names for this sense.
examples:
- The bushbaby slept all day and woke at dusk.
- We saw a bushbaby with big eyes in the tree.
