simpleMeaning: A doll with a hollow head shaped like a person or animal and a cloth body, worn on the
  hand and moved by fingers
scope: A hand doll with a cloth body, not a string puppet and not a person used by others.
examples:
- The child played with a puppet on her hand.
- He made the puppet nod and wave.
