simpleMeaning: A sickness of wheat in which greasy lumps of bad-smelling spores take the place of the
  grains.
scope: Also called bunt, it is a sickness of wheat in which the grains give way to greasy lumps of bad-smelling
  spores.
examples:
- Stinking smut turned the wheat grains into greasy lumps.
- The farmer burned the wheat hit by stinking smut.
