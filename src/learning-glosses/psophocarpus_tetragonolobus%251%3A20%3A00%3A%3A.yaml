simpleMeaning: A climbing vine that lives one year, with thick underground stems, bearing groups of purple
  flowers and pods with four rough-edged wings, from the tropics of the Old World.
scope: Also called goa bean, goa bean vine, winged bean, winged pea and Manila bean; a climbing vine of
  the tropics of the Old World with thick underground stems, purple flowers and pods with four rough-edged
  wings.
examples:
- Psophocarpus tetragonolobus climbed the fence, its purple flowers bright in the sun.
- We ate the winged pods of Psophocarpus tetragonolobus in the soup.
