simpleMeaning: A piece of paper, cardboard, or plastic fixed to a thing, with words written or printed
  on it to show its owner, what it is, its price, and more
scope: 'Also called a ticket: a label fixed to a thing, not the act of fixing a label to something and
  not adding rhymes to writing.'
examples:
- The price tag on the shirt said ten dollars.
- She wrote her name on the tag tied to her bag.
