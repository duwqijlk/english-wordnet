simpleMeaning: The first day of the week nearest the eleventh of November is when people remember those
  who died in the first World War and the second World War.
scope: 'Also called Poppy Day and Remembrance Day: the first day of the week nearest the eleventh of November
  when people remember those who died in the first World War and the second World War, not an ordinary
  Sunday of rest.'
examples:
- Remembrance Sunday is the first day of the week nearest the eleventh of November.
- On Remembrance Sunday, people remember those who died in the first World War and the second World War.
