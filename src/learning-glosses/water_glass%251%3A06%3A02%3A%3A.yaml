simpleMeaning: a timekeeper that marks time by the escape of water
scope: A timekeeper that marks time by the escape of water; water clock is another name for this sense,
  and it is not a sand timekeeper, not a cup for drinking, and not a gauge.
examples:
- The old water glass in the tower dripped through the night.
- He read the hour from a water glass.
