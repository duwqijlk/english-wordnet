simpleMeaning: The practice of having sex in a casual way, with little care in choosing the other person
scope: This means having sex in a casual way, with little care in choosing the other person; it is not
  sex with one chosen partner in a close, lasting relationship.
examples:
- His promiscuity worried his friends, as he moved from one partner to the next.
- She saw her promiscuity in her younger years as careless and empty.
