simpleMeaning: Body cells hold these chromosomes in pairs, while sperm hold only one of each — and none
  of them is a sex chromosome.
scope: This is a chromosome other than a sex chromosome, also called a somatic chromosome, that comes
  in pairs in body cells and singly in sperm.
examples:
- Each autosome appears in pairs in body cells.
- The autosome carried no genes for sex.
