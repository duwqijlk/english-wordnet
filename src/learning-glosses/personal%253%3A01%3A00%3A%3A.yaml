simpleMeaning: showing who is speaking, who is spoken to, or who is spoken about in a sentence.
scope: Not about private life and not about someone's character; here it is the grammar term for words
  that show which person a sentence is about.
examples:
- Words like 'I', 'you' and 'they' are called personal pronouns.
- The exercise asks you to choose the correct personal pronoun.
