simpleMeaning: a firm promise to do something, give something, or hold back from doing something
scope: A firm promise to do, give, or hold back from something, also called a pledge, not a feeling of
  confidence and not a kind of insurance.
examples:
- He gave an assurance of help when needed.
- She signed an assurance never to reveal the secret.
