simpleMeaning: an order given by an emperor that becomes part of the basic law of the country
scope: This is an order by an emperor that becomes part of a country's basic law. It is not the describing
  word for being led by real experience, and not the word about pragmatism, a way of thinking.
examples:
- The pragmatic issued by the emperor became part of the country's basic law.
- Under this pragmatic, the new rule could not be changed by later rulers.
