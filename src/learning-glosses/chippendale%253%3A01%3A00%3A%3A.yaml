simpleMeaning: Of an 18th-century style of furniture made by its namesake maker, with fine flowing lines,
  Greek patterns, and large rich carvings in the rococo style.
scope: It names an 18th-century style of furniture with fine flowing lines, Greek patterns, and large
  rich rococo carvings, not the maker himself.
examples:
- The Chippendale chair has fine flowing lines.
- She bought a Chippendale table at the sale.
