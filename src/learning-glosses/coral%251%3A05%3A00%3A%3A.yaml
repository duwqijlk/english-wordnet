simpleMeaning: a sea animal that lives joined to many like it and has a hard stone-like frame; groups
  grow in many shapes and often form reefs (hard masses under the sea)
scope: This is the living sea animal that grows in groups in the sea; it is not the eggs of a lobster,
  not the hard frame by itself used to make jewelry, and not a deep pink colour.
examples:
- Small coral animals live together and build large shapes in the sea.
- Divers swam over coral that had grown into tall shapes like trees.
