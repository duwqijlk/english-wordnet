simpleMeaning: to swim with your face down, moving your arms out in front of you and out to the sides
  while you kick with your legs
scope: To swim in this way, not the name of the swimming way itself and not another way of swimming, such
  as swimming on your back.
examples:
- He learned to breaststroke across the pool with his face in the water.
- The children breaststroked slowly, pushing their arms out and kicking.
