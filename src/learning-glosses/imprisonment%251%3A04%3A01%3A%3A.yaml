simpleMeaning: the law's way of punishing someone by shutting them away in a prison or a jail
scope: The law's way of punishing someone by shutting them away in a prison or a jail; not the state of
  being in prison, and not locking someone up without the law behind it.
examples:
- The judge ordered his imprisonment for five years.
- Imprisonment was the punishment for the crime.
