simpleMeaning: Turned by thumb and first finger, this small piece has a screw thread and flat parts that
  stick out like wings.
scope: Thumbnut, wing-nut, wing nut, and wing screw are other names for this small piece with a screw
  thread and flat parts that stick out like wings.
examples:
- He turned the butterfly nut with his thumb and forefinger.
- She loosened the butterfly nut by hand.
