simpleMeaning: A law body of the Treasury Department that sets and carries out rules to spot the washing
  of crime money
scope: 'Also called the Financial Crimes Enforcement Network: a law body of the Treasury Department that
  sets rules to spot the washing of crime money, unlike other law bodies that chase street crime or collect
  taxes.'
examples:
- FinCEN tracks money laundering.
- Banks report suspect deals to FinCEN.
