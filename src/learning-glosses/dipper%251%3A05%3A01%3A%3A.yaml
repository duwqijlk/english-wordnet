scope: 'Also called butterball and bufflehead: this is the small diving duck, not the small diving bird
  without webbed feet that lives by fast streams.'
examples:
- The male dipper, a small duck, has thick bushy feathers on its head.
- We watched a dipper duck dive under the water of the lake.
