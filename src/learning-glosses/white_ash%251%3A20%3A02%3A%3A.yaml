simpleMeaning: smooth pale bark that peels away in patches and strips covers a small to medium tree of
  Australia and Tasmania
scope: 'Another name for ghost gum and snow gum: a small to medium tree of Australia and Tasmania with
  smooth pale bark that peels off, not the American ash tree of the same name.'
examples:
- The white ash outside the house sheds strips of pale bark every summer.
- White ash grows wild across Tasmania and the dry parts of Australia.
