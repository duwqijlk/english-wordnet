simpleMeaning: things a person owns that can be touched and carried from place to place, such as furniture,
  animals kept by people, or a car, and not land or buildings
scope: 'Also called chattel and personal chattel: things a person owns that can be carried away, not land
  or a building that stays in one place.'
examples:
- In law, a car counts as a movable, unlike a house.
- The court listed the furniture and other movables she owned.
