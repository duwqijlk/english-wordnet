simpleMeaning: The Roman Catholic belief that God protects the pope from error when he speaks about faith
  or morality.
scope: The Roman Catholic teaching that God guards the pope from error when he speaks on faith or morals,
  not a claim that the pope never errs in daily life.
examples:
- Papal infallibility applies only when the pope speaks on faith or morals.
- Catholics who accept papal infallibility believe God guards the pope from error in such teaching.
