scope: A shrub-like evergreen tree of Tasmania with long thin leaves that narrow to a point, also called
  grass tree and tree heath, not a tree that loses its leaves in winter.
examples:
- Richea pandanifolia grows in Tasmania.
- The Richea pandanifolia leaves are three feet long.
