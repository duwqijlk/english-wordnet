simpleMeaning: A broad name for many 19th-century building styles that revived classicizing old Italian
  forms, neither Greek nor Gothic in style.
scope: Also called Renaissance revival; a broad name for 19th-century building styles that revived classicizing
  old Italian forms, not a single style and not a Gothic revival.
examples:
- By the 1870s, collectors across Europe were excited by the neo-Renaissance.
- The neo-Renaissance drew on many old Italian styles, not Greek or Gothic ones.
