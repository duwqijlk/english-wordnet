simpleMeaning: the scar left on the skin after a substance that protects against a disease is put into
  the body
scope: The scar left on the skin after the substance that protects against a disease is put in, not the
  act of taking that substance in.
examples:
- You can still see the vaccination mark on her upper arm.
- His vaccination left a small round scar on his skin.
