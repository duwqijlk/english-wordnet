simpleMeaning: For people to watch and hear, this person performs a play or a piece of music
scope: 'Also called a performer: a person who puts on a play or music for people watching, not a person
  who makes things for show and not a person who writes plays.'
examples:
- The performing artist sang and danced for a full house.
- Every performing artist in the show took a bow at the end.
