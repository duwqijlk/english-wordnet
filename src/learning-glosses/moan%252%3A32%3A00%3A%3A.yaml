simpleMeaning: to make a sound that shows pain, hurt in the body, or dislike
scope: To make a sound that shows pain or dislike, also called groan, not the sound itself as a thing.
examples:
- The old man moaned when he tried to stand up.
- The door moaned when she pushed it open.
