simpleMeaning: One of a few kinds of grown sweet fruit, juicy and heart-shaped.
scope: One of a few kinds of grown sweet fruit; heart cherry and oxheart are other names for this sense,
  not a sour fruit and not a wild fruit.
examples:
- The oxheart cherry tree bore sweet, juicy fruit.
- She ate an oxheart cherry straight from the tree.
