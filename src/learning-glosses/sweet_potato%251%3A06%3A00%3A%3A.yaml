simpleMeaning: With holes for the fingers and a mouthpiece to blow through, this egg-like piece of baked
  clay makes music.
scope: An ocarina is another name for this egg-like piece of baked clay, not the root people eat.
examples:
- A tune rang out from the sweet potato at the fair.
- Blowing into the sweet potato, the player covered one hole with a finger.
