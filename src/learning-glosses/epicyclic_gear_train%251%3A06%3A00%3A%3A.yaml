simpleMeaning: A set of toothed wheels in which at least one wheel axle itself turns round another fixed
  axle
scope: This is a set of toothed wheels in which at least one wheel axle itself turns round another fixed
  axle; epicyclic train is another name for it, not a set of wheels on fixed axles and not a belt drive.
examples:
- The epicyclic gear train turned its wheel axle round a fixed axle.
- In the epicyclic gear train, one wheel axle turns round another.
