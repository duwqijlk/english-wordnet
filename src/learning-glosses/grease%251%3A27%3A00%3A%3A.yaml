simpleMeaning: a thick oil from fat, especially one put on machine parts to help them move freely
scope: This is the thick oil itself, not the act of putting oil on a machine part.
examples:
- He put grease on the bike chain to help it move well.
- The machine needs fresh grease on its moving parts.
