simpleMeaning: having a sexual identity that is not clear
scope: 'Also called epicene: this means having a sexual identity that is not clear, not feeling attraction
  to both men and women and not the noun for a person who feels that attraction.'
examples:
- The model's bisexual appearance made it hard to tell if the model was a man or a woman.
- Her bisexual look was neither clearly male nor clearly female.
