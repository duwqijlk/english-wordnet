simpleMeaning: A second list that opens beside the main list when you rest the pointer on one of its items.
scope: A second list that opens from a main list, not the main list itself; also called a cascading menu.
examples:
- Move the pointer over the item and a hierarchical menu will open beside it.
- I picked the colour from the hierarchical menu that appeared.
