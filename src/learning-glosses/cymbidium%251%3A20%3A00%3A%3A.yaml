simpleMeaning: A kind of orchid with narrow leaves and a long, drooping stem carrying many brightly colored,
  boat-shaped blooms, much bred and kept as a houseplant and sold by florists.
scope: This is the orchid with narrow leaves and long sprays of boat-shaped blooms, the same plant also
  called cymbid; not other orchids grown as houseplants.
examples:
- The cymbidium on the windowsill produced a cascade of yellow flowers.
- Growers breed cymbidiums for bigger, brighter blooms.
