simpleMeaning: on plants of open land and woods, seed heads bend in a gentle curve, with long stiff hairs
  under each small head
scope: 'Also called bristle grass: a plant of open land and woods whose big seed heads curve gently and
  carry long stiff hairs, not a grain crop and not a single garden plant.'
examples:
- Bristlegrass bends in the wind, its seed heads arching over the path.
- In the woods we found bristlegrass with long stiff hairs under each seed head.
