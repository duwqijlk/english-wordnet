simpleMeaning: the low-fat meat of a fish like cod that lives in the North Atlantic
scope: The low-fat meat of a fish like cod that lives in the North Atlantic; not the fish itself and not
  the meat of a fish from other waters.
examples:
- The cusk on the menu came from North Atlantic waters.
- They served cusk with butter and lemon.
