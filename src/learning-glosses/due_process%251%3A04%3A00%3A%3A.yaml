simpleMeaning: Life, freedom, or goods may be taken only by steps that follow set rules and give the safeguards
  those rules lay down
scope: Due process of law is another name for these fair court steps that guard life, freedom, and goods.
examples:
- The court said the man had a right to due process before any fine was set.
- Due process means the state cannot take her land without a fair hearing first.
