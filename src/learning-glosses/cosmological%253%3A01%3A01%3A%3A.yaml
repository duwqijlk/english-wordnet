simpleMeaning: Used of the branch of thought and its work on the elements and laws of the universe, above
  all space, time and cause
scope: This word is used of the branch of thought that looks at the stuff and laws of the universe, above
  all space, time and cause; cosmologic is another name for this sense, not of the branch of star study
  about how the universe began.
examples:
- A cosmological argument says the universe needs a cause outside itself.
- Her cosmological ideas dealt with space, time and cause.
