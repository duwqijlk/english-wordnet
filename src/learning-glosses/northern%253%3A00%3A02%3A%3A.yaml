simpleMeaning: in or typical of the part of the United States above the old Mason-Dixon border line, roughly
  speaking.
scope: This describes the upper part of the United States, not something that faces north or comes from
  the north.
examples:
- She has a strong northern accent.
- The northern states banned slavery earlier than the southern states.
