simpleMeaning: to hold something firm with a metal strip that has ends bent to make square corners
scope: To hold something firm with a metal strip. It is not a sudden pain when a muscle gets tight, and
  it is not the metal strip itself.
examples:
- He cramped the two pieces of wood together to hold them firm.
- The worker cramped the stones while the wall was built.
