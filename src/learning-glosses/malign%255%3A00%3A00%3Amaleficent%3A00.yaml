simpleMeaning: having a bad, harmful power over people or things, or putting that power to work
scope: About something that has a harmful power and works against people or things; not the verb sense
  of malign, which means saying bad and untrue things about a person.
examples:
- A malign power seemed to hang over the old house.
- They blamed the long run of bad luck on some malign force.
