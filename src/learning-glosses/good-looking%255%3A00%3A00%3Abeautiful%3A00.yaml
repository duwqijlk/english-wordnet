simpleMeaning: Above all, a person or thing is nice to see when the shape and size of its parts are what
  people think is right
scope: 'Also called handsome, better-looking, fine-looking and on fleek: a person or thing that is nice
  to see, not merely clean or neat and not only well dressed.'
examples:
- He is a good-looking man with a warm smile.
- The good-looking house stood out on the street.
