simpleMeaning: strong, angry words that hurt, used to blame someone or to show deep, long-held hate
scope: This is angry words that blame and show hate, also called vitriol and vituperation; it is not calm
  blame or a fair talk about faults.
examples:
- He shouted invective at the man who had cheated him.
- Her speech was full of invective against the leaders.
