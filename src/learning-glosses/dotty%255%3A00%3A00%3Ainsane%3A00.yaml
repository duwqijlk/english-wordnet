simpleMeaning: in informal or slang talk, describes a person whose mind does not work in a normal way
scope: Also called cracked, nuts, buggy, bats, crackers, daft, nutty, loopy, fruity, balmy, batty, wacky,
  bonkers, haywire, loony, barmy, loco and kooky. This is an informal word for a mind that does not work
  in a normal way, not for being very keen on something.
examples:
- People said the old man was a bit dotty, as he kept talking to people who were not there.
- She went a little dotty after weeks with no sleep.
