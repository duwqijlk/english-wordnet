simpleMeaning: the feeling of waiting for something and being sure that it will happen
scope: 'Also called expectation: this is the sure feeling you have while you wait for something to happen,
  not just hoping for it with no sure feeling.'
examples:
- She waited in anticipation, sure the letter would bring good news.
- His anticipation grew as the day of the results came near, and he felt sure he had passed.
