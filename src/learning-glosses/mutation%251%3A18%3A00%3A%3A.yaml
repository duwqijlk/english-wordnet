simpleMeaning: In biology, a living thing with new traits because the gene-carrying parts of its cells
  have changed
scope: 'Also called a sport and a variation: in biology, a living thing whose traits come from a change
  in its chromosomes, not the change itself.'
examples:
- The white flower was a mutation of the common red kind.
- Scientists studied the mutation to see how its traits had changed.
