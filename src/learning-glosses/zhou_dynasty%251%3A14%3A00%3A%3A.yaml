simpleMeaning: The imperial ruling house of China from 1122 to 221 BC, known for the rise of Confucianism
  and Taoism.
scope: The ruling house of China from 1122 to 221 BC, also called Chow, Chou, Chou dynasty, Chow dynasty
  and Zhou; it is known for the rise of Confucianism and Taoism, which sets it apart from other ruling
  houses of China.
examples:
- The Zhou dynasty lasted from 1122 to 221 BC.
- Taoism rose to note under the Zhou dynasty.
