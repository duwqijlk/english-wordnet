simpleMeaning: Said of art, showing shapes and colours that do not copy real things or the world outside.
scope: Art that does not copy real things or nature, not art about ideas without practical use and not
  a short summary.
examples:
- She hung a large abstract painting on the wall.
- His abstract work uses bold shapes and bright colours.
