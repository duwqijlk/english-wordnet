simpleMeaning: light given off when the tiny parts of things join or split, as in the glow of a firefly
scope: Light given off when the tiny parts of things join or split, not light from a hot bulb and not
  light from the sun.
examples:
- Chemiluminescence makes the firefly glow at night.
- The chemiluminescence of the plankton lit the waves.
