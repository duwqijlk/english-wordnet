simpleMeaning: The act of putting a thing on its own, away from other things.
scope: The act of putting a thing on its own, away from other things, not the mind's way of cutting off
  feeling from a memory.
examples:
- The isolation of the village made life hard in winter.
- Isolation of the sick child kept the illness from spreading.
