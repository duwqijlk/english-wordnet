simpleMeaning: A Japanese wall hanging of paper or silk, usually narrow, with a picture or writing on
  it and a roller at the bottom.
scope: A Japanese wall hanging of paper or silk, usually narrow, not a framed picture and not a floor
  mat.
examples:
- A kakemono hung in the alcove.
- The kakemono showed a mountain in ink.
