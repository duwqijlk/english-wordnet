schema: oewn-learning-gloss-v2
senseId: 'pretentiousness%1:07:01::'
synsetId: 04825154-n
simpleMeaning: A lack of good taste that comes from acting proud and puffed up with your own worth
scope: Also called inflation, puffiness, ostentation, ostentatiousness, pomposity, pompousness, and splashiness,
  this is a lack of good taste in what a proud, showy person says or does, not the quality of acting to
  seem more important than you are.
examples:
- The pretentiousness of the long speech made it lose all grace.
- His pretentiousness took the charm out of an otherwise plain and kind act.
