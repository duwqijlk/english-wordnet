senseId: 'close_supporting_fire%1:04:00::'
synsetId: 00990782-n
simpleMeaning: shots aimed at enemy troops, arms, or spots near a friendly unit that are its worst and
  nearest danger
scope: Shots aimed at the nearest and worst danger to a friendly unit, not shots aimed far away and not
  fire from the unit itself.
examples:
- Close supporting fire kept the enemy back while our troops moved forward.
- The close supporting fire struck the guns that threatened the unit most.
