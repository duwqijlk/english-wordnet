simpleMeaning: Bad breathing sicknesses, such as bronchiolitis and bronchial pneumonia, come above all
  in children from a germ that joins cells into clumps in a lab dish.
scope: This is a germ that joins cells into clumps and causes bad breathing sicknesses, above all in children.
examples:
- Respiratory syncytial virus can cause bad breathing sickness in small children.
- The baby caught respiratory syncytial virus and had trouble breathing.
