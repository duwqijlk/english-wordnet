simpleMeaning: In one place the skin can grow thicker than it should, though the change stays harmless;
  the spiny middle layer is the part that thickens, as in psoriasis.
scope: This thickening of the skin's spiny middle layer is harmless, and it is the kind seen in psoriasis.
examples:
- The acanthosis made one patch of skin thicker than the skin around it.
- One thick patch on the arm was acanthosis.
