simpleMeaning: A tree that grows wild or is grown by people through southern Europe, northwestern Africa
  and southwestern Asia.
scope: This is a tree grown wild or by people across southern Europe, northwestern Africa and southwestern
  Asia, not a horse chestnut and not an oak.
examples:
- The sweet chestnut grew wild on the hillside.
- Farmers planted sweet chestnut trees across the valley.
