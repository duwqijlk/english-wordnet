simpleMeaning: a work of art made by pressing soft material into a form, or pouring it in, so that it
  takes the shape of the form
scope: This is a finished shaped work of art; it is not a thin strip used to finish an edge, and not an
  early model in wax or clay used to copy a later work.
examples:
- The museum showed a molding of a horse made from clay.
- This molding was made by pressing wet clay into a wooden form.
