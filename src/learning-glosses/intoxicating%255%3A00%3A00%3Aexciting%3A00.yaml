simpleMeaning: very exciting, like the strong feeling that a strong drink or a drug can give a person
scope: Also called heady. This means very exciting in a strong way, not a drink or drug that makes a person
  drunk.
examples:
- The music had an intoxicating beat, and the crowd could not stop dancing.
- She felt an intoxicating joy when she won the race.
