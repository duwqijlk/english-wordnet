simpleMeaning: Prized for frying in a pan, this food fish lives in the Atlantic coastal waters of North
  America, from South Carolina to Maine.
scope: Also called northern porgy and northern scup, it is a food fish of the Atlantic coast, prized for
  frying in a pan.
examples:
- They fried the scup in a pan and ate it.
- We saw scup in the waters off the coast of Maine.
