simpleMeaning: A cone-shaped tool once used to send sound into the ear of a person who could not hear
  well.
scope: A cone-shaped tool once used to send sound into the ear of a person who could not hear well, also
  called ear trumpet; not a modern electronic device worn in the ear and not a horn for calling.
examples:
- The old man held a hearing aid shaped like a cone to his ear.
- Before small electronic devices, a hearing aid was a cone held to the ear.
