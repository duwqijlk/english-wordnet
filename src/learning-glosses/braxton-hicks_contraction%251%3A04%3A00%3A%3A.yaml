simpleMeaning: Tightenings of the womb's muscles that do not hurt, that go on through the whole time a
  woman is with child, and come more and more often
scope: Tightenings of the womb's muscles that do not hurt and come more and more often through pregnancy,
  also called false labor; not true labor pains and not pains of illness.
examples:
- Braxton-Hicks contractions do not hurt.
- Braxton-Hicks contractions come more and more often as pregnancy goes on.
