simpleMeaning: Grown for grain in Africa and Asia, and mostly for animal feed in the United States, this
  tall grass is sometimes made into beer; its spikes look like a cattail.
scope: 'Also called bulrush millet and cattail millet: a tall grass grown for grain in Africa and Asia
  and for animal feed in the United States, not a grass grown for beer alone.'
examples:
- Farmers in Africa grow pearl millet for its grain.
- In the United States, pearl millet is mostly grown to feed farm animals.
