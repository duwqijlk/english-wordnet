simpleMeaning: to find or learn something that was not known before.
scope: This is the sense of turning up something previously unknown, also expressed with find; it is not
  seeing something for the first time, noticing that something exists, or identifying a living thing.
examples:
- Roentgen discovered X-rays in 1895.
- Scientists have discovered a new way to store solar energy.
