simpleMeaning: to put people or things under strict rules, with everything set out in a fixed order
scope: To bring people or things under strict, fixed order, not an army unit, and not the act of forming
  soldiers into such a unit.
examples:
- They regiment their children with strict rules for every hour of the day.
- The camp tried to regiment every part of the prisoners' lives.
