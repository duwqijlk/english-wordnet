simpleMeaning: to build a flat place by the water, where ships can load and unload, for a place that did
  not have one
scope: Building a flat place by the water for ships to stop at; not keeping goods on one, not tying a
  ship to one, and not taking goods off a ship there.
examples:
- They wharfed the mouth of the river.
- The town wharfed its small harbor so that bigger ships could come in.
