simpleMeaning: made much bigger than it should be, especially by fluid or gas inside
scope: 'Also called swollen, puffy, bloated, turgid, tumescent and tumid: made too big, especially by
  fluid or gas. It is not about being big in a normal, healthy way.'
examples:
- His distended stomach showed he was very ill.
- The child's distended belly was full of gas.
