senseId: 'recognisance%1:21:00::'
synsetId: 13371458-n
simpleMeaning: In law, a pledge made in court to do an act the law asks for, with a sum lost if one fails
scope: In law, a pledge made in court to do a set act, also called recognizance; not a fine paid at once
  and not a free promise with no sum at stake.
examples:
- He was freed on recognisance until the trial.
- The court set her recognisance at a large sum.
