senseId: 'branch%2:30:00::'
synsetId: 00329612-v
simpleMeaning: Split into two or more arms that spread out from one point, the way a road does.
scope: A road, path, or line splitting into arms; separate is another name for this sense, and the rivals
  are a plant growing new stems and a division of an organization.
examples:
- The road branches just past the old mill.
- The main trail branches in two at the top of the ridge.
