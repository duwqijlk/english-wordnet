simpleMeaning: The ways, habits, and manners that mark the peoples of Asia
scope: Asian ways and manners, not a theory of life and not a set of rules for thought.
examples:
- Orientalism shows in the music and the dress of the play.
- The opera was full of orientalism, from its tunes to its stage sets.
