simpleMeaning: Often after rays or drug treatment, one kind of white blood cell falls sharply in this
  blood sickness that comes on fast.
scope: 'Also called agranulocytosis or granulocytopenia: a blood sickness that comes on fast with a sharp
  fall in one kind of white blood cell, not a sickness of the red cells.'
examples:
- Agranulosis followed the course of drug treatment.
- Agranulosis means one kind of white blood cell has fallen to very low numbers.
