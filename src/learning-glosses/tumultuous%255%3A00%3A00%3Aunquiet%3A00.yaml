simpleMeaning: full of trouble and lack of order, with people refusing to obey those in charge
scope: 'Also called troubled, turbulent, disruptive, and riotous: describes a time or place full of trouble
  and lack of order, not a calm and quiet one.'
examples:
- The country went through tumultuous years when people often fought the leaders.
- He grew up in a tumultuous time of protests and change.
