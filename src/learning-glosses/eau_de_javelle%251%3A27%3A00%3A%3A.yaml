simpleMeaning: Water with a salt in it that cleans and takes the colour out of things.
scope: A water with a cleaning salt in it; Javel water and Javelle water are other names for this sense,
  not plain water and not soap.
examples:
- She used eau de Javelle to whiten the old sheets.
- A bottle of eau de Javelle stood on the shelf by the sink.
