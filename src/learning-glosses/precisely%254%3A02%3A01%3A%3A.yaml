simpleMeaning: in a way that is exact and careful
scope: This says how a thing is done or said, in an exact and careful way, not the use of the word just
  to stress that a fact is exact.
examples:
- She cut the paper precisely along the thin black line.
- He placed each tool precisely in its own place on the shelf.
