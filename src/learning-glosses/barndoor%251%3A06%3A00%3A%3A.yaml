simpleMeaning: Photographers move this flap on a lamp to shut light off some parts of a scene, since light
  cannot pass through it.
scope: This is the flap on a lamp that photographers move to shut light off some parts of a scene.
examples:
- The photographer moved the barndoor to cut the light off the wall.
- A barndoor on the lamp kept the light off the backdrop.
