simpleMeaning: A five-needle cone tree with pale wood and smooth bark, most often light grey when young;
  above all the kind from the east
scope: A five-needle cone tree with pale wood; not a dark-wood cone tree and not a broad-leaf tree.
examples:
- The white pine by the lake is over a hundred years old.
- White pine wood is soft and easy to cut.
