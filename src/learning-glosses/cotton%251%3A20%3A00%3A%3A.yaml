simpleMeaning: a straight mallow plant (a plant with soft leaves) that grows thick with branches, or a
  small tree, with round cases that hold seeds and many long thin hairs
scope: This is the plant itself, not the cloth made from its soft hairs, not those hairs on their own,
  and not thread made from them.
examples:
