simpleMeaning: Leaves pale green or shiny silver beneath mark this wide-spreading tree of America, whose
  wood is hard and brownish.
scope: A wide-spreading tree of America, it is told from the small tree of Australia and Tasmania with
  smooth white bark by its pale green or shiny silver leaves beneath.
examples:
- Leaves pale green beneath marked the white ash.
- Builders used white ash for its hard brownish wood.
