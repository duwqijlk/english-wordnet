simpleMeaning: A rope knot in the shape of the number 8, made after the rope has gone through a hole or
  a pulley, which stops the rope from slipping free.
scope: This knot, also called figure eight, is shaped like the number 8 and stops a rope from slipping
  free.
examples:
- He tied a figure of eight to stop the rope slipping.
- A figure of eight held the rope fast.
