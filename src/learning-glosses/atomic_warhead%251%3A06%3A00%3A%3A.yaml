simpleMeaning: The front part of a missile made to carry a bomb that splits the smallest bits of matter
scope: This is the front part of a missile made to carry a bomb that splits the smallest bits of matter;
  nuke and nuclear warhead are other names for it, not an ordinary explosive front part and not the missile
  itself.
examples:
- The atomic warhead sits at the front of the missile.
- That missile carries an atomic warhead designed to deliver a bomb.
