simpleMeaning: A stinkhorn with a stalk and no cap, whose slimy spore mass is spread flat on its top,
  where winged bugs can find it.
scope: This is a stalk fungus, not a capped mushroom; also called dog stinkhorn.
examples:
- Mutinus caninus has a stalk but no cap.
- Winged bugs find the Mutinus caninus by its slimy top.
