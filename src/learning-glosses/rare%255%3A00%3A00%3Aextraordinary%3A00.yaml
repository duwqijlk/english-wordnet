simpleMeaning: Having a quality that is unusually high or extreme for its kind.
scope: An unusually high or extreme quality in something, not something that merely happens seldom and
  not something hard to find.
examples:
- She has a rare talent for putting nervous guests at ease.
- The old violin had a rare beauty that silenced the room.
