simpleMeaning: beaten eggs or a beaten egg mix cooked until just firm; they may be folded around food
  such as ham, cheese or jelly
scope: Also called omelet, this is beaten eggs cooked until just firm, not scrambled eggs in loose pieces
  and not a plain fried egg.
examples:
- For breakfast she made a cheese omelette.
- He folded the omelette around ham and served it hot.
