simpleMeaning: a light sweet food made by beating egg whites or cream stiff with sugar, usually with fruit
  in it
scope: A sweet dish of beaten egg whites or cream, not a blow with a lash and not the tool used for beating.
examples:
- She served a lemon whip for dessert.
- The whip was light and sweet after the main course.
