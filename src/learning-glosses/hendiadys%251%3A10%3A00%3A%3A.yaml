simpleMeaning: saying one thing with two nouns joined by 'and', where one noun would do the work of a
  word that describes the other
scope: Using two joined nouns where one noun and a word that describes it would do, not two nouns naming
  two things and not a single noun on its own.
examples:
- The phrase 'sound and fury' is a hendiadys.
- His teacher pointed out the hendiadys in the line 'grace and favour'.
