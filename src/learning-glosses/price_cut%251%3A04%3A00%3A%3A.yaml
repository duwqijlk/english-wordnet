senseId: 'price_cut%1:04:00::'
synsetId: 00353687-n
simpleMeaning: Things are made cheaper than they usually cost or than the cost shown in ads
scope: Things made cheaper than the usual cost or the cost shown in ads; price cutting is another name
  for this sense, not a sale of old or damaged goods.
examples:
- The shop's price cut made the coats cheaper than the cost shown in the ads.
- A price cut on the chairs brought them below their usual cost.
