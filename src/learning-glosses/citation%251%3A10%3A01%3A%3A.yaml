senseId: 'citation%1:10:01::'
synsetId: 06776392-n
simpleMeaning: a short note that says where a piece of information or words taken from another work came
  from
scope: A short note naming a source, also called mention, reference, credit, cite, acknowledgment and
  quotation; not a court order to appear and not the quoted words themselves.
examples:
- Her essay ended with a citation for every fact she had used.
- The book's citations show where the quoted words came from.
