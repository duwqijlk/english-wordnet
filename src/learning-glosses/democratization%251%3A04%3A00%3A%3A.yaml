simpleMeaning: the act of changing a country or group so that its people can vote and help decide how
  it is run
scope: The act of giving people a vote and a part in deciding how a place is run; it is not one single
  vote or election, and not the way of running a place that comes after it.
examples:
- The democratization of the country took many years, as people slowly won the right to vote.
- Democratization gave ordinary people a say in how their town was run.
