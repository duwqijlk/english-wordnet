simpleMeaning: Alcohol, thalidomide, X-rays, or German measles are all things that get in the way of a
  baby growing as it should in the womb.
scope: The word covers anything that gets in the way of a baby growing as it should in the womb, such
  as alcohol or German measles.
examples:
- The leaflet listed alcohol as a teratogen.
- They tested the new drug to see if it was a teratogen.
