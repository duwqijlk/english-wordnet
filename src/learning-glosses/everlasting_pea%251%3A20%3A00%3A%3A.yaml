simpleMeaning: any of several climbing plants that live for many years, from one named group of plants
scope: Any of several climbing plants that live for many years, not a plant that lives for one year and
  not a bean plant grown for food.
examples:
- The everlasting pea climbed up the garden fence.
- An everlasting pea came back each spring beside the wall.
