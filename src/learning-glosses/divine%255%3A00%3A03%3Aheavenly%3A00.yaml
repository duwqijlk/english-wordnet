simpleMeaning: coming about through God's care and plan for the world
scope: Coming about through God's care and plan, not devoted to worship, not wonderful as if from the
  gods, and not the verbs for knowing at once or searching with a rod.
examples:
- A divine chance meeting brought the two old friends together.
- She saw divine care in the way the storm spared her house.
