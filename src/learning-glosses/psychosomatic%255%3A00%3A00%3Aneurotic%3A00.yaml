simpleMeaning: Said of an illness or signs of illness that come from a troubled mind.
scope: Of an illness or signs of illness that come from a troubled mind.
examples:
- Their headaches were psychosomatic, brought on by worry rather than by any illness in the body.
- The rash looked psychosomatic, since no skin test could explain it.
