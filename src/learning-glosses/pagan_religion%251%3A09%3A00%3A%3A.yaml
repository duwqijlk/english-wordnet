simpleMeaning: The Christian faith, the Jewish faith and the Muslim faith are not among the many faiths
  this covers
scope: 'Also called paganism and heathenism: any faith other than the Christian, Jewish or Muslim faith,
  not a single faith of its own and not a lack of faith.'
examples:
- Pagan religion in the old north honoured many gods.
- The book lists the pagan religion of the old Romans among its chapters.
