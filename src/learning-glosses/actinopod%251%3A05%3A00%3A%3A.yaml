simpleMeaning: Tiny one-celled animals with stiff rod-like false feet that spread out in all directions.
scope: Not an amoeba with soft false feet and not a many-celled animal.
examples:
- The actinopod spread its stiff false feet to catch food.
- Under the lens, an actinopod showed rods in all directions.
