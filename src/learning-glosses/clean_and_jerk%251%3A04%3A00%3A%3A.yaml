simpleMeaning: In two stages, a lifter first brings a long bar up to the shoulders and then thrusts it
  overhead in one sharp push
scope: This lift, in which a long bar is raised to the shoulders and then driven up above the head, is
  also called clean.
examples:
- He won with a clean and jerk of 180 kilos.
- She set a record with her clean and jerk.
