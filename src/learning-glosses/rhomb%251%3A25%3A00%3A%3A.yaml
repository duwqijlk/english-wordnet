simpleMeaning: a flat four-sided shape with all sides the same length and corners that are slanted, not
  square
scope: Not a square, and not a shape with sides of mixed length; also called diamond and rhombus.
examples:
- Draw a rhomb with sides of five centimetres.
- A rhomb looks like a square pushed sideways.
