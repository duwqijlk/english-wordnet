simpleMeaning: a person whose work is to make wooden wheels and fix them when they are broken
scope: A person who makes and fixes wooden wheels, not the horse harnessed nearest a vehicle's wheels
  and not the man at the outer end of a rank.
examples:
- The wheeler made a new wooden wheel for the cart.
- When a wheel cracked, the farmer took it to the wheeler to be fixed.
