simpleMeaning: A tall long-lived North American plant with creeping underground stems, narrow leaves and
  spikes of pinkish-purple flowers, growing thickly on burned ground and in new clearings; an important
  honey plant.
scope: A tall wildflower, also called fireweed, giant willowherb, rosebay willowherb and wickup, growing
  thickly on burned ground and in new clearings and important as a honey plant.
examples:
- Epilobium angustifolium covered the burned hillside in pink.
- Bees gathered nectar from Epilobium angustifolium all summer.
