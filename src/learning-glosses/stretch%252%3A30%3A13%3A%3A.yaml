simpleMeaning: To make something go further in amount or bulk by mixing in a cheaper material.
scope: This is about making a supply last longer with a cheap filler, not about spoiling its quality or
  making it physically longer.
examples:
- He stretched the stew with rice to feed more people.
- You can stretch the paint with a little water.
