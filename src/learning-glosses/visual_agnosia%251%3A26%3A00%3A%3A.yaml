schema: oewn-learning-gloss-v2
senseId: 'visual_agnosia%1:26:00::'
synsetId: 14123852-n
simpleMeaning: not being able to know or make sense of things seen in front of you
scope: An inability to tell what things are by sight, not a loss of sight and not a failure to remember
  names for things.
examples:
- After the stroke, she had visual agnosia and could not tell a key from a spoon by sight.
- His visual agnosia meant he could see the cup but did not know what it was for.
