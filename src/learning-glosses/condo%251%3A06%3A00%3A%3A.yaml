simpleMeaning: one home in a building of separate homes, each home owned separately from the others
scope: 'This sense is also called condominium: it is one single home in such a building, not the whole
  building of homes.'
examples:
- They bought a small condo near the sea.
- His condo is on the third floor of the building.
