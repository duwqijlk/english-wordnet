simpleMeaning: Armour worn in the Middle Ages, made from many small metal rings joined into a flexible
  covering.
scope: The armour a soldier wore, not letters, parcels, or the postal system.
examples:
- The knight wore mail under his linen tunic.
- Each ring of the mail was riveted shut by hand.
