simpleMeaning: a piece of jewellery in the form of a circle, made of valuable metal and often set with
  gems, worn on a finger
scope: This is a decorative finger ornament made of valuable metal; it is not a plain metal loop used
  for fastening or hanging things, and not the round shape itself.
examples:
- He slipped a gold ring onto her finger.
- Her ring was set with three small diamonds.
