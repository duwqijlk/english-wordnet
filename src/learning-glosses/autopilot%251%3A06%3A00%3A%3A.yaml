simpleMeaning: a device that by itself keeps ships, planes, or spacecraft moving on a steady course without
  a person guiding them
scope: 'Also called automatic pilot and robot pilot: a device that keeps a ship, plane, or spacecraft
  on course by itself, not a person who guides it.'
examples:
- The plane stayed on course on autopilot for most of the flight.
- The captain turned on the autopilot after the ship left the port.
