simpleMeaning: A shield in the old system of family coats of arms carries a picture or design, and this
  is that picture or design
scope: A picture or design on a shield, also called a charge, a bearing, or an armorial bearing, not a
  family name and not a whole coat of arms.
examples:
- The heraldic bearing on the knight's shield was a red lion.
- She chose a heraldic bearing of three stars for her family's shield.
