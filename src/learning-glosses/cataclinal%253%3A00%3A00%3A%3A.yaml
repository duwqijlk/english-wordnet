synsetId: 00109245-a
simpleMeaning: In valleys and rivers, running the same way as the slope of the rock layers round them.
scope: In valleys and rivers, running the same way as the slope of the rock layers round them; not a valley
  running across the slope of the rock layers, and not a river running against the slope.
examples:
- The cataclinal river runs with the dip of the rocks.
- Cataclinal valleys follow the slope of the rock layers.
