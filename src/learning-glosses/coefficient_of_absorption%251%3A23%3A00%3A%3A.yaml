senseId: 'coefficient_of_absorption%1:23:00::'
synsetId: 13607658-n
simpleMeaning: A measure of how fast light's intensity falls as it passes through a substance; the share
  of incoming radiant energy taken in per unit mass or thickness.
scope: Another name for absorptance and absorption coefficient; it is not the general process of taking
  in light.
examples:
- The coefficient of absorption varies with wavelength.
- Engineers plotted the coefficient of absorption against frequency.
