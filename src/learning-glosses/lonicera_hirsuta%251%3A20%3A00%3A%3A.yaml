simpleMeaning: A winding shrub that loses its leaves each year, with hairy leaves and spikes of yellow-orange
  flowers, from the north-east of America.
scope: 'Also called hairy honeysuckle: a winding shrub with hairy leaves and yellow-orange flower spikes
  from north-eastern America, not the smooth-leaved honeysuckles.'
examples:
- Lonicera hirsuta wound up the old fence, its hairy leaves catching the light.
- The Lonicera hirsuta by the path had spikes of yellow-orange flowers.
