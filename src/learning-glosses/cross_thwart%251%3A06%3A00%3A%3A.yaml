simpleMeaning: a bar across a boat that holds its sides apart and serves as a seat in a rowing boat
scope: A bar across a boat that holds its sides apart and is used as a seat; thwart is another name for
  this sense, and this is not a bench on land or a part that holds the boat together at the ends.
examples:
- She sat on the cross thwart and took up the oars.
- He fixed a new cross thwart in the old rowboat.
