simpleMeaning: a thing you hit to make music, most often a hollow round tube with a thin skin drawn tight
  across each open end
scope: This thing you hit to make music is also called a drum and a tympan.
examples:
- The membranophone sounded when the player struck its skin.
- A membranophone is most often a hollow tube with a thin skin over each end.
