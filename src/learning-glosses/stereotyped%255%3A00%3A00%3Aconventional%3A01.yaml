simpleMeaning: not new, not done in a sudden natural way, and not showing a person's own way of being
scope: 'Also called stereotypical and unimaginative: about words or acts that follow a fixed pattern,
  not about a fixed idea held about a whole group of people.'
examples:
- He used stereotyped phrases of comfort that he says to everyone.
- Her stereotyped answer gave no sign of her own thoughts.
