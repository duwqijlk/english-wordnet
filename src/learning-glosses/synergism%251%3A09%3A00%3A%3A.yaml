simpleMeaning: In theology, the teaching that a person is saved through the working together of human
  will and God's grace.
scope: In theology, this is the teaching that a person is saved through human will and God's grace working
  together, not salvation by faith alone and not salvation by good works alone.
examples:
- Synergism teaches that human will works with divine grace.
- The preacher spoke of synergism in his sermon.
