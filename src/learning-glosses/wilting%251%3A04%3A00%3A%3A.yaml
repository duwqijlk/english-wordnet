simpleMeaning: the act of making something go soft so that it hangs down
scope: 'Also called wilt: the act of making something go soft so that it hangs down, not the soft, hanging
  state itself.'
examples:
- The wilting of the flowers was caused by the hot sun.
- Strong heat caused the wilting of the leaves on the young plants.
