simpleMeaning: This wild tree of Dalmatia bears bitter fruit, and juice from the fruit is made into a
  strong sweet drink.
scope: 'People also call it a marasca or a marasca cherry: it is the wild tree of Dalmatia bearing bitter
  fruit, not the fruit kept in the sweet drink.'
examples:
- Bitter fruit of the maraschino cherry gave juice for the sweet drink.
- A maraschino cherry grew in Dalmatia.
