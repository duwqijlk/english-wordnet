simpleMeaning: Sore spots break out where food goes in and round the feet of animals with split feet when
  this sudden sickness spreads fast among them.
scope: It is also called foot-and-mouth disease, the sudden sickness that spreads fast among animals with
  split feet and leaves sore spots where food goes in and round their feet.
examples:
- Hoof-and-mouth disease spread fast through the cows on the farm.
- The vet found hoof-and-mouth disease in sheep with sore feet.
