simpleMeaning: A lovely place where Adam and Eve were put at the Creation, till they disobeyed and ate
  the banned fruit from the good-and-evil tree and were sent away
scope: The first home of Adam and Eve in the Bible story, where they ate from the tree of knowledge of
  good and evil before the fall of man, not a real park or a heaven; also called Eden.
examples:
- Adam and Eve lived in the Garden of Eden before the fall.
- The Garden of Eden is the first home in the Bible story.
