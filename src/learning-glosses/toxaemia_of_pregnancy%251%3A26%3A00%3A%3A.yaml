simpleMeaning: Swelling, blood pressure that runs too high, and protein in the urine mark this sickness
  that comes with carrying a baby.
scope: Toxaemia, toxemia, and toxemia of pregnancy are other names for this sickness of a woman carrying
  a baby, marked by high blood pressure, swelling, and protein in the urine.
examples:
- The toxaemia of pregnancy showed in her high blood pressure and the protein in her urine.
- Swelling and high blood pressure during the pregnancy pointed to toxaemia of pregnancy.
