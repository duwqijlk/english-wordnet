simpleMeaning: A long-lasting gum disease in which the flesh around the teeth is sore and leaks pus
scope: A long-lasting gum disease; also called pyorrhea and pyorrhea alveolaris, not a short attack of
  sore gums.
examples:
- His pyorrhoea had made his gums bleed for years.
- The dentist treated her pyorrhoea before any teeth came loose.
