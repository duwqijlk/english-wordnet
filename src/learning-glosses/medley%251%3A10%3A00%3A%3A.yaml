simpleMeaning: a piece of music made by joining together a number of songs or other pieces of music from
  different sources
scope: 'Also called potpourri and pastiche: one piece of music made from many songs or pieces put together,
  not a single song by one maker.'
examples:
- The band played a medley of old songs at the end of the show.
- She sang a medley that moved from a love song to a dance tune.
