simpleMeaning: Limbs turned into flippers and a smooth long body made for swimming mark this meat-eating
  water animal.
scope: 'Also called pinniped and pinniped mammal: a meat-eating water animal with a smooth long body made
  for swimming, its limbs turned into flippers.'
examples:
- A pinnatiped swims with limbs turned into flippers.
- Seals are pinnatipeds, meat-eating water animals.
