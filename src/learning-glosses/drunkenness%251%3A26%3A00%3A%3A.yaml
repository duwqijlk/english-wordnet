simpleMeaning: the state a person is in for a short time after drinking too much alcohol
scope: 'Also called intoxication, inebriation, inebriety and insobriety: the state of having had too much
  alcohol, not the act of drinking too much itself.'
examples:
- His drunkenness made him unsteady on his feet.
- In his drunkenness, he sang loudly and could not walk straight.
