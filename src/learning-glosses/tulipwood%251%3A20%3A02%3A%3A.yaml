simpleMeaning: A wood with bright stripes and marks of many colors, from several kinds of tree, used to
  make fine things look nice
scope: This is a wood with bright stripes and marks of many colors, used to make fine things look nice;
  not the tree it comes from and not plain wood for building.
examples:
- The small box was made of tulipwood, with bright stripes running through it.
- She chose tulipwood for the desk top because of its bright colors.
