simpleMeaning: Sweet yellow flowers that turn orange grow in rings at the ends of the stems of this climbing
  bush, which drops its leaves in winter, in the southeast United States.
scope: A climbing bush of the southeastern United States, not the twining kind of the northeast with purple-tinged
  flowers.
examples:
- The yellow honeysuckle filled the air with a sweet smell.
- A yellow honeysuckle showed yellow flowers that turned orange.
