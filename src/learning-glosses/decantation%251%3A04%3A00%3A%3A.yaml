simpleMeaning: The act of pouring off a clear liquid with care from its first bottle, without stirring
  up the bits at the bottom.
scope: This is pouring off a clear liquid with care, not pouring out a whole bottle at once or straining
  bits out of a liquid.
examples:
- Decantation lets you pour off the clear wine without the bits at the bottom.
- She used decantation to move the clear liquid to a new bottle.
