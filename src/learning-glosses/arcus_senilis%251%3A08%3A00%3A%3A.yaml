simpleMeaning: a whitish build-up like a bent bow that at times appears on the clear front of the eye
scope: 'Also called arcus: a pale build-up on the front of the eye, not a sore on the eye and not a cloud
  over the whole eye.'
examples:
- The eye doctor noted the arcus senilis at the edge of the cornea.
- An arcus senilis had grown in the clear front of her eye.
