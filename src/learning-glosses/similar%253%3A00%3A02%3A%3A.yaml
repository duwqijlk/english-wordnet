synsetId: 01412553-a
simpleMeaning: Close in appearance or nature, with the same characteristics or some of them; the word
  'like' means the same and is often used in combination, as in doglike and dreamlike.
scope: This is the general adjective for things that are alike. 'Like' is another name for the same sense,
  and it is that word which combines with nouns, as in doglike and dreamlike. It can describe things that
  share all the same characteristics or only some of them, so it does not by itself say how close the
  match is.
examples:
- Their handwriting is so similar that I cannot tell the two notes apart.
- We have similar tastes in music, though we grew up in different towns.
