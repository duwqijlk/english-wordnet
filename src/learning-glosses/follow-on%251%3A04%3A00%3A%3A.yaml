simpleMeaning: In cricket, a team that scores a set number of runs fewer than the other side in the first
  innings must bat again at once, in a second innings.
scope: In cricket, a team takes this second innings because it must, after falling a set number of runs
  short in the first innings, not because it chooses to.
examples:
- The follow-on was enforced after the home side fell well behind in the first innings.
- After the follow-on, the same team had to bat again at once.
