simpleMeaning: the meat of an older chicken, good for cooking slowly in liquid
scope: Chicken meat from an older bird, used for slow cooking in liquid; not a female water animal such
  as an octopus or a lobster.
examples:
- She bought a stewing hen and cooked it slowly with vegetables.
- Old hen makes a rich soup, but the meat needs a long time to soften.
