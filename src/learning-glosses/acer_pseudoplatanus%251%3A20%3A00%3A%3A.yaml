simpleMeaning: A maple tree of Europe and Asia with pale grey bark that peels in flakes like that of a
  sycamore tree, and leaves with five egg-shaped lobes yellow in autumn.
scope: Also called sycamore, great maple, and Scottish maple; a maple tree of Europe and Asia with pale
  grey flaking bark, not the Norway maple and not the field maple.
examples:
- Acer pseudoplatanus sheds its pale grey bark in flakes.
- The five-lobed leaves of Acer pseudoplatanus turn yellow in autumn.
