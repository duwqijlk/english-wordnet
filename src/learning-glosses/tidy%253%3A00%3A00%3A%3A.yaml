simpleMeaning: in good order and clean in how someone or something looks, or in habits
scope: This describes a neat person, place or mind, not the small box or tray that holds small things
  like sewing tools.
examples:
- She keeps a tidy desk with every paper in its place.
- He is a tidy person who cleans the kitchen as he cooks.
