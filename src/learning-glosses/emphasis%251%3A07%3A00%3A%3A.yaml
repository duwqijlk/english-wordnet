senseId: 'emphasis%1:07:00::'
synsetId: 05044549-n
simpleMeaning: the strength of feeling put into the way something is said or written
scope: Strong feeling in how something is said or written, not stress given by word order or repetition
  and not the stress on one syllable or note.
examples:
- The emphasis in his denial left no doubt that he meant it.
- She put great emphasis on the need for clean water.
