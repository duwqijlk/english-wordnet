simpleMeaning: A solid ball of small cells that forms when a fertilized egg splits, and later grows into
  a hollow ball of cells.
scope: A solid ball of small cells formed when a fertilized egg splits, before it grows into a hollow
  ball of cells; not the fertilized egg itself and not the hollow ball stage.
examples:
- The morula forms a few days after fertilization.
- Under the microscope, the morula looked like a solid ball of cells.
