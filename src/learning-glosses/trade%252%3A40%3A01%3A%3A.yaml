simpleMeaning: buy and sell a particular kind of thing commercially
scope: This is buying and selling a kind of thing commercially, not handing in an old item as part payment,
  swapping one thing for another, or merely offering goods for sale as a livelihood.
examples:
- The company trades electrical goods across Europe.
- They have traded coffee and spices for generations.
