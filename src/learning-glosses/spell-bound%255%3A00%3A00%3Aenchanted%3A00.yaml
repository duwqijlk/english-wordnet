simpleMeaning: so taken that you cannot turn your thoughts away, as if under a magic charm
scope: Also called spellbound, it is a state in which attention is held fast, not merely being pleased
  and not being asleep.
examples:
- The children sat spell-bound through the whole story.
- Spell-bound, she watched the dancer until the music stopped.
