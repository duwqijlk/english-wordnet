simpleMeaning: Buildings and other things such as roads, schools, bridges and docks, built with government
  money for everyone to use.
scope: Things built with government money for everyone to use, not private buildings and not things built
  for one person.
examples:
- The new public works include a bridge and a school for the town.
- Public works paid for by the state keep the roads in good shape.
