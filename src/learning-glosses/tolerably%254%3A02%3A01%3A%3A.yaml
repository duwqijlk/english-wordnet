simpleMeaning: in a way that is good enough but not great
scope: Acceptably is another name for this sense. This means good enough but not great; it is not bad,
  and it is not excellent.
examples:
- She plays tennis tolerably, but she is not one of the best players.
- He speaks French tolerably, and people can follow what he says.
