simpleMeaning: A tall feather palm from Brazil whose huge, leathery, deeply divided leaves rise from long,
  strong stems, forming a crown at the top; those stems are used in building.
scope: The palm itself, not the leaves or stems cut from it, and not another tall feather palm from Brazil;
  jupati palm and jupaty are other names for the same tree.
examples:
- Jupati has huge, leathery leaves that are deeply divided.
- Builders use the long, strong stems of jupati.
