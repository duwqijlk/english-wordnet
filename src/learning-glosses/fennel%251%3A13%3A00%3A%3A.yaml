simpleMeaning: Seeds from a plant, ground up and used to add taste to food, on their own or mixed with
  other spices
scope: This sense is the ground seeds used in cooking, not the plant itself and not its thick stem base
  eaten as a vegetable.
examples:
- Ground fennel gave the sauce a sweet, warm taste.
- The recipe calls for a spoon of fennel mixed with other spices.
