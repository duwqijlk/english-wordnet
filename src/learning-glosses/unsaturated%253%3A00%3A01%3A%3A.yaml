simpleMeaning: of a liquid that can still take in more of a thing mixed in it at one heat
scope: A liquid that can still take in more of a thing at one heat, not a liquid that is full and can
  take in no more, and not a chemical whose parts are joined by more than one bond.
examples:
- The unsaturated salt water could still take in more salt when it was stirred.
- She heated the unsaturated solution, and it took in more sugar than the cold one did.
