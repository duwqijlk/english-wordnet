synsetId: 01064507-n
simpleMeaning: the fact of not doing anything, or of doing less than before
scope: This covers not doing anything and also doing less than before; not just the state of doing nothing,
  and not a person's lasting tendency to do nothing.
examples:
- After weeks of inactivity, the factory slowly started work again.
- Long inactivity during the day made it hard for him to sleep at night.
