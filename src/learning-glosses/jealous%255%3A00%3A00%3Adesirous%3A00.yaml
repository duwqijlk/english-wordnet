simpleMeaning: wanting very much what another person has, and feeling bad because you do not have it
scope: 'Another name for this sense is envious: wanting very much what another person has; not the sense
  about fearing that a rival will take your place.'
examples:
- He was jealous of his friend's success and wanted it for himself.
- She felt jealous when she saw their large house and new car.
