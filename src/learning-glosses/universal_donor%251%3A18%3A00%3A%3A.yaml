simpleMeaning: a person with type O Rh-negative blood, a kind of blood that can safely be given to people
  with other blood types
scope: A person whose blood can go to people of other blood types, not a person who can only give to people
  of the same type.
examples:
- As a universal donor, she can give blood to patients of many blood types.
- The hospital asked the universal donor to give blood for the patient in surgery.
