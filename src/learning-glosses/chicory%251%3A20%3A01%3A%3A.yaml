simpleMeaning: A long-lived Old World herb, with rayed flower heads of blue florets, grown for its root
  and its crisp, edible leaf-heads, used in salads.
scope: A long-lived Old World herb, with rayed flower heads of blue florets, grown for its root and its
  crisp, edible leaf-heads, used in salads; also called chicory plant or succory; not the root of the
  chicory plant, roasted and ground to stand in for coffee, or to spoil it, nor crisp, spiky leaves with
  a somewhat bitter taste, nor the dried root of the chicory plant, used as a coffee stand-in.
examples:
- Their chicory grew by the wall.
- The chicory was cut for salad.
