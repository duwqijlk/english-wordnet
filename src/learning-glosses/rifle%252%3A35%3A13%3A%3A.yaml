simpleMeaning: to hunt through a place or a person's things for something, with no right to do so
scope: Also called go, this is looking through a place or a person's things for something, with no right
  to do so, not the long gun held at the shoulder and not taking goods by force.
examples:
- Who rifled through my desk drawers looking for the keys?
- He rifled through her bag for the letter, with no right to look in it.
