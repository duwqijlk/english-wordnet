simpleMeaning: A changing flow of power through one loop of wire in a circuit starts a flow in a second
  circuit close by.
scope: Primary and primary winding are other names for it, and it is the loop that starts the new current,
  not the loop beside it that picks it up.
examples:
- Current through the primary coil sets off current in the secondary coil.
- The primary coil gave the nearby circuit its current.
