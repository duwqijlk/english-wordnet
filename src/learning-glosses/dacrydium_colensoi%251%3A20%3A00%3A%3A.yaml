simpleMeaning: A New Zealand silver pine shaped like a cone, with long thin bendy branches; it suits cold
  wet summers and high places.
scope: Also called tar-wood or tarwood; a New Zealand silver pine of cone shape with long thin bendy branches,
  suited to cold wet summers and high places, kin to other cone-shaped pines.
examples:
- Dacrydium colensoi grows in the high country, its long thin branches bending in the wind.
- The Dacrydium colensoi of New Zealand suits cold wet summers.
