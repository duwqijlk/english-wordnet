simpleMeaning: a common European sea animal that people eat, which digs into sand or mud and has a strong,
  round two-part shell with lines spreading out from the centre
scope: This is the sea animal that digs into sand or mud and has a strong, round shell with lines spreading
  out from the centre; not the plainer sense of a common European sea animal with a two-part shell that
  people eat, and not the act of pulling cloth or paper into small folds.
examples:
- Cockles live buried in the sand and are gathered for food.
- He found a cockle with a thick, round shell marked with clear lines.
