simpleMeaning: A net of machines in one place that talk to each other, above all one that joins machines
  and word tools and office gear so offices can share talk.
scope: A set of linked machines in one place that talk to each other; also called local area network,
  and not the wide web, and not one machine on its own.
examples:
- The office LAN links ten computers.
- Our LAN went down this morning.
