simpleMeaning: On farmed land in North America this plant most times grows wild, with thin, brush-like
  bunches of blooms.
scope: This North American plant is also called old witchgrass, tumble grass, witch grass, and witchgrass,
  and most times grows wild on farmed land.
examples:
- The old witch grass grew wild on farmed land.
- The old witch grass bore thin, brush-like bunches of blooms.
