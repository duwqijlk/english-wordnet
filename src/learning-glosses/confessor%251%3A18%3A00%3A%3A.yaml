simpleMeaning: a priest who listens when a person says what they did wrong and then says that God forgives
  them
scope: A priest who hears what a person did wrong and says God forgives them, not a person who admits
  to doing something bad.
examples:
- She went to her confessor to say what she had done wrong.
- The confessor listened and told him God forgave him.
