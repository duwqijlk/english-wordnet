simpleMeaning: Four subjects — numbers, music, shapes, and the stars — made up the higher part of what
  students learned at a medieval university.
scope: In the Middle Ages, it was the higher part of a university course, made of arithmetic, music, geometry,
  and astronomy.
examples:
- Students in the quadrivium studied music and the stars.
- The quadrivium gave them numbers, music, shapes, and the stars.
