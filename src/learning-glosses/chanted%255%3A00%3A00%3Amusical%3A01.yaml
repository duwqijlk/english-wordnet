simpleMeaning: Sung or spoken in a steady beat and one flat tone, with no rise or fall.
scope: Sung or spoken in a steady beat and one flat tone, not sung with a changing tune.
examples:
- The monks sang a chanted psalm at dawn.
- The crowd's chanted slogans rose and fell as one.
