simpleMeaning: tall stems rise from long grasslike leaves, each stem topped with red or yellow flowers
  that hang down
scope: Also called flame-flower, flame flower, flameflower, and tritoma, it is a plant whose tall stems
  carry red or yellow flowers that hang down.
examples:
- The kniphofia's tall stems rose above the grasslike leaves.
- Red flowers hung down from the tall stems of the kniphofia.
