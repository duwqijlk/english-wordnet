senseId: 'war_power%1:26:00::'
synsetId: 13968734-n
simpleMeaning: In a fight between countries, the state may claim rights far beyond its peace-time rights,
  usually claimed by the head of the state.
scope: It names the extra rights a state claims while fighting, rights it does not hold in peace.
examples:
- The war power was used to claim wider rights while the fighting went on.
- Under the war power, the head of the state claimed rights the state did not hold in peace.
