simpleMeaning: The state of a light or a sound that is weak and not bright or loud
scope: Weakness of light or sound; not darkness itself and not a lack of contrast in what you see.
examples:
- The dimness of the lamp made it hard to read.
- She noticed the dimness of the music from the next room.
