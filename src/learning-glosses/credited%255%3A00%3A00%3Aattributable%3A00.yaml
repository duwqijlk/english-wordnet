simpleMeaning: usually followed by 'to', said to be the person who made or did a thing
scope: This says who is said to have made or done something, usually with 'to' after it; it is not about
  money lent or about being believed.
examples:
- The invention is credited to Edison.
- The song is credited to two writers.
