simpleMeaning: The act of stopping someone from doing something, or one case of stopping them.
scope: This is stopping someone from doing something; inhibition and prohibition are other names for this
  sense, not a law against something and not a refusal to allow one person in.
examples:
- He ignored his parents' forbiddance and went out anyway.
- The forbiddance of alcohol in the building was written into the rules.
