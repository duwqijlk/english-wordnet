simpleMeaning: a long, thin, bendable thing with the form of a crawling reptile
scope: Not the living reptile, the steel coil used to clear drains, or a treacherous person, but any long,
  thin, bendable object with that animal's shape.
examples:
- A thick snake of rope lay coiled at his feet.
- The children twisted the long balloon into a snake.
