senseId: 'titillate%2:39:00::'
synsetId: 02124605-v
simpleMeaning: To brush a part of the body with a light touch, waking the nerves under the skin and making
  a person feel uneasy, laugh, or jerk without meaning to.
scope: Also called tickle, and another name for it is vellicate; to touch lightly so as to stir the skin's
  nerves, not to excite someone pleasurably or in a sexual way.
examples:
- She titillated the baby's foot, and the baby giggled and pulled away.
- He titillated his brother's ribs with his fingertips until his brother burst out laughing.
