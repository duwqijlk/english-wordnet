simpleMeaning: In France, a person who lives where they work, in flats or a hotel, and watches who comes
  in and goes out, deals with letters, and cleans or carries bags
scope: This person lives in the building and does all of these jobs together; not only a cleaner, and
  not only a person who carries bags.
examples:
- The concierge took our letters and showed us to our rooms.
- Ask the concierge who has a key for the front door.
