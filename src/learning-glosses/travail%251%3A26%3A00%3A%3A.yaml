simpleMeaning: The last stage of carrying a child, from the first pains of birth until the child is born.
scope: 'Also called labor, labour, confinement, and childbed: the last stage of a pregnancy, ending in
  the birth of the child.'
examples:
- She was in travail for six hours before her baby was born.
- The midwife stayed with her through the long travail until the child arrived.
