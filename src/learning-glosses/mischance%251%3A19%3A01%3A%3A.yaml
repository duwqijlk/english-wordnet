simpleMeaning: a bad result that no one could know about before it happened
scope: Also called mishap, this is a bad result no one could see coming, not a bad act that someone plans
  and not good luck.
examples:
- By mischance, the letter went to the wrong house.
- A mischance with the weather ruined their trip.
