senseId: 'benzodiazepine%1:06:00::'
synsetId: 02834036-n
simpleMeaning: any of a group of fat-loving chemicals called amines that calm a person, help them sleep,
  or ease tight muscles; long use can make a person need them
scope: A group of calming drugs, not a painkiller and not a drug that only helps a person sleep.
examples:
- The doctor gave her a benzodiazepine to help her sleep.
- He became dependent on the benzodiazepine he took each night.
