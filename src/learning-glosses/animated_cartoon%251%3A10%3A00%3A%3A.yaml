simpleMeaning: Drawings shot one by one on film and shown very fast, so the still figures in them look
  as if they move
scope: This is also called a cartoon and a toon, and it is made from drawings, not from shots of real
  people and places.
examples:
- The animated cartoon made the drawn rabbit seem alive and moving.
- We watched an animated cartoon in which the still figures ran past so fast that they seemed to move.
