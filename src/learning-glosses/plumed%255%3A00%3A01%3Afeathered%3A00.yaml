simpleMeaning: having a plume (a large, showy feather) or a soft bunch of feathers, for show
scope: This sense is about having a plume or a soft feathery bunch for show in general; the knight's helmet
  use is a different sense, and being covered with many plumes is another.
examples:
- The bird had a plumed head, with one tall feather standing up.
- She wore a plumed hat with a soft bunch of feathers on one side.
