synsetId: 14152294-n
simpleMeaning: A disease present at birth that harms the defence cells, from a change in one of several
  genes; children catch infections easily and die before age two if untreated
scope: Also called severe combined immunodeficiency and severe combined immunodeficiency disease; a disease
  present at birth that leaves a child open to infection, not a disease caught later in life.
examples:
- The baby was found to have SCID in the first weeks of life.
- Doctors treat SCID with a bone marrow transplant.
