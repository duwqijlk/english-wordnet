simpleMeaning: A light that goes on and off in quick turns, used to give a sign or send a message.
scope: 'Also called blinker: a light that flashes on and off to signal or send a message, not the device
  that switches a lamp and not a person who bares himself.'
examples:
- The flasher on the roof warned drivers of the roadworks.
- She used the torch as a flasher to send a message.
