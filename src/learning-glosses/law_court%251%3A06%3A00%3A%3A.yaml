simpleMeaning: A place where a magistrate or one or more judges hear cases and give rulings by the rules
  of the land.
scope: A place where a magistrate or one or more judges hear cases and give rulings by the rules of the
  land; lawcourt, court of justice and court of law are other names for this sense, not a meeting of lawmakers,
  and not a room where lawyers give advice.
examples:
- The case was heard in a law court.
- The law court sat for three days.
