simpleMeaning: A piece of writing or other work that copies a person's way of working but twists it, most
  often to make people laugh
scope: This is a funny copy that twists a person's way of working, also called mockery, parody, takeoff,
  travesty, burlesque, spoof, lampoon, pasquinade, send-up or sendup, not a true copy meant to honour
  the person and not a false act or show.
examples:
- Her put-on of the old poet's verse made the whole class laugh.
- His latest put-on copies the newsreader's voice and turns it into a joke.
