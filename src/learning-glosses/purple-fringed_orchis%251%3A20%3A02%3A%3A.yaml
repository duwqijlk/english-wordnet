simpleMeaning: A North American flower like the close kind Habenaria psycodes, with bigger and paler blooms.
scope: A North American orchid with bigger paler flowers, also called purple-fringed orchid; not the orchid
  with clusters of fragrant purple fringed flowers and not a garden orchid.
examples:
- The purple-fringed orchis grows wild in North America.
- Its purple-fringed orchis blooms were bigger and paler than the others.
