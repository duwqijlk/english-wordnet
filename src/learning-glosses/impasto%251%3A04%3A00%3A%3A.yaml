simpleMeaning: The marks of the brush or flat knife can still be seen in this way of painting, where paint
  is laid on thick.
scope: A way of painting with paint laid on thick so tool marks show, not thin flat paint.
examples:
- The impasto on the sky stood out in thick ridges.
- She loved the impasto of the old master's portraits.
