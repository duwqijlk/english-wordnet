simpleMeaning: This clear liquid, once breathed in to put people to sleep, turns to gas quickly and catches
  fire easily.
scope: Also called ether, diethyl ether, divinyl ether, ethoxyethane, and vinyl ether, this is a clear
  liquid that was once breathed in to put people to sleep and that turns to gas quickly and catches fire
  easily.
examples:
- Ethyl ether was once breathed in to put people to sleep.
- The ethyl ether caught fire easily, so it was stored with care.
