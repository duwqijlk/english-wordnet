simpleMeaning: to join and stay with a group, as a news writer joins a military unit when writing about
  a war
scope: This is about a news writer joining and staying with a military unit to write about a war, not
  about putting a thing firmly inside another thing.
examples:
- The paper will embed a writer with the army unit for the war.
- She was embedded with the soldiers to write about the fighting.
