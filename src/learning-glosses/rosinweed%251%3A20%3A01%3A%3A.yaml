simpleMeaning: a plant of North America that lives for more than one year, smells of sticky gum and has
  yellow flowers
scope: A North American plant that lives for years, not the western plants once used as medicine and not
  a plant with white flowers.
examples:
- Rosinweed grew along the road, its yellow flowers bright in the sun.
- We could smell the rosinweed before we saw its yellow flowers.
