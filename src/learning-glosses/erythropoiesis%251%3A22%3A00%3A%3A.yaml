simpleMeaning: the way the body makes red blood cells from the tiny living parts in the soft stuff inside
  the bones
scope: The making of red blood cells inside the bones, not the making of white blood cells and not a blood
  transfusion.
examples:
- Erythropoiesis slows down when the bone marrow is damaged.
- Doctors watched erythropoiesis return after the treatment.
