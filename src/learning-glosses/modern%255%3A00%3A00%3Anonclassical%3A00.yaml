simpleMeaning: typical of the art, music, writing, or buildings of the present day.
scope: This is not the sense 'existing since the Middle Ages', and not the noun for a style of letters;
  it describes current artistic work.
examples:
- The gallery shows modern art from the last twenty years.
- She prefers modern music to the songs her parents play.
