simpleMeaning: a word used in a rude way for a young girl who acts like a child or shows no respect
scope: A rude word for a young girl who acts like a child or shows no respect, not a kind word for any
  girl.
examples:
- The rude old man called the laughing girl a chit when she would not listen to him.
- She was called a chit for rolling her eyes and answering her teacher back.
