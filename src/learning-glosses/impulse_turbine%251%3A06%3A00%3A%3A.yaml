simpleMeaning: A wheel with blades that spin as jets strike them head-on
scope: A turbine wheel driven by jets striking its blades; not a wheel turned by pressure inside a closed
  case and not a windmill.
examples:
- The impulse turbine spun as the jets of steam struck its blades.
- Water from the dam drove the impulse turbine at full speed.
