simpleMeaning: Its lab-made form treats a lack of it, but this body chemical like the female sex chemical
  also occurs in the body on its own.
scope: Also called estriol, this body chemical like the female sex chemical comes both from the body itself
  and, in lab-made form, as a treatment for a lack of it.
examples:
- The level of oestriol in the blood was checked.
- Oestriol was given to a woman who lacked the female sex chemical.
