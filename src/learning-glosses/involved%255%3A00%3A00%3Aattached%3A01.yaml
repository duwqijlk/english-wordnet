senseId: involved%5:00:00:attached:01
synsetId: 00159597-s
simpleMeaning: having a strong emotional bond with someone, so that you care about them deeply.
scope: It is not being caught up in a difficult situation and not simply taking part in an activity; it
  means having close feelings for a person.
examples:
- He was deeply involved with a woman he had met at work, and they soon moved in together.
- She is deeply involved with her grandchildren and sees them almost every day.
