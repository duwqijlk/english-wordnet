simpleMeaning: a tiny bit of matter that takes part in the weak force, one of the basic forces of nature,
  and has a baryon number of 0
scope: A tiny bit of matter that takes part in the weak force and has a baryon number of 0, not a bit
  of matter that takes part in the strong force and not a bit of light.
examples:
- A lepton takes part in weak interactions.
- The electron is a lepton with a baryon number of 0.
