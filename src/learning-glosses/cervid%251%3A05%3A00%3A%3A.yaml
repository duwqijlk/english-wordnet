simpleMeaning: An animal set apart from the cattle family because the male grows solid antlers that fall
  off each year.
scope: A deer-like animal set apart from the cattle family by the male's antlers that fall off each year;
  deer is another name for this sense.
examples:
- The cervid family includes deer, elk and moose.
- A male cervid sheds its antlers each year and grows new ones.
