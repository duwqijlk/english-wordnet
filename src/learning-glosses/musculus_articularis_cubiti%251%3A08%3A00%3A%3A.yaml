simpleMeaning: A small slip of the big muscle at the back of the upper arm that joins to the covering
  of the elbow joint.
scope: A small slip of the upper-arm muscle that joins the elbow joint covering; not the whole back-arm
  muscle, and not the elbow joint itself.
examples:
- The musculus articularis cubiti joins the back of the arm to the elbow joint.
- In the lab they traced the musculus articularis cubiti to the elbow joint.
