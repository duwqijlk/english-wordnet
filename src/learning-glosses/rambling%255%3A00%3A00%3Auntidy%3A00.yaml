simpleMeaning: Spreading out in many directions, or placed here and there with no order.
scope: Spread out in many directions with no order; sprawling is another name for this sense, and it is
  not speech that wanders off the point, which is the other sense of this word.
examples:
- The rambling branches reached across the path.
- His rambling handwriting covered the page.
