simpleMeaning: the quality of giving hope and making a good result seem likely
scope: The hopeful quality that points to a good result; not the firm certainty a person shows when they
  say what they believe, and not the electric sense about a pole.
examples:
- Her positivity helped the team believe the plan could work.
- There was a real positivity in his voice when he talked about the future.
