simpleMeaning: Most often in people, at the age just before puberty, often with fast growth
scope: 'Also called prepubescent: the age just before puberty, most often in people; not the age of puberty
  itself and not the adult age.'
examples:
- Her prepubertal son was growing fast and eating a lot.
- The doctor said the prepubertal child was still a year from puberty.
