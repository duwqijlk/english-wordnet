simpleMeaning: to take the wildness out of a wild animal and make it calm and easy to handle
scope: To take the wildness out of a wild animal and make it calm and easy to handle, also called domesticate,
  domesticize, reclaim or tame, and not to catch a wild animal or to train one for tricks.
examples:
- The keeper slowly domesticised the young fox over many months.
- Farmers domesticised wild sheep long ago.
