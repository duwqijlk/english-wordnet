simpleMeaning: Now wild in North America, this one-season plant from southeastern Asia and Australia has
  broad oval leaves and thin hanging spikes of deep red flowers.
scope: A crimson-spiked annual, also known as prince's-plume, princess feather and kiss-me-over-the-garden-gate;
  not the unrelated amaranth that shares the name prince's-feather.
examples:
- The prince's-feather in the border glowed with drooping spikes of crimson flowers.
- Prince's-feather comes from southeastern Asia and Australia but now grows wild in North America.
