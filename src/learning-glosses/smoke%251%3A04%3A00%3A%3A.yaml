simpleMeaning: Breathing in the fumes of burning tobacco or another substance.
scope: Using tobacco or another substance by breathing in its fumes, not the cloud from a fire and not
  a fast baseball pitch.
examples:
- He allowed himself one smoke a day, always after dinner.
- She went outside for a smoke while the others finished their coffee.
