simpleMeaning: The main organ where food is broken down, a big, strong, bag-like part of the gut.
scope: Also called a stomach, a tummy, or a tum; the main organ where food is broken down, not a region
  that grows grain and not a basket for serving bread.
examples:
- His breadbasket ached after the big meal.
- The doctor said the breadbasket was the main organ of digestion.
