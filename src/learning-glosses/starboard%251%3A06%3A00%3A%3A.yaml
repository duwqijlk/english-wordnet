simpleMeaning: the right-hand side of a ship or aircraft, seen by someone on board who is looking toward
  the front
scope: The right side of a ship or aircraft from the point of view of someone on board facing the front,
  not the left side (port).
examples:
- The starboard lights glowed green as the ship turned right.
- Passengers on the starboard side could see the harbour.
