simpleMeaning: 'the part of physics that studies solid stuff: how power moves through metal and semiconductor
  crystals, how some solids carry power with no loss, and how light changes the flow'
scope: The study of solids and how power and light move through them, not the study of liquids or gases.
examples:
- In solid-state physics, she studies how power moves through crystals.
- His solid-state physics class covers superconductivity and photoconductivity.
