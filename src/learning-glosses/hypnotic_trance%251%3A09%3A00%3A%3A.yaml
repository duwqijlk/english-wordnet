simpleMeaning: A sleep-like state brought on by hypnosis, in which the person accepts the ideas put forward
  by the person doing the hypnosis
scope: This is a sleep-like state brought on by hypnosis in which the person accepts the ideas put forward
  by the person doing the hypnosis, not ordinary sleep and not a daydream.
examples:
- She fell into a hypnotic trance during the show.
- The hypnotic trance left him open to new ideas.
