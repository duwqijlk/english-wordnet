simpleMeaning: A sea growth, most of all from the Mediterranean, pink or rose-coloured, used to make things
  to wear and pretty things to look at
scope: A living sea growth, most of all from the Mediterranean, used to make things to wear and pretty
  things to look at; not the hard dead skeleton of a coral and not a white reef coral.
examples:
- She wore a necklace of red coral.
- Divers found red coral on the rocks of the Mediterranean.
