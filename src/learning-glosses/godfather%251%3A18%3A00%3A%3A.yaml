simpleMeaning: A man who, at a child's baptism, takes on the duty of standing by the child as its sponsor
scope: This is the man who takes the sponsor's part at a child's baptism, not a man who is only like a
  sponsor to a child, and not the child's father.
examples:
- He asked his best friend to be the child's godfather.
- At the baptism, the godfather held the baby while the priest poured the water.
