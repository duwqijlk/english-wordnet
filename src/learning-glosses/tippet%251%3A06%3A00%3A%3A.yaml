simpleMeaning: Often made from the whole skin of a fox or a marten, a fur cape with ends that hang down,
  worn over a woman's shoulders.
scope: This fur cape is worn over a woman's shoulders and often made from the whole skin of a fox or a
  marten, not a coat with sleeves.
examples:
- She wore a tippet of grey fox fur over her coat.
- The tippet hung down her back in soft folds.
