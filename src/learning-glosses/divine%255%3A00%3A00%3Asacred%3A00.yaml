simpleMeaning: given over to the worship of a god, or to work done for a god
scope: Given over to the worship or service of a god, not wonderful as if from the gods, not coming from
  God's care, and not the verbs for knowing at once or searching with a rod.
examples:
- They gathered for divine worship on Sunday.
- The divine liturgy lasted all morning.
