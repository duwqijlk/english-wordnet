simpleMeaning: a sea animal that stays fixed in one place, one of a group that includes single and grouped
  polyps; its free-swimming jellyfish stage never appears
scope: 'Also called anthozoan: a sea animal fixed in one place, not a jellyfish and not a fish.'
examples:
- The actinozoan clung to the rock and never moved.
- An actinozoan has no free-swimming stage in its life.
