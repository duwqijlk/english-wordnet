simpleMeaning: a drug seen as a hard drug, made from morphine (a drug for pain) that people cannot stop
  using; put in a vein, it gives the fastest, strongest feeling
scope: This is the strong drug made from morphine that people cannot stop using, not morphine itself and
  not a medicine for pain.
examples:
- He was arrested for selling heroin.
- Heroin ruined his health in a few months.
