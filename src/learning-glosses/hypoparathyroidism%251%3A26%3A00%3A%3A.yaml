simpleMeaning: Too little parathyroid hormone released, resulting in abnormally low calcium in the blood.
scope: This is the state in which the small glands in the neck make too little of their body chemical,
  so the blood holds far too little calcium, not too much.
examples:
- Low calcium in the blood pointed to hypoparathyroidism.
- Hypoparathyroidism kept the blood short of calcium.
