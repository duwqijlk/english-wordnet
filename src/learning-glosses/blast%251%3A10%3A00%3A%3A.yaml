simpleMeaning: very strong words that say a person or thing is bad
scope: Strong words against a person or thing, also called attack and also called fire. It is not a sudden
  loud noise, and it is not a plant drying up and dying.
examples:
- The mayor faced a blast from angry voters.
- The new plan drew a blast from the press.
