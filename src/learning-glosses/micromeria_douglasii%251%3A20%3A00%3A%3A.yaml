simpleMeaning: A low herb that trails along the ground, lives many years and stays green, of the north-west
  of the United States, with small white flowers; used as medicine
scope: Also called yerba buena, Micromeria chamissonis and Satureja douglasii; a low trailing herb of
  the north-west of the United States with small white flowers, used as medicine, not a tall herb.
examples:
- Micromeria douglasii trails along the ground in the north-west.
- Micromeria douglasii is used as medicine.
