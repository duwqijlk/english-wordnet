simpleMeaning: The part of the United States government that works to make the working conditions of wage
  earners better, set up in 1913
scope: Also called Labor, DoL and the Department of Labor, it is the part of the United States government
  that works to make the working conditions of wage earners better, not a state office and not a private
  group.
examples:
- The Labor Department was created in 1913.
- The Labor Department works to improve working conditions.
