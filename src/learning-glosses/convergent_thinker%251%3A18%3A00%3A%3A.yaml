simpleMeaning: A person who sticks to the question as asked and joins facts and what is known to reach
  an answer.
scope: Also called solver; a person who sticks to the question as asked to reach an answer, not a person
  who looks for many new ideas and not a person who gives up.
examples:
- The convergent thinker worked straight to the answer.
- As a convergent thinker, she stuck to the question as asked.
