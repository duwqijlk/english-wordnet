simpleMeaning: An open box fixed to a long pole handle, used to carry bricks or mortar (a wet paste that
  sticks bricks together) on the shoulder
scope: A tool for carrying bricks or wet building paste on the shoulder at a building place, not a plain
  bucket carried by hand and not a wheelbarrow.
examples:
- The worker carried bricks up in a hod on his shoulder.
- He put the wet mix into the hod and lifted it onto his shoulder.
