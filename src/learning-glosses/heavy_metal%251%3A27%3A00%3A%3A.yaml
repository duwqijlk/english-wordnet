simpleMeaning: A metal of high density, more than about five times the weight of water, or of high atomic
  weight, especially one that poisons, like mercury or lead.
scope: This is a metal of high density or high atomic weight, not the loud rock music of the same name
  or a light metal.
examples:
- Heavy metal poisoning can come from lead in old paint.
- Mercury is a heavy metal that can poison people.
