simpleMeaning: the act of taking grain or seeds away from the dry outer parts and stems of the plant
scope: The work of taking grain or seeds from a plant, not the grain itself and not the dry parts left
  behind.
examples:
- They did the threshing after they cut the wheat.
- Threshing took all day, and a pile of clean grain grew beside the barn.
