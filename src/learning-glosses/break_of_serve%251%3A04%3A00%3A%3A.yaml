simpleMeaning: In tennis, the score got by winning a game against the player who began play
scope: 'Also called break: in tennis, the score got by winning a game against the player who began play,
  not a score got by winning a game as the player who began play and not a single point.'
examples:
- She got a break of serve in the third game.
- He was up two breaks of serve in the second set.
