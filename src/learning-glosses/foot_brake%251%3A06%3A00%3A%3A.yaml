simpleMeaning: A device that uses liquid pressure to slow or stop a moving thing when a person presses
  down a pedal.
scope: A pedal-worked stop device, not a hand-worked stop device and not a stop device worked by pulling
  a lever.
examples:
- She pressed the foot brake gently as she drove up to the lights.
- The foot brake on his old car needed a hard push to work.
