senseId: 'fair_trade%1:04:01::'
synsetId: 01094327-n
simpleMeaning: buying and selling that meets set rules about how goods are made and moved, usually giving
  makers a just price, and often caring for people and the land
scope: This is buying and selling under rules that protect makers and the land; not ordinary buying and
  selling and not a gift.
examples:
- Fair trade coffee pays the growers a just price.
- She buys fair trade goods to support the makers.
