senseId: 'poetiser%1:18:00::'
synsetId: 10548068-n
simpleMeaning: Used with scorn for small or weak writers of verse, this is a name for a writer of rhymes
  who makes poor verses.
scope: A poetizer, a rhymer, a rhymester and a versifier are other names for this writer of poor rhyming
  verse, a name used with scorn for small or weak writers.
examples:
- They called him a poetiser.
- The poetiser wrote poor verses.
