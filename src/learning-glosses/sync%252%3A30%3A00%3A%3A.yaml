senseId: 'sync%2:30:00::'
synsetId: 00394859-v
simpleMeaning: Make two or more things match each other in time and in the way they happen.
scope: To make things match in time and in the same way; not to match by luck, and not to start together
  without adjusting.
examples:
- Let's sync our watches so we start together.
- She synced the music to the film.
