simpleMeaning: Into the first part of the small gut opens a tube made where the tube from the liver joins
  the tube from the gall bladder.
scope: Also called common bile duct, this names the tube where the liver tube and the gall bladder tube
  join before opening into the gut.
examples:
- The bile duct opens into the first part of the small gut.
- The tube from the liver joins the bile duct near the gall bladder.
