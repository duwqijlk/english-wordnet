simpleMeaning: A tiny bit of matter that stays as it is, with a plus charge as big as the minus charge
  of an electron.
scope: Of a stable particle with a positive charge equal in size to an electron's negative charge, not
  an electron itself.
examples:
- A proton carries a positive charge.
- Protons sit in the heart of the atom.
