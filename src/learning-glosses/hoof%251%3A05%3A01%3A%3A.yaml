simpleMeaning: The hard covering on the end of the foot of an animal such as a horse or a cow
scope: The hard covering on the end of the foot of an animal such as a horse or a cow, not a foot itself
  and not a shoe.
examples:
- The horse's hoof struck sparks on the stones.
- The vet trimmed the cow's hoof.
