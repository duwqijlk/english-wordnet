simpleMeaning: quick and skilful with the hands, really or in a loose sense, and most of all at stealing
  or taking things from pockets
scope: Quick and skilful with the hands, above all at stealing; nimble-fingered is another name for this
  sense, not clumsy and not merely quick at a craft.
examples:
- The light-fingered burglar could crack the combination of a bank vault.
- The light-fingered pickpocket slipped the wallet from his coat.
