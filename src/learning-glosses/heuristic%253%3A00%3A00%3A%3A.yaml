simpleMeaning: Of a way of working that uses a broad plan to guide the search for an answer.
scope: Of a way of working that uses a broad plan to guide the search for an answer, not the noun use
  for a common-sense rule meant to make solving a problem more likely.
examples:
- Their approach was heuristic, using broad rules to guide the search.
- The method they used was heuristic, guided by broad rules rather than exact steps.
