simpleMeaning: advice to go to a skilled person or group for help, after someone has sent you to them
scope: This is the advice to go to a skilled person or group, not the act of sending someone on and not
  the person who has been sent.
examples:
- She got a referral to a heart doctor from her own doctor.
- You need a referral before you can see the specialist.
