senseId: 'shout%2:32:01::'
synsetId: 00915018-v
simpleMeaning: To let out a sudden, loud sound in one burst.
scope: A single sudden loud sound, also called a cry or a call, not a habitual loud way of speaking and
  not a spoken exclamation of surprise, horror or joy.
examples:
- She shouted to warn the children as the car came round the bend.
- He shouted across the valley, hoping his brother would hear.
