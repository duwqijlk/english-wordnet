simpleMeaning: A way to keep records for goods held for sale, where the goods got earliest are taken as
  the goods sold earliest.
scope: A way to keep records for goods held for sale, where the goods got earliest are taken as the goods
  sold earliest; not a way to sell the newest goods at the start and not a way to count goods by hand.
examples:
- The shop uses first in first out for its stock.
- With first in first out, the oldest goods are sold before the new ones.
