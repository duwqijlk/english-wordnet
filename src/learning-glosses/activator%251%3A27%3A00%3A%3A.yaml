simpleMeaning: Any thing that starts a change going, such as a molecule that speeds up an enzyme or a
  protein that helps a gene's code give out more of its product.
scope: Any thing that starts a change going, not a thing that stops a change.
examples:
- The activator switched on the enzyme within seconds.
- Without the activator, the gene stayed silent.
