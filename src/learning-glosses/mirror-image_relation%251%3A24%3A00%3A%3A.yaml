simpleMeaning: The link of being opposites between crystals or molecules that are reflections of one another.
scope: 'Also called enantiomorphism: the link of being opposites between crystals or molecules that are
  reflections of one another, not a likeness and not a chemical bond.'
examples:
- A mirror-image relation holds between the two crystals.
- The two forms show a mirror-image relation.
