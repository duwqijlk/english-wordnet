simpleMeaning: In Hebrew writing, a word with this mark over it stands apart from the next word, more
  or less, in sound and in grammar.
scope: In Hebrew writing, a mark that sets a word apart from the next one, not a joining mark.
examples:
- The separative accent set the word apart from the next one.
- A separative mark shows the word stands apart in sound and grammar.
