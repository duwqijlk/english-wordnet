simpleMeaning: a wild party or meeting where people drink too much and have sex with many different people
scope: This is a wild party or gathering where people drink too much and have sex with many different
  people. It is not the verb sense of taking part in violent trouble in public, and not the verb sense
  of having a loud, happy, drunken time.
examples:
- The party turned into a riot, with guests drinking far too much and having sex with people they had
  only just met.
- What started as a small party ended as a riot, with drunken guests having sex with one partner after
  another.
