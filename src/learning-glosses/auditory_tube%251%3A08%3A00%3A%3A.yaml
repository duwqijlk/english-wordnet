simpleMeaning: Keeping the air pressure the same on both sides of the eardrum, one of a pair of passages
  joining the middle ear to the back of the nose
scope: One of a pair of passages, it joins the middle ear to the back of the nose and keeps the air pressure
  the same on both sides of the eardrum, not the eardrum itself.
examples:
- The auditory tube lets air reach the middle ear from the back of the nose.
- The auditory tube keeps the air pressure even on both sides of the eardrum.
