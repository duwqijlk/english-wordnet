simpleMeaning: To give a bishop his tall head-dress.
scope: This sense is to give a bishop his tall head-dress, unlike the sense for a church head-dress worn
  by bishops on set days, unlike the sense for cutting edges slantwise, to make a corner join, unlike
  the sense for the face of a slanted piece-end where a corner join is made, and unlike the sense for
  fitting together in a corner join.
examples:
- They mitered the bishop, giving him a miter.
- Mitering gives a bishop a miter.
