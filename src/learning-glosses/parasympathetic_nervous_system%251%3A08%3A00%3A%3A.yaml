senseId: 'parasympathetic_nervous_system%1:08:00::'
synsetId: 05513330-n
simpleMeaning: 'Nerve network starting in the brain stem and lower spinal cord that opposes sympathetic
  signals: it increases digestive flow, slows the heart, narrows the pupils and widens blood vessels.'
scope: The same rest-and-digest network under its full name, not the shortened noun parasympathetic and
  not the opposing sympathetic system.
examples:
- The parasympathetic nervous system calms the body once danger has passed.
- Damage to the parasympathetic nervous system can leave digestion sluggish.
