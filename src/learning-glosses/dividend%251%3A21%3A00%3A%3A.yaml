simpleMeaning: part of the money a company makes that is paid to people who own parts of the company,
  usually paid every three months
scope: This is money paid by a company to its owners, not the number that is divided by another number
  in maths.
examples:
- The company paid a dividend to everyone who owns its shares.
- She gets a dividend every three months from her shares.
