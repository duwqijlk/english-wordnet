simpleMeaning: A move in which a person lifts a weight from shoulder height to above their head, and their
  arms become straight as they lift it
scope: A weight-lifting move that takes a weight from the shoulders to above the head; it is not dried
  meat and not a sudden move of the body.
examples:
- In the jerk, he lifted the bar from his shoulders to high above his head.
- Her jerk took the bar from shoulder height to a straight hold over her head.
