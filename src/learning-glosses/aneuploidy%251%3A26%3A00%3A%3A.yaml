simpleMeaning: The threads that carry the plans for life are not present in whole sets — one set is not
  complete — and that is the fault.
scope: This fault is a wrong count of the threads that carry the plans for life, with one set not complete.
examples:
- Aneuploidy meant one set was not complete.
- They found aneuploidy when they counted the sets.
