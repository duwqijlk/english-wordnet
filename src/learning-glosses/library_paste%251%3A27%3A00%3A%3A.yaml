simpleMeaning: For use on paper and thick paper, this sticky stuff is made of water and flour or starch
scope: 'Also called paste: a sticky stuff for paper, not a glue for wood and not a paste for food.'
examples:
- She spread library paste on the back of the poster.
- The bookbinder used library paste to fix the torn page.
