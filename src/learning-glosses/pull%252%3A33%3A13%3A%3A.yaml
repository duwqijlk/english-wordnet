simpleMeaning: To back a person, team, or cause, join their side, and feel strong sympathy for them.
scope: This is emotional or public support for a side, not the physical act of moving something toward
  you, nor the act of moving something by force in a direction.
examples:
- Everyone in the office is pulling for the new manager.
- I'm pulling for the underdog in tonight's final.
