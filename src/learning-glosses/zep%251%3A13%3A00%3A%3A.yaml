simpleMeaning: A large sandwich with a long crust roll cut lengthwise, packed with meats, cheese, and
  tomato, onion and lettuce and sauces, with other names in other lands.
scope: This sense is also called hero, wedge, submarine, sub, bomber, grinder, torpedo, hero sandwich,
  hoagie, hoagy, poor boy, and submarine sandwich, a big sandwich made from a long crusty roll cut down
  its length and filled with meat and cheese, tomato, onion, lettuce, and sauces, with different names
  in different parts of the United States.
