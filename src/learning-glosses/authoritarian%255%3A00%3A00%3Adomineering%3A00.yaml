simpleMeaning: expecting others to do what they are told, without asking questions
scope: 'Also called overbearing and dictatorial: expecting people to obey without questions, not a person
  who rules in a cruel way and not the sense about a ruler with full power.'
examples:
- She has an authoritarian manner and expects her children to obey at once.
- An authoritarian teacher will not let the class ask why a rule was made.
