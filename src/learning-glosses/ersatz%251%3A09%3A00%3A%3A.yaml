simpleMeaning: a copy or a thing used in place of the real thing, made by people and not as good as the
  real thing
scope: This is the thing used in place of a real thing, not the real thing itself.
examples:
- The ersatz was cheap, but it did not taste like real coffee.
- This ersatz looks like leather, but it tears very easily.
