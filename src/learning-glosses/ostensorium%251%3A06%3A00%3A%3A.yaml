simpleMeaning: In the Roman Catholic Church, a holder, most often of gold or silver, in which the holy
  bread is shown for people to honour
scope: 'Also called monstrance: in the Roman Catholic Church, a holder in which the holy bread is shown
  for people to honour, not a cup for drinking and not a box for keeping the bread shut away.'
examples:
- The priest set the ostensorium on the altar for all to see.
- The gold ostensorium held the holy bread up for honour.
