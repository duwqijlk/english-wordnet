simpleMeaning: A broad panel of cloth, usually canvas, spread to catch the wind and push a boat forward
scope: The cloth that catches the wind to move a boat; sail, canvas and canvass are other names for this
  same thing, not the rope that sets its angle and not a bed covering.
examples:
- The sheet billowed out as the wind filled it.
- They sewed a patch onto the torn sheet before setting sail.
