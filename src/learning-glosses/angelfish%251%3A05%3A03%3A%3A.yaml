simpleMeaning: Shaped like a disk, with a deep body, this food fish comes from the warmer coastal waters
  of the western Atlantic.
scope: This is a food fish of the warmer coastal waters of the western Atlantic, also called spadefish,
  not the flat-bodied shark that shares the same name.
examples:
- The angelfish swam in the warmer coastal waters of the western Atlantic.
- The angelfish was deep-bodied and shaped like a disk.
