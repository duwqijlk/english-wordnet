simpleMeaning: In grammar, the form of a noun used when it is the person or thing that does the action
  of a verb
scope: 'Also called nominative or nominative case: the form of a noun that does the action of a verb,
  not the form used for the thing acted on and not the form used after a word like ''to''.'
examples:
- In 'She runs', 'she' is in the subject case.
- The subject case shows who does the action in the sentence.
