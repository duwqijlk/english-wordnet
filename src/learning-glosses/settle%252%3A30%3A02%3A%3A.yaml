simpleMeaning: to make a lasting home and a steady life in one place
scope: Becoming stable in a place and way of life, not moving in and taking up residence, coming to rest
  on a surface, or clearing a liquid.
examples:
- After years of traveling, they settled in a small town by the sea.
- The family settled for good once the children started school.
