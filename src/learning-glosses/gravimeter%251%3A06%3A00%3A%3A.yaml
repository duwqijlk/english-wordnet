simpleMeaning: A tool for finding the weight of a liquid or solid for its size, compared with water
scope: This is a tool for finding how heavy a liquid or solid is for its size; hydrometer is another name
  for it, not a tool for finding changes in the pull of the earth.
examples:
- She used a gravimeter to test the liquid.
- The gravimeter showed the oil was lighter than water.
