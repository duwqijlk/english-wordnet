scope: Any of several plants with big leaves and yellow flowers in branching groups; a source of jute,
  a rough plant fibre; not a plant with white flowers, and not a plant grown for its fruit.
examples:
- The corchorus grew tall with yellow flowers in the field.
- Farmers cut corchorus for jute fibre.
