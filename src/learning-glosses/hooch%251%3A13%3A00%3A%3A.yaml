simpleMeaning: a drink with alcohol, made against the law by heating a liquid and cooling the gas that
  rises from it to make it stronger, and usually of poor quality
scope: 'Also called hootch: a drink with alcohol made against the law, not alcohol sold in a shop in the
  normal legal way.'
examples:
- He made hooch in a shed and sold it in secret.
- The police found bottles of hooch hidden in the barn.
