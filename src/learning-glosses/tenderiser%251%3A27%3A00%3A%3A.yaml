simpleMeaning: something put on meat to make it soft, such as papain, an enzyme from a plant
scope: 'Also called a tenderizer: something put on meat to soften it, not a spice for taste and not a
  sauce for serving.'
examples:
- She rubbed tenderiser into the steak before cooking it.
- A little tenderiser made the tough meat soft.
