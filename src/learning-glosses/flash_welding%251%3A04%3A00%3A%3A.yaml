simpleMeaning: A spark of power made between the two ends of metal pipe melts them and sticks them together,
  a way of joining lengths of pipe end to end
scope: 'Flash butt welding is another name for this: a spark of power between the ends of metal pipe melts
  them and sticks them together, joining lengths of pipe end to end.'
examples:
- They chose flash welding to join the pipe.
- Flash welding joined the two ends of the pipe.
