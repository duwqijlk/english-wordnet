simpleMeaning: A worked-out value of a firm, found by multiplying the number of shares out by the price
  of one share now
scope: Also called market capitalization; a worked-out value of a firm from its shares, not the price
  of one share and not the firm's cash in hand.
examples:
- The market capitalisation of the firm rose sharply.
- Market capitalisation is found from the share price.
