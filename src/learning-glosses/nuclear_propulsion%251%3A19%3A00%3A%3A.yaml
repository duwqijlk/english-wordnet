simpleMeaning: The use of an atom-powered machine to make electric power for an engine, as in a boat running
  under water, or to heat the stuff that drives a rocket directly
scope: The use of an atom-powered machine to make electric power for an engine or to heat the stuff that
  drives a rocket directly; not a machine that burns oil, and not a sail.
examples:
- Nuclear propulsion lets the boat stay under water for months.
- The rocket uses nuclear propulsion to heat the stuff that drives it.
