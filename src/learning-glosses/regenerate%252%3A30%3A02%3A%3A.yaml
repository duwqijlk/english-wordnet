simpleMeaning: to grow new living matter to take the place of a body part or a part of the body
scope: To grow new living matter to take the place of a body part or a part of the body; not to make a
  current stronger, not to turn to a better life, and not the thing itself growing back.
examples:
- The snake regenerated its tail after losing it.
- A lizard can regenerate a lost tail.
