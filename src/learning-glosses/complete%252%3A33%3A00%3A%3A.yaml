simpleMeaning: to make a pass succeed by getting the ball to a teammate.
scope: This is a successful pass in a ball game, not bringing something to a finish or an end, not making
  something whole by adding all its necessary parts, not carrying out or performing a task, not writing
  all the required details on a form, and not the adjective senses meaning whole, perfect, highly skilled,
  utter, or finished.
examples:
- The quarterback completed a pass to the tight end for a first down.
- She completed a short pass under pressure and kept the drive alive.
