simpleMeaning: a thin part on the jaws of a fish, used by the fish to sense touch
scope: Also called barbel. This is a thin touch part on a fish's jaws, not the paired head part of an
  insect, not a power to notice things, and not a suggestion put out to see how others act.
examples:
- The catfish used its feelers to find food in the dark water.
- A feeler on each side of the fish's mouth helped it sense the river bed.
