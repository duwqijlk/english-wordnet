simpleMeaning: The bone in the ankle that meets the bones of the leg, making the joint where the foot
  turns.
scope: Also called talus, astragal, and astragalus; the bone in the ankle that articulates with the leg
  bones to form the ankle joint.
examples:
- He broke his anklebone in the fall.
- The anklebone lets the foot bend up and down.
