simpleMeaning: the angle that half the Earth's width at its middle makes when seen from the sun
scope: The angle half the Earth's width at its middle makes as seen from the sun, not the distance to
  the sun and not a measure of the Earth's size.
examples:
- The solar parallax helps astronomers work out the distance to the sun.
- By measuring the solar parallax, scientists fixed the size of one astronomical unit.
