senseId: 'divider%1:06:00::'
synsetId: 03900076-n
simpleMeaning: a wall or other upright thing that keeps one room or space apart from another
scope: This sense is also called partition. It is a wall or upright thing that keeps spaces apart, not
  a tool for measuring lines and not a person who puts living things into groups.
examples:
- A low divider split the office into two work areas.
- They put a wooden divider between the beds in the shared room.
