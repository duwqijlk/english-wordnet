senseId: 'hero-worship%2:37:00::'
synsetId: 01781934-v
simpleMeaning: To love someone or something far too much, without asking questions or seeing faults, and
  to treat it like a god.
scope: To love someone or something far too much and treat it like a god; worship, revere, idolize and
  idolise are other names for this sense, and this is not fair praise for real good work.
examples:
- Teenagers hero-worshipped the singer and copied everything she did.
- He hero-worships the football star and never sees his faults.
