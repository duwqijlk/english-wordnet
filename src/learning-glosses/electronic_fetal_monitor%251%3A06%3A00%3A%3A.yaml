simpleMeaning: A machine that watches a baby's heartbeat and the squeezes of the mother's womb while she
  gives birth
scope: 'Also called electronic foetal monitor, fetal monitor, and foetal monitor: a machine that watches
  a baby''s heartbeat and its mother''s womb during birth, not a machine that watches an adult''s heartbeat.'
examples:
- The nurse checked the electronic fetal monitor during labour.
- An electronic fetal monitor showed the baby's heartbeat was steady.
