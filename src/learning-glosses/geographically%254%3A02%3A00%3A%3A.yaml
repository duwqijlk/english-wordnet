simpleMeaning: in a way that has to do with where places are, and with the land, rivers and towns in an
  area
scope: This is about where places are and how their land is set out, not about time, people or money.
examples:
- The town is geographically in the north, but its weather is warm.
- They live geographically far from the sea, near the mountains.
