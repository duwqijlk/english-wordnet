simpleMeaning: a lung illness caused by breathing in coal dust
scope: 'Also called black lung, black lung disease or coal miner''s lung: a lung illness from breathing
  in coal dust, not other lung illnesses and not a short cough from dust.'
examples:
- Years of work in the mine left him with anthracosis.
- The doctor said the miner's anthracosis came from years of coal dust.
