simpleMeaning: Lines with eight syllables make up this poem, or one such line of verse
scope: A line of verse with eight syllables, or a poem of such lines; not a line with a different count
  and not a poem of mixed lines.
examples:
- He wrote the song in octosyllables, eight syllables to a line.
- This octosyllable has eight syllables, one for each beat.
