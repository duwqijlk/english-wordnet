simpleMeaning: Small flowers in big bunches crowd this strong-growing rose, which serves for hedges and
  for growing new roses on.
scope: Also called multiflora and multiflora rose, this rose bears many small flowers in big bunches and
  serves for hedges and for growing new roses on.
examples:
- The baby rose grew thick and bore bunch after bunch of small flowers.
- We cut the baby rose back after it flowered.
