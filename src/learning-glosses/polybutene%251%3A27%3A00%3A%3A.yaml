simpleMeaning: a man-made material made by joining many small parts of butylene, a chemical, used in oils
  that help machines move and in man-made rubber
scope: Also called polybutylene, this is a man-made material made by joining many small parts of butylene,
  a chemical, used in oils that help machines move and in man-made rubber, not a natural rubber.
examples:
- Polybutene is used in the oil that keeps the machine parts moving.
- They mix polybutene into man-made rubber to help it bend and last.
