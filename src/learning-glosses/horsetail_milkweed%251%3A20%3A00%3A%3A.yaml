simpleMeaning: A plant that grows in the south-west of the United States and Mexico and is bad for farm
  animals to eat
scope: A plant that grows in the south-west of the United States and Mexico and is bad for farm animals
  to eat, also called poison milkweed; not a plant safe for farm animals to eat, and not a plant of the
  north.
examples:
- Horsetail milkweed grows in the south-west of the United States and Mexico.
- The farmer pulled up the horsetail milkweed before the cattle could eat it.
