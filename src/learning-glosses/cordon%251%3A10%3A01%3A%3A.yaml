simpleMeaning: a thin rope or ribbon worn as a sign of honor or of a high place in a group
scope: This one is worn to show honor or a high place, not just to look nice, and not a line of guards
  around a place.
examples:
- The officer wore a gold cordon to show his rank.
- She was given a cordon as a sign of honor for her work.
