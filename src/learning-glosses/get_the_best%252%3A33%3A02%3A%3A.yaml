senseId: 'get_the_best%2:33:02::'
synsetId: 01106429-v
simpleMeaning: Most often, a thing beats a person who has done nothing wrong and is not weak
scope: Also called have the best and overcome; to win over a person who has done nothing wrong and is
  not weak, not to win a game and not to beat someone by being stronger.
examples:
- Tiredness got the best of him in the end.
- Her illness got the best of her, though she fought hard.
