simpleMeaning: One of several trees of the East Indies that yield a tough rubber-like sap, of the getah
  taban merah or getah taban sutra kinds.
scope: Also called gutta-percha tree; its sap is of the getah taban merah or getah taban sutra kinds.
examples:
- The Palaquium gutta yields a sap that hardens into a tough material.
- Workers tapped a Palaquium gutta for its milky sap.
