simpleMeaning: A root of a back nerve, one of two, that passes back from the cord of the spine, made of
  threads that carry sense.
scope: This sense is also called dorsal horn, posterior horn, and posterior root, a root of a back nerve,
  one of two, that passes back from the cord of the spine, made of threads that carry sense.
examples:
- Dorsal roots carry sense.
- The dorsal root passes back from the spine cord.
