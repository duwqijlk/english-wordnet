simpleMeaning: that stops disease from starting or helps stop it from starting
scope: 'Also called preventive and prophylactic: describing something that stops disease or helps stop
  it. Not the noun sense of a thing that blocks the way, and not a medicine itself that prevents or slows
  an illness.'
examples:
- Clean water is a preventative step against disease.
- Doctors give preventative care to keep people well.
