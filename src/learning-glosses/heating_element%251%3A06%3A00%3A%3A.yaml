simpleMeaning: Fuel or power is turned into heat by this part of a stove or cooker
scope: The part of a stove or cooker that turns fuel or power into heat, not the whole stove and not a
  switch that turns it on.
examples:
- The heating element in the oven had burned out.
- She replaced the heating element in the old cooker.
