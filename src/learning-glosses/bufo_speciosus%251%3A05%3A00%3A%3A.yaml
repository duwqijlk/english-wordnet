simpleMeaning: A toad that digs burrows and comes out at night, living in mesquite woods and grasslands
  of the south-west United States.
scope: Also called Anaxyrus speciosus and the Texas toad, this is a toad that digs burrows and comes out
  at night, living in mesquite woods and grasslands of the south-west United States, set apart from toads
  that live above ground and from toads of other parts of the United States.
examples:
- Bufo speciosus hid under the mesquite roots all day.
- We heard Bufo speciosus calling after dark.
