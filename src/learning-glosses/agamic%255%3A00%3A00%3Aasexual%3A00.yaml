simpleMeaning: In reproduction, not needing a male cell and a female cell to join
scope: In reproduction, not needing a male cell and a female cell to join; agamogenetic, agamous, apomictic
  and parthenogenetic are other names for this, not the usual kind of reproduction in which two cells
  join.
examples:
- Some plants use agamic reproduction to make seeds without joining cells.
- Agamic plants need no male and female cells to join.
