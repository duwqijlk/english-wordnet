simpleMeaning: In virology, a whole virus particle is the stuff that carries its code, wrapped in a shell,
  with a fatty skin in some viruses.
scope: In virology, a whole virus particle, not a broken piece of one.
examples:
- Each virion carries the virus's code inside a shell.
- A virion in some viruses also has a fatty skin.
