schema: oewn-learning-gloss-v2
senseId: 'hoodwink%2:32:00::'
synsetId: 00840873-v
simpleMeaning: to keep your real aims hidden, especially by putting on a big, false show of good aims,
  so you can get what you want
scope: This sense is also called snow, bamboozle, lead by the nose, play false, and pull the wool over
  someone's eyes. It is hiding your real aims to trick people, not just telling a simple lie.
examples:
- He hoodwinked his teachers into thinking he knew the subject well.
- She hoodwinked the buyers by acting kind while hiding her real plan.
