simpleMeaning: Quiet and shy, and getting little done.
scope: Also called mousy, quiet and shy, and getting little done; not the use for a thing of a dull pale
  brown colour like a mouse.
examples:
- She was mousey at parties, saying little and keeping to the edge of the room.
- The new clerk was mousey, too shy to ask for help.
