simpleMeaning: the state of being active and working on something, or of seeming to be active and working
  on something
scope: 'Also called hum: the state of being busy or seeming busy, not one single job or task on its own.'
examples:
- The busyness of the market surprised her on a Monday morning.
- There was a happy busyness in the kitchen before the party.
