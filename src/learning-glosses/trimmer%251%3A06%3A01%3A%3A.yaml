simpleMeaning: A part that stores electric charge and can be set to hold more or less of it, used to make
  fine adjustments.
scope: A part that stores charge and can be set, not the wood beam in a floor or roof and not a worker
  who cuts back trees and bushes.
examples:
- He turned the trimmer to tune the radio.
- The trimmer in the set lets you make fine adjustments to the signal.
