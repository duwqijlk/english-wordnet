simpleMeaning: The act of saying you do not agree, in words spoken aloud in a row or dispute.
scope: Spoken words of not agreeing, not a lasting clash of views or ways.
examples:
- Their disagreement filled the hall.
- A disagreement over money ended the meeting early.
