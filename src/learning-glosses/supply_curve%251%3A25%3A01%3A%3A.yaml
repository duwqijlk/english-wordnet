simpleMeaning: In economics, a graph that shows how the price of a thing and the amount a seller can and
  will sell at that price go together
scope: This is a graph that ties price to the amount sellers will sell, not a demand curve, which ties
  price to what buyers will buy.
examples:
- The supply curve rises when the price goes up.
- She drew a supply curve to show how many cups the shop would sell at each price.
