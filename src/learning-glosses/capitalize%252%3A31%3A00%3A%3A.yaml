senseId: 'capitalize%2:31:00::'
synsetId: 00732985-v
simpleMeaning: to treat money spent as a thing of value that a company owns, not as a cost of running
  the business
scope: It is a way of treating money spent in the company books, not changing money kept aside into capital,
  not giving a business capital, and not writing in big letters.
examples:
- The firm decided to capitalize the cost of the new machines.
- They capitalize spending on software instead of counting it as a day-to-day cost.
