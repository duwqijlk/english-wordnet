simpleMeaning: in a shape that is not even and not the same in all its parts
scope: 'This sense is only about shape: not even in form, not about happening at uneven times and not
  about doing things in a way that breaks a pattern or rule.'
examples:
- The stones were irregularly shaped, with no two sides the same.
- The shell was irregularly shaped, wide at one end and narrow at the other.
