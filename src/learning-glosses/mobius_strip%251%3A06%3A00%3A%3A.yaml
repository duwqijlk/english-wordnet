simpleMeaning: A closed shape with one unbroken side, made from a long flat four-sided piece by turning
  one end halfway round and joining it to the other end
scope: This is a closed shape with one unbroken side, made from a long flat four-sided piece by turning
  one end halfway round and joining it to the other end, and it differs from a plain loop because its
  one side runs all the way round.
examples:
- A Mobius strip has only one side.
- He made a Mobius strip by turning one end of the paper halfway round.
