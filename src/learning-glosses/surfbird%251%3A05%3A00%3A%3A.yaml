simpleMeaning: A bird that lives along the sea shore and looks much like a sandpiper, found on the Pacific
  shores of North America and South America.
scope: A shore bird like a sandpiper on the Pacific coasts of North and South America; not a sandpiper
  itself and not a bird of the Atlantic coast.
examples:
- A surfbird ran along the rocks at the edge of the sea.
- Surfbirds spend the winter on the Pacific coast.
