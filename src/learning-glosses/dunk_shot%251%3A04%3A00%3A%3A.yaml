simpleMeaning: In basketball, a play in which the player pushes the ball down through the hoop from above
scope: A basketball play, also called dunk; not a long throw from far away and not a free throw.
examples:
- He scored with a dunk shot, pushing the ball down through the hoop.
- The crowd cheered the dunk shot at the end of the game.
