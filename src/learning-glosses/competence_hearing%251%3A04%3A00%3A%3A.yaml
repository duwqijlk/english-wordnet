simpleMeaning: A court meeting to decide if a person charged with a crime can grasp what they are charged
  with and can work with a lawyer on their case
scope: A court meeting to decide if a person charged with a crime can grasp the charges and work with
  a lawyer; not a trial of the crime itself and not a meeting to set bail.
examples:
- The judge ordered a competence hearing before the trial.
- At the competence hearing, doctors said the person could work with a lawyer.
