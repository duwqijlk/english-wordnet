simpleMeaning: to give a meaning to do with the soul to a thing, or to read it in that way
scope: 'Also called spiritualize: to give a meaning to do with the soul to a thing, or to read it in that
  way, not to clean it of worldly things and not to lift it up as holy.'
examples:
- He spiritualised the old story by giving it a deeper meaning.
- Critics spiritualise the poem when they read it that way.
