simpleMeaning: a dark oily liquid got by heating coal tar and taking the steam from it, used to stop wood
  from rotting away
scope: 'Also called coal-tar creosote: the dark liquid from coal tar used on wood, not the pale liquid
  from wood tar used to kill germs, and not the act of putting it on wood.'
examples:
- Workers brushed creosote onto the wooden fence posts to stop them rotting.
- The railway ties were covered with creosote made from coal tar.
