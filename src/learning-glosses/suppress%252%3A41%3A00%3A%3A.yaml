simpleMeaning: to hold feelings, wants, urges, or actions back on purpose and not let them show
scope: To hold back your own feelings or urges on purpose, not to stop a group or activity by force, and
  not to keep news from people.
examples:
- She tried to suppress a smile when she heard the joke.
- He suppressed his anger and spoke in a calm voice.
