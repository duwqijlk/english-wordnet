simpleMeaning: a group of television or radio stations that air the same shows as one system
scope: A group of stations airing the same shows, not a web of connected people or things, a woven fabric,
  or a set of electronic circuits.
examples:
- The show airs on a major television network.
- She works for a radio network based in London.
