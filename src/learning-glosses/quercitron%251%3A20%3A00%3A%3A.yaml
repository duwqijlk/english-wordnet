senseId: 'quercitron%1:20:00::'
synsetId: 12299975-n
simpleMeaning: A deciduous oak of the eastern United States and southeastern Canada, medium-to-large,
  with dark outer bark, yellow inner bark used for tanning, and broad leaves with five bristle-tipped
  lobes.
scope: This is the tree; the yellow dye made from its bark is a separate sense, and quercitron oak, black
  oak and yellow oak are other names for the same tree.
examples:
- Quercitron grows on dry ridges across the eastern states.
- The bark of the quercitron was stripped for tanning.
