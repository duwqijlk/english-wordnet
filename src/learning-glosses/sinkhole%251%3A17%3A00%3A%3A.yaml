synsetId: 09458643-n
simpleMeaning: A low place in the ground that joins a passage under the ground, especially in limestone,
  made when rock dissolves in water or a cave roof falls in
scope: This is a low place in the ground, also called a sink and a swallow hole, not a kitchen sink or
  a hole dug by people.
examples:
- A sinkhole opened in the road after the cave roof below fell in.
- The field has a deep sinkhole where water runs down into the rock below.
