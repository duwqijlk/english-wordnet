simpleMeaning: a change in a living thing that stops part of it, or all of it, from working as it should
scope: 'Also called illness, sickness and unwellness: this means a living thing does not work as it should,
  not just one part hurt in an accident.'
examples:
- The doctor could not find a cure for his malady.
- A strange malady made the plants stop growing well.
