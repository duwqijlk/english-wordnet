simpleMeaning: to make a low, rough, angry sound, or move while making it
scope: To make a low, rough, angry sound, or move while making it, not to say words in an angry voice
  and not to twist things into a knot.
examples:
- Bullets snarled past our heads in the dark.
- The dog snarled at the man at the gate.
