simpleMeaning: A court decision that comes from jurors wrongly giving way to each other on points that
  matter
scope: A court decision that comes from jurors wrongly giving way to each other on points that matter;
  not a fair decision all jurors truly agree on and not a decision by a judge alone.
examples:
- The compromise verdict came from jurors giving way on points that matter.
- The judge set aside the compromise verdict.
