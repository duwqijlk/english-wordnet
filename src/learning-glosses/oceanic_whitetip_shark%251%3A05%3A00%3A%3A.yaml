simpleMeaning: The most dangerous of its kind, this big deep-water fish has pale tips on its back fin
  and is found all over the world.
scope: Also called white-tipped shark and whitetip shark, this deep-water fish, found all over the world,
  has pale tips on its back fin and is the most dangerous of its kind.
examples:
- The oceanic whitetip shark swims in deep water all over the world.
- The oceanic whitetip shark has white tips on its back fin.
