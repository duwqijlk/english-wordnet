simpleMeaning: A person who looks at the money records and money past of people asking for a loan, to
  judge if they can be trusted to pay it back
scope: This is a person who looks at the money records and money past of people asking for a loan, to
  judge if they can be trusted to pay it back; not a bank manager, who runs the bank, and not an auditor,
  who checks a company's books.
examples:
- The credit analyst studied the firm's accounts before the loan was approved.
- A credit analyst checks whether a borrower is likely to repay.
