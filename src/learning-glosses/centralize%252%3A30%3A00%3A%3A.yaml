simpleMeaning: to bring things together into one main place, or under one main power that controls them
  all
scope: 'Also called centralise: to bring things into one main place or under one main control, not to
  spread them out to many places and not just to put one thing in the middle of a room.'
examples:
- The government decided to centralize all food distribution under one office.
- The company centralized its work in one city instead of many small towns.
