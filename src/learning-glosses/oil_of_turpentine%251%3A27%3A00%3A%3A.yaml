simpleMeaning: Painters thin paint with this liquid, and it also dissolves things and serves as a medicine;
  it turns to gas fast and comes from heating a sticky plant stuff.
scope: Also called turpentine, turps, and spirit of turpentine, it is a liquid used to thin paint, to
  dissolve things, and as a medicine.
examples:
- He thinned the paint with oil of turpentine.
- Oil of turpentine can also serve as a medicine.
