simpleMeaning: to eat far too much in a greedy way, taking much more than you need and not stopping
scope: 'Also called stuff, gorge, binge, engorge, overeat, satiate and overindulge: to eat too much in
  a greedy way, not to fill a market with too much of a product.'
examples:
- He glutted himself on cake at the party.
- Do not glut yourself at lunch or you will feel ill.
