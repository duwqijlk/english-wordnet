simpleMeaning: A special thickened part of each thread-like body carrying genes, which shows up when a
  cell divides, where the two halves are held together to form an X shape.
scope: This is a special thickened part of each thread-like body carrying genes, which shows up when a
  cell divides, where the two halves are held together to form an X shape; centromere is another name
  for it, not the whole thread-like body and not the centre of the cell.
examples:
- The kinetochore holds the two halves of the chromosome together.
- During cell division, each kinetochore forms part of an X shape.
