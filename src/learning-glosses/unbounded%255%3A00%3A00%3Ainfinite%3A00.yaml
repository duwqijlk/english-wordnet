simpleMeaning: seeming to have no limit in amount, number, level, or especially size
scope: Also called limitless and boundless, this means seeming to have no limit; it is not about being
  free from control or not tied up.
examples:
- She showed unbounded joy when she heard the good news.
- He worked all day with unbounded energy.
