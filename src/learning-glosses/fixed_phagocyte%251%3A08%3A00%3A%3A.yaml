simpleMeaning: Not moving about in the blood, this germ-eating cell stays put in the liver, spleen, bone
  marrow, or other such places.
scope: This is the germ-eating cell that stays put in the liver, spleen, or bone marrow, not one that
  moves about in the blood.
examples:
- The fixed phagocyte stayed in the liver while other cells moved through the blood.
- A fixed phagocyte in the spleen caught the germs that passed by.
