simpleMeaning: A married man who looks after the home while his wife earns the money for the family.
scope: A married man who looks after the home while his wife earns the money; househusband is another
  name for this sense, not a man who works outside the home and not a man who lives alone.
examples:
- He became a house husband when his wife took a job in town.
- As a house husband, he does the cooking and the cleaning.
