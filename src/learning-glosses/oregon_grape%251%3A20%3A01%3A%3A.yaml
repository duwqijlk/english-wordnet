scope: This is a showy bush of the Pacific coast with dark green leaves; holly-leaves barberry, hollygrape,
  mountain grape, Mahonia aquifolium and Oregon holly grape are other names for it, not the small grey-green-leaved
  shrub of the same name and not a bush with red berries.
examples:
- Oregon grape has clusters of yellow flowers.
