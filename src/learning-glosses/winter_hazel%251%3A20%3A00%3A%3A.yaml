simpleMeaning: Yellow blooms in hanging bunches open before the leaves on one of several kinds of Asian
  shrub, which drops its leaves each year and is grown for the show.
scope: Also called flowering hazel, it belongs with the Asian shrubs grown for yellow blooms that open
  before the leaves.
examples:
- Yellow blooms opened on the winter hazel before any leaves showed.
- The winter hazel bore hanging bunches of yellow blooms.
