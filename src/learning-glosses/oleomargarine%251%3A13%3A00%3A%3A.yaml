simpleMeaning: A spread made mostly from plant oils and used in place of butter.
scope: A spread made mostly from plant oils and used in place of butter, also called margarine, margarin,
  marge and oleo; not butter and not a spread made from animal fat.
examples:
- She spread oleomargarine on her toast.
- Oleomargarine is used in place of butter.
