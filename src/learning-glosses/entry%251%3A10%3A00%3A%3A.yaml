simpleMeaning: A piece of work sent in to be judged, as in a contest or by a publisher.
scope: This is the work itself that is handed in to be judged, not an item written in a list or record,
  and not the act of going in.
examples:
- Her entry for the architecture prize was a model of a floating school.
- The judges praised his entry for its bold design.
