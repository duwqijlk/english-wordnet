simpleMeaning: a cut in the number of a firm's shares still held, with no change in what the owners' stake
  is worth
scope: A cut in the number of a firm's shares still held, with no change in what the owners' stake is
  worth; reverse split and reverse stock split are other names for this sense, not a rise in the number
  of shares and not a change in what owners hold.
examples:
- The firm did a split down to raise the price of each share.
- After the split down, each share cost more but owners held the same total worth.
