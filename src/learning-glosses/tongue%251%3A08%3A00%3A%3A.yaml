simpleMeaning: The movable, muscular organ covered in moist membrane inside the mouth.
scope: The muscular organ inside the mouth, not the tongue of an animal eaten as meat or the flap under
  a shoe's laces.
examples:
- She burned her tongue on the hot soup.
- The doctor asked him to stick out his tongue.
