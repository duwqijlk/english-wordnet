simpleMeaning: any long, thin shape that sticks out briefly and then disappears
scope: A passing, thin shape sticking out, such as flame; not a permanent strip of land or the organ in
  the mouth.
examples:
- Tongues of flame shot from the burning roof.
- A tongue of blue fire ran along the wire.
