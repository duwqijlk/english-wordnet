simpleMeaning: Less sweet than the kinds made from flower nectar, this dark, strong, sweet food made by
  bees has a rich smell of cooked fruit or fig jam.
scope: It is a dark, strong kind of the sweet food bees make, set apart from the kinds made from flower
  nectar by its rich smell of cooked fruit or fig jam and by being less sweet.
examples:
- We bought a jar of honeydew honey.
- The honeydew honey smelled of stewed fruit.
