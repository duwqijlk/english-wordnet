simpleMeaning: a fixed bowl with water pipes that people sit on to pass urine and solid waste from the
  body
scope: 'Also called can, pot, throne, toilet, stool, potty and crapper: a toilet bowl fixed to water pipes,
  not the tall chest of drawers also called a commode.'
examples:
- He flushed the commode after using it.
- The plumber fixed the leak under the commode.
