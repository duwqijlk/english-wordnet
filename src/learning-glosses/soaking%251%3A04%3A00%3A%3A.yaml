simpleMeaning: the act of washing something by leaving it in water for a time
scope: 'Also called soak: washing a thing by leaving it in water, not the slow taking in of water by something
  left in it.'
examples:
- She gave the burnt pan a long soaking to get it clean.
- A soaking in hot water loosened the dirt on the shirts.
