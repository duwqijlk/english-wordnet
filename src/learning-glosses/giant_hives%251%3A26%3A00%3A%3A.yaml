simpleMeaning: Large patches of swelling under the skin that return, start fast and fade in a day, seen
  most in young women, often after food or drugs cause an allergy.
scope: Also called angioedema, atrophedema and periodic edema, this is a swelling under the skin that
  comes and goes, not a lasting rash.
examples:
- Giant hives appeared on her arms within an hour of the meal.
- The doctor said the giant hives would fade within a day.
