simpleMeaning: people buy and sell deals for goods here, with the goods to be handed over at a set later
  time
scope: 'Also called a futures exchange and a forward market: a place for buying and selling deals for
  goods to be handed over later, not a shop selling goods and not a place where goods are made.'
examples:
- The futures market was busy as traders bought and sold deals for coffee.
- Prices on the futures market moved up after the dry spell.
