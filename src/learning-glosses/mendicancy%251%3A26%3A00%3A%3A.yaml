simpleMeaning: the state of being a person who asks other people for food or money
scope: A life of asking other people for money or food; beggary and mendicity are other names for this
  state, not a job and not a short spell of asking for help.
examples:
- They were reduced to mendicancy after the fire took their home.
- Mendicancy was the only way left for him to eat.
