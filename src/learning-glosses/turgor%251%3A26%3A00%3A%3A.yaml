simpleMeaning: In biology, the usual firm full state of a cell or a blood tube, when what is inside presses
  hard against its wall or skin.
scope: In biology, this is the usual firm full state of a cell or a blood tube, from pressure inside it.
examples:
- The turgor of the cell kept it firm and full.
- Turgor pressed the contents hard against the cell wall.
