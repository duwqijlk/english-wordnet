simpleMeaning: This person is one of a Black people who live mostly in northern Nigeria.
scope: A member of a Black people of northern Nigeria, also called Haussa; not a speaker of the Hausa
  language and not a member of another Nigerian people.
examples:
- He is a Hausa from northern Nigeria.
- Many Hausa live in the cities of northern Nigeria.
