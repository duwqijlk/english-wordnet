simpleMeaning: A lymphocyte from bone marrow that defends the body through fluids; it spots free antigens
  in fluid and grows into plasma units that make antibodies, which switch off the antigens.
scope: Also called B lymphocyte; a white blood unit that defends the body through fluids, not a T unit
  and not a plasma unit.
examples:
- A B cell spotted the antigen and started making antibodies.
- Without enough B cells, the body cannot fight some infections.
