synsetId: 05318121-n
simpleMeaning: The thin inner skin around a young animal before it is born, in animals with backbones,
  above all when it covers the head at birth
scope: The thin inner skin around a young animal before birth, with veil as another name for this sense;
  not the layer inside the belly that covers the intestines.
examples:
- The baby was born with a caul over its head.
- A caul covered the calf's head at birth.
