simpleMeaning: the short curved hairs that line the edge of an eyelid
scope: The short curved hairs that line the edge of an eyelid, also called lash; not the lid itself.
examples:
- An eyelash fell into her eye and made it water.
- He had long eyelashes that brushed his cheeks when he blinked.
