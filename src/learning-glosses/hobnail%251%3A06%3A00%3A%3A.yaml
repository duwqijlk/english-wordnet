simpleMeaning: A short nail with a thick head, put into the bottom of a boot to keep it from wearing away
scope: This is the small nail itself that goes into the bottom of a boot, not the act of putting such
  nails into boots.
examples:
- The hobnails on his boots made a loud sound on the stone floor.
- Each hobnail in the sole helped the boot last longer.
