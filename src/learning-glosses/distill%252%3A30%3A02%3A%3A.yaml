simpleMeaning: to get a pure part from a liquid by heating it to steam and cooling the steam back
scope: To take a pure part out of a liquid by heating and cooling; extract is another name for this sense,
  and it is not cleaning a whole liquid or the liquid changing on its own.
examples:
- They distill the essence from the flowers.
- He learned to distill the oil from the leaves.
