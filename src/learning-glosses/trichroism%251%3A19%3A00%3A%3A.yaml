simpleMeaning: A stone that shows three different colours when looked at from three different sides
scope: A stone that shows three different colours from three different sides, not a stone with one colour
  only and not a stone that changes colour in light.
examples:
- The trichroism of the crystal showed blue, green, and gold.
- Turn the stone and its trichroism brings out a new colour.
