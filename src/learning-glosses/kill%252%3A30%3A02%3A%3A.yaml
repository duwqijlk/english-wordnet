simpleMeaning: completely remove a quality that is essential to something, so it is no longer truly itself.
scope: This means stripping away something's essential nature, not causing death, deleting text, or delighting
  someone.
examples:
- Adding too much water kills the flavor of the soup.
- The new rules killed the spirit of the festival.
