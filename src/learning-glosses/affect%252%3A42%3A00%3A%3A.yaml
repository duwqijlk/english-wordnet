simpleMeaning: to be tied closely to something, often in a way that makes a person look guilty
scope: 'Also called involve and regard: to be tied closely to something, often in a way that suggests
  guilt, not the noun sense of a feeling a person knows.'
examples:
- The scandal affects the mayor, tying him to the fraud.
- The new evidence affects the clerk, tying her to the theft.
