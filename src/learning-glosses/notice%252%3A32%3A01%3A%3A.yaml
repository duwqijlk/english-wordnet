simpleMeaning: To show that you have seen or know a person, as by saying hello.
scope: This is the social act of greeting or acknowledging someone you meet; it is not simply seeing something,
  and not a written statement that an agreement is ending.
examples:
- He never notices his colleagues when they pass him in the hallway.
- She noticed me with a quick nod and carried on with her call.
