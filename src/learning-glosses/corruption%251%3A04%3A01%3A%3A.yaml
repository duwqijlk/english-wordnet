simpleMeaning: getting someone in public office to break the rules of their job by bad means, such as
  a bribe, even by breaking the law
scope: Getting a public official to break the rules of their job by bad means such as a bribe, not a general
  lack of honesty and not the rotting of matter.
examples:
- He was held on charges of corruption and racketeering.
- The corruption of the official came out when the bribe was found.
