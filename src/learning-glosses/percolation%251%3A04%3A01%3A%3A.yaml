simpleMeaning: The straining of a fluid to draw out or clean it.
scope: The straining of a fluid to draw out or clean it; not the slow passing of a fluid through a filtering
  medium, nor the act of making coffee in a percolator.
examples:
- Their percolation ran at dawn.
- The percolation was done at noon.
