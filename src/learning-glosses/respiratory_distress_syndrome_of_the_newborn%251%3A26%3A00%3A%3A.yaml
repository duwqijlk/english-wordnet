simpleMeaning: Acute lung illness in babies at birth, mainly premature, where lungs cannot expand without
  a slippery coating, causing fast shallow breathing, blue skin and glassy film in the air sacs.
scope: This is the full name of the same baby lung condition; it is not the adult injury caused by breathing
  chemical fumes, nor a single short spell of hard breathing.
examples:
- Respiratory distress syndrome of the newborn is a common problem for babies born too early.
- The study looked at how respiratory distress syndrome of the newborn affects lung development.
