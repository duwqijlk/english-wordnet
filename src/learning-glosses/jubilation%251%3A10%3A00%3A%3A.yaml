simpleMeaning: sounds people make, such as shouting, that show great happiness
scope: Sounds that show great happiness, also called rejoicing and exultation; not the happy event or
  party that gives people a reason to feel this way.
examples:
- Shouts of jubilation rose from the crowd when the winner was named.
- Their jubilation could be heard across the square as they cheered and sang.
