simpleMeaning: decided by a person's own choice or liking, or sometimes by a sudden wish
scope: This describes a choice made from personal liking or a sudden wish, not a choice based on set rules
  or on chance alone.
examples:
- The judge made an arbitrary decision based only on his own liking.
- They set an arbitrary limit and then changed it on a sudden wish.
