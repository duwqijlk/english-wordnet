senseId: 'adrenalin%1:08:00::'
synsetId: 05415731-n
simpleMeaning: A body chemical made by the small glands above the kidneys when a person is under stress;
  it wakes up the nerves that work without thought.
scope: Also called adrenaline, epinephrine, and epinephrin; a body chemical made in stress, not insulin
  and not a nerve signal.
examples:
- A shot of Adrenalin steadied his heart.
- Adrenalin floods the body in a moment of fear.
