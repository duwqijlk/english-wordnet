simpleMeaning: a machine that makes a copy of a paper and sends that copy by wire or radio
scope: 'Also called fax: a machine that sends a copy of a paper by wire or radio, not the act of sending
  something with such a machine.'
examples:
- The old facsimile in the corner still sends copies over the phone line.
- She put the letter in the facsimile and pressed the start button.
