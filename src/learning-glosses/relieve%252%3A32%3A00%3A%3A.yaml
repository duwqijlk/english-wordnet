simpleMeaning: to free yourself from facts or news that have been troubling you
scope: This is about freeing yourself from troubling facts or news, not about making pain less in the
  body and not about making a strong feeling calm.
examples:
- He finally relieved himself of the secret and told his brother everything.
- She relieved herself of the sad news by telling her sister what she knew.
