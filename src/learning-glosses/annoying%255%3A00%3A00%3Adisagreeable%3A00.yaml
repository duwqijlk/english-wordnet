simpleMeaning: causing a person to feel upset and a little angry
scope: Also called teasing and irritating, this describes something that makes a person feel upset and
  a little angry; it is not the act of troubling someone.
examples:
- The annoying noise from the street kept me awake all night.
- It is annoying to wait in a long line at the shop.
