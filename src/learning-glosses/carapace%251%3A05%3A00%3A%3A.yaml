simpleMeaning: the hard outer covering of some animals, such as crabs, spiders, insects and turtles
scope: 'Also called shield, shell, or cuticle: this is the hard cover on an animal''s body, not a soft
  skin and not a house shell for people.'
examples:
- The turtle pulled its head under its carapace.
- A crab's carapace is hard and rough to touch.
