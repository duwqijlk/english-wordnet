senseId: 'limitlessness%1:07:00::'
synsetId: 05216592-n
simpleMeaning: the state of having no end and no edge at all, with nothing to mark where it stops
scope: The state of having no end and no edge at all; boundlessness, infiniteness and infinitude are other
  names for this sense, not a very large amount and not a long time.
examples:
- The limitlessness of space awed the young astronomer.
- He spoke of the limitlessness of God's love.
