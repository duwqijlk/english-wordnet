simpleMeaning: that settles a result, or has the power to settle it
scope: About a vote, fact or event that settles a result, not about a person making a choice in their
  own mind.
examples:
- She cast the deciding vote, and the plan passed by one vote.
- Speed was the deciding factor in who won the race.
