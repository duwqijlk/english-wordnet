simpleMeaning: A building in which stage performances or films can be presented to an audience.
scope: This is the performance venue itself, not a home, the audience watching a show, a business organization,
  a legislative assembly, or a noble family line.
examples:
- The old movie house on Main Street now shows classic films.
- The new house seats eight hundred people.
