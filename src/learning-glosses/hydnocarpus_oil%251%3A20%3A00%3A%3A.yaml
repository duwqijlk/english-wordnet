simpleMeaning: Certain trees bear seeds that give a fatty liquid when pressed, above all one kind known
  by two names.
scope: The fatty liquid pressed from the seeds of certain trees, above all one kind known by two names,
  is the oil this names.
examples:
- The seeds were pressed, and hydnocarpus oil ran out.
- They pressed the seeds and got hydnocarpus oil.
