simpleMeaning: A cover of stuff that joins parts together wraps round a bunch of thin cords that carry
  signals through the body.
scope: This cover wraps round a bunch of thin cords that carry signals through the body, and it is not
  the cords themselves.
examples:
- Nerve fibres in a bunch are wrapped in perineurium.
- Signals pass through the nerve fibres wrapped in perineurium.
