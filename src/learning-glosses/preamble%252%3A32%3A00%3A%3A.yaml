simpleMeaning: to give an opening part before the main part, usually for a formal document
scope: This is the act of giving a short opening, usually to a formal paper; not the opening part itself,
  which is the noun sense.
examples:
- She preambled the formal paper with a few words about its aim.
- The writer preambled the agreement by explaining why it was needed.
