simpleMeaning: An acid and a base cancel each other out and leave a salt behind. If both are strong, hydrogen
  ions and hydroxyl ions join to make water.
scope: The chemistry sense named in full, not the political or euphemistic senses of 'neutralization';
  'neutralization' and 'neutralisation' are shorter names for the same reaction.
examples:
- A neutralization reaction releases heat when an acid and a base are mixed.
- The neutralization reaction in the beaker warmed the glass noticeably.
