simpleMeaning: a beam that lies across the top of a door or window, put there to finish the opening
scope: A beam over a door or window, also called lintel. It is not a brick at the top of a wall, nor a
  line of text above a passage.
examples:
- A wooden header lies across the top of the front door.
- The builders fitted a header over the window to finish the opening.
