senseId: 'parole%1:04:00::'
synsetId: 01260381-n
simpleMeaning: In law, freedom from prison before a sentence ends, on condition that the person follows
  set rules
scope: Early release from prison under set rules; not a pardon and not the verb that releases a prisoner.
examples:
- He was released on parole after ten years.
- She broke the terms of her parole and went back to prison.
