simpleMeaning: The way of turning some plant stuff to stone by soaking with water bearing stone bits,
  keeping the first shape.
scope: The way of turning some plant stuff to stone by soaking with water bearing stone bits, keeping
  the first shape; also called petrification; not a rock made by stone-turning, a living thing soaked
  through with mineral stuff and kept in its first form.
examples:
- Their petrifaction ran at dawn.
- The petrifaction was seen at noon.
