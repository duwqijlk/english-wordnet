simpleMeaning: having parts placed in a way that does not match or balance, with no matching pattern in
  how the parts are put
scope: Also called asymmetric, this is about parts placed in a way that does not match or balance; not
  about parts placed in a matching, balanced way.
examples:
- The building has an asymmetrical front, with the door far to one side.
- Her asymmetrical haircut is short on one side and long on the other.
