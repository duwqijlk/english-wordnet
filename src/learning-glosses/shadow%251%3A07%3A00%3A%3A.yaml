simpleMeaning: a place or situation that keeps you safe from harm or from being seen
scope: A protective place of safety, not the dark area cast by an object, the spy who trails someone,
  or the verb for casting shade.
examples:
- She felt safe in the shadow of her family's name.
- The witness lived in the shadow of a powerful uncle, hidden from the men who wanted him dead.
