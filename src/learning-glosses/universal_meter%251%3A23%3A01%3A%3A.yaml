simpleMeaning: First set out by Tito Livio Burattini in 1675, a length fixed by a free pendulum's one-second
  swing, half a cm away from the length in use now.
scope: This length from a free pendulum is also called catholic meter, catholic metre, metro cattolico,
  and universal metre, and it is not the length in use today.
examples:
- The universal meter was fixed by the swing of a free pendulum.
- Burattini set out the universal meter in 1675.
