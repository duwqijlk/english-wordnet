simpleMeaning: A wedge made by the curved part of a steel plough blade, which turns the cut earth over
  as it moves
scope: A wedge made by the curved part of a steel plough blade, which turns the cut earth over as it moves;
  mouldboard is another name for this part, not the flat blade itself and not the handle of the plough.
examples:
- The moldboard turned the dark earth over in a clean strip.
- A worn moldboard leaves the furrow half turned.
