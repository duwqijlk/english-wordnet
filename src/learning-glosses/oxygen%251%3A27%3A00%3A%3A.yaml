simpleMeaning: A two-bond nonmetal gas in pairs, normally with no colour, smell, or taste, that cannot
  burn; 21% of the air by volume, the most common element in the earth's crust.
scope: A gas that makes up much of the air, not nitrogen and not a gas that burns; also called O and atomic
  number 8.
examples:
- Oxygen makes up about a fifth of the air.
- Oxygen is the most common element in the earth's crust.
