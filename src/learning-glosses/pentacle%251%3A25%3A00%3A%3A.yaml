simpleMeaning: A five-pointed star made by joining the corners of a five-sided shape with five straight
  lines, so that a smaller five-sided shape sits inside it.
scope: Also called a pentagram, a five-pointed star drawn with five straight lines joining the corners
  of a five-sided shape.
examples:
- She drew a pentacle on the cover of her notebook.
- The pentacle on the old coin had five points.
