simpleMeaning: that can be kept going for a longer time, or started again when it ends
scope: About an agreement or a set time that can be made longer or started again; not about power or materials
  that nature can make again so they never run out.
examples:
- They signed a renewable lease for the flat.
- The magazine offers renewable subscriptions for one year at a time.
