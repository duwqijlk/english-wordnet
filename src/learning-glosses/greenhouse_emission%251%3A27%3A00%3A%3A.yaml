simpleMeaning: A gas that soaks up heat rays given off by the earth and so helps to warm it.
scope: 'Also called a greenhouse gas: a gas that soaks up heat rays and helps to warm the earth, not a
  gas that cools the air and not the warming of the earth itself.'
examples:
- Carbon dioxide is a greenhouse emission that traps heat in the air.
- Scientists measure greenhouse emissions from cars and factories.
