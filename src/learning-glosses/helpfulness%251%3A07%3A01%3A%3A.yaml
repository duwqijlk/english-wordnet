simpleMeaning: friendliness that you can see in a person's kind nature and ready wish to do things for
  others
scope: 'Also called kindliness: the friendly kindness in a person''s nature, not one single act of help
  given at one time.'
examples:
- Her helpfulness and warm manner made every new student feel at home.
- The nurse was known for her helpfulness; she always had time for others.
