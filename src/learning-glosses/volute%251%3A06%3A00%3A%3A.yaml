simpleMeaning: A solid form built by winding one thing in a long run of loops.
scope: 'Also called a spiral, a coil, a whorl, and a helix: a solid form built by winding one thing in
  a long run of loops, not a flat curve that winds around a middle point, getting farther from it as it
  goes.'
examples:
- A volute of rope lay on the deck.
- The volute wound round and round in a long set of loops.
