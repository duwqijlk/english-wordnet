senseId: 'acute_myelocytic_leukemia%1:26:00::'
synsetId: 14267131-n
simpleMeaning: 'Teenagers and young grown-ups are the ones this sudden blood sickness hits most often:
  one kind of white blood cell grows too fast in number.'
scope: This is a sudden blood sickness in which one kind of white blood cell grows too fast in number;
  acute myeloid leukemia is another name for this sense, not a blood sickness that grows slowly in older
  people.
examples:
- Acute myelocytic leukemia made one kind of white blood cell grow too fast in number.
- The doctors found acute myelocytic leukemia in a teenager whose white blood cells had grown too fast
  in number.
