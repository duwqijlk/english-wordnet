simpleMeaning: With a long, thick tail marked with black and white rings, this animal of Mexico and the
  southwestern United States eats both meat and plants.
scope: This ring-tailed meat-and-plant eater of Mexico and the southwestern United States is also called
  bassarisk, cacomistle, cacomixle, civet cat, coon cat, miner's cat, ring-tailed cat and ringtail.
examples:
- We saw a raccoon fox in Mexico.
- A raccoon fox crossed the road in front of us.
