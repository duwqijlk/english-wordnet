simpleMeaning: The lines that make patterns on the skin, most of all on the tips of the fingers and the
  palms of the hands and the soles of the feet
scope: These are the lines that make patterns on the skin, most of all on the hands and feet; not wrinkles
  and not a cut or mark in the skin.
examples:
- The police took a print of his dermatoglyphics.
- The dermatoglyphic lines on the palm form a clear pattern.
