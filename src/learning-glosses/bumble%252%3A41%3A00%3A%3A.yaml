simpleMeaning: to do something badly and make a mess of it, so that it is spoiled or ruined
scope: 'Also called blow, fumble, spoil, fluff, botch, bungle, muff, bobble, mishandle and flub: to do
  a thing badly and ruin it, not to walk in an unsteady way, tripping again and again.'
examples:
- He bumbled the repair and made the machine stop working.
- She bumbled her first try at the cake and had to throw it away.
