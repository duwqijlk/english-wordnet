simpleMeaning: to cover or wrap something with a broad, thin piece of material, as when a body is draped
scope: To cover or wrap something with a broad, thin piece of material, as with a body or a load; not
  the noun for a bed covering or a flat expanse, and not the verb for heavy rain pouring down.
examples:
- They sheeted the body in white cloth before the burial.
- The workers sheeted the boxes with plastic to keep the rain off.
