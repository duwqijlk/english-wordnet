simpleMeaning: a person who is sure of themselves and acts in a smooth, pleasing way to try to make other
  people like them
scope: 'Also called smoothie and smoothy: a person with a sure, smooth and pleasing manner. Not a person
  who makes people like them, usually by good looks.'
examples:
- The salesman was a real charmer, calm and pleasing in the way he spoke.
- Everyone liked the young charmer, who always knew the right thing to say.
