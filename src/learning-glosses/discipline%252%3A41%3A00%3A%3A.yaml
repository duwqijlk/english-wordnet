simpleMeaning: to punish a person as a way to get control over them and make them do what they are told
scope: Also called correct. This sense is to punish someone to gain control and make them obey, not to
  teach a child or animal how to behave over time.
examples:
- The teacher disciplined the class for breaking the rules again.
- Parents sometimes discipline a child who hits other children.
