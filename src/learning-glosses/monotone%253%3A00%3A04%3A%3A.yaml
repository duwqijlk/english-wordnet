senseId: 'monotone%3:00:04::'
synsetId: 01551387-a
simpleMeaning: 'In maths, for a list in order or a rule that gives a value: always going up and never
  down, or always going down and never up'
scope: 'Also called monotonic: in maths, this is about a list or rule that only goes one way, not a sound
  that stays at one level and not one tone used again and again.'
examples:
- The numbers 1, 2, 3, 4 form a monotone list that keeps going up.
- A monotone function can keep going down and never go up.
