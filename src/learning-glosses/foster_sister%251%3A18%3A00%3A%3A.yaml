simpleMeaning: A girl or woman brought up by your parents, though she is not their daughter
scope: This is a girl or woman brought up by your parents, though she is not their daughter, also called
  foster-sister; it is not your parents' own daughter and not a close friend.
examples:
- My foster sister moved to the city last year.
- Her foster sister kept all her old letters.
