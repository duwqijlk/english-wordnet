simpleMeaning: Wavy petals, glossy leaves and richly scented flowers that open at night distinguish this
  tropical shrub, which grows from northern India to Thailand.
scope: Another name for the night-blooming tropical shrub also called crape jasmine and pinwheel flower;
  not a true rose.
examples:
- The coffee rose releases its scent only after sunset.
- Gardeners in warm climates grow coffee rose for its glossy leaves and wavy petals.
