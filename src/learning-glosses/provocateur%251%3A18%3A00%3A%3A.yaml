simpleMeaning: a secret agent who pushes people who are thought to have done wrong to do acts that break
  the law
scope: This person is also called agent provocateur; not an ordinary secret agent and not a person who
  only starts trouble in public.
examples:
- The police sent a provocateur to push the group into planning a crime.
- As a provocateur, he tried to get the men to steal the papers.
