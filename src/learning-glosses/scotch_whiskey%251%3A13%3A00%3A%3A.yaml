simpleMeaning: A strong drink made in Scotland, above all one made from barley grain that has started
  to grow, heated in a pot-shaped vessel.
scope: 'Also called malt whiskey, malt whisky, Scotch, Scotch malt whiskey, Scotch malt whisky, or Scotch
  whisky: a strong drink made in Scotland, above all from barley grain that has started to grow, heated
  in a pot-shaped vessel, not a drink made in Ireland.'
examples:
- Scotch whiskey is made in Scotland from malted barley.
- He ordered a glass of Scotch whiskey.
