simpleMeaning: From a kind of seed comes a pale yellow to brown stuff that is safe to eat and also used
  to make things slide and to give light
scope: Also called rape oil and colza oil, this is a pale yellow to brown stuff made from a kind of seed,
  used in cooking and to give light, not a fat from animals and not a fuel for cars.
examples:
- She cooks with rapeseed oil every day.
- The old lamp burned rapeseed oil for light.
