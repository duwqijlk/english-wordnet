simpleMeaning: A British measure of how much a thing holds, for liquid or dry goods, equal to one sixtieth
  of a fluid dram, or 0.059194 cubic centimeters.
scope: A British measure of capacity, one sixtieth of a fluid dram, not the United States liquid unit
  of the same name.
examples:
- The dose was given as ten minims.
- Old recipes sometimes measure liquids in minims.
