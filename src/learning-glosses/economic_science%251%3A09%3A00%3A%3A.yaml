simpleMeaning: The field of study about people in society that deals with how goods and services are made,
  shared, and used, and how they are managed.
scope: 'Also called economics and political economy: the study of how goods and services are made, shared,
  and used, not the study of people and their ways of life in general.'
examples:
- She studied economic science at university.
- Economic science looks at how goods and services are made and shared.
