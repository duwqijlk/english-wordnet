simpleMeaning: In some languages, such as Hausa, a sudden letting-out of air held back at the voice box
  makes this speech sound.
scope: An ejective consonant is another name for this speech sound in some languages, such as Hausa, made
  by letting out air held back at the voice box.
examples:
- Hausa has ejective sounds that are made with a sharp burst of air.
- She practised the ejective sound until she could make it with a quick pop.
