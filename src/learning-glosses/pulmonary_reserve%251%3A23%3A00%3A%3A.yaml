senseId: 'pulmonary_reserve%1:23:00::'
synsetId: 13782081-n
simpleMeaning: The extra air the lungs can take in and breathe out when breathing as hard as they can
  in times of strain
scope: The extra air the lungs can move when breathing as hard as they can, not the air of a normal breath.
examples:
- Her pulmonary reserve let her keep running even when she was out of breath.
- Doctors measure pulmonary reserve to see how much extra air the lungs can move.
