simpleMeaning: Blood that holds too little of the fat-carrying protein bits, fats, and cholesterol marks
  this condition, passed down in families.
scope: Blood holding too little fat-carrying matter and cholesterol marks this inherited condition, not
  blood holding too much.
examples:
- Hypobetalipoproteinemia meant the blood held too little cholesterol.
- Hypobetalipoproteinemia runs in families.
