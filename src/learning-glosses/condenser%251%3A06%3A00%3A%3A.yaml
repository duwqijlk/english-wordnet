simpleMeaning: a curved piece of clear glass that brings light together onto a thing
scope: This is the glass piece that brings light together onto a thing. It is not a coil that cools a
  gas, and not a machine that turns a gas into a liquid.
examples:
- The teacher put a condenser above the light to bring it onto the leaf.
- This condenser makes the light stronger on the small object we want to see.
