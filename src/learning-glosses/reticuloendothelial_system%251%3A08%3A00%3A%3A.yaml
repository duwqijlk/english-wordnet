senseId: 'reticuloendothelial_system%1:08:00::'
synsetId: 05468925-n
simpleMeaning: All the cells that can swallow up germs, tiny floating bits and the like, apart from some
  white blood cells, form a network spread all through the body
scope: It is a network of cells spread through the body, not one organ and not the white blood cells it
  leaves out.
examples:
- The reticuloendothelial system swallows up germs all over the body.
- Some white blood cells stand outside the reticuloendothelial system.
