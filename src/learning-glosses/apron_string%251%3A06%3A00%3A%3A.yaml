simpleMeaning: Usually in the plural, a cord used to tie a cloth worn to keep clothes clean round the
  waist.
scope: Usually in the plural, a cord that ties a cloth worn to keep clothes clean round the waist, not
  a belt and not a cord for shoes.
examples:
- She tied the apron strings behind her back.
- The apron string came loose while she cooked.
