simpleMeaning: to set things down at wide gaps from each other all over a place, in between what is already
  there, as if they were small spots or knobs
scope: 'Also called dot: to spread things about over a place, not the small round knob on a belt or shield
  and not the card game.'
examples:
- Lights studded the hills at night.
- The garden was studded with small white flowers.
