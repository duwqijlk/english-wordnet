simpleMeaning: showing strong care for people and a firm aim to help them live well
scope: Also called humanitarian and humanistic. This sense shows strong care for people and a firm aim
  to help them live well. It is not the noun for a person, not the sense about a way of thinking based
  on reason, and not the sense about Renaissance learning.
examples:
- They took a humanist approach and put people's needs first.
- Her humanist values led her to help the poor.
