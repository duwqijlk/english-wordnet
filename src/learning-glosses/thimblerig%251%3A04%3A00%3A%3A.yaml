simpleMeaning: a cheating game of quick hands where the person being cheated must guess which of three
  things hides a small ball
scope: A cheating game of quick hands; shell game is another name for this sense. Not an honest guessing
  game, and not a card trick.
examples:
- The man lost his money at thimblerig on the fairground.
- They watched the dealer run a game of thimblerig with three cups and a pea.
