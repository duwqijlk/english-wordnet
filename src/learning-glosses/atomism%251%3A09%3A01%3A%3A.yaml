simpleMeaning: In psychology, a theory that all thoughts and feelings are built from simple bits, such
  as sense and feeling, joined by links
scope: A theory in psychology that thoughts are built from simple bits, not the chemistry theory that
  all matter is made of tiny bits.
examples:
- The atomism of the old school held that a thought is built from simple bits of sense.
- In his lectures on atomism, he said feelings join by links to form ideas.
