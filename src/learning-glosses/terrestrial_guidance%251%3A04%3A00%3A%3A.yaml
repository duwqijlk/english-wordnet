simpleMeaning: A way of steering a missile in flight with tools that answer to the strength and direction
  of the earth's pull
scope: A way of steering a missile in flight with tools that answer to the strength and direction of the
  earth's pull; not steering by stars and not steering by radio signals.
examples:
- Terrestrial guidance kept the missile on its path.
- The missile used terrestrial guidance to find its mark.
