  bulk, a shop seller or a person who passes goods on.
scope: This is any money spent by a maker, a seller in bulk, a shop seller or a person who passes goods
  on.
examples:
- The distribution cost covers advertising and shipping.
- The firm counted advertising as a distribution cost.
