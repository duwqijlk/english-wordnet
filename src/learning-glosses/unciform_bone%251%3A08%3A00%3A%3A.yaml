simpleMeaning: The wrist part in line with the ring finger and the little finger
scope: The wrist part in line with the ring finger and the little finger, also called hamate, hamate bone
  or os hamatum, not the wrist part under the thumb and not a bone of the fingers.
examples:
- He broke his unciform bone when he fell on his hand.
- The unciform bone sits in line with the ring finger and the little finger.
