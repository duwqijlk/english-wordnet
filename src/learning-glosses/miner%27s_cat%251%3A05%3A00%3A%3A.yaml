simpleMeaning: Like a raccoon, with a long bushy tail ringed in black and white, this animal of Mexico
  and the southwest of the United States eats both plants and flesh.
scope: This is a raccoon-like animal of Mexico and the southwest; bassarisk, cacomistle, cacomixle, civet
  cat, coon cat, raccoon fox, ring-tailed cat and ringtail are other names for this sense.
examples:
- A miner's cat of Mexico has a long bushy tail ringed in black and white.
- The miner's cat eats both plants and flesh in the southwest of the United States.
