simpleMeaning: Words usually shown at the foot of the screen, putting what is said in another tongue into
  your own
scope: Words usually shown at the foot of the screen, putting foreign speech into your own tongue, not
  a short note under a picture and not a small point raised to object.
examples:
- She read the captions to follow the French film.
- The captions at the bottom of the screen gave the words in English.
