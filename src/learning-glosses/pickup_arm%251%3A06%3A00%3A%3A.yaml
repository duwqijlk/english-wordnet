simpleMeaning: 'A part of a machine: a light rod that stays in balance and holds the small case that holds
  the needle.'
scope: This is a light rod in a machine that holds the needle case; pickup is another name for this sense,
  not the whole machine and not the needle itself.
examples:
- The pickup arm moved across the record.
- He lifted the pickup arm and set the needle down.
