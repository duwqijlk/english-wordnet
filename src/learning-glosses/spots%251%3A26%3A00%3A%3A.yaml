simpleMeaning: small dark shapes you see, caused by small bits of cells that are not clear, in the clear
  gel inside the eye and in the lens
scope: These are dark shapes seen in the eye, not marks on skin or cloth and not places on a surface.
examples:
- The spots before her eyes seemed to drift as she looked up.
- He told the doctor that spots kept floating across his sight.
