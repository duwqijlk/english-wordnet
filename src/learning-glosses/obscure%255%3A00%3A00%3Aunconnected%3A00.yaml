simpleMeaning: far away and cut off from other people or places, in place or in social life
scope: Also called apart and also called isolated. This is about being far away and cut off, not about
  making something hard to see or hard to understand.
examples:
- We stayed in an obscure village far from any town.
- An obscure group of families lived apart in the hills.
