simpleMeaning: A South African evergreen vine, half-woody, grown for clusters of rosy purple flowers followed
  by edible pods like snap beans; also used as green manure; sometimes placed in that genus.
scope: Also called Australian pea and Dipogon lignosus; a flowering vine with edible pods, not a bean
  grown for its seeds and not a vine grown only for its flowers.
examples:
- Dolichos lignosus grew over the trellis in purple bloom.
- The farmer sowed Dolichos lignosus to feed the soil.
