simpleMeaning: A plant-eating or meat-eating dinosaur with a three-pointed hip bone like that of a crocodile.
scope: A meat- or plant-eating dinosaur with a three-pointed hip bone, also called saurischian dinosaur;
  not a bird-hipped dinosaur and not a crocodile.
examples:
- The saurischian had a hip bone like a crocodile's.
- Some saurischians ate plants, and others ate meat.
