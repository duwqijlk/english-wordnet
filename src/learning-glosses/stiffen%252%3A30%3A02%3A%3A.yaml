senseId: 'stiffen%2:30:02::'
synsetId: 00419690-v
simpleMeaning: to limit a thing in a strong way, so it covers much less or does not go as far
scope: 'Also called tighten, and another name is constrain: to limit a thing strongly. It is not to become
  hard and not easy to bend, and not to make something hard in that way.'
examples:
- The school stiffened its rules about missing class.
- New laws stiffened the limits on how much water factories can use.
