simpleMeaning: at once, in a short and simple way that leaves out small points and steps
scope: It means at once and in a short, simple way, not slowly and not with every step done in full.
examples:
- The judge summarily sent the weak case away without a long hearing.
- He was summarily told to leave the meeting and go home.
