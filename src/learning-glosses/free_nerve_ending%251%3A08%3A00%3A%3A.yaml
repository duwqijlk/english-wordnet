simpleMeaning: tiny sense spots in the skin that are not joined to any one sense organ
scope: These are tiny sense spots in the skin with no link to one sense organ; not the ends of a muscle
  nerve or a taste bud.
examples:
- Free nerve endings in the skin sense pain and heat.
- The free nerve ending fired when the skin was touched.
