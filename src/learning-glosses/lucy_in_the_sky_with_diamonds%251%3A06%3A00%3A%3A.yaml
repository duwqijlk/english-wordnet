simpleMeaning: A name people use in the street for a drug, lysergic acid diethylamide.
scope: Also called dot, acid, dose, pane, superman, back breaker, battery-acid, loony toons, window pane,
  Zen, and Elvis, this is a street name for lysergic acid diethylamide, not a name for any other drug.
examples:
- On the street they call it Lucy in the sky with diamonds.
- He asked for Lucy in the sky with diamonds at the party.
