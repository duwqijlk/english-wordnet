simpleMeaning: a written deal between a person and a bank, broker or firm that gives the person its services
  on a regular basis
scope: 'Also called an account: a formal deal for regular services from a bank or broker, not a casual
  meeting with a firm and not a single deal.'
examples:
- She opened a business relationship with the bank so it would handle her firm's money.
- His business relationship with the broker gave him regular reports on his investments.
