simpleMeaning: A way of treating the body by moving its parts, most of all the back bone, to ease low
  back pain, or even head pain or high blood pressure
scope: A way of treating the body by moving its parts, most of all the back bone; not a drug treatment
  and not surgery.
examples:
- She tried chiropractic for her low back pain.
- Chiropractic care works on the spine to ease pain.
