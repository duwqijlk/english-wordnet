simpleMeaning: A small weight of metal hung at the end of a line, used to find what is straight up and
  down.
scope: The metal weight at the end of a weighted line, not the act of setting a thing straight, not looking
  into a thing in depth, and not standing straight up and down.
examples:
- The plumb hung still from the string.
- He checked the wall with a plumb.
