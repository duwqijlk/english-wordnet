simpleMeaning: how hard something pushes on each small part of a surface, counted in units called pascals
  or dynes
scope: Also called pressure and force per unit area, this is how hard something pushes on each part of
  a surface, not the total push on the whole surface.
examples:
- The pressure level rose as the gas was squeezed into the tank.
- Scientists checked the pressure level before they opened the valve.
