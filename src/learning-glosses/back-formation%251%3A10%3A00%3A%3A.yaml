simpleMeaning: By taking a bit off a known word, usually without meaning to, people make a new word on
  the thought that the known word came from it.
scope: It is a new word made by taking a bit off a known word, not by adding a bit to one.
examples:
- The word 'edit' is a back-formation from 'editor'.
- She explained that the new word came about by back-formation.
