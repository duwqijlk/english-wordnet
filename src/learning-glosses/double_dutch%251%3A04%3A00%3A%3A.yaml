simpleMeaning: The hard form of jump rope in which players jump over two ropes swung across each other
  by two turners.
scope: This is the hard form of jump rope in which players jump over two ropes swung across each other
  by two turners, unlike single Dutch with one rope and unlike skipping on one's own with a single rope.
examples:
- The girls played double Dutch on the playground at lunch.
- Double Dutch takes two turners and quick feet.
