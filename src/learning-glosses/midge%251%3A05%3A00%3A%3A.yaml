simpleMeaning: a very small fly with two wings, like a mosquito but with a mouth that cannot bite; these
  flies gather in big moving groups, especially near water
scope: A tiny fly that cannot bite; it is not a mosquito, which can bite, even though it looks much like
  one.
examples:
- Midges flew in a thick cloud over the lake in the evening.
- A midge landed on my arm, but it did not bite me.
