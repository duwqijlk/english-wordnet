simpleMeaning: a white powder poison of arsenic and oxygen, used to make glass and to kill pests and weeds
scope: Also called arsenic, arsenic trioxide, arsenous anhydride, arsenous oxide, and white arsenic; a
  poison powder, not the metal arsenic itself and not a medicine.
examples:
- The farmer kept the ratsbane locked away from children and pets.
- Old glassworks used ratsbane in making their glass.
