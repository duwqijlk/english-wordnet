simpleMeaning: a written promise to pay money whenever the holder asks for it
scope: A written promise to pay when asked; not a promise with a fixed date, and not a banknote.
examples:
- He signed a demand note, and the lender could ask for the money at any time.
- The demand note fell due as soon as it was shown.
