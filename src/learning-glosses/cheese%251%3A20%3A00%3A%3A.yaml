simpleMeaning: an Old World plant that lives many years, grows up or lies low, has groups of pink-purple
  flowers where leaves join the stem, and was brought to the United States
scope: A plant with pink-purple flowers, not the food made from milk, and not winding thread or yarn onto
  a holder.
examples:
- The cheese by the garden wall came back this year with pink-purple flowers.
- She found cheese growing wild in the field, standing up among the grass.
