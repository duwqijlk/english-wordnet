simpleMeaning: One of many kinds of tiny bug that sucks sap from plants, it harms many of them and has
  narrow wings like feathers when it has any.
scope: Also called thripid and thrips, it is a tiny sap-sucking bug, one of many kinds.
examples:
- A thrip had sucked the sap from the leaves.
- On the leaves, thrips were hard to see, each one so tiny.
