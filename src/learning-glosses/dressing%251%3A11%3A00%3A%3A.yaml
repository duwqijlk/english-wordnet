simpleMeaning: making land rich so plants grow well, by putting plant food or dung on it
scope: This is feeding the land to make plants grow, not a sauce for salad and not a cloth over a wound.
examples:
- Dressing the fields with dung made the wheat grow tall.
- Farmers use dressing on poor land to make it rich.
