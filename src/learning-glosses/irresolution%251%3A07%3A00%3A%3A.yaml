senseId: 'irresolution%1:07:00::'
synsetId: 04873696-n
simpleMeaning: The quality of a person who cannot make up their mind and cannot hold firmly to a purpose.
scope: Not being able to make up your mind or hold to a plan, also called irresoluteness; not a quick
  change of mood and not a lack of care.
examples:
- His irresolution delayed the project for weeks.
- Her irresolution meant she never finished what she started.
