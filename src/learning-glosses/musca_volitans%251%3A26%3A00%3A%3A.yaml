simpleMeaning: small dark shapes seen before the eyes, caused by bits of cells that light cannot pass
  through, in the clear gel and the lens
scope: 'Also called spots, a floater, or muscae volitantes: small dark shapes seen before the eyes, caused
  by bits of cells that light cannot pass through, in the clear gel and the lens; not a blind spot and
  not a flash of light.'
examples:
- Musca volitans made small dark shapes drift across her sight.
- He saw musca volitans when he looked at the bright sky.
