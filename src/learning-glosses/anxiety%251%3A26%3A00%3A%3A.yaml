simpleMeaning: In psychiatry, worry and nerves that stay for a long time and come with other mind troubles,
  often with strong fear or acts done over and over
scope: In psychiatry, worry and nerves that stay for a long time, not the short worry before a bad thing
  that may come.
examples:
- His anxiety kept him from leaving the house for months.
- The doctor helped her live with her anxiety.
