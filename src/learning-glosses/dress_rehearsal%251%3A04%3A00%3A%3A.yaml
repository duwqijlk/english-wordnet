simpleMeaning: a practice run of a play or show, done all the way through without stopping, in the clothes
  worn on stage, just before the first night
scope: A full run-through in stage clothes just before opening night, not an ordinary practice run and
  not the first show itself.
examples:
- The dress rehearsal ran without a break the night before the show opened.
- She wore her full costume for the dress rehearsal, just as she would on stage.
