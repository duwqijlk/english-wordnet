simpleMeaning: A sharp hurt that is felt in the body
scope: 'Also called pain and painful sensation: a sharp hurt felt in the body, not a dull ache and not
  a feeling of warmth or cold.'
examples:
- As the heat grew, the pain sensation changed from a tickle to a sharp hurt.
- The pain sensation in her hand made her pull it back from the flame.
