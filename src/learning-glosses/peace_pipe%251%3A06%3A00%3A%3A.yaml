simpleMeaning: Smoked at rites, especially as a sign of goodwill, this richly adorned smoking tube belongs
  to Native Americans.
scope: A calumet and a pipe of peace are other names for this richly adorned smoking tube, used at rites.
examples:
- The peace pipe was smoked at the rite.
- A peace pipe serves as a sign of goodwill.
