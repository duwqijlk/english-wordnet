senseId: 'pervasively%4:02:00::'
synsetId: 00423235-r
simpleMeaning: In a way that spreads through every part of a place or group.
scope: This is about something spread right through a place or group, not something found only in one
  spot, and not something that happens only once in a while.
examples:
- The smell spread pervasively through the whole house.
- Fear spread pervasively among the crowd after the news.
