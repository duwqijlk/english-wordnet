simpleMeaning: Any chemical kind that belongs to the set of kinds that starts with the lightest one.
scope: This is any chemical kind that belongs to the set of kinds that starts with the lightest one, also
  called crystallogen, Group 14 element, tetragen and tetrel, and not one of the chemical kinds of another
  set.
examples:
- Silicon is a carbon group element used in chips.
- Lead is a carbon group element with a heavy weight.
