simpleMeaning: a sign of how much a country's spending is paid for with borrowed money, not taxes, and
  the whole sum its local, state, and central governments owe
scope: Public debt is what a country's local, state, and central governments owe in all, and it shows
  how much public spending is paid for by borrowing instead of taxes.
examples:
- The public debt grew when the state borrowed more than it took in taxes.
- Much of the public debt came from borrowing by local governments.
