simpleMeaning: Having the form of a long hollow pipe, with a hollow space inside for liquids or gases
  to pass through.
scope: This means having the form of a long hollow pipe, also called tubular, tubelike, cannular and vasiform;
  not solid and not flat.
examples:
- The tube-shaped part lets water flow through it.
- A tube-shaped glass held the thin liquid.
