simpleMeaning: Used before the name of the one who has lived longer of two people who share a name, especially
  to tell a father apart from his son.
scope: It is not a general word for being far along in age; it marks which of two people sharing a name
  is meant.
examples:
- In the family, the father was known as the older William.
- Since both were named James, the son was called James the younger and his father the older.
