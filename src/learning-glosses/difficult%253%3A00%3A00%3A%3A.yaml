simpleMeaning: hard to do, understand, or deal with, and needing a lot of effort.
scope: This is not about a person being unhelpful or hard to please; it describes a task, question, or
  situation that needs much effort.
examples:
- The exam was difficult, but she passed it.
- It is difficult to learn a new language as an adult.
