simpleMeaning: The act of making a thing, such as a boat or a plane, less likely to turn over.
scope: The act of making a boat or plane less likely to turn over, not the act of making a thing more
  stable in general.
examples:
- The stabilization of the ship kept it from turning over.
- Engineers worked on the stabilization of the aircraft.
