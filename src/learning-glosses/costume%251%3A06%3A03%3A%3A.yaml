simpleMeaning: The way most people dress at a given time, with the extras, hair and clothes that go with
  it
scope: The dress most people wear at a given time, not clothes for a play and not odd clothes from another
  time.
examples:
- The costume of the 1920s included short skirts and long beads.
- Fashion books show the costume worn in Paris that year.
