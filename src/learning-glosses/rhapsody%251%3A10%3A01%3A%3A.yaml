simpleMeaning: In music, a piece played on instruments, in one long part, with no set form and usually
  full of strong feeling
scope: A piece of music for instruments with no set form, not the ancient Greek poem for reading aloud
  and not a song with words.
examples:
- The orchestra ended the night with a lively rhapsody.
- She played a rhapsody that moved from soft and sad to loud and wild.
