simpleMeaning: ways to look for hidden reasons for what a person does, and to treat different illnesses
  of the mind, based on the ideas of Sigmund Freud
scope: Also called analysis and depth psychology. This is the Freud-based way of treating problems of
  the mind, not a general study of a subject and not any other kind of mind treatment.
examples:
- His doctor suggested psychoanalysis to help with his fears.
- She spent years in psychoanalysis, talking about her early life.
