simpleMeaning: a way of faith in which a person gives up all work and sits still, thinking only of God
scope: A way of faith that gives up all effort to think only of God, not prayer with others and not a
  life of good works.
examples:
- His quietism led him to leave his job and live alone in prayer.
- Quietism teaches that the soul should rest and do nothing.
