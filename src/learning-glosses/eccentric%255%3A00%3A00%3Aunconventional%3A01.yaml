simpleMeaning: So far from what people do or expect that it stands out as odd
scope: Far outside the normal way of doing things and odd enough to stand out; bizarre and freakish are
  other names for this sense, not a person with odd ways and not simply rare.
examples:
- His eccentric spelling made his letters hard to read.
- The eccentric design of the restaurant drew a crowd.
