simpleMeaning: A long-legged wading bird with three toes and black-and-white feathers, found by inland
  ponds and marshes or salty lagoons
scope: A wading bird of inland ponds and marshes; not the Australian stilt of salty marshes, and not the
  tall poles used for walking.
examples:
- A stilt waded through the shallow pond.
- We saw a black-and-white stilt at the marsh.
