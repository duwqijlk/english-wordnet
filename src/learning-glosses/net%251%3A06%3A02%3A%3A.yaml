simpleMeaning: a trap made of cord woven with open spaces, used to catch fish, birds, or insects.
scope: This is the catching device, not the global computer system or a profit figure.
examples:
- The fisherman hauled in his net full of silver fish.
- The net caught three birds before the farmer freed them.
