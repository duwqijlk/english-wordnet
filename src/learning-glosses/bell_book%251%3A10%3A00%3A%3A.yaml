simpleMeaning: a record kept on a ship in which every order about the main engines is written down
scope: A record of engine orders kept on a ship, not a book of songs and not a list of names.
examples:
- The bell book showed every order the captain gave to the engine room.
- The officer wrote the new speed in the bell book.
