senseId: northwesterly%5:00:01:north:00
synsetId: 01606563-s
simpleMeaning: Lying toward the north-west, or set there.
scope: This sense is also called northwest and northwestern, for lying toward the north-west, or set there,
  where northwest is placed in, or facing, the part of a place that lies between north and west, unlike
  the sense for coming from the north-west.
examples:
- The town was northwesterly, set in the north-west.
- The coast was northwesterly, turned to the north-west.
