simpleMeaning: To put something away in the cloth pouch sewn into your clothes.
scope: This is the act of putting something into a clothing pouch, not the pouch itself, a hollow left
  by removal, or the bowling gap.
examples:
- She pocketed the receipt and left the shop.
- He pocketed his keys and headed out.
