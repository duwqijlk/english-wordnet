simpleMeaning: A tiny opening, above all in the spore-making parts of some algae and fungi, that lets
  spores pass out.
scope: A tiny opening in the spore-making parts of some algae and fungi; not a mouth and not a crack in
  the skin.
examples:
- Spores pass out through the ostiole.
- The ostiole opens when the spores are ripe.
