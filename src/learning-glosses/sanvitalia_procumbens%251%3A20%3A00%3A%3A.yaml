simpleMeaning: A low, branching leafy plant that lives one year, with flower heads like zinnias, found
  in the south-western United States and Mexico as far as Guatemala.
scope: Also called creeping zinnia; a low leafy plant with flower heads like zinnias, not a true zinnia
  and not a tall plant.
examples:
- Sanvitalia procumbens has flower heads like zinnias.
- Sanvitalia procumbens is found from the south-western United States to Guatemala.
