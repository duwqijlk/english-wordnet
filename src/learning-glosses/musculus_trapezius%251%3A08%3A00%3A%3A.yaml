simpleMeaning: To move the shoulders and arms, one of two flat bands of flesh, shaped like a triangle,
  lies across the shoulders and upper back
scope: 'Also called a trapezius or a cowl muscle: one of two flat bands of flesh across the shoulders
  and upper back that help move the shoulders and arms, not a band of flesh in the leg and not a bone.'
examples:
- The musculus trapezius on his right side ached after carrying the heavy bag.
- She stretched her musculus trapezius before lifting the box overhead.
