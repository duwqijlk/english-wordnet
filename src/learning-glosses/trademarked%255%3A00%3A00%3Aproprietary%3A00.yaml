simpleMeaning: Said of goods for sale that carry a registered mark showing they belong to one maker alone,
  and no one else may use it.
scope: Goods for sale carrying a registered mark that shows they belong to one maker alone.
examples:
- The shop sold only trademarked goods with the maker's mark on the box.
- She checked that the trademarked logo was really registered.
