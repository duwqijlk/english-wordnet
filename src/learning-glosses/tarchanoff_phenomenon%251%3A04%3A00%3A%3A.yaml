synsetId: 00861689-n
simpleMeaning: A change in how the skin carries power under stress or anxiety, found by testing how hard
  power passes through the skin or by sensing weak power the body makes.
scope: A change in how the skin carries power under stress or anxiety, also called electrical skin response,
  electrodermal response, galvanic skin response, psychogalvanic response, Fere phenomenon and GSR.
examples:
- The Tarchanoff phenomenon showed a change in how the skin carries power when she was stressed.
- Doctors test for the Tarchanoff phenomenon by picking up weak power the body makes.
