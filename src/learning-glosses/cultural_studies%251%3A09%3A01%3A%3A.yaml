simpleMeaning: An academic field examining culture in relation to power and politics, first developed
  by British scholars in the late 1950s-1970s and since taken up across many disciplines worldwide.
scope: This is the interdisciplinary field of cultural analysis; not anthropology's general study of culture,
  and not media studies.
examples:
- She is writing her thesis on popular music from the perspective of cultural studies.
- The department offers a joint degree in cultural studies and sociology.
