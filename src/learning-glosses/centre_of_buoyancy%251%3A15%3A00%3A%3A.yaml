senseId: 'centre_of_buoyancy%1:15:00::'
synsetId: 08539508-n
simpleMeaning: In physics, the point where the weight of the part of a ship or other thing that floats
  which is under water seems to sit
scope: 'Also called center of buoyancy, center of immersion and centre of immersion: the point where the
  weight of the under-water part of a floating thing seems to sit, not the point where the weight of the
  whole thing acts.'
examples:
- The centre of buoyancy moved as the ship took on more cargo below the water line.
- Engineers worked out the centre of buoyancy before the boat was launched.
