simpleMeaning: in law, about the rules that say what rights and duties people have, not about the rules
  that set up those rights and duties
scope: In law, the rules that state rights and duties, not the rules that set up how rights and duties
  are fixed, and not the sense about a plant's core part.
examples:
- The essential rules of the law state what rights people have.
- The judge read the essential law that sets out the rights of both sides.
