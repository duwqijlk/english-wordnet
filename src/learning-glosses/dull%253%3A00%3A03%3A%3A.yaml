simpleMeaning: having little life or energy and showing little feeling or movement
scope: This is about a person, day or event with little life or energy. It is not about a sound that is
  not clear, and not about a person who is slow to learn.
examples:
- The long, dull days passed with nothing to do.
- It was a dull political campaign with no new ideas.
