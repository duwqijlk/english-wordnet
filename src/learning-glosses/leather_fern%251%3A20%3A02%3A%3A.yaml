simpleMeaning: a thick swamp plant of hot lands, above all of hot America, with big leaves whose gold-yellow
  undersides are covered in cases that hold dust for new plants
scope: 'Also called golden fern: a thick swamp plant with gold-yellow leaf undersides, not the southern
  leather fern with leathery leaves.'
examples:
- The leather fern grew thick by the swamp.
- Golden yellow cases covered the undersides of the leather fern leaves.
