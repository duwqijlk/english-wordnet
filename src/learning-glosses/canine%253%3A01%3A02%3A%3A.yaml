simpleMeaning: about or relating to a pointed tooth that is shaped like a cone, wide at the bottom and
  pointed at the top
scope: This word describes a thing by its link to a pointed tooth. It is not the tooth itself, and not
  about dogs or the dog family.
examples:
- Her canine teeth are longer and more pointed than her other teeth.
- The canine shape of the tooth helps it tear food.
