simpleMeaning: Many kinds of this long-lived plant form mounds of rich broad ribbed leaves, with bunches
  of white, blue, or lilac flowers, and people plant it as ground cover
scope: Also called a plantain lily; not the yellow-flowered plant whose blooms last only a day.
examples:
- The day lily spread across the bank as ground cover.
- Clusters of lilac flowers rose above the day lily leaves in June.
