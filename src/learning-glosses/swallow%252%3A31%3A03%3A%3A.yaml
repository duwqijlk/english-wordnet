simpleMeaning: To endure something unpleasant until it stops bothering you much.
scope: Another name for accept or live with in this sense, meaning to put up with something unpleasant,
  not to pass food down your throat, believe a claim without question, or hold back an emotion.
examples:
- I can swallow the long hours, but not the low pay.
- The residents learned to swallow the constant noise.
