simpleMeaning: A shift in the skin's electric traits under stress or worry, gauged either by logging the
  skin's electric resistance or by logging faint currents made by the body.
scope: This sense is also called electrodermal response, galvanic skin response, and psychogalvanic response.
examples:
- The electrical skin response shifts under stress.
- They log the electrical skin response.
