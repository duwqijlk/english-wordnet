simpleMeaning: Large blades, usually soft and woolly, and spikes of yellow, white, or purplish flowers
  at the stem ends mark one of several kinds of plant of the group Verbascum.
scope: Also called mullein or a velvet plant, this plant of the group Verbascum is one of several kinds
  with large blades, usually soft and woolly, and spikes of yellow, white, or purplish flowers at the
  stem ends.
examples:
- The flannel leaf by the wall had large woolly leaves.
- They grew flannel leaf for its spikes of yellow flowers.
