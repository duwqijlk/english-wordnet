simpleMeaning: a nebula once thought to be a star with planets, now seen as a very hot star wrapped in
  a growing charged-gas cloud that glows fluorescently under its intense radiation.
scope: A glowing gas shell around a very hot star; despite the name it is not a planet or a star with
  planets, and it is not a diffuse nebula, a star cluster inside a cloud of gas and dust.
examples:
- The telescope showed a planetary nebula around a very hot star.
- Astronomers once mistook a planetary nebula for a star with planets.
