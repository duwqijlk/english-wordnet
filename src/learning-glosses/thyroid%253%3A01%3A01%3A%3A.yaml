simpleMeaning: of or about a small gland in the neck, a part inside the body that makes things the body
  needs
scope: This means about that neck gland itself, not about showing signs that the gland is ill or not working
  well.
examples:
- She has a thyroid problem and takes medicine every day.
- The doctor checked her thyroid function with a blood test.
