simpleMeaning: any northern insect of the group Panorpidae with a long beak and long feelers, the males
  having a tail that curls up over the back but has no sting
scope: An insect with a long beak and long feelers, the males with a curled tail that has no sting; not
  a biting fly and not a scorpion.
examples:
- The scorpion fly sat on the leaf, its long beak held out.
- A male scorpion fly curled its tail over its back.
