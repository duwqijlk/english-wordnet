simpleMeaning: A bush from the east and south coasts of the United States, with lovely groups of white
  flowers that smell of spice.
scope: A bush from the east and south coasts of the United States with white flowers that smell of spice;
  also called pepper bush, sweet pepperbush and white alder; not a spice plant grown for cooking and not
  a honeysuckle.
examples:
- Summer sweet fills the garden with a spicy smell in July.
- Bees visit the summer sweet when it is in flower.
