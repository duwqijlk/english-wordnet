senseId: 'radiation_sickness%1:26:00::'
synsetId: 14331899-n
simpleMeaning: 'Symptoms after high-energy ray exposure from radioactive or nuclear sources: mild cases
  bring diarrhea, nausea, vomiting, hair loss; worse cases bring sterility, cataracts, cancers; the gravest
  cases kill within hours.'
scope: 'This is the same condition as radiation syndrome: the illness that follows too much high-energy
  ray exposure, not the rays themselves or the treatment of disease with radioactive material.'
examples:
- The crew developed radiation sickness after working near the damaged reactor.
- Symptoms of radiation sickness began within hours of the blast.
