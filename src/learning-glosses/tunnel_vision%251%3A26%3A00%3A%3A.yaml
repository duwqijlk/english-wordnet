simpleMeaning: poor sight in which a person can see only what is straight in front of them
scope: Poor sight with only the middle of the view left; not being blind and not poor sight from old age.
examples:
- Tunnel vision made it hard for her to see cars coming from the side.
- After the injury, he had tunnel vision and could only see straight ahead.
