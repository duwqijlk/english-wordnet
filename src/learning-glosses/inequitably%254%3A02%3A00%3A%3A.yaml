simpleMeaning: in a way that is not fair to all sides
scope: Doing something in a way that is not fair to all sides; not merely giving more to one side by mistake
  and not breaking a law.
examples:
- Their father's possessions were inequitably divided among the sons.
- The land was shared inequitably, and the younger sons got little.
