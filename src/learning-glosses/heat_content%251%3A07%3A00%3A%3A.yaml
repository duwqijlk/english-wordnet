synsetId: 05019456-n
simpleMeaning: In thermodynamics, a thing's inner power, added to its size times the push it puts out,
  is the whole store of power in it
scope: 'Also called enthalpy: In thermodynamics, the whole store of power in a thing, not the power it
  uses up and not the push it puts out on its own.'
examples:
- The heat content of the steam rose as it was heated.
- Engineers worked out the heat content of the gas before they built the plant.
