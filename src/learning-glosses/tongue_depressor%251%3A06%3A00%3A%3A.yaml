simpleMeaning: a thin flat tool used to press down the moving part in the mouth while someone looks at
  the mouth and throat
scope: A thin flat tool used to press down inside the mouth while the mouth and throat are looked at;
  not a cutting tool, and not a tool for holding the mouth open.
examples:
- The doctor used a tongue depressor to press the tongue down and look at my throat.
- She opened her mouth wide while the nurse held a tongue depressor in place.
