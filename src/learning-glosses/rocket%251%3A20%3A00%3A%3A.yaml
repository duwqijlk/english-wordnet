simpleMeaning: a plant from Europe that stands straight, lives for one year, and is often grown for salads
  and picked when young and soft
scope: A plant eaten in salads, not a vehicle that flies into space, not an engine, and not a firework
  sent high into the sky.
examples:
- We grew rocket in the garden and ate its young leaves in a salad.
- She put fresh rocket on the plate with tomatoes and cheese.
