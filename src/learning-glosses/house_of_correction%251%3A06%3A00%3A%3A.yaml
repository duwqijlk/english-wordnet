simpleMeaning: In the past, people found guilty of small crimes were kept in such a locked place.
scope: This is the old name for a locked place that held people found guilty of small crimes, not of serious
  ones.
examples:
- They were sent to a house of correction after being found guilty of stealing bread.
- In those days, people found guilty of a small crime went to the house of correction.
