synsetId: 04039186-n
simpleMeaning: A thin plate or small rod, cut along set lines from a hard glassy stone and ground, sends
  out a steady electric beat and keeps time in an oscillator.
scope: A thin plate or rod cut from stone to keep a steady beat in an oscillator, not the stone itself
  and not the oscillator it goes into.
examples:
- The quartz crystal in the watch keeps its beat steady.
- A quartz crystal sends out its signal at one fixed rate.
