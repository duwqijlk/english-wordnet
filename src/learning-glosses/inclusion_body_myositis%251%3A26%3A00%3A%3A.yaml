simpleMeaning: Muscle inflammation that weakens the limbs, especially the thighs, wrists and fingers,
  and sometimes the swallowing muscles; starts after 50, worsens slowly; more common in men than women.
scope: This is the late-onset, slowly progressive inflammatory muscle disease, distinct from polymyositis
  and dermatomyositis, which are separate muscle disorders.
examples:
- The neurologist diagnosed inclusion body myositis after a muscle biopsy.
- Inclusion body myositis mainly weakens the thigh muscles and the muscles that bend the fingers.
