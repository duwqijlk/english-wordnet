simpleMeaning: In medicine, X-ray pictures of the kidney and the tubes that carry urine from it, usually
  taken after a dye that shows up on X-rays is put in
scope: In medicine, X-ray pictures of the kidney and its tubes; not an ordinary X-ray of the belly, and
  not a blood test.
examples:
- Pyelography showed a stone in her kidney.
- The doctor ordered pyelography after the dye was put in.
