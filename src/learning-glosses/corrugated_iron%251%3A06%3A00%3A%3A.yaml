simpleMeaning: A sheet of metal, usually coated, with straight parallel ridges and hollows, made of steel
  or of the grey metal that steel is made from.
scope: This coated sheet of metal, usually of steel or of the grey metal steel is made from, has straight
  parallel ridges and hollows.
examples:
- The roof was made of corrugated iron.
- The corrugated iron's ridges ran in straight parallel lines.
