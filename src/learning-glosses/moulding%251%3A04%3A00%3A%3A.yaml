simpleMeaning: a first shaped work in wax or clay that a finished work can be copied from
scope: This first wax or clay work is also called modeling, molding and modelling; it is not a thin strip
  used to finish a wall or edge, and not a raised pattern on an edge.
examples:
- He made a moulding in clay and copied it to make the final statue.
- The wax moulding sat on the table next to the finished work.
