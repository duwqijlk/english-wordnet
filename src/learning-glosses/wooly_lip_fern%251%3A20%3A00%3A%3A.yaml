simpleMeaning: Thick soft hairs cover its stalks and the undersides of its leaves on this small North
  American fern that stays green all year
scope: Also called hairy lip fern, it is a small North American fern that stays green all year, not one
  that loses its leaves in winter.
examples:
- The wooly lip fern kept its leaves through the winter.
- We found a wooly lip fern with soft hairs under its leaves.
