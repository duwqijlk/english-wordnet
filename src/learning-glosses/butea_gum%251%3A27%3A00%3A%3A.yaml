simpleMeaning: the dried sap of the dhak tree, used as an astringent, a substance that tightens skin and
  dries it up
scope: 'Also called butea kino and gum butea: the dried sap of the dhak tree used to tighten skin, not
  fresh sap and not a sweet for chewing.'
examples:
- The healer rubbed butea gum on the cut to help it dry.
- Butea gum is the dried sap of the dhak tree.
