simpleMeaning: a person in one's own family by birth or by marriage
scope: A person in one's own family by birth or by marriage, not a living thing that is kin to another
  and not a word for things judged by setting them against each other.
examples:
- Police are looking for relatives of the dead man.
- She has distant relatives in New Jersey.
