simpleMeaning: a picture in the mind, clear enough to seem real, but known not to be real
scope: A picture in the mind that seems real but is known not to be real; not a true hallucination, which
  is believed, and not a dream.
examples:
- She had a pseudohallucination after the operation, seeing a cat on the bed that she knew was not there.
- He had a pseudohallucination of a dog in the corner, but he knew the dog was not there.
