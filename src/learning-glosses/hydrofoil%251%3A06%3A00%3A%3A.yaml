simpleMeaning: Wing-shaped parts below it lift this fast boat clear of the water, so it glides over the
  surface at high speed.
scope: Also called a hydroplane, this boat rises out of the water on wing-shaped parts, not the flat plate
  fitted to a boat that reacts to the water it passes through.
examples:
- The hydrofoil rose up out of the water once it reached full speed.
- We watched the hydrofoil glide past, riding high above the waves.
