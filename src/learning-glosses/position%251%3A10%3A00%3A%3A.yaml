simpleMeaning: a view held by one side in an argument or disagreement, set against the view of the other
  side
scope: This is one side's opinion set against another's in a dispute, not a job, a starting assumption,
  social rank, or a person's circumstances.
examples:
- The union's position on pay has not changed since the talks began.
- Each side restated its position before the judge.
