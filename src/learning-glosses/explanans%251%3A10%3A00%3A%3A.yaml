simpleMeaning: In logic, the statements that do the explaining, the starting points from which something
  is made clear.
scope: In logic, the statements that do the explaining; not the thing to be explained and not the conclusion
  drawn from it.
examples:
- The explanans of the argument lay in the laws of motion.
- He set out the explanans before drawing his conclusion.
