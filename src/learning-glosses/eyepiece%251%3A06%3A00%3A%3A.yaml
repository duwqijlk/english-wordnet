simpleMeaning: the set of lenses at the end of a tool for looking, the end you put your eye to
scope: 'Also called an ocular: the lenses at the eye end of a tool for looking, not the lens at the far
  end that faces the thing you look at.'
examples:
- He looked through the eyepiece of the microscope and saw the tiny cells.
- The eyepiece of the telescope fogged up in the cold night air.
