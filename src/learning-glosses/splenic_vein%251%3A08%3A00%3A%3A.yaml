simpleMeaning: joining the superior mesenteric to form the portal vein, this vein is made of several small
  veins on the surface of the spleen
scope: Also called vena lienalis, it is the vein that runs from the spleen to join the portal vein.
examples:
- The splenic vein joins the superior mesenteric.
- Small veins on the spleen join to form the splenic vein.
