scope: A building style of 14th- and 15th-century England, also called perpendicular, perpendicular style
  and English-Gothic architecture; its marks are the tall straight lines, the four-centred Tudor arch
  and fan vaulting.
examples:
- The cathedral shows English-Gothic lines and a fan vault.
- English-Gothic churches often have tall, narrow windows.
