simpleMeaning: Fixed along the outside of a ship's lower hull, one of a pair of long thin flat parts keeps
  the ship from rolling.
scope: This is one of a pair of long thin flat parts fixed along the outside of a ship's lower hull, not
  the ship's main keel.
examples:
- The bilge keel runs along the outside of the ship's lower hull.
- The ship rolled less after the bilge keel was put in place.
