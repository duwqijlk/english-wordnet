simpleMeaning: A shape that has been bent or twisted out of its true form
scope: A shape that has been bent or twisted out of its true form; not a change in sound, not a fault
  in a lens, and not a twist put on the meaning of words.
examples:
- The heat caused a distortion in the metal sheet.
- The dent left a clear distortion in the side of the car.
