simpleMeaning: a Chinese fruit with a thin shell that breaks easily, sweet soft flesh like jelly, and
  one seed inside, and often dried
scope: A sweet Chinese fruit with a thin shell and one seed, also called lychee, leechee, lichi, litchee,
  litchi, and litchi nut; not a plum and not a cherry.
examples:
- She peeled a lichee and ate the sweet flesh inside.
- Dried lichee is sold in bags at the market.
