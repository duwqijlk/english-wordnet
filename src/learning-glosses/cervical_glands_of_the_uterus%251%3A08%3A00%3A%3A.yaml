simpleMeaning: mucus-making parts in the lining of the neck of the womb
scope: Mucus-making parts in the lining of the neck of the womb; cervical glands and glandulae cervicales
  uteri are other names for this sense, not the womb itself and not glands elsewhere in the body.
examples:
- The cervical glands of the uterus make mucus in the lining of the womb.
- Doctors study the cervical glands of the uterus to learn how mucus forms.
