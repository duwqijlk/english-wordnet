simpleMeaning: heart surgery where a blocked heart vessel is got round with small tools and tiny cameras
  passed through small cuts while the heart is stopped and a machine pumps blood
scope: Heart surgery done through small cuts with tiny cameras, not open-heart surgery with the chest
  cut wide open.
examples:
- The doctor did port-access coronary bypass surgery through tiny cuts.
- Port-access coronary bypass surgery kept her in hospital for a week.
