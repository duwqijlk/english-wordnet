simpleMeaning: In biology, a living thing whose traits come from a change in its chromosomes, the cell
  structures that carry genes.
scope: This is a biology term for a living thing changed by a genetic alteration, not an athletic activity
  and not a person who plays games.
examples:
- A sport appeared among the seedlings, with leaves quite unlike the parent plant.
- The nursery sells a rare sport that arose from a single mutated branch.
