simpleMeaning: A painting or drawing put into a book, above all in a book from the Middle Ages decorated
  by hand.
scope: A painting or drawing in a book, above all in a book from the Middle Ages, with miniature as another
  name for this sense, and not a state of knowing holy things or light falling on a surface.
examples:
- The illumination shows a king in bright colours and gold.
- The old book is full of illuminations of saints and flowers.
