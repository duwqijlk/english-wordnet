simpleMeaning: Each year, people in Britain mark the day Queen Victoria was born.
scope: Also called Commonwealth Day and Empire day, this is the day each year when Britain marks the birth
  of Queen Victoria, not the day she died and not any other queen's birthday.
examples:
- On May 24, Britain marks the birth of Queen Victoria.
- May 24 is a day when people think of Queen Victoria.
