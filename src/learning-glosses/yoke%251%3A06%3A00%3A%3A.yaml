simpleMeaning: 'A piece of animal gear for a pair of work animals: it joins them at the neck so they can
  work together as a team'
scope: This is the farm gear for two animals working as a team, not the wooden frame a person uses to
  carry buckets and not the fitted top part of a piece of clothing.
examples:
- The farmer put a yoke on the two oxen before they pulled the cart.
- The pair of horses worked under one yoke as they pulled the plough.
