simpleMeaning: cotton cloth made by weaving threads over and under each other in a plain, simple way
scope: A cotton cloth with a plain, simple weave; not a finished piece of clothing, and not cloth made
  from wool or silk.
examples:
- She bought white muslin to make a summer dress.
- The curtains were made of thin muslin that let the light in.
