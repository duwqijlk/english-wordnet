simpleMeaning: Faulty genes, or faults in how the body grows, leave the body in a wrong state.
scope: This wrong state of the body, also called abnormality, comes from faulty genes or faults in growth.
examples:
- An abnormalcy can follow faults in growth.
- Abnormalcy is another name for abnormality.
