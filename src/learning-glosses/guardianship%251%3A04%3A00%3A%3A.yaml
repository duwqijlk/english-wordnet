simpleMeaning: the duty of a person who looks after another person or a thing and keeps them safe
scope: The duty of looking after a person or a thing and keeping them safe, not the person who does this
  work.
examples:
- After his parents died, his aunt took guardianship of him.
- She was given guardianship of the house and land until the owner came back.
