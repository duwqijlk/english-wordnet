simpleMeaning: bright colours or marks on an animal that warn animals that hunt it to keep away
scope: Bright colours or marks on an animal that warn animals that hunt it to keep away, also called aposematic
  coloration; not colours for hiding and not colours for finding a mate.
examples:
- The skunk's warning coloration warns animals that hunt it to keep away.
- Warning coloration helps some animals avoid attack.
