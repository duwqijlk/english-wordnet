simpleMeaning: Black-faced apes that live in the middle part of Africa, close kin of the apes of the east.
scope: Black-faced apes of middle Africa, close kin of eastern apes, not the apes of the west and not
  gorillas.
examples:
- Central chimpanzees live in the forests of central Africa.
- A central chimpanzee groomed its young in the shade.
