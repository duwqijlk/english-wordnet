simpleMeaning: In cosmology, the idea that the sun and its planets formed as small bits of rock and dust
  were drawn together by the pull of gravity.
scope: In cosmology, the idea that the sun and its planets formed as small bits of rock and dust were
  drawn together by the pull of gravity; not the nebular idea and not the big bang idea.
examples:
- The planetesimal hypothesis says the planets grew from small rocky bits.
- Under the planetesimal hypothesis, the Earth formed slowly over millions of years.
