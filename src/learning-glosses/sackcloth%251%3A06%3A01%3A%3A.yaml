simpleMeaning: a piece of clothing made of rough, thick cloth, worn in the past to show that a person
  was sorry for wrong they had done
scope: A piece of clothing made of rough cloth, not the rough cloth itself before it is made into clothing.
examples:
- In the old story, the king wore sackcloth to show he was sorry.
- He put on sackcloth after hearing about the wrong he had done.
