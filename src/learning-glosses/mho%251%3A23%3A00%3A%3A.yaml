simpleMeaning: A unit that measures how well a thing lets electric current pass, equal to one divided
  by the number of ohms
scope: A unit of conductance, not a unit of resistance and not a unit of current.
examples:
- The wire's conductance was measured in mhos.
- A reading of five mho showed the wire let current pass well.
