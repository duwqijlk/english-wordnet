simpleMeaning: The yellow metal sets what each unit of money is worth, and that is the money system
scope: A money system where each unit of money is worth a set amount of the yellow metal, not a test of
  quality and not paper money on its own.
examples:
- Under the gold standard, a pound was worth a set weight of gold.
- The country left the gold standard in the nineteen thirties.
