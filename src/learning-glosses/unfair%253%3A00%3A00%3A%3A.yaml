simpleMeaning: not right or equal for everyone, and showing that one person or side is helped over another,
  or that people are tricked
scope: Describes something that is not right or equal for everyone. It is not the same as strict, where
  hard rules are still the same for everyone.
examples:
- It was unfair to give him more time than the others.
- The game was unfair because one team was allowed to break the rules.
