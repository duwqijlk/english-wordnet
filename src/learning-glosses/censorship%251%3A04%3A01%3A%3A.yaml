senseId: 'censorship%1:04:01::'
synsetId: 00822744-n
simpleMeaning: work done to stop the enemy from getting information, by banning or cutting out any information
  that could help the enemy
scope: This sense, also called censoring, is about keeping information that could help an enemy from that
  enemy; it is not the wider act of cutting parts from books, letters, or shows.
examples:
- Wartime censorship stopped soldiers from writing home about ship movements.
- Because of censorship, the letter had all details that could help the enemy cut out.
