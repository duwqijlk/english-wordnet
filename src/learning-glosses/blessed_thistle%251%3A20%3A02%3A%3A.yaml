simpleMeaning: A tall two-year thistle of the Old World, with big clasping white-blotched leaves and purple
  blooms, now settled wild in California and South America.
scope: This sense is also called holy thistle, lady's thistle, and milk thistle, a tall two-year thistle
  of the Old World, with big clasping white-blotched leaves and purple blooms, now settled wild in California
  and South America, unlike the sense for a one-year plant of the Mediterranean to Portugal having hairy
  stems and minutely spiny-toothed leaves and large heads of yellow flowers.
examples:
- Blessed thistles bloom purple in the Old World.
- The blessed thistle grows tall.
