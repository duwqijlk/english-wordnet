senseId: 'psychoanalyst%1:18:00::'
synsetId: 09809719-n
simpleMeaning: a person with a license who treats mind problems by talking with people about hidden thoughts
  and feelings from the past
scope: Also called an analyst, this is a person with a license who treats mind problems by talking about
  hidden thoughts. It is not a doctor who only gives medicine, and it is not an analyst who studies facts
  or numbers.
examples:
- She went to a psychoanalyst to talk about dreams and feelings from her childhood.
- The psychoanalyst listened as he talked about his past.
