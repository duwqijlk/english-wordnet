simpleMeaning: With long tube-shaped cones and five needles in a bunch, this middle-sized pine grows in
  southwestern California.
scope: This middle-sized pine of southwestern California, with five needles and long tube-shaped cones,
  is also called a grey-leaf pine or a soledad pine.
examples:
- I can name the sabine pine by its five needles.
- Look at the long cones of that sabine pine.
