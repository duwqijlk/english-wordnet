simpleMeaning: A shrub of cool northern bogs, green all year, with tough leaves and small white tube-shaped
  flowers.
scope: A shrub of cool northern bogs, not a tree of dry ground or a plant with big bright flowers; also
  called leatherleaf.
examples:
- Chamaedaphne calyculata keeps its leaves through the cold winter.
- White flowers opened on the Chamaedaphne calyculata in the bog.
