simpleMeaning: based on what a person thinks or decides
scope: This rests on a person's own thinking or decision; it is not the sense of being quick to find fault
  with other people.
examples:
- The final mark is judgmental, because two teachers may give different scores.
- Choosing the winner is a judgmental call with no single right answer.
