simpleMeaning: a small, light boat, pointed at both ends, moved by a person using a paddle
scope: This is the boat itself, a small light boat moved with a paddle; it is not the action of travelling
  in such a boat.
examples:
- We took a canoe out on the quiet lake.
- The canoe was light enough for one person to carry.
