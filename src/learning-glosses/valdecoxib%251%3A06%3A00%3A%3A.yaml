simpleMeaning: Without harming the gut, this drug eases pain and inflammation, sold under a trade name,
  by blocking one kind of body chemical.
scope: This is a pain drug sold under a trade name that leaves the gut unharmed.
examples:
- The doctor gave her valdecoxib for the pain in her knee.
- Valdecoxib eased the soreness in his ankle without upsetting his stomach.
