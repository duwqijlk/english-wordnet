simpleMeaning: Separate, group, or mark off units of words or music.
scope: This is about handling units of words or music, not about expressing something in words or the
  noun for a group of words.
examples:
- The conductor phrased the passage into three clear sections.
- She phrased the melody so that each small unit could breathe.
