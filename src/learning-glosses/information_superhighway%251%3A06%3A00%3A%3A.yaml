simpleMeaning: A wide net of linked computers, such as the internet, used to send sound, moving pictures
  and images fast, in number form.
scope: A wide net of linked computers for sending sound, pictures and images fast, not one computer alone
  and not a single phone line; superhighway is another name for this sense.
examples:
- The information superhighway carries news around the world in seconds.
- She learned to use the information superhighway at school.
