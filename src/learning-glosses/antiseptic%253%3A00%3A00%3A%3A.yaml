senseId: 'antiseptic%3:00:00::'
synsetId: 02122604-a
simpleMeaning: fully clean and free of the tiny living things that cause disease, or able to kill them
scope: This describes a place or thing that is clean and free of the tiny living things that cause disease;
  it is not the stuff itself that kills them, and not the sense of freeing something from error.
examples:
- The nurses worked in an antiseptic white room.
- Alcohol has an antiseptic effect on a cut.
