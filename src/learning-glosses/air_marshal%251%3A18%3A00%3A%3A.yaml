simpleMeaning: For safety, an ordinary passenger on a plane is a person trained by the state in the ways
  of hijackers and terrorists
scope: Also called a sky marshal, this is a person trained by the state who flies as an ordinary passenger
  to deal with hijackers and terrorists, not a pilot or a member of the cabin crew.
examples:
- The air marshal sat quietly among the passengers, ready to act if anyone tried to seize the plane.
- An air marshal travels on some flights to keep hijackers from taking control.
