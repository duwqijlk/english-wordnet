simpleMeaning: a picture of a person or scene, kept as a print, on a clear slide, or as computer data
scope: 'Also called a photo or a picture: a picture of a person or scene in one of these forms. Not the
  verb senses of taking such a picture or of being in one.'
examples:
- She kept an old photograph of her parents on the desk.
- The photograph shows a busy street in winter.
