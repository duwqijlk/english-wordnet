synsetId: 01774089-a
simpleMeaning: Not aimed at one person in particular, and not shaped by who someone is
scope: This is about something that takes no notice of the person, not about a thing that is cold in feeling.
examples:
- An impersonal corporation treats every worker the same.
- His impersonal remark gave nothing away about what he felt.
