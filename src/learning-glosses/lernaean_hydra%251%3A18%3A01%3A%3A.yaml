simpleMeaning: In Greek stories, a beast with nine heads, each cut-off head being replaced by two new
  ones.
scope: It is a nine-headed beast of Greek stories, not a one-headed beast and not a sea snake; also called
  Hydra.
examples:
- The Lernaean Hydra grew two heads for each one cut off.
- Hercules slew the Lernaean Hydra.
