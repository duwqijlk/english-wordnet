simpleMeaning: to drive a nail or screw in so that its head sits below the surface of the thing it goes
  into
scope: To drive a nail or screw in so that its head sits below the surface of the thing it goes into,
  also called set; not to leave the head sticking up and not the hole itself.
examples:
- He countersank the screws so the shelf would sit flat.
- Countersink each nail before you paint over the wood.
