simpleMeaning: 'of a person or what a person does: able or ready to cause pain or suffering to others'
scope: Used for a person, or for what a person does, when the person is able or ready to cause pain or
  suffering; fell, cruel, brutal and vicious are other names for this sense. Not speaking against someone
  in strong words, and not a fight done with great force.
examples:
- The guards gave the prisoners a savage beating for no reason.
- He was a savage ruler who liked to see people hurt.
