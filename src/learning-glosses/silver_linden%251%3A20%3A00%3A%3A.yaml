simpleMeaning: People grow this large tree from eastern Europe and Asia Minor for show, and the undersides
  of its leaves carry a thick coat of fine white hairs.
scope: This large tree is also called a silver lime.
examples:
- The silver linden is grown for show.
- The silver linden has leaves with white hairs underneath.
