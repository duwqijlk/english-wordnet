simpleMeaning: 'Of small living things that live on others, above all rusts: living out the whole of life
  on one host.'
scope: Of small living things that live on others, above all rusts, living out the whole of life on one
  host, not on two hosts in turn; also called autoecious.
examples:
- The homoecious rust lives its whole life on one plant.
- Homoecious fungi do not need a second host.
