simpleMeaning: A technical drawing of a thing as it would look if cut through flat, side to side, by a
  flat sheet
scope: A technical drawing of a thing as it would look if cut through flat, side to side; not a drawing
  of the outside of the thing, and not a cut made up and down.
examples:
- The horizontal section showed the rooms inside the building.
- In the horizontal section, the pipes run across the whole floor.
