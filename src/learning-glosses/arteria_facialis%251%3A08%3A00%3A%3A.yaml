simpleMeaning: The neck and face get their blood from side tubes sent out by this blood tube, which starts
  from the outer neck vessel.
scope: The facial artery — also called the external maxillary artery — is this blood tube, which starts
  from the outer neck vessel and feeds the neck and face.
examples:
- The arteria facialis gives off branches to the face.
- The arteria facialis starts from the outer vessel of the neck.
