simpleMeaning: material that a natural process has left behind in a place
scope: Stuff left behind by nature, such as by water or wind, not money put in a bank and not the act
  or process of stuff building up.
examples:
- A thick deposit of sand built up at the mouth of the river.
- The flood left a deposit of mud across the field.
