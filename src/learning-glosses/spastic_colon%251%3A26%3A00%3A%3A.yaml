simpleMeaning: Belly pain and loose stools that keep coming back, often changing with times when the bowels
  will not move, and often tied to worry or strain
scope: Belly pain and loose stools that keep coming back, often tied to worry or strain; irritable bowel
  syndrome and mucous colitis are other names for it, not a short stomach bug and not a bowel blockage.
examples:
- Her spastic colon gives her belly pain that keeps coming back.
- A spastic colon often flares up when she is under strain.
