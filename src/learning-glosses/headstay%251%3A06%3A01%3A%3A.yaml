simpleMeaning: The front-most rope that holds the mast, running from the bow or the bowsprit to the top
  of the mast.
scope: The front-most rope holding the mast, running from the bow to the mast top; not a rope at the back
  of the mast and not a rope that holds a sail.
examples:
- The headstay ran from the bow to the top of the mast.
- He checked the headstay before they set sail.
