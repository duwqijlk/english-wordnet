simpleMeaning: a small bushy tree of south-eastern United States that keeps some leaves through winter,
  with hairy young shoots and leaves that narrow to a thin stiff point
scope: 'Also called turkey oak: a small bushy tree of the south-east United States, not the taller white
  oak.'
examples:
- The bluejack oak grows on dry sandy soil in the south-east.
- A bluejack oak stood by the road with its leaves narrowing to stiff points.
