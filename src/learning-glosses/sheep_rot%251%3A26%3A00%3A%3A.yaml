simpleMeaning: a disease of the liver, above all in woolly farm animals and cattle, caused by liver flukes
  (small flat worms) and the waste they leave behind
scope: A disease of the liver in sheep and cattle caused by liver flukes, also called black disease, distomatosis
  and liver rot; not a disease of the lungs and not simple food poisoning.
examples:
- Several ewes died of sheep rot after grazing the wet fields.
- The vet said the sheep rot came from liver flukes.
