simpleMeaning: a flat, perfectly round curve, with every point on it the same distance from a fixed center
scope: This is the exact geometric curve, not something that only roughly resembles a round shape, not
  a tier of theater seats, and not the verb meaning to draw a boundary around something.
examples:
- He drew a circle with a compass and measured its diameter.
- The circumference of a circle equals pi times its diameter.
