senseId: 'administration%1:14:00::'
synsetId: 08181484-n
simpleMeaning: the people, committees and departments that together form the body that runs something
scope: This sense is the group of people who run something, also called organization, brass, establishment
  and governance. It is not the act of running something and not the act of giving medicine.
examples:
- The school administration sent a letter to all parents.
- Members of the city administration met to plan the new budget.
