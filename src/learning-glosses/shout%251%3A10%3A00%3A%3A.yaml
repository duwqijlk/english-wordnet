simpleMeaning: A loud call, often made in protest or opposition.
scope: The loud call itself, a noun also known as a cry or a call, not the act of speaking loudly and
  not a wordless cry of pure feeling.
examples:
- An angry shout came from the back of the hall.
- His shout of protest was drowned out by applause.
