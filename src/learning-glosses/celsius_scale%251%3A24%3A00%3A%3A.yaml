simpleMeaning: A way of measuring temperature in degrees that sets the point where water freezes at 0
  and where it boils at 100.
scope: A way of measuring temperature in degrees, also called centigrade scale and international scale;
  not the Fahrenheit way.
examples:
- On the Celsius scale, water boils at 100 degrees.
- The Celsius scale sets the freezing point of water at 0.
