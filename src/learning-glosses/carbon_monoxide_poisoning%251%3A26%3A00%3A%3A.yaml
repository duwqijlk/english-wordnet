simpleMeaning: A harmful state of the body caused by breathing in and taking in the deadly gas made when
  fuel burns without enough air.
scope: A harmful state of the body caused by breathing in the deadly gas made when fuel burns without
  enough air, not a burn and not a simple headache.
examples:
- Carbon monoxide poisoning killed 91 miners after the smoke filled the mine.
- She was treated for carbon monoxide poisoning after the faulty heater leaked.
