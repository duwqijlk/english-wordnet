simpleMeaning: a big car with very comfortable, costly fittings, usually driven by a paid driver
scope: This is a big car with very comfortable, costly fittings; limousine is another name for this sense;
  not an ordinary car, and not a bus.
examples:
- A limo waited outside the hotel to take them to the airport.
- The star arrived in a long black limo.
