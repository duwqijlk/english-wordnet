simpleMeaning: A group of Orthodox Jews that grew from a devout movement that began in eastern Europe
  in the late 1700s, a group that keeps the Mosaic law strictly.
scope: Also called Chassidim, Hasidim, Hasidism, and Hassidim; a group of Orthodox Jews from a devout
  movement of eastern Europe in the late 1700s, keeping the Mosaic law strictly.
examples:
- The Chasidim keep the Mosaic law strictly.
- Chasidim communities grew in eastern Europe in the 1700s.
