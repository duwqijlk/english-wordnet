simpleMeaning: a short-lived plant that lies flat and spreads like a mat, with rings of leaves and tiny
  pale green-white flowers, found all over North America
scope: A low plant that spreads flat like a mat, not a tall plant and not one with big showy flowers.
examples:
- Carpetweed spread across the bare patch of ground.
- The carpetweed formed a flat mat of leaves in the yard.
