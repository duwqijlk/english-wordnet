simpleMeaning: A member of the confederacy, above all the Muskogee, a people who once lived in Georgia
  and Alabama but now live mostly in Oklahoma.
scope: A member of the Creek Confederacy, not a member of another Native confederacy and not a person
  of Georgia alone.
examples:
- The Creek lived in Georgia and Alabama.
- Many Creek now live in Oklahoma.
