simpleMeaning: the job of coating the surfaces of houses with colour
scope: Another name for house painting — the trade of coating the surfaces of houses with colour — not
  the act of spreading colour over a surface, the art of making pictures, or a finished picture.
examples:
- He makes his living from painting, mainly the outside of houses.
- She found steady work in painting after finishing her apprenticeship.
