simpleMeaning: A sickness in which a person says the same word again and again, fast and without meaning
  to
scope: A sickness in which a word is said again and again without meaning to, not a stammer and not a
  word said on purpose.
examples:
- His palilalia made him say the word 'yes' over and over before he could move on.
- The doctor noted the palilalia in the boy, who kept repeating the same word without meaning to.
