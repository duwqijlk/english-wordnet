synsetId: 02997543-n
simpleMeaning: a fin under a sailing boat that can be pulled up, used to stop the boat sliding sideways
  in the wind
scope: A fin under a sailing boat that can be pulled up, also called a centerboard, a centreboard, and
  a sliding keel; not a fixed fin and not a rudder that steers the boat.
examples:
- He raised the drop keel as the boat entered shallow water.
- The drop keel kept the boat from sliding sideways.
