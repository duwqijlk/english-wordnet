simpleMeaning: At the back of the eye, in the tiny parts that catch light, sits a special colouring stuff
scope: A colouring stuff in the eye that catches light, not a measure of light and not damage to the eye.
examples:
- Scientists found a new photopigment in the cones of the retina.
- The photopigment sits in the rods and cones at the back of the eye.
