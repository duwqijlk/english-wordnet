simpleMeaning: a mark made by a person who measures land, on a thing that will not move, at a known place
  and height, used as a point to measure from
scope: A land-measuring mark, also called a bench mark; it is not a standard to judge other things by
  and not a test of how well a computer works.
examples:
- The benchmark on the old stone shows the exact height of the hill.
- Workers used the benchmark on the bridge as a starting point for their measurements.
