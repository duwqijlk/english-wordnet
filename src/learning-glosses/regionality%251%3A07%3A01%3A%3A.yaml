simpleMeaning: The quality of belonging to one place or area, and not to a whole land
scope: The quality of belonging to one place or area, and not to a whole land; not a tie to a whole large
  land, and not a tie to no place at all.
examples:
- The party's regionality prevented it from winning a national election.
- The regionality of the dish made it hard to find elsewhere.
