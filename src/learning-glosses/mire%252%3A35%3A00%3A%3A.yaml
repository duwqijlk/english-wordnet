simpleMeaning: to make something dirty with soft wet earth
scope: 'Also called mud and muck: to make something dirty with wet earth, not the noun for a soft wet
  area of land and not a hard situation you cannot get out of.'
examples:
- Playing in the wet garden mired the child's shirt and left it dirty.
- The soft wet earth mired her white shoes and made them brown.
