simpleMeaning: help that lets people stay alive or keep doing something, often by giving them a link they
  need
scope: Help that lets people stay alive or keep doing something, often by giving them a link they need;
  not a rope, but a thing or person that keeps hope or life going.
examples:
- The airlift provided a lifeline for Berlin.
- Her phone calls were a lifeline during his illness.
