simpleMeaning: an uneasy feeling about whether an action is right or proper, especially because of ideas
  about right and wrong
scope: 'Also called misgiving and qualm: an uneasy feeling about an action, not a rule of right and wrong
  that stops an action, and not a small unit of weight.'
examples:
- He felt a scruple about lying to his friend.
- She had scruples about taking money that was not hers.
