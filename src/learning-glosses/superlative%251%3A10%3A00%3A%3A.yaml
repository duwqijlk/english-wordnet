senseId: 'superlative%1:10:00::'
synsetId: 06706615-n
simpleMeaning: words that say much more than is true, usually used to praise someone or something
scope: This is words that say too much, usually to praise someone or something; not the form of a word
  that shows the most, like biggest or fastest.
examples:
- The review was full of superlatives about the new restaurant.
- He used superlatives to praise her singing, calling it the finest he had ever heard.
