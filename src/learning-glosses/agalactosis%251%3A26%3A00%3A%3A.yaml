simpleMeaning: a state in which no milk comes from a mother's breasts once her baby has been born
scope: Also called agalactia, this is a state in which no milk comes from a mother's breasts once her
  baby has been born, not a short supply of milk that grows over time and not a problem with the baby
  feeding.
examples:
- Agalactosis meant no milk came from her breasts after her baby was born.
- The nurse noted the agalactosis and helped the mother find another way to feed her baby.
