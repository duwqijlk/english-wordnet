simpleMeaning: a weapon, or a thing like a weapon, that fires a shot, most often a harpoon, at a huge
  sea animal
scope: A weapon, or a thing like a weapon, that fires a shot at a huge sea animal, most often a harpoon;
  not a harpoon thrown by hand and not a hunting rifle for land animals.
examples:
- The crew fired the whaling gun as the boat drew near.
- He loaded the whaling gun with a heavy harpoon.
