simpleMeaning: The bull dies at this point in a bullfight, killed by the fighter
scope: The point in a bullfight when the fighter kills the bull, not the start of the fight and not the
  time when a hard choice must be made.
examples:
- The moment of truth came when the matador raised his sword.
- At the moment of truth, the crowd fell silent.
