simpleMeaning: a gun, or the shot it fires, is called this when the hole down its barrel is a little less
  than half an inch across
scope: This word is also called .45-caliber, .45 caliber, and .45 calibre, and it is the size-name for
  the hole in a gun barrel, or the shot it fires, at a little less than half an inch across.
examples:
- She loaded her .45-calibre revolver.
- The .45-calibre bullets fit her revolver.
