synsetId: 13859208-n
simpleMeaning: a business situation in which two or more sellers are rivals, each trying to attract the
  same buyers.
scope: This is not the activity of trying to win a prize, and it is not one contest; it is the standing
  rivalry between businesses for buyers.
examples:
- Competition between the two supermarkets keeps prices low.
- There is fierce competition for customers in the phone market.
