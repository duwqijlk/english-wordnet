simpleMeaning: in a way that shows the strength and courage people think of as fitting a man
scope: Doing something in the manner people expect of a man, not the adjective sense of simply having
  such qualities.
examples:
- She manly faced the storm and kept the boat on course.
- Peggy manly shouldered her burden and went on with her day.
