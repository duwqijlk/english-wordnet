simpleMeaning: to cause someone great pain in their feelings or make them very unhappy
scope: This means making another person feel great pain in their feelings, not suffering great pain yourself.
examples:
- His cruel words anguished her for many weeks.
- The bad news anguishes him every time he hears it.
