simpleMeaning: In law, a court's list of cases to be tried, or a short account of the court's work.
scope: In law, the court's list of cases or its record of work, not a general plan for the day's jobs,
  and not the act of putting a case on the list.
examples:
- The case was first on the docket that morning.
- The docket showed three trials and two hearings.
