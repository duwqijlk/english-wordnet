simpleMeaning: Often cooked as a green vegetable, this plant of Asia looks like the leafy green it is
  named for and now grows wild in Europe and North America.
scope: It is also called garden orache, and it is a plant of Asia that looks like the leafy green it is
  named for and now grows wild in Europe and North America.
examples:
- People often cook mountain spinach as a green vegetable.
- In Europe and North America, mountain spinach now grows wild.
