simpleMeaning: one big seed sits inside rich yellow flesh, wrapped in green or nearly black skin, in a
  pear-shaped fruit of warm lands
scope: 'Also called avocado, aguacate, and alligator pear: a pear-shaped tropical fruit with one big seed,
  not a pear and not a fruit with many seeds.'
examples:
- She cut the avocado pear in half and took out its one big seed.
- The avocado pear on the tree had dark skin and soft yellow flesh inside.
