simpleMeaning: A fish, usually dark in colour with black spots and red fins.
scope: A spotted fish with red fins, not the burrowing animal, the small hoofed animal, or the short-eared
  mountain animal also called coney.
examples:
- The coney hid among the rocks on the reef.
- We saw a coney with red fins near the coral.
