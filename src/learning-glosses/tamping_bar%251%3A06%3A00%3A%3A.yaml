simpleMeaning: a tool for pressing stuff down, for example tobacco into a pipe bowl or a charge into a
  drill hole
scope: Also called a tamper and a tamp; not a hammer and not a drill itself.
examples:
- He used a tamping bar to pack the tobacco into the pipe.
- The miner pressed the charge down with a tamping bar.
