simpleMeaning: Information passed on in confidence, or shared in a way meant to keep other people from
  learning it.
scope: This is information shared in confidence with someone trusted, not general concealment, a hidden
  aim, method, or indulgence, communication made in a stealthy way, something not openly acknowledged,
  a hidden meaning, an unexpressed feeling, a hidden place or object, something built to escape detection,
  an official document marking, or a noun (a hidden fact, select-group knowledge, or an unexplained mystery).
examples:
- The board shared secret details of the deal only with its lawyers.
- The two generals exchanged secret messages through a trusted courier.
