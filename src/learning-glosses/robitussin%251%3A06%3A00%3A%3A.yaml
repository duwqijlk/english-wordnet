simpleMeaning: A cough drug sold under a trade name, that loosens phlegm and makes it easier to cough
  up.
scope: This is a trade name for a drug that loosens phlegm so it can be coughed up, not a drug that stops
  a cough.
examples:
- Robitussin loosens phlegm so you can cough it up.
- The doctor told him to take Robitussin for his cough.
