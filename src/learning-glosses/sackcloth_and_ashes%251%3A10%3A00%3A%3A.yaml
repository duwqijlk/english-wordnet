simpleMeaning: a show of deep sorrow for wrong done, or of deep grief
scope: A show of deep sorrow for wrong done, not a quiet private apology and not a sign of joy.
examples:
- In sackcloth and ashes, she begged for forgiveness.
- The king sat in sackcloth and ashes after his wrongdoing.
