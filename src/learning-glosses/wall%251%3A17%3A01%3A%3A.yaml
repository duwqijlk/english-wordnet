simpleMeaning: a smooth surface of rock that rises straight up or almost straight up, as in a cave or
  on a mountain
scope: This is not a built barrier that divides or protects a space, but a natural rock surface.
examples:
- The climbers edged along a sheer wall of granite.
- Water trickled down the cave wall into a shallow pool.
