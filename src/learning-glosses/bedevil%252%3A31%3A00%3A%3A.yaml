simpleMeaning: to mix someone up so much that they cannot think clearly
scope: This sense is also called fox, throw, confuse, confound, befuddle, discombobulate, and fuddle.
  It is about a person's mind being mixed up, not about a devil doing harm.
examples:
- The hard question bedeviled the whole class for an hour.
- His quick, unclear talk bedevils new students every year.
