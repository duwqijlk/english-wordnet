simpleMeaning: A part of the night's rest that comes round again and again, with no quick eye moves and
  no dreams, about three quarters of the night
scope: 'Also called nonrapid eye movement or nonrapid eye movement sleep: the part of the night''s rest
  with no quick eye moves and no dreams, not the dreaming part of sleep and not being awake.'
examples:
- Most of the night is spent in orthodox sleep.
- During orthodox sleep the eyes do not move fast and no dreams come.
