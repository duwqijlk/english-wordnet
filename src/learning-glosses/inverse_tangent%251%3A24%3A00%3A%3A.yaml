senseId: 'inverse_tangent%1:24:00::'
synsetId: 13810394-n
simpleMeaning: in maths, the angle that goes with a given number, found by undoing the ratio of the far
  side to the near side of a right-angled triangle
scope: In maths, the angle that goes with a given number, found by undoing the tangent, also called arc
  tangent, arctan or arctangent; not the tangent itself and not the inverse sine.
examples:
- The inverse tangent of 1 is 45 degrees.
- Use the inverse tangent to find the angle.
