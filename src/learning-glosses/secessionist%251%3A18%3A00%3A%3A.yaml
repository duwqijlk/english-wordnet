simpleMeaning: a person who supports a group breaking away from a larger state
scope: A person who supports a group breaking away from a larger state, not someone who wants to change
  the government from within and not someone who wants the group to stay in the state with more power.
examples:
- The secessionist argued that the region should govern itself.
- Secessionists held a rally in the capital.
