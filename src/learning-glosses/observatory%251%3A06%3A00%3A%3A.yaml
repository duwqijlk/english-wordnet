simpleMeaning: a building made and fitted with tools for watching stars, planets, and other things in
  the sky
scope: This is a building for watching the sky with special tools, not a laboratory for tests on Earth
  and not a place that only shows pictures of space.
examples:
- From the observatory on the hill, we watched the planets through a large telescope.
- The observatory opens at night so people can study the stars.
