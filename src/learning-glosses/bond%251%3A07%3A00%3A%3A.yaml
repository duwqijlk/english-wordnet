simpleMeaning: the way two things stick to each other, as glue to wood, or two faces made of unlike stuff
  join
scope: The way two things stick to each other, or two faces made of unlike stuff join, not a thing that
  holds a person fast and not a paper that says money is owed.
examples:
- The bond between the glue and the wood held firm.
- Heat made the bond of the two sheets strong.
