simpleMeaning: 'To cat is to vomit: to throw up what is in your stomach through your mouth.'
scope: This is a rare dialect and slang verb for vomiting; standard English says 'vomit' or 'throw up'.
  It is not the noun for the animal, and it is not the other verb 'cat', which means to beat someone with
  a cat-o'-nine-tails. The dialect verb 'sick' is another name for the same act.
examples:
- I thought I was going to cat right there in the aisle.
- The dog catted on the kitchen floor.
