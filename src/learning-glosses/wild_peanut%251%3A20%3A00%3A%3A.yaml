simpleMeaning: A vine of eastern North America with clusters of purple to maroon flowers and many edible
  single-seed pods that look like groundnuts and usually grow underground.
scope: This sense is the North American vine with purple to maroon flowers and edible pods that ripen
  underground; it is the same plant called hog peanut, not the cultivated peanut or other wild bean vines.
examples:
- A wild peanut can be found twining through the undergrowth in eastern woods.
- Wild peanuts ripen their pods in the soil instead of hanging them above ground.
