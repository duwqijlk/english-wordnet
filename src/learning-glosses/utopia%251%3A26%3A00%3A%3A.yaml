simpleMeaning: a state of life that is perfect in idea, especially in how people live together, how a
  country is run, and what people think is right and wrong
scope: This is the state of life that is perfect in idea, especially in how people live together, how
  a country is run, and what people think is right and wrong; not a made-up story about such a place.
examples:
- They dreamed of a utopia where all people lived in peace and fairness.
- In their plan for a utopia, work and land would be shared by all.
