simpleMeaning: How far above the line where earth meets sky a thing sits, as an angle, above all a star
  or planet.
scope: Not the angle round the sky from north, which is azimuth; also called altitude, elevation and EL.
examples:
- The star's ALT was 30 degrees above the horizon.
- We read the ALT of the planet at dusk.
