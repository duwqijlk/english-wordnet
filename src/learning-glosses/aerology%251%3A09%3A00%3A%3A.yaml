simpleMeaning: the study of the whole air around the earth, most of all its high parts
scope: The study of the air around the earth, most of all its high parts, not the study of weather near
  the ground and not the study of space beyond the air.
examples:
- She took up aerology to learn how the high air moves.
- Aerology looks at the whole air around the earth, from the ground to its top.
