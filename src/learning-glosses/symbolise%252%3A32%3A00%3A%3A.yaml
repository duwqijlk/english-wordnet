simpleMeaning: to stand for something else through a picture, shape, or thing
scope: To stand for something else through a picture, shape, or thing, with symbolize as another name
  for this sense, not to say something straight out and not to make a picture of a thing.
examples:
- The white dove symbolises peace.
- In the poem, the river symbolises time passing.
