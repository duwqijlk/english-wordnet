simpleMeaning: A strange plant of dry southwestern Africa with a yard-high yard-wide turnip-like trunk,
  taproot and two woody strap-like leaves; a living relic of a vanished flora, some 700-5,000 years old.
scope: Also called welwitschia; a strange plant of dry southwestern Africa with a turnip-like trunk and
  two strap-like leaves, not a cactus and not a tree.
