simpleMeaning: a wife whose work is running the home, while the money for the family comes from her husband's
  work
scope: 'Also called homemaker: a wife who runs the home while her husband earns the family money, not
  a person paid to clean or run another person''s home.'
examples:
- She was a housewife who ran the home while her husband worked in a factory.
- The housewife spent the morning cooking and cleaning for her family.
