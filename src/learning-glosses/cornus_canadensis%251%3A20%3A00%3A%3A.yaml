simpleMeaning: A creeping plant that lives for years, known for red berries and rings of leaves at the
  tips of its shoots; from Greenland to Alaska.
scope: A creeping plant with red berries and rings of leaves at its shoot tips, also called a bunchberry,
  a crackerberry, a dwarf cornel or a pudding berry.
examples:
- The Cornus canadensis spread in a low mat under the spruce trees.
- Cornus canadensis berries turned bright red in late summer.
