simpleMeaning: Crude and unpolished in a person or their behaviour, with no delicacy or good breeding.
scope: This describes a person or behaviour that is crude and unpolished, not one that is cruel or unkind,
  nor one ready to use force.
examples:
- His rough manners made the dinner awkward for everyone.
- She has a rough way of speaking that some people find off-putting.
