simpleMeaning: A small wind pipe with a mouthpiece with a narrow slit, four digit openings and two thumb
  openings
scope: This is a small wind pipe with a mouthpiece with a narrow slit and six openings; shepherd's pipe
  and treble recorder are other names for this sense, not the bean kind of flageolet and not a plain pipe
  with eight openings.
examples:
- She played a flageolet at the dance.
- The flageolet sounded sweet and high.
