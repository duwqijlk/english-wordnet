simpleMeaning: A set of ills brought on by a virus, most often found in one place; fever and gut signs
  come first, then the small blood tubes bleed.
scope: A set of virus ills found most often in one place, with fever and gut signs before bleeding; also
  called haemorrhagic fever, hemorrhagic fever, viral haemorrhagic fever and viral hemorrhagic fever.
examples:
- VHF broke out in the river valley that summer.
- Doctors feared VHF when fever was followed by bleeding.
