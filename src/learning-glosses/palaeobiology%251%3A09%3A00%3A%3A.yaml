simpleMeaning: the part of the study of fossils that deals with how fossil animals and plants began, grew
  and were built as living things
scope: The part of the study of fossils that deals with how fossil animals and plants began, grew and
  were built as living things; paleobiology is another name for this sense, and it is not the study of
  living animals or the study of rocks.
examples:
- Palaeobiology looks at fossils as once-living things.
- She studied palaeobiology at university.
