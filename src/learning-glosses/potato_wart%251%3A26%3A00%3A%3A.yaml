  caused by a fungus, takes hold.
scope: This sickness, caused by a fungus, makes dark lumps, soft and full of holes, in the eyes of the
  tubers.
examples:
- The potato wart showed as dark lumps in the eyes of the tubers.
- The tubers turned lumpy and dark where the potato wart struck.
