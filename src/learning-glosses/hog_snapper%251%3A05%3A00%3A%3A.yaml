simpleMeaning: A big sea fish of the west Atlantic; the male's head looks like a pig's nose.
scope: A big sea fish of the west Atlantic whose males have a head like a pig's nose, not a grouper and
  not a snapper of another kind; also called a hogfish.
examples:
- The hog snapper is a big fish of the west Atlantic.
- The male hog snapper has a head like a pig's snout.
