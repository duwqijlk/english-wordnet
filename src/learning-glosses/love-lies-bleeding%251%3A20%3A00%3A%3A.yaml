simpleMeaning: A plant whose young leaves are much used as green food, and whose seeds are used as grain.
scope: A plant with young leaves eaten as a green food and seeds used as grain, not a plant grown only
  for its flowers.
examples:
- She picked love-lies-bleeding leaves for the salad.
- The farmer ground love-lies-bleeding seeds into flour.
