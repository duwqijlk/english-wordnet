simpleMeaning: to say by law that something counts, or to make it count by law
scope: Also called validate; another name is formalise. This sense is about making something count in
  law, not the other sense of making something formal or official.
examples:
- The court formalized the agreement by signing it into law.
- They formalized the marriage with a legal paper.
