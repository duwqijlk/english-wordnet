simpleMeaning: In physiology, the process by which a living thing takes in food and uses it to grow and
  to stay alive and well
scope: This is the process by which a living thing takes in and uses food, not the food itself and not
  the study of food.
examples:
- Good nutrition helps children grow strong and stay well.
- Plants get their nutrition from the soil, the water, and the light.
