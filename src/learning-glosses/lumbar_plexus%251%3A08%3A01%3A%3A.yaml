senseId: 'lumbar_plexus%1:08:01::'
synsetId: 05514919-n
simpleMeaning: A net of tubes carrying clear fluid, lying along the lower part of the body's main blood
  tube and the blood tubes of the hip.
scope: This is a net of tubes carrying clear fluid along the lower part of the main blood tube, not the
  net of nerves in the same place, which is the other sense of lumbar plexus; plexus lumbalis is another
  name for this sense.
examples:
- The lumbar plexus drains fluid from the lower belly.
- The lumbar plexus lies beside the aorta.
