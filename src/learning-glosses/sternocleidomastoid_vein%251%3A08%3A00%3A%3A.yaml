simpleMeaning: A blood tube that drains the big neck muscle and empties into the large blood tube in the
  neck
scope: A blood tube that drains the big neck muscle, also called a vena sternocleidomastoidea; not the
  large blood tube that feeds the neck and not a neck artery.
examples:
- The sternocleidomastoid vein drains the big neck muscle.
- The surgeon traced the sternocleidomastoid vein to the large blood tube in the neck.
