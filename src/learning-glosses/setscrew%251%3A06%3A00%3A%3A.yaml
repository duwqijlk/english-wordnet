simpleMeaning: A small screw, often headless, that locks a wheel or cam to its shaft so the part cannot
  slip.
scope: For a screw that holds a wheel or cam fast to its shaft.
examples:
- The setscrew holds the wheel fast to the shaft.
- A setscrew keeps the cam from slipping.
