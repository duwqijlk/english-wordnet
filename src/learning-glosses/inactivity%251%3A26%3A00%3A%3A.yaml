simpleMeaning: the state of doing nothing and not moving or working
scope: 'Also called inaction: the state of doing nothing; not the sense that also covers doing less than
  before, and not a person''s lasting tendency to do nothing.'
examples:
- The town fell into inactivity after the mine closed.
- A long period of inactivity followed the end of the war.
