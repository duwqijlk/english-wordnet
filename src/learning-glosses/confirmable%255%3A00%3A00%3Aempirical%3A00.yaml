simpleMeaning: Able to be put to the test, shown true or shown false, by a trial or by watching
scope: Able to be put to the test, also called verifiable and falsifiable, not a claim that cannot be
  checked and not a guess with no way to test it.
examples:
- A good claim is confirmable by trial or by watching.
- The scientist asked whether the idea was confirmable.
