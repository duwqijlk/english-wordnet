simpleMeaning: paint made by mixing colour powder into a thick liquid, used by artists.
scope: It is not the cooking or machine liquid and not the fuel taken from the ground; it is the kind
  of paint an artist puts on a canvas.
examples:
- The portrait was painted in oils, so the colours look rich and deep.
- He bought a set of oils and some new brushes for his art class.
