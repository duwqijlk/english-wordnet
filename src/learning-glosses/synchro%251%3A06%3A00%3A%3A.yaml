senseId: 'synchro%1:06:00::'
synsetId: 04177755-n
simpleMeaning: a set of two linked machines, a power maker and a power user, in which the user takes the
  same spot as the maker; the two stay in step
scope: Also called a selsyn; not a single motor and not a switch that merely turns power on and off.
examples:
- The synchro kept the motor in the same place as the generator.
- Engineers tested a synchro on the new machine.
