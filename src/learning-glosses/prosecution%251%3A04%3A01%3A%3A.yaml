simpleMeaning: The carrying on of something started, until it is finished.
scope: This is carrying on something started until it is finished; not a trial in court, and not the start
  of something.
examples:
- The prosecution of the great work took him twenty years.
- They urged the prosecution of the road until it reached the sea.
