simpleMeaning: a light that gives off beams from the vapour of a silver-white metal, used to treat health
  problems or to improve how a person looks
scope: A lamp used in medical or beauty care, also called a sun lamp, a sunlamp and a sunray lamp, not
  an ordinary room light and not a lamp that gives light only for seeing.
examples:
- The clinic uses a sun-ray lamp for skin treatments.
- She lay under the sun-ray lamp while the nurse watched the clock.
