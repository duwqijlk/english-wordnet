simpleMeaning: An Italian brandy, a strong grape drink, made from what is left of the grapes after they
  are pressed
scope: This is the strong Italian drink made from what is left after grapes are pressed; it is not wine,
  and not brandy made from whole fruit.
examples:
- After dinner in Italy, he drank a small glass of grappa.
- This grappa is made from grapes left over after the wine pressing.
