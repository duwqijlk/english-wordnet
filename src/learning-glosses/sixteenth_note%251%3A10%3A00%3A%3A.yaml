simpleMeaning: In music, a short sound lasting one part in sixteen of a full-length sound
scope: In music, a short sound lasting one part in sixteen of a full-length sound; not a longer sound,
  and not a rest or silence.
examples:
- She played a quick sixteenth note on the piano.
- The sixteenth note came just before the beat.
