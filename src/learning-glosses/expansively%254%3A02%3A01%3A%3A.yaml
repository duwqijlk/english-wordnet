simpleMeaning: in a grand and large way that people notice and admire
scope: In a grand, large way that people notice. It is not only about being wide, and not about talking
  in a warm and open way.
examples:
- Though she did not earn much, she lived expansively, with large parties and good food for friends.
- He spent his money expansively, buying travel and gifts for many people.
