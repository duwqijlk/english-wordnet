simpleMeaning: having some form of schizophrenia, a serious illness of the mind that can change how a
  person thinks and sees what is real
scope: This describes a person who has the illness, not a person named by the noun form and not just anything
  to do with the illness.
examples:
- The schizophrenic patients get care in a special part of the hospital.
- She is a schizophrenic woman who hears voices and needs daily help.
