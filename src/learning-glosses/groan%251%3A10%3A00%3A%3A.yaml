simpleMeaning: a low sound you make to show pain or to show you think something is bad or wrong
scope: 'Also called a moan: a low sound that shows pain or that you think something is bad or wrong, not
  the act of making that sound.'
examples:
- A groan came from the man with the bad back.
- He gave a groan when he heard the bad news.
