simpleMeaning: A part in a gun that pulls an empty shell out of the chamber and hands it to the ejector.
scope: A part in a gun that pulls an empty shell out of the chamber and hands it to the ejector; also
  called cartridge extractor or cartridge remover; not a tool for pulling out tight-fitting parts, nor
  a device that spins to part bits from a liquid.
examples:
- Their extractor pulled the shell.
- The extractor was fitted at noon.
