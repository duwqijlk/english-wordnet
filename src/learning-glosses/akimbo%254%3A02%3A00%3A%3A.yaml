simpleMeaning: with your hands on your hips and your elbows pointing out
scope: This describes a way of standing with hands on hips and elbows out, not with arms hanging down
  or crossed.
examples:
- She stood akimbo and looked at the mess.
- He waited akimbo in the doorway, with his hands on his hips.
