simpleMeaning: A small fish of India whose gills are changed so it can breathe air; it has spiny chest
  fins that let it move on land
scope: A small fish that can breathe air and move on land; climbing perch and Anabas testudineus are other
  names for this sense, not an ordinary perch that lives only in water.
examples:
- The A. testudineus climbed out of the pond on its spiny fins.
- An A. testudineus can breathe air for a short time out of water.
