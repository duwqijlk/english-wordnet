simpleMeaning: a port where goods can be brought in and then sent out again with no tax paid on them
scope: This is a port where goods can be brought in and sent out again with no tax paid on them; entrepot
  is another name for this sense, not a port where goods are kept for sale and not a place where goods
  are made.
examples:
- The transshipment center let goods pass through with no tax paid on them.
- Bahrain has been a transshipment center for trade between Arabia and India for a long time.
