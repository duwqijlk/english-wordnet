simpleMeaning: The bend where the lower arm meets the upper arm, and the same bend in the front leg of
  a four-legged animal.
scope: Also called elbow, cubital joint, elbow joint, human elbow, and articulatio cubiti; the bend of
  the arm, not the bend of the leg and not the wrist.
examples:
- The cubitus is the joint between the forearm and the upper arm.
- Pain in the cubitus made it hard to bend his arm.
