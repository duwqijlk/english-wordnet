simpleMeaning: a tool used in sports, usually with a handle and an oval frame with a tight net of strings,
  used to hit a ball or a shuttlecock in games
scope: 'Also called racket: this is the sports tool for hitting a ball or a shuttlecock, not a bat with
  no strings.'
examples:
- She bought a new racquet for her tennis lesson.
- He hit the shuttlecock with his racquet.
