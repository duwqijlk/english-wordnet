simpleMeaning: A baby born with the large gut lacking its usual nerves feels little urge to pass waste,
  so waste builds up and the gut grows large.
scope: This is a state a baby is born with, in which the large gut lacks its usual nerves and waste builds
  up inside it.
examples:
- Congenital megacolon meant the baby rarely passed waste.
- The baby with congenital megacolon had little urge to pass waste.
