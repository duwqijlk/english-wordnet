simpleMeaning: when the heart and blood tubes do not give the body parts enough blood
scope: The heart and blood tubes do not send enough blood to the body parts; not a block in one blood
  tube alone and not a lack of blood in the body.
examples:
- After the circulatory failure, her hands and feet got cold and pale.
- The doctors said the circulatory failure was why her body parts were not getting enough blood.
