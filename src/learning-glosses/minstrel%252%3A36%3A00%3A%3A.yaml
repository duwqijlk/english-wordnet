simpleMeaning: to sing songs of praise for a person or event, in the way of old traveling singers
scope: 'The verb: singing in praise in the old traveling-singer way, not the noun for a performer in a
  minstrel show.'
examples:
- He would minstrel from town to town, singing of brave knights and fair ladies.
- The group minstrels through the hall, singing songs to honor the bride.
