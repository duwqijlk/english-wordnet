simpleMeaning: having thin lines or grooves on its surface
scope: This describes a surface that has thin lines or grooves on it; it is not the verb sense, which
  means to make such lines on something.
examples:
- The striate shell has thin lines running across it.
- The doctor looked closely at the striate marks on her skin.
