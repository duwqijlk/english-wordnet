simpleMeaning: a piece of furniture made of parts that can be put in place on their own or joined together
scope: Furniture made of parts you can use apart or join together, not a word about a cut through something,
  a division into parts, or one small area of a country.
examples:
- They bought a sectional that they could split into three pieces for the small room.
- The sectional in the living room can be joined together to make one big sofa.
