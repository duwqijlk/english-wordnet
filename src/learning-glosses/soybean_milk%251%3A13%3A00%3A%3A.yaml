simpleMeaning: This drink stands in for dairy, made from flour of the beans it is named for and water,
  and it goes into some food for babies and into tofu.
scope: It is also called soya milk and soymilk, a drink that stands in for dairy and not the white liquid
  that comes from cows.
examples:
- The baby's food was made with soybean milk.
- Tofu was made with soybean milk.
