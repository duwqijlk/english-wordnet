senseId: 'anagoge%1:09:00::'
synsetId: 06256371-n
simpleMeaning: a way of reading a text to find a hidden, holy meaning behind the words, most often in
  a holy book
scope: A way of reading a text for a hidden holy meaning, most often in a holy book; not a reading that
  takes the words at face value.
examples:
- The priest offered an anagoge of the passage, reading it as a picture of heaven.
- In her essay she gave an anagoge of the psalm, finding a holy meaning behind its words.
