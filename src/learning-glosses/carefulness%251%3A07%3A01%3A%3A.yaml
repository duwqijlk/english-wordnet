senseId: 'carefulness%1:07:01::'
synsetId: 04671415-n
simpleMeaning: Taking care and keeping watch for what may go wrong, as a settled way of acting.
scope: Also called caution and cautiousness, this is the quality of taking care and watching out for danger,
  not the use for being careful and painstaking in one's work.
examples:
- Her carefulness kept the children safe.
- Carefulness in the lab stopped accidents.
