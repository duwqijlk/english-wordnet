simpleMeaning: getting free of a wrong belief or a false idea about how things are
scope: To get free of a wrong belief or a false idea, also called disillusion or disillusionment, and
  not to fall under a spell or to gain a new hope.
examples:
- Her disenchantment with the leader began when she saw the promises were empty.
- His disenchantment grew as the grand claims turned out to be untrue.
