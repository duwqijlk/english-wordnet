simpleMeaning: Sheep skin treated so it keeps, with the wool still on it, for making clothes
scope: Sheep skin with the wool left on, used for clothes; not a paper that proves a course was finished,
  and not skin made ready for writing on.
examples:
- He wore a sheepskin coat against the winter cold.
- Her sheepskin jacket kept her warm in the snow.
