simpleMeaning: a thin layer of cells from the middle layer of the embryo, lining the body's first hollow
  space
scope: A thin layer of cells from the middle layer of the embryo, lining the body's first hollow space;
  not the skin, and not the lining of blood vessels.
examples:
- The mesothelium lines the body's first hollow space in the embryo.
- Mesothelium grows from the middle layer of the young embryo.
