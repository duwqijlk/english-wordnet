simpleMeaning: To say that a thing is true, or that it is real and does exist
scope: 'Also called admit: to say that a thing is true or real, not to take a paper as good in law and
  not to show you have seen a person.'
examples:
- He acknowledged his errors before the whole class.
- She acknowledged that she might have forgotten the meeting.
