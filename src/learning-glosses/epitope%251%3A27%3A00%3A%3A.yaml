simpleMeaning: A germ-fighting part made by the body fastens on to this small place on the outside of
  a thing that sets off the body's defences
scope: 'Also called antigenic determinant and determinant: the small place where a germ-fighting part
  fastens on, not the whole defence-triggering thing and not the germ-fighting part itself.'
examples:
- The antibody locks onto the epitope on the surface of the virus.
- Each epitope on the antigen gives the antibody a place to fasten on.
