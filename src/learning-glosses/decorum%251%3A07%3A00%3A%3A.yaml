simpleMeaning: good and polite behaviour in the way you act and speak, as people think is right
scope: Polite, right behaviour in how you act and speak; it is not a law or a set of written rules.
examples:
- She kept her decorum even when the crowd was rude.
- Good decorum is expected at a formal dinner.
