simpleMeaning: a creeping raspberry of cool northern lands, with yellow or orange berries
scope: A creeping raspberry of cool northern lands, also called the bakeapple, the baked-apple berry,
  the cloudberry, and the salmonberry; not a tall berry bush and not a plant with red berries.
examples:
- The dwarf mulberry spread low across the mossy ground.
- Dwarf mulberry berries turn yellow or orange when ripe.
