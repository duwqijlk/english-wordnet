simpleMeaning: a state of still, inactive rest, without movement or activity
scope: A state of still, inactive rest, also called dormancy, quiescence or quiescency, not the state
  or act of being asleep and not an animal's resting posture.
examples:
- The long sleeping of the town was broken by the sound of hammering.
- Birds returned and roused the garden from its winter sleeping.
