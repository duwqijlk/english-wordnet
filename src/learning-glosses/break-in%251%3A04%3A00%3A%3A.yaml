senseId: 'break-in%1:04:00::'
synsetId: 00786917-n
simpleMeaning: Entry onto another person's land or property without the right to do so, for an unlawful
  purpose.
scope: Going onto another's property without the right, for an unlawful purpose; breaking and entering
  and housebreaking are other names for this sense, not a burglary itself and not a break for rest.
examples:
- The break-in happened while the family was on holiday.
- Police said the break-in was planned to steal jewellery.
