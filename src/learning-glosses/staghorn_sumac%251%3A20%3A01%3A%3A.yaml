simpleMeaning: A deciduous (leaf-shedding) bushy tree of eastern North America, with compound leaves turning
  brilliant red in fall and dense branched clusters of greenish yellow flowers followed by acidic crimson
  berries.
scope: This eastern North American sumac with red autumn foliage and crimson berries, not smooth sumac
  or poison sumac.
examples:
- Staghorn sumac turns a brilliant red in autumn.
- The crimson berries of staghorn sumac taste sharply acidic.
