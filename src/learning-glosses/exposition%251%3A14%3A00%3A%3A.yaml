simpleMeaning: Things gathered together — goods, works of art, or the like — and put on show for the public.
scope: 'Also called exhibition or expo: a gathering of goods or works of art put out for the public to
  see, not an account that explains a writing, not a written explanation of a topic and not the opening
  part of a piece of music.'
examples:
- The exposition of new machines drew crowds all week.
- They visited the exposition to see the paintings on show.
