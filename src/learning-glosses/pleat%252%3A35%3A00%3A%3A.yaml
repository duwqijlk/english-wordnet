simpleMeaning: to fold or gather cloth so that it forms a strip of folds
scope: To fold or gather cloth so that it forms a strip of folds; ruffle is another name for this sense,
  not the fold itself, and not simply to fold cloth into flat folds.
examples:
- Pleat the curtain fabric along the top edge.
- She pleated the skirt before sewing it.
