synsetId: 00367105-a
simpleMeaning: With three crystal lines of different lengths, two of which meet at a slant
scope: With three crystal lines of different lengths, two of which meet at a slant; not a crystal with
  all lines the same length, and not one in which all joins are at right angles.
examples:
- The monoclinic crystal showed three lines of different lengths.
- This monoclinic sample has one slanting join between its crystal lines.
