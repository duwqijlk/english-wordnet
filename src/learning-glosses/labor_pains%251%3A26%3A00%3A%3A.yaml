simpleMeaning: Sudden aches that come back again and again at set times during the birth of a baby.
scope: Sharp aches that come back again and again at set times during the birth of a baby; birth pangs
  and labour pains are other names for this sense, not aches from sickness and not aches after the birth.
examples:
- Her labor pains began in the early morning.
- The labor pains came every few minutes.
