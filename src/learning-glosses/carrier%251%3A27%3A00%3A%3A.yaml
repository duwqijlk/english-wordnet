simpleMeaning: an inactive material that holds a radioactive marker made of the same material and helps
  get it back after a chemical change
scope: An inactive material that helps get a radioactive marker back, not a living thing that passes on
  a hidden gene, a warship, or a rack on a vehicle.
examples:
- The carrier helped the lab get the marker back after the reaction.
- A small amount of carrier was added to the radioactive sample.
