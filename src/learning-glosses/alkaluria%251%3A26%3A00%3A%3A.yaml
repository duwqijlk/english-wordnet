simpleMeaning: a state in which the water the body passes out, which is most often a little bit acid,
  is now the opposite of acid
scope: 'Another name for this is alkalinuria: a state of the water the body passes out, not the normal
  acid state of that water, and not a state of the blood.'
examples:
- Alkaluria showed up in the test of his urine.
- The nurse noted alkaluria and asked the doctor about it.
