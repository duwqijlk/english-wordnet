simpleMeaning: For a computer, not a music player, this small round plate keeps a large store of facts
  as a code of numbers, to be read but never changed.
scope: This plate belongs to a computer, not to a music player, and what it holds can be read but never
  changed by the user.
examples:
- The compact disc read-only memory held the whole dictionary for the computer to read.
- She loaded the program from a compact disc read-only memory.
