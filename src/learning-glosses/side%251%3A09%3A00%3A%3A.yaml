simpleMeaning: one feature or part of a matter, understood by contrast with another part that is left
  unsaid.
scope: This is not a physical edge, face, or cut of meat; it is a feature of a situation or idea.
examples:
- There is a darker side to the story that nobody mentions.
- You have to look at the practical side of the plan.
