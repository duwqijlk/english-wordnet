senseId: 'insurgent%1:18:00::'
synsetId: 10229738-n
simpleMeaning: a person who takes part in fighting with weapons against the people in power, especially
  in the hope of making life better
scope: 'Also called a rebel or an insurrectionist: a person who fights with weapons against the people
  in power. Not the other sense of this word: a member of an armed group that is not a regular army and
  fights a stronger force by damaging what that force owns and by attacking it again and again to trouble
  it.'
examples:
- The insurgents took control of the town hall after a week of fighting.
- The government sent soldiers to fight the insurgent groups in the hills.
