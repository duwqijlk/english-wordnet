simpleMeaning: Cheering from spectators that urges someone on.
scope: Support from spectators who cheer someone on ('cheering' is another name), not a wordless cry of
  pain or excitement.
examples:
- The shouting from the stands grew louder as the home team pushed forward.
- Her father's shouting from the touchline urged her on through the last lap.
