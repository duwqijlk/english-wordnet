simpleMeaning: a measure of how much electric charge moves past a point when a flow of one amp runs for
  one second
scope: A measure of electric charge; ampere-second is another name for this sense, not a measure of how
  strong the flow is and not a measure of power.
examples:
- One coulomb flows past the point each second when the current is one amp.
- The charge was measured at two coulombs.
