simpleMeaning: a person who buys now because they think prices will rise, and who plans to sell what they
  bought later
scope: This sense is a person who buys now because they think prices will rise; not a male animal, not
  a formal paper from the pope, and not speaking without care for the truth.
examples:
- The bull bought more shares before prices rose.
- Bulls kept buying, sure that prices would go up.
