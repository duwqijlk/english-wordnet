simpleMeaning: To treat a piece of tissue (the material that makes up body parts) with chemicals so it
  stops decaying and stays firm for viewing under a microscope.
scope: This is a laboratory step that treats tissue so it can be studied under a microscope, not the arranging
  of things beforehand and not a favour bought with money.
examples:
- The samples were fixed in formalin overnight before being sliced for the microscope.
- Technicians fix each tissue sample within minutes to keep its structure intact.
