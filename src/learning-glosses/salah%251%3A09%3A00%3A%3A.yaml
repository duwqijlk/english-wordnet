simpleMeaning: Best said in a mosque, this fixed form of prayer is said five times a day facing Mecca,
  as the second pillar of Islam
scope: A fixed form of prayer said five times a day facing Mecca, also called salaah, salaat and salat,
  not prayer in general.
examples:
- She says her salah five times a day.
- They say salah facing Mecca.
