simpleMeaning: freed from the chemical mix it was joined to, as happens with a gas, for one
scope: A thing set free from the mix it was joined to in a chemical change, as a gas may be, not a person
  set free and not a gas simply let out of a container.
examples:
- The liberated gas rose from the liquid as it warmed.
- Heat liberated the gas from its chemical bonds.
