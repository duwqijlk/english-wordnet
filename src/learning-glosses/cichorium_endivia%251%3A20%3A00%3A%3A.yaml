simpleMeaning: A herb grown widely for its leaves, prized as a salad green, with either curly, jagged
  leaves or broad, flat ones that are usually made pale
scope: Among salad herbs, this one is grown widely for leaves that are either curly and jagged or broad
  and flat and usually made pale; endive and witloof are other names for it.
examples:
- Cichorium endivia grows in rows in the garden.
- We add Cichorium endivia leaves to the salad.
