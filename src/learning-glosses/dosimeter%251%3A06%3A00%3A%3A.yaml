simpleMeaning: how much ionizing radiation, such as X-rays or radioactivity, has been taken in is shown
  by this measuring tool
scope: 'Also called dosemeter: a tool that shows how much ionizing radiation has been taken in, not a
  Geiger counter and not a thermometer.'
examples:
- The dosimeter on his chest recorded the radiation dose for the day.
- She checked her dosimeter after working near the X-ray machine.
