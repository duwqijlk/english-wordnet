schema: oewn-learning-gloss-v2
senseId: 'antimetathesis%1:10:01::'
synsetId: 92465794-n
simpleMeaning: In rhetoric, a figure that reverses the two main words of one clause in the next, as in
  'a poem is a speaking picture; a picture a mute poem'.
scope: This is the specific figure that swaps the two main words of one clause in the next; it is not
  a plain antithesis, which merely balances two opposing ideas, and not mere repetition of a word for
  emphasis.
examples:
- 'The essay closes with an antimetathesis: ''a poem is a speaking picture; a picture a mute poem''.'
- Students of rhetoric learn antimetathesis as a way of reversing two key terms in the second half of
  a sentence.
