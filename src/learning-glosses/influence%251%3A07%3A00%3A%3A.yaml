simpleMeaning: the ability to affect what people do or what happens, especially because others respect
  or admire you
scope: This is the power or standing that makes others listen, not the verb meaning to have an effect
  on them.
examples:
- She used her influence to get the project approved.
- The country's influence in the region has grown.
