simpleMeaning: Sending out waves of electric and magnetic energy on purpose, or bouncing them back, to
  stop an enemy from using electronic devices or systems
scope: This is sending out energy waves to stop an enemy from using electronic devices, not the sweet
  crushed fruit you put on bread, and not the verb sense of blocking signals.
examples:
- Enemy jam made their radios stop working during the attack.
- A strong jam blocked the enemy radar and hid the planes.
