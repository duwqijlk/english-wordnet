simpleMeaning: the thoughts, feelings and ideas about right and wrong that shape how a person acts
scope: A person's way of thinking and feeling about things; not the position of a plane or spacecraft
  in the air or in space.
examples:
- Her attitude toward school changed after she made new friends.
- He had the attitude that work was fun, so he smiled all day.
