simpleMeaning: a narrow band worn around the head, or a narrow strip of ribbon worn around the head
scope: 'Also called a taenia or a tenia: a narrow band worn on the head, not a boneless piece of meat
  or fish and not a metal strip for joining steel.'
examples:
- She wore a gold fillet around her head.
- The dancer tied a white fillet in her hair before going on stage.
