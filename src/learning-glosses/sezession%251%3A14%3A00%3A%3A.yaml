simpleMeaning: an Austrian school of art and building design like the French art nouveau of the 1890s
scope: An Austrian school of art and building design of the 1890s, also called secession; not the French
  art nouveau itself and not a breakaway political group.
examples:
- The Sezession artists broke away from the old schools in Vienna.
- A Sezession building stands on the Ringstrasse.
