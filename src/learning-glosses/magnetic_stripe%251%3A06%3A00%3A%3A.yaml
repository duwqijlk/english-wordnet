simpleMeaning: A short band fixed to a credit or debit card, holding facts that tell a reading machine
  who you are, what your account number is, and more.
scope: A short band on a credit or debit card that holds facts for a reading machine; not a printed signature
  strip and not the card itself.
examples:
- The magnetic stripe on her card was worn and would not read.
- He swiped the magnetic stripe through the reader.
