simpleMeaning: Cruel and fierce, able or ready to cause pain or suffering.
scope: Literary and now rare outside fixed phrases, above all one fell swoop. It is not the past tense
  of fall, which is spelled the same.
examples:
- In one fell swoop the whole plan was destroyed.
- The wolf of the old tales was a fell and hungry beast.
