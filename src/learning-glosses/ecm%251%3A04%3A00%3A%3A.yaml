simpleMeaning: War fighting that blocks or weakens an enemy's effective use of the unseen waves that carry
  radio, radar and other signals
scope: War fighting that blocks or weakens an enemy's effective use of unseen signal waves; electronic
  countermeasures is another name for this sense, not shooting and not spying by listening in.
examples:
- ECM jammed the enemy's radar.
- The planes used ECM to hide from radar.
