simpleMeaning: having a kind nature that a person is born with, or coming from such a nature
scope: This sense is about a kind nature that a person is born with, or what comes from that nature; it
  is not about one kind act done once, and not about being polite for a short time.
examples:
- Our kindhearted teacher always finds time to help a child who is sad.
- He gave the old man his seat, a kindhearted thing to do.
