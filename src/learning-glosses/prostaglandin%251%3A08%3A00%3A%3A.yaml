simpleMeaning: A powerful chemical in body tissues, especially semen, that acts like a hormone; produced
  by injury, it can affect blood pressure, metabolism and smooth muscle activity (muscle in organ walls).
scope: A chemical found in body tissues that acts like a hormone but is not one.
examples:
- Prostaglandins are made after injury and can affect blood pressure and metabolism.
- Prostaglandins are found in many body tissues, especially in semen.
