simpleMeaning: a tall grass-like plant that grows by the Nile and gives fibres that people used for many
  things in past times
scope: This is the tall plant itself, also called paper plant and paper rush, not the paper made from
  it and not a piece of writing on that paper.
examples:
- Papyrus grows tall along the banks of the Nile.
- People in old times cut papyrus to get fibres for making things.
