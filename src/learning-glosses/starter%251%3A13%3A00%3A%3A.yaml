simpleMeaning: A dish or drink that stirs your hunger, usually served first
scope: A first dish or drink that stirs hunger, not the live mix that starts souring, not the tool, and
  not the motor that starts an engine.
examples:
- Soup was the starter before the main course.
- They ordered a starter of olives and bread.
