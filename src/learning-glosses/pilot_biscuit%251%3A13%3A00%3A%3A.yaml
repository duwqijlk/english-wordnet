simpleMeaning: A very hard kind of bread with no salt in it, once the main food kept on ships.
scope: This is a very hard bread with no salt in it, once the main food kept on ships; hardtack and pilot
  bread are other names for this sense, not soft fresh bread and not a sweet cake.
examples:
- Sailors ate pilot biscuits on long trips.
- A pilot biscuit is so hard it must be soaked first.
