simpleMeaning: A swelling of the gut that brings bloody loose stools and bad pain in the belly.
scope: A gut illness with bloody loose stools and bad belly pain, not a mild stomach upset and not food
  poisoning.
examples:
- The doctor said the necrotizing enteritis caused the bloody diarrhea.
- After the necrotizing enteritis set in, she had severe pain in her belly.
