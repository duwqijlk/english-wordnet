simpleMeaning: 'used of cloth: thin, with threads woven not close together'
scope: This word is used only for cloth that is thin and loosely woven, not for a person or place that
  seems dirty, low, or not honest.
examples:
- She disliked the sleazy cloth; she could almost see through it.
- The shirt was made of sleazy material with threads far apart.
