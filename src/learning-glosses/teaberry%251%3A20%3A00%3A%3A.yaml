simpleMeaning: A low, spreading shrub of eastern North America. It has white bell-shaped flowers, shiny
  fragrant leaves, and a spicy red fruit, and is the source of a fragrant oil.
scope: Another name for the low eastern North American wintergreen shrub, not the spicy red fruit it bears,
  which is a separate sense, and not the unrelated scarlet-flowered shrub sometimes placed in genus Styphelia.
  Checkerberry, creeping wintergreen and ground-berry are other names for the same plant.
examples:
- Teaberry spread across the shaded slope, its leaves dark and glossy.
- We found teaberry growing in a fragrant mat near the stream.
