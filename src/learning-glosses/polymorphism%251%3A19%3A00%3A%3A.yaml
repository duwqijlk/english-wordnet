simpleMeaning: In biology, two or more shapes of the same kind of animal, apart from the shapes that differ
  between males and females
scope: In biology, two or more shapes of the same kind of animal, apart from sex differences; not different
  crystal forms of one chemical stuff and not the genetic variety within a group.
examples:
- Polymorphism means one kind of animal can come in two or more shapes.
- The biologist studied polymorphism in a group of snails.
