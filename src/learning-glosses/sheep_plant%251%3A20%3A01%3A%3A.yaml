simpleMeaning: Leaves covered in grey-white woolly hairs mark a herb that lives for years and spreads
  flat like a mat.
scope: Also called vegetable sheep, it is a herb with grey-white woolly leaves that spreads flat like
  a mat, not the New Zealand kind with tawny hairs.
examples:
- The sheep plant spread flat like a mat.
- The sheep plant came back year after year, flat on the ground.
