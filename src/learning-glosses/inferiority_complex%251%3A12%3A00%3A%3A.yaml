simpleMeaning: A feeling of being less good than others, coming from wanting to be noticed and fearing
  shame.
scope: A feeling of being less good than others, from wanting to be noticed and fearing shame; not a feeling
  of being better than others and not simple shyness.
examples:
- His inferiority complex made him avoid speaking up.
- An inferiority complex can grow from fear of shame.
