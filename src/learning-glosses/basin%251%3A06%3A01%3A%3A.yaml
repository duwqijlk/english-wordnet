simpleMeaning: a sink fixed in a bathroom, joined to pipes that bring water in and take it away, for washing
  your hands and face
scope: This sense is the fixed sink in a bathroom for washing your hands and face; it is not the land
  around a river and not a loose bowl.
examples:
- He washed his face in the bathroom basin.
- She filled the basin with warm water from the tap.
