simpleMeaning: The state of having tubes that carry blood through a part of the body.
scope: The state of having blood tubes in a part of the body, not the act of giving a part blood tubes
  and not the blood itself.
examples:
- The scan showed a prominent vascularity in the organ.
- Vascularity of the skin can be seen in the red lines.
