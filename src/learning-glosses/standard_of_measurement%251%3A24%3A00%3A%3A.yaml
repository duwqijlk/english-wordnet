simpleMeaning: an accepted sample that shows a size or quality, used to judge, measure or weigh other
  things against
scope: 'Also called a gauge: an accepted sample used to judge a size or quality, not a guess and not a
  measuring tool.'
examples:
- The metre is a standard of measurement for length.
- A good standard of measurement lets people compare results fairly.
