simpleMeaning: Neither showing love between lovers nor waking such feelings in another person.
scope: Of a person, act, or place that shows no love and stirs none in others.
examples:
- The unromantic letter listed facts and dates, with no word of love.
- Their marriage was unromantic, more a business deal than a love match.
