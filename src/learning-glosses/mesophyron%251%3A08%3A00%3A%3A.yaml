simpleMeaning: the smooth raised part of the forehead bone between and above the eyebrows, the forehead's
  furthest point in the middle, level with the ridges above the eyes
scope: The smooth raised part of the forehead bone between and above the eyebrows, also called glabella;
  not the bridge of the nose and not the whole forehead.
examples:
- The mesophyron is the smooth raised spot between the eyebrows.
- On the skull, the mesophyron marks the most forward point of the forehead.
