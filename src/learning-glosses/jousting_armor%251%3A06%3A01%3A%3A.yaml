simpleMeaning: Heavy metal plate clothing for riding contests, not made for free fighting, from the late
  1400s to the 1500s.
scope: Heavy plate clothing for riding contests, not for free fighting; jousting armour is another name
  for it, not light clothing for battle on foot.
examples:
- The jousting armor gleamed in the morning light.
- He could barely walk in the heavy jousting armor.
