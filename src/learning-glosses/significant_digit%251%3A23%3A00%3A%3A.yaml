simpleMeaning: Any figure of a number known for sure, from the first non-nought figure to the last non-nought
  figure, or a nought held to be the true worth.
scope: This sense is also called significant figure.
examples:
- A significant digit is known for sure.
- Significant digits start with the first non-nought figure.
