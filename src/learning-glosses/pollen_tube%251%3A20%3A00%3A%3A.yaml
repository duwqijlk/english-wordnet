simpleMeaning: In botany, a pollen grain on the stigma, the flower's receptive tip, sends a thin tube
  down the flower's neck to bring male cells to the egg.
scope: This is the tube a pollen grain grows to reach the egg, not the grain itself or the stigma it lands
  on.
examples:
- Under the microscope, a pollen tube could be seen emerging from each grain.
- The pollen tube grew down the flower's neck within hours of pollination.
