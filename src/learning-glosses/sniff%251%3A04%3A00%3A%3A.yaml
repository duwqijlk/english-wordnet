simpleMeaning: the act of noticing a smell by breathing in through the nose
scope: This names the act of noticing a smell by breathing in through the nose; it is not the verb uses
  for breathing in with a sound or for noticing a smell.
examples:
- One sniff told her the milk had gone bad.
- He took a quick sniff of the flowers to check their smell.
