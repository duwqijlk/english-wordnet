simpleMeaning: Any of several fine-looking shrubs that stay green all year, from the far west coast and
  northern Mexico, with soft leaves with rounded parts and bright yellow flowers.
scope: Any of several fine-looking shrubs that stay green all year, from the far west coast and northern
  Mexico; flannel bush and flannelbush are other names for this sense.
examples:
- The California beauty in our garden has bright yellow flowers.
- A California beauty stays green all year.
