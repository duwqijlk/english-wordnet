simpleMeaning: Trailing the great marching swarms, one of many kinds of dull South American animal eats
  the small insects it finds there.
scope: Also called ant bird, this is one of many dull South American birds that trail marching swarms
  for insects.
examples:
- The antbird trailed the swarm and snapped up insects along the way.
- Antbirds live in South America and feed on the insects of the marching swarms.
