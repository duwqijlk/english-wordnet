simpleMeaning: calling up powers beyond the natural world that people only believe in, by using magic
  words and chants
scope: 'Also called summoning: calling up powers people only believe in, not making something again in
  the mind, and not something that brings out a kind of behaviour.'
examples:
- The story tells of an evocation to call up spirits in the night.
- They tried an evocation with old magic words and chants.
