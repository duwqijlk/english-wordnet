simpleMeaning: slow to say facts or views plainly and directly, for example from fear or from saying what
  one does not think
scope: A way of speaking that holds back plain facts from fear or falseness; mealymouthed is another name
  for this sense, not plain and direct speech.
examples:
- The mealy-mouthed spokesman would not say plainly whether the plan had failed.
- Voters grew tired of mealy-mouthed answers that hid what the party really thought.
