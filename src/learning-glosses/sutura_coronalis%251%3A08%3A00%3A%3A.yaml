simpleMeaning: the join between the bone at the front of the skull and the bone at the top of the skull
scope: This is the join between the front and top bones of the skull, also called coronal suture; not
  a join between other bones of the skull and not a break in the skull.
examples:
- The sutura coronalis runs across the top of the skull.
- Doctors could see the sutura coronalis on the scan of the skull.
