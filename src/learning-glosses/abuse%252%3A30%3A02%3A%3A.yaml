simpleMeaning: To use something wrongly, or to use far more of it than is proper.
scope: Misusing a substance or thing, not treating a person badly and not speaking to someone with insulting
  words.
examples:
- He abused alcohol for years before seeking help.
- The report says the company abused its power over suppliers.
