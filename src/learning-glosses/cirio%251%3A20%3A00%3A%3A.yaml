simpleMeaning: A plant of Mexico and south-western California whose tall stems stand like pillars and
  whose creamy yellow flowers have a honey scent.
scope: Another name for boojum tree, the tall column-stemmed candlewood; not a cactus.
examples:
- A cirio stood alone on the hillside, its stem like a pillar.
- The cirio's pale yellow flowers drew bees with their honey scent.
