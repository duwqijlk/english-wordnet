simpleMeaning: This thing grows on land, between dry-land kinds and water kinds, where the water is neither
  too much nor too little
scope: A land plant with an average water supply, also called a mesophyte; not a dry-land plant and not
  a water plant.
examples:
- The mesophytic plant grew well in the garden's rich, damp soil.
- Mesophytic plants need steady rain but not standing water.
