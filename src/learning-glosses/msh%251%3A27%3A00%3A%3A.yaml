simpleMeaning: A body chemical made by the front part of the pituitary gland, which sets how much colour
  the skin-colour cells make.
scope: This is the hormone from the front of the pituitary gland that sets skin colour, also called melanocyte-stimulating
  hormone, not a hormone from another gland.
examples:
- MSH controls how much colour the skin cells make.
- The pituitary gland released MSH after the sun exposure.
