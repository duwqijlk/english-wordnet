simpleMeaning: Taking on the dress, ways, or sexual role of the other sex as a regular way of life
scope: Taking on the dress, ways or sexual role of the other sex; cross dressing and transvestism are
  other names for this sense. Not a change of sex and not a costume for a stage show.
examples:
- His transvestitism meant he wore women's clothes in his daily life.
- The book talks about transvestitism as a way of living, not a disguise.
