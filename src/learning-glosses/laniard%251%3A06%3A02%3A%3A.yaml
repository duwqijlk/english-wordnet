simpleMeaning: A cord with a hook on it is pulled to fire some kinds of big gun
scope: A cord with a hook, pulled to fire some kinds of big gun, also called lanyard; not a cord for ships'
  ropes and not a cord worn round the neck.
examples:
- The gunner pulled the laniard to fire the cannon.
- A laniard with a hook hung beside the cannon.
