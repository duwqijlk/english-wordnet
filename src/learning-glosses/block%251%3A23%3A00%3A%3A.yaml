simpleMeaning: In computing, the smallest allowed amount of data, made up of one or more sections of a
  disk called sectors.
scope: A unit of data in computing, one or more sectors treated as the smallest permitted amount; not
  a solid piece of material, not a quantity of things handled as one, not an obstruction in a pipe or
  tube, not a memory lapse, not a ban on assets, and not interference with signals.
examples:
- The file is saved in a single block on the disk.
- The program reads the data one block at a time.
