simpleMeaning: a ruler or chief who governs a land on his own, most often in Africa or Arabia
scope: A ruler or chief who governs a land on his own; ameer, emir and emeer are other names for this
  sense, not a king of a large state and not a governor who answers to a higher ruler.
examples:
- The amir ruled the small desert state for thirty years.
- The traveller was brought before the amir of the town.
