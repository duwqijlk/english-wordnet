simpleMeaning: a real thing that a word or phrase points to
scope: This is the real thing a word points to; not the word itself and not the plain sense of the word.
examples:
- The denotatum of 'the moon' is the moon itself.
- For the phrase 'my dog', the denotatum is the dog in the yard.
