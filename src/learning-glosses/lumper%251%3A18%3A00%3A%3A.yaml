simpleMeaning: By their main features, a person who studies living things sorts them into big groups
scope: A person who groups living things by their main features, not a dock worker who loads and unloads
  ships in a port.
examples:
- The lumper grouped the new orchids with the older ones by their main features.
- As a lumper, she put the two frog species in one large group.
