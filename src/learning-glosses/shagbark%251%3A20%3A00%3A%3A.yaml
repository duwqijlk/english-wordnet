simpleMeaning: Nuts that can be eaten grow on a North American hickory with loose grey peel that hangs
  in long strips.
scope: Also called shagbark hickory, shellbark and shellbark hickory, it is the tree with loose hanging
  peel, not a smooth-barked nut tree.
examples:
- The shagbark gave nuts we could eat.
- Loose grey peel hung in long strips from the shagbark.
