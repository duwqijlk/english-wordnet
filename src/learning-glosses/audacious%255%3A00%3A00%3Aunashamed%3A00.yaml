simpleMeaning: Holding back nothing, even when good manners or the rules say to stop
scope: Insolent and brazen are other names for this sense; this is about shameless boldness, not about
  being willing to take a brave risk.
examples:
- It was an audacious trick to pull in front of the whole class.
- His audacious lies fooled no one.
