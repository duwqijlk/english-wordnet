simpleMeaning: a shrub of salt marshes in eastern and south-central North America and the West Indies,
  with fruit wrapped in white feathery hairy tufts
scope: Also called consumption weed, cotton-seed tree, and groundsel tree; a shrub of salt marshes, not
  a garden shrub of dry land.
examples:
- Groundsel bush grows thick along the salt marsh.
- The groundsel bush bore fruit wrapped in white tufts.
