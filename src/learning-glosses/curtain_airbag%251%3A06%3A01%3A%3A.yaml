simpleMeaning: A safety device in cars that blows up fast to shield the head and guard against the car
  turning over.
scope: A safety device in cars that shields the head, not a seat belt and not a front airbag.
examples:
- The curtain airbag opened when the car rolled over.
- Curtain airbags protect passengers in a side crash.
