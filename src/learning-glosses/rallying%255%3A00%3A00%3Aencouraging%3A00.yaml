simpleMeaning: bringing people back together as one and making them try again with new effort
scope: This describes something that brings people together and makes them try again; not the act itself
  of gathering strength for a new effort.
examples:
- The leader gave a rallying speech that brought the tired team together.
- It was a rallying cry, and the workers felt ready to try again.
