simpleMeaning: With feelings upset more than anything else, this trouble of the mind has no clear bodily
  cause in the brain that can be found
scope: Also called affective disorder, emotional disturbance, and major affective disorder, this trouble
  of the mind is one where feelings are disturbed above all, with no clear bodily cause in the brain.
examples:
- His emotional disorder left him unable to keep his feelings steady.
- No bodily fault in the brain could be found to explain her emotional disorder.
