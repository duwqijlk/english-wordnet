simpleMeaning: a deal that lets you buy or sell shares, stock index, or a future in goods at a fixed price
  by a fixed date, with equal buy and sell options
scope: A stock-market deal to buy or sell at a fixed price, not a gymnastic move and not the act of sitting
  with your legs on either side of something.
examples:
- She bought a straddle on the company's shares before the results came out.
- The straddle gave him the right to buy or sell at the agreed price.
