simpleMeaning: A weight used in parts of Asia, about the same as 133 pounds, or as much as a grown man
  can carry.
scope: This is a weight used in parts of Asia, about 133 pounds; not a weight used all over the world,
  and not a weight for small things.
examples:
- The load weighed two piculs.
- A picul is about as much as a man can carry.
