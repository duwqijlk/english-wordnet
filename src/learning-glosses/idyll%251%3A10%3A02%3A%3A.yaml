simpleMeaning: a piece of music that makes you think of life in the country
scope: 'Also called pastoral: a piece of music about country life, not a short poem with the same name
  and not a charming scene from real life.'
examples:
- The orchestra played an idyll inspired by the countryside.
- His idyll for piano evokes birdsong and open fields.
