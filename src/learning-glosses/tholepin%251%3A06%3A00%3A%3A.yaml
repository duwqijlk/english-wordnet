senseId: 'tholepin%1:06:00::'
synsetId: 03911849-n
simpleMeaning: A holder fixed to the gunwale of a boat that holds the oar in place and acts as a fulcrum
  for rowing.
scope: Pin, peg, oarlock, rowlock and thole are other names for this small post on the top edge of a boat.
examples:
- The tholepin held the oar while he rowed across the lake.
- A loose tholepin let the oar slip as she pulled.
