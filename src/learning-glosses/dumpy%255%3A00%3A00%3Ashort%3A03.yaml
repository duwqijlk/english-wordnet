simpleMeaning: short and thick, for example with short legs and heavy muscles
scope: 'Also called squat, chunky, stumpy and squatty: short and thick in body. It is not the sense that
  means like a dirty place for rubbish.'
examples:
- The dumpy little dog ran fast on its short legs.
- She was a dumpy woman, short and thick in build.
