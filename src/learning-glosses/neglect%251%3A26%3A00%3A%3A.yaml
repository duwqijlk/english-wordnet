senseId: 'neglect%1:26:00::'
synsetId: 14446832-n
simpleMeaning: The condition a thing gets into when no one uses it or looks after it
scope: This is the state a thing is in when no one uses it or looks after it, not a person's habit of
  not caring about duties, and not a failure to act with care.
examples:
- The old house fell into neglect after its owners moved away.
- Years of neglect left the garden full of weeds and broken fences.
