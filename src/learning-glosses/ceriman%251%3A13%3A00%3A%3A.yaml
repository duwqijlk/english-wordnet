simpleMeaning: Tasting of pineapple and banana, this tropical fruit is long and round like the cone of
  a pine tree.
scope: Also called monstera, a tropical fruit long and round like the cone of a pine tree; not the vine
  that bears it, and not a true pineapple.
examples:
- The ceriman tastes of pineapple and banana.
- A ceriman is long and round like the cone of a pine tree.
