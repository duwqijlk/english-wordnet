simpleMeaning: to do with a medical way of checking or treating the body that goes inside the body through
  a cut or a small hole made in the skin
scope: This is the medical sense, about going inside the body through a cut or a hole; not about a disease
  spreading into healthy parts, not about entering without a right, and not about an attack.
examples:
- The doctor used an invasive test that put a thin tube inside the body.
- Invasive surgery needs a cut in the skin, so the patient needs time to heal.
