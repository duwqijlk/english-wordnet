simpleMeaning: a sick or disabled child whose picture is used on posters to ask people to give money for
  a good cause
scope: This is a sick or disabled child whose picture is used on posters to raise money for a good cause,
  not any child in a picture and not a person who gives money.
examples:
- The poster child on the charity poster was a young girl who needed help walking.
- People gave money after they saw the poster child smiling from the poster on the hospital wall.
