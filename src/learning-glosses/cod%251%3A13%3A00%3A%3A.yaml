simpleMeaning: white meat with little fat from a North Atlantic fish that is an important food, usually
  cooked in an oven or in hot water
scope: The meat you eat, not the live fish itself and not the case that holds a plant's seeds.
examples:
- We had cod for dinner, baked in the oven.
- She cooked the cod slowly in hot water.
