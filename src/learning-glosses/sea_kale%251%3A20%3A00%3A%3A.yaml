simpleMeaning: A perennial of shore sands and shingle, north Europe, Baltic Sea, Black Sea, with racemes
  of small white flowers and large fleshy blue-green leaves, often cooked as potherbs.
scope: This sense is also called sea cole, for a perennial of shore sands and shingle, north Europe, Baltic
  Sea, Black Sea.
examples:
- Sea kales grow on shore sands.
- Sea kale leaves cook as potherbs.
