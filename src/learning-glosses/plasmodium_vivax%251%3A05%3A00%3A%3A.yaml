simpleMeaning: A tiny one-celled living thing, of the kind that shares its name, that lives in people
  as a pest and brings on malaria.
scope: A tiny one-celled living thing that brings on malaria in people, also called a malaria parasite
  and also called plasmodium, not a germ that lives in animals only.
examples:
- Plasmodium vivax is carried by mosquitoes to people.
- A bite can pass Plasmodium vivax into the blood.
