simpleMeaning: A white liquid squeezed from the fresh white flesh inside a big tropical nut.
scope: This is a white liquid squeezed from the fresh white flesh inside a big tropical nut; coconut milk
  is another name for it, not the clear water inside the nut and not cream from milk.
examples:
- She stirred coconut cream into the curry.
- Coconut cream thickened the sauce.
