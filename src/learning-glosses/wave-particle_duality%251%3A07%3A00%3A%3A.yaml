simpleMeaning: In physics, the way bits of matter and rays at times spread out and at times act as small
  hard bits, each way best explaining some of what they do.
scope: Also called duality, this name covers the either-way behaviour of bits of matter and rays.
examples:
- Wave-particle duality shows that light can act both as a spread-out wave and as small hard bits.
- In wave-particle duality, an electron at times spreads out and at times acts as a small hard bit.
