simpleMeaning: to cover a thing completely on all sides, or to close round it as a cover would
scope: 'Also called wrap, envelop and enclose: to cover a thing all round, not just to put one thing inside
  another or to hold it loosely.'
examples:
- Fog enfolded the small house all through the night.
- She enfolded the baby in a warm blanket.
