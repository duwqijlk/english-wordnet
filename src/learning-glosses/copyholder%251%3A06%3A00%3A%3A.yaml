simpleMeaning: a machine used in printing that holds the text to be set in place for the worker who sets
  the type
scope: A machine that holds text in place for the worker who sets the type; not a stand for books, and
  not the worker who sets the type.
examples:
- The copyholder held the pages steady while the compositor worked.
- He fixed the manuscript in the copyholder before he began to set the type.
