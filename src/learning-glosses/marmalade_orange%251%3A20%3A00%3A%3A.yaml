simpleMeaning: any of several common trees that bear sour or bitter fruit, used as the base on which other
  trees are joined
scope: Any of several common trees bearing sour or bitter fruit; bigarade, bitter orange, bitter orange
  tree and sour orange are other names for this sense, not a sweet-fruit tree and not a tree grown only
  for shade.
examples:
- The marmalade orange in the grove bears bitter fruit.
- Gardeners use a marmalade orange as grafting stock.
