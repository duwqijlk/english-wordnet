simpleMeaning: A sickness of the eye in which the coloured ring blocks the flow of the clear liquid inside
  it.
scope: Also called angle-closure glaucoma and closed-angle glaucoma, this is the eye sickness in which
  the coloured ring stops the clear liquid inside the eye from flowing away.
examples:
- The doctor found acute glaucoma when the coloured ring blocked the flow of liquid in the eye.
- With acute glaucoma, pressure can build up fast and harm sight in a couple of days.
