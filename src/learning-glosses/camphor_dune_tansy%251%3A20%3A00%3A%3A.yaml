simpleMeaning: A thickly hairy plant with flowers that have no rays, found round San Francisco Bay.
scope: A hairy plant of the San Francisco Bay shore, not a garden tansy and not a dune grass.
examples:
- Camphor dune tansy grows on the sandy shore near the bay.
- The camphor dune tansy has thick hairs on its leaves.
