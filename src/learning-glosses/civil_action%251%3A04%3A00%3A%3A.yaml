simpleMeaning: a case in court to guard a person's private right or to make a court order a fix, not a
  case to punish a crime
scope: A case in court to guard a person's private right or to make a court order a fix, not a case to
  punish a crime; not a criminal trial and not a private deal made out of court.
examples:
- She filed a civil action to get her money back.
- The civil action asked the court to stop the firm from using her name.
