simpleMeaning: an abstract idea, such as a quality that a thing or person has, by which it can be told
  apart from others
scope: This is the abstract feature used to tell one thing from another, not land or buildings that someone
  owns, and not the things someone possesses.
examples:
- In the model, colour and weight are treated as separate properties of each object.
- The database lets you sort records by any property you choose, such as size or date.
