simpleMeaning: a person or group that makes the air, water, or land around us dirty and not safe
scope: This is a person or group that makes air, water, or land dirty. It is not the dirty matter itself,
  and not the act of making it dirty.
examples:
- The factory was named as a big polluter of the river.
- A polluter must pay to clean up the lake it has harmed.
