simpleMeaning: A European weed with white flowers that now grows wild in North America.
scope: This is a European weed with white flowers that now grows wild in North America; corn mayweed and
  field chamomile are other names for this sense, not a weed with yellow flowers and not a garden flower
  grown for show.
examples:
- Corn chamomile dotted the field with white flowers.
- Corn chamomile grows wild along the road in North America.
