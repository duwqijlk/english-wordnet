simpleMeaning: a state that comes from things going wrong for someone
scope: 'Also called misfortune and ill luck: a state that comes from things going wrong, not a single
  piece of trouble no one saw coming and not a choice a person made.'
examples:
- His business failed, his car broke down, and his bad luck seemed to go on and on.
- She felt her bad luck would never end.
