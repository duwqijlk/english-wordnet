simpleMeaning: a machine that finds the weight of charged bits of matter by bending their path through
  a thin slit and measuring the flow of charge with a meter
scope: 'Also called spectrometer: it sorts charged bits of matter by weight, not a tool that only shows
  a spectrum of light.'
examples:
- The lab used a mass spectrometer to find the weight of the charged bits.
- A mass spectrometer bends the path of ions through a thin slit.
