simpleMeaning: about the gear in the transmission (the part of a vehicle that sends power from the motor
  to the wheels) that makes the vehicle move back
scope: This is about the gear that makes a car go back, not the gears themselves and not the back side
  of a coin.
examples:
- Put the car in reverse gear to back into the space.
- He used reverse gear to move the car back out of the garage.
