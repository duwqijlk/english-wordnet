simpleMeaning: In the Christian faith, a feast marking Christ's rise into heaven, kept on the fortieth
  day after Easter.
scope: In the Christian faith, a feast marking Christ's rise into heaven, also called Ascension Day and
  Ascension of the Lord; not Easter and not Christmas.
examples:
- Ascension falls forty days after Easter.
- They sang at Ascension.
