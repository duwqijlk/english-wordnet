simpleMeaning: a frame that stands round a baby, on small wheels, to help the baby learn to walk
scope: A frame that stands round a baby, on small wheels, to help the baby learn to walk; walker and baby-walker
  are other names for this sense, not a pram and not a high chair.
examples:
- The baby pushed her go-cart across the room.
- He put the baby in the go-cart to practise walking.
