simpleMeaning: A royal house of England that ruled from thirteen ninety-nine to fourteen sixty-one, with
  a red rose as its mark.
scope: Also called House of Lancaster and Lancastrian line, this is the English royal house that ruled
  from thirteen ninety-nine to fourteen sixty-one, not the city of the same name.
examples:
- Lancaster ruled England after thirteen ninety-nine.
- The red rose was the mark of Lancaster.
