simpleMeaning: to be angry in a quiet way, saying nothing and looking unhappy and cross
scope: This is being angry in a quiet way and saying nothing; stew and grizzle are other names for this
  sense. Not showing your anger openly, and not a dark threat hanging over a place or person.
examples:
- After the argument, he brooded in silence all evening.
- She sat brooding by the window and would not speak to anyone.
