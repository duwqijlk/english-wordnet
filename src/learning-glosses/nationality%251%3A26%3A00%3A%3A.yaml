simpleMeaning: the fact of being a member of one country, either by being born there or by being made
  a member by law
scope: The legal fact of belonging to one country, not the people of a shared birth and custom who make
  up a nation.
examples:
- His nationality is French, though he lives in Canada.
- The form asks for your nationality and your date of birth.
