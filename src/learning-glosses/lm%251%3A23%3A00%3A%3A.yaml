simpleMeaning: a unit of light flow, equal to light sent through one corner of space by a point one candela
  strong, a unit of light strength, shining alike in all ways
scope: 'Also called lumen: a unit for how much light flows out, not a unit for how strong one small point
  of light is and not a unit for how far light can reach.'
examples:
- This bulb gives out 800 lm of light.
- The lamp is rated at 1,200 lm.
