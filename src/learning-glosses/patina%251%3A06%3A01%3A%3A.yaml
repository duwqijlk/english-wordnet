simpleMeaning: a soft shine on wooden furniture that comes with age, with polishing, and with being touched
  and used over time
scope: The shine on old wooden furniture, not the thin layer that forms on metal over a long time.
examples:
- The old table has a rich patina from years of use.
- Years of care gave the wooden chair a warm patina.
