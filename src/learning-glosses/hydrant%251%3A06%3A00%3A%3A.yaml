senseId: 'hydrant%1:06:00::'
synsetId: 03556096-n
simpleMeaning: a pipe with a tap and a spout, from which water can be taken from the main water pipes
  of a town
scope: This is a pipe with a tap and a spout, joined to the main water pipes of a town. It is not a tap
  for taking water from a pipe or a barrel.
examples:
- Firefighters joined their hose to the hydrant on the street and took water to fight the fire.
- A man was filling bottles with water from the hydrant outside the school.
