scope: A building block of DNA made from guanine, a sugar missing one oxygen, and a phosphate group, also
  called deoxyguanosine monophosphate and deoxyguanylate; not the guanine base on its own and not the
  whole DNA chain.
examples:
- Deoxyguanylic acid is one of the building blocks of DNA.
- The cell joined deoxyguanylic acid into the new chain.
