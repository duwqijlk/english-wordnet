simpleMeaning: able to be taken off an amount, especially an amount used to work out tax
scope: This word describes a cost that can be taken off, especially for tax. It is not the rule in a plan
  for loss or damage, and not the amount itself that is taken off for tax.
examples:
- These work costs are deductible, so you can take them off the amount you pay tax on.
- Is the money you give to help others deductible when you work out your tax?
