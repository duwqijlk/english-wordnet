simpleMeaning: Bony plates run in a row down the back of this plant-eating, bird-hipped dinosaur, whose
  spiked tail most likely served as a weapon.
scope: Also called stegosaur; a plant-eating dinosaur with plates on its back, not a meat-eating one.
examples:
- The stegosaurus on the poster shows a row of plates down its back.
- A stegosaurus could swing its spiked tail like a weapon.
