simpleMeaning: The clock setting of the seventh zone west of Greenwich, fixed by the 105th line of longitude
  west, used in the mountain states of the United States.
scope: 'Also called Mountain Standard Time and Mountain Time: the clock setting for the seventh zone west
  of Greenwich, fixed by the 105th line of longitude west and used in the mountain states of the United
  States, seven hours behind Greenwich time.'
examples:
- MST is seven hours behind Greenwich.
- In Denver they keep MST in winter.
