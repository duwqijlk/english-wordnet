simpleMeaning: the hollow muscle in the chest, behind the breastbone and between the lungs, that beats
  and pumps blood around the body.
scope: It is not the center of a person's feelings, and it is not the middle part of something.
examples:
- His heart was beating fast after the run.
- The doctor listened to her heart.
