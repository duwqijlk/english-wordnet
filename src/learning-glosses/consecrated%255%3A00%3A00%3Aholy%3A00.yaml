simpleMeaning: made holy, said to be holy, or thought to be holy, and kept for a god or for religious
  use or a religious ceremony
scope: 'Also called sacred and sanctified: holy and kept for a god or for religious use, not just set
  apart for a high purpose.'
examples:
- They prayed in the consecrated church.
- The consecrated bread and wine were used in the ceremony.
