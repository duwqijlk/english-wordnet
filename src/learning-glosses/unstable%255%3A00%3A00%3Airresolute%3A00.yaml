simpleMeaning: likely to change in mood or belief, so feelings and views do not stay the same
scope: A person whose feelings and beliefs keep shifting, not a mind that is badly ill and not a wobbly
  thing that will not stand firm.
examples:
- His unstable religious convictions changed with every new book he read.
- Her unstable moods made it hard to know what she would want next.
