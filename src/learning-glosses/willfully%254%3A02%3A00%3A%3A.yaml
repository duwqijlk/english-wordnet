schema: oewn-learning-gloss-v2
senseId: 'willfully%4:02:00::'
synsetId: 00498325-r
simpleMeaning: in a way that shows the person means to do it, does it on purpose, and will not be stopped
  or changed
scope: Done on purpose by a person who will not change course; not done by chance or by mistake, and not
  the same as doing something gladly.
examples:
- She willfully refused to follow the safety rules, though she knew them well.
- He willfully kept the letter from his brother for three whole days.
