simpleMeaning: The beauty of its flower heads, with fine long soft hairs, is why farmers grow this grain
  in North America and the northeast of Asia.
scope: A grain grown for its fine-haired flower heads; foxtail barley and squirreltail grass are other
  names for it, not a grain grown for food.
examples:
- Farmers grow squirreltail barley for the beauty of its flower heads.
- The squirreltail barley has fine long soft hairs on its flower heads.
