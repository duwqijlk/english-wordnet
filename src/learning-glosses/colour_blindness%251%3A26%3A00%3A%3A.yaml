simpleMeaning: A condition passed down in the family that makes it hard to tell one shade from another
scope: A condition passed down in the family that makes shades hard to tell apart; color blindness, color
  vision deficiency and colour vision deficiency are other names for this sense, not poor sight in general
  and not a lack of sight.
examples:
- His colour blindness means he cannot tell red from green.
- Colour blindness runs in her family.
