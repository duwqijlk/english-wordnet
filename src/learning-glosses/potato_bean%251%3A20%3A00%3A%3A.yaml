simpleMeaning: A key food of the first peoples of the land, this climbing plant of North America has sweet-smelling
  flowers and underground parts you can eat.
scope: Also called groundnut, groundnut vine, and wild bean, this North American climbing plant is a food
  crop with underground parts people eat.
