simpleMeaning: to put short nails with thick heads on the bottom of boots, to keep the bottom from wearing
  out
scope: 'This is the verb sense: putting short nails with thick heads on boots; it is not the noun sense,
  which is one of these nails itself.'
examples:
- Workers hobnailed the boots before the soldiers wore them.
- He hobnails heavy boots so they last longer on hard roads.
