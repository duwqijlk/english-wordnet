simpleMeaning: With an edge that waves strongly back and forth, curving in and out in turn
scope: An edge that waves strongly in and out in turn, not a smooth straight edge and not one with sharp
  teeth.
examples:
- The sinuate leaf edge curved in and out like a wave.
- Botanists call the margin sinuate when it dips in and bulges out in turn.
