simpleMeaning: A fatty build-up inside the wall of a blood tube; a sign of a disease that hardens the
  blood tubes (atherosclerosis)
scope: A fatty build-up inside the wall of a blood tube; not a blood clot and not a hardening of the whole
  tube.
examples:
- The arterial plaque built up inside the wall of the blood tube.
- Doctors found arterial plaque inside the wall of the artery during the scan.
