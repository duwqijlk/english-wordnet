simpleMeaning: the joint where the arm bends, between the lower arm and the upper arm, and the same joint
  in the front leg of a four-legged animal
scope: The joint in a person's arm, and in the front leg of a four-legged animal, not the bend in a pipe,
  not the part of a sleeve, and not the act of pushing with this joint.
examples:
- He bent his elbow to lift the cup to his mouth.
- She hurt her elbow when she fell on the hard ground.
