simpleMeaning: A tool that psychologists use to show things to look at for a very short time and then
  take them away.
scope: Tachistoscope is another name for this tool, with which psychologists show things to look at for
  a very short time, not one that leaves them in view.
examples:
- The psychologist flashed a word on the t-scope for a fraction of a second.
- A picture shown on the t-scope was gone in a flash.
