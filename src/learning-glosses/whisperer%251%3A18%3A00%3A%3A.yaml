simpleMeaning: a person who speaks very quietly, so only someone close can hear
scope: This is a person who speaks in a very quiet voice, not a loud speaker and not a person who tells
  news about other people.
examples:
- The whisperer leaned close so the others could not hear.
- As a whisperer, he spoke so softly that I had to listen hard.
