simpleMeaning: 'One of the largest bony fish: open-ocean swimmer with a round, flattened body, tall fins
  along its back and underside, and a rudder-like tail; found in warm seas worldwide.'
scope: This is the giant ocean sunfish, also called mola, headfish or sunfish; not the small freshwater
  sunfish of North America.
examples:
- An ocean sunfish drifted past the dive boat, its pale body catching the light.
- Ocean sunfish are found in warm waters around the world.
