simpleMeaning: a thyroid gland grown too big, which can come from making too much or too little hormone,
  or from too little iodine in food
scope: 'Also called goiter, goitre, and thyromegaly: a thyroid gland grown too big, not a lump of fat
  and not a sore throat.'
examples:
- The doctor found a struma on her neck.
- His struma grew because his diet had too little iodine.
