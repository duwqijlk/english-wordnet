simpleMeaning: A fenced-off space in the middle of a ship's cargo area that keeps the ship's water-moving
  machines safe
scope: A fenced-off space in a ship that keeps its water-moving machines safe, not a hole for water in
  the ground and not the ship's engine room.
examples:
- The pump well kept the cargo from knocking into the pumps.
- The sailor checked the pump well for leaks after the storm.
