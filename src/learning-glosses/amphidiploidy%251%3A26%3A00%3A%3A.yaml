simpleMeaning: the state of being amphidiploid, a plant or animal with two full sets of genes from two
  parent kinds
scope: The state of having two full gene sets from two parent kinds, not one doubled set from a single
  kind and not a single set.
examples:
- Amphidiploidy can arise when two species cross and the sets double.
- The new wheat showed amphidiploidy in its cells.
