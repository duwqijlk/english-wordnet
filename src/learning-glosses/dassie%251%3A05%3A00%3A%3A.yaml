simpleMeaning: Its front teeth are like a small gnawing animal's and its feet have hoof-like toes; it
  is one of several small hoofed animals of Africa and Asia.
scope: Also called das, coney, cony and hyrax; this is one of the small hoofed animals of Africa and Asia,
  not a rat and not a hoofed animal of other lands.
examples:
- The dassie is a small hoofed animal of Africa.
- Dassies have front teeth like a small gnawing animal's.
