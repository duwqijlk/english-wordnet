simpleMeaning: a fault of sight in which things look bent out of shape, most often from a fault in the
  retina (the thin layer at the back of the eye)
scope: A fault of sight in which things look bent out of shape, most often from a fault in the retina;
  not short sight, and not a fault of the lens.
examples:
- With metamorphopsia, straight lines looked bent and wavy to her.
- His metamorphopsia came from a fault in the retina, and door frames looked bent.
