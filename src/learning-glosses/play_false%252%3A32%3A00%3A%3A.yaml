senseId: 'play_false%2:32:00::'
synsetId: 00840873-v
simpleMeaning: To hide what one really wants, above all by putting on a big show of meaning well in order
  to get what one wants
scope: To hide what one really wants, above all by putting on a big show of meaning well; snow, hoodwink,
  bamboozle, lead by the nose and pull the wool over someone's eyes are other names for this sense, and
  this is not a trick played openly for fun.
examples:
- He played false with his professors, pretending to know the subject well.
- She played false, hiding her true aims behind kind words.
