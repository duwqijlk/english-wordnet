simpleMeaning: the money left when all costs for a set time, including wear on equipment and other costs
  not paid in cash, are taken from what a business takes in
scope: 'Also called net, profit, or profits: the money a business keeps after all costs for a set time,
  including costs not paid in cash, are taken from what it takes in.'
examples:
- The company's earnings rose sharply this year.
- Higher earnings let the firm pay a bigger dividend.
