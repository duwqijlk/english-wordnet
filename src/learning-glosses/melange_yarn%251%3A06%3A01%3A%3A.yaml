simpleMeaning: At least two fibres of different kinds or different colours, mixed to make thread
scope: This is thread made by mixing at least two fibres of different kinds or different colours, not
  a single fibre and not thread of one colour.
examples:
- The sweater was knitted from soft melange yarn in shades of grey.
- She chose melange yarn because the mixed colours gave the cloth a soft look.
