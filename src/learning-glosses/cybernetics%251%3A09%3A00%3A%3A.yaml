simpleMeaning: In biology, the study of how messages pass and how things are kept under control, with
  living things and man-made systems set side by side in a marked way.
scope: This is the study of message and control systems in living things and machines, not the study of
  living things in general or the making of computer programs.
examples:
- She studied cybernetics to learn how living things and machines pass messages.
- The cybernetics course looks at control in both animals and robots.
