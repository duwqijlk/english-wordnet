simpleMeaning: to add punctuation symbols, such as commas and periods, to written text
scope: Adding punctuation to text, not the noun for a written symbol and not the general act of leaving
  a visible trace on a surface; punctuate is another name for this sense.
examples:
- The editor marked the manuscript, adding commas and full stops where they were needed.
- She marked the passage with punctuation before the book went to print.
