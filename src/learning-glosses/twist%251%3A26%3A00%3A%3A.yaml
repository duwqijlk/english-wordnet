simpleMeaning: A sharp injury to a muscle or ligament caused by straining it.
scope: This is another name for a pull, meaning a muscle or ligament injury, not the dance, a bend in
  a line, or a swirling current.
examples:
- A bad twist to his knee kept him off the field for weeks.
- She felt a sharp twist in her back when she lifted the box.
