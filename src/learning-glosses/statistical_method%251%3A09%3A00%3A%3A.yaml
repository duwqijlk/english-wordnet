simpleMeaning: A way of studying or showing sets of numbers, or a set of steps for working out a number
  from them
scope: A way of studying or showing sets of numbers, also called a statistical procedure; not a way of
  counting votes and not a single number.
examples:
- They chose a statistical method to study the survey numbers.
- A good statistical method can show what the numbers mean.
