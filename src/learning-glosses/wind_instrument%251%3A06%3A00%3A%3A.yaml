simpleMeaning: A music tool in which the sound comes from a shut-in stream of air, moved by a pump or
  by a person's breath
scope: A music tool whose sound comes from a shut-in stream of air; wind is another name for this sense,
  and it is not a drum or a stringed tool.
examples:
- The wind instrument sounded clear and sweet.
- She plays a wind instrument in the band.
