simpleMeaning: to give the blessing of a religion to a thing, such as by making a holy promise
scope: 'Also called sanction: giving a thing the blessing of a religion, as by a holy promise; not making
  a person or thing pure and free from wrong.'
examples:
- The priest sanctified the marriage with a solemn oath.
- They asked the church to sanctify their union.
