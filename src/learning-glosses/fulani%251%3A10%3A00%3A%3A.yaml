simpleMeaning: A family of languages of the Fula of West Africa, a common tongue in sub-Saharan regions
  from Senegal to Chad, and the best known of the West African languages.
scope: Also called Ful, Fula, and Peul; a group of West African languages, not the people who speak them.
examples:
- Fulani is spoken across West Africa.
- He grew up speaking Fulani.
