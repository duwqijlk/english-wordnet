simpleMeaning: a low woody plant of southeastern Asia that sheds its leaves in winter, with leaves of
  paired leaflets and bunches of red or purple flowers, a source of indigo dye
scope: 'Also called indigo: a low woody plant of southeastern Asia, the source of indigo dye, not the
  dye itself.'
examples:
- Farmers grew indigo plants for the dye in their leaves.
- The indigo plant loses its leaves in winter and flowers in red and purple bunches.
