simpleMeaning: A member of a people from the Philippines, living chiefly in central Luzon around and including
  Manila.
scope: A member of this people lives chiefly in central Luzon around and including Manila; it is not another
  people of the Philippines, and not the Tagalog language.
examples:
- A Tagalog from Manila told us about the city.
- The Tagalog live chiefly in central Luzon.
