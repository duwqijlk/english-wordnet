simpleMeaning: a white salt that makes water basic, the opposite of acid, and is used to make glass and
  things that clean
scope: A white salt that makes water basic and is used to make glass and things that clean, not potassium
  bromide, potassium cyanide, or potassium sodium tartrate.
examples:
- Potassium carbonate was used to make glass for the new windows.
- Potassium carbonate was also used to make cleansing agents for the workshop.
