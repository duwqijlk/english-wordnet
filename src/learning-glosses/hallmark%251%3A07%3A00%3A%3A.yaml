senseId: 'hallmark%1:07:00::'
synsetId: 04739783-n
simpleMeaning: a quality that makes a person or thing different from others and easy to know
scope: Also called trademark and earmark, this is a quality that makes a person or thing different from
  others and easy to know, not a mark put on goods to show where they come from and that they are real.
examples:
- Kindness was the hallmark of her work with children.
- A hallmark of his writing is its short, clear sentences.
