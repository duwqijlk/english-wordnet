simpleMeaning: a way of putting two or more things or people in a line, one behind another
scope: Things or people in a line, one behind another; not the bicycle with two seats and two sets of
  pedals.
examples:
- They hitched the horses in tandem, one in front of the other.
- The seats were set in tandem, one behind the next.
