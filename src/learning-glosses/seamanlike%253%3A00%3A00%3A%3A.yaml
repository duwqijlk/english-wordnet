simpleMeaning: In the way of a sailor, fitting for a sailor and showing good skill at sea
scope: In the way of a sailor, fitting for a sailor and showing good skill at sea, also called seamanly;
  not the way of a landsman and not clumsy work at sea.
examples:
- His seamanlike knots held fast in the storm.
- She gave the order in a seamanlike way.
