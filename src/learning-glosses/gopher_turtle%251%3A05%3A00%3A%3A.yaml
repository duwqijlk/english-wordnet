simpleMeaning: A land animal with a hard shell that digs holes, can be eaten, and lives in the south-east
  of North America.
scope: 'Also called a gopher or a gopher tortoise: a burrowing land animal with a hard shell of south-east
  North America, not a sea turtle and not a small pet tortoise.'
examples:
- The gopher turtle dug a deep hole in the sandy ground.
- Gopher turtles live in the south-east of North America.
