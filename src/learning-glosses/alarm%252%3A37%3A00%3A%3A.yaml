simpleMeaning: to make someone feel afraid or worried, and give them an unpleasant surprise
scope: To make someone feel afraid or worried, not to warn someone and make them ready, and not a warning
  sound or a clock.
examples:
- The loud bang alarmed the children.
- News of the fire alarmed everyone in the building.
