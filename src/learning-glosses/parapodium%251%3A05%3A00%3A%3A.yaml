simpleMeaning: A bristled sea worm moves about and breathes with fleshy flaps that come in pairs.
scope: This fleshy flap is one of a pair on a bristled sea worm, and the worm uses the pair for moving
  about and for breathing.
examples:
- The worm moved with the help of its parapodium.
- The sea worm breathed through its parapodium.
