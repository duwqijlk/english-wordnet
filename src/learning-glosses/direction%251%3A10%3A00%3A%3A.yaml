simpleMeaning: something that offers guidance or advice on what to decide or how to proceed
scope: Advice or guidance that helps someone decide what to do; not a line or point in space (direction%1:15:00::,
  direction%1:24:00::), not a general course of development (direction%1:09:00::), not the act of managing
  (direction%1:04:00::), not a step-by-step description of how to do something (direction%1:10:02::),
  not the act of setting and holding a course (direction%1:04:01::), not a formal command (direction%1:10:01::),
  and not focused attention (direction%1:09:01::).
examples:
- She asked her mentor for direction before choosing a career.
- The committee waited for direction from the board before acting.
