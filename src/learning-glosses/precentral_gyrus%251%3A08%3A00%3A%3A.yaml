simpleMeaning: A fold in the front part of the brain, with a deep groove behind it, that holds the part
  that moves the body
scope: This is a fold in the front part of the brain, with a deep groove behind it, that holds the part
  that moves the body, not a fold at the back of the brain and not the part that takes in what the senses
  tell.
examples:
- The precentral gyrus holds the part that moves the body.
- Damage to the precentral gyrus can stop the arm from moving.
