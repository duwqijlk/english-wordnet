simpleMeaning: The state of being so clear that you can see right through a thing
scope: 'Also called transparency and transparentness: the state of being so clear you can see through
  a thing, not cloudiness, not a shine on the surface, and not the letting through of rays in physics.'
examples:
- The transparence of the glass made the vase look empty.
- We admired the transparence of the still water.
