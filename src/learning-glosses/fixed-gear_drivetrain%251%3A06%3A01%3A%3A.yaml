simpleMeaning: A set of driving parts with no free wheel, used on bikes that have no free wheel.
scope: A set of driving parts with no free wheel, used on bikes that have no free wheel; not a drive with
  a free wheel, and not a motor drive.
examples:
- His bike has a fixed-gear drivetrain, so he must keep pedalling.
- A fixed-gear drivetrain has no free wheel.
