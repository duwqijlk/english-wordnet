simpleMeaning: With round upright posts, or looking as if it has them; also, with posts of a named kind,
  often joined to another word
scope: This describes something that has round upright posts, or looks as if it does, often with a named
  kind of post joined to another word; it is not a row of text, words, or people standing one behind another.
examples:
- A columned hall held up the heavy roof with tall round posts.
- They walked past white-columned houses on the hill.
