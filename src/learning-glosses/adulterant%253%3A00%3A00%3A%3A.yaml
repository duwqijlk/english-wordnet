senseId: 'adulterant%3:00:00::'
synsetId: 02124512-a
simpleMeaning: Turning a thing impure or spoiled by adding stuff from outside.
scope: This sense is also called adulterating, for turning a thing impure or spoiled by adding stuff from
  outside, unlike the sense for any substance that cuts down the purity or force of a substance.
examples:
- The powder was adulterant, spoiling the mix.
- The matter was adulterant, making the drug impure.
