simpleMeaning: said of a hoofed mammal whose toes come in pairs
scope: 'Also called artiodactyl and artiodactylous: said of a hoofed mammal whose toes come in pairs,
  not of the mammal itself and not of a hoofed mammal whose toes do not come in pairs.'
examples:
- The deer is an even-toed animal, with two main toes on each foot.
- Pigs are even-toed mammals, like deer and cattle.
