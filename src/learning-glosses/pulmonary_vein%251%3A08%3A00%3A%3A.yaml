simpleMeaning: One of four blood tubes that carry blood full of oxygen from the lungs to the left room
  of the heart
scope: One of four blood tubes from the lungs to the heart, not a blood tube that carries blood from the
  heart to the body.
examples:
- The pulmonary vein carries blood from the lungs back to the heart.
- Each pulmonary vein opens into the left side of the heart.
