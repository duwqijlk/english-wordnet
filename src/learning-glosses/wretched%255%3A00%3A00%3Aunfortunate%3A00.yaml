simpleMeaning: describing a person or thing that people feel sorry for, or should feel sorry for
scope: Poor, miserable, pathetic and pitiful are other names for this sense. This is about a person or
  thing that people feel sorry for, or should feel sorry for, not about something being of very bad quality.
examples:
- The wretched children had no home and no food.
- She felt sorry for the wretched old man living alone.
