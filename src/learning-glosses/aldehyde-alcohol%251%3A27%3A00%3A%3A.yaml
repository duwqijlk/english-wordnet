simpleMeaning: An oily clear liquid got by joining two bits of acetaldehyde, holding an alcohol part (-OH)
  and an aldehyde part (-CHO).
scope: This sense is also called aldol.
examples:
- Aldehyde-alcohol held an alcohol part.
- An aldehyde-alcohol came from acetaldehyde.
