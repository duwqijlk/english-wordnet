simpleMeaning: A European foxtail now growing wild in North America, often a troublesome weed.
scope: This foxtail reached North America from Europe and now grows wild there, often as a troublesome
  weed; bottle-grass, bottle grass, green bristlegrass, green foxtail and rough bristlegrass are other
  names for this sense.
examples:
- Setaria viridis spread through the garden beds as a weed.
- Farmers pull out Setaria viridis before it seeds among the crops.
