simpleMeaning: making something less strong or less extreme in its effect
scope: This describes something that calms or weakens a strong feeling or action. It is not about making
  metal hard by heat, and not about a person losing their temper.
examples:
- His tempering words calmed the angry crowd.
- A little praise had a tempering effect on her pride.
