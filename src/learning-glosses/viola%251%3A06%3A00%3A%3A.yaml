simpleMeaning: an instrument with strings, played with a bow, a little larger than a violin, and tuned
  a fifth (five notes in music) lower than a violin
scope: The music instrument played with a bow, not the plant of the same name with small flowers.
examples:
- She plays the viola in the school orchestra.
- He held the viola under his chin and began to play.
