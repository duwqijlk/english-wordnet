simpleMeaning: a strong, spreading tree from North America with dark brown heavy wood, whose leaves turn
  gold in autumn
scope: A strong, spreading tree from North America with dark brown heavy wood, also called basket ash,
  brown ash, or hoop ash; not a tree grown for fruit and not a small bush.
examples:
- The black ash in the yard spread its wide branches over the path.
- In autumn, the leaves of the black ash turn gold.
