senseId: regular%5:00:00:frequent:00
synsetId: 01070692-s
simpleMeaning: used of a person who does something often or repeatedly, such as a customer or drinker
  who keeps coming back
scope: Only for a person who does something often; not clothing size, army membership, party loyalty,
  personal routines, timetables, repeated intervals, standard patterns, solid measurement, health, symmetry,
  normality, full-time work, or emphasis.
examples:
- She is a regular customer at the corner shop.
- The bar was full of regular drinkers who knew the owner.
