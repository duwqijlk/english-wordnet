simpleMeaning: A perennial plant of Europe and America with intensely bitter three-part leaves and clusters
  of white or purplish flowers; it often roots at the water's edge and spreads over water.
scope: 'Another name for water shamrock and bogbean: a water-side plant with three-part leaves, not a
  true trefoil or clover.'
examples:
- Marsh trefoil roots along the muddy margin of the lake.
- Marsh trefoil has three-part leaves and clusters of white or purplish flowers.
