simpleMeaning: something, such as parsley, that you put on food to make it taste better or look better
scope: This is something put on food, such as parsley, for taste or to make the dish look better. It is
  not the act of decorating food, and not a decoration used on other things.
examples:
- The soup came with a garnish of parsley on top.
- She put a lemon garnish beside the fish.
