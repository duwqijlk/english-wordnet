simpleMeaning: A member of one of the groups living in the land along the Yenisei river in the west of
  Siberia.
scope: This word is for a person of the group, not for the tongue the group speaks.
examples:
- The Yeniseian man told us about life in the river valley.
- A Yeniseian family has lived in the valley for many years.
