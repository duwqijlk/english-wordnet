simpleMeaning: The body needs this vitamin of the B group to turn the small bits that build protein and
  starch into what it can use.
scope: Also called pyridoxine, adermin, and pyridoxal, this B vitamin is one the body must have to turn
  protein bits and starch into what it can use.
examples:
- The body turns starch into what it can use with pyridoxamine.
- Without pyridoxamine, the body cannot break down the small bits that build protein.
