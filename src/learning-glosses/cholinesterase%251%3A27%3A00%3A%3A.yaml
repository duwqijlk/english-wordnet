simpleMeaning: an enzyme, a body chemical, that breaks down acetylcholine, a nerve chemical, into choline
  and acetic acid
scope: An enzyme that breaks down acetylcholine, a nerve chemical, into choline and acetic acid; not a
  drug and not a chemical that builds things up.
examples:
- Cholinesterase breaks down acetylcholine after a nerve fires.
- The test measured cholinesterase in the blood.
