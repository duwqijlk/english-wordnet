simpleMeaning: A round firework that spins round and round as it gives off coloured fire.
scope: A spinning firework, not a still firework and not the wheel of torture; pinwheel is another name
  for this sense.
examples:
- We lit the catherine wheel and watched it spin round and round, throwing out coloured fire.
- The children cheered as the catherine wheel whirled on its nail.
