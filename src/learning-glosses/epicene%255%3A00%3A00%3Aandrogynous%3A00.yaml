simpleMeaning: Of unclear sex, neither one nor the other.
scope: This sense is also called bisexual, for being of unclear sex, neither one nor the other, unlike
  the sense for one having both male and female sexual marks and parts, where at birth no clear call of
  male or female can be made, and unlike the sense for having womanly marks that do not suit a man.
examples:
- The figure was epicene, of unclear sex.
- Epicene figures are of unclear sex.
