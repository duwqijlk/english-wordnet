synsetId: 01788772-v
simpleMeaning: to feel embarrassment, laughter, or shame so strongly that it seems you cannot bear it.
scope: This is not actually stopping living; it is an exaggerated way to talk about very strong feelings.
examples:
- I nearly died of embarrassment when I forgot her name.
- We almost died laughing at his story.
