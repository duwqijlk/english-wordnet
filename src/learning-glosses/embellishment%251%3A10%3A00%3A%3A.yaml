senseId: 'embellishment%1:10:00::'
synsetId: 07187630-n
simpleMeaning: the adding of pretty, sometimes made-up details to a story or account
scope: 'Also called embroidery: extra pretty details added to a story or account, not sewing patterns
  on cloth and not decoration on a thing by itself.'
examples:
- The old story grew with each telling, full of embellishments that never really happened.
- His account of the trip needed no embellishment; the true facts were exciting enough.
