simpleMeaning: Roots of many farm plants are what this long thin grub-like young of various click beetles
  feeds on.
scope: It belongs with the young of beetles that eat the roots of many farm plants, not a true worm.
examples:
- The wireworm ate the roots of the young crop plants.
- A wireworm fed on the roots of the young plants.
