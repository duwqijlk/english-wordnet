simpleMeaning: A round dish, open at the top, that food is served from.
scope: This is the serving dish itself, not the similar vessel used mainly for grains or liquids, and
  not the small tobacco container or the amount one holds.
examples:
- She ladled the hot soup into a large bowl.
- The apples sat in a wooden bowl on the counter.
