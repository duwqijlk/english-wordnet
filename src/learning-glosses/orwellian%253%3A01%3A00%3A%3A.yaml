simpleMeaning: About the writings of George Orwell, above all his picture of a future land ruled by one
  hard power that watches everything.
scope: Of or about the works of George Orwell, above all his picture of a future land under one hard power;
  other writers of future lands are a different matter.
examples:
- The Orwellian world of the book is ruled by one hard power.
- Her Orwellian picture of the future scared the readers.
