simpleMeaning: A scientific tool that speeds up tiny charged bits of matter so they carry more energy
  of motion
scope: This is a scientific tool that speeds up tiny charged bits of matter; accelerator and particle
  accelerator are other names for it, not a tool for looking at small things and not a tool for splitting
  matter apart.
examples:
- The atom smasher speeds up tiny charged bits to very high energies.
- Scientists built an atom smasher to study the smallest bits of matter.
