simpleMeaning: a person let free under rules instead of going to prison, or let out of prison early, who
  must obey the rules and be watched for a set time
scope: This is a person who is free under rules instead of going to prison, or let out of prison early
  under rules; not someone still in prison and not someone fully free with no rules to follow.
examples:
- The probationer had to meet his officer every week.
- As a probationer, he could not leave the town without asking first.
