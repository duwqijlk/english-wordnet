simpleMeaning: the small tip on the part of a female animal's body that makes milk, where her young feed
scope: 'Also called pap, nipple, and tit: the small tip where a young animal feeds from its mother''s
  milk-making part — not the whole breast.'
examples:
- The lamb nuzzled the teat to feed.
- The calf found the teat and began to suck.
