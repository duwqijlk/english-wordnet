simpleMeaning: to make a thing react to light, often to light of one colour, by covering it with a thin
  coat used in photography
scope: This is making a thing react to light by covering it with a coat used in photography, also called
  sensitize; not making a living thing react to a serum and not making a thing react to heat.
examples:
- We sensitise the film before we use it in the camera.
- The worker will sensitise the plate with a thin coat.
