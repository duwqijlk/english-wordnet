simpleMeaning: A hand tool with two straight edges joined by a hinge, used to draw or measure angles of
  any size.
scope: A hand tool with two hinged straight edges for drawing or measuring angles, also called bevel;
  not a ruler and not a set square.
examples:
- He used the bevel square to mark the corner.
- She set the bevel square to the angle she needed.
