simpleMeaning: a room below the ground where people can stay safe until a strong wind storm has passed
scope: A safe room under the ground used during a violent storm, not a room for keeping food and not a
  room above ground.
examples:
- When the siren sounded, the family ran to the cyclone cellar.
- They kept blankets and water in the cyclone cellar for storm season.
