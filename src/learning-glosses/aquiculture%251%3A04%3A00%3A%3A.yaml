simpleMeaning: A way of growing plants with no soil, in water that holds food for plants dissolved in
  it.
scope: A way of growing plants with no soil, in water holding plant food; hydroponics is another name
  for it, and it is not growing plants in soil and not keeping fish.
examples:
- Lettuce can be grown by aquiculture in a tank of water.
- Aquiculture lets farmers grow plants without soil.
