simpleMeaning: In golf, a score on a hole that is one hit less than the number of hits expected for that
  hole
scope: In golf, a score of one hit less than the number expected on a hole; not the light feathered ball
  used in badminton.
examples:
- She made a birdie on the last hole and won the game.
- He was happy to get a birdie after a bad start.
