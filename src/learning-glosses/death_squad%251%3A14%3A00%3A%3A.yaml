simpleMeaning: Usually with the government's silent backing, this secret team of soldiers or armed men
  kills people who speak out against the government or small-time lawbreakers.
scope: This secret team kills people who speak out against the government or small-time lawbreakers, and
  it does not fight in the open like an army unit.
examples:
- The death squad killed people who spoke out against the government.
- A death squad works in secret, usually with the government's silent backing.
