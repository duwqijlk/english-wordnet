simpleMeaning: A paper note sent to wish a person well at the spring feast that marks the rising of Jesus.
scope: A paper note of good wishes for the spring feast, not a birthday note and not a note for Christmas.
examples:
- She sent her grandmother an Easter card with flowers on the front.
- We bought an Easter card for our teacher before the holiday.
