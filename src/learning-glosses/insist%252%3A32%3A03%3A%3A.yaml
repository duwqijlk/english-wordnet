schema: oewn-learning-gloss-v2
senseId: 'insist%2:32:03::'
synsetId: 00779976-v
simpleMeaning: to keep asking someone for something again and again, with urgency.
scope: Urging someone again and again, almost begging (another name for this sense is 'importune'), not
  refusing to budge or affirming a fact.
examples:
- The child insisted on being carried, pleading and tugging at his mother's sleeve until she picked him
  up.
- He insisted that I take the money, pressing it into my hand.
