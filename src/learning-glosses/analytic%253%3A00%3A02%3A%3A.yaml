schema: oewn-learning-gloss-v2
senseId: 'analytic%3:00:02::'
synsetId: 00112226-a
simpleMeaning: showing a grammar point by using two or more words, not by changing the end or form of
  one word
scope: This grammar sense means showing a grammar point with extra words, not breaking a whole thing into
  small parts to study it, and not using algebra and calculus.
examples:
- English is largely analytic, using helper words like 'will' to show time.
- An analytic form like 'more careful' uses two words instead of changing one word.
