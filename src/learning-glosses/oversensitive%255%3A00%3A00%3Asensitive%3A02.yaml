simpleMeaning: too easily hurt or upset by things that would not hurt or upset most people
scope: Too easily hurt by words or small acts; not about skin or eyes that feel pain easily, and not just
  being kind or caring.
examples:
- He is oversensitive and gets upset at the smallest joke.
- Do not be oversensitive about a short, honest comment.
