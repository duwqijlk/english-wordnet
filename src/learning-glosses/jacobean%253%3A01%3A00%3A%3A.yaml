simpleMeaning: Said of things that belong to James the First, or to the time he ruled.
scope: Said of things to do with James the First and the time he ruled, not a person of that time.
examples:
- Jacobean writers worked in the time of James I.
- The play has a Jacobean feel, from the time of James I.
