simpleMeaning: to come to an end in time, in place, or in amount, whether in a real way or only as a picture
scope: To come to an end in time, place, or amount, also called end, finish, stop, or cease; not to fire
  someone from a job.
examples:
- The road terminates at the river.
- Her rights terminate where yours begin.
