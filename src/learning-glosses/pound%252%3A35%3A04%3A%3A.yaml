simpleMeaning: to put an animal inside a public enclosure where it is held.
scope: Putting an animal specifically into a pound, not confining something in any enclosure or hitting
  it hard.
examples:
- The farmer pounded the stray cows into the village pound.
- The warden pounded the lost dogs into the city pound until their owner came.
