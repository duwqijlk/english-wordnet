simpleMeaning: an X-ray check of blood vessels after a dye that shows up on X-rays is put in, which makes
  a picture of the vessels
scope: An X-ray check of blood vessels using dye, not a blood test and not a scan of bones.
examples:
- The doctor ordered angiography to see the blood vessels in her leg.
- Angiography showed where the vessel was blocked.
