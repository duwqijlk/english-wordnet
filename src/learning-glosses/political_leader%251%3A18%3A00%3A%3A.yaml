simpleMeaning: A person who takes an active part in the work of a party that seeks power in government
scope: A person active in party politics, also called a politician or a politico; not a leader of a country
  as a whole and not a person with no party ties.
examples:
- The political leader addressed a crowd of party supporters.
- Several political leaders met to plan the next election campaign.
