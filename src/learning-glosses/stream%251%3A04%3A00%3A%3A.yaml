senseId: 'stream%1:04:00::'
synsetId: 00330053-n
simpleMeaning: a steady onward movement that does not stop or break off
scope: Another name for this is flow; it is the ongoing process of moving along, not the water or fluid
  itself, not a mass of people or things in motion, and not a series of events or ideas.
examples:
- The stream of time carries every generation away.
- The stream of days turned into months before she noticed.
