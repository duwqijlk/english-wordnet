schema: oewn-learning-gloss-v2
senseId: 'sequence%1:14:00::'
synsetId: 08476263-n
simpleMeaning: the order in which things follow each other in a way that makes sense or in a pattern that
  comes back again
scope: This sense is the order in which things follow each other, not a piece of music played again higher
  or lower, not a set of joined shots in a film, and not the act of putting things in order.
examples:
- The sequence of names on the list was in order from A to Z.
- Write down the sequence of steps and follow them in order.
