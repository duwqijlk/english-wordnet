schema: oewn-learning-gloss-v2
senseId: 'predicate%2:32:02::'
synsetId: 01019231-v
simpleMeaning: In grammar, to put a word in as the part of a sentence that says something about its subject.
scope: In grammar, to put a word in as the part of a sentence that says something about its subject, not
  the part itself, and not the term said of the subject of a claim, and not to say that a thing has a
  certain quality, and not the use in which one thing follows from another.
examples:
- In the sentence ‘Fido is a dog’, ‘dog’ is predicated of ‘Fido’.
- ‘Happy’ is predicated of Mary in ‘Mary is happy’.
