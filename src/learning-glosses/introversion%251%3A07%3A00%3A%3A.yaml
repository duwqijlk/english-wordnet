simpleMeaning: In psychology, a turn of mind that looks inward, taken up with one's own thoughts and feelings.
scope: In psychology, a turn of mind that looks inward, taken up with one's own thoughts and feelings;
  not the folding in of an outer layer to form a pocket, and not the state of being folded inward or sheathed.
examples:
- Their introversion made parties hard for them.
- Their introversion showed in long hours spent alone with their books.
