simpleMeaning: A bush of cold northern wet ground that keeps its tough green parts all year and bears
  small white tube-shaped blooms.
scope: Unlike the stiff fern of western North America with fronds parted to the midrib, this bush of cold
  northern wet ground keeps its tough green parts all year and bears small white tube-shaped blooms.
examples:
- Leatherleaf grows in the wet ground of a northern bog.
- The leatherleaf kept its tough green parts through the winter.
