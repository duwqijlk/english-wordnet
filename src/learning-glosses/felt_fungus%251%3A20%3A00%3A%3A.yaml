simpleMeaning: A growth that often wraps round twigs and branches of many kinds of tree, above all citrus
  trees in the southern United States
scope: A growth that often wraps round the small branches of many kinds of tree, above all citrus trees
  in the southern United States; not a growth on leaves and not a growth on the ground.
examples:
- The felt fungus ringed the twig.
- Felt fungus covered the branch of the orange tree.
