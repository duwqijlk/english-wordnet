senseId: 'neutralize%2:41:02::'
synsetId: 02549571-v
simpleMeaning: to act in the opposite way against something, so that its effects become weaker
scope: This sense, also called counteract, counterbalance and countervail, is about acting against an
  effect to make it weaker; it is not about making a place take no side in politics, and not about making
  a chemical neither an acid nor a base.
examples:
- His quick action neutralized the effect of the bad decision.
- A pay rise neutralized the effect of higher prices for many workers.
