simpleMeaning: having to do with a calendar or with how time is measured
scope: Another name for it is calendrical; it is about a calendar and the measure of time, not a date
  itself or a day of the week.
examples:
- The old book lists the calendric rules for feast days.
- Solstice is a time of calendric importance in the old system.
