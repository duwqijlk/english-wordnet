simpleMeaning: about a lens, or a set of lenses, with no fault that makes a point look spread out, so
  a point shows as a point
scope: 'Also called stigmatic: about a lens with no fault that spreads a point of light, not a lens that
  makes things look near and not a lens for one eye only.'
examples:
- The camera used an anastigmatic lens to keep each point sharp.
- An anastigmatic lens shows a small dot as a dot, not as a smear.
