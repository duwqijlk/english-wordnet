simpleMeaning: suddenly full of fear and deep worry, with no clear idea what to do
scope: 'Also called shocked, aghast, or dismayed: suddenly full of fear at something dreadful, not merely
  surprised and not quietly worried.'
examples:
- She was appalled by the news of the accident.
- He stood appalled at the damage the storm had done.
