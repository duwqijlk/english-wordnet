simpleMeaning: the time in a woman's life when her monthly bleeding (the menstrual cycle) stops for good
scope: This is the time when a woman's monthly bleeding stops for good, not one monthly bleeding and not
  the start of monthly bleeding in a young girl.
examples:
- Many women reach menopause around the age of fifty.
- After menopause, she no longer had monthly bleeding.
