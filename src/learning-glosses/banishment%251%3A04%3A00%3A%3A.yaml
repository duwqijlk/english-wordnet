simpleMeaning: rejecting someone by making them leave a place and stay away from it
scope: This is the act of rejecting a person by sending them away from a place; it is not the state of
  being sent away and kept out.
examples:
- The king ordered the banishment of the traitor from the country.
- Her banishment from the city was announced by the court.
