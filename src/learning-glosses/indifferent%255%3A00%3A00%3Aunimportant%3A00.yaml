simpleMeaning: not important, often with 'to' after it, and not mattering one way or the other
scope: Not important and not mattering one way or the other, often with 'to', not the sense of refusing
  to pay heed, not the sense of having no liking for one thing over another, and not the chemical sense.
examples:
- Whether we leave now or later is indifferent to us.
- The colour of the walls was indifferent to her; she liked the room either way.
