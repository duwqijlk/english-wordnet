simpleMeaning: a body chemical that makes the stuff that causes swelling, pain, and a high temperature
scope: A body chemical that makes the stuff behind swelling, pain and fever, not the wider pair of related
  chemicals and not aspirin, which blocks it.
examples:
- The drug blocks cyclooxygenase-2 to ease pain and swelling.
- Cyclooxygenase-2 makes the body chemicals that bring on fever.
