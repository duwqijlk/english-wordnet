simpleMeaning: a place to stay where tired horses were changed for fresh ones and riders could rest
scope: Also called posthouse, this is a place to stay where horses were changed and riders could rest,
  not a house for one family and not a stable for horses only.
examples:
- They stopped at the post house to change horses and rest for the night.
- The old post house still stands beside the road where riders once stayed.
