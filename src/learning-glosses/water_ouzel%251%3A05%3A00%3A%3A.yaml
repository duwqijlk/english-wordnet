simpleMeaning: With no skin between its toes, this small, thick-set bird dives in fast-running streams
  and feeds along the bottom.
scope: Also called a dipper, this is the name for a small bird that dives in fast-running streams.
examples:
- A water ouzel dived into the fast stream and fed along the bottom.
- We watched a water ouzel feed on the bed of the stream.
