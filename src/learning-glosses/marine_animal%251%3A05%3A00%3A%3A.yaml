simpleMeaning: The sea is home to many kinds of living things, from fish and soft-bodied shellfish to
  the mammals that live there.
scope: Also called marine creature, sea animal, and sea creature, it covers any of the many animals that
  live in the sea.
examples:
- The fisherman pulled a marine animal from his net.
- She watched a marine animal swim past the boat.
