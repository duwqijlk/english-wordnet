simpleMeaning: The tools for sending messages to a far-off place over a wire, usually in Morse code.
scope: The tools for sending messages to a far-off place over a wire, usually in Morse code, also called
  telegraph, and not the sending of messages far away by electric means over a wire.
examples:
- The station used telegraphy to pass news along the line.
- Before the phone, telegraphy carried most urgent messages.
