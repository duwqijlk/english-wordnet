simpleMeaning: One ruler holds all the power in the country, with no laws, no constitution and no opposition
  to hold them back
scope: tyranny is another name for this sense; this is rule by one ruler with all the power, not rule
  by a group or by the people.
examples:
- Authoritarianism grew as the ruler seized more power.
- The country suffered under authoritarianism for decades.
