simpleMeaning: a kind way of thinking about people, in which you do not judge them too hard
scope: A kind, not strict way of thinking about people; not giving money or help to people in need, and
  not the plant with blue or white flowers.
examples:
- She spoke with charity about her rivals.
- He showed charity toward those who had hurt him.
