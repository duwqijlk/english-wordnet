simpleMeaning: 'A flat surface for graphing numbers with a real part and an imaginary part: real values
  run along the horizontal axis, imaginary values along the vertical one.'
scope: This is the two-axis map used for numbers with an imaginary part, not the ordinary number line
  or a three-dimensional coordinate space.
examples:
- They plotted the number 3 + 2i on the complex plane.
- The roots of the equation form a circle in the complex plane.
