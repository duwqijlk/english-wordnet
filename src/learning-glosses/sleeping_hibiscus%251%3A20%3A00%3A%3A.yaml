simpleMeaning: a plant of the group Malvaviscus, with bright bell-shaped flowers that hang down, looking
  like buds that have only half opened
scope: 'Also called a wax mallow or a waxmallow: a plant with bright bell-shaped flowers that hang down,
  not a rose mallow and not a hollyhock.'
examples:
- The sleeping hibiscus in the garden has bright red bells that hang down.
- A sleeping hibiscus bud looks half opened even in full flower.
