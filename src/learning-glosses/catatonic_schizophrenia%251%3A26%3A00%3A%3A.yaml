simpleMeaning: a state in which a person with schizophrenia stays fixed and dull for long periods, with
  short spells of wild excitement at times
scope: 'Also called catatonia and catatonic type schizophrenia: a kind of schizophrenia marked by long
  still spells and short bursts of excitement, not a mood that shifts often and not simple tiredness.'
examples:
- Catatonic schizophrenia kept her still and dull for weeks.
- His catatonic schizophrenia broke into a short spell of wild excitement.
