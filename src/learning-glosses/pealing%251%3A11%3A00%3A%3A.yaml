simpleMeaning: a deep sound that goes on for a long time, like thunder or big bells
scope: 'Also called roll, rolling, and peal: a deep sound that lasts a long time, not the act of ringing
  a bell and not a thin, high sound.'
examples:
- The pealing of the church bells filled the town.
- We heard the pealing of thunder over the hills.
