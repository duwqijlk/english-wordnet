simpleMeaning: Facing Mecca, a fixed form of prayer is said five times a day, best in a mosque, as the
  second pillar of Islam
scope: The fixed form of prayer said five times a day facing Mecca, also called salaah, salaat and salah,
  not prayer in general.
examples:
- He says his salat five times a day.
- They say salat facing Mecca.
