simpleMeaning: a soft word for the killing and harm done to ordinary people and the wrecking of their
  things by mistake during fighting
scope: A soft word for the killing and harm done to ordinary people and the wrecking of their things by
  mistake in war, not harm done on purpose and not harm to soldiers.
examples:
- The report counted the collateral damage after the bombing.
- Collateral damage is the harm war does to people who are not fighting.
