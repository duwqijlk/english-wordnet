simpleMeaning: an oily liquid with no colour or a light yellow colour, made from wood tar by heating it
  and collecting what comes off; used to kill germs
scope: This is the clear or light yellow liquid made from wood tar and used to kill germs, not the dark
  liquid made from coal tar that is put on wood to stop it going bad, and not the act of putting such
  a liquid on wood.
examples:
- She put some creosote on the wound to kill germs.
- The bottle held yellow creosote made from wood tar.
