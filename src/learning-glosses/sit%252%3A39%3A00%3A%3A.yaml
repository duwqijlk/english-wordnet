simpleMeaning: To hold a pose, as a model does for an artist or photographer.
scope: This is posing for an artist or photographer; it is not the everyday act of resting on a chair,
  and not taking a seat.
examples:
- She sat for a portrait in the studio every Tuesday.
- He sat for the sculptor three mornings a week that summer.
