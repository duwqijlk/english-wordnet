simpleMeaning: A large green young hawkmoth with white stripes that eats tomato and potato plants, much
  like the tobacco hornworm.
scope: This is the green striped young moth that eats tomato and potato plants; potato worm and tomato
  hornworm are other names for this sense, not the grown moth itself, whose young are these eaters.
examples:
- We found Manduca quinquemaculata larvae feeding on the tomato plants.
- The Manduca quinquemaculata caterpillars had stripped the potato leaves.
