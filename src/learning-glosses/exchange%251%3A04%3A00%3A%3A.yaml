simpleMeaning: The swapping of one amount of money for another of equal value, especially between different
  national currencies.
scope: This is money swapped for an equal amount, notably between currencies, not a general swap of goods
  or acts, and not the giving of something in return for something received.
examples:
- The bank charges a small fee for the exchange of foreign currency.
- He earns his living from the exchange of currencies.
