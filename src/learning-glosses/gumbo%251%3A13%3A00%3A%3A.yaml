simpleMeaning: a soup or stew made thick by cooking it with okra pods, the long green seed cases of a
  plant
scope: A soup or stew made thick with okra pods, not the okra pods on their own and not a fine, sticky
  kind of earth that turns to mud when wet.
examples:
- We ate gumbo thickened with okra for dinner.
- She cooked a gumbo and used okra pods to make it thick.
