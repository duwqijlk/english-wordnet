simpleMeaning: a pattern with many parts, with colors and shapes that change all the time
scope: This is the pattern of changing colors and shapes, not the toy tube with bits of colored glass
  inside it.
examples:
- Her dress was a kaleidoscope of bright colors and shapes.
- The garden was a kaleidoscope of changing colors in the wind.
