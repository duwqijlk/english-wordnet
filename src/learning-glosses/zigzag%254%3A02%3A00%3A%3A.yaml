simpleMeaning: moving with sharp turns from side to side, first one way and then the other way
scope: This describes how something moves from side to side; it is not the sharp-angled shape itself and
  not the verb for travelling in this way.
examples:
- The rabbit ran zigzag across the field to escape the dog.
- Birds flew zigzag across the blue sky.
