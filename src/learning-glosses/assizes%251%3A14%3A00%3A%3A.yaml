simpleMeaning: The courts that sat in each county of England until 1971, when Crown courts took their
  place
scope: The courts that sat in each county of England until 1971, also called a court of assize and a court
  of assize and nisi prius; not a local magistrates' court and not a modern Crown court.
examples:
- The assizes sat in York twice a year.
- He was tried at the assizes before they were replaced in 1971.
