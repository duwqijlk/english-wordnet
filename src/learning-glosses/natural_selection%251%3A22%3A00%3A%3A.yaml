simpleMeaning: Without anyone choosing, the ones that fit their place best live on and have young, while
  living things change over a long time
scope: This is the slow change of living things so the best-fitted live on, with survival and selection
  as other names for this sense, not a choice made by people and not the quick change of one animal or
  plant.
examples:
- Through natural selection, the birds with the thickest beaks lived through the dry years.
- Natural selection works slowly, over many more years than one person's life.
