simpleMeaning: A small, spiny, bushy tree grown for its dark purple fruit, which has sweet flesh tasting
  of gooseberries; it is cultivated in Sri Lanka and India.
scope: The tree itself, also called ketembilla tree or kitambilla; not the fruit of the same name.
examples:
- The ketembilla in our garden has sharp spines along every branch.
- Birds nest in the dense ketembilla beside the fence.
