simpleMeaning: A common gas with no metal, of the halogen group, heavy, yellow, harsh, poisonous; used
  to make water safe, whiten, kill germs; found only in salt, as in sea water.
scope: Not the gas fluorine or bromine, which are other halogen gases; also called chlorine and atomic
  number 17.
examples:
- The pool worker added Cl to the water to kill germs.
- Cl in sea water comes only in the form of salt.
