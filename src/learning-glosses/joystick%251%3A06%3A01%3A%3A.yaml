simpleMeaning: A stick you move by hand, standing upright, that moves freely in two directions, used to
  send orders to a computer or to machines run by a computer.
scope: A hand control for a computer or a machine run by a computer, not the lever a pilot uses to fly
  a plane.
examples:
- He pushed the joystick forward to steer the game.
- The joystick lets you move the crane with one hand.
