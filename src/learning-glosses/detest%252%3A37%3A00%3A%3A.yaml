simpleMeaning: to dislike someone or something very strongly, and to feel a deep wish to keep away from
  them or it
scope: To dislike someone or something very strongly; hate is another name for this sense, not a mild
  dislike and not fear.
examples:
- She detests politicians who lie.
- I detest the taste of black coffee.
