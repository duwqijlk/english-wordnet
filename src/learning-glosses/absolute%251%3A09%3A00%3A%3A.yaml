simpleMeaning: something thought of or existing on its own, apart from other things, depending on nothing
  else and beyond anyone's control, not relative to anything
scope: This is the philosophical noun for a thing that stands alone and beyond control, not the adjective
  senses meaning complete, final or unrestricted.
examples:
- Philosophers have argued for centuries about whether the absolute exists.
- She believed the absolute was beyond human reach.
