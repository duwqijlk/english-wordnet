simpleMeaning: Sounding like a voice made with the nose held tight
scope: This is a voice that sounds as if the nose is held tight; pinched is another name for this sense,
  not the bone in the nose, and not a cold that blocks the nose.
examples:
- He spoke in a nasal voice.
- Her nasal whine annoyed the whole class.
