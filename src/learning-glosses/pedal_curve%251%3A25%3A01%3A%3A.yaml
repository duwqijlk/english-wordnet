simpleMeaning: In maths, the shape made by dropping straight lines from one fixed point onto the lines
  that touch a given shape
scope: In maths, the shape made by dropping straight lines from one fixed point onto the lines that touch
  a given shape, not the given shape itself.
examples:
- The pedal curve of an ellipse with its focus as the fixed point is a circle.
- Draw the pedal curve by dropping straight lines from the fixed point.
