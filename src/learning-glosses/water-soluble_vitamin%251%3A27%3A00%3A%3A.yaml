simpleMeaning: any of the food substances the body needs that can dissolve in water
scope: One of the food substances the body needs, of the kind that dissolves in water; not one that dissolves
  in fat.
examples:
- Vitamin C is a water-soluble vitamin that our bodies cannot store for long.
- She takes a water-soluble vitamin each morning with her breakfast.
