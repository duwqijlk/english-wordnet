senseId: cosmopolitan%5:00:00:comprehensive:00
synsetId: 00529364-s
simpleMeaning: covering the whole world, or able to be used everywhere in the world
scope: Also called general, universal, and worldwide. This is about a thing that covers or can be used
  in the whole world, not about a person who is at home in many parts of the world.
examples:
- Climate change is a cosmopolitan problem that touches every country.
- They wanted a cosmopolitan rule that could be used in every country.
