simpleMeaning: a set of machines that makes things cold or frozen, usually to keep things from going bad
scope: A set of machines that chills or freezes things, usually to keep them from going bad, not a single
  cold box and not a heater.
examples:
- The shop's refrigeration system keeps the milk cold all day.
- When the refrigeration system broke down, the frozen food began to melt.
