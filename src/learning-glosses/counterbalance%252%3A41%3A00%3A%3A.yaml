senseId: 'counterbalance%2:41:00::'
synsetId: 02549571-v
simpleMeaning: to act against something and make its effect weaker by doing the opposite
scope: To act in the opposite way so an effect becomes weaker, also called neutralize, counteract, and
  countervail; it is not a heavy weight used to balance another weight.
examples:
- Good rest can counterbalance the bad effects of a hard week.
- She counterbalanced his angry words with calm and kind actions.
