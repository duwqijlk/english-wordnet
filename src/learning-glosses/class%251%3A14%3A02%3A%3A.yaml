simpleMeaning: in biology, a group in the system that sorts living things, containing one or more orders
scope: This is the biological ranking, not a collection of things sharing a common feature, not a group
  of students taught together, not people of the same social or economic status, not a course of lessons,
  not a league ranked by quality, not a year group of graduates, and not the verb for sorting things into
  groups.
examples:
- Birds belong to their own class, separate from mammals.
- The class contains several orders of insects.
