simpleMeaning: A common plant of the United States that lives for many years, with white leaf-like parts
  that look like petals and stand out.
scope: A common plant of the United States that lives for many years, with white leaf-like parts that
  look like petals and stand out; not a plant that lives for one year and not a plant with small green
  flowers.
examples:
- The flowering spurge stood out with its white leaf-like parts.
- Flowering spurge comes back year after year in the garden.
