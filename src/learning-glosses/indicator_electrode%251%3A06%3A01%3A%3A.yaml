simpleMeaning: In a test liquid, a thin metal piece picks up an electric signal while leaving what is
  in the liquid untouched.
scope: This thin metal piece picks up an electric signal in a test liquid, and it is not a piece that
  changes what is in the liquid.
examples:
- The indicator electrode gave a reading from the test liquid.
- We cleaned the indicator electrode before putting it into the new sample.
