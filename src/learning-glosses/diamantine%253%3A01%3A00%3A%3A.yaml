simpleMeaning: like diamonds in how it looks, or made from diamonds themselves
scope: Something made of diamonds or that looks like diamonds; not a diamond on its own, and not just
  any bright jewel.
examples:
- The diamantine brooch shone like a diamond at every turn.
- Her diamantine ring was made of tiny diamonds set close together.
