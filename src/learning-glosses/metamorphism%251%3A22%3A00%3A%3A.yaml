simpleMeaning: Natural forces such as heat, pressure, or new chemicals change the make-up of rock
scope: A change in rock caused by natural forces, not a change of shape in a living thing and not the
  wearing away of rock at the surface.
examples:
- Metamorphism turned the shale into slate under great pressure.
- Heat from the magma caused metamorphism in the rocks nearby.
