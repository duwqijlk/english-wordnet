simpleMeaning: the side of a feeling or emotion that a person is aware of in their own mind
scope: The part of a feeling that a person knows in their own mind, not the verb sense of tying a person
  closely to something.
examples:
- The doctor noted the patient's affect during the visit.
- Her affect showed little joy that day.
