simpleMeaning: A very short-stemmed plant with thick leaves full of soothing jelly-like sap; its leaves
  grow spiny edges as they age; from the Mediterranean, widely grown in warm lands and homes.
scope: 'Also called the burn plant: a short-stemmed plant with thick, sap-filled leaves, not a tall kind
  of this plant family and not a cactus.'
examples:
- I keep an Aloe vera on the kitchen windowsill for burns.
- The Aloe vera leaves felt thick and full of jelly.
