simpleMeaning: To remove something by rubbing it out, crossing it out, or treating it as if a line were
  drawn through it.
scope: 'Another name for strike, expunge and excise: to cancel written material, not physically scraping
  a surface or postponing an event.'
examples:
- Scratch that last sentence; it does not belong.
- The editor asked him to scratch the whole paragraph.
