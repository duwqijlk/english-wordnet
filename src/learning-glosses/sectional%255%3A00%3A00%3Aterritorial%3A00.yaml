simpleMeaning: about or limited to one separate area of land, or to one separate part of a community or
  group of people
scope: About one area or group only, not made of separate parts and not about a cut-through view or drawing.
examples:
- Sectional tensions grew between the north and south of the country.
- The law met sectional opposition from farmers in one region only.
