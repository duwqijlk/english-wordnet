simpleMeaning: one thousandth of a litre, the amount of room a thing takes up when measured with metric
  units
scope: Also called cc, ml, mil, a millilitre, a milliliter, or a cubic centimeter, this is a metric measure
  of volume, not a measure of length or weight.
examples:
- Pour 10 cubic centimetres of juice into the glass.
- The box holds 500 cubic centimetres.
