simpleMeaning: Ground up, these black or white grains make a hot yellow paste or a dry powder
scope: The black or white grains ground to make the hot yellow paste or its dry powder, not the oil pressed
  from them and not the plant they grow on.
examples:
- She ground mustard seed with vinegar to make a hot paste.
- Black mustard seed gives a stronger paste than the white kind.
