simpleMeaning: Feeling or looking ill, as if the liver is out of order or the stomach is upset.
scope: 'Also called livery or liverish: feeling or looking ill from a liver upset or a bad stomach, not
  the sense of relating to bile itself and not the irritable temper that comes with indigestion.'
examples:
- He felt bilious after the rich meal.
- She looked bilious and said her stomach was upset.
