simpleMeaning: Any stuff that looks like starch is one of these, and so is a food stuff made mostly of
  starch, with no nitrogen in it.
scope: This is a food stuff made mostly of starch, or any stuff like starch, and not the waxy protein
  stuff that forms in sick body tissue.
examples:
- The amyloid in the meal was mostly starch.
- This amyloid has no nitrogen in it at all.
