simpleMeaning: To buy things from a particular store or business, to use its services, or to be one of
  its regular customers.
scope: This is not the act of making goods by hand; it means buying from a store or using a business as
  a customer.
examples:
- We usually shop at the market on Saturdays.
- Many local families shop with the same grocer for years.
