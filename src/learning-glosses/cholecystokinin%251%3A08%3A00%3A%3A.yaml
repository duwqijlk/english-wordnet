senseId: 'cholecystokinin%1:08:00::'
synsetId: 05416479-n
simpleMeaning: A digestive hormone (a chemical messenger) that makes the pancreas release enzymes and
  the gall bladder tighten and empty; fats and proteins in the small intestine trigger its release.
scope: This is the body's own gut hormone, not a digestive enzyme or a drug that mimics it.
examples:
- Fat in a meal causes cholecystokinin to be released.
- The doctor measured cholecystokinin levels after the patient ate.
