simpleMeaning: In a decent way, in line with what is right and good.
scope: A decent, upright way of acting, not merely acting well enough to be counted worthy.
examples:
- They lived respectably, keeping to honest work and good manners.
- She behaved respectably at the dinner, speaking politely to everyone.
