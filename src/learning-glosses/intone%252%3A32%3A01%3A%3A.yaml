simpleMeaning: To say words with care, letting the voice rise and fall or using one clear tone throughout
scope: To speak with care, letting the voice rise and fall or using one clear tone; not saying words flatly
  over and over, and not chanting a set text.
examples:
- The priest intoned the blessing in a slow, solemn voice.
- She intoned each word with care, her voice rising and falling.
