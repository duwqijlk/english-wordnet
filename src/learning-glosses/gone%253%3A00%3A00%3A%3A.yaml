simpleMeaning: dazed or wildly excited as a result of a drug, especially alcohol
scope: This is not having left a place or having used something up; it describes a mind that is dulled
  or stirred up by a substance.
examples:
- After three beers he was too gone to drive home.
- She was completely gone on the painkillers and could barely speak.
