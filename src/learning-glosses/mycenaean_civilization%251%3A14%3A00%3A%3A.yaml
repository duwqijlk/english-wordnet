simpleMeaning: The way of life of old Mycenae in the late age of bronze, at its height from 1400 to 1100
  BC.
scope: Also called Mycenaean civilisation and Mycenaean culture; the way of life of old Mycenae in the
  late age of bronze, not other old cultures and not the city of Mycenae itself.
examples:
- Mycenaean civilization flourished from 1400 to 1100 BC.
- The Mycenaean civilization left fine gold work.
