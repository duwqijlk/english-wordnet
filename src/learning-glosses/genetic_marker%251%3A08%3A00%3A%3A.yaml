simpleMeaning: a gene that makes a clear trait that people can use to learn about a family or a whole
  group
scope: A gene that makes a clear trait and can be used to study families or groups, not a gene that makes
  a trait no one can see, and not a test of blood type.
examples:
- The genetic marker helped the team find the family link.
- Scientists use this genetic marker in studies of whole groups.
