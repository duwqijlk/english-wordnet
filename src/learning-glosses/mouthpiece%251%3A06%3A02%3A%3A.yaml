simpleMeaning: You speak into this part of a phone, and it picks up the sound of your voice for the person
  at the other end
scope: The part of a telephone you speak into, not the opening of a wind instrument and not a guard for
  the teeth.
examples:
- Speak clearly into the mouthpiece of the phone.
- He held the mouthpiece close and gave his name.
