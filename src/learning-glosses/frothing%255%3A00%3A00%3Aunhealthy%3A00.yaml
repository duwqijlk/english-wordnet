senseId: frothing%5:00:00:unhealthy:00
synsetId: 01180331-s
simpleMeaning: making or covered with white sweat or spit full of small bubbles, from being very tired
  out or from sickness
scope: This sense means making or covered with bubbly sweat or spit because the body is tired out or sick,
  also called foaming and foamy, not light bubbles on a drink.
examples:
- The frothing horse stopped and stood breathing hard after the long run.
- The sick dog lay still with a frothing mouth.
