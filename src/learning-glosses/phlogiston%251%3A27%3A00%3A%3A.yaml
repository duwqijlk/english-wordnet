simpleMeaning: A substance that people once thought was in everything that can burn and was set free when
  it burned
scope: A substance people once thought was in all things that can burn and was set free when they burned,
  not something science finds today.
examples:
- Old books on fire say that phlogiston left the wood as it burned.
- The chemists of that time held that phlogiston was set free in every fire.
