simpleMeaning: Spending winter in warm America and nesting in the southeast of the United States, this
  kingbird is bigger than the eastern kingbird.
scope: Grey kingbird and petchary are other names for this kingbird, which is bigger than the eastern
  kingbird.
examples:
- The gray kingbird spent the winter in tropical America.
- A gray kingbird is bigger than an eastern kingbird.
