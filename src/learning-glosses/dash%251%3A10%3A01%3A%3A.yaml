senseId: 'dash%1:10:01::'
synsetId: 06856198-n
simpleMeaning: a mark shaped like a short line, put between parts of a joined word, or between parts of
  a word cut at the end of a line
scope: A short line mark between parts of a word, not a quick run, not a stylish manner, and not a long
  signal in Morse code.
examples:
- Use a dash to join the two parts of the word.
- The dash at the end of the line shows the word goes on.
