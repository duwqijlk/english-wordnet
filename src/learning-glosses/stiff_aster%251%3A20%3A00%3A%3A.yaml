simpleMeaning: a wiry plant of the eastern United States that lives for years, growing in tufts with hard
  straight rough stems, narrow leaves, and large violet flowers
scope: A plant of the eastern United States, not other asters and not a garden flower with soft stems.
examples:
- The stiff aster stood in a dry patch at the edge of the woods.
- We found a stiff aster with big violet flowers on the hill.
