simpleMeaning: Sharp points guard it, such as barbs, quills, spines, thorns, or stiff hairs, and the like.
scope: Prickly, bristled, barbed, thorny, bristly, spiny, burred, barbellate, briary, briery, burry and
  setose are other names for it.
examples:
- The setaceous whiskers felt sharp to the touch.
- The stem was covered with setaceous hairs.
