simpleMeaning: not hurt or changed by the pull of a magnet and not made into a magnet itself
scope: A thing not changed by a magnet's pull and not made into a magnet, not a magnet itself and not
  a metal that a magnet picks up.
examples:
- His antimagnetic watch still kept good time after he held it near a strong magnet.
- The antimagnetic case kept the compass needle steady near the engine.
