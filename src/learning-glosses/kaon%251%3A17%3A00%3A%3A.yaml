simpleMeaning: An unstable meson formed when particles collide at high energy.
scope: 'Also called k-meson and kappa-meson: a short-lived bit of matter made when tiny bits crash at
  great speed, not a stable bit of matter.'
examples:
- A kaon formed when the two particles collided at high energy.
- The kaon broke apart soon after it was made.
