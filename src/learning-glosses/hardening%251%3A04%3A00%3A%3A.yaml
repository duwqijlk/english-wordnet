simpleMeaning: Making a thing harder, so that it is firmer, tighter, or pressed together more
scope: The act of making a thing harder; not the change in body tissue that is not normal, and not a thing
  becoming hard as it cools, dries, or turns solid.
examples:
- He used a special heat treatment for the hardening of the steel tools.
- She worked on the hardening of the leather by pressing and treating it.
