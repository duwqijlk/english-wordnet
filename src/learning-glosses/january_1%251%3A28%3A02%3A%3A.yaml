simpleMeaning: In the Roman Catholic and Anglican churches, a feast day marking the circumcision of Jesus,
  kept on the first day of the year
scope: A feast day marking the circumcision of Jesus; Circumcision and Feast of the Circumcision are other
  names for this sense, not a holy day of obligation in general or a civil New Year holiday.
examples:
- January 1 marks the feast of the Circumcision in both churches.
- On January 1 the church keeps the feast of the Circumcision.
