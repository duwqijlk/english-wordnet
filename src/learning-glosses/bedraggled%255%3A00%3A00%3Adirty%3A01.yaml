senseId: bedraggled%5:00:00:dirty:01
synsetId: 00421806-s
simpleMeaning: not stiff and hanging down, and dirty, as if dragged in the mud
scope: Another name for this is draggled. It is about being dirty and hanging down, as if pulled through
  mud, not just being wet or old.
examples:
- The beggar's bedraggled clothes hung on him in the rain.
- After the long walk in the storm, her bedraggled skirt was covered in mud.
