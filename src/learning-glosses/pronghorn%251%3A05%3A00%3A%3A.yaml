simpleMeaning: The flat grasslands of the west of North America hold a fast deer-like animal that chews
  its food twice and carries small forked growths on its head.
scope: Also called prongbuck and pronghorn antelope, this is the fast deer-like animal of the western
  plains, not a true antelope.
examples:
- The pronghorn crossed the flat grassland.
- A pronghorn stood on the flat grassland.
