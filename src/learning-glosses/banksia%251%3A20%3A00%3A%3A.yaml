simpleMeaning: A shrub or tree of a genus, a related plant group, with leathery leaves spaced alternately,
  petal-less yellow flowers often in showy clusters, and cone-shaped fruit holding winged seeds.
scope: The whole shrub or tree; not merely its showy flower spike or its cone-shaped fruit.
examples:
- A banksia in the garden had yellow flower spikes.
- Banksias hold their seeds in woody cones.
