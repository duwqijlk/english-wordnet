simpleMeaning: a long, narrow stretch of water made by people for boats to travel on or for taking water
  to fields
scope: This is a waterway made by people for boats or for fields, not a tube inside the body and not a
  mark once thought to be seen on Mars.
examples:
- Boats travelled slowly along the canal between the fields.
- Farmers use this canal to bring water to their land.
