simpleMeaning: Firm and strong, so it is hard to cut through or chew.
scope: This sense is about a material or food that is hard to cut or chew, not about a task that is mentally
  demanding or a person who feels unwell.
examples:
- The steak was so tough that my knife could barely cut it.
- The bread had gone stale and was tough to chew.
