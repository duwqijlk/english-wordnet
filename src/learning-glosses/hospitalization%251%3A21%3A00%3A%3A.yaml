simpleMeaning: A plan that pays for some or all of a patient's costs in hospital
scope: A plan that pays hospital costs, not the act of putting someone in hospital, not a stay in hospital,
  and not the state of being treated there.
examples:
- Her hospitalization covered the whole bill.
- Good hospitalization saved the family a large sum.
