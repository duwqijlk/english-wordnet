senseId: 'flexibly%4:02:00::'
synsetId: 00343029-r
simpleMeaning: In a way that can change easily to fit what is needed
scope: This is acting in a way that can change easily to fit what is needed; it is not bending a thing
  with the hands and not giving in to every wish.
examples:
- She arranged the meeting flexibly so everyone could come.
- The plan was set flexibly, and the date could move.
