senseId: 'synapse%1:08:00::'
synsetId: 05481580-n
simpleMeaning: the join between two nerve cells, where the long part of one cell meets the short parts
  of the next, or between a nerve cell and a muscle
scope: This is the join point where nerve signals pass in the body, not a nerve cell itself and not a
  muscle.
examples:
- Signals pass across a synapse from one nerve cell to the next.
- Damage at a synapse can stop a signal from reaching a muscle.
