senseId: 'coronary%1:26:00::'
synsetId: 14126313-n
simpleMeaning: a block in the flow of blood in an artery (a tube that carries blood) to the heart, caused
  by a clot of blood
scope: Also called coronary thrombosis. It is a blocked blood vessel to the heart, not the word that describes
  blood vessels round the heart like a crown.
examples:
- The doctor said the chest pain was caused by a coronary.
- A coronary can stop blood from reaching part of the heart.
