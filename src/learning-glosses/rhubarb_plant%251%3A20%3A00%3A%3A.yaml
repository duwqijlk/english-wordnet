simpleMeaning: plants with long green or reddish sour leaf stalks in clumps at the base; only the stalks
  are safe to eat when cooked, and the leaves are poisonous
scope: Also called rhubarb; the whole garden plant, not just the stalks that are cooked and eaten.
examples:
- The rhubarb plant in the garden had long red stalks.
- She warned the children that the rhubarb plant's leaves are poisonous.
