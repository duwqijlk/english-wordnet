senseId: 'stalking-horse%1:10:00::'
synsetId: 06772487-n
simpleMeaning: a thing that hides a real plan, or a made-up reason used to hide the true reason
scope: 'Also called a pretext: a thing or reason that hides what is really planned, not the real reason
  itself.'
examples:
- The new rule was just a stalking-horse to hide the real plan.
- He used the offer as a stalking-horse while he worked on his own deal.
