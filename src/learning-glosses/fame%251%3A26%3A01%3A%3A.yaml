simpleMeaning: the state of being praised and respected by many people
scope: 'Also called celebrity and renown: this is the state of being praised and respected by many people,
  not a person who is known in this way.'
examples:
- Her fame grew after her book won a big prize.
- He found fame as a singer, and people in many towns praised his songs and respected him.
