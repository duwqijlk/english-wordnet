scope: Also called coast boykinia or Boykinia elata; a plant of western North America with low leaves
  and small white flowers, not a tall tree.
examples:
- Boykinia occidentalis grew beside the stream in the hills.
- Boykinia occidentalis has small white flowers in open branching groups.
