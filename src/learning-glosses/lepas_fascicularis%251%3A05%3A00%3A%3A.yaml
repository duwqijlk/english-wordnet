simpleMeaning: A barnacle with a stalk that fastens itself to the bottoms of ships or to floating wood
scope: A barnacle with a stalk, also called goose barnacle and gooseneck barnacle; not a barnacle that
  sits flat on rock and not a barnacle of the shore.
examples:
- Lepas fascicularis clung to the bottom of the old ship.
- We found Lepas fascicularis on a floating log.
