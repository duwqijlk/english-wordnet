simpleMeaning: The nitrogen bit inside a molecule of a sharp-smelling gas shakes, and this timekeeper
  works from the rate of that shaking.
scope: This timekeeper works from the shaking of a nitrogen atom in a gas molecule, and is not an ordinary
  clock.
examples:
- The ammonia clock kept time by the shaking atom.
- An ammonia clock runs on the shake of nitrogen.
