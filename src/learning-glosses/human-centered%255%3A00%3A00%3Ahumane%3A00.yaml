simpleMeaning: It puts the good of people first, and cares about what helps them live well
scope: Also called human-centred, humanitarian, humanistic and humanist, it puts the good of people first,
  not the good of machines or money.
examples:
- The human-centered policy freed prisoners for the sake of their well-being.
- Her human-centered approach treated every member of staff with care.
