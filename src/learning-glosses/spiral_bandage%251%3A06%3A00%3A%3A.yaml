simpleMeaning: a long strip of cloth wound slantwise, with each new turn laid over the one before
scope: A long strip of cloth wound slantwise; not a straight wrap and not a sticky plaster.
examples:
- The nurse put a spiral bandage round his arm after the fall.
- Each turn of the spiral bandage lay over the one before it.
