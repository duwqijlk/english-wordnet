simpleMeaning: It stops the growth of germs that need the food stuff PABA to live, one of several man-made
  carbon mixes used as a medicine against germs.
scope: 'Also called sulfa, sulfonamide, and sulpha: a medicine that stops the growth of germs that need
  PABA to live.'
examples:
- The doctor gave her a sulfa drug to stop the germs from growing.
- The sulfa drug stopped the germs from growing.
