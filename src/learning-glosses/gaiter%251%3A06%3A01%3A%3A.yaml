simpleMeaning: A legging of cloth or leather, covering the leg from the knee to the ankle.
scope: A legging of cloth or leather, covering the leg from the knee to the ankle; not a cloth cover,
  a legging, that covers the instep and ankles, nor a shoe covering the ankle, with stretchy bits in the
  sides.
examples:
- Their gaiter covered the leg.
- The gaiter was worn at dawn.
