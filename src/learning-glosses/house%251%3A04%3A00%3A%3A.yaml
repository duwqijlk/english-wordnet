simpleMeaning: A game in which children play the parts of parents or children and pretend to act like
  adults.
scope: This is not a building that people live in and not a real household; it is only the children's
  pretend game.
examples:
- The children spent the whole afternoon playing house in the garden.
- In their game of house, she was the mother and he was the father.
