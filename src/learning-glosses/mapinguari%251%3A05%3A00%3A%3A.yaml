simpleMeaning: People of the Amazon rain forest say they have seen a creature the size of a person, much
  like a sloth, but no one knows it is real.
scope: This is a supposed creature of the Amazon rain forest, the size of a person and much like a sloth,
  not an animal known to be real.
examples:
- Stories tell of a mapinguari in the Amazon rain forest.
- The mapinguari was said to be as tall as a person.
