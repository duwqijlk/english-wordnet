simpleMeaning: A potassium salt with the formula KCl, sold under several brand names and taken as tablets
  to treat low potassium levels.
scope: Another name for this compound is potassium chloride, and it is also called potassium muriate;
  it is a potassium salt, not table salt or another salt such as potassium citrate.
examples:
- The pharmacist explained that potash muriate was the potassium salt in his tablets.
- Her doctor recommended potash muriate tablets to raise her low potassium levels.
