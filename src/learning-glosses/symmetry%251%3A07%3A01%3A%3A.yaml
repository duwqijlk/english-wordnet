simpleMeaning: In physics, the quality of being the same in all directions, with the same value when measured
  in any direction
scope: In physics, being the same in all directions, not a shape that looks the same on both sides and
  not balance.
examples:
- The symmetry of the crystal meant it behaved the same in all directions.
- Physicists prize the symmetry of the laws of nature.
