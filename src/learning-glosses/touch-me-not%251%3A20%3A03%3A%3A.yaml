synsetId: 11775788-n
simpleMeaning: A low shrub from tropical America and Australia, flat or half-upright, with backward-curving
  thorns and soft grey-green leaflets that close and droop when handled, chilled or after dark.
scope: The thorny tropical shrub, not the annual touch-me-not of wet ground with orange or yellow flowers
  and not the Mediterranean vine whose ripe fruit shoots out seeds and juice when disturbed.
examples:
- The touch-me-not in the corner of the greenhouse folds its leaves at night.
- He planted touch-me-not along the fence, where its thorns keep visitors back.
