simpleMeaning: a list of the names and numbers of people who can be called, set out in letter order
scope: A list of the names and numbers of people who use the telephone, set out in letter order; phonebook,
  telephone book and telephone directory are other names for this sense, not a book of names without numbers
  and not a list of firms only.
examples:
- She looked up his number in the phone book.
- The phone book lists every telephone user in the town in letter order.
