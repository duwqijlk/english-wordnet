simpleMeaning: In logic, the study by set rules of how true ends follow from things taken as true, and
  of the words and signs that make such thinking work.
scope: This branch of logic works out, by set rules, what must follow from things taken as true.
examples:
- Aristotelian syllogistic became known as categorical syllogistic.
- In class we worked through a piece of syllogistic to see if the end had to follow.
