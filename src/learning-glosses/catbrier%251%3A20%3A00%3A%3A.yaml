simpleMeaning: A very thorny vine from the eastern United States that forms dense tangles, with tough
  round stems, glossy leathery leaves, green flowers and clusters of shiny black inedible berries.
scope: Another name for the eastern US thorny vine also called briar, brier or bullbrier; not the wild
  rose, nor the smoking pipe that briar can also mean.
examples:
- Catbrier sprawled across the path and snagged our sleeves.
- The catbrier's greenish flowers open in late summer.
