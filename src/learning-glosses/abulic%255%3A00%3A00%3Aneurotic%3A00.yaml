simpleMeaning: not able to act or make up one's mind, as a health problem that takes away the power to
  choose
scope: This is being unable to act or decide because of a health problem; aboulic is another name for
  this sense, not being lazy and not being unsure for a short time.
examples:
- The abulic patient could not choose between the two treatments.
- His abulic state left him unable to start even a small task.
