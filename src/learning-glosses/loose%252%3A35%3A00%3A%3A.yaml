simpleMeaning: To set something free from control or from being held back.
scope: This is setting a thing or force free from restraint, also called unleash or let loose, not granting
  a person freedom from prison and not the adjective for having escaped.
examples:
- They loosed the hounds and the chase began.
- The new policy loosed a wave of protests across the country.
