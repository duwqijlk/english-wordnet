simpleMeaning: a person whose job is digging holes in the ground where dead people are put
scope: This is the worker who digs the hole for a dead person to be put in. It is not the person who leads
  the funeral and not a person who digs holes for other work.
examples:
- The gravedigger opened a new grave before the funeral.
- Two gravediggers worked in the rain that morning.
