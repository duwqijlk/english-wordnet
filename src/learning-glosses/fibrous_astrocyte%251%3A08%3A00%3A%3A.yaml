simpleMeaning: In the pale tissue of the brain and the cord of nerves down the back, cells shaped like
  stars have long thin arms that reach out
scope: Star-shaped cells in the pale tissue of the brain and the cord down the back, not round blood cells
  and not nerve cells that carry signals.
examples:
- A fibrous astrocyte has long arms that reach out from its star-shaped body.
- Fibrous astrocytes are found in the white matter of the brain.
