simpleMeaning: the way a person's voice shows that something must be done at once
scope: An urgent tone of voice, not the clear edge of a picture or idea; edge is another name for this
  sense.
examples:
- There was a sharpness in her voice that made everyone listen.
- His voice had a sharpness to it when he gave the order.
