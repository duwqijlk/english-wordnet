simpleMeaning: a female person with special training who works on a ship that carries goods
scope: This is a trained female person who works on a trading ship, also called able-bodied seawoman;
  not a person in the navy and not a worker on a ship with no special training.
examples:
- The able seawoman took the wheel while the captain rested.
- An able seawoman must learn to work the sails and the ropes.
