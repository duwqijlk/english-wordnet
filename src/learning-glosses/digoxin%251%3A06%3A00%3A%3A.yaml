simpleMeaning: A digitalis dose, sold as Lanoxin, used to treat heart failure where fluid builds up, or
  an uneven heart beat, helping the heart beat harder.
scope: A digitalis preparation, trade name Lanoxin, for heart failure or arrhythmia.
examples:
- Their digoxin steadied the heart.
- The digoxin was given at noon.
