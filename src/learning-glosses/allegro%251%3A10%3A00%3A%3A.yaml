simpleMeaning: Music played at a brisk, lively pace, whether a whole piece or just one passage of it
scope: The word names a fast, lively piece of music, or such a passage within a longer piece.
examples:
- The orchestra played the allegro with great speed.
- She played the allegro at a brisk pace.
