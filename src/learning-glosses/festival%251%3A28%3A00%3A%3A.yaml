simpleMeaning: A day or period set aside for eating, drinking, and celebrating.
scope: This is the occasion marked by feasting; it is not an organized programme of performances.
examples:
- During the festival, families share large meals and exchange gifts.
- The festival is a time for feasting and dancing in the streets.
