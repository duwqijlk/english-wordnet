senseId: 'prate%1:10:00::'
synsetId: 07151837-n
simpleMeaning: Empty talk that is silly and has nothing to do with the matter at hand.
scope: 'Also called prattle, and another name for it is blether: empty talk that is silly and has nothing
  to do with the matter at hand, not the act of speaking fast and without a break about small matters.'
examples:
- His prate bored the whole room.
- She had no time for such prate.
