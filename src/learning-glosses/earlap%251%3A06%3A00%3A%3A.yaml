simpleMeaning: A flap fixed to a cap, one of a pair, that keeps the hearing parts of the head warm
scope: 'Also called earflap: a flap fixed to a cap, one of a pair, that keeps the hearing parts of the
  head warm, not the top of the cap and not a scarf.'
examples:
- He pulled the earlaps of his cap down against the cold wind.
- Her cap had earlaps that covered her ears in the snow.
