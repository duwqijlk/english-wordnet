simpleMeaning: the feeling you get in your nose when certain chemicals in gas form reach the parts inside
  the nose that pick up smells
scope: 'Also called smell: this is the feeling in the nose from chemicals in the air. It is not a taste
  and not a sound.'
examples:
- The odor of roses filled the room.
- A strong odor came from the kitchen.
