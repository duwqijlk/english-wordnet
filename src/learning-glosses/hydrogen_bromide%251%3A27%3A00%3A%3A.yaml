simpleMeaning: a gas with no colour that makes a sour liquid when it is mixed with water
scope: A colourless gas that makes a sour liquid in water, not a liquid itself and not a gas with a colour.
examples:
- Hydrogen bromide was fed into the flask through a tube.
- When hydrogen bromide meets water, it forms an acid.
