simpleMeaning: like a ruler or rule with total power, where one person holds all power alone
scope: 'Also called authoritarian, tyrannical, despotic, dictatorial and tyrannic: about a ruler or government
  with total power, not about a proud person who bosses others around in daily life.'
examples:
- The country lived under autocratic rule for thirty years.
- An autocratic government does not let people choose their leaders.
