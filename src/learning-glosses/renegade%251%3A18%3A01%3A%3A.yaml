senseId: 'renegade%1:18:01::'
synsetId: 10026763-n
simpleMeaning: A person who turns against a cause, a faith, a party, a friend, or the like and leaves
  it.
scope: Also called a deserter, turncoat, ratter, apostate, or recreant, this is a person who leaves a
  cause or faith they once held, not someone who merely disagrees with it.
examples:
- The renegade left the party and joined its rivals.
- They called him a renegade for turning against his old friends.
