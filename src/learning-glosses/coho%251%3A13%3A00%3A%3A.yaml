simpleMeaning: the fatty pink flesh of a small salmon caught in the Pacific and the Great Lakes
scope: The fatty pink flesh of a small salmon caught in the Pacific and the Great Lakes; coho salmon,
  cohoe and silver salmon are other names for this, not the whole fish and not the flesh of a large salmon.
examples:
- We grilled coho for dinner.
- Coho has rich pink flesh.
