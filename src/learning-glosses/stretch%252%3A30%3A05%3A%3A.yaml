simpleMeaning: to widen the scope or meaning of something, often beyond what is fair or reasonable
scope: This is the figurative sense of widening the scope or meaning of something, often too far, not
  the physical senses of pulling something longer or opening it out to full length.
examples:
- Critics say the new law stretches the meaning of free speech.
- Waiting another hour really stretched my patience.
