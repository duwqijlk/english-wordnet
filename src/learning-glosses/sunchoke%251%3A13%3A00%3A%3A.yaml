simpleMeaning: the underground part of a sunflower plant, eaten raw or boiled, or cut thin and fried as
  Saratoga chips
scope: A sunflower tuber eaten as food, not the sunflower's flower head and not a potato.
examples:
- We dug up sunchokes and ate them raw.
- She sliced the sunchoke thin and fried it crisp.
