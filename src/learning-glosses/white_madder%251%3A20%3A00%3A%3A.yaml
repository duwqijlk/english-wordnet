simpleMeaning: Small pale flowers in wide loose bunches mark this herb, from Eurasia and now growing wild
  in North America.
scope: Also called false baby's breath, infant's-breath, white bedstraw, and wild madder, this Eurasian
  herb bears wide loose bunches of small pale flowers and now grows wild in North America.
examples:
- In North America, white madder grew wild.
- The white madder bore small pale flowers.
