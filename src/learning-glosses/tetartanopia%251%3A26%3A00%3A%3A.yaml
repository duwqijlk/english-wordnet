simpleMeaning: A kind of colour blindness in which yellow light is hard to see, so rare that some doubt
  it exists
scope: This is a rare form of colour blindness in which yellow light is hard to see, also called yellow-blindness;
  not ordinary colour blindness and not blindness to red or green.
examples:
- People with tetartanopia find yellow light hard to see.
- Tetartanopia is so rare that some experts doubt it exists.
