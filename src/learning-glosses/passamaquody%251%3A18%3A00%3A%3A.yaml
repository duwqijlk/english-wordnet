simpleMeaning: a person of the Algonquian people, kin to the Malecite, living in north-east Maine and
  New Brunswick
scope: 'Also called Passamaquoddy: a person of the Algonquian people of north-east Maine and New Brunswick,
  not a Malecite and not a person of another tribe.'
examples:
- The Passamaquody live in north-eastern Maine and New Brunswick.
- A Passamaquody woman is a member of the Algonquian people.
