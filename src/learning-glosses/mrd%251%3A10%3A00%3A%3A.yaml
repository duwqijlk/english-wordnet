simpleMeaning: A standard word book in a form a computer can read, with its words in letter order.
scope: Also called electronic dictionary and machine readable dictionary; a standard word book in a form
  a computer can read, not a printed word book and not other computer files.
examples:
- The MRD held the whole dictionary in computer form.
- She looked up the word in the MRD.
