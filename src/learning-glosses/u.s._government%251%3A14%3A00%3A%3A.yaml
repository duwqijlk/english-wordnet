simpleMeaning: The three arms of the federal rule of the United States that make laws, carry them out,
  and judge by them.
scope: The three arms of the federal rule of the United States, also called U.S., United States, United
  States government and US Government, not the rule of one state and not the rule of another land.
examples:
- The U.S. government has three arms.
- The U.S. government makes laws through Congress.
