simpleMeaning: Below the knee, a hard plate of armor guards the leg
scope: A hard plate of armor that guards the leg below the knee, also called a greave; not a plate for
  the arm and not a plate for the upper leg.
examples:
- The knight's jambeau covered his shin.
- He polished the jambeau before the tournament.
