simpleMeaning: An old name for the illness that comes from bad food, no longer used by scientists, once
  thought to come from eating harmful stuff in the food
scope: An old name for the illness that comes from bad food, no longer used by scientists and not a name
  doctors use today; ptomaine is another name for this sense.
examples:
- People once blamed ptomaine poisoning when food made them ill after a picnic.
- The old book used the words ptomaine poisoning for what we now call food poisoning.
