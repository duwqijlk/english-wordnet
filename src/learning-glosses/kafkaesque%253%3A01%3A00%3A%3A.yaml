simpleMeaning: Like the work of Franz Kafka, or in his way of writing.
scope: A word for a style like Franz Kafka's, among other words that name a writer's style, and it covers
  his books and anything done in that same way.
examples:
- The trial had a Kafkaesque feel, strange and without clear rules.
- The Kafkaesque world of the novel was full of strange rules.
