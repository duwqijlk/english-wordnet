simpleMeaning: a gym move that starts with the legs over the upper body, curves the back, swings the legs
  out and down, and pushes the chest up to come upright
scope: Also called upstart. This is a gym move for getting up to a standing position, not a short sleep
  and not the skin of a young animal.
examples:
- In the floor exercise, he did a kip and finished standing straight.
- The gymnast performed a kip, swinging her legs down and pushing her chest up.
