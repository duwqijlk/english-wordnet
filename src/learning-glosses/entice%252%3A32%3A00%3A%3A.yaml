schema: oewn-learning-gloss-v2
senseId: 'entice%2:32:00::'
synsetId: 00784574-v
simpleMeaning: To push a person to do a thing with promises or talk, often with promises that are not
  true or are too big
scope: To push a person to act with promises or talk; tempt and lure are other names for this sense, not
  to force someone to act.
examples:
- He tried to entice her into the shop with promises of free gifts.
- The seller enticed buyers with promises of low prices.
