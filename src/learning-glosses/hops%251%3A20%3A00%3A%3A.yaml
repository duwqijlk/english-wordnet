simpleMeaning: A perennial vine that twines upward, with heart-shaped leaves and flowers in cone-shaped
  spikes; brewers use its dried flowers to give beer its bitter taste.
scope: This is the same climbing brewing plant as 'hop', not a jump on one leg. 'Hop' is another name
  for the same plant.
examples:
- The hops in the upper field are ready for picking.
- Local breweries buy hops from farms in the valley.
