senseId: 'mellowing%1:22:00::'
synsetId: 13534425-n
simpleMeaning: The change by which a person or a thing grows softer and gentler in feel
scope: A change over time toward a soft, gentle feel; not the soft state itself and not the act of making
  something soft.
examples:
- Age brought a mellowing to his hard views.
- The mellowing of her voice showed she had forgiven him.
