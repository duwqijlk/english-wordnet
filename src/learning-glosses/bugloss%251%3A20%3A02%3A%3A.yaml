simpleMeaning: Now growing on its own in the United States, this wild plant found all over Europe has
  prickly leaves shaped like tongues and yellow flowers.
scope: Also called bitterweed, bristly oxtongue, and oxtongue, a wild European plant with yellow flowers,
  not the garden bugloss grown for its blue flowers.
examples:
- We saw bugloss with prickly leaves and yellow flowers.
- Bugloss now grows wild in the United States.
