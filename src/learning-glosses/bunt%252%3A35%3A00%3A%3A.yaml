simpleMeaning: to hit or push hard against someone or something
scope: 'Another name for this sense is butt: to hit or push hard against. Not the baseball act of hitting
  a ball lightly, and not the wheat disease or the fungus that harms wheat.'
examples:
- The goat bunted the gate with its head.
- He bunted his brother out of the way with his shoulder.
