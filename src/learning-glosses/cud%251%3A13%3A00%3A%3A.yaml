simpleMeaning: a small lump of something a person can chew, such as tobacco
scope: 'Also called chew, wad, plug, quid, and chaw: a small lump a person chews, such as tobacco. Not
  the partly eaten food that an animal brings back up to chew again.'
examples:
- He kept a cud of tobacco in his cheek.
- The man took out a fresh cud to chew.
