simpleMeaning: a part fitted to a weapon to stop it from firing
scope: 'Also called a safety catch: a part fitted to a weapon to stop it from firing, not the trigger
  and not a lock on a door.'
examples:
- She slid the safety lock on before handing over the pistol.
- The safety lock kept the gun from firing.
