simpleMeaning: a person who goes from place to place, with no fixed home and no way that others can see
  for them to live on
scope: 'Also called vagabond, drifter, and floater: a person with no fixed home or clear way to live,
  not the describing word for a life that keeps changing home or job.'
examples:
- A vagrant slept on a bench in the park.
- The police spoke to a vagrant who had no home and no job.
