senseId: 'differential_diagnosis%1:04:00::'
synsetId: 00154319-n
simpleMeaning: A step-by-step way of finding what is wrong by ruling out one illness after another when
  no single sign points to it, as with a headache.
scope: It is a step-by-step way of finding what is wrong when no single sign points to one illness, and
  is used when the signs fit more than one illness.
examples:
- The doctor used differential diagnosis to work out what was causing the headache.
- By differential diagnosis she ruled out one illness after another.
