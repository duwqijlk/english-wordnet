simpleMeaning: the quality of saying what you think clearly and directly, and not hiding your true thoughts
scope: 'Also called outspokenness: saying your thoughts in a clear, direct way, not lying and not staying
  silent about them.'
examples:
- I liked her frankness because she told me the truth about my work.
- His frankness about the problem helped us fix it fast.
