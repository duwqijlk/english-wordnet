simpleMeaning: The death of a limited part of the body caused by a blockage in its blood supply.
scope: This is the death of one small part of the body when its blood supply is cut off; infarct is another
  name for this sense, and it is not a general illness or an injury from outside.
examples:
- The infarction cut off blood to part of the heart.
- Doctors treated the infarction as an emergency.
