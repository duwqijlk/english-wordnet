simpleMeaning: treatment based on the idea that taking very large amounts of vitamins will stop or cure
  illnesses of the body or mind
scope: Treatment based on the idea that very large amounts of vitamins cure or stop illness; not ordinary
  vitamin pills, and not treatment with drugs.
examples:
- She tried megavitamin therapy, taking huge doses of vitamins in the hope of a cure.
- Megavitamin therapy rests on the idea that large doses of vitamins can cure illness.
