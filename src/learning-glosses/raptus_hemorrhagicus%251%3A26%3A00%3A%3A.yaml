simpleMeaning: A fit brought on by sudden heavy bleeding
scope: A fit brought on by sudden heavy bleeding, not a fit with no clear cause and not slow bleeding
  that causes no fit.
examples:
- The patient suffered a raptus hemorrhagicus after the injury.
- Doctors feared a raptus hemorrhagicus when the bleeding would not stop.
