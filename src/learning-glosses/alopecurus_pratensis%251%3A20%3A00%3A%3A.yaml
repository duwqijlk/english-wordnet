simpleMeaning: A thick, upright grass that lives for years, from the northern Old World, with silky flower
  spikes; grown widely for pasture and hay, and now growing wild in North America.
scope: Not timothy or ryegrass, other pasture grasses; also called meadow foxtail.
examples:
- Alopecurus pratensis grows thick in the meadow.
- The farmer sowed Alopecurus pratensis for hay.
