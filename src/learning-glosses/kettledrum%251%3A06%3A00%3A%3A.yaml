simpleMeaning: A large drum shaped like half a ball, made of brass or copper, hit to make music; its top
  skin can be made tighter or looser to change the sound
scope: Also called kettle, timpani, tympani and tympanum, this is a large drum made of brass or copper,
  not a pot for boiling water and not a small hand drum.
examples:
- The kettledrum boomed at the back of the orchestra.
- He tightened the skin of the kettledrum to make its sound higher.
