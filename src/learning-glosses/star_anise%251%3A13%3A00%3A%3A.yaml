simpleMeaning: A fruit or seed shaped with many sharp points and a sweet smell, used to give taste to
  food in Asia and as a cure
scope: Also called star aniseed, this fruit or seed gives taste to food in Asia and serves as a cure,
  and it is not the small tree that bears it.
examples:
- I put star anise in the soup.
- The soup got a sweet smell from star anise.
