simpleMeaning: In the skin most often, too much of the dark stuff that gives skin its colour builds up
  in the body
scope: A state where too much dark colouring stuff builds up in the body, most often in the skin, also
  called melanosis; not a single dark spot and not a tan.
examples:
- The doctor noted melanism in the skin where dark patches had formed.
- Melanism gave the black panther its dark fur.
