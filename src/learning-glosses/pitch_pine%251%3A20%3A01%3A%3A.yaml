simpleMeaning: Closely tied to the pond tree, this large tree with needles in sets of three grows in the
  east of the United States and southeast Canada.
scope: Also called northern pitch pine, this large tree with needles in sets of three grows in the east
  of the United States and southeast Canada, closely tied to the pond tree, not the southeastern tree
  with very long needles and twisted limbs.
examples:
- In the east of the United States, pitch pines grow.
- The pitch pine grew tall.
