synsetId: 06042702-n
simpleMeaning: A link between two measures in which a big value in one goes with a small value in the
  other, with a coefficient between 0 and -1.
scope: A link in which one thing grows as the other falls, also called an indirect correlation; not a
  link in which both grow together.
examples:
- The data showed a negative correlation between hours of sleep and cups of coffee.
- A negative correlation means that as one number rises, the other tends to fall.
