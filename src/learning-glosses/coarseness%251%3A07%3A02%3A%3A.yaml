simpleMeaning: The quality of being made up of rather large bits.
scope: Also called granularity, this is the quality of being made of rather large bits; not the looseness
  or roughness in the feel of cloth.
examples:
- The coarseness of the sand made it rough to touch.
- They judged the coarseness of the powder by its large grains.
