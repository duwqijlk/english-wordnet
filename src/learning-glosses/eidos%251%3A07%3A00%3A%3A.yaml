simpleMeaning: In anthropology, the way of thinking that marks a culture or a social group and sets it
  apart.
scope: In anthropology, the way of thinking that marks a culture or a social group, not its tools and
  not its customs.
examples:
- The eidos of the group shaped their art.
- Anthropologists study the eidos of each culture.
