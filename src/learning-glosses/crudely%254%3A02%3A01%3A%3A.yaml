schema: oewn-learning-gloss-v2
senseId: 'crudely%4:02:01::'
synsetId: 00275957-r
simpleMeaning: In a way that shows no skill, like work done by someone who does not know how to do it
  well
scope: 'Also called inexpertly and artlessly: done with no skill, not just in a rough, plain way that
  is not smooth or fine.'
examples:
- The small hut was crudely built and let the rain in.
- He crudely cut the wood, and the edges did not fit.
