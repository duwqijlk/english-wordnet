simpleMeaning: the position or place in society that belongs to a woman
scope: This is the place or position of a woman in society; it is not the sense that means the state of
  being a grown woman.
examples:
- Her writing shows what womanhood meant in her time and place.
- In that society, womanhood held a low place, with few rights for women.
