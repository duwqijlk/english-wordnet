simpleMeaning: in computer science, a small electromagnetic coil and metal rod used to record and read
  magnetic patterns on a disk
scope: This is the part of a disk drive that records and reads magnetic data, not the body part above
  the neck, not the person in charge, not the top or front of something, not the striking part of a tool,
  not the word that gives a grammatical unit its role, and not oral sex.
examples:
- The technician cleaned the read/write head with a special swab.
- A dirty head can cause errors when the disk is read.
