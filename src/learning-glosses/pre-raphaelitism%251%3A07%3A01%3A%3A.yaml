simpleMeaning: A movement against the art and writing of Victorian times, which set out to change them.
scope: This is a movement that set out to reform Victorian art and writing, not the art itself or a later
  art movement.
examples:
- Pre-Raphaelitism aimed to reform Victorian art.
- Pre-Raphaelitism in the United States peaked in the late 1850s.
