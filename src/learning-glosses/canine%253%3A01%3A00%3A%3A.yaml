simpleMeaning: to do with dogs and other animals in the same family group as dogs, or having the kind
  of traits those animals have
scope: About dogs and their family group, not the dog-like animal itself and not the sharp pointed tooth
  or anything to do with that tooth.
examples:
- Wolves and foxes share many canine traits with pet dogs.
- The vet studied canine health and the care of dogs.
