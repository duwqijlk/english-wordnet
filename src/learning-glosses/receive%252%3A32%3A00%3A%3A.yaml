simpleMeaning: To greet a guest or newcomer warmly when they arrive.
scope: This is greeting someone at the door or station when they arrive, not taking them into your home
  for a stay and not hosting a formal party.
examples:
- The mayor received the visiting delegation at the airport.
- She stood at the door to receive her guests as they arrived.
