simpleMeaning: Stuck on the body, this sticky pad with medicine in it lets a slow dose of the drug pass
  through into the blood
scope: Also called a transdermal patch, it is a sticky pad with medicine in it, stuck on the body so a
  slow dose passes into the blood.
examples:
- The skin patch was stuck on and let the medicine pass slowly into the blood.
- The skin patch stayed in place while the medicine passed into the blood.
