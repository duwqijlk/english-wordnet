simpleMeaning: to avoid possible bad results or punishment for doing something that was not allowed
scope: To avoid bad results for a forbidden act; escape, get away, get by and get off are other names
  for this sense, not stepping aboard a bus or train and not reaching a place after trouble.
examples:
- He got out of trouble by lying.
- She got out of paying the fine.
