simpleMeaning: a classroom where all the pupils of one grade, or part of one, meet at set times with a
  teacher who takes the register and deals with school business
scope: A classroom where pupils of one grade meet at set times with a teacher who takes the register,
  not an ordinary classroom for lessons and not a teacher's office.
examples:
- We meet in homeroom every morning before lessons.
- The homeroom teacher took the register and handed out notices.
