simpleMeaning: a tall tropical grass of southeast Asia with thick tough stalks made of joints, whose sap
  is a main source of sugar
scope: Also called sugarcane; a tall grass grown for its sugary sap, not the fresh canes chewed for juice
  and not a grain crop.
examples:
- Sugar cane grows tall in the hot fields.
- Workers cut the sugar cane and press out its sweet sap.
