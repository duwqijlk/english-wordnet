simpleMeaning: a person who knows a great deal about one or more fields that study the world by watching
  and testing
scope: This is a person who knows a great deal about one or more fields that study the world by watching
  and testing; it is not a student who is still learning the first steps, and it is not a worker who only
  fixes things with tools.
examples:
- The scientist studied the rocks for many years.
- A scientist told us how bees find their way home.
