simpleMeaning: Chemical compounds made of one atom of the element and four molecules of an element that
  forms salts with metals.
scope: Chemical compounds made of one atom of the element and four molecules of an element that forms
  salts with metals, not a single salt and not a mix of four metals.
examples:
- Carbon tetrahalide is made of one atom of the element and four molecules of another element.
- The lab made a carbon tetrahalide from the two elements.
