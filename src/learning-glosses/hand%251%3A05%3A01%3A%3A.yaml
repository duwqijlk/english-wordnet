simpleMeaning: the end part of a front leg or arm in some animals with a backbone, such as apes or kangaroos
scope: This is the end of an animal's front limb, not a clock pointer, a unit for measuring horses, or
  a round of applause.
examples:
- The chimpanzee picked up the nut with its hand and cracked it against a stone.
- A kangaroo's hand looks tiny next to its powerful hind legs.
