simpleMeaning: An upright shrub with large leaves of three leaflets and thick groups of yellow flowers
  followed by poisonous seeds, from Yugoslavia; sometimes put in the genus Cytisus.
scope: Also called Cytisus ramentaceus and Dalmatian laburnum; an upright shrub of Yugoslavia with yellow
  flowers in thick groups and poisonous seeds, sometimes placed in the genus Cytisus.
examples:
- Petteria ramentacea stood upright in the garden, covered with yellow flowers.
- The poisonous seeds of Petteria ramentacea followed its yellow flowers.
