simpleMeaning: a yearly climbing or bushy plant grown for the seeds or pods people eat
scope: A yearly climbing or bushy plant grown for its seeds or pods; common bean plant is another name
  for this sense; not a tree, and not a plant grown for its flowers.
examples:
- The common bean climbed up the poles in the garden.
- We picked the common bean pods before they grew tough.
