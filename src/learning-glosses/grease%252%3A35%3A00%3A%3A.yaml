simpleMeaning: to put thick oil or fat on the moving parts of a machine so that they turn or slide easily
scope: To put fat or oil on a machine part so it moves easily; not the thick fat or oil itself, which
  is the noun sense of the word.
examples:
- He greased the wheels of the old cart before the trip.
- She greased the chain on her bike so it would run well.
