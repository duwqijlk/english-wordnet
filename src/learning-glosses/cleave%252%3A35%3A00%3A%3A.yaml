simpleMeaning: to use a tool, such as a sharp one, to cut a thing apart
scope: 'Also called split and rive: to cut a thing apart with a tool, such as a sharp one, not to stick
  to something.'
examples:
- He used an axe to cleave the log in two.
- The cook will cleave the bone with a heavy knife.
