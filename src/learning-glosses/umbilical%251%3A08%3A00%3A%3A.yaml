senseId: 'umbilical%1:08:00::'
synsetId: 05528130-n
simpleMeaning: a soft, thin tube that joins an unborn baby to the part inside its mother that gives it
  food
scope: This names the tube joining an unborn baby to its mother, not the describing word for things linked
  to the belly button.
examples:
- The umbilical carries food to the unborn baby.
- Blood moves through the umbilical from the mother to her baby.
