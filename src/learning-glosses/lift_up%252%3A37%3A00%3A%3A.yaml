simpleMeaning: A person fills with glad feelings and hope for the days to come
scope: 'Another name for uplift, elate, intoxicate and pick up: to fill a person with glad feelings and
  hope, not to raise a thing in the air and not to pick a thing up from the ground.'
examples:
- Music can lift up your spirits on a grey day.
- Her kind words lifted him up after the bad news.
