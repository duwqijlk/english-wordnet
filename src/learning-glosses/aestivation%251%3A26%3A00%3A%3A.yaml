simpleMeaning: In zoology, a rest in summer when an animal stops moving or slows down, and in some animals
  its body works more slowly in a hot or dry spell
scope: A summer rest when an animal slows or stops moving; estivation is another name for this sense,
  not a winter rest and not the way flower parts are set in a bud.
examples:
- The snail spent the summer in aestivation, sealed in its shell.
- During aestivation the animal's body works more slowly until the rains come.
