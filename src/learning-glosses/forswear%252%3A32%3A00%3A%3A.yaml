simpleMeaning: To give up a belief you once held, saying so in a formal way, usually because you are pressed
  to do so.
scope: Also called retract, recant, or abjure; to give up a belief you once held, saying so in a formal
  way, usually under pressure.
examples:
- He was made to forswear his old faith before the court.
- She refused to forswear the beliefs she had held for years.
