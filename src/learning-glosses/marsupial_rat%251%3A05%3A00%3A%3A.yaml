simpleMeaning: Any of many small animals with pointed noses that eat insects; on the outside they look
  like small rodents, but they carry their young in a pouch
scope: 'Also called marsupial mouse and pouched mouse: a small pouch animal that eats insects, not a mouse
  or a rat.'
examples:
- A marsupial rat darted through the grass, its pointed nose sniffing for insects.
- The marsupial rat carries its young in a pouch, though it looks like a mouse.
