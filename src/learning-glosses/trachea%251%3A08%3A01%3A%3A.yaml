simpleMeaning: a thin-walled tube with rings of firm, bendable tissue that carries air you breathe in
  from the voice box to the two tubes into the lungs
scope: This is the tube in a person or animal that carries air to the lungs, also called the windpipe.
  It is not one of the small air tubes in insects and spiders.
examples:
- Air passes through the trachea on its way to the lungs.
- The doctor checked that nothing was blocking her trachea.
