simpleMeaning: A sharp metal point fixed to a shoe to stop the wearer slipping on ice when walking or
  going up.
scope: A sharp metal point fixed to a shoe to stop the wearer slipping on ice, also called climber, crampon
  and crampoon; not a spiked frame strapped to the boot for going up trees or poles.
examples:
- He fixed a climbing iron to each shoe before crossing the ice.
- The climbing iron kept her from slipping on the frozen path.
