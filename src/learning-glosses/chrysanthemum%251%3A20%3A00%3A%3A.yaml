simpleMeaning: Any of many long-lived herbs from the Old World with striking, brightly colored flower
  heads; widely grown in gardens.
scope: The whole plant, not a single bloom cut from it.
examples:
- Chrysanthemums grow along the back fence and return every autumn.
- The chrysanthemum by the shed grows taller each year.
