senseId: 'swanflower%1:20:00::'
synsetId: 12075542-n
simpleMeaning: any of several orchids of the group Cycnoches whose blooms stand in slim curving stalks
  shaped like a big white water bird's neck
scope: Also called a swan-flower, a swan-neck, a swan orchid, and a swanneck; an orchid whose blooms stand
  in slim curving stalks, not a swan and not a water lily.
examples:
- The swanflower opened its blooms in slender arching columns.
- A swanflower in bloom bends like the neck of a swan.
