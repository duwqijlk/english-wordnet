  pushing a long thin tool in through the back of the nose.
scope: This check looks inside the passages of the nose, through the front openings or with a long thin
  tool passed through the back of the nose.
examples:
- A rhinoscopy looked inside the passages of the nose.
- The rhinoscopy used a long thin tool passed through the back of the nose.
