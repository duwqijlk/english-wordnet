simpleMeaning: made with a flaw, so it falls short of the maker's standard
scope: A made thing that fails the maker's standard because of a flaw, not flawed goods for sale and not
  work at odd times.
examples:
- An irregular pair of jeans had one leg longer than the other.
- The irregular shirt had a crooked seam and failed the maker's check.
