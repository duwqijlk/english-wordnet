simpleMeaning: A person with haemophilia, whose blood will not stop flowing when they are cut.
scope: A person with haemophilia, whose blood will not stop flowing when they are cut, not a person who
  bleeds from a single wound.
examples:
- The bleeder had to be careful, since even a small cut could bleed for hours.
- Doctors warned the young bleeder to avoid rough games.
