simpleMeaning: A fungus with a whitish, often round cap, a white underside with small holes and a white
  middle stalk under cone trees; good to eat but not liked much
scope: A fungus with a whitish cap and a white stalk under cone trees; sheep polypore is another name
  for this sense, not other white-capped fungi that grow in open fields.
examples:
- Albatrellus ovinus grew under the pine trees.
- We found Albatrellus ovinus, but it is not a popular mushroom to eat.
