simpleMeaning: using only a small amount of alcohol or other drugs, or using none of them at all
scope: 'Also called dryness: using little or no alcohol or other drugs as a way of life, not just the
  state of not being drunk at one time.'
examples:
- Her sobriety means she drinks very little and never uses drugs.
- After years of heavy drinking, he chose sobriety and stopped using alcohol.
