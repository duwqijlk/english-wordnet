simpleMeaning: A short-lived bit of matter with a negative charge, the mirror twin of the small bit at
  the heart of an atom that carries a positive charge.
scope: The mirror twin of the bit at the heart of an atom, a bit of matter that does not last, goes by
  this name.
examples:
- In the lab, an antiproton lasted only a short time before it was gone.
- An antiproton does not last long, so the team had to work fast to study it.
