simpleMeaning: Strongly sweet-smelling, the inner bark of the tree Canella winterana flavours food and
  serves as a drink to make a person feel better.
scope: Also called canella and canella bark, it is the inner bark of the tree Canella winterana, strongly
  sweet-smelling, used to flavour food and as a drink to make a person feel better.
examples:
- The cook added white cinnamon to the stew for its sweet smell.
- Traders sold white cinnamon as a spice and a tonic.
