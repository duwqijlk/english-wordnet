simpleMeaning: A unit of heredity that fixes whether or not a given mark will show
scope: This is a unit of heredity that fixes whether or not a given mark will show, not a unit that makes
  the mark itself and not a mark that always shows.
examples:
- The gene for albinism is an epistatic gene.
- An epistatic gene fixes whether a given mark will show.
