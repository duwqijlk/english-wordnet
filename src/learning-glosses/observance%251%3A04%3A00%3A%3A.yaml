simpleMeaning: the act of watching something with care and taking time to look at it closely
scope: 'Also called observation: watching with care and taking a slow look, not following a law or custom.'
examples:
- His observance of the birds lasted all morning as he watched them quietly.
- Careful observance helped her notice the small change in the room.
