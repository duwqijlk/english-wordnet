simpleMeaning: A tree animal active at night, with a pouch for its young and a bare tail that can grip
  branches, found from southern North America to northern South America
scope: A night tree animal of the Americas, not the small furry Australian tree animal of the same name.
examples:
- The possum hung by its tail from the branch.
- At night a possum came down from the tree to look for food.
