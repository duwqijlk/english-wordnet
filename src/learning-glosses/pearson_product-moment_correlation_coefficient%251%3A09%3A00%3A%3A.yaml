senseId: 'pearson_product-moment_correlation_coefficient%1:09:00::'
synsetId: 06042957-n
simpleMeaning: The way most often used to work out a number that shows how closely two things change together
  in a straight-line way
scope: This is the most used way to work out the number; product-moment correlation coefficient is another
  name for this sense, and it is not a way that works for things that do not change in a straight line.
examples:
- The Pearson product-moment correlation coefficient gave a value of 0.9.
- She used the Pearson product-moment correlation coefficient to check the link between the two sets of
  scores.
