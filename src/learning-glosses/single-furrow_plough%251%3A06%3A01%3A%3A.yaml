simpleMeaning: One wheel runs in front and handles at the back let the person guiding it steer as it cuts
  one groove.
scope: Also called a single-furrow plow, it has one wheel in front and handles at the back for steering
  as it cuts one groove.
examples:
- A single horse pulled the single-furrow plough through the light soil.
- The single-furrow plough moved through the soil on one wheel, steered by the handles.
