simpleMeaning: Of, or to do with, or marked by, the near-tropics.
scope: This sense is also called subtropical, for being of, or to do with, or marked by, the near-tropics,
  unlike the sense for being like the warm lands by the tropics.
examples:
- The clime was subtropic, of the near-tropics.
- The land was subtropic, marked by the near-tropics.
