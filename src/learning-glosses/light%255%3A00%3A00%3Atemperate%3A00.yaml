simpleMeaning: Showing moderation in what you allow yourself to enjoy, taking only small amounts of food,
  drink or other pleasures.
scope: This is not food that is easy to digest or free of rich seasoning; it describes a person who takes
  only small amounts of what they enjoy.
examples:
- He is a light eater, so a small bowl of soup is enough for him.
- She has always been a light drinker and rarely finishes a single glass.
