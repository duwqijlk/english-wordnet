simpleMeaning: A person of a North American Indian people who live in the north of Baja California
scope: This is a person of a North American Indian people living in northern Baja California; Kiliwa is
  another name for this sense, not the Kiliwi tongue and not a person of another people of Baja California.
examples:
- The Kiliwi fisherman worked the waters of Baja California.
- Kiliwi families have lived in the north of the peninsula for many years.
