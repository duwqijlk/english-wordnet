simpleMeaning: a copy of the way a person looks, talks, or acts, done to show what they are like
scope: A copy of the way a person looks, talks, or acts, done to show what they are like, not a mark left
  by printing and not a pressed copy of teeth.
examples:
- She did a funny impression of the teacher.
- His impression of the singer made us all laugh.
