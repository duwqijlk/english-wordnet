synsetId: 08607357-n
simpleMeaning: On a map, a line that joins all the places where some measured thing has the same number
scope: On a map, a line joining places where a measured thing has the same number, also called isogram
  or isopleth; not a line showing a border and not a line showing a road.
examples:
- The isarithm on the weather map joined all the places with the same rainfall.
- She traced the isarithm to see where the temperature was the same.
