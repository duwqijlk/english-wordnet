simpleMeaning: A side-blown woodwind instrument made of metal or wood, held across the body and played
  by blowing over a hole at one end.
scope: Also called transverse flute, Boehm flute, and Western concert flute; a side-blown woodwind played
  across the body, unlike a recorder, which is blown from the end.
examples:
- She plays the C flute in the school band.
- The C flute is made of silver.
