senseId: 'predestinationist%1:18:00::'
synsetId: 10100277-n
simpleMeaning: A person who accepts the belief that their fate is fixed and that they have no power to
  change it.
scope: 'Another name for a fatalist, a determinist, or a predestinarian: a person who believes they cannot
  change what will happen; not someone who thinks the future is open, and not the adjective sense.'
examples:
- The predestinationist saw every event as already decided.
- She lived as a predestinationist, trusting that her path was set.
