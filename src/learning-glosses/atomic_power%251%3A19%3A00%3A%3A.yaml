simpleMeaning: the energy from splitting atoms, used to make electricity for homes and towns
scope: 'Also called nuclear power: energy from splitting atoms used to make electricity for homes and
  towns, not energy from burning coal and not energy from the sun.'
examples:
- The town gets much of its atomic power from the plant by the river.
- Atomic power lights homes across the whole region.
