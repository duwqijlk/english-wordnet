senseId: 'cumulative_preferred_stock%1:21:00::'
synsetId: 13357219-n
simpleMeaning: 'a missed payment on this kind of share is not lost: it is kept and owed until it is paid,
  and these shares are paid before others'
scope: Shares paid before other shares whose skipped payments stay owed, also called cumulative preferred,
  not ordinary shares and not a loan.
examples:
- He held cumulative preferred stock, and the missed payments were still owed to him.
- The firm paid the cumulative preferred stock holders before the ordinary shareholders.
