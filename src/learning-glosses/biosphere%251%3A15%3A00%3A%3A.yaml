simpleMeaning: all the parts of the surface and the air around the Earth, or around another planet, where
  living things live
scope: This is all the parts of a planet where living things live; it is not the whole planet itself and
  not one living thing on its own.
examples:
- Forests and oceans are both parts of the Earth's biosphere.
- Scientists study how changes in the biosphere affect living things everywhere.
