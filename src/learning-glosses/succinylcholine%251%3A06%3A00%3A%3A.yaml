simpleMeaning: During some operations, this drug loosens striped muscle, given with the drugs that put
  a person to sleep.
scope: This is a drug that loosens striped muscle during operations, not a drug that puts a person to
  sleep on its own.
examples:
- Succinylcholine was given with the drugs that put the patient to sleep.
- Succinylcholine loosened the striped muscle during the operation.
