simpleMeaning: high in pitch and piercing in sound
scope: This sense, also called shrill, describes a high, piercing sound, not a note raised by a half step
  and not something clearly defined to the eye or ear.
examples:
- A sharp cry came from the next room.
- The whistle gave a sharp blast.
