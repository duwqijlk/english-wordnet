senseId: 'attestation_report%1:04:00::'
synsetId: 00579191-n
simpleMeaning: A consulting service in which a CPA, a qualified accountant, gives a view on whether a
  written statement that is the responsibility of someone else can be trusted
scope: This is a consulting service in which a qualified accountant gives a view on whether a written
  statement that is the responsibility of someone else can be trusted; attestation service is another
  name for it, not a full check of a company's books and not legal advice.
examples:
- The firm asked for an attestation report on the charity's accounts.
- An attestation report gives a CPA's view on whether a written statement can be trusted.
