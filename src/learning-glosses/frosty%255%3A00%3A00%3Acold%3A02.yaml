simpleMeaning: a cold, unwelcoming look or way of speaking that shows you do not like someone and think
  little of them
scope: 'Also called frozen, icy, and frigid: a cold, unwelcoming manner that shows dislike, not the cold
  of winter weather and not a frozen surface.'
examples:
- She gave him a frosty look and turned away without a word.
- After the row, he got a frosty reception at the office.
