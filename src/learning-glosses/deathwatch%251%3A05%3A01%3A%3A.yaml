simpleMeaning: a small beetle that bores into wood and makes a ticking sound that many people take as
  a sign that a life would soon end
scope: This is a wood-boring beetle that ticks, also called deathwatch beetle; not the tiny wingless insect
  that harms books and not a beetle that eats crops.
examples:
- The deathwatch tapped in the old beam all night.
- People once feared the deathwatch because its ticking was thought to foretell a death in the house.
