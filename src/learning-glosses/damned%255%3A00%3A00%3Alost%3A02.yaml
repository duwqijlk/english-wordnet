simpleMeaning: in danger of being punished in Hell for ever
scope: 'Also called cursed, and another name for this sense is doomed: it means in danger of being punished
  in Hell for ever, not the people who are punished there and not a strong word used to add force to what
  someone says.'
examples:
- The story tells of damned souls who can never leave Hell.
- He feared he was damned and would be punished for ever.
