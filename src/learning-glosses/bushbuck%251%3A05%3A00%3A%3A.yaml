simpleMeaning: A wild animal like a deer, with white marks like the straps worn by a horse, and horns
  that twist
scope: A wild animal like a deer, with white marks and twisted horns; guib is another name for this sense,
  not a horse and not an animal with straight horns.
examples:
- The bushbuck stood still among the trees.
- White marks crossed the bushbuck's back like straps.
