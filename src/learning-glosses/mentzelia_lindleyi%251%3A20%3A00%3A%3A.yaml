simpleMeaning: A plant that lives for one year, grown most of all for its sweet-smelling golden flowers
  that open at night.
scope: Also called bartonia, this is a plant with flowers that open at night, not a plant with flowers
  that open by day.
examples:
- Mentzelia lindleyi opened its golden flowers at night.
- We grew Mentzelia lindleyi for its sweet-smelling flowers.
