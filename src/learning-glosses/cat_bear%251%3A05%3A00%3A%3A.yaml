simpleMeaning: Like a raccoon in looks, this red-brown meat-eater of Europe, Asia and Africa stands apart
  from the giant pandas in some lists of animal kinds.
scope: This animal is also called panda, bear cat, lesser panda and red panda, and it is not the giant
  panda itself.
examples:
- The cat bear slept curled up in a tree.
- A cat bear moved through the trees looking for food.
