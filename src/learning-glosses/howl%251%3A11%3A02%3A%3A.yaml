simpleMeaning: the sound a dog or a wolf makes when it cries out for a long time in a sad way
scope: This is the real long cry of a dog or a wolf itself, not a sound that only sounds like it, and
  not the verb senses about making such a sound.
examples:
- A wolf's howl rose from the dark woods.
- The dog lifted its head and gave a long howl.
