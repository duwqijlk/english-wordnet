senseId: 'neighborliness%1:07:00::'
synsetId: 04663408-n
simpleMeaning: The people who live near get kindness and help from someone with this way of being
scope: Kindness and help for the people who live near is what someone with this way of being shows, also
  called neighbourliness and good-neighborliness; not a cold way of keeping to oneself.
examples:
- Her neighborliness showed when she brought soup to the new family next door.
- The neighborliness of the street made the newcomers feel at home.
