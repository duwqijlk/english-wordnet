simpleMeaning: the part of medicine that studies the nervous system (the brain, the main cord in the back,
  and the nerves that carry messages in the body)
scope: This is the part of medicine that studies the nervous system, not the near twin branch that also
  covers illnesses of that system and not a single doctor treating a patient.
examples:
- She is studying neurology at university.
- His research in neurology looks at how nerves carry messages in the body.
