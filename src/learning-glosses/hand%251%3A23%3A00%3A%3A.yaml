simpleMeaning: a unit of length equal to four inches, used for measuring horses
scope: This is a measurement of length, not a body part, a clock pointer, or a round of applause.
examples:
- The pony is only eleven hands high, so it is a good size for children.
- The vet noted that the mare had grown two hands since last year.
