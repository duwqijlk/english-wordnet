simpleMeaning: leaking urine when pressure you do not mean to put on the bladder comes from a cough, a
  laugh, a sneeze, lifting, or straining
scope: Leaking urine when pressure you do not mean to put on the bladder presses on it, not leaking all
  the time and not an infection of the bladder.
examples:
- She has stress incontinence and leaks a little when she coughs.
- Lifting the box made her stress incontinence worse.
