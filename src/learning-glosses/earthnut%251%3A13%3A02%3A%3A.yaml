simpleMeaning: A pod of the peanut vine, usually with a pair of kernels, called groundnut and monkey nut
  in Britain.
scope: This sense is also called peanut, goober, goober pea, groundnut, and monkey nut, a pod of the peanut
  vine, usually with a pair of kernels, called groundnut and monkey nut in Britain, where peanut is a
  pod of a vine, a thin long case for seeds, usually with a pair of kernels, known in Britain as groundnut
  and monkey nut, unlike the sense for a common European plant having eatable tubers with the taste of
  roasted chestnuts, unlike the sense for an eatable underground fungus of the genus Tuber, and unlike
  the sense for any of various highly prized eatable underground fungi of the genus Tuber, growing wild
  in southwest Europe.
examples:
- Earthnuts hold a pair of kernels.
- The earthnut is called groundnut in Britain.
