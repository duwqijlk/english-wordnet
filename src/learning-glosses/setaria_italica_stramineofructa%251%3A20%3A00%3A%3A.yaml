simpleMeaning: A millet whose grains are yellow and grow in big spikes that hang down.
scope: German millet and golden wonder millet are other names for this sense, a yellow-grained millet
  with hanging spikes, not common foxtail millet and not a millet with pale grains.
examples:
- Setaria italica stramineofructa is a millet with yellow grains.
- The farmer grew Setaria italica stramineofructa, whose large spikes droop.
