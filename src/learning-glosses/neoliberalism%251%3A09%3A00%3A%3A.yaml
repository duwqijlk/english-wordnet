simpleMeaning: A way of thinking in politics that began in the 1960s, mixing free political ideas with
  a stress on growth of the economy.
scope: A way of thinking in politics from the 1960s that mixes free political ideas with a stress on growth
  of the economy, not a call for state control of business.
examples:
- Neoliberalism mixes free political ideas with a stress on growth of the economy.
- Neoliberalism began in the 1960s, when free political ideas were mixed with a stress on growth of the
  economy.
