simpleMeaning: an activity that takes up your time and holds your thoughts, usually in a pleasant way
scope: This sense, also called interest, is a pleasant activity that takes up your time and holds your
  thoughts; it is not chasing someone to catch them, and not searching for another choice.
examples:
- Painting is her favourite pursuit on weekends.
- His pursuits include reading and playing chess in the evening.
