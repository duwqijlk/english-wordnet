simpleMeaning: the amount of a thing that the digging tool can hold at one time
scope: 'Also called shovel: this is the amount that fits in one load, not the tool used for digging.'
examples:
- He put a shovelful of soil into the pot.
- She added two shovelfuls of sand to the mix.
