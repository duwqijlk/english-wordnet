simpleMeaning: the condition of a material that does not flow when pushed with ordinary force, keeps its
  own size and shape, and holds up against being squeezed or bent.
scope: This is not a three-dimensional shape or object, and not a substance itself; it names the physical
  condition of a material that keeps its shape and resists pressure.
examples:
- The wax changes from a liquid to a solid as it cools.
- The gas turns directly into a solid at very low temperatures.
