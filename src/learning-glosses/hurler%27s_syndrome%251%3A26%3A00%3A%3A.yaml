simpleMeaning: A sickness passed down when both parents carry it, where the body errs in breaking down
  complex sugars; it causes grave faults in gristle and bone growth and slow learning.
scope: 'Also called dysostosis multiplex, gargoylism, lipochondrodystrophy, or Hurler''s disease: a sickness
  passed down in families, not a sickness caught from germs and not a bone break.'
examples:
- Hurler's syndrome runs in families.
- The child with Hurler's syndrome has slow learning.
