simpleMeaning: in a way that shows you believe a person is good, will not hurt you, and will do what they
  said they would do
scope: 'Also called trustfully: done in a way that shows belief in a person, not in a way that shows doubt
  or fear.'
examples:
- She looked at her father trustingly.
- The child took the man's hand trustingly.
