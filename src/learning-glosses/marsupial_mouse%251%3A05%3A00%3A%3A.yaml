simpleMeaning: A small sharp-nosed animal with a pouch that eats insects and only looks like a mouse or
  a rat
scope: Also called marsupial rat and pouched mouse; a small sharp-nosed pouch animal that eats insects
  and only looks like a mouse or a rat.
examples:
- The marsupial mouse hunted insects in the grass.
- A marsupial mouse looks like a mouse or a rat but carries its young in a pouch.
