simpleMeaning: A body stays still or keeps moving at the same speed in the same direction unless some
  outside force acts on it
scope: Also called the first law of motion and Newton's first law; a body stays still or keeps moving
  at the same speed in the same direction unless some outside force acts on it, unlike the second and
  third laws of motion.
examples:
- Newton's first law of motion says a body at rest stays at rest.
- The teacher showed Newton's first law of motion with a rolling ball.
