simpleMeaning: A group of medicines that work without blocking a body substance that breaks down brain
  chemicals, and are not three-ring medicines, lift low mood
scope: A group of medicines that lift low mood, not three-ring medicines and not working by blocking a
  body substance that breaks down brain chemicals, also called nontricyclic antidepressant, nontricyclic
  antidepressant drug and nontricyclic drug, and not a three-ring medicine or a medicine that works by
  blocking that body substance.
examples:
- The doctor prescribed a nontricyclic for her low mood.
- A nontricyclic lifted his mood without the side effects of the older drugs.
