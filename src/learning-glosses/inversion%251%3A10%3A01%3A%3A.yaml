senseId: 'inversion%1:10:01::'
synsetId: 07043661-n
simpleMeaning: In music, a tune or part changed so that notes that rise now fall, and notes that fall
  now rise.
scope: In music, this is a tune turned upside down, with rising notes made to fall and falling notes made
  to rise, not the turning of a chemical, an organ, genes, a gender role, or a layer of air.
examples:
- The composer used inversion to turn the theme upside down.
- In the second part, inversion makes the rising line fall.
