simpleMeaning: A pronoun or other short word that stands in for a word said before, and gets what it points
  to from that earlier word.
scope: Words of this kind stand in for one said before, taking what they point to from that earlier word.
examples:
- In 'Mary came in and she sat down', the word 'she' is an anaphor.
- The pronoun in the second sentence works as an anaphor for the name in the first.
