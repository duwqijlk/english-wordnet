simpleMeaning: to hold oneself back from a thing, above all from a pleasure one wants
scope: To hold oneself back from a thing, above all from a pleasure one wants, also called to deny; not
  to give a thing to someone else and not to forbid a thing to others.
examples:
- He abnegated wine and rich food.
- She chose to abnegate wine and spirits.
