simpleMeaning: a person who has the right to count as a British citizen by law, because a parent or grandparent
  was born there
scope: A person who has the right to count as a British citizen by law through a parent or grandparent,
  not a person born in Britain and not a visitor.
examples:
- As a patrial, she could live and work in Britain.
- His grandfather's birth made him a patrial.
