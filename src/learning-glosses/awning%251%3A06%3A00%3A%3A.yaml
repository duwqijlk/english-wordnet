simpleMeaning: a cloth cover made of canvas, hung up to keep rain or sun off people or things
scope: A cloth cover hung up to keep rain or sun off people or things, not a roof and not a tent.
examples:
- We sat under the awning of the cafe while it rained.
- The shop put up a striped awning to shade the window from the sun.
