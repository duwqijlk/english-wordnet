simpleMeaning: A British royal name given to the king Edward the Eighth after he gave up the throne.
scope: A British royal name given to the king Edward the Eighth after he gave up the throne, not a name
  he held while he was king.
examples:
- After he gave up the throne, he was called the Duke of Windsor.
- The Duke of Windsor lived abroad after his abdication.
