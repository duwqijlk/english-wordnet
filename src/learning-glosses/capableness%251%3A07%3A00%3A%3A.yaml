simpleMeaning: how far a person can do things, in body, in mind, or under the law
scope: 'Also called capability: how far someone can do things in body, mind or law, not a skill and not
  a task done.'
examples:
- His capableness surprised his teachers when he took on the hard work.
- The law limits the capableness of a child to sign a deal.
