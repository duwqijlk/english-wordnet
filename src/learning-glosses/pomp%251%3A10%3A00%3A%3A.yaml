simpleMeaning: a show that is cheap, or tries to look important, or shows too much pride
scope: This is a show that is cheap, or that tries to look important, not the real beauty and richness
  of a formal ceremony.
examples:
- For all his pomp, his long speech said nothing of any worth.
- Their pomp was just cheap gold paint and loud talk, with nothing real behind it.
