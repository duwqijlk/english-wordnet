simpleMeaning: A wild plant found all over Europe and now at home in the United States, with yellow flowers
  and long flat leaves edged with sharp points.
scope: Also called bitterweed, bugloss and oxtongue, this is a wide-spread European plant with yellow
  flowers and leaves edged with sharp points, now at home in the United States, unlike other prickly plants
  with yellow flowers.
examples:
- Bristly oxtongue shows yellow flowers and leaves edged with sharp points.
- We found bristly oxtongue growing wild, its yellow flowers open and its leaves edged with sharp points.
