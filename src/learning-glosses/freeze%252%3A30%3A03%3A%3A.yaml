simpleMeaning: to stop money or goods from being changed or used
scope: 'Also called block: to stop money or goods from being changed or used, not to stop a plan by putting
  a hold on it and not to make something turn to ice.'
examples:
- The court ordered a freeze on the firm's assets.
- The bank put a freeze on his money so he could not use it.
