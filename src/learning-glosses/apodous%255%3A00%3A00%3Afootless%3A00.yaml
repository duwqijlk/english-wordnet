simpleMeaning: having no feet by nature, said of snakes and eels
scope: 'Also called apodal: having no feet from birth, said of snakes and eels, not a creature that has
  lost its feet and not a legless lizard.'
examples:
- Eels are apodous and have no feet at all.
- The apodous snake slid along the ground on its belly.
