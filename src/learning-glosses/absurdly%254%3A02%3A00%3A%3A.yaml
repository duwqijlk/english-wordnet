simpleMeaning: in a way that makes no sense, or to a degree that makes no sense
scope: In a way, or to a degree, that makes no sense; not merely very much, but past what sense allows.
examples:
- She was absurdly rich, with more money than she could spend.
- The hat was absurdly large, covering his whole face.
