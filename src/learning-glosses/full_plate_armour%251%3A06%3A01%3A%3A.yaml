simpleMeaning: body covering from long ago, made of iron or steel sheets that wrap round the wearer from
  head to foot
scope: 'Also called full plate armor: an old body covering of metal sheets that wraps round the wearer,
  not a single metal breastplate and not modern battle gear.'
examples:
- The museum shows a full plate armour from the 1500s.
- She tried on a full plate armour at the fair.
