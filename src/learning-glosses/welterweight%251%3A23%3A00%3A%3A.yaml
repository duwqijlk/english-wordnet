simpleMeaning: A weight of 28 pounds, at times set as a handicap in a horse race, as in a steeplechase.
scope: This sense is a weight of 28 pounds, at times set as a handicap in a horse race, as in a steeplechase,
  unlike the sense for a weight class in fight sports, for fighters heavier than lightweights and lighter
  than middleweights, unlike the sense for an amateur boxer weighing no more than 148 pounds, unlike the
  sense for a professional boxer weighing between 141 and 147 pounds, and unlike the sense for a wrestler
  weighing 154 to 172 pounds.
examples:
- The welterweight of 28 pounds was set as a handicap.
- Welterweights handicap horses in the steeplechase.
