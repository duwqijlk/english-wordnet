simpleMeaning: a person who is calm and sure of themself, and who acts in a friendly way to make other
  people like them
scope: 'Also called charmer, and also called smoothy: a person who is sure of themself and acts in a friendly
  way so that other people like them, not the thick drink made from fruit.'
examples:
- The salesman was a smoothie who made everyone feel at ease and trust him at once.
- She is such a smoothie that she can talk her way into any group.
