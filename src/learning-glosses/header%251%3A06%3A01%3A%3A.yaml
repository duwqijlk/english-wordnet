simpleMeaning: a frame piece that lies across the ends of beams, upright posts, or roof beams, holds them
  up, and sends their weight to like pieces running the same way
scope: This is a frame piece that moves weight on to other frame pieces. It is not the beam that only
  finishes the top of a door or window, not a brick laid sideways in a wall, and not a line of words at
  the top of a page.
examples:
- In the floor frame, a header runs across the cut ends of the joists and sends their weight to the joists
  at the sides.
- The carpenter fitted a header between the two side studs so the ends of the shorter studs could rest
  on it.
