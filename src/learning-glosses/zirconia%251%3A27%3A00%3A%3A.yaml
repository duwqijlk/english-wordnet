simpleMeaning: A white crystal-like oxide, used in stuff that stands great heat, in padding that keeps
  heat in, in stuff that wears things smooth, and in shiny coats.
scope: Also called zirconium dioxide or zirconium oxide; a white crystal-like oxide used where great heat
  or a shiny coat is needed.
examples:
- Zirconia lines the furnace because it stands great heat.
- The pot's shiny coat was made with zirconia.
