simpleMeaning: Strong drink, preserves, and tea are kept in this pantry next to the kitchen, most of all
  in a large house, where tea and drinks are also made.
scope: Also called still room, it is a pantry next to the kitchen where tea and drinks are made and stores
  are kept.
examples:
- The stillroom smelled of tea and jam.
- He fetched a bottle from the stillroom.
