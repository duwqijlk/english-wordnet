simpleMeaning: to use one thing instead of another, when the new thing seems to be the same as the old
  one
scope: This sense means to put one thing where another was, also called exchange, replace and substitute;
  it is not a place where roads join, not a talk where people share facts, and not a swap of equal sums
  of money.
examples:
- You can interchange the two words without changing the meaning.
- They interchanged the parts to test the machine.
