simpleMeaning: A rare brain sickness, usually deadly, usually of middle age, brought on by a slow germ
  still unnamed; it brings a slow loss of mind and of muscle control.
scope: Also called Creutzfeldt-Jakob disease and Jakob-Creutzfeldt disease, this is a rare brain sickness
  that is usually deadly, not Alzheimer's disease.
examples:
- CJD is a rare brain disease that is often fatal.
- Doctors found CJD in a man of fifty.
