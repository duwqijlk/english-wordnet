simpleMeaning: Small creatures not divided into sections, with long round bodies pointed at both ends,
  mostly living free, though some live as parasites.
scope: Small creatures with long round bodies pointed at both ends, also called nematode and roundworm;
  not an earthworm and not a flatworm.
examples:
- The soil was full of tiny nematode worms.
- Some nematode worms live as parasites in plants and animals.
