simpleMeaning: From the note patterns of ancient Greece came a set of note patterns for old church songs,
  used until 1600.
scope: Church mode and medieval mode are other names for one of this set of note patterns for old church
  songs, used until 1600.
examples:
- The choir sang in an ecclesiastical mode.
- They sang the old song in an ecclesiastical mode.
