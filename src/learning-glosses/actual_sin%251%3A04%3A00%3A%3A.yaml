senseId: 'actual_sin%1:04:00::'
synsetId: 00758690-n
simpleMeaning: a wrong act that you choose to do yourself, unlike the wrong you are born with
scope: A wrong act a person chooses to do freely, not the wrong people are said to be born with and not
  a wrong done by mistake.
examples:
- He knew the actual sin was his own choice, not something forced on him.
- She confessed the actual sin she had committed of her own free will.
