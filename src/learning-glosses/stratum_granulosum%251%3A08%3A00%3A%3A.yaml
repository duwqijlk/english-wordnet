simpleMeaning: the skin layer just under the horny outer layer, or the clear layer on palms and soles;
  its cells, with grains you can see, die and move to the surface
scope: A layer of skin, not the outer horny layer and not the clear layer just below it on the palms and
  soles.
examples:
- The stratum granulosum lies just under the horny outer layer.
- Cells in the stratum granulosum die as they move toward the surface.
