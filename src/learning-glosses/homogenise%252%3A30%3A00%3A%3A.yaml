simpleMeaning: to become the same all through, or much alike, as by mixing
scope: To become the same all through, or much alike, by mixing; homogenize is another name for this sense;
  not to make things equal by mixing and not to stir only.
examples:
- The two liquids homogenised in the blender.
- Shake the bottle so the oil and water homogenise.
