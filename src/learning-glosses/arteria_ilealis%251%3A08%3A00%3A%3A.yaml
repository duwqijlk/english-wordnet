simpleMeaning: Blood reaches the last part of the small gut through a side blood tube from the upper one
  that feeds the gut.
scope: The ileal artery — also called the intestinal artery — is this side blood tube, which feeds the
  last part of the small gut.
examples:
- The arteria ilealis supplies the ileum.
- Blood reaches the last part of the small gut through the arteria ilealis.
