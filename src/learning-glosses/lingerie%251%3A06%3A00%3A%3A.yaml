simpleMeaning: clothes that women wear under their outer clothes, and clothes they wear for sleep
scope: This sense is women's underclothes and sleep clothes, not clothes women wear on the outside and
  not men's underclothes.
examples:
- She bought soft cotton lingerie at the shop.
- The drawer was full of lace lingerie and nightdresses.
