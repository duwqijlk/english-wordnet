senseId: 'investiture%1:04:00::'
synsetId: 00199768-n
simpleMeaning: a ceremony in which a person is dressed in the signs of a new office, and in this way is
  formally raised to that office or rank
scope: This is the ceremony that gives a person a new office or rank; investment is another name for this
  sense. It is not just the ceremony for putting a new king or queen in place.
examples:
- At his investiture, the new judge was given the robes of his office.
- The investiture of the new bishop took place in the large church.
