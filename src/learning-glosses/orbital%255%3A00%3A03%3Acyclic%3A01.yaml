simpleMeaning: Tracing the line of a circle, or going round in a circle.
scope: Also called circular or rotary, tracing the line of a circle, or going round in a circle; not the
  use for a thing to do with an orbit.
examples:
- The wheel's motion was orbital, turning in a full circle.
- The dancers' paths were orbital, circling the stage again and again.
