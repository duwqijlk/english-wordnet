simpleMeaning: A person feels cross and uneasy, most of all when small troubles keep coming, one after
  another
scope: Also called annoy, bother, chafe, devil, get to, gravel, irritate, nark, nettle, rag, rile and
  vex; to make a person cross with small troubles, not to make them very angry and not to tease them for
  fun.
examples:
- The noise from the road really gets at me when I try to sleep.
- His little jokes got at her all day.
