simpleMeaning: a kind of soft earth that soaks up and takes away the colour from oils
scope: Also called bleaching earth, this is a soft earth that takes colour out of oils, not a clay used
  to make pots and not a chemical that makes cloth white.
examples:
- The bleaching clay took the dark colour out of the oil.
- Workers mixed bleaching clay into the oil to make it clear.
