senseId: 'cordarone%1:06:00::'
synsetId: 02705163-n
simpleMeaning: A heart drug that steadies a badly irregular heartbeat and can have fatal side effects,
  used only when safer drugs have failed.
scope: This is a heart drug, also called amiodarone, not a drug for mild rhythm trouble or a first-choice
  heart drug.
examples:
- The doctor gave her Cordarone only after safer drugs had failed.
- Cordarone can cause fatal side effects.
