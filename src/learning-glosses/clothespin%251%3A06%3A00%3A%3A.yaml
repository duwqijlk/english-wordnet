simpleMeaning: a small thing made of wood or plastic that holds clothes on a line where they hang to dry
scope: This is a small clip for holding wet clothes on a line, not a pin for paper and not a pin for hair.
examples:
- She put a clothespin on each shirt hanging on the line.
- He used clothespins to hold the wet towels up.
