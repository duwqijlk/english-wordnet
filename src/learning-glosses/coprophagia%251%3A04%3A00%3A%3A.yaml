simpleMeaning: the act of eating waste from the body, which in a person is a sign of some kinds of madness
scope: This is eating waste from the body, which in a person is a sign of some kinds of madness; coprophagy
  is another name for this sense, and it is not eating dirt or a normal way to feed.
examples:
- The dog's coprophagia meant it kept eating its own waste.
- In a person, coprophagia is a sign of some kinds of madness.
