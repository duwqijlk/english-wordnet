senseId: 'guide_word%1:10:00::'
synsetId: 06302383-n
simpleMeaning: The first or last item on a page is named by a term printed at the top of the page in a
  book that lists what terms mean
scope: A printed term at the top of a page in a book of meanings, also called catchword and guideword,
  not a title and not a page number.
examples:
- The guide word at the top of the page told her where the entry for 'apple' would be.
- He looked at the guide word to see if 'zebra' was on that page.
