simpleMeaning: In Christianity, the act of controlling strong bodily desires by going without things you
  want or need, especially by causing pain or discomfort to your own body
scope: This is a religious act done to control bodily wants, not a feeling of deep shame and not the death
  of living cells in one part of the body.
examples:
- As a form of mortification, he slept on the cold floor and ate very little.
- Her mortification included fasting and wearing a rough shirt that hurt her skin.
