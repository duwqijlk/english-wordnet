simpleMeaning: A bush in the east of the United States with shining leaves that stay green all year and
  dark blue-black fruit.
scope: A bush in the east of the United States with shining leaves that stay green all year; not a tree
  and not a bush that loses its leaves in winter.
examples:
- Evergreen blueberries grow wild along the coast.
- The evergreen blueberry keeps its shining leaves through the winter.
