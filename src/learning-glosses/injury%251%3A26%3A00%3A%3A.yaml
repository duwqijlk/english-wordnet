simpleMeaning: physical harm done to the body by an accident, attack or broken bone, or the condition
  of being so harmed.
scope: This is not a wrong or injustice done to someone, and not a person who has been hurt; it is physical
  damage to the body or the condition that results.
examples:
- She suffered a serious injury to her knee during the match.
- The injury left him unable to walk for months.
