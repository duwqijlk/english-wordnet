simpleMeaning: A place where drinks with alcohol are poured and served across a long table
scope: 'Also called a bar, barroom, saloon, and taproom: a place where drinks with alcohol are served
  across a long table, not a shop that sells bottles to take home and not a room for eating meals.'
examples:
- He spent the evening at the ginmill.
- The old ginmill on the corner stays open late.
