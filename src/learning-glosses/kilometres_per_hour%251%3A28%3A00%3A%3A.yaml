simpleMeaning: How far a thing gets in sixty minutes, worked out from the length it covers and the time
  it takes
scope: A speed got by dividing the length covered by the time taken, with time counted in sixty-minute
  units; also called kilometers per hour, km/h and kph, not a speed counted in seconds.
examples:
- The train moved at 120 kilometres per hour.
- She drove at 80 kilometres per hour through the town.
