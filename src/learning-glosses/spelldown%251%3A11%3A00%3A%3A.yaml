simpleMeaning: a game in which players take turns saying the letters of a word, and a player leaves the
  game after one wrong word
scope: A game in which players say the letters of a word in turn and leave after one wrong word; also
  called spelling bee and spelling contest; not a written test and not a quiz about word meanings.
examples:
- The spelldown went on for an hour before only two pupils were left.
- She won the school spelldown after her rival missed a word.
