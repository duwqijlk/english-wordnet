simpleMeaning: A bird that climbs with strong claws and a stiff tail, and makes holes in wood for insects
  with its hard beak, pointed like a chisel (a cutting tool)
scope: 'Also called pecker and peckerwood: this is the bird that climbs trees and makes holes in wood
  for insects, not other tree birds that do not dig into wood.'
examples:
- A woodpecker hammered at the dead tree in search of insects.
- The woodpecker used its stiff tail to hold itself against the trunk.
