simpleMeaning: a set of organs or body parts that are alike in structure or function and work together.
scope: This sense is not the entire body as one whole and not a method or scheme; it is one set of related
  organs or parts.
examples:
- The digestive system breaks food into nutrients.
- Nerves carry signals through the nervous system.
