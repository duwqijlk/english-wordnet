simpleMeaning: the time when sea water comes in, from low water up to the next high water
scope: 'Also called a flood: the time when sea water comes in, not the time when it goes out and not a
  flood on land.'
examples:
- We set out at flood tide, when the water was still coming in.
- The boats wait for flood tide to leave the harbour.
