simpleMeaning: a colour-changing dye that tells whether a liquid is an acid or a base, useful when the
  pH, how acid it is, is between 6.0 and 7.6
scope: 'Also called bromothymol blue: a dye that tells whether a liquid is an acid or a base, not the
  bromophenol blue dye and not a dye for cloth.'
examples:
- The class used bromthymol blue in the test.
- Bromthymol blue stayed blue in the base liquid.
