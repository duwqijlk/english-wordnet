simpleMeaning: In Yiddish, a person who is not very clever, is shy, and has bad luck
scope: Also called nebbish, this is a shy, unlucky person of little sense, not a coward and not a fool
  who makes trouble for others.
examples:
- Poor nebbech, he lost his job again and had no idea what to do.
- They called him a nebbech because he was too shy to speak up.
