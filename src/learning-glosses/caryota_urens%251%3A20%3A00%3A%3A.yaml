simpleMeaning: A fishtail palm from India to the Malay Peninsula; its sap gives a brown sugar called jaggery,
  and the soft core of its trunk gives sago.
scope: A fishtail palm, also called a jaggery palm, kittul, kitul, a kitul tree, a toddy palm or a wine
  palm.
examples:
- The Caryota urens in the garden towered over the house.
- Workers tap the Caryota urens for sap to make jaggery.
