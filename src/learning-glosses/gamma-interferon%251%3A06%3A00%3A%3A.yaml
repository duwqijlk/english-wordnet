simpleMeaning: A kind of protein made by T cells and macrophages, white blood cells, which wakes up cells
  that eat germs.
scope: This is a kind of protein made by T cells and macrophages that wakes up cells that eat germs; not
  other kinds of this protein, and not an antibody that marks germs for attack.
examples:
- Gamma-interferon helps the body fight germs.
- The lab measured gamma-interferon in the blood sample.
