simpleMeaning: A chemical that cuts the long chains carrying a cell's plans at bonds inside them, making
  pieces of many sizes
scope: A chemical that cuts the long chains carrying a cell's plans at bonds inside them into pieces of
  many sizes, not one that cuts only at their ends.
examples:
- The endonuclease cut the DNA at several points inside the chain.
- Scientists used an endonuclease to break the long chain into pieces.
