simpleMeaning: A long-lived Eurasian herb smelling of tansy, with button-like yellow flowers; eaten as
  a cooked green or salad, sometimes used for potpourri, tea, or flavouring, sometimes put in that genus.
scope: 'Also called alecost, balsam herb, bible leaf, costmary, mint geranium, and Tanacetum balsamita:
  a scented herb, not a geranium, and not a true chrysanthemum.'
examples:
- Chrysanthemum balsamita scented the whole garden.
- We used Chrysanthemum balsamita leaves for tea.
