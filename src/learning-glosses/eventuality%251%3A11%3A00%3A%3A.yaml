simpleMeaning: a thing that may happen, or a result that may come from something
scope: A thing that may happen in the time to come, not a thing that has already happened and not a sure
  fact.
examples:
- We planned for every eventuality, even rain on the day of the walk.
- One eventuality they had not thought of was that the road might close.
