senseId: 'ozocerite%1:27:00::'
synsetId: 14689281-n
simpleMeaning: Where oil lies in the ground, this soft waxy mineral turns up, a mix of carbon and hydrogen;
  some kinds end up in candles and in a refined wax.
scope: A waxy mineral dug from the ground where oil is found; ader wax, earth wax, mineral wax and ozokerite
  are other names for this sense.
examples:
- They dug ozocerite from the ground where oil is found.
- Ozocerite can be used to make candles.
