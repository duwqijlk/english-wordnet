simpleMeaning: To give in to a strong urge to do something wrong, or to commit an act that breaks moral
  or religious law.
scope: This is about moral or religious wrongdoing; it is not a physical drop, a decrease in amount, or
  a defeat.
examples:
- The preacher warned that even good people can fall into sin.
- He had sworn off gambling, yet by Friday he had fallen back into his old sin.
