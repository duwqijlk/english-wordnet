simpleMeaning: a kind of protein made in lymph tissue in animals with backbones, which serves as a defender
  against sickness
scope: A kind of body protein that serves as a defender against sickness; immune gamma globulin, immune
  globulin and immunoglobulin are other names for this sense, not a single protein and not a drug that
  kills germs directly.
examples:
- The immune serum globulin in her blood fought the sickness.
- Doctors gave her immune serum globulin after the bite.
