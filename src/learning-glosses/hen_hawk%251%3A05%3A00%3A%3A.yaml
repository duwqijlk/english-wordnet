simpleMeaning: Any bird of prey that people say hunts chickens and other farm birds goes by this everyday
  name
scope: An everyday name for any bird of prey said to hunt farm birds, also called chicken hawk, not one
  kind of hawk and not a bird that only eats wild birds.
examples:
- The farmer blamed the hen hawk for the missing chickens.
- A hen hawk circled above the yard where the hens fed.
