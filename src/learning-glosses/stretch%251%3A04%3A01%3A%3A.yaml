senseId: 'stretch%1:04:01::'
synsetId: 00342069-n
simpleMeaning: The bodily act of putting your arm or hand out toward something.
scope: This is another name for the act of reaching out with your arm or hand; it is not the exercise
  sense of a stretch or the verb for extending your body.
examples:
- A long stretch over the table let her reach the salt.
- His stretch for the rope came up short.
