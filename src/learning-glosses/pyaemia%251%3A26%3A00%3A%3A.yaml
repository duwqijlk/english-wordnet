senseId: 'pyaemia%1:26:00::'
synsetId: 14214218-n
simpleMeaning: A bad blood illness that starts when germs that make pus escape from a sore lump
scope: This is blood made ill by pus-making germs that escape from a sore lump; pyemia is another name
  for this sense. Not a skin sore on its own and not a fever from a cold.
examples:
- The doctors said pyaemia had set in after the abscess burst.
- She was treated in hospital for pyaemia when the infection reached her blood.
