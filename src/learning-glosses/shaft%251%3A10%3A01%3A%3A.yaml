senseId: 'shaft%1:10:01::'
synsetId: 06780713-n
simpleMeaning: A sharp, hurtful thing said to a person, aimed at them like a thrown weapon to make them
  feel it.
scope: A sharp, hurtful remark aimed at a person, also called a shot, a dig, and a slam, not a long rod
  and not a turning rod in a machine.
examples:
- His parting shaft was a single cruel word.
- She threw a shaft of sarcasm at her brother.
