simpleMeaning: to cover something with something sweet, such as a hard layer made from sugar
scope: 'This sense is also called glaze: it is about putting a sweet layer on something, such as food.
  It is not about making a bad thing sound less bad in words.'
examples:
- She sugarcoated the nuts before putting them in a bowl.
- He sugarcoated the small cakes and left them to dry.
