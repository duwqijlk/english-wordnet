simpleMeaning: to turn sideways in a full circle, putting the hands on the ground and then the feet, one
  after the other
scope: This is the verb for doing this move, not the noun name for the move itself and not a wheel for
  a cart with wooden spokes and a metal rim.
examples:
- She cartwheeled across the grass in the park.
- The children cartwheeled down the small hill, laughing.
