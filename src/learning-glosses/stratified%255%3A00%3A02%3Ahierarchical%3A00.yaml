simpleMeaning: With its parts set in steps of grade or rank, one after another.
scope: Also called ranked or graded, with its parts set in steps of grade or rank, one after another,
  not laid down in level layers.
examples:
- The society was stratified, with clear ranks from top to bottom.
- Pay in the firm was stratified by grade and years of service.
