simpleMeaning: Used of the way a person acts or thinks when they treat others as if they were less important
scope: This is the way a person acts or thinks when they treat others as if they were less important;
  arch is another name for this sense, not simply being proud, and not looking down from a height.
examples:
- His condescending tone annoyed everyone in the room.
- She spoke in a condescending way, as if we knew nothing.
