simpleMeaning: Europe is home to this fast-spreading plant, which sends long stems creeping under the
  ground and now grows in North America as a weed.
scope: Also called couch grass, dog grass, quack grass, quackgrass, quick grass, and witchgrass, this
  is a fast-spreading plant of Europe, not the North American kind with slender brushy flower heads.
examples:
- Witch grass spread fast by stems under the ground.
- The witch grass in North America grows as a weed.
