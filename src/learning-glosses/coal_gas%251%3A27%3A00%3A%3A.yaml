simpleMeaning: A vapour that rises when black fuel is heated, caught and piped to rooms to warm them and
  light lamps.
scope: This is the gas that comes from heating black fuel, used for heat and light.
examples:
- Coal gas once lit the lamps in city streets.
- Coal gas heated the town's homes.
