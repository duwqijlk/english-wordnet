senseId: 'cylinder_lock%1:06:00::'
synsetId: 03161433-n
simpleMeaning: a lock whose round plug turns to move the bolt when a key lifts and lines up the pins
scope: A key-operated lock with a round plug and small pins; not a padlock, which is portable, and not
  a combination lock with dials.
examples:
- The door had a cylinder lock that took a flat key.
- He replaced the worn cylinder lock on the front door.
