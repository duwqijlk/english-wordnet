simpleMeaning: A sharp move of the hand, as if to hit something.
scope: A sharp hand move like a blow; poke, thrust, poking, thrusting and jab are other names for this
  sense, and it is not a real punch nor a push with the whole arm.
examples:
- He warned me with a jabbing motion of his finger.
- She made a jabbing gesture with her fist.
