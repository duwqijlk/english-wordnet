simpleMeaning: a part of a machine that pushes hard in one direction and then back again
scope: A part of a machine that pushes hard in one direction and then back again; not a pump, and not
  a rod that only turns.
examples:
- The piston moved up and down inside the engine's cylinder.
- Oil keeps the piston sliding smoothly in its tube.
