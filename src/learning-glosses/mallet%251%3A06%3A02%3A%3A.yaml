simpleMeaning: a tool used in games, with a long handle and a head like a hammer, used in polo or croquet
  to hit a ball
scope: This is the tool for hitting a ball in polo or croquet, not the light stick used to hit drums and
  other such instruments.
examples:
- He swung the mallet and sent the croquet ball through the hoop.
- The polo player raised her mallet to hit the ball.
