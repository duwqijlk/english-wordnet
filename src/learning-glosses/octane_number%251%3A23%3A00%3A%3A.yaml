simpleMeaning: How well fuel holds back the sharp knock that can come in an engine is what this score
  shows
scope: A score that shows how well fuel holds back the sharp knock that can come in an engine, also called
  octane rating; not a measure of how much power fuel gives and not the fuel itself.
examples:
- The octane number of this fuel is 95, so it holds back knocking well.
- A high octane number means the fuel resists knocking in a hot engine.
