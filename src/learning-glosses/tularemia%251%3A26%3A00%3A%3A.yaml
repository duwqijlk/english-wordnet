simpleMeaning: people at times catch a fast-spreading sickness from ticks, flies, or handling sick animals;
  it lives among rodents, above all rabbits and squirrels
scope: Also called deer fly fever, rabbit fever, tularaemia, and yatobyo; a sickness people at times catch
  from ticks or flies, not a sickness spread by food and not one found only in people.
examples:
- Tularemia broke out among the squirrels near the lake.
- Wear gloves when you handle dead rabbits, or you may catch tularemia.
