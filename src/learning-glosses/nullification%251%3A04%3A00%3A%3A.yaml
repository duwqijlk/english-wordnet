simpleMeaning: The act of undoing, making null and void, working against or overruling the force of a
  thing.
scope: The act of undoing, making null and void, working against or overruling the force of a thing; also
  called override; not the states'-rights teaching that a state may refuse to heed or enforce a federal
  law passed by the United States Congress.
examples:
- Their nullification voided the law.
- The nullification was done at dawn.
