simpleMeaning: a piece of computer software that finds faults in a machine or mistakes in other software
  and says what they are
scope: A piece of computer software that finds faults in a machine or mistakes in other software and says
  what they are; not the machine itself and not a person who fixes faults.
examples:
- The technician ran the diagnostic program to find why the printer kept stopping.
- Our diagnostic program found the mistake in the code and told us where it was.
