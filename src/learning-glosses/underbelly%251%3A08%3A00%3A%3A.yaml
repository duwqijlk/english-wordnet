simpleMeaning: the soft side of an animal that faces the ground, underneath its body
scope: The soft underside of an animal's body, not its back or top, and not the weak point of a plan or
  group.
examples:
- The dog rolled over and showed its underbelly.
- The otter's underbelly was pale and soft.
