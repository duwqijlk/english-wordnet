simpleMeaning: in a way that follows the rules or the law and has no cheating or other dishonest act
scope: 'Also called clean, and another name for it is fair: this means acting by the rules, not treating
  both sides in the same way.'
examples:
- They played fairly and won the game by the rules.
- He won fairly, without breaking any rules.
