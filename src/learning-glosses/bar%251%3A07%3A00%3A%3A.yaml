simpleMeaning: A thin band of contrasting colour or texture across a surface, like a stripe.
scope: This is the noun for a thin band of contrasting colour or texture, not the room or establishment
  where alcoholic drinks are served, not the counter where food or drink is bought, not a rigid piece
  of metal or wood used as a fastening or obstruction, not the musical notation for a repeating pattern
  of beats, not the crosspiece over a goal, not the act of preventing something, not the unit of pressure,
  not a ridge lying under water, not the body of lawyers, not a solid block such as soap, not the rod
  used in gymnastics, not a heating element in an electric fire, not the courtroom railing, not the verb
  sense for keeping someone out, not the verb sense for blocking passage, not the verb sense for expelling
  someone by decree, and not the verb sense for fastening with rods.
examples:
- The snake's skin was pale yellow with dark bars along its back.
- A red bar ran across the middle of the white flag.
