simpleMeaning: when the body's defence system goes wrong, it attacks the body's own flesh; this is one
  of a large group of such illnesses
scope: 'Also called autoimmune disease: an illness in which the body''s own defence system attacks the
  body itself, not an illness caught from germs or spread by them.'
examples:
- Lupus is an autoimmune disorder in which the body's defence system attacks healthy flesh.
- She lives with an autoimmune disorder, so her doctors watch how her defence system acts.
