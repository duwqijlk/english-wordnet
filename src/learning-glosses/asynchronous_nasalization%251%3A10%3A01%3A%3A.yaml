simpleMeaning: Through the nose comes a half-vowel, right after a vowel said with the mouth, in this way
  of speaking.
scope: In this way of speaking, a vowel said with the mouth is followed at once by a half-vowel said through
  the nose.
examples:
- In the recording, asynchronous nasalization showed in the word-final vowel.
- In Polish, the letter ę shows asynchronous nasalization, a vowel followed by a nasal sound.
