simpleMeaning: An electrical part in a gasoline engine that sends voltage (electrical force) to the spark
  plugs one after the other in the right order
scope: This engine part is also called distributer and electrical distributor; it is not a person or company
  that sells goods to shops.
examples:
- The mechanic replaced the distributor so the engine would start again.
- A broken distributor can stop the spark plugs from firing in order.
