simpleMeaning: a blood vessel that brings blood to the outer layer of the brain
scope: Also called cerebral artery; it feeds the outer layer of the brain, not the muscles of the neck
  and not the middle layer of the eye.
examples:
- The arteria cerebri carries blood to the outer layer of the brain.
- A block in an arteria cerebri can starve part of the brain of blood.
