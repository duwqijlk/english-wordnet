simpleMeaning: A short person with short arms and legs from a fault in the genes, whose body, mind and
  sexual growth are otherwise as usual
scope: A short person from a fault in the genes, with body, mind and sexual growth otherwise as usual,
  and hypoplastic dwarf is another name for this sense; not a short person from poor food, and not a child.
examples:
- He was a normal dwarf, short in the arms and legs but growing as usual in other ways.
- A normal dwarf may be much shorter than other adults yet develop in the usual way.
