simpleMeaning: a three-sided shape in which every inside corner is smaller than a right angle
scope: 'Another name for an acute-angled triangle: a three-sided shape with every inside corner smaller
  than a right angle, not a shape with a right angle and not a shape with a corner wider than a right
  angle.'
examples:
- In an acute triangle, all three corners are smaller than a right angle.
- She drew an acute triangle with no corner as wide as a right angle.
