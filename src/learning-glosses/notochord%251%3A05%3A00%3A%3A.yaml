simpleMeaning: In the simplest animals that have one, and in the young of higher animals before birth,
  a bendy rod down the middle of the body holds it up.
scope: A bendy rod down the middle of the body that holds it up, not the backbone itself.
examples:
- The notochord runs down the middle of the young fish.
- In the embryo, the notochord holds the body up.
