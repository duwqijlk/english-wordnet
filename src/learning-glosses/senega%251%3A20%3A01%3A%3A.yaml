simpleMeaning: White flowers with green middles and often a purple tip grow on a bushy herb living for
  years in the middle and south of the United States, like Seneca snakeroot.
scope: A plant of the middle and south of the United States, not the dried root of the same name, and
  Seneca snakeroot is only a look-alike.
examples:
- Senega grows in the middle and south of the United States.
- The senega bore white flowers with green middles.
