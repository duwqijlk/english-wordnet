simpleMeaning: having an unnatural fear or hate of people or things that are strange or from other places
scope: This is an unnatural fear or hate of people or things that are strange or from other places; not
  a dislike of one person, and not a fear of open spaces.
examples:
- His xenophobic remarks showed a deep fear of foreigners.
- The xenophobic crowd shouted at the visitors from abroad.
