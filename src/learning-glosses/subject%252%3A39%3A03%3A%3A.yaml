simpleMeaning: To make a person or thing go through something hard, painful or harmful, or put them in
  danger of it.
scope: This is not about forcing people to obey; it is about making them live through an experience or
  a risk.
examples:
- The tests subjected the metal to extreme heat.
- Nobody should be subjected to such rude treatment.
