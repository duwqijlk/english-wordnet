scope: Needing each other to live or get on; mutualist is another name for this sense, not living alone
  and not helping only one side.
examples:
- 'The two small shops are mutually beneficial: neither one could keep going without the other.'
- Their friendship is mutually beneficial because each of them needs the other's help.
