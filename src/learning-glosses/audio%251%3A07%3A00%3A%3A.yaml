simpleMeaning: A sound wave that the ear can hear, counted by how often it moves back and forth.
scope: A sound wave the ear can hear, not a recording of sounds and not the sound part of a broadcast.
examples:
- The audio range of human hearing is limited.
- Dogs can hear audio far above what we can catch.
