simpleMeaning: a piece of writing about real people, events, or ideas that is published as a separate
  part of a newspaper, magazine, or website.
scope: It is not a physical object and not a grammar word such as 'a' or 'the'; it means a written report
  or essay.
examples:
- She wrote an article about climate change for a science magazine.
- I read an article online about healthy eating.
