simpleMeaning: one of many South and Central American birds with a curved beak and stiff tail feathers,
  that climb and feed like woodpeckers
scope: 'Also called a wood-creeper, a woodcreeper, or a woodhewer: a South or Central American bird that
  climbs like a woodpecker, not the small Northern Hemisphere tree creeper that climbs tree trunks.'
examples:
- The tree creeper worked its way up the trunk.
- Tree creepers use their stiff tails for support as they climb.
