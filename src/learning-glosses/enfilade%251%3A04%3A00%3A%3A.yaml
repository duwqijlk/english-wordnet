simpleMeaning: A group of soldiers is fired on along its long side, not across its short side
scope: 'Also called enfilade fire: shots fired along the long side of a group of soldiers, not shots fired
  across its short side and not the act of firing itself.'
examples:
- The enfilade swept down the whole length of the trench line.
- They feared an enfilade from the hill above the road.
