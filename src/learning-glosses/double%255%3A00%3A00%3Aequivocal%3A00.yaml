simpleMeaning: Having two possible meanings, said or done in order to mislead.
scope: This describes words meant to mislead, not something twice as large or a thing with two roles.
examples:
- The contract was written with a double meaning so that either side could claim it had been kept.
- His answer carried a double meaning, letting him deny what he had promised.
