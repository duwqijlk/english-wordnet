simpleMeaning: a power-storing battery with nickel oxide on one side of each cell and iron on the other,
  in potassium hydroxide liquid; each cell gives about 1.2 volts
scope: 'Another name for this is a nickel-iron accumulator: a storage battery built this way, not a lead-acid
  battery and not a small dry cell for a torch.'
examples:
- The nickel-iron battery in the old tram still holds its charge.
- A nickel-iron battery cell gives about 1.2 volts, so the set uses several cells together.
