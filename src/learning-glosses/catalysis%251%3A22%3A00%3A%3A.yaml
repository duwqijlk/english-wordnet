simpleMeaning: The speeding up of a chemical change by something that is itself unchanged in a chemical
  way when the change ends.
scope: The speeding up of a chemical change by a substance that is itself unchanged when the change ends,
  also called contact action; not the slowing down of a chemical change, and not a change that uses up
  the substance.
examples:
- Catalysis speeds up the making of plastics.
- Many of the top commodity chemicals are made by catalysis.
