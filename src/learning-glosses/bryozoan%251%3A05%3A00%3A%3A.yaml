simpleMeaning: 'A water animal of a group called moss animals: it stays fixed on stones or seaweed, forms
  colonies of small tube-shaped polyps with tentacles, and multiplies by budding.'
scope: This small colony-forming water animal, not the moss or seaweed it can look like, and not a coral.
examples:
- A bryozoan colony looks like a patch of moss on a rock.
- Bryozoans use their tentacles to catch tiny food particles.
