simpleMeaning: Any tiny bit of matter that acts strongly on other tiny bits of matter.
scope: Any tiny bit of matter that acts strongly on other tiny bits of matter; not an atom and not a molecule.
examples:
- A hadron acts strongly on other tiny bits of matter.
- Protons are hadrons that push hard against other particles.
