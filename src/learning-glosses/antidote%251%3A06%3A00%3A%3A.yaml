simpleMeaning: A cure that stops a poison from working or keeps its harm in check
scope: A cure that stops or holds back a poison, not a cure for a sickness in general.
examples:
- The doctor gave him an antidote for the snake bite.
- They keep an antidote ready in case of poisoning.
