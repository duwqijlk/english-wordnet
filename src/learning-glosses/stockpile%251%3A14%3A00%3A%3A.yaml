simpleMeaning: a pile of things gathered and kept to be used later
scope: A pile of things kept for later use; not the act of gathering and keeping things, and not a pile
  that will be thrown away.
examples:
- The village kept a stockpile of wood for winter.
- Their stockpile of food grew as winter came near.
