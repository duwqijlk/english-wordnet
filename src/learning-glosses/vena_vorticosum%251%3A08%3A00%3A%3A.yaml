senseId: 'vena_vorticosum%1:08:00::'
synsetId: 05433280-n
simpleMeaning: A blood tube made from branches of the back of the eye and the ring of tissue round the
  lens, emptying into the blood tubes of the eye socket.
scope: A blood tube of the back of the eye; vortex vein and vorticose vein are other names for this sense;
  not a blood tube of the front of the eye and not one of the brain.
examples:
- The vena vorticosum is formed by branches from the back of the eye.
- Blood leaves the eye through the vena vorticosum.
