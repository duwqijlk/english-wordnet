simpleMeaning: a curved piece for show that fits over the top edge of a roof
scope: A curved piece that covers the top edge of a roof, not a flat piece laid on the roof and not a
  piece that covers the top of a wall.
examples:
- The ridge tile on the roof was painted a deep red.
- A ridge tile had come loose and slid down the roof.
