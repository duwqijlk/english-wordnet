simpleMeaning: With strong spice and meat, fish, or vegetables, this Indian dish is made from rice.
scope: This Indian dish of rice with strong spice and meat, fish, or vegetables is also called biryani;
  it is not a plain dish of rice.
examples:
- The biriani came with meat and rice.
- The biriani with fish had a strong smell of spice.
