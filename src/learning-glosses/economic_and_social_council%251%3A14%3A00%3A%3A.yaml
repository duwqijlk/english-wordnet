simpleMeaning: A lasting council of the United Nations that looks after money and how people live.
scope: A body of the United Nations that goes on year after year, not the body for women and not a meeting
  called for one day.
examples:
- The Economic and Social Council met in New York to discuss health and work.
- The Economic and Social Council issued a report on living conditions.
