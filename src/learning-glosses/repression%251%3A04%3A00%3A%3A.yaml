simpleMeaning: the act of holding someone or something down under firm control
scope: This is holding someone or something down under firm control. Not the sense in the mind, where
  ideas or feelings that would cause worry are kept out of what the person knows.
examples:
- The repression of free speech angered many people in the country.
- People lived in fear under the repression of the old government.
