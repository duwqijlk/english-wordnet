simpleMeaning: The flour, meal, or grain from which bread is baked.
scope: Flour, meal, or grain for making bread, not bread itself and not the baked food made from dough.
examples:
- The miller sold breadstuff to bakers across the county.
- Farmers stored the breadstuff in sacks for the winter.
