simpleMeaning: A grain plant grown for food for people and animals, with a growth and stem shape like
  Indian corn but with leaves that have sawtooth edges.
scope: This is a grain plant grown for food, with a growth and stem shape like Indian corn but with leaves
  that have sawtooth edges; great millet, kaffir corn and kafir corn are other names for it, not Indian
  corn itself.
examples:
- Farmers grow kaffir for food for people and animals.
- The kaffir in the field had sawtooth-edged leaves like Indian corn.
