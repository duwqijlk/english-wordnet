simpleMeaning: A place where people held for their views or captured in war are kept, most often under
  cruel terms
scope: A place where people held for their views or captured in war are kept, most often under cruel terms;
  stockade is another name for this sense, not a prison for common crimes and not a camp for soldiers
  on leave.
examples:
- Prisoners were held in a concentration camp under cruel terms.
- The concentration camp held people captured in war.
