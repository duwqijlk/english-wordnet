simpleMeaning: A tool for turning things, with a peg that sticks out and goes into a hole in the thing
  to be turned
scope: A tool with a peg that sticks out and fits into a hole on the thing to be turned, not a flat spanner
  and not a screwdriver.
examples:
- He used a pin wrench to turn the round nut.
- The pin wrench fitted the socket on the wheel.
