simpleMeaning: in maths, the angle that goes with a given number, found by undoing the ratio of the longest
  side to the near side of a right-angled triangle
scope: In maths, the angle that goes with a given number, found by undoing the secant, also called arc
  secant, arcsec or arcsecant; not the secant itself and not the inverse cosine.
examples:
- The inverse secant of 2 is 60 degrees.
- Use the inverse secant to find the angle.
