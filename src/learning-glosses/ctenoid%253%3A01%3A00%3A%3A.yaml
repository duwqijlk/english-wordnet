simpleMeaning: Shaped like a comb, with small points sticking out like the teeth of a comb.
scope: Also called comb-like; shaped like a comb, not smooth and not toothed like a saw.
examples:
- The ctenoid scales of the fish felt rough to the touch.
- Ctenoid edges on the shell look like a comb's teeth.
