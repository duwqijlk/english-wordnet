simpleMeaning: To put your name on an official list so you can join a group or take part in something
scope: To put your name on an official list so you can join a group or take part in something; enter,
  raise, recruit and enroll are other names for this sense; not to sign your name on a book, and not to
  write words meant to last.
examples:
- She inscribed her name to take part in the race.
- Hundreds of students inscribed for the evening classes.
