simpleMeaning: A person who can find a route across land that has not been mapped.
scope: A person skilled at finding a way over wild, unmapped country; not a paid attendant who escorts
  visitors, not an adviser who points out the way, and not a fixed mark that steers a machine.
examples:
- The explorers hired a local guide who knew the mountain passes.
- Our guide found a dry route through the swamp.
