senseId: 'contemporize%2:31:00::'
synsetId: 00737871-v
simpleMeaning: to place events side by side in a telling so that they all take place at the same time
scope: To place events side by side in a telling so they all take place at the same time, not to list
  events in the order they happened; contemporise and synchronize are other names for this sense.
examples:
- The writer contemporizes the two journeys, making them run side by side.
- In the play, he contemporizes past and present so both are on stage at once.
