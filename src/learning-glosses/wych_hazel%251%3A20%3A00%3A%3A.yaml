simpleMeaning: Bushes or trees of the group Hamamelis give a lotion from their bark, and the lotion makes
  skin feel tight
scope: Also called witch hazel, witch hazel plant and wych hazel plant, this bush or tree is the plant
  whose bark gives the lotion, not the lotion itself.
examples:
- Bark from wych hazel gives a lotion that makes the skin feel tight.
- The bark of wych hazel makes a lotion that tightens the skin.
