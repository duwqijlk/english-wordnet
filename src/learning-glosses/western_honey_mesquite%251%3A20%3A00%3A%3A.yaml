simpleMeaning: A thorny deep-rooted shrub native to the US southwest and Mexico that stands up to dry
  weather, with sweet pods that feed livestock; it tends to form wide, thick bushes.
scope: A thorny shrub of dry lands, also called honey mesquite and Prosopis glandulosa; not a thornless
  garden bush and not a tree grown for wood.
examples:
- Western honey mesquite spreads in thickets across the dry southwest.
- Cattle eat the sweet pods of Western honey mesquite.
