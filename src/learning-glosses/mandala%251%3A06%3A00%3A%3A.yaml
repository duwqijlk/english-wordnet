simpleMeaning: A design, usually round, made with shapes, that stands for the universe; used mainly in
  Hinduism and Buddhism to help people sit quietly and think deeply
scope: This is a design, usually round, that stands for the universe and helps quiet thinking in Hinduism
  and Buddhism, not just any round pattern made only to look pretty.
examples:
- Monks made a coloured mandala on the floor to help them think quietly.
- The round mandala in the temple stands for the universe.
