simpleMeaning: A maple tree of western North America with big leaves cut into five parts, turning orange
  in autumn.
scope: 'Also called big-leaf maple and Oregon maple: a maple of western North America with big five-part
  leaves, orange in autumn, not a maple of eastern North America and not a maple with small leaves.'
examples:
- Acer macrophyllum grows along the western coast.
- In autumn, the big leaves of Acer macrophyllum turn orange.
