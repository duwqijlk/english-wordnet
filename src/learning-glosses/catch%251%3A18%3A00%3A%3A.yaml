simpleMeaning: A person who is seen as a very desirable partner to marry.
scope: This is not a hidden problem in a deal; it refers to a person judged to be a good marriage partner.
examples:
- Everyone said he was a good catch because he was kind and had a steady job.
- In those days a wealthy widow was considered quite a catch.
