simpleMeaning: A paper from a court that sets out the reasons behind what the court has decided.
scope: A court paper setting out the reasons for a ruling, also called an opinion, not the ruling itself
  and not a person's power to size things up.
examples:
- The judgment ran to forty pages.
- She read the judgment to learn why the court had ruled as it did.
