simpleMeaning: a set of related actions, usually limited to a certain area and period, done to reach a
  particular aim
scope: A planned set of operations over an area and time, not an election race, a push for a cause, or
  a hunting trip.
examples:
- The army's campaign in the mountains lasted through the winter.
- The bombing campaign failed to break the enemy's defences.
