senseId: 'fluent_aphasia%1:26:00::'
synsetId: 14122654-n
simpleMeaning: Words flow smoothly but mean nothing for a person with this loss of the power of speech,
  who can hardly follow spoken or written words.
scope: Also called impressive aphasia, receptive aphasia, or sensory aphasia, this is a loss of the power
  of speech with smooth but meaningless talk and a hard time following spoken or written words.
examples:
- His fluent aphasia made his talk smooth but hard to follow.
- Fluent aphasia left her unable to follow the words on the page.
