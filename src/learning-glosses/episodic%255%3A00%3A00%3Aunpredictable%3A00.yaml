senseId: episodic%5:00:00:unpredictable:00
synsetId: 01848383-s
simpleMeaning: Coming and going, usually at times that are not set, with no even gap between them.
scope: Also called occasional, turning up at times that are usually not set, not made up of separate parts
  in a book or a tale, and not lasting for only one short spell.
examples:
- His visits were episodic, with months passing between them.
- The pain is episodic, flaring up now and then.
