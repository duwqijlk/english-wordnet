simpleMeaning: a unit of weight equal to 25 pounds
scope: This is the 25-pound measure, not the related 28-pound weight, and not the coin or the mercy given
  in battle.
examples:
- The old scales showed a quarter, which is twenty-five pounds.
- They bought a quarter of flour, twenty-five pounds in all.
