simpleMeaning: In the Middle Ages, soft body wear made of small metal loops joined to each other, worn
  to stop cuts in a fight
scope: 'Also called mail, chain mail, chain armor, chain armour, ring armor, or ring armour: soft body
  wear of small metal loops joined to each other, worn in the Middle Ages, not a solid plate worn on the
  chest and not a cloth coat.'
examples:
- The knight put on his ring mail before the battle.
- Ring mail hung from the hook by the door, its metal loops linked tight.
