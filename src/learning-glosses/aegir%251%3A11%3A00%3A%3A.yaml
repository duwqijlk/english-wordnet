simpleMeaning: Where flows of water meet or a river meets the sea in a narrow place, the tide can make
  a great wave, often dangerous.
scope: This is also called a bore, eager, eagre, and tidal bore, and it is a wave the tide makes, not
  one made by wind.
examples:
- The aegir swept up the estuary and swamped the small boats.
- The aegir rose where the currents met.
