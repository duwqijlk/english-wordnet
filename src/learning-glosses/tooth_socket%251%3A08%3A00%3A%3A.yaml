simpleMeaning: A hollow place in the bony ridge of the jaw that holds a hard white bit used for biting
scope: A hollow place in the bony ridge of the jaw that holds a biting bit; alveolus is another name for
  this sense, and not a hole in a tooth or the jaw itself.
examples:
- The tooth socket held the tooth firmly.
- After the tooth was pulled, the tooth socket was empty.
