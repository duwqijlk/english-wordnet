simpleMeaning: A flat round of thin batter, fried on both sides on a flat iron pan
scope: A flat round of thin batter, fried on both sides on a flat iron pan, also called pancake, flapjack,
  hotcake, battercake, flannel-cake, flannel cake, flapcake, and griddlecake; not a baked round, and not
  a thick round.
examples:
- We ate hot cakes with butter for breakfast.
- She flipped the hot cake on the griddle.
