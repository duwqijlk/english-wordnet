simpleMeaning: a chess puzzle in which White moves first and must win by trapping the black king in a
  set number of moves, whatever Black does
scope: A chess puzzle in which White must trap the black king in a set number of moves, not a puzzle in
  which Black must do the trapping and not a game played to win in any number of moves.
examples:
- She solved the directmate in three moves.
- The directmate asked White to trap the black king in just four moves.
