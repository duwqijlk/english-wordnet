simpleMeaning: At the entrance to the birth canal of a girl or woman who has not had sex sits a fold of
  flesh that covers it only in part.
scope: Also called maidenhead and hymen, it belongs to a girl or woman who has not had sex, and it covers
  the entrance to the birth canal only in part.
examples:
- The virginal membrane tore a little the first time she had sex.
- Her virginal membrane was still whole.
