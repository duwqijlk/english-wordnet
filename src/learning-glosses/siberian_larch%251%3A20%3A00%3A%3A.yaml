simpleMeaning: A medium-sized tree of northeastern Russia and Siberia with a narrow cone-shaped crown
  and soft narrow bright-green leaves, grown by people.
scope: Also called Larix russica and Larix siberica; not a pine and not a broadleaf tree.
examples:
- The Siberian larch turned soft green in spring.
- We planted a Siberian larch for its narrow crown.
