simpleMeaning: a tiny computer circuit built into a chip or a like part, holding a whole system and not
  just one part
scope: A tiny computer circuit built into a chip, also called integrated circuit; not one single part
  on its own and not a big machine.
examples:
- The microcircuit in the phone runs the whole system.
- A microcircuit holds far more than one part.
