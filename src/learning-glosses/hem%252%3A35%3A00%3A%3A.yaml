simpleMeaning: to fold the edge of a piece of cloth over and sew it together to make a finished edge
scope: This is the act of folding and sewing an edge of cloth, not the edge itself and not the short sound
  a person makes in the throat.
examples:
- Please hem this skirt before Friday.
- She hemmed the trousers by hand.
