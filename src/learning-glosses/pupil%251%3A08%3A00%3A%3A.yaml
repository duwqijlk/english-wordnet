simpleMeaning: the opening in the middle of the coloured part of the eye (the iris) that can get smaller
  and looks like a large black dot
scope: The black opening in the middle of the eye; not a person who learns at a school.
examples:
- The doctor shone a light into her eye to check her pupils.
- His pupils grew wide in the dark room.
