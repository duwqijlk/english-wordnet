simpleMeaning: In building, a thing built of stone or brick, usually curved, that goes across an opening
  and holds up the weight above it
scope: This is a stone or brick part built over an opening in a building. It is not the curved part inside
  a foot, and not the open way under such a part.
examples:
- The old church has a stone arch over its main door.
- A brick arch held up the wall above the window.
