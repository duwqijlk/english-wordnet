simpleMeaning: a skilled woman whose job is to draw plans for buildings or machines
scope: A woman who draws plans for buildings or machines, also called a draughtswoman, not a builder and
  not a woman who draws pictures for fun.
examples:
- The draftswoman redrew the plans for the house.
- The draftswoman showed the builders her plans for the new wing.
