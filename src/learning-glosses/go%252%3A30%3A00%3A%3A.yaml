simpleMeaning: To die, losing all the physical qualities and functions that keep the body alive.
scope: This is a gentle way of saying that someone dies, not traveling somewhere and not becoming a particular
  state.
examples:
- He went peacefully at home, surrounded by his family.
- The old horse went quietly in the night after a long illness.
