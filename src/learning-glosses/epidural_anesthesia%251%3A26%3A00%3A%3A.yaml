senseId: 'epidural_anesthesia%1:26:00::'
synsetId: 14052134-n
simpleMeaning: numbing of the belly, genitals and pelvis by injecting painkiller into the space around
  the spinal cord; used in childbirth and gynecological surgery
scope: Another name for this procedure is epidural anaesthesia (also spelled epidural anesthesia); the
  short noun epidural means the same thing, and it is not the adjective sense 'on or outside the dura
  mater'.
examples:
- The epidural anesthesia wore off about two hours after the operation.
- Doctors chose epidural anesthesia so the patient would stay conscious.
