simpleMeaning: a dragon-like animal that breathes fire, used on family signs in the Middle Ages; it has
  a dragon head, a snake tail, a body with wings and two legs
scope: A made-up dragon-like animal on old family signs, with only two legs; not a real animal and not
  a four-legged dragon.
examples:
- The old shield showed a wyvern with its wings spread wide.
- A stone wyvern stood over the castle gate, its snake tail curled.
