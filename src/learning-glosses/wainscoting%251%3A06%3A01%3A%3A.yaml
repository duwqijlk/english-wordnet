simpleMeaning: a wall that has wooden panels on it, or all walls like this taken together
scope: The covered wall or walls themselves, not the wooden panels used to cover a wall.
examples:
- In this house, the wainscoting is the set of walls lined with wood in the front room.
- They painted the wainscoting in the hall, wall after wall, a soft white.
