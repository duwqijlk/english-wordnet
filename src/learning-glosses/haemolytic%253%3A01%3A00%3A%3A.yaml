senseId: 'haemolytic%3:01:00::'
synsetId: 03019038-a
simpleMeaning: This word is used when red blood cells break down, for what has to do with that breaking
  down or brings it about
scope: To do with or causing the breaking down of red blood cells, also called hemolytic, not the breaking
  down of other cells and not a disease itself.
examples:
- Haemolytic anaemia is caused by red blood cells breaking down too fast.
- The doctor looked for a haemolytic cause for her low blood count.
