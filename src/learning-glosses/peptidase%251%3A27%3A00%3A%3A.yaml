simpleMeaning: In a splitting process called proteolysis, any body chemical can break proteins down into
  smaller bits and single building blocks.
scope: 'Also called protease, proteinase, and proteolytic enzyme: a body chemical that splits proteins,
  not one that builds them up.'
examples:
- Peptidase breaks proteins into smaller bits.
- The lab added peptidase to split the protein sample.
