  leaves from Europe and western Asia.
scope: It is a plant of Europe and western Asia with fine feathery leaves, some below the surface and
  some floating on top, and purple blooms.
examples:
- The water violet showed purple blooms above leaves that float.
- A water violet grew with leaves below the surface and floating on top.
