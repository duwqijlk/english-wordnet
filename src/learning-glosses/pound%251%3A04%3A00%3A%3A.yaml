simpleMeaning: the action of striking something over and over with heavy blows.
scope: This is the repeated-hitting sense, also called hammering; it is not the weight or force unit and
  not the currency sign.
examples:
- The steady pound of the machinery shook the floor.
- We heard the pound of fists on the locked door.
