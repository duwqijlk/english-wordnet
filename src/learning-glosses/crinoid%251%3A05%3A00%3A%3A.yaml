simpleMeaning: An early kind of sea animal with five or more feathery arms spreading out from a round
  middle part
scope: An early sea animal with five or more feathery arms round a middle disk, not a starfish and not
  a jellyfish.
examples:
- The crinoid waved its feathery arms in the current.
- Fossil crinoids are found in old sea rocks.
