simpleMeaning: Most often on the great flat lands in the middle of North America, this person lives on
  flat open land
scope: A person who lives on flat open land, not a person who lives in the hills and not someone just
  passing through.
examples:
- The plains inhabitant had lived on the same farm for forty years.
- A plains inhabitant knew every track across the flat land.
