simpleMeaning: the student with the best marks in the class, who usually gives a speech at the graduation
  ceremony
scope: The top student in a class, who usually speaks at graduation; not just any student who speaks there,
  and not a teacher or the head of the school.
examples:
- As valedictorian, Maya gave a speech at her graduation.
- The valedictorian had the best marks of all the students in her year.
