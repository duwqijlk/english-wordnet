simpleMeaning: the flow of wind pushed back by the turning blades of a plane
scope: 'Also called race, wash, slipstream and backwash: the flow of wind pushed back by a plane''s turning
  blades, not the wind that lifts the plane and not a stream of water.'
examples:
- The airstream from the propeller blew dust across the field.
- Standing behind the plane, he felt the airstream on his face.
