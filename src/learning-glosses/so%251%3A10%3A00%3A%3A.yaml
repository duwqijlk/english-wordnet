simpleMeaning: The sung bit that names the fifth note of any musical scale, the note that rules the scale
scope: The sung bit that names the fifth note of any scale, the note that rules the scale; sol and soh
  are other names for this sense, and it is not the first note nor a written note.
examples:
- Sing do, re, mi, fa, so to reach the fifth note.
- The choir held so for four beats.
