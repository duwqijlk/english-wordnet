simpleMeaning: On a round globe, the gaps between the lines that run from pole to pole are one size; this
  way of drawing a flat map keeps those gaps the same.
scope: Of the many ways of drawing a flat map of the earth, this one keeps the gaps between its north-south
  lines the same as on a globe.
examples:
- The polyconic projection on the wall showed the north-south lines spaced just as on the globe.
- We checked the polyconic projection against the globe and found the gaps matched.
