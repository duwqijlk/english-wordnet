simpleMeaning: A person who has a paper of value, such as a check, a note, or a bond, signed over to them
  or to anyone who has it.
scope: This is a person who has a paper of value signed over to them, also called a bearer, not the one
  who wrote the paper.
examples:
- The holder of the bond can cash it in.
- The holder of the check went to the bank.
