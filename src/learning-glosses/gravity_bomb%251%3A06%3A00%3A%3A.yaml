simpleMeaning: Nothing steers this thing made to blow up to a mark; it falls by its own weight
scope: A thing made to blow up that falls on its own and is not steered to a mark, also called dumb bomb,
  not a guided missile and not a mine that blows up on the ground.
examples:
- The plane dropped a gravity bomb over the target area.
- A gravity bomb falls where it is dropped, since nothing steers it.
