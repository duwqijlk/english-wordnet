simpleMeaning: a thin pad filled with straw or sawdust, used as a mattress
scope: A thin pad filled with straw or sawdust, used as a mattress; paillasse is another name for this
  sense, and it is not a soft mattress filled with feathers or a bed frame.
examples:
- He slept on a palliasse stuffed with straw.
- The palliasse was thin and hard.
