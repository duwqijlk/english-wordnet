simpleMeaning: A tunnel in a mine that runs level, or nearly so, through the rock.
scope: This is the roughly level mine tunnel, and heading and gallery are other names for it; it is not
  the slow straying off course or the mass of snow piled by wind.
examples:
- The miners followed the drift deep into the hillside.
- A narrow drift connected the two shafts.
