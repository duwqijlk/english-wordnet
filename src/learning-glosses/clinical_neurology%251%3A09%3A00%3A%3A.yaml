simpleMeaning: The branch of medicine that deals with the nerves and the ills that strike them.
scope: The branch of medicine that deals with the nerves and the ills that strike them, also called neurology;
  not the study of the mind alone and not the branch that cuts into the body.
examples:
- She chose clinical neurology as her field of medicine.
- The hospital's clinical neurology unit treats disorders of the nerves.
