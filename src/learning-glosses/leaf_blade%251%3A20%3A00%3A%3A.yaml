simpleMeaning: The wide flat part of a green plant part, apart from its stalk, is what this means, above
  all of grass.
scope: Also called blade, this is the wide flat part of a green plant part, apart from its stalk, and
  not the stalk itself.
examples:
- A leaf blade of grass caught the light.
- We cut a leaf blade from the grass.
