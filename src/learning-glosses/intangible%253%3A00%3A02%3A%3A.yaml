simpleMeaning: especially of things a business owns, having no solid form and no value on their own for
  making things
scope: About things a business owns that have no solid form and no value on their own for making things;
  not a general thing, such as the soul, that cannot be touched or seen, and not the sense that means
  a thing cannot be known through the senses, above all through touch.
examples:
- 'For a business, a good name is intangible: it has no solid form and cannot on its own make goods.'
- The firm counted its intangible value from customer trust, separate from its machines and buildings.
