simpleMeaning: A doctor gives the body a full look-over, then runs tests picked to fit the person's age,
  sex and health
scope: 'Also called checkup, health check, medical, medical checkup or medical exam: a full check of the
  body by a doctor, not a single test and not a visit only to talk.'
examples:
- Her medical examination took an hour and included blood tests and a hearing test.
- Before he started the new job, he had a medical examination.
