simpleMeaning: a vitamin that melts in fat and stops rickets, a sickness that makes children's bones soft
  and bent
scope: 'Also called calciferol and cholecalciferol: a vitamin that melts in fat and stops rickets, not
  a vitamin that melts in water and not a cure for broken bones.'
examples:
- Doctors give ergocalciferol to children who lack sunshine.
- Ergocalciferol in the milk helped stop rickets.
