senseId: 'leniency%1:04:00::'
synsetId: 01073137-n
simpleMeaning: making a punishment less hard, or letting someone not do a job they had to do, done by
  a judge, a parent or a teacher
scope: 'Also called lenience: the act of making a punishment lighter or letting someone off a job, not
  the kind quality behind such an act, and not a habit of giving in to what others want.'
examples:
- The judge showed leniency and gave the young man a shorter sentence.
- She asked her teacher for leniency and was let off clearing up after class.
