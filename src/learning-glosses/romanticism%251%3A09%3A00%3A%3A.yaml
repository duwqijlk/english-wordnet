simpleMeaning: A way of writing and making art in the late 1700s and early 1800s that praised nature more
  than civilization.
scope: This is the art movement of the late 1700s and early 1800s, also called the Romantic Movement,
  not the everyday word for love.
examples:
- Romanticism valued imagination and emotion over rationality.
- The poet wrote in the spirit of Romanticism, praising wild hills over city streets.
