simpleMeaning: The natural round of the element from the air into living things and back into the air
  again.
scope: The natural round of the element from the air into living things and back into the air again, not
  a single breath and not the water cycle.
examples:
- Plants take in carbon in the carbon cycle.
- The carbon cycle moves the element from air to living things and back.
