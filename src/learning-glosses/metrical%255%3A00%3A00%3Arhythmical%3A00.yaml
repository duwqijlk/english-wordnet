senseId: metrical%5:00:00:rhythmical:00
synsetId: 02027523-s
simpleMeaning: The beat-wise set-out of word parts.
scope: This sense is also called measured and metric, for the beat-wise set-out of word parts, where measured
  is set out in a regular beat, with word parts (syllables) placed in a fixed pattern.
examples:
- Metrical verse sets out word parts in a beat.
- The line was metrical, beat-wise set out.
