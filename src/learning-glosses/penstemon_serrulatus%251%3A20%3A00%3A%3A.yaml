simpleMeaning: A plant with rings of deep blue to dark purple flowers at the tops of upright leafy stems,
  growing in wet ground from British Columbia to Oregon.
scope: Also called cascade penstemon; one of many kinds of penstemon, this one with deep blue to dark
  purple flowers in rings, found in wet ground in the far west from British Columbia to Oregon.
examples:
- Penstemon serrulatus grew in thick rings of blue flowers along the wet bank.
- We saw Penstemon serrulatus in bloom near the stream in Oregon.
