simpleMeaning: of living things that feed themselves, making rich food stuffs from plain lifeless matter
  with light from the sun, like green plants
scope: Autotrophic is another name for autophytic, used of living things that feed themselves, making
  food from light and plain matter.
examples:
- Autotrophic moss makes food from light and plain matter.
- An autotrophic plant feeds itself with light from the sun.
