simpleMeaning: An Old World perennial, sweet-smelling, runner-spreading, with small white blooms and narrow
  leaves, for flavouring, in sachets, grown widely to cover the ground, sometimes put in Asperula genus.
scope: This sense is also called fragrant bedstraw, sweet woodruff, and waldmeister, for a sweet-smelling
  Old World perennial that spreads by runners, with narrow leaves and small white flowers, used for flavouring
  and in sachets, widely grown as ground cover, and sometimes placed in genus Asperula.
examples:
- Woodruff scents the sachet.
- Woodruff covers the ground.
