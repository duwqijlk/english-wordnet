simpleMeaning: A light meal in the middle of the afternoon, with a hot drink and sandwiches or cakes
scope: 'Also called tea: a light afternoon meal with a hot drink, sandwiches or cakes, not the hot drink
  on its own and not a main evening meal.'
examples:
- At teatime, they had sandwiches and small cakes.
- We stopped work at teatime for a cup of tea and cake.
