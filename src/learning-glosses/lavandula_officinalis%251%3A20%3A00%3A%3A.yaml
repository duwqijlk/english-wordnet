simpleMeaning: A sweet-smelling shrub of the Mediterranean, grown in many places for its lilac flowers,
  which are dried and put in small bags to scent clothes
scope: Also called English lavender or Lavandula angustifolia; this is the sweet-smelling Mediterranean
  shrub with lilac flowers, not other shrubs with scented flowers.
examples:
- Lavandula officinalis scented the whole garden.
- She cut Lavandula officinalis to dry.
