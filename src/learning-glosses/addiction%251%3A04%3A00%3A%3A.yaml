simpleMeaning: In Roman law, a judge's formal award of a thing or a person to another, as a debtor to
  the one owed money, a surrender to a master
scope: In Roman law, a judge's award of a thing or person to another, not the need for a habit-forming
  drug.
examples:
- Under Roman law, addiction could hand a debtor to his creditor.
- The magistrate ordered the addiction of the man to his master.
