simpleMeaning: A part that joins and frees two moving parts, using flat round plates that press and grip
  each other.
scope: A part with flat round plates that grip to join and free moving parts, not a brake and not a gear.
examples:
- The disk clutch slipped when the plates wore thin.
- A worn disk clutch makes the machine hard to use.
