simpleMeaning: a bush from Europe and Asia with sharp points on its stems, greenish flowers with a touch
  of purple, and egg-shaped berries that are yellow-green or red-purple
scope: 'Also called gooseberry bush: the plant itself, not the berry it bears, which is used in jams and
  jellies.'
examples:
- The gooseberry in our garden has sharp points on its stems.
- A gooseberry by the fence flowered early this year.
