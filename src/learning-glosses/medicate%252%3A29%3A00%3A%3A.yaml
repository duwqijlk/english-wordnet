simpleMeaning: to treat a sick person by giving them a drug
scope: To treat a sick person with a drug, also called medicine; not putting a drug into a thing, which
  is the other sense of this word.
examples:
- The doctor medicated the patient to help with the pain.
- She was medicated with a strong drug and soon fell asleep.
