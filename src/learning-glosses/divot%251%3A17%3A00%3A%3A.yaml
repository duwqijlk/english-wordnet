simpleMeaning: a piece of grass and earth dug out of a lawn or a fairway, the short-grass part of a golf
  course, by an animal's hooves or a golf club
scope: This is the piece of grass and earth that is dug out, not the hole in the ground that is left after
  it is cut out in golf.
examples:
- The golf club lifted a divot from the fairway.
- A divot of grass and earth flew into the air when the horse ran across the lawn.
