simpleMeaning: Said of things that belong to Kurdistan or to the Kurds, or show their tongue or their
  way of life.
scope: This word marks things of Kurdistan or the Kurds, their tongue and their way of life, not the tongue
  on its own.
examples:
- Kurdish music and food are part of daily life in the region.
- She wore a Kurdish dress to the festival.
