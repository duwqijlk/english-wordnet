simpleMeaning: A large bird of the dry lands of the southwestern United States and Mexico, known for its
  rough, loud call.
scope: A large bird with a rough, loud call that lives in the dry lands of the southwestern United States
  and Mexico, not a bird of wet green woods.
examples:
- A cactus wren sang its rough song.
- We heard a cactus wren calling loudly.
