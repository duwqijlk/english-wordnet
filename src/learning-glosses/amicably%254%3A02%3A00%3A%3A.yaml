simpleMeaning: in a friendly way, without anger or fighting
scope: This word says how people do something in a friendly way; it does not describe a person or a thing
  itself, and it is not done in anger.
examples:
- The two sides settled the argument amicably.
- They separated amicably and stayed friends.
