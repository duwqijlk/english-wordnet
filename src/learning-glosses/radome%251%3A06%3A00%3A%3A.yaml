simpleMeaning: Radio waves pass through this shell that shields an antenna
scope: 'Another name for a radar dome: a shell that shields an antenna yet lets radio waves pass through,
  not a solid cover that blocks them.'
examples:
- The radome on the tower kept the antenna dry while letting signals through.
- Workers lifted the new radome into place over the antenna.
