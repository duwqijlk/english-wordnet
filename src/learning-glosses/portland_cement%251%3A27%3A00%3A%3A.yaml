simpleMeaning: A binding powder that sets hard even under water, made by heating lime rock and clay in
  a hot oven and then grinding the result to dust.
scope: A binding powder that sets hard even under water, also called hydraulic cement, not a powder that
  sets only in air and not a glue for wood.
examples:
- Portland cement sets hard even under water.
- Builders mix Portland cement with sand to make concrete.
