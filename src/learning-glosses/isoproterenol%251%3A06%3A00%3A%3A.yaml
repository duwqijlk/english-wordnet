simpleMeaning: A drug, sold under the name Isuprel, used to treat asthma of the bronchial tubes and to
  make the heart work harder.
scope: A drug that eases a tight chest from asthma and makes the heart beat with more force; not a drug
  that only opens the airways and not a drug that slows the heart.
examples:
- The doctor gave her isoproterenol to ease her asthma attack.
- Isoproterenol was used to make his heart beat with more force.
