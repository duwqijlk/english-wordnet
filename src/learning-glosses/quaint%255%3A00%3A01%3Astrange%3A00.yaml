simpleMeaning: very strange or unusual, and odd or not seeming to fit in what a person or thing is like
  or in how it looks
scope: Very strange or unusual in nature or look; not the sense that means in a pleasing old style.
examples:
- The animal has a quaint bill that looks very strange.
- They came upon a quaint sight that was odd and did not seem to fit the place.
