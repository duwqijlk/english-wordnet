simpleMeaning: Describes flowering plants, above all orchids and the like, that insects carry pollen between.
scope: Describes flowering plants, above all orchids and the like, that insects carry pollen between,
  not plants that the wind carries pollen between and not plants that make seed without pollen.
examples:
- Orchids are entomophilous, so insects carry their pollen.
- The entomophilous flowers need insects to set seed.
