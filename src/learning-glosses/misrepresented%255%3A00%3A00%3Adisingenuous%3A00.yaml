simpleMeaning: having the meaning that was meant changed or shown in a wrong way
scope: About words or facts whose meant meaning has been changed or shown wrongly; not about a plain mistake
  and not about a change made openly and fairly.
examples:
- The facts were misrepresented in the news report.
- He felt that his words had been misrepresented.
