simpleMeaning: A thick bright red growth that feeds on dead matter in the mountains of western North America,
  showing in early spring while white flakes still lie on the ground
scope: A bright red growth of the western mountains, not a white flower of the snow and not a green leafy
  herb.
examples:
- The snow plant pushes up through the snow in early spring.
- Hikers in the western mountains look for the bright red snow plant.
