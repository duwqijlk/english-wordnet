simpleMeaning: the act of getting in the way of a player on the other team during a game of ice hockey
scope: Not the general act of limiting power, and not the holding back of a danger or an enemy.
examples:
- He was sent to the penalty box for a hard check along the boards.
- The referee called a check from behind and gave him two minutes.
