simpleMeaning: an outer covering that goes around something
scope: An outer covering for a thing. It is not a coat you wear, not a cover for a tooth, and not the
  metal shell around a bullet.
examples:
- The old record was sold in a thick cardboard jacket.
- The wires were kept safe inside a plastic jacket.
