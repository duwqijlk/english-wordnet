simpleMeaning: The set pitch of each note on a keyed music tool, which the player cannot shift
scope: This is the set pitch of each note on a keyed music tool, which the player cannot shift; not the
  pitch a singer can bend and not the tuning of a string tool.
examples:
- The fixed intonation of the piano never wavers.
- Fixed intonation means each key keeps its pitch.
