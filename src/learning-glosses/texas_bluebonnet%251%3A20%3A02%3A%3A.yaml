simpleMeaning: A plant much like its close kin Lupinus subcarnosus, from the southwestern United States,
  in the state it is named for
scope: Also called Lupinus texensis; a plant much like Lupinus subcarnosus from the southwestern United
  States, not the low-growing blue-flowered herb that poisons farm animals.
examples:
- The Texas bluebonnet looks much like Lupinus subcarnosus.
- Texas bluebonnet grows in the southwestern United States.
