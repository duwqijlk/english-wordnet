simpleMeaning: A small extra gas device that makes a flame to light a bigger gas device.
scope: This is a small extra gas device that makes a flame to light a bigger gas device; pilot and pilot
  light are other names for this sense, not the main gas device itself and not a match.
examples:
- The pilot burner keeps a small flame going.
- If the pilot burner goes out, the big flame will not light.
