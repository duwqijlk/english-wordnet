simpleMeaning: A pull toward people of one's own sex, shown in feeling or in close bodily contact
scope: A pull toward people of one's own sex, also called homoeroticism, homosexuality, gayness, or queerness;
  not a pull toward people of the other sex, and not plain friendship.
examples:
- His homosexualism was plain in the love poems he wrote.
- The novel treats homosexualism as a quiet fact of the hero's life.
