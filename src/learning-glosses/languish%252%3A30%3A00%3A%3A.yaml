senseId: 'languish%2:30:00::'
synsetId: 00390663-v
simpleMeaning: to lose strength and health and grow thin, as can happen through deep sorrow
scope: 'Also called waste: this is about growing weak and thin through sorrow, not about staying a long
  time in a bad place with no help.'
examples:
- After his wife died, he began to languish and grew thin and weak.
- She languished with grief after losing her child, eating very little.
