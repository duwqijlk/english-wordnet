simpleMeaning: What a person holds in mind as true, though they have no proof and are not sure.
scope: What a person holds in mind as true, though they have no proof and are not sure, also called an
  opinion, a thought, and a view, not a soft, loving feeling.
examples:
- My sentiment differs from yours on this point.
- Tell me your sentiment on the new law.
