simpleMeaning: the end of a magnet that turns to point north when the magnet hangs free
scope: This is the north end of a magnet, also called a north-seeking pole and a positive magnetic pole,
  not the south end that points south.
examples:
- The positive pole of the magnet turned to face north.
- Hang the magnet free, and its positive pole will point north.
