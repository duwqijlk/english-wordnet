simpleMeaning: Above all on the elbows and knees, raised spots spread over much of the body, often with
  a trouble in how the body handles fats
scope: Also called cholesterosis cutis, lipid granulomatosis, lipoid granulomatosis and xanthomatosis,
  this skin trouble spreads raised spots over much of the body, above all on the elbows and knees, and
  often goes with a trouble in how the body handles fats.
examples:
- Raised spots on the elbows and knees mark xanthoma multiplex.
- Over much of the body, raised spots spread in xanthoma multiplex.
