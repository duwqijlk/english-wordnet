simpleMeaning: The cutting away of a male child's foreskin on the eighth day after birth, as a Jewish
  or Muslim rite.
scope: The rite performed on males eight days after birth, not the general surgical act itself.
examples:
- The family's circumcision was held on the eighth day after the birth.
- Circumcision is part of Jewish and Muslim tradition.
