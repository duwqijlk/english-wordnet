simpleMeaning: This fish is shaped like an eel and lives at the bottom of the Atlantic, with a large mouth
  that stands almost upright
scope: Also called a ghostfish and a wrymouth, this is a fish shaped like an eel that lives at the bottom
  of the Atlantic, not a true eel and not a fish that swims near the top.
examples:
- The Cryptacanthodes maculatus lay on the bottom of the Atlantic, its big mouth open.
- Fishermen caught a Cryptacanthodes maculatus with a mouth that stood almost straight up.
