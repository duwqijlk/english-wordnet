schema: oewn-learning-gloss-v2
senseId: 'exogenous_depression%1:26:00::'
synsetId: 14413654-n
simpleMeaning: a state of low mood that does not fit the events in a person's life that brought it on,
  and is not normal grief
scope: This is low mood brought on by life events; reactive depression is another name for this sense;
  not normal grief and not low mood with no outside cause.
examples:
- Her exogenous depression followed the loss of her job.
- The doctor treated his exogenous depression after a series of hard events.
