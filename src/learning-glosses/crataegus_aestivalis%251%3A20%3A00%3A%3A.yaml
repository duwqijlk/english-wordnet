simpleMeaning: A hawthorn of the southern United States with a juicy, sharp, scarlet fruit often used
  in jellies or preserves.
scope: Also called mayhaw and summer haw; a southern hawthorn with a juicy scarlet fruit, not the almost
  thornless hawthorn with pear-shaped berries.
examples:
- The Crataegus aestivalis bore juicy scarlet fruit.
- We made jelly from Crataegus aestivalis fruit.
