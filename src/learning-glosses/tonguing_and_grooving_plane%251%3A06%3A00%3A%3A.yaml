simpleMeaning: a woodwork tool with blades made to cut raised strips and slots on the edges of boards
  that fit together
scope: A woodwork tool with blades that cut raised strips and slots on the edges of boards that fit together,
  also called a match plane; not a tool for smoothing flat boards, and not a saw for cutting boards in
  two.
examples:
- He used a tonguing and grooving plane to shape the edges of the matchboards.
- The tonguing and grooving plane cut both the raised strips and the slots in one pass.
