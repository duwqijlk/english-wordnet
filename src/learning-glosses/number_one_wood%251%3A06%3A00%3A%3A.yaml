simpleMeaning: A golf club with a face that stands almost straight up, used for hitting long shots from
  the tee
scope: A golf club with a face that stands almost straight up, used for long shots from the tee, with
  driver as another name for this sense; not a club for short shots, and not a putter.
examples:
- He hit the ball far with his number one wood.
- The number one wood is the longest club in the bag.
