simpleMeaning: to make a thing the size and shape that is asked for
scope: To make a thing the size and shape asked for, not to mark sizes on a thing, and not the noun senses
  of a size in one direction, an idea that tells things apart, or one of the three numbers that fix a
  place in space.
examples:
- The parts were dimensioned to fit the machine.
- He dimensioned the wood to the right size.
