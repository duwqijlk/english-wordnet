simpleMeaning: A member of a native people of the north-east of South America and the Lesser Antilles.
scope: Also called Carib; a member of a native people of north-eastern South America and the Lesser Antilles,
  not the family of languages of the same name.
examples:
- The Carib Indian lived in villages along the rivers of the north-east of South America.
- Carib Indian families settled across the Lesser Antilles.
