simpleMeaning: blood tubes from the net of tubes at the back of the throat that drain into the large inner
  blood tube in the neck
scope: Blood tubes from the throat that drain into the large inner neck blood tube; vena pharyngeus is
  another name for this sense, not the large inner neck blood tube itself and not the tubes that feed
  the throat.
examples:
- The pharyngeal vein carries blood from the throat to the large vein in the neck.
- In the diagram the pharyngeal vein runs from the throat to the jugular vein.
