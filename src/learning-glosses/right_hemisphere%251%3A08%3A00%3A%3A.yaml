simpleMeaning: one half of the thinking organ, joined to the other half by a band of fibres, which is
  in charge of the left half of the body
scope: 'Also called the right brain: one half of the thinking organ, which is in charge of the left half
  of the body, not the left hemisphere and not the whole brain.'
examples:
- The right hemisphere controls the left side of the body.
- A stroke in the right hemisphere can affect the left hand.
