simpleMeaning: 'A tool for seeing tiny things by light, with two sets of glass that bend light to a point:
  one near the thing, one near the eye'
scope: A tool for seeing tiny things by light, with two sets of glass; not a single-glass lens and not
  a tool that uses electrons.
examples:
- The compound microscope has two sets of glass that bend light to a point.
- She put the slide under the compound microscope.
