simpleMeaning: to see if the body has defences against a germ part, a blood test mixes blood fluid with
  that germ part and a blood substance, to find what is wrong
scope: A blood test that checks for defences against a germ part, not a test of blood sugar and not a
  test of blood type.
examples:
- The complement fixation test showed she had made defences against the germ.
- Doctors used a complement fixation test to find what was wrong.
