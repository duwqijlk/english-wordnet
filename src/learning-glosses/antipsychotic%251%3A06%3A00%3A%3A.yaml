simpleMeaning: a calming drug used to treat serious mental illness when a quiet, settled state is wanted
scope: 'Also called antipsychotic agent, antipsychotic drug, major tranquilizer, major tranquilliser,
  major tranquillizer, neuroleptic, neuroleptic agent and neuroleptic drug: a calming drug for serious
  mental illness, not a drug for sleep and not a drug that lifts low mood.'
examples:
- The doctor prescribed an antipsychotic to calm the voices he heard.
- She takes an antipsychotic each day to keep her thoughts steady.
