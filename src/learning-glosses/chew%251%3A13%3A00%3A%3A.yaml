simpleMeaning: a small lump of something a person can bite again and again, such as tobacco
scope: This is the lump kept in the mouth, not the act of biting and grinding food in the mouth and not
  the verb for that act.
examples:
- He put a chew of tobacco in his mouth.
- He bought a fresh chew at the shop.
