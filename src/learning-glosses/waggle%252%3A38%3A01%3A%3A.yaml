simpleMeaning: to move in a wobbly way, weaving or rolling from side to side
scope: To move in a wobbly way, weaving or rolling, not to shake fast and not to walk in a straight line.
examples:
- The dog waggled its tail from side to side.
- He waggled the stick to and fro.
