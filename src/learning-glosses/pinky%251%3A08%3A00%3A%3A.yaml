simpleMeaning: the finger at the far edge of the hand, away from the thumb
scope: This is the finger farthest from the thumb; pinkie is another name for this sense; not the thumb
  itself, and not any other finger.
examples:
- She broke her pinky when she caught it in the door.
- He raised his pinky as he lifted the cup.
