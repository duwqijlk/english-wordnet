simpleMeaning: work hard and without stopping, even in an intrusive way, to achieve a goal or to campaign
  for a cause or a person
scope: This is relentless effort for a cause, not physical pushing or squeezing.
examples:
- The union pressed for higher wages for months.
- She kept pressing the council to fund the shelter.
