synsetId: 13657765-n
simpleMeaning: In electricity, how much charge a capacitor holds when each of its two plates holds 1 coulomb
  of opposite charge and the plates sit 1 volt apart
scope: A unit of electric charge storage, not a volt and not a coulomb.
examples:
- This capacitor is rated at one farad.
- A farad is a large unit, so most capacitors are rated in microfarads.
