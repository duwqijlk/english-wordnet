simpleMeaning: the middle part of the lens (the clear part inside the eye), with the cortex (its outer
  part) around it
scope: The middle part of the lens inside the eye. It is not the middle part of a cell, not the centre
  of an atom, and not a group of nerve cells in the brain.
examples:
- The nucleus sits in the centre of the lens of the eye.
- As we grow older, the nucleus of the lens can become hard.
