simpleMeaning: The government picks a person to look into complaints made by ordinary people against it
scope: A person picked by the government to look into complaints by ordinary people against it, not only
  a man in this job and not a judge who tries cases in court.
examples:
- The ombudsperson took up his complaint against the housing office.
- She asked the ombudsperson to look into the delay.
