simpleMeaning: One of many threads that can pull tight and make up a striped muscle thread.
scope: One of many threads that pull tight in a striped muscle thread; myofibril is another name for this,
  and it is not the whole muscle or a nerve thread.
examples:
- Each myofibrilla can pull tight.
- Myofibrillae make up the striped muscle thread.
