simpleMeaning: 'New life begun when the male and female cells join: sperm and egg in animals, pollen and
  ovule in plants.'
scope: 'Also called fecundation, fertilisation, or impregnation: new life begun when male and female cells
  join, in animals or in plants, not the making of soil rich with manure.'
examples:
- Fertilization joins the male and female cells to start new life.
- In plants, fertilization happens when pollen meets the ovule.
