simpleMeaning: A shrubby tree found widely along tropical shores; it gives a light tough wood for canoe
  outriggers and a fibre for rope and caulk, and is often grown for looks.
scope: A shrubby shore tree with useful wood, also called balibago, mahagua, mahoe, majagua, and purau.
examples:
- Hibiscus tiliaceus shaded the beach path.
- They wove rope from the fibre of Hibiscus tiliaceus.
