simpleMeaning: a program already changed into computer code and put together, ready to run on one system
  that runs a computer; it will not run on a different such system
scope: 'Also called binary program: a ready-to-run computer program made for one system, not a pair of
  stars that move around each other.'
examples:
- Download the binary for your computer system and run it.
- This binary works on Windows but not on a Mac.
