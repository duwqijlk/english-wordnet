simpleMeaning: the brown colour of the nuts that grow on those trees
scope: The brown colour of the nuts that grow on those trees; not the tree, not the nut itself, not the
  hard spot on a horse's leg, and not the wood.
examples:
- Her hair was chestnut in the sun.
- The chestnut of the old door matched the floor.
