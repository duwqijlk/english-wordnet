senseId: 'supposal%1:09:01::'
synsetId: 05787709-n
simpleMeaning: the act of thinking that something may be true, without knowing that it is true
scope: Thinking that something may be true without knowing it, with supposition as another name for this
  sense, not a fact you know and not a guess made with no thought.
examples:
- His supposal that the road was open turned out to be wrong.
- The whole plan rested on a supposal, not on proof.
