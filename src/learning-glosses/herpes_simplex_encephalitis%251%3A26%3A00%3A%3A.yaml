simpleMeaning: Usually striking the sides and the front of the brain, this common kind of sudden brain
  swelling is brought on by the cold-sore germ.
scope: People also call this common brain swelling acute inclusion body encephalitis and herpes encephalitis,
  and it usually strikes the sides and front of the brain.
examples:
- The scan showed herpes simplex encephalitis in the front of her brain.
- The cold-sore germ caused her herpes simplex encephalitis.
