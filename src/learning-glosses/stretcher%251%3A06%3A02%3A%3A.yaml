simpleMeaning: A tool with moving parts that makes a thing bigger, such as shoes or gloves, by pulling
  it out.
scope: A tool that makes a thing bigger by pulling it out, not a bed for carrying the sick and not a wood
  frame for a painting.
examples:
- He put the stretcher in his shoes to make them larger.
- The stretcher made her gloves a little bigger.
