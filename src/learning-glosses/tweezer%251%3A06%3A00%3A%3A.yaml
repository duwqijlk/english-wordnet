simpleMeaning: A hand tool for holding things, made of two joined strips that you press together so the
  ends grip the thing
scope: This hand tool is also called pincer, pair of pincers, and pair of tweezers; it is for holding
  and grasping things with the hand, not for cutting.
examples:
- She used tweezers to pull out the tiny splinter.
- He picked up the small screw with the tweezers.
