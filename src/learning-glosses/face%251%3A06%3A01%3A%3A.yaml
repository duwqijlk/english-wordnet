simpleMeaning: the side of a thing that you actually use, usually its most important and most visible
  surface.
scope: This is the working surface of an object, not a person's body part and not a twisted expression.
examples:
- Clean the face of the watch with a soft cloth.
- The face of the hammer was worn smooth.
