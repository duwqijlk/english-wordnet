senseId: 'thickening%1:25:00::'
synsetId: 13918679-n
simpleMeaning: a part of something that has become bigger and wider than the parts around it
scope: This is a part that has grown bigger and wider, not the act of making a liquid less runny and not
  a thing added to a liquid to make it less runny.
examples:
- The doctor found a thickening in the wall of the artery.
- There was a small thickening on the stem of the plant.
