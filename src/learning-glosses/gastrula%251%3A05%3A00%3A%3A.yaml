simpleMeaning: An early embryo stage with two cell layers, formed when a hollow ball of cells folds inward;
  its outer layer becomes skin and nerves, its inner layer, muscle and gut.
scope: The two-layered embryo stage after the hollow blastula; not the blastula itself, the earlier single-walled
  ball of cells.
examples:
- By the third day, the embryo had reached the gastrula stage.
- Cells at one end of the gastrula folded inward to form a second layer.
