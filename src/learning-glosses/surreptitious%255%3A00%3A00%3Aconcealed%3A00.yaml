senseId: surreptitious%5:00:00:concealed:00
synsetId: 02096119-s
simpleMeaning: Done in a quiet, careful, secret way, with great care not to be seen.
scope: Done quietly and in secret to avoid being seen, also called sneak, sneaky and furtive, and not
  done openly or with a hidden plan.
examples:
- He took a surreptitious glance at his watch.
- She made a surreptitious visit to the house at night.
