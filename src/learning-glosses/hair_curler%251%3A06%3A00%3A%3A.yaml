simpleMeaning: A tube-shaped tool that winds strands round it to make them wavy.
scope: This is a tube-shaped tool that winds strands round it to make them wavy, not a brush or a comb;
  also called roller, curler, and crimper.
examples:
- She put a hair curler in her fringe.
- He left the hair curler in overnight.
