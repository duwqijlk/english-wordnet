simpleMeaning: A green living thing that gets water and food from the air and rain and most often grows
  on another green living thing without feeding on it.
scope: 'Also called an aerophyte, an air plant and an epiphyte: a green living thing that gets water and
  food from the air and rain and most often grows on another green living thing without feeding on it,
  not a thing that feeds on its host and not a thing that grows in soil.'
examples:
- The epiphytic plant grows on a tree but does not feed on it.
- An epiphytic plant gets its water from the air and rain.
