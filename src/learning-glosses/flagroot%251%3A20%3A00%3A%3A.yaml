simpleMeaning: A marsh plant that lives for years, with sword-like leaves and sweet-smelling underground
  parts.
scope: A marsh plant that lives for years, with sword-like leaves and sweet-smelling underground parts;
  calamus and myrtle flag are other names for this sense, not a marsh plant with round leaves, and not
  a garden herb.
examples:
- Flagroot grows in the marsh with sword-like leaves.
- The flagroot roots smell sweet when crushed.
