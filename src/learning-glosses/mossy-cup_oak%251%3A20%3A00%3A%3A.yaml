simpleMeaning: The egg-shaped acorns of this medium-to-large oak sit deep in big fringed cups; it sheds
  its leaves each year in central and eastern North America and yields tough, tight-grained wood.
scope: 'Another name for bur oak and mossycup oak: the central and eastern North American oak whose acorns
  sit in fringed cups; not a moss-covered tree and not a different oak species.'
examples:
- A mossy-cup oak stands at the edge of the pasture.
- The mossy-cup oak's acorns sit deep in big fringed cups.
