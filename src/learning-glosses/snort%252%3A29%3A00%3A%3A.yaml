simpleMeaning: to make a loud sound by breathing out hard through your nose
scope: This is just making the sound by breathing out hard; it does not by itself show low respect, and
  it is not the noun for the sound.
examples:
- The horse snorted, pushing air hard out of its nose.
- The pig snorted loudly as it pushed its nose into the earth.
