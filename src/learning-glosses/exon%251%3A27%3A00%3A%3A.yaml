simpleMeaning: a part of a gene's DNA that is copied into the instructions for making a protein
scope: This is a coding part of a gene; not an intron, the part cut out before a protein is made, and
  not the whole gene.
examples:
- Exons carry the parts of a gene that code for a protein.
- The exon was copied when the gene was read.
