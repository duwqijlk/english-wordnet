simpleMeaning: showing good judgment and common sense when you deal with real, everyday matters
scope: This sense is about making good choices in practical, everyday matters. It is not the broader sense
  of having deep knowledge and seeing what is true in general.
examples:
- It was a wise decision to save some money each month.
- A wise use of time is to finish the hard work first.
