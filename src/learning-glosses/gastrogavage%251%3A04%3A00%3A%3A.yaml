simpleMeaning: Giving food in liquid form into the stomach through a tube passed through a hole made by
  an operation.
scope: This is giving food in liquid form into the stomach through a tube passed through a hole made by
  an operation, not eating by mouth and not feeding through a tube in the nose.
examples:
- The nurse started gastrogavage when he could not swallow.
- Gastrogavage gave him the food he needed.
