simpleMeaning: The United States office that runs the nation's plans for better homes and for making old
  city areas new again, set up in 1965.
scope: The United States office for homes and city renewal, also called the Department of Housing and
  Urban Development and Housing and Urban Development; not a state office and not a builder.
examples:
- HUD gave money to fix up homes in the old part of town.
- The city asked HUD for help with new homes.
