simpleMeaning: A line of rulers from one family, who ruled China from twelve seventy-nine to thirteen
  sixty-eight.
scope: Also called Yuan and the Mongol dynasty, this is the line of rulers of China from twelve seventy-nine
  to thirteen sixty-eight, not the line that came after it.
examples:
- The Yuan dynasty began in twelve seventy-nine.
- The Yuan dynasty ended in thirteen sixty-eight.
