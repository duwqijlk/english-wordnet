simpleMeaning: Computer programs that let a set of people work on the same facts together even when they
  are in different places
scope: This is computer programs for people working together on the same facts, not a program for one
  person alone and not a way of sending messages.
examples:
- The team uses groupware to share notes across three towns.
- Our groupware lets us edit the same file at the same time.
