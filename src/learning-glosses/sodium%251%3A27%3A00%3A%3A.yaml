simpleMeaning: A silver soft waxy alkali-group metal, found a lot in natural compounds, especially in
  salt water, and in sea water and halite; it burns yellow and reacts violently in water.
scope: This is a soft silver metal of the alkali group, also called Na, atomic number 11, not any other
  metal nor table salt itself.
examples:
- Sodium burns with a yellow flame.
- Sodium is found in sea water.
