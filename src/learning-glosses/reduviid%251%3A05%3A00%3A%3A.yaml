simpleMeaning: Mostly it eats other insects, this long-legged true bug that hunts them; a few kinds drink
  the blood of mammals.
scope: Also called assassin bug, this long-legged true bug hunts other insects and lives mostly by eating
  them, though a few kinds drink the blood of mammals.
examples:
- A reduviid waited on the leaf.
- We found reduviids among the plants.
