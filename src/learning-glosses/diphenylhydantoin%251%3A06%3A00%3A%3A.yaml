simpleMeaning: a drug sold as Dilantin that treats epilepsy, the illness that causes fits, and does not
  make a person sleepy
scope: A drug sold as Dilantin that treats epilepsy, also called phenytoin, and not a drug that makes
  a person sleepy.
examples:
- The doctor gave her diphenylhydantoin to stop her fits.
- He takes diphenylhydantoin each day to keep epilepsy under control.
