simpleMeaning: A Eurasian lily with hanging flowers, usually lined and checked with purple or maroon on
  a pale ground, shaped like a medieval leper's bell; widely grown as an ornamental.
scope: Also called checkered daffodil, guinea-hen flower, leper lily and snake's head fritillary; a Eurasian
  lily with checked, hanging flowers, not a lily with plain flowers.
examples:
- Fritillaria meleagris grows in the damp meadow each spring.
- The Fritillaria meleagris in our garden has purple-checked bells.
