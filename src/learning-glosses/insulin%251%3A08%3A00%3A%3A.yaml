simpleMeaning: a substance made by the pancreas that helps the liver store sugar and helps the body's
  cells use sugar for energy
scope: A substance made by the pancreas that helps the body store and use sugar, not sugar itself and
  not a sweetener.
examples:
- The doctor gave him insulin to control his blood sugar.
- Without insulin, the body cannot use sugar well.
