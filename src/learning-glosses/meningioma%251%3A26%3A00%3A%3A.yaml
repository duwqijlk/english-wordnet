simpleMeaning: In the thin covers round the brain and the cord in the back grows a lump, most times slow
  to grow and at times able to spread harm.
scope: This lump grows in the thin covers round the brain and the cord in the back, most times slow to
  grow, not in the brain itself.
examples:
- They found a meningioma in the covers round the brain.
- The meningioma grew slowly.
