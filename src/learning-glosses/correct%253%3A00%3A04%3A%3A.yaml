simpleMeaning: right in what one thinks or decides
scope: This describes a person whose thinking or judgement is right, not an answer that is free from error
  or behaviour that is socially proper, and not the verb senses of adjusting or punishing.
examples:
- You were correct to warn us about the storm.
- History has shown her to be correct about the treaty.
