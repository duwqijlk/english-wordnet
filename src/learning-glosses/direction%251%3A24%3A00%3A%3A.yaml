simpleMeaning: This is the way something is placed in relation to other things, and the path along which
  it points or moves.
scope: It is about position in space and the path of movement, not about instructions or about who is
  in charge.
examples:
- The sign points in the direction of the station.
- The wind changed direction during the night.
