schema: oewn-learning-gloss-v2
senseId: 'agent%1:10:00::'
synsetId: 06343357-n
simpleMeaning: The role, in a sentence, of the living thing that starts or causes the action of the verb.
scope: This is a grammatical role inside a sentence, not a person who acts for someone else and not a
  thing that produces an effect.
examples:
- In 'The dog chased the ball', the dog is the agent of the action.
- Students often confuse the agent with the thing affected by the verb.
