simpleMeaning: a wild animal, usually one that hunts other animals, that people do not want around, like
  a coyote
scope: 'Another name for varmint: a wild animal people see as a pest, not a pet and not a farm animal.'
examples:
- The farmer called the coyote a varment and chased it from his land.
- Varmints like coyotes can kill farm animals at night.
