simpleMeaning: to use all the strength or power you have, and to work as hard as you can
scope: Also called strain. This means to work with all the strength you have, not to stretch out your
  body and not to make something bigger by adding a cheaper thing.
examples:
- He extended himself fully when he climbed the high mountain.
- The long race extended her more than any race before it.
