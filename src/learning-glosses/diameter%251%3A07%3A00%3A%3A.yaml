simpleMeaning: the length of a straight line that goes through the middle of a circle and joins two points
  on its edge
scope: This is the length or distance across a circle, not the straight line itself that goes across it.
examples:
- The diameter of the circle is ten centimetres.
- Measure the diameter to find how wide the round plate is.
