simpleMeaning: rude and impolite; not showing good manners.
scope: Rude or impolite behaviour toward other people; it is not a description of an uncultured or unrefined
  person, and not the broader idea of a society without civilization.
examples:
- He was uncivil to the waiter, refusing to say please or thank you.
- Her uncivil remarks about his accent made everyone at the table uncomfortable.
