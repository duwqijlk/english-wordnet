simpleMeaning: A style of building first made in northern France, spread through Europe between the 12th
  and 16th centuries, with tall thin upright piers, balancing buttresses, vaults and pointed arches.
scope: A building style of the Middle Ages, also called Gothic, not Romanesque, of northern France in
  the 12th to 16th centuries.
examples:
- Gothic architecture filled the cathedral with light.
- The pointed arches are typical of Gothic architecture.
