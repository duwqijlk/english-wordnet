simpleMeaning: A square sign with one mark, fixed to the front and back of a car to show that the one
  driving is new to it
scope: A square sign with one mark, fixed to the front and back of a car to show that the one driving
  is new to it; not a sign for a skilled driver, and not a sign on another kind of road user.
examples:
- The car had an L-plate at the front and back.
- She drove with an L-plate while she was learning.
