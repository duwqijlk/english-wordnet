simpleMeaning: a person who acts in a planned way to make others think well of them or to trick them
scope: A person who acts in a planned way to impress or trick others, not a person who acts in a natural
  way and not a person who is truly what they seem.
examples:
- The posturer spoke loudly about his wealth to impress the guests at the party.
- She saw through the posturer at once and knew he was only trying to trick people into liking him.
