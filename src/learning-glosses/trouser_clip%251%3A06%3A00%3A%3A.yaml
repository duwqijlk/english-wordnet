simpleMeaning: So leg coverings do not catch in the bicycle chain, this grip is worn round a cyclist's
  ankles.
scope: Also called bicycle clip, it is a grip worn round a cyclist's ankles to keep leg coverings out
  of the chain.
examples:
- The trouser clip round the cyclist's ankle kept the leg coverings clear of the chain.
- A trouser clip stops leg coverings from catching in the bicycle chain.
