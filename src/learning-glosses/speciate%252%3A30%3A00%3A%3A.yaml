schema: oewn-learning-gloss-v2
senseId: 'speciate%2:30:00::'
synsetId: 00119074-v
simpleMeaning: to change over a long time so that living things form a new kind, or fit their surroundings
  better
scope: 'Also called specialize and specialise: the slow change by which living things become a new kind,
  not the act of fitting a thing to one single purpose.'
examples:
- These finches speciated on the islands over thousands of years.
- The plants speciate slowly as they adapt to dry soil.
