simpleMeaning: A television indoors gets its picture through two rods that pull out and lean apart in
  a V.
scope: Unlike an outside aerial on a roof, this is a pair of rods used indoors with a television.
examples:
- The rabbit ears stood in a V on top of the television.
- The rabbit ears pulled out to pick up the signal.
