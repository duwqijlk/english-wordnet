simpleMeaning: a tool for raising a motor vehicle by the front or back bar
scope: A tool for raising a motor vehicle by the front or back bar, not a tool for fixing a wheel and
  not a tool for lifting a house.
examples:
- He used the bumper jack to lift the car by its bumper.
- The bumper jack raised the truck enough to change the tyre.
