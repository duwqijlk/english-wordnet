senseId: 'ostensive_definition%1:10:00::'
synsetId: 06757980-n
simpleMeaning: A way of saying what a word means by showing things the word is used for
scope: Saying what a word means by showing things it is used for, not by giving other words for it and
  not by listing its parts.
examples:
- An ostensive definition of 'red' is to point at a red apple.
- She gave an ostensive definition by holding up three cups.
