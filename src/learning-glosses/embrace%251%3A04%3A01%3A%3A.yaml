senseId: 'embrace%1:04:01::'
synsetId: 00181619-n
simpleMeaning: a close and loving acceptance of a person or thing, in a way that keeps them safe
scope: This is a loving acceptance of a person or idea that keeps them safe, not the act of holding someone
  in your arms, and not including something as part of a larger thing.
examples:
- His embrace of new ideas made the team try new ways of working.
- She felt safe in the warm embrace of her family.
