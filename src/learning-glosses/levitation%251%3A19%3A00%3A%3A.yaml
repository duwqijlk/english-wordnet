simpleMeaning: A person or thing seen to rise into the air, as if by powers beyond nature.
scope: A person or thing seen to rise into the air by powers beyond nature; not a body lifted in a seance,
  and not a light thing rising on its own.
examples:
- Reports of levitation spread through the village after the storm.
- The saint's levitation was told as a wonder.
