senseId: 'megabyte%1:23:01::'
synsetId: 13649707-n
simpleMeaning: a unit for measuring information in computers, equal to 1000 kilobytes (units of 1000 bytes)
  or 1,000,000 bytes
scope: This unit is 1,000,000 bytes, counted with 1000 kilobytes. It is not the other unit with the same
  name that is 1,048,576 bytes, counted with 1024 kibibytes.
examples:
- The disk maker lists the space as 500 megabytes, each one equal to 1,000,000 bytes.
- The download is 10 megabytes in the 1000-kilobyte count.
