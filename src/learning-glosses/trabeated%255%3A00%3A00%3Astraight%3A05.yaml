simpleMeaning: with no curves, using straight beams that lie flat across the top instead of arches
scope: This describes a building with straight beams lying flat across the top instead of arches; trabeate
  is another name for it, and it is not a building with curved arches.
examples:
- The trabeated hall has straight beams across the tops of its columns.
- A trabeated roof rests on flat beams rather than on arches.
