simpleMeaning: Holding its green outer leaves and pollen-making parts, this part of a flower takes the
  shape of a small bowl, a ring, or a tube, as in roses.
scope: Also called calyx tube and hypanthium, this is a part of a flower that holds its leaves and pollen
  parts, not a petal and not a stem.
examples:
- The floral cup sits below the petals of the flower.
- A floral cup holds the green leaves of the blossom.
