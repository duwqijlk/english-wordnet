simpleMeaning: to make a bad slip when with other people, by saying or doing the wrong thing, or by making
  a big error
scope: 'Also called sin, blunder, boob or goof: to make a serious mistake or a rude slip, not to let a
  ball fall in a game.'
examples:
- He dropped the ball when he asked the new boss about her old job.
- She dropped the ball during the job interview and never got the post.
