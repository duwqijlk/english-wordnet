simpleMeaning: A cold and distant way of acting toward people, showing no warmth or care for them.
scope: 'Also called aloofness: a cold and distant way of acting toward people, not the fact of being far
  off in place or time.'
examples:
- Her remoteness made it hard for new neighbours to talk to her.
- His remoteness at the meeting left everyone feeling shut out.
