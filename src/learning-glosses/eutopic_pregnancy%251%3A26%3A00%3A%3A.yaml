simpleMeaning: carrying a baby in the womb, where it grows in the usual place
scope: Carrying a baby in the womb, in the usual place, not a pregnancy outside the womb and not a pregnancy
  that ends before the baby can live.
examples:
- Her eutopic pregnancy went well, with the baby growing in the womb.
- The scan showed a eutopic pregnancy, the baby safe in the usual place.
