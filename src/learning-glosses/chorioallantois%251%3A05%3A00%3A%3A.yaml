simpleMeaning: Joined to the wall of the allantois, the chorion makes a thin skin round an unborn baby,
  full of blood tubes
scope: It joins the chorion to the wall of the allantois round an unborn baby; also called chorioallantoic
  membrane, not the chorion on its own and not the allantois on its own.
examples:
- The chorioallantois is full of blood tubes.
- The chorioallantois joins the chorion to the wall of the allantois.
