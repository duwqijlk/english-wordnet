simpleMeaning: done or used in the usual way, as people normally do
scope: Done or used in the usual way, as people normally do; also called accustomed or customary, and
  not a fixed habit one cannot break, and not simply often.
examples:
- His habitual morning walk took him past the bakery.
- Her habitual comment always made us smile.
