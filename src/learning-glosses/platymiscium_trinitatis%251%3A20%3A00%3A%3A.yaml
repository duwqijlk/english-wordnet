simpleMeaning: A large tree of Trinidad and Guyana, with odd leaflets, side clusters of violet-scented
  yellow flowers and long smooth pods, grown as a show tree in parks and large gardens.
scope: Also called roble; a large tree of Trinidad and Guyana with yellow flowers, not a palm and not
  a timber tree.
examples:
- Platymiscium trinitatis grows tall in the parks of Trinidad.
- The yellow flowers of Platymiscium trinitatis smell of violets.
