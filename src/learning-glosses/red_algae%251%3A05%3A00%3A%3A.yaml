simpleMeaning: Things that live in the sea whose green is hidden under a crimson or violet colour, and
  from which agar, a setting jelly, and carrageenan, a food thickener, are taken.
scope: These sea growths hide their green under a crimson or violet colour and give agar and carrageenan,
  unlike green sea growths that show their green.
examples:
- Red algae are the source of the jelly used to set food.
- The cook used red algae to set the jelly.
