simpleMeaning: A poisonous climbing plant from the Old World that lives for many years, has violet flowers
  and oval coral-red berries, and grows as a common weed in North America
scope: Also called bittersweet nightshade, climbing nightshade, deadly nightshade, poisonous nightshade
  and woody nightshade. This is the poisonous Old World climbing plant, not the North American bush with
  yellow cases and red seeds, and not the taste that is both bitter and sweet.
examples:
- Bittersweet grew over the fence, with violet flowers and coral-red berries.
- She was told not to eat the berries of the bittersweet because the plant is poisonous.
