simpleMeaning: The fact that a thing does not let rays of light or other such energy pass through it.
scope: Not the degree to which a thing cuts down light passing through it, and not the state of being
  hard to make sense of because the meaning is hidden.
examples:
- The opacity of the metal plate stopped the rays from passing through.
- They tested the opacity of the glass to the rays.
