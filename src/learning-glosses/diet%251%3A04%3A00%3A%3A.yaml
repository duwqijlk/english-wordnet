simpleMeaning: the act of eating less food, or less of certain foods, on purpose
scope: The act of eating less food on purpose, not a set of foods ordered by a doctor, not the food a
  person or animal usually eats, and not a law-making body.
examples:
- She went on a diet to lose weight.
- The doctor put him on a strict diet after the illness.
