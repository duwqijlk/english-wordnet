simpleMeaning: any set-up made quickly at the time, to be used only for a short time
scope: A quick, short-time set-up for a need at hand, not a plan made to trick people and not a useful
  tool made for one special job.
examples:
- We used a box and a rope as a contrivance to hold the door open for the day.
- His contrivance of sticks and cloth gave them shade for the afternoon.
