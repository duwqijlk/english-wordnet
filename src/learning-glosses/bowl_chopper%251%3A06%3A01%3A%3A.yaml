scope: Also called a bowl cutter, this is the machine that cuts meat into small bits for making food and
  also mixes it, breaks it down, and turns it into a smooth blend.
examples:
- The bowl chopper cut the meat into small bits before it was mixed.
- We used the bowl chopper to mix and smooth the meat.
