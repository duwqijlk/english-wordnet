simpleMeaning: In British informal talk, very smart and in the latest fashion
scope: Also called swagger, this describes clothes or a style that look smart and in fashion, not music
  that is excellent and not a long cut in a surface.
examples:
- She wore groovy clothes to the party in London.
- His groovy new jacket made him stand out from the crowd.
