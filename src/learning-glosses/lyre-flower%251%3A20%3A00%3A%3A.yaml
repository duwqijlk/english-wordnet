simpleMeaning: A garden plant with blooms shaped like hearts, hanging down in deep pink
scope: Also called bleeding heart and lyreflower, this is a garden plant with deep-pink hanging blooms
  shaped like hearts, not a plant with upright pale flowers.
examples:
- The lyre-flower in the back garden hung its deep-pink blooms over the path.
- She planted a lyre-flower beside the fence for its heart-shaped blooms.
