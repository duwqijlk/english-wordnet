simpleMeaning: a fold in cloth made by turning the cloth back on itself and then pressing or sewing it
  into shape
scope: 'Also called pleat: a fold in cloth made by turning the cloth back on itself and pressing or sewing
  it; not a braid of hair and not the act of weaving.'
examples:
- The dress had a neat plait down the front.
- She pressed a plait into the skirt.
