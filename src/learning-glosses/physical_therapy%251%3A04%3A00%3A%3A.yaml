simpleMeaning: This care works on the body with exercise, rubbing, and other such ways
scope: Also called physiotherapy or physiatrics, this care uses exercise and rubbing and other such ways,
  not a drug treatment and not an operation.
examples:
- She goes to physical therapy twice a week for her bad knee.
- His physical therapy mixed exercise and rubbing after the operation.
