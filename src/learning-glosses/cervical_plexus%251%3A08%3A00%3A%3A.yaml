simpleMeaning: A net of nerves that lies under the big muscle at the side of the neck.
scope: A net of nerves under the big neck muscle, not a single nerve and not a muscle; plexus cervicalis
  is another name for this sense.
examples:
- The cervical plexus supplies feeling to the skin of the neck.
- Damage to the cervical plexus can numb the side of the neck.
