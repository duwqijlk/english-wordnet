simpleMeaning: A bleeding illness from birth, caused by too little of a blood part called factor VIII,
  found almost only in men.
scope: 'Also called classical haemophilia, classical hemophilia, or haemophilia A: a bleeding illness
  from birth, caused by too little of a blood part called factor VIII, found almost only in men, close
  to other bleeding illnesses from birth that lack a different blood part.'
examples:
- Hemophilia A runs in his family, and he bruises easily.
- The boy with hemophilia A needs care when he bleeds.
