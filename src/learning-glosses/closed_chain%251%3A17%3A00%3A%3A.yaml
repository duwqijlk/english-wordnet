simpleMeaning: In chemistry, atoms in a molecule joined end to end so they form a loop.
scope: This is atoms in a molecule joined end to end so they form a loop; ring is another name for this
  sense, not a line of atoms left open at the ends and not a branch with side arms.
examples:
- The closed chain in the molecule links every atom back to the first.
- Benzene has a closed chain of six carbon atoms.
