simpleMeaning: Rare brain inflammation, long-lasting and worsening, from measles virus, hitting mostly
  kids, then young folk, after the first-time measles episode before two, with death usually by three
  years.
scope: Also called inclusion body encephalitis, sclerosing leukoencephalitis, subacute inclusion body
  encephalitis, and subacute sclerosing leukoencephalitis, this is a rare brain inflammation, long-lasting
  and worsening, from measles virus, hitting mostly kids, then young folk, after the first-time measles
  episode before two, with death usually by three years, where inclusion body encephalitis is a rare,
  long-lasting brain swelling from measles virus that slowly worsens, hitting mostly kids, then young
  adults, following a first-time measles bout before two, usually deadly in three years.
examples:
- Subacute sclerosing panencephalitis is deadly.
- Cases of subacute sclerosing panencephalitis are rare.
