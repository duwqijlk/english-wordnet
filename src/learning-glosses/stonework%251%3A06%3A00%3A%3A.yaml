simpleMeaning: work that uses stone to build something, or the stone parts of something built
scope: This is work that uses stone to build something, or the stone parts of something built. It is not
  loose stone by itself, and not building work done with brick.
examples:
- The old church has fine stonework around its doors.
- Workers repaired the stonework on the bridge.
