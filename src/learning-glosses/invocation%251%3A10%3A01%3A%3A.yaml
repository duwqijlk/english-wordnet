simpleMeaning: words said as a spell to call up a devil and make it appear
scope: This sense is spell words used to call up a devil, not a prayer at the start of a meeting and not
  a formal request for help.
examples:
- The old book warned that the invocation could call up a devil.
- He spoke the invocation slowly, hoping the devil would appear.
