simpleMeaning: a nose that has grown big, with wide openings in the skin, redness, and blood vessels that
  show clearly, often found in people who drink far too much alcohol
scope: 'Also called brandy nose, copper nose, hammer nose, potato nose, rhinophyma, rum-blossom, rum nose,
  or toper''s nose: a big red nose with open skin pores and clear blood vessels, not a cold and not a
  broken nose.'
examples:
- Years of heavy drinking left him with hypertrophic rosacea.
- Her hypertrophic rosacea made her nose large and red.
