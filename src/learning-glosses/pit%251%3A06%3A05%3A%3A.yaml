simpleMeaning: In a commodity exchange (a place where goods are bought and sold), the part of the floor
  where people buy and sell one kind of goods
scope: In a commodity exchange, the part of the floor for buying and selling one kind of goods, not the
  area beside a race track and not the low area in front of a stage.
examples:
- Traders stood in the pit and shouted prices for wheat.
- Business in the corn pit was loud and fast that morning.
