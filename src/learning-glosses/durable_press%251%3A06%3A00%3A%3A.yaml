simpleMeaning: A cloth that has been treated with chemicals so it stays smooth and keeps its shape
scope: A cloth that stays smooth, also called permanent press; not untreated cloth and not cloth that
  needs ironing.
examples:
- This shirt is made of durable press, so it stays smooth after washing.
- Durable press keeps its shape without ironing.
