simpleMeaning: Worn in hot countries, this light covering for the head keeps the sun off
scope: Also called a pith helmet, a topee or a topi, this light covering for the head is worn in hot countries
  to keep the sun off, not a heavy hat for cold weather.
examples:
- He wore a pith hat in the midday sun.
- Her pith hat kept the sun off her face.
