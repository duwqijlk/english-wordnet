senseId: bigoted%5:00:00:intolerant:00
synsetId: 02445998-s
simpleMeaning: holding on to a belief or view without thinking and without giving up, and not willing
  to accept people who think in a different way
scope: This describes a person fixed on their own belief and not accepting of others, not just a person
  with a strong view or a rude act.
examples:
- His bigoted views made him refuse to listen to anyone from another faith.
- She was so bigoted that she would not work with people who disagreed with her.
