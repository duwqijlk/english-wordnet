simpleMeaning: A small or mid-sized fighting ship with steel plates round its sides and deck, armoured
  in the same way as another kind of fighting ship.
scope: A fighting ship with a steel belt and deck, armoured in the same way as an armored cruiser.
examples:
- After 1930, most naval powers built light cruisers up to the limits the treaty allowed.
- The light cruiser patrolled the coast with its steel belt and deck.
