simpleMeaning: shaped like the top of a castle wall, with the same square notches cut into it again and
  again
scope: 'Also called castellated, castled, crenelated, and embattled: a thing shaped with the same square
  notches as a castle wall, not a wall built for defence and not a plain flat edge.'
examples:
- The battlemented edge of the roof gave the house the look of a small castle.
- She drew a battlemented border of square notches round the top of the tower.
