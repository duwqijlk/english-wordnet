simpleMeaning: The heat of the body goes up and down with the heat around it, in animals other than birds
  and mammals
scope: 'Also called ectothermic, heterothermic, and poikilothermous: said of animals other than birds
  and mammals, whose body heat goes up and down with the heat around them, not of birds and mammals, whose
  body heat stays steady.'
examples:
- Frogs are poikilothermic, so their body heat falls on a cold night.
- A poikilothermic lizard warms up when it lies in the sun.
