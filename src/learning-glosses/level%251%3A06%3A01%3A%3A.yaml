simpleMeaning: one floor of a building, made up of a room or set of rooms standing at the same height
  as each other
scope: This is a floor of a building, not a tool for checking flat surfaces, a non-physical layer, or
  a word for flat.
examples:
- The restaurant is on the top level of the shopping center.
- Parking is available on the lower level of the building.
