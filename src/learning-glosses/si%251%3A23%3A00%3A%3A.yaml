simpleMeaning: A complete metric set of units for scientists, with base amounts of length, mass, time,
  electric current, temperature, matter, and light, in metres, kilos, seconds, amps, kelvins, moles, and
  candelas.
scope: The metric set of units for scientists, not a single unit and not an old set of measures; also
  called the International System, the International System of Units, the SI system, an SI unit, Systeme
  International, and Systeme International d'Unites.
examples:
- Scientists use SI for all their measures.
- SI gives scientists one set of units to use.
