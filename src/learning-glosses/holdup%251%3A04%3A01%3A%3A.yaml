simpleMeaning: the act of making something late, by doing nothing so that a thing is put off until a later
  time
scope: 'Also called delay: a wait that makes something late, not a robbery in which money is taken with
  a gun.'
examples:
- A holdup at the airport made our flight leave two hours late.
- Road works caused a long holdup on the way to work.
