simpleMeaning: In Mexico and in Central and South America, a sickness leaves sores on the skin and on
  the wet lining inside the body, and nowhere else.
scope: This sickness, also called leishmaniasis americana and nasopharyngeal leishmaniasis, leaves sores
  only on the skin and on the wet lining inside the body.
examples:
- The sores of mucocutaneous leishmaniasis stayed on the skin and did not spread deeper.
- This sickness, mucocutaneous leishmaniasis, is found in Mexico and in Central and South America.
