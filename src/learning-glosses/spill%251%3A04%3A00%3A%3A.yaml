simpleMeaning: the act of letting a liquid or gas get out
scope: 'Also called release: the act of letting a liquid or gas get out. It is not the liquid that has
  got out, and not a way for water to pass a dam.'
examples:
- The oil spill was caused by a hole in the ship.
- After the spill of gas from the pipe, they closed the road.
