simpleMeaning: above the line where the earth and sky seem to meet, said of the sun, the moon or a star,
  for example
scope: This sense is about the sun, the moon or a star being above the line where earth and sky meet,
  not about bread getting bigger or a person getting up.
examples:
- We watched the risen sun light up the hills.
- The risen moon shone over the sea.
