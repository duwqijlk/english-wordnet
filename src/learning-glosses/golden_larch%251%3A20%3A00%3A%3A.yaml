simpleMeaning: A Chinese cone-bearing tree that loses its leaves in autumn and looks like the tree it
  is named after, with bright yellow leaves.
scope: A Chinese cone-bearing tree that loses its leaves in autumn and has bright yellow leaves, not an
  evergreen pine and not a true larch.
examples:
- The golden larch turned bright yellow in autumn.
- A golden larch stood beside the garden wall.
