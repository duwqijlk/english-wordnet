simpleMeaning: a dry material that gives color, especially a powder to be mixed with a liquid to make
  paint or a like thing
scope: A dry coloring material, especially a powder for mixing, not paint already mixed as a coating and
  not the natural color matter in a plant or animal body.
examples:
- The artist ground the pigment into a fine powder.
- Add the pigment to the oil to make paint.
