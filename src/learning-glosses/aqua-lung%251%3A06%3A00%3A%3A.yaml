simpleMeaning: A device that lets divers breathe under water; its other name, scuba, is short for self-contained
  underwater breathing apparatus.
scope: Also called scuba and aqualung; a device that lets divers breathe under water, not a snorkel that
  reaches only the surface and not an air tank used on land.
examples:
- She put on her Aqua-Lung and slipped under the water.
- With an Aqua-Lung, a diver can stay down for an hour.
