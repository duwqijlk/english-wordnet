simpleMeaning: In Hinduism, twin gods who drive a chariot and carry the sun god Surya; their name means
  'possessing horses' in Sanskrit.
scope: Twin gods of Hindu story who drive a chariot and carry the sun god Surya, set apart from other
  Hindu gods and from human chariot drivers.
examples:
- The Asvins drive their chariot across the sky at dawn.
- In the old hymns, the Asvins carry Surya on his daily path.
