simpleMeaning: a unit that shows the share of gold in a mix of gold with other metals; 18 out of 24 parts
  is 75% gold, and 24 parts is pure gold
scope: 'Also called karat and kt: this unit shows the share of gold in a mix of gold with other metals,
  not the unit of weight used for precious stones.'
examples:
- This ring is made of 18-carat gold.
- Pure gold is 24-carat gold.
