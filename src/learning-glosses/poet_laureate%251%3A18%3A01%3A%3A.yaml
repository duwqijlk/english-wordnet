schema: oewn-learning-gloss-v2
senseId: 'poet_laureate%1:18:01::'
synsetId: 10467159-n
simpleMeaning: A group or a place thinks of a writer of poems as holding a place of honour, though no
  formal act gave it
scope: This is a writer of poems only thought of as holding a place of honour in a group or a place, not
  one given a formal post in the royal house of Great Britain, and not any writer of poems.
examples:
- People call her the poet laureate of Arkansas, though no one gave her the title.
- Critics call him the poet laureate of all lyricists, though the name is only a mark of honour.
