simpleMeaning: to take what is learned from single cases and use it for wider cases
scope: 'Also called generalise: forming a wider idea from single cases, not just talking in broad words
  and not making something popular for the public.'
examples:
- From these three cases, she generalized a rule for all of them.
- Scientists generalized from the test results to all patients in the study.
