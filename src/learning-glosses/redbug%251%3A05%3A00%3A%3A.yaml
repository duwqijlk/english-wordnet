simpleMeaning: The young of a mite that sucks the blood of animals with backbones, including people, causing
  strong itching.
scope: Also called a jigger, a chigger, or a harvest mite, it is the young of a mite that sucks blood
  and causes strong itching.
examples:
- A redbug bit her ankle and it itched for days.
- Redbugs live in long grass and feed on the blood of animals.
