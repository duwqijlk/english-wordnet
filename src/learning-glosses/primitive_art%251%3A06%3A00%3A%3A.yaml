senseId: 'primitive_art%1:06:00::'
synsetId: 03867479-n
simpleMeaning: a kind of pictures and outdoor built work made by people with no training, who do not see
  themselves as makers of such work
scope: Also called naive art, outsider art, self-taught art, and vernacular art, this is work made by
  people with no training who do not see themselves as makers of such work, not work made by trained makers
  and not old art from long ago.
examples:
- Her primitive art hangs in the town hall, though she never went to art school.
- The show of primitive art brought together work by people who had never had a lesson.
