simpleMeaning: One of several kinds in the group Dipsacus, this herb grows wild in Europe, Asia, and Africa,
  its flower heads ringed with sharp-pointed leaf-like bits.
scope: Also called teasel and teasle, this is a herb of the group Dipsacus with sharp-pointed bits round
  its flower heads.
examples:
- A teazel grew wild.
- Sharp little spikes ringed the teazel's flower heads.
