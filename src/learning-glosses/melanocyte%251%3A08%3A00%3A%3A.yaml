simpleMeaning: under the sway of a body chemical that sets how dark the skin grows, a cell in the lowest
  skin layer makes the dark stuff that colours skin
scope: This cell makes the dark stuff that colours skin, and it is not the dark stuff itself.
examples:
- A melanocyte sits in the lowest skin layer.
- The melanocyte makes more of the dark stuff when the skin grows darker.
