simpleMeaning: to talk or act in a loving way with someone, without meaning it in a serious way
scope: 'Also called flirt, romance, and mash: talking or acting in a loving way without serious plans.
  Not the insect, not the swimming way, and not moving like that insect.'
examples:
- He spent the party butterflying from guest to guest, talking sweetly to each one.
- She was only butterflying with him and had no plan to meet him again.
