simpleMeaning: thinking hard about one's own navel, a saying that most often means being pleased with
  oneself and blind to others
scope: Thinking hard about one's own navel, a saying that most often means being pleased with oneself
  and blind to others; navel-gazing is another name for this sense, not thinking hard about a real problem
  and not daydreaming.
examples:
- His omphaloskepsis kept him from seeing the needs of others.
- Her omphaloskepsis left her pleased with herself and blind to what others needed.
