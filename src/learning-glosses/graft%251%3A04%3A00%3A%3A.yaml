simpleMeaning: the act of putting a part onto another thing to join them
scope: 'Also called grafting: this is the act of joining a part onto something else, not the piece of
  body tissue itself used in an operation, and not the verb for putting that tissue in place.'
examples:
- The graft of each young branch onto the old tree took great care and a sharp knife.
- This kind of graft is common with fruit trees, where a branch is put onto another tree.
