simpleMeaning: a passage built to let air into a place, as in a mine
scope: This is a passage that lets air move into a place, as in a mine. It is not a company that runs
  flights for people.
examples:
- The miners built a new airway to bring fresh air into the mine.
- A blocked airway stopped fresh air from reaching the workers in the mine.
