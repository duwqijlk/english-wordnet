simpleMeaning: A body-made compound with an -OH group stuck to a carbon bit, which in turn is twice-tied
  to one more carbon bit.
scope: An organic compound with a hydroxyl group on a carbon atom doubly tied to another carbon atom.
examples:
- Enols tie carbon bits twice.
- The enol holds an -OH group.
