simpleMeaning: A set of folk or things set by kind or class.
scope: This sense is also called classification, for a set of folk or things set by kind or class, unlike
  the sense for the mind's basic way of sorting things into kinds, and unlike the sense for the deed of
  sharing things out into kinds of one sort.
examples:
- The categorization is a set of things set by kind.
- Categorizations group things.
