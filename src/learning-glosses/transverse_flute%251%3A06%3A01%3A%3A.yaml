simpleMeaning: The concert flute of the West, also called the C flute or Boehm flute, blown from the side
  and made of metal or wood.
scope: This sense is the concert flute of the West, also called the C flute or Boehm flute, blown from
  the side and made of metal or wood, unlike the sense for a high-pitched woodwind, a slim tube shut at
  one end with finger holes at one end and a mouth hole near the shut end over which the breath is blown.
examples:
- A transverse flute played the tune.
- Transverse flutes are side-blown.
