simpleMeaning: A compass needle shows no dip at all along this made-up ring that runs level with the middle
  of the earth.
scope: Also called the magnetic equator, this names the made-up ring level with the middle of the earth,
  along which a compass needle shows no dip.
examples:
- Along the aclinic line, the needle showed no dip at all.
- Sailors crossed the aclinic line where the compass needle lay flat.
