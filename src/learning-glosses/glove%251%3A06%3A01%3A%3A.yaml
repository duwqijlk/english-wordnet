simpleMeaning: the covering for the hand worn by players in the field when they play baseball
scope: The hand covering worn by a player in the field in a baseball game; not a glove for daily wear
  or cold weather and not the thick glove worn for boxing.
examples:
- The fielder caught the ball in his glove.
- Each player on the field brought a glove and a bat to the game.
