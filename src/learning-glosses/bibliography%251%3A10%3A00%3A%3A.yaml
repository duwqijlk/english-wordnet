simpleMeaning: a list of writings that gives when and where each one was made public, such as the writings
  of one writer or the works used to make a document
scope: A list of writings with when and where they were made public; not one writing itself and not the
  story of a person's life.
examples:
- The bibliography at the end of her book lists every work she used.
- He made a bibliography of all the writings of one writer.
