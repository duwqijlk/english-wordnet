simpleMeaning: move through the water with a flapping leg kick, as if wearing broad foot paddles
scope: The verb for moving through water with a flapping leg kick; not the swimming shoe worn on the feet,
  nor the steadying blade on a ship.
examples:
- The diver finned along the reef, watching the fish.
- They finned across the pool to the far side.
