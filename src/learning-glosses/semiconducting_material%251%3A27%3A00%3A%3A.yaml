simpleMeaning: A substance like germanium or silicon whose power to carry current sits between a metal's
  and an insulator's, rising with heat and with impurities present.
scope: Also called semiconductor; for a substance like germanium or silicon that carries current between
  a metal and an insulator.
examples:
- Semiconducting materials carry current between metals and insulators.
- Semiconducting material conducts more with heat.
