simpleMeaning: a hard round piece of wood with grain running across it, in a board where a branch once
  grew out
scope: A hard round piece in a board, not a tied rope and not a soft bump in thread.
examples:
- The saw buckled when it hit a knot in the plank.
- The knot in the board made the wood hard to cut.
