senseId: 'marble_bones_disease%1:26:00::'
synsetId: 14233601-n
simpleMeaning: a sickness passed down in families that makes bones grow too thick and hard; in bad cases
  the hollow inside a bone that holds marrow can fill up and close
scope: 'Also called osteopetrosis: a sickness of the bones that makes them too thick, not a broken bone
  and not a sickness that weakens bones.'
examples:
- Her marble bones disease was found when a scan showed her bones were far too thick.
- In bad cases of marble bones disease, the hollow inside a bone can close up.
