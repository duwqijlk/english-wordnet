simpleMeaning: how much more or less money is spent when one more or one fewer thing is made
scope: How much more or less money is spent when one more or one fewer thing is made; not the price of
  one thing and not the whole sum spent to run a firm.
examples:
- The incremental cost of one more car was small.
- Managers watched the incremental cost as output rose.
