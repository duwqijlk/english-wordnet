simpleMeaning: to tell people about something in public by putting up large printed signs
scope: 'Also called bill: this is putting up large printed signs to tell people about something, not the
  sign itself.'
examples:
- They placarded the new play in windows all over town.
- Volunteers placarded the meeting by putting signs on walls near the station.
