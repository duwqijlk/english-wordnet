simpleMeaning: At times sight is lost altogether as a sickness of the eye harms the nerve carrying sight
  to the brain and makes sight worse.
scope: This eye sickness harms the nerve carrying sight to the brain and can take sight away at times.
examples:
- Glaucoma was found in his left eye.
- Glaucoma can take a person's sight away over time.
