simpleMeaning: A short written form of 'and other people', used instead of naming everyone in a group.
scope: The abbreviated citation form, standing for any of the three Latin plurals; not the separate phrase
  meaning 'and elsewhere'.
examples:
- The study by Chen et al. found no link between the two.
- Smith et al. reported similar results a year later.
