simpleMeaning: Its lower edge runs along the gaff and its front edge on the topmast, making a three-sided
  sail set along the line of the boat.
scope: Also called a gaff topsail, this names the three-sided sail set along the line of the boat, with
  its lower edge along the gaff and its front edge on the topmast.
examples:
- The fore-and-aft topsail caught the wind as the boat turned.
- They raised the fore-and-aft topsail before leaving the harbour.
