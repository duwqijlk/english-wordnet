simpleMeaning: In the shallow waters of northern seas, soft-finned fish swim in schools and are eaten
  as food; this is one of many kinds of them.
scope: Also called a clupeid fish, this is one of many kinds of soft-finned fish found in the shallow
  waters of northern seas.
examples:
- The clupeid swims with others of its kind in northern seas.
- People eat clupeids as food.
