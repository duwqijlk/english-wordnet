senseId: 'crossover%1:10:00::'
synsetId: 07046240-n
simpleMeaning: taking up a new style, especially in popular music, by mixing parts of different kinds
  of music so that more people will like it
scope: This is about taking up a new style, especially in popular music, by mixing different kinds of
  music so that more people will like it; it is not a path for crossing to the other side and not the
  sharing of parts between chromosomes.
examples:
- The band made a crossover album that mixed jazz and classical music.
- Her crossover song mixed country and pop and won many new fans.
