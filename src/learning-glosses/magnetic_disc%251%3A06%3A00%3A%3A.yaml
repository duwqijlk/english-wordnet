simpleMeaning: In computer science, a store for computer data in the form of a flat round plate with a
  thin coat that holds the data by a pull on iron
scope: In computer science, a store for computer data in the form of a flat round plate with a thin coat,
  not a paper file and not a tape; disc, disk and magnetic disk are other names for this sense.
examples:
- The old computer saved its files on a magnetic disc.
- She copied the data to a fresh magnetic disc.
