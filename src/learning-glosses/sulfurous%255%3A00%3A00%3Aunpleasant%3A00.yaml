simpleMeaning: very harsh and unkind in the way something is said or written
scope: 'Also called bitter, acid, acrid, blistering, caustic, virulent, acerbic, sulphurous, and vitriolic:
  for harsh words or tone. Not about hot wet air, and not about sulfur in a thing.'
examples:
- He wrote a sulfurous attack on the mayor in the paper.
- Her sulfurous words about her rival shocked everyone in the room.
