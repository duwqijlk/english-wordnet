simpleMeaning: 'Any of many large diving water birds found along the shore: eider, scoter, merganser'
scope: Any of many large diving water birds found along the shore, such as eider, scoter and merganser;
  not a dabbling bird that feeds at the top and not a goose.
examples:
- A sea duck dived for shellfish near the shore.
- Sea ducks gather along the coast in winter.
