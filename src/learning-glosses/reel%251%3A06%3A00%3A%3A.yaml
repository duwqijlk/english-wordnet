simpleMeaning: a round thing that thread, tape, film, or other things that bend easily can be wound around
scope: A round holder for winding thread, tape or film around, not the fishing tool with a handle on a
  rod and not a roll of film itself.
examples:
- She wound the cotton thread onto the reel.
- The tape sat on a large plastic reel in the cupboard.
