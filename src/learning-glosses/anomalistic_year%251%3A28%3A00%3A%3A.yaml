senseId: 'anomalistic_year%1:28:00::'
synsetId: 15226657-n
simpleMeaning: The time the earth takes to go round the sun and back to the point nearest the sun, 365
  days, 6 hours, 13 minutes and 53.1 seconds
scope: This is the earth's year counted from the point nearest the sun back to that point, and it lasts
  longer than 365 plain days.
examples:
- The anomalistic year ended when the earth came back to the point nearest the sun.
- An anomalistic year is a little longer than 365 days.
