simpleMeaning: a thick, dark, spiced spread made by cooking fruit down to a smooth paste
scope: A thick, dark spread of cooked fruit, not butter and not a jam with whole pieces of fruit in it.
examples:
- She spread apple butter on warm toast for breakfast.
- The jar of apple butter was dark and thick, with a warm spiced smell.
