simpleMeaning: In folklore, one of a group of fairies that are a little naughty and like to cause trouble
scope: 'Also called imp, elf, brownie, pixy, hob and gremlin: in old stories, a fairy that is a little
  naughty and likes to cause a little trouble. Not the small plant with white flowers of the same name.'
examples:
- In the story, a pixie hid the farmer's keys for fun.
- The children left milk outside for the pixies.
