simpleMeaning: With the outside covered in a web of thin little cracks, as on some glazed pots.
scope: A surface with a web of fine cracks, not the china itself and not the sound of snapping.
examples:
- She chose a crackle glaze for the vase.
- The crackle finish on the bowl was full of tiny cracks.
