simpleMeaning: a metal cover that runs to an opening that carries smoke or bad air away
scope: 'Also called a hood: a metal cover that sends smoke or bad air out through a vent, not a cover
  that keeps heat in and not a fan on its own.'
examples:
- The cook turned on the fan under the exhaust hood to clear the smoke.
- Grease had built up inside the exhaust hood above the stove.
