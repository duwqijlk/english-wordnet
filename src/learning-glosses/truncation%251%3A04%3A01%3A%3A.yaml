simpleMeaning: As in cutting a gem, a flat face takes the place of an edge or corner, most of all one
  sloping the same to the next faces.
scope: This is the flat face that takes the place of an edge or corner when a gem is cut.
examples:
- The truncation of the gem's corner left a flat face.
- After truncation, the gem had a flat face where the corner had been.
