simpleMeaning: to turn a screw or a screwed part the other way, so that it comes loose
scope: To loosen a thing by turning its screw the other way, not to pull it apart and not to screw it
  tighter.
examples:
- Unscrew the outlet plate before you paint the wall.
- He unscrewed the lid of the jar.
