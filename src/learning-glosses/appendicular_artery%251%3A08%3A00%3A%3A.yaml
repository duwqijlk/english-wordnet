simpleMeaning: Blood reaches the worm-shaped part at the end of the gut through this tube, which branches
  off the tube that feeds the gut.
scope: Also called arteria appendicularis, this tube branches off the one that feeds the gut and carries
  blood to the worm-shaped part at its end.
examples:
- The appendicular artery carries blood to the appendix.
- Damage to the appendicular artery can starve the appendix of blood.
