simpleMeaning: the quality of being serious in a calm way that earns respect
scope: A quality in a person or in how they act, not the serious feeling that a place or an event gives
  you.
examples:
- The judge spoke with great solemnity.
- Her solemnity made everyone in the room listen in silence.
