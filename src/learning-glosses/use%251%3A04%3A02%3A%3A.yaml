simpleMeaning: The act of cleverly or unfairly influencing people, especially to gain an advantage for
  oneself.
scope: This is not the ordinary act of employing an object for a purpose, and not the helpfulness or value
  of something.
examples:
- He got the job through the use of charm and flattery.
- The report exposed the use of pressure tactics by the company.
