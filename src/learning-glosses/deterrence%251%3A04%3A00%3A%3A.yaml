simpleMeaning: the act or way of putting people off doing something, or of stopping things from happening,
  by making people feel fear, doubt or worry
scope: This is the act or way of putting people off doing something, or of stopping things from happening,
  by making people feel fear, doubt or worry; it is not the punishment itself, and not stopping something
  by force.
examples:
- Deterrence works only if people believe the threat is real.
- The country relied on deterrence to keep its enemies from attacking.
