simpleMeaning: A vehicle that tips up to pour out its load without anyone lifting it out by hand
scope: A tipping vehicle for carrying loads, not a wagon that must be unloaded by hand.
examples:
- The farmer tipped the dumpcart to empty the soil onto the field.
- A dumpcart lets one person unload a heavy load without lifting it.
