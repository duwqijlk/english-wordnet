simpleMeaning: Dark berries, their juice, or their flavouring are soaked in spirits to make this sweet,
  strong drink.
scope: This sweet, strong drink, made by soaking dark berries, their juice, or their flavouring in spirits,
  is not a plain spirit with nothing added.
examples:
- Blueberry liqueur goes great simply on the rocks.
- She poured a little blueberry liqueur over the ice.
