simpleMeaning: without the knowledge and ability that a person trained for this kind of work should have
scope: 'Also called amateur, amateurish and inexpert: this sense is for work or a worker without a trained
  person''s knowledge and ability, not the wider sense where a job needs no special ability at all.'
examples:
- His unskilled painting had uneven lines and flat, dull colours.
- The unskilled repair broke again after only a week.
