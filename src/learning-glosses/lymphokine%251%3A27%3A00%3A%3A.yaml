simpleMeaning: a signal sent out by helper T cells when antigens stir them, that acts on other cells of
  the body's defence system, as by waking up germ-eating cells
scope: A signal sent out by helper T cells, not a hormone and not an antibody.
examples:
- The lymphokine helps other cells of the immune system respond to infection.
- Researchers measured the lymphokine released after the cells were stirred up by antigens.
