senseId: vitriolic%5:00:00:unpleasant:00
synsetId: 01807340-s
simpleMeaning: Harsh and stinging in tone.
scope: This sense is also called bitter, acid, acrid, blistering, sulfurous, caustic, virulent, acerbic,
  and sulphurous, for being harsh and stinging in tone, where bitter is very harsh and unkind in the way
  something is said or written, acid is very harsh and unkind in the way words are said or written, and
  acrid is words or a voice that cut and sting, the way acid eats into what it touches, where sulphurous
  is harsh or biting in tone, unlike the sense for, of a substance, especially a strong acid, able to
  wreck or eat away by chemical work.
examples:
- The words were vitriolic, harsh in tone.
- The voice was vitriolic, stinging in tone.
