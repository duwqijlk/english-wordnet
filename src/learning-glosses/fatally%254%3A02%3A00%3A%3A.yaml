simpleMeaning: in a way that causes death or complete failure, or that shows death or complete failure
  is likely
scope: This says how something is done or is when it causes death or complete failure, or shows that death
  or complete failure is likely; it does not mean only very or very badly.
examples:
- He was fatally wounded in the crash and died in hospital.
- The plan was fatally weak, so it failed at the first test.
