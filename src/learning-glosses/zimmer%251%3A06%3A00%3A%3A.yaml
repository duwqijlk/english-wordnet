simpleMeaning: A light frame you stand inside, with small rubber wheels and hand grips, that helps people
  who walk with trouble, or old people, to walk
scope: A light walking aid you stand inside; walker and Zimmer frame are other names for this sense, not
  a wheelchair you sit in and not a crutch held under the arm.
examples:
- Her Zimmer helped her walk to the kitchen.
- He leans on his Zimmer when he walks to the door.
