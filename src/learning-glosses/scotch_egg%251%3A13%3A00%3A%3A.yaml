simpleMeaning: A hard-cooked egg in a coat of ground meat, rolled in crumbs and fried in hot oil.
scope: The centre is a hard-cooked egg inside a coat of meat and crumbs, not a plain boiled egg and not
  a meatball with no centre inside.
examples:
- A Scotch egg has a hard-cooked egg inside its coat of meat.
- She cut the Scotch egg in half to show the egg within.
