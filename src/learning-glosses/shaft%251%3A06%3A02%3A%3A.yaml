simpleMeaning: A deep hole dug straight down into the ground, made to reach a mine or a tunnel below.
scope: A deep hole dug straight down to a mine or a tunnel, not a turning rod in a machine and not a long
  tool handle.
examples:
- The miners went down the shaft in a cage.
- They sank a new shaft to reach the coal seam.
