simpleMeaning: Joining its fellow from the other side of the body, this blood tube is made from the inner
  and outer hip tubes and forms the large tube to the heart.
scope: It is a blood tube of the hip, not the inner or outer tube on its own and not the large tube it
  helps to form.
examples:
- The common iliac vein joins its fellow from the other side of the body.
- The common iliac vein is made from the inner and outer hip tubes.
