senseId: 'rationalize%2:40:00::'
synsetId: 02274330-v
simpleMeaning: to set up and run something in a planned way, using facts, careful thought and ways that
  have been tested, so that it gets the results wanted
scope: 'Also called rationalise: to set up and run something in a planned way to get the results wanted,
  not to make excuses for something, not to think through a problem, and not to cut out things that are
  not needed.'
examples:
- They rationalized the factory's work and so raised its profits.
- The company rationalized its offices, putting each job in one clear system.
