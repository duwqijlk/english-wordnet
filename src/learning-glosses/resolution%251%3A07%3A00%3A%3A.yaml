simpleMeaning: the way of being firm in what you have decided and not giving up
scope: 'Also called resolve: the way of being firm and not giving up, not something that is settled by
  a decision, and not how clear a picture on a screen is.'
examples:
- His resolution helped him finish the hard work.
- She showed great resolution and did not give up.
