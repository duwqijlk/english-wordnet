simpleMeaning: The face of a slanted end of a piece, where a corner fit is made.
scope: This sense is the face of a slanted end of a piece, where a corner fit is made, unlike the sense
  for a church head-dress worn by bishops on set days, unlike the sense for cutting edges slantwise, to
  make a corner join, unlike the sense for giving a bishop his tall head-dress, and unlike the sense for
  fitting together in a corner join.
examples:
- The miter is the face of a slanted end.
- Miters join.
