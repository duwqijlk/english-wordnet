simpleMeaning: To attack suddenly and with great force.
scope: This is the verb for a sudden, forceful attack, a sense also called surprise, not the weather turning
  fierce, someone raging in anger, or merely taking something by force.
examples:
- The troops stormed the enemy position at dawn.
- Protesters stormed the building after the vote.
