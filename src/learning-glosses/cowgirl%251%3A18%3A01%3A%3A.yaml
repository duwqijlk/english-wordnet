simpleMeaning: a woman who performs in shows by riding horses, catching cattle with a rope, and wrestling
  cattle to the ground
scope: This is a woman who performs in riding shows, not a woman who does daily work with cattle on a
  farm and not just any woman who rides a horse.
examples:
- The cowgirl rode around the ring and tied the calf with her rope.
- People clapped as the cowgirl pulled the young cow to the ground.
