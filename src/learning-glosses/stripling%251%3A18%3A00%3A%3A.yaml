simpleMeaning: a young person whose body has started to change from a child's body to an adult's body,
  but who is not yet fully grown
scope: 'Also called teenager, teen and adolescent: a young person who is not yet fully grown, not a small
  child and not a grown adult.'
examples:
- The stripling was tall for his age but still too young to join the army.
- A mere stripling, she already worked hard on the family farm.
