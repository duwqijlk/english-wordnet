simpleMeaning: A husband who carries on a sexual affair with a woman who is not his wife
scope: A husband with a lover outside his marriage, not a boyfriend and not a faithful husband.
examples:
- People gossiped about the kept man and his lover.
- The kept man left his wife's house each night to meet his lover.
