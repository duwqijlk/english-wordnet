scope: A low South African plant with thick spoon-shaped leaves and bright white, pink, red, or orange
  flowers, not a tall shrub and not a daisy with thin flat leaves.
examples:
- The livingstone daisy opened its bright pink flowers in the sun.
- She grew a livingstone daisy in a pot on the windowsill.
