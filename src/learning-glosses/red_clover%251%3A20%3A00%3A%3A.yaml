simpleMeaning: Farm animals are most often fed on this plant, which lives only a few years, stands upright
  or lies low, and bears deep rose-purple to pink flowers.
scope: 'Also called purple clover: a plant most often grown to feed farm animals, living only a few years
  and bearing deep rose-purple to pink flowers.'
examples:
- The farmer sowed red clover to feed the cows.
- Bees worked the red clover flowers all day.
