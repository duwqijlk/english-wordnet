simpleMeaning: cooking food over a fire or on a grill until it turns brown and crisp
scope: This sense is cooking food until it is brown and crisp, also called toasting; it is not a change
  of colour in skin or paper with no cooking.
examples:
- Careful browning of the bread gave it a crisp, dark top.
- The browning of the meat over the fire took a few minutes.
