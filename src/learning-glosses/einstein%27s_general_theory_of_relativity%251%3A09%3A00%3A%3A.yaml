simpleMeaning: A wide view that takes the earlier view of space and time further to cover the pull that
  makes things fall, built on the sameness of falling and speeding up.
scope: Also called general relativity, general relativity theory and general theory of relativity; the
  wider view that also covers gravity, not the earlier view that leaves it out.
examples:
- Einstein's general theory of relativity changed how we think about gravity.
- She studied Einstein's general theory of relativity at university.
