simpleMeaning: to take something up by pushing your hand or a big spoon for serving food down below the
  surface
scope: To take something up and out from below the surface; not just to push a hand or a container down
  into something, and not to put something in liquid only to make it wet.
examples:
- She used a big spoon to dip soup out of the pot.
- He dipped his hand into the water and brought up a small stone.
