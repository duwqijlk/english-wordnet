simpleMeaning: used to describe a number that divides another number exactly, with nothing left over
scope: A word used before a noun to show that a number divides another number exactly, not the noun aliquot
  that names such a number itself.
examples:
- The book calls 4 an aliquot part of 12.
- An aliquot divisor of 20 is 5.
