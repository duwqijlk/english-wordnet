simpleMeaning: to pour out in drops or small amounts, a little at a time, or as if in drops
scope: 'Also called spill: to pour out in drops, not to throw off or lose something and not a small building.'
examples:
- She shed tears when she heard the news.
- The wound shed a few drops of blood.
