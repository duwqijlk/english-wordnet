simpleMeaning: In computing, a note typed far away comes back on the screen of the person it was sent
  to when that person signs in, in a world-wide system.
scope: Also called email and electronic mail; it is a way to send written notes between machines, not
  a paper letter sent by post.
examples:
- I sent her an e-mail about the meeting.
- He checks his e-mail every morning.
