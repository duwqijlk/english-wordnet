simpleMeaning: the lack of smooth working together of organs or body parts that usually act as one
scope: 'Also called asynergia: a lack of smooth working between organs and body parts, not a weak muscle
  and not a single part that fails alone.'
examples:
- After the stroke, his asynergy made it hard for his arms and legs to move together.
- The doctor noted asynergy in her hands, which would not move in time with each other.
