simpleMeaning: A place that is both a beer-making works and a place to eat, where the beer made there
  is drunk on the spot and served with food.
scope: A place that both makes beer and serves food, where its own beer is drunk on the spot; not a brewery
  alone and not an ordinary pub.
examples:
- We ate dinner at the brewpub and tried the beer made there.
- The brewpub serves its own ale with every meal.
