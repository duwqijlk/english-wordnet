simpleMeaning: Said of things a firm owns that you can touch and that hold a money value of their own.
scope: Said of things a firm owns that you can touch and that hold a money value, not merely able to be
  noticed by the senses.
examples:
- The firm's tangible assets included land and machines.
- Tangible goods filled the warehouse shelves.
