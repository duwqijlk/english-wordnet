simpleMeaning: A small bit of a word that can only stand as part of a bigger whole, such as the -s at
  the end of plural nouns.
scope: Also called a bound morpheme, this is a small bit of a word that only stands as part of a bigger
  whole, not a bit that can stand on its own.
examples:
- The bound form -s shows that a noun is plural.
- A bound form cannot stand alone as a word.
