senseId: 'jewel%1:18:00::'
synsetId: 10241326-n
simpleMeaning: A person who stands out and is much loved and valued, as a bright stone is prized
scope: This is a person who stands out and is much loved and valued, not a stone set in worn decoration
  and not the act of putting costly stones on something.
examples:
- Our teacher is a real jewel, and every pupil loves her.
- Everyone says Sam is a jewel because he is kind and always helps.
