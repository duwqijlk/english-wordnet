simpleMeaning: A swollen place in one part of the body where pus, a thick yellow liquid, collects, and
  the flesh around it is sore and red
scope: The swollen place with pus inside it, not a plain cut, not a bruise, and not swelling with no pus.
examples:
- The dentist treated an abscess under his tooth.
- She had a painful abscess on her leg.
