simpleMeaning: a ground squirrel of western America and Asia that digs holes to live in; it has bags in
  its cheeks and a light and dark line down its body
scope: A ground squirrel that lives in holes in the ground and has bags in its cheeks; not a squirrel
  that lives in trees.
examples:
- A chipmunk filled its cheeks with seeds and ran off.
- The chipmunk disappeared into its hole under the rock.
