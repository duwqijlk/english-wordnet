simpleMeaning: in Britain, a nobleman who stands one step below a marquess and one step above a viscount
scope: A British title for a nobleman, below a marquess and above a viscount, not a duke and not a baron.
examples:
- The earl sat below the marquess at the great dinner.
- She married an earl and moved into his country house.
