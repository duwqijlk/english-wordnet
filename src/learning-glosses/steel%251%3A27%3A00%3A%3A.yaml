simpleMeaning: a strong metal made from iron and a small amount of carbon, widely used in building, whose
  strength and other physical qualities can be changed over a wide range
scope: This is the metal itself, not a tool made from it and not pure iron.
examples:
- The bridge is built of steel.
- The blade is made of hardened steel.
