simpleMeaning: grown or formed by the living world rather than by people, and not fake.
scope: This is about things being genuine rather than man-made or copied; it is not about the physical
  world as a subject.
examples:
- This juice is made from natural ingredients, with no added colours.
- She has natural curls, not a perm.
