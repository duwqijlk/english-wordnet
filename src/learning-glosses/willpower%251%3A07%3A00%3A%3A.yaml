simpleMeaning: a person's firm power to hold back their own urges and keep doing what they have chosen
  to do, even when it is hard
scope: 'Also called possession: the strength to hold your own actions in check and keep to what you chose,
  not a sudden burst of energy.'
examples:
- It took all her willpower to keep studying instead of going out.
- His willpower carried him through the long, hard training.
