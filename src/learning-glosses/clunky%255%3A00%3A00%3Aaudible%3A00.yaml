simpleMeaning: making a heavy, dull sound
scope: This sense is about a heavy, dull sound a thing makes, not about a person or thing that moves in
  a rough way or holds the body in a rough way.
examples:
- The clunky old engine made a heavy bang each time it started.
- I could hear his clunky boots coming down the hall.
