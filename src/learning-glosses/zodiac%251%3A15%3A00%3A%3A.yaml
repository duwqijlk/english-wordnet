simpleMeaning: a band in the sky on both sides of the sun's path, split into 12 groups of stars or signs
  used to tell about people's lives from the stars
scope: The band in the sky itself, not the round chart that shows its 12 signs.
examples:
- The zodiac is the wide band in the sky that holds the 12 star signs.
- Old star maps show the zodiac stretching across the sky on both sides of the sun's path.
