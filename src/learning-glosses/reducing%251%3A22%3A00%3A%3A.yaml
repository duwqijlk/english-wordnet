simpleMeaning: In chemistry, a change in which tiny charged parts join an atom or ion, by taking oxygen
  away or adding hydrogen, always with the giver losing those parts
scope: Also called reduction; a chemistry change in which tiny charged parts are gained, not the losing
  of extra body weight.
examples:
- The reducing of iron ore in the furnace left pure metal behind.
- In the lab, reducing turned the dark powder into bright metal.
