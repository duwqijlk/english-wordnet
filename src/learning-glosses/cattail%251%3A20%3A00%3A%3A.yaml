simpleMeaning: tall straight plants with leaves shaped like a sword, found all over the world in wet ground
  with fresh or salt water
scope: This is a tall plant that grows in wet ground near water, not a grass that grows in dry fields
  and not the tail of a cat.
examples:
- Cattails grow at the edge of the marsh near our house.
- A cattail stood tall above the wet grass by the pond.
