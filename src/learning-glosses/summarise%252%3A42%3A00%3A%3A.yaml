simpleMeaning: To sum a thing up in short form.
scope: This sense is also called summarize, for summing a thing up in short form, where summarize is to
  hold the main points of a thing in short form, unlike the sense for setting out the key points.
examples:
- It summarises the book, summing it up in short form.
- It summarises reports.
