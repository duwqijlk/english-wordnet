simpleMeaning: A virus that attacks the nerves, not spread by the bites of small creatures, of the Rhabdoviridae
  family, the family of the rabies virus, which causes rabies.
scope: A virus that attacks the nerves, not spread by the bites of small creatures, of the Rhabdoviridae
