simpleMeaning: A clear strip of ground, water, or road where one line of swimmers or traffic moves along
scope: A marked strip for one line of swimmers or traffic, not a road as a whole and not a strip of land
  beside a road.
examples:
- Each swimmer stayed in her own lane.
- The truck moved into the left lane to pass.
