senseId: 'isophene%1:15:01::'
synsetId: 92419367-n
simpleMeaning: A line showing places where living things do the same thing at the same time, such as plants
  flowering
scope: A line joining places where living things act at the same time, not a line of equal hail and not
  a line of equal shaking.
examples:
- The isophene joins places where the cherry trees bloom together.
- On the map, the isophene marks the same flowering date.
