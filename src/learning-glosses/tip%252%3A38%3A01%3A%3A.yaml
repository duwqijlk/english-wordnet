simpleMeaning: To bend or slope away from an upright line.
scope: It is an upright thing itself sloping off line, not pushing something else over, not a light blow,
  and not walking on the toes; lean, tilt, slant and angle are other names.
examples:
- The boat tipped to one side as the wave hit.
- The lamp tipped forward when the table shook.
