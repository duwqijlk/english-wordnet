simpleMeaning: A large wild feline, such as a lion or tiger, that can typically roar.
scope: The large wild kinds such as lions and tigers, not the small furry feline kept in homes, and not
  the broader group that includes every feline.
examples:
- A cat roared in the darkness beyond the campfire.
- The reserve protects cats such as leopards and lions.
