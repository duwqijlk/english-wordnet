simpleMeaning: needed more than anything else to get through a serious problem, because it can decide
  how that problem ends
scope: This is about something needed to end a serious emergency, not about something that matters in
  general.
examples:
- Getting water to the village was the most important thing after the flood.
- The doctor's quick decision was important in saving the child's life.
