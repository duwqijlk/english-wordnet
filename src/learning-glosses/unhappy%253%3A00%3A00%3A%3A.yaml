simpleMeaning: feeling sad, or showing sadness, or making people feel sad or not pleased
scope: This is about feeling, showing or causing sadness; it is not the sense that means unlucky or unfortunate.
examples:
- She was unhappy about leaving her friends.
- They sat in unhappy silence after the bad news.
