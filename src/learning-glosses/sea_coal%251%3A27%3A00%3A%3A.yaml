simpleMeaning: finely ground black rock that burns, spread as a thin coat on the inside of a mould for
  casting metal
scope: Finely ground burning rock used to coat a casting mould; not a lump of fuel for a fire and not
  a stone for building.
examples:
- The foundry dusted the mould with sea coal before pouring in the metal.
- Workers mixed sea coal into the facing to keep the cast smooth.
