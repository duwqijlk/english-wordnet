simpleMeaning: to say a sound without stress, so that it sounds weaker
scope: This is about pronunciation in speech, not about making a liquid weaker and not about making a
  text shorter.
examples:
- In fast speech, English speakers often reduce the vowel in 'and'.
- The second syllable is reduced to a soft schwa.
