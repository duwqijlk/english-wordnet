simpleMeaning: A hired worker who looks after cattle and does other jobs while riding a horse.
scope: This is a hired worker on horseback who tends cattle, not a farm owner or a herder on foot; also
  called cowherd, cowpoke, cowpuncher, and puncher.
examples:
- The cowhand rode out at dawn to check the herd.
- A cowhand mended the fence after lunch.
