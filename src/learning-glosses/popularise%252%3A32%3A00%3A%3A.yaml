senseId: 'popularise%2:32:00::'
synsetId: 00972247-v
simpleMeaning: To shape something to what most people like, show it to everyone, and bring it into wide
  use
scope: To shape something to what most people like and bring it into wide use, also called generalize,
  popularize or generalise; not simply to praise a thing, and not to make it easy to grasp.
examples:
- They popularised coffee in the region.
- The writer popularised the new theory.
