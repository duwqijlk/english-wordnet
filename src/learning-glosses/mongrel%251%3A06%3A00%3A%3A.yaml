simpleMeaning: a rude name for a kind that is not the real kind, or for a thing that is not regular, is
  worse, or may come from a bad source
scope: 'This sense is also called bastard: a rude name for a not-real kind or a worse, odd thing, not
  a dog whose parents are of different kinds.'
examples:
- The mongrel design looked like Gothic work but was not true Gothic.
- He called the car a mongrel because its parts came from many unlike models and it worked badly.
