simpleMeaning: a recording of sound or pictures kept on a long thin strip made to hold them
scope: A recording kept on such a strip, not the strip itself used for tying, not the measuring strip,
  and not the act of fastening.
examples:
- They played the tape of the concert.
- The several recordings were combined on a master tape.
