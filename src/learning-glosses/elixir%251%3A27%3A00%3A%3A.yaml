senseId: 'elixir%1:27:00::'
synsetId: 14865226-n
simpleMeaning: a sweet liquid, usually with a small amount of alcohol in it, mixed into medicines that
  people take by mouth to hide their bad taste
scope: A sweet liquid mixed into real medicine to hide its bad taste, not a magic liquid said to cure
  all illness or to turn cheap metal into gold.
examples:
- The pharmacist mixed the bitter medicine with a sweet elixir so the child would take it.
- This elixir contains a little alcohol and makes the medicine taste better.
