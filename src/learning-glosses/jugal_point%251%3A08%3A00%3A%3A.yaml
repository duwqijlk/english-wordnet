simpleMeaning: In the study of skulls, the spot where the front and side arms of the cheek bone meet.
scope: This is the spot where the front and side arms of the cheek bone meet; jugale is another name for
  it, not any other marked spot on the skull used for measuring.
examples:
- The jugal point marks where the two arms of the cheek bone meet.
- Anatomists use the jugal point to measure the skull.
