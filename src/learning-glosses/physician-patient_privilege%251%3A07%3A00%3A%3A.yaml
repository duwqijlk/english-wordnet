senseId: 'physician-patient_privilege%1:07:00::'
synsetId: 05188010-n
simpleMeaning: The right of a doctor to keep private things learned from a sick person secret, unless
  that person says they may be told.
scope: This is a doctor's right to keep a sick person's private things secret; not a lawyer's right to
  keep a client's words secret, and not a priest's right to keep what is said in confession secret.
examples:
- The physician-patient privilege kept the doctor from telling the court what the man had said.
- She asked if physician-patient privilege covered her notes.
