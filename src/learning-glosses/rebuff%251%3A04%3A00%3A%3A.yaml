simpleMeaning: a rude act done on purpose, usually to show anger or that you do not approve of something
scope: 'Also called a slight: a rude act done on purpose, usually to show anger or that you do not approve;
  not the verb sense of turning someone or something away in a blunt way.'
examples:
- His cold, short reply was a clear rebuff to her offer of help.
- She felt the rebuff when he turned away without a word.
