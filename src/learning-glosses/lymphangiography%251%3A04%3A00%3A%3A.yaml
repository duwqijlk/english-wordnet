simpleMeaning: In medicine, an X-ray examination of lymph nodes and lymph vessels after a dye that blocks
  X-rays is injected; it yields a picture of those vessels and nodes.
scope: An imaging test of the lymph vessels and nodes, another name for lymphography, not a scan of blood
  vessels or a tissue sample from a node.
examples:
- The doctor ordered a lymphangiography to examine the lymph vessels in her leg.
- Lymphangiography uses an injected dye so the lymph nodes show up on the X-ray.
