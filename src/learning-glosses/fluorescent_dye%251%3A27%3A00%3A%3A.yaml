senseId: 'fluorescent_dye%1:27:00::'
synsetId: 15012254-n
simpleMeaning: 'A yellow coloring matter that stays visible even when greatly weakened, and serves as
  an indicator: it turns pink once no chloride remains in a silver nitrate test solution.'
scope: This is the yellow laboratory indicator that turns pink when chloride runs out, not an ordinary
  fabric coloring or a brightening agent.
examples:
- The lab technician added a few drops of fluorescent dye to the silver nitrate solution.
- Even after heavy dilution, the fluorescent dye remained easy to see in the sample.
