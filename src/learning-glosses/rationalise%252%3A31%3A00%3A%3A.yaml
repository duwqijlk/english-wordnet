simpleMeaning: To think by sound sense, or use wit and reason.
scope: This sense is also called rationalize, for thinking by sound sense, or using wit and reason, unlike
  the sense for framing and running by sound or craft rules, to reach wished ends, unlike the sense for
  cutting out the unneeded or unwanted, and unlike the sense for standing up for a deed or act with reasons,
  or clearing it of blame.
examples:
- They rationalise, thinking by sound sense.
- They rationalise, using wit and reason.
