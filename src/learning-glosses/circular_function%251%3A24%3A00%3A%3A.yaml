simpleMeaning: In maths, a number found from an angle by dividing the length of one side of the right-angled
  triangle holding it by the length of another side
scope: This number is also called a trigonometric function; it comes from an angle in a right-angled triangle
  and is not the angle itself.
examples:
- Sine is a circular function that students meet when they study right-angled triangles.
- The teacher used a circular function to find the length of the missing side.
