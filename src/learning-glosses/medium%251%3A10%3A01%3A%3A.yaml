simpleMeaning: a way or thing that people use to store information, or to send it to other people
scope: This is a way of storing information or sending it to others, such as a book. It is not the material
  that signals move through, and not a substance that helps a job get done.
examples:
- Books are a medium that can store facts for many years.
- Paper is a simple medium for storing written information.
