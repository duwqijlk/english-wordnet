simpleMeaning: The priests and singers go out of the front of the church to the room where they put on
  their robes, when the service ends.
scope: 'Also called recession: the priests and singers leaving the front of the church for their robing
  room when the service ends; not the hymn sung as they leave.'
examples:
- The recessional took place as the organ played softly.
- After the blessing, the recessional began and the choir filed out.
