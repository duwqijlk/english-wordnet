simpleMeaning: A pick used for digging, with a flat blade set across the handle, at a right angle to it
scope: This is a digging tool with a flat blade; it is not a pointed pick for breaking rock and not an
  axe for cutting wood.
examples:
- He used a mattock to dig the hard ground in the garden.
- She lifted the mattock and cut through the roots with its flat blade.
