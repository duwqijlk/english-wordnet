simpleMeaning: a worker who digs ground for the base of a building or to get stone from the earth
scope: This is a person who digs ground; it is not the large machine that digs ground.
examples:
- He found work as an excavator, digging stone from the earth.
- The excavators rested at noon after digging ground for the new building.
