simpleMeaning: In Islam, the man who leads prayers in a mosque; for Shiites, also a trusted voice on the
  beliefs and law of Islam and a guide in faith
scope: Also called imaum, this is the man who leads prayers in a mosque, and for Shiites a guide on faith
  and law, not just any man praying there.
examples:
- The imam led the morning prayers at the mosque.
- For Shiites, the imam is a guide on matters of faith and law.
