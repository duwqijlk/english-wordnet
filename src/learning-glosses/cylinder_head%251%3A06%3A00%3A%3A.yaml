simpleMeaning: At the shut end of a round tube in a machine that moves back and forth, or in a pump, sits
  a flat part that can be taken off.
scope: This is a flat part that covers the shut end of a round tube in a machine or a pump, not the tube
  itself.
examples:
- The mechanic took off the cylinder head to look inside.
- A cracked cylinder head can let oil leak out.
