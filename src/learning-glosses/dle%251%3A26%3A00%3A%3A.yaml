simpleMeaning: A long-term skin ailment found mostly in women aged 20 to 40, marked by an outbreak of
  red spots on the cheeks and over the bridge of the nose.
scope: Not acne, nor any rash that soon clears; also called discoid lupus erythematosus.
examples:
- DLE left red spots on her cheeks.
- The doctor said the rash was DLE.
