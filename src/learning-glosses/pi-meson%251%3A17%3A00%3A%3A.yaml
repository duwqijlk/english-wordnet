simpleMeaning: When tiny bits of matter crash into each other at very high speed, a tiny bit is made that
  helps hold the centre of an atom together
scope: 'Also called a pion: a tiny bit of matter that holds the centre of an atom together, not a whole
  atom and not a ray of light.'
examples:
- A pi-meson was made when the fast bits hit each other in the machine.
- The pi-meson helps hold the centre of the atom together.
