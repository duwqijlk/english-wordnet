simpleMeaning: Brightly coloured warm-water fishes with feelers under the chin.
scope: Brightly coloured warm-water fishes with feelers under the chin; also called goatfish and red mullet;
  not a cold-water fish and not a fish with no feelers.
examples:
- A surmullet flashed bright colours as it swam over the reef.
- The surmullet had bright colours and feelers under its chin.
