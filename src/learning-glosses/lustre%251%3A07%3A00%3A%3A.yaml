simpleMeaning: A coat put on the surface of pots or china.
scope: Also called luster, this is a coat on the surface of pots or china, not the shine of a thing that
  gives back light.
examples:
- The lustre on the vase had worn thin.
- She fired the pot again to set the lustre.
