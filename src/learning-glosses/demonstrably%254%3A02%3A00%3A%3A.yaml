simpleMeaning: in a way that is clear to see and can be shown to be true
scope: 'Also called incontrovertibly: in a way that is clear and can be shown to be true, not just in
  a way that looks clear with no proof.'
examples:
- His old claims are demonstrably wrong, as the new records clearly show.
- The new lock is demonstrably safer than the old one, and the tests prove it.
