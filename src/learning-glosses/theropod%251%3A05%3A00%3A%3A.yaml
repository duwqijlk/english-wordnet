simpleMeaning: A meat-eating dinosaur from the Triassic to the Cretaceous, walking or running on two strong
  back legs, with short front legs.
scope: People also call this a bird-footed dinosaur and a theropod dinosaur.
examples:
- The theropod ran after its prey on two strong legs.
- Fossils show that the theropod walked on two strong back legs.
