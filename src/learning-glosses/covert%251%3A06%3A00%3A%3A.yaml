simpleMeaning: a cover that hides something or gives it shelter from view
scope: A cover that hides or shelters something, with cover, screen and concealment as other names for
  this sense, and not a secret action or a hidden place alone.
examples:
- The brush provided a covert for game.
- The soldiers used the trees as a covert.
