senseId: 'federalise%2:30:01::'
synsetId: 00505545-v
simpleMeaning: To put a thing under the rule of a national government.
scope: To put a thing under the rule of a national government; federalize is another name for this sense,
  not joining states into a union, and not putting a thing under a state government.
examples:
- The government moved to federalise the railways.
- They plan to federalise the postal service.
