simpleMeaning: A gyromitra with a brown puffed-up spore-bearing part, a rosy pink grooved stem and smooth
  round spores, found on hardwood slash (cut woody debris) east of the Great Plains.
scope: A gyromitra mushroom, not the false morel; among gyromitra species it is recognised by its smooth
  round spores and rosy pink grooved stem.
examples:
- We found round-spored gyromitra growing on hardwood slash east of the Great Plains.
