simpleMeaning: The side or the base of the floor in a train car for people is usually a long beam along
  each side, holding up the bodywork.
scope: Also called side sill, it is a long beam along each side of a train car that holds up the bodywork,
  not a beam across the car.
examples:
- The solebar ran along each side of the train car and held up the bodywork.
- The solebar formed the base of the floor in the passenger car.
