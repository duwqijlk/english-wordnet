simpleMeaning: a person who is active in the work of a party that seeks power in government
scope: This sense is a person active in a party that seeks power in government. It is not a person who
  plans in a sly way to get an advantage inside a group.
examples:
- The politician spoke to voters in the town hall.
- Two politicians from the same party disagreed in public.
