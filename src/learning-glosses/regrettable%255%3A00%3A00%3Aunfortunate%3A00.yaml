simpleMeaning: bad in a way that makes people wish it had not happened
scope: A word for a bad event, remark or choice that people wish had not happened; it names the thing
  itself, not the sad feeling a person has about it.
examples:
- His regrettable remarks hurt many people in the room.
- It is regrettable that she did not go to college.
