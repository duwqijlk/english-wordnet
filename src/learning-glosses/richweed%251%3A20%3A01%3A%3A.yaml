simpleMeaning: A plant of the Pilea group, with hanging green flower heads and smooth, see-through stems
  and leaves.
scope: 'Also called clearweed and dead nettle: a plant of the Pilea group with hanging green flower heads
  and smooth, see-through stems and leaves, not the strong-smelling kind with yellowish flowers.'
examples:
- She pointed out the richweed by its hanging green flower heads.
- The richweed showed smooth, see-through stems and leaves.
