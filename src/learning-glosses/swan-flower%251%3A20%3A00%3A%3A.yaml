senseId: 'swan-flower%1:20:00::'
synsetId: 12075542-n
simpleMeaning: any of several orchids of the group Cycnoches, with slim curving stems of blooms shaped
  like the neck of a big white water bird
scope: Also called a swan-neck, a swan orchid, a swanflower, and a swanneck; an orchid whose flower stems
  curve like a swan's neck, not a swan and not a water lily.
examples:
- The swan-flower in the glasshouse had slim stems curving like a swan's neck.
- A swan-flower blooms with columns of flowers shaped like a swan's neck.
