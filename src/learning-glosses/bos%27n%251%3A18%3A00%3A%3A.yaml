simpleMeaning: a low-ranking officer on a ship that carries goods, who tells other sailors what to do
scope: 'Also called bo''s''n, bo''sun, boatswain and bosun: a low-ranking officer on a ship that carries
  goods who tells other sailors what to do, not the ship''s captain and not an ordinary sailor.'
examples:
- The bos'n told the crew to coil the ropes.
- A new bos'n took charge of the deck hands.
