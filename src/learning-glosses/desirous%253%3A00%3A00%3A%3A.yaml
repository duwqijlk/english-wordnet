schema: oewn-learning-gloss-v2
senseId: 'desirous%3:00:00::'
synsetId: 00891011-a
simpleMeaning: wanting something, or showing that you want something
scope: This describes a person who wants something; it is not the thing that is wanted, and not a thing
  that many people want.
examples:
- He was desirous of a quiet life in the country.
- She grew desirous of finding a quick answer to the problem.
