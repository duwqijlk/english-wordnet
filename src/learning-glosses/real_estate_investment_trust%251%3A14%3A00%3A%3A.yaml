simpleMeaning: A fund that owns and runs business land, buildings, loans on them and other property like
  them, whose shares can be bought and sold on the stock market
scope: This is a fund that owns and runs business land, buildings, loans on them and other property like
  them; REIT is another name for this sense, and it is one of the funds that hold land and buildings,
  close to the fund that holds homes and the fund that holds shops.
examples:
- A Real Estate Investment Trust owns shops, offices and other land and buildings.
- Shares in a Real Estate Investment Trust can be bought and sold on the stock market.
