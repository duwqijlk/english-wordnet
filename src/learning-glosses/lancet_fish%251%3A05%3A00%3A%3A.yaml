simpleMeaning: a long, large fish that lives in the open sea, has no scales and sharp teeth, and carries
  a high fin on its back like a sail
scope: 'Also called lancetfish and wolffish: a large long sea fish with no scales, not a shark and not
  a fish with scales.'
examples:
- The lancet fish had a long fin on its back like a sail.
- Lancet fish swim in the open sea and have sharp teeth.
