simpleMeaning: This thigh muscle has two heads, and its work is to bend the knee and turn the leg out
  to the side.
scope: Also called musculus biceps femoris, this names the thigh muscle with two heads, the one that bends
  the knee and turns the leg out to the side.
examples:
- The femoral biceps helps bend the knee when you run.
- He pulled his femoral biceps during the sprint.
