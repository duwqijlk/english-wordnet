simpleMeaning: A small bushy maple from the east of North America, which turns bright red in autumn.
scope: Also called mountain maple; a small bushy maple from the east of North America that turns bright
  red in autumn, not a tall maple and not a birch.
examples:
- The mountain alder turned scarlet in October.
- Mountain alder grows along the river in the east.
