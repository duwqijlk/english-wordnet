simpleMeaning: In reptiles, birds, and mammals, the young animal before birth is held in the outermost
  bag
scope: The outermost bag round an unborn animal, not the womb itself and not the afterbirth.
examples:
- The chorion is the outer bag round the unborn chick.
- In mammals the chorion holds the embryo.
