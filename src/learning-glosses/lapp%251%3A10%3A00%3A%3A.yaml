simpleMeaning: The language of the wandering people of the far north, in northern Scandinavia and on the
  Kola Peninsula.
scope: Not the people who speak it, nor the tongues of other far-north peoples; also called Same, the
  Lapp language, Saame, the Saame language, Saami, the Saami language, the Same language, Sami and the
  Sami language.
examples:
- Old folk still speak Lapp at home.
- Lapp is heard in northern Scandinavia.
