simpleMeaning: the act of trying to get someone to do something by saying kind things to them or by teasing
  them in a playful way
scope: 'Also called blandishment: sweet, playful words used to press someone to do something, not a plain
  request and not an order.'
examples:
- Her wheedling finally got her brother to lend her the car.
- All that wheedling did not change his mind; he still said no.
