simpleMeaning: to be the edge of land along a river, lake, or sea
scope: This verb means to be the land edge beside water; it is not a wooden beam used to hold up a building,
  and not to come onto land from the water.
examples:
- Trees shored the river along its whole length.
- Steep rocks shored the small lake on one side.
