simpleMeaning: An American sea creature that people eat, whose heavy outer covers were once used as money
  by some native peoples.
scope: This is a sea creature from America that people eat, whose heavy outer covers were once used as
  money, not a soft sea creature; also called quahog, hard-shell clam, quahaug, and round clam.
examples:
- We dug for hard clams at low tide.
- The hard clam was served in chowder.
