simpleMeaning: At the top of the windpipe sits a hard, bendy part, holding stretchy cords that give speech
  its tone.
scope: Also called larynx, it sits at the top of the windpipe, holding the stretchy cords that give speech
  its tone, and it is not the windpipe itself.
examples:
- The voice box sits at the top of the windpipe.
- The voice box held the cords that make the sounds of speech.
