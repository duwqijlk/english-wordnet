simpleMeaning: Someone with a condition that greatly limits what they can do in body, mind, or social
  life
scope: Someone with a condition that greatly limits what they can do in body, mind, or social life, not
  someone with a short illness and not someone who is merely tired.
examples:
- The building has ramps so a handicapped person can enter easily.
- A handicapped person may need help with some daily tasks.
