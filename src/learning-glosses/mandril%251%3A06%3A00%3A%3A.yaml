simpleMeaning: Bigger turning parts spin around this turning rod
scope: Also called arbor, spindle and mandrel, this is a rod that turns while bigger turning parts spin
  on it, not a rod that stays still and not a wheel.
examples:
- The mandril turned the heavy disc at high speed.
- A mandril keeps the work steady while it spins.
