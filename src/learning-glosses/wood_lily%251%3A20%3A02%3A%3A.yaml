simpleMeaning: One flower with three petals sits above three leaves in a ring at the top of the stem,
  on one of many plants of the group Trillium.
scope: Also called trillium and wake-robin, this is one of many plants of the group Trillium, with one
  flower with three petals above three leaves in a ring at the top of the stem, not the kind with orange
  flowers marked with purple spots.
examples:
- Three leaves in a ring grow at the top of the stem of wood lily.
- One flower with three petals grows on wood lily.
