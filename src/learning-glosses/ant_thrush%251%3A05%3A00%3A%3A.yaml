simpleMeaning: A kind of bird of a group named for tiny six-legged insects, with kinds that belong to
  two groups of birds
scope: A kind of bird of a group named for tiny six-legged insects, with kinds that belong to two groups
  of birds, not a songbird of the fields and not a bird that eats seeds.
examples:
- The ant thrush stayed near the tiny six-legged insects on the forest floor.
- We saw an ant thrush where the tiny six-legged insects moved through the leaves.
