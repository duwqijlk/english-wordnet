simpleMeaning: A small bush or tree with flat round fruit, very sweet scented flesh, and thin yellow-orange
  to bright orange-red skin that comes off easily; it is from southeastern Asia.
scope: Also called a mandarin, a mandarin orange, or a mandarin orange tree; a small fruit tree from southeastern
  Asia, not a sweet orange tree and not a lemon tree.
examples:
- The Citrus reticulata in our yard bears flat fruit every winter.
- She planted a Citrus reticulata for its sweet fruit.
