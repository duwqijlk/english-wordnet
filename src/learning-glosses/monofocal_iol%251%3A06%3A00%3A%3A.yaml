senseId: 'monofocal_iol%1:06:00::'
synsetId: 03789108-n
simpleMeaning: A lens with one focus, put in the eye after surgery for clouded sight, to give clear sight
  of far things.
scope: Also called monofocal lens implant; a lens with one focus used after surgery for clouded sight,
  not a lens with more than one focus and not glasses.
examples:
- The monofocal IOL gave her clear distance vision.
- After the surgery, a monofocal IOL was put in his eye.
