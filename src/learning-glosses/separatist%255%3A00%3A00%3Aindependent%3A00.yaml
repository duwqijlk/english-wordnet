simpleMeaning: that has left another group or stopped following its rules or ideas, or that says a group
  should leave a larger group or stop following its rules or ideas
scope: This word describes a group or idea that has left or wants to leave, also called breakaway and
  fissiparous; it is not the noun for a person who supports leaving a larger group.
examples:
- The separatist group broke away to run its own affairs.
- They took a separatist line and said the region should leave the union.
