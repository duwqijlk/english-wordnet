simpleMeaning: A warm flow of sea water that moves to the north-east past the coast of Japan into the
  northern Pacific
scope: Also called the Japan current and the Kuroshio, it is a warm flow of sea water that moves to the
  north-east past Japan into the northern Pacific, not a cold flow and not a flow of the Atlantic.
examples:
- The Kuroshio current flows past the coast of Japan.
- The Kuroshio current brings warm water to the northern Pacific.
