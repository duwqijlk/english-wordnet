simpleMeaning: The part of a ship's body that is open to the moving air and catches it, so the ship is
  slowed down
scope: This is the part of a ship's body that is open to the moving air; wind exposure is another name
  for this sense, and it is not the whole ship or the moving air itself.
examples:
- The windage of the tall hull slowed the ship in the storm.
- Sailors try to cut the windage of a ship by lowering its high parts.
