simpleMeaning: Dense groups of spear-shaped fronds, each on a narrow leaf stem, grow from this North American
  fern, which keeps its leaves all year and has feather-like leaves.
scope: A North American fern with feather-like leaves, not a moss or a flowering plant; also called canker
  brake and dagger fern.
examples:
- The evergreen wood fern grows in the damp shade of the woods.
- We planted evergreen wood fern along the north wall.
