simpleMeaning: Cultivated, this sprawling, mat-forming weed bears bright yellow blossoms; its edible,
  tart leaves are eaten raw or cooked, especially in Indian, Greek and Middle Eastern dishes; it grows
  worldwide.
scope: One of several names for the same edible weed as common purslane, not a separate species and not
  a garden ornamental.
examples:
- Pussley is the name my neighbour uses for the weed in her yard.
- We cooked pussley with garlic and olive oil.
