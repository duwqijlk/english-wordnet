senseId: erosive%5:00:01:destructive:00
synsetId: 00590069-s
simpleMeaning: Able to eat away or destroy things by chemical action, said above all of a strong acid
scope: Of a substance that can eat away things by chemical action; caustic, corrosive, mordant and vitriolic
  are other names for this sense, not a substance that merely wears things down by rubbing and not a mild
  wash.
examples:
- The erosive acid ate through the metal plate.
- Erosive fumes from the plant damaged the roof.
