simpleMeaning: To start learning a language, including how to speak, understand, read, and write it.
scope: This is starting to study a language, not starting to speak in general and not starting another
  activity implied by an object.
examples:
- She began Spanish in kindergarten.
- He began Arabic while working in Cairo.
