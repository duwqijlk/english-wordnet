simpleMeaning: A piece of clothing of any kind that hangs loosely and drapes freely.
scope: 'The broad sense: a loose garment of any kind, not the ceremonial outer garment and not the verb
  meaning to dress someone.'
examples:
- She wore a light robe over her swimsuit.
- He pulled on a robe and went to answer the door.
