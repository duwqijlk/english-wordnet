simpleMeaning: A plant grown yearly in warm parts of India, Indonesia and the US for fodder and seeds,
  chief source of sprouts for Chinese cooking, sometimes classed in the Phaseolus group.
scope: This is the plant itself, not the seed taken from it or the food made from that seed; the same
  plant is also known simply as mung.
examples:
- The mung bean grows as a low, bushy plant in the heat of the Indian summer.
- Farmers rotate mung bean with cereal crops to enrich the soil.
