synsetId: 14152833-n
simpleMeaning: A sickness in boy children whose defence system fails, from a changed gene for a protein
  on T cells that lets them build a receptor for growth signals
scope: A sickness of the body's defence system in boy children, also called X-SCID; not ADA-SCID, the
  kind that comes from a changed gene for adenosine deaminase.
examples:
- X-linked SCID affects only boy children.
- The boy with X-linked SCID has no working defence system.
