simpleMeaning: having or using powers beyond the natural world, or like or suited to such powers
scope: 'Also called magic, magical and wizard: this sense is about powers beyond the natural world, not
  about being pleasant and nice to be with.'
examples:
- The witch used charming songs to make the wolves sleep.
- A charming sign on the gate kept evil away from the house.
