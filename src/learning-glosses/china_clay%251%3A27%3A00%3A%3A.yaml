simpleMeaning: A fine clay, usually white, formed from weathered minerals rich in aluminium, feldspar
  among them, used in ceramics and as an absorbent and as a filler, in paper too.
scope: This sense is also called china stone, kaolin, kaoline, porcelain clay, and terra alba, a fine
  clay, usually white, formed from weathered minerals rich in aluminium, feldspar among them, used in
  ceramics and as an absorbent and as a filler, in paper too.
examples:
- China clay fills paper.
- The china clay is usually white.
