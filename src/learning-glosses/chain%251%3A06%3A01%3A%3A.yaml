simpleMeaning: A piece of jewellery worn around the neck, consisting of objects threaded together.
scope: This is jewellery threaded with objects, not a plain line of metal loops or a row of bonded atoms;
  string and strand are other names for this sense.
examples:
- She wore a chain of tiny shells around her neck.
- He gave her a silver chain strung with pearls.
