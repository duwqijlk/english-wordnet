simpleMeaning: the act of groups or countries joining together to form one union
scope: The act of joining together to work for the same aim, not the formal agreement that is made after
  the joining.
examples:
- The alliance of the two groups was an act that took place last spring after long talks.
- An alliance of the villages was formed at the meeting so they could face the danger together.
