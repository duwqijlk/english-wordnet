simpleMeaning: A North American leafy plant that often grows small round buds on its small leaves.
scope: A North American leafy plant often bearing small buds on its leaflets, also called bulblet bladder
  fern and bulblet fern; not a berry bush and not a flowering plant.
examples:
- The berry fern grew in the shade of the rocks.
- We found a berry fern with tiny buds on its leaves.
