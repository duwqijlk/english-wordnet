simpleMeaning: one of many kinds of usually small birds that walk in shallow water, with a thin beak and
  a high call, and close in kind to plovers
scope: This sense is a small bird that walks in shallow water with a thin beak; it is close in kind to
  plovers but is not a plover itself, and it is not a large land bird.
examples:
- A sandpiper walked in the shallow water at the edge of the sea, looking for food.
- Sandpipers made high calls as they flew over the wet sand.
