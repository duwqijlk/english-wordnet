simpleMeaning: someone who rules a Muslim country, especially the ruler of the Ottoman Empire in the past
scope: The ruler of a Muslim country, especially the Ottoman ruler of the past; not any king or leader
  of any country.
examples:
- The sultan lived in a great palace in the capital.
- People came from far away to ask the sultan for help.
