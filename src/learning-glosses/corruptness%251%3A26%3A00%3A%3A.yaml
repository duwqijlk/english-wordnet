simpleMeaning: the state in which a person or a thing has gone bad in a moral way
scope: This is the state of having gone bad in a moral way; not the act of taking a bribe, and not a thing
  that has gone bad in a physical way.
examples:
- The corruptness of the old regime shocked the nation.
- He wrote about the corruptness that had spread through the city.
