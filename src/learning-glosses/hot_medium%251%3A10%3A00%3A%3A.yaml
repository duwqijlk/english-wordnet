simpleMeaning: A channel that usually, but not always, gives full sense input at once, with little left
  for the mind to add; radio, film, and still pictures are examples.
scope: A channel that fills the senses fully on its own, not a cool medium that leaves much for the mind
  to fill in, and not just any channel for messages.
examples:
- 'Radio is a classic hot medium: it fills the ears with sound and asks little of the listener.'
- In class we learned that film is a hot medium because it gives the eye so much at once.
