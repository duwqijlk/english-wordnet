simpleMeaning: A money house that takes in set payments from bosses, to give workers money to live on
  when they stop work.
scope: A money house that takes set payments from bosses to give workers money when they stop work, not
  a bank that lends money and not a fund for sick pay.
examples:
- Her pension fund pays her each month.
- The firm puts money into the pension fund for its workers.
