simpleMeaning: acts that fool enemy forces by showing them strengths of one's own side that are made up
  or real
scope: Acts that fool enemy forces by showing them strengths of one's own side that are made up or real,
  also called electronic simulative deception; not acts that hide one's own strengths and not acts that
  fool one's own side.
examples:
- The unit used simulative electronic deception to fool the enemy.
- Simulative electronic deception made the enemy think our force was larger.
