simpleMeaning: a structure whose height is greater than the distance across it, standing alone or joined
  to a larger building
scope: This is the built structure itself, not the tall narrow shape of a column of smoke or dust, and
  not a tugboat.
examples:
- The old church tower is visible from miles away.
- A glass tower was added to the side of the office block.
