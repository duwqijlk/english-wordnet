simpleMeaning: a tool used to make metal thicker or wider at the end of a bar, a rivet (a small metal
  pin), and so on, by hitting or pressing it
scope: This is a metal tool, not feeling worried or troubled, not feeling ill, and not the act of knocking
  something over.
examples:
- The blacksmith used an upset to thicken the end of the iron bar.
- He picked up the upset and hammered the hot rivet flat and wide.
