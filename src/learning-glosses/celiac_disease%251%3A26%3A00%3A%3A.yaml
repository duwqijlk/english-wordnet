senseId: 'celiac_disease%1:26:00::'
synsetId: 14081310-n
simpleMeaning: A condition in children and adults where the body cannot tolerate gluten, the protein in
  wheat, causing foul-smelling diarrhea and severe weight loss, and often lactose intolerance.
scope: This is the gut condition in which wheat gluten cannot be tolerated, not a wheat allergy or lactose
  intolerance on its own.
examples:
- Celiac disease often goes unnoticed until someone removes gluten from their diet.
- Her doctor confirmed celiac disease after tests showed damage from eating wheat.
