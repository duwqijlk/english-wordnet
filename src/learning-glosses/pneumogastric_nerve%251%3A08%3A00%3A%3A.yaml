simpleMeaning: A nerve that both sends orders out and brings signals back, serving the heart, lungs, voice
  box, throat, stomach, food pipe, and most of the belly organs
scope: 'Also called nervus vagus, pneumogastric, tenth cranial nerve, vagus, vagus nerve, and wandering
  nerve: a nerve that joins the head to the belly organs, not a nerve of the arm and not one that serves
  a single part.'
examples:
- The pneumogastric nerve slows the heart when the body rests.
- Surgeons take care near the pneumogastric nerve during operations on the neck.
