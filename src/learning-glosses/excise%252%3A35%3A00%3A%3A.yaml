simpleMeaning: to take something out by rubbing it away, by crossing it out, or by treating it as if a
  line were drawn through it
scope: 'Also called strike, scratch and expunge: this is about taking something out in one of these ways,
  not about putting a tax on something.'
examples:
- The editor excised the last line from the letter.
- Please excise this name from the list.
