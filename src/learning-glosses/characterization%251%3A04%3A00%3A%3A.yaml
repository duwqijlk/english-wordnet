simpleMeaning: acting a person on stage in a play, and showing that person through words, acts and body
  moves
scope: Also called portrayal and enactment, this is acting a part on stage; it is not a description in
  words and not the act of describing a person's main features.
examples:
- Her characterization of the old queen on stage felt true and full of life.
- The actor's characterization used a soft voice and slow hand moves to show fear.
