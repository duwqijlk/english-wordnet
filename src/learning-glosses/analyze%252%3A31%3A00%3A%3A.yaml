schema: oewn-learning-gloss-v2
senseId: 'analyze%2:31:00::'
synsetId: 00646245-v
simpleMeaning: to look at or think about something closely and in detail, to find what is most important
  about it or what it means
scope: Another name for this sense is study, and another name is examine. It is not the sense that breaks
  something down as a step in maths, science or grammar.
examples:
- The teacher asked us to analyze the poem line by line.
- The police will analyze the evidence from the trial.
