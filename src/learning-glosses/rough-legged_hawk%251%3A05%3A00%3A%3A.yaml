simpleMeaning: Small gnawing animals are what this big bird of prey in the northern half of the world
  eats most, and farmers gain from it.
scope: It is also called roughleg, and it is a big bird of prey of the northern half of the world that
  eats mostly small gnawing animals.
examples:
- The rough-legged hawk hunts small gnawing animals.
- Farmers like the rough-legged hawk for the small gnawing animals it eats.
