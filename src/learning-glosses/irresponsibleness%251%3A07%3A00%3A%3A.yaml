simpleMeaning: A person cannot be trusted because they do not take on their duties and do not answer for
  what they do
scope: A kind of untrustworthiness in which a person takes on no duties and answers for nothing they do,
  also called irresponsibility; not simple laziness and not a single careless mistake.
examples:
- His irresponsibleness cost him the trust of his friends.
- Her irresponsibleness showed in the way she left every job half done.
