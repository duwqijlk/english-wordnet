simpleMeaning: Moving a herd of cows, bulls or steers from one place to another.
scope: Moving a herd of cows, bulls or steers, not a single animal straying and not a herd at rest in
  a field.
examples:
- The cattle drive took three weeks to reach the railhead.
- On the cattle drive the cowboys kept the herd moving by day and guarded it by night.
