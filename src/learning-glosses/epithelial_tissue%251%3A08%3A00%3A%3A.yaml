simpleMeaning: A thin skin-like sheet that covers the inner organs and other inner faces of the body.
scope: 'Also called epithelium: a thin skin-like sheet that covers the inner organs and other inner faces
  of the body, not the skin on the outside of the body and not the muscle under the skin.'
examples:
- Epithelial tissue covers the inner organs of the body.
- The epithelial tissue lines the inside of the gut.
