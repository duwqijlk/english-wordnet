simpleMeaning: a man who holds a noble title and a high rank among the nobility of a country.
scope: It is not God and not a man who owns or controls other people; it means a man with an inherited
  noble title.
examples:
- Lord Ashford owned most of the land around the village.
- Several lords voted against the bill in the upper house of parliament.
