synsetId: 01315031-v
simpleMeaning: to lift a thing away from where it sits or from below it with a deep round tool, or as
  if with one
scope: To lift a thing away from where it sits or from below it with a cup-shaped tool; also called scoop
  and scoop out; not to hollow a thing out, and not to pick a thing up with the hands.
examples:
- He scooped up the sugar with a spoon.
- She scooped up the sand and poured it into the bucket.
