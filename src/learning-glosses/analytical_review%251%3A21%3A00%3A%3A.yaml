simpleMeaning: A way of checking accounts by looking at the numbers between them to find big changes.
scope: A way of checking accounts by looking at the numbers between them to find big changes, not a check
  of each bill on its own and not a count of cash in hand.
examples:
- The auditor did an analytical review of the yearly accounts.
- An analytical review can show big changes in the numbers.
