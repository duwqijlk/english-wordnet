simpleMeaning: A word for the full thing that a smaller word is part of
scope: A word for the full thing that a smaller word is part of, not the smaller word itself and not a
  word for a thing of the same kind.
examples:
- '''Hat'' is a whole name for ''brim'' and ''crown''.'
- In 'car door', 'car' is the whole name.
