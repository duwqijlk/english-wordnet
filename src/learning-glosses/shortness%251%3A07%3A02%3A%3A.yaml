simpleMeaning: the fact that something lasts for only a small amount of time
scope: This is about how long something lasts in time, not about a person's height and not about how far
  a distance is.
examples:
- The shortness of the film meant we were home early.
- I liked the shortness of the wait at the doctor's office.
