simpleMeaning: Of a leaf shape, small leaves grow on both sides of one middle stem, so it looks like a
  feather
scope: 'Said of a leaf shape, also called pinnated: small leaves on both sides of one stem, not a leaf
  with one flat blade and not leaflets that spread from one point.'
examples:
- The pinnate leaves of the fern stood out in the field guide.
- She pointed out the pinnate shape of the leaf, with leaflets on both sides of the stem.
