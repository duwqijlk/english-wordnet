simpleMeaning: a set of channels and pipes that take away extra water
scope: 'Also called drainage system and drainage well: a set of channels and pipes that takes extra water
  away, not one pipe on its own and not a ditch dug to carry water away.'
examples:
- The drain system took the flood water away from the fields.
- Workers cleared the drain system after the heavy rain.
