simpleMeaning: a belief in God that rests on reason alone and not on revealed truth
scope: This is belief in God by reason alone, also called free thought; not belief based on revealed truth.
examples:
- Deism holds that reason alone can show that God exists.
- He came to deism after deciding that reason, not holy books, should guide his faith.
