simpleMeaning: to push a long pointed weapon through something, as knights did when they fought
scope: This verb means attacking with the long pointed weapon, not the weapon itself and not cutting open
  the skin with a small knife.
examples:
- The knight lanced his enemy during the fight.
- In the story, one knight lances the other with his long weapon.
