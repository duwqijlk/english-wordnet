simpleMeaning: The side bone of the head has a lump that sticks out behind the ear, at the base of the
  skull
scope: A lump that sticks out behind the ear at the base of the skull, also called mastoid, mastoid bone,
  and mastoid process, not the ear itself and not the jaw.
examples:
- The mastoidal lump lies behind the ear.
- The scan showed the mastoidal area at the base of the skull.
