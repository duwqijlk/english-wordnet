simpleMeaning: in a way that makes new things or uses ideas in a new way
scope: How something is done when it uses new ideas, not the quality of being able to make new things.
examples:
- She solved the problem creatively, using a coat hanger to reach the key.
- The class painted creatively, mixing bright colours in new ways.
