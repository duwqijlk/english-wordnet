simpleMeaning: a way to use a keyboard where the fingers are trained to hit set keys, so the typist can
  read while using the keys
scope: This is a way to use a keyboard where the fingers are trained to hit set keys; touch system is
  another name for this sense, and it is not a computer display you press or just any way of using a keyboard.
examples:
- She learned touch typing so she could look at her notes while she worked.
- With touch typing, he read the letter aloud while his fingers moved over the keys.
