simpleMeaning: Held together by a cover or a binding; often the second part of a compound word.
scope: This describes a book or similar item given a cover or binding, not two substances joined chemically,
  and not a person tied by an oath or contract.
examples:
- The shelf held several leather-bound volumes.
- She bought a bound copy of the report.
