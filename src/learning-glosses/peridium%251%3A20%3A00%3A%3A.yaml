simpleMeaning: the outer skin of the part of many fungi that bears spores
scope: The outer skin of the spore-bearing part of many fungi, not the spores themselves and not the stalk.
examples:
- The peridium splits open to release the spores.
- A thin peridium covered the spore mass.
