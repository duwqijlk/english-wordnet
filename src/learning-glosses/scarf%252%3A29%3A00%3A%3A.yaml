simpleMeaning: to wrap someone in a piece of cloth, or to put such cloth on them to look nice
scope: This means wrapping cloth round someone to wear, not the wood or metal joint and not joining two
  pieces of wood or metal.
examples:
- She scarfed herself in a thick wool scarf before going outside.
- He scarfed his wife with a bright cloth for the photo.
