simpleMeaning: A firm that gets bigger runs into troubles, most often in its first years
scope: A firm that gets bigger runs into troubles, most often in its first years, not the aches children
  feel as they grow and not the normal costs of running a firm.
examples:
- The new shop's growing pains showed in late orders and tired staff.
- Every fast-growing firm has growing pains in its first years.
