simpleMeaning: An upright plant with blue-violet flowers in rings near the ends of its stems, found from
  Idaho to Utah and Wyoming
scope: This is an upright plant with blue-violet flowers in rings; Platte River penstemon is another name
  for it, not a low spreading plant and not a plant with red flowers.
examples:
- Penstemon cyananthus grows from Idaho to Utah and Wyoming.
- The Penstemon cyananthus has blue-violet flowers in rings near the tips of its stems.
