simpleMeaning: Not brave, and with no energy or strength
scope: 'Also called gutless: this sense is about lacking courage and strength, not about having no sharp
  points and not about having no backbone.'
examples:
- He was too spineless to speak up when his friend was blamed.
- The spineless leader gave in at once and did what the others said.
