simpleMeaning: This mix of two or more kinds of a burning liquid dissolves things and makes new chemicals
  out of carbon, its parts the same but put together in different orders.
scope: This mix of burning liquids, whose parts are the same but put together in different orders, is
  used to dissolve things and to make new chemicals out of carbon.
examples:
- They kept a bottle of amyl alcohol for dissolving things.
- They used amyl alcohol to build a new chemical.
