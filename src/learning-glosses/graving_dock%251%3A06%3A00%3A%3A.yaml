simpleMeaning: A big basin from which water can be pumped out, used for building ships or for fixing a
  ship below the line where it meets the water
scope: This is a big basin for building or fixing ships; dry dock and drydock are other names for it,
  not a place where ships simply tie up for loading.
examples:
- The ship was moved into the graving dock for repairs.
- Workers pumped the water out of the graving dock.
