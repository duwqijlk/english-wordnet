simpleMeaning: A sweet-smelling shrub of western alkali plains, with flexible hairy stems and small yellow
  flower clusters; hares shelter in it and the Navajo made yellow dye from it.
scope: This is the sweet-smelling yellow-flowered shrub of western alkali plains, the same plant called
  rabbit bush, not undergrowth in general or a grooming tool.
examples:
- Jackrabbits shelter under rabbit brush on the open alkali flats.
- Rabbit brush turned the roadside a solid yellow in late summer.
