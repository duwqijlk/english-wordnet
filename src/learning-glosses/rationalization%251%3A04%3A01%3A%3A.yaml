simpleMeaning: In mathematics, making an expression or equation simpler by taking out root signs, without
  changing its value or the answers to the equation
scope: 'Also called rationalisation: in mathematics, making an expression simpler by removing root signs,
  not hiding your true reason for an act and not putting things into a system.'
examples:
- The teacher showed us rationalization by removing the square root from the bottom of the fraction.
- Rationalization made the equation simpler, but its answers stayed the same.
