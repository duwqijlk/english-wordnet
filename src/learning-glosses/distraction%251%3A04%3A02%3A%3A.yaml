simpleMeaning: the act of pulling someone's attention away from what they are doing or thinking about
scope: This sense is the act of pulling someone's attention away, not a fun show or game that takes their
  mind off their worries.
examples:
- Talking during the test was a distraction that pulled everyone's attention away from their work.
- She made a loud noise as a distraction to pull the guard's attention away from the door.
