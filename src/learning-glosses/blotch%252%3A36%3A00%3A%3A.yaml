simpleMeaning: to mark a thing here and there with patches of colour, the way a stain spreads in spots
scope: 'Also called streak or mottle: to mark a thing here and there with patches of colour, not the patch
  itself and not a clean stain.'
examples:
- The damp had blotched the wallpaper with dark patches.
- She blotched the paper with paint to test the colours.
