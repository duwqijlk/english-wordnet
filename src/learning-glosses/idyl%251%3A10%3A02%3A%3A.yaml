simpleMeaning: A piece of music that brings life in the country to mind.
scope: A piece of music that brings country life to mind, also called a pastoral, an idyll, or a pastorale;
  not a poem about country life and not a piece of music about city life.
examples:
- The orchestra played an idyl full of bird calls and soft winds.
- His idyl for piano brings a quiet village to mind.
