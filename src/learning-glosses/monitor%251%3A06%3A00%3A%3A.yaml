senseId: 'monitor%1:06:00::'
synsetId: 03787320-n
simpleMeaning: An electronic machine that watches over how a system works all the time and gives a warning
  when something goes wrong
scope: A machine that watches over a working system and warns of trouble, not the picture on a screen,
  not the machine that checks signals, and not the big lizard.
examples:
- The monitor beside her bed beeped when her heart rate fell.
- A monitor in the control room warned the engineers of a fault.
