  to streams and lakes.
scope: Black willow is another name for it, a low bushy plant of North America with dark bark and long
  thin leaves, found close to streams and lakes.
examples:
- Long thin leaves marked the swamp willow by the stream.
- They walked past a swamp willow with dark bark.
