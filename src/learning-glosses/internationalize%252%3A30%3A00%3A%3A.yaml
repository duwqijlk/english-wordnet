senseId: 'internationalize%2:30:00::'
synsetId: 00410044-v
simpleMeaning: To give a thing the look and ways of many lands and peoples.
scope: Giving a thing the ways of many nations, also called internationalise; not putting it under the
  joint control of nations.
examples:
- We internationalized the committee by adding members from ten lands.
- The school internationalized its courses to welcome pupils from abroad.
