simpleMeaning: a weed with yellow blooms that lack outer petals and leaves tipped with bristles, smelling
  strong, living one year on Pacific shores of the United States and north-east Asia
scope: Also called pineapple weed; a one-year coastal weed with petal-less yellow flowers, not a pineapple
  plant and not a true chamomile.
examples:
- Rayless chamomile grows along the beach path near the sea.
- The rayless chamomile has yellow flowers with no outer petals.
