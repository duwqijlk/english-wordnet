simpleMeaning: the way of making a liquid clean by heating it till it turns to gas, then cooling the gas
  back to liquid
scope: This sense is also called distillment. It is the process of cleaning a liquid in this way, not
  the clean liquid that the process makes.
examples:
- Distillation is used to make clean drinking water from sea water.
- The factory uses distillation to clean the liquid in this way.
