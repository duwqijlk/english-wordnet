simpleMeaning: In pharmacology, a book that lists drugs and gives their recipes and how to make them
scope: This is a book listing drugs with their recipes and ways of making them; pharmacopeia is another
  name for it, not a book of medical advice or a list of prices.
examples:
- The hospital keeps a formulary of all the drugs it stocks.
- She looked up the dose in the formulary.
