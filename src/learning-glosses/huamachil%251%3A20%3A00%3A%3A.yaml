simpleMeaning: A common thorny tree of tropical America with bunches of yellow flowers and curved edible
  pods; it is valued for its wood, yellow dye and sticky gum.
scope: This is the same thorny American tree as camachile, not the true tamarind.
examples:
- Local farmers cut huamachil for fence posts.
- A row of huamachil trees shaded the track, their yellow flowers just opening.
