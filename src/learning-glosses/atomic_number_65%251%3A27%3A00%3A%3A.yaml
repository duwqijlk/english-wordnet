simpleMeaning: A metal, terbium, of the rare earth group, used in lasers, found in apatite, monazite,
  xenotime and ytterbite
scope: This is a metal of the rare earth group used in lasers, not another rare earth metal such as samarium;
  terbium and Tb are other names for this sense.
examples:
- Atomic number 65 is the metal terbium.
- Terbium, atomic number 65, is used in lasers.
