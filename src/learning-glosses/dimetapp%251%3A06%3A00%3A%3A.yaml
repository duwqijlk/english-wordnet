simpleMeaning: A trade name for a drug that opens the nose and calms allergy effects, used to ease a blocked
  nose and treat an inflamed nose lining.
scope: A brand name for a cold drug, not a drug for a cough and not a plain painkiller.
examples:
- The doctor said Dimetapp might ease his blocked nose.
- She took Dimetapp for her rhinitis before the flight.
