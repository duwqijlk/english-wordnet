simpleMeaning: Built by the army on purpose, a place where soldiers live for a while.
scope: A short-stay camp the army builds for soldiers; also called a camp, encampment, or cantonment.
examples:
- The soldiers made a bivouac on the hillside for the night.
- After the march, the men slept in their bivouac under the stars.
