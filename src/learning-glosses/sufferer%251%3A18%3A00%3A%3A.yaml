simpleMeaning: a person who has an illness and is made to feel bad or weak by it
scope: This is a person made ill by a sickness. It is not a person who accepts pain for a strong belief
  they hold to.
examples:
- She has been a sufferer from asthma since she was a child.
- Doctors gave the sufferers a new drug to ease their pain.
