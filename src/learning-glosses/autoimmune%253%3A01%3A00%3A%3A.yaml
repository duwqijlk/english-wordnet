simpleMeaning: relating to the body's defence against illness, when that defence attacks things that are
  normally in the body
scope: About the body's defence against illness attacking things that are normally in the body. Not about
  that defence fighting germs that come from outside, and not about a defence too weak to fight illness.
examples:
- Her autoimmune condition means her body attacks tissue that is normally part of her.
- His autoimmune disease is a case where his body attacks his own healthy skin.
