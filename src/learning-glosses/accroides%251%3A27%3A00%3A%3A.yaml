simpleMeaning: Trees of Australia give this sticky stuff, which melts in alcohol and goes into varnish
  and paper.
scope: This sticky tree stuff from Australia, which melts in alcohol, is also called acaroid resin, accaroid
  resin, accroides gum, accroides resin, and gum accroides.
examples:
- Varnish makers use accroides from Australian trees.
- The paper was made with accroides.
