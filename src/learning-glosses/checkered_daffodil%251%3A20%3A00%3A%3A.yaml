simpleMeaning: A Eurasian lily with drooping, bell-shaped blooms, usually marked with purple or maroon
  on a pale background; widely planted in gardens as an ornamental.
scope: This is a fritillary, not a true daffodil of the narcissus family.
examples:
- A drift of checkered daffodils had come up under the old apple tree.
- She planted checkered daffodils along the path because they spread so well.
