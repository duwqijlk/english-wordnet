simpleMeaning: a person who pays out a lot of money in a showy way on good times
scope: 'Also called a high roller: a person who pays out a lot of money in a showy way on fun, not a careful
  saver and not someone who gives money away.'
examples:
- He was known as a big spender at the city's best clubs and restaurants.
- The last of the big spenders threw a party that lasted all night.
