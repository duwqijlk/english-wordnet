simpleMeaning: A tall marsh plant whose tube-shaped seed heads burst when ripe, shedding much down; long
  flat leaves make mats and chair seats; from North America, Europe, Asia, and North Africa.
scope: Not a reed or a sedge, other tall plants of wet lands; also called a bulrush, a bullrush, a cat's-tail,
  a nailrod, reed mace, and reedmace.
examples:
- Typha latifolia grows thick around the pond.
- We wove a mat from Typha latifolia leaves.
