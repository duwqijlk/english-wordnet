simpleMeaning: All the notes, coins and bank balances held by the public in an economy
scope: All the cash and bank balances held by the public, not the money of one person or one bank.
examples:
- The central bank can change the money supply by raising interest rates.
- A sudden rise in the money supply can push prices up.
