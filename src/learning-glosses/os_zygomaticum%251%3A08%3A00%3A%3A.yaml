simpleMeaning: A curved arch of bone under the eye that makes the cheek stand out.
scope: A curved arch of bone under the eye; cheekbone, jugal bone, malar and malar bone are other names
  for this sense, not the bone of the jaw and not the bone above the eye.
examples:
- The os zygomaticum forms the high point of his cheek.
- She broke her os zygomaticum in the crash.
