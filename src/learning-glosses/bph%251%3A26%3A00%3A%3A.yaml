simpleMeaning: A small gland in a man's body grows larger as he grows old, and this seems to be part of
  the natural way of aging
scope: A man's prostate gland growing larger with age; benign prostatic hyperplasia is another name for
  this. Not cancer, and not a sudden illness.
examples:
- His BPH made it hard for him to pass water.
- The doctor said his BPH was part of growing old.
