simpleMeaning: to leave your party or your group of friends, for example, to get something good for yourself
scope: This is leaving your party or group of friends, for example to get something good for yourself;
  it is not using workers who keep working when others have stopped work, and it is not the animal.
examples:
- He ratted and left his old party when a richer group offered him money.
- She ratted, leaving her group of friends behind when she saw a chance to gain.
