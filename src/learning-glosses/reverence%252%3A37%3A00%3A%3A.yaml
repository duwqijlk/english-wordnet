simpleMeaning: to hold someone or something in high regard, full of wonder, and treat them as holy or
  set far above everyday things
scope: 'Also called fear: to hold someone or something in high regard, full of wonder, treating them as
  holy or set far above everyday things, not merely to like or admire them.'
examples:
- They reverence the old temple and keep it clean.
- She reverences her grandmother's memory and speaks of her with awe.
