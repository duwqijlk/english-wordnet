simpleMeaning: A device under a millimetre wide that turns physical or chemical quantities into electric
  signals; it usually performs better over a wider range than larger versions and uses less power.
scope: This is a sensor shrunk to chip size, converting a physical or chemical reading into electricity.
  It is not an ordinary full-size sensor, nor a microchip that only processes signals without sensing
  anything.
examples:
- A microsensor in the phone measures air pressure to tell how many flights of stairs she has climbed.
- The engineers fitted a microsensor that detects tiny traces of gas inside the pipe.
