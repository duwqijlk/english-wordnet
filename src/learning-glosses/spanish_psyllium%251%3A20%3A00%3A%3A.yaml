simpleMeaning: A plantain of the lands around the Mediterranean Sea, whose seeds swell and turn to jelly
  when wet and are used as a gentle laxative
scope: Also called psyllium, fleawort and Plantago psyllium; a plantain of the Mediterranean lands whose
  seeds swell and turn to jelly when wet, not the common plantain of lawns and paths.
examples:
- Spanish psyllium grows on dry ground near the sea.
- The seeds of Spanish psyllium swell when they get wet.
