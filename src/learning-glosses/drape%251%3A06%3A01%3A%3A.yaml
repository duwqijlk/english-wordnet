simpleMeaning: A cloth kept free of germs, laid over a patient's body while a doctor looks at them or
  cuts into them
scope: A clean cloth laid over a patient during a check or an operation, not cloth hung over a window
  and not the way cloth falls.
examples:
- The nurse laid a fresh drape over the patient before the operation.
- The drape covered all but the small place where the doctor would work.
