simpleMeaning: a statement that gives the answer to a problem or shows how to find that answer
scope: 'Also called answer, result, solution, and resolution: a statement that solves a problem, not a
  liquid that can make other things melt into it.'
examples:
- He looked in the back of the book for the solvent to the problem.
- The teacher gave a clear solvent that explained how to solve the problem.
