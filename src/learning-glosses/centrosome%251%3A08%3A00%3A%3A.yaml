senseId: 'centrosome%1:08:00::'
synsetId: 05454343-n
simpleMeaning: This part of a cell lays out its tiny tubes from a small patch of cell jelly by the cell's
  control centre, where rod-shaped parts sit.
scope: This small cell patch is also called the central body.
examples:
- Each centrosome holds rod-shaped parts that set out the cell's tubes.
- The centrosome lies in the jelly-like stuff that fills the cell.
