simpleMeaning: to put something in a border, or to be around its edges like a border
scope: To put a border around something, or to sit around its edges; this is wider than just putting a
  picture in a border, and it is not building something by joining parts.
examples:
- Tall trees framed the small lake on all sides.
- She framed the mirror with a wide wooden border.
