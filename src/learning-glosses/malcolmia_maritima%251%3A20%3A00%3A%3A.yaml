simpleMeaning: An upright branching herb grown for its loose clusters of sweet-smelling white, pink, red
  or lilac flowers; native to sands and sea cliffs of southwestern Greece and southern Albania.
scope: A flowering herb of sea cliffs and sandy ground, also called Virginia stock and Virginian stock;
  not a shrub and not a tree.
examples:
- Malcolmia maritima bloomed pink on the sandy cliff.
- Gardeners grow Malcolmia maritima for its sweet scent.
