simpleMeaning: a green crawling young form of a moth (a geometrid, whose young move by looping), a pest
  of many kinds of fruit and shade trees
scope: A green crawling young form of a moth (a geometrid, whose young move by looping), a pest of many
  kinds of fruit and shade trees; not a grown moth and not a worm of the soil.
examples:
- The cankerworm ate the leaves of the apple tree.
- Gardeners sprayed the trees to stop the cankerworm.
