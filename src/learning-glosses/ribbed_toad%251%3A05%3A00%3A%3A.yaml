simpleMeaning: a frog of the west of North America with a tail-like part used in mating
scope: 'Also called a bell toad, a tailed frog, and a tailed toad: a frog of western North America with
  a tail-like mating part, not a common toad and not a tree frog.'
examples:
- We spotted a ribbed toad by a stream in western North America.
- The ribbed toad has a tail-like part the male uses when mating.
