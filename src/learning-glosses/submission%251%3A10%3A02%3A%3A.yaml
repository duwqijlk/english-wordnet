simpleMeaning: 'a paper that sets out, in law, what two sides in a fight have agreed: they will accept
  what the chosen judge says'
scope: A law paper about agreeing to accept an arbiter's decision, not a work sent in for judgment and
  not the act of giving in to someone.
examples:
- The two sides signed a submission agreeing to accept the arbiter's ruling.
- Their submission set out the terms both sides had accepted.
