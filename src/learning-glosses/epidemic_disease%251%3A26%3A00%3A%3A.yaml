simpleMeaning: an illness that breaks out, can pass from person to person, and quickly reaches a great
  many people
scope: An illness that breaks out and quickly reaches many people, not a sickness that stays with one
  person and not a slow, lasting illness.
examples:
- Cholera was an epidemic disease that swept through the city.
- Health workers raced to stop the epidemic disease from reaching more towns.
