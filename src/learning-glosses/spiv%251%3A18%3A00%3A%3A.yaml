simpleMeaning: a person with no job who makes money by dishonest tricks and goes about in smart clothes,
  enjoying life
scope: A jobless person who lives by dishonest tricks and dresses smartly and enjoys life; not an honest
  worker and not a thief who steals by force.
examples:
- The spiv in the sharp suit had no job but always had money.
- He lived like a spiv, dressing well and living off one shady deal after another.
