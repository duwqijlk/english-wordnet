simpleMeaning: Describes the cup-shaped hollow that takes the top of the thigh bone
scope: Describes the cup-shaped hollow that takes the top of the thigh bone; acetabular and cotyloidal
  are other names for this sense; not the ball at the top of the thigh bone itself.
examples:
- The cotyloid cavity holds the head of the femur.
- The surgeon looked at the cotyloid socket before the hip operation.
