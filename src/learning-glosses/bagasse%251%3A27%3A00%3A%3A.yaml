simpleMeaning: The dry dusty soft stuff left after the juice has been pressed out of sugar cane or plants
  like it
scope: The dry dusty pulp left after juice is pressed from sugar cane, not the juice itself and not the
  sickness caused by breathing its dust.
examples:
- Bagasse was piled outside the sugar mill.
- They burned the bagasse left after the cane was crushed.
