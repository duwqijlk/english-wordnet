simpleMeaning: a person who travels on a vehicle such as a bicycle or motorcycle and controls it
scope: This is a person who travels on a vehicle such as a bicycle or motorcycle and controls it; not
  a person on a horse, not a passenger who does not control the vehicle, and not a part added to a bill.
examples:
- The bicycle rider stopped at the red light.
- Every motorcycle rider must wear a helmet.
