simpleMeaning: a box or room with a very hot fire inside, where a dead body can be burned and turned to
  ash
scope: This is the burning box itself, also called a cremation chamber and also called a crematory, not
  the whole building where dead bodies are burned.
examples:
- The dead body was placed in the crematorium and burned to ash.
- The crematorium was hot enough to turn the body to ash.
