simpleMeaning: a long-lasting illness of the nose in which bad-smelling fluid runs from the nose and the
  parts inside the nose waste away
scope: A long-lasting illness of the nose, also called ozena; not a short cold and not an illness of the
  throat.
examples:
- Ozaena left him with a bad-smelling discharge from his nose.
- The doctor said her ozaena had made the parts inside her nose waste away.
