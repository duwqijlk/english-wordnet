simpleMeaning: With legs only at its front and back ends, this small young insect has no hair and is most
  often the young of one kind of moth.
scope: Also called inchworm and measuring worm, this is the young of one kind of moth, known for having
  legs only at its front and back ends.
examples:
- A looper clung to a leaf.
- A looper crawled on the leaf.
