simpleMeaning: In printing, a block of type with no letter on top, put between words or sentences to leave
  a gap
scope: In printing, a block of type with no letter on top, used to leave gaps; space is another name for
  this sense, not the thigh muscle.
examples:
- The printer put a quad between the two words.
- Quads leave gaps between sentences.
