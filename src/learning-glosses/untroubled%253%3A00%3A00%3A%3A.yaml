simpleMeaning: not worried or upset by problems, and not disturbed by anything
scope: This sense means free from problems, worry and upset, with nothing disturbing the person. It is
  the opposite of being worried or upset, not a word for happy feelings alone.
examples:
- She seemed untroubled by doubts of any kind and slept well all night.
- He had a kind, untroubled face and spoke in a calm way.
