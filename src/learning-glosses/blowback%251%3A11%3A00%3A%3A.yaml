simpleMeaning: Gas and unburnt powder that fly back out of a gun after it has been fired.
scope: Also called backfire, the gases that come back out of a gun when it fires; not the spreading of
  false news planted abroad.
examples:
- Blowback from the old rifle singed his sleeve.
- The gunners stood clear of the blowback when the gun fired.
