simpleMeaning: An upright, long-lived, strong-smelling plant with jagged, pointed leaves and a loose bunch
  of yellowish flowers, found in the eastern United States
scope: Horse balm, horseweed, richweed, stone-root, stone root and stoneroot are other names for this
  upright, strong-smelling eastern plant, whose jagged pointed leaves and loose bunch of yellowish flowers
  set it apart from other strong-smelling herbs and other yellow-flowered woodland plants.
