simpleMeaning: In South America grows a big plant that keeps its leaves all year, with leaves in threes
  and stone fruit whose hard-shelled seeds give food and cooking oil.
scope: Also called souari or souari nut, it is the South American plant itself, not the seed it bears.
examples:
- People eat the seeds of the souari tree.
- The souari tree gives oil for cooking.
