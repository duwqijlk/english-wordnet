simpleMeaning: A wild plum tree of California that keeps its leaves all year, with hard shiny leaves with
  sharp points and white flowers.
scope: A wild plum tree of California that keeps its leaves all year, also called holly-leaf cherry, holly-leaved
  cherry, and islay; not a plum grown for fruit and not a tree that drops its leaves.
examples:
- The evergreen cherry grew on the dry hillside above the town.
- White flowers covered the evergreen cherry in spring.
