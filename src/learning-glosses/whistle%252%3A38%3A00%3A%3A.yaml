simpleMeaning: to move and make a high sound as you go, or to move as if you made that sound
scope: A thing moves and makes the sound as it goes, not a person making sounds with the mouth and not
  making something else move or go away.
examples:
- The bullets whistled past him in the dark.
- An arrow whistled through the air over our heads.
