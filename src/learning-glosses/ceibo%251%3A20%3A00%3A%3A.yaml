simpleMeaning: Dark crimson and scarlet flowers grow alone or in clusters on this small, spiny tree from
  South America.
scope: This tree is also called the common coral tree, the cry-baby tree, or the crybaby tree.
examples:
- The ceibo was covered in dark crimson flowers.
- She planted a ceibo for the scarlet flowers it bears in clusters.
