simpleMeaning: A Navajo who worked in secret during the war, sending word in a code built from his own
  language, a code the Japanese could never break in World War II.
scope: This is a Navajo who worked in secret during the war, sending word in a code built from his own
  language; not an ordinary soldier and not a maker of written codes.
examples:
- The codetalker sent the message in Navajo.
- Enemy listeners could not break the codetalker's code.
