simpleMeaning: bits of blood that eat up bacteria and fungi, and are an important guard for the body against
  sickness
scope: 'Also called leucocyte, leukocyte, white blood cell, white blood corpuscle and white cell: a part
  of the blood that eats germs, not a red blood cell and not a blood clot.'
examples:
- A white corpuscle moves through the blood to catch germs.
- The doctor said the white corpuscle count was high.
