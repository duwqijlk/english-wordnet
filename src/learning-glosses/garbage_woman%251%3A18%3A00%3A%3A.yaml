simpleMeaning: a female worker whose paid work is picking up waste and getting rid of it
scope: A woman paid to take away and get rid of waste, also called a dustwoman or a garbagewoman, not
  a man who does the same work and not a woman who makes waste.
examples:
- The garbage woman emptied the bins on our street.
- Our garbage woman starts her round before dawn.
