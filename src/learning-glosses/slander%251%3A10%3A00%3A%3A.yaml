simpleMeaning: false words spoken about a person that hurt how other people think of that person
scope: Spoken false words that hurt a person's good name, not the verb sense of saying such words and
  not false words in writing.
examples:
- The story was pure slander, and none of the bad things he said were true.
- She sued him for slander after he told lies about her at the meeting.
