simpleMeaning: A fish eaten as food, found off the coasts of Europe and America in the Mediterranean Sea
  and the Atlantic Ocean
scope: A fish eaten as food from sea coasts, not a fish kept as a pet and not a fish from rivers or lakes.
examples:
- The red porgy on the menu came from the Mediterranean.
- Fishermen caught red porgy off the Atlantic coast of Europe.
