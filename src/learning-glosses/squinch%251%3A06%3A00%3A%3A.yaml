simpleMeaning: a small curved structure built across the inner corner where two walls meet, usually to
  hold up a tall pointed top
scope: A small curved structure in the inner corner where two walls meet, usually under a tall pointed
  top; not a large arch over a door and not part of a flat wall.
examples:
- Builders added a squinch across the corner to support the spire.
- A squinch sits in the upper corner where the two walls meet.
