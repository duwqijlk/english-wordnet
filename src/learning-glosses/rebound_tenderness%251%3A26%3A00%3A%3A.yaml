simpleMeaning: pain felt when a hand pressing on the belly is let go all at once, a sign that the lining
  inside the belly is sore
scope: Pain felt when pressure on the belly is let go, a sign of sore lining inside the belly, not a dull
  ache that stays put and not pain from a sore muscle.
examples:
- The doctor pressed on her belly and the rebound tenderness made her cry out when he let go.
- Rebound tenderness in his belly told the doctor that the lining inside was sore.
