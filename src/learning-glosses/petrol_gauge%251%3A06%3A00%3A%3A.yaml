simpleMeaning: A device that shows how much gasoline is left in a vehicle's tank.
scope: A device that shows how much gasoline is left in a vehicle's tank; gas gage, gas gauge, gasoline
  gage, gasoline gauge and petrol gage are other names for this sense, not a speed dial and not the tank
  itself.
examples:
- The petrol gauge showed the tank was nearly empty.
- She checked the petrol gauge before setting off.
