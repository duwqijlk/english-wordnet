simpleMeaning: If a bank across the country, or another approved money house, cannot pay its savers, this
  state-backed body covers the money in their accounts.
scope: Also called the FDIC, this is the state-backed body that covers the money in accounts at banks
  across the country and at other approved money houses, not a bank itself and not a savings account.
examples:
- The Federal Deposit Insurance Corporation guards money in banks.
- The Federal Deposit Insurance Corporation covers accounts in approved money houses.
