simpleMeaning: Either of two pairs of folds of moist skin that stick out into the voice box
scope: Either of two pairs of folds of moist skin that stick out into the voice box; vocal band, vocal
  cord and vocal fold are other names for this sense, and this is not the whole voice box.
examples:
- The plica vocalis is one of the folds in the voice box.
- Air passing the plica vocalis makes sound.
