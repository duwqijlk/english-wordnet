simpleMeaning: a person who happens to walk by a place, without having planned to go there
scope: 'Also called a passerby: a person who just happens to walk past a place; not a student who passes
  a test, and not a player who throws the ball in football.'
examples:
- Only one passer noticed the small fire and called for help.
- The bright shop window caught the eye of a passer out for a morning walk.
