simpleMeaning: a country's money system that rests most of all on buying and selling to share out goods
  and things and fix prices
scope: 'Also called free enterprise, laissez-faire economy, and market economy: a money system run most
  of all by buying and selling, not a system run by the state and not one where prices are fixed by law.'
examples:
- Private enterprise lets shops set their own prices.
- The town grew rich under private enterprise.
