simpleMeaning: 'Ethanol: the intoxicating substance in fermented and distilled drinks; solvent used pure
  or denatured in medicines, perfumes and cleaners, as rocket fuel; proposed as a renewable, clean-burning
  petrol additive.'
scope: This sense is pure ethanol, the intoxicating substance in drinks and an industrial solvent, not
  alcoholic drinks as a category and not methanol, a different, poisonous alcohol.
examples:
- Grain alcohol is often denatured before it is sold for industrial use.
- The lab used grain alcohol as a solvent to clean the glassware.
