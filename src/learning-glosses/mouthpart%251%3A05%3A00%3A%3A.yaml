simpleMeaning: On an insect or other creature with jointed legs, a bit of the opening where food goes
  in is made above all for one way of taking in food
scope: One bit of the opening where food goes in, on an insect or a creature with jointed legs, not the
  whole opening and not a leg or a wing.
examples:
- The beetle's mouthpart helped it chew the tough leaf.
- Each mouthpart of the ant is made for a different way of feeding.
