simpleMeaning: A person who forgives a fault or offence or lets it pass.
scope: A person who forgives a fault or offence; also called a forgiver or a pardoner, not the person
  who committed the fault and not a judge.
examples:
- An excuser of faults, she bore no grudges.
- The excuser forgave the boy for breaking the vase.
