simpleMeaning: very hot, with wet air, or such that people sweat a lot and feel weak
scope: It describes weather or a place that is very hot with wet air, not just warm weather and not dry
  heat.
examples:
- On that sweltering afternoon, the wet air made us sweat and feel weak.
- The athletes looked faint in the sweltering heat.
