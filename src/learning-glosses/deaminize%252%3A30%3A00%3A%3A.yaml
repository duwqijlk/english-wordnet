simpleMeaning: To take the amino group off a chemical that holds one, usually by adding water.
scope: This is taking the amino group off a chemical, also called deaminate, not adding an amino group
  to a chemical or breaking a chemical apart in general.
examples:
- The enzyme can deaminize the chemical in the cell.
- Scientists deaminize the compound to study how it changes.
