simpleMeaning: What you do when you take an object in your hands.
scope: A hand movement that takes an object, as in sport; it is not the object itself, not the game of
  tossing a ball back and forth, not the seizing of a criminal, not something snagging, not a faithful
  copy, not a catcher's play, or a pursuit gaining ground.
examples:
- He made a diving catch to end the inning.
- Her one-handed catch brought applause from the crowd.
