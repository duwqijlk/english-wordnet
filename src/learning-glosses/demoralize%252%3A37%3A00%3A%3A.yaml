simpleMeaning: to make someone feel low, sad and without hope
scope: 'Also called depress, dismay, deject, dispirit and demoralise: making someone lose hope, not making
  someone behave in a bad or wrong way.'
examples:
- The long run of losses demoralized the team.
- Bad news about her child's health demoralizes her.
