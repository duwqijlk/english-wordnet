schema: oewn-learning-gloss-v2
senseId: 'stereotypically%4:02:00::'
synsetId: 00468284-r
simpleMeaning: in a way that uses a fixed, simple idea about what a type of person or group is like, not
  real differences
scope: In a way that uses a fixed idea about a whole group; not in a way that is just common or usual
  for one person.
examples:
- The film shows women stereotypically, as if they all care only about clothes.
- He spoke stereotypically about old people, as if they all hate new things.
