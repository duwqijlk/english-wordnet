simpleMeaning: to tie a boat or ship in place with strong ropes or cables
scope: To hold a boat in place with ropes or cables; this sense is about the ropes, not open wild land
  and not only the boat's place at a dock.
examples:
- They moored the boat to the post with thick ropes.
- The crew moor the ship with heavy cables at night.
