simpleMeaning: to do with mercury (a silver liquid metal), having it inside, or made to happen by it
scope: About mercury the metal, not about a person or thing that changes suddenly and without warning.
examples:
- This old mercurial medicine contains mercury.
- A mercurial sore in the mouth can be caused by mercury.
