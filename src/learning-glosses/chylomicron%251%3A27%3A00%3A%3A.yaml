senseId: 'chylomicron%1:27:00::'
synsetId: 14836529-n
simpleMeaning: A microscopic particle of triglycerides made in the intestines during digestion, which
  releases fatty acids into the blood in the bloodstream.
scope: This tiny particle is made in the gut during digestion and releases fatty acids in the bloodstream;
  it does not stay only in the gut.
examples:
- The chylomicron carried fat from the gut into the blood.
- Chylomicrons form in the gut while food is being digested.
