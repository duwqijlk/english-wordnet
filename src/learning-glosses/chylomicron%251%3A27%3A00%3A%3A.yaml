simpleMeaning: When it reaches the bloodstream, this tiny bit of fat made in the gut while food is being
  digested lets its fatty parts go into the blood
scope: This tiny bit of fat is made in the gut while food is being digested and lets its fatty parts go
  into the blood when it reaches the bloodstream; not a bit of fat that stays in the gut.
examples:
- The chylomicron carried fat from the gut into the blood.
- Chylomicrons form in the gut while food is being digested.
