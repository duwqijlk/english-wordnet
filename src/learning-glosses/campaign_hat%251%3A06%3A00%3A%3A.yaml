simpleMeaning: Soldiers of the United States Army and Marines once wore this felt head-covering with a
  wide brim and a high top.
scope: This felt head-covering with a wide brim and a high top was once worn by soldiers of the United
  States Army and Marines, not one worn by soldiers today.
examples:
- The campaign hat had a wide brim and a high top.
- Soldiers of the United States Army once wore the campaign hat.
