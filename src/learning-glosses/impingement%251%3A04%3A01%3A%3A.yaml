simpleMeaning: One thing strikes or dashes hard against another, and the two crash together in a sharp
  hit
scope: This is a hard crash when one thing strikes another; impaction is another name for this sense,
  not a slow push or a light touch.
examples:
- The impingement of the two cars left both badly dented.
- A sudden impingement shook the whole gate.
