simpleMeaning: In psychiatry, not wanting to let feelings that were pushed out of the mind come into clear
  knowing
scope: In psychiatry, this is a mind's holding back of hidden feelings, not fighting against an idea or
  plan, not a thing's slowing of electric flow, and not the body's power to fight illness.
examples:
- In treatment, his resistance kept him from talking about the painful feelings he had pushed away.
- The doctor saw her resistance when she changed the subject every time the hidden fear came up.
