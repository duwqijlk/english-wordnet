simpleMeaning: Mainly in old-fashioned use, to let someone take goods or borrow money now and pay later.
scope: This is the old commercial act of letting a customer pay later, not having faith in someone's honesty,
  not feeling safe enough to allow something without fear, not being confident that something is true,
  not hoping for something, not putting property in a trustee's hands, and not the noun senses such as
  a property arrangement or a group of businesses that limits competition.
examples:
- The village shopkeeper trusted us for a sack of flour until the harvest.
- In those days the merchant trusted farmers for seed and tools each spring.
