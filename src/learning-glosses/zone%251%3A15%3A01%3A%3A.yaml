simpleMeaning: a region that is set apart from the areas beside it by one shared feature
scope: This is a region defined by contrast with its neighbours, not a small bounded patch, and not a
  broad latitude band of the earth.
examples:
- The coastal zone stays mild even in winter.
- A wide zone of damaged trees showed where the storm had passed.
