senseId: 'escape%1:04:02::'
synsetId: 00430425-n
simpleMeaning: the tendency to use daydreams or other distractions to get relief from an unpleasant reality
scope: A mental tendency to withdraw into distraction or fantasy, not a physical act of getting away,
  not the act of avoiding danger or difficulty, and not a means or way of getting away.
examples:
- Romantic novels were her escape from the stress of daily life.
- His drinking was a form of escape from problems he could not face.
