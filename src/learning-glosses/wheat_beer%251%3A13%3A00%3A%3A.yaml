simpleMeaning: A general name for drinks made from the grain used to make white flour, by top brewing,
  most often very pale, cloudy and full of bubbles.
scope: A general name for pale, cloudy drinks made from the grain used to make white flour; white beer
  is another name for this sense, not a dark stout and not a clear lager.
examples:
- They drank wheat beer with their meal, pale and cloudy as it was.
- This wheat beer is full of bubbles and very pale.
