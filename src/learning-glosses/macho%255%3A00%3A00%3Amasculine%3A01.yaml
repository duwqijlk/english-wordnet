simpleMeaning: 'used of men: very man-like and strong in how a man looks or acts'
scope: 'Also called butch: used of a man who looks and acts in a very strong, man-like way. This is the
  describing word, not the noun that names the man himself.'
examples:
- His macho voice and big arms made him look tough.
- He wore heavy boots and a leather jacket to look macho.
