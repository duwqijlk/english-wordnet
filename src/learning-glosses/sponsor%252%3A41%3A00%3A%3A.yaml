simpleMeaning: to buy things at a place, do business with it, or be one of its customers
scope: 'Also called shop and frequent: to buy from or use a place as a customer. It is not to pay for
  and support an event or person, and not a person who speaks for someone else.'
examples:
- We sponsor the small shop on the corner by buying our bread there every day.
- He sponsors his local bookshop and would not buy books anywhere else.
