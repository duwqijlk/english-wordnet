simpleMeaning: This muscle lifts the lower jaw to shut the mouth; it runs from the hollow at the side
  of the head to the bony point of the lower jaw.
scope: Also called temporal muscle, temporalis, and temporalis muscle, it is a muscle that lifts the lower
  jaw to shut the mouth.
examples:
- His musculus temporalis ached after chewing tough meat.
- The musculus temporalis raises the jaw when you bite down.
