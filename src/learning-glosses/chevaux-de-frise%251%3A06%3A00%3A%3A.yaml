simpleMeaning: A movable defensive barrier of barbed wire or spikes fixed to a wooden frame, set up to
  block mounted troops.
scope: The plural name for this movable barrier; cheval-de-frise is the singular for the same obstacle,
  and neither means a fixed wall or trench.
examples:
- Rows of chevaux-de-frise guarded the approach to the bridge.
- The defenders set out chevaux-de-frise to break up the charge.
