simpleMeaning: sending out light freely, or throwing back a lot of the light that falls on it
scope: This is about how much light a thing gives out or returns, not about a polished surface's shine,
  a happy mood, or a light left undimmed.
examples:
- The sun was bright and hot all afternoon.
- The kitchen was bright because the wide windows faced south.
