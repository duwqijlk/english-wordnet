senseId: 'conversion%1:10:00::'
synsetId: 07117149-n
simpleMeaning: 'In logic, the swapping of the two parts of a statement: the thing the statement is about
  and the part that says something about it'
scope: In logic, swapping the two parts of a statement; not a new life through faith and not a change
  of feelings into signs of illness in the body.
examples:
- In logic, the conversion of 'No cat is a dog' gives 'No dog is a cat'.
- The teacher showed the conversion of a statement by putting its second part first.
