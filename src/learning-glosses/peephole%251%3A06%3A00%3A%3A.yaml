senseId: 'peephole%1:06:00::'
synsetId: 03911327-n
simpleMeaning: a small hole in a door, an oven, or something like that, made so a person can look through
  it
scope: A small hole for looking through, also called eyehole and spyhole. It is not a large opening, a
  window, or a keyhole.
examples:
- She looked through the peephole in the front door before she opened it.
- The peephole in the oven door let him check the bread without opening it.
