simpleMeaning: a long black piece of clothing that goes down to the ankles and is worn by priests or church
  singers
scope: This is the long black clothing worn by priests or church singers, not a short coat and not ordinary
  everyday clothes.
examples:
- The priest wore a black cassock for the service.
- A young singer in the church choir wore a cassock too.
