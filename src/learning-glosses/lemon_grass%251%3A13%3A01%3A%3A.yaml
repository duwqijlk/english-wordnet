simpleMeaning: Sweet-smelling leaves of one kind of plant, used in cooking and in old healing ways, and
  often put in herb drinks and food extras.
scope: Used in cooking and in old healing ways, and often put in herb drinks and food extras, these sweet-smelling
  leaves are not the plant itself nor the oil that smells of lemon.
examples:
- Lemon grass gave the soup a sweet smell.
- Lemon grass is often put in herb teas.
