simpleMeaning: to turn something into a bad, silly copy that is not true to it
scope: The action of making a bad mocking copy, not the funny play itself and not the piece of writing
  that copies a style in a funny way.
examples:
- The film travestied the true story of her life.
- He travestied her speech by turning it into a silly joke.
