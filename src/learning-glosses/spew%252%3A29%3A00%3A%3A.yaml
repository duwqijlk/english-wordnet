simpleMeaning: to bring up what is in the stomach and out through the mouth
scope: 'Also called sick, cat, cast, vomit, puke, chuck, purge, retch, and honk: to throw up what is in
  the stomach, not to send out something in large amounts.'
examples:
- After drinking too much, he spewed into the bushes.
- The sick child spewed all over the floor.
