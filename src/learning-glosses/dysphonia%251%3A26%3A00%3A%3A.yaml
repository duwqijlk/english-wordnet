simpleMeaning: Speaking goes wrong because the voice does not make sounds as it should
scope: A fault in speaking that comes from a fault in making voice sounds, not a fault in hearing and
  not a fault in knowing words.
examples:
- Dysphonia left his voice rough and hard to hear.
- After the cold, her dysphonia made each word come out as a whisper.
