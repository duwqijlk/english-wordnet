simpleMeaning: a road in a town, with buildings along it and usually paths at the sides for walking.
scope: It is not just the roadway where cars travel, and not the poor, criminal side of city life.
examples:
- They live on a quiet street near the park.
- Shops and cafes line the main street of the village.
