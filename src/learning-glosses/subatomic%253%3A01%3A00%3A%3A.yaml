simpleMeaning: having to do with the small parts that make up an atom, or with the forces inside it
scope: This is about the small parts inside an atom or smaller than an atom; it is not about whole atoms
  and not about large things in everyday life.
examples:
- Subatomic particles are much smaller than a whole atom.
- Scientists study subatomic forces inside the atom.
