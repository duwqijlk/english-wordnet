senseId: 'unfathomable%3:00:00::'
synsetId: 00998229-a
simpleMeaning: Too deep to be measured, with no line or tool able to reach down and find the bottom
scope: This is about a depth that cannot be measured, not about a thing that only looks like a bottomless
  pit.
examples:
- The unfathomable lake gave no reading on their instruments.
- Its depth was unfathomable, even with the longest line they had.
