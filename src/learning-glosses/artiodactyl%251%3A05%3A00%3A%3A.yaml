senseId: 'artiodactyl%1:05:00::'
synsetId: 02397129-n
simpleMeaning: A mammal whose young grow inside the mother before birth, with hooves that have an even
  number of working toes on each foot
scope: A mammal with hooves that have an even number of working toes, also called an artiodactyl mammal
  and an even-toed ungulate; not an animal with one hoofed toe on each foot and not a clawed animal.
examples:
- The deer is an artiodactyl, with an even number of toes on each foot.
- Pigs and deer are artiodactyls, unlike horses.
