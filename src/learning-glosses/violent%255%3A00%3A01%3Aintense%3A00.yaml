simpleMeaning: Very strong in feelings or beliefs, full of strong feeling, and likely to react with great
  force
scope: Also called fierce and tearing. This is about very strong feelings or beliefs, not about bright
  colors or loud sounds, and not about blood and hurting people.
examples:
- She felt violent hatred for the people who had hurt her family.
- He held his beliefs with violent strength and was quick to argue for them.
