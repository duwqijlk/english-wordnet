simpleMeaning: 'A sound pick-up that works through an electric part: one flat piece stays fixed while
  sound waves move the other, which forms a thin sheet.'
scope: This sound pick-up is also called a capacitor microphone, a capacitor mike, or a condenser mike.
examples:
- The condenser microphone caught every word of the speech.
- She spoke into a condenser microphone at the meeting.
