simpleMeaning: A fish that swims after ships, found in the coastal waters of North and South America.
scope: This fish follows ships in the coastal waters of North and South America; banded rudderfish and
  rudderfish are other names for this sense.
examples:
- Seriola zonata followed the ship for miles along the coast.
- Fishermen often see Seriola zonata swimming in the wake of their boats.
