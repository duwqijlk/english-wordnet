simpleMeaning: Life stuck in the same dull pattern, with no easy way to change it
scope: Life stuck in the same dull pattern, with no easy way to change it, with groove as another name
  for this sense, not a groove cut in the ground and not the mating season of animals.
examples:
- He felt stuck in a rut, doing the same things every day.
- She left her job to break out of the rut she was in.
