simpleMeaning: The part of a hospital where women are cared for while they are with child, while giving
  birth, and where new babies are cared for
scope: The part of a hospital where women are cared for while they are with child, while giving birth,
  and where new babies are cared for; not a nursery alone and not an operating room.
examples:
- She was taken to the maternity ward when her pains began.
- The maternity ward cared for mothers and new babies.
