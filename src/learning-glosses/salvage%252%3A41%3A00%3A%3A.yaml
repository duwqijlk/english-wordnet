simpleMeaning: to pull something back from being lost or spoiled, and keep it safe
scope: To save something from ruin or harm, also called save and relieve; not the rescue of a ship after
  a wreck, and not saving goods in danger on land.
examples:
- They salvaged what they could from the burned house.
- She salvaged her good name after the false claims.
