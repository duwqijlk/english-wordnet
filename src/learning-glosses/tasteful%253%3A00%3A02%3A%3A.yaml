senseId: 'tasteful%3:00:02::'
synsetId: 02401445-a
simpleMeaning: Having a good sense of what is pleasing and right, and showing that sense or acting in
  line with it in how things look or are done
scope: About knowing what is pleasing and fitting in how things look or are done, not about food having
  a good flavour.
examples:
- She chose tasteful colours for the quiet room.
- His tasteful speech thanked everyone without going on too long.
