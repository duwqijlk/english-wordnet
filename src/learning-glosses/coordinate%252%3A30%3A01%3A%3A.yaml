simpleMeaning: To bring parts into good working order together, so each part fits with the others
scope: To bring parts into good order together, also called align; not a number that marks a place, and
  not the equal-rank adjective.
examples:
- She coordinated the work of the three teams so nothing clashed.
- He coordinated the wheels of the car after fitting the new tyres.
