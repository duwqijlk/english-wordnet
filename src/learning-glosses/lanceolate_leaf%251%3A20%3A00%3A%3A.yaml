simpleMeaning: Narrowing to a point at each end, this flat part of a plant is shaped like a spear head
scope: A plant part shaped like a spear head with a point at each end, not a round part and not one with
  a point at one end only.
examples:
- The lanceolate leaf narrows to a fine point at its tip and at its base.
- She drew a lanceolate leaf with a point at each end.
