simpleMeaning: A commonly grown larkspur of southern Europe, with unbranched spike-like clusters of blue
  or sometimes purplish or pinkish flowers; sometimes put in the genus Delphinium.
scope: 'Also called rocket larkspur and Delphinium ajacis: a garden larkspur, not a wild delphinium, and
  not a shrub.'
examples:
- Consolida ambigua bloomed blue along the path.
- We sowed Consolida ambigua in the sunny bed.
