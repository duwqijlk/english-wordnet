simpleMeaning: a complex ester, a substance made when an acid joins alcohol, used to make fibres, resins
  or plastics, or added to plastic to make it soft
scope: A substance used to make fibres, resins and plastics, or added to plastic to make it soft; not
  the light, strong resin itself, which is not easily harmed by weather.
examples:
- The factory uses a polyester to make fibres for cloth.
- A polyester can also be added to plastic to make it soft.
