simpleMeaning: a piece of meat cut from an animal's side, between its ribs and its leg
scope: This is a piece of meat from the side of an animal, not the side of a group of soldiers and not
  the side of a building.
examples:
- The butcher sold her a piece of flank for dinner.
- Flank can be tough, so cook it slowly.
