senseId: 'trade-last%1:10:00::'
synsetId: 06708169-n
simpleMeaning: a kind word about you that I heard from others and pass on, in return for a kind word about
  me that you heard from others and pass on
scope: A kind word about you passed on in return for a kind word about me; not a plain compliment and
  not a swap of goods.
examples:
- He offered her a trade-last about her singing.
- As a trade-last, she told him what others had said about his cooking.
