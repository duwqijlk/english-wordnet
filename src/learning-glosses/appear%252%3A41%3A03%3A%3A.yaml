simpleMeaning: To go in person before a judge or other official authority.
scope: This is about attending court or an official hearing in person, not about seeming true, coming
  into sight, beginning to exist, or performing on stage.
examples:
- The defendant must appear in court next Monday.
- The witness appeared before the grand jury.
