simpleMeaning: A flowering plant with two first small leaves in the seed, whose stem grows by adding layers
  on the outside
scope: This is a flowering plant with two first small leaves in the seed; dicot, exogen and magnoliopsid
  are other names for it, not a plant with one first leaf and not a plant whose stem grows only from the
  tip.
examples:
- A bean is a dicotyledon because it has two first leaves in the seed.
- Most garden flowers are dicotyledons.
