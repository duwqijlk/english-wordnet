simpleMeaning: that reacts, works, or lets movement go in two directions, usually opposite to each other
scope: This means movement or work in two directions, usually opposite; it is not movement in only one
  direction.
examples:
- The road is bidirectional, so cars can travel in both directions.
- They put in a bidirectional gate that can swing both ways.
