schema: oewn-learning-gloss-v2
senseId: 'hollowness%1:07:01::'
synsetId: 04875102-n
simpleMeaning: the quality of hiding what you really think, not telling the truth, and acting in a way
  that is not true to what you say
scope: 'Also called falseness and insincerity: the quality of hiding the truth, not the sense that means
  being empty inside with a space within.'
examples:
- People could feel the hollowness in his kind words, because he never meant them.
- Her promise sounded warm, but its hollowness was clear when she did nothing to help.
