simpleMeaning: Its carbon chain carries many double links, the first of them six atoms from the start
  of the chain, which makes it a fat-like substance.
scope: It is also called omega-6, a fat-like substance whose carbon chain carries many double links.
examples:
- Omega-6 fatty acid differs from omega-3 fatty acid in where its first double link sits.
- In omega-6 fatty acid, the first double link sits six atoms from the start of the chain.
