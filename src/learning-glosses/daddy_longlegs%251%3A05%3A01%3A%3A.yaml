simpleMeaning: Thin flies with legs that stretch far and look like big mosquitoes but do not bite.
scope: This is a thin fly with long legs that looks like a big mosquito but does not bite, also called
  a crane fly, not a real mosquito or a spider with long legs.
examples:
- A daddy longlegs sat on the window, its thin legs spread wide.
- Daddy longlegs look like big mosquitoes, but they do not bite.
