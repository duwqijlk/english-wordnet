simpleMeaning: A low evergreen shrub of southern Europe and Asia Minor that spreads into mats, with stiff
  stems and clusters of small bell-shaped flowers at the branch tips.
scope: This is the low, mat-forming southern European shrub with stiff stems and small bell-shaped flowers;
  it is not heather or other common heaths, and not a tall spiky plant.
examples:
- Spike heath spreads across the open ground in a low green mat.
- In spring the spike heath is covered with tiny bell-shaped flowers.
