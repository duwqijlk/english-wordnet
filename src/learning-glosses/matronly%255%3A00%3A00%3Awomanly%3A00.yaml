simpleMeaning: right for or typical of a woman who is fully grown up
scope: Describes a woman who is fully grown up, or what suits her; it does not describe a young girl.
examples:
- She had a kind, matronly manner with the children in her care.
- Her matronly figure suited her place as head of the family.
