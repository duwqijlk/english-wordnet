simpleMeaning: A group of British socialists who press for slow reforms inside the law, leading to democratic
  socialism
scope: A British socialist group that works for slow reforms inside the law toward democratic socialism,
  unlike revolutionary socialists who want sudden change, a trade union, or another reform group that
  works outside the law.
examples:
- The Fabian Society pressed for slow reform inside the law.
- Members of the Fabian Society hoped for democratic socialism.
