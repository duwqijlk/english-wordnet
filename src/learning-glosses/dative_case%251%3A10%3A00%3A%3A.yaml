simpleMeaning: The group of nouns that act as the indirect object of a verb.
scope: This is the group of nouns that act as the indirect object of a verb, also called the dative, not
  the group that acts as the direct object or the group that shows who owns a thing.
examples:
- The dative case marks the indirect object of the verb.
- We learned the dative case in our Latin lesson.
