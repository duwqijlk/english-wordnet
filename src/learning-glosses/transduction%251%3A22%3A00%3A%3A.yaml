simpleMeaning: The way a machine takes in energy in one form and gives back matching energy in another
  form.
scope: The changing of energy from one form to another by a machine that takes energy in, not the carrying
  of gene stuff from one cell to another by a small ring of gene stuff or by a virus that attacks germs,
  in the study of genes.
examples:
- The transduction of sound waves into electric signals happens inside the microphone.
- Engineers studied transduction in the new sensor.
