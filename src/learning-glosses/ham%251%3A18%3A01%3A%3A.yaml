simpleMeaning: a person who has a licence to use radio to talk to others as a hobby, not for work
scope: A person with a licence who uses radio as a hobby; not meat from a pig, and not a bad actor who
  does too much.
examples:
- The ham spoke to another radio user in Canada last night.
- As a ham, she uses her home radio to talk to people in other towns.
