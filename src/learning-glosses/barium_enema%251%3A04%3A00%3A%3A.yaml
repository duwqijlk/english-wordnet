simpleMeaning: An enema in which a fluid that shows up on X-rays, usually barium sulfate, is shot into
  the lower gut and pictures are taken to hunt for sores.
scope: 'A medical test: a contrast fluid is put into the rectum and X-rays are taken to look for lesions.'
examples:
- The barium enema uses a fluid that shows up on X-rays.
- Barium enemas hunt for sores.
