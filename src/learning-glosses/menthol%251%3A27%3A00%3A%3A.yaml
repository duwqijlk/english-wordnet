simpleMeaning: a crystal-like substance with a cool, minty taste and smell, found naturally in peppermint
  oil; used for flavoring and in medicine to ease itching, pain and a blocked nose
scope: The cooling compound from peppermint oil, not the oil itself or the similar compound camphor.
examples:
- Menthol in the cough drops left a cool, minty feeling in her mouth.
- The cream contains menthol, which eases itching and stuffy noses.
