simpleMeaning: A tool with soft padded jaws that hold timber boards without denting them
scope: A tool with padded jaws that holds timber without denting it; shoulder vise and wood vise are other
  names for this sense, not a bare-jawed metal vise.
examples:
- He clamped the board in the woodworking vise before he cut it.
- The woodworking vise held the plank steady without leaving a mark.
