simpleMeaning: A hairy, upright herb native to southeastern Asia, grown widely for its large shiny fruit,
  which is commonly eaten as a vegetable.
scope: This is the plant that bears the fruit, not the fruit or vegetable itself, though the same word
  often names both. Aubergine is the British name; American English says eggplant.
examples:
- Aubergine grows best in warm soil and full sun.
- The aubergine in their garden reached almost to the fence.
