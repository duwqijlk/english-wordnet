simpleMeaning: to make new plants from a plant, such as by grafting (joining a cut part to another plant)
  or by layering (bending a stem down to grow roots)
scope: A person making new plants from a plant, such as by grafting or layering, not living things making
  more of themselves on their own.
examples:
- Gardeners propagate roses by grafting a cut part onto another plant.
- She learned to propagate the vine by layering a stem in the soil.
