simpleMeaning: a dye that shows whether a liquid is an acid or a base, working for liquids with a pH,
  how acid it is, between 3.0 and 4.6
scope: 'Also called bromphenol blue: a dye that shows whether a liquid is an acid or a base, not the bromothymol
  blue dye and not a dye for cloth.'
examples:
- The lab added bromophenol blue to the liquid to test it.
- Bromophenol blue changed colour as the liquid grew more acid.
