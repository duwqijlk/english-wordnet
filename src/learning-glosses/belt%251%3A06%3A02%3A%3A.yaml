simpleMeaning: bullets for a machine gun, usually small, joined together in bendable strips that are linked
  one to the next
scope: Strips of bullets fed into a machine gun, not a loop that joins turning machine parts and not a
  band worn round the waist.
examples:
- The soldier loaded a fresh belt into the machine gun.
- The belt held a long line of bullets ready to fire.
