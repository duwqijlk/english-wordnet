simpleMeaning: a plant with a tall woody stem whose seeds grow inside a closed case in its flowers
scope: 'Also called a flowering tree: a plant whose seeds grow inside a closed case, not a tree whose
  seeds lie bare in cones.'
examples:
- The old angiospermous tree in the park drops its seeds each autumn.
- An angiospermous tree keeps its seeds inside a case, unlike a pine.
