simpleMeaning: At least one bit in the ring is not carbon, and the bits form a closed ring
scope: A closed ring of atoms with at least one atom that is not carbon, not a ring made only of carbon
  atoms and not an open chain of atoms.
examples:
- The heterocyclic compound has a nitrogen atom in its ring.
- Pyridine is a heterocyclic chemical with one nitrogen atom in its ring.
