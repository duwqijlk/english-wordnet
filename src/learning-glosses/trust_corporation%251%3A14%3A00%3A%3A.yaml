simpleMeaning: In charge of money held for others, things in its care, shares that change hands, or other
  such work, this body, usually with a commercial bank, works for others.
scope: People also call this body a trust company; it works for others, usually with a commercial bank.
examples:
- The trust corporation took charge of the money held for the orphans.
- The trust corporation handled the shares when the owner died.
