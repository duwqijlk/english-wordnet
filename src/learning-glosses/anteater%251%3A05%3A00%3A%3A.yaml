simpleMeaning: Any of several mammals of the warm parts of America, of the group called Myrmecophagidae,
  with no teeth, that feed on ants and termites.
scope: The toothless mammals of warm America that feed on ants and termites, not the African burrower,
  not the spiny egg-laying ones of Australia and New Guinea, not the scaly one of Africa and Asia, and
  not the small Australian marsupial.
examples:
- The anteater licked up ants with its long tongue.
- An anteater feeds on ants and termites in the warm forests.
