simpleMeaning: to fill a place with smoke or gas, especially to kill germs or pests
scope: To fill a place with smoke or gas to kill germs or pests, not the cloud itself, not the face wet
  with sweat or blood, and not giving off such a cloud.
examples:
- They fumed the old house to kill the pests.
- The workers fumed the storeroom before the grain went in.
