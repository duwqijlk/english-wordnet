senseId: 'myrmecophile%1:05:00::'
synsetId: 01388995-n
simpleMeaning: A living thing, an insect for example, that makes its home in the nest of one kind of ant.
scope: A living thing that makes its home in the nest of one kind of ant, not an ant itself and not a
  creature that only visits the nest.
examples:
- The tiny beetle is a myrmecophile that lives in the ants' nest.
- A myrmecophile shares the nest with the ants it lives among.
