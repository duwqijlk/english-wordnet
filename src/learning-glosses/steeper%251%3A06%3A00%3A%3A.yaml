simpleMeaning: a container, usually a pot or a large tub, used for soaking something in liquid
scope: A container used for soaking things in liquid, not a slope or hill that rises more sharply.
examples:
- The tea leaves were left in the steeper overnight.
- He poured the liquid out of the steeper.
