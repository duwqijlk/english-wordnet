senseId: 'renewable_resource%1:21:00::'
synsetId: 13353515-n
simpleMeaning: a thing from nature, like wood or the sun's light, that grows back on its own over time
scope: A thing from nature that grows back on its own over time, not a thing that runs out once used and
  not a thing made in a factory.
examples:
- Wood is a renewable resource because new trees grow to take the place of cut ones.
- The sun's light is a renewable resource that never runs out.
