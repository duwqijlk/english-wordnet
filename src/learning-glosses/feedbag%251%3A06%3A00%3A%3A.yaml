simpleMeaning: a bag of strong cloth that fits over an animal's nose and mouth and ties at the top of
  its head, so the animal can eat from it
scope: 'Also called a nosebag: a bag of strong cloth that fits over an animal''s nose and mouth, not a
  sack for carrying feed and not a halter.'
examples:
- The farmer hung a feedbag on the horse's head.
- She filled the feedbag with oats before the long ride.
