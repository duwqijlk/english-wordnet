simpleMeaning: A stone on the outside of a large and important building, usually with a date cut into
  it and put in place in a special ceremony
scope: This is the special stone on the outside of a large building, usually with a date, not a plain
  stone where two walls meet, and not the basic ideas something starts from.
examples:
- The mayor laid the cornerstone of the new library in a small ceremony.
- The cornerstone bears the year 1900 cut deep into its face.
