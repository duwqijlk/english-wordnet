simpleMeaning: The quality of being bright and happy in a way that makes sad or dark feelings go away
scope: Cheer and sunshine are other names for this sense; this is a bright quality that drives gloom away,
  not a single happy act.
examples:
- Flowers added a note of cheerfulness to the drab room.
- Her cheerfulness lifted everyone at the table.
