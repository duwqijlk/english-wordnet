simpleMeaning: A lily of the western Sierra Nevada slopes in the San Joaquin Valley, with wavy stems and
  egg-shaped flowers that are deep rose-pink or purple.
scope: A globe lily with deep rose-pink or purple egg-shaped flowers, not a true rose or other globe lilies.
examples:
- A rose globe lily was blooming on the shaded slope below the pass.
- Each rose globe lily hung its egg-shaped pink flower from a bending stem.
