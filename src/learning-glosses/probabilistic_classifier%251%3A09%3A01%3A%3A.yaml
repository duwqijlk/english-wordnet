simpleMeaning: How likely each group is, not just which group is most likely, is what this tool says when
  it is given one new thing to sort.
scope: A sorting tool that gives odds for every group, not one that only names the single best group.
examples:
- The probabilistic classifier said the new email was most likely spam but gave some chance to the other
  groups too.
- A probabilistic classifier does not just pick one group; it gives a chance for each group.
