simpleMeaning: A thin skin-like cover joined to the young fruiting body of some mushrooms.
scope: A thin cover on the young fruiting body of a mushroom; veil is another name for this sense; not
  the cap itself and not the stalk.
examples:
- The velum still covered the young mushroom's cap.
- Under the microscope, the velum looked like a thin pale skin.
