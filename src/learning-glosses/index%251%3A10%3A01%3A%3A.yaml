synsetId: 06652323-n
simpleMeaning: a number or ratio (a comparison of two numbers) on a measuring scale, made from a series
  of facts that were seen; it can show changes over time when compared
scope: This is a number made from a series of facts that were seen, placed on a measuring scale to show
  change over time. Not the list of names and subjects at the back of a book, not a plain scale used to
  compare numbers with each other, and not a small number that shows how many times to multiply a number
  by itself.
examples:
- The price index rose again last month as food costs went up.
- Doctors use this index to follow changes in patients' health over time.
