simpleMeaning: In geometry, a curve made where a flat face cuts through a round solid that narrows to
  a point
scope: In geometry, a curve made where a flat face cuts a round solid, also called a conic section, not
  a straight line and not a flat shape.
examples:
- A conic can be a circle, an oval, or a curve like a parabola.
- The conic formed where the plane met the solid.
