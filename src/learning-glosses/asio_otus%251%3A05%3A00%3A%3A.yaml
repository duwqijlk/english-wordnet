simpleMeaning: A slim owl of Europe that lives in woods of cone-bearing trees and has long tufts above
  its ears.
scope: Also called a long-eared owl; a slim owl of the cone-bearing woods of Europe with long tufts above
  its ears.
examples:
- An Asio otus called from the pine woods at dusk.
- The Asio otus has long tufts above its ears and hunts in conifer woods.
