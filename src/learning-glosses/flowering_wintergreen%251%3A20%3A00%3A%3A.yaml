simpleMeaning: a common milkwort plant of eastern North America, living for years and creeping along the
  ground, with leaves like a green herb and, most often, pink-purple blooms with wing-like parts
scope: A low plant of eastern North America, also called bird-on-the-wing, fringed polygala and gaywings,
  not the wintergreen shrub whose leaves are used for tea.
examples:
- The flowering wintergreen crept along the ground under the pines.
- We found flowering wintergreen with pink-purple blooms near the path.
