simpleMeaning: For a bottle or other container, closed with a piece pushed into the opening
scope: About a bottle or container closed in this way, not about a door or road that is shut or blocked.
examples:
- The tightly stoppered bottles stood on the shelf.
- Keep the bottle stoppered so the liquid does not spill.
