simpleMeaning: A handsome small tree or shrub from South America with bright scarlet flowers, valuable
  fine-grained yellowish wood, and a bitter drug taken from its wood and bark.
scope: This sense is the South American plant with scarlet flowers and fine yellow wood; bitterwood is
  another name for it, and it is not the bitter drug made from its wood and bark.
examples:
- A quassia shrub with scarlet flowers stood in the corner of the garden.
- The bark of the quassia yields a bitter drug.
