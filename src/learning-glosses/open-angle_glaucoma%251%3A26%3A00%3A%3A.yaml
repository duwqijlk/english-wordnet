simpleMeaning: Sight at the edges slowly fades in this disease of the eye, where the canal of Schlemm,
  the drain for fluid in the eye, gets blocked.
scope: 'It is also called chronic glaucoma: it is a disease of the eye in which a blocked drain slowly
  takes away sight at the edges, not one that strikes all at once.'
examples:
- Open-angle glaucoma slowly took away the sight at the edges of his view.
- Her doctor found open-angle glaucoma before she noticed any loss of sight.
