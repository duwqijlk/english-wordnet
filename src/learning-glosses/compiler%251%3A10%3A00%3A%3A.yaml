simpleMeaning: In computer science, a program that changes instructions in a language closer to human
  words into a program in assembly language, a language close to how a computer works
scope: A computer program that changes code from one language to another, not a person who gathers information
  and puts it together into a book or list.
examples:
- The compiler turned my code into a program the computer could run.
- When the compiler finished, it had made a new assembly language program.
