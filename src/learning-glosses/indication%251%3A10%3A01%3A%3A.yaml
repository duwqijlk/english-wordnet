simpleMeaning: the act of naming something, or pointing it out by its name
scope: The act of naming or pointing something out, not a sign of something and not a course of action
  that is needed.
examples:
- Her indication of the street by name helped us find the house.
- The judge's indication of the suspect by name surprised the court.
