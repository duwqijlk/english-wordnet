simpleMeaning: Where words are split into sentences, clauses, and phrases, these signs show the breaks
  and make the sense clear.
scope: It is also called punctuation, and it is the set of signs that split writing into sentences, clauses,
  and phrases.
examples:
- A comma is a punctuation mark that splits one part of a sentence from the next.
- A punctuation mark at the end of the line showed the sentence was done.
