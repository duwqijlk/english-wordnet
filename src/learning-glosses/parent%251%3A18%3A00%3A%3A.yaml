simpleMeaning: a mother or father, or anyone who gives a child life or brings it up, or a relative acting
  as guardian
scope: The mother or father of a child, not the child, and not a guardian who is unrelated to the family.
examples:
- Both parents came to the school meeting.
- She became a parent at thirty.
