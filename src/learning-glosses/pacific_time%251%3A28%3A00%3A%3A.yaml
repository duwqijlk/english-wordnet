simpleMeaning: The clock setting of the 8th zone west of Greenwich, set by the 120th line west, used in
  the far western states of the United States.
scope: Also called Pacific Standard Time and PST, it is the clock time of the 8th zone west of Greenwich,
  set at the 120th line west and used in the far western states of the United States.
examples:
- Pacific Time is used in California.
- The clock showed Pacific Time in the far west.
