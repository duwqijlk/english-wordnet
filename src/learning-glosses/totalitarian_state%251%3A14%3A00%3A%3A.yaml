simpleMeaning: a government that puts itself above each person and keeps strict control of every part
  of life by force
scope: This is a government that puts itself above each person and keeps strict control of every part
  of life by force; totalitarian regime is another name for this sense, and it is not a free government
  or just one strict law.
examples:
- Life in the totalitarian state was shaped by strict rules.
- The totalitarian state used force to keep control of the press.
