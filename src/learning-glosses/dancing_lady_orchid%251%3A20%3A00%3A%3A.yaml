simpleMeaning: Small yellow and brown flowers on thin branching stems mark any plant of the Oncidium group,
  and people often keep it in the house
scope: Also called a butterfly orchid, a butterfly plant, or oncidium; not a rose or a lily grown outdoors.
examples:
- The dancing lady orchid on the sill was covered in small yellow flowers.
- She waters her dancing lady orchid once a week and keeps it by a bright window.
