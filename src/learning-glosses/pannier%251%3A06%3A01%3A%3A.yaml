simpleMeaning: a large basket, usually one of a pair, carried by a person or by an animal used for carrying
  loads
scope: A large basket for carrying things, usually one of a pair, not the small hoops that make clothes
  fuller over the hips and not the bags hung over the back wheel of a bicycle.
examples:
- The donkey carried a pannier on each side, filled with bread.
- He lifted a heavy pannier from the horse's back and set it down.
