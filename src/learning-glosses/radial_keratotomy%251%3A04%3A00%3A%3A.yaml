simpleMeaning: To mend short sight, cuts are made in lines running out from the middle of the clear front
  part of the eye, so it bulges.
scope: Unlike a way to mend long sight, this is cuts in the clear front part of the eye that mend short
  sight.
examples:
- After radial keratotomy, the eye could see far things clearly.
- Doctors used radial keratotomy to mend short sight.
