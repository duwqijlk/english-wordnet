simpleMeaning: tending to settle a clash and bring people together so they agree and work well side by
  side
scope: Also called reconciling; tending to settle a clash and bring people together, not forcing one side
  to give in and not leaving them apart.
examples:
- Her accommodative tone helped the two sides reach a deal.
- He took an accommodative approach and found a middle way.
