simpleMeaning: A part that holds a set charge, made of two charged plates kept apart by a liquid that
  carries power.
scope: 'Also called electrolytic capacitor and electrolytic condenser: a part that holds a set charge,
  made of two charged plates kept apart by a liquid, not a wire and not a switch.'
examples:
- An electrolytic stores charge in the circuit.
- The electrolytic failed and the radio went dead.
