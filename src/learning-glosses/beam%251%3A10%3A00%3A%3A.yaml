simpleMeaning: a signal sent along a narrow path that helps airplane pilots find their way in darkness
  or bad weather
scope: This is a guiding signal for pilots, not a long piece of wood used in building, not lines of light,
  and not a wide happy smile.
examples:
- The pilot followed the beam in the dark.
- A beam guided the plane through bad weather.
