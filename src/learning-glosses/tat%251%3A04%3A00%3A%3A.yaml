simpleMeaning: A test in which a person tells a tale about each black-and-white picture, showing what
  they think and feel.
scope: Also called the Thematic Apperception Test; not a test of school learning.
examples:
- The TAT asks people to tell stories about pictures.
- In the TAT, she told a tale about each picture.
