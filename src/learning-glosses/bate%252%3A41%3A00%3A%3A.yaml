simpleMeaning: to hold back or control something, and make its force less strong
scope: To hold something back and make it weaker, not the falcon sense of beating the wings wildly and
  not soaking something in a special liquid to soften it.
examples:
- We waited with bated breath for the news.
- She bated her anger and answered in a calm voice.
