senseId: pushy%5:00:00:ambitious:00
synsetId: 00105117-s
simpleMeaning: wanting to succeed in a strong, forceful way, full of energy, and quick to start things
  without being told
scope: Strong and forceful in wanting to succeed and in starting things, not just keen or hard-working
  in a calm way.
examples:
- The pushy insurance agent worked long hours and chased every new chance to sell.
- She is pushy about her career and is always first to offer a new plan.
