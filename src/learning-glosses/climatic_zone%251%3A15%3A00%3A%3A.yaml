simpleMeaning: one of the broad bands around the earth, roughly marked out by the weather and how far
  north or south they lie
scope: One of the broad bands around the earth, roughly marked out by the weather and how far north or
  south they lie; not a time zone and not a band marked out by its plants.
examples:
- The desert lies in a hot climatic zone.
- Each climatic zone has its own kind of weather.
