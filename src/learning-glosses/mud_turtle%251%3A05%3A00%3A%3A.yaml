simpleMeaning: A turtle of North and Central America that lives on the bottom of fresh-water rivers with
  soft wet earth.
scope: Unlike other river turtles, this one dwells at the bottom of muddy fresh-water rivers in North
  and Central America.
examples:
- The mud turtle rested on the bottom of the river.
- A mud turtle lives in the fresh-water rivers of North America.
