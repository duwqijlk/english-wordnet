simpleMeaning: Above all, a mushroom cap, a fern frond, or the part of a flower that makes seeds stands
  on this stalk, which holds it up.
scope: This is the stalk that holds up a mushroom cap, a fern frond, or the part of a flower that makes
  seeds.
examples:
- The mushroom cap sits on a stipe that holds it up.
- A stipe holds up the pistil in the middle of a flower.
