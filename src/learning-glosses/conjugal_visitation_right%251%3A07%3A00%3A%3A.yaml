simpleMeaning: in a prison, permission given by law for a prisoner and their husband or wife to have sex
  together
scope: This is permission in prison for a prisoner and their husband or wife to have sex together, also
  called conjugal visitation, and not an ordinary visit from family or friends.
examples:
- The new law gave prisoners a conjugal visitation right.
- She hoped the conjugal visitation right would let them meet in private.
