simpleMeaning: A common smut that strikes Indian corn, making pale swellings that burst open to show a
  black mass of spores.
scope: A common smut of Indian corn, making pale swellings that burst to show black spores, close to other
  smuts of corn; also called boil smut.
examples:
- Ustilago maydis swelled the corn ears with grey lumps.
- The farmer cut out Ustilago maydis before it spread.
