simpleMeaning: Treating things with no life as if they had human feelings is a mistake in thinking, as
  in calling the sun friendly.
scope: This names the mistake of giving human feelings to things with no life, as in calling the sun friendly,
  and not a true account of what such things feel.
examples:
- The friendly sun is an example of the pathetic fallacy.
- Saying the wind was angry was a pathetic fallacy.
