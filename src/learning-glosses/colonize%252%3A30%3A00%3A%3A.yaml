simpleMeaning: to go and live in a new place, or to set up such a new place for people to live in
scope: This is to settle in a place as colonists or start a colony there, not the sense where a country
  in the developing world is itself settled as a colony.
examples:
- The British colonized the East Coast long ago.
- They came to colonize the new land and build towns there.
