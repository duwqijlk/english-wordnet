simpleMeaning: You keep doing things that pull every eye to you, above all by putting yourself on show
  in public or by acting far too big
scope: Said of a person who keeps drawing eyes to themself, especially by putting themself on show in
  public, not a person who likes praise in a calm way and not a person who shows off once.
examples:
- His exhibitionistic act on the street drew a crowd within minutes.
- She knew the exhibitionistic display would shock the guests, and she did it anyway.
