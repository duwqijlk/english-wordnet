simpleMeaning: As when squire stands for esquire, the first vowel or bit of a word, usually one said without
  stress, is slowly lost
scope: This slow loss takes the first vowel or bit of a word, not a sound at the end.
examples:
- Aphesis turned esquire into squire by dropping the first vowel.
- Esquire lost its first vowel by aphesis.
