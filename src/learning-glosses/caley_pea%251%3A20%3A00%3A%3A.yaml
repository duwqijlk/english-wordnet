simpleMeaning: A weak-stemmed plant that lives one winter, first from the Mediterranean lands and long
  grown in the southern United States, planted to cover ground and feed farm animals.
scope: This is a weak-stemmed winter plant from the Mediterranean lands, long grown in the southern United
  States as a cover and feed crop; rough pea, singletary pea, wild winterpea and Lathyrus hirsutus are
  other names for it, not other winter plants grown only for food.
examples:
- Caley pea covered the bare field through the winter.
- The farmer sowed Caley pea to feed his sheep.
