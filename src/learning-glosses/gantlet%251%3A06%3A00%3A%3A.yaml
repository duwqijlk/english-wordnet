simpleMeaning: where two train tracks meet in a narrow spot; the inner rails cross and run side by side,
  then move apart, so each train stays on its own track
scope: Two train tracks that join and part in a narrow place, not a crossing where trains switch tracks
  and not the punishment of running between two lines of men.
examples:
- The train slowed as it passed through the gantlet in the narrow cutting.
- At the gantlet the inner rails crossed and ran side by side for a short way.
