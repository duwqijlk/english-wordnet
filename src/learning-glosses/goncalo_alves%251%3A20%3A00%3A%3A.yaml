simpleMeaning: A tall tropical American timber tree, especially in eastern Brazil, with hard, strong,
  durable wood striped dark on a pale pink or yellow ground, used for veneer, furniture and construction.
scope: This sense is the living timber tree from eastern Brazil, not the cut zebrawood it yields or other
  striped tropical woods sold under that name.
examples:
- A goncalo alves tree can grow very tall in the Brazilian rainforest.
- The table was made from goncalo alves because the wood is strong and hard-wearing.
