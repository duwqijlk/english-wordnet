simpleMeaning: a wheeled vehicle that brings news and gifts from shops near by to people who have just
  moved into a place
scope: A vehicle that brings news and gifts from nearby shops to new people in a place, not a truck that
  moves their goods and not a visit from neighbours.
examples:
- The welcome wagon stopped at our new house with a basket of gifts from local shops.
- A welcome wagon brought us maps and coupons when we moved into the neighbourhood.
