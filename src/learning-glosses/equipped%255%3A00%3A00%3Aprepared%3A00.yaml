simpleMeaning: having the right tools and things needed to do a job
scope: Having the right tools and things to do a job, not the wider sense of being provided with whatever
  is needed for a purpose.
examples:
- The team was equipped with ropes, tents, and warm clothes.
- The lab is equipped for work in the Arctic.
