simpleMeaning: A pretty coat of unlike stuff put on a face as a set-in or laid-on pattern.
scope: A pretty coat of unlike stuff set into a face, also called incrustation; not paint and not plain
  stone.
examples:
- The encrustation on the box was made of shell and dark wood.
- Encrustation gave the marble table a bright pattern.
