simpleMeaning: What holds salts of minerals, such as the salts of calcium and magnesium, and keeps soap
  from making much foam.
scope: This kind holds mineral salts and keeps soap from making much foam, unlike the kind that lathers
  well.
examples:
- Soap gave little foam in hard water.
- Hard water kept the soap from making much foam.
