simpleMeaning: a person trained in medicine or in care of the mind (psychology) who treats people directly,
  not by doing experiments in a laboratory
scope: This is a person trained to treat people, in medicine or in care of the mind. It is not a person
  who only does tests and experiments in a laboratory.
examples:
- The clinician spoke to each patient and checked how the treatment was working.
- Our clinic has a clinician who helps people with problems of the mind.
