simpleMeaning: An orchid of a group with narrow leaves and a long, drooping spray of many showy, boat-shaped
  flowers in various colors, widely bred as a houseplant and for florists.
scope: This is the orchid grown for its drooping sprays of showy flowers, the same plant also called cymbidium;
  not other orchids such as the moth orchid.
examples:
- The cymbid in the window sent up a long spray of pink flowers.
- She crossed two cymbids to breed a stronger yellow.
