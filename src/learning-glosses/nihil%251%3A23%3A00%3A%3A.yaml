simpleMeaning: A Latin word for nothing, used by a sheriff who has tried and failed to hand a court order
  to someone.
scope: A Latin word for nothing, used by a sheriff who has tried and failed to hand a court order to someone,
  not the plain English word nothing and not a court order itself.
examples:
- The sheriff wrote nihil when he could not serve the writ.
- '''Nihil habet,'' the sheriff said, finding no one to serve.'
