simpleMeaning: A set of parts made to pass on movement for one special job, such as the parts that let
  you steer a car.
scope: This is a set of parts made to pass on movement for one special job; gear is another name for this
  sense, not a motor that makes movement and not a brake that stops it.
examples:
- The gear mechanism passed the turn of the wheel to the front wheels.
- The gear mechanism in the clock moved the hands.
