simpleMeaning: One single print, made by pressing paper onto a glass or metal plate that has been painted
  or inked
scope: One single print made by pressing paper onto a painted or inked plate, not one of many prints from
  a block and not a drawing.
examples:
- She made a monotype by pressing paper onto the painted glass.
- The monotype was the only print from that plate.
