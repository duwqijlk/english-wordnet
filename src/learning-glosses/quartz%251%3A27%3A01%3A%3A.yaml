simpleMeaning: clear glass with no colour, made almost all from silica (a hard white stuff found in sand)
scope: 'Also called crystal: this is glass with no colour, not the hard natural stone of the same name
  found in the ground.'
examples:
- The clear quartz glass did not break when it got very hot.
- They made the lab window from quartz because it stays clear and strong.
