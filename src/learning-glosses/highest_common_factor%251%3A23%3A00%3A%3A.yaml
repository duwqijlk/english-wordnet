simpleMeaning: 'Take a group of whole numbers: the biggest whole number that goes into every one of them
  with nothing left over'
scope: Also called greatest common divisor and greatest common factor, it is the biggest whole number
  that divides a set of whole numbers with nothing left over, not the smallest number they all go into
  and not the largest number in the set.
examples:
- The highest common factor of 12 and 18 is 6.
- To find the highest common factor, she listed the numbers that divide into both 24 and 36.
