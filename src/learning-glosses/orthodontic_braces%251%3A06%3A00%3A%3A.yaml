simpleMeaning: A thing used on the teeth to put teeth that are out of line back in line
scope: A thing used on the teeth to put teeth that are out of line back in line, also called brace and
  braces; not a tooth pulled out and not a false tooth.
examples:
- She got orthodontic braces to straighten her front teeth.
- The orthodontic braces slowly moved his teeth into line.
