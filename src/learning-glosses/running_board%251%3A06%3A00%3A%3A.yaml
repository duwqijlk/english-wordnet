simpleMeaning: a thin flat step below the doors of some old cars, for getting in and out
scope: A thin step below the doors of some old cars, not a step inside the car and not a step at the back
  of a car.
examples:
- She put one foot on the running board and climbed into the old car.
- The running board was dusty under the doors of the old car.
