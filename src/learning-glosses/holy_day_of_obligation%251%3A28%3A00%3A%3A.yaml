simpleMeaning: Catholics must go to Mass and do no manual work on this date, while Episcopalians must
  take Communion
scope: Catholics must go to Mass and do no manual work on this date, while Episcopalians must take Communion,
  not a Sunday and not a public holiday.
examples:
- Christmas is a holy day of obligation for Catholics.
- On a holy day of obligation, she went to Mass in the morning.
