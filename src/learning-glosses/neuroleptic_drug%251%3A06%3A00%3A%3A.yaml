simpleMeaning: a calming medicine used to treat psychotic conditions, when a calming effect is wanted
scope: A calming medicine for psychotic conditions, used when calm is wanted; antipsychotic, antipsychotic
  agent, antipsychotic drug, major tranquilizer, neuroleptic and neuroleptic agent are other names for
  it, not a sleeping drug and not a drug for worry alone.
examples:
- This neuroleptic drug helps people whose minds are very unwell stay calm.
- The nurse gave her a neuroleptic drug to quiet the fear in her mind.
