simpleMeaning: This medicine is given to calm a person whose mind is very unwell, when calm is what is
  wanted
scope: This medicine brings calm to a person whose mind is very unwell when calm is wanted; antipsychotic,
  antipsychotic agent, antipsychotic drug, major tranquilizer, neuroleptic and neuroleptic agent are other
  names for it, not a sleeping drug and not a drug for worry alone.
examples:
- This neuroleptic drug helps people whose minds are very unwell stay calm.
- The nurse gave her a neuroleptic drug to quiet the fear in her mind.
