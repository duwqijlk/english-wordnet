simpleMeaning: Held in some books to be no kin of the great pandas, this red-brown meat-eater of Asia
  looks much like a raccoon.
scope: Panda, bear cat, cat bear, and red panda are other names for a red-brown meat-eater of Asia that
  looks like a raccoon and is held by some to be no kin of the great pandas.
examples:
- The lesser panda in the picture looked much like a raccoon.
- The lesser panda was listed among the meat-eaters of Asia.
