simpleMeaning: a body part that sends out a fluid through a small tube to the outside of the body
scope: Also called a duct gland or exocrine, this is a body part that sends a fluid out through a tube,
  not one that sends a fluid into the blood.
examples:
- The sweat glands are exocrine glands that send sweat out through small tubes.
- An exocrine gland in the mouth sends saliva out through a duct.
