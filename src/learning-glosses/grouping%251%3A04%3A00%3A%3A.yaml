simpleMeaning: Bringing separate things together so that they form sets
scope: This is the act of putting things together in sets, not a system or set of rules for sorting things
  into kinds.
examples:
- The grouping of the books by size made the shelf look tidy.
- Her grouping of the children by age helped the games run well.
