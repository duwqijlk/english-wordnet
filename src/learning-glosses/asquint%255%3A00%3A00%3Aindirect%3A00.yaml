senseId: asquint%5:00:00:indirect:00
synsetId: 00766264-s
simpleMeaning: turned to one side as if with doubt, distrust, or envy, said most of all of looks
scope: 'Also called squint, sidelong, askance, squinty, or askant: a look turned to one side with doubt
  or distrust, not a straight look and not a look with closed eyes.'
examples:
- She gave him an asquint glance when he made his excuse.
- He looked asquint at the stranger, unsure whether to trust him.
