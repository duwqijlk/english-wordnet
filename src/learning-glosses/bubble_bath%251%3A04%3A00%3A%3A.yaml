simpleMeaning: a wash in a tub of water with something put in to make foam and a nice smell
scope: A wash in a tub of water made foamy and sweet-smelling by something put in, not a plain wash and
  not the powder or liquid that makes the foam.
examples:
- She took a long bubble bath after work.
- He relaxed in a warm bubble bath after a long day.
