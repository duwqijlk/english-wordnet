simpleMeaning: In physics, any of several kinds of machines that keep and control a nuclear reaction (atoms
  splitting to free energy) to make power or man-made elements
scope: 'Also called nuclear reactor: in physics, a machine that controls a nuclear reaction to make power
  or man-made elements, not an electrical device put into a circuit.'
examples:
- The reactor makes power for the whole city.
- Workers shut down the reactor to check it for damage.
