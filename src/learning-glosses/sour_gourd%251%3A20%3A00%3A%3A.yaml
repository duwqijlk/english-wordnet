simpleMeaning: An Australian tree whose fruit tastes pleasantly sharp and has the shape of a big round
  fruit with a hard skin
scope: This is the tree, not the fruit itself; cream-of-tartar tree is another name for it, and it is
  not the fruit sense with a woody rind and large seeds.
examples:
- The sour gourd in the garden bears fruit that tastes sharp and pleasant.
- We planted a sour gourd because its fruit looks like a big round gourd.
