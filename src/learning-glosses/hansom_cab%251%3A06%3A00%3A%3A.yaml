simpleMeaning: A covered carriage with two wheels, pulled by a horse, with the driver's seat high up behind
  the riders
scope: A covered carriage with two wheels, pulled by a horse, with the driver's seat high up behind the
  riders, not a four-wheeled carriage and not a motor taxi; hansom is another name for this sense.
examples:
- They rode across town in a hansom cab.
- The hansom cab driver sat high above his passengers.
