simpleMeaning: A fan palm of Brazil with a root that can be eaten, the source of a useful fibre from its
  leaves and a hard, yellowish wax that breaks easily
scope: Carnauba, carnauba palm, wax palm and Copernicia cerifera are other names for this Brazilian fan
  palm, whose edible root, useful leaf fibre and hard yellowish wax set it apart from other fan palms
  and other wax-yielding palms.
examples:
- Copernicia prunifera grows in the dry lands of Brazil.
- Workers take wax from Copernicia prunifera leaves.
