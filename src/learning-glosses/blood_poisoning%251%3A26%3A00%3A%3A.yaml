senseId: 'blood_poisoning%1:26:00::'
synsetId: 14213319-n
simpleMeaning: An illness in which strong germs from one sore place spread through the whole body in its
  flow of red fluid.
scope: An illness in which strong germs from one sore place spread through the whole body; septicaemia
  and septicemia are other names for this sense, not food poisoning and not a wound that stays in one
  place.
examples:
- Blood poisoning set in after the cut went bad.
- He was in hospital with blood poisoning.
