simpleMeaning: to change where you live, the group or organization you belong to, or the place where you
  work.
scope: This is not about shifting an object from one spot to another, not about stirring feelings, and
  not about proposing something at a meeting; it is a change of home, group, or workplace.
examples:
- They moved to a smaller apartment after the children left home.
- She moved from a law firm to a job in local government.
