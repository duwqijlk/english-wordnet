simpleMeaning: Radio waves or tools inside it that find the mark steer this weapon while it flies, after
  a rocket has sent it up.
scope: This weapon flies after a rocket sends it up, steered by radio waves or by tools inside it that
  find the mark.
examples:
- The guided missile changed course in mid-air as new radio signals reached it.
- Engineers tested the guided missile to see if its homing tools could find the mark.
