simpleMeaning: of people who are not Jewish, or typical of such people
scope: This describes people who are not Jewish, or things that belong to or are typical of them; not
  the noun for a person, such as a Christian compared with a Jew, and not the noun for a person who is
  not a member of your own religion, as Mormons and Hindus use the word.
examples:
- She grew up in a gentile family in a mostly Jewish town.
- The book describes gentile customs in the villages near the city.
