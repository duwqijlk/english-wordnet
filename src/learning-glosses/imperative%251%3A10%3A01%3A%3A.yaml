simpleMeaning: In grammar, a verb form used to give an order or tell someone to do something
scope: This is the verb form itself, not the mood it belongs to and not a word that describes such verbs.
examples:
- '''Sit down'' is an imperative in English.'
- The imperative 'go' tells the listener to move.
