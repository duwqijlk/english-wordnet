senseId: 'fight%2:41:10::'
synsetId: 02595732-v
simpleMeaning: work hard and persistently, sometimes in an attention-seeking way, for a goal, cause, or
  person, and speak up in support of them.
scope: This is not trading blows with someone; it is sustained effort or public support for a cause or
  person.
examples:
- She has fought for years to keep the local library open.
- The group fights tirelessly for the rights of migrant workers.
