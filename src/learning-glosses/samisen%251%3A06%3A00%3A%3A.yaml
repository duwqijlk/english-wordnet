simpleMeaning: A Japanese stringed instrument like a banjo, with a long neck, three strings, a fingerboard
  without frets and a rectangular body; it is played with a pick.
scope: Shamisen is another name for this same instrument; it is not a guitar or a koto.
examples:
- She plucked the three strings of the samisen with a pick.
- A samisen has a long neck, three strings and a rectangular body.
