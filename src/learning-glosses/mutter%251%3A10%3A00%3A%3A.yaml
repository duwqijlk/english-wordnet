senseId: 'mutter%1:10:00::'
synsetId: 07225752-n
simpleMeaning: an unhappy remark spoken so quietly and unclearly that it is hard to make out
scope: A quiet, unclear complaint, not the low ongoing sound of someone moving their lips without clear
  words, and not the act of making such complaints.
examples:
- His only reply was an angry mutter.
- She turned away with a mutter about the unfair decision.
