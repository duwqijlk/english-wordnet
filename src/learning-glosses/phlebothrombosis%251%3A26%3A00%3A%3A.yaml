simpleMeaning: A blood clot in a vein with no earlier vein inflammation, tied to slow blood flow, as in
  long bed rest, pregnancy or surgery, or to swift blood clotting.
scope: This sense is also called venous thrombosis, for a blood clot in a vein with no earlier vein inflammation,
  tied to slow blood flow, as in long bed rest, pregnancy or surgery, or to swift blood clotting.
examples:
- Phlebothrombosis clots a vein.
- Phlebothrombosis follows long bed rest.
