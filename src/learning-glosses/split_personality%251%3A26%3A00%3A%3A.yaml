simpleMeaning: In one person, the mind breaks apart in a relatively rare way, so two or more separate
  selves come out and act on their own.
scope: A rare state in which one person holds two or more separate selves; multiple personality is another
  name for this sense.
examples:
- The doctor said the split personality meant two selves seemed to live in one person.
- A split personality is rare, and two or more selves seem to take turns in one person.
