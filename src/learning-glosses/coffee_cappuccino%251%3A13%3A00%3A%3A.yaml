simpleMeaning: Hot milk and strong dark brew, half and half, go into this drink, with cinnamon and nutmeg
  on top and usually whipped cream.
scope: Also called cappuccino and cappuccino coffee, it is a hot drink of equal parts strong dark brew
  and hot milk, usually topped with whipped cream.
examples:
- She ordered a coffee cappuccino with cinnamon on top.
- A coffee cappuccino is topped with whipped cream.
