simpleMeaning: A deciduous oak of the eastern United States and southeastern Canada, medium-to-large,
  with dark outer bark, yellow inner bark used for tanning, and broad leaves with five bristle-tipped
  lobes.
scope: This is another name for the black oak tree, not a separate species, and not the yellow dye obtained
  from its bark.
examples:
- Yellow oak is common on dry slopes in the East.
- We measured a yellow oak that was over a hundred feet tall.
