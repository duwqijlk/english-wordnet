simpleMeaning: a round cutting blade set under a flat top or a work bench, with the edge sticking up through
  a narrow cut
scope: This is a round cutting blade set under a flat top or a bench; not a hand tool for cutting wood
  and not a blade that hangs down from above.
examples:
- He cut the board on the table saw.
- The table saw stood in the corner of the workshop.
