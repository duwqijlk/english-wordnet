senseId: 'cursive%1:10:00::'
synsetId: 06361681-n
simpleMeaning: Fast writing done by hand, with each letter of a word written out in full and joined to
  the next, without lifting the writing tool from the page
scope: Handwriting in joined-up letters; not printed letters and not writing in separate block capitals.
examples:
- Her cursive was hard to read because she wrote so fast.
- The teacher asked the class to practise cursive instead of printing.
