senseId: transmissible%5:00:02:inheritable:00
synsetId: 01317151-s
simpleMeaning: Handed down through a family by set rules, usually under the law.
scope: Also called ancestral or hereditary, this is said of a thing handed down through a family by set
  rules, usually under the law, not of a sickness that can spread to others through infection.
examples:
- The old house is transmissible to the eldest child under the law.
- The title is transmissible through the family line.
