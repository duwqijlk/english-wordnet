synsetId: 04107714-n
simpleMeaning: An image made by passing a kind of invisible light through the body onto film, used by
  doctors to look inside the body.
scope: Also called a roentgenogram, an X-ray photograph, an X-ray picture or an X ray; an image made by
  passing invisible light through the body onto film, not the invisible light itself or a drawing of the
  body.
examples:
- The doctor looked at the X-ray of her ankle.
- An X-ray showed the broken bone.
