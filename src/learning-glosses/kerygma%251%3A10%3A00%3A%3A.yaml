simpleMeaning: The preaching of the good news about Christ in the manner of the early church.
scope: 'Also called kerugma: what the first church said when it told the good news about Christ, not a
  later sermon and not church law.'
examples:
- The kerygma spread from town to town in the first years of the church.
- Scholars study the kerygma to learn how the first Christians spoke of Christ.
