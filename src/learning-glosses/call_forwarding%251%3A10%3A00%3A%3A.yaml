simpleMeaning: a phone service that sends what comes in on your phone to another phone you can ring straight
scope: It is a phone service that moves what comes in on your phone to another phone, not a phone that
  rings in two places and not a way to put someone on hold.
examples:
- She set up call forwarding before her trip.
- With call forwarding, the office phone rings at home.
