simpleMeaning: the quality of acting like a pig, greedy for food and coarse and low in behaviour
scope: This is the quality of being pig-like and greedy, not the adjective swinish and not simple greed
  for money.
examples:
- His swinishness at meals shocked everyone at the table.
- She was tired of his swinishness, his coarse manners and his greed.
