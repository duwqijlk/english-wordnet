simpleMeaning: A group of ways of speaking in the Caucasus, not kin to ways of speaking elsewhere.
scope: Also called Caucasian; a group of ways of speaking of the Caucasus, not the name of a person and
  not the adjective sense.
examples:
- Caucasian language is a group of ways of speaking in the Caucasus.
- The Caucasian language group is not kin to ways of speaking elsewhere.
