simpleMeaning: a small shark-like fish with a plain skin, found in the sea near the coast of Europe
scope: A small shark-like fish of the sea near the coast of Europe, also called a smoothhound shark; not
  a big shark and not a fish of fresh water.
examples:
- The fishermen caught a smoothhound in the shallow water off the coast.
- A smoothhound swam along the sandy bottom near the shore.
