simpleMeaning: With long finger-like side fins for crawling along the bottom, these fish live on the sea
  floor near the shore, with spiny hard heads.
scope: A coastal fish that lives on the sea floor, not a fish of the open sea and not one that swims near
  the top.
examples:
- The gurnard crawled along the sea bottom on its finger-like fins.
- Fishermen caught a gurnard with a spiny armoured head in the shallow water.
