simpleMeaning: soft springy stuff put inside a thing to fill it out, give it shape, keep it safe, or make
  it more comfortable
scope: Soft material put in a thing to fill it out or protect it, not the thing it fills and not hard
  packing.
examples:
- The padding in the jacket kept her warm.
- He added padding to the chair to make it soft to sit on.
