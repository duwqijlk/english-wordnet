simpleMeaning: Usually served with caviar and sour cream, this flat round cake from Russia is made of
  buckwheat flour and yeast.
scope: Also called blini, this Russian cake is made of buckwheat flour and yeast, not of plain wheat flour.
examples:
- We ate bliny with caviar and sour cream.
- The bliny were made of buckwheat flour and yeast.
