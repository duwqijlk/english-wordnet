simpleMeaning: An official who can give out a license or give formal permission, above all one who gives
  permission for books and other printed work
scope: An official who can give out a license or give formal permission; not the person who applies for
  the license, and not a judge who settles disputes about it.
examples:
- The licenser approved the new magazine.
- She applied to the licenser for permission to print.
