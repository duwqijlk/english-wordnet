simpleMeaning: fine parchment (a smooth material made for writing) made from the skin of a young animal,
  such as a calf or lamb
scope: This is the real material made from animal skin; it is not the heavy pale paper made to look like
  it, which is another sense of the same word.
examples:
- The old letter was written on vellum made from calf skin.
- She touched the smooth vellum of the old book.
