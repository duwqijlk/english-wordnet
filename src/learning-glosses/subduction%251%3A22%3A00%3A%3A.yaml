simpleMeaning: Where two plates of rock meet, one edge is forced sideways and down, sliding under its
  neighbour and into the hot rock below.
scope: In geology, this names the sideways-and-down slide of one plate edge under another, deep underground.
examples:
- One plate edge sinks in subduction, sliding under another plate.
- In subduction, one plate edge is pushed down under another.
