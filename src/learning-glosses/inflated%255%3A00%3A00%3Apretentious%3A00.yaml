simpleMeaning: trying to seem more grand or important than it really is, especially in words or in ideas
  about how things should be
scope: About words or ideas that try to seem grand and important, not about a thing filled with air and
  not about prices that are too high.
examples:
- His inflated language made a simple idea sound grand and hard to follow.
- She gave an inflated talk about her ideas for a better world.
