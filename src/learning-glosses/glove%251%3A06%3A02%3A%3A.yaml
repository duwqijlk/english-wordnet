simpleMeaning: a big covering with soft thick material inside, worn on a fighter's hand for boxing
scope: This is the thick hand covering worn for boxing. It is not an everyday covering for the hand and
  wrist, and not the hand covering used by fielders in baseball.
examples:
- The boxer put on his gloves before the fight began.
- Her glove split during the boxing match, so the fight had to stop.
