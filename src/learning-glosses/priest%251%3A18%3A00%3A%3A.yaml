simpleMeaning: a Christian church leader with the power to lead holy acts of worship, one of the holy
  ranks of the church
scope: A Christian church leader with the power to lead holy acts, not a leader in a faith that is not
  Christian and not an ordinary church member.
examples:
- The priest led the service on Sunday morning.
- She asked the priest to bless the new church hall.
