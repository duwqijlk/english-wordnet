simpleMeaning: the number shown as a one with 24 zeros after it, in the UK
scope: The UK name for a one followed by 24 zeros, not a smaller large number such as a million or a billion.
examples:
- A quadrillion is a one followed by 24 zeros in the UK system.
- The book listed one quadrillion as the largest number in its table.
