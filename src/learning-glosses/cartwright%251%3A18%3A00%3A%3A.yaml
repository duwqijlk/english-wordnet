simpleMeaning: a worker who makes and mends wheeled vehicles for carrying loads
scope: A worker who builds and mends wheeled vehicles, not a carpenter who builds houses and not a blacksmith
  who makes tools from metal.
examples:
- The cartwright mended the broken wheel of the farmer's wagon.
- A skilled cartwright built the new wagon in his workshop.
