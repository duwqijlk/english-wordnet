simpleMeaning: the strength of a wave that travels without wires as picked up by a device that finds such
  waves in the sky
scope: How strong such a wave is when picked up, not how bright a light looks and not the power of a sender.
examples:
- The radio brightness of the star was measured by the dish.
- Astronomers compared the radio brightness of two galaxies.
