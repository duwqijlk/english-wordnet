simpleMeaning: In warm seas lives a thin fish whose long nose is shaped like a tube, and whose body is
  covered with hard plates, not scales.
scope: This fish from warm seas has a tube-shaped nose and hard plates instead of scales, so it is not
  a fish with true scales.
examples:
- The cornetfish drifted in the warm water, its long snout pointing ahead.
- We saw a cornetfish with hard plates along its thin body.
