simpleMeaning: A large net of nerves of the system that runs the body without thought, lying in the belly
  behind the stomach
scope: A large net of nerves of the system that runs the body without thought, lying in the belly behind
  the stomach; also called abdominal nerve plexus and coeliac plexus; not a net of nerves in the chest.
examples:
- The plexus celiacus sends signals to the gut.
- Pain from the plexus celiacus can spread through the belly.
