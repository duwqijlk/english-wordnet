simpleMeaning: A look on the face where the ends of the mouth turn up, usually to show joy or fun
scope: Also called smile, smiling, and grin, this is a happy look on the face, not a frown or a look of
  anger.
examples:
- She was grinning when she told us the good news.
- His grinning face showed how happy he was.
