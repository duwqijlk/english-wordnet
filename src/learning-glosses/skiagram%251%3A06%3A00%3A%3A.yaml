simpleMeaning: by rays other than light we can see, above all by X-rays or gamma rays, a picture is made
  on a surface that reacts to rays
scope: It is also called a skiagraph, a radiogram, a radiograph, or a shadowgraph, a picture made by rays
  other than light we can see, not a picture made with a camera and ordinary light.
examples:
- A skiagram was made with X-rays.
- We looked at the skiagram made by the rays.
