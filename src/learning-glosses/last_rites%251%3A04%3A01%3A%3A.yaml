simpleMeaning: A Catholic sacrament in which a priest anoints a dying person with oil and prays for their
  salvation.
scope: Also called anointing of the sick and extreme unction, this holy act is for a person who is dying,
  not for one who is already dead.
examples:
- The priest gave the last rites to the dying person.
- The dying person received the last rites from the priest.
