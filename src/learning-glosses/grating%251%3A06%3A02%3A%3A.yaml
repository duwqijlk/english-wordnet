simpleMeaning: a tool for light with a face cut with many straight lines side by side, spreading a ray
  of light, or other rays, into the colours that make it up
scope: A tool that spreads light into the colours that make it up, not a set of bars that blocks a way
  in while letting air through.
examples:
- The grating in the lab split the white light into a rainbow band.
- A grating on the bench spread the lamp's beam into its separate colours.
