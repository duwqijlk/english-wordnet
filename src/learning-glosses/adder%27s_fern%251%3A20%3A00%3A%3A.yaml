simpleMeaning: A fern that grows in mats on rock or ground, with creeping roots and large divided fronds,
  found across North America, Europe, Africa and east Asia.
scope: Another name for the mat-forming fern also called common polypody and golden maidenhair, not the
  tropical golden polypody.
examples:
- Adder's fern spread across the shaded rocks beside the stream.
- The gardener cleared a patch of adder's fern from the woodland floor.
