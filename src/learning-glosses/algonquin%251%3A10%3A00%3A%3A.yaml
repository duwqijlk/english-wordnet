simpleMeaning: A group of the tongues of the first peoples of North America, spoken from Labrador to South
  Carolina and west to the Great Plains
scope: This is a group of the tongues of the first peoples of North America, also called Algonquian and
  Algonquian language; not one of the peoples themselves, and not a single tongue of the group.
examples:
- Algonquin tongues were spoken from Labrador to the Great Plains.
- Scholars group many tongues of North America under Algonquin, from Labrador to the Great Plains.
