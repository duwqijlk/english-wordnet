scope: Porcupines is another name for these meat rounds, which are rolled in rice and cooked slowly in
  tomato sauce rather than made from the animal they are named for.
examples:
- The porcupine balls simmered in tomato sauce.
- The porcupine balls tasted of tomato sauce.
