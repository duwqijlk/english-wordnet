simpleMeaning: from the seeds of the plant Pimpinella anisum comes this essential oil, sharp-smelling
  and like liquorice
scope: 'Also called anise oil and oil of anise: an oil taken from aniseed, with a sharp smell like liquorice,
  not a cooking oil.'
examples:
- Aniseed oil is pressed from the seeds of the anise plant.
- She put a drop of aniseed oil in the mixture for its liquorice smell.
