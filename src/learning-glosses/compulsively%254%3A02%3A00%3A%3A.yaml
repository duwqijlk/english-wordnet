simpleMeaning: in a way that shows a strong need to keep doing something, even when you try to stop
scope: This is about a strong inner need to keep doing something, not about being forced by a rule and
  not just about doing it often.
examples:
- He washed his hands compulsively, again and again all day.
- She checked the lock compulsively before leaving the house.
