simpleMeaning: A fighting man from one of the native peoples of North America.
scope: This is a dated, historical word for one warrior of a native North American people; the older term
  Indian for Native Americans is now avoided, and it is not brave people as a group or the quality of
  facing danger without fear.
examples:
- The novel follows a young brave who leaves his village to fight.
- A brave from the camp brought news of the approaching soldiers.
