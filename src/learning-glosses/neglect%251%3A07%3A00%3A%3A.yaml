simpleMeaning: a way of being in which a person does not do what they should do and does not care about
  it
scope: 'This is a person''s character: they fail to do their duties and show little care. It is not one
  careless act, and not the state of a thing left unused.'
examples:
- Neglect was part of his character; he never did what he should and never seemed to care.
- She was known for neglect at work, always leaving jobs undone and not caring who was hurt.
