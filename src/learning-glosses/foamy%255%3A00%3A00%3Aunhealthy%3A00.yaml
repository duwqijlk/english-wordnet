simpleMeaning: giving off or covered with thick, soapy sweat or spit because of great tiredness or sickness
scope: Giving off or covered with thick, soapy sweat or spit because of great tiredness or sickness, also
  called foaming; not the pleasant bubbles in a drink.
examples:
- The sick horse stood foamy at the mouth.
- After the long race, the dog's foamy muzzle showed how tired it was.
