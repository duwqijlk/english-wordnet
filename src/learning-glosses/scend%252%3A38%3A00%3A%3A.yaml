simpleMeaning: to rise or lift upward, pushed by a natural force such as a wave
scope: 'Also called surge: to rise upward pushed by a wave or other natural force, not to rise by your
  own power or by a machine.'
examples:
- The boat scended on the big wave.
- The small ship scended as the sea grew rough.
