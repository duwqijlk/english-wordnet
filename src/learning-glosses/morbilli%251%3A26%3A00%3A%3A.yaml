simpleMeaning: A sudden illness caused by a virus that spreads very fast from person to person, starting
  with clear red spots and then a rash, and it strikes children above all.
scope: Also called measles and rubeola, this is a sudden illness of children marked by red spots and a
  rash.
examples:
- The child caught morbilli and broke out in red spots.
- Morbilli spreads fast among children who have not had the illness.
