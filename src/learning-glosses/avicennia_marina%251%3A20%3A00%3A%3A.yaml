simpleMeaning: A mangrove tree of the West Indies and the southern Florida coast, growing in thick groups
  with many short roots that bend up out of the ground.
scope: A mangrove tree of the West Indies and Florida, also called black mangrove; set apart from other
  mangrove trees and from other trees of the same coasts.
examples:
- Avicennia marina grows in thick groups along the Florida coast.
- The short roots of Avicennia marina bend up out of the wet ground.
