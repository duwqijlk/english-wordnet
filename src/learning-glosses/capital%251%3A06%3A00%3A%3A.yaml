simpleMeaning: The top section of a pillar, which carries the horizontal structure resting above it.
scope: This is the top of a pillar, not a city, money, or a large letter.
examples:
- The column's capital was carved with acanthus leaves.
- A plain stone capital sat between the shaft and the roof beam.
