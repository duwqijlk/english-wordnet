simpleMeaning: A glow that comes from a burst of electric power, when the air around it takes on a charge
scope: Corona, corona discharge, corposant, electric glow, Saint Elmo's light, Saint Ulmo's fire, Saint
  Ulmo's light and St. Elmo's fire are other names for this sense; it differs from lightning and from
  ordinary fire.
examples:
- Saint Elmo's fire glowed blue at the top of the mast during the storm.
- The sailors saw Saint Elmo's fire and knew the air around them was charged.
