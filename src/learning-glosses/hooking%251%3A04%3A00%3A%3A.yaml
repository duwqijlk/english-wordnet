simpleMeaning: In golf, a shot that bends to the left for a player who hits with the right hand
scope: In golf, a shot that bends to the left for a right-handed player; draw and hook are other names
  for this sense, not a shot that bends to the right and not the act of catching fish.
examples:
- His hooking sent the ball into the trees on the left.
- Hooking is a common fault for right-handed golfers.
