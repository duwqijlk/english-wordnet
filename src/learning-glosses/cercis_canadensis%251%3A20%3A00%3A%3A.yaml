simpleMeaning: A small shrubby tree of eastern North America, like the Judas tree, with pink flowers most
  of the time, found in damp sheltered woods.
scope: Also called redbud, this small shrubby tree of eastern North America is like the Judas tree but
  is known by pink flowers most of the time and by growing in damp sheltered woods, which sets it apart
  from other small trees that do not flower pink in damp sheltered woods.
examples:
- Cercis canadensis grows in damp sheltered woods in eastern North America.
- The Cercis canadensis has pink flowers most of the time.
