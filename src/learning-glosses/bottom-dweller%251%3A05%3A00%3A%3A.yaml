simpleMeaning: a fish that lives and eats on the floor of a stretch of water
scope: A fish that lives and eats on the floor of a stretch of water; bottom-feeder is another name for
  this sense, not a fish that swims near the top and not one that only hides on the floor.
examples:
- The bottom-dweller feeds on scraps that sink to the riverbed.
- Catfish are bottom-dwellers that live in muddy water.
