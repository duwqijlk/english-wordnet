simpleMeaning: So obviously bad or wrong that it shocks people and deserves strong blame.
scope: Describes a fault or wrong that is glaringly obvious, not the act of shedding tears.
examples:
- It is a crying shame that the money was never used.
- The way those workers were treated was a crying injustice.
