simpleMeaning: the act of staying away from something on purpose, or of stopping something from happening
scope: 'Also called dodging and shunning: this sense is staying away from something on purpose or stopping
  it from happening, not a case of something just not happening by chance.'
examples:
- His avoidance of the hard topic made the meeting go badly.
- Careful planning led to the avoidance of long delays.
