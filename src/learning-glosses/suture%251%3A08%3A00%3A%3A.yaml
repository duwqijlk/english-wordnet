simpleMeaning: a joint that does not move, especially a joint between the bones of the head
scope: A fixed joint in the head, not the thread a doctor uses to close a cut and not the act of joining
  with that thread.
examples:
- The bones of a baby's head meet at a suture.
- Doctors studied the suture where the two head bones join.
