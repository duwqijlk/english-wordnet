simpleMeaning: Without it cells cannot grow and make new cells; it is one of the B vitamins
scope: 'Also called folacin, folate, pteroylglutamic acid and pteroylmonoglutamic acid: one of the B vitamins,
  needed for cells to grow and make new cells, not another B vitamin.'
examples:
- Folic acid helps the body make new cells.
- Her doctor told her to take folic acid during pregnancy.
