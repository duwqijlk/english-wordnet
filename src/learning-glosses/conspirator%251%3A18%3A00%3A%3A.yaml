simpleMeaning: a person who takes part in a secret plan with others to do something wrong or against the
  law
scope: A person in a secret group plan to do wrong, not a person who acts alone and not a person who only
  hears about the plan.
examples:
- The police arrested three conspirators who had planned to rob the bank.
- He was named as a conspirator in the secret plot against the king.
