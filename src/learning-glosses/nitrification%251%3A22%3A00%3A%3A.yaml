simpleMeaning: Soil germs turn the ammonium in dead matter from living things into nitrates and nitrites,
  so plants can take up the nitrogen
scope: Soil germs turn ammonium in dead matter into nitrates and nitrites, so plants can take up the nitrogen,
  not the adding of a nitro group to a chemical.
examples:
- Nitrification in the soil makes nitrogen ready for the plants.
- Bacteria carry out nitrification in dead leaves.
