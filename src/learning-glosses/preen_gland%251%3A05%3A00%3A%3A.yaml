simpleMeaning: a small part at the base of the tail in most birds that makes oil for the feathers
scope: 'Also called uropygial gland: a part that makes oil at the base of a bird''s tail, not a feather
  and not the tail itself.'
examples:
- The vet checked the bird's preen gland for signs of swelling.
- A healthy preen gland helps a bird spread oil over its feathers.
