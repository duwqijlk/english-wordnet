simpleMeaning: A flat piece of wire bent into two arms that press close together, used to keep short hair
  in place
scope: A flat wire fastener that keeps short hair in place, also called a grip and a hairgrip; not a pin
  used to fasten cloth and not a clip for papers.
examples:
- She slid a bobby pin into her hair to keep it back.
- He found a bobby pin on the floor of the car.
