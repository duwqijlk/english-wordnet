simpleMeaning: a language already spoken in a place that gives some of its features to the new language
  brought in by people who take over
scope: 'Also called a substrate: a language already spoken in a place that gives some of its features
  to the language of the people who take over, not the new language itself and not a language spoken only
  by the newcomers.'
examples:
- The Celtic languages of Britain are a substratum for English.
- Scholars say the old substratum still shapes the way people speak today.
