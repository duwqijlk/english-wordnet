simpleMeaning: A day off each year on January 19 in the southern United States, marking the birth of Robert
  E. Lee, a general of the Confederacy.
scope: A holiday in the southern United States for the birth of a Confederate general, also called January
  19, Robert E Lee's Birthday and Robert E Lee Day; not a national holiday and not a holiday for another
  person.
examples:
- Lee's Birthday is marked every year on January 19 in parts of the southern United States.
- Schools in some southern states close for Lee's Birthday.
