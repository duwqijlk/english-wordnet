simpleMeaning: the part of a modern stage that is in front of the curtain, between the curtain and the
  place where the musicians sit
scope: The front part of a stage, in front of the curtain. It is not the cloth tied at the waist that
  keeps your clothes clean while you cook.
examples:
- The actor stepped onto the apron to speak to the crowd.
- She stood on the apron, in front of the closed curtain, and bowed.
