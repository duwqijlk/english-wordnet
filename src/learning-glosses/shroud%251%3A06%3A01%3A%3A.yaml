simpleMeaning: a rope or chain on a sailing boat that holds a sail at a set angle to the wind
scope: On a boat, a rope or chain that sets a sail, also called sheet and tack, not the burial cloth and
  not the parachute line.
examples:
- The sailors tightened the shroud to set the sail.
- A loose shroud made the sail flap in the wind.
