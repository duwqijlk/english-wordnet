simpleMeaning: A way of thinking that keeps a person from being proud, and from showing pride they do
  not really feel
scope: A modest way of thinking about yourself, not false modesty put on for show and not low self-worth.
examples:
- Not everyone regards humility as a virtue.
- Her humility showed when she thanked the whole team instead of taking the praise herself.
