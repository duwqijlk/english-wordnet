synsetId: 06769391-n
simpleMeaning: words said to avoid answering a question, using clever tricks
scope: Also called dodge and dodging, this is a statement that avoids a question by using clever tricks;
  it is not a plan and not a whole system of parts.
examples:
- His reply was a clever scheme, and it did not answer the question at all.
- 'She saw the scheme in his words: lots of talk, but no answer to what she had asked.'
