simpleMeaning: The jaw knob fits into this deep hollow in the temple bone, at the base of the cheekbone
  arch.
scope: Also called mandibular fossa, this is the hollow in the skull where the jaw fits, not the hollow
  in the shoulder blade where the arm bone fits.
examples:
- The glenoid fossa in her skull held the jaw joint in place.
- The doctor pointed to the glenoid fossa on the scan of the jaw.
