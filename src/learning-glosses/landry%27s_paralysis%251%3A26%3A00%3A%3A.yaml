simpleMeaning: A sickness of many nerves at the edges of the body, marked by pain and weakness and at
  times lost movement in the limbs; its cause is not known.
scope: A sickness of many nerves at the edges of the body, also called infectious polyneuritis and Guillain-Barre
  syndrome; its near kin are other sicknesses of many nerves.
examples:
- Landry's paralysis brings pain and weakness in the limbs.
- The cause of Landry's paralysis is not known.
