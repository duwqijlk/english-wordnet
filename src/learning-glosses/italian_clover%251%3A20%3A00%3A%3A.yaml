simpleMeaning: A southern European plant that lives one year, with spiky heads of deep red flowers; grown
  a great deal in the United States as food for farm animals.
scope: A one-year plant of southern Europe with spiky heads of deep red flowers, also called crimson clover
  and Trifolium incarnatum; grown widely in the United States as food for farm animals, not a lasting
  pasture plant or a white-flowered clover.
examples:
- Italian clover grew in the field with its deep red heads.
- The farmer sowed Italian clover for the cattle.
