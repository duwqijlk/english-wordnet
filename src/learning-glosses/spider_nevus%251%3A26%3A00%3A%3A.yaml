simpleMeaning: A widening of tiny blood tubes near the skin's top, with a red spot in the middle from
  which small tubes spread out
scope: A widening of tiny blood tubes near the skin's top with a red spot in the middle; spider angioma
  and vascular spider are other names for this sense, not a bruise and not a birthmark that stays flat
  and dark.
examples:
- The spider nevus on her arm had a red dot in the middle with small tubes spreading out.
- A spider nevus is a widening of tiny blood tubes near the skin's top.
