simpleMeaning: The hinge joint where the lower arm meets the upper arm, and the same joint in the front
  leg of a four-legged animal.
scope: The hinge joint where the lower arm meets the upper arm, not the knee and not the wrist; elbow,
  articulatio cubiti, cubital joint, cubitus, and elbow joint are other names for this sense.
examples:
- She rested her human elbow on the table.
- He bumped his human elbow on the doorframe.
