simpleMeaning: to give someone a shock so deep that it leaves lasting pain in the mind
scope: To give a person a deep shock to the mind, also called traumatize; not a wound to the body and
  not a short fright.
examples:
- The accident traumatised him, and he dreamed about it for months.
- War can traumatise even the strongest soldiers.
