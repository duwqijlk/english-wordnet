simpleMeaning: Some plants, such as irises or grasses, bear a bunch or patch of hairs or bristles.
scope: A plant's bristly growth, not the hair on a man's face nor the anchoring threads of a shellfish.
examples:
- A yellow beard of hairs runs down the middle of the iris petal.
- Some grasses carry a beard along the edge of the leaf.
