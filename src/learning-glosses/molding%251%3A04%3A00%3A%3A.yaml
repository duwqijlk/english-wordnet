simpleMeaning: a first model of a work of art, made in wax or clay, that a finished work can be copied
  from
scope: 'Also called modeling, modelling and moulding: a first wax or clay model for a finished work, not
  a thin strip used to finish an edge and not a raised or cut-in pattern on an edge.'
examples:
- The artist made a wax molding before starting the large statue.
- The finished statue was copied from this clay molding.
