senseId: 'muffler%1:06:02::'
synsetId: 03166116-n
simpleMeaning: a device that makes back-and-forth movements or waves smaller and weaker, in electric,
  machine, sound, or air systems
scope: 'Also called damper: this is a general device that makes back-and-forth movements or waves smaller
  and weaker; it is not the tube on a car that cuts engine noise, and not a scarf worn around the neck.'
examples:
- They fitted a muffler to make the waves in the air system much weaker.
- A muffler inside the machine made its shaking smaller and less strong.
