simpleMeaning: A fish found off the east coast of the United States that looks much like the fish called
  the king
scope: This is a fish found off the east coast of the United States, much like the fish called the king;
  not a fish from other coasts.
examples:
- The northern whiting is caught off the east coast of the United States.
- At first glance, the northern whiting looks much like the king whiting.
