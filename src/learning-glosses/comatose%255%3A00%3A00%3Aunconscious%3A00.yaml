senseId: comatose%5:00:00:unconscious:00
synsetId: 00574466-s
simpleMeaning: in a deep state of not being awake, usually for a long time, and not able to react to sound,
  touch, or other things around you
scope: This means a person is deeply not awake for a long time and cannot react, not just sleeping in
  a normal way or feeling very tired.
examples:
- After the accident, he lay comatose in hospital for three weeks.
- The comatose patient did not react when the nurse spoke to her.
