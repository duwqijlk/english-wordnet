simpleMeaning: A piece of land with set edges, marked out so it can be run as one part of a country or
  for some other purpose
scope: District and territory are other names for this sense; this is a marked-out region, not power or
  control over others.
examples:
- The northern dominion sent its own men to the meeting.
- Each dominion kept its own laws and taxes.
