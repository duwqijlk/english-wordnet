simpleMeaning: A state of nature that no one can tame, still rough and with no care or order in it
scope: A state of nature that no one can tame, still rough and with no care or order in it; not a person's
  wish to do as they please.
examples:
- The wildness of the land kept settlers away for years.
- He loved the wildness of the hills, where no roads had been built.
