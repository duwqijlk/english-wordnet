simpleMeaning: With very sour fruit and orange skin, it is a cross of a small sweet orange and a sour
  yellow fruit.
scope: It is also called rangpur and rangpur lime, and its fruit is very sour under orange skin.
examples:
- The lemanderin bore very sour fruit with orange skin.
- She tasted a lemanderin and found its fruit very sour.
