simpleMeaning: A mechanical part of a camera that controls the size of the opening in its lens.
scope: This is a part of a camera lens, not a restraint on motion or a blockage in a pipe.
examples:
- The aperture stop narrowed the lens opening.
- The photographer adjusted the device to let less light through the lens.
