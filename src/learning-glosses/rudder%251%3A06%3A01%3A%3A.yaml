simpleMeaning: an upright part at the tail of a plane, shaped for the air to push against, joined so it
  can move and turn the plane left or right
scope: This is the moving tail part of a plane, used to turn it left or right, not the flat plate at the
  back of a boat or ship used for steering.
examples:
- The pilot moved the rudder to turn the plane to the left.
- A damaged rudder made the plane hard to turn in the air.
