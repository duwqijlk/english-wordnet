simpleMeaning: Often found with an illness in which the body mishandles fats, this skin trouble shows
  as wide-spread yellowish fatty lumps, above all on elbows and knees
scope: Also called lipid granulomatosis, lipoid granulomatosis, xanthoma multiplex and xanthomatosis,
  it is a skin trouble that shows as wide-spread yellowish fatty lumps, often found with an illness in
  which the body mishandles fats.
examples:
- Cholesterosis cutis left yellowish lumps on his elbows.
- The doctor saw cholesterosis cutis on her knees.
