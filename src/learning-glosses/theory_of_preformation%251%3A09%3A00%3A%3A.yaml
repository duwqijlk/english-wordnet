simpleMeaning: People in the 1700s held that a person starts as a tiny whole being in the seed cell and
  only grows bigger, a view now set aside.
scope: An old idea about how a person grows, also called preformation, now set aside rather than held
  as true.
examples:
- The theory of preformation said a tiny whole person lay in the seed cell.
- In class we read how the theory of preformation was set aside in later years.
