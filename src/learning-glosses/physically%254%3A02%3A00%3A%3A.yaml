simpleMeaning: in a way that fits the laws of nature
scope: This means something fits the laws of nature and can happen in the real world, not that it is done
  with the body or by hand.
examples:
- It is physically impossible for a person to lift that rock alone.
- The ball cannot move that way, because it is not physically possible.
