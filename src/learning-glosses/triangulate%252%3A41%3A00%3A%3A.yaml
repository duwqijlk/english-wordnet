simpleMeaning: To cut a thing into triangles, or to shape it like a triangle.
scope: To cut a thing into triangles or shape it like a triangle, not the adjective use for a thing made
  of or marked with triangles, and not the use for finding a place by measuring triangles.
examples:
- The worker will triangulate the sheet of metal into even pieces.
- She asked him to triangulate the map into small triangles.
