synsetId: 12320157-n
simpleMeaning: A smooth or hairy evergreen shrub or tree, with stringy twigs tied in bunches in some places
  and used as a toothbrush, shoots that feed camels, and ash giving salt.
scope: Also called mustard tree and toothbrush tree; an evergreen shrub or small tree whose twigs are
  used as a toothbrush, not a tree grown for its fruit and not a herb used as food.
examples:
- Salvadora persica is an evergreen shrub or tree whose twigs are used as a toothbrush.
- People in some regions clean their teeth with Salvadora persica twigs.
