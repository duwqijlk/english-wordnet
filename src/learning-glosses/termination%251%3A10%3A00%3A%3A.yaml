simpleMeaning: the last part added to a word, such as letters at its end that change its form or add meaning
scope: 'Also called ending: the last part of a word, not the end of a job, a meeting, or an agreement.'
examples:
- The termination '-ed' shows that the action happened in the past.
- In 'kindness', the termination '-ness' turns the word into a noun.
