simpleMeaning: A funny drawn face of a church leader of the 1600s marks a jug for drink, made of hard
  fired clay with a long neck.
scope: This is a jug for drink, made of hard fired clay with a long neck and marked with a funny drawn
  face of a church leader of the 1600s; greybeard, long-beard and longbeard are other names for this sense.
examples:
- The bellarmine held wine in its long neck.
- He lifted the bellarmine and looked at the funny face on its side.
