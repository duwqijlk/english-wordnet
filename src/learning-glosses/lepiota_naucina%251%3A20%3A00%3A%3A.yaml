simpleMeaning: A mushroom with a greyish white fruiting body and gills that change from pink to dull red
scope: A greyish white mushroom with gills that change from pink to dull red, unlike mushrooms whose gills
  keep one colour, and unlike the pink-capped Lepiota rubrotincta.
examples:
- The Lepiota naucina in the field had gills turning from pink to red.
- The Lepiota naucina we found had a greyish white body and gills that had turned from pink to dull red.
