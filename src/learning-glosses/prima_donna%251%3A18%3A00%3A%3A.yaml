simpleMeaning: A well-known woman who sings in opera, a woman star of the opera stage
scope: A well-known woman who sings in opera; diva is another name for this sense, not a woman who makes
  a fuss to get her way.
examples:
- The prima donna sang the lead role in tonight's opera.
- She became the prima donna of the opera company after years of training.
