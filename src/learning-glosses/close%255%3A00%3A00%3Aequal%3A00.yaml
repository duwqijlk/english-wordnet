simpleMeaning: 'of a competition or the people taking part: having the same or nearly the same level of
  skill or strength'
scope: This is not about physical distance between things; it is about two sides of a competition being
  equal.
examples:
- It was a close game, decided by a single point in the last minute.
- The election was so close that a recount was ordered.
