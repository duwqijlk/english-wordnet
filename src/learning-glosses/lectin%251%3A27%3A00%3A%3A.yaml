simpleMeaning: any of several plant proteins with sugar joined to them that act like certain germ-fighters
  of the body but are not those fighters, since nothing foreign sets them off
scope: A plant protein that acts like the body's germ-fighters but is not one, not an antibody and not
  a poison that attacks the body.
examples:
- The lectin in the seeds acts like an antibody but is not one.
- Scientists study lectins to learn how plant proteins act like antibodies.
