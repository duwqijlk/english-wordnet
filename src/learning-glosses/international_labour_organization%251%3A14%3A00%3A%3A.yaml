simpleMeaning: The United Nations agency concerned with the interests of workers.
scope: Also called International Labor Organization; this word is for the part of that group that works
  for workers, not the part that looks after the health of children and not the part that looks after
  the trade in drugs.
examples:
- The International Labour Organization works for workers and their needs.
- Workers look to the International Labour Organization for help.
