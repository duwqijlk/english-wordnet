simpleMeaning: a cloth laid under the seat a rider sits on, part of the gear used with horses
scope: 'Also called a saddlecloth or a horse blanket: a cloth laid under a saddle, not a blanket for a
  bed and not a cloth worn by the rider.'
examples:
- He slipped the saddle blanket under the saddle before he mounted.
- The saddle blanket was folded over the stable door.
