simpleMeaning: a word for someone who shows one set of feelings, in particular, while their acts are pushed
  by a different set, and does this on purpose to trick others
scope: 'Also called deceitful, duplicitous, ambidextrous, double-dealing and double-tongued: a word for
  a person who says one thing and does another, not the noun sense of the cheating itself and not a person
  who simply changes their mind.'
examples:
- The double-faced manager praised her in public and blamed her in private.
- Beware the double-faced friend who smiles and then talks behind your back.
