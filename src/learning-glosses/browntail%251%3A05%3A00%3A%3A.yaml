simpleMeaning: A small dark and white night-flying insect from Europe, brought to the eastern United States,
  that harms many shade and fruit trees.
scope: A small dark and white night-flying insect from Europe that harms shade and fruit trees; brown-tail
  moth is another name for this sense, not a butterfly and not a clothes moth.
examples:
- The browntail is a pest of orchards in New England.
- Browntail moths were found on the shade trees by the house.
