simpleMeaning: one way the body stores fuel, kept mostly in the liver and changed back to glucose when
  the body needs it
scope: One way the body stores fuel, kept mostly in the liver and changed back to glucose when the body
  needs it; animal starch is another name for this sense, not fat and not glucose itself.
examples:
- Glycogen is stored in the liver.
- After exercise, the body rebuilds its glycogen stores.
