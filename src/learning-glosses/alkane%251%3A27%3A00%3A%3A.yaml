simpleMeaning: a family of stuffs made only of carbon and hydrogen, joined by single links in open chains,
  each holding one more carbon and two more hydrogens than the last
scope: Also called paraffin, alkane series, methane series, and paraffin series, the name marks the whole
  single-linked family, not any one member of it.
examples:
- Methane is the first alkane in the run, with one carbon atom.
- Each alkane in the book's list adds one carbon and two hydrogens.
