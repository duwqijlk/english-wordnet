simpleMeaning: A kind of bee from Brazil, made in the 1950s by crossing a fierce African bee with a honeybee;
  it keeps most African traits and now reaches Texas.
scope: Also called killer bee, Africanized bee, Africanized honey bee, and Apis mellifera scutellata;
  a fierce kind of stinging insect from Brazil, not a calm garden honeybee and not a wild wasp.
examples:
- Apis mellifera adansonii spread north into Texas in recent years.
- An Apis mellifera adansonii stung the farmer when he came too close.
