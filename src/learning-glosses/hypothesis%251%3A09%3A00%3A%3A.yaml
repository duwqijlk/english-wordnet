simpleMeaning: an early guess about the natural world, not yet proved, that would make sense of certain
  facts or happenings if it turned out to be true
scope: 'Also called theory or possibility: an unproved idea about nature that could explain facts, not
  a proved fact and not a wild guess with no link to facts.'
examples:
- Her hypothesis was that the plants grew faster in warm soil.
- They tested the hypothesis by changing the light the seedlings got.
