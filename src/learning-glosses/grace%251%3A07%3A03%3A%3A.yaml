simpleMeaning: a person's way of feeling and acting with kindness and care for other people
scope: A kind and caring way of acting toward others; not God's free help in Christian teaching, and not
  the extra time given to pay or finish something late.
examples:
- The winner showed grace to the man she had beaten.
- He spoke with grace and did not blame them for their loss.
