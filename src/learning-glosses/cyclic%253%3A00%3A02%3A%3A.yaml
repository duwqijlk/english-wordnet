simpleMeaning: Said of a chemical compound whose atoms form a ring.
scope: Said of a chemical compound whose atoms are set in a ring, not of a thing that comes round again
  and again, and not of a whorl of parts.
examples:
- Benzene is a cyclic compound, its atoms set in a ring.
- The chemist drew the cyclic molecule on the board.
