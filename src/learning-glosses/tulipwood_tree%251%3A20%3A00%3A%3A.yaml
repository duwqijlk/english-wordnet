simpleMeaning: Any of several kinds of tall woody plant that give wood of many colors, much like the real
  striped wood
scope: This is any of several kinds of tall woody plant that give wood of many colors, much like the real
  striped wood; not the wood itself and not the North American tulip tree.
examples:
- The tulipwood tree in the garden gives wood of many colors.
- Several tulipwood trees grow on the hill, and their wood is prized for fine work.
