senseId: 'hematocoele%1:26:00::'
synsetId: 14340648-n
simpleMeaning: In a hollow space inside the body, blood that has collected there can swell into a lump,
  most often in the thin cover round a testicle.
scope: Also called a haematocele, a haematocoele or a hematocele, this is a lump from blood collecting
  in a hollow space inside the body.
examples:
- The hematocoele formed where blood had gathered in the cavity.
- A hematocoele swelled the thin covering round a testicle.
