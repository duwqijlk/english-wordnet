simpleMeaning: a Gothic building style in England in the 1300s and 1400s, with up-and-down lines, a four-curve
  Tudor arch, and a ceiling whose ribs spread out wide
scope: Also called perpendicular style, this is a way of building in old England; it is not the word for
  meeting at a right angle, and not a cord with a weight for finding true up-and-down.
examples:
- The old church is in the perpendicular style, with strong up-and-down lines.
- Many English churches from the 1400s show the perpendicular style in ceilings whose ribs spread like
  a fan.
