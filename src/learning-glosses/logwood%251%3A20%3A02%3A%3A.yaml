simpleMeaning: Used to make a purplish-red dye, this is the very hard brown or brownish-red inner wood
  of a tree of this kind.
scope: This is the very hard brown inner wood of a tree of this kind, used to make a purplish-red dye,
  not any hard wood and not a dye made from roots.
examples:
- Logwood gives a deep purplish-red dye.
- The dyer boiled logwood chips to colour the cloth.
