simpleMeaning: This sea creature breathes through a row of small tufts along each side of its back, and
  people often use it to catch fish
scope: Also called lug and lugworm, this sea creature is the one with a row of tufts along its back that
  people use to catch fish.
examples:
- They used a lobworm as bait to catch fish.
- The lobworm's back had a row of small tufts.
