simpleMeaning: A set sum paid again and again that stays the same no matter how much trade a firm does,
  such as cover, rent or home-loan sums
scope: This is a set sum paid again and again that stays the same no matter how much trade a firm does;
  fixed cost and fixed costs are other names for this sense, not a sum that rises with trade and not a
  one-off sum.
examples:
- The fixed charge stayed the same each month.
- Rent is a fixed charge for the shop.
