simpleMeaning: a deep, strong flavor that you feel all over your mouth
scope: 'Also called rich, robust, and racy: a strong, deep taste, not a weak or thin one, and not a smell.'
examples:
- The full-bodied red wine had a strong, deep taste.
- She liked her coffee full-bodied and dark.
