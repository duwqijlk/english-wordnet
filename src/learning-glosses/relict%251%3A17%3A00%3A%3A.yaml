simpleMeaning: a part of the ground that is left from a shape of rock made long ago, after the rest of
  it has gone
scope: A piece of ground left from a rock shape made long ago, not a living thing left from a time long
  past and not a new shape of rock.
examples:
- The low ridge is a relict of an old sea bed.
- A relict of the old ice sheet still shows in the valley floor.
