simpleMeaning: A substance in living things that speeds up a change where oxygen is passed from one thing
  to another
scope: A substance in living things that speeds up a change where oxygen moves from one thing to another,
  not a substance that brings about some other kind of change.
examples:
- The oxidoreductase in the cell speeds up the transfer of oxygen.
- Scientists study oxidoreductase to see how living things use oxygen.
