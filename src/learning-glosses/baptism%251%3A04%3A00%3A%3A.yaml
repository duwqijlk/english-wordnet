simpleMeaning: A Christian holy act; a sign of the cleaning of a person's soul and of a new start in life
scope: This is the Christian holy act for a clean soul and a new life, not an ordinary wash.
examples:
- Most churches hold a baptism for babies.
- Her baptism at the church marked the start of her new life in the faith.
