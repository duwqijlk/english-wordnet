simpleMeaning: clear approval given in a formal way and said or written openly
scope: This is the clear, formal approval itself, not the act of giving it and not a short line of praise
  printed on a book cover to help sell the book.
examples:
- The union gave its endorsement to the mayor before the vote.
- Her plan won the endorsement of the whole team.
