simpleMeaning: A short, wide bowling piece, shorter and thicker than the tall pieces used in the usual
  game
scope: A short, wide bowling piece, not the tall piece used in the usual game and not a ball.
examples:
- The duckpin fell with a soft clatter when the ball hit it.
- A duckpin is shorter and wider than the tall pin used in tenpin bowling.
