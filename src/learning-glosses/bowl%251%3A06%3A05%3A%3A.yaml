simpleMeaning: A big ball bored with holes for the fingers, sent rolling down a lane at pins.
scope: This is the finger-holed ball for the lane sport, also called a bowling ball, not the wooden ball
  used in lawn bowling or the act of rolling it.
examples:
- He wiped his bowl with a towel before stepping onto the lane.
- She chose a lighter bowl for the final frame.
