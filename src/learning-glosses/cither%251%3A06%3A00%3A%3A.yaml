simpleMeaning: you lay it flat and play it with a small pick and with the fingers; its strings are pulled
  tight over a flat board that makes the sound
scope: 'Also called zither and zithern: a flat stringed instrument played with a pick and fingers, not
  the 16th-century guitar-like instrument also called cither.'
examples:
- He laid the cither flat on the table and plucked its strings with a pick.
- The cither sounded bright as she played it with her fingers.
