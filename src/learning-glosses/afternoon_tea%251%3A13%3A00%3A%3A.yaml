simpleMeaning: a light meal taken between lunch and dinner, with a hot drink and sandwiches or cakes
scope: Also called tea and teatime, this is a light meal taken between lunch and dinner, with a hot drink
  and sandwiches or cakes, not a full evening meal and not a cup of the hot drink on its own.
examples:
- An Englishman would interrupt a war to have his afternoon tea.
- We sat down for afternoon tea with sandwiches and cakes at four o'clock.
