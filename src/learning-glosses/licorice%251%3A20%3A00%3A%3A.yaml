simpleMeaning: A rough, deep-rooted plant native to the Mediterranean region, with blue flowers and leaves
  split into leaflets along stems, widely grown in Europe for its long, thick, sweet roots.
scope: This is the plant itself, not the sweet black candy or the flavouring made from its root; liquorice
  is another name for the plant.
examples:
- The licorice plants by the fence are covered in blue flowers now.
- Farmers in southern Europe grow licorice for its thick, sweet roots.
