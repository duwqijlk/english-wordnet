simpleMeaning: A member of the Algonquian tribe of central Wisconsin, accepted by the U.S. government
  as a tribe, living on land set aside for the tribe
scope: A member of the Algonquian tribe of central Wisconsin, accepted by the U.S. government as a tribe,
  living on land set aside for the tribe; Menominee is another name for this sense, and it is not the
  tongue spoken by this tribe.
examples:
- She is a Menomini from central Wisconsin.
- The Menomini live on a reservation in Wisconsin.
