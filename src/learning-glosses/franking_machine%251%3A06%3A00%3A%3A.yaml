simpleMeaning: A device that by itself marks letters or parcels as they pass through it and works out
  the full cost.
scope: A device that marks mail by itself and works out the cost, not a device that only weighs mail and
  not a hand stamp.
examples:
- The office bought a franking machine to stamp its mail.
- Letters passed through the franking machine in seconds.
