simpleMeaning: a person whose body needs a drug or a habit, and cannot do without it
scope: A person whose body needs a drug or a habit, and cannot do without it; not a person who merely
  loves a thing, and not the act of making a person need one.
examples:
- He became an addict after years of taking the drug.
- The addict could not stop, even when he wanted to.
