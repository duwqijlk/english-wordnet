simpleMeaning: to take a Jewish boy through the set ceremony that marks him as an adult in his faith
scope: To take a Jewish boy through the ceremony that marks him as an adult in his faith, not the ceremony
  itself and not a wedding or a naming rite.
examples:
- His father hoped the rabbi would bar mitzvah him in the spring.
- They plan to bar mitzvah their son when he turns thirteen.
