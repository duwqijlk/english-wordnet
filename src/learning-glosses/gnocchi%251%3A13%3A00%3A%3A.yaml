simpleMeaning: A small Italian piece of cooked dough made from potato, flour, or semolina (a rough flour),
  boiled or baked and usually served with a sauce or grated cheese
scope: This is the small Italian food made from potato, flour, or semolina and usually served with sauce
  or cheese, not a long pasta.
examples:
- She boiled the gnocchi and served them with tomato sauce.
- We ate gnocchi covered with grated cheese.
