simpleMeaning: A group of advisers in a religious order who give advice and help to its chief leaders
scope: A council of advisers in a religious order; not the leaders themselves and not a meeting of all
  the members.
examples:
- The definitors met to advise the superior general.
- The provincial superior asked the definitors for help with the decision.
