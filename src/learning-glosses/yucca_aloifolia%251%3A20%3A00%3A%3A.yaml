simpleMeaning: A stiff plant with a short trunk, found in the southern United States and tropical America,
  with hard leaves tipped with spines and groups of white flowers
scope: A stiff plant with a short trunk and hard spine-tipped leaves; Spanish bayonet is another name
  for this sense, not a yucca with a tall trunk.
examples:
- Yucca aloifolia grew near the warm coast.
- The Yucca aloifolia had clusters of white flowers.
