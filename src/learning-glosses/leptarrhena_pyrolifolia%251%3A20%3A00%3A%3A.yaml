simpleMeaning: A plant with tough oval base leaves and upright leafless stalks holding dense round bunches
  of tiny white flowers; in wet places of northwestern North America to Oregon and Idaho.
scope: Not other saxifrages, nor other plants with tiny white flowers; also called leatherleaf saxifrage.
examples:
- Leptarrhena pyrolifolia grows in wet places.
- The white flowers of Leptarrhena pyrolifolia are tiny.
