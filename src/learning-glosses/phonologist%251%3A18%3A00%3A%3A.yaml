simpleMeaning: A person who knows a lot about how sounds work in a language.
scope: This is a person who knows a lot about how sounds work in a language, not a person who knows only
  how single sounds are made, and not a teacher of language.
examples:
- The phonologist studied the sound rules of the language.
- A phonologist can explain why sounds change.
