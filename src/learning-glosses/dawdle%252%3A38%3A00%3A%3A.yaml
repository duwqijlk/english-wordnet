senseId: 'dawdle%2:38:00::'
synsetId: 02062514-v
simpleMeaning: To move or act in no rush, using more time than you need.
scope: To take your time and go slowly; linger is another name for this sense, and it is not to stop and
  rest nor to be late by chance.
examples:
- Do not dawdle on the way to school.
- He dawdled along the road, enjoying the sun.
