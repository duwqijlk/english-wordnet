simpleMeaning: used for many things, parts, or groups that are like each other, all at the same time
scope: This sense describes a name, rule, or plan that covers many like things at once; it is not a cloth
  cover you hold against rain, and not planes flying over soldiers on the ground.
examples:
- The umbrella group speaks for twenty small charities.
- She bought umbrella insurance that covers her house and her car.
