simpleMeaning: A big dog that guards sheep, with a thick shaggy blue-grey-and-white coat and a short tail;
  thought to go back to the time of the Romans in Britain.
scope: 'Also called bobtail: a big dog that guards sheep, with a thick shaggy blue-grey-and-white coat
  and a short tail, thought to go back to the time of the Romans in Britain, not a small herding dog and
  not a long-tailed sheepdog.'
examples:
- The Old English sheepdog lay by the fire with its shaggy coat.
- An Old English sheepdog guarded the flock on the hill.
