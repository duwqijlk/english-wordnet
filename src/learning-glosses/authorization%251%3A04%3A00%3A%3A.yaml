simpleMeaning: the act of making something legal, or giving official approval or a formal right for it
scope: 'Also called empowerment and authorisation: this is the act of giving legal or official permission,
  not a single paper permit on its own.'
examples:
- The project cannot start without authorization from the city.
- We got authorization to build the new road.
