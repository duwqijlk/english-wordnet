simpleMeaning: War work with electronics done under a field leader's direct orders, to find where radio
  waves come from, so threats can be known at once.
scope: Also called electronic warfare-support measures; war work with electronics that finds where radio
  waves come from, so threats can be known at once.
examples:
- ESM found where the radio waves were coming from.
- The commander used ESM to know the threat at once.
