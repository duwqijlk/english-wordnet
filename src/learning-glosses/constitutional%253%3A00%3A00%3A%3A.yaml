senseId: 'constitutional%3:00:00::'
synsetId: 00181225-a
simpleMeaning: allowed by, in line with, or working under the basic law that sets out the main ideas for
  how a country is ruled
scope: This is about being allowed by or in line with a country's basic law, not about something built
  into a thing by nature or built into a person's body.
examples:
- Free speech is a constitutional right in this country.
- The court said the new law was constitutional and could stay.
