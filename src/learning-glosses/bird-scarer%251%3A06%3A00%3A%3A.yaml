simpleMeaning: a man-shaped dummy put out to frighten seed-eating flying creatures away from seeds
scope: 'Also called a scarecrow: a dummy in the shape of a man that frightens seed-eating flying creatures
  away from seeds, not a real guard and not a live animal.'
examples:
- The farmer put a bird-scarer in the field to keep the seeds safe.
- They dressed the bird-scarer in an old coat and hat.
