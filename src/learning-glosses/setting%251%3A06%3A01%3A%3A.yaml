simpleMeaning: the furniture, scenery, and objects arranged on a stage to show where the action of a play
  or film takes place
scope: This is not the general time and place of a story and not the act of putting something in place;
  it is the arranged scenery and objects for a performance.
examples:
- The stage setting for the final scene was a shabby hotel room.
- The designer created an elaborate setting with fake trees and a painted sky.
