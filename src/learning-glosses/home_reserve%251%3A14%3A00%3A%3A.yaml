simpleMeaning: These troops are raised by each state in the United States and given gear by the central
  government, and either one can call them up
scope: Troops raised by the states and given gear by the central government, which either of them can
  call up, not the regular army and not the home guard.
examples:
- The home reserve trained with state troops each summer.
- The governor called out the home reserve after the flood.
