simpleMeaning: the state of a tree or plant when it makes fruit
scope: This is the state of a plant making fruit. It is not the pleasure a person gets from using or having
  something.
examples:
- The apple trees came into fruition in late summer.
- Good care helps the vines reach full fruition.
