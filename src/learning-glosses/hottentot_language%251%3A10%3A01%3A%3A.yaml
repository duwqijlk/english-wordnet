simpleMeaning: Any of the Khoisan ways of speaking used by the herding people of Namibia and South Africa
scope: This is any of the Khoisan ways of speaking used by the herding people of Namibia and South Africa,
  also called Hottentot, Khoikhoi, Khoikhoi language, Khoikhoin and Khoikhoin language; near rivals are
  other Khoisan languages such as Nama and the San languages.
examples:
- Hottentot language is one of the Khoisan languages spoken by the herding people of Namibia and South
  Africa.
- Linguists group the Hottentot language with the Khoisan languages of southern Africa.
