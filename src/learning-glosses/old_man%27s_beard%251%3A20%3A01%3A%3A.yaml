simpleMeaning: Bearing many bunches of small creamy white flowers, this common plant climbs in eastern
  North America and spreads over other plants.
scope: It is also called devil's darning needle and virgin's bower, a common climbing plant of eastern
  North America, not the European kind with green-white flowers.
examples:
- We found old man's beard sprawling over other plants.
- The old man's beard bore many bunches of small creamy white flowers.
