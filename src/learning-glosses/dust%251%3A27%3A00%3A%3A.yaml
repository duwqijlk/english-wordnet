simpleMeaning: tiny dry particles, such as earth or pollen, that the wind can carry through the air
scope: This is the powdery material itself, not the act of rubbing powder over a surface to blur a shape's
  outlines, nor the microscopic particles or debris named by other senses.
examples:
- A thick layer of dust covered the old piano.
- Dust hung in the air after the explosion.
