simpleMeaning: Instead of only saying no to the facts the other side claims, this defence in court states
  facts of its own.
scope: This names a court defence that puts forward facts of its own, not a plain denial that only says
  no to what the other side claims.
examples:
- Affirmative pleading let the defendant raise facts instead of only denying the plaintiff's claims.
- The lawyer used affirmative pleading to set out the facts of his own case.
