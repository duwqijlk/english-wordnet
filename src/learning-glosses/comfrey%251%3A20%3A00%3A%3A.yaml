simpleMeaning: Herbs that live for years, from Europe and Iran, making fast-growing ground cover for shady
  places.
scope: Also called cumfrey; the long-lived herbs of Europe and Iran that cover shady ground, not the leaves
  used for tea or in salads.
examples:
- Comfrey covered the shady bank in a few months.
- She planted comfrey where little else would grow.
