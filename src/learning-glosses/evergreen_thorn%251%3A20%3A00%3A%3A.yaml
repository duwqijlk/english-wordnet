simpleMeaning: a tree with sharp points on its branches that keeps its leaves all year, from the southeast
  of Europe
scope: A tree with sharp points on its branches that keeps its leaves all year, from the southeast of
  Europe, not a tree that loses its leaves in winter and not a tree from another part of the world.
examples:
- The evergreen thorn grows wild in the hills of southeastern Europe.
- An evergreen thorn keeps its leaves through the winter.
