simpleMeaning: of an event, a thing that stirs a response, or a process, changing what comes after it
scope: Of an event, a thing that stirs a response, or a process that changes what happens later, not a
  policy or person that acts first instead of waiting.
examples:
- Proactive inhibition slows later learning, the book said.
- A proactive effect from the first task changed how she did the second.
