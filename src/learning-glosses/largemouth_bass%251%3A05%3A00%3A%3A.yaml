simpleMeaning: A large black bass in which the corner of the jaw sits behind the eye.
scope: Also called largemouth, largemouth black bass, largemouthed bass and largemouthed black bass, this
  is a big dark fish whose mouth corner reaches back past the eye, not a smallmouth bass and not any other
  dark fish.
examples:
- We caught a largemouth bass near the reeds at dawn.
- The largemouth bass he landed weighed over five pounds.
