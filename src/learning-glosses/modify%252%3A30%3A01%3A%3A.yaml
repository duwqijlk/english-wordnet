simpleMeaning: To put a word or words next to a word or group of words in a sentence to say more about
  it
scope: This is to put a word or words next to a word or group of words to say more about it, not to make
  a thing less strong or less great than it was.
examples:
- In 'the big red ball', 'big' modifies the noun.
- You can modify 'run' with 'quickly' to say how it was done.
