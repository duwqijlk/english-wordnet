simpleMeaning: to turn into lime, a white, chalk-like material, and so become hard and stone-like
scope: To turn into lime and become hard, not to become full of calcium salts (mineral salts with calcium
  in them) and get harder that way.
examples:
- The rock calcified over the centuries.
- As the water dried up, the soft mud slowly calcified.
