simpleMeaning: A drug taken by mouth, sold as Glucotrol, that makes the pancreas give out insulin to lower
  blood sugar
scope: This is a drug taken by mouth, sold as Glucotrol, that makes the pancreas give out insulin to lower
  blood sugar, not insulin itself and not a drug for high blood pressure.
examples:
- The doctor prescribed glipizide for her diabetes.
- He takes glipizide each morning before breakfast.
