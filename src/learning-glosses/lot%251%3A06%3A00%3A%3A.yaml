simpleMeaning: any small object, such as a straw or a pebble, that is picked at random, especially to
  settle a choice.
scope: This sense is not a large amount, a piece of land, or a group of items sold together; it is a random
  object used to make a choice.
examples:
- They shook the lots in a cup before drawing one.
- Each lot was a small pebble marked with a name.
