simpleMeaning: When the male courts a mate, he spreads his long tail feathers wide in a curved U shape,
  and this Australian bird looks much like a pheasant.
scope: An Australian bird much like a pheasant, whose courting male spreads his long tail feathers wide
  in a curved U shape.
examples:
- The lyrebird looks much like a pheasant.
- The male lyrebird spread his long tail feathers in a curved U shape as he courted a mate.
