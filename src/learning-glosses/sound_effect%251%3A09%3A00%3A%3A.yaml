simpleMeaning: A noise made to copy one that a play's written text calls for
scope: A made noise that copies one called for in a play's text, not music played in a play and not a
  thing seen on stage.
examples:
- The sound effect of thunder shook the hall.
- A sound effect of rain played as the curtain rose.
