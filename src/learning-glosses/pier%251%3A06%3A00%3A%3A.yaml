simpleMeaning: a walkway built out from the shore over the water, resting on posts, where ships and boats
  can stop
scope: A walkway out over the water where ships and boats can stop, also called dock; not the upright
  piece of wall in a building.
examples:
- We walked along the pier to board the boat.
- Fishing boats tied up at the pier.
