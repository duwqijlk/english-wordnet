simpleMeaning: In linguistics, this is a vowel sound with the tongue held in the middle, halfway between
  a front vowel and a back vowel.
scope: This vowel sound is made with the tongue in the middle, neither at the front nor at the back of
  the mouth.
examples:
- The central vowel in the word sits halfway between a front and a back vowel.
- The central vowel in that word is made with the tongue in the middle of the mouth.
