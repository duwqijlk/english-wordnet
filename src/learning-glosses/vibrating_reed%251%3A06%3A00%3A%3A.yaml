simpleMeaning: Air blowing over a thin strip of stiff stuff sets it shaking, and the shaking makes a musical
  note.
scope: Also called reed, it is a thin strip of stiff stuff that shakes and makes a musical note when air
  blows over it.
examples:
- The clarinetist fitted a new vibrating reed onto his mouthpiece.
- The vibrating reed shook as he blew, and a clear note came out.
