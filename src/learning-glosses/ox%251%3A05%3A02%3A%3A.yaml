simpleMeaning: a grown bull that has been castrated, of the kind of cattle called Bos, most of all Bos
  taurus, the common farm kind
scope: A grown castrated bull of the Bos kind of cattle, not a wild bovine of the same kind.
examples:
- The ox pulled the cart along the track.
- Two oxen stood in the yard beside the barn.
