simpleMeaning: A way used in deed-therapy to treat fears and other deed troubles bringing worry, where
  the person meets the feared spot at ease till the worry answer dies out.
scope: This sense is also called desensitisation technique, desensitization procedure, desensitization
  technique, systematic desensitisation, and systematic desensitization, for a way used in deed-therapy
  to treat fears and other deed troubles bringing worry, where the person meets the feared spot at ease
  till the worry answer dies out.
examples:
- The desensitisation procedure eased her fear of dogs.
- They tried a desensitisation procedure for the phobia.
