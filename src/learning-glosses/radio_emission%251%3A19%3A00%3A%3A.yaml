simpleMeaning: a wave of power that moves through the air, with a length from half a centimetre to 30,000
  metres
scope: 'Also called radio radiation and radio wave: a wave with a length from half a centimetre to 30,000
  metres, not a ray of light and not a sound wave.'
examples:
- The radio emission from the star was picked up by the dish.
- Scientists measure the radio emission to learn about the far-off star.
