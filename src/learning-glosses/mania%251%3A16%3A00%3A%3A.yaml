simpleMeaning: an unreasoning urge that a person cannot fight off, driving them to believe or do something
scope: An unreasoning urge behind a belief or act that a person cannot fight off, with passion as another
  name for this sense, and not a mood illness or a strong liking.
examples:
- His mania for collecting old coins took over his life.
- She had a mania for cleaning that no one could stop.
