senseId: 'terseness%1:10:00::'
synsetId: 07102630-n
simpleMeaning: A way of speaking or writing that says much in very few words, in neat, short form.
scope: A way of speaking or writing that says much in very few words, in neat, short form, with no other
  sense of the word to set against it.
examples:
- The terseness of his reply left no room for doubt.
- She admired the terseness of the report, every word earning its place.
