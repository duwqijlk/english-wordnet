senseId: 'syllogize%2:31:00::'
synsetId: 00655120-v
simpleMeaning: To reach a new fact by joining two facts already known
scope: To reach a new fact from facts already known; syllogise is another name for this sense, not to
  guess and not to prove by test.
examples:
- He syllogized that if all men are mortal, Socrates must be mortal.
- She syllogized that all cats are animals, so her cat must be an animal too.
