simpleMeaning: A judgment about the supplies and help an army needs for one planned move
scope: A judgment about the supplies and help for one planned army move, not the moving of the supplies
  and not a plan for the fighting.
examples:
- The logistic assessment showed the unit would need twice the fuel.
- Before the move, officers made a logistic assessment of food and transport.
