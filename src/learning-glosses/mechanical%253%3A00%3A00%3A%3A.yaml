simpleMeaning: using a set of moving parts, a tool or a made thing for a job, or seeming to use one
scope: This means using a set of moving parts, a tool or a made thing for a job, or seeming to do so,
  not just being about machines and tools and not about the science of forces and movement.
examples:
- The mechanical toy walked across the floor when she wound it up.
- He gave a mechanical smile, as if a machine were moving his face.
