simpleMeaning: Its wood is hard, strong, and pale; this medium to large oak of Europe sheds its leaves
  each year and has smooth leaves with round lobes.
scope: 'Also called a common oak: a medium to large oak of Europe that sheds its leaves each year, not
  an oak that keeps its leaves all year.'
examples:
- The pedunculate oak sheds its leaves each autumn.
- Smooth leaves with round lobes mark the pedunculate oak.
