simpleMeaning: Blue-black berries grow on this bush of eastern North America, whose tough bending timber
  was once cut for shafts shot from bows, and which drops its leaves in fall.
scope: This bush is also called southern arrow wood, and is not its close kin of the same name that grows
  from Maine to Ohio and Georgia.
examples:
- The arrow wood dropped its leaves in fall.
- They cut arrow wood for shafts.
