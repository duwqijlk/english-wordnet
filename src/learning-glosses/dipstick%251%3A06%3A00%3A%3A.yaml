simpleMeaning: A rod marked with lines, put down into a container to show how much liquid is in it
scope: A marked rod dipped in a container to read the liquid level, not a pump and not a gauge on the
  wall.
examples:
- He pulled out the dipstick to check the oil level.
- The dipstick showed the tank was nearly empty.
