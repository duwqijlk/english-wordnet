simpleMeaning: A kind of wild ginger with strong-smelling, long-lasting parts with two round lobes at
  the top, found from West Virginia to Alabama
scope: This is a kind of wild ginger with strong-smelling parts, also called heartleaf, and not the evergreen
  kind with mottled green and grey-green parts found from Virginia to South Carolina.
examples:
- Heart-leaf grows in the woods of West Virginia.
- We found heart-leaf with its strong-smelling leaves.
