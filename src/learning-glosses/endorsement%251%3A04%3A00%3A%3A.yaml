senseId: 'endorsement%1:04:00::'
synsetId: 01217658-n
simpleMeaning: the act of showing or saying that you approve of and support someone or something
scope: This is the act itself of showing support, not clear approval given in an official way and not
  the short printed praise on a book.
examples:
- The singer's endorsement of the shoes helped them sell well.
- His endorsement of the plan showed he fully supported it.
