simpleMeaning: a device you use to talk to someone far away by sending sound through wires or radio signals.
scope: It is not the small earpiece worn on or in the ear; it is the whole device used for making calls.
examples:
- She picked up the phone and called her mother.
- My phone battery died during the meeting.
