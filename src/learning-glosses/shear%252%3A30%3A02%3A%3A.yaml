simpleMeaning: To lose shape under forces that pull its parts sideways past each other
scope: A thing losing shape under sideways force, not the bent shape itself, not cutting with shears,
  and not cutting wool from a sheep.
examples:
- The beam began to shear under the strain.
- The metal will shear if the force grows too great.
