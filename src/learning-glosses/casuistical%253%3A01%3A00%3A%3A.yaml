simpleMeaning: Of or about using rules of right and wrong to settle moral questions.
scope: Of or about using rules of right and wrong to settle moral questions, also called casuistic; not
  a view that ignores rules of right and wrong, and not a view about law.
examples:
- His casuistical reasoning tried to settle the moral question.
- A casuistical view weighs rules of right and wrong.
