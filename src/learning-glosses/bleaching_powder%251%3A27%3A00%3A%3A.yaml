simpleMeaning: To make things white and to kill germs, people use this white substance of calcium hydroxide,
  chloride and hypochlorite.
scope: Also called chloride of lime and chlorinated lime, this white substance is the one made of calcium
  hydroxide, chloride and hypochlorite, used to whiten things and kill germs.
examples:
- She used bleaching powder to make the cloth white.
- Bleaching powder kills germs and makes things white.
