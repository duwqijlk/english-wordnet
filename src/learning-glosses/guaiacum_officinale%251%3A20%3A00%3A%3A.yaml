scope: 'Also called lignum vitae: a small tree, green all year, of the Caribbean and Central and South
  America, valued for the hardest wood sold and for a healing resin; other small green trees of the region
  give softer wood or no healing resin.'
examples:
- The Guaiacum officinale in the garden gives wood so hard it dulls a saw.
- People once tapped Guaiacum officinale for its healing resin.
