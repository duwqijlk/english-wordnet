senseId: 'deoxidise%2:30:00::'
synsetId: 00238763-v
simpleMeaning: Give a compound more electrons, take its oxygen away, or make it join with hydrogen to
  form a hydrogen compound.
scope: This is also called reduce and deoxidize, and means taking oxygen out of a substance, not putting
  oxygen in.
examples:
- The chemist will deoxidise the rust to leave pure iron.
- Heat can deoxidise the metal by driving off its oxygen.
