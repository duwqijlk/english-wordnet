simpleMeaning: an end you look ahead to and mean to bring about, which guides the steps you plan to take
scope: The end you look ahead to, which guides your plans; also called purpose, design, aim, and intent,
  and not the act of meaning to do a thing.
examples:
- His intention was to provide a new translation.
- Good intentions are not enough on their own.
