simpleMeaning: A device that sends out signals to stop other signals from getting through
scope: A device that sends out signals to block other signals; not a radio set that picks up signals and
  not a device that makes signals clearer.
examples:
- The army used a jammer to block the enemy's radios.
- The jammer stopped the remote signal from reaching the plane.
