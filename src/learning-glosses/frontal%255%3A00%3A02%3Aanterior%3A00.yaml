simpleMeaning: of or next to the forehead or the bone in the forehead
scope: About or next to the forehead or its bone, not a cloth worn on the forehead, not a covering for
  the front of an altar, and not just belonging to the front part of something.
examples:
- The frontal lobes sit just behind the forehead.
- The doctor checked the frontal bone above her eyes.
