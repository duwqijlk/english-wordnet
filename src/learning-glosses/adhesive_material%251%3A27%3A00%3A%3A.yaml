simpleMeaning: a substance that sticks two sides together so they stay joined
scope: 'Also called adhesive and adhesive agent: a substance that sticks sides of things together, not
  sticky tape for wounds and not the grip of a tire on the road.'
examples:
- She put adhesive material on the broken handle and held it in place.
- The adhesive material joined the paper to the wood and kept it there.
