simpleMeaning: To push a thing out of its true shape until it sits crooked or at a sharp angle
scope: To push a thing out of its true shape; turn, twist, bend and flex are other names for this sense,
  not simply breaking a thing or changing its size.
examples:
- Heat can deform the plastic frame.
- The crash deformed the car's front end.
