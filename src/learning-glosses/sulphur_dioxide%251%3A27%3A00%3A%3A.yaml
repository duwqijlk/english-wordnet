simpleMeaning: a poisonous gas you cannot see, that comes out of volcanoes; factories use it to make many
  goods, and it is found in waste gases and brings on acid rain
scope: Also called sulfur dioxide; a poisonous gas from volcanoes and factory waste, not the waste itself
  and not the acid rain it brings on.
examples:
- Sulphur dioxide has no colour, but it can harm the lungs.
- Rain mixed with sulphur dioxide can turn acid.
