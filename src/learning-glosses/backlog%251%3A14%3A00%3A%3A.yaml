synsetId: 07970189-n
simpleMeaning: A large amount of jobs not done or materials not yet worked on, waiting to be dealt with,
  especially customer orders for products or services not yet filled
scope: This is the amount of work waiting to be dealt with, especially orders not yet filled, not the
  action of letting such work build up.
examples:
- The office had a huge backlog of letters waiting for an answer.
- After the holiday, a backlog of orders waited at the shop.
