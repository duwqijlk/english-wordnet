simpleMeaning: A tool used to find how far apart in the sky two stars are when they are too far apart
  to fit in the view of a common telescope
scope: This is a tool used to find how far apart in the sky two stars are, and not a tool that looks at
  stars close together or a tool that measures a star's brightness.
examples:
- The heliometer measured the gap between the two stars.
- With a heliometer, the stars' wide gap could be measured.
