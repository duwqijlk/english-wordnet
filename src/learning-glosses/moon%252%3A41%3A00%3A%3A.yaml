simpleMeaning: to pass time doing nothing, in a dull or dreamy way.
scope: This is about empty, purposeless idleness, not about the content of a fantasy or daydream.
examples:
- He mooned around the house all Sunday in his pajamas.
- The teenagers were mooning about in the park with nothing to do.
