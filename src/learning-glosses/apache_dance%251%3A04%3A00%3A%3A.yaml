simpleMeaning: In French music-hall shows, a member of the French underworld lends its name to this fast,
  rough stage act.
scope: This fast, rough stage act in French music-hall shows takes its name from a member of the French
  underworld, not from a real fight.
examples:
- The two actors performed an apache dance in the French show.
- Their apache dance was the fastest act in the French show.
