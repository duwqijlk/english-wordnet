simpleMeaning: Native Americans once used the soft fruit of this warm-climate tree as soap; the fruit
  holds saponin, a foamy stuff, and the tree keeps its leaves all year
scope: Also called chinaberry and jaboncillo, this is a warm-climate tree that keeps its leaves all year,
  not a true dogwood and not a plant grown only for soap.
examples:
- The false dogwood in the yard keeps its leaves all year round.
- Native Americans once washed with the false dogwood's pulpy fruit.
