simpleMeaning: The form of a word that names the thing a verb acts on
scope: The word form used for the thing a verb acts on, also called accusative and accusative case; not
  the form used for the doer of the action and not the form used for the thing something belongs to.
examples:
- In 'She saw him', him is in the objective case.
- The objective case shows that the noun is the thing acted on.
