simpleMeaning: one or more letters after a full stop at the end of a computer label, there only when the
  maker of the work wants it there
scope: 'Also called an extension and a file name extension: one or more letters after a full stop at the
  end of a computer label, not the main part of the label and not a word on its own.'
examples:
- The filename extension .TXT tells the computer the work is plain text.
- He left off the filename extension when he saved the work.
