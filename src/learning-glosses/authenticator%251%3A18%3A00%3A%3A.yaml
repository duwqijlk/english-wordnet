simpleMeaning: a person who checks whether something is real or true, such as a work of art, or who gives
  a firm promise that it is real
scope: 'Also called appraiser: a person who checks whether something is real or promises that it is, not
  a person who makes the thing and not a person who buys it.'
examples:
- The authenticator said the painting was a real Rembrandt.
- An authenticator checked the old letter before the sale.
