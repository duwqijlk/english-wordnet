simpleMeaning: asking questions about a thing and checking every part of it, step by step, until the truth
  comes out
scope: 'Also called investigation: the work of looking into something in a full, set order, not the act
  of asking a single question.'
examples:
- The police began investigating the fire after the first reports came in.
- Investigating the missing money took the team three months.
