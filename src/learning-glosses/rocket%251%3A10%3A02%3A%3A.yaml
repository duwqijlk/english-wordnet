simpleMeaning: A device that shoots bright light high in the sky, or shoots out a rope for saving lives
  or a long spear thrown into the water
scope: 'Also called skyrocket: this shoots bright light high in the sky, or shoots out a line to help
  save lives or a long spear. Not the engine itself and not the whole space vehicle.'
examples:
- At midnight, they fired a rocket that sent bright light high above the harbour.
- The crew used a rocket to shoot a rope to the sinking boat.
