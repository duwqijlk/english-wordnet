simpleMeaning: The vein of the gut and the vein of the spleen take blood from veins that drain it from
  the pancreas.
scope: Also called the pancreatic vein, these are the veins that drain blood from the pancreas, not the
  veins that bring blood into it.
examples:
- Blood leaves the pancreas through the venae pancreatica.
- The venae pancreatica empty into the vein of the gut and the vein of the spleen.
