simpleMeaning: said, most often of arrows that show size and direction, of two lines that run side by
  side but point in opposite ways
scope: It describes two lines that run side by side but point in opposite ways, most often arrows that
  show size and direction, not lines that point the same way, and not lines that cross.
examples:
- The two antiparallel forces pulled the door in opposite ways.
- Antiparallel vectors point in opposite ways though they run side by side.
