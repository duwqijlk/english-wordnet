simpleMeaning: With bunches of white flowers on bent branches that cross over each other, this bush of
  the southeast United States grows fast and keeps its leaves all year.
scope: This fast-growing bush with white flowers is also called dog hobble and dog laurel.
examples:
- Switch-ivy grows fast.
- The switch-ivy kept its leaves all year.
