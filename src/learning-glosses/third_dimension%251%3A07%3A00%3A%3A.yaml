simpleMeaning: The depth of a solid thing, the way in which it differs from a flat drawing of it
scope: This is the depth of a solid thing, the way it differs from a flat drawing; not its length and
  not its width.
examples:
- A solid has a third dimension that a flat drawing lacks.
- The third dimension is what gives a cube its depth.
