simpleMeaning: The set of rules used in buying and selling, drawn from the ways of traders rather than
  from the study of rules
scope: The set of rules for buying and selling, drawn from traders' ways; commercial law and law merchant
  are other names for this, not the rules of crime and not the rules of one firm.
examples:
- Mercantile law governs trade between firms.
- The dispute was settled under mercantile law.
