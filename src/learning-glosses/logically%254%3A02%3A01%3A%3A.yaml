senseId: 'logically%4:02:01::'
synsetId: 00365540-r
simpleMeaning: as clear step-by-step thinking shows, or in a way that fits what such thinking leads to
scope: This sense points to what clear thinking leads to, not just to a person doing or saying something
  in a clear, sensible way.
examples:
- Logically, if the bridge is closed, we must take the longer road.
- Logically, the missing key must be somewhere in this house.
