simpleMeaning: A tree from China and Manchuria that loses its leaves each year, smells of turpentine,
  and has attractive compound leaves that turn yellow in autumn and deeply grooved, corky bark.
scope: This Asian tree, not the prickly Australian coral tree that shares its name and not the cork oak.
examples:
- The cork tree is grown for its shapely leaves and yellow autumn colour.
- Scratch the bark of a cork tree and it gives off a turpentine smell.
