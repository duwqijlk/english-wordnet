senseId: 'motivation%1:03:00::'
synsetId: 00023953-n
simpleMeaning: What pushes a living thing to act toward a goal it wants, the reason behind what it does
  and the aim that guides it
scope: 'Also called need and motive: the inner push behind an action, not the act of giving someone that
  push and not the state of feeling pushed.'
examples:
- We did not understand his motivation for leaving.
- He acted with the best of motives.
