simpleMeaning: A well-liked growth that can be eaten, with a top the colour of liver or raw meat, is found
  in great numbers in the southeastern United States.
scope: This is a well-liked growth that can be eaten, with a top the colour of liver or raw meat; it is
  not a growth that cannot be eaten, and it grows in great numbers in the southeastern United States.
examples:
- They gathered beefsteak fungus because it is popular and good to eat.
- She sliced the beefsteak fungus and saw its top was the colour of raw meat.
