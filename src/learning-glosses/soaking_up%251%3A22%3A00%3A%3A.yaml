simpleMeaning: In chemistry, one stuff spreads through another when one stuff moves through a liquid or
  a solid, or is taken in by one
scope: It is also called absorption, the process in chemistry in which one stuff spreads through another.
examples:
- As the liquid spread through the solid, soaking up took place.
- The water spread through the cloth, and soaking up took place.
