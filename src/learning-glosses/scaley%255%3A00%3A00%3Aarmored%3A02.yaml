simpleMeaning: an animal that has thin hard plates over its body, over all of it or only part of it, like
  some fish and reptiles
scope: Also called scaled and scaly, this is an animal whose body is covered with thin hard plates; not
  smooth-skinned and not covered in fur or feathers.
examples:
- The scaley lizard's hard plates kept it safe from bites.
- Some fish are scaley, with thin plates covering most of their bodies.
