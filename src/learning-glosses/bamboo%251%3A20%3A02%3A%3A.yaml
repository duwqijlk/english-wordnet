simpleMeaning: the hard stems, like wood, of a grass plant; they are used for building, for making things
  by hand, and for fishing poles
scope: This is the hard stem material cut for use, not the living plant growing in the ground.
examples:
- The chairs were made from strong bamboo.
- He used a piece of bamboo to make a fishing pole.
