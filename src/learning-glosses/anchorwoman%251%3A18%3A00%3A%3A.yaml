simpleMeaning: A woman television reporter who puts together a show, using reports from several other
  reporters.
scope: A woman television reporter who puts together a show, using reports from several other reporters,
  not a woman reporter in the field and not a woman who reads the news alone.
examples:
- The anchorwoman opened the evening show.
- As anchorwoman, she linked the reports from the field.
