simpleMeaning: in animals that feed their young with milk, the hollow inside the belly, shut off from
  the chest by a sheet of muscle, where the main organs sit
scope: It is also called abdomen, the hollow inside the belly that holds the main organs.
examples:
- The surgeon opened the abdominal cavity.
- The scan showed the organs inside the abdominal cavity.
