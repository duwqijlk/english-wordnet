senseId: 'transcendentalism%1:09:00::'
synsetId: 06201921-n
simpleMeaning: A way of thinking that values what is felt inside and the spirit more than what the senses
  show or what is made of matter
scope: A way of thinking that values what is felt inside and the spirit more than what the senses show
  or what is made of matter; transcendental philosophy is another name for this sense. Not a way of thinking
  based only on what can be seen and measured, and not a religion.
examples:
- Transcendentalism shaped the writer's ideas about nature and the spirit.
- She read about transcendentalism in a book on American thought.
