simpleMeaning: A long line of Macedonian kings who ruled Egypt from 323 BC to 30 BC, begun by its first
  king and ended by Cleopatra.
scope: The ancient Macedonian kings of Egypt, from the first king to Cleopatra; also called Ptolemaic
  dynasty.
examples:
- Egypt was ruled by the line of Ptolemy for nearly three hundred years.
- The last of the Ptolemy kings was Cleopatra.
