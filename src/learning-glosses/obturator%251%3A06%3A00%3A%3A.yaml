senseId: 'obturator%1:06:00::'
synsetId: 03845847-n
simpleMeaning: A thing made to close a gap in the body, such as the gap in the roof of the mouth in a
  baby born with a split in it
scope: A thing made to close a gap in the body, not a cover that hides a wound and not a plug used to
  fill a hole in a machine.
examples:
- The dentist fitted an obturator to close the gap in the roof of her mouth.
- After the operation, he wore an obturator while the split in his palate healed.
