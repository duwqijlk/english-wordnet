simpleMeaning: Ways of working on the mind of the other side to break its will to keep going
scope: Ways of working on the mind to break the other side's will to keep going, also called war of nerves;
  not open fighting with guns, and not a single lie told to win a point.
examples:
- The general used psychological warfare to wear down the enemy's will to fight.
- Leaflets and false news were part of the psychological warfare aimed at the other side.
