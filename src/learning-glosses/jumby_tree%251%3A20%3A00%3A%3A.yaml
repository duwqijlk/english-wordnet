simpleMeaning: A small tree of the West Indies and northeastern Venezuela whose purple flowers grow in
  sprays above big pointed oblong leaflets; its seeds are black or scarlet with black spots.
scope: Another name for bead tree, the small tree with sprays of purple flowers; not a different species.
examples:
- A jumby tree stood at the edge of the village.
- Jumby trees carry seeds that are black or scarlet.
