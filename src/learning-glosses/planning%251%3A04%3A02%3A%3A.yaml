simpleMeaning: the act or process of working out in advance the steps and the arrangement of a project
  or business venture.
scope: This is not the carrying out of a project, and not a written document; it is the work of working
  out steps and arrangements beforehand.
examples:
- Good planning kept the building work on schedule.
- The planning of the new campus took two years.
