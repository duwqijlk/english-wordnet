simpleMeaning: a loosely hanging cord, rope, or cable
scope: This is a cord, rope or cable that hangs loosely, not coal dust, not soft wet low land, and not
  a word for careless work.
examples:
- He pulled in the slack before tying the boat to the post.
- Leave some slack in the rope so the gate can still open.
