simpleMeaning: To fill out a part in a piece from the 1600s or 1700s by adding the chords shown by a numbered
  bass line.
scope: About filling in a musical part with chords, not about becoming aware of something, and not about
  making something actually happen.
examples:
- The harpsichordist realized the bass line with tasteful chords.
- In this recording the bass line is realized on a lute.
