simpleMeaning: 'a very small unit for measuring weight: 1/7000 of a pound, or 64.799 milligrams, the same
  as the troy unit of the same name'
scope: This is a unit of weight set as 1/7000 of a pound; not a seed, not food, and not the unit of weight
  set as 1/60 of a dram.
examples:
- One grain is 1/7000 of a pound.
- The gold was weighed as ten grains.
