simpleMeaning: to hold something back so that it grows weaker
scope: 'Also called stifle: holding a feeling or urge back so it grows weaker, not making a picture less
  clear and not deadening a sound.'
examples:
- She tried to dampen her excitement before the meeting.
- He dampened his curiosity and said nothing.
