simpleMeaning: Its purple, pink or yellow flowers grow in long heads or loose clusters from the sides
  of the stem, on one of many kinds of plant of one group.
scope: This plant is one of many kinds of one group, and its purple, pink or yellow flowers grow in long
  heads or loose clusters from the sides of the stem.
examples:
- The coronilla's flowers grew in long heads from the sides of the stem.
- Coronilla opened its pink flowers in loose clusters.
