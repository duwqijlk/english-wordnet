simpleMeaning: a slippery liquid got from small sea fish, used mainly to help parts move smoothly and
  to make soap
scope: A slippery liquid from small sea fish, used mainly to help moving parts slide and to make soap,
  not a cooking oil and not oil from a whale.
examples:
- The mill used sardine oil to keep the gears turning smoothly.
- Sardine oil was once a common ingredient in soap.
