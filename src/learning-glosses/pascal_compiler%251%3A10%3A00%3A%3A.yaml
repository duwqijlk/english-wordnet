simpleMeaning: A program that changes programs written in that tongue into a form a computer can use.
scope: This word is for that tool, not for the programs it changes.
examples:
- The Pascal compiler turned my program into one the computer could run.
- She used a Pascal compiler to change the code into a form the computer could use.
