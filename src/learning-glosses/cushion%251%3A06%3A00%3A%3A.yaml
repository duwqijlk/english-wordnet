simpleMeaning: a soft bag filled with air or with soft material such as feathers or foam rubber
scope: This is a soft bag to sit or lean on, not a machine part that takes in sudden pushes and not the
  layer of air that holds up a vehicle that travels on air.
examples:
- She put a cushion behind her back.
- He sat on a thick cushion on the floor.
