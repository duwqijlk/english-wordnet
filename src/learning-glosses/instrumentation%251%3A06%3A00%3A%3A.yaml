simpleMeaning: a thing or tool made to help get a job done
scope: 'Also called means, and another name for instrumentality: this is a thing used to get something
  done, not the set of musical tools a written piece asks for and not the act of setting up such tools.'
examples:
- They used simple instrumentation to lift the heavy stone.
- His instrumentation was a set of tools made for the task.
