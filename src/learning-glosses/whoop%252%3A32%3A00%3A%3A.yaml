simpleMeaning: to shout loudly as if you are very happy or very excited
scope: This is the act of shouting loudly with joy, not the loud cry itself used as a noun.
examples:
- The children whooped when they were led to the picnic table.
- Fans whooped as their team scored the winning goal.
