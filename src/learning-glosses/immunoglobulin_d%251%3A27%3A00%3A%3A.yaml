simpleMeaning: In the clear part of blood, only a small amount of that kind of protein that fights sickness
  is found, and it is one of the five main kinds.
scope: Also called IgD, this is the kind of protein that fights sickness found only in a small amount
  in the clear part of the blood, not the kind that guards most of all against bacteria and not any other
  of the five kinds.
examples:
- Doctors found very little immunoglobulin D in the patient's blood serum.
- Immunoglobulin D is one of the five major classes of proteins that fight sickness.
