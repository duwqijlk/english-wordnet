simpleMeaning: a vehicle that flies through the air, has wings that do not move, and is driven by propellers
  or jets
scope: Also called a plane. This sense is the flying vehicle with wings that stay in place, not a helicopter
  and not the flat tool also called a plane.
examples:
- The airplane took off from the airport in the morning.
- We flew to the city by airplane and landed two hours later.
