simpleMeaning: a dining-room cupboard that stands to one side, fitted with shelves and drawers
scope: A piece of furniture with shelves and drawers at the side of a dining room; counter and buffet
  are other names for this, not a board fitted to a wagon.
examples:
- She laid the dishes on the sideboard.
- The sideboard stood against the dining-room wall.
