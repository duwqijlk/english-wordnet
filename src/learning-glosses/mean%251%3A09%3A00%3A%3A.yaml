simpleMeaning: an average of a set of values found by adding a function of those values and dividing by
  a function of how many values there are
scope: This is the statistical average, not the adjective meaning typical, cruel, or stingy, and not the
  verb meaning to intend or signify.
examples:
- The mean of 3, 8, and 10 is 7.
- We found the mean by adding the scores and dividing by the number of students.
