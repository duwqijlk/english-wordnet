senseId: 'dry_gangrene%1:26:00::'
synsetId: 14337088-n
simpleMeaning: In pathology, dead tissue that has lost its wetness and turned dark brown because the blood
  tubes that feed it are blocked
scope: It is also called cold gangrene, mumification necrosis, and mummification, dead tissue that has
  lost its wetness and turned dark brown when its blood tubes are blocked, not dead tissue that stays
  wet.
examples:
- The dry gangrene had left the tissue dry and dark brown.
- Blood tubes were blocked, and dry gangrene set in.
