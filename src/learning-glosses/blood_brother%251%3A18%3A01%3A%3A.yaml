simpleMeaning: a man who has promised, usually in a rite where the two mix their red liquid, to treat
  another man as a member of his own family
scope: A man bound by a solemn promise to treat another man as family, not a real brother by birth and
  not just a close friend.
examples:
- The two men became blood brothers after the ceremony.
- As his blood brother, he promised to stand by him always.
