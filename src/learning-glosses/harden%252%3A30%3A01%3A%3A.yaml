simpleMeaning: to make something hard, or harder than before
scope: This sense is about making something else hard, not about a thing itself becoming hard, not about
  getting used to hard conditions, and not about heating and cooling metal in oil.
examples:
- The cold weather hardened the soft ground.
- The heat of the fire will harden the clay pots.
