simpleMeaning: with no strength or power to work left at all, and too tired to do more
scope: 'Also called spent and gone: with no strength left at all, and too tired to do more, not just a
  little tired and not a thing that has run out of fuel.'
examples:
- The day's work left her exhausted.
- He went to bed exhausted after the long walk.
