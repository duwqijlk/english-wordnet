simpleMeaning: A fast-growing vine from eastern Asia with purple flowers and long hairy seed pods, grown
  as animal feed and for root starch, now common across the southern United States.
scope: This names the plant itself, the same plant called kudzu vine; it is not the starch taken from
  its roots, and not its long hairy pods.
examples:
- Kudzu grows so fast that it can cover an old field in a single summer.
- In the southern United States, kudzu often swallows fences and roadside signs.
