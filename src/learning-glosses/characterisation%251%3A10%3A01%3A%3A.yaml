simpleMeaning: the act of saying what makes a person or thing special and different from others, and what
  its most important parts are
scope: 'Also called characterization: saying what makes a person or thing special, not the act of playing
  a part in a story and not a list of facts about someone.'
examples:
- The media's characterisation of the singer as shy shaped how people saw her.
- Her characterisation of the town in the book showed its quiet streets and kind people.
