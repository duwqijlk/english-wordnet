senseId: 'mussitation%1:11:00::'
synsetId: 07401520-n
simpleMeaning: A low sound that goes on and on and is hard to make out, often with the lips moving but
  no clear words said.
scope: A low sound that goes on and is hard to make out, often with the lips moving but no clear words;
  mutter, murmur, muttering, murmuring and murmuration are other names for it, not a clear speech sound
  and not silence.
examples:
- A low mussitation rose from the crowd.
- He heard the mussitation of the old man in the corner.
