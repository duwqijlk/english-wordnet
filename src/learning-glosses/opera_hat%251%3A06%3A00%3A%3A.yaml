simpleMeaning: Men wear this tall head covering, most often with silk or beaver fur on the outside.
scope: Also called beaver, stovepipe, topper, dress hat, high hat, silk hat, and top hat, this is a man's
  tall head covering, most often with silk or beaver fur on the outside.
examples:
- A man wore an opera hat.
- The opera hat was made of silk.
