senseId: 'thimble%1:06:00::'
synsetId: 04430980-n
simpleMeaning: a small metal cap that keeps a finger safe while you sew, and that can also hold small
  things
scope: This is the small metal cap itself, used for sewing; it is not the small amount that such a cap
  can hold.
examples:
- She wore a thimble on her finger while she sewed the dress.
- He put the tiny screws in a thimble to keep them safe.
