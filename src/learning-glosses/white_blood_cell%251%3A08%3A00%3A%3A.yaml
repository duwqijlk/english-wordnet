simpleMeaning: tiny parts of the body that take in and break down germs and fungi, a key part of how the
  body fights off sickness
scope: 'Also called a leucocyte, a leukocyte, a white blood corpuscle, a white cell or a white corpuscle:
  tiny parts of the body that fight germs, not red blood cells and not germs themselves.'
examples:
- A white blood cell count tells the doctor how the body is fighting infection.
- The test showed more white blood cells than usual.
