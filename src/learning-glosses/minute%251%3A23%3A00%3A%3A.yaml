simpleMeaning: A unit for measuring angles, equal to one sixtieth of a degree.
scope: This is a measure of angle, not a unit of time or a written record of a meeting.
examples:
- The star lies two minutes of arc north of the pole.
- Each minute of arc is one sixtieth of a degree.
