senseId: 'yawl%1:06:01::'
synsetId: 04619861-n
simpleMeaning: A small boat carried on a ship, rowed most often by four or six oars.
scope: This sense is a ship's small boat, usually rowed by 4 or 6 oars, unlike the sense for a sailing
  ship with two masts, a small mizzen set aft of the rudderpost, and unlike the sense for letting out
  cries, long and loud.
examples:
- The yawl is a ship's small boat.
- Yawls are rowed by oars.
