simpleMeaning: 'like pitch or tar (thick black sticky stuff): thick, black and sticky'
scope: Also called pitchy and resinous. This describes a thing as thick, black and sticky, not the act
  of staying in a place longer than you planned.
examples:
- The old roof was covered in a tarry black layer that stuck to my shoes.
- His hands were tarry and black after he worked on the road.
