simpleMeaning: Sold under a trade name, this man-made copy of the body's pregnancy chemical is held in
  pills that stop pregnancy and treats womb lining growing out of place.
scope: Also called norethandrolone and norethindrone, this is the man-made copy of the body's pregnancy
  chemical sold under a trade name.
examples:
- The pill had norethindrone acetate in it.
- The treatment for womb lining growing out of place used norethindrone acetate.
