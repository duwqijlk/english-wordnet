simpleMeaning: a group of lines of electromagnetic radiation (energy waves, such as light) that run nearly
  side by side
scope: 'Also called beam: lines of energy waves travelling side by side; not a bone in a fish''s fin,
  not a small flower stem, and not the verb sense of spreading out.'
examples:
- A single ray of light shone through the hole in the wall.
- The machine sends out a thin ray that can cut metal.
