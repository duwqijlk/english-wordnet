simpleMeaning: a person who speaks with words given by God, and tells people what God wants them to do
scope: A person who speaks for God, not someone who merely tells what will happen next and not an ordinary
  preacher.
examples:
- The prophet told the people what God wanted them to do.
- The prophet said God had told him the people must change their ways.
