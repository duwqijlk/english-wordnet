simpleMeaning: In grammar, match another word in the way the language's rules require.
scope: This is the grammatical relation between words, not people holding the same opinion, not giving
  consent, not things being compatible or consistent with each other, not going well together, not being
  suitable, and not reaching harmony of opinion, feeling or purpose.
examples:
- In English, the verb must agree with its subject in number.
- In French, the adjective must agree with the noun it describes in gender and number.
