simpleMeaning: A slim insect with thin, delicate wings, living in water as a young one and on land as
  an adult, usually for less than two days.
scope: Also called a dayfly or a shadfly; a slim insect with thin, delicate wings, living in water as
  a young one and on land as an adult, not a fly that lives for weeks.
examples:
- A mayfly danced over the river at dusk.
- The mayfly lived only a day as an adult.
