simpleMeaning: The outer part of the hearing organ that can be seen from outside and is made of the flexible
  tissue called cartilage.
scope: This is the visible outer body part, not the whole organ of hearing, and not the seed head of a
  cereal plant.
examples:
- He wore a small gold ring in one ear.
- The freezing wind stung her ears as she walked.
