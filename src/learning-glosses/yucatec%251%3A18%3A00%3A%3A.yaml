scope: Also called Yucateco, this is a person of the Mayan people of the Yucatan peninsula in Mexico,
  not the language spoken by that people.
examples:
- A Yucatec farmer grows corn on the Yucatan peninsula.
- The Yucatec have lived in Mexico for many centuries.
