simpleMeaning: In pathology, an unusual increase of body tissue, such as a lump or tumor.
scope: This is an abnormal tissue mass, not the biological development of an organism, not a progression
  from simpler to more complex forms, not a process of becoming larger or more numerous, not vegetation
  that has sprung up, not a gradual beginning or coming forth, and not something that has grown.
examples:
- The scan revealed a growth on her lung that the doctors wanted to test.
- Surgeons removed the growth and sent it to the lab for examination.
