simpleMeaning: In medieval England, a piece of land the lord of the manor gave to a peasant in return
  for farm work, which the peasant held and worked
scope: A piece of land a peasant held from the lord of the manor in medieval England in return for farm
  work; not a piece of land owned outright or a modern rented farm.
examples:
- The peasant's copyhold passed to his son when he died.
- Records show the family held the copyhold in return for farm work.
