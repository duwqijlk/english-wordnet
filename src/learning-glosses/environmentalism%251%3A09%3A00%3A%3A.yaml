simpleMeaning: The idea that where and how a person grows up matters more than what they are born with
  for how their mind grows.
scope: The idea that upbringing matters more than birth for how the mind grows, not the work of protecting
  the world around us.
examples:
- Environmentalism holds that a child's surroundings shape the mind more than birth does.
- He wrote in support of environmentalism, arguing that schooling matters most.
