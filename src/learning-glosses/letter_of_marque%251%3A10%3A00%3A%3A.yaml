simpleMeaning: Seizing ships and goods that belong to another country is allowed for a private person
  who holds this written paper from a government
scope: 'Also called a letter of mark and reprisal and letters of marque: a written paper that lets a private
  person take ships of another country, not a note sent by post and not a permit to trade.'
examples:
- The captain held a letter of marque that let him seize enemy ships.
- With a letter of marque, the privateer took the merchant vessel and its cargo.
