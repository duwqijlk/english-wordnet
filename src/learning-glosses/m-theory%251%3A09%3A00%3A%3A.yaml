simpleMeaning: In particle physics, an idea that pictures a universe with eleven dimensions in which the
  weak and strong forces and gravity are one, and to which all string ideas belong.
scope: In particle physics, an idea of an eleven-dimension universe that joins the weak and strong forces
  with gravity, not one string idea alone and not an idea of one force only.
examples:
- M-theory pictures a universe with eleven dimensions.
- Physicists use M-theory to join gravity with the other forces.
