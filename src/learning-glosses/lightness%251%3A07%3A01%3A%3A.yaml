simpleMeaning: how bright and dark parts look in a painting or a photo, and the feel this gives
scope: Also called light; about how a picture shows brightness, not a light heart and not a light colour.
examples:
- He could paint the lightest light and the darkest dark in the same scene.
- The lightness of the morning scene made the whole painting feel warm.
