simpleMeaning: In shady places in Europe grows a thin plant, grown also in the northeast of America and
  in mild parts of Asia
scope: It is a thin plant of the shady places of Europe, not a plant of sunny open ground, and it is also
  grown in the northeast of America and in mild parts of Asia.
examples:
- Wood meadowgrass grew in the shade.
- The wood meadowgrass grew in northeastern America.
