simpleMeaning: A lung infection caught by breathing in dust carrying the bacterium that causes a serious
  illness in animals; chills, cough and breathlessness give way to a collapse of the circulation.
scope: This is the lung form of anthrax, also called inhalation or pulmonary anthrax, not the skin form
  that starts with a sore.
examples:
- Anthrax pneumonia can follow breathing in dust from contaminated animal hides.
- Doctors confirmed anthrax pneumonia after the patient's sudden collapse.
