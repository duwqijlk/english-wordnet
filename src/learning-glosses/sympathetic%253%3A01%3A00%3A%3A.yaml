simpleMeaning: about or connected with one part of the system of nerves in the body
scope: About the sympathetic nervous system, one part of the body's system of nerves. This is not the
  kind, understanding sense, not feeling for another person's trouble, and not shaking that spreads from
  a nearby body.
examples:
- The lesson was about sympathetic neurons and how they work in the body.
- Doctors studied sympathetic activity in the nerves after the shock.
