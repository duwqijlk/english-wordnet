simpleMeaning: thickly covered with dirt or soot that has sunk deep in and will not come off
scope: 'Also called dingy, grimy, grubby, grungy and raunchy: covered thick with dirt or soot that has
  sunk deep in, not just dusty on the surface and not stained by one spill.'
examples:
- The miner's begrimed face was black with coal dust.
- She wiped her begrimed hands on an old rag.
