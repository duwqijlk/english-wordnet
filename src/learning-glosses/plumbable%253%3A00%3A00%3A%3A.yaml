synsetId: 00998091-a
simpleMeaning: Able to be measured for depth with a line that has a weight at its end
scope: Able to be measured for depth with a line that has a weight at its end; also called fathomable;
  not a depth too deep to measure and not a depth that can only be guessed.
examples:
- The harbour was plumbable all the way to the pier.
- They found the lake plumbable with a long line.
