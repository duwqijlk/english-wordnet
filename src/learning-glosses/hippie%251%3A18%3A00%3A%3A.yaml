senseId: 'hippie%1:18:00::'
synsetId: 10196106-n
simpleMeaning: a person who turns away from the ways most people live, and speaks up for very free ideas
  about politics and the way to live
scope: Someone who rejects the usual way of life and argues for very free ideas, not just a person who
  dresses in an unusual way.
examples:
- The hippie left the city to live simply in the country.
- As a hippie, he spoke against the old rules and for a freer way of life.
