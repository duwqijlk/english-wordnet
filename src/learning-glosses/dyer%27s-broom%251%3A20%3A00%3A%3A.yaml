simpleMeaning: Yellow flowers in bunches give a dye from this small bush of Europe and Asia, often a weed
  in Britain and the United States and at times grown for show.
scope: People also call it whin, dyer's greenweed, dyeweed, greenweed, woadwaxen, and woodwaxen; the names
  all mark one small bush of Europe and Asia, known by its bunches of yellow flowers that give a dye and
  its weed growth in Britain and the United States.
examples:
- The yellow flowers of dyer's-broom give a dye.
- Dyer's-broom grows as a weed in Britain and the United States.
