simpleMeaning: a long-lasting form of spine disease, mostly in men, that makes the spine stiff and hard
  to move, and sometimes makes the spine grow stiff and fixed
scope: Also called ankylosing spondylitis; a spine disease, not a short attack of back pain and not arthritis
  of the hands.
examples:
- His rheumatoid spondylitis made it hard for him to bend his back.
- Rheumatoid spondylitis left her spine stiff for years.
