simpleMeaning: Of or like a set of rules and first ideas that people take as true without proof, as in
  a kind of communism built on such rules
scope: Of or like a set of rules taken as true without proof, not a set of rules that must be proved first.
examples:
- She held a canonist view of the rules, taking them as true without proof.
- The canonist communism of the group rested on rules taken as true.
