scope: A person whose hair is a pale silvery colour, often coloured that way on purpose; platinum blonde
  is another name for this sense, and this is not golden hair or grey hair.
examples:
- She became a platinum blond after dyeing her hair pale silver.
- The platinum blond wore her pale silvery hair loose.
