simpleMeaning: Clothes in the latest styles are made and sold by the people and firms in this trade.
scope: The trade that makes and sells fashionable clothes, also called apparel industry, fashion business,
  fashion industry and rag trade, not a single shop and not the making of cloth.
examples:
- The garment industry employs thousands of workers in the city.
- New styles spread fast through the garment industry.
