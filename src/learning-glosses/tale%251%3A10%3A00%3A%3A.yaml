simpleMeaning: an account that tells in detail what happened, given in writing, in a play or film, or
  on radio or television
scope: 'Also called story: this is the account itself in writing, a play, a film, or a broadcast, not
  a lie and not a short talk in conversation.'
examples:
- The tale tells in detail how the village was built long ago.
- Her new tale, printed in a book, tells of a long trip by sea.
