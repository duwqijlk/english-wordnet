simpleMeaning: Its broad beak, shaped like a clog, belongs to a large bird like a stork from the valley
  of the White Nile.
scope: Shoebird is another name for this large stork-like bird from the valley of the White Nile.
examples:
- The shoebill's broad beak looked like a wooden clog.
- The shoebill lives in the valley of the White Nile.
