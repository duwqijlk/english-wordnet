simpleMeaning: A piece of writing that copies or twists someone's way of writing, usually to make people
  laugh.
scope: A piece of writing that copies or twists someone's way of writing, usually to make people laugh;
  mockery, parody, takeoff, travesty, burlesque, spoof and pasquinade are other names for this sense,
  not a fair review, and not a piece that praises someone.
examples:
- The magazine printed a lampoon of the mayor's speeches.
- His lampoon of the poet's style made the whole class laugh.
