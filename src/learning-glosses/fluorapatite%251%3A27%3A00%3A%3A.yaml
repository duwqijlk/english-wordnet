simpleMeaning: a mineral found in rocks, of the kind called apatite, with more fluorine in it than chlorine
scope: A mineral of the apatite kind with more fluorine than chlorine in it, not a mineral with more chlorine
  and not a pure fluorine crystal.
examples:
- Fluorapatite is the mineral that gives tooth enamel its hardness.
- The geologist found fluorapatite in the rock sample from the mine.
