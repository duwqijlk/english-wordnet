simpleMeaning: A sky-watching machine that lines up the waves from two dishes to see more clearly, instead
  of using one curved dish
scope: A sky-watching machine using two dishes; not a single-dish machine, and not a light telescope.
examples:
- The radio interferometer links two dishes far apart.
- A radio interferometer can see fine detail in the sky.
