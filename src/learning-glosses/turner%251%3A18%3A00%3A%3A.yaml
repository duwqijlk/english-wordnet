simpleMeaning: One of the two people who turn the ropes while others jump over them in jump rope.
scope: One of the two people turning the ropes in jump rope, not a kitchen tool with a flat, bendy part
  and a long handle, used for turning or serving food.
examples:
- As a turner, they swung one end of the rope while a friend swung the other.
- The two turners kept the rope moving while the jumper skipped.
