simpleMeaning: A bag made of animal hide and used for holding liquids.
scope: A bag made of animal hide for holding liquids; not the body's protective covering or sense organ,
  not a thin outer layer, not an animal's living body covering, not a person's life, not a shaven-headed
  group member, not just any bald or shaven-headed person, not a fruit or vegetable peel, and not any
  verb use (climbing awkwardly, grazing or injuring a surface, stripping tree bark, or removing a hide).
examples:
- He filled the skin at the spring and slung it over his shoulder.
- The shepherd carried a skin of water across the desert.
