simpleMeaning: A way, often marked out, for getting over a road or a railway from one side to the other
scope: A marked way over a road or railway, not a place where two roads meet and not a shallow place in
  a stream where you can walk over.
examples:
- Use the crossing to get over the road safely.
- The crossing over the railway was closed for repairs.
