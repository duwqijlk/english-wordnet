simpleMeaning: To make a living thing or a substance quick to feel rays of energy, most of all light
scope: 'Also called photosensitize: making a living thing or a substance easy to change by rays of energy,
  most of all light, not the chemical action of light and not harm to the eye from the sun.'
examples:
- The dye can photosensitise the skin, so sunlight changes it more easily.
- The chemical photosensitises the film so that light can change it.
