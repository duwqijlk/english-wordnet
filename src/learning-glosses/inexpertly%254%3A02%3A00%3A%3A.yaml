synsetId: 00275957-r
simpleMeaning: In a rough way, done by someone with no skill or training.
scope: In a rough way that shows no skill, also called crudely and artlessly; not merely in a plain or
  simple way.
examples:
- The shed was inexpertly built, and it leaked in the rain.
- He inexpertly carved the wood, leaving rough edges everywhere.
