simpleMeaning: a wall of stone or hard grey building material that runs from the shore out into the water
  to stop the beach being washed away
scope: A wall of stone or hard grey building material that runs from the shore out into the water to stop
  the beach being washed away; groin and mole are other names for this sense, and it is not a small landing
  place for boats.
examples:
- The jetty stopped the waves from washing the beach away.
- Sand had built up behind the jetty after the storm.
