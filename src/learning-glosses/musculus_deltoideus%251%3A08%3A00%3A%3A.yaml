simpleMeaning: This big muscle shaped like a triangle covers the shoulder joint; it lifts the arm away
  from the body, bends it, stretches it out, and turns it.
scope: Also called deltoid and deltoid muscle, it is a big muscle shaped like a triangle that covers the
  shoulder joint.
examples:
- The musculus deltoideus lifts the arm out to the side.
- He felt a pull in his musculus deltoideus after throwing the ball.
