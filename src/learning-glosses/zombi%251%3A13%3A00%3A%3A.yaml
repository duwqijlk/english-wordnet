simpleMeaning: a strong drink made from several kinds of rum mixed with fruit juice, and usually with
  apricot liqueur, a sweet strong drink
scope: Also called zombie; a rum drink, not a god, not a dead body brought back to life, and not a person
  who acts like a machine.
examples:
- He ordered a zombi at the bar.
- The zombi was sweet with fruit juice.
