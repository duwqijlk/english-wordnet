senseId: 'confidentially%4:02:01::'
synsetId: 00170623-r
simpleMeaning: in a way that is private and meant not to be told to others
scope: Said or done in private, and meant not to be told to others. It is not said openly for all to hear,
  and not just in a close, friendly way.
examples:
- She told me confidentially that she was leaving her job.
- He spoke confidentially to the doctor about his health.
