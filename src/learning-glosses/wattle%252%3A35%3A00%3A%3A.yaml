simpleMeaning: to weave thin branches in and out between upright sticks to make a fence
scope: This is weaving thin branches between upright sticks to make a fence; it is not the finished fence
  itself, not the fold of skin on a bird, and not the wider sense of building with this material.
examples:
- They wattled thin branches between the posts to make a garden fence.
- He learned to wattle thin branches between upright sticks to make a fence.
