simpleMeaning: To heat ores or fine metal dust until the bits stick together in one solid lump, without
  melting them
scope: To join loose ore or fine metal dust into one solid lump by heat alone, not by melting; not the
  heating of clay to make it hard, and not the melting of metal to pour it.
examples:
- Workers sinter the iron dust into solid blocks before it goes to the furnace.
- The powder must sinter slowly so the pieces hold together.
