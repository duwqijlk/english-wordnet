simpleMeaning: a path, often marked, where people can cross a street or a railway to get to the other
  side
scope: Also called crossing and crossover. This is a path for going across a street or railway, not the
  act of going across.
examples:
- Use the crosswalk to get to the other side of the street.
- Cars must stop when people are in the crosswalk.
