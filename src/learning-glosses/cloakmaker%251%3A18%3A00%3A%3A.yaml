simpleMeaning: a person whose job is to make or mend clothes made of animal fur
scope: 'Also called a furrier: a person who makes or mends fur clothes, not a person who makes ordinary
  cloth clothes.'
examples:
- The cloakmaker stitched a new fur coat for the winter.
- She took her old fur coat to the cloakmaker for repair.
