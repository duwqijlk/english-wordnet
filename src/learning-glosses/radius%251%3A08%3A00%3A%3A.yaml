simpleMeaning: the outer bone in the lower arm, between the elbow and the hand, which is a little shorter
  than the other bone there
scope: This is a bone in the lower arm. It is not the length from the center of a circle to its outer
  edge, and not a part of a wheel.
examples:
- He broke his radius when he fell on his hand.
- The doctor took an X-ray of her radius and her wrist.
