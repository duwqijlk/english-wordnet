simpleMeaning: A piece of furniture, a cupboard with doors, shelves, and drawers, made to hold things
  in it or to put them on show
scope: A cupboard-like piece of furniture, not a locked store for clothes and not a group of government
  advisers.
examples:
- She put the plates in the cabinet.
- The cabinet in the hall holds books and cups.
