simpleMeaning: A condition in which pain or unease is felt in an arm or leg that has been cut off.
scope: A condition in which pain or unease is felt in an arm or leg that has been cut off; not pain in
  a limb that is still there and not a wound.
examples:
- He felt pain from phantom limb syndrome for months after his leg was cut off.
- Phantom limb syndrome made her reach for a foot that was no longer there.
