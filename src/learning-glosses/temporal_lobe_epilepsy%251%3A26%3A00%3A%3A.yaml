simpleMeaning: epilepsy with fits that take away awareness and memory of them; arms and legs often move
  on purpose, and sometimes the person sees or hears things that are not there
scope: 'Also called psychomotor epilepsy: a kind of epilepsy with fits that take away awareness and memory,
  not a fit that shakes the whole body and not a brief faint.'
examples:
- During temporal lobe epilepsy she kept moving her arms as if on purpose, then could not recall it.
- He had temporal lobe epilepsy and sometimes heard voices that were not there.
