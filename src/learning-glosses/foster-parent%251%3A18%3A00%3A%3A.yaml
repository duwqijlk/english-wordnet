senseId: 'foster-parent%1:18:00::'
synsetId: 10126521-n
simpleMeaning: a grown-up who looks after a child and acts as its mother or father, without taking the
  child as their own by law
scope: This is a grown-up who cares for a child in place of its birth parents, without adopting it by
  law; foster parent is another name for it, not a birth parent or a legal adopter.
examples:
- The foster-parent took the boy to school each day.
- She became a foster-parent to two sisters.
