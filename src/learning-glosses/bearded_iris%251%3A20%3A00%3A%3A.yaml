simpleMeaning: On the drooping lower petals of these flowers grow hair-like growths; they are any of many
  wild or garden flowers of this kind.
scope: This is one of many wild or garden flowers of this kind, set apart by the hair-like growths on
  the drooping lower petals.
examples:
- The bearded iris in the garden showed fine hairs on its drooping lower petals.
- A wild bearded iris opened its drooping petals, each with fine hairs.
