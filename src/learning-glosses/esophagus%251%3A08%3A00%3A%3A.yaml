simpleMeaning: the tube in the body that takes food from the back of the mouth down to the stomach
scope: The tube that takes food down to the stomach, also called gullet and gorge. It is not the stomach
  itself and not the tube for air.
examples:
- Food goes down the esophagus to the stomach.
- The doctor looked at his esophagus with a small camera.
