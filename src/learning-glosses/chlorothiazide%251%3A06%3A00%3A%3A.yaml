simpleMeaning: a drug that makes the body pass more water, sold as Diuril, used to treat swelling and
  high blood pressure
scope: A drug that makes the body pass more water and is used to treat swelling and high blood pressure,
  not a decongestant and not a painkiller.
examples:
- The doctor gave her chlorothiazide for her high blood pressure.
- Chlorothiazide helped bring down the swelling in his legs.
