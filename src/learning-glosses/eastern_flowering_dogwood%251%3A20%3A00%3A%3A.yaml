simpleMeaning: Much admired for large white or pink leaf-like covers and striking autumn colours, this
  tree loses its leaves in the cold months and bears red berries after them.
scope: Also called common white dogwood, it is much admired for its large white or pink leaf-like covers
  and striking autumn colours, and it bears red berries.
examples:
- The eastern flowering dogwood outside the house is full of white bracts.
- In autumn, the eastern flowering dogwood shows striking colours and bears red berries.
