simpleMeaning: not being able to think clearly, so that ideas have no clear shape
scope: A confused mind with no clear ideas, not the cloud that blocks sight and not the water drops near
  the ground.
examples:
- He was in a fog after the long night with no sleep.
- The news left her in a fog for the rest of the day.
