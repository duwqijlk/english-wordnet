simpleMeaning: The power to get something done, or to bring about a result
scope: 'Also called effectiveness, effectuality, and effectualness: the power to get a result, not the
  speed of an act and not how easily a person is stirred up.'
examples:
- The effectivity of the new drug surprised the doctors.
- We judged the plan by its effectivity.
