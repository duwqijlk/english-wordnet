simpleMeaning: to eat and enjoy a large, special meal with other people
scope: To eat at a large special meal, not the meal itself and not giving such a meal for other people.
examples:
- The guests feasted on roast meat and fresh bread late into the night.
- We will feast together to mark the end of the harvest.
