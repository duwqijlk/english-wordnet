  a fine spray
scope: This is the liquid medicine for a spray device, not the faint spot on the eye and not the huge
  cloud of gas in space.
examples:
- The nurse put the nebula into the atomizer for the patient.
- He breathed in the nebula as a fine spray from the small device.
