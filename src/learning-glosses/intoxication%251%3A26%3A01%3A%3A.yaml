senseId: 'intoxication%1:26:01::'
synsetId: 14533314-n
simpleMeaning: the state of the body when a poison or another harmful thing gets inside it and makes it
  work badly
scope: Also called poisoning, this is the body state caused by a poison or harmful thing; it is not being
  drunk on alcohol and not the strong happy feeling of excitement.
examples:
- The doctor treated his intoxication after he ate the bad mushrooms.
- Intoxication from the gas made her feel sick and weak.
