synsetId: 07234838-n
simpleMeaning: A written account of what a check of a sick person's health found
scope: A written account of the findings of a health check on a patient; not the patient's own account
  of past illness and not the work of healing itself.
examples:
- The medical report showed that his heart was sound.
- She waited for the medical report after her check.
