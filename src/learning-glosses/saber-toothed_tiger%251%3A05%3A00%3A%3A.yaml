simpleMeaning: With long upper fangs like swords, this big cat of the Old and New Worlds is one of many
  kinds, all now gone, from the Oligocene through the Pleistocene.
scope: This extinct big cat is one of many kinds with long sword-like upper fangs, and is also called
  a sabertooth, not a living big cat.
examples:
- The saber-toothed tiger lived in the Old and New Worlds.
- Saber-toothed tigers vanished long ago.
