simpleMeaning: In computer science, a set of coded orders made to move data around, change it, or take
  parts of it away.
scope: 'Also called editor: in computer science, a set of coded orders made to move data around, change
  it, or take parts of it away, not a word list and not a machine.'
examples:
- I opened the editor program to fix the file.
- The editor program lets you move text around.
