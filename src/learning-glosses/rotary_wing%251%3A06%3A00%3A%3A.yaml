simpleMeaning: a long thin flat part that spins round and lifts a helicopter into the air
scope: 'Also called a rotor blade: a spinning part that lifts a helicopter, not a fixed wing of a plane
  and not the tail part that keeps it steady.'
examples:
- The rotary wing spun faster as the helicopter rose from the field.
- A crack in the rotary wing kept the helicopter on the ground.
