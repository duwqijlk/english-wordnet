senseId: 'whole_life_insurance%1:21:00::'
synsetId: 13368962-n
simpleMeaning: a plan that pays a set sum when the person named in it dies, with the same amount paid
  each year until that person's death
scope: 'Also called ordinary life insurance and straight life insurance: a plan that pays a set sum on
  the death of the person named, not a plan that ends after a set number of years and not health cover.'
examples:
- He bought whole life insurance so his family would get a set sum when he died.
- Her whole life insurance costs the same amount every year.
