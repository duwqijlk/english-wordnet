simpleMeaning: a picture or other work that shows something by drawing or painting or in a like way
scope: This sense, also called portrayal and also called delineation, is a picture made by drawing or
  painting; it is not just the outline drawing of a shape and not a description in words.
examples:
- The book has a depiction of the old town drawn in soft colours.
- Her depiction of the horse was done in paint on wood.
