simpleMeaning: In psychoanalysis, the part of the self that holds a picture of the best a person can be,
  which the person tries to reach.
scope: In psychoanalysis, the part of the self that holds a picture of the best a person can be, not the
  whole self and not a dream.
examples:
- His ego ideal pushed him to do better.
- The ego ideal is the best self she hopes to reach.
