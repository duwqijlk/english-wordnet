simpleMeaning: Dry goods were measured in this old Hebrew unit, which holds about as much as a bushel
scope: 'Also called epha: an old Hebrew measure for dry goods, not a measure for liquids and not a modern
  unit.'
examples:
- The merchant measured out an ephah of wheat for the buyer.
- In the old law, an ephah was the measure used for flour.
