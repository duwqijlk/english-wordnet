simpleMeaning: a condition where the heart's muscles tighten at a rate that is not normal
scope: A heart whose muscles tighten at the wrong speed; not a normal fast heart beat after hard exercise
  and not pain in the chest.
examples:
- The test showed an arrhythmia, so the doctor gave her medicine for her heart.
- His arrhythmia makes his heart beat too fast at times.
