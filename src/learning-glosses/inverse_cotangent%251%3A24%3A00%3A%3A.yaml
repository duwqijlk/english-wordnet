simpleMeaning: in maths, the angle that goes with a given number, found by undoing the ratio of the near
  side to the far side of a right-angled triangle
scope: In maths, the angle that goes with a given number, found by undoing the cotangent, also called
  arc cotangent or arccotangent; not the cotangent itself and not the inverse tangent.
examples:
- The inverse cotangent of 1 is 45 degrees.
- Use the inverse cotangent to find the angle.
