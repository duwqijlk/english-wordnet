senseId: 'endemical%3:00:00::'
synsetId: 01430630-a
simpleMeaning: Of or about an illness, or something like an illness, that is always found, more or less,
  in one place
scope: This describes an illness, or something like an illness, that is always found, more or less, in
  one place; endemic is another name for it, not an illness that strikes once and not an illness found
  everywhere.
examples:
- Diseases endemical to the tropics strike there year after year.
- Food shortages are endemical in certain parts of the world.
