simpleMeaning: Through a thin tube, this narrow hollow space joins the fourth hollow space; it lies in
  the middle of the brain, below the band that joins its two halves.
scope: A narrow hollow space in the middle of the brain, below the band joining its halves; the fourth
  ventricle is the next space it joins.
examples:
- The third ventricle lies below the band joining the two halves of the brain.
- Fluid runs from the third ventricle into the fourth ventricle.
