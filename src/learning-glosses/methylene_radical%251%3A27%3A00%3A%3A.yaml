simpleMeaning: A part of a molecule, CH2, with two free links, that comes from methane.
scope: A part of a molecule, CH2, with two free links, that comes from methane, also called methylene
  or a methylene group; not the part with one free link and not the whole methane molecule.
examples:
- A methylene radical is the CH2 part that comes from methane.
- The methylene radical has two free links.
