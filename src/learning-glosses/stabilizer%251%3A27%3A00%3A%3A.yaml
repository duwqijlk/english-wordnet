simpleMeaning: A chemical put into a liquid, a mix, or a mix with bits floating in it, to keep it steady
  and not changing.
scope: A chemical put into a liquid, a mix, or a mix with bits floating in it, to keep it steady and not
  changing; not a wing part that keeps a plane steady.
examples:
- They added a stabilizer to the mix to keep it from changing.
- The stabilizer kept the liquid steady for months.
