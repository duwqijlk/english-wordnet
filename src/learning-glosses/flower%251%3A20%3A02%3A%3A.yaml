simpleMeaning: the seed-forming part of a plant that keeps its seeds inside fruit, especially one with
  showy or colorful parts.
scope: It is the bloom itself, not the whole plant grown for its blossoms, not the peak period of success,
  and not the verb meaning to produce blossoms.
examples:
- The flower opened its bright yellow petals in the morning sun.
- Bees moved from flower to flower, gathering pollen.
