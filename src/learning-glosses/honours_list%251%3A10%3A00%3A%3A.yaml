simpleMeaning: A set of names put out by examiners, grouping students by the grade they won in their degree
  tests
scope: A set of names put out by examiners, grouping students by the grade they won in their degree tests,
  also called a class list; not a roll of all who passed, and not a single student's mark.
examples:
- Her name stood at the top of the honours list.
- The honours list grouped the students by the class they had won.
