simpleMeaning: the outer layer of the cerebrum (the large main part of the brain), made of nerve cells
  (cells that carry messages) without a fatty covering, also called grey matter
scope: 'This sense is also called cerebral cortex, cerebral mantle, and pallium: the outer layer of the
  brain; it is not the outer layer of another organ or plant part and not the layer around the lens of
  the eye.'
examples:
- The cortex helps us think and remember.
- Damage to the cortex can change how a person speaks.
