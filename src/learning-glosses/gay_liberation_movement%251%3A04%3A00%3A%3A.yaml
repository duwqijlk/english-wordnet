simpleMeaning: a group effort to win freedom for people who love people of the same sex from unfair laws,
  unfair treatment by people, and unfair treatment in earning a living
scope: 'Another name for gay lib: a movement to free people who love people of the same sex from unfair
  laws and treatment, not a single law and not a social club.'
examples:
- The gay liberation movement fought for equal rights.
- He marched with the gay liberation movement in the 1970s.
