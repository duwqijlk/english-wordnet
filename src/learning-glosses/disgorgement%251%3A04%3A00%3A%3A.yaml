simpleMeaning: what is in the stomach coming back up and out of the mouth, moved by the body on its own
scope: The body on its own pushing what is in the stomach back up and out through the mouth, also called
  emesis, puking, regurgitation, vomit or vomiting, and not the act of swallowing food or coughing.
examples:
- The disgorgement began within minutes of the meal and left him weak.
- Doctors watched for any disgorgement after the patient took the drug.
