simpleMeaning: Huge fan-like fins on its chest let this tropical gurnard glide under water, and it is
  no kin of the searobin.
scope: This fish is also called a flying robin and a butterflyfish, and it glides under water on huge
  fan-like fins, not through the air like a flying fish.
examples:
- The flying gurnard spread its huge fins and glided under the water.
- A flying gurnard glided under the water on its huge fins.
