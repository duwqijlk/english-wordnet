simpleMeaning: a fixed bowl joined to water pipes that people sit on to pass urine and solid waste from
  the body
scope: 'Also called can, pot, throne and toilet: a fixed bowl for passing waste, not solid waste itself
  and not a tree stump.'
examples:
- The plumber fixed the stool in the small bathroom.
- The old stool would not flush, so we called for help.
