simpleMeaning: about or connected with a group of people born and living around the same time
scope: This describes people of one age group; it is not about making power and not about one person's
  life alone.
examples:
- There is a generational gap between grandparents and teenagers in how they use phones.
- Generational differences in music taste are clear in our family.
