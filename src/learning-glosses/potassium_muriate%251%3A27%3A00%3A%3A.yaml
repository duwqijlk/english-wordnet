senseId: 'potassium_muriate%1:27:00::'
synsetId: 14885193-n
simpleMeaning: A potassium salt with the formula KCl, sold under several brand names and taken as tablets
  to treat low potassium levels.
scope: Another name for this compound is potassium chloride, and it is also called potash muriate; it
  is a potassium salt, not table salt or another salt such as potassium citrate.
examples:
- The old formula listed potassium muriate as its active ingredient.
- He took potassium muriate tablets after a blood test showed low potassium.
