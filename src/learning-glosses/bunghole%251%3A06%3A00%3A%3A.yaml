simpleMeaning: a hole in a barrel or cask, used to fill it or to take out what is inside
scope: A hole for filling or emptying a barrel or cask; not the rude slang sense of the same word for
  the anus.
examples:
- He poured the wine in through the bunghole.
- She opened the bunghole to let the beer out of the barrel.
