simpleMeaning: any of several tools for gripping things, usually with two hinged legs, handles above and
  sharp hooks below
scope: Any of several tools for gripping things, usually with two hinged arms, handles above and sharp
  hooks below; tongs is another name for this sense, and it is not a single hook or a pair of scissors.
examples:
- She picked up the hot coal with a pair of tongs.
- The pair of tongs has two hinged legs and sharp hooks.
