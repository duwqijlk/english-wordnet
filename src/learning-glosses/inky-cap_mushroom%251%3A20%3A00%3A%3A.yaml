simpleMeaning: A fungus whose top melts into dark liquid after its tiny dust-like spores have grown ripe.
scope: A fungus whose top melts into dark liquid after its tiny dust-like spores have grown ripe, also
  called inky cap; not a fungus with a firm top and not a fungus that stays whole when old.
examples:
- The inky-cap mushroom melted into dark liquid overnight.
- By morning, the inky-cap mushroom had melted into a dark puddle.
