simpleMeaning: Honey mixed with water, which turns into mead, a drink made from honey, when it is left
  to ferment
scope: Honey mixed with water, not plain honey and not wine; it becomes mead when it ferments.
examples:
- They drank hydromel at the feast.
- The beekeeper made hydromel from honey and water.
