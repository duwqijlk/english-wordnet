simpleMeaning: The use of taxes or limits on goods brought in from abroad to shield a country's own industries
  from outside competition.
scope: This is a trade policy of taxes and import limits, not the general act of keeping someone safe
  and not money paid to criminals for safety.
examples:
- He argued that protection was needed to keep the country's shipyards alive.
- Trade protection helped the local mills survive the flood of cheap imports.
