simpleMeaning: a blue stuff with clear cut shapes, made from copper sulfate joined with water
scope: 'Also called blue copperas, blue stone and blue vitriol: a blue water-bearing form of copper sulfate,
  not another blue copper mineral and not a dry form of copper sulfate.'
examples:
- The chalcanthite in the tray was bright blue and full of small clear shapes.
- We found chalcanthite near the old copper mine.
