simpleMeaning: a large oval place with rows of seats that go up, where people watch contests and shows
scope: Also called amphitheatre and coliseum; this is a large building for contests and shows, not just
  a sloping area with seats inside a theatre or a room.
examples:
- Thousands of people sat in the amphitheater to watch the contest.
- The old stone amphitheater still holds shows in summer.
