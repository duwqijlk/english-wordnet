simpleMeaning: To say yes to a thing, clearing it for use.
scope: Also called clear and authorize, to say yes to a thing and clear it for use, not to give a person
  power or authority of their own.
examples:
- The head teacher authorised the trip.
- Only the manager can authorise such spending.
