simpleMeaning: Any hard substance that does not wear away or change in air or water.
scope: A hard substance that does not wear away or change in air or water, not a substance that rusts
  and not a substance that burns.
examples:
- Gold is a noble metal, so it keeps its shine for years.
- The makers chose a noble metal for the part that meets sea water.
