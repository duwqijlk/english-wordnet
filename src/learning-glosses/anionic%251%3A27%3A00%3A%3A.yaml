simpleMeaning: These man-made cleaning stuffs work in water without their tiny bits ever splitting into
  charged parts.
scope: Also called anionic detergent and non-ionic detergent, this word is used of man-made cleaning stuffs
  that work in water without splitting into charged parts.
examples:
- The anionic cleaner washed the dishes without its tiny bits splitting into charged parts.
- The anionic cleaner went into the wash water with the clothes.
