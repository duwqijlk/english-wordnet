simpleMeaning: the parts that are in the body and do its work, all together, most of all the parts in
  the belly
scope: The inner organs of the body all together, also called insides, and not the outer parts of the
  body.
examples:
- The hunter cleaned the entrails from the deer.
- Entrails are the soft organs inside the belly.
