simpleMeaning: A cord in the head carries signals from the back of the eye, where light is caught, to
  the brain
scope: 'Also called optic nerve and optic tract: the cord from the eye to the brain, not the eye itself
  and not the part of the brain that sees.'
examples:
- The nervus opticus carries signals from the retina to the brain.
- Damage to the nervus opticus can make a person blind in one eye.
