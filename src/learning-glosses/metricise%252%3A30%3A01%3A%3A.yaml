simpleMeaning: To put a length, weight, or amount into metres, grams, litres, or like units
scope: To put a measure into metres, grams, or litres, also called metricize; not the other sense of changing
  from old units to these units.
examples:
- Please metricise these measures for the report.
- The class learned to metricise lengths and weights.
