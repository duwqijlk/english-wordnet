simpleMeaning: someone who puts fresh energy, life, and spirit into other people
scope: A person who gives others fresh energy and spirit, also called an energiser, an energizer, and
  a vitaliser; not someone who only encourages others with words.
examples:
- The vitalizer of the group, she kept everyone's spirits high.
- He acted as a vitalizer, bringing new life to the tired team.
