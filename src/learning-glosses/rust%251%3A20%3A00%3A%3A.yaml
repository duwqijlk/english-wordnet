simpleMeaning: any of several kinds of tiny living things (fungi) that grow on plants and make them ill
scope: The tiny living things themselves that make plants ill, not the disease they cause and not the
  red or brown layer on iron or steel.
examples:
- This rust is a tiny living thing that grows on wheat leaves.
- The farmer studied the rust that was harming his rose plants.
