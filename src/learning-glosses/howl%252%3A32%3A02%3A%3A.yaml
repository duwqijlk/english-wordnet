simpleMeaning: to cry out in a loud voice for a long time
scope: 'Also called roar or wail: to cry out loud for a long time with the voice, not to make a loud noise
  like wind or water, and not a noun for a sound.'
examples:
- The baby howled all night and would not sleep.
- He howled in pain after he hurt his leg.
