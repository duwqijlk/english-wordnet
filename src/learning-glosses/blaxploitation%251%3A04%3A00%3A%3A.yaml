senseId: 'blaxploitation%1:04:00::'
synsetId: 00420328-n
simpleMeaning: the unfair use of Black people to make money, especially in films that give them the same
  set roles based on fixed ideas about them
scope: The unfair use of Black people for gain, most of all in films with the same set roles; not just
  any film with Black actors in it.
examples:
- Critics called the old crime film blaxploitation because its Black actors were given only set, narrow
  roles.
- Blaxploitation made money from Black audiences while giving Black actors few kinds of roles to play.
