simpleMeaning: a person whose work is to find customers for women who sell sex
scope: Also called a pimp (a ponce in England), a procurer, a pandar, and a panderer; this names the person,
  not the act of finding sex partners for others.
examples:
- The pander brought new customers to the women late at night.
- Police arrested the pander who found customers for the women.
