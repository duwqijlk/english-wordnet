simpleMeaning: to catch the small sea animal that lives in a fan-shaped shell and is eaten as food
scope: Catching this sea animal for food; not the animal itself, and not cutting an edge into a row of
  small curves.
examples:
- The men scallop in the bay during the winter months.
- They scalloped off the coast every morning at low tide.
