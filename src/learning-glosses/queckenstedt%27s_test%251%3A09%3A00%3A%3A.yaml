simpleMeaning: A check that shows whether the narrow tube around the spine is blocked.
scope: This check looks only for a block in the tube around the spine, and it shows if the tube is blocked
  or clear.
examples:
- The doctor ordered a Queckenstedt's test to look for a block in the spinal canal.
- A Queckenstedt's test can show a blockage in the spine.
