simpleMeaning: the act of breaking something so badly that it is destroyed
scope: 'Also called ruin, ruining, ruination and laying waste: the act of destroying something, not the
  broken state that is left after it is destroyed.'
examples:
- The wrecking of the old bridge took several days.
- They planned the wrecking of the building to make room for a new one.
