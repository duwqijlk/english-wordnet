simpleMeaning: Wild or mean acts that make others uneasy or annoyed.
scope: 'Also called mischief, shenanigan, devilry, devilment, roguery, roguishness, deviltry, and mischievousness:
  wild or mean acts that make others uneasy or annoyed, not harmless play and not a single rude word.'
examples:
- His mischief-making kept the whole class on edge.
- Mischief-making is not the same as honest fun.
