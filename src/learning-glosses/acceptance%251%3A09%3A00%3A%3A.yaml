simpleMeaning: the mind's way of holding a thing as true and worth believing
scope: The mind's way of holding a thing as true, not warm approval of a plan and not saying yes to an
  offer in law.
examples:
- His acceptance of the old tale showed how much he trusted it.
- The acceptance of the new theory came slowly.
