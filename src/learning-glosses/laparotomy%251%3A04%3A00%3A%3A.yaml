simpleMeaning: A cut made by a surgeon through the wall of the belly, often to look at the organs inside
scope: This is a cut made by a surgeon through the wall of the belly, often to look at the organs inside,
  not a cut to remove an organ and not a small keyhole cut.
examples:
- The surgeon did a laparotomy to find the cause of the pain.
- A laparotomy let the doctors look at the organs inside her belly.
