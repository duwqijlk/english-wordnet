simpleMeaning: A stretch of a gene's DNA, in a living thing whose cells have a nucleus, that is not used
  to make a protein.
scope: A stretch of a gene's DNA that is not used to make a protein, not an exon, the part of a gene that
  does make a protein.
examples:
- The intron was cut out before the gene made its protein.
- Scientists removed the intron from the copied gene.
