simpleMeaning: A tight cap made of wool that covers the whole head but not the face
scope: This is a warm wool cap that covers the whole head and leaves the face open, not a cap that sits
  only on top of the head.
examples:
- He wore a balaclava to keep warm in the cold wind.
- She pulled her balaclava down over her ears before going out in the snow.
