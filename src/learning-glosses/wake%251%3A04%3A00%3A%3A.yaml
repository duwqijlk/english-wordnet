simpleMeaning: a night-time watch kept beside a dead body before it is buried.
scope: This is the night watch over a dead body, not the waves left behind a boat and not the verb meaning
  to stir up feelings.
examples:
- The family held a wake for him in the front room.
- Friends came to the wake and told stories about her.
