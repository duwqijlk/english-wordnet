simpleMeaning: to put a mark on mail that shows the date and time it was sent
scope: Marking mail with a date and time mark, not speaking in a direct way, not the sausage, and not
  letting a person or thing pass checks.
examples:
- The post office franked the letter before sending it on.
- Each parcel was franked with the date it was posted.
