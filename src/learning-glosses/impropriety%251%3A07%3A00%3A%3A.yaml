senseId: 'impropriety%1:07:00::'
synsetId: 04908503-n
simpleMeaning: A way of carrying oneself that breaks the rules of good behaviour.
scope: A way of carrying oneself that breaks the rules of good behaviour, not a single act that offends
  against what is proper and not the state of being improper.
examples:
- Her impropriety of manner made the older guests turn away.
- There was an impropriety in the way he spoke to the chairwoman.
