senseId: 'shoestring_fungus%1:20:00::'
synsetId: 13252576-n
simpleMeaning: a growth of the group Armillaria that makes brown string-like threads and rots the roots
  of trees such as apples or maples
scope: A tree-root rot from thread-making growths, not a mushroom picked to eat and not a mould on food.
examples:
- The shoestring fungus had rotted the roots of the old apple tree.
- Gardeners dread the shoestring fungus because it kills maples from the roots up.
