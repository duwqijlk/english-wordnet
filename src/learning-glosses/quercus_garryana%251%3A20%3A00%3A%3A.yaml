simpleMeaning: A small oak of west North America that loses its leaves in winter, with bent branches and
  pale grey bark.
scope: Also called Garry oak, Oregon oak and Oregon white oak; a small oak of west North America with
  bent branches, not a tall straight oak and not an oak of the east.
examples:
- Quercus garryana stands alone on the dry slope, its branches bent by the wind.
- The pale grey bark of Quercus garryana peels in thin strips.
