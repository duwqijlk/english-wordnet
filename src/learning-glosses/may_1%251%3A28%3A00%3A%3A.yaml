simpleMeaning: The first day of the fifth month, kept in many lands to mark the coming of summer, and
  in Russia and lands near it to honour work.
scope: 'Also called First of May and May Day: the first day of the fifth month, kept in many lands to
  mark the coming of summer and in Russia and lands near it to honour work, not the first day of any other
  month.'
examples:
- May 1 is a holiday in many countries.
- On May 1 workers march in Russia.
