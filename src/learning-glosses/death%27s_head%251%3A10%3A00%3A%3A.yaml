simpleMeaning: a human skull, or a picture of one, used as a sign that a life has ended
scope: This is a skull or a picture of a skull used as a sign of dying, not a real skull studied by doctors
  and not a picture of a whole body.
examples:
- A death's head was carved on the old tombstone.
- The flag bore a death's head to warn of danger.
