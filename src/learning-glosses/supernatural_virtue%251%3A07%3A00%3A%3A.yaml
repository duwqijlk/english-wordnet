simpleMeaning: In Christian teaching, one of three good ways of living — faith, hope, and love for others
  — given by God to complete the good ways people have by nature
scope: This is one of the three God-given good ways of living in Christian teaching, also called theological
  virtue, not a natural good way of living and not a bad act.
examples:
- Faith is one of the three supernatural virtues in Christian teaching.
- The priest spoke about hope as a supernatural virtue given by God.
