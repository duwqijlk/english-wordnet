simpleMeaning: Blue-black berries follow bunches of yellow flowers on this showy shrub of the Pacific
  coast of North America, green all year, with dark green feathery leaves.
scope: 'Also called holly-leaves barberry and hollygrape: a showy shrub of the Pacific coast of North
  America, green all year, with dark green feathery leaves, yellow flowers in bunches, and blue-black
  berries.'
examples:
- Mountain grape grows along the Pacific coast with dark green leaves.
- The mountain grape had yellow flowers and blue-black berries.
