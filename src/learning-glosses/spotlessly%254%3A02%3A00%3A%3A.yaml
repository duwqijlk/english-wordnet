simpleMeaning: in a way that is completely clean, with no dirty marks at all
scope: In a completely clean way, with no dirty marks. This describes how clean something is or how it
  is cleaned, not a clean place or thing itself.
examples:
- The house was spotlessly clean after the morning's work.
- She kept the kitchen spotlessly clean while she cooked.
