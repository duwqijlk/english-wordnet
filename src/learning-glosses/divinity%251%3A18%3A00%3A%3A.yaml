simpleMeaning: a being with power above nature that people pray to, that controls part of the world or
  part of life, or that stands for a force
scope: 'Also called god, immortal, or deity: this is a being people pray to, not a sweet white food, not
  the study of religion, and not the quality of being a god.'
examples:
- In the old story, the divinity of the sea could calm the waves.
- People built a temple for the divinity who watched over farming.
