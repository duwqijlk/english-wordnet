simpleMeaning: a long, thick piece of wood, metal, concrete or another material like them, used in building
scope: A long, thick bar used in building; not the narrow bar women gymnasts move on, not a line of light,
  and not the width of a ship.
examples:
- A heavy wooden beam holds up the roof of the old house.
- The workers lifted a long steel beam into place.
