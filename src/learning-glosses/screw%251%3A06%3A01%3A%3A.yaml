simpleMeaning: A set of several slanted blades that spin round and push against water or air
scope: This is the spinning blades that push against water or air, not the fastener and not the act of
  turning one tight.
examples:
- The screw at the back of the boat spun faster as we sped up.
- A damaged screw left the plane unable to fly.
