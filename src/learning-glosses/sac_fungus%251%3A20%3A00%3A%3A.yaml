simpleMeaning: any of a group of growths whose tiny seed-like parts form in a bag-like pouch
scope: A kind of growth whose seed-like parts form in a pouch, not a mushroom with a cap and not a mould
  that spreads on food.
examples:
- The sac fungus grew on the fallen log after the rain.
- We found a sac fungus on the damp wood, with its spores held in sacs.
