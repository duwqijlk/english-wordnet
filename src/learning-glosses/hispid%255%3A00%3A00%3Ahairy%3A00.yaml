simpleMeaning: Stiff, rough hairs or bristles cover an animal or a plant of this kind
scope: For an animal or plant with stiff, rough hairs; not for one with soft fur or smooth skin.
examples:
- The hispid stems of the plant pricked my hand.
- The hispid leaves felt rough to the touch.
