simpleMeaning: a usually medium-to-large butterfly from a large, widely distributed family, with bright
  wings and shrunken front legs that do nothing and stay tucked against the chest.
scope: Another name for the same medium-to-large butterfly group also called nymphalid, brush-footed butterfly
  or four-footed butterfly, not a moth or a skipper.
examples:
- A nymphalid butterfly such as a tortoiseshell often basks with its wings open.
- The nymphalid butterfly's front legs are too small to walk on.
