simpleMeaning: the act of giving someone a formal, legal right or official permission to do something
scope: 'Also called authorization and authorisation: a formal act that gives a legal right or official
  permission, not just a feeling of having more power or control in life.'
examples:
- The empowerment of local councils to approve building plans came from the new law.
- His empowerment as an officer came from a written order signed by the judge.
