senseId: 'erythroblastosis_fetalis%1:26:00::'
synsetId: 14188030-n
simpleMeaning: 'Severe newborn anemia from Rh conflict: usually an Rh-negative mother''s antibodies destroy
  her baby''s Rh-positive red cells inherited from the father. Found before birth by testing fluid around
  the baby.'
scope: This is the newborn blood disease caused by an Rh mismatch between mother and baby, not sickle-cell
  disease or other inherited anemias, and not Rh blood grouping itself.
examples:
- Doctors tested the mother's blood early in pregnancy to make sure her baby would not develop erythroblastosis
  fetalis.
- Erythroblastosis fetalis can be treated by giving the newborn a transfusion of healthy red blood cells.
