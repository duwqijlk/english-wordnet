simpleMeaning: A brightly coloured sea animal shaped like an eel, with no scales, from the cold Arctic
  seas.
scope: A brightly coloured sea animal with no scales from the cold Arctic seas; not a medical doctor,
  and not a scaly sea animal.
examples:
- The fish doctor flashed its bright colours in the cold water.
- Divers spotted a fish doctor near the Arctic rocks.
