scope: This is a soft, dark brown, sticky juice from rockroses used in perfumes, also called ladanum,
  not a flower oil and not a scent on its own.
examples:
- Labdanum gives the perfume a warm, lasting scent.
- The perfumer added labdanum to fix the scent.
