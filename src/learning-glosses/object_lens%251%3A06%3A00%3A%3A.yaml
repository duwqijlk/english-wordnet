simpleMeaning: A clear disc, or a set of them, stands at the front of a telescope or microscope, closer
  to what is being looked at than any other part.
scope: Also called objective, object glass, and objective lens, this is the clear disc, or set of discs,
  that a telescope or microscope sets nearest what is being looked at.
examples:
- The object lens faces the thing being looked at.
- Light reaches the object lens before any other part.
