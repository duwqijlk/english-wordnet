simpleMeaning: To examine a person, place, or thing closely and thoroughly.
scope: 'Transitive verb sense: the object is the person or place being examined. Distinct from search%2:35:00
  (trying to locate or discover something), search%2:39:00 (going to seek something), search%2:31:00 (inquiring
  into a matter), search%1:04:00 (the everyday act of looking thoroughly), search%1:04:02 (an investigation
  that seeks answers), search%1:22:00 (a computing operation testing items for a property), search%1:09:00
  (weighing rival hypotheses), and especially search%1:04:01 (the maritime boarding and inspection of
  a ship).'
examples:
- The guards searched every bag before the concert.
- Police searched the suspect and found the stolen coins.
