simpleMeaning: In linguistics, a noun's quality of being treated as lifeless or non-sentient in some languages,
  which changes its word endings and the verb forms used with it.
scope: A grammatical property of nouns in languages that classify things as animate or inanimate; not
  the everyday fact of being dead or lifeless, and not a philosophical claim about matter.
examples:
- In languages that mark inanimacy, a noun such as 'table' takes different endings from a word for a person.
- Her paper examines how inanimacy affects verb agreement in Algonquian languages.
