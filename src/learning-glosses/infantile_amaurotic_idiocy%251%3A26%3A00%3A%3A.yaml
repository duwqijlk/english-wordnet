simpleMeaning: An inherited disorder of fat metabolism, most common in Jews of eastern European descent,
  in which fatty substances build up in nerve tissue and cause death in early childhood.
scope: This is the historical name for Tay-Sachs disease, a fatal inherited disorder of fat metabolism.
  The name is dated and offensive and is no longer used by doctors; it does not refer to a general childhood
  brain disease.
examples:
- Old textbooks describe Tay-Sachs disease as infantile amaurotic idiocy.
- Doctors once called the condition infantile amaurotic idiocy, but the term has fallen out of use.
