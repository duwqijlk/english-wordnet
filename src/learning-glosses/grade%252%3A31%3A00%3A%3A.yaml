simpleMeaning: to sort something into a class based on its quality
scope: This is putting things into quality classes, as inspectors do with beef, eggs, or grain; it is
  not marking a student's work or rating things against one another.
examples:
- Inspectors grade the beef before it reaches the market.
- The fruit is graded by quality before it is packed.
