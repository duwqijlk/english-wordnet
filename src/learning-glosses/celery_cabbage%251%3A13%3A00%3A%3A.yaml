simpleMeaning: a long head of crisp stalks like those of a common salad plant and light green leaves
scope: A long head of crisp stalks like those of a common salad plant and light green leaves, not the
  whole plant it grows on and not a round head of cabbage.
examples:
- She sliced the celery cabbage and added it to the stir-fry.
- The celery cabbage in the market had long crisp stalks and light green leaves.
