simpleMeaning: Small meat-eating pouched animals of Australia and Tasmania that are active at night.
scope: Small meat-eating pouched animals of Australia and Tasmania, active at night; dasyurid is another
  name for this sense, not a dasyure and not a possum.
examples:
- The dasyurid marsupial hunts small animals at night.
- Dasyurid marsupials live in Australia and Tasmania.
