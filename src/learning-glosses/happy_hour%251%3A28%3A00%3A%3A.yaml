simpleMeaning: At one time of day, a bar cuts the price of drinks with alcohol
scope: A set time when drinks cost less in a bar, not a party at home and not a meal deal.
examples:
- The happy hour at the pub starts at five.
- We met for happy hour after work and paid less for our drinks.
