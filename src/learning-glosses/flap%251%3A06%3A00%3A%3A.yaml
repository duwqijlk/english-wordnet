simpleMeaning: a wide, thin covering that bends easily, is joined at one edge, and hangs loose or sticks
  out freely
scope: This is a loose covering joined at one edge, not the moving part on a plane wing and not a piece
  of body tissue.
examples:
- He wrote his name on the flap of the envelope.
- The flap on the tent hung loose in the wind.
