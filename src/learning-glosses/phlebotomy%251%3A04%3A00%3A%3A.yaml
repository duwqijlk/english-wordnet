simpleMeaning: To treat hemochromatosis, a sickness in which the blood holds too much iron, a vein is
  cut open by surgery
scope: A cut into a vein made by surgery to treat too much iron in the blood, not a blood test and not
  the giving of blood.
examples:
- The doctor ordered phlebotomy to lower the iron in his blood.
- Phlebotomy is done with a needle put into a vein in the arm.
