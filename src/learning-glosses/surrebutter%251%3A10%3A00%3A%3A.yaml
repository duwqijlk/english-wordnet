senseId: 'surrebutter%1:10:00::'
synsetId: 06575631-n
simpleMeaning: In law, a written plea from the person who brought the case, given in answer to the other
  side's rebutter
scope: This is a court paper from the person who brought the case, also called surrebuttal; not a paper
  from the defendant and not the opening paper in a case.
examples:
- The surrebutter was filed in answer to the defendant's reply.
- His surrebutter set out the plaintiff's answer to the defence.
