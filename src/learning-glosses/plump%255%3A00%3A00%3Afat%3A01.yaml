simpleMeaning: fat enough to have a full, round shape that looks pleasant
scope: 'Also called chubby: fat enough to look full and round in a pleasant way. It is not the verb sense,
  to make a person or animal fat.'
examples:
- The baby has plump cheeks and a happy smile.
- She is a plump woman with a kind, round face.
