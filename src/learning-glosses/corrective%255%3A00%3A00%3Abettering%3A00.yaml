simpleMeaning: meant to fix something that is wrong and bring it back to a normal state, or to work against
  something bad
scope: Used for steps or things that fix a problem or stop something bad from growing; not the act of
  fixing itself, and not a punishment.
examples:
- The school took corrective action after the report came out.
- He wears corrective lenses so he can read small print.
