simpleMeaning: a student nobody thinks much of, laughed at for showing off or for studying all the time
  in a dull way
scope: 'Also called grind, nerd, swot and wonk: a student others laugh at and think little of, not just
  any student who studies hard.'
examples:
- The other boys called him a dweeb for reading in every free minute.
- She felt like a dweeb when they laughed at her for showing off her marks.
