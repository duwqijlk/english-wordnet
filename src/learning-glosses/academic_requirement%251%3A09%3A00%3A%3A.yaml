simpleMeaning: A thing a student must do or have to get into a course of study or to finish it
scope: This is a rule for entry or finishing a course of study, not a degree and not a gown worn by teachers.
examples:
- The academic requirement for entry was a pass in maths.
- She met every academic requirement before she finished the course.
