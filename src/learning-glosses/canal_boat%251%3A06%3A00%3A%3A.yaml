simpleMeaning: a long craft that carries goods and is slim enough to pass along narrow man-made waterways
scope: 'Also called a narrow boat or a narrowboat: a long freight craft built for canals, not a wide river
  barge and not a small pleasure boat.'
examples:
- A canal boat loaded with coal passed slowly under the bridge.
- They hired a canal boat for a week and steered it through the locks.
