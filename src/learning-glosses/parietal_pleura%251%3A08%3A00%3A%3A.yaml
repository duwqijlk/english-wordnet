simpleMeaning: the skin that lines the inside of the chest and covers the sheet of muscle below the lungs
scope: The skin that lines the inside of the chest, not the skin that covers the lungs themselves.
examples:
- The parietal pleura lines the chest wall.
- Fluid can build up between the parietal pleura and the lung.
