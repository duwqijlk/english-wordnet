simpleMeaning: A name the Union men gave to men on the other side in the Civil War; those men were also
  called greyback, from their grey dress.
scope: A nickname for a Southern soldier in the Civil War, also called greyback, Rebel, Johnny Reb and
  Reb; not a man's first name in general.
examples:
- The Yankees called the prisoner Johnny.
- Johnny was the name the Northern soldiers used for the enemy.
