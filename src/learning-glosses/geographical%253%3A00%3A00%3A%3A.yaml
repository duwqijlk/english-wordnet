simpleMeaning: set by facts about places on the earth, such as where a place is and what its land and
  water are like
scope: Also called geographic. This is about something set by where places are on the earth, not about
  the study of the earth and its places.
examples:
- The geographical poles are fixed points at the top and bottom of the earth.
- Geographical distance kept the two towns far apart.
