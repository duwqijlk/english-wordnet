simpleMeaning: A plant that lives for years and grows in a flat ring of leaves, with tight bunches of
  white flowers; found in Europe.
scope: 'Also called meadow saxifrage or fair-maids-of-France: a plant with a flat ring of leaves and tight
  bunches of white flowers, found in Europe, not a tall shrub and not a plant with single flowers.'
examples:
- Saxifraga granulata grows in a flat ring of leaves.
- In spring, Saxifraga granulata shows tight bunches of white flowers.
