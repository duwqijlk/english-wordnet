simpleMeaning: a long-necked river bird of Europe, Asia, Africa and the Americas with long middle tail
  feathers
scope: 'Also called pintail: a long-necked river bird with long middle tail feathers, not a sea bird and
  not a short-tailed river bird.'
examples:
- A pin-tailed duck swam across the river at dawn.
- We saw pin-tailed ducks with their long middle feathers trailing.
