simpleMeaning: 'Any plant of a tropical African and Asian genus: a long-lived climbing herb with tendrils
  at its leaf tips, striking yellow, red or purple flowers, and entirely poisonous parts.'
scope: This is the climbing, poisonous tropical plant also called gloriosa and glory lily; it is not a
  garden lily grown for cut flowers.
examples:
- The creeping lily scrambled up the trellis, its yellow flowers opening one by one.
- Gardeners were warned never to eat the creeping lily, since every part of it is toxic.
