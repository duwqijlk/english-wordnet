simpleMeaning: A sickness of the tiny air bags in the lungs, caused by breathing in dust from sugar cane
scope: A lung sickness caused by breathing in sugar-cane dust, not a lung sickness from other dusts and
  not a cold; bagassosis is another name for it.
examples:
- The worker's bagascosis came from years of breathing sugar-cane dust.
- Bagascosis made him cough whenever he worked near the cane.
