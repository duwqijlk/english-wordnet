senseId: 'doubletree%1:06:00::'
synsetId: 03233068-n
simpleMeaning: Two horses pull side by side from this bar on a wagon or carriage, to which two smaller
  bars are fixed.
scope: It is the bar on a wagon or carriage from which two smaller bars hang, so two horses can pull side
  by side, and not the smaller bars themselves.
examples:
- The two horses pulled from the doubletree.
- He fixed a new doubletree to the wagon.
