simpleMeaning: A sailing tool used to measure how deep a stretch of water is, by sound waves or radio
  waves
scope: A sailing tool that measures how deep water is, not a tool that measures the depth of holes and
  not a map.
examples:
- The depth finder showed ten metres of water below the boat.
- She watched the depth finder as they entered the bay.
