simpleMeaning: In the Roman Catholic Church, one of seven set times for prayer
scope: One of seven set times for prayer in the Roman Catholic Church, not a time on a clock for a meeting
  and not a holy day of the year.
examples:
- The monks kept the canonical hour of morning prayer.
- Bells rang for the canonical hour at noon.
