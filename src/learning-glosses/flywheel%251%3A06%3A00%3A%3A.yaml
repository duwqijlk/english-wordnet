simpleMeaning: a heavy wheel that stores energy from movement and keeps an engine whose parts move back
  and forth running in a smooth, even way
scope: This is the heavy wheel in an engine that keeps it running evenly; it is not a bicycle part that
  lets a wheel turn on its own.
examples:
- The flywheel kept the old engine running smoothly between each push of its parts.
- A crack in the flywheel made the machine shake and stop.
