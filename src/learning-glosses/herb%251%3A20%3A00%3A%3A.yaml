simpleMeaning: A plant with a soft stem, not hard wood that lasts; many are garden plants with flowers
  or plants cooked for food; some can help sick people; some are pests
scope: This is a plant in the wide sense, not only the cooking sense where the plant is used to add taste
  to food.
examples:
- This herb has soft stems and small flowers, and it grows new each spring.
- Many herbs are grown in gardens, and a few can become pests in fields.
