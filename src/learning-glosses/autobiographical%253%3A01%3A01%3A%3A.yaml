simpleMeaning: about or like a person who writes the story of his or her own life
scope: About a person who writes the story of their own life, or like that person; not the sense about
  a book that tells the writer's own life story.
examples:
- His autobiographical urge led him to write about his own life from childhood on.
- The author's autobiographical habits shaped every book she wrote.
