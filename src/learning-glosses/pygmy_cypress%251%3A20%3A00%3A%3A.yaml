simpleMeaning: A rare small tree from the north of California, sometimes thought to be the same kind as
  the gowen tree
scope: A rare small tree from the north of California, sometimes thought to be the same kind as the gowen
  tree, and not a tree found in many other places.
examples:
- We saw a pygmy cypress on the hillside in northern California.
- The pygmy cypress is one of the rarest trees in the state.
