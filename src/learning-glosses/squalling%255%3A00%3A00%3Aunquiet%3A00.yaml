simpleMeaning: marked by short times of loud noise and busy, confused activity
scope: 'Also called squally: having short spells of loud noise and confusion, not quiet and calm, and
  not just windy weather.'
examples:
- The house had a squalling morning, with short bursts of shouting and banging, then quiet again.
- It was a squalling day at the fair, full of brief spells of loud noise and rushing about.
