simpleMeaning: Named as one of the deadly sins, a shameful hunger for wealth that nothing can fill.
scope: Also called greed, avarice, covetousness and avaritia, this shameful hunger for wealth that nothing
  can fill is counted as one of the deadly sins.
examples:
- His rapacity was never filled, no matter how much wealth he gained.
- His rapacity made him want more wealth than he could ever hold.
