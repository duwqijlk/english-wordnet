simpleMeaning: Made smooth and bright by rubbing, or as if by rubbing, and sending back light with a soft
  shine
scope: 'Also called bright, shining, shiny and burnished: smooth and bright with light coming back off
  the surface, not just clean and not lit up from inside.'
examples:
- She brushed her hair until it fell in lustrous waves.
- The lustrous wood table shone after he rubbed it with oil.
