simpleMeaning: a living thing that feeds on dead plant and animal matter, especially a fungus or a bacterium
scope: A living thing that lives off dead matter; saprophyte is another name for this sense. Not a plant
  that makes its own food, and not an animal that hunts live prey.
examples:
- The saprophytic organism broke down the fallen leaves on the forest floor.
- Many saprophytic organisms live on dead wood and help it rot away.
