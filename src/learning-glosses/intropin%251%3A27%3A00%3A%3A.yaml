simpleMeaning: A brain chemical that carries signals between nerves, needed for the brain to work normally;
  as a drug, sold as Dopastat, it treats shock and low blood pressure
scope: A brain chemical that is also a drug for shock and low blood pressure; dopamine and Dopastat are
  other names for this sense.
examples:
- Doctors gave Intropin to lift his blood pressure after the accident.
- Intropin steadied her heart after the shock.
