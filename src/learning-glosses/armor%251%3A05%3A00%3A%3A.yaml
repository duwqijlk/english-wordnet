simpleMeaning: A tough, fairly stiff outer layer that shields an animal or plant.
scope: This is a natural protective covering on a living thing, and armour is the British spelling of
  the same word. It is not metal gear worn in battle and not a unit of fighting vehicles.
examples:
- The turtle's shell is a bony armor that protects its soft body.
- Rose bushes have developed a thorny armor that keeps grazing animals away.
