simpleMeaning: a set of rules from an editor telling writers how to spell, punctuate, capitalize and lay
  out text for printing
scope: These are publishing rules for how text is written and printed, not a writer's personal way of
  expressing things, not a pointed writing tool, and not a narrow growth on a plant.
examples:
- The journal's house style requires UK spelling and one space after a full stop.
- Follow the company style guide when you lay out the annual report.
