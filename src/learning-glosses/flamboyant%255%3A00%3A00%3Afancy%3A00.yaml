simpleMeaning: Made with far more fine detail and decoration than is needed.
scope: This is about things made with too much fine detail and decoration; not simply bright or colourful,
  and not showy behaviour that is in bad taste.
examples:
- Her flamboyant handwriting filled the page with loops and curls.
- The flamboyant carving on the door showed off the owner's wealth.
