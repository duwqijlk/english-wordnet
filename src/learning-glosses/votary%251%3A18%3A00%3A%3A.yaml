simpleMeaning: One tied by vows to a faith, or a life of prayer and service.
scope: One tied by vows to a faith, or a life of prayer and service; not a priest or priestess, or one
  set apart to worship, in a faith outside Christianity, nor a true follower of a cause, a person, or
  a pursuit, almost as a matter of faith.
examples:
- Their votary kept the chapel keys.
- The votary prayed at dawn.
