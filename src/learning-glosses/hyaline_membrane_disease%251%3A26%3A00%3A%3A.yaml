simpleMeaning: 'A newborn lung illness, mostly in premature babies: the lungs cannot expand without a
  lubricating substance, causing fast, shallow breathing, bluish skin and a glassy coat on the air sacs.'
scope: The newborn lung condition in which a missing wetting substance stops the lungs opening, with rapid
  breathing and a glassy coat on the air sacs; it is not asthma, and not pneumonia or an inherited lung
  defect.
examples:
- The premature baby was treated for hyaline membrane disease in the neonatal unit.
- Hyaline membrane disease makes it hard for a newborn's lungs to open, so breathing becomes fast and
  shallow.
