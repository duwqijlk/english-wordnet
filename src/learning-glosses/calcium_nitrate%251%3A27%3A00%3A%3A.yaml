simpleMeaning: A salt that takes in water from the air and melts in water, at times used to give nitrogen
  to plant food.
scope: A salt that takes in water from the air and melts in water, at times used in plant food; not table
  salt and not a salt for softening water.
examples:
- Calcium nitrate feeds nitrogen to the crops.
- The farmer spread calcium nitrate on the field.
