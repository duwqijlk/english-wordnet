simpleMeaning: 'The spot on the skull where three seams meet: the back seam, the seam by the ear, and
  the seam at the side of the head.'
scope: A spot on the skull where three seams meet, not a seam on its own.
examples:
- The asterion lies where three seams of the skull meet.
- On the skull, the asterion is the point where the three seams join.
