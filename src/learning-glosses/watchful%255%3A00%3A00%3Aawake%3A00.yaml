simpleMeaning: Awake with no sleep, when sleep will not come
scope: Also called sleepless; about being awake when you cannot sleep, not watching with care.
examples:
- He lay watchful until dawn, unable to sleep.
- She spent a watchful night listening for the baby's cry.
