simpleMeaning: In medicine, a growth or swelling on part of the body that should not be there.
scope: In medicine, a growth or swelling on part of the body that is not normal; not a thing that simply
  sticks out from what is round it.
examples:
- The doctor examined the excrescence on the man's arm.
- An excrescence had formed on the wound.
