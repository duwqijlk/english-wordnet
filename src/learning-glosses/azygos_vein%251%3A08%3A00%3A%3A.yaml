simpleMeaning: a vein that drains the chest and abdominal walls, formed as a continuation of the right
  lower-back vein and ending in the large vein returning blood to the heart
scope: This is the vein that drains the chest and abdominal walls; azygous vein and vena azygos are other
  names for it, not separate vessels.
examples:
- The azygos vein carries blood from the chest wall back toward the heart.
- A blocked azygos vein can make the veins of the chest wall swell.
