simpleMeaning: One of several sour dyes used to dye wool a scarlet red.
scope: One of several sour dyes for wool, also called alizarin carmine and alizarin red; not a plant dye
  and not a dye for cotton.
examples:
- Alizarin crimson turned the wool a scarlet red.
- She dyed the yarn with alizarin crimson.
