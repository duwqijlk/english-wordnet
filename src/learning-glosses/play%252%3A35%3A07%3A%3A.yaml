simpleMeaning: to send out or direct something in a steady stream, or to be sent out that way.
scope: This sense is not about games, music, acting, or a sports move; it is about sending out or directing
  a steady stream of something.
examples:
- Firefighters played water on the flames.
- A fine spray played over the crowd from the fountain.
