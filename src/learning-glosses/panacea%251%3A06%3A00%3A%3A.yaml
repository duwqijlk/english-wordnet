senseId: 'panacea%1:06:00::'
synsetId: 03886467-n
simpleMeaning: A cure that is only imagined, said to heal every illness and every trouble, the kind of
  thing alchemists once hunted for.
scope: Also called catholicon, cure-all, and nostrum; a cure that is only imagined, said to heal every
  illness and every trouble, the kind of thing alchemists once hunted for, not a real medicine that works.
examples:
- There is no panacea for all the ills of the world.
- He warned that the new law was no panacea.
