simpleMeaning: A belief or opinion that someone holds without proof or certainty.
scope: This is not the act of thinking, not an idea that simply comes to mind and not care for other people;
  it is a personal opinion held without proof.
examples:
- My thought is that we should wait another week.
- She shared her thoughts on the plan with the team.
