simpleMeaning: a light in your view that is brighter than the light your eyes are used to
scope: 'Also called glare: a light too bright for the eyes, not a strong flame and not wild mischief.'
examples:
- The blaze of the sun on the snow made him shut his eyes.
- She turned away from the blaze of the headlights.
