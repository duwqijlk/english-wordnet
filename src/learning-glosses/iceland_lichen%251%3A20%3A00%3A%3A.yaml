simpleMeaning: A branched, flat, partly upright growth that lives in mountains and the far north; used
  as food or medicine for people and animals, and a source of glycerol.
scope: A mountain lichen used as food and medicine, also called Iceland moss and Cetraria islandica; not
  a true moss.
examples:
- Iceland lichen grows on the rocks of the high hills.
- They boiled Iceland lichen for a cough remedy.
