simpleMeaning: having a rich and pleasant taste after being kept long enough to age in the right way
scope: 'Also called mellow: tasting rich and pleasant after the right aging, not soft in light or sound
  and not calm in mood.'
examples:
- The mellowed cheese had a rich, pleasant taste.
- We drank a mellowed wine that had been kept for years.
