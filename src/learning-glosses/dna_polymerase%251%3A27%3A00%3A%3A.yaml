simpleMeaning: A substance in living things that copies the material holding the plans for the body
scope: This is a substance that copies the material holding the plans for the body; not the material itself
  and not a substance that breaks things down.
examples:
- DNA polymerase copies the material that holds the body's plans when a cell divides.
- Without DNA polymerase, a cell could not pass its plans on to the next cell.
