simpleMeaning: A way of looking at living things under a lens by light thrown off in all directions, so
  the bits under study shine out from the black around them.
scope: A way of looking at living things by scattered light; dark field illumination is another name for
  it, not ordinary bright light and not a stain.
examples:
- Dark ground illumination made the tiny cells shine.
- They used dark ground illumination to study the living cells.
