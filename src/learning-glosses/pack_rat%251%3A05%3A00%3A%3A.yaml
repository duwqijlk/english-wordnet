simpleMeaning: One of several gnawing animals in the group Neotoma, it stores away food and other things
  and lives in the west of North America with a thick furry tail.
scope: It is also called packrat, bushytail woodrat and trade rat, and it is one of several kinds in the
  group Neotoma, known for storing away food and other things.
examples:
- A pack rat had stored away food and other things.
- Pack rats live in the west of North America.
