simpleMeaning: a set of carbon-and-hydrogen stuffs with no rings, all filled with hydrogen, that follow
  the rule CnH(2n+2)
scope: A set of carbon-and-hydrogen stuffs with no rings, all filled with hydrogen, that follow the rule
  CnH(2n+2); paraffin, alkane, alkane series and methane series are other names for this sense, and it
  is not a set of ring-shaped stuffs or a single stuff on its own.
examples:
- Methane is the first member of the paraffin series.
- The paraffin series follows the rule CnH(2n+2).
