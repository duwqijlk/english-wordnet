simpleMeaning: one of the blocks that rub against both sides of a round disk
scope: One of the blocks that rub against both sides of a round disk, not a layer on the curved parts
  that slow a wheel and not the worker who looks after a train's brakes.
examples:
- The brake pad on the front wheel needed to be changed.
- New brake pads stopped the car more quickly.
