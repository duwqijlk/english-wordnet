simpleMeaning: the bar at the front of a bicycle that the rider holds and turns to steer
scope: The bar a cyclist holds to steer a bicycle, not the bicycle's frame and not a car's steering wheel.
examples:
- She gripped the handlebars and turned into the driveway.
- The handlebar was bent after the bike fell over.
