simpleMeaning: a loose outer coat that reaches down to the ankles
scope: This is a loose long coat, also called smock, duster, dust coat and gaberdine; not trousers and
  not the firm cloth itself.
examples:
- She wore a gabardine over her dress to keep off the dust.
- His gabardine reached almost to his shoes.
