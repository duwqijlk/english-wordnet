simpleMeaning: any sour chemical that has extra parts of one oxygen atom joined to one hydrogen atom,
  beyond the one such part it has on its own
scope: A sour chemical with extra oxygen-and-hydrogen parts beyond the one it has on its own; not a plain
  sour chemical with just the one part.
examples:
- Citric acid is a hydroxy acid found in lemons.
- The hydroxy acid in the fruit gave it a sharp taste.
