simpleMeaning: a sign put on a thing made for sale to show where it came from and that it is real
scope: 'Also called a hallmark or authentication: a mark showing where a traded thing came from and that
  it is real, not a price tag and not a maker''s name alone.'
examples:
- The assay-mark on the silver plate showed it was made in London.
- Buyers look for the assay-mark to be sure the piece is genuine.
