simpleMeaning: that gives shape to things, or is able to give shape to them
scope: 'Also called plastic and shaping: this sense means able to shape or make things, not the smallest
  language unit sense and not the sense about making new cells and body parts.'
examples:
- Reading good books was a formative influence on the young writer.
- The training he got as a young man was formative, and it shaped the way he worked for years.
