simpleMeaning: One of the southern parts of America where owning people as property was allowed before
  the Civil War
scope: One of the southern parts of America where owning people as property was allowed before the Civil
  War; not a northern part, and not a part where such ownership was already against the law.
examples:
- Virginia was a slave state before the Civil War.
- The slave state passed laws to keep the trade legal.
