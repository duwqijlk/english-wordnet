simpleMeaning: the side of a sofa or chair where a seated person can rest an elbow and forearm
scope: This sense is the side support of a sofa or chair where a seated person rests an elbow and forearm;
  it is not the human limb, not the cloth sleeve of a garment, and not a projecting machine part that
  looks like a limb.
examples:
- He rested his coffee cup on the arm of the sofa.
- The chair's left arm was scratched by the cat.
