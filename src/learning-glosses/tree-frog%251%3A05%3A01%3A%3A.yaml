simpleMeaning: Sticky pads on their toes set these frogs apart from true frogs; they are one of many kinds
  from Europe, Asia, and Africa that live up in branches.
scope: Also called tree frog, this is one of many kinds of frog from Europe, Asia, and Africa that lives
  up in branches, not the kind from southeast Asia, Australia, and America.
examples:
- The tree-frog clung to the branch with the sticky pads on its toes.
- A tree-frog was seen clinging to a branch.
