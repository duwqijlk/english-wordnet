simpleMeaning: A serious virus disease that attacks the nerves of warm-blooded animals, usually passed
  by the bite of an animal with the disease, and kills if the virus reaches the brain
scope: A deadly disease of animals, not wild excitement or strong feeling for something, and not being
  ill in the mind in general.
examples:
- A bite from a bat with madness can pass the virus to a person.
- In old books, madness in dogs often meant this deadly disease, not bad behaviour.
