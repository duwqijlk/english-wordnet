simpleMeaning: The shorter or shortest line through the middle of a flat oval shape or an egg-shaped solid.
scope: The shorter or shortest line through the middle of a flat oval shape or an egg-shaped solid, not
  the longer line through the middle and not a side of the shape.
examples:
- The minor axis of the ellipse ran across its narrow width.
- Draw the minor axis before you mark the foci.
