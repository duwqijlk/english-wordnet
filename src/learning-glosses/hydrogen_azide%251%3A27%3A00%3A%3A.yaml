simpleMeaning: A gas soon rises from this clear liquid, which smells very bad, can kill, and can blow
  up.
scope: Also called azoimide and hydrazoic acid, this is the clear liquid that soon turns to gas and can
  blow up.
examples:
- A drop of hydrogen azide on the bench gave off gas and smelled foul.
- They used only a tiny amount of hydrogen azide, since it can kill.
