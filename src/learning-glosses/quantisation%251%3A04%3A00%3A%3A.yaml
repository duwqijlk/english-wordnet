simpleMeaning: Splitting things into tiny bits of matter, or putting them in the words of the theory of
  tiny bits of matter
scope: 'Also called quantization: the act of splitting things into tiny bits of matter, or saying them
  in the words of the theory of tiny bits of matter, not the act of counting how much there is.'
examples:
- Quantisation turns the smooth flow of energy into small steps.
- The lecture explained quantisation in terms of quantum theory.
