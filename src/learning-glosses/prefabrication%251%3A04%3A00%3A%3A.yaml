simpleMeaning: making parts of a building in a factory so they can be put together fast and with little
  work at the building site
scope: This is making parts of a building in a factory so they can be put together at the site, not putting
  up a building from raw parts on the site itself.
examples:
- Prefabrication let the builders finish the school in half the time.
- The company used prefabrication to make the wall panels in its factory before sending them to the site.
