simpleMeaning: Most of all when the shape and the size of its parts match what people think is right,
  a thing is good to look at
scope: Said of a thing or a person that is good to look at, most of all when the shape and size of its
  parts match what people think is right, also called handsome, better-looking, fine-looking and good-looking;
  not merely neat and tidy and not only well dressed.
examples:
- Her eyebrows were on fleek for the photo shoot.
- His new haircut is on fleek.
