simpleMeaning: to do with the study of tissues, the tiny parts that living things are made of
scope: To do with the study of body tissues; histological is another name for this sense; not to do with
  the whole body and not to do with sicknesses.
examples:
- The histologic slides showed thin cuts of skin under the lens.
- She wrote a histologic report on the tissue sample.
