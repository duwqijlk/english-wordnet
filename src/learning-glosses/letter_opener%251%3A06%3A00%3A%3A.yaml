simpleMeaning: For mailed envelopes and the joined pages of books, this blunt blade cuts the first open
  and slits the second apart.
scope: Paper knife and paperknife are other names for a blunt blade that cuts open mailed envelopes and
  slits the joined pages of books.
examples:
- A letter opener lay beside the pile of mail.
- The letter opener slit the joined pages of the book.
