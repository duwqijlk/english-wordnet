simpleMeaning: 'Fifth pillar of Islam: a pilgrimage to Mecca in the month of Dhu al-Hijja that a Muslim
  is expected to make at least once in a lifetime, visiting the Kaaba.'
scope: The Islamic pilgrimage itself, an act of worship; haj is another name for this same sense, not
  an ordinary trip to Mecca.
examples:
- He performed the hajj last year with his brother.
- The hajj is one of the five pillars of Islam.
