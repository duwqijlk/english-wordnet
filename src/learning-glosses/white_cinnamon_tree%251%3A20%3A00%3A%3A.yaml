simpleMeaning: Small purple to red flowers in bunches at the ends of the stems, tough leaves, and pale
  sweet smelling bark mark this large evergreen shrub or small tree.
scope: Also called wild cinnamon, this large evergreen shrub or small tree has pale sweet smelling bark,
  tough leaves and small purple to red flowers in bunches at the ends of the stems.
examples:
- The white cinnamon tree bore small purple flowers.
- White cinnamon tree bark smells sweet.
