simpleMeaning: Not yet begun in a thing, and without the experience that thing calls for.
scope: Not yet begun in a thing and short of the experience it calls for, not plain and open in manner
  with no guile, and not work made by a person with no set training.
examples:
- He was naive about how the office worked.
- As a naive subject, he had never taken part in such a test.
