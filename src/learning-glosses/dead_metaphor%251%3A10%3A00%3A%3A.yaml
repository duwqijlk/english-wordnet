senseId: 'dead_metaphor%1:10:00::'
synsetId: 07121768-n
simpleMeaning: Used so often that it stops working as a picture, a saying turns into a plain new sense
  of the words, as with 'he is a snake'.
scope: 'This is also called frozen metaphor: a worn-out saying that has turned into a plain new sense,
  not a fresh picture used to make a point.'
examples:
- We call 'he is a snake' a dead metaphor because no one hears it as a picture any more.
- After years of use, the dead metaphor has become a plain new sense of the word.
