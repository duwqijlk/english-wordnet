simpleMeaning: giving off bubbles or full of bubbles, as a liquid does when it holds gas or when gas slowly
  forms inside it
scope: 'Also called bubbling, foaming, foamy, bubbly, and effervescing: full of bubbles or giving off
  bubbles. This is not the sense that means full of life and excitement.'
examples:
- The frothy beer rose to the top of the glass.
- She poured the frothy drink and watched the bubbles grow.
