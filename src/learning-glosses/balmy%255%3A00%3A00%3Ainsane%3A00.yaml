simpleMeaning: Used in informal or slang talk for a person whose mind is not working in the usual way
scope: 'Also called cracked, nuts, buggy, bats, crackers, daft, nutty, dotty, loopy, fruity, batty, wacky,
  bonkers, haywire, loony, barmy, loco and kooky: an informal word for a mind not working in the usual
  way, not the sense about warm, pleasant weather.'
examples:
- His odd ideas made his family say he was a bit balmy.
- Stop asking the same question - you are driving me balmy!
