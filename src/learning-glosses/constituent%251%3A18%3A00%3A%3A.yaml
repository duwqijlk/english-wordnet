simpleMeaning: a citizen who lives in an area and is spoken for in government by the officials they vote
  for
scope: A citizen who lives in an area and is spoken for in government by the officials they vote for;
  not a made part of a machine and not a word in grammar.
examples:
- The senator met her constituents at a town hall.
- Every constituent in the area can write to their member of parliament.
