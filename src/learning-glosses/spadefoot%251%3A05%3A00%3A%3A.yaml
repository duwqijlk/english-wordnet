simpleMeaning: From the northern half of the world, this digging toad bears on each hind leg a hard, flat
  growth shaped like a digging tool.
scope: It is also called spadefoot toad, a digging toad of the northern half of the world with a hard,
  flat growth on each hind leg.
examples:
- A spadefoot burrows in the ground of the northern half of the world.
- Each hind leg of a spadefoot has a hard, flat growth shaped like a digging tool.
