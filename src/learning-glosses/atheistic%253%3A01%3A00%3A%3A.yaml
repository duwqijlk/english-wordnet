simpleMeaning: To do with, or marked by, or given to no-god belief.
scope: This sense is also called atheist, for being to do with, or marked by, or given to no-god belief,
  unlike the sense for turning down all belief in gods.
examples:
- The view was atheistic, to do with no-god belief.
- The work was atheistic, given to no-god belief.
