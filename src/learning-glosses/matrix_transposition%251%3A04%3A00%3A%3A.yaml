simpleMeaning: The swap of each row of a square grid of numbers with the column that matches it
scope: The swap of each row of a square grid of numbers with the column that matches it; not a turn of
  the whole grid and not a swap of two rows.
examples:
- Matrix transposition swaps each row with its matching column.
- We used matrix transposition to swap the rows and columns of the grid.
