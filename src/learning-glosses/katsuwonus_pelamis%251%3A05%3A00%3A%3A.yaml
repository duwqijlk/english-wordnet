simpleMeaning: A fish whose flesh is dried and broken into flakes for use in Japanese cooking; it may
  be the same kind as the skipjack tuna.
scope: A fish dried and flaked for Japanese cooking, also called bonito and oceanic bonito; its near kin
  are the skipjack tuna, which may be the same kind, and other tunas of Japanese cookery.
examples:
- Katsuwonus pelamis is dried and flaked for Japanese cooking.
- The cook used Katsuwonus pelamis in the soup.
