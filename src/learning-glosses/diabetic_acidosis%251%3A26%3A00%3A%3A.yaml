simpleMeaning: Too much acid in the blood with a build-up of ketone bodies, occurring mainly in people
  with diabetes mellitus.
scope: Ketoacidosis is another name for it.
examples:
- Diabetic acidosis can follow days of high blood sugar.
- He was rushed to hospital with diabetic acidosis.
