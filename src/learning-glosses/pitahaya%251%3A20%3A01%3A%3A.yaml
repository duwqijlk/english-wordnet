simpleMeaning: a spiny plant of the southwestern United States and northern Mexico with fruit good to
  eat and full of juice
scope: 'Also called pitahaya cactus: a spiny plant of the southwestern United States and northern Mexico
  with fruit good to eat, not the fruit itself and not a leafy tree.'
examples:
- Pitahaya grows in the dry lands of northern Mexico.
- The pitahaya bore juicy fruit in the summer.
