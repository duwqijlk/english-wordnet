simpleMeaning: Tight stretchy clothing covering the body from shoulders to thighs, sometimes with long
  sleeves or legs to the ankles; worn by ballet dancers and acrobats for practice or performance.
scope: 'Another name for cat suit, leotard and unitard: the tight stretchy garment that dancers and acrobats
  wear for practice or performance.'
examples:
- She wore a black body suit to dance practice.
- The acrobat's body suit stretched as she climbed the rope.
