simpleMeaning: On a surface that answers to rays you cannot see, this picture is made, above all by X-rays
  or gamma rays.
scope: This picture, also called radiogram, shadowgraph, skiagram and skiagraph, is made by unseen rays
  rather than by ordinary light.
examples:
- A radiograph can show what the eye cannot see.
- The radiograph showed the inside of his chest.
