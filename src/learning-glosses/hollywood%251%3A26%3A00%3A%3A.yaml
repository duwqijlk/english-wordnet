simpleMeaning: A showy and coarse feel or mood that people take to be typical of the American film business
scope: This is a showy and coarse feel that people take to be typical of the American film business; near
  rivals are plain glamour and the quiet mood of an art film.
examples:
- The party had a touch of Hollywood about it, all showy lights and loud talk.
- Critics said the book had too much Hollywood in it, a flashy tone that cheapened the story.
