simpleMeaning: the name of the firm that puts out a book, with the date, place, and edition, printed at
  the foot of the title page
scope: The name of the firm that puts out a book, with the date, place, and edition at the foot of the
  title page, not the act of fixing an idea in the mind.
examples:
- The imprint on the title page gave the year and the city.
- She looked at the imprint to find who had put out the book.
