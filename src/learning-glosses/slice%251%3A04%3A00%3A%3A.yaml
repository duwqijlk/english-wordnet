simpleMeaning: a golf shot that bends to the right, for a player who hits with the right hand
scope: 'In golf, also called fade: a shot that bends to the right for a right-handed player. This is not
  the tool for spreading paint or ink, and not the act of cutting something into thin pieces.'
examples:
- As a right-handed player, his drive was a slice that bent far to the right.
- She hit a slice, and the ball landed to the right of the green.
