simpleMeaning: Said of people who push away outsiders they look down on and stay inside their own small
  circle
scope: People who keep to their own small group and turn away anyone they look down on are also called
  snobbish, snobby, clubby, and cliquish.
examples:
- The clannish villagers rarely spoke to newcomers.
- Her clannish ways kept the family apart from their neighbours.
