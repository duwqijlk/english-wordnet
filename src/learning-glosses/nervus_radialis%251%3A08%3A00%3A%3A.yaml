simpleMeaning: The largest branch of the arm's nerve bundle; it runs down the upper-arm bone, splits at
  the outer elbow, and reaches skin on the hand's back and straightening muscles underneath.
scope: Another name for the musculospiral nerve, an arm nerve; not the ulnar or median nerve, and not
  a blood vessel.
examples:
- The nervus radialis runs down the upper-arm bone.
- One branch of the nervus radialis goes to the skin on the back of the hand.
