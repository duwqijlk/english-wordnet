simpleMeaning: Any man who often wins women, named for the famed Spanish lord of old tales, a reckless
  chaser of women.
scope: Any man who often wins women, named for the famed Spanish lord of old tales, not the lord himself
  and not a man who loves one woman only.
examples:
- He fancied himself a Don Juan.
- The Don Juan of the office charmed every new secretary.
