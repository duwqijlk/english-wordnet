simpleMeaning: a sudden painful tightening of a muscle, most of all in the thigh or calf, after hard exercise
scope: A sudden painful tightening of a muscle after hard exercise, most of all in the thigh or calf;
  charley-horse is another name for this sense, not a pulled muscle and not a bone pain.
examples:
- A charley horse woke him in the night after the long run.
- She rubbed her leg where the charley horse had struck.
