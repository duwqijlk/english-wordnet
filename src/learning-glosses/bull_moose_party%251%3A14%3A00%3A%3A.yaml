simpleMeaning: A past political group in the United States, set up by Theodore Roosevelt in his 1912 run
  for president, whose sign was a great northern deer with broad flat antlers.
scope: Also called the Progressive Party, this is a past political group in the United States, set up
  by Theodore Roosevelt in his 1912 run for president, whose sign was a great northern deer with broad
  flat antlers, set apart from other political groups in the United States and from political groups set
  up at other times.
examples:
- The Bull Moose Party split the vote in 1912.
- Roosevelt led the Bull Moose Party into the election.
