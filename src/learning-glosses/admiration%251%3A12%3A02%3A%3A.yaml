simpleMeaning: the feeling you have when something is strange and surprising
scope: 'Also called wonder: the feeling from something strange and surprising; it is not the happy feeling
  of liking and thinking well of someone.'
examples:
- They stared in admiration at the strange lights in the sky.
- Admiration filled her as the huge waterfall came into view.
