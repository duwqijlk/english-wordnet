simpleMeaning: In Christian teaching, the state of being made holy by God and living under God's power
  and help
scope: In Christian teaching, living in a holy state under God's help; not the free help and love God
  gives, and not kindness to other people.
examples:
- The Virgin lived in a state of grace all her life.
- They believed he died in grace, close to God.
