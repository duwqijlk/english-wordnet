simpleMeaning: the amount of a thing that fills a bucket
scope: Another name for this sense is bucket. It is the amount that fills a bucket, not the bucket itself
  as a pot for holding things.
examples:
- She poured a bucketful of water over the flowers.
- He carried two bucketfuls of sand to the garden.
