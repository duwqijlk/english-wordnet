simpleMeaning: Very eager and full of energy, with tight nerves, as if a rush of energy in the body has
  hit you
scope: A person feels very eager and full of energy, as if a rush of energy has hit them; also called
  wired, pumped and pumped-up. Not muscles made big by hard exercise, and not calm or bored.
examples:
- The crowd was pumped up before the match began.
- She felt pumped up and ready to run.
