simpleMeaning: A hunting bird found in many lands, once used by people to hunt with.
scope: A hunting bird found in many lands, once used by people to hunt with, also called a peregrine,
  not a bird that hunts only at night and not a bird that eats only seeds.
examples:
- A peregrine falcon circled high over the cliffs.
- In old times a peregrine falcon was prized by hunters.
