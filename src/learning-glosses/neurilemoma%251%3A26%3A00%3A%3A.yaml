simpleMeaning: A growth on the tough cover of a nerve outside the brain and spine.
scope: A growth on the tough cover of a nerve outside the brain and spine, not a growth on the brain itself;
  also called neurofibroma.
examples:
- The neurilemoma grew on the tough cover of the nerve.
- Doctors took out the small neurilemoma from her arm.
