simpleMeaning: leaves of a wild plant with yellow flowers, picked in the wild and used in salads and in
  making wine
scope: Leaves of a wild plant that people eat, not the plant's flowers and not leaves grown in a garden.
examples:
- We picked dandelion greens from the field for dinner.
- The cook used dandelion greens in the salad and in the wine.
