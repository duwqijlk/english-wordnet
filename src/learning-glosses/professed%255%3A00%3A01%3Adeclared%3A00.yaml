simpleMeaning: claimed by someone who does not really mean it, in order to trick people
scope: Said but not honest, and meant to trick people; not the sense that means saying you have the skill
  or training for a job.
examples:
- His professed love for her was only a way to get her money.
- She saw through his professed concern and knew he really wanted her house.
