senseId: 'covalence%1:07:00::'
synsetId: 05041916-n
simpleMeaning: The joining of atoms by shared electrons in a chemical compound, counted by how many pairs
  of electrons one atom can share.
scope: 'Also called covalency: the joining of atoms by shared pairs of electrons, not a bond made by giving
  electrons away.'
examples:
- Covalence tells how many electron pairs an atom can share.
- In covalence, atoms join by sharing electrons.
