simpleMeaning: a beauty product that takes away hair you do not want for a short while
scope: This is a beauty product that takes away hair you do not want for a short while, also called a
  depilatory or an epilator, not a razor that cuts hair at the skin and not a strong wash used to take
  hair off animal skins.
examples:
- She spread the depilator on her legs and wiped it off after ten minutes.
- The depilator left her skin smooth for a week.
