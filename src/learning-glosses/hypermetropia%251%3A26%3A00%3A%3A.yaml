simpleMeaning: A fault of the eye in which far-away things look clear but close things look blurred.
scope: A fault of the eye in which far things look clear and near things look blurred; farsightedness,
  hypermetropy, hyperopia and longsightedness are other names for it, not the fault in which near things
  look clear and far things look blurred.
examples:
- Her hypermetropia meant she could read road signs but not a book.
- Glasses corrected his hypermetropia for close work.
