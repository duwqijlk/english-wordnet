senseId: 'submissive%3:00:00::'
synsetId: 00792376-a
simpleMeaning: willing to do what other people tell you or want you to do, or showing that you are willing
scope: This sense means willing to do what others want; it is not the stronger sense of acting in a very
  low way, like a slave or servant.
examples:
- The servants were quiet and submissive, and they did everything they were told.
- She gave a submissive reply and did what her boss asked.
