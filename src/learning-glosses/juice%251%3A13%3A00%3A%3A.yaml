simpleMeaning: The wet part that comes out of a plant or an animal when you press it or cook it.
scope: This is the wet part pressed or cooked out of a plant or an animal, not the whole fruit or its
  dry pulp.
examples:
- She squeezed the juice from the oranges.
- The juice ran out of the roast as he cut it.
