simpleMeaning: A disease caused by tiny germs and carried by body lice, marked by a rash on the skin and
  a very high body heat.
scope: This is a disease carried by body lice, marked by a rash and a very high body heat, also called
  typhus; not flu and not a cold.
examples:
- Typhus fever spread through the crowded camp.
- He caught typhus fever from lice.
