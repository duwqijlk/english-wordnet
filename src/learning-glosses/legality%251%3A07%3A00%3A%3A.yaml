simpleMeaning: the state of being in line with the law, that is, with a written rule made by a government
scope: This is the fact that something is in line with the law, not a single law itself and not just the
  idea that something is fair or right.
examples:
- They questioned the legality of the new tax.
- The court checked the legality of his arrest.
