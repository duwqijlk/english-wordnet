simpleMeaning: Trusting and without experience, so that others can easily fool or cheat you.
scope: This describes an inexperienced, trusting person; it is not the color, leafy vegetables, or a party
  member.
examples:
- He was too green to notice that the offer was a scam.
- The new interns are green, but they learn quickly.
