simpleMeaning: the state of belonging to a country, with the rights and duties that come with it
scope: This is the legal state of belonging to a country, not how a person acts as a member of that country.
examples:
- She got her citizenship after living in the country for ten years.
- He applied for citizenship and waited for an answer.
