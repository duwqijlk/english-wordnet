simpleMeaning: using a chance at once to gain something, often in a way that is not honest or fair
scope: This is about using any chance at once for your own gain, often in an unfair way, not about waiting
  and not about acting fairly for others.
examples:
- He made an opportunistic offer to buy the house for very little money after the fire.
- She took an opportunistic chance to take credit for work she did not do.
