simpleMeaning: about, or like, a short song sung by one part of a choir and answered by the other part
scope: 'Also called antiphonary: about, or like, a short song sung by one part of a choir and answered
  by the other, not the singing itself and not an ordinary song sung by all together.'
examples:
- The antiphonal parts of the service passed back and forth between the two sides of the choir.
- Her antiphonal line answered the first singer's call.
