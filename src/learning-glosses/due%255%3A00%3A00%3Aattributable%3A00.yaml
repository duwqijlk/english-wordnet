simpleMeaning: able to be traced back to, or given the credit for, a particular cause or person.
scope: This is not about money that is owed or a date when payment must be made; it describes something
  that can be traced to or credited to a cause or person.
examples:
- The success of the project is largely due to her careful planning.
- Much of the praise for the rescue is due to the local volunteers.
