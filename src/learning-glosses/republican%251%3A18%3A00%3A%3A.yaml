simpleMeaning: a person who supports a republic (a country with leaders chosen by the people), usually
  against rule by a king or queen
scope: This is a person who supports a republic, not a word for being linked to the Republican Party in
  the United States and not a word for a system of government.
examples:
- As a republican, she wanted the country to choose its leaders without a king.
- Many republicans spoke against keeping a king as head of the country.
