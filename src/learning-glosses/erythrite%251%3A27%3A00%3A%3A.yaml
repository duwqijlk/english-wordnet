simpleMeaning: a reddish mineral in which cobalt, arsenic and water form monoclinic crystals, used to
  color glass; it typically occurs in veins rich in those two elements.
scope: Another name for cobalt bloom; it is the reddish cobalt-arsenic mineral, not the metal cobalt or
  a flower.
examples:
- A pink crust of erythrite covered the old mine walls.
- The specimen was coated in a thin layer of erythrite.
