simpleMeaning: a spoon on a long handle, often used to take liquid out of one container and put it in
  another
scope: A spoon with a long handle for moving liquid from one container to another; not a serving spoon
  without a long handle, and not the act of scooping.
examples:
- She used a ladle to serve the soup.
- She used a ladle to move soup from the pot into a bowl.
