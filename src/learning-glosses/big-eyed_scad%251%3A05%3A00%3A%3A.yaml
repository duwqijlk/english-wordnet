simpleMeaning: A fish of the sea near the Atlantic coast, often used as food to catch other fish.
scope: A fish of Atlantic coastal waters often used as bait, also called bigeye scad and goggle-eye; not
  a deep-sea fish and not a food fish for people.
examples:
- The big-eyed scad swam in the shallow water near the shore.
- Fishermen used big-eyed scad as bait.
