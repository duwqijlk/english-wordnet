simpleMeaning: A drug taken by mouth against a body chemical called TNF; it can slow rheumatoid arthritis
  by slowing white blood cell growth, which lessens swelling in the joint lining.
scope: 'Also called leflunomide: an oral anti-TNF drug for slowing rheumatoid arthritis.'
examples:
- Arava is taken once a day by mouth.
- Her doctor prescribed Arava to slow her rheumatoid arthritis.
