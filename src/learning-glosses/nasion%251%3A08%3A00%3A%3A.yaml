simpleMeaning: The point on the skull, used in measuring it, at the top of the nose where the forehead
  bone and the nose bones meet.
scope: The point on the skull, used in measuring it, at the top of the nose where the forehead bone and
  the nose bones meet; not the tip of the nose and not the middle of the forehead.
examples:
- The nasion marks the top of the nose on the skull.
- Anthropologists measure from the nasion to the back of the skull.
