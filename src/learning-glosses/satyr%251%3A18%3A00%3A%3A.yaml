simpleMeaning: One of a group of woodland gods who follow Bacchus (the god of wine) in old stories, and
  were thought of as Roman fauns (Roman woodland gods)
scope: One of a group of woodland gods in old stories, who follow Bacchus (the god of wine) and were thought
  of as Roman fauns (Roman woodland gods); not a real person or animal.
examples:
- In the old story, a satyr played music in the woods for Bacchus.
- The museum painting shows satyrs following Bacchus through the woods.
