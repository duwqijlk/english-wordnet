simpleMeaning: one of many shops run by the same firm and selling the same goods
scope: One of many shops run by the same firm and selling the same goods, not a shop on its own and not
  a market stall.
examples:
- The chain store on Main Street sells the same goods as the one across town.
- She works at a chain store that has the same stock in every town.
