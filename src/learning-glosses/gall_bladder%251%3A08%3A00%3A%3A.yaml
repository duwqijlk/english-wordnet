simpleMeaning: The liver makes a bitter juice that this bag of muscle, joined to it, holds until it is
  needed to help break down food.
scope: Also called gallbladder, this is a bag joined to the liver, not the liver itself or a duct that
  carries bile.
examples:
- The doctor said my gall bladder was full of stones.
- Bile from the gall bladder helps the body break down fatty food.
