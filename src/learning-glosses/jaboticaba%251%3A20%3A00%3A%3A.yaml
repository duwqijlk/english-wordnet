simpleMeaning: A small evergreen tropical tree from Brazil and the West Indies, introduced to the southern
  US; Brazil grows it for edible, tough-skinned, grape-like purple fruit growing all along the branches.
scope: This is the tree, not its purple fruit, which is also called jaboticaba, and not another tropical
  fruit tree; jaboticaba tree in this lane is another name for the same plant.
examples:
- Jaboticaba grows well in the tropical heat of Brazil.
- We planted a jaboticaba beside the house for its purple fruit.
