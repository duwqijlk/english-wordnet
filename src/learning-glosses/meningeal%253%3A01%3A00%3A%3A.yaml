simpleMeaning: having to do with the thin skins that cover the brain and the cord down the back
scope: Of the thin skins around the brain and the cord down the back, not of the brain itself and not
  of the bones of the skull.
examples:
- A meningeal infection affects the thin skins around the brain.
- The meningeal layer protects the cord down the back.
