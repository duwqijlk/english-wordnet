simpleMeaning: A musician in the street who makes music by turning a handle on a box with pipes or strings
scope: A musician who plays music in the street on a hand-turned box, not a musician who plays in a hall
  and not one who sings.
examples:
- The organ-grinder played outside the cafe as people dropped coins in his hat.
- Children gathered round the organ-grinder to hear the tune.
