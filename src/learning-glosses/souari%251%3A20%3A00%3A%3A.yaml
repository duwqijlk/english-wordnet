simpleMeaning: People know this big South American tree, which keeps its leaves all year, for leaves in
  threes and stone fruit whose nutlike seeds give food and cooking oil.
scope: Also called souari nut or souari tree, it is the tree that bears the stone fruit, not the fruit
  itself.
examples:
- People in South America eat the seeds of the souari.
- Cooking oil comes from the souari.
