simpleMeaning: used of skin that is not smooth because of cold or of being out in the open air
scope: This word is only about skin made dry and not smooth by cold or open air. It is not about a rough
  road or wood, and not about skin that is cut or hurt.
examples:
- Her hands were roughened by the cold winter wind.
- His roughened lips hurt in the cold air.
