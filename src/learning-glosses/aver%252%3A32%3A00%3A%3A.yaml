senseId: 'aver%2:32:00::'
synsetId: 01013058-v
simpleMeaning: to say in a serious and formal way that something is true
scope: Also called affirm, assert, avow, swan, swear, and verify, it is a serious formal statement that
  something is true, not a casual claim and not a promise about the future.
examples:
- He averred that he was innocent of the charge.
- The witness averred that she had seen the whole event.
