simpleMeaning: In sociology, the ways of acting that a group follows and that show its most basic ideas
  about what is right and important
scope: In sociology, these are the deep rules a group lives by, not just small habits or the written laws
  of a place.
examples:
- Newcomers soon learned the mores of the village and what people there thought was right.
- The group's mores did not allow lying to family members.
