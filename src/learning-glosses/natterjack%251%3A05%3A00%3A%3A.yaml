simpleMeaning: A common toad with short legs and brown-yellow skin, found in the west of Europe, that
  moves by running and not by jumping.
scope: A common toad with short legs and brown-yellow skin, found in the west of Europe, that moves by
  running and not by jumping, not a frog and not a toad that hops.
examples:
- The natterjack ran across the path.
- A natterjack runs rather than hops.
