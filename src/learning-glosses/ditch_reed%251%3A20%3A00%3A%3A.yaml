simpleMeaning: A tall reed of North America with broad leaves and big feathery flower heads, growing widely
  in wet ground; the stems are used for mats, screens and arrow shafts.
scope: 'Another name for carrizo and common reed: the tall North American reed used for mats, screens
  and arrow shafts, not a separate kind of plant.'
examples:
- Ditch reed stood thick along the marshy bank, its broad leaves and feathery heads above the water.
- They cut ditch reed in autumn and dried the stems for mats and arrow shafts.
