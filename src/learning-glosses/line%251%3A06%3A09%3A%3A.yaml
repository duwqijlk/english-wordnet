simpleMeaning: a factory system in which a product moves past a series of stations, each doing the next
  step.
scope: This is not a queue of people or a row of writing; it is a mechanical system for making goods step
  by step.
examples:
- The new assembly line doubled the factory's output.
- She works on the production line making car doors.
