simpleMeaning: Into the hollow spaces called the cavernous and transverse sinuses flow blood tubes that
  drain the underside of the brain's two halves.
scope: 'Also called the inferior cerebral vein: blood tubes that drain the underside of the brain''s two
  halves, not the hollow spaces they empty into.'
examples:
- The venae cerebrum inferior drain blood from the underside of the brain.
- Blood leaves the brain's lower surface through the venae cerebrum inferior.
