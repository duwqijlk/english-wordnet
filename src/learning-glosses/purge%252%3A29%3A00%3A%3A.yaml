simpleMeaning: To clear a person's bowels out, so the waste leaves the body.
scope: To clear a person's bowels out, not the sudden removal of people from a group, not throwing up,
  not washing a thing out with liquid, and not making a person free from sin.
examples:
- The doctor decided that the patient must be purged before the operation.
- The nurse purged him with a strong dose.
