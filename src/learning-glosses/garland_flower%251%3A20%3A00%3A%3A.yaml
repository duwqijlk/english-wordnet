simpleMeaning: A low bush that keeps its leaves all year, grown in many gardens, bears thick bunches of
  sweet-smelling pink to deep red blooms.
scope: This is a low bush with thick bunches of pink blooms, not a tall shrub or a single-stemmed flower.
examples:
- The garland flower by the door was covered in pink blooms.
- She planted a garland flower because its blooms smell so sweet.
