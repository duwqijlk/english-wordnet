simpleMeaning: Get a base after the pitcher throws four pitches outside the strike zone.
scope: 'The baseball sense: reaching a base because the pitcher walked the batter, not tying a game, and
  not winning points.'
examples:
- With two outs, the batter drew a walk and moved to second on a single.
- He drew first base after the pitcher missed the strike zone four times.
