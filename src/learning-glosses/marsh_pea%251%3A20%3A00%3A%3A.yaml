simpleMeaning: Purplish blooms open on this climbing, sprawling plant of the damp or wet lands of Eurasia
  and North America, which lives year after year.
scope: This word names a climbing, sprawling plant of damp or wet lands, set apart from other peas by
  its purplish blooms.
examples:
- The marsh pea grows in damp or marshy areas of Eurasia and North America.
- Marsh pea bears purplish flowers in the damp lands.
