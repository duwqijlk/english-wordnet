simpleMeaning: A plant of arid southwestern Africa with a turnip-like trunk, a deep taproot, and two woody
  strap-shaped leaves; a relic of a vanished flora that can live thousands of years.
scope: The plant itself; the word has no other common sense, so it does not refer to a place, a person,
  or a product.
examples:
- The welwitschia survives on fog and dew in one of the driest parts of Namibia.
- Some welwitschias are thought to be over a thousand years old.
