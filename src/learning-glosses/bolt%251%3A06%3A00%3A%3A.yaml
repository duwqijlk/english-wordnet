simpleMeaning: A screw that goes into a nut and holds things together when you turn it
scope: This is a screw used with a nut to hold things together. It is not the part of a lock, not the
  bar in a gun, and not a flash of lightning.
examples:
- Tighten the bolt into the nut to hold the frame together.
- He used a bolt and a nut to fix the two boards.
