simpleMeaning: the act of cleaning something by taking away the dirty or harmful parts in it
scope: This is the act of cleaning something in general; it is not cleaning a person of sin or guilt,
  not a ceremony for cleaning, and not only the step used to clean oil, metal or sugar.
examples:
- Purification of the water made it safe to drink.
- The purification of the air in the room took several hours.
