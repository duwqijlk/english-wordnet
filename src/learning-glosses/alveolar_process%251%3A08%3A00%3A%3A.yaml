simpleMeaning: A bony ridge that forms the edges of the upper and lower jaws and holds the sockets of
  the teeth.
scope: 'Also called alveolar ridge and gum ridge: the bony ridge that forms the edges of the upper and
  lower jaws and holds the tooth sockets, not the teeth themselves and not the whole jawbone.'
examples:
- The alveolar process holds the sockets of the teeth.
- After the tooth was pulled, the alveolar process slowly changed shape.
