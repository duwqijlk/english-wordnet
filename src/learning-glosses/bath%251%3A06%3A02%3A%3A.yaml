senseId: 'bath%1:06:02::'
synsetId: 02809715-n
simpleMeaning: A container holding liquid in which a thing is put under the liquid to work on it, to keep
  its heat the same, or to make it smooth and slippery
scope: This is a container of liquid for putting a thing in, not a wash in a tub for your body and not
  the old measure of about 10 gallons.
examples:
- She put the metal plate in an acid bath to clean it.
- The parts were kept in an oil bath so they stayed at the same heat.
