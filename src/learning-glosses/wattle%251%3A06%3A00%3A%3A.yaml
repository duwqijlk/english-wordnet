simpleMeaning: a frame made of sticks put in the ground with thin branches woven between them, used to
  make a fence
scope: This is a fence frame made of woven branches, not the tree that gives the poles and not the fold
  of skin on a bird's neck.
examples:
- The garden fence was made of wattle woven from thin branches.
- They built a wattle fence around the small field.
