simpleMeaning: Any of the hardwood trees of the kind called Dalbergia that give dark red or purple wood
  with black lines and marks, a valuable wood for making fine furniture
scope: This tree is also called rosewood tree; it is the living tree, not the dark wood cut from such
  a tree.
examples:
- A rosewood grew at the edge of the garden.
- They planted rosewood for its dark, valuable wood.
