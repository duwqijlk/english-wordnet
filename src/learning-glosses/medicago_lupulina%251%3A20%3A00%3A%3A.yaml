simpleMeaning: A low flat-growing herb of Europe with small yellow flowers and curved black pods, now
  settled in North America.
scope: Black medick, hop clover, nonesuch clover and yellow trefoil are other names for this sense; it
  is not the plant of Europe with yellow flowers and sickle-shaped pods.
examples:
- Medicago lupulina spread flat across the dry path.
- The Medicago lupulina pods had turned black by late summer.
