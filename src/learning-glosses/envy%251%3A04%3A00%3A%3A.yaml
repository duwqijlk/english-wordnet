simpleMeaning: a wish to hurt a person and angry feelings at seeing that person do well, shown as a person
  and counted as one of the deadly sins
scope: This is the bad feeling at another person's success, shown as a person and counted as one of the
  deadly sins; it is not the feeling of wanting what another person has.
examples:
- In the old story, envy is shown as a thin, angry woman who hates to see others do well.
- His envy at his friend's success made him say cruel things instead of being glad.
