simpleMeaning: In film, a thing in the story that holds the watchers' eyes or moves the plot on.
scope: This is a thing in a film story that holds the watchers' eyes or moves the plot on; McGuffin is
  another name for this sense, and the sense covers any such thing in a film, whatever it is.
examples:
- The MacGuffin was a key element of Alfred Hitchcock's films.
- In the film, the MacGuffin kept the watchers guessing until the end.
