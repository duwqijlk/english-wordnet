simpleMeaning: Any of several climbing plants with funnel-shaped flowers that shut late in the day.
scope: Any of several climbing plants with funnel-shaped flowers that shut late in the day, not a flower
  that stays open all day.
examples:
- Morning glory covered the fence by July.
- The morning glory flowers had shut by late afternoon.
