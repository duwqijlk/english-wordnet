senseId: 'change%2:30:05::'
synsetId: 00551194-v
simpleMeaning: to give up one thing and take another in its place, such as a job, a doctor, or a habit.
scope: This sense is not altering the nature of something, not putting on different clothes, and not moving
  between vehicles; it means leaving one thing for a replacement.
examples:
- She changed jobs after ten years at the bank.
- He changed doctors when he moved to a new city.
