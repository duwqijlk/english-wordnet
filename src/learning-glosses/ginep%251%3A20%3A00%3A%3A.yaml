simpleMeaning: A tree of warm America bears small sweet fruit with clear juicy flesh inside a green tough
  skin.
scope: Also called genip, honey berry and mamoncillo, this is the tree, not the small fruit it bears.
examples:
- The ginep in the yard bears small sweet fruit each summer.
- We sat under a ginep while we ate its fruit.
