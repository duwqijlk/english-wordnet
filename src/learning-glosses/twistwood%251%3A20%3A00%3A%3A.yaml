simpleMeaning: This strong bush of Europe, shaped like a tree, drops its leaves each year, stands beside
  roads and paths, and bears red berries that turn black.
scope: Also called twist wood and wayfaring tree, this strong bush of Europe is shaped like a tree, not
  a tree itself, and it bears red berries that turn black.
examples:
- The twistwood beside the lane bore red berries that had turned black.
- Twistwood grew beside the road and bore red berries.
