simpleMeaning: a cloth made to look like the leather that comes from the underside of animal skins
scope: A cloth made to look like leather from the underside of animal skins, not the leather itself.
examples:
- Her jacket was made of suede, a cloth that only looks like the real leather.
- The shop sold suede made as a cloth, not cut from animal skin.
