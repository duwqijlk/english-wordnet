simpleMeaning: the deep set of qualities in a person that shapes what they do and how they judge right
  and wrong
scope: Also called character; a person's inner qualities that guide right and wrong, not food, not a thread,
  and not a cell of the body.
examples:
- The fiber of her character held firm under pressure.
- Hard times tested the fiber of the young teacher.
