simpleMeaning: A two-year shrub with woolly stems that grows tree-like, found in tropical Africa and southern
  Asia, with silvery-white prickly branches, bunches of blue or white flowers, and bright red berries.
scope: Not other shrubs with red berries, nor the true hollies of cooler lands; also called Solanum giganteum.
examples:
- African holly grows in tropical Africa.
- The African holly has bright red berries.
