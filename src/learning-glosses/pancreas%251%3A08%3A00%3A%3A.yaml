simpleMeaning: a large, long gland (a body part that makes juices) behind the stomach; it makes a juice
  to break down food and insulin to control sugar in the blood
scope: This is the body part behind the stomach that makes a food juice and insulin, not the stomach itself
  and not another body part that makes juices.
examples:
- The pancreas sits behind the stomach and helps the body break down food.
- Problems with the pancreas can stop the body making enough insulin.
