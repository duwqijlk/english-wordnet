simpleMeaning: Iron from the furnace that holds manganese, used to take oxygen out and to add manganese
  when making steel.
scope: Also called spiegel and spiegel iron, this is iron from the furnace that holds manganese, used
  to take oxygen out and to add manganese when making steel, not the steel itself and not plain iron without
  manganese.
examples:
- Spiegeleisen was weighed out before the steel was made.
- The men added spiegeleisen to take oxygen from the melt.
