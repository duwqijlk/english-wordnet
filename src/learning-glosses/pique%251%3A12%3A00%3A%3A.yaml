simpleMeaning: a sudden feeling of anger that is shown all at once
scope: 'Also called temper, and another name for it is irritation: a sudden burst of anger, not the tightly
  woven cloth with raised lines that shares this name.'
examples:
- In a fit of pique, he slammed the door and left.
- Her pique passed quickly, and she said sorry for shouting.
