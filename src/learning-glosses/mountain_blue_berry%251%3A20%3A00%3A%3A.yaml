simpleMeaning: Single flowers and fruit that is a little sour grow on this upright bush of the west of
  the United States.
scope: It is also called a bilberry, a mountain blueberry, or a thin-leaved bilberry, and it is an upright
  bush of the west of the United States with single flowers and sour fruit.
examples:
- Single flowers grow on the mountain blue berry.
- The fruit of the mountain blue berry tastes a little sour.
