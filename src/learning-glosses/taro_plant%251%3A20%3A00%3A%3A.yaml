simpleMeaning: Grown in the warm lands for its root, which people can eat, and in cooler lands to show
  its big shiny leaves, this herb comes from the Pacific islands.
scope: A herb from the Pacific islands grown for its edible root in the warm lands and for its big shiny
  leaves in cooler lands; taro, dalo and dasheen are other names for it.
examples:
- They grew the taro plant in the warm lands for its root.
- In cooler lands the taro plant is grown to show its big shiny leaves.
