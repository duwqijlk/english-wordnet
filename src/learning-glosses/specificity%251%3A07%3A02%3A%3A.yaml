simpleMeaning: the quality of being linked to only one kind of living thing
scope: This sense is about a thing that is linked to only one kind of living thing, not the wider sense
  about being clear and exact rather than general.
examples:
- The specificity of this germ means it can live in only one kind of animal.
- Scientists noted the specificity of the tiny insect, which feeds on only one kind of plant.
