simpleMeaning: In a forceful or violent manner, without gentleness; used informally.
scope: This is the informal adverb for acting with force or violence; roughly is the standard name for
  the same sense. It is not the adverb for moving over an uneven surface, nor the adjective meaning unkind.
examples:
- Don't handle the box so rough; the glasses inside will break.
- They treated him rough, shouting and pushing him around.
