simpleMeaning: From that region comes a pair of bars on an upright bar; the bar below the middle is the
  longer one, and the other sits above the middle.
scope: Another name for it is the cross of Lorraine; it is a pair of bars on one upright bar, not a single-barred
  cross.
examples:
- The Lorraine cross flew over the city during the war.
- She wore a small Lorraine cross on a chain.
