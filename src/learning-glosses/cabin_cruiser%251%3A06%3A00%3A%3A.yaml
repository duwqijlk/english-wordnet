simpleMeaning: a big boat with a motor that has a room, water pipes, and other things needed to live on
  it
scope: 'Also called a cruiser, a pleasure boat, and a pleasure craft: a big boat with a motor, made for
  living on, not a small open boat and not a ship for work.'
examples:
- They spent the weekend on their cabin cruiser.
- The cabin cruiser has room to sleep and cook on board.
