simpleMeaning: To find the weight of something using a weighing device.
scope: This is putting something on a weighing machine, not resizing a model to a ratio and not stripping
  plates off a fish.
examples:
- The jeweler scaled the gold before quoting a price.
- The clerk scaled each parcel at the post office before charging postage.
