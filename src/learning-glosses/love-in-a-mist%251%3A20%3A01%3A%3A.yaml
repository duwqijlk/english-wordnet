simpleMeaning: a passion flower from warm parts of America, with leaf-like parts cut into fine narrow
  strips, whose stems smell bad when crushed
scope: A tropical American passion flower with finely cut bracts and bad-smelling stems, also called running
  pop and wild water lemon, not a sweet-smelling garden flower and not a fruit-bearing vine.
examples:
- The love-in-a-mist in the garden has finely cut bracts.
- When crushed, the stems of love-in-a-mist smell bad.
