simpleMeaning: A drink with alcohol made from the sweet-smelling roots of a shrub
scope: This is a drink with alcohol made from the sweet-smelling roots of a shrub; kava is another name
  for this sense, not the shrub itself and not any other strong drink.
examples:
- Guests drank kavakava at the feast.
- Kavakava is made from the roots of a shrub.
