simpleMeaning: a drug called Capoten that stops the kidneys making a substance that tightens blood vessels,
  so they widen, for high blood pressure and heart failure with fluid build-up
scope: A blood-pressure drug, not a painkiller and not a drug for the heart's rhythm.
examples:
- Her doctor gave her captopril for high blood pressure.
- Captopril helped his heart failure, and his breathing eased.
