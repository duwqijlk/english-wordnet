simpleMeaning: A soft, pale blue-white metal that can be pulled into thin wire and hammered flat, is poisonous,
  and can join two other atoms; found with zinc ores.
scope: This is the soft, pale blue-white metal found with zinc ores, also called Cd and atomic number
  48, not zinc itself or lead.
examples:
- Cadmium is a soft metal found with zinc ores.
- Workers wore masks where cadmium dust hung in the air.
