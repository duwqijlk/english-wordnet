senseId: 'fibre%1:07:00::'
synsetId: 04627573-n
simpleMeaning: the set of inner qualities that are part of a person and that decide how they act and react
  about right and wrong
scope: 'Also called character, and another name for it is fiber: this is a person''s inner make-up about
  right and wrong. It is not plant food fibre and not thread-like fibre for making yarn.'
examples:
- He had the moral fibre to tell the truth when it was hard.
- Her moral fibre showed when she stood up for what was right.
