simpleMeaning: In the Roman Catholic Church, a note sent to a family in grief saying the sender has asked
  for a church service to be said for the dead person
scope: In the Roman Catholic Church, a card sent to a family in grief saying the sender has asked for
  a Mass to be said for the dead person; it is the card, not the Mass itself.
examples:
- She sent a Mass card to the family after the funeral.
- The Mass card said a Mass would be said for him.
