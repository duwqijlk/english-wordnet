simpleMeaning: These orchids have few leaves, and their yellow-green or dull purple flowers, usually fairly
  small, grow in bunches at the ends of the stems.
scope: An orchid with few leaves and small flowers in bunches at the stem ends, not a large orchid.
examples:
- The liparis in the damp wood had only three leaves and a spray of dull purple flowers.
- We found a liparis growing by the stream, its yellow-green flowers still in bud.
