simpleMeaning: an animal that makes milk for its young, where the mother has a bag of skin on her body
  to carry her babies and feed them milk there
scope: This is an animal, also called a pouched mammal, not the describing word for things that belong
  to or are about these animals.
examples:
- A kangaroo is a marsupial, and its baby grows inside the mother's bag of skin.
- The koala is a marsupial that carries its young in a bag on its body.
