senseId: 'pictorial_representation%1:04:00::'
synsetId: 00902073-n
simpleMeaning: A thing shown in a picture, as by a photo or a painting.
scope: Also called picturing, this is a thing shown in a picture, not the thing itself and not a written
  account of it.
examples:
- The pictorial representation of the battle hangs in the hall.
- A pictorial representation in paint showed the town as it was.
