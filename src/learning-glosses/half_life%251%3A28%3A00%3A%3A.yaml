simpleMeaning: For a substance giving off rays, the time for 50% of its tiny bits to break apart; for
  other things, the time to fall to 50% of where they started
scope: 'Also called half-life: the time for a thing to fall to 50% of its first amount, not a full lifetime
  and not the time a thing lasts.'
examples:
- The half life of the drug in the body is about six hours.
- Scientists measured the half life of the new substance.
