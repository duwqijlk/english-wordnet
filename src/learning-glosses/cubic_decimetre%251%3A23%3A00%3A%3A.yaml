simpleMeaning: A metric room-measure, first the room held by one kilo of clean water, in fixed conditions,
  now a thousand cubic centimeters, near 1.75 pints.
scope: This sense is also called liter, litre, and cubic decimeter, a metric room-measure, first the room
  held by one kilo of clean water, in fixed conditions, now a thousand cubic centimeters, near 1.75 pints.
examples:
- Cubic decimetres measure room.
- The cubic decimetre holds a thousand cubic centimeters.
