simpleMeaning: 'Signals sent up to it come back down to earth: a thing made by people and put in space
  that stays over one spot as the earth turns.'
scope: This thing in space is made by people and passes signals back to earth.
examples:
- The communications satellite relays television pictures to homes across the country.
- Engineers used a communications satellite to send the phone call across the ocean.
