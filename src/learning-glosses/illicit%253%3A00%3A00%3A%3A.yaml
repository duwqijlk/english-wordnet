senseId: 'illicit%3:00:00::'
synsetId: 01554929-a
simpleMeaning: against what most people think is right, especially about sex, or against the usual rules
scope: This sense is about breaking rules of right behaviour, especially about sex, or the usual way of
  doing things, not the sense that means not allowed by law.
examples:
- They kept their illicit relationship secret because most people thought it was wrong.
- He was punished for his illicit affair with a married woman.
