simpleMeaning: a long open channel under the edge of a roof that gathers rainwater and takes it away
scope: 'Also called a gutter: a long open channel under the edge of a roof that gathers rainwater and
  takes it away, not the box cattle eat from and not a low place in the ground.'
examples:
- Rain ran along the trough and down the pipe.
- Leaves had blocked the trough under the roof.
