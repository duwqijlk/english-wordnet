simpleMeaning: Single seed cases with wings follow thin stems of small white flowers on this plant that
  lives for one year, with deeply cut leaves at its base
scope: Also called lacepod, a plant that lives for one year with small white flowers, not a long lived
  plant with large flowers.
examples:
- The fringepod by the path had small white flowers and deeply cut leaves at its base.
- We found fringepod growing in the open ground with thin stems of white flowers.
