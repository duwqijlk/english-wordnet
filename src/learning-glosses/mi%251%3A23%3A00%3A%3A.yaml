simpleMeaning: a unit of length of 1,760 yards or 5,280 feet, exactly 1609.344 meters
scope: 'Also called mile: the land unit of 1,760 yards or 5,280 feet, not the navigation unit of 1,852
  meters and not the former British unit of 6,080 feet.'
examples:
- The town is three mi down the road.
- They walked a full mi before they stopped to rest.
