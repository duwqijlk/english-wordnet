simpleMeaning: Spoken in a slurred way, as if the tongue were too thick to shape words
scope: Speech slurred as if with a thick tongue, not speech spread thickly and not a thick flow.
examples:
- After a few drinks he was beginning to speak thickly.
- She spoke thickly through her swollen lip.
