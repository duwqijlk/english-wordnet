senseId: profane%5:00:00:unholy:00
synsetId: 02062330-s
simpleMeaning: not holy because it has not been blessed as holy, or because it is not pure or has been
  spoiled
scope: 'Also called unconsecrated and unsanctified: not holy in this way, not the sense about bad language
  and cursing, and not the sense about showing no respect for holy things.'
examples:
- The old stones were left in a profane place outside the temple walls.
- They said the well was profane and could not be used for holy water.
