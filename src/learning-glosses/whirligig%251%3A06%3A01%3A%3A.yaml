senseId: 'whirligig%1:06:01::'
synsetId: 04461511-n
simpleMeaning: Spun on a steel point, this cone-shaped plaything for children tapers down to the point
  it turns on.
scope: Also called a top or a teetotum; a cone-shaped child's toy that spins on a steel point, not a big
  spinning ride and not the act of spinning like one.
examples:
- The child set the whirligig spinning on the floor.
- His whirligig hummed as it turned on its steel point.
