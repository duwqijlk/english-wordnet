simpleMeaning: A tiny part found in the jelly inside most cells, above all in white blood cells and in
  liver and kidney cells.
scope: A tiny part found in the jelly inside most cells, above all in white blood cells and in liver and
  kidney cells; not the outer skin of a cell and not the part that holds the genes.
examples:
- The lysosome sits in the jelly inside the cell.
- Lysosomes are common in liver cells.
