simpleMeaning: In pharmacology, a medicine made of a substance taken out from something and mixed in alcohol
scope: In pharmacology, a medicine in alcohol; not a substance used to color or dye things, and not the
  act of coloring something a little.
examples:
- She put a few drops of the tincture in water and drank it.
- The doctor made a tincture by mixing the plant substance in alcohol.
