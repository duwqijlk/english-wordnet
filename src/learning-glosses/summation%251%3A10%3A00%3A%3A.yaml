simpleMeaning: A closing account of a case, given in a law court.
scope: 'Also called a rundown: a closing account of a case in a law court, not the joining of many small
  signals in the body and not the adding of numbers together.'
examples:
- The lawyer gave a short summation of the case.
- Her summation at the end of the trial was clear and brief.
