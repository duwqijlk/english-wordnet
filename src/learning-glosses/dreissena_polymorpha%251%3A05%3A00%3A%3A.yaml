simpleMeaning: A shellfish about an inch long, brought by chance from Europe, that blocks water pipes
  and eats the freshwater mussels people can eat.
scope: A small shellfish that blocks pipes, not a native mussel; a pest brought in by chance from Europe.
examples:
- Dreissena polymorpha clogged the intake pipe of the water plant.
- The lake was full of Dreissena polymorpha on every rock.
