simpleMeaning: a tall tree with green leaves all year, from the Pacific side of North America, cut in
  large amounts for its wood
scope: 'Also called west coast hemlock: a tall tree that keeps its leaves all year, not a pine and not
  a fir.'
examples:
- The western hemlock grew taller than the maples around it.
- Crews hauled the western hemlock to the mill for its wood.
