simpleMeaning: puts up with unfair treatment and trouble again and again, and does not complain
scope: Also called enduring, this is a person who puts up with wrongs and trouble over time without complaint,
  not a short burst of patience and not a person who gives up.
examples:
- Her long-suffering husband never raised his voice, even after years of unfair treatment.
- The long-suffering teacher smiled through another noisy lesson.
