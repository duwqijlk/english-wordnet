simpleMeaning: in this bone disorder, areas of bone that are breaking down are replaced by abnormal connective
  tissue, leading to lesions in the bone or on the skin.
scope: This is a bone condition in which bone that is being broken down is replaced by connective tissue;
  it is not a cancer or a simple fracture.
examples:
- The X-ray showed fibrous dysplasia of bone in her upper arm.
- Children with fibrous dysplasia of bone may develop a limp or bone pain.
