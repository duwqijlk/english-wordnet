simpleMeaning: Running back near the middle of the brain, two paired blood tubes join to form the great
  blood tube of the brain.
scope: These blood tubes are also called vena cerebrum internus, and they join to form the great blood
  tube of the brain.
examples:
- The internal cerebral vein runs near the middle of the brain.
- The internal cerebral vein joins its pair to form the great cerebral vein.
