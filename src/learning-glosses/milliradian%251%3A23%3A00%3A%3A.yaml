simpleMeaning: How far a thing has turned is counted by this unit, one thousandth of a larger unit of
  angle
scope: A tiny unit for counting angles, not a degree and not a unit of length.
examples:
- The sight was off by two milliradians.
- He set the angle in milliradians, not degrees.
