simpleMeaning: To grow folds and bends on its own, so the top is no longer even
scope: 'Also called a wrinkle, a crumple, a crease, or a rumple: to grow folds and bends on its own, so
  the top is no longer even, not the act of pressing folds into a thing.'
examples:
- The paper crinkled in the heat.
- The silk crinkled as it dried.
