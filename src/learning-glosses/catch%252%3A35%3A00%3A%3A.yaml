schema: oewn-learning-gloss-v2
senseId: 'catch%2:35:00::'
synsetId: 01441809-v
simpleMeaning: To grab something that is moving and hold it back or stop it.
scope: This is gripping a moving object so that it stops or is held back, as with a ball or a closing
  door; it is not trapping an animal in a snare or trap, not catching a fleeing person after a chase,
  not a door or window fastener, not a stop that limits how far a part moves, and not noticing a mistake
  or slip.
examples:
- He caught the ball one-handed above his head.
- She caught the falling vase before it hit the floor.
