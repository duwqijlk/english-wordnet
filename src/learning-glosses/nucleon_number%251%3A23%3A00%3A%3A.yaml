simpleMeaning: The total count of the neutrons and protons in the heart of an atom
scope: The total count of the neutrons and protons in the heart of an atom, with mass number as another
  name for this sense; not the count of electrons, and not the weight of the atom.
examples:
- The nucleon number of carbon is twelve.
- To find the nucleon number, add the protons and neutrons.
