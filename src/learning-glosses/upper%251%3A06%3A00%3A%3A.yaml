simpleMeaning: the part of a shoe or boot that sits above the sole and covers the foot, made of leather
  or a man-made material
scope: This is a part of footwear, not a stimulant drug, not a higher rank, and not the top one of two
  things.
examples:
- The uppers are soft leather, so the shoes need little breaking in.
- Mud had dried on the uppers of his boots.
