simpleMeaning: a person who makes a thing crude and offensive in taste
scope: A person who makes a thing crude and in bad taste; vulgarizer is another name for this sense, not
  a person who is merely rude and not a critic of bad taste.
examples:
- The vulgariser turned a fine song into a dirty joke.
- Critics called him a vulgariser of the old tales.
