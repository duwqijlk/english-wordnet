scope: An eye disease from harm to the nerve joining the eye to the brain, even when the push of fluid
  inside the eye stays in the usual range; not eye disease from high fluid push.
examples:
- She has normal tension glaucoma, so her eye pressure reads as normal.
- Normal tension glaucoma damaged his optic nerve despite normal pressure.
