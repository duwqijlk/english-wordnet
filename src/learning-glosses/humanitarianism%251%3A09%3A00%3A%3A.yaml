simpleMeaning: 'People ought to work for the good of others: that is the teaching here'
scope: Also called humanism, it is the teaching that people ought to work for the good of others, not
  the belief that each person should look after only themselves.
examples:
- His humanitarianism led him to give money to feed the poor.
- Humanitarianism drove her to help strangers after the flood.
