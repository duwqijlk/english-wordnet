simpleMeaning: In muscle, the protein found most is a globulin, a kind of protein that dissolves in salt
  water, and it joins with actin to make a new joined protein.
scope: This is the protein found most in muscle, a globulin that joins with actin to make a new joined
  protein, not actin itself.
examples:
- The lab found myosin in the muscle sample.
- Myosin joins with actin to make a new joined protein.
