simpleMeaning: Of numbers, having a hundreds digit as well as tens and ones
scope: A number with a hundreds digit, not a one-digit number and not a number with four or more digits.
examples:
- 100 through 999 are three-figure numbers.
- A three-figure number has a digit in the hundreds place.
