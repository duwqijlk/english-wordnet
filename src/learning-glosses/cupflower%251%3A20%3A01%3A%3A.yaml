simpleMeaning: Any of the plants of the kind Nierembergia, with bell-shaped flowers that turn up
scope: This is a plant of the kind Nierembergia with upturned bell-shaped flowers, not the climbing plant
  with big yellow flowers; nierembergia is another name for this sense.
examples:
- Cupflower bloomed in the rock garden.
- The cupflower opened its pale bells in the sun.
