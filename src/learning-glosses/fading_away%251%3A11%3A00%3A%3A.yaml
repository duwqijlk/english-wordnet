simpleMeaning: a light, a sound, or a power that slowly grows weaker over time
scope: A light, sound, or power growing slowly weaker, not a thing that stops at once and not a thing
  that stays the same.
examples:
- The fading away of the music marked the end of the show.
- We watched the fading away of the light at dusk.
