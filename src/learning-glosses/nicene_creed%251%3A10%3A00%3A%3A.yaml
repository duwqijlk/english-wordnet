simpleMeaning: In Christianity, a set form of words that sums up Christian beliefs, first taken up in
  325 and made longer later
scope: A shared statement of Christian belief for use in worship, not the shorter creed of the apostles
  or a prayer said in church.
examples:
- The Nicene Creed is said in church on Sundays.
- They recited the Nicene Creed together.
