simpleMeaning: 'An early 20th-century view against idealism: things and sensing are apart, and the world
  outside the mind exists on its own and can be known at once.'
scope: A 20th-century view against idealism, holding that the world outside the mind exists on its own,
  not idealism and not an older view that splits mind and world.
examples:
- New Realism holds that the world exists apart from the mind.
- The New Realism thinkers rejected the dualism of John Locke.
