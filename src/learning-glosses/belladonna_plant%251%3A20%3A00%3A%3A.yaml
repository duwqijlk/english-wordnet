simpleMeaning: A long-lived herb from Eurasia with bell-shaped reddish flowers and shiny black berries.
  It is widely grown in the United States; the drug atropine comes from its roots and leaves.
scope: This is the growing Eurasian herb, not the medicinal extract or tincture made from it; belladonna
  and deadly nightshade are other names for the same plant.
examples:
- A single belladonna plant can carry hundreds of glossy black berries.
- She tied a label on the belladonna plant so visitors would not pick it.
