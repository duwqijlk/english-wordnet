simpleMeaning: An inward image of earth, a web of thoughts and deeds new tidings can rework.
scope: This sense is also called scheme, for an inward image of earth, a web of thoughts and deeds new
  tidings can rework, where scheme is a picture in the mind of the world, a joining of ideas and actions
  that can change when a person learns new facts about the world, unlike the sense for a sketch or early
  plan.
examples:
- The schema is an inward image of earth.
- Schemas are webs of thoughts and deeds.
