simpleMeaning: a deal to buy or sell a thing, with an agreed handover at a set time in the future
scope: A deal to buy or sell a thing for handover at a set later time, not a sale paid and handed over
  at once and not a bet on prices.
examples:
- They signed a forward transaction for next spring's grain.
- A forward transaction lets a mill fix the price of wheat months ahead.
