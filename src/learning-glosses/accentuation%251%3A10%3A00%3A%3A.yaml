simpleMeaning: The use of an accent in speech, and how strongly syllables stand out in a phrase or utterance.
scope: The stress that makes some parts of a word or phrase stand out more than others is what this word
  names.
examples:
- The accentuation fell on the first part of the word.
- In the phrase, accentuation made some parts stand out more than others.
