simpleMeaning: A pot used in old Egypt to hold the inner parts of a body made ready for burial.
scope: 'Also called canopic vase: a pot for the inner parts of an embalmed body, not a storage jar and
  not a coffin.'
examples:
- The canopic jar held the liver of the dead king.
- Museum visitors saw a canopic jar from an old tomb.
