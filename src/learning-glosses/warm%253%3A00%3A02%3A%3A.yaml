simpleMeaning: It describes a person who is friendly and kind, showing real interest in other people and
  responding to their feelings.
scope: This describes a person's manner, not physical heat or the feeling a color gives.
examples:
- She greeted us with a warm smile.
- His warm reply made me feel at ease.
