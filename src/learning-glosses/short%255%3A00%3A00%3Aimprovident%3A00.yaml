simpleMeaning: failing to think ahead about future needs or results, and seeing only a narrow range of
  possibilities
scope: This sense is about poor planning and a narrow outlook, not about rude speech or about pastry that
  crumbles.
examples:
- Cutting the training budget was a short-sighted decision that cost the company dear.
- It was improvident of the council to ignore the warning and plan no repairs.
