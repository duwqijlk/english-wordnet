simpleMeaning: a kind of sad folk song that Black people in America began to sing in the early 1900s,
  its sad sound coming from bent-down notes used again and again
scope: A sad kind of folk song, not the sad feeling itself and not the colour blue.
examples:
- The band played the blues late into the night.
- She loved to sing the blues with her guitar.
