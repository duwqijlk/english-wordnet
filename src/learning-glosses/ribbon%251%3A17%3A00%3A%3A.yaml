simpleMeaning: Something long and thin, with the shape of a line
scope: Also called thread, this is any long thing shaped like a thin line, not a cloth strip for decorating
  and not the inked strip in a typewriter.
examples:
- From the hill, the road was a grey ribbon across the fields.
- A ribbon of smoke rose from the chimney.
