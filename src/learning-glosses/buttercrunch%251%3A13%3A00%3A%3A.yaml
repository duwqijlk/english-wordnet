simpleMeaning: a kind of lettuce with tender leaves that are fairly crisp and break with a light sound
  when you bite them
scope: A kind of lettuce with tender, fairly crisp leaves that break with a light sound when bitten, not
  the soft loose-headed kind that bruises easily, and not a hard crisp head lettuce.
examples:
- She picked a buttercrunch from the garden and added the leaves to the salad.
- The buttercrunch in the market had pale green leaves that broke with a light snap.
