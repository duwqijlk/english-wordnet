simpleMeaning: A wash for the skin that comes as a thick liquid, much like a lotion in feel
scope: This is a wash for the skin that comes as a thick liquid, much like a lotion in feel; creme cleanser
  is another name for it; not a hard bar of soap, and not a rough scrub for the skin.
examples:
- She used a cream cleanser on her dry skin.
- The cream cleanser left her face soft and clean.
