simpleMeaning: words taken from something a person said or wrote, and used again by someone else
scope: Words taken from what someone said or wrote, also called a quote or a quotation. Not a short note
  naming a source, not a court order to appear, and not the act of naming a source in law.
examples:
- She began her essay with a citation from the famous speech.
- The book is full of citations from old letters and diaries.
