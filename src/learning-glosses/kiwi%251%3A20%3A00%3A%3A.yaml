simpleMeaning: A climbing plant that first grew in China; people grow it in New Zealand for its soft,
  hairy fruit that you can eat and that is green inside
scope: Also called kiwi vine; this is the climbing plant itself, not the bird from New Zealand and not
  the fruit the plant bears.
examples:
- She planted a kiwi vine by the fence, and it climbed high that summer.
- The kiwi vine is grown in New Zealand for its hairy fruit.
