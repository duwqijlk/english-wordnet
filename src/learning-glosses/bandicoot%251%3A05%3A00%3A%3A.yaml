simpleMeaning: any of several quick rat-like animals that live on land in Australia and nearby islands,
  carry their young in a pouch, and eat insects and plants
scope: A quick rat-like pouched animal of Australia that lives on land, not a rat and not a kangaroo.
examples:
- A bandicoot snuffles through the leaf litter, hunting insects.
- The bandicoot carries its young in a pouch, like other marsupials.
