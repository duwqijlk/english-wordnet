simpleMeaning: to swim or move under water while breathing through a tube that reaches up above the water
scope: This is the act of swimming under water with a breathing tube. It is not the tube itself, and not
  an air pipe on a boat that travels under water.
examples:
- We snorkeled over the reef and watched the fish below us.
- She learned to snorkel in the clear water near the beach.
