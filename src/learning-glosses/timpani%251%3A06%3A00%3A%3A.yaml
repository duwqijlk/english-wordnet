simpleMeaning: A big bowl-shaped drum of brass or copper, with a skin top whose pull can be changed to
  tune it.
scope: Also called a kettle, a kettledrum, tympani, or a tympanum; a big bowl-shaped drum of brass or
  copper tuned by changing the pull on its skin top, not a small hand drum.
examples:
- The timpani rolled low at the start of the piece.
- He tuned the timpani before the concert.
