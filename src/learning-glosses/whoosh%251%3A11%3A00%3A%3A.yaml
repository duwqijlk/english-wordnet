simpleMeaning: the sound made when a gas or liquid rushes past all at once
scope: The sound of a sudden rush of a gas or liquid, not the act of moving fast with that sound.
examples:
- We heard the whoosh of air as the door shut.
- The whoosh of the wave filled the cave.
