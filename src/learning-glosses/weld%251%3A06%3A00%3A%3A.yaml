simpleMeaning: a join between two pieces of metal, made by heating them soft and then beating or melting
  them into one
scope: A join in metal made with heat, not the plant used for yellow dye and not joining people closely.
examples:
- The weld on the gate had cracked in the cold.
- He checked each weld before the bridge was opened.
