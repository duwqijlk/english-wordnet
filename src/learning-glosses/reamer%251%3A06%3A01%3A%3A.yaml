simpleMeaning: A squeezer you press cut citrus fruit down on, its ridged cone in the middle letting the
  juice run out.
scope: Also called a juicer or a juice reamer, it is a squeezer for getting the juice out of citrus fruit.
examples:
- Press half an orange down on the reamer and the juice runs out.
- Use a reamer when you want the juice out of a lemon.
