simpleMeaning: At the point where it boils, a fixed weight of stuff takes in warmth and turns into gas
  without getting any hotter
scope: The warmth a fixed weight of stuff takes in to turn into gas as it boils, also called heat of vaporization,
  not the warmth given off when a liquid turns solid and not the warmth taken in when a liquid splits
  apart.
examples:
- The heat of vaporisation of water is high, so steam carries a lot of warmth.
- They worked out the heat of vaporisation from how much warmth the boiling liquid took in.
