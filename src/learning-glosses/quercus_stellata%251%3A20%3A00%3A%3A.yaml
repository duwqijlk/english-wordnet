simpleMeaning: A small oak of east and middle United States, losing its leaves in winter, with dark green
  lyre-shaped leaves cut deep, and tough wet-resistant wood, used especially for fence posts.
scope: Also called box white oak, brash oak, iron oak and post oak; a small oak of east and middle United
  States with dark green lyre-shaped leaves, not a big oak of the far west and not an oak that keeps its
  leaves all year.
examples:
- Quercus stellata gives tough wood for fence posts.
- The dark green leaves of Quercus stellata are cut deep like a lyre.
