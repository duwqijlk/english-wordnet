simpleMeaning: Each half's memory part reaches the other side's memory part, the deep middle part and
  two small round parts, along an arched bundle of white threads at the brain's base
scope: Also called trigonum cerebrale, this is a bundle of white threads at the base of the brain, not
  any arch-shaped part of the body.
examples:
- The scan showed damage to the fornix after the head injury.
- Signals pass through the fornix from one side of the brain to the other.
