simpleMeaning: Often a sign of infection, the body grows hotter than usual
scope: 'Also called fever, febrility, feverishness, or pyrexia: the body growing hotter than usual, not
  a hot day and not a warm room.'
examples:
- Her febricity rose through the night as the infection took hold.
- The doctor checked his febricity before giving him medicine.
