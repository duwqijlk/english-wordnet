simpleMeaning: a cover for a bed, made of two layers of cloth with filling sewn between them
scope: A bed cover of two cloth layers with filling sewn between them; comfort, puff and quilt are other
  names for this sense, not a person who calms fears and not a baby's dummy.
examples:
- She pulled the comforter up to her chin.
- They bought a new comforter for the winter.
