simpleMeaning: The set of body parts that take part in making young and in making and passing water from
  the body.
scope: This is the set of body parts that take part in making young and in making and passing water from
  the body; apparatus urogenitalis and genitourinary apparatus are other names for this sense, not the
  set of parts that take in food and not the set that takes in air.
examples:
- The genitourinary system covers both sex organs and the urinary tract.
- Doctors checked his genitourinary system after the injury.
