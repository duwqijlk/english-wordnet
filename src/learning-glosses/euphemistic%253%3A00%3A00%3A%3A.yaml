senseId: 'euphemistic%3:00:00::'
synsetId: 00911705-a
simpleMeaning: using a softer, kinder word or phrase in place of one that sounds too hard or rude
scope: About using a softer word in place of a hard or rude one; not plain, direct wording that says the
  hard thing as it is.
examples:
- '''Passed away'' is a euphemistic way to say that someone died.'
- He chose a euphemistic phrase when he told us he had lost his job.
