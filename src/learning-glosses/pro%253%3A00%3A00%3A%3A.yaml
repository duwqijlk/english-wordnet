simpleMeaning: in favor of an action or a plan
scope: Used before a noun for a thing that is in favor of an action or plan; not a reason that supports
  something, and not the word used on its own after a verb.
examples:
- He cast a pro vote for the new road.
- The group ran a pro campaign for the change.
