simpleMeaning: 'The branch of geology that studies minerals: how they are built, what they are like, and
  how to tell them apart.'
scope: 'The branch of geology that studies minerals: how they are built, what they are like, and how to
  tell them apart, not the study of rocks in general and not the study of the earth as a whole.'
examples:
- Mineralogy taught her to tell quartz from feldspar.
- He studied mineralogy to learn how gems form.
