simpleMeaning: A bushy tree of the southern United States with large soft plumes of flowers like puffs
  of smoke.
scope: 'Also called chittamwood, Cotinus americanus, or Cotinus obovatus: a bushy tree of the southern
  United States with large soft plumes of flowers like puffs of smoke, set apart from other bushy trees
  by its smoke-like flower plumes.'
examples:
- American smokewood bloomed with soft plumes in spring.
- The American smokewood stood by the fence.
