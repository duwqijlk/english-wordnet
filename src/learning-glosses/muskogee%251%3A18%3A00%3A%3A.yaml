simpleMeaning: A person of the Muskhogean people, who lived before in Georgia and east Alabama and made
  up the heart of the Creek Confederacy.
scope: A member of a people, not the Muskhogean tongue spoken by the Muskogee; its near kin are the other
  peoples of the Creek Confederacy.
examples:
- The Muskogee man traced his family to Georgia.
- Muskogee people formed the core of the Creek Confederacy.
