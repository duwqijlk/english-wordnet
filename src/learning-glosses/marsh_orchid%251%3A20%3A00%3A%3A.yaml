simpleMeaning: With thick roots shaped like fingers, this plant is one of several kinds in the group Dactylorhiza,
  found in Europe and round the Mediterranean.
scope: This word names one of several kinds in the group Dactylorhiza, set apart from other orchids by
  its fingerlike roots.
examples:
- The marsh orchid grows in Europe and round the Mediterranean.
- We found marsh orchid in Europe, its roots thick and shaped like fingers.
