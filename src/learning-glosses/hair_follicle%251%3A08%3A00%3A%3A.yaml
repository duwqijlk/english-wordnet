simpleMeaning: Small muscles and oil glands are joined to this small tube-shaped hole, which holds the
  root of one thread growing out of the body.
scope: This is a small tube-shaped hole that holds the root of a thread growing out of the body, not the
  thread itself.
examples:
- The hair follicle holds the root of each hair in place.
- A hair follicle holds the root of one hair.
