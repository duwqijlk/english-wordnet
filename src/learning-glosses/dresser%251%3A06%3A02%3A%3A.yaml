simpleMeaning: a low table with one or more mirrors, where a person sits to put on clothes and make up
  their face
scope: Also called vanity. This is the low table with a mirror, not a person who wears clothes in a certain
  way.
examples:
- She sat at the dresser and brushed her hair in the mirror.
- He sat at the dresser in front of the mirror and put on his tie.
