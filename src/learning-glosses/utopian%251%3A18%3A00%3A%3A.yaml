simpleMeaning: A person who holds high hopes for a better world and works to change how people live, though
  such plans seldom work in real life.
scope: A hopeful reformer who dreams of a perfect world, also called a utopian; not a maker of laws and
  not a dreamer who does nothing.
examples:
- The Utopian believed that men could at last live without want.
- A Utopian of the last century planned a town with no poor.
