simpleMeaning: the round flat part of a record player that turns in a circle and holds the record while
  the music plays
scope: The round flat plate on a record player that turns the record; not the turning tray put on a dining
  table to pass food around.
examples:
- He put the record on the turntable and lowered the needle.
- The turntable turns at a steady speed, so the music sounds right.
