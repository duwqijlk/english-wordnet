simpleMeaning: to win the help of a country or an army by giving it money
scope: To win help by giving money, as to a country or army, not to pay for a thing outright and not to
  give money to the poor.
examples:
- The rich state tried to subsidize the small nation.
- They hoped to subsidize the army with gold.
