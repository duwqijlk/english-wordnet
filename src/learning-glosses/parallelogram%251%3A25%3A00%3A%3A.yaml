senseId: 'parallelogram%1:25:00::'
synsetId: 13903832-n
simpleMeaning: a flat shape with four sides, where the sides that face each other go the same way and
  are the same length
scope: A four-sided flat shape whose facing sides are equal and go the same way; not a three-sided shape
  and not a four-sided shape with unequal facing sides.
examples:
- He drew a parallelogram with two long sides and two short sides.
- The field is shaped like a parallelogram, with facing sides the same length.
