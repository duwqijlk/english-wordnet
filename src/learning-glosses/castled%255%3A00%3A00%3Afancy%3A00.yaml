simpleMeaning: with a row of square notches along its top edge, or made to look that way, like the top
  of a castle wall
scope: Also called battlemented, castellated, crenelated, or embattled, this word says a thing has a row
  of square notches along its top edge, or is made to look that way, like a castle wall, not a smooth
  edge and not a pointed top.
examples:
- The castled edge of the old tower stood out against the sky.
- The wood trim had a castled top with a row of square notches.
