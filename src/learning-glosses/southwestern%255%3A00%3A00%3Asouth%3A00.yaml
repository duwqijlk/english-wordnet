simpleMeaning: lying in the part between south and west, or facing toward that part
scope: 'Also called southwest and southwesterly: about a place or direction between south and west, not
  about the south-west region of the United States.'
examples:
- The southwestern corner of the garden gets the evening sun.
- The house has a southwestern side that faces toward the south and west.
