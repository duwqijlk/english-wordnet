simpleMeaning: any of many waders that spend most of their time on sea shores and in river mouths
scope: One of many waders found mostly on sea shores and in river mouths; shorebird and shore bird are
  other names for this sense, not a heron and not a duck that swims.
examples:
- The limicoline bird waded along the shore at low tide.
- Limicoline birds gather in the estuary each winter.
