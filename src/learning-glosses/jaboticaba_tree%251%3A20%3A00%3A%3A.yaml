simpleMeaning: A small evergreen tropical tree native to Brazil and the West Indies, brought to the southern
  US; Brazil grows it for edible, tough-skinned, grape-like purple fruit, which lines the branches.
scope: Another name for the tree called jaboticaba in this lane, not the fruit itself and not a different
  tropical tree.
examples:
- The jaboticaba tree produces fruit all along its branches.
- A jaboticaba tree from Brazil now grows in southern gardens.
