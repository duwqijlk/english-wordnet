simpleMeaning: The breaking down of once-living things as they rot.
scope: The breaking down of once-living things as they rot, not the slow loss of power in a battery and
  not the weak state left behind after such breaking down.
examples:
- The decay of the fallen leaves fed the soil.
- Rot and decay turned the old log to soft earth.
