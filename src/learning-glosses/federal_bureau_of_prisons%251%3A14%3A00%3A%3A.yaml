scope: 'Also called BoP: the Justice Department law arm that runs country-wide jails for people given
  jail time by a court for crimes under national law, not a state jail system and not a court.'
examples:
- The Federal Bureau of Prisons runs jails across the country.
- He was sent to a jail run by the Federal Bureau of Prisons.
