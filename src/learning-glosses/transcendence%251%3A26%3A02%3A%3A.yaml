simpleMeaning: the state of doing very well, doing better than others, or going past the usual limits
scope: 'Also called superiority: the state of going past the usual limits, not just being a little better
  than other people or things.'
examples:
- Her music showed a kind of transcendence that lifted it far above other work.
- He spoke of transcendence as going beyond what people can normally do.
