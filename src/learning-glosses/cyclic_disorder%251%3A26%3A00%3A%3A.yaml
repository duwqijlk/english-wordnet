simpleMeaning: a health problem that lasts a long time, in which a person's mood keeps rising and falling
  but never swings far
scope: A mild mood problem that lasts a long time, also called cyclothymia or cyclothymic disorder; not
  a severe mood swing and not a short change of mood.
examples:
- Her cyclic disorder meant her mood rose and fell for years, though never to the extremes of severe illness.
- The doctor said his cyclic disorder would need care over a long time.
