simpleMeaning: In loose, joking talk, a word for a person whose mind does not work in the usual way
scope: A loose, joking word for a mind that does not work in the usual way; also called around the bend,
  balmy, barmy, bats, batty, bonkers, buggy, cracked, crackers, daft, dotty, fruity, haywire, kooky, loco,
  loony, loopy, nuts, nutty and wacky, and not a formal word for mental illness.
examples:
- After three nights without sleep, he started talking in a kookie way.
- She gave a kookie laugh and said the moon was following her.
