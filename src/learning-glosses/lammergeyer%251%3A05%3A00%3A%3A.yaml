simpleMeaning: The biggest hunting bird of Europe and Asia, with black feathers hanging around its beak.
scope: The biggest hunting bird of Europe and Asia, with black feathers hanging around its beak; bearded
  vulture and lammergeier are other names for this sense, not a smaller hunting bird, and not an eagle
  with a white head.
examples:
- A lammergeyer circled high above the mountain valley.
- The lammergeyer dropped a bone onto the rocks below.
