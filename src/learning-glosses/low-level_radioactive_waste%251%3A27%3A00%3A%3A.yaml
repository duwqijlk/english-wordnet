simpleMeaning: In medicine, rubbish that gives off only a small amount of harmful rays, made of things
  left for a short time near such rays, as in some medical tests.
scope: In medicine, this is rubbish that gives off only a small amount of harmful rays, not rubbish that
  gives off a great deal and not ordinary hospital rubbish.
examples:
- Low-level radioactive waste from the test was sealed in drums.
- The hospital stores its low-level radioactive waste in a locked room.
