simpleMeaning: Traits that usually pass down together because the units of inheritance behind them sit
  close together; all the units on one thread travel together.
scope: Also called linkage, this is about traits that pass down together, not a single trait or traits
  that pass down on their own.
examples:
- Gene linkage explains why red hair and pale skin often go together.
- Scientists use gene linkage to map traits that are passed down together.
