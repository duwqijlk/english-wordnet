simpleMeaning: A strong looped thread pattern that keeps an edge firm, as round a fastener opening.
scope: A strong looped thread pattern for edges, not a plain running thread pattern and not a hem.
examples:
- She used a buttonhole stitch to firm up the slit edges.
- A buttonhole stitch keeps the edge from fraying.
