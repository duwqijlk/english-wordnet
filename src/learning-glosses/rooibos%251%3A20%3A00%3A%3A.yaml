simpleMeaning: 'Its dried leaves smell strong and make a tea from herbs: this shrub from South Africa
  has flat, pointed leaves and yellow flowers'
scope: Its dried leaves are used to make a tea from herbs, not a drink made from the leaves of the tea
  plant.
examples:
- A pot of rooibos tea was made from the dried leaves.
- The dried leaves of rooibos went into a pot of herbal tea.
