simpleMeaning: heated and made hard by sunlight, but not burned
scope: Made hard by the sun and not burned; not the other sense of dried out by heat or too much sun.
examples:
- The sunbaked bricks were hard and ready to use.
- The sunbaked pot was hard after a day in the sun, and it was not burned.
