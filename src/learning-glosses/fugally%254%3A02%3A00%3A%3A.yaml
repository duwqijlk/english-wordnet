simpleMeaning: In the style of a fugue, a piece of music in which a short tune is taken up in turn by
  each voice
scope: In the style of a fugue; not in a free style and not in the style of a song.
examples:
- The choir sang the passage fugally, each voice taking up the tune.
- He played the theme fugally on the organ.
