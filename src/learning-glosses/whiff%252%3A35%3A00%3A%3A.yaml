simpleMeaning: In baseball, to miss the ball with a swing on the third strike, and so be out.
scope: In baseball, to swing and miss on the third strike so the batter is out, not the strikeout as a
  thing in itself, not a flat fish, and not taking in a smell through the nose.
examples:
- He whiffed at the fast ball and walked back to the bench.
- The batter whiffed on the third pitch and was out.
