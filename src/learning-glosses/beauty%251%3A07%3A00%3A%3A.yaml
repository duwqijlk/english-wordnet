simpleMeaning: the qualities that make something a pleasure to look at, hear or otherwise sense.
scope: This is not a particular lovely person or thing, but the pleasing qualities themselves.
examples:
- The beauty of the coastline draws visitors from everywhere.
- She was moved by the beauty of the old song.
