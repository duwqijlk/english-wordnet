simpleMeaning: This describes a leaf edge that is unbroken and lacks tooth-like divisions.
scope: This describes a leaf's unbroken edge, not the even texture of a surface or the lack-of-difficulty
  sense.
examples:
- The plant's leaves are smooth along the edge, with no notches at all.
- Botanists call this species smooth because its leaf edges have no teeth.
