simpleMeaning: In the years after the supposed birth of Christ; put in front of a year number.
scope: A mark of the Christian years, also called A.D. or anno Domini; not an advert, and not a year number
  on its own.
examples:
- The church was built in AD 200.
- AD comes before the year.
