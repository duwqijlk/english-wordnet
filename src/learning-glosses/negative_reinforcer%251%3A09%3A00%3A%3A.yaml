simpleMeaning: Something whose taking away makes an action less likely to happen again.
scope: Something whose taking away makes an action less likely to happen again, also called negative reinforcing
  stimulus; not a reward and not a punishment.
examples:
- The teacher used a negative reinforcer to make the shouting less likely.
- Removing the loud buzz worked as a negative reinforcer, so the dog stopped barking.
