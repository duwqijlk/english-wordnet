simpleMeaning: From raw stuff to the buyer, every step of making and selling a product ends up inside
  one firm.
scope: Also called vertical combination, it is one of the ways firms join together, covering every part
  of making and selling a product, from raw stuff to the buyer.
examples:
- One firm controlled the whole chain, from raw stuff to the shops, by vertical integration.
- The company grew by vertical integration, taking over each step of making and selling its goods.
