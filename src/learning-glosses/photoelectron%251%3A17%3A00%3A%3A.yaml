simpleMeaning: a tiny bit of matter with a charge, knocked out of an atom or a molecule by a bit of light
scope: A tiny bit of matter with a charge, knocked out of an atom or a molecule by a bit of light; not
  a bit of light itself and not a bit of matter knocked out by heat.
examples:
- A photoelectron flew out of the atom when the bit of light struck it.
- The detector caught each photoelectron as it left the molecule.
