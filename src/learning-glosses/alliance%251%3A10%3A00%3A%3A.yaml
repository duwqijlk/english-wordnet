simpleMeaning: a formal agreement between countries or other groups that joins them together so they can
  reach a set aim
scope: This is the formal agreement itself that joins countries or groups, not the act of making such
  an agreement.
examples:
- The two countries signed an alliance to protect each other.
- Their alliance helped them work together to win the war.
