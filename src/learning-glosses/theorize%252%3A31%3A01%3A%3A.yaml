senseId: 'theorize%2:31:01::'
synsetId: 00634593-v
simpleMeaning: to make ideas that try to explain why things happen or how they work
scope: This is making ideas to explain things in general, not believing something for reasons that are
  not certain, and not making an explanation about one particular topic.
examples:
- She likes to theorize, and she makes a new idea for every hard question.
- He spends his days theorizing, putting forward ideas to explain how the world works.
