simpleMeaning: Iron from the furnace that holds manganese, used to take oxygen out and to add manganese
  when making steel.
scope: Also called spiegel iron and spiegeleisen, this is iron from the furnace that holds manganese,
  used to take oxygen out and to add manganese when making steel, not the steel itself and not plain iron
  without manganese.
examples:
- The workers added spiegel to the hot metal in the furnace.
- Spiegel raised the manganese in the steel.
