simpleMeaning: in a way that has to do with living things and how they live, grow, and work
scope: About living things and how their bodies live and grow; not about rocks, air, or other things that
  are not alive.
examples:
- The two plants are biologically different, even though they look the same.
- Humans and apes are biologically close to each other.
