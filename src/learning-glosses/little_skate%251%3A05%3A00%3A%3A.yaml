simpleMeaning: The flat sea fish that is most common in the shallow waters off North America in summer,
  growing to 21 inches long.
scope: This is the flat sea fish most often found in shallow North American waters in summer, not a larger
  deep-water skate and not a stingray.
examples:
- Little skates are the most common skates in the bay in summer.
- The fishermen caught a little skate only 21 inches long.
