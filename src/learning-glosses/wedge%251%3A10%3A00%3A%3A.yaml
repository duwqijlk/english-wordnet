simpleMeaning: a small mark like an upside-down V placed above some letters, such as c, to show how the
  letter is said
scope: A small mark above a letter, not the large sandwich, not the solid piece that splits things apart,
  and not the golf club.
examples:
- In Czech writing, the letter č carries a wedge.
- The teacher drew a wedge above the c to show its sound.
