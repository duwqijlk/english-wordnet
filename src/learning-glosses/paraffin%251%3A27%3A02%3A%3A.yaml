simpleMeaning: a group of chemicals made of carbon and hydrogen only, with no ring shape, where each carbon
  holds as much hydrogen as it can, following the pattern CnH(2n+2)
scope: This chemical group, also called alkane, alkane series, methane series and paraffin series, is
  not the wax used for candles and not the British word for a fuel oil.
examples:
- Methane is the first chemical in the paraffin group.
- The teacher listed the paraffin chemicals in order, from methane to larger ones.
