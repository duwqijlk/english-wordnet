scope: A group of early plants with two seed leaves, mostly flowers, not a single plant and not a later
  group of flowering plants.
examples:
- The caryophylloid dicot genus holds several kinds of early flowering plants.
- Botanists place this flower in a caryophylloid dicot genus.
