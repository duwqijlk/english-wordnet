simpleMeaning: Now growing wild in New Zealand, this crowfoot of Europe and Asia lives for years, grows
  in and near water, and bears leaves shaped like pointed blades.
scope: This crowfoot of Europe and Asia is the one with leaves shaped like pointed blades that now grows
  wild in New Zealand.
examples:
- The lesser spearwort lives for years in and near water.
- Its leaves are shaped like pointed blades, and the lesser spearwort now grows wild in New Zealand.
