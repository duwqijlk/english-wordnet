senseId: 'defeasible%3:00:00::'
synsetId: 00697535-a
simpleMeaning: able to be ended or made to have no force
scope: A claim or right that can be ended or made to have no force; not a claim that is fixed for all
  time, and not one that is already ended.
examples:
- The court held that the grant was defeasible if the conditions were not met.
- A defeasible title can be taken away when the owner breaks the terms.
