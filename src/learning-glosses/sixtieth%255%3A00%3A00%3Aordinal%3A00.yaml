simpleMeaning: The place of sixty in a count, coming after fifty-nine others.
scope: For a name on a list, or a runner in a race, in the sixtieth place.
examples:
- Her name was sixtieth on the long list of runners.
- Of the sixty runners, she finished sixtieth.
