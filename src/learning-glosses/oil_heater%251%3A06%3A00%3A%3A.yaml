simpleMeaning: A device that burns liquid fuel to give heat or to cook.
scope: A device that burns liquid fuel to give heat or to cook, also called oilstove, kerosene heater
  and kerosine heater; not a device that warms with gas and not a device that warms with power from the
  mains.
examples:
- They lit the oil heater to warm the room.
- She cooked supper on the oil heater.
