simpleMeaning: a small insect heard ticking in the wood it bores through, taken by many as a sign that
  a life would soon end
scope: This is the ticking wood-boring beetle, also called deathwatch; not a beetle that eats crops and
  not a moth that eats cloth.
examples:
- The deathwatch beetle had bored holes in the old floorboards.
- We heard the deathwatch beetle ticking in the wall.
