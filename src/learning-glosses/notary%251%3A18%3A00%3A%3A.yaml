simpleMeaning: a person with legal power to see people sign papers, say a paper is true, and take statements
  given under a promise to tell the truth
scope: 'Also called notary public: this person watches people sign papers and says papers are true, not
  a lawyer and not just a person who saw an event.'
examples:
- A notary checked our names and watched us sign the paper.
- Take the form to a notary so she can say the paper is true.
