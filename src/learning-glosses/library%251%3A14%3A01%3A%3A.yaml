simpleMeaning: In computing, a stored set of ready-made programs and routines that a computer can use
  at once.
scope: This is a set of software code, not a collection of books or records, and not the room or building
  where books are kept.
examples:
- The developers linked the graphics library into the game engine.
- This library provides ready-made functions for handling dates.
