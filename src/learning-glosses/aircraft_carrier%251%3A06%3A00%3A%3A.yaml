simpleMeaning: The long flat top where planes leave and land belongs to a big fighting ship built to carry
  them.
scope: The big fighting ship that carries planes on a long flat top is also called a carrier, an attack
  aircraft carrier, or a flattop.
examples:
- The aircraft carrier sailed out to sea with planes on its long flat deck.
- A plane landed back on the aircraft carrier after its flight.
