simpleMeaning: With big eyes and ears and thick soft fur, this quick long tailed animal of Africa comes
  out at night; it is a kind of lemur
scope: Also called bush baby and bushbaby, a quick long tailed animal of Africa that comes out at night,
  not a monkey.
examples:
- The galago sat in the tree with its big eyes open in the dark.
- A galago leapt from branch to branch with its long tail out behind it.
