simpleMeaning: any of many plants grown in many places for their showy flowers, single or double, in red,
  pink or white
scope: Any of many plants grown in many places for their showy flowers, single or double, in red, pink
  or white; peony is another name for this sense, and it is not a wild flower grown for its leaves or
  a plant with small plain flowers.
examples:
- The paeony in the garden has large pink flowers.
- She planted a white paeony by the wall.
