simpleMeaning: Rays that give atoms an electric charge are read by this tool, which shows how much of
  them is in a place
scope: A tool that tells how much radiation is in a place, also called an ionization tube; not a tool
  that makes rays and not a tool that counts whole atoms.
examples:
- The ionization chamber showed how much radiation was in the room.
- They checked the ionization chamber before going into the lab.
