simpleMeaning: The change in the direction of a moving wave of light or sound when it passes from one
  substance into another.
scope: The change in the direction of a moving wave of light or sound when it passes from one substance
  into another, not how much such a wave is bent.
examples:
- Refraction makes a straw in a glass of water look bent.
- The refraction of light through the lens brought the image into focus.
