simpleMeaning: A member of a Penutian people who lived on rivers and a narrow arm of the sea in British
  Columbia.
scope: A member of a Penutian people of rivers and a narrow arm of the sea in British Columbia, not the
  language of that people and not a member of another coastal people.
examples:
- The Tsimshian fished the rivers of British Columbia.
- A Tsimshian elder told stories of the sound.
