schema: oewn-learning-gloss-v2
senseId: 'stratified_sampling%1:04:00::'
synsetId: 00163238-n
simpleMeaning: a way of picking some people or things by first splitting all of them into smaller groups
  and then picking some at random from each group
scope: This is a way of picking some people or things from smaller groups, also called proportional sampling
  and representative sampling; not picking from the whole group at once and not picking only from one
  group.
examples:
- Stratified sampling gives each small group a fair share in the test.
- They used stratified sampling to pick people from every age group.
