simpleMeaning: Bunches of sweet-smelling pink or white flowers grow on this low shrub of eastern North
  America, which keeps its tough leaves all year.
scope: Also called a mayflower, this is the low shrub with bunches of sweet-smelling pink or white flowers.
examples:
- The trailing arbutus was covered with sweet-smelling pink flowers.
- Trailing arbutus smells sweet when its pink flowers open.
