simpleMeaning: A great ring on the sky that runs through both poles of the sky
scope: This is a great ring on the sky passing through both poles, not a line of latitude around the earth
  and not the path the sun seems to follow.
examples:
- The hour circle passes through the north and south celestial poles.
- Astronomers drew the hour circle on the star chart.
