simpleMeaning: A North American willow, shrubby in form, with dark bark and narrow leaves, growing near
  streams and lakes.
scope: A North American shrubby willow with dark bark and narrow leaves, growing close to streams and
  lakes, not a white willow or a weeping willow, also called black willow and swamp willow.
examples:
- Salix nigra grows along the creek.
- The dark bark of Salix nigra marked it from other willows.
