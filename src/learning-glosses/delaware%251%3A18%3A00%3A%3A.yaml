simpleMeaning: A member of an Algonquian people who once lived in New Jersey and New York and in parts
  of what are now Pennsylvania and the state of the same name.
scope: 'Also called Lenape: a member of an Algonquian people once living in New Jersey, New York, and
  parts of Pennsylvania and the state of the same name, set apart from the Delaware tongue by its sense
  of a person.'
examples:
- His grandmother was a Delaware who grew up in New Jersey.
- The Delaware once lived in New Jersey and in parts of Pennsylvania.
