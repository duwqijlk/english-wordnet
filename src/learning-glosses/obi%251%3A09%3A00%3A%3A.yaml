simpleMeaning: a faith from Africa that uses spells and magic, followed in parts of the West Indies and
  the warm parts of the Americas
scope: 'Also called obeah: a faith built on spells and magic, not the people who follow such a faith.'
examples:
- Many people in Jamaica still turn to obi when they want help from the unseen world.
- The old man was said to know obi and to use it to protect his family.
