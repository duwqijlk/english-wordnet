simpleMeaning: A pill taken by mouth that works well at bringing down blood fats; strong at bringing down
  LDL cholesterol because bigger amounts can be taken
scope: Also called atorvastatin; this is the pill that brings down blood fats and LDL cholesterol, not
  other pills that bring down cholesterol.
examples:
- The doctor gave her Lipitor for high cholesterol.
- Lipitor brought his cholesterol down.
