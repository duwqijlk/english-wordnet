simpleMeaning: For weeks after a baby is born, the birth canal gives off less and less of a mix of blood,
  slime, and bits of cells
scope: The discharge that follows childbirth, getting less over weeks.
examples:
- The nurse told her the lochia would get lighter over the next few weeks.
- She asked the doctor how long the lochia would last after the birth.
