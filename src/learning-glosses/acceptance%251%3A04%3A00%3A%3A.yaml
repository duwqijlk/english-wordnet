simpleMeaning: the act of taking a thing in with approval, and the welcome it gets
scope: Also called adoption; taking a thing in with approval, not merely putting up with people or things,
  and not saying yes to the terms of an offer in law.
examples:
- Her new book met with warm acceptance from readers.
- The plan won quick acceptance at the meeting.
