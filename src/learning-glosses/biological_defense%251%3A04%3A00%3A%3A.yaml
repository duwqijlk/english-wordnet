simpleMeaning: ways to guard against harm from germs, viruses, or poisons used as weapons
scope: 'Also called biodefence, biodefense, and biological defence: ways to guard against harm from germs,
  viruses, or poisons used as weapons, not the harm itself and not a plan against chemical weapons.'
examples:
- New labs improved biological defense across the region.
- Her job in biological defense is to plan ways to keep people safe from germs.
