simpleMeaning: The act of giving in to a wish and pleasing it.
scope: Also called indulgence, indulging, or humoring, the act of giving in to a wish and pleasing it;
  not the adjective use for pleasing tastes, appetites, or wishes.
examples:
- The pampering of the child knew no limits.
- She enjoyed the pampering after her long week.
