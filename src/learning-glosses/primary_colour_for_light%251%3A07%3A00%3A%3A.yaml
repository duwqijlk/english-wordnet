simpleMeaning: one of three main shades of glow that can be added together to make every other shade
scope: 'Also called primary color for light: one of three main shades of glow that can be added together
  to make every other shade, not a main shade used for paint.'
examples:
- The primary colours for light are red, blue, and green.
- Green is a primary colour for light, so it can help make other shades when mixed with red and blue.
