simpleMeaning: powerful and steady, so that it can be relied on
scope: This sense means forceful and certain together, not a powerful effect on the body or in chemistry,
  safety from attack, or a drink with a lot of alcohol.
examples:
- He kept a strong and sure grip on the rope.
- Her voice was strong and sure as she gave the order.
