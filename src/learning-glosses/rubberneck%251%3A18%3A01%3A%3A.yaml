simpleMeaning: A sightseer out looking at sights of note.
scope: This sense is also called sightseer, tripper, and excursionist, for a sightseer out looking at
  sights of note, unlike the sense for straining to watch, or staring with wonder.
examples:
- The rubberneck is a sightseer out looking at sights.
- Rubbernecks look at sights of note.
