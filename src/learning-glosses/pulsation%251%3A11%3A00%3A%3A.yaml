senseId: 'pulsation%1:11:00::'
synsetId: 07435591-n
simpleMeaning: In electronics, a brief wave that jumps up and drops back sharply, breaking the steady
  state of a circuit for a moment, alone or one after another.
scope: A sudden short wave in electronics that breaks the steady flow of power, also called a pulse or
  an impulse and also called pulsing; not a thing that keeps returning, with some amount going up and
  then down in turn, and not the steady squeeze and swell of the arteries with each beat of the heart.
examples:
- The pulsation on the meter showed a sharp wave in the circuit.
- A single pulsation broke the steady flow of power for a moment.
