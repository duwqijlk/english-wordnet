simpleMeaning: like croup, a throat illness that makes a harsh cough, or caused by it, or a sign of it
scope: Like or caused by croup, a throat illness that makes a harsh cough, or a sign of it; not croup
  itself and not any other throat illness.
examples:
- The child's croupy cough kept her awake all night.
- The doctor heard the croupy sound of his breathing and asked about croup.
