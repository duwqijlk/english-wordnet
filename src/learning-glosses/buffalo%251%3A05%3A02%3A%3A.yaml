simpleMeaning: a large brown animal with long rough hair that lives on the flat open lands of North America
scope: The large brown animal of North America with long rough hair, not the ox-like animals of Asia and
  Africa and not meat from this animal.
examples:
- A buffalo stood on the flat land, its long brown hair moving in the wind.
- Long ago, great groups of buffalo lived across North America.
