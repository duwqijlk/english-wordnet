simpleMeaning: the act of putting up with something you do not like, without trying to stop it
scope: The act of putting up with something, not a willingness to respect other people's beliefs and not
  a body's power to stand bad conditions.
examples:
- His tolerance of the noise surprised us.
- She showed great tolerance toward her noisy neighbours.
