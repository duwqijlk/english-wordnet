simpleMeaning: Too little vitamin A in the whole body may leave the thin cover and the clear front of
  the eyes unusually dry
scope: Conjunctivitis arida, xerophthalmia and xerophthalmus are other names for this unusual dryness
  of the thin cover and the clear front of the eyes, which may come from too little vitamin A in the whole
  body.
examples:
- The thin cover of the eyes grows unusually dry in xeroma.
- The eyes stay unusually dry with xeroma.
