simpleMeaning: Several kinds of climbing plant bear fruit with a net-like skin, flesh people can eat,
  and a musky smell.
scope: This is a climbing plant whose fruit has a net-like skin and flesh people can eat; muskmelon and
  sweet melon are other names for this sense.
examples:
- The sweet melon vine bore fruit with a net-like skin.
- Fruit hung from the sweet melon vine.
