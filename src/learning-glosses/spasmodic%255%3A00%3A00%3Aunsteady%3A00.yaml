senseId: spasmodic%5:00:00:unsteady:00
synsetId: 02311435-s
simpleMeaning: Shaken by jerks of the muscles that one cannot control, like a spasm.
scope: Also called convulsive or spastic, this is about jerks of the muscles one cannot control, not about
  something that happens in spells and often comes on all at once.
examples:
- His movements were spasmodic, jerking without warning.
- Her arm was spasmodic after the cramp, twitching again and again.
