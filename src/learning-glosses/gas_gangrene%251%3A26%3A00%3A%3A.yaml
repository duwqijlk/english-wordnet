simpleMeaning: In pathology, body tissue dies from poisons made by clostridium germs, usually in a deadly
  sickness that can be used as a weapon made from germs.
scope: Also called clostridial myonecrosis, emphysematous gangrene, emphysematous phlegmon, gangrenous
  emphysema, gas phlegmon and progressive emphysematous necrosis, this is a deadly sickness in which body
  tissue dies.
examples:
- Gas gangrene killed the tissue.
- He died of gas gangrene.
