simpleMeaning: In salads, a pinch of its bitter leaves adds bite, while its dried flowers go into soups
  and herbal teas.
scope: This herb gives bitter leaves for salads, a little at a time, and dried flowers for soups and herbal
  teas.
examples:
- A few hyssop leaves gave the salad a bitter taste.
- Dried hyssop flowers went into the soup.
