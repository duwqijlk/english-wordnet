simpleMeaning: a way of behaving that shows a person is far too eager to obey others, in a weak and fearful
  way
scope: 'Also called servility and obsequiousness: a weak, fearful way of obeying others too much; not
  just the state of being under another person''s control.'
examples:
- His subservience to the boss made his co-workers feel uneasy.
- She showed no subservience and spoke to the manager as an equal.
