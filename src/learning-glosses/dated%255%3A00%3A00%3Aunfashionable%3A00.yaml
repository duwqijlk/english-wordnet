simpleMeaning: showing the marks of the recent past, usually in a way people now look down on
scope: Out of fashion because it belongs to the recent past, not old in the sense of being from long ago
  and not simply showing a date.
examples:
- Her dated clothes made her feel out of place at the party.
- The dated slang in the film showed it was made ten years ago.
