simpleMeaning: something someone suggests for others to think about, such as a plan or an idea that is
  taken as true
scope: The plan or idea that is put forward, not the act of putting it forward and not a request to marry
  someone.
examples:
- The council discussed her proposal to build a new park.
- His proposal that the earth moves was hard to accept at the time.
