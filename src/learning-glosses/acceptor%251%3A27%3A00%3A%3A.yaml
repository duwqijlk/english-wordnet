simpleMeaning: In chemistry, the compound that takes in electrons from another compound when the two join
  in a bond where one side gives both shared electrons
scope: In chemistry, it is the compound that takes in electrons, not the person who takes on a check or
  draft.
examples:
- In the reaction the acceptor takes in the pair of electrons.
- The metal ion acts as the acceptor in the new bond.
