simpleMeaning: A member of an Iroquoian Native people who once lived on the south shore of a great lake
  in northern Ohio, north-west Pennsylvania and western New York
scope: A member of a Native people of the north-east who once lived on the south shore of a great lake,
  not the lake of the same name.
examples:
- The Erie once lived on the south shore of the great lake.
- Erie families farmed the land in northern Ohio.
