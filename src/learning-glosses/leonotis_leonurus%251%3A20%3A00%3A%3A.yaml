scope: A South African herb smoked like tobacco, also called dagga, red dagga, wilde dagga and Cape dagga;
  not tobacco itself and not a strongly poisonous herb.
examples:
- Leonotis leonurus is smoked like tobacco in South Africa.
- The dried leaves of Leonotis leonurus were rolled and smoked.
