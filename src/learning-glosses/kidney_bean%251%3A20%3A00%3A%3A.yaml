simpleMeaning: A common plant grown for the seeds in its pods rather than for the pods, above all a kind
  with large red seeds curved on one side.
scope: This is a common plant grown for the seeds in its pods rather than for the pods, above all a kind
  with large red seeds curved on one side; frijol and frijole are other names for it, not a plant grown
  for its pods such as a green bean.
examples:
- Kidney beans grow on a plant kept for its beans, not its pods.
- She planted kidney beans with large red seeds.
