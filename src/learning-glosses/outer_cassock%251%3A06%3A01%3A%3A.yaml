simpleMeaning: a loose, full outer robe worn over the inner robe by bishops, priests, deacons, and monks
  and nuns as their everyday outer dress
scope: 'Also called outer rason: a loose outer robe worn over the inner robe by church leaders, not the
  inner robe itself.'
examples:
- The bishop wore his outer cassock over the inner one for the evening service.
- An outer cassock hangs loose and full over the priest's other robes.
