simpleMeaning: A person is tied to this upright post to be burned to death.
scope: A post for tying a person to be burned, not a sharp pole used to kill, and not a post set up to
  mark a place.
examples:
- In old stories, witches were tied to the stake and burned.
- The stake stood in the town square where the burning took place.
