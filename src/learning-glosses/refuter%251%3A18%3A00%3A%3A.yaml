simpleMeaning: A person in a debate who shows a claim is wrong by giving facts or reasons against it.
scope: 'Also called confuter, disprover or rebutter: a person in a debate who shows a claim is wrong by
  giving facts or reasons against it, not a person who merely disagrees, and not a person who argues for
  the claim.'
examples:
- The refuter answered each point with facts.
- As refuter, she showed the claim was wrong.
