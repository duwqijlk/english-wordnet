simpleMeaning: Under the tongue, spit runs into the mouth from this gland, one on each side of the lower
  jaw, which makes most of the spit made at night.
scope: 'Also called mandibular gland, submandibular gland, submandibular salivary gland, and submaxillary
  gland: a spit gland in the lower jaw, on both sides of the mouth.'
examples:
- The doctor pressed the submaxillary salivary gland under her jaw.
- The submaxillary salivary glands make most of the saliva at night.
