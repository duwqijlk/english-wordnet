simpleMeaning: a tree from Australia and lands near it that keeps its leaves all year, with white or silver-like
  bark, young leaves, and yellow flowers
scope: This is the tree from Australia and lands near it, with white or silver-like bark, young leaves
  and yellow flowers; not the champagne and orange juice drink, and not other mimosa shrubs or trees from
  warm lands with yellow flowers and leaves made of many small parts.
examples:
- The mimosa by the road had white bark and bright yellow flowers.
- In Australia, we saw a mimosa with silvery bark and yellow flowers.
