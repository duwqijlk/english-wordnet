simpleMeaning: The group of Kamarupan ways of speaking used in western Burma and Bangladesh and in the
  far east of India.
scope: The group of Kamarupan ways of speaking of western Burma, Bangladesh and far eastern India, also
  called Chin, Chin language, Kuki, Kuki-Chin and Kuki language; its near kin are other Kamarupan language
  groups.
examples:
- The Kuki-Chin language is one of the Kamarupan languages.
- People speak the Kuki-Chin language in Bangladesh.
