simpleMeaning: Before a liquid or gas can split into simpler parts, it must take in this much warmth
scope: The warmth a liquid or gas takes in to split into simpler parts, not the warmth given off when
  a liquid turns solid and not the warmth taken in when a liquid turns to gas.
examples:
- The chemist measured the heat of dissociation of the gas.
- Heat of dissociation tells us how much warmth a liquid needs to split apart.
