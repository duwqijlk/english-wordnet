senseId: 'discretionary_trust%1:21:00::'
synsetId: 13383713-n
simpleMeaning: An arrangement in which a person in charge may pay the one it is for as much of the money
  it brings in as that person thinks fit.
scope: An arrangement in which a person in charge may pay the one it is for as much of the money it brings
  in as that person thinks fit, not an arrangement with fixed amounts to pay and not one with no one in
  charge.
examples:
- Under a discretionary trust, the person in charge may pay her as much as seems right.
- The discretionary trust lets the person in charge choose how much to pay him.
