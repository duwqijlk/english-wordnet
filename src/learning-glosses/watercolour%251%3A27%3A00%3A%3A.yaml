simpleMeaning: colouring matter that can mix into water
scope: The colouring matter itself, also called watercolor; it is not a finished picture and not the act
  of painting.
examples:
- This watercolour is a fine powder that mixes easily with water.
- She chose a blue watercolour for its bright, clean colour.
