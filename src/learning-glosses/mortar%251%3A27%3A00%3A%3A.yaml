simpleMeaning: a mix used to hold bricks or stones together in a wall, or to cover a wall
scope: The mix that holds bricks or stones together or coats a wall, not the gun that fires shells, the
  bowl for grinding, or the act of spreading it on a wall.
examples:
- The builder spread mortar on the bricks before laying the next row.
- They used fresh mortar to cover the cracks in the old garden wall.
