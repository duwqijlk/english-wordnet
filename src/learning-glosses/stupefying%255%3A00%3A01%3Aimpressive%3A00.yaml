senseId: stupefying%5:00:01:impressive:00
synsetId: 01286247-s
simpleMeaning: So impressive that it takes a person by surprise and leaves them stunned and unable to
  take it in.
scope: Also called astonishing, staggering, or astounding, so impressive that it takes a person by surprise
  and leaves them stunned and unable to take it in, not a thing that makes a person dull and senseless.
examples:
- The news was stupefying, and they sat in silence for a long time.
- The size of the gift was stupefying to everyone in the room.
