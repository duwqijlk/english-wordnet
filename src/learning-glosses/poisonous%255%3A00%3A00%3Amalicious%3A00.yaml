simpleMeaning: full of strong hate and meant to hurt someone on purpose
scope: 'Also called vicious and venomous: words, feelings or talk full of hate and meant to hurt; not
  able to hurt or kill the body, which is the other poisonous sense.'
examples:
- He spread poisonous gossip about his workmate on purpose.
- Her poisonous words were meant to turn everyone against him.
