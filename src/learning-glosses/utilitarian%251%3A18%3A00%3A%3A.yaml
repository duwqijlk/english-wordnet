simpleMeaning: a person who thinks how good a thing is depends on how useful it is
scope: This is the person who holds this belief; not the describing word for a thing that is useful, often
  with other values left out.
examples:
- As a utilitarian, he judged each plan by how much good it did.
- The utilitarian said a school is good if it helps many children learn.
