simpleMeaning: Of mosses, having the egg-making parts on short side branches
scope: Said of mosses with egg-making parts on short side branches, not of mosses that bear them at the
  tips and not of flowering plants.
examples:
- The moss was pleurocarpous, with its egg-making parts on short side branches.
- The pleurocarpous moss had its egg-making parts on short side branches.
