simpleMeaning: Soil, clay or chalk is eaten by some early peoples, and at times by people short of food
  or with a fixed habit of mind.
scope: This eating of soil, clay or chalk is also called geophagia.
examples:
- Geophagy was found among some early peoples.
- Geophagy was found in a woman short of food.
