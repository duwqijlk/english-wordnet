simpleMeaning: To get drink or food down your throat in a hurry, or all in one go, because you want it
  all now
scope: Swallowing fast or greedily, not the short noise in the throat and not the throat reflex.
examples:
- The men gulped down their beers.
- He gulped down his water after the long run.
