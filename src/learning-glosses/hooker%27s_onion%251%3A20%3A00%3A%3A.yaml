simpleMeaning: A common North American wild plant with a strong smell and pink flowers in a cluster atop
  a leafless stalk; British Columbia to California, Arizona, east to Wyoming and Colorado.
scope: Also called Allium acuminatum; a wild plant with pink flowers on a bare stalk, not a garden plant
  grown for its bulbs and not a wild garlic.
examples:
- Hooker's onion grows wild in the dry hills.
- We saw Hooker's onion blooming pink on the trail.
