simpleMeaning: Usually, a person loses to something that beats them, though they did nothing wrong and
  are not weak
scope: To beat someone who has done nothing wrong and is not weak, also called overcome and get the best;
  not to beat someone who is at fault and not to win by luck.
examples:
- Heart disease had the best of him in the end.
- The illness had the best of her, though she had done nothing wrong.
