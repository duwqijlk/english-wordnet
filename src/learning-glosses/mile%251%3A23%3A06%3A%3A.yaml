simpleMeaning: a former British length unit of 6,080 feet (1,853.184 meters), 800 feet longer than the
  standard 5,280-foot land unit
scope: The old Admiralty or geographical 6,080-foot unit, not the 1,852-meter international navigation
  unit or the 6,000-foot British sea unit.
examples:
- Old naval charts of the period were marked in Admiralty miles.
- The Admiralty mile had largely fallen out of use by the twentieth century.
