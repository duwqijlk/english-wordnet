simpleMeaning: a female person who works on a trading ship and has been taught special skills for the
  work
scope: This is a trained female person who works on a trading ship, also called able seawoman; not a person
  in the navy and not a worker on a ship with no special training.
examples:
- The able-bodied seawoman stood watch on the deck through the night.
- As an able-bodied seawoman, she had learned to steer the ship and mend the sails.
