simpleMeaning: of a book, song, play, or work of art, kept by law so that its owner controls who may copy
  it
scope: A work kept by law for its owner; not a work free for anyone to copy.
examples:
- The song is copyrighted, so you need permission to use it.
- Copyrighted books cannot be copied freely.
