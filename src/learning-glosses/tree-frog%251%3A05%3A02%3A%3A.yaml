simpleMeaning: a frog that lives up in branches, usually with sticky pads at the end of each toe, found
  in south-east Asia, Australia, and America
scope: 'Also called a tree frog or a tree toad: a frog that lives in trees, not a ground frog and not
  the Old World tree-frog with suckers on its toes.'
examples:
- A tree-frog clung to the branch with its sticky toes.
- Tree-frogs sang from the branches after the rain.
