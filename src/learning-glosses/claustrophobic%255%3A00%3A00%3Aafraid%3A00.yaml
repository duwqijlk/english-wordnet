simpleMeaning: having a strong fear of closed-in places that goes beyond what is normal
scope: Having a strong fear of closed-in places that goes beyond what is normal; not a fear of open spaces,
  and not simple dislike of crowds.
examples:
- She feels claustrophobic in a crowded lift.
- Small closed rooms make him feel claustrophobic.
