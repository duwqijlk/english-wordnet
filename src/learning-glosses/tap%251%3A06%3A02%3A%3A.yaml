simpleMeaning: a tool used to cut grooves inside a hole, so a screw or bolt can be turned into the hole
scope: A tool that cuts grooves inside a hole, not a part for letting water out, not a metal plate on
  a shoe, and not the act of cutting such grooves.
examples:
- He used a tap to cut the grooves inside the metal hole.
- Pick a tap with the right size for the screw you want to fit.
