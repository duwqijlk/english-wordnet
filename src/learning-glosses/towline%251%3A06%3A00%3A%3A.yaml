simpleMeaning: For boats and ships, a rope used to pull a boat or ship behind another one
scope: 'Also called towrope: a rope for pulling a boat or ship behind another one. Not the boat itself
  and not the act of pulling.'
examples:
- The towline broke, and the small boat drifted away from the ship.
- They tied a strong towline between the two boats before they set off.
