senseId: 'dioptre%1:23:00::'
synsetId: 13606121-n
simpleMeaning: For a lens, the power it has to bend light, given as one over the length to its focus in
  metres, a number eye doctors use
scope: A measure of a lens's power, also called diopter; not the lens itself.
examples:
- The dioptre of her new lens was plus two.
- The optician noted the dioptre on the prescription.
