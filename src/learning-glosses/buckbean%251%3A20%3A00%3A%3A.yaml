simpleMeaning: A perennial plant of Europe and America with intensely bitter three-part leaves and clusters
  of white or purplish flowers; it often roots at the water's edge and spreads over water.
scope: 'Another name for bog myrtle and bogbean: a water-side plant with three-part leaves, not a clover.'
examples:
- Buckbean grows in wet ground across Europe and America.
- Its clusters of white or purplish flowers make buckbean easy to spot.
