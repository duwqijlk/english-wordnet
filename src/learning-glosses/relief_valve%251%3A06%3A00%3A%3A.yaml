simpleMeaning: When the push inside a closed pot, like a boiler, grows too strong, this part opens by
  itself.
scope: It is also called escape, escape cock, escape valve, and safety valve, and it opens by itself when
  the push inside grows too strong, not a tap a person turns by hand.
examples:
- The relief valve hissed as steam escaped from the boiler.
- When the pressure rose, the relief valve opened on its own.
