simpleMeaning: any of several kinds of plant in the daisy family, with flowers that dry without losing
  their shape or colour
scope: A plant whose flowers keep their shape and colour when dried, not a flower that lasts for ever
  and not the adjective meaning total.
examples:
- She dried everlastings for a winter bouquet.
- Everlasting grows in the garden and keeps its colour when dried.
