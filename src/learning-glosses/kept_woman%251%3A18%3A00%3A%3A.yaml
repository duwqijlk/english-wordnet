simpleMeaning: With a lover outside her marriage, a wife carries on a sexual affair with a man who is
  not her husband
scope: 'Also called a mistress or a fancy woman: a wife with a lover outside her marriage, not a girlfriend
  and not a faithful wife.'
examples:
- Her husband found out she was a kept woman with a lover in the next town.
- The kept woman met her lover in secret each week.
