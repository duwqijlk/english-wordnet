simpleMeaning: of an electric signal, made weaker, with little or no change to the signal beyond that
scope: Of an electric signal, made weaker with little other change; not the sense of a thing made thin,
  and not a weak form of a germ used in medicine.
examples:
- The attenuated signal was weaker but still clear to hear.
- An attenuated electric signal reached the radio with little change in its shape.
