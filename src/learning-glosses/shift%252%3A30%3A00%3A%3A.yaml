synsetId: 00380830-v
simpleMeaning: to change something, or to swap one thing for another
scope: This is the general sense of changing something or swapping one for another, not giving up one
  thing to take up another, not the keyboard key or the act of pressing it, and not the noun senses such
  as a work period, a loose dress, or a fault in rock.
examples:
- The wind shifted to the north just before the rain began.
- We shifted the conversation to lighter topics.
