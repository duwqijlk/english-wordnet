simpleMeaning: Giving off only a little light, and gentle on the eyes, never bright or harsh
scope: This is said of light that gives off little and is gentle on the eyes, also called dim, not of
  a sound or a mood.
examples:
- The lights in the hall were subdued and soft.
- The subdued light beside the bed let her sleep.
