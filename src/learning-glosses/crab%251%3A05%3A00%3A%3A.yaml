simpleMeaning: an animal with ten legs, eyes on short sticks, a wide flat hard outer covering, a small
  belly folded under its body, and claws
scope: The living animal itself, with ten legs and claws; not its flesh eaten as food, not the tiny insect
  that lives on people, and not a bad rowing stroke.
examples:
- A crab walked sideways across the sand with its claws held up.
- We saw a crab hiding under a rock by the water.
