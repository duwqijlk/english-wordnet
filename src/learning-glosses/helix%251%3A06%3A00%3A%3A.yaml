simpleMeaning: A shape formed by turns that follow each other in one unbroken run, going round in loops.
scope: 'Also called a spiral, a coil, a whorl, or a volute: a shape wound in a run of loops; not a curve
  lying on a cylinder or cone that cuts across at a fixed angle.'
examples:
- The helix of the staircase wound up through the tower.
- DNA takes the shape of a double helix.
