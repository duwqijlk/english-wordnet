simpleMeaning: to not be or do what someone hoped for or expected
scope: This means not meeting what someone hoped for or expected. It is not about feeling sad yourself,
  but about causing that feeling in another person.
examples:
- I do not want to disappoint my parents, so I will try hard.
- The low test score disappointed her teacher.
