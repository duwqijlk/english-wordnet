simpleMeaning: Its hard seed is much bigger than the shagbark's, though this tree of the eastern United
  States looks much like the shagbark tree
scope: Also called big shagbark, big shellbark, big shellbark hickory and king nut, this tree of the eastern
  United States is not the shagbark itself, whose seed is smaller.
examples:
- The king nut hickory in our yard bears much larger nuts than the shagbark.
- King nut hickory grows across the eastern United States.
