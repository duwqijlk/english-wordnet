simpleMeaning: a small animal from southern Africa that digs burrows and is awake in the day, often kept
  as a pet
scope: This is a small animal of southern Africa that digs holes and is awake in the day, often kept as
  a pet; not a night animal and not a large animal that lives only in the wild.
examples:
- The suricate dug a burrow near the fence.
- They keep a suricate as a pet in their home.
