simpleMeaning: Small white flowers shaped like little bells grow on this plant from the south-east of
  the United States, grown for its looks, that keeps its leaves all year.
scope: Also called mountain andromeda and mountain fetterbush, this names the plant from the south-east
  of the United States with small white flowers shaped like little bells.
examples:
- The fetterbush by the porch was covered in small white flowers.
- They planted a fetterbush in the front garden for its looks.
