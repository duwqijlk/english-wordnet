simpleMeaning: A sex-spread infection, brought on by germs of the group it is named for.
scope: A sex-spread infection, brought on by germs of the group it is named for — the group Chlamydia
  —; not round germs that infest birds and beasts, bringing on infections of eyes, lungs, and the parts
  for sex and passing water.
examples:
- Their chlamydia was treated at dawn.
- The chlamydia was found in the test.
