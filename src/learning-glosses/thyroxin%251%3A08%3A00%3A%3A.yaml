simpleMeaning: A hormone produced by the thyroid glands, regulating metabolism by controlling the rate
  of oxidation in cells.
scope: This chemical, also called tetraiodothyronine and thyroxine, comes from the glands in the neck
  and sets how fast cells burn fuel with oxygen.
examples:
- With thyroxin at work, cells burn fuel with oxygen at a set speed.
- Cells burn fuel with oxygen at the speed thyroxin sets for them.
