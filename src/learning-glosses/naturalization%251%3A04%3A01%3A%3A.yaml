simpleMeaning: Changing how a borrowed word is said so it fits the sounds of the language that took it
  in.
scope: Changing how a borrowed word is said to fit the sounds of the language that took it in; not giving
  a foreigner citizenship, not bringing animals or plants to a new place where they grow well, and not
  bringing a thing into line with nature.
examples:
- The naturalization of the Italian word changed how it was said in English.
- Naturalization of borrowed words happens slowly, as their sounds fit the new language.
