simpleMeaning: A rule that guides how money records are kept now, used to decide how to treat hard money
  dealings.
scope: Accounting principle is another name for this sense, not a rule of law and not a way to count stock.
examples:
- The new accounting standard changed how leases are shown.
- That accounting standard guides firms in hard cases.
