simpleMeaning: From British Columbia to New Mexico grows a plant that looks like the Mexican hat plant.
scope: This is a plant much like the Mexican hat plant, found from British Columbia to New Mexico, not
  the Mexican hat plant itself and not a plant of the deep tropics; prairie coneflower is another name
  for this sense.
examples:
- Long-head coneflowers grew along the road in New Mexico.
- The long-head coneflower looks much like the Mexican hat coneflower.
