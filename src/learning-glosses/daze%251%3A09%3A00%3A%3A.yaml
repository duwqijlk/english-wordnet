simpleMeaning: a state of not thinking clearly, when your thoughts feel mixed up and unclear
scope: 'This sense is also called fog and haze: not being able to think clearly, not the upset feeling
  after a sudden bad event and not the verb sense of making someone feel overcome.'
examples:
- After the long night without sleep, he walked around in a daze.
- She was in a daze and could not answer the simple question clearly.
