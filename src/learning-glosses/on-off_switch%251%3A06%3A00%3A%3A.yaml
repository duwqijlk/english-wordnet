simpleMeaning: A control that can sit in either of two places, moved by a turn at a joint
scope: A control that sits in either of two places, also called toggle and on/off switch; not a dial that
  turns through many places and not a button that is only pushed in.
examples:
- Flip the on-off switch to start the lamp.
- The on-off switch on the radio was stuck between its two places.
