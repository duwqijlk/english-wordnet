simpleMeaning: a place where people are kept locked up while they wait for a trial or as a punishment
  for a crime
scope: 'Also called prison: a place where people are held while on trial or as punishment, not a police
  cell for a short stay and not a place where people live by choice.'
examples:
- The prison house held men waiting for trial.
- She was sent to the prison house for two years.
