simpleMeaning: a plant from Mexico or the West Indies, with large thick leaves that give a stiff thread-like
  material used for things like rope
scope: This is the plant with large thick leaves from Mexico or the West Indies, not the stiff thread-like
  material that comes from its leaves and is used for things like rope.
examples:
- Sisal grows well in the hot fields of Mexico.
- The farmers cut the thick leaves of the sisal to make rope.
