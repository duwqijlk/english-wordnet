senseId: salient%5:00:00:inclined:01
synsetId: 01238312-s
simpleMeaning: In heraldry, shown as a beast jumping up, standing on its hind legs and leaning forward.
scope: In the art of coats of arms, a beast shown jumping up and leaning forward, not an angle pointing
  outward at less than a half turn.
examples:
- The salient lion on the shield leapt toward the top.
- A salient stag, leaning forward as it jumped, filled the crest.
