simpleMeaning: In computer science, a program that runs what you see on the screen, most often on a monitor,
  and lets you work with the machine.
scope: 'Also called interface: in computer science, a program that runs what you see on the screen and
  lets you work with the machine, not the machine itself and not a printed guide.'
examples:
- The user interface lets you work with the machine through the screen.
- A clear user interface makes the program easy to use.
