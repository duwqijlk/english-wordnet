simpleMeaning: The process in which a material becomes hard or solid as it cools, dries or forms crystals.
scope: This is not the scenery of a stage production, not a radio or television receiver and not a lasting
  tendency to behave in a certain way; it is a material hardening as it cools, dries or crystallizes.
examples:
- The first set of the cement takes a few hours in warm weather.
- Give the glue a full day for its final set before sanding it.
