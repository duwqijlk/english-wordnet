simpleMeaning: an animal with a body frame of bone or of cartilage (a softer, bendy material), a backbone
  made of parts, and a large brain inside a skull
scope: 'Also called craniate: this is an animal with a backbone, not the word for having a backbone and
  not an animal with no backbone.'
examples:
- A dog is a vertebrate, and so is a fish.
- All birds are vertebrates because they have backbones.
