simpleMeaning: In computers, extra memory made by using the hard disk to act as more working memory; the
  store a user can reach, where made-up addresses stand for real ones
scope: 'Also called virtual storage: in computers, extra memory made by using the hard disk; not the memory
  built into the machine itself.'
examples:
- The computer uses virtual memory when its real memory runs out.
- With virtual memory, the hard disk acts as extra working memory.
