simpleMeaning: Cloth strips and drugs, kept in a bag or box, for treating a hurt person
scope: A set of things for treating a hurt person, not a box of tools and not the help a doctor gives
  in a hospital.
examples:
- She kept a first-aid kit in the car for small cuts and burns.
- He opened the first-aid kit and put a bandage on the cut.
