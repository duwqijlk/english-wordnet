simpleMeaning: A Eurasian lily with drooping, bell-shaped blossoms, usually marked with purple or maroon
  on a pale background; widely planted in gardens as an ornamental.
scope: This is a plant, not the spotted bird its name comes from.
examples:
- The guinea-hen flowers opened in April, hanging like small bells above the grass.
- He pointed out a guinea-hen flower among the meadow grasses.
