simpleMeaning: to burn something a little on the outside only, so that its colour changes
scope: Also called scorch and sear. This sense is burning something a little on the outside, not making
  or becoming black in a general way.
examples:
- The cook blackened the chicken a little on the outside in the hot pan.
- The flames blackened the top of the bread, but only a little.
