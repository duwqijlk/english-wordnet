senseId: 'asiatic_sweetleaf%1:20:00::'
synsetId: 12797534-n
simpleMeaning: A bush of the east of Asia that loses its leaves each year and bears bright blue fruit
  grown for show.
scope: Also called a sapphire berry and Symplocus paniculata; a bush of the east of Asia with bright blue
  fruit, not a bush with red fruit of the same lands.
examples:
- The Asiatic sweetleaf in the garden bore bright blue fruit in autumn.
- Asiatic sweetleaf loses its leaves each year but keeps its bright blue fruit for show.
