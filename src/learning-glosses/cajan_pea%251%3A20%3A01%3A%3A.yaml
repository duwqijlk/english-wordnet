simpleMeaning: Much grown in the tropics, this woody herb of warm lands bears showy yellow flowers and
  flat pods.
scope: Also called dhal, catjang pea, dahl, pigeon-pea plant, pigeon pea, and red gram, this is a woody
  herb with showy yellow flowers and flat pods, not the small seed itself.
examples:
- The cajan pea bore showy yellow flowers and flat pods.
- Cajan pea is much grown in the tropics.
