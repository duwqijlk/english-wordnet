simpleMeaning: The finest and most vital part of an idea or of an experience, what it comes down to.
scope: The finest, most vital part of an idea or an experience, also called heart, center, core, centre,
  meat, sum, substance, marrow, essence, kernel, nub, gist, or inwardness; not the soft centre of a plant
  stem.
examples:
- He got straight to the pith of the argument.
- The pith of her story was a single warning.
