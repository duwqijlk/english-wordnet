simpleMeaning: A person who turns against their own side, faith, party, friend, or the like and leaves
  them.
scope: 'Also called a deserter, a turncoat, a renegade, an apostate, or a recreant: a person who turns
  against their own side, faith, party, friend, or the like and leaves them, not one of several kinds
  of terrier bred to catch rats.'
examples:
- The ratter sold the group's plans to its enemies.
- Once a ratter, they were never trusted by the party again.
