simpleMeaning: The bringing of a worker's job to an end, leaving them free to go.
scope: 'Also called release, sack, firing, and dismissal: the end of a person''s job, not the pouring
  out of a fluid, not a flow from the body, and not the firing of a gun.'
examples:
- His discharge came after months of poor work.
- The firm gave her a discharge with a month's pay.
