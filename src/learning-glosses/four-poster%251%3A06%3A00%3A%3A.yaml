simpleMeaning: a bed with posts at the corners, made so a cover or curtains can hang from the posts
scope: A bed with posts at its corners that can hold a cover or curtains above it, not a plain bed with
  no posts.
examples:
- The old four-poster stood against the wall of the guest room.
- She hung curtains from the posts of her four-poster.
