synsetId: 06149215-n
simpleMeaning: a way of studying the mind that puts weight on actions that can be seen and counted
scope: 'Also called behaviorism, behavioristic psychology and behaviouristic psychology: a way of studying
  the mind from what people do, not from thoughts or dreams and not from the body alone.'
examples:
- He studied behaviourism because he wanted to learn from what people do.
- Her book on behaviourism says that only what can be seen and measured counts.
