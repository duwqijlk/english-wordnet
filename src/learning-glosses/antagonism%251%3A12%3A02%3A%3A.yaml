simpleMeaning: a feeling of strong dislike and hate that a person shows in words or actions
scope: A feeling of strong dislike and hate shown openly, not the link between opposing ideas or forces,
  and not one thing in the body stopping another thing from working.
examples:
- His antagonism toward his rival was clear in every angry speech he made.
- There was clear antagonism between them, and they spoke to each other with hate.
