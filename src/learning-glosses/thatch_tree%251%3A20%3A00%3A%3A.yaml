simpleMeaning: 'The palmetto with a silver top has a close look-alike: a small palm of southern Florida
  and the West Indies.'
scope: Also called broom palm, silver thatch, and thatch palm, it is a small palm of southern Florida
  and the West Indies, close in looks to the palmetto with a silver top.
examples:
- We found a thatch tree growing in southern Florida.
- The thatch tree looked much like the palmetto with a silver top.
