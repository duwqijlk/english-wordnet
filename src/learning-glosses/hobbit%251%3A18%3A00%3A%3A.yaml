simpleMeaning: a made-up being like a person but smaller, with hairy feet, first made up by J.R.R. Tolkien
scope: This is Tolkien's small made-up person with hairy feet, not a real small person and not another
  made-up being such as an elf.
examples:
- A hobbit lives in a small round house under a hill.
- The hobbit set out on the journey with bare, hairy feet.
