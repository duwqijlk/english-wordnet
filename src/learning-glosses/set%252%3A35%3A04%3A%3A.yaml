simpleMeaning: To put a fine, sharp edge on a knife or razor.
scope: This is not sinking a nail or screw below a surface, not adjusting a device to a standard and not
  preparing a room; it is sharpening the edge of a blade finely.
examples:
- The barber set the razor before the first shave of the day.
- She set the knife's edge with a fine whetstone.
