simpleMeaning: 'a wind in southern Asia that comes at the same time each year: in summer it blows from
  the southwest and brings rain, and in winter from the northeast'
scope: This is the wind itself, not the rainy time of year in southern Asia when this wind blows and brings
  heavy rain.
examples:
- The monsoon blew in from the southwest and brought rain.
- In winter, the monsoon comes from the northeast.
