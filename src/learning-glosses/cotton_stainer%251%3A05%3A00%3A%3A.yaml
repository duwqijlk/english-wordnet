simpleMeaning: a true bug that harms and stains the soft fibre of the plant grown for cloth while it is
  still growing
scope: A true bug that harms and stains the soft fibre of the plant grown for cloth while it is still
  growing; not a beetle, and not a bug that eats stored cloth.
examples:
- The cotton stainer damaged the bolls before they opened.
- Farmers dread the cotton stainer for the marks it leaves on the lint.
