simpleMeaning: a round shape made of rings, one inside another, like the rings made by leaves or flower
  petals
scope: 'Also called roll, curl, scroll, coil, ringlet, whorl and curlicue: a round shape made of rings
  one inside another, not a plain circle with no rings in it.'
examples:
- The young leaves formed a gyre around the centre of the plant.
- She drew a gyre of small circles, one inside another.
