simpleMeaning: A deciduous climber for arches and fences, with unpleasantly scented but striking flowers
  and poisonous yellow fruit; grown for its dark glossy leaves; native to southeastern Europe and Asia
  Minor.
scope: This European climber with glossy leaves and poisonous yellow fruit, also called silkvine; not
  the silk tassel shrub, nor the edible vines grown on the same supports.
examples:
- The silk vine covered the old garden arch with its dark leaves.
- Its yellow fruit is poisonous, so keep children away from the silk vine.
