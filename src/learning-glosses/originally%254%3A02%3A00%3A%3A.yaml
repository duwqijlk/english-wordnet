simpleMeaning: In a new and inventive way.
scope: This adverb describes how something is done — in a new and inventive way, as when someone writes
  or thinks originally. It is much less common than the everyday 'originally', which means 'at first'
  or 'as things were before later changes'. Modern readers will usually take 'originally' to mean 'at
  first' unless the context clearly points to an original way of working.
examples:
- She writes originally, in a voice unlike anyone else's.
- He thinks originally, finding connections that others miss.
