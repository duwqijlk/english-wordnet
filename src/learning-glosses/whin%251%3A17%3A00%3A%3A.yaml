simpleMeaning: any of several kinds of hard, coloured rock, especially chert (a very hard rock) or basalt
  (dark rock made when melted rock cools)
scope: Hard rock, especially chert or basalt, not either of the two whin bushes with yellow flowers.
examples:
- The road was cut through hard whin that was slow to break.
- Builders used whin for the wall because the rock lasts a long time.
