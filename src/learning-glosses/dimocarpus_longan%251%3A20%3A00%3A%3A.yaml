simpleMeaning: A tree of southeastern Asia to Australia, grown mainly for its sweet fruit that can be
  eaten and looks like litchi nuts; sometimes put in the groups Euphorbia or Nephelium.
scope: A tree grown for its sweet fruit like litchi nuts, also called a longan, a longanberry, lungen,
  Euphorbia litchi or Nephelium longana; not a litchi tree.
examples:
- The Dimocarpus longan in the orchard bore sweet fruit in summer.
- Dimocarpus longan fruit tastes a little like litchi nuts.
