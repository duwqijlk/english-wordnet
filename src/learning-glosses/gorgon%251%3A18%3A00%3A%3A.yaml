simpleMeaning: In Greek tales, one of three winged sister monsters, one being the mortal Medusa, a woman
  with live snakes for hair whose look turned a person to stone
scope: This is one of three sister monsters, not Medusa alone and not a mere ugly woman.
examples:
- One look from the Gorgon turned the hero to stone.
- In the tale, a Gorgon turned men to stone with a look.
