simpleMeaning: the study of religion in a planned, ordered way that uses reason, looking at how religion
  changes people and life and at what is true in religion
scope: The study of religion, also called theology. It is not a god people pray to, not the state of being
  a god, and not a sweet white food.
examples:
- She went to university to study divinity.
- He has a degree in divinity and now teaches about religion.
