simpleMeaning: A way of speaking that tells the person hearing it what to do, showing that the speaker
  wants them to act
scope: This is a way of speaking that tells the listener what to do; imperative, imperative mood and jussive
  mood are other names for this sense, not a way of speaking that asks a question or states a fact.
examples:
- The imperative form of the verb tells the listener to act.
- The teacher showed how the imperative form makes a command.
