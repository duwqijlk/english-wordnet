simpleMeaning: a wrong step made by accident that makes you almost fall or actually fall.
scope: This is not a journey or a short outing; it is the accidental wrong step itself.
examples:
- A trip on the loose stone left her with a bruised knee.
- One trip over the cable brought the whole table down.
