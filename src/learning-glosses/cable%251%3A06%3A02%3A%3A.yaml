simpleMeaning: a wire used to carry electric power or signals, including signals sent by light
scope: Also called line, this is a wire that carries power or signals; it is not the strong rope and it
  is not television programmes sent by wire.
examples:
- An underground cable carries power to the houses on this street.
- A broken cable cut off the phone signals to the village.
