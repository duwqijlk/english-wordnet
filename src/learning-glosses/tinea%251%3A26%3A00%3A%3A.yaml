simpleMeaning: An infection of the skin or nails in which itchy rings form, caused by fungi.
scope: Also called ringworm, it is the infection that makes itchy rings on the skin or nails.
examples:
- The tinea on the foot itched badly.
- Itchy rings on the skin showed the tinea at work.
