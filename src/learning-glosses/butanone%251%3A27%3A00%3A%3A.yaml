simpleMeaning: A colorless, flammable liquid that mixes with other liquids, used to dissolve resins, strip
  paint, and make lacquers, cements, adhesives, cleaning fluids and celluloid film.
scope: A clear industrial solvent, also called methyl ethyl ketone; it is not acetone, a similar but different
  solvent, and not an alcohol.
examples:
- Butanone evaporates quickly, so it works well as a paint remover.
- Workers handling butanone wore gloves and kept the room ventilated.
