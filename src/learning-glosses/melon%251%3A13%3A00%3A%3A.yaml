simpleMeaning: any of many fruits of the gourd family, with a hard outer skin and sweet, juicy flesh inside
scope: A gourd fruit with a hard rind and sweet juicy flesh, not the vine-fruit sense that lists muskmelons,
  watermelons, cantaloupes, and cucumbers.
examples:
- She cut open a melon and scooped out the sweet flesh.
- The melon had a hard rind and juicy flesh.
