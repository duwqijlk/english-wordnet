simpleMeaning: allow someone to take part in or belong to something, and let them exercise the rights,
  roles and responsibilities that go with it
scope: This sense is about letting a person join and exercise rights, not about a group or list containing
  something as one of its parts.
examples:
- The club voted to include younger members in the decision-making process.
- The new pension rules include part-time staff in the scheme, giving them the same rights as full-time
  workers.
