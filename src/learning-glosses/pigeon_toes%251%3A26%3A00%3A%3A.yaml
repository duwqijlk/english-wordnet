simpleMeaning: A fault of the feet in which the front parts turn in toward each other, often found with
  knees that knock together.
scope: This is a fault of the feet in which the front parts turn in toward each other; not feet that turn
  outward, and not a fault of the knees alone.
examples:
- The child has pigeon toes and walks with her feet turned in.
- Pigeon toes often go with knock-knee.
