simpleMeaning: to travel along a path that turns sharply one way, then the other way, again and again
scope: To move in sharp turns from side to side; not the shape made by such a path, and not the word that
  only describes how something moves.
examples:
- The river zigzags through the fields.
- The path zigzagged up the steep hill.
