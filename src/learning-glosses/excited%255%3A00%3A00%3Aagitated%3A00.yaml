simpleMeaning: strongly affected by feeling, to the point of being worked up.
scope: This is not the frantic, out-of-control sense, and not anger; it describes someone strongly moved
  or worked up by feeling.
examples:
- She was excited and close to tears after the news.
- He gets excited over the smallest piece of good news.
