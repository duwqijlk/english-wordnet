simpleMeaning: the set of rules for soldiers, run by army courts to keep order, try cases, and punish
  soldiers
scope: The set of rules for soldiers run by army courts; not the rules for ordinary citizens and not the
  rules of one army base.
examples:
- The soldier was tried under military law.
- Military law covers discipline and punishment for soldiers.
