simpleMeaning: the speed at which something moves or happens when there is no hurry or quick action
scope: 'Also called deliberation and deliberateness: this is about speed with no hurry, not quickness
  and not a stop or delay.'
examples:
- The slowness of the traffic made us late.
- He worked with careful slowness and made no mistakes.
