simpleMeaning: In Christianity, one of about 70 early Latin and Greek writers whose books set out and
  fixed the accepted teaching; some later became saints.
scope: One of the early Christian writers of the 2nd to the 7th century, also called Church Father and
  Father.
examples:
- Augustine was a Father of the Church.
- The Fathers of the Church wrote in Latin and Greek.
