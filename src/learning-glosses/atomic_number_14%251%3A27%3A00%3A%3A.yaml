simpleMeaning: 'The element silicon: a nonmetal that forms four bonds and, after oxygen, is the most common
  in the earth''s crust; found in clay, quartz and sand, and used in transistors.'
scope: This sense names the element silicon by its atomic number; it is not the number 14 by itself or
  a compound such as quartz.
examples:
- Silicon has atomic number 14.
- In the periodic table, atomic number 14 belongs to silicon.
