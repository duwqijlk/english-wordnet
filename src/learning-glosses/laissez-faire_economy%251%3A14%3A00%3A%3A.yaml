senseId: 'laissez-faire_economy%1:14:00::'
synsetId: 08381886-n
simpleMeaning: A way of running things that leans most on buyers and sellers to share out goods and means
  and to fix what things cost.
scope: A way of running things that leans most on buyers and sellers to share out goods and means and
  to fix what things cost; free enterprise and market economy are other names for this sense, not a system
  where the state fixes prices and not a system where the state owns the goods.
examples:
- A laissez-faire economy leaves prices to the market.
- In a laissez-faire economy the state steps back.
