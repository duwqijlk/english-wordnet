senseId: 'agnosia%1:26:00::'
synsetId: 14123415-n
simpleMeaning: being unable to tell what a thing is by using the senses
scope: Not being able to know things through the senses, not a loss of sight or hearing itself and not
  a failure to remember names.
examples:
- After the head injury, his agnosia kept him from telling a key from a coin by touch.
- Her agnosia made it hard to know what she was holding even when she could see it.
