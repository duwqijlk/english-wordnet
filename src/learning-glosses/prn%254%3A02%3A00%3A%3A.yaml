simpleMeaning: When it is needed; doctors write this on orders for medicine.
scope: Also called as needed, as required and pro re nata; this means when something is needed, not at
  a fixed time and not every day.
examples:
- The doctor wrote PRN on the prescription, so I take the pill only when I need it.
- Take this medicine PRN, when the pain comes back.
