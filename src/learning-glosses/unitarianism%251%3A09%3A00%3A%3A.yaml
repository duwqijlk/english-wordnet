simpleMeaning: A faith with no set teaching, built on each person's freedom to believe as they wish, that
  does not hold the teaching of the Trinity.
scope: This is a faith with no set teaching, built on each person's freedom to believe as they wish, different
  from the Unitarian Church as a body and from faiths with a fixed set of teachings.
examples:
- Unitarianism lets each person believe as they wish.
- He found in Unitarianism a faith with no set teaching.
