simpleMeaning: how important or well known a person or thing is when compared with others
scope: How important or well known a person or thing is compared with others; not a part that sticks out,
  and not just the state of being well known with no comparison.
examples:
- This problem has more prominence now than it had last year.
- Of all the singers in the town, she had the most prominence.
