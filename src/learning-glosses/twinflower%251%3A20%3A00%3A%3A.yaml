simpleMeaning: A low creeping evergreen shrub of northern Europe and Asia, with delicate fragrant tubular
  bell-shaped blooms that are usually pink and come in pairs.
scope: This is the small creeping woodland plant with paired pink bells, not a garden bedding flower or
  a taller upright shrub.
examples:
- Twinflower carpeted the shaded forest floor in delicate pink pairs.
- She bent to smell the twinflower growing under the pines.
