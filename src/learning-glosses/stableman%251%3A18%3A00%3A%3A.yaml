simpleMeaning: a man whose job is to look after horses in the building where they are kept
scope: 'Also called stableboy: a man paid to care for horses in the place where they are kept; not the
  owner of the horses and not a person who rides them for sport.'
examples:
- The stableman fed the horses early each morning.
- She asked the stableman to bring out a gentle horse for her child.
