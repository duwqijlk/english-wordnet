simpleMeaning: the steps taken to guard against attacks that use germs or other living things that cause
  disease
scope: 'Also called biodefense, biological defence and biological defense: steps to guard against attacks
  with germs, not the attack itself and not a guard against ordinary weapons.'
examples:
- The army spent much on biodefence after the scare.
- Good biodefence means spotting an attack with germs early.
