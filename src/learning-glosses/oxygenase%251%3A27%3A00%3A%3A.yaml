simpleMeaning: A helper protein that speeds the joining of oxygen molecules into another substance.
scope: A helper protein that joins oxygen molecules into another substance; not a helper protein that
  breaks things apart and not oxygen itself.
examples:
- The oxygenase joins oxygen to the new compound.
- An oxygenase adds oxygen to the starting substance.
