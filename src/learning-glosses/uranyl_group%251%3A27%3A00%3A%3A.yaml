simpleMeaning: a bit of a chemical made of uranium and oxygen, with two free links, that joins with acids
  to make salts
scope: 'Another name for uranyl and uranyl radical: a chemical part with two free links, not a full chemical
  on its own and not the acid it joins with.'
examples:
- The uranyl group joined with the acid to form a salt.
- In the lab, the uranyl group took part in a reaction with acid.
