simpleMeaning: a rush of people, events or things that appear or grow all at once and move forward
scope: A surge of people or events, not a ridge on water, a hand gesture, or a spell of extreme weather.
examples:
- The refugees came in waves, filling the camp within days.
- A wave of protests followed the announcement.
