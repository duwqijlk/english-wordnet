simpleMeaning: a word or saying that people repeat again and again
scope: A word or saying said again and again, not the sacred hymn of an old Indian religion.
examples:
- She repeated 'So pleased with how it's going' at intervals like a mantra.
- His mantra was 'never give up', and he said it every morning.
