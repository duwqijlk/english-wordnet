simpleMeaning: a very thin sheet made of tin, or of a mix of metals that has tin and lead in it
scope: A very thin sheet made from tin or a tin and lead mix; not a solid block of tin and not a thick
  metal plate.
examples:
- She wrapped the food in tinfoil before she put it in the oven.
- He covered the dish with a piece of tinfoil to keep it warm.
