simpleMeaning: A switch in a computer that gives out a signal when any one of its inputs gives out a signal.
scope: Also called OR gate; a computer switch that fires when any input fires.
examples:
- The OR circuit gave out a signal when one input fired.
- An OR circuit turns on if any one of its inputs turns on.
