simpleMeaning: The part of the study of light that deals with how mirrors make images.
scope: The study of images made by mirrors, not the study of images made by lenses and not the study of
  light in general.
examples:
- Catoptrics explains why a curved mirror makes your face look larger.
- In catoptrics we learned how a flat mirror forms an image behind the glass.
