simpleMeaning: a large cloth, most often canvas, that catches the wind and drives a boat along
scope: The cloth that catches the wind; canvas, canvass and sheet are other names for this same object,
  not a structure that merely looks like one and not a pleasure trip on the water.
examples:
- The storm tore the main sail, so they limped home under a small spare.
- She checked the sail for tears before they left the harbour.
