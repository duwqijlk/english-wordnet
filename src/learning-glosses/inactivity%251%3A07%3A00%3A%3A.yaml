simpleMeaning: a way of being in which a person tends to stay still and not do things
scope: A person's tendency to stay still and do nothing, also called inertia. It is not just a short time
  with no work or movement.
examples:
- His inactivity comes from habit, not from illness; he just likes to sit and do nothing.
- She fought against her own inactivity and made herself take a walk each day.
