simpleMeaning: to kill a person or animal by using a harmful material
scope: A person or animal is killed by someone using a harmful material; not just putting a harmful material
  into food or drink, and not a thing killing by the harmful material in it.
examples:
- She poisoned her husband, and he died that same night.
- The king was poisoned by enemies who wanted him dead.
