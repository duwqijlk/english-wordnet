simpleMeaning: God alone gives rulers their power to rule, so those under them cannot call them to answer,
  and to rise against them is the worst of political crimes
scope: Another name for the divine right, this is the belief that God alone gives rulers their power to
  rule, so those under them cannot call them to answer, and to rise against them is the worst of political
  crimes.
examples:
- The doctrine of the divine right of kings was put forward by the Stuarts in Britain in the 16th century.
- Believers in the divine right of kings said rebellion was the worst of political crimes.
