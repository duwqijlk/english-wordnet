simpleMeaning: The state of things after one shared pattern has been put in place for all to follow
scope: The state of things once one shared pattern is in place, with standardization as another name for
  this sense, not the act of testing a measuring tool or the act of forcing rules on people.
examples:
- The standardisation of nuts and bolts saved the industry a lot of money.
- Standardisation means every part fits every other part.
