simpleMeaning: Rich in carbon and hydrogen, this burnable stuff is made from the remains of living things
  kept in rocks in the crust of the earth
scope: This burnable stuff comes from the remains of living things kept in rock, not from a fuel made
  fresh from living plants.
examples:
- The town still heats its homes with fossil fuel.
- Coal is one kind of fossil fuel.
