simpleMeaning: A piece of strong cloth that can be pulled back to make a way into a shelter
scope: A flap of strong cloth that can be pulled back to make a way into a shelter, also called a fly,
  a fly sheet, a rainfly, and a tent-fly; not the roof of the shelter and not a door of wood.
examples:
- He lifted the tent flap and went in out of the rain.
- The tent flap was pinned back to air the shelter.
