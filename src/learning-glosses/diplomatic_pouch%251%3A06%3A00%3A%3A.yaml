simpleMeaning: a sealed bag that carries messages between a country's office abroad and its office at
  home
scope: A sealed bag that carries messages between a country's office abroad and its office at home, not
  an ordinary mail bag and not a case for keeping papers.
examples:
- The courier carried the diplomatic pouch to the embassy by hand.
- The letters from the ministry arrived in a sealed diplomatic pouch.
