simpleMeaning: A cut of lamb that takes in the breastbone and the muscles joined to it, dressed as meat
scope: A cut of lamb that takes in the breastbone and the muscles joined to it, dressed as meat; breast
  of lamb is another name for this sense, and this is not a leg or a shoulder cut.
examples:
- The poitrine d'agneau is a cut of lamb with the breastbone.
- She cooked the poitrine d'agneau with the muscles still joined to the bone.
