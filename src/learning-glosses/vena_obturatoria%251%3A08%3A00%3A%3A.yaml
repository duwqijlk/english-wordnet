senseId: 'vena_obturatoria%1:08:00::'
synsetId: 05382001-n
simpleMeaning: this vein empties into a large vein deep in the pelvis after it is formed by small side
  tubes joining to drain the hip joints and thigh muscles
scope: 'Also called obturator vein: a vein that drains the hip and thigh and empties deep in the pelvis,
  not an artery and not a vein of the leg.'
examples:
- The vena obturatoria drains the hip joint and thigh muscles.
- The vena obturatoria empties into the internal iliac vein.
