simpleMeaning: The act of using something up, by eating, drinking, burning, or spending it.
scope: The act of using something up, not the spending of goods in economics and not the lung disease.
examples:
- The consumption of fuel rose sharply in winter.
- Local consumption of bread fell after the price rose.
