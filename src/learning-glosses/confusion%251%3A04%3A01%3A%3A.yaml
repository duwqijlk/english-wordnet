senseId: 'confusion%1:04:01::'
synsetId: 00380562-n
simpleMeaning: an act that mixes things up so badly that they lose their own shape and cannot be told
  apart
scope: An act that mixes things up until they cannot be told apart, not a mess from things going wrong
  and not a shy feeling.
examples:
- The confusion of tongues at the Tower of Babel left the builders unable to understand one another.
- The mixing of the two lists caused confusion for the clerks.
