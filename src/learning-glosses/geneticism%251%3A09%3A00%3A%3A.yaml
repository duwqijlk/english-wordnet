simpleMeaning: Some people believe that the genes a person is born with fix every part of what that person
  is like
scope: The belief that genes fix all human traits, not the study of genes and not the belief that upbringing
  fixes them.
examples:
- He held geneticism to be true, saying even kindness came from birth.
- Her geneticism led her to think that talent came from the genes, not from practice.
