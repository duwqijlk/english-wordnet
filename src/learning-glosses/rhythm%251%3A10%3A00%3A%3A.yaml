simpleMeaning: the way spoken words are put together, with strong parts and weak parts taking turns
scope: This is the pattern of strong and weak parts in spoken words, not a pattern you can see in a building
  and not the basic unit in a piece of music.
examples:
- The rhythm of his speech made the poem easy to follow.
- She read the lines aloud and kept a steady rhythm in her voice.
