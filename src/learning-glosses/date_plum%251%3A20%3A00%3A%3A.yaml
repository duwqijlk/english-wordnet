simpleMeaning: Afghan tribes prize the small yellow or dark purple fruit of this Asian persimmon tree,
  which people grow for the fruit they can eat
scope: An Asian persimmon tree grown for its small fruit, not a date palm or a plum tree.
examples:
- The date plum in the yard bore small yellow fruit this year.
- Traders brought baskets of date plum to the market for the tribes to buy.
