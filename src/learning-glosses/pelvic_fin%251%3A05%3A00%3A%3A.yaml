simpleMeaning: Like the hind legs of an animal that lives on land, these fins sit in a pair on a fish's
  hip bones and help it steer.
scope: 'Also called a ventral fin: one of a pair of fins joined to a fish''s hip bones that help it steer,
  the fish''s match for the hind legs of an animal that lives on land.'
examples:
- The fish steered with its pelvic fins.
- A pelvic fin sits on each side of the fish, joined to its hip bones.
