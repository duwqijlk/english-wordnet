simpleMeaning: the best and most complete form of a thing, with no faults at all
scope: 'Also called finish and culture: the best and most complete form of a thing, with no faults at
  all, not a stuff used to make a thing smooth and bright and not the act of making work better.'
examples:
- Her speech showed great polish.
- I admired the polish of his writing.
