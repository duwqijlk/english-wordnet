simpleMeaning: In physics, the push of an ideal gas at one fixed heat grows as the space it fills shrinks.
scope: Also called Mariotte's law; in physics, the rule that the push of a gas at one fixed heat grows
  as the space it fills shrinks, not a rule about heat changing.
examples:
- Boyle's law tells us that squeezing a gas makes its push grow.
- We used Boyle's law to work out the push of the gas in the small tank.
