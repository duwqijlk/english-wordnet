senseId: 'depressive_disorder%1:26:00::'
synsetId: 14412645-n
simpleMeaning: A very low mood with loss of joy, so strong that a person needs care from a doctor or clinic
scope: This is a very low mood with loss of joy that needs care from a doctor; depression and clinical
  depression are other names for it, not a short spell of feeling sad.
examples:
- After months of low mood, he was told he had a depressive disorder.
- A depressive disorder can make it hard to get out of bed.
