senseId: 'sprocket%1:06:00::'
synsetId: 04296828-n
simpleMeaning: A round wheel, thin in shape, with teeth around its edge that fit into the links of a chain.
scope: A thin toothed wheel that fits a chain, not a single tooth on the rim of a gear wheel, and not
  a toothed roller that pulls film or paper through.
examples:
- The sprocket on her bicycle was worn, and the chain kept slipping off it.
- The mechanic fitted a new sprocket to the back wheel.
