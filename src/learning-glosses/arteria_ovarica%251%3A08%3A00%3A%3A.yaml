simpleMeaning: The blood tube that leaves the main body artery and carries blood to the egg-making organs
scope: Also called an ovarian artery; not the blood tube that feeds the long bone and not the one that
  feeds the belly muscles.
examples:
- The arteria ovarica branches from the aorta to feed the ovaries.
- The arteria ovarica carries blood to the ovaries after leaving the aorta.
