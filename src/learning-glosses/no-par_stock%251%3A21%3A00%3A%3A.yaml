simpleMeaning: Shares in a company with a set worth left unnamed in the company rules or on the share
  paper.
scope: Shares in a company with a set worth left unnamed in the company rules or on the share paper, with
  no-par-value stock as another name for this sense, not shares with a set worth and not a bond.
examples:
- The firm sold no-par stock with no set worth on the paper.
- Holders of no-par stock own shares with no set worth.
