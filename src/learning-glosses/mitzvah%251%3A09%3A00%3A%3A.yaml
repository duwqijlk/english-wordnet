simpleMeaning: In Judaism, a rule or command in Jewish law
scope: In Judaism, this is a rule of Jewish law itself. Not a good deed done because the law or faith
  asks for it.
examples:
- Keeping the Sabbath is a mitzvah, a command in Jewish law.
- The rabbi explained the mitzvah about resting on the Sabbath.
