simpleMeaning: to become calmer and more friendly, and less quick to worry or get angry
scope: About a person who becomes calmer and friendlier, not about a solid turning into a liquid and not
  about a thing going from sight.
examples:
- With age, he has melted and now rarely argues about small things.
- After years as a strict boss, she has melted and is now calm and friendly with everyone.
