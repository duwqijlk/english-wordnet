simpleMeaning: With only the start of a frill and no horns, this early dinosaur stood on long back legs
  and short front legs, and may have walked on two legs.
scope: 'Also called psittacosaur: an early dinosaur with no horns and only the start of a frill, not a
  horned dinosaur with a full frill.'
examples:
- The psittacosaurus had long back legs and short front legs.
- A psittacosaurus may have walked on two legs.
