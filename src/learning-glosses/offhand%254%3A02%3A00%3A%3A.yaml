simpleMeaning: in a way that shows little thought or care for other people's feelings
scope: Also called offhanded and offhandedly. This describes how a person speaks or acts, not the word
  that describes a person or a remark itself.
examples:
- He answered offhand, without looking up from his book.
- She replied offhand and hurt her friend's feelings.
