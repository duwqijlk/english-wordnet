senseId: 'antecedent%1:18:00::'
synsetId: 09811996-n
simpleMeaning: One is descended from a forebear, usually more remote than a grandparent.
scope: A forebear, usually more remote than a grandparent — also called a root or an ancestor, and another
  name for it is ascendant; not a word or phrase that a later pronoun points back to.
examples:
- Their antecedent came to this country in 1840.
- The antecedent on their mother's side was a sailor.
