simpleMeaning: A tree of northern India and China with purple blossoms and small yellow fruit you cannot
  eat, now naturalized in the southern United States as a shade tree.
scope: Also called an azedarach, an azederach, or a chinaberry tree; a tree of northern India and China
  with purple blossoms and small yellow fruit you cannot eat, not the evergreen of tropical America whose
  fruit was used as soap.
examples:
- A chinaberry shaded the yard in summer.
- Chinaberry trees lined the street in the southern town.
