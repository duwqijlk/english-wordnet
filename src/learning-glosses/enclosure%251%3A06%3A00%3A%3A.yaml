simpleMeaning: an area shut in from the land around it, set aside for some use
scope: A fenced-in area made for a purpose, not a natural enclosed space, not the act of enclosing, and
  not a paper put in an envelope.
examples:
- The zoo built a new enclosure for the lions.
- They put the sheep in the enclosure at night.
