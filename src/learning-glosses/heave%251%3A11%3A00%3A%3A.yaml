simpleMeaning: In geology, a sideways shift in rock where one side has moved flat across from the other
scope: A sideways move in rock, not a rising and falling movement and not loud breathing.
examples:
- The survey found a heave of several feet in the rock layer.
- A heave in the ground had pushed the fence out of line.
