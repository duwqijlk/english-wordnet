simpleMeaning: A wrong shaking in a car or other vehicle, felt most of all in the front wheels
scope: A wrong shaking in a vehicle, felt most of all in the front wheels; not a lively dance, and not
  a woman's undergarment.
examples:
- He could feel the shimmy in the steering wheel at high speed.
- A bad shimmy in the front wheels made the car hard to steer.
