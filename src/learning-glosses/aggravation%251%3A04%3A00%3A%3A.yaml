senseId: 'aggravation%1:04:00::'
synsetId: 01224279-n
simpleMeaning: Unfriendly acts that make a person angry or leave them with anger that lasts
scope: 'Also called provocation, and another name for this sense is irritation: unfriendly acts that make
  a person angry. It is not about making a problem or pain worse.'
examples:
- His rude remarks were pure aggravation for the staff.
- After months of aggravation from her neighbours, she moved away.
