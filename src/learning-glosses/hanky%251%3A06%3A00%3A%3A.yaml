simpleMeaning: A square piece of cloth used to wipe the eyes or nose, or worn as part of a costume
scope: 'Also called handkerchief, hankie and hankey: a small cloth for the eyes or nose, not a paper tissue
  and not a scarf worn around the neck.'
examples:
- She took a clean hanky from her pocket and wiped her eyes.
- For the play, she wore a bright hanky as part of her costume.
