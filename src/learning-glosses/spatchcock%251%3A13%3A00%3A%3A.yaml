simpleMeaning: the meat of a chicken, or a wild bird, cut open along the back and cooked over heat, usually
  soon after it is killed
scope: Meat of a chicken or a wild bird cut open along the back and cooked over heat, usually soon after
  it is killed; not a whole bird and not meat cooked in an oven.
examples:
- The cook served spatchcock with lemon and herbs.
- He grilled the spatchcock over the fire until the skin was crisp.
