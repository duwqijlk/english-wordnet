simpleMeaning: A person or thing that makes you anxious, or a cause of unhappiness.
scope: This is the person or thing that causes worry, not the worried feeling itself, and not a matter
  that merely interests you.
examples:
- Her son's health has been a constant concern.
- Rising costs are the biggest concern for small farmers.
