simpleMeaning: a train motor used to move carriages and wagons around in a rail yard
scope: This is the train motor that moves carriages around a rail yard; donkey engine is another name
  for this sense, not a train that carries people on long trips and not a person who moves carriages by
  hand.
examples:
- The switch engine pushed the empty wagons into the siding.
- A switch engine spent the morning moving carriages around the yard.
