simpleMeaning: The main hollow between the drum skin and the inner part.
scope: The main hollow between the drum skin and the inner part; not the outer part that catches sound
  and not the inner part that turns sound into signals for the brain.
examples:
- The middle ear carries sound from the drum skin to the inner part.
- A cold can fill the middle ear with fluid.
