simpleMeaning: A long stitch run over the edge of cloth so the threads do not come loose.
scope: A long stitch over the edge of cloth; overcast is another name for this sense, not a stitch that
  joins two pieces and not a hem.
examples:
- She finished the edge with overcasting so it would not fray.
- Overcasting keeps the cut edge of the cloth from coming loose.
