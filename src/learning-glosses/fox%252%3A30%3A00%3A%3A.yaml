simpleMeaning: To become stained with small brownish spots that look like a kind of mold, as old paper
  does.
scope: This describes paper or cloth getting brown spots; it is not the animal, its fur, or the act of
  confusing someone.
examples:
- The pages had foxed badly in the damp attic.
- Damp had foxed the old maps along the folds.
