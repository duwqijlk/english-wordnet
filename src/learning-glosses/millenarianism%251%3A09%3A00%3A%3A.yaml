simpleMeaning: Belief in the Christian teaching of the thousand years named in the Book of Revelations.
scope: 'Also called chiliasm, millenarism, and millenniumism: belief in the Christian teaching of the
  thousand years named in the Book of Revelations, not a belief about the end of the world in general
  and not a church practice.'
examples:
- His millenarianism shaped how he read the Book of Revelations.
- Millenarianism teaches that a thousand-year rule will come.
