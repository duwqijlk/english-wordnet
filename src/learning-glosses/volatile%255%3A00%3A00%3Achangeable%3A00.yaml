simpleMeaning: Likely to change a lot, and often.
scope: Likely to change often and by a lot; not a thing that turns to gas, and not a person whose love
  or fondness keeps changing.
examples:
- Volatile stocks rose and fell all week.
- Her volatile emotions changed from joy to tears in minutes.
