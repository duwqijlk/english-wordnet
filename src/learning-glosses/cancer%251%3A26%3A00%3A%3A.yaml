simpleMeaning: A harmful growth or lump made when cells divide in an abnormal, uncontrolled way; it can
  spread to other parts of the body through the lymph system or the blood.
scope: It is the disease of uncontrolled cell growth, not a figurative use for something harmful that
  spreads.
examples:
- The doctor found cancer in her lung.
- Without treatment, the cancer can spread to other parts of the body.
