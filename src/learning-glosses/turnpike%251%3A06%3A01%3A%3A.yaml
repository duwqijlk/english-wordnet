simpleMeaning: From the 16th to the 19th centuries, gates placed across a road to stop people from going
  through until they paid a fee to use the road
scope: Gates across a road in past centuries, not the fast main road itself where people pay to travel,
  which is the other sense of this word.
examples:
- A turnpike stood across the road, and people could not pass until they paid.
- The old turnpike gates were shut at night and opened after the fee was paid.
