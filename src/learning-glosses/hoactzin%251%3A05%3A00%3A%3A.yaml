simpleMeaning: Whose young have claws on the first and second toes of the wings, this crested South American
  bird smells bad.
scope: Also called a hoatzin or a stinkbird, its young have claws on the first and second toes of the
  wings.
examples:
- The hoactzin sat with its crest raised.
- Young hoactzins have claws on the first and second digits of their wings.
