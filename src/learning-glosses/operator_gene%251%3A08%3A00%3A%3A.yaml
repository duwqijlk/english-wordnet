simpleMeaning: Nearby bits start making the RNA that carries orders for building body parts when this
  bit of living matter switches them on.
scope: This is the switch that turns on the nearby bits that make messenger RNA.
examples:
- The operator gene switched on the genes beside it.
- The operator gene turned on messenger RNA production.
