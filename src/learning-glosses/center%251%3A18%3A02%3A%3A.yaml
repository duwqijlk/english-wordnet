simpleMeaning: In ice hockey, this is the player who fills the middle position on a team.
scope: This is the ice-hockey player, not the basketball or football player of the same name, not the
  hockey position itself, not a middle point or region, not a building or shopping complex, and not the
  political middle.
examples:
- The center won the face-off and passed to the left wing.
- Their center scored twice in the third period.
