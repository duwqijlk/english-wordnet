simpleMeaning: Apart from the chromosomes, a small ring of DNA in a cell can copy itself on its own; DNA
  is the stuff that carries the building plans.
scope: This small ring of DNA in a cell can copy itself on its own, and it is not one of the cell's chromosomes.
examples:
- The plasmid copied itself on its own.
- A plasmid lay apart from the chromosomes.
