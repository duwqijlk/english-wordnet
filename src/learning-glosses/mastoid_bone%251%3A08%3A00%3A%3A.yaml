simpleMeaning: At the base of the skull, behind the ear, this hard part juts out from the side of the
  head
scope: The hard lump behind the ear at the base of the skull, also called mastoid, mastoid process, and
  mastoidal, not the ear itself and not the jaw.
examples:
- The mastoid bone forms a lump behind the ear.
- An X-ray showed the mastoid bone at the base of the skull.
