simpleMeaning: a big shellfish, a foot long or more, that can be eaten and often found in fresh water
  in Australia
scope: 'Also called long-clawed prawn: a big shellfish of fresh water in Australia, not a small sea shrimp
  and not a lobster.'
examples:
- The river prawn we caught was over a foot long.
- River prawns are common in Australian rivers and good to eat.
