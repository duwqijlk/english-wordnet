simpleMeaning: Move data out of one program or file into a format another program can read.
scope: Moving electronic data from one program or database into a file that other software can open; it
  is not selling goods to another country, and not spreading something abroad.
examples:
- You can export the table as a CSV file and open it in a spreadsheet.
- The app exports your notes to plain text so other programs can read them.
