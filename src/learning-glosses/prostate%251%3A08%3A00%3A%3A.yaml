simpleMeaning: 'The organ that adds the liquid portion of semen: a firm, chestnut-sized gland in men,
  wrapped partly in muscle, at the top of the urethra.'
scope: Another name for this organ is the prostate gland; the word is not the adjective meaning 'relating
  to the prostate'.
examples:
- He had his prostate checked during his annual physical.
- An enlarged prostate can make urination difficult.
