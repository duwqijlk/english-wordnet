simpleMeaning: any of several kinds of large bird that hunts other animals, has very good eyes, is active
  in the day, and flies high with wide wings and great strength
scope: This is the large hunting bird, not a golf score that is two shots better than the set number for
  a hole.
examples:
- An eagle flew high above the mountains looking for food.
- The eagle caught a fish with its sharp claws.
