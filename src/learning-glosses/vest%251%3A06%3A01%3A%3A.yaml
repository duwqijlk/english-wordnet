simpleMeaning: a piece of clothing for a man, with no sleeves, worn under a coat
scope: 'Waistcoat is another name for this sense: a piece of clothing for a man, with no sleeves, worn
  under a coat. Not the clothing a man wears under his other clothes, next to his skin.'
examples:
- He wore a dark vest under his coat.
- His vest had three small buttons down the front.
