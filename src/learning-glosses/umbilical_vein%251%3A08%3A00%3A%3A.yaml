simpleMeaning: The placenta, which feeds the baby, sends blood rich in food to the unborn baby through
  a blood tube in the cord joining baby and mother.
scope: Also called vena umbilicalis, it carries food-rich blood from the placenta, which feeds the baby,
  to the unborn baby through the cord.
examples:
- Blood reaches the baby through the umbilical vein.
- The umbilical vein ran inside the cord joining baby and mother.
