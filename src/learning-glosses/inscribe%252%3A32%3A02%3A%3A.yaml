simpleMeaning: To write words for someone in a book, in a way that is less formal than a dedication
scope: To write words for someone in a book, in a way that is less formal than a dedication; not to sign
  your name, not to write words meant to last, and not to sign up as a member.
examples:
- The poet inscribed the book to his wife with a few warm words.
- She inscribed her new novel for her teacher, thanking her for the help.
