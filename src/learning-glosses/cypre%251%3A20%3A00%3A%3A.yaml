simpleMeaning: Grown for its many creamy white flowers and its wood of much worth, this large tree of
  the warm lands of America belongs to the group Cordia.
scope: 'Also called princewood and salmwood: a large tree of warm America grown for its many creamy white
  flowers and its wood, not a small bush and not a tree with few flowers.'
examples:
- The cypre grows in the warm lands of America.
- The wood of the cypre is of much worth.
