simpleMeaning: A cutting tool that cuts wood at right angles to the grain or to the long way of the wood,
  worked without power
scope: A cutting tool worked without power for cutting wood at right angles to the grain, also called
  a crosscut saw and a cutoff saw; not a tool for cutting along the grain and not a power tool.
examples:
- He used a crosscut handsaw to cut the plank.
- A crosscut handsaw cuts wood at right angles to the grain.
