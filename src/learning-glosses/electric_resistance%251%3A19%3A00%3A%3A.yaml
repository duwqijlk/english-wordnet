simpleMeaning: Some stuffs hold power back as it moves through them; how much they hold it back is counted
  in ohms
scope: 'Also called electrical resistance, impedance, ohmic resistance and resistance: how much a stuff
  holds power back as it moves through it, not the power itself and not the wire it moves through.'
examples:
- The electric resistance of the wire was high, so little power got through.
- He worked out the electric resistance of the coil before he built the circuit.
