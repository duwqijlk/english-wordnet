simpleMeaning: how strongly a material works against electric current flowing through it; this is measured
  in ohms
scope: 'Also called electrical resistance, impedance, ohmic resistance and resistance: how much a material
  holds back electric current as it flows through it, not the current itself and not the wire it flows
  through.'
examples:
- The electric resistance of the wire was high, so little power got through.
- He worked out the electric resistance of the coil before he built the circuit.
