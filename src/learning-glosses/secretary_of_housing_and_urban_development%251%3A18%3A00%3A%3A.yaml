simpleMeaning: The person who is the head of that part of the government.
scope: The person who heads the part of the government that deals with homes and towns, not the head of
  any other part of the government.
examples:
- The first Secretary of Housing and Urban Development was Robert C. Weaver.
- The Secretary of Housing and Urban Development leads the department that deals with homes and towns.
