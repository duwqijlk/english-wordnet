senseId: 'vagabond%2:38:00::'
synsetId: 01885173-v
simpleMeaning: to move about with no aim and no fixed place to go to, often in search of food or work
scope: This is the verb for moving from place to place with no fixed aim, also called range, roll, cast,
  drift, wander, swan, stray, roam, ramble, tramp and rove. It is not the noun for a person with no home,
  and not the word for a thing with no fixed place.
examples:
- They vagabonded from town to town, looking for food and work.
- He vagabonded across the country with no fixed place to go to.
