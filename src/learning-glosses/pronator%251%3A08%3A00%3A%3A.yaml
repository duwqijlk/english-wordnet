simpleMeaning: A muscle that makes or helps with pronation, the turning of the hand so the palm faces
  down
scope: A muscle that brings about the turning of the hand so the palm faces down, not a muscle that turns
  the palm up.
examples:
- The pronator in her forearm ached after the long climb.
- A strong pronator helps a tennis player turn the racket face down.
