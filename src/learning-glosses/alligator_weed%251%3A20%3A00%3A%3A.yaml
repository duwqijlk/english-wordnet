simpleMeaning: A South American water plant that grows very fast, with grasslike leaves and short spikes
  of white flowers, forming dense floating mats that block waterways.
scope: A South American water plant that grows fast and chokes waterways with floating mats; the name
  belongs to botany and weed control. 'Alligator grass' is another name for this same plant. It is not
  water hyacinth, a different floating water weed.
examples:
- Alligator weed has spread through the delta, smothering the native plants.
- The council hired a team to clear alligator weed from the irrigation channels.
