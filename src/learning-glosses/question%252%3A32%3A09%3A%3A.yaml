simpleMeaning: to interview someone for television, radio, or a newspaper report.
scope: This is not about asking for information in ordinary conversation, and not about expressing doubt;
  it is a reporter interviewing someone for television, radio, or a newspaper.
examples:
- The reporter questioned the minister about the new tax.
- She was questioned live on television about the scandal.
