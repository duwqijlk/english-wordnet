simpleMeaning: A music maker with piano keys, where air pushed by bellows, a tool that pushes air, goes
  through thin strips that can move freely to make sound.
scope: 'Also called organ or harmonium: a music maker with piano keys, where air pushed by bellows goes
  through thin strips that move freely; not the pipe organ and not the accordion.'
examples:
- The reed organ stood in the corner of the chapel.
- She played a hymn on the reed organ.
