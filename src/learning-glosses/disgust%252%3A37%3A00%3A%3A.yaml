simpleMeaning: to make a person feel strong dislike for a thing and feel that it is bad and wrong
scope: To make someone feel strong dislike and feel that a thing is wrong; not the feeling itself, and
  not just to make someone feel sick in the body.
examples:
- The cruelty in the film disgusted many people, who felt it was wrong.
- His lies disgusted her, and she turned away from him in strong dislike.
