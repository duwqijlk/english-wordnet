simpleMeaning: White to almost black, this fruit from warm parts of America is used to make jam, and it
  is roundish in shape.
scope: Also called cocoa plum and icaco, it is the fruit of a small tree in warm parts of America, not
  the tree itself.
examples:
- She made coco plum jam from the dark fruit.
- Coco plums grow in warm parts of America.
