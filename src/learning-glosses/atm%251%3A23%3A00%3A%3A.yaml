simpleMeaning: A unit for measuring pressure, equal to the push that holds up a column of mercury 760
  mm high at sea level when the temperature is 0 degrees centigrade
scope: This is one unit of pressure, also called atmosphere, not a pascal and not a bar.
examples:
- The pressure in the tank was two atm.
- At sea level the air presses down with one atm.
