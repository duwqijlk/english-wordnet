synsetId: 02158330-n
simpleMeaning: In embryology, a hollow with two walls, shaped like a small bowl, that grows into the dark,
  coloured layer and the sensing layer of the retina.
scope: The hollow in the early eye that becomes the retina, not the small vessel for washing an eye; also
  called optic cup.
examples:
- The eyecup forms early in the embryo and later becomes part of the retina.
- In the eyecup, the two walls give rise to the pigmented and sensory layers.
