simpleMeaning: in biology, a group of organisms whose shared features set the standard for the group ranked
  one level above it
scope: This is not a kind of thing, an odd person, printed letters, or a printing block, but a biological
  group used to define a higher one.
examples:
- This species was designated the type of its genus.
- Biologists chose this genus as the type of the family.
