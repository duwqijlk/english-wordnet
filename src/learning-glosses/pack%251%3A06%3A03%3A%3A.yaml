simpleMeaning: A cloth sheet or blanket, dry or wet, wrapped around the body as a treatment.
scope: This is the cloth itself, not the act of wrapping or filling a body part, and not a bundle carried
  on the back.
examples:
- The nurse wrapped him in a warm pack and left him to rest.
- A cold wet pack was laid across her forehead.
