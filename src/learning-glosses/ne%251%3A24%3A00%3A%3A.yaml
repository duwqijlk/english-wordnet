simpleMeaning: the compass point half way from north toward east, at 45 degrees
scope: This is the compass point half way from north to east, not north on its own or east on its own,
  and it is also called northeast, nor'-east, and northeastward.
examples:
- The wind came from the NE.
- They sailed NE toward the island.
