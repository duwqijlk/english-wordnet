simpleMeaning: a way of thinking you have before, so you understand what is said or written in one set
  way
scope: This sense is about understanding words in one way before you hear them, not about being ready
  to act or react in a set way.
examples:
- Her predisposition to take praise as a joke made her doubt his kind words.
- His predisposition to read warnings as threats shaped how he heard the speech.
