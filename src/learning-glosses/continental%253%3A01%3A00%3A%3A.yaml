simpleMeaning: relating to a continent (one of the very large areas of land on Earth), or having its qualities
scope: About a continent as a whole, not limited to North America or Europe alone, and not about the American
  colonies during and just after the American Revolutionary War.
examples:
- Continental drift slowly moves the large pieces of land.
- The continental divide separates rivers that flow east from those that flow west.
