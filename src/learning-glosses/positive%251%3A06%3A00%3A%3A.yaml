simpleMeaning: A piece of film that shows a picture with light and dark areas matching the real scene.
scope: This is not the grammar word for the basic form of an adjective, and not the attitude of being
  sure; it is a picture on film.
examples:
- The photographer made a positive from the negative.
- The positive showed the scene exactly as it had looked.
