simpleMeaning: Sold as Trental, this drug treats leg pain when walking; people think it helps red blood
  cells bend and flow through the blood vessels to the legs and feet
scope: A drug for pain in the legs when walking, not a drug that takes pain away and not a drug for the
  heart.
examples:
- The doctor gave him pentoxifylline for the pain in his legs.
- Pentoxifylline helped the blood reach her feet.
