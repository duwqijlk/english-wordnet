simpleMeaning: a result large enough to notice, especially something becoming less in amount
scope: A result large enough to notice, especially a lessening in amount; it is not a hollow place or
  cut in a surface.
examples:
- The high repair bill made a big dent in her savings.
- Falling sales put a dent in the company's profits.
