simpleMeaning: a low plant that lives one year, with yellow flowers marked with red and a faint smell
  of pine resin; it grows in Europe, the British Isles, and North Africa
scope: Also called yellow bugle; a low flowering plant of Europe and North Africa, not the club moss of
  the same name.
examples:
- Ground pine grew along the dry path, its yellow flowers dotted with red.
- She crushed a leaf of ground pine and smelled its faint pine scent.
