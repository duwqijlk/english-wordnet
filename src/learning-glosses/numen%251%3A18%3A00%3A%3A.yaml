simpleMeaning: Most of all in the old faith of Rome, a being was thought to live in a thing or watch over
  a place
scope: A being thought to live in a thing or watch over a place, most of all in the old faith of Rome;
  not a god with a name of his own and not a ghost.
examples:
- The Romans said a numen lived in the old oak tree.
- A numen was believed to watch over the spring.
