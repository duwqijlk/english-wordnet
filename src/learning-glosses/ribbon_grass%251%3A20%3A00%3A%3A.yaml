simpleMeaning: With wide leaves, a long-lived grass grows in wet meadows and ditches in Europe and North
  America.
scope: 'Also called gardener''s garters, lady''s laces, and reed canary grass: a long-lived grass of wet
  meadows and ditches with wide leaves, not a grass of dry ground.'
examples:
- Ribbon grass grows in the wet meadow.
- Ribbon grass grows in Europe and North America.
