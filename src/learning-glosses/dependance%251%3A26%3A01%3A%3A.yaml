simpleMeaning: being used to something that forms a habit in mind or body, above all drink or drugs, that
  a person needs it and can take more and more of it
scope: 'Also called addiction, dependence, dependency, and habituation: needing a habit-forming thing
  and taking more and more of it, not a liking for something, and not a need for food or sleep.'
examples:
- His dependance on drink grew until he needed it every day.
- Dependance means she can take more and more of the drug and still crave it.
