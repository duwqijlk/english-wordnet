simpleMeaning: a device that makes a loud sound to warn people
scope: A device that warns people with a loud sound; not a party horn you blow to make noise, and not
  a horn on an animal's head.
examples:
- When smoke filled the room, the horn made a loud warning sound.
- The alarm horn woke everyone in the building.
