simpleMeaning: In animals that have several heat cycles in one breeding season, this is the quiet time
  between bouts of mating activity, when the animal shows no sexual drive.
scope: Also called diestrus; it is the quiet gap between bouts of mating activity in animals with several
  heat cycles in a season, not the mating activity itself.
examples:
- The diestrum came between two bouts of mating activity in the breeding season.
- During diestrum the animal showed no sexual drive.
