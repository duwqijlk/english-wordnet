simpleMeaning: to go on with a thing by following a set way of doing it, or by taking a chosen path
scope: Going on with a thing by a set way of doing it, not moving forward in place or time.
examples:
- We should proceed with the matter and settle it now.
- The committee will proceed with the vote tomorrow.
