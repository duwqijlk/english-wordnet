schema: oewn-learning-gloss-v2
senseId: 'helmetflower%1:20:02::'
synsetId: 12075147-n
simpleMeaning: One of a set of orchids in genus Coryanthes, bearing clusters of a few musky, waxy blooms
  with a helmet-like lip.
scope: This sense is also called helmet orchid, for one of a set of orchids in genus Coryanthes, bearing
  clusters of a few musky, waxy blooms with a helmet-like lip, unlike the sense for a poisonous herb native
  to northern Europe having hooded blue-purple flowers, whose dried leaves and roots yield aconite, and
  unlike the sense for a herbaceous plant of the genus Scutellaria which has a calyx that, when inverted,
  resembles a helmet with its visor raised.
examples:
- The helmetflower bloomed in the glasshouse.
- Helmetflowers bore waxy blooms.
