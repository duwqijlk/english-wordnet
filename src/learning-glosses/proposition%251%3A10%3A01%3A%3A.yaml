simpleMeaning: a plan put to others with the question of whether they will take it
scope: 'Also called suggestion: a plan put to others to take or leave, not the act of putting a plan forward
  and not a private offer.'
examples:
- The committee voted on the proposition to build a new hall.
- He put forward a proposition that we share the cost.
