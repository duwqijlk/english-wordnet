simpleMeaning: A low shrub that keeps its green leaves all year and creeps, with large white flowers,
  found widely across the far north of Europe, Asia, and North America.
scope: A creeping shrub with large white flowers of the far north of Europe, Asia, and North America,
  not the mountain azalea of high mountains, grown for its rose-pink flowers.
examples:
- Mountain avens creeps along the ground in the far north.
- The mountain avens by the path had large white flowers.
