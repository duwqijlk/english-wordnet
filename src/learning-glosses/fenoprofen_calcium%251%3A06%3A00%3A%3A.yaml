simpleMeaning: Nalfon is the trade name for this drug, a form that calms swelling and pain and is given
  for arthritis and for other troubles that are sore and swollen.
scope: Also called fenoprofen, this names the drug sold as Nalfon, the one that calms swelling and pain
  and is given for arthritis and for other troubles that are sore and swollen.
examples:
- Fenoprofen calcium eased the swelling in her knee.
- The doctor gave him fenoprofen calcium for his arthritis.
