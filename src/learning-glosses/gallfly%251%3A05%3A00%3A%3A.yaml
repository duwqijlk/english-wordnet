simpleMeaning: Any of many bugs that lay eggs in plants, making swellings where the young feed
scope: This is any of many bugs that lay eggs in plants, making swellings where the young feed; not the
  small lone wasp that makes swellings on oaks.
examples:
- The gallfly lays its eggs in the leaves of the plant.
- Gallflies make swellings on plants where their young feed.
