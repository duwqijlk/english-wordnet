simpleMeaning: A blockage of blood flow caused by a bubble of air, which may happen by accident in surgery
  or an injection, or as a problem of scuba diving.
scope: A medical term for a blockage of blood flow by a bubble of air, a danger of diving and of some
  medical procedures. 'Aeroembolism' is another name for this same sense. It is not a blood clot, which
  blocks a vessel with clotted blood.
examples:
- Air embolism is a risk when a diver holds their breath while rising.
- The surgeon stopped at once, fearing an air embolism in the patient's vein.
