simpleMeaning: a football player whose job is to stop players from the other team who try to stop their
  team's attack
scope: A football player whose job is to stop players from the other team; not the medicine with the same
  name that stops a process in the body.
examples:
- The blocker pushed the other player aside so the runner could pass.
- As a blocker, his job was to keep the other team away from the ball carrier.
