simpleMeaning: A group of harmful cells that can spread but have not yet pushed into the deeper skin-like
  layer or moved to other parts of the body
scope: This is a group of harmful cells that can spread but have not yet pushed into the deeper skin-like
  layer or moved to other parts of the body; carcinoma in situ is another name for it, not a growth that
  has already spread.
examples:
- The test found a preinvasive cancer in time.
- Preinvasive cancer has not yet spread to other parts of the body.
