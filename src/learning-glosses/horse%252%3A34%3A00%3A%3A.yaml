simpleMeaning: To supply someone or something with a horse or horses.
scope: 'This is an old transitive verb: to equip someone or a vehicle with horses, as stables once did
  for coaches and cavalry. It is archaic and appears mainly in historical writing; modern English does
  not use it this way. It is unrelated to the noun senses (the animal or the wooden sawing frame, a sawhorse)
  and to the phrase ''horse around''.'
examples:
- The inn horsed the mail coach at dawn.
- In those days the regiment horsed and armed its own men.
