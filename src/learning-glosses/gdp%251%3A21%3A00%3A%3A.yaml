simpleMeaning: 'The yardstick of a land''s output taken up by the United States in 1991: the whole worth
  of goods and work made inside its bounds in a year, most often.'
scope: This is the yardstick of a land's whole output, also called gross domestic product, not a count
  of one trade or one firm's worth.
examples:
- The GDP of the land grew last year.
- GDP counts the whole worth of goods and work made inside a land's bounds.
