simpleMeaning: Money as damages is what a court orders one person or company to pay
scope: 'Another name for a personal judgement, also called a judgment in personam: a court ruling that
  orders payment of money as damages, not a ruling that orders a person to do or stop something.'
examples:
- The judge gave a personal judgment against the driver for the cost of the repairs.
- The personal judgment meant the firm had to pay damages to its former employee.
