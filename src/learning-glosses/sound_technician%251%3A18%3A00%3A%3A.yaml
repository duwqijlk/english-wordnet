senseId: 'sound_technician%1:18:00::'
synsetId: 10646919-n
simpleMeaning: a person in charge of turning up voices, music and other noises, or making noises for a
  show, such as a TV or radio show
scope: A person who works on the loudness and the noises for a show, not a person who plays the music
  and not a person who films the show.
examples:
- The sound technician turned up the singers so the hall could hear them.
- Our sound technician added the crash of thunder for the radio play.
