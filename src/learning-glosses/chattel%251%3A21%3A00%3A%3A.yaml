simpleMeaning: a thing that a person owns and that you can touch and move, such as furniture, animals
  kept by people, or a car, not land or buildings
scope: This sense is also called movable and personal chattel; it is about things a person can own and
  move, not land or buildings.
examples:
- The farmer listed his chattels in his will, including his furniture and his horse.
- A car counts as a chattel because it can be moved from place to place.
