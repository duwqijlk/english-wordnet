simpleMeaning: the act of keeping someone or something safe from harm or from a bad situation
scope: The act of keeping someone or something safe from harm, not the thing that does the saving and
  not, in religion, being saved from sin and evil.
examples:
- The salvation of his party was the president's main concern.
- The firefighters worked all night for the salvation of the old building.
