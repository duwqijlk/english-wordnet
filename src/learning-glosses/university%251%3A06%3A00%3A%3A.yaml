simpleMeaning: the buildings and land of a place where adults study for degrees, including offices, homes,
  and research spaces.
scope: This is the physical place, not the organization or the people who study and teach there.
examples:
- The university has a new library on its main campus.
- They walked around the university and looked at the labs.
