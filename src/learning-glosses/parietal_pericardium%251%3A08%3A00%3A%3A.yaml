simpleMeaning: the tough outer skin of the sac around the heart, fixed to the sheet of muscle below the
  lungs and to the breastbone
scope: The tough outer skin of the heart sac, fixed to the breathing muscle and the breastbone, not the
  inner skin of the sac.
examples:
- The parietal pericardium holds the heart in place inside the chest.
- In surgery the parietal pericardium was cut to reach the heart.
