simpleMeaning: Existing as a physical body with shape and substance that can be seen or touched.
scope: 'This is the sense of having a physical body or visible form; distinct from material%3:00:03::
  (real and substantial rather than imagined), material%3:00:01:: (made of matter), material%3:00:02::
  (important to a legal case), material%5:00:00:physical:00 (about bodily welfare rather than mental or
  emotional health), and material%5:00:00:worldly:00 (about worldly rather than spiritual interests);
  not material%1:27:00:: (the substance an object is made of), material%1:10:00:: (information used to
  make something), material%1:06:00:: (woven cloth), material%1:06:01:: (supplies needed for a task),
  or material%1:18:00:: (a person thought fit to be hired or admitted).'
examples:
- The angel in the painting looks material, with skin that seems warm to the touch.
- He wanted a material body, not a spirit that drifted through walls.
