simpleMeaning: a supernatural being that people worship and that controls part of the world or life, or
  that represents a force
scope: A being in a religion with many gods; the capitalised God of one religion is a separate entry.
examples:
- The Romans worshipped many gods.
- She prayed to the god of the sea.
