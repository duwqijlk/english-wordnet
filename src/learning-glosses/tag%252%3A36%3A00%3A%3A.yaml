senseId: 'tag%2:36:00::'
synsetId: 01705892-v
simpleMeaning: To add rhymes to blank verse (writing in verse with no rhymes) or to prose (writing not
  in verse)
scope: To add rhymes to a piece of writing, not the label fixed to a thing and not the act of fixing a
  label to something.
examples:
- The poet tagged his blank verse with rhymes at the ends of the lines.
- She tagged the prose piece with rhymes to make it sound like a song.
