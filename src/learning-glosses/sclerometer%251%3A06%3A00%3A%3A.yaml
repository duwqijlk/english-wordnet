simpleMeaning: A tool that tests how hard a material is by pressing a sharp point tipped with diamond
  into it
scope: A tool that tests hardness by pressing a sharp diamond-tipped point into a material, not a scale
  that weighs a material and not a gauge that tests how much a material bends.
examples:
- The sclerometer pressed its diamond point into the metal sample.
- She used a sclerometer to test the hardness of the glass.
