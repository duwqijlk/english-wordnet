simpleMeaning: having feelings that change a lot and finding it hard to get on well with other people
scope: This sense means feelings change a lot and it is hard to get on well with other people, not just
  feeling worried about trouble and not being mad.
examples:
- The disturbed teenager's feelings changed quickly, and he struggled to make friends.
- Counsellors helped the disturbed woman learn to trust people close to her.
