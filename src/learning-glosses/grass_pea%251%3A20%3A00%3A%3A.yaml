simpleMeaning: A plant of Europe that lives one year, grown to feed farm animals; its seeds are eaten
  as food in India and fed to animals elsewhere
scope: This is a plant grown to feed farm animals; khesari is another name for it, not a garden pea grown
  for people to eat and not a bean for the table.
examples:
- The farmer sowed grass pea for the cattle.
- In India, grass pea seeds are cooked and eaten.
