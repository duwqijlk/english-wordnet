senseId: 'baryon_number%1:23:00::'
synsetId: 13620357-n
simpleMeaning: A count that never changes when bits meet, found in any speck smaller than atoms by taking
  the count of one kind of tiny bit from its matching opposite bits.
scope: This count stays the same when bits meet, and it is not the count of bits alone but the gap between
  two counts.
examples:
- The baryon number stayed the same after the particles met.
- They worked out the baryon number from the counts of bits and anti-bits.
