simpleMeaning: A wild orchid with tall upright stems of tightly packed white flowers arranged in a spiral,
  smelling of vanilla, common in wet low ground in eastern and central North America.
scope: This is a flowering plant, not a hole-boring tool (auger) or a fortune-teller (augur).
examples:
- A screw augur was blooming in the wet meadow behind the barn.
- We found a screw augur growing beside the creek, its white flowers winding up the stem.
