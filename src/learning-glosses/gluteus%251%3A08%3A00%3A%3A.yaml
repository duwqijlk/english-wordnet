simpleMeaning: A large band of flesh in the buttock, one of three that move the thigh
scope: One of three large muscles that form the buttock and move the thigh, also called glute, gluteal
  muscle and gluteus muscle; not a vein and not a muscle of the arm.
examples:
- The gluteus is one of the largest muscles in the body.
- She felt a pull in her gluteus after the long hike.
