simpleMeaning: 'in maths, an action on functions that splits over a sum: acting on f plus g is the same
  as acting on f and on g apart'
scope: In maths, an action that splits over a sum, not a number and not a plain function that adds things
  up.
examples:
- A linear operator acts on f plus g just as it acts on f and on g apart.
- In her maths class she showed that a linear operator splits over a sum.
