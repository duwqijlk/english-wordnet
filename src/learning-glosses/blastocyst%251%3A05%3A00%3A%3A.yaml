simpleMeaning: The early form of a young animal still inside its mother, in which the cells have begun
  to take on different jobs.
scope: The early form of a young animal still inside its mother, in which the cells have begun to take
  on different jobs; blastodermic vesicle is another name for this sense, not a grown animal and not an
  egg.
examples:
- The blastocyst settles into the wall of the womb.
- Cells in the blastocyst begin to take on different jobs.
