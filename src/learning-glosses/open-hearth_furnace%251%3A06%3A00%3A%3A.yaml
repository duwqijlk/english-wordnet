simpleMeaning: A steel-making oven where the steel lies on a flat bed and flames of burning gas and hot
  air pass over it.
scope: A steel-making oven where the steel lies on a flat bed and flames pass over it; not an oven where
  steel is melted in a pot and not an oven for baking.
examples:
- Steel was made in the open-hearth furnace.
- The open-hearth furnace heated the steel on its flat bed.
