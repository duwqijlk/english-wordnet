senseId: 'persist%2:30:01::'
synsetId: 00351115-v
simpleMeaning: to keep going and not stop
scope: This means a person keeps doing something and will not stop, not that a thing keeps being there
  or stays the same.
examples:
- She persisted in asking questions until she got an answer.
- He persisted with his plan even after others quit.
