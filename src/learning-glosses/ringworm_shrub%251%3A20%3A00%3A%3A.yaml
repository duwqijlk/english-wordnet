simpleMeaning: A tropical bush, especially from the Americas, showing big yellow blossoms and wide leaves
  whose sap heals ringworm and toxic bites, sometimes ranked as genus Cassia.
scope: This sense is also called ringworm bush and ringworm cassia, for a tropical bush, especially from
  the Americas, with big yellow blossoms and wide leaves.
examples:
- Ringworm shrub sap healed the bite.
- The ringworm shrub grew yellow blooms.
