simpleMeaning: A hunger for riches that no amount can feed, so shameful it is shown as a figure among
  the seven deadly sins.
scope: Also called greed, avarice, covetousness and rapacity, this is a shameful hunger for riches, counted
  among the seven deadly sins.
examples:
- His avaritia left him hungry for more wealth even when he had plenty.
- Avaritia is named as one of the seven deadly sins.
