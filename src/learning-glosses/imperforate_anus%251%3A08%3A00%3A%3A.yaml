simpleMeaning: a fault present from birth in which the opening at the end of the bowel is partly or fully
  blocked
scope: A birth fault in which the bowel opening is blocked, not a cut that heals and not a narrow bowel
  higher up.
examples:
- The baby was born with an imperforate anus and needed care at once.
- Doctors found the imperforate anus in the first hours of life.
