simpleMeaning: Of birds and mammals, keeping the body at a steady, fairly high heat inside
scope: Warm-blooded birds and mammals, also called homothermic and homeothermic, whose body heat stays
  steady and fairly high; not cold-blooded animals whose heat shifts with the air.
examples:
- Birds are homoiothermic, so their bodies stay warm even in cold air.
- A homoiothermic animal keeps its heat steady through the night.
