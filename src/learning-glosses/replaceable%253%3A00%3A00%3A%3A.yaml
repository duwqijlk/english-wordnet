schema: oewn-learning-gloss-v2
senseId: 'replaceable%3:00:00::'
synsetId: 01985459-a
simpleMeaning: able to be changed for another person or thing
scope: This says a person or thing can be changed for another. It is not about fixing a broken thing,
  and not about a person or thing that can never be changed.
examples:
- The batteries in this toy are replaceable.
- This worn part is replaceable, so we can put in a new one.
