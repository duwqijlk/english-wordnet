senseId: 'antinode%1:15:00::'
synsetId: 08515760-n
simpleMeaning: In physics, the place where a thing that moves back and forth in a set way moves farthest
  from where it rests
scope: In physics, the place of greatest movement in a thing that repeats its motion, not the still place
  where nothing moves, and not the whole moving thing itself.
examples:
- At an antinode the string moved farthest from its rest place.
- The antinode of the wave was at the middle of the string.
