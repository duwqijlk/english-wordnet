simpleMeaning: Bergamot, a kind of orange, gives this plant's leaves their smell
scope: 'Also called bergamot mint and eau de cologne mint: a plant with leaves that smell like bergamot,
  a kind of orange, not ordinary mint and not a plant grown for its flowers.'
examples:
- She grew lemon mint near the kitchen door.
- The lemon mint leaves gave off a sweet smell when crushed.
