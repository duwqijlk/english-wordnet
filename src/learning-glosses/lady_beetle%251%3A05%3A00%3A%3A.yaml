simpleMeaning: Aphids and other small pests that harm plants are what this small round bright-hued spotted
  bug most times eats.
scope: This bug is also called ladybug, ladybird, ladybeetle and ladybird beetle, and it most times eats
  aphids and other small pests that harm plants.
examples:
- The lady beetle ate the aphids.
- Lady beetles feed on aphids and other small pests.
