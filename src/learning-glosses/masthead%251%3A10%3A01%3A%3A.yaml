senseId: 'masthead%1:10:01::'
synsetId: 06505149-n
simpleMeaning: a list printed in every issue of a newspaper or magazine, usually on the editors' page,
  that gives its name and the names of its editors
scope: Also called flag, this list inside a paper gives its name and its editors; it is not the paper's
  title printed in big letters on the front page.
examples:
- The masthead lists the editor and the other people in charge of the magazine.
- Check the masthead if you want to know who edits this newspaper.
