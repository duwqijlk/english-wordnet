simpleMeaning: a small hard, horn-like patch of skin on the inside of a horse's leg
scope: A small hard patch of skin on the inside of a horse's leg; not the tree, not the nut, and not the
  wood or the brown colour.
examples:
- The vet felt the chestnut on the horse's leg.
- A small chestnut showed on the inside of the horse's leg.
