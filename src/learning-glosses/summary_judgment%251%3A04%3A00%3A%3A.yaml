synsetId: 01193051-n
simpleMeaning: A court ruling given before a verdict, when the facts that matter are not in doubt and
  the law says one side should win.
scope: A court ruling given before a verdict when the facts that matter are not in doubt; also called
  summary judgement, judgement on the pleadings and judgment on the pleadings; not a verdict after a trial
  and not a settlement between the sides.
examples:
- The judge gave summary judgment before the trial began.
- Summary judgment ended the case without a jury.
