scope: A thick plant with a round upright shape from the southwest of the United States and nearby Mexico;
  not a tall tree-like cactus and not a small flat prickly pear.
examples:
- The rainbow cactus stood alone on the dry hillside.
- A rainbow cactus grew beside the road in Arizona.
