simpleMeaning: A hand weaving frame in which the lengthwise threads lie flat, used for making wall hangings.
scope: A hand weaving frame with lengthwise threads lying flat, used for wall hangings; not a frame with
  upright threads and not a machine loom.
examples:
- She wove the picture on a low-warp-loom in her studio.
- The low-warp-loom held the threads flat while she worked.
