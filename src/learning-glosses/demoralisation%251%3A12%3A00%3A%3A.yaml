simpleMeaning: Feeling low and beaten down, because something has worn away your courage.
scope: A low, beaten-down feeling when your courage has been worn away, not the act of destroying the
  moral basis of a doctrine or policy.
examples:
- The long losing run caused demoralisation in the team.
- Demoralisation spread through the office after the cuts.
