simpleMeaning: A mid to tall fir of west North America with a cone-shaped crown and branches in tiers,
  its leaves smelling of orange when crushed.
scope: This sense is also called amabilis fir and red silver fir, unlike the sense for a mid to tall fir
  of middle to west United States with a narrow upright crown and soft wood.
examples:
- A white fir grew tall.
- White firs smell of orange.
