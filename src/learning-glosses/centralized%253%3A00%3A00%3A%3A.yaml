simpleMeaning: pulled into one place, or put under the rule of one main power
scope: Also called centralised. This means gathered in one place or ruled by one main power, not spread
  out among many local powers.
examples:
- The country has a centralized government that makes rules for all towns.
- They built a centralized system to control help after the flood.
