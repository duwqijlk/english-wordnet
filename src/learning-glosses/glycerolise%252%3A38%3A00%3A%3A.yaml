senseId: 'glycerolise%2:38:00::'
synsetId: 01991795-v
simpleMeaning: to put something into a thick sweet liquid
scope: To put something into a thick sweet liquid; glycerolize is another name for this sense, not to
  stir the liquid into something and not to soak something in plain water.
examples:
- The lab glycerolised the samples before storing them.
- She glycerolised the tissue and left it in the liquid overnight.
