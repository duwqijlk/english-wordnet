senseId: 'palatal%1:10:00::'
synsetId: 07129243-n
simpleMeaning: A half-vowel sound made with the tongue close to the roof of the mouth, like the first
  sound of ‘yeast’
scope: A half-vowel sound made with the tongue close to the roof of the mouth; not the adjective for sounds
  made near the hard palate and not a vowel.
examples:
- The palatal at the start of 'yeast' is a glide.
- English 'y' is a palatal in words like 'yes'.
