simpleMeaning: connected with a condition that makes it hard to read and understand written words, or
  showing signs of it
scope: About the condition that makes reading hard, or showing its signs; not the sense for having a weak
  power to understand written words, usually linked to a problem in the brain, and not the word for a
  person who has that condition.
examples:
- The test checks for dyslexic signs in young children.
- She studied dyslexic patterns in reading and writing.
