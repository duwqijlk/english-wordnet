simpleMeaning: A way to ease what is wrong with a person by pressing with the fingers on set spots on
  the body.
scope: Also called acupressure and shiatsu; a way of easing the body by pressing on it, not a drug and
  not surgery.
examples:
- She tried G-Jo for her sore shoulder.
- The G-Jo session left his back feeling looser.
