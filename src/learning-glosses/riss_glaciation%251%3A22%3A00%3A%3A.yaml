simpleMeaning: The second-to-last great freeze of the Ice Age in the Alps, and the earth and rock laid
  down at that time
scope: A great freeze of the Ice Age in the Alps and what it left behind, not the last freeze of the Ice
  Age and not the Saale freeze of northern Europe.
examples:
- The Riss glaciation shaped the valleys of the Alps.
- Deposits from the Riss glaciation still cover parts of the Alps.
