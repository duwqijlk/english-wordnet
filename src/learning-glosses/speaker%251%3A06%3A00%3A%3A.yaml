simpleMeaning: a device that turns electrical signals into sound loud enough to be heard from a distance
scope: This is the sound-producing equipment, also called a loudspeaker, not a person who talks and not
  the officer who leads a formal meeting.
examples:
- The left speaker has stopped working, so the music sounds flat.
- He turned up the speaker so everyone in the back could hear.
