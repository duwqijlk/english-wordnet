simpleMeaning: the toothed wheels in a car that carry power from the engine through the shaft to the wheels
  that drive it
scope: The toothed wheels in a car that carry power from the engine through the shaft to the wheels that
  drive it, not the sending of a message and not the passing on of a disease.
examples:
- The mechanic repaired the transmission of the old car.
- A fault in the transmission kept the car from moving.
