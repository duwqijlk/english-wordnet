senseId: inviolable%5:00:00:inalienable:00
synsetId: 00094922-s
simpleMeaning: that cannot be broken, and that no one can act against
scope: 'Also called absolute: this is about a right that cannot be taken away or acted against, not about
  a promise or sacred person that must not be shown disrespect, and not about being safe from attack.'
examples:
- Freedom of speech is an inviolable right in their country.
- They held that basic human rights are inviolable and cannot be taken away.
