simpleMeaning: a heavy stone or iron tool, usually with a flat base and a handle, used to crush and mix
  things like grain, drugs or color powders on a flat stone
scope: 'Also called a pounder and a muller: a heavy tool for crushing on a flat stone, not the club-shaped
  tool used in a bowl and not a machine with a moving bar.'
examples:
- She pushed the pestle back and forth on the flat stone to crush the grain.
- He used an iron pestle to mix the color powders on the stone slab.
