simpleMeaning: In the Middle Ages this gold coin of the Byzantine Empire moved widely through Europe.
scope: Bezant, byzant and solidus are other names for this gold coin of the Byzantine Empire, passed widely
  from hand to hand in Europe in the Middle Ages.
examples:
- He paid with a bezzant from the Byzantine Empire.
- Bezzants were used all over Europe in the Middle Ages.
