simpleMeaning: the move in golf when the club is swung down toward the ball
scope: In golf, the swing down toward the ball, not the swing back and up before it, and not a fall in
  prices or business.
examples:
- His downswing was fast and smooth, and the ball flew far.
- She hurt her wrist during her downswing on the golf course.
