simpleMeaning: a plant like an onion, with a white round long part at the bottom and flat dark green leaves
scope: This is the leek as food that you eat, with a white bottom part and flat dark green leaves; it
  is not the living plant itself as it grows in the ground.
examples:
- She cut the leek into small rings and added it to the soup.
- Leeks have a mild taste, a bit like onions.
