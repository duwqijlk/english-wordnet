senseId: 'vital_principle%1:18:00::'
synsetId: 10777586-n
simpleMeaning: an imagined power that some people sometimes say is behind the life and special ways of
  living things
scope: 'Also called the life principle: an imagined power once said to lie behind life, not a real power
  found in the body and not the soul.'
examples:
- In old books, a vital principle was said to make plants grow and animals move.
- The teacher said the vital principle was an old idea, not a thing found in the body.
