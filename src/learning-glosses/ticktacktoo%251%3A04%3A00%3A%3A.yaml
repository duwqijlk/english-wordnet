simpleMeaning: A game for two players, who in turn put a cross, or else a round, in nine square boxes,
  trying for three lined up, crosses or noughts, first.
scope: This sense is also called noughts and crosses, tic-tac-toe, tick-tack-toe, ticktacktoe, and tit-tat-toe.
examples:
- Ticktacktoo is played on a grid.
- A ticktacktoo ended in three rings.
