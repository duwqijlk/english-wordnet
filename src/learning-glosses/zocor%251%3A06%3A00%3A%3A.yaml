scope: A pill taken by mouth to cut blood cholesterol, also called simvastatin; its use after heart attacks
  sets it apart from other pills that lower cholesterol.
examples:
- The doctor gave her Zocor after her heart attack.
- Zocor lowers blood cholesterol.
