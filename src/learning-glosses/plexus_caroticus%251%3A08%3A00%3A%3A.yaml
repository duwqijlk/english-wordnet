simpleMeaning: A net of nerves that wrap round the main blood tube in the neck
scope: A net of nerves that wrap round the main blood tube in the neck; also called carotid plexus; not
  a net of nerves for the face or the arms.
examples:
- The plexus caroticus lies close to the neck's main blood tube.
- The doctor traced the pain to the plexus caroticus.
