simpleMeaning: In psychology, a person who cares more about real things in daily life than about their
  own thoughts and feelings
scope: In psychology, one who cares more about real things in daily life than about inner thought; not
  a shy person and not one who loves crowds for their own sake.
examples:
- The extrovert spent more time on the work in front of her than on her own thoughts.
- As an extrovert, he cared more about what had to be done than about his feelings.
