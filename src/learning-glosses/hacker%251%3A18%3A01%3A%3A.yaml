simpleMeaning: a person who writes computer programs because using computers is fun in itself; they may
  enjoy trying to get into other computers, but they do no harm
scope: A person who writes computer programs because using computers is fun in itself, and who does no
  harm; not a person who breaks into computers to steal from them or damage them.
examples:
- The hacker spent all night improving a computer program just for fun.
- The hacker enjoyed trying to get into the test computer, but he did no harm to any file.
