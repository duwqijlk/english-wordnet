simpleMeaning: In medicine, the study of sicknesses of the body's defence system, the part of the body
  that fights disease.
scope: The study of sicknesses of the body's defence system, not the whole study of that system and not
  the study of sickness in general.
examples:
- She chose immunopathology as her field of study.
- The course in immunopathology covered diseases of the immune system.
