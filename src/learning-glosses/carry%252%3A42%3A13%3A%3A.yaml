senseId: 'carry%2:42:13::'
synsetId: 02752610-v
simpleMeaning: to bring something as a consequence, or to come with a feature that is part of its nature
scope: This sense is about a quality that belongs to something by nature or an effect that comes with
  it, not about holding something inside, not about moving an object by hand, and not a vague link of
  mere involvement.
examples:
- This job carries a lot of responsibility.
- Their decision carries serious risks for the whole team.
