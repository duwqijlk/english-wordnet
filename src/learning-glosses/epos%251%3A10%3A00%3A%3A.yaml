simpleMeaning: The deeds of a hero, told as a story in a long poem
scope: 'Also called epic, epic poem and heroic poem: a long poem that tells the story of a hero''s deeds,
  not a short poem and not a body of poems that carries the old tales of a people.'
examples:
- The epos tells of the hero's long journey home after the war.
- She read the epos aloud to the class over several days.
