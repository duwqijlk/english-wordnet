simpleMeaning: A soft silver-white metal that bends easily and is liquid at usual temperatures; the metal
  most ready to give up charge, and the most alkaline metal.
scope: Also called Cs, caesium, and cesium; a soft silver-white metal liquid at usual temperatures, not
  a hard metal that stays solid.
examples:
- Atomic number 55 is a soft metal that is liquid at usual temperatures.
- A drop of atomic number 55 ran across the bench like water.
