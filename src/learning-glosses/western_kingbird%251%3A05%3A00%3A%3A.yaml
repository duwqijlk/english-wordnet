simpleMeaning: A bird of the west of the United States, with a pale grey head and back, a yellowish breast
  and a black tail.
scope: A bird of the west of the United States; not the eastern kingbird and not a bird of the far north.
examples:
- A western kingbird sat on the fence with its yellowish breast showing.
- We saw a western kingbird in the fields of the west.
