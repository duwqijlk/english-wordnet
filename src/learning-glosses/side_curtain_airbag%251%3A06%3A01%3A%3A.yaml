simpleMeaning: a safety device fitted in cars that fills up fast with air to protect the head and keep
  people safe if the car rolls over
scope: A safety device in a car, also called a curtain airbag; not a steering-wheel airbag and not a seat
  belt.
examples:
- The side curtain airbag filled in less than a second.
- Her car has a side curtain airbag above each door.
