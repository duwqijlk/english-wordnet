simpleMeaning: A curved dip left behind where material has been taken away.
scope: This is a hollow left where material was removed; scoop is another name for it, not the clothing
  pouch or the billiard-table opening.
examples:
- Rainwater collected in the shallow pockets worn into the stone.
- The old quarry left deep pockets in the hillside.
