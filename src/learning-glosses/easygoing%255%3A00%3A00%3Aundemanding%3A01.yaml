senseId: easygoing%5:00:00:undemanding:01
synsetId: 00715469-s
simpleMeaning: calm and not strict in how you act or in what you expect from others
scope: This sense is about a person's calm, not strict way of acting; it is not the sense that means a
  job or task is not hard to do.
examples:
- Our easygoing teacher let us hand in the work a day late.
- He has an easygoing way and never gets angry about small things.
