simpleMeaning: In criminal law, any person who takes part in a crime, whether or not that person makes
  money from it
scope: In criminal law, this is a person who takes part in a crime, not the main person in a money deal
  and not an actor in a main role.
examples:
- The court named him as a principal in the robbery.
- Both principals were charged, even though only one of them made money.
