simpleMeaning: Life in the country, told in a short poem that sets out its fields and farms.
scope: Also called an idyll; a short poem about country life, not the adjective for country life at its
  best and not the sense about shepherds and herdsmen.
examples:
- He wrote a bucolic about shepherds and green fields.
- The bucolic painted a calm picture of farm life.
