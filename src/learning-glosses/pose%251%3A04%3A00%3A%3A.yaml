simpleMeaning: A show put on with care that makes a thing seem more than it really is
scope: This is a false show, not a body held still for a photo, not stiff, false ways of acting to win
  praise, and not a claim to be someone else.
examples:
- His fine clothes were just a pose, meant to make people think he was rich.
- She saw through the pose at once and knew the grand talk was not real.
