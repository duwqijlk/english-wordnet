simpleMeaning: By weighing the gas a ray-giving metal in a rock has turned into against what is left of
  the metal, you can work out how old the rock is.
scope: In geology, this is one way to tell the age of a rock, from what is left of a ray-giving metal
  in it and the gas that metal has turned into.
examples:
- Potassium-argon dating showed the rock was old.
- They used potassium-argon dating on the rock.
