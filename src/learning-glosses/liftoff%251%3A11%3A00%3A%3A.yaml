simpleMeaning: the first rise of a rocket up from the place where it is sent into the air or space
scope: The first rise of a rocket from its starting place, not its later flight through space.
examples:
- Liftoff happened at dawn and the rocket rose fast.
- The crowd counted down to liftoff.
