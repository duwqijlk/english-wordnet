senseId: 'gesneriad%1:20:00::'
synsetId: 12850342-n
simpleMeaning: Any of many tropical or subtropical low shrubs, small trees or vines that grow on other
  plants, in the family that includes African violets, Cape primroses and gloxinias.
scope: A plant in the African violet family, not the family name itself, and not one single kind such
  as the African violet, Cape primrose or gloxinia.
examples:
- Gesneriads such as African violets and gloxinias thrive in warm, humid rooms.
- Many gesneriads grow on other plants, so they need a light, airy potting mix.
