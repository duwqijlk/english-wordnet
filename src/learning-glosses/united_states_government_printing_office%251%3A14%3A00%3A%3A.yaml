simpleMeaning: A body of the law-making arm of the country that prints and binds things for Congress and
  for the parts of the country's ruling body.
scope: This is a body of the law-making arm of the country that prints and binds things for Congress and
  for the parts of the country's ruling body, also called the Government Printing Office, GPO or the US
  Government Printing Office; other bodies that print for the country are different kinds.
examples:
- The United States Government Printing Office prints things for Congress.
- The United States Government Printing Office binds books for the departments of the federal government.
