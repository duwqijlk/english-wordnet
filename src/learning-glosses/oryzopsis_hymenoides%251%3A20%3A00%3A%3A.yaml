simpleMeaning: A prized feed grass of the dry high lands and flat lands of western North America down
  to the north of Mexico.
scope: Also called mountain rice, silk grass, silkgrass and Indian millet; it is a grass for animal feed
  that grows on dry high ground and flat land in western North America as far as the north of Mexico.
examples:
- Cattle graze on Oryzopsis hymenoides in the dry uplands.
- Oryzopsis hymenoides grows across the plains of western North America.
