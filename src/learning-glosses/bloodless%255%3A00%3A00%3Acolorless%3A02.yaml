senseId: bloodless%5:00:00:colorless:02
synsetId: 00405645-s
simpleMeaning: looking pale and weak, as a face does when illness or strong feeling has drained the colour
  from it
scope: A face gone pale and weak from illness or strong feeling, and white, livid, ashen and blanched
  are other names for this sense; not free of blood and not lacking in feeling.
examples:
- Her bloodless lips trembled as she spoke.
- His bloodless face showed the shock.
