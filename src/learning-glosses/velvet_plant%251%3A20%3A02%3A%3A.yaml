simpleMeaning: Tall spikes of yellow, white, or purplish flowers crown the stem ends of one of many kinds
  in the group Verbascum, with big leaves that are most often woolly.
scope: Also called mullein and flannel leaf, this is the Verbascum kind with big woolly leaves and tall
  spikes of yellow, white, or purplish flowers, not the Javanese kind of the same name grown for soft
  leaves with violet-purple hairs.
examples:
- Tall spikes of yellow flowers rose above the big woolly leaves of the velvet plant.
- Mullein is a velvet plant with tall spikes of yellow, white, or purplish flowers.
