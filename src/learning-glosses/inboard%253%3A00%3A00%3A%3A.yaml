simpleMeaning: Placed inside the body of a boat or plane, or closest to its middle line.
scope: Inside a boat or plane, or nearest its middle line, not outside the body and not at the far edge.
examples:
- The inboard engine sits closer to the middle of the wing.
- Move the inboard flap to slow the plane.
