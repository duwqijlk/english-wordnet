schema: oewn-learning-gloss-v2
senseId: 'intransitivity%1:24:00::'
synsetId: 13820513-n
simpleMeaning: In grammar, the link between a verb and a sentence when the verb acts on no thing or person
scope: The link a verb has when it takes nothing after it, also called intransitiveness; not a verb that
  acts on a thing or person.
examples:
- The intransitivity of 'sleep' means it takes no object.
- Linguists noted the intransitivity of the verb in that sentence.
