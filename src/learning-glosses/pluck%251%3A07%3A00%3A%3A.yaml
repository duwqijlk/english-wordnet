simpleMeaning: The courage to keep going and not give up, even when you may get hurt or lose something
scope: The courage to keep going when you may get hurt or lose something, not the act of pulling a tight
  cord and not the verb of pulling a string.
examples:
- It took real pluck to face the storm alone.
- She showed pluck when she kept on after the fall.
