simpleMeaning: a small shrub of South America, grown in the house for its many showy but poisonous small
  round red or yellow fruit
scope: A small South American shrub grown in the house for its showy fruit, not the Old World perennial
  grown for the papery orange-red covering round its fruit.
examples:
- The winter cherry grew in a pot on the windowsill.
- Children must not eat the winter cherry, as its fruit is poisonous.
