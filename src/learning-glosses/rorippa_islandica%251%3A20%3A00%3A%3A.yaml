simpleMeaning: A cress that lives one or two years, growing in wet places, at times used in salads or
  as a cooked green, and a troublesome weed in some places.
scope: Also called marsh cress and yellow watercress; a cress of wet places used at times in salads, not
  a cress of dry ground and not a crop grown only for food.
examples:
- Rorippa islandica grows in damp places.
- In some places Rorippa islandica is a troublesome weed.
