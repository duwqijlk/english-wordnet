simpleMeaning: a steady flow of people or things moving along together, like water in a current
scope: Another name for this is flow; it is a moving mass of people or things, not the act of moving along
  in general, not water flowing from a natural source, and not a brook or river.
examples:
- A steady stream of visitors passed through the gallery all day.
- Commuters came out of the station in a constant stream.
