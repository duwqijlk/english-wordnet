simpleMeaning: A system that lets people in different rooms of a building, a ship, or another place talk
  to each other
scope: This is a system that lets people in different rooms talk to each other, not a telephone and not
  a radio broadcast.
examples:
- She called the nurse on the intercom.
- Press the intercom button to speak to the front desk.
