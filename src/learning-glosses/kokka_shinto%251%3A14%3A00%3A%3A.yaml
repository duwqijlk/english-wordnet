simpleMeaning: The branch of the old faith of Japan that was made the official state religion
scope: Also called Kokka, it is the branch of the old faith of Japan that was made the official state
  religion, not the faith as a whole and not any other state religion.
examples:
- Kokka Shinto was the official state religion of Japan.
- The priests of Kokka Shinto served the state religion of Japan.
