simpleMeaning: a flat shape that is longer in one way than in the other, so it is not a square or a circle
scope: This is a flat shape used as a noun, not the word used to describe a long leaf shape or any long
  shape in general.
examples:
- She drew an oblong on the paper, longer than it was wide.
- The table top is an oblong, not a square.
