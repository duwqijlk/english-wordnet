simpleMeaning: a machine that turns signals made of numbers into signals that change in a smooth flow
scope: A machine that turns number-made signals into smooth-flowing ones, also called a digital-to-analog
  converter, and not a machine that turns smooth signals into numbers.
examples:
- The digital-analog converter turned the music files into signals the speakers could play.
- He wired a digital-analog converter between the player and the old radio.
