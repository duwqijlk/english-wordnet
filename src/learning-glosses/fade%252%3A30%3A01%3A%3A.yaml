simpleMeaning: To become less fresh and lose the energy that keeps something alive and strong.
scope: Wither is another name for this sense; it means losing freshness and energy, not becoming weak
  and feeble or growing faint to the eye and vanishing.
examples:
- Without water, the flowers faded within days.
- After the long illness, his strength had faded.
