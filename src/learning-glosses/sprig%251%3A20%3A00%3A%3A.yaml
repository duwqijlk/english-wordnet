simpleMeaning: a small branch, or a small part that grows out from a branch, especially at its end; usually
  a branch from this year or last year
scope: 'Also called a twig, and another name for it is a branchlet: a small real branch, especially at
  its end; not the ornament made to look like a spray of leaves or flowers.'
examples:
- She cut a sprig of mint and put it in the drink.
- He picked a small sprig from the end of the bush.
