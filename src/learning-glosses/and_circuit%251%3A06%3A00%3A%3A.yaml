simpleMeaning: A part inside a computer that only switches on when all the things going into it switch
  on too
scope: 'Another name for this sense is AND gate: a part inside a computer that only switches on when all
  the things going into it switch on too, not a part that switches on when only one thing goes in.'
examples:
- The AND circuit in the chip only switches on when both inputs are on.
- An AND circuit needs every input to be on before it works.
