simpleMeaning: the practice of giving things a meaning as signs for other ideas
scope: The practice of giving things a meaning as signs for other ideas, with symbolism and symbolization
  as other names for this sense, not using a sign to pass on a message and not a thing that stands for
  something else.
examples:
- Symbolisation runs through all his poems.
- The symbolisation of the river as time gives the story its force.
