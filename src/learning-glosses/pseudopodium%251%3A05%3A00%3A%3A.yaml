simpleMeaning: a short-lived bulge put out by some tiny living things to take in food or to move
scope: A short-lived bulge put out by some tiny living things to take in food or to move; also called
  pseudopod; not a leg, and not a mouth.
examples:
- The cell pushed out a pseudopodium to catch the food.
- A pseudopodium helps the tiny animal crawl along.
