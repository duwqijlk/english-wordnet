simpleMeaning: to take away a person's calm and leave them upset and troubled in their mind
scope: To take away someone's peace of mind and leave them upset, also called worry, and not the small
  everyday annoyance of the other vex sense.
examples:
- I cannot sleep — my daughter's health vexes me.
- The news of the accident vexed him for days.
