simpleMeaning: A small lyre-shaped harp that you hold between your teeth and play by plucking a wire tongue
  while you change the shape of the hollow of your mouth
scope: Also called jews' harp and mouth bow, this is a small harp played between the teeth.
examples:
- He played a tune on the jew's harp.
- She held the jew's harp between her teeth and plucked its wire.
