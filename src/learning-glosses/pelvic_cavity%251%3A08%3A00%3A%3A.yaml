simpleMeaning: the space inside the bones of the hips, holding the organs that lie low in the belly
scope: The hollow space inside the hip bones, not the hollow in the belly above it and not the chest space
  around the heart.
examples:
- The pelvic cavity holds the bladder and the lower bowel.
- A scan showed fluid in the pelvic cavity.
