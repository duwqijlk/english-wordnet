simpleMeaning: A plant of the East Indies, now grown in many places, valued for the fibres it gives
scope: This plant, grown for its fibres and now grown widely, is also called bimli, bimli hemp, deccan
  hemp and kanaf, and is not a plant grown for its fruit or its wood.
examples:
- Kenaf is grown for fibre in many places.
- Farmers plant kenaf for its fibres.
