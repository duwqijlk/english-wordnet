simpleMeaning: of a child or young animal, born in the natural way that parents make new life
scope: This is for a child or young animal born to its parents in the natural way, not for an adopted
  child and not for a thing someone made.
examples:
- The king's naturally begotten son was next in line for the throne.
- A begotten calf stays with the cow that gave birth to it.
