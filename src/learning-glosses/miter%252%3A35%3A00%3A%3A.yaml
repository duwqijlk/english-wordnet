simpleMeaning: To cut edges slantwise, to make a corner join.
scope: This sense is to cut edges slantwise, to make a corner join, unlike the sense for a church head-dress
  worn by bishops on set days, unlike the sense for giving a bishop his tall head-dress, unlike the sense
  for the face of a slanted piece-end where a corner join is made, and unlike the sense for fitting together
  in a corner join.
examples:
- He mitered the edges slantwise.
- Mitering cuts edges to make a corner join.
