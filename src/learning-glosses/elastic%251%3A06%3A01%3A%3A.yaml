simpleMeaning: a stretchy rubber ring that holds papers and other things together in a bundle
scope: A thin stretchy band that holds papers and other things together, not the stretchy cloth itself
  and not a thing that just springs back to shape.
examples:
- She put an elastic around the stack of letters.
- The elastic snapped when he stretched it around the papers.
