simpleMeaning: a man-made part that helps make up a larger whole thing, especially a part that can be
  taken off a system or put on to it
scope: 'Also called component: one man-made part of a larger thing or system, not a basic thing in science
  that all matter is made of and not one of the four old things.'
examples:
- This small element can be taken out of the machine and replaced with a new one.
- The factory makes steel elements for car engines.
