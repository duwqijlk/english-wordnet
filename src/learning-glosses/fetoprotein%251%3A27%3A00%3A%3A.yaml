simpleMeaning: Any one of several body substances found by nature in an unborn child, and at times in
  grown people with cancer.
scope: Any one of several body substances found by nature in an unborn child, and at times in grown people
  with cancer, also called foetoprotein; not a substance made only by the body to fight sickness and not
  a hormone.
examples:
- The test measured fetoprotein in the mother's blood.
- High fetoprotein can point to cancer in an adult.
