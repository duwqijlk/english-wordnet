simpleMeaning: A shallow dish put under roasting meat to catch the juices that fall.
scope: A shallow dish put under roasting meat to catch the juices that fall; drip pan is another name
  for this sense, not a frying pan and not a baking tray.
examples:
- She put a dripping pan under the joint to catch the fat.
- The dripping pan was full of juices after the roast.
