simpleMeaning: to give the main speech to a group of listeners
scope: To give the main speech to listeners; not to set the main idea or feeling for something, and not
  the main idea itself.
examples:
- She will keynote the teachers' meeting, giving the opening speech to two hundred listeners.
- He keynoted the event and spoke for an hour to the whole hall.
