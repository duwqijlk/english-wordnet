simpleMeaning: Like a nightmare, it is how very bad, sad, hard or frightening a thing is
scope: This is how very bad, sad, hard or frightening a thing is, like a nightmare; hellishness is another
  name for it, not mere bad luck and not fear alone.
examples:
- The horror and nightmarishness of the scenario is undercut by how mundane it is.
- The nightmarishness of the long delay wore everyone down.
