senseId: 'concrete_vibrator%1:06:01::'
synsetId: 92448520-n
simpleMeaning: a machine used on building sites that shakes newly poured concrete so trapped air bubbles
  and extra water rise out and the concrete settles firmly in its frame
scope: A piece of construction equipment, not a massage device or a phone's buzzing part; it is the machine
  that shakes air bubbles out of wet concrete.
examples:
- The workers ran the concrete vibrator through the wet mix to bring trapped air to the surface.
- They hired a concrete vibrator to stop bubbles forming in the poured wall.
