simpleMeaning: A part of a plant, often a small bump or dip, that gives off sweet juice
scope: A plant part, often a small bump or dip, that gives off sweet juice, also called a nectary; not
  the flower's pollen, and not a leaf.
examples:
- The honey gland at the base of the flower drew the bees in.
- A honey gland gives off sweet juice that bees gather.
