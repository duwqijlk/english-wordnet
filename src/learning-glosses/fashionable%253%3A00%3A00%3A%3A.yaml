simpleMeaning: In step with what people wear and do now, in the way society likes.
scope: In line with present-day social fashions, not the elegant and tasteful kind, and not the widely
  liked kind.
examples:
- She wore the most fashionable dress in the room.
- They lived on the fashionable side of town.
