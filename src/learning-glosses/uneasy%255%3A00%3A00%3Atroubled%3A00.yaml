simpleMeaning: making people feel worried, full of worry, or showing worry
scope: 'Also called nervous, anxious or queasy: this sense is about worry in the mind, not about the body
  feeling unwell and not about feeling unsure and not at ease with other people.'
examples:
- She spent an uneasy night waiting for the test results.
- He gave me an uneasy smile before the meeting started.
