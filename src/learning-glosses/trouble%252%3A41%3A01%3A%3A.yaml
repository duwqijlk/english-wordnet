simpleMeaning: To make the effort to do something; to bother or involve yourself.
scope: Making an effort or concerning yourself, not putting someone to inconvenience and not making someone
  uneasy.
examples:
- She did not trouble to answer the letter.
- Don't trouble yourself about the cost; I'll cover it.
