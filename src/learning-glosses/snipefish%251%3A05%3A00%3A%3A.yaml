simpleMeaning: a small sea creature that lives on the bottom in warm seas, with a flat body and a long
  nose and no teeth in its mouth
scope: A small fish that lives on the sea floor in warm seas, also called bellows fish; not a fish that
  swims near the top, and not a fish with a toothed mouth.
examples:
- The snipefish moved slowly along the sandy bottom of the warm sea.
- We saw a snipefish with a long snout and a flat body near the reef.
