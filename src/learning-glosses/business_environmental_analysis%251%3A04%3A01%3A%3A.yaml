simpleMeaning: a broad name for the step-by-step work of spotting the outside forces that shape a firm,
  weighing what they do, and planning how to cut harm or gain from them
scope: A broad name for the step-by-step work of spotting the outside forces that shape a firm, weighing
  what they do, and planning how to cut harm or gain from them, also called business environment analysis
  and environmental business analysis, and not a single market study or a plan for one product.
examples:
- The business environmental analysis took a team of four.
- Their business environmental analysis warned of rising costs.
