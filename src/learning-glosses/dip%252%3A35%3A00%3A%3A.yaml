simpleMeaning: to put something into a liquid for a short time, so it gets wet, gets a covering, or takes
  in the liquid
scope: 'Also called plunge, dunk and douse: putting something into a liquid for a short time, not the
  tasty food mixture and not the exercise on two bars.'
examples:
- Dip the brush into the paint before you start.
- She dipped the cloth into the water for a moment.
