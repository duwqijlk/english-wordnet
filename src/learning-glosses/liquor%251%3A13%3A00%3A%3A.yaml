simpleMeaning: a strong drink with alcohol, made by heating a liquid and cooling the steam back into liquid,
  not by fermenting it
scope: 'Also called spirits: a strong drink made in this way, not a factory liquid and not the liquid
  from cooked meat or vegetables.'
examples:
- Whisky is a liquor made by heating fermented grain liquid and cooling the steam.
- She bought a bottle of liquor at the shop, choosing vodka over beer and wine.
