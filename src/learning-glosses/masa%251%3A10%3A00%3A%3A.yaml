simpleMeaning: A free-standing group of closely tied Chadic languages, spoken in the land between the
  Biu-Mandara and East Chadic language groups.
scope: Not the Biu-Mandara or East Chadic groups; this is the group between them.
examples:
- Masa languages are spoken between two other Chadic groups.
- Linguists group Masa with the Chadic tongues.
