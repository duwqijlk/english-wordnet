simpleMeaning: Branches that droop a little and bear hairs, and bark from dull pale to light brown, mark
  this European birch.
scope: Also called downy birch, this European birch has dull pale to light brown bark and somewhat drooping
  hairy branches.
examples:
- The white birch stood in Europe with dull pale bark.
- White birch branches droop a little and bear hairs.
