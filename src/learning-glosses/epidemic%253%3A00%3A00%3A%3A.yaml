simpleMeaning: hitting many people in one place at the same time, as a disease does, or as something much
  like a disease does, most often in medicine
scope: Describing a disease, or something like one, that hits many people at once, not the noun for a
  widespread outbreak itself.
examples:
- An epidemic outbreak of influenza closed the schools.
- The town faced an epidemic flu that winter.
