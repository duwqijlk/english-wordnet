simpleMeaning: Pale green leaves shaped like curved blades hang from a cone-topped tree or bush of New
  Caledonia's rain forests, which feeds a rare yew that lives on other plants.
scope: A tree or bush of the rain forests of New Caledonia, known by its pale curved leaves and the rare
  yew it hosts.
examples:
- The yellow-leaf sickle pine grew in the rain forest of New Caledonia.
- We found a yellow-leaf sickle pine with pale green leaves shaped like sickles.
