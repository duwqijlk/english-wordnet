simpleMeaning: Cloth made from wool that is fine, smooth and soft to feel
scope: This is the fine wool cloth, not the soft leather made from deer skin or lamb skin.
examples:
- She bought doeskin cloth to make a warm coat.
- The doeskin fabric felt smooth and soft in her hands.
