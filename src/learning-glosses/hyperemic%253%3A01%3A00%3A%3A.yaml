simpleMeaning: About too much blood in a part of the body, or caused by too much blood there
scope: A word for too much blood in one body part, not a word for low blood and not a word for bleeding.
examples:
- The hyperemic skin looked red and swollen.
- His hyperemic eye was caused by the extra blood in it.
