simpleMeaning: a person who makes ideas that try to explain something, especially in science or art
scope: This person, also called a theoretician, makes ideas to explain things, especially in science or
  art; this is not a person who mainly runs tests in a lab or makes works of art.
examples:
- The theorist wrote a paper explaining how language first began.
- As a music theorist, she studies how songs are built.
