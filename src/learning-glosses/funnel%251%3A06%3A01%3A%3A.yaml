simpleMeaning: a cone-shaped tool with a narrow tube at its small end, used to guide liquids or other
  things into a container with a small mouth
scope: A cone-shaped tool with a narrow tube for pouring into a small-mouthed jar; not the ship's smoke
  pipe, and not just the shape of a cone.
examples:
- She poured the oil through a funnel into the small bottle.
- Use a funnel so the sauce does not spill.
