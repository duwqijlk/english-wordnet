simpleMeaning: A fine round-topped tree that drops its leaves in winter, with dark green leaves of many
  leaflets and loose bunches of sweet-smelling creamy-white flowers, from China and Japan.
scope: A round-topped tree with loose bunches of creamy-white flowers, also called Chinese scholar tree,
  Chinese scholartree, Japanese pagoda tree and Sophora japonica.
examples:
- A Sophora sinensis shades the front yard with its round top and creamy-white flowers.
- The Sophora sinensis by the gate is covered in sweet-smelling white flowers.
