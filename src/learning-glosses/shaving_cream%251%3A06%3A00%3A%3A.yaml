simpleMeaning: a wash-room mix of soap and fatty acids that makes a thick foam to soften the beard before
  it is cut off
scope: Also called shaving soap; a foaming wash-room mix for softening the beard, not a skin cream left
  on the face.
examples:
- He spread shaving cream over his beard.
- Shaving cream makes a rich lather before a shave.
