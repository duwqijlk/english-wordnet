simpleMeaning: Eating both plants and animals, this mammal like a raccoon lives in Mexico and the southwestern
  United States, its long bushy tail ringed in black and white.
scope: Also called bassarisk, cacomistle, civet cat, coon cat, miner's cat, raccoon fox, ring-tailed cat,
  and ringtail, this is a raccoon-like animal of Mexico and the southwestern United States with a long
  ringed tail, not a true raccoon.
examples:
- A cacomixle searched for food, its ringed tail curled behind it.
- The cacomixle slipped away, only its black-and-white tail showing for a moment.
