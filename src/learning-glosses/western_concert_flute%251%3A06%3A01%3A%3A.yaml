simpleMeaning: A woodwind pipe held sideways and blown across a hole at one end, made of metal or wood.
scope: A side-blown woodwind, also called transverse flute, C flute or Boehm flute; its nearest kin are
  the end-blown recorder and the reed-blown clarinet.
examples:
- The Western concert flute is made of silver and played held sideways.
- She practises the Western concert flute every morning before school.
