simpleMeaning: a large cat from Africa and India that lives in groups, hunts other animals, and has light
  brown fur; the male has long thick hair around its head and neck
scope: This is the large wild cat, not a famous person that many people want to meet.
examples:
- A lion hunted with the rest of its group on the open land.
- The male lion had long thick hair around its head and neck.
