simpleMeaning: a room where a king or queen, or another great person, meets guests and other groups
scope: A room where a king or queen, or another great person, meets guests and groups, not an ordinary
  living room and not a place to sleep.
examples:
- The queen waited in the presence chamber to meet the guests.
- Visitors were led into the presence chamber for the assembly with the king.
