simpleMeaning: a place where heat or rays that carry energy are much stronger than in the places near
  it
scope: A place with very strong heat or rays that carry energy, not a busy popular place and not a place
  that gives internet access.
examples:
- The firefighters found a hotspot in the wall after the fire seemed to be out.
- Satellites measured a hotspot of heat in the ocean.
