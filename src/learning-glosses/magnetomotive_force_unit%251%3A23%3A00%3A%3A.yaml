simpleMeaning: A set amount used to tell how strong the push that drives a field made by magnets is
scope: A set amount for how strong the push that drives a field made by magnets is, not the push itself
  and not a measure of the field.
examples:
- The coil rating is given in a magnetomotive force unit.
- Engineers use a magnetomotive force unit to size the winding.
