simpleMeaning: The liquor left after vegetables or meat have been cooked
scope: 'Also called liquor and pot liquor: the liquid in which vegetables or meat have been cooked, not
  the water used to wash them.'
examples:
- She saved the pot likker to cook the greens in.
- The pot likker from the boiled meat was rich and salty.
