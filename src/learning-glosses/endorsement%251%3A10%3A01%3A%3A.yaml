simpleMeaning: a short piece of praise in writing, printed to help sell a book, such as on the paper cover
  around the book
scope: This is the short praise printed with a book to help sell it, not clear approval given in an official
  way and not the act of showing support.
examples:
- The book's back cover printed a strong endorsement from a well-known writer.
- Her new novel has an endorsement on its cover from a famous author.
