simpleMeaning: the vein behind the jaw is formed when this vein, running on from the web of veins near
  the jaw, joins the vein by the temple
scope: 'Also called maxillary vein: a vein near the jaw that runs on to form the vein behind the jaw,
  not an artery and not a vein of the neck.'
examples:
- The vena maxillaris joins the superficial temporal vein behind the jaw.
- Blood from the pterygoid plexus drains through the vena maxillaris.
