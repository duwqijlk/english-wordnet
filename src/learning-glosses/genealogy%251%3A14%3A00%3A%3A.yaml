simpleMeaning: the people in a family, one group after another, parents, then their children, then their
  children's children
scope: This sense is the family line itself, group after group over time. It is not the study of family
  history and not one family member alone.
examples:
- Her genealogy goes back many generations in the same village.
- The book lists the genealogy of the royal family for 300 years.
