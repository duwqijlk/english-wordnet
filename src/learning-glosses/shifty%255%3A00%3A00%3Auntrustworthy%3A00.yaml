simpleMeaning: not honest, ready to lie or cheat, and avoiding clear answers
scope: 'Also called devious: this is about a person who seems to lie or hide the truth and avoids clear
  answers, not about moving from side to side.'
examples:
- He gave a shifty look and would not answer my question.
- The shifty salesman kept changing his story about the price.
