synsetId: 01968933-a
simpleMeaning: of a solid thing, having no clear shape that can be measured, so its size must be found
  by how much water it pushes aside
scope: A solid with no clear shape to measure, not a fighter and not a strange or odd thing.
examples:
- The irregular lump of rock had no shape we could measure.
- We found the volume of the irregular stone by the water it pushed aside.
