simpleMeaning: A science tool built as an electronic circuit that lets through only electric pulses of
  a set height, blocking all the rest.
scope: Also called pulse height analyzer, this is a science tool that screens electric pulses by height.
examples:
- The kicksorter let through only pulses of the right height.
- They used a kicksorter to sort the pulses by height.
