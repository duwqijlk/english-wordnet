simpleMeaning: acting polite in a way that is not real, acting as if you are very important, and thinking
  you are better than other people
scope: 'Also called grandiose, hifalutin, highfaluting, hoity-toity and la-di-da: acting as if you are
  better and more important than others, not truly polite and not truly great.'
examples:
- She gave a highfalutin speech, acting as if she were far above the rest of us.
- He put on a highfalutin manner at dinner, looking down on everyone at the table.
