simpleMeaning: A red colouring matter made of many parts, holding iron and other atoms, to which oxygen
  sticks
scope: This is a red colouring matter holding iron and other atoms to which oxygen sticks, also called
  haem, haematin, hematin, and protoheme, and not the red cells that carry it or any other blood part.
examples:
- Heme holds iron in the blood.
- Oxygen sticks to heme in red blood cells.
