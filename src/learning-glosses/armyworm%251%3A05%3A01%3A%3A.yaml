simpleMeaning: a moth whose young do much harm as they move in great numbers
scope: A moth whose young do much harm as they move in great numbers, not the larva of a fungus gnat and
  not a group of larvae alone.
examples:
- The farmer watched armyworms strip the leaves from his corn.
- Armyworms moved through the wheat in a great dark mass.
