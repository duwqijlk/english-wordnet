simpleMeaning: A heavy cloth of wool, or of wool and cotton, used mostly for covering furniture or for
  curtains
scope: A heavy wool cloth, or wool and cotton, used mostly for covering furniture or for curtains, not
  a light cotton cloth and not a carpet.
examples:
- The old chair was covered in moreen.
- Moreen hung at the windows of the parlour.
