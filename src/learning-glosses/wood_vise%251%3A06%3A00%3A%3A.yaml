simpleMeaning: A clamping tool with soft-lined jaws that hold boards of cut timber without denting them
scope: A clamping tool with soft-lined jaws for holding cut timber without denting it, also called shoulder
  vise and woodworking vise; not a metal clamp that grips pipes and not a small hand clamp for gluing.
examples:
- He tightened the wood vise around the board before he cut it.
- The wood vise held the plank firm while she planed the edge.
