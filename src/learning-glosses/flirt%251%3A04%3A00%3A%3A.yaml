simpleMeaning: fun, light ways of acting that are meant to make someone feel sexual interest
scope: Fun, light acting meant to draw sexual interest, also called flirting. It is not a woman who does
  this, and not the verb for doing it.
examples:
- Her quick smiles and jokes were just a flirt to make him notice her.
- He saw their talk and laughter as a harmless flirt, not a serious offer.
