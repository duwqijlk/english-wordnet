simpleMeaning: To do with birds that hunt other animals, or like such birds
scope: Said of things to do with birds that hunt other animals, not of birds that eat seeds or plants
  and not of hunting animals that are not birds.
examples:
- The hawk's raptorial claws grip its prey.
- Raptorial bills are sharp and hooked.
