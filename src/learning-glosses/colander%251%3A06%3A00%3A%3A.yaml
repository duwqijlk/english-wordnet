simpleMeaning: a bowl with small holes in it, used to wash food or to let water run off food
scope: 'Also called cullender: a bowl with holes for washing food or letting water run off it, not a solid
  bowl for mixing and not a flat pan.'
examples:
- She put the pasta in a colander to let the water run off.
- He washed the vegetables in a colander under the tap.
