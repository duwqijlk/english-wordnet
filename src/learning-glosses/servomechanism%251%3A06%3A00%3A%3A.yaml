simpleMeaning: a machine control that takes a small push and makes a far bigger push from it, and may
  watch its own work
scope: Also called a servo and a servosystem; a control that turns a small move into a much stronger one,
  not a hand lever and not a simple on-off switch.
examples:
- The servomechanism lets a light press on the lever lift a heavy gate.
- Engineers fixed the servomechanism that moves the big doors.
