simpleMeaning: A small creature that looks like a piece of fuzzy rope, with a head of clustered bell-shaped
  parts that pulse to swim and long stretchy tentacles that pull in prey.
scope: A small creature shaped like fuzzy rope, with swimming bells and tentacles; not a jellyfish or
  a strand of seaweed.
examples:
- A nanomia's head is a cluster of swimming bells.
- The nanomia caught prey with its long, stretchy tentacles.
