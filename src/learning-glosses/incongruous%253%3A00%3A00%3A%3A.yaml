simpleMeaning: not fitting well with the things around it, or not right for the situation
scope: This is about a thing that does not fit with what is around it or with the situation, not just
  a thing that is strange or new.
examples:
- His loud joke was incongruous at the quiet funeral.
- A modern glass tower looks incongruous among the old stone houses.
