simpleMeaning: One who belongs to a Turkic people living in Turkmenistan and nearby places.
scope: Also called Turcoman and Turkoman, this is one of the Turkic people of Turkmenistan, not the tongue
  they speak and not the word for their things.
examples:
- He is a Turkmen who grew up in Turkmenistan.
- The Turkmen live in Turkmenistan and nearby lands.
