simpleMeaning: People weave baskets and mats from the long, thin strands that grow on the leaves of a
  palm tree.
scope: Also called raffia, these are the long, thin strands from the leaves of a palm tree, woven into
  baskets and mats.
examples:
- We tied the bundle with raphia.
- The mat was woven from raphia cut from palm leaves.
