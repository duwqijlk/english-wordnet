simpleMeaning: a wall of stone or concrete that runs from the shore out into the water to stop waves washing
  a beach away
scope: 'Also called a mole: a stone or concrete wall in the water, not the crease where the leg meets
  the body.'
examples:
- The groin runs out into the sea to hold the sand in place.
- Waves broke against the stone groin.
