simpleMeaning: A perennial tropical American vine grown for its hanging sprays of showy yellow and purple
  flowers with the lower petal coiled like a snail shell; sometimes put in that genus.
scope: Also called corkscrew flower, snail-flower, snail bean, snail flower, snailflower and Vigna caracalla;
  a vine grown for its coiled flowers, not a vine grown for its pods and not a morning glory.
examples:
- Phaseolus caracalla climbed the wall with yellow and purple flowers.
- The gardener planted Phaseolus caracalla for its showy blooms.
