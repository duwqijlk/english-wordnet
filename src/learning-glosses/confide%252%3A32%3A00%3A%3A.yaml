simpleMeaning: to tell someone something in private, as a secret they should keep
scope: This is telling one person a private thing in secret, not telling it openly to everyone and not
  keeping it to yourself.
examples:
- She confided her fears to her best friend late that night.
- He confided that he was afraid of failing the test.
