simpleMeaning: with its true nature hidden on purpose, so that people are misled about what it really
  is
scope: 'Also called disguised and masked: a thing whose true nature is hidden to mislead, not a thing
  covered with clothes or a wrap.'
examples:
- The cloaked threat in his letter worried her.
- They saw through the cloaked promises of the plan.
