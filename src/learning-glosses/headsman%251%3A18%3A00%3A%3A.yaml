simpleMeaning: A man with the job of cutting off the head of a person ordered to die
scope: 'Also called headman: a man who kills a person ordered to die by cutting off the head, not a person
  who kills in another way.'
examples:
- The headsman raised his axe in front of the crowd.
- The king ordered the headsman to carry out the death sentence.
