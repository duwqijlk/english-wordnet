simpleMeaning: A liberal who backs an economic view that favours free markets over state control
scope: This is a liberal who backs free-market views; not a liberal of any other kind and not a supporter
  of state-run markets.
examples:
- The neoliberal argued that trade should be left free.
- He called himself a neoliberal after years in business.
