senseId: 'free_enterprise%1:14:00::'
synsetId: 08381886-n
simpleMeaning: A way of running a country's trade in which buyers and sellers in the open market mostly
  decide what is made, who gets it, and what it costs
scope: A market-based way of running trade; laissez-faire economy and market economy are other names for
  this sense, not a planned economy run by the state.
examples:
- Free enterprise lets small shops set their own prices.
- Under free enterprise, firms compete for buyers in the open market.
