simpleMeaning: A prickly plant of Europe with quite big flower heads and spiky leaves, now grown wild
  as a weed across the United States
scope: A prickly plant of Europe with quite big flower heads and spiky leaves, now grown wild as a weed
  across the United States; boar thistle and bull thistle are other names for it, not a garden flower
  and not a plant that stays only in Europe.
examples:
- A spear thistle grows by the fence, its spiky leaves catching at my sleeve.
- The spear thistle has spread as a weed across the United States.
