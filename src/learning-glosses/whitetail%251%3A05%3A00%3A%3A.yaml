simpleMeaning: a common deer of North America whose tail has a white under side
scope: A common deer of North America, known by the white under side of its tail; not any kind of deer,
  and not a white tail on its own.
examples:
- A whitetail ran across the field at dawn.
- We saw two whitetails near the trees, their white tails up as they ran.
