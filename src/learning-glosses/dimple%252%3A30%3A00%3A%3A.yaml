simpleMeaning: To put small hollows on a surface, or to make it look as if it has them.
scope: To mark a surface with small hollows, or as if with them, not to smile so hollows appear in the
  cheeks.
examples:
- Rain dimpled the still pond.
- The hammer dimpled the soft metal.
