simpleMeaning: to punish a person or a group for a wrong act
scope: To punish someone for doing wrong, also called punish; not to reward someone and not to let a wrong
  act pass with no result.
examples:
- The teacher penalized the students for arriving late to class.
- Drivers are penalized if they park in the wrong place.
