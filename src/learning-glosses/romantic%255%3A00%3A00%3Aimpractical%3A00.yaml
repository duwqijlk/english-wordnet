simpleMeaning: not thinking in a sensible way about real, day-to-day things; full of dreams about how
  things should be, not how they are
scope: Having dreams that are not practical in real life; not about love, and not about the Romantic Movement
  in the arts.
examples:
- He had a romantic plan to sail around the world with no money and no training.
- Her romantic idea of farming left out the hard work and the cost.
