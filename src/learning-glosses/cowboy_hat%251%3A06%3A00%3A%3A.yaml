simpleMeaning: A wide-edged head covering with a soft top, worn by people who work with cattle on ranches
  in America.
scope: This is a wide head covering for ranch work, not a cap or a helmet; also called ten-gallon hat.
examples:
- He put on his cowboy hat before riding out.
- Her cowboy hat kept the sun off her face.
