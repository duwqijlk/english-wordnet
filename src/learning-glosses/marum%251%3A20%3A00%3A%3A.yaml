simpleMeaning: Cats are drawn to this Mediterranean plant, whose small hairy leaves sit below reddish-purple
  blooms.
scope: Also called cat thyme, it is a Mediterranean plant that cats seek out for its small hairy leaves
  and reddish-purple blooms.
examples:
- The marum drew the cat to its small hairy leaves.
- Cats came to the marum when its reddish-purple flowers opened.
