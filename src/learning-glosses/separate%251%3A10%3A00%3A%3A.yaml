simpleMeaning: a piece of writing that was first published as part of a larger work and is later printed
  on its own.
scope: This is not an item of clothing sold alone, and not an adjective about division; it is a single
  article reprinted from a larger publication.
examples:
- The archive holds separates of articles from the nineteenth century.
- He mailed a separate of his paper to a colleague.
