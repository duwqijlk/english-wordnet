senseId: 'denotation%1:09:00::'
synsetId: 05931581-n
simpleMeaning: the plain, exact sense of a word or phrase, and all the real things it can point to
scope: This is the plain sense of a word and the things it points to, with extension and reference as
  other names for this sense; not the feeling a word gives and not a word used in a loose way.
examples:
- The denotation of the word 'dog' covers every dog in the world.
- In class we talked about the denotation of 'home' as a place where people live.
