simpleMeaning: Any of several plants that stay green all year and live for years, all of one group of
  plants of the same kind
scope: A group of plants that stay green all year and live for years, not a single plant and not a plant
  that dies back in winter.
examples:
- Pyrola grows in the woods and stays green all year.
- The gardener planted pyrola under the trees.
