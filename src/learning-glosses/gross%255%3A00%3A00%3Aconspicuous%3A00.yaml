simpleMeaning: clearly and very badly wrong, in a way that shocks people and deserves strong blame
scope: Also called crying, rank and glaring. This sense is for something clearly and very badly wrong,
  not for something total with no limit and not for the verb about earning money.
examples:
- The court called it a gross injustice.
- The team lost because of gross ineptitude — no one seemed able to do the job.
