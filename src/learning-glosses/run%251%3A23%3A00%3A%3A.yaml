simpleMeaning: The amount produced by a machine or factory during one continuous period of working.
scope: This is the quantity produced in one period of working, not the length of that period or a series
  of events.
examples:
- The first run of the new press produced ten thousand copies.
- A single run of the kiln yields about five hundred tiles.
