simpleMeaning: to say things you do not mean, or to say things with no care for what is true
scope: To say things you do not mean or with no care for what is true, not a thing that is not real and
  made to look real.
examples:
- He faked his answers when he did not know the facts.
- The speaker faked his praise for the plan he did not like.
