simpleMeaning: A person whose work is measuring how strong light is.
scope: This is a person whose work is measuring how strong light is, also called a photometrist; it is
  not a person who takes pictures, and not a person who makes lamps.
examples:
- The photometrician checked the light in the hall.
- A photometrician can tell how strong a lamp is.
