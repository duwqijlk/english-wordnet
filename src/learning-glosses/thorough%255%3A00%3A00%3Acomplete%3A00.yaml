simpleMeaning: done in a full and complete way, with every part included, and not done in a shallow or
  half way
scope: This word is about work done in full, with every part included and nothing left out. It is not
  about being careful and right in detail, and not used just to make another word stronger.
examples:
- They made a thorough search of the whole house.
- The report was thorough and covered every part of the problem.
