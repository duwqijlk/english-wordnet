simpleMeaning: a hand tool with teeth that cuts across the grain of wood or across the long line of a
  piece
scope: A hand tool with teeth that cuts across the grain of wood or across the long line of a piece; also
  called crosscut handsaw and crosscut saw, not a tool for cutting along the grain.
examples:
- He used a cutoff saw to cut the board across the grain.
- The cutoff saw cut the plank at right angles to the grain.
