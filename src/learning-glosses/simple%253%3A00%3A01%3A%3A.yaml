simpleMeaning: In botany, said of a leaf shape in which the flat part is one unbroken piece rather than
  split into parts.
scope: This describes a whole, undivided leaf in botany, not something with few parts or not complex,
  not something easy to do, not something with nothing added, not childlike and trusting, not lacking
  intelligence, not plain or unornamented, not a medicinal plant, and not a foolish person.
examples:
- An oak leaf is simple, while a horse-chestnut leaf is compound.
- The guide explained that a simple leaf has a single blade.
