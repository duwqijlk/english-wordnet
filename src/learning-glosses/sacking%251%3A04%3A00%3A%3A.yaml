simpleMeaning: the act of ending a person's job, so the person is free to leave
scope: This sense, also called release, sack, firing, dismissal, discharge, and liberation, is about a
  job ending. It is not the rough cloth used to make bags.
examples:
- His sacking came after he missed work many times.
- The sacking of the manager was in all the papers.
