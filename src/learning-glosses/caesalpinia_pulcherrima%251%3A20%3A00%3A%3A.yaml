simpleMeaning: A shrub or small tree of tropical lands with bright yellow to orange-red flowers, at times
  put in the genus Poinciana.
scope: 'Also called the flamboyant tree, paradise flower, pride of barbados and Poinciana pulcherrima:
  a shrub or small tree of tropical lands with bright yellow to orange-red flowers, unlike shrubs with
  white or pink flowers and unlike trees grown for their fruit.'
examples:
- Caesalpinia pulcherrima bore bright yellow to orange-red flowers all summer.
- We planted Caesalpinia pulcherrima by the gate for its bright flowers.
