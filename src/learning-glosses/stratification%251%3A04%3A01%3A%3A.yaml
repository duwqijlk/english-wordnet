simpleMeaning: Putting seeds in damp sand, sawdust, or peat moss, to keep them good or help them start
  to grow.
scope: Putting seeds in damp sand, sawdust, or peat moss to keep them good or help them start to grow;
  not sorting people into social classes, not laying things down in layers, and not the state of being
  arranged in social classes.
examples:
- Stratification kept the seeds fresh through the winter.
- The gardener used stratification to help the seeds start to grow.
