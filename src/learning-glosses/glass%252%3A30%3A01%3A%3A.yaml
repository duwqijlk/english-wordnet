simpleMeaning: to put something into a clear, breakable container
scope: This is the act of placing something inside such a container; it is not a surface turning shiny
  by itself, and it is not fitting panes into a building.
examples:
- She glassed the peaches and stacked the jars in the cellar.
- Every autumn we glass the beans from the garden.
