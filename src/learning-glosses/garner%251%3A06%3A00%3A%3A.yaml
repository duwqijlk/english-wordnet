simpleMeaning: a building for keeping grain after the seeds have been taken from the plant, or food for
  animals
scope: 'Also called granary: a building for keeping grain or animal feed. Not the verb sense of garner,
  which means to get or earn something by hard work.'
examples:
- The farmers stored the wheat in the garner by the barn.
- He filled the garner with grain for the winter.
