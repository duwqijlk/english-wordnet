simpleMeaning: a big fast meat-eating dinosaur, about 20 feet long, with a straight 15-inch cutting claw
  on each back foot, from the early Cretaceous age
scope: Also called utahraptor; a big fast meat-eating dinosaur of the early Cretaceous, not a plant-eater
  and not a later horned dinosaur.
examples:
- The superslasher ran down its prey on two strong back legs.
- A superslasher fossil showed the long cutting claw on each hind foot.
