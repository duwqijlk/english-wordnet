simpleMeaning: A woman named in a will to carry out what it says.
scope: A woman named in a will to carry out what it says; not a woman who writes a will and not a man
  who carries one out.
examples:
- She was named executrix of her father's will.
- As executrix, she had to settle all the debts of the estate.
