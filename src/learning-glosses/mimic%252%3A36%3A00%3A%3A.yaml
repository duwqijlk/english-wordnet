simpleMeaning: to copy how a person speaks or acts, especially in a way that makes fun of them
scope: 'Also called mime: to copy a person''s way of speaking or acting, especially to make fun of them,
  not just to copy something well and not the person who does it.'
examples:
- He loves to mimic his teacher's slow way of talking.
- The comedian mimicked the mayor's voice to make the crowd laugh.
