simpleMeaning: an old custom in which unmarried couples, while they were getting to know each other before
  marriage, shared a bed without taking their clothes off
scope: This is the old bed-sharing custom for an unmarried couple; it is not the act of tying things together
  into one pack.
examples:
- In that village long ago, bundling let a young couple share a bed while still dressed.
- Their grandparents spoke of bundling as a custom from their youth.
