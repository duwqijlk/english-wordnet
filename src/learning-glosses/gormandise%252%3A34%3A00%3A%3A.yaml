schema: oewn-learning-gloss-v2
senseId: 'gormandise%2:34:00::'
synsetId: 01195632-v
simpleMeaning: A person who eats like a pig keeps taking food long after the body has had enough, with
  no hold on the amount
scope: To eat far more than you need, with no hold on how much you take; binge, englut, engorge, glut,
  gorge, gormandize, gourmandize, ingurgitate, overeat, overgorge, overindulge, pig out, satiate and stuff
  are other names for this, not a normal meal and not eating only what you need.
examples:
- He gormandised all evening and left nothing on the table.
- They gormandised on cake until they felt ill.
