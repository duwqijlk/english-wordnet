simpleMeaning: In music, the lowest note of a set of notes that sound when one note is played
scope: In music, the lowest note of a set of notes that sound together, not a part a thing must have to
  work.
examples:
- The fundamental of the string sounds with the higher notes above it.
- On the guitar, the fundamental is the note you hear most clearly.
