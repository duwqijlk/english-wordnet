senseId: 'reactionary%1:18:00::'
synsetId: 10528068-n
simpleMeaning: a person with very strong traditional views who is against change and against new, more
  free ways in politics and society
scope: Also called ultraconservative. This word names a person; it is not the describing word for views
  that are against change in politics and society.
examples:
- The old reactionary fought every plan to change the voting laws.
- Reactionaries in the party blocked the new reforms again and again.
