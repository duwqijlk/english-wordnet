simpleMeaning: The United States government body that makes sure country-wide laws are kept, including
  laws about the rights of all people; set up in 1870.
scope: 'Also called Justice, DoJ, and the Justice Department: the United States government body that makes
  sure country-wide laws are kept, not the body for trade and not the body for health.'
examples:
- The Department of Justice brought the case to court.
- She joined the Department of Justice after law school.
