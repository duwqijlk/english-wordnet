simpleMeaning: in a way that is not fair or not right
scope: Done in a way that is not fair; not in a fair and right way, and not simply in a way that is wrong
  because it breaks a rule.
examples:
- He was unjustly punished for something he did not do.
- The workers felt they were treated unjustly by their boss.
