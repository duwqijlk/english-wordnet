simpleMeaning: A common grey-brown burrowing animal from south Europe and north Africa, now found elsewhere;
  tame and bred in many colours for many uses; the young are born bare and helpless.
scope: 'Also called European rabbit and Oryctolagus cuniculus: a common grey-brown burrowing animal from
  south Europe and north Africa, now found elsewhere, tame and bred in many colours for many uses, the
  young born bare and helpless, not a hare and not a cottontail.'
examples:
- The Old World rabbit dug its burrow in the sandy bank.
- Old World rabbits were kept as pets and bred in many colours.
