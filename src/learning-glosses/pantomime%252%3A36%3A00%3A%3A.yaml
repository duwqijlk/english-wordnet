senseId: 'pantomime%2:36:00::'
synsetId: 01728062-v
simpleMeaning: to act out a thing or a story using only moves of the hands and body, and saying no words
scope: 'Also called mime: to act a thing out with the body and hands and no words, not a play where the
  actors speak.'
examples:
- He pantomimed eating an apple so well that we all understood.
- The students pantomimed a boat ride, moving their arms as if rowing.
