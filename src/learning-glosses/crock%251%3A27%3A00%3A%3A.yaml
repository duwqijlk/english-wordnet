simpleMeaning: a black substance made all or almost all of shapeless carbon, with tiny bits spread through
  it, used to make colouring matter and ink
scope: A black carbon substance used for colouring matter and ink; soot, smut, lampblack and carbon black
  are other names for this sense; not a clay jar and not a dye that rubs off cloth.
examples:
- The crock stained his hands black.
- Printers once used crock to make their ink.
