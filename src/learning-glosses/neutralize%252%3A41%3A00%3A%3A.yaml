simpleMeaning: to make something take no side in politics, and so not offend anyone
scope: This is about making something take no side in politics; it is not about acting against something
  to make its effect weaker, and not about making a chemical neither an acid nor a base.
examples:
- The treaty neutralized the small republic, so it took no side in the war.
- The two countries agreed to neutralize the border town.
