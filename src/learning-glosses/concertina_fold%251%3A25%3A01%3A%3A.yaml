simpleMeaning: a way of folding in which the folds run side by side, turning first to the front and then
  to the back in a zig-zag
scope: 'Also called accordion fold, z-fold, and zig-zag fold: folds that run side by side, not a single
  fold and not a roll.'
examples:
- She made a concertina fold in the paper.
- The concertina fold turned to the front and then to the back.
