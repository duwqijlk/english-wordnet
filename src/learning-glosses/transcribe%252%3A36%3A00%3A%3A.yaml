simpleMeaning: to write or change a piece of music so it can be played on a different instrument or in
  a different way than first planned
scope: This is about changing music for a different instrument; not writing down speech sounds, and not
  copying instructions from DNA (the material in cells that carries the instructions for how a living
  thing grows) to make RNA (a short copy of part of those instructions).
examples:
- She transcribed the piano piece for the guitar.
- He transcribed the song so a small band could play it.
