simpleMeaning: A red-brown metal that bends, flattens, is rust-free, and turns from a magnet; found in
  many rocks, the only metal found in big lumps; used to carry power and heat.
scope: Not iron or tin or other metals; also called copper and atomic number 29.
examples:
- Cu wires carry power into the house.
- The roof was made of Cu that had turned green.
