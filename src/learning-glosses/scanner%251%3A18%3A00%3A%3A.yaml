simpleMeaning: a person who works out the rhythm of a poem by counting its syllables and the weight of
  each one
scope: A person who counts the syllables of a poem and marks their weight, not the radar dish and not
  the machine that copies pictures into a computer.
examples:
- The scanner counted the syllables in each line of the poem.
- As a scanner, she marked each syllable as long or short.
