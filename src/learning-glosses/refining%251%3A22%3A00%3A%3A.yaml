simpleMeaning: the way of taking out the parts that make oil, metal, sugar and other things not pure
scope: 'Also called refinement and purification: taking bad parts out of oil, metal, sugar and such things
  to make them pure, not just a small change that makes something better.'
examples:
- Refining oil takes out the parts that make it dirty.
- The refining of sugar makes it white and pure.
