simpleMeaning: to move the head down, or to bend the knee or body
scope: This general movement is also called bow down; it means lowering the head or bending the knee or
  body, not the respectful greeting gesture and not a bend forward from the waist.
examples:
- He bowed his head to hide a smile.
- We had to bow our heads to get through the low doorway.
