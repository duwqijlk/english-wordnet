senseId: 'stretch%2:30:04::'
synsetId: 00319617-v
simpleMeaning: to draw something out until it is longer than it was
scope: This means lengthening something by pulling on it, not opening or spreading it out to full length
  and not something growing longer by itself.
examples:
- He stretched the elastic until it was long enough to tie around the box.
- She stretched the dough between her hands until it formed a long strip.
