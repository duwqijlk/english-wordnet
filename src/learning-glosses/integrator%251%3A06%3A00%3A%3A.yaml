simpleMeaning: A tool that works out how much ground a flat shape with uneven sides covers
scope: A tool for working out the size of a flat shape with uneven sides, also called a planimeter; not
  a ruler and not a tool that weighs things.
examples:
- The surveyor used an integrator to find the area of the odd-shaped field.
- With an integrator, she worked out the size of the map's rough outline.
