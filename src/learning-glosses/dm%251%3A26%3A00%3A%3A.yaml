simpleMeaning: A form of diabetes in which the body lacks insulin, in part or in full, and makes too much
  urine.
scope: A form of diabetes marked by too much urine, also called diabetes mellitus; not diabetes that comes
  from too much sugar alone and not a short illness.
examples:
- The doctor said DM runs in his family.
- She checks her blood sugar each day because of DM.
