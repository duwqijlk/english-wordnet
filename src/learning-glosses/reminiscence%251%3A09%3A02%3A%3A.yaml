simpleMeaning: a picture or idea in the mind that a person keeps and can bring back from the past
scope: This is a single kept picture or idea from the past. Not the act of remembering itself, and not
  a story or book about the past.
examples:
- A smell from his childhood brought back a clear reminiscence of his old home.
- Her reminiscence of the trip was still bright after many years.
