simpleMeaning: Splitting into the two tubes that serve the lungs, this blood tube takes used blood from
  the heart's right lower room.
scope: Also called the pulmonary trunk, this blood tube carries used blood from the heart to the lungs.
examples:
- The truncus pulmonalis carries blood from the heart to the lungs.
- Blood leaves the heart through the truncus pulmonalis.
