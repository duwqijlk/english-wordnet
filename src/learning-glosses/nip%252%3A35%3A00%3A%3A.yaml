simpleMeaning: to hold a thing between two fingers and press it hard
scope: To hold a thing between two fingers and press it hard, with squeeze, twitch, pinch, tweet and twinge
  as other names for this sense, and not a bite or cutting something off.
examples:
- He nipped his sister's arm to get her attention.
- She nipped the loose thread between her fingers.
