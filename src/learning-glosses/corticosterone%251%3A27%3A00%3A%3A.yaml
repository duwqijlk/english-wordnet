simpleMeaning: A body chemical made by the small glands above the kidneys, which helps keep the right
  amount of water and salts in the body.
scope: This is a body chemical made by the small glands above the kidneys, which helps keep the right
  amount of water and salts in the body, not a chemical made by the brain and not a drug taken as a pill.
examples:
- Corticosterone helps the body keep its water balance.
- The lab measured corticosterone in the blood.
