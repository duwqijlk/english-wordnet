simpleMeaning: the act of changing an organ pipe or another wind instrument so it meets set rules for
  its sound, how high or low its notes are, and its sound quality
scope: This is about changing a wind instrument so its sound is right, not about using the voice to speak
  or to make sounds.
examples:
- The voicing of the organ pipes took a whole day of careful work.
- Careful voicing made the wind instrument sound warm and clear.
