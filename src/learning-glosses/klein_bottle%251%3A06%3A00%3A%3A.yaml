senseId: 'klein_bottle%1:06:00::'
synsetId: 03627416-n
simpleMeaning: A shape with one side only, closed on itself, made when one end of a tube is pushed through
  the tube's own side and joined to its other end
scope: A one-sided closed shape in maths, not a Möbius strip, which has one edge, and not an ordinary
  open tube.
examples:
- The Klein bottle has only one side, so its inside and outside are the same.
- He drew a Klein bottle by showing a tube that passes through its own side.
