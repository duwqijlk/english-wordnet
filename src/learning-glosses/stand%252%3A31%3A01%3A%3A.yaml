simpleMeaning: Hold a view or keep a firm opinion about a public question or disputed matter.
scope: This is the opinion someone holds on a question or dispute, not physical posture, measured height,
  or holding firm under attack.
examples:
- Where do you stand on the proposal to close the library?
- The council has stood against the rezoning plan for years.
