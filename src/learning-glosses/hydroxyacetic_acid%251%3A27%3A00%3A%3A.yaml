simpleMeaning: Sugar cane, sugar beets, and unripe grapes all hold this acid, which forms crystals that
  let light through.
scope: Also called glycolic acid and glycollic acid, this acid forms crystals that let light through and
  is found in sugar cane, sugar beets, and unripe grapes, not the cane, the beet, or the grape itself.
examples:
- Hydroxyacetic acid occurs in unripe grapes and in sugar cane.
- The hydroxyacetic acid in the sample formed clear crystals.
