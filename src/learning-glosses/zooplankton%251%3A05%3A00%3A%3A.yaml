simpleMeaning: the tiny animals that float in water, mainly small shellfish and young fish
scope: This is the animal part of the tiny living things that float in water; not the plant part and not
  large sea animals.
examples:
- Tiny fish larvae in the zooplankton drifted with the tide.
- Whales eat huge amounts of zooplankton each day.
