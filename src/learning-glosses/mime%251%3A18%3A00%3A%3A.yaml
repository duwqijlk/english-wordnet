simpleMeaning: an actor who says nothing at all, and tells a story only with moves of the body and face
scope: 'Also called a mummer: an actor who tells a story without words, using only the body and face,
  not an actor who speaks lines.'
examples:
- The mime pretended to be trapped in a glass box.
- Children laughed as the mime pulled a face and walked against the wind.
