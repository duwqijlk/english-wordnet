simpleMeaning: A Chinese tree losing leaves each year, with male and female parts on separate trees, fan-shaped
  leaves, soft yellow seeds, grown almost only by people, especially along streets for show
scope: Also called ginkgo and maidenhair tree, this is the Chinese tree with fan-shaped leaves and soft
  yellow seeds, not a fern and not any tree with fan-shaped leaves.
examples:
- A gingko stood by the road, its fan-shaped leaves turning yellow.
- They planted a gingko outside the school for shade.
