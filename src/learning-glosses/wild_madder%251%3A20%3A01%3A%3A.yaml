simpleMeaning: Now growing on its own in North America, this herb of Europe and Asia bears large loose
  clusters of small white flowers.
scope: Also called false baby's breath, infant's-breath, white bedstraw, and white madder, it is a herb
  of Europe and Asia now growing on its own in North America.
examples:
- Large loose clusters of small white flowers marked the wild madder.
- In North America, wild madder grows on its own.
