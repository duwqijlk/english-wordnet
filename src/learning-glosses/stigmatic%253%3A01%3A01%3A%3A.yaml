senseId: 'stigmatic%3:01:01::'
synsetId: 03132122-a
simpleMeaning: To do with, or like, or having, holy marks.
scope: This sense is to do with, or like, or having, holy marks, unlike the sense for a person whose body
  is marked by holy stigmata, as marks like the wounds of the crucified Christ, and unlike the sense for,
  of a lens or set of lenses, free of the fault that blurs sight, so it makes sharp point images.
examples:
- The wound was stigmatic, like a holy mark.
- The mark was stigmatic, having holy marks.
