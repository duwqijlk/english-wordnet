simpleMeaning: move a person or thing from place to place.
scope: Also listed as wheel around, this means moving a person or thing from place to place, not turning
  in place and not moving along by itself.
examples:
- Two nurses wheeled the patient into the operating room.
- He wheeled the barrow of apples to the market.
