simpleMeaning: a stiff round band of metal, wood, or another material used to hold, fasten, hang, or pull
  something.
scope: This is not a piece of jewelry worn on a finger and not a sound; it is a sturdy loop used to secure
  or move things.
examples:
- He hung the bucket from a metal ring on the wall.
- The curtain hangs from rings on a rod.
