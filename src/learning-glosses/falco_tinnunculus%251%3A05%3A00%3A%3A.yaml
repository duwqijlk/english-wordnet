simpleMeaning: A small falcon of the lands of Europe, Asia and Africa that hovers in the air against the
  wind.
scope: Unlike the North American kestrel, this is the Old World falcon, not the American one.
examples:
- A Falco tinnunculus hovered in the air above the field.
- We watched a Falco tinnunculus holding still against the wind.
