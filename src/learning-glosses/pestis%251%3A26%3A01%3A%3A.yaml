senseId: 'pestis%1:26:01::'
synsetId: 14162173-n
simpleMeaning: A serious infection of rodents, sometimes deadly, caused by a bacterium; it reaches people
  by accident when a flea that has bitten an infected animal bites them.
scope: Another name for the plague, the same disease as pest and pestilence, not the bacterium that causes
  it.
examples:
- Pestis reaches people through the bite of a flea that has fed on an infected animal.
- The doctor had seen only a few cases of pestis.
