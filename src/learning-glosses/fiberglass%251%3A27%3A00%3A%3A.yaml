simpleMeaning: a material used to cover things, made from thin glass threads held together with resin
  (a thick sticky stuff)
scope: A man-made covering material made of glass threads and resin, not plain glass and not a single
  glass thread.
examples:
- The boat's outer part is made of fiberglass.
- They used fiberglass to cover the roof.
