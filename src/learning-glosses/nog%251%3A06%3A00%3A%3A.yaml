simpleMeaning: A block of wood set into a stone or brick wall, so that woodwork can be nailed fast to
  it.
scope: A wooden block set into a wall for nailing woodwork to, not the wooden pin of the same name.
examples:
- The carpenter fixed a nog into the wall before hanging the frame.
- Each nog gave the joiner something solid to nail into.
