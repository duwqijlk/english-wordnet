simpleMeaning: a leg that bends out at the knee, or below the knee
scope: 'Also called bandy leg, bandyleg, bow leg and genu varum: a leg that bends out at the knee, not
  a leg that bends in at the knee and not a broken leg.'
examples:
- The child had a bowleg that made his walk look wide.
- The doctor looked at the bowleg and said it would straighten with time.
