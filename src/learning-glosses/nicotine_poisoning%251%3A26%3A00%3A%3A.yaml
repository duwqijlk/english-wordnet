simpleMeaning: A harmful state of the body caused by swallowing or breathing in far too much of a drug.
scope: A harmful state of the body caused by swallowing or breathing in far too much of a drug, not food
  poisoning and not a small dose that does no harm.
examples:
- He showed signs of nicotine poisoning after chewing the strong leaves.
- Nicotine poisoning can make a person sick and shaky.
