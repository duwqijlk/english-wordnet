simpleMeaning: showing strong anger about being treated in an unfair way, or not trusting that other people
  mean well
scope: This describes a person who holds strong anger about unfair treatment and trusts others little,
  not deep sadness, not a fight full of hate, and not cold that hurts.
examples:
- He was bitter about the divorce for a long time.
- She felt bitter after she lost her job to a less able worker.
