senseId: 'annual_parallax%1:19:00::'
synsetId: 11549087-n
simpleMeaning: The shift in how a far-off body in the sky seems placed, seen from two spots on the earth's
  path round the sun
scope: The shift in how a far-off body in the sky seems placed, seen from two spots on the earth's path
  round the sun; heliocentric parallax is another name for this sense, not the body's true shift in space
  and not the shift seen from two spots on earth.
examples:
- Annual parallax lets us judge a star's distance.
- The annual parallax of the star was too small to see.
