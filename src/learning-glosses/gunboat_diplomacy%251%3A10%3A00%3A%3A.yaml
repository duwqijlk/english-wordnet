simpleMeaning: Countries get what they want by warning that they will use armed force
scope: 'Also called power politics: countries winning their aims by the threat of force, not open war
  and not fair talks.'
examples:
- Gunboat diplomacy forced the small nation to open its ports.
- The minister warned that gunboat diplomacy would only make the crisis worse.
