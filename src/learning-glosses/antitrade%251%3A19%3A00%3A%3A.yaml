simpleMeaning: winds high in the warm lands near the equator that blow from west to east above the trade
  winds
scope: 'Also called antitrade wind: high winds in the tropics that blow from west to east, not the trade
  winds below them and not winds that blow from east to west.'
examples:
- The antitrade blows high above the trade winds.
- Pilots watch the antitrade when they fly across the tropics.
