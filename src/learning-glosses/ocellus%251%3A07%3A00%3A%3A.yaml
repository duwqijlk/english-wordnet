simpleMeaning: A mark that looks like an eye on the wings of some butterflies, often a spot of one colour
  inside a ring of a second colour
scope: A mark that looks like an eye, also called an eyespot, not a real eye and not a plain spot of one
  colour.
examples:
- The butterfly had a bright ocellus on each wing.
- An ocellus on the moth's wing looked like a staring eye.
