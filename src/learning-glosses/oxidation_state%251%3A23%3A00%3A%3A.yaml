simpleMeaning: In chemistry, a number tells how much an atom, a charged bit, or a group of atoms has been
  oxidised; for plain atoms and charged bits it is the charge.
scope: In chemistry, a number that tells how much an atom or a charged bit has been oxidised; oxidation
  number is another name for this sense.
examples:
- The teacher worked out the oxidation state of each atom in the salt.
- In this salt, the oxidation state of oxygen is -2.
