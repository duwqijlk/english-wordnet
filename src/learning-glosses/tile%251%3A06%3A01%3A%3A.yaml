simpleMeaning: a flat thin piece with letters or signs on it, used to play board games such as Mah-Jong
  or Scrabble
scope: A flat marked piece used in a board game, not a piece for covering a floor or wall and not one
  made for a roof.
examples:
- She placed a tile on the Scrabble board to make a word.
- He drew a tile from the Mah-Jong set.
