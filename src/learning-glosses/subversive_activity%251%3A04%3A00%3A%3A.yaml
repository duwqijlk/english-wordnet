simpleMeaning: doing something that tries to bring down or destroy a government set up by law
scope: 'Also called subversion: work that tries to bring down a lawful government, not a lawful protest
  and not a change of government by vote.'
examples:
- The subversive activity aimed to bring down the government.
- Police said the subversive activity threatened the lawful government.
