simpleMeaning: to confuse someone so much that they cannot think clearly
scope: This is mental confusion, not emotional upset, and not about sending a look or gesture.
examples:
- The sudden change of plan threw everyone in the room.
- Her sharp reply threw him, and he lost his train of thought.
