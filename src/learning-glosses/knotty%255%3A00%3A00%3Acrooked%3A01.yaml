simpleMeaning: used of old people or old trees, with hard raised lumps and knots on the surface
scope: 'Also called knotted, gnarled, gnarly and knobbed: this is about the bent, lumpy look of old people
  or trees, not a hard problem and not string twisted together.'
examples:
- The old man's knotty hands were bent and covered with lumps.
- A knotty old tree stood by the gate, its wood full of hard knots.
