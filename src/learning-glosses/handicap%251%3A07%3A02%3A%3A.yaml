simpleMeaning: a help given to the weaker side in a game or race so that each side has an equal chance
  to win
scope: A help given to make a game or race fair; not something that slows action down, and not a body
  or mind condition that stops a person doing things as others do.
examples:
- The weaker team got a handicap of two goals to make the game fair.
- She had a five-point handicap, so she started ahead of the stronger players.
