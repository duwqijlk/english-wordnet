simpleMeaning: a measure of area, one tiny length by one tiny length, each a thousandth of a metre
scope: A measure of area, one tiny length by one tiny length, each a thousandth of a metre; square millimeter
  is another name for this sense, not a measure of length and not a measure of size in three ways.
examples:
- A square millimetre is a tiny patch of area.
- The spot was two square millimetres wide.
