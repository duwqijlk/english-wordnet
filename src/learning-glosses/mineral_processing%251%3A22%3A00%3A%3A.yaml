simpleMeaning: breaking up and sorting rock in many different ways to get the useful stuff out of it and
  leave the waste
scope: Breaking up and sorting rock to get the useful stuff out, also called beneficiation, mineral dressing,
  mineral extraction, ore dressing and ore processing; not digging the rock out and not melting metal.
examples:
- Mineral processing turns raw ore into useful stuff.
- The plant does mineral processing before the metal is made.
