simpleMeaning: In cooking in Indonesia, people use the dried underground stem of Kaempferia galanga, a
  plant of the ginger kind, or powder made from it.
scope: The dried underground stem of Kaempferia galanga, a plant of the ginger kind, is what this names,
  whether whole or as powder, for use in cooking in Indonesia.
examples:
- They added kencur to the dish they were cooking.
- They cooked with dried kencur and with its powder too.
