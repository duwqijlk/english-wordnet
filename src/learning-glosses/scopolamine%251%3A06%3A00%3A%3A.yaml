simpleMeaning: To calm, stop sickness, and widen the dark centres of the eyes during eye care, this alkaloid,
  a drug made from plants, stops one kind of nerve signal.
scope: Also called hyoscine, this is the plant drug used to calm, stop sickness, and widen the dark centres
  of the eyes in eye care.
examples:
- She took scopolamine for nausea.
- The scopolamine calmed her.
