simpleMeaning: an orderly framework used to sort or group things.
scope: This sense is not a method for reaching a goal, not the body's organs, and not simple tidiness;
  it is a scheme for putting things into order or classes.
examples:
- The library’s classification system groups books by subject.
- The filing system sorts papers by date.
