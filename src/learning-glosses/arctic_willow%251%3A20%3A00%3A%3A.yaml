simpleMeaning: A low shrub that spreads along the ground in the far north of Europe and America.
scope: A low shrub that spreads along the ground in the far north, not a tall tree and not a garden shrub.
examples:
- The arctic willow spreads along the ground near our camp.
- Arctic willow stays low even in summer.
