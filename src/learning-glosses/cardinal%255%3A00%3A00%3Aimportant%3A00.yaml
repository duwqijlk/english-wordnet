simpleMeaning: needed as a basic and most important part of something
scope: 'Also called key, central, fundamental and primal: most important and needed for something to work.
  Not a church leader, not a red bird, and not a number that shows how many but not order.'
examples:
- Honesty is a cardinal rule in this school.
- Keeping patients safe is a cardinal part of a doctor's work.
