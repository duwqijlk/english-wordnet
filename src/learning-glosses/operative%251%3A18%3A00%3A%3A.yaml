simpleMeaning: A detective for hire who gets information for others and helps with the work of looking
  into crimes
scope: A person hired as a detective to get facts about crimes, not a secret worker for a government,
  not the word for surgery, and not a machine that works.
examples:
- The operative followed the man and wrote down where he went each day.
- Police hired an operative to help them find facts about the crime.
