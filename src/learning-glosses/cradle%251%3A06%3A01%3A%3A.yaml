senseId: 'cradle%1:06:01::'
synsetId: 04105889-n
simpleMeaning: a long box that can be rocked from side to side, used by people who dig for gold to shake
  earth in water so the gold comes out
scope: This is the gold-mining tool itself, a long box rocked in water, not the place where something
  began and not the act of cutting grain.
examples:
- The miners rocked the cradle in the stream to wash out the gold.
- He put the earth into the cradle and shook it in the water.
