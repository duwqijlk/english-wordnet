simpleMeaning: A new way of dividing up seats or shares, above all a new way of dividing up seats in the
  United States Congress after a count of the people
scope: 'Also called reallocation and reallotment: a new dividing up, above all of seats in Congress after
  a census, not the first dividing up and not a new law.'
examples:
- The reapportionment moved two seats from one state to another.
- After the census, the reapportionment of seats in Congress began.
