simpleMeaning: An infection of animals and people from the bacterium Listeria monocytogenes, especially
  in newborns and people with weak immunity; in sheep and cattle it often reaches the brain and nerves.
scope: This is the illness caused by Listeria monocytogenes, which can stay in the gut or spread through
  the body; listeriosis is the general name for it, and this name is used when it reaches the membranes
  around the brain and spinal cord. It is not meningitis caused by other bacteria.
examples:
- Doctors treated the newborn for listeria meningitis after she developed a high fever and a stiff neck.
- In sheep, listeria meningitis can cause circling and pressing the head against fences.
