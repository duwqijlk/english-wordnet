simpleMeaning: in a way that is about soldiers and armed forces
scope: This word links a fact or action to soldiers and armed forces; it is not about the police, and
  it is not about life away from soldiers and war.
examples:
- Militarily, the country is strong, with a large army.
- The plan worked well militarily but failed in other ways.
