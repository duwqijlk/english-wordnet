simpleMeaning: In the study of weather, a line joining places where the weight of the air is the same
  at one time
scope: In the study of weather, a line joining places with the same air weight at one time, not a line
  of equal heat and not a line of equal magnetic pull.
examples:
- The map's isobars show where the air weight is the same.
- A tight pack of isobars means strong winds are coming.
