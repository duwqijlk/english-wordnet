simpleMeaning: A sloping heap of loose stones below a cliff face.
scope: This sense is also called scree, for a sloping heap of loose stones below a cliff face, unlike
  the sense for the ankle bone that joins with the leg bones to make the ankle joint.
examples:
- Talus lay in a heap at the foot of the cliff.
- The talus slope was made of loose stones.
