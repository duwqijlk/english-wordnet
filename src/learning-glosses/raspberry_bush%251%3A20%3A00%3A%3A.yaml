simpleMeaning: Fruit that is usually red but at times black or yellow grows on this woody, thorny plant,
  coming off its base when ripe and rounder and smaller than blackberries.
scope: Also called raspberry, this woody, thorny plant bears fruit, usually red but at times black or
  yellow, that comes off its base when ripe.
examples:
- The raspberry bush bore red fruit.
- We picked fruit from the raspberry bush.
