simpleMeaning: An electronic device with metal parts set inside a glass or metal case with the air taken
  out.
scope: 'Also called tube, electron tube, thermionic tube, thermionic vacuum tube and thermionic valve:
  an electronic device with metal parts inside a case with the air taken out, not a glass pipe for water
  and not a light bulb.'
examples:
- The old radio used a vacuum tube to make the sound louder.
- A vacuum tube holds metal parts inside a case with the air taken out.
