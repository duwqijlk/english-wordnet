simpleMeaning: a head covering with a wide edge that shades the face from light that falls straight on
  it
scope: A head covering with a wide edge that shades the face, also called a sunhat, not a cap with a small
  peak and not a hat worn only to keep warm.
examples:
- She put on a sun hat before going out into the garden.
- His sun hat kept the bright light off his face.
