simpleMeaning: to give something marks of different shades in streaks or patches
scope: 'Also called cloud and dapple: to colour something with streaks or patches of different shades,
  not to mark it with spots as if stained.'
examples:
- Autumn mottled the leaves with yellow and brown.
- The old paint mottled the wall with streaks of grey.
