simpleMeaning: Wanting wit or fancy.
scope: This sense is also called pedestrian, earthbound, and prosaic, for wanting wit or fancy, where
  pedestrian is dull and flat, with nothing clever or new in it.
examples:
- The tale was prosy, wanting wit.
- The speech was prosy, wanting fancy.
