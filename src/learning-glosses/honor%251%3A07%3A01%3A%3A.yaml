simpleMeaning: A woman's moral purity in sexual matters, seen as a quality of her character.
scope: This sense is about a woman's sexual purity as a moral quality, not about a good reputation or
  good character in general, and not about the respect or awards a person receives.
examples:
- In the novel, her honor mattered more to the family than her happiness.
- The old code required a lady to protect her honor at all costs.
