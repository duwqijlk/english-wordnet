  spots, bumps, or blackheads
scope: A skin condition in which the oil-making glands get sore and swollen, making spots and bumps, not
  a rash from heat and not a cut.
examples:
- Teenagers often suffer from acne on their faces.
- The cream helped clear up his acne.
