simpleMeaning: made of small bits like flour, or covered with small bits like flour, in feel and in the
  way it looks
scope: 'Also called gritty, grainy, granular, coarse-grained, farinaceous and granulose: this is about
  a feel like flour-like bits, not about food made from meal.'
examples:
- The potatoes had a mealy feel and broke into dry bits.
- A mealy powder covered the leaves in a thin layer.
