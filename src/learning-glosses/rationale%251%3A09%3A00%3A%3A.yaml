simpleMeaning: In law, a way of telling the basic reasons for something, especially how a machine works
  by the rules of nature
scope: In law, this is a way of telling basic reasons, also called principle; it is not a short excuse
  for a choice and not the machine itself.
examples:
- The judge asked for the rationale behind the rule.
- He read the rationale to learn how the device worked by the laws of nature.
