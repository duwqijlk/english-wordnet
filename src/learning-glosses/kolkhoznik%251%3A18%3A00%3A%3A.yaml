simpleMeaning: a person who lives and works on a shared farm run by its members
scope: A person who lives and works on a shared farm run by its members, not a farmer on his own land
  and not a farm worker paid by the day.
examples:
- The kolkhoznik worked the fields from dawn till dusk.
- Old kolkhozniks still meet to talk of the harvest.
