simpleMeaning: a clear piece of material that bends light together or apart as it passes through, to make
  a picture
scope: 'Also called lens: a clear piece that bends light to make a picture, not a mirror and not a window.'
examples:
- The lense in the camera bends the light to form a sharp picture.
- She cleaned the lense of her glasses before reading.
