simpleMeaning: the belief that people can know God by reason alone, without help from holy books or visions
scope: 'Also called deism: a belief in God based on reason alone, not faith in holy books and not the
  view that there is no God.'
examples:
- His free thought led him to question what the church taught.
- Free thought holds that reason alone can show that God exists.
