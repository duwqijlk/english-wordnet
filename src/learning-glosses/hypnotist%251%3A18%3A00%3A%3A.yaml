simpleMeaning: a person who puts another person into a sleep-like state so that the other person follows
  their words and ideas
scope: Another name for this sense is hypnotizer. It names the person who puts someone into a sleep-like
  state, not that state itself.
examples:
- The hypnotist put her into a deep, sleep-like state with his calm voice.
- People watched as the hypnotist guided the man to follow only his words.
