simpleMeaning: Flowers like daisies, yellow round the edge and dark in the middle, grow on long-lived
  herbs of Europe and Asia.
scope: These long-lived herbs of Europe and Asia bear flowers like daisies, yellow round the edge and
  dark in the middle, unlike the North American herb of the same name with large yellow flowers like daisies.
examples:
- The oxeye grows in Europe and Asia.
- An oxeye has yellow flowers with dark centers.
