simpleMeaning: In physics, how far light or other rays get through a substance is given by this figure.
scope: Also called absorbance, optical density, and transmission density, this physics figure is worked
  out from the light or other rays that get through a substance.
examples:
- The photographic density of the glass tells how much light it lets through.
- A high photographic density means little light gets through the substance.
