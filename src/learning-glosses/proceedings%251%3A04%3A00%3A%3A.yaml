simpleMeaning: In law, the act of starting the set of steps in a court case that lead to a ruling
scope: 'Also called a proceeding: the steps in a court case that lead to a ruling, not the ruling itself.'
examples:
- The proceedings began with the filing of the claim.
- The court set a date for the proceedings to start.
