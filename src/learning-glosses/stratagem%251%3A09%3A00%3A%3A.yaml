simpleMeaning: a plan with many parts, made to trick people or to avoid something
scope: 'Also called dodge and contrivance: a plan with many parts to trick or avoid, not just a quick
  trick and not an open, honest plan.'
examples:
- His stratagem was to send a false message and slip away in the dark.
- The general used a stratagem to trick the enemy and avoid a fight.
