simpleMeaning: A birth disorder in which a person cannot digest milk or milk foods, since lactase is lacking
  or too scant to break lactose down.
scope: Also called lactase deficiency and milk intolerance, a birth disorder in which a person cannot
  digest milk or milk foods, since lactase is lacking or too scant to break lactose down.
examples:
- Lactose intolerance stops milk digestion.
- They live with lactose intolerance.
