senseId: 'purge%2:29:04::'
synsetId: 00076153-v
simpleMeaning: To empty the stomach by throwing its contents up through the mouth.
scope: To throw up what the stomach holds; also called sick, cat, cast, vomit, puke, chuck, retch, honk,
  and spew, not clearing the bowels, not the sudden removal of people, not washing out with liquid, and
  not making a person free from sin.
examples:
- He purged continuously after the bad meal.
- The sick boy purged again and again.
