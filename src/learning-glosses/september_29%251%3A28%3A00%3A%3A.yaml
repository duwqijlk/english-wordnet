simpleMeaning: A day that honours the archangel Michael, a quarter day in England, Wales and Ireland.
scope: The sense covers the feast of the archangel Michael on this date, a quarter day in England, Wales
  and Ireland; Michaelmas and Michaelmas Day are other names for this sense.
examples:
- September 29 is kept as the feast of St Michael.
- Rents were once due on September 29, a quarter day in England.
