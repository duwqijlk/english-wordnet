simpleMeaning: a sour liquid usually made from wine or cider by changing the alcohol in it with air, used
  to add taste to food or to keep food from going bad
scope: A sour liquid made from wine or cider for food, not plain water and not the weak acid used in a
  lab.
examples:
- She poured vinegar over the salad.
- A spoonful of vinegar keeps the pickles from going bad.
