senseId: 'bacchantic%3:01:00::'
synsetId: 02667506-a
simpleMeaning: to do with a person who drinks too much and makes a loud, wild show of joy at a party,
  or like such a person
scope: Like a drunken reveller, or to do with such a person, not the party itself and not a person who
  follows the god of wine.
examples:
- The bacchantic songs grew louder as the night went on.
- His bacchantic laughter filled the hall as he drank and danced.
