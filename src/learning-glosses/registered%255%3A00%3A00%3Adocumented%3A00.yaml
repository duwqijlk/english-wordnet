simpleMeaning: Of a boat or ship, having the official papers it needs, which say who owns it and other
  such facts
scope: This sense is about a boat or ship with its official papers; it is not the sense for an animal
  on an official list for its kind.
examples:
- The registered boat carried papers showing who owned it.
- Only a registered ship may carry goods for this company.
