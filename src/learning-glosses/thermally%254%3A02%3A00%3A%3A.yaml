simpleMeaning: by using heat, or in a way that concerns heat and how hot or cold a thing is
scope: This is about heat and how hot or cold a thing is, not about light and not about sound.
examples:
- The metal expands thermally when it is heated.
- The glass cracks thermally if it cools too fast.
