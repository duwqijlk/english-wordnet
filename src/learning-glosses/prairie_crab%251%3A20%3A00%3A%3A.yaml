simpleMeaning: a wild apple tree of the western United States with sweet-smelling pink flowers
scope: Also called western crab apple, this is a wild apple tree of the western United States with sweet-smelling
  pink flowers, not a farm apple tree and not a pink flower with no fruit.
examples:
- A prairie crab grew at the edge of the field, covered in pink flowers in spring.
- Bees moved among the pink flowers of the prairie crab in the western hills.
