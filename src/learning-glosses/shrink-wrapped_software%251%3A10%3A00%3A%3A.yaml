simpleMeaning: Made for the computers most people use, this software comes on discs in sealed plastic
  boxes sold in shops.
scope: This software runs on the computers most people use, sold in shops on discs in sealed plastic boxes,
  not written for one special machine.
examples:
- The shop sells shrink-wrapped software on discs in sealed boxes.
- He opened the shrink-wrapped software and put the disc in his computer.
