simpleMeaning: Giving the impression of high cost, or being marked by heavy spending.
scope: Costly appearance or heavy expense only; not having much money, not full of some desirable substance
  or resource, not high in minerals or fuel content, not deep or full in flavor, not provoking anger through
  hypocrisy, not of great worth, not fruitful or productive, not strong and intense in color, not heavy
  with fat, eggs or sugar, not pleasantly full and mellow, not supplied in abundance, and not the noun
  for wealthy people as a group.
examples:
- The lobby was a rich display of marble, brass and fresh flowers.
- The wedding was a rich affair, with champagne and a live orchestra.
