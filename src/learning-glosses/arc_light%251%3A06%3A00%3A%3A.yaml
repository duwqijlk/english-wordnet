simpleMeaning: A lamp that gives off brightness when electric current jumps the gap between two ends that
  carry the current.
scope: 'Also called arc lamp: a lamp that gives off brightness when electric current jumps a gap, not
  an ordinary bulb and not a torch.'
examples:
- The arc light shone over the building site.
- An arc light gives off brightness from a spark.
