simpleMeaning: a thing that is sure to happen or sure to be true
scope: A thing that is sure to happen or to be true; not the state or feeling of being sure, which is
  the other sense of this word.
examples:
- That the sun will rise tomorrow is a certainty.
- Her success in the exam is a certainty, her teachers all say.
