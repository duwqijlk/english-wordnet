scope: This is a ceremony in Judaism that marks a Jewish girl's twelfth birthday and the start of her
  religious duties, also called bas mitzvah or bat mitzvah.
examples:
- Friends and family came to her bath mitzvah.
- Her bath mitzvah marked her twelfth birthday.
