senseId: 'isogonic_line%1:15:00::'
synsetId: 08507850-n
simpleMeaning: A drawn mark joining places on the Earth's surface where a compass needle points away from
  true north by the same amount
scope: A drawn mark joining places where a compass needle points away from true north by the same amount;
  isogonal line and isogone are other names for this sense, not a mark of equal needle dip and not a weather
  mark.
examples:
- The isogonic line on the chart joins places with the same compass error.
- Pilots follow the isogonic line to correct for compass drift.
