simpleMeaning: Wood chips and shavings, stuck together with sticky plant sap and pressed hard, make stiff
  flat sheets for walls.
scope: 'Also called fiberboard and fibreboard: stiff flat sheets of pressed wood chips used for walls,
  not solid wood.'
examples:
- The shelf was made from particle board, not solid wood.
- Particle board is pressed from wood chips and glue.
