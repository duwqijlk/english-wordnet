simpleMeaning: A harmful growth that starts in the tissue that makes juices in the body.
scope: A harmful growth starting in gland tissue, also called glandular cancer and glandular carcinoma;
  not a harmless growth and not a growth in other tissue.
examples:
- The doctors found an adenocarcinoma in her lung.
- An adenocarcinoma grows from the cells that make body juices.
