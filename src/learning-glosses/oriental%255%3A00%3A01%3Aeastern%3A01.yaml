simpleMeaning: about or typical of the countries of Asia and the way of life there
scope: This word describes things that are about or typical of the countries of Asia; it does not name
  a person from Asia, and it is not about just any place in the east.
examples:
- The museum has a room of oriental art from China and Japan.
- She studies the history of oriental civilization.
