simpleMeaning: a very large animal with thick skin that eats plants and lives in or near rivers in hot
  parts of Africa
scope: A very large plant-eating river animal of Africa; not an elephant and not a rhinoceros.
examples:
- A hippo stood in the river with only its eyes above the water.
- Hippos spend much of the day in the water.
