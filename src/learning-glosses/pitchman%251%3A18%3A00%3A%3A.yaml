simpleMeaning: Goods are sold by this person, who goes from place to place, on the streets or at fairs
scope: Also called a peddler or a hawker, this person goes from place to place selling goods on the streets
  or at fairs, not a shopkeeper who stays in one shop.
examples:
- A pitchman sold scarves from a cart on the street.
- The pitchman moved from town to town selling his goods.
