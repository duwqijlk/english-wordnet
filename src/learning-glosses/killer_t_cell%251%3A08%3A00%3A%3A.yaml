senseId: 'killer_t_cell%1:08:00::'
synsetId: 05460092-n
simpleMeaning: A T cell with a CD8 receptor that recognizes antigens on a virus-infected cell, attaches
  to that cell, and kills it.
scope: Also called killer cell, CD8 cell, CD8 T cell, or cytotoxic T cell; this is a CD8 T cell that kills
  virus-infected cells, not other white blood cells.
examples:
- The killer T cell fastened on to the infected cell.
- Killer T cells kill virus-infected cells.
