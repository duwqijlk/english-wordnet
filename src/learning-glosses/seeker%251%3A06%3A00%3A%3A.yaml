simpleMeaning: a weapon that flies through the air and has a part that is pulled toward heat, light, sound,
  or radio waves
scope: This is a flying weapon drawn toward heat, light, sound, or radio waves; it is not a person who
  is looking for something.
examples:
- The jet fired a seeker that flew toward the heat of the other plane.
- This seeker follows radio waves back to where they came from.
