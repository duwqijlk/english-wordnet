simpleMeaning: any stiff, sharp-pointed thing used to hold something in place
scope: Also called spike. It is a stiff, sharp point that holds things pushed onto it, not a stick for
  spinning thread and not a turning shaft in a machine.
examples:
- She put each bill on the spindle on her desk to keep them in order.
- Receipts were held on a metal spindle beside the till.
