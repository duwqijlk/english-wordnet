simpleMeaning: a knot used to tie a rope to a post or pole for a short time
scope: A knot that ties a rope to a post or pole for a short time, not a knot that holds a rope fast for
  good and not a knot that joins two ropes.
examples:
- He tied a clove hitch to fasten the rope to the post.
- A clove hitch held the line to the spar while we loaded the boat.
