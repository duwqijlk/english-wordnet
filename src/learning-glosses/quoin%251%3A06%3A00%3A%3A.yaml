simpleMeaning: In building, the strong outer corner of a building, most often one made of a cornerstone
scope: 'Another name for corner: the strong outer corner of a building, not the wedge printers use to
  lock a form in place.'
examples:
- The quoin at the corner of the old church was made of large cut stones.
- The builders gave the quoin a lighter colour than the rest of the wall.
