senseId: 'aliquant%1:23:00::'
synsetId: 13756956-n
simpleMeaning: a whole number that cannot divide a number into equal whole parts
scope: 'Another name for an aliquant part: a whole number that does not divide another number exactly,
  not an aliquot that does divide a number exactly.'
examples:
- The teacher showed that 5 is an aliquant of 12.
- Seven is an aliquant of 20 because it does not divide 20 into equal whole parts.
