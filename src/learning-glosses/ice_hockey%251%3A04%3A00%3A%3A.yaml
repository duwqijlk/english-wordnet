simpleMeaning: Two teams of six skaters chase a flat round puck over frozen water and try to knock it
  into the goal of the other team with bent sticks.
scope: Also called hockey and hockey game, this is a game of two teams of six on skates chasing a puck.
examples:
- Our school ice hockey team won three games in a row.
- She learned to play ice hockey when she was seven.
