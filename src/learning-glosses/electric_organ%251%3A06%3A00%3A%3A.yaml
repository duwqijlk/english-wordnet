simpleMeaning: In music, a power-driven instrument that copies the sounds of a pipe instrument
scope: 'Also called organ and electronic organ: a power-driven instrument that copies the sounds of a
  pipe instrument, not the pipe instrument itself and not a piano.'
examples:
- The church bought an electric organ to take the place of the old pipes.
- She played a hymn on the electric organ during the service.
