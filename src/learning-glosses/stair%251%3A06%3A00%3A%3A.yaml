simpleMeaning: one of the raised parts you put your foot on when moving up or down a flight of steps
scope: This is a single raised tread in a flight, another name for the same sense as 'step', not the whole
  flight or a stage in a process.
examples:
- She sat on the bottom stair to tie her shoes.
- The third stair creaked under his weight.
