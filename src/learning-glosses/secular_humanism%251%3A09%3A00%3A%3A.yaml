simpleMeaning: The belief that people can grow into their best selves by thinking for themselves, and
  that turns away from religion and the unseen
scope: The belief that people can grow into their best selves by thinking for themselves, and that turns
  away from religion and the unseen, also called humanism; not a faith that looks to a god and not a mere
  love of books.
examples:
- Secular humanism puts reason before faith.
- He followed secular humanism all his life.
