simpleMeaning: A herb found all over the tropics, with rings of showy flowers shaped like lips; it now
  grows wild in the United States.
scope: A herb of the tropics with rings of lipped flowers, also called lion's-ear and Leonotis nepetifolia;
  not a garden mint and not a wild sage.
examples:
- Leonotis nepetaefolia grows wild along roads in the southern United States.
- The rings of lipped flowers mark Leonotis nepetaefolia out from other herbs.
