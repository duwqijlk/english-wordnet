schema: oewn-learning-gloss-v2
senseId: 'unfairness%1:07:00::'
synsetId: 04846907-n
simpleMeaning: a way of treating people that is wrong because it does not follow the rules or standards
  that should be used
scope: 'Also called inequity: this is about people not being treated as they should be under the rules
  or standards. It is not a rule that is only strict, and it is not bad luck.'
examples:
- The players complained about the unfairness of the decision, which broke the agreed rules.
- She pointed to unfairness in the way the marks were given, as some work was judged by a different standard.
