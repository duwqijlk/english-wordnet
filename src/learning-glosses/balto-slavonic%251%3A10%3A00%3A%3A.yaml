simpleMeaning: A group of tongues in the large Indo-European family of tongues, covering the Slav tongues
  and the Baltic tongues.
scope: This is a group of tongues in the large Indo-European family, covering the Slav tongues and the
  Baltic tongues; Balto-Slavic and Balto-Slavic language are other names for it, and it is not the whole
  Indo-European family.
examples:
- Balto-Slavonic covers the Slav tongues and the Baltic tongues.
- Polish is part of the Balto-Slavonic family of languages.
