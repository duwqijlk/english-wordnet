simpleMeaning: In a way that is not stated, or by a method that is not stated.
scope: In an unstated manner or by an unstated method, not for an unstated reason; someway and someways
  are other names for this sense.
examples:
- Somehow she found her way home in the dark.
- The message reached us somehow, though no one knows who sent it.
