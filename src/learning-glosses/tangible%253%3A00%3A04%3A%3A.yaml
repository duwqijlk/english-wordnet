simpleMeaning: Able to be noticed, especially by being held, touched, or felt.
scope: Also called palpable, this is able to be noticed, especially by touch, not a business thing with
  a money value.
examples:
- There was a tangible chill in the room when he spoke.
- Her anger was almost tangible in the silence that followed.
