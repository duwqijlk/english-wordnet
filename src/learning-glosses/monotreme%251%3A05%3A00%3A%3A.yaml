simpleMeaning: The earliest kind of mammals, the only still-living members of the group of egg-laying
  mammals
scope: 'Egg-laying mammal is another name for this sense: the earliest kind of mammals, still living today,
  not a pouched mammal and not a placental mammal.'
examples:
- The platypus is a monotreme.
- Monotremes are the earliest kind of mammals still living.
