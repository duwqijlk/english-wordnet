simpleMeaning: a poison made from a plant from Europe and Asia, in the Conium group (a set of plants alike
  in kind)
scope: This is the poison made from the plant, not the tall green tree with the same name and not wood
  from that tree.
examples:
- He died after drinking hemlock given to him as a poison.
- The old story says the man was killed by hemlock in his drink.
