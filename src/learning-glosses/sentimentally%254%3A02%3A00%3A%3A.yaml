simpleMeaning: in a way that is guided by feelings rather than by careful thought
scope: Guided by feelings rather than by careful thought; not done in a practical way that follows only
  facts and reasons.
examples:
- She smiled sentimentally when she talked about her childhood home.
- He spoke sentimentally about the friends he had not seen for years.
