senseId: 'correlational_analysis%1:09:00::'
synsetId: 06039360-n
simpleMeaning: using number links between things that change to judge how strong the links are
scope: This is a way of using number links to judge how strong the links between things that change are,
  not a way of showing that one thing causes another.
examples:
- Her correlational analysis showed a strong link between sleep and test scores.
- The correlational analysis found that the two sets of numbers moved together.
