simpleMeaning: A metal made by pouring hot liquid into a shape, with nickel, chromium, copper or molybdenum
  mixed in, most often, to make it stronger or easier to treat with heat
scope: This is a metal made by pouring hot liquid into a shape, with nickel, chromium, copper or molybdenum
  mixed in, also called alloy iron; not the plain kind with nothing mixed in.
examples:
- The alloy cast iron was stronger than plain iron.
- Alloy cast iron is made with nickel or chromium mixed in.
