simpleMeaning: the act of giving a baby or young animal other food in place of its mother's milk
scope: This is the act of giving a baby or young animal food other than its mother's milk, also called
  weaning; not breastfeeding and not a change of diet for an adult.
examples:
- The ablactation of the lamb began when the farmer gave it hay and grain.
- The doctor talked to the mother about ablactation when the baby was six months old.
