simpleMeaning: Blue-purple blooms grow on this vine from the south of the United States
scope: Also called blue jasmine, blue jessamine and curly clematis, this is a vine from the south of the
  United States with blue-purple flowers, not a shrub and not a vine from the north.
examples:
- Marsh clematis grew along the fence with blue-purple flowers.
- The marsh clematis in the garden climbs over the wall.
