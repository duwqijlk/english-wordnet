simpleMeaning: Outside-the-bag surgery for clouded lenses, in which ultra-high sound breaks the lens's
  rind and core into small bits that are then sucked away through a small tube.
scope: 'In eye surgery: breaking a clouded lens into bits with sound and sucking them away.'
examples:
- Phacoemulsification breaks the lens into bits.
- Phacoemulsification sucks bits away.
