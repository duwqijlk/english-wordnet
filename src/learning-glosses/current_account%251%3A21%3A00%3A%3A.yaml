simpleMeaning: The part of a nation's money records that keeps track of goods and services sold and bought
  abroad, and of money sent across borders.
scope: This is the part of a country's balance of payments that keeps its trade and transfer payments.
examples:
- The country's current account showed more money coming in than going out.
- A fall in exports shrank the current account surplus.
