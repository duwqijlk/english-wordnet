simpleMeaning: With much hard talk over the price, two sides swap animals back and forth
scope: The swapping of animals with much bargaining, also called horse trade; not the wider sense of bargaining
  over any deal, where no animals change hands.
examples:
- Horse trading at the fair went on all day.
- He was good at horse trading and always got a fair price for his animals.
