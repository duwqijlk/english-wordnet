simpleMeaning: a small piece made of wood, plastic, or ivory, used in card or board games to keep a count
  or to hold a place
scope: This is a small piece used in a card or board game, not a shop table and not a person who counts
  things.
examples:
- Move your counter two spaces forward on the board.
- Each player starts the game with five counters.
