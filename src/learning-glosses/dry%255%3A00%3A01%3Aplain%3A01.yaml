simpleMeaning: Food served plain, with no spread, sauce or garnish.
scope: Describes food served without any spread, sauce or garnish, not a room or design with no decoration,
  and not a wine with little sugar.
examples:
- He ate the dry toast without butter.
- The dry meat needed some sauce to be enjoyable.
