simpleMeaning: a light fixed at the back of a car or other vehicle, usually red
scope: This is the light at the back of a vehicle, usually red, not a light at the front of a vehicle
  and not a light inside it.
examples:
- One taillight on the car was broken, so he fixed it before the trip.
- In the dark we could see the red taillights of the cars ahead.
