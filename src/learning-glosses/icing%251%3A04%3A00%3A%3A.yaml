simpleMeaning: In ice hockey, shooting the puck from your own end of the rink all the way past the other
  team's goal
scope: In ice hockey, shooting the puck down the whole rink past the other goal; not the sweet topping
  on a cake.
examples:
- The referee called icing on the play.
- His long shot was icing, so play stopped.
