simpleMeaning: A drug that fights HIV, the virus that harms the body's defences, by blocking the enzyme
  that copies its code.
scope: 'Also called didanosine, dideoxyinosine and ddI: a drug that fights HIV by blocking the enzyme
  that copies its code, distinct from drugs that fight other viruses.'
examples:
- The doctor gave her DDI to fight the HIV infection.
- DDI blocks the enzyme the virus uses to copy itself.
