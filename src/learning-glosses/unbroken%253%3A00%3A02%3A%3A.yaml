senseId: 'unbroken%3:00:02::'
synsetId: 00291789-a
simpleMeaning: going on without a gap, in space or in time or in a line of things that follow one another
scope: A line or stretch of time that goes on without a gap, not a promise or contract that is kept and
  honored.
examples:
- The unbroken line of cars stretched down the road for miles.
- They walked in unbroken silence for a whole hour.
