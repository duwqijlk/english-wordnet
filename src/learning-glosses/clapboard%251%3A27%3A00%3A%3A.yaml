simpleMeaning: A long thin board with one edge thicker than the other, put on the outside wall of a building
  so each board partly covers the one below
scope: 'Also called weatherboard: a board for the outside wall of a building, not the act of covering
  a wall with such boards.'
examples:
- The old house is covered in white clapboard.
- They fixed one loose clapboard on the side of the barn.
