simpleMeaning: A large group of players of dance or jazz music, often with solos made up on the spot by
  the lead players.
scope: A large group of players of dance or jazz music, often with solos made up on the spot; not a small
  jazz group and not a rock group.
examples:
- The big band played dance music all night.
- A big band with fine lead players filled the hall.
