simpleMeaning: printed notes, put out by a government or central bank, that can be used in place of coins
scope: Printed notes, put out by a government or central bank, that can be used in place of coins; folding
  money and paper currency are other names for this sense, and it is not coins or a cheque.
examples:
- The shop takes paper money as well as coins.
- Paper money replaced coins for large sums.
