senseId: 'idiosyncrasy%1:07:00::'
synsetId: 04771497-n
simpleMeaning: a way of acting that belongs to one person only and makes that person different from others
scope: 'Also called mannerism and foible: one person''s own way of acting, not a way of acting that many
  people share.'
examples:
- One of his idiosyncrasies is that he always taps his cup twice before he drinks.
- Her idiosyncrasy of writing every list by hand makes her work easy to know.
