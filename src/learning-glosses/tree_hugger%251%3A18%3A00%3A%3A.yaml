simpleMeaning: A rude name for people who care for the environment and back limits on cutting down woodland
  and keeping woods safe
scope: A rude name for people who back limits on cutting woodland and keeping woods safe, not a forester
  who manages woods and not a person who plants woodland for timber.
examples:
- He was called a tree hugger for blocking the road works.
- The tree hugger chained herself to the gate to save the wood.
