simpleMeaning: words spoken or written that show you know about, accept, or have seen something or someone
scope: 'Also called acknowledgment: words that show you know or accept a thing, not the state of being
  known or accepted.'
examples:
- The book begins with an acknowledgement of the people who helped her.
- He gave no acknowledgement that he had seen her wave.
