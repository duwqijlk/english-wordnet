simpleMeaning: Showing a carefree way of breaking the usual rules, with a bad reputation.
scope: Showing a carefree way of breaking the usual rules, with a bad reputation, also called rakish;
  not marked by being up to date in dress and manners.
examples:
- The party felt raffish, full of carefree guests who paid no mind to the usual rules.
- Their style was raffish, with a worn jacket and a grin that hinted at a bad name.
