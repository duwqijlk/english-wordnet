simpleMeaning: A thin sheet of grey matter in the brain, lying next to a small part deep inside called
  the lenticular nucleus.
scope: A thin sheet of grey matter in the brain next to the lenticular nucleus, not the outer covering
  of the brain and not the lenticular nucleus itself.
examples:
- The scan showed the claustrum beside the lenticular nucleus.
- In the diagram the claustrum was the thin grey sheet.
