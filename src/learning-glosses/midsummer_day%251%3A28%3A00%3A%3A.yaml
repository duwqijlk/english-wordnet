simpleMeaning: In England, Wales, and Ireland, this is one of the four times in the year when rent is
  due.
scope: Another name for this is June 24, Midsummer's Day, or St John's Day; it is one of the four times
  in the year when rent is due in England, Wales, and Ireland, not a time for feasting.
examples:
- Midsummer Day comes in the summer.
- The rent was due on Midsummer Day.
