simpleMeaning: Bile holds an orange-yellow colouring stuff from blood's red colouring breaking down, and
  too much of it in the blood gives the skin a yellow look, as in jaundice.
scope: People also call this colouring stuff bilirubin and haematoidin, and too much of it in the blood
  gives the skin a yellow look.
examples:
- Hematoidin in his bile gave a yellow look to his skin.
- Her skin had a yellow look from too much hematoidin in her blood.
