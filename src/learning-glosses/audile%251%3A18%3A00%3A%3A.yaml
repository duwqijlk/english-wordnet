simpleMeaning: a person who pictures things in the mind by sounds, not by sights or movements
scope: A person who thinks in sounds, not one who thinks in pictures or in movements of the body.
examples:
- As an audile, she recalls a voice better than a face.
- The audile student learns best by listening.
