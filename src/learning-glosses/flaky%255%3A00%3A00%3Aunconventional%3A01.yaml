senseId: flaky%5:00:00:unconventional:01
synsetId: 00611168-s
simpleMeaning: very different from what is normal or usual, in a way that people notice at once
scope: 'Also called bizarre, eccentric, freakish, outlandish, and freaky: very different from what is
  normal or usual. It is not about skin or food that breaks off in thin pieces, and not about a person
  who does not do what they said they would do.'
examples:
- His flaky clothes and wild hair made everyone look at him.
- She has a flaky way of dressing that no one else in town would try.
