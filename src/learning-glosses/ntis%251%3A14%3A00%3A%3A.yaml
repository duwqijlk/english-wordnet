simpleMeaning: The main place for facts about science, machines, building things, and trade, paid for
  by the government, is this agency in the Technology Administration.
scope: Also called the National Technical Information Service; the main place for government-paid facts,
  not a place that does the science itself.
examples:
- Engineers looked up the report through NTIS.
- NTIS holds facts paid for by the government.
