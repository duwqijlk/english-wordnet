simpleMeaning: a bitter, very poisonous plant compound; in moderate doses it stimulates the heart, but
  in larger doses it is a deadly poison, and has been used in Africa on arrows
scope: This is the poisonous heart-stimulating substance obtained from certain plants, not the plants
  themselves or a general heart medicine.
examples:
- Strophanthin was once used as a heart stimulant, but the dose had to be watched very carefully.
- Hunters in parts of Africa treated their arrows with strophanthin.
