simpleMeaning: One of two bean-shaped parts that clean the blood, taking wastes — most of all urea, a
  waste the body makes — and water out in urine.
scope: One of two bean-shaped parts that clean the blood, not a bean and not a part of the liver.
examples:
- A kidney filters waste from the blood.
- He gave one kidney to his brother.
