simpleMeaning: A small, quail-like ground bird of southern Eurasia and northern Africa without a hind
  toe; though classed with wading birds, it lives on grassy plains.
scope: Another name for the small, quail-like ground bird also called bustard quail and button-quail;
  not a true quail, and not a bustard, which is a much larger bird.
examples:
- We flushed a button quail from the dry grassland.
- The button quail would rather run than fly.
