simpleMeaning: a student near the end of training in medicine, or a new doctor, who learns by doing real
  work, with a senior doctor watching over them
scope: A medical student near the end of training, or a new doctor, learning by supervised work, not the
  act of working as one.
examples:
- The intern examined the patient under the eye of the senior doctor.
- After graduation, she worked as an intern in the city hospital.
