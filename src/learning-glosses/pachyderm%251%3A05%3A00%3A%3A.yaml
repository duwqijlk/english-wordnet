simpleMeaning: 'Such as the elephant, the rhinoceros, and the hippopotamus: one of many kinds of hoofed
  mammal with very thick skin that does not chew the cud.'
scope: Elephants, rhinoceroses, and hippopotamuses are kinds of this thick-skinned hoofed mammal.
examples:
- A pachyderm stood beside the elephant at the zoo.
- They pointed out the pachyderm among the other hoofed mammals.
