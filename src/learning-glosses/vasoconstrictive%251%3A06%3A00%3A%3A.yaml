senseId: 'vasoconstrictive%1:06:00::'
synsetId: 04529716-n
simpleMeaning: something that keeps blood pressure up or raises it by making a blood vessel opening grow
  narrow; cold, stress, nicotine, or certain body chemicals and drugs can do this
scope: 'Also called pressor and vasoconstrictor: something that makes a blood vessel opening narrow and
  keeps blood pressure up, not a thing that opens blood vessels wide.'
examples:
- Cold is a vasoconstrictive agent that narrows the blood vessels in the skin.
- Stress works as a vasoconstrictive force, raising blood pressure.
