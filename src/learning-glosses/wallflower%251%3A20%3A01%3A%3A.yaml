simpleMeaning: a long-lived plant from southern Europe with sweet-smelling flower groups of all colors,
  especially yellow and orange, often grows wild on old walls or cliffs, sometimes in the group Erysimum
scope: This is the long-lived plant from southern Europe that is often found on walls or cliffs, not the
  wider set of Erysimum plants with yellow, orange or brown flowers.
examples:
- Wallflowers grew in bright clusters on the old garden wall.
- She planted a wallflower that flowered in yellow and orange.
