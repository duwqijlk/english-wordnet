simpleMeaning: a small soft bag that holds sweet-smelling powder, used to make things in a drawer or chest
  smell sweet
scope: This is a small bag with sweet-smelling powder for a drawer or chest, not a bag of food or medicine.
examples:
- She put a lavender sachet in her clothes drawer.
- He found an old sachet at the bottom of the chest.
