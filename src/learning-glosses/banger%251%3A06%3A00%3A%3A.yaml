simpleMeaning: A small firework with a little powder that can blow up and a fuse, inside a thick paper
  cover
scope: This is a small firework, also called a firecracker and also called a cracker; it is not the British
  word for a pork sausage.
examples:
- The banger went off with a loud bang in the street.
- He lit a banger and ran back before it blew up.
