simpleMeaning: A natural or cut-made joining of parts or arms of tube-like body parts so they form one
  unbroken line.
scope: A natural or cut-made joining of parts or arms of tube-like body parts so they form one unbroken
  line, also called anastomosis; not the joining of flat skin and not the tying off of a tube.
examples:
- Inosculation joined the two blood tubes into one line.
- The surgeon hoped for inosculation of the cut ends.
