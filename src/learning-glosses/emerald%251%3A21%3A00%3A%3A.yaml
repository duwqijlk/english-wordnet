simpleMeaning: A piece of green stone, cut and made smooth and shiny so you can see through it, and valued
  highly as a jewel
scope: This is the cut jewel itself, not the green stone material it comes from and not the green colour
  named after it.
examples:
- The ring had a large emerald in its centre.
- She wore a necklace with one bright emerald.
