senseId: adenoidal%5:00:00:high:03
synsetId: 01216222-s
simpleMeaning: A voice that sounds squeezed, as if spoken with the nose held shut.
scope: Sounding as if the voice came through a pinched nose — also called pinched, and another name for
  it is nasal — not the sense of having to do with the adenoids.
examples:
- Their voice was adenoidal after the cold.
- The speaker sounded adenoidal, as if their nose were pinched shut.
