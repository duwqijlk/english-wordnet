simpleMeaning: a person trained to test eyes for faults in sight so as to give glasses that put them right
scope: A person trained to test eyes for faults in sight so as to give glasses that put them right; oculist
  is another name for this sense, not a doctor who operates on eyes and not a person who sells glasses
  without testing.
examples:
- The optometrist tested her eyes and gave her glasses.
- An optometrist checks sight and prescribes lenses.
