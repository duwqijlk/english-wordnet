simpleMeaning: It means relating to one exact or special thing rather than things in general, and it is
  often used before 'to'.
scope: Not the noun for a medicine, and not the sense of instructions being clearly and exactly stated.
examples:
- The school can meet the specific needs of each child.
- She had a specific reason for choosing that name.
