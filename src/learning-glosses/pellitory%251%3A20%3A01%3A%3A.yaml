simpleMeaning: A small plant of the lands round the Mediterranean Sea, holding a strong-smelling oil once
  used to ease tooth pain.
scope: A small Mediterranean plant with a strong-smelling oil once used to ease tooth pain, not the herb
  that grows in cracks and has long narrow leaves and small pink flowers.
examples:
- The gardener grew pellitory in a warm, sunny bed and used its oil for tooth pain.
- In old times pellitory oil was put on an aching tooth.
