simpleMeaning: the strip of shore that the sea covers at high tide and leaves bare at low tide
scope: The strip of shore covered and uncovered by the tide, not the dry land above the tide and not the
  sea beyond the low mark.
examples:
- They walked across the foreshore at low tide.
- Shells lay on the foreshore where the tide had gone out.
