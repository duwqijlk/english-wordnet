simpleMeaning: a spot that is real only in people's minds, or one that books of made-up tales or holy
  books say is real
scope: 'Also called an imaginary place and a mythical place: a spot real only in people''s minds or said
  to be real in books, not a real town and not a spot on a map.'
examples:
- The map showed a fictitious place that no traveller had ever found.
- Atlantis is a fictitious place from old stories.
