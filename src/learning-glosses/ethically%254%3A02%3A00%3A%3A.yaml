simpleMeaning: in a way that is right and good, judged by ideas of what is right and wrong
scope: This is about acting or judging by what is right and good, not about what the law allows or what
  is quick or successful.
examples:
- He behaved ethically and told the truth even when it cost him money.
- It is not ethically right to cheat customers.
