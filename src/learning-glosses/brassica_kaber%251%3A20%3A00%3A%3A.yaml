simpleMeaning: A weedy plant of Europe and Asia that often grows where grain grows and gets in the way.
scope: Also called chadlock, charlock, field mustard, wild mustard or Sinapis arvensis; a weedy plant
  of Europe and Asia that troubles grain fields, not a crop grown on purpose.
examples:
- Brassica kaber spread through the wheat field.
- The farmer pulled up Brassica kaber before it choked the grain.
