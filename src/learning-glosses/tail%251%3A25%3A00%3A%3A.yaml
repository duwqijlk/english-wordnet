simpleMeaning: a piece that juts out from something and has the shape of an animal's rear body part
scope: Also called tail end, a part sticking out from something that looks like an animal's rear body
  part, not the animal's own body part or the rear of a ship or aircraft.
examples:
- A long tail of smoke drifted from the chimney.
- The comet's tail stretched across the night sky.
