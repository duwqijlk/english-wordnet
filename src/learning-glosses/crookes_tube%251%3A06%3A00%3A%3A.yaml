simpleMeaning: the first gas-filled glass vessel that sends a stream of rays from its charged end
scope: This is the earliest kind of tube that sends out rays by electric power, not the later picture
  tube of a television set and not a plain glass tube with no gas in it.
examples:
- The Crookes tube glowed when the current ran through it.
- Early tests used a Crookes tube to study rays from a charged end.
