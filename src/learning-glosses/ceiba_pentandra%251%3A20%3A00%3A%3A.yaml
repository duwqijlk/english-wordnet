simpleMeaning: A very large tropical tree with deep grooves in its thick trunk, holding big seed pods
  covered with soft, shiny fibre; the source of the soft kapok fibre.
scope: Also called kapok, ceiba tree, silk-cotton tree, white silk-cotton tree, Bombay ceiba, and God
  tree; a very large tropical tree with deep grooves in its thick trunk and big seed pods covered with
  soft, shiny fibre.
examples:
- Ceiba pentandra towers over the village.
- The Ceiba pentandra pods are full of soft fibre.
