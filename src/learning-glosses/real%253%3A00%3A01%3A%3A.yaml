simpleMeaning: Describing an amount adjusted to remove the effect of rising prices.
scope: This is the inflation-adjusted amount sense, not "actually existing," not "genuine or true," not
  "serious," and not the mathematical number, Brazilian currency, or old Spanish coin senses.
examples:
- Real wages have fallen once rising prices are taken into account.
- The report compares real income over the past decade, stripping out inflation.
