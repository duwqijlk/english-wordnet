simpleMeaning: cloth so fine and clear that you can see through it, like a spider's web
scope: Very thin, clear cloth like a spider's web, not a real web and not a thread from one.
examples:
- Her dress was made of cobweb, light as air.
- The cobweb veil floated over her face.
