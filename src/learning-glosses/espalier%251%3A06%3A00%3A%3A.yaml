simpleMeaning: A frame on which a fruit tree or pretty bush is trained to grow flat
scope: A frame on which a fruit tree or bush is made to grow flat; not a free-standing fence, and not
  a pot for a plant.
examples:
- The espalier held the pear tree flat against the wall.
- The gardener tied the young fruit tree to the espalier to keep it flat.
