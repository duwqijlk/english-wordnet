simpleMeaning: So it can turn one way only, this machine part has a toothed wheel or bar held by a small
  catch.
scope: This one-way machine part is also called ratchet and ratch.
examples:
- He turned the rachet one way, and it would not turn back.
- She set the rachet and the wheel stayed put.
