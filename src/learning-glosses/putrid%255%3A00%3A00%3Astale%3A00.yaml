simpleMeaning: far gone in rotting and having a very bad smell
scope: Describes a thing that is far gone in rotting and smells very bad; not the wider sense that is
  only about rotting or that goes on with rotting.
examples:
- The putrid meat in the bin had been left there for a week.
- He opened the box and found a putrid fish with a smell that filled the room.
