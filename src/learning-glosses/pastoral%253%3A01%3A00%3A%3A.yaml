simpleMeaning: about or linked to a church leader or to the work a church leader does
scope: This describes a church leader or the work a church leader does; it is not about people who keep
  sheep or cows, not about country life, and not the letter itself.
examples:
- Her pastoral work includes visiting the sick and leading prayers.
- He wrote a pastoral letter to the people of his church.
