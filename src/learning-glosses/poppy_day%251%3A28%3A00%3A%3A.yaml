simpleMeaning: The Sunday nearest the eleventh of November, when people remember those who died in the
  first World War and the second World War.
scope: Also called Remembrance Day and Remembrance Sunday; this is the Sunday for remembering those who
  died in the wars, not any other Sunday in November.
examples:
- Poppy Day falls on the Sunday nearest the eleventh day of November.
- On Poppy Day we remember those who died in the wars.
