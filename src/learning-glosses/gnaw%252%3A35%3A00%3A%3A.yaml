simpleMeaning: to use the teeth to bite or chew on something
scope: This is biting or chewing something with the teeth; it is not worry or pain that stays in the mind,
  and not eating something away slowly.
examples:
- The dog gnawed on a large bone for an hour.
- A mouse gnawed a small hole in the box.
