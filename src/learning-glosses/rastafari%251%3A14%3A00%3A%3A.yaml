simpleMeaning: In Jamaica, a movement and faith of Black youth from poor Kingston in the 1950s; men grow
  long dreadlocks and wear wool caps, use marijuana and listen to reggae.
scope: A Jamaican youth movement and faith, also called Rastas; not reggae music itself and not other
  Jamaican church groups.
examples:
- Rastafari began in Kingston in the 1950s.
- Many followers of Rastafari wear their hair in dreadlocks.
