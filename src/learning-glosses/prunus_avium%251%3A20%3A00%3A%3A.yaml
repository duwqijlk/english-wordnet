simpleMeaning: A big tree from Europe and Asia that bears small dark bitter fruit in the wild, but sweet
  fruit that people can eat when the tree is grown by farmers.
scope: Also called sweet cherry; a tree grown for its fruit, not a small bush grown for flowers and not
  a plum tree with egg-shaped fruit in bunches.
examples:
- The Prunus avium in the old garden bore dark fruit that tasted bitter.
- Farmers grow Prunus avium for the sweet fruit they can sell at market.
