senseId: 'absolutism%1:14:00::'
synsetId: 08457622-n
simpleMeaning: A form of rule where the ruler is an absolute dictator, held back by no constitution, laws,
  or opposition, or the like.
scope: A form of rule where the ruler is an absolute dictator, held back by no constitution, laws, or
  opposition, or the like; also called tyranny, authoritarianism, dictatorship, totalitarianism, despotism,
  monocracy, one-man rule, or shogunate; not the teaching of an absolute being, often tied to idealism
  in philosophy, nor a belief in the full and unbounded power of rule, nor sway through fear of punishment
  and force.
examples:
- Their absolutism ruled the land.
- The absolutism fell at last.
