simpleMeaning: a tree with a thin top that grows in the east of North America
scope: 'Also called bigtooth aspen, bigtoothed aspen, large tooth aspen and large-toothed aspen: a tree
  with a thin top in the east of North America, not a tree with a wide top and not a tree from the west.'
examples:
- A big-toothed aspen stood at the edge of the wood, its thin top reaching up.
- The big-toothed aspen in the yard had a thin top and grew tall.
