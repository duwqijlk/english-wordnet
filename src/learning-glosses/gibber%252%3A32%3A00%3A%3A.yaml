schema: oewn-learning-gloss-v2
senseId: 'gibber%2:32:00::'
synsetId: 01038676-v
simpleMeaning: to talk fast about small things that do not matter, and to keep talking without stopping
scope: 'Also called chatter, clack, prattle, gabble, blabber, blab, tattle, piffle, prate, twaddle, palaver
  and maunder: to talk fast about small things, not to make unclear sounds like a monkey.'
examples:
- She gibbered on about the weather for ten minutes without stopping.
- He was gibbering about small things that no one cared about.
