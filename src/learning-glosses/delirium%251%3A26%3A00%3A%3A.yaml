schema: oewn-learning-gloss-v2
senseId: 'delirium%1:26:00::'
synsetId: 14410607-n
simpleMeaning: a usually short time of great excitement and a mixed-up mind, often with seeing or hearing
  things that are not real
scope: This is a short, excited and confused state of mind, often with false sights or sounds; it is not
  a calm, clear state of mind.
examples:
- After the operation, he fell into a delirium and kept talking to people who were not there.
- Her high fever brought on a short delirium.
