scope: This is a herb of South America with sticky leaves, also called the madia oil plant, melosa or
  Madia sativa; it is not a tarweed of North America.
examples:
- Chile tarweed grows in South America, with sticky leaves.
- Chile tarweed is the plant from which madia oil comes.
