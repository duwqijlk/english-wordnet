simpleMeaning: To bring a thing along with it, so that the thing must follow; a use found in logic.
scope: Carrying a thing along with it, so the thing must follow; also called predicate.
examples:
- In logic, one claim may connote another that must follow from it.
- The term connotes a duty that follows from the promise.
