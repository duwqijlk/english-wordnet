simpleMeaning: A family of languages of a West African people, used as a common tongue in sub-Saharan
  regions from Senegal to Chad, and the best known of the West African languages.
scope: Also called Ful, Fulani, and Peul; a group of West African languages, not the people who speak
  them.
examples:
- Fula is spoken across West Africa.
- She learned Fula as a child.
