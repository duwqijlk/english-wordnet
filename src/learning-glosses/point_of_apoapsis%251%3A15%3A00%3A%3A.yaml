simpleMeaning: In astronomy, the spot in an orbit that lies farthest from the thing being circled
scope: Also called an apoapsis, this is the spot in an orbit that lies farthest from the thing being circled,
  not the nearest spot, which is the periapsis.
examples:
- At its point of apoapsis, the satellite is farthest from Earth.
- The spacecraft reached its point of apoapsis and began to fall back toward the planet.
