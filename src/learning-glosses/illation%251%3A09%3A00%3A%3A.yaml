simpleMeaning: From hints and from what was found before, a person works out a judgment without seeing
  the thing itself
scope: It is also called inference, a judgment worked out from hints rather than from direct sight.
examples:
- Her illation from the muddy shoes was that someone had been in the garden.
- The illation rested on earlier findings, not on direct sight.
