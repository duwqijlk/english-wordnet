simpleMeaning: A strange swelling on a plant, where insects, tiny living things, or an injury have made
  the plant grow wrong.
scope: A strange swelling on a plant, not the juice from the liver, not rudeness, and not a horse sore.
examples:
- The oak leaf had a gall on its stem.
- Galls formed on the rose where insects had bitten it.
