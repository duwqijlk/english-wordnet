simpleMeaning: Found all round the far north, this small plant of the water has bunched narrow pointed
  leaves in a tight ring at its base and tiny white flowers.
scope: This is a small water plant with narrow pointed leaves in a tight ring at its base, not a plant
  of dry land.
examples:
- Awlwort is a small plant of the water with narrow pointed leaves.
- Awlwort grows all round the far north.
