simpleMeaning: squeeze something into a narrow, tight opening, the way a wedge, a pointed block used to
  split or grip, is driven in
scope: This sense is about pressing an object into a confined gap, not about pushing a person toward an
  action or state, not about acting with physical power in general, and not about taking something away.
examples:
- She forced the key into the lock and turned it.
- He forced the cork back into the bottle with his thumb.
