simpleMeaning: Split in two, one part above the other, it is set in an outside wall and lets each part
  be shut or left open on its own
scope: An outside door split into an upper and a lower part that move on their own, not a single solid
  door and not an inside door.
examples:
- The farmer shut the top of the half door and left the bottom open.
- She leaned on the half door to talk to the visitor.
