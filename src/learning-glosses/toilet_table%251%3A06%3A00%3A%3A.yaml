simpleMeaning: A low stand with one or more mirrors, where a person sits to dress or to put on make-up
scope: A low stand with mirrors where a person sits to dress or put on make-up; dresser, vanity and dressing
  table are other names for this sense, and not a desk for writing or a bedside stand.
examples:
- She sat at the toilet table to put on her make-up.
- The toilet table had two mirrors.
