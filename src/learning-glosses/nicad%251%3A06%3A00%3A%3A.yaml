simpleMeaning: Nickel on one side and cadmium on the other let this battery charge again, and it runs
  down slowly when idle, so it is often kept as spare power.
scope: Nickel-cadmium accumulator is another name for this battery, which can be charged again and runs
  down slowly when idle, not a battery thrown away after one use.
examples:
- They charged the nicad again after use.
- A nicad powers the alarm when the mains fail.
