simpleMeaning: The foot takes the shape of a claw when its arch rises too high and its toes bend back
  too far.
scope: A foot with this deformity is also called clawfoot, since its high arch and bent-back toes give
  it the look of a claw.
examples:
- With pes cavus, the foot has an arch too high and toes that bend back too far.
- The foot looked like a claw because of pes cavus.
