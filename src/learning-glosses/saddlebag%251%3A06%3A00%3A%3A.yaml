simpleMeaning: A big bag, or two bags joined together, that hangs over a horse's saddle
scope: A big bag that hangs over a horse's saddle, not a bag carried in the hand.
examples:
- He packed his lunch in the saddlebag before the ride.
- The saddlebags hung on either side of the horse's saddle.
