simpleMeaning: A joint effort by workers, particularly through unions, to improve their standing, or the
  leaders of that movement.
scope: Workers acting together to improve their conditions, or the movement's leaders, not work itself,
  the working class, or childbirth.
examples:
- The labor movement won shorter hours and safer factories.
- The party promised to support labor in its fight for better pay.
