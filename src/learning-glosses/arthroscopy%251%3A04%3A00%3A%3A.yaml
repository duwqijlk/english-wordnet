simpleMeaning: an operation to fix a hurt joint through a small cut, with the surgeon looking inside the
  joint with a thin viewing tube while doing the fix
scope: An operation that fixes a hurt joint through a small cut, not open surgery on a joint and not just
  looking inside one.
examples:
- The surgeon did an arthroscopy on her knee.
- After the arthroscopy, his shoulder felt much better.
