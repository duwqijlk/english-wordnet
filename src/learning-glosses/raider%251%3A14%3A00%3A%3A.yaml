simpleMeaning: a business investor who plans to take over a firm by buying enough of its shares to control
  it and putting in new bosses
scope: A business investor who plans to take over a firm, not a soldier or thief who raids a place.
examples:
- The raider bought up shares until he could name the new board.
- Fearing a raider, the firm asked its shareholders to hold on to their stock.
