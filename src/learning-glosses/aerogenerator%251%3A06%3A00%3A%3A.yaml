simpleMeaning: a machine that takes power from the wind and turns it into power people can use
scope: Also called a windmill, this is a machine that makes power from the wind, not a fan that moves
  air and not a mill that grinds grain.
examples:
- The farm put up an aerogenerator to make power from the strong sea wind.
- An aerogenerator on the hill turns wind into power for the village.
