simpleMeaning: A mind illness with times of high wild moods and times of deep low moods
scope: Also called bipolar disorder, manic-depressive psychosis and manic depressive illness; a mind illness
  with high and low moods, not a short bad mood and not a mind illness of one mood only.
examples:
- Manic depression brings high wild moods and deep low ones.
- Her manic depression was treated with care.
