simpleMeaning: In pharmacology, a book that lists drug products with their recipes and how to make them
scope: In pharmacology, a book that lists drug products with their recipes and how to make them; formulary
  is another name for this sense, not a book of cures for home use and not a list of drugs in a shop.
examples:
- The new drug was listed in the pharmacopeia with its recipe and how to make it.
- A pharmacopeia gives the formulas for the drugs a chemist may make.
