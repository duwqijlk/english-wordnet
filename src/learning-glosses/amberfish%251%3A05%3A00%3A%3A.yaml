simpleMeaning: A tail split in two marks this warm-sea fish of one family, its sides gold-brown to the
  colour of copper.
scope: The name amberjack means the same fish.
examples:
- The catch held an amberfish, its tail split in two and its sides gold-brown.
- In warm seas, amberfish swim with tails split in two.
