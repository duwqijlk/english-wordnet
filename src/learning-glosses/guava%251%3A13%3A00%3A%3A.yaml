simpleMeaning: A fruit from warm places. It has yellow skin and pink soft part inside. People eat it fresh
  or use it to make sweet foods like jelly.
scope: This is the fruit itself, not the small tree that grows it.
examples:
- She cut open a guava and ate the pink part inside.
- We made jelly from fresh guavas.
