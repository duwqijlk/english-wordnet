simpleMeaning: a hand weapon with a long metal blade for cutting or stabbing, a grip, and a guard for
  the hand
scope: A bladed hand weapon, also called 'steel' or 'brand'; not a short knife, nor a decorative symbol
  of authority.
examples:
- He drew his sword and stepped forward.
- The old sword hung above the fireplace, its blade still bright.
