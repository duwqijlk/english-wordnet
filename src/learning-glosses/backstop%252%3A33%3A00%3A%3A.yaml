simpleMeaning: In baseball, to be the fence or screen behind home plate that stops the ball from leaving
  the playing field
scope: In baseball, this verb is about doing the stopping work of that fence or screen behind home plate;
  it is not the noun that names the fence or screen itself.
examples:
- During practice, a tall fence backstops the field and keeps stray balls inside.
- They hung a strong net to backstop home plate during batting practice.
