simpleMeaning: A great Jewish holy time that starts on the evening before the 15th day of Tishri and recalls
  the shelters of the Israelites in their forty years in the wilderness.
scope: 'Also called Feast of Booths, Feast of Tabernacles, Succos, Succoth and Sukkoth: a great Jewish
  holy time starting on the evening before the 15th of Tishri, recalling the shelters of the Israelites
  in the wilderness, not the spring holy time of Passover and not the autumn Day of Atonement.'
examples:
- Tabernacles begins on the eve of the 15th of Tishri.
- During Tabernacles we remembered the shelters of the Israelites.
