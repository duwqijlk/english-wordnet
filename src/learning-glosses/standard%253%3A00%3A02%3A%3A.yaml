simpleMeaning: It means following the usual, accepted way, or setting or matching an official measure
  of size or value.
scope: Not meaning respected as an excellent model, and not the noun for a rule or a flag.
examples:
- This is the standard size for a hotel bed.
- The recipe uses standard ingredients you can find anywhere.
