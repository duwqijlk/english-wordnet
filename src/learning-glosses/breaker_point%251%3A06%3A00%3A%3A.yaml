simpleMeaning: A turning arm meets this small metal spot inside the part that sends current to the spark
  plugs, and current then flows to the plugs
scope: Point and distributor point are other names for this small metal spot inside the distributor, not
  for the distributor as a whole.
examples:
- He replaced the breaker point in his car.
- A faulty breaker point can stop the spark plugs from firing.
