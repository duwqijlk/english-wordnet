simpleMeaning: Sea animals with a body that gets narrower, a hard head and sharp spines that carry poison
scope: Sea animals with a body that gets narrower, a hard head and sharp spines that carry poison, also
  called scorpion fish or sea scorpion; not a lionfish and not a harmless reef dweller.
examples:
- The scorpionfish hid among the rocks with its venomous spines.
- A scorpionfish can sting with the spines on its back.
