simpleMeaning: In North America and north-east Asia, people grow a kind of barley for its showy flower
  heads with long, soft, silky spikes
scope: Also called squirreltail barley and squirreltail grass, this barley is grown for its showy flower
  heads, not barley grown for grain.
examples:
- The foxtail barley waved its long silky heads over the field.
- Gardeners plant foxtail barley for its showy flower heads.
