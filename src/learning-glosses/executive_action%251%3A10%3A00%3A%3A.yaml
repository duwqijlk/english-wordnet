simpleMeaning: The heads of all government departments and agencies usually get an order from the President
  of the United States
scope: 'Also called a presidential directive: an order from the President to the heads of government departments,
  not a law made by Congress and not an order from a state governor.'
examples:
- The President signed an executive action to change how the agencies share data.
- Under the new executive action, every department head had to send a report each month.
