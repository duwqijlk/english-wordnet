simpleMeaning: A birth-control device made of a bent piece of plastic or metal, put through the vagina
  into the womb.
scope: A birth-control device of bent plastic or metal put through the vagina into the womb, also called
  intrauterine device; not a pill or a device worn outside the body.
examples:
- She had an IUD fitted by her doctor.
- The IUD stays in the womb for several years.
