simpleMeaning: a short account at the end that goes over the main points of a longer talk or text
scope: This is a short account at the end that goes over the main points; review is another name for this
  sense; not a new tire, and not the talk or text itself.
examples:
- The teacher gave a quick recap of the lesson before the test.
- At the end of the meeting, she offered a recap of what had been agreed.
