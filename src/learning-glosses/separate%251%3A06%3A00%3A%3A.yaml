simpleMeaning: a piece of clothing that is sold on its own and can be worn together with other pieces.
scope: This is not a reprinted article, and not an adjective about division; it is a single item of clothing
  sold alone.
examples:
- The store sells skirts, tops, and other separates.
- She packed a few separates that could be mixed and matched.
