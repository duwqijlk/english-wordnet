simpleMeaning: A playing card from one of the two top suits, marked with one or more red symbols that
  have two rounded tops meeting in a point.
scope: This is not the suit as a whole, the red shape printed on the card or a cut of meat; it is a single
  card belonging to that suit.
examples:
- She laid down the queen of hearts and smiled at her partner.
- He needed one more heart to complete his flush.
