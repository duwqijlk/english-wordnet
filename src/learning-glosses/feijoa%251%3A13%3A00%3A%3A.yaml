simpleMeaning: Used above all for jellies and preserves, this dark green tropical fruit is about the size
  of a kiwi and has white flesh.
scope: Pineapple guava is another name for this fruit, not for the shrub that bears it.
examples:
- She cut open a feijoa and ate the white flesh.
- They made feijoa jelly from the dark green fruit.
