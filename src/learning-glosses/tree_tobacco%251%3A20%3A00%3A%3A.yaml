simpleMeaning: Farm animals are at times poisoned by this bush from South America, a plant that stays
  green all year and now grows wild in the United States.
scope: One of the South American shrubs that now grow wild in the United States, also called mustard tree,
  it at times poisons farm animals.
examples:
- The tree tobacco can poison farm animals that eat it.
- In the United States, tree tobacco grows wild far from its South American home.
