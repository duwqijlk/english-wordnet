simpleMeaning: A spruce of middling size from the north-east of North America, with short blue-green leaves
  and thin cones.
scope: Also called white spruce; a spruce of north-east North America, set apart from other spruces by
  its short blue-green leaves and thin cones.
examples:
- Picea glauca grows across the cold north woods.
