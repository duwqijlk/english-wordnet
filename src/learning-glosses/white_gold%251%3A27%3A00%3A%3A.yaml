simpleMeaning: a pale metal made by mixing the yellow precious metal, most often with platinum, nickel
  or palladium
scope: A pale metal made from the yellow precious metal mixed with platinum, nickel or palladium, not
  the plain yellow metal and not silver.
examples:
- Her ring was made of white gold.
- The jeweller showed her a band of white gold.
