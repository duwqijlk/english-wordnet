simpleMeaning: A small bird of eastern North America that catches flies in the air; the male has bright
  orange on its sides, wings and tail.
scope: This is a small bird that catches flies in the air, also called redstart and Setophaga ruticilla;
  not a bird that eats seeds on the ground and not a large bird of prey.
examples:
- An American redstart darted out to catch a fly.
- The male American redstart flashed bright orange on its wings.
