simpleMeaning: A helper substance in every living cell, needed for the body to process carbohydrates,
  fats and some amino acids.
scope: This is a helper substance found in every living cell, needed for the body to get power from carbohydrates,
  fats and some amino acids; near kinds are other helper substances that work in other steps of the body's
  use of food.
examples:
- Coenzyme A helps the body use the food we eat.
- Without coenzyme A, cells could not turn food into energy.
