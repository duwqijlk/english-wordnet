senseId: 'ijtihad%1:10:00::'
synsetId: 07186768-n
simpleMeaning: In Islamic law, a Muslim scholar's own reasoning to derive divine law from the Koran and
  Hadith, not others' views; from the 10th century debate closed and the law froze.
scope: This is a scholar's own reasoning to reach a legal ruling, not the accepted body of Islamic law,
  and not the simple following of earlier scholars' opinions.
examples:
- A jurist may resort to ijtihad when no existing ruling covers a new problem.
- Some scholars hold that ijtihad ended in the 10th century.
