simpleMeaning: In bridge, a card high enough in one suit to be sure of winning a trick with it
scope: In bridge, a card high enough in one suit to be sure of winning a trick with it; not a plug that
  fills a hole, and not a remark that stops talk.
examples:
- She held a stopper in hearts, so she knew she could win that trick.
- Without a stopper in clubs, he dared not bid the grand slam.
