simpleMeaning: the rear body part of an animal with a backbone, often long and reaching beyond the main
  trunk
scope: The animal's own rear body part, not a tail-like projection on an object or the rear section of
  a ship or aircraft.
examples:
- The dog wagged its tail whenever I came home.
- A lizard can shed its tail to escape a predator.
