simpleMeaning: Worldwide, this medium-to-large butterfly usually has vivid wings; its tiny front legs
  no longer work and are held folded against its chest.
scope: Another name for the same medium-to-large insect group also called nymphalid, nymphalid butterfly
  or four-footed butterfly, not a moth or a skipper.
examples:
- A brush-footed butterfly rests with its reduced front legs folded against its chest.
- The painted lady is a familiar brush-footed butterfly.
