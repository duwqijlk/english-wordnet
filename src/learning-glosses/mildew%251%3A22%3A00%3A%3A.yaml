simpleMeaning: the change by which a thing gets a thin coat of mould on its surface
scope: This is the change by which a thing gets a thin coat of mould, not the mould as a thing in itself.
examples:
- Mildew was slowly forming on the pages of the old book.
- After weeks in the damp shed, mildew had started to grow on the tent.
