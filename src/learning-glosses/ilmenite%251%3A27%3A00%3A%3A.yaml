  underground, a crystal of iron, titanium and oxygen, and a source of titanium
scope: A black mineral and a source of titanium, not coal and not iron ore.
examples:
- Miners dug ilmenite from the dark rock to get titanium.
- Ilmenite is only a little magnetic, so it does not stick hard to a magnet.
