simpleMeaning: A gland without a tube that puts its body chemicals straight into the blood.
scope: 'Also called a ductless gland and an endocrine gland: a gland that puts its chemicals straight
  into the blood, not a gland with a tube and not the whole system of such glands.'
examples:
- The endocrine puts its chemicals straight into the blood.
- Her endocrine was not making enough of the chemical.
