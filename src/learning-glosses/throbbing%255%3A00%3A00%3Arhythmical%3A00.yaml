simpleMeaning: beating or pounding hard, with strong force
scope: This describes pain, sound, or a part of the body that beats hard again and again; it is not the
  noun for one fast, strong beat of the heart.
examples:
- He lay still with a throbbing headache.
- The throbbing drums shook the whole hall.
