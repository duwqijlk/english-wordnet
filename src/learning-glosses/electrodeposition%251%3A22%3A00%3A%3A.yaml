simpleMeaning: The laying down of something on a charged piece by power, above all by passing a current
  through a liquid.
scope: The laying down of a substance on a charged piece by power, above all by passing a current through
  a liquid, not a paint coat and not a wash.
examples:
- Electrodeposition coated the metal with silver.
- The factory used electrodeposition to plate the parts.
