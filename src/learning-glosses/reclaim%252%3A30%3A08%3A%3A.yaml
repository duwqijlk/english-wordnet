simpleMeaning: To bring a person off a bad course of life and onto a right one
scope: To turn a person from a bad life to a right one, also called reform, not to tame a wild creature
  and not to make land useful.
examples:
- The church worked to reclaim men from a life of crime.
- Good friends helped reclaim him from his old ways.
