simpleMeaning: an itchy rash of raised patches pale in the middle and red around clear edges, usually
  caused by the body reacting badly to insect bites, food, or drugs
scope: This skin problem is also called nettle rash, urticaria, and urtication; it is a rash on the skin,
  not a home for bees and not a single spot or cut.
examples:
- After eating shrimp, she broke out in hives all over her arms.
- His hives itched so badly that he could not sleep.
