simpleMeaning: A B vitamin that stops sores on the skin and stops loss of weight
scope: Also called riboflavin, hepatoflavin and lactoflavin, this B vitamin stops sores on the skin and
  weight loss, not a drug that cures a sickness once it has come.
examples:
- Milk is rich in ovoflavin, which helps keep skin healthy.
- A lack of ovoflavin can cause sores on the skin.
