simpleMeaning: A top that can be moved or taken off, used to shut the opening at the top of a box, chest,
  jar, pan, or other things like them
scope: A movable cover that shuts the top opening of a box or jar, not the hat sense that guards the head.
examples:
- She lifted the lid off the jar.
- Put the lid back on the pan.
