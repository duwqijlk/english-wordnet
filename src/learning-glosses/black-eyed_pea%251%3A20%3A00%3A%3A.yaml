simpleMeaning: a low spreading one-year plant from the Old World, grown in the southern United States
  most of all for food, animal feed, and to feed the soil
scope: 'Also called cowpea and cowpea plant: the plant grown for food and feed, not the bean eaten fresh
  or dried and not other food plants.'
examples:
- Black-eyed peas grow well in the hot fields of the South.
- Farmers plant black-eyed peas to feed the soil.
