simpleMeaning: a sleeveless garment that floats or fills with air to keep a person from sinking in water
scope: A sleeveless floating garment; also called a life vest or a cork jacket, not a floating belt and
  not a ring thrown to a swimmer.
examples:
- She put on her life jacket before stepping into the boat.
- The life jacket kept him afloat until the rescue boat arrived.
