simpleMeaning: This thing turns light and other rays into another kind of power, so they can be found
  and measured
scope: 'Another name for a photoconductive cell or a photoelectric cell, also called an electric eye or
  a magic eye: a thing that turns light and other rays into power so they can be found and measured, not
  a battery and not a lamp.'
examples:
- The photocell in the lamp turns it on when the room gets dark.
- A photocell measures how much light falls on it.
