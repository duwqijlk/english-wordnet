simpleMeaning: existing or happening at the outer level rather than deeper down.
scope: This is not the noun for an outer boundary, nor the verb for rising; as an adjective it describes
  something located at or concerned with the outer level.
examples:
- The surface scratches were easy to polish out.
- Surface differences between the two cultures hid deeper similarities.
