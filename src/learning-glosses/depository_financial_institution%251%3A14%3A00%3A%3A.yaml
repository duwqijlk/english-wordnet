senseId: 'depository_financial_institution%1:14:00::'
synsetId: 08437235-n
simpleMeaning: A business that takes in money people leave with it for safe keeping and lends that money
  to others who need it
scope: This is a business that takes in money and lends it out; bank, banking company and banking concern
  are other names for it, not a business that only lends money and takes in none.
examples:
- She opened an account at the depository financial institution near her home.
- The depository financial institution lent the family money to buy a house.
