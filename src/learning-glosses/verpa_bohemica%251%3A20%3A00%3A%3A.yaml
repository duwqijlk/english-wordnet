simpleMeaning: A spring mushroom shaped like a thimble on a finger; its top is folded into wrinkles running
  down from the top, and it fruits in spring before trees leaf out.
scope: A spring mushroom like a thimble on a finger, one of the early spring mushrooms with wrinkled tops;
  also called early morel.
examples:
- Verpa bohemica appeared in the woods before the leaves came out.
- We found Verpa bohemica under the bare trees in April.
