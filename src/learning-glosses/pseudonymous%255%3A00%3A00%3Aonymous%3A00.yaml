simpleMeaning: Known by a made-up name, most often a name made up for writing
scope: Known by a made-up name, most often one made up for writing; not the writer's real name and not
  a nickname used among friends.
examples:
- The writings of Mark Twain are pseudonymous, as Samuel Clemens wrote under that name.
- He writes pseudonymous articles for the paper, signing them with a made-up name.
