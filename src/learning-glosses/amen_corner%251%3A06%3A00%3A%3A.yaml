simpleMeaning: the part of a church set aside for the people who lead the short replies the group says
  together in worship
scope: This is the part of a church set aside for the people who lead the group's short replies in worship,
  and not the pulpit or the seats for the singers.
examples:
- The deacon sat in the amen corner and led the responses.
- An amen corner was set aside near the front of the church.
