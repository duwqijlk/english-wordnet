simpleMeaning: going in a direction towards the top of a map
scope: 'Also called north, northward and northwards: going towards the top of a map; not a wind from that
  side, not turned towards that side, and not coming from that side.'
examples:
- They walked northerly along the coast for two miles.
- The road runs northerly from the village to the sea.
