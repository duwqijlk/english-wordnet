simpleMeaning: A climbing plant with long stems that keeps its leaves all year, widely grown for leaves
  of more than one colour.
scope: A climbing plant that keeps its leaves all year, widely grown for leaves of more than one colour;
  golden pothos and pothos are other names for this sense, not true ivy and not a plant grown for its
  flowers.
examples:
- The ivy arum climbed the trellis in the greenhouse.
- She grows ivy arum for its leaves of green and cream.
