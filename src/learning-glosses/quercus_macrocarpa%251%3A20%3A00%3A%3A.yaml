simpleMeaning: A medium to large oak of central and eastern North America that sheds its leaves each year,
  with egg-shaped acorns sunk deep in large fringed cups, yielding tough close-grained wood.
scope: Also called bur oak, burr oak, mossy-cup oak, and mossycup oak; not a pine and not an oak of western
  North America.
examples:
- The Quercus macrocarpa dropped acorns in large fringed cups.
- We used Quercus macrocarpa wood for its tough close grain.
