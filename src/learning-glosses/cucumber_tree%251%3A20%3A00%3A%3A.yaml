simpleMeaning: An American magnolia that loses its leaves in winter, with big leaves and fruit shaped
  like a small long green vegetable.
scope: An American magnolia with cucumber-like fruit, not a cucumber plant and not an evergreen tree.
examples:
- The cucumber tree in the garden drops its leaves each autumn.
- A cucumber tree grew beside the old house.
