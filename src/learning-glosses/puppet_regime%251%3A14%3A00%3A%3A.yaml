schema: oewn-learning-gloss-v2
senseId: 'puppet_regime%1:14:00::'
synsetId: 08195239-n
simpleMeaning: A government put in place by a power outside the country, which runs its affairs and may
  make life hard for the people who live there
scope: A government run by an outside power, not a government that rules itself; puppet government and
  puppet state are other names for this sense.
examples:
- The puppet regime was set up by the neighbouring power.
- People under the puppet regime faced harsh new taxes.
