simpleMeaning: a closed flat shape with a curved edge, made where a flat surface cuts all the way through
  a round cone
scope: 'Also called oval: this is a closed flat curved shape, not a circle and not a ball.'
examples:
- The teacher drew an ellipse on the board and asked us to find its centre.
- The path of the planet is an ellipse, not a circle.
