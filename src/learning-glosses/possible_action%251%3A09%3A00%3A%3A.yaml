simpleMeaning: Another thing that could happen or that a person could choose instead
scope: Another thing that could happen or that a person could choose instead, also called a possibility;
  not a thing that must happen and not a thing already done.
examples:
- Leaving early was one possible action, but she chose to stay.
- A possible action is to sell the house and move to a smaller one.
