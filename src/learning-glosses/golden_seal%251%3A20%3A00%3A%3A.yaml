simpleMeaning: With a thick knotted yellow underground stem and large round leaves, this plant of the
  northeastern United States lives for years.
scope: Also called goldenseal, turmeric root or yellow root, this is the long-lived plant of the northeastern
  United States whose thick knotted yellow underground stem and large round leaves mark it out.
examples:
- Golden seal grew in the north-east of the United States.
- The golden seal had large round leaves.
