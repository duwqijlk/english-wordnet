simpleMeaning: Greyish leafy parts, scaly underneath, mark a fern that grows on rocks or tree trunks in
  the Americas and South Africa
scope: Also called gray polypody and grey polypody, it is a fern of rocks and tree trunks, not a moss
  and not a fern that grows in soil.
examples:
- Resurrection ferns grow on the trunks of trees.
- The greyish fronds of the resurrection fern felt scaly underneath.
