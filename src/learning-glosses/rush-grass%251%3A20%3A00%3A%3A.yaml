simpleMeaning: a plant with thin, tough stems and flower heads held in a tight cover
scope: 'Also called rush grass: a plant with thin, tough stems and flower heads held in a tight cover,
  not a soft lawn plant and not a tall reed.'
examples:
- Rush-grass grew in thick clumps along the wet path.
- The rush-grass bent in the wind, its thin stems swaying.
