simpleMeaning: a plant that lives half in water, half on land, in soft wet ground; most have one seed
  leaf, like sedges, sphagnum, grasses, and cattails, and possibly heath
scope: 'Also called bog plant and swamp plant: a plant of soft wet ground, not a plant of dry land and
  not a water plant that lives under water.'
examples:
- The marsh plant grows in the soft wet ground at the edge of the pond.
- Most marsh plants have one seed leaf, like the grasses by the water.
