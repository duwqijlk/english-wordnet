simpleMeaning: A lung infection from inhaling dust that carries the bacterium causing a serious illness
  in animals; chills, cough and breathlessness come first, then a collapse of the circulation.
scope: This is one of several names for the lung form of anthrax caught from dust, not the skin form that
  starts with a sore.
examples:
- Woolsorter's disease began with a cough after workers breathed dust from fleeces.
- The mill closed after two cases of woolsorter's disease.
