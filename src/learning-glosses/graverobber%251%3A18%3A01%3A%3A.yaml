simpleMeaning: a person who steals valuable things from graves or crypts (underground rooms where dead
  people are buried)
scope: This sense is about stealing valuable things from graves, not about taking dead bodies from graves
  to sell them.
examples:
- The graverobber took gold rings from an old grave at night.
- Police caught a graverobber who had stolen jewels from a family crypt.
