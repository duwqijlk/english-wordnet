simpleMeaning: A way of finding out about a person's mind, using black-and-white pictures; each person
  tells a story about each picture.
scope: 'Also called TAT: a way of learning about a person''s mind from the stories they tell about pictures,
  not a check of memory or knowledge.'
examples:
- The doctor used the Thematic Apperception Test to learn more about the patient.
- In the Thematic Apperception Test, she told a story about a man in a boat.
