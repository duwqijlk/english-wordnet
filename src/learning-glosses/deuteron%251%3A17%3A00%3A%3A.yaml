simpleMeaning: Shot at other atoms in machines that speed up bits of matter, this core of a heavy form
  of hydrogen is made of one proton and one neutron
scope: A deuteron is the core of a heavy hydrogen atom, not the whole atom and not a free proton.
examples:
- The deuteron struck the target in the accelerator.
- A deuteron has one proton and one neutron.
