schema: oewn-learning-gloss-v2
senseId: 'inwardness%1:07:00::'
synsetId: 05086101-n
simpleMeaning: The state of being inward, or inside.
scope: The state of being inward, or inside; not a brooding on what lies in man's inner nature, above
  all his rights and wrongs, or his beliefs, nor a brooding above all on one's own views and rights and
  wrongs, or beliefs, nor the best, or most needful, or most lively part of an idea or a thing felt.
examples:
- Their inwardness shaped the work.
- The inwardness of the organs was plain.
