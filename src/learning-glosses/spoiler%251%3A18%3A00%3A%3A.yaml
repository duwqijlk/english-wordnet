simpleMeaning: a person who takes goods and riches by force, as in war
scope: Also called plunderer. This is a person who takes things by force in war, not a part on a plane
  wing or on the back of a car, and not someone who lets a child have all they want.
examples:
- After the battle, each spoiler took gold and food from the beaten town.
- The spoilers burned the village and carried away its goods.
