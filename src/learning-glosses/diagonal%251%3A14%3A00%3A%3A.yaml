simpleMeaning: a slanting line of squares of one colour on a board for chess or checkers
scope: A slanting line of same-colour squares on a game board, not a straight line across a flat shape
  and not a cut across cloth.
examples:
- The bishop moves on the diagonals.
- She moved her piece along a diagonal of black squares.
