simpleMeaning: This drug, sold under the trade name Nalfon, calms swelling and pain, and is given for
  arthritis and for other sore, swollen troubles.
scope: Also called fenoprofen calcium, this names the drug sold under the trade name Nalfon, the one that
  calms swelling and pain and is given for arthritis and other sore, swollen troubles.
examples:
- Fenoprofen eased the swelling in her knee.
- The doctor gave him fenoprofen for his arthritis.
