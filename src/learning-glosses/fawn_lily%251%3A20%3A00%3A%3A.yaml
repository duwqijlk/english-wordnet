simpleMeaning: A kind of dogtooth violet from California, with soft white blooms that are at times tinged
  with yellow
scope: A California plant with soft white blooms tinged at times with yellow, not other kinds of dogtooth
  violet and not a garden lily grown for show.
examples:
- The fawn lily blooms in the spring meadow.
- We found a fawn lily with pale yellow-tinged petals.
