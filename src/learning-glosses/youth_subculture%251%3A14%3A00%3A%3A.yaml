simpleMeaning: often known by the one kind of music they take up, this small group of young people is
  set apart mostly by their social class and ethnic background
scope: This small group of young people stands apart from the wider youth culture, mostly by the social
  class and ethnic background of its members, and often by the one kind of music they take up.
examples:
- The youth subculture was known by the music its members took up.
- Members of the youth subculture shared a social class and ethnic background.
