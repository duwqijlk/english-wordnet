simpleMeaning: A fern of northern North America that grows on stone in great clumps, with leaves like
  parsley.
scope: This is a fern that grows on stone in great clumps, also called American parsley fern and Cryptogramma
  acrostichoides; not a fern of wet woods and not a tree.
examples:
- The American rock brake grew in a great clump on the stone.
- We saw an American rock brake with leaves like parsley.
