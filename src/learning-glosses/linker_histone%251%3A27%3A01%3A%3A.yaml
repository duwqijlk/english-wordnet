simpleMeaning: plain proteins that fasten to the small bundles of DNA and protein in a cell, known as
  H1 and H5
scope: Plain proteins that fasten to the small bundles of DNA and protein in a cell; not the proteins
  at the centre of those bundles and not the DNA itself.
examples:
- The linker histone fastens to the bundles in the cell.
- Linker histones known as H1 hold the bundles in place.
