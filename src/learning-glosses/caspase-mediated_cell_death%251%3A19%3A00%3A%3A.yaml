scope: Cell death in which the cell uses its own set machinery to kill itself, also called apoptosis and
  programmed cell death.
examples:
- Caspase-mediated cell death clears cells that threaten the animal.
- Caspase-mediated cell death lets animals keep cell numbers in check.
