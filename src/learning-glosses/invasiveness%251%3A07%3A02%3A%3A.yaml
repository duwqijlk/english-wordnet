simpleMeaning: How much a thing tends to spread out, above all by moving into healthy parts of the body
scope: How much a thing tends to spread, above all into healthy parts of the body; not how far a medical
  act goes into the body.
examples:
- The invasiveness of the bacteria worried the doctors.
- They studied the invasiveness of the tumour to see how fast it spread.
