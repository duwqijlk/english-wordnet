simpleMeaning: To draw the lines of a ship's body full size, as a working plan
scope: To draw a ship's hull full size, not either of the two open floors and not the golf slant.
examples:
- The shipwright lofted the hull lines on the mould loft floor.
- He lofted the curve of the bow before cutting the wood.
