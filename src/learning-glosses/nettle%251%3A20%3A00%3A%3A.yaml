simpleMeaning: one of many plants that sting the skin when you touch their hairs; above all, the kinds
  in the groups called Urtica and Urticaceae
scope: A plant with stinging hairs, not the verb sense of annoying someone, and not the verb sense of
  stinging someone as a nettle does.
examples:
- She brushed against a nettle and her arm broke out in a rash.
- The garden was full of nettles with stinging hairs.
