simpleMeaning: having no liquid or dampness on or in it, without the water it normally holds, or no longer
  wet.
scope: This is not the technical sense of lacking volatile components, not a mocking kind of humor, and
  not a person who opposes alcohol; it describes something with no liquid or dampness in or on it.
examples:
- The clothes are dry now, so you can put them away.
- The river bed was dry after months without rain.
