simpleMeaning: The steady top speed reached by a body falling through the air under the pull of gravity
scope: The steady top speed reached by a body falling through the air under the pull of gravity; not the
  speed at the start of the fall and not the speed of a body going up.
examples:
- A skydiver reaches terminal velocity after a few seconds of falling.
- Terminal velocity for a falling stone is much lower than for a person.
