simpleMeaning: In printing, a unit for measuring length, equal to one sixth of an inch
scope: This is a unit of length used in printing, equal to one sixth of an inch, not the letter M and
  not a general unit like an inch or a foot.
examples:
- The line was set with a space of one em between the words.
- Indent the first line of each part by two ems.
