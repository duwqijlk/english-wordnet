simpleMeaning: to hold something back or keep it within limits, so it becomes less strong
scope: 'Also called dampen: this sense means holding something back so it becomes less strong, not stopping
  air so a person cannot breathe, not hiding a thing to keep it secret, and not a knee joint in an animal.'
examples:
- He tried to stifle his anger and spoke in a calm voice.
- She stifled a yawn during the long meeting.
