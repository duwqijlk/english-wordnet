simpleMeaning: kept from going bad, especially of fruits, by putting sugar on them or letting them take
  sugar in
scope: 'Also called candied, glace, and crystalised: this describes fruit kept from going bad with sugar,
  not fresh fruit.'
examples:
- She put crystalized fruit on top of the cake.
- The shop sells crystalized oranges covered in sugar.
