simpleMeaning: a woody plant that climbs and bears flowers in the south of the United States, and whose
  cut stems show a cross shape
scope: 'Also called quartervine, cross vine and trumpet flower: a woody plant that climbs and bears flowers,
  not a tree and not a vine grown for its fruit.'
examples:
- The quarter-vine climbed the fence and showed its orange flowers.
- When we cut the quarter-vine, the stem showed a cross shape.
