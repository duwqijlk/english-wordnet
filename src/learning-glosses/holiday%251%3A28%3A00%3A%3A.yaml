simpleMeaning: A period of free time when someone does not work and can rest or enjoy themselves.
scope: This is the time off itself, not a public festival day and not the trip taken during that time.
examples:
- She is on holiday for two weeks and will not check her email.
- After a busy year, he needed a real holiday.
