simpleMeaning: For first or quick writing, notes, or sketches, and the like, people use a block; in Britain
  they call it a scribbling block.
scope: People also call it scratch pad or scribbling block.
examples:
- The scratch paper lay ready for quick notes and sketches.
- Quick notes and sketches filled the scratch paper.
