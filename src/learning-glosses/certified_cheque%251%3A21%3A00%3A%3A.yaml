simpleMeaning: a paper order to pay from a bank account, stamped by the bank to say the giver has enough
  money in the account to cover it
scope: 'Also called a certified check: a bank-stamped order to pay, not an ordinary order to pay and not
  a promise to pay later.'
examples:
- He handed over a certified cheque for the car.
- The shop took the certified cheque because the bank had stamped it.
