simpleMeaning: In the coastal ranges and foothills of northern California grows a short much-branched
  bush with dark green leaves, its branch tips holding clusters of brick-red flowers
scope: Also called red shrubby penstemon; a low bush with brick-red flowers from the coast hills of northern
  California, not a tall tree.
examples:
- Redwood penstemon grows low on the coastal hills.
- The redwood penstemon by the trail had brick-red flowers.
