simpleMeaning: a wild plant from Europe that now grows in America, looks like parsley, and makes people
  feel sick and ill when eaten
scope: A wild plant that looks like parsley but is harmful to eat, also called fool's parsley; not the
  garden herb parsley itself.
examples:
- The lesser hemlock growing by the fence looks just like parsley.
- She warned the children not to eat lesser hemlock, because it can make them sick.
