simpleMeaning: A worker whose job is to clean and thicken cloth fresh from the loom
scope: A worker who cleans and thickens cloth fresh from the loom for a living, not a weaver and not a
  cloth seller.
examples:
- The fuller washed the new cloth in the stream.
- Fullers in the town worked the wool until it was thick.
