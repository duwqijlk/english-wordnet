simpleMeaning: the chasing, killing, or catching of wild animals for sport
scope: Another name for this sport is hunting; this is the activity itself, not the work of killing animals
  for food and not the group of people who take part in it.
examples:
- They took part in a traditional hunt on horseback.
- The king banned the hunt after protests from animal welfare groups.
