simpleMeaning: A device, as a pretty loop of cord or cloth, for holding or drawing a thing back.
scope: A device, as a pretty loop of cord or cloth, for holding or drawing a thing back; not, in war,
  the act of pulling back, especially an orderly pull-out of troops.
examples:
- Their pullback held the drape.
- The pullback was tied at dawn.
