simpleMeaning: In obstetrics, the number of children a woman has given birth to who were born alive
scope: In obstetrics, this count, also called parity, is about children a woman has given birth to who
  were born alive, not a paragraph.
examples:
- The doctor wrote 'para 2' in her notes because she had given birth to two children who were born alive.
- Her para was three, as all three of her children were born alive.
