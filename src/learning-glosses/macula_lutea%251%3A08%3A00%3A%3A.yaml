simpleMeaning: A small yellow spot at the centre of the retina, the layer at the back of the eye, packed
  with cone cells that give sharp, clear sight.
scope: A small yellow spot in the middle of the retina that gives sharp sight, also called macula, macular
  area, or yellow spot, not the whole retina and not the blind spot.
examples:
- The macula lutea is the part of the eye we use to read.
- Doctors check the macula lutea when sight in the centre fades.
