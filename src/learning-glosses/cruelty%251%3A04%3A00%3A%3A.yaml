simpleMeaning: an unkind act in which someone on purpose causes pain and suffering
scope: This is one unkind act done on purpose to cause pain, not the general quality of being unkind in
  a way that makes people uneasy or annoyed.
examples:
- Beating the dog was an act of cruelty.
- His cruelty to the prisoners caused them great pain.
