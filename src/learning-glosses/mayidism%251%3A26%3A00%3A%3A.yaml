senseId: 'mayidism%1:26:00::'
synsetId: 14224355-n
simpleMeaning: Illness from too little niacin (B vitamin) or tryptophan, or trouble making niacin; stomach
  upset, red skin, nerve or mental problems; may come from poor diet, alcohol or poor nutrition.
scope: This is an old variant name for pellagra, the same disease as maidism and mal rosso, not a separate
  diagnosis and not just a lack of one vitamin.
examples:
- Early twentieth-century doctors used mayidism for the disease we now call pellagra.
- Some older medical texts use mayidism instead of pellagra.
