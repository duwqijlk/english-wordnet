simpleMeaning: Water under push rises on its own through this hole, dug through rock it cannot pass to
  a layer fed from higher ground.
scope: This is a hole dug through rock that water cannot pass, down to a layer fed from higher ground,
  so the water rises up through it on its own.
examples:
- Water rose up through the artesian well on its own.
- An artesian well was drilled through the rock to reach the water below.
