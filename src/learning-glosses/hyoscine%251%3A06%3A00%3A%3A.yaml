simpleMeaning: It slows some body workings, and as a drug got from plants it makes people sleepy, stops
  sickness, and widens the pupils for eye work.
scope: It is the plant drug also called scopolamine, given to make people sleepy and to stop sickness.
examples:
- She took hyoscine to stop the sickness.
- Hyoscine made him drowsy before the eye test.
