simpleMeaning: In lilies and tulips, the outer ring of a flower has parts that are all alike, and no one
  can tell them apart as a sepal or a petal.
scope: Of the parts of a flower, this is the one that cannot be told apart as a sepal or a petal.
examples:
- The tepal of the lily looks the same all round the flower.
- A tepal fell from the tulip onto the table.
