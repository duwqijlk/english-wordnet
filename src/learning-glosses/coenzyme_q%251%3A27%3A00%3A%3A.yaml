simpleMeaning: One of a group of chemicals in living cells that carry electrons, tiny charged bits, from
  one molecule to another while the cell uses oxygen to release energy.
scope: Also called ubiquinone, this is one of several chemicals in living cells that carry electrons from
  one molecule to another.
examples:
- Coenzyme Q carries electrons from one molecule to another inside the cell.
- The cell uses coenzyme Q to pass electrons along while it releases energy.
