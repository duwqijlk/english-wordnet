simpleMeaning: The act of soldiers who ring a strong place, cut it off from help, and keep striking at
  it
scope: The act of soldiers who ring a strong place, cut it off from help, and keep striking at it, also
  called siege, besieging and military blockade, not a single raid and not a blockade by sea alone.
examples:
- The beleaguering of the fort went on for months, with no food getting in.
- Beleaguering cuts a strong place off from help while the attack goes on.
