  bear striking white, rose, or lavender blooms, any of many kinds.
scope: It is one of many plants of one group, with leaves that have no stalks and striking white, rose,
  or lavender blooms.
examples:
- Physostegia bears striking white blooms.
- Lavender blooms covered the physostegia.
