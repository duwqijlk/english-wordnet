simpleMeaning: a feeling that stays with a person for a while, or comes and goes with the moment
scope: 'Also called mood, temper, and humor: the feeling a person is in, not a funny remark and not the
  old idea of fluids in the body.'
examples:
- Whether he praised or cursed me depended on his humour at the time.
- He was in a bad humour all morning.
