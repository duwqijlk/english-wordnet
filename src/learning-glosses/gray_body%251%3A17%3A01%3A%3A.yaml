simpleMeaning: A thing that gives off rays in a fixed share of what a perfect black thing would give off
scope: This heat-giving thing is also called grey body, and is not a perfect black emitter and not an
  ordinary solid object.
examples:
- The metal plate acted as a gray body when heated.
- In the lab, a gray body gave off less heat than a black one.
