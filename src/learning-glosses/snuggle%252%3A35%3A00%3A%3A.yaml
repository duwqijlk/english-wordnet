simpleMeaning: to curl your body up close in a comfy place, and stay there feeling warm and safe
scope: To settle into a warm, soft spot, also called a nest, a nestle, a nuzzle, or a cuddle; not the
  noun sense of a long hug.
examples:
- The children snuggled into their sleeping bags.
- We snuggled under the blanket to keep warm.
