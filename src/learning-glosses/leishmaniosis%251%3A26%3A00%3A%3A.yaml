simpleMeaning: A warm-land sickness from tiny living things that sandflies pass on leaves sores behind
  it.
scope: It is also called kala-azar, kala azar, and leishmaniasis, and its sores follow a warm-land sickness.
examples:
- Leishmaniosis showed as sores after the sandflies had bitten her.
- His leishmaniosis came from tiny living things the sandflies passed on.
