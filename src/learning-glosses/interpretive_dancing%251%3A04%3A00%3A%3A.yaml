simpleMeaning: The way a person moves in this new kind of movement shows a feeling or tells a story
scope: A form of modern movement in which the way a person moves shows a feeling or tells a story, also
  called interpretative dance, interpretative dancing or interpretive dance; not a set folk dance and
  not a ballet.
examples:
- Her interpretive dancing told the story of a river.
- The students practised interpretive dancing to show fear and hope.
