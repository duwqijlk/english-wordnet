simpleMeaning: Corn with its hard outer skin taken off, ground into rough bits, and boiled and eaten for
  breakfast in the south of the United States
scope: 'Also called hominy grits: corn ground into rough bits, boiled and eaten for breakfast in the south
  of the United States, not sweet corn served whole and not a flour made from corn.'
examples:
- For breakfast, she ate a bowl of grits with butter.
- In the south, grits are often served beside eggs.
