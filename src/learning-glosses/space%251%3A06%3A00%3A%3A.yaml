simpleMeaning: in printing, a piece of type that has no letter standing on top, put between words or sentences
  to leave a gap
scope: This is the printer's physical block, not the blank character on a keyboard, not an empty area
  between things, and not the region beyond the Earth's atmosphere.
examples:
- The apprentice sorted the metal spaces back into the type case by size.
- A missing space made the two words run together when the page was printed.
