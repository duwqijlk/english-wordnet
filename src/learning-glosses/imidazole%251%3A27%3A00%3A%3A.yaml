simpleMeaning: a carbon-based chemical base with the mark C3H4N2, which blocks histamine, a body chemical
  that brings on allergy signs
scope: A carbon-based base that blocks histamine; glyoxaline and iminazole are other names for this sense,
  not a drug that copies histamine and not a salt.
examples:
- The chemist added imidazole to stop the histamine.
- Imidazole is used to block histamine in the lab.
