simpleMeaning: A faint, soft sound, like silk clothes shifting or leaves moving in the wind.
scope: This is the soft rustling sound, not the act of speaking very quietly or a rumour passed between
  people.
examples:
- The only sound was the whisper of her silk dress as she walked.
- A whisper of wind moved through the dry leaves.
