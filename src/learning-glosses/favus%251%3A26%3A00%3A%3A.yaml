simpleMeaning: A head infection that passes from person to person, where a fungus grows on the scalp,
  and it is found most often in Africa and the Middle East.
scope: This names the scalp infection that spreads from person to person, brought on by a fungus, and
  found most often in Africa and the Middle East.
examples:
- Favus spread among the children in the village.
- The doctor treated the boy's favus with medicine for the scalp.
