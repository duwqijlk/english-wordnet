senseId: 'inoculum%1:27:00::'
synsetId: 14943423-n
simpleMeaning: Something, such as a germ, a poison or blood fluid, put into the body to raise the body's
  guard against one illness.
scope: A substance, such as a germ, a poison or blood fluid, put into the body to raise the body's guard
  against one illness, also called inoculant; not a cure given after illness and not a drug that kills
  germs.
examples:
- The lab grew an inoculum to protect the mice.
- An inoculum was put into his arm before the trip.
