simpleMeaning: an extra part that makes a thing work better
scope: An extra part that makes a thing work better, also called an accessory, a supplement, or an appurtenance;
  not a software add-on that extends a program.
examples:
- The printer came with an add-on that lets it print on both sides.
- She bought an add-on for her camera that helps it take sharper pictures.
