simpleMeaning: the power to push something away or keep something away
scope: 'Also called repellant: the power to push or keep something away, not a chemical that keeps animals
  away and not a treatment for cloth that keeps water out.'
examples:
- Her cold manner was a repellent that kept unwanted visitors away.
- His sharp words acted as a repellent, and no one asked him more questions.
