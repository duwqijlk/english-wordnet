simpleMeaning: Lengths of metal pipe are joined end to end when a spark of power between them melts the
  ends and sticks them together
scope: Flash welding is another name for this way of joining lengths of metal pipe end to end with a spark
  of power that melts the ends and sticks them together.
examples:
- They used flash butt welding to join the lengths of pipe.
- The workers joined the pipe with flash butt welding.
