simpleMeaning: a straight line that a curve gets closer and closer to but never reaches, as if it touched
  the curve at a point very far away
scope: A line a curve draws nearer to without touching, not the curve itself and not a line that crosses
  it.
examples:
- The asymptote of the curve was a level line the curve came closer to but never met.
- In the graph, the asymptote ran along the top while the curve rose toward it.
