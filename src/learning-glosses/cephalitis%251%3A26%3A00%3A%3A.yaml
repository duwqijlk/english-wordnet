simpleMeaning: A swelling of the brain, usually brought on by a virus, bringing a sore head and neck,
  sleepiness, feeling sick, and fever; phrenitis is no longer used in science.
scope: Also called encephalitis and phrenitis; a swelling of the brain, not a swelling of the lining around
  the brain.
examples:
- Cephalitis left him drowsy with a sore head and a high temperature.
- The doctor said the cephalitis was most likely caused by a virus.
