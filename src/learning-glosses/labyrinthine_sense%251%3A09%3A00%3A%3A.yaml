simpleMeaning: The system in the inner ear that tells a person which way the head is turned
scope: This is the system in the inner ear that tells a person which way the head is turned, also called
  equilibrium, sense of balance, sense of equilibrium and vestibular sense, not sight and not hearing.
examples:
- The labyrinthine sense helps you keep your balance when you turn your head.
- Damage to the labyrinthine sense can make a person feel dizzy.
