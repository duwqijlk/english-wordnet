simpleMeaning: the main body of a plane, made to hold the crew (the people who work together to fly it),
  the people who ride in it, or goods
scope: The main body of a plane that holds people or goods, not a wing and not the back end of the plane.
examples:
- The passengers sat inside the fuselage as the plane took off.
- Workers fixed a crack in the fuselage after the flight.
