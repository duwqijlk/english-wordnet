simpleMeaning: One of the set regulations that shape daily life in a religious community.
scope: A religious community's regulation only; not a behavior principle, a normative example, a conduct
  guide, a language convention, an accepted general truth, a math method, a natural law, a game's directions,
  a reign, legal authority, a measuring stick, or any verb use (holding power, deciding, prevailing, declaring,
  matching zodiac signs, drawing lines, keeping in check, excelling).
examples:
- The monks rise before dawn, as their rule requires.
- She took vows to follow the rule of the order for life.
