simpleMeaning: how two things, or parts of things, stand to each other in amount, size, or degree
scope: How two things, or parts of things, stand to each other in amount, size, or degree; proportion
  is another name for this sense, and it is not one amount divided by another to give a single number.
examples:
- The ratio of boys to girls in the class is two to one.
- Mix the paint in a ratio of three parts white to one part blue.
