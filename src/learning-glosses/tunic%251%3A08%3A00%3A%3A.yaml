simpleMeaning: A thin skin-like layer that wraps round and covers a part of the body
scope: A covering layer of body tissue, not a loose cloak-like garment and not the skin on the outside
  of the body.
examples:
- The tunic covers the eye like a thin skin.
- The eyeball is wrapped in a tunic of tough tissue.
