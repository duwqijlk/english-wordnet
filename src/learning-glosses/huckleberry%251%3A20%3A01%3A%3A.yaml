simpleMeaning: Any of the shrubs of the group Gaylussacia, bearing small berries like blueberries.
scope: Any of the shrubs of the group Gaylussacia, bearing small berries like blueberries; not any of
  the dark-fruited blueberries, as against the blue-fruited kinds, nor a blue-black berry like blueberries
  and bilberries of the east United States.
examples:
- Their huckleberry grew in the woods.
- The huckleberry was picked at dawn.
