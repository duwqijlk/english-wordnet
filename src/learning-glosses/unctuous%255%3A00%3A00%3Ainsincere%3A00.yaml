simpleMeaning: trying too hard to please people with smooth, polite words or ways, in a way that is unpleasant
scope: 'Also called oily, buttery, soapy, fulsome, smarmy, and oleaginous: too friendly in a false way,
  not truly kind or warm.'
examples:
- He gave an unctuous smile and praised everyone too much.
- The unctuous salesman kept saying how wonderful we all looked.
