simpleMeaning: A tube of the wind instrument with a bag, tuned to sound one long unchanging note.
scope: A tube of the wind instrument with a bag, tuned to sound one long unchanging note; drone and bourdon
  are other names for this sense, not the melody tube and not a flute.
examples:
- The drone pipe sounded one long note under the tune.
- He tuned the drone pipe before the parade.
