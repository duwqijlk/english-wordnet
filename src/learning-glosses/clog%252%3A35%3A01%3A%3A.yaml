simpleMeaning: to slow or stop something moving, as if by tying it with a chain or weighing it down with
  a heavy load
scope: To slow or stop movement, as with a chain or a heavy load; not the thing that gets in the way,
  and not filling something so full it cannot work.
examples:
- The heavy chains clogged the horses until they were tamed.
- The chain clogged the horse and kept it from running away.
