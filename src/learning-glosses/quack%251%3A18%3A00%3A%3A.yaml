simpleMeaning: A person with no medical training who acts like a doctor and gives people health advice
scope: This is a person with no medical training who acts like a doctor, not a duck making its call and
  not the act of pretending to be a doctor.
examples:
- The so-called doctor turned out to be a quack.
- Do not trust a quack who sells cures with no proof.
