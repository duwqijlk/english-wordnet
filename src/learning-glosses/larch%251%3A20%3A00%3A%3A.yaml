simpleMeaning: one of many kinds of tree in the group called Larix, with cones, thin leaves like needles,
  and leaves that fall off each year
scope: This is the tree itself, also called larch tree; it is not the wood that comes from this tree.
examples:
- A larch loses its thin leaves in winter, unlike most trees with cones.
- Tall larches grew along the edge of the forest.
