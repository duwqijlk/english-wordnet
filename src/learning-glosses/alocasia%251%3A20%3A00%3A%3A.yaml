simpleMeaning: A plant of this kind has big showy leaves low on the stem, a boat-shaped leaf-like cover,
  and reddish fruit.
scope: Also called elephant's ear and elephant ear, this is a plant with big showy leaves low on the stem
  and a boat-shaped cover.
examples:
- The alocasia shows big leaves low on its stem.
- The alocasia bears reddish fruit beside its boat-shaped cover.
