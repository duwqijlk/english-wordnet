simpleMeaning: Only across the front opening of the building, a roofed porch has rows of free-standing
  columns
scope: A building whose free columns stand only across the front opening; pseudoprostyle is another name
  for this sense, not a building ringed with columns and not one with columns inside only.
examples:
- The temple was prostyle, with columns only across its front.
- A prostyle front has free columns in the porch and nowhere else.
