simpleMeaning: Any creeping half-water feather palm of its genus in mangrove swamps and tidal river mouths;
  its sap makes a liquor; leaves are used for thatch; fruit has edible seeds.
scope: Also called nipa palm; a creeping palm of mangrove swamps, not a tall palm of dry land and not
  a coconut palm.
examples:
- Nipa fruticans grows in the mangrove swamp.
- The leaves of Nipa fruticans are used for thatch.
