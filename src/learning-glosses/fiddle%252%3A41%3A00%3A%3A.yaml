simpleMeaning: to avoid doing the work or duties that you have been given
scope: This means to avoid work you should do, not to play the stringed instrument, not to steal from
  an employer, and not to touch or change things with your hands.
examples:
- He fiddled all afternoon and never did the work he was meant to do.
- She fiddled through the morning, avoiding every task her boss had given her.
