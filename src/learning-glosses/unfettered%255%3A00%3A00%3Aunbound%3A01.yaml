simpleMeaning: not held or tied by chains on the arms or legs
scope: 'Also called untied, unchained, and unshackled: this is about a body not held by chains, not about
  being free from rules or control.'
examples:
- The prisoner stood unfettered in the yard, with no chains on him.
- The horse ran unfettered across the field, with no chain on its legs.
