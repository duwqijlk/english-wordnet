simpleMeaning: The pouch where the large gut begins, into which the last part of the small gut opens.
scope: The pouch where the large gut begins, not the small gut and not the appendix; blind gut and caecum
  are other names for this sense.
examples:
- The appendix is an offshoot of the cecum.
- Food passes from the small gut into the cecum.
