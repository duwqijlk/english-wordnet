simpleMeaning: A person who has to do what others tell them, even the mean or dishonest jobs, with no
  choice of their own
scope: 'Also called creature and tool: a person used by others for mean jobs, not a hand doll and not
  a string puppet.'
examples:
- The general was only a puppet of the king.
- She refused to be a puppet for the company.
