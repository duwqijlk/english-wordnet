simpleMeaning: The order of the small units in DNA that carries the facts of heredity in living cells
scope: This is the order of small units in DNA that carries the facts of heredity, not the DNA itself
  and not a set of rules for writing.
examples:
- The genetic code tells the cell which protein to make.
- A change in the genetic code can alter the protein.
