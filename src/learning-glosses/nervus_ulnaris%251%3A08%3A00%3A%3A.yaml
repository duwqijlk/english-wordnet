simpleMeaning: The small muscles of the hand and the skin on its inner side are served by a nerve that
  runs along the inner side of the arm past the elbow.
scope: It is also called the cubital nerve and the ulnar nerve, the nerve that serves the small muscles
  of the hand and runs along the inner side of the arm.
examples:
- The nervus ulnaris passes near the elbow on the inner side of the arm.
- The nervus ulnaris serves the skin on the inner side of the hand.
