simpleMeaning: In mathematics, a rule set in advance that the answer to a set of equations about rates
  of change must follow
scope: In mathematics, a rule set in advance that the answer to a set of equations about rates of change
  must follow, not a starting value and not a value worked out from the equations.
examples:
- The boundary condition fixed the value at the edge of the region.
- Without a boundary condition, the equations had no one answer.
