simpleMeaning: a person who tricks men or forces them to join a ship or an army as sailors or soldiers
scope: This is a person who tricks men into service, not a curled lock of hair and not a shape made by
  folding.
examples:
- The crimp tricked young men into joining the ship as sailors.
- A crimp forced the men to serve as soldiers.
