simpleMeaning: In sandy land by the sea, this small green-all-year shrub or tree of the southeast United
  States most times grows in thick, hard-to-pass tangles.
scope: Also called seaside scrub oak, this small green-all-year shrub or tree of the southeast United
  States most times grows in thick, hard-to-pass tangles in sandy land by the sea.
examples:
- The myrtle oak grew in thick tangles along the sandy shore.
- The myrtle oak formed a tangle no one could push through.
