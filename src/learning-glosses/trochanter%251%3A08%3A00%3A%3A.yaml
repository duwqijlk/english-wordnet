simpleMeaning: A bump of bone near the top of the thigh bone, where muscles are joined to it.
scope: A bump of bone at the top end of the thigh bone, where muscles fasten on; not any other part of
  the bone.
examples:
- The trochanter juts out near the top of the thigh bone.
- Muscles that move the leg are joined to the trochanter.
