simpleMeaning: A form of insulin made by genetic engineering that matches human insulin, sold as Humulin;
  it treats people with diabetes who are allergic to insulin from beef or pork.
scope: A manufactured insulin that matches the human hormone, not insulin taken from cattle or pigs.
examples:
- After she reacted to beef insulin, her doctor prescribed recombinant human insulin.
- Recombinant human insulin is sold under the trade name Humulin.
