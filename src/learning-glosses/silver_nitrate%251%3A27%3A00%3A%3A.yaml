simpleMeaning: a chemical salt used to make the light-sensitive coat on photo film, and also used in healing
  to burn away bad flesh and to kill germs on the skin
scope: A chemical salt used to make the light-sensitive coat on photo film, and also used in healing to
  burn away bad flesh and to kill germs on the skin; not a salt used only for photo film and not a skin
  cream that kills germs.
examples:
- The doctor touched the wound with silver nitrate.
- Silver nitrate was used to make the photo film.
