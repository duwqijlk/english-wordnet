simpleMeaning: The act of setting a thing free from rules, most of all from rules made by a government
scope: This is the act of setting a thing free from rules, most of all rules made by a government; deregulation
  is another name for this sense. Not making new rules and not breaking rules.
examples:
- Deregulating the bus lines let new firms run the routes.
- The minister spoke in favour of deregulating the banks.
