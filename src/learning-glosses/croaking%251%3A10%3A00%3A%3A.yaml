simpleMeaning: a rough, hoarse sound made in the throat, like the sound a frog makes
scope: A rough, hoarse sound, with croak as another name for this sense, and not a clear voice or a cough.
examples:
- The croaking of the frogs filled the night.
- His croaking voice could barely be heard.
