simpleMeaning: to make needlework (cloth made with a needle and thread) by pulling thread into loops that
  lock together with a needle that has a bent end
scope: To make cloth with a needle and thread in loops, not a curved tool for hanging or pulling things
  and not a short punch from the side.
examples:
- She hooked a warm scarf from soft wool thread.
- He spent the evening hooking a small rug with thick thread.
