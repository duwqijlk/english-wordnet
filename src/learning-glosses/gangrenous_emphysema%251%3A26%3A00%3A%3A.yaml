simpleMeaning: This deadly sickness can be used as a weapon made from germs; in pathology, it is usually
  caused by clostridium bacteria that make poisons that kill tissue.
scope: This deadly sickness is also called clostridial myonecrosis, emphysematous gangrene, emphysematous
  phlegmon, gas gangrene, gas phlegmon and progressive emphysematous necrosis.
examples:
- The wound showed signs of gangrenous emphysema.
- Gangrenous emphysema can kill.
