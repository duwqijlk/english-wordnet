simpleMeaning: long flat pods hang from a low scrubby tree of tropical North America and the warm lands
  beside it, whose white flowers are touched with yellow, like mimosa
scope: 'Also called lead tree: long flat pods hang from a low scrubby tree of warm North America, with
  white flowers touched with yellow like mimosa, not a mimosa and not a tall shade tree.'
examples:
- White popinac grows low and scrubby along the dry roadside.
- The white popinac's white flowers are touched with yellow, and its pods hang long and flat.
