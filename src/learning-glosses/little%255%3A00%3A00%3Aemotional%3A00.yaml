simpleMeaning: small in a way that stirs strong feeling, either fondness or its opposite depending on
  the situation
scope: This is not a plain statement of small size, and not a judgment that something does not matter.
examples:
- The poor little dog shivered in the rain.
- He was a mean little man who enjoyed other people's trouble.
