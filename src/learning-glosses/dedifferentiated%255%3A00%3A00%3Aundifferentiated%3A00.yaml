simpleMeaning: having lost the special shape or work that something once had
scope: Having lost a special shape or work it once had, not having never had a special shape and not simply
  being damaged.
examples:
- The tumour cells were dedifferentiated and no longer looked like normal liver cells.
- The most severely dedifferentiated patients showed the greatest loss of normal function.
