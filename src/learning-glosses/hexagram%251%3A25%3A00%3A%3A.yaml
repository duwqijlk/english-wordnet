senseId: 'hexagram%1:25:00::'
synsetId: 13903468-n
simpleMeaning: A star-shaped figure with six points, made by drawing out each side of a six-sided figure
  to form two triangles with three equal sides.
scope: A star-shaped figure with six points made from a six-sided figure; not a five-pointed star, and
  not a plain six-sided figure.
examples:
- She drew a hexagram with six points on the paper.
- The hexagram on the flag was made of two triangles.
