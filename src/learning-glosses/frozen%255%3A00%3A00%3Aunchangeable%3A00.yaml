simpleMeaning: not able to be changed, moved, or undone, as with prices that stay at the same level
scope: Also called fixed. This is about things that cannot change, like prices, not about water turned
  to ice and not about food kept cold.
examples:
- The government kept frozen prices for bread all winter.
- They worked for years on frozen pay, with no rise at all.
