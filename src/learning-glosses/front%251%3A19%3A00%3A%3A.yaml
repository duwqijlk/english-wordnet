simpleMeaning: In meteorology, the weather event that forms where two different masses of air meet.
scope: This is the weather boundary sense, not the forward or most prominent side of something, not the
  part nearest the viewer, not a line where armies face each other, not a person's outward appearance,
  not a person used as a cover, not a field of activity, not the area just ahead of someone, not a political
  group with a shared ideology, not the adjective use meaning located at the front, and not a verb use.
examples:
- A cold front brought heavy rain and a sharp drop in temperature.
- The weather map shows a front where warm and cold air meet.
