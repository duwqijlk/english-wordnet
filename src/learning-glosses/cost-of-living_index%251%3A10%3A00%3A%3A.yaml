simpleMeaning: a number that tracks the price of all the goods and services a usual buyer pays for
scope: A number that tracks the price of all the goods and services a usual buyer pays for; consumer price
  index is another name for this sense, not a list of wages or a measure of pay.
examples:
- The cost-of-living index rose last year as the price of food and rent went up.
- The government uses the cost-of-living index to see how much more a usual buyer must pay.
