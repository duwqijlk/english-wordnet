simpleMeaning: not sure to happen, because it rests on things no one can control
scope: This is something unsure because it rests on things no one can control, not something certain and
  not a group of people.
examples:
- The results were contingent on the weather holding fine.
- Her plans were contingent, and she knew they might change.
