simpleMeaning: When drugs given before a major operation make a person wholly unaware, with no feeling
  at all, until the work is done
scope: A state of total loss of feeling during a major operation, also called general anaesthesia, not
  ordinary sleep and not a drug that numbs one part of the body only.
examples:
- General anesthesia kept her unaware through the long operation.
- The patient was still under general anesthesia when the surgeon finished.
