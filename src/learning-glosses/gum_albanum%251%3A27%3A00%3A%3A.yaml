simpleMeaning: A bitter sticky plant sap with a strong smell, like asafetida
scope: This is a bitter sticky plant sap with a strong smell, like asafetida; galbanum is another name
  for this sense, not a sweet resin and not asafetida itself.
examples:
- Gum albanum has a bitter taste and a sharp smell.
- The old recipe called for a pinch of gum albanum.
