simpleMeaning: In architecture, a square pillar whose top is cut in the shape of a statue, a head-and-shoulders
  figure, or an animal, first used in ancient Rome to mark a border
scope: In architecture, this is a carved stone post, also called a term and a terminal figure. It is not
  a station where buses or trains stop.
examples:
- A terminus with a carved head stood at the edge of the garden.
- The old terminus marked the border of the land in Roman times.
