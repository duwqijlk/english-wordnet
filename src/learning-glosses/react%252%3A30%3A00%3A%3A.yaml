simpleMeaning: for one thing to change when it meets another thing under the right conditions, in the
  way that things do in chemistry
scope: To change when it meets another thing in chemistry, not to answer or act in reply to something.
examples:
- The hydrogen and the oxygen react.
- Iron will react with air when it is left wet.
