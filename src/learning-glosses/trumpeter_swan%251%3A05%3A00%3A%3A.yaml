simpleMeaning: A large wild bird of western North America, pure white, with a loud deep cry
scope: A large white wild bird of western North America with a loud deep cry; trumpeter is another name
  for this sense. Not a tundra swan and not a small tame swan.
examples:
- A trumpeter swan flew over the lake at dawn.
- The trumpeter swan's cry echoed across the marsh.
