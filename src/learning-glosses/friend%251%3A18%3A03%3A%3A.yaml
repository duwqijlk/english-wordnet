simpleMeaning: a person who helps you or works with you on something.
scope: This is not a close companion you love and spend your free time with; it is someone who supports
  a person, group, or project.
examples:
- The library is supported by a group of friends who raise money for new books.
- She became a friend of the charity and helped at its events.
