simpleMeaning: To swell up and stick out beyond the surface around it
scope: To swell up and stick out beyond the surface around it, also called pouch and bulge, not to stay
  flat or level with the things around it.
examples:
- His stomach protruded after the huge meal.
- A shelf protruded from the wall above the desk.
