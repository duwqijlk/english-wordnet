simpleMeaning: a large group of tiny living things with stiff outer walls, and the kinds that move have
  thin tails that let them swim
scope: This is a large group of tiny living things with stiff walls, also called eubacteria and eubacterium;
  not tiny living things with no stiff walls and not a single germ that causes sickness.
examples:
- True bacteria are found in soil and water.
- Some true bacteria move with the help of thin tails.
