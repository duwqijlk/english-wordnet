simpleMeaning: an act of moving through a place, stealing things and doing much damage
scope: 'Also called depredation: stealing and damage done while moving through a place, not an animal
  hunting and killing another animal to eat it.'
examples:
- The village suffered years of predation by armed bands who stole food and burned homes.
- Their predation left the town empty, with shops looted and houses broken.
