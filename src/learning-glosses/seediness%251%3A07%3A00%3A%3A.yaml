simpleMeaning: looking untidy and worn because of old, thin, or dirty clothes
scope: Looking untidy and worn from old or dirty clothes; also called shabbiness, manginess and sleaziness.
  Not dirt on the skin and not a lack of manners.
examples:
- His seediness showed in his worn coat and dirty shirt.
- You could see the seediness in his old, thin coat.
