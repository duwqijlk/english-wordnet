simpleMeaning: A group of related evergreen trees and shrubs grown for their leaves and drooping flowers
  that look like magnolias; the fruit is used in curries, jellies and preserves.
scope: This is the evergreen tree or shrub itself, grown for its foliage and magnolia-like flowers; it
  is not a magnolia tree, and not the fruit alone that is used in curries and preserves.
examples:
- A row of dillenia trees shaded the driveway.
- Gardeners grow dillenia for its drooping, magnolia-like flowers.
