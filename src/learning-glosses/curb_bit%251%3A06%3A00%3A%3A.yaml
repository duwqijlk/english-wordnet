simpleMeaning: a piece put in a horse's mouth, with a chain or strap joined to it to hold the horse back
scope: 'Also called curb: a piece put in a horse''s mouth with a chain or strap, not a plain mouthpiece
  and not a bridle.'
examples:
- The rider fitted the curb bit before mounting the horse.
- A curb bit helps the rider slow the horse with a light pull.
