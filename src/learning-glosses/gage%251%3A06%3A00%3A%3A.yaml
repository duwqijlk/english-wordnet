simpleMeaning: a tool that measures a thing and shows the result, such as how thick a wire is or how much
  rain has fallen
scope: 'Also called gauge: this is the measuring tool itself, not the reading it shows and not a rough
  guess at a size.'
examples:
- The rain gage showed that two inches of rain fell last night.
- He used a gage to check the thickness of the wire.
