simpleMeaning: a married woman, usually middle-aged with children, who is calm, steady, and proper in
  manner
scope: A married woman of middle age, usually with children, who is calm and proper in manner, not a young
  wife and not a nun.
examples:
- The matron of the house welcomed the guests with calm dignity.
- She had become a respected matron in the town, known for her steady ways.
