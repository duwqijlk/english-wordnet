simpleMeaning: A sore, hot and swollen, on the skin or on a wet inner surface, with clear edges and often
  with pus, where the flesh round it has died.
scope: Also called an ulcer, this sore on the skin or a wet inner surface has clear edges and often pus,
  and the flesh round it has died.
examples:
- Ulceration formed on his skin.
- The ulceration had clear edges and pus.
