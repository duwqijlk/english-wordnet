simpleMeaning: A dye that glows and is often joined to germ-fighting proteins for use in a test that lights
  up under a microscope.
scope: This is a glowing dye joined to germ-fighting proteins for use in a test that lights up, not a
  plain stain or a drug, and it is also called fluorescein isothiocyanate.
examples:
- The lab used fluorescein isocyanate to mark the antibodies.
- Fluorescein isocyanate made the cells glow.
