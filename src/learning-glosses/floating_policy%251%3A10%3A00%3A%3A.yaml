senseId: 'floating_policy%1:10:00::'
synsetId: 06538115-n
simpleMeaning: A cover from an insurer for loss of things that can be moved, such as jewels, no matter
  where those things are.
scope: This is cover for loss of things that can be moved, not cover tied to one place, and it is also
  called a floater.
examples:
- Her floating policy covers the ring anywhere in the world.
- They took out a floating policy for the jewels.
