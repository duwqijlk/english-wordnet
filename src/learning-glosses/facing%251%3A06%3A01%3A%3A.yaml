simpleMeaning: a strip of cloth put on the edge of a piece of clothing to make it look better or to make
  it stronger
scope: A cloth strip on the edge of clothing; not the covering on the outside of a building, and not looking
  or turning toward something.
examples:
- The coat has a facing of blue cloth along its edge.
- She sewed a new facing to the edge of the dress to make it stronger.
