simpleMeaning: To complain under your breath, making unhappy remarks or low sounds that others barely
  hear.
scope: Complaining under your breath, another name for 'grumble' or 'mutter', not simply speaking quietly
  or making a steady low sound.
examples:
- She murmured something about the unfair decision.
- He murmured complaints all through the meeting.
