simpleMeaning: The bits that are left behind once the seed has been taken out of them — seed coats and
  small bits of stem and leaf
scope: The seed coats and small bits left after seed is taken out, also called straw, stalk, and shuck,
  not short hairs on a man's face.
examples:
- The field was covered in stubble after the harvest.
- Stubble from the wheat lay thick on the barn floor.
