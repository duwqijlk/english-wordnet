simpleMeaning: Coming slow and small on a brain chart, this is the usual brain wave of a person who is
  awake but calm and sleepy.
scope: Theta wave is another name for this usual brain wave, the one that comes slow and small on a brain
  chart.
examples:
- The theta rhythm showed on the chart while she lay awake but sleepy.
- The theta rhythm showed while he lay awake but drowsy.
