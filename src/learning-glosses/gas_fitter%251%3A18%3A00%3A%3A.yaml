simpleMeaning: A worker who puts in and mends the pipes and machines that use fuel vapour.
scope: This is a worker who puts in and mends pipes and machines that burn fuel vapour, not a plumber
  who works on water pipes and not an electrician who works on wires.
examples:
- The gas fitter came to put in a new cooker.
- We called a gas fitter when the heater stopped working.
