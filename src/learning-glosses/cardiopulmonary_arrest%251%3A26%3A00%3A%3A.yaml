simpleMeaning: Breathing and the heartbeat stop when the lower chambers stop squeezing, usually because
  they shake out of rhythm, so the body gets no air, and death follows.
scope: 'Also called asystole and cardiac arrest: a state in which breathing and the heartbeat have both
  stopped, not a faint in which the heart keeps beating.'
examples:
- Cardiopulmonary arrest means breathing and the heartbeat have both stopped.
- Cardiopulmonary arrest leads to death because the body gets no air.
