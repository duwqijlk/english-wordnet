simpleMeaning: This crested South American bird smells bad, and claws grow on the first and second toes
  of its young's wings.
scope: Also called a hoactzin or a stinkbird, its young have claws on the first and second toes of the
  wings.
examples:
- We saw a hoatzin in the trees of South America.
- Young hoatzins have claws on the first and second digits of their wings.
