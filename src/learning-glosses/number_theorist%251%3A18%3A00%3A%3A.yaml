simpleMeaning: A person who studies amounts and the rules that govern them, as a branch of mathematics.
scope: A person who studies amounts and their rules; not a mathematician who studies shapes or chance,
  and not a teacher of sums for children.
examples:
- The number theorist proved a new fact about whole amounts.
- She became a number theorist after studying mathematics at university.
