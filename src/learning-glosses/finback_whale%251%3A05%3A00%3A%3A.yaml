simpleMeaning: Plates fill the mouth of this big flat-headed whale, whose throat bears deep grooves, found
  in the Atlantic and Pacific oceans.
scope: Also called common rorqual, fin whale, or finback, this is the big flat-headed whale of the Atlantic
  and Pacific whose throat bears deep grooves and whose mouth holds plates.
examples:
- We saw a finback whale with deep grooves along its throat.
- Finback whales live in the Atlantic and Pacific oceans.
