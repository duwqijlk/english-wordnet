simpleMeaning: a person who gives a test to see if someone has the skill and knowledge needed for something
scope: 'Also called tester: a person who gives a test to check what someone can do, not a person who looks
  into something carefully to find facts.'
examples:
- The examiner asked each student ten questions and marked the answers.
- An examiner watched him take the driving test and said he had passed.
