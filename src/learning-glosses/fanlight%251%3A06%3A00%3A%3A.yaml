simpleMeaning: A half-round window over a door or window, usually with bars set out like the ribs of a
  fan.
scope: A half-round window over a door or window, usually with bars like the ribs of a fan; not a window
  above a door usually hung on a crosspiece, and not a window in a roof that lets in daylight.
examples:
- Light shone through the fanlight over the front door.
- The fanlight above the window had bars like a fan's ribs.
