senseId: 'duct%1:20:00::'
synsetId: 13111816-n
simpleMeaning: a tube made by a row of long cells, with no walls between one cell and the next, so it
  is open all the way through
scope: This is a tube made of long cells in a plant. It is not a tube in the body that carries liquid,
  and not a closed pipe for carrying liquid.
examples:
- Water moves through a duct in the stem of the plant.
- Under a microscope, the duct looked like a line of long cells joined end to end.
