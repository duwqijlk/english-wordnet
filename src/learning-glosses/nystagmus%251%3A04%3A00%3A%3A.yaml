simpleMeaning: Movements of the eyeballs that a person cannot stop; their being there or not helps doctors
  tell what is wrong with the nerves or the sight in many troubles.
scope: A sign in the eyes that doctors read to tell what is wrong with the nerves or the sight, not a
  sickness on its own.
examples:
- The doctor looked for nystagmus in the patient's eyes.
- The patient's eyes showed nystagmus.
