schema: oewn-learning-gloss-v2
senseId: negotiable%5:00:00:flexible:02
synsetId: 01028015-s
simpleMeaning: able to be talked about and changed, so that people can agree when each side gives up something
scope: This is about a demand, price, or plan that people can talk about and change to reach a deal. It
  is not the sense where a thing passes by law to a new owner, and not the sense where a way can be passed.
examples:
- The price is negotiable, so we can talk about a lower one.
- Her start date is negotiable if the job is right.
