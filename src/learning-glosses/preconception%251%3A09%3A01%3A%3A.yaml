senseId: 'preconception%1:09:01::'
synsetId: 06211643-n
simpleMeaning: a liking for or against something that stops a person from thinking fairly about a question
  or a situation
scope: 'Also called prejudice, and another name for it is bias: a liking for or against something that
  blocks fair thought, not a fair look at the facts.'
examples:
- His preconception against the plan stopped him hearing the facts.
- She tried to put aside every preconception and judge the matter fairly.
