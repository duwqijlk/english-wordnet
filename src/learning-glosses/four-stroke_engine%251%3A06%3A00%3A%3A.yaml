simpleMeaning: 'a piston motor that fires a fuel-and-air mix in four moves: drawing it in, squeezing and
  igniting it, being driven by the blast, then pushing out the burnt gas'
scope: The everyday short name for a four-stroke internal-combustion engine; not a two-stroke motor, which
  fires on every downward piston movement.
examples:
- Most cars on the road use a four-stroke engine.
- The mechanic explained how a four-stroke engine differs from a two-stroke one.
