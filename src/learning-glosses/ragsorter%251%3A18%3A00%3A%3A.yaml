simpleMeaning: a worker who picks out old cloth and old clothes to be used again, as in making paper
scope: A worker who sorts old cloth for new uses, not a person who makes paper and not a person who sells
  old clothes.
examples:
- The ragsorter spent the day picking through piles of old cloth.
- A ragsorter at the mill set aside the cleanest pieces for papermaking.
