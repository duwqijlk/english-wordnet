simpleMeaning: a skilled person whose job is to draw plans for buildings or machines
scope: A skilled person who draws plans for buildings or machines, whether a man or a woman, not a builder
  and not an artist who draws pictures.
examples:
- The draftsperson finished the plans for the bridge.
- Our draftsperson works with the builders on the new flats.
