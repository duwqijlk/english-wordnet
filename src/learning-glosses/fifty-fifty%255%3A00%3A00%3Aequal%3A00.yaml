simpleMeaning: Describes two things or sides as the same in size, amount, or strength, with neither one
  ahead.
scope: Describes two things or sides as the same in size, amount, or strength, with neither one ahead;
  also called even, not a clear win for one side.
examples:
- It was a fifty-fifty split of the money.
- They had a fifty-fifty chance of winning the game.
