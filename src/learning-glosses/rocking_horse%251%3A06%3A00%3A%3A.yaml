simpleMeaning: On curved bars, a toy shaped like a riding animal lets a child sit across it and pretend
  to ride.
scope: Also called hobby and hobbyhorse, this is a toy for a child to sit across and pretend to ride,
  not a live animal.
examples:
- We bought a rocking horse for the little girl.
- He rocked back and forth on his rocking horse.
