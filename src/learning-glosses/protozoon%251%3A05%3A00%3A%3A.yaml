simpleMeaning: A tiny living thing with one cell or no cells, one of many kinds, that usually does not
  make food from light
scope: 'Also called protozoan: a tiny living thing with one cell or no cells that usually does not make
  food from light, not a plant and not a larger animal.'
examples:
- A protozoon swam in the drop of pond water.
- The protozoon fed on tiny bits instead of making food from light.
