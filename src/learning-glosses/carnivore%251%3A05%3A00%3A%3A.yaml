simpleMeaning: a mammal (an animal that feeds its young on its own milk) that lives on land or in water
  and eats meat
scope: A meat-eating mammal that lives on land or in water, not a mammal that eats only plants and not
  a meat-eating plant.
examples:
- A lion is a carnivore that lives on land and hunts other animals.
- The otter is a small carnivore that lives in water and eats fish.
