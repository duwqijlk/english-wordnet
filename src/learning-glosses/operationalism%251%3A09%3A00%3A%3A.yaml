simpleMeaning: In philosophy, the view that what a claim means is the set of steps used to prove it or
  to put it to use
scope: In philosophy, the view that what a claim means is the set of steps used to prove it or to put
  it to use; not the view that a claim means what it says on its face and not a test in a lab.
examples:
- Operationalism says a claim means what its test steps show.
- In operationalism, meaning comes from proving or using a claim.
