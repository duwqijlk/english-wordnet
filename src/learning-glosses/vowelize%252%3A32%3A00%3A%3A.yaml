simpleMeaning: to say a sound the way a vowel is said, with the mouth open
scope: To say a sound the way a vowel is said, also called vowelise; not to say it as a consonant.
examples:
- The liquid is vowelized between two consonants.
- In this word, the letter is vowelized.
