simpleMeaning: A drug used to treat stomach effects of histamine in peptic ulcers, gastritis and acid
  reflux, working by blocking the effects of histamine on the receptor site known as H2.
scope: 'In medicine: a drug for stomach ills such as ulcers and acid reflux, acting on the H2 receptor.'
examples:
- The histamine blocker eased the ulcer.
- A histamine blocker blocks histamine at H2.
