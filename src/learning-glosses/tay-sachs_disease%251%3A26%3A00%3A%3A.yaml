senseId: 'tay-sachs_disease%1:26:00::'
synsetId: 14192846-n
simpleMeaning: A disorder passed down in families that upsets how the body handles fats, commonest among
  Jewish people in eastern Europe; fats build up in nerves and the child dies young.
scope: Not Gaucher disease or Niemann-Pick disease, other inherited disorders of fat handling; also called
  infantile amaurotic idiocy, Sachs disease, and Tay-Sachs.
examples:
- Tay-Sachs disease runs in some families of eastern European Jewish descent.
- A child with Tay-Sachs disease dies in early childhood.
