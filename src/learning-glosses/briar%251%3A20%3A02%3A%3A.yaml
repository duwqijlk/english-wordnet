simpleMeaning: A very thorny vine from the eastern United States that forms dense tangles, with tough
  round stems, glossy leathery leaves, green flowers and clusters of shiny black inedible berries.
scope: Another name for the eastern US thorny vine also called brier, bullbrier or catbrier; not the wild
  rose, and not the smoking pipe made from briar root.
examples:
- Thick briar covered the fence, its black berries hanging in clusters.
- He scratched his hands pulling briar out of the hedge.
