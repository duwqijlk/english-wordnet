simpleMeaning: A leading person in a deal on the stock exchange, who buys and sells shares with their
  own money.
scope: A leading person in a stock-exchange deal who buys and sells for their own account; also called
  a principal, not a seller of stolen goods and not a shopkeeper who keeps goods to sell.
examples:
- The dealer bought a large block of shares for his own account.
- As a dealer, she trades in her own name on the exchange.
