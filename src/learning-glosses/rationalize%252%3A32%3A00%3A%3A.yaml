senseId: 'rationalize%2:32:00::'
synsetId: 00896259-v
simpleMeaning: to give reasons to defend something, explain it, clear it of blame, or make excuses for
  it
scope: 'Also called excuse, apologize, apologise, and rationalise: to give reasons to defend or excuse
  something. Not to take out unwanted things, and not just to think in a clear way with reasons.'
examples:
- He rationalized his failure by blaming the bad weather.
- She rationalized stealing the money by saying she needed it more than its owner.
