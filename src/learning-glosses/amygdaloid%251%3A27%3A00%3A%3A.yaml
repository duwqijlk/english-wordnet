simpleMeaning: Round holes in rock from a volcano, made when gas spread inside it, later filled up with
  mineral matter.
scope: This is the kind of volcanic rock in which gas left round holes that later filled with mineral
  matter, and not plain rock with no holes in it.
examples:
- The amygdaloid showed round holes filled with mineral matter.
- We picked up a piece of amygdaloid near the volcano.
