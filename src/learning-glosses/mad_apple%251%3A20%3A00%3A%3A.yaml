simpleMeaning: An upright hairy herb native to southeastern Asia but widely grown for its large shiny
  fruit, which is commonly eaten as a vegetable.
scope: Another name for the eggplant, also called garden egg; not an apple or other tree fruit.
examples:
- The mad apple is grown for its large, glossy fruit, which is cooked as a vegetable.
- Although it is called a mad apple, the plant is an upright, hairy herb.
