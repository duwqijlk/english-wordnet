simpleMeaning: work done at home, with the worker in touch with the office by phone, fax or modem
scope: 'Also called telecommuting: work done at home with the office in touch by phone or fax, not work
  done at the office and not a home business run on its own.'
examples:
- He prefers teleworking to the daily drive to the office.
- The company lets staff do teleworking by phone and modem.
