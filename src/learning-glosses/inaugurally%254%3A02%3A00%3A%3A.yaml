simpleMeaning: in a way that marks the formal start of something
scope: A way of doing a thing that marks its formal start, not a way of doing it once it is under way.
examples:
- The mayor inaugurally drove the spade into the ground.
- The new bridge was inaugurally crossed by the governor.
