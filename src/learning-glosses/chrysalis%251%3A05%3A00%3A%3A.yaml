simpleMeaning: the young form of a moth or butterfly, shut inside a covering
scope: This is the middle stage of a moth or butterfly, shut in its covering; it is not the small crawling
  form before it and not the adult that flies after it.
examples:
- The caterpillar made a chrysalis and stayed inside for two weeks.
- Inside the chrysalis, the insect grew wings.
