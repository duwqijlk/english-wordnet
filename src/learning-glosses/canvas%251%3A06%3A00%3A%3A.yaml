simpleMeaning: a heavy cloth with its threads packed close together
scope: The cloth itself; not a tent made from it, not a painting on it, and not the sail of a ship.
examples:
- The bag is made of thick canvas that does not tear easily.
- They covered the boat with canvas to keep out the rain.
