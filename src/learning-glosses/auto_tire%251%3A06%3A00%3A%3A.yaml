simpleMeaning: A rubber ring around the rim of a car wheel; a tire for a car.
scope: This is what a car wheel wears round its rim, also called an automobile tire, a car tire, or a
  rubber tire.
examples:
- The auto tire went flat on the way home.
- He changed the auto tire after it burst.
