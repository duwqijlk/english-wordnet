simpleMeaning: of glass or quartzite, spoiled by small bubbles or small bits of other stuff
scope: 'Also called blebbed: glass or quartzite spoiled by small bubbles or bits, not a smooth clean piece
  and not a crack or chip.'
examples:
- The old window pane was blebby, full of tiny bubbles in the glass.
- This blebby piece of quartzite looks cloudy from the small bits trapped inside.
