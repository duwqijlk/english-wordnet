simpleMeaning: At the time of a person's death, all their things are added up to find what they are worth
scope: All that a dead person's things are worth when added up at the time of death, not the part left
  after debts are paid and not a dead person's yearly income.
examples:
- The lawyer worked out the gross estate before the will was read.
- Tax was charged on the gross estate, not on what each child got.
