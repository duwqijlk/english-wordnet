simpleMeaning: Made fizzy by carbon dioxide put into it.
scope: Also called charged, a drink or liquid made fizzy by carbon dioxide put into it, not a liquid with
  air bubbled through it to clean it.
examples:
- The water was aerated, with tiny bubbles rising in the glass.
- The drink was aerated and fizzed as she poured it.
