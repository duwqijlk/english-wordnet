simpleMeaning: This is the point where lines meet or end and trains take on and let off people and goods.
scope: It is also called a railroad station, a railroad terminal, a train depot, or a train station, and
  it is the point where lines meet or end and trains take on and let off people and goods.
examples:
- We met at the railway station before the train left.
- The railway station was full of people waiting for the morning train.
