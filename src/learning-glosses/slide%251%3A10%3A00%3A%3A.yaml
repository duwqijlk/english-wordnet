simpleMeaning: In music, a quick smooth sweep up or down through the notes of a scale.
scope: A musical sweep through a scale, another name for a swoop; not the playground chute, the glass
  microscope plate, or the act of moving smoothly along a surface.
examples:
- The violinist ended the phrase with a slow slide up the scale.
- His slide down to the low note was smooth and deliberate.
