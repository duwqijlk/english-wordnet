simpleMeaning: full of hot wet air, or giving off wet air as a thin cloud
scope: This describes a thing that is full of hot wet air or gives it off as a thin cloud; it is not about
  a person who is angry.
examples:
- A steaming bowl of soup sat on the table.
- She carried in a tray of steaming towels.
