simpleMeaning: a feeling of worry about whether an action is right, especially because of ideas about
  good and bad behaviour
scope: 'Also called misgiving and scruple: a worry that an action may not be right, not a general fear
  and not a feeling of sickness.'
examples:
- She had no qualms about reporting the theft to the police.
- He felt a qualm before signing a deal he thought was unfair.
