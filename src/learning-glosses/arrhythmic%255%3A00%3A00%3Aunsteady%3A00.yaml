senseId: arrhythmic%5:00:00:unsteady:00
synsetId: 02311256-s
simpleMeaning: With no steady beat to follow.
scope: This sense is also called jerky and jerking, for having no steady beat to follow, where jerky is
  without a smooth, even beat, speeding up and slowing down unevenly.
examples:
- His pulse was arrhythmic, with no steady beat.
- The drumming sounded arrhythmic and uneven.
