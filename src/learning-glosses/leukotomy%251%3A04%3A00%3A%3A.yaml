simpleMeaning: How a person thinks and acts often shifts in clear ways when an operation breaks the nerve
  paths that run to and from the front of the brain.
scope: 'Also called lobotomy, frontal lobotomy, leucotomy, prefrontal leucotomy, prefrontal leukotomy,
  and prefrontal lobotomy: an operation that cuts nerve paths to and from the front of the brain.'
examples:
- Leukotomy cuts the nerve paths to and from the front of the brain.
- After leukotomy, she thought and acted in clearly changed ways.
