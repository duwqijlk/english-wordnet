simpleMeaning: to make folds in a thing by pressing its edges together
scope: To make folds by pressing edges together, not to press a thing hard between two fingers and not
  a small sharp bite.
examples:
- She pinched the pie crust to make a neat edge.
- He pinched the cloth into folds along the seam.
