simpleMeaning: the carrying of people or goods by air, especially when other ways of reaching the place
  are not available
scope: This is moving people or goods through the air, not a free ride in a car or a machine that carries
  passengers between floors.
examples:
- The stranded climbers were taken off the peak by helicopter lift.
- During the flood, a military lift flew food to the cut-off towns.
