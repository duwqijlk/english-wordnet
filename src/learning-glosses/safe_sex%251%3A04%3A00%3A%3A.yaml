simpleMeaning: With steps, such as a thin rubber cover, people keep disease, above all AIDS, from passing
  from one person to another during love-making.
scope: This is love-making done with steps, such as a thin rubber cover, to keep disease, above all AIDS,
  from passing from one person to another, and not love-making with no such steps taken.
examples:
- They practised safe sex every time.
- They both agreed on safe sex.
