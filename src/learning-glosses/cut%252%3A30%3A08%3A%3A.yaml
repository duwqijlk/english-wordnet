simpleMeaning: to make something narrower in range or shorter while keeping its most important parts
scope: This means making something smaller in range while keeping its core, not slicing off its edges
  or ends.
examples:
- The director cut the film to two hours without losing the main story.
- We must cut the report to its essential findings before Friday.
