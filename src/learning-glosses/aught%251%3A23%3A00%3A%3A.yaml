simpleMeaning: 'nothing at all: no amount and no single thing, used as a word that says a thing is not
  there'
scope: 'Also called nothing, zero, zip, naught, nil, cipher, nix, nada, null, cypher, zilch, goose egg,
  and zippo: no thing or amount at all, not a small but real amount.'
examples:
- They worked all day and gained aught for their trouble.
- He promised help, but in the end we received aught from him.
