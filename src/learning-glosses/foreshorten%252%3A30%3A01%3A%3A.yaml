senseId: 'foreshorten%2:30:01::'
synsetId: 00245170-v
simpleMeaning: To draw lines shorter than they are, so that a flat picture seems deep.
scope: To shorten drawn lines to give a picture depth, not to cut a thing short in scope.
examples:
- The artist foreshortened the arm to give depth to the figure.
- She foreshortened the road so it seemed to run far away.
