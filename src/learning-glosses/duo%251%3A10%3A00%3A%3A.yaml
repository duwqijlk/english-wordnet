simpleMeaning: a piece of music for two people to play or sing together
scope: A piece of music for two people; also called duet and duette. It is not the pair of people themselves,
  and not music for one person or for a large group.
examples:
- The concert ended with a duo for violin and piano.
- She wrote a duo for two guitars.
