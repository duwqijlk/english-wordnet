simpleMeaning: a bush or a climbing plant, from the plant group called Lonicera
scope: This is the bush or climbing plant in the Lonicera group; not the red-flowered columbine plant
  with the same name, and not the shrubby tree with yellow flowers.
examples:
- Honeysuckle climbed over the garden fence.
- We planted honeysuckle along the wall.
