senseId: 'meteorite%1:17:00::'
synsetId: 09375746-n
simpleMeaning: a piece of stone or metal that is what is left of a rock from space after it has reached
  the ground
scope: A piece of stone or metal from space that has reached the ground. Not the bright light seen in
  the sky as it falls, and not the rock while it is still in space.
examples:
- They found a heavy meteorite in the field after the bright light fell from the sky.
- The museum shows a meteorite made of stone and metal.
