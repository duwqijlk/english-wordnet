simpleMeaning: in the job or position you hold for a government or an organization, not as a private person
scope: This is about the job or position you hold for a government or an organization, not about you as
  a private person; not the sense of having permission from the people or office in charge.
examples:
- Officially, she is in charge of the whole office.
- He is officially responsible for the safety of the building.
