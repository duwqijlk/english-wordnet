simpleMeaning: A poisonous white crystal-like acid child of benzene, that dissolves in water, used in
  making things and to clean wounds of germs, deadly if swallowed.
scope: This sense is also called carbolic acid, hydroxybenzene, phenol and phenylic acid, for a poisonous
