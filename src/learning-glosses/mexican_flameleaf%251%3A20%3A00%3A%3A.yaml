simpleMeaning: A tropical American plant with poisonous milk and showy tapering leaves, usually red, like
  petals round small yellow flowers.
scope: This is the plant, not a flame or a leaf on its own; also called poinsettia, lobster plant, painted
  leaf, Christmas flower, Christmas star and Euphorbia pulcherrima.
examples:
- The Mexican flameleaf has showy red leaves round small yellow flowers.
- Do not taste the Mexican flameleaf, for its milk is poisonous.
