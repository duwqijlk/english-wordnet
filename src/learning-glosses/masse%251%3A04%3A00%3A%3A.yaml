simpleMeaning: in billiards, a shot made by hitting the white ball with the stick held almost upright,
  so it curves round another ball before it hits the ball aimed at
scope: In billiards, a shot made with the stick held almost upright so the white ball curves round another
  ball; not an ordinary straight shot.
examples:
- He played a neat masse to get round the blocking ball.
- The masse sent the white ball curving round its target.
