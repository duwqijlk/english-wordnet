simpleMeaning: Small dull purple blooms mark this lily, which grows in northwestern Europe and northwestern
  Asia.
scope: This word names a lily of northwestern Europe and northwestern Asia, set apart from other lilies
  by its small dull purple blooms.
examples:
- The martagon grows in northwestern Europe and bears small dull purple flowers.
- We saw martagon with small dull purple flowers in northwestern Asia.
