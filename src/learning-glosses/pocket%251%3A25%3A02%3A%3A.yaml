simpleMeaning: In bowling, the gap on either side of the front pin, between it and the pins behind.
scope: This is the bowling gap beside the front pin, not a hollow left by removal or the billiard-table
  opening.
examples:
- The ball slid into the pocket and sent the pins flying.
- She aimed for the pocket on the left side of the lane.
