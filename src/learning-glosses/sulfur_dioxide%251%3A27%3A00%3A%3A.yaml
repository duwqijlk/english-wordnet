simpleMeaning: a colourless gas that can poison, found in the gases from volcanoes; factories use it in
  making many things, and it is in factory smoke and makes acid rain
scope: Also called sulphur dioxide; a poisonous gas from volcanoes and factories, not the smoke itself
  and not the acid rain it helps to make.
examples:
- Sulfur dioxide rises from the volcano in thick clouds.
- Factories must cut the sulfur dioxide in their smoke.
