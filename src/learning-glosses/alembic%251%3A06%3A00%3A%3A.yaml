simpleMeaning: An old kind of vessel for heating a liquid and catching what steams off it, made of two
  glass bulbs joined by a tube.
scope: For the old distilling vessel of two bulbs joined by a tube.
examples:
- The alembic stood on the bench, its two bulbs joined by a tube.
- Old books show an alembic used to draw off spirits.
