simpleMeaning: a light stick with a round head, used to hit instruments that make sound when they are
  hit, such as chimes, kettledrums, marimbas, and glockenspiels
scope: Also called hammer; this is the light stick for hitting music instruments, not the long-handled
  mallet used in polo or croquet to hit a ball.
examples:
- She hit the chimes gently with a mallet.
- He used two mallets to play the marimba.
