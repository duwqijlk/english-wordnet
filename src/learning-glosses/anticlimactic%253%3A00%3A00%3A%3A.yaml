schema: oewn-learning-gloss-v2
senseId: 'anticlimactic%3:00:00::'
synsetId: 02497584-a
simpleMeaning: coming after the most exciting or most important point, especially in a play or a story
scope: This sense is about what comes after the most exciting point, especially in a play or story. It
  is not about a sudden change from a grand style to a silly one.
examples:
- The quiet scene after the battle was anticlimactic, coming after the story's highest point.
- Everything after the discovery of the murderer was anticlimactic.
