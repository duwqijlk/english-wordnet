senseId: 'pragmatism%1:07:00::'
synsetId: 05159116-n
simpleMeaning: a quality of a person who accepts life as it is, chooses what works in practice, and keeps
  to plain, exact truth
scope: 'Also called realism: the quality of taking life as it is and choosing what works, not the named
  teaching in philosophy about knowledge, meaning and value.'
examples:
- His pragmatism helped the team choose a plan that could really work.
- She showed her pragmatism by dealing with the problem as it was, not as she wished it to be.
