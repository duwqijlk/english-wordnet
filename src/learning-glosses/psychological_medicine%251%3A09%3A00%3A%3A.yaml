simpleMeaning: The part of healing that finds out what is wrong in the mind and treats illnesses of the
  mind
scope: 'Psychiatry and psychopathology are other names for this sense: the part of healing that deals
  with illnesses of the mind, not the part that deals with illnesses of the body.'
examples:
- She studied psychological medicine so she could treat illnesses of the mind.
- Psychological medicine deals with finding out what is wrong in a troubled mind.
