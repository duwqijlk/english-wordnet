simpleMeaning: in a way that shows no sign of being alive
scope: In a way with no movement or sign of life; not in a dull, boring way and not in a lively, full-of-energy
  way.
examples:
- The girl lay lifelessly in her mother's arms, not moving at all.
- His hand fell lifelessly to the floor and did not move again.
