simpleMeaning: Too high a view of yourself, far more than is right, shown as a person, as one of the deadly
  sins.
scope: Too high a view of yourself, far more than is right; also called pride; not fair self-respect and
  not simple confidence.
examples:
- Superbia is named as one of the seven deadly sins.
- The preacher warned against superbia, the sin of pride.
