simpleMeaning: A mycoplasma (a tiny germ with no firm wall) that antibiotic drugs cannot kill, causing
  a kind of pneumonia in people
scope: A mycoplasma that antibiotic drugs cannot kill, causing a kind of pneumonia in people; not an ordinary
  germ that drugs can kill and not a virus.
examples:
- The pleuropneumonialike organism caused pneumonia that drugs could not kill.
- Doctors found the pleuropneumonialike organism in the patient with pneumonia.
