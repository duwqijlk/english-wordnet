simpleMeaning: A cover that holds an antenna and lets radio waves pass through it
scope: 'Also called a radome: a cover over an antenna that lets radio waves pass, not a solid dome that
  blocks them.'
examples:
- The radar dome on the roof kept the antenna dry in the storm.
- A crack in the radar dome let rain reach the antenna.
