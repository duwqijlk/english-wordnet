simpleMeaning: The round sky above, like the inside of a ball, on which the sun, moon, stars and planets
  seem to lie.
scope: The round sky above on which sun, moon, stars and planets seem to lie; heavens, sphere, firmament
  and empyrean are other names for this sense.
examples:
- On a clear night the stars seem fixed to the celestial sphere.
- The old chart showed the planets moving across the celestial sphere.
