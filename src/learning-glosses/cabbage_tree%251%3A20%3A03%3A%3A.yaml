simpleMeaning: A tree whose bark is rough, smells bad and is toxic, with strong, durable timber; its bark
  and seeds serve as a laxative, a worm treatment and a narcotic.
scope: The toxic timber tree also called cabbage bark; not the Australian palm whose young leaf buds are
  eaten, nor New Zealand's tree with long narrow leaves and fragrant flowers.
examples:
- The cabbage tree's rough bark gives off an unpleasant smell.
- Builders prize cabbage tree timber for its strength and durability.
