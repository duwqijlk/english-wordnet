simpleMeaning: The body changes that come with the release of an egg and the growth of the yellow body
  that forms next come before pregnancy and help it along.
scope: Of the time before pregnancy and the body changes that come with the release of an egg, not pregnancy
  itself.
examples:
- Progestational changes get the body ready for a pregnancy that may follow.
- The doctor spoke of the progestational phase that comes before pregnancy.
