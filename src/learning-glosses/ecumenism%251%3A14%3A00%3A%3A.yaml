simpleMeaning: a movement that works to bring faiths together, above all the Christian churches
scope: 'Also called oecumenism: a movement that works to bring faiths together, above all the Christian
  churches, not the teaching behind such a movement and not the work of one church alone.'
examples:
- The ecumenism of the last century brought churches into talks with each other.
- He wrote about ecumenism and the hope of Christian unity.
