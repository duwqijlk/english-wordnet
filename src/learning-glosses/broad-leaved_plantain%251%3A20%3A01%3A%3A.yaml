simpleMeaning: a common plant of Europe that lives for many years, now grows all over the world, and is
  a weed that causes trouble
scope: This is a common plant of Europe that lives for many years, now grows all over the world, and is
  a troublesome weed; cart-track plant, common plantain, white-man's foot and whiteman's foot are other
  names for it, not the North American plantain with reddish leafstalks and broad leaves.
examples:
- Broad-leaved plantain grows along the path behind the house.
- The gardener pulled up the broad-leaved plantain from the lawn.
