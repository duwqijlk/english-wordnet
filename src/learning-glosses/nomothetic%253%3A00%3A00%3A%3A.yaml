simpleMeaning: To do with the search for wide rules that hold true for all.
scope: To do with the search for wide rules that hold true for all, not the study of one case on its own
  and not a list of facts.
examples:
- His work was nomothetic, seeking rules that hold for all.
- A nomothetic study looks for wide rules, not single cases.
