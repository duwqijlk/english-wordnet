simpleMeaning: A low flat weed that lives one year and lies on the ground, with leaves in rings and small
  greenish-white flowers; it grows all over North America.
scope: This is a low weed, not a garden plant or a tall flower; also called carpetweed and Indian chickweed.
examples:
- Molluga verticillata lies flat on the ground.
- Molluga verticillata grows all over North America.
