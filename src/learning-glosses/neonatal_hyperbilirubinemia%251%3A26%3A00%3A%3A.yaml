simpleMeaning: A common sickness in newborn babies, usually caused by a liver too young to work well,
  that usually goes away on its own.
scope: A common sickness in newborn babies, usually from a liver too young to work well, that usually
  goes away on its own; also called hyperbilirubinemia of the newborn.
examples:
- Neonatal hyperbilirubinemia usually clears up on its own.
- The baby's neonatal hyperbilirubinemia came from a liver too young to work well.
