simpleMeaning: Carrying sense messages, a nerve of many strands serves the tiny hairs of the balance organ
  and the tiny hairs of the hearing organ
scope: Also called acoustic nerve, eighth cranial nerve, nervus vestibulocochlearis, or vestibulocochlear
  nerve, this is a nerve of many strands serving the tiny hairs of the balance and hearing organs, not
  a nerve that carries orders from the brain.
examples:
- Damage to the auditory nerve can take away both hearing and balance.
- The doctor tested the auditory nerve by checking his hearing and his balance.
