simpleMeaning: Going on for a long time, coming back again and again, or marked by long suffering.
scope: Going on for a long time, coming back again and again, or marked by long suffering, not a short
  sharp attack.
examples:
- He suffered from chronic indigestion for years.
- The region lived with a chronic shortage of water.
