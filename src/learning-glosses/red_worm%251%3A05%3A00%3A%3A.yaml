simpleMeaning: It digs through soil and lets air in, and fishers use it as bait; this land worm often
  comes up when the ground is cool or wet
scope: 'Also called earthworm, crawler, wiggler, nightcrawler, nightwalker, angleworm, dew worm, fishing
  worm, and fishworm: a land worm that digs through soil and lets air in.'
examples:
- Red worms came up when the ground was cool and wet.
- He dug up a red worm to use as bait.
