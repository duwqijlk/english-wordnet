simpleMeaning: People walk round land -- a church area, a house and its land, a wood, or the like -- to
  state and write down in an official way where its edges lie.
scope: This walk round a piece of land is made to state and write down where its edges lie, in an official
  way.
examples:
- A perambulation of the parish recorded its bounds.
- The perambulation of the forest set down where its edges lie.
