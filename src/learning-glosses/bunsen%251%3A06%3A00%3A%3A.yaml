simpleMeaning: A gas flame tool used in a place for science tests, with a valve that controls how much
  air mixes with the gas
scope: A gas flame tool used in science tests, with a valve that controls the air; bunsen burner and etna
  are other names for this sense, not a kitchen stove and not a candle.
examples:
- The student lit the bunsen to heat the liquid.
- She turned the valve on the bunsen to make the flame smaller.
