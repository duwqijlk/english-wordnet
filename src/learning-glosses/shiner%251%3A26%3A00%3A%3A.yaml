senseId: 'shiner%1:26:00::'
synsetId: 14312889-n
simpleMeaning: A swollen bruise beside the eye, from a blow.
scope: This sense is also called mouse, for a swollen bruise beside the eye, from a blow, where mouse
  is a swollen dark mark by the eye, caused by a hit, unlike the sense for any of the many small, silvery,
  North American carp-like fishes, especially of the group Notropis, unlike the sense for a prized food
  fish of the northern Atlantic and Med, its body greenish-blue with dark bars and few scales, if any,
  and unlike the sense for a thing that shines, by giving or throwing back light.
examples:
- The shiner is a swollen bruise beside the eye.
- Shiners come from a blow.
