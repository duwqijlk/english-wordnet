simpleMeaning: Pot-shaped cells of mud for their eggs are built by one of many kinds of stinging insects
  that live alone.
scope: One of many kinds of stinging insects that live alone, this kind builds pot-shaped mud cells for
  its eggs, not the kinds that live in big groups.
examples:
- The potter wasp shaped mud into pots for its eggs.
- The potter wasp lives alone, building its own mud cells.
