simpleMeaning: In a rough way that shows no skill.
scope: Also called crudely or inexpertly, in a rough way that shows no skill.
examples:
- He built the shelter artlessly, with crooked walls and a leaking roof.
- She drew the map artlessly, and no one could read it.
