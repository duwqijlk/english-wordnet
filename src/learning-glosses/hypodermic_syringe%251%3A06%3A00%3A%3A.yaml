simpleMeaning: a tube with a moving part inside, fitted with a thin sharp needle, used to put medicine
  under the skin
scope: A tube with a thin sharp needle for putting medicine under the skin; hypodermic and hypo are other
  names for this sense, not a plain needle and not a pill.
examples:
- The nurse filled the hypodermic syringe with the vaccine.
- He held the hypodermic syringe steady as he gave the shot.
