senseId: 'mid-off%1:04:00::'
synsetId: 00729516-n
simpleMeaning: The fielder nearest the bowler stands on the side of the field away from the batsman's
  legs in cricket
scope: The fielding place nearest the bowler on the side away from the batsman's legs, not the matching
  place on the leg side and not a place far from the bowler.
examples:
- The captain put a man at mid-off to catch the drive.
- The ball went straight to mid-off, and the fielder stopped it.
