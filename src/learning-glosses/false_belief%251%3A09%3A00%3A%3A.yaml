simpleMeaning: An idea a person holds that is wrong because the way they reached it was faulty
scope: 'Also called a fallacy: a wrong idea that comes from faulty thinking, not a lie told on purpose
  and not a simple mistake in facts.'
examples:
- His false belief that the earth is flat came from bad reasoning.
- She held the false belief that hard work alone would win the game.
