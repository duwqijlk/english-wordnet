senseId: 'hibiscus_trionum%1:20:00::'
synsetId: 12200973-n
simpleMeaning: A weedy herb that lives one year, with short-lived yellow flowers with purple centres;
  from the warm lands of the Old World, now settled as a weed in North America.
scope: 'Also called bladder ketmia, flower-of-an-hour, flowers-of-an-hour and black-eyed Susan: a weedy
  herb that lives one year, with short-lived yellow flowers with purple centres, from the warm lands of
  the Old World and now settled as a weed in North America; other weedy herbs of the same kind have flowers
  that last longer or of other colours.'
examples:
- Hibiscus trionum opens its yellow flowers for only a short time.
- Hibiscus trionum has settled as a weed in North America.
