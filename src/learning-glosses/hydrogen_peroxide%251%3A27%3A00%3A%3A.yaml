simpleMeaning: A thick liquid and strong oxidizer, which reacts vigorously with other substances; it bleaches
  powerfully, disinfects mildly when mixed with water, and at high strength helps rocket fuel burn.
scope: One of two names for this bleaching, disinfecting liquid, the other being peroxide; it is not the
  whole family of peroxide compounds.
examples:
- She poured hydrogen peroxide on the cut and it fizzed.
- Hydrogen peroxide bleaches hair and, diluted, disinfects small wounds.
