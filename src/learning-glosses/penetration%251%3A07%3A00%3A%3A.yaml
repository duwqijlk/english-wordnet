senseId: 'penetration%1:07:00::'
synsetId: 05142553-n
simpleMeaning: how far into something a thing goes when it passes in, especially how far a thing thrown
  or fired goes into the thing it hits
scope: How deep something goes in when it passes into a thing; not the sex act sense and not an attack
  that pushes into enemy land.
examples:
- The test measured the penetration of the bullet into the metal plate.
- Penetration was only a few centimetres, so the wall stayed strong.
