simpleMeaning: Leaves shaped like a spread hand and showy blue flowers in bunches along a stem mark this
  thick, strong plant of eastern and central North America, living year after year.
scope: Old-maid's bonnet and wild lupine are other names for this thick, strong plant of eastern and central
  North America, with leaves shaped like a spread hand and showy blue flowers.
examples:
- The sundial lupine bears showy blue flowers in bunches along a stem.
- Leaves shaped like a spread hand grow on the sundial lupine.
