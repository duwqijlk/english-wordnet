simpleMeaning: wanting to get away from hard or unpleasant parts of real life by doing fun things or by
  imagining a different world
scope: 'Another name for this is escape: wanting to leave hard parts of real life behind through fun things
  or imagined worlds, not really running away from a place.'
examples:
- Reading adventure stories was her escapism after a hard day at work.
- For him, old films were a form of escapism from his dull daily life.
