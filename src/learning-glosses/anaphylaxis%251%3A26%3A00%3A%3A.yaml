simpleMeaning: An over-sharp answer to swallowing or injecting a substance, a protein or drug, after an
  earlier meeting with that substance.
scope: Of a substance swallowed or injected after earlier contact.
examples:
- Their anaphylaxis struck at noon.
- The anaphylaxis was treated at once.
