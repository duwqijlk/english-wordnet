simpleMeaning: countries whose money is tied to the British pound, as one group
scope: Countries that share money tied to the British pound, not a single country and not a group tied
  to another money; also called sterling area and scheduled territories.
examples:
- Several countries joined the sterling bloc and tied their money to the British pound.
- Trade in the sterling bloc used money tied to the British pound.
