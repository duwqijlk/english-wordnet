senseId: 'particularistic%3:01:00::'
synsetId: 02871808-a
simpleMeaning: To do with putting one group, class, or set of people first and caring only about them
scope: To do with putting one group first and caring only about them, not a view that treats all groups
  alike.
examples:
- His particularistic view put his own town ahead of the whole country.
- The particularistic statement showed loyalty to one group only.
