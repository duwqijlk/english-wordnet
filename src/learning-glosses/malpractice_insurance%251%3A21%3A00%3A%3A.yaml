simpleMeaning: A plan bought by doctors and hospitals that pays the cost of a lawsuit over bad care
scope: A plan that pays the cost of a lawsuit over bad care, not cover for a car or a house and not a
  payment for an accident at work.
examples:
- Obstetricians have to pay high rates for malpractice insurance.
- The hospital renewed its malpractice insurance before the new year.
