senseId: 'exempt%2:32:00::'
synsetId: 00895399-v
simpleMeaning: to free a person from a duty or a rule that other people must follow
scope: The act of freeing a person from a duty or rule; not the word for a person who is already free
  from a tax or duty that others must pay or do.
examples:
- The school exempted him from the test because he was ill.
- Students who had passed the course were exempted from the final class.
