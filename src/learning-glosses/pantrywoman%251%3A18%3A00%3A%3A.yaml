simpleMeaning: In charge of the wine and the food served at meals, this female servant is usually the
  head servant of a house
scope: A female servant in charge of the wine and the food at meals, usually the head servant of a house;
  not the male servant with the same job, and not a maid who cleans the rooms.
examples:
- The pantrywoman chose the wine for the dinner party.
- As pantrywoman, she kept the keys to the wine cellar.
