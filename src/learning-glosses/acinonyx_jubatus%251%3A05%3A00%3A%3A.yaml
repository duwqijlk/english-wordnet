simpleMeaning: A long-legged spotted cat of Africa and southwestern Asia with claws that do not pull back,
  the fastest mammal, which can be taught to chase down game.
scope: A long-legged spotted cat with claws that do not pull back, also called cheetah and chetah; its
  nearest kin are the leopard and the lion, other big cats of Africa.
examples:
- Acinonyx jubatus raced across the plain faster than any other land animal.
- We watched Acinonyx jubatus rest in the shade after the chase.
