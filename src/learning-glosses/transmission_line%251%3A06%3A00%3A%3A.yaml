simpleMeaning: a wire or cable that carries electric power or signals, whether sent by power or by light
scope: This is a wire or cable that carries power or signals; line and cable are other names for this
  sense, not the gears in a car and not the moment a message is sent.
examples:
- The storm brought down a transmission line.
- Workers fixed the transmission line that carries power to the town.
