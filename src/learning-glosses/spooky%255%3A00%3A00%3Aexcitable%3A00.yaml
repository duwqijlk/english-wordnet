simpleMeaning: easily startled and quick to jump at small things, with no warning — most often said of
  a horse
scope: 'Another name for nervous: easily startled with no warning, most often of a horse — not the sense
  of a place that feels haunted or strange.'
examples:
- The spooky horse shied at a shadow.
- That spooky mare jumps at every sudden noise.
