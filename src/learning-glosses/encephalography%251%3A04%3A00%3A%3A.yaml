simpleMeaning: To make a picture of the brain, X-ray pictures are taken after the fluid around the spine
  is swapped for a gas, usually oxygen
scope: This taking of X-ray pictures of the brain follows the swapping of the fluid around the spine for
  a gas, usually oxygen.
examples:
- The hospital used encephalography to picture the brain.
- Encephalography was done after the spinal fluid was swapped for oxygen.
