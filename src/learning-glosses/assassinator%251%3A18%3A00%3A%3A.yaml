simpleMeaning: Paid to do the deed, this killer strikes by surprise, above all against a well-known person
  in politics.
scope: Also called assassin and bravo, this killer is paid to strike by surprise, above all against a
  well-known person in politics.
examples:
- The assassinator killed the minister in a surprise attack.
- The assassinators of kings and emperors struck without warning.
