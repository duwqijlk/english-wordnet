simpleMeaning: A system or pattern used for putting things in order or sorting them into groups.
scope: It is not a group of people that runs something, but the plan or pattern for sorting things.
examples:
- The library uses a simple system for grouping books by subject.
- Scientists developed a new scheme for classifying plants.
