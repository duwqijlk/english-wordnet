simpleMeaning: a woody plant of Europe, Asia and Africa with big pinkish to red flowers, often grown
scope: A woody plant of Europe, Asia and Africa with big pinkish to red flowers, often grown; periwinkle,
  cayenne jasmine, red periwinkle and rose periwinkle are other names for this sense, not the zinnia plants
  with bright flower heads and not a wild rose.
examples:
- The old maid in the border has pink flowers all summer.
- Gardeners grow old maid for its bright red blooms.
