simpleMeaning: a branch of the blood tube in the neck that feeds the eye and the parts near it
scope: A branch of the blood tube in the neck that feeds the eye and the parts near it; arteria ophthalmica
  is another name for this sense, not the blood tube in the neck itself and not a vein.
examples:
- The ophthalmic artery feeds the eye with blood.
- A block in the ophthalmic artery can harm sight.
