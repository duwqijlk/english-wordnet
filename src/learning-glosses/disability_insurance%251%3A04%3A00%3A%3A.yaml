simpleMeaning: a plan shared by the whole community that gives help to people whose bodies or minds limit
  what they can do
scope: A plan shared by the whole community that gives help to people whose bodies or minds limit what
  they can do, not a private plan for health care and not money paid when a person dies.
examples:
- He claimed disability insurance after the injury.
- Disability insurance helps workers who can no longer do their jobs.
