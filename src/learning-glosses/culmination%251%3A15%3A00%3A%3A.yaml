simpleMeaning: In astronomy, the highest point in the sky, above where the land seems to end, that a body
  in the sky reaches for a person watching it
scope: 'This is the astronomy sense: the highest point a body in the sky reaches above the line where
  the land seems to end, not the final high point that ends a long process.'
examples:
- The star reached its culmination at midnight, its highest point in the sky.
- At culmination, the planet was high above us and easy to see.
