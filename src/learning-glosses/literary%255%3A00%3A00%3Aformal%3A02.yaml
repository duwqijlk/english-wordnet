simpleMeaning: Fit for serious writing, rather than for everyday talk or writing.
scope: Fit for serious writing rather than everyday talk, not simply to do with writing as an art, and
  not a person who knows much about writing.
examples:
- He used a literary turn of phrase in his speech.
- Her literary style sounded stiff in everyday talk.
