simpleMeaning: looking dead, with no breath and no beat of the heart that anyone can feel
scope: 'Also called breathless and pulseless: this means looking dead with no breath. It is not a word
  for things that are not living, and not the grammar sense for nouns for non-living things.'
examples:
- They found the inanimate body in the cold room.
- The man lay still and inanimate on the floor until help came.
