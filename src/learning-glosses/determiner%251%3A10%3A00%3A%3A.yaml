simpleMeaning: One of a small set of words put before a noun to show which person or thing is meant
scope: A word that points to which noun is meant, not a word that describes it; determinative is another
  name for this sense.
examples:
- The determiner 'the' in 'the cat' shows which cat I mean.
- In 'those books', the determiner 'those' points to particular books.
