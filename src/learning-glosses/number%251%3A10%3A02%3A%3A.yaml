simpleMeaning: a numeral or row of numerals used to identify a person or thing, often printed on an account
  or membership card.
scope: This sense is not a symbol used to do arithmetic, not the grammar feature of singular and plural,
  and not specifically a telephone contact code; it is an identifying code for an account, membership,
  or similar record.
examples:
- Please write your account number on the form.
- Her membership number is printed on the back of the card.
