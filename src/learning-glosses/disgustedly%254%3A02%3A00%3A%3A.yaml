simpleMeaning: in a way that shows a strong feeling of not liking something very much
scope: It tells how a person does something while feeling strong dislike for something; it does not mean
  with anger or with fear.
examples:
- She looked disgustedly at the rotten food on the floor.
- He shook his head disgustedly when he saw the dirty room.
