simpleMeaning: no longer fresh, not good to taste, or getting worse because of age
scope: Food or drink that is no longer fresh and good to taste; not about ideas that are no longer new,
  and not about cows and horses passing water.
examples:
- This bread is stale and hard to eat.
- The beer tasted stale after sitting open all night.
