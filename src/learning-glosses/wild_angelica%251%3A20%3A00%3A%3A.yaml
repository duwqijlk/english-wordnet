simpleMeaning: On Cape Breton Island grows a herb from Europe whose leaves are made of many small parts,
  with white flowers, brought in from elsewhere.
scope: This herb of Europe grows on Cape Breton Island, where it arrived from elsewhere, and bears white
  flowers above leaves made of many small parts.
examples:
- White flowers opened on the wild angelica on Cape Breton Island.
- The wild angelica came from elsewhere, yet now it grows on Cape Breton Island.
