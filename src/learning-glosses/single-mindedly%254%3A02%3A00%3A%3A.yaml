simpleMeaning: With full attention on one aim, and nothing else in mind
scope: Acting with full attention on one aim; not doing several things at once, and not changing one's
  aim.
examples:
- She worked single-mindedly on the project until it was done.
- He single-mindedly kept at the task all morning.
