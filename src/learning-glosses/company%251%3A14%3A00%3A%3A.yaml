simpleMeaning: A group of guests or friends meeting together for social reasons.
scope: This is not a business firm, not a troupe of performers and not the state of having someone with
  you; it is the gathering of people itself.
examples:
- We are expecting company for dinner on Sunday.
- A merry company of friends gathered around the fire.
