simpleMeaning: connected with someone's job or position in an organization, especially in government.
scope: This sense describes things that belong to the job itself; it does not mean approved by an authority
  or checked and confirmed.
examples:
- The mayor's official duties include opening new schools.
- She answered questions about her official responsibilities, not her private life.
