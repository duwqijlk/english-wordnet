senseId: 'vena_rectalis%1:08:00::'
synsetId: 05376435-n
simpleMeaning: Any of several blood tubes that drain the walls of the back passage and the lower bowel.
scope: Several blood tubes draining the walls of the back passage and lower bowel; hemorrhoidal vein and
  rectal vein are other names for this sense; not blood tubes of the bladder and not ones of the legs.
examples:
- The vena rectalis drains the walls of the back passage.
- The vena rectalis carries blood away from the rectum.
