simpleMeaning: Untidy and dirty in looks and in housekeeping, in the way of a slut or a slattern, used
  especially of women.
scope: Also called blowzy or sluttish, untidy and dirty in looks and in housekeeping, used especially
  of women.
examples:
- The dress was slatternly, stained and hanging loose.
- The house looked slatternly, with clothes and dishes left everywhere.
