simpleMeaning: a flat board that runs across a small boat, holding its sides apart and used as a seat
  when rowing
scope: This is a board across a small boat that holds its sides apart and serves as a seat, not a board
  on land and not the act of stopping a plan.
examples:
- He sat on the thwart and took up the oars.
- The thwart in the rowboat also keeps the sides from closing in.
