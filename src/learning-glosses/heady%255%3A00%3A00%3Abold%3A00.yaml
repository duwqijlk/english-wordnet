simpleMeaning: boldly ignoring danger or what may happen because of what you do
scope: Boldly ignoring danger or what may happen because of what you do; reckless and rash are other names
  for this sense, and it is not the exciting feeling of drink or a drug, nor the use of good judgment.
examples:
- He made a heady dash for the gun, ignoring the danger.
- Only a heady driver would take that bend at full speed.
