simpleMeaning: Grown for soups and salads above all, this sweet-smelling herb of the Old World lives one
  year and has finely cut and often curly leaves.
scope: 'Also called chervil: a sweet-smelling annual Old World herb grown for its finely cut and often
  curly leaves for soups and salads.'
examples:
- Beaked parsley is grown for its finely cut leaves.
- She snipped beaked parsley into the salad.
