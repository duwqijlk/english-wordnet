simpleMeaning: a tree or bush of the group called Betula, with thin bark that peels off
scope: A tree or bush with thin peeling bark, not the stick used for punishment and not its wood.
examples:
- A birch stood beside the lake, its bark peeling in the sun.
- Birches lined the path with their white trunks.
