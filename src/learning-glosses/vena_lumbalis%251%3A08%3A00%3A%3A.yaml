simpleMeaning: Around the bones of the lower back lie nets of blood tubes, and these tubes drain the back
  wall of the body.
scope: Also called lumbar vein, these are the tubes that carry blood away from the back wall of the body
  and the lower back.
examples:
- Blood from the back wall of the body leaves through the vena lumbalis.
- Blood from the lower back flows out through the vena lumbalis.
