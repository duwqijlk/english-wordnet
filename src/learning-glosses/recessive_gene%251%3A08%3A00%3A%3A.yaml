schema: oewn-learning-gloss-v2
senseId: 'recessive_gene%1:08:00::'
synsetId: 05448451-n
simpleMeaning: A unit of heredity that shows its mark only when the matching unit from the other parent
  is the same
scope: A unit of heredity that shows its mark only when both copies match; not a dominant gene that shows
  its mark with one copy and not a chromosome.
examples:
- The recessive gene for blue eyes showed in their child.
- A recessive gene stays hidden unless both parents carry it.
