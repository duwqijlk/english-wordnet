simpleMeaning: In law, stepping into a case that is not yours without leave, helping one side with money
  or aid to block justice, stir up needless suits, or break the peace.
scope: In law, meddling in a court case that is not yours, not keeping a thing in good working order and
  not paying to keep a family.
examples:
- He was charged with maintenance for paying a stranger's court costs.
- Unlike champerty, maintenance need not bring the helper any profit.
