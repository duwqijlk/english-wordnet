simpleMeaning: A link between two kinds of living things in which one gains from the other and does it
  no harm
scope: A link between two kinds of living things in which one gains from the other and does it no harm;
  not a link in which both gain and not one in which one is harmed.
examples:
- Commensalism lets the small fish feed near the shark unharmed.
- The bird's commensalism with the ox gives it food without harming the ox.
