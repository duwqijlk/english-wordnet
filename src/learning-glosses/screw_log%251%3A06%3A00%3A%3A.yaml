simpleMeaning: Fins that turn round tell how fast a ship goes; they sit on a thing shaped like a cigar.
scope: People also call it patent log or taffrail log, and it is a tool for telling a ship's speed.
examples:
- The screw log showed the ship was going fast.
- The screw log showed a fast speed.
