simpleMeaning: A fern of the beech woods of North America, with stripes the colour of straw.
scope: Also called broad beech fern, southern beech fern, Dryopteris hexagonoptera, and Thelypteris hexagonoptera;
  a fern of North American beech woods, set apart from other woodland ferns by its straw-coloured stripes.
examples:
- Phegopteris hexagonoptera grew thick under the beeches.
- The Phegopteris hexagonoptera had pale stripes along its fronds.
