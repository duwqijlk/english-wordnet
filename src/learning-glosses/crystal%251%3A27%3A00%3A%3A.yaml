simpleMeaning: a solid that forms when a chemical turns solid, with its tiny parts put in the same order
  all through it
scope: A solid made when a chemical turns solid, with tiny parts in the same order all through it, not
  a hard stone from the ground, not clear glass, and not a part inside machines that run on power.
examples:
- A crystal formed in the dish when the chemical turned solid.
- Scientists grew a crystal in the lab to study the set order of its tiny parts.
