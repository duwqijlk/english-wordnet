simpleMeaning: To make something unsuitable for passage through or across it.
scope: This is about preventing passage, not merely restraining the motion of a moving object.
examples:
- A pile of sandbags stopped the entrance to the tunnel.
- Fallen rocks made the narrow lane impassable.
