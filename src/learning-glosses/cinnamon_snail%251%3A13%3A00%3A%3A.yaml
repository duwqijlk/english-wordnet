simpleMeaning: a sweet roll of dough spread with spice and sugar, sometimes with dried grapes, cut into
  rounds before it is baked
scope: A sweet roll of dough spread with spice and sugar, cut into rounds before baking; cinnamon bun
  and cinnamon roll are other names for this sense, not a plain bread roll and not a cake.
examples:
- The bakery sold cinnamon snails dusted with sugar.
- A cinnamon snail is a sweet roll shaped like a curl.
