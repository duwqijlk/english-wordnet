simpleMeaning: A fast look at a thing that does not go into much detail
scope: A fast, rough check of a thing, also called look-over; not a long, close look and not a full test
  of how a thing works.
examples:
- I gave him the once-over before we shook hands.
- She gave the room a once-over and saw the mess at once.
