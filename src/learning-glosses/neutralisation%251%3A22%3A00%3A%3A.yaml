simpleMeaning: Mixing an acid and a base leaves a salt; when both are strong, hydrogen ions and hydroxyl
  ions simply end up as water.
scope: The chemistry sense, also called neutralization, neutralisation reaction or neutralization reaction;
  not the political act of keeping a country out of a war, the euphemism for killing a threat, or the
  cancelling of an earlier action's effects.
examples:
- Antacid tablets are a familiar example of neutralisation at work in the stomach.
- In the lab we watched the neutralisation of hydrochloric acid with sodium hydroxide.
