simpleMeaning: the blood-pumping organ of mammals, birds and reptiles, with two upper chambers (auricles)
  that take in blood
scope: The blood-pumping organ of mammals, birds and reptiles with two upper chambers, not the heart of
  a fish with one upper chamber and not the whole chest.
examples:
- The biauriculate heart of a bird has two upper chambers.
- A biauriculate heart pumps blood through the body of a mammal.
