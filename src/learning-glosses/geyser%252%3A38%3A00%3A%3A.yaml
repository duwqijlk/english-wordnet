simpleMeaning: to flow out suddenly in large amounts, shooting up into the air
scope: The action of flowing out strongly and suddenly; not the hot spring in the ground itself that shoots
  water up.
examples:
- Water geysered high into the air from the broken pipe.
- Thick mud geysered out of the hole when the drill hit water.
