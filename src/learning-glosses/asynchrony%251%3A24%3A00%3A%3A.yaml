senseId: 'asynchrony%1:24:00::'
synsetId: 13868035-n
simpleMeaning: when things take place at times that do not match each other
scope: 'Also called asynchronism, desynchronisation, desynchronization and desynchronizing: when things
  happen at times with no link between them, not when they happen together or in step.'
examples:
- The asynchrony of the two signals made them hard to compare.
- There was a clear asynchrony between the lights flashing and the sound.
