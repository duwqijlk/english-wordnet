senseId: 'mononuclear_phagocyte_system%1:08:00::'
synsetId: 05469186-n
simpleMeaning: A set of germ-eating cells, some free and some fixed in place, spread through the body
  and made in the soft stuff inside bones
scope: 'System of macrophages is another name for this sense: a set of germ-eating cells spread through
  the body, not one organ and not the blood alone.'
examples:
- The mononuclear phagocyte system clears germs from the body.
- Cells of the mononuclear phagocyte system guard the tissues.
