simpleMeaning: To damage or wreck a thing on purpose, with no good reason for doing so.
scope: Also called vandalize, to wreck or ruin a thing on purpose, for no good reason.
examples:
- They vandalised the park benches, smashing them for no reason.
- Someone had vandalised the bus shelter overnight, breaking every window.
