simpleMeaning: an opening in a piece of clothing, usually at the front of trousers, that is closed with
  a zip or with buttons hidden under a fold of cloth.
scope: This is the fastening opening in a piece of clothing, not the flap on a tent and not the insect.
examples:
- He zipped up the fly of his jeans.
- The fly of these trousers is held shut by a hidden button.
