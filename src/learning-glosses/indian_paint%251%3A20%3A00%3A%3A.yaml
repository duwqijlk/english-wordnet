simpleMeaning: A European one-year plant with bunches of greenish flowers followed by red pulpy fruit
  like small berries, now growing wild in North America
scope: A European annual with greenish flowers and red pulpy fruit; strawberry blite, strawberry pigweed
  and Chenopodium capitatum are other names for this sense, not the North American plant that gives red
  or yellow dye.
examples:
- Indian paint grew along the edge of the cornfield.
- The red fruit of Indian paint followed its greenish flowers.
