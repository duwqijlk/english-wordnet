senseId: 'dibasic_salt%1:27:00::'
synsetId: 14635457-n
simpleMeaning: A chemical made by swapping out two hydrogen bits in each tiny part
scope: A chemical formed by swapping out two hydrogen bits, not the acid it came from and not a salt with
  one bit swapped.
examples:
- The dibasic salt formed when the acid lost two hydrogen atoms.
- They made a dibasic salt by replacing two hydrogen atoms per molecule.
