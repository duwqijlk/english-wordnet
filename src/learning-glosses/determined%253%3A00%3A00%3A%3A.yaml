simpleMeaning: learned or found out, especially by looking into the facts with care
scope: About a fact that has been learned or found out, especially by study; not about a strong-willed
  person and not about a time or place fixed by a person in charge.
examples:
- After the tests, the determined cause of the illness was a bad infection.
- The report lists the determined age of the old bones.
