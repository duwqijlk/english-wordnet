simpleMeaning: a strip of cloth tied round the forehead or wrist to soak up the salty liquid the skin
  gives out
scope: This is a strip tied round the forehead or wrist to soak up sweat, not the strip sewn inside a
  hat.
examples:
- He tied a sweatband round his forehead before the match.
- She wore a sweatband on her wrist while she played tennis.
