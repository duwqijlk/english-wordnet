simpleMeaning: a paper for goods sent by ship, given when the same ship that took the goods on board also
  brings them to the end of the trip
scope: A paper for goods sent by ship, given when the same ship that took the goods on board also brings
  them to the end of the trip, not a paper for goods moved by more than one ship and not a receipt for
  goods bought in a shop.
examples:
- The direct bill of lading showed that one ship had carried the crates from start to finish.
- She filed the direct bill of lading with the shipping office.
