simpleMeaning: Where a nerve cell meets a muscle, its flat tip hands the nerve's signals over to the muscle.
scope: This is also called end-plate and motor end plate, and it is the flat tip where a nerve cell meets
  a muscle.
examples:
- The endplate passes the nerve's signals to the muscle.
- Signals cross the endplate into the muscle.
