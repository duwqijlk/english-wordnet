simpleMeaning: to be joined to something, or to come to be joined to it
scope: To be joined or linked to something, as two paths or streets are; not the sense of people acting
  together for a shared purpose or belief.
examples:
- The two paths unite at the river.
- The two small streams unite to form a bigger river.
