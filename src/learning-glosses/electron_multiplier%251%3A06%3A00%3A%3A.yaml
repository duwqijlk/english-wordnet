simpleMeaning: a sealed tube with no air inside that makes a stream of tiny charged parts stronger
scope: A sealed tube with no air inside that makes a stream of tiny charged parts stronger, not a device
  that brings such a stream to one point and not a tube that sends out light.
examples:
- The electron multiplier in the detector made the weak flow of tiny parts strong enough to read.
- A new electron multiplier was fitted to the machine to lift the faint signal.
