senseId: 'remise%1:04:00::'
synsetId: 01177135-n
simpleMeaning: In fencing, a second push of the blade made on the same forward step, as when the other
  fighter fails to strike back.
scope: In fencing, a second push of the blade made on the same forward step, as when the other fighter
  fails to strike back; not the first push and not the answering push.
examples:
- He scored with a remise after his first thrust missed.
- The remise caught her opponent off guard.
