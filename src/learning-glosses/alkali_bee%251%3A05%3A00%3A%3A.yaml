simpleMeaning: a common insect that lives alone and is important for carrying pollen to alfalfa, a crop
  grown to feed farm animals in the west of the United States
scope: A common insect that lives alone and helps alfalfa grow in the west of the United States, not a
  honeybee that lives in a hive and not a bee that lives in other places.
examples:
- The alkali bee is important for pollinating alfalfa in the west.
- Farmers welcome the alkali bee because it helps their alfalfa grow.
