simpleMeaning: a vegetable with more protein than any other known; the fruit of its plant is used in many
  foods and fed to animals, especially in place of animal protein
scope: Also called soybean, soya and soya bean. This is the bean used as food and rich in protein, not
  the thin dark sauce made from it and not the plant grown for oil.
examples:
- Soy is often used in foods made in place of meat.
- Many people eat soy because it has a lot of protein.
