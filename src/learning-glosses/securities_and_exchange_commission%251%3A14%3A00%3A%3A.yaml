simpleMeaning: A separate federal body in the United States that watches the trade in shares to guard
  buyers.
scope: SEC is another name for this sense; this is a federal body that watches the trade in shares to
  guard buyers, not a body that runs the markets itself.
examples:
- The Securities and Exchange Commission watches the trade in shares.
- The Securities and Exchange Commission acts to guard buyers of shares.
