simpleMeaning: A sand grass of the Pacific shore, used to hold sand in place
scope: A sand grass of the Pacific shore, used to hold sand in place; sea lyme grass, European dune grass
  and Leymus arenaria are other names for this sense, not a lawn grass and not a marsh reed.
examples:
- Elymus arenarius holds the dunes together.
- We planted Elymus arenarius to stop the sand blowing away.
