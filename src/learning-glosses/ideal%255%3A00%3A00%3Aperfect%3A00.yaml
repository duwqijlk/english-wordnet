simpleMeaning: as good as it can be, meeting the best possible standard and showing what is perfect
scope: Describing something as perfect; not a thing that is a perfect model for others, and not about
  ideas in philosophy.
examples:
- This quiet room with good light is ideal for studying.
- The flat is in an ideal place, close to both work and the shops.
