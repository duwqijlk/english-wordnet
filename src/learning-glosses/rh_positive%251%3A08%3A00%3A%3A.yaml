simpleMeaning: The group, about eighty-five in a hundred people, whose red cells carry the Rh factor.
scope: The common group, also called Rh-positive blood type; the other main group is the one whose red
  cells lack the Rh factor.
examples:
- She is Rh positive, so her red cells carry the Rh factor.
- The test showed he was Rh positive.
