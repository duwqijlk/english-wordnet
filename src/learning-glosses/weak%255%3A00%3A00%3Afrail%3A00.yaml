simpleMeaning: in poor physical condition, unable to exert much force and easily tired
scope: About physical strength and energy, not character, skill, or faint light or sound; feeble, infirm,
  rickety, decrepit, weakly, debile and sapless are other names.
examples:
- After the illness she felt weak for weeks.
- The old dog's legs were too weak for the stairs.
