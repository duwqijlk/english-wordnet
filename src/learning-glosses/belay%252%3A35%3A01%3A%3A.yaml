simpleMeaning: To make a rope fast by winding it round a thing or a person.
scope: To make a rope fast by winding it round a thing or a person, not the act of fastening a boat to
  a post or pin, and not the thing a climber makes their rope fast to.
examples:
- They belayed the rope round the tree to hold the load.
- The sailor belayed the line round the post and pulled it tight.
