simpleMeaning: a sloping track that lets ships slide down into the water after they are built or repaired
scope: This is not a road or a method, but a shipyard structure for moving ships into the water.
examples:
- The ship slid down the ways into the harbor.
- Workers repaired the wooden ways at the old shipyard.
