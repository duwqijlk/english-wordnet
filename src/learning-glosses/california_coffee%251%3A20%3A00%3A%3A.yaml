simpleMeaning: A shrub of the western United States that keeps its leaves all year and bears small red
  or black fruits.
scope: Also called coffeeberry, California buckthorn, and Rhamnus californicus; a shrub of the western
  United States that keeps its leaves all year and bears small red or black fruits, not a shrub of the
  east and not a shrub with white fruits.
examples:
- California coffee bushes line the trail.
- The California coffee was heavy with red fruit.
