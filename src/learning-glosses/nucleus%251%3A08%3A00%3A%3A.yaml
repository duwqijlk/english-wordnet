simpleMeaning: the part inside a cell that holds DNA and RNA (the parts that carry instructions for life)
  and controls how the cell grows and makes new cells
scope: This is the control part inside a living cell, not the center of an atom, not the center of a comet,
  and not a mass of nerve cells in the brain.
examples:
- The nucleus controls how the cell grows and makes new cells.
- Under the microscope, we could see the nucleus in the middle of the cell.
