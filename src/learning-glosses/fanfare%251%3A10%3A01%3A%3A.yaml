simpleMeaning: In music, a short, lively tune played on brass instruments (metal instruments you blow
  into, such as a trumpet)
scope: This tune, also called flourish, is a short lively tune played on brass instruments; it is not
  a showy outward display.
examples:
- A fanfare of trumpets announced the queen's arrival.
- Her entry was greeted with a loud fanfare from the band.
