simpleMeaning: An unhappy remark made quietly and unclearly, so it is hard to understand.
scope: A quiet, unclear complaint, also called 'mutter' or 'grumble', not a continuous low sound or the
  act of complaining under your breath.
examples:
- She answered with a murmur of protest.
- There was a murmur of complaint from the staff.
