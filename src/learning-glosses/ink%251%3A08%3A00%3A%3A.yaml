simpleMeaning: a dark liquid that a cuttlefish or other soft sea animal shoots out into the water to hide
  itself
scope: A dark liquid shot out by a cuttlefish to hide itself, not the dark liquid used for writing and
  not a mark made with it.
examples:
- The cuttlefish shot out ink and swam away unseen.
- A cloud of ink spread through the water.
