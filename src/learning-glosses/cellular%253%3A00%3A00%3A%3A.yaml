simpleMeaning: having, split into, or holding cells or small separate parts, where a cell is the smallest
  unit of a living thing or of a group
scope: 'This sense is about how a thing is made up: made of cells or small separate parts, not one single
  solid piece.'
examples:
- The cellular structure of the leaf can be seen under a microscope.
- The group kept a cellular form, with small separate teams each doing its own work.
