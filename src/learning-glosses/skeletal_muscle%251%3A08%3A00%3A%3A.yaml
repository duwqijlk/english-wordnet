simpleMeaning: Stripes run across this band of flesh, which is joined to a bone at one end or both and
  so moves a part of the bony frame
scope: Also called a striated muscle, it is the striped band of flesh that pulls on bone to move part
  of the frame.
examples:
- The skeletal muscle in the arm pulled the bone as the arm bent.
- The skeletal muscle in the leg tightened and pulled the bone with it.
