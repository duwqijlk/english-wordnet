simpleMeaning: A mercury-based metal blend, often with silver, that dentists pack into tooth cavities;
  chemists apply the term to most mercury mixtures, but iron and platinum will not dissolve in mercury.
scope: The physical mercury-and-metal material, not a figurative mixture of different things; dental amalgam
  is the same substance named for its use in teeth.
examples:
- Old fillings made of amalgam often last for decades.
- The dentist mixed the amalgam before packing it into the cavity.
