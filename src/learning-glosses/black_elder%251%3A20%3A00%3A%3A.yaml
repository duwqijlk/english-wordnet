simpleMeaning: Its dark fruit goes into wines and jellies, and it grows as a common bush or a small tree
  in Europe and Asia.
scope: People also call this plant elderberry, bourtree and common elder, and it grows as a common bush
  or a small tree in Europe and Asia, with dark fruit that goes into wines and jellies.
examples:
- The black elder was heavy with dark fruit.
- Black elder fruit is used to make wine and jelly.
