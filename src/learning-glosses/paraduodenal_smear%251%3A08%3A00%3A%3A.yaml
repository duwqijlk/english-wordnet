simpleMeaning: A thin spread of matter from the first part of the small intestine, set out for close study.
scope: A thin spread of gut matter for close study, also called duodenal smear; not a blood spread and
  not a swab.
examples:
- The lab made a paraduodenal smear from the sample.
- A paraduodenal smear showed cells from the gut.
