simpleMeaning: a sharp, high sound that rings, like the sound made when a bullet hits metal
scope: A sharp, high, ringing sound, such as when metal is hit; not a low, soft sound and not the hit
  itself.
examples:
- A loud ping rang out when the bullet hit the metal gate.
- We heard a clear ping as the small ball hit the metal post.
