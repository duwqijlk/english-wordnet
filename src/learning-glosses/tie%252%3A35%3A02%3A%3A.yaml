simpleMeaning: In music, join two notes of the same pitch with a curved line so the sound is held through
  both.
scope: This is the music action of joining equal notes, not the curved mark itself and not the general
  action of fastening with rope or cord.
examples:
- The composer tied the two quarter notes across the bar line.
- Tie the last note to the first one so it rings on.
