senseId: 'guttural%1:10:00::'
synsetId: 07134884-n
simpleMeaning: A consonant, a sound made when air is stopped in the mouth, made at the back of the mouth
  or in the throat
scope: This is a consonant made at the back of the mouth or in the throat, not a sound made with the lips
  and not a voice that is rough and deep.
examples:
- The 'ch' in 'Bach' is a guttural.
- German has several gutturals.
