simpleMeaning: Very bad pain when a person swallows, caused by something wrong with the food pipe
scope: Very bad pain when swallowing because something is wrong with the food pipe, not pain from a sore
  throat and not trouble swallowing with no pain.
examples:
- Odynophagia made every meal painful for her.
- The odynophagia was so bad that he could barely swallow.
