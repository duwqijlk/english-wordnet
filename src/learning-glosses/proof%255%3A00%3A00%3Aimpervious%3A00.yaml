simpleMeaning: able to keep out or resist something harmful, used only as the last part of a compound
  word.
scope: This describes resistance built into a compound word, not a trial print, evidence, or a drink's
  strength.
examples:
- This jacket is waterproof, so you can wear it in the rain.
- The tent is fireproof and will not burn easily.
