simpleMeaning: A person has this state when their moving blood carries too much carbon dioxide, a gas
scope: A state in which the blood that moves around the body carries too much carbon dioxide, also called
  hypercapnia; not a lack of oxygen and not too little carbon dioxide.
examples:
- The diver's hypercarbia was found in a blood test.
- The doctor checked the man's blood for hypercarbia.
