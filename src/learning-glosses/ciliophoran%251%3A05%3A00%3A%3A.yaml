simpleMeaning: a tiny one-celled living thing with a small hair-like part that sticks out of its outer
  layer
scope: This is a tiny one-celled living thing with a hair-like part sticking out of it; ciliate and ciliated
  protozoan are other names for this sense, and it is not a plant or a hair on a body part.
examples:
- Under the microscope, the ciliophoran moved by waving its tiny hair-like parts.
