simpleMeaning: a sudden fall of many small things, like rain, such as tears or sparks
scope: This is many small things falling suddenly like rain, not washing your body under water and not
  the thing in a bathroom that sprays water.
examples:
- A shower of sparks rose from the fire.
- A shower of petals fell on the bride and groom.
