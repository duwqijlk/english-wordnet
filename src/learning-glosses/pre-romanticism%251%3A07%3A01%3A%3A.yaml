simpleMeaning: A way of thought and art in Europe from about the 1740s on, that came before and gave a
  foretaste of the later art movement of feeling and fancy.
scope: A way of thought and art in Europe from about the 1740s on, that came before and gave a foretaste
  of the later art movement, not the later movement itself and not the older art of strict rules.
examples:
- Pre-Romanticism came before the great age of feeling in art.
- Poets of pre-Romanticism loved wild nature and strong feeling.
