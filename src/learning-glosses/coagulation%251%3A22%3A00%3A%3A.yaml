simpleMeaning: the way a liquid forms soft solid lumps
scope: This is the forming of soft solid lumps in a liquid; clotting and curdling are other names for
  this sense, not the mixing of a liquid and not a liquid turning to ice.
examples:
- The coagulation of the milk made soft lumps in the pan.
- Doctors watched the coagulation of the blood in the tube.
