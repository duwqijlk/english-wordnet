simpleMeaning: The target is neared low down, and the plane rises sharply before its bomb drops, in this
  kind of run.
scope: This kind of run is also called loft bombing.
examples:
- The toss bombing run kept the plane low until the last moment.
- The bomb fell from the plane as it rose in the toss bombing run.
