simpleMeaning: a speech sound made with a hiss, like s or sh
scope: Also called a sibilant; a sound made with a hiss, not a hard stop like p or t and not a vowel.
examples:
- The sibilant consonant at the start of 'snake' hisses.
- She spoke the sibilant consonant in 'ship' with a clear hiss.
