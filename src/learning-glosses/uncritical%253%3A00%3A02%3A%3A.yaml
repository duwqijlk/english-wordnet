simpleMeaning: Paying no heed to the standards and ways of careful judgment.
scope: Also called noncritical, this is said of one paying no heed to the standards and ways of careful
  judgment.
examples:
- The report was uncritical, taking every claim at face value.
- Their praise was uncritical and overlooked all the faults.
