simpleMeaning: to make something dirty with dark dirt, or as if with dark dirt
scope: This is a verb for making a thing dirty; it is not the noun for a baked clay jar, and it is not
  the verb for colour coming off badly dyed cloth when it is rubbed.
examples:
- Smoke from the old stove crocked the white wall above it.
- His shirt was crocked after he cleaned out the black stove.
