senseId: 'squirting_cucumber%1:20:00::'
synsetId: 12186275-n
simpleMeaning: a Mediterranean vine whose long fruit, once ripe, bursts open at a touch and shoots its
  seeds and juice far out
scope: 'Also called exploding cucumber and touch-me-not: a Mediterranean vine whose ripe fruit shoots
  out seeds and juice when touched, not a garden cucumber grown to eat and not a vine whose fruit stays
  whole when ripe.'
examples:
- Do not touch the squirting cucumber when its fruit is ripe.
- The squirting cucumber shot seeds and juice across the path.
