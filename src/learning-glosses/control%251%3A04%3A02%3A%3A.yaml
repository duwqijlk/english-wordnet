simpleMeaning: in physiology, the managing or keeping up of a body function, action, or reflex
scope: The body's regulation of its own functions, not power over other people, a machine's control mechanism,
  or a standard used in an experiment.
examples:
- Breathing is under the control of the brain stem.
- Doctors studied the control of heart rate during exercise.
