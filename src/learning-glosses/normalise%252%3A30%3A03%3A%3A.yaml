simpleMeaning: To get to the usual state, or to go back to the way things were
scope: This is a state reaching the usual way things are; normalize is another name for this sense, and
  not making something else normal, which is another sense of the same word.
examples:
- Let us hope that relations with this country will normalise soon.
- After the storm, trade began to normalise.
