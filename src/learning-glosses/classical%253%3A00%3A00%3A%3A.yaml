simpleMeaning: Said of the early age that first gave a people, a way of life, or a field of study its
  shape
scope: Also called classic; of the first great age of a people or field of study, not the art of old Greece
  and Rome and not the old high music of Europe.
examples:
- Her work on classical pottery traced the first age of the craft.
- Classical Chinese pottery comes from the first great age of its makers.
