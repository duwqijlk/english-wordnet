simpleMeaning: A political group in the United States, set up in 1869 to fight the making and selling
  of alcoholic drink.
scope: This was a party in the United States set up in 1869 against the making and selling of alcoholic
  drink, not a party that backed the drink trade.
examples:
- The Prohibition Party was formed in 1869.
- The Prohibition Party opposed the sale of alcoholic drinks.
