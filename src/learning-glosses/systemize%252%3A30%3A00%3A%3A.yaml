simpleMeaning: To arrange things by one clear set of rules
scope: To arrange things by one clear set of rules; systematise, systematize and systemise are other names
  for this sense, not to leave things as they are and not to break things apart.
examples:
- The firm systemized its ordering process.
- She systemized the whole archive in a week.
