simpleMeaning: A South African bulb plant, often grown for its sweet-smelling white or rose flowers.
scope: A South African bulb plant grown for its sweet-smelling flowers; belladonna lily is another name
  for this, and it is not the European autumn-flowering bulb plant of the same name.
examples:
- The naked lady bloomed in the garden.
- Her naked lady had rose flowers.
