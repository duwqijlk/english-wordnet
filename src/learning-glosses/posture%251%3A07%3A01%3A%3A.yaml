simpleMeaning: a person's own way of holding their body
scope: 'Another name for carriage, also called bearing: the usual way a person holds their body, not strength
  for war and not acting in a false way to impress others.'
examples:
- She stood with good posture, her back straight.
- His posture changed when he sat at the desk all day.
