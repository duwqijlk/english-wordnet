simpleMeaning: The idea that buying more and more goods is good for the economy (the way money, business,
  and buying and selling work in a place)
scope: This is the idea that buying more goods is good for money and business, not the movement that works
  to keep buyers safe and treated fairly.
examples:
- Consumerism says a country does better when people keep buying more goods.
- He wrote a book against consumerism and its idea that more buying is always good.
