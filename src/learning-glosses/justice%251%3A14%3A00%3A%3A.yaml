simpleMeaning: The part of the United States government that makes sure country-wide laws are kept, with
  all laws on fair treatment for all; set up in 1870.
scope: The law department, also called the Department of Justice, the DoJ, or the Justice Department;
  not fairness itself, and not any other department.
examples:
- Justice enforces federal laws.
- The Justice Department was created in 1870.
