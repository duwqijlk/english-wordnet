simpleMeaning: a hollow pipe that sends air or gas into a flame to make the heat stronger in one place
scope: 'Another name for a blow tube or a blowpipe: a pipe that sends air or gas into a flame to make
  the heat stronger in one place, not a pipe used to blow darts and not a tube that moves air for breathing.'
examples:
- He used a blowtube to make the flame hot enough to melt the glass.
- The blowtube sent a stream of air into the small flame.
