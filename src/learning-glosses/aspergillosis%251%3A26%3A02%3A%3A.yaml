simpleMeaning: a bad breathing disease of birds that shows as a sudden, fast-killing lung sickness in
  young chickens and turkeys
scope: 'Another name for brooder pneumonia: a fast-killing lung sickness of young chickens and turkeys,
  not the farm-worker''s disease of the same name.'
examples:
- Aspergillosis killed half the young turkeys in a week.
- The vet found aspergillosis in the brooder house chickens.
