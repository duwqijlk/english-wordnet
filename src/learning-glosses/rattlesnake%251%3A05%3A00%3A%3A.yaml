simpleMeaning: a pit viper (a poisonous snake that feels heat through a hole by each eye) with hard parts
  at the end of its tail that make a sound when shaken
scope: Also called a rattler, this is the poisonous snake with hard tail parts that make a sound when
  shaken; it is not other snakes with no such tail parts.
examples:
- A rattlesnake lay across the warm path, its tail shaking.
- We heard the rattlesnake before we saw it among the rocks.
