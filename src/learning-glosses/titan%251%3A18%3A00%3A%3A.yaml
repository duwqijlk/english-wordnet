simpleMeaning: In Greek myth, any of the great old gods who ruled the Earth until Zeus threw them down;
  they were the children of Uranus, Heaven, and Gaea, Earth.
scope: These are the old Greek gods overthrown by Zeus, not the later Olympian gods nor a huge person.
examples:
- Cronus was a Titan who ruled before Zeus.
- The Titans were the children of Uranus and Gaea.
