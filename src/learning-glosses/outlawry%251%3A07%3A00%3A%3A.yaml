simpleMeaning: Being outside the law because of unlawful acts, and openly refusing to obey the law.
scope: Being outside the law because of unlawful acts; lawlessness is another name for this sense, not
  the breaking of one rule and not a single crime.
examples:
- Outlawry put him beyond the help of the law.
- The gang lived in outlawry for years.
