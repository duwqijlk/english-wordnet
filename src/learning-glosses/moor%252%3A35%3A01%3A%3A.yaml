simpleMeaning: to tie a boat in its place at a dock, or in a place like it, so it stays safe and cannot
  move away
scope: 'Also called berth: to tie a boat in its place at a dock, not to hold it with ropes or cables in
  general and not open wild land.'
examples:
- They moored the boat in the small dock for the night.
- We moor the ferry at this side of the harbour each winter.
