simpleMeaning: a long flat piece of soft wood, such as a board cut from a fir or pine tree
scope: This is one board cut from fir or pine, not the timber as a material, not an agreement between
  people, and not an amount handed out.
examples:
- He nailed a deal board over the broken window.
- The carpenter planed a plank of deal until it fitted the frame.
