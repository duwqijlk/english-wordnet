simpleMeaning: Surgery, or a body that did not form them, can leave a person with no milk-making glands
  in the chest.
scope: This word names a body with no milk-making glands in the chest.
examples:
- After surgery, amastia meant no milk-making glands were left in the chest.
- Born with amastia, the child had no milk-making glands in the chest.
