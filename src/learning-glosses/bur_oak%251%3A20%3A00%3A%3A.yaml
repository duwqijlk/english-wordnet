simpleMeaning: An oak of central and eastern North America, medium to large, shedding leaves each year,
  with egg-shaped acorns deep in large fringed cups and wood tough with a close grain.
scope: 'Another name for burr oak, mossy-cup oak and mossycup oak: the medium-to-large oak with fringed
  acorn cups; not a burr, the prickly seed case that clings to fur.'
examples:
- The bur oak's acorns are almost hidden by their fringed cups.
- Bur oak timber is tough and close-grained.
