simpleMeaning: Part by part, this field looks at how the body is built and how the muscles, nerves, and
  blood tubes of one part sit next to each other.
scope: This is the study of the body part by part, also called topology and topographic anatomy, not the
  study of the body as a whole.
examples:
- In regional anatomy, students learn how the muscles and nerves of the arm sit together.
- Regional anatomy looks at one part of the body at a time.
