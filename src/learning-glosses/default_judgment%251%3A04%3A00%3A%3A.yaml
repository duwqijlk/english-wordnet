senseId: 'default_judgment%1:04:00::'
synsetId: 01191027-n
simpleMeaning: A court order in favour of the person who brought the case, made because the other side
  did not come to court
scope: A court order for the person who brought the case when the other side fails to appear; also called
  default judgement, judgement by default and judgment by default, not a decision after a full hearing.
examples:
- The court gave a default judgment when the defendant failed to appear.
- His lawyer asked for a default judgment after the other side stayed away.
