simpleMeaning: In Christianity, one of about 70 early Latin and Greek writers whose books set out and
  fixed the accepted teaching; some later became saints.
scope: One of the early Christian writers of the 2nd to the 7th century, also called Father of the Church
  and Father.
examples:
- Augustine was a Church Father of the Latin West.
- The Church Fathers wrote in the first centuries after Christ.
