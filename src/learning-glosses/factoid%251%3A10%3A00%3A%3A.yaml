simpleMeaning: A short news item, usually no more than a sentence long and usually about something of
  little weight.
scope: A short news item, usually one sentence long and usually trivial; not a thing that only looks like
  a fact and is believed because it was printed.
examples:
- The factoid filled a single line at the foot of the page.
- Each factoid in the column was a sentence long.
