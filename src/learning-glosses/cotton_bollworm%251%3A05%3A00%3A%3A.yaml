simpleMeaning: Corn, tomato and white-fibre crops are badly harmed above all by the young of a moth that
  flies at night.
scope: Also called corn earworm, tobacco budworm, tomato fruitworm and vetchworm; it is the young of a
  moth, not the moth itself.
examples:
- The cotton bollworm ruined the tomato crop.
- The cotton bollworm feeds on maize as well as tomatoes.
