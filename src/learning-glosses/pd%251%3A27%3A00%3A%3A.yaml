simpleMeaning: A silver-white metal in the platinum group, like platinum; found in some copper and nickel
  ores, it stays bright at normal heat and, mixed with gold, is used in ornaments.
scope: Also called palladium and atomic number 46; a silver-white metal like platinum, not silver itself
  and not a gold alloy.
examples:
- Pd does not tarnish at ordinary temperatures.
- The ring was made of Pd mixed with gold.
