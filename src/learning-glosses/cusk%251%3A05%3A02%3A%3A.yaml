simpleMeaning: A cod-like fish of fresh water in northern Europe, Asia and North America, long and thin,
  with whisker-like parts round its mouth.
scope: Ling, burbot and eelpout are other names for this fresh-water fish, which is not the sea fish of
  the same name.
examples:
- The cusk hid among the stones in the cold stream.
- He caught a cusk with whiskers round its mouth.
