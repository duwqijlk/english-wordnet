senseId: 'combinative%3:00:00::'
synsetId: 00474326-a
simpleMeaning: having to do with things joined together, or coming from that joining
scope: It marks a thing as joined or coming from joining, with combinatory as another name for this sense,
  and not a thing kept apart or standing alone.
examples:
- The combinative power of the two teams made the plan work.
- Her combinative approach joined art and science in one lesson.
