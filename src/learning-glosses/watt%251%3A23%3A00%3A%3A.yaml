simpleMeaning: a unit of power equal to 1 joule per second, or to the power used up when a current of
  1 ampere flows through a resistance of 1 ohm
scope: A unit for measuring power, not a unit of energy itself.
examples:
- This light bulb uses 60 watts.
- The heater is rated at 1,000 watts.
