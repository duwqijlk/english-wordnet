simpleMeaning: A tall straight swamp tree of the south-east to the middle west of North America, giving
  pale soft wood that is easy to shape.
scope: Also called water gum; among swamp trees it is the tall straight one of the south-east to the middle
  west, whose pale soft wood is easy to shape.
examples:
- Nyssa aquatica grows where the ground stays wet all year.
- The carpenter liked Nyssa aquatica wood because it was pale, soft, and easy to shape.
