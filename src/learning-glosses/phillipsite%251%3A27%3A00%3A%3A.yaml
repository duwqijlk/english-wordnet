simpleMeaning: white or red clear hard stones of a family that soaks up water, made of a mix holding water
  that joins silicon with calcium, potassium and aluminium
scope: A white or red crystal stone that holds water in its make-up, not a gemstone cut for jewelry and
  not a common building stone.
examples:
- The collector showed us a piece of white phillipsite from the old quarry.
- Reddish phillipsite crystals lined the wall of the cave.
