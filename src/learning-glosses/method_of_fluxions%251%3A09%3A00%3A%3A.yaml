simpleMeaning: using the ideas of derivative and differential, it is the part of calculus that deals with
  how a function changes as the thing it depends on changes
scope: Also called differential calculus, it deals with how a function changes, by means of derivative
  and differential.
examples:
- She studied the method of fluxions to learn how functions change.
- The method of fluxions treats a function by its derivative and its differential.
