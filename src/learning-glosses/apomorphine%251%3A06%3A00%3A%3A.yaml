simpleMeaning: A weaker drug made from morphine, used to make a person throw up and, in small doses, to
  calm and cause sleep
scope: Doctors reach for this weaker drug when they want a patient to throw up, or to sleep after a small
  dose; it is not the strong pain-killer it comes from.
examples:
- The doctor gave apomorphine to make the patient sick.
- A small dose of apomorphine helped calm the patient.
