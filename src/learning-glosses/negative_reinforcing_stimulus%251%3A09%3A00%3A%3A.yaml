simpleMeaning: Something whose taking away makes an action less likely to happen again.
scope: Something whose taking away makes an action less likely to happen again, also called negative reinforcer;
  not a reward and not a punishment.
examples:
- The loud noise was a negative reinforcing stimulus, and removing it made the shouting less likely.
- A negative reinforcing stimulus works by being taken away after the action.
