simpleMeaning: A brown bird with dark spots, a kind of grouse, that lives on the open grasslands of the
  west of North America
scope: Also called prairie chicken and prairie grouse, this brown bird with dark spots lives on the open
  grasslands of the west of North America, not a farm bird and not a bird of the woods.
examples:
- We watched a prairie fowl rise from the tall grass at dawn.
- Hunters look for prairie fowl on the open grasslands in autumn.
