simpleMeaning: One of several kinds of fungus of the group Scleroderma, with tough-skinned bodies that
  make spores, grow underground, and look like truffles.
scope: People also call it puffball, false truffle, and hard-skinned puffball; it is a fungus with tough-skinned
  bodies that grow underground and look like truffles, not a true truffle.
examples:
- The earthball grows underground and looks like a truffle.
- We dug up an earthball with a tough skin.
