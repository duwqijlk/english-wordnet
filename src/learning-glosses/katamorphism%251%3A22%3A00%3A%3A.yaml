simpleMeaning: In rocks, a change that takes place at or near the earth's surface and breaks down minerals
  made of many parts into simpler ones.
scope: This is a change in rocks that takes place at or near the earth's surface and breaks down minerals
  made of many parts into simpler ones, not a change that takes place deep inside the earth.
examples:
- Katamorphism breaks down complex minerals near the earth's surface.
- The rocks showed katamorphism after long exposure at the surface.
