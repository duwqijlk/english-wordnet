simpleMeaning: Any of many harmless North American animals that squeeze their prey to kill it, feeding
  on other legless reptiles and small mammals.
scope: This is one of many harmless North American animals that squeeze their prey to kill it, feeding
  on other legless reptiles and small mammals; kingsnake is another name for it, not a venomous snake
  and not a large python.
examples:
- The king snake squeezed its prey and fed on other snakes.
- King snakes are harmless North American constrictors.
