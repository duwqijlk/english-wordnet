simpleMeaning: The hollows in the brain and in the cord of nerves down the back stay safe because this
  clear liquid, made in the hollows of the brain, fills them.
scope: Also called cerebrospinal fluid, this clear liquid fills the hollows in the brain and in the cord
  of nerves down the back and keeps them safe.
examples:
- The spinal fluid fills the hollows in the brain and in the cord of nerves down the back.
- The spinal fluid in the cord of nerves down the back guards it too.
