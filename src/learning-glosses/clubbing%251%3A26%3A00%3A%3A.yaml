simpleMeaning: a health problem in which the ends of the fingers and toes become wide and thick; it is
  a sign of heart or lung disease
scope: A health problem seen in the fingers and toes that can be a sign of heart or lung disease, not
  the heart or lung disease itself.
examples:
- The doctor saw clubbing in the man's fingers and checked his heart.
- Clubbing of her toes was a sign that her lungs were not well.
