simpleMeaning: with repeated square notches along the top edge, like the top of a castle wall
scope: 'Also called battlemented, castled, crenelated, and embattled: having repeated square notches like
  the top of a castle wall, not a smooth flat edge and not a pointed roof.'
examples:
- A castellated wall crowned the old fort.
- The castellated edge of the roof gave the house the look of a small castle.
