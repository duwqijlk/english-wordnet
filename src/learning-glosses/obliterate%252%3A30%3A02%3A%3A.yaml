senseId: 'obliterate%2:30:02::'
synsetId: 00479761-v
simpleMeaning: To cross a thing out so it is gone, either by marking it to be cut or by rubbing it away.
scope: Also called kill, this is crossing a thing out so it is gone, not hiding it so it cannot be seen.
examples:
- He obliterated the wrong lines from the draft.
- She obliterated the old address with a thick black pen.
