simpleMeaning: the bone in the wrist that sits between the trapezium bone and the capitate bone
scope: 'Also called os trapezoideum: this is a bone in the wrist, not a four-sided shape and not the trapezium
  bone next to it.'
examples:
- She hurt the trapezoid in her wrist when she fell.
- The doctor pointed to the trapezoid on the X-ray of his hand.
