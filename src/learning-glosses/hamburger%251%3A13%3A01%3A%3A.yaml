simpleMeaning: A sandwich made of a fried flat cake of ground beef in a bun, often with other things added
scope: A fried beef sandwich in a bun; burger is another name for this sense. Not a sandwich of chicken
  or fish, and not beef on its own.
examples:
- We ordered a hamburger with cheese and tomato.
- The hamburger came in a soft bun with lettuce and pickles.
