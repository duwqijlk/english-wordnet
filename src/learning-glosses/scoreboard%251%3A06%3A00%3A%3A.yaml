simpleMeaning: a large board that shows the points in a game or match, and sometimes shows other facts
  too
scope: This is the large board at a game that shows the points, not the points themselves and not a small
  card used to keep count.
examples:
- The crowd looked up at the scoreboard to see who was winning.
- The scoreboard showed the home team ahead by two points.
