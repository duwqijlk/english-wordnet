simpleMeaning: a loud, showy speech said with strong feeling
scope: 'Also called rant and harangue: a loud, showy speech with strong feeling, not a quiet talk or a
  calm statement of facts.'
examples:
- His ranting about the new rules went on for ten minutes.
- We could hear her ranting from the next room, loud and angry.
