simpleMeaning: Soreness and swelling of the tube that carries water out of the body, with no known cause.
scope: Also called nonspecific urethritis; soreness and swelling of the tube that carries water out of
  the body, with no known cause, and not soreness of another part of the body.
examples:
- The doctor said the NSU had no clear cause.
- NSU left him with soreness when he passed water.
