simpleMeaning: a long, thin sea fish that hunts other fish, with a large mouth, a lower jaw that sticks
  out, and long, strong teeth
scope: This is the sea fish itself, a hunter with a long thin body and strong teeth, not a small fish
  that eats only plants.
examples:
- A barracuda swam fast after the smaller fish near the rocks.
- The fisherman feared the barracuda because of its long, sharp teeth.
