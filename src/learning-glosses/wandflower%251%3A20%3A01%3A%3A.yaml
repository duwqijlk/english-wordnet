simpleMeaning: Glossy green leaves, rounded or heart-shaped, turn copper, maroon or purple in autumn on
  this tufted evergreen herb, which lives for years and bears tiny white flowers on spikes.
scope: This is the low, tufted evergreen species with white flower spikes and leaves that colour in autumn;
  the other wandflower is a showy cultivated plant with tawny, purple-spotted flowers.
examples:
- A wandflower spread its glossy leaves across the shaded border.
- We planted wandflower where its autumn colour could be seen from the porch.
