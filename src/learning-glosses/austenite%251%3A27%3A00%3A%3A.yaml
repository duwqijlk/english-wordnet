simpleMeaning: A solid solution of ferric carbide or carbon in iron, which cools to form pearlite or martensite.
scope: This is iron holding carbon right through it, before it cools into pearlite or martensite.
examples:
- The austenite cooled slowly and turned into pearlite.
- When the metal cooled, the austenite turned into pearlite.
