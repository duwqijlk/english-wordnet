senseId: 'inherently%4:02:00::'
synsetId: 00376993-r
simpleMeaning: in a way that belongs to the thing itself, and not to anything added to it
scope: By the very nature of a thing itself, not by chance or by something added from outside.
examples:
- This metal is inherently strong and does not need coating.
- The work is inherently difficult, however it is done.
