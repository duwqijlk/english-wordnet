simpleMeaning: the quality or habit of being late, or of not arriving at the right, usual, or expected
  time
scope: Being late as a quality or habit of a person, not one single late arrival and not slow work in
  general.
examples:
- Her tardiness made her miss the start of every meeting.
- The teacher warned him that his tardiness would be written in the report.
