simpleMeaning: How strong and trusted something is when it is about money, facts, or right and wrong
scope: 'Also called solidness: being strong and trusted about money, facts, or right and wrong, not how
  firm or thick a material thing is.'
examples:
- People trusted the bank because of its solidity.
- The solidity of the evidence helped him win the case.
