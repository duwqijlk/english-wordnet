simpleMeaning: Said of an illness or a patient, starting fast and running a short but hard course
scope: With a rapid onset and a short but severe course, not a mark over a vowel and not a keen mind.
examples:
- His appendicitis was acute and needed surgery at once.
- She was in the acute phase of the illness.
