schema: oewn-learning-gloss-v2
senseId: 'acetonemia%1:26:00::'
synsetId: 14290707-n
simpleMeaning: an abnormal rise in ketone bodies (bits made when the body burns fat) in the blood, as
  in diabetes
scope: Also called ketonemia and ketosis; this is too many ketone bodies in the blood, not too little
  blood sugar and not a blood infection.
examples:
- Her acetonemia showed up in a blood test.
- Acetonemia can occur in people with diabetes.
