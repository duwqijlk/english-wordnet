senseId: 'whistling%1:11:00::'
synsetId: 07414756-n
simpleMeaning: the sound made when something moves very fast, or when steam comes out through a small
  opening
scope: Also called a whistle. This is the sound itself, not the act of making it to call someone and not
  the act of using it to play a tune.
examples:
- The whistling of steam from the kettle filled the small kitchen.
- We heard the whistling of the fast train as it passed the station.
