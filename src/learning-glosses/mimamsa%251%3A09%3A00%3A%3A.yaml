simpleMeaning: One of six accepted schools of thought on rites rooted in the Vedas and Brahmanas, named
  from Sanskrit for thought or reading, unlike Vedanta, which rests mostly on the Upanishads.
scope: A school of thought on rites, not Vedanta, rooted in the Vedas and the Brahmanas.
examples:
- Mimamsa guides the reading of ancient rites.
- Scholars of Mimamsa debate the meaning of the Vedas.
