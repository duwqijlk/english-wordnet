simpleMeaning: A drug that calms and slows the body, often used in sex attacks; sold by law in Europe,
  Mexico and Colombia
scope: Also called flunitrazepam; a calming drug misused in sex attacks, close to other calming drugs
  such as Valium.
examples:
- Rohypnol is a drug that slows the body down.
- Police warned that Rohypnol is used in sex attacks.
