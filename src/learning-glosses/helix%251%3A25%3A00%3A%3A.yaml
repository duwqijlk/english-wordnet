simpleMeaning: A curve that goes round and round a cone or a tube, crossing its length at one fixed slant
  all the way.
scope: Also called a spiral, this is a curve on a tube or a cone that crosses it at one fixed slant, not
  a thing wound in loops.
examples:
- The wire was bent into a helix around the rod.
- Draw a helix on the cylinder, keeping the same slant all the way round.
