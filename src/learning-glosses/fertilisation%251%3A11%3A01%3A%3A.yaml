simpleMeaning: putting plant food or dung on land to make it rich, so plants grow well
scope: 'Also called dressing, fecundation and fertilization: putting plant food or dung on land to make
  it rich, not the joining of male and female cells and not the feeding of animals.'
examples:
- Fertilisation of the field with dung made the wheat grow tall.
- Spring fertilisation with plant food helped the garden grow.
