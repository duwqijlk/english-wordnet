simpleMeaning: A surgeon's tool that holds a laser, used to seal tissue with heat from light.
scope: A surgeon's tool that holds a laser, used to seal tissue with heat from light; not a knife and
  not a lamp.
examples:
- The surgeon used a photocoagulator to seal the small blood vessels.
- A photocoagulator stopped the bleeding in the eye.
