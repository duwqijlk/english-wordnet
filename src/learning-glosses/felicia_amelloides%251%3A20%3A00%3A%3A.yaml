simpleMeaning: A hairy low woody plant from South Africa or Australia, with flowers like daisies that
  have blue outer petals.
scope: 'Also called the blue daisy and the blue marguerite: a hairy low woody plant with blue daisy-like
  flowers, not its near kin Felicia bergeriana, a softly hairy herb.'
