simpleMeaning: A line that is very thin; most often it is a white line on dark cloth
scope: This is the thin line itself, not the cloth with such lines on it and not a suit made from that
  cloth.
examples:
- A thin white pinstripe ran down each leg of his dark trousers.
- Each pinstripe on the dark cloth was white and very thin.
