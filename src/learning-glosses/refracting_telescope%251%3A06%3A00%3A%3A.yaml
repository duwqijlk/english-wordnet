simpleMeaning: By light through lenses you see the picture this big lens, bulging out in the middle, makes
  of far-off things.
scope: This tool uses light and lenses to show far-off things, with a big lens bulging out in the middle
  that makes a picture seen through the lens at the end.
examples:
- The refracting telescope showed the moon through its lens.
- We looked through a refracting telescope at the stars.
