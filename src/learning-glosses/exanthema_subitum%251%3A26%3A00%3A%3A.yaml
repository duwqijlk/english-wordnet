senseId: 'exanthema_subitum%1:26:00::'
synsetId: 14147241-n
simpleMeaning: 'A viral illness of babies and young children: sudden high fever, mild sore throat, then
  a faint pinkish rash a few days later lasting a few hours or days.'
scope: This is the whole illness, with fever first and a rash a few days later, not a rash on its own
  and not measles or rubella, which also bring fever and a rash. It is a medical term, and roseola infantum
  is another name for the same disease.
examples:
- Once the rash appeared, the diagnosis of exanthema subitum was clear.
- Her son had exanthema subitum at eighteen months, and the rash faded within a few days.
