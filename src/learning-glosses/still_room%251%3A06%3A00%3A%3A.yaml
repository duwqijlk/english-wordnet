simpleMeaning: This pantry next to the kitchen, most of all in a large house, is where tea and drinks
  are made and strong drink, preserves, and tea are kept.
scope: Also called stillroom, it is a pantry next to the kitchen, used for tea and drinks and for keeping
  stores.
examples:
- The still room held jars of jam and bottles of wine.
- She went to the still room to make tea.
