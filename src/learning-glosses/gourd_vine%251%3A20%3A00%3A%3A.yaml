simpleMeaning: Any climbing plant of the family Cucurbitaceae that bears fruits with hard outer skins.
scope: 'Also called a gourd: any climbing plant of the family Cucurbitaceae with hard-skinned fruits,
  not a melon vine and not a climbing bean.'
examples:
- The gourd vine climbed over the garden fence.
- Gourd vines bore fruits with hard rinds.
