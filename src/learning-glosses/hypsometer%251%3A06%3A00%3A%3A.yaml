simpleMeaning: A tool that finds how high land is by seeing at what heat water starts to boil
scope: A tool that finds the height of land from the heat at which water boils, not a tool that measures
  height from air pressure and not a tool that measures the heat of water.
examples:
- The surveyor used a hypsometer to find the height of the hill.
- With a hypsometer, she worked out how high the camp stood by boiling water.
