simpleMeaning: An AC electric motor whose turning part is driven by a current created in it by the magnetic
  field of the fixed coil, a process called electromagnetic induction.
scope: Another name for this AC motor is asynchronous motor; it draws its turning part's current from
  the fixed coil's magnetic field rather than from brushes, and a synchronous motor is a different design.
examples:
- The washing machine's induction motor ran smoothly and quietly.
- Most workshop conveyors are driven by an induction motor.
