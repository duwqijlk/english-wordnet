simpleMeaning: a nut tree from the east of the United States, like the tree with loose peeling bark, but
  its nuts are much larger
scope: 'Also called big shagbark, big shellbark hickory, king nut and king nut hickory: a nut tree from
  the east of the United States with much larger nuts than the tree with loose peeling bark, not a small-nut
  tree and not a nut tree from the west.'
examples:
- A big shellbark grew by the river, and its nuts were much larger than the ones from the tree with loose
  bark.
- She gathered nuts from the big shellbark in the east of the United States.
