senseId: 'nitrification%1:22:01::'
synsetId: 13543076-n
simpleMeaning: In this chemical change, a group of one nitrogen and two oxygen atoms goes into a carbon-based
  compound, or takes the place of another group in it
scope: It is the chemical change that puts a group of one nitrogen and two oxygen atoms into a carbon-based
  compound, not the change in soil where bacteria turn dead matter into nitrates and nitrites.
examples:
- Nitrification puts a nitro group into the compound.
- The compound changed by nitrification.
