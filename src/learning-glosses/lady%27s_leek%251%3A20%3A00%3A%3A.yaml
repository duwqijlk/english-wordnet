simpleMeaning: A wild onion of North America, found in many places, with flowers from white to pink.
scope: A wild onion of North America, found in many places, with flowers from white to pink; nodding onion
  and nodding wild onion are other names for this sense, not a garden onion and not a wild garlic.
examples:
- Lady's leek grew in the damp meadow.
- The lady's leek had white flowers.
