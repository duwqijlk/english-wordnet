simpleMeaning: a small piece of cloth used at meals to wipe your mouth and to put over your lap to keep
  your clothes clean
scope: This is the cloth used at the table when you eat, not the cloth worn by a baby to catch waste.
examples:
- He wiped his mouth with his napkin.
- She put her napkin on her lap before she started to eat.
