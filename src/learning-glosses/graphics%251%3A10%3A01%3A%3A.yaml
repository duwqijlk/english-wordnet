simpleMeaning: photos or other pictures printed in a book, magazine, or other printed work
scope: Photos and other pictures printed in a book or magazine, art and artwork being other names for
  this sense, and not the pictures placed in the layout of a book.
examples:
- The publisher was responsible for all the graphics in the book.
- The magazine's graphics were bright and clear.
