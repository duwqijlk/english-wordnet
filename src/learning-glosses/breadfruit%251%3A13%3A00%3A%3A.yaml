simpleMeaning: A large round fruit that may be seedless or have seeds, with bread-like flesh; eaten boiled,
  baked, roasted or ground into flour, and the roasted seeds are like chestnuts.
scope: The fruit as food, not the Pacific tree that produces it.
examples:
- She roasted a whole breadfruit over the fire.
- Breadfruit can be boiled or ground into flour.
