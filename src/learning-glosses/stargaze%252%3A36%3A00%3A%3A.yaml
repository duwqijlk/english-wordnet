senseId: 'stargaze%2:36:00::'
synsetId: 01641175-v
simpleMeaning: to have pleasant thoughts that are not real and to enjoy letting your mind make them up
scope: Also called dream and daydream, this is letting your mind wander while awake, not really looking
  at the stars in the sky.
examples:
- He often stargazes at his desk, lost in a happy daydream about sailing.
- She stargazed for a while, imagining herself as a famous singer.
