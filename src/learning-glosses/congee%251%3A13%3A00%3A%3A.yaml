simpleMeaning: A thin cooked rice dish from China, eaten in the morning.
scope: Also called jook; a thin rice dish from China eaten in the morning, not plain boiled rice and not
  a rice pudding.
examples:
- We had congee with pickles for breakfast.
- She made a pot of congee on cold mornings.
