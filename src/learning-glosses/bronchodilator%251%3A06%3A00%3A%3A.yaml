simpleMeaning: A drug that lets more air reach the lungs by opening the airways.
scope: This drug is used to open the airways so that more air can reach the lungs, not one that narrows
  them.
examples:
- The bronchodilator opened his airways.
- A bronchodilator helps more air reach the lungs.
