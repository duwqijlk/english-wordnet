simpleMeaning: How much stuff, fuel, power and wear on tools and machines goes into making one thing
scope: How much stuff, fuel and power goes into making one thing, also called consumption of materials,
  not the cost of a whole batch and not the price a thing sells for.
examples:
- The material intensity of the plant fell when it used less fuel per car.
- Engineers track material intensity to see how much stuff each unit of production needs.
