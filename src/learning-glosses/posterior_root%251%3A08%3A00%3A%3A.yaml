simpleMeaning: one of a pair of roots of a spine nerve, the one that leaves the cord at the back and is
  built of threads that bring in feeling
scope: 'Also called a dorsal horn, a dorsal root, or a posterior horn: the back root of a spine nerve
  that brings in feeling, not the front root that sends out orders to move.'
examples:
- The posterior root brings feeling from the hand to the cord.
- A posterior root was cut, so feeling in the leg was lost.
