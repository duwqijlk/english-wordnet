simpleMeaning: a drink with alcohol from Japan, made from the white grain eaten with meals in Asia and
  left to turn into alcohol, usually served hot
scope: 'Also called sake and saki: a Japanese drink with alcohol made from rice, not a drink made from
  grain with hops and not a drink made from grapes.'
examples:
- We drank rice beer with our meal, served hot in small cups.
- The rice beer was warm and came in a little jug.
