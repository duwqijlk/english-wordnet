simpleMeaning: a singer who takes the lead part in a sung musical play
scope: 'Also called opera star: a singer in the lead part of a sung musical play, not a singer in the
  chorus and not a famous actor in spoken plays.'
examples:
- The operatic star took the lead in the new work.
- An operatic star sang at the opening night.
