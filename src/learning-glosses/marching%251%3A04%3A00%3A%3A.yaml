simpleMeaning: the act of walking with regular steps, especially as part of a procession (a line of people
  moving together in a formal way)
scope: 'Also called march: the act of walking with regular, even steps, especially as part of a procession,
  not ordinary walking.'
examples:
- We heard the sound of marching outside the hall.
- The marching of the soldiers went on all morning.
