senseId: 'dermatomycosis%1:26:00::'
synsetId: 14205430-n
simpleMeaning: An infection of the skin caused by a fungus, most of all on wet parts of the body under
  clothes
scope: This is an infection of the skin caused by a fungus, most of all on wet parts of the body under
  clothes; dermatophytosis is another name for this sense. Not an infection caused by germs and not dry
  skin.
examples:
- Dermatomycosis made the skin between his toes sore and itchy.
- She was treated for dermatomycosis after the rash spread under her clothes.
