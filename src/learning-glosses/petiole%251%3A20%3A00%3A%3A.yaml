simpleMeaning: The thin stalk that joins the flat part of a leaf to the rest of the plant.
scope: The thin stalk that joins the flat part of a leaf to the rest of the plant; leafstalk is another
  name for this sense, not the flat part itself and not a branch.
examples:
- The petiole snapped when she bent the leaf.
- A long petiole held the leaf away from the stem.
