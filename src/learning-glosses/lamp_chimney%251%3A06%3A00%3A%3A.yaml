simpleMeaning: Glass shaped into a tube stands round the short string that burns in a light that runs
  on oil
scope: 'Another name for a chimney: a glass tube round the wick of an oil lamp, not the brick tube that
  takes smoke from a fire.'
examples:
- She wiped the soot from the lamp chimney.
- A crack in the lamp chimney made the flame burn unevenly.
