simpleMeaning: A deep, clear knowing of holy things that comes from God.
scope: A deep, clear knowing of holy things that comes from God, with light as another name for this sense,
  and not a painting in a book or light falling on a surface.
examples:
- The saint prayed for illumination in her work.
- He spoke of the illumination that had come to him in prayer.
