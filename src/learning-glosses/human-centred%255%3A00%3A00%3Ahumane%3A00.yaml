simpleMeaning: The well-being of people is what matters, and care for people shapes how things are done
scope: 'Another name for this is human-centered, also called humanitarian, humanistic and humanist: it
  puts people first, not profit or machines.'
examples:
- The human-centred charity works to ease suffering in poor villages.
- A human-centred boss listens to staff before making changes.
