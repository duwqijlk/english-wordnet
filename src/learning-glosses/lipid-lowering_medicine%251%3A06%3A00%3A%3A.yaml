simpleMeaning: a drug that brings down blood cholesterol by blocking the body chemical that makes cholesterol
scope: A drug that brings down blood cholesterol by blocking the body chemical that makes it; statin,
  statin drug and lipid-lowering medication are other names for this sense, not a drug for blood pressure
  and not a change in diet alone.
examples:
- Her doctor gave her a lipid-lowering medicine for her high cholesterol.
- The lipid-lowering medicine brought his cholesterol down within weeks.
