simpleMeaning: The upper lip gets its blood from this side tube, which leaves the face tube.
scope: Also called superior labial artery, it is the face tube's side branch that feeds the upper lip.
examples:
- The arteria labialis superior carries blood to the upper lip.
- A cut on the upper lip bled from the arteria labialis superior.
