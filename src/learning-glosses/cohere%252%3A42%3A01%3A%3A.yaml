simpleMeaning: To bring things together into one ordered whole that looks right.
scope: To bring things together into one ordered whole that looks right; not to hold together with parts
  joined in sense so the whole looks right.
examples:
- Faith can cohere a scattered people.
- Their plan cohered the team into one body.
