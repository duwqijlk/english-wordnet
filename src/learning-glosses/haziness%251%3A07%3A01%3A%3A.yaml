simpleMeaning: A state of being hard to see through, caused by fine mist or steam in the air.
scope: Cloudiness in the air from fine mist or steam, also called mistiness; not thick fog and not smoke.
examples:
- The haziness over the valley made the hills look faint.
- Morning haziness cleared by ten o'clock.
