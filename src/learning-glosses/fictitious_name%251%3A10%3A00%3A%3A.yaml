simpleMeaning: In law, a firm may trade under a title other than its legal one, which is the title written
  in its founding papers
scope: 'Also called an assumed name: in law, a title a firm trades under that is not the title written
  in its founding papers, and not a false name used by a person.'
examples:
- The shop traded under a fictitious name different from the one on its papers.
- They filed the fictitious name with the state before opening.
