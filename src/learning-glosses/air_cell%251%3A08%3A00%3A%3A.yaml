simpleMeaning: At the ends of the smallest breathing tubes in the lungs, where the tubes widen, a tiny
  pouch takes in breath
scope: Also called an alveolus or an air sac, this is a tiny pouch deep in the lungs where the smallest
  breathing tubes widen at their ends.
examples:
- The air cell at the end of each tiny tube holds the breath we take in.
- Air cells in the lungs filled with breath as she breathed in.
