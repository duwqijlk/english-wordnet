simpleMeaning: a reactor in which atomic nuclei split in a controlled way to release energy
scope: A nuclear power reactor, also called an atomic pile, atomic reactor or chain reactor, not a heap
  of things, a support post driven into the ground, or a battery of cells.
examples:
- Engineers started up the experimental pile to test the new fuel rods.
- The first pile was built from stacked graphite blocks in a squash court.
