simpleMeaning: A trait that a changed bit of the stuff passed on from parents would show can be held back
  by another bit of it.
scope: Suppresser, suppresser gene, and suppressor are other names for this bit of the stuff passed on
  from parents that holds back what another bit shows.
examples:
- A suppressor gene in the plant held back the pale colour that the changed gene would have shown.
- The suppressor gene kept the new trait from showing in the young mice.
