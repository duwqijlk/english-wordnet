simpleMeaning: a bush or small tree with quite small sweet-smelling white flowers, found in large numbers
  in the southeast of the United States
scope: This is a bush or small tree with quite small sweet-smelling white flowers, also called swamp bay
  and sweet bay, not the northwestern laurel with small purple flowers and not a tree grown for its leaves.
examples:
- The swamp laurel was in flower along the creek.
- Swamp laurels grow thick in the low woods of the southeast.
