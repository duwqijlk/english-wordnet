simpleMeaning: a person who puts great energy and a strong wish into what they do, especially a salesman
scope: This is a person who puts great energy and a strong wish into what they do, especially in selling;
  it is not the small animal that digs underground and not the land tortoise also called by this name.
examples:
- He is a real gopher, always full of energy when selling cars to customers.
- The gopher at the car shop sold three cars before lunch and still wanted more work.
