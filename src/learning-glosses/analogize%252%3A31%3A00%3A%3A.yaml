senseId: 'analogize%2:31:00::'
synsetId: 00654954-v
simpleMeaning: to draw an analogy, setting one thing beside another to show what they share
scope: Also called analogise; to set one thing beside another to show a likeness, not to say they are
  the same thing and not to list their differences.
examples:
- She analogized the brain to a computer.
- The writer analogized the storm to a wild beast.
