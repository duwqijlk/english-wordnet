simpleMeaning: a long thin strand that takes messages away from the body of a nerve cell
scope: 'Another name for axon: a long strand that takes messages away from a nerve cell, not the short
  strands that bring messages in and not the body of the cell itself.'
examples:
- The axone carried the message from the nerve cell to the muscle.
- Each axone leaves the body of its nerve cell and runs to another cell.
