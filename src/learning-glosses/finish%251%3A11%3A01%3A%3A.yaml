senseId: 'finish%1:11:01::'
synsetId: 07347762-n
simpleMeaning: The state of being completely beaten and ruined, as when one side in a conflict loses.
scope: The ruin of a person or of one side in a struggle only; not the taste left by wine, not the time
  when something ends, not a state of flawless quality, not the place where a race or journey ends, not
  the fixed event that closes a competition, not any other event that ends something, not the act of completing
  something, and not any verb use (ending something, finally doing something, coming to an end, coating
  a surface, eating all the food, or ending a relationship).
examples:
- Booze will be the finish of him.
- It was a fight to the finish, and only one side walked away.
