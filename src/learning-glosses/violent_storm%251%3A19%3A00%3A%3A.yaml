simpleMeaning: Winds of 64 to 72 knots, rain, snow, or hail, thunder, and lightning make up this fierce
  weather at force 11 on the Beaufort scale.
scope: Also called storm, it is one of the fierce kinds of weather, at force 11 on the Beaufort scale,
  with winds of 64 to 72 knots and rain, snow, or hail, thunder, and lightning.
examples:
- The violent storm brought winds of 70 knots and rain.
- The violent storm's winds reached 70 knots.
