simpleMeaning: A small tree of tropical America that keeps its leaves all year and bears fruit that can
  be eaten; it is used chiefly as a base for grafting.
scope: This is a small tree of tropical America with fruit that can be eaten, also called pond-apple tree
  and pond apple; not a tall forest tree and not a tree grown for timber.
examples:
- Annona glabra bore fruit that we could eat.
- The gardener used Annona glabra as a base for grafting.
