simpleMeaning: With three parts to its acid, this salt helps soaps and wash powders clean.
scope: This salt is put in soaps and wash powders to help them clean, not a soap itself and not the acid
  it comes from.
examples:
- Sodium tripolyphosphate in the soap helped it clean better.
- The wash powder with sodium tripolyphosphate cleaned better.
