simpleMeaning: dried grains or kernels of a cereal, used to feed animals or ground into meal
scope: This is the dried grain of cereal plants, used as feed or ground into meal, not the plants growing
  in a field and not the spirit distilled from grain.
examples:
- The farmer stored the corn in a dry bin for winter feed.
- This corn is ground into meal for the cattle.
