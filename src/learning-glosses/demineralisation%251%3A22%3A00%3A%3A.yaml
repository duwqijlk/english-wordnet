simpleMeaning: The taking of minerals and mineral salts out of a liquid, above all out of water
scope: Taking minerals and their salts out of a liquid, above all water, also called demineralization;
  not adding minerals and not simple filtering.
examples:
- Demineralisation leaves the water free of salts.
- The plant uses demineralisation to clean its water.
