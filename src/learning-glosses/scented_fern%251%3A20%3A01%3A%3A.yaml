simpleMeaning: A plant of eastern North America with pale green feathery leaves and a smell like hay.
scope: A plant of eastern North America with pale green feathery leaves and a smell like hay, also called
  boulder fern, hay-scented, and hay-scented fern; not the sweet-smelling African fern and not the Eurasian
  herb of the same name.
examples:
- The scented fern smells faintly of hay.
- Scented fern grows in the damp woods of the east.
