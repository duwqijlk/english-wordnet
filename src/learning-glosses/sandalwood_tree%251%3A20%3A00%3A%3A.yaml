simpleMeaning: This parasitic tree from Indonesia and Malaysia is prized for fragrant, tightly grained
  yellow heartwood that keeps insects away, and chests are among the things made from it.
scope: Another name for true sandalwood, the parasitic tree of Indonesia and Malaysia valued for fragrant,
  insect-repelling heartwood; not the other trees also called sandalwood.
examples:
- The sandalwood tree takes water and nutrients from the roots of nearby plants.
- Carpenters prize the heartwood of the sandalwood tree for small carved boxes.
