simpleMeaning: After some kinds of surgery, patients are given food only as drinks or strained dishes,
  with custards or puddings as well.
scope: Food in drink or strained form given after surgery, not ordinary solid meals.
examples:
- After her operation she stayed on a liquid diet of soups and milk drinks.
- His liquid diet was mostly clear soup, custard, and milk.
