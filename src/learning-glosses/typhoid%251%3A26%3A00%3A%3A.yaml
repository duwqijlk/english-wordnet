simpleMeaning: A serious infection that makes the intestines swollen and full of open sores, caused by
  a germ called Salmonella typhosa taken in with food or water
scope: This illness is also called enteric fever and typhoid fever; it is a gut infection from food or
  water, not a mild stomach upset.
examples:
- He caught typhoid from drinking unsafe water while travelling.
- Typhoid made her very ill with a high fever and severe stomach pain.
