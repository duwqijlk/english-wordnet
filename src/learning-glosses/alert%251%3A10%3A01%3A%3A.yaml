simpleMeaning: A sign that goes off by itself, most often a sound, to warn people of danger
scope: Also called alarm, this is a sign that goes off by itself to warn of danger, not a warning that
  makes a person watchful, and not the act of warning someone.
examples:
- The alert sounded through the building when smoke was found.
- A loud alert warned the crew that the water was rising.
