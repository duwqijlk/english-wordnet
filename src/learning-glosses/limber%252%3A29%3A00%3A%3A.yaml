synsetId: 00100891-v
simpleMeaning: to make a part of the body able to bend and move more easily
scope: This is making a body part ready to bend and move easily. It is not being able to bend easily by
  nature, and not joining a cart to a gun.
examples:
- The violist limbered her wrists before the concert.
- He limbered his back with slow bends before the run.
