simpleMeaning: The ninth strand from the brain to the head carries taste and feeling from the tongue's
  back and throat, lifts throat and voice-box muscles, reaches a cluster near the ear.
scope: The ninth cranial nerve, the one serving the throat and the back of the tongue, also called nervus
  glossopharyngeus; not the vagus, which runs on into the chest and belly.
examples:
- The glossopharyngeal nerve carries taste from the back of the tongue.
- Damage to the glossopharyngeal nerve can make swallowing difficult.
