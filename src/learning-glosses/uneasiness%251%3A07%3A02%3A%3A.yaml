simpleMeaning: how a person comes across when they do not feel at ease
scope: 'Also called unease or disquiet: the way a person shows they are not at ease, not the embarrassment
  of being watched and not anxious feelings that make you tense.'
examples:
- His uneasiness showed in the way he kept shifting in his chair.
- There was a quiet uneasiness about her as she waited to be called.
