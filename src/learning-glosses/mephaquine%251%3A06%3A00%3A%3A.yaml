senseId: 'mephaquine%1:06:00::'
synsetId: 03748219-n
simpleMeaning: A drug against malaria that works when cases do not get better with chloroquine; it is
  said to harm the mind and nerves in some people
scope: Also called mefloquine, mefloquine hydrochloride and Lariam; a malaria drug for cases chloroquine
  does not cure, not a drug for fevers in general and not a sleeping drug.
examples:
- The doctor gave him Mephaquine when chloroquine failed.
- Mephaquine is used when chloroquine does not work.
