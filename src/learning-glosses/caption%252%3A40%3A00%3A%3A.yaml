senseId: 'caption%2:40:00::'
synsetId: 02328866-v
simpleMeaning: To add a line of words to a photo or a drawing, saying what it shows.
scope: To add words to a photo or drawing, not the words shown under a film, not a quibble about words,
  and not a short note that goes with a picture.
examples:
- She captioned the photo of the old bridge with its name and date.
- He captioned each drawing in the book with a line about what it showed.
