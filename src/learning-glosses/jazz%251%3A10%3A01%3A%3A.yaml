simpleMeaning: dance music of the 1920s that many people liked, in the New Orleans style but played by
  a big band
scope: Dance music of the 1920s played by a big band, not the New Orleans style played by small groups
  and not empty talk.
examples:
- The band played jazz for the dancers all night.
- They danced to jazz at the club in 1928.
