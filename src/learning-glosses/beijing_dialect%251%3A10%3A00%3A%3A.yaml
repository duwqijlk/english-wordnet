simpleMeaning: The form of Chinese spoken in the capital, taken as the official tongue of all China.
scope: This is the form of Chinese spoken in Beijing, taken as the official tongue of all China; Mandarin,
  Mandarin Chinese and Mandarin dialect are other names for it, and it is not a form of Chinese spoken
  only in Beijing or a tongue of another country.
examples:
- Beijing dialect is the official tongue of all China.
- She speaks Beijing dialect at home and at school.
