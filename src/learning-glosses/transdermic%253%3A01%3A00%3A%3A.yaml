schema: oewn-learning-gloss-v2
senseId: 'transdermic%3:01:00::'
synsetId: 02955664-a
simpleMeaning: Through skin that is not broken; of drugs put straight on the skin, as creams or ointments,
  or in slow-release skin patches
scope: Through skin that is not broken, of drugs put on the skin; percutaneous, transcutaneous and transdermal
  are other names for this sense, and not through a cut in the skin or a drug taken by mouth.
examples:
- A transdermic patch was put on her arm.
- Transdermic drugs pass through unbroken skin.
