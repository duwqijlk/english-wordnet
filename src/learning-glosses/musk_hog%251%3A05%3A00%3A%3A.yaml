simpleMeaning: Wild animals like pigs that live in groups and are out at night in North and South America.
scope: Wild animals like pigs that live in groups and are out at night in the Americas; peccary is another
  name for them, not farm pigs and not wild pigs that live alone.
examples:
- A musk hog rooted in the dry leaves at dusk.
- Musk hogs moved through the scrub in a noisy group.
