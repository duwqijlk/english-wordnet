simpleMeaning: to bend your back forward and down from the waist
scope: Bending the back forward and down from the waist, also called bow and also called bend. It is not
  standing straight up, and it is not sitting down.
examples:
- He crouched down to pick up the girl's bag.
- She crouched forward to look under the low shelf.
