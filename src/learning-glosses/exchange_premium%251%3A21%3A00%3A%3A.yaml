simpleMeaning: A fee charged for changing one kind of money into another.
scope: 'Also called agio, agiotage and premium: the money paid for changing one kind of money into another,
  not the amount changed and not a tax on the change.'
examples:
- The bank charged an exchange premium when she changed dollars into euros.
- He paid a small exchange premium to swap his pounds for yen.
