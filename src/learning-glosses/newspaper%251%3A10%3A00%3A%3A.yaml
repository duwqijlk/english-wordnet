simpleMeaning: folded printed sheets that come out every day or every week, with news, articles and ads
  in them
scope: This is the set of folded sheets with news that comes out every day or week, also called paper.
  It is not just one copy as a thing to hold, and not the company that makes it.
examples:
- I read the newspaper every morning to see the news.
- Our local newspaper comes out once a week.
