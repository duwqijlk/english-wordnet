simpleMeaning: a quality or idea that belongs to a thing or person and helps tell what it is
scope: A quality or idea that belongs to a thing or person, not a way of telling things apart by a set
  mark and not the act of saying a thing came from someone.
examples:
- Honesty is an attribute of a good friend.
- Size is an attribute of the box.
