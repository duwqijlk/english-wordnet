simpleMeaning: A sickness in which a part of the body swells, turns red, and feels hot
scope: A sickness marked by swelling and heat in the body, not an infection and not a sickness without
  swelling.
examples:
- Arthritis is an inflammatory disease that makes the joints swell.
- The doctor treated her inflammatory disease with rest and medicine.
