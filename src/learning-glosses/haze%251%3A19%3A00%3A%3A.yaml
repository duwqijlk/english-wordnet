simpleMeaning: tiny drops of water, dust or smoke in the air that make it hard to see far
scope: Water, dust or smoke in the air that you cannot see through well, not confusion in the mind and
  not the act of making someone do painful or shameful tasks.
examples:
- A thin haze hung over the fields in the early morning.
- Through the haze, we could just see the lights of the town.
