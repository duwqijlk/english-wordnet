simpleMeaning: rude and impatient in manner, speaking in an abrupt way that expects others to obey without
  question
scope: This sense describes a person's curt manner in speech, not something lasting only a little time
  or something not long enough.
examples:
- The manager was famously short with anyone who arrived late.
- He can be quite short when he is under pressure, snapping at anyone who asks a question.
