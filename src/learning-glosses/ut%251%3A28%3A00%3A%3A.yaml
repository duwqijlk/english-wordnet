simpleMeaning: The time at the zero line of longitude through Greenwich in England, the same all over
  the world.
scope: Also called universal time, GMT, Greenwich Mean Time, Greenwich Time and UT1; not the sung syllable
  of the same spelling.
examples:
- When it is 12:00 UT, clocks in Greenwich read noon.
- Pilots set their watches by UT.
