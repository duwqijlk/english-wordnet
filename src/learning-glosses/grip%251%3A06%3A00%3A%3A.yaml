simpleMeaning: a bag with a long, straight-sided shape that you can carry, for carrying clothes
scope: 'Also called bag, and another name for suitcase: a bag you carry clothes in. Not the hair pin,
  and not holding something tight.'
examples:
- He carried his grip onto the train and put it over his seat.
- She packed her dresses into her grip the night before the trip.
