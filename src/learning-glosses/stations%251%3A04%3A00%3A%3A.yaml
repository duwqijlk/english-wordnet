simpleMeaning: In the Roman Catholic Church, a rite of fourteen prayers said before fourteen images showing
  Jesus on his way from the house of Pilate to the cross at Calvary.
scope: Not the rosary, nor any other set of prayers; also called the Stations of the Cross.
examples:
- The Stations are prayed during Lent.
- The old church had the Stations carved in wood.
