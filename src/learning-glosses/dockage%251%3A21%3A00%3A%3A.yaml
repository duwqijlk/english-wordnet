simpleMeaning: money that a ship must pay to stay tied up at a port
scope: A charge for a ship to stay at a port, also called a docking fee, and not the act of tying up a
  ship or the landing of a ship in a harbour.
examples:
- The dockage for the freighter came to three hundred dollars a day.
- They paid the dockage before the ship could unload.
