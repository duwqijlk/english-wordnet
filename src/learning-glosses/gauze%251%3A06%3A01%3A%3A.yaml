simpleMeaning: In medicine, white cotton cloth with a plain weave, used to cover wounds
scope: In medicine, cloth for covering wounds, not a loose open net of see-through fabric.
examples:
- The nurse wrapped the cut in clean gauze.
- She changed the gauze on his wound twice a day.
