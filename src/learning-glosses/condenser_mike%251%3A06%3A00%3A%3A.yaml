simpleMeaning: A sound pick-up built round an electric part, with one flat piece fixed and the other,
  which forms a thin sheet, moving as sound waves hit it.
scope: This sound pick-up is also called a capacitor microphone, a capacitor mike, or a condenser microphone.
examples:
- He plugged the condenser mike into the recorder.
- The condenser mike picked up the soft sound of the guitar.
