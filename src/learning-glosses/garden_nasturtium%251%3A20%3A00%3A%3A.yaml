simpleMeaning: a fast-growing plant that lives one year and climbs, with big flowers in all shades of
  orange and seeds that are pickled and used like capers
scope: A climbing plant with big orange flowers, not a rose and not a vine grown only for fruit.
examples:
- The garden nasturtium climbed the fence with bright orange flowers.
- She pickled the seeds of the garden nasturtium to use like capers.
