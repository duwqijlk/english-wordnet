simpleMeaning: something a person is able to do because they have been taught and have had practice
scope: This is a skill learned by training, not a thing someone has got and not the act of getting something.
examples:
- Reading is an acquisition that takes years of training.
- Her chief acquisition was the ability to speak three languages.
