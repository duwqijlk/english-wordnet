simpleMeaning: The faith and worship of any of the east Catholic Churches based in Constantinople or Antioch
  or Alexandria or Moscow or Jerusalem
scope: This sense covers the faith and worship of the east Catholic Churches in five old cities, and stands
  apart from other Christian traditions by those churches and their centres in Constantinople, Antioch,
  Alexandria, Moscow and Jerusalem.
examples:
- Eastern Catholicism is based in Constantinople and other old cities.
- Eastern Catholicism covers the churches of Constantinople, Antioch, Alexandria, Moscow and Jerusalem.
