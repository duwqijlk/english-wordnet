simpleMeaning: A thickly tufted plant like a fern, from the southwestern United States to Peru, that rolls
  into a tight ball when dry and opens and grows again when wet
scope: Also called the resurrection plant and Selaginella lepidophylla; a plant that curls up when dry,
  not the small grey desert plant from Asia that does the same.
examples:
- The rose of Jericho in our pot curled into a tight ball during the dry weeks.
- After the rain, the rose of Jericho opened up and began to grow again.
