simpleMeaning: An infection caught by breathing in or swallowing tiny germs, shown by fever and small
  sores, usually in the lungs but in bad cases in other parts of the body.
scope: Also called tuberculosis and T.B.; an infection of the lungs that can spread to other parts of
  the body in bad cases, not a cold or flu, and not the unit of information also called TB.
examples:
- TB spreads when a sick person coughs and others breathe in the germs.
- He was treated for TB after a fever and a sore spot showed in his lung.
