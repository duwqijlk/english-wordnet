simpleMeaning: A thick grass that comes back year after year, growing in the west of North America
scope: This is a thick grass of the west of North America that comes back year after year; giant ryegrass
  and Leymus condensatus are other names for this sense, and its nearest rivals are other grasses of the
  west.
examples:
- Elymus condensatus grows on the dry hills of the west.
- The rancher cut Elymus condensatus for hay.
