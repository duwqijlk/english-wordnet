simpleMeaning: To do with the -COOH part of a chemical, or holding that part.
scope: To do with the -COOH part of a chemical, or holding that part; carboxylic is another name for this
  sense, not the -COOH part itself and not a sour liquid.
examples:
- The carboxyl group gives the acid its sour taste.
- A carboxyl compound holds the -COOH part.
