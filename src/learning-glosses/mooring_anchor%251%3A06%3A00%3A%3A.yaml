simpleMeaning: A buoy for tying boats, or a channel marker, is held in place by this weight
scope: A weight that holds a buoy or a channel marker in place in the water, not the anchor that holds
  a ship and not a buoy itself.
examples:
- The mooring anchor kept the buoy in place through the storm.
- Divers checked the mooring anchor holding the channel marker.
