simpleMeaning: flat and even, sitting at right angles to a line that hangs straight down
scope: This describes a flat surface, not a tool, a floor of a building, or a non-physical layer.
examples:
- Make sure the table is level before you set the glasses on it.
- The ground here is not level, so the tent leans to one side.
