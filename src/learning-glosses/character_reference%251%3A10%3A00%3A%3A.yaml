simpleMeaning: A written word from a past boss to a future boss, telling what a worker can do and how
  steady they are.
scope: 'Also called character and reference: a formal word about a worker from a past employer to a future
  one.'
examples:
- Requests for character references are all too often answered evasively.
- She asked her old boss for a character reference before she applied for the new job.
