simpleMeaning: In law, the act of passing land on only within one line of a family, by turning full ownership
  into a limited right
scope: In law, the act of tying land to one family line, not the verb for what a step brings with it and
  not ordinary passing on of land.
examples:
- The entail of the estate kept the land in the family for years.
- An entail on the farm meant it could not be sold outside the family.
