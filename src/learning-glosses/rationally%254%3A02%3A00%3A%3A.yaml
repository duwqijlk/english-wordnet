simpleMeaning: in a way that uses clear thinking and good reasons, not feelings
scope: Done with clear thinking and good reasons; not done from feelings alone, and not done without thinking
  at all.
examples:
- We must act rationally and check the facts before we decide.
- She thought rationally about the problem and found a calm answer.
