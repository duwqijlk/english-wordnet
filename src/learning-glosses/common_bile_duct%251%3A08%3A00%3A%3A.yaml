senseId: 'common_bile_duct%1:08:00::'
synsetId: 05394188-n
simpleMeaning: a tube made by the joining of the tubes from the liver and the gall bladder, which opens
  into the first part of the gut
scope: A tube made where the liver tube and the gall bladder tube join; bile duct is another name for
  this sense; not a blood tube, and not a tube in the chest.
examples:
- The common bile duct carries bile into the gut.
- A stone blocked the common bile duct.
