simpleMeaning: Dirty stuff sent into the sky by a factory, making what people breathe unclean.
scope: Dirty stuff sent into the sky by a factory, not dirt in water and not smoke from cars or home fires.
examples:
- Industrial air pollution hung over the town.
- The new rules aim to cut industrial air pollution.
