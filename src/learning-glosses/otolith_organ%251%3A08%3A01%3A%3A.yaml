simpleMeaning: Either of two parts in the inner ear of animals with backbones, the utricle or the saccule.
scope: Either of two parts in the inner ear of animals with backbones, the utricle or the saccule; not
  the eardrum and not the outer ear.
examples:
- The otolith organ is one of two small parts in the inner ear.
- An otolith organ sits in the inner ear of the fish.
