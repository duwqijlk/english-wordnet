simpleMeaning: following what Jesus taught or showing the qualities and spirit of Jesus in the way you
  live
scope: Describes following Jesus in teaching and in way of living; not the noun for a person who follows
  Jesus, and not just having a link to a church.
examples:
- She lived a Christian life, helping others with kindness.
- His Christian love for others led him to forgive them.
