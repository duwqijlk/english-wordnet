simpleMeaning: to speak with the sound coming through the nose
scope: To speak with the sound coming through the nose; nasalise is another name for this sense, not to
  shape a sound with the soft part at the back of the mouth lowered, and not to speak in a plain voice.
examples:
- In this part of the country, people tend to nasalize.
- He began to nasalize after his cold set in.
