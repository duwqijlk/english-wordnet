simpleMeaning: The glottis is formed when the two lower folds meet, and air from the lungs passing between
  them makes a tone
scope: It is also called inferior vocal cord, true vocal cord, and true vocal fold, and it is one of the
  two lower folds, not the upper folds above them.
examples:
- The inferior vocal fold closed when she began to sing.
- Air from the lungs passed between the inferior vocal folds to make the tone.
