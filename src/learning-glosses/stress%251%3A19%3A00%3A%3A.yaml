simpleMeaning: In physics, a force that pushes or pulls on a body and can change its shape.
scope: This is a force on a physical object, not mental or emotional strain, and not special emphasis
  on a point.
examples:
- Engineers measured the stress on the bridge under heavy loads.
- The metal failed because the stress exceeded its limit.
