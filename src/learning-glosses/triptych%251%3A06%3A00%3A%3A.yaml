simpleMeaning: A work of art, a painting or carving on three panels, especially one made for an altar,
  usually with the panels joined by hinges.
scope: For a three-panel painting or carving, often an altarpiece with hinged panels.
examples:
- The triptych stood above the altar.
- She studied the triptych's three painted panels.
