senseId: 'scintillating_scotoma%1:26:00::'
synsetId: 14580471-n
simpleMeaning: one place in the sight where seeing grows weak, ringed with shimmering coloured lights,
  which for many people comes just before a migraine
scope: 'Also called flittering scotoma: a place in the sight where seeing grows weak, ringed with shimmering
  coloured lights, which for many people comes just before a migraine; not a blind spot that stays, and
  not the migraine pain itself.'
examples:
- The scintillating scotoma made a patch of her sight go weak, ringed with shimmering lights.
- When a scintillating scotoma appears, a migraine often follows.
