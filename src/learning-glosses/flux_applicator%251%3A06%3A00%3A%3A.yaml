simpleMeaning: a tool that spreads a chemical on metal to clean it so solder sticks when two pieces are
  joined
scope: A tool for spreading the chemical that cleans metal before soldering, not a tool for spreading
  glue and not the solder itself.
examples:
- He used a flux applicator before soldering the wires.
- The flux applicator spread the chemical over the joint.
