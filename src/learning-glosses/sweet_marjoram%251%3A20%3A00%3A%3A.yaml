simpleMeaning: A plant with a pleasant smell, from Europe, that grows wild round the Mediterranean and
  in Turkey, but is not widespread in Europe.
scope: This is a plant with a pleasant smell from round the Mediterranean, also called knotted marjoram,
  and not oregano or thyme.
examples:
- She grew sweet marjoram in a pot by the door.
- The sweet marjoram gave the soup a warm smell.
