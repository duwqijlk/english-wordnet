synsetId: 05261025-n
simpleMeaning: The nose's moist lining carries on into the paired hollows in the facial bones, which share
  that same unbroken surface.
scope: One of three interchangeable names for these paired facial cavities, alongside nasal sinus and
  sinus paranasales; it is not the blood channels inside the skull that are also called sinuses, nor the
  nasal cavity itself.
examples:
- A blocked paranasal sinus can cause pressure behind the eyes.
- The surgeon drained the infected paranasal sinus.
