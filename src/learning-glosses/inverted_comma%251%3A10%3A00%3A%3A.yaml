simpleMeaning: In writing, a mark put round words to show they come from someone else
scope: A mark in writing that shows words come from someone else, also called quote or quotation mark;
  not a full stop and not a mark that ends a sentence.
examples:
- She opened the quote with an inverted comma.
- The inverted comma shows the words are not the writer's own.
