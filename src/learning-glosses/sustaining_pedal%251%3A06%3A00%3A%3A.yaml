synsetId: 04374098-n
simpleMeaning: A foot lever on a piano that lifts the soft cloths off the strings, so the strings keep
  on sounding.
scope: A foot lever on a piano that lifts the soft cloths off the strings so they keep on sounding; also
  called loud pedal; not a foot lever that makes the sound softer and not a key played by the fingers.
examples:
- She pressed the sustaining pedal so the notes rang on.
- The sustaining pedal lifts the dampers from the strings of the piano.
