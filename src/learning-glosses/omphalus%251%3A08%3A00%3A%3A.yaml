simpleMeaning: The cord that joined a baby to its mother before birth leaves a mark where it was joined
  to the belly
scope: The mark where the cord that joined a baby to its mother was fixed, also called navel, belly button
  and omphalos; not a cut from an injury and not the cord itself.
examples:
- The nurse cleaned the newborn's omphalus each morning.
- His omphalus was hidden beneath his shirt.
