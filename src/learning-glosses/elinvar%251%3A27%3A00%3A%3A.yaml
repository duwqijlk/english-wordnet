scope: A kind of steel used for watch springs since its spring stays the same over a wide range of heat
  and cold; chrome-nickel steel is another name for this sense, not ordinary steel and not a watch case
  metal.
examples:
- Elinvar keeps a watch spring true in heat and cold.
- Watchmakers prize Elinvar for its steady spring.
