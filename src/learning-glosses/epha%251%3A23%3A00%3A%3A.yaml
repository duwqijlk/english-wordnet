simpleMeaning: A measure for dry goods used long ago by the Hebrews, holding about as much as a bushel
scope: 'Also called ephah: a measure for dry goods used long ago by the Hebrews, holding about as much
  as a bushel, not a measure for liquids and not a modern unit.'
examples:
- The merchant measured out an epha of barley for the buyer.
- An epha held about as much grain as a bushel.
