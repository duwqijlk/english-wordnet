simpleMeaning: To treat lack of good food, or to build up muscle, a person eats lots of the food that
  builds flesh, from plants and animals
scope: A way of eating rich in the food that builds flesh, to treat lack of good food or build up muscle,
  not a way of eating that cuts food out to lose weight.
examples:
- After the illness, the doctor put him on a high-protein diet.
- A high-protein diet helped her build up muscle for the race.
