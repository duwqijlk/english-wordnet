simpleMeaning: A band of cloth worn round the waist, as on a baby until the navel has healed.
scope: A band of cloth worn round the waist; not the strap round a work animal's belly that holds the
  shafts of a wagon.
examples:
- The nurse wrapped a bellyband round the baby's waist.
- The bellyband held the dressing in place round her waist.
