simpleMeaning: a continuous length, straight or curved, with no width or thickness, like the path of a
  moving point.
scope: This is not a location in space or an edge of an object; it is a purely geometric length with no
  width.
examples:
- He drew a line from the corner to the center.
- The line curves gently to the left.
