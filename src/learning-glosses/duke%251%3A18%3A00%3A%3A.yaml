simpleMeaning: A British noble who holds the highest rank of all
scope: A British nobleman of the highest rank; not a nobleman of lower rank such as an earl, and not a
  ruler of a small state.
examples:
- The duke opened the new hall in the spring.
- As a duke, he held the highest rank among British peers.
