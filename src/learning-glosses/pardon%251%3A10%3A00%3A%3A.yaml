simpleMeaning: a written order that frees a person from punishment for a crime or wrong act
scope: This is the written order itself that frees a person from punishment, not the act of giving such
  an order.
examples:
- The king gave him a pardon, and he left prison the next day.
- After ten years in prison, she asked for a pardon so she could go free.
