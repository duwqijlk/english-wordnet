simpleMeaning: a stitch that covers part of the last one, made by starting each new stitch in the middle
  of the one before it
scope: A stitch that covers part of the last one, not a plain running stitch that leaves each stitch apart
  from the next.
examples:
- She used a backstitch to join the two pieces of cloth firmly.
- A backstitch starts each new stitch in the middle of the one before it.
