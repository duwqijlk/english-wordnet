simpleMeaning: The stance, upright, face and feet forward, arms at the sides, palms forward, used as the
  set mark for naming the place and way body parts lie.
scope: Of the body held upright in the set stance used to name the place and way body parts lie.
examples:
- In standard anatomical position, the palms face forward.
- Doctors use standard anatomical position to describe where a wound sits.
