simpleMeaning: The fact that a thing can keep going for a long time without running out or falling apart.
scope: The fact that a thing can keep going without running out, not a short-lived use that wears a thing
  out.
examples:
- The sustainability of the farm depends on the soil staying rich.
- They praised the sustainability of the new fishing rules.
