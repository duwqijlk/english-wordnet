simpleMeaning: One ray of light comes out as two side-by-side rays, each shaking in a flat sheet set at
  right angles to the other.
scope: One ray of light split into two side-by-side rays is also called double refraction.
examples:
- The two rays moved side by side, showing birefringence.
- The ray split in two, showing birefringence.
