simpleMeaning: coming from a mind that has given up all hope, and showing it in what you say or do
scope: 'Also called desperate: a feeling, look, or act that comes from a mind that has given up all hope,
  not sadness that still hopes for a better end.'
examples:
- She gave a despairing look at the ruined crops.
- His last despairing plea came as the trial ended.
