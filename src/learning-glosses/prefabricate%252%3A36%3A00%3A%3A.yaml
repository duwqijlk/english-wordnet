senseId: 'prefabricate%2:36:00::'
synsetId: 01743144-v
simpleMeaning: to make parts of a building, especially in a factory, so they can be moved easily to a
  building site and put together quickly there
scope: Also called preassemble. This is making building parts before they reach the site, not making something
  in an unoriginal or artificial way.
examples:
- Workers prefabricate wall sections in the factory before sending them to the site.
- The company prefabricated the rooms so the hotel could be put together quickly.
