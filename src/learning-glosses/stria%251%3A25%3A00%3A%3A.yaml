simpleMeaning: one of many tiny lines running side by side, like the scratches a glacier leaves on rock
  or the streaks and ridges in muscle
scope: 'Also called striation: one of many tiny parallel lines, not a single deep cut and not a crack.'
examples:
- The rock face showed a stria left by the glacier.
- Under the microscope, the stria in the muscle tissue ran in neat lines.
