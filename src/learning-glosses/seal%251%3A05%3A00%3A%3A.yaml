simpleMeaning: one of many sea animals that feed their young with milk, come onto land to have their young,
  and live mainly in cold places
scope: A sea animal that comes onto land to have its young, mainly in cold places. Not the substance used
  to close a letter, not a tool or mark for papers, and not a coat put on a surface.
examples:
- A seal lay on the ice with its baby beside it.
- Seals come onto the beach each year to have their young.
