simpleMeaning: to sing in a loud, strong way
scope: To sing loudly and strongly. Not the band worn at the waist, not a band in a machine, and not bullets
  for a gun.
examples:
- She belted out the song so the whole hall could hear her.
- The singer belted out a loud song at the end of the show.
