simpleMeaning: any of several North American fish that live in rivers and lakes and have lean flesh, above
  all the kind called Micropterus
scope: This is any of several North American fish of rivers and lakes with lean flesh; bass is another
  name for it, not a sea fish or a fish with fat flesh.
examples:
- He caught a freshwater bass in the lake at dawn.
- Freshwater bass is a popular catch in this river.
