simpleMeaning: pale meat, soft and fine in taste, from a hard-shelled sea animal found in Florida and
  now very rare
scope: The pale meat of a hard-shelled sea animal from Florida, not the whole animal and not other shellfish
  meat.
examples:
- Stone crabs are caught off Florida for their pale meat.
- The stone crab on the menu was served chilled with sauce.
