simpleMeaning: A shape with one upright line and two bars on it, one bar above and one bar below the middle,
  the lower bar longer than the upper one
scope: Also called a Lorraine cross, this is a shape with two bars across an upright line, not a shape
  with a single bar.
examples:
- The flag bore a cross of Lorraine with two bars of different lengths.
- She drew a cross of Lorraine, with the lower bar longer than the upper one.
