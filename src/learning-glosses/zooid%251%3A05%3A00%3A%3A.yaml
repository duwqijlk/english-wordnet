simpleMeaning: one single animal that lives joined with others to form one large animal group, like the
  tiny sea animals that build a shared body
scope: This is one single animal joined with others to form one large group; not a whole animal on its
  own and not a plant.
examples:
- Each zooid in the colony fed on its own while sharing one body.
- The zooid could not live apart from the rest of the colony.
