simpleMeaning: 'a tool for making a mass spectrum (measures of how heavy charged bits of matter (ions)
  are): it bends them into a thin opening and measures their electric flow'
scope: 'Also called a mass spectrometer: a tool that measures charged bits of matter to make a mass spectrum,
  not a tool that only splits light into colours.'
examples:
- The lab used a spectrometer to find out what the gas was made of.
- With the spectrometer, the scientists measured the ions in the sample.
