simpleMeaning: a fixed number in the maths rule for a curve; changing it makes a group of curves that
  are like each other in shape
scope: 'Also called parametric quantity: this number in the rule for a curve, not a number that describes
  a whole group in statistics and not a general factor that sets or limits how a system works.'
examples:
- Changing the parameter in the equation gave a whole family of similar curves.
- For each value of the parameter, the rule drew a new curve of the same shape.
