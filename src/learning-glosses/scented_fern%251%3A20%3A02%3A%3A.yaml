simpleMeaning: a common Eurasian plant that lives for years, with bitter leaves of many small leaflets
  and yellow flower heads like buttons, smelling strong and at times used as a medicine
scope: 'Also called tansy and golden buttons: a strong-smelling plant of Eurasia with yellow flower heads,
  not the sweet-smelling African fern and not the hay-scented fern of eastern North America.'
examples:
- Scented fern grows along the roadside, its yellow flower heads bright in summer.
- She picked scented fern to use as a bitter medicine.
