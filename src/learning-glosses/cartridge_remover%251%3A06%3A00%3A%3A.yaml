simpleMeaning: Out of the chamber and into the throw-out part goes an empty shell case, taken there by
  this gun part
scope: Also called extractor and cartridge extractor, this gun part takes an empty shell case out of the
  chamber, unlike the part that throws it clear and unlike the firing pin.
examples:
- The cartridge remover took the empty case out of the chamber.
- When the cartridge remover broke, the spent case stayed in the gun.
