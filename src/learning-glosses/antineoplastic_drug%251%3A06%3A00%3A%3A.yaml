simpleMeaning: In cancer treatment, one of several medicines holds back or kills cancer cells, though
  it may bring on sickness, throwing up, hair loss, or weak bone marrow.
scope: Another name for an antineoplastic and a cancer drug, this drug is used to fight cancer cells,
  while antibiotics fight germs and painkillers ease pain.
examples:
- The antineoplastic drug held back the cancer cells but brought on sickness.
- She lost hair while taking the antineoplastic drug for her cancer.
