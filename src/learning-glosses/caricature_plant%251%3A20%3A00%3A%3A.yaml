simpleMeaning: The leaves of this warm-land shrub of the Old World are marked like the side view of a
  person's face, and it bears purple or red tube-shaped flowers.
scope: A shrub of the warm Old World with tube-shaped flowers and leaves marked like a face in profile,
  not a shrub with plain leaves.
examples:
- The caricature plant has leaves marked like the side view of a face.
- Purple tube-shaped flowers grow on the caricature plant.
