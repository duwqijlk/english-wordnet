simpleMeaning: To have a loud, wild party, often with much drink, and to take part in noisy fun with others.
scope: To have a loud, wild party, often with drink, also called racket, revel, jollify, make happy, make
  whoopee, wassail, and whoop it up; not a quiet dinner and not a sad gathering.
examples:
- The members of the wedding party made merry all night.
- Let's make merry — the boss is gone!
