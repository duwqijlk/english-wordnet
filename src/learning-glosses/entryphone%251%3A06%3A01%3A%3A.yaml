simpleMeaning: A talk-back set that lets a person speak to a caller at the door without opening it.
scope: A talk-back set that lets a person speak to a caller at the door without opening it, not a bell
  that only rings and not a lock that only opens the door.
examples:
- She spoke to the visitor through the entryphone.
- The entryphone let him ask who was at the door.
