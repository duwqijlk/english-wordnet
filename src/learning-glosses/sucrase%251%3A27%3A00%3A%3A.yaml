simpleMeaning: a body substance that makes sugar split with water into two simpler sugars, glucose and
  fructose
scope: This is a body substance that splits sugar with water, also called invertase and saccharase; not
  a substance that builds sugar up and not a substance that works on fats.
examples:
- Sucrase splits table sugar into glucose and fructose.
- Without sucrase, the body cannot break down table sugar.
