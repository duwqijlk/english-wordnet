simpleMeaning: In pathology, a firm raised mark on the skin that is not normal and is caused by a virus
scope: 'Also called a wart: a firm raised mark on the skin caused by a virus, not a mole and not a spot
  from an injury.'
examples:
- The verruca on his foot hurt when he walked.
- The doctor said the verruca on her hand was caused by a virus.
