simpleMeaning: connected with the arts and the customs of a group of people.
scope: This is not about the whole way of life of a people; it points to their arts and the manners they
  prefer.
examples:
- The city offers a rich cultural life, with theatres and galleries.
- The festival is a cultural event that celebrates local music and dance.
