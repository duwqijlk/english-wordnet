simpleMeaning: something done wrong because of poor judgment, not knowing enough, or not paying attention
scope: 'Also called a mistake, and another name for it is a fault: something done wrong, not a wrong idea,
  not a failed play in baseball, and not acting against what is right.'
examples:
- He made an error when he added the numbers wrongly.
- Her error in spelling the name caused a long delay.
