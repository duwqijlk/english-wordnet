simpleMeaning: having tall posts that hold up part of a building
scope: This word describes a building or front part that has tall round posts holding up its top. It does
  not describe a single post on its own.
examples:
- We sat in the shade of the pillared front of the house.
- Visitors walked into the large pillared building.
