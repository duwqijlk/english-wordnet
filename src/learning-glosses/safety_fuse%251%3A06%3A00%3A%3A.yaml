simpleMeaning: A tube or cord filled or soaked with stuff that burns, which burns slowly to light, from
  far away, a device that sets off a blast.
scope: A tube or cord that burns slowly to light a device that sets off a blast from far away.
examples:
- He stood far away and lit the safety fuse.
- The safety fuse burned slowly and then lit the detonator.
