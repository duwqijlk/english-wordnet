simpleMeaning: One gene stops a second, unrelated gene from showing its effect
scope: One gene holding back an unrelated gene, also called epistasis; not a gene that works on its own
  and not a change in the gene itself.
examples:
- In hypostasis, the first gene masks the effect of the second gene.
- The researcher studied hypostasis in mice to see which gene was hidden.
