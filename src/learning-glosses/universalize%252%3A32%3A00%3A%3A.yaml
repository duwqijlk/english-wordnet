simpleMeaning: To make something count for everyone, everywhere
scope: To make a thing count for everyone, everywhere; universalise is another name for this sense, not
  to make a thing local and not to copy a thing.
examples:
- This author's stories universalize old themes.
- The new rule will universalize safety checks in all schools.
