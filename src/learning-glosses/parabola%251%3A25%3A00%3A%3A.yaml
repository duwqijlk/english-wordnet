senseId: 'parabola%1:25:00::'
synsetId: 13909064-n
simpleMeaning: In maths, a flat curve made when a flat surface cuts through a cone that stands straight,
  going the same way as a line on the cone's side
scope: This is one special curve made by cutting a cone in a set way; it is not a circle and not a straight
  line.
examples:
- In maths class, we drew a parabola, the curve made by that special cut through a cone.
- The teacher showed how a parabola is made when a flat surface cuts a cone in that set way.
