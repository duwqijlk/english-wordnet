simpleMeaning: The smallest set of atoms or bits of matter that, copied over and over at even gaps in
  three directions, builds the pattern of a crystal.
scope: The smallest repeating set of atoms or bits of matter that builds the pattern of a crystal, not
  the whole crystal itself.
examples:
- The unit cell of salt repeats to form the whole crystal.
- Scientists worked out the unit cell from the crystal's pattern.
