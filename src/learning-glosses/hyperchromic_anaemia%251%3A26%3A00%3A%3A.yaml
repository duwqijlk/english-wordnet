senseId: 'hyperchromic_anaemia%1:26:00::'
synsetId: 14188855-n
simpleMeaning: A blood condition in which each red blood cell holds more of the red pigment that carries
  oxygen than usual.
scope: A blood condition in which each red cell holds more red pigment than usual; hyperchromic anemia
  is another name for it, not the kind where red cells are too few.
examples:
- The doctor said her hyperchromic anaemia came from too much red pigment in each cell.
- His hyperchromic anaemia showed up in a blood test.
