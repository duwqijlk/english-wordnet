simpleMeaning: A Jewish sect that takes only the Hebrew Scriptures as God's law and rejects the later
  tradition of the Talmud; the sect began in Iraq in the eighth century.
scope: A Jewish sect that follows only the Scriptures, not the Jews who follow the Talmud and not the
  Samaritans.
examples:
- The Karaites reject the authority of the Talmud.
- Karaites arose in Iraq in the eighth century.
