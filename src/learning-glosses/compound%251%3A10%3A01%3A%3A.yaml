simpleMeaning: a word made by joining other words, parts of words, or endings and beginnings added to
  words
scope: A word made by joining words or word parts, not a substance made by joining chemicals and not a
  group of buildings inside a wall.
examples:
- '''Basketball'' is a compound made from ''basket'' and ''ball''.'
- The teacher showed that 'builder' is a compound made from a word and an ending.
