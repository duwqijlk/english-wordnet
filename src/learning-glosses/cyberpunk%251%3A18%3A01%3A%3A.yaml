simpleMeaning: A person who writes computer programs and breaks into other people's computer systems to
  steal, change, or wreck stored facts, as a form of terror carried out by computer.
scope: This is a person who breaks into computer systems to steal or wreck facts, also called a cyber-terrorist,
  not a writer of stories about such people or the kind of story itself.
examples:
- The cyberpunk broke into the bank's computers and changed the records.
- Police caught the cyberpunk after he stole secret files from the system.
