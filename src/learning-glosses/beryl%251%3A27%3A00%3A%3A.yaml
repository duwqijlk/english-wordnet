simpleMeaning: a stone that is the main source of a light metal; types that are clear and have colour
  are valued as gems
scope: This is the stone itself, as a source of a light metal and, in clear coloured types, as a gem;
  it is not the metal that comes from it.
examples:
- The mine dug out beryl as the main source of the metal.
- Her ring held a piece of clear green beryl.
