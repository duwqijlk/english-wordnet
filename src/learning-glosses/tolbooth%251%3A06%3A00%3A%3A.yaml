simpleMeaning: A small hut at a road gate where the keeper takes the fee for passing
scope: A small hut at a road gate where the keeper takes the passing fee; tollbooth and tollhouse are
  other names for this sense, and not a ticket office or a guard hut.
examples:
- The driver stopped at the tolbooth to pay.
- A tolbooth stood at the entrance to the bridge.
