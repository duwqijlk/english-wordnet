simpleMeaning: to put someone into the job of a priest or church leader in a formal church act
scope: 'Also called order, consecrate and ordinate: this sense puts a person into a priest or church leader
  job, not giving an order by higher power, and not just giving priestly power.'
examples:
- The bishop ordained her as a priest last spring.
- He was ordained and took up his first church post.
