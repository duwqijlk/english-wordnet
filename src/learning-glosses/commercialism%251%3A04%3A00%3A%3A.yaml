simpleMeaning: buying and selling done to supply goods and help to others
scope: Buying and selling to supply goods and help; commerce and mercantilism are other names for this
  sense; not the making of goods, and not one firm's control of selling.
examples:
- Commercialism grew as towns began to trade with each other.
- Through commercialism, shops could supply goods and help to people in other towns.
