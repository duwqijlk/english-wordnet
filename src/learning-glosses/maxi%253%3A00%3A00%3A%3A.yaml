simpleMeaning: A hem that comes down to the ankle marks women's clothes of this kind
scope: This describes women's clothing with a long hem that reaches the ankle, not a short skirt and not
  a dress with a knee-length hem.
examples:
- She wore a maxi dress with a hem at her ankle.
- The maxi skirt reached down to her ankles.
