senseId: 'involuntary_trust%1:21:00::'
synsetId: 13383135-n
simpleMeaning: A court makes one person hold property for another who was wrongly kept from what was theirs,
  whether or not anyone meant it to happen
scope: A court order that makes one person hold property for another who was wrongly kept from what was
  theirs, also called constructive trust; not a trust set up by a person's own choice and not a gift.
examples:
- The judge set up an involuntary trust for the cheated widow.
- An involuntary trust held the money until the court decided who owned it.
