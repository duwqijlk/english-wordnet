simpleMeaning: strong, heavy, hard wood that is worth a lot and comes from several kinds of trees
scope: The wood that comes from these trees, not the living tree itself and not the nuts the tree bears.
examples:
- The table is made of hickory, so it is strong and heavy.
- He chose hickory for the tool handles because this wood lasts a long time.
