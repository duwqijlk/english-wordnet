simpleMeaning: Thinking of what others may say against you and answering it before they speak
scope: Answering a point against you before it is made; not waiting to hear the point first and not ignoring
  it.
examples:
- Her prolepsis answered the critics before they had even spoken.
- He used prolepsis to meet every objection in advance.
