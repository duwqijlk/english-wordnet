simpleMeaning: In genetics, a virus or other thing used to carry DNA (the material in a cell that holds
  the plans for life) into a cell
scope: In genetics, this sense is a thing used to carry DNA into a cell. It is not a thing that carries
  and spreads a disease, and not a line or amount in maths.
examples:
- The team used a virus as a vector to carry new DNA into the cells.
- This vector can deliver DNA to a cell without harming it.
