simpleMeaning: To stretch a shoe on a form shaped like a foot.
scope: This is stretching a shoe on a form shaped like a foot, not chasing an animal up a tree and not
  planting an area with trees.
examples:
- The shoemaker treed the damp shoes so they would hold their shape as they dried.
- Leather boots should be treed while still slightly damp.
