simpleMeaning: A way of acting all their own, peculiar to one person alone.
scope: Also called an idiosyncrasy or a mannerism; a way of acting all their own, peculiar to one person,
  not the weaker part of a sword blade and not a small fault of character.
examples:
- His foible was tapping his pen while he thought.
- One of her foibles was talking to her plants.
