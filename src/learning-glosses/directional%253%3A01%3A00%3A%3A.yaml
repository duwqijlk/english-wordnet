senseId: 'directional%3:01:00::'
synsetId: 02724710-a
simpleMeaning: about or showing which way to go or which way something points in space
scope: This sense is about which way to go or point in space; it is not about a goal that is not in space,
  and not about leading or guiding others.
examples:
- The directional signs at the airport pointed us to the right gate.
- A directional arrow on the road showed which way to turn.
