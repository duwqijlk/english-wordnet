senseId: 'eloquently%4:02:00::'
synsetId: 00329241-r
simpleMeaning: in a clear way of speaking or writing that flows well and can change what people feel or
  think
scope: Speaking or writing in a clear way that flows well and can change what people feel or think; not
  just speaking loudly, and not just speaking for a long time.
examples:
- She spoke eloquently about why every child should learn to read.
- The mayor argued eloquently for the new school.
