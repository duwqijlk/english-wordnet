senseId: 'obligatory%3:00:00::'
synsetId: 00851498-a
simpleMeaning: that a person must do because of what is right or because of the law
scope: This sense is about what the law or what is right makes a person do, not just what a duty or a
  custom says a person must do.
examples:
- Attendance at school is obligatory for children.
- Paying this tax is obligatory under the law.
