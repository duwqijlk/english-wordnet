simpleMeaning: A small tree of western North America that drops its leaves each year, with bent boughs
  and pale grey bark.
scope: Also called Garry oak, Oregon white oak and Quercus garryana; it is the small leaf-dropping tree
  of western North America with bent boughs and pale grey bark.
examples:
- An Oregon oak stood alone on the hill.
- Oregon oaks drop their leaves each year and grow bent boughs.
