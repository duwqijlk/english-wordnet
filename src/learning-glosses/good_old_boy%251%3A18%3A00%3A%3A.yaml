senseId: 'good_old_boy%1:18:00::'
synsetId: 10157992-n
simpleMeaning: a white man from the southern US, plain and friendly, with right-wing or shutting-out views
  and a fellow feeling for men of his group, and loyalty to them
scope: Also called good ol' boy and good ole boy; a plain, friendly white man of the US South with right-wing
  views, not just any friendly southern man and not a man from the North.
examples:
- He is a good old boy who greets everyone at the county fair.
- The good old boy stayed loyal to his old friends through the whole campaign.
