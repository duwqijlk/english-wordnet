simpleMeaning: A church gives its parson, vicar or rector a house to live in as part of the job
scope: 'Also called rectory and vicarage: a house a church gives its parson, vicar or rector to live in,
  not a house the priest buys for himself and not a church building.'
examples:
- The parsonage stood next to the church, with a garden at the back.
- The new vicar moved into the parsonage last week.
