simpleMeaning: A teacher or minister who has retired from their duties.
scope: A teacher or minister who has retired from their duties; not honourably retired from set duties
  while keeping the title, as in 'professor emeritus'.
examples:
- The emeritus still gave a lecture each year.
- Their emeritus kept an office in the old hall.
