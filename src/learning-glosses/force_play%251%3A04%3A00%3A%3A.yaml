synsetId: 00130563-n
simpleMeaning: in baseball, the base a runner who has to run must reach is touched by a fielder holding
  the ball, and the runner is out before getting there
scope: Also called force, force-out and force out, this is an out in baseball for a runner who must run,
  not an out made by tagging a runner with the ball.
examples:
- The shortstop turned the force play at second base.
- A force play ended the inning with the bases full.
