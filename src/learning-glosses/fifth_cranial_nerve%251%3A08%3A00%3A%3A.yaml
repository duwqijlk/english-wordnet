simpleMeaning: The main cord of feeling in the face, which also moves the muscles used for chewing
scope: The main cord of feeling in the face, which also moves the muscles used for chewing; nervus trigeminus,
  trigeminal, trigeminal nerve and trigeminus are other names for this sense, not a cord that serves the
  eye and not one that serves the tongue alone.
examples:
- The fifth cranial nerve carries feeling from the face.
- Damage to the fifth cranial nerve made chewing hard.
