senseId: 'atomistic_theory%1:09:00::'
synsetId: 06112083-n
simpleMeaning: Bits too small to split and too hard to destroy, separate from each other and countable
  to an end, make up all stuff in chemistry
scope: Also called atomic theory, atomism, or atomist theory, this idea in chemistry says all stuff is
  made of tiny bits, not of stuff that can be split without end.
examples:
- An atomistic theory says all stuff is made of tiny bits.
- Epicurus held an atomistic theory of the universe.
