simpleMeaning: to flow slowly, in drops or in a stream that starts and stops
scope: 'Also called trickle and dribble: to flow slowly in drops; not a device that cleans or changes
  what passes through it, and not taking something out by passing it through such a device.'
examples:
- Water filtered in through the crack, drop by drop.
- Water filtered slowly from the tap, drop after drop.
