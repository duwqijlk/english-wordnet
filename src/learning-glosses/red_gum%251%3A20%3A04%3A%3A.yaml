simpleMeaning: brownish wood from the inner part of the tree, used to make furniture
scope: 'Also called hazelwood, satin walnut and sweet gum: brown wood for furniture, not the tree itself
  and not dried sap from a tree.'
examples:
- The table was made of red gum, polished to a warm brown.
- They used red gum to make the chairs for the dining room.
