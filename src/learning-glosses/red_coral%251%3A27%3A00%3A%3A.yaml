simpleMeaning: The hard, stone-like frame left by a Mediterranean sea animal, delicate rose-pink or pink
  in colour, is made into things people wear.
scope: Also called coral and precious coral, this names the hard, stone-like frame left by a Mediterranean
  sea animal, not the living animal itself.
examples:
- The red coral was made into a necklace.
- Delicate rose-pink colour marked the red coral.
