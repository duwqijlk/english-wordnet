simpleMeaning: A pain-killing drug that fights swelling without steroid hormones and is given only by
  a shot into a muscle
scope: A pain-killing drug given only by a shot into a muscle, also called ketorolac, ketorolac tromethamine
  and Acular; not a pain-killing pill and not a drug rubbed on the skin.
examples:
- The nurse gave him a Toradol shot for the pain after surgery.
- Toradol helped bring down the swelling in her knee.
