simpleMeaning: In accounting, to check a record by comparing it with a duplicate register.
scope: 'Bookkeeping and audit jargon: a ledger is controlled by matching it against a duplicate register
  kept for the purpose. This is not the everyday sense of directing or operating something, and not the
  sense of making sure that something happens. The use is old-fashioned and technical, now mostly expressed
  with ''reconcile'' or ''check''.'
examples:
- The clerk controlled the ledger against the duplicate register before closing the books.
- Each page was controlled a second time, line by line, against the office copy.
