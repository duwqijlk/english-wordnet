simpleMeaning: A blood tube that branches off the base blood tube of the brain and feeds the inner ear.
scope: A blood tube that branches off the base blood tube of the brain and feeds the inner ear, also called
  artery of the labyrinth and labyrinthine artery; not a blood tube that feeds the outer ear and not a
  vein of the ear.
examples:
- The internal auditory artery feeds the inner ear.
- A block in the internal auditory artery harmed hearing.
