simpleMeaning: From southern and western Europe and North Africa comes an iris with purple flowers and
  leaves that smell bad.
scope: Also called gladdon, gladdon iris, stinking gladwyn and stinking iris, this iris is known by its
  purple flowers and bad-smelling leaves, and by where it grows.
examples:
- We grew a roast beef plant for its purple flowers.
- We found a roast beef plant growing in North Africa.
