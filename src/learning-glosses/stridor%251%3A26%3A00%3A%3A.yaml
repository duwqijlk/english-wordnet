simpleMeaning: A whistling sound when breathing, usually heard on breathing in, which indicates a blockage
  of the trachea or larynx
scope: It is the whistling sound heard when a person breathes in, most often on the inward breath, that
  shows a block in the windpipe or voice box.
examples:
- A stridor was heard with every breath in.
- The stridor showed the windpipe was blocked.
