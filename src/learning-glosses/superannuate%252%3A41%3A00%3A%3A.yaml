senseId: 'superannuate%2:41:00::'
synsetId: 02385560-v
simpleMeaning: To make a person leave work and pay them a pension, because age or ill health leaves them
  unable to carry on.
scope: An employer retires a person with a pension for age or ill health, not the use for a person leaving
  work or losing the right to it themselves.
examples:
- The firm superannuated its oldest clerk with a full pension.
- They superannuated her at sixty, as her sight had grown too weak for the work.
