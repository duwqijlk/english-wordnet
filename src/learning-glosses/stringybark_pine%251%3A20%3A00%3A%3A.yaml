simpleMeaning: an Australian cypress tree with thread-like fibres in the inner bark
scope: An Australian cypress tree with thread-like fibres in the inner bark; not a pine with smooth bark
  and not a eucalyptus.
examples:
- The stringybark pine is an Australian cypress tree with thread-like fibres in its inner bark.
- We looked at a stringybark pine and saw the fibres in its inner bark.
