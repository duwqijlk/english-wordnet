simpleMeaning: In psychology, a state of mind whose qualities stay much the same, even though the state
  itself may change
scope: In psychology, a state of mind whose qualities stay much the same while the state itself may change;
  mental state is another name for this, not a passing mood and not a fixed trait of character.
examples:
- Stress is a mental condition that can change with rest.
- Her mental condition stayed steady through the week.
