simpleMeaning: In the upper leg, a band of flesh turns the leg to the cross-legged way of sitting, and
  no other such band in the human body is longer.
scope: Also called musculus sartorius and sartorius, this band of flesh in the upper leg turns the leg
  to the cross-legged way of sitting and is the longest such band in the human body.
examples:
- Cross-legged sitting uses the sartorius muscle in the thigh.
- The sartorius muscle turns the leg to sit cross-legged.
