simpleMeaning: the hollow part of a musical instrument that vibrates and makes the sound fuller, such
  as the wooden box of a violin.
scope: This is not the whole physical frame of a person or animal, and not a separate object in space;
  it is the hollow sounding part of a musical instrument.
examples:
- The violin's body is carved from maple and gives the instrument its warm tone.
- The guitar's body was cracked, so the notes sounded thin.
