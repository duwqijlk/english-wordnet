simpleMeaning: with a warm and friendly feel, or helping to make one, in a way that is not stiff or formal
scope: 'Also called intimate, informal, and cozy: this is about a warm, friendly feel that is not stiff
  or formal, not a cloth teapot cover, and not a warm, comfortable place.'
examples:
- They had a cosy chat over tea, talking freely with each other.
- The party had a cosy feel, with close friends talking and laughing together.
