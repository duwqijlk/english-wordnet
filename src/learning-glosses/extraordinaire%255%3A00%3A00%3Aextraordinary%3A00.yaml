simpleMeaning: very good indeed in one named job, skill or way of working, used after the word for it
scope: Used after a noun to say someone is very good at that one thing, not just unusual or strange in
  general.
examples:
- She is a chef extraordinaire, famous for her bread.
- They hired a gardener extraordinaire to save the old roses.
