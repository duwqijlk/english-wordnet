simpleMeaning: a carriage with two wheels and a folding cover on top, pulled by one horse
scope: A carriage with two wheels and a folding cover on top, pulled by one horse, also called a chaise;
  not a coach pulled by two horses and not a cart for carrying goods.
examples:
- The farmer drove his shay into town.
- A single horse pulled the shay along the lane.
