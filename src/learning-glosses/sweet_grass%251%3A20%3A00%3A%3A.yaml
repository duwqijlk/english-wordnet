simpleMeaning: The group Glyceria holds many kinds of wet-ground plant, and this one is known by its nice
  taste or smell.
scope: Manna grass is another name for it, one of the wet-ground kinds in the group Glyceria.
examples:
- The cows grazed on sweet grass beside the stream.
- By the stream, sweet grass grows thick where the ground stays wet.
