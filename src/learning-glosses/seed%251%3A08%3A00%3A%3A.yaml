simpleMeaning: the thick white fluid that comes out of a man's body and holds the cells that can make
  a baby
scope: 'Also called come: the thick white fluid that comes out of a man''s body and holds the cells that
  can make a baby, not a small hard part of a plant and not putting bits into clouds to make rain.'
examples:
- The seed holds the cells that can make a baby.
- A doctor can test a man's seed for health.
