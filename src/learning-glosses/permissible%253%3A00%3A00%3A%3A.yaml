simpleMeaning: that can be allowed, especially when it fits the rules
scope: This is about something the rules allow. It is not about something that is just possible to do,
  or something people like.
examples:
- It is permissible to bring a phone into class, but not to use it in a test.
- Parking here is permissible during the day.
