simpleMeaning: A pattern of small boxes used by people to check their own sight when the centre of the
  eye weakens with age.
scope: A self-check used by patients themselves to watch for changes in their central sight as it weakens
  with age.
examples:
- The doctor gave her an Amsler grid to check her sight at home.
- He looked at the Amsler grid each morning to watch for changes in his sight.
