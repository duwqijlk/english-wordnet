simpleMeaning: For making dyes, these yellow chemicals that smell are used; some kinds of them matter
  in living things as coenzymes, acceptors, or vitamins.
scope: Benzoquinone is another name for one of these; this word names a whole group of such chemicals,
  and benzoquinone is only one kind in it.
examples:
- The quinone made the dye yellow.
- Some quinones act as coenzymes in living things.
