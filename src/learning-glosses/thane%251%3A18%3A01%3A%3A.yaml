simpleMeaning: Between a free man and a lord stood a man in Anglo-Saxon England, above all one who gave
  war service for land.
scope: He ranked above a free man and below a lord in Anglo-Saxon England, and was not a lord himself.
examples:
- The thane promised fighting men in return for the land he held.
- The thane's rank set him above the free men of the village.
