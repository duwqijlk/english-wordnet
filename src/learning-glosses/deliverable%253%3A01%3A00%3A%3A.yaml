senseId: 'deliverable%3:01:00::'
synsetId: 02721174-a
simpleMeaning: fit to be sent or handed to someone, or ready to be sent or handed over
scope: This describes something as fit or ready to be sent or handed over; it is not the name for the
  thing itself that must be handed over in a piece of work.
examples:
- The report is finished and deliverable to the client today.
- Make sure the files are in a deliverable form before Friday.
