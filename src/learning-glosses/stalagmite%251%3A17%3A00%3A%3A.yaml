simpleMeaning: a round shape with straight sides made of calcium carbonate (a hard white material found
  in rock), standing up from the floor of a cave in limestone rock
scope: This is a rock shape that stands up from a cave floor, not a similar shape that hangs down from
  the top of a cave.
examples:
- Water dripping for many years built a tall stalagmite on the cave floor.
- The guide pointed to a stalagmite standing in the middle of the cave.
