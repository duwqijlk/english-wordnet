simpleMeaning: Disapproval shown by naming the faults or weak points of a thing
scope: Disapproval shown by naming faults or weak points, not praise and not a mere opinion about what
  is good.
examples:
- The criticism of his plan was fair and to the point.
- She took the criticism calmly and changed the draft.
