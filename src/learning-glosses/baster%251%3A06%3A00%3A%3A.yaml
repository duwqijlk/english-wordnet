simpleMeaning: While meat cooks in the oven, a cook can draw melted fat or gravy into this tube by squeezing
  its soft bulb, then let it out to wet the meat.
scope: A kitchen tool for wetting roast meat, not the person who does the wetting and not a sewer who
  holds cloth with loose stitches.
examples:
- The cook squeezed the baster to draw up the melted fat.
- She used the baster to keep the roast moist.
