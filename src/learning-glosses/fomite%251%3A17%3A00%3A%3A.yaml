simpleMeaning: something with no life that carries germs from one person to another, like a towel, money,
  clothes, dishes, books, or toys
scope: A lifeless thing that can carry germs from one person to another, also called vehicle, not a living
  carrier such as a mosquito.
examples:
- A dirty towel can be a fomite that passes germs from one person to another.
- The nurse said the shared toys were fomites in the ward.
