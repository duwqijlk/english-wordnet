simpleMeaning: A shop that serves a thinly settled area and is usually filled with many kinds of goods
scope: This is a shop serving a thinly settled area, usually filled with many kinds of goods; country
  store and trading post are other names for this sense, not a shop in a town and not a shop that sells
  one kind of goods.
examples:
- The general store sold food, tools and cloth under one roof.
- We stopped at the general store for milk on the way home.
