simpleMeaning: on an insect with four flying parts, one of the pair at the front of its body
scope: 'Also called a fore-wing and a forewing: one of the front pair of wings on a four-winged insect,
  not a back wing and not a wing on a bird.'
examples:
- The fore wing of the butterfly is larger than the hind wing.
- A tear in one fore wing kept the moth from flying straight.
