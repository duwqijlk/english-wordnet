simpleMeaning: having all of your attention held, so that you cannot look away or think of other things
scope: This means a person's attention is fully held by what they see or hear, not that real magic has
  been used on them.
examples:
- The children sat spellbound as the storyteller spoke.
- She listened spellbound to the music.
