simpleMeaning: A drug sold under this trade name that gets in the way of how the body uses purine, used
  to treat a fast-growing blood cancer of the white cells.
scope: Also called mercaptopurine; a drug that gets in the way of how the body uses purine, used to treat
  a fast-growing blood cancer, not a drug that kills germs and not a drug for pain.
examples:
- The doctor gave Purinethol to treat the child's blood cancer.
- Purinethol works by getting in the way of how the body uses purine.
