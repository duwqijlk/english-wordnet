simpleMeaning: a machine used most of all to press rubbish, cardboard, plastic and other things that can
  be used again into tight blocks
scope: 'Also called a baling press: a machine used most of all to press rubbish, cardboard, plastic and
  other things that can be used again into tight blocks, not a bin for throwing rubbish away and not a
  machine that shreds it.'
examples:
- The shop loads cardboard into the waste baler at the end of the day.
- A waste baler presses old boxes into tight blocks for collection.
