simpleMeaning: the leather section at the back of a shoe or boot, covering the heel and joining onto the
  front part
scope: This is the leather piece in a shoe or boot, not the rear part of a ship, and not a fourth part
  of something.
examples:
- The cobbler cut a new quarter from soft leather to cover the heel.
- The quarter of the boot had worn thin where it met the heel.
