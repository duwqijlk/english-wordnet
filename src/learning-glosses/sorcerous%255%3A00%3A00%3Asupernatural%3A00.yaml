simpleMeaning: having or using powers that are not part of the natural world, or like such powers, or
  right for such powers
scope: Also called magic, magical, wizard, charming, witching and wizardly; it is about powers beyond
  the natural world, not about ordinary skill or luck.
examples:
- The old book was full of sorcerous words that no one dared to say aloud.
- A sorcerous light glowed in the tower window at night.
