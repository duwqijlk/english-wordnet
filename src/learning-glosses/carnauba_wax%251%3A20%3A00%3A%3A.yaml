simpleMeaning: Polishes and floor waxes use this hard wax above all, yellowish to brownish, taken from
  the leaves of a palm tree
scope: Also called carnauba, this hard wax from palm leaves is used above all in floor waxes and polishes.
examples:
- They rubbed carnauba wax into the floor to make it shine.
- She used carnauba wax to polish the floor.
