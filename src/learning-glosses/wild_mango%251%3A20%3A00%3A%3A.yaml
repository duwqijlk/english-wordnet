simpleMeaning: an African tree with yellow fruit you can eat, much like a common sweet tropical fruit;
  its seed gives rich oil, and its tough green wood keeps termites out
scope: Also called wild mango tree and dika; an African tree valued for its seed oil and termite-proof
  wood, not the orchard tree grown for sweet yellow fruit.
examples:
- The wild mango bears yellow fruit that people eat.
- Wild mango wood is so tough that termites cannot eat it.
