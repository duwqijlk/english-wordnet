simpleMeaning: People grow this willow of the lands of Europe, Asia and Africa for its light green leaves,
  to make baskets.
scope: Also called almond willow, black Hollander and Salix amygdalina; a willow of the lands of Europe,
  Asia and Africa with light green leaves grown to make baskets, not the willow of the western United
  States with leaves like those of peach or almond trees.
examples:
- People grow Salix triandra to make baskets.
- The Salix triandra in the garden has light green leaves.
