simpleMeaning: To stop a person or an animal from moving at all, with a long steady look or by waking
  fear or wonder in them.
scope: To stop a person or an animal from moving at all, with a long steady look or by waking fear or
  wonder in them, also called grip, fascinate, or transfix; not to draw a person strongly, as if with
  a magnet.
examples:
- The snake charmer spellbound the cobra with a fixed stare.
- The old tale spellbound the children, and none of them moved.
