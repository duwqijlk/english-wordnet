senseId: 'diphtheria%1:26:00::'
synsetId: 14146992-n
simpleMeaning: A sudden, easily spread bacterial illness that forms a thick false membrane in the throat
  and airways, making breathing hard.
scope: A bacterial throat and airway infection marked by a false membrane; it is not a cold, strep throat
  or a viral illness.
examples:
- Children are vaccinated against diphtheria in early childhood.
- Untreated diphtheria can block the airway with a thick grey membrane.
