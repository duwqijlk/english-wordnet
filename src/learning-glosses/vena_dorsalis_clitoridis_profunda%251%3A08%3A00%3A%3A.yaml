simpleMeaning: Blood from the clitoris runs through this deep tube on its back, joining the net of tubes
  that serves the bladder.
scope: This is one of the tubes that drain the clitoris, a deep one feeding the net of tubes around the
  bladder.
examples:
- Blood leaves the clitoris through the vena dorsalis clitoridis profunda.
- The vena dorsalis clitoridis profunda joins the net of blood tubes that serves the bladder.
