simpleMeaning: A clear filter that makes the light passing through it weaker, or takes out some colours
  from the light.
scope: A clear sheet that weakens light, also called a light filter; not a lamp shade and not a coloured
  lens.
examples:
- The photographer put a diffusing screen over the lamp to soften the light.
- A diffusing screen on the window cut the glare.
