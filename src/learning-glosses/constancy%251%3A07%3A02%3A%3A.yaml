senseId: 'constancy%1:07:02::'
synsetId: 04884459-n
simpleMeaning: being true and able to be trusted in close personal ties, especially in staying true to
  one sexual partner
scope: This is about staying true to a person you are close to, especially a sexual partner; it is not
  the mind sense where a thing still looks the same in different light or from a different place.
examples:
- Her constancy to her husband lasted through many hard years.
- He valued constancy in his marriage above all else.
