simpleMeaning: to keep picking on a person with unkind words that find fault, again and again
scope: To keep picking on a person with unkind words; also called ride, rag, tease, rally, cod, or taunt;
  not to lure a person or an animal with food.
examples:
- The children baited the new teacher.
- Don't bait him about his failure.
