simpleMeaning: to form a shape like a feather, like smoke rising into the air
scope: To form a shape like a feather, not to put feathers on something and not the feather itself.
examples:
- Smoke plumed up from the chimney into the cold air.
- The engine was pluming black smoke into the sky.
