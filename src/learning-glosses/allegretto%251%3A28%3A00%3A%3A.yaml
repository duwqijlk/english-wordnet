senseId: 'allegretto%1:28:00::'
synsetId: 15289702-n
simpleMeaning: a speed at which music is played, faster than a slow speed called andante and slower than
  a fast speed called allegro
scope: A speed for playing music, not a piece of music played at that speed.
examples:
- The conductor asked for the next part to be played allegretto.
- She set the metronome to an allegretto pace for the practice run.
