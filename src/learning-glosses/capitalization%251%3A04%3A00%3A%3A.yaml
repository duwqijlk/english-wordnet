simpleMeaning: the act of making good use of a chance to get what you want
scope: This is about using a chance well to gain something. It is not the sale of shares in a company,
  and not writing with big letters.
examples:
- His quick capitalization on the other team's mistake helped his side score.
- Capitalization on the low price saved them a lot of money.
