simpleMeaning: Pale to pink flowers and bright green leaves mark a low plant of Europe spreading along
  the ground, now widely grown in the United States to feed farm animals.
scope: Also called shamrock and dutch clover, this low plant spreads along the ground with pale to pink
  flowers, unlike red clover, whose flowers are red.
examples:
- White clover covered the ground with its pale flowers.
- Farmers sow white clover to feed their cattle.
