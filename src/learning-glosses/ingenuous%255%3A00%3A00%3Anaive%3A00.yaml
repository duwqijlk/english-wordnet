simpleMeaning: not knowing much about the world or about the way people act in everyday life
scope: 'Also called innocent: this sense means not knowing much about the world, not the sense of being
  open and unable to hide your feelings.'
examples:
- The ingenuous young man believed every story the seller told him.
- She gave an ingenuous smile, knowing little about how hard city life could be.
