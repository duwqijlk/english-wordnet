simpleMeaning: the movement of one thing in relation to another thing
scope: 'Passage is another name for this sense: the movement of one thing in relation to another thing.
  Not a throw in American football, not a quick careless look, and not a mark that is good enough in a
  test.'
examples:
- The passing of the moon across the night sky can be watched for hours.
- Scientists measured the passing of one star in front of another.
