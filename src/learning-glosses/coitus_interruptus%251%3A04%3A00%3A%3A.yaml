simpleMeaning: a way to prevent a pregnancy, in which the sex act is started but the man's sex organ is
  pulled out on purpose before the seed is spent
scope: A way to prevent a pregnancy by pulling out before the seed is spent; withdrawal, onanism, pulling
  out and withdrawal method are other names for this sense; not a device that prevents pregnancy, and
  not the stopping of the act for other ends.
examples:
- They used coitus interruptus to avoid a pregnancy.
- Coitus interruptus fails more often than other ways of stopping a pregnancy.
