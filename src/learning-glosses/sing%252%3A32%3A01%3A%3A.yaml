simpleMeaning: Tell others what was supposed to be kept secret or private.
scope: Another name for this sense is talk; it means giving away secrets, not producing musical notes
  or performing a song with the voice.
examples:
- If he sings to the police, the whole gang will go to prison.
- Offered a lighter sentence, she sang to the detectives and named the whole ring.
