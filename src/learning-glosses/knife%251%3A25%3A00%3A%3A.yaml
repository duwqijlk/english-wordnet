simpleMeaning: Any long, slender form that juts out only for a moment.
scope: Here it is another name for a tongue, meaning a fleeting thin projection such as a flame; it is
  not the cutting tool or the weapon.
examples:
- Quick knives of fire shot from the burning roof.
- A knife of lightning split the dark sky.
