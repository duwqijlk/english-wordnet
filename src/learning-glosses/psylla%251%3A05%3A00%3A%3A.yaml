simpleMeaning: From the juices of plants it takes its food, this quick little jumper with back legs made
  to leap, much like a cicada.
scope: It is also called jumping plant louse and psyllid, and it is a small bug that lives off plants,
  like a cicada but not one.
examples:
- A psylla leapt off the leaf when the stem was touched.
- The psylla drinks the juices of the plant it sits on.
