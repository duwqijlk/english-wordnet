simpleMeaning: to put a coat on a person or thing
scope: The act of putting a coat on. It is not the outer covering itself, not the tooth cover, and not
  the metal shell around a bullet.
examples:
- He jacketed his young son before they went out into the snow.
- The workers were jacketed in thick coats for the cold morning.
