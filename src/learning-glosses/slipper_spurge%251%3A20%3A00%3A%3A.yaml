simpleMeaning: Fleshy, bushy growths of warm lands in the Americas, these look like cacti but bear foot-like
  leaf parts, one of many such kinds.
scope: Also called a slipper plant, it is one of many fleshy, bushy growths of warm lands in the Americas
  that look like cacti.
examples:
- The slipper spurge looked like a small cactus.
- We saw a slipper spurge with foot-shaped bracts.
