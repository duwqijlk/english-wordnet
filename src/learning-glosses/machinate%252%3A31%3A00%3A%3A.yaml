simpleMeaning: With others, to plan in secret to do something wrong, and to swear to carry it out together
scope: Also called conspire, conjure, cabal and complot, this is a secret plan made with others to do
  wrong, not an open plan and not a single person's scheme.
examples:
- They machinated to bring down the mayor.
- The two ministers machinated in secret for months.
