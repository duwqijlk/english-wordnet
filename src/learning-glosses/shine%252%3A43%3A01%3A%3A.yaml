simpleMeaning: To give off light or send it back from a surface, making that surface look bright.
scope: 'Another name for ''reflect'': a surface bright because it sends light back or casts it, not the
  sun or a lamp giving out its own light, not a surface that merely looks shiny when wet, and not light
  reaching something.'
examples:
- The wet road shone in the headlights.
- The lake shone under the moon.
