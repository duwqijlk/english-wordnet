senseId: 'drippings%1:13:00::'
synsetId: 07688994-n
simpleMeaning: fat that comes out of meat and falls off it while the meat is being cooked in an oven or
  fried in a pan
scope: Fat that has come out of meat during cooking, not the meat itself and not fat that is still inside
  the meat.
examples:
- She poured the drippings from the roast meat into a pan to make a sauce.
- The drippings from the fried chicken were saved for cooking potatoes.
