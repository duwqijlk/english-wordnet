simpleMeaning: a small separate amount of solid or liquid matter that stays spread out in gas or liquid
  that is given out, usually a thing that makes the air dirty
scope: 'Also called particulate matter: this is a tiny amount of solid or liquid matter in gas or liquid
  that is given out, not the adjective sense that means made up of separate small pieces.'
examples:
- Filters caught most of the particulate in the smoke from the factory.
- Particulates in the city air can harm people's lungs.
