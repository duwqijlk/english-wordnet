simpleMeaning: having to do with or causing a worsening in the young that are born
scope: 'Also called dysgenic: about a worsening in the young that are born, not about making them better
  and not about a sickness in a grown person.'
examples:
- The report warned that the cacogenic chemical could harm the young born to the animals.
- Scientists studied the cacogenic effect of the drug on the young born later.
