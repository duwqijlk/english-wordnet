simpleMeaning: A branch of the blood vessel in the hip that feeds the womb and the top part of the birth
  canal.
scope: 'Also called arteria uterina: a branch of the blood vessel in the hip that feeds the womb, not
  the main blood vessel of the leg and not a vein.'
examples:
- The uterine artery feeds the womb with blood.
- The surgeon tied off the uterine artery during the operation.
