simpleMeaning: Loud, showy praise meant to win crowds.
scope: This sense is also called a plug and hype, for loud, showy praise meant to win crowds, where a
  plug is very open and showy praise or advertising, made to win many people's eyes, unlike the sense
  for shouting praise noisily or blatantly.
examples:
- The ballyhoo drew crowds to the show.
- Ballyhoo is loud, showy praise.
