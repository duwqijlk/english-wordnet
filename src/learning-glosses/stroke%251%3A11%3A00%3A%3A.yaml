simpleMeaning: the longest distance a machine part can move when a part that turns or slides pushes it
  back and forth
scope: 'Also called throw: the longest move a machine part can make, not a mark with a pen, not the brain
  illness, and not a hit in golf.'
examples:
- The stroke of this part is only two inches, so it cannot move farther.
- A longer stroke lets the machine part travel a greater distance.
