simpleMeaning: to turn something into a business activity or into something that is sold to make money
scope: This means turning something into a business activity or into something that is sold to make money;
  it is not the sense of using something to get as much money as you can, usually by letting its quality
  get worse.
examples:
- Some farmers have commercialized their home-made cheese by selling it in shops.
- The group decided to commercialize the new game and sell it online.
