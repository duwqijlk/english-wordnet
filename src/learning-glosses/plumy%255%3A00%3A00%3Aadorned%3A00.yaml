simpleMeaning: Decked with bird plumes.
scope: This sense is also called feathered and feathery, for being decked with bird plumes, where feathered
  is dressed up with feathers or plumes, the parts that cover a bird, and feathery is made pretty by bird
  plumes added on as a trim.
examples:
- The hat was plumy, decked with bird plumes.
- The cloak was plumy, decked with plumes.
