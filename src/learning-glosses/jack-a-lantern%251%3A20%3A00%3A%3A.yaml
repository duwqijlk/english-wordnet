simpleMeaning: In the dark, the thin plates under the orange tops of this big poison mushroom glow, and
  the tops stand on thin stalks that grow close together
scope: Also called jack-o-lantern and jack-o-lantern fungus, this is a poison mushroom whose plates glow
  in the dark, not a mushroom safe to eat.
examples:
- The jack-a-lantern glowed faintly in the dark woods.
- Do not eat a jack-a-lantern; it is poison.
