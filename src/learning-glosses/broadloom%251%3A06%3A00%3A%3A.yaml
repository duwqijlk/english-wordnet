simpleMeaning: A floor covering woven in one wide piece, so that it needs no joins.
scope: A floor covering woven in one wide piece with no joins; not a small rug and not a carpet made of
  joined strips.
examples:
- The hall was fitted with broadloom from wall to wall.
- Broadloom costs more than carpet tiles.
