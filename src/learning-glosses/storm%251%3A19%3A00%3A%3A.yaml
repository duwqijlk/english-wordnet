simpleMeaning: Fierce weather with winds of 64 to 72 knots, force 11 on the Beaufort scale, plus rain,
  snow or hail, thunder and lightning.
scope: This is the weather sense, a fierce event of strong wind with rain, snow or hail, also called a
  violent storm, not the figurative uproar or the military assault.
examples:
- The fishing boats stayed in harbour while the storm passed.
- A storm tore the roof off the barn.
