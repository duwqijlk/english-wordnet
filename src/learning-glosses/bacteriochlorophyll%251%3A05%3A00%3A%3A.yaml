simpleMeaning: A substance in some bacteria that take in light, like the green colouring in higher plants
  but not the same
scope: A light-taking substance in bacteria, not the green colouring in higher plants and not a dye.
examples:
- Bacteriochlorophyll lets the bacteria use light for food.
- The bacteriochlorophyll in these bacteria works like the green stuff in leaves, but it is not the same
  stuff.
