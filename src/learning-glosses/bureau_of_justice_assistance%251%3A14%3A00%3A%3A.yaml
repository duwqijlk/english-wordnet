simpleMeaning: An office in that department that helps the law courts and police of towns and cities to
  cut down or stop crime, fighting and the misuse of drugs.
scope: This is a government office in that department, not a court or a police force itself.
examples:
- The Bureau of Justice Assistance gave money to the town police.
- The Bureau of Justice Assistance helps towns cut down crime.
