simpleMeaning: The feast twelve days after Christmas that celebrates the visit of the three wise men to
  the baby Jesus.
scope: Also called Epiphany, Epiphany of Our Lord, January 6 and Twelfth day, this is the feast twelve
  days after Christmas that celebrates the visit of the three wise men to the baby Jesus, not Christmas
  itself.
examples:
- Three Kings' Day falls twelve days after Christmas.
- On Three Kings' Day we remember the three wise men visiting the baby Jesus.
