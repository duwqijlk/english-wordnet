simpleMeaning: to put something forward so that other people can think about it, examine it, or say what
  is wrong with it
scope: Not to show a picture on a screen, and not to draw a flat technical shape.
examples:
- The mayor projected a vision of a greener city in her speech.
- The company projected a new strategy to its investors.
