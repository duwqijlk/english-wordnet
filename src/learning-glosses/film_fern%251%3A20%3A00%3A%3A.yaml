simpleMeaning: In warm, wet lands in the tropics grow plants of one group with leaves you can almost see
  through.
scope: Also called filmy fern, this plant of one group grows in warm, wet lands in the tropics and has
  leaves you can almost see through.
examples:
- A film fern grew on the wet rock in the hothouse.
- The film fern's leaves looked almost clear in the light.
