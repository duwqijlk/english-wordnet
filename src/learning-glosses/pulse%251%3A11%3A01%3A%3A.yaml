simpleMeaning: In electronics, a short sharp wave in the usual flow of electric power, or a run of such
  waves
scope: In electronics, a short sharp wave in the flow of electric power, not the beat of the heart and
  not a seed that can be eaten.
examples:
- The circuit sent out a pulse every second.
- A pulse ran through the wire to the lamp.
