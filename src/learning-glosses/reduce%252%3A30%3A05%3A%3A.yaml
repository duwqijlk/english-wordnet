simpleMeaning: to make a thing, such as cloth or an image, smaller in size or physical extent
scope: This is about an object or image becoming smaller in physical size, not about cutting a text short
  and not about lowering an amount, price or number.
examples:
- Washing the wool at high heat will reduce the sweater to a child's size.
- The program can reduce the image without losing sharpness.
