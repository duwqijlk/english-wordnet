senseId: 'debt_of_honor%1:21:01::'
synsetId: 92437332-n
simpleMeaning: a spoken promise to pay money, above all for a lost bet, that the law cannot force, but
  that a person's good name is held to make them pay
scope: A promise to pay that the law cannot enforce, not a bill a court can make a person pay, and not
  a debt written down in a contract.
examples:
- He lost the bet and said the debt of honor would be paid by Friday.
- A debt of honor rests on a man's word, not on a court order.
