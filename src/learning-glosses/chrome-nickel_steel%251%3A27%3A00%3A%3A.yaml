simpleMeaning: a kind of metal, sold as Elinvar, used for watch springs because its springiness stays
  the same over a wide range of heat and cold
scope: A kind of metal, sold as Elinvar, used for watch springs because its springiness stays the same
  over a wide range of heat and cold; not ordinary iron and not a metal that bends easily with heat.
examples:
- Chrome-nickel steel keeps a watch spring true in heat and cold.
- The spring was cut from chrome-nickel steel.
