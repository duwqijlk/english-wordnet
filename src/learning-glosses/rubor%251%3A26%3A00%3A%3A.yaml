simpleMeaning: a sore spot where the body reacts to harm or to something that stings, with pain, swelling,
  red skin and heat
scope: 'Also called inflammation and redness: a sore spot where the body reacts to harm, not a bruise
  from a knock and not a rash that spreads.'
examples:
- Rubor set in around the cut within an hour.
- The rubor on her arm showed pain, swelling and heat.
