simpleMeaning: A hard round cake that snaps when you bite it and tastes of a hot pale root
scope: Also called a ginger snap, gingersnap, or snap, this is a hard round cake with a hot root taste,
  not a soft cake and not a plain biscuit without spice.
examples:
- She dunked a ginger nut in her tea.
- The ginger nuts were crisp and hot with spice.
