simpleMeaning: a very big, loose group of stars of the same kind of light, all fairly young
scope: A very big, loose group of young stars of the same kind, not a tight star cluster and not a galaxy.
examples:
- The stellar association spans hundreds of light-years.
- Astronomers found a new stellar association of young blue stars.
