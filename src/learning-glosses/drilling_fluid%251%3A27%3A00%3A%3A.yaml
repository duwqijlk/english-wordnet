simpleMeaning: A mix of clays, chemicals and water, pumped down the drill pipe to slick and cool the bit
  and wash out the cut bits and firm the hole's sides.
scope: This sense is also called drilling mud, for a mix of clays, chemicals and water, pumped down the
  drill pipe to slick and cool the bit and wash out the cut bits and firm the hole's sides.
examples:
- Drilling fluid cooled the bit.
- They pumped drilling fluid down the pipe.
