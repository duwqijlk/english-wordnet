senseId: 'deregulation%1:04:00::'
synsetId: 00806998-n
simpleMeaning: the taking away of rules, especially rules made by a government, that control how something
  is done
scope: This is the act of taking rules away from a business or activity, not the rules themselves and
  not the breaking of a single rule.
examples:
- Deregulation of the airlines made plane tickets cheaper.
- The government began the deregulation of the phone market in the 1980s.
