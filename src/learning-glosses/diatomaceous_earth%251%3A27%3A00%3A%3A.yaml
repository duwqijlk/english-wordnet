simpleMeaning: A light soil made of the glass-like remains of tiny water plants, often used to strain
  liquids
scope: This is a light soil made of the glass-like remains of tiny water plants, often used to strain
  liquids; diatomite and kieselguhr are other names for it, not garden soil and not sand from a beach.
examples:
- Diatomaceous earth is spread in the filter to strain the water.
- The gardener mixed diatomaceous earth into the soil.
