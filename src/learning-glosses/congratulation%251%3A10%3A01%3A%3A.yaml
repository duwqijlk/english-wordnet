simpleMeaning: Words of joy, usually in the plural, said to a person on their good luck or success.
scope: These are words of joy said to a person on their good luck, not the act of saying them.
examples:
- I sent them my sincere congratulations on their marriage.
- She offered her congratulations to the winner.
