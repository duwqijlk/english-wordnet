simpleMeaning: a deal where firms that cover loss pass on part of the risk they took on to other firms,
  and give them part of the fee the buyer paid
scope: One firm passes part of the risk it has taken on to other firms, not a firm taking on a buyer's
  risk for the first time and not a buyer paying for cover.
examples:
- The small firm used reinsurance to pass part of the risk to bigger firms.
- Reinsurance lets one firm share the risk with other firms.
