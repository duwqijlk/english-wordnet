simpleMeaning: a way in for carriages that goes through a building to a closed yard inside it
scope: This is a way in for carriages that goes through a building to a closed yard inside, not a roof
  that sticks out from a building door to cover people getting in and out of vehicles.
examples:
- The carriage drove through the porte-cochere into the enclosed courtyard behind the house.
- Guests arrived by carriage through the porte-cochere and stopped in the courtyard inside the building.
