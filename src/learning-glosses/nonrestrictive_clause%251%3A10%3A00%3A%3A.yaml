senseId: 'nonrestrictive_clause%1:10:00::'
synsetId: 06326447-n
simpleMeaning: In grammar, a dependent group of words with a verb that does not narrow what the noun group
  it goes with means
scope: In grammar, a dependent group of words with a verb that does not narrow the noun group; also called
  descriptive clause, not a group of words that limits what the noun means and not a full sentence.
examples:
- In 'My brother, who lives in York, is a teacher', 'who lives in York' is a nonrestrictive clause.
- A nonrestrictive clause can be left out without changing what the noun means.
