simpleMeaning: in a way that shows no care at all that other people are hurt or suffer
scope: Doing something with no care that others are hurt; not doing it in a kind or careful way.
examples:
- The gang ruthlessly attacked anyone who tried to stop them.
- He ruthlessly fired long-serving workers with no warning.
