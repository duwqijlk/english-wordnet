simpleMeaning: A tree from two kinds crossed, most often not hanging down much in the way it grows.
scope: This is a cross-bred tree that most often does not hang down much, also called Salix blanda, Salix
  pendulina and Salix pendulina blanda, not the strongly hanging willow.
examples:
- The Wisconsin weeping willow by the pond stands quite upright.
- The Wisconsin weeping willow in the park is a cross of two kinds and stays mostly upright.
