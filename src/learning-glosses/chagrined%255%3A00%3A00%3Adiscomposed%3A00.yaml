simpleMeaning: feeling not comfortable, worried about how you look to others, or ashamed, or made to feel
  that way
scope: 'Also called embarrassed and abashed: feeling uneasy or ashamed about yourself, not feeling angry
  and not feeling proud.'
examples:
- He was chagrined at the poor sales of his book.
- She felt chagrined when she forgot her friend's name in front of everyone.
