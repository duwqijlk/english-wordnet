synsetId: 14141905-n
simpleMeaning: A severe sugar illness starting early, with much water passed, great thirst, more hunger,
  weight loss, and acid blood at times; diet and insulin shots are needed to control it.
scope: Not type II diabetes or the diabetes of pregnancy; also called autoimmune diabetes, growth-onset
  diabetes, insulin-dependent diabetes mellitus, juvenile-onset diabetes, juvenile diabetes, ketoacidosis-prone
  diabetes, ketosis-prone diabetes, and IDDM.
examples:
- Type I diabetes starts early in life.
- She takes insulin every day for type I diabetes.
