senseId: 'incandesce%2:30:00::'
synsetId: 00573098-v
simpleMeaning: to start to shine brightly because of great heat
scope: To start to shine brightly because of great heat, on its own; not to make something else shine,
  and not merely to grow warm.
examples:
- The metal began to incandesce in the furnace.
- The wire will incandesce when the current passes through it.
