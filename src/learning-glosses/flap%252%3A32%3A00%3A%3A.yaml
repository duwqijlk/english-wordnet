simpleMeaning: to say sounds made with the tongue close to the ridge behind the top teeth, using one quick
  touch of the tongue there
scope: To say certain tongue sounds with one quick touch, not to move up and down in the air and not a
  piece of tissue or a covering.
examples:
- In American English, many speakers flap the t in the word water.
- She flapped the t sound when she said the word quickly.
