simpleMeaning: Any of several red or white drinks made around the city in France of that name, or drinks
  like them.
scope: 'Also called Bordeaux: it names red or white wines from the area around Bordeaux in France, and
  wines made elsewhere in that same style, set apart from other French wines by the place they come from.'
examples:
- We drank a Bordeaux wine with dinner.
- This Bordeaux wine is from France.
