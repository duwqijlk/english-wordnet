schema: oewn-learning-gloss-v2
senseId: 'mistrust%2:31:00::'
synsetId: 00689827-v
simpleMeaning: To look at a person as one you cannot trust, with doubt in your mind and no faith in what
  they say or do
scope: To think of a person as one you cannot trust; suspect and distrust are other names for this sense,
  and it is not the same as disliking someone.
examples:
- He mistrusted the stranger from the start.
- She mistrusted every promise he made.
