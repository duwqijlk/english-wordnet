simpleMeaning: A part of the study of the mind that measures how the mind works
scope: 'Psychometry and psychometrics are other names for this sense: a part of the study of the mind
  that measures how the mind works, not the study of the mind in general.'
examples:
- Her psychometrika course covered tests of memory and attention.
- Psychometrika helps doctors measure how well a child's mind works.
