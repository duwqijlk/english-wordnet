simpleMeaning: A member of an Algonquian people who once lived in Maryland between Chesapeake Bay and
  the Potomac river, and were allies of the Nanticoke people.
scope: This is a member of an Algonquian people who once lived in Maryland, and allies of the Nanticoke
  people; near kinds are members of other Algonquian peoples of the same lands.
examples:
- The Conoy once lived in Maryland between the bay and the river.
- A Conoy man was an ally of the Nanticoke people.
