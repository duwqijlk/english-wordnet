simpleMeaning: To destroy the small horn buds of cattle before they grow into horns.
scope: To destroy young cattle's small horn buds, not to cut off grown horns and not to trim the hooves.
examples:
- The farmer will disbud the calves this week.
- They disbud young cattle before the horns grow.
