simpleMeaning: a person who holds an officer rank given by the state in the United States Navy or the
  United States Coast Guard, below lieutenant junior grade
scope: This is a person with a low officer rank in the United States Navy or Coast Guard; it is not a
  national flag used as a sign and not the flags flown by a ship to show its country.
examples:
- The young ensign reported to the captain on his first day at sea.
- She became an ensign in the Coast Guard after she finished her training.
