simpleMeaning: a cloth cover that you put over a pillow.
scope: This sense is not a carrying container and not a natural body covering; it is the fabric cover
  for a pillow.
examples:
- She slipped a clean pillow case over the pillow.
- He washed the pillow cases with the sheets.
