simpleMeaning: a sticky plant juice used to make drugs, glue, and patterns on cloth
scope: A sticky plant juice used in making drugs, glue, and cloth patterns; not a glue on its own, and
  not a food.
examples:
- Tragacanth helps the ink stay on the cloth in printing.
- The chemist used tragacanth to bind the pills.
