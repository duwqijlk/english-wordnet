scope: Also called a round-leaved rein orchid, it grows from north Oregon and Montana across Canada to
  the eastern United States, with two oval or round leaves lying flat on the ground.
examples:
- Habenaria orbiculata grows between two round leaves on the ground.
- The Habenaria orbiculata by the trail has green-white flowers.
