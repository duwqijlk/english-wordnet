simpleMeaning: A shrub of central and south-east Europe that lives partly off beeches, chestnuts and oaks.
scope: 'Also called mistletoe: a shrub of central and south-east Europe that lives partly off other trees,
  not a shrub that feeds itself alone and not a shrub of the far north.'
examples:
- Loranthus europaeus grew on an oak, living partly off the tree.
- We found Loranthus europaeus on a chestnut in south-east Europe.
