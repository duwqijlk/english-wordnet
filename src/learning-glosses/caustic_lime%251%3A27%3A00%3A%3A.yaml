simpleMeaning: a substance that burns the skin, made by heating limestone
scope: 'Also called calcium hydrate, calcium hydroxide, hydrated lime, lime, and lime hydrate: a substance
  that burns the skin and is made by heating limestone, not the raw limestone itself and not a mild building
  powder.'
examples:
- Caustic lime must be kept dry, as it burns the skin.
- The builder mixed caustic lime with water before use.
