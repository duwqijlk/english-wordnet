simpleMeaning: 'A percussion instrument: a hollow, dried cactus branch filled with pebbles and closed
  at both ends; tipped, it mimics falling rain, and Chilean tribes shook it in ceremonies for rain.'
scope: The instrument itself, not the rain-bringing ceremony it served in; and not merely any rattle,
  since the falling-rain sound is what defines it.
examples:
- She tipped the rain stick and listened to the pebbles patter like rain.
- The market stall sold rain sticks made from hollow cactus branches.
