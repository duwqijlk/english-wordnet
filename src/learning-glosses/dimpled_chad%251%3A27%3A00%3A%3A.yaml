senseId: 'dimpled_chad%1:27:00::'
synsetId: 14859987-n
simpleMeaning: A small piece of paper from a punched card that has a dent in it but is still joined at
  all four corners.
scope: A punched-card piece dented but still joined at all four corners, also called a dimple; not a piece
  fully punched out and not a hanging piece.
examples:
- The dimpled chad stayed in the card at all four corners.
- A dimpled chad shows a dent where the punch pressed it.
