simpleMeaning: Feeding a person who cannot or will not eat by sending liquid food into the body, as through
  a tube in the nose
scope: This is feeding a person who cannot or will not eat by sending liquid food into the body; forced
  feeding is another name for this sense, not ordinary eating and not feeding through a vein.
examples:
- The baby needed gavage because she could not swallow.
- Nurses gave him gavage through a tube in his nose.
