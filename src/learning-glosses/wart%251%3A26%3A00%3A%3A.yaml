senseId: 'wart%1:26:00::'
synsetId: 14488467-n
simpleMeaning: a flaw in a person or thing, especially a small or ugly one, that makes people think of
  a small raised mark on the skin
scope: A flaw that people compare to a skin mark, not a real raised mark on the skin itself caused by
  a virus.
examples:
- The cracked wall was a wart on the fine old house.
- The report described the delay as a wart on the company's record.
