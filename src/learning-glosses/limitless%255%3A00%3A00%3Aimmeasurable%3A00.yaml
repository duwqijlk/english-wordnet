senseId: limitless%5:00:00:immeasurable:00
synsetId: 01502766-s
simpleMeaning: with no end in how far it goes, how big it is, or how much there is
scope: With no end in how far it goes, how big it is, or how much there is; not merely very large, but
  without any end at all, and not the sense of only seeming to have no end.
examples:
- They gazed at the limitless vastness of the sky.
- The limitless desert stretched to the horizon.
