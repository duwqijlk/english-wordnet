simpleMeaning: This central office sets the rules for what the United States government buys, the land
  and buildings it owns, and the facts it keeps.
scope: Also called GSA; a central office that sets rules for the United States government, not a state
  office and not a private firm.
examples:
- The General Services Administration sets the rules for what the government buys.
- The General Services Administration manages the land and buildings the government owns.
