simpleMeaning: A liquid fatty acid with several double bonds in its chain, found in large amounts in plant
  fats and oils, needed for nutrition and used to make soap.
scope: Linolic acid is another name for this same fatty acid, not a different one such as linolenic acid.
examples:
- Linoleic acid is abundant in many plant oils.
- Soap makers use linoleic acid along with other fatty acids.
