simpleMeaning: A drug that blocks an enzyme which breaks down chemicals that affect mood, sold as Marplan,
  used to treat deep sadness that is an illness.
scope: A drug that blocks an enzyme that breaks down mood chemicals, sold as Marplan, used to treat deep
  sadness that is an illness; not a drug that lifts mood for a short time and not a sleeping pill.
examples:
- The doctor gave her isocarboxazid for her deep sadness.
- Isocarboxazid, sold as Marplan, helped lift his long low mood.
