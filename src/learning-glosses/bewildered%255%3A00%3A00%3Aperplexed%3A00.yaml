senseId: bewildered%5:00:00:perplexed:00
synsetId: 01770645-s
simpleMeaning: puzzled and unable to think clearly because many things you face or hear do not agree with
  each other
scope: 'Also called lost, confused, and baffled: puzzled because many things do not agree, not just unsure
  about one small thing.'
examples:
- He looked bewildered by all the different answers he was given.
- She felt bewildered on her first day, with so many new rules to learn.
