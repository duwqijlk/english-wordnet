simpleMeaning: a quick change in how bright something is; a short flash of light
scope: Also called twinkle, this is a quick change in brightness or a short flash of light. It is not
  wine or water with gas bubbles in it.
examples:
- We watched the sparkling of the stars in the night sky.
- The sparkling of light on the sea was quick and bright.
