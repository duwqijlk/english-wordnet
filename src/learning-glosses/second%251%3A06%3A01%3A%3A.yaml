simpleMeaning: an item with small flaws that is usually sold at a lower price and without a brand name.
scope: This sense is not a person, a unit of time, a gear, or a speech supporting a motion; it refers
  to imperfect goods sold cheaply.
examples:
- The shop sells factory seconds at half the usual price.
- She bought a pair of seconds with a tiny scratch on one heel.
