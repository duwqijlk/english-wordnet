simpleMeaning: Small soft sea animals with no hard shell of their own, living in empty shells left by
  sea snails.
scope: Small soft sea animals living in empty sea-snail shells; not a sea animal with its own hard shell,
  and not a land animal that hides in shells.
examples:
- A hermit crab moved into a bigger empty shell on the beach.
- Hermit crabs hide in cast-off shells to protect their soft bodies.
