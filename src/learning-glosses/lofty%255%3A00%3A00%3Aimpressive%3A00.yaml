simpleMeaning: grand and noble in looks or bearing, worthy of great respect
scope: Grand and noble in looks or bearing; proud, majestic and gallant are other names for this sense,
  not the sense of high moral value, and not simply tall.
examples:
- The lofty ships sailed into the harbour.
- They admired the lofty cities of the old empire.
