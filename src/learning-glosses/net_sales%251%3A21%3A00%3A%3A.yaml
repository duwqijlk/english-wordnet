senseId: 'net_sales%1:21:00::'
synsetId: 13282006-n
simpleMeaning: Gross sales minus customer discounts, returns, freight out, and allowances
scope: The figure counts only what is left after price cuts, goods sent back, sending costs, and money
  allowed back are taken off the gross takings, not the full takings before those are taken off.
examples:
- After price cuts and returns are taken off, net sales are what is left.
- Goods sent back and money allowed back are taken off in net sales.
