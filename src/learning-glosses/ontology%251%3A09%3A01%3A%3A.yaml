simpleMeaning: In computer science, a thorough, complete ordering of what is known about one subject,
  usually in levels, holding all its things and how they relate.
scope: 'For computer science only: the ordering of one subject''s knowledge, with its things and how they
  relate.'
examples:
- The ontology lists every part and how the parts relate.
- They built an ontology for the hospital's records.
