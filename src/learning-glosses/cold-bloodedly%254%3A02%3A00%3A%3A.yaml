simpleMeaning: Without feeling or pity, and with planned cruelty.
scope: This is doing a cruel thing without feeling or pity, and with planned cruelty; in cold blood is
  another name for it, not a hot angry act and not a careless mistake.
examples:
- He cold-bloodedly planned the murder of his boss.
- She cold-bloodedly left him with nothing.
