simpleMeaning: not able to give up part of what you want so you and others can agree, and not able to
  change
scope: 'Also called strict: this is about a person or a view that cannot give up part of what it wants
  to agree with others. It is not about a thing that will not bend, and not about not changing to fit
  what is needed.'
examples:
- He was too rigid to meet the workers part way.
- Her rigid views left no room for agreement with anyone else.
