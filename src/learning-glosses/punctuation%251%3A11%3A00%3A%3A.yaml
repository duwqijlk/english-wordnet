simpleMeaning: something that again and again breaks a flow or a stretch into parts, in a regular way
scope: This sense is a thing that breaks a flow or a stretch into parts again and again, not the marks
  used in writing and not the act of using those marks.
examples:
- The bell was the punctuation of our school day, breaking it into parts at the same times each day.
- The drums gave the song its punctuation, marking regular breaks in the music.
