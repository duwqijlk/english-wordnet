simpleMeaning: one of a set of musical tones, each with a rate of shaking that is a whole number of times
  the rate of the lowest tone
scope: It names a tone in this set, not a way of describing sounds that go well together, and not the
  study of how musical sounds are made.
examples:
- The second harmonic of the string sounded higher than the main note.
- You can hear a soft harmonic when the guitar string is touched lightly.
