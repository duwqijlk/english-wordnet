simpleMeaning: any of many plants of the daisy family, above all of the kinds called Carduus, Cirsium,
  and Onopordum, with leaves that have sharp points along the edge
scope: Any of many plants of the daisy family, above all of the kinds called Carduus, Cirsium, and Onopordum,
  with leaves that have sharp points along the edge; not a rose, and not a plant with smooth leaves.
examples:
- Thistles grew thick along the edge of the field.
- She pricked her hand on a thistle while picking flowers.
