simpleMeaning: The life energy Chinese thought says flows through all things; old Chinese medicine says
  health needs its two opposite forms to stay in balance in the body
scope: The life energy Chinese thought says flows through all things; ki, chi and qi are other names for
  this sense, not a god and not a medicine you take.
examples:
- Ch'i is said to flow through all things.
- He tried to keep his ch'i in balance with slow exercise.
