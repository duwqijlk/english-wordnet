simpleMeaning: the act of saying what will happen in the future, by thinking and reasoning about it
scope: This is the act of saying, after thinking, what will happen in the future; it is not a single statement
  that says what will happen, and it is not the thing that later happens.
examples:
- Her prediction of the election result came from studying the numbers for weeks.
- The team's prediction of next year's sales took a week of studying past sales.
