simpleMeaning: One of several parallel slats in a door or window that let air in while keeping rain out.
scope: This is the slat in a door or window, not a swimming shoe, a car ornament, or a fish's body part.
examples:
- Each fin in the door was set at the same angle.
- The glass fins of the louvered window let in air but kept out rain.
