simpleMeaning: Above all in meat and fish, this salt keeps food fresh and coloured, though it may help
  make stuff that can cause cancer.
scope: Among salts that keep food, this one keeps meat and fish fresh and coloured.
examples:
- Sodium nitrite in the ham kept it from going bad and kept its colour.
- Sodium nitrite in cured meat may help make things that cause cancer.
