simpleMeaning: a long narrow piece of land that juts out from a larger area
scope: A strip of land, not the part of the body joining the head to the shoulders or the opening of a
  garment.
examples:
- A narrow neck of land links the island to the shore.
- The farm sits on a neck of land between two rivers.
