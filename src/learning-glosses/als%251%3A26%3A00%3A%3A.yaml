simpleMeaning: A disease in which tissue in the cord that carries movement orders grows thick, so muscles
  waste away more and more, starting in the arms and legs.
scope: A disease that thickens tissue in the cord carrying movement orders, also called amyotrophic lateral
  sclerosis and Lou Gehrig's disease; not a sudden injury and not a weakness of one muscle only.
examples:
- ALS made his hands weak.
- She was told she had ALS.
