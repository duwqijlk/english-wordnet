senseId: 'monoatomic%3:01:00::'
synsetId: 02896070-a
simpleMeaning: describing an element made of single atoms, each one on its own, not joined to others
scope: 'Also called monatomic: said of an element made of single atoms, not of an element made of joined
  atoms and not of one atom itself.'
examples:
- Helium is a monoatomic gas, made of single atoms.
- Argon stays monoatomic even when it is heated.
