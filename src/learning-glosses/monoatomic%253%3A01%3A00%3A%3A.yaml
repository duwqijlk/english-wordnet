simpleMeaning: Single atoms, each one on its own, are what this stuff is made of
scope: 'Also called monatomic: said of a stuff made of single atoms, not of a stuff made of joined atoms
  and not of one atom itself.'
examples:
- Helium is a monoatomic gas, made of single atoms.
- Argon stays monoatomic even when it is heated.
