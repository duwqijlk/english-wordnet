senseId: 'southwest_by_south%1:24:00::'
synsetId: 13855959-n
simpleMeaning: The compass point one step anticlockwise from the point halfway between the setting sun
  and the direction opposite north
scope: A compass point one step anticlockwise from the south-west point, not that point itself and not
  the point two steps away.
examples:
- The wind shifted to southwest by south.
- Southwest by south is one point south of southwest.
