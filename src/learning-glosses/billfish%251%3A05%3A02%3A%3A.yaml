simpleMeaning: A long, thin, top-swimming hunting fish of Europe, its long jaws lined with teeth, thick
  in shore waters.
scope: This sense is also called gar and needlefish, a long, thin, top-swimming hunting fish of Europe,
  its long jaws lined with teeth, thick in shore waters, where gar is a long, thin European fish that
  swims near the surface and hunts with toothed long jaws, thick near the shore, unlike the sense for
  a giant warm-water game fish having a prolonged and rounded toothless upper jaw, unlike the sense for
  a slender long-beaked fish of temperate Atlantic waters, and unlike the sense for a primitive predaceous
  North American fish covered with hard scales and having long jaws with needlelike teeth.
examples:
- Billfish swim near the surface in Europe.
- The billfish hunts with toothed long jaws.
