simpleMeaning: to stop living, when all the parts of the body stop working and can no longer keep a person
  alive
scope: This is also called die, go, pass, exit and croak, and it means to stop living, not to press on
  a throat and not to struggle to breathe.
examples:
- After a long and quiet life, the old man choked in his sleep and was buried the next week.
- She sat with her sick father through his last night, afraid he would choke before morning.
