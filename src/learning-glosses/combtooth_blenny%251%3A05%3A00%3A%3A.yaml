simpleMeaning: A small fish with a close row of small points in its mouth and usually no scales, living
  by rocky shores and guarding a hole between rocks
scope: This is a small fish of rocky shores, not a deep-sea fish or an eel; also called a blenny.
examples:
- The combtooth blenny hid in a hole between the rocks.
- We saw a combtooth blenny guarding its hole on the rocky shore.
