simpleMeaning: Something described this way causes a strong feeling of respect and amazement, or of great
  admiration.
scope: It is about a strong feeling of respect or admiration, not something merely nice or enjoyable.
examples:
- The view from the mountain top was awesome.
- She gave an awesome performance that silenced the crowd.
