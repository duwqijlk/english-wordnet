simpleMeaning: The bit cut when an editor trims a written text.
scope: The bit cut when an editor trims a written text; also called cut or deletion; not the act of casting
  a church member out from the communion of believers and the church's gifts, cutting one off from a holy
  body, nor the act of pulling up or out, uprooting, cutting off from life, nor the cutting out of a body
  part or tissue.
examples:
- Their excision cut at dawn.
- The excision was seen at noon.
