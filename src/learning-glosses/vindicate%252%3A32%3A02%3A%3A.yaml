schema: oewn-learning-gloss-v2
senseId: 'vindicate%2:32:02::'
synsetId: 00906643-v
simpleMeaning: to keep something as it is, and to support and defend it
scope: This sense is about keeping something as it is and supporting and defending it; it is not about
  showing that a person did nothing wrong after blame or doubt.
examples:
- He spoke in court to vindicate the rights of the citizens.
- They worked hard to vindicate the right to speak freely.
