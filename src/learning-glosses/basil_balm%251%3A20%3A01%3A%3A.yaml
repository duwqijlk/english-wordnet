simpleMeaning: A herb that lives for years in North America, from New York to Illinois and the mountains
  of Alaska, with fragrant leaves and clusters of yellowish-pink balls.
scope: This North American herb with ball-shaped yellowish-pink flower clusters; not the European mint
  that shares the name.
examples:
- Basil balm grows wild from New York to Illinois.
- The basil balm's leaves are fragrant when crushed.
