simpleMeaning: A large conifer of the southeastern United States with needles in threes, very long needles
  and bent, twisted limbs, red-brown bark deeply ridged, and wood much used for timber.
scope: Also called longleaf pine, pitch pine, southern yellow pine and Georgia pine; a large conifer of
  the southeastern United States with needles in threes and very long needles, its red-brown bark deeply
  ridged and its wood much used for timber.
examples:
- Pinus palustris stood tall in the southern wood, its long needles sweeping the ground.
- The timber of Pinus palustris built many houses in the region.
