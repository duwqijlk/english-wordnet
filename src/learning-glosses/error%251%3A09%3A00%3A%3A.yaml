simpleMeaning: a wrong idea that a person has because the information they got was not right
scope: A wrong idea that comes from information that is not right; not a wrong action, not a mistake in
  baseball, and not bad acts that break rules of right and wrong.
examples:
- His error about who wrote the book came from wrong information on the first page.
- The error in her thinking came from a false report she had read.
