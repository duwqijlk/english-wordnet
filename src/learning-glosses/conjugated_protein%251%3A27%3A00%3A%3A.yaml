simpleMeaning: A body-building substance made of small building blocks called amino acids, joined together
  with other substances.
scope: Also called compound protein; a body-building substance made of amino acids joined together with
  other substances, not a single substance on its own.
examples:
- A conjugated protein carries iron through the blood.
- Haemoglobin is a conjugated protein.
