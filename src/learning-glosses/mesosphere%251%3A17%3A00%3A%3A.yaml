simpleMeaning: Above the stratosphere and below the thermosphere lies this layer of the air around the
  earth
scope: A layer of air between the stratosphere below and the thermosphere above, not the lowest layer
  and not the topmost one.
examples:
- The mesosphere lies above the stratosphere and below the thermosphere.
- Meteors burn up as they pass through the mesosphere.
