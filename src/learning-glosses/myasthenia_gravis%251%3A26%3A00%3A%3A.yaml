simpleMeaning: A chronic, worsening disease marked by lasting tiredness and weak muscles, especially in
  the face and neck, arising from too little of a chemical messenger where nerves meet muscles.
scope: Another name for myasthenia, the same long-term muscle-weakening disease; not muscular dystrophy
  or ordinary fatigue.
examples:
- Myasthenia gravis causes lasting tiredness and weak face and neck muscles.
- In myasthenia gravis, the face and neck muscles are especially weak.
