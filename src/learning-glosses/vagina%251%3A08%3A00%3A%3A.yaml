simpleMeaning: The lower part of the female body system for making babies; a wet passage in female mammals
  from the small inner folds at its opening to the womb
scope: This sense is the wet passage that leads to the womb, not the womb itself and not the outer folds
  at its opening.
examples:
- The vagina is a wet passage that leads to the womb.
- A baby passes through the vagina when it is born.
