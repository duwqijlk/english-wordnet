simpleMeaning: When two lower folds in the throat meet to make the sound slit, lung air running between
  them as they close gives a voice tone.
scope: Also called inferior vocal cord, inferior vocal fold, and true vocal fold, this lower fold in the
  throat meets its pair so that lung air gives a voice tone.
examples:
- The true vocal cord met its pair as she began to speak.
- His true vocal cords sounded as the air passed between them.
