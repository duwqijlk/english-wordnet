simpleMeaning: children being born to parents of different races, especially to a white parent and a non-white
  parent
scope: 'Also called miscegenation: children born to parents of different races, not the mixing of different
  kinds of animals or plants to make new kinds.'
examples:
- Crossbreeding between white and Black families was once against the law in some places.
- The book talks about crossbreeding between people of different races in the early town.
