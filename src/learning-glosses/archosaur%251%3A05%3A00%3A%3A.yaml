simpleMeaning: Long-dead creeping animals, made up of the dinosaurs, the plesiosaurs, the pterosaurs,
  the ichthyosaurs, and the thecodonts.
scope: It is also called archosaurian and archosaurian reptile, and it names the group of long-dead creeping
  animals that holds the dinosaurs, the plesiosaurs, the pterosaurs, the ichthyosaurs, and the thecodonts,
  not the creeping animals alive today.
examples:
- The archosaur group holds the dinosaurs and the pterosaurs.
- Archosaurs died out long before people lived.
