simpleMeaning: the hole in a piece of clothing where a person's head comes through, and the edge around
  it
scope: The opening and edge of a garment for the head, not a narrow part of an object and not the act
  of kissing.
examples:
- The sweater has a loose neck that slips off her shoulders.
- She sewed a ribbon around the neck of the dress.
