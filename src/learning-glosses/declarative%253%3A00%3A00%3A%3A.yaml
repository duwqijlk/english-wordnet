simpleMeaning: about making a clear statement, or having the form of a clear statement
scope: About making or being a clear statement in general; not the grammar noun for a verb mood, and not
  the grammar sense about verb forms used in statements.
examples:
- She gave a short declarative statement about the new plan.
- The title is written in a clear, declarative style.
