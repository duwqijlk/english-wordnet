simpleMeaning: A herb with leaves at the base and hairy, leafy stems, each bearing a single flower head
  with white or pale cream rays, from the northwestern United States.
scope: A herb of the northwestern United States whose stems each carry a single flower head with white
  or pale cream rays. It is not the yellow-rayed plants also called mule's ears. The name is a botanical
  one, used in floras of the region.
examples:
- White-rayed mule's ears grew in the dry meadow above the river.
- On the ridge we found white-rayed mule's ears in flower.
