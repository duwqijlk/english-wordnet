simpleMeaning: to show something in a strong way, as people do in a play
scope: 'Also called dramatise: this is showing a thing in a strong, exciting way, not turning a story
  into a play or film.'
examples:
- These pictures dramatize how hard life is for people with no clean water.
- A short film dramatized the need for road safety.
