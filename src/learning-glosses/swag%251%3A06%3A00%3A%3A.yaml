simpleMeaning: A bundle holding the things a person who walks from place to place carries with them.
scope: A bundle holding the things a travelling worker carries, not the verb use for drooping or sinking,
  not stolen goods, not a heavy unsteady sway, and not a walk that cannot be held steady.
examples:
- The swagman tied his swag to his back.
- He rolled his swag and set off down the road.
