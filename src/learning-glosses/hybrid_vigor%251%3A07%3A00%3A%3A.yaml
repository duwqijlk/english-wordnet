senseId: 'hybrid_vigor%1:07:00::'
synsetId: 04929774-n
simpleMeaning: In genetics, a cross of two different kinds gives young with stronger points than either
  parent has.
scope: In genetics, this tendency of a cross between two different kinds to beat either parent is also
  called heterosis.
examples:
- The hybrid vigor of the plant made it grow better than either parent.
- The hybrid vigor of the mule made it stronger than either parent.
