simpleMeaning: Deep in the earth, places with the same heat are joined by a mark on a map
scope: A mark on a map joining places deep in the earth of equal heat; not a mark joining places of equal
  magnetic strength and not a mark joining places on the earth's surface.
examples:
- The isogeotherm on the map joins points of equal temperature underground.
- Geologists drew an isogeotherm through the mine.
