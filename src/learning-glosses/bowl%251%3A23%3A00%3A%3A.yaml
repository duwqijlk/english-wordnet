simpleMeaning: The amount that fills a round, open-topped dish.
scope: This is the quantity a dish holds, also called a bowlful, not the open-topped dish itself.
examples:
- He ate two bowls of rice and asked for more.
- The recipe calls for a bowl of sugar.
