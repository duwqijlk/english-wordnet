simpleMeaning: The malt and grain left in the mash-kettle after mashing and lautering.
scope: The malt and grain left in the kettle after soaking and drawing off are also called brewer's grain
  and spent grain.
examples:
- The farmer took the draff home to feed his cows.
- They cleared the draff from the kettle after the liquid had been drawn off.
