simpleMeaning: having a meaning that you cannot see, hear, or work out with plain thought, and that goes
  past what most people can understand
scope: 'Also called secret, mysterious, mystic, mystical and orphic: this describes a hidden meaning past
  normal understanding, not the noun sense about magic practices and forces, and not the verb sense about
  hiding a star or planet.'
examples:
- The book is full of occult symbols that few readers can understand.
- She studied the occult meaning hidden in the old signs.
