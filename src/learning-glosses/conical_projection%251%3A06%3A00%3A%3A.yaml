senseId: 'conical_projection%1:06:00::'
synsetId: 03095312-n
simpleMeaning: A way of drawing the earth on a flat map by laying it on a pointed shape with its tip over
  one of the poles.
scope: Also called conic projection; a way of drawing the earth on a flat map from a pointed shape, not
  a drawing on a flat sheet and not a drawing on a round ball.
examples:
- A conical projection suits maps of the middle latitudes.
- The atlas uses a conical projection for North America.
