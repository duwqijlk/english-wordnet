simpleMeaning: A fastener of a peg, pin or crosspiece through an eye at the end of a rope, chain or cable,
  joining it to something else such as another rope.
scope: A mechanical fastening device for rope, chain or cable. It is not the small bar sewn as a coat
  button, nor the on-off switch on a machine or program.
examples:
- He pushed the toggle through the eye of the halyard and pulled the line tight.
- The old harness used a wooden toggle instead of a metal buckle.
