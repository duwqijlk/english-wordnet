simpleMeaning: to give something a form that follows a particular fashion or trend
scope: This is making a thing conform to a trend, not calling someone or something by a name, and not
  correcting a text to follow spelling and punctuation rules.
examples:
- She styled her hair for the party.
- The designer styled the set to look like a 1970s lounge.
