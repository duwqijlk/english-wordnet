simpleMeaning: a person who copies how another person looks, sounds, or moves, especially an actor
scope: A person who copies others, especially an actor, not the act of copying and not a copy of a thing.
examples:
- The mimic made the whole room laugh with his take on the teacher.
- As a young mimic, she learned to copy famous singers.
