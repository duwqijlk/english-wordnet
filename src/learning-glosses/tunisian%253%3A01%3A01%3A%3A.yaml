simpleMeaning: To do with Tunisia or its people.
scope: To do with the country of Tunisia or its people, not with the city of Tunis alone, and not a person
  from Tunisia.
examples:
- The Tunisian archeological sites draw visitors from all over the country.
- Tunisian law applies across the whole country.
