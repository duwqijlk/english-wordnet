simpleMeaning: a way of acting that usually shows you do not value or care for someone, and look down
  on them
scope: 'Also called contempt: a manner that usually looks down on someone and shows no respect, not a
  private feeling of dislike and not a rude word.'
examples:
- His disrespect toward the teacher shocked the class.
- She answered with disrespect and refused to listen.
