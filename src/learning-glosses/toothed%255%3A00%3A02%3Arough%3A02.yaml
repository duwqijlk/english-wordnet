simpleMeaning: An edge with small sharp points cut into it, all leaning toward the tip, like the edge
  of a saw.
scope: Not the toothed edge that looks gnawed and uneven, nor a plain sharp edge with no points at all.
examples:
- The toothed leaf had points along its edge that all leaned toward the tip.
- The toothed blade cut through the wood with its small sharp points.
