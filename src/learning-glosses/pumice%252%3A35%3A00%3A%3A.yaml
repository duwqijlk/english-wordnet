simpleMeaning: to rub something with a rough light stone, to clean it or make it smooth
scope: This is the act of rubbing with the stone to clean or make smooth, not the stone itself and not
  washing with water alone.
examples:
- She pumiced her feet to make the skin smooth.
- He pumiced the wood to clean it and make it smooth.
