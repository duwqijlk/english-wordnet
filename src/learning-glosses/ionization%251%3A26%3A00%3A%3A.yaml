simpleMeaning: The state in which something is broken into charged bits by heat, rays, a chemical change,
  or a burst of electricity.
scope: The state in which something is broken into charged bits; ionisation is another name for this sense,
  not the joining of bits together and not a gas on its own.
examples:
- Ionization of the gas let it carry an electric current.
- The ionization of the air rose as the tube grew hotter.
