simpleMeaning: a loop of cord or cloth that pulls something back and holds it there, made to look nice
scope: This is a loop of cord or cloth that pulls something back and holds it there; pullback is another
  name for this sense. Not a curtain and not a hook that holds a door open.
examples:
- She tied the tieback around the curtain to hold it to the side.
- The tieback pulled the heavy drape back from the window.
