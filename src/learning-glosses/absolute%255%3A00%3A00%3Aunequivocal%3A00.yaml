simpleMeaning: Final and settled, leaving no opening for any later change.
scope: The 'final, nothing can change it' sense, not 'complete and unrestricted', 'too binding to break',
  or 'not limited by law'.
examples:
- The agreement contains an absolute guarantee that the terms will never change.
- His refusal was absolute, and the family knew better than to ask again.
