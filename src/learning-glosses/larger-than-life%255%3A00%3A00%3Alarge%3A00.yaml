senseId: larger-than-life%5:00:00:large:00
synsetId: 01388944-s
simpleMeaning: A person or thing that stands out as great and grand, going past what is normal, most of
  all in size and scale
scope: Also called heroic and epic, this is about a person or thing that stands out as great and grand,
  not just a big object and not a brave act alone.
examples:
- The explorer was a larger-than-life figure in every tale told about him.
- Her larger-than-life laugh filled the whole hall.
