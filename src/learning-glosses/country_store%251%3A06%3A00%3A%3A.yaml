simpleMeaning: a shop serving a thinly settled area, usually holding a wide range of goods
scope: A shop serving a thinly settled area, usually holding a wide range of goods; general store and
  trading post are other names for this sense, not a town shop, and not a market stall.
examples:
- The country store stocked everything from flour to boots.
- We stopped at the country store for fuel and bread.
