simpleMeaning: A side shoot that grows flat out from the foot of a plant and makes new plants from buds
  at its ends
scope: 'Runner is another name for this sense: a flat side shoot from a plant''s base that makes new plants
  from buds at its ends, not a printed copy and not a way of making prints.'
examples:
- The strawberry plant sent out an offset that rooted a few inches away.
- She cut the offset from the mother plant and potted it.
