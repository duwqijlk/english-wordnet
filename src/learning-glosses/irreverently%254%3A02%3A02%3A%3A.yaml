senseId: 'irreverently%4:02:02::'
synsetId: 00384850-r
simpleMeaning: in a way that shows no respect for things others take seriously
scope: In a way that shows no respect for things others take seriously; not in a way that is merely rude,
  and not in a way that is meant as a joke.
examples:
- The churches were irreverently used as storehouses in the war.
- He spoke irreverently of the old rites.
