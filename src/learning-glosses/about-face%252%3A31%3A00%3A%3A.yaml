simpleMeaning: to change what you think and take the opposite view
scope: To change your mind and take the opposite view; not to turn your body around and not to change
  your mind only a little.
examples:
- After the meeting, she did an about-face and backed the plan she had fought.
- The mayor's about-face on the tax surprised everyone.
