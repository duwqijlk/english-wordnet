simpleMeaning: this thin stick, narrow at one end, is what a conductor holds to guide an orchestra or
  choir
scope: 'Also called a wand: a thin stick held by a conductor to lead players or singers, not the hollow
  stick spun by a marching band leader and not the tube passed in a relay race.'
examples:
- The conductor raised her baton and the orchestra began.
- With a flick of his baton, he brought in the choir.
