simpleMeaning: all the things that can go in the same place in a sentence, each able to take the place
  of the others
scope: All the things that can go in the same place in a sentence, also called paradigm; not a list of
  words that mean the same and not a set of words that go together in order.
examples:
- Nouns like 'dog' and 'cat' belong to one substitution class.
- In a substitution class, each word can take the place of the others.
