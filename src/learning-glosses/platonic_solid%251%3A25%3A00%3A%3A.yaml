simpleMeaning: One of five shapes whose faces are matching regular many-sided figures and whose corner
  angles all match.
scope: One of five shapes with matching regular many-sided faces and matching corner angles, also called
  an ideal solid, a regular convex polyhedron, a regular convex solid, a regular polyhedron and a Platonic
  body, not a shape with uneven faces and not a flat figure.
examples:
- A cube is one example of a Platonic solid.
- The Platonic solid called a cube has six square faces.
