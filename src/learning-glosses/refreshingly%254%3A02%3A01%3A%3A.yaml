simpleMeaning: In a way that takes away tiredness and makes one feel lively again.
scope: In a way that takes away tiredness and brings back life and strength; not in a pleasantly new and
  different way.
examples:
- A walk in the cool air left him feeling refreshingly awake.
- The drink was refreshingly cold and woke them up.
