simpleMeaning: the shoes for sport themselves, or the sharp points under them that stop the wearer from
  slipping
scope: The sharp points on sports shoes, or the shoes with those points, not a single point seen as one
  piece of sports equipment.
examples:
- The second baseman sharpened his spikes before every game.
- The golfers' spikes damaged the putting green.
