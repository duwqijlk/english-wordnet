simpleMeaning: Any of many kinds of burrowing gnawing animals that live on land in the Old and New Worlds,
  and that often eat and spoil crops
scope: This is any of many kinds of burrowing gnawing animals that live on land; gopher and spermophile
  are other names for this sense, not the small striped eastern animal with cheek pouches and not a tree
  squirrel.
examples:
- Ground squirrels dug holes all over the field.
- The ground squirrel stood up to look around before it ran to its hole.
