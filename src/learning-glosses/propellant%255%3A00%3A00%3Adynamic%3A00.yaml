simpleMeaning: That drives a thing on.
scope: This sense is also called propelling and propulsive, for driving a thing on, unlike the sense for
  being given to driving, or able to drive, and unlike the sense for any substance that drives.
examples:
- The charge was propellant, driving a thing on.
- The fuel was propellant, driving on.
