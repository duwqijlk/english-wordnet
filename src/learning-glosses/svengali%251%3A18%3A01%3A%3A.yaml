senseId: 'svengali%1:18:01::'
synsetId: 10701338-n
simpleMeaning: A person, usually one who means harm, who tries by talk or by force to get another person
  to obey them.
scope: Someone who tries to bend another person to their will, usually for harm; not an open leader or
  a friend who gives advice.
examples:
- The Svengali in the story bent the girl to his will.
- He acted like a Svengali, forcing others to obey him.
