simpleMeaning: a wheel that has long wood parts reaching out from the centre and a metal band around the
  outside
scope: This is a real wheel for a cart, with wood parts and a metal edge, not the turning movement a person
  does sideways with hands and feet on the ground.
examples:
- The old cartwheel was made of wood with a metal rim.
- One cartwheel broke as the cart went over the rough road.
