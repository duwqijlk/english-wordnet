simpleMeaning: A lichen growth that sticks tight to the surface it grows on or sinks into it, making a
  thin hard layer over that surface.
scope: This clinging kind of lichen growth stands apart from the leafy and bushy kinds.
examples:
- The crustose thallus spread over the surface it grew on.
- A crustose thallus had sunk into the surface it grew on.
