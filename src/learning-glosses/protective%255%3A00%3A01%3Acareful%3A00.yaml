senseId: protective%5:00:01:careful:00
synsetId: 00311985-s
simpleMeaning: 'usually used with ''of'': showing great care for a person or thing and thinking a lot
  about what is good for them'
scope: This means caring much about a person or thing, usually with 'of'; not about a thing made to keep
  someone safe, like a coat or a helmet.
examples:
- He is very protective of his young sister.
- She was protective of her good name and told the truth at once.
