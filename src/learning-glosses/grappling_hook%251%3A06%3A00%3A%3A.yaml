simpleMeaning: A tool with several curved points for catching and holding things, often thrown on the
  end of a rope
scope: This hooked tool is also called grapple, grapnel, grappler and grappling iron, and is not a single
  hook and not a rope on its own.
examples:
- He threw the grappling hook up to catch the ledge.
- The grappling hook caught on the rock and held fast.
