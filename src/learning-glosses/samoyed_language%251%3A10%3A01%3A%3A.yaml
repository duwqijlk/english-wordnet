simpleMeaning: The Uralic tongues spoken by the people of that name in northwestern Siberia
scope: Samoyed, Samoyedic and Samoyedic language are other names for this sense, and it is set apart from
  the dog breed and the people of the same name by being the tongues those people speak.
examples:
- Samoyed language is one of the Uralic tongues of northwestern Siberia.
- Samoyed language is spoken by the people of that name in northwestern Siberia.
