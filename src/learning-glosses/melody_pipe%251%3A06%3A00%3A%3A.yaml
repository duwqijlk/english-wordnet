simpleMeaning: A reed tube with holes for the fingers, on which the tune is played
scope: A reed tube with finger holes for playing the tune; chanter is another name for this, not a tube
  for blowing air and not a tube with keys.
examples:
- The melody pipe sounded clear in the hall.
- He played the tune on a melody pipe.
