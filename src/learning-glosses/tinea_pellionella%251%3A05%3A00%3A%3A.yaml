simpleMeaning: The young of this clothes moth live in tubes of the food they eat, held together with silk
  they spin.
scope: Also called casemaking clothes moth, this is a clothes moth whose young live in tubes of the food
  they eat, held together with silk they spin, not a moth whose young live free in the open.
examples:
- The young of Tinea pellionella live in silk tubes in the wool.
- The young of Tinea pellionella spin silk to hold their tubes together.
