simpleMeaning: 'Used in the plural: short underpants that fit close to the body; also sold under the trade
  name Jockey shorts'
scope: Short, close-fitting underpants, always in the plural form; not a short written report and not
  loose underwear such as boxer shorts.
examples:
- He packed three pairs of briefs for the trip.
- These briefs fit closely and stay in place under his trousers.
