simpleMeaning: a hard, thin part in vegetables, meat or other food that is hard to chew, especially the
  thin parts that join the two halves of a bean pod
scope: A hard thin part inside food, not a thin cord for tying things and not a group of things in a line.
examples:
- She pulled a tough string out of the celery before eating it.
- The meat was full of hard strings that were hard to chew.
