simpleMeaning: A kind of art that shows views of nature outdoors
scope: This is a kind of art about views of nature outdoors, not one single picture of such a view, and
  not the work of shaping a garden.
examples:
- Landscape was her favourite kind of art, and she loved wide views of hills.
- He studied landscape at art school and learned to paint hills and trees.
