simpleMeaning: a musical idea that comes back again and again in a piece of music, or is built on and
  changed in it
scope: 'Also called motive: a musical idea that returns in a piece of music, not a pattern of shapes or
  colors in design, and not a main idea in a book or work of art.'
examples:
- A short motif comes back again and again through the whole song.
- A simple motif opens the piece, and the composer builds on it all the way through.
