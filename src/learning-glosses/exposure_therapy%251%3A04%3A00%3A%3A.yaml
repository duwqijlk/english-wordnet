senseId: 'exposure_therapy%1:04:00::'
synsetId: 00703455-n
simpleMeaning: In a session, a person lives through a terrible event again and faces the fears and feelings
  it left, as a treatment that works on how one acts
scope: This is a treatment in which a person faces a past terrible event again in the session, not one
  that keeps the event out of mind.
examples:
- In exposure therapy, she faced the fears left by the bad event.
- He lived through the bad event again in exposure therapy.
