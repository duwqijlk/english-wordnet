simpleMeaning: The womb is got ready for pregnancy and kept ready by a body chemical of the steroid kind,
  sold as Lipo-Lutin and made in the egg-making organ.
scope: A body chemical made in the egg-making organ that gets the womb ready for pregnancy and keeps it
  ready.
examples:
- The doctor gave her progesterone to get her womb ready for pregnancy.
- Progesterone made in the ovary keeps the womb ready for pregnancy.
