simpleMeaning: in biology, a group within a species whose members differ from the rest in small inherited
  ways
scope: This is the biological grouping below a species, not a collection of different things, a show of
  unrelated performances, a kind or category of things, or the quality of being pleasantly different.
examples:
- Botanists classified the red-flowered plants as a separate variety.
- Each island has its own variety of finch.
