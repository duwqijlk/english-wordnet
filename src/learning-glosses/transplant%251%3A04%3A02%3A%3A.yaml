simpleMeaning: An act of surgery that moves an organ from one living being, the giver, to another, the
  one who gets it
scope: Moving an organ from a giver to a person who gets it in surgery; not a plant moved to new soil
  and not the moved organ itself.
examples:
- He had a kidney transplant last year.
- The transplant took five hours in the hospital.
