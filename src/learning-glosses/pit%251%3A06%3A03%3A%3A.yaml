simpleMeaning: an area in front of a stage, lower than the stage, where a group of musicians plays music
  to go with the people performing on the stage
scope: The low place in front of a stage for musicians, not the area beside a race track for cars and
  not a place dug in the ground to get stone.
examples:
- The musicians sat in the pit in front of the stage.
- From the pit, the band played while the singers performed on stage.
