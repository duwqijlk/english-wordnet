senseId: 'webbing%1:06:01::'
synsetId: 04576230-n
simpleMeaning: a narrow strip of cloth with threads woven close together, used in making soft coverings
  for chairs and other furniture or for seat belts
scope: This narrow woven strip, used for chairs and seat belts, is not the wider strong cloth sense and
  not the part that forms a web between the toes of birds.
examples:
- The old chair's seat is held up by strong webbing underneath.
- This seat belt is made from tough webbing.
