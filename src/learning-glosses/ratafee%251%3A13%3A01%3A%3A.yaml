simpleMeaning: Wine and brandy give this sweet drink its taste, along with the stones of plums, peaches,
  or apricots and bitter almonds.
scope: Also called ratafia, it is a sweet drink made from wine and brandy and flavoured with fruit stones
  and bitter almonds.
examples:
- She poured a small glass of ratafee.
- The ratafee tasted of plums and almonds.
