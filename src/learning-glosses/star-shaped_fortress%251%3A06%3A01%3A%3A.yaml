simpleMeaning: First built in Italy in the middle of the 1400s, this walled place has three-sided points
  that stick out and guard one another, five to eight in most cases.
scope: Also called bastion fort, star fort, star fortress, and trace italienne, it is a walled place with
  points that guard one another, not a plain wall with no points.
examples:
- They repaired the walls of the star-shaped fortress.
- Visitors walked the walls of the star-shaped fortress.
