simpleMeaning: A closing device that joins two rows of teeth with a tab that moves along them
scope: A closing device that joins two rows of teeth with a tab that moves along them, also called zipper,
  zip or zip fastener; not a row of buttons and not a hook-and-eye closing.
examples:
- The slide fastener on her jacket stuck halfway up.
- He pulled the slide fastener shut and zipped his coat.
