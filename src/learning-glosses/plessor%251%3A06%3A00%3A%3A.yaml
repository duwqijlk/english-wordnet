simpleMeaning: In medicine, a small hammer with a rubber head used to tap the chest and to test reflexes
scope: In medicine, a small hammer with a rubber head for tapping the chest and testing reflexes; percussor
  and plexor are other names for this sense, and this is not the metal plate it strikes.
examples:
- The doctor used a plessor to tap the patient's chest.
- With the plessor, she tested the knee reflex.
