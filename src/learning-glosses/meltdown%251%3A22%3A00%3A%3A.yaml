simpleMeaning: a time when the centre part of a nuclear reactor gets far too hot, turns to liquid, and
  radiation escapes
scope: 'Also called nuclear meltdown: this is real overheating in a nuclear reactor, not a different very
  bad event that is only compared to it.'
examples:
- The meltdown at the power plant let radiation escape.
- Engineers worked to stop a meltdown after the reactor got too hot.
