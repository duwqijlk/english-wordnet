simpleMeaning: friendliness shown by a kind and helpful way of being toward other people
scope: 'Also called helpfulness: this is a person''s warm and helpful way of being, not one single act
  of help on its own.'
examples:
- Everyone in the village knew her for her kindliness toward strangers.
- He spoke with great kindliness to the children who had lost their dog.
