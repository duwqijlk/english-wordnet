simpleMeaning: a cold mixed drink, usually with alcohol, made in a large amount for many people, and normally
  served in a large bowl
scope: This is the cold drink made for many people, not a hit with the hand and not a tool for making
  holes.
examples:
- She made a big bowl of punch for the party.
- Would you like a glass of fruit punch?
