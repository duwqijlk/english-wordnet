simpleMeaning: A ranking of metal pieces or ions by pole power, set in fixed conditions, showing how keen
  one metal is to cut ions of lower metals in the list.
scope: This sense is also called electromotive force series and electromotive series, a ranking of metal
  pieces or ions by pole power, set in fixed conditions, showing how keen one metal is to cut ions of
  lower metals in the list.
examples:
- Electrochemical series rank metals by pole power.
- The electrochemical series shows which metal cuts ions.
