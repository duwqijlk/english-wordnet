simpleMeaning: to make a person feel cross, most often by small troubles
scope: To make someone feel cross, most often by small troubles, also called bother, annoy, rag, irritate,
  gravel, devil, nettle and chafe, and not the deeper worry that keeps a person awake at night.
examples:
- Mosquitoes buzzing in my ear really vex me.
- It vexes me that she never closes the door after she leaves.
