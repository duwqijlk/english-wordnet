synsetId: 06876801-n
simpleMeaning: Any one of the 24 major or minor scales, in the usual whole-and-half-step pattern, that
  sets the ground a piece of music is built on.
scope: Also called a key; any one of the 24 major or minor scales that sets the ground for a piece of
  music, not the quality of a sound's tone.
examples:
- The tonality of the piece is C major.
- A change in tonality gave the second part a darker feel.
