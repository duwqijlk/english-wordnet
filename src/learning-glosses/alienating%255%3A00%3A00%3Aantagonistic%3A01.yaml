simpleMeaning: making people feel strong dislike for someone, or making them stop feeling friendly towards
  someone
scope: Describes something that makes people feel strong dislike for someone or stop feeling friendly
  towards them; not something strange or from another country.
examples:
- Her cold, alienating manner made the new workers feel unwelcome.
- His alienating remarks slowly pushed his old friends away.
