simpleMeaning: strongly changed in what you think and do, or fully controlled, by a strong feeling or
  other strong force
scope: 'Also called obsessed: controlled by a strong feeling or force; not taken over by a demon, which
  is a different sense of this word.'
examples:
- Possessed by anger, he shouted at everyone in the room.
- She seemed possessed by love and could think of nothing else.
