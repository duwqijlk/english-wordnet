simpleMeaning: a group of man-made cleaning products whose part that works at the surface is a cation,
  a bit of a molecule that carries a positive electric charge
scope: 'Also called invert soap: a kind of man-made cleaning product whose active part carries a positive
  charge, not an ordinary soap and not a soap that cleans in another way.'
examples:
- She bought a cationic detergent to clean the kitchen floor.
- The cationic detergent left the glass free of streaks.
