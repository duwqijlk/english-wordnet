simpleMeaning: a young person whose body has begun to change from a child's body to an adult's, but who
  is not yet fully grown as an adult
scope: 'Also called teenager and also called adolescent: a young person between childhood and being fully
  grown, not a number from thirteen to nineteen.'
examples:
- The park offers free classes for teens on Saturdays.
- As a teen, he helped at his parents' shop after school.
