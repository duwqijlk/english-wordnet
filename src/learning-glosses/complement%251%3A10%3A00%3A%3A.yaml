simpleMeaning: In grammar, a word or group of words that finishes a sentence part and makes it complete
scope: In grammar, a word or phrase that finishes a construction; not a thing added to make something
  better and not one of two parts that fit together.
examples:
- In 'She seems happy', 'happy' is the complement.
- The teacher asked us to find the complement in each sentence.
