synsetId: 02770723-v
simpleMeaning: To shine with a light that flashes on and off, bright then dim.
scope: Also called twinkle or winkle, this is to shine with a light that flashes on and off, not to be
  quick and clever in talk or in play, and not to glow for a moment when struck by a tiny bit of matter.
examples:
- The stars scintillated above the cold desert night.
- Light scintillated on the water, flashing bright then dim.
