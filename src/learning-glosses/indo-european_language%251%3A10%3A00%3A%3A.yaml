simpleMeaning: The family of tongues that by 1000 BC were spoken all over Europe and in parts of southwest
  and southern Asia
scope: This is one family of tongues, also called Indo-European and Indo-Hittite, and not the peoples
  who spoke them or things of that family; near rivals are the word for a member of those early peoples
  and the word for things of that family.
examples:
- English and Hindi both belong to the Indo-European language family, once spoken across Europe and Asia.
- The Indo-European language family covers tongues spoken from Europe to southern Asia.
