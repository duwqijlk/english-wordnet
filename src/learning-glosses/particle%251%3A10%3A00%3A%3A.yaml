simpleMeaning: A small word that joins with a verb to make a verb phrase with a new sense.
scope: A small word that joins with a verb to make a verb phrase, not a tiny bit of matter, and not a
  body with mass in physics.
examples:
- In 'give up', the particle 'up' changes the sense of the verb.
- The particle 'out' in 'find out' adds a new sense to the verb.
