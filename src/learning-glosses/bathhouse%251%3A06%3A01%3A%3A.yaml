simpleMeaning: a building with rooms where people who swim or wash can change their clothes
scope: A building where people who swim or wash change their clothes, not a bathroom in a house and not
  a place for living.
examples:
- We changed into our swimming clothes in the bathhouse by the pool.
- The bathhouse had small rooms where swimmers could get dressed.
