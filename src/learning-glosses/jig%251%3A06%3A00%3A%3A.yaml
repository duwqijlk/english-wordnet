simpleMeaning: a tool that holds a piece of work in place for a machine and guides the other tools that
  work on it
scope: 'This is a tool used with a machine: it holds a piece of work in place and guides the other tools.
  Not a dance and not a fishing hook pulled up and down in water.'
examples:
- The worker put the metal piece in a jig before drilling the holes.
- Using a jig helped him cut each piece of wood to the same shape.
