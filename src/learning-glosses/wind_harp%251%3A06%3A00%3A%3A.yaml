simpleMeaning: A stringed instrument with strings all set to the same note, which makes sound when the
  moving air flows across them
scope: This is a stringed instrument whose strings sound when moving air flows across them; aeolian harp
  and aeolian lyre are other names for this sense, and it is not a harp played by hand.
examples:
- A wind harp stood by the open window and sang softly in the breeze.
- She placed the wind harp on the porch so the wind could play it.
