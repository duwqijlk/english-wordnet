simpleMeaning: In maths, a written sign that shows how many times something is multiplied by itself
scope: 'Also called power: a written maths sign showing how many times something is multiplied by itself;
  not the list of names and subjects in a book and not a number scale made from facts.'
examples:
- In 2³, the small 3 is the index.
- The index in x⁵ tells you to multiply x by itself five times.
