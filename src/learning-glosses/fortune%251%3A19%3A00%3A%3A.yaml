simpleMeaning: a turn of chance no one can see coming that makes a thing turn out one way and not another
scope: 'Also called chance and luck: a turn of chance no one can see coming that makes a thing turn out
  one way and not another, not a turn of chance that ends in a good thing.'
examples:
- Bad fortune caused his plan to fail.
- It was fortune, not skill, that put them in the same town.
