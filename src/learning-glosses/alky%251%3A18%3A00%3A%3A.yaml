simpleMeaning: A person who drinks to excess, day after day, as a habit.
scope: Also called a lush, an alcoholic, a souse, a boozer, or a dipsomaniac; a person who drinks to excess
  as a habit, not a person who drinks now and then.
examples:
- The old alky spent his days at the corner bar.
- They called him an alky, for he drank from morning to night.
