simpleMeaning: a consonant (a speech sound that is not a vowel, like p or t) with a hissing sound, like
  s or sh
scope: A hissing speech sound, such as s or sh; this is the noun, not the word that describes such sounds.
examples:
- The letter s is a sibilant.
- In 'ship', the first sound is a sibilant.
