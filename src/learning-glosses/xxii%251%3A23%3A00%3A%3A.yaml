simpleMeaning: The number that comes from adding twenty-one and one.
scope: Also called 22 and twenty-two; the number after twenty-one, not twenty-one and not twenty-three.
examples:
- XXII in Roman numerals means twenty-two.
- There were XXII chairs in the hall.
