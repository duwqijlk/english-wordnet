simpleMeaning: This chemical messenger makes the front of the gland below the brain let out the messenger
  that wakes the thyroid after leaving a part at the base of the brain.
scope: Also called protirelin and thyrotropin-releasing factor, this is the chemical messenger that makes
  the front of the gland below the brain let out the messenger that wakes the thyroid.
examples:
- The thyrotropin-releasing hormone reached the pituitary and set off the next step.
- Thyrotropin-releasing hormone told the front of the gland below the brain to let out its messenger.
