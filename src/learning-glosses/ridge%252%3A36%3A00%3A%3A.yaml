senseId: 'ridge%2:36:00::'
synsetId: 01746125-v
simpleMeaning: To work the ground strip by strip, turning the earth of one strip over onto the next strip,
  which stays unploughed.
scope: Ploughing in strips in a field, not the beam at the top of a roof and not digging the ground into
  high and low lines with a spade.
examples:
- The farmer ridged the field strip by strip before sowing.
- He ridged the long field and left the next strip bare.
