simpleMeaning: A small group of war planes in an air force, often six planes, as in France in the First
  World War
scope: A small group of war planes, often six; not a whole air force, and not a single plane.
examples:
- The escadrille of six planes flew over the lines at dawn.
- An escadrille fought above the fields of France in the First World War.
