simpleMeaning: Spoiling or fouling a thing by mixing in outside matter.
scope: This sense is also called adulterant, for spoiling or fouling a thing by mixing in outside matter,
  unlike the sense for any substance that cuts down the purity or force of a substance.
examples:
- The agent was adulterating, fouling the pure drug.
- The powders were adulterating, spoiling the flour.
