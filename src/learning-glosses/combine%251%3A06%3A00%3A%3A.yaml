simpleMeaning: A farm machine that cuts the tops off grain plants, beats out the grain, and cleans it,
  as it moves across a field
scope: A farm machine that cuts and cleans grain in the field, not a group of firms joined to cut down
  competition and not the act of joining things together.
examples:
- The combine moved slowly across the wheat field.
- A combine can cut, thresh, and clean the grain in one pass.
