simpleMeaning: The bad side of a thing in that it can rot or go bad or be destroyed.
scope: The bad side of a thing in that it can rot or go bad or be destroyed, also called perishableness,
  not the good side of lasting long and not the strength of a thing.
examples:
- The perishability of fresh fruit makes it hard to store.
- Milk has a high perishability in warm weather.
