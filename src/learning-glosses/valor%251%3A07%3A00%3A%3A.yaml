simpleMeaning: the fine spirit of a hero or heroine, brave beyond the common run when danger comes, above
  all in battle
scope: Great courage in danger, above all in battle, not mere daring and not a medal for it.
examples:
- He showed great valor in battle, holding the line when others fell back.
- She was given a medal for valor after the rescue.
