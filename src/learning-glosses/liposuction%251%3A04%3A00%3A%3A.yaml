simpleMeaning: A medical operation, especially done to make the body look better, in which extra fat under
  the skin is pulled out by sucking
scope: Also called suction lipectomy, this is an operation that takes fat out of the body; it is not losing
  weight by eating less or by exercise.
examples:
- She had liposuction to take fat out from under the skin of her stomach.
- Liposuction is an operation, so it carries more risk than losing weight by exercise.
