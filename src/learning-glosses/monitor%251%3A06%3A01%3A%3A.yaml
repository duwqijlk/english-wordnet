simpleMeaning: An electronic machine used to check how good the signals are and what they carry
scope: A machine that checks signals, not the machine that watches over a system, not the picture on a
  screen, and not the big lizard.
examples:
- The engineer used a monitor to check the quality of the broadcast.
- A monitor in the studio showed whether the sound signal was clear.
