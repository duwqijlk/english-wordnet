simpleMeaning: an animal in the early stages of growth, its cells becoming different kinds, before it
  grows into a fetus in higher animals or hatches as a larva in lower ones
scope: A young animal in its first stages of growth, not the tiny first plant inside a seed.
examples:
- The embryo grows inside the egg.
- At this stage the embryo is only a few cells big.
