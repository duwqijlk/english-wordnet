simpleMeaning: wanting to harm someone in return for the harm they did, or meant for that purpose
scope: 'Also called vindictive and revengeful: wanting to harm someone back, or done in order to harm
  someone back; not just angry and not forgiving.'
examples:
- The vengeful king planned to punish the men who had turned against him.
- She gave him a vengeful look and swore to pay him back for the harm.
