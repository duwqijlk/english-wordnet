simpleMeaning: With no known cure, this poisonous war gas brings up painful swellings on the skin and
  harms the eyes and lungs, and it is made with sulfur chemicals
scope: This poisonous war gas is also called dichloroethyl sulfide, mustard agent, mustard gas, and sulfur
  mustard, and no known cure exists for it.
examples:
- Exposure to the blistering agent raised painful swellings on the skin.
- No cure was known for the blistering agent.
