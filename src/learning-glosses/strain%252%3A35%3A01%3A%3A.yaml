simpleMeaning: to pass a thing through a fine net so the big bits stay behind and the small bits go through
scope: To take the big bits out of a thing by passing it through a fine net, not to make someone worried
  and not to pull something hard.
examples:
- Strain the soup through a fine net before you serve it.
- She strained the tea leaves out of the pot.
