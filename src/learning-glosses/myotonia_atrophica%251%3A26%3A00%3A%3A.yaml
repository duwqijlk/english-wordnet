simpleMeaning: 'Severe muscle-wasting disease: face, hand, foot and neck weakness, slurred speech and
  spreading hand weakness; onset from birth to middle age, slow decline, dominant inheritance (one parent
  is enough).'
scope: One clinical name for this severe muscle-wasting disease; myotonic dystrophy and myotonic muscular
  dystrophy are the same illness under other names, not separate or milder disorders.
examples:
- The neurologist diagnosed myotonia atrophica after noting the patient's facial weakness and slow, slurred
  speech.
- In myotonia atrophica, symptoms can first appear in childhood or not until middle age.
