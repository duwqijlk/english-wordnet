simpleMeaning: a soft-stemmed climbing plant used to feed farm animals and to make the soil richer
scope: A soft-stemmed climbing plant fed to farm animals that also makes soil richer; not the bushy spring
  vetch with violet-blue flowers, and not a plant grown only for its flowers.
examples:
- The farmer sowed spring vetch to feed the cows.
- Spring vetch left in the field made the soil richer.
