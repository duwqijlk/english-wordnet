simpleMeaning: Slimy stuff keeps flowing from the back of the nose hollow down into the throat passage
  behind it.
scope: This flow comes from the back of the nose hollow into the throat, and it goes on and on.
examples:
- The postnasal drip ran from the back of the nose down the throat.
- She could feel the postnasal drip sliding down the back of her throat.
