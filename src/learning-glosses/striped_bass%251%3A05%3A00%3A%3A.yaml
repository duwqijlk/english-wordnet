simpleMeaning: This sea fish, sometimes put with the group called Morone, has dark lines along its sides,
  swims up rivers to lay eggs, and is caught for food and sport.
scope: Also called striper and rockfish, this sea fish swims up rivers to lay eggs, so it is not a fish
  that stays in the sea all its life.
examples:
- We caught a striped bass.
- The striped bass swam up the river to lay eggs.
