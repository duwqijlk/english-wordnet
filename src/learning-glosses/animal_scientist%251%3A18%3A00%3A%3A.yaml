simpleMeaning: a person who knows a great deal about the study of living things, and works on the kinds
  that move and eat
scope: A person who knows a great deal about the study of living things that move and eat; zoologist is
  another name for this sense, and it is not a person who studies plants and not a person who treats sick
  pets.
examples:
- The animal scientist spent years watching wolves in the wild.
- As an animal scientist, she studies how birds find food in winter.
