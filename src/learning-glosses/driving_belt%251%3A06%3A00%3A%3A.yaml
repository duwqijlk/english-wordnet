simpleMeaning: A loop of strong stuff that carries movement from a motor to a machine.
scope: A loop of strong stuff that carries movement from a motor to a machine, not a chain and not a gear.
examples:
- The driving belt snapped and the machine stopped.
- He replaced the driving belt on the old lathe.
