simpleMeaning: A frame that holds an animal still while a vet treats it or while shoes are fitted to its
  feet
scope: A frame that holds an animal still for care or shoeing; not the wooden frame that once punished
  people.
examples:
- The horse stood in the stocks while the vet checked its leg.
- The farrier put the pony in the stocks to fit its shoes.
