simpleMeaning: any of a group of natural food stuffs that dissolve in water and are found in ripe fruit
  and vegetables, used in making fruit jellies and jams
scope: A natural stuff found in ripe fruit and vegetables and used to make fruit jellies and jams, not
  gelatin and not sugar.
examples:
- Pectin helps the jam set firm.
- She added pectin to the fruit jelly.
