simpleMeaning: A machine that prints from a flat face, its face of stone or metal treated to take in or
  throw off ink in the set pattern.
scope: A machine that prints from a flat face, its face of stone or metal treated to take in or throw
  off ink in the set pattern; also called lithograph machine; not a print made by lithography, nor to
  make by lithography.
examples:
- Their lithograph printed the sheet.
- The lithograph was used at noon.
