simpleMeaning: A hickory tree of the southern United States with many narrow leaf parts and rather sharp-tasting
  nuts.
scope: A hickory tree of the southern United States with many narrow leaf parts and sharp-tasting nuts;
  not a sweet-nut hickory and not a tree with few broad leaf parts.
examples:
- Bitter pecan grows along the river bottoms.
- The bitter pecan drops nuts too sharp to eat raw.
