simpleMeaning: said in a plain, straight way, with nothing softened or held back
scope: Plain and blunt in an honest way, not a total thing with no limit or condition.
examples:
- She gave a downright answer and did not try to soften it.
- He is a downright kind of person who always says what he thinks.
