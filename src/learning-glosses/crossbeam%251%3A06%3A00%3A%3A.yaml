simpleMeaning: a long bar that goes across something from one side to the other
scope: 'Also called traverse and crosspiece: a bar that goes across a thing, not a bar that goes up and
  down or along it.'
examples:
- A strong crossbeam held up the roof of the old barn.
- They put a crossbeam across the top of the door frame.
