simpleMeaning: Trouble carrying out movements of the body that a person chooses to make
scope: Trouble carrying out movements a person chooses to make, not weakness and not a shaking that cannot
  be helped.
examples:
- Dyskinesia made it hard for him to carry out movements he chose to make.
- The patient with dyskinesia struggled to lift her arm on purpose.
