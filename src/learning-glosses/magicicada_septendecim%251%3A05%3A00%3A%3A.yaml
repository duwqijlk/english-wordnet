simpleMeaning: A North American cicada that comes out in huge numbers only after long gaps, since its
  young take 13 to 17 years to grow up.
scope: This is a North American cicada that comes out in huge numbers only after long gaps, since its
  young take 13 to 17 years to grow up; periodical cicada and seventeen-year locust are other names for
  this sense, and it is not a cicada that comes out every year.
examples:
- Magicicada septendecim filled the trees with sound in the year they came out.
- The young of Magicicada septendecim live underground for 13 to 17 years.
