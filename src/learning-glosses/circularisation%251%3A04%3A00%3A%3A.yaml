simpleMeaning: sending printed notices round to people as a way of advertising
scope: This is sending printed notices round to people as a way of advertising; circularization is another
  name for this sense, and it is not putting notices up in one place.
examples:
- The shop used circularisation to tell people about its sale.
- Circularisation helped the new firm reach homes across the town.
