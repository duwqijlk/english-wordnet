simpleMeaning: A shrub grown for show, keeping its leaves through the year, from the south-east of the
  United States, with small white flowers shaped like bells.
scope: Also called fetterbush, mountain andromeda, and mountain fetterbush; a shrub of the south-east
  United States grown for show, set apart from other evergreen shrubs by its small white bell-shaped flowers.
examples:
- Pieris floribunda bloomed white in the spring garden.
- The Pieris floribunda by the porch kept its leaves all winter.
