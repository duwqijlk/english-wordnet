simpleMeaning: A tall yucca of the southwestern United States and Mexico, with a woody stem, stiff pointed
  leaves like swords, and a large bunch of white flowers.
scope: A tall yucca with stiff swordlike leaves and white flowers, also called Yucca baccata, and not
  the other Spanish bayonet, a short-trunked yucca of the southern United States and tropical America.
examples:
- A Spanish bayonet stood by the dry wall, its stiff leaves pointing up like swords.
- The Spanish bayonet in the garden had a large bunch of white flowers.
