simpleMeaning: In old Spain and Portugal, a Jew or Moor who said he had turned to the faith of Jesus to
  escape harm or being sent away.
scope: A Jew or Moor in old Spain and Portugal who said he had turned to the faith of Jesus to escape
  harm or being sent away; not a person born into that faith, and not a person who was driven out.
examples:
- The converso kept his old rites in secret.
- Many conversos lived in fear.
