simpleMeaning: A shrub of northern Mexico and the south-west of the United States, with a coat of wax.
scope: Also called candelilla, this shrub of northern Mexico and the south-west of the United States has
  a coat of wax, not any other wax-coated shrub.
examples:
- Euphorbia antisyphilitica grows in the dry lands of northern Mexico.
- The wax coat of Euphorbia antisyphilitica shines in the sun.
