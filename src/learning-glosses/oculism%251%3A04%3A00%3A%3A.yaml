simpleMeaning: The craft of an eye doctor, one who treats the eyes.
scope: The craft of an eye doctor; not the craft of making glasses alone, and not the study of the eye
  for its own sake.
examples:
- He learned oculism from his father, who treated eyes in the town.
- Oculism was once the common name for the eye doctor's craft.
