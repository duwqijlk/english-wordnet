simpleMeaning: a formal prayer in a ceremony that asks God to keep someone or something safe
scope: This is the prayer said in a ceremony to ask for God's care, not good luck in general and not permission
  or agreement.
examples:
- The priest gave a blessing over the food before the meal.
- At the end of the church service, the pastor said a blessing for the family.
