simpleMeaning: keeping people well in mind and body by stopping illness before it starts or treating it,
  done by doctors, nurses, and others whose job is care of the sick
scope: Care that keeps people well in mind and body, by stopping illness or treating it, not the treatment
  of one sick person alone.
examples:
- Good healthcare helps people stay well and get better when they are ill.
- The town built a new healthcare centre for local families.
