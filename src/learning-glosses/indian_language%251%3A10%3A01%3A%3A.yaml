simpleMeaning: The native peoples of the Americas speak many tongues, and this name covers any one of
  them.
scope: Any tongue the native peoples of the Americas speak, also called Indian, American-Indian language,
  American Indian, American Indian language, Amerind, Amerind language, and Amerindian language; not a
  tongue of one people or one place.
examples:
- He studies an Indian language spoken in the Amazon.
- The old songs are sung in an Indian language.
