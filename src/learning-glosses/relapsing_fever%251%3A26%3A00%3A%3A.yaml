senseId: 'relapsing_fever%1:26:00::'
synsetId: 14165941-n
simpleMeaning: An illness spread by infected lice or ticks, causing repeated bouts of high temperature,
  chills, headache, muscle aches and nausea every week or ten days for months.
scope: The louse- and tick-transmitted infection with repeated high-temperature attacks, not a one-off
  brief illness; the other name in this group describes the same disease.
examples:
- The patient's relapsing fever returned each week for nearly three months.
- Relapsing fever is carried by infected lice and ticks in many regions.
