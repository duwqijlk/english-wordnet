simpleMeaning: In water, a chemical breaks down into smaller parts
scope: A chemical breaking down in water, also called hydrolyze; not a person making it break down and
  not a thing simply getting wet.
examples:
- The salt will hydrolyse when it meets water.
- In the stomach, the fat begins to hydrolyse.
