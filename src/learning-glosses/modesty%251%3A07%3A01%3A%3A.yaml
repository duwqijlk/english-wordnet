simpleMeaning: keeping your manners proper and your ways careful, with nothing bold or showy about them
scope: Also called reserve; this is a proper, careful way of acting, not being shy and not hiding what
  you think.
examples:
- Her modesty in dress pleased her grandmother.
- He answered with modesty, keeping his voice low and his words few.
