simpleMeaning: The join in the skull where the bones at the front meet the bones at the top and sides.
scope: This is the join in the skull where the bones at the front meet the bones at the top and sides,
  not the join at the back of the skull and not a cut that a doctor sews up.
examples:
- The coronal suture runs across the top of the skull.
- Doctors could see the coronal suture on the X-ray.
