simpleMeaning: the brown fur of a small North American water animal that looks like a small beaver
scope: This is the brown fur itself, the hair taken from the animal and used for coats; not the living
  animal, a small water animal of North America like a beaver.
examples:
- Her warm winter coat was made of muskrat.
- Traders in the north sold muskrat to coat makers.
