senseId: 'scleroderma_bovista%1:20:00::'
synsetId: 12990687-n
simpleMeaning: An earthball whose outer skin is firm, dry and smooth when young but cracks as it grows
  old; pale orange-yellow when young and reddish brown when fully grown
scope: Also called smooth earthball; a round earthball with a firm dry smooth skin that cracks with age,
  not the warty earthball that stays yellow-brown outside.
examples:
- Scleroderma bovista grows in the grass at the edge of the wood.
- Young Scleroderma bovista is pale orange-yellow and smooth to the touch.
