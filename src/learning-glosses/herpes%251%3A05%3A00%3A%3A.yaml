simpleMeaning: Any of a group of animal viruses that raise sore blisters on the skin.
scope: Any of the animal viruses that cause painful blisters on the skin, not the wider diseases that
  break out on skin or moist lining.
examples:
- Herpes caused blisters round his mouth.
- The doctor said the herpes would clear in a week.
