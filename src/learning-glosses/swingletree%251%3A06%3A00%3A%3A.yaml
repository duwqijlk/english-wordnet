simpleMeaning: A crossbar joined to the straps of a working horse and to the cart or tool the horse is
  pulling.
scope: This is a crossbar joining a working horse to the cart or tool it pulls, also called whiffletree
  or whippletree, and not a yoke or a shaft.
examples:
- The swingletree joined the horse to the plough.
- He fixed the swingletree to the cart.
