simpleMeaning: A common herb that lives many years, with sweet-smelling roots used in place of sarsaparilla;
  it grows in central and eastern North America.
scope: This is a common herb with sweet-smelling roots used in place of sarsaparilla, also called false
  sarsaparilla, wild sarsaparilla and wild sarsparilla; not a shrub and not a true sarsaparilla plant.
examples:
- Aralia nudicaulis grew in the woods of eastern North America.
- The roots of Aralia nudicaulis smelled sweet.
