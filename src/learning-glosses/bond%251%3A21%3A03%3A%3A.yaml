simpleMeaning: In criminal law, money a backer must give up if the accused does not come to court for
  trial
scope: In criminal law, money a backer must give up if the accused does not come to court for trial, not
  a paper that says money is owed and not a thing that holds a person fast.
examples:
- The judge set the bond at ten thousand dollars.
- A bond was put up so he could wait for trial at home.
