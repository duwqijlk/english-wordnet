simpleMeaning: To hold a thing steady and firm, as if held in place by a stiff support.
scope: 'Also called steady: to hold a thing firm, not to get yourself ready for something hard.'
examples:
- She braced her elbows while working on the potter's wheel.
- He braced the ladder against the wall to hold it steady.
