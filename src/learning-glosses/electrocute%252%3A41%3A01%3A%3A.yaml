simpleMeaning: to kill a person or animal when electricity passes through the body
scope: To kill with electricity in any way, not only to kill a prisoner in an electric chair as a punishment.
examples:
- He was electrocuted when he touched the live wire.
- The worker was electrocuted by a broken power line.
