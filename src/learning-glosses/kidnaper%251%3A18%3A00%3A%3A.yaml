scope: This is a person who takes someone away against the law and holds them, usually to get money for
  letting them go; kidnapper, snatcher and abductor are other names for this sense, not a thief who steals
  things and not a jailer who holds people by law.
examples:
- The kidnaper held the child for ransom.
- Police caught the kidnaper two days later.
