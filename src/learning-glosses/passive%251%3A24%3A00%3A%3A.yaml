simpleMeaning: In grammar, the form of a verb that shows the subject of the sentence is the one the action
  happens to, not the one who does it
scope: The grammar voice in which the subject is acted on, not the adjective use of the same idea and
  not peaceful resistance to wrongs.
examples:
- The teacher asked us to change the sentence into the passive.
- She rewrote the line in the passive so the doer went last.
