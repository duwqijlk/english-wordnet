simpleMeaning: The drive by Jews around the world, begun late in the 1800s, to build a Jewish state in
  Palestine.
scope: Also called Zionism; the drive by Jews around the world, begun late in the 1800s, to build a Jewish
  state in Palestine, not a policy for setting up a national home for Jews in Palestine.
examples:
- The Zionist movement began late in the 19th century.
- The Zionist movement sought a Jewish state in Palestine.
