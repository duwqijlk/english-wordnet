simpleMeaning: the hard outer cover or case of some living things, such as crabs and other animals with
  jointed legs, and turtles
scope: The hard outer cover or case of some living things, such as crabs and turtles; shield and shell
  are other names for this, not the outer layer of the skin of animals with backbones.
examples:
- The crab's cuticle is its hard outer case.
- A turtle's cuticle protects its soft body.
