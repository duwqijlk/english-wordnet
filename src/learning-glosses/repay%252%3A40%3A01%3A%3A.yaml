simpleMeaning: To pay back money that is owed, or to give back a thing that was lent
scope: To pay back money owed or give back a thing that was lent, not to give something back as thanks
  for what a person has done.
examples:
- He repaid the loan in full before the year ended.
- She repaid the book she had borrowed from the library.
