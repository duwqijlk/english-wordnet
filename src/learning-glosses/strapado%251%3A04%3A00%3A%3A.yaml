simpleMeaning: torture that ties hands behind the back, lifts the person off the ground by a rope round
  the wrists, then drops them until the rope jerks them to a stop
scope: 'Also called strappado: a form of torture, not a punishment by whipping and not a hanging.'
examples:
- The prisoner feared the strapado more than the whip.
- Under the strapado, his arms were tied and he was hauled into the air.
