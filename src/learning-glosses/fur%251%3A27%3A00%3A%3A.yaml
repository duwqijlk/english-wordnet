simpleMeaning: the skin of a mammal (an animal that feeds its young with milk), with its hair on, made
  ready to use
scope: This is skin and hair taken from an animal and made ready to use, not clothing made from it and
  not the hair while it still grows on a live animal.
examples:
- The trader sold fur from foxes to people who make coats.
- This fur feels soft because the hair was kept on the skin.
