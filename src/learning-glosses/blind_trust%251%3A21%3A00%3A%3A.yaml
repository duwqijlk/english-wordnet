simpleMeaning: Giving up the right to know about them, a person hands money and goods to a keeper, so
  a possible clash of interests is avoided
scope: A person who sets this arrangement up hands money and goods to a keeper and gives up the right
  to know about them, in order to avoid a possible clash of interests.
examples:
- He moved his money into a blind trust and gave up the right to know about it.
- A blind trust helped her avoid a possible clash of interests.
