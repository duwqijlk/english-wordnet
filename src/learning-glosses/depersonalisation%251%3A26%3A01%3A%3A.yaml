senseId: 'depersonalisation%1:26:01::'
synsetId: 14049858-n
simpleMeaning: In thought, a loss of one's own self, a feeling of being a nameless cog in a faceless social
  machine.
scope: In thought, a loss of one's own self, a feeling of being a nameless cog in a faceless social machine;
  also called depersonalization; not a feeling disorder, splitting one off, where one loses touch with
  one's own true self, along with feelings of unreality and strangeness, nor the picturing of a human
  as a mere thing, stripped of personal traits or selfhood.
examples:
- Their depersonalisation grew at dusk.
- The depersonalisation was plain in the test.
