simpleMeaning: a plant eating dinosaur, four-legged, with a long thin neck and a whiplike tail, that lived
  in and out of water in the Cretaceous, mostly in the Southern Hemisphere
scope: Also called a titanosaur; a plant-eating dinosaur of the Cretaceous that walked on four legs, not
  a meat-eater and not a sea animal.
examples:
- The titanosaurian left deep tracks in the mud.
- Titanosaurian bones were found in the southern hills.
