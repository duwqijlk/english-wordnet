simpleMeaning: A North American grass with leaves that have dry skin-like edges and flower covers with
  long thin points
scope: This is a North American grass with leaves that have dry skin-like edges and flower covers with
  long thin points; freshwater cordgrass and slough grass are other names for it, not a grass grown for
  grain.
examples:
- Prairie cordgrass grows thick along the marsh.
- The prairie cordgrass has long thin points on its flower covers.
