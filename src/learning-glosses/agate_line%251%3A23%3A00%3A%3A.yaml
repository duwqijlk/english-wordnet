simpleMeaning: a unit for measuring adverts, as much room as one row of print one column wide and one
  fourteenth of an inch deep
scope: A unit for measuring adverts, as much room as one row of print; line is another name for this,
  not a row of print itself and not a column of adverts.
examples:
- The advert cost ten agate lines in the newspaper.
- They charge by the agate line for small adverts.
