simpleMeaning: A big tree of African woods whose wood is strong, hard, and yellow to golden brown; at
  times put in the group called Sarcocephalus
scope: A tall wood tree of Africa, not the opossum wood tree of America and not a small garden plant.
examples:
- The opepe stood taller than the other trees in the forest.
- Builders prized opepe for its hard golden-brown wood.
