simpleMeaning: Stems run under the ground from this European plant, which has pink flowers, leaves made
  of one leaflet each, and roots that are long and tough.
scope: 'Also called rest-harrow: a woody plant of Europe with pink flowers and long tough roots, not the
  Eurasian plant with loose bunches of pink or purple flowers and spiny stems.'
examples:
- Restharrow grows in Europe and bears pink flowers.
- Restharrow spreads by stems that run under the ground.
