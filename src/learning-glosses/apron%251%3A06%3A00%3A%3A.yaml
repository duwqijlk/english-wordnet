simpleMeaning: a piece of cloth, leather or plastic tied around the waist to protect your clothes
scope: This is a piece of clothing you wear to protect your own clothes, not the front part of a theatre
  stage in front of the curtain.
examples:
- She tied on an apron before she started cooking.
- He wore a leather apron while he worked in the shop.
