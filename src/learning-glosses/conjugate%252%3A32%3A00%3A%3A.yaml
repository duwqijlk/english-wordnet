simpleMeaning: to put a verb in its different forms to show who acts, how many, man or woman, time, and
  if it is done or still going on, and more
scope: This is about giving a verb its different forms in language study; it is not about joining things
  in chemistry and not about leaves or mixed liquids.
examples:
- Students learn to conjugate the verb 'to be' in class.
- Please conjugate this verb in the past tense.
