simpleMeaning: In biology, the breaking down of dead matter by germs or by fungi
scope: Also called rot, rotting, breakdown and decomposition, this is the breaking down of dead matter
  by germs or fungi, not the bad smell that may come with it and not a decay of morals.
examples:
- Putrefaction set in quickly in the warm, damp air.
- The putrefaction of the fallen leaves fed the soil.
