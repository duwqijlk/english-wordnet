simpleMeaning: A verb, or a way of building a verb, that needs an object after it to be correct.
scope: A verb, or a way of building a verb, that needs an object after it to be correct, and not the adjective
  for a verb that needs a direct object to finish its meaning.
examples:
- In the sentence 'She kicked the ball', 'kicked' is a transitive.
- The teacher asked them to spot the transitive in the sentence.
