simpleMeaning: to tie something tight with a thick, strong rope or wire
scope: The verb for tying something with a thick rope or wire, not the thick rope itself, not a wire for
  power, and not television sent by wire.
examples:
- Workers cabled the young trees to strong posts.
- He cabled the boat to the dock so it would not drift away.
