simpleMeaning: to show in a court that a will or other paper is true in law and can be used
scope: This verb sense is about proving a will in court; it is not holding back punishment for a person
  found guilty, and not the paper a court gives about a will.
examples:
- The court probated the will last week.
- They asked a judge to probate her father's will.
