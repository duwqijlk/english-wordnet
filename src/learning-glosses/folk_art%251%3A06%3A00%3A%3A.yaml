simpleMeaning: a kind of work made by the people of a place, whose maker is not known, that shows what
  that place holds dear
scope: A kind of work made by the people of a place, whose maker is not known, that shows what that place
  holds dear, not work by a known maker.
examples:
- The museum shows folk art from villages across the country.
- Her folk art is a painted wooden bird made in her home town.
