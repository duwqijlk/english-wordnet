simpleMeaning: feeling worried and not able to rest or stay calm
scope: 'Also called restless, itchy, fretful, and fidgety: feeling worried and not able to rest. This
  is not about skin that needs scratching.'
examples:
- The children got antsy while they waited for the train.
- He felt antsy before his first day at the new school.
