simpleMeaning: to make it hard for someone to breathe or to block the way air moves in
scope: This is for smoke, bad air or a thing that makes breathing hard or blocks air, not pressing on
  a person's throat and not struggling to breathe yourself.
examples:
- Thick smoke choked the children in the small room.
- Dust and bad air choked everyone who went into the mine.
