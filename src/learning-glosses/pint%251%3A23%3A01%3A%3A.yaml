simpleMeaning: A United States measure for liquids, equal to 16 fluid ounces, with two of them making
  one quart.
scope: A United States liquid measure of 16 fluid ounces, not the British pint and not the dry pint.
examples:
- She bought a pint of cream.
- Two pints make one quart.
