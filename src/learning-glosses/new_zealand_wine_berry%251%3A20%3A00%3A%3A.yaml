simpleMeaning: A fine shrub or small tree that sheds its leaves, with pretty leaves and small red fruits
  that turn black when ripe and are used to make drink.
scope: A fine shrub or small tree, also called makomako, wineberry, Aristotelia racemosa and Aristotelia
  serrata; its near kin are the other shrubs with small red fruits used to make drink.
examples:
- New Zealand wine berry turns black when ripe.
- They make wine from New Zealand wine berries.
