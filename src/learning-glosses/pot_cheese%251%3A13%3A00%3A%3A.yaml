simpleMeaning: a mild soft white food made from the thick lumps of milk with the fat taken off after it
  has gone sour
scope: 'Also called cottage cheese, farm cheese, and farmer''s cheese: a mild soft food made from soured
  skim milk, not a hard aged cheese and not meat cooked in a pot.'
examples:
- She spread pot cheese on a slice of bread for lunch.
- I bought a tub of pot cheese to eat with fruit.
