simpleMeaning: a plant part that grows under the ground and can be eaten; it first grew in South America
  and is a main food in Ireland
scope: Also called potato, murphy and spud, this is a food that grows under the ground, not a dish made
  from it.
examples:
- He grew taters in the back garden for winter meals.
- She boiled a pot of taters for dinner.
