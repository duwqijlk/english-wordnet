simpleMeaning: In chemistry, a thing made when two or more things are put together, with no fixed share
  for each part and no chemical joining between them
scope: In chemistry, things put together with no fixed share for each part and no chemical joining between
  them, not a food made from different parts and not an event that brings things together.
examples:
- Salt and sand form a mixture when they are stirred together.
- The mixture of oil and water separates if you leave it alone.
