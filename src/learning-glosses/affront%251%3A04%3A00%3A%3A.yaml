simpleMeaning: an act, or anything else, that shows a person open disrespect on purpose or in effect
scope: An act or thing that shows open disrespect, also called insult, not a mild slight by accident and
  not a crime.
examples:
- Turning his back was an affront to the old man.
- She took his rude words as an affront.
