simpleMeaning: Thinking about a trouble over and over, in a dark and gloomy way that never lets go
scope: Dark, unending thought about a trouble, not a bird sitting on eggs to warm them.
examples:
- His brooding over the quarrel kept him awake.
- Her brooding on the loss filled her days.
