synsetId: 00115839-r
simpleMeaning: At or near the edge of a thing, or in a side role rather than the main one.
scope: In a side way, at the edge of a thing rather than at its centre, or in a side role.
examples:
- The town grew peripherally, with new houses at its outer edges.
- She was only peripherally involved in the decision, not part of the main team.
