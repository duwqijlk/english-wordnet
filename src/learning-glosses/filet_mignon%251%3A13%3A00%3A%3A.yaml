simpleMeaning: the soft strip of beef that runs along the back of the animal gives a small steak when
  cut at its thick end
scope: A small steak from the thick end of the soft strip of beef along the back, not a chop and not a
  cut from the leg.
examples:
- The waiter suggested the filet mignon for our anniversary dinner.
- She ordered a filet mignon cooked rare.
