simpleMeaning: Standing as the first of its kind, the model that later things like it are copied from.
scope: Also called archetypal or prototypal, standing as the first of its kind, the model that later things
  like it are copied from.
examples:
- Her story was archetypical, the model for all later tales of its kind.
- The building was archetypical of the style that followed.
