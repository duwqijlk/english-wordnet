simpleMeaning: words written on a stone that marks a grave, or on a stone structure built to remember
  a person, in memory of the person buried there
scope: This is the writing on a grave stone to remember a dead person, not the stone itself and not a
  speech at a funeral.
examples:
- The epitaph on her grandfather's grave stone was short and kind.
- They cut a short epitaph into the stone above his grave.
