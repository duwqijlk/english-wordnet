simpleMeaning: A tear in smooth muscle through which a part of the body pushes out
scope: This is a tear in smooth muscle through which a part of the body pushes out, also called hernia,
  and not a cut in the skin or a swelling with no tear.
examples:
- The herniation pushed through the muscle wall.
- Doctors found a herniation after the injury.
