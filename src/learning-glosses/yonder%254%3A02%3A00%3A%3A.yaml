simpleMeaning: at or in the place pointed to, usually far away — the short form 'yon' is old and used
  only in some places
scope: At or in the place pointed to, usually far away; not the adjective for a far-off place still in
  sight.
examples:
- The house yonder stood at the far end of the lane.
- We could see the lights yonder across the field.
