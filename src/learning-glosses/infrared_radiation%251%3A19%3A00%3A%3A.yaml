simpleMeaning: Energy waves longer than the light our eyes can see and shorter than radio waves.
scope: Energy waves longer than the light our eyes can see and shorter than radio waves; also called infrared,
  infrared emission and infrared light, not the light our eyes see and not radio waves.
examples:
- Infrared radiation from the sun warms the earth.
- The heater gives off infrared radiation you can feel but not see.
