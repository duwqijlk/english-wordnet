simpleMeaning: A loosely woven cloth made in the Outer Hebrides, a group of islands off Scotland.
scope: A loose cloth from the Outer Hebrides, not other woollen cloth and not cloth made elsewhere.
examples:
- He wore a jacket of Harris Tweed to the wedding.
- This Harris Tweed cap was woven on the islands.
