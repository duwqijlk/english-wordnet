simpleMeaning: a path worn into the ground by wild hoofed animals as they walk the same way again and
  again
scope: A path worn into the ground by wild hoofed animals; not a path made by people and not a road for
  cars.
examples:
- We found a deer trail leading down to the stream.
- The deer trail wound through the tall grass to the edge of the wood.
