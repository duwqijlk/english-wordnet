simpleMeaning: a loose protective piece of clothing that covers the body and is worn over ordinary clothes
  while doing messy or dirty work.
scope: This is not the denim work trousers with a chest piece and straps; it is a loose covering worn
  over other clothes to keep them clean.
examples:
- She pulled on an overall before cleaning the oven.
- The laboratory staff wear white overalls over their clothes.
