simpleMeaning: able to bring about the result that was wanted, or able to make a strong change that people
  notice
scope: 'Also called effective and efficacious: able to get the wanted result or make a strong change,
  not weak and not failing to work.'
examples:
- His effectual plan solved the problem at once.
- The new law proved effectual in cutting crime.
