simpleMeaning: having threads, or looking like threads, especially the threads used to make rope, such
  as those from jute, a plant with strong threads
scope: Also called fibrous. It describes a thing with threads or like threads, especially threads for
  making rope, not a thing that is simply strong.
examples:
- He tied the box with a coarse hempen rope.
- The sack was made of rough hempen cloth.
