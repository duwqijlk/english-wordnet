simpleMeaning: a number of army planes flying together, kept above the army's work on the ground or above
  a place the army will attack
scope: Army planes flying together above a place; not the light folding cover you hold in your hand, and
  not a word meaning covering many things at once.
examples:
- An air umbrella of fighter planes stayed over the troops all day.
- The army kept an umbrella of planes over the port.
