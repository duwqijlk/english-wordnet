simpleMeaning: A kind of germ that causes a disease spread through sex.
scope: This germ causes one disease spread through sex, also called C. psittaci, and it is unlike germs
  that cause sickness caught in other ways.
examples:
- Chlamydia psittaci can cause a disease spread through sex.
- Doctors test for Chlamydia psittaci when a patient has signs of that disease.
