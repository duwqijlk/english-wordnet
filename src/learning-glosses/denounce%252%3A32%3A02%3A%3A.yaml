senseId: 'denounce%2:32:02::'
synsetId: 00844108-v
simpleMeaning: To say in public that an agreement such as a treaty will no longer stand.
scope: This is publicly ending an agreement such as a treaty; not accusing or condemning a person, and
  not simply ending a private deal.
examples:
- The government denounced the treaty after the border clashes.
- The two sides denounced the old treaty and drew up a new one.
