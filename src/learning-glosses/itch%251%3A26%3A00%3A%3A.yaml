simpleMeaning: a skin illness that spreads between people, caused by a tiny animal on the skin, with sore
  skin and a strong need to scratch that does not stop
scope: This is the skin illness itself, not just the feeling on the skin that makes you want to scratch,
  and not the act of scratching or rubbing.
examples:
- The doctor said the itch had spread to his hands.
- He has a bad case of the itch and cannot sleep.
