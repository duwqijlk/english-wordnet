simpleMeaning: Above all of rock changed by heat and pressure, made of thin layers like leaves.
scope: Above all of rock changed by heat and pressure, made of thin layers like leaves, also called foliaceous
  or foliated; not rock with thick layers and not a leaf.
examples:
- The foliate rock split into thin layers.
- Foliate rock is made of thin layers like leaves.
