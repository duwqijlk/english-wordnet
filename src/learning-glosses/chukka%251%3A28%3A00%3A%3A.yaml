simpleMeaning: In polo, one of the six parts into which a match is split.
scope: In polo, one of the six parts of a match, not the ankle-high shoe laced through two or three pairs
  of eyelets and often made of suede.
examples:
- The first chukka ended with no goals scored.
- Play stopped at the end of the second chukka.
