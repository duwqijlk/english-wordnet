simpleMeaning: West and northwest have a point halfway between them on the compass.
scope: Also called west northwest, this is the point on the compass halfway between west and northwest,
  not the point halfway between west and southwest.
examples:
- The wind blew from the WNW all day.
- We sailed towards the WNW.
