simpleMeaning: Most times put in a bottle or a can, this is the liquid squeezed from the fruit
scope: The liquid squeezed from the fruit, most times put in a bottle or a can, not the fruit itself and
  not the juice of another fruit.
examples:
- She poured a glass of pineapple juice for breakfast.
- He bought a carton of pineapple juice at the shop.
