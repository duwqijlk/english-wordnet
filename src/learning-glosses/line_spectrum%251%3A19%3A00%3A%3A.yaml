senseId: 'line_spectrum%1:19:00::'
synsetId: 11495876-n
simpleMeaning: A band of colours in which power is packed into narrow strips, made by worked-up atoms
  and ions as they drop back to a lower power level
scope: A band of colours with power packed into narrow strips, not a band with colours spread out evenly
  and not a band with dark gaps where colours are missing.
examples:
- The line spectrum of hydrogen shows bright narrow strips.
- Each gas has its own line spectrum.
