simpleMeaning: Shine or hit with very great force or brightness.
scope: This is about harsh light or a powerful impact, not about tapping a signal, striking yourself,
  or sailing.
examples:
- The sun beat down on the empty road all afternoon.
- Rain beat against the windows throughout the night.
