simpleMeaning: To use rude or offensive language.
scope: This is the act of speaking offensive words (also called swear or cuss), not the rude word itself,
  not putting a magic spell on someone, and not making a solemn vow.
examples:
- He cursed loudly when he hit his thumb with the hammer.
- The old man cursed at the driver who cut him off.
