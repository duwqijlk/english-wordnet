simpleMeaning: The general lasting laws of the United States, brought together by subject, made and put
  out by a part of the House of Representatives.
scope: The general lasting laws of the United States, brought together by subject, also called United
  States Code, not the laws of one state but the laws of the whole land.
examples:
- The U. S. Code holds the lasting laws of the land.
- Lawyers look up the law in the U. S. Code.
