simpleMeaning: a thing made at home that, when one to three tablespoons are dissolved in a glass of warm
  water, makes a person bring up food from the stomach
scope: Also called dry mustard, it is a thing mixed in a glass of warm water to make a person bring up
  food from the stomach, not a sauce to eat with food.
examples:
- The old book said to mix powdered mustard in warm water to make a person bring up food.
- She took powdered mustard in warm water so she would bring up the food in her stomach.
