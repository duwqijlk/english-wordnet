senseId: 'meander%2:38:00::'
synsetId: 01886807-v
simpleMeaning: to go by a twisting way that coils, turns, and comes round in a circle, or to send something
  by such a way
scope: Also called wind, wander, thread, and weave; not the noun for a walk or a bend, but the act of
  moving that way.
examples:
- The path meanders through the vineyards.
- The river meanders through the hills.
