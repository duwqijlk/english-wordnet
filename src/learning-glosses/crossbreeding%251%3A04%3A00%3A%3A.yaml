simpleMeaning: In genetics, the act of mixing different kinds or sorts of animals or plants so that their
  young are a mix of both kinds
scope: 'Also called cross and crossing: in genetics, mixing animals or plants of different kinds to get
  mixed young, not people of different races having children together.'
examples:
- Crossbreeding two kinds of roses gave a flower with a new colour.
- Farmers use crossbreeding to make sheep that give more wool.
