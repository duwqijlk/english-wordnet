simpleMeaning: A loose cloak worn by men in old Rome
scope: A loose cloak worn by men in old Rome, not the brain's outer layer, not a shell-making layer in
  sea animals, and not a church vestment.
examples:
- The senator wore a pallium over his tunic on cool days.
- In the play, the Roman men all wore a pallium.
