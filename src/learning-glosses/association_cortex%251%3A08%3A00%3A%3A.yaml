simpleMeaning: the outer layer of the brain where the parts do not move the body or take in the senses,
  but are thought to work with what we know
scope: 'Also called association area: the outer brain layer for thinking, not the parts that move the
  body and not the parts that take in the senses.'
examples:
- The association cortex links what we see with what we already know.
- Doctors studied the association cortex to learn how the brain plans.
