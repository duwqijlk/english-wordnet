simpleMeaning: danger, harm, or injury kept away in advance by a step taken now, before anything goes
  wrong
scope: 'Also called a guard and a precaution: danger, harm, or injury kept away in advance, not a paper
  that lets you travel safely in war and not a person who watches over a place.'
examples:
- An insurance policy is a good safeguard against sudden loss.
- She wore a helmet as a safeguard on the building site.
