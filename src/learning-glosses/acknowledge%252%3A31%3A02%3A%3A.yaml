simpleMeaning: To agree that something is good in law and must be kept
scope: To agree that something is good in law, not to say that a thing is true and not to show you have
  seen a person.
examples:
- The clerk asked him to acknowledge the deed before two witnesses.
- She acknowledged the signed paper in front of the court.
