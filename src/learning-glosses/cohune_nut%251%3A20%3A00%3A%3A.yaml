simpleMeaning: the seed of a palm tree, with a hard white shell like that of an ivory seed
scope: The seed of a palm tree, with a hard white shell like that of an ivory seed; not a soft-shelled
  seed, and not the seed of a low bush.
examples:
- The cohune nut has a hard white shell.
- Cohune nuts look like ivory nuts.
