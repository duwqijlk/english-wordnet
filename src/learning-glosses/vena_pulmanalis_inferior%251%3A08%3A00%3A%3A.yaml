simpleMeaning: Either of two lung blood tubes, left and right, that carry blood back from the lower parts
  of the lungs.
scope: One of two lung blood tubes carrying blood back from the lower lungs; inferior pulmonary vein is
  another name for this sense; not a tube from the upper lungs and not a tube from the heart.
examples:
- The vena pulmanalis inferior returns blood from the lower lobes of the lungs.
- Doctors checked the vena pulmanalis inferior on the scan.
