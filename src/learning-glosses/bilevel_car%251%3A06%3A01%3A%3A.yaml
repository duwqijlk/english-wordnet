simpleMeaning: A train coach with two floors for travellers, holding more travellers than one with a single
  floor.
scope: A train coach with two floors for travellers, also called bilevel rail car, bilevel railcar, double-deck
  carriage, double-deck rail car and double-deck railcar; not a single-floor coach and not a goods wagon.
examples:
- The bilevel car carried twice as many travellers as the old ones.
- We sat on the top floor of the bilevel car.
