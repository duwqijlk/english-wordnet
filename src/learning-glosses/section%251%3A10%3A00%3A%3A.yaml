simpleMeaning: a complete unit that forms part of a longer written work or piece of music
scope: A self-contained portion of a written or musical work, not a thin slice for a microscope, a region
  of a country, a piece that fits into a whole object, a division of an organization, or a surgical cut.
examples:
- The business section of the newspaper comes after the front page.
- The opening section of the symphony is slow and quiet.
