simpleMeaning: the quality of being new in a fresh way that feels pleasant
scope: The quality of being refreshingly new, also called freshness, and not a cheap showy ornament or
  simply being different.
examples:
- The novelty of the idea pleased everyone.
- We enjoyed the novelty of eating outside.
