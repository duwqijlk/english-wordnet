simpleMeaning: a straight line from the centre of a circle to its edge, or from the centre of a ball to
  its outer surface
scope: This sense is the straight line itself, not the round area it marks out and not the bone in the
  lower arm.
examples:
- Draw a radius from the centre of the circle to its edge.
- Each radius of the ball goes from its centre to its outer surface.
