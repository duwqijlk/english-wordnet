senseId: 'pediment%1:06:00::'
synsetId: 03910776-n
simpleMeaning: a three-sided top part of a wall, set between a flat band across the top of columns and
  a roof that slopes down
scope: The three-sided part above the front of a building, not the sloping roof itself and not the flat
  band below it.
examples:
- The old temple has a stone pediment above its front columns.
- Carved figures filled the pediment over the entrance to the museum.
