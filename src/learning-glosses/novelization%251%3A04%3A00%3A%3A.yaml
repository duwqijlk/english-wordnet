simpleMeaning: The act of turning something into a long written story.
scope: Turning something into a long written story; novelisation is another name for this; not writing
  a story from nothing, and not turning a story into a film.
examples:
- The novelization of the film came out a year after the film itself.
- His novelization kept the play's plot but added new scenes.
