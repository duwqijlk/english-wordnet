simpleMeaning: when you think of a country as one whole thing, not as its single parts
scope: Thinking of a country as one whole thing, not reaching across all parts of a country.
examples:
- Nationally, the number of people with jobs rose this year.
- He thought nationally, asking what was good for the whole country, not just his town.
