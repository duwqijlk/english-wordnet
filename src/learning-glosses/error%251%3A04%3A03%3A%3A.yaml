simpleMeaning: In baseball, a player who is trying to stop the other team fails to get a player out when
  a normal play would have been enough
scope: In baseball, a failed play by the team trying to stop the other team; not a wrong action in general,
  not a wrong idea, and not bad behaviour.
examples:
- The shortstop was charged with an error when he dropped an easy ball.
- An error by the first baseman let the runner reach first base.
