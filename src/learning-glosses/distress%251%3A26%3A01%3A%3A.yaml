simpleMeaning: a state of being in danger, in great trouble, or in need of help
scope: A state of danger, trouble or need, not the act of putting a person or group into hard times, especially
  with money.
examples:
- The ship was in distress and sent out a call for help.
- She helped families in distress after the flood.
