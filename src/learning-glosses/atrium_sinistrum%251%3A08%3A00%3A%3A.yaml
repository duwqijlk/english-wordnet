simpleMeaning: the left upper room of the heart that takes in blood from the blood vessels that bring
  blood from the lungs
scope: 'Also called left atrium or left atrium of the heart: the left upper room of the heart, not the
  right upper room and not one of the lower rooms of the heart.'
examples:
- Blood from the lungs flows into the atrium sinistrum.
- The atrium sinistrum pumps blood into the left ventricle.
