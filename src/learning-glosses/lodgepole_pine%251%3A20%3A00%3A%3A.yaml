simpleMeaning: With bark from red to yellow-brown split into small squares, this bushy tree of the sea
  coast of the north-west of America bears two needles in each bunch.
scope: Also called lodgepole, shore pine, and spruce pine, it is the bushy two-needled tree whose bark
  splits into small squares from red to yellow-brown.
examples:
- The lodgepole pine grew low and bushy on the coast.
- Two needles grew in each bunch on the lodgepole pine.
