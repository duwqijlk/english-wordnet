senseId: 'pulley-block%1:06:00::'
synsetId: 04026692-n
simpleMeaning: a machine with a wheel that has a cut round its edge, with a rope in the cut that changes
  the way a pull acts or where it acts
scope: A wheel with a rope in a cut round its edge that changes the way a pull acts; block, pulley and
  pulley block are other names for this sense, not a plain wheel with no rope and not a rope on its own.
examples:
- The pulley-block let us lift the heavy load with less force.
- We fixed the rope in the pulley-block before we started to lift.
