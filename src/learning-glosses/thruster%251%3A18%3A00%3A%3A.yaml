simpleMeaning: a person who pushes into a place or group where they are not wanted, or who pushes themself
  to the front
scope: 'Also called a pusher: a person who pushes in where they are not wanted or pushes to the front;
  not the small engine on a space ship that helps it move.'
examples:
- The young thruster pushed his way into the meeting and tried to sit at the front.
- People disliked the thruster because he always put himself ahead of others at work.
