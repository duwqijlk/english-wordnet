simpleMeaning: Made to stand in for the real thing, though it is not real itself.
scope: 'Also called false and fake: made to stand in for the real thing, though not real itself, not a
  funny copy of a person, and not the idea that art should copy life.'
examples:
- The imitation pearls looked real at first glance.
- The purse was imitation leather, not the real thing.
