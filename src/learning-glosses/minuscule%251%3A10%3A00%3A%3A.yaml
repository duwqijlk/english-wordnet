simpleMeaning: A small joined-up handwriting that grew out of an older Roman letter style in the 7th to
  9th centuries, used in books written by hand in the Middle Ages
scope: A small handwriting of the Middle Ages, not the adjective for things written in it and not the
  older large-letter style it came from.
examples:
- The monk copied the text in minuscule.
- The page was written in a neat minuscule that was hard to read.
