simpleMeaning: a tight piece of clothing worn in the water
scope: This is a tight piece of clothing for the water, also called swimsuit, swimwear, bathing costume
  and bathing suit; not everyday clothes and not a diving suit.
examples:
- She put on her swimming costume before jumping in the pool.
- His swimming costume was still wet from the sea.
