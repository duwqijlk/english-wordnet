simpleMeaning: the place, time and world in which a story, a play or another made-up account happens
scope: 'Also called canvas: this is the place and world of a story or play, not heavy cloth and not a
  tent or a painting.'
examples:
- Paris in the 1920s is the canvass for her story.
- The film needs a wider canvass of place and sound for its story.
