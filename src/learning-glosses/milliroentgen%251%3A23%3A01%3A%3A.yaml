synsetId: 92467110-n
simpleMeaning: A unit that measures exposure to ionising radiation, rays that can damage living cells,
  equal to one thousandth of a roentgen.
scope: A unit that measures exposure to ionising radiation, equal to one thousandth of a roentgen, not
  a roentgen itself and not a dose of medicine.
examples:
- The badge showed 200 milliroentgens for the year.
- A milliroentgen is a thousandth of a roentgen.
