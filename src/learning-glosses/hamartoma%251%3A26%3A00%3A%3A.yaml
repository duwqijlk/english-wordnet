simpleMeaning: A growth in one place in an organ that looks like a tumour but comes from faulty growth
  of the organ
scope: A growth in one place in an organ that looks like a tumour but comes from faulty growth, not a
  true tumour and not a normal part of the organ.
examples:
- The scan showed a hamartoma in her liver.
- A hamartoma looks like a tumour but grows from faulty development.
