simpleMeaning: the study of how the very large molecules that life needs are built and what they do, above
  all how they carry life's plans
scope: The study of how the very large molecules that life needs are built and what they do, above all
  how they carry life's plans; not the study of whole living things and not the study of cells.
examples:
- Molecular biology looks at the large molecules that carry life's plans.
- She studied molecular biology to learn how genes work.
