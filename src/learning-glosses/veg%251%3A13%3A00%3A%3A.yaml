simpleMeaning: parts of a plant with soft stems that people can eat, such as seeds, roots, stems, leaves,
  bulbs, tubers, or fruits that are not sweet
scope: 'Another name for vegetable, also called veggie: the parts of a plant that people eat; it is not
  meat and not a sweet fruit.'
examples:
- She bought fresh veg at the market for dinner.
- We grow our own veg in the back garden.
