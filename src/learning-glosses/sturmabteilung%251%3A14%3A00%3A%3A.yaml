simpleMeaning: A Nazi armed group set up by Hitler in 1921 that helped him gain power, but was pushed
  aside by the SS after 1943.
scope: This is a Nazi armed group set up by Hitler in 1921 that helped him gain power; SA and Storm Troops
  are other names for it, not the SS and not the regular army of Germany.
examples:
- The Sturmabteilung helped Hitler gain power in the early 1920s.
- After 1943 the Sturmabteilung was pushed aside by the SS.
