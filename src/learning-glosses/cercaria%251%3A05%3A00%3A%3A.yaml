simpleMeaning: A young flat worm, shaped like a tadpole and living on another animal, whose tail is gone
  when it grows up.
scope: A young flat worm shaped like a tadpole, living on another animal; not the grown worm, whose tail
  is gone.
examples:
- The cercaria is a young flat worm shaped like a tadpole.
- When the cercaria grows up, its tail is gone.
