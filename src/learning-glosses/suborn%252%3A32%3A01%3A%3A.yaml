senseId: 'suborn%2:32:01::'
synsetId: 00836837-v
simpleMeaning: To bring about false witness or false swearing.
scope: This sense is to bring about false witness or false swearing, unlike the sense for coaxing into
  swearing falsely or giving false witness, and unlike the sense for stirring someone to commit a crime
  or an evil deed.
examples:
- He tried to suborn the witness with false testimony.
- They suborned perjury to win the case.
