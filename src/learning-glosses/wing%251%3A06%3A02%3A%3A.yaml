simpleMeaning: a cover around a vehicle's wheels that stops water or mud from splashing up
scope: A vehicle part covering the wheels; this is the British name for what US English calls a fender,
  and it is not the limb a bird flies with or the lifting surface of an airplane.
examples:
- He scraped the rear wing of the car against the garage wall.
- The mechanic removed the front wing to reach the wheel.
