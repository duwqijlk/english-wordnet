simpleMeaning: to work out which kind of living thing something is, in fields such as botany and biology.
scope: This is the classification sense also called identify or name — working out which kind of living
  thing something is, not making a new finding, seeing something for the first time, or noticing that
  something exists.
examples:
- The ranger discovered the tracks belonged to a mountain lion.
- After examining the leaves, they discovered the plant was a type of mint.
