senseId: 'earth-received_time%1:28:00::'
synsetId: 15155564-n
simpleMeaning: The time the whole world uses when a thing that happens far away reaches that world.
scope: A time reading on the world-wide scale, set by the moment a far-off event reaches the Earth, not
  by the moment the event happened.
examples:
- The Earth-received time of the signal was noon.
- Scientists noted the Earth-received time when the probe's message arrived.
