simpleMeaning: a description in words that is clear and full of life, so you can almost see the thing
scope: Also called picture, characterization and delineation. This is a lively description in words, not
  a drawing of outer lines and not a picture made by drawing or painting.
examples:
- The author's depiction of life in the small town is so clear I could see every street.
- His depiction of the storm in words made us feel we were there.
