simpleMeaning: Played by pressing valves, this brass wind instrument sounds clear and bright through a
  thin tube ending in a wide flared bell.
scope: Also called a horn, a trumpet, or a trump; a brass wind instrument with valves, played to make
  a bright, clear sound.
examples:
- She played the cornet in the school band.
- The cornet player stood at the front of the stage.
