simpleMeaning: Its blast comes from a change inside the tiny centre of matter, and it can kill huge numbers
  of people at once
scope: A device that can kill huge numbers of people at once with a blast from inside the tiny centre
  of matter, also called atomic weapon, and not a gun or a bomb that uses ordinary explosives.
examples:
- The country tested a nuclear weapon in the desert.
- A nuclear weapon can level a whole city in seconds.
