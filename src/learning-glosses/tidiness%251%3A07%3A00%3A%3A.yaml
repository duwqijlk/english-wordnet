simpleMeaning: the quality of being neat and keeping things in good order
scope: Another name for this sense is neatness. It is the quality of keeping things neat and in good order,
  not the same as being clean and not one single act of putting things away.
examples:
- Her tidiness made the small office a pleasant place to work.
- His tidiness showed in the neat rows of books on his desk.
