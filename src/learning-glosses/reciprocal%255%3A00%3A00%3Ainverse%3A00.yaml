simpleMeaning: relating to 1 divided by a given number or amount, or by a maths rule that gives a result
  for each number put in
scope: This word describes a number, amount or maths rule after 1 is divided by it. It is not the noun
  that names the number you get, and not a general word for a thing with an opposite link to something
  else.
examples:
- The reciprocal ratio of 2 to 3 is 3 to 2.
- The reciprocal function gives 1 divided by the value of the first function.
