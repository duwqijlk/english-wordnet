simpleMeaning: before the 14th week of carrying a child, doctors end a pregnancy on purpose by opening
  the neck of the womb and drawing out the embryo and afterbirth with suction
scope: 'Also called suction curettage: a way to end a pregnancy in the first 14 weeks, done by drawing
  out the embryo with suction, not a birth and not an operation that cuts the womb.'
examples:
- The doctor used vacuum aspiration to end the pregnancy before the 14th week.
- Vacuum aspiration draws out the embryo with suction through the neck of the womb.
