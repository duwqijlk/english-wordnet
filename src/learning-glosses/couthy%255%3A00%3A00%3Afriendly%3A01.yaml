simpleMeaning: Kind, warm and friendly, a word used chiefly in Scotland
scope: Kind, warm and friendly, a word used chiefly in Scotland; couthie is another name for this sense,
  not cold or stiff and not merely cheerful.
examples:
- He was a couthy fellow who always had time for a chat.
- The couthy welcome made us feel at home at once.
