simpleMeaning: In the New Testament, the end of time after Armageddon, when God settles the fate of every
  person by the good and evil of their life on earth
scope: In the New Testament, the end of time after Armageddon, when God settles the fate of every person;
  doomsday, Doomsday, crack of doom, day of reckoning, end of the world, eschaton, Day of Judgement, Day
  of Judgment, Last Day, Last Judgement, Last Judgment and Judgment Day are other names for this sense;
  not the battle of Armageddon itself, and not the end of one person's life.
examples:
- On Judgement Day, God will judge every person.
- They believed Judgement Day would come at the end of time.
