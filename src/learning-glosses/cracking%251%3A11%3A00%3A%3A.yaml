simpleMeaning: a short, sharp sound that comes all at once
scope: 'Also called crack, and another name is snap: a sudden sharp sound. It is not the act of breaking
  something, and not the way oil is broken down into smaller parts.'
examples:
- The cracking of the ice woke us in the night.
- We heard a loud cracking from the tree branch.
