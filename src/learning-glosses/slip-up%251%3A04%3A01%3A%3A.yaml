simpleMeaning: A small mistake made without meaning to, most often seen in speaking or writing, in small
  mishaps or in lapses of memory
scope: A small mistake made without meaning to, most often seen in speaking or writing, also called slip,
  miscue or parapraxis; not a deliberate error and not a serious failure.
examples:
- It was just a slip-up when I called him by the wrong name.
- Her slip-up in the letter was easy to miss.
