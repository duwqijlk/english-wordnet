simpleMeaning: a plant from the east of North America, with tube-shaped flowers of a sky colour or white
  that open little or not at all
scope: 'Also called blind gentian and closed gentian: a plant from eastern North America with tube-shaped
  flowers that stay nearly shut, not a plant with wide-open flowers and not a gentian from the west.'
examples:
- The bottle gentian grew by the stream, its flowers still shut.
- We saw a bottle gentian with pale flowers that had hardly opened.
