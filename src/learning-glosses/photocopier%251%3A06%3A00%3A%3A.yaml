simpleMeaning: a machine that makes copies of something by using light to make a picture of it first
scope: A machine that makes copies by using light to make a picture first; not a printer that prints files
  from a computer and not a scanner that only saves a picture.
examples:
- She put the letter on the photocopier to make two copies.
- The office photocopier stopped working, so no one could copy the forms.
