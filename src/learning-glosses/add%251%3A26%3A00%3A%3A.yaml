simpleMeaning: A condition in which a person is very active, acts without thinking, and has strong feelings
  that are hard to control.
scope: A health condition, also called attention deficit disorder, ADHD, attention deficit hyperactivity
  disorder, hyperkinetic syndrome, minimal brain damage, minimal brain dysfunction, or MBD; not simple
  high spirits, and not a learning problem.
examples:
- ADD makes it hard for him to sit still.
- The doctor said she has ADD.
