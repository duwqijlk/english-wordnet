simpleMeaning: The part like a thick cushion on the underside of an animal's foot or a person's finger
scope: The thick, cushion-like part under a foot or finger, not a block of ink, not a leaf floating on
  water, and not a place for launching rockets.
examples:
- The cat's pads made no sound on the floor.
- She felt the pad of her finger for a thorn.
