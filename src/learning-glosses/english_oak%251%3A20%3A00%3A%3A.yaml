simpleMeaning: A middle-sized to large tree of Europe that loses its leaves each year, with smooth leaves
  whose edges curve in round shapes; it gives hard strong pale wood.
scope: A middle-sized to large European tree that loses its leaves each year, also called common oak,
  pedunculate oak and Quercus robur; its smooth leaves have round edges, and its wood is hard, strong
  and pale.
examples:
- The English oak in the park loses its leaves each autumn.
- English oak gives hard pale wood used for fine furniture.
