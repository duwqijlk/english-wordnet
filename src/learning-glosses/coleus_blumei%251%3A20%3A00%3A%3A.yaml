simpleMeaning: A long-lived fragrant herb of southeastern Asia, with large usually bright-coloured or
  blotched leaves and spikes of blue-violet flowers; sometimes put in the genus Solenostemon.
scope: 'Also called painted nettle, Joseph''s coat, Solenostemon blumei, and Solenostemon scutellarioides:
  a leafy herb, not a nettle, and not a true coleus.'
examples:
- Coleus blumei brightened the shade with blotched leaves.
- She grew Coleus blumei for its blue-violet spikes.
