simpleMeaning: Talk passed from person to person by word of mouth, usually a mix of what is true and what
  is not
scope: Talk passed from person to person, not the act of telling such talk and not news that is known
  to be true.
examples:
- A rumor went round the town.
- The rumor about the new teacher turned out to be false.
