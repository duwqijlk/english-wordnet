senseId: 'mulch%1:06:00::'
synsetId: 03803418-n
simpleMeaning: a covering of rotting plant matter put on soil to keep it safe, to slow water loss from
  the soil, and to stop soil being washed or blown away
scope: This is the rotting plant matter used as a covering for soil, not the act of putting that covering
  on the soil.
examples:
- She spread a thick layer of mulch around the young trees.
- The mulch kept the soil wet and stopped it washing away in the rain.
