simpleMeaning: on a surface, marks or colours show you a person, a place, a thing, or an idea
scope: A picture on a surface, also called an icon, an image, or a picture; not a holy painting kept in
  a church.
examples:
- The museum hung an ikon of the old harbour on the wall.
- Each page of the book held an ikon of the village in winter.
