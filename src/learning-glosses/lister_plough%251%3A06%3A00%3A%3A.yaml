simpleMeaning: A farm tool with two curved blades that moves earth to each side of a middle ditch
scope: 'Also called a lister, a lister plow, a middle buster, and a middlebreaker: a farm tool with two
  curved blades that moves earth to both sides of a middle ditch, not a tool that moves earth to one side
  only.'
examples:
- The lister plough cut a furrow down the field.
- The lister plough pushed earth to both sides of the furrow as it moved.
