simpleMeaning: A citizen's right, especially the basic freedoms and privileges promised by the 13th and
  14th amendments and later acts of Congress, including equal treatment in law, society and the economy.
scope: This is a right that comes with citizenship and can be claimed in law, such as equal treatment
  in schools and jobs; it is not a human right held by everyone regardless of nationality, and not a mere
  privilege or favour.
examples:
- Civil rights leaders marched for equal access to schools and jobs.
- Her lawyers argued that the policy violated her civil rights.
