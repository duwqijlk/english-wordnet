simpleMeaning: in a way that people like and that gives them a happy feeling
scope: This says the way something is done or looks makes people who see it feel happy, not that the person
  doing it feels happy.
examples:
- The room was pleasingly large, with space for everyone to sit in comfort.
- She arranged the flowers pleasingly on the table.
