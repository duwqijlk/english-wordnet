simpleMeaning: A slow tree animal of Central America with two long claws on each front foot and three
  long claws on each back foot.
scope: 'Also called two-toed sloth and unai: a slow tree animal of Central America with two claws on each
  front foot, not a three-toed sloth and not a monkey.'
examples:
- The unau slept curled in the fork of a tree all day.
- An unau climbs slowly through the trees of Central America.
