simpleMeaning: tobacco broken into very small pieces and wrapped in paper, made for a person to smoke
scope: This is tobacco broken into very small pieces and wrapped in paper for smoking; butt is another
  name for this sense. It is not loose tobacco without paper and not a pipe for smoking.
examples:
- He lit a cigarette outside the shop.
- She put out her cigarette and went back inside.
