simpleMeaning: A European plant that stays green all year, with white or purplish flowers like roses that
  open in winter.
scope: Also called black hellebore, winter rose and Christmas rose; a European evergreen with white or
  purplish rose-like winter flowers, not other hellebores and not spring flowers.
examples:
- Helleborus niger blooms in the snow in January.
- She planted Helleborus niger under the old beech tree.
