simpleMeaning: In line with a weighted line; straight up and down.
scope: Straight up and down, in line with a weighted line, not the act of setting a thing straight, not
  looking into a thing in depth, and not the metal weight itself.
examples:
- The wall stands plumb after the repair.
- Make sure the post is plumb before you fix it.
