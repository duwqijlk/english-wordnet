simpleMeaning: A way of steering a missile by tools inside it that feel how it moves and turns.
scope: Steering a missile by tools inside it that feel its movement, not by radio orders from the ground
  and not by a pilot; inertial navigation is another name for this sense.
examples:
- Inertial guidance kept the missile on course.
- The missile uses inertial guidance to steer itself.
