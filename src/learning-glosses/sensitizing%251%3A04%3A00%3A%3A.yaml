simpleMeaning: giving a living thing shots, one after another, so it starts to react to a serum, the liquid
  part of blood
scope: Giving a living thing a set of shots so it reacts to a serum, also called sensitisation, sensitising
  and sensitization; not a single shot, and not making it react to a drug.
examples:
- Sensitizing the mice took a series of injections over two weeks.
- The nurse kept sensitizing the patient with small shots of serum.
