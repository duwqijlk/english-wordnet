schema: oewn-learning-gloss-v2
senseId: 'modus_vivendi%1:10:00::'
synsetId: 07193852-n
simpleMeaning: A short-term deal between sides in a dispute, letting them live with it until a lasting
  deal is made
scope: A short-term deal that lets sides in a dispute live with it for now, not a lasting peace deal and
  not a truce that stops fighting.
examples:
- The two sides reached a modus vivendi while talks went on.
- Their modus vivendi held until a lasting deal was made.
