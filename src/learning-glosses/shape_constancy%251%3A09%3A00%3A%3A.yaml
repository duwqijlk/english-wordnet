senseId: 'shape_constancy%1:09:00::'
synsetId: 05717454-n
simpleMeaning: The way the mind keeps judging a rigid object's shape to be unchanged even when a different
  viewing angle changes the image it casts on the eye.
scope: A psychology term for judging an object's shape as unchanged across viewing angles; not the similar
  constancy of its size, colour or brightness.
examples:
- Shape constancy lets us recognise a door as rectangular even when it looks like a narrow slice.
- Tests of shape constancy show how strongly people rely on what they already know about an object.
