simpleMeaning: in sports, the rotation a ball gets when it is hit off-centre or released with a sharp
  turn
scope: This is the spin on a ball, not the left or right half of the body, not a surface or outer face
  of an object, not one of two competing groups, not a place relative to a centre, not a line of descent,
  and not the verb meaning to support one party.
examples:
- The billiards player put side on the cue ball to change its angle.
- She added side to her serve so the ball would swerve.
