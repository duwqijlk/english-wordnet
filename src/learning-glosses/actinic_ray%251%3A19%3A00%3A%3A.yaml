simpleMeaning: a beam of light or other waves that can make a chemical change happen
scope: A beam of light or other waves that can set off a chemical change, also called actinic radiation;
  not a beam of light that only lets you see, and not a heat ray.
examples:
- An actinic ray from the lamp changed the chemicals on the paper.
- Actinic rays can darken skin as they set off changes in it.
