simpleMeaning: One way the body stores fuel, kept mostly in the liver and turned into sugar when the body
  needs it
scope: One way the body stores fuel, kept mostly in the liver; glycogen is another name for this sense,
  not the stuff that stores fuel in plants and not fat stored in the body.
examples:
- Animal starch builds up in the liver after a meal.
- The body breaks down animal starch when it needs quick fuel.
