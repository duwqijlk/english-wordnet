simpleMeaning: a big fire lit out of doors to send a sign or to mark a joyful day
scope: 'Also called a bonfire: a big fire lit outside as a signal or for a celebration, not a small fire
  for warmth and not a fire that got out of hand.'
examples:
- They lit a balefire on the hill to mark the feast day.
- The balefire on the cliff sent a sign to the ships at sea.
