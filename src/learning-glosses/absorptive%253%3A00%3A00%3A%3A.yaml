simpleMeaning: able to take in and hold something, such as a liquid or heat
scope: Able to take in and hold something, such as a liquid or heat, also called absorbent; not a thing
  that lets water run off and not a thing that gives out heat.
examples:
- The towel is absorptive and soaks up the spill.
- This absorptive cloth holds much water.
