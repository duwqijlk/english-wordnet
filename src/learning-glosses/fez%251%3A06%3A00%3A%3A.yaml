simpleMeaning: a man's cap made of felt (soft thick cloth), usually red, shaped like a cone with a flat
  top and a hanging tassel (a group of threads) on top
scope: Also called tarboosh, this is a man's cap, usually red, with a flat top and a hanging tassel; it
  is not any other kind of hat.
examples:
- He wore a red fez with a black tassel hanging from the top.
- The man took off his fez when he came inside.
