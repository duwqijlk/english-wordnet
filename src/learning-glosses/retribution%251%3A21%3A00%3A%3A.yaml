simpleMeaning: A punishment that a person has truly earned by doing wrong
scope: A punishment that a person has truly earned by doing wrong; not revenge taken in anger, and not
  a punishment that is unfair.
examples:
- The thief faced retribution for the money he had stolen.
- She saw his fall from power as just retribution for his crimes.
