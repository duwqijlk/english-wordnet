simpleMeaning: to make a thing straight by pulling it up or spreading it out
scope: To make a thing straight by pulling it up or spreading it out, not to make it straight by opening
  it out from a roll, and not simply to make a thing straight or straighter.
examples:
- She straightened up the rug and smoothed it flat.
- He straightened out the wire before he used it.
