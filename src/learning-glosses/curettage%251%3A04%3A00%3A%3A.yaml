simpleMeaning: With a scraping tool, tissue or growths are scraped out of a hollow place in the body,
  such as the womb, in this operation.
scope: Also called curettement, this operation scrapes tissue or growths from a hollow place in the body,
  not one that cuts them out with a knife.
examples:
- The curettage scraped the growths from the womb.
- She had a curettage to clear tissue from her womb.
