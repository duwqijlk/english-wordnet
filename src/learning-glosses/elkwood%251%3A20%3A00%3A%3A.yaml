simpleMeaning: Big leaves spread like open umbrellas at the ends of its branches on this small tree from
  eastern North America, which sheds its leaves yearly and bears creamy white flowers
scope: Also called elk-wood, umbrella magnolia, and umbrella tree, this small tree from eastern North
  America is the one whose big leaves spread like open umbrellas at the ends of its branches.
examples:
- The elkwood by the path had creamy white flowers and big leaves spread like umbrellas.
- We sat under an elkwood whose leaves fanned out like open umbrellas at the ends of its branches.
