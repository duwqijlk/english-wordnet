simpleMeaning: In physics, the pull that holds protons and neutrons together inside the hearts of atoms,
  carried by gluons
scope: This is the pull inside atoms, not the pull of magnets or of gravity; also called strong force
  and strong interaction.
examples:
- The color force holds protons and neutrons together in the atom.
- Gluons carry the color force inside the nucleus.
