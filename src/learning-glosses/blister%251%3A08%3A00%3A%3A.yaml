simpleMeaning: In pathology, a raised part of skin that is full of clear liquid
scope: A raised, liquid-filled part of skin, not a bubble-like flaw in paint on a surface and not the
  verb uses for skin getting or being made to form such a part.
examples:
- A blister formed on her heel after the long walk in new shoes.
- He had a small blister on his finger from touching the hot pan.
