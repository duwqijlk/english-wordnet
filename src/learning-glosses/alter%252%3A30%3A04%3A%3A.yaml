simpleMeaning: To put new words into a piece of writing, often so that it says what is not true
scope: Putting words into a text, often to make it false, not becoming different in one way while staying
  the same.
examples:
- He altered the letter by adding a whole new line.
- Someone had altered the old text to change what it said.
