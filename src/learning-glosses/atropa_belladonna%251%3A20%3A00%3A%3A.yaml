simpleMeaning: A long-lived herb from Eurasia, with bell-shaped reddish flowers and shiny black berries;
  widely grown in the United States; its roots and leaves give atropine.
scope: 'Also called belladonna, belladonna plant, and deadly nightshade: a poisonous herb, not a food
  plant, and not a tree.'
examples:
- Atropa belladonna grew in the old garden.
- The berries of Atropa belladonna are shiny and black.
