simpleMeaning: A plant of eastern North America flowering in early spring, like its kin the jack-in-the-pulpit
  but with finger-split leaves, a thin greenish-yellow hood and a long fleshy flower spike.
scope: Also called green dragon; like its kin the jack-in-the-pulpit, but with finger-split leaves, a
  thin greenish-yellow hood and a long fleshy flower spike, it flowers in early spring in eastern North
  America.
