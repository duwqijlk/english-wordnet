simpleMeaning: A set of rules about right and wrong, and how people should act
scope: A set of rules about right and wrong; ethic is another name for this sense, not a law of the land
  and not a set of manners for one place.
examples:
- Doctors follow an ethical code in their work.
- The ethical code of the firm bans gifts from clients.
