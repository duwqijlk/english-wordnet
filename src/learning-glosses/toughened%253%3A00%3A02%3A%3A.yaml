senseId: 'toughened%3:00:02::'
synsetId: 02456417-a
simpleMeaning: made hard and strong in the body through hard use or hard conditions
scope: 'Also called tough: this is about a part of the body made hard and strong by use, not about a person
  who does not give up, and not about meat that is hard to eat.'
examples:
- After years of walking barefoot, the skin on his feet was toughened.
- Her hands were toughened by years of farm work.
