simpleMeaning: In the army, troops march in tight rows, shoulder to shoulder, keeping step together.
scope: This is army troops marching in tight rows, shoulder to shoulder; not soldiers marching in loose
  open ranks and not a single soldier on parade.
examples:
- The recruits learned close-order drill on the parade ground.
- Close-order drill keeps the whole platoon moving as one.
