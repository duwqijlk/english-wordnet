simpleMeaning: Like a mother, a person has or shows soft care, warmth and love
scope: 'Also called maternalism, maternity and motherliness: the soft care, warmth and love a mother has
  or shows, not a set of duties and not love in general.'
examples:
- Her maternal quality showed in the soft way she spoke to the child.
- The nurse's maternal quality made the sick children feel safe.
