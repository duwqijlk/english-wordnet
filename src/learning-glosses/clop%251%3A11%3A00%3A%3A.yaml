simpleMeaning: the sound a horse's feet make when they hit a hard surface
scope: Also called clopping, clumping, and clunking. This is the sound itself, not the verb sense of making
  that sound or moving while making it.
examples:
- We heard the clop of the horse's hooves on the stone road.
- The steady clop outside told us a horse was passing.
