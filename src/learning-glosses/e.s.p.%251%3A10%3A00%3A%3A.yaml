simpleMeaning: The seeming power to know things that the eyes, ears, and other senses cannot reach
scope: This is the seeming power to know things the senses cannot reach; clairvoyance, extrasensory perception,
  second sight and ESP are other names for this sense, and it is not ordinary sight or hearing.
examples:
- She claimed to have E.S.P. and to know what was in the box.
- He said his E.S.P. told him the letter had come.
