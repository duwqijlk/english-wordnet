simpleMeaning: a metal plate with holes or wavy ridges, used inside a power box to carry power and to
  hold the stuff that makes the power
scope: This is a metal plate with holes or wavy ridges, also called grid; not a flat sheet of metal and
  not the power box itself.
examples:
- The storage-battery grid holds the active material in place.
- A bent storage-battery grid can stop the battery from working.
