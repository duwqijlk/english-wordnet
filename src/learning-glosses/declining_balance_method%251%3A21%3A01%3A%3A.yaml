simpleMeaning: A way to work out how much a thing loses in worth, by taking away a set share of what it
  is worth now each year.
scope: This is a way to work out how much a thing loses in worth, also called the declining balance method
  of depreciation, not a way that takes off the same amount each year or a guess at what a thing will
  sell for.
examples:
- The firm used the declining balance method to work out the van's loss in worth.
- Under the declining balance method, the yearly cut is a set share of the current worth.
