simpleMeaning: A clumsy thing made in a hurry from bits put together badly, built to do one job
scope: A badly put-together thing made in a hurry to do one job, not a well-made machine and not a plan.
examples:
- The repair was a kludge that held for a week.
- He fixed the radio with a kludge of spare parts.
