simpleMeaning: 'One of several cements from gypsum: a white powder that makes a paste with water and sets
  hard, used for moulds, statues, and casts for broken limbs.'
scope: Also called plaster.
examples:
- She mixed plaster of Paris with water for the mould.
- The plaster of Paris cast held his broken arm still.
