senseId: 'vacuolization%1:26:00::'
synsetId: 14101175-n
simpleMeaning: The state of a cell that has become filled with tiny hollow spaces, called vacuoles.
scope: The state of a cell that has become full of tiny hollow spaces, with vacuolation and vacuolisation
  as other names for this sense; not a single hollow space and not the filling of a cell with water.
examples:
- Vacuolization appeared in the cells after the drug was added.
- The microscope showed vacuolization in the leaf cells.
