simpleMeaning: The tiny cells that can start a baby are held in this thick white liquid, which leaves
  a man's body during sex.
scope: Come, seed, cum, semen, and ejaculate are other names for this thick white liquid that leaves a
  man's body during sex.
examples:
- The seminal fluid was thick and white.
- The tiny cells in seminal fluid can start a baby.
