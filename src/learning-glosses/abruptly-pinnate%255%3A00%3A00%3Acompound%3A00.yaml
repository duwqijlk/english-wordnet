simpleMeaning: of a leaf shape, with small leaves in pairs along a stem and a pair at the tip
scope: This is a leaf shape with small leaves in pairs along the stem and a pair at the tip; even-pinnate
  and paripinnate are other names for this sense, not a leaf shape with one small leaf at the tip.
examples:
- The abruptly-pinnate leaf ended in two small leaflets, not one.
- Botanists call the leaf abruptly-pinnate because it ends in a pair.
