simpleMeaning: a natural hole or opening that goes through a bone or through a thin layer in the body
scope: This is a hole in bone or in a thin body layer, not a break or pause in work, in a show, or in
  time.
examples:
- The doctor showed us the small hiatus in the bone on the scan.
- The surgeon noted a hiatus through the thin layer during the operation.
