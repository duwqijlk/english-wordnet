simpleMeaning: any liquid that is suitable for people to take as a beverage, such as water, milk, or juice.
scope: This is not the act of taking too much alcohol, and not one particular serving of a product.
examples:
- Milk is a good drink for growing children.
- The cafe sells hot and cold drinks all day.
