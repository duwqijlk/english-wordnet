simpleMeaning: In biochemistry, describes a change that takes in energy, leaving what it makes with more
  free energy than what it started from.
scope: In biochemistry, describes a change that takes in energy, not one that gives energy out and not
  a change of heat alone.
examples:
- Photosynthesis is an endergonic process.
- An endergonic step in the cell takes in energy from light.
