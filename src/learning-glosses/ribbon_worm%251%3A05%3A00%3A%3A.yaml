simpleMeaning: soft sea creatures with no rings on the body, that have a thin tube-like snout and can
  stretch out long and pull back short
scope: Not a hard-shelled sea creature, and not a garden worm; also called nemertean, nemertine and proboscis
  worm.
examples:
- The ribbon worm stretched across the rock pool.
- A ribbon worm pushed out its thin snout to catch food.
