senseId: 'lobate_foot%1:05:00::'
synsetId: 02157965-n
simpleMeaning: Each toe stands apart with a thin flap of skin along its sides, at the end of a bird's
  leg
scope: A bird's foot with separate toes that each carry a flap along the side, not a webbed foot and not
  a plain clawed foot.
examples:
- The coot's lobate foot has a flap along each toe.
- A lobate foot lets the bird paddle with separate toes.
