simpleMeaning: A grain plant that gives food for people and animals, with a growth and stem like Indian
  corn but with leaves that have saw-like edges
scope: This grain plant is also called kaffir, kaffir corn and kafir corn, and is not Indian corn itself
  and not a wheat plant.
examples:
- Farmers grew great millet for food and for animal feed.
- Great millet stood in the field beside the Indian corn.
