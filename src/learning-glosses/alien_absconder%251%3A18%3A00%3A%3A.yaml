simpleMeaning: a person from another country who has fled and stays in the United States after a judge
  in an immigration court has told them they must leave
scope: A person ordered to leave who stays, not a person with leave to stay and not a person who has just
  arrived.
examples:
- The government has categorized more than 320,000 foreigners as alien absconders.
- The alien absconder stayed in the country long after the judge ordered him to leave.
