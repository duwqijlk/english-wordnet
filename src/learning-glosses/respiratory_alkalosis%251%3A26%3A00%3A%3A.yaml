simpleMeaning: blood too alkaline when the lungs move too much gas in and out, as in breathing too fast
  from great fear, too much aspirin, or acid the body makes
scope: A blood change from over-breathing, not a lung disease and not too little gas moving in the lungs.
examples:
- Her respiratory alkalosis came from breathing too fast during a panic attack.
- The doctor said his respiratory alkalosis followed an aspirin overdose.
