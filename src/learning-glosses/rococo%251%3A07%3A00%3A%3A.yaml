simpleMeaning: Fanciful yet graceful decoration, uneven on its two sides, in art and in buildings, that
  began in France in the 1700s.
scope: Fanciful yet graceful decoration in art and buildings that began in France in the 1700s, not the
  adjective for having too much uneven decoration.
examples:
- The room was full of rococo carving and gold paint.
- Rococo began in France and spread through Europe in the 1700s.
