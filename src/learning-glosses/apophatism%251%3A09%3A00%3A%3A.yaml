senseId: 'apophatism%1:09:00::'
synsetId: 05950822-n
simpleMeaning: the belief that God cannot be known, is wholly unlike all else, and can only be described
  by saying what God is not
scope: In religion, the belief that God is beyond knowing and can only be spoken of in negatives, not
  the belief that God can be described in plain terms.
examples:
- Apophatism holds that God is wholly other.
- The monk's apophatism led him to speak of God only in negatives.
