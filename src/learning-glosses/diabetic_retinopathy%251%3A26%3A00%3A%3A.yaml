simpleMeaning: The tiny blood vessels in the retina are damaged in people whose diabetes stays poorly
  controlled, with blood sugar high over a long time
scope: Not damage to the retina from other causes; this follows poorly controlled diabetes.
examples:
- Diabetic retinopathy damaged the tiny blood vessels in her retina.
- His diabetic retinopathy came from years of poorly controlled diabetes.
