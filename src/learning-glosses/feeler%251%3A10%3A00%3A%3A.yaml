senseId: 'feeler%1:10:00::'
synsetId: 07179000-n
simpleMeaning: a suggestion put forward when not yet sure, made to find out what other people think or
  how they react
scope: 'Also called approach, advance, and overture: a suggestion made when not yet sure to see how people
  react, not a body part on an insect or fish, and not a sense of touch.'
examples:
- She put out a feeler about working from home to see what the team thought.
- His first feeler on the new price got a cold answer from buyers.
