simpleMeaning: A piece first made for other instruments, cut down to its main parts and set out on two
  lines for the keys.
scope: It is also called piano reduction, and it is not the full written music for many instruments, but
  the main parts set out for the keys.
examples:
- The piano transcription keeps the main parts of the piece for one player.
- He played the main parts from the piano transcription.
