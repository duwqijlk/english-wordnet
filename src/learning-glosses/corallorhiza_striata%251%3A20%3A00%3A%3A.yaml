simpleMeaning: A nearly leafless wildflower with upright reddish-purple stems bearing sprays of pale pinkish
  and brownish-striped flowers; from western Canada to Mexico.
scope: Also called striped coral root; a nearly leafless wildflower with reddish-purple stems, not a leafy
  garden flower and not a coral.
