simpleMeaning: The radioactive break-up of an atom's core, which gives off a small heavy bit as it falls
  apart.
scope: This is the radioactive break-up of an atom's core, not of the atom's outer parts, and it gives
  off a small heavy bit.
examples:
- Alpha decay gives off a small heavy bit from the atom's core.
- In alpha decay, the atom's core breaks up and gives off a bit.
