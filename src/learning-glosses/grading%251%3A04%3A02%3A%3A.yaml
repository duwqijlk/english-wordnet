simpleMeaning: the work of changing the level of the ground so its surface is smooth and flat, or slopes
  gently
scope: Also called leveling. This is work that makes ground flat or gently sloping; it is not giving marks
  to students' work and not sorting things by quality.
examples:
- Grading of the site took two days before building could start.
- The workers did the grading to make the road slope gently.
