simpleMeaning: a tough kind of cabbage with rough curled leaves that stay loose and never fold into a
  tight round head
scope: 'Also called cole, colewort, kail and kale: a tough cabbage with rough curled leaves that stay
  loose, not a cabbage that folds into a tight round head and not a lettuce.'
examples:
- She grew borecole in the garden all winter.
- The borecole leaves stayed loose and never formed a head.
