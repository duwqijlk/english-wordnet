simpleMeaning: A long-lived plant on sandy pebbled shores of northern Europe and Baltic and Black Seas,
  with small white flowers in sprays and large thick blue-green leaves often eaten as greens.
scope: Also called sea cole or sea kale; a long-lived plant of northern shores with white flowers and
  thick blue-green leaves eaten as greens, kin to other shore plants with edible leaves.
examples:
- Crambe maritima grows on the sandy shore, its thick blue-green leaves spread wide.
- We gathered Crambe maritima leaves to eat as greens.
