simpleMeaning: In Christianity, all the priests and other church leaders as a group, not the ordinary
  members of a church
scope: All the priests and other church leaders of Christianity as a group, not the ordinary members of
  a church and not one priest alone.
examples:
- The clergy met to choose a new bishop.
- Members of the clergy led the service in the church.
