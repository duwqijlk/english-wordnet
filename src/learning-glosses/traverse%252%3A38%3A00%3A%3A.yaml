simpleMeaning: to cross a place from edge to edge, moving right over the ground between
scope: To go from one side of a place to the other, or right over it, not a denial in court and not a
  beam across a window or door.
examples:
- The caravan traversed almost a hundred miles of desert each day.
- We traversed the wide plain on foot before nightfall.
