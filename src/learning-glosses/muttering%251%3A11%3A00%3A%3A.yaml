simpleMeaning: a low, steady sound that is hard to make out, often with the lips moving but no clear words
  spoken
scope: 'Also called mutter, murmur and murmuring: a low, steady sound, not a complaint said in a low voice.'
examples:
- From the next room we could hear the muttering of voices, but no clear words.
- His muttering went on under his breath, his lips moving without clear speech.
