simpleMeaning: a run of carbon-and-hydrogen stuffs, joined by single links in open chains, where each
  next one holds one more carbon and two more hydrogens than the last
scope: Also called paraffin, alkane, methane series, and paraffin series, the name marks the whole run,
  not any one stuff in it.
examples:
- The alkane series starts with methane and grows by one carbon at a time.
- The chart listed the alkane series from the smallest member upward.
