simpleMeaning: to bring in changes that give people a say in how they are ruled, for a nation
scope: Bringing in these changes to a nation, not a nation becoming ruled by its people by itself.
examples:
- The new leaders worked to democratize the nation after the war.
- They democratized the country by giving all adults the right to vote.
