simpleMeaning: to use the lines that carry cables and telegrams to send word to someone else
scope: To send word by wire to someone else, also called wire and cable, not the machine itself that sends
  such messages.
examples:
- She telegraphed the news to her brother in New York.
- The office telegraphed the results as soon as the votes were counted.
