simpleMeaning: In chemistry, all stuff is made of tiny separate bits that cannot be split or destroyed
  and can be counted to an end
scope: This idea, also called atomism, atomist theory, or atomistic theory, says all stuff is made of
  tiny bits, not of stuff that can be split without end.
examples:
- The atomic theory says all stuff is made of tiny bits.
- Democritus and Epicurus held atomic theories of the universe.
