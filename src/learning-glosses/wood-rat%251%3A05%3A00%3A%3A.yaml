simpleMeaning: A small short-tailed rodent of the Northern Hemisphere with soft grey-and-white fur, a
  furry tail and large ears; some act as hosts for ticks that spread Lyme disease.
scope: A short-tailed rodent of the Northern Hemisphere, not the common brown rat found near buildings;
  'wood rat' and 'woodrat' are other spellings of the same animal.
examples:
- We found a wood-rat nesting under the cabin floor.
- The wood-rat has large ears and a furry tail.
