simpleMeaning: Prickly leaves shaped like tongues and yellow flowers mark a wild plant found all over
  Europe and now at home in the United States.
scope: Also called bristly oxtongue, bugloss and oxtongue, this is a wild plant of Europe with prickly
  tongue-shaped leaves and yellow flowers, now at home in the United States; other wild plants with yellow
  flowers are its nearest rivals.
examples:
- The bitterweed showed prickly leaves shaped like tongues.
- Bitterweed is now at home in the United States.
