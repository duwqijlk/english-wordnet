simpleMeaning: not brave at all; too afraid and weak to face danger, in a way people do not respect
scope: Not brave and weak when facing danger, also called cowardly; not about a thing that causes fear,
  and not just shy or nervous by nature.
examples:
- The fearful soldier hid instead of helping his friends in the fight.
- Too fearful to stand up to the bully, he ran home.
