simpleMeaning: to write the music for a large group of players, giving each instrument its own part
scope: To write the music for a large group of players, giving each instrument its own part; not to play
  the music, and not to plan an event in secret.
examples:
- He will orchestrate the new song for a full band of players.
- She orchestrated the piece so the violins carried the tune.
