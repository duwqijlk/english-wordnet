senseId: 'reducing_agent%1:27:00::'
synsetId: 14804426-n
simpleMeaning: A substance able to bring about the reduction of another substance while itself oxidised,
  used in picture-making to thin a print or film by oxidising some free silver.
scope: Also called reducer and reductant; for cutting down another substance while itself oxidised, as
  in thinning a print or film.
examples:
- A reducing agent thins a print by oxidising free silver.
- Reducing agents bring about the cutting-down of another substance.
