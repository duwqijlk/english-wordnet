simpleMeaning: showing dark and light parts by means of thin lines that lie side by side or cross each
  other
scope: This describes a drawing made darker in parts with thin lines; it is not about a young bird coming
  out of an egg.
examples:
- The hatched areas of the drawing show where the shadow falls.
- He drew the hatched part with thin lines that cross each other.
