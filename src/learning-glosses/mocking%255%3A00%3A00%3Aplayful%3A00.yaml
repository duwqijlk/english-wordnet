simpleMeaning: in a playful way that upsets or annoys someone, especially by making fun of them
scope: 'Also called teasing and quizzical: playful and making fun, not the mean sense that looks down
  on someone with hate.'
examples:
- His mocking smile was playful, and his friends laughed with him.
- She gave him a mocking look and made fun of his hat in a friendly way.
