simpleMeaning: A long-eared animal of western North America, with antlers that fork into two points.
scope: A wild animal with long ears and forked antlers in western North America; burro deer is another
  name for it, not a mule, the farm animal, and not a small Asian deer.
examples:
- We saw a mule deer grazing at the edge of the woods.
- The mule deer stood still, its long ears turning toward us.
