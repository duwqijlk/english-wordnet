simpleMeaning: In stories and plays, used for a character who makes people feel care and understanding
  for him or her
scope: 'Also called appealing: in stories and plays, a character who makes people feel care for him or
  her; not about a real person who feels care for others, and not about shaking movements.'
examples:
- The writer made the thief a sympathetic character, so readers cared about him.
- In the play, the sympathetic young nurse is the person the audience hopes will do well.
