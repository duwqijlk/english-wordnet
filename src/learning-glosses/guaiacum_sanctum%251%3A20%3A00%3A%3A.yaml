simpleMeaning: A small evergreen tree from the south of the United States and the West Indies, a source
  of the wood called lignum vitae.
scope: Also called bastard lignum vitae; a small evergreen tree from the south of the United States and
  the West Indies, a source of the wood called lignum vitae, set beside other small trees of the same
  warm lands.
examples:
- Guaiacum sanctum grows in the south of the United States and the West Indies.
- The wood of Guaiacum sanctum is called lignum vitae.
