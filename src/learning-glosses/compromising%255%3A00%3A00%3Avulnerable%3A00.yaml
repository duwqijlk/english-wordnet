simpleMeaning: open to harm, especially harm to a person's good name, or to being thought to have done
  something wrong
scope: This describes a person or thing open to harm or to people thinking badly of them; not about settling
  a disagreement by each side giving up part of what it wants.
examples:
- Photos of the mayor in a compromising situation appeared in the newspaper.
- She kept the compromising letters locked away so no one could use them against her.
