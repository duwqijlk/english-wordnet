simpleMeaning: In biology, the thickening of a cell wall as new layers of stuff are laid down one after
  another.
scope: In biology, the thickening of a cell wall by new layers laid down one after another, not growth
  by stretching and not the placing of two things side by side.
examples:
- Apposition thickened the wall of the plant cell.
- The cell grew by apposition, adding layer upon layer.
