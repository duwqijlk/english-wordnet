simpleMeaning: Its leaves stay on all year, a little like those of holly, on this oak from southern Europe,
  which gives hard wood.
scope: Also called holly-leaved oak, holm oak, and holm tree, this is an oak from southern Europe whose
  leaves stay on all year and look a little like those of holly, and it gives hard wood.
examples:
- The evergreen oak kept its leaves through the winter.
- They cut the evergreen oak for its hard wood.
