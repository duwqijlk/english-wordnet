simpleMeaning: extra time after the time when something must be done, when there is no punishment for
  being late, especially when this extra time is given as a special favour
scope: Extra time after the time when something must be done, with no punishment for being late; not God's
  free help and not kindness to others.
examples:
- We had a month's grace to pay the bill after it was due.
- The bank gave us a short grace before we had to pay.
