simpleMeaning: A person who backs the idea that a state may refuse to obey the laws of the whole country
scope: A person who backs the idea that a state may refuse to obey the laws of the whole country; not
  a lawmaker, and not a person who breaks laws in secret.
examples:
- The nullifier argued that his state need not obey the law.
- As a nullifier, she held that states could stand against the central laws.
