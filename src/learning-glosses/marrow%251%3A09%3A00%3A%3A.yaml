simpleMeaning: the part of an idea or experience that holds its true point, so that without it the whole
  thing falls apart
scope: 'Another name for the heart, center, core, centre, meat, sum, substance, and essence of an idea
  or experience: its true point, not the soft stuff inside a bone and not a squash.'
examples:
- The marrow of her speech was that the town needed clean water.
- He cut the long report down to its marrow in three short lines.
