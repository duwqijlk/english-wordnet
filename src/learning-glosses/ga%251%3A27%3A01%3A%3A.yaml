simpleMeaning: The first nerve poison known, made by German chemists in 1936; a deadly liquid that burns
  and melts in liquids that melt other things, used to harm nerves in war
scope: A nerve poison, also called tabun; not a medicine and not a household cleaner.
examples:
- GA is a nerve poison first made in 1936.
- GA was used to harm nerves in war.
