simpleMeaning: For a newly married couple, a noisy piece of music is played in fun by banging pans and
  kettles.
scope: Belling, callathump, callithump, charivari, and chivaree are other names for this noisy music played
  in fun for a newly married couple.
examples:
- The shivaree for the newly married couple was made by banging pans and kettles.
- The shivaree went on with pans and kettles banging.
