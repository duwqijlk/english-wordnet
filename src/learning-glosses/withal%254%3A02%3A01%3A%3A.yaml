senseId: 'withal%4:02:01::'
synsetId: 00027761-r
simpleMeaning: For all that, usually just ahead of a grant.
scope: This sense is also called still, however, yet, nevertheless, nonetheless, and notwithstanding,
  for being for all that, usually just ahead of a grant, where still is despite what has been said; all
  the same, however is despite what has been said; but, and yet is in spite of what has just been said,
  often used just before adding a fact that goes against it.
examples:
- Withal, they stayed, for all that.
- Withal, they agreed, usually just ahead of a grant.
