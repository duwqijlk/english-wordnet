simpleMeaning: The act of rubbing oil on a person as part of a church rite or a healing rite.
scope: The act of rubbing oil on a person as part of a church rite or a healing rite, not a thick salve,
  usually holding a medicine, spread on the skin as a cure or to soothe a sore place, not overdone praise
  that is only skin-deep and given with false charm, and not smug earnestness that serves oneself.
examples:
- The unction took place before the laying on of hands.
- They watched the unction at the healing service.
