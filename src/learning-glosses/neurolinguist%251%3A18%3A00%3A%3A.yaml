simpleMeaning: A person trained in brain science and the study of language, who looks at how the brain
  works when people speak and take in words.
scope: A person who studies how the brain works when people speak and take in words, not a linguist who
  studies language alone and not a brain doctor who treats sick people.
examples:
- The neurolinguist studies how the brain handles words.
- A neurolinguist watched speakers while they named pictures.
