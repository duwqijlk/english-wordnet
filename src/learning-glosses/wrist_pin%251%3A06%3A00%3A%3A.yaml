simpleMeaning: a rod that joins a piston, the part that slides up and down in a motor, to the rod that
  joins it to the motor
scope: This is a rod joining a piston to its connecting rod, also called gudgeon pin; not a pin for cloth
  and not a bolt.
examples:
- The mechanic fitted a new wrist pin to join the piston to the rod.
- A worn wrist pin made a knocking sound in the engine.
