senseId: 'fragmentation%1:22:00::'
synsetId: 13505506-n
simpleMeaning: In computer science, this is when one file is not kept in one place on a magnetic disk,
  but its parts are in many different places
scope: This is the computer sense, about a file split across a disk; it is not the scattering of pieces
  when a bomb goes off, and not the breaking up of social rules.
examples:
- Fragmentation on the old disk slowed the computer because one file was in many places.
- After years of use, fragmentation made the magnetic disk slow to read files.
