simpleMeaning: A large white mushroom that gets brown marks with age, with white gills and a hot sweet
  smell; picked to sell for East Asian cooking in the Pacific Northwest.
scope: Also called white matsutake; a big white mushroom with white gills and a hot sweet smell, not a
  small brown field mushroom and not a poisonous toadstool.
examples:
- Armillaria ponderosa grows in the pine woods of the Northwest.
- We picked Armillaria ponderosa for the evening meal.
