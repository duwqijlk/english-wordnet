simpleMeaning: A child saves coins in this holder, often made in the shape of a pig
scope: Also called a penny bank, this is a child's holder for saving coins, often made to look like a
  pig, not a real bank and not a toy pig.
examples:
- She dropped her coins into her piggy bank every week.
- His piggy bank was shaped like a fat pink pig.
