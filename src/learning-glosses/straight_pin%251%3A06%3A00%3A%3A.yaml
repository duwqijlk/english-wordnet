simpleMeaning: A short piece of stiff wire, sharp at one end, that goes through cloth or paper and keeps
  the pieces in place.
scope: Among pins, this is the short, stiff wire kind with a sharp end, made to go through cloth or paper
  and hold the pieces in place.
examples:
- The hem was held with a straight pin before it was sewn.
- A straight pin held the two sheets of paper together.
