simpleMeaning: a sick feeling that comes from moving while travelling on water
scope: This is feeling sick because of moving on water, not feeling sick in a car or on a plane, and not
  a sickness from bad food.
examples:
- Her seasickness got worse when the boat moved up and down.
- He could not eat because of his seasickness on the ship.
