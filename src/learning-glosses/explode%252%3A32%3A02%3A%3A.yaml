simpleMeaning: to make a sound burst out with air pushed out, for stop consonants (sounds like /p/, /t/,
  and /k/ made by stopping the air and then letting it go)
scope: In speech sounds, to let air burst out when you say a sound like /p/; not a bomb bursting and not
  a number growing fast.
examples:
- In this word, the /t/ is exploded, with a short burst of air.
- The teacher showed how to explode the /p/ at the start of 'pin'.
