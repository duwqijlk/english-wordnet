simpleMeaning: the act of saying that something must not be done or of holding it back, or one case of
  doing this
scope: 'Also called inhibition and forbiddance: the general act of saying something must not be done,
  not the years in the United States when drink was banned by law, and not one law or order that bans
  something.'
examples:
- The prohibition of smoking in the building is set out in its rules.
- A prohibition on parking kept the road clear for other cars.
