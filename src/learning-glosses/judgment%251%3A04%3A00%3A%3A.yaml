simpleMeaning: In law, what a court decides about the questions put before it, when the court has the
  power to decide them.
scope: In law, a court's ruling on the questions put before it, not a person's power to size things up
  and not the paper that gives the reasons for a ruling.
examples:
- The judgment of the court went against the company.
- They waited for the judgment before they sold the house.
