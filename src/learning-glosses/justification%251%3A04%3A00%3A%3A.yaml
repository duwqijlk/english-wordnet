simpleMeaning: the act of giving reasons to defend something, explain it, or make excuses for it
scope: Giving reasons to defend or explain something, not the thing itself being right and not a proof.
examples:
- His justification for leaving early did not convince anyone.
- She offered a long justification of her choice.
