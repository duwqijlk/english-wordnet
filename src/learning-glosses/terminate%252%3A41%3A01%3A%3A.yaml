simpleMeaning: To bring a person's paid work to an end, or to take them out of a post they hold
scope: To end a person's job or take them out of a post; can, fire, sack, dismiss and displace are other
  names for this sense, not to bring a thing to an end in time or place.
examples:
- The company terminated 25% of its workers.
- The manager terminated the clerk from his post after the row.
