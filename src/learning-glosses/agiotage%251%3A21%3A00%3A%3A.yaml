simpleMeaning: a charge made when one kind of money is changed into another kind
scope: A charge for changing money, also called premium, agio, or exchange premium, not a tax and not
  the price of the money itself.
examples:
- The agiotage on the money change was higher than she had hoped.
- They charged agiotage for changing the traveller's notes into local money.
