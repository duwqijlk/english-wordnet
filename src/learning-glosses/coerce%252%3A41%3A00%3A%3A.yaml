senseId: 'coerce%2:41:00::'
synsetId: 02510211-v
simpleMeaning: to make someone do something by force, by a sense of duty, by clever talk, or because they
  have no other choice
scope: 'Also called force, pressure, squeeze and hale: to make someone do what they do not want to do,
  not to ask them in a free and kind way.'
examples:
- The manager coerced him into signing the paper by saying he would lose his job.
- They tried to coerce her to give them the money.
