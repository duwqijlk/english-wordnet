simpleMeaning: to walk in a proud way with your head high, often to try to make others think well of you
scope: 'Also called cock, ruffle, prance, swagger, and strut: this is walking in a proud way to show off,
  not the dance step where partners move round each other side by side.'
examples:
- She sashayed across the room with her head high, hoping everyone would notice her.
- He sashayed past us, smiling proudly at everyone.
