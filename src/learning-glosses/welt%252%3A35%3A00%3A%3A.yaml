simpleMeaning: to give someone a hard beating with a whip or a rod, hitting them over and over
scope: 'Also called slash, whip, lash, and strap: to beat someone hard with a whip or rod — not the raised
  mark such a beating leaves on the skin.'
examples:
- The master welted the boy's back with his cane.
- She welted the horse with a whip to make it move.
