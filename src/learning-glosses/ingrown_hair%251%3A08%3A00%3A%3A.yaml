senseId: 'ingrown_hair%1:08:00::'
synsetId: 05262091-n
simpleMeaning: A single strand that fails to come out of the small hole it grows from and stays stuck
  in the skin, often making the skin sore and swollen.
scope: A strand that fails to come out and stays stuck in the skin, not a strand growing out as it should
  and not a thorn under the skin.
examples:
- He had an ingrown hair on his neck.
- An ingrown hair made the skin sore and red.
