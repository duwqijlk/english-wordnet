simpleMeaning: One of the arms of a shape that splits or spreads out.
scope: A part of a forked shape, not a plant's own stem and not a stream's smaller channel.
examples:
- One branch of the brass candelabra was bent out of shape.
- The deer's antler had a short branch near its base.
