simpleMeaning: An elephant of Asia with smaller ears, its tusks found mostly in the male.
scope: Also called Indian elephant; an elephant of Asia with smaller ears, its tusks found mostly in the
  male, not the African elephant with big ears and big tusks.
examples:
- The Elephas maximus has smaller ears than its African kin.
- An Elephas maximus walked through the forest.
