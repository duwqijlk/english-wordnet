simpleMeaning: the study of language by looking at the shapes and rules that make up texts and talk
scope: 'Also called structuralism: the study of how language is put together in texts and talk, not the
  study of what words mean.'
examples:
- In structural linguistics, she looked at how the sentences in the story were put together.
- His course in structural linguistics studied the rules behind texts and talk.
