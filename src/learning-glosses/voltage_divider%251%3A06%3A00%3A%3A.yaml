simpleMeaning: parts that hold back the flow of power, joined in a line across a source of electric push,
  used to get a wanted share of the push
scope: Parts that hold back the flow of power to give a wanted share, also called potential divider; not
  a switch and not a battery.
examples:
- The voltage divider in the set gives a smaller share of the push.
- He wired a voltage divider across the power source.
