simpleMeaning: a thick, stiff cardboard that is good for making posters
scope: A thick, stiff board made for posters, not thin paper for writing and not a soft sheet.
examples:
- She cut the paperboard to make a large poster for the hall.
- We printed the sign on thick paperboard so it would stand up on its own.
