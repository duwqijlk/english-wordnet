simpleMeaning: a plant of southern Europe that lives for years, with narrow whole leaves, single yellow
  flower heads, and long black roots you can eat, shaped like carrots
scope: Also called black salsify and viper's grass; a long-lived plant of southern Europe, not a tree
  or a shrub.
examples:
- The scorzonera in the garden has yellow flower heads.
- We dug up scorzonera roots and cooked them like carrots.
