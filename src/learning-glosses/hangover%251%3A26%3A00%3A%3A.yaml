simpleMeaning: the bad feeling left after taking drugs, above all after drinking alcohol
scope: The bad after-effects of drugs, above all of alcohol; not the bad feeling after too little sleep,
  and not an illness that comes on its own.
examples:
- He woke with a terrible hangover after the party.
- A hangover kept her in bed all morning.
