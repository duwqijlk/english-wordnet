simpleMeaning: a way of building new DNA outside a living body by cutting DNA into pieces and joining
  pieces from more than one living thing
scope: 'Also called gene-splicing: a way of building new DNA outside a living body, not the study of how
  genes work on their own.'
examples:
- Genetic engineering lets farmers grow corn that can fight off pests.
- Scientists used genetic engineering to make a plant that grows well in dry soil.
