simpleMeaning: That people lived in old times, and things that belong to them or are like them are what
  this word marks.
scope: Also called Aryan and Indo-Aryan, this word marks things of that former people, not the language
  family of the other sense.
examples:
- The Indo-European migrations spread across the continent.
- Indo-European customs shaped the life of that old people.
