simpleMeaning: A way of seeming not at ease, shown in how a person acts
scope: Also called uneasiness and disquiet; a way of seeming ill at ease, not a sick feeling in the body.
examples:
- Her unease showed in the way she kept glancing at the door.
- He tried to hide his unease, but his hands shook as he spoke.
