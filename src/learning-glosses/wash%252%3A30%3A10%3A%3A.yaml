simpleMeaning: to take the small loose bits out of something so that it is left clean
scope: Taking small loose particles out so material is left clean, not separating precious minerals from
  gravel and not general cleaning of clothes or dishes.
examples:
- The miners washed the ore to remove the loose grit.
- Workers washed the crushed rock to carry off the fine dust.
