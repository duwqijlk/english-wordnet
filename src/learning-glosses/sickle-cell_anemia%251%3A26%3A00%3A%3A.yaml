simpleMeaning: Present from birth, this sickness, mostly found in Black people, is marked by bits of blood
  shaped like a thin curved moon
scope: Crescent-cell anaemia, crescent-cell anemia, drepanocytic anaemia, drepanocytic anemia, sickle-cell
  anaemia, and sickle-cell disease are other names for this sickness present from birth.
examples:
- Doctors found sickle-cell anemia in the newborn child.
- The blood in sickle-cell anemia takes the shape of a thin curved moon.
