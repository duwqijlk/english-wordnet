simpleMeaning: A bright grey, strong metal much like titanium; it is used in nuclear reactors to soak
  up neutrons; it is found in baddeleyite but comes mostly from zircon.
scope: Not titanium or hafnium, other grey metals; also called zirconium and atomic number 40.
examples:
- Zr is used in nuclear reactors.
- The engineer chose Zr for the reactor parts.
