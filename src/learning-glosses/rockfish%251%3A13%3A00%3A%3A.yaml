simpleMeaning: The lean flesh of different kinds of valuable fish sold in markets, caught among rocks.
scope: The lean flesh of different kinds of valuable fish sold in markets, caught among rocks, not a sea
  fish caught for food and sport, with dark stripes along its sides, that swims upriver to lay its eggs,
  sometimes put in the group called Morone, and not a sea fish caught for food, found among rocks along
  the northern coasts of Europe and America.
examples:
- Rockfish was on the menu, served with lemon butter.
- The cook bought rockfish at the market for Friday's dinner.
