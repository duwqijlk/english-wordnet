senseId: 'quirk_bead%1:06:00::'
synsetId: 04041957-n
simpleMeaning: a raised round strip that makes a surface look nice, cut off from the surface by a thin
  line
scope: Also called bead and quirk, this is a raised round strip set off from its surface by a thin line,
  not a flat strip and not a plain edge with no line.
examples:
- The carpenter added a quirk bead along the edge of the door.
- You can see the quirk bead running down the side of the panel.
