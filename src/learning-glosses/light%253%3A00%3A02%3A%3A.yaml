simpleMeaning: Cheerful in your mind and free from sadness or worry.
scope: This is not silly or shallow entertainment, nor something that weighs very little; it describes
  a happy, untroubled state of mind.
examples:
- With the exams behind her, she felt light and carefree for the first time in weeks.
- He woke with a light heart on the morning of his daughter's wedding.
