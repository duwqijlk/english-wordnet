simpleMeaning: A woody pore fungus of the families Polyporaceae or Boletaceae, with spores carried inside
  tubes or pores; the fruiting body is usually woody at maturity and long-lasting.
scope: This is the tough, woody fungus that bears spores in tubes or pores; pore fungus is another name
  for the same group, not a different mushroom.
examples:
- The polypore was still attached to the stump after two winters.
- She turned the polypore over to look at the pores underneath.
