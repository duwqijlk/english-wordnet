simpleMeaning: to make a person cross or uneasy, especially by small things that keep getting in the way
scope: To make a person cross or uneasy, especially by small things, also called bother, annoy, and irritate,
  not the act of finding fault again and again and not scolding in anger.
examples:
- The loud music from next door ragged him while he worked.
- The flies ragged him all afternoon as he tried to read.
