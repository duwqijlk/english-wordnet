simpleMeaning: to come down fast, as if to catch an animal to eat
scope: To drop down fast to catch something, not to bend your back forward and not to act in a low or
  bad way.
examples:
- The hawk stooped toward the small bird below.
- From high in the sky, the eagle stooped fast toward the mice in the field.
