simpleMeaning: made from cloth made at home, either by making the thread there or by weaving the cloth
  there
scope: This word describes a thing made from cloth made at home; homespun as a noun is the cloth itself,
  and this sense is not a thing made from cloth made in a factory.
examples:
- She wore a homespun dress made by her mother at home.
- The homespun blankets were rough but warm.
