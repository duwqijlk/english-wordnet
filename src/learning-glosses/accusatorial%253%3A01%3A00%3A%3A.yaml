simpleMeaning: Of a trial in which a person is openly charged with a crime and tried for it, and the judge
  does not also bring the charge.
scope: This word marks a kind of trial where the judge is separate from the one bringing the charge, not
  a trial where the judge also brings the charge.
examples:
- In an accusatorial trial, the judge does not also bring the charge.
- The lawyer praised the accusatorial form of trial, in which the charge is brought in the open.
