simpleMeaning: Turning over backwards to the middle of a full turn, the diver throws the feet forward
  and up and goes into the water facing the board.
scope: This dive ends facing the board after turning over backwards only part way, not all the way over.
examples:
- She tried a half gainer off the high board.
- His half gainer ended with him facing the board.
