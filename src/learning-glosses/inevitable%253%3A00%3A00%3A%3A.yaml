simpleMeaning: that cannot be stopped or kept from happening
scope: This sense means something cannot be stopped from happening. It is not the sense that means a thing
  always happens or always shows up.
examples:
- With no brakes, a crash was inevitable.
- The result was inevitable after the last vote made it impossible to stop.
