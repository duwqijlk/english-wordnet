simpleMeaning: A young male who will not leave his mother's side and shows few of the usual interests
  of young males
scope: Also called mama's boy and mother's boy, this is a young male who will not leave his mother's side
  and shows few of the usual interests of young males, not a loving son and not a shy child.
examples:
- They called him a mamma's boy because he always stayed close to his mother.
- The mamma's boy asked his mother before he did anything on his own.
