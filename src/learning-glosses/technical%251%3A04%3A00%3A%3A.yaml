simpleMeaning: in basketball, a penalty for unsporting behavior that a player, coach, or whole team may
  receive, mostly without bodily contact during the game
scope: This is the basketball penalty, not the pickup truck with a mounted gun, nor the adjective senses
  about skill, machinery, or strict legal interpretation.
examples:
- The referee called a technical after the coach argued with him.
- He received a technical for shouting at the referee.
