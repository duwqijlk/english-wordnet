senseId: 'prunus_serrulata%1:20:00::'
synsetId: 12670078-n
simpleMeaning: A tree grown for show, with fruit people cannot eat, grown widely in many kinds for its
  white flowers.
scope: Also called oriental cherry, Japanese cherry and Japanese flowering cherry; a tree grown for its
  white flowers, not a tree grown for sweet fruit people eat and not a bush grown for red, pink or white
  flowers.
examples:
- Prunus serrulata lines the park path with white blossoms each spring.
- The Prunus serrulata in our street is grown for show, not for fruit.
