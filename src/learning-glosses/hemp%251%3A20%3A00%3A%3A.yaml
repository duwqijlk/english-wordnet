simpleMeaning: Any Cannabis plant, rough and bushy and living one year, with leaves like a hand and groups
  of small green flowers; it gives strong fibres and mind-changing drugs
scope: 'Also called cannabis: this is the living plant, not the rope made from it that was used for hanging
  people.'
examples:
- Hemp grows fast and has leaves shaped like an open hand.
- The farmer grew hemp for its strong fibres.
