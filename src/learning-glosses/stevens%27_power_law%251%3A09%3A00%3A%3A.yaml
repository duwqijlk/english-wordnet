simpleMeaning: In psychophysics, the idea that the strength of what a person feels grows in line with
  the strength of what acts on the senses, raised to a set number.
scope: 'Also called power law and Stevens'' law: an idea in psychophysics that felt strength grows in
  line with the strength of what acts on the senses, raised to a set number.'
examples:
- Stevens' power law says a small rise in the stimulus can make a feeling grow fast.
- In class we used Stevens' power law to work out how loud a sound would seem.
