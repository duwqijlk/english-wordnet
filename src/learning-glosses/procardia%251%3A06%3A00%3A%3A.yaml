simpleMeaning: A drug that blocks calcium in the body, which seems to raise the chance of more heart attacks.
scope: This is a drug that blocks calcium, also called nifedipine, not a drug that lowers the chance of
  heart attacks.
examples:
- Procardia is a calcium blocker.
- The doctor warned that Procardia may raise the risk of heart attacks.
