simpleMeaning: any one of the many fleshy fungi in Basidiomycota (a main group of fungi), with a cap on
  a stem that grows from a thread-like part under the ground
scope: This sense is for a single fungus of that main group, with a cap on a stem. It is not the wider
  group sense, not just the kind people eat, and not the cloud after a blast.
examples:
- The mushroom had a pale cap on a short stem.
- The mushroom's stem grew up from a thread-like part under the ground, with a wide cap on top.
