simpleMeaning: The sour digestive fluid released by glands in the stomach lining, made up mainly of acid,
  mucus and enzymes that break down food.
scope: The sour digestive fluid from stomach glands; another name for it is gastric juice, not bile, which
  comes from the liver.
examples:
- Gastric acid can irritate the stomach lining if too much is produced.
- The doctor prescribed a drug that reduces gastric acid.
