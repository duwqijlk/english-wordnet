simpleMeaning: a written story about the adventures of a hero or family; in the 1100s to 1300s, one about
  people who settled Iceland and those after them, now any such story
scope: A written story about a hero or family, first used for stories of people who settled Iceland; it
  is not a short report and not a song or poem.
examples:
- The old saga tells how the family came to Iceland and lived there.
- He wrote a saga about a hero and his family over many years.
