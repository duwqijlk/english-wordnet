simpleMeaning: A sea animal with small outer ears, from the south seas, whose thick soft hair under its
  coat is the source of the skins
scope: This is a sea animal with small outer ears from the south seas; not a sea lion and not a true seal
  without outer ears.
examples:
- The male fur seal is much larger than the female.
- Fur seals rest on the rocks of the south seas.
