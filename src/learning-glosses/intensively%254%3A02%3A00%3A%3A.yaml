simpleMeaning: in a way that puts a lot of work and full attention into one thing
scope: This is about putting a lot of work and full attention into one thing, not about doing a little
  work in a light, easy way.
examples:
- He studied the snake intensively for many weeks.
- They farm the land intensively, putting a lot of work into a small area to grow as much as they can.
