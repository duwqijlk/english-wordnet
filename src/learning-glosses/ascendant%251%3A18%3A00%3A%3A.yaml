senseId: 'ascendant%1:18:00::'
synsetId: 09811996-n
simpleMeaning: A forebear in your line, usually one past your grandparents.
scope: This sense is also called a root, an ancestor, and an antecedent, for a forebear in your line,
  usually one past your grandparents, where a root is a family member you come from, usually further back
  than a grandparent, and an ancestor is a family member from long ago, usually further back than a grandparent,
  from whom you come, unlike the sense for what tends or points upward.
examples:
- Her ascendant lived three generations back.
- Ascendants further back than grandparents fill the family tree.
