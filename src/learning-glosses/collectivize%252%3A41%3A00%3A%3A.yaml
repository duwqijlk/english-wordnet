simpleMeaning: to bring farms and industrial businesses under control shared by a group
scope: To bring farms and industrial businesses under control shared by a group. Not to gather or collect
  things together, and not one owner running a farm or business alone.
examples:
- The new government collectivized the farms in the north.
- In the 1930s, the state collectivized most factories and farms.
