simpleMeaning: an insect with a long body and big eyes that eats other animals, lives in warm places,
  and rests with its front legs held up as if praying
scope: This insect, also called mantid, is known by its long body and raised front legs, and is not a
  grasshopper or other jumping insect.
examples:
- A mantis sat still with its front legs raised as if praying.
- We saw a green mantis hunting small insects in the warm garden.
