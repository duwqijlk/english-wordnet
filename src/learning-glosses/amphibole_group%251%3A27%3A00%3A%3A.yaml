simpleMeaning: A mineral family whose members have similar crystal structures, each built around a silicate
  chain and containing various amounts of mainly sodium, calcium, magnesium, iron and aluminum.
scope: This is the whole family of related minerals, not a single one such as hornblende, which is only
  one member of the family. It is not the name of a rock or of one particular mineral. The label is technical
  and belongs to mineralogy.
examples:
- Hornblende is the best-known mineral in the amphibole group.
- Students learned to recognize the amphibole group by its crystal shape.
