simpleMeaning: In psychiatry, a way the mind guards itself by moving a feeling or reaction from its first
  thing to one that is easier to face
scope: In psychiatry, a way the mind guards itself by moving a feeling or reaction from its first thing
  to one that is easier to face; not a chemical change in a compound, and not a thing simply being moved.
examples:
- His displacement of anger onto the dog worried his wife.
- Displacement let her blame the waiter instead of her boss.
