senseId: 'vaporise%2:30:01::'
synsetId: 00367511-v
simpleMeaning: to lose liquid as it turns into gas, or to make a liquid do this, so what stays behind
  is stronger
scope: Also called evaporate and vaporize. This is about a liquid losing part of itself as gas so the
  rest is stronger, not about a thing simply turning into gas with nothing left behind.
examples:
- The cook vaporised some of the water from the milk to make it thicker.
- The hot sun vaporised water from the mixture, leaving it stronger.
