simpleMeaning: a leafy plant that grows in North Africa and on the Azores and Canary Islands
scope: 'Also called a spider fern: a leafy plant of North Africa and the Azores and Canary Islands, not
  a fern of the lowland forests of tropical America and not a fern of tropical Asia.'
examples:
- A ribbon fern grew on the dry hills of North Africa.
- We saw a ribbon fern on the dry hills of the Canary Islands.
