simpleMeaning: In maths, to take away a letter that stands for an unknown number from two or more equations
  (statements that say two things are equal)
scope: This is the maths sense about taking a letter away from equations, not taking a person or idea
  out of a contest or list and not taking something out of the body.
examples:
- You can eliminate x from the two equations by adding them together.
- She eliminated the unknown from both equations to find its value.
