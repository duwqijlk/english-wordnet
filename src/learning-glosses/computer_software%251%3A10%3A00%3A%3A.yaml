simpleMeaning: In computing, the written steps, rules and papers that tell a machine system how to work,
  kept in memory that can be read and changed
scope: The written steps, rules and papers that tell a machine system how to work, kept in memory that
  can be read and changed; package and software are other names for this sense, not the machine itself
  and not one single set of steps.
examples:
- The new computer software helps the shop keep track of its stock.
- She bought computer software for editing photos.
