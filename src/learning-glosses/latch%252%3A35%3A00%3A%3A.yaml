simpleMeaning: to make a door or gate stay shut by using the bar on it that moves into place to hold it
  shut
scope: To shut a door or gate with its sliding bar, not the bar itself, which is the noun use of the word.
examples:
- Please latch the gate before you leave.
- She latched the door and went to bed.
