simpleMeaning: A liquid made from dried buds and used to give medicines a taste.
scope: A liquid made from dried buds, used to give medicines a taste, also called clove oil; not the spice
  itself and not a liquid used to cook with.
examples:
- The chemist added oil of cloves to the medicine to give it a taste.
- A drop of oil of cloves gave the medicine a taste.
