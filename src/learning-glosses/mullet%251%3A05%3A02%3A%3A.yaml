simpleMeaning: food fish that live in fresh water or near the sea, with a body wide in the middle and
  narrow at both ends, found all over the world
scope: Also called gray mullet and grey mullet. This is the living fish, not its flesh eaten as food and
  not the warm-water fish with two small parts under its chin.
examples:
- We caught a mullet in the river near the sea.
- A mullet jumped out of the water beside our boat.
