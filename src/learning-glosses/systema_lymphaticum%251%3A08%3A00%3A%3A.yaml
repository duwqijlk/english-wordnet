simpleMeaning: Lymph travels all round the body through gaps and tubes joined together between its soft
  parts and organs.
scope: Lymphatic system is another name for this linked network of gaps and tubes, which carries lymph
  to every part of the body.
examples:
- Lymph moves through the systema lymphaticum to every part of the body.
- Lymph from the leg drains away through the systema lymphaticum.
