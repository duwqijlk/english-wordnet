simpleMeaning: a light pink drink for the table, made from red grapes with the skins taken off soon after
  the juice starts to turn to alcohol
scope: 'Also called pink wine or rose: a light pink drink for the table made from red grapes, not a red
  drink from grapes and not a strong drink with no fruit in it.'
examples:
- We served blush wine with the fish at lunch.
- She poured a glass of blush wine for her guest.
