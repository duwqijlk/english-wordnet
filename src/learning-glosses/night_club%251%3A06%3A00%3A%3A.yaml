simpleMeaning: Singers or dancers perform here, and people can dance and eat and drink, in a place that
  stays open long after dark
scope: This place, open long after dark with singers or dancers, dancing, food and drink, is also called
  a cabaret, a club, a nightclub or a nightspot, not a bar that closes early and not a dance hall with
  no food.
examples:
- We danced until two in the morning at the night club.
- The night club stayed open long after the show ended.
