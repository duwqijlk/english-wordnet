simpleMeaning: In computer science, the part of a computer that does most of the work of handling data;
  it is a small chip (a microprocessor)
scope: In computers, this is the main chip, also called mainframe; it is not a person who works on things
  and not a business that gets farm goods ready to sell.
examples:
- A faster processor makes the computer work more quickly.
- The laptop's processor gets hot when you play games.
