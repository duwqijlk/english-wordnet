simpleMeaning: In chemistry, how much of one element there is in the earth's crust, given as a share of
  the whole crust, in percent or in parts per million
scope: In chemistry, how much of one element there is in the earth's crust, not the share of atoms of
  one form of an element among all its atoms.
examples:
- The abundance of iron in the earth's crust is given as a percentage.
- Scientists measure the abundance of each element in parts per million.
