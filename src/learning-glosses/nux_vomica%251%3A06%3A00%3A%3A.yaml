simpleMeaning: a medicine made from the seeds of an Asian tree, holding two bitter poisons, once used
  to wake the body up
scope: A medicine made from the seeds of an Asian tree, holding two bitter poisons; not a food and not
  a modern drug.
examples:
- Nux vomica was once given as a stimulant.
- The old medicine nux vomica came from the seeds of an Asian tree.
