simpleMeaning: having only some rights and special rights, or having a lower place in a group
scope: This describes having lower, part-only rights in a group; it is not the name for such a person,
  not a college degree, and not the act of joining together.
examples:
- She is an associate member of the club, so she can use some rooms but not vote.
- He works as an associate professor at the college.
