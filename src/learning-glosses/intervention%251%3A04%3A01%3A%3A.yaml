senseId: 'intervention%1:04:01::'
synsetId: 01025184-n
simpleMeaning: In law, a step that lets a person join a court case already going on, so they can guard
  a right or interest the case may touch
scope: In law, a step that lets a person join a case already going on, not stepping in to settle a quarrel
  and not medical help.
examples:
- The judge allowed her intervention in the case.
- His intervention protected his claim to the land.
