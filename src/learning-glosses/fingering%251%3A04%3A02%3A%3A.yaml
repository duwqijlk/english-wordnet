simpleMeaning: The way the fingers are placed to play each note, or each run of notes, on a musical instrument
scope: The way the fingers are placed to play notes on a musical instrument, not the simple act of touching
  something with the fingers.
examples:
- Her fingering on the piano was smooth and sure.
- The teacher showed him the right fingering for the scale.
