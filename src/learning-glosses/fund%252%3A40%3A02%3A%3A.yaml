simpleMeaning: to replace short-term debt that must be paid back soon with long-term debt that pays a
  fixed rate of interest and is held as bonds.
scope: This is not about providing money for a project; it is about changing short-term debt into long-term
  bonds.
examples:
- The company funded its short-term debt by issuing long-term bonds.
- The city funded its floating debt with bonds carrying a fixed rate of interest.
