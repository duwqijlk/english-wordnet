simpleMeaning: the power of a man to have sex and to make a woman have a child
scope: This sense is about a man's power to have sex and to have children, not about looking or acting
  manly in a general way.
examples:
- The treatment was said to restore his virility.
- He worried that the illness had taken away his virility.
