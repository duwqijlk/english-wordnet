simpleMeaning: a difficulty that is not a thing you can touch, but blocks progress and must be gone around
  or got over
scope: This is a difficulty that is not a thing you can touch and blocks progress, not a solid thing that
  blocks a road or path.
examples:
- Lack of money was the main obstacle to her studies.
- His fear was an obstacle to trying new work.
