simpleMeaning: to make cloth or other work by hand, pulling thread into loops that lock together with
  a needle that has a hook at the end
scope: The act of making cloth in this way, another name for which is hook; not the finished cloth or
  work itself.
examples:
- She crochets a small blanket for the baby.
- He learned to crochet with thick thread and a big needle.
