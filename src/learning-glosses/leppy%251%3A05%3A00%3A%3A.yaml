simpleMeaning: A herd of cattle out on the open land has a calf with no mother in it
scope: 'Another name for a dogie and a dogy: a calf with no mother in a herd of cattle out on the open
  land, not a calf that stays with its mother and not a young cow.'
examples:
- The ranch hands found the leppy alone by the water trough.
- They took the leppy back to the barn to feed it by hand.
