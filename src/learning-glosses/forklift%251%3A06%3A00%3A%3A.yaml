simpleMeaning: a small vehicle for work in a factory, with a flat fork-like part in front, moved by power,
  that goes under heavy things to lift and move them
scope: A machine for lifting and moving heavy things in a factory or store building; not a crane, which
  lifts things from above.
examples:
- The forklift lifted the heavy box onto the truck.
- She drove the forklift across the floor to the tall shelves.
