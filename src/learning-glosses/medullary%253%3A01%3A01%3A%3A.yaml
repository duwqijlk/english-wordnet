simpleMeaning: Made of, holding, or like bone marrow
scope: Describes a thing made of, holding, or like bone marrow; not a thing made of blood and not a thing
  made of fat.
examples:
- The medullary part of the bone holds the marrow.
- Medullary tissue fills the centre of the bone.
