simpleMeaning: a heavy cloth made by hand and hung on a wall, often with pictures worked into it
scope: This is the cloth you hang on a wall, often with pictures. It is not the same cloth used for curtains
  or covers for chairs, and not a complex mix of things that looks like such a cloth.
examples:
- A large tapestry hung on the castle wall above the fireplace.
- She bought a tapestry with a garden scene to cover the bare wall.
