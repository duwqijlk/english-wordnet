simpleMeaning: a toiletry of one of many kinds of thick liquid stuff that soothes the skin and keeps it
  moist when you put it on
scope: A thick liquid toiletry that soothes and moistens the skin, also called cream, and not the thick
  soft preparation with a medicine in it.
examples:
- She rubbed the ointment into her dry hands.
- This ointment keeps the skin soft.
