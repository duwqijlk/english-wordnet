simpleMeaning: A low level of mental ability, worse than that of a moron but not as low as that of an
  idiot.
scope: For a low level of mental ability, worse than a moron's but not as low as an idiot's.
examples:
- The old report used the word imbecility for a low level of mental ability.
- The doctor's notes spoke of imbecility, a level below that of a moron.
