simpleMeaning: a planned meeting for discussion, often with a fixed list of topics, where people share
  information.
scope: This is a formal planned meeting, not a short private talk between two people.
examples:
- She is attending a conference on climate change in Berlin.
- The company holds a conference for all its managers every year.
