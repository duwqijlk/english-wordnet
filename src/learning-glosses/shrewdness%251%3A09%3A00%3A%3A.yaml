simpleMeaning: the quality of understanding a situation well and making good choices, as in business
scope: 'Also called perspicacity, and also called astuteness: the quality of understanding well and making
  good choices, not book learning alone and not luck.'
examples:
- Her shrewdness in business helped her buy the shop at a low price.
- People praised his shrewdness when he saw the risk before others did.
