simpleMeaning: So boring that nothing holds your interest and there is no liveliness.
scope: Describes something boring that stirs no interest, not a sarcastic remark delivered with a straight
  face, and not a cold, unfriendly manner.
examples:
- The lecture was so dry that half the audience fell asleep.
- I found the book dry and gave up after two chapters.
