simpleMeaning: From the south-west of California comes this pine of middling size, with five needles in
  each bunch and long tube-shaped cones.
scope: Grey-leaf pine and sabine pine are other names for this five-needled pine of south-western California.
examples:
- A soledad pine grew in California.
- We saw a soledad pine with five needles in each bunch.
