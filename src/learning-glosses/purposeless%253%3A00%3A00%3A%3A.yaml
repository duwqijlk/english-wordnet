synsetId: 01916869-a
simpleMeaning: with no point to it and no aim
scope: Means having no aim or goal; not the other sense of this word, which means a thing is of no use
  and has no reason to be.
examples:
- He walked in a purposeless way around the empty streets.
- It was a purposeless trip, with no place they wanted to reach.
