simpleMeaning: A circle of colour at the outer edge of the cornea, the clear front of the eye, and a sign
  of Wilson's disease.
scope: A coloured circle at the outer edge of the cornea, an eye sign pointing to Wilson's disease.
examples:
- The doctor saw a Kayser-Fleischer ring at the edge of her cornea.
- A Kayser-Fleischer ring can be a sign of Wilson's disease.
