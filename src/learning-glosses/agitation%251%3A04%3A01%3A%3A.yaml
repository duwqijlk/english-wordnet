simpleMeaning: the act of shaking or stirring a thing so that it moves about, usually with force
scope: This is the act of stirring or shaking a thing, not the feeling of being upset and not a time of
  wild change.
examples:
- Agitation of the mixture kept the sand from settling.
- The washing machine's agitation cleaned the clothes.
