simpleMeaning: A small cake takes its round hollow shape from a round sheet of paper, foil, or silicone,
  a soft bendy stuff, with wavy pressed edges.
scope: Also called a muffin case, this holder gives a small cake its round shape and is not the cake itself.
examples:
- The muffin cup gave the small cake its round hollow shape.
- These muffin cups are made of paper, foil, or silicone.
