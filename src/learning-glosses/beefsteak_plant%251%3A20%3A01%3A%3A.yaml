simpleMeaning: A decorative South American plant with green-to-purple leaves and green-to-purple or red
  stems, plus spikes of small fuzzy flowers among dry, papery bracts.
scope: Another name for the South American plant also called beef plant, not the other beefsteak plant
  grown for its red or purple leaves.
examples:
- This beefsteak plant bears red stems and papery flower bracts.
- She chose a beefsteak plant for its coloured foliage.
