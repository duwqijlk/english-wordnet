simpleMeaning: a shoe with a strap that goes round the heel to hold it on the foot
scope: This is a shoe with a strap round the heel, not a cloth support for a hurt arm and not a weapon
  for throwing stones.
examples:
- Her new sling shoes have a strap that wraps around the heel.
- He bought a pair of slings that fasten at the heel with a small strap.
