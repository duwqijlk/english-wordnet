simpleMeaning: a set of straps that holds something to the body, especially one that holds a person hanging
  from a parachute
scope: These are straps that hold a thing or a person to the body, especially under a parachute; not the
  leather straps put on an animal so it can pull a cart, and not the act of putting straps on.
examples:
- She checked her harness carefully before jumping from the plane.
- His harness held him safely as he hung below the parachute.
