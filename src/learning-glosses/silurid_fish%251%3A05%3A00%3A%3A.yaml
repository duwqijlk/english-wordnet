simpleMeaning: Bare skin and a long bottom fin that runs almost into the eel-like tail fin mark these
  Old World river fish with whiskers round the mouth.
scope: These Old World river fish with bare skin and a long bottom fin are also called a silurid.
examples:
- The silurid fish has a long bottom fin that runs into its tail fin.
- Silurid fish are river catfish with bare skin.
