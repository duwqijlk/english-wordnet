simpleMeaning: A plant of Mexico and the south of the United States, living one year, with sticky purple
  fruit that can be eaten, like small round fruit
scope: Also called a tomatillo, a jamberry and Physalis ixocarpa; a one-year plant of Mexico and the south
  of the United States with sticky purple fruit that can be eaten, not the fruit alone.
examples:
- The Mexican husk tomato grows in Mexico and the south of the United States.
- Mexican husk tomato plants bear sticky purple fruit.
