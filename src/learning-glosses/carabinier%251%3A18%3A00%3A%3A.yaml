simpleMeaning: a soldier armed with a short rifle, in earlier times one who rode a horse
scope: A soldier armed with a short rifle, in earlier times one who rode a horse; carabineer and carbineer
  are other names for this sense, not a foot soldier with a long gun.
examples:
- The carabinier carried his short rifle on his back.
- Carabiniers patrolled the border on horseback.
