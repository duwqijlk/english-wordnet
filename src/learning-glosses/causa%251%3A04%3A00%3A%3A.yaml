simpleMeaning: A broad word for any case in a court of law in which a person asks for a legal remedy.
scope: A broad word for any court case asking for a remedy; case, suit, cause and lawsuit are other names
  for this sense.
examples:
- The family brought a causa against the landlord after the roof fell in.
- A causa can cover any claim a person brings before a court.
