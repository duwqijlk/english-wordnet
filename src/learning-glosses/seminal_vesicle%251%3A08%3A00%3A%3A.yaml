simpleMeaning: When seed is released, many parts of semen come from one of two glands beside a man's bladder
  for holding urine, opening into the tube that carries seed.
scope: This is one of two glands beside a man's bladder for holding urine, opening into the tube that
  carries seed and giving off many parts of semen, not the bladder itself.
examples:
- Each seminal vesicle opens into the tube that carries seed.
- The seminal vesicle gives off much of what makes up semen.
