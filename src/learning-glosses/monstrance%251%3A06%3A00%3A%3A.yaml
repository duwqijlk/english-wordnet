simpleMeaning: In the Roman Catholic Church, a holder, often of gold or silver, in which the blessed bread
  of the Mass is shown for worship
scope: 'Ostensorium is another name for this sense: a holder in church in which the blessed bread is shown
  for worship, not a proof by argument.'
examples:
- The priest placed the host in the monstrance.
- A golden monstrance stood on the altar.
