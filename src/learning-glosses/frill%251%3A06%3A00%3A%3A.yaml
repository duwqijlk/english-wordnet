simpleMeaning: a strip of material with many small folds, used to make something look pretty or to finish
  an edge
scope: 'Also called ruffle, flounce and furbelow: a strip of material with many small folds, used to make
  something look pretty or to finish an edge. Not the hard plate on a dinosaur''s head and not the feathers
  or hair round an animal''s neck.'
examples:
- The dress has a frill around the neck.
- She sewed a white frill to the edge of the skirt.
