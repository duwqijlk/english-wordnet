simpleMeaning: used of the way a person acts or thinks when they treat others as if they were less important
scope: Used for a way of acting that treats others as less important, not for playful teasing and not
  for a curved shape or building part.
examples:
- She spoke in an arch tone, as if we were all children.
- His arch look made clear that he thought our idea was stupid.
