simpleMeaning: A sweet-smelling Old World runner-spreading perennial, with thin leaves, small white blooms,
  used to flavour and in scent bags, grown widely for ground cover, sometimes in Asperula genus.
scope: This sense is also called fragrant bedstraw, sweet woodruff, and woodruff, for a sweet-smelling
  Old World perennial that spreads by runners, with narrow leaves and small white flowers, used for flavouring
  and in sachets, widely grown as ground cover, and sometimes placed in genus Asperula.
examples:
- Waldmeister scents the sachet.
- Waldmeister covers the ground.
