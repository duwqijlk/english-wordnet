simpleMeaning: A foam from a spray can, used to style the strands on a person's head.
scope: A foam from a spray can, used to style the strands on a person's head; mousse is another name for
  it, not an electric tool that bends the strands into waves and not a flat wire pin used to hold short
  straight strands in place.
examples:
- She put hair mousse on her hair before styling it.
- A little hair mousse held the waves in place.
