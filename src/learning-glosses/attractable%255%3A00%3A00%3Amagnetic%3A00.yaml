simpleMeaning: able to be made magnetic, or to be pulled toward a magnet
scope: Something that a magnet can pull or make magnetic, not a magnet itself and not something that pulls
  other things.
examples:
- Steel chips from the cutting tool are attractable by a magnet.
- The attractable filings moved toward the magnet.
