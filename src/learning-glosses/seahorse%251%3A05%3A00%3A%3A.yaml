simpleMeaning: a small fish whose head is shaped like a horse's head, bent sharply down, with a tail that
  curls, and that swims standing up straight
scope: 'Also called a sea horse: a small fish that swims standing up, not the large sea animal with long
  teeth that shares this name.'
examples:
- A seahorse held on to the plant with its curled tail.
- We saw a tiny seahorse swimming upright in the tank.
