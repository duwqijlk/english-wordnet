scope: An Old World plant that grows straight up, grown most of all for its big flat seeds that can be
  eaten; also called broad-bean, broad-bean plant, broad bean, field bean, English bean, and Vicia faba.
examples:
- The European bean in the garden grew straight up and set big flat seeds.
- Farmers grow the European bean both for food and as fodder.
