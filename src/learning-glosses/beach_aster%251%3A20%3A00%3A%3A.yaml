simpleMeaning: A low perennial with thick basal leaves and sticky stems, each holding one narrow-petalled
  pink or lavender flower; it grows on coastal bluffs from Oregon to southern California.
scope: A coastal wildflower with one bloom on each stem; the name seaside daisy covers the same plant,
  and this is not the tall showy kinds grown in garden borders.
examples:
- Beach aster grows where salt spray keeps taller plants away.
- The bluffs were bright with beach aster in late summer.
