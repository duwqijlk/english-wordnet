simpleMeaning: Big shellfish shaped like a circle, with hard shells, come from the Atlantic shore and
  are most often cooked in chowders or other dishes of shellfish.
scope: It is also called quahog, hard-shell clam, and quahaug, and it is a big shellfish with hard shells
  from the Atlantic shore, not the round clam whose heavy shells were once used as money.
examples:
- The chowder was full of round clams.
- These round clams live on the Atlantic shore.
