simpleMeaning: A result in which both sides finish with the same score and neither wins.
scope: This is the equal-score outcome of a contest, also called a draw, not the necktie worn under a
  collar and not a cord used for fastening.
examples:
- The match ended in a tie, so both teams shared the points.
- At the final whistle it was a tie, with neither side ahead.
