senseId: inflexible%5:00:00:unadaptable:00
synsetId: 01032766-s
simpleMeaning: not able to change or fit itself to new needs or to what is happening
scope: This sense is also called rigid and unbending. It means not able to change to fit new needs, not
  stiff in the body or hard to bend as a thing.
examples:
- The inflexible law allows no exceptions for anyone.
- His inflexible plan failed when the weather suddenly changed.
