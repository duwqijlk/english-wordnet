simpleMeaning: Wider round the middle than from top to bottom, with the ends pushed flat.
scope: Wider round the middle than tall, also called oblate; not round like a ball and not long and thin.
examples:
- The pumpkin-shaped fruit was wider round the middle than tall.
- A pumpkin-shaped moon looks flat at the top and bottom.
