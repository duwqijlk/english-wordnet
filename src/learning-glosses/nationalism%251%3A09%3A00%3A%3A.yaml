simpleMeaning: the belief that your own country, its way of life, and its needs and aims are better than
  those of any other country
scope: This is the belief that your own country is better than all others; it is not the belief that each
  country should act on its own, and not the wish for freedom by people ruled by another country.
examples:
- Nationalism led many people to think their country should always come first.
- He spoke with strong nationalism and said no other country was as good as his.
