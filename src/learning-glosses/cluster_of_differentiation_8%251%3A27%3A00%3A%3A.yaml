simpleMeaning: A protein in a cell's thin skin, found most on killer T cells' outside.
scope: This is a protein in the thin skin of a cell, found most of all on killer T cells; not a protein
  inside the cell and not one found on all white blood cells.
examples:
- The test looked for cluster of differentiation 8 on the T cells.
- Cluster of differentiation 8 marks the killer T cells in the sample.
