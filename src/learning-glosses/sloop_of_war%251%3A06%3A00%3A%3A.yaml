simpleMeaning: a fighting ship with sails or steam power, with guns on one deck only
scope: A fighting ship with sails or steam power and guns on one deck only; not a warship with guns on
  more than one deck and not a plain sailing ship with no guns.
examples:
- The sloop of war sailed into the harbour with its guns ready.
- A sloop of war carried its cannons on a single deck.
