simpleMeaning: a leafy plant from Australia and Tasmania, often grown by people, able to stand cool weather
scope: A leafy plant from Australia and Tasmania that stands cool weather, not a fern from a warm land
  and not a plant that dies in the cold.
examples:
- The soft tree fern stood tall in the cool garden.
- A soft tree fern grew beside the house in Tasmania.
