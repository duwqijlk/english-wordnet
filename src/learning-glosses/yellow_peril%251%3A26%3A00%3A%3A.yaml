simpleMeaning: a belief that the power of the peoples of Asia is a threat to the West
scope: This is a fear that the power of Asian peoples threatens the West; not a real attack and not a
  war.
examples:
- The book warned readers about the yellow peril from the East.
- In those years, some writers spoke of the yellow peril as a danger to the West.
