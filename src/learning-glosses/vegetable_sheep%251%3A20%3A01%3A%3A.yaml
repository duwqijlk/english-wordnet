simpleMeaning: A low herb that lives for many years spreads flat along the ground like a mat, with pale
  grey woolly leaves.
scope: Also called sheep plant, this low herb lies flat along the ground and is not the cushion-forming
  kind with tawny hairs.
examples:
- The vegetable sheep spread flat along the ground, with pale grey woolly leaves.
- Vegetable sheep lie flat and low, their leaves pale grey and woolly.
