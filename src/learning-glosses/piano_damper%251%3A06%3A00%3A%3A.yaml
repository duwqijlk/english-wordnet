simpleMeaning: The string of the instrument is stilled by this small block covered with felt, which falls
  onto it.
scope: Also called damper block, this small felt-covered block is the part that falls onto a string of
  the instrument to stop it shaking.
examples:
- The piano damper fell onto the string and the note stopped.
- The piano damper stopped the string from shaking after the note was played.
