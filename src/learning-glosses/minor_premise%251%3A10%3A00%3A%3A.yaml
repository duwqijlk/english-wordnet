senseId: 'minor_premise%1:10:00::'
synsetId: 06767126-n
simpleMeaning: A chain of reasoning has a starting point that holds the small term, the thing its last
  point is about
scope: 'Also called a minor premiss and subsumption: the starting point of a chain of reasoning that holds
  the small term, not the major premise and not the last point itself.'
examples:
- In the argument, the minor premise said that Felix is a cat.
- The minor premise of the syllogism names the subject of the conclusion.
