simpleMeaning: seeming like a person, when said of an animal or a thing that is not alive
scope: This sense means an animal or a thing seems like a person; it does not mean a real person, and
  it does not mean kind to people or animals.
examples:
- The robot had a humanlike face and voice.
- The monkey made a humanlike gesture with its hand.
