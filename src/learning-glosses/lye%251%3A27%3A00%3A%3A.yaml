simpleMeaning: A strong liquid in which sodium hydroxide or potassium hydroxide is dissolved.
scope: This is the caustic chemical liquid itself, not the soap or drain cleaner made from it.
examples:
- The drain cleaner contains lye, which can burn skin on contact.
- Workers wore gloves while handling the lye used to make soap.
