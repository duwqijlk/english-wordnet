simpleMeaning: Something that hides what is behind it or gives it shelter.
scope: This is a thing that hides or shelters what is behind it, not a protective cover that keeps things
  out or blocks the view, not the act of shielding someone from harm, and not the mesh guard fitted in
  a frame.
examples:
- A screen of tall hedges kept the neighbors from looking into the garden.
- They planted a screen of trees to shelter the house from the wind.
