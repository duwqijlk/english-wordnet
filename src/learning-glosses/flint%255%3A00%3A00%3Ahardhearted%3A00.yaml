simpleMeaning: Hard and cold toward tender feelings, refusing to be moved by them.
scope: 'Also called stony: hard and cold toward tender feelings, not the hard stone itself.'
examples:
- Even the child's tears left his flinty heart unmoved.
- She met his flinty gaze without fear.
