simpleMeaning: The United States' oldest federal law-enforcement body, guarding the federal courts, moving
  federal prisoners, guarding federal witnesses, handling goods seized from criminals, and keeping the
  federal court system working well.
scope: Not other federal law-enforcement bodies, nor local court officers; also called Marshals and US
  Marshals Service.
examples:
- The United States Marshals Service guards the courts.
- Prisoners are moved by the United States Marshals Service.
