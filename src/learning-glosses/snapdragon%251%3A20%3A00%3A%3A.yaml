simpleMeaning: A garden plant of the Antirrhinum group, with bright white, yellow or deep red flowers
  that look like a dragon's face
scope: This is the garden plant with flowers that look like a dragon's face, not a real dragon and not
  any other garden flower.
examples:
- She planted snapdragons along the front of the house.
- The snapdragon opened its bright red flowers in summer.
