simpleMeaning: 'A way of grouping the beats in a line of poetry: one weak beat, one strong beat, then
  one weak beat, as in the word ''remember''.'
scope: This is a beat pattern in poetry, with one weak beat, one strong beat and one weak beat, and not
  a pattern of three equal beats.
examples:
- The word 'remember' is an amphibrach, with its beats weak, strong, weak.
- The poet used an amphibrach in one line of the poem.
