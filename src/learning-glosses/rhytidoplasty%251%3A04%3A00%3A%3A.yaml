simpleMeaning: 'Wrinkles and other marks of age are taken from the face by surgery: a cut where the hair
  starts, loose skin pulled tight, and spare flesh cut away.'
scope: 'Also called lift, facelift, face lift, face lifting, nip and tuck, cosmetic surgery, and rhytidectomy:
  surgery that takes wrinkles and other marks of age from the face, not surgery on another part of the
  body.'
examples:
- She had a rhytidoplasty to smooth the wrinkles on her face.
- After the rhytidoplasty, the wrinkles on her face were gone.
