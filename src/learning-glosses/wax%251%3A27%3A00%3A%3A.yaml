simpleMeaning: any of different substances from minerals, plants, or animals; they are solid at normal
  temperatures and do not dissolve in water
scope: This is the solid substance itself, not the verb sense of growing larger, as the moon does.
examples:
- Bees make wax to build their honeycomb.
- The candle is made of soft wax that melts near the flame.
