simpleMeaning: any plant from the west of America with hairy leaves and long-stemmed flowers in strong
  warm colours, from golden yellow and copper to deep red
scope: A western American plant with hairy leaves and bright warm-coloured flowers, not a daisy and not
  a sunflower.
examples:
- Gaillardia bloomed along the dry roadside with copper-red flowers.
- She planted gaillardia for its long-stemmed yellow and red blooms.
