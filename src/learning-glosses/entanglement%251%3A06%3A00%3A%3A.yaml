simpleMeaning: A trap made of many tangled parts that catches and holds the person or animal it is meant
  for.
scope: 'Also called web: a trap with tangled parts that catches and holds, not being caught up in a hard
  personal or legal problem.'
examples:
- The deer stepped into the entanglement and could not pull free.
- Hunters laid an entanglement of net and wire to catch the fox.
