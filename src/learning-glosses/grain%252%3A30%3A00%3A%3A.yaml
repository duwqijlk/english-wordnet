simpleMeaning: to change something into small hard pieces
scope: The act of making something into small hard pieces; not the seeds of wheat or rice, not a tiny
  bit of a thing, and not the lines in wood.
examples:
- The machine grains the dried corn before it is packed.
- Heat and pressure grain the powder into tiny beads.
