simpleMeaning: A hue at the far tip of the colour range, beside orange, with the tint of blood and cherries
  and tomatoes and rubies.
scope: Also called red, scarlet, crimson, ruby, cherry, reddish, ruddy, carmine, blood-red, cherry-red,
  or ruby-red.
examples:
- Their dress was cerise in hue.
- The flower was cerise by shade.
