simpleMeaning: To make a speaker's mouth moves match the words heard, sound is joined to moving pictures
  so it fits exactly the act that made it.
scope: 'Also called lip synch, lip synchronisation, and lip synchronization: matching mouth moves to heard
  words.'
examples:
- The singer's lip sync was so exact that the crowd thought she was singing live.
- Bad lip sync makes the words fall behind the actor's mouth.
