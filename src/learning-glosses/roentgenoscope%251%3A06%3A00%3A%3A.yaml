simpleMeaning: A glowing screen joined to a source of X-rays in one machine lets a person look straight
  inside the body.
scope: Fluoroscope is another name for this machine, which lets a person look straight inside the body
  through a glowing screen joined to a source of X-rays.
examples:
- The roentgenoscope showed the inside of the body on its glowing screen.
- They looked straight inside the body with the roentgenoscope.
