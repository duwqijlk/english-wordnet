simpleMeaning: A showy tropical tree or shrub from Madagascar, widely planted in warm regions for its
  huge sprays of scarlet and orange flowers, sometimes classed in the genus Poinciana.
scope: This is the tropical tree with scarlet and orange flower sprays, not the adjective meaning showy
  or elaborately ornamented.
examples:
- A flamboyant in full flower can turn a whole street scarlet.
- Flamboyants are planted along tropical roads for their orange-red blossoms.
