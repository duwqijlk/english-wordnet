simpleMeaning: a person who gives much time to fine pleasures of the senses, most of all good food and
  drink
scope: 'Also called epicure, epicurean, foodie, gastronome and gourmet: a person who gives much time to
  fine pleasures of the senses, most of all good food and drink, not a plain eater and not a person who
  loves only art.'
examples:
- The old bon vivant spent his evenings at fine restaurants.
- As a bon vivant, she loved good wine and rich food.
