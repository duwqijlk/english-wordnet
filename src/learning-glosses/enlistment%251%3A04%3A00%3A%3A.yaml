simpleMeaning: when a person joins the armed forces to serve in them
scope: The act of joining to serve. It is not the time spent in service after joining, and it is not the
  service work itself.
examples:
- His enlistment in the army began last week.
- The office helps young men and women with enlistment in the navy.
