simpleMeaning: a stretch of water made when a flood or tide comes in, or when water is held or pushed
  back by a dam
scope: This is water held or pushed back by a dam, a flood or a tide; it is not the main flow of a river
  and not dry land left after water goes away.
examples:
- Mosquitoes breed in the still backwater behind the dam.
- After the flood, a wide backwater formed beside the river.
