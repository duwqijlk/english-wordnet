simpleMeaning: One of the people of the large western branch of the Sioux, made up of several groups that
  lived on the plains.
scope: 'Also called Lakota, Teton Dakota and Teton Sioux: one of the people of the large western branch
  of the Sioux, not a member of another branch.'
examples:
- The Teton lived on the plains of the west.
- He was a Teton, one of the Sioux people of the west.
