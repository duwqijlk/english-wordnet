simpleMeaning: To grab power or property for oneself, treating it as one's entitlement, without authority
  and possibly by force.
scope: Taking power or property for oneself, possibly by force and without authority — another name for
  usurp, seize, take over or arrogate — not taking up a title or duty, shouldering another's debts, or
  believing something true.
examples:
- The general assumed control of the capital before dawn.
- He assumed ownership of the land even though no deed named him.
