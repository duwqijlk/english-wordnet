simpleMeaning: A body chemical given out by a part of the brain that makes the front of a gland under
  the brain give out the chemical that starts the thyroid gland.
scope: This is a body chemical from a part of the brain that makes the front of a gland under the brain
  give out the chemical that starts the thyroid gland, also called protirelin, thyrotropin-releasing factor,
  thyrotropin-releasing hormone or TRH; other body chemicals from the brain act on different glands.
examples:
- TRF tells the front of the pituitary gland to give out the chemical that starts the thyroid gland.
- Without TRF, the pituitary gland would not give out its thyroid-starting chemical.
