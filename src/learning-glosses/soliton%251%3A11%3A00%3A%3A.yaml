simpleMeaning: In physics, a wave that holds its shape through a nonlinear medium — a packet of energy
  or particle-like pulse traveling alone, adding to no other wave, never fading.
scope: One name for this traveling disturbance, alongside soliton wave and solitary wave; not an ordinary
  wave, which spreads out and weakens.
examples:
- A soliton can cross a whole ocean without losing its shape.
- The signal travels as a soliton, keeping its form over great distances.
