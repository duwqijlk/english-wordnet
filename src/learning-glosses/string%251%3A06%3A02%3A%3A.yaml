simpleMeaning: a thing you wear around your neck, made by joining things with a thin cord that goes through
  them
scope: 'Also called chain, and another name for this sense is strand: a thing worn around the neck made
  of things joined together, not a group of things in a line that is not worn and not a single cord.'
examples:
- She wore a string of pearls around her neck.
- He gave her a long string of beads to wear around her neck.
