simpleMeaning: To turn into soap when it is split by water into an acid and an alcohol by a base that
  dissolves in water.
scope: A change in which a thing itself turns to soap; not the act of turning it to soap and not washing
  with soap.
examples:
- The oil began to saponify as the alkali worked on it.
- The oil will saponify if it is treated with an alkali.
