simpleMeaning: Not deep, with only a short way down from the top, in from the outside, or back from the
  front
scope: A thing that is not deep, not a person who thinks only about what is on the surface and not a stretch
  of water.
examples:
- The children played in the shallow water at the edge of the lake.
- The shallow cut on his knee soon stopped bleeding.
