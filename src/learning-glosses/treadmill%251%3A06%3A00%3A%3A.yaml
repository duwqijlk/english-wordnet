simpleMeaning: A mill that gets its power from men or animals who walk on a belt that moves in a circle
  or climb steps
scope: This is the old power machine, not the belt you walk or run on to keep fit, and not a dull job
  that never changes.
examples:
- In the old mill, horses on a treadmill turned the heavy stones.
- Prisoners once walked for hours on a treadmill to power the mill.
