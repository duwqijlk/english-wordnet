simpleMeaning: the gene that is changed in a serious illness of the lungs and gut
scope: The gene changed in that illness, not the illness itself and not a drug that treats it.
examples:
- Scientists study the cystic fibrosis transport regulator to learn how the illness starts.
- People with the illness have a fault in the cystic fibrosis transport regulator.
