simpleMeaning: As a spice for food and a drink to make a person feel better, people use the inner skin
  of a tree with a strong sweet smell.
scope: Also called canella and white cinnamon, this names the inner skin of a tree with a strong sweet
  smell, not its outer skin.
examples:
- She added canella bark to the food for flavour.
- Canella bark was used as a tonic.
