senseId: 'union%1:06:01::'
synsetId: 04517110-n
simpleMeaning: A design on a national flag that stands for the joining of two or more independent states,
  usually placed in the upper inner corner.
scope: Not the act of joining groups, not an organization of workers, and not the healing of a wound or
  bone.
examples:
- The new national banner shows a small union in its upper inner corner, standing for the joining of the
  two states.
- Historians traced how the union on the flag changed each time another territory was added.
