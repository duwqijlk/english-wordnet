simpleMeaning: A drug that calms excess acid in the stomach, made with calcium carbonate, magnesium hydroxide
  and simethicone
scope: This is a drug that calms excess acid in the stomach, and the three things in it — calcium carbonate,
  magnesium hydroxide and simethicone — set it apart from other drugs that calm stomach acid.
examples:
- She took Mylanta to calm the acid in her stomach.
- Mylanta contains calcium carbonate and magnesium hydroxide.
