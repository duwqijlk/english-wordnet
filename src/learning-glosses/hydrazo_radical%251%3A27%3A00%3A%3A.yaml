simpleMeaning: a part, -HNNH-, from hydrazine, a chemical made of hydrogen and nitrogen, that can join
  to two other things
scope: A part from hydrazine that can join to two other things, also called hydrazo group; not a single
  atom and not the whole chemical it comes from.
examples:
- The hydrazo radical sits between two carbon rings.
- In the reaction, the hydrazo radical joins the two halves of the molecule.
