simpleMeaning: A thing put where the sun can reach it may be changed by the sun's light and warmth
scope: This is to put a thing out in the sun's light so it changes, also called sun or solarize; not the
  sudden collapse from heat that insolation names.
examples:
- The farmer insolated the herbs on the roof so the sun could dry them.
- Paper left to insolate in a sunny window may turn yellow and crumble.
