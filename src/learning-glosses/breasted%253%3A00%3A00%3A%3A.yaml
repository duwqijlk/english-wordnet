simpleMeaning: having a breast or breasts, or the kind of breasts named in the longer word, used chiefly
  in combined words
scope: Used chiefly in combined words such as red-breasted to describe the breast or breasts, not a word
  normally used on its own for a chest.
examples:
- A red-breasted bird sat on the fence.
- The guide pointed out a yellow-breasted bird in the tree.
