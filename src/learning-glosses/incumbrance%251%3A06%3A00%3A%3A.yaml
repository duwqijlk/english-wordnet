senseId: 'incumbrance%1:06:00::'
synsetId: 03525974-n
simpleMeaning: A thing that gets in the way, and weighs one down.
scope: This sense is also called a hitch, interference, hindrance, preventative, preventive, and encumbrance,
  for a thing that gets in the way, and weighs one down, where a hitch is anything that blocks the way
  or slows things down and is hard to deal with.
examples:
- Incumbrance got in the way.
- Incumbrance weighs one down.
