simpleMeaning: speaking in a very soft voice with breath only, without the cords in your throat shaking
scope: 'Also called whisper and whispering: speaking very softly with breath only, not speaking in a full
  loud voice.'
examples:
- Her susurration was so soft that only the child next to her could hear her words.
- He spoke in a susurration, using breath only, so that the people around him could not hear.
