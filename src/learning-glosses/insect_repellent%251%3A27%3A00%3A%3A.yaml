simpleMeaning: a chemical substance that keeps insects away
scope: A chemical substance that makes insects stay away, also called insect repellant or insectifuge;
  not a poison that kills them and not a net that blocks them.
examples:
- He sprayed insect repellent on his legs before going out at dusk.
- The insect repellent worked well, and no flies came near us at lunch.
