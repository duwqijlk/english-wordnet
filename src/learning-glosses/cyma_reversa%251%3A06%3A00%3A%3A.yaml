simpleMeaning: a strip used to trim a wall or edge, cut so its edge looks like an S, with the outward
  curve on top and the inward curve below
scope: 'Also called ogee: a trim strip with an S-shaped edge, the outward curve on top, not a plain straight
  trim and not a trim with the curves the other way round.'
examples:
- The carpenter cut a cyma reversa along the top of the bookcase.
- A cyma reversa runs along the edge of the old ceiling.
