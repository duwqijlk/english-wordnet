senseId: 'incompatibility%1:26:00::'
synsetId: 13998484-n
simpleMeaning: This word names how hard the body's defence tries to push out things from outside, such
  as blood from another person or bits of body moved in.
scope: In the study of the body's defence, this is the measure of how hard the body pushes out things
  from outside, not how well it takes them in.
examples:
- The incompatibility of the donated blood was high.
- They checked for incompatibility before the transplant.
