simpleMeaning: to put a person into a job as a priest or other church leader in a formal church act
scope: Also called order, ordain and ordinate, this means putting a person into a church job in a formal
  act. It is not giving a person or thing to a god by a serious promise, and not the word for a person
  or thing already set apart for a holy use.
examples:
- The church consecrated him as a bishop in a formal service.
- She was consecrated as a priest last year.
