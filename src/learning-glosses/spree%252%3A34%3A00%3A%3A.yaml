simpleMeaning: To let yourself enjoy an activity as much as you want, with nothing holding you back, like
  when you go shopping
scope: 'The verb sense: to take part in an activity without holding back, not the noun sense of a short
  time when you do what you feel like.'
examples:
- She loved to spree at the market, buying far more than she needed.
- On pay day, they spree through the shops and buy whatever they want.
