simpleMeaning: to spoil something, such as a person's thoughts or the feeling in a place, by doing harm
  to it
scope: Spoiling something, such as a person's thoughts or the feeling in a place; not putting a harmful
  material into food or drink, and not killing a person or animal with a harmful material.
examples:
- His lies poisoned her mind against her friends.
- The long argument poisoned the feeling in the office.
