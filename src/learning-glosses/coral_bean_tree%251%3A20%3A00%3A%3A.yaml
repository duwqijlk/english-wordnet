simpleMeaning: a shrub that loses its leaves in winter, with clusters of deep red flowers and red seeds
  with black spots
scope: A shrub that loses its leaves in winter, with clusters of deep red flowers and red seeds with black
  spots; not a shrub with white flowers, and not a tree grown for its wood.
examples:
- The coral bean tree was covered in deep red flowers.
- Its black-spotted red seeds hung from the coral bean tree all summer.
