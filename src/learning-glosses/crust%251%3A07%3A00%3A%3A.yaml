simpleMeaning: the quality of being rude and not showing respect, and of being ready to do things you
  have no right to do
scope: 'Also called gall: rude ways with no respect, not the hard outer layer that covers something, and
  not forming such a layer.'
examples:
- He had the crust to ask for more money after doing no work.
- Her crust shocked everyone when she took my seat without asking.
