simpleMeaning: a car worker's right, like a mechanic's right for other work, to keep a car until the owner
  pays for the work done on it
scope: A car worker's right to hold a car until the owner pays for the work done on it; not a claim on
  a house and not a simple bill for repairs.
examples:
- The garageman's lien let the shop keep his car until he paid the bill.
- Because of the garageman's lien, she could not take her car home until the work was paid for.
