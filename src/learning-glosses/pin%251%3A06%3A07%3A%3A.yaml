simpleMeaning: small tube-shaped parts inside a lock, each made of two pieces held by springs, that let
  the bolt move when a key lines them up
scope: Small tube-shaped parts inside a lock that a key lines up, not a small piece of wood or metal used
  to hold things together and not a holder that keeps an oar in place on a boat.
examples:
- The locksmith checked the pins inside the old lock.
- A worn pin in the lock kept the key from turning.
