simpleMeaning: a change in which a high-energy light particle turns into two charged bits, one negative
  and one positive, as it goes past an atom's core
scope: 'Also called pair formation and pair production: a light particle turning into two charged bits
  near an atom''s core, not two things put together by hand.'
examples:
- In the lab, pair creation can happen when a gamma ray passes near a heavy nucleus.
- The book says pair creation turns one light particle into an electron and a positron.
