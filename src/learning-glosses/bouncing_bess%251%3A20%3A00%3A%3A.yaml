simpleMeaning: A plant from Europe, with pink or white flowers and leaves that make a soap-like wash when
  crushed.
scope: This European plant with pink or white flowers gives a soap-like wash from its crushed leaves;
  also called hedge pink, soapwort, bouncing Bet and Saponaria officinalis.
examples:
- Bouncing Bess grew by the cottage wall.
- The leaves of bouncing Bess made a wash when crushed.
