simpleMeaning: to put something heavy or hard to bear on a person, so it holds them back
scope: To put something heavy or hard to bear on a person, so it holds them back; not to put a riding
  seat on an animal, and not simply to give a person a task to do.
examples:
- He was saddled with the job of cleaning the whole house on his own.
- The family was saddled with a large debt after the shop closed.
