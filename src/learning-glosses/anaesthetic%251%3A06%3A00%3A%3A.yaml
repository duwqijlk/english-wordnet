simpleMeaning: a drug that makes a person lose feeling in the body for a short time
scope: Also called anesthetic, this is a drug that stops feeling for a short time, not the word for relating
  to or making that loss of feeling.
examples:
- The doctor gave her an anaesthetic before the operation.
- The anaesthetic made his whole body numb for a short time.
