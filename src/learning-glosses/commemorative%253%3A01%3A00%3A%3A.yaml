senseId: 'commemorative%3:01:00::'
synsetId: 03067214-a
simpleMeaning: Put up or made so that people will remember a person or an event.
scope: Also called commemorating, this use is for keeping a person or event in memory, not the coin or
  stamp made to mark an event or honour a person.
examples:
- A commemorative plaque marks the place where the poet was born.
- The school held a commemorative service for its founder.
