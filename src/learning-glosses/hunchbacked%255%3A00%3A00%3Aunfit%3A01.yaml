synsetId: 01022592-s
simpleMeaning: having a back that curves out in a round shape because of kyphosis, a problem where the
  spine, the line of bones in the back, curves too much
scope: This describes a back with this lasting curve in the spine, also called humped, humpbacked, crookback,
  gibbous, crookbacked and kyphotic; it is not just a back bent for a short time.
examples:
- The old man was hunchbacked and walked with care.
- Years of illness left her hunchbacked.
