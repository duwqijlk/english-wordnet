simpleMeaning: In physics, the pull between all things that have mass in the universe, with the pull of
  the earth on things near its surface standing out most
scope: In physics, this pull between masses is also called gravity, gravitation and gravitational force,
  and is not a push and not a magnetic pull.
examples:
- The gravitational attraction between the earth and the moon causes the tides.
- Scientists measured the gravitational attraction of the two stars.
