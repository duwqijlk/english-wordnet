senseId: 'adverse_witness%1:18:00::'
synsetId: 09793105-n
simpleMeaning: In law, a person who gives word in court but is tied to the other side, so their word may
  lean against that side.
scope: In law, a person giving word in court who is tied to the other side, also called a hostile witness;
  not a person on your own side and not a person called only for their skill.
examples:
- The judge let them question the adverse witness hard.
- The adverse witness spoke in a way that hurt the other side's case.
