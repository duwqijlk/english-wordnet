simpleMeaning: a look on the face with the corners of the mouth turned up, usually showing pleasure or
  amusement
scope: The expression itself, usually showing pleasure or amusement; not the act of making it, nor the
  verb for conveying something with it.
examples:
- Her smile grew wider as the music began.
- He greeted us with a warm smile.
