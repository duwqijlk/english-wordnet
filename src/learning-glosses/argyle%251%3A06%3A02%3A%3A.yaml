simpleMeaning: A lidded holder for gravy, made of silver or another metal, with a cup in the middle that
  comes out and holds hot water to keep the gravy warm.
scope: Also called argyll, a covered gravy holder with a hot-water cup inside; not the diamond pattern
  of the same name and not a sock knitted with that pattern.
examples:
- The argyle kept the gravy warm through the whole meal.
- She poured hot water into the argyle before serving the roast.
