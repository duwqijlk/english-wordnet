simpleMeaning: any of many trees of the cypress family that look like the trees they take their name from
scope: One of many trees of the cypress family that look like true cedars, not the wood of such a tree
  and not a true cedar.
examples:
- The cedar by the fence looks like a true cedar but belongs to another family.
- Many cedars of this kind grow in the hills of the west.
