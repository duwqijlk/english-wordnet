simpleMeaning: a machine that copies real conditions or a real place so people can learn and practise,
  or do study work
scope: This is a machine for learning, practice, or study that copies real life; it is not the real plane,
  ship, or place itself, and not a game played only for fun.
examples:
- The pilot learned on a flight simulator before flying a real plane.
- Students used a driving simulator to practise in bad weather.
