simpleMeaning: A trance brought on by deep religious feeling, in which the body keeps working as usual,
  unlike other trances
scope: 'Also called religious trance: a trance from deep religious feeling, not a trance that slows the
  body down and not ordinary prayer.'
examples:
- The monk fell into an ecstatic state during prayer.
- In her ecstatic state she stayed aware of the room around her.
