simpleMeaning: In this store of things, the thing put in last is taken out first, last in, first out
scope: 'Also called a stack or a push-down stack: a store where the last thing put in is taken out first,
  not a line where the first thing in is taken out first.'
examples:
- The push-down list held the newest entry at the top.
- In a push-down list, the last item stored is the next one removed.
