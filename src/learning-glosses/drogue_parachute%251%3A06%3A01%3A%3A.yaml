simpleMeaning: when the main one is still in its pack, this small cloth pulls it out
scope: The small cloth that draws the main one out of its pack, not the main one itself and not the one
  that slows a fast-moving thing.
examples:
- The drogue parachute pulled the main one out of its pack the moment the jumper left the plane.
- Without the drogue parachute, the main one stayed folded in its pack.
