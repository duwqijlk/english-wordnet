simpleMeaning: In mathematics, all the values that can be put into a function (a rule that gives an answer)
  and for which it gives an answer
scope: In mathematics, all the values that can be put into a function and for which it gives an answer;
  not an area of land, not a field of knowledge, and not a name on the internet.
examples:
- For this function, the domain is all numbers except zero.
- The teacher asked us to find the domain before drawing the graph.
