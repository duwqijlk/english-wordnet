simpleMeaning: A boat that leans over to one side with ease when its sails are up.
scope: 'Also called tender: a boat that leans over easily under sail, not the turning hand tool, not the
  drug, and not the acts of turning, bending, fastening, or starting with it.'
examples:
- The boat was crank and leaned over at the least puff of wind.
- A crank boat like that needs a careful hand at the sail.
