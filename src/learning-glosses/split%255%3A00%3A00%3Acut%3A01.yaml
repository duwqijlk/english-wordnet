simpleMeaning: especially of wood, cut or torn along its length, following the long lines in the wood
scope: This describes wood cut along its length. It is not a group that no longer holds together, and
  not a share of money.
examples:
- We bought split logs for the fireplace.
- He stacked the split logs, each cut along its length, beside the fire.
