simpleMeaning: An acid made halfway through the body's breaking down of two building blocks of protein.
scope: An acid made halfway through the body's breaking down of two protein building blocks, also called
  alcapton and homogentisic acid; not a stomach acid and not a fruit acid.
examples:
- Alkapton forms as the body breaks down tyrosine and phenylalanine.
- The lab found alkapton in the sample.
