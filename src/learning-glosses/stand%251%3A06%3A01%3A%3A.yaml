simpleMeaning: rows of seats rising in steps, often made of wood in a built structure, where people sit
  to watch an event such as a game or parade
scope: Not a small table or a position on an issue; it is the tiered seating at a sports ground or along
  a parade route.
examples:
- We bought tickets for the stand behind the goal.
- Crowds filled the stands along the parade route.
