simpleMeaning: 'A mind illness that shows signs of two other illnesses at once: one that turns worry into
  body troubles and one of strong worry and fear.'
scope: A mind illness showing signs of two other illnesses at once; not conversion disorder alone and
  not anxiety neurosis alone.
examples:
- The doctor called her illness anxiety hysteria.
- Anxiety hysteria can bring both worry and body troubles.
