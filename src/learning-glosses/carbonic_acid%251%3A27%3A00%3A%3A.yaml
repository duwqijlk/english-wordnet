simpleMeaning: A weak sour liquid that is found only when mixed with water; it forms when a gas made in
  breathing and burning joins with water.
scope: A weak sour liquid found only when mixed with water, not a strong acid and not plain water with
  bubbles.
examples:
- Carbonic acid forms when the gas joins with water.
- Fizzy drinks hold carbonic acid in the water.
