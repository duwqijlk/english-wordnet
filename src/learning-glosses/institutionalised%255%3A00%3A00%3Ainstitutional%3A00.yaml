simpleMeaning: Given an institution's stamp, or set inside a structured order, usually long-settled.
scope: This sense is also called institutionalized, for being given an institution's stamp, or set inside
  a structured order, usually long-settled, unlike the sense for being by rule put in, or given to, a
  special house.
examples:
- The rite was institutionalised, given an institution's stamp.
- The system was institutionalised, set inside a structured order.
