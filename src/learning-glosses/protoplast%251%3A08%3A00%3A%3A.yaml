simpleMeaning: A living cell part made of a centre and the jelly-like stuff around it that works with
  the centre
scope: 'Also called energid: a living cell part with a centre and the stuff around it, not a whole cell
  and not the centre alone.'
examples:
- The protoplast kept working after the cell wall was taken away.
- Under the lens, the protoplast showed a centre ringed by soft jelly-like stuff.
