senseId: 'trade_barrier%1:10:00::'
synsetId: 06672969-n
simpleMeaning: any rule or plan that limits buying and selling between countries
scope: Any rule or plan that limits buying and selling between countries; a tax on goods from abroad can
  be one, and it is not a government's broad plan for trade or a ban on one ship.
examples:
- The new trade barrier made foreign cars dearer.
- Trade barriers slow the flow of goods between nations.
