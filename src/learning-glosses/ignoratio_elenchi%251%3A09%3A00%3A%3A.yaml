senseId: 'ignoratio_elenchi%1:09:00::'
synsetId: 05903067-n
simpleMeaning: 'Showing a point beside the matter is wrongly taken as showing the matter itself: that
  is this mistake in thinking.'
scope: Among mistakes in thinking, this one takes proof of a point beside the matter for proof of the
  matter itself.
examples:
- His reply was an ignoratio elenchi, proving a point no one had raised.
- The debate coach warned them against ignoratio elenchi, where the wrong point gets proved.
