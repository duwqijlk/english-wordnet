simpleMeaning: close to average, or inside expected limits, for example in intelligence or development
scope: Around average in intelligence or development, not conforming to a usual standard, not agreeing
  with scientific laws, and not forming a right angle.
examples:
- The child's test scores were normal for her age.
- Doctors found the boy's development to be normal.
