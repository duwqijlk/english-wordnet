simpleMeaning: Leaves and stems sticky with sap mark any of many western American plants of the genus
  Grindelia, once used as medicine and often poisonous to farm animals.
scope: 'Also called gum plant, gumweed, and tarweed: a western American plant with sap-sticky leaves and
  stems, once used as medicine.'
examples:
- Rosinweed leaves are sticky with sap.
- Rosinweed was once used as medicine.
