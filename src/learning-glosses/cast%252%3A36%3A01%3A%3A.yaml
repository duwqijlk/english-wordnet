simpleMeaning: To pick someone to act, sing, or dance a role in a play, film, musical, opera, or ballet.
scope: Not 'to throw something with force,' not 'to form an object by pouring hot metal into a mold,'
  not 'to vote,' not 'to assign the roles of a whole production,' and not 'to choose at random.'
examples:
- The director cast her as the queen in the school play.
- They cast an unknown actor in the leading role.
