simpleMeaning: The state of a thing that is not proper, going against what is right.
scope: The state of being improper, not a single improper act, and not an improper way of behaving.
examples:
- The impropriety of the remark was plain to everyone in the room.
- He was warned about the impropriety of taking gifts from clients.
