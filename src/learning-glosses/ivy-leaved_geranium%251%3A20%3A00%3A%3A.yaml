simpleMeaning: Pink-red flowers and round green parts joined to the stalk at the middle mark this often-grown
  trailing geranium from South America.
scope: Also called ivy geranium and hanging geranium, it is the often-grown trailing geranium from South
  America with round green parts joined to the stalk at the middle and pink-red flowers.
examples:
- The ivy-leaved geranium trails as it grows.
- Ivy-leaved geraniums bear pink-red flowers.
