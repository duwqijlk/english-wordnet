simpleMeaning: an actor who can take the place of the usual performer when needed
scope: 'Also called a standby: this is the actor who can take the place of the usual performer when needed,
  not the usual performer, and not the verb sense of doing this job.'
examples:
- The understudy played the lead role when the main actor fell ill.
- As the understudy, she had learned every line of the part.
