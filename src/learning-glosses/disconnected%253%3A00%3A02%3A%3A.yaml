simpleMeaning: In music, made of separate short notes or sounds, each cut off sharply
scope: In music, notes cut off short and kept apart, not notes joined smoothly and not talk that jumps
  from one subject to another.
examples:
- The disconnected notes rang out sharp and short.
- His disconnected applause came in quick, sharp bursts.
