simpleMeaning: Squeezing a person's windpipe shut so that the person cannot breathe.
scope: The act of squeezing a person's windpipe shut so the person cannot breathe, not the squeezing shut
  of some other part of the body and not the state of being unable to breathe; also called choking, strangling,
  or throttling.
examples:
- There was no sign of strangulation on the body.
- The report said death came by strangulation.
