simpleMeaning: The process in which a young ball of cells grows into a ball with layers inside, as cells
  move inward.
scope: This is the process in which a young ball of cells grows into a ball with layers inside, not the
  splitting of one cell into two and not the later forming of organs.
examples:
- Gastrulation turns the hollow ball of cells into a layered one.
- During gastrulation, cells move inward to form layers.
