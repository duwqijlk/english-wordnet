simpleMeaning: Any shrub from tropical Africa with stiff leaves spaced alternately along the stem and
  tight, brightly coloured flower heads that look like cones.
scope: An African shrub with cone-shaped flower heads, not the banksia, an Australian plant with similar
  cone-like blooms.
examples:
- A protea with stiff leaves grew beside the path.
- The protea's cone-shaped flower head was dense and brightly coloured.
