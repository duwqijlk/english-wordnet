simpleMeaning: A medicine that lowers swelling and pain, sold as Ansaid, taken only by mouth.
scope: A medicine that lowers swelling and pain, sold as Ansaid, taken only by mouth; not a medicine rubbed
  on the skin and not a medicine given by needle.
examples:
- Flurbiprofen is taken by mouth for pain and swelling.
- The doctor gave her flurbiprofen, sold as Ansaid, for her sore joint.
