simpleMeaning: In philosophy, the idea that how we judge a thing depends on the person judging and the
  case at hand.
scope: In philosophy, the idea that all judgments depend on the person and the case at hand, not a fixed
  rule that holds for everyone.
examples:
- Relativism says that what is right depends on the person and the case.
- He argued for relativism in the philosophy class.
