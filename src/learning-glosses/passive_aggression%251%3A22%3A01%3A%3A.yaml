schema: oewn-learning-gloss-v2
senseId: 'passive_aggression%1:22:01::'
synsetId: 92450015-n
simpleMeaning: Behaviour that expresses hostility indirectly, for example through putting things off,
  stubbornness, sullenness, or deliberately or repeatedly failing to do requested tasks that one is often
  explicitly responsible for.
scope: This names the indirect show of hostility itself, not open confrontation or a single angry outburst.
examples:
- His passive aggression showed in the way he kept postponing every task we agreed on.
- Her passive aggression came out as sullen silence whenever she was asked to help.
