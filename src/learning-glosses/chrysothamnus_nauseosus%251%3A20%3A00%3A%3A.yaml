simpleMeaning: A sweet-smelling shrub of western alkali plains, with bendy, hairy branches and dense clusters
  of small yellow flowers; hares hide in it, and the Navajo get yellow dye from it.
scope: Also called rabbit brush and rabbit bush; a sweet-smelling shrub of western alkali plains, not
  a garden shrub and not another yellow-flowered shrub.
examples:
- Chrysothamnus nauseosus grows on western alkali plains.
- Chrysothamnus nauseosus gives the Navajo yellow dye.
