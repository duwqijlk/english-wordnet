simpleMeaning: likely to look closely at what you see, hear and feel, and at how you take these things
  in
scope: introverted is another name for this sense. This is about looking closely at what you yourself
  see, hear and feel, not about being quiet or shy with other people.
examples:
- She is introspective and spends time noticing exactly what she sees, hears and feels.
- The introspective musician listened again and again to notice every small change in the sound she heard.
