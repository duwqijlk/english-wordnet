simpleMeaning: Made by mixing unlike things, especially by breaking one thing into tiny bits and spreading
  them through another.
scope: Made by mixing unlike things into one, also called homogenised, not the use that means made the
  same all through.
examples:
- The milk was homogenized before it was bottled.
- This sauce is homogenized, so it never splits.
