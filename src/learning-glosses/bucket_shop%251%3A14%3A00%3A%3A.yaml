simpleMeaning: a firm that buys and sells shares in a dishonest way or pushes people too hard to buy and
  sell
scope: A firm that buys and sells shares in a dishonest or too forceful way, not a cheap drinking place
  of former times and not an ordinary honest firm.
examples:
- The bucket shop pushed him to buy shares he did not want.
- People lost their savings to a bucket shop that sold them worthless shares.
