simpleMeaning: that time in a woman's monthly cycle when getting with child is least likely, most often
  just before or just after her monthly flow
scope: The time in a woman's cycle when getting with child is least likely, not the fertile time and not
  the time of her monthly flow itself.
examples:
- Couples once counted on the safe period to avoid pregnancy.
- The safe period falls just before or after menstruation.
