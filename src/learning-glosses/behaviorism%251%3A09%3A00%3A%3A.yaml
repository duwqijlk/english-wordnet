simpleMeaning: a way of studying the mind that looks at what people do and can be seen and measured
scope: 'Also called behavioristic psychology, behaviourism and behaviouristic psychology: a way of studying
  the mind from what can be seen and measured, not a study of thoughts and feelings and not a way to treat
  illness.'
examples:
- Behaviorism looks at what people do rather than at what they think.
- In behaviorism, a child's actions are watched and counted, not guessed at.
