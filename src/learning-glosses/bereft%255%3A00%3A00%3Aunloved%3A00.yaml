simpleMeaning: sad because the person you love does not love you back
scope: Also called lovelorn, this means sad because the person you love does not love you back; it is
  not just sad in general.
examples:
- He felt bereft because Anna did not love him, though he loved her deeply.
- Bereft and lonely, she watched the man she loved marry someone else.
