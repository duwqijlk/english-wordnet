simpleMeaning: to go through states, events, feelings, or physical sensations yourself, so that you know
  them directly.
scope: This sense is not being alive, not residing in a place, and not enjoying a good and satisfying
  everyday existence; it is about personally undergoing an experience.
examples:
- She has lived through two wars.
- He lived with constant pain for years.
