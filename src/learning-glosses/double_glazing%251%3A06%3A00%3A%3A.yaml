simpleMeaning: a window made of two sheets of glass with a gap between them, which lets less heat and
  sound pass through
scope: A window of two sheets of glass with a gap between them, not a window of one sheet and not a window
  frame.
examples:
- The double glazing in the bedroom keeps out the cold.
- We put double glazing in the front windows to cut the noise from the street.
