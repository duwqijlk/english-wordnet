simpleMeaning: a hole in the ground over which wood is set so two men can cut it with a long tool that
  they pull back and forth together
scope: A hole in the ground used for cutting wood by hand with two men, not a ditch and not a modern saw
  bench.
examples:
- The two men stood on either side of the sawpit to cut the long board.
- They set the log over the sawpit before starting work.
