simpleMeaning: the act of breaking away from the ideas a party holds, most of all from the ideas of strict
  communism
scope: This is a break with the ideas a party holds, most of all strict communism, not a change of party
  and not a personal quarrel with a leader.
examples:
- The old guard accused him of deviationism when he praised market reforms.
- Her deviationism cost her a seat on the central committee.
