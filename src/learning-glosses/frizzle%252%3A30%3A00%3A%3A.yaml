simpleMeaning: to make food crisp by cooking it in hot fat so that it curls
scope: This sense is about cooking food in hot fat until it curls and is crisp, not about hair curling
  and not about cooking food until it is soft.
examples:
- Bacon will frizzle in the hot pan.
- She frizzled the bacon until it was crisp and curled.
