simpleMeaning: The part of molecular biology (the study of the very small parts of living things) that
  studies using very small living things for certain kinds of work in industry
scope: This field is also called biotech; it is not the study of workers and the places and tools they
  work with.
examples:
- Biotechnology has helped make new medicines using living cells.
- She studies biotechnology and works with very small living things in a lab.
