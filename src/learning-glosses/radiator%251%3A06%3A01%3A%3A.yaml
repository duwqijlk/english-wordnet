simpleMeaning: a vehicle part that takes heat from hot liquid running through a thin metal grid, as air
  blown past it by the vehicle or a fan carries the heat away
scope: A cooling part in a vehicle, not a room heater and not anything that gives off energy.
examples:
- The radiator in the truck sprang a leak on the motorway.
- A fan behind the radiator blows air through the metal grid.
