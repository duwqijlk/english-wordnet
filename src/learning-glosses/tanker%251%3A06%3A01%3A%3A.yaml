simpleMeaning: A motor vehicle made to carry loads of liquid, dry goods in bulk, or gas on roads
scope: A road vehicle for carrying liquid, dry bulk, or gas; not an oil ship and not a soldier who drives
  a tank.
examples:
- A tanker carried milk to the dairy each day.
- The tanker turned slowly into the depot.
