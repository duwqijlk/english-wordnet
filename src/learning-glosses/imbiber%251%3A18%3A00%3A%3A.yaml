simpleMeaning: Strong drink, most of all far too much of it, is what this person takes in
scope: A person who drinks alcohol, most of all too much of it, also called a drinker, a juicer, and a
  toper; not someone who takes in water or food.
examples:
- The old imbiber was known in every bar in town.
- He had become an imbiber who could not get through a day without a drink.
