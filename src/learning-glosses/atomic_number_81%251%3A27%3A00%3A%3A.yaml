simpleMeaning: A soft grey metal that bends, looks like tin, and discolours in air; very poisonous, used
  in poisons for rats and insects; found in zinc blende and some iron ores.
scope: Also called Tl and thallium; a soft grey metal, not the shiny metal tin and not the radioactive
  metal plutonium.
examples:
- Atomic number 81 is thallium, a very poisonous metal.
- Poisons for rats sometimes contain atomic number 81.
