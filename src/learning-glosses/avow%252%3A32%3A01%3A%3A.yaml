simpleMeaning: To admit something openly and plainly, hiding nothing about it.
scope: To admit something openly and plainly, hiding nothing about it, also called avouch; not the use
  for declaring something solemnly and in set form as true.
examples:
- He avowed his part in the plan without hiding anything.
- She avowed that she had made the mistake.
