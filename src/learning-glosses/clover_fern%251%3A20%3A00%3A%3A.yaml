simpleMeaning: one of several water plants of the group Marsilea, with four small leaves
scope: 'Also called pepperwort: it is a water plant with four small leaves, not a land plant and not a
  plant with a different number of leaves.'
examples:
- A clover fern grew in the shallow water at the edge of the pond.
- We found a clover fern with four small leaves in the ditch.
