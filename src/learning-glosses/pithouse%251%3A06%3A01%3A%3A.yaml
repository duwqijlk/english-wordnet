simpleMeaning: A shelter for people or livestock sunk into the earth, wholly recessed beneath a flat soil-covered
  roof, partly recessed with a wood or sod roof, or cut into a hillside.
scope: The earth-set shelter for people or livestock, one of several names for this dwelling; it is not
  a hollowed-log boat or a baseball bench area, and this spelling is written as one word.
examples:
- The family lived in a pithouse roofed with wooden beams and sod.
- Archaeologists mapped an ancient pithouse near the river.
