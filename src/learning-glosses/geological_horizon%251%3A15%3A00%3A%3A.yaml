simpleMeaning: A rock bed is dated by a band of rock with its own mix of stuff, often fossils.
scope: A band of rock marked by what it holds, often fossils, used to date a rock bed; not the line where
  sky meets earth and not a single fossil.
examples:
- The geological horizon in that cliff is rich in shells.
- They used the geological horizon to date the rocks below it.
