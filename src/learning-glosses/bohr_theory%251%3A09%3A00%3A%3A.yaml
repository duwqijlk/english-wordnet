simpleMeaning: 'An account joining Rutherford''s model with the quantum account: electrons circling a
  nucleus sit only in fixed energy states, and light comes out when one jumps to another state.'
scope: An account of the atom joining Rutherford's picture with the quantum account, not the later quantum
  account of the atom on its own and not an older picture of the atom as a solid ball.
examples:
- Bohr theory says that electrons can sit only in certain fixed energy states.
- Under Bohr theory, light comes out when an electron jumps from one state to another.
