simpleMeaning: in tennis, the player who hits back the ball that the other player serves to start a point
scope: The tennis player who faces the serve. Not the radio or television machine, and not any person
  who gets something.
examples:
- The receiver stood back and waited for the fast serve.
- As receiver, she hit the serve back over the net.
