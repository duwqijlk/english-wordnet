simpleMeaning: to cast all of one's ballots together and share them out by a set rule
scope: To cast all of one's ballots together by a set rule, not to spread them among many people and not
  a vote in a poll.
examples:
- She decided to bullet vote for her favourite candidate.
- He used a bullet vote to put all his support behind one person.
