simpleMeaning: A lost and mixed-up feeling that hits a person suddenly put among strange ways of life
  or strange views.
scope: A lost feeling on meeting strange ways of life, not homesickness and not fear of strangers.
examples:
- Culture shock left her confused in the new city.
- He felt culture shock when he moved abroad.
