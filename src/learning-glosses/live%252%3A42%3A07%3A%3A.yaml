simpleMeaning: to spend your days in a full and satisfying way, going after what makes each day good.
scope: This sense is not merely being alive, not dwelling somewhere, and not simply undergoing an experience;
  it is about making everyday existence rich and pleasing.
examples:
- They live fully, traveling whenever they can.
- She lives well despite a modest income.
