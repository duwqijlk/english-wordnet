simpleMeaning: Red or purple spots on the skin that come from a fault in the tiny blood tubes, caused
  by bacteria or drugs
scope: Spots on the skin from a fault in the tiny blood tubes; not spots from too few of the blood bits
  that stop bleeding, and not a bruise from a knock.
examples:
- She had nonthrombocytopenic purpura after the drug upset her small blood tubes.
- The doctor said the nonthrombocytopenic purpura came from a fault in the tiny blood tubes.
