simpleMeaning: to use the power of a higher position to give an order, or to make a law or rule in this
  way
scope: 'Also called enact: to order something by higher power or make it a formal rule, not to give a
  person priestly power or a church job.'
examples:
- The king ordained that the new tax must be paid.
- The council ordained a new law for the town.
