simpleMeaning: Its leaves go a pale bronze colour in the fall, on a tough good-looking plant of North
  America that lives for many years
scope: It is also called broom beard grass or prairie grass, and it is not the coarse one-year plant of
  the Old World tropics.
examples:
- The wire grass turned a pale bronze colour in the fall.
- Wire grass grows in North America and lives for many years.
