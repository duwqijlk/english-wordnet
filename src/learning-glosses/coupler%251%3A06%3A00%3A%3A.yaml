simpleMeaning: A machine part that joins the ends of two things that sit next to each other
scope: This is a machine part that joins the ends of two things that sit next to each other; coupling
  is another name for it; not a hinge, which lets things swing, and not a bolt, which holds things fast.
examples:
- The coupler joined the two railway cars together.
- He fitted a new coupler to the end of the pipe.
