simpleMeaning: After the juice had begun to turn into alcohol, the skins are taken off the red grapes
  to make this pale red drink served with meals
scope: 'Also called rose and blush wine: a pale red drink served with meals, made from red grapes with
  the skins taken off soon after the juice began to turn into alcohol, not red wine and not white wine.'
examples:
- They served pink wine with the fish.
- The pink wine in her glass was pale red.
