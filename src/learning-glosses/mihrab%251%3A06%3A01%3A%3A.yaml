simpleMeaning: In Islam, while people pray, the niche shape worked into a Muslim prayer rug must point
  toward Mecca
scope: In Islam, a niche shape on a prayer rug, not the niche built into the wall of a mosque.
examples:
- The mihrab on his rug pointed toward Mecca.
- She laid the rug so the mihrab faced Mecca.
