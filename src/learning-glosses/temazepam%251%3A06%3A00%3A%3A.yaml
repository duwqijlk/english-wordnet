simpleMeaning: People who keep waking up in the night are helped by this sleep drug, a benzodiazepine
  sold as Restoril, often given by doctors, which works slowly and lasts long enough.
scope: Among sleep drugs, this is the one sold as Restoril, working slowly and lasting through the night.
examples:
- With temazepam, sleep lasted through the night.
- The temazepam worked slowly and lasted through the night.
