simpleMeaning: needing a lot of thought, and hard to understand, to work out, or to believe
scope: 'Also called tough, elusive, problematic and baffling: this describes a problem or idea that needs
  much thought, not a plan full of linked parts and not wood covered with knots.'
examples:
- The class faced a knotty question that took all their thought to answer.
- She could not accept such a knotty claim without much thought and proof.
