simpleMeaning: a piece of music for a full orchestra, based on written works and folk tales
scope: This is a piece of music for a full orchestra based on written works or folk tales, also called
  a tone poem. Not a symphony and not a song with words.
examples:
- The orchestra played a symphonic poem based on an old folk tale.
- Her favourite symphonic poem tells a story from a novel.
