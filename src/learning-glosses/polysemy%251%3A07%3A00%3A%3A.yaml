simpleMeaning: Two or more different things can be meant by one word or group of words, as the setting
  changes
scope: 'Another name for lexical ambiguity: one word or group of words that can mean two or more different
  things, not a word with only one meaning and not two words that sound the same.'
examples:
- 'The word ''bank'' shows polysemy: it can mean the edge of a river or a place that keeps money.'
- Polysemy means one word can carry two different meanings at once.
