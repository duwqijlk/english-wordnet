senseId: 'hereditarianism%1:09:00::'
synsetId: 05980780-n
simpleMeaning: The idea in philosophy that what a person gets from parents matters more than the world
  around them in shaping how the mind grows.
scope: The idea that what comes from parents matters more than surroundings in shaping the mind; not the
  idea that surroundings matter most, and not a theory about the body.
examples:
- Hereditarianism holds that brains grow more from birth than from schooling.
- He argued for hereditarianism, saying that what parents pass on shapes the mind most.
