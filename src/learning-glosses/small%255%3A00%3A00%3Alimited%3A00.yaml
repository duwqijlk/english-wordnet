simpleMeaning: Relatively moderate or limited in size, amount or extent, as with a modest business or
  a plan of limited scope.
scope: This sense marks something as modest in scale rather than large — businesses, plans, operations
  or even whole countries — and it can carry the idea that the scale is limited. It is close to the sense
  meaning 'not large but sufficient in size or amount', but that one stresses adequacy, while this one
  stresses limited extent. It is not the sense used of a young child or of a faint voice.
examples:
- She started a small business selling homemade jam.
- The group began with small-scale plans to clean up one beach.
