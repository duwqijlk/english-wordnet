simpleMeaning: In north Africa and south-west Asia lives a very poisonous viper with a hard, sharp point
  above each eye.
scope: Also called a horned viper, cerastes, and a sand viper, this very poisonous snake of north Africa
  and south-west Asia is known by the hard, sharp point above each eye.
examples:
- The horned asp lay still, its hard point above each eye easy to see.
- The horned asp is best left alone, for its bite can kill.
