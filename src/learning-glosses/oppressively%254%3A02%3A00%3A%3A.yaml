simpleMeaning: in a way that feels too heavy and hard to bear
scope: This is about a heavy feeling that is hard to bear, like great heat, not about a ruler who treats
  people in a cruel way.
examples:
- It was oppressively hot in the small office that day.
- The summer air was oppressively hot and still.
