simpleMeaning: a kind of food poisoning from eating food that holds the germ Salmonella
scope: This is food poisoning from food with the germ Salmonella in it; not poisoning from too much of
  a drug and not a stomach bug caught from a person.
examples:
- Salmonellosis kept him in bed for three days.
- She got salmonellosis from eggs that were not cooked through.
