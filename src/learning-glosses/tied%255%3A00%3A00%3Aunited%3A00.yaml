simpleMeaning: joined together in a strong way, especially by love or a close feeling for each other
scope: Joined by a close feeling for each other; not held with string or cord, and not held tight so a
  person or thing cannot move.
examples:
- The two families are tied by marriage.
- She feels tied to her old friends by many years of love and care.
