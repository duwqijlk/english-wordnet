senseId: 'appropriation%1:04:01::'
synsetId: 00374226-n
simpleMeaning: The act of making a thing part of a larger whole by joining or uniting it with that whole.
scope: Also called annexation, the act of making a thing part of a larger whole by joining or uniting
  it with that whole, not the taking of a thing without its owner's leave.
examples:
- The appropriation of the small firm into the group took a year.
- Their appropriation of the new land joined it to the old kingdom.
