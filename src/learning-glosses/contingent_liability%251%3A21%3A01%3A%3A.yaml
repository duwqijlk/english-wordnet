simpleMeaning: Debts that may fall on a group or person, hanging on how some unsure thing to come turns
  out, such as a court case
scope: Debts that may fall on a group or person, hanging on a future event, not debts already owed and
  not a fine already set.
examples:
- A pending lawsuit is a contingent liability for the firm.
- The accounts list every contingent liability.
