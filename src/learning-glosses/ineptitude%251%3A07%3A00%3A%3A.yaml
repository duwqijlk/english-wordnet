simpleMeaning: having no good points that make a thing worth something or of use
scope: 'Also called worthlessness: having no good points that make a thing of use, not poor skill at doing
  a job.'
examples:
- They spoke of the old machine's ineptitude, saying it was good for nothing.
- The product's ineptitude was clear, as no one would pay for a thing of no use.
