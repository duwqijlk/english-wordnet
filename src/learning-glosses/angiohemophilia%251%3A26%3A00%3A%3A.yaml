simpleMeaning: An inherited bleeding disorder identified by Erik von Willebrand and passed on only when
  both parents carry the gene; a clotting protein is lacking and mucous membranes bleed.
scope: The same bleeding disorder that vascular hemophilia names; not classic hemophilia A, which is carried
  on the X chromosome and affects mainly males.
examples:
- Doctors suspected angiohemophilia when the boy bruised easily and bled from his gums.
- Her angiohemophilia was confirmed by blood tests showing low levels of clotting factor.
