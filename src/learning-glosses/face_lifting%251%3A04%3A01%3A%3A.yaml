simpleMeaning: The outside of a thing is made to look better by this work, usually without big changes
scope: 'Also called a facelift and a face lift: the outside of a thing made to look better by this work,
  not a new building and not surgery to make a face look young.'
examples:
- Face lifting gave the old library a fresh look without a full rebuild.
- The town paid for face lifting on the market hall, not for a new building.
