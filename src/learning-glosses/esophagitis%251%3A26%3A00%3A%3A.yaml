simpleMeaning: a sore, swollen state of the food pipe, often brought on when what is in the stomach comes
  back up into it
scope: 'Also called oesophagitis: a sore, swollen state of the food pipe, often brought on by stomach
  contents coming back up, not a sore throat and not a cut in the food pipe.'
examples:
- His esophagitis made swallowing hurt for weeks.
- The doctor said her esophagitis came from years of reflux.
