simpleMeaning: Short, loud sounds that come quickly, one after another, like those a doctor may hear with
  a stethoscope (a tool for listening inside the body) in some breathing illnesses
scope: Rattle is another name for this sense. It is a sound made of short, loud sounds coming quickly,
  and a doctor may hear it in the chest of a person with a breathing illness. It is not the act of shaking
  something to make a noise.
examples:
- The doctor heard a rattling in the old man's chest.
- A rattling came from her chest each time she breathed in.
