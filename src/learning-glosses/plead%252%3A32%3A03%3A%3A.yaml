simpleMeaning: In law, to put forward a claim, above all to answer the other side by saying their facts
  are wrong or by adding new facts
scope: In law, to put forward a claim and answer the other side, not to beg or ask for help.
examples:
- The lawyer pleaded the facts of the case before the judge.
- They pleaded in answer to the other side's claim.
