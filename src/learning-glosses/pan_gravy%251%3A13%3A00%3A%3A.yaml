simpleMeaning: the flavoured thin juices that run out of meat as it cooks, often with a little water added
scope: The flavoured thin juices that run out of meat as it cooks, often with a little water added; gravy
  is another name for this sense, and it is not a thick sauce made with flour or the juices of raw meat.
examples:
- She poured the pan gravy over the roast.
- The pan gravy was thin and full of flavour.
