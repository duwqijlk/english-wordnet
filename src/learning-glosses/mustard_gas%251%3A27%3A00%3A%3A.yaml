simpleMeaning: Blisters rise and eyes and lungs are harmed by this poisonous gas used in war, made from
  sulfur stuff, and no cure is known.
scope: This poisonous gas used in war is also called blistering agent, dichloroethyl sulfide, mustard
  agent, and sulfur mustard, and no cure is known for it.
examples:
- The mustard gas raised blisters where it touched the skin.
- The mustard gas harmed the eyes and lungs of those caught in it.
