simpleMeaning: something such as heat, radiation (energy sent out as rays), or a chemical that kills very
  small living things that can carry disease
scope: This names the thing itself that kills very small living things that can carry disease; it is not
  the describing word for something that stops disease from starting.
examples:
- She wiped the kitchen table with a strong disinfectant.
- The hospital uses a disinfectant to clean its floors each day.
