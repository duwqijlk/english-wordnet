simpleMeaning: Mainly in the south of the United States, a small cake made of corn bread, with an oval
  shape, baked or fried
scope: Also called a corn dab or a corn dodger. This is a small corn bread cake, not a person who avoids
  something and not a sheet of paper handed out in the street.
examples:
- She fried a pan of corn dodgers to eat with the beans.
- He baked a batch of dodgers from cornmeal, water, and a little salt.
