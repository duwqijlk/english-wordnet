synsetId: 01354304-v
simpleMeaning: to get the message out of a wave that has been changed to carry it
scope: To get the message out of a wave that carries it, not to send a message out on a wave and not to
  change the wave itself.
examples:
- The radio demodulates the signal so we can hear the music.
- The receiver demodulates the wave and gives us the news report.
