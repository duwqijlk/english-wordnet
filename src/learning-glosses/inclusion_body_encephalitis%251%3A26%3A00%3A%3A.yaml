senseId: 'inclusion_body_encephalitis%1:26:00::'
synsetId: 14367594-n
simpleMeaning: A rare, long-lasting, slowly worsening brain inflammation from the measles virus, mostly
  in children and young adults, after a first measles infection before age two, usually fatal within three
  years.
scope: This is the measles-caused brain disease, not measles itself and not other kinds of brain inflammation.
examples:
- The boy was diagnosed with inclusion body encephalitis after a measles infection at eighteen months.
- Inclusion body encephalitis is rare, and the child's condition slowly got worse over several years.
