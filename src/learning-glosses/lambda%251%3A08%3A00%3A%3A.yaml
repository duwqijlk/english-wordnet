simpleMeaning: The point on the skull used when measuring the head, where the seam running front to back
  meets the seam running across the back of the head
scope: This is the point on the skull used when measuring the head, where the front-to-back seam meets
  the seam across the back of the head, not a bone and not the top of the head.
examples:
- The lambda lies at the back of the skull where two seams meet.
- The doctor marked the lambda on the skull before the scan.
