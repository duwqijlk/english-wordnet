senseId: 'place%1:04:01::'
synsetId: 00722683-n
simpleMeaning: the job or role that another person normally fills.
scope: This is not a physical location and not a seat at a performance; it is the post or duty that belongs
  to someone else.
examples:
- No one could take the place of the old coach.
- When the manager retired, her assistant stepped into her place.
