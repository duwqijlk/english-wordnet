simpleMeaning: the amount of unbalanced electricity held in a body or object, positive or negative, seen
  as too many or too few electrons
scope: This is the stored electrical imbalance itself, not the act of putting power into a battery and
  not the price asked for something.
examples:
- Rubbing the glass rod gave it a positive charge.
- Opposite charges attract, while like charges push apart.
