simpleMeaning: The bits left after seeds are taken out, made of seed coats and small pieces of stem or
  leaves
scope: The bits left after seeds are taken out, also called straw, stalk, shuck and stubble; not the outer
  skin of a fruit or seed.
examples:
- The husk was swept up after the grain was threshed.
- Feed for the animals included husk from the mill.
