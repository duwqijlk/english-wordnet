simpleMeaning: Paid time away from work, given in almost every land, to look after a child or to plan
  for the child's care.
scope: Paid time away from work to care for a child, also called family leave; not a holiday and not time
  off for sickness.
examples:
- She took parental leave after her baby was born.
- His parental leave let him stay home with the twins.
