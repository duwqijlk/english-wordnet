simpleMeaning: any of several bushes or small trees in the Corylus group, which make nuts you can eat,
  with each nut inside a leafy covering
scope: This is the bush or small tree itself, also called hazel and also called hazelnut tree, not the
  nut that grows on it.
examples:
- A hazelnut grows at the edge of our garden and gives nuts every autumn.
- They planted three hazelnuts along the fence for shade and food.
