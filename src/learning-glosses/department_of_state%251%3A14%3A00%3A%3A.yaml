simpleMeaning: A part of the United States government that makes and keeps the plans for dealing with
  other countries.
scope: Also called State, the State Department and the United States Department of State; it handles the
  country's ties with other lands.
examples:
- The Department of State sets the country's plans for dealing with other countries.
- The Department of State met with leaders from other countries.
