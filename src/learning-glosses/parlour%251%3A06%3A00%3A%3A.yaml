simpleMeaning: a room set aside in an inn or club for meeting guests
scope: A room set aside in an inn or club for meeting guests; parlor is another name for this sense, and
  it is not a bedroom or a dining room.
examples:
- They waited for him in the parlour of the inn.
- The club's parlour was warm and full of old chairs.
