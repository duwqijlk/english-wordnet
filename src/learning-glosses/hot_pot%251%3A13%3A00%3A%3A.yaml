simpleMeaning: A stew of meat and starchy vegetables cooked in a covered dish with a tight lid
scope: This is a stew of meat and starchy vegetables cooked in a covered dish; hotpot is another name
  for this sense, not a soup served in a bowl and not a dish cooked quickly in an open pan.
examples:
- We ate hot pot with the family on Sunday.
- The hot pot had been cooking all afternoon.
