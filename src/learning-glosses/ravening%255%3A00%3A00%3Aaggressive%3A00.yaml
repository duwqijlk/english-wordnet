simpleMeaning: living by hunting and eating other animals, especially by catching animals that are still
  alive
scope: 'Also called predatory, rapacious and vulturous: living by hunting other animals, not wanting too
  much money and not just eating a lot of food.'
examples:
- Ravening wolves hunt sheep in the hills.
- The ravening birds catch small animals to eat.
