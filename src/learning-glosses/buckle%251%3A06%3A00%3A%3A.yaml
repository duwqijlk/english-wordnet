simpleMeaning: a thing that joins the two ends of a belt or strap; it often has a loose pin
scope: The thing on a belt or strap that holds its two ends together; not a bent shape in something, and
  not the act of fastening.
examples:
- The buckle on his belt was made of silver.
- She pulled the strap tight and closed the buckle.
