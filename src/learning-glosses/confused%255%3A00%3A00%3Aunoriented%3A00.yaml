simpleMeaning: not knowing where you are, and not sure about the time, the place, or who you are
scope: About a person who does not know where they are, also called lost. Not about things with no order,
  and not about talk that does not follow in order.
examples:
- After the fall, he felt confused and did not know where he was.
- The old man woke up confused and could not say what day it was.
