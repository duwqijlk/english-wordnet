simpleMeaning: the warm and friendly way people act with each other when they feel close and at ease together
scope: Also called comradeship and comradery. This is the shared warm feeling between people who know
  each other well, not one single kind act or one meeting.
examples:
- There was real camaraderie among the men in the team.
- Years of working together built strong camaraderie in the office.
