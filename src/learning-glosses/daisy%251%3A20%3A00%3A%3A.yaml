simpleMeaning: any of many plants whose flower heads are clusters with long, narrow outer petals, most
  often set in one ring
scope: A plant whose flower head is a cluster ringed by long outer petals, not a rose or a tulip.
examples:
- Daisies covered the field in white and yellow.
- She picked a daisy and put it behind her ear.
