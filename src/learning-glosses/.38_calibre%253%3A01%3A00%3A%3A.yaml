simpleMeaning: said of a gun, or the shot it fires, when the hole down the barrel is a little more than
  three eighths of an inch wide
scope: It is also called .38-caliber, .38-calibre, and .38 caliber, and it is said of a gun or its shot
  when the hole down the barrel is a little more than three eighths of an inch wide, not of one with a
  narrower bore.
examples:
- She loaded a .38 calibre shell.
- He held a .38 calibre pistol.
