simpleMeaning: A supposed chemical change, most likely in brain tissue, that holds a memory
scope: This is a supposed chemical change, most likely in brain tissue, that holds a memory; memory trace
  is another name for it, not a memory itself and not a change in muscle.
examples:
- The engram was thought to hold the memory in brain tissue.
- Scientists looked for an engram that holds a memory.
