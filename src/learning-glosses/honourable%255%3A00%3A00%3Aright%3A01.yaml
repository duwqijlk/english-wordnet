simpleMeaning: Living and acting by what is right and good, and refusing to do what is wrong
scope: This is about acting by right and good, with honorable and ethical as other names for this sense,
  not simply deserving praise or respect.
examples:
- The honourable judge refused the bribe and ruled by the law.
- She took the honourable course and told the truth, though it cost her the job.
