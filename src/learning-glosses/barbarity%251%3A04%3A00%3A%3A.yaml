simpleMeaning: a very cruel act that hurts people badly, with no kindness or pity
scope: 'Also called brutality, savagery, and barbarism: one very cruel act that hurts people badly; not
  the quality of being cruel in general, which is another sense of the same word.'
examples:
- The barbarity of the attack shocked the whole village.
- Witnesses told the court about the barbarity done to the prisoners.
