simpleMeaning: With a buckle at the side, this short footwear for riding fastens shut
scope: This short riding footwear fastens with a buckle at the side, also called a jodhpur or a jodhpur
  boot; not a tall boot and not footwear that ties with laces.
examples:
- She put on her jodhpur shoes before the lesson.
- A jodhpur shoe fastens with a buckle at the side.
