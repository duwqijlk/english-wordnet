simpleMeaning: Of a male sex gland, still in the belly and not yet down in the bag below
scope: A male sex gland still in the belly, not yet down in the bag below; not a gland that has been taken
  out, and not one that moved down and then went back up.
examples:
- The baby had an undescended testis.
- An undescended testis may need care as the boy grows.
