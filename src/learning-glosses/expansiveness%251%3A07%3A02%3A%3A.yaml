simpleMeaning: the quality of being grand and very large in size, or of tending to grow larger and wider
scope: This is about great size, or about tending to grow larger and wider, not the open, friendly way
  of a person who talks a lot.
examples:
- The expansiveness of the palace filled us with wonder at its great size.
- From the hill we could feel the expansiveness of the wide plain.
