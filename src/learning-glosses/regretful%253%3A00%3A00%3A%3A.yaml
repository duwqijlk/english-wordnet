simpleMeaning: when what you did or left undone, or something now lost, leaves you sad in a way others
  can see
scope: 'Also called sorry or bad: sad over what you did or failed to do, not angry or afraid.'
examples:
- She felt regretful about the harsh words she had spoken.
- He gave a regretful look as he left the old house behind.
