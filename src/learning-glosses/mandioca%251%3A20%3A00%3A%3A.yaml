simpleMeaning: Long thick roots good to eat and soft stems that break easily belong to this cassava plant,
  used above all to make cassiri, a strong drink, and tapioca.
scope: 'Also called gari, manioc, bitter cassava, mandioc, and tapioca plant: a cassava plant with long
  thick roots good to eat, used above all to make cassiri and tapioca.'
examples:
- Mandioca was one of the crops they grew.
- They used mandioca roots to make cassiri.
