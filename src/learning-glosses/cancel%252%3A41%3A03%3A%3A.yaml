simpleMeaning: to put off something planned with no new date set, or to stop it from happening at all
scope: 'Also called scratch and scrub: this is putting off a planned event with no new date, or stopping
  it for good. Not making a law stop counting, and not a mark in music.'
examples:
- We had to cancel the dinner party.
- They cancelled the meeting because the chair was ill.
