simpleMeaning: a person who moves small figures of people or animals with the hands or with strings
scope: This is the person who works the small figures in a show, not the figure itself and not an actor
  who appears in person.
examples:
- The puppeteer made the little dog figure dance and sing.
- A good puppeteer can make two figures talk at the same time.
