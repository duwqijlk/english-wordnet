simpleMeaning: to get pleasure from something.
scope: It is not the formal sense of having the use or benefit of something, as in 'enjoy good health';
  it means feeling happy because of an activity or experience.
examples:
- I really enjoyed the concert last night.
- She enjoys walking in the rain.
