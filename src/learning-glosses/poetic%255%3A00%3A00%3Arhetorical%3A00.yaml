simpleMeaning: like poetry in words or feeling, or fit to be in a poem
scope: Words or feelings like those of poetry, or fit for a poem; not poetry full of romantic pictures,
  and not plain prose.
examples:
- She used poetic words to tell of the sea at dawn.
- His poetic way of speaking made the plain tale sound fine.
