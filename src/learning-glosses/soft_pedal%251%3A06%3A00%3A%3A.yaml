simpleMeaning: on a piano, a foot lever that moves the parts that strike the strings closer to them, so
  the sound comes out quieter
scope: A foot lever on a piano that makes its sound quieter, not the pedal that holds a note on after
  you lift your foot, and not a lever that makes the sound louder.
examples:
- She pressed the soft pedal for the quiet part of the piece.
- He used the soft pedal when the music turned quiet.
