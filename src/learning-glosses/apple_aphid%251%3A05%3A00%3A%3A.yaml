simpleMeaning: This bright green bug feeds on the leaves of trees that bear round fruit, and the leaves
  curl where it has fed.
scope: Also called a green apple aphid, this bug lives on the leaves of trees that bear round fruit and
  makes them curl.
examples:
- The apple aphid curled the leaves of the young tree.
- The orchard keeper found apple aphids feeding on the leaves.
