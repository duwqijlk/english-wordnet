simpleMeaning: A blackish long-legged wading bird of New Zealand, at times seen as a colour form of the
  white-headed stilt.
scope: This is a blackish long-legged wading bird of New Zealand, at times seen as a colour form of the
  white-headed stilt, not the small tree that bears large red or orange fruit.
examples:
- The kaki wades in the shallow water of New Zealand wetlands.
- A kaki was seen beside the white-headed stilts.
