simpleMeaning: full of trouble and lack of order, with people who refuse to obey those in charge
scope: 'Also called troubled, turbulent, disruptive, and tumultuous: full of trouble and lack of order;
  not free from rules about right and wrong in a wild way.'
examples:
- It was a riotous time, with crowds in the streets and no one obeying orders.
- The riotous crowd would not listen to the leaders and broke up the meeting.
