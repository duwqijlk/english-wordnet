synsetId: 92465316-n
simpleMeaning: on a sailing boat, a set of sails whose front sail, such as a jib or genoa, stops short
  of the top of the mast
scope: A set of sails on a sailing boat whose front sail stops short of the mast top, not a rig whose
  front sail runs to the very top.
examples:
- The fractional rig lets the crew trim the front sail without going to the mast top.
- Race boats often use a fractional rig for more control.
