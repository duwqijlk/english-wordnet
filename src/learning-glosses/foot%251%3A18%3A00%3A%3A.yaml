simpleMeaning: A member of a surveillance team who follows a target by walking or as a passenger in a
  vehicle.
scope: This is a person on a surveillance team, not the body part below the ankle, a unit of length, or
  the act of walking.
examples:
- He worked as a foot for the surveillance team, following suspects through busy streets.
- As the only foot on duty that night, she shadowed the target alone.
