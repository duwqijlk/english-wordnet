simpleMeaning: inside animals or plants, the parts are covered, lined, or joined by a soft, bendy sheet
  of living stuff
scope: A soft, bendy sheet of living stuff that covers or joins parts inside animals or plants, not a
  thin sheet of cloth or paper.
examples:
- A thin membrane covers the surface of the eye.
- The membrane lines the inside of the shell.
