simpleMeaning: a small Australian bird like a small parrot, usually light green with black and yellow
  marks in the wild, but bred by people in many colors
scope: This small Australian bird, also called budgerigar, budgie, budgereegah, budgerygah and grass parakeet,
  is not the small African parrot known for staying close to its mate.
examples:
- The small green lovebird in the pet shop had black and yellow marks.
- He bought a blue lovebird, a color bred from the usual light green kind.
