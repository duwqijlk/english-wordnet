simpleMeaning: To do with a kind of breeding in which the two sex cells are unlike in some way, such as
  size or shape
scope: To do with breeding where the two sex cells are unlike in size or shape; anisogamic is another
  name for this sense, not breeding where the sex cells are alike and not breeding without sex cells.
examples:
- Anisogamous reproduction joins two unlike sex cells.
- In anisogamous plants, the male and female cells differ in size.
