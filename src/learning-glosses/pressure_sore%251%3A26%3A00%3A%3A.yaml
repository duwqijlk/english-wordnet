simpleMeaning: A wound on the skin that does not heal, from lying or sitting on one spot for a long time
scope: 'Also called a bedsore or a decubitus ulcer: a wound on the skin that does not heal, from lying
  or sitting on one spot for a long time, not a cut and not a burn.'
examples:
- After weeks in bed, he got a pressure sore on his heel.
- The nurse turned her each day so no pressure sore would form.
