senseId: 'unevenly%4:02:00::'
synsetId: 00332854-r
simpleMeaning: in a way that is not smooth, level, or the same all the way through
scope: This is done or spread in a way that is not smooth or the same all through. It is not about giving
  shares in an unfair way, and not only about a rough edge or line.
examples:
- The paint was spread unevenly, so some parts of the wall were dark and some were light.
- He walked unevenly after he hurt his leg.
