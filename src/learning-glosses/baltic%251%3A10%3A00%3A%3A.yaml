simpleMeaning: A branch of the Indo-European family of tongues, close to the Slavonic tongues, that has
  kept many old ways of speech thought to have been in the first Indo-European tongue.
scope: Also called Baltic language; a branch of the Indo-European family of tongues, not the Slavonic
  tongues themselves and not a single modern tongue.
examples:
- Baltic tongues have kept many old words.
- Lithuanian is one of the Baltic tongues.
