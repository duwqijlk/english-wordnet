simpleMeaning: One job of the body is run by this small group of message-carrying parts
scope: 'Another name for this sense is nerve centre, also called center or centre: a small group of cells
  that runs one job of the body, not one single cell and not the whole nervous system.'
examples:
- In most people the nerve center for speech is in the left half of the brain.
- Damage to this nerve center can change how a person speaks.
