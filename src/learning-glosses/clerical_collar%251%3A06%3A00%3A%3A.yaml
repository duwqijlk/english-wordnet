simpleMeaning: A stiff white band worn round the neck, with no gap at the front, worn as a mark of priests
  and other church workers.
scope: A stiff white band worn round the neck with no gap at the front, also called dog collar; not an
  ordinary shirt collar and not a tie.
examples:
- The priest wore a clerical collar under his dark jacket.
- A clerical collar marked him out as a member of the clergy.
