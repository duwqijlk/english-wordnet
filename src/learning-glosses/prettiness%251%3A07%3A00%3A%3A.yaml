simpleMeaning: the quality of being pleasing in a soft, gentle way or a smooth, pleasing way, in a girl
  or young woman
scope: 'Also called cuteness: the quality of a girl or young woman being pleasing in a soft, gentle way
  or in a smooth, pleasing way. Not beauty in a strong or grand way.'
examples:
- People often noticed the young woman's prettiness.
- Her prettiness showed in her soft smile and smooth, light dress.
