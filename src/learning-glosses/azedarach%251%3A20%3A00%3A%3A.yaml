simpleMeaning: With purple flowers and small yellow fruits no one can eat, this tree of northern India
  and China is now at home in the southern United States, giving shade.
scope: Also called azederach, chinaberry and chinaberry tree, this is a tree of northern India and China
  with purple flowers, not a fruit tree grown for food.
examples:
- The azedarach bore purple flowers and small yellow fruits.
- An azedarach gives shade in the south of the United States.
