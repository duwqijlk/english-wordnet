simpleMeaning: in geology, the physical action by which something is gradually ground away, for example
  by particles washing over it, and also used figuratively
scope: This is the geological grinding away of material, not the act of having clothes on, and not the
  adjective meaning exhausting.
examples:
- The smooth rocks show the wearing of the cliffs by the sea.
- Wind and water cause slow wearing of the soft sandstone.
