simpleMeaning: Describes nerves and nerve signals that carry messages away from the brain and spinal cord.
scope: 'Also called motorial: describes nerves and nerve signals that carry messages away from the brain
  and spinal cord, not nerves that carry messages in and not the noun sense of a nerve itself.'
examples:
- Efferent nerves carry signals away from the brain.
- The efferent impulse left the spinal cord.
