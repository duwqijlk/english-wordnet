simpleMeaning: a woody herb from the Old World, often grown, with large pink to red flowers
scope: A woody Old World plant with large pink to red flowers; periwinkle, old maid, red periwinkle and
  rose periwinkle are other names for this sense, not a true jasmine and not a hot pepper plant.
examples:
- Cayenne jasmine bloomed pink all summer in her garden.
- She planted cayenne jasmine along the front wall.
