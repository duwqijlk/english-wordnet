simpleMeaning: The tongue of the people of Frisia, used until the 1500s, a Germanic tongue of that land
  in early times.
scope: Also called Old Frisian language; the Frisian tongue until the 16th century, the Germanic tongue
  of ancient Frisia, while modern Frisian came after it.
examples:
- Old Frisian was spoken in Frisia until the 1500s.
- The old laws were written down in Old Frisian.
