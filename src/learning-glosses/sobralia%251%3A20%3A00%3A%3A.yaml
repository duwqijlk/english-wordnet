simpleMeaning: Orchids whose leafy stems bear striking, bright cattleya-style flowers, either alone or
  in a cluster.
scope: A kind of orchid with cattleya-like flowers, not a cattleya itself.
examples:
- A sobralia bloomed beside the path, its flowers as large as a cattleya's.
- Sobralias grow on leafy stems, with blooms that may open alone or in clusters.
