simpleMeaning: a journey by a large group of people to get away from a place that is not safe for them
scope: A large group leaving a place that is not safe for them; not one person travelling alone and not
  ordinary travel for pleasure.
examples:
- The war led to a large exodus of families from the city.
- After the flood, there was an exodus from the villages near the river.
