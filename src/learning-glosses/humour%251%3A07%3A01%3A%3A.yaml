simpleMeaning: being able to see what is funny and to put it into words so others laugh
scope: 'Also called humor: the ability to see and share what is funny, not a joke itself and not a mood
  that comes and goes.'
examples:
- She has a fine sense of humour and laughs at the smallest joke.
- You need a sense of humour to enjoy his teasing.
