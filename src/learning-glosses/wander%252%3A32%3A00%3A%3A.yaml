senseId: 'wander%2:32:00::'
synsetId: 00782620-v
simpleMeaning: to stop being clear or to turn away, especially from the main subject, when you write,
  think, or speak
scope: This is about thoughts or words moving away from the main subject, not about walking from place
  to place with no goal and not about being unfaithful in marriage.
examples:
- His mind wandered during the long talk and he missed the main point.
- Please do not wander from the subject when you write your answer.
