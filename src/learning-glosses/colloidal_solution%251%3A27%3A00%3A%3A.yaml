senseId: 'colloidal_solution%1:27:00::'
synsetId: 14614975-n
simpleMeaning: a mix in which tiny bits of solid stay spread out in a liquid that runs all through the
  mix
scope: A mix of tiny bits of solid spread through a liquid; sol and colloidal suspension are other names
  for this sense; not a plain liquid, and not a mix that settles at once.
examples:
- The colloidal solution stayed cloudy for hours.
- A colloidal solution holds tiny bits spread through a liquid.
