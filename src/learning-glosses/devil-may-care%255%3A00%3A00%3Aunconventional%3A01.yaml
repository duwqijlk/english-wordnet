simpleMeaning: having a free and easy way of life that breaks the usual rules and has a bad name
scope: A free and easy way of life that breaks the usual rules and has a bad name, also called raffish
  and rakish; not a careful way of life and not a life that follows the rules.
examples:
- His devil-may-care manner shocked the older guests at the party.
- She lived in devil-may-care style, spending money as it came.
