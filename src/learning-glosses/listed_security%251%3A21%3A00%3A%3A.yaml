simpleMeaning: A thing of money value that one of the organized and registered trading markets in the
  US has agreed to buy and sell
scope: Something of money value agreed for trading on a registered US market, not an unlisted one and
  not a private loan.
examples:
- The company hoped its stock would become a listed security.
- Only a listed security can be bought and sold on that market.
