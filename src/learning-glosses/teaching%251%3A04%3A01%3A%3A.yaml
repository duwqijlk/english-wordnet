simpleMeaning: the work of educating or instructing people and giving them knowledge and skills
scope: This is the activity of instructing people, not the job or career of being a teacher, and not the
  ideas that someone presents as true.
examples:
- She spends most of her time on teaching and very little on research.
- Good teaching requires patience and clear explanations.
