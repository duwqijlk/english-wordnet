simpleMeaning: the breaking apart of the shared rules that guide how people in a group act, think, and
  are with each other
scope: This is the breaking apart of shared rules in a group of people, not pieces flying from a bomb
  and not a computer file split across a disk.
examples:
- When trust fell, fragmentation of village life followed, and neighbours stopped helping each other.
- The report links social fragmentation to the loss of shared rules in the town.
