simpleMeaning: In tennis or handball, the back edge that marks each end of the court, which the player
  serving must not step over
scope: In tennis or handball, the back edge of the court that the player serving must not step over, also
  called a baseline; not the net and not a side edge of the court.
examples:
- The server's foot touched the service line, so the serve was a fault.
- She stood just behind the service line to serve.
