simpleMeaning: A family of English kings ruled from thirteen ninety-nine to fourteen sixty-one, and a
  red rose was their mark.
scope: Also called Lancaster and the Lancastrian line, this is a family of English kings who ruled from
  thirteen ninety-nine to fourteen sixty-one, not another royal family.
examples:
- The House of Lancaster ruled England for many years.
- A red rose was the mark of the House of Lancaster.
