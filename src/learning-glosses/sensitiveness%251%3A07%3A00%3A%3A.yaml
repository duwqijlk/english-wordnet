senseId: 'sensitiveness%1:07:00::'
synsetId: 05026827-n
simpleMeaning: Being able to feel what touches the body, and to tell apart very small amounts or changes
  in them.
scope: Also called sensitivity, the power to feel what acts on the body and to tell apart very small amounts
  or changes, not the body's general responsiveness to things outside it, not the power to feel changes
  in how people treat one another, and not feeling for the emotions of oneself and others.
examples:
- The sensitiveness of the instrument let it pick up the smallest change in current.
- The sensitiveness of Mimosa leaves does not depend on a change of growth.
