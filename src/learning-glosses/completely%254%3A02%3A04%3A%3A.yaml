senseId: 'completely%4:02:04::'
synsetId: 00008423-r
simpleMeaning: in every way, with no part left out.
scope: This means the whole of something is affected; it is not the other adverb sense, which means having
  all the parts that are needed.
examples:
- The old bridge was completely destroyed by the flood.
- I completely forgot about the meeting.
