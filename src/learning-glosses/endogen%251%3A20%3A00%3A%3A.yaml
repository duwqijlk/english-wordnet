simpleMeaning: A flowering plant with one seed leaf, whose stem grows by new stuff laid down on its inside.
scope: 'Also called a liliopsid, a monocot and a monocotyledon: a flowering plant with one seed leaf whose
  stem grows from the inside, not a plant with two seed leaves and not a tree that grows new wood on the
  outside.'
examples:
- The endogen grows by adding new stuff inside its stem.
- An endogen has only one seed leaf when it sprouts.
