simpleMeaning: Springing back into shape quickly after being pressed or stretched.
scope: This is the springiness sense used of rubber and balls, not the performed-in-person, force-bearing,
  possessing-life, echoing, explosive, energetic, ready-for-use, currently-relevant, electrically-charged
  or erupting adjectives, not the adverb meaning unrecorded, and not the seven verbs for residing, leading
  a life, surviving, earning a living, being alive, learning something firsthand or enjoying a full existence.
examples:
- The rubber is still live, so the seal springs back as soon as the pressure drops.
- A live tennis ball bounces higher off the strings than a dead one.
