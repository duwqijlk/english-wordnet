simpleMeaning: This is the money a company raises by selling shares that give the buyers a share of ownership
  in it.
scope: It is ownership money a company raises, not a part of a gun or an expression worn out by overuse.
examples:
- She bought stock in a small technology company.
- The value of the company's stock rose after the announcement.
