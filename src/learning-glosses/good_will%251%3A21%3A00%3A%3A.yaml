simpleMeaning: Over and above the things a business owns, accounting counts the standing and trust it
  has earned as worth of its own.
scope: Also called goodwill, it is the worth a business's standing adds in accounting, over and above
  the worth of the things it owns.
examples:
- The good will of the old shop was worth more than its stock.
- Buyers paid for the good will of the firm as well as for its buildings.
