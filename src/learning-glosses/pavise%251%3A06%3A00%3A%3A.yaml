simpleMeaning: In the Middle Ages, a big heavy long shield that covered the whole body, first carried,
  then at times set up to stand on its own
scope: 'Also called a pavis: in the Middle Ages, a big heavy long shield that covered the whole body,
  not a small round shield and not a suit of armour.'
examples:
- The archer hid behind his pavise while he reloaded.
- A row of pavises stood along the castle wall.
