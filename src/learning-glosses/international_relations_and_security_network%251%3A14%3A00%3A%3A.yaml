simpleMeaning: That country's way of sharing information for the study of keeping safe, of peace and of
  fighting, and of how countries deal with one another.
scope: This word is for a way of sharing information about safety and peace, not for the studies themselves.
examples:
- The International Relations and Security Network shares new work on peace and conflict.
- She found the report through the International Relations and Security Network.
