simpleMeaning: Chemicals stored inside turn into a push that drives a current, and the change cannot be
  undone, so the power source cannot be charged up again.
scope: Galvanic cell and voltaic cell are other names for it, and the power source works once only, since
  it cannot be charged up again.
examples:
- The radio ran on a primary cell.
- When the primary cell ran out, we put in a new one.
