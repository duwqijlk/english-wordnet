simpleMeaning: eager feeling for a cause, so strong that it shows in all a person does
scope: 'Also called evangelical: eager feeling for a cause, so strong that it shows in all a person does,
  not a calm interest in a cause and not work to spread the Christian gospel.'
examples:
- His evangelistic zeal for clean water moved the whole town to act.
- Her evangelistic drive to save the old library won many helpers.
