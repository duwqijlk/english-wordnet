simpleMeaning: People once called this lowest back end of the brain the bulb; it runs on into the cord
  down the back.
scope: Another name for medulla and bulb, it is the lowest back part of the brain, joined to the cord
  down the back.
examples:
- The medulla oblongata joins the brain to the cord down the back.
- The medulla oblongata was once called the bulb.
