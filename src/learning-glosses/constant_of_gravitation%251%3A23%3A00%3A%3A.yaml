simpleMeaning: In physics, a fixed number, the same everywhere, that links the pull between two things
  with their weight and how far apart they are, in Newton's law about that pull
scope: In physics, a fixed number linking pull, weight, and distance, also called the gravitational constant
  and the universal gravitational constant, not the pull itself and not a number that changes.
examples:
- The constant of gravitation appears in Newton's law.
- Physicists measure the constant of gravitation with great care.
