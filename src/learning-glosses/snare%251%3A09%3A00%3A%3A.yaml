simpleMeaning: Something, often a pleasant-looking thing, that hides a danger and takes you by surprise
  before you know it.
scope: 'Also called a trap: a thing, often pleasant-looking, that catches you by surprise, not a trap
  for birds, not the strings on a drum, not the drum itself, and not the surgeon''s wire loop.'
examples:
- The exam was full of snares for the careless student.
- It was all a snare and delusion, and he saw it too late.
