simpleMeaning: A plain word form thought to be the shared start from which linked words in several languages
  grew by the natural changes in language
scope: A plain word form thought to be the shared start of linked words; root is another name for this
  sense, not a word as used today and not a list of word meanings.
examples:
- The etymon of 'mother' is shared by many languages.
- Linguists trace the word back to its etymon.
