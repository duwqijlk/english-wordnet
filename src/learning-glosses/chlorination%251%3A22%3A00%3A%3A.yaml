simpleMeaning: the act of adding chlorine to stuff made with carbon, or of putting chlorine in place of
  part of it
scope: The act of adding chlorine to carbon-based stuff, or swapping part of it for chlorine, not the
  cleaning of water with chlorine.
examples:
- Chlorination adds chlorine to the compound.
- The chemist used chlorination to put chlorine into the new compound.
