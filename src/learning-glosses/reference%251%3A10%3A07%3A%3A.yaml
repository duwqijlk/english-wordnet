simpleMeaning: A publication, or a passage from one, that a writer points to as a source.
scope: This is a cited source, not a fact book you keep for consultation, and not the act of looking something
  up.
examples:
- The paper ends with a long list of references.
- Every claim in the essay is backed by a reference to a published study.
