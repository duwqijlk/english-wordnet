senseId: 'plodder%1:18:02::'
synsetId: 10751505-n
simpleMeaning: A person who walks in a slow heavy way, as if each step takes hard work
scope: This is a person who walks slowly and heavily, not someone who walks fast and not someone who is
  slow at work.
examples:
- The old plodder made his way up the hill step by step.
- The plodder took a long time to walk home, lifting each foot with effort.
