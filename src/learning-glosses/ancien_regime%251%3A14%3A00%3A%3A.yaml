simpleMeaning: A political and social system that no longer rules, above all the one in France before
  the French Revolution.
scope: A political and social system that no longer rules, above all the one in France before the French
  Revolution, not the present system of France and not a system of one ruler alone.
examples:
- The ancien regime fell before the French Revolution.
- Under the ancien regime, few people had a say in rule.
