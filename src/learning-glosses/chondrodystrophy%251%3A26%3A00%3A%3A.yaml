senseId: 'chondrodystrophy%1:26:00::'
synsetId: 14145286-n
simpleMeaning: Soft gristle turns to hard bone, so the person stays very short, in a sickness of the bones
  passed down in the family that starts before birth.
scope: Also called achondroplasia, achondroplasty and osteosclerosis congenita, it is a bone sickness
  beginning before birth in which gristle turns to bone and growth stays short.
examples:
- The child with chondrodystrophy stayed very short.
- Chondrodystrophy begins before birth.
