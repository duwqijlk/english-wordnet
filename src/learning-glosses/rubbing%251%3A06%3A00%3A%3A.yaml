simpleMeaning: A copy of a design on a hard thing, made by putting paper over it and moving charcoal back
  and forth over the paper
scope: This is a picture made this way, not a drawing made by hand and not a print made with ink.
examples:
- She made a rubbing of the old stone carving by laying paper over it and working charcoal across the
  top.
- The museum keeps a rubbing of the brass plate, made the same way with paper and charcoal.
