simpleMeaning: A colouring that sticks fast to threads such as cotton or rayon, and the like, made from
  plant matter.
scope: Also called a substantive dye, this colouring sticks fast to threads such as cotton or rayon, and
  the like, made from plant matter.
examples:
- The mill used a direct dye to colour the cotton cloth.
- A direct dye stays in rayon cloth even after washing.
