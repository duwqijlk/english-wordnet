simpleMeaning: a number that shows how much bigger one person's bet is than another person's bet, in betting
scope: In betting, a number comparing the size of two bets, not how likely a thing is to happen.
examples:
- He offered odds of two to one on the horse.
- The odds were three to one against the weaker team.
