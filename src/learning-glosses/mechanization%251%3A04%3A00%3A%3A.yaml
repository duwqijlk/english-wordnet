simpleMeaning: the act of putting in place the control of equipment by machines, using advanced technology,
  usually with electronic parts
scope: 'Also called automation, and also called mechanisation: putting equipment under machine control
  with advanced technology, usually using electronic parts. It is not work done by people by hand, and
  it is not one machine on its own.'
examples:
- Mechanization has changed how cars are made in this factory.
- The farm's mechanization let one worker do the work of ten.
