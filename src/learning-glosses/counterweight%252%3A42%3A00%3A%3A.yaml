senseId: 'counterweight%2:42:00::'
synsetId: 02672750-v
simpleMeaning: to act as a weight on one side that balances a weight on the other side
scope: This is acting as a balancing weight, not the heavy thing itself that is put on one side to balance
  the other.
examples:
- These stones counterweight the heavy gate and keep it balanced.
- An extra load on this side counterweights the load on the other side.
