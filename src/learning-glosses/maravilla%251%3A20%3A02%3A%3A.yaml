simpleMeaning: A wildflower with strong, deep pink, tube-shaped, evening-opening flowers, found in sandy
  and dry land from southern California to southern Colorado and into Mexico.
scope: This sense is also called desert four o'clock, for a wildflower with strong, deep pink, tube-shaped,
  evening-opening flowers, found in sandy and dry land from southern California to southern Colorado and
  into Mexico, unlike the sense for a leafy wild bloom with sweet-smelling, slim, white or pale pink trumpet
  flowers, of the south-western United States and north Mexico.
examples:
- Maravilla opens in the evening.
- Maravilla grows in sandy deserts.
