simpleMeaning: A low herb that lives for many years and smells strongly, from southern Europe to Great
  Britain, now growing wild in the United States.
scope: This is a low strong-smelling herb that lives many years, from southern Europe to Great Britain
  and now wild in the United States; field balm, lesser calamint, Calamintha nepeta glantulosa, Satureja
  calamintha glandulosa and Satureja nepeta are other names for it, not other strong-smelling herbs of
  other lands.
examples:
- Calamintha nepeta grew low along the dry stone wall.
- We crushed Calamintha nepeta leaves for their strong scent.
