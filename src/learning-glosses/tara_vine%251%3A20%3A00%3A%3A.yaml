simpleMeaning: a climbing vine from Asia with long leaves whose edges are finely toothed, and clusters
  of white flowers that give way to greenish-yellow fruit you can eat
scope: 'Also called bower actinidia: a climbing Asian vine with white flowers and edible fruit, not a
  tree and not a low bush.'
examples:
- The tara vine climbs over the fence, its white flowers opening in summer.
- We picked the greenish-yellow fruit of the tara vine and ate it raw.
