simpleMeaning: a machine used in a kitchen to cook food in a deep pan of hot oil; its size is set by what
  it is meant to be used for
scope: 'Also called a fryer, a deep fryer, a deep fat fryer, or a fryolator: a kitchen machine for cooking
  food in hot oil, not a shallow pan and not a young chicken.'
examples:
- She put the chips in the frier and waited for them to turn crisp.
- Our frier is too small for a whole fish, so we use a bigger one.
