senseId: 'irresoluteness%1:07:00::'
synsetId: 04873696-n
simpleMeaning: A person keeps changing their mind and never settles on what to do
scope: The habit of not being able to settle on a choice, also called irresolution; not simple doubt about
  one fact and not carelessness about what happens.
examples:
- His irresoluteness kept the whole team waiting for a decision.
- Her irresoluteness showed every time she changed her plans.
