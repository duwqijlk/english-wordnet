simpleMeaning: parts in the lining of the neck of the womb that make mucus
scope: Parts in the lining of the neck of the womb that make mucus; cervical glands of the uterus and
  glandulae cervicales uteri are other names for this sense, not the womb itself and not glands elsewhere
  in the body.
examples:
- The cervical glands make mucus in the neck of the womb.
- The cervical glands sit in the lining of the neck of the womb.
