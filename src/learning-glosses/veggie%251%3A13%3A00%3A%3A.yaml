simpleMeaning: the parts of a plant with soft stems that people can eat, such as its seeds, roots, stems,
  leaves, bulbs, tubers, and fruits that are not sweet
scope: The parts of a soft-stemmed plant that people can eat, such as seeds, roots, stems, leaves, bulbs,
  tubers, and fruits that are not sweet; vegetable is another name for this, not a sweet fruit and not
  meat.
examples:
- Carrots and beans are veggies we eat every day.
- She grows her own veggies in the garden.
