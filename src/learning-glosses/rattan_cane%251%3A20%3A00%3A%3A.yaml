simpleMeaning: Woven work, seats, chairs, and walking sticks are made from the long stems of climbing
  palms of the palm group Calamus and their kin.
scope: Also called rattan, it is the long stem of a climbing palm, used to make woven work, seats, chairs,
  and walking sticks.
examples:
- He wove the chair seat from rattan cane.
- They cut lengths of rattan cane for the new chairs.
