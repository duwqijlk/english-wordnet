simpleMeaning: a long pole that sticks out sideways on a boat, holding the lower edge of a sail, or used
  to move goods or tie up
scope: A long pole sticking out sideways on a boat, not a pole holding a microphone and not a loud sound.
examples:
- The boom swung across the deck as the wind changed.
- They used the boom to lift the crates onto the ship.
