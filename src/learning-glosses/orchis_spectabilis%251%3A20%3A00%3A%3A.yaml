simpleMeaning: A North American orchid with a spike of violet-purple flowers mixed with white; the flower
  parts form a hood.
scope: Also called purple-hooded orchis, purple orchis and showy orchis, it names the North American orchid
  with a spike of violet-purple flowers mixed with white whose flower parts form a hood.
examples:
- Orchis spectabilis bloomed in the damp wood with its violet-purple flowers.
- Orchis spectabilis grew in the shade with a spike of purple and white flowers.
