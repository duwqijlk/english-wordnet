simpleMeaning: a unit of energy that can change atoms (the smallest parts of things) and is taken in by
  material, equal to 100 ergs (small units of energy) for each gram
scope: A unit for measuring energy taken in by something, not the energy itself and not a unit for measuring
  angles.
examples:
- The dose was five rads for each gram of the material.
- One rad is equal to 100 ergs for each gram.
