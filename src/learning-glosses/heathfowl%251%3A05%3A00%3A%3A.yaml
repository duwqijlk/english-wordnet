simpleMeaning: A big grouse (a game bird) of northern Europe, black, with a tail shaped like a lyre.
scope: A big black grouse of northern Europe with a tail shaped like a lyre, not a red grouse and not
  any brown grouse of the moors.
examples:
- The heathfowl spread its lyre-shaped tail on the lek.
- A black heathfowl stood out against the green moor.
