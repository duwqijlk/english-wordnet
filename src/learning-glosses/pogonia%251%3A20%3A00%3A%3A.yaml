senseId: 'pogonia%1:20:00::'
synsetId: 12100464-n
simpleMeaning: A hardy bog orchid that grows in soil, with slender rootstocks and upright stems carrying
  one or a few leaves and a single flower at the tip.
scope: This is a small ground-growing orchid with a lone flower at the top of each stem, not a tropical
  orchid that lives on tree bark.
examples:
- One pogonia stood at the edge of the bog, its pale flower just opening.
- We found pogonia among the moss, each stem bearing a single small bloom.
