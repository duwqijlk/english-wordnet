simpleMeaning: The person or group sued or accused in a court of law, who must answer the claim or charge
  against them.
scope: 'Also called a suspect: the person or group who must answer a claim or charge in court, not the
  person who brings the case.'
examples:
- The defendant took the stand to answer the charge.
- Both defendants denied the claims made against them.
