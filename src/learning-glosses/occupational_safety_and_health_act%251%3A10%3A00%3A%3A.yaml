simpleMeaning: To keep workers from being hurt or falling sick at work, the United States Congress made
  a law that set up a body to look after them.
scope: Also called federal job safety law, this is the law the United States Congress passed to set up
  a body that keeps workers from being hurt or falling sick at work.
examples:
- Employers must follow the occupational safety and health act.
- The occupational safety and health act protects workers from harm at work.
