simpleMeaning: any of a group of rough weedy plants with long main roots, at times eaten as green leaves
  or used as a home cure
scope: Any of a group of rough weedy plants with long main roots, at times eaten as green leaves or used
  as a home cure, also called dock and sorrel; not lawn grass, and not a garden herb.
examples:
- Sour grass grows along the edge of the field.
- Grandmother used sour grass in a home cure for a sore throat.
