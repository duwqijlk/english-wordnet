simpleMeaning: Having a fear of dirt (mysophobia) that makes a person afraid of dirt or of things that
  could make them dirty far beyond what is normal.
scope: Afraid of dirt or of things that could make them dirty far beyond what is normal, not simply careful
  about dirt and not afraid of open spaces.
examples:
- He is mysophobic and washes his hands all day.
- Her mysophobic fear of dirt kept her from the garden.
