simpleMeaning: In cooking, add a food ingredient to a mixture by turning it over again and again, not
  stirring or beating it.
scope: This is the cooking action of mixing an ingredient by turning it over, not bending something so
  one part covers another and not enclosing sheep in a pen.
examples:
- Fold the egg whites into the batter with a slow, light motion.
- She folded the cream into the soup just before serving.
