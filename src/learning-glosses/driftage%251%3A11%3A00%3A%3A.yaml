simpleMeaning: how far a ship or plane moves off the path it meant to take, carried away by wind or water
scope: The way a ship or plane moves off the path it meant to take, not the act of moving slowly on its
  own.
examples:
- The driftage put the ship miles from its planned course.
- Strong winds caused driftage that pushed the plane off its route.
