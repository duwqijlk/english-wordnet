simpleMeaning: not able to be beaten, argued against, or shown to be wrong
scope: 'Also called inexpugnable: not able to be beaten or proved wrong, not the sense of being safe from
  attack or harm.'
examples:
- His argument was impregnable, and no one could find a fault in it.
- She spoke with impregnable confidence that no question could shake.
