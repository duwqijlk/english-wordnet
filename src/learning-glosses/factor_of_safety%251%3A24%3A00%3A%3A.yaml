simpleMeaning: a number got by dividing the force that breaks a structure by the greatest force it is
  expected to bear in normal use
scope: A number that shows how much stronger a structure is than it needs to be in normal use, not the
  force that breaks it and not the force it bears day to day.
examples:
- The engineer checked the factor of safety before approving the bridge design.
- A factor of safety of two means the beam can bear twice the greatest expected load.
