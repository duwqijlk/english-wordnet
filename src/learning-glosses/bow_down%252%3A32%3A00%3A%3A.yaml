simpleMeaning: to bend the body low at the knee or waist, or to drop the head low
scope: 'Also called bow: to bend the body low at the knee or waist, or to drop the head low, not to sit
  down and not to lie flat on the ground.'
examples:
- The courtiers bowed down before the king.
- She bowed down her head in shame.
