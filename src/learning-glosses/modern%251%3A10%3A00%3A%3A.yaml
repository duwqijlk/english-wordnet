simpleMeaning: a style of printed letters with very thin end lines and heavy upright strokes, based on
  an old Italian design.
scope: This is not the adjective meaning 'of the present time'; here it names a particular style of printed
  letters.
examples:
- Bodoni's modern is still used for fashion magazines.
- The title page was set in a modern with very fine serifs.
