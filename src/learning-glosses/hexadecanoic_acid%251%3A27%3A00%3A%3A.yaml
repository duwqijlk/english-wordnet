simpleMeaning: A fat stuff with no double links between its parts, the main fat in meat and in milk foods.
scope: A fat stuff with no double links, the main fat in meat and milk foods; palmitic acid is another
  name for this sense, and this is not a fat with double links or a fat found mainly in plants.
examples:
- Hexadecanoic acid is the main fat found in butter and beef.
- The lab found hexadecanoic acid in the meat sample.
