simpleMeaning: a group of things put on one thin cord, or things in a line as if they were on one thin
  cord
scope: A group of things on one cord, or in a line as if on one, not one cord by itself and not a thing
  worn around the neck.
examples:
- She bought a string of small flags to hang across the room.
- A string of cars waited at the red light.
