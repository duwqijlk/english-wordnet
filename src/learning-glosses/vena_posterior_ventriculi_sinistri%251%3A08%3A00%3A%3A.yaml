simpleMeaning: a blood tube that starts near the pointed tip of the heart and empties into the big tube
  that takes blood from the heart muscle
scope: Also called the posterior vein of the left ventricle, it is a blood tube that starts near the tip
  of the heart, not the blood tube that runs on the back wall of the heart's left upper room.
examples:
- The vena posterior ventriculi sinistri begins near the apex of the heart.
- Doctors traced the vena posterior ventriculi sinistri from the tip of the heart to the coronary sinus.
