simpleMeaning: An angry sound of disapproval or scorn, such as a jeer from a crowd.
scope: This is the jeering noise a crowd makes, not the feathered animal or the shuttlecock used in badminton.
examples:
- The crowd gave the referee the bird after the final whistle.
- He was given the bird by hecklers at the back of the hall.
