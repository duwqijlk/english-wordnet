simpleMeaning: A slope made by people rises steeply in front of a fort
scope: 'Also called scarp, escarpment and protective embankment: a slope made by people that rises steeply
  in front of a fort, not a natural slope and not the fort itself.'
examples:
- The escarp rose steeply before the walls of the fort.
- Attackers had to climb the escarp to reach the gate.
