schema: oewn-learning-gloss-v2
senseId: 'grapnel%1:06:01::'
synsetId: 03459155-n
simpleMeaning: a tool made of several hooks for catching hold of things and keeping hold of them; it is
  often thrown with a rope tied to it
scope: A hook tool for catching and holding things, also called grapple, grappler, grappling hook and
  grappling iron; not a plain rope and not a single small fishing hook.
examples:
- He threw the grapnel over the wall and pulled the rope tight.
- The sailors used a grapnel to catch hold of the lost boat.
