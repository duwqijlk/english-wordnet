simpleMeaning: the act of taking part in an athletic race on foot on a track
scope: This sense is the sport of racing on foot, not a machine that is working and not an action carried
  out while moving quickly.
examples:
- He took up competitive running at school and now races over 400 metres.
- Track running puts far more strain on the legs than road racing.
