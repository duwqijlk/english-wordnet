simpleMeaning: in physics, a thermodynamic measure of how much work a system is able to do, expressed
  in joules or ergs
scope: This is not physical vigor, personal drive, liveliness of style, or a source of usable power, but
  a quantity in physics measured in joules or ergs.
examples:
- The ball's kinetic energy increases as it falls.
- Engineers measured the energy released by the reaction in joules.
