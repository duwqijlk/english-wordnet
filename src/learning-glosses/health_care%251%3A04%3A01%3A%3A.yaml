simpleMeaning: Keeping mind and body well by stopping illness before it starts or treating it, through
  work by doctors, nurses, and others who look after sick people.
scope: The keeping of mind and body well by stopping or treating illness, also called healthcare; not
  treatment of one sickness alone and not a single visit to a doctor.
examples:
- Good health care starts with stopping illness before it begins.
- The country spends a lot on health care for its people.
