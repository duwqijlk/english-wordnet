simpleMeaning: The largest hare of the northern plains and western mountains of America is brownish grey
  in summer, pale grey in winter, its rear end nearly always pale all over.
scope: Also called white-tailed jackrabbit, this is the largest hare of the northern plains and western
  mountains of the United States, brownish grey in summer and pale grey in winter, with a rear end nearly
  always pale all over.
examples:
- A whitetail jackrabbit crossed the northern plain.
- In winter the whitetail jackrabbit was pale grey.
