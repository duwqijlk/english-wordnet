simpleMeaning: a form of talking treatment worked out by Carl Rogers, in which the person seeking help
  sets what is talked about and how fast the work goes in each session
scope: A form of talking treatment in which the person seeking help sets what is talked about and how
  fast the work goes in each session; not treatment in which the doctor leads and not treatment with drugs.
examples:
- In client-centered therapy the client leads each session.
- She trained in client-centered therapy after reading Carl Rogers.
