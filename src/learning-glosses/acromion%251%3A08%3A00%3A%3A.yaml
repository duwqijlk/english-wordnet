simpleMeaning: the bony point at the outer end of the ridge across the top of the shoulder blade
scope: This is the bony point at the outer end of the ridge on the shoulder blade; acromial process is
  another name for it, not the tip of the arm bone and not the whole shoulder blade.
examples:
- The acromion is the bony point at the top of the shoulder.
- The doctor pressed the acromion to find the sore spot.
