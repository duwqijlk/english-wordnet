simpleMeaning: any of several large trees that lose their leaves, with broad rounded crowns, smooth grey
  bark and small sweet three-cornered nuts in spiky cases, native to northern temperate regions
scope: This is the living tree; beech tree is another name for it, while the wood cut from it is a separate
  sense.
examples:
- The old beech spread its rounded crown over the lawn.
- Beech trees drop small sweet triangular nuts in autumn.
