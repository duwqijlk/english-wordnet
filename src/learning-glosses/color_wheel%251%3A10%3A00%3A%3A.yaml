senseId: 'color_wheel%1:10:00::'
synsetId: 07014335-n
simpleMeaning: a chart in which hues that are opposites, or their names, sit on opposite sides of a ring
scope: A chart that puts opposite hues across from each other; color circle is another name for this sense;
  not a chart of one hue, and not a wheel that turns.
examples:
- The teacher drew a color wheel on the board.
- A color wheel helps painters pick hues that go well together.
