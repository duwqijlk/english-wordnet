simpleMeaning: The act of choosing one thing rather than another because you like it more
scope: The act of choosing one thing rather than another because you like it more; not a rise to a higher
  post, and not a choice made by chance.
examples:
- The preferment went to the younger candidate.
- Her preferment of tea over coffee was well known.
