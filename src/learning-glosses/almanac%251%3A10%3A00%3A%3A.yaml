simpleMeaning: A book that comes out once a year, giving facts in tables for a certain field or fields,
  set out in the order of the days of the year
scope: This is the yearly book of facts set out in lists for a set field or fields. It is not the yearly
  book of weather forecasts and mixed general facts.
examples:
- The farmers' almanac lists planting dates for the whole year.
- She checked the sports almanac for the year's results, set out month by month.
