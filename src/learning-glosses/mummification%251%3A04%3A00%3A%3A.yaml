simpleMeaning: A dead body becomes a mummy when it is treated to keep it from decay, dried and wrapped
scope: The making of a mummy from a dead body, not the rotting of dead flesh in disease and not the burial
  of a body in the ground.
examples:
- Mummification took many weeks in ancient Egypt.
- The priests used mummification to keep the king's body whole.
