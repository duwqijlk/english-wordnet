simpleMeaning: About 18 million kilometres is how far the rays that make things seen go in sixty seconds
  in empty space
scope: The distance the rays that make things seen go in sixty seconds, not the distance they go in one
  second and not a way to measure such rays.
examples:
- A light minute is about 18 million kilometres, a huge distance for such a short time.
- The star is many light minutes away from us.
