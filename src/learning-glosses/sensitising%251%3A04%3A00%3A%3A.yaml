simpleMeaning: making a living thing react to a serum, the liquid part of blood, by giving it a set of
  shots
scope: This is making a living thing react to a serum through a set of shots, also called sensitisation,
  sensitization and sensitizing; not a single shot, and not making it react to a drug.
examples:
- The doctor began sensitising the patient with a series of injections.
- Sensitising the animal took several weeks of shots.
