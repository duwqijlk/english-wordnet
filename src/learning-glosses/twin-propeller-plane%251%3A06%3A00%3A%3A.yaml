simpleMeaning: A flying machine with one engine that turns two spinning blades in opposite ways, to keep
  it steady.
scope: This is a flying machine with one engine that turns two spinning blades in opposite ways, also
  called double-prop, double-propeller plane and twin-prop; not a jet and not a machine with one blade.
examples:
- The twin-propeller-plane flew over the island.
- A twin-propeller-plane landed on the short runway.
