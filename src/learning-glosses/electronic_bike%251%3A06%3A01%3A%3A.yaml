simpleMeaning: Pedals or a small built-in motor move this two-wheeled ride, and the rider can switch between
  them
scope: This ride, also called electronic bicycle, has two wheels and a built-in motor, and runs by motor
  power or by pedalling.
examples:
- My electronic bike got me up the hill on its motor.
- She charges her electronic bike overnight and rides it to work.
