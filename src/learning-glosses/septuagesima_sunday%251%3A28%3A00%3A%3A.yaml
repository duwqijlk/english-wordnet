simpleMeaning: The Lord's Day that comes nine weeks before Easter and three weeks before the first Lord's
  Day of Lent.
scope: Septuagesima is another name for this sense, the Lord's Day nine weeks before Easter; not Sexagesima
  or Quinquagesima, the Lord's Days nearer Lent, and not the first Lord's Day of Lent.
examples:
- Septuagesima Sunday falls three Sundays before Lent.
- The choir sang at Septuagesima Sunday, the ninth Sunday before Easter.
