simpleMeaning: With sweet-smelling purple blooms and silver-white seed pods, thin as paper, flat and round,
  this southeast Europe plant gives pods to set about the house when dried
scope: A southeast European plant grown for purple flowers and silver-white seed pods, not a plant grown
  for food; honesty, money plant, satin flower and silver dollar are other names for this sense.
examples:
- Satinpod blooms purple in the spring garden.
- We hung satinpod seed cases indoors for winter colour.
