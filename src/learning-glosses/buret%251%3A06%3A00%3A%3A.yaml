simpleMeaning: To measure liquid in a test that finds how much of a chemical it holds, this glass tube,
  marked with lines, has a tap at the bottom.
scope: Also called a burette, this is the glass tube marked with lines and fitted with a tap at the bottom,
  used to measure liquid in a test.
examples:
- She filled the buret with the clear liquid.
- He read the mark on the buret to see how much liquid had run out.
