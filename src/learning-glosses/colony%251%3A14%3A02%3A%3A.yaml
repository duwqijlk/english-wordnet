simpleMeaning: In microbiology, a group of living things that grow from one parent cell
scope: In microbiology, this is living things grown from one cell, not a group of people who settle far
  from home and not land ruled by a far away country.
examples:
- Scientists grew a colony from one parent cell in the lab.
- The colony grew on the dish from a single cell.
