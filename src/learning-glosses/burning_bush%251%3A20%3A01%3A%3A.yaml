simpleMeaning: a much-branched plant from Europe and Asia whose leaves turn purple-red in autumn
scope: A much-branched plant from Europe and Asia whose leaves turn purple-red in autumn, also called
  belvedere, fire-bush, fire bush and summer cypress, and not the bush of the Old Testament story or any
  other red-leaved shrub.
examples:
- The burning bush in the garden turned purple-red in autumn.
- We planted a burning bush by the fence.
