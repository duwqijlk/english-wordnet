simpleMeaning: the outer layer of gas around the sun, seen as a white ring of light when the moon covers
  the sun
scope: 'Also called aureole: the sun''s outer gas layer seen when the moon covers the sun, not a circle
  of light around a bright thing, not a cup-shaped plant part, and not an electrical discharge.'
examples:
- During the eclipse, the corona showed as a white ring around the sun.
- Astronomers took photos of the sun's corona when the moon covered the sun.
