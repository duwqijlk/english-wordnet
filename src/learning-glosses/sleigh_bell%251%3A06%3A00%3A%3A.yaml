simpleMeaning: A metal thing that rings, fixed to a snow sledge, or to the straps of a horse pulling one
scope: A metal thing that rings, fixed to a snow sledge or to the straps of a horse pulling one, also
  called cascabel; not a church bell and not a doorbell.
examples:
- The sleigh bell jingled as the horse trotted through the snow.
- Each sleigh bell on the harness rang with every step.
