simpleMeaning: made to lose patience or feel angry
scope: 'Also called annoyed, irritated, stung, pissed, steamed, riled, miffed, peeved and nettled: made
  cross and short of patience; it is not the sense about a liquid being stirred up and moving wildly.'
examples:
- He was roiled by the long delay at the airport.
- She felt roiled when her brother kept teasing her.
