simpleMeaning: A place to live on the water for fun, this big motor boat has a room to sleep in, pipes
  for water, and all needed for life on board
scope: Also called a cruiser, a cabin cruiser, or a pleasure boat, this is a big motor boat for fun on
  the water where people can sleep and live, not a small fishing boat and not a ship for carrying goods.
examples:
- They bought a pleasure craft with a cabin so they could spend summers on the lake.
- Our pleasure craft has pipes for water and a small kitchen on board.
