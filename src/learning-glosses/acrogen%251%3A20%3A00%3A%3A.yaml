simpleMeaning: Only the tip of its main stem grows on this plant, which has no flowers at all, like a
  fern or a moss.
scope: This is a flowerless plant that grows only at the tip of its main stem, not a plant that flowers
  and grows along its whole stem.
examples:
- The acrogen grows only at the tip of its main stem.
- An acrogen has no flowers, like a fern or a moss.
