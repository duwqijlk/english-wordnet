simpleMeaning: A thing or person so good at its kind that nothing matches it.
scope: A thing or person so good at its kind that nothing matches it, also called an ideal; other names
  for it are saint, paragon, and nonpareil.
examples:
- They called the new hall the apotheosis of grand building.
- The dish was the apotheosis of simple cooking.
