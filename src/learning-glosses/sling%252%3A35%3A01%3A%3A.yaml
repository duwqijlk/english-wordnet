simpleMeaning: to hold or carry something in a loop of cloth or strap that supports it
scope: To hold or carry something in a supporting loop of cloth or strap; not to throw something hard,
  and not to move goods with straps.
examples:
- His hurt arm was slinged so it would stay still.
- She slings the baby in a wide cloth against her chest.
