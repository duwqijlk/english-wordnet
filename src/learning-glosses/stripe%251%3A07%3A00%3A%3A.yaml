simpleMeaning: A thin line of a different colour or feel from what is round it
scope: Also called bar, and another name for this sense is streak; this is a line of colour or feel on
  a thing, not a badge of rank or a strip of cloth put on for show.
examples:
- The toad has black stripes down its back.
- A green stripe runs along the side of the car.
