simpleMeaning: to move by twisting and bending the body, especially when struggling
scope: 'Also called twist, worm, wrestle, wriggle and writhe: moving by twisting and bending the body,
  especially when struggling. Not just feeling uncomfortable or ashamed while sitting still.'
examples:
- The child squirmed in his chair as his aunt held him tight.
- The prisoner squirmed and tried to get free from the ropes.
