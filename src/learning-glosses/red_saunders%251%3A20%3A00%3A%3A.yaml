simpleMeaning: Fine furniture is made from the hard wood of a tree of India and the East Indies, a wood
  that smells sweet, and its deep-coloured inner wood dyes cloth
scope: 'Also called red sandalwood, red sanders, and red sanderswood: a tree of India and the East Indies
  whose hard wood is loved for fine furniture and whose inner wood dyes cloth.'
examples:
- Fine furniture was made from red saunders.
- She bought a small box of red saunders because the wood smelled sweet.
