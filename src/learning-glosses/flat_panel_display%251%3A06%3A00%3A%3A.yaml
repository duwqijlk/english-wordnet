simpleMeaning: A thin video screen with a level surface, often used in laptop computers.
scope: A thin video screen, often used in laptop computers; not a deep box screen, and not a picture thrown
  on a wall.
examples:
- The flat panel display on her laptop is thin and light.
- A flat panel display shows the picture clearly.
