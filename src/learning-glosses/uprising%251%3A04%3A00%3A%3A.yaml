simpleMeaning: A fight by a group that has joined together to stand against those in power and try to
  take control from them
scope: This is an organized fight against those in power, also called rising, rebellion, and revolt, not
  a single person's protest.
examples:
- The uprising began in the capital and spread to the towns.
- The uprising failed when the army moved in.
