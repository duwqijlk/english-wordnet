simpleMeaning: A philosopher who specializes in questions of right and wrong and the problems that go
  with them.
scope: A thinker who studies right and wrong, not a preacher and not a person who judges others.
examples:
- The moralist wrote a long book on the nature of duty.
- As a moralist, she asked whether the war could ever be just.
