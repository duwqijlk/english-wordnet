simpleMeaning: To take something away, whether it is a solid object or something abstract such as a threat.
scope: This is the general sense of taking something away, not tugging it with force and not drawing it
  out of a container.
examples:
- The crew pulled the old signs from the wall before repainting.
- The company pulled the product from shelves after the recall.
