simpleMeaning: To sing using sounds like do, re and mi to stand for the notes of the scale
scope: To sing using sounds like do, re and mi to stand for the notes of the scale; not to sing with words,
  and not to play the notes on an instrument.
examples:
- The voice teacher showed the students how to solmizate.
- Beginners solmizate the scale before they sing the words.
