simpleMeaning: A figure that leaves any number it joins unchanged.
scope: This sense is also called a zero, a nought, and a cipher, for a figure that leaves any number it
  joins unchanged, where a zero is a number that leaves any number it joins just as it was, unlike the
  sense for a thing of no weight or worth at all, and unlike the sense for finding a sum by doing the
  maths.
examples:
- The cypher leaves any number unchanged.
- Cyphers leave numbers just as they were.
