simpleMeaning: A machine tool with a rough stone or tape takes off only the thin glassy skin from the
  last step, so work comes out smooth and true to shape
scope: 'Also called microfinishing machine and superfinishing machine: a machine tool that smooths work
  by taking off a thin skin, not a machine that cuts a new shape.'
examples:
- The microhoning machine took off the thin skin left by the last step.
- They used the microhoning machine to smooth the metal part.
