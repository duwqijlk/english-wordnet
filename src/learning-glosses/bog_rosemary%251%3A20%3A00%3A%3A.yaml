simpleMeaning: An evergreen shrub with wiry stems and hanging clusters of white or pink flowers, growing
  in wet acid ground from the Arctic and Canada to the north-eastern United States.
scope: Another name for moorwort, the low evergreen shrub of wet acid ground; it is not the kitchen herb
  rosemary.
examples:
- Bog rosemary grows in wet, acid ground across Canada.
- In early summer, bog rosemary opens drooping clusters of pink flowers.
