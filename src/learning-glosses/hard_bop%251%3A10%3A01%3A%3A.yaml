simpleMeaning: A kind of music with a blues sound, played in an earthy way that leans on scales more than
  the jazz style it is linked to
scope: This kind of music has a blues sound and leans on scales, not the blues itself and not the jazz
  style it is linked to.
examples:
- Hard bop first developed in the mid-1950s, originating with the Jazz Messengers.
- The band played hard bop with its earthy blues sound all night.
