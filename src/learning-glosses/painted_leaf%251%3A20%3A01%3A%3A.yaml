simpleMeaning: Small yellow flowers sit inside showy tapering usually scarlet petal-like parts on this
  plant of warm America, whose sap is poisonous.
scope: A plant of warm America with small yellow flowers ringed by showy scarlet petal-like parts; poinsettia
  and lobster plant are other names for this sense, not the poinsettia of the United States and eastern
  Mexico.
examples:
- The painted leaf has small yellow flowers ringed by scarlet parts.
- Do not touch the painted leaf, as its sap is poisonous.
