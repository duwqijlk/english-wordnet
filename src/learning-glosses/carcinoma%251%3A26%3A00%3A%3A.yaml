simpleMeaning: A bad growth that comes from the thin skin-like tissue covering the body and its parts,
  one of the four main kinds of cancer.
scope: A bad growth from the thin skin-like tissue, one of the four main kinds of cancer, not a harmless
  lump and not a cancer of the blood.
examples:
- The doctors found a carcinoma in her lung.
- A carcinoma grows from the thin tissue that lines the body.
