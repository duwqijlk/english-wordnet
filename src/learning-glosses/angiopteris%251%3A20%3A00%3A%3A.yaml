simpleMeaning: Leaves that differ a great deal from plant to plant mark this very large old fern of the
  wet warm lands round the Pacific.
scope: Also called giant fern, this very large old fern grows in the wet warm lands round the Pacific.
examples:
- Angiopteris grew in the wet warm lands round the Pacific, its leaves unlike those of the next plant.
- The angiopteris had leaves of many shapes, one plant unlike the next.
