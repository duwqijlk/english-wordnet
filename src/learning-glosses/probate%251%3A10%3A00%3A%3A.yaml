simpleMeaning: a court paper saying a will is real, giving the people named in the will to do this work
  (the executors) power to deal with what a dead person left
scope: This court paper, also called probate will, says a will is real; it is not the act of proving a
  will is real and not a court letting a person stay free after a crime.
examples:
- She kept the probate in a safe place with the will.
- The lawyer showed them the probate as proof that the will was real.
