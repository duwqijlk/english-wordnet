simpleMeaning: On a TV screen or a computer screen, this is what a machine shows after taking in signals
scope: 'Also called a monitor: what a machine shows on a TV screen or a computer screen, not the machine
  itself and not a printed picture.'
examples:
- The monitoring device showed the heartbeat as a line on the screen.
- Signals from the sensor appeared as pictures on the monitoring device.
