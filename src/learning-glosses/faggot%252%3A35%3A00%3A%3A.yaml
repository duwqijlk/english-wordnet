simpleMeaning: to tie sticks or other things together tightly, as if making a bundle of sticks
scope: To tie things into a bundle like sticks, not the bundle of sticks itself, not joining cloth with
  a stitch, and not fastening iron rods to heat them.
examples:
- He faggoted the dry sticks together before carrying them to the fire.
- She faggoted the branches into a tight bundle to carry home.
