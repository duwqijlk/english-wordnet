senseId: 'daisy-chain%2:35:00::'
synsetId: 01357979-v
simpleMeaning: to join pieces of equipment in a line so each one links to the next, on part of a chip
  or a board with wires inside a computer
scope: To link pieces of equipment in a line inside a computer, not to string flowers together and not
  to join things in any other way.
examples:
- The technician daisy-chained three drives to one port on the board.
- We daisy-chained the screens so each one passed the signal to the next.
