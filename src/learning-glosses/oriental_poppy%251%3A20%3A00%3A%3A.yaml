simpleMeaning: People commonly grow this Asian poppy, which lives for years; it has bright scarlet or
  pink to orange blooms and stiff, very hairy leaves.
scope: The garden poppy with stiff hairy leaves and big scarlet or pink blooms, not the wild field poppy
  or the opium poppy.
examples:
- Oriental poppies open their big scarlet flowers in early summer.
- The oriental poppy dies back after flowering and returns the following spring.
