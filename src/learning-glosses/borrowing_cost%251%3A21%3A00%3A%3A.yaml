simpleMeaning: what you must pay for the use of money or a thing that is not yours
scope: What you must pay for the use of money or a thing that is not yours, not the price of the thing
  itself and not a fine for late return.
examples:
- The borrowing cost of the loan was higher than they had hoped.
- Firms watch the borrowing cost when they take on debt.
