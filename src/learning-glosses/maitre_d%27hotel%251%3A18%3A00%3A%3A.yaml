simpleMeaning: The waiters take their orders from this person, who runs the dining room and shows guests
  to their seats
scope: Also called captain, headwaiter and maitre d', this is the person who runs the dining room, not
  one of the waiters and not the chef.
examples:
- The maitre d'hotel greeted the guests at the door.
- The maitre d'hotel told the waiter to clear the table.
