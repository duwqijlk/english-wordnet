simpleMeaning: fit to be held at fault because what was done was wrong, bad, or harmful
scope: 'Also called blameable, blameful, blameworthy, censurable, and culpable: fit to be held at fault
  for a wrong act, not innocent and not a small slip.'
examples:
- His blamable neglect of the safety checks put others at risk.
- The judge called the blamable act a breach of trust.
