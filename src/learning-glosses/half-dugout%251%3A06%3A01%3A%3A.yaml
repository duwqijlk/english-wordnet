senseId: 'half-dugout%1:06:01::'
synsetId: 92459623-n
simpleMeaning: a simple shelter, often put up for a short time, with much of it dug down into the ground,
  and walls and a roof usually made of cut turf
scope: A simple shelter dug partly into the ground with turf walls and roof, not a tent and not a log
  cabin.
examples:
- The family spent the winter in a half-dugout with turf walls.
- A half-dugout keeps out the wind because much of it lies below ground.
