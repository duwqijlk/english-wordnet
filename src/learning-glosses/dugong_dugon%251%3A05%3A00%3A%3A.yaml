simpleMeaning: A tusked sea cow found from eastern Africa to Australia, with a flat tail split into two
  lobes.
scope: A tusked sea cow of warm seas, also called the dugong; not a whale and not a seal.
examples:
- A Dugong dugon grazed on sea grass in the warm bay.
- The Dugong dugon has a flat tail split into two lobes.
