simpleMeaning: Any of several wild pea-like plants grown to feed farm animals.
scope: Any of several wild pea-like plants grown to feed farm animals, not the empty container used in
  chemical work as a counterweight for the container holding chemicals, not the grass weed that lives
  for one year, often found in grain fields and other farmed land, with seeds sometimes thought to be
  poison, not the weight of a motor vehicle, railroad car, or aircraft without its fuel or cargo, and
  not the adjustment made for the weight of packaging when working out the net weight of goods.
examples:
- The farmer sowed tare in the lower field for the cattle.
- Tare grew thick among the beans, cut for winter feed.
