simpleMeaning: a solid shape with twenty flat sides, each one a triangle with all sides the same length
scope: A solid shape with twenty equal triangle sides, not a cube with six square sides and not a flat
  shape with twenty sides.
examples:
- A regular icosahedron has twenty faces, each one a triangle.
- We built a regular icosahedron from paper and counted its twenty sides.
