senseId: 'concenter%2:31:00::'
synsetId: 00733774-v
simpleMeaning: to bring thoughts or feelings together into one clear point, so that they line up and meet
scope: To bring thoughts or feelings together into one clear point, and concentre, focalise, focalize
  and focus are other names for this sense, not to spread thoughts out and not to look at one thing with
  the eyes.
examples:
- She tried to concenter her thoughts on the problem.
- He paused to concenter his feelings before he spoke.
