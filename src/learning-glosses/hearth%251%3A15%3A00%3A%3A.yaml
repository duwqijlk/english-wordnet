simpleMeaning: the area on the floor close to a fireplace, usually made of hard material and reaching
  out into the room
scope: The floor area in front of a fireplace, not the fireplace itself and not the fire in it.
examples:
- They sat on the hearth and warmed themselves before the fire.
- She swept ash off the hearth in front of the fireplace.
