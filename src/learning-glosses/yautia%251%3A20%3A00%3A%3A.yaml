simpleMeaning: The thick parts below ground of this warm American plant of the aroid kind are food, cooked
  and eaten in the way people cook yams or potatoes.
scope: 'Also called malanga, spoonflower, and tannia: a food plant of warm America, not a yam and not
  a potato.'
examples:
- She boiled the yautia and served it.
- The yautia we dug up went into the pot with the yams.
