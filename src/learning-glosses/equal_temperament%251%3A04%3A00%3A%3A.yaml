simpleMeaning: A way of tuning in which the octave is split into twelve half-steps of just the same size
scope: A way of tuning so every half-step is the same size; not tuning by pure fifths, and not a scale
  with uneven steps.
examples:
- Equal temperament lets a piano play in tune in every key.
- Most keyboard instruments today use equal temperament.
