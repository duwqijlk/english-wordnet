simpleMeaning: to take part in violent trouble in public and break the peace of a place
scope: This is the verb for joining violent trouble in public. It is not the noun for a wild drinking
  party, and not the verb for having a loud, happy, drunken time.
examples:
- Students rioted in the streets after the court decision.
- Crowds began to riot and the police closed the square.
