simpleMeaning: of or about a build-up of fluid rich in protein and salts in the belly cavity, or caused
  by it
scope: Of fluid that has built up in the belly cavity, not of fluid elsewhere in the body.
examples:
- The ascitic fluid was drained from his belly.
- Her ascitic swelling came from liver disease.
