simpleMeaning: In physics, a law for groups of bits of matter whose wave pattern changes when two bits
  swap places, with the Pauli rule that no two can share one state
scope: In physics, a law for groups of bits of matter whose wave pattern changes when two bits swap places;
  not the Bose-Einstein law and not a rule for single bits of matter.
examples:
- Fermi-Dirac statistics govern electrons in a metal.
- Physicists use Fermi-Dirac statistics for fermions.
