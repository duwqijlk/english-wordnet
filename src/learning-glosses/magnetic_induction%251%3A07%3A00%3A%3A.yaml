simpleMeaning: Straight across the way the pull moves, one small flat bit of space takes in an amount
  of pull from a magnet
scope: Also called magnetic field strength, magnetic flux density and magnetic intensity, this is how
  much pull from a magnet passes through a small flat bit of space, not the pull itself and not the act
  of making a thing pull.
examples:
- The magnetic induction at that point was twice as strong as at the edge.
- They read the magnetic induction off the meter.
