simpleMeaning: A language used in South Africa as one of its official tongues, close kin to Dutch and
  Flemish
scope: Also called Afrikaans language, Taal and Taal language; it is the tongue itself, not the word for
  the people who speak it or for things of theirs.
examples:
- Afrikaans is one of the official languages of South Africa.
- He speaks Afrikaans with his family.
