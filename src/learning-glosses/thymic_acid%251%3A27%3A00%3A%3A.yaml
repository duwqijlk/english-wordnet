simpleMeaning: a colourless solid that forms hard clear bits, used to give perfume its smell, to keep
  dead bodies and samples from decay, and in medicine to kill fungus and germs
scope: 'Also called thyme camphor and thymol: a colourless solid used in perfume and medicine, not a liquid
  scent and not a spice.'
examples:
- Thymic acid kept the tissue sample from decay.
- A pinch of thymic acid gives the perfume its smell.
