simpleMeaning: a sickness of young plants, caused by a fungus, that makes young plants sick in too much
  wetness
scope: A sickness of young plants, caused by a fungus, that makes young plants sick in too much wetness;
  not a sickness of full-grown plants and not dry rot.
examples:
- Damping off struck the seedlings in the wet soil.
- The damping off killed half the young plants.
