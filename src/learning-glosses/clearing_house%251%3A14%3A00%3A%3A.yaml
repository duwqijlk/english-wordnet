simpleMeaning: a central place where banks swap checks and written orders to pay, each bank keeping a
  record of money paid in and money paid out
scope: A central place where banks swap checks and written orders to pay; not a single bank and not a
  market where shares are bought and sold.
examples:
- The checks were sent to the clearing house each night.
- A clearing house lets banks settle what they owe each other.
