simpleMeaning: all the guns and other weapons that are fired from one side of a warship
scope: All the weapons on one side of a warship, not the side of the ship itself, not the act of firing
  them all at once, and not a printed advertisement.
examples:
- The warship's broadside had ten heavy guns on its left side.
- The crew loaded every gun in the broadside before the battle.
