simpleMeaning: a maple tree of eastern North America with lined bark and large two-part leaves that turn
  clear yellow in autumn
scope: This is a maple tree of eastern North America, also called goosefoot maple, moose-wood, moosewood
  and striped maple; not a dogwood tree and not a maple with plain bark.
examples:
- The striped dogwood had large leaves that turned clear yellow in autumn.
- Striped dogwood grows in the woods of eastern North America.
