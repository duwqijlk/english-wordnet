simpleMeaning: to drop a ball that rolls along the ground, have it bounce in your hands without holding
  it, or fail to pick it up and hold it cleanly
scope: In a ball game, to drop or fail to hold a ball that rolls on the ground, not to move in a clumsy
  way and not to spoil a job.
examples:
- The player fumbled the grounder and missed the catch.
- He fumbled a simple grounder rolling towards him.
