simpleMeaning: A big grey-brown fungus that can be eaten, forming a mass of flat tops laid over each other,
  a little like a hen, at the foot of trees
scope: A big grey-brown fungus at the foot of trees, a little like a hen, not a small round mushroom;
  also called hen-of-the-woods, hen of the woods and Polyporus frondosus.
examples:
- Grifola frondosa grew in a big mass at the foot of the oak.
- We cooked Grifola frondosa for supper.
