simpleMeaning: warfare with waves and signals to stop or weaken an enemy's use of the waves that fill
  the air
scope: Warfare with waves and signals against an enemy's waves, not guns and bombs and not spying with
  people on the ground.
examples:
- Electronic countermeasures jammed the enemy's radar.
- The plane used electronic countermeasures to hide from the radar.
