simpleMeaning: Furniture, bridges and wharves are made from the hard reddish wood of this New Zealand
  tree, which people value highly.
scope: This is the New Zealand tree whose hard reddish wood goes into furniture, bridges and wharves.
examples:
- They cut the totara for wood to build the new wharf.
- The totara table was made from hard reddish wood.
