senseId: 'predication%1:10:00::'
synsetId: 06745976-n
simpleMeaning: In logic, a clear statement that needs no proof and can be used as the start of an argument
scope: 'Another name for this sense is postulation: a clear statement taken as true to start an argument,
  not a claim that still needs proof.'
examples:
- His predication that all people seek fairness was the start of his argument.
- The predication seemed so clear that no one asked for proof before the debate began.
