simpleMeaning: Babies and people whose bodies cannot fight sickness well, such as people with AIDS, may
  come down with a sickness of the lungs.
scope: This lung sickness is also called pneumocystis pneumonia, pneumocytosis and interstitial plasma
  cell pneumonia, and it strikes babies or people with weak defences.
examples:
- The baby had pneumocystis carinii pneumonia.
- The doctors treated the baby for pneumocystis carinii pneumonia.
