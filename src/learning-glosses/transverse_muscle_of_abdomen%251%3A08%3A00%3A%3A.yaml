simpleMeaning: The front and side walls of the belly are made by this flat muscle, whose threads run across
  it.
scope: Also called musculus transversalis abdominis, transversus abdominis and transversus abdominis muscle,
  this is the flat muscle that makes the front and side walls of the belly.
examples:
- The transverse muscle of abdomen held the belly wall firm.
- The transverse muscle of abdomen runs across the belly.
