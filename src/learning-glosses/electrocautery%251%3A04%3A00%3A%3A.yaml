senseId: 'electrocautery%1:04:00::'
synsetId: 00698987-n
simpleMeaning: The use of a thin point made hot by a current to burn away part of the body, as to take
  off warts.
scope: The use of a thin point made hot by a current to burn away part of the body, not a knife and not
  a drug.
examples:
- The doctor used electrocautery to remove the wart.
- Electrocautery burns away the growth.
