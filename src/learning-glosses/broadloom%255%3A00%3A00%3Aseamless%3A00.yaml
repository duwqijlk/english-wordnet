simpleMeaning: of a floor covering, made in one full-width piece
scope: Of a rug or carpet, made in one full-width piece; not one made in narrow strips joined with seams,
  and not the carpet itself.
examples:
- She chose a broadloom rug for the living room.
- The broadloom carpet covered the whole floor without a seam.
