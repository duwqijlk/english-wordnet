simpleMeaning: Loud, rough fun, full of chases, bumps, and tricks played on people to make them laugh.
scope: A boisterous comedy with chases and collisions and practical jokes, not the hinged wooden device
  that makes a loud noise on stage.
examples:
- The play was pure slapstick, with doors slamming and actors tumbling over chairs.
- Children love slapstick with its chases and custard pies.
