senseId: 'moderationist%1:18:01::'
synsetId: 10345623-n
simpleMeaning: A person who drinks alcohol in small amounts, and does not give it up fully
scope: A person who drinks a little but does not give it up fully, not a person who drinks a lot and not
  one who never drinks.
examples:
- He is a moderationist and takes a glass of wine with dinner.
- Unlike her teetotal friends, she is a moderationist who still drinks now and then.
