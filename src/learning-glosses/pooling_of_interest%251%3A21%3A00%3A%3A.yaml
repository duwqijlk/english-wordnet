simpleMeaning: In accounting, a way to join companies by adding their lists of what each owns and owes,
  one line at a time, with no tax to pay
scope: A way to join companies in accounting, with their lists added line by line and no tax to pay, not
  a way to run one company on its own.
examples:
- The two firms used pooling of interest to join, adding their lists line by line.
- Under pooling of interest, the new company paid no tax on the join.
