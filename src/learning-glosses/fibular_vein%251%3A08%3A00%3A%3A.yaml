simpleMeaning: veins beside the peroneal arteries of the lower leg, starting in the heel and running up
  the back of the leg to join the back shin veins behind the knee
scope: Veins that run beside the peroneal arteries up the back of the leg, also called peroneal vein or
  vena peroneus, not an artery and not a vein in the arm.
examples:
- The fibular vein runs up the back of the lower leg.
- Blood in the fibular vein joins the veins behind the knee.
