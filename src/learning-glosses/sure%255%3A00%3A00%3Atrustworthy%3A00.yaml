senseId: sure%5:00:00:trustworthy:00
synsetId: 02475203-s
simpleMeaning: (of a person) deserving to be trusted or depended on.
scope: 'This describes a person''s character: someone you can rely on. It is now rare and appears mostly
  in older writing and fixed phrases such as ''a sure friend''. It is not the common sense ''certain or
  confident'', and not ''reliable in operation'', which describes things rather than people.'
examples:
- She was a sure friend, the kind you could call at midnight.
- He wanted a sure ally in the negotiations, not a man who might waver.
