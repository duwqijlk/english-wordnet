simpleMeaning: A people who have long lived in mountain villages in southern China and nearby parts of
  Vietnam, Laos and Thailand, many of whom have moved to the United States.
scope: A people of mountain villages in southern China and nearby Vietnam, Laos and Thailand, many now
  in the United States, also called Hmong, and not the language spoken by these people.
examples:
- The Miao have lived in mountain villages in southern China for centuries.
- Many Miao families now live in the United States.
