simpleMeaning: In law, the people who are called to court so that some of them can be picked to sit on
  a jury
scope: In law, the group called for jury service, not a group gathered to plan or talk over a question.
examples:
- The panel waited in the courtroom for the jury to be chosen.
- Her name was on the panel for jury service.
