simpleMeaning: Make music by pressing the keys or playing the strings of an instrument.
scope: This is another name for the musical sense of hit — making music on an instrument — not a blow
  with the hand or an attack on an enemy.
examples:
- The pianist struck the opening chord and the hall fell silent.
- She struck a wrong note and winced.
