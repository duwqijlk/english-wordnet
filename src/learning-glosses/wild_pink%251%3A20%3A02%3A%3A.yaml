simpleMeaning: an orchid of bogs, usually with one sweet-smelling flower of bright reddish-purple whose
  petals spread wide open; it grows in Canada
scope: Also called bog rose and dragon's mouth; a bog orchid of Canada with usually one sweet-smelling
  blossom, not the perennial of eastern and central North America with pink or white flowers in hairy
  clusters.
examples:
- The wild pink grows in the bog near the lake.
- We found a wild pink with a single fragrant blossom.
