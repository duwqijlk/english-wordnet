simpleMeaning: The duty of a person who looks after the sick to act for the good of the sick person
scope: The duty of a person who looks after the sick to act for the good of the sick person; not the duty
  of a doctor and not a friendship.
examples:
- The nurse-patient relation calls for trust on both sides.
- Good care rests on the nurse-patient relation.
