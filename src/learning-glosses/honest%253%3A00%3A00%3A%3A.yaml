simpleMeaning: telling the truth and not cheating, lying, or tricking people.
scope: This is not about something being genuine rather than fake, and not about plainness or simplicity;
  it describes a person or act that does not cheat or deceive and is truthful.
examples:
- She gave an honest answer to every question.
- He is too honest to take the money.
