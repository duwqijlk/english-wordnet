simpleMeaning: This short wooden stick has a heavy round end, and the first peoples of southern Africa
  use it as a club
scope: 'Also called a knobkerry: a short wooden club with a heavy end, not a long staff and not a metal
  weapon.'
examples:
- He carried a knobkerrie when he walked in the bush.
- The knobkerrie had a heavy round end.
