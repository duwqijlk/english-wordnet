simpleMeaning: A band that runs round in a ring, stiff and made of metal, wood, or other stuff, for holding,
  tying, hanging, or pulling things.
scope: A stiff round band for holding, tying, hanging, or pulling things, also called ring, not the ring
  that holds a basketball net, not the frame that spreads a skirt, and not the act of fixing one on.
examples:
- He slipped a hoop round the barrel to hold it fast.
- The hoop held the bundle of sticks together.
