simpleMeaning: On wet, rather sour ground above all grows this North American plant that lives one year,
  with yellow or orange blooms most times.
scope: This plant is also called celandine, jewelweed, orange balsam and touch-me-not, and it grows above
  all on wet, rather sour ground in North America.
examples:
- Lady's earrings grew on wet, rather sour ground.
- The lady's earrings had orange blooms.
