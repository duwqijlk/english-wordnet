simpleMeaning: This oven takes out of a steel strip the stiffness left by working it, in place of heating
  it without a break
scope: Also called a bell-type furnace, this oven takes the stiffness that working has put into a steel
  strip out of it, in place of heating it without a break.
examples:
- The bell-type annealing furnace softened the steel strip.
- They ran the steel strip through the bell-type annealing furnace.
