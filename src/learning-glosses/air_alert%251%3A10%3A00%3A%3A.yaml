simpleMeaning: a sound or sign that tells people to get ready for an enemy attack from the sky
scope: A warning that an enemy attack from the sky may come, not the attack itself and not a warning of
  danger on the ground.
examples:
- The air alert sounded over the city.
- When the air alert began, people went to the shelters.
