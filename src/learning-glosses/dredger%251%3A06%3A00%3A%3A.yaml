simpleMeaning: A barge, or a boat like a barge, used to dig up and clear the bottom of water.
scope: A barge, or a boat like a barge, used to dig up and clear the bottom of water, not a fishing boat
  and not a cargo ship.
examples:
- The dredger cleared mud from the harbour mouth.
- A dredger worked in the river all week.
