simpleMeaning: In computer science, a part of a machine that holds a running total and adds each new number
  to it.
scope: Also called accumulator, this part of a computer adds each new number to the running total it holds.
examples:
- The accumulator register held the running total while the machine worked.
- In the old computer, the accumulator register added each new number to the total.
