simpleMeaning: In ophthalmology, a lamp that sends out a narrow, very bright beam; with a microscope,
  an eye doctor can use it to examine the retina and optic nerve.
scope: A lamp used in eye examinations, not a microscope or an ordinary reading lamp.
examples:
- The clinic uses a slit lamp to examine the retina.
- With a slit lamp and a microscope, the doctor viewed the optic nerve.
