simpleMeaning: Red spice and onions flavour the stock in which bird meat is cooked slowly before sour
  cream is mixed in.
scope: Also called chicken paprika, it is bird meat simmered in stock with onions and red spice, then
  mixed with sour cream.
examples:
- He ordered chicken paprikash.
- The chicken paprikash had sour cream in it.
