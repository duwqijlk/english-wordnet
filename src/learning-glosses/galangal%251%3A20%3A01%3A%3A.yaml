simpleMeaning: A plant of south-east Asia that lives for many years and has roots with a strong pleasant
  smell.
scope: This is a south-east Asian plant with roots that smell pleasant; not the European sedge of the
  same name, and not ginger, which is a different plant.
examples:
- Galangal gives the soup a pleasant smell.
- She grows galangal in a pot by the kitchen door.
