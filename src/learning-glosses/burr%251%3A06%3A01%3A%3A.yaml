simpleMeaning: a tool that turns and has a rough head, used to make rough edges left on a piece smooth
scope: A turning tool for making rough edges smooth, not the small rough part left after cutting and not
  a seed case with hooks or sharp points.
examples:
- The worker used a burr to smooth the rough edge of the metal piece.
- A small burr in the drill set made the cut edge smooth.
