simpleMeaning: Usually used with scorn for small or weak writers of verse, this name means a writer of
  rhymes who makes poor verses.
scope: A poetiser, a rhymer, a rhymester and a versifier are other names for this writer of poor rhyming
  verse, a name used with scorn for small or weak writers.
examples:
- They called her a poetizer.
- The poetizer wrote poor verses.
