simpleMeaning: for guns, timed fuses, and fireworks, this is a mix of potassium nitrate, charcoal, and
  sulfur in parts 75 to 15 to 10
scope: This is the mix for guns and fireworks, not the fine dry stuff in general and not the kind put
  on skin or used as medicine.
examples:
- They filled the old cannon with powder before the show.
- The fireworks factory kept its powder in a dry locked store.
