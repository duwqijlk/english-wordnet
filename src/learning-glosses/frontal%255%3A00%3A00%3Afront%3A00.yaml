simpleMeaning: facing and meeting in a direct way, front against front
scope: About an attack or meeting that comes straight from the front; not about the forehead, and not
  the front part of a building.
examples:
- The army made a frontal attack on the castle gate.
- The two cars met in a frontal crash on the narrow road.
