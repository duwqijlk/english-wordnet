simpleMeaning: not passing solid waste often or easily, or at set times; it can be a sign of a blocked
  gut or of diverticulitis (swollen pouches in the gut)
scope: This body problem, also called constipation, is not an uneven shape and not behaviour that breaks
  a rule.
examples:
- His irregularity made it hard for him to pass waste for days.
- The doctor said her irregularity could be a sign of a blocked gut.
