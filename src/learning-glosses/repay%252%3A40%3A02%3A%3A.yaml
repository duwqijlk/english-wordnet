simpleMeaning: To give something back to a person because of what they did, as thanks for it
scope: 'Also called reward: to give something back because of what a person has done, not to pay back
  money that is owed or give back a thing that was lent.'
examples:
- The town repaid the firemen with a public dinner.
- She repaid his kindness with a gift of her own.
