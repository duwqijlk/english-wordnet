simpleMeaning: wet plant matter from the ground, half turned to coal, that burns as fuel once it is dried
scope: Wet plant matter from the ground that can be dried and burned, not coal itself and not garden soil.
examples:
- They cut peat from the bog to burn in winter.
- The house was heated with peat.
