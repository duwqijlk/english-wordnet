simpleMeaning: To make their people think they are trying to keep from fighting with weapons, governments
  take steps in public life
scope: Steps governments take to look as if they are trying to avoid war, not real talks that end a war
  and not the fighting itself.
examples:
- The peace process stalled when the two governments stopped talking.
- People doubted whether the peace process would stop the fighting.
