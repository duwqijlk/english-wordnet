simpleMeaning: The government has a big say in how goods and supplies are shared out and what prices are
  set, in a trade system not left to buyers and sellers
scope: A way of running trade where the government has a big say in sharing out goods and supplies and
  setting prices, not a free market where buyers and sellers decide.
examples:
- In a managed economy, the government sets the price of bread.
- The managed economy gave the state a big say in where goods went.
