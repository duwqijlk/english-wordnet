senseId: 'northeast_by_north%1:24:00::'
synsetId: 13853916-n
simpleMeaning: The compass point one step to the left of the point halfway between the top point and the
  right-hand point
scope: This is the compass point one step anticlockwise from the halfway point between the top and right-hand
  points; not that halfway point itself and not the top point.
examples:
- The wind shifted to northeast by north.
- They steered northeast by north toward the coast.
