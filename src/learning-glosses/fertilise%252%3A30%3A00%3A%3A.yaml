simpleMeaning: to feed soil or plants with rich food that helps them grow
scope: 'Also called fertilize: this is feeding soil or plants with food that helps them grow, not the
  wider sense of making something able to grow well and give much of value.'
examples:
- Farmers fertilise the fields in spring to help the crops grow.
- You should fertilise the soil before you plant the seeds.
