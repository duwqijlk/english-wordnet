simpleMeaning: an official order that says something must not be done
scope: This is one official order that bans one thing. It is not the act of banning things in general,
  not the years in the United States when drink with alcohol could not be sold, and not a law that only
  bans that drink.
examples:
- The city put a prohibition on parking in this street.
- Under the new prohibition, no one may smoke inside the building.
