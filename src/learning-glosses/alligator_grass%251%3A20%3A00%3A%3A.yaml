simpleMeaning: A fast-spreading water weed from South America with grasslike leaves and short spikes of
  white flowers, which clogs waterways with thick floating mats.
scope: A South American water weed that spreads fast and covers waterways with floating mats; the name
  belongs to botany and weed control. 'Alligator weed' is another name for this same plant. It is not
  water hyacinth, a different floating water weed.
examples:
- Alligator grass had choked the canal so badly that boats could no longer pass.
- Crews pulled mats of alligator grass from the lake for weeks.
