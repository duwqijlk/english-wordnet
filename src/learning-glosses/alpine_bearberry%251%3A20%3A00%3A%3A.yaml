simpleMeaning: A low spreading bush that drops its leaves, turns bright red in fall, and bears black or
  blue-black fruit; it grows in high places around the far north.
scope: Also called black bearberry, this is a low spreading bush that turns bright red in fall and bears
  black or blue-black fruit.
examples:
- The alpine bearberry turns bright red in fall.
- The alpine bearberry bears dark fruit in cold high places.
