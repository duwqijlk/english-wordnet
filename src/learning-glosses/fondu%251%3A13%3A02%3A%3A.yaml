simpleMeaning: Small bits of meat or food from the sea cooked in hot oil, then dipped in one of a range
  of sauces.
scope: These are small bits of meat or food from the sea cooked in hot oil and dipped in sauces, not hot
  cheese or chocolate for dipping bread, and it is also called fondue.
examples:
- They cooked fondu in hot oil at the table.
- The fondu came with three sauces.
