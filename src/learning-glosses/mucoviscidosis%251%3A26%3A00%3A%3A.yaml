simpleMeaning: The most common passed-down sickness, in which a child's lungs, gut and pancreas clog with
  thick mucus, from a fault in one gene, with no cure known.
scope: This sense is also called cystic fibrosis, fibrocystic disease of the pancreas and pancreatic fibrosis,
  for the most common passed-down sickness, in which a child's lungs, gut and pancreas clog with thick
  mucus, from a fault in one gene, with no cure known.
examples:
- Mucoviscidosis clogs the lungs with mucus.
- Mucoviscidosis comes from one faulty gene.
