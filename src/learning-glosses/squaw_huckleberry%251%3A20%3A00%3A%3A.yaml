simpleMeaning: a small branching blueberry often found in marshy ground in the eastern United States,
  with greenish or yellowish berries that taste bad and are said to be eaten by deer
scope: 'Also called deerberry: a small blueberry bush of marshy ground in the east, not a tall blueberry
  of dry hills and not a cranberry of cold bogs.'
examples:
- The squaw huckleberry grew thick in the marsh.
- Deer had eaten the squaw huckleberry berries, though they taste bad.
