simpleMeaning: Eyes turn away from someone else and onto this person, who often takes the blame and anger
  meant for them
scope: A person who draws blame meant for someone else, not the metal rod on a roof that draws lightning
  away.
examples:
- The new manager became the lightning rod for every complaint about the move.
- As lightning rod for the board, he faced the angry crowd while the others stayed quiet.
