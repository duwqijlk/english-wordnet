simpleMeaning: The state in which the blood-pumping organ in the chest cannot push enough blood to keep
  the body working as it should.
scope: The state in which the blood-pumping organ cannot push enough blood to keep the body working, also
  called coronary failure; not a sudden stop of the blood-pumping organ and not a heart attack.
examples:
- Heart failure left him short of breath after a short walk.
- Doctors treat heart failure with drugs that help the organ pump better.
