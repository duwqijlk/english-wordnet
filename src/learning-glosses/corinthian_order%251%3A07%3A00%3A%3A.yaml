simpleMeaning: The last of the Greek styles of building, like the Ionic style except that the top of the
  column is cut with acanthus leaves, leaves with deep cuts.
scope: It is the last Greek style of building, set apart from the Ionic style by the carved leaves with
  deep cuts on the top of its columns.
examples:
- The Corinthian order crowns its columns with carved leaves.
- We saw the Corinthian order on the temple columns.
