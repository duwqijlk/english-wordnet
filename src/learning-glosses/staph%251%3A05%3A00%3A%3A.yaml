simpleMeaning: Round germs that stain purple in a laboratory test, live as parasites, and tend to grow
  in uneven groups; some cause boils, blood poisoning, or other infections.
scope: Also called staphylococcus or staphylococci, round germs that stain purple in a laboratory test
  and tend to grow in uneven groups; some cause boils, blood poisoning, or other infections.
examples:
- The wound was infected with staph and needed treatment.
- Staph can cause boils if it gets into a cut.
