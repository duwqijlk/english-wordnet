simpleMeaning: to do small jobs here and there with no plan, or to spend time with nothing much to do
scope: To do small jobs with no plan, or to spend time with nothing much to do; monkey is another name
  for this sense, not to mend pots for a living, and not to work on machines for fun.
examples:
- The old lady liked to tinker about in her little house.
- He spent the afternoon tinkering in the shed, moving tools from shelf to shelf.
