simpleMeaning: A chemical used above all by animal doctors to clear farm animals of worms and other pests
  inside them.
scope: A chemical used above all by animal doctors to clear farm animals of worms and other pests inside
  them; not a food and not a drug for people.
examples:
- The vet gave the sheep phenothiazine for worms.
- Phenothiazine cleared the calves of gut pests.
