simpleMeaning: a skilled worker who makes things to wear, such as rings and necklaces, and other things
  out of gold
scope: This is a person who makes things from gold, not a person who sells gold and not a shop that trades
  in gold.
examples:
- The goldsmith made a gold ring for the wedding.
- We took the broken necklace to a goldsmith to fix it.
