simpleMeaning: of a person, kind and polite in how they act and speak to others
scope: This sense is about a person's kind, polite way of acting and speaking. It is not about a place,
  thing or time giving you a good feeling.
examples:
- She is a pleasant woman who always speaks kindly to guests.
- Our new teacher is pleasant and easy to talk to.
