simpleMeaning: loose bits of stone, silt (very fine earth) and other like material, all worn away from
  rocks
scope: Loose rock bits worn away from rocks; it is not living waste and not rubbish left by people.
examples:
- Detritus covered the bottom of the stream.
- Waves washed rock detritus onto the beach.
