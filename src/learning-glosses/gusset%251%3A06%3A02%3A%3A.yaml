simpleMeaning: A piece of linked metal rings that covers a spot left bare by plates of armour.
scope: A piece of linked metal rings that covers a spot left bare by plates of armour, not a piece of
  cloth that strengthens a garment and not a metal plate that strengthens a joist.
examples:
- The gusset of chain mail guarded the join under his arm.
- A gusset covered the gap where the breastplate ended.
