simpleMeaning: Hot liquid rock pushes into cracks in older rock, or into the gaps between its layers
scope: Hot melted rock forced into cracks or between older layers, not rock made by such a process and
  not an unwanted entry into a place.
examples:
- Molten rock pushed into the cracks during the intrusion.
- The intrusion took place as hot rock forced its way between the old layers.
