simpleMeaning: In astrology, each of twelve equal stretches of the sky that together make up the zodiac.
scope: This is one of the twelve astrological divisions of the zodiac, not the adjective describing the
  language of deaf people, not a visible clue that something has happened, not a public notice or display
  of a message, not a nonverbal gesture that encodes a message, not a billboard or other posted sign structure,
  not objective medical evidence of disease, not one of the two electric poles, not an omen of things
  to come, not a gesture in sign language, not a mathematical symbol, not a linguistic unit joining a
  signifier to a signified, and not any verb sense such as writing one's name, approving, being employed,
  hiring, signaling, putting up signs, using sign language, or making the sign of the cross.
examples:
- Aries is the first sign of the zodiac.
- She was born under the sign of Leo.
