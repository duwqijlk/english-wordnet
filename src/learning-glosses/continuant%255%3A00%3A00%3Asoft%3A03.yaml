simpleMeaning: Said of a sound in speech made when air is forced through a narrow gap, as with f, s, z,
  or th in 'thin' and 'then'.
scope: This is an adjective for such sounds, also called strident, sibilant, fricative, or spirant, and
  not the noun for the consonant itself.
examples:
- The continuant 's' is made by forcing air through a narrow gap.
- In 'thin', the continuant 'th' is made the same way.
