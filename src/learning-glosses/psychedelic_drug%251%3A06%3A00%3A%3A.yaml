simpleMeaning: a mind-changing chemical that brings on false sights and sounds or strange feelings of
  the senses
scope: A mind-changing chemical that brings on false sights and sounds or strange feelings of the senses;
  also called hallucinogen and hallucinogenic drug; not a drug that puts a person to sleep, and not a
  drug that wakes a person up.
examples:
- The psychedelic drug made him see colours that were not there.
- She warned him that a psychedelic drug can change what the senses tell you.
