senseId: 'clarion%2:32:00::'
synsetId: 00980087-v
simpleMeaning: To make a thing known loudly, as if sounded on a clear, shrill trumpet.
scope: To make a thing known loudly, as if on a clear, shrill trumpet, not blowing the trumpet itself,
  and not the trumpet as a thing.
examples:
- The herald clarioned the news across the square.
- She clarioned her victory to the whole town.
