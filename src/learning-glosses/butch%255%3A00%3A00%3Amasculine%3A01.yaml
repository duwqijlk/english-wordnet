simpleMeaning: used of a man who looks and acts in a very strong man-like way
scope: Used of men who look and act in a very man-like way; not the noun for a short haircut, not the
  offensive noun for a lesbian, and not the sense for gay men or women with man-like traits.
examples:
- He chose a butch style, with short hair and a strong, man-like manner.
- The actor played a butch guard who spoke in a short, firm way.
