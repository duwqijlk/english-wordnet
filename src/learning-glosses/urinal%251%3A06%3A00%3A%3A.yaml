simpleMeaning: a thing joined to pipes, usually fixed on a wall, that men use to pee
scope: A thing, usually fixed on a wall, that men pee into; not a toilet for sitting on, and not a sink
  for washing.
examples:
- The men's bathroom has three urinals on the wall.
- He stood at the urinal to pee.
