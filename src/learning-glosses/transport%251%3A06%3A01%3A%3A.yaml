simpleMeaning: The mechanism inside a tape player or recorder that draws the magnetic tape across the
  heads that read or write it.
scope: This is a small mechanism inside a tape machine, not a vehicle or a system for carrying people,
  and not the business of moving goods.
examples:
- The tape transport jammed and chewed up the recording.
- He cleaned the transport mechanism with a cotton swab.
