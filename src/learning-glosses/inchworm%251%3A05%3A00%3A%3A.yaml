simpleMeaning: A small caterpillar without hairs, with legs only at its front and back ends, mostly the
  young of moths of the Geometridae family.
scope: A small hairless caterpillar with legs only at its front and back, also called a looper or measuring
  worm.
examples:
- An inchworm looped its way along the twig.
- The inchworm arched its back and moved forward.
