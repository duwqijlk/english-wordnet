simpleMeaning: the case that holds the seeds of a pea, bean or lentil plant, and of plants like them
scope: This is the case that holds the seeds of a pea, bean or lentil plant, not the plant itself and
  not the seeds inside.
examples:
- He picked a legume from the pea plant and opened it to find the seeds inside.
- A dried legume from the bean plant still held several hard seeds.
