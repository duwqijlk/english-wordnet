simpleMeaning: An extra nut screwed down tight on top of a first nut to stop it from coming loose
scope: An extra nut screwed down on top of a first nut to stop it coming loose, not the first nut itself
  and not a washer.
examples:
- He fitted a locknut to keep the bolt from working loose.
- The locknut held the wheel in place.
