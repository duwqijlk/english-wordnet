simpleMeaning: the comfort that eases your pain a little when disappointment or deep unhappiness leaves
  you low
scope: Comfort felt in disappointment or misery, not the act of consoling and not just the feeling after
  someone has comforted you.
examples:
- She found solace in music during her long illness.
- His solace was the thought that better days would come.
