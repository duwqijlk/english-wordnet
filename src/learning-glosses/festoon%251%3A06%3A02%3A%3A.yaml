simpleMeaning: a cloth curtain hung and tied at points along its length to make pleasing smooth curves
scope: A cloth curtain hung in curves, not chains of flowers hung up as decoration, and not a carved or
  painted copy of such chains.
examples:
- A festoon hung over the tall window, tied in soft curves at each side.
- The stage curtain was a festoon, its cloth looping in smooth curves.
