simpleMeaning: The neutral 'uh' vowel sound that comes along with a consonant's pronunciation.
scope: Another name for a 'murmur vowel' in phonetics, a neutral vowel sound tied to a consonant, not
  the low continuous sound, the quiet complaint, or the heart sound.
examples:
- The transcription marked a murmur between the two consonants.
- In rapid speech, a murmur often develops beside a consonant.
