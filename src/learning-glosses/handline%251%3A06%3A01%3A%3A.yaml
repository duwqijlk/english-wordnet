simpleMeaning: In climbing, a rope to hold with the fingers while going up or down a steep or slippery
  stretch, giving some safety
scope: In climbing, a rope to hold with the fingers on a steep or slippery stretch, not the main climbing
  rope and not a fixed rail.
examples:
- She gripped the handline as she climbed down the wet rock.
- A handline gave the climbers some safety on the steep stretch.
