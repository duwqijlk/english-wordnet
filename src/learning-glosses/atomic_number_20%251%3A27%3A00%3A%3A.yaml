simpleMeaning: A white metal that burns with a bright light; the fifth most common kind of matter in the
  earth's hard outer layer; a key part of most plants and animals.
scope: A white metal that burns with a bright light, also called Ca and calcium; set apart from other
  white metals and from metals that do not burn brightly.
examples:
- Atomic number 20 is a key part of most plants and animals.
- A strip of atomic number 20 burns with a bright white light.
