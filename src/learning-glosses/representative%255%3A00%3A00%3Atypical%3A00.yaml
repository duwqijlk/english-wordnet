simpleMeaning: serving to show what a whole group or kind is like
scope: A thing that shows what a whole group or kind is like, not a person who speaks for others and not
  a government run by voted-in speakers.
examples:
- She chose a representative group of moviegoers to test the film.
- The play was a representative piece of modern theatre.
