simpleMeaning: level blades that spin with no motor of their own hold this flying machine in the air,
  while a normal propeller pushes it forward
scope: Also called autogiro and gyroplane; a flying machine held up by spinning blades, not a helicopter
  and not a glider.
examples:
- The autogyro landed on the short grass strip.
- An autogyro's blades spin with no motor of their own.
