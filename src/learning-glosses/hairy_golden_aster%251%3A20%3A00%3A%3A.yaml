simpleMeaning: A perennial with fine hairs, yellow blooms in branched clusters, found in dry places nearly
  everywhere from Canada to the west central and western United States, sometimes in Chrysopsis.
scope: Also called prairie golden aster, it grows in dry places from Canada to the west central and western
  United States and bears yellow flower heads in branching clusters.
examples:
- Hairy golden aster grew along the dry roadside.
- She pointed out the hairy golden aster in the open field.
