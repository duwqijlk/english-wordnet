simpleMeaning: Eat, drink and dance to songs played by a machine in this small place by the road in the
  south-east of the United States
scope: A small place by the road in the south-east of the United States where people eat, drink and dance
  to music from a machine, also called jook, jook house, jook joint, juke or juke joint; not a large city
  nightclub and not a restaurant with no dancing.
examples:
- We stopped at a juke house outside town for supper and a dance.
- The old juke house on the highway still plays music every night.
