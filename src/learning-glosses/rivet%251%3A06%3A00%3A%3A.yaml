simpleMeaning: a heavy pin with a head at one end that holds two parts fast once its other end is hit
  flat after it goes through holes in them
scope: A heavy pin that holds parts fast, not a round ornament and not the act of fastening.
examples:
- He drove a rivet through the steel plates.
- The rivets held the bridge beams together.
