simpleMeaning: the person at a formal meal who asks people to drink to someone and brings in each speaker
scope: This is the person who runs the toasts and speakers at a formal meal, also called a toastmaster.
  Not a guest who only gives a speech and not the host of an everyday meal.
examples:
- The symposiarch raised his glass and asked us to drink to the bride.
- As symposiarch, she introduced each speaker at the banquet.
