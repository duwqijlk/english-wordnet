simpleMeaning: A bright grey strong metal much like titanium, used in nuclear reactors to soak up neutrons;
  it is found in baddeleyite but got mostly from zircon
scope: This metal is also called Zr and atomic number 40; it is not titanium and not another grey metal
  of the same group.
examples:
- Zirconium is used in nuclear reactors.
- The tube was made of zirconium.
