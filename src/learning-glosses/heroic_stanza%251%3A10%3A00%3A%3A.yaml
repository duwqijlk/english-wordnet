simpleMeaning: With lines one and three rhyming and lines two and four rhyming, this is four lines of
  verse in two pairs, written in a high, grand way.
scope: This verse of four lines in two pairs in a high, grand way has its first and third lines rhyming
  and its second and fourth rhyming.
examples:
- The poem closed with a heroic stanza.
- She wrote a heroic stanza whose first and third lines rhymed.
