simpleMeaning: A big smooth fruit with a pale white-green skin and pale green flesh inside, it is the
  fruit of one kind of winter vine.
scope: Also called honeydew, it is the big smooth fruit of one kind of winter vine, not the fruit of a
  muskmelon vine with the same name.
examples:
- The honeydew melon was big and smooth.
- She cut the honeydew melon and ate its pale green flesh.
