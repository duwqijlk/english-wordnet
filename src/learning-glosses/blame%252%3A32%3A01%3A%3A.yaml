simpleMeaning: to keep finding fault with someone, saying again and again that what they do is wrong
scope: 'Also called pick: to keep saying someone does things wrong, not to say someone caused a bad thing,
  and not the swear-word use.'
examples:
- He is always blaming his younger brother, saying his clothes, his work and his games are all wrong.
- She blamed him all morning, finding fault with every little thing he did.
