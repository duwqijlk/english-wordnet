simpleMeaning: finding out where things are on a piece of land, by measuring the angles and the space
  between them, so a map can show them in the right places
scope: The work of measuring land for maps, not taking a poll and not looking over a place with the eye.
examples:
- He studied surveying at college.
- Surveying the field took the team all morning.
