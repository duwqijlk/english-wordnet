simpleMeaning: Abundant non-metal with no taste or smell, joining more than one way, best known in yellow
  crystals, found in many sulphide and sulphate minerals and alone, chiefly in volcanic ground.
scope: A yellow substance with no taste or smell, also called sulfur, sulphur, and atomic number 16; not
  the heat measure of lost work, and not the unit for how well a wire lets a flow go through.
examples:
- Sulfur is a yellow element with no smell.
- The rock has sulfur in it.
