simpleMeaning: Talk or acts that no one should accept, especially silly claims that are plainly untrue.
scope: Also called bunk, rot, hogwash, or bunkum; conduct no one should accept, especially silly false
  claims.
examples:
- Don't give me that guff about the dog eating your homework.
- The salesman tried to sell us guff, and we walked away.
