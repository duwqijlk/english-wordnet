simpleMeaning: An acid and a base cancel each other out and leave a salt behind. If both are strong, hydrogen
  ions and hydroxyl ions join to make water.
scope: The British-spelled name for the chemistry sense in which an acid and a base yield a salt; 'neutralization'
  and 'neutralization reaction' are other names, while keeping a country neutral or killing a threat are
  different meanings.
examples:
- A neutralisation reaction between an acid and an alkali gives a salt and water.
- The class watched a neutralisation reaction as vinegar was added to baking soda.
