simpleMeaning: In Nazi Germany, a secret arm of the state, known for using fear and force against its
  people.
scope: A secret arm of the state in Nazi Germany that used fear and force, not the ordinary officers who
  enforce the law and not the ruling party itself.
examples:
- People lived in fear of the Gestapo knocking on their doors at night.
- The Gestapo arrested anyone who spoke against the government.
