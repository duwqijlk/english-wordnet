simpleMeaning: A cut of meat with the ribs in it, from the front of a young cow or a pig, most of all
  a lamb or sheep
scope: A cut of meat with ribs, not a horse's way of moving and not a tool used to hurt people by stretching
  them.
examples:
- A rack of lamb with rosemary made a fine Sunday lunch.
- The butcher cut a rack of pork into chops.
