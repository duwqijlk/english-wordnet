simpleMeaning: When something you own is hard to sell, you cannot turn it into cash fast or sell it off
  for money
scope: 'A money problem: something you own cannot be sold fast for cash; not a lack of money itself and
  not a fall in what the thing is worth.'
examples:
- The fund warned that illiquidity could stop it selling its holdings in a hurry.
- Illiquidity in the housing market left her unable to free the money tied up in her flat.
