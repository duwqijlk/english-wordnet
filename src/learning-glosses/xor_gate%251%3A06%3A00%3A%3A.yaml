simpleMeaning: A switch in a computer that turns on only when just one of its inputs is on.
scope: This is a switch in a computer that turns on only when just one of its inputs is on, also called
  an X-OR circuit and an XOR circuit, not a switch that turns on when more than one input is on.
examples:
- The XOR gate fires when one input is high.
- An XOR gate passes a signal only if one input is on.
