simpleMeaning: In heraldry, the old system of family coats of arms, a picture or design shown on a shield
scope: 'Also called charge: a picture or design on a shield, not a way of holding the body and not how
  one thing links to another.'
examples:
- The bearing on the shield was a red lion.
- Each family had its own bearing on its coat of arms.
