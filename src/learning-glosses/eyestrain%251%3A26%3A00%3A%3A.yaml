simpleMeaning: Tired eyes after long close work, when a person has a sight problem that has not been put
  right
scope: 'Also called asthenopia: tired eyes from long close work, not tired eyes from lack of sleep and
  not a hurt eye.'
examples:
- Hours of reading gave her eyestrain by the end of the day.
- His eyestrain came from doing close work without glasses.
