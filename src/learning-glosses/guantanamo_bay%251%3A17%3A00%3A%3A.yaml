simpleMeaning: In nineteen oh three the United States set up a naval station on a stretch of sea water
  that runs into the land from the Caribbean Sea.
scope: An inlet of the Caribbean Sea where the United States keeps a naval station, not the town of Guantanamo
  and not the open sea.
examples:
- Ships anchor in Guantanamo Bay before they sail into the Caribbean Sea.
- The United States naval station at Guantanamo Bay was set up in 1903.
