simpleMeaning: A very catching sickness from a virus, with fever and weakness, and skin spots filled with
  thick liquid that form hard dry tops that fall off and leave lasting marks
scope: This sickness is also called variola and variola major. It is not chickenpox or a common skin rash,
  which are less serious.
examples:
- Smallpox killed many people before doctors found a way to stop it.
- He had smallpox and was left with marks on his face.
