simpleMeaning: material that stays firm at ordinary room temperature and pressure.
scope: This is not the physical condition of keeping a shape under pressure, and not a three-dimensional
  geometric object; it names a kind of matter that is firm at ordinary room temperature and pressure,
  such as metal or wood.
examples:
- The lesson introduced solids, liquids and gases.
- Most metals are solids at room temperature.
