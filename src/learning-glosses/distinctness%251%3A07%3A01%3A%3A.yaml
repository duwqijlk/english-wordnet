simpleMeaning: The quality of being unlike, different from what is known or met before.
scope: The quality of being unlike, different from what is known or met before; also called otherness
  or separateness; not the state of being several and distinct.
examples:
- Their distinctness set them apart from the rest.
- The distinctness of the two voices was plain to hear.
