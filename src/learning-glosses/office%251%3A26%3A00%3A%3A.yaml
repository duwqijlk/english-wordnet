simpleMeaning: a position of power held by a government or by a government official
scope: This is the position of governmental power, not a place of business, not an administrative unit
  of government, not the duties assigned to a person or group, not the staff of a workplace, not a religious
  rite, and not a job in an organization.
examples:
- The party has held office since the last election.
- She took office as mayor in January.
