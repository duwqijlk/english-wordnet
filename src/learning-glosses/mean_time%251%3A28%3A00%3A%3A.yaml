simpleMeaning: In astronomy, a way of telling the hour from the steady movement of an imagined sun moving
  at a set speed round the middle of the sky
scope: In astronomy, time from the steady movement of an imagined sun; mean solar time is another name
  for this sense, not clock time set by law, and not time from the real sun's uneven movement.
examples:
- Mean time is based on an imagined sun that moves at a steady speed.
- Sailors once set their clocks by mean time rather than by the real sun.
