senseId: 'adulterate%2:30:00::'
synsetId: 00488684-v
simpleMeaning: To spoil a thing by mixing in something strange to it or of poor quality, often by putting
  poor stuff in place of the good stuff that was there.
scope: To spoil a thing by mixing poor stuff into it, also called stretch, load, dilute, or debase.
examples:
- The merchant was caught trying to adulterate the olive oil.
- They adulterated the wine with water and cheap colouring.
