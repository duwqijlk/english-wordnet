simpleMeaning: the quality of taking great care to do every part of a task fully and well
scope: This is about a person taking care to do every part of work well, not about a piece of work having
  full detail in every part.
examples:
- Her thoroughness meant every small part of the report was checked.
- His thoroughness at work saved the team from making mistakes.
