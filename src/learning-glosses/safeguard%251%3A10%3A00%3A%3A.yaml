synsetId: 06704012-n
simpleMeaning: a paper or a guard that lets a person travel safely through a place, above all in war
scope: A paper or guard that gives safe passage in war, not a general safety step (the batch-404 sense)
  and not a guard who protects a person at all times.
examples:
- The traveller carried a safeguard from the army to cross the front line.
- A safeguard from the commander let the convoy pass through the war zone.
