simpleMeaning: a channel or gutter on each side of the long beam along the bottom of a ship, carrying
  dirty water from the ship's bottom into the pump well
scope: A channel on each side of the beam along a ship's bottom that carries dirty water to the pump well;
  not a pipe on deck and not the pump itself.
examples:
- The limbers ran along the keelson to the pump well.
- Sailors cleared the limbers so the bilge water could drain.
