simpleMeaning: A calming medicine that slows the brain and nerve centre, eases worry and brings sleep
scope: A calming medicine that slows the brain and nerve centre, eases worry and brings sleep, also called
  sedative-hypnotic; not a plain painkiller and not a medicine that wakes a person up.
examples:
- The doctor gave her a sedative-hypnotic drug to help her sleep.
- A sedative-hypnotic drug slows the nervous system.
