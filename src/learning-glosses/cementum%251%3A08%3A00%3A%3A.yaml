simpleMeaning: a hard bone-like substance that covers the root of a tooth
scope: A hard bone-like substance that covers the root of a tooth; cement is another name for this sense,
  not the tooth itself and not the gum.
examples:
- Cementum covers the root of each tooth.
- The dentist found the cementum worn away at the root.
