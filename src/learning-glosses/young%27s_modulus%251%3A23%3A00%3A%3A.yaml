simpleMeaning: A number that tells how much a wire stretches when pulled.
scope: This number applies to a wire pulled lengthwise, and a high value means the wire stretches little.
examples:
- Young's modulus tells us how stiff the wire is.
- Engineers use Young's modulus to work out how much a wire will stretch.
