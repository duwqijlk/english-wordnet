senseId: frenzied%5:00:00:agitated:00
synsetId: 00087026-s
simpleMeaning: So upset and stirred up that a person cannot stay calm, from fear or another very strong
  feeling.
scope: Too upset to stay calm, from fear or another very strong feeling, with frantic as another name
  for this sense, and not wild action out of control, which is the other sense of the word.
examples:
- She gave a frenzied look at the flames and ran for the door.
- Frenzied screams followed the accident.
