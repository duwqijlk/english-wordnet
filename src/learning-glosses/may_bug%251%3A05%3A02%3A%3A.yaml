simpleMeaning: Any of several large, mostly brown North American leaf-eating insects, common in late spring;
  their young feed on the roots of grasses and other plants.
scope: These are large, mostly brown North American leaf-eating insects of late spring; June beetle, June
  bug and May beetle are other names for them.
examples:
- May bugs eat the leaves of the trees in late spring.
- The May bug larvae feed on the roots of grasses.
