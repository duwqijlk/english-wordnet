simpleMeaning: In architecture, the outer angle where a sloping side of a roof meets a sloping end
scope: In architecture, the outer angle of a roof, not the bones that hold up a person's legs and not
  the joint inside them.
examples:
- The roof's hip runs down to the corner of the house.
- Builders checked the hip where the two sloping parts of the roof meet.
