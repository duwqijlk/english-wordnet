simpleMeaning: A movement in Spanish and Spanish American poetry after World War I, given to free verse,
  complex new rhythms, and daring images and symbols instead of old forms and subjects.
scope: A poetry movement after World War I, not modernism and not surrealism; it broke with old forms
  and subjects.
examples:
- Ultraism broke with old forms in Spanish poetry.
- Borges praised Ultraism as the newest way of writing poems.
