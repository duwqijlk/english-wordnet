  holding a colour stuff like the green stuff in leaves.
scope: Free-living germs pink to deep blue-red-brown in colour; not germs that take the Gram stain and
  not green plants.
examples:
- Purple bacteria live free and hold a colour stuff like the green stuff in leaves.
- These purple bacteria do not take the Gram stain.
