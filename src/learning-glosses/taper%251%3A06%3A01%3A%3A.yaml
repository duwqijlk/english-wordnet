simpleMeaning: the loose cord in a candle or lamp that carries the fuel up to the flame
scope: 'Also called a wick: the cord in a candle or lamp that feeds the flame, not a shape that narrows
  to a point.'
examples:
- The taper in the old oil lamp drew the fuel up into the flame.
- She lit the taper and the lamp burned brightly all evening.
