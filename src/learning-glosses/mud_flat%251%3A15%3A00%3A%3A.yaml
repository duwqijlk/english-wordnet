simpleMeaning: a stretch of low wet land near where a river meets the sea, under water at high tide and
  bare at low tide
scope: A stretch of low wet land near where a river meets the sea, under water at high tide and bare at
  low tide; not a sandbank and not a marsh.
examples:
- The mud flat lay bare at low tide.
- Birds fed on the mud flat as the tide went out.
