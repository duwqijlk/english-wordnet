simpleMeaning: A worm that lives in soil, digs in it and lets air in; it often comes up when the ground
  is cool or wet, and fishers use it as bait
scope: 'Also called crawler, wiggler, nightcrawler, nightwalker, angleworm, dew worm, fishing worm, fishworm,
  and red worm: this is the worm that lives in soil, not a worm that lives in water or in a body.'
examples:
- After the rain, an earthworm came up onto the wet path.
- He put an earthworm on his hook to catch fish.
