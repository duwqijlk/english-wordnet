simpleMeaning: The office in the law part of the government that gives the main crime figures to the people
  who make rules for the whole country and for towns
scope: This is the office that gives the main crime figures to the people who make rules; BJS is another
  name for this sense, not a court and not a police station.
examples:
- The Bureau of Justice Statistics released new crime figures last year.
- Policy makers turn to the Bureau of Justice Statistics for crime data.
