simpleMeaning: good luck that comes all at once, like a sudden chance to make money
scope: 'Also called boom, gravy, windfall, godsend, bonanza, gold rush and manna from heaven: a sudden
  chance event that brings good luck, not a slow gain and not a planned pay rise.'
examples:
- The bunce came when a buyer paid far more than he had hoped.
- That sudden bunce let her pay off her debts at once.
