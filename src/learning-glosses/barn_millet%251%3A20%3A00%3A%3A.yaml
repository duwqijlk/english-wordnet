simpleMeaning: Cut at times for dry feed, or left for animals to eat, this rough one-year panic plant
  grows all over the world as a weed.
scope: Also called barnyard grass and barn grass, this is a rough one-year panic plant of the whole world,
  grown as a weed and used at times for dry feed.
examples:
- We cut the barn millet for hay.
- The barn millet was left for the cows to graze on.
