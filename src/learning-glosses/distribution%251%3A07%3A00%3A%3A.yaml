synsetId: 05094504-n
simpleMeaning: The way things are spread about over a place, a stretch of land, or a space.
scope: This is the way things are spread over a place, not a set of values in numbers, not the moving
  and selling of goods, and not the act of giving things out.
examples:
- The distribution of nerve fibres follows a set pattern.
- The distribution of the trees across the hills was even.
