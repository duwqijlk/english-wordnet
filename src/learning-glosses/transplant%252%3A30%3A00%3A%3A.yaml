simpleMeaning: To move something so it is in a different place or time
scope: To move something to a different place or time; transfer is another name for this sense, not to
  move an organ in surgery and not a plant that can be moved.
examples:
- The ancient Greek story was transplanted into modern America.
- The firm transplanted its old ways to the new office.
