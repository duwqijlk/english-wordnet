simpleMeaning: A person who feels driven to do certain things and cannot stop
scope: This is a person who cannot stop doing certain things, not a strong wish to do well and not a habit
  that comes from a troubled mind.
examples:
- He was a compulsive who checked the locks five times a night.
- The compulsive could not leave the house without counting the steps.
