simpleMeaning: in Europe in the 1600s and 1700s, books and pictures followed clear thought, self-control,
  and firm rules, the marks of this way of writing and making art
scope: 'Also called classicalism: a 17th- and 18th-century way of writing and art in Europe that prized
  reason and strict form, not the later way that prized feeling and free form.'
examples:
- Classicism often derived its models from the ancient Greeks and Romans.
- The classicism of the period shows in its strict forms and clear thought.
