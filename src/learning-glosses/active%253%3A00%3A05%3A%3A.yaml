simpleMeaning: In geology, describing a volcano that may still burst out with lava or ash someday.
scope: This only says the volcano has the power to erupt at some future time, unlike the sibling sense
  for one erupting now or likely to erupt soon; it also differs from senses about energetic people, being
  disposed to act, taking part, exerting influence, being in operation, growing more severe, military
  readiness, the sun, grammar, or full-time work, and from the noun for a chemical agent, the grammatical
  voice, or a participating member.
examples:
- Vesuvius is still active, so nearby towns keep evacuation plans ready.
- Geologists call a sleeping mountain active if it could erupt again.
