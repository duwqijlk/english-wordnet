simpleMeaning: the folded-back band of cloth around the end of a sleeve or trouser leg
scope: The folded cloth end of a sleeve or trouser leg, not the metal ring locked around a wrist and not
  the act of holding a person.
examples:
- The cuff of his shirt was dirty.
- She turned up the cuffs of her trousers.
