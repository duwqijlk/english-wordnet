simpleMeaning: A language of the Chadic group, spoken in the north of Nigeria, above all in Bauchi State,
  in the Tafawa Balewa area.
scope: 'Also called Sayanci language, Zaar, or Zaar language: a Chadic language of northern Nigeria, not
  a language of southern Nigeria and not a language of another part of Africa.'
examples:
- Sayanci is spoken in the north of Nigeria.
- Many people in Bauchi State speak Sayanci.
