simpleMeaning: a large stretch of land with the buildings and tools needed to keep and raise animals,
  most often cows and bulls
scope: 'Also called cattle ranch, ranch and spread: a large piece of land with buildings and tools for
  raising animals, not a small field and not a place that grows crops.'
examples:
- They bought a cattle farm in Texas.
- The cattle farm keeps hundreds of cows.
