simpleMeaning: to do with a teacher at a university, or like such a teacher
scope: To do with teachers at a university and the way they act or look, not to do with students or with
  teachers at a school.
examples:
- She spoke in a calm, professorial voice, as if she were giving a class.
- With his glasses and pile of books, he had a professorial look.
