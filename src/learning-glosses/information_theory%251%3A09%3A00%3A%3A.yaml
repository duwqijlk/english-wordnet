simpleMeaning: In computer science, a set of ideas, worked out with numbers, about how much can be sent
  and stored, and how well.
scope: A set of number-based ideas about how much can be sent and stored and how well, not a way of writing
  programs and not a study of one machine.
examples:
- He studied information theory at university.
- Information theory sets limits on how much data can be sent.
