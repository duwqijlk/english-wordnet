simpleMeaning: Any of various fungi of the family Lycoperdaceae whose round fruiting body releases a cloud
  of spores when mature
scope: Also called a puffball, it is one of the round fungi of the Lycoperdaceae family that let out a
  cloud of spores when ripe.
examples:
- The true puffball was ripe, and a touch made it puff out a cloud of spores.
- The true puffball was round like a small ball.
