simpleMeaning: so dull and with nothing of interest that it makes your mind feel tired
scope: This sense is about a thing that holds no interest and makes your mind feel tired, not about work
  that makes your body tired and not about a person who feels tired.
examples:
- The long speech was so wearisome that I stopped listening.
- They sat through a wearisome talk about old train times.
