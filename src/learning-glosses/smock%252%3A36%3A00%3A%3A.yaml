simpleMeaning: to sew straight rows across cloth so they cross at a slant, making it pretty
scope: To decorate cloth with crossed rows of straight stitches, not the loose coat itself.
examples:
- She smocked the front of the child's dress.
- The folk dancers wore smocked shirts.
