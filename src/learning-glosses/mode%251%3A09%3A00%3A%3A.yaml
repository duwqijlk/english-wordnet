simpleMeaning: In numbers, the value that turns up most often in a set of chance results.
scope: In numbers, the value that turns up most often in a set of chance results, not the forms of a verb
  and not the sorting of claims in logic.
examples:
- The mode of the rolls was six, since it came up most.
- In the survey, the mode was the answer given most often.
