simpleMeaning: The push of a gas, often meant as the push of the gas that sits over its own liquid.
scope: Also called vapour pressure, this is the push of a gas, often meant as the push of the gas over
  its own liquid, not the push of the liquid itself.
examples:
- They measured the vapor pressure of the gas above the liquid.
- The vapor pressure of the gas was the number they needed.
