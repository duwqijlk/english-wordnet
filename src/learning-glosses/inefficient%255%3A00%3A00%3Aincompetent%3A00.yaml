simpleMeaning: not able to do a job well, and not good enough for what is needed
scope: Also called ineffective. This sense is about a person or group that cannot do work well, not the
  sense of a way of working that wastes time or money.
examples:
- The inefficient workers could not finish simple jobs on time.
- He was an inefficient manager who could not plan the work well.
