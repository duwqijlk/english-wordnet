simpleMeaning: a tiny piece of matter carrying the force inside an atom's centre; a hadron, one of a group
  of such pieces, with a baryon number of zero
scope: A tiny piece of matter carrying the force inside an atom's centre; meson is another name for this
  sense, not a bit of matter that makes up atoms, and not a ray of light.
examples:
- A mesotron carries the force that holds the centre of an atom together.
- Physicists found the mesotron to be a hadron with a baryon number of zero.
