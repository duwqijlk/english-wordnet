simpleMeaning: any of several small bushy oaks, mostly American, that often rule thin dry soils, sometimes
  growing in thick close groups
scope: A small bushy oak of thin dry American soils, not a tall forest oak or a single shade tree.
examples:
- Scrub oak covers the dry hillside.
- The scrub oak forms dense thickets on the thin soil.
