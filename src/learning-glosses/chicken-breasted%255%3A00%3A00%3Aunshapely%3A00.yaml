simpleMeaning: A bone illness in childhood can leave a person with a chest out of shape, the bone down
  its front sticking out.
scope: This word is also called pigeon-breasted, and it is said of a person left with a chest out of shape
  by a bone illness in childhood.
examples:
- The chicken-breasted boy had a chest that stuck out at the front.
- Rickets in childhood left him chicken-breasted, with the bone down his chest sticking out.
