simpleMeaning: A box holding a magnetic strip, for use with sound or video recorders or computer systems
scope: A box holding a magnetic strip for sound or video recorders or computers; not a loose reel of film
  and not a disc.
examples:
- She put the tape cartridge into the video player.
- The tape cartridge held the whole film on one strip.
