simpleMeaning: A chemical made by plants that makes their stems and roots grow longer.
scope: A chemical made by plants that makes stems and roots grow longer, not a chemical that makes flowers
  or fruit grow and not a food for plants.
examples:
- Indoleacetic acid helps the stem grow longer.
- The plant makes indoleacetic acid in its growing tips.
