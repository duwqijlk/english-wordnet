simpleMeaning: all the old stories that belong to one people, institution, or person, taken together as
  one set
scope: The old stories of a people, institution, or person taken as one set, not one single story and
  not a history of real events.
examples:
- Greek mythology is full of gods and heroes.
- He studied the mythology of the Norse peoples.
