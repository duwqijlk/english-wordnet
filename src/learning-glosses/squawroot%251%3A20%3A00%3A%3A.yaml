simpleMeaning: A high herb from North America's east and from Asia, bearing blue fruit like berries and
  a fat gnarled root stock, once a cure.
scope: This sense is also called blue cohosh, blueberry root, papoose root, papooseroot, and squaw root.
examples:
- A squawroot grew in the east.
- Squawroots bore blue fruit.
