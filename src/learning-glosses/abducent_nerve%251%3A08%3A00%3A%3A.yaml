simpleMeaning: Outward turning of the eye starts when this small cord orders the straight muscle on the
  outer side to pull.
scope: Also called abducens, abducens nerve, abducent, nervus abducens, and sixth cranial nerve, this
  cord starts the outward turning of the eye by ordering the straight muscle on its outer side to pull.
examples:
- The abducent nerve tells the outer muscle of the eye when to pull.
- The eye turns outward on a signal from the abducent nerve.
