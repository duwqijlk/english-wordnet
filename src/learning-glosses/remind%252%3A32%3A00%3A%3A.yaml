schema: oewn-learning-gloss-v2
senseId: 'remind%2:32:00::'
synsetId: 00879379-v
simpleMeaning: Help a performer or speaker by supplying the next words they have forgotten or not fully
  learned.
scope: This sense shares its synset with prompt and cue; it is giving a performer the next words, not
  putting a fact back into someone's mind.
examples:
- When the actor forgot his line, the director reminded him from the wings.
- When the class faltered halfway through the poem, the teacher reminded them of the next line.
