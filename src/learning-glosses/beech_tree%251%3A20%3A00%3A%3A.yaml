simpleMeaning: any of several large trees that lose their leaves, with broad rounded crowns, smooth grey
  bark and small sweet three-cornered nuts in spiky cases, native to northern temperate regions
scope: This is the living tree; beech is another name for it, while the wood cut from it is a separate
  sense.
examples:
- The old beech tree in the churchyard has a wide, rounded crown.
- A beech tree's smooth grey bark stood out against the dark pines.
