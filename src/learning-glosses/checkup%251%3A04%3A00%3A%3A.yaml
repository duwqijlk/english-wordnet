simpleMeaning: a full check of the body, with different tests chosen for a person's age, sex and health
scope: Also called medical. This sense is a doctor's full test of the body with different tests, not one
  test for a single problem and not a check of a car or machine.
examples:
- She went to the doctor for a full checkup and several tests.
- He has a checkup every year so the doctor can test his heart and blood.
