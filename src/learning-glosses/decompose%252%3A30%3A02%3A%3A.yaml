simpleMeaning: to lose a stored electric charge, magnetic flux (the flow of magnetic force), or current
  (a flow of electricity)
scope: 'Also called decay and disintegrate: losing a stored charge or current, not rotting dead plants
  or animals and not breaking a thing into its parts.'
examples:
- As the particles decomposed, they gave up their stored charge.
- The system decomposed over time and lost its stored current.
