simpleMeaning: A piece of land, one fourth of a bigger piece, of 160 acres, half a mile long on each side
scope: A piece of land of 160 acres, half a mile on each side, not a part of a town and not a room in
  a building.
examples:
- The farm was made up of two quarter sections.
- He bought a quarter section of land in the west.
