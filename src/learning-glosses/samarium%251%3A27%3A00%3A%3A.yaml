simpleMeaning: A grey, shiny metal of the rare earth group, used in special alloys and found in two minerals,
  monazite and bastnasite.
scope: Also called Sm and atomic number 62; one of the rare earth metals, set apart from the common metals
  by its use in special alloys.
examples:
- Samarium is a grey, shiny metal of the rare earth group.
- Samarium is used in special alloys.
