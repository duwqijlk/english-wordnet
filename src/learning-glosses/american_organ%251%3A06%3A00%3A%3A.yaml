simpleMeaning: A musical instrument with free reeds, in which air is pulled in through the reeds by a
  suction bellows.
scope: A musical instrument with free reeds, in which air is pulled in through the reeds by a suction
  bellows, set apart from other keyboard instruments by its free reeds and suction bellows.
examples:
- The American organ filled the chapel with soft sound.
- She played hymns on the American organ.
