simpleMeaning: The young of a night moth that move in big groups and eat grains and alfalfa in the middle
  states of America.
scope: The young of a night moth that move in big groups and eat grains, not a single young moth or a
  moth that eats only leaves; also called army cutworm.
examples:
- Chorizagrotis auxiliaris young marched across the grain fields.
- The Chorizagrotis auxiliaris ate the alfalfa in great groups.
