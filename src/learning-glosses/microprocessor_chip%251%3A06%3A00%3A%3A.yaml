simpleMeaning: one small part of silicon crystal that carries electric signals, holding a whole small
  circuit inside one piece
scope: 'Also called chip, microchip, micro chip, and silicon chip: a bit of electric equipment that runs
  many jobs, not a full computer or a plain piece of metal.'
examples:
- The microprocessor chip in the laptop runs many of its jobs.
- A new microprocessor chip made the old printer work faster.
