senseId: 'leukemia%1:26:00::'
synsetId: 14266404-n
simpleMeaning: 'one of the four main kinds of cancer: a bad growth in the parts that make blood, with
  white blood cells growing in too great numbers, in a wrong way'
scope: This blood cancer, also called leukaemia, cancer of the blood, and leucaemia, is a growth in the
  parts that make blood, not a lack of blood and not another kind of cancer in another part of the body.
examples:
- The doctor told him he had leukemia and would need long care in hospital.
- Leukemia makes the body make too many white blood cells in a wrong way.
