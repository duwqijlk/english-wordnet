simpleMeaning: To give wholehearted support to a person, cause, or belief, and stay loyal to it
scope: Stick is another name for this sense; this is about loyal support for a belief or cause, not about
  one thing holding fast to another.
examples:
- The residents of this village adhered to Catholicism.
- She adheres to her principles even when it costs her.
