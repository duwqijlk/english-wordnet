simpleMeaning: This mineral of iron and sulfur (FeS) is brownish and is weakly drawn to a magnet.
scope: Also called magnetic pyrites and pyrrhotite, this brownish mineral of iron and sulfur (FeS) is
  weakly drawn to a magnet, not a stone that pulls hard at iron.
examples:
- The pyrrhotine in the rock was only weakly drawn to the magnet.
- In the sample, pyrrhotine showed only a weak pull toward the magnet.
