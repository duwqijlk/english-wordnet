simpleMeaning: The stir of an unborn child inside the womb, most often first felt by the 16th week of
  carrying the child
scope: The stir of an unborn child inside the womb, most often first felt by the 16th week, also called
  foetal movement; not a kick felt after birth and not the growth of the child.
examples:
- Fetal movement was felt in the sixteenth week.
- She counted the fetal movement each evening.
