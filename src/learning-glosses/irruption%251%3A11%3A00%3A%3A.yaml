simpleMeaning: Usually of something bad, a sudden, fierce happening that comes of itself, with no outside
  cause.
scope: Usually of something bad, a sudden, fierce happening that comes of itself, also called an outbreak
  or an eruption, not a sudden violent bursting in and not a sudden sharp rise in the numbers of a population.
examples:
- The irruption of fighting caught everyone by surprise.
- An irruption of fever swept through the town.
