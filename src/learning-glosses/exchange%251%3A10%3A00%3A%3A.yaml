simpleMeaning: a conversation in which people tell each other what they think, often a hostile or angry
  one.
scope: This is a sharing of opinions in talk, not a swap of goods, money, or prisoners.
examples:
- The meeting ended with a heated exchange.
- There was a sharp exchange between the two leaders.
