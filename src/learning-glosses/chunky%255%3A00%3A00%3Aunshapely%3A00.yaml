simpleMeaning: Made up of small lumps that stick together, or shaped like them
scope: Lumpy is another name for this sense; this is about small lumps that stick together, not about
  a person or thing that is short and thick.
examples:
- The dumplings were chunky pieces of uncooked dough.
- Stir the sauce until it is thick and chunky.
