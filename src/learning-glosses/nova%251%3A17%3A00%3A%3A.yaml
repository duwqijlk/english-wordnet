simpleMeaning: A star that throws off some of its matter as a cloud and grows brighter as it does so.
scope: Of a star that flared in the southern sky, growing brighter for a few weeks.
examples:
- A nova flared in the southern sky that winter.
- The nova grew brighter for a few weeks, then faded.
