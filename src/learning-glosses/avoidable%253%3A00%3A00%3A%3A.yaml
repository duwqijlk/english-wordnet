simpleMeaning: able to be stopped before it happens or kept away
scope: Also called evitable, this describes a thing that can be stopped or kept away, not a thing that
  must happen and cannot be stopped.
examples:
- The accident was avoidable, because the driver could have slowed down.
- With care, many small fires are avoidable in a dry wood.
