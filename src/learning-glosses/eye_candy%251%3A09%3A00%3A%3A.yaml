simpleMeaning: pictures or other things to look at that please the sight but ask little of the mind
scope: Pretty things to look at that ask little of the mind, not deep art and not a sweet food.
examples:
- The magazine spread was pure eye candy, with bright photos and little text.
- He added some eye candy to the website to draw in visitors.
