senseId: 'autobiographical%3:01:00::'
synsetId: 02661949-a
simpleMeaning: about a person's own life, or in the way of a book that a person writes about their own
  life
scope: This describes a book or writing about a person's own life, or writing in that way; it is not about
  the person who writes such a book.
examples:
- Her new novel has a strong autobiographical part about her childhood.
- He wrote an autobiographical account of his years as a soldier.
