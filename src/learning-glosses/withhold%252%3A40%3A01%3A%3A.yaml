simpleMeaning: to keep money back and not pay it out, when it is a payment that is due
scope: To keep money back instead of paying it out, not to keep a thing or a fact from someone.
examples:
- My employer is withholding part of my pay for tax.
- The bank decided to withhold the payment until the papers arrived.
