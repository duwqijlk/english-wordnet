simpleMeaning: the official act of saying something in public so people know about it
scope: This is the official act of telling the public about something, not a strong statement against
  something and not a private telling of news.
examples:
- The king made a proclamation to tell everyone about the new law.
- Her proclamation gave public notice that the market would close.
