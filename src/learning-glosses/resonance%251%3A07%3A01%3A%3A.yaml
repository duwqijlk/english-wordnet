simpleMeaning: the quality that spoken sounds with voice get from the hollow spaces in the throat, mouth,
  and nose as the sounds pass through them
scope: This is the quality in spoken voice sounds from the throat, mouth, and nose, not a strong shaking
  made by a smaller shaking and not the deep quality of a loud sound in general.
examples:
- The resonance of his voice made his speech sound rich and full.
- Her clear speech had a warm resonance from the spaces in her throat and mouth.
