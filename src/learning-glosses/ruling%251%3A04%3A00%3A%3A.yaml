simpleMeaning: The court's own account of why it reached its judgment, apart from the judgment itself
scope: 'Also called opinion: the reasons behind a court''s decision, as opposed to the decision itself.'
examples:
- The ruling set out why the court had found for the workers.
- In her ruling, the judge explained the grounds for the decision.
