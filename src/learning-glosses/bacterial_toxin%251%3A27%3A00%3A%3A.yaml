simpleMeaning: a poison made by the tiny living things called bacteria, either kept inside them or sent
  out by them
scope: A poison made by bacteria, not a poison from a plant or an animal and not the bacteria themselves.
examples:
- The bacterial toxin made the food unsafe to eat.
- Doctors tested the wound for a bacterial toxin.
