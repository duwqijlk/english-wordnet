simpleMeaning: A rattling noise made in sleep while a person breathes
scope: The rattling noise itself, not the act of making it and not the verb of breathing noisily in sleep.
examples:
- A loud snore rattled through the quiet room.
- The snore rose and fell like a rattling noise in the dark.
