simpleMeaning: A big shaggy-coated hooved animal of Canada and Greenland, halfway in size and shape between
  an ox and a sheep
scope: 'Also called musk ox and musk sheep: a big shaggy animal of the far north, halfway between an ox
  and a sheep in size and shape, not a true ox and not a true sheep.'
examples:
- We saw a herd of Ovibos moschatus grazing on the tundra in northern Canada.
- The Ovibos moschatus stood between the oxen and the sheep in size.
