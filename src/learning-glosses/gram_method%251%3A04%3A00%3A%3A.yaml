senseId: 'gram_method%1:04:00::'
synsetId: 00276595-n
simpleMeaning: 'A way of dyeing bacteria to sort them: germs dyed purple are treated with liquid, cleared
  with alcohol, dyed again, and rinsed in water, split by whether they stay purple.'
scope: Not other ways of testing germs, nor other dyes used in the lab; also called Gram's method, Gram's
  procedure, Gram's stain, and Gram stain.
examples:
- The Gram method sorts bacteria into two groups.
- The lab uses the Gram method to tell the two groups apart.
