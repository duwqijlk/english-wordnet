simpleMeaning: a short burst of light used to send a signal or make something visible
scope: A light burst used to send a signal or light something up, not the camera lamp that makes it and
  not the bare burst seen in lightning.
examples:
- A flash from the lighthouse warned the boats of the rocks.
- The sailor sent three quick flashes toward the shore.
