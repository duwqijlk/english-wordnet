simpleMeaning: to work out and record the position of a gene on a chromosome by comparing it with known
  DNA or gene sequences.
scope: This is about finding a gene's position on a chromosome, not about drawing a picture of the earth's
  surface.
examples:
- Researchers mapped the gene to a small region of chromosome seven.
- The team mapped the gene in relation to nearby DNA markers.
