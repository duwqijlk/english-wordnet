simpleMeaning: a scientist who studies living things, with a special focus on bacteria, very small living
  things too small to see
scope: A scientist whose work is studying bacteria, not a doctor who treats sick people and not a scientist
  who studies other living things.
examples:
- The bacteriologist grew the bacteria in dishes to study them.
- As a bacteriologist, she spends her days looking at samples under a microscope.
