simpleMeaning: a tiny red or purple mark on the skin, made by a small bleed from blood vessels in the
  skin, as in typhoid fever
scope: A tiny red or purple mark on the skin, made by a small bleed from blood vessels in the skin, not
  a bruise from a blow and not a rash.
examples:
- A petechia appeared on her arm after the fever.
- The doctor noted several petechiae on the child's skin.
