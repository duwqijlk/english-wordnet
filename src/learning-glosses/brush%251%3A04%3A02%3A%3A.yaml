simpleMeaning: the act of pulling a bristled tool through your hair
scope: The action of tidying your hair with a brush; brushing is another name for this sense. Not the
  action on teeth, and not the tool itself.
examples:
- She gave her hair a quick brush before the meeting.
- A quick brush left her hair smooth and neat.
