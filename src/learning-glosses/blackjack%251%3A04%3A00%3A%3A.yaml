simpleMeaning: A card game played for money, where each player tries to hold cards that add up to more
  than the dealer's, without going past twenty-one.
scope: A gambling game using cards, won by holding a higher count than the banker up to but not exceeding
  21, not the scrubby tree, not the pirate flag, and not the leather-covered weapon.
examples:
- They played blackjack until midnight at the kitchen table.
- He won a hand of blackjack with twenty-one.
