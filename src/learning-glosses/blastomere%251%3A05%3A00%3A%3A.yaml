simpleMeaning: a single cell that comes from a fertilized egg splitting into two or more cells
scope: A cell that comes from a fertilized egg splitting into parts, not the egg itself and not a growth
  of young cells such as a blastoma.
examples:
- Each blastomere in the early egg can grow into part of the body.
- The first blastomere split again within a few hours.
