simpleMeaning: A look that is a bit yellow in a baby just born, which most often goes away on its own.
scope: This is a look that is a bit yellow in a baby just born, which most often goes away on its own;
  icterus neonatorum and jaundice of the newborn are other names for this sense, not a yellow look caused
  by a liver illness and not a lasting change in how a baby looks.
examples:
- The baby showed physiological jaundice of the newborn on the second day.
- Physiological jaundice of the newborn went away without treatment.
