senseId: 'accordion_fold%1:25:01::'
synsetId: 92423476-n
simpleMeaning: a long run of straight, side-by-side creases made in turn to the front and to the back,
  so the sheet bends back and forth like a zig-zag
scope: 'Also called concertina fold, z-fold, and zig-zag fold: a sheet creased back and forth in straight
  parallel lines, not a single crease or a roll.'
examples:
- The map uses an accordion fold so it opens out in a long strip.
- She made an accordion fold in the paper to fit it in the envelope.
