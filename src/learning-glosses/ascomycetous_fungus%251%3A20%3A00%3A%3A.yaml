simpleMeaning: Its tiny specks form inside a small bag, which marks this living thing as one of a big
  group.
scope: Ascomycete is another name for this one, a member of a big group whose tiny specks form inside
  a small bag.
examples:
- Tiny specks grew inside the small bags of the ascomycetous fungus.
- Small bags held the tiny specks of the ascomycetous fungus.
