simpleMeaning: It describes something concerned with the effects that changes to nature have on living
  things and their habitats.
scope: This is about harm to nature, not about ordinary surroundings such as the conditions in a room.
examples:
- The company published an environmental impact report.
- Environmental damage from the spill will last for years.
