simpleMeaning: A low space in front of a stage, where a band of players plays music to go with the people
  on the stage
scope: A low space in front of a stage where players play music for those on the stage, also called pit;
  not the stage itself and not a place for the crowd.
examples:
- The orchestra pit was below the stage.
- The musicians sat in the orchestra pit during the show.
