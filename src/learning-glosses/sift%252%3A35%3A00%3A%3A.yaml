senseId: 'sift%2:35:00::'
synsetId: 01462658-v
simpleMeaning: to pass a thing through a fine net or strainer so the big bits stay back and the fine bits
  go through
scope: 'Also called strain: to pass something through a fine net so the coarse bits stay behind, not to
  sort things by hand and not to pour a liquid off.'
examples:
- Sift the flour before you mix it into the dough.
- She sifted the sand to take out the small stones.
