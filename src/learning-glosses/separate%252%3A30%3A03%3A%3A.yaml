simpleMeaning: come apart into pieces or broken bits, no longer holding together
scope: This describes something falling apart on its own, not the act of pulling a mixture into ingredients
  or cutting it into portions.
examples:
- The old wooden crate separated into pieces when it hit the floor.
- The clay pot separated into fragments after the fall.
