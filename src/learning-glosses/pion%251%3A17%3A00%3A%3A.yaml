simpleMeaning: This tiny bit helps hold the centre of an atom together, and it is made when tiny bits
  of matter crash into each other at very high speed
scope: Also called a pi-meson, this tiny bit holds the centre of an atom together, not a bigger bit of
  matter and not a ray of light.
examples:
- A pion helps hold the centre of an atom together.
- When tiny bits of matter crash into each other, a pion can be made.
