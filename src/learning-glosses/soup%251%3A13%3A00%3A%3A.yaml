simpleMeaning: a liquid food made especially from meat, fish, or plant stock, often with bits of solid
  food in it
scope: A liquid food made especially from meat, fish, or plant stock, not any thick mix that merely looks
  or feels like it.
examples:
- She made a big pot of soup for lunch.
- The soup had bits of carrot and potato in it.
