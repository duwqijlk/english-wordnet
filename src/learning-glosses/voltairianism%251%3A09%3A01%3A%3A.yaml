simpleMeaning: The ideas and ways of Voltaire, marked by doubt about religion yet belief in a god, a stand
  against narrow minds, and sharp attacks on bigotry.
scope: The outlook of the French thinker Voltaire; its nearest kin are the ideas of other Enlightenment
  writers such as Rousseau and Diderot.
examples:
- Voltairianism shaped the way he wrote about religion and free thought.
- Her essay traced Voltairianism back to Voltaire's attacks on bigotry.
