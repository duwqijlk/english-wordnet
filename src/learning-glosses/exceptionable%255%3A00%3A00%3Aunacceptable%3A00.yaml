simpleMeaning: Said of something a person may find fault with, so it can be objected to or argued about
scope: 'Also called objectionable: said of something a person may find fault with, so it can be objected
  to or argued about, not plainly wrong and not free from all doubt.'
examples:
- The committee found parts of the report exceptionable and asked for changes.
- His exceptionable remarks drew objections from the crowd.
