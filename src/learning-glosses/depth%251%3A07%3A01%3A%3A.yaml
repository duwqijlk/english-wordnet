simpleMeaning: how much thought or feeling there is in the mind, past what is plain on the surface
scope: This is about thoughts and feelings, not the size of a thing in space and not a person's skill
  at thinking hard about ideas.
examples:
- The depth of her grief surprised even her closest friends.
- His poems are loved for the depth of thought in them.
