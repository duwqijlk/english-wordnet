simpleMeaning: A brain disease that destroys coordination, then causes paralysis and death within a year;
  it probably spread through eating infected human brains and died out when that practice ended.
scope: This is the fatal brain disease once spread by eating infected human tissue, not a general memory
  disorder and not the similar illness caught from diseased cattle.
examples:
- Kuru was once common among the Fore people of Papua New Guinea.
- Researchers studied kuru to learn how a brain disease could spread through eating infected tissue.
