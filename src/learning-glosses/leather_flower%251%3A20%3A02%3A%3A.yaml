simpleMeaning: a climbing low shrub of the south-east United States, with big red-purple blooms shaped
  like bells, their tough outer leaves bent back at the tips
scope: 'Also called vase-vine and vase vine: a climbing shrub with big red-purple bell-shaped blooms,
  not the woody vine of the southern United States with purple or blue blooms.'
examples:
- The leather flower climbed over the fence in big red-purple blooms.
- We saw a leather flower with bell-shaped blooms in the garden.
