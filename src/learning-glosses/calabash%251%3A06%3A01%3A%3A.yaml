simpleMeaning: For smoking, this tool has a stem that bends and a wide cup made from a gourd.
scope: Also called a calabash pipe, this tool for smoking has a stem that bends and a wide cup made from
  a gourd, not the plant that bears such gourds and not the bottle made from one.
examples:
- He filled his calabash with tobacco and lit it.
- The calabash sat beside his chair.
