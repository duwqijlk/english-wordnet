simpleMeaning: A loss of the power of speech in which a person speaks smoothly but with no sense, and
  can hardly grasp words heard or read.
scope: 'Also called fluent aphasia, impressive aphasia, receptive aphasia and sensory aphasia: the fluent
  form, in which speech still flows smoothly while sense and the grasp of heard or written words are lost.'
examples:
- Wernicke's aphasia left him speaking without sense.
- Wernicke's aphasia made it hard for her to grasp spoken words.
