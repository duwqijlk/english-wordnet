simpleMeaning: making things line up or go into the right place
scope: Describing something that makes other things line up or go into the right place, not the act of
  putting something in a place.
examples:
- The positioning arms on the machine made each bottle line up before it was filled.
- A positioning tool made each part go into the right place.
