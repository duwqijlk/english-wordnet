scope: A clever weapon that follows the light beam bounced off its mark and steers itself down onto it;
  not a weapon that falls blind, and not a weapon aimed by hand.
examples:
- Laser-guided bombs cannot be used in cloudy weather.
- The laser-guided bomb hit its mark in the dark.
