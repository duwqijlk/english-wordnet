simpleMeaning: The business of building new structures and repairing existing ones.
scope: This is the paid industry that erects and repairs structures, not the general act of putting something
  together, not a group of words forming a unit of a sentence, not the process of combining ideas into
  a coherent mental object, not the finished object or complex structure (that is the other building-related
  sense), not the geometric drawing used in a proof, and not an interpretation of a text or action.
examples:
- He works in construction, putting up office blocks and repairing old factories.
- The construction industry slowed sharply when the housing market collapsed.
