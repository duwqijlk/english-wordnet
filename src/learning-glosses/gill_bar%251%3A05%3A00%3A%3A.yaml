simpleMeaning: Fish and land-and-water animals breathe through parts held up by curved pieces of bone
  or gristle, one on each side of the throat.
scope: Branchial arch and gill arch are other names for this curved piece of bone or gristle beside the
  throat.
examples:
- The gill bar held the gills in place.
- Each gill bar lay on one side of the throat.
