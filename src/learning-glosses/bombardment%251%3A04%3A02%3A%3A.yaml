simpleMeaning: the act of hitting a body or a material with tiny parts of matter that have much energy,
  such as electrons or alpha rays
scope: This is the science sense about hitting matter with tiny parts that have much energy; it is not
  many words or questions sent fast and without stopping, and not an attack with bombs.
examples:
- The bombardment of the metal with electrons changed its surface.
- In the test, bombardment by alpha rays was used to study the material.
