simpleMeaning: a measure of length in the metric system, one hundredth of a metre
scope: A measure of length in the metric system, one hundredth of a metre; cm and centimetre are other
  names for this sense, and it is not an inch or a millimetre.
examples:
- The pencil is about fifteen centimeters long.
- Measure the cloth in centimeters, not inches.
