simpleMeaning: a tree with wood much like that of a related high-country tree, the tallest tree in Australia
  and the tallest hardwood in the world
scope: A very tall Australian tree with wood like a related high-country tree; not a pine and not a small
  mountain shrub.
examples:
- The mountain ash towered over the forest.
- They measured a mountain ash that stood taller than any other hardwood.
