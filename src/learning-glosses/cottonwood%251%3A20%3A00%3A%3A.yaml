simpleMeaning: any of several trees in North America of the genus Populus (one named group of trees),
  with a small bunch of soft white hairs on each seed
scope: One of the North American Populus trees with soft hairs on its seeds; not the other cottonwood
  sense, an American basswood tree of the Allegheny region.
examples:
- A tall cottonwood grew by the river, its seeds floating on soft white hairs.
- Cottonwoods line the dry stream bed for miles.
