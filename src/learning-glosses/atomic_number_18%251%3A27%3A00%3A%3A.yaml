simpleMeaning: A gas with no colour and no smell that will not join with other things; one of six such
  gases, about one part in a hundred of the air.
scope: A gas with no colour and no smell, also called Ar and argon; set apart from other gases that join
  with other things and from gases with a smell.
examples:
- Atomic number 18 makes up about one part in a hundred of the air.
- A light bulb can be filled with atomic number 18 to keep the wire from burning.
