simpleMeaning: having to do with planning how goods and people are moved, kept in a place, and sent where
  they are needed
scope: Also called logistic, this is about planning how goods and people are moved and kept; it is not
  about clear thinking or reasons.
examples:
- Moving food to all the shops was a logistical problem for the company.
- They faced logistical delays in sending tools to the workers.
