simpleMeaning: a drug with a three-ring shape, used to treat low mood, that wakes up the body's movement
  and action
scope: A drug for low mood that lifts body movement and action, not a drug that calms or puts a person
  to sleep.
examples:
- The doctor gave her desipramine for her low mood.
- Desipramine helped him feel more awake and active.
