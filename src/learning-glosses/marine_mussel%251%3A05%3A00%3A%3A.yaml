simpleMeaning: This sea shellfish fastens itself to hard things, above all where the sea meets the land
  at low tide, and it has two shells, one of them dark and long.
scope: Also called mytilid; a sea shellfish with two shells and a dark long shell, fastened to hard things
  where the tide goes out.
examples:
- The marine mussel clung to the rock at low tide.
- Fishermen gathered marine mussels from the harbour wall.
