synsetId: 04535374-n
simpleMeaning: The green coat that slowly grows on copper, brass, or bronze after it has stood in air
  or water for a long time.
scope: A green patina that forms on copper or brass or bronze exposed to air or water for long periods,
  not the blue or green powder used as paint pigment, and not the verb sense of coloring a thing verdigris.
examples:
- Verdigris covered the old copper roof in green.
- The bronze statue was touched with verdigris.
