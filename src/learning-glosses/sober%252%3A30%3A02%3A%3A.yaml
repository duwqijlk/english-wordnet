simpleMeaning: to make someone stop being drunk and become clear in mind again
scope: To make someone no longer drunk; not to become clear in mind yourself after drinking too much,
  and not the dull-color or serious-manner word for a person or thing.
examples:
- She gave him strong coffee to sober him after the party.
- A long walk in the cold air sobered the men.
