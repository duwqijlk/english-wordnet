simpleMeaning: said by a court to be not guilty of a named crime or wrong act, and free from blame in
  law
scope: 'Also called not guilty: this means a court has said a person did not do the crime, not that the
  person is good in every way or was never charged.'
examples:
- He was acquitted of theft by the court.
- After the trial, she stood acquitted on all charges.
