simpleMeaning: a one-year weed of Europe and North America with a ring of leaves at the base and tiny
  blooms, then long seed cases
scope: Also called shadflower and whitlow grass; a one-year weed with a ring of base leaves, not a garden
  flower grown for show.
examples:
- Shad-flower grew as a weed along the path.
- The shad-flower had tiny blooms and long seed cases.
