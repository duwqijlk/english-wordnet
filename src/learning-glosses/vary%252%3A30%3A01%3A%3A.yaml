simpleMeaning: to become different in one way, but not lose for ever what a person or thing was like at
  first
scope: This sense is also called change and also called alter; it is becoming different in one way while
  staying the same in nature, not making something different.
examples:
- His feelings can vary with the weather, but he is still the same person.
- The shop's fruits vary with the season, but it is still the same shop.
