simpleMeaning: used most often of muscles that bring parts close together toward the midline of the body
  or toward a part beside them
scope: A word for a muscle that brings parts close together toward the midline of the body or toward a
  part beside them, also called adducent or adducting; not a muscle that spreads parts apart.
examples:
- The adductive muscles of the shoulder pull the arm in toward the body.
- Her adductive thigh muscles drew her legs together.
