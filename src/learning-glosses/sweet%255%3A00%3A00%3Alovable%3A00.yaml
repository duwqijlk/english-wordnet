simpleMeaning: Having a very gentle, kind nature, like an angel's.
scope: This is not the sense about the taste of sugar; it describes a person's kind and gentle character.
examples:
- Their youngest daughter is a sweet child who helps everyone.
- He gave her a sweet smile and offered to carry her bags.
