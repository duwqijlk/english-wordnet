simpleMeaning: Any stuff that can break open red blood cells and let out the hemoglobin inside them.
scope: Any stuff that breaks open red blood cells and frees their hemoglobin; erythrocytolysin, erythrolysin
  and haemolysin are other names for this sense, and this is not a stuff that builds blood cells or one
  that clots blood.
examples:
- The venom acted as a hemolysin, breaking open the red blood cells.
- A hemolysin in the sample let hemoglobin leak from the cells.
