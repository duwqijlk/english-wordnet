simpleMeaning: In economics, the consuming of goods to meet needs or to make things.
scope: This is the economics sense of consuming goods, not the act of employing something, not the purpose
  something serves, not a helpful service, not a habitual behavior pattern, and not a legal right to benefit
  from property.
examples:
- The use of coal in manufacturing fell as factories switched to gas.
- Economists study how the use of goods satisfies human needs.
