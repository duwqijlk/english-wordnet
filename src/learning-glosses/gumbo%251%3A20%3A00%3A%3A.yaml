simpleMeaning: Tall coarse one-season Old World tropical plant, widely grown in the southern US and West
  Indies for long sticky green pods, base of soups and stews; sometimes classed in Hibiscus.
scope: This is the plant, not the soup or stew made from its pods, nor the heavy clay soil also called
  gumbo.
examples:
- The gumbo in their garden grew taller than the fence.
- They planted gumbo beside the peppers this spring.
