simpleMeaning: A sailor's stew made from meat, vegetables and hard dry bread.
scope: This is a stew of meat, vegetables and hard dry bread eaten by sailors, not a thin soup and not
  a stew eaten only on land; lobscouse and scouse are other names for this sense.
examples:
- The crew shared lobscuse after the long watch.
- Lobscuse was the usual supper aboard the old ship.
