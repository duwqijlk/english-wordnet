simpleMeaning: a court paper saying that a dead person's last wishes are true and giving those named to
  carry them out the power to deal with the goods left behind
scope: A court paper that says a dead person's last wishes are true and lets the named persons deal with
  the goods left behind; also called probate; not a paper that only names who gets what, and not a court
  order to pay a debt.
examples:
- The probate will was read in court before the goods were shared out.
- After the probate will was granted, the executors could sell the house.
