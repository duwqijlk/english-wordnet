simpleMeaning: A build-up of an iron-rich substance that is not normal, often a sign of thalassemia or
  hemochromatosis.
scope: This is a build-up of an iron-rich substance that is not normal, not a wound or a bruise; also
  called hemosiderosis.
examples:
- The doctor said the haemosiderosis was causing damage to his liver.
- Haemosiderosis can follow repeated blood transfusions.
