simpleMeaning: Spiny and deep-rooted, this shrub of the southwestern US and Mexico shrugs off drought
  and yields sugary pods that feed livestock. It tends to take over in broad, dense thickets.
scope: The sweet-podded mesquite of the desert Southwest; not the screwbean or velvet mesquites, whose
  pods or leaves differ.
examples:
- Cattle rested in the shade of a honey mesquite.
- Honey mesquite pods made good fodder in the dry season.
