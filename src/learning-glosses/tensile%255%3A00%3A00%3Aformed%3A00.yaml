senseId: tensile%5:00:00:formed:00
synsetId: 02151851-s
simpleMeaning: Able to be shaped, bent, or pulled out long.
scope: This sense is also called pliable, malleable, and pliant, for what is able to be shaped, bent,
  or pulled out long, unlike the sense for what is of or to do with tension.
examples:
- The metal is tensile and can be drawn out long.
- The wire is tensile and bends without breaking.
