simpleMeaning: People joined by a shared love of horses, of riding on horseback, and of horse races
scope: This is a group of people who love horses and horse riding and racing; horsey set is another name
  for this sense, not a riding club that trains riders and not a group of horse owners.
examples:
- The horsy set met at the racecourse every spring.
- He spent his weekends with the horsy set.
