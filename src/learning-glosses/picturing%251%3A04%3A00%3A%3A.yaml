simpleMeaning: showing a thing in a picture, as a photo or a painting does
scope: A picture made of a thing, as in a photo or a painting, not a written account of it.
examples:
- The picturing of the old town in the book brought it to life.
- Her picturing of the valley in oils hung in the hall.
