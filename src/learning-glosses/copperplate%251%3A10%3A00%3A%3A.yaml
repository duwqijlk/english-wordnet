simpleMeaning: A fine, flowing way of writing by hand, copied from the writing on engraved copper plates.
scope: A graceful style of handwriting copied from engraved copper plates, not the engraved plate itself
  and not a print made from one.
examples:
- She wrote the invitations in copperplate.
- His copperplate was neat and flowing.
