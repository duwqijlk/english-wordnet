simpleMeaning: a sloping mark put over a vowel to show how to say it
scope: A sloping mark over a vowel showing how to say it, also called acute and aigu; not the mark that
  shows a low tone and not a mark over a consonant.
examples:
- The acute accent over the e shows it is said with a rising sound.
- She put an acute accent on the final vowel.
