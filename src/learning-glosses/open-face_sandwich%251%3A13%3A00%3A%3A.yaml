simpleMeaning: A slice of bread with food on top and no second slice of bread over it
scope: A slice of bread with food on top and no second slice over it, also called open sandwich; not a
  sandwich with two slices of bread and not a slice of bread on its own.
examples:
- She ordered an open-face sandwich with ham on top.
- The open-face sandwich had cheese melted over the bread.
