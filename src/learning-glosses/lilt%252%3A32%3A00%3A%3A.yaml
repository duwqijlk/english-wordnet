simpleMeaning: to say words in a very careful way, with a clear beat
scope: To say words in a very careful way, with a clear beat, not to sing and not to speak in a flat voice.
examples:
- She lilted the words as she read the poem aloud.
- He lilted his greeting as he walked in.
