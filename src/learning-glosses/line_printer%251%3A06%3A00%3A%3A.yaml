simpleMeaning: A whole row of written marks at a time is printed by this machine that works with a computer
scope: 'Another name for a line-at-a-time printer: a machine that works with a computer, not a machine
  that prints one mark at a time and not a hand tool.'
examples:
- The office line printer churned out the whole report in rows.
- Our old line printer could print a full row of text at once.
