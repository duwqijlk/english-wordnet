simpleMeaning: Not fixed firmly in place, so it may shake or move.
scope: A thing that is not fixed in place and may move or fall, not a person who feels unsure of themselves.
examples:
- She climbed the unsteady ladder with great care.
- The unsteady table rocked each time someone leaned on it.
