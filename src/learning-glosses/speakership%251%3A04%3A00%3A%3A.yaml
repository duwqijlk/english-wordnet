simpleMeaning: the job of being the Speaker, the person who runs the meetings of a law-making group
scope: The job of the Speaker who runs the meetings of a law-making group; not the job of a chair of a
  club and not the job of a president.
examples:
- She won the speakership after a long vote.
- The speakership gives him the power to call on members to speak.
