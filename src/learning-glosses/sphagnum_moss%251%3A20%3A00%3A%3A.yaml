simpleMeaning: The dead parts of these pale or ash-grey soft plants pile up and turn into peat, one of
  many kinds of them.
scope: It is also called sphagnum, bog moss and peat moss, one of many kinds of pale or ash-grey soft
  plants whose dead parts pile up to make peat.
examples:
- The sphagnum moss had turned to peat.
- A bed of sphagnum moss lay under the trees.
