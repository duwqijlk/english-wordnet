simpleMeaning: A land worm that burrows into soil, helps let air in, often surfaces when ground is cool
  or wet, and is used by anglers as bait
scope: Also called an earthworm, a crawler, a wiggler, a nightcrawler, a nightwalker, an angleworm, a
  fishing worm, a fishworm, or a red worm; not a worm that lives in the sea.
examples:
- After the rain, dew worms came up onto the wet ground.
- The angler put a dew worm on his hook as bait.
