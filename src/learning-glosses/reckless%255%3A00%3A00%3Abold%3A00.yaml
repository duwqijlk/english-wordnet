simpleMeaning: showing in a bold, open way that you do not care about danger or about what may happen
  because of what you do
scope: Also called rash. This sense is about boldly having no care for danger or for what may happen;
  not the sense that means careless and showing no concern in a general way.
examples:
- The reckless driver raced down the icy road with no thought for anyone's safety.
- He made a reckless attempt to climb the mountain alone in a storm.
