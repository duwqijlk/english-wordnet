simpleMeaning: A middle-sized cone-bearing tree of California and Oregon with branches that hang down.
scope: Also called the weeping spruce and Picea breweriana, this middle-sized cone-bearing tree of California
  and Oregon is set apart by branches that hang down, unlike the blue spruce and the white spruce, which
  are other cone-bearing trees of North America.
examples:
- Brewer's spruce shaded the cabin in summer.
- We planted a Brewer's spruce by the road.
