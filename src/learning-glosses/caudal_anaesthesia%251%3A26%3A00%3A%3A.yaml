simpleMeaning: Numbing of one part of the body, brought on by putting a numbing drug into the tail end
  of the spine's canal, now mostly replaced by epidural numbing.
scope: Numbing of one part of the body, brought on by putting a numbing drug into the tail end of the
  spine's canal, also called caudal anesthesia and caudal block.
examples:
- Caudal anaesthesia numbed her lower body.
- The doctor used caudal anaesthesia.
