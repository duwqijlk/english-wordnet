simpleMeaning: Marked, or changed in colour, by something from outside that got on it
scope: A mark or change of colour from something that got on a thing, not a coat of colour or varnish
  put on it.
examples:
- The stained tablecloth would not come clean, however hard she washed it.
- Her cheeks were stained with tears after the long sad day.
