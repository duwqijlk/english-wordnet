simpleMeaning: a road vehicle set up so people can sleep and live in it while on a trip for fun
scope: 'Also called a camper or a motor home: a vehicle for living in while on a trip, not a bus for day
  trips and not a tent.'
examples:
- We hired a camping bus and drove it along the coast for a week.
- The camping bus had a small kitchen and two beds at the back.
