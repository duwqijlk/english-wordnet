simpleMeaning: a man who works as a servant in a large place such as a palace, to do small jobs for others
  and to do work around the place
scope: A man servant who does small jobs in a large house or palace, not the head servant and not a soldier
  who walks.
examples:
- A footman opened the palace door and took the letter.
- Two footmen carried the bags into the large house.
