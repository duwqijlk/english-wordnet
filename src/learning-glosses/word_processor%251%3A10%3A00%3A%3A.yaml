simpleMeaning: a computer program that gives you the tools to type, edit, lay out and print written work
scope: This is a computer program for writing, changing, setting out and printing text; word processing
  system is another name for this sense, not a printer and not a typewriter.
examples:
- He opened the word processor and typed his letter.
- The word processor saved her work and printed a clean copy.
