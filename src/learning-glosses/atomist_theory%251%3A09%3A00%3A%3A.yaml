simpleMeaning: All stuff, in chemistry, is built from tiny separate bits that cannot be split or destroyed
  and can be counted to an end
scope: Also called atomic theory, atomism, or atomistic theory, this idea in chemistry says all stuff
  is made of tiny bits, not of stuff that can be split without end.
examples:
- An atomist theory says all stuff is made of tiny bits.
- Democritus held an atomist theory of the universe.
