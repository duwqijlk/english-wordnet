simpleMeaning: Measuring how the mind works is what this part of the study of the mind does
scope: 'Psychometrika and psychometrics are other names for this sense: a part of the study of the mind
  that measures how the mind works, not the study of the mind in general.'
examples:
- Psychometry gave the school a way to measure pupils' reading skill.
- The clinic uses psychometry to test memory after a head injury.
