simpleMeaning: In psychology, doing a thinking task made of several parts, a task that changes what the
  mind holds.
scope: In psychology, this is doing a thinking task made of several parts, a task that changes what the
  mind holds; process, operation, mental process and cognitive process are other names for this sense,
  not a simple reflex and not a movement of the body.
examples:
- Remembering a name is a cognitive operation.
- The cognitive operation of remembering took her a moment.
