simpleMeaning: In physics, the angle that a magnetic needle makes with the flat plane where the earth
  and sky meet
scope: In physics, this is an angle made by a magnetic needle; it is not a candle, not a sudden fall in
  an amount, and not a thief.
examples:
- They measured the dip of the magnetic needle at that place.
- The dip of the needle grows bigger near the poles.
