simpleMeaning: Showing a thing by drawing or painting it, or by some like means.
scope: Showing a thing by drawing or painting it, or by some like means; portrayal and depiction are other
  names for it; not a drawing of outlines only, and not a vivid description in words.
examples:
- The delineation of the coastline was exact.
- Their delineation of the scene caught every detail.
