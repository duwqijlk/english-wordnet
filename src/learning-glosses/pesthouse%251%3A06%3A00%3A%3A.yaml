simpleMeaning: Most of all for leprosy, this is a place where sick people with diseases that spread are
  cared for
scope: 'Also called a lazar house, a lazaret, a lazarette, or a lazaretto: a place where sick people with
  diseases that spread are cared for, not a normal hospital and not a home for the sick in general.'
examples:
- The sick were sent to the pesthouse outside the town.
- A pesthouse stood on the hill, far from other houses.
