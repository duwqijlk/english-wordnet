synsetId: 00741148-n
simpleMeaning: In law, carelessness by two or more people acting on their own; the person bringing the
  case may sue both at once or one at a time
scope: In law, carelessness by two or more people acting on their own, not carelessness by one person
  and not a plan made together.
examples:
- Concurrent negligence let the plaintiff sue both drivers at once.
- The court found concurrent negligence by the two firms.
