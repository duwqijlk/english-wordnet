simpleMeaning: A part of a sentence that leans on the rest of it and cannot be left out without changing
  what the group of words it goes with means.
scope: It is a part of a sentence, not a free-standing sentence of its own, and it narrows what the group
  of words it goes with means.
examples:
- The restrictive clause 'who lives next door' tells us which neighbour we mean.
- Without the restrictive clause, the sentence would point to a different group of people.
