simpleMeaning: A fast-growing tropical American evergreen with white flowers and edible fruit; its bark
  gives a soft fiber for rope and its timber is valued for barrel staves.
scope: Another name for calabura and calabur tree, the same fast-growing tropical American evergreen;
  this is the tree itself, not its fruit or fiber.
examples:
- The silk wood was felled for barrel staves.
- Gardeners value silk wood for its quick growth and white flowers.
