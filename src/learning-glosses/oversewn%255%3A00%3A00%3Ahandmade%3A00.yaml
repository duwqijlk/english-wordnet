simpleMeaning: Sewn with short straight stitches that cross over the join and pull the two edges close
  together
scope: 'Also called overhand: sewn with short straight stitches that cross over the join and pull the
  two edges close, not sewn with long loose stitches and not glued together.'
examples:
- The oversewn seam held the two pieces of cloth together.
- She left the edges oversewn so they would not fray.
