simpleMeaning: in a way that lets people do or have what they want, without being strict with them
scope: This is letting people do or have what they want in a kind, not strict way; it is not being strict
  and saying no to them.
examples:
- She smiled indulgently and let the children eat another piece of cake.
- He indulgently waved away the late homework and told the class not to worry.
