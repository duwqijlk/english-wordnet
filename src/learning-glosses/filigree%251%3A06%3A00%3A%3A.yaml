simpleMeaning: fine, detailed work for beauty, usually in gold, silver, or other fine wire that is twisted
scope: 'Also called filagree or fillagree: fine twisted-wire work for beauty, usually in gold or silver,
  not the act of making such work.'
examples:
- The ring had fine filigree around the stone.
- She wore earrings of gold filigree.
