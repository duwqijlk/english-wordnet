  groups at the ends of its stems.
scope: A garden plant of Europe and Asia with bright red flowers in thick groups, also called maltese
  cross; not a carnation and not a poppy.
examples:
- Scarlet lychnis brightens the garden in June.
- The scarlet lychnis stood in thick red groups.
