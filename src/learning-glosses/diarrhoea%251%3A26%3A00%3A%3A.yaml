simpleMeaning: Frequent passing of watery waste from the bowels, which can be a sign of infection, food
  poisoning, a swelling of the large gut, or a growth in the gut.
scope: Frequent watery bowel movements, also called diarrhea, looseness, or looseness of the bowels.
examples:
- The child had diarrhoea after eating the spoiled food.
- Diarrhoea can leave a person weak from loss of water.
