simpleMeaning: a kind of needlework in which bunches of straight threads running side by side are tied
  together with open stitches
scope: This is needlework tying bunches of threads together; fagoting is another name for this sense;
  not plain sewing and not weaving cloth.
examples:
- Faggoting joins the threads with open stitches.
- She used faggoting to decorate the edge of the cloth.
