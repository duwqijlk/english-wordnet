simpleMeaning: a carefully landscaped shopping complex of major stores, usually with restaurants and easy
  parking, and a modern version of the traditional marketplace
scope: This is not the middle point of something; it is a shopping development.
examples:
- The new shopping center has forty stores and a large food court.
- They spent the afternoon at the shopping center, browsing the stores and eating lunch.
