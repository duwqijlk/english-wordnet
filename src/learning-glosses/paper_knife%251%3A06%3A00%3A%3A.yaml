simpleMeaning: Letters sent by post are cut open with this blunt blade, which also slits the uncut pages
  of books.
scope: Also called letter opener or paperknife, this blunt blade cuts open posted letters and slits uncut
  book pages.
examples:
- A paper knife opened the letter.
- The paper knife slid along the uncut pages of the book.
