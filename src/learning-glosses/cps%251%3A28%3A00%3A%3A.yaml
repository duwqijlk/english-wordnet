simpleMeaning: 'Named for Heinrich Rudolph Hertz, this unit counts how often a thing repeats: one hertz
  means one repeat in one second'
scope: This unit is also called cycle, hertz, cycle per second, and cycles/second, and it counts how often
  a thing repeats, with one hertz meaning one repeat in one second.
examples:
- The reading was given in cps.
- They wrote the rate in cps.
