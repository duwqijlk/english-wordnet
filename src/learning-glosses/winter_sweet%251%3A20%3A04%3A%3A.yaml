simpleMeaning: A South African tree or large bush whose leathery evergreen leaves and white or pink flowers
  give way to round, dark purple fruits, usually with two seeds inside.
scope: This is the South African tree, also called poison arrow plant, not the Japanese shrub grown for
  fragrant yellow flowers, the Eurasian perennial, or the Cretan dwarf shrub.
examples:
- The winter sweet in the glasshouse is a South African tree with pink flowers.
- This winter sweet keeps its leathery leaves all year and bears round purple fruits.
