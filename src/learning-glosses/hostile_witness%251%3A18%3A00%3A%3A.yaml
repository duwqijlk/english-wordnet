simpleMeaning: A person called to speak in court whose ties to the other side may slant what they say
  against that side
scope: A person called to speak in court whose ties to the other side may slant what they say against
  that side, also called an adverse witness; not a fair speaker with no ties, and not a speaker who lies
  on purpose.
examples:
- A hostile witness can be asked leading questions and cross-examined.
- The judge treated her as a hostile witness once her ties to the other side came out.
