scope: This is a Nilotic tongue of the Rift Valley Province and the Kajiado and Narok districts; Masai
  is another name for it, not the people who speak it.
examples:
- Masai language is spoken in the Rift Valley Province.
- The Masai language belongs to the Nilotic group.
