simpleMeaning: dark shellfish with two shells, from the sea, usually cooked by steaming in wine
scope: Dark sea shellfish cooked by steaming in wine, not the live animal that clings to rocks.
examples:
- We ordered a pot of mussels steamed in white wine.
- The mussels arrived in a bowl, cooked in wine and garlic.
