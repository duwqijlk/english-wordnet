simpleMeaning: In the Roman Catholic Church, the group of all the church's high churchmen, who choose
  the pope and give him advice.
scope: The body of cardinals in the Roman Catholic Church, also called cardinalate, Sacred College and
  Sacred College of Cardinals, set apart from other church bodies by its choice of the pope.
examples:
- The College of Cardinals met to elect a pope.
- The College of Cardinals advises the pope.
