simpleMeaning: This body chemical speeds up the nerves that work on their own; the glands above the kidneys
  make it under strain, and it is sold as Adrenalin
scope: It is also called adrenaline and epinephrine, the chemical the glands above the kidneys send out
  under strain.
examples:
- The glands above the kidneys sent out epinephrin when he was under strain.
- His body made epinephrin as the strain grew.
