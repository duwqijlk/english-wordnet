senseId: paripinnate%5:00:00:compound:00
synsetId: 02180177-s
simpleMeaning: Said of a leaf shape where two small parts sit at the tip and the rest sit in a row on
  each side of a stem
scope: 'Also called abruptly-pinnate or even-pinnate: said of a leaf shape with pairs of small parts and
  two at the tip, not a leaf with one part at the tip.'
examples:
- The paripinnate leaf ended in a pair of leaflets.
- Botanists called the leaf paripinnate because two leaflets grew at its tip.
