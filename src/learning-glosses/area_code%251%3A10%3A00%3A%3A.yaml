senseId: 'area_code%1:10:00::'
synsetId: 06366033-n
simpleMeaning: a number, most often of three figures, that marks the phone part of a country such as the
  United States or Canada
scope: A set of figures that marks a phone part of a country, not the rest of the phone number and not
  a code for a whole country.
examples:
- The area code for New York City is 212.
- She asked for the area code before she dialed the number.
