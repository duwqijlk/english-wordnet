simpleMeaning: a European plant that now grows wild as a weed in North America, whose sharp-pointed seeds
  hurt farm animals that eat them
scope: A European plant that grows wild as a weed in North America and hurts farm animals with its sharp
  seeds, not a food crop and not a garden plant.
examples:
- Goat grass had spread across the dry field like a weed.
- The farmer pulled out the goat grass before its sharp seeds could hurt the sheep.
