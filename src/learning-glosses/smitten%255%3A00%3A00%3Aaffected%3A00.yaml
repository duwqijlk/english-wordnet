senseId: smitten%5:00:00:affected:00
synsetId: 00071850-s
simpleMeaning: used with another word, to mean strongly affected by something too strong to deal with
scope: 'Also called struck and stricken: this sense is used with another word to mean strongly affected
  by something very strong, and it is not the sense of a strong liking for someone that is foolish and
  has no good reason.'
examples:
- He walked home conscience-smitten after lying to his mother.
- She stood awe-smitten before the huge mountains.
