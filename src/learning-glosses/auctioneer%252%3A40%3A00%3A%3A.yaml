simpleMeaning: to sell things at a public sale where the person who offers the most money gets them
scope: 'Also called auction: to sell things in this public way, not the person who runs such a sale.'
examples:
- He auctioneered the old furniture to a room full of buyers.
- She will auctioneer the paintings at the sale on Saturday.
