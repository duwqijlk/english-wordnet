simpleMeaning: a plant of eastern North America with tube-shaped blue or white flowers that open little
  or not at all
scope: 'Also called bottle gentian and closed gentian: a plant of eastern North America with tube-shaped
  blue or white flowers that stay nearly shut, not a daisy and not a gentian with wide-open flowers.'
examples:
- The blind gentian grows in damp woods in the east.
- We found a blind gentian whose blue flowers had barely opened.
