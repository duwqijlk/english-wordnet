simpleMeaning: a way of behaving that is not polite and hurts or offends others
scope: 'Also called discourtesy: a way of behaving that is not polite and hurts others, not just speaking
  in a short or direct way.'
examples:
- His rudeness to the waiter shocked everyone at the table.
- She wrote to say sorry for her rudeness at the meeting.
