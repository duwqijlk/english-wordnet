simpleMeaning: Downy young that feed themselves at once belong to a bird like a pigeon, living in the
  dry lands of the Old World with long pointed wings and tail.
scope: Also called sand grouse; a pigeon-like bird of dry lands, not a true pigeon.
examples:
- The sandgrouse has long pointed wings and a long pointed tail.
- Young sandgrouse are downy and can feed themselves soon after they hatch.
