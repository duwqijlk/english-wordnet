simpleMeaning: In sports, a run of play in which several hits follow one another without a break.
scope: This is a rally, a run of strokes hit back and forth in a game, not a swap of money or goods, and
  not the chess trade of a rook for a knight or bishop.
examples:
- The long exchange at the net ended when she missed a backhand.
- After a short exchange of shots, he won the point.
