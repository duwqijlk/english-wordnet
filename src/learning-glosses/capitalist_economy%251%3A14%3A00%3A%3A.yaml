simpleMeaning: a way of running a country's trade and money in which private people own the land, tools,
  and goods used to make things
scope: A way of running a country's trade and money in which private people own the means of making things;
  capitalism is another name for this sense; not a system where the state owns all land and tools, and
  not one person's business.
examples:
- The country moved to a capitalist economy after the reforms.
- In a capitalist economy, private firms compete for buyers.
