simpleMeaning: Of the eyes, to grow wet as liquid gathers and runs, or to let drops fall.
scope: This is the verb for eyes becoming wet or shedding drops, not the noun for a single drop or a rip
  in cloth.
examples:
- Her eyes began to tear as she chopped the onions.
- The cold wind made his eyes tear before he reached the door.
