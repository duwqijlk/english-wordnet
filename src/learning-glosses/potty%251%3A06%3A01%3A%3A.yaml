simpleMeaning: a fixed bowl joined to water pipes, used for passing water and solid waste from the body
scope: This is the fixed bowl joined to pipes, also called can, pot, throne, toilet, stool, commode, and
  crapper; not the movable bedroom bowl, and not the word for loving in a silly way.
examples:
- He sat on the potty and flushed it when he was done.
- The potty in the bathroom kept running water all night.
