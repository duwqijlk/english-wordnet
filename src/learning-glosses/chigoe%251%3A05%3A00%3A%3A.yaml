simpleMeaning: a tiny flea from warm lands; the female that can bear young digs into the skin of a host,
  even a person
scope: A tiny insect from warm lands whose female digs into the skin of a host; chigger and chigoe flea
  are other names for this sense, not a common flea and not a tick.
examples:
- The chigoe is a tiny flea of warm lands.
- A chigoe had dug into the skin of his foot.
