simpleMeaning: One lone tube and two large tubes join to make a blood tube taking blood from the head,
  arms, and chest into the right upper room of the heart.
scope: Precava is another name for this blood tube, made when one lone tube and two large tubes join,
  that takes blood from the head, arms, and chest.
examples:
- Blood from the head reaches the heart through the superior vena cava.
- Blood from the arms and chest flows to the heart through the superior vena cava.
