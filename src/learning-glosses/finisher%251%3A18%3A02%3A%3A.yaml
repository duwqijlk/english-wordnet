simpleMeaning: In baseball, when a team is ahead in the last inning or two, this pitcher comes in to keep
  that lead safe
scope: 'Also called a closer: in baseball, a pitcher who comes in late to keep a lead safe, not the painter
  who puts on a last coat and not the pitcher who starts the game.'
examples:
- The finisher struck out the last two batters to save the win.
- Their finisher has not given up a lead all season.
