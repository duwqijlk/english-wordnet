simpleMeaning: A free-standing United States office, not tied to any party, that checks the government
  for Congress and holds it to account for Congress and for the people
scope: A United States body that checks the government for Congress and holds it to account for Congress
  and for the people; also called the Government Accounting Office and the United States Government Accounting
  Office.
examples:
- The GAO looked into the work of the government for Congress.
- Congress asked the GAO to check whether the government had kept to the rules.
