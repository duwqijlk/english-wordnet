simpleMeaning: A shrub of the salt marshes of the east and south-central part of North America and the
  West Indies, whose fruit is ringed with white soft hairy tufts like feathers.
scope: 'Also called consumption weed, cotton-seed tree, groundsel bush, and groundsel tree: a shrub of
  the salt marshes of the east and south of North America and the West Indies, not a garden shrub and
  not a tree of dry ground.'
examples:
- Baccharis halimifolia grew thick along the edge of the salt marsh.
- The fruit of Baccharis halimifolia was ringed with white hairy tufts.
