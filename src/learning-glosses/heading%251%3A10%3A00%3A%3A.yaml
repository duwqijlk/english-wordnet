simpleMeaning: One line of words at the top of a part of a text, put there to show what that part is about
scope: This is the line of words above a part of a text, also called head. It is not a level way dug in
  a mine.
examples:
- The heading above the story tells you what it is about.
- She wrote a short heading at the top of each page.
