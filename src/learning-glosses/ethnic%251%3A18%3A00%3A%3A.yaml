simpleMeaning: a person who belongs to a group of people who share the same way of life
scope: This is a person who belongs to such a group, not the describing word for the ways of living built
  up by a group of people, and not the describing word for not acknowledging the God of Christianity and
  Judaism and Islam.
examples:
- He is an ethnic, and he takes part in the life of his group.
- At the meeting, each ethnic spoke for the group they belong to.
