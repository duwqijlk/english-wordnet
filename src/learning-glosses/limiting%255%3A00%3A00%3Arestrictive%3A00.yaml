simpleMeaning: In grammar, a word or part of a sentence that picks out only the exact things meant, and
  no others
scope: In grammar, this picks out only the exact things a word or phrase means, not a word that merely
  adds extra detail.
examples:
- In 'the books that I read', the limiting clause tells which books are meant.
- The word 'only' plays a limiting role in that sentence.
