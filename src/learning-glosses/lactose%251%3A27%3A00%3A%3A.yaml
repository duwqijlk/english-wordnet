simpleMeaning: a sugar made of one glucose part joined to one other sugar part, and found only in milk
scope: 'Also called milk sugar: this is the sugar found only in milk, made of two different sugar parts
  joined together; it is not glucose on its own and not the other sugar part on its own.'
examples:
- Cow's milk has lactose in it, about five parts in a hundred.
- Some people feel ill after milk because their bodies cannot break down its lactose.
