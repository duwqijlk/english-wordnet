senseId: 'lobby%1:14:00::'
synsetId: 07985266-n
simpleMeaning: A group of people who work together, most often by talking to them again and again, to
  get lawmakers or officials to act in the group's own interest.
scope: A group that works to move lawmakers or officials in its own interest, not a waiting room and not
  one person asking for a favour.
examples:
- The lobby pressed the lawmakers to change the bill.
- A strong lobby worked for the farmers' interests.
