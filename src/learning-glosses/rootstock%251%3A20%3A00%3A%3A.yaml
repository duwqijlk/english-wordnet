senseId: 'rootstock%1:20:00::'
synsetId: 13148062-n
simpleMeaning: an underground part of a plant used to grow new plants, above all the part of a joined
  plant that gives it its underground parts
scope: An underground part of a plant used to grow new plants; not the flat underground stem that sends
  up shoots, and not a seed.
examples:
- The gardener grafted the rose onto a hardy rootstock.
- A good rootstock gives the grafted plant strong roots.
