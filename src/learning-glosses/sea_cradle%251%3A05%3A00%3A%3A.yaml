simpleMeaning: This long early salt-water animal matches on both sides, and eight chalky plates cover
  its soft back.
scope: Also called chiton, coat-of-mail shell, and polyplacophore, this is an early salt-water animal
  with a long body that matches on both sides, its soft back covered with eight chalky plates, not a shellfish
  with one shell.
examples:
- We found a sea cradle with eight chalky plates on its soft back.
- The sea cradle matched on both sides, its soft back covered with chalky plates.
