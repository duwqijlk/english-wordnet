simpleMeaning: to make someone feel annoyed and to trouble them, especially by small things that keep
  happening
scope: 'Also called bother, annoy, rag, irritate, gravel, nettle, vex and chafe: to make someone annoyed
  by small things, not a cruel person and not putting a spicy paste on food.'
examples:
- The loud clock in the next room devilled him all night.
- Small flies kept devilling her while she tried to read.
