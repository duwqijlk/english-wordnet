simpleMeaning: A drug that fights germs, given by needle, as Zinacef, or by mouth in tablets; it is used
  for infections of the lungs, throat, ears, urinary tract, or meninges.
scope: Also called cefuroxime and Zinacef; a drug that fights germs, given by needle or by mouth, not
  a pain-killer and not a drug for the skin only.
examples:
- The doctor gave her Ceftin for the ear infection.
- Ceftin comes as tablets you take by mouth.
