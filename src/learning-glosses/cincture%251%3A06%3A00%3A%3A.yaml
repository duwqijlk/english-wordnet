simpleMeaning: a strip of stuff worn round the waist to make a skirt or trousers stronger
scope: This is a strip of stuff worn round the waist to make a skirt or trousers stronger; girdle, sash
  and waistband are other names for this sense, and it is not a belt that holds up trousers or a ring
  round a tooth.
examples:
- She tied the cincture round her waist to keep her skirt in place.
- The cincture gave extra strength to the waist of his trousers.
