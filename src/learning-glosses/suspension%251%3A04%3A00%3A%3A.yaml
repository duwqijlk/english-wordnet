simpleMeaning: the act of hanging a thing from above so it can move freely
scope: The act of hanging something so it moves freely, and hanging and dangling are other names for this
  sense; not a ban from a job and not tiny bits floating in a liquid.
examples:
- The suspension of the lamp let it sway in the wind.
- They watched the suspension of the portrait with care.
