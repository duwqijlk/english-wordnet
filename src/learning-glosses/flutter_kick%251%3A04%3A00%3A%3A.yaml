simpleMeaning: when swimming, the legs beat fast up and down while the knees stay straight
scope: A way of moving the legs fast up and down while swimming, with the knees kept straight, not a kick
  that bends the knees and not a kick used on land.
examples:
- She used a flutter kick to cross the pool.
- The coach told him to keep a steady flutter kick.
