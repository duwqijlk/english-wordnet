simpleMeaning: A commonly grown larkspur of southern Europe, with unbranched spike-like clusters of blue
  or sometimes purplish or pinkish flowers; sometimes put in that genus.
scope: 'Also called rocket larkspur and Consolida ambigua: a garden larkspur, not a shrub, and not a wild
  flower of northern Europe.'
examples:
- Delphinium ajacis bloomed blue along the path.
- We sowed Delphinium ajacis in the sunny bed.
