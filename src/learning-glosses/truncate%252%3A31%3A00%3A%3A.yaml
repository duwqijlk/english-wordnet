senseId: 'truncate%2:31:00::'
synsetId: 00742295-v
simpleMeaning: to get a near value by not using any parts after a part you have chosen
scope: This sense is about getting a near value by leaving out later parts, not about making a text or
  a thing shorter in general.
examples:
- Truncate the series after the third part to get a near value quickly.
- If you truncate the series at that point, the answer stays close enough for this use.
