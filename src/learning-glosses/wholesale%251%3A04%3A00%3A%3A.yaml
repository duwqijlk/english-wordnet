simpleMeaning: the selling of goods to shop owners or other sellers, usually in large amounts for them
  to sell again to people who will use them
scope: This is the act of selling goods to sellers for them to sell again, not buying goods one by one
  as a normal shopper, and not the word used to say at a low price for sellers.
examples:
- His business is wholesale, selling tea to shops across the country.
- She works in wholesale and sells clothes in large amounts to store owners.
