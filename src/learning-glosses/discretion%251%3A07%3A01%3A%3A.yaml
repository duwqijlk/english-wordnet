simpleMeaning: able to make good choices by looking at the facts in a clear, fair way
scope: The habit of judging fairly and with care, not freedom to choose as you like and not keeping secrets.
examples:
- He showed discretion in dealing with the quarrel.
- Her discretion won the trust of both sides.
