simpleMeaning: In philosophy, the part that studies the basic ideas and steps used when people ask questions
  and look for answers in one field of study
scope: Also called methodological analysis; this is the study in philosophy of how a field asks questions,
  not the set of ways of working used in that field itself.
examples:
- She studies methodology to understand how scientists check their ways of working.
- A course in methodology looks at the ideas behind asking questions in history.
