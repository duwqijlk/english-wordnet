simpleMeaning: low shoes that are easy to put on and take off, usually worn inside the home
scope: Low shoes worn inside the home that are easy to put on and take off, not a person who slides because
  the ground does not hold their feet well.
examples:
- She put on her slippers as soon as she came home.
- His warm slippers kept his feet comfortable on the cold floor.
