senseId: 'tingle%1:12:00::'
synsetId: 07535351-n
simpleMeaning: a feeling of fear that you almost like
scope: This feeling is also called shiver, shudder, chill, thrill and quiver. It is not the body feeling
  like small pricks, and not the verb that means to cause a sharp feeling.
examples:
- A tingle of fear ran through him as he opened the old door, and he liked it a little.
- She felt a tingle when the scary story began, half afraid and half happy.
