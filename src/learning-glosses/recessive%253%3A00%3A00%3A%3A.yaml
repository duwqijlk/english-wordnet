schema: oewn-learning-gloss-v2
senseId: 'recessive%3:00:00::'
synsetId: 00797543-a
simpleMeaning: Of a gene, showing the trait it brings only when both copies of the gene are the same form.
scope: Of a gene, showing its own trait only when both copies of the gene are the same form; not the gene
  form itself that does this only when its pair matches, and not anything to do with a recession, a time
  when trade falls.
examples:
- The gene was recessive, showing its trait only when both copies matched.
- That trait was recessive in the plant, hidden unless both copies of the gene were the same.
