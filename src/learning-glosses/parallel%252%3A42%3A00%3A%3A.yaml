simpleMeaning: to lie or run beside a thing, in the same direction and at the same distance all along
scope: To run beside a thing at the same distance all along, not to set a thing in that way, and not the
  line itself.
examples:
- The two roads parallel each other for miles.
- Her path paralleled the river all the way home.
