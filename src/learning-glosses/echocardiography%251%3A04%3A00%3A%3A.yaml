simpleMeaning: A test that does not cut into the body and uses sound waves to look at the shape and movement
  of the heart
scope: A test that does not cut into the body and uses sound waves to look at the heart, not an operation
  and not a test using X-rays.
examples:
- Echocardiography uses sound waves to look at the heart.
- The doctor ordered an echocardiography to study the heart's movement.
