simpleMeaning: the act of taking time away from work or school to rest or travel
scope: This is the act of taking time away to rest or travel, not the place you go to and not a single
  free day at home.
examples:
- They spent two weeks vacationing by the sea in Spain.
- Vacationing in the mountains helped him rest after a busy year.
