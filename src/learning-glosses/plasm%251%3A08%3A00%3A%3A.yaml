simpleMeaning: The living substance of the reproductive cells that holds the tiny threads and units of
  inheritance.
scope: Also called germ plasm, this is the living stuff inside the seed cells, not the watery fluid of
  the blood that holds no cells.
examples:
- The plasm of the germ cells holds the chromosomes and genes.
- In the plasm, the genes pass from parent to young.
