simpleMeaning: a plant from North America with green leafy parts that stay green all year
scope: 'Also called leatherleaf wood fern and marginal wood fern: a North American plant whose green leafy
  parts stay green all year, not a plant that loses its leaves in winter and not the other sense with
  narrow leaves in dense bunches.'
examples:
- The evergreen wood fern grew in the shade of the tall trees.
- They planted an evergreen wood fern beside the stone wall.
