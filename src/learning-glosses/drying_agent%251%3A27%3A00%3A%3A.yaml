simpleMeaning: a substance that takes dampness out of things, such as calcium oxide, which takes in water
  and is used to take dampness away
scope: Also called drier, desiccant, and siccative, this is a substance that takes dampness out of things,
  not a liquid that keeps things wet.
examples:
- Silica gel is a drying agent used in the packets.
- The drying agent took the dampness out of the air.
