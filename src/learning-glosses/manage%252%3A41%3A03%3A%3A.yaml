simpleMeaning: To get something done even when the means at hand are scant or inadequate.
scope: Another name for this sense is deal; it means getting something done with limited means, not being
  in charge of people or handling an object.
examples:
- We managed to finish the repairs with a single box of tools.
- She managed a decent meal from the few supplies left in the cupboard.
