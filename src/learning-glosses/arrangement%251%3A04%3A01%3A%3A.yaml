simpleMeaning: The work of changing a piece of music so that a certain set of voices or instruments can
  play or sing it
scope: The work of changing a piece of music for certain voices or instruments, not the finished piece
  of music itself and not a neat set of things put in order.
examples:
- The arrangement of the song for piano took weeks.
- His arrangement of the tune won praise.
