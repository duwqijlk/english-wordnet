senseId: unwarranted%5:00:00:unreasonable:00
synsetId: 01951967-s
simpleMeaning: done with no good reason or with no permission to do it
scope: 'Also called undue and unjustified: done without a good reason or permission, not the sense where
  a thing is so wrong that no reason can make it right.'
examples:
- The new rules put unwarranted limits on free speech.
- The police made an unwarranted search of his home without permission.
