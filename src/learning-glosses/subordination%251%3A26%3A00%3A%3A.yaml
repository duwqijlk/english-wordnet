senseId: 'subordination%1:26:00::'
synsetId: 14025337-n
simpleMeaning: The state of being lower than something else, under its power or control.
scope: The state of being lower than something else, not the link in meaning between a word and a lower
  rank or class, not the link in grammar between a word and its head, and not the act of mastering someone.
examples:
- The subordination of the small team to the larger one was clear to all.
- Her subordination to the head of the house left her little say.
