simpleMeaning: A harmless dark growth of tiny bumps on the tasting surface inside the mouth, a side effect
  of some antibiotics
scope: A harmless dark growth on the tasting surface inside the mouth, not a sore and not a swelling;
  black tongue and furry tongue are other names for this sense.
examples:
- The antibiotics left him with a hairy tongue that looked dark in the mirror.
- Her hairy tongue cleared up once she stopped taking the medicine.
