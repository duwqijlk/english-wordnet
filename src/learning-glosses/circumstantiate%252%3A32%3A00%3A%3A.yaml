senseId: 'circumstantiate%2:32:00::'
synsetId: 01014801-v
simpleMeaning: To back a claim with facts about what happened around it
scope: This means to back a claim with facts about what happened around it, not to prove it by direct
  proof and not merely to describe it.
examples:
- She circumstantiated her story with dates and names.
- He circumstantiated the charge with letters.
