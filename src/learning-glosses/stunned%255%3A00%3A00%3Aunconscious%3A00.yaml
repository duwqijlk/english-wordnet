simpleMeaning: knocked out so you cannot think, see, or feel anything, after a hard hit
scope: Also called out, this is being knocked out by a hard hit, not just being unable to think clearly
  after a shock.
examples:
- The boxer was stunned by the blow and lay still on the floor.
- He was stunned by a heavy blow to the head and did not wake for several minutes.
