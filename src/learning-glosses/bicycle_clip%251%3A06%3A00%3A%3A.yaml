simpleMeaning: To keep trouser legs from catching in the chain, a cyclist wears this fastener round the
  ankles.
scope: Also called a trouser clip, this fastener is worn round the ankles of a cyclist to keep trouser
  legs out of the chain.
examples:
- He put a bicycle clip round each ankle before he set off.
- Her bicycle clip kept her trouser leg clear of the chain.
