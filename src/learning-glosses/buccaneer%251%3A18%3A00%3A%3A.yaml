simpleMeaning: One who steals on the waves, or raids the shore, with no leave from any ruler.
scope: This sense is also called a pirate, for one who steals on the waves, or raids the shore, with no
  leave from any ruler, where a pirate is one who robs at sea or comes from the sea to rob land, with
  no right given by any country to do so, unlike the sense for living like a buccaneer.
examples:
- The buccaneer robbed ships at sea.
- Buccaneers raided the shore from the sea.
