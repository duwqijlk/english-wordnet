simpleMeaning: a narrow low dip in the ground, between waves, or on the sea floor
scope: A narrow low dip in the ground, between waves, or on the sea floor, not the channel under a roof
  and not an open box.
examples:
- The road dipped into a trough between two hills.
- The boat slid down into the trough between the waves.
