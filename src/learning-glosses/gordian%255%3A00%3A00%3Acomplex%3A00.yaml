simpleMeaning: Very hard to untie or work out; often said of a hard knot.
scope: It marks a problem or knot as extremely hard to untie or work out, a stronger word than just hard.
examples:
- The Gordian knot was so tangled that no one could undo it.
- A Gordian problem is extremely hard to work out.
