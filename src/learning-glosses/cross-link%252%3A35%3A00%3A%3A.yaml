simpleMeaning: To join by making strong chemical bonds between nearby chains of a polymer, a large molecule
  made of joined parts, or a protein.
scope: This is the act of joining chains with bonds, not the bond itself.
examples:
- Scientists cross-link the chains to make the plastic strong.
- Heat can cross-link the protein chains.
