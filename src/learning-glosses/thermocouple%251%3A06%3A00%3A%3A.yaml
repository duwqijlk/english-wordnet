simpleMeaning: A thermometer of two wires, unlike metals, joined at both ends, one joint at the heat gauged,
  the other at a set lower heat, the flow matching the heat gap.
scope: Also called thermocouple junction, this is a thermometer of two wires, unlike metals, joined at
  both ends, one joint at the heat gauged, the other at a set lower heat, the flow matching the heat gap.
examples:
- The thermocouple gauges the heat.
- Thermocouples measure high heat.
