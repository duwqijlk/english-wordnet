simpleMeaning: A loop tied in the rope that pulls the frame carrying a big gun
scope: A loop tied in a rope for pulling the frame that carries a big gun; not a knot for tying things
  fast and not part of the gun itself.
examples:
- The soldiers tied a prolonge knot in the drag rope.
- A prolonge knot held the rope to the gun carriage.
