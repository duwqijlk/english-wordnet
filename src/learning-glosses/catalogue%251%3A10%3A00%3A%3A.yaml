simpleMeaning: a book or small booklet that lists things one by one
scope: A book or small booklet that lists things one by one; catalog is another name for this sense, and
  it is not the act of making such a list.
examples:
- He found it in the Sears catalogue.
- The shop sent us a catalogue of its new books.
