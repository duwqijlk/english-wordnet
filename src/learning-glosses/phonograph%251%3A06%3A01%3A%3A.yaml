simpleMeaning: 'a machine for playing records: a turning record makes a stylus (a small needle) shake,
  and the machine makes the sound louder in the air or with electric power'
scope: 'Also called record player: this machine plays records and makes the sound louder, not the record
  itself and not a machine for making records.'
examples:
- He put the old record on the phonograph and wound it up.
- Music came from the phonograph as the record turned under the needle.
