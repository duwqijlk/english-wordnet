senseId: 'burlesque%1:10:01::'
synsetId: 06793148-n
simpleMeaning: A work that takes someone's way of writing or working and turns it into a joke, usually
  copying it in a funny, overdone way.
scope: Also called mockery, parody, takeoff, travesty, spoof, lampoon, and pasquinade; a work that takes
  someone's way of writing or working and turns it into a joke, usually copying it in a funny, overdone
  way, not the stage show of comic skits and not the adjective sense.
examples:
- His burlesque of the poet's style made the whole room laugh.
- The burlesque copied the novelist's long sentences to comic effect.
