simpleMeaning: showing the way by leading, and setting a course for people or things
scope: 'Also called directing and directive: this sense means leading or setting a course for others;
  not about movement in space, and not about a course toward an aim that is not a place.'
examples:
- She took a directional role, guiding the team through each step.
- The manager's directional advice set the course for the whole project.
