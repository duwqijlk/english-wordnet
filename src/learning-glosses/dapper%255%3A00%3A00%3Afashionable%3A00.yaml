simpleMeaning: fashionable in clothes and in the way a person acts
scope: 'Also called dashing, spruce, jaunty, snappy, rakish, natty, raffish, and spiffy: this means fashionable
  in clothes and manners, not just quick or lively.'
examples:
- He looked dapper in his new suit.
- The dapper young man wore a clean shirt and a bright tie.
