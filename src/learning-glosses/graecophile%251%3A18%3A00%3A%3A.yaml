simpleMeaning: Greece and everything Greek are the things this person loves.
scope: Also called philhellene and philhellenist; a person who loves Greece and all things Greek, not
  the word for a thing that shows that love.
examples:
- He was a Graecophile who read Greek poetry every day.
- The Graecophile collected Greek vases and books from Athens.
