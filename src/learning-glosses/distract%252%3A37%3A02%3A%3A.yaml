simpleMeaning: to upset a person's mind and make them uneasy, worried, or afraid
scope: To upset a person's mind and make them uneasy, worried, or afraid, also called trouble, not the
  act of drawing eyes away from a thing.
examples:
- She was distracted by worry about her father all day.
- The bad news distracted him so much that he could not sleep.
