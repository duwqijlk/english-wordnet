simpleMeaning: a signal that tells people to get up in the morning; in the military, a bugle (a brass
  musical instrument) call played at sunrise
scope: A morning wake-up signal, in the military played on a bugle at sunrise; not a signal to go to bed
  and not a call to start work.
examples:
- Reveille sounded at six, and every soldier got out of bed.
- She woke as soon as she heard reveille outside the tent.
