simpleMeaning: a colour with no hue, between white and black in lightness
scope: A colour with no hue, between white and black in lightness; gray and grey are other names for this
  sense, and it is not a clear bright colour or a dark shade.
examples:
- He had grayish hair.
- She wore a grayish suit.
