simpleMeaning: A head of the church, most often a bishop, wears these special clothes and other signs
  of office
scope: The special clothes and signs of office worn by a head of the church, most often a bishop, not
  the adjective sense of coming from a pope or of relating to bishops.
examples:
- The pontifical was laid out ready for the bishop's visit.
- He wore full pontifical for the ceremony.
