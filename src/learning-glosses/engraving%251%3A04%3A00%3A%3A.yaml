simpleMeaning: the work of making plates with lines cut in or etched (cut in with acid), and then printing
  designs from them
scope: 'Also called etching: the work of making plates and printing from them, not the hard plate itself
  and not the print made from it.'
examples:
- She learned engraving at art school and made prints from metal plates.
- Engraving took hours, from cutting the plate to printing the design.
