simpleMeaning: Not a uniform, a work outfit, or the dress of church workers, this is the dress people
  wear in daily life, and the like.
scope: Civilian clothing, civilian dress, and civilian garb are other names for this everyday dress, which
  is worn instead of a uniform, a work outfit, or the dress of church workers.
examples:
- At the meeting, plain clothes were worn instead of a uniform.
- On days off, plain clothes replace the work outfit.
