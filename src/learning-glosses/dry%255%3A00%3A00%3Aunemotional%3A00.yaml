simpleMeaning: Cold and showing no feeling or personal interest.
scope: Describes a greeting or remark that is cold and impersonal, not a sarcastic joke, and not something
  merely boring.
examples:
- She gave him a dry greeting and went back to her work.
- His dry reading of the lines left the audience unmoved.
