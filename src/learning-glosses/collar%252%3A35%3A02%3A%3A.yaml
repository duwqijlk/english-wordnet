simpleMeaning: to take hold of a person by the neck or by the band round their neck
scope: To take hold of a person by the neck or by the band round their neck, not to put such a band on
  an animal and not the band itself.
examples:
- The guard collared the thief as he ran past.
- She collared him by the neck before he could get away.
