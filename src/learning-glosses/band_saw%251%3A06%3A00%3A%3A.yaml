simpleMeaning: A cutting tool made of a toothed metal loop that runs round two wheels without end
scope: A cutting tool with a toothed metal loop running round two wheels, not a hand tool for cutting
  wood and not a round cutting disc; bandsaw is another name for it.
examples:
- He cut the plank with a band saw.
- The band saw hummed as the metal loop spun round.
