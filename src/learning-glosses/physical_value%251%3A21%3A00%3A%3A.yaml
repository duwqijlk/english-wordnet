simpleMeaning: The cost of making an item of physical property again, less various sums taken off, especially
  for loss of value over time.
scope: The cost of making a thing again, less sums taken off, not what it would sell for and not what
  it cost when first made.
examples:
- The physical value of the old mill was set by what it would cost to build it again, less wear.
- They worked out the physical value of the plant before the sale.
