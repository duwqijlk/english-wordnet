senseId: brickle%5:00:00:breakable:00
synsetId: 00711942-s
simpleMeaning: Easily broken because it bends very little; it cracks, breaks apart, or snaps without much
  give.
scope: Easily cracked or snapped because it bends very little; brittle and brickly are other names for
  this sense, not flexible and not tough.
examples:
- The brickle twig snapped when I bent it.
- Brickle plastic breaks if you drop it on a hard floor.
