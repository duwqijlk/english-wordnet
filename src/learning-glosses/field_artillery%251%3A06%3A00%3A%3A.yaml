simpleMeaning: Big guns that can be moved, used by an army away from home, above all to help soldiers
  at the front directly, and not guns that shoot at planes.
scope: Big guns that can be moved, also called field gun, used by an army away from home, above all to
  help soldiers at the front directly; not guns that shoot at planes and not guns fixed in one place.
examples:
- Field artillery moved up behind the front line before dawn.
- The field artillery gave direct help to the soldiers at the front.
