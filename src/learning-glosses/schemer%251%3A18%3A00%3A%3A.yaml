simpleMeaning: a person who makes a careful plan of what to do to reach their own goal
scope: 'Also called a plotter: a person who makes plans to reach a goal, not the plan itself and not a
  person who acts with no plan at all.'
examples:
- He is a clever schemer who always has a plan ready.
- The schemer worked out each step before he acted.
