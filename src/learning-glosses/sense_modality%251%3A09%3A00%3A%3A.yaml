simpleMeaning: One of the ways the body takes in what is around it, such as sight or hearing
scope: One of the ways the body takes in what is around it; not sight alone, and not a feeling.
examples:
- Sight is the sense modality we use most when reading.
- Touch is a sense modality that helps us feel heat and cold.
