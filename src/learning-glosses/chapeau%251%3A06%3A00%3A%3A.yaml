simpleMeaning: a head covering that guards the head from bad weather, with a shaped top and most often
  a brim
scope: A head covering that guards against bad weather, with a shaped top and most often a brim; hat and
  lid are other names for this sense, not a cap and not a hood.
examples:
- She wore a wide chapeau against the hot sun.
- His chapeau kept the rain off his face.
