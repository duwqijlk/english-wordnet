simpleMeaning: Describes a sound or voice pitched a full eight notes below the usual low range.
scope: Also called double-bass; describes a sound pitched a full eight notes below the usual low range,
  not merely low and not a high sound.
examples:
- The contrabass clarinet sounds an octave below the bass clarinet.
- A contrabass voice reaches notes far below the usual bass.
