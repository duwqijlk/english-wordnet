simpleMeaning: in a way that brings great praise and honor for doing something very well
scope: This says how an action is done, in a way that wins great praise and honor; it is not about being
  bright or shining, and not about fame by itself.
examples:
- Where others had failed, he gloriously succeeded in reaching the top.
- The team gloriously won the final match in front of their home crowd.
