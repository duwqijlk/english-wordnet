simpleMeaning: a knife with a short stiff blade and a curved tip, used for cutting floor covering
scope: A knife with a short stiff blade and a curved tip for cutting floor covering; linoleum knife is
  another name for this sense, not a kitchen knife and not a tool for cutting cloth.
examples:
- He used the linoleum cutter to trim the floor covering.
- The linoleum cutter has a short stiff blade with a curved tip.
