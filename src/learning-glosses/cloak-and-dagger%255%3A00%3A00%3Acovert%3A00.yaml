simpleMeaning: done in a hidden way, with aims or ways of doing things kept from others
scope: 'Also called clandestine, hole-and-corner, hugger-mugger, hush-hush, secret, surreptitious, undercover
  and underground: things done in secret, not things done in the open.'
examples:
- The cloak-and-dagger talks went on in a quiet back room.
- He loved cloak-and-dagger stories about spies who hid their plans.
