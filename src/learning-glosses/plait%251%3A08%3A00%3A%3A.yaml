simpleMeaning: hair worn in strands that are crossed over each other again and again
scope: A hair style made by crossing strands over each other, also called twist or braid; not a fold pressed
  into cloth and not the act of weaving.
examples:
- She wore her hair in a long plait down her back.
- The little girl's plait came undone during the game.
