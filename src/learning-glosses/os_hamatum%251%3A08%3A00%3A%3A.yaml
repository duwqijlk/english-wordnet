simpleMeaning: The bone in the wrist that lies in a line with the fourth and fifth fingers.
scope: A wrist bone in line with the fourth and fifth fingers; hamate and hamate bone are other names
  for this sense, not the wrist bone between the trapezium and the capitate bones.
examples:
- The os hamatum sits on the little-finger side of the wrist.
- He broke his os hamatum in the fall.
