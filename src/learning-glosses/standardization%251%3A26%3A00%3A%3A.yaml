simpleMeaning: The state of affairs once a set standard has been put in place and is working.
scope: A set standard in place and in use, not the checking of a measuring tool against a standard, and
  not the forcing of standards or rules on everyone.
examples:
- The standardization of nuts and bolts saved factories a great deal of money.
- Standardization across the firm made parts fit together.
