senseId: 'dubbin%1:27:00::'
synsetId: 14863376-n
simpleMeaning: Leather stays soft and keeps water out when this mix of animal fat and oil is used on it
scope: A greasy mix put on leather, not a polish that shines it and not a dye that colours it.
examples:
- He rubbed dubbin into his boots before the long walk in the rain.
- She spread dubbin over the old saddle to keep the leather soft.
