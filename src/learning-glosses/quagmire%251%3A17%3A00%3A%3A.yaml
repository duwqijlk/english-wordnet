simpleMeaning: a soft, wet area of low land that sinks down when you step on it
scope: 'Also called slack, mire and morass: soft wet low land that sinks under your feet, not dry firm
  ground and not a deep pool of water.'
examples:
- After the rain, the field turned into a quagmire and our boots sank in.
- We had to walk around the quagmire at the low end of the path.
