senseId: uninteresting%5:00:00:institutional:00
synsetId: 01234511-s
simpleMeaning: like a large place such as a hospital or school, especially in being all the same, dull,
  and with no new ideas
scope: 'Also called institutional: this describes a thing that feels like a big official place, not just
  any thing that holds no interest at all.'
examples:
- The rooms were plain and uninteresting, with every door the same, like rooms in a hospital.
- They served uninteresting food, the same at every meal, like food in a big school.
