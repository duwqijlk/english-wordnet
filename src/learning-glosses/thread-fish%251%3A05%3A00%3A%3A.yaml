simpleMeaning: A sea creature with very long thin front rays on its back and belly fins
scope: This is a sea creature with very long thin front rays on its back and belly fins, also called a
  threadfish; not a creature with short fins and not a ray.
examples:
- The thread-fish swam by with long thin rays trailing from its fins.
- Thread-fish have greatly lengthened front rays on their back and belly fins.
