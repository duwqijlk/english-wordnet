simpleMeaning: In biology, how closely living things or groups of them are tied by birth, shown in how
  alike their bodies or body parts are
scope: In biology, how closely living things or groups of them are tied by birth, shown in how alike their
  bodies or body parts are; affinity is another name for this sense, not likeness from living in the same
  place and not likeness from doing the same work.
examples:
- The phylogenetic relation between the two groups shows in the likeness of their bones.
- The phylogenetic relation of early man to modern humans shows in their like build.
