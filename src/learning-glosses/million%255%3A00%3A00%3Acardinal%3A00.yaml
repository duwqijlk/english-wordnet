simpleMeaning: Used for an amount of 1,000,000, shown in old Roman numerals as M with a line over it.
scope: It marks an exact count of 1,000,000, not a vague way of saying 'very many'.
examples:
- More than two million people live in the city.
- The company spent a million dollars on the new factory.
