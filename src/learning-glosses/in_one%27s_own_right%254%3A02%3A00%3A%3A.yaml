simpleMeaning: What gives a person this place is a title they hold, or things they have achieved
scope: This is about a title you hold or skills you have earned, not a name you got from your family;
  in her own right, in his own right, and in its own right are other names for this.
examples:
- She is a fine singer in one's own right, not just her mother's daughter.
- He earned his place as a writer in one's own right.
