simpleMeaning: In music, the note halfway between the first note and the fifth note is the third note
  of a scale of seven notes
scope: In music, the third note of a scale, halfway between its first and fifth notes, not the first note
  and not the fifth note.
examples:
- The mediant is the third note of the scale in that song.
- She sang the mediant, the note halfway between the first and fifth notes.
