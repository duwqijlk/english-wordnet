simpleMeaning: A speech sound formed when the voice path is made narrow but left open
scope: A speech sound formed when the voice path is made narrow but left open, also called a continuant,
  not a sound made by shutting the voice path and not a vowel.
examples:
- A continuant consonant keeps the air flowing.
- '''Z'' is a continuant consonant.'
