simpleMeaning: For the wives, women of the family, and concubines, women kept by a man as wives in all
  but name, rooms in a Muslim home are set apart.
scope: Harem, hareem, and serail are other names for these rooms set apart in a Muslim home for the wives
  and women of the family.
examples:
- They lived in the seraglio.
- The seraglio was set apart for the wives.
