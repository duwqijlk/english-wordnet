simpleMeaning: a large town or city area where very many people live close together; it may have several
  separate areas, each run in its own way
scope: 'Also called city: a large place where many people live, not the people who live in such a place.'
examples:
- The metropolis grew fast, with new homes built in every part of it.
- Thousands of buses carry people across the metropolis each day.
