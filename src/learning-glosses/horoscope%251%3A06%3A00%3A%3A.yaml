simpleMeaning: a picture showing where the planets and the signs of the zodiac (the 12 star signs) are
  at a set time and place
scope: This is the picture itself, showing where the planets are; it is not a reading of someone's future
  made from where the planets are.
examples:
- She drew a horoscope for the exact time and place of his birth.
- The horoscope in the book shows where each planet was that night.
