simpleMeaning: A transparent sea worm of the group Chaetognatha, with horizontal side and tail fins and
  movable curved spines on each side of the mouth.
scope: Another name for arrowworm, the small transparent sea worm with side and tail fins and spines beside
  its mouth; not an earthworm, and not a roundworm.
examples:
- The chaetognath is a major predator of copepods in the open ocean.
- Researchers recorded several chaetognaths in the plankton tow.
