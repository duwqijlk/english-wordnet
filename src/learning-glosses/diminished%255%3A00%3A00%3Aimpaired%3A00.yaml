simpleMeaning: Weakened or harmed by being made less in size or strength
scope: Made less in size or strength and so weakened, not the body-part sense after illness or hurt and
  not the musical sense of a smaller interval.
examples:
- His hearing was diminished, and talk was hard to follow.
- The light in the room was diminished by the thick curtains.
