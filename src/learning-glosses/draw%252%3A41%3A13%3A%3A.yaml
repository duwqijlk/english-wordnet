simpleMeaning: Execute someone by tying a limb to each of four horses and having them pull the body apart.
scope: 'The historical execution sense: a body torn apart by four horses, not pulling something in general,
  and not removing an animal''s internal organs.'
examples:
- The traitor was drawn and quartered before a crowd at the city gate.
- Rebels captured by the king's men were drawn and quartered.
