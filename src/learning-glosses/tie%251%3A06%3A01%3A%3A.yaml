simpleMeaning: a long narrow band of cloth worn under a collar and knotted at the front, mostly by men
scope: The neckwear sense, not the cord used to bind a parcel or the beam that braces rafters.
examples:
- He straightened his tie before the interview.
- She bought her father a silk tie.
