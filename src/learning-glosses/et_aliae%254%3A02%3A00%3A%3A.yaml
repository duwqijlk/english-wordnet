simpleMeaning: Used after a name to mean 'and other women', the feminine plural form.
scope: The feminine plural, used when the people are women; not the masculine 'et alii' or the neuter
  'et alia'.
examples:
- The review cites Alvarez et aliae for the original trial.
- All four authors were women, so the citation reads 'Kim et aliae'.
