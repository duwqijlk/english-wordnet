simpleMeaning: Tiredness and broken sleep that follow a long flight across time zones, when the body's
  daily clock is put out of step.
scope: It is tiredness and broken sleep after a long flight across time zones, not ordinary tiredness
  after a short trip.
examples:
- Jet lag kept her awake after the flight.
- He shook off his jet lag.
