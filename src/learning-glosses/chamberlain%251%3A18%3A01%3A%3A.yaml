simpleMeaning: a person who is in charge of the home and the people who work in it for a king or a lord
scope: A person who runs the home of a king or a lord; not the person who looks after the money of a town
  or city.
examples:
- The king's chamberlain welcomed the guests to the palace.
- A chamberlain told the servants to make the rooms ready.
