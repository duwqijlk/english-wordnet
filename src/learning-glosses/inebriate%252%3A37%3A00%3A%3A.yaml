simpleMeaning: to fill a person with a very strong and high feeling
scope: 'Also called thrill, exhilarate, exalt and beatify: this is about filling a person with a strong,
  high feeling, not about making someone drunk with alcohol.'
examples:
- The win inebriated the young singer and filled her with joy.
- He was inebriated with happiness after hearing that his book had won a prize.
