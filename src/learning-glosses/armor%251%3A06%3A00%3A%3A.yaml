simpleMeaning: Metal gear worn in battle to protect the body.
scope: This is metal protection worn in battle, and armour is the British spelling of the same word. It
  is not the natural tough coat of a plant or animal, and not a military unit.
examples:
- The knight buckled on his heavy metal armor before the battle.
- The soldier's steel armor deflected the sword blow.
