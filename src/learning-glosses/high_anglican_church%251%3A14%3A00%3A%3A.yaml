simpleMeaning: A group in England's national faith that puts weight on the Catholic way, above all in
  holy rites and acts of worship and obeying the leaders of the community.
scope: This is a group in England's national faith also called High Church, not a group that puts weight
  on the plain Protestant way.
examples:
- The High Anglican Church keeps many Catholic rites.
- Members of the High Anglican Church follow their bishops closely.
