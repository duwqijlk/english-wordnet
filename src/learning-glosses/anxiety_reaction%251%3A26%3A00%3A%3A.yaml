senseId: 'anxiety_reaction%1:26:00::'
synsetId: 14404122-n
simpleMeaning: A long-term condition of persistent, unfocused worry, with signs such as muscle tension,
  sweating, trembling, lightheadedness or irritability, lasting more than six months.
scope: This is the long-lasting disorder of unfocused worry that runs past six months; generalized anxiety
  disorder is another name for exactly the same condition, not a fear of one specific thing such as heights
  or spiders, and not a brief attack of panic.
examples:
- The psychiatrist described her state as an anxiety reaction rather than a phobia.
- An anxiety reaction can keep someone tense and sleepless for months.
