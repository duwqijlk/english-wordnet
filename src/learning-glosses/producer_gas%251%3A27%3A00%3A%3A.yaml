simpleMeaning: a fuel made of carbon monoxide, hydrogen and nitrogen, got by blowing air over hot coke,
  the hard black fuel made from coal
scope: A fuel of carbon monoxide, hydrogen and nitrogen, made by blowing air over hot coke; also called
  air gas; not the gas that comes from a well, and not the gas used to light a home.
examples:
- Producer gas was used to run the factory's engines.
- The old works made producer gas by blowing air over hot coke.
