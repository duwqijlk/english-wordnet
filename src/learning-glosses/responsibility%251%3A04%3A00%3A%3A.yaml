simpleMeaning: a duty that you are bound to carry out because of the demands placed on you.
scope: This is a duty or obligation that binds you, not the personal quality of being dependable.
examples:
- It is the manager's responsibility to keep the records safe.
- Parents have a responsibility to protect their children.
