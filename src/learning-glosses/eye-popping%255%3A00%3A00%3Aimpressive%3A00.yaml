simpleMeaning: So good and striking that it catches your notice at once, like lightning flashing in the
  sky.
scope: Something so striking that it catches your notice at once, like a flash of lightning; also called
  dazzling, fulgurant and fulgurous, not just a pretty sight or a loud show.
examples:
- The eye-popping fireworks lit up the whole sky.
- Her eye-popping dive from the high board drew gasps from the crowd.
