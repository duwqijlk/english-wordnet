simpleMeaning: Clothes from another time, or odd clothes, that do not fit the time and place where they
  are worn
scope: Odd clothes or clothes from another time that do not fit the place, not clothes for a play and
  not the dress of the day.
examples:
- He wore his woolen costume even in the heat.
- Her old-fashioned costume looked out of place at the modern party.
