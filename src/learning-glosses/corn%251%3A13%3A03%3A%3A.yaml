simpleMeaning: whiskey made by distilling a mash (crushed grain mixed with water) that is at least 80
  percent maize
scope: This is the spirit distilled mainly from maize, not the cereal plants in the field and not the
  dried kernels used as feed.
examples:
- He poured himself a glass of corn whiskey.
- The label says this corn whiskey is made mostly from maize.
