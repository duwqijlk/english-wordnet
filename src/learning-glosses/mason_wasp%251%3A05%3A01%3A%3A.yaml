simpleMeaning: any of several lone stinging insects that build nests of hard mud for their young
scope: Any of several lone stinging insects that build nests of hard mud for their young; not a wasp that
  lives in a large group and not a wasp that builds a paper nest.
examples:
- A mason wasp built a mud nest under the roof.
- The mason wasp carried mud to its nest.
