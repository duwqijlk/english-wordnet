simpleMeaning: The part of the large gut tube between its first part (the cecum) and its last part (the
  rectum), which takes water from food waste before it leaves the body
scope: 'This is the middle part of the large gut tube, not the writing mark : used to start a list and
  not the first or last part of the gut tube.'
examples:
- The doctor checked her colon for signs of illness.
- Water is taken from food waste as it passes through the colon.
