simpleMeaning: a group's refusal to obey a law because they think the law is wrong, as in a protest against
  unfair treatment
scope: A group's refusal to obey a law they think is wrong, as a protest; not a violent uprising and not
  a strike that stops work.
examples:
- Thoreau wrote a famous essay justifying civil disobedience.
- The marchers chose civil disobedience rather than violence.
