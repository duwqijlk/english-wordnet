simpleMeaning: Anything done in a way that is solemn, grand and formal above all else
scope: Anything done in a solemn, grand, formal way, not the right way to act at a solemn event.
examples:
- He makes a ceremony of pouring the wine, tasting it first.
- She went through the whole ceremony of greeting each guest by name.
