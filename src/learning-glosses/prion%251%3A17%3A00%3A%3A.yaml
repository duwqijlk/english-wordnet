simpleMeaning: In microbiology, a virus-like infectious particle made of protein with no genetic material,
  believed to cause scrapie (a nervous-system disease) and other worsening diseases of the nervous system.
scope: The infectious protein particle, not the small seabird that also carries the name prion.
examples:
- A prion is an infectious protein particle with no genetic material, unlike a virus.
- Scientists believe prions cause scrapie and other worsening diseases of the nervous system.
