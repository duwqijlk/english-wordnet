schema: oewn-learning-gloss-v2
senseId: 'conjunction%1:24:02::'
synsetId: 13821604-n
simpleMeaning: In grammar, the way words, phrases, or clauses (parts of a sentence) are linked when a
  joining word joins them
scope: This is the link made in grammar, not the joining word itself and not stars or planets seeming
  to meet in the sky.
examples:
- '''And'' creates a conjunction between ''he came'' and ''he stayed''.'
- Conjunction is the link between 'tea' and 'coffee' in 'tea and coffee'.
