simpleMeaning: Wire with sharp points, wound into coils and set out to block the way.
scope: Coiled wire with sharp points set out to block the way, not the musical instrument and not the
  act of collapsing like one.
examples:
- The soldiers laid concertina across the road to stop the trucks.
- A roll of concertina blocked the gap in the fence.
