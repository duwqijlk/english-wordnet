simpleMeaning: With a long bushy tail marked by black and white rings, this raccoon-like mammal of Mexico
  and the southwestern United States eats both plants and animals.
scope: This is the raccoon-like mammal of Mexico and the southwestern United States with a long bushy
  ringed tail, also called a bassarisk, cacomistle, cacomixle, civet cat, miner's cat, raccoon fox, ring-tailed
  cat, or ringtail, and not the common raccoon itself.
examples:
- The coon cat showed its long bushy tail.
- A coon cat eats both plants and animals.
