simpleMeaning: one of the two marks { and }, used to hold words together as a group in a text
scope: One of the pair of marks { and } that holds words together, not a tool, a rope, or teeth straighteners.
examples:
- Put a brace round the list to show it is one group.
- The brace { } holds the two lines together.
