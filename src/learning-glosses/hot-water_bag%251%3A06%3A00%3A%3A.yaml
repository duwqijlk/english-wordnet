simpleMeaning: To warm a bed or part of the body, you fill this closed holder, usually made of rubber,
  with warm liquid
scope: 'Also called a hot-water bottle: a rubber holder filled with warm liquid to warm a bed or body,
  not a heater that warms a whole house.'
examples:
- She filled the hot-water bag and put it at the foot of the bed.
- He held the hot-water bag against his sore stomach.
