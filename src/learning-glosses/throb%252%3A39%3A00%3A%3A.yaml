simpleMeaning: To beat much harder than is usual, so each beat can be felt
scope: To beat much harder than usual, so each beat can be felt, not a steady swelling and shrinking beat
  and not a shake from fear or excitement.
examples:
- Her head throbbed all night and she could not sleep.
- His heart throbbed with the effort of the climb.
