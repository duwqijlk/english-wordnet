simpleMeaning: a person who tells others things about themselves that harm them
scope: This is the person who tells facts that harm them, not a priest who listens to people tell their
  wrong acts and says God forgives them.
examples:
- The confessor told the police about his own part in the crime.
- She was a confessor who told the truth about her own wrong acts, even though it harmed her.
