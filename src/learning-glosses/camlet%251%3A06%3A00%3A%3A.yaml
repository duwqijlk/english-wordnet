simpleMeaning: A cloth from Asia, first made from silk and the hair of camels.
scope: A cloth first made in Asia from silk and camel hair, not wool cloth and not cotton cloth.
examples:
- The coat was cut from fine camlet.
- Traders brought camlet from the East.
