senseId: 'aspirate%1:10:01::'
synsetId: 92463361-n
simpleMeaning: A speech sound made with a clear puff of breath that can be heard, as with the first sounds
  of words starting with a stop sound or with h.
scope: A speech sound made with a clear puff of breath that can be heard, not just any consonant said
  with breath, and not the act of saying a sound that way.
examples:
- The 'p' in 'pot' is an aspirate, but the 'p' in 'spot' is not.
- The aspirate at the start of 'hat' is easy to hear.
