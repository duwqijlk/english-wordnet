simpleMeaning: to change code written in one coding language into the form a computer reads and runs,
  using a program made for that change
scope: To turn code written in a coding language into code a computer can run, not to write the code and
  not to run it by hand.
examples:
- It took an hour to compile the new program.
- She compiles her code before she tests it.
