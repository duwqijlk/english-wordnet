simpleMeaning: said of laws and rules made to keep buying and selling fair by stopping unfair ways of
  doing business
scope: 'Also called antitrust: it describes laws and rules that keep buying and selling fair, not laws
  about crime or safety, and not rules that set prices.'
examples:
- The new antimonopoly rules stop firms from fixing prices to push out small shops.
- An antimonopoly law kept the market open to new sellers.
