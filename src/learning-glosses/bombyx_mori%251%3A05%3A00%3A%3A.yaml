simpleMeaning: A thick, creamy-white moth of Asia that lives almost wholly in the care of people, and
  gives most of the silk sold in the world
scope: A thick, creamy-white moth of Asia kept almost wholly by people, also called domestic silkworm
  moth and domesticated silkworm moth; not a wild moth and not a moth of Europe.
examples:
- Bombyx mori gives most of the silk sold in the world.
- Bombyx mori lives almost wholly in the care of people.
