simpleMeaning: too strong or too good to be got over or done better than
scope: 'Also called insuperable: too strong or too good to be got over or done better than; not the sense
  of a person or place that cannot be taken or beaten in a fight.'
examples:
- His skill was unconquerable; no other player could match him or do better.
- The high wall looked unconquerable to the climbers, who could not get over it.
