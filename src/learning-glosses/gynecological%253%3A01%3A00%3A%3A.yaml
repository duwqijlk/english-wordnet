simpleMeaning: about the part of medicine that deals with women's health and the body parts used for having
  babies, or about doing this work as a doctor
scope: 'Also called gynaecological: about women''s health care and the doctors who give it, not about
  general health care for men or children.'
examples:
- She went to the clinic for a gynecological examination.
- He works in a gynecological clinic that cares for women.
