simpleMeaning: Above all in the east of North America, a European plant is found wild in many places,
  lasts from one year to the next, and shows yellow blooms in spring.
scope: Also called meadow buttercup, tall buttercup, and tall crowfoot, this European plant bears yellow
  flowers in spring; it lives year after year and grows wild in many places, above all in the east of
  North America.
examples:
- In spring the tall field buttercup shows yellow flowers.
- In the east of North America tall field buttercup now grows wild.
