simpleMeaning: A thing done with the help of the study of tiny bits of body tissue under a microscope,
  or with the ways that study is done
scope: About how something is done with the study of body tissue under a microscope, not about what the
  tissue looks like and not about the study itself.
examples:
- Histologically, the two samples looked the same.
- The structures were histologically easy to tell apart.
