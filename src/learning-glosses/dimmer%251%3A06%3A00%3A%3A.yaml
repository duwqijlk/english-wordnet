simpleMeaning: a part that changes the flow of power to an electric light, so you can make the light brighter
  or less bright
scope: This is a control that sets how bright a light is; it is not a simple switch that only turns a
  light on or off.
examples:
- She turned the dimmer to make the light less bright.
- We put a dimmer on the lamp in the living room.
