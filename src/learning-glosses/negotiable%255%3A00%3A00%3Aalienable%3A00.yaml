simpleMeaning: allowed by law to be passed to a new owner
scope: 'Also called transferable: allowed by law to pass to a new owner. It is not the sense where a demand
  can be talked about and changed, and not the sense where a way can be passed.'
examples:
- These bonds are negotiable and can pass to another person.
- A negotiable note can be given to a new owner.
