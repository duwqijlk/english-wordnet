simpleMeaning: Becoming part of the way of life of Europe.
scope: Also called Europeanization, this is the taking on of the ways of Europe, not the taking on of
  the ways of any other place.
examples:
- The Europeanisation of the town changed its shops and schools.
- Europeanisation took many years in that country.
