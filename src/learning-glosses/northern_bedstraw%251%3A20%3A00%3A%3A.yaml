simpleMeaning: A plant of North America that lives for years, spreads by stems along the ground, and has
  white flowers; it is sometimes grown for show.
scope: Also called Galium boreale and Northern snow bedstraw; a North American plant with white flowers,
  sometimes grown for show, not a bedstraw of Europe or Asia.
examples:
- Northern bedstraw grows along the river bank.
- She planted Northern bedstraw for its white flowers.
