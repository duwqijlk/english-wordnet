simpleMeaning: a person who supports the idea that people should choose their leaders and help decide
  how they are ruled
scope: A person who backs rule by the people in general, not only a member of the party with this name
  in the United States.
examples:
- As a lifelong democrat, she fought for free votes for all adults.
- He calls himself a democrat because he believes people should choose their government.
