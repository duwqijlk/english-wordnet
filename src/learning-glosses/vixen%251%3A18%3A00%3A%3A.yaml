simpleMeaning: a woman who is mean and cruel and gets very angry
scope: A mean, cruel woman who gets very angry, also called a harpy. It is not a female fox.
examples:
- People called her a vixen because she shouted at staff and treated them cruelly.
- The vixen in the story loses her temper and says hurtful things to everyone.
