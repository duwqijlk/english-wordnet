senseId: 'butacaine_sulfate%1:06:00::'
synsetId: 02930111-n
simpleMeaning: A white ester, a chemical made from an acid, in small clear bits, put on the wet skin inside
  the body to stop pain in one part
scope: A white chemical put on the wet skin inside the body to stop pain in one part; butacaine is another
  name for this sense, not a drug that puts the whole body to sleep and not a cream for the skin outside.
examples:
- The dentist put butacaine sulfate on the sore place in her mouth.
- Butacaine sulfate stopped the pain where it was put on.
