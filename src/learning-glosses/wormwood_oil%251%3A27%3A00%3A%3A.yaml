  to absinthe drinks
scope: 'Also called absinthe oil: a dark bitter liquid from plant leaves, not a cooking fat and not a
  sweet syrup.'
examples:
- Wormwood oil gives absinthe its bitter taste.
- A drop of wormwood oil flavors the whole bottle.
