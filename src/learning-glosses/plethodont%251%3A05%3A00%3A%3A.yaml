simpleMeaning: Breathing through thin wet skin, these salamanders live mostly on land, lay eggs in damp
  places on land, and seldom go into water.
scope: Salamanders that live mostly on land and breathe through thin wet skin; lungless salamander is
  another name for them, not a salamander with lungs.
examples:
- The plethodont breathed through its thin moist skin.
- A plethodont laid its eggs in a moist place on land.
