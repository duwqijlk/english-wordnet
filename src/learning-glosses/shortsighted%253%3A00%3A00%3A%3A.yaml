simpleMeaning: not able to see things far away clearly
scope: 'This is about the eyes: seeing close things well but not far things, also called nearsighted and
  myopic; it is not failing to think ahead.'
examples:
- She is shortsighted and wears glasses to read road signs far away.
- Without his glasses, the shortsighted boy could not see the writing on the board.
