simpleMeaning: Syncopated tunes, two beats to the bar, for the rhumba dance.
scope: Syncopated tunes, two beats to the bar, for the rhumba dance; also called rhumba; not a folk dance
  of Cuba, in two beats, blending the ways of Spain and Africa, with fancy footwork and wild movement,
  nor a hall dance built on the Cuban folk dance.
examples:
- Their rumba played at dawn.
- The rumba was heard at noon.
