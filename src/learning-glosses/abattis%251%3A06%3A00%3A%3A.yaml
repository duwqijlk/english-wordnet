simpleMeaning: trees cut down or left living are laid in a line, their boughs sharpened or wound with
  barbed wire and pointed at the foe, to hold back an attack
scope: 'Also called abatis: a defence made of trees, not a fence or a wall of stone.'
examples:
- The soldiers built an abattis of felled pines across the road.
- An abattis of live trees with sharp branches slowed the enemy's advance.
