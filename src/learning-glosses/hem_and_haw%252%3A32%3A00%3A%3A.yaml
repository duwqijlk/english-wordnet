simpleMeaning: To make two short sounds with the mouth as a sign of not knowing what to say next.
scope: Making two short sounds when unsure what to say; not a cough, and not a word for speaking clearly.
examples:
- He hemmed and hawed when asked to address the crowd.
- She hemmed and hawed before giving her answer.
