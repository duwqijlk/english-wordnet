simpleMeaning: Sold as Mexitil, this drug steadies the beat of the heart and treats uneven beats in its
  lower part
scope: A drug that steadies the heart's beat, not a drug for high blood pressure and not a painkiller.
examples:
- The doctor gave him mexiletine after his heart beat went uneven.
- Mexiletine steadied the fast, uneven beat in the lower part of her heart.
