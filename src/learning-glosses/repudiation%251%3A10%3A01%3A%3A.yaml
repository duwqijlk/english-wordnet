simpleMeaning: Refusal to own or pay a debt, or stand by a bond, especially by public hands.
scope: This sense is refusal to own or pay a debt, or stand by a bond, especially by public hands, unlike
  the sense for the casting off, or owning not, or calling void, and unlike the sense for the laying bare
  of falseness or sham.
examples:
- Repudiation is refusal to own a debt.
- Repudiation refuses to stand by a bond.
