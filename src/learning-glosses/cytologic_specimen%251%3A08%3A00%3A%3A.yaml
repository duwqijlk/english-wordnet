simpleMeaning: a sample taken from the body to look at its cells and find what illness is there
scope: A sample used to look at cells and find an illness, not a drug and not a tool used in surgery.
examples:
- The doctor sent the cytologic specimen to the lab for testing.
- A cytologic specimen from her throat showed no sign of disease.
