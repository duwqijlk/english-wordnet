simpleMeaning: In well seasoned broth, rice cooks with onions or celery, usually with poultry, game, or
  shellfish, and sometimes with tomatoes.
scope: 'Also called pilaf, pilau, and pilaw: rice cooked in well seasoned broth, usually with poultry,
  game, or shellfish, and sometimes with tomatoes.'
examples:
- We ate pilaff with roast chicken and rice.
- The pilaff was cooked in well seasoned broth with onions.
