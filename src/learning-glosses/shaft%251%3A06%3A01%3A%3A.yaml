simpleMeaning: A rod that turns round and round, carrying power or movement from one thing to another.
scope: A turning rod that passes power or movement along, not a long tool handle and not a deep hole dug
  down into the ground.
examples:
- The shaft turned the wheels of the mill.
- A broken shaft stopped the whole machine.
