simpleMeaning: big guns built to shoot up at planes in the sky
scope: Big guns for shooting at planes, also called flak, not a plane itself and not guns used on the
  ground against people or tanks.
examples:
- The ship's antiaircraft fired at the planes above.
- They placed antiaircraft near the airfield to shoot down enemy planes.
