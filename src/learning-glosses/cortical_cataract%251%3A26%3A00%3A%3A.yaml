simpleMeaning: a clouding of the eye in the outer part of the lens, the clear part that bends light
scope: A clouding of the eye in the outer part of the lens; not a clouding of the middle of the lens and
  not a loss of sight from old age.
examples:
- The doctor said the cortical cataract was still small.
- A cortical cataract made the edges of her sight look hazy.
