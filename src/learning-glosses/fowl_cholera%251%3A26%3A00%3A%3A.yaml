simpleMeaning: The germ that also causes bloody blood poisoning brings a sudden sickness with watery dung,
  most often in chickens.
scope: This names the sudden sickness with watery dung, most often in chickens, brought by the germ behind
  bloody blood poisoning.
examples:
- Fowl cholera spread fast through the flock.
- Many hens in the flock caught fowl cholera.
