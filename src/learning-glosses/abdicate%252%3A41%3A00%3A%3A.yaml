simpleMeaning: to give up power, as kings and emperors do, or to give up duties and other things a person
  must do
scope: 'Also called renounce: giving up power, as a king or emperor does, or giving up duties; not just
  leaving a job in the usual way.'
examples:
- The king abdicated and gave his power to his son.
- She abdicated her duties as head of the group and left others to do the work.
