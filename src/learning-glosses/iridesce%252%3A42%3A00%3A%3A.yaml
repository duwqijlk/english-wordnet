simpleMeaning: to shine with colours that change as the light moves
scope: To shine with colours that change as the light moves, not to shine with one fixed colour and not
  to give off light of its own.
examples:
- The corals iridesced under the surface of the clear water.
- The soap bubbles iridesced in the sun.
