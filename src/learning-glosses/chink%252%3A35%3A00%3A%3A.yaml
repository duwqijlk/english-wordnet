simpleMeaning: to fill up narrow gaps, as with the soft stuff used to seal joins
scope: To fill narrow gaps, not the slur for a person and not to make cracks in something.
examples:
- They chinked the gaps between the logs with clay.
- He chinked the wall before the winter came.
