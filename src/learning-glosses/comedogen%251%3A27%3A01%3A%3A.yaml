simpleMeaning: Something that tends to bring on spots, as when it blocks the tiny holes in the skin
scope: A stuff that tends to bring on spots, as when it blocks the tiny holes in the skin; comedogenic
  and comedogenic substance are other names for this sense, not a spot itself and not a wash for spots.
examples:
- That oil is a comedogen and brings on spots.
- She stopped using the comedogen on her skin.
