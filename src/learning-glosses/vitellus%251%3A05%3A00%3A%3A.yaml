synsetId: 01467485-n
simpleMeaning: Inside an egg, food lies stored to feed the young animal growing in it, most of all the
  yellow mass of a bird or reptile egg.
scope: Also called yolk, it is the food stored inside an egg to feed the young animal growing in it, not
  the white of the egg and not the shell.
examples:
- The vitellus of the egg fed the chick as it grew.
- The vitellus inside the egg fed the young reptile as it grew.
