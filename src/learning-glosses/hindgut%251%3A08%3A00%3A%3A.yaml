simpleMeaning: In an animal embryo with a backbone, the tail end of the food tube.
scope: In an animal embryo with a backbone, the tail end of the food tube, not the front end and not the
  middle part.
examples:
- In the embryo, the hindgut forms the tail end of the food tube.
- The hindgut grows from the back part of the young food tube.
