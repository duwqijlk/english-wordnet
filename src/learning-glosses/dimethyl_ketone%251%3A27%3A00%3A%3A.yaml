simpleMeaning: Much used to dissolve other stuff and to make plastics, this liquid catches fire very easily
  and is the plainest of its kind of chemical.
scope: Also called acetone and propanone, this liquid is the plainest of its kind of chemical, much used
  to dissolve other stuff and to make plastics.
examples:
- Workers use dimethyl ketone to make plastics.
- Dimethyl ketone can dissolve glue.
