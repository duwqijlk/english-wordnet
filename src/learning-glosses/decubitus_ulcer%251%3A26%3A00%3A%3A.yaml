senseId: 'decubitus_ulcer%1:26:00::'
synsetId: 14235608-n
simpleMeaning: a long-lasting sore on the skin caused by steady pressure on one place, as in a person
  who stays in bed
scope: A long-lasting skin sore from steady pressure, also called a bedsore or a pressure sore; not a
  sore from a cut and not a short-lived skin rash.
examples:
- A decubitus ulcer formed on his heel after weeks in bed.
- Nurses turn the patient often to stop a decubitus ulcer from forming.
