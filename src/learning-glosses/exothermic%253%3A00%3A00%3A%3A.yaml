simpleMeaning: A chemical change or a chemical that lets heat go free while it happens or is being made
scope: 'Also called exothermal or heat-releasing: a chemical change or chemical that lets heat go free
  as it happens, not one that soaks heat up.'
examples:
- The exothermic reaction heated the water in the flask.
- This exothermic mixture gives out heat as soon as the two liquids meet.
