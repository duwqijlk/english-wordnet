simpleMeaning: to hit someone hard many times with a whip made from the skin of a cow
scope: This is the action of hitting a person with such a whip, not the whip itself as a thing and not
  the leather it is made from.
examples:
- The cruel master cowhided the worker for a small mistake.
- He threatened to cowhide anyone who stole from the farm.
