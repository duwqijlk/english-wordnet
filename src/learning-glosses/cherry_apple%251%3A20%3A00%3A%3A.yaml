simpleMeaning: Its small sour fruit, usually red, is kept for later use, and this Asian wild fruit tree
  is grown in many kinds.
scope: 'Also called cherry crab: an Asian wild fruit tree grown for its small sour fruit, not a sweet
  eating fruit.'
examples:
- The cherry apple bore small sour fruit.
- They kept the cherry apples for later use.
