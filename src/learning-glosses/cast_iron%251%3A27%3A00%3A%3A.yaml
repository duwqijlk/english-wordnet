simpleMeaning: A mix of iron with so much carbon that it breaks easily and cannot be beaten into shape,
  but must be shaped by pouring it into a mould.
scope: A mix of iron that breaks easily and must be shaped by pouring, among the iron mixes, not a metal
  that can be beaten into shape.
examples:
- The old gate was made of cast iron, poured into a mould.
- Cast iron breaks easily and cannot be beaten into shape.
