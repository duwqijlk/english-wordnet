simpleMeaning: a rope on a ship with square sails, used to turn a long pole that holds a sail and to tie
  it in place
scope: A ship's rope for turning a sail pole, not the woodworker's tool and not teeth straighteners.
examples:
- The sailors hauled on the brace to swing the yard round.
- He pulled the brace tight to hold the sail in place.
