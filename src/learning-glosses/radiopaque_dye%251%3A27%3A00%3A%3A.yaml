simpleMeaning: a colouring liquid that blocks X rays and other rays, used to show the shape of organs
  in X-ray pictures
scope: A dye that stops X rays so organs show up in pictures, not ordinary ink and not a drug that treats
  the body.
examples:
- The doctor used a radiopaque dye to make the kidney show up on the X-ray.
- A radiopaque dye helps outline the heart before the scan.
