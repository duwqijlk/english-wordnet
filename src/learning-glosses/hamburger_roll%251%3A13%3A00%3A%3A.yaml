simpleMeaning: A round bread bun shaped to hold a flat cake of minced meat.
scope: A round roll, shaped to hold a flat piece of cooked ground beef, also called hamburger bun, not
  a dinner roll and not the meat itself.
examples:
- He ate the burger in a hamburger roll.
- The hamburger roll split when he bit into it.
