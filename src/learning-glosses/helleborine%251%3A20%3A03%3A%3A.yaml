simpleMeaning: Any of the small mild- and warm-climate orchids, with mottled or striped leaves, and spikes
  of small yellowish-white flowers in a twisted cluster.
scope: Any of the small mild- and warm-climate orchids, with mottled or striped leaves, and spikes of
  small yellowish-white flowers in a twisted cluster; also called rattlesnake plantain; not any of the
  orchids of the group Cephalanthera, nor any of the orchids of the group Epipactis.
examples:
- Their helleborine bloomed in the wood.
- The helleborine was prized by all.
