simpleMeaning: a common long-lived climbing plant of the mild lands of Europe, Asia, and North America,
  growing in thick clumps with long bunches of flowers
scope: Also called bird vetch; a common climbing plant of mild lands, not a vetch grown for food and not
  a low plant that creeps along the ground.
examples:
- Tufted vetch climbed the fence, its long bunches of flowers purple in June.
- We saw tufted vetch along the path in the meadow.
