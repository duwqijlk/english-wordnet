simpleMeaning: to rub food or other things against a rough or sharp surface with small holes, to make
  them into small thin pieces or powder
scope: Rubbing food or other things against a rough or sharp surface with small holes to make small thin
  pieces or powder; not making a harsh sound by rubbing things together, and not the metal bars that cover
  an opening.
examples:
- She grated the carrots for the salad.
- Grate the cheese over the hot pasta.
