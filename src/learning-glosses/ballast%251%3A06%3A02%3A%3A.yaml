simpleMeaning: a part put into an electric circuit that holds back the flow of power, used to balance
  changes such as those caused by changes in temperature
scope: 'Also called ballast resistor and barretter: this is a part put in a circuit, not the device that
  starts and controls lamps, not heavy gravel laid under a road or rails, and not steadiness of mind.'
examples:
- The old radio used a ballast to keep its power steady when it grew hot.
- He took out the worn ballast and put a new one into the circuit.
