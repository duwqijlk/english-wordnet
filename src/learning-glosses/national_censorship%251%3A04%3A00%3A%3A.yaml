simpleMeaning: Messages that enter, leave, or cross the borders of the United States or its lands are
  checked and stopped by the civil power.
scope: Only messages that enter, leave, or cross the borders of the United States or its lands fall under
  this checking and stopping by the civil power.
examples:
- The letter stopped at the border because of national censorship.
- The message never reached its readers because of national censorship.
