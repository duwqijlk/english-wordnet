simpleMeaning: An actor who says nothing and shows things only with moves of the body and face.
scope: 'Also called mime, mummer, pantomimer, and pantomimist: an actor who says nothing and shows things
  only with moves of the body and face, not a clown who speaks and not a dancer.'
examples:
- The mimer held the crowd silent with a single gesture.
- A mimer can tell a whole tale without a word.
