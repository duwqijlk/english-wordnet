senseId: 'imperviable%3:00:00::'
synsetId: 01778210-a
simpleMeaning: Nothing can pass through it, and nothing can change it or have an effect on it
scope: This is a thing or person nothing can get through or change; impervious is another name for this
  sense, not a thing that lets water or ideas pass.
examples:
- The coat is made of a material imperviable to rain.
- She stayed imperviable to their pleas.
