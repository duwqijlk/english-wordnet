simpleMeaning: judging by what can be seen and measured, with feelings and one's own fixed views left
  out
scope: Judging by what can be seen and measured, with feelings and one's own fixed views left out; objectivity
  is another name for this sense, not judging by one's feelings.
examples:
- Her objectiveness helped the panel judge the case on the facts alone.
- The report praised his objectiveness in weighing the two sides.
