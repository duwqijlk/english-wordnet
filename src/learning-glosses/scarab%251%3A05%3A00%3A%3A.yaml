simpleMeaning: A kind of beetle that people in Egypt long ago treated as a god
scope: This is the live insect itself, held holy in Egypt long ago, not a stone or jewel made in its shape.
examples:
- The ancient Egyptians watched the scarab and treated it as holy.
- People in Egypt long ago prayed near a scarab, which they held as holy.
