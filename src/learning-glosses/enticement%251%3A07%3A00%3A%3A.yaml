senseId: 'enticement%1:07:00::'
synsetId: 04697009-n
simpleMeaning: Ways a thing draws people in by seeming to offer something good in return.
scope: Also called a lure, the draw of a thing that seems to offer a reward in return, not the act of
  winning a person over by stirring hope or desire.
examples:
- The enticement of a free holiday drew many people to the meeting.
- She saw through the enticement and stayed home.
