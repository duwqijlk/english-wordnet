synsetId: 04659795-n
simpleMeaning: the habit of saying little, and not giving more than you need to give
scope: 'Also called reserve and taciturnity: the habit of saying little, not being unable to speak and
  not a short silence in one talk.'
examples:
- Her reticence made it hard to know what she thought.
- He spoke with reticence and gave only short answers.
