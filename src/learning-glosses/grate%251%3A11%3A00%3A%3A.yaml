simpleMeaning: a harsh, rough sound made when one thing rubs or scrapes against another
scope: The harsh sound made by rubbing or scraping; not the act of cutting food into small pieces, and
  not the metal bars that cover an opening.
examples:
- I heard the grate of the chair legs on the stone floor.
- The grate of metal on metal hurt his ears.
