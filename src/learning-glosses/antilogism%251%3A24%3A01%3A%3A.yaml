simpleMeaning: 'In logic, three claims that cannot all be true: two are the starting points of a sound
  argument, and the third denies what that argument proves'
scope: In logic, a set of three claims that clash with each other, not a single false claim and not a
  sound argument.
examples:
- The three claims form an antilogism, since they cannot all be true.
- He showed the antilogism in the argument by denying its conclusion.
