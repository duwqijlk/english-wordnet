scope: Also called NAWCWPNS; the main agency of the United States Navy for research and development for
  fighting by planes and for missile weapon systems, unlike other Navy research bodies.
examples:
- The Naval Air Warfare Center Weapons Division develops weapons for planes.
- Engineers at the Naval Air Warfare Center Weapons Division work on missile systems.
