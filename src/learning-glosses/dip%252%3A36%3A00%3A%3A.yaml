simpleMeaning: to put the strings in the middle of candles into hot wax that has turned to liquid
scope: For making candles, by putting their strings into hot liquid wax; not pushing a hand into a container,
  and not taking something up with a spoon.
examples:
- She dipped the candle wicks into the hot wax.
- Workers dip each wick many times to make thick candles.
