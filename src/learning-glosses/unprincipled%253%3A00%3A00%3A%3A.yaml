simpleMeaning: With no rules of right conduct, and no qualms when doing wrong.
scope: A person or act with no sense of right and wrong to hold them back.
examples:
- The unprincipled trader cheated customers without a second thought.
- His methods were unprincipled, and no one trusted his promises.
