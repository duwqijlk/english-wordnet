simpleMeaning: In biology, the power of one molecule (a very small piece of matter) to join to another
  one whose shape fits its own shape
scope: In biology, this is one tiny piece of matter joining to another that fits its shape; it is not
  knowing a person again from memory, and not praise or thanks for work done well.
examples:
- Molecular recognition lets a hormone join only to the parts of the body that fit it.
- Recognition between the two molecules starts the change inside the cell.
