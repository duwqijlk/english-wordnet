scope: A big black-and-white woodpecker with a pale bill, also called ivory-billed woodpecker; not a small
  woodpecker and not any other bird of the south.
examples:
- An ivorybill drummed on the dead tree above the swamp.
- The ivorybill is so rare that few people have ever seen one.
