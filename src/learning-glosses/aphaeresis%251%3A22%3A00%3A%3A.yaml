senseId: 'aphaeresis%1:22:00::'
synsetId: 13454234-n
simpleMeaning: In linguistics, the dropping of sounds from the start of a word, as when 'coon' stands
  for 'raccoon' or 'till' for 'until'
scope: 'Also called apheresis: the loss of sounds from the start of a word, not from its middle or end
  and not the loss of a whole word.'
examples:
- 'The word ''coon'' shows aphaeresis: its first sound is gone from ''raccoon''.'
- Aphaeresis turned 'until' into 'till' by dropping the first sound.
