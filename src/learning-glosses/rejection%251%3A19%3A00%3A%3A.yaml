simpleMeaning: In medicine, the body's defence that will not take in matter or living things it sees as
  foreign
scope: In medicine, the body's refusal to take in foreign matter or living things, not the act of saying
  no and not the state of being turned down.
examples:
- Rejection of the new liver put the patient back in danger.
- Doctors watched for signs of rejection after the transplant.
