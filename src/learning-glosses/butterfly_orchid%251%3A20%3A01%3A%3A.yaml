simpleMeaning: With large striking blooms striped like a tiger's coat, this is one of many kinds of plant
  of the group Psychopsis.
scope: This is a plant of the group Psychopsis with large striking blooms, not the orchid of Florida and
  the Bahamas with showy brightly coloured flowers.
examples:
- The butterfly orchid had large striped blooms.
- The butterfly orchid's blooms were striped like a tiger's coat.
