simpleMeaning: A group of people who share a love of horses, riding them, and racing them
scope: This is a group of people who love horses and horse riding and racing; horsy set is another name
  for this sense, not a riding club that trains riders and not a group of horse owners.
examples:
- The horsey set gathered at the races on Saturday.
- She joined the horsey set after she started riding.
