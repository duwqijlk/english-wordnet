simpleMeaning: used before 'a' and a noun to say someone or something is special, surprising or very noticeable,
  and it is never used in a negative sentence.
scope: It is not the ordinary 'fairly' or 'completely' use of the word; it marks something as special
  or surprising.
examples:
- Their new house is quite something.
- That was quite a storm we had last night.
