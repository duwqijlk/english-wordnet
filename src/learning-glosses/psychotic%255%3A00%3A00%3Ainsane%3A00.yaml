simpleMeaning: showing or having a serious illness of the mind where a person cannot tell what is real
scope: Having or showing this serious illness of the mind, not the noun for a person who has it, and not
  just strange or angry.
examples:
- He had a psychotic break and thought people were watching him through the walls.
- She was treated for psychotic signs that made her hear voices that were not there.
