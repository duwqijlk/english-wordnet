simpleMeaning: causing sudden rough shakes, or marked by sudden rough shakes and uneven movement
scope: Also called rough, rocky, bumpy, jumpy and jolty; this describes a ride or movement with sudden
  uneven shakes, not smooth movement.
examples:
- The jolting ride in the old truck hurt my back.
- We had a jolting trip over the rough road to the village.
