simpleMeaning: A sudden illness brought on by rickettsia bacteria, spread when an infected flea bites
  a person, and marked by fever, chills, aching muscles and a rash.
scope: One of four interchangeable names for this flea-borne illness, alongside murine, rat and urban
  typhus; it is not the louse-borne form or the mite-borne scrub form.
examples:
- Endemic typhus passes to people when an infected flea bites them.
- After a week of fever and a spreading rash, the tests confirmed endemic typhus.
