senseId: 'charm_campaign%1:04:00::'
synsetId: 00800897-n
simpleMeaning: a planned push of kind words and warm ways by a firm, a politician, or others like them,
  to win more fans and backers
scope: A planned effort to win favour with flattery and warmth, not a sales drive and not a drive for
  votes.
examples:
- The mayor began a charm campaign, shaking hands and praising everyone she met.
- The firm ran a charm campaign to win back its customers.
