simpleMeaning: a shop that sells food and the things people need for their work and daily life, usually
  to people in the army, navy or air force
scope: A shop that sells food and things for work and daily life, usually for people in the army, navy
  or air force; not a place that serves cooked meals.
examples:
- He bought soap and snacks at the commissary.
- The commissary sells boots and food to soldiers.
