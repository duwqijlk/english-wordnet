simpleMeaning: a sound made on a bugle (a brass horn used by soldiers) to tell soldiers to come back
scope: This is a horn call that tells soldiers to come back, not remembering something and not a maker
  asking for a product back.
examples:
- The recall sounded across the camp at sunset.
- When the recall was played, the troops returned at once.
