simpleMeaning: a part of a computer that keeps data so the last thing put in is the first thing taken
  out
scope: The computer part that holds data in last-in, first-out order, not just the list of data itself,
  not a tall chimney for smoke, and not a pile of things.
examples:
- The program puts each new number onto the stack.
- When the stack is full, the computer cannot keep another item in this way.
