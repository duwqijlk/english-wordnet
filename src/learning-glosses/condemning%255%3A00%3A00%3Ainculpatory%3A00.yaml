simpleMeaning: having or giving strong blame, saying that a person or act is very wrong
scope: This is about strong blame for a person or act, not about mild dislike and not about praise.
examples:
- Her condemning words left him in no doubt that she blamed him.
- The paper printed a condemning report on the mayor's actions.
