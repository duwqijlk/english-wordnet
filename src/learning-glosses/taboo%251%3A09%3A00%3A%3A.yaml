simpleMeaning: a strong belief, especially in Polynesia and other South Pacific islands, that stops people
  from using or naming something because it is holy
scope: Also called tabu. This is the belief linked to something holy, especially in the South Pacific;
  it is not just a ban from social custom or dislike.
examples:
- On the island, the old burial ground was under a taboo, and no one spoke its name.
- A taboo stopped people from touching the chief's holy objects.
