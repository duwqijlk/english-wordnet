simpleMeaning: a bad smell that stands out from other smells and is hard to bear
scope: 'Also called stink, stench, reek, fetor, malodor, malodour and mephitis: a smell that is bad and
  easy to tell apart, not a nice smell and not a faint one.'
examples:
- The foetor from the drain made us hold our noses.
- A strong foetor hung over the rubbish heap.
