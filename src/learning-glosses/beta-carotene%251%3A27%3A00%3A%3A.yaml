simpleMeaning: a form of the orange colouring in plants, found in dark green and dark yellow fruit and
  vegetables
scope: A plant substance that gives an orange colour, not a paint colour and not a vitamin taken as a
  pill.
examples:
- Carrots are rich in beta-carotene, which gives them their orange colour.
- Dark green leaves hold plenty of beta-carotene even though they look green.
