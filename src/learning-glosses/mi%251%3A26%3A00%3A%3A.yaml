simpleMeaning: Death of part of the heart when a blocked blood path stops blood from getting to the heart.
scope: This is death of heart tissue when blood cannot reach it, also called myocardial infarct and myocardial
  infarction, not the music note and not a spy office.
examples:
- He had an MI last year.
- The MI left part of his heart dead.
