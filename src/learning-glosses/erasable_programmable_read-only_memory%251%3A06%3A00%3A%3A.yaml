simpleMeaning: In computer science, a chip that holds facts and can be wiped clean by light that cannot
  be seen, then filled with new facts
scope: In computer science, a chip that holds facts and can be wiped clean and filled again, not a chip
  whose facts can never be changed and not a disk that holds files.
examples:
- The erasable programmable read-only memory in the old machine had to be wiped with a special lamp.
- Engineers put new code into the erasable programmable read-only memory after wiping it clean.
