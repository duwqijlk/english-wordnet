simpleMeaning: inside the inner parts of an animal lives a small thing that feeds off the animal, in particular
  a worm in the gut
scope: 'Also called endoparasite, endozoan, entoparasite and entozoan: a small living thing that feeds
  off an animal from inside it, not one that lives on the skin and not a free-living worm.'
examples:
- The entozoon was found in the sheep's liver.
- An entozoon lives in the inner parts of animals and feeds off them.
