simpleMeaning: Got from oil, this clear liquid chemical of carbon and hydrogen catches fire with ease
  and dissolves other things.
scope: This is the clear liquid from oil that catches fire with ease and is used to dissolve other things.
examples:
- Hexane was used to dissolve the grease.
- The bottle of hexane was kept away from flames.
