synsetId: 01051609-n
simpleMeaning: the act of hiding that something is there, by putting something in the way of the eyes
scope: 'Also called cover, covering, or screening: hiding that something is there by blocking the view
  of it, not hiding a feeling and not the blocking of one sense by another.'
examples:
- The masking of the guns kept them hidden from the planes above.
- Careful masking hid the new road from the village.
