simpleMeaning: The link that ties a word or phrase to the thing or idea it stands for.
scope: This is the link itself between a word and its object, not the objects a word covers, and not the
  act of checking a source.
examples:
- The paper treats reference as a relation between a name and the object it picks out.
- Children must learn how reference works before they can use pronouns correctly.
