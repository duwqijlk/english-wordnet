simpleMeaning: An animal whose body heat goes up and down with the heat around it; any animal but birds
  and mammals
scope: An animal whose body heat goes up and down with the heat around it; ectotherm is another name for
  this sense, and this is not a bird or a mammal.
examples:
- A poikilotherm's body heat follows the heat around it.
- Fish are poikilotherms, not birds or mammals.
