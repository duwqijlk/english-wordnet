simpleMeaning: a straight upright piece at the front edge of the steering blade of a boat, which lets
  the blade turn
scope: 'Also called a rudderstock: a straight upright piece that lets a boat''s steering blade turn, not
  the blade itself and not the bar used to move it.'
examples:
- The rudderpost was fixed to the front edge of the rudder.
- The shipwright checked the rudderpost before the boat went out to sea.
