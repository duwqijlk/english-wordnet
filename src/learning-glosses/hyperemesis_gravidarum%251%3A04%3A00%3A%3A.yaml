senseId: 'hyperemesis_gravidarum%1:04:00::'
synsetId: 00120222-n
simpleMeaning: Throwing up again and again while carrying a baby; if bad, it can harm the brain, liver
  and kidneys.
scope: Throwing up again and again while carrying a baby, which can harm the brain, liver and kidneys
  if bad, not a single bout of sickness and not throwing up from bad food.
examples:
- She suffered from hyperemesis gravidarum through the first months of her pregnancy.
- Severe hyperemesis gravidarum can harm the liver if it is not treated.
