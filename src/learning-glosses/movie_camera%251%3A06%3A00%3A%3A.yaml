simpleMeaning: Still pictures taken one after another look as if they move when shown fast, and this tool
  takes them in such a row.
scope: Also called a cine-camera and a motion-picture camera, this tool takes a row of still pictures
  that look as if they move when shown fast.
examples:
- The movie camera caught the children running.
- A movie camera films still pictures one after another.
