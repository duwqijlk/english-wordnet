simpleMeaning: Any pieces of land with water all round them in the lower parts of the Pacific Ocean, in
  its lower-west parts, or in its middle parts.
scope: Any islands in the southern, south-western or central parts of the Pacific Ocean, not islands in
  the northern parts of that ocean and not a single island on its own.
examples:
- The South Sea islands are spread across a wide part of the Pacific Ocean.
- Traders stopped at the South Sea islands on their way across the Pacific Ocean.
