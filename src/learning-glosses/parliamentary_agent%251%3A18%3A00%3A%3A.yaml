senseId: 'parliamentary_agent%1:18:00::'
synsetId: 10420317-n
simpleMeaning: Laws made by the British Parliament touch some firms, and this person is paid to look after
  their business
scope: A person paid to act for firms affected by laws made in Parliament, not a member of Parliament
  and not a lawyer for one firm.
examples:
- The firm hired a parliamentary agent to watch the new bill.
- As a parliamentary agent, she spoke for the rail firms in Parliament.
