simpleMeaning: a word put together from parts that come from different languages, such as a word with
  a Greek beginning and a Latin ending
scope: A word built from parts of different languages, not a living thing bred from unlike parents and
  not a car with two power sources.
examples:
- Monolingual is a hybrid with a Greek prefix and a Latin root.
- The word television is a hybrid of Greek and Latin parts.
