simpleMeaning: A drug that stops the body from reacting too strongly to something it is sensitive to.
scope: This drug stops the body from reacting too strongly to something it is sensitive to; Coricidin
  and chlorpheniramine maleate are other names for it, not a drug that kills pain and not a drug that
  fights infection.
examples:
- The doctor gave her Chlor-Trimeton to stop her body's reaction.
- He took Chlor-Trimeton, and the reaction soon eased.
