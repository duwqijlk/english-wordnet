simpleMeaning: A sign in music that puts the F below middle C on the fourth line of the staff.
scope: The sign that marks the bass range, putting the F below middle C on the fourth line of the staff;
  also called bass clef, not the treble sign that puts the G above middle C on the second line.
examples:
- The F clef sits at the start of the bass staff.
- She read the notes in the F clef with ease.
