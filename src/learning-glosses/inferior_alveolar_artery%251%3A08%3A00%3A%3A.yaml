simpleMeaning: A blood tube that runs through a channel in the lower jaw to feed the lower teeth.
scope: A blood tube through a channel in the lower jaw, feeding the lower teeth, not a tube that feeds
  the upper teeth and not a nerve; arteria alveolaris inferior is another name for this sense.
examples:
- The inferior alveolar artery feeds the lower teeth.
- The dentist avoided the inferior alveolar artery during the work.
