simpleMeaning: one of many plants grown for pretty, shiny leaves with sides that are not the same shape,
  and for bright flowers, usually in groups at stem ends
scope: This is a plant grown for its pretty leaves and bright flowers, not a single kind of plant and
  not a flower on its own without the plant.
examples:
- She grows begonias by the window for their shiny leaves and bright flowers.
- The begonia in the pot has pink flowers in a group at the end of the stem.
