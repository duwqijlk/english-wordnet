senseId: 'madcap%1:18:00::'
synsetId: 10011068-n
simpleMeaning: A person who rushes into things without thinking, caring nothing for the risk or for what
  follows.
scope: 'Also called a lunatic, a daredevil, a hothead, and a swashbuckler: a person who rushes into things
  without thinking, not the adjective sense of acting in haste without thought.'
examples:
- The madcap drove his car at full speed down the hill.
- She was a madcap who loved danger.
