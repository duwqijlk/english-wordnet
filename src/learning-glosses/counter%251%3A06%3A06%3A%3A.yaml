simpleMeaning: In computer science, a part of a computer that holds a value. The value moves in a set
  order through steps, usually whole numbers that follow one after another.
scope: This is a part inside a computer that holds numbers and changes them in order, not a shop table
  and not a piece used in a game.
examples:
- The counter in the program goes from 1 to 2 to 3.
- She set the counter to zero before the program started.
