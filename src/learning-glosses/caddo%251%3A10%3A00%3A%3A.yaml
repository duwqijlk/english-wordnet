simpleMeaning: A group of related tongues of the native peoples of North America, spoken widely in the
  middle west by the people of the same name.
scope: Also called Caddoan and Caddoan language, this is a group of related tongues of the native peoples
  of North America, spoken widely in the middle west by the people of the same name, not the people themselves,
  not other North American language families, and not other tongues of native peoples.
examples:
- Caddo belongs to a family of related tongues.
- Linguists study Caddo and its sister tongues.
