simpleMeaning: The half of the thinking organ that runs the right half of the body, lying on one side
  of the band that joins the two halves
scope: The half of the thinking organ that runs the right side of the body; left brain is another name
  for this sense, not the half that runs the left side of the body.
examples:
- The left hemisphere helps control movement on the right side of the body.
- Damage to the left hemisphere can affect speech and the right hand.
