simpleMeaning: a woody plant of Europe that lives for many years, with yellow flowers in flat-topped clusters,
  then flat pods that break into joints shaped like a horse's shoe
scope: A woody European plant that lives for many years, not a garden pea and not a clover.
examples:
- Horseshoe vetch grew along the dry bank, its yellow flowers in flat clusters.
- The horseshoe vetch had flat pods that broke into joints shaped like a horse's shoe.
