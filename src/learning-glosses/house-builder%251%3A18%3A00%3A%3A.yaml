simpleMeaning: A person whose work is putting up new homes for pay.
scope: A person who puts up new homes as a trade; housebuilder is another name for this sense, not a person
  who repairs homes and not a person who pulls homes down.
examples:
- The house-builder finished three new homes on the street.
- She hired a local house-builder to put up the cottage.
