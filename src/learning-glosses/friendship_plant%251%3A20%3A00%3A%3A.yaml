simpleMeaning: With soft, brownish-green toothed leaves and bunches of small green flowers, this is a
  low nettle without stings, from Central and South America.
scope: Also called panamica and panamiga, this is the low stingless nettle of Central and South America.
examples:
- The friendship plant showed soft brownish-green leaves with toothed edges.
- Her friendship plant bore bunches of small green flowers.
