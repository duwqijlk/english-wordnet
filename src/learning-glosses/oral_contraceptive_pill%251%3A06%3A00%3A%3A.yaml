simpleMeaning: A birth-control tablet that keeps a woman from becoming pregnant; it carries two female
  hormones, estrogen and progestin, which keep an egg from leaving the ovary.
scope: People also call it the pill, anovulant, anovulatory drug, birth control pill, contraceptive pill
  and oral contraceptive, and it works by holding back the release of an egg.
examples:
- She takes an oral contraceptive pill to avoid becoming pregnant.
- Her oral contraceptive pill stopped her from becoming pregnant.
