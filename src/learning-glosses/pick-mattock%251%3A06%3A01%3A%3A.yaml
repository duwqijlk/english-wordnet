senseId: 'pick-mattock%1:06:01::'
synsetId: 92459676-n
simpleMeaning: Joining a pointed digging end and a flat cutting blade, this hand tool breaks up hard ground
  and stony earth and does more than one job.
scope: It is also called pick mattock, and it is not a pick on its own or a flat blade on its own, but
  both in one hand tool.
examples:
- He broke the hard ground with a pick-mattock.
- The pick-mattock does the work of a pick and a flat blade at once.
