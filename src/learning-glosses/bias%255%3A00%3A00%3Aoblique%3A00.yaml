simpleMeaning: cut or set at a slant across the threads of a cloth
scope: A slant across the threads of cloth, not a one-sided feeling and not the line or cut itself.
examples:
- She sewed the skirt on the bias so it would hang well.
- A bias fold gives the dress a soft fall.
