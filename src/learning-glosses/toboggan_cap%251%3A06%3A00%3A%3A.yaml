simpleMeaning: A close-fitting wool hat, often with a long tail that narrows to a point and ends in a
  tuft
scope: A close-fitting wool hat, often with a long tail ending in a tuft; ski cap and stocking cap are
  other names for this sense, and not a wide hat or a hood.
examples:
- He wore a toboggan cap in the snow.
- The toboggan cap had a tassel at the end of its tail.
