simpleMeaning: a sudden act of harm done on purpose to people who are not soldiers, to gain a political
  or religious goal
scope: A sudden violent act against ordinary people for a political or religious aim, not an attack on
  soldiers in war and not a crime done only for money.
examples:
- The terrorist attack on the market killed many shoppers.
- Police said the terrorist attack was planned to spread fear.
