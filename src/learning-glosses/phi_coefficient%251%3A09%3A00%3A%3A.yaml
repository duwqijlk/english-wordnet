simpleMeaning: An index of the relation between two sets of scores that can both be shown on ordered binary
  dimensions, such as male-female.
scope: 'It is also called phi correlation and fourfold point correlation: the number that shows how two
  sets of marks hang together when each can be put on a two-way scale with two ends, like male and female.'
examples:
- The phi coefficient showed how the two sets of scores hung together.
- They worked out the phi coefficient for male and female scores.
