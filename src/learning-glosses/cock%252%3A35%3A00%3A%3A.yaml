simpleMeaning: to pull the striking part of a gun back so it is ready to fire
scope: To pull the striking part of a gun back so it is ready to fire, not the part of a gun that strikes
  the cap, not to turn a tap and not to walk in a proud way.
examples:
- He cocked the rifle and took aim at the target.
- Do not cock the gun until you are ready to shoot.
