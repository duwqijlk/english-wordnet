simpleMeaning: to think of or sort a thing under a general idea or group that covers it, or by how it
  links to another thing
scope: To think of or sort a thing under a general idea or group that covers it, not to mention or point
  to a thing.
examples:
- This plant can be referred to a known group of plants.
- Small sea animals like these are referred to one large group in this book.
