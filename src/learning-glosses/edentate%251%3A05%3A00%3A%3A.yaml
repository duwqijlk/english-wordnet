simpleMeaning: From the warm lands of Central and South America comes an early kind of land animal, feeding
  its young with milk, with few teeth or none at all.
scope: This name covers an early kind of land animal from the warm lands of Central and South America,
  feeding its young with milk and having few teeth or none at all.
examples:
- We saw an edentate in Central America.
- An edentate crossed the path in front of us.
