simpleMeaning: a planned show of kind wishes given when a person starts a trip or a new plan
scope: A planned show of kind wishes at the start of a trip or new plan, not a simple goodbye and not
  a welcome home.
examples:
- They held a bon voyage party before she left for Paris.
- We said bon voyage to him at the start of his new job abroad.
