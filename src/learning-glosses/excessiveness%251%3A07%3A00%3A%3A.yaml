simpleMeaning: Lack of restraint that comes from going past what is enough or allowed.
scope: Lack of restraint from going past what is enough or allowed; also called excess or inordinateness,
  not a single act of going too far and not a crime.
examples:
- The excessiveness of his spending left him in debt.
- Her excessiveness at the table surprised her guests.
