simpleMeaning: a long hollow thing, usually round in shape, used to hold things, liquids, or gases and
  let them move through
scope: 'Also called tube: this is the long hollow material itself, not a hole and not a short container
  for one thing.'
examples:
- The lab used clear tubing to carry water from one tank to another.
- He cut a piece of tubing and joined it to the pump.
