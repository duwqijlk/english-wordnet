simpleMeaning: mainly used of trees, grown bent into a shape fixed by the winds that blow there most of
  the time
scope: Trees bent by the wind; not trees bent by snow or by pruning.
examples:
- A windblown pine leaned over the cliff.
- The windblown trees along the shore all bent inland.
