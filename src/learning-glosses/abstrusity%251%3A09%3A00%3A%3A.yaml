simpleMeaning: wise ideas that are deep and hard to make sense of, full of meaning that is hard to reach
scope: This is deep wisdom that is hard to make sense of, also called abstruseness, profundity and profoundness;
  not plain common sense and not shallow cleverness.
examples:
- The abstrusity of the native proverbs impressed the anthropologist.
- His abstrusity made the talk hard to follow.
