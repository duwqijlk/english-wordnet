simpleMeaning: a state that is not normal, in which the normal flow of a liquid, such as blood, slows
  down or stops
scope: This is a slowing or stopping of the flow of a liquid such as blood; not a still balance between
  opposing forces, and not a lack of movement in general.
examples:
- The doctor said the stasis in her leg could cause a clot.
- Stasis of the blood after the long flight worried the nurse.
