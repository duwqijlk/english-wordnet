simpleMeaning: An art or sport in which people fight with swords and score points under set rules, in
  particular with long thin swords called foils, epees or sabres
scope: This is the sport of fighting with swords, not a barrier that closes off an area.
examples:
- She took up fencing and soon learned to score points with a foil.
- In fencing, the players wear masks and must follow strict rules.
