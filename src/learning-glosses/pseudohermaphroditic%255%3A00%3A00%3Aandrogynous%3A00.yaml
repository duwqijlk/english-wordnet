simpleMeaning: Its inner sex organs are of one sex, but its outer sex marks are of the other sex.
scope: Also called pseudohermaphrodite, this word is used of a living thing whose inner sex organs and
  outer sex marks are of different sexes.
examples:
- The pseudohermaphroditic animal looked female outside but was male within.
- The animal was found to be pseudohermaphroditic.
