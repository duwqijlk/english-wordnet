simpleMeaning: a complaint said in a low voice that is hard to hear clearly
scope: 'Also called mutter, murmur, grumble, murmuring and grumbling: a complaint said in a low voice,
  not just a low sound with no clear words.'
examples:
- His muttering about the long wait could just be heard at the desk.
- Her muttering was a string of complaints about the cold room.
