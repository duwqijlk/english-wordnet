simpleMeaning: Of, or to do with, a deed that is still and same.
scope: This sense is of, or to do with, a deed that is still and same, unlike the sense for, in breeding,
  done by means that need no mate, unlike the sense for to do with bodily acts that happen beyond the
  will, and unlike the sense for made of green growth or plants.
examples:
- The life was vegetative, of a still, same deed.
- The days were vegetative, still and same.
