simpleMeaning: A flowering plant with two first leaves in the seed, whose stem grows by adding layers
  on the outside
scope: A flowering plant with two first leaves in the seed, whose stem grows by adding layers on the outside,
  not a plant with one first leaf and not a plant without flowers; dicot, dicotyledon and exogen are other
  names for this sense.
examples:
- The oak is a magnoliopsid, with two first leaves in its seed.
- Most garden flowers are magnoliopsids.
