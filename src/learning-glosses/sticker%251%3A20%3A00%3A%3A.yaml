simpleMeaning: On a stem or leaf, a small sharp point like a spike.
scope: Also called a spine, a prickle, and a thorn, this is a sharp tip on a stem or leaf, not a short
  knife for piercing.
examples:
- A sticker on the stem caught her sleeve.
- He brushed a sticker off the leaf.
