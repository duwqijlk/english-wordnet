simpleMeaning: In computer science, a copy of what is stored in a computer, sometimes used to find and
  fix faults in a program
scope: In computer science, a copy of a computer's stored contents, not ending all links with a person.
examples:
- The engineer asked for a dump of the machine after it crashed.
- They looked at the dump to find why the program had stopped.
