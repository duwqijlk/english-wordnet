simpleMeaning: A loose dress, a piece of lingerie, for a woman to wear in bed
scope: A loose dress worn in bed by a woman, not a long formal dress, not a ceremonial robe, and not a
  coat worn by a surgeon in an operation.
examples:
- She hung her gown on the hook beside the bed.
- She put on a light gown before she got into bed.
