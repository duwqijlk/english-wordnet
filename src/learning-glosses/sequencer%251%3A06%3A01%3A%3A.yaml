simpleMeaning: In chemistry, a machine that can work out the order of the small units that make up a long
  chain
scope: 'Also called a sequenator: a machine that works out the order of small units in a long chain, not
  a machine that counts the units and not a machine that joins units into a chain.'
examples:
- A sequencer can find the order of units in a chain.
- The sequencer ran all night on the sample.
