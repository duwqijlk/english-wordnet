simpleMeaning: a thin bag that can stretch and grow bigger, most often filled with liquid or gas
scope: 'Another name for a bladder: a bag that can stretch, not a small blister-like sac and not a hard
  box.'
examples:
- The doctor said a vesica in the body can stretch as it fills.
- The vesica held gas and grew bigger as it filled.
