simpleMeaning: A yearly check that older motor vehicles must pass, checking them for safety and for the
  fumes from their exhausts.
scope: 'Also called MOT and MOT test: a yearly check that older motor vehicles must pass, checking them
  for safety and for the fumes from their exhausts, not a check for new vehicles.'
examples:
- Every year the garage puts the old van through its Ministry of Transportation test.
- Her car failed the Ministry of Transportation test because of its fumes.
