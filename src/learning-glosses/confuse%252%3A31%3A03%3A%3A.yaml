simpleMeaning: to baffle someone until they cannot think straight
scope: Baffling a person; fox, throw, befuddle, fuddle, bedevil, confound and discombobulate are other
  names for this same sense, not making something blurry and not mistaking one thing for another.
examples:
- The instructions confused her so much that she gave up halfway.
- His sudden question confused the whole class.
