simpleMeaning: A hardy plant that survives dry weather, grown as animal feed and for seeds that yield
  a gum used to thicken or stiffen materials.
scope: This is the drought-hardy fodder plant grown for its seed gum, not another kind of bean or the
  gum itself; cluster bean is another name for it.
examples:
- Farmers in dry areas grow guar for cattle feed.
- Guar seeds yield a gum that thickens many foods.
