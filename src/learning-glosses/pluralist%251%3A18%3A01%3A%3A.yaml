simpleMeaning: A thinker who holds that no one idea can explain everything in nature
scope: A thinker who holds that many different ideas are needed to explain nature, not a thinker who holds
  that one idea explains it all.
examples:
- The pluralist argued that no single theory could cover every part of nature.
- As a pluralist, she held that the world needs many different explanations.
