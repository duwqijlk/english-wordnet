simpleMeaning: dull-colored nerve tissue that holds nerve-cell bodies and their thin threads; it forms
  the outer layer of the brain, made of nerve cells with no fatty coat
scope: Also called gray matter, gray substance, grey substance, and substantia grisea; the outer layer
  of the brain, not the white nerve tissue beneath it.
examples:
- Grey matter forms the outer layer of the brain.
- Damage to the grey matter can affect thought and memory.
