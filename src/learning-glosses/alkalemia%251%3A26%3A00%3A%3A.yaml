simpleMeaning: Too few hydrogen ions in the blood make its pH rise above 7.45 in this blood disorder
scope: This is a blood disorder in which too few hydrogen ions make the blood's pH rise above 7.45, not
  a disorder in which the blood turns too acid.
examples:
- Alkalemia was found when the blood test showed a pH above 7.45.
- Doctors watched the alkalemia closely as the blood pH stayed high.
