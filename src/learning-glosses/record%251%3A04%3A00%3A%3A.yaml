simpleMeaning: the best or worst result ever officially achieved, as in a sport; an extreme level of achievement
scope: This is one best or worst result, not the overall total of someone's achievements or a list of
  past crimes.
examples:
- She broke the world record for the 100 metres by two hundredths of a second.
- The team's record of twelve straight wins still stands.
