simpleMeaning: A leaf from a climbing pepper plant.
scope: A leaf from a climbing pepper plant; not the Asian plant itself, whose leaves are chewed with betel
  nut, the seed of the betel palm, by people of southeast Asia.
examples:
- He chewed a betel leaf after the meal.
- Betel leaves were wrapped around the nut.
