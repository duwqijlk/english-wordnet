simpleMeaning: In computer science, a small electronic part that makes pictures on a screen from facts
  held in a computer's memory
scope: A small electronic part that makes pictures on a screen from facts held in a computer's memory,
  also called a display adapter, and not the screen itself or the computer's memory.
examples:
- The display adaptor in her laptop turns stored data into pictures.
- Without a working display adaptor, the monitor stayed blank.
