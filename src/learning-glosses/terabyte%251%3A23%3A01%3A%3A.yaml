simpleMeaning: A measure of computer information, equal to 1,000 gigabytes, which is 10 to the power 12,
  or 1,000,000,000,000 bytes.
scope: A measure of computer information, 1,000 gigabytes, not the 1,024-gibibyte measure of the same
  name.
examples:
- The new disk holds two terabytes of photos.
- A terabyte here means a thousand gigabytes.
