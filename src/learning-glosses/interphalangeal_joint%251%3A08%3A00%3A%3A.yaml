simpleMeaning: Any of the places where the small bones of the fingers or toes meet and bend
scope: Any place where two small bones of a finger or toe meet and bend; not the joint at the base of
  a finger and not a joint in the wrist or ankle.
examples:
- The interphalangeal joint lets the finger bend.
- Arthritis in the interphalangeal joint makes the toe stiff.
