simpleMeaning: A large orange and black lizard from the south-west of the United States, safe unless it
  is touched or teased.
scope: Also called Heloderma suspectum; a large orange and black lizard of the south-western United States,
  set beside the beaded lizard of Mexico and other desert lizards.
examples:
- A Gila monster lay in the sun, orange and black against the sand.
- We left the Gila monster alone, since it is safe unless it is touched.
