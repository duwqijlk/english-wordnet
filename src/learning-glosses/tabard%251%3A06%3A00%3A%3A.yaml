simpleMeaning: a short top with no sleeves, with a coat of arms (a special family pattern) on it, worn
  by a knight over his fighting clothes or by a herald
scope: This is a short top worn over fighting clothes, not the hard fighting clothes under it and not
  a plain shirt worn as normal clothes.
examples:
- The knight wore a red tabard over his armor.
- The herald's tabard showed the king's coat of arms.
