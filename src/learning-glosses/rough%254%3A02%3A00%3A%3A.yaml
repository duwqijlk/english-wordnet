simpleMeaning: Moving in a bumpy, jolting way, as if over an uneven surface
scope: The adverb for bumpy, jolting movement, also called roughly; not the adverb meaning violently and
  not the adjective for a jolting ride.
examples:
- The cart rode rough over the cobblestones.
- The old bus rode rough along the potholed street.
