simpleMeaning: Keeping austenite in it at ordinary air temperatures, a metal with enough nickel and chromium,
  or manganese
scope: This metal holds enough nickel and chromium, or manganese, to keep austenite in it at ordinary
  air temperatures, and it is not austenite itself.
examples:
- Austenitic steel is used where austenite must be kept at ordinary air temperatures.
- Austenitic steel holds nickel and chromium.
