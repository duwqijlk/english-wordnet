schema: oewn-learning-gloss-v2
senseId: 'exception%1:10:00::'
synsetId: 07224193-n
simpleMeaning: a reason for speaking badly about someone or something or for saying they are wrong
scope: This is a reason to speak badly about someone or something; it is not a person or thing that does
  not follow a general rule.
examples:
- Her honesty is beyond exception; no one could find a single fault in it.
- The new book is beyond exception; every reader praised it and found nothing to say against it.
