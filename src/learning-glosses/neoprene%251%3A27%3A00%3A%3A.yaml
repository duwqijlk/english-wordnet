simpleMeaning: a rubber made by people that is not harmed by oils and does not get weak with age, used
  in products that keep water out
scope: This is the man-made rubber itself, used in things that keep water out. It is not natural rubber,
  and it is not a finished waterproof product.
examples:
- Her diving suit is made of neoprene, so water stays out.
- These neoprene gloves are not harmed by oil.
