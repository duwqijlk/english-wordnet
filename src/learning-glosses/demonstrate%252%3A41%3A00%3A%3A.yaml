simpleMeaning: to walk with a crowd in public, or to take part in a public protest, to show you are against
  something
scope: 'Also called march: this is walking in public with a crowd, or taking part in a public protest,
  to show you are against something; not showing how something works and not giving proof for something.'
examples:
- Thousands of students demonstrated in the city centre against the new law.
- Workers demonstrated outside the factory to ask for higher pay.
