synsetId: 00532923-n
simpleMeaning: Feelings take shape in the way a person moves, or a story is told by those moves, in a
  new kind of movement
scope: A form of modern movement in which feelings take shape in the way a person moves, also called interpretative
  dance, interpretative dancing or interpretive dancing; not a set folk dance and not a ballet.
examples:
- The interpretive dance showed grief through slow, heavy movements.
- He watched an interpretive dance that told the tale of a lost ship.
