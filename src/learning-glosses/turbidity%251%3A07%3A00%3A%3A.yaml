simpleMeaning: cloudiness in water caused by stirring up the mud at the bottom or by small bits floating
  in it
scope: 'Also called turbidness: cloudiness in water from stirred-up mud or floating bits, not clear water.'
examples:
- The turbidity of the river rose after the storm stirred up the mud.
- We could not see the bottom for the turbidity of the water.
