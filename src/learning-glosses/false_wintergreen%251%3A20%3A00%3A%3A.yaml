scope: An evergreen plant of eastern North America with leathery leaves and many white flowers, not a
  plant that drops its leaves each year and not a tall forest tree.
examples:
- The false wintergreen keeps its leathery leaves all year.
- The false wintergreen was covered with white flowers.
