simpleMeaning: A small fish with spiny fins, of shore or brackish waters, with a big head and a long,
  tapering body whose belly fins work as a sucker.
scope: This sense is also called goby, for a small fish with spiny fins, of shore or brackish waters,
  with a big head and a long, tapering body whose belly fins work as a sucker, unlike the sense for a
  small slender European freshwater fish often used as bait by anglers.
examples:
- The gudgeon swam in brackish water.
- Gudgeons clung with their belly fins.
