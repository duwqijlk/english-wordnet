simpleMeaning: To change in feel until the surface turns rough and thick, like felt cloth.
scope: To turn thick and rough like felt, not the dull look of a surface, and not the mix of sulfur compounds.
examples:
- The wool matted after several washes.
- Her hair matted into knots in the rain.
