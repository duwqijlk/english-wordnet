simpleMeaning: A note that says where a picture that was put out for people to see came from.
scope: This is a note that says where a picture that was put out for people to see came from, not the
  name of the picture itself, and not a note about who owns the words with it.
examples:
- The photo credit named the woman who took the picture.
- Each photo credit in the book gives the name of the maker.
