simpleMeaning: a small amount of batter (a mix of flour and liquid) that is fried, with fruit, meat or
  vegetables in it
scope: This is a small fried food with fruit, meat or vegetables in the batter, not a plain cake and not
  a piece of fried meat on its own.
examples:
- She ate an apple fritter for breakfast.
- The hot corn fritters were crisp and sweet.
