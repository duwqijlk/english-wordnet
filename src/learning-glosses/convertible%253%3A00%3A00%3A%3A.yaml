simpleMeaning: You can swap a thing like this for another thing worth just as much, and get that thing
  instead.
scope: Able to be changed for something else of the same worth; not a company paper, and not a sofa that
  turns into a bed.
examples:
- Convertible securities can be changed into shares.
- The ticket was convertible for another date.
