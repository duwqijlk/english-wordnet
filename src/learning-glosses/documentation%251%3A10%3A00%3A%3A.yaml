simpleMeaning: showing that a fact or claim is true by using papers or records as proof
scope: Showing a fact or claim is true with papers or records as proof; not the papers themselves, and
  not a manual for a program, which are other senses of documentation.
examples:
- The documentation of his degree took weeks, as each record had to be checked.
- Her documentation of the payment showed that the bill had already been paid.
