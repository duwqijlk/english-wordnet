simpleMeaning: push small items into the surface of something until it is covered and made to look attractive
scope: Pushing small objects into a surface as decoration until it is covered; it is not simply making
  a hole, and not fixing something in place.
examples:
- The cook stuck cloves into the ham before roasting it.
- We stuck candles into the cake and lit them.
