simpleMeaning: a race down a hill or slope on a course that turns from side to side, marked by poles standing
  upright
scope: This is a race down a turning course marked by poles, not a straight downhill race and not a race
  on flat ground.
examples:
- He won the slalom with a fast race down the winding course between the upright poles.
- She fell during the slalom when she missed a pole on the winding course.
