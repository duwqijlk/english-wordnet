simpleMeaning: the crime of taking a family member away by force; taking a man's wife in this way is a
  crime against the family relationship and against the wife
scope: This is the crime of taking a family member away by force, and taking a man's wife in this way
  is a crime against the family relationship and against the wife; it is not taking a stranger by force.
examples:
- The abduction of the man's wife shocked the whole village.
- He was charged with the abduction of his brother's child.
