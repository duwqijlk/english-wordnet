simpleMeaning: money you pay so that a ship or boat can stop and stay in the water in one place
scope: Money paid for a ship to stay in the water, not the place itself and not the act of stopping there.
examples:
- The anchorage cost ten dollars for one night.
- He paid the anchorage before he left the harbour.
