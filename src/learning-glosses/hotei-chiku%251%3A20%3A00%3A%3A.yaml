simpleMeaning: A small kind of bamboo from the south-east of China, with thin stems that bend when young
scope: This is a small bamboo from south-eastern China with thin stems that bend when young; fishpole
  bamboo and gosan-chiku are other names for this sense, not a tall bamboo used for building and not a
  bamboo from Japan.
examples:
- The hotei-chiku grew along the garden wall.
- Young hotei-chiku stems bent in the wind.
