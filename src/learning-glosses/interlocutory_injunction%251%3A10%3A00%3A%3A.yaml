simpleMeaning: In law, an order made during a trial that keeps things as they are or keeps the matter
  in dispute safe until the trial ends
scope: In law, an order made during a trial that keeps things as they are until the trial ends; not a
  final order and not a ban made before the trial starts.
examples:
- The judge granted an interlocutory injunction to stop the sale.
- An interlocutory injunction kept the factory open until the trial ended.
