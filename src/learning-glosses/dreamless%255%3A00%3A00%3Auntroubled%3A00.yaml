simpleMeaning: free from the pictures, stories and feelings that come to the mind in sleep
scope: This describes sleep that is not troubled by pictures, stories or feelings in the mind. It does
  not describe being awake and calm.
examples:
- She fell into a dreamless sleep after the long day.
- He had a quiet, dreamless night and woke up rested.
