simpleMeaning: A sore hurt to a joint, where its bands are twisted hard all at once
scope: A painful hurt to a joint from a sudden twist; not a broken bone and not a bruise.
examples:
- She had a sprain in her ankle after the fall.
- The sprain kept him off the field for a week.
