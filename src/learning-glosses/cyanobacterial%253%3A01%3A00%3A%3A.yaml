simpleMeaning: caused by, or to do with, tiny living things of the class Cyanobacteria that make food
  from light
scope: 'Also called cyanophyte: to do with tiny living things that make food from light, not with other
  kinds of tiny living things that do not make food from light.'
examples:
- The cyanobacterial bloom turned the lake water green.
- Cyanobacterial growth in the pond comes from tiny living things that make food from light.
