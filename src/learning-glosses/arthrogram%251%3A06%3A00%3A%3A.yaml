simpleMeaning: A picture made with X-rays of a joint after a dye that shows up on the picture is put into
  it
scope: A picture of a joint made with X-rays after a dye is put in; not a picture of a blood tube and
  not a plain X-ray of a bone.
examples:
- The arthrogram showed the joint after the dye was put into it.
- An arthrogram helped the doctor see the damage inside the knee.
