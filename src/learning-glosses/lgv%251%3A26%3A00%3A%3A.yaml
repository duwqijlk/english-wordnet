simpleMeaning: An illness caught through sex, caused by a kind of chlamydia germ, marked by sores on the
  private parts and swollen glands in the groin.
scope: 'Also called lymphogranuloma venereum and lymphopathia venereum: an illness caught through sex,
  caused by a kind of chlamydia germ, marked by sores and swollen glands in the groin.'
examples:
- LGV is passed on through sexual contact.
- The clinic tested him for LGV after he found swollen glands in his groin.
