simpleMeaning: At one rate but at unlike times, two or more back-and-forth electric pushes run through
  a power set-up.
scope: Polyphase is another name for a power set-up of this kind, where two or more electric pushes run
  at one rate but at unlike times.
examples:
- A multiphase line carries two or more pushes at unlike times.
- The multiphase set-up runs its pushes at unlike times.
