senseId: nacreous%5:00:00:bright:00
synsetId: 00282886-s
simpleMeaning: With a shimmer of bright rainbow hues.
scope: This sense is also called iridescent, pearlescent, opalescent, and opaline, for having a shimmer
  of bright rainbow hues, where iridescent is showing bright colours that move and change like the colours
  of a rainbow, unlike the sense for being made of, or like, mother-of-pearl.
examples:
- The shell was nacreous, with a shimmer of bright hues.
- The bead was nacreous, with rainbow hues.
