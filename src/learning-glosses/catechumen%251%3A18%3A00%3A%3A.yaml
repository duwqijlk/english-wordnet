simpleMeaning: a person who has newly joined the Christian faith and is being taught its main beliefs
  by a teacher of the faith
scope: 'Also called neophyte: a person newly joined to the Christian faith and still being taught its
  main beliefs, not a long-time member and not a priest.'
examples:
- The catechumen met her teacher each Sunday.
- As a catechumen, he was learning the main beliefs of the faith.
