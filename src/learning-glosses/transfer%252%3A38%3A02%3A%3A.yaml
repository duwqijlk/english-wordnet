simpleMeaning: to get off one bus, train or plane and board another to continue a journey
scope: This is switching from one vehicle or route to another during a trip, not the ticket that allows
  it.
examples:
- Transfer at Union Station to reach the airport.
- We transferred from the subway to a bus at the last stop.
