simpleMeaning: to explain what something means, or what someone meant by it
scope: To explain the meaning of words, signs, or actions, not to perform a piece of music or a part in
  a play.
examples:
- She interpreted the old letter as a warning to leave.
- How do you interpret his silence after the meeting?
