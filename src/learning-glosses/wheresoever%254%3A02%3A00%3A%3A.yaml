senseId: 'wheresoever%4:02:00::'
synsetId: 00497575-r
simpleMeaning: At any spot at all, with no one spot in mind.
scope: This sense is also called wherever, for being at any spot at all, with no one spot in mind, where
  wherever is in any place at all, when a place is meant but which one does not matter.
examples:
- Wheresoever you go, I will follow.
- He will live wheresoever he finds work.
