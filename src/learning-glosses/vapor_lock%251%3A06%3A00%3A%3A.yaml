simpleMeaning: gas bubbles can stop flow in a pipe, especially in hot weather, when fuel in the line boils
  and bubbles stop petrol on its way to the engine's fuel mixer
scope: 'Also called vapour lock: gas bubbles that stop flow in a pipe, not a leak in the pipe and not
  a block made by dirt.'
examples:
- Vapor lock stopped the fuel from reaching the engine on the hot day.
- The mechanic blamed vapor lock when the car died in the heat.
