simpleMeaning: a skilled move in which the body turns right over, feet over head, forwards or backwards,
  and lands back on its feet
scope: A skilled move in which the body turns right over, feet over head, and lands back on its feet,
  with flip as another name for this sense, and not a jump in the air or a roll along the ground.
examples:
- The child did a somersault on the grass.
- She turned a neat somersault off the low wall.
