simpleMeaning: the act of putting people or businesses into one group, or of running things as one such
  group
scope: This is forming a group of people or businesses, or running things as one such group; it is not
  the selling of a piece of writing or a cartoon to many newspapers and magazines at the same time.
examples:
- Through syndication, the small firms were run together as one group.
- The syndication of the loan let several banks share the work of lending the money.
