senseId: 'greenstick_fracture%1:26:00::'
synsetId: 14317180-n
simpleMeaning: A bone break that goes only part way through, so the bone bends but is split on one side
  only, most often in children.
scope: A bone break that goes only part way through, most often in children, not a clean break right through
  a bone and not a break that heals without bending.
examples:
- The doctor said the greenstick fracture would heal in a few weeks.
- A greenstick fracture bends the bone without breaking it right through.
