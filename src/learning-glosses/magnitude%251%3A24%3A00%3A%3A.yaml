simpleMeaning: a number that compares two amounts; two amounts share a class if one is under ten times
  the other, and the gap between them is counted in powers of ten
scope: A number for comparing amounts, not the size of a thing and not how important something is.
examples:
- The two stars are of the same order of magnitude, since one is less than ten times as bright as the
  other.
- The magnitude of the two amounts differs by two powers of ten.
