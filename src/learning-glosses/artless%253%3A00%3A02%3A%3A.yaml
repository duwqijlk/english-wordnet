simpleMeaning: not able to hide your feelings, and not dishonest or false in what you say or do
scope: 'Also called ingenuous: this is about not hiding your feelings and not trying to trick others,
  not about being sly or false.'
examples:
- Her artless smile showed she was truly happy, with nothing to hide.
- He gave an artless answer and said exactly what he felt.
