simpleMeaning: fit to be spent or used up
scope: This describes money, supplies, or other things that can be spent or used up. It does not describe
  things that must be kept and never used.
examples:
- This money is expendable, so we can spend it on the trip.
- Fuel is expendable in this plan, and the team will use it all.
