simpleMeaning: The detective keeps the answer till the end, while you are left to work out the puzzle
  in a book of this kind.
scope: Also called detective novel, it leaves the puzzle to the reader and holds the answer till the end.
examples:
- The mystery novel kept me guessing until the detective explained it at the end.
- We read the mystery novel together and tried to work out the puzzle first.
