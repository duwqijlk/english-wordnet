simpleMeaning: In Arabic, a respectful word for a person who has made the journey to Mecca for religious
  reasons
scope: This is a respectful word for the person who has made the journey, not the journey to Mecca itself
  and not a word for any person who travels.
examples:
- After his journey to Mecca, people called him Hajji.
- The hajji was welcomed home by his family after he came back from Mecca.
