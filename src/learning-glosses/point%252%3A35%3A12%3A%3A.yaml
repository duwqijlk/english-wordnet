simpleMeaning: To mark the words of a psalm to show where the music changes.
scope: This is not indicating something with a finger, sharpening an end, or repairing brick joints; it
  is adding marks to psalm text for singing.
examples:
- The choirmaster pointed the psalm before rehearsal.
- The psalms were pointed to show the choir where the music changes.
