simpleMeaning: Blood passes straight from left to right through a hole in the wall between lower chambers,
  a common heart fault from birth; a large hole may make the heart fail.
scope: 'A common fault in the heart from birth: a hole in the wall between the lower chambers lets blood
  pass from left to right.'
examples:
- The baby was born with a ventricular septal defect, a hole in the wall between the heart's lower chambers.
- A large ventricular septal defect may make the heart fail.
