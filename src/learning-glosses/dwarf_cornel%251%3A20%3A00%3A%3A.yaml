simpleMeaning: A mat-forming plant that keeps coming back year after year, with leaves in rings at its
  shoot tips and red berries; it occurs from Greenland to Alaska.
scope: 'Another name for bunchberry, crackerberry and pudding berry: the whole mat-forming plant, not
  just the red berries it bears.'
examples:
- Dwarf cornel forms a low carpet beneath the spruce trees.
- The dwarf cornel's red berries stood out against the green leaves.
