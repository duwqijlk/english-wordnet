simpleMeaning: a type of literary criticism that studies how a piece of writing is put together.
scope: This is not the general mental act of taking anything apart, and it is not a summary of results;
  it is one kind of criticism of writing.
examples:
- Her essay is a close analysis of the novel's opening chapter.
- The class compared two analyses of the same poem.
