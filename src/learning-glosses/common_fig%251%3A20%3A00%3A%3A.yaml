scope: A tree of the lands round the Mediterranean, grown far and wide for fruit that can be eaten; fig
  and common fig tree are other names for this sense, not a wild tree and not a tree grown for wood.
examples:
- The common fig bore sweet fruit in summer.
- They grew a common fig against the warm wall.
