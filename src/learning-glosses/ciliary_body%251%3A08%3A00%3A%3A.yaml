simpleMeaning: the part of the coat of the eye between the dark layer at the back and the coloured ring
scope: The part of the eye's coat between the dark layer at the back and the coloured ring, not the dark
  layer itself and not the coloured ring.
examples:
- The ciliary body produces aqueous humor.
- The ciliary body sits between the choroid coat and the iris.
