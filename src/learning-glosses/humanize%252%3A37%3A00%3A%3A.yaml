simpleMeaning: to make something more kind and caring
scope: To make a thing or place kinder and less cruel, not to give a thing the shape, face, or mind of
  a person.
examples:
- New rules humanized the prison by giving men books and time with their families.
- She humanized the office by treating each worker with care and respect.
