simpleMeaning: a place where someone hides, usually a place far from other people and used by people who
  break the law
scope: Also called den and hideaway. This is a place where people hide, usually far from other people,
  not just a quiet place to rest.
examples:
- The police found the gang's hideout in the hills.
- They kept food and guns at their hideout outside the town.
