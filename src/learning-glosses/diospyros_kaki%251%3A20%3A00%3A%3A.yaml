simpleMeaning: A small Asian tree that loses its leaves each year and bears large red or orange fruit
  that can be eaten but tastes sharp and dry.
scope: A small fruit tree of Asia, also called kaki and Japanese persimmon; not a persimmon of America
  and not a tree grown for its wood.
examples:
- Diospyros kaki bore large orange fruit in the autumn.
- We planted a Diospyros kaki for its red fruit.
