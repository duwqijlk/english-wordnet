simpleMeaning: small sea creatures with a hard shell that jump like tiny insects, common on ocean beaches
scope: This is a small jumping sea creature often found on ocean beaches, also called a sandhopper, a
  sand flea and a beach flea; not a true biting flea and not a large crab.
examples:
- We saw sand hoppers jumping around our feet on the beach.
- The sand hopper leapt away as the wave came in.
