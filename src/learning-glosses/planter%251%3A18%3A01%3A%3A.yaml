simpleMeaning: a worker who puts seeds or young plants into the ground to grow
scope: A worker who puts seeds or young plants in the ground, not a pot for plants in a house and not
  the owner or head of a large farm.
examples:
- The planter put each young plant into the soft ground in a straight line.
- Two planters worked all morning, putting seeds into the ground.
