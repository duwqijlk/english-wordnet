simpleMeaning: Personal goods that meet the rules, sold on board ship or at a navy base and taken out
  of the buyer's pay
scope: Personal goods that meet the rules, sold on board ship or at a navy base and taken out of the buyer's
  pay; not free kit issued by the navy and not goods sold in an ordinary shop.
examples:
- Sailors bought soap and razors from the small stores.
- The small stores charged his purchases to his pay.
