simpleMeaning: around a thing that gives off rays, the stretch of space where its electric and magnetic
  waves push on another like thing without touching it
scope: 'Also called field or field of force: the space around a thing giving off rays where its waves
  push on another like thing without touching it, not a stretch of open land and not a push made by touch.'
examples:
- The radio tower's force field could push on a nearby aerial without touching it.
- Scientists mapped the force field around the glowing tube.
