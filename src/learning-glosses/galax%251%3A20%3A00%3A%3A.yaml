simpleMeaning: an evergreen that grows in dense clumps, whose shiny leaves, rounded or heart-shaped, redden
  to copper, maroon or purple in autumn; its tiny white flowers appear on slender upright spikes.
scope: Another name for the low evergreen plant also called beetleweed, galaxy and coltsfoot, not the
  star system sense of galaxy.
examples:
- Galax spreads across the woodland floor in shiny green patches.
- The galax leaves turned copper after the first frost.
