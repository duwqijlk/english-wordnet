simpleMeaning: Taking away all that can be seen, heard, or felt is a cruel way of hurting a person in
  the mind.
scope: It means hurting a person in the mind by cutting off every sight, sound, and touch.
examples:
- The victim of sensory deprivation could see, hear, or feel nothing.
- They used sensory deprivation to hurt the mind.
