simpleMeaning: a sore, swollen state of the bladder and the tubes that carry urine from the kidneys
scope: A swelling of the bladder and the tubes that carry urine, not an infection of the kidneys and not
  a bladder stone.
examples:
- She had cystitis and felt a burning pain when she passed water.
- The doctor said cystitis was the cause of her need to pass water so often.
