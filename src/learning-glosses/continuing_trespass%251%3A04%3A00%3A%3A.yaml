senseId: 'continuing_trespass%1:04:00::'
synsetId: 00736081-n
simpleMeaning: In law, a wrongful entry that is not brief or on and off, but goes on for as long as the
  offending thing stays.
scope: In law, a wrongful entry that goes on for as long as the offending thing stays, not a single brief
  entry and not a visit that is allowed.
examples:
- Dumping his rubbish on my land was a case of continuing trespass.
- The continuing trespass ended only when the fence came down.
