simpleMeaning: A bushy tree of the Pacific coast of the United States; it gives a bark used to loosen
  the bowels.
scope: A bushy tree of the Pacific coast of the United States that gives a bark used to loosen the bowels,
  also called bearberry, bearwood, chittamwood or chittimwood; not a bushy tree of the east coast, and
  not a tree grown for its fruit.
examples:
- The cascara buckthorn grows along the Pacific coast.
- Bark from the cascara buckthorn is dried for use as a laxative.
