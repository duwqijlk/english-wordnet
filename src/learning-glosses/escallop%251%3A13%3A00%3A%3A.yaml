senseId: 'escallop%1:13:00::'
synsetId: 07813617-n
simpleMeaning: The eatable muscle of shellfish with fan-shaped shells, served grilled or poached or in
  salads or cream sauces.
scope: This sense is also called scallop and scollop, the eatable muscle of shellfish with fan-shaped
  shells, served grilled or poached or in salads or cream sauces, unlike the sense for a thin slice of
  meat, above all veal, usually fried or grilled, and unlike the sense for an eatable sea bivalve with
  a fluted fan-shaped shell that swims by spurting water from the shell in a run of snapping moves.
examples:
- Escallops grill well in cream sauces.
- The escallop is eatable muscle.
