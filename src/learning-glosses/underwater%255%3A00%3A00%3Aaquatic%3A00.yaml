simpleMeaning: growing or staying below the surface of the water
scope: For a plant or animal that grows or stays below the surface of the water; not for a person who
  goes under the water for a short time.
examples:
- These underwater plants grow on the bottom of the lake.
- The underwater leaves stay green all year.
