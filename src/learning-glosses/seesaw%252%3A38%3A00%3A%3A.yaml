simpleMeaning: to move up and down again and again, first one side high and then the other side high
scope: This is moving up and down again and again, first one side high and then the other; not the long
  board children play on, and not rocking from side to side in an unsteady way.
examples:
- The small boat seesawed on the waves all afternoon.
- The branch seesawed up and down in the strong wind.
