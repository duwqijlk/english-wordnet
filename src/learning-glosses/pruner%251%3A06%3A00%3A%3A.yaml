simpleMeaning: A saw on a long handle, with a bent blade at the end and sometimes a cutter, used for cutting
  back small trees.
scope: Also called lopper and pruning hook; a long-handled saw with a bent blade, sometimes with a cutter,
  for cutting back small trees, not a worker who thins out and trims trees and shrubs.
examples:
- He reached the high branch with the pruner and cut it back.
- The pruner has a long handle and a bent blade for small trees.
