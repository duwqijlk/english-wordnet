senseId: incisive%5:00:00:perceptive:00
synsetId: 01748764-s
simpleMeaning: Able to pick out fine points of difference and judge them well.
scope: Also called sharp, keen, piercing, acute, penetrating, discriminating, and knifelike, this is about
  a mind that picks out fine differences; not the use for a thing fit for cutting or piercing.
examples:
- Her comments were incisive, and they picked out the fine points others missed.
- His reasoning was incisive, drawing fine lines between the two cases.
