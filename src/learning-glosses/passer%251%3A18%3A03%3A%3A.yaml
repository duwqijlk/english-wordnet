simpleMeaning: A person who other people take to be a member of a different group of people, set apart
  by race or by family origin and way of life
scope: This is a person taken as part of a different race or family group, not a football player who throws
  the ball, not someone walking by, and not a student who does well in a test.
examples:
- As a passer, he was taken for a member of another racial group.
- People who knew her only at work took the passer to be from a different ethnic group.
