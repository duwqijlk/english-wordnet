simpleMeaning: a former British navigation measure of 6,000 feet, equal to 1,828.8 meters
scope: The old 6,000-foot British sea unit, not the 1,852-meter international navigation unit or the 6,080-foot
  Admiralty unit.
examples:
- In the age of sail, British mariners used their own sea mile.
- Charts that still used the British sea mile were outdated by the twentieth century.
