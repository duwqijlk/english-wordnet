simpleMeaning: These small trees and bushes win praise for the bunches of white, deep pink or red flowers
  they carry, their fine leaves, and the wide way they spread.
scope: A shrub or small tree prized for its leaves and flower bunches, not a timber tree and not a plant
  grown for fruit.
examples:
- Calliandra spread its wide branches over the garden path.
- The calliandra was in flower, its pink bunches bright against the leaves.
