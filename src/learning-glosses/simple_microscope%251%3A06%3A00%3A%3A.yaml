simpleMeaning: a tool with one curved lens that makes small things look big
scope: A tool with one curved lens for making small things look big, also called a hand glass and a magnifying
  glass; not a tool with many lenses and not a telescope.
examples:
- She used a simple microscope to look at the tiny leaf.
- The simple microscope made the small print easy to read.
