senseId: 'nonindulgence%1:07:00::'
synsetId: 04889193-n
simpleMeaning: A way of life in which a person gives up the joys of the world and denies themself what
  they want.
scope: A way of life in which a person gives up the joys of the world and denies themself what they want,
  with austerity and asceticism as other names for this sense, not a short fast and not being poor.
examples:
- His nonindulgence showed in a plain life without rich food.
- Nonindulgence means staying away from the pleasures of the world.
