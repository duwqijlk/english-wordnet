simpleMeaning: A home of rock and sun-dried mud brick, built on sheltered flat places in the side of a
  steep rock face.
scope: A home of rock and sun-dried mud brick built on sheltered flat places in the side of a steep rock
  face, not a cave and not a house on flat ground.
examples:
- The cliff dwelling was built into a sheltered ledge.
- They explored the cliff dwelling high in the rock face.
