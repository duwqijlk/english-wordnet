simpleMeaning: a person who studies living things and puts them into many groups, using small differences
  between them to decide the groups
scope: 'Also called splitter: this is a person who makes many groups of living things from small differences,
  not a drawing tool and not a wall between rooms.'
examples:
- The divider put these plants into ten small groups because of tiny differences in their leaves.
- As a divider, he split the fish into many groups that other scientists kept as one.
