simpleMeaning: A salt of potassium (KCl), sold under names such as Kaochlor, K-lor, Klorvess and K-lyte,
  taken as pills to treat low potassium in the body.
scope: 'Also called potash muriate, potassium chloride, potassium muriate, K-lor, K-lyte, Kaochlor, or
  Klorvess: a salt of potassium taken as pills, not a salt used in cooking and not a drug that lowers
  blood pressure.'
examples:
- The doctor gave her K-Dur 20 for low potassium.
- K-Dur 20 comes in pill form.
