simpleMeaning: An upright shrub with bunches of brown-yellow flowers; its dried leaves are used as a drug
  to clear the bowels; sometimes put in the genus Cassia.
scope: 'Also called tinnevelly senna, true senna, Alexandria senna, Alexandrian senna, Cassia acutifolia,
  Cassia augustifolia and Senna alexandrina: an upright shrub with bunches of brown-yellow flowers, whose
  dried leaves are used as a drug to clear the bowels; other shrubs with yellow flowers have leaves of
  no use as a drug.'
examples:
- Indian senna grows upright with bunches of brown-yellow flowers.
- The dried leaves of Indian senna clear the bowels.
