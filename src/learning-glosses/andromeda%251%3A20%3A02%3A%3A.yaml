simpleMeaning: an Asian shrub that keeps its broad shiny leaves all year and bears hanging bunches of
  white flowers
scope: Also called lily-of-the-valley tree; an Asian evergreen shrub with hanging white flower bunches,
  not the other andromeda shrubs of the same name.
examples:
- The andromeda in the garden kept its glossy leaves through winter.
- White flowers hung in bunches from the andromeda.
