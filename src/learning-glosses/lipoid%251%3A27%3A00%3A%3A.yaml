simpleMeaning: An oily organic material that water cannot dissolve but organic liquids can, and a basic
  building block of living cells together with proteins and carbohydrates.
scope: Another name for this class of cell substance, shared with lipide and lipid, not a protein or carbohydrate.
examples:
- A thin lipoid layer coated the surface of the cell.
- Lipoid substances will not mix with water.
