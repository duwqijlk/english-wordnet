simpleMeaning: a common bird from Europe, Asia and Africa, about the size and color of an American crow,
  that lives in groups with others of its kind
scope: This is the bird that lives in groups, not the chess piece that moves in a straight line along
  the sides of the board.
examples:
- A rook built its nest in the tall tree near the field.
- We watched a group of rooks looking for food in the grass.
