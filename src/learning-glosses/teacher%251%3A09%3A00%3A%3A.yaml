simpleMeaning: An idea or thing spoken of as if it were a person who gives lessons or shows you how to
  live.
scope: This is not a real person who works in a school; it is an idea or force imagined as someone who
  gives lessons.
examples:
- Experience is a harsh teacher.
- History has been a patient teacher to those who listen.
