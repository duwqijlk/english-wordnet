senseId: 'toughen%2:30:00::'
synsetId: 00304090-v
simpleMeaning: to make a person or thing stronger and harder to break or hurt
scope: This sense is making a person or thing stronger so hard use hurts it less; it is not weakening
  or softening it, and it is not only about the body.
examples:
- Hard work on the farm toughened his hands.
- This training will toughen the young players for the long season.
