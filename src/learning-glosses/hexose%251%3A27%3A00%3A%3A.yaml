simpleMeaning: Each tiny bit of this simple sugar holds six bits of carbon
scope: A simple sugar with six bits of carbon in each tiny bit of it, not a sugar with five bits of carbon
  and not a sugar made of two joined sugars.
examples:
- Glucose is a hexose that the body uses for power.
- The test showed a hexose with six carbon atoms in each molecule.
