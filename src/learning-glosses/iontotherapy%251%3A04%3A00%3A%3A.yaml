simpleMeaning: The bits of a drug are moved into the flesh by a small electric push in one place, to treat
  a sick part of the body
scope: The bits of a drug moved into the flesh by a small electric push in one place; also called electromotive
  drug administration, ionic medication or iontophoresis; not a drug taken by mouth and not a treatment
  with no electric push.
examples:
- Iontotherapy eased the pain in her shoulder.
- The doctor chose iontotherapy for the sore muscle.
