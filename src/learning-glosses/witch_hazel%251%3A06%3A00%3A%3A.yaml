simpleMeaning: A part taken from a certain shrub goes into a liquid with alcohol in it, making a skin
  wash that makes the skin feel tight
scope: This sense is also called wych hazel, and it is not the shrub the wash comes from.
examples:
- She dabbed witch hazel on her skin.
- He bought witch hazel.
