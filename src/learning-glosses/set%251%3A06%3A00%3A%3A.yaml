senseId: 'set%1:06:00::'
synsetId: 04304614-n
simpleMeaning: The scenery and objects arranged on stage to show where a play or film takes place.
scope: This is not a radio or television receiver, not a group of matching items and not the hardening
  of a material; it is the staged scenery and props.
examples:
- The set for the second act was a shabby London flat.
- Builders spent a week putting up the set before rehearsals began.
