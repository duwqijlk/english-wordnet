schema: oewn-learning-gloss-v2
senseId: 'weight%1:23:02::'
synsetId: 13610524-n
simpleMeaning: In statistics, a number that each item in a frequency distribution is multiplied by to
  show how much it matters compared with the rest.
scope: This is a statistical number applied to data, not the heaviness of an object or the downward force
  of gravity on it, not a heavy thing, not a piece of gym equipment, not a unit or system of units for
  measuring heaviness, not an oppressive burdening feeling, not the general importance given to a matter,
  and not the verbs meaning to load something down or to slant something.
examples:
- The poll gave each household in the remote district a weight of 0.5.
- The software multiplies every score by a weight before adding the scores together.
