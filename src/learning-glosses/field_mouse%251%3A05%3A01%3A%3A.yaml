simpleMeaning: Any small mouse-like rodent of the Cricetidae family, mostly voles of genus Microtus, with
  a stocky body, short tail and ears that hardly show, living in fields and meadows.
scope: Any of several small rodents that live in open grassy country rather than in houses, chiefly voles.
  It is not the house mouse, which lives indoors, and it is not a rat. The name is ordinary English, not
  a precise species name.
examples:
- A field mouse darted from the stubble and vanished into the hedge.
- Barn owls hunt the field mouse across open meadows at night.
