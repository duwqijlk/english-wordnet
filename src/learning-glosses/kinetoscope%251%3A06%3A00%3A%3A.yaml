simpleMeaning: 'A machine made by Edison that showed moving pictures: a loop of film ran without end over
  a light, past a fast shutter, and came before the modern film'
scope: A viewing machine made by Edison that showed moving pictures on a loop of film, an early step toward
  the modern film, not the modern film itself.
examples:
- The Kinetoscope showed moving pictures on a loop of film.
- Edison's Kinetoscope came before the modern motion picture.
