simpleMeaning: the act of putting in a remark or an action that breaks into what is going on
scope: 'Also called interpolation and interpellation: this is breaking in with a remark or action, not
  a sudden short word that shows a strong feeling, such as ''oh!'' or ''wow!''.'
examples:
- His interjection stopped the talk for a moment.
- Her sudden interjection broke into the meeting.
