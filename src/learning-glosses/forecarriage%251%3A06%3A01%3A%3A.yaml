simpleMeaning: A small cart on wheels fixed under the front end of the beam of a plow.
scope: A small wheeled cart under the front of a plow beam; fore carriage is another name for this sense,
  not the plow itself and not a cart pulled by a horse.
examples:
- The forecarriage creaked as the plow moved over the rough field.
- He oiled the wheels of the forecarriage before the morning's work.
