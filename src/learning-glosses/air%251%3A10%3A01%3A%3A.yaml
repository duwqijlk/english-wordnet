simpleMeaning: A series of musical notes that forms a tune you can recognize.
scope: This is not the mixture of gases we breathe or one of the four ancient elements; it is a melody.
examples:
- The singer performed a gentle air from an old opera.
- The violinist played the air slowly, letting each note ring.
