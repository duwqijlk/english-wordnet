simpleMeaning: a low part written out in full, with numbers that show the chords to be played
scope: 'Also called continuo or figured bass: a low part written in full with numbers for the chords,
  not a single tune and not a part played from memory.'
examples:
- The basso continuo kept the low notes going under the song.
- She played the basso continuo from the full written part.
