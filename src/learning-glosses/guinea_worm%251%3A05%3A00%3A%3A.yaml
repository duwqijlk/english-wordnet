simpleMeaning: A round-bodied animal that lives as a parasite in India and Africa, in the belly or under
  the skin of people and other animals with backbones.
scope: Also called Dracunculus medinensis; a round-bodied animal that lives as a parasite in India and
  Africa, in the belly or under the skin of people and other animals with backbones.
examples:
- The Guinea worm lived under the skin of the patient.
- A Guinea worm was found beneath the skin of the traveller.
