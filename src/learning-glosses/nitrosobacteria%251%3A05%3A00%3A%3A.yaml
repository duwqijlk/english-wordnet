simpleMeaning: Tiny living things in the soil that turn ammonia, a sharp-smelling gas, into nitrites,
  a kind of nitrogen salt.
scope: Tiny living things in the soil that turn ammonia, a sharp-smelling gas, into nitrites, a kind of
  nitrogen salt, with nitrous bacteria as another name for this sense, not the soil germs that turn one
  nitrogen salt into another and not a plant.
examples:
- Nitrosobacteria in the soil turn ammonia into nitrites.
- Nitrosobacteria start the change of ammonia in the ground.
