simpleMeaning: To do with giving back harm for harm done, as a fitting payback for a wrong.
scope: This word is about payback for a wrong, not about pardon or mercy; it is also called retributory.
examples:
- The judge spoke of retributive justice.
- They called for retributive justice after the crime.
