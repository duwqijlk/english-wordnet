simpleMeaning: a person who sits on a jury, or who is waiting to be called to sit on one
scope: This is a person who sits on a jury or waits to be called to one, not a judge and not a witness.
examples:
- The juror listened carefully to every word of the trial.
- As a juror, she had to decide whether the man was guilty.
