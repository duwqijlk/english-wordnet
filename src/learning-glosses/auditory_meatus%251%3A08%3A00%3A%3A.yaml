simpleMeaning: From the ear flap inward, one of these two outer-ear tubes leads to the thin cover that
  shakes with sound.
scope: This is the same passage as the auditory canal, also called auditory canal, acoustic meatus, ear
  canal, and external auditory canal, not a tube of the inner ear.
examples:
- Wax blocked the auditory meatus and sound grew faint.
- The auditory meatus opens at the ear flap.
