simpleMeaning: A harmless European animal with no poison, marked by a bright yellow ring round its neck,
  common in England
scope: This harmless yellow-collared animal is also called ring snake and ringed snake, and is not a poisonous
  kind and not an American kind.
examples:
- A grass snake slipped through the long grass by the pond.
- The grass snake basked in the sun on the warm stone.
