simpleMeaning: A dark brown heavy liquid that gives off fumes and eats away what it touches, not a metal
  but one of the halogen group, found in sea water.
scope: Also called Br and atomic number 35, this dark brown heavy liquid gives off fumes and eats away
  what it touches, is found in sea water and belongs to the halogen group, unlike chlorine and iodine,
  which are other members of the same group.
examples:
- Bromine stains the skin dark brown.
- Chemists keep bromine in sealed glass.
