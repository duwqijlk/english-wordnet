simpleMeaning: 'It frames a building, keeps heat in or out, and resists fire and mould: a light building
  stuff, made in blocks before use, first made in the mid-1920s.'
scope: 'Also called autoclaved aerated concrete, autoclaved cellular concrete, autoclaved concrete, and
  autoclaved lightweight concrete: a light building stuff that frames a building and resists fire and
  mould.'
examples:
- The walls were built of porous concrete.
- Porous concrete kept the house warm in winter.
