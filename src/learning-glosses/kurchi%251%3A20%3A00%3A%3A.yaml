simpleMeaning: The bark of this warm-Asia tree was once used to cure dysentery, which brings bloody stools,
  and diarrhea, which brings watery stools; its wood is hard and white.
scope: Also called conessi, ivory tree, and kurchee, this warm-Asia tree has hard white wood and bark
  that was once used to cure dysentery and diarrhea.
examples:
- They cut a kurchi for its hard white wood.
- The bark of the kurchi was once used to cure dysentery.
