simpleMeaning: pain in the head caused by arteries (blood vessels) in the brain getting wider, by muscles
  getting tight, or by a bad reaction to drugs
scope: Pain inside the head from a physical cause. It is not a person or thing that causes worry or unhappiness.
examples:
- She had a bad headache and lay down in a dark room.
- His headache got worse after he took the new drug.
