simpleMeaning: A graceful tree with one trunk or a branching trunk, tipped with bunches of long, narrow
  leaves and large sprays of scented white, yellow, or red flowers, of New Zealand.
scope: This sense is also called cabbage tree, for a graceful tree with one trunk or a branching trunk,
  tipped with bunches of long, narrow leaves and large sprays of scented white, yellow, or red flowers,
  of New Zealand, unlike the sense for a gaunt Tasmanian evergreen shrubby tree with slender tapering
  leaves 3 to 5 feet long.
examples:
- The grass tree flowered in spring.
- Grass trees grew on the hill.
