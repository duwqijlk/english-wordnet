simpleMeaning: a large pipe or cable that carries water, gas or electricity, or takes away waste.
scope: This is not the most important thing or person; it is a large pipe or cable in a supply system.
examples:
- Workers repaired a broken water main under the street.
- A gas main runs along the side of the road.
