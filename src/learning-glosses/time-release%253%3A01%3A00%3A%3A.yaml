simpleMeaning: describes a mix, often a drug, made to let out its strong part bit by bit over a while
scope: Said of a dose or mix that gives out its strong part bit by bit over a while, not one that works
  all at once and not one that must be taken often.
examples:
- She took a time-release pill that worked through the night.
- This time-release capsule lets out the drug slowly over twelve hours.
