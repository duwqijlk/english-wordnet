simpleMeaning: a tool with a handle and a stick at the end that can swing freely, used by hand to beat
  grain so the seeds come out
scope: This is the farm tool with a handle and a swinging stick, not the verb that means to wave or move
  about a lot.
examples:
- He used a flail to beat the grain on the barn floor.
- The old flail had a long handle and a short swinging stick.
