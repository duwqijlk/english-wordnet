simpleMeaning: Shaking a little and not in a steady way, as with cold or fear, or like the leaves of an
  aspen in a light wind
scope: 'Also called trembling: shaking a little and unevenly, not the cold feeling that starts a fever.'
examples:
- Her shivering hands could hardly hold the cup.
- He stood with shivering knees in the cold wind.
