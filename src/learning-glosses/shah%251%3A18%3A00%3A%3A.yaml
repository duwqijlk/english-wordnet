simpleMeaning: the title of the man who ruled Iran in the past and got his power from his family
scope: The title once used for the ruler of Iran who got his power from his family, not a general word
  for a king of another country.
examples:
- The Shah ruled Iran for many years.
- People called him the Shah when he was king of Iran.
