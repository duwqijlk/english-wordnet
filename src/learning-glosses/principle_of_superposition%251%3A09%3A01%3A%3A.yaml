simpleMeaning: In geology, the lowest layer in a set of rock layers laid down from sediment in sheets
  is the oldest
scope: Also called superposition and the superposition principle, this rule in geology says the lowest
  rock layer is the oldest, not a rule about waves adding up.
examples:
- Geologists used the principle of superposition to work out which rock layer was oldest.
- The principle of superposition put the bottom layer first in age.
