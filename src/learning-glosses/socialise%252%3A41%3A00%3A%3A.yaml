senseId: 'socialise%2:41:00::'
synsetId: 02391987-v
simpleMeaning: To teach a person how to live and get on with others.
scope: Also called socialize, this is teaching a person how to live and get on with others, not making
  them follow socialist ideas, and close in sense to the use for getting a person ready for social life,
  not taking part in social life oneself.
examples:
- Teachers socialise the children for life outside school.
- The programme socialises young people for work with others.
