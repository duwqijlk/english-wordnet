simpleMeaning: A person from a people of western Africa who have long moved with their cattle and keep
  the Muslim faith.
scope: 'Also called Fula, Fulah, Fulani, and Fulbe: a member of a moving cattle-herding people of western
  Africa who keep the Muslim faith, not the language of the same people.'
examples:
- A Fellata herds cattle in western Africa.
- The Fellata people move from place to place with their herds.
