simpleMeaning: A tame ox of India and east Asia, with a hump on its back, long horns, and a large fold
  of skin under its neck, mostly used to pull loads.
scope: A tame ox of India and east Asia, known by its hump, long horns, and the fold of skin under its
  neck.
examples:
- The zebu pulled the cart along the road.
- A zebu stood with its hump showing above its back.
