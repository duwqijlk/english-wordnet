simpleMeaning: a tool that uses sound too high to hear to find hidden cracks, holes, tiny pores, and other
  faults inside metal, plastics, ceramics, and mixed materials
scope: Not a tool that cuts metal or a camera; it finds hidden faults inside solid stuff with sound too
  high to hear.
examples:
- The engineer ran the ultrasonic flaw detector over the weld.
- An ultrasonic flaw detector found a crack deep inside the metal plate.
