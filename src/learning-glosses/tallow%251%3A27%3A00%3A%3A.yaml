simpleMeaning: hard fat got from suet (hard fat from cows or sheep), used to make soap and candles and
  to make parts move easily
scope: Hard fat made ready from suet for soap, candles, and helping parts move easily, not suet in its
  raw form and not a liquid oil for machines.
examples:
- In the past, people made candles from tallow.
- The soap was made with tallow from cow fat.
