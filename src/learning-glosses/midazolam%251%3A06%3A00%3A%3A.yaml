simpleMeaning: Given by needle, this benzodiazepine, a drug that calms the nerves, eases pain and brings
  on a calm, drowsy state during an uncomfortable medical procedure.
scope: During uncomfortable medical procedures, it calms a person and eases pain.
examples:
- Midazolam was given by needle before the procedure.
- The midazolam eased the pain during the procedure.
