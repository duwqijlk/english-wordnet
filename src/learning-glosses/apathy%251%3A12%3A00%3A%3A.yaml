simpleMeaning: a state in which a person has no feelings about things and no eager interest in them
scope: A state with no strong feeling and no strong interest, not a lasting way of being in which a person
  generally cares little about things.
examples:
- After the bad news, apathy left her unable to feel happy or sad.
- He sat in apathy, with no wish to speak or move.
