simpleMeaning: Over some letters, such as c, sits this little sign, shaped like a V turned upside down,
  telling the reader how to say them.
scope: Also called a wedge, this little sign sits over some letters, such as c, and shows how to say them.
examples:
- The hacek over the c in the word shows how it is said.
- She put a hacek above the s to mark its sound.
