simpleMeaning: Signs of sickness grow less strong, and sickness itself is fought or kept away, with the
  help of this thing in medicine
scope: 'Also called medicament, medication or medicine: something that treats, prevents or eases the signs
  of sickness, not a drug taken for fun and not a cure that works at once.'
examples:
- The medicinal drug lowered her blood pressure within a week.
- He asked the chemist for a medicinal drug to stop the pain.
