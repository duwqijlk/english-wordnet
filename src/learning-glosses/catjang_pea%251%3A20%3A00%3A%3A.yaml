simpleMeaning: Grown a great deal where the weather is hot, this woody herb of warm lands bears striking
  yellow flowers and flat pods.
scope: Also called dhal, cajan pea, dahl, pigeon-pea plant, pigeon pea and red gram, this woody herb of
  warm lands bears striking yellow flowers and flat pods, not a plant of cool lands.
examples:
- The catjang pea grows in warm lands with bright yellow flowers.
- The catjang pea is grown a great deal in the tropics.
