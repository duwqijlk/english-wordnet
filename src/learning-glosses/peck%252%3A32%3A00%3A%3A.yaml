simpleMeaning: to keep bothering someone by complaining again and again about small, unimportant things
scope: This means nagging someone with small complaints; it is not a measure of amount, and it is not
  hitting lightly in a picking motion.
examples:
- She pecked at her husband all day about his untidy shoes.
- The children kept pecking at their mother with small complaints about dinner.
