senseId: covetous%5:00:00:desirous:00
synsetId: 00892058-s
simpleMeaning: wanting very strongly, in a way that hurts, to have the good things another person has
scope: 'Also called jealous and envious: wanting, in a painful way, the good things someone else has.
  It is not the sense about wanting more and more wealth for yourself.'
examples:
- He was covetous of his brother's success and could not be happy for him.
- She cast covetous eyes on her friend's fine house and car.
