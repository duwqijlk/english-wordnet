simpleMeaning: a band of flesh that draws the arm close to the body and turns it outward
scope: 'Another name for teres minor and musculus teres minor: a band of flesh that turns the arm out,
  not the teres major muscle, which turns it in.'
examples:
- The teres minor muscle helps turn the arm outward when you throw a ball.
- He hurt his teres minor muscle while throwing the ball.
