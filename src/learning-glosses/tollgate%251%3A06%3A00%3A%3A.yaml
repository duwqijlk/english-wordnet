simpleMeaning: a bar or gate set across a road or bridge where a fee is paid to pass, lifted when the
  fee is paid
scope: A bar or gate across a road or bridge where a fee is paid to pass, lifted when the fee is paid;
  also called tollbar. Not a gate on a free road and not a gate that never opens.
examples:
- Cars queued at the tollgate on the bridge.
- The tollgate rose after the driver handed over the fee.
