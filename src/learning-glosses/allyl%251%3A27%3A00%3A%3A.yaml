simpleMeaning: A bit of carbon-based stuff, made of three carbon atoms and five hydrogen atoms, with one
  free link and room to take on more, that comes from propylene.
scope: 'Also called allyl group and allyl radical: a bit of carbon-based stuff made of three carbon atoms
  and five hydrogen atoms, with one free link, that comes from propylene, not the whole propylene itself.'
examples:
- The allyl joined to the chain through its one free link.
- Propylene gives the allyl its three carbons and five hydrogens.
