simpleMeaning: A nut with a wrinkled seed in two parts and a hard but quite thin shell, much used in cooking.
scope: A nut with a wrinkled two-part seed and a hard but quite thin shell, much used in cooking; not
  the walnut tree itself, which is the same word in another sense.
examples:
- She cracked an English walnut and added it to the cake.
- English walnut has a thin shell and a wrinkled seed inside.
