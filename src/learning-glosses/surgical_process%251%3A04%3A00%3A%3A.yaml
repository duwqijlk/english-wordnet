simpleMeaning: A medical job in which a doctor cuts into a living body with tools, to fix damage or to
  stop a disease.
scope: A medical job in which a doctor cuts into a living body with tools; also called operation, surgery,
  surgical operation and surgical procedure; not a medical test and not a treatment with drugs alone.
examples:
- They will schedule the surgical process as soon as a room is free.
- He died while undergoing a surgical process.
