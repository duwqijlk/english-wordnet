simpleMeaning: Insects are the food of this lizard of the west of North America, a creature with sharp
  points on its head and prickly scales over its body.
scope: Also called a horned lizard and a horned toad, this insect-eating lizard of the west of North America
  has sharp points on its head and prickly scales over its body.
examples:
- A horny frog snapped up an ant that walked too close.
- A horny frog in the west of North America showed its sharp points and prickly scales.
