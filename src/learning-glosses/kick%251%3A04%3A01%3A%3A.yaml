simpleMeaning: The steady pushing of the legs that propels a swimmer through the water or drives an exercise
  routine.
scope: A repeated leg action for swimming or exercise, not a single blow with the foot, and not a complaint.
examples:
- Her steady kick kept her moving smoothly through the water.
- The coach told the swimmers to work on their kick.
