simpleMeaning: to act as a delegate or spokesperson for people or their interests, speaking and acting
  on their behalf, as an elected official does for voters.
scope: This is acting as a delegate or spokesperson for people or their interests, not standing for something
  as a symbol, being typical of it, or defending someone as their lawyer in court.
examples:
- Each elected member represents the interests of the people who voted for them.
- She was chosen to represent her neighbours in the housing dispute.
