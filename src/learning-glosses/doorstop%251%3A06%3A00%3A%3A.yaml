simpleMeaning: a thing used to hold a door open so that it does not move
scope: A thing used to hold a door open. It is not a lock, and it is not a thing that stops a door from
  opening.
examples:
- He put a heavy doorstop in front of the open door.
- The doorstop kept the door from swinging shut.
