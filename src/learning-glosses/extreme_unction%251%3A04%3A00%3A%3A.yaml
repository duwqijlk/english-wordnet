simpleMeaning: A priest puts oil on a dying person and prays that God will save them, in a holy act of
  the Catholic Church.
scope: Also called anointing of the sick and last rites, this holy act of the Catholic Church is given
  by a priest who puts oil on a dying person and prays that God will save them.
examples:
- The priest gave the dying man extreme unction.
- She asked for extreme unction for her father before he died.
