senseId: 'plant_toxin%1:27:00::'
synsetId: 15061205-n
simpleMeaning: Any stuff made by green growing things that acts much like the poison made by germs outside
  their cells.
scope: Any stuff made by green growing things that acts much like the poison made by germs outside their
  cells; phytotoxin is another name for this sense, not a poison made by an animal and not a poison made
  by germs.
examples:
- The plant toxin in the seeds can sicken cattle.
- That plant toxin acts like the poison of some germs.
