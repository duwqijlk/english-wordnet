simpleMeaning: used especially of looks, turned to one side as if with doubt, distrust, or envy
scope: 'Also called squint, sidelong, and squinty: a look turned to one side with doubt or envy, not a
  straight look at something.'
examples:
- She cast an askance look at him from the side, as if she doubted him.
- With an askance look to one side, he watched his rival win the prize.
