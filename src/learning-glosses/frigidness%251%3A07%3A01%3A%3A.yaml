simpleMeaning: a lack of sexual response during sex, with no orgasm, found especially in women
scope: This is a lack of sexual response with no orgasm during sex; frigidity is another name for it,
  not a lack of love or a choice to avoid sex.
examples:
- Her frigidness made intimacy hard for the couple.
- Doctors once treated frigidness as a medical problem.
