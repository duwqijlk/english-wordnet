simpleMeaning: a short, sharp sickness that can pass from person to person, usually in children, with
  fever and a red rash
scope: Also called scarlet fever, this is a short sickness that spreads between people; not measles and
  not a rash from heat.
examples:
- The child stayed in bed with scarlatina and a red rash.
- Scarlatina spread through the school, so several children stayed home.
