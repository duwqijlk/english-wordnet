simpleMeaning: about the belief that people cannot know if God is real, or about a person who holds that
  belief
scope: About not knowing if God is real, not about believing that God is not real and not about having
  no interest in religion.
examples:
- He holds agnostic views and says we cannot know if God is real.
- Her agnostic way of thinking leaves the question of God open.
