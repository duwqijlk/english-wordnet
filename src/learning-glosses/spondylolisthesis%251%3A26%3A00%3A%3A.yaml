simpleMeaning: a slip of one back bone forward over the one below it, pressing on the nerves of the spine
scope: A slip of one back bone forward over the one below it, pressing on the nerves of the spine; not
  a slipped disc and not a break in a back bone.
examples:
- Her back pain came from spondylolisthesis.
- Spondylolisthesis pressed on the nerves in his lower back.
