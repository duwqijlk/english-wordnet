simpleMeaning: In printing, to tap a pile of paper so that all its edges line up straight
scope: In printing, to make the edges of a stack of paper even, not the running sense.
examples:
- The printer jogged the stack of paper before putting it in the machine.
- She jogged the pages until their edges were neat and even.
