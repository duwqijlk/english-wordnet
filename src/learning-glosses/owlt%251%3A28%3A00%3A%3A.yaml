simpleMeaning: The time light, or radio waves, take to travel from the Earth to a body in the sky.
scope: Also called one-way light time, this is the time light, or radio waves, take to travel from the
  Earth to a body in the sky; it is a time, not a distance.
examples:
- They measured the OWLT from the Earth to the probe.
- The OWLT tells how long light takes to reach us.
