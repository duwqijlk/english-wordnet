simpleMeaning: 'In chemical analysis, a counterweight: an empty holder that balances the weight of the
  holder that holds the chemicals.'
scope: In chemical analysis, this is an empty holder that balances the weight of a holder of chemicals,
  not a weedy grass or vetch, the weight of a vehicle without fuel or cargo, or an adjustment for the
  weight of packaging.
examples:
- The chemist put a tare on the scales before weighing the powder.
- She used an empty tare to balance the jar.
