simpleMeaning: A shaped cover made to fit over the sloping top edge where two sides of a roof meet.
scope: A shaped cover for the sloping top edge of a roof, not a flat tile and not a ridge cap; also called
  a hipped tile.
examples:
- The roofer replaced a broken hip tile.
- Each hip tile covers the sloping edge of the roof.
