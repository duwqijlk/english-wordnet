simpleMeaning: A rough, long-lived Eurasian grass that looks like oat; it grows along roadsides, in rough
  grassland and in hay meadows, and was brought to North America for animal feed.
scope: Another name for the same rough Eurasian grass also called evergreen grass, tall meadow grass and
  tall oat grass; it is a wild grass, not the cultivated oat grown for grain.
examples:
- False oat had spread across the rough ground beside the lane.
- The hay meadow was thick with false oat by early summer.
