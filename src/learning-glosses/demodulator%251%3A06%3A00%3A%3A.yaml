simpleMeaning: A rectifier, a part that lets current flow one way only, used to pull the carried signal
  out of a radio wave
scope: A radio part that pulls the carried signal out of the wave, also called detector; not the transmitter
  that sends the wave and not the aerial that picks it up.
examples:
- The demodulator pulled the voice signal from the radio wave.
- A faulty demodulator left only static.
