simpleMeaning: A tall, coarse tropical weed that grows in one season, has foul-smelling leaves, big white
  or violet trumpet-shaped flowers and spiky fruit, and is highly poisonous.
scope: This is the whole tall poisonous weed, not other nightshades such as henbane or deadly nightshade.
examples:
- Jimson weed was growing in the corner of the field.
- The seeds of jimson weed are especially dangerous.
