senseId: 'stucco%2:35:00::'
synsetId: 01263935-v
simpleMeaning: to cover a wall, ceiling or other surface with a soft mix made mostly from Portland cement,
  sand and lime, which later becomes hard
scope: This is covering a surface with the material itself. It is not putting patterns or shapes on a
  surface to make it look nicer, and not the material as a thing on its own.
examples:
- Workers stuccoed the outside walls of the house.
- He stuccoed the ceiling to cover the old, rough surface.
