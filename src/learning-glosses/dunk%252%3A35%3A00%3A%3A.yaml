simpleMeaning: to push a thing down into a liquid and lift it out again at once, so it comes out wet,
  with a coat on it, or soaked right through
scope: 'Also called plunge, dip, or douse: a quick dip into liquid that wets, coats, or soaks, not a basketball
  shot down into the basket.'
examples:
- She dunked the biscuit in her tea and ate it before it fell apart.
- He dunked the brush in the paint and wiped off the extra drops.
