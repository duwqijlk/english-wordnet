simpleMeaning: an acronym for very bright, millisecond-long bursts of light and radio-wave disturbance
  that form a ring up to 400 km wide in the ionosphere after an electromagnetic pulse
scope: This is the atmospheric light phenomenon, not the plural of elf (the folk-tale being) or any other
  use of the spelling.
examples:
- Cameras on the mountain recorded elves forming a wide ring high above the thunderstorm.
- The flashes known as elves last less than a millisecond, too brief for the unaided eye to see.
