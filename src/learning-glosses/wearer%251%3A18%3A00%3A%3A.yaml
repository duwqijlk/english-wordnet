simpleMeaning: 'Someone who has a thing on the body, carries such a thing, or shows it: the thing may
  cover part of the body or be a small extra item'
scope: This is the person, not the clothing or the extra item itself that the person has on.
examples:
- The wearer of the hat looked warm.
- Only the wearer knows if the shoes feel tight.
