simpleMeaning: a tool used to put a person to death as a punishment by squeezing the neck tightly so the
  person cannot breathe
scope: Also called garrotte, this is a tool used to put a person to death as a punishment by squeezing
  the neck; it is not the act of killing itself, but the tool used for it.
examples:
- The museum displayed an old garrote once used for executions.
- The garrote was kept in the prison where such punishments were carried out.
