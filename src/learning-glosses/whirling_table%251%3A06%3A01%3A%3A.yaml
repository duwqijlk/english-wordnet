simpleMeaning: To show the laws of nature at work, a piece of equipment is fitted with one or more spinning
  plates, weights, ropes over wheels, and other parts.
scope: This piece of equipment with spinning plates, weights and pulleys shows the laws of nature at work.
examples:
- The whirling table spun its disks to show a law of nature.
- A whirling table shows a law of nature with its spinning plates.
