simpleMeaning: Tools that run on power let a doctor cut and seal tissue during an operation; one such
  tool burns a cut shut with heat
scope: An operation in which tools that run on power cut and seal tissue, not an operation done by hand
  and not a test that uses power.
examples:
- The doctor used electrosurgery to remove the small growth.
- Electrosurgery let the surgeon seal the cut without a stitch.
