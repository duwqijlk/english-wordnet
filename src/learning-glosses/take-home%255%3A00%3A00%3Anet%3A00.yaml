simpleMeaning: of pay, the money that is left after tax and all other sums come out
scope: This is the money left from pay after tax and all other sums come out, not the full pay before
  anything is removed and not a gift or bonus.
examples:
- Her take-home pay is less than the sum on her contract.
- After tax, his take-home wages come to two thousand a month.
