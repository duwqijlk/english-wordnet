simpleMeaning: rays, waves, or tiny bits of matter that carry energy away from a source
scope: Energy that moves out as rays, waves, or tiny bits, not the stream of bits given off when atoms
  break apart, not the nerve fibres in the brain, and not the treatment of disease with such energy.
examples:
- Radiation from the sun warms the earth.
- The lab measured the radiation in the room after the test.
