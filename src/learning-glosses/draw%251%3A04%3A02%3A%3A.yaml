simpleMeaning: In American football, the quarterback steps back as though he will throw the ball, then
  hands it to the fullback, who runs toward the line of scrimmage.
scope: A specific American football play; not the poker game where players swap cards, and not the golf
  stroke that curves to the left.
examples:
- The coach called a draw on third down and the fullback burst through the middle.
- Their draw fooled the linebackers, who had expected a pass.
