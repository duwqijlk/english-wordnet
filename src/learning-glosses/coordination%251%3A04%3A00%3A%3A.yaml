simpleMeaning: the work of bringing many different parts together so they run as one smooth whole
scope: Bringing different parts together so they work as one smooth whole, not the grammatical link between
  two words of the same form, and not the skill of moving the body well.
examples:
- Good coordination between the teams kept the project on time.
- The coordination of lights, sound, and actors made the show run well.
