simpleMeaning: the outer covering of hair on an animal, especially on a sheep or a yak
scope: 'Also called wool: the hair covering of a sheep or yak on the live animal, not the soft cloth made
  for clothes and not the skin with the hair left on.'
examples:
- The sheep's thick fleece kept it warm in winter.
- He cut the fleece from the yak in spring.
