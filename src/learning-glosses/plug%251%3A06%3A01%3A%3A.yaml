simpleMeaning: a post that stands up and gives water to use in fighting a fire
scope: A water post used to fight fires; it is not the thing that fills a hole, and not the part with
  pins that goes into a wall socket.
examples:
- The firefighters joined their hose to the plug at the street corner.
- She opened the plug so water could fill the truck.
