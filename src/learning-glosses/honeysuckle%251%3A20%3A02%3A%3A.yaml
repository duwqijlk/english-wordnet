simpleMeaning: a columbine (a plant whose flowers have long thin parts at the back) from the east of North
  America, with red flowers that have long thin parts
scope: This is the red-flowered columbine plant from the east of North America; not the bush or climbing
  plant in the Lonicera group, and not the shrubby tree with yellow flowers.
examples:
- The honeysuckle in the woods had long red flowers.
- She picked a red honeysuckle flower with a long thin part at its back.
