simpleMeaning: a long, thin mammal that lives in and near water, has partly webbed feet, and is valued
  for its fur
scope: The living animal that lives in and near water, not a coat made from its fur.
examples:
- A mink slipped into the stream to hunt.
- The mink used its partly webbed feet to swim.
