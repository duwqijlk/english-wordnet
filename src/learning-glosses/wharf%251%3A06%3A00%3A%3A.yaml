simpleMeaning: a flat place built out from the shore into the water and held up by posts, where people
  can get to ships and boats
scope: 'Also called dock and pier: a place by the water for reaching ships and boats, not the act of tying
  a ship up or putting goods down there.'
examples:
- The boat stopped at the wharf so people could get on.
- Crates were stacked on the wharf next to the ship.
