senseId: 'stooge%2:29:00::'
synsetId: 00013851-v
simpleMeaning: to act in a way that shows you will do what another person wants, taking a lower place
  than them
scope: This sense is doing what a stronger person wants in a lower role, not a person who is made fun
  of and not flying slowly in a set pattern.
examples:
- He stooged for the boss, carrying out every small order without question.
- She refused to stooge for the manager and to speak only when he told her to.
