simpleMeaning: a blood vessel that starts at the main trunk in the belly and carries blood to the spleen
scope: A blood vessel that carries blood to the spleen from the main trunk in the belly; arteria lienalis
  and lienal artery are other names for this sense, not a vein and not a vessel that feeds the liver.
examples:
- The splenic artery runs from the belly trunk to the spleen.
- The surgeon tied off the splenic artery.
