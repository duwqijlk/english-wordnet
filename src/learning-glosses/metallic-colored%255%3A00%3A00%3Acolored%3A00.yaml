simpleMeaning: With the shine and colour of iron, steel, or a like hard substance
scope: It is a colour with the shine of a hard substance such as iron or steel, also called metal-colored,
  metal-coloured and metallic-coloured; plain dull grey and a bright colour with no shine are different.
examples:
- The metallic-colored paint gleamed in the light.
- She picked a metallic-colored dress for the party.
