simpleMeaning: An account sum in which what is taken out is more than what is put in, so the customer
  owes the bank money.
scope: An account sum where what is taken out is more than what is put in, so the customer owes the bank
  money; negative balance is another name for it, not a loan and not a fee.
examples:
- A debit balance means the customer owes the bank money.
- His account showed a debit balance after the payment.
