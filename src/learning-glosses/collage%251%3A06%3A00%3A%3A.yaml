simpleMeaning: a picture made by sticking pieces of paper or photos together to make a work of art
scope: 'Also called montage: a picture made by sticking paper or photos together, not one single photo
  and not a picture made only with paint.'
examples:
- She made a collage from old photos and bits of colored paper.
- His collage shows a city made from cut-out pictures.
