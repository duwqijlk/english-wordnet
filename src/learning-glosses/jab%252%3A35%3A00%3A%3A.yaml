simpleMeaning: To thrust forward with one sudden sharp move
scope: 'Also called poke, dig, stab and prod: to thrust forward in one sudden sharp move, not a punch
  with short quick blows and not the noun sense of a sudden touch.'
examples:
- He jabbed his elbow into my side to wake me up.
- She jabbed the stick into the soft ground to test it.
