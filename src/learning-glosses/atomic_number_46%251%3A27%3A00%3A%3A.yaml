simpleMeaning: A silver-white metal of the platinum group like platinum, found in some copper and nickel
  ores; it keeps its shine at normal heat and is used with gold in jewels.
scope: Also called palladium and Pd; a silver-white metal of the platinum group that keeps its shine at
  normal heat.
examples:
- Atomic number 46 is the place of palladium in the list of elements.
- Palladium has atomic number 46.
