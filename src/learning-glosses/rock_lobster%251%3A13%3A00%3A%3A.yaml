simpleMeaning: The frozen tails usually sold from Australia and South Africa come from warm-water lobsters
  with no claws, caught also in Florida and California.
scope: 'Also called crayfish, langouste, and spiny lobster: a warm-water lobster with no claws, not a
  true lobster with large claws.'
examples:
- Rock lobsters have no claws, unlike true lobsters.
- Frozen rock lobster tails come from Australia and South Africa.
