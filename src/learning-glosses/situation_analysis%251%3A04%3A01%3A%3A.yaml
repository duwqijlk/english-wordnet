simpleMeaning: A study of an organization's past and present economic, political, social and technological
  data to weigh outside forces and its current or future strengths, weaknesses and opportunities before
  planning strategy.
scope: A broad review of conditions facing an organization before it chooses a strategy; not a routine
  report on one project, and not a sales forecast.
examples:
- The board ordered a situation analysis before entering the new market.
- The situation analysis weighed political and technological trends against the company's weaknesses.
