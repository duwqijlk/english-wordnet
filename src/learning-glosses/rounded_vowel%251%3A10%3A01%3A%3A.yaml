simpleMeaning: In linguistics, the lips are pushed close until only a small hole shaped like a ring is
  left to make this speech sound.
scope: In linguistics, it is one of the speech sounds shaped by the lips.
examples:
- A rounded vowel can change the sound that comes next to it.
- Say the rounded vowel with your lips pushed close together.
