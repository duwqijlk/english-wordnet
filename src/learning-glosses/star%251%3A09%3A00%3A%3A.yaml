simpleMeaning: the way a network is laid out when every part links to one central point
scope: This is not a famous performer or a glowing object in the sky; it is the arrangement of a network.
examples:
- In a star network, every computer connects to one central server.
- The office uses a star layout, with all machines linked to a single hub.
