simpleMeaning: The third of the four groups of Hindu society, made up of ordinary people, small farmers,
  traders and those with learned jobs.
scope: The third of the four groups of Hindu society, made up of ordinary people, small farmers, traders
  and those with learned jobs, not the priest group and not the warrior group.
examples:
- A vaisya belonged to the third group of Hindu society.
- The vaisya worked as a farmer or a trader.
