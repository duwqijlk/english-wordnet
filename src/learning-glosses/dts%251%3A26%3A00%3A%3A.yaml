simpleMeaning: A sudden wild confusion of the mind caused by drinking too much alcohol.
scope: Also called delirium tremens; the wild confusion that follows alcohol poisoning, a short sharp
  attack rather than a lasting illness of the mind.
examples:
- After days of heavy drinking he suffered DTs.
- The doctor said the DTs came from alcohol poisoning.
