simpleMeaning: A sharp-smelling liquid with no colour, a chemical made from propene that can still take
  in more.
scope: Also called propenal, this liquid is made from propene and is known by its sharp smell and lack
  of colour.
examples:
- A drop of acrolein on the bench gave off a sharp smell.
- The chemist wore gloves while pouring acrolein, and the sharp smell filled the room.
