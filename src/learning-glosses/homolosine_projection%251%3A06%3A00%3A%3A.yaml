simpleMeaning: The seas on this flat map of the whole world are bent out of shape so that each land keeps
  its true size.
scope: It is a flat map of the whole world in which each land keeps its true size, unlike a map that keeps
  the seas true to shape.
examples:
- The homolosine projection shows each land at its true size.
- On a homolosine projection, the seas look bent out of shape.
