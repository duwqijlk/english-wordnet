simpleMeaning: Of plants or animals, likely to be in danger of dying out in the near future
scope: Of plants or animals likely to die out soon, not already dying out and not safe from harm.
examples:
- The spotted owl is a threatened species, not yet an endangered one.
- The threatened fish may soon be gone from these rivers.
