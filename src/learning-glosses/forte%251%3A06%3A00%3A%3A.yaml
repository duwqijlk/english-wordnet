simpleMeaning: the stronger part of a sword blade, between the handle and the weaker part near the tip
scope: This is the strong part of a sword blade, not a loud piece of music and not the direction to play
  music loudly.
examples:
- The forte of his sword did not bend when the two blades hit.
- A small mark on the forte, just above the handle, showed where the sword was made.
