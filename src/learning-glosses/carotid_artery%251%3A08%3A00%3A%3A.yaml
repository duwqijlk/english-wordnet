simpleMeaning: one of the two large blood tubes in the neck and head, coming off the aorta, the main blood
  tube from the heart
scope: Also called arteria carotis, one of the two large blood tubes in the neck that carry blood to the
  head, not a vein and not a blood tube in the arm or leg.
examples:
- The surgeon clamped the carotid artery to stop the flow of blood.
- A block in the carotid artery can cut blood flow to the brain.
