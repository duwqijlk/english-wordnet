simpleMeaning: the part of physics that studies how electrons are given off and what they do, and how
  devices that use them work
scope: The study of electrons and the devices that use them, not the devices themselves and not physics
  in general.
examples:
- She studied electronics at college.
- Electronics covers how radios and computers work.
