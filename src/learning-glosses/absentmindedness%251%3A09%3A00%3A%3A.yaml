simpleMeaning: being so deep in thought that you do not notice the everyday things that need your attention
scope: This is being so lost in thought that you miss what is around you, not a bad memory and not being
  asleep.
examples:
- Her absentmindedness made her forget the pot on the stove.
- His absentmindedness showed when he walked past his own house.
