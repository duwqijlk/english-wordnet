simpleMeaning: An old kind of gun lock with a piece of flint set in the hammer, which strikes a spark
  that sets off the charge.
scope: The old gun lock with flint in the hammer, not the whole gun that has such a lock.
examples:
- The flintlock sparked but the gun did not fire.
- Muskets of that time were fitted with a flintlock.
