simpleMeaning: A bad blood infection a woman gets while giving birth or ending a pregnancy, most often
  from dirty conditions, once common but now rare.
scope: 'Also called puerperal fever: a bad blood infection got at childbirth, not a mild fever after birth
  and not an infection from a wound.'
examples:
- Childbed fever once killed many new mothers.
- She caught childbed fever after giving birth in dirty rooms.
