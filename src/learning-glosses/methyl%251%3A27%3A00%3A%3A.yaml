simpleMeaning: A part of a molecule, CH3-, with one free link, that comes from methane.
scope: A part of a molecule, CH3-, with one free link, that comes from methane, also called a methyl group
  or a methyl radical; not the whole methane molecule and not a part with two free links.
examples:
- The methyl part has one free link.
- Methyl is the CH3- part that comes from methane.
