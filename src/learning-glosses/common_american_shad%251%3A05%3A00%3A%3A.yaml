simpleMeaning: A fish of the Atlantic coast of North America that now also lives on the Pacific coast.
scope: Also called Alosa sapidissima, it is a fish that lived on the Atlantic coast of North America before
  it also came to live on the Pacific coast, not a fish that first lived on the Pacific coast.
examples:
- The common American shad swam up the river to spawn.
- Fishermen caught common American shad off the Atlantic coast.
