simpleMeaning: The study of the outside of the earth and how people respond to its land shape, climate,
  soil and plants
scope: This is the study of the outside of the earth and how people respond to its land shape, climate,
  soil and plants; geography is another name for this sense, not the study of rocks alone and not map-making.
examples:
- He studied geographics at the university.
- Geographics covers both the land and the people who live on it.
