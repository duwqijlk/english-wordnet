senseId: 'humdrum%1:07:00::'
synsetId: 04747566-n
simpleMeaning: A tiring sameness in life, where the same dull round goes on with no change
scope: 'Other names for this sense are sameness and monotony: the tiring sameness of a life with no change,
  not the adjective sense of being dull and unexciting, and not the adjective sense of going on the same
  dull way.'
examples:
- The humdrum of office life wore him down.
- She hated the humdrum of the same meals every day.
