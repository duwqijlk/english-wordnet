synsetId: 05922132-n
simpleMeaning: An accepted general truth that can be used as a starting point for thinking or acting.
scope: An accepted general truth only; not a behavior principle, a normative example, a conduct guide,
  a language convention, a math method, a natural law, a game's directions, a religious order's regulations,
  a reign, legal authority, a measuring stick, or any verb use (holding power, deciding, prevailing, declaring,
  matching zodiac signs, drawing lines, keeping in check, excelling).
examples:
- He reasoned from the rule that every effect has a cause.
- The rule that supply creates demand shaped their whole model.
