simpleMeaning: to keep picking on a person with words that find fault again and again
scope: To keep finding fault with a person in words, also called ride, rag, tease, cod, bait and taunt;
  not getting better in an illness, not a large meeting, and not a run of hits in sport.
examples:
- The older boys rallied him about his old shoes all week.
- Do not rally her for one small mistake; she has heard enough.
