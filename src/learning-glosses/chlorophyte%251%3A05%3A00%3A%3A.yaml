scope: A clear green growth, often growing on wet ricks or damp wood or on the top of still water; green
  algae is another name for this sense, not the green colouring stuff and not the small part in a plant
  cell.
examples:
- A chlorophyte coats the damp wood green.
- Chlorophytes grow on the surface of stagnant water.
