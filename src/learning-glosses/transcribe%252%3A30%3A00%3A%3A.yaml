simpleMeaning: to make a strand of RNA, especially messenger RNA, from the life information in a strand
  of DNA; DNA and RNA hold or carry life information in a cell
scope: This is the cell making RNA from DNA; it is not arranging a piece of music for a different instrument,
  and not writing down the sounds of speech.
examples:
- The cell transcribes the gene to make messenger RNA.
- This protein transcribes DNA into RNA inside the cell.
