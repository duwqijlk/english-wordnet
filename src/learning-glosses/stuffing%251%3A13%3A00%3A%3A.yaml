simpleMeaning: foods mixed with salt and herbs and used to fill meat or vegetables
scope: A seasoned mix pushed into meat or vegetables, also called dressing, not the soft padding put inside
  mattresses.
examples:
- She spooned the stuffing into the chicken before roasting it.
- The stuffing of bread and herbs filled the turkey.
