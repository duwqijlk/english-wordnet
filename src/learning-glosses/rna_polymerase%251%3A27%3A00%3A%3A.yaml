simpleMeaning: A cell enzyme that reads DNA and makes a copy of its message in a new form.
scope: This cell enzyme reads DNA and makes a new-form copy of it, also called transcriptase, and not
  the enzyme that copies DNA into more DNA.
examples:
- RNA polymerase copies DNA into RNA.
- Without RNA polymerase, cells could not read their DNA.
