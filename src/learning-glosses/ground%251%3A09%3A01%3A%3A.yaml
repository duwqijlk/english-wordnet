simpleMeaning: the fairly uniform area you perceive lying behind the main object your attention is fixed
  on
scope: This is about how the eye and mind separate a background from a focused object, not about soil
  or land, not a reason for doing something, and not the first coat of paint on a surface.
examples:
- In the portrait, the soft gray ground makes the sitter's face stand out.
- The photographer kept the ground plain so nothing would pull attention from the subject.
