simpleMeaning: fish with large mouths and a thin, worm-like part joined to the body that draws in animals
  for it to eat
scope: 'Also called angler, monkfish, allmouth, angler fish, goosefish and lotte: a sea fish that draws
  in other fish with a thin part over its big mouth; here angler is the fish, not a person who fishes.'
examples:
- An anglerfish waits in the dark sea with its thin lure held over its mouth.
- The anglerfish opened its huge mouth and took in the small fish at once.
