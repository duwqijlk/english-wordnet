simpleMeaning: A feature of a thing that gives joy and pulls others toward it
scope: Also called attraction; a feature of a thing that gives joy and pulls others toward it, not the
  iron-pulling device of physics.
examples:
- Flowers are a magnet for bees in the garden.
- The bright lights were a magnet for the crowds.
