simpleMeaning: Feeling deep sorrow, or full of grief and sadness.
scope: Full of deep sorrow; not a passing sadness, and not something that brings sorrow.
examples:
- She gave him a woeful look when he told her the news.
- His woeful face showed how much he grieved.
