simpleMeaning: a game played on an open field, like the game played on ice, where two teams use curved
  sticks to hit a ball into the other team's goal
scope: This is the game played on an open field with a ball and curved sticks, not the game played on
  ice with a flat round puck.
examples:
- She plays hockey on the grass field at school every Saturday.
- In hockey, the players hit the ball with curved sticks toward the goal.
