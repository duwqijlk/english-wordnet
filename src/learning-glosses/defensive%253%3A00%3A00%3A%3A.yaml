simpleMeaning: meant for, or right for, guarding against an attack, or stopping an attack before it starts
scope: For things made or used to guard against attack; not for speech or writing that tries to show an
  action was right, and not for a person's guarded way of acting.
examples:
- The town built a defensive wall around it to stop attackers.
- They took a defensive position near the bridge and waited.
