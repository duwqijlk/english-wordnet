simpleMeaning: words spoken to say that someone did wrong, because of a mistake or a bad act
scope: The sharp words said to a person who did wrong, not a statement that a named person is the one
  who caused a wrong act.
examples:
- His words of blame were hard to hear after the small mistake.
- No amount of blame will fix what he did wrong.
