simpleMeaning: A loop in which atoms of more than one kind are joined, most of all a loop of carbon atoms
  with at least one atom that is not carbon
scope: This is a loop in which atoms of more than one kind are joined, most of all a loop of carbon atoms
  with at least one atom that is not carbon, also called heterocycle, and not a loop of atoms all of one
  kind.
examples:
- The heterocyclic ring holds one atom that is not carbon.
- That heterocyclic ring has six atoms in all.
