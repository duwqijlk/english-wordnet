synsetId: 92463541-n
simpleMeaning: an extra leaf at the front of a book giving the name of the set of books it belongs to,
  and often, though not always, more facts about that set
scope: An extra leaf naming the set of books a book belongs to, not the book's own title leaf and not
  the cover.
examples:
- The series title page gave the name of the whole set.
- She found the series title page on the back of the half-title leaf.
