simpleMeaning: full and complete, with nothing left out and nothing held back; in everyday talk it can
  also just add force to a word
scope: 'Also called absolute, rank, or sheer: a thing that is whole and total, not a plain and blunt honest
  answer.'
examples:
- That was a downright lie — he had not left the house all day.
- Her downright refusal surprised everyone at the meeting.
