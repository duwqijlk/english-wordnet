simpleMeaning: A built thing from which water shoots up in a thin, hard stream made by a machine
scope: A built thing that shoots up water made by a machine, not a natural spring and not a drinking tap.
examples:
- The fountain in the square shoots water high into the air.
- Children played round the fountain on a hot day.
