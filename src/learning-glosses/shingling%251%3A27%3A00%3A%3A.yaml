simpleMeaning: In geology, a bed of loose material in which flat stones all lean the same way
scope: In geology, flat stones in loose material that all lean the same way; not a roof of wood tiles
  and not loose stones that lie flat.
examples:
- The shingling on the river bank showed the stones all tilted one way.
- Geologists read the shingling to learn how the water once flowed.
