simpleMeaning: High in the air, about 20 miles up, a thin band holds enough ozone to stop most of the
  sun's unseen rays from getting through.
scope: It is also called the ozone layer, and it is the thin band, about 20 miles up, that holds enough
  ozone to stop most of the sun's unseen rays.
examples:
- The ozonosphere sits about 20 miles up.
- Most of the sun's unseen rays are stopped by the ozonosphere.
