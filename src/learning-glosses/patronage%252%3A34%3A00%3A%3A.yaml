simpleMeaning: to give support to a person or place, by giving money or by going there often as a customer
scope: To back a person or place with money or by being a regular customer; not the noun sense about giving
  jobs or contracts for political support, and not talking down to someone.
examples:
- Local people patronage the small shops in their village.
- We should patronage family-run businesses more often.
