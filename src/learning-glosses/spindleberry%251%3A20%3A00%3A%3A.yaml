simpleMeaning: One of many shrubby kinds, a woody vine or shrubby tree of the Euonymus group bears berries
  that catch the eye, usually reddish.
scope: This woody vine or shrubby tree of the Euonymus group is also called spindle tree and spindleberry
  tree.
examples:
- The spindleberry had reddish berries.
- Her spindleberry had berries that caught the eye.
