senseId: 'learned_reaction%1:04:00::'
synsetId: 00866213-n
simpleMeaning: a way of acting when something happens, picked up from past experience
scope: A way of acting when something happens, picked up from past experience, with learned response as
  another name for this sense; not a reflex you are born with, and not a chance act.
examples:
- His learned reaction was to check the door twice before leaving.
- The dog's learned reaction to the bell was to sit and wait.
