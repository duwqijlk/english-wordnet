simpleMeaning: the loose skin of the top lip that hangs down on a bloodhound or a dog like it
scope: The loose skin of the top lip of a bloodhound or a dog like it, not the lower lip and not the loose
  skin of a dog's ears.
examples:
- The bloodhound's flews hung down over its mouth.
- The flews of the old hound were wet with drool.
