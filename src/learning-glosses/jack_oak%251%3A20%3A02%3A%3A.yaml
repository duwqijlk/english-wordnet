simpleMeaning: a common low tree of the central and southeast US with dark bark and wide leaves with three
  round ends, leafless each winter and often growing in dense thickets
scope: 'Also called blackjack and blackjack oak: a low tree of the central and southeast United States
  with dark bark and three-part leaves, not the small to medium oak of east central North America with
  sharply pointed leaf lobes.'
examples:
- The jack oak by the fence had dark bark and wide three-part leaves.
- Jack oaks often grow together in dense thickets along the road.
