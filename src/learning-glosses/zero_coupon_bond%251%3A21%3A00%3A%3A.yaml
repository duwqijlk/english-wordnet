simpleMeaning: Sold far below what it pays back at the end, this loan paper pays its holder no cash in
  between, the most common kind of such paper.
scope: Also called zero-coupon bond, this loan paper pays its holder no cash in between.
examples:
- He put his savings into a zero coupon bond and waited for it to come due.
- A zero coupon bond costs far less now than it will pay back later.
