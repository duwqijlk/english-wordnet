simpleMeaning: showing that you think someone or something is far beneath respect
scope: This shows very strong scorn for someone or something; contemptuous, scornful and insulting are
  other names for this sense, and it is not merely being proud or cold.
examples:
- She gave him a disdainful look and walked away.
- His disdainful tone made the whole room uneasy.
