simpleMeaning: the quality of saying what you really think and feel, and not pretending to be what you
  are not
scope: The quality of being open and truthful, not a warm feeling and not mere politeness.
examples:
- His sincerity inspired belief in everyone who heard him.
- They demanded some proof of my sincerity before they would trust me.
