simpleMeaning: an early spring flower, common in the British Isles, with sweet-smelling yellow flowers,
  sometimes purple
scope: An early spring flower, common in the British Isles, with sweet-smelling yellow flowers, sometimes
  purple; cowslip is another name for this sense, and it is not the primrose with yellow flowers grouped
  on one side of the stalk.
examples:
- The paigle blooms early in spring.
- We saw a yellow paigle in the meadow.
