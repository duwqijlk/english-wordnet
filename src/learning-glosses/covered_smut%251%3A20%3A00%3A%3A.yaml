senseId: 'covered_smut%1:20:00::'
synsetId: 13087208-n
simpleMeaning: Grains fall sick from this fungus, whose spore masses stay shut in or held together by
  the skins of the grain.
scope: A fungus that sickens grains, its spore masses held in by the grain skins, not a smut that leaves
  its spores loose.
examples:
- Covered smut made the wheat grains sick.
- The covered smut kept its spore masses inside the grain skins.
