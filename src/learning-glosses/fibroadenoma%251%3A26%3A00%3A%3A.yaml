simpleMeaning: A harmless breast lump that can be moved, feels firm, and does not hurt to touch, most
  often in young women and caused by high levels of estrogen
scope: A harmless breast lump that can be moved, feels firm, and does not hurt to touch, most often in
  young women; not a cancer lump and not a sore lump.
examples:
- The fibroadenoma moved under her finger.
- Her fibroadenoma was firm but did not hurt.
