simpleMeaning: to splash water so that a small pool of water forms
scope: To make a small pool of water by splashing, not to walk in such a pool and not to turn something
  into one.
examples:
- The boys puddled the garden path by splashing water all over it.
- She puddled the floor when she splashed water out of the bucket.
