simpleMeaning: Large swollen patches under the skin that come back, start suddenly and fade within a day;
  seen mostly in young women, often as an allergic reaction to food or drugs
scope: Also called angioedema, atrophedema, giant hives and periodic edema; sudden swellings under the
  skin, close to other allergic swellings such as hives.
examples:
- Quincke's edema swelled her lips overnight.
- His Quincke's edema faded within a day.
