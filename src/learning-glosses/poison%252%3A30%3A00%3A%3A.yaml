senseId: 'poison%2:30:00::'
synsetId: 00533509-v
simpleMeaning: to put a material that can hurt a living thing, make it ill, or kill it into food, drink,
  or another thing
scope: Putting a harmful material into food, drink, or another thing; not giving the material directly
  to a person or animal, not killing a person or animal with it, and not spoiling a person's thoughts
  or the feeling in a place.
examples:
- He poisoned her drink so that she would drink something harmful.
- Someone had poisoned the water in the well.
