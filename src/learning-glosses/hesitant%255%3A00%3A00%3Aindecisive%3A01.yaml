simpleMeaning: not firm in choosing as part of a person's character, and not able to act or choose quickly
  and firmly
scope: 'Also called hesitating: not able to choose or act quickly and firmly as part of a person''s character,
  not just pausing for a short time before speaking.'
examples:
- He is a hesitant leader who takes a long time to choose.
- She gave a hesitant answer because she could not decide what to do.
