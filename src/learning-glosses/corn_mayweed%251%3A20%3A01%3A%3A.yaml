simpleMeaning: A common European one-year weed with blooms of white and finely cut leaves, now settled
  wild and sometimes farmed in eastern North America, sometimes placed in genus Matricaria.
scope: This sense is also called scentless camomile, scentless false camomile, scentless hayweed, and
  scentless mayweed, for a common European one-year weed with blooms of white and finely cut leaves, now
  settled wild and sometimes farmed in eastern North America and sometimes placed in genus Matricaria,
  unlike the sense for a European white-flowered weed grown wild in North America.
examples:
- Corn mayweed grows along the field edge.
- They pulled the corn mayweed from the garden.
