simpleMeaning: A yellow coloring substance that remains visible even when heavily diluted; in silver nitrate
  tests it acts as an indicator, turning pink once chloride ions are gone.
scope: This is the yellow test indicator that turns pink at the chloride endpoint, not a fabric coloring
  or an optical brightener.
examples:
- A pinch of resorcinolphthalein gave the solution a pale yellow tint.
- The resorcinolphthalein turned pink exactly when the last chloride ion had reacted.
