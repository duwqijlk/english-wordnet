simpleMeaning: the state of not being able to make new mixed kinds of living things that can live and
  have young of their own
scope: The state of not being able to make new mixed kinds of living things that can live and have young,
  not a failure to make young at all and not a cross that gives weak young.
examples:
- Cacogenesis stopped the two kinds from making young that could live and breed.
- The cross showed cacogenesis, since none of the young lived long enough to have young of their own.
