simpleMeaning: a long, narrow cut or groove made by nature, such as water wearing away rock, or by a tool,
  such as the track cut into a record.
scope: This is a cut or groove in a surface, not a waterway for boats, a broadcast station, or a means
  of communication.
examples:
- Water had worn a narrow channel in the rock.
- The needle follows the channel cut into the record.
