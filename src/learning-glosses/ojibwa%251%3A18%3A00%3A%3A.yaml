simpleMeaning: A person of an Algonquian people who live from what is now Ontario in the east of Canada
  all the way to Montana, above and round Lake Superior
scope: Also called Chippewa and Ojibway; a person of an Algonquian people, not the tongue spoken by the
  Ojibwa people.
examples:
- An Ojibwa elder taught the children the old songs.
- The Ojibwa live from Ontario all the way to Montana.
