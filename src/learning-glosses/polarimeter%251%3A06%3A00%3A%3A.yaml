simpleMeaning: A light-measuring tool that gauges the turn of the flat plane in which light waves that
  shake in one plane move
scope: A light-measuring tool that gauges the turn of the flat plane in which light waves that shake in
  one plane move; also called polariscope; not a tool that gauges the brightness of light and not a lens
  that bends light.
examples:
- The polarimeter showed how much the light had turned.
- She read the polarimeter to check the sugar mix.
