simpleMeaning: An aircraft can drop suddenly when it meets a small area where the air pressure is low
  or the air is sinking.
scope: This is the airborne patch of low or sinking air that jolts an aircraft; air pocket is another
  name for it, not a hollow shape or a garment pouch.
examples:
- The plane hit an air pocket and dropped several hundred feet.
- Passengers gasped as the aircraft fell into a pocket of low pressure.
