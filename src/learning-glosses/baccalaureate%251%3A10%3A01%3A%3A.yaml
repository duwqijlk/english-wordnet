simpleMeaning: A farewell sermon given to students who are finishing their studies, at the ceremony where
  they receive their degrees
scope: A goodbye talk at a graduation ceremony, not the degree itself and not an ordinary lesson.
examples:
- The baccalaureate was given in the college chapel.
- She listened to the baccalaureate before the graduation ceremony.
