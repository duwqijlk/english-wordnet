senseId: 'rigidification%1:22:00::'
synsetId: 13582724-n
simpleMeaning: The change by which a thing turns stiff and hard to bend.
scope: This is the change by which a thing turns stiff, not a thing that is stiff from the start; it is
  also called stiffening and rigidifying.
examples:
- Rigidification of the joints made it hard to move.
- Cold brought rigidification to the wet clay.
