simpleMeaning: a round flat badge that you pin onto clothes and that shows words, a picture, or other
  information
scope: This is a flat badge you pin on clothes to show information; not the round piece that holds a shirt
  shut and not the area you click on a screen.
examples:
- They passed out campaign buttons for their candidate.
- She pinned a round button with a happy face onto her jacket.
