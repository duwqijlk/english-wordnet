simpleMeaning: Money or goods got outside the law.
scope: Also called prize, plunder, loot, booty, or pillage, this is money or goods taken by breaking the
  law, not a bundle of a traveller's belongings, not a thing drooping, sinking, or settling from pressure
  or from going slack, and not the verb use for swaying heavily or unsteadily or for walking as if one
  cannot control one's steps.
examples:
- The police found the swag hidden under the floorboards.
- He sold the swag for far less than it was worth.
