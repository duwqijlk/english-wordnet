simpleMeaning: shiny grey in colour, or covered with or slightly tinted by that pale metallic grey.
scope: This describes a grey colour or tint, not the bright white shine of a polished surface and not
  being made of the metal.
examples:
- The sky turned a soft silver grey before the storm.
- He bought a silver car with grey seats.
