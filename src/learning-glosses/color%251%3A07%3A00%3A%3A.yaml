simpleMeaning: the quality that your eyes see in a thing because of the light it gives out, lets through,
  or sends back.
scope: This is not the paint or dye that is put on an object, and it is not a person's skin tone; it is
  the quality that light gives.
examples:
- The color of the sky changed from grey to pink.
- Leaves get their color from natural pigments.
