simpleMeaning: Once thought a grain that grows into a plant and makes its holder unseen, it is a speck
  of the plant like dust that grows into a new one alone
scope: This speck is not a real seed, though people once thought it was, and it grows into a new plant
  on its own.
examples:
- Fern seed looks like dust, but each speck can grow into a new fern.
- People once thought fern seed could make its holder unseen.
