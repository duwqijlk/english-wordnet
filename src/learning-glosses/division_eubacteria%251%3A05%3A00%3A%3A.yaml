simpleMeaning: A group of one-celled living things with plain cells, stiff walls, and tails for swimming
  in the kinds that move.
scope: A group of one-celled living things with plain cells, stiff walls, and tails for swimming in the
  kinds that move, set apart from other one-celled groups by its stiff walls.
examples:
- The division Eubacteria includes most of the bacteria we meet in daily life.
- In class we learned that the division Eubacteria has simple cells with stiff walls.
