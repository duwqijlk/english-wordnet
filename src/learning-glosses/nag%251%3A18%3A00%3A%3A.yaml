simpleMeaning: a person, especially a woman, who annoys people by again and again saying what is wrong
  with things
scope: Also called scold, this is a person who annoys people by speaking about what is wrong; not the
  act of reminding or urging someone again and again, and not the act of bothering someone again and again
  with small complaints.
examples:
- Her neighbours saw her as a nag who complained about every small thing.
- He did not want to live next door to such a nag.
