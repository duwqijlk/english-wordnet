simpleMeaning: to treat an idea as if it were a real thing
scope: To treat an idea as a real thing, also called hypostatize; not to prove the idea true and not to
  imagine it for fun.
examples:
- He tends to hypostatise the market, talking about it as if it had a will of its own.
- Do not hypostatise the number zero into a thing that exists on its own.
