simpleMeaning: A formal paper drawn up for a lawyer who brings a case, saying a person is charged with
  a crime.
scope: A formal paper charging a person with a crime, also called indictment; not a verdict and not a
  witness statement.
examples:
- The bill of indictment named the man and his crime.
- A bill of indictment was read out in court.
