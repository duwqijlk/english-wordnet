simpleMeaning: A fern of Europe and Asia Minor with a short thin underground stem and thick tufts of bright
  green leaves that look like parsley.
scope: A fern with thick tufts of bright green leaves like parsley, also called a mountain parsley fern
  or a European parsley fern.
examples:
- The Cryptogramma crispa grew in thick tufts on the rocky slope.
- Cryptogramma crispa leaves look so much like parsley that walkers mistake them for it.
