simpleMeaning: Any of several kinds of plants that bear gourds with hard skins and long bent necks
scope: Any of several kinds of plants that bear gourds with hard skins; winter crookneck squash is another
  name for this sense, and it is not a soft-skinned summer gourd or a melon.
examples:
- Winter crookneck bore gourds with hard skins.
- The winter crookneck squash had a long bent neck.
