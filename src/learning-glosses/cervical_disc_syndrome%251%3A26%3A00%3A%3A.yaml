simpleMeaning: a condition caused by pressure on nerve roots in the neck, bringing neck pain, muscle weakness
  and tingling
scope: This neck-nerve condition is also called cervical root syndrome; it is not a general neck sprain
  or a disc infection.
examples:
- Cervical disc syndrome often causes pain that spreads from the neck into the arm.
- Her doctor suspected cervical disc syndrome after she complained of numbness in her hand.
