simpleMeaning: A gas that people breathe in to feel no pain, used by dentists and in surgery.
scope: A gas that people breathe in to feel no pain, used by dentists and in surgery, with laughing gas
  as another name for this sense, not air for breathing and not a drug taken by mouth.
examples:
- The dentist gave her nitrous oxide to ease the pain.
- Nitrous oxide is breathed in during surgery.
