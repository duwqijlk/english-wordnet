simpleMeaning: A brown liquid of fried vegetables, small bits of meat, a seasoned soak, and plenty of
  pepper, served by cooks with deer meat.
scope: Also called pepper sauce, this brown liquid goes with deer meat alone, not with meat of any kind.
examples:
- The cook served poivrade with the deer meat.
- The venison came with poivrade.
