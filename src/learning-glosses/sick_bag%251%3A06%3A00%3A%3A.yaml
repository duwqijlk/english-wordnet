simpleMeaning: a sack on a plane, given to people who feel ill from flying and need to throw up
scope: Also called a sickbag; a sack for use on a plane, not a shopping bag and not a first-aid kit.
examples:
- She took the sick bag from the seat pocket when the plane began to shake.
- The flight attendant handed him a sick bag.
