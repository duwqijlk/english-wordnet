simpleMeaning: cells in a prison where people who have been given a sentence to be killed wait until that
  sentence is carried out
scope: This is the set of cells where people waiting to be put to death are held, also called death house;
  not a hospital ward and not a court room.
examples:
- She was moved to death row after the sentence was read.
- Life on death row means waiting for the day of execution.
