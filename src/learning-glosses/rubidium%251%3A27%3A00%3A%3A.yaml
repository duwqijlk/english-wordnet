scope: Also called atomic number 37 and Rb; a soft silvery alkali metal that burns in air and reacts with
  great force in water, found in carnallite, lepidolite, and pollucite.
examples:
- A small piece of rubidium caught fire as soon as it touched the air.
- The chemist kept the rubidium under oil so it would not touch water.
