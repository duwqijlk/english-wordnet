simpleMeaning: that shows or comes from a joining of parts
scope: It marks a thing as joined or coming from joining, with combinative as another name for this sense,
  and not a thing kept apart or standing alone.
examples:
- The combinatory effect of the two drugs changed the result.
- They used a combinatory method to mix the two styles.
