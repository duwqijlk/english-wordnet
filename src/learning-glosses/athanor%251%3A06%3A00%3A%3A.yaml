simpleMeaning: Old metal-workers kept one steady heat with this heater, which fed its own fire to hold
  the same warmth.
scope: This is the heater that feeds its own fire to hold one steady heat, the tool of old metal-workers.
examples:
- The metal-worker set the athanor going and left it to feed itself.
- The athanor fed itself and the heat never wavered.
