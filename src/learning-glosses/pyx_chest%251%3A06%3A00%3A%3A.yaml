senseId: 'pyx_chest%1:06:00::'
synsetId: 04036750-n
simpleMeaning: A box in which new coins from the place that makes them are held while they wait to be
  checked for the metal they hold
scope: A box for new mint coins waiting to be tested; pix, pix chest and pyx are other names for this
  sense. Not a church box for holy bread and not an ordinary money box.
examples:
- The pyx chest was opened only when the assay began.
- The mint stored the day's coins in the pyx chest.
