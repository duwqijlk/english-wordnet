simpleMeaning: a person who lends money to others and asks them to pay back far too much extra money for
  it
scope: A person who lends money and makes borrowers pay back far too much extra; not a bank or other lender
  that asks for a fair amount extra.
examples:
- He borrowed from a moneylender and soon owed back twice what he had taken.
- The moneylender made the poor farmers pay very high interest on every loan.
