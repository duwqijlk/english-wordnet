simpleMeaning: an animal of the mule kind that lives in the western Rocky Mountains
scope: Also called blacktail and black-tailed deer, an animal of the mule kind that lives in the western
  Rocky Mountains, not a white-tailed deer and not a mule deer from the eastern mountains.
examples:
- A blacktail deer crossed the road in the western Rockies.
- We saw a blacktail deer with her young near the pines.
