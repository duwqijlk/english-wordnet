senseId: 'herschelian_telescope%1:06:00::'
synsetId: 03521810-n
simpleMeaning: A star-gazing tool with a mirror set at a slight slant, so the picture falls to one side
  where it can be seen.
scope: Also called off-axis reflector; a mirror star-gazer with its mirror set at a slant, not a lens
  star-gazer and not other mirror star-gazers.
examples:
- The Herschelian telescope at the observatory uses a tilted mirror.
- He looked through a Herschelian telescope at the moon.
