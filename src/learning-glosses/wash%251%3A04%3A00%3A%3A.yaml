simpleMeaning: an activity whose gains exactly offset its losses
scope: A venture that breaks even, not the act of cleaning with soap and water, the clothes to be laundered,
  or a thin coat of paint.
examples:
- After every expense was paid, the venture was a wash.
- The year's trading was a wash, with gains exactly covering the losses.
