simpleMeaning: to shine with a light that comes and goes again and again
scope: 'Also called flash, blink and wink: this is about light that comes and goes; not the noun senses
  of twinkle, such as a short flash of light or a happy look in the eyes.'
examples:
- The sign twinkled on and off all night.
- One small light twinkled in the window, then went dark, then shone again.
