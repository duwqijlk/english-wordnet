simpleMeaning: A large shaking made by a smaller shaking that repeats at nearly the same rate as the natural
  repeating rate of the thing that is shaking
scope: This is a large shaking made by a smaller shaking at nearly the same rate; it is not the excited
  state of a tiny particle and not the quality of a voice or a loud deep sound.
examples:
- The bridge shook in resonance with the small repeated pushes of the wind.
- The guitar body grew louder through resonance when the string shook at its natural rate.
