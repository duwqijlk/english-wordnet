simpleMeaning: To go through life at your own pace, in no hurry and free of duty.
scope: 'Also called drift: to live freely and without hurry or care for duty, not to coast on a bicycle
  and not the clutch that lets wheels turn freely.'
examples:
- After college he freewheeled through Europe, working here and there.
- She freewheeled for a year, taking no job and keeping no hours.
