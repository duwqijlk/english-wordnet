simpleMeaning: an announcement given out to journalists to add to or take the place of something spoken.
scope: This is a statement for journalists, not the act of setting something free, ending a job, or letting
  fluid out.
examples:
- The company sent a press release to announce the new product.
- The senator's office issued a release denying the rumors.
