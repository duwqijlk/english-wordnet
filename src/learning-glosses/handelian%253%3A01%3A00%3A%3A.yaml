simpleMeaning: Of, about, or in the style of the composer George Frederick Handel.
scope: This word describes things linked to the composer Handel, not the man himself and not music by
  other composers.
examples:
- The choir sang a Handelian oratorio at the festival.
- Her playing has a Handelian clarity and grace.
