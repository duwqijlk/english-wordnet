simpleMeaning: white flowers crown leafy stems on a tall plant of Europe and Asia that lives for years;
  it now grows wild in many lands, often placed in the Chrysanthemum group
scope: 'Also called marguerite, moon daisy, ox-eyed daisy, and oxeye daisy: a tall plant with leafy stems
  and white flowers, not a yellow daisy and not a garden chrysanthemum grown for show.'
examples:
- White daisy grows tall along the fence, its white flowers open all summer.
- White daisy now grows wild in the meadow behind the house.
