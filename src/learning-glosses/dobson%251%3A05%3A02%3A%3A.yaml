simpleMeaning: the big brown young form of a large fly, living in water and used as bait for fishing
scope: The big brown young form of a large fly, living in water and used as bait, also called a hellgrammite;
  not the grown fly and not a worm used as bait.
examples:
- He hooked a dobson onto the line.
- Dobsons make good bait for trout.
