simpleMeaning: The teeth of one wheel fit into the teeth of the next, so each wheel moves the one after
  it
scope: Of toothed wheels or gears, fitted together so each moves the next, also called engaged or meshed;
  not wheels that only touch, and not parts that are fixed in place.
examples:
- The intermeshed gears turned the mill wheel.
- With the cogs intermeshed, the machine ran smoothly.
