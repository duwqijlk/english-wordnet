simpleMeaning: a very small amount, so small that you can hardly tell that it is there
scope: 'Also called whit, shred, iota, smidgen, smidgeon, tittle, and smidgin: a very small amount of
  something, not a small thing or piece by itself.'
examples:
- Add just a smidge of salt to the soup.
- There was only a smidge of milk left in the bottle.
