simpleMeaning: a fast train or bus that stops at only a few places along its route.
scope: This is a rail or bus service, not mail sent by a rapid system, and not a slow service that stops
  everywhere.
examples:
- We caught the express into town.
- The express from Edinburgh stops only twice.
