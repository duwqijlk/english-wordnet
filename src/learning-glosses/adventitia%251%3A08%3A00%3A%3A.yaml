simpleMeaning: A thin skin-like layer that wraps round and covers a part of the body.
scope: A thin layer that wraps round and covers a body part, also called a tunic; not the body part itself
  and not a layer of muscle.
examples:
- The adventitia holds the blood vessel in place.
- Surgeons cut through the adventitia to reach the vessel wall.
