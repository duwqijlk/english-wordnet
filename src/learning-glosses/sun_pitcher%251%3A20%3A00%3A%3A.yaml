simpleMeaning: an herb from the Guiana highlands with nodding white or pink flowers in long clusters,
  whose pitcher-shaped leaves with spoon-shaped lids catch and digest insects
scope: This is the insect-eating plant, not a jug for pouring or a flower that merely looks like a pitcher.
examples:
- Sun pitchers get most of their nutrients by catching small insects.
- The sun pitcher grows on the highlands of Guiana.
