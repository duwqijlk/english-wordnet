simpleMeaning: A perennial bog herb whose dark red flowers rise above flat winged tube-shaped traps in
  a ring; native to northeastern North America and now wild in Ireland and Europe.
scope: The same dark-red-flowered bog dweller that huntsman's cup also names; not the taller southern
  pitcher plants with yellow flowers or white-hooded traps.
examples:
- The common pitcher plant stores rainwater in the hollow leaves that ring its base.
- In Ireland the common pitcher plant has spread from gardens into wild bogs.
