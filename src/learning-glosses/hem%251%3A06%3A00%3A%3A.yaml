simpleMeaning: the edge of a piece of cloth, especially the end edge that is folded under and sewn down
  to finish it
scope: This is the edge of cloth, not the short sound a person makes in the throat and not the act of
  folding and sewing that edge.
examples:
- The hem of her dress was wet from the rain.
- He sewed small weights into the hem of the curtain.
