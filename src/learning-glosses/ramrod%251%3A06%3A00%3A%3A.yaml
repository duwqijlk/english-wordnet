simpleMeaning: a long thin stick used to push the charge (powder for firing) into a gun that you load
  from the front end
scope: This stick pushes the charge into a gun you load from the front end. It is not the stick used to
  clean a gun, and not a hard, strict person in charge.
examples:
- He used the ramrod to push the powder down the barrel.
- She slid the ramrod out and pushed the charge into place.
