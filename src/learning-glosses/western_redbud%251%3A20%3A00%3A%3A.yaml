simpleMeaning: a bush from the Pacific side of the United States, with pink or deep red flowers, often
  growing in thick, close groups
scope: A bush with pink or deep red flowers, often growing in thick, close groups, not a tall tree and
  not a garden rose.
examples:
- The western redbud flowered pink along the dry creek.
- Thickets of western redbud covered the sunny hillside.
