synsetId: 05951187-n
simpleMeaning: In faith, the view that people can know God in a sure and open way from the signs he has
  given, as when Adam was made in his image.
scope: This is the belief that God can be known from the signs he has given, unlike the view that he cannot
  be known at all.
examples:
- Cataphatism holds that God can be known from the signs he has given.
- In cataphatism, Adam made in God's image shows that God can be known.
