simpleMeaning: A way of thinking that shows no respect for a god and looks down on a god
scope: A scornful attitude towards a god, not a loving or fearful one.
examples:
- His profaneness shocked the worshippers in the temple.
- She spoke with a profaneness that showed no respect for the gods.
