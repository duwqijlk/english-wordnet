simpleMeaning: a shape with a sharp corner or a round turn, made when something is folded
scope: This shape is also called a fold, a bend, and a crease; it is not a person who tricks men into
  service and not a curled lock of hair.
examples:
- There was a sharp crimp in the paper where it had been folded.
- She pressed a crimp into the edge of the cloth.
