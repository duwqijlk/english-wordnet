scope: This is a fatal sickness of sheep marked by long-lasting itching, loss of control over the muscles,
  and slow damage to the brain and spinal cord, not a short illness that passes.
examples:
- The sheep with scrapie itched without stop and lost control of their muscles.
- Scrapie killed the sheep after long-lasting itching and loss of muscle control.
