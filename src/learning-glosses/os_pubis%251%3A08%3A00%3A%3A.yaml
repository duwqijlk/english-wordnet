simpleMeaning: One of three parts of the hip bone, it joins its pair to make the front of the ring of
  bones at the base of the body
scope: This bone is one of three parts of the hip bone, also called pubis and pubic bone; not the whole
  hip bone and not a bone of the leg.
examples:
- The doctor pointed to the os pubis on the X-ray of her hip.
- The os pubis forms the front of the pelvis, where the two hip bones meet.
