simpleMeaning: The distance a ray travels through empty space in the time the earth takes to go round
  the sun, 5.88 trillion miles or 9.46 trillion kilometres
scope: Light-year is another name for this distance a ray travels in empty space in the time the earth
  takes to go round the sun; it measures distance, not time.
examples:
- The nearest star is over four light years away.
- A light year is a measure of distance, not of time.
