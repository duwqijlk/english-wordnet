simpleMeaning: days or hours off work given to a worker for extra hours worked
scope: Days or hours off work given for extra hours worked, not paid extra money for the extra hours and
  not a holiday.
examples:
- She took compensatory time after working late all week.
- His compensatory time gave him Friday off after the long shift.
