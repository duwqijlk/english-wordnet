simpleMeaning: The fourth number needed, along with the three dimensions of space, to pin down exactly
  when and where a physical event happens.
scope: This is the physics dimension, not the general passing of events, not a particular occasion, and
  not musical rhythm.
examples:
- Physicists treat time as a fourth coordinate alongside length, width and height.
- In relativity, time is treated as a dimension just like space.
