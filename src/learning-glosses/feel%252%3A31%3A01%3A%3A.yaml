simpleMeaning: To become aware of yourself in a certain way because of someone else's behavior or attitude
  toward you.
scope: This is not touching something with your hands and not a general mood with no outside cause; it
  is your sense of yourself stirred by another person's behavior.
examples:
- She felt foolish after he laughed at her mistake.
- I felt small when the teacher ignored my question.
