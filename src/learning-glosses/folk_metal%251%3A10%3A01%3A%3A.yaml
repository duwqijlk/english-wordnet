simpleMeaning: A kind of loud guitar music mixed with old songs of the people, that grew up in Europe
  in the 1990s.
scope: A kind of loud guitar music mixed with old songs of the people, that grew up in Europe in the 1990s;
  not loud guitar music on its own and not old songs of the people on their own.
examples:
- The folk metal band mixed loud guitars with old songs of the people.
- Skyclad is a folk metal group that has played since the 1990s.
