simpleMeaning: The set time of the fifth zone from Greenwich on the sunset side, kept at the 75th line
  of longitude; used in the east of the United States.
scope: Not the time of the lands to the west, nor daylight time; also called Eastern Standard Time and
  Eastern Time.
examples:
- It is noon EST in New York.
- Clocks in the east run on EST in winter.
