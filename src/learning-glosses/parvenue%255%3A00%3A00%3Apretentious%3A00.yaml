simpleMeaning: Describing someone who has grown rich or risen in rank but still lacks the manners that
  fit the new place
scope: 'Also called an upstart, nouveau-riche, or parvenu: describing someone who has grown rich or risen
  in rank but still lacks the manners that fit the new place, not someone born to rank and not a plain
  snob.'
examples:
- Her parvenue airs made the old families smile behind her back.
- She was called a parvenue at the party for her new money.
