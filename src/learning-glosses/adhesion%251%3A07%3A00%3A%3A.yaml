senseId: 'adhesion%1:07:00::'
synsetId: 04942705-n
simpleMeaning: The way two things stick to each other, as glue to wood, or two faces made of unlike stuff
  join.
scope: The way two things stick to each other or two unlike faces join, also called bond, adherence, and
  adhesiveness; not the sticking of like stuff to itself and not a band of scar tissue joining body parts.
examples:
- Good adhesion kept the label on the wet glass.
- A heated hydraulic press was required for adhesion.
