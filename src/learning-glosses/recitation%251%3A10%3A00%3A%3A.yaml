schema: oewn-learning-gloss-v2
senseId: 'recitation%1:10:00::'
synsetId: 07249541-n
simpleMeaning: a time in front of other people when someone says, from memory, something they learned
  and got ready before
scope: 'Also called reading, and also called recital: this is saying learned words in front of people,
  not the written words themselves.'
examples:
- Her recitation of the poem in front of the class was clear and steady.
- The evening ended with a recitation of a short piece he knew by heart.
