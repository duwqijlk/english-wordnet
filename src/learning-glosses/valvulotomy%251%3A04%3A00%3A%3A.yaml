simpleMeaning: A cut into a narrowed heart valve to clear the block.
scope: 'Also called valvotomy: a cut into a narrowed heart valve to clear the block, not a cut to take
  the valve out and not a cut into the chest wall.'
examples:
- The surgeon did a valvulotomy to clear the narrowed heart valve.
- A valvulotomy cuts into the valve to let the blood flow.
