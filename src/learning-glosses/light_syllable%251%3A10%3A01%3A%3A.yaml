simpleMeaning: With no sound after it, one beat of a word is built round a short vowel, a sound made with
  the mouth open
scope: A beat of a word built round a short vowel with nothing after it, not a beat with a long vowel
  and not a beat that ends in a closing sound.
examples:
- The first light syllable in the word is short and open.
- In this word, the light syllable has no closing sound.
