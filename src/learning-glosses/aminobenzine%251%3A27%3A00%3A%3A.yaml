simpleMeaning: a poisonous oily liquid amine got from nitrobenzene and used to make dyes, plastics, and
  medicines
scope: Also called aniline, aniline oil, and phenylamine; a poisonous oily liquid used to make dyes, not
  a dye itself and not a safe household liquid.
examples:
