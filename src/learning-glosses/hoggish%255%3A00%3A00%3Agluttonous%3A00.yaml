simpleMeaning: Like a pig; coarse and greedy, taking far more food than is needed.
scope: Like a pig; coarse and greedy for food, not merely hungry and not rude in manner; also called piggy
  and piggish.
examples:
- His hoggish manners at the table shocked the guests.
- She ate in a hoggish way, taking far more than she needed.
