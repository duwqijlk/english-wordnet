simpleMeaning: to make people or things follow the rules, set ways of doing things, or the way things
  are done, and to set rules for them
scope: 'Also called order, regulate, govern and regularize: to make people or things follow rules, not
  to let them do as they please and not to free them from rules.'
examples:
- The new law will regularise how shops open on Sundays.
- The council voted to regularise parking in the town centre.
