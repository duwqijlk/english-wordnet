simpleMeaning: to force a person to leave the place where they live, as a punishment
scope: This means making a person leave the place where they live as a punishment; it is not stopping
  a film or newspaper from being shared, and not the maths unit for measuring information.
examples:
- The king banned him from the city for his crime.
- She was banned from her home town after the trouble.
