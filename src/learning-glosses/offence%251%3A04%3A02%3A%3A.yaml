simpleMeaning: being rude in a way that shows no care for others and leaves them hurt
scope: Being rude in a way that shows no care for others and leaves them hurt; offense is another name
  for this sense, and it is not a crime against the law or the anger felt when offended.
examples:
- His rude remark caused great offence.
- She took offence at his words and left the room.
