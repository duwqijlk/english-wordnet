simpleMeaning: something put on a surface with small holes to form a hard covering, like a coat of paint
  or varnish used to make the surface ready
scope: 'Also called sealant: something put on a surface to make a hard covering on it. It is not a person
  whose job is to put an official mark on papers.'
examples:
- Put a coat of sealer on the wood before you paint it.
- The sealer dried into a hard, clear covering over the floor.
