senseId: 'introspection%1:09:00::'
synsetId: 05794660-n
simpleMeaning: the act of thinking carefully about your own thoughts, wishes and the way you act
scope: This is careful thought turned on your own mind and actions, not thought about other people or
  about things outside you.
examples:
- After the failure, he spent a quiet week in introspection.
- Introspection helped her see why she kept making the same choices.
