simpleMeaning: A telling that lays out what a piece of writing or a talk means or aims at.
scope: An account that lays out the meaning or aim of a writing or talk, not a written explanation of
  a set topic, not a public show of things and not the opening part of a piece of music.
examples:
- The book begins with a short exposition of the play's background.
- Her exposition of the poem made its meaning clear.
