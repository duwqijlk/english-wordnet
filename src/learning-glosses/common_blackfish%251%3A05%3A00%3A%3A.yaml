simpleMeaning: A small dark sea animal of the Atlantic coast of the United States, whose biggest male
  leads the group
scope: A small dark sea animal of the Atlantic coast of the United States, whose biggest male leads the
  group; black whale, blackfish and pilot whale are other names for this sense, not a big pale sea animal
  and not a fish.
examples:
- The common blackfish led its group along the coast.
- A common blackfish swam close to the boat.
