senseId: 'allopatry%1:26:00::'
synsetId: 13982575-n
simpleMeaning: when living things that are related to each other are found in separate places that do
  not overlap
scope: When related living things are found in separate places that do not overlap; not the same kinds
  living in one shared place, and not one kind living in many places.
examples:
- Allopatry keeps the two kinds of mice in separate valleys, so they never meet.
- Allopatry means the two frog kinds live in areas that do not overlap.
