simpleMeaning: not able to understand a thing in a deep way, and not good at judging what is true or right
scope: 'Also called purblind: not good at understanding or judging, not the sense that means slow to learn,
  and not the leaf sense that means round at the tip.'
examples:
- He was too obtuse to see that his joke had hurt his friend.
- An obtuse leader did not see the danger that everyone else could see clearly.
