simpleMeaning: People want to experience a basic feeling of enjoyment, though nobody can quite say what
  it is.
scope: The basic feeling of enjoyment itself — another name for pleasance — not an enjoyable activity,
  sexual gratification, or a person or thing that gives happiness.
examples:
- The children squealed with pleasure when they saw the puppies.
- He took great pleasure in watching the sun rise over the sea.
