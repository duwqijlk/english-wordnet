simpleMeaning: to give a ship a place in a port where it can lie and be tied up
scope: To give a ship a place in port, not the place itself, and not to hold a ship fast in a berth or
  dock.
examples:
- The harbour master berthed the ferry at dawn.
- They will berth the cruise ship at the far pier.
