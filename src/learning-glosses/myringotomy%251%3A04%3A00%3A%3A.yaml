simpleMeaning: An operation that cuts a hole in the eardrum to let out pressure or pus from the middle
  ear.
scope: An operation that cuts a hole in the eardrum to let out pressure or pus, not an operation that
  mends the eardrum and not a tube put in the ear.
examples:
- The doctor did a myringotomy to drain the pus from the middle ear.
- A myringotomy relieved the pressure in his ear.
