simpleMeaning: In someone else's house, this paid person does the housework, most often one sent by the
  town to look after people who are weak or ill
scope: A paid person who does housework in another person's house, most often sent by the town to look
  after the weak or ill, not a family member and not a nurse.
examples:
- Mrs. Ellis works as home help for an elderly neighbour.
- The council sent home help to do the cleaning twice a week.
