simpleMeaning: The act of punching a hole, especially a row of holes so a thing comes apart with ease.
scope: The act of punching a hole, especially a row of holes so a thing comes apart with ease, not a hole
  made by cutting.
examples:
- The perforation along the edge let her tear the page out cleanly.
- Perforation of the ticket showed it had been used.
