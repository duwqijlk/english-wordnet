simpleMeaning: A pouch in a garment is reached through a slit cut up and down or on a slant in the outside,
  most often below the waist
scope: It is a pocket in a garment, most often below the waist, reached through a vertical or diagonal
  slit in the outside.
examples:
- Hands slipped into the slash pockets of the coat.
- The slash pocket was reached through a slanting slit in the jacket.
