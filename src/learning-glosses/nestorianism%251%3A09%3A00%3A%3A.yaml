simpleMeaning: The teaching, named for Nestorius, that Christ is both the Son of God and the man Jesus,
  against the Roman Catholic teaching that Christ is fully God.
scope: 'A teaching about the nature of Christ: it holds that Christ is both the Son of God and the man
