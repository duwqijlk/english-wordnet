simpleMeaning: Jerking all over the body follows stiff spasms that grip the muscles, in attacks that take
  away consciousness.
scope: Also called epilepsia major, generalized epilepsy and grand mal, it names the epilepsy in which
  attacks take away consciousness and end in jerking all over the body.
examples:
- He lives with grand mal epilepsy.
- She learned to care for a child with grand mal epilepsy.
