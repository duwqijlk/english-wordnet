simpleMeaning: a full-grown blood cell that holds the red stuff that carries oxygen to the parts of the
  body; a flat disc, dented on both sides, with no centre part
scope: A full-grown blood cell that carries oxygen; erythrocyte and red blood cell are other names for
  this sense; not a white blood cell and not a blood platelet.
examples:
- An RBC carries oxygen from the lungs to the tissues.
- A healthy adult has millions of RBCs in every drop of blood.
