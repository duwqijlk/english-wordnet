simpleMeaning: a disease spread by body lice and caused by a kind of germ, with a rash on the skin and
  a high fever
scope: 'Also called typhus fever: a disease spread by body lice, not a general fever or a skin rash with
  another cause.'
examples:
- Many soldiers fell ill with typhus in the crowded camp.
- Doctors worked to stop typhus from spreading among the refugees.
