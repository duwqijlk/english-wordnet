simpleMeaning: a strong light with a part that throws the light forward, fixed to the front of a car or
  a train engine
scope: 'Also called headlight: the strong light fixed to the front of a car or train, not a small lamp
  that a person carries or wears.'
examples:
- The car's headlamps lit up the dark road.
- A headlamp on the train shone far ahead down the track.
