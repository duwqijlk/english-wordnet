simpleMeaning: The way liquids rise or fall in very thin tubes, because of the pull on the surface of
  the liquid
scope: Also called capillary action, this works in very thin tubes, not in wide ones.
examples:
- Capillarity draws water up the thin tube.
- The rise of ink in the tube shows capillarity at work.
