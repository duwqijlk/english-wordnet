simpleMeaning: A part of the United States government, made in nineteen seventy-seven, that keeps the
  country's plan for power.
scope: Also called Energy and Department of Energy, it deals with the country's power, not with its armed
  forces or its foreign affairs.
examples:
- The Energy Department set new rules for power plants.
- She worked for the Energy Department in Washington.
