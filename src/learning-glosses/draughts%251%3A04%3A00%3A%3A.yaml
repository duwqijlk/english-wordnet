simpleMeaning: a game for two people on a board with squares, where each person has 12 pieces and jumps
  over the other person's pieces to take them
scope: 'Also called checkers: this is the board game for two people with 12 pieces each, not a cold flow
  of air and not a drink taken at one time.'
examples:
- On rainy days, the two friends played draughts at the kitchen table.
- She won at draughts by jumping over three of his pieces in one turn.
