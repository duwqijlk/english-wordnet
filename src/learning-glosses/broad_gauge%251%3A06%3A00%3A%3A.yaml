simpleMeaning: a train track, or the width of it, that is wider than the usual width of 56.5 inches
scope: A train track, or how wide it is, that is wider than the usual 56.5 inches, not a track of the
  usual width and not a narrow track.
examples:
- The broad gauge line carried heavy freight across the country.
- Engineers measured the broad gauge before laying the new track.
