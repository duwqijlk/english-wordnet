simpleMeaning: A man who knows a great deal about growing plants, fruit, flowers, vegetables and plants
  grown for show
scope: A man who is expert at growing plants; the woman with the same skill is a plantswoman, and this
  is not just someone who tends a garden.
examples:
- The plantsman knew every rose in the garden by name.
- As a plantsman, he grew fruit, flowers and vegetables for show.
