simpleMeaning: Warm backing and kind guidance from a backer.
scope: This sense is also called protection and auspices, for warm backing and kind guidance from a backer,
  where protection is warm approval and helpful advice from one who backs what you do, unlike the sense
  for an armour plate guarding the chest, the front part of a cuirass.
examples:
- The project grew under the aegis of the council.
- She worked under his aegis, with warm backing.
