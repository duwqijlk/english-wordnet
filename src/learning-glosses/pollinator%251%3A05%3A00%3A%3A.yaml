simpleMeaning: a small animal with six legs that carries pollen (the fine dust made by flowers) from one
  flower to another
scope: An insect that moves pollen between flowers, not the flower itself and not the pollen it carries.
examples:
- Bees are important pollinators for many fruit trees.
- The butterfly acted as a pollinator when it moved from flower to flower.
