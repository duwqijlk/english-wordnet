senseId: 'pancytopenia%1:26:00::'
synsetId: 13997216-n
simpleMeaning: Tied usually to a growth in the marrow or to marrow making too few cells, it leaves too
  few of all kinds of blood cell — red, white and platelets.
scope: It is a state with too few of all kinds of blood cell, not a lack of one kind of cell only.
examples:
- Her pancytopenia left her with too few red cells, white cells and platelets.
- Pancytopenia is usually tied to marrow that makes too few cells.
