simpleMeaning: a written document produced again from an original, such as one kept by a court or a school
scope: This is a written record reproduced from an original, not a thing made to look like another object,
  printed material for publication, or writing suitable for a news story.
examples:
- The clerk filed a copy of the deed with the court.
- Please bring a copy of your school record to the interview.
