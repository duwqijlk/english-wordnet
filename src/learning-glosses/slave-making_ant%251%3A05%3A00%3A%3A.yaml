simpleMeaning: Brought up to work for the colony, the young of other kinds are the ones this insect's
  workers take from their nests.
scope: Also called a slave-maker, this insect's workers take the young of other kinds home to work in
  its own nest.
examples:
- The slave-making ant workers carried the young back to their own nest.
- A slave-making ant colony keeps the young it steals to work in its nest.
