  I and ended by Cleopatra.
scope: The ancient Macedonian kings of Egypt, from Ptolemy I to Cleopatra; also called Ptolemy.
examples:
- The Ptolemaic dynasty ruled Egypt for nearly three hundred years.
- Cleopatra was the last ruler of the Ptolemaic dynasty.
