simpleMeaning: A chemical made with carbon whose tiny parts form a ring of more than one kind, and which
  has a strong smell that gets into the nose
scope: A carbon chemical whose tiny parts form a ring of more than one kind, with a strong smell, not
  a plain alcohol and not a sweet-smelling oil.
examples:
- Pyrimidine has a sharp smell that fills the whole room.
- The lab keeps pyrimidine in a closed bottle because of its strong smell.
