simpleMeaning: a fact or event that later events depend on
scope: A key fact or event that later events depend on, not the part that joins a door and lets it swing
  and not the act of fixing such a part.
examples:
- This vote is the hinge of the whole plan, because everything else depends on it.
- The meeting will be the hinge for all our later work.
