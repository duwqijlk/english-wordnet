simpleMeaning: A British measure for how much a thing holds, for liquids or dry goods, the same as four
  quarts or 4.545 liters
scope: This is the British measure of four quarts or 4.545 liters, not the United States measure, which
  holds 3.785 liters.
examples:
- The tank holds two gallons of water.
- She bought a gallon of milk from the shop.
