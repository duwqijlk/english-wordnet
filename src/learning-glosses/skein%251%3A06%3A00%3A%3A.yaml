simpleMeaning: loops of worsted yarn, a smooth wool thread made in a tight way
scope: This is wool yarn wound in long loops, sold as one piece; it is not yarn rolled into a ball, and
  not one single thread on its own.
examples:
- She bought a skein of blue wool for her sweater.
- The shop sells each colour in a separate skein.
