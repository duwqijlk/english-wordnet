simpleMeaning: to lift up or see as perfect, in the way Christ was changed and shown in bright light in
  the Bible story
scope: 'Also called transfigure: to lift up or see as perfect in this Bible-story way for Christ, not
  simply to praise or give honour to someone.'
examples:
- The paintings glorify Christ on the mountain, showing him in bright light.
- The artist glorified Christ by showing his face shining with light.
