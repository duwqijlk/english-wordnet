simpleMeaning: of a shirt, with the ends of the collar held flat by small round fasteners
scope: Of a shirt, with the ends of the collar held flat by fasteners, not a shirt with a loose open collar
  and not a shirt with no collar at all.
examples:
- He wore a button-down shirt with a tie.
- Her button-down collar stayed neat all day.
