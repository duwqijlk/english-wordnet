simpleMeaning: the young of many moths, covered in a thick coat of soft hairs, that feed on plants, and
  some harm the plants badly
scope: Also called woolly bear caterpillar, the hairy young of moths that feed on plants, not a worm and
  not a grub.
examples:
- The woolly bear crawled across the leaf, its soft hairs standing out.
- Woolly bears feed on garden plants and can harm them badly.
