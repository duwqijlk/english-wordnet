simpleMeaning: Light green leaves grow on this willow of the lands of Europe, Asia and Africa, and people
  grow it to make baskets.
scope: Also called almond willow, black Hollander and Salix triandra; a willow of the lands of Europe,
  Asia and Africa with light green leaves grown to make baskets, not the willow of the western United
  States with leaves like those of peach or almond trees.
examples:
- The gardener planted Salix amygdalina for its light green leaves.
- We cut stems of Salix amygdalina to weave into baskets.
