simpleMeaning: to put the marks “ ” around a piece of writing
scope: This is putting marks around writing. It is not the marks themselves, and not the piece of writing
  that someone repeats.
examples:
- When a word is quoted in this book, it has the marks “ ” around it.
- She quoted the word 'freedom' by putting marks around it, because she was talking about the word itself.
