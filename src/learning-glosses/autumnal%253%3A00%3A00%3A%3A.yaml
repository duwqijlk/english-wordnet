simpleMeaning: connected with autumn, having the look or feel of autumn, or taking place in autumn
scope: About autumn and what happens in it, not about a person in late life who is starting to get weaker.
examples:
- We walked through autumnal woods full of red and gold leaves.
- The autumnal weather turned cold in late October.
