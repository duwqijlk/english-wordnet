simpleMeaning: a red light-catching colour stuff in the rod cells at the back of the eye of animals with
  backbones, which light breaks down into a paler stuff
scope: Not the red of blood, and not the dark stuff that fills the eye; also called rhodopsin and visual
  purple.
examples:
- Retinal purple lets the eye see in dim light.
- Light breaks down retinal purple as you look.
