simpleMeaning: The seventh midweek day before Easter, the first day of Lent, the day after Mardi Gras,
  or Fat Tuesday, a day of fasting and repentance
scope: The seventh midweek day before Easter, the first day of Lent, the day after Mardi Gras, or Fat
  Tuesday, a day of fasting and repentance, unlike Good Friday and Palm Sunday, which fall in Holy Week.
examples:
- Ash Wednesday begins the season of Lent.
- Many people fast on Ash Wednesday.
