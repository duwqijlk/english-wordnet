simpleMeaning: A bent piece, often fixed under a shelf, for hanging drinking vessels.
scope: A small hook under a shelf for hanging cups, not a coat hook and not a shelf bracket.
examples:
- She hung the mug on a cup hook under the shelf.
- The cup hook held her favourite mug.
