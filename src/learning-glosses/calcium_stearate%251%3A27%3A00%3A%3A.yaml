senseId: 'calcium_stearate%1:27:00::'
synsetId: 14814429-n
simpleMeaning: A calcium salt of the fatty acids stearic and palmitic; it does not dissolve in water and
  forms the scum left by soap in hard-water areas.
scope: Another name for calcium octadecanoate; it is the hard-water soap scum, not a fatty acid or a food
  additive.
examples:
- A white deposit of calcium stearate coated the shower screen.
- The scum that hard water leaves in a bath is largely calcium stearate.
