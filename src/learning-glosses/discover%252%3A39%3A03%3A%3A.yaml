simpleMeaning: to see with your own eyes that something is there or is true.
scope: Spotting that something is present by looking — find, notice and detect are other names for it
  — not making a new finding or coming across something unexpectedly.
examples:
- She discovered a leak under the sink.
- The doctor discovered a small lump during the examination.
