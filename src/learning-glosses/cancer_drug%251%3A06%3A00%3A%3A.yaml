simpleMeaning: In chemotherapy, one of several medicines holds back or kills growing sick cells, though
  all can bring on feeling sick, throwing up, hair loss, and bone marrow working less well.
scope: One of several medicines used to hold back or kill growing sick cells, also called antineoplastic
  and antineoplastic drug, and all of them can bring on bad side effects.
examples:
- The cancer drug held back the growth of the sick cells.
- After the cancer drug, she felt sick and lost some hair.
