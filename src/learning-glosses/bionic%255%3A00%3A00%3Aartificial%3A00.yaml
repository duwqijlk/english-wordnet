senseId: bionic%5:00:00:artificial:00
synsetId: 01576402-s
simpleMeaning: having some jobs of the body made stronger by electric parts or by machine parts that use
  electricity, or having those jobs done by such parts
scope: This sense is about a body part or body job helped or taken over by a machine; it is not the sense
  about the field that makes such parts.
examples:
- His bionic arm can lift much more than a normal arm.
- She walks with a bionic leg that is run by a small computer.
