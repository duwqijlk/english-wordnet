senseId: 'swag%2:38:00::'
synsetId: 01880427-v
simpleMeaning: To move from side to side, heavily and without steadiness.
scope: To sway heavily and unsteadily, not goods or money taken by breaking the law, not a bundle of a
  traveller's belongings, not a thing drooping, sinking, or settling from pressure or from going slack,
  and not the verb use for walking as if one cannot control one's steps.
examples:
- The loaded cart began to swag from side to side on the rough track.
- The rope bridge would swag under the weight of the walkers.
