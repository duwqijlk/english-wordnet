simpleMeaning: the act of ending someone's job, so that they are free to leave
scope: Also called release, sack, discharge, and dismissal, this is the ending of a person's job; it is
  not the shooting of guns at an enemy.
examples:
- The firing of three workers shocked the whole office.
- After his firing, he packed his desk and left the building.
