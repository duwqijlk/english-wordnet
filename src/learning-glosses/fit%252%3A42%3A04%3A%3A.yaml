simpleMeaning: To match or agree with something, so that the details are alike or work together.
scope: This is the sense of details agreeing or matching, not the adjective for meeting standards, not
  the adjective for being ready or inclined, not the adjective for being healthy, not the noun for a burst
  of bad temper, not the noun for a sudden attack that cannot be controlled, not the noun for how well
  a garment's shape suits, not the noun for a short burst of activity, not the verb sense for being acceptable
  to someone, not the verb sense for being the right size or shape, not the verb sense for making something
  the right size, not the verb sense for putting several things or people into a space, not the verb sense
  for following a particular shape or size, not the verb sense for supplying something for a purpose,
  not the verb sense for meeting a need or condition, and not the verb sense for bringing things into
  harmony.
examples:
- The witness's account does not fit the evidence found at the scene.
- His story fits what the other witnesses described.
