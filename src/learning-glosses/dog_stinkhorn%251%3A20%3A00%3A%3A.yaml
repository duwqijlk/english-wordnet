simpleMeaning: A foul-smelling fungus with a bare stalk and no cap, its slimy spore stuff spread on the
  stalk near the top where flying insects can reach it
scope: A foul-smelling fungus with a bare stalk, not a fungus with a cap.
examples:
- A dog stinkhorn grew beside the old log.
- The dog stinkhorn smelt so bad the flies crowded round it.
