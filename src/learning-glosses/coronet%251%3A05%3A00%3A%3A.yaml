simpleMeaning: the thin band around a horse's foot where the skin of the lower leg joins the hard outer
  wall of the hoof
scope: This is the thin band on a horse's foot where skin joins the hoof. It is not the small crown a
  person wears to show high rank.
examples:
- The vet cleaned dirt from the horse's coronet before checking its hoof.
- A cut on the coronet can make the horse walk with pain.
