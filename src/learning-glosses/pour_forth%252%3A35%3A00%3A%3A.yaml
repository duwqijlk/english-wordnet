simpleMeaning: to let something come out drop by drop, in small amounts, or in a way that is like drops
scope: Also called spill and shed, this is to let something come out in drops or small amounts, not to
  let it flow out in a fast stream and not to throw it out all at once.
examples:
- Tears poured forth from her eyes as she read the sad news.
- Blood poured forth from the cut in small drops.
