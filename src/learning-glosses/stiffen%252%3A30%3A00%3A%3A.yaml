simpleMeaning: to become hard to bend or move, or harder to bend or move than before
scope: Becoming hard to bend or move on its own, not making something else do so, and not limiting something
  tightly.
examples:
- His body stiffened when he heard the sudden noise.
- The wet cloth stiffened in the cold air.
