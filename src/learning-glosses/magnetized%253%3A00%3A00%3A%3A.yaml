simpleMeaning: having the power to pull iron or steel towards itself
scope: 'Also called magnetic: this describes something that can pull iron or steel to itself, not a thing
  that is just made of iron or steel.'
examples:
- The magnetized bar picked up the small steel pins.
- A magnetized screwdriver holds tiny iron screws in place.
