simpleMeaning: a holy word or phrase in Sanskrit, from the old Indian faith of Vedism, one of a set of
  poems passed on by speaking
scope: A holy word or phrase from the old Indian hymns, not the common repeated saying sense and not a
  prayer in general.
examples:
- The priest chanted a mantra from the ancient hymns.
- Each mantra in the collection was passed down by word of mouth.
