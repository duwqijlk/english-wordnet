simpleMeaning: A tree of the south-east of the United States and Mexico that loses its leaves in winter
scope: This is a tree that loses its leaves each year; black haw, chittamwood, chittimwood, false buckthorn
  and shittimwood are other names for this sense, not an evergreen tree and not a tree of the north of
  the United States.
examples:
- The Bumelia lanuginosa in the yard drops all its leaves each fall.
- Bumelia lanuginosa grows in the warm south-east of the United States and in Mexico.
