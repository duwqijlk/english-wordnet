simpleMeaning: A heart drug, sold as Enkaid, used to treat life-threatening heart rhythm faults, though
  it raises the risk of sudden death after a heart attack
scope: This is a heart drug sold as Enkaid used to treat life-threatening heart rhythm faults, though
  it raises the risk of sudden death after a heart attack, not a drug for mild rhythm faults and not a
  drug that lowers that risk.
examples:
- The doctor prescribed encainide for her life-threatening rhythm fault.
- Encainide raised the risk of sudden death in heart attack patients.
