simpleMeaning: A plant native mainly to tropical and southern Africa, with one-sided spikes of bright,
  trumpet-like blooms and narrow, pointed leaves; widely planted in gardens.
scope: The tall African garden flower also known as sword lily; not the breastbone's central part, the
  unrelated anatomical sense of the same name.
examples:
- Gladiolus corms planted in spring send up tall spikes of flowers by midsummer.
- A single gladiolus in a vase opened its lowest flowers first, then worked upward.
