simpleMeaning: The main feeling cord of the face and the moving cord for the muscles that chew.
scope: The main feeling cord of the face and the moving cord for chewing, also called fifth cranial nerve,
  trigeminal, trigeminal nerve and trigeminus; not the cord that moves the eye and not the cord of the
  tongue.
examples:
- Pain along the nervus trigeminus spread across her face.
- The nervus trigeminus also drives the muscles that chew food.
