simpleMeaning: A birth flaw, not rare, where a spine bone grows wrong, with few signs unless many spine
  bones hurt or the cord sac bulges out, found by testing womb fluid.
scope: This sense is also called rachischisis and schistorrhachis.
examples:
- Spina bifida is a birth flaw.
- A spina bifida was found by testing womb fluid.
