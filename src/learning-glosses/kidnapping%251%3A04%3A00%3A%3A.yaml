simpleMeaning: In law, the unlawful act of seizing a person, carrying them off against their will, and
  holding them locked up
scope: This is the crime of taking and holding a person against their will, also called a snatch, not
  a lawful arrest.
examples:
- The kidnapping took place outside the school gates.
- Police charged the men with kidnapping after the child was found.
