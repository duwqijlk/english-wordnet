simpleMeaning: Thick round roots and blooms of many colours mark these cross-bred kinds of a flowering
  plant, one of many such kinds.
scope: This is one kind among many cross-bred begonias, each with thick round roots and blooms of many
  colours.
examples:
- The hybrid tuberous begonia opened red blooms in June.
- She potted a hybrid tuberous begonia for the window.
