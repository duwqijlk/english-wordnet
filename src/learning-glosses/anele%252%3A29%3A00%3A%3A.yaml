simpleMeaning: to put oil or a soft cream on someone, often as part of a holy act that asks for God's
  blessing
scope: 'Anoint, embrocate, inunct and oil are other names for this sense: to put oil or cream on a person
  in a holy act, not to rub oil into skin just to make it soft.'
examples:
- The priest aneled the sick man with oil during the service.
- She aneled the child's forehead before the blessing.
