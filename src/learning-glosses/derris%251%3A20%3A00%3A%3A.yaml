simpleMeaning: Any of several tropical Asian climbing plants, usually woody, whose roots yield a natural
  insect-killer; some kinds also serve as traditional fish and arrow poisons.
scope: A tropical climbing plant whose roots are poisonous, not the insecticide extracted from them.
examples:
- Derris root is used to make a natural insecticide.
- Fishermen once used derris to stun fish in the river.
