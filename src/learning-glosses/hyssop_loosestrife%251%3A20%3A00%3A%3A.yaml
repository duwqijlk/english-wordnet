simpleMeaning: Wet places far from Europe now widely hold this one-year plant, whose small pink flowers
  stand one by one.
scope: This one-year plant is also called grass poly, and it grows widely in wet places far from Europe,
  with small pink flowers that stand one by one.
examples:
- Hyssop loosestrife grows in wet places far from Europe.
- The small pink flowers of hyssop loosestrife grow one by one.
