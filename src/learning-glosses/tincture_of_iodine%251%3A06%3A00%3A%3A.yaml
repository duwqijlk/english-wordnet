simpleMeaning: Put on the skin of a cut to keep germs out, a brown chemical mixed into pure alcohol.
scope: Also called iodine, this liquid is put on the skin of a cut, not swallowed as a drink.
examples:
- She put tincture of iodine on the cut on her knee.
- The nurse dabbed tincture of iodine on the small wound before the bandage.
