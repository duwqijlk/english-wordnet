simpleMeaning: The picture shown by electric signals on the wide front end of an old-style picture tube
scope: 'Also called a screen: the picture made by electric signals on the wide front end of a picture
  tube, not the tube itself and not a printed picture.'
examples:
- The CRT screen flickered when the old television warmed up.
- Words appeared on the CRT screen as the computer started.
