simpleMeaning: gluing together thick flat layers of hard wood with no paint makes a thick slab
scope: A thick slab made by gluing layers of hard wood together, not a thin board and not a painted one;
  butcher board is another name for this sense.
examples:
- He chopped meat on a butcher block in the kitchen.
- The butcher block was made of thick strips of hard wood.
