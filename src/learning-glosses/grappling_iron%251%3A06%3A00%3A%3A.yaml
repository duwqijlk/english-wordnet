simpleMeaning: A tool with several curved points used to catch and hold things, often thrown on the end
  of a rope
scope: This hooked tool is also called grapple, grapnel, grappler and grappling hook, and is not a single
  hook and not a rope on its own.
examples:
- The sailor cast the grappling iron over the wall.
- A grappling iron hung from a rope at the side of the ship.
