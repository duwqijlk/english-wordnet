simpleMeaning: A clever act that fools the eye and seems impossible to people who do not know how it is
  done
scope: A clever act that fools the eye and seems impossible to people who do not know how it is done;
  magic, trick, illusion, deception, thaumaturgy, conjuration, conjuring trick and legerdemain are other
  names for this sense.
examples:
- The magician's magic trick made the coin vanish from his hand.
- Children love a good magic trick at a birthday party.
