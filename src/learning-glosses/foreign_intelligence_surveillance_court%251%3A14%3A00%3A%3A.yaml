simpleMeaning: A secret federal panel set up under the 1978 spying law to approve wiretaps, other electronic
  spying, and searches of suspected spies and terrorists by Justice Department or spy agencies.
scope: Also called F.I.S.C.; a secret panel that approves spying, not the law that set it up.
examples:
- The Foreign Intelligence Surveillance Court approved the wiretap.
- The Foreign Intelligence Surveillance Court works in secret.
