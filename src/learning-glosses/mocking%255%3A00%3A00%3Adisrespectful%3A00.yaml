simpleMeaning: speaking in a cruel way to someone, showing no respect for them or laughing at them in
  a hurtful way
scope: This is cruel and full of no respect, in words, looks or laughs; it is not the playful, friendly
  teasing sense of the same word.
examples:
- His mocking voice made her feel small in front of the class.
- She gave a mocking laugh when he said he could win the race.
