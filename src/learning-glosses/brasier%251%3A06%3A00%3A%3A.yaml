simpleMeaning: A big metal container in which coal or charcoal is burnt to give heat to people who have
  to stay outside for a long time.
scope: A large metal container for burning coal or charcoal outside, not a fireplace and not a stove;
  brazier is another name for this sense.
examples:
- The workers warmed their hands over the brasier.
- A brasier stood by the door of the night watchman's hut.
