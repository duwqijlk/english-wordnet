simpleMeaning: A tall leafy European plant living two years or more, with striking clusters of large tube-shaped
  pink-purple flowers; its leaves give a drug and poison livestock.
scope: Also called common foxglove, fairy bell, finger-flower, finger-root, fingerflower and fingerroot;
  a tall European plant with tube-shaped pink-purple flowers, not a small garden flower and not a plant
  with edible leaves.
examples:
- Digitalis purpurea grew tall in the garden.
- The pink-purple flowers of Digitalis purpurea opened in June.
