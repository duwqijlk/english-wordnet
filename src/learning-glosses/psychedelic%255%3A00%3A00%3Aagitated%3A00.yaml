simpleMeaning: 'Of a state of mind: marked by very strong, wrong seeing and hearing, seeing things that
  are not there, great joy, or sometimes a feeling of no hope'
scope: This describes a state of mind with changed seeing and hearing, not a drug that brings on such
  a state and not bright colors and strange patterns.
examples:
- After taking the drug, he was in a psychedelic state and saw the walls moving.
- She described a psychedelic state of great joy in which sounds seemed to have colors.
