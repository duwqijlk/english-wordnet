simpleMeaning: to settle in one place and live a steady life there
scope: 'Also called settle: this is making a lasting home in one place, not the part of a plant and not
  the part of a tooth or hair.'
examples:
- After years of travel, they finally rooted in a small town.
- He travelled for years before he finally rooted in one village and stayed.
