simpleMeaning: A way of thinking that is slow to trust people and quick to think they have done wrong
scope: A habit of mind that expects wrongdoing, not a feeling that something is true and not a guess about
  what is to come.
examples:
- His suspicion of the new clerk showed in every question he asked.
- Years of suspicion had made her slow to trust anyone.
