senseId: apart%5:00:00:unconnected:00
synsetId: 00570124-s
simpleMeaning: far away and cut off, either in physical distance or in social contact
scope: This describes people or places that are set off at a distance or not mixing with others, not things
  that have broken into pieces and not 'apart from' meaning except.
examples:
- The remote farm is a place apart, with no neighbours for miles.
- Since the quarrel, the brothers have remained apart.
