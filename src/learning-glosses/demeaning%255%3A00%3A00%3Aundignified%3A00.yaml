simpleMeaning: making a person see their own faults and weak points
scope: 'Also called humiliating, mortifying and humbling: making you see your own faults, not just rude
  or unkind in a general way.'
examples:
- Losing to a complete beginner was a demeaning lesson that showed him his faults.
- The hard test was demeaning, because it made her see how much she still had to learn.
