simpleMeaning: in some languages where nouns take endings, the form of a noun used when speaking to the
  person or thing it names
scope: 'Also called the vocative case: the form of a noun used when speaking to the person or thing named,
  not the form used for the subject of a sentence and not the form used for the thing acted on.'
examples:
- In Latin, the vocative is used when you call someone by name.
- She used the vocative to address the teacher directly.
