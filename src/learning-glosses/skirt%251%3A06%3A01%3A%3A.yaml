simpleMeaning: the cloth part of a dress or other clothing that is below the waist and covers the body
  there
scope: The lower part below the waist of a dress or other clothing, not a whole piece of clothing worn
  on its own, and not the verb use that means to avoid something.
examples:
- The skirt of her dress was torn at the back.
- He held the wet skirt of his coat away from the fire.
