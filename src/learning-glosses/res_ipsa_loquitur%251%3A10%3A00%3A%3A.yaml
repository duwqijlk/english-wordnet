senseId: 'res_ipsa_loquitur%1:10:00::'
synsetId: 06667536-n
simpleMeaning: 'In law, a rule about proof: the carelessness of a person said to have done wrong can be
  taken as shown by the fact that the accident happened'
scope: In law, a rule about proof after an accident, not a finding that someone is guilty and not a rule
  about paying for harm.
examples:
- The lawyer argued res ipsa loquitur after the goods fell from the shelf.
- Res ipsa loquitur was used to show that the accident could only have come from carelessness.
