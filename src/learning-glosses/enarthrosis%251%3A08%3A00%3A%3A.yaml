simpleMeaning: Two bones meet here and move freely, the ball on the end of one fitting into the round
  hollow in the other
scope: Also called articulatio spheroidea, ball-and-socket joint, cotyloid joint, enarthrodial joint,
  and spheroid joint, this joint lets two bones move freely, with a ball in a round hollow.
examples:
- Her hip's enarthrosis let her leg swing in every way.
- The enarthrosis moved freely as he raised his arm.
