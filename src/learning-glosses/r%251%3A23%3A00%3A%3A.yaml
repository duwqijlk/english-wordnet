simpleMeaning: a unit to count how much unseen beams hit a thing, set by 1 small charge made in 1 small
  bit of dry air
scope: This is the unit to count how much unseen beams hit a thing, not the set value in the gas law or
  the 18th letter, and it is also called roentgen.
examples:
- The dose was measured in R.
- R counts how much radiation a body takes in.
