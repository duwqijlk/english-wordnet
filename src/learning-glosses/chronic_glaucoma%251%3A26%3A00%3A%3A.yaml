simpleMeaning: Taking away side sight bit by bit, this long-lasting sickness of the eye comes when a tube
  in the eye is blocked
scope: This long-lasting sickness of the eye comes when a tube in the eye is blocked and takes away side
  sight bit by bit; also called open-angle glaucoma, not a sickness that takes sight away all at once.
examples:
- Chronic glaucoma took away her side sight bit by bit.
- His chronic glaucoma came from a blocked tube in his eye.
