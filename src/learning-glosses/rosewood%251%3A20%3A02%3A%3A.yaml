simpleMeaning: hard, dark, red-brown wood from this kind of tree, with a clear pattern of lines in it,
  used for making cabinets and other furniture
scope: This is the hard wood used for making cabinets and furniture, not the tree it comes from and not
  a soft, pale wood.
examples:
- The desk was made of rosewood with dark lines running through it.
- He chose rosewood for the new cupboard doors.
