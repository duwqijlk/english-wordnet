simpleMeaning: A tall plant that lives for years, with bunches of white flowers, from the east of the
  United States
scope: A tall white-flowered plant of the east of the United States; frostweed is another name for this
  sense, not the yellow-flowered plant of the same name.
examples:
- Frost-weed grew tall along the fence.
- White frost-weed flowers showed in the field.
