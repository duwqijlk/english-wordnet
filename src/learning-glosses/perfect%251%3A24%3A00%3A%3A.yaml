senseId: 'perfect%1:24:00::'
synsetId: 13828352-n
simpleMeaning: a verb form used for actions that are finished, formed with 'have' and a past participle
  and also called the perfective aspect.
scope: Not meaning faultless and not the verb meaning to improve something; here it is the grammar term
  for a tense of completed actions.
examples:
- In 'She has left', 'has left' is the present perfect.
- Students often find the perfect tense difficult.
