simpleMeaning: In logic, a sentence that says a thing is so or is not so, and that must be either true
  or false
scope: In logic, a claim that is either true or false, not a proposal put forward for people to accept
  or turn down.
examples:
- In logic, the proposition 'all cats are animals' is true.
- The teacher asked whether the proposition was true or false.
