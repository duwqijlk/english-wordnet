simpleMeaning: A fungus with a brown puffed-up spore-bearing part, a rosy pink grooved stalk, and smooth
  round spores, found on cut hardwood east of the Great Plains.
scope: Also called round-spored gyromitra; a fungus with a brown puffed-up fertile part, found on cut
  hardwood in the east, not a common field mushroom.
examples:
- Gyromitra sphaerospora grew on the hardwood slash.
- We found Gyromitra sphaerospora east of the plains.
