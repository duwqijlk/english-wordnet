simpleMeaning: A plant of tropical America with divided leaves that are light yellow underneath.
scope: A tropical American plant with divided leaves pale yellow underneath, not the stout swamp fern
  with yellow spore cases underneath and not a palm.
examples:
- The golden fern grew thick along the forest path.
- Under the golden fern's leaves, the undersides shone light yellow.
