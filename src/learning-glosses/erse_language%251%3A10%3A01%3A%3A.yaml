simpleMeaning: One of a set of related tongues spoken by the Celts in Ireland and Scotland
scope: This is one of a set of related tongues spoken by the Celts in Ireland and Scotland; Erse, Gaelic,
  Gaelic language, Goidelic and Goidelic language are other names for this sense, and its nearest rivals
  are Welsh and Breton.
examples:
- Erse language is one of the Celtic tongues.
- The Erse language was spoken in Ireland and Scotland.
