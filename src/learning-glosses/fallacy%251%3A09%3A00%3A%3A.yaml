simpleMeaning: A belief that is not true because it comes from thinking in a wrong way
scope: This is a wrong idea that comes from bad thinking, not a lie told on purpose and not a plain mistake
  about a fact.
examples:
- It is a fallacy to think that more money always means more happiness.
- The teacher showed why that argument was a fallacy.
