simpleMeaning: Said on its own to a man as a word of respect, never put before his name, this Italian
  word means the same as the English ‘sir’.
scope: An Italian word of respect for a man, the same as the English ‘sir’ and said on its own, not put
  before a name as 'mister' is.
examples:
- ‘Buongiorno, signore,’ the waiter said as he showed us to a table.
- He was always addressed as signore, never by his first name.
