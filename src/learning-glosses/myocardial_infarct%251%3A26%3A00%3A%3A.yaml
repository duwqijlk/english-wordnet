senseId: 'myocardial_infarct%1:26:00::'
synsetId: 14136503-n
simpleMeaning: Death of heart tissue when the blood flow to the heart muscle is blocked.
scope: Death of heart tissue from blocked blood flow; myocardial infarction is another name for this,
  and it is not a weak heart or a blocked lung.
examples:
- He had a myocardial infarct last year.
- A myocardial infarct kills part of the heart muscle.
