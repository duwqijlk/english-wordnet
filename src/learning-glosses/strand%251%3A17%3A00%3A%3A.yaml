simpleMeaning: A word poets use for the shore, the land by the sea that the sea covers and leaves bare
  again and again as the tide moves in and out
scope: A poetic word for the shore, not a thread or a necklace and not a pattern in a larger whole.
examples:
- The strand lay bare at low tide.
- Poets wrote of ships wrecked on the strand.
