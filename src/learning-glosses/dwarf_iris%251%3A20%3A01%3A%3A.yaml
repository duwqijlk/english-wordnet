simpleMeaning: a low plant that flowers in spring in America, with bright blue-purple flowers
scope: A low plant that flowers in spring in America, also called the vernal iris; not a tall garden plant
  with yellow flowers and not a wild plant that flowers in summer.
examples:
- The dwarf iris opened its blue flowers in April.
- Dwarf iris grows low among the rocks.
