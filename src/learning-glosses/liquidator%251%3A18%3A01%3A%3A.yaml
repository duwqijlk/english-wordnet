simpleMeaning: A criminal who kills another person on purpose, after planning the killing ahead of time
scope: 'Also called a murderer and a manslayer: a criminal who kills on purpose after planning it, not
  a court-named person who sells or keeps safe what a person or company owns.'
examples:
- The police believed a liquidator had been paid to kill the witness.
- In the story, the liquidator planned the killing for weeks.
