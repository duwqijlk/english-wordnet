simpleMeaning: An organ or body part grown far too big because the cells in it have grown bigger
scope: An organ or body part grown far too big, also called enlarged; not a part swollen by fluid and
  not a part grown big by new cells.
examples:
- The scan showed a hypertrophied heart muscle.
- The hypertrophied liver pressed against his ribs.
