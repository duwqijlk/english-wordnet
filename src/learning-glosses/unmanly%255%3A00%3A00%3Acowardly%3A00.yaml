simpleMeaning: not brave, not strong, and not firm in what you decide, and too afraid in a way people
  look down on
scope: 'Also called pusillanimous and poor-spirited: this sense means too afraid and not brave, not just
  not having the qualities people expect of a man.'
examples:
- The soldiers called him unmanly because he ran away in fear.
- He felt unmanly for running away when his friends needed help.
