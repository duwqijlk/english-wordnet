simpleMeaning: A bird from west Africa with dark feathers marked with white spots; it comes from Africa
  but is raised for food in many parts of the world.
scope: Also called guinea and guinea fowl; a bird from west Africa with dark feathers marked with white,
  raised for food in many parts of the world, not a chicken and not a pheasant.
examples:
- Numida meleagris is raised for food in many countries.
- The dark feathers of Numida meleagris are spotted with white.
