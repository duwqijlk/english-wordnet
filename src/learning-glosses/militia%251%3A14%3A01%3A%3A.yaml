simpleMeaning: All the ordinary people in a country who are fit and may by law be called to serve as soldiers
scope: Ordinary people who may by law be called to serve, not a trained standing army and not a small
  band of fighters.
examples:
- Congress shall have power to provide for calling forth the militia.
- Their troops were untrained militia, not regular soldiers.
