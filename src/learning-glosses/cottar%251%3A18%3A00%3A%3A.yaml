simpleMeaning: a poor farmer who works the land in the hills of Scotland
scope: A poor farmer in the hills of Scotland, also called a cotter; not a farm owner and not a fastener
  that holds parts together.
examples:
- The cottar worked a small piece of land in the Highlands.
- A cottar and his family lived in a stone house on the hill.
