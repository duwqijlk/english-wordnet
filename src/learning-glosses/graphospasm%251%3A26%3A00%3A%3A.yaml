simpleMeaning: Tight cramps in the thumb and first finger that come on while a person writes with a pen
  or pencil
scope: This writing cramp is also called writer's cramp, and is not a general hand injury and not a shaking
  hand.
examples:
- Graphospasm made it hard for him to finish the letter.
- After an hour of writing, graphospasm cramped her thumb and finger.
