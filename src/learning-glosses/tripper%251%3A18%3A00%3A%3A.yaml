simpleMeaning: A traveller out to see the sights.
scope: A traveller out to see the sights; also called sightseer, excursionist, or rubberneck; not a walker
  or runner who trips and nearly falls, nor one who has taken a drug that makes them see things, nor a
  catch that works as a switch.
examples:
- Their tripper took photos all day.
- The tripper asked the way to the castle.
