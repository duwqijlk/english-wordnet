simpleMeaning: the process by which something goes bad and loses its good quality
scope: 'Also called spoilage: the process of something going bad, not the act of damaging something and
  making it bad.'
examples:
- Warm weather speeds up the spoiling of milk.
- They threw the meat out because spoiling had made it unsafe to eat.
