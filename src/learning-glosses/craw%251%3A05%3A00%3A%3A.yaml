simpleMeaning: a small bag-like part in many birds and some lower animals, like a stomach, where food
  is kept and first softened
scope: This body part is also called crop. It is a first food bag in a bird or other animal, not the main
  stomach itself.
examples:
- The bird's craw was full of seeds after it ate.
- You can feel the grain in the chicken's craw.
