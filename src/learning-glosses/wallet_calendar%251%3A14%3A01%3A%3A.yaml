simpleMeaning: From a plain plastic card to a booklet or a notebook, this small list of the days of the
  year fits in a pocket or a money case.
scope: Also called a pocket calendar and a pocket planner, this is the small list of the days of the year
  that fits in a pocket or a money case.
examples:
- Each morning the wallet calendar is checked to see the days of the month.
- The wallet calendar fits in a pocket and is looked at each morning.
