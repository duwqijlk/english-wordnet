simpleMeaning: in a state where you cannot think clearly and you answer or act slowly, as after hits,
  too much drink, or being very tired
scope: 'Also called foggy: in a state where you answer or act slowly after hits, too much drink, or being
  very tired. Not the sense of having no clear feeling in the mind after a shock.'
examples:
- After the fall, he looked dazed and was slow to answer.
- She felt dazed after working all night with no sleep.
