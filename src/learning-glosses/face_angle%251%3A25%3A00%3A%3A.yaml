simpleMeaning: the corner made where two edges of a solid with flat sides meet
scope: A corner made where two edges of a solid with flat sides meet, not a corner in a flat shape and
  not the whole solid.
examples:
- Each face angle of the cube is the corner where two of its edges meet.
- The students measured a face angle where two edges of the pyramid came together.
