simpleMeaning: a metal or plastic tip that covers the end of a shoelace or ribbon
scope: A metal or plastic tip over the end of a shoelace or ribbon, also called an aglet; not a cord worn
  on a uniform shoulder and not the lace itself.
examples:
- The aiglet on his shoelace had come loose.
- She slipped a new aiglet over the end of the ribbon.
