simpleMeaning: soil germs taking in a gas from the air and giving it out for plants to use when the germs
  die
scope: Soil germs taking in a gas from the air and giving it out for plants when they die; not the making
  of man-made fertilizer and not the decay of dead plants.
examples:
- Nitrogen fixation helps beans grow without added fertilizer.
- Farmers count on nitrogen fixation to feed their crops.
