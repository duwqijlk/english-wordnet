simpleMeaning: using set forms of art and set ways of doing art to make an effect; not natural and not
  done without a plan
scope: This describes something made with set art forms for effect, not something natural, real-looking,
  or done freely without a plan.
examples:
- The play used stylized movements that looked like a slow dance.
- Her drawings show stylized trees with round tops and straight lines.
