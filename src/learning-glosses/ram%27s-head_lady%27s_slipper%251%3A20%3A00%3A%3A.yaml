simpleMeaning: The lip of this northern North American orchid is red-and-white and looks like the face
  of a male sheep, set against a brownish-green bloom.
scope: It is also called a ram's-head, and its brownish-green bloom has a red-and-white lip that looks
  like the face of a male sheep.
examples:
- The ram's-head lady's slipper showed a red-and-white lip against a brownish-green bloom.
- In northern North America, the ram's-head lady's slipper blooms with a lip like the face of a male sheep.
