simpleMeaning: a solid shape with a four-sided flat bottom and four three-sided faces that meet at one
  top point
scope: A solid shape with a four-sided base and four three-sided faces, not a shape with a round base
  and not a flat drawing.
examples:
- The Great Pyramid of Giza is a square pyramid.
- The toy was shaped like a square pyramid.
