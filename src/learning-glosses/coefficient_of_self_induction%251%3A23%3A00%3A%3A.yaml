simpleMeaning: Measured in henries, this number in physics tells how much push arises inside a circuit
  when its flow changes, set against how fast the flow changes.
scope: Also called self-inductance, it is a number in physics, given in henries.
examples:
- The coefficient of self induction of the coil was measured in henries.
- They worked out the coefficient of self induction for the circuit.
