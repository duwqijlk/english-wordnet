simpleMeaning: Sweet-smelling yellow flowers, used to make perfume, grow on this thorny shrub or small
  tree from warm lands in America.
scope: Also called cassie, huisache, mimosa bush, scented wattle, sweet acacia, or sweet wattle, this
  thorny shrub or small tree from warm lands in America bears sweet-smelling yellow flowers used to make
  perfume, not the south Australian tree with scarlet flowers.
examples:
- The flame tree by the road was covered in sweet-smelling yellow flowers.
- They planted a flame tree in the yard for its yellow flowers.
