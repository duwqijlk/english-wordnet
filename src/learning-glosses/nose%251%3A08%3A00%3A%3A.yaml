simpleMeaning: The part of the face that stands out in people and other mammals, through which air passes
  and scents are sensed.
scope: This is the facial body part used for breathing and smelling, not the spout of a container and
  not the front of an aircraft.
examples:
- She rubbed her nose, which was sore from the cold.
- The dog pressed its nose against the glass.
