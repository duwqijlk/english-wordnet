simpleMeaning: It says that something may be even more, better, or sooner than what was just said
scope: A word that leaves open that something may be even more, better, or sooner than was said; not the
  'if' of a condition and not a plain guess with no comparison.
examples:
- The walk will take an hour, if not longer.
- He is clever, if not the cleverest in the class.
