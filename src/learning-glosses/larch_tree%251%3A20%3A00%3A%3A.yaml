simpleMeaning: Any of many cone-bearing plants of the genus Larix, all with needle-like leaves that fall
  in winter
scope: This is any of many cone-bearing plants of the genus Larix, all with needle-like leaves that fall
  in winter, also called larch, not an evergreen pine and not a broad-leaf tree.
examples:
- The larch tree turned gold before it shed its needles.
- Larch trees grow tall in the cold northern forests.
