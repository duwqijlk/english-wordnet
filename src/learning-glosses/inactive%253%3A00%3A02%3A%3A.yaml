synsetId: 00037870-a
simpleMeaning: In pathology, not getting worse or bigger, or getting worse only very slowly
scope: In pathology, this is about a sickness that is not getting worse, or is getting worse only slowly.
  It is not the sense for a quiet volcano, for a substance in chemistry that does not react, or for a
  person or thing that is idle and unused.
examples:
- The disease is inactive and has not grown for months.
- The infection stayed inactive for years, with almost no change.
