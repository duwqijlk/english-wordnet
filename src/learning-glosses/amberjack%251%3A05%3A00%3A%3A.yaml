simpleMeaning: Sides that run from gold-brown to the colour of copper mark this warm-sea fish of one family,
  its tail split in two.
scope: The name amberfish means the same fish.
examples:
- The line caught an amberjack, a warm-sea fish with a tail split in two.
- In warm seas, amberjack swim with sides gold-brown to the colour of copper.
