simpleMeaning: To keep the pressure at one set level.
scope: To keep the pressure at one set level, not to raise it on a gas or a liquid, and not to raise it
  inside a place or a thing.
examples:
- The airplane cabin is pressurized for the flight.
- They pressurize the space suit before the walk.
