senseId: 'unburdened%3:00:00::'
synsetId: 00873611-a
simpleMeaning: free from hard problems and from jobs you must take care of
scope: This means free from hard problems or duties, not free from carrying a heavy load in your hands
  or on your back.
examples:
- Now that the court case is over, he lives an unburdened life with no hard problems to deal with.
- She felt unburdened when she left the job and its many duties behind.
