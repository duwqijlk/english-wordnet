simpleMeaning: In physics, the view that space and time change with the watcher, and are not fixed for
  all.
scope: Also called relativity, relativity theory and theory of relativity; in physics, it says space and
  time are not fixed for all, not the wider view that also covers gravity.
examples:
- Einstein's theory of relativity says time runs slower for a fast traveller.
- He explained Einstein's theory of relativity to the class.
