simpleMeaning: Living things that feed on other living things or on dead matter, found mostly in fresh
  liquid or damp earth.
scope: Living things that feed on other living things or on dead matter; not a plant and not a land animal.
examples:
- Water mold lives in fresh liquid and damp earth.
- The water mold fed on dead matter in the pond.
