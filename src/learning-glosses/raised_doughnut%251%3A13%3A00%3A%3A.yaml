simpleMeaning: A cake made soft and full of air with a substance that makes bread rise, and not with a
  powder that makes cakes rise
scope: This is a cake made soft and full of air with a substance that makes bread rise, not one made with
  a powder that makes cakes rise and not a flat cake.
examples:
- She bought a raised doughnut for breakfast.
- The baker makes a raised doughnut with yeast, not baking powder.
