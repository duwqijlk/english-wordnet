simpleMeaning: the upright wall in the shape of a triangle, at the end of a building, between the two
  sloping sides of the roof
scope: Also called gable end and gable wall; this is the upright three-sided wall at a roof end, not the
  roof itself and not a flat side wall.
examples:
- The house has a white gable with a small round window.
- They painted the gable at the front of the building blue.
