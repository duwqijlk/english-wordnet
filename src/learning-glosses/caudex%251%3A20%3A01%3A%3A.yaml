simpleMeaning: the woody stem of a palm or a tree fern
scope: The woody stem of a palm or a tree fern, not the thick stem of a soft plant and not a tree trunk.
examples:
- The caudex of the old palm rose straight above the garden wall.
- Tree ferns grow from a thick caudex that holds their fronds up.
