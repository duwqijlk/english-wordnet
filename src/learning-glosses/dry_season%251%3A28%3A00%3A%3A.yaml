simpleMeaning: one of the two yearly periods in hot countries, a time of year with little rain in the
  tropics
scope: One of the two yearly periods in hot countries, a time with little rain; not the rainy period and
  not a cold winter.
examples:
- During the dry season the river shrank to a trickle.
- Farmers plant their crops before the dry season ends.
