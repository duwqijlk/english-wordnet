simpleMeaning: a B vitamin that the body needs so its cells can grow and make new cells
scope: A B vitamin needed for cells to grow and make new cells, not another vitamin such as vitamin C
  or vitamin D.
examples:
- Leafy green vegetables are a good source of folate.
- Doctors say pregnant women need enough folate for their babies to grow well.
