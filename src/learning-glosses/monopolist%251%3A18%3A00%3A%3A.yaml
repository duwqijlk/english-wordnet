simpleMeaning: A person who holds the whole supply of a thing, making or selling it alone.
scope: A person who alone makes or sells a thing, holding the whole supply of it.
examples:
- The monopolist set the price of coal in the whole valley.
- Once the monopolist bought the only mill, no one else could grind grain.
