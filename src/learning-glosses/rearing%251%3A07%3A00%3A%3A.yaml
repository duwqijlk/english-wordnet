simpleMeaning: what a person has become through the care and the treatment they got while growing up
scope: 'Also called raising, and another name for it is nurture: what a person has become through childhood
  care, not the act of standing up on the hind legs of a horse.'
examples:
- Her gentle rearing gave her patience with strangers.
- A strict rearing left him afraid to speak up.
