simpleMeaning: the hollow in the top of the shoulder blade that takes the top of the upper arm bone to
  make the shoulder joint
scope: The hollow in the top of the shoulder blade that takes the top of the upper arm bone; glenoid cavity
  is another name for this sense, not the hollow in the skull that takes the jaw and not a hip socket.
examples:
- The glenoid fossa holds the head of the arm bone.
- Damage to the glenoid fossa can weaken the shoulder.
