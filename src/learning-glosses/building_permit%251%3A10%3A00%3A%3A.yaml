simpleMeaning: a paper that gives the person who holds it leave to put up one kind of structure on one
  piece of land
scope: A paper that lets the holder put up one kind of structure on one piece of land, not a paper for
  buying land and not a paper for living in a house.
examples:
- He got a building permit before he started work on the house.
- The building permit says what kind of building may go on the lot.
