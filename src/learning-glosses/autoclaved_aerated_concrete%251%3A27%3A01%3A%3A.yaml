simpleMeaning: ready-made blocks of light concrete, first made in the mid-1920s, that at once hold a building
  up, keep heat in, and stand up to fire and mould
scope: Also called autoclaved cellular concrete, autoclaved concrete, autoclaved lightweight concrete,
  and porous concrete; light ready-made blocks for building, not bricks and not poured concrete.
examples:
- The builders used autoclaved aerated concrete for the walls of the new school.
- Autoclaved aerated concrete keeps the house warm in winter.
