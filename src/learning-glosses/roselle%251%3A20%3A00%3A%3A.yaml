senseId: 'roselle%1:20:00::'
synsetId: 12200149-n
simpleMeaning: A sparsely prickly East Indian plant, an annual herb or a long-lived low shrub, widely
  grown for fleshy flower cups, used in tarts and jelly, and for stem fibre.
scope: This is the hibiscus grown for its fleshy flower cups; red sorrel, rozelle and sorrel are other
  names for the same plant. It is not the weedy sorrel picked as a table green, nor the wood-sorrel of
  the genus Oxalis.
examples:
- Roselle is dried and brewed as a tart herbal tea.
- The roselle plants in her garden were covered in fleshy red cups.
