simpleMeaning: a rude, dirty thing said most often when a person is taken by surprise or feels angry
scope: 'Also called curse, cuss, expletive, oath, swearing and swearword: it is a rude thing said in surprise
  or anger, not a polite word and not a prayer or a promise.'
examples:
- He let out a curse word when he hit his thumb with the hammer.
- The teacher told us not to use a curse word in class.
