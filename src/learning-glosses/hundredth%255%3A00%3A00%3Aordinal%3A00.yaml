simpleMeaning: coming after the ninety-ninth in a line or list, in the place of the number one hundred
scope: The place after ninety-nine in counting order, not one part in a hundred of a thing.
examples:
- She finished hundredth in a race of a hundred runners.
- The hundredth page of the book was the last one.
