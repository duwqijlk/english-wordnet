senseId: 'gesture%1:10:00::'
synsetId: 06889359-n
simpleMeaning: Passing messages with familiar or agreed signals, chiefly made by moving the hands and
  body.
scope: 'Another name for motion here: message-carrying signals made with the body, not an expressive movement
  that goes with speech or an action meant to show intention.'
examples:
- He made a gesture with his hand to tell us to stop.
- The umpire's gesture signaled that the ball was out.
