simpleMeaning: The act of rising to an upright position or of remaining upright on the feet.
scope: This is the physical act, not the sports ranking table, not rank or reputation, and not a long-lasting
  arrangement.
examples:
- Long periods of standing can make your legs ache.
- The job requires standing for most of the day.
