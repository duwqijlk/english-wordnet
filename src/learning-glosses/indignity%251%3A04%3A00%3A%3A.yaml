simpleMeaning: an act or remark that hurts a person's sense of their own worth and the respect they should
  be given
scope: An act or remark that makes a person feel they are not respected; not a physical attack and not
  a plain mistake.
examples:
- Being made to beg for his own pay was an indignity he never forgot.
- She saw the public search as an indignity and left at once.
