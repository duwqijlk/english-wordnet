simpleMeaning: to use your mind to think hard and reach an answer, a choice, or a view about what is true
scope: 'Also called cogitate and think: to use your mind to reach an answer, a choice, or a view about
  what is true, not to dream and not to act without thinking.'
examples:
- She needed time to cerebrate before she gave her answer.
- He sat in silence to cerebrate over the hard problem.
