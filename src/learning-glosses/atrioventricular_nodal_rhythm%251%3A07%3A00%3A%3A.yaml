simpleMeaning: The usual beat of the heart when it is set by the small group of cells between its upper
  and lower chambers
scope: This is the usual beat of the heart when it is set by the small group of cells between its upper
  and lower chambers; nodal rhythm is another name for it, not a fast or uneven beat and not a beat set
  by a machine.
examples:
- Atrioventricular nodal rhythm is the heart's normal beat.
- The doctor said her atrioventricular nodal rhythm was steady.
