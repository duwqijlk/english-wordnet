senseId: sick%5:00:00:insane:00
synsetId: 02082451-s
simpleMeaning: A person who is sick in this sense is suffering from madness or serious mental illness.
scope: 'This is a dated, mainly literary use: it describes someone affected by madness, not simply unwell.
  The ordinary adjective sick means ill or nauseous, and ''insane'' or ''mentally ill'' is the usual modern
  word for this sense. It survives mostly in older writing and in phrases such as ''sick in mind''.'
examples:
- After the war he was sick in mind as well as in body.
- The novel follows the sick mind of a man who believes his family is plotting against him.
