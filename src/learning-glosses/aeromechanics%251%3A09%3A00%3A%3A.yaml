simpleMeaning: The study of how gases, above all air, move and how they push on things in their path.
scope: The study of how gases move and push on things in their path, also called aerodynamics; not the
  study of liquids in motion and not the study of things at rest.
examples:
- Aeromechanics explains why a wing lifts in moving air.
- He studied aeromechanics to design better wind tunnels.
