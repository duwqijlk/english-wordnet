simpleMeaning: The making up or changing of old stories and customs of a people, even using a tradition
  outside the way of life in which it began.
scope: The making up or changing of old stories and customs of a people, even using a tradition outside
  the way of life in which it began; not the old stories and customs themselves and not the study of them.
examples:
- Folklorism turned the old tale into a song for tourists.
- The writer's folklorism used a village tradition far from its home.
