simpleMeaning: a state of living for ever, without end, that some religions say marks life after death
scope: A state of living for ever after death, as some religions teach; eternity and timelessness are
  other names for this sense. Not a long life on earth, and not the afterlife as a place.
examples:
- Some faiths teach that the soul enters a timeless existence after death.
- In their belief, timeless existence begins when this life ends.
