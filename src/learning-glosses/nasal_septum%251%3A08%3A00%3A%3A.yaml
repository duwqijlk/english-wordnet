simpleMeaning: A wall of bone and gristle between the two hollow spaces of the nose.
scope: A wall of bone and gristle between the two hollow spaces of the nose, not the nose tip and not
  the bone of the skull.
examples:
- His nasal septum was bent.
- The nasal septum divides the two sides of the nose.
