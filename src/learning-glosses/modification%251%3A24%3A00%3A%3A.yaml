senseId: 'modification%1:24:00::'
synsetId: 13823013-n
simpleMeaning: In grammar, the link between a word and a phrase when the word adds detail to the meaning
  of the phrase
scope: This sense is also called limiting or qualifying. It is the grammar link described here, not making
  a change to something, not a change from one state to another, and not a slightly changed copy.
examples:
- In this sentence, the modification is shown by the word 'big' adding detail to 'house'.
- The teacher explained modification with a word that adds detail to a phrase.
