simpleMeaning: a shaking cold that comes first, then a high heat, a sign of malaria
scope: The shaking cold followed by high heat that marks malaria, also called ague; not a single cold
  from bad weather and not a fever on its own.
examples:
- Chills and fever came over him each evening.
- Her chills and fever were the first sign of malaria.
