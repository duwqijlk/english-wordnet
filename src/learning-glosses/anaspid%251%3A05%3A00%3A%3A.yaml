scope: This is a small long-dead freshwater fish with no jaws and a hard-shelled head, from the Silurian
  and Devonian ages, not a fish that lives today.
examples:
- The anaspid swam in fresh water long ago.
- An anaspid had no jaws and a hard-shelled head.
