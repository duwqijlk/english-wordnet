simpleMeaning: to wear or show something in a proud way that draws people's eyes to it
scope: 'Also called sport and feature: to wear or show something proudly so people notice it, not to talk
  proudly about what you have done.'
examples:
- At the dance, she boasted a bright new dress.
- He walked in boasting a new suit and a gold ring.
