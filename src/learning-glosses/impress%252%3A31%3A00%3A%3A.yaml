simpleMeaning: to put a clear and strong idea of something into a person's mind, or to try to do so
scope: To fix a clear idea in a person's mind, not to dye cloth before it is spun and not simply to win
  praise.
examples:
- She tried to impress the danger of the road on the children.
- The teacher impressed on us the need to read every day.
