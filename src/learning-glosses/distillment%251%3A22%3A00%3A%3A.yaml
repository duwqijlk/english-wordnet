simpleMeaning: the act of making a liquid pure by heating it till it turns to steam and then cooling the
  steam back to liquid
scope: The act of making a liquid pure by heating and cooling it, also called distillation; not the liquid
  that results and not simple filtering.
examples:
- Distillment gave them clean water from the sea.
- The distillment took all afternoon.
