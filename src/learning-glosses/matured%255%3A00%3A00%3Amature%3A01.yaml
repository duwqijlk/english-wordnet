simpleMeaning: of fruit, fully ready to eat; of a flower, fully open and at its best
scope: This describes fruit that is ready to eat or a flower that is fully open. It is not fruit that
  is still hard and sour, and not a flower bud that has not opened yet.
examples:
- The matured peaches were soft, sweet and ready to eat.
- A matured rose opened wide in the sun.
