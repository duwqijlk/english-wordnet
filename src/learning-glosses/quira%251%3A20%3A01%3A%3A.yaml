simpleMeaning: one of a group of trees that grow in the hot parts of the Americas, some of which give
  wood worth a lot of money
scope: One of a group of trees from the hot parts of the Americas, not a single kind of tree and not the
  wood itself.
examples:
- The quira trees shaded the small farm in the valley.
- The builders used quira because its wood was worth a lot of money.
