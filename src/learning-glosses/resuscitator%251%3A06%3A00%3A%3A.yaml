senseId: 'resuscitator%1:06:00::'
synsetId: 04089456-n
simpleMeaning: a tool that forces oxygen into the lungs of a person who cannot get air or has stopped
  breathing, to bring them back to life
scope: A breathing tool for bringing a person back, not a machine that keeps a patient breathing for days.
examples:
- The nurse used the resuscitator to force oxygen into the baby's lungs.
- They kept the resuscitator by the bed in case his breathing stopped.
