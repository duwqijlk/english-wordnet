senseId: 'carnassial_tooth%1:08:00::'
synsetId: 05291148-n
simpleMeaning: 'A meat-eating animal cuts flesh with these sharp-edged teeth: the last upper side tooth
  and the first lower grinding tooth.'
scope: The sharp-edged back teeth of a meat-eating animal, not the flat teeth used for grinding plants.
examples:
- The wolf's carnassial tooth sliced through the flesh.
- A carnassial tooth lets a meat-eating animal cut flesh.
