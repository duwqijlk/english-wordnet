simpleMeaning: a row of similar things, or several such rows set one above another
scope: This is not a financial institution, a river edge, or a tilt in flight; it is a line or stack of
  like objects.
examples:
- A bank of monitors filled the control room wall.
- The hall was fitted with banks of seating rising toward the back.
