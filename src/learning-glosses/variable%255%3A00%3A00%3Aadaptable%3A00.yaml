simpleMeaning: made so that a feature of a device, such as its light, can be changed
scope: Made so that a feature of a device, such as its light, can be changed, not a star that grows brighter
  and dimmer and not a thing that may change in general.
examples:
- The lamp has a variable brightness setting.
- He fitted a variable control to the fan so he could change its speed.
