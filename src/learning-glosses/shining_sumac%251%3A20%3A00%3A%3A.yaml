simpleMeaning: Red berries follow green flowers in loose bunches on this common eastern North American
  bush, which is not poisonous and has leaves made of many small leaflets.
scope: Black sumac, dwarf sumac, and mountain sumac are other names for this common eastern North American
  bush that is not poisonous.
examples:
- The shining sumac bore red berries after its green flowers.
- The leaves of the shining sumac are made of many small leaflets.
