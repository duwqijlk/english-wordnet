simpleMeaning: any of several plants of the Wolffia group that live in the wet, found all over the warm
  parts of the world
scope: A Wolffia plant that lives in the wet in warm lands, not a water lily and not a fern.
examples:
- Watermeal spread across the warm pond in a thin green layer.
- In warm lands, watermeal can cover a whole pond in a few weeks.
