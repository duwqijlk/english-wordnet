simpleMeaning: a cup of pastry filled with fruit or custard, with no top crust
scope: A cup of pastry filled with fruit or custard and with no top crust, not the small open fruit pie,
  not the sour taste, and not the woman who takes money for sex.
examples:
- She baked a tart with fresh strawberries.
- He ate a lemon tart after lunch.
