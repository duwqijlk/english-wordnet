simpleMeaning: A shrub of the coastal ranges of California and Baja California, with hairy branches and
  spikes of many mauve flowers; sometimes put in that genus.
scope: Not a garden mallow or a hollyhock; also called a chaparral mallow and Malacothamnus fasciculatus.
examples:
- Sphaeralcea fasciculata grows on the dry coastal hills.
- The Sphaeralcea fasciculata was covered in mauve flowers.
