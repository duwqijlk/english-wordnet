simpleMeaning: the changing of how fast the wave that carries a radio signal goes up and down
scope: The changing of how fast a radio wave goes up and down, not the changing of how strong it is and
  not the wave itself.
examples:
- Frequency modulation gives radio stations a clear sound.
- The station uses frequency modulation to send its shows.
