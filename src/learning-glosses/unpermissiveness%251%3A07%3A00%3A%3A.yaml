simpleMeaning: A lack of willingness to let things pass, with a wish to keep behaviour inside set limits.
scope: 'Also called restrictiveness: a lack of willingness to let things pass, not kindness and not a
  wish to punish.'
examples:
- Her unpermissiveness kept the children inside strict limits.
- The unpermissiveness of the new rules surprised the staff.
