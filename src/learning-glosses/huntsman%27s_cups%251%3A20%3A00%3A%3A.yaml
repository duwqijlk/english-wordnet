simpleMeaning: A low, long-lived bog plant with dark red flowers and broad-winged pitcher leaves in a
  flat ring, native to northeastern North America and now wild in Europe, especially Ireland.
scope: This is the whole low bog plant with dark red flowers and pitcher-shaped leaves, not the tall tropical
  pitcher plants of the jungle or the small sundews that share its bog habitat.
examples:
- Huntsman's cups were in flower all along the wet meadow.
- In Ireland, huntsman's cups often grow in low, boggy ground.
