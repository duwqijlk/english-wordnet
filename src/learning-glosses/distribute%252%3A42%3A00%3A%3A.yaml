simpleMeaning: In maths, to follow the rule that multiplying a sum by a number gives the same as multiplying
  each part by it and adding
scope: In maths, to follow this rule about multiplying a sum; not to give things out to people, not to
  spread things widely, and not to be spread in numbers from a study.
examples:
- In this sum, 3 distributes over the numbers in brackets.
- Multiplication distributes over addition in this rule.
