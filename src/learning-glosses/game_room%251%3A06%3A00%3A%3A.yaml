simpleMeaning: Noise from parties, children's play, and other loud fun is welcome in this place.
scope: Also called a playroom, this is a place where noise from parties, children's play, and other loud
  fun is welcome, not a quiet place for reading and not a place where people sleep.
examples:
- The children spent the afternoon in the game room playing table tennis.
- We turned the old garage into a game room for parties.
