simpleMeaning: In ancient times, a ring of leaves worn on the head as a sign of winning
scope: In ancient times, a ring of leaves worn on the head as a sign of winning, also called a laurel
  or a bay wreath, not a crown of gold and not a ring of flowers.
examples:
- The winner wore a laurel wreath on his head.
- A laurel wreath was placed on the statue to mark the victory.
