simpleMeaning: A tall fan palm of Africa, India, and Malaysia giving hard wood and sweet sap used for
  palm wine and sugar; its leaves are used for roofs and weaving.
scope: 'Also called longar palm, lontar, palmyra, palmyra palm, toddy palm, and wine palm: a tall fan
  palm of Africa, India, and Malaysia giving hard wood and sweet sap, not a low palm grown for its fruit
  and not a palm grown for its oil.'
