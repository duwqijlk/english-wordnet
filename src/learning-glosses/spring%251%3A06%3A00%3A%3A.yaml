simpleMeaning: A metal device that bends or stretches and then returns to its shape or position after
  being pushed, pulled, or pressed.
scope: It is not the season of the year or a water source, but a metal part that returns to shape.
examples:
- The toy pops up because a bent metal strip pushes it back.
- The screen door snapped shut as the metal coil pulled it back.
