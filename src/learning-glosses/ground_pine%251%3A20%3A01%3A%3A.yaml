simpleMeaning: Any of a few moss-like plants with long stems that creep along the earth and branches that
  stand up.
scope: A moss-like plant with long creeping stems and branches that stand up, not a true pine tree and
  not a moss that grows on rocks.
examples:
- Ground pine creeps along the forest floor in long stems.
- We found ground pine growing under the tall trees.
