simpleMeaning: the quality of being steady and held fixed in place so it does not move
scope: 'Also called steadiness: the quality of staying fixed in place, not the strong feel of healthy
  muscle in the body.'
examples:
- The firmness of the post kept the fence straight in the wind.
- She checked the firmness of the chair before she sat down.
