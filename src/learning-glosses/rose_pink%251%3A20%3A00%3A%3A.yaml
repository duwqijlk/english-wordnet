simpleMeaning: a marsh plant of the east of the United States with flowers of a soft red colour, much
  like a true centaury, another plant of the same kind
scope: 'Also called a bitter floom and a marsh pink: a marsh plant of the eastern United States, not a
  true centaury and not a flower of dry land.'
examples:
- A rose pink grew in the wet ground by the river.
- We saw rose pink with soft red flowers in the marsh.
