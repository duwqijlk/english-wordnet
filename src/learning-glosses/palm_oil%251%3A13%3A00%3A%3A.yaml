simpleMeaning: A greasy liquid got from the nuts of a tree, most of all the African kind
scope: A greasy liquid from the nuts of a tree, most of all the African kind; not a greasy liquid from
  the seeds of another plant, and not fat from an animal.
examples:
- She fried the plantains in palm oil.
- The factory buys palm oil from African growers.
