simpleMeaning: Blood from the womb comes back at about monthly gaps while a woman can still bear children.
scope: Also called menorrhea and menstrual blood, this flow comes from the womb at about monthly gaps,
  not from a wound.
examples:
- Menstrual flow came back at about monthly gaps.
- The menstrual flow came from the womb, not from a wound.
