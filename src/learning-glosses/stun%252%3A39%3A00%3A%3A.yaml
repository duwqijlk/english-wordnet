schema: oewn-learning-gloss-v2
senseId: 'stun%2:39:00::'
synsetId: 02119913-v
simpleMeaning: to leave someone unable to think clearly because they are very surprised or cannot believe
  what happened
scope: Daze is another name for this sense. It is to leave someone unable to think clearly because of
  great surprise or because they cannot believe something, not to make someone senseless or dizzy by a
  blow or as if by a blow.
examples:
- The news stunned her, and she could not speak for a moment.
- He was stunned to learn that he had won the prize.
