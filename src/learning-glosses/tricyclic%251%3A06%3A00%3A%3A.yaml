simpleMeaning: By stopping the body from taking back two brain chemicals, this drug leaves more of them
  free to act on the brain's receivers and so lifts low mood.
scope: Tricyclic antidepressant and tricyclic antidepressant drug are other names for this drug, which
  stops the body taking back two brain chemicals so more stay free to act on the brain.
examples:
- He took a tricyclic for his low mood.
- Her low mood lifted after she started on a tricyclic.
