simpleMeaning: to move a light beam over something; in electronics, to make a copy of an image by doing
  this
scope: This is about moving a light beam to make an image, not about getting data from tapes, looking
  at something very closely, or fitting the beats of a poem.
examples:
- The machine scans the page with a light beam to make the image.
- A light beam scans across the screen to build the picture.
