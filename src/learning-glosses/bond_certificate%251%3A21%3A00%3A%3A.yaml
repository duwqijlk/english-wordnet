simpleMeaning: A debt paper, usually bearing interest or cut-priced, from a state or firm raising money,
  maker paying a set sum yearly till due, then one to clear the debt.
scope: This sense is also called bond, for a paper by which a firm or a state takes money on loan, usually
  bearing interest or at a cut price, with a set sum paid yearly and the debt paid at the end.
examples:
- The bond certificate pays a set sum each year.
- They bought a bond certificate to raise money.
