simpleMeaning: A big oval nut with a hard shell and a hairy outer coat, holding thick white flesh round
  a hollow full of juice when fresh
scope: The whole big nut with its hard shell and white flesh, not just the white flesh and not the tall
  tree that bears it.
examples:
- She cracked a coconut and drank the juice inside.
- A coconut fell from the tree onto the sand.
