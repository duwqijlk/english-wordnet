simpleMeaning: A mammal of the cat kind, slim-bodied and round-headed, whose toes spread apart and whose
  claws in many kinds slide back when not in use.
scope: Also called a cat or a feline, this is the name for any member of the cat kind, a group that covers
  many kinds and not just one.
examples:
- The lion is a felid, like the tiger and the house cat.
- Every felid in the zoo could pull its claws back into its paws.
