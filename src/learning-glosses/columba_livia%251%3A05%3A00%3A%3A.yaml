simpleMeaning: A pale grey pigeon of Europe and Asia with black stripes on its wings, from which most
  tame kinds come.
scope: This is the wild pigeon from which most tame pigeons come, also called the rock dove or the rock
  pigeon; near kinds are other wild pigeons of Europe and Asia.
examples:
- Columba livia nests on the cliffs with black-striped wings.
- Most tame pigeons come from Columba livia.
