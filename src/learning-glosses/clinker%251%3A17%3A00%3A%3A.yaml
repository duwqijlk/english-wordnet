simpleMeaning: A hard lump left after wood, coal, or charcoal has burned, that will not burn.
scope: 'Also called a cinder: a hard lump left after wood, coal, or charcoal has burned; not the act of
  turning to such lumps, and not clearing them out.'
examples:
- He raked the clinker from the grate after the fire died.
- Clinker lay in the bottom of the stove.
