simpleMeaning: the act of making a hard or tangled thing simpler and easier to take in
scope: Making a complex thing simpler, not making a thing smaller in size and not the chemistry change
  that adds electrons.
examples:
- The reduction of the problem to a few clear steps helped everyone.
- Her reduction of the long report to one page saved a lot of time.
