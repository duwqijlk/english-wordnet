simpleMeaning: A weakening of the sense of touch, so that less is felt through the skin.
scope: A weakening of the sense of touch, not a loss of feeling in one part of the body and not a sharpening
  of the senses; hypesthesia is another name for it.
examples:
- After the injury she had hypoesthesia in two fingers.
- Hypoesthesia made the numb patch hard to feel with.
