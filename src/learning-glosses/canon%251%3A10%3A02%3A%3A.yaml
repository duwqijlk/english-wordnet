simpleMeaning: a set of books accepted as holy writing, especially the books of the Bible that any Christian
  church takes as true and given by God
scope: This is the set of holy books, not a general rule, not a list of saints, and not a piece of music
  or a priest.
examples:
- The church debated which books belong in the canon.
- These books are part of the biblical canon.
