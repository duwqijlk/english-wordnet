simpleMeaning: a fine white clay used to make smoking pipes and pots, and to make leather white
scope: 'Also called terra alba: a fine white clay used to make smoking pipes and pots and to whiten leather,
  not a red clay and not a building clay.'
examples:
- Pipeclay was used to whiten the leather belts.
- The potter kept pipeclay for making tobacco pipes.
