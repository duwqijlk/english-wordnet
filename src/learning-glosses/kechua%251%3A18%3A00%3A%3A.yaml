simpleMeaning: A member of a South American Indian people in Peru, once the ruling class of the Inca empire.
scope: A member of a South American Indian people of Peru, also called Quechua; it is not the Kechua tongue,
  the language of the same people, and not other peoples of the Andes.
examples:
- The Kechua once ruled the Inca empire.
- A Kechua elder told stories of the old empire.
