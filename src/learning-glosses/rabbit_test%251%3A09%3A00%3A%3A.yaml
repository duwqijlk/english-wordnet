synsetId: 05751955-n
simpleMeaning: A pregnancy test in which a woman's urine was injected into a female rabbit, and the animal's
  ovaries were later checked for the changes pregnancy causes.
scope: A dated pregnancy test that used a living rabbit; not a modern home test and not a check on the
  rabbit's own health.
examples:
- In the mid-twentieth century, the rabbit test was used to confirm pregnancy.
- The rabbit test required a urine sample and a laboratory rabbit.
