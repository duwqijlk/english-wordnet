simpleMeaning: A trade-mark thin sheet of plastic that lets through light waves moving in one plane only,
  much used in dark glasses to cut shine.
scope: This trade-mark sheet lets through light in one plane only, unlike a sheet of plain glass, and
  it cuts shine in dark glasses rather than making things look bigger.
examples:
- Polaroid sheets cut the glare from the water.
- His dark glasses have Polaroid lenses.
