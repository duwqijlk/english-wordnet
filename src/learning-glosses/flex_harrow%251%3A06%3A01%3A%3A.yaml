simpleMeaning: Thin spring teeth on a frame that bends to fit the shape of the ground make up this farm
  tool, which clears weeds from crops.
scope: Also called flexible harrow and tine weeder, this is a farm tool for clearing weeds, not a plough
  and not a tool for digging.
examples:
- The farmer pulled the flex harrow across the field.
- A flex harrow clears weeds from the crops.
