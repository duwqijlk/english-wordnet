simpleMeaning: to spread a thin layer of paint, metal, or something similar over a surface
scope: This is the verb for coating a surface with a thin layer, not cleaning it with soap and water,
  not separating minerals from gravel, and not the noun for a coat of paint.
examples:
- The workshop washed the steel sheets with a thin layer of zinc.
- He washed the frame with silver to give it a bright finish.
