simpleMeaning: A tool that guides a bomb to one small spot, fixed to a plain falling bomb to turn plain
  bombs into clever bombs.
scope: 'Also called Joint Direct Attack Munition: a tool that guides a bomb to one small spot, fixed to
  a plain falling bomb to turn plain bombs into clever bombs; other bomb tools guide a bomb less truly
  or cannot be fixed to a plain bomb.'
examples:
- JDAM guides a bomb to one small spot.
- The plain bomb became a clever bomb with JDAM fixed to it.
