senseId: 'ingenuous%3:00:00::'
synsetId: 01312946-a
simpleMeaning: open about your feelings and not able to hide them, and not dishonest or tricky in what
  you say or do
scope: 'Also called artless: open and honest about feelings, with no hidden trick; not the sense that
  means too simple and knowing little about the world.'
examples:
- Her ingenuous answer showed exactly how happy she felt, with nothing hidden.
- His ingenuous face made it clear he was upset, and no one thought he was lying.
