simpleMeaning: A time when prices and pay keep rising faster and faster, and money quickly loses its worth.
scope: A time when prices and pay rise faster and faster and money loses its worth, not slow steady price
  rises and not a time when prices fall.
examples:
- The country fell into an inflationary spiral.
- An inflationary spiral made savings worth less each month.
