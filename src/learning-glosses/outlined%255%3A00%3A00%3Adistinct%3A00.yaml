simpleMeaning: with its outer shape and edge shown so clearly that you can pick it out from what is behind
  it
scope: A shape that stands out clearly against what is behind it, not a shape that is hidden or hard to
  see.
examples:
- The outlined figure of a man stood on the hill at sunset.
- The hills were outlined against the evening sky.
