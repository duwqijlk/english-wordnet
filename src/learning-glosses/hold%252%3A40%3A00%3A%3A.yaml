simpleMeaning: have something as your own, whether a physical object or something you cannot touch, such
  as a quality or idea
scope: This is about owning or having something in general, not about a legal right, title, or post.
examples:
- She holds most of the shares in the family business.
- He holds a great deal of influence over the committee.
