simpleMeaning: To pass something along, or to act as the means by which it travels from one place or person
  to another.
scope: This is not the sense of holding an object while you move; it is about a thing or channel passing
  something such as sound or signals along.
examples:
- The pipes carry water from the reservoir to the town.
- Radio waves carry the signal to homes across the valley.
