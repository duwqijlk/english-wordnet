schema: oewn-learning-gloss-v2
senseId: 'beginning_rhyme%1:10:00::'
synsetId: 07111760-n
simpleMeaning: the use of the same consonant, a sound made with lips or tongue, at the start of each stressed
  part of a line of verse
scope: 'Also called alliteration, head rhyme and initial rhyme: the same first sound at the start of each
  stressed part of a line, not a rhyme at the end of a line and not the same word used twice.'
examples:
- The beginning rhyme in 'around the rock the ragged rascal ran' comes from the repeated r sound.
- She used beginning rhyme in 'big brown bears' so each stressed word starts with the same sound.
