simpleMeaning: A crop pest brought by chance from the Middle East to Florida and spread to California,
  where it feeds on almost all vegetable crops and poinsettias and does great harm.
scope: Also called poinsettia strain and superbug; a crop pest brought by chance from the Middle East
  to Florida and spread to California, distinct from other crop pests that came from within the United
  States.
examples:
- Bemisia tabaci spread from Florida to California.
- The farmer found Bemisia tabaci feeding on the vegetable crops.
