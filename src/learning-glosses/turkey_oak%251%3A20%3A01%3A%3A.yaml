simpleMeaning: A large deciduous tree from New Jersey to Illinois and southward, with spreading branches,
  a rounded crown, narrow curved leaves with deeply wavy lobes, and wood resembling northern red oak.
scope: The same southern red oak under another name; not the other turkey oaks, which are smaller and
  shrubby in the southeast or grow in Europe.
examples:
- The southern red oak in our yard is also called a turkey oak.
- A forester identified the turkey oak as a southern red oak.
