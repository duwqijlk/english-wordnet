simpleMeaning: to give away secret facts, or tell others things that were meant to stay secret
scope: 'Also called talk, sing, peach, babble, and blab: this is giving away secrets, not fast, endless
  talk about small, unimportant things.'
examples:
- He tattled to the teacher about who broke the window.
- Do not trust her - she will tattle your secret to everyone.
