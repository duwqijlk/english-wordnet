simpleMeaning: 'An instrument for measuring temperature: a narrow glass tube scaled in Celsius or Fahrenheit,
  holding alcohol that swells or shrinks with warmth, so its level rises or falls.'
scope: This is the glass-tube instrument whose reading comes from a column of alcohol, not a mercury-filled
  one and not the printed degree scale itself.
examples:
- The alcohol thermometer on the porch showed minus six degrees.
- Fill the jar with warm water and stand the alcohol thermometer in it.
