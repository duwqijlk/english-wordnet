simpleMeaning: Cut from trees of coastal swamps and river lands that flood, this is wood from a common
  tree of the southeast United States, its trunk wide at the foot
scope: Bald cypress, pond bald cypress, and swamp cypress are other names for this wood, not the tree
  itself.
examples:
- The southern cypress was cut from trees of a coastal swamp.
- Southern cypress is the wood of a tree with a trunk wide at the foot.
