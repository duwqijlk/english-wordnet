simpleMeaning: the act of breaking a law, a duty, or a rule about right and wrong
scope: The act of breaking a law or a rule about right and wrong, not the spreading of the sea over land.
examples:
- He was punished for his transgression against the law.
- Stealing was seen as a serious transgression by everyone in the village.
