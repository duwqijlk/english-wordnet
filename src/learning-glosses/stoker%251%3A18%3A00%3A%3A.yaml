simpleMeaning: A worker who tends fires, as on a train or ship that burns coal
scope: A worker who tends fires, as on a train or ship that burns coal; not a worker who builds fires
  for cooking and not an engine driver.
examples:
- The stoker tended the fire on the old train.
- A stoker keeps the fires burning on a steamship.
