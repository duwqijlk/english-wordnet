simpleMeaning: a sudden illness that makes a person fall down weak after being in the sun or in too much
  heat
scope: This is a serious illness from the sun or heat that makes a person fall down; it is not sunburn
  on the skin and not a suntan.
examples:
- He got sunstroke after working all day under the hot sun without a hat.
- Sunstroke can make a person feel sick and faint in very hot weather.
