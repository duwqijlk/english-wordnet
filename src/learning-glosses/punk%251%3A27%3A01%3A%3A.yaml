simpleMeaning: a substance that burns slowly with smoke and no flame once lit, used to light fuses, most
  of all on fireworks
scope: A slow-burning substance used to light fuses, not the loud music and not a young fan of that music.
examples:
- He used a stick of punk to light the fuse.
- The punk burned slowly as he held it to the firework.
