simpleMeaning: Rubbing between two sliding faces or tubes that fit one inside the other holds back the
  give of a steel post.
scope: Also called a friction yielding prop and a mechanical yielding prop, this steel post gives only
  as rubbing holds it back.
examples:
- The friction prop gave as the roof pressed down on it.
- They set the friction prop to hold the roof.
