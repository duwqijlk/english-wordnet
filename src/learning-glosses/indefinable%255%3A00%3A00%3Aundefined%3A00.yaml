simpleMeaning: cannot be told in clear, exact words or told with ease, and is not easy to put into words
scope: 'Also called undefinable: this is about a feeling or idea you cannot say in clear words, not about
  something plain and easy to tell.'
examples:
- She felt an indefinable fear she could not explain.
- He had an indefinable feeling that something was wrong.
