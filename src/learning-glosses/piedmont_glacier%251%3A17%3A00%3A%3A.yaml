simpleMeaning: A kind of ice mass found in Alaska, where big ice rivers from valleys join into one great
  sheet of ice that hardly moves
scope: This is a kind of ice mass of Alaska, made when big valley ice rivers join into one sheet that
  hardly moves; Piedmont type of glacier is another name for this sense, and it is not a single ice river
  in a valley.
examples:
- The Piedmont glacier spreads across the flat land.
- A Piedmont glacier forms when valley glaciers meet.
