simpleMeaning: a telling that gives the details of an act, an event, or a set of events, in writing, a
  play, a film, or a radio or television program
scope: Also called story, tale and narrative. This is a telling of what happened, given in writing, a
  play, a film, or on radio or television, not the second part of a formal speech where facts are set
  out.
examples:
- The film's narration told the story of her long journey home.
- His narration in the book gives clear details of the battle.
