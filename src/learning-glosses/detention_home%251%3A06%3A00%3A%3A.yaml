simpleMeaning: A place where young lawbreakers can be kept for a short time, most often watched over by
  a court for young people
scope: A place where young lawbreakers are kept for a short time under a court for young people; also
  called detention camp, detention house and house of detention, not a prison for adults and not a school.
examples:
- The girl was sent to a detention home until her case was heard.
- A detention home kept the young offenders safe while they waited.
