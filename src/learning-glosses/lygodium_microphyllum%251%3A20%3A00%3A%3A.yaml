simpleMeaning: A fern of tropical lands, found widely in the Old World, now growing wild in Jamaica and
  Florida.
scope: This is a fern of tropical lands, found widely in the Old World and now growing wild in Jamaica
  and Florida; climbing maidenhair, climbing maidenhair fern and snake fern are other names for this sense,
  and it is not a fern of cold lands.
examples:
- Lygodium microphyllum climbs through the trees in the tropical lands of the Old World.
- Lygodium microphyllum now grows wild in Jamaica.
