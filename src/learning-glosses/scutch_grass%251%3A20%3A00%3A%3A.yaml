simpleMeaning: Used for lawns and grazing land, above all in the southern United States and India, this
  trailing grass from Europe now grows in warm lands everywhere.
scope: Also called devil grass, doob, kweek, and star grass, it is a trailing grass from Europe now found
  in warm lands everywhere.
examples:
- Scutch grass covers the lawn in the warm regions.
- They use scutch grass for lawns and grazing land.
