simpleMeaning: In logic, a statement that is taken as true so that other ideas can be built on it
scope: 'In logic, also called postulate: a statement taken as true as a starting point, not the verb that
  means to take something as given.'
examples:
- In logic class, a posit is not proved; it is taken as true at the start.
- He treated the posit as a firm base for the rest of his proof.
