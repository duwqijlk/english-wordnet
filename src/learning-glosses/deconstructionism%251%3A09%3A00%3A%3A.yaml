simpleMeaning: This philosophical way of judging books or films, usually by looking below what they seem
  to say, brings out the deep clashes hidden inside them.
scope: 'This way of judging is also called deconstruction: it looks for deep clashes below the surface,
  not a plain retelling of what a work says.'
examples:
- Deconstructionism looks below the surface meaning of a book to find deep clashes inside it.
- She used deconstructionism to judge the film.
