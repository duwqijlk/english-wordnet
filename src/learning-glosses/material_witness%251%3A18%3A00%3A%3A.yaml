schema: oewn-learning-gloss-v2
senseId: 'material_witness%1:18:00::'
synsetId: 10320756-n
simpleMeaning: To settle the case in hand, a person must give facts that bear on it
scope: A person whose words in a case are needed to settle it, not a person who merely saw something happen
  and not a person called to give a view.
examples:
- The material witness gave facts that bore on the case and helped settle it.
- The judge would not let the material witness go until the case was settled.
