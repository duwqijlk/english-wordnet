simpleMeaning: A kind of fungus with a wet, slick coat and gills that are not waxy and stand free of the
  stem
scope: A fungus with a wet, slick coat and gills free of the stem; not a waxy-gilled fungus and not a
  mould that creeps on the ground.
examples:
- We found a white slime mushroom under the log.
- The white slime mushroom grew beside the old stump.
