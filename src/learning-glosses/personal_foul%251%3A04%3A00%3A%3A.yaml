senseId: 'personal_foul%1:04:00::'
synsetId: 00772687-n
simpleMeaning: In a game like basketball or football, an unfair move in which one player hits or pushes
  another too hard for no good reason.
scope: In a game like basketball or football, an unfair move in which one player hits or pushes another
  too hard for no good reason; not a fair tackle and not a rule about time.
examples:
- The referee called a personal foul on the guard for shoving the shooter.
- His personal foul gave the other team two free throws.
