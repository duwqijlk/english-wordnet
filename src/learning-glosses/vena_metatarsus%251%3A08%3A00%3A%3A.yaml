simpleMeaning: Top and sole branches of blood tubes serving the middle part of the foot.
scope: Top and sole branches of blood tubes of the middle foot; metatarsal vein is another name for this
  sense; not blood tubes of the ankle and not ones of the toes.
examples:
- The vena metatarsus serves the middle part of the foot.
- Pain in the vena metatarsus can follow a foot injury.
