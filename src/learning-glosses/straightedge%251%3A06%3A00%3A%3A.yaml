senseId: 'straightedge%1:06:00::'
synsetId: 04338581-n
simpleMeaning: a hand tool made of a flat stiff rectangular bar, of metal or wood, used to draw lines
  with no bend or to check that lines have no bend
scope: A flat stiff bar used to draw lines with no bend or to test that a line has no bend, not a ruler
  marked for measuring lengths and not a square for right angles.
examples:
- He used a straightedge to draw a line across the paper.
- The carpenter held the straightedge against the board to test its edge.
