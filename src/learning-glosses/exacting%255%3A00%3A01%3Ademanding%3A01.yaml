senseId: exacting%5:00:01:demanding:01
synsetId: 00714030-s
simpleMeaning: needing great care so that every small part is right and without any mistakes
scope: This sense describes work or a task that must be done right in every small part. It is not about
  a person who makes hard demands all the time, and not about living things that need special food.
examples:
- Measuring the tiny parts is exacting work that needs steady hands.
- Writing the numbers by hand was an exacting task, with no room for mistakes.
