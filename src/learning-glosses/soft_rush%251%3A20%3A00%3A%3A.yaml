simpleMeaning: Tender stems that stand straight or curve over mark this tall rush, found in Eurasia, Australia,
  and New Zealand, and widespread in North America.
scope: Also called bulrush, bullrush, and common rush, it is a tall rush with tender stems that stand
  straight or curve over.
examples:
- The soft rush had tall stems that stood straight or curved over.
- Soft rush is common in North America.
