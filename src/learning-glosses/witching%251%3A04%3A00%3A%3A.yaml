simpleMeaning: the practice of using magic and spells
scope: This sense is the doing of magic and spells; it is not the describing word for a person or thing
  that has or uses magic powers.
examples:
- People in the village feared witching and blamed it for the failed crops.
- She was put on trial for witching after a neighbour fell ill.
