senseId: 'realism%1:07:00::'
synsetId: 05159116-n
simpleMeaning: A way of thinking that takes life as it is, puts what works in practice first, and sticks
  to plain truth
scope: A way of thinking that takes life as it is and puts what works first, not a French art movement
  and not a philosophy about things existing unseen.
examples:
- His realism kept the plan grounded in what could be done.
- She faced the news with a realism that calmed the others.
