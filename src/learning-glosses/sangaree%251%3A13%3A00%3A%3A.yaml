simpleMeaning: a sweet drink made from red wine, orange or lemon juice, and soda water
scope: A sweet red-wine drink with citrus juice and soda water; sangria is another name for this sense,
  not plain wine and not a fruit juice.
examples:
- They sipped a cold sangaree on the terrace.
- The bartender mixed a sangaree with red wine and lemon juice.
