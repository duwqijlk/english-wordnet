senseId: 'determine%2:32:00::'
synsetId: 00920843-v
simpleMeaning: to work out or prove something by using numbers, by looking into it closely, by tests,
  by asking many people, or by study
scope: Also called find. This sense is working out a fact by numbers, tests, asking many people, or study,
  not just making sure of something by asking or checking.
examples:
- The scientists determined the age of the rock by testing it in the lab.
- He determined the exact cost by adding up all the numbers again.
