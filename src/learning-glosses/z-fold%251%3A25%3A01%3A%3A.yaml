simpleMeaning: A sheet bent back and forth in straight lines, first to the front and then to the back,
  so it zig-zags like an accordion.
scope: 'Also called accordion fold, concertina fold, and zig-zag fold: a way of folding a sheet back and
  forth in straight parallel bends.'
examples:
- The brochure opened out with a z-fold.
- She folded the letter in a z-fold before she put it in the envelope.
