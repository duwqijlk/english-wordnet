senseId: 'perpendicular%1:06:01::'
synsetId: 03975985-n
simpleMeaning: a string with a heavy metal weight hanging from it, pointing straight down to the center
  of the earth, used to find the straight up-and-down line at a place
scope: This is a tool, also called a plumb line, for finding a straight up-and-down line, not an old building
  style and not the describing word for lines that meet at right angles.
examples:
- He held the perpendicular against the wall to check that the wall was straight up and down.
- Builders once used a perpendicular to make sure a post stood truly straight.
