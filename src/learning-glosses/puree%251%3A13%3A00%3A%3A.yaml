simpleMeaning: food made by cooking it and pushing it through a strainer, or by mixing it in a blender
  until it is smooth
scope: This is the smooth food itself, not the act of making food smooth by cooking and straining it or
  using a blender.
examples:
- The baby ate a spoon of apple puree.
- She served the soup as a thick puree with bread.
