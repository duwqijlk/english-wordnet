simpleMeaning: Some at times put this plant of warm lands in America, whose small leaflets are a little
  quick to feel a touch, in the plant group Cassia.
scope: Partridge pea and wild sensitive plant are other names for this plant of warm lands in America,
  sometimes put in the plant group Cassia.
examples:
- The sensitive pea felt a touch on its leaflets.
- Some put the sensitive pea in the plant group Cassia.
