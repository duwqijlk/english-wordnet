simpleMeaning: a difficulty or problem that you do not see coming and do not expect
scope: An unexpected difficulty or problem that you do not see coming; not a deep hole in the ground used
  as a trap.
examples:
- A common pitfall for new drivers is looking only at the car in front.
- Saving money early helps you avoid the pitfall of having no money when work stops.
