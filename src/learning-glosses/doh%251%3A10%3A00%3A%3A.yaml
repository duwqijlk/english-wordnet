simpleMeaning: The sung sound that names the first note, the home note, of any major scale.
scope: This is the first-note syllable of a major scale, also called do and ut, not the second note or
  any other scale step.
examples:
- Sing doh first, then climb up the scale.
- The choir began on doh, the home note of the scale.
