simpleMeaning: a prickly bush with yellow flowers that grows on the open high land of New England and
  Europe
scope: A prickly bush with yellow flowers of the moors; broom tree and needle furze are other names for
  this sense, not a garden rose and not a low thorn bush of dry land.
examples:
- Petty whin covered the moor with yellow flowers in early summer.
- We picked our way through the petty whin, its thorns catching at our coats.
