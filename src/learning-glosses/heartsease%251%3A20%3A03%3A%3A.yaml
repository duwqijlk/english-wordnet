simpleMeaning: A common European herb, grown for a long time, from which most common garden pansies come.
scope: A common European herb, grown for a long time, from which most common garden pansies come, also
  called love-in-idleness; not the Old World viola with cream-coloured flowers touched with purple.
examples:
- Heartsease has been grown in European gardens for hundreds of years.
- Most garden pansies come from heartsease.
