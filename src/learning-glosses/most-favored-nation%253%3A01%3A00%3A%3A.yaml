simpleMeaning: Used of a trade deal in which two countries give each other the same good terms they would
  give any other country.
scope: Used of a trade deal where two countries give each other the same good terms they would give any
  other country, not a deal that gives one country better terms than all others.
examples:
- The two countries signed a most-favored-nation deal.
- Under most-favored-nation rules, no country gets worse terms than any other.
