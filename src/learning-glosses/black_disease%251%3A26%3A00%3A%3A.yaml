simpleMeaning: A sickness of the liver, above all in sheep and cattle, caused by liver flukes and what
  they leave behind.
scope: A sickness of the liver, above all in sheep and cattle, caused by liver flukes and what they leave
  behind; distomatosis and liver rot are other names for this sense, not a sickness of the lungs and not
  a sickness caused by germs alone.
examples:
- Black disease struck the flock after the wet spring.
- The vet blamed black disease for the ewe's death.
