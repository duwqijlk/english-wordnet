simpleMeaning: a fungus (a living thing like a mushroom, but not a plant) that grows under the ground
  and can be eaten, of the kind called Tuber
scope: This is the fungus that grows under the ground and that people eat, also called earthnut. It is
  not the sweet chocolate candy that has the same name.
examples:
- The cook shaved fresh truffle over the pasta.
- Dogs are trained to find truffles under the ground in the woods.
