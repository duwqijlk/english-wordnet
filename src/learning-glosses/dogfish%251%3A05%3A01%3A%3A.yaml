simpleMeaning: this early kind of freshwater fish eats meat and lives in slow North American waters, with
  a back fin running nearly the whole length of its long body
scope: 'Also called bowfin and grindle: a long meat-eating freshwater fish of North America, not a shark
  and not a trout.'
examples:
- The dogfish slid through the slow water, its long back fin breaking the surface.
- Anglers sometimes catch a dogfish in the sluggish rivers of North America.
