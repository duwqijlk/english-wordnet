simpleMeaning: The act of drinking alcohol in amounts far greater than is healthy or sensible
scope: 'Also called drink and drinking: the act of drinking too much alcohol. It is not the unsteady state
  a person is in after drinking too much.'
examples:
- He was fined for drunkenness after drinking far too much at the bar.
- The law treats drunkenness in public as a crime when people drink far too much.
