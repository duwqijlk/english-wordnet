simpleMeaning: to leave someone alone in a place, with little hope that help will come
scope: 'Also called strand: to leave a person alone where help is hard to reach, not to leave a ship in
  shallow water and not a firework used as a warning.'
examples:
- The travellers were marooned on the island after the boat left.
- They marooned him on a small island with no food.
