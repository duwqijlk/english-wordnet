simpleMeaning: A tetracycline drug, a kind that kills germs, sold under this trade name, used to treat
  kinds of sickness caused by bacteria and by a second kind of tiny germ
scope: This is a germ-killing drug of the tetracycline kind, used to treat many kinds of sickness caused
  by bacteria and by a second kind of tiny germ; minocycline is another name for this sense.
examples:
- The doctor gave him Minocin for the infection.
- Minocin treats many kinds of bacterial infections.
