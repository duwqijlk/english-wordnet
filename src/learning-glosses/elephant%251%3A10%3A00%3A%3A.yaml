simpleMeaning: First used in cartoons by Thomas Nast in 1874, it is the sign of the Republican Party
scope: This is the party sign, not the animal with the same name and not the party itself.
examples:
- The elephant on the poster stood for the Republican Party.
- He drew an elephant to show support for the Republican Party.
