simpleMeaning: A chemical taken for reasons other than healing, usually to change how the mind works;
  it can harm body and mind and, with some kinds, lead to need and habit.
scope: A chemical taken for reasons other than healing, usually to change how the mind works, not a medicine
  taken to cure and not one bought with a doctor's note.
examples:
- Heroin is a drug of abuse.
- The clinic treats people harmed by drugs of abuse.
