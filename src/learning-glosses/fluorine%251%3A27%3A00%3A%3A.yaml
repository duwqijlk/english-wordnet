simpleMeaning: A non-metal element of the halogen group that joins one other atom; usually a yellow gas
  that stings, poisons and burns, and a strong oxidizer from fluorite, cryolite or fluorapatite
scope: This element is also called F and atomic number 9; it is not chlorine and not another gas of the
  halogen group.
examples:
- Fluorine is a yellow gas that can burn the skin.
- Fluorine is used to make many other chemicals.
