simpleMeaning: A very hairy elephant-like animal often found in the cold parts of the northern half of
  the world
scope: A very hairy elephant-like animal of the cold north; northern mammoth is another name for this
  sense, not a modern elephant and not the woolly rhinoceros.
examples:
- The woolly mammoth had thick hair to keep it warm in the cold north.
- Bones of the woolly mammoth have been found in the frozen north.
