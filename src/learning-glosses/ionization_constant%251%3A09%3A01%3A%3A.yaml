simpleMeaning: A number that shows how far a weak stuff that splits into charged bits breaks into those
  bits
scope: A number for how far a weak stuff that splits into charged bits breaks into those bits, not a number
  for a strong stuff and not the splitting itself.
examples:
- The ionization constant of the weak acid is very small.
- Chemists look up the ionization constant to tell how far the stuff splits.
