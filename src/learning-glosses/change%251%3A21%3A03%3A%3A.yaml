simpleMeaning: money handed back in smaller units or another currency for an equal amount.
scope: This sense is not low-value coins as a group and not money left over from a purchase; it is money
  received when a larger bill or one currency is exchanged for an equal amount.
examples:
- I need change for a twenty-dollar bill.
- The cashier gave him change for a fifty.
