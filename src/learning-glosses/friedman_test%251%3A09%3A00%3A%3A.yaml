simpleMeaning: 'A pregnancy check: her urine is injected into a female rabbit that has never mated, and
  its ovaries are looked at later; yellow lumps there mean she is with child.'
scope: 'Also called rabbit test: a pregnancy check that uses a rabbit, not a blood check and not a scan.'
examples:
- The Friedman test used a rabbit to check for pregnancy.
- Doctors once used the Friedman test before modern checks.
