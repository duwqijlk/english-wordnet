simpleMeaning: A former state law that let makers fix the lowest shop price of their goods, shielding
  them from price cuts; the United States Congress ended it in 1975.
scope: A former state law on lowest prices, not a law that sets prices today or controls all trade.
examples:
- Under the fair-trade act, makers could set a lowest price for their goods.
- Congress did away with the fair-trade act in 1975.
