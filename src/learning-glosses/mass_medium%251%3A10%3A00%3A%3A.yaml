simpleMeaning: Usually in the plural, this is what is sent out widely to the public
scope: Also called medium, this is what is sent out widely to the public, usually in the plural, not one
  person's message and not a single book.
examples:
- Television is a mass medium that reaches millions of people.
- The mass media shape what people think about the news.
