simpleMeaning: loose clothes worn for sleeping or resting, usually in the plural, with a jacket top and
  trousers
scope: Also called pajamas, these are loose clothes worn for sleeping or resting, not the loose trousers
  worn in some Asian countries.
examples:
- He changed into his pyjamas before bed.
- She wore striped pyjamas to breakfast.
