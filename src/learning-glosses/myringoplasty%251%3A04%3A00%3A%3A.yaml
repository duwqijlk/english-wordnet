simpleMeaning: An operation that mends a torn eardrum with a piece of living tissue.
scope: An operation that mends a torn eardrum with a piece of living tissue, not an operation that cuts
  the eardrum and not a hearing aid.
examples:
- The surgeon did a myringoplasty to mend the torn eardrum with a piece of living tissue.
- After the myringoplasty, the mended eardrum healed and her hearing came back.
