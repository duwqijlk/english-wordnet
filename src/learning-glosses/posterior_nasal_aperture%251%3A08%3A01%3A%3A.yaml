simpleMeaning: one of the two back openings of the nose space that lead into the throat passage
scope: 'Also called a choana, an internal nostril, and a posterior naris: one of the two back openings
  from the nose space to the throat, not an opening at the front of the nose.'
examples:
- The scan showed a narrow posterior nasal aperture on the left side.
- Each posterior nasal aperture links the nose space with the throat.
