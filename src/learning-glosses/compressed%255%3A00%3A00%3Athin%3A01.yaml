simpleMeaning: 'some leaf stalks and certain flat fish are thin in one direction only: pressed in from
  the sides, they stay thin all the way from end to end'
scope: 'Also called flat: pressed thin sideways along its whole length, not pressed down from above.'
examples:
- The compressed leaf stalk was thin as paper from side to side.
- Some flatfishes have compressed bodies that hug the sea floor.
