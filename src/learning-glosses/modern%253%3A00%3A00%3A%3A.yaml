simpleMeaning: belonging to the period of history that began after the Middle Ages and continues today.
scope: This is not the sense 'typical of present-day art'; it covers the whole historical period after
  the Middle Ages.
examples:
- Modern history is usually taught after the medieval period.
- The museum covers modern times, from about 1500 to the present.
