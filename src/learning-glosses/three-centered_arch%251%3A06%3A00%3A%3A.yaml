simpleMeaning: A round curved opening whose inner curve is drawn with circles with 3 centres
scope: This is a round curved opening drawn with circles with 3 centres, also called a basket-handle arch;
  not a pointed opening and not a round opening drawn with one centre.
examples:
- The doorway was a three-centered arch drawn with circles with three centres.
- Builders used a three-centered arch for the wide round opening.
