simpleMeaning: to lay down rules for how people or things act, and bring them in line with those rules,
  principles, or the usual way
scope: To lay down rules for how people or things act, and bring them in line with those rules, principles,
  or the usual way, also called order or govern; not holding back a flow of sound or liquid.
examples:
- The council regulates parking in the town.
- The state regulates how food is sold.
