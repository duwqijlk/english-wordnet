simpleMeaning: Weakness or loss of muscle tone caused by injury or disease of the nerves that supply the
  muscles.
scope: This is the weakness or loss of firmness in the muscles that comes from harm or sickness in the
  nerves that work them.
examples:
- Flaccid paralysis left the muscles weak after the nerves were harmed.
- The illness harmed the nerves, and flaccid paralysis followed.
