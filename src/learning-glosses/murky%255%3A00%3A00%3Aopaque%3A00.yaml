simpleMeaning: of a liquid, hard to see through because bits have sunk into it
scope: 'Also called muddy and cloudy: a liquid that is hard to see through because of bits in it, not
  a dark colour and not water that is simply dirty.'
examples:
- The murky water in the pond was hard to see through.
- He poured out the murky coffee and made a fresh pot.
