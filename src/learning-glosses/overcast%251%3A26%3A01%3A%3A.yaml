simpleMeaning: the dull half-darkness that comes when clouds hide the sky
scope: A dull half-darkness under cloud, not a cloudy day itself and not a kind of sewing stitch.
examples:
- The overcast made the afternoon feel like evening.
- We walked home under a heavy overcast.
