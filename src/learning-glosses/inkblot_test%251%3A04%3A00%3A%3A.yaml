senseId: 'inkblot_test%1:04:00::'
synsetId: 01009849-n
simpleMeaning: A mind check that uses blots of ink the same on both sides, where people say what they
  see in each blot.
scope: A mind check that uses blots of ink the same on both sides, where people say what they see; not
  a check of what a person knows and not a check of how the body works.
examples:
- The inkblot test showed her a card with a dark blot.
- In the inkblot test, he said the blot looked like a bat.
