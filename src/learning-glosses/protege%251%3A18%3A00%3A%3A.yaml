simpleMeaning: A person backed and looked after by a powerful backer who helps their work get ahead.
scope: A person backed and looked after by a powerful backer who helps their work get ahead, not the backer
  themselves.
examples:
- The young painter was the protege of a rich patron of the arts.
- As his protege, she was given work and a place to show it.
