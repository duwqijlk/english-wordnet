simpleMeaning: The act of fighting with a sword or another weapon in a vigorous and skillful way.
scope: This is not light-hearted fun, not a single planned move in a sport and not teasing talk; it is
  armed fighting done with energy and skill.
examples:
- The crowd watched the swift, skillful swordplay between the two duelists.
- During the bout, her play with the rapier was fast and precise, and the judges gave her the win.
