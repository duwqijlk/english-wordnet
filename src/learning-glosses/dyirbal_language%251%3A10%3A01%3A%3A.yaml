simpleMeaning: A tongue spoken by the first peoples of Australia in the north-east of Queensland.
scope: Also called Dyirbal, Jirrbal and Jirrbal language; the speech of the first peoples of north-east
  Queensland, not the speech of other peoples of Australia.
examples:
- She learned the Dyirbal language from her grandmother.
- The Dyirbal language is spoken in north-east Queensland.
