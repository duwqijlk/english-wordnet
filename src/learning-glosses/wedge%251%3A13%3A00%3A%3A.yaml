simpleMeaning: a big sandwich in a long hard roll cut along its length, with meat, cheese, tomato, onion,
  lettuce and sauces; its name changes in different parts of the United States
scope: 'Also called hero, sub, bomber and submarine: a large filled roll, not the solid piece used to
  split things apart and not the golf club.'
examples:
- He ordered a wedge with extra cheese for lunch.
- The shop sells a turkey wedge on a long roll.
