simpleMeaning: one of a group of chemicals that turn into gas easily and have oxygen joined to hydrogen,
  made by heating and cooling chemicals made only of hydrogen and carbon
scope: The chemical sense, not a drink such as beer or wine that can make a person drunk.
examples:
- This alcohol turns into gas quickly when it is left open in warm air.
- The factory makes this kind of alcohol by heating and cooling the starting chemicals.
