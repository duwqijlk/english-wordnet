simpleMeaning: Underground stems let this plant from Europe spread fast, and it now grows wild in North
  America as a weed.
scope: 'Also called dog grass, quack grass, quackgrass, quick grass, witch grass, and witchgrass: a fast-spreading
  plant from Europe, not a grass sown for lawns.'
examples:
- The couch grass in the field spreads fast by underground stems.
- Farmers pull out couch grass because it grows as a weed.
