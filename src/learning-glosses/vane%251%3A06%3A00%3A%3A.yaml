simpleMeaning: a device put on top of a high place, such as a roof, that turns freely to show which way
  the wind blows
scope: 'Also called weathervane: a device on a high place that shows which way the wind blows, not a fin
  on an arrow or missile, and not the flat part of a feather.'
examples:
- The vane on the barn roof turned to point east.
- A strong wind spun the vane round.
