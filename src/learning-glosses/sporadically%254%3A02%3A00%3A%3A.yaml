senseId: 'sporadically%4:02:00::'
synsetId: 00214272-r
simpleMeaning: at times that are not regular, happening only now and then
scope: This is about things that happen only now and then at no set time, not things that happen often
  or all the time.
examples:
- He works sporadically, only a few days in each month.
- Rain fell sporadically during the night, then stopped for hours.
