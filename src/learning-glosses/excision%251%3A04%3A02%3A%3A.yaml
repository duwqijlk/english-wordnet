senseId: 'excision%1:04:02::'
synsetId: 00209126-n
simpleMeaning: The act of casting a church member out of the fellowship of believers and the rights of
  the church, cutting one off from a godly body.
scope: The act of casting a church member out of the fellowship of believers and the rights of the church,
  cutting one off from a godly body; also called excommunication; not the act of pulling up or out, uprooting,
  cutting off from being, nor the gap left when a written passage is cut short by editing, nor the surgical
  taking of a body part or tissue.
examples:
- Their excision cast out the member.
- The excision was done at dawn.
