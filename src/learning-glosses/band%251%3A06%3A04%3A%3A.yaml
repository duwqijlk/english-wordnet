simpleMeaning: A marker fixed to a bird's leg so individual birds can be recognized, as in migration studies.
scope: A small strip fixed to a bird's leg so the bird can be recognized; not a people group, an orchestra
  or pop dance group, a radio frequency range, a stripe or stripes of contrasting color, a trim sewn onto
  a garment, a strip worn on the body, a loop that binds an object, a restraint, a finger ring, an anatomical
  cord, a machine drive belt, or a verb (tying things together, fastening a ring to a bird's foot).
examples:
- The researchers fitted a numbered band to the osprey's leg.
- Each band on the swan's leg carried a different code.
