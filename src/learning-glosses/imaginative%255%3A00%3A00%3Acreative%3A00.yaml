simpleMeaning: showing fresh, free thinking of your own, in what a person does or in a thing a person
  makes
scope: Showing fresh, free thinking of your own, in a person or in a thing made, not the act of picturing
  something unreal and not a daydream.
examples:
- She found an imaginative use for the old jars.
- The teacher praised his imaginative answer to the problem.
