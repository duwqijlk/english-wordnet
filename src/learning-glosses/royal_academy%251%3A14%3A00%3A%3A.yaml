simpleMeaning: An honoured body in London, set up in 1768 to foster painting, sculpture and building design
  in Britain.
scope: Also called the Royal Academy of Arts; an honoured body in London that fosters painting, sculpture
  and building design, not a school that teaches students and not a gallery that shows art.
examples:
- The Royal Academy was set up in London in 1768.
- Painters hope to show their work at the Royal Academy.
