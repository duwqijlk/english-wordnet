simpleMeaning: Work made by joining loops of thread with straight needles that have no eyes, or made by
  a machine
scope: 'Also called knitting: work made by joining loops of thread with straight needles that have no
  eyes, or by a machine, not one single stitch and not the act of pulling cloth into folds.'
examples:
- The knit of her sweater was fine and even.
- She sold her knit at the market.
