simpleMeaning: the body area between the neck and the diaphragm (the muscle sheet under the lungs) in
  people, or the matching part in other animals with backbones
scope: The body part, not the breast and not a piece of furniture with drawers.
examples:
- He felt a sharp pain in his chest while running.
- The doctor pressed the stethoscope against her chest.
