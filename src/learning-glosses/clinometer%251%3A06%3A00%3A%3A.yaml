simpleMeaning: a tool used by surveyors to measure how steep a slope is, up or down
scope: A tool used by surveyors to measure how steep a slope is; inclinometer is another name for this
  sense, not a compass and not a tool for measuring distance.
examples:
- The surveyor used a clinometer to check the slope.
- With a clinometer he found the hill rose at ten degrees.
