simpleMeaning: A nervous-system condition causing muscle twitching and cramps, and sometimes fits; it
  is linked to low calcium, low vitamin D or an overly alkaline body chemistry.
scope: This sense is the specific nervous-system disorder with twitching, cramps and fits; it is not an
  ordinary muscle cramp or epilepsy.
examples:
- The calf spasms were caused by tetany.
- Tetany can result from a severe drop in blood calcium.
