simpleMeaning: of a plant or animal, being the sex that produces sperm cells which do the fertilizing
  in reproduction
scope: This describes a biological sex, not characteristic of men or boys, not composed of men, and not
  the nouns for a person or animal of this sex.
examples:
- The male flower produces pollen but no seeds.
- Only male frogs make this mating call.
