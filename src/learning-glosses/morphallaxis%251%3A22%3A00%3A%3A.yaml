simpleMeaning: Regrowth of a body part on a smaller scale, seen above all in animals without backbones,
  such as some lobsters.
scope: Regrowth of a body part on a smaller scale, seen above all in animals without backbones, not regrowth
  at full size and not the healing of a wound.
examples:
- Morphallaxis lets the lobster regrow a lost claw on a smaller scale.
- After the injury, morphallaxis rebuilt the small limb.
