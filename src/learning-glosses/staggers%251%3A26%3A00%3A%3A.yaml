simpleMeaning: a sickness of the brain and nerves that strikes horses and cattle above all, making them
  walk with a wobbly sway and fall down often
scope: A sickness of the brain and nerves that strikes horses and cattle above all, making them walk with
  a wobbly sway and fall often; not a sickness of people, and not a single fall.
examples:
- The vet treated a cow with the staggers.
- Horses with the staggers sway as they walk and often fall.
