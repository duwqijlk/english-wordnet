simpleMeaning: to tie a cloth around a person's mouth so they cannot speak or shout
scope: 'Also called muzzle: tying a cloth in a mouth to stop speech, not the cloth itself and not the
  act of struggling to breathe.'
examples:
- The kidnappers gagged him so he could not call for help.
- They gagged the prisoner before leading him away.
