simpleMeaning: taking great care in what you do, and getting it right
scope: This word is about a person or work that takes great care and is right in detail. It is not about
  work done in full with nothing left out, and not used just to make another word stronger.
examples:
- She is a thorough worker and checks every number twice.
- He gave a thorough answer, careful and correct in every detail.
