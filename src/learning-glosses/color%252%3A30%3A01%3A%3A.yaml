simpleMeaning: To turn a different shade, often in a way that is not wanted.
scope: This is something itself turning a different shade, often for the worse; it is not adding hue to
  something, not decorating an object with hues, not a substance such as paint or dye, not affecting someone's
  feelings or judgment, not biasing or slanting something, not giving a misleading explanation or excuse,
  not a thing's visible appearance as judged by hue, lightness and saturation, not the physical light
  attribute behind it, not vividness or interest, not a musical sound's quality, not a misleading outward
  show or form, not the physics property that quarks carry, and not the adjective meaning able to produce
  hues.
examples:
- The silver chain colored dark green wherever it touched her skin.
- The edges of the old photograph had colored yellow with age.
