senseId: 'slapdash%4:02:00::'
synsetId: 00459843-r
simpleMeaning: In a way that pays no care to how a thing is done, and takes wild risks with it.
scope: For work put up in a hurry, with no care taken.
examples:
- The shelves were put up slapdash, and one fell within a week.
- He did the job slapdash, without measuring a thing.
