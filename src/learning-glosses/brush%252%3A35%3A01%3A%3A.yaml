simpleMeaning: move a bristled tool over a surface with pressure, or use something else the same way
scope: The rubbing action itself, not cleaning with a tool, taking something off, or coating a surface.
examples:
- He brushed the dog's coat until it lay smooth.
- She brushed the dusty sleeve with her palm.
