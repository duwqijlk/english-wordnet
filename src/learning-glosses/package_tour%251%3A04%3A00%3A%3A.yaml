simpleMeaning: Set up by a travel agent, this trip round places has travel, food and a place to sleep
  all paid for in one price
scope: 'Another name for this sense is package holiday: a trip round places with travel, food and a place
  to sleep all paid for in one price, not a trip you plan yourself and not a holiday where each part is
  paid for on its own.'
examples:
- We booked a package tour of Italy that covered our flights, hotel and meals.
- Their package tour took them round five cities, with the coach and all the hotels paid for in advance.
