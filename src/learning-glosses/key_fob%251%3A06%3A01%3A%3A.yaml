simpleMeaning: A small thing fixed to a ring or chain and made to sit well in the hand
scope: This is a small thing fixed to a ring or chain and made to sit well in the hand; keyfob is another
  name for this sense, not the ring itself and not a tag with writing on it.
examples:
- I lost my key fob at the beach.
- Her key fob has a small photo on it.
