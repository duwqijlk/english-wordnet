simpleMeaning: A much-branched shrub that loses its leaves each year, with thick soft bunches of small
  white flowers shaped like bells.
scope: 'Also called he-huckleberry, male berry, maleberry and privet andromeda: a much-branched shrub
  with dense soft bunches of small white bell flowers, not the true huckleberry or the privet hedge plant.'
examples:
- Lyonia ligustrina stood by the stream, its white bell flowers in thick bunches.
- We found Lyonia ligustrina in flower, the small white bells hanging in soft bunches.
