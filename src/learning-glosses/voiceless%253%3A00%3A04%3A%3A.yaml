senseId: 'voiceless%3:00:04::'
synsetId: 02294026-a
simpleMeaning: describing a speech sound in which the vocal cords do not shake as the sound is made
scope: Also called hard, surd and unvoiced. This is about a speech sound made without the vocal cords
  vibrating, not a person who cannot speak through injury or illness, and not a sound made without voice.
examples:
- In 'sip', the first and last sounds are voiceless.
- A voiceless consonant like 'k' is made without the vocal cords vibrating.
