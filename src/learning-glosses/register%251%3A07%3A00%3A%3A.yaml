simpleMeaning: In music, the sound and tone of a voice or an organ stop or a musical instrument in one
  part of its range and the way it is made
scope: In music, the sound and tone of a voice or an instrument in one part of its range, not a list of
  names and not a part of a machine.
examples:
- Her voice rose into a high register in the last song.
- The organ sounded best in its low register.
