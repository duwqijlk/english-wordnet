simpleMeaning: A very stable compound in which a hydrocarbon's hydrogen atoms are replaced by bromine
  and other halogens; used in fire extinguishers, though it may release ozone-depleting bromine.
scope: This is the bromine-based fire-suppressant compound; not a chlorofluorocarbon in general, and not
  a dry-powder extinguishing agent.
examples:
- The old server room still relies on a halon fire-suppression system.
- Halon was phased out because it damages the ozone layer.
