senseId: 'disintegration%1:22:02::'
synsetId: 13478072-n
simpleMeaning: the process in which a radioactive substance (matter that gives out harmful rays) falls
  apart on its own and gives out strong harmful rays
scope: 'Also called decay and radioactive decay: this is matter breaking apart on its own and giving out
  harmful rays, not a group breaking up and not a thing falling to pieces.'
examples:
- The disintegration of the radioactive material gave out harmful rays as it broke apart.
- Scientists measured the disintegration of the substance as it fell apart on its own.
