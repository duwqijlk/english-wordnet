simpleMeaning: The herpes virus that causes glandular fever; linked with certain cancers in Africa and
  China
scope: A virus that causes glandular fever, not a cold virus and not a flu virus; also called Epstein-Barr
  virus.
examples:
- EBV causes infectious mononucleosis in young people.
- Doctors test for EBV when glands swell for weeks.
