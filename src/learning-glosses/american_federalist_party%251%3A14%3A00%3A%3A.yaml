simpleMeaning: A large political group in the United States in the early 1800s, set up by Alexander Hamilton,
  that backed a strong central government.
scope: 'Also called Federal Party or Federalist Party: a large political group in the United States in
  the early 1800s, set up by Alexander Hamilton, that backed a strong central government, set apart from
  other groups of the time by its backing of strong central rule.'
examples:
- The American Federalist Party backed a strong central government.
- Alexander Hamilton led the American Federalist Party in the early 1800s.
