simpleMeaning: a common sea bird (a gull) found in Europe and Asia and in the north-east of North America
scope: This is the sea bird itself, a kind of gull. It is not the high cry made by seagulls, which is
  the verb sense of this word.
examples:
- A mew landed on a rock by the sea.
- We saw a mew flying over the harbour in the morning.
