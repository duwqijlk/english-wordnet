simpleMeaning: A clouding at the back of the cover of the eye's lens
scope: A clouding at the back of the cover of the eye's lens, not a clouding at the front of the lens
  and not a clouding of the whole lens.
examples:
- The doctor found a posterior subcapsular cataract in her left eye.
