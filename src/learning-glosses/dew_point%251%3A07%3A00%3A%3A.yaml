simpleMeaning: The warmth of the air at which the water in it can no longer stay as gas and starts to
  turn to liquid
scope: This is the warmth of the air at which the water in it starts to turn to liquid, not the point
  at which water freezes and not the hottest part of the day.
examples:
- When the air cools to the dew point, mist forms on the grass.
- The dew point tonight is close to the air warmth, so fog is likely.
