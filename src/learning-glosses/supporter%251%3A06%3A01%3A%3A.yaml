simpleMeaning: A piece of clothing that holds a man's private parts in place when he takes hard exercise.
scope: A piece of clothing worn by men for hard exercise, not a band worn to hold up a stocking, and not
  a person who backs a team, gives what is needed for a job, or stands up for a cause.
examples:
- He wore a supporter for the long run.
- The coach told the players to wear supporters during hard training.
