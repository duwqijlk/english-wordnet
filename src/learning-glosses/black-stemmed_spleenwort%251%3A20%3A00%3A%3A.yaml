simpleMeaning: This fern of warm America grows from the south of the United States to the West Indies
  and from Mexico to Brazil.
scope: This fern of warm America grows from the south of the United States to Brazil, and black-stem spleenwort
  and little ebony spleenwort are other names for this sense.
examples:
- A black-stemmed spleenwort grew in the West Indies.
- We saw a black-stemmed spleenwort in Mexico.
