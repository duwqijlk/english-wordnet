simpleMeaning: In electronics, the part of a transistor through which the main flow of tiny charged bits
  leaves the space between its two other parts
scope: In electronics, a part of a transistor, not a person who gets money owed and not a person who gathers
  things.
examples:
- The collector of the transistor was wired to the power supply.
- Current leaves the transistor through the collector.
