simpleMeaning: Believed or claimed to be true, but resting mainly on guesswork instead of solid proof.
scope: A belief or claim held without solid proof and based mostly on guesswork; not something required
  or ordered, and not something merely mistaken or doubtful.
examples:
- The supposed reason for his absence was never backed by any evidence.
- These supposed health benefits have never been proved.
