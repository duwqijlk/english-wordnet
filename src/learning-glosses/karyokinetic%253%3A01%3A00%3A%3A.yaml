simpleMeaning: When a cell divides, this word is about the splitting of its middle part
scope: To do with the splitting of a cell's middle part, not the middle part itself and not the breaking
  apart of that part when a cell dies.
examples:
- The karyokinetic stage of cell division begins when the middle part of the cell starts to split.
- Scientists study karyokinetic activity to learn how cells divide.
