simpleMeaning: a copy of a person, made to seem much more than the person is in real life, to make people
  laugh
scope: Also called imitation and caricature. This is a funny copy of a real person, not a true, exact
  copy and not just dressing up as someone.
examples:
- His impersonation of the teacher made the whole class laugh.
- She did a funny impersonation of the famous singer.
