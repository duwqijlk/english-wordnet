simpleMeaning: A stew of meat, vegetables and hard ship's biscuit, eaten by sailors
scope: A stew of meat, vegetables and hard ship's biscuit eaten by sailors, also called lobscouse or lobscuse;
  not a plain meat stew and not a soup.
examples:
- The sailors ate scouse from the big pot.
- She made scouse with meat, vegetables and hard biscuit.
