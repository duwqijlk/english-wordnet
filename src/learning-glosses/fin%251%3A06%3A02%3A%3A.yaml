simpleMeaning: A swimming shoe with a paddle-like front that helps you move through water, especially
  below the surface.
scope: This is the swimming shoe, not a fish's body part, a car ornament, or a window slat.
examples:
- She pulled on her fins before diving into the pool.
- The rubber fins made the long swim much easier.
