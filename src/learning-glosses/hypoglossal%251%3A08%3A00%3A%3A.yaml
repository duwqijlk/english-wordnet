simpleMeaning: a nerve that carries orders to the muscles inside the tongue and to the other muscles of
  the tongue
scope: A nerve that carries orders to the muscles of the tongue; hypoglossal nerve, nervus hypoglosus
  and twelfth cranial nerve are other names for this sense, not a muscle itself and not a nerve of the
  face.
examples:
- The hypoglossal sends signals to the tongue muscles.
- Damage to the hypoglossal makes speech hard.
