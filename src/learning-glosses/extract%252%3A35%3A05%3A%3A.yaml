simpleMeaning: to get something out of a substance, as by pressing or squeezing it
scope: 'Also called express: this means getting something out by pressing, not the liquid made by soaking,
  and not working out a meaning from facts.'
examples:
- Workers extract oil from olives by pressing them.
- This machine extracts juice from oranges.
