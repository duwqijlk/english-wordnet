simpleMeaning: A senior church leader with religious and administrative authority, appointed to oversee
  clergy and, in some churches, seen as a successor of the Apostles.
scope: A high-ranking Christian church leader, not the chess piece or the mulled wine drink.
examples:
- The bishop visited every parish in the diocese that spring.
- She was appointed bishop of the northern diocese last year.
