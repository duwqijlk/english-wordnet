scope: This is a small night animal of the Old World, covered with hair and with spines that guard it;
  hedgehog and Erinaceus europaeus are other names for this sense, and its nearest rival is the porcupine.
examples:
- Erinaceus europeaeus comes out at night to look for food.
- Erinaceus europeaeus is covered with hair and protective spines.
