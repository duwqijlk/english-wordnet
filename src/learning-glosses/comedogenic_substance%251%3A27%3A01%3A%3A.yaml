simpleMeaning: Something that tends to bring on spots, as when it blocks the tiny holes in the skin
scope: A substance that tends to bring on spots, as when it blocks the tiny holes in the skin; comedogen
  and comedogenic are other names for this sense, not a spot itself and not a wash for spots.
examples:
- Coconut oil is a comedogenic substance that can bring on spots.
- She avoided any comedogenic substance in her creams.
