simpleMeaning: A white-flowered herb of Europe and Asia, widely grown for food for farm animals and to
  keep soil from washing away.
scope: A white-flowered herb grown for animal food and to hold the soil, also called the field lupine,
  the white lupine, the wolf bean and Lupinus albus; not a tree and not a herb grown only for its flowers.
examples:
- Egyptian lupine grew in the field for animal food.
- Farmers plant Egyptian lupine to hold the soil.
