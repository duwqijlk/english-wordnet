simpleMeaning: the tough protective layer that trees and other woody plants have on their woody stems
  and roots.
scope: This names the protective tree material, not the dog-like noise or the leather-making process that
  uses it.
examples:
- The bark of the old oak was rough and deeply cracked.
- He peeled a strip of bark from the birch branch.
