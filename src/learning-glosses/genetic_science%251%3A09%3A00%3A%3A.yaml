simpleMeaning: The part of the study of living things that looks at heredity and how living things differ.
scope: This is the part of the study of living things that looks at heredity and how living things differ;
  genetics is another name for this sense, not the study of lifeless matter and not the study of rocks.
examples:
- Genetic science explains why children look like their parents.
- She studied genetic science at university.
