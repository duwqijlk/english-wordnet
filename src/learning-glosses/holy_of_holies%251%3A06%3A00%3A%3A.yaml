simpleMeaning: In Judaism, the deepest and most sacred room of the Tabernacle in the temple of Solomon,
  where the Ark of the Covenant was kept
scope: 'Also called sanctum sanctorum: the deepest and most sacred room of the Tabernacle in the temple
  of Solomon, not any holy place in general.'
examples:
- Only the high priest could enter the holy of holies once a year.
- The holy of holies held the Ark of the Covenant in the temple of Solomon.
