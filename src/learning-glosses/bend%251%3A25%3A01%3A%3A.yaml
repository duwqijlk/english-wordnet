simpleMeaning: a shape that has a corner or a round turn, made by folding
scope: 'Also called fold: this is the shape made when something is folded. It is not a curved part of
  a road and not the act of leaning forward.'
examples:
- There is a bend in the napkin where it was folded.
- The bend of his elbow has a rounded shape.
