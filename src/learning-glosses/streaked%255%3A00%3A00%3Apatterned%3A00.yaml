simpleMeaning: marked with long thin lines or long thin areas of changed color, or seeming to have such
  lines or areas
scope: Having long thin lines or areas of different color, not covered in round spots and not all one
  plain color with no marks.
examples:
- Her hair was streaked with grey.
- The window was streaked with dirt after the rain.
