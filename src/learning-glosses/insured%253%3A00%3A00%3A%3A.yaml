simpleMeaning: protected by an agreement that pays money when loss, harm, or damage happens
scope: This describes a person or thing that is protected in this way; it is not the noun, which is the
  name for a person who holds such an agreement.
examples:
- All members of the film cast and crew are insured.
- The house is fully insured against fire.
