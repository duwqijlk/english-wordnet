simpleMeaning: A private firm that keeps files on how people borrow and pay, and gives that information
  to approved users for a fee.
scope: This is a firm that holds borrowing records, not a bank or a lender.
examples:
- The credit bureau sent us a copy of the file.
- Lenders ask the credit bureau before they lend money.
