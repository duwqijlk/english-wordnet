senseId: 'modulus%1:23:02::'
synsetId: 13757762-n
simpleMeaning: The gap between two whole numbers can be split by this whole number, with nothing left
  over
scope: This whole number can split the gap between two other whole numbers with nothing left over, not
  a number that measures how much of a property a substance has.
examples:
- 2 is a modulus of 5 and 9.
- In this sum, 3 is a modulus of 7 and 10.
