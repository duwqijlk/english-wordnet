simpleMeaning: the taking in of a gamma ray by a nucleus that matches the one that sent the ray out
scope: The taking in of a gamma ray by a matching nucleus, not the splitting of a nucleus and not the
  giving out of a gamma ray.
examples:
- Nuclear resonance takes place when a nucleus takes in a gamma ray from a matching nucleus.
- The team used nuclear resonance to study the nuclei in the sample.
