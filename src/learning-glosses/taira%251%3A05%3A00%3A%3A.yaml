simpleMeaning: a long-tailed animal of the weasel family that lives in trees in Central America and South
  America
scope: This is a long-tailed tree animal of the weasel family in Central and South America; tayra is another
  name for this sense, and it is not a ground weasel or a monkey.
examples:
- We saw a taira move along the high branches in the forest.
- The taira hunts in the trees of Central America.
