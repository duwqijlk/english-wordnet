simpleMeaning: With small white flowers, this low herb that lives many years grows in thick tufts in Turkey,
  used to cover dry ground, and sometimes put in the Matricaria group.
scope: This Turkey herb grows in thick tufts and covers dry ground, not the mat-forming kind of Asia Minor.
examples:
- The turfing daisy covered the dry bank with small white flowers.
- Turfing daisy grows in thick tufts.
