simpleMeaning: Under the ground in south-west Europe grow wild several much-loved fungi of the group called
  Tuber that can be eaten.
scope: Also called truffle and earthnut; it is a fungus that grows under the ground, not a mushroom that
  grows above it.
examples:
- The chef shaved an earth-ball over the pasta.
- Earth-balls grow wild in the woods of south-west Europe.
