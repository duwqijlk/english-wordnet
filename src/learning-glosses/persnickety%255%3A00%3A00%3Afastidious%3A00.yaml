simpleMeaning: Said of a person who gives too much care to small unimportant details and is far too exact
scope: 'Also called pernickety: said of a person who is far too exact over small details, not a person
  who is merely careful and not a proud or stuck-up person.'
examples:
- It was a persnickety job, checking every comma twice.
- Her persnickety teacher marked every tiny error.
