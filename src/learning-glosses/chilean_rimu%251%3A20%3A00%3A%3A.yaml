simpleMeaning: A low flat-growing bush, close kin to its mountain cousin, among the toughest of its cone-bearing
  family; found in the mountains of south Chile.
scope: Also called Lepidothamnus fonkii, this is a low bush of the southern mountains, not the mountain
  rimu it resembles.
examples:
- The Chilean rimu spreads low across the rocky slope.
- Gardeners value the Chilean rimu for its toughness in cold mountains.
