simpleMeaning: A calming drug (sold as Ativan) used to treat worry, strain and sleeplessness.
scope: A calming drug sold as Ativan, used for worry, strain and sleeplessness; not a sleeping pill used
  only for sleep and not a drug for low mood.
examples:
- The doctor gave her lorazepam for her anxiety.
- He took lorazepam the night before the operation to help him sleep.
