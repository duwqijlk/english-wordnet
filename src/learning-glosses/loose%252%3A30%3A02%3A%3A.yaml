senseId: 'loose%2:30:02::'
synsetId: 00420328-v
simpleMeaning: To take the tightness out of something, or to make it less taut.
scope: This is the transitive act of easing tightness in something, also called loosen, not a thing becoming
  less tight by itself and not the adjective for something not tight.
examples:
- She loosed the rope and the sail came down.
- He loosed the screw slightly so the bracket could slide.
