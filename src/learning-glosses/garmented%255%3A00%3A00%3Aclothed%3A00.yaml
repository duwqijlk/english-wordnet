simpleMeaning: Often used together with another word, it means a person is wearing clothes, most often
  fine ones
scope: 'Another name for this sense is appareled, attired, dressed, garbed, habilimented, or robed: wearing
  clothes, most often fine ones, not just wearing any clothes and not being naked.'
examples:
- The monks went about oddly garmented in hooded robes.
- She arrived elegantly garmented for the evening.
