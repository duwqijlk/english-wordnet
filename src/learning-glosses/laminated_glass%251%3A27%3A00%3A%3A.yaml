simpleMeaning: Two clear hard sheets joined with thin layers of plastic or resin or other stuff between
  them, so they do not break into pieces.
scope: Two clear hard sheets with plastic or resin layers between them, made so they do not break into
  pieces; not a single plain sheet of the same stuff.
examples:
- The car windscreen was made of laminated glass.
- Laminated glass holds together when it cracks.
