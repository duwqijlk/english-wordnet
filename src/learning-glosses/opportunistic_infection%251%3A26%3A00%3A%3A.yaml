senseId: 'opportunistic_infection%1:26:00::'
synsetId: 14201964-n
simpleMeaning: An infection by a germ that does not normally make healthy people ill, appearing when the
  immune system is weakened, as in AIDS or after a transplant.
scope: An infection that only takes hold because the body's defences are weakened, not an ordinary illness
  caught by someone healthy.
examples:
- Patients recovering from a transplant are watched closely for any opportunistic infection.
- AIDS leaves people open to an opportunistic infection that a healthy body would shrug off.
