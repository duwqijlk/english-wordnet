simpleMeaning: A small amount of fluid and cells from the surface of the neck of the womb and the womb,
  looked at under a microscope to find any unhealthy cells
scope: 'Also called cervical smear and Papanicolaou smear: a test in which a small amount of fluid and
  cells from the neck of the womb is looked at under a microscope to find unhealthy cells.'
examples:
- The nurse took a Pap smear to check the cells of her cervix.
- Her Pap smear showed no unhealthy cells.
