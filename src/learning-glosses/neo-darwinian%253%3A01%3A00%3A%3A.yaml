senseId: 'neo-darwinian%3:01:00::'
synsetId: 03025239-a
simpleMeaning: Of or about Darwin's ideas as changed by what is now known about genes
scope: Of Darwin's ideas as changed by new work on genes; not Darwin's first ideas left unchanged, and
  not a new idea with nothing to do with Darwin.
examples:
- Neo-Darwinian theories explain how genes change over time.
- She took a neo-Darwinian view of how new kinds of life come to be.
