simpleMeaning: The set of dates set up by the first French Republic in 1793 and dropped in 1805, counted
  from Sept. 22, 1792.
scope: A set of dates set up by the first French Republic in 1793, not the older set of dates it replaced
  and not the set of dates used today.
examples:
- The Revolutionary calendar began its count on September 22, 1792.
- France dropped the Revolutionary calendar in 1805.
