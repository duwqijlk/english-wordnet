simpleMeaning: how someone feels emotionally, whether cheerful or low
scope: This is a person's emotional condition, cheerful or low, not the mood of a place or group and not
  a supernatural being.
examples:
- Her spirits lifted when the exam results arrived.
- He was in low spirits for days after the defeat.
