simpleMeaning: to serve as proof of something; to supply evidence for it
scope: This is serving as proof of something, not giving testimony in court, and not the noun for the
  facts that prove a claim.
examples:
- The photographs evidence the damage caused by the storm.
- Her diary evidences the strain she was under.
