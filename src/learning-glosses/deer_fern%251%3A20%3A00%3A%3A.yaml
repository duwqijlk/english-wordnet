simpleMeaning: Often grown for wild animals to browse on, this plant from Europe and the west of North
  America has straight fronds.
scope: This plant from Europe and the west of North America has straight fronds and is often grown for
  wild animals to browse on.
examples:
- The deer fern has straight fronds and grows in Europe and western North America.
- The deer fern is often grown for wild animals to browse on.
