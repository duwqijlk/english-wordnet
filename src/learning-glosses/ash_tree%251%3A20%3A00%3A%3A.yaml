simpleMeaning: With feather-like leaves, this tree of the Fraxinus group loses its leaves and is one of
  many kinds grown for its looks or its wood
scope: This tree is also called ash, and it is one of many kinds that lose their leaves, not a tree that
  keeps its leaves all year.
examples:
- The ash tree lost its leaves in the fall.
- They planted an ash tree.
