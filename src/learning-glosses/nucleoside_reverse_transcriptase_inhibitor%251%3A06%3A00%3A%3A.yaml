simpleMeaning: a virus-fighting drug against HIV that joins the virus's DNA and stops the build, leaving
  unfinished DNA that cannot make a new virus, often used with other drugs
scope: A drug that joins the virus's DNA and stops it being built, not a non-nucleoside reverse transcriptase
  inhibitor, which fastens straight onto reverse transcriptase, and not a drug that kills the virus outright.
examples:
- The doctor gave him a nucleoside reverse transcriptase inhibitor as part of his HIV drugs.
- This nucleoside reverse transcriptase inhibitor joins the virus's DNA and stops it being built.
