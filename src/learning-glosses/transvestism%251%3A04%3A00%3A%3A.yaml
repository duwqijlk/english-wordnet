simpleMeaning: Wearing the clothes of the other sex, or acting or taking the sexual role of the other
  sex, as a regular part of life
scope: Wearing the clothes of the other sex or acting in its role as a regular part of life; cross dressing
  and transvestitism are other names for this sense. Not a change of sex and not a costume for a stage
  show.
examples:
- He kept his transvestism private, wearing women's clothes only at home.
- Her transvestism meant she dressed as a man when she went out to work.
