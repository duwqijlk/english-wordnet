simpleMeaning: a poem form made of 14 lines, with a set pattern for which line endings sound alike
scope: A poem form with 14 lines; not the acts of writing such a poem or of praising someone in one.
examples:
- She wrote a sonnet of 14 lines about the sea.
- His sonnet follows a set pattern of sounds at the ends of its lines.
