simpleMeaning: a very high sound that is like a person crying out loudly
scope: 'Also called scream, screaming, shriek, screech, and screeching: a very high noise like a person''s
  cry, not the act of crying out sharply itself.'
examples:
- The shrieking of the brakes filled the street as the bus stopped.
- We heard the shrieking of shells passing over us.
