simpleMeaning: These small crawling insects never settle in one place, roaming warm lands and feeding
  above all on other insects.
scope: Also called driver ant and legionary ant, this small crawling insect of warm lands is one that
  never settles, roaming and feeding above all on other insects.
examples:
- An army ant column crossed the path in search of food.
- An army ant seized a small insect and dragged it away.
