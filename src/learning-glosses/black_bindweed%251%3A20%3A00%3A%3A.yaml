simpleMeaning: It winds round other plants in Europe, a common climber with thick roots, heart-shaped
  leaves and red berries.
scope: People also call it black bryony, and it is a common European climber that winds round other plants.
examples:
- We found black bindweed winding round the other plants.
- Black bindweed was already climbing in the garden.
