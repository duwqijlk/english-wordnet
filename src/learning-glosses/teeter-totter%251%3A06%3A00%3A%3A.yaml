simpleMeaning: a long flat piece set on a middle support, with a child at each end who goes up and down
scope: 'Also called teeter, seesaw, dandle board, teeterboard, teetertotter, and tilting board: a board
  that children ride up and down, not a swing and not a slide.'
examples:
- The children took turns on the teeter-totter in the park.
- She sat on one end of the teeter-totter while her brother sat on the other.
