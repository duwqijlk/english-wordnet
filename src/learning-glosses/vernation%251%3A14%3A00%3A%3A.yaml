simpleMeaning: In botany, the way young leaves are set inside a leaf bud before it opens
scope: The way young leaves sit inside a bud before it opens, not the shape of a grown leaf and not the
  way a flower opens.
examples:
- The vernation of the fern showed how the young leaves lay inside the bud.
- Botanists study vernation to see how leaves sit inside a bud before they open.
