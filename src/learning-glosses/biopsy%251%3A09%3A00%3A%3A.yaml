simpleMeaning: a medical test that looks closely at tissue (soft body material) or liquid from a living
  body to find if a disease is there or what caused it
scope: This is a test of body tissue or liquid to look for disease, not a cure and not treatment for a
  disease.
examples:
- The biopsy showed that the lump was not cancer.
- Doctors did a biopsy to find out why she was ill.
