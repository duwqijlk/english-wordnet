simpleMeaning: Mending buildings and antique furniture to make them look good again is the paid work of
  this trained worker.
scope: It is also called preserver, restorer, and refinisher, and it is a trained worker paid to mend
  buildings and antique furniture.
examples:
- A renovator was called in to mend the building.
- The antique chairs looked good again after the renovator worked on them.
