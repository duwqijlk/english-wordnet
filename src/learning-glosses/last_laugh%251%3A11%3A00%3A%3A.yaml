schema: oewn-learning-gloss-v2
senseId: 'last_laugh%1:11:00::'
synsetId: 07489458-n
simpleMeaning: The final win that comes after nearly losing, as the saying goes that the one who smiles
  at the end smiles best.
scope: The final win that comes after nearly losing; not a win that comes easily, and not a joke told
  at the end of a party.
examples:
- We had the last laugh after the votes were counted.
- She got the last laugh when her plan worked after all.
