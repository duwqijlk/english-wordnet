simpleMeaning: the person a court that deals with wills picks to share out the things and money of someone
  who dies without a will or without naming someone to do it
scope: The person a wills court picks to share out the things and money of someone who died without a
  will or without naming someone to do it; not a person who runs a business.
examples:
- The administrator shared out the old man's goods among his children.
- The court named her administrator of the estate.
