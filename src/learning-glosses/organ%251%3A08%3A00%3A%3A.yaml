simpleMeaning: a complete part of an animal's body, with its own shape and work, that does one special
  job
scope: This is a body part in an animal, not a music instrument with pipes, not an electric music instrument,
  and not a small instrument with reeds.
examples:
- The heart is an organ that pumps blood.
- The liver is an important organ in the body.
