simpleMeaning: A speech sound that is usually said for a bit more time than other speech sounds, most
  often about one and a half to two times as much
scope: A speech sound that is usually said for a bit more time than other speech sounds, not a short speech
  sound and not a consonant.
examples:
- The 'a' in 'father' is a long vowel.
- In 'feet', the vowel is a long vowel.
