simpleMeaning: To strike an object with great force through a sideways sweep of a bat.
scope: This is a hard sideways bat swing, not the broader sense of making something move fast by striking
  or throwing it, not the golf stroke made with a driver from a tee, not pushing or propelling something
  with steady force, not operating a vehicle, not compelling a person to act, and not the noun senses
  such as a golf shot or a computer storage device.
examples:
- She drove the ball past third base with a level swing of the bat.
- The batter drove the pitch into the gap with a hard, flat swing.
